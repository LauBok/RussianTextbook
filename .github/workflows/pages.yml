name: Pages
on:
  push:
    branches: [main]
    paths: ["audio/**", "dist/**", "lessons/**", "tools/site.py", "tools/words.py", "words/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pymorphy3
      - run: python tools/site.py
      - run: python tools/words.py
      - name: Assemble site
        run: |
          mkdir -p _site/dist
          cp site/index.html _site/
          cp -r site/words _site/
          cp -r audio _site/
          cp dist/*.pdf _site/dist/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
