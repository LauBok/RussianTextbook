<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>俄语背单词</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="俄语单词">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#8a2b2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root { --paper:#fbf8f3; --ink:#1f1f1f; --muted:#6b6b6b; --accent:#8a2b2b; --rule:#e3dbd0; --card:#fff;
  --again:#b5473a; --hard:#b8862b; --good:#3f7d4a; }
@media (prefers-color-scheme: dark) { :root { --paper:#18181a; --ink:#ece8e2; --muted:#a29d96; --accent:#e09088; --rule:#36322f; --card:#232226;
  --again:#d0675a; --hard:#d2a54a; --good:#68a872; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; background:var(--paper); color:var(--ink); }
body { font:16px/1.5 -apple-system, "PT Sans", "PingFang SC", "Noto Sans SC", sans-serif;
  padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom)); min-height:100vh; }
main { max-width:560px; margin:0 auto; padding:16px; }
h1 { font-size:22px; margin:8px 0 4px; } h2 { font-size:17px; margin:20px 0 8px; }
.muted { color:var(--muted); font-size:14px; }
button { font:inherit; border:none; border-radius:12px; padding:12px 16px; cursor:pointer; }
.primary { background:var(--accent); color:#fff; font-weight:700; width:100%; font-size:18px; padding:14px; }
.ghost { background:transparent; color:var(--accent); border:1px solid var(--rule); }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
.stat { background:var(--card); border:1px solid var(--rule); border-radius:14px; padding:12px 8px; text-align:center; }
.stat b { display:block; font-size:26px; } .stat span { color:var(--muted); font-size:13px; }
nav.tabs { position:fixed; left:0; right:0; bottom:0; display:flex; background:var(--card); border-top:1px solid var(--rule);
  padding-bottom:env(safe-area-inset-bottom); z-index:5; }
nav.tabs button { flex:1; background:none; border-radius:0; color:var(--muted); font-size:13px; padding:10px 0 12px; }
nav.tabs button.on { color:var(--accent); font-weight:700; }
.unit { background:var(--card); border:1px solid var(--rule); border-radius:14px; margin:10px 0; overflow:hidden; }
.unit-head { display:flex; align-items:center; gap:10px; padding:12px 14px; font-weight:700; }
.unit-head .count { margin-left:auto; color:var(--muted); font-weight:400; font-size:13px; }
.lesson { display:flex; align-items:center; gap:10px; padding:10px 14px; border-top:1px solid var(--rule); }
.lesson .t { flex:1; } .lesson .t small { display:block; color:var(--muted); }
.lesson .bar { width:56px; height:6px; background:var(--rule); border-radius:3px; overflow:hidden; }
.lesson .bar i { display:block; height:100%; background:var(--good); }
input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); }
/* 卡片 */
.study-top { display:flex; align-items:center; gap:10px; }
.progress { flex:1; height:6px; background:var(--rule); border-radius:3px; overflow:hidden; }
.progress i { display:block; height:100%; background:var(--accent); transition:width .2s; }
.card { background:var(--card); border:1px solid var(--rule); border-radius:18px; margin:14px 0; padding:28px 18px 22px;
  min-height:46vh; display:flex; flex-direction:column; align-items:center; text-align:center; }
.card .tag { font-size:12px; color:var(--muted); align-self:flex-start; }
.card .ru { font:600 34px/1.25 "PT Serif", Georgia, serif; margin:28px 0 6px; word-break:break-word; }
.card .zh { font-size:24px; margin:28px 0 6px; }
.card .play { background:none; color:var(--accent); font-size:15px; padding:6px 10px; }
.card .answer { border-top:1px dashed var(--rule); margin-top:18px; padding-top:16px; width:100%; }
.card .answer .zh2 { font-size:20px; } .card .answer .ru2 { font:600 28px "PT Serif", Georgia, serif; }
.card .pos { color:var(--muted); font-size:14px; margin-top:4px; }
.card .ex { margin-top:14px; text-align:left; background:var(--paper); border-radius:10px; padding:10px 12px; }
.card .ex .r { font-family:"PT Serif", Georgia, serif; font-size:17px; } .card .ex .z { color:var(--muted); font-size:14px; }
.grade { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.grade button { color:#fff; font-weight:700; padding:14px 4px; } .grade small { display:block; font-weight:400; opacity:.85; font-size:12px; }
.g-again { background:var(--again); } .g-hard { background:var(--hard); } .g-good { background:var(--good); }
.star { background:none; font-size:22px; padding:0 4px; color:var(--muted); } .star.on { color:var(--hard); }
.list-item { display:flex; align-items:baseline; gap:10px; padding:9px 2px; border-bottom:1px solid var(--rule); }
.list-item .w { font-family:"PT Serif", Georgia, serif; font-size:17px; min-width:40%; }
.list-item .g { flex:1; color:var(--muted); font-size:14px; }
.dot { width:9px; height:9px; border-radius:50%; flex:none; align-self:center; }
.row { display:flex; gap:8px; align-items:center; margin:10px 0; }
select, textarea { font:inherit; padding:8px; border-radius:10px; border:1px solid var(--rule); background:var(--card); color:var(--ink); }
textarea { width:100%; height:90px; font-size:12px; }
.done { text-align:center; padding:40px 0; } .done b { font-size:40px; display:block; }
.hidden { display:none !important; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home">今日</button>
  <button data-tab="lessons">选课</button>
  <button data-tab="list">单词表</button>
  <button data-tab="settings">设置</button>
</nav>
<script>
"use strict";
const KEY = "ruwords-v1", DAY = 86400000, MIN = 60000;
const $ = s => document.querySelector(s);
let DATA = null, BY = {}, S = load(), view = "home", session = null;

function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  return Object.assign({ sel: [], newPerDay: 15, cards: {}, star: {}, day: "", newToday: 0, doneToday: 0 }, s || {});
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function today() { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function rollDay() { if (S.day !== today()) { S.day = today(); S.newToday = 0; S.doneToday = 0; save(); } }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

// 每个词两张卡：r = 看俄语想意思，p = 看中文想俄语；p 卡在 r 卡第一次记住后才出现
function cardsOf(words) {
  const out = [];
  for (const w of words) {
    out.push(w.id + ":r");
    const r = S.cards[w.id + ":r"];
    if (r && r.ivl >= 1) out.push(w.id + ":p");
  }
  return out;
}
function selectedWords() { const set = new Set(S.sel); return DATA.words.filter(w => set.has(w.lesson)); }
function counts() {
  const now = Date.now(), cs = cardsOf(selectedWords());
  let due = 0, fresh = 0, learned = 0;
  for (const c of cs) {
    const st = S.cards[c];
    if (!st) { if (c.endsWith(":r")) fresh++; }
    else { if (st.due <= now) due++; if (st.ivl >= 7) learned++; }
  }
  return { due, fresh, learned, newLeft: Math.max(0, S.newPerDay - S.newToday) };
}

function buildSession() {
  const now = Date.now(), cs = cardsOf(selectedWords());
  const due = cs.filter(c => S.cards[c] && S.cards[c].due <= now).sort((a, b) => S.cards[a].due - S.cards[b].due);
  const newLeft = Math.max(0, S.newPerDay - S.newToday);
  const fresh = cs.filter(c => !S.cards[c] && c.endsWith(":r")).slice(0, newLeft);
  // 新词穿插在复习里
  const q = due.slice();
  fresh.forEach((c, i) => q.splice(Math.min(q.length, i * 3 + 1), 0, c));
  return { queue: q, total: q.length, done: 0, shown: false };
}
function starSession() {
  const q = Object.keys(S.star).filter(id => BY[id]).map(id => id + ":r");
  return { queue: q, total: q.length, done: 0, shown: false, practice: true };
}

function grade(card, g) {
  const now = Date.now();
  const st = S.cards[card] || { ivl: 0, ease: 2.5, reps: 0, lapses: 0, due: now };
  if (!S.cards[card] && card.endsWith(":r")) S.newToday++;
  if (g === 0) { st.lapses++; st.ivl = 0; st.ease = Math.max(1.3, st.ease - 0.2); st.due = now + 10 * MIN; }
  else if (g === 1) { st.ivl = st.ivl < 1 ? 1 : Math.max(st.ivl + 1, st.ivl * 1.2); st.ease = Math.max(1.3, st.ease - 0.15); st.due = now + st.ivl * DAY; }
  else { st.ivl = st.ivl < 1 ? (st.reps ? 1 : 2) : st.ivl < 3 ? 4 : Math.round(st.ivl * st.ease); st.ease = Math.min(3, st.ease + 0.05); st.due = now + st.ivl * DAY; }
  st.reps++;
  S.cards[card] = st; S.doneToday++; save();
  return st;
}
function nextLabel(card, g) {
  const st = S.cards[card] || { ivl: 0, ease: 2.5, reps: 0 };
  if (g === 0) return "10 分钟";
  const ivl = g === 1 ? (st.ivl < 1 ? 1 : Math.max(st.ivl + 1, st.ivl * 1.2)) : (st.ivl < 1 ? (st.reps ? 1 : 2) : st.ivl < 3 ? 4 : Math.round(st.ivl * st.ease));
  const d = Math.round(ivl);
  return d >= 30 ? Math.round(d / 30) + " 个月" : d + " 天";
}

let audio = null;
function play(w) {
  if (!w.audio) return;
  try { if (audio) audio.pause(); audio = new Audio("../" + w.audio); audio.play().catch(() => {}); } catch (e) {}
}

function render() {
  rollDay();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === view));
  $("#tabs").classList.toggle("hidden", view === "study");
  ({ home, lessons, list, settings, study })[view]();
  window.scrollTo(0, 0);
}

function home() {
  const c = counts(), total = c.due + Math.min(c.fresh, c.newLeft);
  $("#app").innerHTML = `<h1>俄语背单词</h1><div class="muted">《俄语教程》第一册 · 已选 ${S.sel.length} 课</div>
    <div class="stats"><div class="stat"><b>${c.due}</b><span>待复习</span></div>
      <div class="stat"><b>${Math.min(c.fresh, c.newLeft)}</b><span>今日新词</span></div>
      <div class="stat"><b>${c.learned}</b><span>已掌握</span></div></div>
    ${S.sel.length ? (total ? `<button class="primary" id="go">开始（${total}）</button>`
      : `<div class="done"><b>✓</b>今天的任务完成了${S.doneToday ? `，共练了 ${S.doneToday} 次` : ""}。</div>`)
      : `<button class="primary" id="pick">先选要背的课</button>`}
    ${Object.keys(S.star).length ? `<p><button class="ghost" id="stars" style="width:100%">复习生词本（${Object.keys(S.star).length}）</button></p>` : ""}
    <p class="muted">每天打开练一次：先复习到期的词，再学新词。“不认识”的词十分钟后再出现；记住的词间隔越来越长（1 天、4 天、一周、一个月……）。</p>`;
  const go = $("#go"); if (go) go.onclick = () => { session = buildSession(); view = "study"; render(); };
  const pick = $("#pick"); if (pick) pick.onclick = () => { view = "lessons"; render(); };
  const st = $("#stars"); if (st) st.onclick = () => { session = starSession(); view = "study"; render(); };
}

function lessonProgress(code) {
  const ws = DATA.words.filter(w => w.lesson === code);
  const ok = ws.filter(w => (S.cards[w.id + ":r"] || {}).ivl >= 7).length;
  return [ok, ws.length];
}
function lessons() {
  const sel = new Set(S.sel);
  $("#app").innerHTML = `<h1>选课</h1><div class="muted">勾选要背的课，可以整个单元一起选。</div>` +
    DATA.units.map((u, i) => {
      const all = u.lessons.every(l => sel.has(l.code));
      return `<div class="unit"><label class="unit-head"><input type="checkbox" data-unit="${i}" ${all ? "checked" : ""}>${esc(u.unit)}
        <span class="count">${u.lessons.filter(l => sel.has(l.code)).length}/${u.lessons.length}</span></label>` +
        u.lessons.map(l => { const [ok, n] = lessonProgress(l.code);
          return `<label class="lesson"><input type="checkbox" data-code="${l.code}" ${sel.has(l.code) ? "checked" : ""}>
          <span class="t">第 ${+l.code.slice(1)} 课　${esc(l.title)}<small>${esc(l.subtitle)} · ${n} 词</small></span>
          <span class="bar" title="已掌握 ${ok}/${n}"><i style="width:${n ? 100 * ok / n : 0}%"></i></span></label>`; }).join("") + `</div>`;
    }).join("");
  document.querySelectorAll("[data-code]").forEach(cb => cb.onchange = () => {
    const s = new Set(S.sel); cb.checked ? s.add(cb.dataset.code) : s.delete(cb.dataset.code);
    S.sel = DATA.units.flatMap(u => u.lessons.map(l => l.code)).filter(c => s.has(c)); save(); lessons();
  });
  document.querySelectorAll("[data-unit]").forEach(cb => cb.onchange = () => {
    const s = new Set(S.sel), u = DATA.units[cb.dataset.unit];
    u.lessons.forEach(l => cb.checked ? s.add(l.code) : s.delete(l.code));
    S.sel = DATA.units.flatMap(u => u.lessons.map(l => l.code)).filter(c => s.has(c)); save(); lessons();
  });
}

function list() {
  const codes = DATA.units.flatMap(u => u.lessons.map(l => l.code));
  const cur = S.listLesson && codes.includes(S.listLesson) ? S.listLesson : (S.sel[0] || codes[0]);
  const ws = DATA.words.filter(w => w.lesson === cur);
  const color = w => { const st = S.cards[w.id + ":r"]; return !st ? "var(--rule)" : st.ivl >= 7 ? "var(--good)" : st.lapses > 1 ? "var(--again)" : "var(--hard)"; };
  $("#app").innerHTML = `<h1>单词表</h1><div class="row"><select id="ls">${codes.map(c => `<option ${c === cur ? "selected" : ""}>${c}</option>`).join("")}</select>
    <span class="muted">● 绿：已掌握　黄：学习中　红：常忘　灰：没学</span></div>` +
    ws.map(w => `<div class="list-item"><span class="dot" style="background:${color(w)}"></span>
      <span class="w" data-play="${w.id}">${esc(w.word)}</span><span class="g">${esc(w.gloss)}</span>
      <button class="star ${S.star[w.id] ? "on" : ""}" data-star="${w.id}">★</button></div>`).join("");
  $("#ls").onchange = e => { S.listLesson = e.target.value; save(); list(); };
  document.querySelectorAll("[data-play]").forEach(e => e.onclick = () => play(BY[e.dataset.play]));
  document.querySelectorAll("[data-star]").forEach(b => b.onclick = () => { toggleStar(b.dataset.star); list(); });
}
function toggleStar(id) { S.star[id] ? delete S.star[id] : (S.star[id] = 1); save(); }

function settings() {
  $("#app").innerHTML = `<h1>设置</h1>
    <div class="row">每天新词 <select id="np">${[5, 10, 15, 20, 30, 50].map(n => `<option ${n === S.newPerDay ? "selected" : ""}>${n}</option>`).join("")}</select> 个</div>
    <h2>换手机：导出 / 导入进度</h2>
    <p class="muted">进度只保存在这台手机的浏览器里。换手机前点“导出”，把这段文字发给自己；在新手机上粘贴后点“导入”。</p>
    <textarea id="io" placeholder="导出的进度会出现在这里"></textarea>
    <div class="row"><button class="ghost" id="ex">导出</button><button class="ghost" id="im">导入</button><button class="ghost" id="cp">复制</button></div>
    <h2>添加到主屏幕</h2>
    <p class="muted">iPhone：用 Safari 打开本页，点底部的“分享”按钮，选“添加到主屏幕”。之后从桌面图标打开，像普通应用一样全屏使用，没有网络也能背（发音在联网时听过一次后也能离线播放）。</p>
    <p class="muted">共 ${DATA.words.length} 个词，其中 ${DATA.words.filter(w => w.audio).length} 个有发音。</p>`;
  $("#np").onchange = e => { S.newPerDay = +e.target.value; save(); };
  $("#ex").onclick = () => { $("#io").value = btoa(unescape(encodeURIComponent(JSON.stringify(S)))); };
  $("#cp").onclick = () => { $("#io").select(); try { navigator.clipboard.writeText($("#io").value); } catch (e) { document.execCommand("copy"); } };
  $("#im").onclick = () => {
    try { const s = JSON.parse(decodeURIComponent(escape(atob($("#io").value.trim())))); if (!s.cards) throw 0;
      if (confirm("用导入的进度替换这台手机上的进度？")) { S = Object.assign(load(), s); save(); alert("导入成功"); render(); }
    } catch (e) { alert("这段文字不是有效的进度"); }
  };
}

function study() {
  const s = session;
  if (!s.queue.length) {
    $("#app").innerHTML = `<div class="done"><b>✓</b>${s.practice ? "生词本复习完了" : "今天的任务完成了"}<p class="muted">共练了 ${s.done} 次</p>
      <button class="primary" id="back">返回</button></div>`;
    $("#back").onclick = () => { view = "home"; render(); };
    return;
  }
  const card = s.queue[0], [id, dir] = card.split(":"), w = BY[id];
  const isNew = !S.cards[card];
  const ex = w.ex ? `<div class="ex"><div class="r">${esc(w.ex)}</div>${w.exZh ? `<div class="z">${esc(w.exZh)}</div>` : ""}</div>` : "";
  const front = dir === "r"
    ? `<div class="ru">${esc(w.word)}</div>${w.audio ? `<button class="play" id="pl">🔊 发音</button>` : ""}`
    : `<div class="zh">${esc(w.gloss)}</div><div class="muted">俄语怎么说？</div>`;
  const back = dir === "r"
    ? `<div class="zh2">${esc(w.gloss)}</div><div class="pos">${esc(w.pos)}</div>${ex}`
    : `<div class="ru2">${esc(w.word)}</div>${w.audio ? `<button class="play" id="pl2">🔊 发音</button>` : ""}<div class="pos">${esc(w.pos)}</div>${ex}`;
  $("#app").innerHTML = `<div class="study-top"><button class="ghost" id="quit">✕</button>
      <div class="progress"><i style="width:${100 * s.done / Math.max(1, s.done + s.queue.length)}%"></i></div>
      <span class="muted">${s.queue.length}</span>
      <button class="star ${S.star[id] ? "on" : ""}" id="st">★</button></div>
    <div class="card"><span class="tag">第 ${+w.lesson.slice(1)} 课${isNew && !s.practice ? " · 新词" : ""}</span>${front}
      <div class="answer ${s.shown ? "" : "hidden"}">${back}</div></div>
    ${s.shown ? (s.practice
        ? `<div class="grade" style="grid-template-columns:1fr 1fr"><button class="g-again" data-g="0">还要练</button><button class="g-good" data-g="2">记住了</button></div>`
        : `<div class="grade"><button class="g-again" data-g="0">不认识<small>${nextLabel(card, 0)}</small></button>
        <button class="g-hard" data-g="1">模糊<small>${nextLabel(card, 1)}</small></button>
        <button class="g-good" data-g="2">认识<small>${nextLabel(card, 2)}</small></button></div>`)
      : `<button class="primary" id="show">显示答案</button>`}`;
  $("#quit").onclick = () => { view = "home"; render(); };
  $("#st").onclick = () => { toggleStar(id); $("#st").classList.toggle("on"); };
  const pl = $("#pl"), pl2 = $("#pl2");
  if (pl) pl.onclick = () => play(w);
  if (pl2) pl2.onclick = () => play(w);
  if (!s.shown) $("#show").onclick = () => { s.shown = true; if (dir === "p") play(w); study(); };
  else document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
    const g = +b.dataset.g;
    s.queue.shift(); s.done++; s.shown = false;
    if (s.practice) { if (g === 0) s.queue.splice(Math.min(s.queue.length, 3), 0, card); }
    else {
      grade(card, g);
      if (g === 0) s.queue.splice(Math.min(s.queue.length, 4), 0, card);   // 不认识：几张卡之后再出
    }
    const nx = s.queue[0];
    if (nx && nx.endsWith(":r")) play(BY[nx.split(":")[0]]);
    study();
  });
}

document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { view = b.dataset.tab; render(); });
fetch("words.json").then(r => r.json()).then(d => {
  DATA = d; DATA.words.forEach(w => BY[w.id] = w);
  render();
}).catch(() => { $("#app").innerHTML = "<p>加载单词失败，请联网后重试。</p>"; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
