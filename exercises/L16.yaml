lesson: L16
grammar: "[быть]{.ru} 的过去时 [был, была́, бы́ло, бы́ли]{.ru}，按主语的性和数变化；[э́то]{.ru} 句中与名词一致；无主语句用 [бы́ло]{.ru}；否定 [не́ был, не была́, не́ было, не́ были]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [быть]{.ru} 的正确过去时形式。
    why: 过去时看主语的性和数：男性用 [был]{.ru}，女性用 [была́]{.ru}，中性名词用 [бы́ло]{.ru}，复数和 [вы]{.ru} 用 [бы́ли]{.ru}。第 3 题 [воскресе́нье]{.ru} 是中性；第 5 题老师用 [вы]{.ru} 称呼一个人，也要用 [бы́ли]{.ru}；第 6 题 [э́то]{.ru} 句里跟后面的 [о́пера]{.ru} 一致。
    items:
      - stem: Пьер ___ в музе́е.
        options: [был, была́, бы́ло, бы́ли]
        answer: был
      - stem: Ю́ми ___ в па́рке.
        options: [был, была́, бы́ло, бы́ли]
        answer: была́
      - stem: Вчера́ ___ воскресе́нье.
        options: [был, была́, бы́ло, бы́ли]
        answer: бы́ло
      - stem: А́нна и Ван Лэй ___ в теа́тре.
        options: [был, была́, бы́ло, бы́ли]
        answer: бы́ли
      - stem: Ван Лэй, где вы ___ вчера́?
        options: [был, была́, бы́ло, бы́ли]
        answer: бы́ли
      - stem: Э́то ___ о́пера.
        options: [был, была́, бы́ло, бы́ли]
        answer: была́
      - stem: В па́рке ___ хорошо́.
        options: [был, была́, бы́ло, бы́ли]
        answer: бы́ло

  - id: e2
    type: rewrite
    task: 把句子改成过去时，加上 [вчера́]{.ru}。
    placeholder: Вчера́ …
    example:
      cue: Па́па на рабо́те.
      answer: Вчера́ па́па был на рабо́те.
    why: 现在时不用系动词，过去时要加 [быть]{.ru}，并和主语一致。第 4 题的主语是 [бале́т]{.ru}，不是 [теа́тр]{.ru} 前的处所词，[быть]{.ru} 用阳性 [был]{.ru}；第 5 题无主语，用 [бы́ло]{.ru}。
    items:
      - cue: Ма́ма в поликли́нике.
        accept: ["Вчера́ ма́ма была́ в поликли́нике.", "Ма́ма вчера́ была́ в поликли́нике."]
      - cue: Мы в библиоте́ке.
        accept: ["Вчера́ мы бы́ли в библиоте́ке.", "Мы вчера́ бы́ли в библиоте́ке."]
      - cue: Ми́ша в шко́ле.
        accept: ["Вчера́ Ми́ша был в шко́ле.", "Ми́ша вчера́ был в шко́ле."]
      - cue: В теа́тре бале́т.
        accept: ["Вчера́ в теа́тре был бале́т.", "В теа́тре вчера́ был бале́т."]
      - cue: На уро́ке интере́сно.
        accept: ["Вчера́ на уро́ке бы́ло интере́сно.", "На уро́ке вчера́ бы́ло интере́сно."]
      - cue: Ю́ми и Пьер на экску́рсии.
        accept: ["Вчера́ Ю́ми и Пьер бы́ли на экску́рсии.", "Ю́ми и Пьер вчера́ бы́ли на экску́рсии."]

  - id: e3
    type: rewrite
    task: 按提示用否定句回答。
    placeholder: Нет, …
    example:
      cue: Ван Лэй был до́ма? (теа́тр)
      answer: Нет, он не́ был до́ма. Он был в теа́тре.
    why: 否定时 [не]{.ru} 放在 [был]{.ru} 前。[не́ был]{.ru}、[не́ было]{.ru}、[не́ были]{.ru} 重音移到 [не]{.ru} 上，[не была́]{.ru} 重音仍在 [ла́]{.ru .syl}。地点用 [в]{.ru} / [на]{.ru} + 第六格。
    items:
      - cue: Ю́ми была́ в музе́е? (парк)
        accept: ["Нет, она́ не была́ в музе́е. Она́ была́ в па́рке.", "Нет, она́ была́ в па́рке."]
      - cue: Пьер был в па́рке? (музе́й)
        accept: ["Нет, он не́ был в па́рке. Он был в музе́е.", "Нет, он был в музе́е."]
      - cue: О́льга Ви́кторовна была́ в теа́тре? (да́ча)
        accept: ["Нет, она́ не была́ в теа́тре. Она́ была́ на да́че.", "Нет, она́ была́ на да́че."]
      - cue: Ива́н Серге́евич и Мари́я Никола́евна бы́ли в теа́тре? (рабо́та)
        accept: ["Нет, они́ не́ были в теа́тре. Они́ бы́ли на рабо́те.", "Нет, они́ бы́ли на рабо́те."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：昨天是星期天；皮埃尔去了博物馆，由美去了公园，王磊和安娜去了剧院（大剧院）看《天鹅湖》，老师去了别墅。
    items:
      - stem: Вчера́ бы́ло ___.
        options: [воскресе́нье, у́тро]
        answer: воскресе́нье
      - stem: Пьер был ___.
        options: [в па́рке, в музе́е, в теа́тре]
        answer: в музе́е
      - stem: Ван Лэй и А́нна бы́ли ___.
        options: [до́ма, в теа́тре, на да́че]
        answer: в теа́тре
      - stem: О́льга Ви́кторовна была́ ___.
        options: [на да́че, в па́рке, в музе́е]
        answer: на да́че

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语说“去了某地”，俄语常说“在过某地”：[был в …]{.ru} + 第六格。
    items:
      - zh: 你昨天在哪儿？（问男生）——我去剧院了。
        accept: ["— Где ты был вчера́? — Я был в теа́тре.", "— Где ты был вчера́? — В теа́тре.", "— Где ты вчера́ был? — Я был в теа́тре.", "— Где ты вчера́ был? — В теа́тре."]
        rubric: ["问男生用 [был]{.ru}", "[в теа́тре]{.ru}：第六格"]
      - zh: 妈妈昨天去上班了。
        accept: ["Ма́ма вчера́ была́ на рабо́те.", "Вчера́ ма́ма была́ на рабо́те."]
        rubric: ["[была́]{.ru}：阴性，重音在词尾", "[на рабо́те]{.ru}"]
      - zh: 那是大剧院。
        accept: ["Э́то был Большо́й теа́тр."]
        rubric: ["[был]{.ru} 和 [теа́тр]{.ru} 一致，不和 [э́то]{.ru} 一致"]
      - zh: 博物馆里很有意思。
        accept: ["В музе́е бы́ло интере́сно.", "В музе́е бы́ло о́чень интере́сно."]
        rubric: ["无主语句用中性 [бы́ло]{.ru}", "[интере́сно]{.ru} 用副词形式"]
      - zh: 我们昨天没在家。
        accept: ["Мы не́ были до́ма вчера́.", "Вчера́ мы не́ были до́ма.", "Мы вчера́ не́ были до́ма."]
        rubric: ["[не́ были]{.ru}：重音在 [не]{.ru} 上", "“在家”用 [до́ма]{.ru}"]

  - id: e6
    type: open
    task: 用俄语写一段话。
    items:
      - prompt: 昨天是星期天。你和你的家人、朋友昨天都在哪儿？那里怎么样？
        length: 40–70
        model: "Вчера́ бы́ло воскресе́нье. Я не́ был до́ма. Я был в па́рке, а пото́м в музе́е. В музе́е бы́ло о́чень интере́сно. Ма́ма была́ на рабо́те, а па́па был до́ма. Мой друг Пьер и его́ подру́га бы́ли в теа́тре. Там был бале́т. Бале́т был о́чень краси́вый."
        rubric: ["[был, была́, бы́ли]{.ru} 和主语一致", "至少一次 [бы́ло]{.ru}（[бы́ло воскресе́нье]{.ru} 或 [бы́ло интере́сно]{.ru}）", 地点用第六格, "可以用否定 [не́ был]{.ru}"]
        notes: 范文先交代时间（[Вчера́ бы́ло воскресе́нье]{.ru}），再说自己去过的地方，然后依次说家人、朋友，每说一个地方就加一句评价（[бы́ло интере́сно]{.ru}、[был краси́вый]{.ru}）。这样 [был]{.ru}、[была́]{.ru}、[бы́ло]{.ru}、[бы́ли]{.ru} 四个形式都能用到。女生写时要把 [я был]{.ru} 改成 [я была́]{.ru}。
