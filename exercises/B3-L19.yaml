lesson: B3-L19
grammar: "命令式直接、明确（[Поднимитесь на сопку]{.ru}）；假定式 [бы]{.ru} + 过去时形式委婉、留有余地：建议（[Я бы посоветовала…]{.ru}）、劝告（[Вы бы взяли зонт]{.ru}）、客气的请求（[Не могли бы вы…?]{.ru}）、愿望（[хотелось бы]{.ru}、[было бы хорошо, если бы…]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Когда основали Владивосток и что значит его название? Что осталось от Владивостокской крепости? Какие мосты построили в 2012 году? Какая погода во Владивостоке летом и зимой? Что советует туристам экскурсовод Марина?]{.ru}"
        length: 60–90
        model: "Владивосток основали в 1860 году как военный пост, а его название значит «владей Востоком». От Владивостокской крепости, которую строили сорок лет, сохранились форты с подземными коридорами, куда сегодня водят экскурсии. В 2012 году построили Золотой мост через бухту Золотой Рог и Русский мост, который соединил материк с островом Русский. Зимой во Владивостоке холодно, но солнечно, а летом тепло и влажно, город часто закрывает туман, а в конце лета нередко приходят тайфуны. Марина советует приезжать в сентябре, подняться на сопку Орлиное гнездо, попробовать морепродукты и не забыть тёплую куртку."
        rubric: ["五个问题都回答，年份准确（1860、2012）", "第 5 题把命令式转述成 [советует]{.ru} + 不定式，体用对", "用完整的句子"]
        notes: "范文约 90 词。第 5 题转述劝告时，命令式 [поднимитесь, попробуйте, не забудьте]{.ru} 变成 [советует]{.ru} 后面的不定式，体不变：[подняться, попробовать, не забыть]{.ru}。"

  - id: e2
    type: rewrite
    task: 把直接的命令式改成委婉的说法，用括号里提示的结构。
    example:
      cue: Возьмите зонт. (вы бы …)
      answer: Вы бы взяли зонт.
    why: "假定式由 [бы]{.ru} 加过去时形式构成，命令式的体保留：第 1 题 [покажите → показать]{.ru}，[Не могли бы вы]{.ru} 后面接不定式。第 2 题 [я бы посоветовал]{.ru}（女性说话用 [посоветовала]{.ru}）+ 不定式 [поехать]{.ru}。第 3 题 [хочу → хотел бы / хотела бы]{.ru}，或无人称的 [мне хотелось бы]{.ru}。第 4 题 [ты бы]{.ru} + 过去时，主语 [ты]{.ru} 是男性用 [отдохнул]{.ru}，女性用 [отдохнула]{.ru}。第 5 题 [попробуйте → попробовали бы]{.ru}，[бы]{.ru} 的位置比较自由，可以放在 [вы]{.ru} 后面，也可以放在动词后面。"
    items:
      - cue: Покажите, пожалуйста, дорогу к вокзалу. (не могли бы вы …)
        accept: ["Не могли бы вы показать дорогу к вокзалу?", "Вы не могли бы показать дорогу к вокзалу?", "Не могли бы вы показать мне дорогу к вокзалу?", "Вы не могли бы показать мне дорогу к вокзалу?"]
      - cue: Поезжайте во Владивосток в сентябре. (я бы посоветовал …)
        accept: ["Я бы посоветовал поехать во Владивосток в сентябре.", "Я бы посоветовала поехать во Владивосток в сентябре.", "Я бы посоветовал вам поехать во Владивосток в сентябре.", "Я бы посоветовала вам поехать во Владивосток в сентябре."]
      - cue: Я хочу заказать экскурсию на остров Русский. (хотел бы …)
        accept: ["Я хотел бы заказать экскурсию на остров Русский.", "Я хотела бы заказать экскурсию на остров Русский.", "Мне хотелось бы заказать экскурсию на остров Русский."]
      - cue: Отдохни немного. (ты бы …)
        accept: ["Ты бы отдохнул немного.", "Ты бы отдохнула немного.", "Ты бы немного отдохнул.", "Ты бы немного отдохнула."]
      - cue: Попробуйте местных крабов. (вы бы …)
        accept: ["Вы бы попробовали местных крабов.", "Попробовали бы вы местных крабов."]

  - id: e3
    type: fill
    task: 用括号里动词的正确形式填空。
    why: "[бы]{.ru} 后面只用过去时形式，性、数和主语一致。第 1 题主语 [я]{.ru}（男性）→ [знал]{.ru}，主句也用过去时形式 [взял]{.ru}。第 2 题 [если бы]{.ru} 后用过去时 [построили]{.ru}（不定人称句，复数）。第 3 题无人称结构 [можно было]{.ru}，[было]{.ru} 用中性。第 4 题主语 [людей]{.ru} 是 [больше]{.ru} 后的第二格，谓语用中性单数 [приезжало]{.ru}。第 5 题主语 [Владивосток]{.ru} 阳性 → [был]{.ru}。"
    items:
      - stem: Если бы я ___, что вечером так холодно, я бы взял куртку.
        hint: знать
        accept: ["знал"]
      - stem: Если бы мост не ___, на остров можно было бы попасть только на корабле.
        hint: построить
        accept: ["построили"]
      - stem: Вот было бы хорошо, если бы до Москвы можно ___ доехать за два дня!
        hint: быть
        accept: ["было"]
      - stem: Тогда к нам ___ бы ещё больше людей.
        hint: приезжать
        accept: ["приезжало"]
      - stem: Без этого расстояния Владивосток не ___ бы таким особенным.
        hint: быть
        accept: ["был"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [бы]{.ru} 后用过去时形式 [посоветовал]{.ru}，不能用将来时 [посоветую]{.ru}。第 2 题 [если бы]{.ru} 后同样用过去时 [было]{.ru}。第 3 题委婉的愿望用无人称的 [хотелось бы]{.ru}，主体 [мне]{.ru} 第三格；[хочу бы]{.ru} 不存在，[хотела бы]{.ru} 要求主语是第一格 [я]{.ru}。第 4 题 [Вы бы]{.ru} + 过去时 [взяли]{.ru}；[возьмите]{.ru} 是命令式，不和 [бы]{.ru} 连用。第 5 题客气的请求 [Не могли бы вы]{.ru}，[могли]{.ru} 是过去时形式复数，与 [вы]{.ru} 一致。"
    items:
      - stem: Я бы ___ вам поехать во Владивосток в сентябре.
        options: [посоветую, посоветовал, посоветовать]
        answer: посоветовал
      - stem: Если бы у меня ___ время, я бы съездил на остров Русский.
        options: [было, будет, есть]
        answer: было
      - stem: Мне ___ жить ближе к морю.
        options: [хотелось бы, хочу бы, хотела бы]
        answer: хотелось бы
      - stem: "Вы бы ___ тёплую куртку: вечером у моря прохладно."
        options: [взяли, возьмёте, возьмите]
        answer: взяли
      - stem: ___ вы сказать, где здесь фуникулёр?
        options: [Не могли бы, Не можете бы, Не смогли]
        answer: Не могли бы

  - id: e5
    type: translate
    task: 翻译下列句子，注意语气。
    items:
      - zh: 一定要登上鹰巢山。（直接的建议）
        accept: ["Обязательно поднимитесь на сопку Орлиное гнездо.", "Обязательно поднимитесь на Орлиное гнездо."]
        rubric: ["完成体命令式 [поднимитесь]{.ru}", "[подняться на что]{.ru}：[на]{.ru} + 第四格"]
      - zh: 我倒是建议您去海洋馆看看。（委婉的建议）
        accept: ["Я бы посоветовал вам съездить в океанариум.", "Я бы посоветовала вам съездить в океанариум.", "Я бы посоветовал вам сходить в океанариум.", "Я бы посоветовала вам сходить в океанариум.", "Я бы посоветовал вам побывать в океанариуме.", "Я бы посоветовала вам побывать в океанариуме."]
        rubric: ["[я бы посоветовал(а)]{.ru}：[бы]{.ru} + 过去时形式", "[советовать кому]{.ru} + 不定式"]
      - zh: 要是到莫斯科两天就能到，那该多好啊！
        accept: ["Вот было бы хорошо, если бы до Москвы можно было доехать за два дня!", "Было бы хорошо, если бы до Москвы можно было доехать за два дня!", "Как было бы хорошо, если бы до Москвы можно было доехать за два дня!"]
        rubric: ["[было бы хорошо, если бы …]{.ru}：两个分句都有 [бы]{.ru}", "[можно было]{.ru}：过去时形式", "[за два дня]{.ru}"]
      - zh: 您能不能告诉我，去车站怎么走？
        accept: ["Не могли бы вы сказать, как пройти к вокзалу?", "Вы не могли бы сказать, как пройти к вокзалу?", "Не могли бы вы сказать мне, как пройти к вокзалу?", "Вы не могли бы сказать мне, как пройти к вокзалу?", "Не могли бы вы сказать, как доехать до вокзала?", "Вы не могли бы сказать, как доехать до вокзала?"]
        rubric: ["[не могли бы вы]{.ru} + 不定式：客气的请求", "[как пройти к вокзалу]{.ru}"]

  - id: e6
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段：城市介绍部分至少用两处形动词或副动词短语，其中一处由课文的从句或谓语改写而来；最后用间接引语转述导游的建议和愿望，命令式改成 [советует]{.ru} + 不定式，至少保留一处假定式。
    items:
      - prompt: "提纲：城市的建立和名称；地形；西伯利亚大铁路终点和港口；2012 年的两座桥；天气；导游的建议；导游的愿望。"
        length: 120–150
        model: "Владивосток, основанный в 1860 году как военный пост, стоит на сопках вокруг бухты Золотой Рог. Его название значит «владей Востоком». Город, напоминающий Сан-Франциско крутыми улицами и мостами, — конечная станция Транссиба и главная база Тихоокеанского флота. В 2012 году здесь построили два моста: Золотой, соединивший берега бухты, и Русский, у которого в год открытия был самый длинный в мире пролёт среди вантовых мостов. Зима во Владивостоке холодная, но солнечная, а летом город часто закрывает туман. Экскурсовод Марина советует приезжать в сентябре, подняться на сопку Орлиное гнездо и попробовать морепродукты. Она признаётся, что было бы хорошо, если бы до Москвы можно было доехать за два дня. Но, подумав, она добавляет, что без этого расстояния город не был бы таким особенным."
        rubric: ["提纲七项都有，年份准确（1860、2012）", "至少两处形动词或副动词短语，一处由课文改写", "导游的建议改成 [советует]{.ru} + 不定式，体用对", "至少一处假定式，[бы]{.ru} + 过去时形式", "120–150 词"]
        notes: "范文约 135 词。短语：[основанный в 1860 году]{.ru}（由课文的不定人称句 [Его основали в 1860 году]{.ru} 改写）、[напоминающий Сан-Франциско]{.ru}（由 [многие сравнивают его с Сан-Франциско]{.ru} 改写）、[соединивший берега бухты]{.ru}、[подумав]{.ru}。命令式 [поднимитесь, попробуйте]{.ru} 转述为 [советует подняться, попробовать]{.ru}。假定式 [было бы хорошо, если бы … можно было]{.ru}、[не был бы]{.ru} 在间接引语里保留不变。"
