lesson: B2-L40
grammar: "前缀 [в-]{.ru}（进入）和 [вы-]{.ru}（出来、出去）：[входи́ть / войти́]{.ru}、[выходи́ть / вы́йти]{.ru}、[въезжа́ть / въе́хать]{.ru}、[выезжа́ть / вы́ехать]{.ru}；[в]{.ru} + 第四格、[из]{.ru} + 第二格；[вы́шел]{.ru} 与 [ушёл]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [в-]{.ru} 或 [вы-]{.ru} 开头的动词。
    why: "看前置词：[в]{.ru} 加第四格表示进到里面，用 [в-]{.ru}（第 1、4 题）；[из]{.ru} 加第二格表示从里面出来，用 [вы-]{.ru}（第 2、3、5 题）。第 6 题 [на у́лицу]{.ru} 是从屋里出去到街上，也用 [вы-]{.ru}。"
    items:
      - stem: Друзья́ ___ в мече́ть.
        options: [вошли́, вы́шли]
        answer: вошли́
      - stem: Из Кремля́ ___ ма́ленькая маши́на.
        options: [въе́хала, вы́ехала]
        answer: вы́ехала
      - stem: Ван Лэй ___ из до́ма в де́вять часо́в.
        options: [вошёл, вы́шел]
        answer: вы́шел
      - stem: На маши́не в Кремль ___ нельзя́.
        options: [въезжа́ть, выезжа́ть]
        answer: въезжа́ть
      - stem: Из мече́ти друзья́ ___ ти́хо.
        options: [входи́ли, выходи́ли]
        answer: выходи́ли
      - stem: Ди́ма ___ на у́лицу и ждал дру́га.
        options: [вошёл, вы́шел]
        answer: вы́шел

  - id: e2
    type: fill
    task: 用括号里的名词的正确形式填空。
    why: "[войти́ / въе́хать]{.ru} 后用 [в]{.ru} 加第四格（第 1、3 题），[вы́йти / вы́ехать]{.ru} 后用 [из]{.ru} 加第二格（第 2、4、5 题）。第 4 题 [мече́ть]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，第二格是 [мече́ти]{.ru}；第 5 题 [Кремль]{.ru} 第二格重音移到词尾：[Кремля́]{.ru}。"
    items:
      - stem: Тури́сты вхо́дят в ___.
        hint: Кремль
        accept: ["Кремль"]
      - stem: Ди́ма вы́шел из ___.
        hint: ко́мната
        accept: ["ко́мнаты"]
      - stem: Маши́на въе́хала в ___.
        hint: воро́та
        accept: ["воро́та"]
      - stem: Друзья́ вы́шли из ___ в два часа́.
        hint: мече́ть
        accept: ["мече́ти"]
      - stem: Из ___ вы́ехала маши́на.
        hint: Кремль
        accept: ["Кремля́"]

  - id: e3
    type: choice
    task: 选择合适的动词。
    why: "第 1 题打电话时说“他出去一下”，很快回来，用 [вы́шел]{.ru}。第 2 题“回家了”，人已经不在这儿，用 [ушла́]{.ru}。第 3 题“经常”用未完成体 [выхо́дит]{.ru}。第 4 题“那一刻正在往里走”用未完成体 [входи́ли]{.ru}。第 5 题后面接 [и пошли́ домо́й]{.ru}，是依次完成的动作，用完成体 [вы́шли]{.ru}，注意重音在前缀上。"
    items:
      - stem: — Мо́жно Ди́му? — Он ___, бу́дет че́рез пять мину́т.
        options: [вы́шел, ушёл]
        answer: вы́шел
      - stem: Ба́бушки уже́ нет, она́ ___ домо́й.
        options: [вы́шла, ушла́]
        answer: ушла́
      - stem: Па́па ка́ждый день ___ из до́ма в семь часо́в.
        options: [выхо́дит, вы́йдет]
        answer: выхо́дит
      - stem: Когда́ мы выходи́ли, тури́сты ___ в Кремль.
        options: [входи́ли, вошли́]
        answer: входи́ли
      - stem: Мы ___ из Кремля́ в четы́ре часа́ и пошли́ домо́й.
        options: [выходи́ли, вы́шли]
        answer: вы́шли

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“出门”用 [вы́йти из до́ма]{.ru}，一次的结果用完成体。第 2 题进去用 [в]{.ru} 加第四格。第 3 题“开进”用 [въезжа́ть]{.ru}，[нельзя́]{.ru} 后用未完成体不定式。第 4 题两件事同时进行，都用未完成体。"
    items:
      - zh: 我们九点出的门。
        accept: ["Мы вы́шли из до́ма в де́вять часо́в.", "Мы вы́шли в де́вять часо́в.", "Мы вы́шли из до́ма в де́вять.", "Мы вы́шли в де́вять.", "В де́вять часо́в мы вы́шли из до́ма.", "В де́вять мы вы́шли из до́ма.", "В де́вять часо́в мы вы́шли."]
        rubric: ["“出门”用完成体 [вы́шли]{.ru}，重音在 [вы́-]{.ru}", "时间用 [в]{.ru} + 第四格"]
      - zh: 两个朋友走进了清真寺。
        accept: ["Друзья́ вошли́ в мече́ть.", "Два дру́га вошли́ в мече́ть."]
        rubric: ["[войти́]{.ru} 过去时 [вошли́]{.ru}", "[в мече́ть]{.ru} 第四格"]
      - zh: 克里姆林里不能开车进去。
        accept: ["В Кремль нельзя́ въезжа́ть на маши́не.", "На маши́не в Кремль въезжа́ть нельзя́.", "В Кремль на маши́не въезжа́ть нельзя́.", "Въезжа́ть в Кремль на маши́не нельзя́.", "Нельзя́ въезжа́ть в Кремль на маши́не.", "В Кремль нельзя́ въезжа́ть.", "В Кремль на маши́не нельзя́ въезжа́ть.", "Нельзя́ въезжа́ть на маши́не в Кремль.", "Нельзя́ на маши́не въезжа́ть в Кремль.", "На маши́не въезжа́ть в Кремль нельзя́.", "На маши́не нельзя́ въезжа́ть в Кремль.", "Въезжа́ть на маши́не в Кремль нельзя́.", "В Кремль въезжа́ть на маши́не нельзя́.", "В Кремль въезжа́ть нельзя́.", "Въезжа́ть в Кремль нельзя́.", "Нельзя́ въезжа́ть в Кремль.", "На маши́не в Кремль нельзя́ въезжа́ть."]
        rubric: ["[нельзя́]{.ru} + 未完成体不定式 [въезжа́ть]{.ru}", "[в Кремль]{.ru} 第四格"]
      - zh: 我们往外走的时候，游客们往里走。
        accept: ["Когда́ мы выходи́ли, тури́сты входи́ли.", "Мы выходи́ли, а тури́сты входи́ли.", "Когда́ мы выходи́ли, входи́ли тури́сты."]
        rubric: ["那一刻正在进行的过程用未完成体 [выходи́ли]{.ru}、[входи́ли]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Когда́ друзья́ вы́шли из до́ма и почему́ Ди́ма опозда́л? Как вхо́дят в Каза́нский Кремль? Что друзья́ уви́дели за воро́тами? Почему́ собо́р и мече́ть стоя́т ря́дом? Что необы́чного в ба́шне Сююмбике́?]{.ru}"
        length: 70–100
        model: "Тре́тьего ма́я Ван Лэй вы́шел из до́ма в де́вять часо́в, а Ди́ма ещё до́лго иска́л свой телефо́н. Вход в Каза́нский Кремль — че́рез бе́лую Спа́сскую ба́шню, как в Москве́. За воро́тами друзья́ уви́дели бе́лый Благове́щенский собо́р и большу́ю мече́ть Кул-Шари́ф с голубы́м ку́полом. В Каза́ни живу́т и ру́сские, и тата́ры, поэ́тому собо́р и мече́ть стоя́т ря́дом. Друзья́ вошли́ в мече́ть, а когда́ вы́шли, Ди́ма показа́л на ба́шню Сююмбике́: она́ стои́т не пря́мо. Из Кремля́ друзья́ вы́шли в четы́ре часа́."
        rubric: ["回答全部五个问题", "[вы́шел]{.ru}、[вошли́]{.ru}、[вы́шли]{.ru} 等用对前缀、体和重音", "[в]{.ru} / [из]{.ru} 后的格用对"]
        notes: 范文约 85 词。进出用 [войти́ в]{.ru} + 第四格、[вы́йти из]{.ru} + 第二格。注意 [вы́шли]{.ru} 的重音在前缀上。“入口在……”用名词 [вход]{.ru} 加破折号，比用动词简单。

  - id: e6
    type: open
    task: 作文：《我去过的一座名胜》。
    items:
      - prompt: 介绍你参观过的一座有名的建筑或古迹（比如故宫、莫斯科克里姆林、一座寺庙或博物馆）：怎么进去，里面有什么，你在那里待了多久，什么时候出来的。
        length: 100–150
        model: "В про́шлом году́ я был в Третьяко́вской галере́е. Э́то изве́стный музе́й ру́сского иску́сства в це́нтре Москвы́.\n\nМы пришли́ туда́ в суббо́ту у́тром. Ка́ждый день туда́ прихо́дят ты́сячи люде́й, поэ́тому у вхо́да была́ дли́нная о́чередь. Мы жда́ли полчаса́ и наконе́ц вошли́. Внутри́ мно́го за́лов. Мы входи́ли в оди́н зал, выходи́ли и сра́зу входи́ли в друго́й. Я до́лго смотре́л на ста́рые ико́ны, а мое́й подру́ге бо́льше понра́вились пейза́жи и портре́ты.\n\nМы бы́ли в галере́е пять часо́в и о́чень уста́ли. Когда́ мы вы́шли на у́лицу, бы́ло уже́ три часа́. Но я обяза́тельно приду́ туда́ ещё раз!"
        rubric: ["说清是什么地方、怎么进去、里面有什么、什么时候出来", "[войти́ / вы́йти]{.ru} 等前缀动词和前置词用对", "一次的结果用完成体，反复进出用未完成体", "100–150 词，分段"]
        notes: 范文分三段：介绍地方—在里面—出来以后。[вошли́]{.ru}、[вы́шли на у́лицу]{.ru} 说一次的进出，用完成体；[входи́ли в оди́н зал, выходи́ли и сра́зу входи́ли в друго́й]{.ru} 说反复进出，用未完成体。结尾 [приду́ ещё раз]{.ru} 用完成体将来时表示决心。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊，给奥尔加·维克托罗夫娜写一封短信，讲讲你参观喀山克里姆林的情形：怎么进去的，里面看见了什么，你最喜欢什么。给老师写信要用尊称。
        length: 80–120
        model: "Здра́вствуйте, О́льга Ви́кторовна!\n\nПишу́ вам из Каза́ни. Сего́дня мы с Ди́мой бы́ли в Каза́нском Кремле́. Мы вошли́ в Кремль че́рез Спа́сскую ба́шню, как в Москве́! Внутри́ стоя́т ря́дом бе́лый собо́р и больша́я мече́ть с голубы́м ку́полом. Мы вошли́ в мече́ть: там бы́ло о́чень ти́хо и краси́во.\n\nБо́льше всего́ мне понра́вилась ба́шня Сююмбике́: она́ стои́т не пря́мо! Пото́м мы подняли́сь на сте́ну и смотре́ли на Во́лгу.\n\nМы вы́шли из Кремля́ то́лько в четы́ре часа́. Я сде́лал мно́го фотогра́фий и покажу́ их на уро́ке.\n\nС уваже́нием,\nВан Лэй"
        rubric: ["给老师写信用 [вы]{.ru}，称呼用名字和父称", "开头 [Здра́вствуйте]{.ru}，结尾 [С уваже́нием]{.ru} 或 [Всего́ хоро́шего]{.ru}", "[вошли́ в]{.ru}、[вы́шли из]{.ru} 用对", "说出最喜欢的一样东西"]
        notes: 给老师、长辈写信，称呼写 [Здра́вствуйте, О́льга Ви́кторовна!]{.ru} 或 [Дорога́я О́льга Ви́кторовна!]{.ru}，正文用 [вы]{.ru}，落款前写 [С уваже́нием]{.ru}（此致敬礼）。[Бо́льше всего́ мне понра́вилась…]{.ru}“我最喜欢的是……”，动词和第一格的事物一致：[понра́вилась ба́шня]{.ru}。
