lesson: B4-L26
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Какие плюсы городской жизни называет автор? Почему он считает, что город полезен для природы? Какие две проблемы урбанизации он видит? Какой аргумент приводят сторонники урбанизации и как автор на него отвечает? Какой вывод делает автор?]{.ru}"
        length: 110–150
        model: "Автор называет четыре плюса городской жизни: работу, образование и медицину, культуру и свободу; кроме того, город эффективнее деревни. Город полезен для природы, потому что житель многоэтажного дома тратит меньше энергии на отопление, чаще ездит на общественном транспорте, а плотные города отнимают меньше земли у лесов и полей. Первая проблема — сами города: дорогое жильё, пробки, грязный воздух, стресс и одиночество. Вторая, более важная, — маленькие города и посёлки пустеют, как родной посёлок автора, где вместо пяти тысяч жителей осталось меньше полутора тысяч. Сторонники урбанизации говорят, что это естественный процесс. Автор соглашается, но отвечает, что естественный процесс можно направлять: люди остаются в небольших городах, если там есть дороги, интернет, школы и больницы. Вывод автора: важно не то, хороша урбанизация или плоха, а то, будет ли у человека настоящий выбор, где жить."
        rubric: ["五个问题都回答，内容与课文一致", "两个问题分清主次：第二个（小城镇空心化）是作者认为更重要的", "写出作者的反驳：自然过程也可以引导"]
        notes: "第 3 题要注意作者自己的评价：[Вторая проблема менее заметна, но, по-моему, важнее]{.ru}。第 4 题作者的回答分两步：先同意（[С этим трудно не согласиться]{.ru}），再指出对方推理的漏洞（[из того, что…, ещё не следует, что…]{.ru}）。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[мегаполис]{.ru}"
        accept: ["Очень большой город, в котором живут миллионы людей.", "Огромный город с населением в несколько миллионов человек."]
        rubric: ["说明是特别大的城市", "人口以百万计"]
      - zh: "[урбанизация]{.ru}"
        accept: ["Процесс, при котором люди переезжают из деревень в города и города растут.", "Рост городов и городского населения."]
        rubric: ["说明是人口向城市集中、城市扩大的过程"]
      - zh: "[замкнутый круг]{.ru}"
        accept: ["Положение, из которого нельзя выйти, потому что одна проблема ведёт к другой, а та — снова к первой.", "Ситуация, в которой причина и следствие всё время меняются местами."]
        rubric: ["说明问题互为因果、无法摆脱"]
      - zh: "[ипотека]{.ru}"
        accept: ["Деньги, которые банк даёт на покупку квартиры или дома на много лет.", "Долг банку за квартиру, который возвращают много лет."]
        rubric: ["说明是向银行借的钱", "用于买房，期限长"]
      - zh: "[тезис]{.ru}"
        accept: ["Главная мысль, которую автор хочет доказать.", "Основная мысль статьи, которую автор подтверждает с помощью аргументов."]
        rubric: ["说明是作者要证明的主要观点"]
      - zh: "[контраргумент]{.ru}"
        accept: ["Аргумент, который приводят против другого аргумента или тезиса.", "Довод, который показывает, что другая сторона не права."]
        rubric: ["说明是反对另一论据或论点的论据"]
      - zh: "[работать удалённо]{.ru}"
        accept: ["Работать не в офисе, а дома или в другом месте, через интернет.", "Работать из дома через интернет."]
        rubric: ["说明不在办公室工作", "通过网络"]

  - id: e3
    type: choice
    task: 根据课文和本课“文体与修辞”选择正确答案。
    why: "第 1 题论点在第 1 段末尾：城市化有好处，但代价被忽视。第 2 题作者家乡小镇是亲身经历的例子，而不是统计数据或研究。第 3 题 [С этим трудно не согласиться]{.ru} 是让步：先承认对方有道理，紧接着用 [Но]{.ru} 反驳，作者并没有改变观点。第 4 题作者说这个论据“乍看奇怪”，是因为一般人认为城市污染环境，作者接着用事实说明它的道理。第 5 题 [Молодёжь уезжает, потому что нет работы, а работы нет, потому что уехала молодёжь]{.ru} 说明的是恶性循环 [замкнутый круг]{.ru}。第 6 题结论的关键词是“选择”：[Именно этот выбор… и есть настоящий признак прогресса]{.ru}，作者并不主张把人留在农村。"
    items:
      - stem: Тезис автора находится ___.
        options: [в конце первого абзаца, в начале второго абзаца, в последнем предложении статьи]
        answer: в конце первого абзаца
      - stem: Рассказ о родном посёлке автора — это ___.
        options: [пример из личного опыта, цифры из официальных данных, ссылка на исследование]
        answer: пример из личного опыта
      - stem: Слова «С этим трудно не согласиться» нужны, чтобы ___.
        options: ["согласиться с противниками, а потом ответить им", "показать, что автор изменил своё мнение", "закончить статью"]
        answer: "согласиться с противниками, а потом ответить им"
      - stem: Довод о том, что город полезен для природы, «кажется странным», потому что ___.
        options: ["обычно считают, что город вреден для природы", "автор в нём не уверен", "этот довод приводят противники урбанизации"]
        answer: "обычно считают, что город вреден для природы"
      - stem: "Предложение «Молодёжь уезжает, потому что нет работы, а работы нет, потому что уехала молодёжь» описывает ___."
        options: [замкнутый круг, естественный процесс, прогресс]
        answer: замкнутый круг
      - stem: Автор считает, что признак прогресса — это ___.
        options: ["возможность выбирать, где жить", "рост мегаполисов", "возвращение людей в деревню"]
        answer: "возможность выбирать, где жить"

  - id: e4
    type: choice
    task: 选择恰当的连接词，填入下面的短评。
    why: "第 1 题前面是“人们通常认为”，后面是作者不同的看法，用转折 [однако]{.ru}。第 2 题开始列举理由，用 [во-первых]{.ru}。第 3 题承认对方有道理，用让步的 [безусловно]{.ru}。第 4 题由前面的事实得出推论，用 [следовательно]{.ru}。第 5 题全文总结，用 [таким образом]{.ru}，它放在最后一段的开头。[следовательно]{.ru} 和 [таким образом]{.ru} 都表示结论，区别是前者从上一句推出下一句，后者总结全文。"
    items:
      - stem: Принято считать, что жить в мегаполисе удобно. ___, у городской жизни есть и минусы.
        options: [Однако, Во-первых, Таким образом]
        answer: Однако
      - stem: ___, в большом городе слишком дорогое жильё.
        options: [Во-первых, Следовательно, Безусловно]
        answer: Во-первых
      - stem: ___, в городе больше работы и выше зарплаты, но это не решает всех проблем.
        options: [Безусловно, Следовательно, Во-вторых]
        answer: Безусловно
      - stem: Многие профессии позволяют работать удалённо. ___, жить можно не только в столице.
        options: [Следовательно, Во-первых, Однако]
        answer: Следовательно
      - stem: ___, у городов есть и плюсы, и минусы, и важно, чтобы у человека был выбор.
        options: [Таким образом, Во-первых, Однако]
        answer: Таким образом

  - id: e5
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [притягивать]{.ru} 第一变位，主语 [мегаполисы]{.ru} 复数：[притягивают]{.ru}。第 2 题 [отнимать что у кого]{.ru}，主语 [города]{.ru} 复数：[отнимают]{.ru}。第 3 题 [вкладывать что во что]{.ru}，[будут]{.ru} 后面用不定式。第 4 题 [опровергнуть]{.ru} 过去时阳性没有 [-л]{.ru}：[опроверг]{.ru}，这是 [-нуть]{.ru} 动词常见的形式。第 5 题 [удерживать]{.ru} 重音在 [-де-]{.ru} 上，[никто не предлагает]{.ru} 后接不定式。第 6 题 [утверждать]{.ru} 第一变位，主语 [сторонники]{.ru} 复数：[утверждают]{.ru}。"
    items:
      - stem: Мегаполисы ___ молодёжь со всей страны.
        hint: притягивать
        accept: ["притягивают"]
      - stem: Плотные города ___ меньше земли у лесов и полей.
        hint: отнимать
        accept: ["отнимают"]
      - stem: Если государство будет ___ деньги только в столицу, маленькие города начнут пустеть.
        hint: вкладывать
        accept: ["вкладывать"]
      - stem: Автор не ___ аргумент противников, а показал, что из него ничего не следует.
        hint: опровергнуть
        accept: ["опроверг"]
      - stem: Никто не предлагает силой ___ людей в деревне.
        hint: удерживать
        accept: ["удерживать"]
      - stem: Сторонники урбанизации ___, что спорить с ней бесполезно.
        hint: утверждать
        accept: ["утверждают"]

  - id: e6
    type: open
    task: 概要写作。用俄语把课文压缩成 150 词左右，保留论点、主要论据、对方的反驳和结论。
    items:
      - prompt: "[Изложите кратко содержание колонки «Город как магнит».]{.ru} 用第三人称（[автор считает, по мнению автора]{.ru}）。"
        length: 130–170
        model: "В своей колонке социолог Ирина Голованова пишет об урбанизации. Сегодня больше половины людей на Земле и около трёх четвертей жителей России живут в городах. Принято считать, что это прогресс, но, по мнению автора, у урбанизации есть не только плюсы, но и высокая цена. Город даёт работу, образование, медицину, культуру и свободу; он эффективнее деревни и даже тратит меньше энергии и земли. Однако в мегаполисах дорогое жильё, пробки, грязный воздух, люди страдают от стресса и одиночества. Ещё важнее, что маленькие города и посёлки пустеют: молодёжь уезжает, потому что нет работы, а работы нет, потому что нет молодёжи. Сторонники урбанизации считают её естественным процессом. Автор с этим согласна, но утверждает, что этот процесс можно направлять: люди остаются в небольших городах, если там есть дороги, интернет, школы и больницы, а многие могут работать удалённо. Вывод автора: нужно развивать средние и малые города, чтобы у человека был настоящий выбор, где жить."
        rubric: ["开头点明作者和话题", "写出作者的论点", "利和弊各概括一两句", "写出对方的论据和作者的反驳", "写出结论", "用第三人称转述，不写成自己的观点", "130–170 词"]
        notes: "范文约 150 词。概要的结构和原文一致：论点 → 利 → 弊 → 反驳 → 结论。列举性的论据压缩成一个句子（工作、教育、医疗、文化），作者家乡小镇的具体数字可以删掉，只留“恶性循环”这一结论。注意作者是女性：[Автор с этим согласна]{.ru}——[автор]{.ru} 是阳性名词，但指女性时谓语形容词、动词过去时可以用阴性。"

  - id: e7
    type: open
    task: 写一篇短评。题目：“远程办公：利与弊”。150–200 词，要有论点、至少两条论据、一个对方的论据和你的反驳、结论。
    items:
      - prompt: "[Работа удалённо: за и против.]{.ru} 用上本课的连接词（[на мой взгляд, во-первых, безусловно, однако, следовательно, таким образом]{.ru}）。"
        length: 150–200
        model: "Ещё недавно работа дома казалась исключением, а сегодня многие компании позволяют сотрудникам работать удалённо. Принято считать, что это удобно для всех. На мой взгляд, удалённая работа действительно полезна, но не для каждого человека и не для каждой профессии.\n\nВо-первых, человек экономит время и деньги: ему не нужно каждый день по часу стоять в пробках. Во-вторых, он может жить не в мегаполисе, где дорогое жильё, а в маленьком городе или даже в деревне. Следовательно, удалённая работа может помочь решить проблему, о которой пишут социологи: маленькие города перестанут пустеть.\n\nБезусловно, у такой работы есть и недостатки. Противники удалённой работы утверждают, что дома трудно заставить себя работать, а без общения с коллегами человек чувствует одиночество. Однако эту проблему можно решить: например, работать дома три дня в неделю, а два дня — в офисе.\n\nТаким образом, удалённая работа — это не конец офиса, а ещё одна возможность. Самый убедительный аргумент в её пользу — свобода: человек сам решает, где ему жить и как ему проводить своё время. Важно, чтобы у человека был выбор."
        rubric: ["第一段提出论点", "至少两条论据，用列举词连接", "写出对方的论据，并加以回应", "结论明确", "用上至少四个连接论据的词语", "150–200 词"]
        notes: "范文约 170 词，四段：论点、论据、反驳、结论，与课文的结构相同。第一段用 [Принято считать, что…]{.ru} 引出流行看法，再用 [На мой взгляд]{.ru} 提出有保留的论点。第三段先让步（[Безусловно]{.ru}），转述对方的论据（[утверждают, что…]{.ru}），再用 [Однако]{.ru} 给出解决办法。第二段最后一句把话题和课文联系起来，这是短评中常见的“联系现实”的写法。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的评论文章，要有论点、论据、反驳和结论。
    items:
      - prompt: "[Где лучше жить: в мегаполисе или в маленьком городе?]{.ru}"
        length: 250–300
        model: "Каждый год тысячи выпускников школ решают, где строить свою жизнь. Большинство выбирает мегаполис, и это понятно. Но значит ли это, что в большом городе жить лучше? По-моему, ответ зависит от того, в каком возрасте человек делает этот выбор.\n\nДля молодого человека мегаполис, безусловно, лучше. Во-первых, здесь лучшие университеты и больше работы. Во-вторых, здесь легче найти людей с похожими интересами: в маленьком городе может не оказаться ни одного клуба любителей шахмат или японского языка. В-третьих, большой город учит жить самостоятельно. Я сам приехал учиться в столицу из небольшого города и за первый год узнал больше, чем за пять лет до этого.\n\nОднако с возрастом плюсы мегаполиса становятся менее заметными, а минусы — более очевидными. Семье с детьми нужна большая квартира, а в мегаполисе на неё уходит половина дохода. Каждый день человек тратит два часа на дорогу, а детям негде гулять, кроме двора между многоэтажными домами. Не случайно многие мои знакомые после тридцати лет начинают думать о переезде.\n\nСторонники мегаполиса возражают: в маленьком городе нет хорошей работы, нет хороших врачей, скучно. Во многих случаях это правда, и это самый убедительный контраргумент. Но ситуация меняется. В небольших городах открываются новые школы и больницы, а билет на поезд до столицы стоит не так дорого. Многие профессии позволяют работать удалённо, а дороги и интернет сегодня есть почти везде. Следовательно, жить в небольшом городе и не терять при этом ни работы, ни качества жизни становится возможно.\n\nТаким образом, я не думаю, что на этот вопрос есть один ответ для всех. Мегаполис хорош для того, кто ищет, а маленький город — для того, кто уже нашёл. Главное, чтобы у человека был выбор и чтобы этот выбор не был окончательным: всегда можно уехать и всегда можно вернуться."
        rubric: ["开头提出问题并给出论点", "论据具体，至少有一个亲身经历或具体例子", "写出对方的看法并回应", "结论与开头的论点呼应", "用上本课的连接词和词语", "250–300 词"]
        notes: "范文约 280 词。论点不是简单地选一边，而是“取决于年龄”，这让文章有层次：第二段写年轻人的理由，第三段写有家庭的人的理由，第四段回应反对意见。结尾用一个对比句 [Мегаполис хорош для того, кто ищет, а маленький город — для того, кто уже нашёл]{.ru} 概括全文，便于读者记住。"
