lesson: B2-L67
grammar: "表示原因的前置词：[из-за́]{.ru} + 第二格（不好的原因）、[благодаря́]{.ru} + 第三格（好的原因）、[от]{.ru} + 第二格（不由自主的状态）。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的前置词。
    why: "第 1 题“发抖”是不由自主的身体状态，用 [от]{.ru}。第 2 题因为下雨没能去树林，是坏结果，用 [из-за́]{.ru}。第 3 题多亏米沙找到了路，是好结果，用 [благодаря́]{.ru}，[Ми́ше]{.ru} 是第三格。第 4 题“高兴得哭了”是不由自主的情绪，用 [от]{.ru}。第 5 题 [ве́тра]{.ru} 是第二格，不能接 [благодаря́]{.ru}；结果不好，用 [из-за́]{.ru}。第 6 题 [дождю́]{.ru} 是第三格，只能接 [благодаря́]{.ru}；下雨带来了很多蘑菇，是好结果。"
    items:
      - stem: "Ван Лэй дрожа́л ___ хо́лода."
        options: [от, из-за́, благодаря́]
        answer: от
      - stem: "___ дождя́ мы не пошли́ в лес."
        options: [Из-за́, Благодаря́, От]
        answer: Из-за́
      - stem: "___ Ми́ше они́ бы́стро нашли́ доро́гу домо́й."
        options: [Благодаря́, Из-за́, От]
        answer: Благодаря́
      - stem: "Све́та пла́кала ___ ра́дости."
        options: [от, из-за́, благодаря́]
        answer: от
      - stem: "___ ве́тра вено́к верну́лся к бе́регу."
        options: [Из-за́, Благодаря́, От]
        answer: Из-за́
      - stem: "___ дождю́ в лесу́ мно́го грибо́в."
        options: [Благодаря́, Из-за́, От]
        answer: Благодаря́

  - id: e2
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "[из-за́]{.ru} 和 [от]{.ru} 要求第二格，[благодаря́]{.ru} 要求第三格。第 1 题 [рабо́та → рабо́ты]{.ru}。第 2 题人称代词 [ты]{.ru} 的第三格是 [тебе́]{.ru}。第 3 题 [смех → сме́ха]{.ru}。第 4 题 [ты]{.ru} 的第二格是 [тебя́]{.ru}。第 5 题 [ба́бушка → ба́бушке]{.ru}。第 6 题 [хо́лод → хо́лода]{.ru}。"
    items:
      - stem: "Роди́тели не смогли́ прие́хать из-за́ ___."
        hint: рабо́та
        accept: ["рабо́ты"]
      - stem: "Благодаря́ ___ я тепе́рь зна́ю все ру́сские обы́чаи."
        hint: ты
        accept: ["тебе́"]
      - stem: "Ван Лэй просну́лся от ___."
        hint: смех
        accept: ["сме́ха"]
      - stem: "Из-за́ ___ мы опозда́ли на электри́чку!"
        hint: ты
        accept: ["тебя́"]
      - stem: "Благодаря́ ___ Ван Лэй узна́л мно́го о пра́зднике."
        hint: ба́бушка
        accept: ["ба́бушке"]
      - stem: "Ми́ша не мог говори́ть от ___."
        hint: хо́лод
        accept: ["хо́лода"]

  - id: e3
    type: rewrite
    task: 按例句用前置词改写，去掉 [потому́ что]{.ru}。
    example:
      cue: "Мы не пошли́ в лес, потому́ что шёл дождь."
      answer: "Из-за́ дождя́ мы не пошли́ в лес."
    why: "原因从句里的动词去掉，只留下表示原因的名词，按结果的好坏选前置词：第 1 题没能来，用 [из-за́]{.ru}；第 2 题找到了路，用 [благодаря́]{.ru} + 第三格；第 3 题“醒了”是不由自主的，用 [от]{.ru}；第 4 题电气火车晚点是坏结果，用 [из-за́]{.ru}。前置词短语也可以放在句末。"
    items:
      - cue: "Па́па не прие́хал, потому́ что у него́ мно́го рабо́ты."
        accept: ["Из-за́ рабо́ты па́па не прие́хал.", "Па́па не прие́хал из-за́ рабо́ты."]
      - cue: "Мы нашли́ доро́гу, потому́ что Ми́ша нам помо́г."
        accept: ["Благодаря́ Ми́ше мы нашли́ доро́гу.", "Мы нашли́ доро́гу благодаря́ Ми́ше."]
      - cue: "Ба́бушка просну́лась, потому́ что бы́ло хо́лодно."
        accept: ["Ба́бушка просну́лась от хо́лода.", "От хо́лода ба́бушка просну́лась."]
      - cue: "Электри́чка опозда́ла, потому́ что был си́льный ве́тер."
        accept: ["Из-за́ ве́тра электри́чка опозда́ла.", "Электри́чка опозда́ла из-за́ ве́тра.", "Из-за́ си́льного ве́тра электри́чка опозда́ла.", "Электри́чка опозда́ла из-за́ си́льного ве́тра."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“多亏你”用 [благодаря́ тебе́]{.ru}（第三格）。第 2 题“因为天气不好”是坏结果，用 [из-за́ пого́ды]{.ru}（第二格）。第 3 题“冷得发抖”是不由自主的状态，用 [от хо́лода]{.ru}。第 4 题“都怪他”带责怪口气，用 [из-за́ него́]{.ru}；前置词后面的 [он]{.ru} 要加 [н-]{.ru}。"
    items:
      - zh: 多亏了你，我通过了考试。
        accept: ["Благодаря́ тебе́ я сдал экза́мен.", "Благодаря́ тебе́ я сдала́ экза́мен.", "Я сдал экза́мен благодаря́ тебе́.", "Я сдала́ экза́мен благодаря́ тебе́.", "Благодаря́ вам я сдал экза́мен.", "Благодаря́ вам я сдала́ экза́мен.", "Я сдал экза́мен благодаря́ вам.", "Я сдала́ экза́мен благодаря́ вам."]
        rubric: ["[благодаря́]{.ru} + 第三格 [тебе́]{.ru} 或 [вам]{.ru}", "“通过考试”用完成体 [сдать экза́мен]{.ru}"]
      - zh: 因为天气不好，我们待在家里。
        accept: ["Из-за́ плохо́й пого́ды мы бы́ли до́ма.", "Мы бы́ли до́ма из-за́ плохо́й пого́ды.", "Из-за́ плохо́й пого́ды мы сиде́ли до́ма.", "Мы сиде́ли до́ма из-за́ плохо́й пого́ды.", "Из-за́ плохо́й пого́ды мы оста́лись до́ма.", "Мы оста́лись до́ма из-за́ плохо́й пого́ды."]
        rubric: ["[из-за́]{.ru} + 第二格 [плохо́й пого́ды]{.ru}", "不用 [благодаря́]{.ru}"]
      - zh: 孩子们冷得发抖。
        accept: ["Де́ти дрожа́ли от хо́лода.", "Ребя́та дрожа́ли от хо́лода.", "Де́ти дрожа́т от хо́лода.", "Ребя́та дрожа́т от хо́лода."]
        rubric: ["[дрожа́ть от хо́лода]{.ru}", "主语复数，动词用复数"]
      - zh: 都怪他，我们迟到了。
        accept: ["Из-за́ него́ мы опозда́ли.", "Мы опозда́ли из-за́ него́."]
        rubric: ["[из-за́]{.ru} + 第二格 [него́]{.ru}，前置词后加 [н-]{.ru}", "“迟到”用完成体 [опозда́ли]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Как Ван Лэй просну́лся седьмо́го ию́ля? Что сказа́ла ба́бушка об э́том обы́чае? Почему́ роди́тели не прие́хали на пра́здник? Что де́лала молодёжь на ре́чке? Что иска́ли в лесу́ Ми́ша и Ван Лэй? Как они́ нашли́ доро́гу домо́й?]{.ru}"
        length: 70–100
        model: "Седьмо́го ию́ля Ван Лэй просну́лся от сме́ха. Когда́ он вы́шел в сад, Ми́ша обли́л его́ холо́дной водо́й, потому́ что был пра́здник Ива́на Купа́лы. Ба́бушка сказа́ла, что э́то ста́рый обы́чай: вода́ в э́тот день даёт здоро́вье. Пра́здник начался́ ещё шесто́го ию́ля ве́чером. Роди́тели не прие́хали из-за́ рабо́ты. На ре́чке горе́л костёр, де́вушки пуска́ли по воде́ венки́, а па́рни пры́гали че́рез костёр. Ми́ша и Ван Лэй иска́ли в лесу́ цвето́к па́поротника, но не нашли́. Благодаря́ Ми́ше они́ бы́стро нашли́ доро́гу домо́й."
        rubric: ["回答全部六个问题", "用对 [от, из-за́, благодаря́]{.ru} 和它们要求的格", "按时间顺序交代清楚：课文先写早上，再回想前一天晚上"]
        notes: "范文约 85 词。三个原因前置词各用一次：[от сме́ха]{.ru}（不由自主）、[из-за́ рабо́ты]{.ru}（坏结果）、[благодаря́ Ми́ше]{.ru}（好结果）。课文是倒叙，范文用 [начался́ ещё шесто́го ию́ля ве́чером]{.ru} 把两天的事连起来。"

  - id: e6
    type: open
    task: 作文：我最喜欢的节日。
    items:
      - prompt: 介绍一个中国的节日（如春节、端午节、中秋节）：在哪天、有什么风俗、你自己怎样过。至少用一次 [из-за́]{.ru}、一次 [благодаря́]{.ru}、一次 [от]{.ru}。
        length: 100–150
        model: "Мой люби́мый пра́здник — Пра́здник весны́, кита́йский Но́вый год. Он быва́ет в конце́ января́ и́ли в феврале́. В э́ти дни вся семья́ собира́ется вме́сте. Мы гото́вим пельме́ни, смо́трим по телеви́зору большо́й пра́здничный конце́рт, а в двена́дцать часо́в но́чи все поздравля́ют друг дру́га. Де́ти получа́ют от ста́рших кра́сные конве́рты с деньга́ми и пры́гают от ра́дости.\nПе́ред пра́здником мно́гие е́дут домо́й к роди́телям. Из-за́ э́того биле́тов на по́езд и самолёт ча́сто нет, и их покупа́ют за ме́сяц.\nВ э́том году́ я встреча́л Пра́здник весны́ до́ма, в Пеки́не. Благодаря́ зи́мним кани́кулам я был с семьёй це́лых две неде́ли. Моя́ ба́бушка сказа́ла, что э́то был её са́мый счастли́вый пра́здник."
        rubric: ["说清节日的时间和主要风俗", "[из-за́]{.ru} + 第二格、[благодаря́]{.ru} + 第三格、[от]{.ru} + 第二格各至少一次，格和意思都对", "100–150 词，结构清楚"]
        notes: 范文分三段：节日的时间和风俗；节前回家的人潮；自己的经历。三个前置词分别用在 [пры́гают от ра́дости]{.ru}（不由自主的情绪）、[из-за́ э́того]{.ru}（坏的原因，[э́того]{.ru} 指前一句说的事）、[благодаря́ зи́мним кани́кулам]{.ru}（好的原因，复数第三格）。中国节日的名称可以直接意译：春节 [Пра́здник весны́]{.ru}，中秋节 [Пра́здник середи́ны о́сени]{.ru}。

  - id: e7
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。7 月 7 日晚上，给已经回到喀山的迪马写一封短信，讲讲伊万·库帕拉节：昨晚河边的篝火和花环、找蕨花、今早米沙泼水。信里用上 [из-за́]{.ru}、[благодаря́]{.ru} 和 [от]{.ru}。注意书信的格式。
        length: 80–120
        model: |
          7 ию́ля

          Приве́т, Ди́ма!

          Как ты? Как Каза́нь? А у нас на да́че вчера́ и сего́дня был пра́здник — Ива́н Купа́ла.

          Вчера́ ве́чером мы ходи́ли на ре́чку. Там горе́л большо́й костёр, и па́рни пры́гали че́рез него́. А́нна сде́лала вено́к, но из-за́ ве́тра он сра́зу верну́лся к бе́регу. Пото́м мы с Ми́шей иска́ли в лесу́ цвето́к па́поротника. Цветка́ мы не нашли́, а доро́гу домо́й нашли́ то́лько благодаря́ Ми́ше.

          А сего́дня у́тром Ми́ша обли́л меня́ холо́дной водо́й! Я дрожа́л от хо́лода, но пото́м то́же засмея́лся. Говоря́т, тепе́рь я це́лый год не бу́ду боле́ть.

          Пиши́, как у тебя́ дела́!

          Твой Ван Лэй
        rubric: ["日期、称呼、落款格式正确", "对朋友用 [ты]{.ru}", "讲清前一晚和当天早上的事", "[из-за́]{.ru}、[благодаря́]{.ru}、[от]{.ru} 各至少一次，格正确"]
        notes: "迪马此时已回喀山，所以开头问 [Как Каза́нь?]{.ru}。范文按时间顺序：昨晚（篝火、花环、蕨花），今早（泼水）。[из-за́ ве́тра]{.ru}、[благодаря́ Ми́ше]{.ru}、[от хо́лода]{.ru} 分别表示坏的原因、好的原因和不由自主的状态。[пры́гали че́рез него́]{.ru}：前置词后的 [он]{.ru} 加 [н-]{.ru}。"
