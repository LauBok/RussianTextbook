lesson: B3-L49
grammar: "礼节用语分正式和非正式：非正式用 [ты]{.ru}、小名、短句（[С днём рождения!]{.ru}、[Приходи!]{.ru}、[Пока!]{.ru}）；正式用 [вы]{.ru}、名字加父称、套语（[Разрешите поздравить вас…]{.ru}、[Позвольте пригласить…]{.ru}、[Примите…]{.ru}、[Благодарю вас]{.ru}）。[поздравлять кого с чем]{.ru}，[желать кому чего]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Какие праздники отмечают в России? Чем поздравление подруги отличается от поздравления директора? Как отвечают на «спасибо»? Что кричат гости на свадьбе? Что говорят человеку, у которого скончался кто-то из близких? Что принято брать с собой, когда идёшь в гости? Почему иностранцу лучше сначала говорить «вы»?]{.ru}"
        length: 90–130
        model: "В России отмечают Новый год, Рождество, День защитника Отечества, Международный женский день, Масленицу и День Победы, а также семейные праздники. Подругу поздравляют просто: называют её по имени в разговорной форме, говорят ей «ты» и используют короткие фразы. Директора называют по имени и отчеству, говорят ему «вы» и используют вежливые формулы: «разрешите поздравить», «примите». На «спасибо» отвечают «пожалуйста» или «не за что», а более вежливо — «рад был помочь». На свадьбе гости кричат «Горько!», и молодожёны целуются. Человеку, у которого скончался кто-то из близких, говорят: «Примите мои соболезнования». В гости принято брать небольшой подарок: торт, цветы или конфеты. Иностранцу лучше говорить «вы», потому что собеседник сам предложит перейти на «ты», если захочет."
        rubric: ["七个问题都回答，内容与课文一致", "第 2 题从称呼、[ты / вы]{.ru}、套语三方面对比", "[поздравлять кого]{.ru}、[предложить перейти на «ты»]{.ru} 用得对"]
        notes: 第 2 题用 [а]{.ru} 或两个并列的句子形成对比。第 6 题可以补充：花要送单数。

  - id: e2
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "[поздравлять кого с чем]{.ru}：被祝贺的人用第四格，节日用 [с]{.ru} + 第五格。第 1 题 [вы → вас]{.ru}，第 2 题 [день рождения → днём рождения]{.ru}，[рождения]{.ru} 不变。第 3 题 [Новый год → Новым годом]{.ru}。[желать кому чего]{.ru}：人用第三格，祝愿的内容用第二格。第 4 题 [здоровье → здоровья]{.ru}，不要写成第四格 [здоровье]{.ru}。第 5 题 [благополучие → благополучия]{.ru}。第 6 题 [приносить извинения]{.ru}，复数第四格 [извинения]{.ru}。"
    items:
      - stem: Разрешите поздравить ___ с днём рождения.
        hint: вы
        accept: ["вас"]
      - stem: Поздравляю тебя с ___!
        hint: день рождения
        accept: ["днём рождения"]
      - stem: Поздравляем всех с ___!
        hint: Новый год
        accept: ["Новым годом"]
      - stem: Желаем вам крепкого ___!
        hint: здоровье
        accept: ["здоровья"]
      - stem: Желаю вам счастья и ___.
        hint: благополучие
        accept: ["благополучия"]
      - stem: Приношу свои ___ за опоздание.
        hint: извинение
        accept: ["извинения"]

  - id: e3
    type: choice
    task: 选择适合场合的说法。
    why: "第 1 题对经理用正式的 [Всего хорошего!]{.ru}；[Пока!]{.ru}、[Счастливо!]{.ru} 只对朋友。第 2 题邀请朋友用 [Приходи]{.ru}（[ты]{.ru} 的命令式）；[Позвольте пригласить вас]{.ru} 太正式，[Будем рады видеть вас]{.ru} 用 [вы]{.ru}，对亲近的朋友显得生分。第 3 题会议上迟到，用正式的 [Прошу прощения за опоздание]{.ru}。第 4 题 [вы]{.ru} 作主语时短尾形容词用复数 [правы]{.ru}，哪怕对方只有一个人。"
    items:
      - stem: "(уходя из кабинета директора) ___"
        options: ["Пока!", "Счастливо!", "Всего хорошего!"]
        answer: Всего хорошего!
      - stem: "(лучшему другу) ___ в субботу, посидим!"
        options: ["Приходи", "Позвольте пригласить вас", "Будем рады видеть вас"]
        answer: Приходи
      - stem: "(опоздав на совещание) ___"
        options: ["Извини, я опоздал!", "Прошу прощения за опоздание.", "Ну, вот и я!"]
        answer: Прошу прощения за опоздание.
      - stem: "Николай Иванович, вы совершенно ___."
        options: [прав, правы, правый]
        answer: правы

  - id: e4
    type: rewrite
    task: 把非正式的说法改写成正式的说法（对象是不太熟悉的长辈或上级）。
    example:
      cue: Привет!
      answer: Здравствуйте!
    why: "改写时 [ты]{.ru} 换成 [вы]{.ru}，动词和代词随之变化；简单的说法换成套语。第 1 题祝贺用 [Разрешите поздравить вас с…]{.ru}，节日仍用 [с]{.ru} + 第五格。第 2 题邀请用 [Позвольте пригласить вас…]{.ru}，也可以说 [Будем рады видеть вас…]{.ru}。第 3 题感谢用 [Благодарю вас]{.ru}，“为了……”用 [за]{.ru} + 第四格。第 4 题道歉用 [Прошу прощения]{.ru}。"
    items:
      - cue: С днём рождения!
        accept: ["Разрешите поздравить вас с днём рождения!", "Позвольте поздравить вас с днём рождения!", "Поздравляю вас с днём рождения!"]
      - cue: Приходи к нам в субботу!
        accept: ["Позвольте пригласить вас к нам в субботу.", "Будем рады видеть вас у нас в субботу.", "Приглашаем вас к нам в субботу.", "Позвольте пригласить вас к нам в субботу!"]
      - cue: Спасибо за помощь!
        accept: ["Благодарю вас за помощь!", "Большое вам спасибо за помощь!", "Я вам очень признателен за помощь.", "Я вам очень признательна за помощь."]
      - cue: Извини!
        accept: ["Прошу прощения!", "Извините!", "Простите!"]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 请允许我代表全部门祝贺您新年快乐。
        accept: ["Разрешите от имени всего отдела поздравить вас с Новым годом.", "Позвольте от имени всего отдела поздравить вас с Новым годом.", "Разрешите поздравить вас с Новым годом от имени всего отдела.", "Позвольте поздравить вас с Новым годом от имени всего отдела."]
        rubric: ["[Разрешите / Позвольте]{.ru} + 不定式", "[от имени]{.ru} + 第二格", "[поздравить кого с чем]{.ru}：[вас с Новым годом]{.ru}"]
      - zh: 祝您身体健康、事业有成！
        accept: ["Желаю вам крепкого здоровья и успехов!", "Желаю вам здоровья и успехов!", "Желаем вам крепкого здоровья и успехов!", "Желаем вам здоровья и успехов!"]
        rubric: ["[желать кому чего]{.ru}：第三格 + 第二格", "[здоровья, успехов]{.ru} 用第二格"]
      - zh: 花束里花的数目应当是单数。
        accept: ["Цветов в букете должно быть нечётное число.", "В букете должно быть нечётное число цветов.", "Число цветов в букете должно быть нечётным."]
        rubric: ["[нечётное число]{.ru}", "[должно быть]{.ru}：中性，与 [число]{.ru} 一致"]
      - zh: 对您的帮助，我深表感谢。
        accept: ["Выражаю вам благодарность за помощь.", "Выражаю вам свою благодарность за помощь.", "Я вам очень признателен за помощь.", "Я вам очень признательна за помощь.", "Благодарю вас за помощь."]
        rubric: ["正式的说法：[выражать благодарность]{.ru}、[признателен]{.ru} 或 [благодарить]{.ru}", "“为了……”用 [за]{.ru} + 第四格"]

  - id: e6
    type: open
    task: 应用文：写一封正式的贺信和邀请。
    items:
      - prompt: 你所在的俄语系明年要庆祝建系 60 周年。以系学生会的名义给退休的老教授 [Мария Петровна Соколова]{.ru} 写一封信：先祝贺她即将到来的新年，表示祝愿；感谢她多年的工作；邀请她参加 6 月 10 日的周年纪念晚会；请求回复。用正式的礼节用语和信件格式（第 47 课）。
        length: 70–110
        model: "Тема: Приглашение на юбилейный вечер. Уважаемая Мария Петровна! Разрешите от имени студентов факультета русского языка поздравить вас с наступающим Новым годом. Желаем вам крепкого здоровья, счастья и благополучия. Мы выражаем вам искреннюю благодарность за многолетнюю работу: на ваших уроках выросло не одно поколение студентов. В следующем году нашему факультету исполняется 60 лет. Позвольте пригласить вас на юбилейный вечер, который состоится 10 июня. Будем очень рады видеть вас среди гостей. Не могли бы вы сообщить, сможете ли вы прийти? С уважением, студенты факультета русского языка"
        rubric: ["信件格式：主题、正式称呼（名字加父称）、落款 [С уважением,]{.ru}", "祝贺用 [поздравить кого с чем]{.ru}，祝愿用 [желать кому чего]{.ru}，格用得对", "感谢和邀请用正式套语（[выражаем благодарность]{.ru}、[Позвольте пригласить]{.ru}、[Будем рады видеть]{.ru}）", "全文用 [вы]{.ru}，没有口语词"]
        notes: "范文约 95 词。结构：主题 → 称呼 → 祝贺和祝愿 → 感谢 → 邀请（时间）→ 请求回复 → 落款。[с наступающим Новым годом]{.ru}（新年即将到来之际）是年底常用的祝贺说法，[наступающий]{.ru} 是 [наступать]{.ru} 的主动形动词。[исполняется 60 лет]{.ru}（满 60 年）用第三格 [факультету]{.ru}。[состоится]{.ru}（将举行）是邀请函的常用词。"

  - id: e7
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [чокаться чем]{.ru}：第五格复数 [бокалами]{.ru}。第 2 题 [выразить что]{.ru}：[сочувствие]{.ru} 第四格同第一格。第 3 题 [благодарить кого за что]{.ru}：[за радушный приём]{.ru}，第四格。第 4 题 [вручать что кому]{.ru}：[юбиляру]{.ru}，第三格。"
    items:
      - stem: В полночь все чокаются ___ с шампанским.
        hint: бокалы
        accept: ["бокалами"]
      - stem: В такой ситуации лучше коротко выразить ___.
        hint: сочувствие
        accept: ["сочувствие"]
      - stem: Уходя, гость благодарит хозяев за радушный ___.
        hint: приём
        accept: ["приём"]
      - stem: На юбилее ___ вручают памятные подарки.
        hint: юбиляр
        accept: ["юбиляру"]
