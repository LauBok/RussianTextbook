lesson: L99
grammar: "六格单数总表：名词（阳性硬、软，中性，阴性 [-а / -я]{.ru}、[-ь]{.ru}）、形容词（硬、软变化）、人称代词、物主代词和指示代词的单数六个格；各格的主要用法和支配它们的前置词。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成需要的形式。
    why: "先找支配这个词的动词或前置词，再定格：[из]{.ru}、[у]{.ru} 要第二格；[дать]{.ru} 给谁要第三格；[вспомина́ть]{.ru} 的补语要第四格；[с]{.ru} 表伴随要第五格；[в]{.ru} 表处所要第六格。第 2 题 [окно́]{.ru} 第二格重音移到词干：[окна́]{.ru}；第 6 题 [аэропо́рт]{.ru} 和 [в]{.ru} 连用时第六格是 [аэропорту́]{.ru}；第 7 题 [Рождество́]{.ru} 前的 [на]{.ru} 表示节日期间，要第四格，中性名词第四格同第一格。"
    items:
      - stem: Самолёт лети́т из ___ в Пеки́н.
        hint: Москва́
        accept: [Москвы́]
      - stem: Ван Лэй сиди́т у ___.
        hint: окно́
        accept: [окна́]
      - stem: Мари́я Никола́евна дала́ ___ пирожки́.
        hint: он
        accept: [ему́]
      - stem: Ван Лэй вспомина́ет ___.
        hint: ба́бушка
        accept: [ба́бушку]
      - stem: Ве́чером ба́бушка ходи́ла в це́рковь, и Ван Лэй ходи́л с ___.
        hint: она́
        accept: [ней]
      - stem: Петро́вы до́лго стоя́ли в ___.
        hint: аэропо́рт
        accept: [аэропорту́]
      - stem: На ___ он был у ба́бушки.
        hint: Рождество́
        accept: [Рождество́]
      - stem: "Под ___ Ми́ша написа́л: «Мы тебя́ ждём!»"
        hint: рису́нок
        accept: [рису́нком]

  - id: e2
    type: fill
    task: 把括号里的词组变成需要的形式。
    why: "形容词、物主代词和名词同格。阳性、中性第二格 [-ого / -его]{.ru}，第三格 [-ому / -ему]{.ru}，第五格 [-ым / -им]{.ru}，第六格 [-ом / -ем]{.ru}；阴性除第一、四格外都是 [-ой / -ей]{.ru}，第四格 [-ую / -юю]{.ru}。第 3 题 [мой друг]{.ru} 是动物名词，第四格同第二格；第 5 题 [зи́мний]{.ru} 是软变化，[-ем]{.ru} 不是 [-ом]{.ru}。"
    items:
      - stem: Передава́й приве́т ___!
        hint: на́ша ба́бушка
        accept: [на́шей ба́бушке]
      - stem: Мы е́хали в аэропо́рт на ___.
        hint: но́вая маши́на
        accept: [но́вой маши́не]
      - stem: В Москве́ я ча́сто ви́дел ___.
        hint: мой друг
        accept: [моего́ дру́га]
      - stem: О́льга Ви́кторовна поздра́вила его́ с ___.
        hint: Но́вый год
        accept: [Но́вым го́дом]
      - stem: Мы гуля́ли в ___ па́рке.
        hint: зи́мний
        accept: [зи́мнем]
      - stem: Ван Лэй никогда́ не забу́дет ___.
        hint: э́та зима́
        accept: [э́ту зи́му]
      - stem: У ___ есть ко́шка Му́рка.
        hint: на́ша семья́
        accept: [на́шей семьи́]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "同一个名词在不同前置词后用不同的格：[в Москве́]{.ru}（在哪儿，第六格）、[в Москву́]{.ru}（去哪儿，第四格）、[из Москвы́]{.ru}（从哪儿，第二格）。第三人称代词在前置词后加 [н-]{.ru}：[с ней, к нему́]{.ru}，不带前置词时不加：[ему́]{.ru}。"
    items:
      - stem: Че́рез две неде́ли он сно́ва бу́дет в ___.
        options: [Москву́, Москве́, Москвы́]
        answer: Москве́
      - stem: Че́рез две неде́ли он сно́ва пое́дет в ___.
        options: [Москву́, Москве́, Москвы́]
        answer: Москву́
      - stem: Он лети́т домо́й из ___.
        options: [Москву́, Москве́, Москвы́]
        answer: Москвы́
      - stem: Ми́ша пое́хал к ___ в дере́вню.
        options: [ба́бушка, ба́бушке, ба́бушку]
        answer: ба́бушке
      - stem: Я ча́сто ду́маю о ___.
        options: [он, его́, нём]
        answer: нём
      - stem: Ми́ша дал ___ письмо́.
        options: [ему́, нему́, его́]
        answer: ему́

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 一路顺风！代我向你妈妈问好！
        accept: ["Счастли́вого пути́! Передава́й приве́т твое́й ма́ме!", "Счастли́вого пути́! Передава́й приве́т ма́ме!", "Счастли́вого пути́! Переда́й приве́т ма́ме!", "Счастли́вого пути́! Передава́й приве́т свое́й ма́ме!", "Счастли́вого пути́! Переда́й приве́т твое́й ма́ме!"]
        rubric: ["[Счастли́вого пути́]{.ru} 是第二格", "[передава́ть приве́т]{.ru} + 第三格"]
      - zh: 谢谢你们所做的一切！我永远不会忘记这个学期。（男性说）
        accept: ["Спаси́бо вам за всё! Я никогда́ не забу́ду э́тот семе́стр.", "Спаси́бо вам за всё! Э́тот семе́стр я никогда́ не забу́ду.", "Спаси́бо за всё! Я никогда́ не забу́ду э́тот семе́стр."]
        rubric: ["[спаси́бо за]{.ru} + 第四格 [всё]{.ru}", "[никогда́ не]{.ru} + 完成体将来时 [забу́ду]{.ru}"]
      - zh: 一月七日王磊在乡下奶奶家。
        accept: ["Седьмо́го января́ Ван Лэй был у ба́бушки в дере́вне.", "Седьмо́го января́ Ван Лэй был в дере́вне у ба́бушки.", "Ван Лэй седьмо́го января́ был у ба́бушки в дере́вне.", "Седьмо́го января́ Ван Лэй был у ба́бушки в дере́вне на Рождество́."]
        rubric: ["日期用第二格 [седьмо́го января́]{.ru}", "“在某人家”用 [у]{.ru} + 第二格", "[в дере́вне]{.ru} 第六格"]
      - zh: 玛丽亚·尼古拉耶夫娜给了他路上吃的小馅饼。
        accept: ["Мари́я Никола́евна дала́ ему́ пирожки́ в доро́гу.", "Мари́я Никола́евна дала́ ему́ в доро́гу пирожки́."]
        rubric: ["[дать]{.ru} 的过去时阴性 [дала́]{.ru}，重音在词尾", "给谁用第三格 [ему́]{.ru}"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 题目：“我的第一个学期”。假设你是王磊，在飞机上回忆在莫斯科的这几个月：住在哪儿、认识了谁、去过哪些地方、过了哪些节日、最难忘的是什么。尽量用到六个格。
        length: 100–150
        model: |
          В сентябре́ я пе́рвый раз был в Москве́. Я жил в семье́ Ива́на Серге́евича Петро́ва. Мари́я Никола́евна рабо́тает в поликли́нике, а их дочь А́нна у́чится со мной в университе́те. На Но́вый год я подари́л Ми́ше футбо́лку с драко́ном, а он подари́л мне рису́нок. С А́нной мы ходи́ли в теа́тр, в музе́й и на като́к. В декабре́ я е́здил в Петербу́рг. Рождество́ я встреча́л у ба́бушки в дере́вне. Тепе́рь я лечу́ домо́й. Я никогда́ не забу́ду э́тот семе́стр.
        rubric: ["按时间顺序：九月—十二月—一月", "六个格都要用到，形容词和名词同格", "过去时的体用对：反复用未完成体，一次的结果用完成体", "最后一句落到现在"]
        notes: 范文按时间顺序写，先交代住处和人物，再写和他们一起做的事，最后写节日和回家。全文用到了六个格：第一格作主语 [я, А́нна]{.ru}，第二格 [Ива́на Серге́евича Петро́ва]{.ru}，第三格 [Ми́ше, мне]{.ru}，第四格 [футбо́лку, в теа́тр, на като́к]{.ru}，第五格 [с драко́ном, со мной, с А́нной]{.ru}，第六格 [в Москве́, в семье́, в поликли́нике]{.ru}。[у ба́бушки]{.ru}“在奶奶家”用 [у]{.ru} 加第二格。
