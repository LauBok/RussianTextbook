lesson: L83
grammar: "[е́сли]{.ru} 引导条件从句；说将来的条件，从句和主句都用将来时；主句可用命令式；经常性的条件用现在时；[е́сли]{.ru} 与 [когда́]{.ru} 的区别。"
exercises:

  - id: e1
    type: fill
    task: 用括号里动词的将来时填空。
    why: 条件说的是将来，[е́сли]{.ru} 从句也必须用将来时，不能像英语那样用现在时。持续的动作用 [бу́ду + 不定式]{.ru}，一次性的、有结果的动作用完成体将来时。没有动词的句子用 [бу́дет]{.ru}。
    items:
      - stem: Е́сли за́втра ___ дождь, мы бу́дем до́ма.
        hint: быть
        accept: [бу́дет]
      - stem: Е́сли ты ___, ты бу́дешь лежа́ть в посте́ли.
        hint: заболе́ть
        accept: [заболе́ешь]
      - stem: Е́сли я ___ горя́чий чай, всё бу́дет хорошо́.
        hint: вы́пить
        accept: [вы́пью]
      - stem: Е́сли бу́дет снег, мы ___ на лы́жах.
        hint: ката́ться
        accept: [бу́дем ката́ться]
      - stem: Е́сли вы ___ в го́род, возьми́те зонт.
        hint: пойти́
        accept: [пойдёте]
      - stem: Е́сли ты ___ ра́но, позвони́ мне.
        hint: встать
        accept: [вста́нешь]

  - id: e2
    type: choice
    task: 选择 [е́сли]{.ru} 或 [когда́]{.ru}。
    why: "肯定会发生的事用 [когда́]{.ru}，只说时间；可能发生、也可能不发生的事用 [е́сли]{.ru}。第 1 题“起床”每天都会发生；第 2、4 题天气和生病不一定；第 3 题“吃早饭的时候”说的是同时进行的两个动作；第 5 题“起得早”不一定做到。"
    items:
      - stem: ___ я вста́ну, я позвоню́ тебе́.
        options: [Когда́, Е́сли]
        answer: Когда́
      - stem: ___ за́втра бу́дет хоро́шая пого́да, мы пое́дем к ба́бушке.
        options: [Когда́, Е́сли]
        answer: Е́сли
      - stem: ___ я за́втракаю, я слу́шаю ра́дио.
        options: [Когда́, Е́сли]
        answer: Когда́
      - stem: ___ ты заболе́ешь, ты не пое́дешь к ба́бушке.
        options: [Когда́, Е́сли]
        answer: Е́сли
      - stem: ___ я вста́ну ра́но, я пойду́ в бассе́йн.
        options: [Когда́, Е́сли]
        answer: Е́сли

  - id: e3
    type: rewrite
    task: 按例句用 [е́сли]{.ru} 改写，说的是将来。
    example:
      cue: бу́дет дождь / мы бу́дем сиде́ть до́ма
      answer: Е́сли бу́дет дождь, мы бу́дем сиде́ть до́ма.
    why: 两部分都用将来时，从句在前，中间用逗号隔开。第 3 题主句是命令式，从句仍用将来时。
    items:
      - cue: бу́дет снег / мы пое́дем к ба́бушке
        accept: ["Е́сли бу́дет снег, мы пое́дем к ба́бушке."]
      - cue: у меня́ бу́дет вре́мя / я пойду́ в кино́
        accept: ["Е́сли у меня́ бу́дет вре́мя, я пойду́ в кино́.", "Е́сли у меня́ бу́дет вре́мя, пойду́ в кино́."]
      - cue: вы пойдёте в го́род / возьми́те зонт
        accept: ["Е́сли вы пойдёте в го́род, возьми́те зонт.", "Е́сли пойдёте в го́род, возьми́те зонт."]
      - cue: ты заболе́ешь / ты бу́дешь лежа́ть в посте́ли
        accept: ["Е́сли ты заболе́ешь, ты бу́дешь лежа́ть в посте́ли.", "Е́сли ты заболе́ешь, бу́дешь лежа́ть в посте́ли."]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 如果明天下雨，我们就待在家里。
        accept: ["Е́сли за́втра бу́дет дождь, мы бу́дем до́ма.", "Е́сли за́втра бу́дет дождь, мы бу́дем сиде́ть до́ма.", "Мы бу́дем до́ма, е́сли за́втра бу́дет дождь.", "Мы бу́дем сиде́ть до́ма, е́сли за́втра бу́дет дождь.", "Е́сли за́втра пойдёт дождь, мы бу́дем до́ма.", "Е́сли за́втра пойдёт дождь, мы бу́дем сиде́ть до́ма."]
        rubric: ["从句用将来时 [бу́дет]{.ru} 或 [пойдёт]{.ru}，不能用 [идёт]{.ru}", "主句用将来时 [бу́дем]{.ru}"]
      - zh: 要是去城里，就带上伞。
        accept: ["Е́сли пойдёшь в го́род, возьми́ зонт.", "Е́сли ты пойдёшь в го́род, возьми́ зонт.", "Е́сли пойдёте в го́род, возьми́те зонт.", "Е́сли вы пойдёте в го́род, возьми́те зонт.", "Возьми́ зонт, е́сли пойдёшь в го́род.", "Возьми́те зонт, е́сли пойдёте в го́род."]
        rubric: ["从句用完成体将来时 [пойдёшь / пойдёте]{.ru}", "主句用命令式 [возьми́ / возьми́те]{.ru}，人称和从句一致"]
      - zh: 如果你病了，就得躺在床上。
        accept: ["Е́сли ты заболе́ешь, ты бу́дешь лежа́ть в посте́ли.", "Е́сли ты заболе́ешь, бу́дешь лежа́ть в посте́ли.", "Е́сли заболе́ешь, бу́дешь лежа́ть в посте́ли.", "Е́сли ты заболе́ешь, тебе́ на́до бу́дет лежа́ть в посте́ли."]
        rubric: ["“病了”指将来的一次，用完成体 [заболе́ешь]{.ru}", "“躺在床上”用 [лежа́ть в посте́ли]{.ru}"]
      - zh: 每逢下雨，我就待在家里。
        accept: ["Е́сли идёт дождь, я сижу́ до́ма.", "Е́сли идёт дождь, я до́ма.", "Когда́ идёт дождь, я сижу́ до́ма.", "Когда́ идёт дождь, я до́ма."]
        rubric: ["经常性的条件，两部分都用现在时", "也可用 [когда́]{.ru}"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你和朋友商量周末做什么。天气预报说可能下雪，也可能下雨。用 [е́сли]{.ru} 说出不同天气下的打算，至少用四个 [е́сли]{.ru} 从句。
        length: 50–90
        model: |-
          — Что ты бу́дешь де́лать в суббо́ту?
          — Не зна́ю. Е́сли бу́дет снег, я пое́ду в парк ката́ться на лы́жах. Хо́чешь со мной?
          — Хочу́! А е́сли бу́дет дождь?
          — Е́сли бу́дет дождь, мы пойдём в кино́.
          — Хорошо́. Е́сли ты вста́нешь ра́но, позвони́ мне.
          — Ла́дно. А е́сли ты заболе́ешь, я пойду́ в кино́ с А́нной!
        rubric: ["至少四个 [е́сли]{.ru} 从句", "从句说将来，用将来时", "可以用 [А е́сли…?]{.ru} 追问"]
        notes: 对话从提问开始，然后分别讨论下雪、下雨两种情况，最后约定联系方式，用一句玩笑收尾。每个 [е́сли]{.ru} 从句都用将来时：[бу́дет, вста́нешь, заболе́ешь]{.ru}。主句可以是将来时，也可以是命令式（[позвони́ мне]{.ru}）。
