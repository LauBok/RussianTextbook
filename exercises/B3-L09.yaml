lesson: B3-L09
grammar: "被动结构：完成体短尾被动形动词（[был запу́щен]{.ru}，强调结果）；未完成体 [-ся]{.ru} 动词（[полёты гото́вились]{.ru}，强调过程）；不定人称句（[его́ арестова́ли]{.ru}，不说发出者）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как в газетах называли Королёва при его жизни? Чем он увлёкся ещё школьником? Что произошло с ним в 1938 году? Какие события произошли в космонавтике с 1957 по 1965 год? Сколько времени летал первый спутник? Как сегодня помнят Королёва?]{.ru}"
        length: 70–110
        model: "При жизни Королёва его имя не называлось, в газетах его называли просто «Главный конструктор». Ещё школьником он увлёкся авиацией: строил модели самолётов и в семнадцать лет разработал проект планёра. В 1938 году его арестовали и отправили на Колыму, а потом перевели в закрытое конструкторское бюро. В 1957 году был запущен первый искусственный спутник Земли, в 1961 году состоялся полёт Гагарина, в 1963 году в космосе побывала Валентина Терешкова, а в 1965 году Алексей Леонов вышел в открытый космос. Первый спутник летал вокруг Земли девяносто два дня, а потом сгорел в атмосфере. Сегодня имя Королёва носят город в Подмосковье и кратер на Луне."
        rubric: ["六个问题都回答，内容与课文一致", "至少用两种不同的被动结构", "用完整的句子"]
        notes: "第 4 题按时间顺序列出事件，年份要准确。范文用了三种被动结构：[-ся]{.ru} 动词 [не называлось]{.ru}，不定人称句 [его арестовали]{.ru}，短尾被动形动词 [был запущен]{.ru}。"

  - id: e2
    type: rewrite
    task: 把主动句改成带短尾被动形动词的被动句（完成体）或带 [-ся]{.ru} 的被动句（未完成体）。
    example:
      cue: Конструкторы создали ракету Р-7.
      answer: Ракета Р-7 была создана конструкторами.
    why: "先看动词的体：完成体 → 短尾被动形动词，[быть]{.ru} 与新主语一致；未完成体 → [-ся]{.ru} 动词，与新主语一致。第 1 题 [запустили]{.ru} 完成体，原句是不定人称句，被动句不加发出者：[спутник был запущен]{.ru}。第 2 题 [готовили]{.ru} 未完成体 → [полёты готовились]{.ru}，复数。第 3 题 [вели]{.ru} 未完成体 → [работы велись]{.ru}。第 4 题 [освободили]{.ru} 完成体，[освободить]{.ru} 有 [д → жд]{.ru} 交替 → [был освобождён]{.ru}。第 5 题 [строят]{.ru} 未完成体现在时 → [строятся]{.ru}。"
    items:
      - cue: 4 октября 1957 года запустили первый спутник.
        accept: ["4 октября 1957 года был запущен первый спутник.", "Первый спутник был запущен 4 октября 1957 года."]
      - cue: Эти полёты готовили в конструкторском бюро Королёва.
        accept: ["Эти полёты готовились в конструкторском бюро Королёва."]
      - cue: Работы вели в строгой тайне.
        accept: ["Работы велись в строгой тайне."]
      - cue: В 1944 году Королёва освободили.
        accept: ["В 1944 году Королёв был освобождён.", "Королёв был освобождён в 1944 году."]
      - cue: В этом городе строят космические корабли.
        accept: ["В этом городе строятся космические корабли."]

  - id: e3
    type: rewrite
    task: 把被动句改成不定人称句。
    example:
      cue: Королёв был похоронен у Кремлёвской стены.
      answer: Королёва похоронили у Кремлёвской стены.
    why: "不定人称句没有主语，动词用复数（过去时用复数形式）。原来的主语变成第四格宾语，常放在句首。第 1 题 [Королёв → Королёва]{.ru}，动物名词第四格同第二格；[арестовать]{.ru} 完成体 → [арестовали]{.ru}。第 2 题 [имя]{.ru} 中性，第四格同第一格；[называлось]{.ru} 未完成体 → [называли]{.ru}。第 3 题 [полёт]{.ru} 第四格同第一格，[был подготовлен → подготовили]{.ru}。第 4 题 [спутник]{.ru} 非动物名词，第四格同第一格。"
    items:
      - cue: В 1938 году Королёв был арестован.
        accept: ["В 1938 году Королёва арестовали.", "Королёва арестовали в 1938 году."]
      - cue: Имя Главного конструктора не называлось.
        accept: ["Имя Главного конструктора не называли."]
      - cue: Полёт был подготовлен очень быстро.
        accept: ["Полёт подготовили очень быстро."]
      - cue: Первый спутник был запущен с Байконура.
        accept: ["Первый спутник запустили с Байконура."]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题有 [несколько лет]{.ru} 表示过程，用未完成体 [-ся]{.ru} 动词 [строилась]{.ru}；[была построена]{.ru} 表示结果，不和“几年”连用。第 2 题有具体日期，说的是一次完成的结果，句中又没有主语，用完成体短尾 [был запущен]{.ru}；长尾 [запущенный]{.ru} 只能作定语；[запустил]{.ru} 需要主语（谁发射的），句中没有。第 3 题句中有第五格发出者 [конструкторами]{.ru}，不能用不定人称句 [создали]{.ru}、[создавали]{.ru}，要用被动句 [была создана]{.ru}。第 4 题不定人称句动词用复数 [похоронили]{.ru}；[похоронил]{.ru} 是单数，意思变成某一个男人安葬了他。"
    items:
      - stem: Ракета ___ несколько лет.
        options: [была построена, строилась, построили]
        answer: строилась
      - stem: 4 октября 1957 года ___ первый спутник.
        options: [был запущен, запущенный, запустил]
        answer: был запущен
      - stem: Ракета Р-7 ___ конструкторами под руководством Королёва.
        options: [создали, была создана, создавали]
        answer: была создана
      - stem: Королёва ___ у Кремлёвской стены.
        options: [похоронил, похоронили, похоронен]
        answer: похоронили

  - id: e5
    type: translate
    task: 翻译下列句子，用括号里指定的被动结构。
    items:
      - zh: 第一颗人造地球卫星是 1957 年发射的。（短尾被动形动词）
        accept: ["Первый искусственный спутник Земли был запущен в 1957 году.", "В 1957 году был запущен первый искусственный спутник Земли."]
        rubric: ["[был запущен]{.ru}：完成体短尾，阳性，与 [спутник]{.ru} 一致", "[искусственный спутник Земли]{.ru}"]
      - zh: 所有的飞行都是在他的设计局里准备的。（[-ся]{.ru} 动词）
        accept: ["Все полёты готовились в его конструкторском бюро.", "Все полёты готовились в его бюро.", "Все полёты готовились в конструкторском бюро, которым он руководил."]
        rubric: ["[готовились]{.ru}：未完成体 [-ся]{.ru} 动词，复数", "[в конструкторском бюро]{.ru}：[бюро]{.ru} 不变格"]
      - zh: 报纸上称他为“总设计师”。（不定人称句）
        accept: ["В газетах его называли «Главный конструктор».", "В газетах его называли «Главным конструктором».", "Газеты называли его «Главный конструктор».", "Его в газетах называли «Главный конструктор».", "Его в газетах называли «Главным конструктором»."]
        rubric: ["不定人称句：动词复数 [называли]{.ru}，没有主语", "[называть кого кем]{.ru}；带引号的称呼也可以保留第一格"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：名字保密；青年时代和第一枚火箭；被捕和获释；卫星和载人飞行；去世和纪念。每项一到两句，保留关键年份，三种被动结构都要用到。
        length: 120–150
        model: "Имя человека, под руководством которого готовился полёт Гагарина, при жизни не называлось: его называли просто «Главный конструктор». Сергей Королёв родился в 1907 году. Ещё школьником он увлёкся авиацией, а потом ракетами. В 1931 году в Москве была создана группа энтузиастов, которой он потом стал руководить, и через два года была запущена первая ракета группы. В 1938 году Королёва арестовали, и только в 1944 году он был освобождён. После войны под его руководством была создана ракета Р-7. В 1957 году с её помощью был запущен первый искусственный спутник Земли: его запуск поразил весь мир, а в 1961 году в космос полетел Гагарин. Все эти полёты готовились в бюро Королёва. Он умер в 1966 году, и только тогда в газетах было названо его имя. Его похоронили у Кремлёвской стены. Сегодня его имя носит город в Подмосковье."
        rubric: ["提纲五项都有，顺序与课文一致", "年份准确：1907、1938、1944、1957、1961、1966", "三种被动结构都用到，体和一致关系正确", "120–150 词"]
        notes: "范文约 125 词。[-ся]{.ru} 动词：[готовился]{.ru}、[не называлось]{.ru}、[готовились]{.ru}；不定人称句：[его называли]{.ru}、[Королёва арестовали]{.ru}、[Его похоронили]{.ru}；短尾被动形动词：[была создана]{.ru}、[была запущена]{.ru}、[был освобождён]{.ru}、[был запущен]{.ru}、[было названо]{.ru}。[с её помощью]{.ru}（借助它）指借助 R-7 火箭。"

  - id: e7
    type: choice
    task: 选择适当的词填空。
    why: "第 1 题卫星绕地球转圈是 [оборот]{.ru}，[1440]{.ru} 后面用复数第二格 [оборотов]{.ru}。第 2 题“在大气层中烧毁”是 [сгорел]{.ru}；[сгореть]{.ru} 是不及物动词，主语是 [спутник]{.ru}。第 3 题“进入语言”用 [войти в язык]{.ru}，中性主语 [слово]{.ru} → [вошло]{.ru}。第 4 题“激励（人们）”是 [вдохновить]{.ru}；[поразить]{.ru} 是“使震惊”，[сгореть]{.ru} 是“烧毁”，都不合句意。第 5 题 [потомки]{.ru} 后代：“联盟号”是 R-7 发展出来的后代型号。"
    items:
      - stem: Спутник сделал вокруг Земли 1440 ___.
        options: [оборотов, гонок, семейств]
        answer: оборотов
      - stem: Через девяносто два дня спутник ___ в атмосфере.
        options: [сгорел, поразил, собрал]
        answer: сгорел
      - stem: Русское слово «спутник» сразу ___ во многие языки мира.
        options: [вошло, вошёл, вошли]
        answer: вошло
      - stem: Королёв умел собрать вокруг себя сильных людей и ___ их.
        options: [поразить, вдохновить, сгореть]
        answer: вдохновить
      - stem: Ракеты «Союз» — ___ Р-7.
        options: [потомки, организаторы, обороты]
        answer: потомки
