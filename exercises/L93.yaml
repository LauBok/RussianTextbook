lesson: L93
grammar: "[собира́ться]{.ru} + 不定式表示打算做某事，具体一次的事用完成体不定式，持续或反复的活动用未完成体；口语里运动动词可以省去（[Мы собира́емся к ба́бушке]{.ru}）；[на]{.ru} + 第四格表示预定的期限和节日。"
exercises:

  - id: e1
    type: fill
    task: 用 [собира́ться]{.ru} 的正确形式填空。
    why: "[собира́ться]{.ru} 是第一变位动词，词尾和 [чита́ть]{.ru} 一样，只是后面加 [-ся / -сь]{.ru}：辅音后（[собира́ешься, собира́ется, собира́ются]{.ru}）加 [-ся]{.ru}，元音后（[собира́юсь, собира́етесь]{.ru}）加 [-сь]{.ru}。注意 [ты]{.ru} 的形式写成 [-ешься]{.ru}，[ь]{.ru} 不能丢。第 6 题有 [вчера́]{.ru}，用过去时，主语是阴性。"
    items:
      - stem: Я ___ пое́хать домо́й.
        hint: собира́ться
        accept: [собира́юсь]
      - stem: Что ты ___ де́лать в суббо́ту?
        hint: собира́ться
        accept: [собира́ешься]
      - stem: А́нна ___ пое́хать в Петербу́рг.
        hint: собира́ться
        accept: [собира́ется]
      - stem: Куда́ вы ___ на кани́кулы?
        hint: собира́ться
        accept: [собира́етесь]
      - stem: Ми́ша и па́па ___ к ба́бушке.
        hint: собира́ться
        accept: [собира́ются]
      - stem: Вчера́ ма́ма ___ купи́ть ёлку, но не купи́ла.
        hint: собира́ться
        accept: [собира́лась]

  - id: e2
    type: choice
    task: 选择合适的不定式。
    why: "打算完成一件具体的事（买一次、写一封、去一趟）用完成体：[купи́ть, написа́ть, пое́хать]{.ru}。打算从事一段时间的活动或经常做的事用未完成体：[занима́ться]{.ru}、[ката́ться]{.ru}；第 4 题有 [ка́ждый день]{.ru}，说的是天天要做的事，所以用 [чита́ть]{.ru}；第 3 题 [с утра́ до ве́чера]{.ru} 也是持续的活动；[собира́ться]{.ru} 后面只能接不定式，不能接过去时形式 [ката́лся]{.ru}。"
    items:
      - stem: За́втра я собира́юсь ___ биле́т.
        options: [покупа́ть, купи́ть]
        answer: купи́ть
      - stem: Ван Лэй собира́ется ___ письмо́ Ми́ше.
        options: [писа́ть, написа́ть]
        answer: написа́ть
      - stem: Ми́ша собира́ется ___ с горы́ с утра́ до ве́чера.
        options: [ката́ться, ката́лся]
        answer: ката́ться
      - stem: На кани́кулах Ми́ша собира́ется ка́ждый день ___ «Капита́нскую до́чку».
        options: [чита́ть, прочита́ть]
        answer: чита́ть
      - stem: В суббо́ту мы собира́емся ___ в Петербу́рг.
        options: [е́здить, пое́хать]
        answer: пое́хать

  - id: e3
    type: rewrite
    task: 按例句用 [собира́ться]{.ru} 说出每个人的计划。
    placeholder: … собира́ется …
    example:
      cue: Ми́ша / пое́хать к ба́бушке / на неде́лю
      answer: Ми́ша собира́ется пое́хать к ба́бушке на неде́лю.
    why: "[собира́ться]{.ru} 的人称跟着主语变，不定式不变。[на неде́лю]{.ru}、[на две неде́ли]{.ru}、[на Рождество́]{.ru} 都是 [на]{.ru} + 第四格，表示打算待多久、为哪个节日去；[неде́ля]{.ru} 在 [на]{.ru} 后变成 [неде́лю]{.ru}，在 [две]{.ru} 后用单数第二格 [неде́ли]{.ru}。"
    items:
      - cue: Ван Лэй / пое́хать в Пеки́н / на две неде́ли
        accept: [Ван Лэй собира́ется пое́хать в Пеки́н на две неде́ли.]
      - cue: А́нна / пое́хать в Петербу́рг / на неде́лю
        accept: [А́нна собира́ется пое́хать в Петербу́рг на неде́лю.]
      - cue: мы / пое́хать к ба́бушке / на Рождество́
        accept: [Мы собира́емся пое́хать к ба́бушке на Рождество́.]
      - cue: я / пое́хать домо́й / на кани́кулы
        accept: [Я собира́юсь пое́хать домо́й на кани́кулы.]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 你们一月份打算做什么？
        accept: ["Что вы собира́етесь де́лать в январе́?", "В январе́ что вы собира́етесь де́лать?", "Что вы собира́етесь в январе́ де́лать?", "Что вы в январе́ собира́етесь де́лать?"]
        rubric: ["[собира́етесь]{.ru} 后用不定式 [де́лать]{.ru}", "“一月份”用 [в январе́]{.ru}"]
      - zh: 我打算回家两个星期。
        accept: ["Я собира́юсь пое́хать домо́й на две неде́ли.", "Я собира́юсь домо́й на две неде́ли.", "Я собира́юсь на две неде́ли пое́хать домо́й.", "Я собира́юсь пое́хать на две неде́ли домо́й.", "Я собира́юсь на две неде́ли домо́й."]
        rubric: ["[собира́юсь]{.ru} + 完成体 [пое́хать]{.ru}，也可以省去不定式", "预定的期限用 [на две неде́ли]{.ru}"]
      - zh: 考完试安娜想去彼得堡。
        accept: ["По́сле се́ссии А́нна хо́чет пое́хать в Петербу́рг.", "А́нна по́сле се́ссии хо́чет пое́хать в Петербу́рг.", "А́нна хо́чет пое́хать в Петербу́рг по́сле се́ссии.", "По́сле экза́менов А́нна хо́чет пое́хать в Петербу́рг.", "А́нна по́сле экза́менов хо́чет пое́хать в Петербу́рг.", "А́нна хо́чет пое́хать в Петербу́рг по́сле экза́менов.", "По́сле се́ссии А́нна собира́ется пое́хать в Петербу́рг.", "А́нна по́сле се́ссии собира́ется пое́хать в Петербу́рг.", "А́нна собира́ется пое́хать в Петербу́рг по́сле се́ссии.", "По́сле экза́менов А́нна собира́ется пое́хать в Петербу́рг.", "А́нна по́сле экза́менов собира́ется пое́хать в Петербу́рг.", "А́нна собира́ется пое́хать в Петербу́рг по́сле экза́менов."]
        rubric: ["[по́сле]{.ru} + 第二格", "[в Петербу́рг]{.ru} 用第四格表示方向"]
      - zh: 米沙帮奶奶干活。
        accept: ["Ми́ша помога́ет ба́бушке.", "Ми́ша помога́ет ба́бушке по до́му."]
        rubric: ["[помога́ть]{.ru} 要求第三格 [ба́бушке]{.ru}，不是 [ба́бушку]{.ru}"]

  - id: e5
    type: open
    task: 缩写。
    items:
      - prompt: 按下面的问题回答，连成一段话：一月份米沙打算做什么？安娜打算做什么？王磊什么时候、去哪儿、去多久？伊万·谢尔盖耶维奇和玛丽亚·尼古拉耶夫娜打算什么时候去奶奶家？
        length: 50–80
        model: |
          У Ми́ши шко́льные кани́кулы. Он собира́ется пое́хать к ба́бушке в дере́вню. Там он бу́дет ката́ться с горы́ и чита́ть «Капита́нскую до́чку». У А́нны ско́ро се́ссия, сейча́с она́ собира́ется занима́ться, а по́сле се́ссии хо́чет пое́хать в Петербу́рг. Ван Лэй собира́ется пое́хать в Пеки́н на две неде́ли. Кани́кулы начина́ются в конце́ января́. Ива́н Серге́евич и Мари́я Никола́евна собира́ются к ба́бушке седьмо́го января́, на Рождество́.
        rubric: ["每个人的计划至少用一次 [собира́ться]{.ru}，人称形式正确", "用对 [на две неде́ли]{.ru}、[на Рождество́]{.ru}", "对话改成叙述：第一、二人称改成第三人称"]
        notes: 缩写时把对话里的“我打算”改成第三人称“他（她）打算”，按人物一个一个写。各人计划之外，适当补一句背景（米沙在放假、安娜快考试了），段落就不只是罗列。
