lesson: L73
grammar: "完成体运动动词 [пойти́]{.ru}、[пое́хать]{.ru}：将来时表示将要去，过去时表示已经动身去了，[пойдём! пое́дем!]{.ru} 表示邀请。"
exercises:

  - id: e1
    type: fill
    task: 写出 [пойти́]{.ru} 或 [пое́хать]{.ru} 的将来时形式。
    why: "[пойти́]{.ru} 变位时 [и]{.ru} 变成 [й]{.ru}：[пойду́, пойдёшь…]{.ru}，重音在词尾。[пое́хать]{.ru} 的变位和 [е́хать]{.ru} 一样，只是前面加 [по-]{.ru}：[пое́ду, пое́дешь…]{.ru}，重音始终在 [-е́-]{.ru} 上。这些形式表示将来，不表示现在。"
    items:
      - stem: За́втра мы ___ в Петербу́рг.
        hint: пое́хать
        accept: ["пое́дем"]
      - stem: В пя́тницу я ___ в Эрмита́ж.
        hint: пойти́
        accept: ["пойду́"]
      - stem: За́втра ты ___ в шко́лу.
        hint: пойти́
        accept: ["пойдёшь"]
      - stem: Как вы ___ на вокза́л?
        hint: пое́хать
        accept: ["пое́дете"]
      - stem: Студе́нты ___ на «Сапса́не».
        hint: пое́хать
        accept: ["пое́дут"]
      - stem: Ве́чером А́нна ___ в кино́.
        hint: пойти́
        accept: ["пойдёт"]
  - id: e2
    type: choice
    task: 选择正确的动词形式。
    why: 第 1 题人现在不在，只是出发了，用 [пошла́]{.ru}；第 2 题人已经回来，是去了一趟，用 [е́здил]{.ru}。第 3 题是将来的一次出行，用 [пое́дем]{.ru}；第 4 题是将来经常去，用 [бу́ду ходи́ть]{.ru}。第 5 题邀请对方一起去，用 [Пойдём]{.ru}。第 6 题去别的城市，只能用乘车的 [пое́дет]{.ru}。
    items:
      - stem: — Где ма́ма? — Она́ ___ в магази́н.
        options: [пошла́, ходи́ла]
        answer: пошла́
      - stem: — Где ты был у́тром? — Я ___ на рабо́ту.
        options: [пое́хал, е́здил]
        answer: е́здил
      - stem: В воскресе́нье ве́чером мы ___ домо́й.
        options: [пое́дем, е́здим]
        answer: пое́дем
      - stem: Зимо́й я ___ в бассе́йн ка́ждую суббо́ту.
        options: [пойду́, бу́ду ходи́ть]
        answer: бу́ду ходи́ть
      - stem: ___ в кафе́! Я хочу́ пить ко́фе.
        options: [Пойдём, Хо́дим]
        answer: Пойдём
      - stem: Ле́том А́нна ___ в Пеки́н.
        options: [пойдёт, пое́дет]
        answer: пое́дет

  - id: e3
    type: rewrite
    task: 按例句回答问题，用 [пойти́]{.ru} 或 [пое́хать]{.ru} 说明明天的打算。
    example:
      cue: Вы бы́ли сего́дня в музе́е? (за́втра)
      answer: Нет, мы пойдём в музе́й за́втра.
    why: "[бы́ли в музе́е]{.ru}（[где]{.ru}，第六格）改成 [пойдём в музе́й]{.ru}（[куда́]{.ru}，第四格）。本市里步行能到的地方用 [пойти́]{.ru}；别的城市、别墅、乘车去的地方用 [пое́хать]{.ru}。人称跟问句里的主语对应：问 [вы]{.ru} 答 [мы]{.ru}，问 [ты]{.ru} 答 [я]{.ru}。"
    items:
      - cue: Ты был сего́дня в библиоте́ке? (за́втра)
        accept: ["Нет, я пойду́ в библиоте́ку за́втра.", "Нет, за́втра я пойду́ в библиоте́ку."]
      - cue: Вы бы́ли сего́дня в Эрмита́же? (за́втра)
        accept: ["Нет, мы пойдём в Эрмита́ж за́втра.", "Нет, за́втра мы пойдём в Эрмита́ж."]
      - cue: Па́па был сего́дня на да́че? (за́втра)
        accept: ["Нет, он пое́дет на да́чу за́втра.", "Нет, за́втра он пое́дет на да́чу.", "Нет, па́па пое́дет на да́чу за́втра.", "Нет, за́втра па́па пое́дет на да́чу."]
      - cue: Ты была́ сего́дня на уро́ке? (за́втра)
        accept: ["Нет, я пойду́ на уро́к за́втра.", "Нет, за́втра я пойду́ на уро́к."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、4 题是将来的一次出行；第 2 题说人出发了、现在不在；第 3 题是邀请。
    items:
      - zh: 明天我们坐火车去彼得堡。
        accept: ["За́втра мы пое́дем в Петербу́рг на по́езде.", "За́втра мы пое́дем на по́езде в Петербу́рг.", "Мы пое́дем в Петербу́рг на по́езде за́втра.", "За́втра мы е́дем в Петербу́рг на по́езде.", "За́втра мы е́дем на по́езде в Петербу́рг.", "Мы пое́дем на по́езде в Петербу́рг за́втра.", "Мы за́втра пое́дем в Петербу́рг на по́езде."]
        rubric: ["用 [пое́дем]{.ru}（或表示已安排的 [е́дем]{.ru}）", "[в Петербу́рг]{.ru} 用第四格", "[на по́езде]{.ru} 用第六格"]
      - zh: ——米沙在哪儿？——他上学去了。
        accept: ["— Где Ми́ша? — Он пошёл в шко́лу.", "— Где Ми́ша? — Ми́ша пошёл в шко́лу.", "— Где Ми́ша? — Пошёл в шко́лу."]
        rubric: ["人现在不在，用 [пошёл]{.ru}", "不能用 [ходи́л]{.ru}，那表示已经回来"]
      - zh: 我们一起去咖啡馆吧！
        accept: ["Пойдём вме́сте в кафе́!", "Пойдём в кафе́ вме́сте!", "Пойдёмте вме́сте в кафе́!", "Пойдёмте в кафе́ вме́сте!"]
        rubric: ["邀请用 [пойдём]{.ru} 或 [пойдёмте]{.ru}"]
      - zh: 星期六安娜去埃尔米塔日。
        accept: ["В суббо́ту А́нна пойдёт в Эрмита́ж.", "А́нна пойдёт в Эрмита́ж в суббо́ту.", "В суббо́ту А́нна идёт в Эрмита́ж.", "А́нна идёт в Эрмита́ж в суббо́ту."]
        rubric: ["将来的一次出行用 [пойдёт]{.ru}（或表示已安排的 [идёт]{.ru}）", "[в суббо́ту]{.ru} 用第四格"]

  - id: e5
    type: open
    task: 写一写你下个周末的打算：去哪儿、怎么去、和谁去、在那儿做什么。
    items:
      - prompt: 用上 [пойти́]{.ru} 或 [пое́хать]{.ru} 的将来时，至少三次。
        length: 50–80
        model: "В суббо́ту я пое́ду на да́чу. Я пое́ду туда́ на маши́не вме́сте с па́пой. Там мы бу́дем гуля́ть в лесу́. Ве́чером мы пое́дем домо́й. В воскресе́нье я пойду́ в кино́ с А́нной. Пото́м мы пойдём в кафе́ и бу́дем пить чай."
        rubric: ["至少三次用 [пойти́ / пое́хать]{.ru} 的将来时", "步行和乘车区分正确", "[куда́]{.ru} 用 [в / на]{.ru} 加第四格", "[с]{.ru} 加第五格表示和谁一起"]
        notes: 范文按星期六、星期天两天写，每一次出行用一个 [пое́ду]{.ru} 或 [пойду́]{.ru}，在那儿做的事用 [бу́ду]{.ru} 加不定式（[бу́дем гуля́ть]{.ru}、[бу́дем пить]{.ru}），这样将来时的两种形式各有分工：完成体说“去”，未完成体说“在那儿做什么”。去别墅坐车用 [пое́ду]{.ru}，去电影院、咖啡馆在本市步行用 [пойду́]{.ru}。
