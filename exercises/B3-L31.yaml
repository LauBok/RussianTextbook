lesson: B3-L31
grammar: "简单句的语序与实义切分：已知信息（主位）在前，新信息（述位）在句末；主语是新信息时放在动词后面；宾语可以作主位放在句首，主语靠词尾和动词的性、数判断。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Откуда мы знаем о ранней истории Руси? Почему Киев был важным городом? Кто из русских князей первым принял христианство? Как, по летописи, князь Владимир выбирал веру? Как изменилась жизнь Руси после Крещения? Что такое берестяные грамоты и кто их писал?]{.ru}"
        length: 70–110
        model: "О ранней истории Руси мы знаем прежде всего из летописей, а самая известная из них — «Повесть временных лет». Киев был важным городом, потому что стоял на торговом пути, который соединял Скандинавию с Византией. Первой христианство приняла княгиня Ольга: она крестилась в Константинополе. По летописи, к Владимиру приходили представители разных религий, а он посылал своих людей в разные страны. Больше всего им понравилась служба в Софийском соборе. После Крещения на Русь пришли книги на понятном славянам языке и кириллица, строились каменные храмы и открывались школы. Берестяные грамоты — это письма на коре берёзы, которые с 1951 года нашли в Новгороде археологи. Их писали не только князья и монахи, но и купцы, ремесленники, женщины и даже дети."
        rubric: ["六个问题都回答，事实与课文一致", "回答“谁”的问题时人名放在句末：[Первой христианство приняла княгиня Ольга]{.ru}", "用完整的句子"]
        notes: 第 3 题问的是“谁”，述位是人名，所以按本课的规则写成 [Первой христианство приняла княгиня Ольга]{.ru}，不写 [Княгиня Ольга первой приняла христианство]{.ru}（这样回答的是“奥莉加做了什么”）。第 4 题要说出两方面：各宗教的代表来见他，他也派人出去考察。

  - id: e2
    type: choice
    task: 选出最恰当回答问题的句子（述位应当放在句末）。
    why: "问题问的是什么，什么就是述位，放在句末。第 1 题问时间，[в 988 году]{.ru} 放最后。第 2 题问“谁”，人名 [князь Олег]{.ru} 放最后，[Киев]{.ru} 是已知的，放在句首；[Князь Олег сделал столицей Киев]{.ru} 回答的是“奥列格把哪座城定为都城”。第 3 题问地点，[в Корсуни]{.ru} 放最后。第 4 题问“发生了什么”，整个事件是新信息，句子从已知的时间开始：[В 988 году Русь приняла христианство]{.ru}。第 5 题问“基辅位于什么样的路上”，述位是 [на важном торговом пути]{.ru}。三个选项语法上都对，错在交际任务：重点放错了位置，句子就答非所问。第 3、5 题的第三个选项把动词放在句首，述位虽然也在句末，但这是讲故事的古旧语气（见课文注释 6），中性的回答不用。"
    items:
      - stem: "— Когда Русь приняла христианство? — ___"
        options: ["В 988 году Русь приняла христианство.", "Русь приняла христианство в 988 году.", "Христианство в 988 году приняла Русь."]
        answer: "Русь приняла христианство в 988 году."
      - stem: "— Кто сделал Киев столицей? — ___"
        options: ["Князь Олег сделал Киев столицей.", "Князь Олег сделал столицей Киев.", "Киев сделал столицей князь Олег."]
        answer: "Киев сделал столицей князь Олег."
      - stem: "— Где крестился князь Владимир? — ___"
        options: ["Князь Владимир крестился в Корсуни.", "В Корсуни крестился князь Владимир.", "Крестился князь Владимир в Корсуни."]
        answer: "Князь Владимир крестился в Корсуни."
      - stem: "— Что произошло в 988 году? — ___"
        options: ["Русь приняла христианство в 988 году.", "В 988 году Русь приняла христианство.", "Христианство приняла Русь в 988 году."]
        answer: "В 988 году Русь приняла христианство."
      - stem: "— На каком пути стоял Киев? — ___"
        options: ["Киев стоял на важном торговом пути.", "На важном торговом пути стоял Киев.", "Стоял Киев на важном торговом пути."]
        answer: "Киев стоял на важном торговом пути."

  - id: e3
    type: rewrite
    task: 改变词序，使括号里的词成为述位（放在句末）。词不增不减，只调整顺序。
    example:
      cue: "Княгиня Ольга крестилась в Константинополе. (княгиня Ольга)"
      answer: "В Константинополе крестилась княгиня Ольга."
    why: "要强调的词放到句末，其余成分按“已知在前”排在它前面：时间、地点状语或宾语放句首，动词居中。第 1 题主语 [летописец]{.ru} 是述位，移到动词后面。第 2 题主语 [Ярослав]{.ru} 是述位，宾语 [храмы]{.ru} 前移。第 3 题述位是宾语 [жителей Киева]{.ru}，地点 [в водах Днепра]{.ru} 移到句首。第 4 题述位是时间状语，放在句末。第 5 题述位是 [дочери Ярослава]{.ru}。注意词序变了，词形一个也不变：谁是主语仍由第一格和动词的一致关系决定。"
    items:
      - cue: "Летописец рассказывает о Рюрике. (летописец)"
        accept: ["О Рюрике рассказывает летописец."]
      - cue: "Ярослав строил каменные храмы. (Ярослав)"
        accept: ["Каменные храмы строил Ярослав."]
      - cue: "Жителей Киева крестили в водах Днепра. (жителей Киева)"
        accept: ["В водах Днепра крестили жителей Киева."]
      - cue: "В начале XII века создали эту летопись. (в начале XII века)"
        accept: ["Эту летопись создали в начале XII века."]
      - cue: "Дочери Ярослава стали королевами Франции, Норвегии и Венгрии. (дочери Ярослава)"
        accept: ["Королевами Франции, Норвегии и Венгрии стали дочери Ярослава."]

  - id: e4
    type: choice
    task: 判断句子的主语。
    why: "俄语的主语靠第一格词尾和动词的一致关系判断，不靠位置。第 1 题 [приняла]{.ru} 是阴性，主语是 [княгиня]{.ru}；[христианство]{.ru} 是中性，第四格与第一格同形，在这里是宾语。第 2 题 [строились]{.ru} 是复数 [-ся]{.ru} 动词，主语是 [храмы]{.ru}；[при Владимире]{.ru} 是前置词短语，不能做主语。第 3 题 [соединял]{.ru} 阳性，主语是 [путь]{.ru}；[Скандинавию]{.ru} 是第四格。第 4 题 [удивляла]{.ru} 阴性，主语是 [столица]{.ru}；[гостей]{.ru} 是复数第四格。"
    items:
      - stem: "Христианство приняла княгиня Ольга. 主语：___"
        options: ["христианство", "княгиня Ольга"]
        answer: "княгиня Ольга"
      - stem: "При Владимире строились каменные храмы. 主语：___"
        options: ["Владимир", "храмы"]
        answer: "храмы"
      - stem: "Скандинавию с Византией соединял торговый путь. 主语：___"
        options: ["Скандинавия", "путь"]
        answer: "путь"
      - stem: "Гостей удивляла столица Византии. 主语：___"
        options: ["гости", "столица"]
        answer: "столица"

  - id: e5
    type: translate
    task: 翻译下列句子，注意用词序表示句子的重点。
    items:
      - zh: 基辅的居民是在第聂伯河里受洗的。
        accept: ["Жителей Киева крестили в водах Днепра.", "Жителей Киева крестили в Днепре.", "Жители Киева крестились в водах Днепра.", "Жители Киева крестились в Днепре."]
        rubric: ["地点 [в Днепре / в водах Днепра]{.ru} 是述位，放在句末", "[крестить кого]{.ru}（不定人称句）或 [креститься]{.ru}，两者不能混用：[крестили жителей]{.ru}、[жители крестились]{.ru}"]
      - zh: 十世纪中叶，奥莉加大公夫人接受了基督教。
        accept: ["В середине X века христианство приняла княгиня Ольга.", "В середине X века княгиня Ольга приняла христианство.", "В середине десятого века христианство приняла княгиня Ольга.", "В середине десятого века княгиня Ольга приняла христианство."]
        rubric: ["时间状语放句首", "[принять христианство]{.ru}，动词阴性 [приняла]{.ru}", "[в середине X века]{.ru}：[в середине]{.ru} + 第二格"]
      - zh: 在第聂伯河岸上有一座古老的城市。
        accept: ["На берегу Днепра стоит старый город.", "На берегу Днепра стоит древний город.", "На берегу Днепра находится старый город.", "На берегу Днепра есть старый город."]
        rubric: ["介绍新事物：地点放句首，主语 [город]{.ru} 放在动词后面、句末", "[на берегу]{.ru}：[берег]{.ru} 第六格是 [берегу]{.ru}"]
      - zh: 是奥列格把基辅定为都城的。
        accept: ["Киев сделал столицей Олег.", "Столицей Киев сделал Олег.", "Киев столицей сделал Олег.", "Киев столицей сделал князь Олег.", "Киев сделал столицей князь Олег.", "Столицей Киев сделал князь Олег."]
        rubric: ["[Олег]{.ru} 是述位，放在句末", "[сделать кого/что чем]{.ru}：[Киев]{.ru} 第四格，[столицей]{.ru} 第五格"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述罗斯受洗的经过。
    items:
      - prompt: "按时间顺序写一段话，讲述从奥莉加受洗到雅罗斯拉夫时代的事。要包括：奥莉加受洗；弗拉基米尔选择宗教；988 年的事件；新信仰的传播；受洗带来的变化。用上表示时间先后的词语（[в середине X века]{.ru}、[сначала]{.ru}、[в 988 году]{.ru}、[после этого]{.ru}、[постепенно]{.ru}、[при Ярославе]{.ru}），注意把新信息放在句末。"
        length: 150–200
        model: "Восточные славяне долго были язычниками и верили во многих богов. Но уже в середине X века в Константинополе крестилась княгиня Ольга. Её внук Владимир сначала оставался язычником. По летописи, князь хотел выбрать для Руси одну веру. К нему приходили представители разных религий, а он посылал своих людей в разные страны. Больше всего им понравилась служба в Софийском соборе в Константинополе. «Не знали мы, на небе мы или на земле», — сказали они князю. В 988 году Владимир крестился в Корсуни и женился на сестре византийских императоров. После этого он вернулся в Киев и велел уничтожить идолов старых богов. Жителей Киева крестили в водах Днепра. Постепенно христианство распространилось и в других землях Руси, но этот процесс продолжался не одно столетие. Принятие новой веры изменило жизнь страны. Из Византии и Болгарии пришли книги на понятном славянам языке, а вместе с ними — кириллица. При Владимире и его сыне Ярославе Мудром строились каменные храмы и открывались первые школы. Ярослав собирал вокруг себя переводчиков, а при нём появился первый сборник законов — «Русская правда». Так Русь стала частью христианского мира."
        rubric: ["五个内容都写到，顺序按时间先后", "至少用四个表示时间的词语，并放在句首作主位", "至少两处把主语作为述位放在句末（如 [в Константинополе крестилась княгиня Ольга]{.ru}）", "[креститься]{.ru} 与 [крестить кого]{.ru} 用法正确", "150–200 词"]
        notes: "范文约 170 词。按时间分四层：988 年以前（奥莉加、弗拉基米尔选宗教）、988 年的事、信仰的传播、带来的变化。每层的第一句都以时间状语开头（[в середине X века]{.ru}、[В 988 году]{.ru}、[Постепенно]{.ru}、[При Владимире и его сыне]{.ru}），读者一看就知道叙述走到了哪一步。叙述历史时句首的时间状语是主位，后面的事件是述位；要强调人物时把人名放在句末，如 [в Константинополе крестилась княгиня Ольга]{.ru}。最后用 [Так…]{.ru}（就这样）收尾，概括结果。"

  - id: e7
    type: fill
    task: 用课文里的新词填空，注意词形。
    why: "第 1 题 [учить кого чему]{.ru}，所学的内容用第三格：[грамоте]{.ru}。第 2 题 [требовать чего]{.ru} 要求第二格，[штраф → штрафа]{.ru}。第 3 题“识字的”是形容词 [грамотный]{.ru}，与复数 [люди]{.ru} 一致，做谓语用第五格 [грамотными]{.ru} 或第一格 [грамотные]{.ru}。第 4 题“娶了”用短尾形容词 [женат на ком]{.ru}，主语是男子。第 5 题空里是句子的主语（谁发现了），用复数第一格 [археологи]{.ru}；[грамот]{.ru} 是 [тысячи]{.ru} 要求的第二格，不要把它当成主语。"
    items:
      - stem: "Владимир велел учить детей знатных людей ___."
        hint: грамота
        accept: ["грамоте"]
      - stem: "За многие преступления «Русская правда» требовала не смертной казни, а ___."
        hint: штраф
        accept: ["штрафа"]
      - stem: "На Руси были ___ не только князья и монахи."
        hint: грамотный
        accept: ["грамотными", "грамотные"]
      - stem: "Ярослав был ___ на шведской принцессе."
        hint: женатый
        accept: ["женат"]
      - stem: "С 1951 года ___ нашли в Новгороде больше тысячи берестяных грамот."
        hint: археолог
        accept: ["археологи"]
