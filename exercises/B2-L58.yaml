lesson: B2-L58
grammar: "[оди́н из]{.ru} + 复数第二格；[ка́ждый]{.ru}（每一个）、[любо́й]{.ru}（随便哪一个）、[друго́й]{.ru}（别的）；[одни́… други́е…]{.ru}；[друг дру́га]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词组成正确的形式填空。
    why: "[оди́н из]{.ru} 后面总是复数第二格；[оди́н]{.ru} 跟后面名词的性一致（第 2 题 [подру́га]{.ru} 是阴性，用 [одна́]{.ru}），格由它在句中的作用决定（第 3 题在 [в]{.ru} 后用第六格 [одно́м]{.ru}，第 5 题在 [с]{.ru} 后用第五格 [одни́м]{.ru}）。[ко́рпус]{.ru} 的复数是 [корпуса́]{.ru}，复数第二格 [корпусо́в]{.ru}。第 6、7 题 [друг дру́га]{.ru}：第一部分不变，第二部分按动词变格，前置词放在中间。"
    items:
      - stem: Серёжа — ___ ку́рса.
        hint: оди́н из, лу́чший студе́нт
        accept: ["оди́н из лу́чших студе́нтов"]
      - stem: Ю́ми — ___.
        hint: оди́н из, моя́ подру́га
        accept: ["одна́ из мои́х подру́г"]
      - stem: Ди́ма живёт в ___ общежи́тия.
        hint: оди́н из, ко́рпус
        accept: ["одно́м из корпусо́в"]
      - stem: Москва́ — ___ ми́ра.
        hint: оди́н из, са́мый большо́й го́род
        accept: ["оди́н из са́мых больши́х городо́в"]
      - stem: Вчера́ я говори́л с ___.
        hint: оди́н из, наш преподава́тель
        accept: ["одни́м из на́ших преподава́телей"]
      - stem: В общежи́тии студе́нты помога́ют ___.
        hint: друг дру́га
        accept: ["друг дру́гу"]
      - stem: Ди́ма и Серёжа ча́сто расска́зывают ___ свои́м роди́телям.
        hint: друг дру́га, о
        accept: ["друг о дру́ге"]

  - id: e2
    type: choice
    task: 选择 [ка́ждый]{.ru}、[любо́й]{.ru} 或 [друго́й]{.ru} 的正确形式。
    why: "[ка́ждый]{.ru} 指一个一个、无一例外（第 1、5 题）；[любо́й]{.ru} 指随便哪一个都行（第 2、6 题：所有的书都有意思，随便拿；什么时候打电话都行）；[друго́й]{.ru} 指别的、另外的（第 3 题 [в друго́й раз]{.ru} 下次；第 4 题 [одни́… други́е…]{.ru}）。"
    items:
      - stem: ___ день Ван Лэй занима́ется шесть часо́в.
        options: [Ка́ждый, Любо́й, Друго́й]
        answer: Ка́ждый
      - stem: — Каку́ю кни́гу мне взять? — ___, они́ все интере́сные.
        options: [Ка́ждую, Любу́ю, Другу́ю]
        answer: Любу́ю
      - stem: Сего́дня я не могу́. Дава́й встре́тимся в ___ раз.
        options: [ка́ждый, любо́й, друго́й]
        answer: друго́й
      - stem: Одни́ студе́нты занима́лись в ко́мнатах, ___ — на ку́хне.
        options: [ка́ждые, любы́е, други́е]
        answer: други́е
      - stem: Пе́ред экза́менами ___ студе́нт до́лжен сдать все зачёты.
        options: [ка́ждый, друго́й]
        answer: ка́ждый
      - stem: Звони́ мне в ___ вре́мя, я сего́дня весь день до́ма.
        options: [ка́ждое, любо́е, друго́е]
        answer: любо́е

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题 [оди́н из]{.ru} + 复数第二格，[оди́н]{.ru} 跟 [предме́т]{.ru} 一致用阳性。第 3 题“随便哪一年”用 [любо́й]{.ru}，[о]{.ru} 后用第六格 [го́де]{.ru}。第 4 题“互相帮助”用 [друг дру́гу]{.ru}，因为 [помога́ть]{.ru} 支配第三格。第 5 题“下次”是 [в друго́й раз]{.ru} 或 [в сле́дующий раз]{.ru}。"
    items:
      - zh: 历史是他最喜欢的科目之一。
        accept: ["Исто́рия — оди́н из его́ люби́мых предме́тов."]
        rubric: ["[оди́н из]{.ru}（阳性，跟 [предме́тов]{.ru} 一致）", "[люби́мых предме́тов]{.ru}：复数第二格"]
      - zh: 每层楼都有厨房。
        accept: ["На ка́ждом этаже́ есть ку́хня.", "На ка́ждом этаже́ есть о́бщая ку́хня.", "Ку́хня есть на ка́ждом этаже́."]
        rubric: ["[на ка́ждом этаже́]{.ru}：第六格"]
      - zh: 随便问我哪一年都行。
        accept: ["Спроси́ меня́ о любо́м го́де.", "Спра́шивай меня́ о любо́м го́де.", "Мо́жешь спроси́ть меня́ о любо́м го́де.", "Мо́жно спроси́ть меня́ о любо́м го́де."]
        rubric: ["[о любо́м го́де]{.ru}：[любо́й]{.ru} 第六格"]
      - zh: 我们互相帮助。
        accept: ["Мы помога́ем друг дру́гу."]
        rubric: ["[друг дру́гу]{.ru}：第二部分用第三格"]
      - zh: 下次在我们家学吧。
        accept: ["В друго́й раз занима́емся у нас.", "В друго́й раз дава́й занима́ться у нас.", "Дава́й в друго́й раз занима́ться у нас.", "В сле́дующий раз занима́емся у нас.", "В сле́дующий раз дава́й занима́ться у нас.", "Дава́й в сле́дующий раз занима́ться у нас."]
        rubric: ["[в друго́й раз]{.ru} 或 [в сле́дующий раз]{.ru}", "[у нас]{.ru} 表示“在我们家”"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Заче́м Ван Лэй пое́хал к Ди́ме? Где живёт Ди́ма? Кто его́ сосе́д? Где занима́ются студе́нты в се́ссию? Как Ди́ма проверя́л Ван Лэ́я? Что они́ де́лали ве́чером?]{.ru}"
        length: 60–90
        model: "В сре́ду Ван Лэй пое́хал к Ди́ме: в пя́тницу у него́ был экза́мен по исто́рии, а исто́рия — оди́н из люби́мых предме́тов Ди́мы. Ди́ма живёт в одно́м из корпусо́в общежи́тия на Воробьёвых гора́х, на деся́том этаже́. Его́ сосе́д Серёжа — оди́н из лу́чших студе́нтов ку́рса. В се́ссию одни́ студе́нты занима́ются в ко́мнатах, други́е на ку́хне, а тре́тьи в чита́льном за́ле. Три часа́ Ди́ма задава́л вопро́сы, а Ван Лэй отвеча́л. Ве́чером они́ с Серёжей свари́ли пельме́ни и у́жинали вме́сте."
        rubric: ["回答全部六个问题", "至少两处 [оди́н из]{.ru}", "[одни́… други́е…]{.ru}"]
        notes: 范文约 80 词。注意叙述角度改变后的物主代词：课文里是 [оди́н из его́ люби́мых предме́тов]{.ru}，范文里换成 [оди́н из люби́мых предме́тов Ди́мы]{.ru}，避免 [его́]{.ru} 指代不清。

  - id: e5
    type: open
    task: "作文。题目：[Где лу́чше жить студе́нту: в общежи́тии и́ли до́ма?]{.ru}（学生住哪儿好：宿舍还是家里？）"
    items:
      - prompt: 比较住宿舍和住在家里（或住在别人家）各有什么好处，说说你的看法。用上 [оди́н из]{.ru}、[ка́ждый]{.ru}、[любо́й]{.ru}、[одни́… други́е…]{.ru}。
        length: 100–150
        model: "Одни́ студе́нты живу́т до́ма, с роди́телями, други́е — в общежи́тии. Где лу́чше?\n\nЖить до́ма о́чень хорошо́: ма́ма гото́вит вку́сный у́жин, в ко́мнате ти́хо, и мо́жно занима́ться в любо́е вре́мя. Но до́ма ты всегда́ ребёнок, и роди́тели ка́ждый ве́чер спра́шивают: «Где ты был? Почему́ так по́здно?»\n\nВ общежи́тии жить трудне́е. На́до сами́м гото́вить, а в ко́мнате ча́сто живу́т два и́ли три челове́ка. Но зато́ там есть друзья́ из любо́й страны́ ми́ра, и ка́ждый день мо́жно говори́ть на ра́зных языка́х. Студе́нты помога́ют друг дру́гу и вме́сте гото́вятся к экза́менам.\n\nМой друг живёт в общежи́тии и говори́т, что его́ сосе́д по ко́мнате тепе́рь оди́н из его́ лу́чших друзе́й. А я живу́ в ру́сской семье́, и мне то́же о́чень нра́вится. Я ду́маю, что ка́ждый до́лжен сам вы́брать, где ему́ лу́чше."
        rubric: ["比较两种住法的好处和不足", "用上 [оди́н из]{.ru}、[ка́ждый]{.ru}、[любо́й]{.ru}、[одни́… други́е…]{.ru}", "有自己的结论"]
        notes: 范文四段：提出问题（[одни́… други́е…]{.ru}）—住家里的好处和不便—住宿舍的不便和好处（[зато́]{.ru} 可是，转出好处）—结论（[оди́н из его́ лу́чших друзе́й]{.ru}、[ка́ждый до́лжен сам вы́брать]{.ru}）。[любо́й]{.ru} 用了两次：[в любо́е вре́мя]{.ru}、[из любо́й страны́]{.ru}。

  - id: e6
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是迪马。妹妹斯韦塔想考莫斯科大学，来信问宿舍生活怎么样。6 月 17 日给她回信：介绍宿舍（房间、厨房、室友）、考试期间宿舍里的情形，再鼓励她好好准备考试。
        length: 80–120
        model: "Москва́, 17 ию́ня\n\nПриве́т, Све́та!\n\nСпаси́бо за письмо́! Ты спра́шиваешь, как живу́т студе́нты в общежи́тии. Расскажу́.\n\nМоя́ ко́мната на деся́том этаже́ в одно́м из корпусо́в на Воробьёвых гора́х. Я живу́ в ко́мнате с Серёжей. Он оди́н из лу́чших студе́нтов ку́рса и всегда́ даёт мне свои́ конспе́кты. На ка́ждом этаже́ есть о́бщая ку́хня, там мо́жно встре́тить студе́нтов из любо́й страны́. Вчера́ у меня́ был Ван Лэй, мы гото́вились к его́ экза́мену, а пото́м вме́сте свари́ли пельме́ни.\n\nСейча́с се́ссия, и в общежи́тии о́чень ти́хо: все занима́ются.\n\nНе волну́йся пе́ред экза́менами. Ты у нас молоде́ц! Пиши́ мне.\n\nТвой брат Ди́ма"
        rubric: ["书信格式；兄妹之间用 [ты]{.ru}", "介绍房间、厨房、室友", "至少两处 [оди́н из]{.ru} 或 [любо́й]{.ru}、[ка́ждый]{.ru}", "结尾鼓励妹妹"]
        notes: 兄妹之间写信可以用 [Приве́т, Све́та!]{.ru} 开头，落款 [Твой брат Ди́ма]{.ru}。[Расскажу́.]{.ru} 单独成句，引出正文。[Ты у нас молоде́ц!]{.ru} 中的 [у нас]{.ru} 是“我们家的”，语气亲切。
