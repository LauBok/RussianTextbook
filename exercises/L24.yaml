lesson: L24
grammar: "运动动词 [идти́]{.ru}（步行）和 [е́хать]{.ru}（乘车）的现在时；[куда́]{.ru} + [в / на]{.ru} + 第四格表示去向，与 [где]{.ru} + [в / на]{.ru} + 第六格对应；[здесь – сюда́]{.ru}、[там – туда́]{.ru}、[до́ма – домо́й]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用 [идти́]{.ru} 或 [е́хать]{.ru} 的正确形式填空。
    why: 步行用 [идти́]{.ru}，乘车用 [е́хать]{.ru}。路远或句中提到交通工具、交通卡时用 [е́хать]{.ru}；[пешко́м]{.ru}、“就在附近”提示用 [идти́]{.ru}。变位要注意 [идти́]{.ru} 的 [ё]{.ru}（[идёшь, идёт]{.ru}）和 [е́хать]{.ru} 的词干 [е́д-]{.ru}，不要写成 *[е́хаю]{.ru}。
    items:
      - stem: Поликли́ника ря́дом. Ма́ма ___ пешко́м.
        hint: идти́
        accept: [идёт]
      - stem: Заво́д далеко́. Па́па ___ на заво́д.
        hint: е́хать
        accept: [е́дет]
      - stem: — Куда́ ты ___? — Я иду́ в библиоте́ку.
        hint: идти́
        accept: [идёшь]
      - stem: Университе́т далеко́. Мы ___ в университе́т.
        hint: е́хать
        accept: [е́дем]
      - stem: Ми́ша и А́нна ___ домо́й пешко́м.
        hint: идти́
        accept: [иду́т]
      - stem: — Вы ___ на рабо́ту? — Нет, я иду́ пешко́м.
        hint: е́хать
        accept: [е́дете]

  - id: e2
    type: rewrite
    task: 把表示所在的句子改成表示去向的句子。
    example:
      cue: Ми́ша в шко́ле. (идти́)
      answer: Ми́ша идёт в шко́лу.
    why: 所在用第六格，去向用第四格，前置词 [в / на]{.ru} 保持不变：[в шко́ле → в шко́лу]{.ru}，[на заво́де → на заво́д]{.ru}。第 5 题 [до́ма]{.ru} 对应的是副词 [домо́й]{.ru}，不加前置词。第 4 题形容词也要跟着变成第四格。
    items:
      - cue: Па́па на заво́де. (е́хать)
        accept: [Па́па е́дет на заво́д.]
      - cue: А́нна в библиоте́ке. (идти́)
        accept: [А́нна идёт в библиоте́ку.]
      - cue: Мы на стадио́не. (идти́)
        accept: [Мы идём на стадио́н.]
      - cue: Ван Лэй в но́вой библиоте́ке. (е́хать)
        accept: [Ван Лэй е́дет в но́вую библиоте́ку.]
      - cue: Ма́ма до́ма. (идти́)
        accept: [Ма́ма идёт домо́й.]
      - cue: Студе́нты на уро́ке. (идти́)
        accept: [Студе́нты иду́т на уро́к.]

  - id: e3
    type: choice
    task: 选择正确的词。
    why: 先看动词：[идти́]{.ru}、[е́хать]{.ru} 表示去向，要用 [куда́]{.ru}、[туда́]{.ru}、[сюда́]{.ru}、[домо́й]{.ru}、第四格；[быть]{.ru}、[жить]{.ru}、[рабо́тать]{.ru} 等表示所在，用 [где]{.ru}、[там]{.ru}、[здесь]{.ru}、[до́ма]{.ru}、第六格。汉语“在哪儿”“去哪儿”分得清，到了俄语却容易把 [где]{.ru} 和 [куда́]{.ru} 混用。
    items:
      - stem: ___ ты идёшь?
        options: [Где, Куда́]
        answer: Куда́
      - stem: ___ рабо́тает Ива́н Серге́евич?
        options: [Где, Куда́]
        answer: Где
      - stem: Библиоте́ка там. Мы идём ___.
        options: [там, туда́]
        answer: туда́
      - stem: Ве́чером я ___.
        options: [до́ма, домо́й]
        answer: до́ма
      - stem: А́нна е́дет ___.
        options: [до́ма, домо́й]
        answer: домо́й
      - stem: Ми́ша идёт на ___.
        options: [стадио́н, стадио́не]
        answer: стадио́н
      - stem: Ми́ша сейча́с на ___.
        options: [стадио́н, стадио́не]
        answer: стадио́не

  - id: e4
    type: translate
    task: 译成俄语。
    why: 先决定步行还是乘车，再决定 [в]{.ru} 还是 [на]{.ru}。第 2 题“去上班”是 [на рабо́ту]{.ru}；第 3 题“看足球”是 [на футбо́л]{.ru}；第 4 题“回家”用副词 [домо́й]{.ru}，不说 *[в дом]{.ru}。
    items:
      - zh: ——你去哪儿？——我去图书馆。
        accept: ["— Куда́ ты идёшь? — Я иду́ в библиоте́ку.", "— Куда́ ты е́дешь? — Я е́ду в библиоте́ку.", "— Куда́ ты идёшь? — В библиоте́ку.", "— Куда́ ты е́дешь? — В библиоте́ку."]
        rubric: ["疑问词用 [куда́]{.ru}", "[в библиоте́ку]{.ru} 用第四格", 问句和答句的动词一致]
      - zh: 爸爸坐车去上班，妈妈走着去上班。
        accept: ["Па́па е́дет на рабо́ту, а ма́ма идёт на рабо́ту пешко́м.", "Па́па е́дет на рабо́ту, а ма́ма идёт пешко́м.", "Па́па е́дет на рабо́ту, а ма́ма идёт туда́ пешко́м."]
        rubric: ["乘车用 [е́дет]{.ru}，步行用 [идёт]{.ru}", "[на рабо́ту]{.ru} 用第四格"]
      - zh: 晚上米沙去体育场看足球。
        accept: ["Ве́чером Ми́ша идёт на стадио́н, на футбо́л.", "Ве́чером Ми́ша идёт на футбо́л.", "Ве́чером Ми́ша е́дет на стадио́н, на футбо́л.", "Ми́ша ве́чером идёт на стадио́н, на футбо́л."]
        rubric: ["用现在时表示计划好的事", "[на стадио́н]{.ru}、[на футбо́л]{.ru} 用第四格"]
      - zh: 学校很远，我们坐车回家。
        accept: ["Университе́т далеко́, мы е́дем домо́й.", "Шко́ла далеко́, мы е́дем домо́й.", "Университе́т далеко́, и мы е́дем домо́й."]
        rubric: ["“回家”用 [домо́й]{.ru}", "乘车用 [е́дем]{.ru}"]

  - id: e5
    type: open
    task: 写一写你家早上的情景。
    items:
      - prompt: 早上家里的人都要出门。用 5–7 个句子写一写每个人去哪儿、怎么去（走着还是坐车），为什么。
        length: 40–70
        model: |
          У́тро. Все иду́т и е́дут. Па́па е́дет на рабо́ту: заво́д далеко́. Ма́ма идёт в поликли́нику пешко́м, поликли́ника ря́дом. А я е́ду в университе́т. Ве́чером мы все е́дем и идём домо́й, а ко́шка всегда́ до́ма.
        rubric: ["[идти́]{.ru} 和 [е́хать]{.ru} 按步行、乘车正确选择", "[в / на]{.ru} + 第四格至少用对四处", "“回家”用 [домо́й]{.ru}"]
        notes: 范文按家庭成员逐个说，每句一个人、一个去向。[на рабо́ту]{.ru}、[в поликли́нику]{.ru}、[в шко́лу]{.ru}、[в университе́т]{.ru} 都用第四格；路远用 [е́хать]{.ru}，“就在附近”用 [идти́]{.ru}，用冒号或逗号补充原因，避开还没学的 [потому́ что]{.ru}。
