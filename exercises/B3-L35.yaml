lesson: B3-L35
grammar: "复合句的标点：并列分句之间在 [и]{.ru}、[а]{.ru}、[но]{.ru}、[или]{.ru} 前加逗号，同一主语的同等谓语之间不加；从句用逗号与主句隔开，插在中间两边加；复合连接词的逗号一般在整个连接词前；同类从句用单个 [и]{.ru} 连接时不加逗号。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Какие права были у крепостных крестьян до 1861 года? Почему правительство долго не решалось на реформу? Что изменилось после Крымской войны? Что крестьяне получили по реформе и за что им нужно было платить? Какие реформы начались после отмены крепостного права?]{.ru}"
        length: 90–120
        model: "До 1861 года крепостные крестьяне принадлежали помещикам: без разрешения хозяина они не могли уехать из деревни, жениться или заняться другим делом. Правительство долго не решалось на реформу, потому что боялось недовольства помещиков. После Крымской войны многие увидели, что Россия отстаёт от европейских государств, и император понял, что реформы неизбежны. По реформе крестьяне сразу стали лично свободными, но земля осталась собственностью помещиков, и за участки нужно было заплатить выкуп. После отмены крепостного права в России появились земства, новые суды и всеобщая воинская повинность. Земства открывали школы и больницы, суды стали открытыми, а решение о виновности принимали присяжные заседатели."
        rubric: ["五个问题都回答，事实与课文一致", "至少两个主从复合句和一个并列复合句，逗号正确", "第 4 题说清两方面：人身自由和赎买土地"]
        notes: "第 3 题 [многие увидели, что…, и император понял, что…]{.ru} 是并列复合句里套着主从复合句：[и]{.ru} 前的逗号同时结束了前一个从句。"

  - id: e2
    type: choice
    task: 判断空白处是否需要逗号。
    why: "先找主语和谓语。第 1 题 [Россия проиграла]{.ru}、[многие увидели]{.ru} 两个分句，[и]{.ru} 前要加逗号。第 2 题只有一个主语 [крестьяне]{.ru}，[работали … или платили]{.ru} 是同等谓语，不加逗号。第 3 题 [а]{.ru} 连接两个分句（[государство заплатило]{.ru}、[крестьяне должны были]{.ru}），加逗号。第 4 题 [в 1864 году]{.ru} 是两个分句共同的状语，[и]{.ru} 前不加逗号。第 5 题两个同类说明从句用单个 [и]{.ru} 连接，不加逗号。"
    items:
      - stem: "Россия проиграла войну ___ и многие увидели, что она отстаёт от Европы."
        options: ["要逗号", "不要逗号"]
        answer: "要逗号"
      - stem: "Крестьяне работали на земле помещика ___ или платили ему деньгами."
        options: ["要逗号", "不要逗号"]
        answer: "不要逗号"
      - stem: "Деньги помещикам заплатило государство ___ а крестьяне должны были возвращать долг."
        options: ["要逗号", "不要逗号"]
        answer: "要逗号"
      - stem: "В 1864 году появились земства ___ и начали работать новые суды."
        options: ["要逗号", "不要逗号"]
        answer: "不要逗号"
      - stem: "Император понимал, что реформы неизбежны ___ и что ждать больше нельзя."
        options: ["要逗号", "不要逗号"]
        answer: "不要逗号"

  - id: e3
    type: rewrite
    task: 把两个句子合成一个复合句，用括号里的连接词或关联词。注意逗号。
    example:
      cue: "Правительство не решалось на реформу. Оно боялось недовольства помещиков. (потому что)"
      answer: "Правительство не решалось на реформу, потому что боялось недовольства помещиков."
    why: "第 1 题 [который]{.ru} 从句插在主句中间，两边都要逗号，[который]{.ru} 与 [Александр II]{.ru} 同性同数，在从句中做主语用第一格。第 2 题 [земля]{.ru} 在从句中是地点（[работали на земле]{.ru}），关联词用 [на которой]{.ru}，前置词放在 [которой]{.ru} 前面；从句在中间，两边加逗号。第 3 题对比关系用 [а]{.ru}，前面加逗号。第 4 题 [пока … не]{.ru}：从句放在前面，后面加逗号。"
    items:
      - cue: "Император Александр II понимал, что реформы неизбежны. Он вступил на престол в 1855 году. (который)"
        accept: ["Император Александр II, который вступил на престол в 1855 году, понимал, что реформы неизбежны."]
      - cue: "Крестьяне работали на земле. Эта земля осталась собственностью помещиков. (на которой)"
        accept: ["Земля, на которой работали крестьяне, осталась собственностью помещиков."]
      - cue: "Государство заплатило помещикам. Крестьяне возвращали долг государству. (а)"
        accept: ["Государство заплатило помещикам, а крестьяне возвращали долг государству."]
      - cue: "Крестьяне не начинали выкупать землю. Они работали на помещика. (пока … не)"
        accept: ["Пока крестьяне не начинали выкупать землю, они работали на помещика."]

  - id: e4
    type: choice
    task: 选出标点正确的句子。
    why: "第 1 题 [который]{.ru} 从句插在主句中间，两边都要有逗号；另外两句一句漏了从句后的逗号，一句漏了 [что]{.ru} 前的逗号。第 2 题 [о том, что…]{.ru}：从句插在 [о том]{.ru} 和 [говорили]{.ru} 之间，两边加逗号。第 3 题 [потому что]{.ru} 前加逗号；把逗号放在 [потому]{.ru} 后面而前面不加，只能用在强调原因的时候，这里句子开头没有强调，选普通写法。"
    items:
      - stem: "___"
        options: ["Император, который вступил на престол в 1855 году понимал, что реформы неизбежны.", "Император, который вступил на престол в 1855 году, понимал, что реформы неизбежны.", "Император, который вступил на престол в 1855 году, понимал что реформы неизбежны."]
        answer: "Император, который вступил на престол в 1855 году, понимал, что реформы неизбежны."
      - stem: "___"
        options: ["О том, что крепостное право нужно отменить, говорили давно.", "О том что крепостное право нужно отменить, говорили давно.", "О том, что крепостное право нужно отменить говорили давно."]
        answer: "О том, что крепостное право нужно отменить, говорили давно."
      - stem: "___"
        options: ["Реформа вызвала недовольство потому что участки были маленькими.", "Реформа вызвала недовольство, потому что участки были маленькими.", "Реформа, вызвала недовольство потому, что участки были маленькими."]
        answer: "Реформа вызвала недовольство, потому что участки были маленькими."

  - id: e5
    type: translate
    task: 翻译下列句子，注意复合句的标点。
    items:
      - zh: 农民分到了土地，但是必须为此交付赎金。
        accept: ["Крестьяне получили участки земли, но за них нужно было заплатить выкуп.", "Крестьяне получили землю, но за неё нужно было заплатить выкуп.", "Крестьяне получили участки, но за них надо было заплатить выкуп.", "Крестьяне получили землю, но за неё надо было заплатить выкуп."]
        rubric: ["两个分句，[но]{.ru} 前加逗号", "[заплатить выкуп за что]{.ru}：[за]{.ru} + 第四格"]
      - zh: 1855 年即位的亚历山大二世明白，改革是不可避免的。
        accept: ["Александр II, который вступил на престол в 1855 году, понимал, что реформы неизбежны.", "Александр II, вступивший на престол в 1855 году, понимал, что реформы неизбежны.", "Вступивший на престол в 1855 году Александр II понимал, что реформы неизбежны."]
        rubric: ["[который]{.ru} 从句或形动词短语在名词后，两边加逗号", "[понимал, что]{.ru}：[что]{.ru} 前加逗号", "[вступить на престол]{.ru} 即位"]
      - zh: 农民耕种的土地仍归地主所有。
        accept: ["Земля, которую обрабатывали крестьяне, осталась собственностью помещиков.", "Земля, на которой работали крестьяне, осталась собственностью помещиков.", "Земля, которую обрабатывали крестьяне, осталась у помещиков."]
        rubric: ["定语从句插在主句中间，两边加逗号", "[обрабатывать землю]{.ru} 用 [которую]{.ru}；[работать на земле]{.ru} 用 [на которой]{.ru}", "[остаться чем]{.ru} 用第五格"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述 1861 年农奴制改革的经过。
    items:
      - prompt: "按时间顺序写一段话：改革前农奴的处境；克里米亚战争及其后果；1856 年亚历山大二世的讲话；1857—1861 年的准备；1861 年 2 月 19 日的宣言及其内容；改革以后。多用复合句：至少两个并列复合句（[и]{.ru}、[а]{.ru}、[но]{.ru}）、三个主从复合句（[который]{.ru}、[что]{.ru}、[потому что]{.ru}、[пока … не]{.ru} 等），注意逗号。"
        length: 150–200
        model: "До середины XIX века крестьяне, которые составляли около трети населения России, принадлежали помещикам. Без разрешения хозяина они не могли уехать из деревни или заняться другим делом. В 1856 году Россия проиграла Крымскую войну, и многие поняли, что страна отстаёт от Европы. Император Александр II, который вступил на престол в 1855 году, сказал, что крепостное право лучше отменить сверху. Через год началась подготовка новых законов. Она шла четыре года, потому что споры между сторонниками и противниками реформы были долгими. Наконец 19 февраля 1861 года император подписал манифест об отмене крепостного права. Больше двадцати миллионов крестьян стали лично свободными, но земля осталась собственностью помещиков. Крестьяне получили участки, за которые нужно было заплатить выкуп. Пока они не начинали выкупать землю, они работали на помещика, как и раньше. Государство заплатило помещикам большую часть денег, а крестьяне должны были возвращать долг сорок девять лет. Потом были и другие реформы: в России появились земства, новые суды и всеобщая воинская повинность."
        rubric: ["六部分都写到，顺序正确，年份准确", "至少两个并列复合句、三个主从复合句", "插在中间的从句两边加逗号；同等谓语之间不加逗号", "只陈述事实和通行的说法，不加评价", "150–200 词"]
        notes: "范文约 185 词。前两句写改革前的状况，然后按年份推进：1856、1857（[Через год]{.ru}）、1861（[Наконец]{.ru}，这里是状语“终于”，后面不加逗号）、改革以后。并列复合句：[…войну, и многие поняли…]{.ru}、[…свободными, но земля…]{.ru}、[…денег, а крестьяне…]{.ru}；主从复合句里 [который]{.ru} 从句插在主句中间（[Император Александр II, который…, сказал]{.ru}），两边都有逗号。写历史事件的结果时，用 [стали лично свободными]{.ru}、[осталась собственностью помещиков]{.ru} 这样中性的说法，不加“幸运地”“不公平地”之类的评价。"
