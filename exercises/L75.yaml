lesson: L75
grammar: "方位副词：[напра́во, нале́во, пря́мо, наза́д]{.ru}（方向）与 [спра́ва, сле́ва, ря́дом, бли́зко, далеко́]{.ru}（位置）；运动动词命令式 [иди́(те), пройди́(те), поезжа́й(те)]{.ru}；问路句型 [Как пройти́ к…?]{.ru}"
exercises:

  - id: e1
    type: choice
    task: 选择正确的副词。
    why: 和运动动词（[иди́те, поверни́те]{.ru}）连用、表示往哪个方向的，用 [напра́во, нале́во]{.ru}；说某物在哪儿、表示位置的，用 [спра́ва, сле́ва]{.ru}。第 2、4、6 题说的是位置，最容易误选 [напра́во]{.ru}、[нале́во]{.ru}。
    items:
      - stem: Иди́те пря́мо, пото́м поверни́те ___.
        options: [нале́во, сле́ва]
        answer: нале́во
      - stem: Апте́ка бу́дет ___.
        options: [напра́во, спра́ва]
        answer: спра́ва
      - stem: На светофо́ре поверни́те ___.
        options: [напра́во, спра́ва]
        answer: напра́во
      - stem: Торго́вый центр ___, ря́дом с по́чтой.
        options: [нале́во, сле́ва]
        answer: сле́ва
      - stem: Вы идёте не туда́. Иди́те ___.
        options: [наза́д, сза́ди]
        answer: наза́д
      - stem: — Метро́ далеко́? — Нет, ___, пять мину́т пешко́м.
        options: [бли́зко, пря́мо]
        answer: бли́зко

  - id: e2
    type: fill
    task: 写出动词的命令式（对 [вы]{.ru}）。
    why: "[идти́ → иди́те]{.ru}，[пройти́ → пройди́те]{.ru}，[поверну́ть → поверни́те]{.ru}，都是现在时或将来时词干加 [-и́те]{.ru}。[е́хать]{.ru}、[пое́хать]{.ru} 的命令式特殊，是 [поезжа́йте]{.ru}，不能说 [е́дьте]{.ru}、[пое́дьте]{.ru}。否定命令式用不定向动词：[Не ходи́те]{.ru}。"
    items:
      - stem: ___ пря́мо до светофо́ра.
        hint: идти́
        accept: ["Иди́те"]
      - stem: ___ ми́мо апте́ки.
        hint: пройти́
        accept: ["Пройди́те"]
      - stem: ___ на метро́, э́то три ста́нции.
        hint: пое́хать
        accept: ["Поезжа́йте"]
      - stem: На светофо́ре ___ напра́во.
        hint: поверну́ть
        accept: ["поверни́те"]
      - stem: Не ___ туда́, там нет метро́.
        hint: ходи́ть
        accept: ["ходи́те"]
  - id: e3
    type: rewrite
    task: 按例句向路人问路。
    example:
      cue: метро́
      answer: Извини́те, вы не зна́ете, как пройти́ к метро́?
    why: "[как пройти́ к]{.ru} 后面用第三格：[метро́]{.ru} 不变格；[апте́ка → к апте́ке]{.ru}，[торго́вый центр → к торго́вому це́нтру]{.ru}，[вокза́л → к вокза́лу]{.ru}，[по́чта → к по́чте]{.ru}。形容词也要变成第三格 [-ому]{.ru}、[-ой]{.ru}。"
    items:
      - cue: апте́ка
        accept: ["Извини́те, вы не зна́ете, как пройти́ к апте́ке?"]
      - cue: торго́вый центр
        accept: ["Извини́те, вы не зна́ете, как пройти́ к торго́вому це́нтру?"]
      - cue: вокза́л
        accept: ["Извини́те, вы не зна́ете, как пройти́ к вокза́лу?"]
      - cue: по́чта
        accept: ["Извини́те, вы не зна́ете, как пройти́ к по́чте?"]
      - cue: Третьяко́вская галере́я
        accept: ["Извини́те, вы не зна́ете, как пройти́ к Третьяко́вской галере́е?"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、3 题是指方向的命令式，第 2 题是位置，第 4 题去别的地方坐车，用 [поезжа́йте]{.ru}。
    items:
      - zh: 一直走，然后往右拐。
        accept: ["Иди́те пря́мо, пото́м поверни́те напра́во.", "Иди́те пря́мо, а пото́м поверни́те напра́во.", "Иди́ пря́мо, пото́м поверни́ напра́во.", "Иди́ пря́мо, а пото́м поверни́ напра́во.", "Иди́те пря́мо, а пото́м напра́во.", "Иди́те пря́мо, пото́м напра́во."]
        rubric: ["命令式 [иди́те]{.ru}、[поверни́те]{.ru}（或对 [ты]{.ru} 的 [иди́]{.ru}、[поверни́]{.ru}）", "方向用 [напра́во]{.ru}，不能用 [спра́ва]{.ru}"]
      - zh: 药店在左边，邮局旁边。
        accept: ["Апте́ка сле́ва, ря́дом с по́чтой.", "Апте́ка бу́дет сле́ва, ря́дом с по́чтой."]
        rubric: ["位置用 [сле́ва]{.ru}", "[ря́дом с]{.ru} 加第五格 [по́чтой]{.ru}"]
      - zh: 请问，去地铁站怎么走？
        accept: ["Извини́те, как пройти́ к метро́?", "Скажи́те, пожа́луйста, как пройти́ к метро́?", "Извини́те, вы не зна́ете, как пройти́ к метро́?", "Прости́те, как пройти́ к метро́?", "Скажи́те, как пройти́ к метро́?", "Извини́те, как пройти́ к ста́нции метро́?", "Скажи́те, пожа́луйста, как пройти́ к ста́нции метро́?", "Прости́те, вы не зна́ете, как пройти́ к метро́?"]
        rubric: ["用 [Как пройти́ к метро́?]{.ru}", "开头有礼貌用语 [Извини́те]{.ru} 或 [Скажи́те, пожа́луйста]{.ru}"]
      - zh: 坐地铁去吧，坐三站。
        accept: ["Поезжа́йте на метро́, три ста́нции.", "Поезжа́й на метро́, три ста́нции.", "Поезжа́йте на метро́, э́то три ста́нции.", "Поезжа́й на метро́, э́то три ста́нции."]
        rubric: ["[пое́хать]{.ru} 的命令式是 [поезжа́й(те)]{.ru}", "[на метро́]{.ru} 表示乘地铁", "[три ста́нции]{.ru} 用第二格单数"]

  - id: e5
    type: open
    task: 情景对话：一位游客在你家附近问你怎样去地铁站（或药店、邮局），请给他指路。
    items:
      - prompt: 用上 [Как пройти́ к…?]{.ru}、至少两个命令式，以及 [напра́во / нале́во]{.ru} 和 [спра́ва / сле́ва]{.ru}。
        length: 50–80
        model: "— Извини́те, вы не зна́ете, как пройти́ к метро́?\n— Зна́ю. Иди́те пря́мо до светофо́ра, пото́м поверни́те напра́во.\n— Напра́во, ми́мо по́чты?\n— Да. Пройди́те ми́мо по́чты. Метро́ бу́дет сле́ва, ря́дом с апте́кой.\n— А э́то далеко́?\n— Нет, недалеко́. Пять мину́т пешко́м.\n— Большо́е спаси́бо!"
        rubric: ["问路用 [Как пройти́ к]{.ru} + 第三格", "命令式形式正确：[иди́те, пройди́те, поверни́те]{.ru}", "方向用 [напра́во / нале́во]{.ru}，位置用 [спра́ва / сле́ва]{.ru}", "有礼貌的开头和道谢"]
        notes: 范文按指路的顺序写：先说一直走到哪里，再说往哪边拐，最后说目的地在哪一边、离这儿多远。方向和位置各用一组副词：[поверни́те напра́во]{.ru}，[метро́ бу́дет сле́ва]{.ru}。问路人重复 [Напра́во, ми́мо по́чты?]{.ru} 来确认，是真实对话里常见的做法。
