lesson: L86
grammar: "常用比较级 [бо́льше, ме́ньше, лу́чше, ху́же]{.ru}；[чем]{.ru} 引出比较对象，前后形式一致；[гора́здо]{.ru} + 比较级；[-ее]{.ru} 构成的比较级（初识）。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里的词的比较级。
    why: "[большо́й / мно́го]{.ru} → [бо́льше]{.ru}，[ма́ленький / ма́ло]{.ru} → [ме́ньше]{.ru}，[хоро́ший / хорошо́]{.ru} → [лу́чше]{.ru}，[плохо́й / пло́хо]{.ru} → [ху́же]{.ru}，这四个形式特殊，要单独记。比较级不随主语变化，阴性主语 [Москва́]{.ru}、[пого́да]{.ru} 也不改词尾。"
    items:
      - stem: Москва́ ___, чем Петербу́рг.
        hint: большо́й
        accept: [бо́льше]
      - stem: Петербу́рг ___, чем Москва́.
        hint: ма́ленький
        accept: [ме́ньше]
      - stem: Сего́дня мне ___, чем вчера́.
        hint: хорошо́
        accept: [лу́чше]
      - stem: Пого́да в Петербу́рге ___, чем в Москве́.
        hint: плохо́й
        accept: [ху́же]
      - stem: Ван Лэ́ю на́до ___ говори́ть.
        hint: ма́ло
        accept: [ме́ньше]
      - stem: Ста́нции метро́ в Москве́ ___.
        hint: краси́вый
        accept: [краси́вее]

  - id: e2
    type: choice
    task: 选择 [чем]{.ru} 后面的正确形式。
    why: "[чем]{.ru} 后面的词和被比较的词形式相同：第 1 题比较的是 [Москва́]{.ru} 和 [Петербу́рг]{.ru}，都用第一格；第 2 题比较的是 [в Пеки́не]{.ru} 和 [в Москве́]{.ru}，都用 [в]{.ru} + 第六格；第 3 题比较的是 [сего́дня]{.ru} 和 [вчера́]{.ru}；第 4 题比较的是 [А́нна]{.ru} 和“我”，用第一格 [я]{.ru}。"
    items:
      - stem: Москва́ бо́льше, чем ___.
        options: [Петербу́рг, Петербу́рга, в Петербу́рге]
        answer: Петербу́рг
      - stem: В Пеки́не еда́ вкусне́е, чем ___.
        options: [Москва́, в Москве́, Москву́]
        answer: в Москве́
      - stem: Сего́дня мне лу́чше, чем ___.
        options: [вчера́, вчера́ бы́ло]
        answer: вчера́
      - stem: А́нна говори́т по-ру́сски лу́чше, чем ___.
        options: [я, меня́, мне]
        answer: я

  - id: e3
    type: rewrite
    task: 按例句用比较级和 [чем]{.ru} 说一说。
    example:
      cue: Москва́ больша́я. Петербу́рг ма́ленький.
      answer: Москва́ бо́льше, чем Петербу́рг.
    why: 把两个句子合成一个比较句：比较级放在第一个名词后面，[чем]{.ru} 前加逗号，第二个名词用和第一个相同的形式。
    items:
      - cue: В Пеки́не еда́ вку́сная. В Москве́ еда́ не о́чень вку́сная.
        accept: ["В Пеки́не еда́ вкусне́е, чем в Москве́."]
      - cue: Сего́дня мне хорошо́. Вчера́ мне бы́ло пло́хо.
        accept: ["Сего́дня мне лу́чше, чем вчера́."]
      - cue: Пого́да в Петербу́рге плоха́я. Пого́да в Москве́ хоро́шая.
        accept: ["Пого́да в Петербу́рге ху́же, чем в Москве́."]
      - cue: А́нна хорошо́ говори́т по-англи́йски. Ван Лэй пло́хо говори́т по-англи́йски.
        accept: ["А́нна говори́т по-англи́йски лу́чше, чем Ван Лэй.", "А́нна лу́чше говори́т по-англи́йски, чем Ван Лэй."]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我今天比昨天好多了。
        accept: ["Сего́дня мне гора́здо лу́чше, чем вчера́.", "Мне сего́дня гора́здо лу́чше, чем вчера́."]
        rubric: ["感觉好转用无人称句 [мне лу́чше]{.ru}，人用第三格", "“……多了”用 [гора́здо]{.ru}", "[чем вчера́]{.ru}"]
      - zh: 北京比莫斯科大。
        accept: ["Пеки́н бо́льше, чем Москва́.", "Пеки́н гора́здо бо́льше, чем Москва́."]
        rubric: ["[бо́льше]{.ru} 不变", "[чем]{.ru} 后用第一格 [Москва́]{.ru}"]
      - zh: 彼得堡的天气比莫斯科差。
        accept: ["Пого́да в Петербу́рге ху́же, чем в Москве́.", "В Петербу́рге пого́да ху́же, чем в Москве́."]
        rubric: ["[ху́же]{.ru}", "[чем]{.ru} 后用 [в Москве́]{.ru}，与 [в Петербу́рге]{.ru} 形式相同"]
      - zh: 我更喜欢莫斯科。
        accept: ["Мне бо́льше нра́вится Москва́.", "Москва́ мне нра́вится бо́льше.", "Мне Москва́ нра́вится бо́льше.", "Москва́ мне бо́льше нра́вится.", "Я бо́льше люблю́ Москву́."]
        rubric: ["“更喜欢”用 [бо́льше нра́вится]{.ru}", "[мне]{.ru} 第三格，[Москва́]{.ru} 第一格"]

  - id: e5
    type: open
    task: 比较两座城市。
    items:
      - prompt: 比较你的家乡和莫斯科（或你熟悉的另一座城市）：哪个大、天气哪里好、哪里的饭菜好吃、你更喜欢哪里，为什么。至少用四个比较级。
        length: 50–90
        model: "Я живу́ в Пеки́не. Пеки́н бо́льше, чем Москва́. Зимо́й в Пеки́не не так хо́лодно, но ле́том там о́чень жа́рко. Пого́да в Москве́ ле́том лу́чше, чем в Пеки́не. Еда́ в Пеки́не, коне́чно, вкусне́е. Но в Москве́ метро́ лу́чше, и ста́нции краси́вее. Мне бо́льше нра́вится Пеки́н, потому́ что там моя́ семья́ и мои́ друзья́."
        rubric: ["至少四个比较级", "[чем]{.ru} 前后形式一致", "用 [потому́ что]{.ru} 说明理由"]
        notes: 范文先说两城大小，再依次比较天气、饮食、交通，最后说自己的选择和理由。上下文清楚时 [чем]{.ru} 部分可以省略，如 [Еда́ в Пеки́не вкусне́е]{.ru}。
