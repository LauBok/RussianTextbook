lesson: B3-L21
grammar: "名词后缀：[-ость]{.ru}（形容词 → 阴性抽象名词），[-ство]{.ru}（状态、关系、集体，中性），[-ние, -тие]{.ru}（动词 → 动作名词，中性），[-ация]{.ru}（外来后缀，阴性）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[В какую семью и в какую группу языков входит русский язык? Какие языки ему ближе всего? Кто такие Кирилл и Мефодий и что они сделали? Какое влияние оказал церковнославянский язык на русский? Что изменилось в 1918 году?]{.ru}"
        length: 80–110
        model: "Русский язык входит в индоевропейскую семью, а внутри неё — в славянскую группу. Ближе всего к нему украинский и белорусский: вместе с ними русский входит в восточную группу славянских языков. Польский, чешский, болгарский и сербский тоже славянские языки, но они входят в западную и южную группы. Кирилл и Мефодий — братья из города Солунь. В IX веке они создали для славян первую азбуку и перевели на славянский язык книги для церкви. Церковнославянский язык оказал большое влияние на русский: в русском появились книжные слова, например «град», «глава», «страна». В 1918 году прошла реформа орфографии: из алфавита убрали несколько букв, а твёрдый знак перестали писать в конце слов."
        rubric: ["五个问题都回答，事实与课文一致", "正确使用 [оказать влияние на что]{.ru}", "至少用两个本课带后缀的名词（[создание]{.ru}、[влияние]{.ru}、[реформа орфографии]{.ru} 等）"]
        notes: 第 2 题要注意：东斯拉夫语只有俄语、乌克兰语、白俄罗斯语三种，波兰语、保加利亚语等属于斯拉夫语族的另外两支。第 4 题要用 [оказать влияние на что]{.ru}，[на]{.ru} 后用第四格：[на русский язык]{.ru}。

  - id: e2
    type: fill
    task: 由括号里的词构成带 [-ость]{.ru}、[-ство]{.ru}、[-ние]{.ru} 或 [-тие]{.ru} 的名词，并用正确的格填空。
    why: "先确定后缀，再确定格。第 1 题 [близкий]{.ru} 是形容词，用 [-ость]{.ru}，[к]{.ru} 脱落，作主语用第一格 [близость]{.ru}。第 2 题 [случайный → случайность]{.ru}，作谓语用第一格。第 3 题 [изучение]{.ru} 由完成体 [изучить]{.ru} 按 [-ить → -ение]{.ru} 构成（和未完成体 [изучать]{.ru} 同根），在 [для]{.ru} 后用第二格 [изучения]{.ru}；不要写成 *[изучания]{.ru}*。第 4 题 [принять]{.ru} 是单音节词根动词，用 [-тие]{.ru}，[после]{.ru} 要求第二格 [принятия]{.ru}；不要按 [-ание]{.ru} 去构成。第 5 题 [единый → единство]{.ru}，作主语用第一格。第 6 题 [создать → создание]{.ru}，[о]{.ru} 后第六格 [создании]{.ru}，词尾是 [-ии]{.ru}，不是 *[-ие]{.ru}*。"
    items:
      - stem: ___ русского и украинского языков видна сразу.
        hint: близкий
        accept: ["Близость"]
      - stem: Сходство этих слов — не ___.
        hint: случайный
        accept: ["случайность"]
      - stem: Для ___ истории языка нужно читать старые книги.
        hint: изучать
        accept: ["изучения"]
      - stem: После ___ христианства на Руси начали переписывать книги.
        hint: принять
        accept: ["принятия"]
      - stem: Постепенно ___ праславянского языка было потеряно.
        hint: единый
        accept: ["единство"]
      - stem: Мы прочитали интересную статью о ___ славянской письменности.
        hint: создать
        accept: ["создании"]

  - id: e3
    type: rewrite
    task: 把动词短语或句子改成名词短语。
    example:
      cue: Изучать историю языка
      answer: Изучение истории языка
    why: "动词变成名词以后，原来的第四格宾语变成第二格（第 1—4 题）。第 2 题 [принять → принятие]{.ru}，用 [-тие]{.ru}。第 4 题 [решить]{.ru} 是第二变位动词，构成 [-ение]{.ru}：[решение]{.ru}。第 5 题句子的主语也变成第二格：[язык развивается → развитие языка]{.ru}；[-ся]{.ru} 不进入名词。"
    items:
      - cue: Создать азбуку
        accept: ["Создание азбуки"]
      - cue: Принять христианство
        accept: ["Принятие христианства"]
      - cue: Изучать славянские языки
        accept: ["Изучение славянских языков"]
      - cue: Решить задачу
        accept: ["Решение задачи"]
      - cue: Язык развивается
        accept: ["Развитие языка"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "关键是名词的性。第 1 题 [близость]{.ru} 是 [-ость]{.ru} 名词，阴性，形容词用 [большая]{.ru}。第 2 题 [общество]{.ru} 是 [-ство]{.ru} 名词，中性第五格 [с современным обществом]{.ru}。第 3 题 [цивилизация]{.ru} 是 [-ация]{.ru} 名词，阴性第六格 [о древней цивилизации]{.ru}。第 4 题 [влияние]{.ru} 中性，第四格同第一格 [большое]{.ru}。第 5 题 [для]{.ru} 要求第二格，[письменность]{.ru} 是阴性，形容词用 [славянской]{.ru}；[славянского]{.ru} 是阳性、中性第二格。"
    items:
      - stem: Между этими языками ___ близость.
        options: [большой, большая, большое]
        answer: большая
      - stem: Язык меняется вместе с ___ обществом.
        options: [современным, современной, современный]
        answer: современным
      - stem: Учёные много знают о древней ___.
        options: [цивилизации, цивилизацие, цивилизация]
        answer: цивилизации
      - stem: Церковнославянский язык оказал ___ влияние на русский.
        options: [большую, большой, большое]
        answer: большое
      - stem: Кирилл и Мефодий много сделали для ___ письменности.
        options: [славянского, славянской, славянскую]
        answer: славянской

  - id: e5
    type: translate
    task: 翻译下列句子，注意带后缀的名词。
    items:
      - zh: 这些词的相似不是偶然的。
        accept: ["Сходство этих слов — не случайность.", "Сходство этих слов не случайность.", "Сходство этих слов не случайно.", "Сходство между этими словами — не случайность.", "Сходство между этими словами не случайно."]
        rubric: ["[сходство]{.ru} 中性，后面的名词用第二格 [этих слов]{.ru}", "[случайность]{.ru} 作谓语用第一格"]
      - zh: 西里尔字母成了俄语字母表的基础。
        accept: ["Кириллица легла в основу русского алфавита.", "Кириллица стала основой русского алфавита.", "Основой русского алфавита стала кириллица.", "В основу русского алфавита легла кириллица."]
        rubric: ["[лечь в основу чего]{.ru} 或 [стать основой чего]{.ru}，注意 [стать]{.ru} 后用第五格", "[русского алфавита]{.ru} 第二格"]
      - zh: 教会斯拉夫语对俄语产生了很大影响。
        accept: ["Церковнославянский язык оказал большое влияние на русский язык.", "Церковнославянский язык оказал большое влияние на русский."]
        rubric: ["[оказать влияние на что]{.ru}：[на]{.ru} + 第四格", "[влияние]{.ru} 中性，形容词用 [большое]{.ru}"]
      - zh: 研究语言史有助于了解民族的文化。
        accept: ["Изучение истории языка помогает понять культуру народа.", "Изучение истории языка помогает лучше понять культуру народа.", "Изучение истории языка помогает узнать культуру народа.", "Изучение истории языка помогает лучше узнать культуру народа.", "Изучение истории языка помогает понять культуру этого народа."]
        rubric: ["[изучение истории языка]{.ru}：动作名词后用第二格", "[помогать]{.ru} + 不定式"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面的句子都为它提供例证或解释，最后一句收束全段。
    items:
      - prompt: "主题句：[История русского языка — это история его встреч с другими языками.]{.ru} 至少举两个课文里的例子（如教会斯拉夫语、外来词），至少用四个本课带后缀的名词。"
        length: 140–160
        model: "История русского языка — это история его встреч с другими языками. Ещё в праславянское время славяне жили рядом с другими народами и брали у них слова. Но самым важным событием стало создание славянской письменности. После принятия христианства на Руси начали читать книги на церковнославянском языке, и этот книжный язык оказал большое влияние на русский. Благодаря ему в русском появились такие слова, как «глава» и «страна», которые сегодня кажутся совсем русскими. Рядом с ними остались и старые русские «голова» и «сторона», и у каждого слова появилось своё значение. Так одна встреча языков сделала русский богаче. Позже русский язык встретился с языками Европы. Вместе с новыми вещами и идеями пришли слова, например «организация», «информация», «цивилизация». Такие встречи продолжаются и сегодня: каждый год язык получает новые слова из английского. Это естественно, потому что язык живёт вместе с обществом. Однако основа языка остаётся прежней, и новые слова постепенно входят в неё. Поэтому изучение истории языка помогает понять и историю народа."
        rubric: ["第一句就是给定的主题句", "至少两个具体例证，事实与课文一致", "至少四个带 [-ость, -ство, -ние, -тие, -ация]{.ru} 的名词，性和格正确", "结尾有收束句", "约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 例证一（教会斯拉夫语，用 [создание, принятие, влияние]{.ru}）→ 例证二（欧洲语言，三个 [-ация]{.ru} 词）→ 今天的情况 → 收束句（[Поэтому…]{.ru}）。写主题段时，每个例证前用一个过渡词标明顺序：[Но самым важным…]{.ru}、[Позже…]{.ru}、[Такие встречи продолжаются и сегодня]{.ru}。
