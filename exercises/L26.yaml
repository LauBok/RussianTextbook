lesson: L26
grammar: "[люби́ть]{.ru}（[люблю́, лю́бишь]{.ru}）、[хоте́ть]{.ru}（[хочу́, хо́чешь, хоти́м]{.ru}）的变位，后接名词第四格或动词不定式；[люби́ть]{.ru} 表示一贯的喜好，[хоте́ть]{.ru} 表示现在的愿望；[игра́ть в]{.ru} + 第四格。"
exercises:

  - id: e1
    type: fill
    task: 用 [люби́ть]{.ru} 或 [хоте́ть]{.ru} 的正确形式填空。
    why: "[люби́ть]{.ru} 只有第一人称单数插入 [л]{.ru}：[люблю́]{.ru}，其余是 [лю́бишь, лю́бит…]{.ru}。[хоте́ть]{.ru} 单数用 [ч]{.ru}（[хочу́, хо́чешь, хо́чет]{.ru}），复数换回 [т]{.ru} 并按第二变位（[хоти́м, хоти́те, хотя́т]{.ru}），第 5、6 题最容易写成 *[хо́чем]{.ru}*、*[хо́чут]{.ru}*。"
    items:
      - stem: Я ___ му́зыку.
        hint: люби́ть
        accept: [люблю́]
      - stem: А́нна ___ кла́ссику.
        hint: люби́ть
        accept: [лю́бит]
      - stem: — Что ты ___ де́лать? — Я хочу́ смотре́ть фильм.
        hint: хоте́ть
        accept: [хо́чешь]
      - stem: Ми́ша ___ игра́ть в компью́тер.
        hint: хоте́ть
        accept: [хо́чет]
      - stem: Мы ___ идти́ на конце́рт.
        hint: хоте́ть
        accept: [хоти́м]
      - stem: Ми́ша и его́ друг ___ игра́ть в футбо́л.
        hint: хоте́ть
        accept: [хотя́т]
      - stem: Вы ___ рок?
        hint: люби́ть
        accept: [лю́бите]

  - id: e2
    type: rewrite
    task: 用括号里的动词改写句子。
    example:
      cue: Я чита́ю. (люби́ть)
      answer: Я люблю́ чита́ть.
    why: "[люби́ть]{.ru}、[хоте́ть]{.ru} 变位，原来的动词改成不定式放在后面，宾语的格不变。不定式的词尾一般是 [-ть]{.ru}，[идти́]{.ru} 是 [-ти]{.ru}。"
    items:
      - cue: Ми́ша игра́ет в футбо́л. (люби́ть)
        accept: [Ми́ша лю́бит игра́ть в футбо́л.]
      - cue: Мы слу́шаем кла́ссику. (хоте́ть)
        accept: [Мы хоти́м слу́шать кла́ссику.]
      - cue: А́нна смо́трит фи́льмы. (люби́ть)
        accept: [А́нна лю́бит смотре́ть фи́льмы.]
      - cue: Ты идёшь на конце́рт? (хоте́ть)
        accept: ["Ты хо́чешь идти́ на конце́рт?"]
      - cue: Я пью чай. (хоте́ть)
        accept: [Я хочу́ пить чай.]

  - id: e3
    type: choice
    task: 选择 [люби́ть]{.ru} 或 [хоте́ть]{.ru} 的正确形式。
    why: 说一贯的爱好用 [люби́ть]{.ru}，句中常有 [всегда́]{.ru}、[о́чень]{.ru}；说现在、今天想做的事用 [хоте́ть]{.ru}，句中常有 [сейча́с]{.ru}、[сего́дня]{.ru}。
    items:
      - stem: Я о́чень ___ Чайко́вского.
        options: [люблю́, хочу́]
        answer: люблю́
      - stem: Сейча́с я ___ пить ко́фе.
        options: [люблю́, хочу́]
        answer: хочу́
      - stem: Сего́дня ве́чером мы ___ идти́ в консервато́рию.
        options: [лю́бим, хоти́м]
        answer: хоти́м
      - stem: Ми́ша всегда́ ___ футбо́л.
        options: [лю́бит, хо́чет]
        answer: лю́бит
      - stem: — Ты ___ чай и́ли ко́фе? — Сейча́с? Чай, пожа́луйста.
        options: [лю́бишь, хо́чешь]
        answer: хо́чешь

  - id: e4
    type: translate
    task: 译成俄语。
    why: “喜欢”后面接名词时用第四格（[му́зыку]{.ru}、[Чайко́вского]{.ru}），接动作时用不定式。第 3 题“踢足球”是 [игра́ть в футбо́л]{.ru}，[в]{.ru} 不能漏。
    items:
      - zh: 我喜欢音乐，尤其是柴可夫斯基。
        accept: ["Я люблю́ му́зыку, осо́бенно Чайко́вского.", "Я о́чень люблю́ му́зыку, осо́бенно Чайко́вского.", "Я люблю́ му́зыку, а осо́бенно Чайко́вского."]
        rubric: ["[му́зыку]{.ru}、[Чайко́вского]{.ru} 用第四格"]
      - zh: 你今天晚上想去听音乐会吗？
        accept: ["Ты хо́чешь сего́дня ве́чером идти́ на конце́рт?", "Сего́дня ве́чером ты хо́чешь идти́ на конце́рт?", "Ты хо́чешь идти́ на конце́рт сего́дня ве́чером?", "Вы хоти́те сего́дня ве́чером идти́ на конце́рт?", "Хо́чешь сего́дня ве́чером идти́ на конце́рт?", "Ты сего́дня ве́чером хо́чешь идти́ на конце́рт?"]
        rubric: ["[хоте́ть]{.ru} + 不定式 [идти́]{.ru}", "[на конце́рт]{.ru} 用第四格"]
      - zh: 米沙喜欢踢足球，现在他想玩电脑游戏。
        accept: ["Ми́ша лю́бит игра́ть в футбо́л, а сейча́с он хо́чет игра́ть в компью́тер.", "Ми́ша лю́бит игра́ть в футбо́л. Сейча́с он хо́чет игра́ть в компью́тер."]
        rubric: ["一贯爱好用 [лю́бит]{.ru}，现在的愿望用 [хо́чет]{.ru}", "[игра́ть в]{.ru} + 第四格"]
      - zh: 我们常去音乐学院，我们喜欢古典音乐。
        accept: ["Мы ча́сто хо́дим в консервато́рию, мы лю́бим кла́ссику.", "Мы ча́сто хо́дим в консервато́рию. Мы лю́бим кла́ссику."]
        rubric: ["经常去用 [хо́дим]{.ru}", "[лю́бим]{.ru} + 第四格"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你和朋友商量今天晚上做什么。编一段 6–8 句的对话：互相问喜欢什么（音乐、电影、体育），今天晚上想做什么，最后决定一起去一个地方。
        length: 50–80
        model: |
          — Ты лю́бишь кино́?
          — Да, о́чень люблю́. А ты?
          — Я то́же люблю́ кино́. А ещё я о́чень люблю́ му́зыку.
          — Что ты хо́чешь де́лать сего́дня ве́чером?
          — Я хочу́ идти́ на конце́рт. Там игра́ют Чайко́вского.
          — Чайко́вского? Я его́ о́чень люблю́!
          — Ты хо́чешь идти́ на конце́рт?
          — Коне́чно, хочу́!
        rubric: ["[люби́ть]{.ru} 和 [хоте́ть]{.ru} 都要用，并按意思区分", "至少一处 + 名词第四格，一处 + 不定式", "[на конце́рт]{.ru} 等去向用第四格"]
        notes: 范文前三句谈一贯的喜好（[люби́ть]{.ru}），后五句谈今晚的打算（[хоте́ть]{.ru}），层次分明。[Чайко́вского]{.ru}、[его́]{.ru} 复习了动物名词和代词的第四格。
