lesson: B2-L55
grammar: "数词的变格：[оди́н]{.ru}；[два, три, четы́ре]{.ru}；[пять]{.ru}–[три́дцать]{.ru}；[со́рок, девяно́сто, сто]{.ru}；[ты́сяча]{.ru}。数词在间接格里，名词跟它同格并用复数。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的数量词组变成需要的格。
    why: "数词在第一格（和同第一格的第四格）以外的格里，名词跟数词同格，而且一律用复数。第 1、3、6 题在 [бо́льше]{.ru}、[ме́ньше]{.ru} 后面，用第二格；第 2 题 [о]{.ru} 要求第六格；第 4 题 [с]{.ru} 要求第五格，[друг]{.ru} 的复数是 [друзья́]{.ru}；第 5 题 [помо́чь]{.ru} 支配第三格。第 7 题最容易错：动物名词跟 [два, три, четы́ре]{.ru} 连用时，第四格同第二格，[двух студе́нтов]{.ru}，不是 [два студе́нта]{.ru}。第 8 题 [со́рок]{.ru} 的间接格都是 [сорока́]{.ru}。"
    items:
      - stem: По́езд идёт до Ирку́тска бо́льше ___.
        hint: три дня
        accept: ["трёх дней"]
      - stem: Мари́я Никола́евна расска́зывала подру́ге о ___.
        hint: два биле́та
        accept: ["двух биле́тах"]
      - stem: Самолёт лети́т до Ирку́тска ме́ньше ___.
        hint: шесть часо́в
        accept: ["шести́ часо́в"]
      - stem: Ван Лэй ходи́л в теа́тр с ___.
        hint: три дру́га
        accept: ["тремя́ друзья́ми"]
      - stem: О́льга Ви́кторовна помогла́ ___.
        hint: четы́ре студе́нтки
        accept: ["четырём студе́нткам"]
      - stem: От Москвы́ до Пеки́на по желе́зной доро́ге бо́льше ___.
        hint: семь ты́сяч киломе́тров
        accept: ["семи́ ты́сяч киломе́тров"]
      - stem: В аэропорту́ я ви́дел ___ из на́шей гру́ппы.
        hint: два студе́нта
        accept: ["двух студе́нтов"]
      - stem: На глубине́ ___ вода́ о́чень холо́дная.
        hint: со́рок ме́тров
        accept: ["сорока́ ме́тров"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [о]{.ru} 要求第六格 [трёх]{.ru}；第 2 题 [к]{.ru} 要求第三格 [двум]{.ru}；第 3 题 [с]{.ru} 表示“和……一起”，要求第五格 [двумя́]{.ru}。第 4 题 [со́рок]{.ru} 在 [бо́льше]{.ru} 后用第二格 [сорока́]{.ru}。第 5、6 题都是动物名词作第四格：[пять]{.ru} 以上的数词第四格同第一格，名词仍用复数第二格（[пять студе́нтов]{.ru}）；[три]{.ru} 的第四格同第二格，名词也用复数第二格（[трёх студе́нтов]{.ru}）。"
    items:
      - stem: Мы говори́ли о ___ города́х Сиби́ри.
        options: [трёх, трём, тремя́]
        answer: трёх
      - stem: Ми́ша верну́лся домо́й к ___ часа́м.
        options: [двух, двум, двумя́]
        answer: двум
      - stem: А́нна гуля́ла в па́рке с ___ подру́гами.
        options: [двух, двум, двумя́]
        answer: двумя́
      - stem: Мы жда́ли по́езд бо́льше ___ мину́т.
        options: [со́рок, сорока́]
        answer: сорока́
      - stem: В библиоте́ке я ви́дел ___.
        options: [пять студе́нтов, пяти́ студе́нтов]
        answer: пять студе́нтов
      - stem: В библиоте́ке я ви́дел ___.
        options: [три студе́нта, трёх студе́нтов]
        answer: трёх студе́нтов

  - id: e3
    type: rewrite
    task: 按括号里的数字改写句子。
    example:
      cue: Я говори́л с одни́м дру́гом. (3)
      answer: Я говори́л с тремя́ друзья́ми.
    why: "[оди́н]{.ru} 后面的名词用单数；换成别的数词后，名词跟数词同格并用复数。第 1 题第六格 [в двух ко́мнатах]{.ru}；第 2 题 [бо́льше]{.ru} 后用第二格 [пяти́ мину́т]{.ru}；第 3 题第五格 [двумя́ чемода́нами]{.ru}；第 4 题第三格 [четырём друзья́м]{.ru}。"
    items:
      - cue: Мы жи́ли в одно́й ко́мнате. (2)
        accept: ["Мы жи́ли в двух ко́мнатах."]
      - cue: По́езд стои́т здесь не бо́льше одно́й мину́ты. (5)
        accept: ["По́езд стои́т здесь не бо́льше пяти́ мину́т."]
      - cue: Он был в аэропорту́ с одни́м чемода́ном. (2)
        accept: ["Он был в аэропорту́ с двумя́ чемода́нами."]
      - cue: Я написа́л одному́ дру́гу. (4)
        accept: ["Я написа́л четырём друзья́м."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "四个句子里的数词都不在第一格：[бо́льше]{.ru}、[ме́ньше]{.ru} 后用第二格，[с]{.ru} 后用第五格。名词跟数词同格，用复数。"
    items:
      - zh: 火车要走三天多。
        accept: ["По́езд идёт бо́льше трёх дней.", "По́езд е́дет бо́льше трёх дней."]
        rubric: ["[бо́льше трёх дней]{.ru}：数词和名词都用第二格，名词复数"]
      - zh: 我要和三个朋友一起去贝加尔湖。
        accept: ["Я пое́ду на Байка́л с тремя́ друзья́ми.", "Я е́ду на Байка́л с тремя́ друзья́ми.", "Я пое́ду с тремя́ друзья́ми на Байка́л.", "Я е́ду с тремя́ друзья́ми на Байка́л."]
        rubric: ["[с тремя́ друзья́ми]{.ru}：第五格，[друг]{.ru} 复数 [друзья́]{.ru}", "[на Байка́л]{.ru}"]
      - zh: 从莫斯科到伊尔库茨克有五千多公里。
        accept: ["От Москвы́ до Ирку́тска бо́льше пяти́ ты́сяч киломе́тров."]
        rubric: ["[бо́льше пяти́ ты́сяч киломе́тров]{.ru}：[пять]{.ru} 和 [ты́сяча]{.ru} 都要变格", "[от… до…]{.ru} + 第二格"]
      - zh: 飞机飞到伊尔库茨克不到六个小时。
        accept: ["Самолёт лети́т до Ирку́тска ме́ньше шести́ часо́в.", "До Ирку́тска самолёт лети́т ме́ньше шести́ часо́в.", "Самолёт лети́т в Ирку́тск ме́ньше шести́ часо́в."]
        rubric: ["[ме́ньше шести́ часо́в]{.ru}", "定向动词 [лети́т]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что бы́ло в конве́рте? Почему́ Мари́я Никола́евна не ве́рила свои́м глаза́м? Как бу́дут е́хать на Байка́л роди́тели и как — А́нна и Ми́ша? Почему́ Ван Лэй грусти́л? Что он уви́дел на ка́рте?]{.ru}"
        length: 60–90
        model: "В понеде́льник Ива́н Серге́евич положи́л на стол конве́рт. В нём бы́ли два биле́та на по́езд до Ирку́тска. Мари́я Никола́евна не ве́рила свои́м глаза́м: два́дцать лет муж обеща́л ей Байка́л. Роди́тели бу́дут е́хать бо́льше трёх дней в купе́, на двух ни́жних по́лках. А́нна и Ми́ша полетя́т на самолёте, и пя́того а́вгуста роди́тели встре́тят их в Ирку́тске. Ван Лэй грусти́л, потому́ что в ию́ле он бу́дет уже́ в Пеки́не. На ка́рте он уви́дел, что Байка́л нахо́дится ме́жду двумя́ его́ дома́ми."
        rubric: ["回答全部五个问题", "至少三处数词间接格：[трёх дней]{.ru}、[двух ни́жних по́лках]{.ru}、[двумя́ дома́ми]{.ru} 等", "日期 [пя́того а́вгуста]{.ru}"]
        notes: 范文约 75 词，每句回答一个问题。课文里的对话改成了叙述，[Ми́ша спроси́л…]{.ru} 这样的细节可以省去。注意 [ме́жду двумя́ его́ дома́ми]{.ru}：叙述改用第三人称，[мои́ми]{.ru} 换成了 [его́]{.ru}。

  - id: e6
    type: open
    task: 作文。题目：[Пое́здка, о кото́рой я мечта́ю]{.ru}（我梦想的一次旅行）。
    items:
      - prompt: 写你想去哪里、怎么去、和谁一起去、路上要多久、想看什么。至少用四个不在第一格的数量词组（如 [бо́льше трёх дней]{.ru}、[с двумя́ друзья́ми]{.ru}）。
        length: 100–150
        model: "Я давно́ мечта́ю о большо́й пое́здке на Байка́л. Я хочу́ пое́хать туда́ не на самолёте, а на по́езде. По́езд идёт до Ирку́тска бо́льше трёх дней, и из окна́ мо́жно уви́деть Ура́л, Сиби́рь и бо́льше ста городо́в.\n\nЯ пое́ду не оди́н, а с двумя́ друзья́ми. Мы ку́пим биле́ты в купе́. В купе́ четы́ре ме́ста, поэ́тому одно́ ме́сто бу́дет свобо́дно, и, мо́жет быть, к нам ся́дет интере́сный челове́к. В по́езде мы бу́дем пить чай, игра́ть в ша́хматы и говори́ть о жи́зни.\n\nНа Байка́ле я хочу́ жить в ма́леньком до́ме и ка́ждый день гуля́ть у воды́. Говоря́т, вода́ там така́я чи́стая, что ви́дно дно на глубине́ сорока́ ме́тров. Я хочу́ уви́деть э́то свои́ми глаза́ми. Я ду́маю, что на э́ту пое́здку мне ну́жно о́коло двух неде́ль."
        rubric: ["说清去哪里、怎么去、和谁去、路上多久、想看什么", "至少四个数词间接格，名词同格并用复数", "段落清楚：出发—路上—目的地"]
        notes: 范文分三段：第一段说目的地和交通方式，第二段说同伴和路上，第三段说到了以后想做什么。数词间接格用了五处：[бо́льше трёх дней]{.ru}、[бо́льше ста городо́в]{.ru}、[с двумя́ друзья́ми]{.ru}、[сорока́ ме́тров]{.ru}、[о́коло двух неде́ль]{.ru}。[о́коло]{.ru} 也支配第二格，表示“大约”。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。6 月 8 日你给北京的父母写信：讲彼得罗夫家的贝加尔湖计划（谁去、怎么去、路上多久），说说自己为什么不能去，再问候父母。注意书信的格式。
        length: 80–120
        model: "Москва́, 8 ию́ня\n\nДороги́е ма́ма и па́па!\n\nКак вы живёте? У меня́ всё хорошо́. На э́той неде́ле у меня́ четы́ре зачёта, а че́рез неде́лю начина́ются экза́мены, их бу́дет три. Сейча́с я мно́го занима́юсь.\n\nВчера́ у Петро́вых была́ больша́я но́вость. Ива́н Серге́евич купи́л два биле́та на по́езд до Ирку́тска. В а́вгусте они́ с Мари́ей Никола́евной пое́дут на Байка́л. По́езд идёт бо́льше трёх дней! А́нна и Ми́ша полетя́т к ним на самолёте. Жаль, что я не смогу́ пое́хать с ни́ми: в ию́ле я бу́ду уже́ до́ма. Но Ива́н Серге́евич сказа́л: «Байка́л никуда́ не уйдёт».\n\nЯ посмотре́л на ка́рту: от Ирку́тска до Пеки́на ме́ньше двух ты́сяч киломе́тров. Мо́жет быть, мы с ва́ми то́же пое́дем туда́?\n\nПиши́те мне!\n\nВаш сын Ван Лэй"
        rubric: ["书信格式：地点和日期、称呼、落款", "交代谁去、怎么去、路上多久", "说明自己不能去的原因", "至少两处数词间接格"]
        notes: 给父母的信用 [Дороги́е ма́ма и па́па!]{.ru} 开头，落款 [Ваш сын]{.ru}，称呼后面用感叹号，正文另起一行。正文三段：近况—新闻—问题。结尾 [Пиши́те мне!]{.ru} 是家信常用的话。
