lesson: B2-L06
grammar: "钟点：前半小时 [пять мину́т / че́тверть / полови́на четвёртого]{.ru}，后半小时 [без пяти́ / без че́тверти четы́ре]{.ru}；[в полови́не]{.ru} 与 [без …]{.ru} 前不加 [в]{.ru}；[полчаса́, полтора́ часа́]{.ru}。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句用口语说法说出现在几点（不用 24 小时制）。
    example:
      cue: "3:30"
      answer: Сейча́с полови́на четвёртого.
    why: "前半小时说“下一个钟点的多少分钟”，钟点用序数词第二格：2:15 是 [тре́тьего]{.ru}，不是 [второ́го]{.ru}；后半小时用 [без]{.ru} 加分钟数的第二格（[пяти́, десяти́, двадцати́, че́тверти]{.ru}），再加下一个整点的基数词。第 5 题 6:10 是“第七个钟点的十分钟”：[де́сять мину́т седьмо́го]{.ru}。"
    items:
      - cue: "2:15"
        accept: ["Сейча́с че́тверть тре́тьего.", "Сейча́с пятна́дцать мину́т тре́тьего."]
      - cue: "4:45"
        accept: ["Сейча́с без че́тверти пять."]
      - cue: "9:50"
        accept: ["Сейча́с без десяти́ де́сять."]
      - cue: "1:30"
        accept: ["Сейча́с полови́на второ́го."]
      - cue: "6:10"
        accept: ["Сейча́с де́сять мину́т седьмо́го."]
      - cue: "11:55"
        accept: ["Сейча́с без пяти́ двена́дцать."]
      - cue: "5:40"
        accept: ["Сейча́с без двадцати́ шесть."]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "回答“几点了”用第一格 [полови́на]{.ru}（第 1 题）；回答“在几点”时，半点用 [в полови́не]{.ru}（第 2 题），[без …]{.ru} 前面不加 [в]{.ru}（第 3 题）。第 4 题看下一个钟点：3:30 是 [полови́на четвёртого]{.ru}。第 5 题 [час]{.ru} 是阳性，用 [полтора́]{.ru}；[полторы́]{.ru} 只和阴性名词连用。第 6 题“半小时”是一个词 [полчаса́]{.ru}。"
    items:
      - stem: — Кото́рый час? — ___ четвёртого.
        options: ["Полови́на", "В полови́не"]
        answer: "Полови́на"
      - stem: Встре́тимся у метро́ ___ тре́тьего.
        options: ["полови́на", "в полови́не"]
        answer: "в полови́не"
      - stem: Я бу́ду там ___ пяти́ два.
        options: ["без", "в без"]
        answer: "без"
      - stem: Три часа́ три́дцать мину́т — э́то полови́на ___.
        options: ["тре́тьего", "четвёртого"]
        answer: "четвёртого"
      - stem: Они́ занима́лись ___ часа́.
        options: ["полтора́", "полторы́"]
        answer: "полтора́"
      - stem: Я бу́ду ждать тебя́ ___, не бо́льше.
        options: ["полчаса́", "полови́на"]
        answer: "полчаса́"

  - id: e3
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "[без]{.ru} 要求第二格：[двадцати́, пяти́, че́тверти]{.ru}。第 4 题 [в че́тверть]{.ru} 用第四格，形式和第一格相同；第 5 题“在半点”用第六格 [в полови́не]{.ru}。第 6 题钟点用序数词第二格 [четвёртого]{.ru}：三点二十五分是“第四个钟点的二十五分”。第 7 题 [часы́]{.ru} 只有复数，动词用复数 [отстаю́т]{.ru}，[-ва-]{.ru} 在现在时里脱落。"
    items:
      - stem: Сейча́с без ___ четы́ре.
        hint: два́дцать
        accept: ["двадцати́"]
      - stem: Уро́к конча́ется без ___ де́сять.
        hint: пять
        accept: ["пяти́"]
      - stem: Ди́ма был в кафе́ то́лько без ___ четы́ре.
        hint: че́тверть
        accept: ["че́тверти"]
      - stem: Ди́ма посмотре́л на часы́ в ___ шесто́го.
        hint: че́тверть
        accept: ["че́тверть"]
      - stem: Уро́к начина́ется в ___ деся́того.
        hint: полови́на
        accept: ["полови́не"]
      - stem: Ван Лэй был в кафе́ в два́дцать пять мину́т ___.
        hint: четвёртый
        accept: ["четвёртого"]
      - stem: Мои́ часы́ ___ на пять мину́т.
        hint: отстава́ть
        accept: ["отстаю́т"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“差一刻四点”是 [без че́тверти четы́ре]{.ru}。第 2 题“三点半”要看下一个钟点：[в полови́не четвёртого]{.ru}，不是 [тре́тьего]{.ru}。第 3 题“表慢”用 [отстава́ть]{.ru}。第 4 题“等了多久”用第四格，不加前置词，说话人是女性时用 [ждала́]{.ru}。第 5 题 [полтора́ часа́]{.ru}。"
    items:
      - zh: 现在差一刻四点。
        accept: ["Сейча́с без че́тверти четы́ре."]
        rubric: ["[без че́тверти четы́ре]{.ru}：[без]{.ru} + 第二格，不加 [в]{.ru}"]
      - zh: 我们三点半在咖啡馆见吧。
        accept: ["Встре́тимся в кафе́ в полови́не четвёртого.", "Встре́тимся в полови́не четвёртого в кафе́.", "Дава́й встре́тимся в кафе́ в полови́не четвёртого.", "Дава́йте встре́тимся в кафе́ в полови́не четвёртого."]
        rubric: ["[в полови́не четвёртого]{.ru}：下一个钟点的序数词第二格", "[встре́тимся]{.ru} 表示提议"]
      - zh: 我的表慢了。
        accept: ["Мои́ часы́ отстаю́т."]
        rubric: ["[часы́]{.ru} 是复数，[мои́]{.ru} 和动词都用复数", "[отстаю́т]{.ru}"]
      - zh: 我等了你二十分钟。
        accept: ["Я ждал тебя́ два́дцать мину́т.", "Я ждала́ тебя́ два́дцать мину́т.", "Я ждал вас два́дцать мину́т.", "Я ждала́ вас два́дцать мину́т."]
        rubric: ["[ждать]{.ru} + 第四格 [тебя́]{.ru}", "[два́дцать мину́т]{.ru}：零词尾复数第二格，不加前置词"]
      - zh: 他们学了一个半小时。
        accept: ["Они́ занима́лись полтора́ часа́."]
        rubric: ["[полтора́ часа́]{.ru}", "[занима́ться]{.ru} 过去时"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Где и во ско́лько Ван Лэй и Ди́ма договори́лись встре́титься? Во ско́лько Ван Лэй был в кафе́, а во ско́лько Ди́ма? Почему́ Ди́ма опозда́л? Ско́лько вре́мени они́ занима́лись? О чём они́ договори́лись на суббо́ту?]{.ru}"
        length: 50–80
        model: "Ван Лэй и Ди́ма договори́лись встре́титься в кафе́ напро́тив университе́та в полови́не четвёртого. Ван Лэй был там уже́ в два́дцать пять мину́т четвёртого, а Ди́ма — то́лько без че́тверти четы́ре. Он опозда́л, потому́ что его́ часы́ отстава́ли. Пото́м они́ занима́лись кита́йским полтора́ часа́. В суббо́ту Ди́ма пое́дет к Ван Лэ́ю в го́сти, а пото́м они́ вме́сте с Ми́шей пойду́т игра́ть в футбо́л. Они́ встре́тятся у метро́ в два часа́."
        rubric: ["回答全部五个问题", "钟点说法用对：[в полови́не четвёртого, в два́дцать пять мину́т четвёртого, без че́тверти четы́ре]{.ru}", "[полтора́ часа́]{.ru}"]
        notes: "范文约 70 词。三个时刻放在前两句，按时间顺序排列，便于对比。第二句后半用破折号代替重复的 [был там]{.ru}。原因用 [потому́ что]{.ru}。"
