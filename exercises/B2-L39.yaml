lesson: B2-L39
grammar: "带前缀的运动动词：前缀 [при-]{.ru}（来到）和 [у-]{.ru}（离开）；[приходи́ть / прийти́]{.ru} 等成对的未完成体和完成体；[к кому́]{.ru}、[куда́]{.ru}、[отку́да]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [при-]{.ru} 或 [у-]{.ru} 开头的动词。
    why: "[при-]{.ru} 表示来到、到达，[у-]{.ru} 表示离开、人不在这儿了。第 1 题“已经在这儿了”，第 4 题 [из Москвы́]{.ru} 来到喀山，第 5 题带来礼物，都用 [при-]{.ru}。第 2 题爸爸不在家，第 3 题“很晚才回自己家”，第 6 题 [из Каза́ни]{.ru} 离开，都用 [у-]{.ru}。"
    items:
      - stem: Когда́ Ван Лэй встал, ба́бушка уже́ ___. Она́ сиде́ла на ку́хне.
        options: [пришла́, ушла́]
        answer: пришла́
      - stem: "Па́пы нет до́ма: он ___ на да́чу."
        options: [прие́хал, уе́хал]
        answer: уе́хал
      - stem: Ба́бушка ___ домо́й по́здно, в оди́ннадцать часо́в.
        options: [пришла́, ушла́]
        answer: ушла́
      - stem: Ди́ма ___ в Каза́нь из Москвы́ пе́рвого ма́я.
        options: [прие́хал, уе́хал]
        answer: прие́хал
      - stem: Ба́бушка ___ большо́й кули́ч.
        options: [принесла́, ушла́]
        answer: принесла́
      - stem: Шесто́го ма́я друзья́ ___ из Каза́ни.
        options: [приезжа́ют, уезжа́ют]
        answer: уезжа́ют

  - id: e2
    type: choice
    task: 选择未完成体或完成体。
    why: "第 1 题 [ча́сто]{.ru}、第 3 题 [всегда́]{.ru}、第 5 题 [ка́ждый год]{.ru} 表示经常，用未完成体。第 2、4 题说的是一次完成的到达和离开，用完成体过去时。第 6 题 [обяза́тельно]{.ru} 表示一定会实现的一次结果，用完成体将来时 [прие́дет]{.ru}。"
    items:
      - stem: Ба́бушка ча́сто ___ к ним по воскресе́ньям.
        options: [прихо́дит, пришла́]
        answer: прихо́дит
      - stem: Ру́стам ___ че́рез час.
        options: [уезжа́л, уе́хал]
        answer: уе́хал
      - stem: Ты всегда́ ___ на три дня!
        options: [приезжа́ешь, прие́дешь]
        answer: приезжа́ешь
      - stem: Ве́чером па́па ___ и привёз цветы́.
        options: [приезжа́л, прие́хал]
        answer: прие́хал
      - stem: Ди́ма ка́ждый год ___ роди́телям пода́рки из Москвы́.
        options: [приво́зит, привезёт]
        answer: приво́зит
      - stem: Не волну́йся, па́па обяза́тельно ___ ве́чером.
        options: [приезжа́ет, прие́дет]
        answer: прие́дет

  - id: e3
    type: fill
    task: 写出括号里完成体动词的过去时或将来时形式。
    why: "[прийти́, уйти́]{.ru} 的过去时和 [идти́]{.ru} 一样不规则：[пришёл, пришла́, пришли́]{.ru}，[ушёл, ушла́]{.ru}（第 1、2 题）；将来时 [приду́]{.ru} 不写 [й]{.ru}，[уйду́]{.ru} 保留 [й]{.ru}（第 3、4 题）。[прие́хать]{.ru} 变位同 [е́хать]{.ru}（第 5 题）；[принести́, привезти́]{.ru} 的过去时阳性没有 [-л]{.ru}（第 6、7 题）。"
    items:
      - stem: Вчера́ Ру́стам ___ к Ди́ме. (过去时)
        hint: прийти́
        accept: ["пришёл"]
      - stem: Све́та ___ к подру́ге. (过去时)
        hint: уйти́
        accept: ["ушла́"]
      - stem: За́втра я ___ к тебе́ в шесть часо́в. (将来时)
        hint: прийти́
        accept: ["приду́"]
      - stem: Я ___ домо́й ра́но. (将来时)
        hint: уйти́
        accept: ["уйду́"]
      - stem: Когда́ вы ___ к нам? (将来时)
        hint: прие́хать
        accept: ["прие́дете"]
      - stem: Ба́бушка ___ кули́ч и я́йца. (过去时)
        hint: принести́
        accept: ["принесла́"]
      - stem: Па́па ___ с да́чи цветы́. (过去时)
        hint: привезти́
        accept: ["привёз"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“去别墅了”，人不在家，用 [уе́хал]{.ru}。第 2 题到某人那里用 [к]{.ru} 加第三格。第 3 题请人来做客用未完成体命令式 [приезжа́й(те)]{.ru}。第 4 题“经常”用未完成体，坐车带东西用 [приво́зит]{.ru}。第 5 题计划好的离开可以用未完成体现在时。"
    items:
      - zh: 爸爸不在家，他去别墅了。
        accept: ["Па́пы нет до́ма, он уе́хал на да́чу.", "Па́пы нет до́ма: он уе́хал на да́чу.", "Па́пы нет до́ма. Он уе́хал на да́чу.", "Па́па не до́ма, он уе́хал на да́чу."]
        rubric: ["“去了，不在这儿”用 [уе́хал]{.ru}", "[на да́чу]{.ru} 第四格", "“不在家”用 [Па́пы нет до́ма]{.ru}"]
      - zh: 昨天朋友们到我这儿来了。
        accept: ["Вчера́ ко мне пришли́ друзья́.", "Вчера́ друзья́ пришли́ ко мне.", "Друзья́ пришли́ ко мне вчера́.", "Вчера́ ко мне прие́хали друзья́.", "Вчера́ друзья́ прие́хали ко мне.", "Друзья́ прие́хали ко мне вчера́."]
        rubric: ["一次的到来用完成体 [пришли́]{.ru}（坐车来可用 [прие́хали]{.ru}）", "到某人那里用 [ко мне]{.ru}"]
      - zh: 明天到我们家别墅来吧！
        accept: ["Приезжа́йте за́втра к нам на да́чу!", "Приезжа́й за́втра к нам на да́чу!", "За́втра приезжа́йте к нам на да́чу!", "За́втра приезжа́й к нам на да́чу!", "Приезжа́йте к нам на да́чу за́втра!", "Приезжа́й к нам на да́чу за́втра!"]
        rubric: ["邀请用未完成体命令式 [приезжа́й(те)]{.ru}", "[к нам на да́чу]{.ru}"]
      - zh: 迪马每次都从莫斯科给家里带礼物。
        accept: ["Ди́ма ка́ждый раз приво́зит из Москвы́ пода́рки.", "Ка́ждый раз Ди́ма приво́зит из Москвы́ пода́рки.", "Ди́ма ка́ждый раз приво́зит домо́й пода́рки из Москвы́.", "Ди́ма ка́ждый раз приво́зит пода́рки из Москвы́.", "Ди́ма всегда́ приво́зит из Москвы́ пода́рки.", "Ди́ма ка́ждый раз приво́зит семье́ пода́рки из Москвы́.", "Ди́ма ка́ждый раз приво́зит из Москвы́ пода́рки семье́."]
        rubric: ["经常的行为用未完成体 [приво́зит]{.ru}", "从某地用 [из Москвы́]{.ru}"]
      - zh: 我们六号晚上走。
        accept: ["Мы уезжа́ем шесто́го ве́чером.", "Шесто́го ве́чером мы уезжа́ем.", "Мы уе́дем шесто́го ве́чером.", "Шесто́го ве́чером мы уе́дем."]
        rubric: ["“离开”用 [уезжа́ть / уе́хать]{.ru}", "计划好的事可用未完成体现在时 [уезжа́ем]{.ru}，也可用完成体将来时 [уе́дем]{.ru}", "日期用第二格 [шесто́го]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й пра́здник был второ́го ма́я? Что принесла́ ба́бушка? Куда́ уе́хал па́па Ди́мы и заче́м? Кто прие́хал к Ди́ме днём и что он сказа́л? Когда́ друзья́ уезжа́ют из Каза́ни?]{.ru}"
        length: 70–100
        model: "Второ́го ма́я была́ Па́сха. У́тром пришла́ ба́бушка Ди́мы и принесла́ кули́ч и кра́сные я́йца. Па́па Ди́мы уе́хал на да́чу: на ма́йские пра́здники все е́здят на да́чу сажа́ть карто́шку. Днём к Ди́ме прие́хал на велосипе́де его́ шко́льный друг Ру́стам. Он пригласи́л друзе́й к себе́ на да́чу, но за́втра они́ иду́т в Кремль. Ру́стам сказа́л, что Ди́ма всегда́ приезжа́ет на три дня и сра́зу уезжа́ет. Друзья́ уезжа́ют из Каза́ни шесто́го ве́чером. Ве́чером па́па прие́хал и привёз цветы́."
        rubric: ["回答全部五个问题", "[пришла́]{.ru}、[уе́хал]{.ru}、[прие́хал]{.ru}、[уезжа́ют]{.ru} 等用对体和前缀", "[к Ди́ме]{.ru}、[из Каза́ни]{.ru} 前置词用对"]
        notes: 范文约 85 词。一次的到来和离开用完成体（[пришла́, уе́хал, прие́хал]{.ru}），转述鲁斯塔姆说的“总是”用未完成体（[приезжа́ет, уезжа́ет]{.ru}），计划好的离开用未完成体现在时（[уезжа́ют шесто́го]{.ru}）。

  - id: e6
    type: open
    task: 作文：《我们家的节日》。
    items:
      - prompt: 写一个你们家过的节日（春节、中秋节或别的节日）：谁来了、谁带来了什么、客人什么时候走的。用上带 [при-]{.ru}、[у-]{.ru} 的动词。
        length: 100–150
        model: "Ка́ждый год на Пра́здник весны́ ко мне домо́й приезжа́ют все на́ши ро́дственники. В э́том году́ я был в Пеки́не, и у нас то́же бы́ло мно́го госте́й.\n\nУ́тром пришла́ ба́бушка. Она́ живёт недалеко́ и всегда́ прихо́дит пе́рвая. Она́ принесла́ пирожки́. Пото́м прие́хали дя́дя и тётя из Шанха́я. Они́ привезли́ мне кни́гу, а ма́ме — чай. Днём пришли́ мои́ шко́льные друзья́.\n\nМы весь день гото́вили, е́ли, разгова́ривали и смея́лись. Ве́чером мы смотре́ли телеви́зор.\n\nДрузья́ ушли́ в де́сять часо́в, а ба́бушка — в оди́ннадцать. Дя́дя и тётя уе́хали то́лько че́рез неде́лю. Когда́ все уе́хали, до́ма ста́ло ти́хо и да́же немно́го гру́стно."
        rubric: ["写清谁来了、带来了什么、什么时候走的", "一次的到来和离开用完成体，经常的事用未完成体", "到某人那里用 [к]{.ru} 加第三格，从某地用 [из]{.ru}", "100–150 词，分段"]
        notes: 范文按时间顺序：先说每年的习惯（未完成体 [приезжа́ют, прихо́дит]{.ru}），再讲今年那一天谁来了、带了什么（完成体 [пришла́, прие́хали, принесла́, привезли́]{.ru}），最后讲客人走了（[ушли́, уе́хали]{.ru}）。步行来去用 [прийти́ / уйти́]{.ru}，从外地坐车来去用 [прие́хать / уе́хать]{.ru}。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是迪马的奶奶。王磊走了以后，给他写一封短信，请他明年夏天再来喀山，说说他来的时候你们可以一起做什么。
        length: 70–100
        model: "Дорого́й Ван Лэй!\n\nТы уе́хал, и нам всем немно́го гру́стно. Как ты? Как Москва́? Мне о́чень понра́вился твой пода́рок, я ношу́ плато́к ка́ждый день.\n\nПриезжа́й к нам ещё, ле́том! Ле́том в Каза́ни о́чень краси́во. Мы пое́дем на да́чу, бу́дем пла́вать в Во́лге и гуля́ть в лесу́. Я пригото́влю пироги́, а Ди́ма бу́дет игра́ть на гита́ре.\n\nПереда́й приве́т свои́м роди́телям.\n\nЖдём тебя́!\nТвоя́ ба́бушка Ди́мы"
        rubric: ["有称呼和落款", "用对 [уе́хал]{.ru}、[приезжа́й]{.ru}", "写出两三件可以一起做的事（将来时）", "老人给年轻人写信用 [ты]{.ru}"]
        notes: 邀请别人来，用未完成体命令式 [Приезжа́й к нам!]{.ru}；结尾的 [Ждём тебя́!]{.ru}“我们等着你！”是邀请信常用的结束语。开头先说分别后的心情，再问候对方，然后才是邀请，这是私人信件常见的顺序。
