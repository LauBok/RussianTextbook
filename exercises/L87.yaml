lesson: L87
grammar: "物主代词 [свой]{.ru}（自己的）：东西属于句子主语时，第三人称必须用 [свой]{.ru}，属于别人时用 [его́, её, их]{.ru}；第一、二人称 [свой]{.ru} 和 [мой, твой]{.ru} 都可用；[свой]{.ru} 一般不修饰主语；变格同 [мой]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [свой]{.ru} 或 [его́ / её]{.ru} 的正确形式。
    why: "先看东西是不是主语自己的。第 1、3、5 题东西属于主语，第三人称必须用 [свой]{.ru}；第 2 题括号说明本子是由美的，不是安娜的，用 [её]{.ru}；第 4 题 [ма́ма]{.ru} 是主语，不能用 [свой]{.ru} 修饰主语，用 [его́]{.ru}；第 6 题“他的爸爸”指王磊的爸爸，而主语是妈妈，用 [его́]{.ru}。"
    items:
      - stem: Ми́ша иска́л ___ телефо́н.
        options: [свой, его́]
        answer: свой
      - stem: А́нна взяла́ ___ тетра́дь. (Э́то тетра́дь Ю́ми.)
        options: [свою́, её]
        answer: её
      - stem: Ван Лэй написа́л письмо́ ___ ма́ме.
        options: [свое́й, его́]
        answer: свое́й
      - stem: ___ ма́ма отве́тила бы́стро.
        options: [Своя́, Его́]
        answer: Его́
      - stem: Ма́ма писа́ла о ___ рабо́те.
        options: [свое́й, её]
        answer: свое́й
      - stem: Ма́ма писа́ла о ___ па́пе. (о па́пе Ван Лэ́я)
        options: [своём, его́]
        answer: его́

  - id: e2
    type: fill
    task: 写出 [свой]{.ru} 的正确形式。
    why: "[свой]{.ru} 和所修饰的名词在性、数、格上一致，变格同 [мой]{.ru}：阴性第四格 [свою́]{.ru}，阴性第三、六格 [свое́й]{.ru}，阳性第五格 [свои́м]{.ru}，阳性第六格 [своём]{.ru}，复数 [свои́]{.ru}。"
    items:
      - stem: А́нна дала́ ему́ ___ тетра́дь.
        accept: [свою́]
      - stem: Ван Лэй сиде́л за ___ столо́м.
        accept: [свои́м]
      - stem: Ты смотре́л в ___ ко́мнате?
        accept: [свое́й]
      - stem: Он писа́л о ___ университе́те.
        accept: [своём]
      - stem: У тебя́ есть ___ игру́шки!
        accept: [свои́]
      - stem: Ми́ша позвони́л ___ дру́гу.
        accept: [своему́]

  - id: e3
    type: rewrite
    task: 按例句回答，用 [свой]{.ru}。
    example:
      cue: Чью тетра́дь взяла́ А́нна?
      answer: А́нна взяла́ свою́ тетра́дь.
    why: 回答“谁的”时，如果东西是主语自己的，第三人称用 [свой]{.ru}，形式和名词一致。
    items:
      - cue: Чей телефо́н иска́л Ми́ша?
        accept: ["Ми́ша иска́л свой телефо́н."]
      - cue: Кому́ написа́л письмо́ Ван Лэй?
        accept: ["Ван Лэй написа́л письмо́ свое́й ма́ме.", "Он написа́л письмо́ свое́й ма́ме."]
      - cue: О чём писа́л Ван Лэй?
        accept: ["Ван Лэй писа́л о свое́й жи́зни в Москве́.", "Он писа́л о свое́й жи́зни в Москве́.", "Ван Лэй писа́л о свое́й жи́зни.", "Он писа́л о свое́й жи́зни."]
      - cue: В како́й ко́мнате смотре́л Ми́ша?
        accept: ["Ми́ша смотре́л в свое́й ко́мнате.", "Он смотре́л в свое́й ко́мнате."]

  - id: e4
    type: translate
    task: 译成俄语，注意区分“自己的”和“他的、她的”。
    items:
      - zh: 安娜拿了自己的本子。
        accept: ["А́нна взяла́ свою́ тетра́дь."]
        rubric: ["东西是主语自己的，用 [свою́]{.ru}", "[тетра́дь]{.ru} 阴性第四格，形式不变"]
      - zh: 安娜拿了她（由美）的本子。
        accept: ["А́нна взяла́ её тетра́дь.", "А́нна взяла́ тетра́дь Ю́ми."]
        rubric: ["东西是别人的，用 [её]{.ru}，不能用 [свою́]{.ru}"]
      - zh: 王磊谈自己的家。
        accept: ["Ван Лэй говори́т о свое́й семье́.", "Ван Лэй расска́зывает о свое́й семье́.", "Ван Лэй говори́т о своём до́ме.", "Ван Лэй расска́зывает о своём до́ме."]
        rubric: ["[о]{.ru} + 第六格：[о свое́й семье́]{.ru} 或 [о своём до́ме]{.ru}"]
      - zh: 他的妈妈回信很快。
        accept: ["Его́ ма́ма отве́тила о́чень бы́стро.", "Его́ ма́ма отве́тила бы́стро."]
        rubric: ["修饰主语用 [его́]{.ru}，不用 [своя́]{.ru}"]

  - id: e5
    type: open
    task: 写一封短信。
    items:
      - prompt: 给家里人写一封短信，介绍你在莫斯科（或你学习的地方）的生活：你的房间、你的老师和同学、你的一天。用至少三个 [свой]{.ru} 的不同形式。
        length: 50–90
        model: "Здра́вствуй, ма́ма! У меня́ всё хорошо́. Я живу́ в свое́й ко́мнате, она́ небольша́я, но све́тлая. Ка́ждое у́тро я сижу́ за свои́м столо́м и пишу́ упражне́ния. Наш преподава́тель О́льга Ви́кторовна о́чень лю́бит свою́ рабо́ту. А́нна ча́сто даёт мне свою́ тетра́дь. Ве́чером я расска́зываю Ми́ше о своём го́роде. Твой сын."
        rubric: ["至少三个不同形式的 [свой]{.ru}", "第三人称主语时用 [свой]{.ru}，不用 [его́, её]{.ru}", "有称呼和落款"]
        notes: 范文用了 [свое́й, свои́м, свою́, своём]{.ru} 四个形式。注意第五句：老师爱的是她自己的工作，主语是 [О́льга Ви́кторовна]{.ru}，所以用 [свою́]{.ru}；如果写 [её рабо́ту]{.ru}，意思就成了“另一个女人的工作”。
