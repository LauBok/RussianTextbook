lesson: L68
grammar: "[с … до …]{.ru} + 第二格表示“从……到……”；时刻数词的第二格（[ча́са, двух, трёх, пяти́, восьми́]{.ru} 等）；职业名词的构成和阴阳性。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的数词变成第二格。
    why: 以 [-ь]{.ru} 结尾的数词改 [-и]{.ru}，[пять]{.ru}—[де́сять]{.ru} 重音移到词尾；[во́семь]{.ru} 脱落 [е]{.ru}，写 [восьми́]{.ru}；[два, три, четы́ре]{.ru} 是 [двух, трёх, четырёх]{.ru}；“一点”是 [ча́са]{.ru}。
    items:
      - stem: Я рабо́таю с ___ до шести́.
        hint: де́вять
        accept: [девяти́]
      - stem: Мари́я Никола́евна рабо́тает с ___ до пяти́.
        hint: во́семь
        accept: [восьми́]
      - stem: Обе́д с ча́са до ___.
        hint: два
        accept: [двух]
      - stem: Магази́н рабо́тает с десяти́ до ___.
        hint: семь
        accept: [семи́]
      - stem: Уро́к с оди́ннадцати до ___.
        hint: двена́дцать
        accept: [двена́дцати]
      - stem: С ___ до двух у меня́ обе́д.
        hint: час
        accept: [ча́са, ча́су]
      - stem: Библиоте́ка рабо́тает с ___ до девяти́.
        hint: три
        accept: [трёх]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 表示“从……起”的 [с]{.ru} 接第二格（[утра́]{.ru}、[понеде́льника]{.ru}），表示“和……一起、带着”的 [с]{.ru} 接第五格（[ма́мой]{.ru}、[молоко́м]{.ru}）。看句子的意思来决定，不要只看前置词。
    items:
      - stem: Па́па рабо́тает с ___ до ве́чера.
        options: [утра́, у́тром]
        answer: утра́
      - stem: Я пью ко́фе с ___.
        options: [молока́, молоко́м]
        answer: молоко́м
      - stem: Мы занима́емся с ___ до пя́тницы.
        options: [понеде́льника, понеде́льником]
        answer: понеде́льника
      - stem: Ми́ша идёт в кино́ с ___.
        options: [ма́мы, ма́мой]
        answer: ма́мой

  - id: e3
    type: fill
    task: 写出职业名词的阴性形式。
    why: "[-тель]{.ru} → [-тельница]{.ru}，[-чик]{.ru} → [-чица]{.ru}，[-ист]{.ru} → [-истка]{.ru}，[-ец]{.ru} 的阴性是 [-щица]{.ru}（[продаве́ц → продавщи́ца]{.ru}），要单独记。[врач]{.ru}、[инжене́р]{.ru} 没有通用的阴性形式。"
    items:
      - stem: учи́тель → ___
        accept: [учи́тельница]
      - stem: перево́дчик → ___
        accept: [перево́дчица]
      - stem: журнали́ст → ___
        accept: [журнали́стка]
      - stem: продаве́ц → ___
        accept: [продавщи́ца]
      - stem: арти́ст → ___
        accept: [арти́стка]

  - id: e4
    type: translate
    task: 译成俄语。
    why: “几点到几点”的数词用第二格，[часо́в]{.ru} 可以省略。第 4 题“从星期一到星期五”同样用 [с … до …]{.ru} + 第二格。
    items:
      - zh: 我从早到晚工作。
        accept: ["Я рабо́таю с утра́ до ве́чера."]
        rubric: ["[с утра́ до ве́чера]{.ru}，两个名词都用第二格"]
      - zh: ——您几点到几点上班？——九点到六点。
        accept: ["— С како́го до како́го ча́са вы рабо́таете? — С девяти́ до шести́.", "— Когда́ вы рабо́таете? — С девяти́ до шести́.", "— С како́го до како́го ча́са вы рабо́таете? — Я рабо́таю с девяти́ до шести́.", "— Когда́ вы рабо́таете? — Я рабо́таю с девяти́ до шести́."]
        rubric: ["[с девяти́ до шести́]{.ru}，数词第二格、重音在词尾"]
      - zh: 午饭从一点到两点。
        accept: ["Обе́д с ча́са до двух.", "Обе́д с ча́су до двух.", "Обе́денный переры́в с ча́са до двух."]
        rubric: ["“一点”的第二格 [ча́са]{.ru}", "[двух]{.ru}"]
      - zh: 爸爸星期一到星期五坐车去工厂上班。
        accept: ["С понеде́льника до пя́тницы па́па е́здит на заво́д.", "Па́па е́здит на заво́д с понеде́льника до пя́тницы.", "С понеде́льника до пя́тницы па́па е́здит на рабо́ту на заво́д.", "С понеде́льника до пя́тницы па́па е́здит на заво́д на маши́не.", "Па́па е́здит на заво́д на маши́не с понеде́льника до пя́тницы."]
        rubric: ["[с понеде́льника до пя́тницы]{.ru}", "经常性的往返用 [е́здит]{.ru}", "[на заво́д]{.ru} 第四格"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 写一个你熟悉的人（父母、朋友或你自己）的工作日或学习日：几点到几点做什么，什么时候吃午饭，怎么去上班或上学。60–90 词。
        length: 60–90
        model: |
          Мой оте́ц — учи́тель. Он рабо́тает в шко́ле с понеде́льника до суббо́ты. Его́ рабо́чий день начина́ется ра́но. В семь часо́в он уже́ е́дет на авто́бусе в шко́лу. С восьми́ до ча́са у него́ уро́ки. Обе́д с ча́са до двух, он обе́дает в шко́льной столо́вой. С двух до пяти́ он проверя́ет тетра́ди. Ве́чером он до́ма, но ча́сто рабо́тает и до́ма. Его́ рабо́чий день тру́дный, но интере́сный.
        rubric: ["至少三处 [с … до …]{.ru}，数词用第二格", "职业名词用对（现在时用第一格）", "交通工具用 [на]{.ru} + 第六格"]
        notes: 范文按一天的时间顺序写：上班路上、上午、午饭、下午、晚上，每个时间段一句。句首的 [с … до …]{.ru} 时间状语读的时候要单独切成一个语段。
