lesson: T1
heading: 期中测试
intro: 满分 150 分，建议用时 120 分钟。考查范围：第一册语音入门第 1–8 课和第 1–50 课。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 语音与书写：选出词中所给字母的读音。
  points: 1
  why: 第 1 题：非重读的 [о]{.ru} 在重音前第一个音节读得接近 [а]{.ru}，照字母读成 [о]{.ru} 是最常见的错误（语音第 7 课）。第 2 题：非重读的 [е]{.ru} 读得短而弱，接近 [и]{.ru}，前面的 [с]{.ru} 仍然是软的（语音第 7 课）。第 3 题：成对的浊辅音在词末读成清辅音，[б]{.ru} 读 [п]{.ru}（语音第 8 课）。第 4 题：清辅音在浊辅音前读成浊辅音，[к]{.ru} 在 [з]{.ru} 前读 [г]{.ru}（语音第 8 课）。第 5 题：浊辅音在清辅音前读成清辅音，[в]{.ru} 在 [с]{.ru} 前读 [ф]{.ru}（语音第 8 课）。第 6 题：[что]{.ru} 里的 [ч]{.ru} 读 [ш]{.ru}，是要单独记住的例外（语音第 4 课）。第 7 题：形容词、代词词尾 [-ого]{.ru}、[-его]{.ru} 里的 [г]{.ru} 读 [в]{.ru}，[сего́дня]{.ru} 也是这样（第 11 课）。第 8 题：[вств]{.ru} 里的第一个 [в]{.ru} 不发音，[здра́вствуйте]{.ru} 读作 [[здра́ствуйтʼи]]{.tr}（第 1 课）。第 9 题：[ж]{.ru}、[ш]{.ru}、[ц]{.ru} 永远是硬的，后面写 [и]{.ru} 也读 [ы]{.ru}（语音第 5 课）。第 10 题：[ё]{.ru} 永远重读，所以 [матрёшка]{.ru} 不再标重音符，重音就在 [ё]{.ru} 所在的第二个音节（语音第 5 课）。
  items:
  - stem: вода́：о 读得接近 ___
    options:
    - о
    - а
    - у
    - ы
    answer: а
  - stem: сестра́：е 读得接近 ___
    options:
    - е
    - э
    - а
    - и
    answer: и
  - stem: хлеб：б 读作 ___
    options:
    - п
    - б
    - в
    - ф
    answer: п
  - stem: вокза́л：к 读作 ___
    options:
    - к
    - х
    - г
    - з
    answer: г
  - stem: всё：в 读作 ___
    options:
    - в
    - ф
    - с
    - 不发音
    answer: ф
  - stem: что：ч 读作 ___
    options:
    - ч
    - щ
    - ц
    - ш
    answer: ш
  - stem: сего́дня：г 读作 ___
    options:
    - в
    - г
    - к
    - х
    answer: в
  - stem: здра́вствуйте：第一个 в ___
    options:
    - 读 в
    - 读 ф
    - 不发音
    - 读 б
    answer: 不发音
  - stem: жить：и 读得接近 ___
    options:
    - и
    - й
    - е
    - ы
    answer: ы
  - stem: матрёшка：重音在第 ___ 个音节
    options:
    - 一
    - 二
    - 三
    answer: 二
- id: e2
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：[ко́мната]{.ru} 是阴性名词，物主代词用 [моя́]{.ru}（第 3 课）。第 2 题：[слова́рь]{.ru} 以 [-ь]{.ru} 结尾，是阳性名词，问“谁的”用 [чей]{.ru}；[-ь]{.ru} 结尾的名词有阳性也有阴性，要逐个记（第 3、8 课）。第 3 题：[го́род]{.ru} 是阳性，形容词用 [-ый]{.ru}（第 9 课）。第 4 题：后面说“它们在这儿”（[они́]{.ru}），要用复数；[ключ]{.ru} 的复数重音移到词尾：[ключи́]{.ru}（第 5 课）。第 5 题：[о]{.ru} + 第六格，[фильм]{.ru} 的第六格是 [фи́льме]{.ru}（第 13 课）。第 6 题：[роди́тели]{.ru} 是复数，[жить]{.ru} 的词干是 [жив-]{.ru}，[они́]{.ru} 的形式是 [живу́т]{.ru}（第 14 课）。第 7 题：[воскресе́нье]{.ru} 是中性名词，过去时 [быть]{.ru} 用中性 [бы́ло]{.ru}；容易受汉语影响以为“星期天”是阳性（第 16 课）。第 8 题：[чита́ть]{.ru} 后面接第四格，阴性名词 [-а]{.ru} 变 [-у]{.ru}：[газе́ту]{.ru}（第 21 课）。第 9 题：[знать]{.ru} 支配第四格，[она́]{.ru} 的第四格是 [её]{.ru}；[неё]{.ru} 只用在前置词后面，[него́]{.ru} 是阳性（第 22、31 课）。第 10 题：问“现在去哪儿”是此刻朝一个方向走，用定向动词 [идти́]{.ru}；[хо́дишь]{.ru} 指经常去、来回走，和 [сейча́с]{.ru} 不合（第 24、25 课）。第 11 题：有 [ка́ждый день]{.ru}，是经常来回的动作，用不定向动词；[пешко́м]{.ru} 说明是走着去，不能用 [е́здит]{.ru}（第 25 课）。第 12 题：[мочь]{.ru} 是特殊变位，[я]{.ru} 的形式是 [могу́]{.ru}；“有课去不了”说的是有没有可能，不是会不会（第 27 课）。第 13 题：[три]{.ru} 后面用单数第二格 [часа́]{.ru}；[часо́в]{.ru} 用在 5–12 后面（第 28 课）。第 14 题：“在星期几”用 [в]{.ru} + 第四格：[в суббо́ту]{.ru}；[в суббо́те]{.ru} 是把处所的说法套过来的常见错误（第 29 课）。第 15 题：[нет]{.ru} 后面用第二格，[сестра́]{.ru} 的第二格是 [сестры́]{.ru}（第 32 课）。第 16 题：表示所属的名词放在后面，用第二格，[оте́ц]{.ru} 变格时 [е]{.ru} 脱落：[отца́]{.ru}（第 33 课）。第 17 题：[пятна́дцать]{.ru} 后面用复数第二格，[челове́к]{.ru} 的复数第二格和单数第一格同形；[челове́ка]{.ru} 只用在 2–4 后面（第 35 课）。第 18 题：[напро́тив]{.ru} 要求第二格：[па́рка]{.ru}（第 37 课）。第 19 题：[до́лго]{.ru} 说明动作持续了多久，用未完成体过去时 [писа́л]{.ru}；完成体不和表示持续时间的词连用（第 42、45 课）。第 20 题：[уже́]{.ru} 和后面的问话说明练习已经做完、有了结果，用完成体过去时 [сде́лал]{.ru}（第 42 课）。第 21 题：“写完以后休息”，[за́втра]{.ru} 要完成的一件事用完成体将来时 [напишу́]{.ru}；[пишу́]{.ru} 是现在时，[написа́л]{.ru}、[писа́л]{.ru} 是过去时（第 43 课）。第 22 题：向陌生人问路，请对方做一件具体的事，用完成体命令式 [Скажи́те]{.ru}；[Ска́жете]{.ru} 是将来时，不是命令式（第 46 课）。第 23 题：“过一小时以后”用 [че́рез]{.ru} + 第四格，放在时间前面；[наза́д]{.ru} 表示“以前”，要放在时间后面，而且和 [бу́ду]{.ru} 的将来时不合（第 47 课）。第 24 题：只说月份用 [в]{.ru} + 第六格，[янва́рь]{.ru} 变格时重音移到词尾：[в январе́]{.ru}；说哪一天时月份才用第二格，而且不加 [в]{.ru}（第 48、49 课）。第 25 题：回答“今天几号”，序数词用中性第一格（和 [число́]{.ru} 一致），月份用第二格：[пя́тое октября́]{.ru}；[пя́того]{.ru} 用来回答“在几号”（第 49 课）。
  items:
  - stem: Э́то ___ ко́мната.
    options:
    - мой
    - моё
    - мои́
    - моя́
    answer: моя́
  - stem: ___ э́то слова́рь? — Мой.
    options:
    - Чья
    - Чей
    - Чьё
    - Чьи
    answer: Чей
  - stem: Москва́ — о́чень ___ го́род.
    options:
    - краси́вая
    - краси́вое
    - краси́вые
    - краси́вый
    answer: краси́вый
  - stem: — Где ___? — Вот они́.
    options:
    - ключ
    - ключа́
    - ключи́
    - ключе́
    answer: ключи́
  - stem: Мы до́лго говори́ли о ___.
    options:
    - фильм
    - фи́льма
    - фи́льмы
    - фи́льме
    answer: фи́льме
  - stem: Мои́ роди́тели ___ в Пеки́не.
    options:
    - живёт
    - живу́т
    - живём
    - живёте
    answer: живу́т
  - stem: Вчера́ ___ воскресе́нье.
    options:
    - был
    - была́
    - бы́ло
    - бы́ли
    answer: бы́ло
  - stem: Ка́ждое у́тро па́па чита́ет ___.
    options:
    - газе́ту
    - газе́та
    - газе́ты
    - газе́те
    answer: газе́ту
  - stem: — Ты зна́ешь А́нну? — Да, я хорошо́ зна́ю ___.
    options:
    - она́
    - неё
    - её
    - него́
    answer: её
  - stem: — Куда́ ты сейча́с ___? — На стадио́н.
    options:
    - хо́дишь
    - е́здишь
    - идёшь
    - ходи́ть
    answer: идёшь
  - stem: Ми́ша ка́ждый день ___ в шко́лу пешко́м.
    options:
    - идёт
    - е́здит
    - е́дет
    - хо́дит
    answer: хо́дит
  - stem: 'Сего́дня я не ___ гуля́ть: у меня́ семина́р.'
    options:
    - мо́жет
    - могу́
    - мо́гут
    - мочь
    answer: могу́
  - stem: Сейча́с три ___.
    options:
    - час
    - часо́в
    - часа́
    - часы́
    answer: часа́
  - stem: Мы бу́дем на да́че в ___.
    options:
    - суббо́ту
    - суббо́те
    - суббо́та
    - суббо́ты
    answer: суббо́ту
  - stem: У Ми́ши нет ___.
    options:
    - сестра́
    - сестру́
    - сестре́
    - сестры́
    answer: сестры́
  - stem: Э́то маши́на ___.
    options:
    - оте́ц
    - отца́
    - отце́
    - отцы́
    answer: отца́
  - stem: В гру́ппе пятна́дцать ___.
    options:
    - челове́к
    - челове́ка
    - лю́ди
    - челове́ке
    answer: челове́к
  - stem: Наш дом напро́тив ___.
    options:
    - парк
    - па́рке
    - па́рки
    - па́рка
    answer: па́рка
  - stem: Вчера́ я до́лго ___ письмо́ домо́й.
    options:
    - написа́л
    - писа́л
    - пишу́
    - напишу́
    answer: писа́л
  - stem: — Я уже́ ___ упражне́ние. — Молоде́ц! Отдыха́й.
    options:
    - де́лаю
    - де́лал
    - сде́лаю
    - сде́лал
    answer: сде́лал
  - stem: За́втра я ___ письмо́, а пото́м бу́ду отдыха́ть.
    options:
    - напишу́
    - пишу́
    - написа́л
    - писа́л
    answer: напишу́
  - stem: ___, пожа́луйста, где метро́?
    options:
    - Скажи́те
    - Говори́те
    - Ска́жете
    - Сказа́ть
    answer: Скажи́те
  - stem: Я бу́ду до́ма ___ час.
    options:
    - наза́д
    - в
    - че́рез
    - до
    answer: че́рез
  - stem: Мой брат роди́лся ___.
    options:
    - в январе́
    - в янва́рь
    - января́
    - в января́
    answer: в январе́
  - stem: — Како́е сего́дня число́? — Сего́дня ___ октября́.
    options:
    - пя́того
    - пя́тое
    - пя́тый
    - пя́том
    answer: пя́тое
- id: e3
  type: fill
  task: 用括号里词的正确形式填空。
  points: 1
  why: 第 1 题：[на]{.ru} + 第六格表示处所，“在上班”用 [на рабо́те]{.ru}（第 11、12 课）。第 2 题：[-ия]{.ru} 结尾的名词第六格是 [-ии]{.ru}：[в аудито́рии]{.ru}，不能写成 [-ие]{.ru}（第 12 课）。第 3 题：[писа́ть]{.ru} 变位时 [с]{.ru} 变成 [ш]{.ru}，重音移到词干：[пи́шешь]{.ru}（第 14 课）。第 4 题：[в]{.ru} + 第六格，[ко́мната]{.ru} 是阴性，形容词阴性第六格是 [-ой]{.ru}；[к]{.ru} 后面写 [о]{.ru}（第 18 课）。第 5 题：[Ю́ми]{.ru} 是女生，过去时用阴性 [-ла]{.ru}（第 17 课）。第 6 题：[му́зыку]{.ru} 是阴性第四格，形容词阴性第四格是 [-ую]{.ru}（第 23 课）。第 7 题：[ждать]{.ru} 支配第四格，阴性的名、父称都按 [-а → -у]{.ru} 变：[О́льгу Ви́кторовну]{.ru}（第 22 课）。第 8 题：[уме́ть]{.ru} 按第一变位变化，[вы]{.ru} 的形式是 [уме́ете]{.ru}（第 27 课）。第 9 题：[у]{.ru} 后面用第二格，[ты]{.ru} 的第二格是 [тебя́]{.ru}（第 31 课）。第 10 题：表示所属的 [ба́бушки]{.ru} 是阴性第二格，物主代词也要用阴性第二格 [мое́й]{.ru}（第 34 课）。第 11 题：[три]{.ru} 后面用单数第二格：[бра́та]{.ru}（第 35 课）。第 12 题：[из]{.ru} 要求第二格：[из Кита́я]{.ru}（第 36 课）。第 13 题：序数词按形容词变化，[в]{.ru} + 第六格 [в восьмо́м кла́ссе]{.ru}（第 48 课）。第 14 题：[встать]{.ru} 是完成体，变位得到将来时，词干是 [вста́н-]{.ru}：[вста́ну]{.ru}；[встаю́]{.ru} 是另一个动词的现在时（第 44 课）。第 15 题：[откры́ть]{.ru} 的 [они́]{.ru} 形式是 [откро́ют]{.ru}，词干以元音结尾，命令式加 [-й]{.ru}：对 [ты]{.ru} 说 [Откро́й]{.ru}，对 [вы]{.ru} 说 [Откро́йте]{.ru}（第 46 课）。
  items:
  - stem: Па́па сейча́с на ___.
    hint: рабо́та
    accept:
    - рабо́те
  - stem: Студе́нты сейча́с в ___.
    hint: аудито́рия
    accept:
    - аудито́рии
  - stem: Что ты сейча́с ___?
    hint: писа́ть
    accept:
    - пи́шешь
  - stem: Ван Лэй живёт в ___ ко́мнате.
    hint: ма́ленький
    accept:
    - ма́ленькой
  - stem: Вчера́ ве́чером Ю́ми ___ рома́н.
    hint: чита́ть
    accept:
    - чита́ла
  - stem: Я о́чень люблю́ ___ му́зыку.
    hint: ру́сский
    accept:
    - ру́сскую
  - stem: Мы ждём ___.
    hint: О́льга Ви́кторовна
    accept:
    - О́льгу Ви́кторовну
  - stem: Вы ___ пла́вать?
    hint: уме́ть
    accept:
    - уме́ете
  - stem: У ___ есть брат?
    hint: ты
    accept:
    - тебя́
  - stem: Э́то фо́то ___ ба́бушки.
    hint: мой
    accept:
    - мое́й
  - stem: У Ли На три ___.
    hint: брат
    accept:
    - бра́та
  - stem: Ли На из ___.
    hint: Кита́й
    accept:
    - Кита́я
  - stem: Ми́ша у́чится в ___ кла́ссе.
    hint: восьмо́й
    accept:
    - восьмо́м
  - stem: За́втра я ___ в семь часо́в.
    hint: встать
    accept:
    - вста́ну
  - stem: ___ окно́, пожа́луйста!
    hint: откры́ть
    accept:
    - Откро́й
    - Откро́йте
- id: e4
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 2
  why: 第 1 空：说“今天是几号”，序数词用中性第一格，和 [число́]{.ru} 一致；[семна́дцатого]{.ru} 回答“在几号”（第 49 课）。第 2 空：说话人是王磊（后文 [верну́лся, купи́л]{.ru}），今天早上已经起来了，用完成体过去时阳性 [встал]{.ru}；[вста́ла]{.ru} 是阴性，[вста́ли]{.ru} 是复数（第 17、44 课）。第 3 空：主语是阳性的 [семина́р]{.ru}，带 [-ся]{.ru} 的动词过去时阳性是 [начался́]{.ru}，[-ся]{.ru} 在辅音后不变成 [-сь]{.ru}（第 38、47 课）。第 4 空：前面有 [до́лго]{.ru}，又是已经过去的事，用未完成体过去时 [занима́лся]{.ru}（第 17、42 课）。第 5 空：前面 [учи́л]{.ru} 说的是过程，[наконе́ц]{.ru} 引出结果，用完成体 [вы́учил]{.ru}（第 42、44 课）。第 6 空：[о́коло]{.ru} 要求第二格 [университе́та]{.ru}；[университе́те]{.ru} 是第六格，用在 [в]{.ru}、[на]{.ru}、[о]{.ru} 后面（第 37 课）。第 7 空：[со́рок]{.ru} 和 5–20 一样，后面用复数第二格 [рубле́й]{.ru}（第 39 课）。第 8 空：[до́лго]{.ru} 说明持续的时间，又是昨晚的事，用未完成体过去时复数 [смотре́ли]{.ru}；主语是三个人（第 42 课）。第 9 空：玛丽亚·尼古拉耶夫娜对住在家里的王磊用 [ты]{.ru}，命令式用单数 [спи]{.ru}；[спи́те]{.ru} 是对 [вы]{.ru} 说的（第 4、46 课）。第 10 空：[за́втра]{.ru} 要做完的一件事，用完成体将来时；[отпра́вить]{.ru} 第一人称单数有辅音交替 [в → вл]{.ru}：[отпра́влю]{.ru}（第 43、46 课）。
  items:
  - options:
    - семна́дцатого
    - семна́дцатый
    - семна́дцатое
    - семна́дцатом
    answer: семна́дцатое
  - options:
    - вста́ла
    - встал
    - вста́ли
    - встать
    answer: встал
  - options:
    - начала́сь
    - начало́сь
    - начали́сь
    - начался́
    answer: начался́
  - options:
    - занима́лся
    - занима́юсь
    - бу́ду занима́ться
    - занима́ться
    answer: занима́лся
  - options:
    - учи́л
    - учу́
    - вы́учил
