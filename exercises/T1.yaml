    ::: {.prose lang="ru"}
    **Да́ча**

    Мно́гие ру́сские лю́ди лю́бят да́чу. Да́ча — э́то ма́ленький дом и сад. Обы́чно да́ча нахо́дится не в го́роде, а о́коло ле́са и́ли о́зера. Туда́ хо́дят электри́чки и авто́бусы.

    В ма́е, ию́не, ию́ле и а́вгусте москвичи́ ча́сто е́здят на да́чу. Обы́чно они́ е́дут туда́ в пя́тницу ве́чером и возвраща́ются в го́род в воскресе́нье. На да́че они́ отдыха́ют: гуля́ют в лесу́, пла́вают в о́зере, ве́чером пьют чай в саду́. Но на да́че лю́ди и мно́го рабо́тают. В а́вгусте и сентябре́ они́ собира́ют я́блоки.

    На да́че ча́сто нет интерне́та и́ли телеви́зора. Но де́ти там не сидя́т до́ма: они́ игра́ют в футбо́л и гуля́ют в лесу́. Мно́гие ба́бушки и де́душки рабо́тают на да́че до октября́.

    «Да́ча — э́то второ́й дом», — так говоря́т мно́гие ру́сские.
