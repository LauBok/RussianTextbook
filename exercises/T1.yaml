  passage_zh: |
    **钥匙在哪儿？**

    昨天晚上王磊在图书馆看了很久的书。图书馆九点关门，可九点的时候他还在那儿。他很晚才回到家，已经十一点了。

    在单元门口，王磊打开包，可钥匙不在里面。他找了很久：在包里找，在书里找，在本子里找。“也许我把钥匙丢在图书馆了？”他想。他不想打电话：太晚了，大家都睡了。

    这时王磊看见了安娜。她正从电影院回来。

    “王磊？你在这儿干什么？”她问。

    “我把钥匙丢了。”

    “你没丢，”安娜说，“早上你把钥匙忘在厨房的桌子上了。我在那儿看见了。”

    一到家，王磊马上就在桌子上看到了钥匙。

    “谢谢你，安娜！”他说，“明天我不会忘带钥匙了！”
