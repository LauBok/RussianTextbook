- id: e7
  type: open
  task: 写作。
  points: 30
  items:
  - prompt: 以“我的周末”为题写一篇短文，100–120 词。内容包括：上个周末你在哪里、做了什么（至少三件事，写清是星期几、几点或上午下午）；这个周末打算做什么。至少用到动词过去时的两种体、未完成体将来时（[бу́ду]{.ru} + 不定式）和完成体将来时各一次，写一个日期。
    length: 100–120
    model: |
      **Мои́ выходны́е**

      В суббо́ту я встал в де́вять часо́в. У́тром я до́лго чита́л рома́н «Ма́стер и Маргари́та». Днём я был на ры́нке и купи́л я́блоки и карто́шку. Ве́чером мы смотре́ли фильм.

      В воскресе́нье я был в Се́ргиевом Поса́де. Там я уви́дел ла́вру. Э́то о́чень краси́вый и ста́рый монасты́рь. Домо́й я верну́лся то́лько в оди́ннадцать часо́в.

      В э́ту суббо́ту, два́дцать четвёртого октября́, у мое́й подру́ги день рожде́ния. Я куплю́ большо́й торт и краси́вую откры́тку. Ве́чером мы бу́дем пить чай и гуля́ть в па́рке.

      А в воскресе́нье я бу́ду занима́ться: в понеде́льник у нас контро́льная рабо́та. Я вы́учу но́вые слова́ и сде́лаю упражне́ния.
    rubric:
    - 内容 10 分：上周末做的三件事（各 2 分，写了时间才给满分）、这个周末的打算（4 分：写到两件事以上给满分，只写一件给 2 分）
    - 语法 10 分：要求的五项（未完成体过去时、完成体过去时、[бу́ду]{.ru} + 不定式、完成体将来时、日期）各 1 分；其余 5 分看全文语法错误，名词、形容词变格，动词变位，[в]{.ru} / [на]{.ru} 和格的搭配，每两处错误扣 1 分
    - 词汇 5 分：用词准确、有变化，能用上第一至五单元学过的词（[библиоте́ка, ры́нок, да́ча, контро́льная рабо́та, день рожде́ния]{.ru} 等）给 5 分；用词单调或有三处以上用词不当的，酌情扣 1–3 分
    - 结构 5 分：有题目（1 分），按时间顺序分段、每段一个意思（2 分），句子之间衔接通顺（2 分）
    - 字数少于 80 词的，内容分最多给 6 分
    notes: 范文约 110 词，分四段：星期六、星期天、这个星期六、这个星期天，每段先说时间，再说事情。语法上：[до́лго чита́л]{.ru} 说过程，用未完成体（第 42 课）；[купи́л, уви́дел, верну́лся]{.ru} 说一次做成的事，用完成体（第 44、45 课）；[был на ры́нке, был в Се́ргиевом Поса́де]{.ru} 是 [быть]{.ru} 的过去时加 [в]{.ru} / [на]{.ru} + 第六格（第 11、16 课）；[бу́дем пить чай и гуля́ть]{.ru}、[бу́ду занима́ться]{.ru} 是未完成体将来时（第 41 课）；[куплю́, вы́учу, сде́лаю]{.ru} 是完成体将来时，说要做完的事（第 43 课）；[два́дцать четвёртого октября́]{.ru} 是日期的第二格，复合序数词只变最后一个词，回答“在几号”（第 49 课）；[в де́вять часо́в, в оди́ннадцать часо́в]{.ru} 是 [в]{.ru} + 钟点（第 47 课）。写作时先按时间列出要写的事，过去的事想清楚是说过程还是说结果，再选体。
