    **Письмо́ из Москвы́**

    Дороги́е ма́ма и па́па!

    Здра́вствуйте! Я в Москве́ уже́ ме́сяц. У меня́ всё хорошо́. Я живу́ в семье́ Петро́вых. Ива́н Серге́евич — инжене́р, а Мари́я Никола́евна — врач. Их дочь А́нна у́чится в университе́те, а сын Ми́ша — шко́льник.

    Уро́ки в университе́те начина́ются в де́вять часо́в. Наш преподава́тель — О́льга Ви́кторовна. Она́ говори́т ме́дленно, и я всё понима́ю. В на́шей гру́ппе есть студе́нты из Япо́нии и Фра́нции. Ве́чером я обы́чно занима́юсь в библиоте́ке и́ли де́лаю уро́ки до́ма.

    В воскресе́нье мы бы́ли в Се́ргиевом Поса́де. Там о́чень ста́рый монасты́рь — ла́вра. Я ви́дел там о́чень ста́рый собо́р.

    Два́дцать пя́того октября́ у нас контро́льная рабо́та, и сейча́с я мно́го занима́юсь. А четвёртого ноября́ — пра́здник, День наро́дного еди́нства. В э́тот день я не бу́ду занима́ться: Петро́вы и я бу́дем на да́че.

    Мари́я Никола́евна ча́сто гото́вит сы́рники. Они́ о́чень вку́сные!

    Как вы? Как ба́бушка? Пиши́те ча́сто!

    Ваш сын Лэй
