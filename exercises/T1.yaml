  passage_zh: |
    **别墅**

    很多俄罗斯人喜欢别墅。别墅就是一座小房子加一个园子。别墅一般不在城里，而在树林或湖泊旁边。那里通电气火车和公共汽车。

    五月、六月、七月和八月，莫斯科人常去别墅。他们一般星期五晚上去，星期天回城。在别墅里他们休息：在树林里散步，在湖里游泳，晚上在园子里喝茶。不过人们在别墅里也干很多活。八月和九月他们摘苹果。

    别墅里常常没有网络，也没有电视。可孩子们在那儿并不待在屋里：他们踢足球，在树林里玩。很多爷爷奶奶在别墅里一直忙到十月。

    “别墅是第二个家。”很多俄罗斯人都这么说。
