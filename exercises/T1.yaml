    **Где ключ?**

    Вчера́ ве́чером Ван Лэй до́лго чита́л в библиоте́ке. Библиоте́ка закрыва́ется в де́вять часо́в, но в де́вять он ещё был там. Домо́й он верну́лся по́здно, в оди́ннадцать.

    О́коло подъе́зда Ван Лэй откры́л су́мку, но ключа́ там не́ было. Он до́лго иска́л ключ: в су́мке, в кни́ге, в тетра́ди. «Мо́жет быть, я потеря́л его́ в библиоте́ке?» — ду́мал он. Звони́ть он не хоте́л: уже́ по́здно, все спят.

    Тут Ван Лэй уви́дел А́нну. Она́ возвраща́лась из кино́.

    — Ван Лэй? Что ты тут де́лаешь? — спроси́ла она́.

    — Я потеря́л ключ.

    — Ты не потеря́л его́, — сказа́ла А́нна. — У́тром ты забы́л ключ на столе́ в ку́хне. Я ви́дела его́ там.

    До́ма Ван Лэй сра́зу уви́дел ключ на столе́.

    — Спаси́бо, А́нна! — сказа́л он. — За́втра я не забу́ду ключ!
