    **莫斯科来信**

    亲爱的妈妈、爸爸：

    你们好！我来莫斯科已经一个月了。我一切都好。我住在彼得罗夫家。伊万·谢尔盖耶维奇是工程师，玛丽亚·尼古拉耶夫娜是医生。他们的女儿安娜在大学上学，儿子米沙是中学生。

    大学里九点开始上课。我们的老师是奥尔加·维克托罗夫娜。她说得很慢，我全都听得懂。我们班有从日本和法国来的同学。晚上我一般在图书馆学习，或者在家做功课。

    星期天我们去了谢尔吉耶夫镇。那里有一座非常古老的修道院——大修道院。我在那儿看到了一座非常古老的大教堂。

    十月二十五日我们有测验，所以现在我学得很用功。十一月四日是节日——民族团结日。那天我不学习：彼得罗夫一家和我要去别墅。

    玛丽亚·尼古拉耶夫娜常做奶渣饼，非常好吃！

    你们好吗？奶奶好吗？常给我写信！

    你们的儿子　磊
