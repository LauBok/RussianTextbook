lesson: L28
grammar: "数词 1–12（[оди́н, одна́, одно́]{.ru}；[два, две]{.ru}）；[час]{.ru} 与数词连用：1 [час]{.ru}，2–4 [часа́]{.ru}，5–12 [часо́в]{.ru}；问钟点 [Кото́рый час?]{.ru}；[спать]{.ru}（[сплю, спишь]{.ru}）、[звони́ть]{.ru} 的变位。"
exercises:

  - id: e1
    type: fill
    task: 用 [час]{.ru} 的正确形式填空。
    why: 1 后面用 [час]{.ru}，2、3、4 后面用 [часа́]{.ru}，5 到 12 后面用 [часо́в]{.ru}。只看最后一个数词：[двена́дцать]{.ru} 虽然含有“二”，仍然属于 5–12，用 [часо́в]{.ru}（第 6 题），这是最常见的错误。
    items:
      - stem: Сейча́с три ___.
        hint: час
        accept: [часа́]
      - stem: Сейча́с семь ___.
        hint: час
        accept: [часо́в]
      - stem: Сейча́с ___.
        hint: 1
        accept: [час]
      - stem: В Пеки́не сейча́с четы́ре ___.
        hint: час
        accept: [часа́]
      - stem: В Москве́ сейча́с де́сять ___.
        hint: час
        accept: [часо́в]
      - stem: Сейча́с двена́дцать ___.
        hint: час
        accept: [часо́в]
      - stem: Сейча́с два ___.
        hint: час
        accept: [часа́]

  - id: e2
    type: rewrite
    task: 用文字回答“几点了”。
    example:
      cue: "Кото́рый час? (5:00)"
      answer: Сейча́с пять часо́в.
    why: 数词用文字写出，[час]{.ru} 按数词变形。第 4 题一点钟一般只说 [час]{.ru}，不说 [оди́н]{.ru}；第 5 题 [оди́ннадцать]{.ru} 要写两个 [н]{.ru}。
    items:
      - cue: "Кото́рый час? (2:00)"
        accept: [Сейча́с два часа́.]
      - cue: "Кото́рый час? (8:00)"
        accept: [Сейча́с во́семь часо́в.]
      - cue: "Кото́рый час? (3:00)"
        accept: [Сейча́с три часа́.]
      - cue: "Кото́рый час? (1:00)"
        accept: [Сейча́с час., Сейча́с оди́н час.]
      - cue: "Кото́рый час? (11:00)"
        accept: [Сейча́с оди́ннадцать часо́в.]
      - cue: "Кото́рый час? (6:00)"
        accept: [Сейча́с шесть часо́в.]

  - id: e3
    type: rewrite
    task: 莫斯科现在九点。按括号里的时差，说出各地现在几点。
    example:
      cue: Пеки́н (+5)
      answer: В Москве́ де́вять часо́в, а в Пеки́не два часа́.
    why: 先算出钟点（12 小时制），再按数词选 [час]{.ru} 的形式。地名前用 [в]{.ru} + 第六格：[в Пеки́не, во Владивосто́ке]{.ru}；[Владивосто́к]{.ru} 以两个辅音开头，前置词写成 [во]{.ru}。
    items:
      - cue: Калинингра́д (–1)
        accept: ["В Москве́ де́вять часо́в, а в Калинингра́де во́семь часо́в.", "В Москве́ де́вять часо́в, а в Калинингра́де во́семь."]
      - cue: Владивосто́к (+7)
        accept: ["В Москве́ де́вять часо́в, а во Владивосто́ке четы́ре часа́.", "В Москве́ де́вять часо́в, а во Владивосто́ке четы́ре."]
      - cue: Ло́ндон (–3)
        accept: ["В Москве́ де́вять часо́в, а в Ло́ндоне шесть часо́в.", "В Москве́ де́вять часо́в, а в Ло́ндоне шесть."]
      - cue: Пари́ж (–2)
        accept: ["В Москве́ де́вять часо́в, а в Пари́же семь часо́в.", "В Москве́ де́вять часо́в, а в Пари́же семь."]

  - id: e4
    type: fill
    task: 用 [спать]{.ru} 或 [звони́ть]{.ru} 的正确形式填空。
    why: "[спать]{.ru} 属第二变位：[сплю, спишь, спит, спим, спи́те, спят]{.ru}，第一人称插入 [л]{.ru}，容易误按第一变位写成 *[спа́ю]{.ru}。[звони́ть]{.ru} 重音一直在词尾：[звоню́, звони́шь, звони́т]{.ru}。"
    items:
      - stem: Сейча́с два часа́, ма́ма и па́па ___.
        hint: спать
        accept: [спят]
      - stem: Ми́ша, ты ___?
        hint: спать
        accept: [спишь]
      - stem: Я ча́сто ___ домо́й.
        hint: звони́ть
        accept: [звоню́]
      - stem: Уже́ по́здно, я ___.
        hint: спать
        accept: [сплю]
      - stem: Ван Лэй ___ домо́й.
        hint: звони́ть
        accept: [звони́т]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 数词要用文字写出，[час]{.ru} 按数词变形。第 2 题“打电话回家”是 [звони́ть домо́й]{.ru}。第 3 题“再一个小时”是 [ещё оди́н час]{.ru}，[оди́н]{.ru} 不省。
    items:
      - zh: ——几点了？——现在八点。
        accept: ["— Кото́рый час? — Сейча́с во́семь часо́в.", "— Кото́рый час? — Во́семь часо́в.", "— Кото́рый сейча́с час? — Сейча́с во́семь часо́в."]
        rubric: ["[Кото́рый час?]{.ru} 问钟点", "[во́семь часо́в]{.ru}"]
      - zh: 我想往家里打电话，可是北京现在是三点。
        accept: ["Я хочу́ звони́ть домо́й, но в Пеки́не сейча́с три часа́.", "Я хочу́ звони́ть домо́й, но сейча́с в Пеки́не три часа́."]
        rubric: ["[хочу́ звони́ть домо́й]{.ru}", "[три часа́]{.ru}"]
      - zh: 我能再玩一个小时吗？
        accept: ["Я могу́ игра́ть ещё оди́н час?", "Я могу́ игра́ть ещё час?"]
        rubric: ["[могу́]{.ru} + 不定式", "[ещё оди́н час]{.ru}"]
      - zh: 俄罗斯是一个很大的国家，各地时间不一样。
        accept: ["Росси́я — о́чень больша́я страна́, и вре́мя там ра́зное.", "Росси́я — о́чень больша́я страна́. В Росси́и ра́зное вре́мя.", "Росси́я — о́чень больша́я страна́, в Росси́и ра́зное вре́мя.", "Росси́я — о́чень больша́я страна́, там ра́зное вре́мя.", "Росси́я — о́чень больша́я страна́, и в Росси́и ра́зное вре́мя.", "Росси́я — больша́я страна́, и вре́мя там ра́зное."]
        rubric: ["[больша́я страна́]{.ru} 性一致", "“时间不一样”用 [ра́зное вре́мя]{.ru}，[вре́мя]{.ru} 是中性"]
