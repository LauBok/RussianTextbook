lesson: L72
grammar: "定向动词 [идти́, е́хать]{.ru} 与不定向动词 [ходи́ть, е́здить]{.ru} 的对比；[ходи́ть по]{.ru} + 第三格；[Когда́ я шёл…, я уви́дел…]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的现在时形式。
    why: "[ходи́ть]{.ru} 第一人称单数有辅音交替 [д → ж]{.ru}（[хожу́]{.ru}），[е́здить]{.ru} 是 [зд → зж]{.ru}（[е́зжу]{.ru}），其他人称不交替。[идти́]{.ru}、[е́хать]{.ru} 是第一变位，[ходи́ть]{.ru}、[е́здить]{.ru} 是第二变位，复数第三人称分别是 [иду́т, е́дут]{.ru} 和 [хо́дят, е́здят]{.ru}。"
    items:
      - stem: Я ка́ждый день ___ в библиоте́ку.
        hint: ходи́ть
        accept: ["хожу́"]
      - stem: Сейча́с мы ___ на уро́к.
        hint: идти́
        accept: ["идём"]
      - stem: Я ча́сто ___ на да́чу.
        hint: е́здить
        accept: ["е́зжу"]
      - stem: Куда́ ты ___ на авто́бусе?
        hint: е́хать
        accept: ["е́дешь"]
      - stem: Студе́нты обы́чно ___ в университе́т на метро́.
        hint: е́здить
        accept: ["е́здят"]
      - stem: Ми́ша мно́го ___ пешко́м.
        hint: ходи́ть
        accept: ["хо́дит"]
  - id: e2
    type: choice
    task: 选择定向动词或不定向动词。
    why: 第 1、4 题说此刻或当时正在路上，用定向动词。第 2 题有 [обы́чно]{.ru}，第 5 题有 [ка́ждую суббо́ту]{.ru}，是经常往返，用不定向动词。第 3 题 [по Эрмита́жу]{.ru} 是在一个地方到处走，没有固定方向，用 [ходи́ть]{.ru}。第 6 题 [когда́]{.ru} 引出的是路上的背景，用 [шла]{.ru}。
    items:
      - stem: — Куда́ вы ___? — На факульте́т.
        options: [идёте, хо́дите]
        answer: идёте
      - stem: Обы́чно мы ___ в университе́т вме́сте.
        options: [е́дем, е́здим]
        answer: е́здим
      - stem: Мы бу́дем ___ по Эрмита́жу це́лый день.
        options: [идти́, ходи́ть]
        answer: ходи́ть
      - stem: Ве́чером Ван Лэй ___ домо́й и ду́мал о Петербу́рге.
        options: [е́хал, е́здил]
        answer: е́хал
      - stem: Ка́ждую суббо́ту ба́бушка ___ в магази́н.
        options: [идёт, хо́дит]
        answer: хо́дит
      - stem: Когда́ А́нна ___ домо́й, она́ уви́дела Ми́шу.
        options: [шла, ходи́ла]
        answer: шла

  - id: e3
    type: rewrite
    task: 按例句用 [когда́]{.ru} 把两句话连成一句。
    example:
      cue: Я шёл в университе́т. Я уви́дел А́нну.
      answer: Когда́ я шёл в университе́т, я уви́дел А́нну.
    why: "[когда́]{.ru} 放在表示背景的那一句前面，两部分之间用逗号。背景是路上的过程，所以用 [шёл]{.ru}、[е́хал]{.ru}。第二部分的主语如果和第一部分相同，仍然要说出来：[я уви́дел]{.ru}、[он ду́мал]{.ru}。"
    items:
      - cue: Мы е́хали в метро́. Мы уви́дели О́льгу Ви́кторовну.
        accept: ["Когда́ мы е́хали в метро́, мы уви́дели О́льгу Ви́кторовну."]
      - cue: А́нна шла на факульте́т. Шёл снег.
        accept: ["Когда́ А́нна шла на факульте́т, шёл снег."]
      - cue: Ван Лэй е́хал домо́й. Он ду́мал о Петербу́рге.
        accept: ["Когда́ Ван Лэй е́хал домо́й, он ду́мал о Петербу́рге."]
      - cue: Па́па шёл ми́мо па́рка. Он уви́дел Ми́шу.
        accept: ["Когда́ па́па шёл ми́мо па́рка, он уви́дел Ми́шу."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题是经常往返，第 3 题是到处走，都用不定向动词；第 2、4 题是那一次的路上，用定向动词。
    items:
      - zh: 我每天坐地铁去学校。
        accept: ["Я ка́ждый день е́зжу в университе́т на метро́.", "Ка́ждый день я е́зжу в университе́т на метро́.", "Я ка́ждый день е́зжу на метро́ в университе́т.", "Ка́ждый день я е́зжу на метро́ в университе́т.", "Я е́зжу в университе́т на метро́ ка́ждый день.", "Я е́зжу на метро́ в университе́т ка́ждый день."]
        rubric: ["经常往返用 [е́зжу]{.ru}，不能用 [е́ду]{.ru}", "[на метро́]{.ru} 表示乘地铁"]
      - zh: 你现在去哪儿？——去图书馆。
        accept: ["— Куда́ ты сейча́с идёшь? — В библиоте́ку.", "— Куда́ ты идёшь сейча́с? — В библиоте́ку.", "— Куда́ ты сейча́с идёшь? — Я иду́ в библиоте́ку.", "— Куда́ ты идёшь сейча́с? — Я иду́ в библиоте́ку.", "— Ты сейча́с куда́ идёшь? — В библиоте́ку.", "— Куда́ ты идёшь? — В библиоте́ку.", "— Куда́ ты идёшь? — Я иду́ в библиоте́ку."]
        rubric: ["此刻正在去，用 [идёшь]{.ru}", "[в библиоте́ку]{.ru} 用第四格"]
      - zh: 星期天我们在莫斯科城里到处走。
        accept: ["В воскресе́нье мы ходи́ли по Москве́.", "Мы ходи́ли по Москве́ в воскресе́нье.", "В воскресе́нье мы ходи́ли по го́роду.", "В воскресе́нье мы гуля́ли по Москве́.", "Мы гуля́ли по Москве́ в воскресе́нье.", "В воскресе́нье мы хо́дим по Москве́."]
        rubric: ["[ходи́ли по]{.ru}（指每个星期天的习惯时也可用 [хо́дим по]{.ru}）加第三格 [Москве́]{.ru}", "不能用 [шли]{.ru}、[идём]{.ru}"]
      - zh: 我走回家的时候，下着雪。
        accept: ["Когда́ я шёл домо́й, шёл снег.", "Когда́ я шла домо́й, шёл снег."]
        rubric: ["背景用 [когда́ я шёл / шла]{.ru}", "“下雪”用 [шёл снег]{.ru}", "[домо́й]{.ru} 表示回家的方向"]

  - id: e5
    type: open
    task: 情景对话：你去上课的路上遇见一位同学，问问他去哪儿、平时怎么去学校、周末去了哪儿。
    items:
      - prompt: 用上 [Куда́ ты идёшь?]{.ru}、[обы́чно]{.ru}、[ходи́ть]{.ru} 或 [е́здить]{.ru} 的过去时。
        length: 50–80
        model: "— Приве́т! Куда́ ты идёшь?\n— Приве́т! Я иду́ на уро́к. А ты?\n— Я то́же. Ты обы́чно е́здишь в университе́т на метро́?\n— Да, я е́зжу на метро́. А сего́дня я шёл пешко́м: бы́ло не хо́лодно.\n— А что ты де́лал в суббо́ту?\n— Я ходи́л в Третьяко́вскую галере́ю. А ты?\n— А я е́здил на да́чу."
        rubric: ["此刻去哪儿用 [идти́]{.ru}", "平时怎么去用 [ходи́ть / е́здить]{.ru} 现在时", "周末去了哪儿用 [ходи́л / е́здил]{.ru}", "对话自然，有问有答"]
        notes: 范文分三轮问答：先问此刻去哪儿（定向 [иду́]{.ru}），再问平时怎么去（不定向 [е́здишь, е́зжу]{.ru}），最后问周末（不定向过去时 [ходи́л, е́здил]{.ru}）。中间 [сего́дня я шёл пешко́м]{.ru} 说的是今天这一次路上的情形，所以用定向动词，和前一句的 [е́зжу]{.ru} 形成对比。
