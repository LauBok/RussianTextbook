lesson: B2-L53
grammar: "比较从句：[как]{.ru}（[так…, как]{.ru}、[тако́й же…, как]{.ru}）、[чем]{.ru}、[как бу́дто]{.ru}；插入语 [похо́же]{.ru}；[как]{.ru} 构成的比喻熟语。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的连接词。
    why: "第 1、4 题前面有比较级（[ра́ньше]{.ru}、[лу́чше]{.ru}），后面只能用 [чем]{.ru}。第 2 题 [тако́й же]{.ru} 表示相同，和 [как]{.ru} 呼应。第 3、5 题说的是并不真实的样子（迪马不是职业球员，迪马不是米沙的哥哥），用 [как бу́дто]{.ru}。第 6 题是熟语 [как бе́лка в колесе́]{.ru}，用 [как]{.ru}。"
    items:
      - stem: Ди́ма пришёл ра́ньше, ___ обы́чно.
        options: [чем, как, как бу́дто]
        answer: чем
      - stem: Не́бо тако́е же, ___ во вто́рник.
        options: [чем, как, как бу́дто]
        answer: как
      - stem: Ди́ма игра́л так, ___ он настоя́щий футболи́ст.
        options: [чем, как бу́дто, что́бы]
        answer: как бу́дто
      - stem: Ди́ма игра́ет лу́чше, ___ Ми́ша.
        options: [чем, как, как бу́дто]
        answer: чем
      - stem: Ми́ша смотре́л на Ди́му так, ___ э́то был его́ ста́рший брат.
        options: [чем, как бу́дто, так как]
        answer: как бу́дто
      - stem: Пе́ред экза́менами А́нна кру́тится ___ бе́лка в колесе́.
        options: [чем, как, так как]
        answer: как

  - id: e2
    type: fill
    task: 用比喻熟语填空：[как ры́ба в воде́]{.ru}、[как снег на го́лову]{.ru}、[как бе́лка в колесе́]{.ru}。
    why: "按意思选：第 1 题突然来访，是 [как снег на го́лову]{.ru}；第 2 题从早忙到晚，是 [как бе́лка в колесе́]{.ru}；第 3 题在熟悉的地方自在，是 [как ры́ба в воде́]{.ru}。熟语是固定的，词形和语序都不能改。"
    items:
      - stem: Ди́ма пришёл ___ — никто́ его́ не ждал.
        accept: ["как снег на го́лову"]
      - stem: С утра́ до ве́чера ма́ма рабо́тает, гото́вит у́жин, помога́ет де́тям — кру́тится ___.
        accept: ["как бе́лка в колесе́"]
      - stem: На стадио́не Ди́ма чу́вствует себя́ ___.
        accept: ["как ры́ба в воде́"]

  - id: e3
    type: rewrite
    task: 按例句用 [как бу́дто]{.ru} 改写句子，说出“看起来好像……”。
    example:
      cue: Ди́ма не футболи́ст, но он игра́ет о́чень хорошо́.
      answer: Ди́ма игра́ет так, как бу́дто он футболи́ст.
    why: "[как бу́дто]{.ru} 引出想象的情况：实际上“不是”，从句里就把它说成“是”，去掉否定。主句里用 [так]{.ru} 修饰动词，和 [как бу́дто]{.ru} 呼应。从句动词按实际时间：第 2 题说的是过去的事，用过去时 [ви́дел]{.ru}。"
    items:
      - cue: Ван Лэй не ру́сский, но он говори́т по-ру́сски о́чень хорошо́.
        accept: ["Ван Лэй говори́т по-ру́сски так, как бу́дто он ру́сский.", "Ван Лэй говори́т по-ру́сски так, как бу́дто он ру́сский челове́к."]
      - cue: Ми́ша ви́дел Ди́му в пе́рвый раз, но говори́л с ним о́чень свобо́дно.
        accept: ["Ми́ша говори́л с Ди́мой так, как бу́дто давно́ его́ знал.", "Ми́ша говори́л с Ди́мой так, как бу́дто он давно́ его́ знал.", "Ми́ша говори́л с Ди́мой так, как бу́дто уже́ ви́дел его́ ра́ньше.", "Ми́ша говори́л с Ди́мой так, как бу́дто он уже́ ви́дел его́ ра́ньше."]
      - cue: Му́рка не гла́вная в до́ме, но она́ спит на всех дива́нах.
        accept: ["Му́рка спит на всех дива́нах так, как бу́дто она́ гла́вная в до́ме.", "Му́рка спит на всех дива́нах, как бу́дто она́ гла́вная в до́ме.", "Му́рка спит на всех дива́нах так, как бу́дто она́ в до́ме гла́вная."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题比较级后用 [чем]{.ru}，副词 [обы́чно]{.ru} 前不能省去 [чем]{.ru}；第 2 题“和……一样”用 [тако́й же, как]{.ru}；第 3 题“好像”是想象的比较，用 [как бу́дто]{.ru}；第 4 题“看样子”用插入语 [похо́же]{.ru}。
    items:
      - zh: 今天迪马来得比平时早。
        accept: ["Сего́дня Ди́ма пришёл ра́ньше, чем обы́чно.", "Ди́ма сего́дня пришёл ра́ньше, чем обы́чно.", "Сего́дня Ди́ма пришёл ра́ньше обы́чного."]
        rubric: ["比较级 [ра́ньше]{.ru} + [чем обы́чно]{.ru}"]
      - zh: 今天的天气和昨天一样。
        accept: ["Сего́дня пого́да така́я же, как вчера́.", "Пого́да сего́дня така́я же, как вчера́."]
        rubric: ["[така́я же]{.ru} 和 [пого́да]{.ru} 一致，阴性", "[как вчера́]{.ru}"]
      - zh: 王磊说俄语好像他是俄罗斯人。
        accept: ["Ван Лэй говори́т по-ру́сски так, как бу́дто он ру́сский.", "Ван Лэй говори́т по-ру́сски, как бу́дто он ру́сский."]
        rubric: ["想象的比较用 [как бу́дто]{.ru}", "主句可以加 [так]{.ru} 呼应"]
      - zh: 看样子要下雨了，带上伞吧。
        accept: ["Похо́же, бу́дет дождь, возьми́ зонт.", "Похо́же, бу́дет дождь, возьми́те зонт.", "Похо́же, пойдёт дождь, возьми́ зонт.", "Похо́же, пойдёт дождь, возьми́те зонт.", "Похо́же, сейча́с пойдёт дождь, возьми́ зонт.", "Похо́же, сейча́с пойдёт дождь, возьми́те зонт.", "Похо́же, бу́дет дождь, так что возьми́ зонт.", "Похо́же, бу́дет дождь, так что возьми́те зонт."]
        rubric: ["插入语 [похо́же]{.ru} 后用逗号", "[возьми́ / возьми́те зонт]{.ru}：命令式"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́е бы́ло не́бо у́тром? Когда́ пришёл Ди́ма и почему́? Почему́ А́нна не пошла́ на стадио́н? Как игра́л Ди́ма? Пошёл ли дождь?]{.ru}"
        length: 60–90
        model: "Пя́того ию́ня у́тром не́бо бы́ло тако́е же се́рое, как во вто́рник, и Мари́я Никола́евна сказа́ла, что, похо́же, бу́дет дождь. Ди́ма пришёл ра́ньше, чем обы́чно, потому́ что у него́ с Ми́шей был ва́жный матч. А́нна не пошла́ с ни́ми, так как в понеде́льник у неё был зачёт: всю неде́лю она́ кру́тится как бе́лка в колесе́. На стадио́не Ди́ма игра́л так, как бу́дто он настоя́щий футболи́ст. А дождь так и не пошёл, хотя́ Ми́ша взял зонт."
        rubric: ["回答全部五个问题", "至少用到 [как]{.ru}、[чем]{.ru}、[как бу́дто]{.ru} 中的两个", "至少一个比喻熟语"]
        notes: 范文约 85 词，五个问题各用一两句话回答，比较结构 [тако́е же…, как]{.ru}、[ра́ньше, чем обы́чно]{.ru}、[так, как бу́дто]{.ru} 都用上了。最后一句用第 52 课的 [хотя́]{.ru}，点出“带了伞反而没下雨”的意外。

  - id: e6
    type: open
    task: 作文：《我的朋友》。描写你的一位朋友：外貌、性格、爱好，以及他（她）和别人比有什么不同。
    items:
      - prompt: 至少用两处 [чем]{.ru}、一处 [как]{.ru}（或 [тако́й же, как]{.ru}）、一处 [как бу́дто]{.ru}，再用上一个本课的比喻熟语。
        length: 100–150
        model: "Моего́ лу́чшего дру́га зову́т Ли. Мы вме́сте учи́лись в шко́ле. Он вы́ше, чем я, и бе́гает быстре́е, чем все в на́шем кла́ссе. Он тако́й же весёлый, как его́ оте́ц: он всегда́ шу́тит и смеётся. Когда́ мы игра́ем в футбо́л, Ли чу́вствует себя́ на по́ле как ры́ба в воде́. А на уро́ках матема́тики он сиди́т так ти́хо, как бу́дто его́ там нет. Матема́тику он не о́чень лю́бит. Зато́ исто́рию Кита́я он зна́ет лу́чше, чем все мы. Ли мо́жет говори́ть о ней часа́ми, как бу́дто он сам жил в те времена́. Сейча́с он у́чится в Шанха́е, и мы ви́димся ре́же, чем ра́ньше. Но когда́ он приезжа́ет, мне ка́жется, что мы ви́делись вчера́."
        rubric: ["写到朋友的外貌、性格、爱好", "至少两处 [чем]{.ru}、一处 [как]{.ru}、一处 [как бу́дто]{.ru}", "至少一个比喻熟语，用得恰当", "100–150 词"]
        notes: 范文约 130 词。比较结构穿插在描写里：外貌和本领用 [чем]{.ru}（[вы́ше, чем я]{.ru}、[ре́же, чем ра́ньше]{.ru}），性格用 [тако́й же…, как]{.ru}（这里 [тако́й же]{.ru} 是谓语，和主语 [он]{.ru} 一致），想象的情形用 [как бу́дто]{.ru}。[часа́ми]{.ru} 意思是“一连几个小时”，[зато́]{.ru} 意思是“不过，可是（另一方面）”。

  - id: e7
    type: open
    task: 书信写作：以王磊的身份给北京的父母写一封信，讲讲六月初的生活（考查、雷雨、迪马和米沙的比赛），并告诉他们回国的日子快到了。
    items:
      - prompt: 写上地点日期、称呼和落款；至少用一处 [чем]{.ru}、一处 [как бу́дто]{.ru}、一个比喻熟语；用一处 [хотя́]{.ru}。
        length: 80–120
        model: "Москва́, 6 ию́ня\n\nДороги́е ма́ма и па́па!\n\nКак вы? У меня́ сейча́с мно́го рабо́ты: ско́ро экза́мены, и я кручу́сь как бе́лка в колесе́. Хотя́ я немно́го уста́л, настрое́ние хоро́шее. На про́шлой неде́ле была́ си́льная гроза́, и мы с Ди́мой и Ми́шей промо́кли на стадио́не. А вчера́ они́ сно́ва игра́ли в футбо́л, и Ди́ма игра́л так, как бу́дто он настоя́щий футболи́ст. Ми́ша смо́трит на него́ как на ста́ршего бра́та. Вре́мя здесь идёт быстре́е, чем в Пеки́не: я да́же не заме́тил, как прошёл год! Че́рез ме́сяц я бу́ду до́ма.\n\nЦелу́ю вас.\nВаш сын Ван Лэй"
        rubric: ["书信格式：地点日期、称呼、落款", "讲到考查、雷雨、比赛和回国", "至少一处 [чем]{.ru}、一处 [как бу́дто]{.ru}、一个比喻熟语、一处 [хотя́]{.ru}", "80–120 词"]
        notes: 范文约 105 词。按“近况—上周的雷雨—昨天的比赛—感想和回国”的顺序写。[Вре́мя идёт быстре́е, чем…]{.ru} 用上了第 44 课的运动动词转义和本课的 [чем]{.ru}。王磊 7 月 15 日左右回国，所以说“一个月以后”。
