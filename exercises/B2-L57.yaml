lesson: B2-L57
grammar: "时间状语：[за]{.ru} + 第四格（用多久完成）、[на]{.ru} + 第四格（结果保持多久）、不带前置词的第四格（进行多久）、[че́рез]{.ru} + 第四格（多久以后）、[в тече́ние]{.ru} + 第二格（在一段时间之内）。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的前置词。
    why: "第 1、4 题书借来、人去了以后，结果要保持一段时间（书要用到下周一、星期天晚上才回来），用 [на]{.ru}。第 2、6 题说做完一件事用了多少时间，动词是完成体，用 [за]{.ru}。第 3 题“三天以后”用 [че́рез]{.ru}。第 5 题 [всего́ семе́стра]{.ru} 是第二格，三个选项里只有 [в тече́ние]{.ru} 支配第二格；[за]{.ru}、[на]{.ru} 都要求第四格。"
    items:
      - stem: "Ван Лэй взял кни́гу в библиоте́ке ___ неде́лю: она́ нужна́ ему́ до сле́дующего понеде́льника."
        options: [за, на, че́рез]
        answer: на
      - stem: Ван Лэй сел за стол в семь, а в де́вять всё бы́ло гото́во. Он сде́лал все упражне́ния ___ два часа́.
        options: [за, на, в тече́ние]
        answer: за
      - stem: Сего́дня понеде́льник, а ___ три дня, в четве́рг, у А́нны экза́мен.
        options: [за, на, че́рез]
        answer: че́рез
      - stem: В суббо́ту у́тром роди́тели е́дут к ба́бушке ___ два дня и верну́тся в воскресе́нье ве́чером.
        options: [за, на, в тече́ние]
        answer: на
      - stem: Студе́нты занима́лись грамма́тикой ___ всего́ семе́стра.
        options: [в тече́ние, за, на]
        answer: в тече́ние
      - stem: Ди́ма прочита́л э́тот рома́н ___ оди́н ве́чер.
        options: [за, на, в тече́ние]
        answer: за

  - id: e2
    type: rewrite
    task: 按例句改写：把过程改成结果，用完成体和 [за]{.ru}。
    example:
      cue: Он чита́л кни́гу неде́лю.
      answer: Он прочита́л кни́гу за неде́лю.
    why: "不带前置词的第四格说明动作进行了多久，动词用未完成体；[за]{.ru} + 第四格说明用多久做完，动词换成完成体：[писа́ть → написа́ть]{.ru}，[де́лать → сде́лать]{.ru}，[учи́ть → вы́учить]{.ru}，[повторя́ть → повтори́ть]{.ru}。第 3 题 [весь ве́чер]{.ru} 改成 [за ве́чер]{.ru}，[весь]{.ru} 去掉。注意 [вы́учить]{.ru} 的重音在前缀上。"
    items:
      - cue: Она́ писа́ла письмо́ час.
        accept: ["Она́ написа́ла письмо́ за час."]
      - cue: Мы де́лали упражне́ния два часа́.
        accept: ["Мы сде́лали упражне́ния за два часа́."]
      - cue: Ди́ма учи́л слова́ весь ве́чер.
        accept: ["Ди́ма вы́учил слова́ за ве́чер.", "Ди́ма вы́учил слова́ за оди́н ве́чер."]
      - cue: Ван Лэй повторя́л грамма́тику неде́лю.
        accept: ["Ван Лэй повтори́л грамма́тику за неде́лю."]

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题“借一个星期”是结果保持的时间，用 [на]{.ru}；第 2 题用 [че́рез]{.ru}；第 3 题“用一个晚上读完”用 [за]{.ru} 和完成体；第 4 题“整个学期”可以用 [в тече́ние всего́ семе́стра]{.ru}，也可以用不带前置词的 [весь семе́стр]{.ru}；第 5 题“去住两天”用 [на два дня]{.ru}，不能只说 [два дня]{.ru}。"
    items:
      - zh: 我借了这本书，借期一周。
        accept: ["Я взял э́ту кни́гу на неде́лю.", "Я взяла́ э́ту кни́гу на неде́лю.", "Я взял кни́гу на неде́лю.", "Я взяла́ кни́гу на неде́лю."]
        rubric: ["[на неде́лю]{.ru}：结果保持的时间", "完成体 [взял / взяла́]{.ru}"]
      - zh: 三天以后我有考试。
        accept: ["Че́рез три дня у меня́ экза́мен.", "Че́рез три дня у меня́ бу́дет экза́мен.", "У меня́ экза́мен че́рез три дня.", "У меня́ бу́дет экза́мен че́рез три дня."]
        rubric: ["[че́рез три дня]{.ru}", "[у меня́ экза́мен]{.ru}"]
      - zh: 他用一个晚上读完了这本书。
        accept: ["Он прочита́л э́ту кни́гу за оди́н ве́чер.", "Он прочита́л э́ту кни́гу за ве́чер.", "Э́ту кни́гу он прочита́л за оди́н ве́чер.", "Э́ту кни́гу он прочита́л за ве́чер."]
        rubric: ["[за]{.ru} + 第四格", "完成体 [прочита́л]{.ru}"]
      - zh: 整个学期我们都在学语法。
        accept: ["В тече́ние всего́ семе́стра мы занима́лись грамма́тикой.", "Мы занима́лись грамма́тикой в тече́ние всего́ семе́стра.", "Весь семе́стр мы занима́лись грамма́тикой.", "Мы занима́лись грамма́тикой весь семе́стр.", "В тече́ние всего́ семе́стра мы изуча́ли грамма́тику.", "Весь семе́стр мы изуча́ли грамма́тику.", "Мы изуча́ли грамма́тику весь семе́стр."]
        rubric: ["[в тече́ние всего́ семе́стра]{.ru} 或 [весь семе́стр]{.ru}", "未完成体：动作持续进行"]
      - zh: 星期六父母要去奶奶家住两天。
        accept: ["В суббо́ту роди́тели е́дут к ба́бушке на два дня.", "В суббо́ту роди́тели пое́дут к ба́бушке на два дня.", "Роди́тели е́дут к ба́бушке на два дня в суббо́ту.", "В суббо́ту роди́тели е́дут на два дня к ба́бушке.", "В суббо́ту роди́тели пое́дут на два дня к ба́бушке."]
        rubric: ["[на два дня]{.ru}，不能说 [два дня]{.ru}", "[к ба́бушке]{.ru}：到人那里用 [к]{.ru} + 第三格"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й экза́мен был у Ван Лэ́я пятна́дцатого ию́ня? Что сказа́ла О́льга Ви́кторовна на консульта́ции? Что Ван Лэй взял в библиоте́ке? Куда́ е́дут Петро́вы в суббо́ту и почему́ Ван Лэй не е́дет с ни́ми? Как он занима́лся ве́чером?]{.ru}"
        length: 60–90
        model: "Пятна́дцатого ию́ня у Ван Лэ́я был пе́рвый экза́мен — пи́сьменный, по грамма́тике. На консульта́ции О́льга Ви́кторовна сказа́ла, что на у́стном экза́мене на подгото́вку бу́дет со́рок мину́т и что повтори́ть всю грамма́тику за оди́н ве́чер нельзя́. Она́ посове́товала повтори́ть склоне́ние и спряже́ние и не не́рвничать. Ван Лэй взял в библиоте́ке сбо́рник упражне́ний на неде́лю. В суббо́ту роди́тели и Ми́ша е́дут к ба́бушке на два дня, но Ван Лэй не мо́жет пое́хать: че́рез четы́ре дня у него́ второ́й экза́мен. Ве́чером он сде́лал два́дцать упражне́ний за четы́ре часа́."
        rubric: ["回答全部五个问题", "至少三种时间状语：[за]{.ru}、[на]{.ru}、[че́рез]{.ru}", "直接引语改成 [сказа́ла, что…]{.ru}"]
        notes: 范文约 85 词。老师的话用间接引语转述，两件事用两个 [что]{.ru} 连起来。[взял… на неде́лю]{.ru}、[за четы́ре часа́]{.ru}、[че́рез четы́ре дня]{.ru} 三种时间状语都照课文保留。

  - id: e5
    type: open
    task: 作文。题目：[Неде́ля пе́ред экза́меном]{.ru}（考试前的一个星期）。
    items:
      - prompt: 写你（或你想象中的一个学生）考试前一周怎样安排时间：每天学什么、用多长时间、借了什么书、考完以后打算做什么。至少用上 [за]{.ru}、[на]{.ru}、[че́рез]{.ru}、[в тече́ние]{.ru} 各一次。
        length: 100–150
        model: "Че́рез неде́лю у меня́ экза́мен по исто́рии. В тече́ние семе́стра я ходи́л на все ле́кции, но тепе́рь на́до всё повтори́ть.\n\nВ понеде́льник я пошёл в библиоте́ку и взял там две кни́ги на неде́лю. У́тром я чита́ю, а ве́чером повторя́ю да́ты. Вчера́ за три часа́ я вы́учил все да́ты из пе́рвых десяти́ биле́тов. Ка́ждый день я занима́юсь шесть и́ли семь часо́в.\n\nВ сре́ду у нас была́ консульта́ция. Преподава́тель сказа́л, что на подгото́вку у нас бу́дет полчаса́. Э́то немно́го, поэ́тому я учу́сь отвеча́ть бы́стро.\n\nКоне́чно, за одну́ неде́лю нельзя́ узна́ть всё. Но я ду́маю, что всё бу́дет хорошо́. А по́сле экза́мена я пое́ду к друзья́м на да́чу на три дня. Там я бу́ду то́лько спать и гуля́ть!"
        rubric: ["[за]{.ru}、[на]{.ru}、[че́рез]{.ru}、[в тече́ние]{.ru} 各至少一次，用法正确", "[за]{.ru} 和完成体、不带前置词的第四格和未完成体搭配", "有计划、有结尾"]
        notes: 范文四段：考试是什么时候（[че́рез]{.ru}、[в тече́ние]{.ru}）—怎样复习（[на неде́лю]{.ru}、[за три часа́]{.ru}、[шесть и́ли семь часо́в]{.ru}）—答疑课—考后打算（[за одну́ неде́лю]{.ru}、[на три дня]{.ru}）。注意 [ка́ждый день я занима́юсь шесть часо́в]{.ru} 用不带前置词的第四格，因为说的是进行了多久。
  - id: e6
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。奶奶的别墅没有网，6 月 18 日你写一封短信，请米沙星期六带给奶奶：问候她，说明这次为什么不能去，讲讲你的考试，说说什么时候能去看她。
        length: 70–110
        model: "Москва́, 18 ию́ня\n\nДорога́я ба́бушка!\n\nЗдра́вствуйте! Как вы живёте? Как ва́ше здоро́вье?\n\nВ э́ту суббо́ту я не смогу́ прие́хать к вам. У меня́ се́ссия: за оди́ннадцать дней у меня́ три экза́мена. Пе́рвый экза́мен, по грамма́тике, уже́ позади́, сего́дня был второ́й, а после́дний бу́дет два́дцать пя́того ию́ня. Я мно́го занима́юсь и в тече́ние дня почти́ не выхожу́ из до́ма.\n\nНо че́рез де́сять дней, два́дцать восьмо́го ию́ня, я обяза́тельно прие́ду к вам на да́чу, и не на два дня, а на две неде́ли. Я о́чень хочу́ попро́бовать ва́ши пирожки́!\n\nДо свида́ния!\n\nВаш Ван Лэй"
        rubric: ["书信格式；对奶奶用 [вы]{.ru}", "说明不能去的原因", "考试日期和至少三种时间状语", "说明以后什么时候去"]
        notes: 给长辈写信用 [Дорога́я ба́бушка!]{.ru}、[Здра́вствуйте!]{.ru}，全文用 [вы]{.ru}，落款 [Ваш]{.ru}。[не на два дня, а на две неде́ли]{.ru}：和米沙他们只去两天对照，[на]{.ru} + 第四格说明到了以后要待多久。
