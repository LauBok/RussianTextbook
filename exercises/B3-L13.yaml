lesson: B3-L13
grammar: "副动词短语与从句的互换：改成从句要选连词、补出主语、按副动词的体和主句的时间定动词形式；从句改成副动词短语的条件是两个分句主语相同。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Когда в Петербурге бывают белые ночи и почему они бывают? Какие писатели писали о белых ночах? Зачем в Петербурге разводят мосты? Что такое «Алые паруса»? Какой фестиваль проходит в белые ночи? Почему не всем нравятся белые ночи?]{.ru}"
        length: 60–90
        model: "Самые светлые ночи в Петербурге бывают с 11 июня по 2 июля. Они бывают потому, что город находится далеко на севере, почти на шестидесятом градусе северной широты, и летом солнце заходит лишь на несколько часов. О белых ночах писали Пушкин в поэме «Медный всадник» и Достоевский в повести «Белые ночи». Мосты разводят ночью, чтобы большие суда могли пройти по Неве: днём по мостам идут машины. «Алые паруса» — праздник выпускников школ: ночью по Неве плывёт корабль с алыми парусами. С 1993 года Мариинский театр проводит фестиваль «Звёзды белых ночей». Привыкнув к тёмным ночам, многие приезжие плохо спят, потому что свет мешает им уснуть."
        rubric: ["六个问题都回答，日期和人名准确", "至少用一处副动词短语", "用完整的句子"]
        notes: "范文约 95 词。第 1 题要答出时间和原因两部分。最后一句用了课文的完成体副动词短语 [привыкнув к тёмным ночам]{.ru}，同时用 [потому что]{.ru} 补出原因。"

  - id: e2
    type: rewrite
    task: 把副动词短语改写成从句或并列谓语，连词用括号里给的。
    example:
      cue: Гуляя по пустым улицам, герой встречает Настеньку. (когда)
      answer: Когда герой гуляет по пустым улицам, он встречает Настеньку.
    why: "从句要补出主语，名词主语移进从句，主句换成代词。动词的体跟副动词一致，时间跟主句一致：第 1 题未完成体副动词、主句过去时 → [приезжали]{.ru}。第 2 题完成体、主句过去时 → [посмотрели]{.ru}。第 3 题完成体副动词 [привыкнув]{.ru} 表示原因，主句现在时，从句用过去时 [привыкли]{.ru}，因为“习惯”是以前形成、至今保持的状态。第 4 题未完成体副动词 [веря]{.ru}，主句现在时 → [верит]{.ru}。第 5 题完成体副动词表示先完成的动作，改成两个并列谓语，体不变：[вышли и гуляли]{.ru}。"
    items:
      - cue: Приезжая в Петербург, писатели писали о белых ночах. (когда)
        accept: ["Когда писатели приезжали в Петербург, они писали о белых ночах."]
      - cue: Посмотрев на мосты, туристы пошли домой. (после того как)
        accept: ["После того как туристы посмотрели на мосты, они пошли домой."]
      - cue: Привыкнув к тёмным ночам, приезжие плохо спят. (так как)
        accept: ["Так как приезжие привыкли к тёмным ночам, они плохо спят."]
      - cue: Веря в свою мечту, Ассоль ждёт корабль с алыми парусами. (так как)
        accept: ["Так как Ассоль верит в свою мечту, она ждёт корабль с алыми парусами."]
      - cue: Выйдя вечером из дома, мы гуляли по набережной до утра. (и)
        accept: ["Мы вышли вечером из дома и гуляли по набережной до утра.", "Вечером мы вышли из дома и гуляли по набережной до утра."]

  - id: e3
    type: rewrite
    task: 把从句或并列谓语改写成副动词短语。
    example:
      cue: Когда писатели приезжали в Петербург, они не могли не писать о белых ночах.
      answer: Приезжая в Петербург, писатели не могли не писать о белых ночах.
    why: "先确认主语相同，再看从句动词的体：未完成体 → 未完成体副动词，完成体 → 完成体副动词。第 1 题 [опускается]{.ru} 未完成体 → [опускаясь]{.ru}。第 2 题 [опоздал]{.ru} 完成体 → [опоздав]{.ru}。第 3 题 [описывал]{.ru} 未完成体 → [описывая]{.ru}。第 4 题 [вернулись]{.ru} 完成体带 [-ся]{.ru} → [вернувшись]{.ru}。第 5 题 [не включаем]{.ru} → [не включая]{.ru}，否定词 [не]{.ru} 保留。"
    items:
      - cue: Солнце опускается за горизонт и скоро поднимается снова.
        accept: ["Опускаясь за горизонт, солнце скоро поднимается снова.", "Солнце, опускаясь за горизонт, скоро поднимается снова."]
      - cue: Так как мой друг опоздал к мосту, он остался на другом берегу до утра.
        accept: ["Опоздав к мосту, мой друг остался на другом берегу до утра.", "Мой друг, опоздав к мосту, остался на другом берегу до утра."]
      - cue: Когда Пушкин описывал Петербург, он писал о белых ночах.
        accept: ["Описывая Петербург, Пушкин писал о белых ночах.", "Пушкин, описывая Петербург, писал о белых ночах."]
      - cue: После того как мы вернулись домой, мы долго не могли уснуть.
        accept: ["Вернувшись домой, мы долго не могли уснуть.", "Мы, вернувшись домой, долго не могли уснуть."]
      - cue: Мы не включаем свет и читаем книгу у окна.
        accept: ["Не включая свет, мы читаем книгу у окна.", "Не включая света, мы читаем книгу у окна.", "Мы, не включая света, читаем книгу у окна.", "Мы, не включая свет, читаем книгу у окна.", "Мы читаем книгу у окна, не включая света.", "Мы читаем книгу у окна, не включая свет."]

  - id: e4
    type: choice
    task: 把前一句改写成后一句，选择正确的形式。
    why: "第 1 题从句 [посмотрели]{.ru} 是完成体，用完成体副动词 [Посмотрев]{.ru}；[Смотря]{.ru} 是未完成体，体不对；[Посмотревшие]{.ru} 是形动词，要修饰名词。第 2 题 [гуляли]{.ru} 未完成体 → [Гуляя]{.ru}；[Гуляли]{.ru} 是变位动词，放在这里句子就有了两个谓语而没有连词。第 3 题 [привыкли]{.ru} 完成体 → [Привыкнув]{.ru}。第 4 题从句是不定人称句，开桥的是不确定的人，主句的主语是 [мы]{.ru}，主语不同，不能用副动词，只能保留从句。第 5 题 [хотеть]{.ru} 没有副动词，用同义词 [желая]{.ru}。"
    items:
      - stem: "Когда мы посмотрели на мост, мы пошли домой. → ___ на мост, мы пошли домой."
        options: [Смотря, Посмотрев, Посмотревшие]
        answer: Посмотрев
      - stem: "Когда туристы гуляли по набережной, они фотографировали дворцы. → ___ по набережной, туристы фотографировали дворцы."
        options: [Гуляя, Гуляли, Гулявшие]
        answer: Гуляя
      - stem: "Так как приезжие привыкли к тёмным ночам, они плохо спят. → ___ к тёмным ночам, приезжие плохо спят."
        options: [Привыкая, Привыкнув, Привыкшие]
        answer: Привыкнув
      - stem: "Когда начали разводить мосты, мы были на другом берегу. → ___, мы были на другом берегу."
        options: [Начав разводить мосты, Разводя мосты, Когда начали разводить мосты]
        answer: Когда начали разводить мосты
      - stem: "Так как он хотел увидеть белые ночи, он приехал в июне. → ___ увидеть белые ночи, он приехал в июне."
        options: [Хотя, Желая, Хотев]
        answer: Желая

  - id: e5
    type: translate
    task: 翻译下列句子，用副动词短语。
    items:
      - zh: 太阳落到地平线下，很快又升起来。
        accept: ["Опускаясь за горизонт, солнце скоро поднимается снова.", "Солнце, опускаясь за горизонт, скоро поднимается снова.", "Опустившись за горизонт, солнце скоро поднимается снова.", "Солнце, опустившись за горизонт, скоро поднимается снова.", "Опустившись за горизонт, солнце скоро снова поднимается."]
        rubric: ["[опускаясь / опустившись за горизонт]{.ru}：[за]{.ru} + 第四格表示方向", "[снова]{.ru} 或 [опять]{.ru}"]
      - zh: 游客们看着桥慢慢升起，给它拍照。
        accept: ["Глядя, как медленно поднимается мост, туристы фотографируют его.", "Глядя, как мост медленно поднимается, туристы фотографируют его.", "Глядя, как медленно поднимается мост, туристы фотографировали его.", "Глядя, как мост медленно поднимается, туристы фотографировали его."]
        rubric: ["[глядя, как …]{.ru}：未完成体副动词表示同时进行", "[фотографировать его]{.ru}：代词宾语第四格"]
      - zh: 他晚上出了家门，沿着涅瓦河岸散步到天亮。
        accept: ["Выйдя вечером из дома, он гулял по набережной Невы до утра.", "Выйдя вечером из дома, он гулял по набережной Невы до самого утра.", "Вечером, выйдя из дома, он гулял по набережной Невы до утра.", "Выйдя вечером из дома, он гулял по берегу Невы до утра."]
        rubric: ["[выйдя]{.ru}：[-йти]{.ru} 类完成体副动词", "[по набережной]{.ru}：[по]{.ru} + 第三格", "[до утра]{.ru}"]

  - id: e6
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段：凡是课文里的副动词短语，在缩写中至少改写三处为从句或并列谓语；再把至少两处课文里的从句或并列谓语改写成副动词短语。
    items:
      - prompt: "提纲：什么是白夜，什么时候有；为什么有白夜；作家笔下的白夜；开桥；“红帆”节；白夜的另一面。"
        length: 120–150
        model: "Каждый год в июне в Петербурге наступают белые ночи. Когда солнце опускается за горизонт, оно скоро поднимается снова, и темнота так и не наступает. Самые светлые ночи бывают с 11 июня по 2 июля. Так бывает потому, что город находится почти на шестидесятом градусе северной широты. Когда писатели приезжали в Петербург, они не могли не писать о белых ночах: Пушкин говорил о них в «Медном всаднике», а Достоевский назвал так свою повесть. В июне люди выходят вечером из дома и гуляют по набережным до утра. Собравшись на берегу, они смотрят, как разводят мосты. Для выпускников школ проводят праздник «Алые паруса»: по Неве плывёт корабль с алыми парусами. Но приезжие, не привыкнув к светлым ночам, плохо спят. А петербуржцы, устав от тёмной зимы, ждут белых ночей каждый год."
        rubric: ["提纲六项都有，日期准确（6 月 11 日—7 月 2 日）", "至少三处由副动词短语改成的从句或并列谓语", "至少两处由从句或谓语改成的副动词短语，主语一致", "120–150 词"]
        notes: "范文约 135 词。副动词短语改成从句或并列谓语：[Когда солнце опускается за горизонт]{.ru}（课文 [опускаясь]{.ru}）、[Когда писатели приезжали в Петербург]{.ru}（课文 [приезжая]{.ru}）、[люди выходят … и гуляют]{.ru}（课文 [выйдя]{.ru}）。从句或谓语改成副动词短语：[собравшись на берегу]{.ru}（课文 [много людей собирается]{.ru}）、[не привыкнув к светлым ночам]{.ru}、[устав от тёмной зимы]{.ru}（课文 [устают от бессонных ночей]{.ru} 和“漫长黑暗的冬天”两处合并）。"
