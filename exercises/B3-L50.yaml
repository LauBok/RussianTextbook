lesson: B3-L50
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第五单元九课的语体知识：口语与书面语、公文语体、科学语体、新闻语体、政论语体、文学语体、书信、口语的省略与语气词、礼节用语，最后一题是应用文写作。没有达到 80% 的，按出错的题回看：第 1 题回看第 41、42、47、49 课；第 2 题回看第 42、43、45、49 课；第 3 题回看第 46、48 课；第 4 题回看第 42、43、44、47、48、49 课；第 5 题错在哪一句就回看那一句对应的语体课（第 43–47、49 课）；第 6 题回看本课课文；第 7 题回看第 42、47 课，复习后重做。
grammar: "语体对照：口语与书面语；公文语体（申请书 [Прошу]{.ru} + 完成体不定式，[в связи с]{.ru} + 第五格）；科学语体的定义和分类句式（[является]{.ru} + 第五格，[представляет собой]{.ru} + 第四格，[под … понимается]{.ru}，[делится на, состоит из]{.ru}）；新闻语体的被动结构；政论语体介绍观点的说法；文学描写的比喻；私人信件与事务信件的套语；口语的省略与语气词 [же, ведь, разве, неужели, -то]{.ru}；礼节用语 [поздравлять кого с чем, желать кому чего]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 句首写明了场合，选择适合这个场合的说法。
    why: "第 1、2 题是申请书：正文只用 [Прошу]{.ru} + 完成体不定式，[Очень хочу]{.ru} 带个人感情，[Пожалуйста]{.ru} 是口语的请求；说明原因用 [в связи с]{.ru} + 第五格，[потому что я переезжаю]{.ru} 是口语，[ведь]{.ru} 是语气词，公文里不用。第 3 题写给不认识的老师，称呼用 [Уважаемый]{.ru}；[Дорогой]{.ru} 只用于亲近的人，[Привет]{.ru} 只对朋友说。第 4 题句末是问号，又是对老师说话，只能用最委婉的 [Не могли бы вы]{.ru}；[Сообщи]{.ru} 用的是 [ты]{.ru}，和后面的 [вам]{.ru} 也不一致。第 5 题事务信件的结尾是 [С уважением,]{.ru}，[Обнимаю]{.ru}、[Целую]{.ru} 只用于亲人和好朋友。第 6 题对经理致贺词用 [Разрешите поздравить]{.ru}；[Давай]{.ru}、[Ну что]{.ru} 是朋友之间的口语。第 7 题对朋友道谢，对方答 [Не за что]{.ru}，用 [Спасибо]{.ru}；[Я вам очень признателен]{.ru} 用 [вы]{.ru}，是正式说法，[Приношу свои извинения]{.ru} 是道歉。第 8 题是杂志文章，要用中性的 [детского сада]{.ru}；[садик]{.ru} 是口语词。"
    items:
      - stem: "Заявление: ___ предоставить мне отпуск с 1 по 14 июля."
        options: ["Прошу", "Очень хочу", "Пожалуйста,"]
        answer: Прошу
      - stem: "Заявление: Прошу предоставить мне отпуск ___."
        options: ["в связи с переездом", "потому что я переезжаю", "ведь я переезжаю"]
        answer: в связи с переездом
      - stem: "Письмо незнакомому преподавателю: ___ Андрей Петрович!"
        options: ["Уважаемый", "Дорогой", "Привет,"]
        answer: Уважаемый
      - stem: "Письмо преподавателю: ___ сообщить, когда вам удобно встретиться?"
        options: ["Не могли бы вы", "Сообщи, пожалуйста,", "Ну что, можно"]
        answer: Не могли бы вы
      - stem: "Деловое письмо, последняя строка перед подписью: ___"
        options: ["С уважением,", "Обнимаю!", "Целую!"]
        answer: С уважением,
      - stem: "Директору: ___ поздравить вас с юбилеем."
        options: ["Разрешите", "Давай", "Ну что,"]
        answer: Разрешите
      - stem: "Другу: — ___! — Не за что!"
        options: ["Спасибо", "Я вам очень признателен", "Приношу свои извинения"]
        answer: Спасибо
      - stem: "Статья в журнале: Часто именно бабушки и дедушки забирают внуков из ___."
        options: ["детского сада", "садика"]
        answer: детского сада

  - id: e2
    type: fill
    task: 写出括号里的词的正确形式。
    why: "第 1 题 [являться]{.ru} 后面用第五格：[обязательным]{.ru}，写成第一格 [обязательное]{.ru} 是最常见的错误。第 2 题 [представлять собой]{.ru} 后面用第四格：[подготовку]{.ru}。第 3 题 [под]{.ru} X [понимается]{.ru} Y：被定义的 Y 是主语，用第一格 [проверка]{.ru}，不要受前面 [под]{.ru} 的影响写成第五格。第 4 题 [состоять из]{.ru} 要求第二格，[нескольких]{.ru} 后面是复数第二格 [разделов]{.ru}。第 5 题 [по мнению]{.ru} 后面用第二格：[сторонников]{.ru}。第 6 题公文里说明原因用 [в связи с]{.ru} + 第五格：[болезнью]{.ru}。第 7 题 [поздравлять кого с чем]{.ru}：[с юбилеем]{.ru}，第五格。第 8 题 [желать кому чего]{.ru}：[здоровья]{.ru}，第二格，不能写成第四格 [здоровье]{.ru}。"
    items:
      - stem: Дошкольное образование не является ___.
        hint: обязательный
        accept: [обязательным]
      - stem: Профессиональное образование представляет собой ___ к определённой профессии.
        hint: подготовка
        accept: [подготовку]
      - stem: Под государственным экзаменом понимается обязательная ___ знаний.
        hint: проверка
        accept: [проверка]
      - stem: Резюме обычно состоит из нескольких ___.
        hint: раздел
        accept: [разделов]
      - stem: По мнению ___ этой точки зрения, деревне нужно помогать.
        hint: сторонники
        accept: [сторонников]
      - stem: Прошу перенести собеседование на 5 мая в связи с ___.
        hint: болезнь
        accept: [болезнью]
      - stem: Разрешите от имени всего отдела поздравить вас с ___.
        hint: юбилей
        accept: [юбилеем]
      - stem: Желаем вам крепкого ___ и успехов!
        hint: здоровье
        accept: [здоровья]

  - id: e3
    type: choice
    task: 选择正确的语气词或比喻的说法。
    why: "第 1 题说的是对方自己明明知道的事，带责备，用 [же]{.ru}；[разве]{.ru}、[неужели]{.ru} 用在问句里，这句是感叹句。第 2 题后半句“我还以为她在那儿待到五月”说明说话人怀疑，倾向于认为不是这样，用 [разве]{.ru}；[неужели]{.ru} 是听到新消息后的惊讶，这里没有人说过列娜回来了。第 3 题听到好消息，几乎不敢相信，又接着说 [Вот здорово!]{.ru}，用 [Неужели]{.ru}。第 4 题句末是句号，提醒对方本来知道的事，放在句首的只能是 [Ведь]{.ru}；[же]{.ru} 不能放在句首，[Разве]{.ru} 会把句子变成问句。第 5 题 [наконец-то]{.ru}：语气词 [-то]{.ru} 加强前面的词，和 [кто-то]{.ru} 里的 [-то]{.ru} 不是一回事。第 6 题表示猜测的是 [что ли]{.ru}。第 7 题比喻两部分的格一致：[щёки]{.ru} 是第一格，[яблоки]{.ru} 也用第一格。第 8 题 [словно]{.ru}“仿佛”引出比喻；[чтобы]{.ru} 表示目的，[потому что]{.ru} 表示原因，意思都不通。"
    items:
      - stem: Опять огород? Ты ___ на прошлой неделе там пропадал!
        options: [же, разве, неужели]
        answer: же
      - stem: "— Давай позвоним Лене. — А она ___ не в Питере? Я думал, она там до мая."
        options: [разве, неужели, наконец]
        answer: разве
      - stem: "— Лена уже вернулась. — ___? Вот здорово!"
        options: [Неужели, Разве, Ведь]
        answer: Неужели
      - stem: ___ ты в прошлый раз на час опоздал.
        options: [Ведь, Же, Разве]
        answer: Ведь
      - stem: "Лена едет с нами? Наконец-___!"
        options: [то, ли, же]
        answer: то
      - stem: Это она мне, что ___?
        options: [ли, то, же]
        answer: ли
      - stem: Щёки у детей горели, как ___.
        options: [яблоки, яблок, яблоками]
        answer: яблоки
      - stem: Снежинки кружатся в свете фонаря, ___ маленькие белые бабочки.
        options: [словно, чтобы, потому что]
        answer: словно

  - id: e4
    type: rewrite
    task: 按要求改写：第 1、2 题改成申请书正文；第 3 题改成写给老师的事务信件里的请求，用 [Не могли бы вы…]{.ru}；第 4 题改成新闻里的被动结构，用短尾被动形动词；第 5 题补全口语里省去的成分；第 6、7 题改成对经理说的正式用语；第 8 题用 [являться]{.ru} 下定义。
    example:
      cue: Я хочу работать у вас переводчиком с первого сентября.
      answer: Прошу принять меня на работу на должность переводчика с 1 сентября.
    why: "第 1 题申请书用 [Прошу]{.ru} + 完成体不定式 [предоставить]{.ru}，[потому что я переезжаю]{.ru} 改成 [в связи с переездом]{.ru}，去掉 [пожалуйста]{.ru}。第 2 题调动工作用完成体 [перевести]{.ru}，[в отдел]{.ru} 是第四格。第 3 题 [ты]{.ru} 改成 [вы]{.ru}：[скажи → сообщить]{.ru}，[тебе → вам]{.ru}，句末用问号。第 4 题把动作的发出者去掉，主语换成 [строительство]{.ru}，短尾被动形动词与它一致用中性 [завершено]{.ru}。第 5 题补出省去的 [нужно]{.ru}（[надо]{.ru}）和运动动词。第 6 题正式的道歉是 [Прошу прощения за опоздание]{.ru} 或 [Приношу свои извинения]{.ru}。第 7 题正式的祝贺用 [Разрешите (Позвольте) поздравить вас с…]{.ru}，[поздравлять]{.ru} 支配第四格 [вас]{.ru} + [с]{.ru} + 第五格。第 8 题 [являться]{.ru} 后面用第五格：[проверкой]{.ru}。"
    items:
      - cue: Дайте мне, пожалуйста, отпуск с 1 по 14 июля, потому что я переезжаю.
        accept: ["Прошу предоставить мне отпуск с 1 по 14 июля в связи с переездом.", "Прошу предоставить мне отпуск в связи с переездом с 1 по 14 июля.", "В связи с переездом прошу предоставить мне отпуск с 1 по 14 июля."]
      - cue: Переведите меня, пожалуйста, в отдел рекламы.
        accept: ["Прошу перевести меня в отдел рекламы."]
      - cue: Скажи, когда тебе удобно встретиться.
        accept: ["Не могли бы вы сообщить, когда вам удобно встретиться?", "Не могли бы вы сказать, когда вам удобно встретиться?"]
      - cue: Строители завершили строительство новой линии метро.
        accept: ["Строительство новой линии метро завершено.", "Строительство новой линии метро было завершено.", "Завершено строительство новой линии метро."]
      - cue: Мне всё равно в магазин.
        accept: ["Мне всё равно нужно идти в магазин.", "Мне всё равно надо идти в магазин.", "Мне всё равно нужно пойти в магазин.", "Мне всё равно надо пойти в магазин.", "Мне всё равно нужно сходить в магазин.", "Мне всё равно надо сходить в магазин."]
      - cue: Извини, я опоздал!
        accept: ["Прошу прощения за опоздание.", "Приношу свои извинения за опоздание.", "Приношу свои извинения.", "Прошу прощения, я опоздал.", "Извините за опоздание."]
      - cue: С днём рождения!
        accept: ["Разрешите поздравить вас с днём рождения!", "Позвольте поздравить вас с днём рождения!", "Поздравляю вас с днём рождения!", "Примите мои поздравления с днём рождения!"]
      - cue: Экзамен — это проверка знаний.
        accept: ["Экзамен является проверкой знаний."]

  - id: e5
    type: translate
    task: 译成俄语，注意每句所属的语体。
    why: "第 1 题是科学语体的定义：[является]{.ru} + 第五格 [обязательным]{.ru}。第 2 题说明分类用 [делится на]{.ru} + 第四格。第 3 题是新闻背景，用被动结构 [было открыто]{.ru}（[метро]{.ru} 是中性），或者 [открылось]{.ru}。第 4 题是政论语体：[по мнению]{.ru} + 第二格 [сторонников]{.ru}，[точки зрения]{.ru} 第二格；“应该帮助”是无人称句 [деревне нужно помогать]{.ru}，[помогать]{.ru} 支配第三格。第 5 题是事务信件里的请求，用 [Не могли бы вы…]{.ru}，从句里 [вам удобно]{.ru} 是无人称句。第 6 题正式贺词：[Разрешите / Позвольте]{.ru} + [поздравить вас с днём рождения]{.ru}，“代表全部门”是 [от имени всего отдела]{.ru}。第 7 题文学描写里的比喻：[как, словно, будто]{.ru} 都可以，比喻用逗号隔开，[сторожа]{.ru} 与 [ели]{.ru} 同为第一格复数。"
    items:
      - zh: 学前教育不是义务教育。
        accept: ["Дошкольное образование не является обязательным.", "Дошкольное образование не обязательно.", "Дошкольное образование не является обязательным образованием."]
        rubric: ["[являться]{.ru} 后面用第五格 [обязательным]{.ru}", "科学语体：不用口语词"]
      - zh: 职业教育分为中等职业教育和高等教育。
        accept: ["Профессиональное образование делится на среднее профессиональное и высшее.", "Профессиональное образование делится на среднее профессиональное образование и высшее образование.", "Профессиональное образование делится на среднее профессиональное и высшее образование."]
        rubric: ["[делится на]{.ru} + 第四格", "形容词 [среднее профессиональное, высшее]{.ru} 与 [образование]{.ru} 一致用中性"]
      - zh: 莫斯科地铁于 1935 年开通。
        accept: ["Московское метро было открыто в 1935 году.", "Московское метро открылось в 1935 году.", "Метро в Москве было открыто в 1935 году.", "Метро в Москве открылось в 1935 году.", "В 1935 году было открыто московское метро.", "В 1935 году открылось московское метро.", "Московское метро открыто в 1935 году."]
        rubric: ["被动结构 [было открыто]{.ru} 或 [открылось]{.ru}，与中性的 [метро]{.ru} 一致", "[в 1935 году]{.ru}：[в]{.ru} + 第六格"]
      - zh: 在持这种观点的人看来，应该帮助农村。
        accept: ["По мнению сторонников этой точки зрения, деревне нужно помогать.", "По мнению сторонников этой точки зрения, деревне надо помогать.", "По мнению сторонников этой точки зрения, деревне следует помогать.", "По мнению сторонников этой точки зрения, нужно помогать деревне.", "По мнению сторонников этой точки зрения, надо помогать деревне."]
        rubric: ["[по мнению сторонников этой точки зрения]{.ru}：第二格", "无人称句 [нужно (надо, следует) помогать]{.ru}，[деревне]{.ru} 第三格"]
      - zh: （给老师的信）您能否告诉我，您什么时候方便见面？
        accept: ["Не могли бы вы сообщить, когда вам удобно встретиться?", "Не могли бы вы сказать, когда вам удобно встретиться?", "Не могли бы вы сообщить мне, когда вам удобно встретиться?", "Не могли бы вы сказать мне, когда вам удобно встретиться?"]
        rubric: ["委婉的请求 [Не могли бы вы…]{.ru}", "对老师用 [вы]{.ru}：[вам удобно]{.ru}"]
      - zh: 请允许我代表全部门祝贺您生日快乐。
        accept: ["Разрешите от имени всего отдела поздравить вас с днём рождения.", "Позвольте от имени всего отдела поздравить вас с днём рождения.", "Разрешите поздравить вас с днём рождения от имени всего отдела.", "Позвольте поздравить вас с днём рождения от имени всего отдела.", "От имени всего отдела разрешите поздравить вас с днём рождения.", "От имени всего отдела позвольте поздравить вас с днём рождения."]
        rubric: ["正式的贺词 [Разрешите / Позвольте поздравить]{.ru}", "[поздравить вас с днём рождения]{.ru}：第四格 + [с]{.ru} + 第五格", "[от имени всего отдела]{.ru}"]
      - zh: 云杉像年老的守夜人一样沉默着。
        accept: ["Ели молчали, как старые сторожа.", "Ели молчали, словно старые сторожа.", "Ели молчали, будто старые сторожа.", "Ели молчали, как будто старые сторожа."]
        rubric: ["比喻词 [как, словно, будто]{.ru}，前面加逗号", "[сторожа]{.ru}：复数第一格，与 [ели]{.ru} 同格", "描写静止的画面用未完成体过去时 [молчали]{.ru}"]

  - id: e6
    type: choice
    task: 根据复习课文选择正确答案。
    why: 答案都在课文里：玛丽亚是“彩虹”公司的旅游业务经理；伊琳娜·别洛娃请她为新客户准备行程计划；玛丽亚因为搬家申请休假；她在女儿的杂志里读到一篇关于教育的文章和一篇关于农村的文章，新闻是在地铁里用手机看的；她约好八点在地铁站接列娜；最后一段说，善于运用语言的人掌握的不是一种语体，而是好几种。
    items:
      - stem: Мария Иванова работает ___.
        options: ["менеджером по туризму", "директором компании", "учительницей в школе"]
        answer: менеджером по туризму
      - stem: Ирина Белова просит Марию ___.
        options: ["подготовить план поездки для клиентов", "поздравить директора", "написать заявление"]
        answer: подготовить план поездки для клиентов
      - stem: Мария просит предоставить ей отпуск ___.
        options: ["в связи с переездом", "в связи с юбилеем директора", "в связи с болезнью"]
        answer: в связи с переездом
      - stem: В журнале дочери Мария прочитала ___.
        options: ["статью об образовании и статью о деревне", "новость о новой станции метро", "письмо от Ирины Беловой"]
        answer: статью об образовании и статью о деревне
      - stem: Мария заберёт подругу ___.
        options: ["в восемь у метро", "в три часа у директора", "в пятницу в офисе"]
        answer: в восемь у метро
      - stem: Главная мысль текста — ___.
        options: ["человек, хорошо владеющий языком, владеет несколькими стилями", "научный стиль лучше разговорного", "деловое письмо нужно писать быстро"]
        answer: человек, хорошо владеющий языком, владеет несколькими стилями

  - id: e7
    type: open
    task: 应用文：写一封事务电子邮件。
    items:
      - prompt: "你叫李敏（[Ли Мин]{.ru}，女），在莫斯科一所大学上俄语课，现在在上午班（[утренняя группа]{.ru}）。从 10 月 1 日起你要去“彩虹”公司实习（[стажировка]{.ru}），上午没有时间。给课程负责人 [Ольга Викторовна]{.ru} 写一封电子邮件，请求转到晚班（[вечерняя группа]{.ru}）。要求：有主题（[Тема]{.ru}）、称呼、自我介绍、说明原因、委婉的请求（[Не могли бы вы…]{.ru}）、结尾套语和落款；在信里引出一句申请书正文，用 [Прошу …]{.ru} + 完成体不定式和 [в связи с]{.ru}。全信不用口语词和语气词。"
        length: 80–120
        model: "Тема: Перевод в вечернюю группу\n\nУважаемая Ольга Викторовна!\n\nМеня зовут Ли Мин, я студентка второго курса и занимаюсь в Вашей утренней группе русского языка. С 1 октября я начинаю стажировку в компании «Радуга» и буду работать там с девяти до двух часов. Поэтому посещать утренние занятия я больше не смогу.\n\nНе могли бы Вы перевести меня в вечернюю группу? Если нужно заявление, я напишу его сегодня же. Его текст может быть таким: «Прошу перевести меня в вечернюю группу с 1 октября в связи с началом стажировки».\n\nЗаранее благодарю за ответ.\n\nС уважением,\\\nЛи Мин\\\nтел. +7 900 765-43-21"
        rubric: ["有主题、称呼 [Уважаемая Ольга Викторовна!]{.ru}、自我介绍、原因、请求、结尾套语和落款", "请求用 [Не могли бы вы…?]{.ru}，对老师始终用 [вы]{.ru}", "申请书正文用 [Прошу]{.ru} + 完成体不定式 [перевести]{.ru} 和 [в связи с]{.ru} + 第五格", "[С уважением,]{.ru} 后加逗号，下一行写全名", "不用口语词、语气词和省略句"]
        notes: "范文约 90 词，按事务信件的固定顺序写，称呼、各段、落款分行，[Вы]{.ru}、[Ваш]{.ru} 大写表示尊敬：主题用名词短语 [Перевод в вечернюю группу]{.ru}，一眼就知道信的内容；称呼用名字加父称；第一段先自我介绍，再用事实说明原因（实习的日期和时间），不写“我很难过”一类的感情；第二段是请求，[Не могли бы вы…]{.ru} 比命令式客气得多，接着主动提出写申请书，并把申请书正文引出来，正文用公文套语 [Прошу перевести меня … в связи с началом стажировки]{.ru}；最后是 [Заранее благодарю за ответ]{.ru}、[С уважением,]{.ru}、全名和电话。注意 [в связи с]{.ru} 后面用动名词第五格 [началом]{.ru}，不写 [потому что я начинаю]{.ru}。"
