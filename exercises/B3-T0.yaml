lesson: B3-T0
heading: 入册复习测试
intro: 满分 100 分，建议用时 80 分钟。考查范围：第二册全册。翻译和写作按书末评分细则给分。答对 80% 以上可直接学习本册。
exercises:
- id: e1
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：[много]{.ru} 后面能数的名词用复数第二格，[музей]{.ru} 以 [-й]{.ru} 结尾，复数第二格是 [музеев]{.ru}（第二册第 1、3 课）。第 2 题：数词最后一个词是 [три]{.ru}，名词用单数第二格 [ученика]{.ru}；[двадцать]{.ru} 不影响后面名词的形式（第二册第 4 课）。第 3 题：“九点半”说成 [в половине десятого]{.ru}，[в]{.ru} 后面 [половина]{.ru} 用第六格，后面是下一个钟点的序数词第二格（第二册第 6 课）。第 4 题：比较级后面的比较对象用第二格，[первый]{.ru} 按形容词变格，阳性第二格是 [первого]{.ru}；用第一格要加 [чем]{.ru}：[интереснее, чем первый]{.ru}（第二册第 23 课）。第 5 题：劝别人不要做某事，否定命令式用未完成体 [Не открывай]{.ru}；[Не открой]{.ru} 不能这样用，[откроешь, открываешь]{.ru} 是陈述式（第二册第 30 课）。第 6 题：“电影在上映”是运动动词的转义，固定用定向动词 [идёт]{.ru}，不能换成 [ходит, едет, ведёт]{.ru}（第二册第 44 课）。第 7 题：[подарить]{.ru} 送给谁用第三格，[который]{.ru} 和 [девушка]{.ru} 同性同数，格由从句决定：[которой]{.ru}（第二册第 46 课）。第 8 题：主句表示愿望、从句的主语和主句不同，用 [чтобы]{.ru} + 过去时形式 [стал]{.ru}；[чтобы]{.ru} 后面不用将来时或不定式（第二册第 47 课）。第 9 题：不真实的条件，两个分句都用 [бы]{.ru} + 过去时形式；来看一次是具体的、完成的动作，用完成体 [пришёл]{.ru}；[приходил]{.ru} 指经常来（第二册第 50 课）。第 10 题：[о]{.ru} + 第六格，数词 [два]{.ru} 变格后名词跟着用复数同格：[о двух книгах]{.ru}；[двух книг]{.ru} 是第二格（第二册第 55 课）。第 11 题：用多长时间做完一件事用 [за]{.ru} + 第四格：[за одну ночь]{.ru}；[на]{.ru} 表示打算持续的时间，[через]{.ru} 表示“过了多久以后”（第二册第 57 课）。第 12 题：确实有一个人打过电话，只是不知道是谁，用 [кто-то]{.ru}；[кто-нибудь]{.ru} 用在疑问、命令、条件里，不说已经发生的具体的事；[кое-кто]{.ru} 是说话人知道是谁、但不说出来，和“没有说名字”矛盾（第二册第 59 课）。第 13 题：“没有事可做”是 [нечего]{.ru} + 不定式，主体用第三格 [Мише]{.ru}；[ничего]{.ru} 要和否定的谓语连用：[ничего не делал]{.ru}（第二册第 60 课）。第 14 题：大雨是不好的原因，用 [из-за]{.ru} + 第二格；[благодаря]{.ru} 用于好的原因，要求第三格；[от]{.ru} 多说人的身体、情绪的原因（[от радости]{.ru}）（第二册第 67 课）。
  items:
  - stem: В нашем городе много ___.
    options:
    - музея
    - музеи
    - музеев
    - музей
    answer: музеев
  - stem: У Миши в классе двадцать три ___.
    options:
    - учеников
    - ученика
    - ученики
    - ученик
    answer: ученика
  - stem: — Когда начинается лекция? — В ___ десятого.
    options:
    - половине
    - половина
    - половину
    - половины
    answer: половине
  - stem: Второй роман интереснее ___.
    options:
    - первый
    - первому
    - первым
    - первого
    answer: первого
  - stem: Не ___ окно, в комнате и так холодно.
    options:
    - откроешь
    - открывай
    - открой
    - открываешь
    answer: открывай
  - stem: В кинотеатре «Октябрь» сейчас ___ новый фильм.
    options:
    - ходит
    - едет
    - идёт
    - ведёт
    answer: идёт
  - stem: Вот девушка, ___ Дима подарил цветы.
    options:
    - которая
    - которую
    - которого
    - которой
    answer: которой
  - stem: Родители хотят, чтобы Миша ___ врачом.
    options:
    - стал
    - станет
    - стать
    - будет
    answer: стал
  - stem: Если бы я знал, что ты болен, я бы ___ к тебе.
    options:
    - приду
    - приходил
    - пришёл
    - прийти
    answer: пришёл
  - stem: На уроке мы говорили о двух ___ Чехова.
    options:
    - книги
    - книгах
    - книг
    - книгами
    answer: книгах
  - stem: Анна прочитала этот роман ___ одну ночь.
    options:
    - на
    - через
    - за
    - по
    answer: за
  - stem: ___ звонил тебе, пока тебя не было, но не сказал своё имя.
    options:
    - Кто-то
    - Кто-нибудь
    - Никто
    - Кое-кто
    answer: Кто-то
  - stem: В субботу Мише было ___ делать, и он весь день скучал.
    options:
    - ничего
    - что-то
    - что-нибудь
    - нечего
    answer: нечего
  - stem: ___ сильного дождя мы не поехали за город.
    options:
    - Благодаря
    - Из-за
    - От
    - Для
    answer: Из-за
- id: e2
  type: fill
  task: 用括号里词的正确形式填空。
  points: 1
  why: 第 1 题：[друг]{.ru} 的复数是不规则的 [друзья]{.ru}，[своим]{.ru} 说明是复数第三格：[друзьям]{.ru}（第二册第 11、16 课）。第 2 题：[двенадцать]{.ru} 后面用复数第二格，[-ка]{.ru} 结尾的阴性名词是零词尾，并插入隐现元音：[студенток]{.ru}（第二册第 2、4 课）。第 3 题：说“几号”用序数词中性第二格，合成序数词只有最后一个词用序数词：[двадцать третьего]{.ru}（第二册第 56 课）。第 4 题：[длинный]{.ru} 的比较级是规则的 [длиннее]{.ru}，后面有 [чем]{.ru}（第二册第 23 课）。第 5 题：作谓语用短尾，和阳性的 [ты]{.ru}（[Дима]{.ru}）一致：[свободен]{.ru}，词干里插入隐现元音 [е]{.ru}（第二册第 25 课）。第 6 题：[-овать]{.ru} 动词现在时 [-ова-]{.ru} 变成 [-у-]{.ru}：[путешествуем]{.ru}（第二册第 32 课）。第 7 题：[с]{.ru} + 第五格，[три]{.ru} 的第五格是 [тремя]{.ru}，名词用复数第五格（第二册第 55 课）。第 8 题：“给自己买”用 [себя]{.ru} 的第三格 [себе]{.ru}；主语是 [Миша]{.ru}，不能用 [ему]{.ru}（第二册第 20 课）。第 9 题：被动结构用短尾被动形动词，和阳性的 [дом]{.ru} 一致：[построен]{.ru}，短尾只写一个 [н]{.ru}（第二册第 62 课）。第 10 题：[давайте]{.ru} + 完成体复数第一人称表示“咱们来……”：[познакомимся]{.ru}；不能用不定式 [познакомиться]{.ru}（第二册第 65 课）。
  items:
  - stem: Ван Лэй часто пишет своим ___.
    hint: друг
    accept:
    - друзьям
  - stem: В нашей группе двенадцать ___.
    hint: студентка
    accept:
    - студенток
  - stem: Анна родилась ___ мая.
    hint: двадцать третий
    accept:
    - двадцать третьего
  - stem: Летом дни ___, чем зимой.
    hint: длинный
    accept:
    - длиннее
  - stem: Дима, ты ___ сегодня вечером?
    hint: свободный
    accept:
    - свободен
  - stem: Теперь каждое лето мы ___ по России.
    hint: путешествовать
    accept:
    - путешествуем
  - stem: Мы ходили в театр с ___ друзьями.
    hint: три
    accept:
    - тремя
  - stem: Миша купил ___ новую ручку.
    hint: себя
    accept:
    - себе
  - stem: Этот дом был ___ в 1950 году.
    hint: построить
    accept:
    - построен
  - stem: Давайте ___! Меня зовут Анна.
    hint: познакомиться
    accept:
    - познакомимся
- id: e3
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 2
  why: 第 1 空：[который]{.ru} 和 [дом]{.ru} 同性同数，[жить в]{.ru} + 第六格：[в котором]{.ru}；[в который]{.ru} 是第四格，用在 [приезжать в]{.ru} 一类表示方向的动词后面（第二册第 46 课）。第 2 空：[у многих]{.ru} 后面用复数第二格，[семья]{.ru} 的复数第二格是 [семей]{.ru}（第二册第 1、14 课）。第 3 空：走完一段距离用前缀 [про-]{.ru}：[пройти километр]{.ru}；[прийти]{.ru} 是到达，[выйти]{.ru} 是出去，[перейти]{.ru} 是越过，都不能带“一公里”这样的距离（第二册第 39–42 课）。第 4 空：[чистый]{.ru} 的比较级是不规则的 [чище]{.ru}，[чистее]{.ru} 是常见错误；[намного]{.ru} 和 [чем]{.ru} 说明要用比较级（第二册第 23 课）。第 5 空：[скучно]{.ru} 是无人称句的谓语副词，感到无聊的人用第三格 [детям]{.ru}（第二册第 61 课）。第 6 空：目的从句 [чтобы]{.ru} 的主语（[дети]{.ru}）和主句不同时，用过去时形式 [отдыхали]{.ru}，不用将来时、现在时或不定式（第二册第 48 课）。第 7 空：固定说法 [чувствовать себя]{.ru}，[себя]{.ru} 用第四格（第二册第 20 课）。第 8 空：被动结构 [написано]{.ru}；主语是数量词组 [много рассказов, пьес и песен]{.ru}，短尾用中性单数（第二册第 17、62 课）。
  items:
  - options:
    - в которой
    - в котором
    - в который
    - в которых
    answer: в котором
  - options:
    - семьи
    - семьям
    - семьях
    - семей
    answer: семей
  - options:
    - пройти
    - прийти
    - выйти
    - перейти
    answer: пройти
  - options:
    - чистый
    - чисто
    - чище
    - чистее
    answer: чище
  - options:
    - Детям
    - Дети
    - Детей
    - Детьми
    answer: Детям
  - options:
    - будут отдыхать
    - отдыхают
    - отдыхать
    - отдыхали
    answer: отдыхали
  - options:
    - себе
    - себя
    - собой
    - сам
    answer: себя
  - options:
    - написана
    - написаны
    - написано
    - написан
    answer: написано
  passage: |
    ::: {.prose lang="ru"}
    **Русская дача**

    Дача — это небольшой дом за городом, (1) []{.blank} семья живёт летом. Дачи есть у многих (2) []{.blank} в России. Обычно дача находится недалеко от города: туда едут на машине или на электричке, а от станции нужно ещё (3) []{.blank} пешком километр или два.

    Почему люди так любят свои дачи? На даче тихо, а воздух намного (4) []{.blank}, чем в городе. Многие любят работать в саду: там растут овощи, фрукты и цветы. Летом на даче всегда есть работа, но (5) []{.blank} там редко бывает скучно: они купаются в реке, ходят в лес за грибами, играют с друзьями. Бабушки и дедушки часто берут внуков на дачу, чтобы дети (6) []{.blank} всё лето на свежем воздухе.

    В пятницу вечером на дорогах из Москвы очень много машин: москвичи едут на дачу. Там они чувствуют (7) []{.blank} свободнее, чем дома: можно весь день ходить в старой одежде, а вечером сидеть в саду и пить чай с вареньем.

    Дача — это не только место, где отдыхают, но и часть русской культуры. О жизни на даче (8) []{.blank} много рассказов, пьес и песен.
    :::
  passage_zh: |
    **俄罗斯的达恰**

    达恰是城外的一座小房子，一家人夏天住在那里。俄罗斯很多家庭都有达恰。达恰一般离城不远：坐汽车或者电气火车去，下了车还要从车站步行一两公里。

    人们为什么这么喜欢自己的达恰？达恰里很安静，空气比城里干净得多。很多人喜欢在园子里干活：那里种着蔬菜、水果和花。夏天达恰里总有活要干，可孩子们在那里很少觉得无聊：他们在河里游泳，去树林里采蘑菇，和朋友们一起玩。爷爷奶奶常常带孙子孙女去达恰，好让孩子们整个夏天都在新鲜空气里休息。

    星期五晚上，从莫斯科出城的路上车特别多：莫斯科人都去达恰。在那里他们觉得比在家里自在：可以一整天穿着旧衣服走来走去，晚上坐在园子里喝茶、吃果酱。

    达恰不只是休息的地方，也是俄罗斯文化的一部分。写达恰生活的小说、剧本和歌曲有很多。
- id: e4a
  type: choice
  task: 阅读理解（一）：阅读下面的记叙文，根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose lang="ru"}
    **В поезде**

    В прошлом году в июле я ехала на поезде из Москвы в Петербург. Поезд уходил без четверти двенадцать ночи, и я думала, что сразу пойду спать. Но в купе уже сидела пожилая женщина. Она улыбнулась мне и сказала: «Садитесь, пожалуйста. Хотите чаю?»

    Мы пили чай и разговаривали. Женщину звали Вера Петровна. Оказалось, что она сорок лет работала учительницей литературы в маленьком городе под Петербургом. Когда она узнала, что я учусь на филологическом факультете, она обрадовалась и стала спрашивать, какие книги я люблю. Я сказала, что больше всего люблю Чехова. «А я — Пушкина, — ответила она. — Но Чехова я тоже очень люблю».

    Мы не спали почти до трёх часов ночи. Вера Петровна рассказала, что едет к сыну, который уже двадцать лет живёт в Петербурге. Сын хочет, чтобы мама жила с ним, но она не хочет уезжать из своего города: «Там мои ученики, мой сад, моя школа. Как я их оставлю?»

    Утром, когда мы приехали в Петербург, на вокзале нас ждал высокий мужчина с цветами. Вера Петровна улыбнулась и сказала мне: «Вот мой Серёжа». Перед тем как уйти, она дала мне свой адрес. «Если будешь в наших местах, приезжай в гости», — сказала она.

    Прошёл год. Мы до сих пор пишем друг другу письма — настоящие, на бумаге. А в августе я поеду к ней в гости.
    :::
  why: 第 1 题：第一段说 [Поезд уходил без четверти двенадцать ночи]{.ru}，是十一点三刻；[до трёх часов ночи]{.ru} 是她们聊到的时间。第 2 题：[она сорок лет работала учительницей литературы]{.ru}；上语文系的是讲故事的“我”，在彼得堡住了二十年的是她的儿子。第 3 题：[«А я — Пушкина»]{.ru}，喜欢契诃夫的是“我”。第 4 题：她自己说 [Там мои ученики, мой сад, моя школа. Как я их оставлю?]{.ru}，舍不得学生、园子和学校。第 5 题：[Мы до сих пор пишем друг другу письма]{.ru}；[Серёжа]{.ru} 是她的儿子，她住在自己的小城里，“我”八月才去看她，还没有去过。
  items:
  - stem: Поезд уходил из Москвы ___.
    options:
    - в двенадцать часов ночи
    - в три часа ночи
    - без четверти двенадцать ночи
    - рано утром
    answer: без четверти двенадцать ночи
  - stem: Вера Петровна ___.
    options:
    - много лет работала учительницей
    - учится на филологическом факультете
    - двадцать лет живёт в Петербурге
    - работает в библиотеке
    answer: много лет работала учительницей
  - stem: Больше всего Вера Петровна любит ___.
    options:
    - Чехова
    - Толстого
    - Гоголя
    - Пушкина
    answer: Пушкина
  - stem: Вера Петровна не хочет жить у сына, потому что ___.
    options:
    - сын живёт далеко от центра
    - ей не хочется оставлять учеников, сад и школу
    - в Петербурге всё очень дорого
    - она не любит большие города
    answer: ей не хочется оставлять учеников, сад и школу
  - stem: Из текста можно узнать, что ___.
    options:
    - девушка и Вера Петровна пишут друг другу письма
    - Серёжа — муж Веры Петровны
    - девушка уже ездила к Вере Петровне в гости
    - Вера Петровна живёт в Петербурге у сына
    answer: девушка и Вера Петровна пишут друг другу письма
  passage_zh: |
    **在火车上**

    去年七月，我坐火车从莫斯科去彼得堡。火车夜里十一点三刻开，我以为上车就去睡觉。可是包厢里已经坐着一位上了年纪的妇女。她冲我笑了笑，说：“请坐。想喝茶吗？”

    我们一边喝茶一边聊天。这位妇女叫薇拉·彼得罗夫娜。原来她在彼得堡附近的一座小城里当了四十年的语文老师。她听说我在语文系上学，很高兴，就问我喜欢哪些书。我说最喜欢契诃夫。“我呢，最喜欢普希金，”她回答，“不过契诃夫我也很喜欢。”

    我们差不多到夜里三点都没睡。薇拉·彼得罗夫娜说，她是去看儿子，儿子在彼得堡已经住了二十年。儿子希望妈妈和他一起住，可是她不想离开自己的小城：“那里有我的学生，我的园子，我的学校。我怎么能丢下它们呢？”

    早上火车到了彼得堡，车站上有一个高个子男人捧着花在等我们。薇拉·彼得罗夫娜笑着对我说：“这就是我的谢廖沙。”临走前，她把自己的地址给了我。“要是到我们那儿去，就来做客吧。”她说。

    一年过去了。我们到现在还在通信——真正的、写在纸上的信。八月里我就要去她那儿做客了。
- id: e4b
  type: choice
  task: 阅读理解（二）：阅读下面的通知，根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose lang="ru"}
    **Объявление**

    Дорогие студенты!

    Иностранные студенты университета могут поехать на экскурсию во Владимир и Суздаль. Экскурсия будет в субботу, двадцать пятого мая.

    Автобус отходит от главного здания университета в семь часов утра. Пожалуйста, не опаздывайте: ждать никого не будем! Дорога до Владимира займёт около трёх часов. Во Владимире мы посмотрим старые соборы и Золотые ворота, а после обеда поедем в Суздаль. Там вы увидите музей, где стоят старые деревянные дома и церкви. В Москву вернёмся в десять часов вечера.

    Экскурсия стоит тысячу пятьсот рублей. В эту цену входят автобус, билеты в музеи и обед. Ужин в цену не входит.

    Возьмите с собой паспорт, тёплую одежду и зонт: в мае погода часто меняется.

    Если вы хотите поехать, приходите до двадцатого мая в комнату 215 или позвоните по телефону. В автобусе сорок пять мест.
    :::
  why: 第 1 题：[в субботу, двадцать пятого мая]{.ru}；[до двадцатого мая]{.ru} 是报名的截止日期。第 2 题：[Автобус отходит от главного здания университета в семь часов утра]{.ru}；晚上十点是回到莫斯科的时间。第 3 题：[Ужин в цену не входит]{.ru}，汽车、门票和午饭都包括在内。第 4 题：[Возьмите с собой паспорт, тёплую одежду и зонт]{.ru}。第 5 题：车上只有四十五个座位，所以最多去四十五个人；报名要在五月二十日以前，下午才去苏兹达尔，当天晚上就回莫斯科。
  items:
  - stem: Экскурсия будет ___.
    options:
    - двадцатого мая
    - двадцать пятого мая
    - пятнадцатого мая
    - седьмого мая
    answer: двадцать пятого мая
  - stem: Автобус отходит ___.
    options:
    - в десять часов вечера от главного здания
    - в семь часов утра от станции метро
    - в семь часов утра от главного здания
    - в три часа дня от главного здания
    answer: в семь часов утра от главного здания
  - stem: В цену экскурсии не входит ___.
    options:
    - ужин
    - обед
    - автобус
    - билет в музей
    answer: ужин
  - stem: Студентам советуют взять с собой ___.
    options:
    - обед и воду
    - деньги на билеты
    - словарь и тетрадь
    - зонт и тёплую одежду
    answer: зонт и тёплую одежду
  - stem: Из объявления можно узнать, что ___.
    options:
    - в комнату 215 нужно прийти двадцать пятого мая
    - на экскурсию поедут не больше сорока пяти человек
    - в Суздаль студенты поедут утром
    - экскурсия будет два дня
    answer: на экскурсию поедут не больше сорока пяти человек
  passage_zh: |
    **通知**

    亲爱的同学们：

    本校外国留学生可以去弗拉基米尔和苏兹达尔参观游览。时间是五月二十五日，星期六。

    汽车早上七点从学校主楼出发。请不要迟到：我们不等任何人！到弗拉基米尔大约要三个小时。在弗拉基米尔我们参观古老的大教堂和金门，午饭后去苏兹达尔。在那里大家会看到一座博物馆，里面有古老的木房子和木教堂。晚上十点回到莫斯科。

    游览费用一千五百卢布，包括汽车、博物馆门票和午饭。晚饭不包括在内。

    请带上护照、暖和的衣服和雨伞：五月里天气常常变化。

    想去的同学请在五月二十日以前到 215 房间来，或者打电话。车上有四十五个座位。
- id: e5
  type: rewrite
  task: 按括号里的要求改写句子。
  points: 1
  why: 第 1 题：说过去不真实的条件，两个分句都用 [бы]{.ru} + 过去时形式，否定变成肯定：[знал… позвонил бы]{.ru}（第二册第 50 课）。第 2 题：转述命令、请求用 [чтобы]{.ru} + 过去时形式，[помоги]{.ru} 变成 [помог]{.ru}，[ты]{.ru} 的命令变成 [он]{.ru}（第二册第 47、64 课）。第 3 题：一般疑问句转述时用 [ли]{.ru}，放在被问的动词后面，人称换成第三人称：[пойдёт ли он]{.ru}；时间不变，原话是将来时，转述也用将来时（第二册第 64 课）。第 4 题：[который]{.ru} 和 [книга]{.ru} 同性同数，在从句里是 [написал]{.ru} 的宾语，用第四格 [которую]{.ru}（第二册第 46 课）。第 5 题：不定人称句改成被动结构，宾语 [театр]{.ru} 变成主语，谓语用短尾被动形动词 [был открыт]{.ru}，和阳性主语一致（第二册第 62 课）。第 6 题：[после того как]{.ru} 引出先发生的动作，也可以拆开写成 [после того, как]{.ru}（第二册第 49 课）。第 7 题：[хотя]{.ru} 引出让步从句，主句里不再用 [но]{.ru}（第二册第 52 课）。第 8 题：两个动作是同一个主语，[чтобы]{.ru} 后面用不定式 [читать]{.ru}（第二册第 48 课）。第 9 题：[пусть]{.ru} + 第三人称表示让第三者做某事，完成体用将来时形式 [напишет]{.ru}（第二册第 65 课）。第 10 题：“进”和“出”是一对前缀：[вошёл в]{.ru} → [вышел из]{.ru}，前置词也要从 [в]{.ru} 换成 [из]{.ru}，名词用第二格（第二册第 40 课）。
  example:
    cue: 'Анна сказала: «Я живу на улице Пушкина».（改为间接引语）'
    answer: Анна сказала, что она живёт на улице Пушкина.
  items:
  - cue: Я не знал, что ты в Москве, поэтому не позвонил тебе.（用 [если бы]{.ru} 改写）
    accept:
    - Если бы я знал, что ты в Москве, я бы позвонил тебе.
    - Если бы я знал, что ты в Москве, я бы тебе позвонил.
    - Если бы я знал, что ты в Москве, я позвонил бы тебе.
    - Если бы я знал, что ты в Москве, то я бы позвонил тебе.
    - Я бы позвонил тебе, если бы знал, что ты в Москве.
    - Я позвонил бы тебе, если бы знал, что ты в Москве.
  - cue: 'Мама сказала Мише: «Помоги папе».（改为间接引语）'
    accept:
    - Мама сказала Мише, чтобы он помог папе.
  - cue: 'Анна спросила Диму: «Ты пойдёшь на концерт?»（改为间接引语）'
    accept:
    - Анна спросила Диму, пойдёт ли он на концерт.
  - cue: Я читаю книгу. Её написал Чехов.（用 [который]{.ru} 合成一句）
    accept:
    - Я читаю книгу, которую написал Чехов.
  - cue: Этот театр открыли в 1898 году.（改为被动结构）
    accept:
    - Этот театр был открыт в 1898 году.
  - cue: Дима сдал экзамены. Потом он поехал домой.（用 [после того как]{.ru} 合成一句）
    accept:
    - После того как Дима сдал экзамены, он поехал домой.
    - Дима поехал домой после того, как сдал экзамены.
    - После того как Дима сдал экзамены, он уехал домой.
  - cue: Шёл дождь, но мы пошли гулять.（用 [хотя]{.ru} 改写）
    accept:
    - Хотя шёл дождь, мы пошли гулять.
    - Мы пошли гулять, хотя шёл дождь.
  - cue: Я учу русский язык. Я хочу читать Толстого по-русски.（用 [чтобы]{.ru} 合成一句）
    accept:
    - Я учу русский язык, чтобы читать Толстого по-русски.
  - cue: Скажи Мише, чтобы он написал мне.（用 [пусть]{.ru} 改写）
    accept:
    - Пусть Миша напишет мне.
    - Пусть Миша мне напишет.
  - cue: Ван Лэй вошёл в аудиторию.（改成相反方向的动作）
    accept:
    - Ван Лэй вышел из аудитории.
