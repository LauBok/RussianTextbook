- id: e7
  type: open
  task: 写作。
  points: 20
  items:
  - prompt: 以“我的暑假”为题写一篇短文，100–120 词。内容包括：暑假在哪里过、和谁在一起；做了些什么，哪件事最难忘；对新学年有什么打算。至少用一个 [который]{.ru} 从句和一个 [чтобы]{.ru} 从句，注意动词的体和运动动词的用法。
    length: 100–120
    model: |
      **Мои летние каникулы**

      Этим летом я два месяца жил дома, в Пекине. В июле мы с родителями ездили на море, а в августе я помогал отцу на работе.

      Больше всего мне понравилась одна поездка. Мы с другом взяли велосипеды и поехали в горы, которые находятся недалеко от города. Дорога была трудной, но, когда мы поднялись наверх, мы увидели весь город. Домой мы вернулись поздно вечером, очень уставшие, но счастливые.

      Каждый день я читал по-русски, чтобы не забыть язык. Я прочитал два рассказа Чехова и посмотрел несколько русских фильмов.

      В этом году в университете я хочу больше говорить по-русски и лучше узнать Россию. Я надеюсь, что этот год будет интересным.
    rubric:
    - 内容 6 分：三个方面（在哪里、和谁过暑假；做了什么、最难忘的事；新学年的打算）各 2 分，写到了但只有一句、没有展开的给 1 分
    - 语法 8 分：[который]{.ru} 从句、[чтобы]{.ru} 从句各 1 分，动词体用对 1 分，运动动词用对 1 分；其余 4 分看全文语法错误，名词、形容词变格，动词变位，数词与名词连用，支配关系，每两处错误扣 1 分
    - 词汇 3 分：用词准确、有变化，能用上第二册学过的词给 3 分；用词单调或有三处以上用词不当的，酌情扣 1–2 分
    - 结构 3 分：分段清楚、每段一个意思（2 分），句子之间衔接通顺（1 分）
    - 字数少于 80 词的，内容分最多给 3 分
    notes: 范文约 115 词，分四段：第一段交代在哪里、和谁过暑假，第二段写最难忘的一件事，第三段写学习，第四段写新学年的打算。语法上：[горы, которые находятся недалеко от города]{.ru} 是 [который]{.ru} 从句（第二册第 46 课）；[читал по-русски, чтобы не забыть язык]{.ru} 是目的从句，主语相同用不定式（第二册第 48 课）；[ездили на море]{.ru} 用不定向动词说去了又回来，[поехали в горы]{.ru} 说出发，[вернулись]{.ru} 说回来（第二册第 37、39 课）；[прочитал два рассказа]{.ru} 说结果用完成体，[каждый день читал]{.ru} 说经常的动作用未完成体（第二册第 28 课）；[два месяца]{.ru}、[два рассказа]{.ru} 复习了数词与名词连用（第二册第 4 课）。
