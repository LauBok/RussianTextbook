lesson: L19
grammar: "物主代词第六格：[моём / мое́й, твоём / твое́й, на́шем / на́шей, ва́шем / ва́шей, чьём / чьей]{.ru}，[его́, её, их]{.ru} 不变；指示代词 [э́тот]{.ru}、[тот]{.ru} 的第一格和第六格。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里物主代词的第六格。
    why: 阳性、中性名词（[дом]{.ru}、[райо́н]{.ru}、[общежи́тие]{.ru}）前用 [-ём]{.ru} / [-ем]{.ru}，阴性名词（[ко́мната]{.ru}、[кварти́ра]{.ru}、[аудито́рия]{.ru}）前用 [-е́й]{.ru} / [-ей]{.ru}。第 4 题 [его́]{.ru} 不变，也不加 [н]{.ru}。第 3 题 [общежи́тие]{.ru} 是中性，和阳性一样。
    items:
      - stem: Стол в ___ ко́мнате.
        hint: мой
        accept: ["мое́й"]
      - stem: Мы живём в ___ до́ме.
        hint: наш
        accept: ["на́шем"]
      - stem: В ___ общежи́тии ко́мнаты ма́ленькие?
        hint: ваш
        accept: ["ва́шем"]
      - stem: Ко́шка в ___ ко́мнате.
        hint: его́
        accept: ["его́"]
      - stem: Ты живёшь в ___ кварти́ре?
        hint: твой
        accept: ["твое́й"]
      - stem: Мы говори́м о ___ райо́не.
        hint: твой
        accept: ["твоём"]
      - stem: В ___ ко́мнате Му́рка?
        hint: чей
        accept: ["чьей"]

  - id: e2
    type: choice
    task: 选择 [э́тот]{.ru} 或 [тот]{.ru} 的正确形式。
    why: 指示代词和名词在性、数、格上一致：[дом]{.ru} 阳性，[кни́га]{.ru} 阴性，[окно́]{.ru} 中性，[ко́мнаты]{.ru} 复数。第 4、5 题名词是第六格，要用 [э́том]{.ru} / [э́той]{.ru}、[том]{.ru} / [той]{.ru}。第 6 题“这扇窗户很大”是指示代词，不是“这是……”。
    items:
      - stem: ___ дом большо́й.
        options: [Э́тот, Э́та, Э́то, Э́ти]
        answer: Э́тот
      - stem: ___ кни́га интере́сная.
        options: [Э́тот, Э́та, Э́то, Э́ти]
        answer: Э́та
      - stem: ___ ко́мнаты ма́ленькие.
        options: [Э́тот, Э́та, Э́то, Э́ти]
        answer: Э́ти
      - stem: В ___ ко́мнате живёт Ми́ша.
        options: [э́том, э́той, э́та]
        answer: э́той
      - stem: В ___ до́ме живу́т Петро́вы.
        options: [том, той, тот]
        answer: том
      - stem: ___ окно́ большо́е.
        options: [Э́тот, Э́та, Э́то]
        answer: Э́то

  - id: e3
    type: rewrite
    task: 按例句用 [э́тот … , а тот …]{.ru} 对比。
    placeholder: … э́т…, а … т… — …
    example:
      cue: ко́мната / Ми́ша / А́нна
      answer: В э́той ко́мнате живёт Ми́ша, а в той — А́нна.
    why: "[ко́мната]{.ru}、[кварти́ра]{.ru} 阴性，用 [в э́той … , а в той]{.ru}；[дом]{.ru} 阳性、[общежи́тие]{.ru} 中性，用 [в э́том … , а в том]{.ru}。后半句可以用破折号代替重复的部分。主语是复数时动词用 [живу́т]{.ru}。"
    items:
      - cue: дом / Петро́вы / ба́бушка
        accept: ["В э́том до́ме живу́т Петро́вы, а в том — ба́бушка.", "В э́том до́ме живу́т Петро́вы, а в том живёт ба́бушка."]
      - cue: общежи́тие / Пьер / Ю́ми
        accept: ["В э́том общежи́тии живёт Пьер, а в том — Ю́ми.", "В э́том общежи́тии живёт Пьер, а в том живёт Ю́ми."]
      - cue: кварти́ра / мы / сосе́ди
        accept: ["В э́той кварти́ре живём мы, а в той — сосе́ди.", "В э́той кварти́ре живём мы, а в той живу́т сосе́ди."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：米沙和安娜各住一间，王磊的房间里有桌子、床和大柜子；皮埃尔和同屋卡尔住在宿舍；伊万·谢尔盖耶维奇以前住在合住公寓，厨房共用，他家住一个小房间。
    items:
      - stem: "Ван Лэй: «В мое́й ко́мнате ___»."
        options: ["стол, крова́ть и шкаф", "то́лько стол"]
        answer: "стол, крова́ть и шкаф"
      - stem: Пьер живёт в общежи́тии. Его́ сосе́д — ___.
        options: [Карл, Ми́ша, Ван Лэй]
        answer: Карл
      - stem: Ра́ньше Ива́н Серге́евич жил ___.
        options: [в общежи́тии, в коммуна́лке, на да́че]
        answer: в коммуна́лке
      - stem: Ку́хня в коммуна́лке была́ ___.
        options: [о́бщая, ма́ленькая]
        answer: о́бщая
      - stem: Его́ семья́ жила́ ___.
        options: [в большо́й ко́мнате, в ма́ленькой ко́мнате]
        answer: в ма́ленькой ко́мнате

  - id: e5
    type: translate
    task: 译成俄语。
    why: 物主代词、指示代词、形容词都要和后面的名词在性、数、格上一致。
    items:
      - zh: 米沙住在这个房间里。
        accept: ["В э́той ко́мнате живёт Ми́ша.", "Ми́ша живёт в э́той ко́мнате."]
        rubric: ["[в э́той ко́мнате]{.ru}：阴性第六格"]
      - zh: 我们宿舍的房间很小。
        accept: ["В на́шем общежи́тии ко́мнаты ма́ленькие.", "Ко́мнаты в на́шем общежи́тии ма́ленькие."]
        rubric: ["[в на́шем общежи́тии]{.ru}：中性第六格", "[ма́ленькие]{.ru}：复数"]
      - zh: 我的房间里有桌子和床。
        accept: ["В мое́й ко́мнате стол и крова́ть."]
        rubric: ["[в мое́й ко́мнате]{.ru}", 现在时可以不用动词]
      - zh: 这栋楼新，那栋楼旧。
        accept: ["Э́тот дом но́вый, а тот ста́рый.", "Э́тот дом но́вый, а тот — ста́рый."]
        rubric: ["[э́тот]{.ru} / [тот]{.ru} 和 [дом]{.ru} 一致", "对比用 [а]{.ru}"]
      - zh: 穆尔卡在他的房间里。
        accept: ["Му́рка в его́ ко́мнате.", "Ко́шка в его́ ко́мнате."]
        rubric: ["[в его́ ко́мнате]{.ru}：[его́]{.ru} 不变，不加 [н]{.ru}"]
