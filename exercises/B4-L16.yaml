lesson: B4-L16
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第二单元的格律、韵式、诗歌形象、散文节奏和散文诗；第 2—8 题以莱蒙托夫的《山崖》和普希金的《我爱过您……》为测试选文，两首诗都没有在前几课出现过。格律划分题按行计分，一行的音步、重音和虚重全对才算对。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看解析里注明的那一课；第 2、3、4 题回看第 9、11、12 课的格律分析和第 10 课的韵式；第 5 题回看测试选文和注释；第 6 题回看第 9—11 课的朗读训练；第 7 题回看第 9、10 课的文体与修辞；第 8 题回看第 12 课的概要写作，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 选择正确答案。
    why: "第 1 题（第 9 课）：抑扬格的音步是“轻—重”，格律重音在偶数音节上；“重—轻”是扬抑格。第 2 题（第 12 课）：[Белая берёза]{.ru} 的多音节词重音在第 1、5 个音节，都是奇数音节，所以是扬抑格；行末重音在第 5 个音节，即第 3 个格律重音位置，是三音步。第 3 题（第 9 课）：格律重音位置上实际不重读叫虚重；单音节词落在轻位置上却重读，叫格外重音，两者正好相反。第 4 题（第 10 课）：[одинокой — далёкой]{.ru} 的最后一个重音落在倒数第二个音节上，是阴性韵；看读音不看写法，[-о́кой]{.ru} 和 [-ёкой]{.ru} 读音相同。第 5 题（第 10 课）：第 1 行与第 4 行押韵、中间两行押韵，是抱韵 AbbA；交叉韵是 AbAb，随韵是 AAbb。第 6 题（第 13 课）：重音诗的节奏只靠重音，两个重音之间的轻音节可多可少，每行的音节数和重音数都不固定；音节数大致固定、按抑扬格或扬抑格的音步有规律交替的是第 9—12 课的音节—重音诗。第 7 题（第 15 课）：散文诗不分行、不押韵、没有格律，但短小、集中、抒情；说它“押韵”“有格律”都不对。第 8 题（第 15 课）：在文中反复出现、把全篇分成几段的句子叫叠句，《玫瑰》里米亚特列夫的诗句出现了六次；环形结构只是结尾回到开头。"
    items:
      - stem: "Ямб — это стопа, в которой ___."
        options: ["первый слог безударный, второй ударный", "первый слог ударный, второй безударный", "три слога"]
        answer: "первый слог безударный, второй ударный"
      - stem: "«Белая берёза / Под моим окном» написано ___."
        options: [трёхстопным хореем, четырёхстопным ямбом, тоническим стихом]
        answer: трёхстопным хореем
      - stem: "Если в стопе на месте ударения стоит безударный слог, это ___."
        options: [пиррихий, хорей, мужская рифма]
        answer: пиррихий
      - stem: "Рифма «одинокой — далёкой» — ___."
        options: [женская, мужская]
        answer: женская
      - stem: "Если рифмуются первая и четвёртая строки, вторая и третья, рифмовка ___."
        options: [опоясывающая, перекрёстная, парная]
        answer: опоясывающая
      - stem: "В тоническом стихе ритм создают ___."
        options: [только ударения, одинаковое число слогов в строке, стопы ямба и хорея]
        answer: только ударения
      - stem: "Стихотворение в прозе ___."
        options: ["короткое и лирическое, но без рифмы и метра", "всегда написано ямбом", "всегда имеет рифму"]
        answer: "короткое и лирическое, но без рифмы и метра"
      - stem: "Строка, которая несколько раз повторяется в тексте и делит его на части, называется ___."
        options: [рефрен, кольцевая композиция, афоризм]
        answer: рефрен

  - id: e2
    type: open
    task: 格律识别。划分《山崖》全诗的音步：用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，写出虚重在第几音步；最后写出格律名称和韵式。
    items:
      - prompt: "[Ночева́ла ту́чка золота́я / На груди́ утёса-велика́на, / У́тром в путь она́ умча́лась ра́но, / По лазу́ри ве́село игра́я. // Но оста́лся вла́жный след в морщи́не / Ста́рого утёса. Одино́ко / Он стои́т, заду́мался глубо́ко, / И тихо́нько пла́чет он в пусты́не.]{.ru}"
        length: 10–14
        model: |-
          1: ∪ ∪ / — ∪ / — ∪ / ∪ ∪ / — ∪ (пиррихий в первой и четвёртой стопе)

          2: ∪ ∪ / — ∪ / — ∪ / ∪ ∪ / — ∪ (пиррихий в первой и четвёртой стопе)

          3: — ∪ / — ∪ / — ∪ / — ∪ / — ∪ (пиррихия нет)

          4: ∪ ∪ / — ∪ / — ∪ / ∪ ∪ / — ∪ (пиррихий в первой и четвёртой стопе)

          5: ∪ ∪ / — ∪ / — ∪ / — ∪ / — ∪ (пиррихий в первой стопе)

          6: — ∪ / ∪ ∪ / — ∪ / ∪ ∪ / — ∪ (пиррихий во второй и четвёртой стопе)

          7: — ∪ / — ∪ / — ∪ / ∪ ∪ / — ∪ (пиррихий в четвёртой стопе)

          8: ∪ ∪ / — ∪ / — ∪ / — ∪ / — ∪ (пиррихий в первой стопе)

          Хорей, в каждой строке пять стоп. Рифмовка опоясывающая: AbbA (здесь все рифмы женские, поэтому ABBA, CDDC).
        rubric: ["判断为扬抑格：多音节词重音都在奇数音节", "数出五个音步，每行 10 个音节，行末是阴性结尾", "八行的虚重位置全对（见范文）", "韵式为抱韵 ABBA / CDDC，全是阴性韵"]
        notes: "音节划分（带重音符的是重读音节）：1 [но-че / ва́-ла / ту́ч-ка / зо-ло / та́-я]{.ru .syl}；2 [на-гру / ди́-у / тё-са / ве-ли / ка́-на]{.ru .syl}；3 [у́-тром / впуть-о / на́-ум / ча́-лась / ра́-но]{.ru .syl}；4 [по-ла / зу́-ри / ве́-се / ло-и / гра́-я]{.ru .syl}；5 [но-о / ста́л-ся / вла́ж-ный / след-вмор / щи́-не]{.ru .syl}；6 [ста́-ро / го-у / тё-са / о-ди / но́-ко]{.ru .syl}；7 [он-сто / и́т-за / ду́-мал / ся-глу / бо́-ко]{.ru .syl}；8 [и-ти / хо́нь-ко / пла́-чет / он-впу / сты́-не]{.ru .syl}。判断方法：先看多音节词，[ночева́ла]{.ru} 重音在第 3 音节，[ту́чка]{.ru} 在第 5，[золота́я]{.ru} 在第 9，都是奇数，所以是扬抑格；最后一个重音在第 9 音节，是第 5 个格律重音位置，所以是五音步，第 10 音节是阴性结尾。单音节词 [путь]{.ru}（第 3 行第 3 音节）、[след]{.ru}（第 5 行第 7 音节）、[он]{.ru}（第 7 行第 1 音节、第 8 行第 7 音节）都在重音位置上，按重读计。第 7 行的 [глубо́ко]{.ru} 是旧时的诗歌重音，按今天的读法 [глубоко́]{.ru} 就破坏了格律和韵。只有第 3 行五个重音全部落实，写小云早晨轻快地飞走；第 6 行只有三个重音，句号落在行中，读起来最沉重。"

  - id: e3
    type: open
    task: 格律识别。划分《我爱过您……》全诗的音步（方法同上题），写出格律名称和韵式。
    items:
      - prompt: "[Я вас люби́л: любо́вь ещё, быть мо́жет, / В душе́ мое́й уга́сла не совсе́м; / Но пусть она́ вас бо́льше не трево́жит; / Я не хочу́ печа́лить вас ниче́м. / Я вас люби́л безмо́лвно, безнадёжно, / То ро́бостью, то ре́вностью томи́м; / Я вас люби́л так и́скренно, так не́жно, / Как дай вам Бог люби́мой быть други́м.]{.ru}"
        length: 10–14
        model: |-
          1: ∪ — / ∪ — / ∪ — / ∪ — / ∪ — / ∪ (пиррихия нет)

          2: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

          3: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — / ∪ (пиррихий в четвёртой стопе)

          4: ∪ ∪ / ∪ — / ∪ — / ∪ — / ∪ — (пиррихий в первой стопе)

          5: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — / ∪ (пиррихий в четвёртой стопе)

          6: ∪ — / ∪ ∪ / ∪ — / ∪ ∪ / ∪ — (пиррихий во второй и четвёртой стопе)

          7: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — / ∪ (пиррихий в четвёртой стопе)

          8: ∪ — / ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

          Ямб, в каждой строке пять стоп. Рифмовка перекрёстная: AbAb CdCd, женские и мужские рифмы идут через одну.
        rubric: ["判断为抑扬格：多音节词重音都在偶数音节", "五个音步；单数行多一个轻音节（阴性韵），双数行以重音结尾（阳性韵）", "八行的虚重位置全对（见范文）", "韵式为交叉韵 AbAb CdCd"]
        notes: "音节划分：1 [я-вас / лю-би́л / лю-бо́вь / е-щё / быть-мо́ / жет]{.ru .syl}；2 [вду-ше́ / мо-е́й / у-га́ / сла-не / сов-се́м]{.ru .syl}；3 [но-пусть / о-на́ / вас-бо́ль / ше-не / тре-во́ / жит]{.ru .syl}；4 [я-не / хо-чу́ / пе-ча́ / лить-вас / ни-че́м]{.ru .syl}；5 [я-вас / лю-би́л / без-мо́л / вно-без / на-дё / жно]{.ru .syl}；6 [то-ро́ / бо-стью / то-ре́ / вно-стью / то-ми́м]{.ru .syl}；7 [я-вас / лю-би́л / так-и́ / скрен-но / так-не́ / жно]{.ru .syl}；8 [как-дай / вам-Бог / лю-би́ / мой-быть / дру-ги́м]{.ru .syl}。单音节词 [вас]{.ru}（第 1、5、7 行第 2 音节，第 4 行第 8 音节）、[пусть]{.ru}、[дай]{.ru}、[Бог]{.ru}、[быть]{.ru}（第 8 行第 8 音节）在重音位置上，按重读计；第 1 行的 [быть]{.ru} 在第 9 音节（轻位置），[быть мо́жет]{.ru} 连读，不重读。第 4 行的 [я не]{.ru} 都在轻读中带过，第 1 音步虚重。第 6 行 [ро́бостью]{.ru}、[ре́вностью]{.ru} 都是长词，只有一个重音，全行只剩三个重音。容易错的是把 [ещё]{.ru} 的重音放在第一个音节，或者把五音步数成四音步：数到行末最后一个重音是第 10 音节，才是第 5 个格律重音位置。"

  - id: e4
    type: choice
    task: 根据两首测试诗选择正确答案。
    why: "第 1 题：《山崖》每行 10 个音节，多音节词重音都在奇数音节，最后一个重音在第 9 音节，是五音步扬抑格；《白桦》才是三音步扬抑格。第 2 题：[золотая — играя]{.ru} 是第 1、4 行，[великана — рано]{.ru} 是第 2、3 行，是抱韵；八行全是阴性韵，没有阴阳交替。第 3 题：[в морщине / Старого утёса]{.ru} 一句话跨了两行，句号落在第 6 行中间，这叫跨行；它让读者在 [Старого утёса]{.ru} 后面停住，突出山崖的孤独。第 4 题：《我爱过您……》的多音节词重音都在偶数音节，是抑扬格，最后一个重音在第 10 音节，是五音步。第 5 题：[Я вас любил]{.ru} 在第 1、5、7 行的开头出现了三次，是句首重复；全诗没有一个比喻，靠的是这种重复和 [то…, то…]{.ru}、[так…, так…]{.ru} 的对称。第 6 题：最后一行希望“别人”也这样爱她——诗人放弃了自己的爱，却祝福她幸福，这是全诗的情感高峰；它不是请求，也不是责备。"
    items:
      - stem: "«Утёс» написан ___."
        options: ["хореем, в строке пять стоп", трёхстопным хореем, четырёхстопным ямбом]
        answer: "хореем, в строке пять стоп"
      - stem: "Рифмовка в «Утёсе» ___."
        options: ["опоясывающая, все рифмы женские", "перекрёстная, женские и мужские рифмы идут через одну", "парная, все рифмы мужские"]
        answer: "опоясывающая, все рифмы женские"
      - stem: "Предложение «Но остался влажный след в морщине / Старого утёса» ___."
        options: [начинается в одной строке и кончается в другой, занимает одну строку, повторяет первую строку]
        answer: начинается в одной строке и кончается в другой
      - stem: "«Я вас любил…» написано ___."
        options: ["ямбом, в строке пять стоп", "хореем, в строке пять стоп", тоническим стихом]
        answer: "ямбом, в строке пять стоп"
      - stem: "Главный приём в «Я вас любил…» — ___."
        options: ["повтор слов «Я вас любил» в начале строк", "много ярких сравнений", "повтор одного и того же согласного звука"]
        answer: "повтор слов «Я вас любил» в начале строк"
      - stem: "В последней строке «Как дай вам Бог любимой быть другим» лирический герой ___."
        options: [желает любимой счастья с другим человеком, просит её вернуться, сердится на неё]
        answer: желает любимой счастья с другим человеком

  - id: e5
    type: open
    task: 测试选文理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[«Утёс»: Что случилось с тучкой и с утёсом? Кого можно увидеть в этих образах? Как вы понимаете «влажный след»? «Я вас любил…»: Что чувствует лирический герой сейчас? Почему он говорит о любви в прошедшем времени? Чего он желает своей любимой?]{.ru}"
        length: 100–140
        model: "Золотая тучка провела ночь на груди большого старого утёса, а утром весело улетела по лазури. После неё в морщине утёса остался влажный след, и утёс, одинокий, стоит в пустыне и тихо плачет. В тучке и утёсе можно увидеть людей: молодую весёлую девушку, которая легко уходит, и старого одинокого человека, который её не может забыть. «Влажный след» — это и капли воды, и слёзы. Во втором стихотворении лирический герой говорит, что любовь, может быть, ещё не совсем угасла в его душе. Он говорит «любил» в прошедшем времени, потому что не хочет тревожить и печалить любимую женщину: она его не любит. Он любил её молча, без надежды, страдал от робости и ревности. И всё же в конце он желает ей, чтобы другой человек любил её так же искренно и нежно."
        rubric: ["《山崖》：复述小云和山崖的故事；说出拟人——年轻的离去者和孤独的老人", "解释 [влажный след]{.ru} 的双重意思：水迹和眼泪", "《我爱过您》：说出爱还没有完全熄灭，用过去时是为了不打扰她", "说出结尾的祝愿"]
        notes: "两首诗都写离别和孤独，但都不直接说“痛苦”：莱蒙托夫让一块石头“哭”，普希金用过去时和最后的祝福把感情压住。回答时可以用注释里的说法：[тучка]{.ru} 是阴性、[утёс]{.ru} 是阳性，诗里自然成了“她”和“他”。"

  - id: e6
    type: open
    task: 朗读准备。给《我爱过您……》标出停顿（/ 短停，// 长停）和每行最重要的词（逻辑重音，用大写字母写出），并用中文简单说明朗读的语调。
    items:
      - prompt: "[Я вас любил: любовь ещё, быть может, / В душе моей угасла не совсем; / Но пусть она вас больше не тревожит; / Я не хочу печалить вас ничем. / Я вас любил безмолвно, безнадёжно, / То робостью, то ревностью томим; / Я вас любил так искренно, так нежно, / Как дай вам Бог любимой быть другим.]{.ru}"
        length: 8–12
        model: |-
          Я вас ЛЮБИЛ: // любовь ещё, / быть может, /
          В душе моей угасла НЕ СОВСЕМ; //
          Но пусть она вас больше НЕ ТРЕВОЖИТ; /
          Я не хочу ПЕЧАЛИТЬ вас ничем. //
          Я вас любил / БЕЗМОЛВНО, / БЕЗНАДЁЖНО, /
          То РОБОСТЬЮ, / то РЕВНОСТЬЮ томим; //
          Я вас любил / так ИСКРЕННО, / так НЕЖНО, /
          Как дай вам Бог / любимой быть ДРУГИМ. //

          第 1 行冒号后长停，[быть может]{.ru} 两边短停，像在犹豫；第 1—4 行读得平静、克制。第 5—7 行重复的 [Я вас любил]{.ru} 一次比一次温暖，两个 [то…]{.ru}、两个 [так…]{.ru} 语调逐项略升；最后一行放慢，[Как дай вам Бог]{.ru} 后稍停，[другим]{.ru} 读得轻而清楚，语调下降，全诗结束。
        rubric: ["冒号、分号和行末都有停顿，第 4、6 行后（句意完整处）长停", "逻辑重音落在关键词上：[не совсем]{.ru}、[не тревожит]{.ru}、[безмолвно, безнадёжно]{.ru}、[искренно, нежно]{.ru}、[другим]{.ru}", "说明前半克制、后半逐渐加强、末行放慢的语调变化", "不把虚重的音节读重"]
        notes: "范文的停顿依标点和句意来定：全诗是两个大句子，各占四行，第 4 行和第 8 行末尾是句号，停得最长。逻辑重音一般落在新信息上：第 1 行 [любил]{.ru} 是过去时，暗示“现在不再”；最后一行的 [другим]{.ru} 是全诗的落点。逻辑重音不同于格律重音，也不要把每个格律重音都读得一样重。"

  - id: e7
    type: open
    task: 文体分析。用俄语写一段 150—200 词的分析，比较两首测试诗：格律和韵式有什么不同？诗人用什么手段表现孤独和离别？引用诗句作例子，可以和本单元学过的诗比较。
    items:
      - prompt: "[Сравните стихотворения «Утёс» и «Я вас любил…». Какой у них метр и какая рифмовка? Какими средствами поэты говорят о том, как тяжело быть одному и расставаться?]{.ru}"
        length: 150–200
        model: "Оба стихотворения короткие, в каждом восемь строк, и в каждой строке у них пять стоп, но размер разный. «Утёс» Лермонтова написан хореем, рифмовка опоясывающая, и все рифмы женские: «золотая — играя», «великана — рано». Из-за этого каждая строка кончается мягко и тихо. «Я вас любил…» Пушкина написано ямбом с перекрёстной рифмовкой, где женские и мужские рифмы идут через одну, как в стихотворении «Я помню чудное мгновенье». Лермонтов говорит о том, как тяжело быть одному, через образы природы: тучка и утёс похожи на людей, утёс «задумался» и «плачет». Это олицетворение. Важна и форма: предложение «Но остался влажный след в морщине / Старого утёса» переходит в следующую строку, и после слов «Старого утёса» стоит точка — читатель останавливается, как будто видит одинокий утёс. Пушкин не использует ни одного сравнения. Его главный приём — повтор: «Я вас любил» звучит три раза в начале строки, а пары «то робостью, то ревностью», «так искренно, так нежно» делают речь спокойной и ровной. Любовь в прошедшем времени и пожелание счастья с другим показывают, какое это высокое чувство. Лермонтов показывает боль, а Пушкин её скрывает."
        rubric: ["150–200 词", "正确说出两首诗的格律（五音步扬抑格 / 五音步抑扬格）和韵式（抱韵、全阴性韵 / 交叉韵、阴阳交替）", "《山崖》：指出拟人和跨行，引用诗句", "《我爱过您》：指出句首重复和对称结构、没有比喻，引用诗句", "和本单元学过的诗作至少一处比较", "有结论"]
        notes: "范文约 195 词。结构：相同点（八行、五音步）——格律和韵式的不同——莱蒙托夫的手段（拟人、跨行）——普希金的手段（重复、对称、过去时、祝福）——一句对比式的结论。格律名称要写全：几音步 + 哪种格（[пятистопный хорей]{.ru}），韵式要说明阴性韵、阳性韵。"

  - id: e8
    type: open
    task: 概要写作。用俄语散文写出两首诗的内容和主题，150 词左右，不要照抄诗句。
    items:
      - prompt: "[Расскажите своими словами, о чём стихотворения «Утёс» и «Я вас любил…» и какая у них главная мысль.]{.ru}"
        length: 130–170
        model: "В стихотворении «Утёс» Лермонтов рассказывает о маленькой золотой тучке, которая провела ночь у большого старого утёса. Утром она весело улетела и, наверное, сразу забыла об утёсе. А на утёсе остался влажный след, и теперь утёс одиноко стоит в пустыне, думает и тихо плачет. За этой простой картиной природы видна человеческая история: молодое и лёгкое уходит, а старое и сильное остаётся одно со своей болью. Главная мысль стихотворения: тот, кто любит, часто остаётся один. В стихотворении Пушкина лирический герой обращается к женщине, которую он любил. Он говорит, что любовь, может быть, ещё жива в его душе, но не хочет её тревожить и печалить. Он любил молча и без надежды, страдал от робости и ревности. В конце он желает, чтобы другой человек любил её так же искренно и нежно. Главная мысль — настоящая любовь думает не о себе, а о счастье любимого человека."
        rubric: ["130–170 词", "两首诗都写到：情节或情境、人物（形象）、主题", "《山崖》说出拟人背后的人的故事", "《我爱过您》说出结尾的祝福和“无私的爱”这一主题", "用自己的话，不成段照抄诗句"]
        notes: "范文约 160 词，两首诗各占一半。诗的概要要把诗句改写成散文：[Ночевала тучка]{.ru} → [провела ночь]{.ru}，[безмолвно, безнадёжно]{.ru} → [молча и без надежды]{.ru}。每首先写“写了什么”，再用 [Главная мысль…]{.ru} 一句点明主题。"
