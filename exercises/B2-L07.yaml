lesson: B2-L07
grammar: "集合数词 [дво́е, тро́е, че́тверо…]{.ru} + 复数第二格；[нас бы́ло тро́е]{.ru}；[вдвоём, втроём]{.ru}；[о́ба, о́бе]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的词。
    why: "说一群人有几个（第 1 题）、家里有几个孩子（第 3 题）、只有复数的名词（第 6 题 [су́тки]{.ru}），用集合数词。集合数词不和表示女人的名词连用，第 2 题只能说 [три де́вушки]{.ru}。[о́ба]{.ru} 用于阳性（第 5 题，迪马和米沙），[о́бе]{.ru} 用于阴性（第 4 题 [сёстры]{.ru}）。"
    items:
      - stem: Нас бы́ло ___.
        options: ["три", "тро́е"]
        answer: "тро́е"
      - stem: В ко́мнате сиде́ли ___ де́вушки.
        options: ["три", "тро́е"]
        answer: "три"
      - stem: У них ___ дете́й.
        options: ["два", "дво́е"]
        answer: "дво́е"
      - stem: ___ сестры́ у́чатся в шко́ле.
        options: ["О́ба", "О́бе"]
        answer: "О́бе"
      - stem: Ди́ма и Ми́ша ___ лю́бят футбо́л.
        options: ["о́ба", "о́бе"]
        answer: "о́ба"
      - stem: Мы бы́ли на да́че ___ су́ток.
        options: ["два", "дво́е"]
        answer: "дво́е"

  - id: e2
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "集合数词后面用复数第二格：[дете́й, студе́нтов]{.ru}。[о́ба, о́бе]{.ru} 和 [два, две]{.ru} 一样，后面用单数第二格：[бра́та, сестры́]{.ru}，注意 [сестры́]{.ru} 重音在词尾。第 2 题要写集合数词 [ше́стеро]{.ru}。第 6 题“两个人一起”用副词 [вдвоём]{.ru}。"
    items:
      - stem: Нас в семье́ дво́е ___.
        hint: де́ти
        accept: ["дете́й"]
      - stem: За у́жином их бы́ло ___.
        hint: шесть
        accept: ["ше́стеро"]
      - stem: В аудито́рии бы́ло тро́е ___.
        hint: студе́нт
        accept: ["студе́нтов"]
      - stem: О́ба ___ игра́ют в футбо́л.
        hint: брат
        accept: ["бра́та"]
      - stem: О́бе ___ живу́т в Москве́.
        hint: сестра́
        accept: ["сестры́"]
      - stem: А́нна и Ди́ма игра́ли на гита́ре ___.
        hint: два
        accept: ["вдвоём"]

  - id: e3
    type: rewrite
    task: 按例句说一说一共有几个人。
    example:
      cue: За столо́м сиде́ли Ван Лэй и Ди́ма.
      answer: Их бы́ло дво́е.
    why: "说一群人一共有几个：[нас / их]{.ru} + [бы́ло]{.ru} + 集合数词。动词用中性 [бы́ло]{.ru}。说话人自己在里面时用 [нас]{.ru}（第 4、5 题）。"
    items:
      - cue: На уро́ке бы́ли Ван Лэй, Пьер и Ю́ми.
        accept: ["Их бы́ло тро́е."]
      - cue: В па́рке игра́ли Ми́ша, Ди́ма, Ван Лэй и Ко́стя.
        accept: ["Их бы́ло че́тверо."]
      - cue: За у́жином сиде́ли па́па, ма́ма, А́нна, Ми́ша, Ван Лэй и Ди́ма.
        accept: ["Их бы́ло ше́стеро."]
      - cue: До́ма бы́ли я и мой брат.
        accept: ["Нас бы́ло дво́е."]
      - cue: В маши́не бы́ли я, па́па, ма́ма, сестра́ и брат.
        accept: ["Нас бы́ло пя́теро."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“一共几个人”用 [нас]{.ru} + 集合数词。第 2 题“几个孩子”用 [дво́е дете́й]{.ru}。第 3 题“两个都”用 [о́ба]{.ru}，指两个男孩用阳性。第 4 题“两个人一起”用 [вдвоём]{.ru}。第 5 题 [мы с ним]{.ru} 指两个人，年份用 [в … году́]{.ru}。"
    items:
      - zh: 我们一共三个人。
        accept: ["Нас бы́ло тро́е.", "Нас тро́е."]
        rubric: ["[нас]{.ru} + 集合数词 [тро́е]{.ru}", "过去时用中性 [бы́ло]{.ru}"]
      - zh: 他们家有两个孩子。
        accept: ["У них дво́е дете́й.", "У них в семье́ дво́е дете́й.", "В их семье́ дво́е дете́й."]
        rubric: ["[дво́е дете́й]{.ru}：集合数词 + 复数第二格"]
      - zh: 迪马和米沙都踢足球。
        accept: ["Ди́ма и Ми́ша о́ба игра́ют в футбо́л.", "И Ди́ма, и Ми́ша игра́ют в футбо́л."]
        rubric: ["[о́ба]{.ru}（阳性）或 [и …, и …]{.ru}", "[игра́ть в футбо́л]{.ru}"]
      - zh: 安娜和迪马两个人一起弹吉他。
        accept: ["А́нна и Ди́ма игра́ют на гита́ре вдвоём.", "А́нна и Ди́ма вдвоём игра́ют на гита́ре.", "А́нна и Ди́ма игра́ли на гита́ре вдвоём.", "А́нна и Ди́ма вдвоём игра́ли на гита́ре."]
        rubric: ["[вдвоём]{.ru}", "[игра́ть на гита́ре]{.ru}：乐器用 [на]{.ru} + 第六格"]
      - zh: 我和他都是 2006 年出生的。
        accept: ["Мы с ним о́ба роди́лись в две ты́сячи шесто́м году́.", "Мы с ним о́ба родили́сь в две ты́сячи шесто́м году́.", "Мы с ним роди́лись в две ты́сячи шесто́м году́.", "Мы с ним родили́сь в две ты́сячи шесто́м году́.", "Мы о́ба роди́лись в две ты́сячи шесто́м году́.", "Мы о́ба родили́сь в две ты́сячи шесто́м году́."]
        rubric: ["[мы с ним]{.ru}，动词用复数", "[в две ты́сячи шесто́м году́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кто опозда́л на э́тот раз? Что де́лали ребя́та в па́рке? Ско́лько их бы́ло и како́й был счёт? Что Ди́ма рассказа́л о свое́й семье́? Что бы́ло по́сле у́жина?]{.ru}"
        length: 50–80
        model: "На э́тот раз Ди́ма не опозда́л: он был у метро́ без пяти́ два, а Ван Лэй — в пять мину́т тре́тьего. Пото́м Ди́ма, Ми́ша и Ван Лэй игра́ли в футбо́л в па́рке. Их бы́ло тро́е: Ди́ма и Ми́ша про́тив Ван Лэ́я. Счёт был пять — два. За у́жином Ди́ма рассказа́л, что он из Каза́ни и что у них в семье́ дво́е дете́й. По́сле у́жина он и А́нна игра́ли на гита́ре вдвоём."
        rubric: ["回答全部五个问题", "集合数词用对：[их бы́ло тро́е]{.ru}、[дво́е дете́й]{.ru}", "[вдвоём]{.ru}", "钟点 [без пяти́ два, в пять мину́т тре́тьего]{.ru}"]
        notes: "范文约 75 词。第一句用冒号说明“这一次”是怎么回事，钟点沿用上一课的说法。迪马的话用 [рассказа́л, что…]{.ru} 转述，两个从句都用 [что]{.ru} 引出。"
