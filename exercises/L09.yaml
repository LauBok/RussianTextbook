lesson: L09
grammar: "形容词第一格：硬变化、软变化、混合变化，与名词性、数一致；[како́й]{.ru} 用于提问和感叹；[ИК-5]{.ru} 感叹句。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里形容词的正确形式。
    why: 先看名词的性和数，再按变化类型选词尾。第 3 题 [пло́щадь]{.ru} 以 [-ь]{.ru} 结尾，是阴性。第 4 题 [си́ний]{.ru} 是软变化，中性是 [си́нее]{.ru}，不是 [си́ное]{.ru}。第 5 题 [хоро́ший]{.ru} 的 [ш]{.ru} 后不重读的 [о]{.ru} 写成 [е]{.ru}：[хоро́шее]{.ru}。第 6、7 题复数，[к]{.ru}、[ш]{.ru} 后写 [и]{.ru}：[ма́ленькие]{.ru}，[больши́е]{.ru}。第 8 题 [па́па]{.ru} 是阳性。
    items:
      - stem: Э́то ___ ко́мната.
        hint: но́вый
        accept: ["но́вая"]
      - stem: Э́то ___ го́род.
        hint: краси́вый
        accept: ["краси́вый"]
      - stem: Кра́сная пло́щадь ___.
        hint: большо́й
        accept: ["больша́я"]
      - stem: Тут ___ не́бо.
        hint: си́ний
        accept: ["си́нее"]
      - stem: Э́то ___ фо́то.
        hint: хоро́ший
        accept: ["хоро́шее"]
      - stem: Вот ___ кни́ги.
        hint: ма́ленький
        accept: ["ма́ленькие"]
      - stem: Москва́ и Пеки́н — ___ города́.
        hint: большо́й
        accept: ["больши́е"]
      - stem: Мой па́па ___.
        hint: хоро́ший
        accept: ["хоро́ший"]
      - stem: Моя́ ко́мната ___.
        hint: све́тлый
        accept: ["све́тлая"]
      - stem: Э́то ___ фильм.
        hint: интере́сный
        accept: ["интере́сный"]

  - id: e2
    type: choice
    task: 选择 [како́й]{.ru}、[кака́я]{.ru}、[како́е]{.ru} 或 [каки́е]{.ru}。
    why: "[како́й]{.ru} 的变化和形容词 [большо́й]{.ru} 一样，要和句末的名词一致。[река́]{.ru}、[пло́щадь]{.ru} 是阴性；[окно́]{.ru} 是中性；[очки́]{.ru}、[города́]{.ru} 是复数。"
    items:
      - stem: ___ э́то река́?
        options: [Како́й, Кака́я, Како́е, Каки́е]
        answer: Кака́я
      - stem: ___ э́то собо́р?
        options: [Како́й, Кака́я, Како́е, Каки́е]
        answer: Како́й
      - stem: ___ большо́е окно́!
        options: [Како́й, Кака́я, Како́е, Каки́е]
        answer: Како́е
      - stem: ___ э́то очки́?
        options: [Како́й, Кака́я, Како́е, Каки́е]
        answer: Каки́е
      - stem: ___ краси́вая пло́щадь!
        options: [Како́й, Кака́я, Како́е, Каки́е]
        answer: Кака́я
      - stem: ___ ста́рые города́!
        options: [Како́й, Кака́я, Како́е, Каки́е]
        answer: Каки́е

  - id: e3
    type: rewrite
    task: 把陈述句改成感叹句。
    placeholder: Како́й …!
    example:
      cue: Собо́р краси́вый.
      answer: Како́й краси́вый собо́р!
    why: 感叹句用 [како́й]{.ru} 加形容词加名词，[како́й]{.ru} 和形容词都要和名词一致。第 3 题 [не́бо]{.ru} 是中性，[си́ний]{.ru} 软变化，是 [како́е си́нее]{.ru}。第 5 题复数用 [каки́е]{.ru}。朗读时读 [ИК-5]{.ru}。
    items:
      - cue: Пло́щадь больша́я.
        accept: ["Кака́я больша́я пло́щадь!"]
      - cue: Кремль ста́рый.
        accept: ["Како́й ста́рый Кремль!"]
      - cue: Не́бо си́нее.
        accept: ["Како́е си́нее не́бо!"]
      - cue: Фильм интере́сный.
        accept: ["Како́й интере́сный фильм!"]
      - cue: Ко́мнаты све́тлые.
        accept: ["Каки́е све́тлые ко́мнаты!"]
      - cue: Матрёшка ма́ленькая.
        accept: ["Кака́я ма́ленькая матрёшка!"]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 王磊觉得红场很大，大教堂很漂亮，天很蓝；安娜说克里姆林宫很古老。最后王磊说莫斯科是一座又大、又古老、又非常美丽的城市。
    items:
      - stem: Кра́сная пло́щадь ___.
        options: [больша́я, ма́ленькая]
        answer: больша́я
      - stem: Кремль о́чень ___.
        options: [ста́рый, но́вый]
        answer: ста́рый
      - stem: Не́бо ___.
        options: [си́нее, све́тлое]
        answer: си́нее
      - stem: Москва́ — большо́й, ста́рый и о́чень ___ го́род.
        options: [краси́вый, интере́сный]
        answer: краси́вый

  - id: e5
    type: translate
    task: 译成俄语。
    why: 形容词作定语放在名词前，作谓语放在名词后，现在时都不用系动词。“多么……啊”用 [како́й]{.ru}，和名词一致。第 3 题 [река́]{.ru} 是阴性，形容词用阴性 [краси́вая]{.ru}。
    items:
      - zh: ——这是一座什么样的城市？——这是一座古老美丽的城市。
        accept: ["— Како́й э́то го́род? — Э́то ста́рый краси́вый го́род.", "— Како́й э́то го́род? — Э́то ста́рый и краси́вый го́род.", "— Како́й э́то го́род? — Э́то краси́вый ста́рый го́род.", "— Како́й э́то го́род? — Ста́рый и краси́вый.", "— Како́й э́то го́род? — Ста́рый краси́вый го́род.", "— Како́й э́то го́род? — Э́то краси́вый и ста́рый го́род.", "— Како́й э́то го́род? — Краси́вый и ста́рый."]
        rubric: ["“什么样的”用 [како́й]{.ru}，与 [го́род]{.ru} 一致", "形容词用阳性 [ста́рый]{.ru}、[краси́вый]{.ru}"]
      - zh: 多么大的广场啊！
        accept: ["Кака́я больша́я пло́щадь!"]
        rubric: ["[пло́щадь]{.ru} 是阴性，用 [кака́я больша́я]{.ru}"]
      - zh: 这是一条美丽的河。
        accept: ["Э́то краси́вая река́.", "Вот краси́вая река́."]
        rubric: ["[река́]{.ru} 是阴性，形容词用 [краси́вая]{.ru}"]
      - zh: 我的房间又新又明亮。
        accept: ["Моя́ ко́мната но́вая и све́тлая.", "Моя́ ко́мната све́тлая и но́вая."]
        rubric: ["[ко́мната]{.ru} 是阴性：[моя́]{.ru}、[но́вая]{.ru}、[све́тлая]{.ru}", "两个形容词用 [и]{.ru} 连接"]
