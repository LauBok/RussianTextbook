lesson: L64
grammar: "[рабо́тать]{.ru}、[быть]{.ru}、[стать]{.ru} + 第五格表示职业和身份；现在时不用系动词时用第一格；[стать]{.ru} 的变位；职业名词的阴阳性。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的名词变成第五格。
    why: 职业名词在 [рабо́тать]{.ru}、[стать]{.ru}、[был]{.ru} 后面用第五格。第 2 题 [врач]{.ru} 的词尾重读，写 [врачо́м]{.ru}；第 4 题 [учи́тель]{.ru} 以 [-ь]{.ru} 结尾，变 [-ем]{.ru}；第 6 题 [перево́дчица]{.ru} 在 [ц]{.ru} 后不重读，写 [-ей]{.ru}，不写 [-ой]{.ru}。
    items:
      - stem: Па́па рабо́тает ___.
        hint: инжене́р
        accept: [инжене́ром]
      - stem: Ма́ма рабо́тает ___.
        hint: врач
        accept: [врачо́м]
      - stem: Ми́ша хо́чет стать ___.
        hint: программи́ст
        accept: [программи́стом]
      - stem: Мой оте́ц рабо́тает ___ в шко́ле.
        hint: учи́тель
        accept: [учи́телем]
      - stem: В де́тстве она́ хоте́ла стать ___.
        hint: арти́стка
        accept: [арти́сткой]
      - stem: А́нна хо́чет стать ___.
        hint: перево́дчица
        accept: [перево́дчицей]

  - id: e2
    type: choice
    task: 选择第一格或第五格。
    why: 现在时没有系动词，用第一格（第 1、4 题）；有 [был]{.ru}、[бу́ду]{.ru}、[быть]{.ru} 时用第五格（第 2、3、5 题）。第 2 题容易受汉语“他以前是学生”影响写成 [студе́нт]{.ru}。
    items:
      - stem: Ива́н Серге́евич — ___.
        options: [инжене́р, инжене́ром]
        answer: инжене́р
      - stem: Два́дцать лет наза́д он был ___.
        options: [студе́нт, студе́нтом]
        answer: студе́нтом
      - stem: Я бу́ду ___.
        options: [перево́дчик, перево́дчиком]
        answer: перево́дчиком
      - stem: Мари́я Никола́евна — ___.
        options: [врач, врачо́м]
        answer: врач
      - stem: Я хочу́ быть ___.
        options: [врач, врачо́м]
        answer: врачо́м

  - id: e3
    type: rewrite
    task: 按例句改写，用 [стать]{.ru} 的过去时。
    placeholder: Че́рез год … стал / ста́ла …
    example:
      cue: Ра́ньше он был студе́нтом. (инжене́р)
      answer: Че́рез год он стал инжене́ром.
    why: "[стать]{.ru} 的过去时按主语的性变：[стал, ста́ла, ста́ли]{.ru}。第 2 题主语是女性，用 [ста́ла]{.ru}；[врач]{.ru} 没有阴性形式，但动词仍用阴性。"
    items:
      - cue: Ра́ньше он был студе́нтом. (учи́тель)
        accept: [Че́рез год он стал учи́телем.]
      - cue: Ра́ньше она́ была́ студе́нткой. (врач)
        accept: [Че́рез год она́ ста́ла врачо́м.]
      - cue: Ра́ньше Ми́ша был шко́льником. (программи́ст)
        accept: [Че́рез год Ми́ша стал программи́стом., Че́рез год он стал программи́стом.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题问职业用 [кем]{.ru}。第 3 题“小时候”可以译成 [в де́тстве]{.ru}。第 4 题现在时用第一格，过去时用第五格，一句里两种格都有。
    items:
      - zh: ——您做什么工作？——我在工厂当工程师。
        accept: ["— Кем вы рабо́таете? — Я рабо́таю инжене́ром на заво́де.", "— Кем вы рабо́таете? — Инжене́ром на заво́де.", "— Кем вы рабо́таете? — Я рабо́таю на заво́де инжене́ром.", "— Кем вы рабо́таете? — Я инжене́р, рабо́таю на заво́де.", "— Кем вы рабо́таете? — Я инжене́р, я рабо́таю на заво́де."]
        rubric: ["疑问词 [кем]{.ru}", "[рабо́тать инжене́ром]{.ru}，第五格", "[на заво́де]{.ru}"]
      - zh: 你想成为什么人？——当翻译。
        accept: ["— Кем ты хо́чешь стать? — Перево́дчиком.", "— Кем ты хо́чешь стать? — Я хочу́ стать перево́дчиком.", "— Кем ты хо́чешь быть? — Перево́дчиком.", "— Кем ты хо́чешь быть? — Я хочу́ быть перево́дчиком."]
        rubric: ["[стать]{.ru} 或 [быть]{.ru} + 第五格", "答句 [перево́дчиком]{.ru} 也用第五格"]
      - zh: 妈妈小时候想当演员，可是当了医生。
        accept: ["В де́тстве ма́ма хоте́ла стать арти́сткой, но ста́ла врачо́м.", "Ма́ма в де́тстве хоте́ла стать арти́сткой, но ста́ла врачо́м.", "В де́тстве ма́ма хоте́ла быть арти́сткой, но ста́ла врачо́м.", "Ма́ма в де́тстве хоте́ла быть арти́сткой, но ста́ла врачо́м.", "В де́тстве ма́ма хоте́ла стать арти́сткой, а ста́ла врачо́м."]
        rubric: ["[арти́сткой]{.ru}、[врачо́м]{.ru} 用第五格", "[ста́ла]{.ru} 用阴性"]
      - zh: 二十年前他是大学生，现在是工程师。
        accept: ["Два́дцать лет наза́д он был студе́нтом, а тепе́рь он инжене́р.", "Два́дцать лет наза́д он был студе́нтом, а сейча́с он инжене́р.", "Два́дцать лет наза́д он был студе́нтом, а тепе́рь инжене́р.", "Два́дцать лет наза́д он был студе́нтом, а сейча́с инжене́р."]
        rubric: ["[был студе́нтом]{.ru} 第五格", "现在时 [он инжене́р]{.ru} 第一格", "[два́дцать лет наза́д]{.ru}"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 介绍你家人的职业：他们做什么工作、在哪儿工作、以前做过什么；最后写你自己想成为什么人。60–90 词。
        length: 60–90
        model: |
          В мое́й семье́ четы́ре челове́ка. Мой па́па рабо́тает инжене́ром на заво́де. Он рабо́тает там уже́ два́дцать лет. Его́ оте́ц, мой де́душка, то́же был инжене́ром. Моя́ ма́ма — врач. Она́ рабо́тает в поликли́нике. В де́тстве она́ хоте́ла стать арти́сткой, но ста́ла врачо́м. Мой ста́рший брат — студе́нт, он хо́чет стать программи́стом. А я интересу́юсь литерату́рой и хочу́ стать перево́дчиком.
        rubric: ["每个人的职业：[рабо́тать]{.ru} + 第五格", "至少一处 [был]{.ru} 或 [стать]{.ru} + 第五格", "现在时 [Ма́ма — врач]{.ru} 用第一格", "结尾写自己的愿望"]
        notes: 范文按家庭成员逐个介绍，每人两三句：现在做什么、在哪儿、过去怎样。注意现在时用破折号代替系动词时名词用第一格（[Ма́ма — врач]{.ru}），其余用第五格。
