lesson: B3-L55
grammar: "只有复数的名词：[ножницы, очки, брюки, ворота, сани, деньги, дрова, сутки, каникулы]{.ru} 等；复数第二格（[денег, суток, ножниц, саней]{.ru}）；计数用集合数词 [двое, трое, четверо]{.ru}、[пара]{.ru} 或 [одни]{.ru}（[двое суток]{.ru}，[одни часы]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что случилось у дровяного склада? Что Хрюкин требовал? Как Очумелов менял своё мнение о собаке? Что делал Очумелов со своей шинелью и почему? Чья это была собака?]{.ru}"
        length: 70–100
        model: "У дровяного склада купца Пичугина белый щенок укусил золотых дел мастера Хрюкина за палец. Хрюкин требовал, чтобы ему заплатили деньги, потому что палец несколько суток не будет работать. Когда Очумелов думал, что собака бродячая, он хотел её истребить, а хозяина наказать; когда слышал, что собака генеральская, он начинал говорить, что виноват сам Хрюкин. Он то снимал шинель, то просил надеть её снова: ему становилось то жарко, то холодно. В конце повар Прохор сказал, что собака принадлежит брату генерала, Владимиру Иванычу."
        rubric: ["五个问题都回答，情节与课文一致", "正确使用只有复数的名词 [деньги, суток]{.ru}", "用 [то… то…]{.ru} 或其他方式说明态度的反复"]
        notes: "第 2 题 [несколько суток]{.ru}：[сутки]{.ru} 只有复数，[несколько]{.ru} 后用复数第二格。第 3 题可以用 [когда… когда…]{.ru} 对照两种态度。第 4 题 [то… то…]{.ru} 表示“一会儿……一会儿……”。"

  - id: e2
    type: fill
    task: 用括号里的名词填空，注意格。
    why: "这些名词只有复数，变格时一律按复数变。第 1 题 [без]{.ru} + 第二格：[денег]{.ru}，不是 [деньгов]{.ru}。第 2 题 [несколько]{.ru} + 复数第二格 [суток]{.ru}。第 3 题 [из]{.ru} + 第二格 [ворот]{.ru}，零词尾。第 4 题 [за]{.ru} + 第五格 表示“去取”：[за дровами]{.ru}。第 5 题 [без]{.ru} + 第二格 [очков]{.ru}。第 6 题 [в]{.ru} + 第六格 [в санях]{.ru}。"
    items:
      - stem: Хрюкин не хотел остаться без ___.
        hint: деньги
        accept: ["денег"]
      - stem: Палец не будет работать несколько ___.
        hint: сутки
        accept: ["суток"]
      - stem: Собака выбежала из ___ склада.
        hint: ворота
        accept: ["ворот"]
      - stem: Хрюкин шёл по делу, за ___.
        hint: дрова
        accept: ["дровами"]
      - stem: Старый генерал ничего не видел без ___.
        hint: очки
        accept: ["очков"]
      - stem: Зимой генерал ездил в ___.
        hint: сани
        accept: ["санях"]

  - id: e3
    type: choice
    task: 选择正确的计数方式。
    why: "只有复数的名词不能直接和 [два, три, четыре]{.ru} 连用。第 1 题用集合数词 [двое суток]{.ru}。第 2 题“一块表”用复数形式的 [одни часы]{.ru}，[один часы]{.ru} 性数不一致。第 3 题 [пять]{.ru} 以上直接接复数第二格：[пять суток]{.ru}。第 4 题“两条裤子”通常说 [две пары брюк]{.ru}；[двое брюк]{.ru} 语法上可以，但口语里很少用，不在选项里；[два брюк]{.ru}、[две брюки]{.ru} 都错。"
    items:
      - stem: Хрюкин сказал, что не сможет работать ___.
        options: [два суток, двое суток, две сутки]
        answer: двое суток
      - stem: У Очумелова были ___ часы.
        options: [один, одна, одни]
        answer: одни
      - stem: Он не спал ___.
        options: [пять суток, пять сутки, пятеро сутки]
        answer: пять суток
      - stem: В лавке он купил ___.
        options: [два брюк, две брюки, две пары брюк]
        answer: две пары брюк

  - id: e4
    type: rewrite
    task: 把句中的名词换成括号里只有复数的名词，相应地改动形容词和动词。
    example:
      cue: На столе лежала новая книга. (ножницы)
      answer: На столе лежали новые ножницы.
    why: "只有复数的名词不分性，修饰它的形容词、指代它的代词、动词过去时一律用复数。第 1 题 [был → были]{.ru}，[новый → новые]{.ru}。第 2 题 [она → они]{.ru}。第 3 题 [дорогое → дорогие]{.ru}，[стоило → стоили]{.ru}。第 4 题 [сутки]{.ru} 作主语，谓语也用复数 [прошли]{.ru}。"
    items:
      - cue: У генерала был новый дом. (сани)
        accept: ["У генерала были новые сани."]
      - cue: "Где моя шапка? Вот она. (очки)"
        accept: ["Где мои очки? Вот они."]
      - cue: Это дорогое вино стоило сто рублей. (духи)
        accept: ["Эти дорогие духи стоили сто рублей."]
      - cue: Прошёл целый день. (сутки)
        accept: ["Прошли целые сутки."]

  - id: e5
    type: translate
    task: 翻译下列句子，注意只有复数的名词的形式。
    items:
      - zh: 我两天两夜没有睡觉。
        accept: ["Я не спал двое суток.", "Я не спала двое суток.", "Двое суток я не спал.", "Двое суток я не спала."]
        rubric: ["[двое суток]{.ru}：集合数词 + 复数第二格", "时间状语用第四格，不加前置词"]
      - zh: 他向赫留金保证会赔钱。
        accept: ["Он обещал Хрюкину, что ему заплатят деньги.", "Он обещал Хрюкину, что деньги ему заплатят.", "Он пообещал Хрюкину, что ему заплатят деньги.", "Он пообещал Хрюкину, что деньги ему заплатят."]
        rubric: ["[обещать кому]{.ru}：第三格", "[деньги]{.ru} 只有复数，[заплатят]{.ru} 用不定人称句"]
      - zh: 一条狗从柴栈的大门里跑了出来。
        accept: ["Из ворот дровяного склада выбежала собака.", "Собака выбежала из ворот дровяного склада."]
        rubric: ["[из ворот]{.ru}：[ворота]{.ru} 的第二格是 [ворот]{.ru}", "[дровяного склада]{.ru} 作非一致定语"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，用课文细节说明理由，最后得出结论。
    items:
      - prompt: "[Только ли Очумелов — «хамелеон» в рассказе Чехова?]{.ru} 至少用两个只有复数的名词，并用一处 [по]{.ru} 的结构。"
        length: 180–220
        model: "Обычно хамелеоном в рассказе Чехова называют только Очумелова. По-моему, это не совсем так. Конечно, Очумелов — главный хамелеон. За несколько минут он пять раз меняет своё мнение о собаке, и каждый раз причина одна: чья она. Когда говорят, что собака генеральская, ему становится жарко, и он снимает шинель; когда городовой вспоминает, что видел такую собаку у генерала, ему вдруг становится холодно, и он снова надевает шинель. Сначала он обещает Хрюкину, что деньги ему заплатят, а в конце, уходя по базарной площади, сам грозит ему. Закон для него ничего не значит, важен только чин хозяина. Однако хамелеоны в рассказе есть и кроме него. Городовой Елдырин тоже говорит то одно, то другое: сначала он уверен, что собака не генеральская, а через минуту вспоминает, что видел такую у генерала во дворе. Хрюкин тоже не так прост: он тыкал собаке сигаретой в морду, а потом кричал, что палец несколько суток не будет работать, и хотел получить деньги. Даже толпа, которая сначала смотрела на Хрюкина с интересом, в конце смеётся над ним, потому что так делает начальник. Поэтому я думаю, что Чехов смеётся не над одним человеком, а над целым обществом, где все боятся сильных и думают прежде всего о себе. Рассказ был написан больше ста лет назад, но, к сожалению, хамелеонов можно встретить и сегодня: в любом месте, где мнение начальника важнее правды."
        rubric: ["开头明确提出看法", "先分析奥丘梅洛夫，再分析至少两个其他人物", "理由有课文细节（大衣、几次改口、叶尔德林的话、人群的笑）", "结论从人物上升到社会", "至少两个只有复数的名词", "180–220 词"]
        notes: "范文约 200 词。第一句先说出通常的看法，第二句表示不同意（[По-моему, это не совсем так]{.ru}），这是议论文常用的开头。先用 [Конечно]{.ru} 承认奥丘梅洛夫是主要的“变色龙”，再用 [Однако]{.ru} 把范围扩大到叶尔德林、赫留金和人群。结论 [Поэтому я думаю…]{.ru} 把对个别人物的批评推广到整个社会，最后一句联系今天。只有复数的名词：[деньги]{.ru}、[суток]{.ru}；[по]{.ru} + 第三格：[по базарной площади]{.ru}。[то одно, то другое]{.ru} 意思是“一会儿这样一会儿那样”。"
