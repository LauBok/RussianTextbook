lesson: L32
grammar: "名词单数第二格；[нет]{.ru} + 第二格表示“没有”“不在”；过去时 [был, была́, бы́ло, бы́ли]{.ru} 与 [не́ было]{.ru} + 第二格。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的名词变成第二格，填入空白。
    why: 阳性、中性词尾变 [-а]{.ru} / [-я]{.ru}，阴性变 [-ы]{.ru} / [-и]{.ru}。[соба́ка]{.ru}、[ба́бушка]{.ru} 词干末尾是 [к]{.ru}，按拼写规则写 [-и]{.ru}；[па́па]{.ru}、[де́душка]{.ru} 虽是阳性，以 [-а]{.ru} 结尾，按阴性变；[слова́рь]{.ru} 是阳性软辅音结尾，变 [-я]{.ru}，重音移到词尾；[метро́]{.ru} 不变格。
    items:
      - stem: У меня́ нет ___.
        hint: брат
        accept: [бра́та]
      - stem: У него́ нет ___.
        hint: соба́ка
        accept: [соба́ки]
      - stem: Здесь нет ___.
        hint: интерне́т
        accept: [интерне́та]
      - stem: ___ нет до́ма.
        hint: па́па
        accept: [Па́пы]
      - stem: У неё нет ___.
        hint: слова́рь
        accept: [словаря́]
      - stem: Здесь нет ___.
        hint: метро́
        accept: [метро́]
      - stem: ___ нет на да́че.
        hint: де́душка
        accept: [Де́душки]
      - stem: У тебя́ нет ___?
        hint: тетра́дь
        accept: [тетра́ди]
      - stem: Здесь нет ___.
        hint: река́
        accept: [реки́]

  - id: e2
    type: rewrite
    task: 把肯定句改成否定句。
    placeholder: … нет …
    example:
      cue: У меня́ есть сестра́.
      answer: У меня́ нет сестры́.
    why: "[есть]{.ru} 换成 [нет]{.ru}，原来的主语改用第二格。第 4 题的 [Он]{.ru} 是第一格主语，否定时也要改成第二格 [Его́]{.ru}，前面没有前置词，所以不加 [н-]{.ru}。"
    items:
      - cue: У него́ есть брат.
        accept: [У него́ нет бра́та.]
      - cue: Здесь есть магази́н.
        accept: [Здесь нет магази́на.]
      - cue: У нас есть да́ча.
        accept: [У нас нет да́чи.]
      - cue: Он до́ма.
        accept: [Его́ нет до́ма.]
      - cue: А́нна на уро́ке.
        accept: [А́нны нет на уро́ке.]
      - cue: У них есть телеви́зор.
        accept: [У них нет телеви́зора.]

  - id: e3
    type: choice
    task: 选择正确的过去时形式。
    why: 肯定句里 [был, была́, бы́ло, бы́ли]{.ru} 跟主语（所有物）一致：[брат]{.ru} 阳性，[ко́шка]{.ru} 阴性，[фо́то]{.ru} 中性，[пироги́]{.ru} 复数。否定句里名词是第二格，没有主语，一律用 [не́ было]{.ru}，最容易错的是第 5、6 题按名词的性说成 [не была́]{.ru}、[не был]{.ru}。
    items:
      - stem: У ба́бушки ___ ста́рший брат.
        options: [был, была́, бы́ло, бы́ли]
        answer: был
      - stem: У меня́ ___ ко́шка.
        options: [был, была́, бы́ло, бы́ли]
        answer: была́
      - stem: У нас ___ ста́рое фо́то.
        options: [был, была́, бы́ло, бы́ли]
        answer: бы́ло
      - stem: Вчера́ у нас ___ пироги́.
        options: [был, была́, бы́ло, бы́ли]
        answer: бы́ли
      - stem: Ра́ньше у неё ___ сестры́.
        options: [не был, не была́, не́ было]
        answer: не́ было
      - stem: Здесь ___ магази́на.
        options: [не был, не была́, не́ было]
        answer: не́ было

  - id: e4
    type: rewrite
    task: 把句子改成过去时。
    placeholder: … не́ было …
    example:
      cue: Здесь нет телеви́зора.
      answer: Здесь не́ было телеви́зора.
    why: "[нет]{.ru} 的过去时是 [не́ было]{.ru}，名词仍用第二格。[есть]{.ru} 的过去时跟主语一致：第 3 题 [соба́ка]{.ru} 阴性，用 [была́]{.ru}。"
    items:
      - cue: У меня́ нет бра́та.
        accept: [У меня́ не́ было бра́та.]
      - cue: Здесь нет интерне́та.
        accept: [Здесь не́ было интерне́та.]
      - cue: У него́ есть соба́ка.
        accept: [У него́ была́ соба́ка.]
      - cue: Ми́ши нет до́ма.
        accept: [Ми́ши не́ было до́ма.]
      - cue: Здесь нет метро́.
        accept: [Здесь не́ было метро́.]

  - id: e5
    type: translate
    task: 译成俄语。
    why: “没有”“不在”都用 [нет]{.ru} + 第二格，过去时用 [не́ было]{.ru} + 第二格。“连……也”用 [и]{.ru}。
    items:
      - zh: 我没有兄弟，也没有姐妹。
        accept: ["У меня́ нет бра́та и нет сестры́.", "У меня́ нет бра́та и сестры́.", "У меня́ нет бра́та, и сестры́ то́же нет.", "У меня́ нет бра́та и то́же нет сестры́."]
        rubric: ["[нет]{.ru} 后用第二格 [бра́та]{.ru}、[сестры́]{.ru}", "[сестры́]{.ru} 重音在词尾"]
      - zh: 别墅那儿没有网。
        accept: ["На да́че нет интерне́та.", "Интерне́та на да́че нет."]
        rubric: ["“在别墅”用 [на да́че]{.ru}", "[интерне́та]{.ru} 用第二格"]
      - zh: 以前这里连地铁都没有。
        accept: ["Ра́ньше здесь и метро́ не́ было.", "Ра́ньше здесь не́ было и метро́.", "Ра́ньше тут и метро́ не́ было."]
        rubric: ["过去时用 [не́ было]{.ru}，不按名词变", "[метро́]{.ru} 不变格", "“连……都”用 [и]{.ru}"]
      - zh: 米沙昨天不在家。
        accept: ["Ми́ши вчера́ не́ было до́ма.", "Вчера́ Ми́ши не́ было до́ма.", "Ми́ши не́ было до́ма вчера́."]
        rubric: ["[Ми́ши]{.ru} 用第二格", "过去时用 [не́ было]{.ru}"]
      - zh: 奶奶以前有一只猫。
        accept: ["У ба́бушки ра́ньше была́ ко́шка.", "Ра́ньше у ба́бушки была́ ко́шка."]
        rubric: ["[у ба́бушки]{.ru}：[у]{.ru} 后用第二格，[к]{.ru} 后写 [и]{.ru}", "[была́]{.ru} 与阴性名词 [ко́шка]{.ru} 一致"]
