lesson: L98
grammar: "否定代词和否定副词 [никто́, ничего́, никогда́, нигде́, никуда́]{.ru}：句中有 [ни-]{.ru} 词时动词前还要加 [не]{.ru}；[никто́]{.ru}、[ничто́]{.ru} 按 [кто]{.ru}、[что]{.ru} 变格，带前置词时写成 [ни о чём]{.ru}；[не́ был]{.ru} 但 [не была́]{.ru}。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句用否定词回答问题。
    placeholder: Нет, …
    example:
      cue: Ты был в Сиби́ри?
      answer: Нет, я никогда́ не́ был в Сиби́ри.
    why: "疑问词换成对应的 [ни-]{.ru} 词：[когда́ → никогда́]{.ru}，[кто → никто́]{.ru}，[что → ничего́]{.ru}，[где → нигде́]{.ru}，[куда́ → никуда́]{.ru}。动词前一定要加 [не]{.ru}，这是中国学生最容易漏的。[не́ был]{.ru} 重音在 [не]{.ru} 上。"
    items:
      - cue: Кто сего́дня звони́л?
        accept: ["Никто́ не звони́л.", "Нет, никто́ не звони́л.", "Сего́дня никто́ не звони́л.", "Нет, сего́дня никто́ не звони́л."]
      - cue: Что ты зна́ешь о Байка́ле?
        accept: ["Я ничего́ не зна́ю о Байка́ле.", "Нет, я ничего́ не зна́ю о Байка́ле.", "Я ничего́ не зна́ю."]
      - cue: Куда́ вы е́здили ле́том?
        accept: ["Мы никуда́ не е́здили.", "Ле́том мы никуда́ не е́здили.", "Нет, мы никуда́ не е́здили."]
      - cue: Где ты ви́дел медве́дя?
        accept: ["Я нигде́ не ви́дел медве́дя.", "Нет, я нигде́ не ви́дел медве́дя.", "Я никогда́ не ви́дел медве́дя."]
      - cue: Ты была́ на Байка́ле?（女性回答）
        accept: ["Нет, я никогда́ не была́ на Байка́ле.", "Я никогда́ не была́ на Байка́ле."]

  - id: e2
    type: fill
    task: 用 [никто́]{.ru} 或 [ничто́]{.ru} 的正确形式填空。
    why: "[никто́]{.ru}、[ничто́]{.ru} 的格由动词或前置词决定：[ви́деть кого́]{.ru} → [никого́]{.ru}；[звони́ть кому́]{.ru} → [никому́]{.ru}；[занима́ться чем]{.ru} → [ниче́м]{.ru}；[ду́мать о чём]{.ru} → [ни о чём]{.ru}，前置词夹在 [ни]{.ru} 和代词中间，空里填 [чём]{.ru}。否定句里“什么也……”作补语一般用第二格 [ничего́]{.ru}。"
    items:
      - stem: В па́рке я ___ не ви́дел.
        hint: никто́
        accept: [никого́]
      - stem: Я ___ не звони́л.
        hint: никто́
        accept: [никому́]
      - stem: Ми́ша ___ не де́лает.
        hint: ничто́
        accept: [ничего́]
      - stem: На кани́кулах он ___ не занима́лся.
        hint: ничто́
        accept: [ниче́м]
      - stem: Сейча́с я ни о ___ не ду́маю.
        hint: что
        accept: [чём]
      - stem: До́ма ___ нет.
        hint: никто́
        accept: [никого́]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1、2 题考 [не́ был]{.ru} 的性：伊万·谢尔盖耶维奇是男性，[не́ был]{.ru}；玛丽亚·尼古拉耶夫娜是女性，[не была́]{.ru}。第 3、4 题 [нигде́]{.ru} 回答“在哪儿”，[никуда́]{.ru} 回答“去哪儿”，和 [где / куда́]{.ru} 的区别一样：[е́здить]{.ru} 是运动动词，用 [никуда́]{.ru}。第 5 题必须有 [не]{.ru}。"
    items:
      - stem: Ива́н Серге́евич никогда́ ___ на ю́ге.
        options: [не́ был, не была́]
        answer: не́ был
      - stem: Мари́я Никола́евна никогда́ ___ в Сиби́ри.
        options: [не́ был, не была́]
        answer: не была́
      - stem: Ле́том мы ___ не е́здили.
        options: [нигде́, никуда́]
        answer: никуда́
      - stem: Тако́го о́зера нет ___.
        options: [нигде́, никуда́]
        answer: нигде́
      - stem: Я никогда́ ___ медве́дя.
        options: [ви́дел, не ви́дел]
        answer: не ви́дел

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我从来没去过西伯利亚。（男性说）
        accept: ["Я никогда́ не́ был в Сиби́ри."]
        rubric: ["[никогда́]{.ru} + [не]{.ru}，不能漏掉 [не]{.ru}", "[в Сиби́ри]{.ru} 第六格"]
      - zh: 谁也不待在家里。
        accept: ["Никто́ не сиди́т до́ма.", "До́ма никто́ не сиди́т."]
        rubric: ["[никто́]{.ru} 作主语，动词用单数第三人称", "动词前加 [не]{.ru}"]
      - zh: 我对贝加尔湖几乎一无所知。
        accept: ["Я почти́ ничего́ не зна́ю о Байка́ле.", "О Байка́ле я почти́ ничего́ не зна́ю."]
        rubric: ["“一无所知”用 [ничего́ не зна́ю]{.ru}", "[о Байка́ле]{.ru} 第六格"]
      - zh: 我们哪儿也不去。
        accept: ["Мы никуда́ не е́здим.", "Мы никуда́ не хо́дим.", "Мы никуда́ не е́дем.", "Мы никуда́ не идём."]
        rubric: ["“去哪儿”的否定用 [никуда́]{.ru}，不用 [нигде́]{.ru}", "动词前加 [не]{.ru}"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你和一位俄罗斯朋友聊旅行：互相问对方去过哪些地方、做过什么。每人至少用两次否定词（[никогда́, нигде́, никто́, ничего́, никуда́]{.ru}）。写一段 6–8 句的对话。
        length: 50–80
        model: |
          — Ты был в Сиби́ри?
          — Нет, я никогда́ не́ был в Сиби́ри. А ты?
          — Я то́же. Я, кро́ме Москвы́ и Петербу́рга, нигде́ не́ был.
          — А твои́ роди́тели бы́ли на Байка́ле?
          — Нет, никто́ из нас там не́ был. Мы ле́том никуда́ не е́здим, мы живём на да́че.
          — А я ничего́ не зна́ю о Байка́ле. Говоря́т, там о́чень краси́во.
          — Дава́й пое́дем туда́ вме́сте ле́том!
          — Хоро́шая иде́я!
        rubric: ["每人至少两次否定词，动词前都有 [не]{.ru}", "[не́ был]{.ru} / [не была́]{.ru} 和说话人的性一致", "[нигде́]{.ru} 和 [никуда́]{.ru} 用对", "对话有问有答，结尾自然"]
        notes: 范文先问“去过吗”，用 [никогда́ не́ был]{.ru} 否定，再用 [кро́ме]{.ru} 加 [нигде́]{.ru} 补充去过的地方，接着用 [никто́]{.ru}、[никуда́]{.ru}、[ничего́]{.ru} 层层推进，最后用 [Дава́й пое́дем]{.ru} 提议，否定的话题落到积极的打算上。[никто́ из нас]{.ru}“我们当中谁也没有”。
