lesson: B2-L59
grammar: "不定代词和不定副词：[-то]{.ru}（确有，但说不出是谁、是什么）、[-нибудь]{.ru}（随便哪一个，有没有还不一定）、[ко́е-]{.ru}（我知道，但暂不说）。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的不定代词或不定副词。
    why: "[-то]{.ru} 用于确实有、但说不出是谁或是什么的情况（第 2、4 题：电话确实有人打过，东西确实买了；第 8 题：迪马确实去了某个地方），也指过去曾经（第 6 题 [когда́-то]{.ru}“从前”）。[-нибудь]{.ru} 用于疑问句（第 1 题：问有没有人打过，说话人不知道有没有，回答也是“没有”）、命令句（第 3 题）和将来（第 5 题 [когда́-нибудь]{.ru}“总有一天”）。第 7 题“不告诉你”，说话人知道是什么，只是不说，用 [ко́е-что]{.ru}。"
    items:
      - stem: — Мне ___ звони́л? — Нет, никто́ не звони́л.
        options: [кто́-то, кто́-нибудь]
        answer: кто́-нибудь
      - stem: Пока́ тебя́ не́ было, тебе́ ___ звони́л, но не сказа́л своего́ и́мени.
        options: [кто́-то, кто́-нибудь]
        answer: кто́-то
      - stem: Расскажи́ нам ___ о Пеки́не!
        options: [что́-то, что́-нибудь]
        answer: что́-нибудь
      - stem: А́нна ___ купи́ла, но не говори́т что.
        options: [что́-то, что́-нибудь]
        answer: что́-то
      - stem: Я ___ обяза́тельно пое́ду на Байка́л.
        options: [когда́-то, когда́-нибудь]
        answer: когда́-нибудь
      - stem: ___ здесь была́ библиоте́ка, а тепе́рь здесь кафе́.
        options: [Когда́-то, Когда́-нибудь]
        answer: Когда́-то
      - stem: — Что ты де́лаешь? — Не скажу́! Гото́влю тебе́ ___.
        options: [ко́е-что, что́-нибудь]
        answer: ко́е-что
      - stem: Ди́мы нет в ко́мнате, он ___ пошёл.
        options: [куда́-то, куда́-нибудь]
        answer: куда́-то

  - id: e2
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "不定代词的前一部分照疑问代词变格，[-то]{.ru}、[-нибудь]{.ru} 不变。第 1 题 [ви́деть]{.ru} 支配第四格，[кто]{.ru} 的第四格是 [кого́]{.ru}；第 2 题 [с]{.ru} + 第五格 [кем]{.ru}；第 3 题 [о]{.ru} + 第六格，[како́й]{.ru} 按形容词变成 [како́м]{.ru}；第 4 题 [вы́пить]{.ru} 后可以用第二格 [чего́-нибудь]{.ru}（“喝点什么”），也可以用第四格 [что́-нибудь]{.ru}；第 5 题 [каку́ю-нибудь]{.ru} 和 [кни́гу]{.ru} 一致，用阴性第四格。"
    items:
      - stem: Ты ___ ви́дел в библиоте́ке?
        hint: кто́-нибудь
        accept: ["кого́-нибудь"]
      - stem: Ван Лэй с ___ говори́л по телефо́ну.
        hint: кто́-то
        accept: ["ке́м-то"]
      - stem: Мы говори́ли о ___ интере́сном фи́льме, но я забы́л его́ назва́ние.
        hint: како́й-то
        accept: ["како́м-то"]
      - stem: Хо́чешь ___ вы́пить?
        hint: что́-нибудь
        accept: ["чего́-нибудь", "что́-нибудь"]
      - stem: Подари́ Ди́ме ___ интере́сную кни́гу.
        hint: како́й-нибудь
        accept: ["каку́ю-нибудь"]

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题确实有人来过，用 [кто́-то]{.ru}；第 2 题是疑问句，不知道有没有人打过，用 [кто́-нибудь]{.ru}；第 3 题命令句，用 [что́-нибудь]{.ru}；第 4 题说话人知道是什么，用 [ко́е-что]{.ru}；第 5 题“总有一天”用 [когда́-нибудь]{.ru}。"
    items:
      - zh: 有人来过这里。
        accept: ["Кто́-то был здесь.", "Здесь кто́-то был.", "Кто́-то приходи́л сюда́.", "Сюда́ кто́-то приходи́л.", "Кто́-то сюда́ приходи́л."]
        rubric: ["确实有人来过，用 [кто́-то]{.ru}"]
      - zh: 今天有人给我打过电话吗？
        accept: ["Мне сего́дня кто́-нибудь звони́л?", "Сего́дня мне кто́-нибудь звони́л?", "Кто́-нибудь звони́л мне сего́дня?", "Мне кто́-нибудь звони́л сего́дня?", "Сего́дня кто́-нибудь звони́л мне?"]
        rubric: ["疑问句用 [кто́-нибудь]{.ru}", "[звони́ть]{.ru} + 第三格 [мне]{.ru}"]
      - zh: 随便讲点中国的事吧。
        accept: ["Расскажи́ что́-нибудь о Кита́е.", "Расскажи́те что́-нибудь о Кита́е.", "Расскажи́ о Кита́е что́-нибудь.", "Расскажи́те о Кита́е что́-нибудь."]
        rubric: ["命令句用 [что́-нибудь]{.ru}", "[о Кита́е]{.ru}"]
      - zh: 我这儿有点东西给你。
        accept: ["У меня́ для тебя́ ко́е-что есть.", "У меня́ есть ко́е-что для тебя́.", "У меня́ для тебя́ есть ко́е-что.", "У меня́ есть для тебя́ ко́е-что.", "У меня́ для вас ко́е-что есть.", "У меня́ есть ко́е-что для вас."]
        rubric: ["[ко́е-что]{.ru}：说话人知道是什么，暂不说", "[для тебя́]{.ru}"]
      - zh: 总有一天我会去北京。
        accept: ["Когда́-нибудь я пое́ду в Пеки́н.", "Я когда́-нибудь пое́ду в Пеки́н.", "Когда́-нибудь я бу́ду в Пеки́не.", "Я когда́-нибудь бу́ду в Пеки́не."]
        rubric: ["将来用 [когда́-нибудь]{.ru}", "完成体将来时 [пое́ду]{.ru}"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Как Ван Лэй сдал экза́мен по исто́рии? Что он уви́дел на столе́? Что бы́ло в запи́ске? Что сказа́ли Ми́ша, роди́тели и А́нна? Кто оста́вил пода́рок и почему́?]{.ru}"
        length: 60–90
        model: "В пя́тницу Ван Лэй сдал экза́мен по исто́рии на «пять». Когда́ он верну́лся домо́й, на его́ столе́ лежа́ла кака́я-то кни́га. Э́то был ста́рый ру́сско-кита́йский слова́рь, на поля́х кото́рого кто́-то когда́-то писа́л иеро́глифы. В запи́ске бы́ло: «Угада́й, от кого́». Ван Лэй по́нял, что кто́-то был до́ма, пока́ его́ не́ было. Ми́ша весь день был на футбо́ле, роди́тели ничего́ не зна́ли, а А́нна ко́е-что зна́ла, но не говори́ла. Ве́чером позвони́л Ди́ма. Он нашёл слова́рь у букини́ста и подари́л его́ Ван Лэ́ю за то, что тот учи́л его́ кита́йскому."
        rubric: ["回答全部五个问题", "至少三个不定代词：[како́й-то]{.ru}、[кто́-то]{.ru}、[ко́е-что]{.ru}", "直接引语改成叙述"]
        notes: 范文约 90 词。人物的反应合在一句里写，用逗号和 [а]{.ru} 分开。最后一句的 [тот]{.ru} 指王磊：句子里有两个男性人物，用 [тот]{.ru} 指后提到的那个，避免 [он]{.ru} 指代不清。

  - id: e5
    type: open
    task: 作文。题目：[Необы́чный пода́рок]{.ru}（一件不寻常的礼物）。
    items:
      - prompt: 讲一件你收到（或送出）的不寻常的礼物：是什么、谁送的、你怎样猜到的、为什么它对你很重要。至少用四个不同的不定代词或不定副词。
        length: 100–150
        model: "Когда́-то, когда́ я учи́лся в шко́ле, я получи́л о́чень необы́чный пода́рок.\n\nЭ́то бы́ло в день моего́ рожде́ния. У́тром я нашёл на столе́ каку́ю-то коро́бку. На ней не́ было ни и́мени, ни запи́ски. Я откры́л её, а там лежа́ли ста́рые часы́. Они́ не рабо́тали. Снача́ла я поду́мал, что кто́-то пошути́л.\n\nЯ спроси́л ма́му, зна́ет ли она́ что́-нибудь об э́том. Ма́ма улыбну́лась и сказа́ла: «Ко́е-что зна́ю. Спроси́ па́пу». Я узна́л, что э́то бы́ли часы́ моего́ де́душки. Он купи́л их, когда́ был студе́нтом, и носи́л их всю жизнь.\n\nВ тот же день па́па показа́л часы́ ма́стеру, и че́рез неде́лю они́ сно́ва рабо́тали. Я ношу́ их ка́ждый день и, мо́жет быть, когда́-нибудь подарю́ их своему́ сы́ну."
        rubric: ["讲清礼物是什么、谁送的、为什么重要", "至少四个不同的不定代词或副词，[-то]{.ru} 和 [-нибудь]{.ru} 用法正确", "故事有开头、经过、结尾"]
        notes: 范文用了六个不定代词和副词：[когда́-то]{.ru}（从前）、[каку́ю-то коро́бку]{.ru}（确有一个盒子，不知是什么）、[кто́-то пошути́л]{.ru}、[зна́ет ли она́ что́-нибудь]{.ru}（间接疑问，用 [-нибудь]{.ru}）、[ко́е-что зна́ю]{.ru}（知道而暂不说）、[когда́-нибудь]{.ru}（将来）。[часы́]{.ru} 只有复数形式，所以说 [ста́рые часы́]{.ru}、[они́ не рабо́тали]{.ru}。

  - id: e6
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。你想回赠迪马一本中文书，在书里夹一封信（6 月 19 日）：感谢他送的词典，说说这件礼物为什么让你高兴，介绍你送的书，约他以后一起读。
        length: 70–110
        model: "Москва́, 19 ию́ня\n\nДорого́й Ди́ма!\n\nСпаси́бо тебе́ за слова́рь! Когда́ я уви́дел на столе́ каку́ю-то кни́гу в бума́ге, я до́лго не мог поня́ть, от кого́ она́. А́ня ко́е-что зна́ла, но ничего́ мне не сказа́ла!\n\nТвой пода́рок о́чень ста́рый, но о́чень хоро́ший. Мо́жет быть, когда́-то по нему́ учи́лся како́й-то ру́сский студе́нт в Пеки́не.\n\nА я дарю́ тебе́ кни́гу ста́рых кита́йских стихо́в. Там есть и стихи́ Ли Бо. Сейча́с тебе́ бу́дет тру́дно их чита́ть, но когда́-нибудь ты их обяза́тельно прочита́ешь. Е́сли хо́чешь, мы мо́жем чита́ть их вме́сте по четверга́м.\n\nТвой друг Ван Лэй"
        rubric: ["书信格式；朋友之间用 [ты]{.ru}", "感谢并说明礼物的意义", "介绍回赠的书", "至少三个不定代词或副词"]
        notes: 感谢信开头直接写 [Спаси́бо тебе́ за…]{.ru}。[когда́-то… како́й-то ру́сский студе́нт]{.ru} 是王磊的猜想：“从前也许有哪个俄罗斯学生用它学习过”。说的是过去的事，那个学生如果有，就是确定的一个人，只是不知道是谁，所以用 [-то]{.ru}。[по четверга́м]{.ru}（每逢星期四）是 [по]{.ru} 加复数第三格，表示经常在某一天；王磊和迪马本来就每周四一起学汉语（第 2 课）。
