lesson: B2-L47
grammar: "说明从句：[что]{.ru} 与 [что́бы]{.ru}；[что́бы]{.ru} 从句用过去时形式；主语相同用不定式。"
exercises:

  - id: e1
    type: choice
    task: 选择 [что]{.ru} 或 [что́бы]{.ru}。
    why: "[что]{.ru} 陈述事实，从句动词按实际时间变；[что́бы]{.ru} 表示愿望、请求、命令，从句动词用过去时形式。第 1、4、6 题主句是 [хоте́ть, проси́ть, тре́бовать]{.ru}，用 [что́бы]{.ru}。第 2 题 [рад]{.ru} 后说的是已发生的事实，用 [что]{.ru}。第 3 题从句是将来时 [бу́дет]{.ru}，说明是陈述，用 [что]{.ru}。第 5、7 题都是 [сказа́ть]{.ru}：第 5 题从句动词 [позвони́т]{.ru} 是将来时，转述信息，用 [что]{.ru}；第 7 题从句动词是过去时形式 [пришёл]{.ru}，而且“叫他早点来”是命令，用 [что́бы]{.ru}。"
    items:
      - stem: Ка́тя хо́чет, ___ Ван Лэй пришёл на сва́дьбу.
        options: [что, что́бы]
        answer: что́бы
      - stem: Я рад, ___ ты пришла́.
        options: [что, что́бы]
        answer: что
      - stem: А́нна зна́ет, ___ сва́дьба бу́дет в суббо́ту.
        options: [что, что́бы]
        answer: что
      - stem: Па́па Ильи́ попроси́л, ___ Ван Лэй сказа́л тост.
        options: [что, что́бы]
        answer: что́бы
      - stem: Ди́ма сказа́л, ___ позвони́т ве́чером.
        options: [что, что́бы]
        answer: что
      - stem: Подру́ги тре́бовали, ___ жени́х спел пе́сню.
        options: [что, что́бы]
        answer: что́бы
      - stem: Ка́тя сказа́ла Ван Лэ́ю, ___ он пришёл пора́ньше.
        options: [что, что́бы]
        answer: что́бы

  - id: e2
    type: fill
    task: 用括号里的动词的正确形式填空。
    why: "[что́бы]{.ru} 后面一律用过去时形式，性数跟从句主语一致：第 1 题 [ты]{.ru} 是男性（王磊），用 [пришёл]{.ru}；第 2 题 [А́нна]{.ru} → [помогла́]{.ru}；第 3 题 [вы]{.ru} → [бы́ли]{.ru}；第 4 题无人称句用中性 [бы́ло]{.ru}。第 5、6 题是 [что]{.ru}，按实际时间：第 5 题说明天的事，用将来时 [придёт]{.ru}；第 6 题有 [вчера́]{.ru}，已发生，用过去时 [вы́шла]{.ru}。"
    items:
      - stem: Ван Лэй, я хочу́, что́бы ты ___ к нам.
        hint: прийти́
        accept: ["пришёл"]
      - stem: Ка́тя попроси́ла, что́бы А́нна ___ ей.
        hint: помо́чь
        accept: ["помогла́"]
      - stem: Я жела́ю, что́бы вы всегда́ ___ сча́стливы.
        hint: быть
        accept: ["бы́ли"]
      - stem: Ма́ма хо́чет, что́бы на сва́дьбе ___ ве́село.
        hint: быть
        accept: ["бы́ло"]
      - stem: А́нна сказа́ла, что Ди́ма за́втра ___ к нам.
        hint: прийти́
        accept: ["придёт"]
      - stem: Все зна́ют, что вчера́ Ка́тя ___ за́муж за Илью́.
        hint: вы́йти
        accept: ["вы́шла"]

  - id: e3
    type: rewrite
    task: 按例句把直接引语改成带 [что]{.ru} 或 [что́бы]{.ru} 的间接引语。
    example:
      cue: "Ка́тя сказа́ла Ван Лэ́ю: «Приходи́ на сва́дьбу!»"
      answer: Ка́тя сказа́ла Ван Лэ́ю, что́бы он пришёл на сва́дьбу.
    why: "直接引语是命令式（[Спой!]{.ru}、[Скажи́те!]{.ru}、[Позвони́!]{.ru}）的，改成 [что́бы]{.ru} + 过去时形式；直接引语是陈述句的，改成 [что]{.ru}，时间不变。人称要换：第 1 题 [нам]{.ru} 换成 [им]{.ru}；第 3 题 [я]{.ru} 换成 [она́]{.ru}；第 4 题 [вы]{.ru} 指王磊一个人，从句里用 [он]{.ru} 和阳性 [сказа́л]{.ru}。"
    items:
      - cue: "А́нна сказа́ла Илье́: «Спой нам пе́сню!»"
        accept: ["А́нна сказа́ла Илье́, что́бы он спел им пе́сню.", "А́нна сказа́ла Илье́, что́бы он спел пе́сню."]
      - cue: "Ка́тя попроси́ла А́нну: «Позвони́ мне за́втра!»"
        accept: ["Ка́тя попроси́ла А́нну, что́бы она́ позвони́ла ей за́втра.", "Ка́тя попроси́ла, что́бы А́нна позвони́ла ей за́втра."]
      - cue: "А́нна сказа́ла: «Я куплю́ цветы́»."
        accept: ["А́нна сказа́ла, что она́ ку́пит цветы́.", "А́нна сказа́ла, что ку́пит цветы́."]
      - cue: "Па́па Ильи́ сказа́л Ван Лэ́ю: «Скажи́те тост по-кита́йски!»"
        accept: ["Па́па Ильи́ сказа́л Ван Лэ́ю, что́бы он сказа́л тост по-кита́йски."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、3 题是愿望、请求，主句和从句主语不同，用 [что́бы]{.ru} 加过去时形式；第 2 题主语相同，直接用不定式；第 4 题是已发生的事实，用 [что]{.ru}。
    items:
      - zh: 我希望你们幸福。
        accept: ["Я хочу́, что́бы вы бы́ли сча́стливы.", "Я жела́ю, что́бы вы бы́ли сча́стливы.", "Я хочу́, что́бы вы бы́ли счастли́выми."]
        rubric: ["主语不同用 [что́бы]{.ru}", "[бы́ли]{.ru}：过去时形式，复数"]
      - zh: 我想去参加卡佳的婚礼。
        accept: ["Я хочу́ пойти́ на сва́дьбу Ка́ти.", "Я хочу́ пойти́ на сва́дьбу к Ка́те.", "Я хочу́ пое́хать на сва́дьбу Ка́ти.", "Я хочу́ быть на сва́дьбе Ка́ти.", "Я хочу́ прийти́ на сва́дьбу Ка́ти."]
        rubric: ["主语相同用不定式，不用 [что́бы]{.ru}", "[на сва́дьбу]{.ru}：第四格表示方向"]
      - zh: 妈妈请米沙买面包。
        accept: ["Ма́ма попроси́ла Ми́шу купи́ть хлеб.", "Ма́ма попроси́ла, что́бы Ми́ша купи́л хлеб.", "Ма́ма попроси́ла Ми́шу, что́бы он купи́л хлеб.", "Ма́ма про́сит Ми́шу, что́бы он купи́л хлеб.", "Ма́ма про́сит Ми́шу купи́ть хлеб.", "Ма́ма про́сит, что́бы Ми́ша купи́л хлеб."]
        rubric: ["[попроси́ть кого́ + 不定式]{.ru} 或 [что́бы]{.ru} + 过去时形式", "[Ми́шу]{.ru} 用第四格"]
      - zh: 卡佳很高兴王磊来了。
        accept: ["Ка́тя о́чень ра́да, что Ван Лэй пришёл.", "Ка́тя была́ о́чень ра́да, что Ван Лэй пришёл."]
        rubric: ["事实用 [что]{.ru}", "[ра́да]{.ru}：阴性短尾"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Когда́ Ка́тя выходи́ла за́муж? Что подари́л Ван Лэй молоды́м? Что тре́бовали подру́ги неве́сты? Что бы́ло в рестора́не? Како́й тост сказа́л Ван Лэй?]{.ru}"
        length: 60–90
        model: "Два́дцать второ́го ма́я Ка́тя выходи́ла за́муж за Илью́. Она́ хоте́ла, что́бы Ван Лэй то́же пришёл на сва́дьбу. Ван Лэй подари́л молоды́м де́ньги в кра́сном конве́рте, как в Кита́е. У́тром подру́ги неве́сты не пуска́ли Илью́ в кварти́ру и тре́бовали, что́бы он отве́тил на зага́дки и спел пе́сню. Ве́чером в рестора́не молоды́е откуси́ли карава́й. Па́па Ильи́ попроси́л, что́бы Ван Лэй сказа́л тост по-кита́йски. В то́сте Ван Лэй сказа́л, что жела́ет, что́бы молоды́е всегда́ бы́ли вме́сте."
        rubric: ["回答全部五个问题", "至少三处 [что́бы]{.ru} + 过去时形式", "[вы́йти за́муж за]{.ru} + 第四格"]
        notes: 范文约 80 词。课文里的对话都改成了间接引语：命令和请求用 [что́бы]{.ru}，如 [тре́бовали, что́бы он отве́тил]{.ru}、[попроси́л, что́бы Ван Лэй сказа́л]{.ru}；祝酒词用 [сказа́л, что жела́ет, что́бы…]{.ru} 概括，[что]{.ru} 和 [что́бы]{.ru} 两层从句套在一起。

  - id: e6
    type: open
    task: 作文：写一次你参加过的婚礼、生日会或其他家庭聚会。
    items:
      - prompt: 写清楚：是谁的聚会、在哪里、来了哪些人、有什么风俗或游戏、主人希望客人做什么、你祝愿了什么。至少用三处 [что́бы]{.ru} 和两处 [что]{.ru}。
        length: 100–150
        model: "В про́шлом году́ мой шко́льный друг жени́лся, и я был на его́ сва́дьбе в Шанха́е. Неве́ста была́ в кра́сном пла́тье, потому́ что в Кита́е кра́сный цвет — цвет сча́стья. У́тром жени́х е́здил за неве́стой, а её подру́ги не пуска́ли его́ в дом. Они́ тре́бовали, что́бы он дал им кра́сные конве́рты с деньга́ми. Пото́м все пое́хали в рестора́н. Там бы́ло о́чень мно́го госте́й, наве́рное, две́сти челове́к. Роди́тели дру́га хоте́ли, что́бы ка́ждый гость сказа́л молоды́м не́сколько слов. Я о́чень волнова́лся, но сказа́л: «Я жела́ю, что́бы вы всегда́ люби́ли друг дру́га». Все говори́ли, что сва́дьба была́ о́чень краси́вая. Я ду́маю, что мой друг и его́ жена́ бу́дут всегда́ по́мнить э́тот день."
        rubric: ["交代是谁的聚会、在哪里、有哪些人和风俗", "至少三处 [что́бы]{.ru} + 过去时形式，两处 [что]{.ru}", "叙述用过去时，体用得恰当", "100–150 词"]
        notes: 范文约 130 词，按时间顺序写一天的经过，从早上接新娘写到饭店祝词。[что́бы]{.ru} 用在 [тре́бовали]{.ru}、[хоте́ли]{.ru}、[жела́ю]{.ru} 后面，[что]{.ru} 用在 [говори́ли]{.ru}、[ду́маю]{.ru} 后面，正好对比两种说明从句。结尾写感受，比单纯列举事情更完整。

  - id: e7
    type: open
    task: 书信写作：以王磊的身份给住在上海的表哥写一封信，讲讲卡佳的俄罗斯婚礼，比较它和中国婚礼的异同。
    items:
      - prompt: 写上称呼、日期和落款；至少讲两个俄罗斯婚礼的风俗；用上 [что]{.ru} 和 [что́бы]{.ru} 各两次。
        length: 80–120
        model: "Москва́, 23 ма́я\n\nДорого́й брат!\n\nКак ты? Как твоя́ жена́ и ма́ленькая Ду́ду? Вчера́ я был на ру́сской сва́дьбе! Выходи́ла за́муж Ка́тя, лу́чшая подру́га А́нны. Она́ сама́ хоте́ла, что́бы я пришёл. Я не знал, что ру́сская сва́дьба почти́ как на́ша: у́тром жени́х то́же «покупа́ет» неве́сту, а её подру́ги тре́буют, что́бы он отвеча́л на вопро́сы. А в рестора́не на стол ста́вят большо́й карава́й. Кто из молоды́х отку́сит бо́льше, тот бу́дет гла́вным в семье́. Ка́тя откуси́ла бо́льше! Па́па жениха́ попроси́л, что́бы я сказа́л тост по-кита́йски. Все говори́ли, что тост был о́чень хоро́ший.\n\nПиши́!\nТвой Ван Лэй"
        rubric: ["书信格式：日期、称呼、落款", "至少两个俄罗斯婚礼的风俗，并和中国婚礼比较", "[что]{.ru} 和 [что́бы]{.ru} 各两次，用法正确", "80–120 词"]
        notes: 范文约 110 词。开头问候表哥一家（表哥有妻子和小狗嘟嘟，见第一册第 31、34 课），中间介绍婚礼并点出与中国婚礼相似的地方，结尾 [Пиши́!]{.ru} 请对方回信。给平辈亲人写信用 [Дорого́й…!]{.ru} 和 [Твой…]{.ru}。
