lesson: L05
grammar: "名词复数第一格（[-ы]{.ru}、[-и]{.ru}、[-а]{.ru}）；拼写规则：[г, к, х, ж, ш, щ, ч]{.ru} 后写 [и]{.ru}；复数的重音移动和不规则复数；[они́]{.ru}、[мои́]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出名词的复数第一格。
    why: 阳性硬辅音结尾加 [-ы]{.ru}，[-а]{.ru} 改 [-ы]{.ru}，[-ь]{.ru} 改 [-и]{.ru}，中性 [-о]{.ru} 改 [-а]{.ru}。第 2、5、8、10 题词干末尾是 [г]{.ru}、[к]{.ru}、[ш]{.ru}、[ч]{.ru}，按拼写规则写 [и]{.ru}，写成 [кни́гы]{.ru}、[ру́чкы]{.ru} 是最常见的错误。第 6 题 [пода́рок]{.ru} 复数时 [о]{.ru} 脱落。第 1、4、7、8、10、12 题重音移动，要连同重音一起记。
    items:
      - stem: стол → ___
        accept: ["столы́"]
      - stem: кни́га → ___
        accept: ["кни́ги"]
      - stem: тетра́дь → ___
        accept: ["тетра́ди"]
      - stem: окно́ → ___
        accept: ["о́кна"]
      - stem: ру́чка → ___
        accept: ["ру́чки"]
      - stem: пода́рок → ___
        accept: ["пода́рки"]
      - stem: письмо́ → ___
        accept: ["пи́сьма"]
      - stem: каранда́ш → ___
        accept: ["карандаши́"]
      - stem: газе́та → ___
        accept: ["газе́ты"]
      - stem: ключ → ___
        accept: ["ключи́"]
      - stem: журна́л → ___
        accept: ["журна́лы"]
      - stem: слова́рь → ___
        accept: ["словари́"]

  - id: e2
    type: rewrite
    task: 把单数改成复数。
    placeholder: — Где мои́ …? — Вот они́.
    example:
      cue: — Где моя́ кни́га? — Вот она́.
      answer: — Где мои́ кни́ги? — Вот они́.
    why: 名词变成复数后，句子里和它有关的词都要跟着变：[мой]{.ru}、[моя́]{.ru}、[моё]{.ru} 一律改成 [мои́]{.ru}，[он]{.ru}、[она́]{.ru}、[оно́]{.ru} 一律改成 [они́]{.ru}。第 4 题 [фо́то]{.ru} 不变格，名词形式不变，只改 [мои́]{.ru} 和 [они́]{.ru}。
    items:
      - cue: — Где мой ключ? — Вот он.
        accept: ["— Где мои́ ключи́? — Вот они́."]
      - cue: — Где моя́ тетра́дь? — Вот она́.
        accept: ["— Где мои́ тетра́ди? — Вот они́."]
      - cue: — Где моё письмо́? — Вот оно́.
        accept: ["— Где мои́ пи́сьма? — Вот они́."]
      - cue: — Где моё фо́то? — Вот оно́.
        accept: ["— Где мои́ фо́то? — Вот они́."]
      - cue: — Где мой каранда́ш? — Он там.
        accept: ["— Где мои́ карандаши́? — Они́ там."]
      - cue: — Где моя́ ру́чка? — Она́ тут.
        accept: ["— Где мои́ ру́чки? — Они́ тут."]

  - id: e3
    type: choice
    task: 选择 [мой]{.ru}、[моя́]{.ru}、[моё]{.ru} 或 [мои́]{.ru}。
    why: 先看名词是单数还是复数，再看性。第 2 题 [па́лочки]{.ru}、第 4 题 [роди́тели]{.ru}、第 6 题 [пода́рки]{.ru} 都是复数，用 [мои́]{.ru}。第 3 题 [ключ]{.ru} 是阳性单数。第 5 题 [фо́то]{.ru} 单复数同形，要靠后面的 [они́]{.ru} 判断是复数。
    items:
      - stem: Э́то ___ газе́та.
        options: [мой, моя́, моё, мои́]
        answer: моя́
      - stem: Где ___ па́лочки?
        options: [мой, моя́, моё, мои́]
        answer: мои́
      - stem: Вот ___ ключ.
        options: [мой, моя́, моё, мои́]
        answer: мой
      - stem: Э́то ___ роди́тели.
        options: [мой, моя́, моё, мои́]
        answer: мои́
      - stem: — Где ___ фо́то? — Вот они́.
        options: [мой, моя́, моё, мои́]
        answer: мои́
      - stem: Где ___ пода́рки?
        options: [мой, моя́, моё, мои́]
        answer: мои́
      - stem: Вот ___ письмо́.
        options: [мой, моя́, моё, мои́]
        answer: моё

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 书、本子、笔、铅笔、照片都是王磊的；礼物是茶叶和筷子。照片上是王磊的父母和王磊本人。
    items:
      - stem: Кни́ги — вот ___.
        options: [они́, она́]
        answer: они́
      - stem: Тут ру́чки и ___.
        options: [карандаши́, ключи́]
        answer: карандаши́
      - stem: Э́то фо́то. Тут роди́тели и ___.
        options: [Ван Лэй, А́нна]
        answer: Ван Лэй
      - stem: Пода́рки — э́то чай и ___.
        options: [па́лочки, журна́лы]
        answer: па́лочки

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1 题“书”用复数，所以“我的”是 [мои́]{.ru}，“在这儿”是 [вот они́]{.ru}。第 3 题“父母”只能用复数 [роди́тели]{.ru}，也可以说 [ма́ма и па́па]{.ru}。第 4 题“筷子”是 [па́лочки]{.ru}，复数。
    items:
      - zh: ——我的书在哪儿？——在这儿呢。
        accept: ["— Где мои́ кни́ги? — Вот они́."]
        rubric: ["[кни́га]{.ru} 复数 [кни́ги]{.ru}，[г]{.ru} 后写 [и]{.ru}", "复数用 [мои́]{.ru}、[они́]{.ru}"]
      - zh: 这些是本子，那些是杂志和报纸。
        accept: ["Э́то тетра́ди, а там журна́лы и газе́ты.", "Вот тетра́ди, а там журна́лы и газе́ты.", "Э́то тетра́ди. А там журна́лы и газе́ты.", "Вот тетра́ди. А там журна́лы и газе́ты."]
        rubric: ["复数 [тетра́ди]{.ru}、[журна́лы]{.ru}、[газе́ты]{.ru}", "[э́то]{.ru} 接复数名词时不变"]
      - zh: 这是我的照片，这是我的父母。
        accept: ["Э́то моё фо́то. Вот мои́ роди́тели.", "Э́то моё фо́то, а э́то мои́ роди́тели.", "Э́то мои́ фо́то. Вот мои́ роди́тели.", "Э́то мои́ фо́то, а э́то мои́ роди́тели.", "Э́то моё фо́то. Э́то мои́ роди́тели.", "Э́то мои́ фо́то. Э́то мои́ роди́тели.", "Э́то моё фо́то. Вот мои́ ма́ма и па́па.", "Э́то моё фо́то. Э́то мои́ ма́ма и па́па."]
        rubric: ["[фо́то]{.ru} 不变，单数用 [моё]{.ru}，复数用 [мои́]{.ru}", "“父母”用 [роди́тели]{.ru} 或 [ма́ма и па́па]{.ru}，前面用 [мои́]{.ru}"]
      - zh: 这些是礼物：茶叶和筷子。
        accept: ["Э́то пода́рки: чай и па́лочки.", "Вот пода́рки: чай и па́лочки.", "Э́то пода́рки — чай и па́лочки.", "Вот пода́рки — чай и па́лочки."]
        rubric: ["[пода́рок]{.ru} 复数 [пода́рки]{.ru}，[о]{.ru} 脱落", "“筷子”用复数 [па́лочки]{.ru}"]
