lesson: B3-L18
grammar: "否定与体：[не надо / не нужно / не стоит]{.ru} 后用未完成体不定式；[нельзя]{.ru} + 未完成体“不允许”、+ 完成体“做不到”；否定命令式一般用未完成体，提醒、警告用完成体；过去时 [не]{.ru} + 未完成体表示根本没做，+ 完成体表示该做而没做成。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Почему Сочи называют самым длинным городом России? Почему в Сочи мягкий климат? Что особенного в воде Чёрного моря и кто в нём обитает? Какие советы дают туристам местные жители? Что произошло в Сочи в 2014 году?]{.ru}"
        length: 60–90
        model: "Сочи называют самым длинным городом России, потому что он протянулся вдоль моря почти на 145 километров. Климат здесь мягкий, потому что горы Кавказа защищают побережье от холодных северных ветров. Глубина Чёрного моря достигает 2210 метров, но жизнь есть только в верхнем слое: глубже 150–200 метров в воде много сероводорода. В море обитают три вида дельфинов. Местные жители советуют не лежать на пляже в полдень, не брать много тёплых вещей и не заплывать далеко в море, а главное — не забыть крем от солнца. В 2014 году в Сочи прошли XXII зимние Олимпийские игры."
        rubric: ["五个问题都回答，数字准确（145 公里、2210 米、2014 年）", "第 4 题的劝告用对体：[не лежать, не брать, не заплывать]{.ru} 用未完成体，[не забыть]{.ru} 用完成体", "用完整的句子"]
        notes: "范文约 90 词。第 4 题把课文的命令式和 [не надо]{.ru} 结构改成了 [советуют не …]{.ru}：劝人别做的事用未完成体，提醒别忘记的事用完成体 [не забыть]{.ru}。"

  - id: e2
    type: choice
    task: 选择正确的体。
    why: "第 1 题 [не надо]{.ru} 后用未完成体 [брать]{.ru}。第 2 题“这里禁止游泳”，[нельзя]{.ru} 表示不允许，用未完成体 [купаться]{.ru}。第 3 题“没法游泳，因为海浪太大”，[нельзя]{.ru} 表示做不到，用完成体 [искупаться]{.ru}。第 4 题提醒对方到时候别忘了，用完成体否定命令式 [Не забудьте]{.ru}。第 5 题 [ни разу не]{.ru} 表示根本没做过，用未完成体 [купался]{.ru}。第 6 题 [так и не]{.ru} 表示等了很久、该发生的事最后没有发生，用完成体 [позвонил]{.ru}。"
    items:
      - stem: В Сочи не надо ___ много тёплых вещей.
        options: [брать, взять]
        answer: брать
      - stem: Здесь нельзя ___ — это порт.
        options: [купаться, искупаться]
        answer: купаться
      - stem: Сегодня нельзя ___ — волны слишком большие.
        options: [купаться, искупаться]
        answer: искупаться
      - stem: ___ крем от солнца!
        options: [Не забывайте, Не забудьте]
        answer: Не забудьте
      - stem: Всю неделю шёл дождь, и он ни разу не ___ в море.
        options: [купался, искупался]
        answer: купался
      - stem: Мы весь вечер ждали, но он так и не ___.
        options: [звонил, позвонил]
        answer: позвонил

  - id: e3
    type: rewrite
    task: 把肯定的建议改成否定的建议，注意体的变化。
    example:
      cue: Надо взять с собой куртку.
      answer: Не надо брать с собой куртку.
    why: "[не надо]{.ru}、[не нужно]{.ru}、[не стоит]{.ru} 后面要换成未完成体：第 1 题 [купить → покупать]{.ru}，第 2 题 [пойти → ходить]{.ru} 或 [идти]{.ru}，第 3 题 [поехать → ехать]{.ru}，第 4 题 [подняться → подниматься]{.ru}。第 5 题是命令式：劝阻用未完成体 [Не берите]{.ru}。保留完成体（如 [*не надо купить]{.ru}）是最常见的错误。"
    items:
      - cue: Нужно купить зонт.
        accept: ["Не нужно покупать зонт."]
      - cue: Надо пойти на пляж в полдень.
        accept: ["Не надо ходить на пляж в полдень.", "Не надо идти на пляж в полдень.", "В полдень не надо ходить на пляж.", "В полдень не надо идти на пляж."]
      - cue: Стоит поехать в Сочи в августе.
        accept: ["Не стоит ехать в Сочи в августе."]
      - cue: Надо подняться в горы сегодня.
        accept: ["Не надо подниматься в горы сегодня.", "Сегодня не надо подниматься в горы."]
      - cue: Возьмите с собой тёплые вещи.
        accept: ["Не берите с собой тёплые вещи.", "Не берите с собой тёплых вещей."]

  - id: e4
    type: translate
    task: 翻译下列句子，注意否定句里动词的体。
    items:
      - zh: 正午不要躺在海滩上。
        accept: ["В полдень не нужно лежать на пляже.", "В полдень не надо лежать на пляже.", "Не лежите на пляже в полдень.", "В полдень не лежите на пляже.", "Не надо лежать на пляже в полдень.", "Не нужно лежать на пляже в полдень."]
        rubric: ["[не нужно / не надо]{.ru} + 未完成体，或未完成体否定命令式", "[в полдень]{.ru}"]
      - zh: 他到最后也没能下海游一次。
        accept: ["Он так и не искупался в море."]
        rubric: ["[так и не]{.ru} + 完成体 [искупался]{.ru}"]
      - zh: 可别误了火车！
        accept: ["Не опоздайте на поезд!", "Не опоздай на поезд!"]
        rubric: ["完成体否定命令式表示提醒：[не опоздайте]{.ru}", "[опоздать на что]{.ru}"]
      - zh: 你去过红波利亚纳吗？——没有，没去过。
        accept: ["Ты был в Красной Поляне? — Нет, не был.", "Ты ездил в Красную Поляну? — Нет, не ездил.", "Ты бывал в Красной Поляне? — Нет, не бывал."]
        rubric: ["只陈述事实用未完成体或 [был]{.ru}：[не ездил]{.ru}、[не был]{.ru}", "[в Красной Поляне]{.ru} 第六格 / [в Красную Поляну]{.ru} 第四格"]

  - id: e5
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段：至少用三处否定结构，体要用对；至少用两处副动词或形动词短语，其中一处由课文的从句或并列谓语改写而来。
    items:
      - prompt: "提纲：索契的位置和气候；黑海；给游客的建议；海滩；冬奥会和红波利亚纳；茶园；朋友的故事。"
        length: 120–150
        model: "Сочи, протянувшийся вдоль Чёрного моря почти на 145 километров, — главный курорт России. Горы Кавказа защищают город от северных ветров, поэтому здесь мягкий климат и растут пальмы. Глубина Чёрного моря достигает 2210 метров, но глубже 150–200 метров почти никто не живёт из-за сероводорода. Туристам советуют не лежать на пляже в полдень, не брать много тёплых вещей и не забыть крем от солнца. Пляжи здесь покрыты галькой, а не песком. В 2014 году в Сочи прошли зимние Олимпийские игры, и теперь, покатавшись утром на лыжах в Красной Поляне, вечером можно гулять у моря. Недалеко от города растут одни из самых северных чайных плантаций. Мой друг, приехав в Сочи осенью, так и не искупался в море, потому что всю неделю шёл дождь. Но он не жалеет, что приехал не в сезон."
        rubric: ["提纲七项都有，数字准确", "至少三处否定结构，体用对", "至少两处副动词或形动词短语，一处由课文改写", "120–150 词"]
        notes: "范文约 140 词。否定结构：[советуют не лежать, не брать]{.ru}（未完成体）、[не забыть]{.ru}（完成体，提醒）、[так и не искупался]{.ru}（完成体，没做成）、[не жалеет]{.ru}。短语：[протянувшийся вдоль Чёрного моря]{.ru}（由课文的谓语 [протянулся]{.ru} 改成形动词）、[покатавшись утром на лыжах]{.ru}、[приехав в Сочи осенью]{.ru}（由课文的形动词短语 [приехавший в Сочи]{.ru} 改成副动词）。"
