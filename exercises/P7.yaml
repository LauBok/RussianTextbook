lesson: P7
grammar: "元音弱化：非重读的 [о]{.ru}、[а]{.ru} 读 [ɐ] 或 [ə]，非重读的 [е]{.ru}、[я]{.ru} 读 [ɪ]。"
exercises:

  - id: e1
    type: choice
    task: 选出词中所给元音的读音。
    why: "[о]{.ru}、[а]{.ru} 在重读音节读 [o]、[a]；在重音前第一个音节和词首读 [ɐ]；在其他非重读音节，包括重音后的所有音节，读 [ə]。[молоко́]{.ru} 的第一个 [о]{.ru} 在重音前第二个音节，读 [ə]，不是 [ɐ]。最常见的错误是看到 [о]{.ru} 就读 [o]。"
    items:
      - stem: "вода́: о = ___"
        options: ["[o]", "[ɐ]", "[ə]"]
        answer: "[ɐ]"
      - stem: "окно́: 第一个 о = ___"
        options: ["[o]", "[ɐ]", "[ə]"]
        answer: "[ɐ]"
      - stem: "молоко́: 第一个 о = ___"
        options: ["[o]", "[ɐ]", "[ə]"]
        answer: "[ə]"
      - stem: "пого́да: а = ___"
        options: ["[a]", "[ɐ]", "[ə]"]
        answer: "[ə]"
      - stem: "пого́да: 重读的 о = ___"
        options: ["[o]", "[ɐ]", "[ə]"]
        answer: "[o]"
      - stem: "Москва́: о = ___"
        options: ["[o]", "[ɐ]", "[ə]"]
        answer: "[ɐ]"

  - id: e2
    type: choice
    task: 选出正确的音标。
    why: "非重读的 [е]{.ru}、[я]{.ru} 读短而弱的 [ɪ]，前面的辅音仍然是软的；词首的 [я]{.ru} 不重读时读 [jɪ]，[j] 不能丢。非重读的 [о]{.ru}、[а]{.ru} 离重音越远越弱：重音前第一个音节 [ɐ]，再往前 [ə]。"
    items:
      - stem: сестра́ — ___
        options: ["[sʲeˈstra]", "[sʲɪˈstra]"]
        answer: "[sʲɪˈstra]"
      - stem: язы́к — ___
        options: ["[jɪˈzɨk]", "[jaˈzɨk]"]
        answer: "[jɪˈzɨk]"
      - stem: телефо́н — ___
        options: ["[tʲɪlʲɪˈfon]", "[tʲelʲeˈfon]"]
        answer: "[tʲɪlʲɪˈfon]"
      - stem: голова́ — ___
        options: ["[ɡɐɫɐˈva]", "[ɡəɫɐˈva]", "[ɡoɫoˈva]"]
        answer: "[ɡəɫɐˈva]"
      - stem: каранда́ш — ___
        options: ["[kərɐnˈdaʂ]", "[kɐrɐnˈdaʂ]", "[karanˈdaʂ]"]
        answer: "[kərɐnˈdaʂ]"

  - id: e3
    type: fill
    task: 根据读音写出单词。
    why: "弱化只改变读音，不改变拼写。[ɐ] 和 [ə] 可能写作 [о]{.ru}，也可能写作 [а]{.ru}；[ɪ] 可能写作 [е]{.ru}，也可能写作 [я]{.ru}。拿不准时，找让这个音节重读的词形：[вода́]{.ru} — [во́ды]{.ru}，[окно́]{.ru} — [о́кна]{.ru}。找不到的就要记住拼写，例如 [каранда́ш]{.ru} 的前两个元音都写 [а]{.ru}，[молоко́]{.ru} 的三个元音都写 [о]{.ru}。"
    items:
      - stem: "[vɐˈda] → ___"
        accept: [вода́]
      - stem: "[ɐkˈno] → ___"
        accept: [окно́]
      - stem: "[mɐˈskva] → ___"
        accept: [Москва́]
      - stem: "[məɫɐˈko] → ___"
        accept: [молоко́]
      - stem: "[pɐˈɡodə] → ___"
        accept: [пого́да]
      - stem: "[jɪˈzɨk] → ___"
        accept: [язы́к]
      - stem: "[tʲɪlʲɪˈfon] → ___"
        accept: [телефо́н]
      - stem: "[kərɐnˈdaʂ] → ___"
        accept: [каранда́ш]
      - stem: "[ɡəɫɐˈva] → ___"
        accept: [голова́]
