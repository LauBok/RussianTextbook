lesson: B2-L19
grammar: "人称代词变格全表；第三人称代词在前置词后加 [н-]{.ru}（[у него́, к ней, с ни́ми, о них]{.ru}）；物主代词 [его́, её, их]{.ru} 不加 [н-]{.ru}；[ко мне, со мной, обо мне]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的人称代词变成需要的格，注意前置词后面的 [н-]{.ru}。
    why: "先看动词或前置词要求哪一格，再看前面有没有前置词。第 1 题 [о]{.ru} 要求第六格 [ней]{.ru}；第 2 题 [у]{.ru} 要求第二格，有前置词，所以是 [него́]{.ru}；第 3 题 [с]{.ru} 要求第五格 [ним]{.ru}；第 4 题 [к]{.ru} 要求第三格 [ним]{.ru}，这里的 [ним]{.ru} 是 [они́]{.ru} 的第三格，和第 3 题 [он]{.ru} 的第五格同形；第 5 题 [без]{.ru} + 第二格，[ты]{.ru} 没有 [н-]{.ru} 的问题；第 6 题 [ви́деть]{.ru} 直接要求第四格，没有前置词，所以是 [её]{.ru}，不能写成 [неё]{.ru}；第 7 题 [вы]{.ru} 的第三格 [вам]{.ru}；第 8 题 [о]{.ru} 在 [мне]{.ru} 前写成 [обо]{.ru}。"
    items:
      - stem: Ми́ша ча́сто ду́мает о ___.
        hint: она́
        accept: ["ней"]
      - stem: Вчера́ я был у ___ в гостя́х.
        hint: он
        accept: ["него́"]
      - stem: Ми́ша лю́бит футбо́л, и Ди́ма ча́сто игра́ет с ___.
        hint: он
        accept: ["ним"]
      - stem: Роди́тели Ди́мы живу́т в Каза́ни, и в ма́е он пое́дет к ___.
        hint: они́
        accept: ["ним"]
      - stem: Без ___ мы не пойдём в кино́.
        hint: ты
        accept: ["тебя́"]
      - stem: Я давно́ не ви́дел ___.
        hint: она́
        accept: ["её"]
      - stem: О́льга Ви́кторовна, мо́жно позвони́ть ___ ве́чером?
        hint: вы
        accept: ["вам"]
      - stem: Что А́нна сказа́ла ___?
        hint: о + я
        accept: ["обо мне"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "关键是分清“他、她、他们”和“他的、她的、他们的”。代词后面紧跟着它修饰的名词时，它是物主代词，不加 [н-]{.ru}：[у его́ бра́та]{.ru}、[с её ма́мой]{.ru}、[ря́дом с их до́мом]{.ru}。代词后面没有名词时，它是人称代词，前置词后要加 [н-]{.ru}：[у него́]{.ru}、[для неё]{.ru}、[ря́дом с ни́ми]{.ru}。"
    items:
      - stem: Вчера́ я был у ___ бра́та.
        options: [его́, него́]
        answer: его́
      - stem: Вчера́ я был у ___.
        options: [его́, него́]
        answer: него́
      - stem: Мы до́лго говори́ли с ___ ма́мой.
        options: [её, неё]
        answer: её
      - stem: Э́то пода́рок для ___.
        options: [её, неё]
        answer: неё
      - stem: Мы живём ря́дом с ___ до́мом.
        options: [их, них]
        answer: их
      - stem: Мы живём ря́дом с ___.
        options: [и́ми, ни́ми]
        answer: ни́ми

  - id: e3
    type: rewrite
    task: 按例句用人称代词替换画线部分的名词，写出整句。
    example:
      cue: Ми́ша игра́ет с Ди́мой.
      answer: Ми́ша игра́ет с ним.
    why: "替换时格不变，只换成代词：[с Ди́мой → с ним]{.ru}（第五格），[к ба́бушке → к ней]{.ru}（第三格），[о роди́телях → о них]{.ru}（第六格），[у А́нны → у неё]{.ru}（第二格）。有前置词，第三人称代词都要加 [н-]{.ru}。第 5 题 [ви́дит А́нну]{.ru} 没有前置词，所以是 [её]{.ru}。"
    items:
      - cue: В суббо́ту мы пое́дем к ба́бушке.
        accept: ["В суббо́ту мы пое́дем к ней."]
      - cue: Ван Лэй ча́сто расска́зывает о роди́телях.
        accept: ["Ван Лэй ча́сто расска́зывает о них."]
      - cue: У А́нны есть гита́ра.
        accept: ["У неё есть гита́ра."]
      - cue: Э́то письмо́ для О́льги Ви́кторовны.
        accept: ["Э́то письмо́ для неё."]
      - cue: Ди́ма ка́ждый день ви́дит А́нну на ле́кциях.
        accept: ["Ди́ма ка́ждый день ви́дит её на ле́кциях."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1、2 题的 [о ней]{.ru}、[у него́]{.ru} 前面有前置词，加 [н-]{.ru}。第 3 题“和他们一起”用 [с ни́ми]{.ru}。第 4 题“称呼她”用 [обрати́ться к ней]{.ru}。第 5 题数词 6 后用 [челове́к]{.ru}。"
    items:
      - zh: 昨天我们谈论了她。
        accept: ["Вчера́ мы говори́ли о ней.", "Мы вчера́ говори́ли о ней.", "Мы говори́ли о ней вчера́."]
        rubric: ["[о ней]{.ru}：第六格，带 [н-]{.ru}", "过去时 [говори́ли]{.ru}"]
      - zh: 他有一个哥哥。
        accept: ["У него́ есть ста́рший брат.", "У него́ ста́рший брат."]
        rubric: ["[у него́]{.ru}，不能写成 [у его́]{.ru}", "“哥哥”是 [ста́рший брат]{.ru}"]
      - zh: 明天你和他们一起去剧院吗？
        accept: ["За́втра ты пойдёшь с ни́ми в теа́тр?", "Ты пойдёшь с ни́ми в теа́тр за́втра?", "Ты за́втра пойдёшь с ни́ми в теа́тр?", "За́втра ты пойдёшь в теа́тр с ни́ми?", "Ты за́втра пойдёшь в теа́тр с ни́ми?", "Вы за́втра пойдёте с ни́ми в теа́тр?", "За́втра вы пойдёте с ни́ми в теа́тр?", "За́втра ты идёшь с ни́ми в теа́тр?", "Ты за́втра идёшь с ни́ми в теа́тр?", "Ты за́втра идёшь в теа́тр с ни́ми?"]
        rubric: ["[с ни́ми]{.ru}：第五格，带 [н-]{.ru}", "[в теа́тр]{.ru} 用第四格"]
      - zh: 王磊不知道该怎么称呼她。
        accept: ["Ван Лэй не зна́ет, как обрати́ться к ней.", "Ван Лэй не зна́ет, как к ней обрати́ться."]
        rubric: ["[обрати́ться к ней]{.ru}：[к]{.ru} + 第三格，带 [н-]{.ru}", "[как]{.ru} 前加逗号"]
      - zh: 这部电影有六个人看了。
        accept: ["Э́тот фильм смотре́ли шесть челове́к.", "Фильм смотре́ли шесть челове́к.", "Шесть челове́к смотре́ли э́тот фильм.", "Э́тот фильм смотре́ло шесть челове́к.", "Фильм смотре́ло шесть челове́к."]
        rubric: ["[шесть челове́к]{.ru}", "谓语用复数 [смотре́ли]{.ru} 或中性单数 [смотре́ло]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кто был у Петро́вых в гостя́х в сре́ду? Како́й фильм они́ смотре́ли? О ком был фильм? Что спроси́л Ми́ша и что отве́тил па́па? Что Ди́ма рассказа́л об актёрах?]{.ru}"
        length: 50–80
        model: "В сре́ду у Петро́вых в гостя́х был Ди́ма. Он показа́л друзья́м ста́рый чёрно-бе́лый фильм о любви́. Фильм смотре́ли шесть челове́к. Он был о ро́бком инжене́ре и о молодо́й учи́тельнице. Инжене́р ду́мал то́лько о ней, но боя́лся обрати́ться к ней. Ми́ша спроси́л, почему́ она́ называ́ет его́ «това́рищ». Па́па отве́тил, что тогда́ так говори́ли везде́. Об актёре Ди́ма зна́ет мно́го, а об актри́се ма́ло."
        rubric: ["回答全部五个问题", "至少用对三个带 [н-]{.ru} 的代词形式，如 [о ней, к ней, у неё]{.ru}", "[шесть челове́к]{.ru}", "转述米沙的问题用间接引语 [почему́]{.ru}、[что]{.ru}"]
        notes: 范文约 70 词，按问题顺序组织。米沙和爸爸的对话改成了间接引语（第一册第 88、89 课），这样比照抄对话更紧凑。注意转述时人称要变：电影里的“她”和“他”在间接引语里仍然是 [она́]{.ru}、[его́]{.ru}。

  - id: e6
    type: open
    task: 作文。介绍一部你喜欢的电影或一本你喜欢的书：讲的是谁，他们是什么样的人，发生了什么事，结局怎样，你为什么喜欢。
    items:
      - prompt: 写 100–150 词。至少用四个前置词后带 [н-]{.ru} 的代词形式（如 [о нём, с ней, у них, для него́]{.ru}）。
        length: 100–150
        model: "Я хочу́ рассказа́ть о фи́льме «Москва́ слеза́м не ве́рит». Он об одно́й молодо́й де́вушке. Ра́ньше она́ жила́ в ма́леньком го́роде, а пото́м ста́ла жить в Москве́. У неё не́ было ни де́нег, ни друзе́й. Днём она́ рабо́тала на заво́де, а ве́чером учи́лась. Пото́м у неё родила́сь дочь, и она́ жила́ с ней одна́. Ей бы́ло тру́дно, но она́ не пла́кала. Че́рез мно́го лет она́ ста́ла дире́ктором большо́го заво́да. Одна́жды в электри́чке она́ познако́милась с одни́м челове́ком. Он был просто́й рабо́чий, но до́брый и интере́сный. С ним ей бы́ло ве́село и хорошо́. Она́ до́лго не говори́ла ему́, кем она́ рабо́тает. Мне нра́вится э́тот фильм, потому́ что он о си́льной же́нщине. Я ду́маю о ней, когда́ мне тру́дно."
        rubric: ["内容完整：人物、情节、结局、自己的评价", "至少四个带 [н-]{.ru} 的代词形式，格用对", "物主代词 [его́, её, их]{.ru} 修饰名词时不加 [н-]{.ru}", "100–150 词，句子之间有连接"]
        notes: 范文按“人物—经历—转折—结局—评价”的顺序写，用 [пото́м]{.ru}、[че́рез мно́го лет]{.ru}、[одна́жды]{.ru} 推动情节。带 [н-]{.ru} 的形式有 [у неё]{.ru}（两次）、[с ней]{.ru}、[с ним]{.ru}、[о ней]{.ru}；没有前置词的地方用 [ей]{.ru}、[ему́]{.ru}，不加 [н-]{.ru}。电影《莫斯科不相信眼泪》（1979 年）是苏联最有名的电影之一，1981 年获奥斯卡最佳外语片奖。
