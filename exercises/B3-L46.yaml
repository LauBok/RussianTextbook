lesson: B3-L46
grammar: "文学语体：描写要让读者看见、听见、感觉到。修辞手段有修饰语（[эпитет]{.ru}）、比喻（[сравнение]{.ru}，用 [как, словно, будто, как будто]{.ru}）、隐喻（[метафора]{.ru}）、拟人（[олицетворение]{.ru}）；未完成体过去时铺陈背景，完成体过去时推进动作。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Что увидел рассказчик утром на окне? Какой звук он услышал на крыльце? Как выглядели берёзы и ели? Что делали дети после обеда? Как проходил зимний вечер в доме?]{.ru}"
        length: 60–90
        model: "Утром рассказчик увидел, что мороз нарисовал на стекле серебряные листья и цветы. На крыльце он услышал, как далеко лает собака и как скрипит снег под ногами. Берёзы стояли в инее, а ели опустили тяжёлые от снега ветки до самой земли. После обеда дети катались на санках с горы, мальчишки строили снежную крепость. Вечером в печи горел огонь, на столе шумел самовар, а бабушка рассказывала о морозах своего детства и вязала внуку тёплые варежки."
        rubric: ["五个问题都回答，细节与课文一致", "动词的体用得对：描写用未完成体，连续动作用完成体", "用完整的句子"]
        notes: 回答时可以保留课文里的形象（[серебряные листья]{.ru}、[скрипит снег]{.ru}），但句子要自己组织。第 4 题 [кататься на санках]{.ru} 坐雪橇。

  - id: e2
    type: choice
    task: 判断下列句子用的是哪种修辞手段。
    why: "有 [как]{.ru}、[словно]{.ru}、[будто]{.ru} 一类比喻词的是比喻（[сравнение]{.ru}）：第 2、5 题。没有比喻词、直接把雪说成“被子”、把雪的光说成“燃烧”的是隐喻（[метафора]{.ru}）：第 4 题。把自然写成会画画、会睡觉的人，是拟人（[олицетворение]{.ru}）：第 1、6 题。第 3 题只是给事物加上形象的形容词，是修饰语（[эпитет]{.ru}）。一个句子可以同时用几种手段，如课文里的 [Ели молчали, как старые сторожа]{.ru}：[молчали]{.ru} 是拟人，[как старые сторожа]{.ru} 是比喻。"
    items:
      - stem: "«Мороз нарисовал на стекле цветы» — это ___."
        options: [эпитет, сравнение, метафора, олицетворение]
        answer: олицетворение
      - stem: "«Дым, прямой, как струна» — это ___."
        options: [эпитет, сравнение, метафора, олицетворение]
        answer: сравнение
      - stem: "«Серебряные листья», «звонкий звук» — это ___."
        options: [эпитет, сравнение, метафора, олицетворение]
        answer: эпитет
      - stem: "«Деревня лежала под белым одеялом» — это ___."
        options: [эпитет, сравнение, метафора, олицетворение]
        answer: метафора
      - stem: "«Снежинки кружатся, словно маленькие бабочки» — это ___."
        options: [эпитет, сравнение, метафора, олицетворение]
        answer: сравнение
      - stem: "«Лес спал глубоким зимним сном» — это ___."
        options: [эпитет, сравнение, метафора, олицетворение]
        answer: олицетворение

  - id: e3
    type: fill
    task: 用括号里动词的适当的体和形式（过去时）填空。
    why: "描写静止的画面、同时存在的状态，用未完成体；一个接一个发生的动作，用完成体。第 1 题“雪覆盖着屋顶”是画面，用 [покрывал]{.ru}。第 2 题“炊烟升起”也是背景，与 [топили печь]{.ru} 同时，用 [поднимался]{.ru}。第 3、4 题是先后发生的两个动作：穿好衣服，走出去，用完成体 [оделся]{.ru}、[вышел]{.ru}。第 5 题“太阳落下”是一次完成的事件，随后雪变了颜色，用 [опустилось]{.ru}，与中性的 [солнце]{.ru} 一致。"
    items:
      - stem: Снег ___ крыши, дороги, деревья.
        hint: покрывать / покрыть
        accept: ["покрывал"]
      - stem: "Над домами ___ синий дым: в каждой избе топили печь."
        hint: подниматься / подняться
        accept: ["поднимался"]
      - stem: Я быстро ___ и вышел на крыльцо.
        hint: одеваться / одеться
        accept: ["оделся"]
      - stem: Я оделся и ___ на крыльцо.
        hint: выходить / выйти
        accept: ["вышел"]
      - stem: В четыре часа солнце ___ за лес, и снег сразу стал синим.
        hint: опускаться / опуститься
        accept: ["опустилось"]

  - id: e4
    type: translate
    task: 翻译下列句子，保留原文的修辞手段。
    items:
      - zh: 孩子们的脸颊红得像苹果。
        accept: ["Щёки детей горели, как яблоки.", "Щёки у детей горели, как яблоки.", "У детей щёки горели, как яблоки.", "Их щёки горели, как яблоки.", "Щёки детей были красные, как яблоки.", "Щёки у детей были красные, как яблоки."]
        rubric: ["比喻用 [как]{.ru}，前面加逗号", "[яблоки]{.ru} 与 [щёки]{.ru} 同为第一格"]
      - zh: 屋里很亮，仿佛有人在窗外点亮了一盏灯。
        accept: ["В комнате было светло, словно кто-то зажёг за окном лампу.", "В комнате было светло, как будто кто-то зажёг за окном лампу.", "В комнате было светло, будто кто-то зажёг за окном лампу.", "В комнате было очень светло, словно кто-то зажёг за окном лампу.", "В комнате было очень светло, как будто кто-то зажёг за окном лампу."]
        rubric: ["无人称句 [было светло]{.ru}", "[словно]{.ru} / [будто]{.ru} / [как будто]{.ru} 引出比喻从句，前面加逗号", "[зажечь]{.ru} 过去时阳性 [зажёг]{.ru}"]
      - zh: 树林沉沉地睡着冬天的觉。
        accept: ["Лес спал глубоким зимним сном."]
        rubric: ["拟人 [лес спал]{.ru}", "[спать глубоким сном]{.ru}：第五格表示方式"]

  - id: e5
    type: open
    task: 应用文：为学校俄语社的刊物写一篇描写短文《我家乡的冬天》（或你最喜欢的季节）。
    items:
      - prompt: 写一天中的一个时刻或一个场景（早晨、街道、公园、节日……），让读者看见颜色、听见声音。至少用两个比喻（一个用 [как]{.ru}，一个用 [словно]{.ru} 或 [будто]{.ru}）、一个拟人、两个修饰语；背景用未完成体过去时或现在时，连续动作用完成体。
        length: 120–160
        model: "В моём родном городе зима совсем не похожа на русскую. Снег у нас бывает редко, и каждый раз это настоящий праздник. Я помню одно утро прошлого января. Я проснулся и увидел, что за окном всё белое, словно город за ночь надел белую одежду. Крыши, машины, деревья стояли в снегу, белые, как сахар. Было тихо: город ещё спал. Только где-то далеко лаяла собака. Я быстро оделся и вышел на улицу. Снег скрипел под ногами, сухой и звонкий, а холодный ветер играл с моим шарфом. В парке старые деревья опустили тяжёлые ветки, будто устали держать снег. Скоро на улицах появились дети. Они смеялись, бегали по снегу, и их красные щёки горели, как огни. К обеду появилось солнце, и снег начал таять. Но этот белый день я помню до сих пор."
        rubric: ["是描写，有具体的场景、颜色和声音", "至少两个比喻（[как]{.ru}；[словно]{.ru} / [будто]{.ru}）、一个拟人、两个修饰语", "体用得对：背景用未完成体，连续动作用完成体", "120–160 词"]
        notes: "范文约 130 词。开头一句交代地点和总的印象，接着写一个具体的早晨。比喻：[словно город за ночь надел белую одежду]{.ru}、[белые, как сахар]{.ru}、[будто устали держать снег]{.ru}、[горели, как огни]{.ru}；拟人：[город ещё спал]{.ru}、[ветер играл с моим шарфом]{.ru}。[стояли в снегу]{.ru}、[было тихо]{.ru} 是背景，用未完成体；[проснулся и увидел]{.ru}、[оделся и вышел]{.ru} 是连续动作，用完成体。结尾回到现在，留下余味。"

  - id: e6
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [достать что из чего]{.ru}：[из сундука]{.ru}，第二格。第 2 题 [приняться]{.ru} + 不定式：[вязать]{.ru}。第 3 题 [на коленях]{.ru}：[колено]{.ru} 复数第六格，复数词干 [колен-]{.ru}，不要写成 [коленах]{.ru}。第 4 题 [сохнуть]{.ru} 过去时复数 [сохли]{.ru}，后缀 [-ну-]{.ru} 在过去时脱落。"
    items:
      - stem: Бабушка достала клубок шерсти из старого ___.
        hint: сундук
        accept: ["сундука"]
      - stem: Она принялась ___ мне варежки.
        hint: вязать
        accept: ["вязать"]
      - stem: Клубок прыгал у неё на ___.
        hint: колени
        accept: ["коленях"]
      - stem: На печи ___ мои валенки.
        hint: сохнуть
        accept: ["сохли"]
