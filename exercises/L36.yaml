lesson: L36
grammar: "[отку́да]{.ru}“从哪里”；[из]{.ru} / [с]{.ru} + 第二格（与 [в]{.ru} / [на]{.ru} + 第六格相对应）；国籍和民族名词 [кита́ец, китая́нка, ру́сский, ру́сская]{.ru} 等。"
exercises:

  - id: e1
    type: fill
    task: 用 [из]{.ru} 或 [с]{.ru} 加括号里名词的正确形式回答 [Отку́да…?]{.ru}
    why: 表示“在哪里”用 [в]{.ru} 的，“从哪里”用 [из]{.ru}；用 [на]{.ru} 的（[на Ку́бе, на да́че, на уро́ке]{.ru}），“从哪里”用 [с]{.ru}。[-ия]{.ru} 结尾的国名第二格是 [-ии]{.ru}，[Каза́нь]{.ru} 是阴性，第二格 [-и]{.ru}。
    items:
      - stem: Я ___.
        hint: Кита́й
        accept: [из Кита́я]
      - stem: Пьер ___.
        hint: Фра́нция
        accept: [из Фра́нции]
      - stem: Хосе́ ___.
        hint: Ку́ба
        accept: [с Ку́бы]
      - stem: Же́нщина ___.
        hint: Каза́нь
        accept: [из Каза́ни]
      - stem: Ю́ми ___.
        hint: Япо́ния
        accept: [из Япо́нии]
      - stem: Ми́ша е́дет ___.
        hint: да́ча
        accept: [с да́чи]
      - stem: Мы идём ___.
        hint: уро́к
        accept: [с уро́ка]
      - stem: Ка́тя идёт ___.
        hint: институ́т
        accept: [из институ́та]
      - stem: Мой знако́мый ___.
        hint: Коре́я
        accept: [из Коре́и]
      - stem: Э́тот па́рень ___.
        hint: Ку́ба
        accept: [с Ку́бы]

  - id: e2
    type: rewrite
    task: 按例句说出这个人是哪国人。
    placeholder: Он / Она́ из … Он / Она́ …
    example:
      cue: Ван Лэй / Кита́й
      answer: Ван Лэй из Кита́я. Он кита́ец.
    why: 国籍名词分男女：[кита́ец / китая́нка]{.ru}，[япо́нец / япо́нка]{.ru}，[францу́з / францу́женка]{.ru}，[ру́сский / ру́сская]{.ru}。国名大写，国籍名词小写。
    items:
      - cue: Ю́ми / Япо́ния
        accept: [Ю́ми из Япо́нии. Она́ япо́нка.]
      - cue: Пьер / Фра́нция
        accept: [Пьер из Фра́нции. Он францу́з.]
      - cue: Ли На / Кита́й
        accept: [Ли На из Кита́я. Она́ китая́нка.]
      - cue: А́нна / Росси́я
        accept: [А́нна из Росси́и. Она́ ру́сская.]
      - cue: Ка́тя / Москва́
        accept: [Ка́тя из Москвы́. Она́ москви́чка.]

  - id: e3
    type: choice
    task: 选择正确的前置词。
    why: 看对应的“在哪里”：[в Москве́ → из Москвы́]{.ru}，[на Ку́бе → с Ку́бы]{.ru}，[на рабо́те → с рабо́ты]{.ru}，[в шко́ле → из шко́лы]{.ru}，[на да́че → с да́чи]{.ru}。容易错的是 [с рабо́ты]{.ru}、[с да́чи]{.ru}，按汉语“从”的意思很容易都用 [из]{.ru}。
    items:
      - stem: Ива́н Серге́евич е́дет ___ рабо́ты.
        options: [из, с]
        answer: с
      - stem: Ми́ша идёт ___ шко́лы.
        options: [из, с]
        answer: из
      - stem: Ба́бушка е́дет ___ да́чи.
        options: [из, с]
        answer: с
      - stem: Мой друг ___ Москвы́.
        options: [из, с]
        answer: из
      - stem: Хосе́ ___ Ку́бы.
        options: [из, с]
        answer: с

  - id: e4
    type: translate
    task: 译成俄语。
    why: “是哪里人”用 [Отку́да…?]{.ru} 问；回答可以说国家（[из]{.ru} + 第二格），也可以说国籍名词。
    items:
      - zh: ——您是哪里人？——我从中国来，我是中国人。
        accept: ["— Отку́да вы? — Я из Кита́я, я кита́ец.", "— Отку́да вы? — Я из Кита́я. Я кита́ец.", "— Отку́да вы? — Я из Кита́я, я китая́нка.", "— Отку́да вы? — Я из Кита́я. Я китая́нка.", "— Отку́да вы? — Я кита́ец, я из Кита́я.", "— Отку́да вы? — Я китая́нка, я из Кита́я."]
        rubric: ["[из Кита́я]{.ru}：[из]{.ru} + 第二格", "国籍名词与说话人性别一致，小写"]
      - zh: 由美是日本人，她从东京来。
        accept: ["Ю́ми япо́нка, она́ из То́кио.", "Ю́ми — япо́нка, она́ из То́кио.", "Ю́ми япо́нка. Она́ из То́кио.", "Ю́ми из То́кио, она́ япо́нка.", "Ю́ми из То́кио. Она́ япо́нка."]
        rubric: ["[япо́нка]{.ru} 用阴性", "[То́кио]{.ru} 不变格"]
      - zh: 我们班全是外国人。
        accept: ["В на́шей гру́ппе все иностра́нцы.", "У нас в гру́ппе все иностра́нцы.", "Все в на́шей гру́ппе иностра́нцы.", "В на́шей гру́ппе то́лько иностра́нцы.", "У нас в гру́ппе то́лько иностра́нцы."]
        rubric: ["[иностра́нцы]{.ru}：[е]{.ru} 脱落"]
      - zh: 她不是莫斯科人，她是喀山人。
        accept: ["Она́ не москви́чка, она́ из Каза́ни.", "Она́ не москви́чка. Она́ из Каза́ни.", "Она́ не москви́чка, а из Каза́ни."]
        rubric: ["[москви́чка]{.ru}", "“喀山人”说成 [из Каза́ни]{.ru}"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你在莫斯科的公园里遇到一位外国留学生（女），你们互相问是哪里人、在哪里学习、班上有多少人、同学从哪些国家来。编一段对话（8 句左右）。
        length: 50–90
        model: |
          — Приве́т! Ты не ру́сская? Отку́да ты?
          — Я из Фра́нции, из Пари́жа. А ты?
          — Я из Кита́я. Я кита́ец. Ты студе́нтка?
          — Да, я студе́нтка Моско́вского университе́та.
          — И я! А ско́лько челове́к в твое́й гру́ппе?
          — Двена́дцать. Все иностра́нцы: япо́нцы, францу́зы, кита́йцы.
          — А в мое́й гру́ппе пятна́дцать челове́к. Хосе́ с Ку́бы, Ю́ми из Япо́нии.
          — Здо́рово! Ру́сский язы́к зна́ют все!
        rubric: ["用 [Отку́да ты?]{.ru} 提问", "至少三次用 [из]{.ru} / [с]{.ru} + 第二格", "国籍名词分男女、小写", "数词后名词形式正确"]
        notes: 对话先问候，再问对方来自哪里、在哪里学习，然后谈班上的人数和同学的国籍，最后一句感叹收尾。[с Ку́бы]{.ru} 用 [с]{.ru}，其余国家、城市用 [из]{.ru}。
