lesson: B3-L57
grammar: "形动词与副动词在描写中的综合运用：形动词说明人或事物（[озеро, освещённое луной]{.ru}），副动词说明动作的方式和时间（[едва касаясь пола]{.ru}）；完成体副动词、过去时形动词表示先发生的动作；副动词的主语必须与句子主语一致。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用上形动词或副动词。
    items:
      - prompt: "[Что происходит на сцене во втором действии «Лебединого озера»? Кто такая Одиллия? Какой была судьба первой постановки балета? Кто и когда основал первую балетную школу в России? Чем прославились Дягилев, Павлова и Нижинский? Почему работа балерины только кажется лёгкой?]{.ru}"
        length: 90–120
        model: "Во втором действии на сцене появляется ночное озеро, освещённое луной, и по сцене, едва касаясь пола, бегут девушки в белых платьях. Одиллия — дочь злого волшебника, похожая на Одетту, но в чёрном платье. Первая постановка, показанная в Москве в 1877 году, успеха не имела; славу балет получил в 1895 году в Мариинском театре. Первую балетную школу основал в 1738 году француз Жан-Батист Ланде, обучавший танцу детей слуг. Дягилев привозил в Париж «Русские сезоны», Павлова, исполнявшая «Умирающего лебедя», объездила весь мир, а Нижинский удивлял всех своими прыжками. Работа балерины тяжела: учатся восемь лет, каждый день повторяют одни и те же движения у станка, танцуют на пуантах и, преодолевая боль, выходят на сцену после травм."
        rubric: ["六个问题都回答，事实与课文一致", "至少两处形动词短语、一处副动词短语，形式正确", "年份准确：1877、1895、1738"]
        notes: "回答时可以直接借用课文里的形动词短语，但要注意它们和名词的一致：[озеро, освещённое луной]{.ru}（中性第一格），[постановка, показанная в Москве]{.ru}（阴性第一格），[Ланде, обучавший танцу детей]{.ru}（阳性第一格）。"

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题被动形动词要与被说明的名词 [озеро]{.ru} 一致：中性单数第一格 [освещённое]{.ru}，不能与旁边的 [луной]{.ru} 或主语混淆。第 2 题“脚尖几乎不沾地”与 [бегут]{.ru} 同时进行，用未完成体副动词 [касаясь]{.ru}；[касается]{.ru} 是变位形式，前面要有主语和连接词，不定式 [касаться]{.ru} 在这里不能用。第 3 题“举起手以后停下”，先发生的动作用完成体副动词 [подняв]{.ru}。第 4 题“教孩子跳舞的朗德”，朗德自己发出动作，用主动形动词，与阳性的 [Ланде]{.ru} 一致：[обучавший]{.ru}；[обучавшая]{.ru} 是阴性，[обучавшие]{.ru} 是复数。第 5 题“被魔法师施了魔法的奥杰塔”，被动，与阴性 [Одетта]{.ru} 一致：[заколдованная]{.ru}；动作发出者用第五格 [злым волшебником]{.ru}。"
    items:
      - stem: Перед зрителями появляется ночное озеро, ___ луной.
        options: [освещённое, освещённая, освещённый]
        answer: освещённое
      - stem: Девушки бегут по сцене, едва ___ пола.
        options: [касаясь, касается, касаться]
        answer: касаясь
      - stem: ___ руки, балерина на мгновение останавливается.
        options: [Подняв, Поднимающая, Поднятые]
        answer: Подняв
      - stem: Школу основал Ланде, ___ танцу детей слуг.
        options: [обучавший, обучавшая, обучавшие]
        answer: обучавший
      - stem: Одетта, ___ злым волшебником, стала лебедем.
        options: [заколдовавшая, заколдованная, заколдовав]
        answer: заколдованная

  - id: e3
    type: rewrite
    task: 把两个句子合并成一句，第一句变成括号里要求的短语。
    example:
      cue: Зрители заполнили зал. Они затихают. (形动词)
      answer: Зрители, заполнившие зал, затихают.
    why: "变形动词短语时，找出两句共同的名词，形动词和它同性、数、格；变副动词短语时，两句的主语必须相同。第 1 题 [Павлова]{.ru} 阴性，过去时主动形动词 [исполнявшая]{.ru}。第 2 题主语都是 [балерина]{.ru}，“先举起手再停下”，用完成体副动词 [подняв]{.ru}。第 3 题 [спектакль]{.ru} 阳性，“被上演”用被动形动词 [показанный]{.ru}，不定人称句的动词 [показали]{.ru} 变成被动形动词时没有动作发出者。第 4 题主语都是 [зрители]{.ru}，同时进行，用未完成体副动词 [следя]{.ru}。"
    items:
      - cue: Анна Павлова исполняла «Умирающего лебедя». Она объездила весь мир. (形动词)
        accept: ["Анна Павлова, исполнявшая «Умирающего лебедя», объездила весь мир."]
      - cue: Балерина подняла руки. Она остановилась. (副动词)
        accept: ["Подняв руки, балерина остановилась.", "Балерина, подняв руки, остановилась."]
      - cue: Спектакль показали в Москве в 1877 году. Он успеха не имел. (形动词)
        accept: ["Спектакль, показанный в Москве в 1877 году, успеха не имел."]
      - cue: Зрители следят за танцем. Они плачут и радуются. (副动词)
        accept: ["Следя за танцем, зрители плачут и радуются.", "Зрители, следя за танцем, плачут и радуются."]

  - id: e4
    type: rewrite
    task: 下面的句子都错用了副动词（副动词和谓语的主语不同）。用 [когда]{.ru} 从句改正。
    example:
      cue: Поднимаясь, перед зрителями появляется озеро.
      answer: Когда поднимается занавес, перед зрителями появляется озеро.
    why: "副动词表示的是句子主语的动作。第 1 题“到巴黎”的是演员，而主语是 [Европа]{.ru}，所以要用从句，把真正的主语 [русские танцовщики]{.ru} 说出来。第 2 题“跳完舞”的是芭蕾舞演员，主语却是 [зрители]{.ru}，同样改成从句。第 3 题“走进剧场”的是我们，主语却是 [музыка]{.ru}。改正时也可以换成两个分句，但本题要求用 [когда]{.ru}。"
    items:
      - cue: Приехав в Париж, Европа узнала о русском балете.
        accept: ["Когда русские танцовщики приехали в Париж, Европа узнала о русском балете.", "Европа узнала о русском балете, когда русские танцовщики приехали в Париж.", "Когда русские артисты приехали в Париж, Европа узнала о русском балете."]
      - cue: Закончив танец, зрители долго аплодировали балерине.
        accept: ["Когда балерина закончила танец, зрители долго аплодировали ей.", "Когда балерина закончила танец, зрители долго ей аплодировали.", "Когда балерина закончила танец, зрители долго аплодировали балерине."]
      - cue: Войдя в зал, музыка уже звучала.
        accept: ["Когда мы вошли в зал, музыка уже звучала.", "Музыка уже звучала, когда мы вошли в зал.", "Когда я вошёл в зал, музыка уже звучала.", "Когда я вошла в зал, музыка уже звучала.", "Когда зрители вошли в зал, музыка уже звучала."]

  - id: e5
    type: translate
    task: 翻译下列句子，用形动词或副动词短语。
    items:
      - zh: 坐满大厅的观众渐渐安静下来。
        accept: ["Зрители, заполнившие зал, затихают.", "Заполнившие зал зрители затихают.", "Зрители, которые заполнили зал, затихают.", "Зрители, заполнившие весь зал, затихают.", "Заполнившие весь зал зрители затихают.", "Зрители, которые заполнили весь зал, затихают.", "Зрители, заполнившие огромный зал, затихают.", "Заполнившие огромный зал зрители затихают.", "Зрители, которые заполнили огромный зал, затихают.", "Зрители, заполнившие зал, постепенно затихают.", "Заполнившие зал зрители постепенно затихают.", "Зрители, которые заполнили зал, постепенно затихают.", "Зрители, заполнившие весь зал, постепенно затихают.", "Заполнившие весь зал зрители постепенно затихают.", "Зрители, которые заполнили весь зал, постепенно затихают.", "Зрители, заполнившие огромный зал, постепенно затихают.", "Заполнившие огромный зал зрители постепенно затихают.", "Зрители, которые заполнили огромный зал, постепенно затихают."]
        rubric: ["[заполнившие зал]{.ru}：过去时主动形动词，与 [зрители]{.ru} 一致", "形动词短语在名词后用逗号隔开"]
      - zh: 观众注视着她的舞蹈，和女主人公一起哭、一起笑。
        accept: ["Следя за её танцем, зрители плачут и радуются вместе с героиней.", "Зрители, следя за её танцем, плачут и радуются вместе с героиней.", "Следя за её танцем, зрители плакали и радовались вместе с героиней.", "Зрители, следя за её танцем, плакали и радовались вместе с героиней."]
        rubric: ["[следя за]{.ru} + 第五格：未完成体副动词，与谓语同时", "[вместе с героиней]{.ru}"]
      - zh: 1895 年在彼得堡上演的芭蕾获得了成功。
        accept: ["Балет, показанный в Петербурге в 1895 году, имел успех.", "Показанный в Петербурге в 1895 году балет имел успех.", "Балет, поставленный в Петербурге в 1895 году, имел успех.", "Поставленный в Петербурге в 1895 году балет имел успех."]
        rubric: ["被动形动词 [показанный]{.ru} 或 [поставленный]{.ru}，与 [балет]{.ru} 一致", "[в 1895 году]{.ru}", "[иметь успех]{.ru}"]

  - id: e7
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [у]{.ru} + 第二格：[у станка]{.ru}，重音移到词尾，[о]{.ru} 脱落。第 2 题 [на]{.ru} + 第六格：[на пуантах]{.ru}，这个词通常用复数。第 3 题 [преодолевать]{.ru} 的未完成体副动词 [преодолевая]{.ru}：[-авать]{.ru} 结尾的动词保留 [-ва-]{.ru}。第 4 题 [вызывать на поклон]{.ru} 是固定说法，[на]{.ru} + 第四格 [поклон]{.ru}。第 5 题 [получать травмы]{.ru}：复数第四格 [травмы]{.ru}。"
    items:
      - stem: Каждый день ученики начинают с упражнений у ___.
        hint: станок
        accept: ["станка"]
      - stem: Балерина танцует на ___.
        hint: пуанты
        accept: ["пуантах"]
      - stem: ___ боль, артисты снова выходят на сцену.
        hint: преодолевать
        accept: ["Преодолевая"]
      - stem: Зрители снова и снова вызывают артистов на ___.
        hint: поклон
        accept: ["поклон"]
      - stem: Многие артисты получают ___.
        hint: травма
        accept: ["травмы"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，说明理由，最后得出结论。
    items:
      - prompt: "[Можно ли понять балет без специальной подготовки?]{.ru} 至少用三处形动词短语和两处副动词短语。"
        length: 180–220
        model: "Многие думают, что балет — искусство для специалистов, понять которое без подготовки невозможно. По-моему, это не так. Конечно, человеку, впервые пришедшему в театр, трудно оценить технику танцовщиков: он не знает, что такое фуэте, и не видит разницы между хорошим и отличным прыжком. Однако главное в балете — не техника, а чувство. Балерина, исполняющая партию Одетты, рассказывает историю, не произнося ни слова. Опуская голову, медленно поднимая руки, похожие на крылья, она показывает и страх, и надежду, и любовь. Эти движения понятны каждому, ведь люди во всём мире выражают чувства одинаково. Кроме того, музыка, написанная Чайковским, сама подсказывает зрителю, что происходит на сцене. Не случайно русские танцовщики, приезжавшие в Париж в начале XX века, покорили публику, не знавшую ни русского языка, ни русской истории. Мне кажется, балет даже ближе к зрителю, чем драматический театр: в нём нет слов, которые нужно переводить. Я сам впервые смотрел «Лебединое озеро» в двенадцать лет и, ничего не зная о балете, в конце едва не плакал. Конечно, знание истории балета помогает увидеть больше. Но для первого шага достаточно просто прийти в театр, сесть в зале и, забыв обо всём, следить за танцем. Поэтому я думаю, что балет — это язык, на котором может говорить каждый, кто умеет чувствовать."
        rubric: ["开头提出常见看法，再表明自己的立场", "有让步（承认技巧需要专业知识）", "理由至少两条，有具体例子", "至少三处形动词短语、两处副动词短语，形式正确", "180–220 词"]
        notes: "范文约 200 词。开头先摆出一种流行的看法，再用 [По-моему, это не так]{.ru} 表明不同意。论证：芭蕾的核心是情感而不是技巧（以奥杰塔的动作为例）；音乐帮助理解；历史证明——不懂俄语的巴黎观众也被征服了；加上个人经历，增强说服力。形动词短语：[впервые пришедшему в театр]{.ru}、[исполняющая партию Одетты]{.ru}、[написанная Чайковским]{.ru}、[приезжавшие в Париж]{.ru}、[не знавшую ни русского языка…]{.ru}（[похожие на крылья]{.ru} 是形容词短语，不是形动词）；副动词短语：[не произнося ни слова]{.ru}、[опуская голову]{.ru}、[поднимая руки]{.ru}、[ничего не зная о балете]{.ru}、[забыв обо всём]{.ru}。"
