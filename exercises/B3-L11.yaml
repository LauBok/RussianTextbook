lesson: B3-L11
grammar: "未完成体副动词：现在时复数第三人称词干 + [-я]{.ru}（[ж, ш, ч, щ]{.ru} 后为 [-а]{.ru}），带 [-ся]{.ru} 的动词加 [-сь]{.ru}；表示与谓语同时进行的动作，主语必须相同。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Почему Байкал называют уникальным озером? Что рассказывает бурятская легенда об Ангаре? Почему Байкал называют «славным морем»? Какие животные живут только на Байкале? Как люди заботятся о Байкале?]{.ru}"
        length: 60–90
        model: "Байкал — самое глубокое озеро на планете: его глубина достигает 1642 метров. В нём находится около двадцати процентов пресной воды, имеющейся на поверхности Земли, и это одно из самых древних озёр мира. По легенде, у старого Байкала была дочь Ангара. Не желая жить без богатыря Енисея, она убежала к нему, и отец бросил ей на дорогу огромный камень. Местные жители называют Байкал «славным морем», потому что он огромный: другого берега не видно, а волны бывают высотой в несколько метров. Только на Байкале живут нерпа и рыба омуль. Учёные изучают состояние воды, а волонтёры убирают мусор на берегах."
        rubric: ["五个问题都回答，数字准确（1642 米、约百分之二十）", "至少用一处未完成体副动词短语", "用完整的句子"]
        notes: "第 1 题至少答出两点：最深、淡水最多、最古老。第 3 题要说出原因：望不见对岸、浪很高。范文约 95 词，第 2 题用了副动词短语 [не желая жить без богатыря Енисея]{.ru}。"

  - id: e2
    type: fill
    task: 用括号里动词的未完成体副动词填空。
    why: "副动词由现在时复数第三人称构成：第 1 题 [гуляют → гуляя]{.ru}。第 2 题带 [-ся]{.ru}：[греются → греясь]{.ru}，[-ся]{.ru} 在元音后变成 [-сь]{.ru}。第 3 题 [уезжают → уезжая]{.ru}。第 4 题 [идут → идя]{.ru}。第 5 题 [держат → держа]{.ru}：[ж]{.ru} 后面写 [-а]{.ru}，不能写 [*держая]{.ru}。第 6 题 [вставать]{.ru} 以 [-авать]{.ru} 结尾，副动词由不定式词干构成，保留 [-ва-]{.ru}：[вставая]{.ru}，不是从 [встают]{.ru} 构成的 [*встая]{.ru}。第 7 题 [заботятся → заботясь]{.ru}。第 8 题 [слышат → слыша]{.ru}，[ш]{.ru} 后写 [-а]{.ru}。"
    items:
      - stem: ___ по берегу, мы собирали красивые камни.
        hint: гулять
        accept: ["Гуляя"]
      - stem: Нерпы лежат на камнях, ___ на солнце.
        hint: греться
        accept: ["греясь"]
      - stem: ___ с Байкала, туристы обещают себе вернуться.
        hint: уезжать
        accept: ["Уезжая"]
      - stem: Лёд такой прозрачный, что, ___ по нему, видишь под ногами глубину.
        hint: идти
        accept: ["идя"]
      - stem: Рыбак стоял в лодке, ___ в руках большого омуля.
        hint: держать
        accept: ["держа"]
      - stem: Каждое утро, ___ рано, мы шли на берег смотреть на озеро.
        hint: вставать
        accept: ["вставая"]
      - stem: ___ о Байкале, волонтёры каждое лето убирают мусор.
        hint: заботиться
        accept: ["Заботясь"]
      - stem: Нерпы, ___ голоса людей, сразу уходят под воду.
        hint: слышать
        accept: ["Слыша"]

  - id: e3
    type: rewrite
    task: 把从句或并列谓语改写成未完成体副动词短语。
    example:
      cue: Когда туристы гуляют по острову, они фотографируют скалы.
      answer: Гуляя по острову, туристы фотографируют скалы.
    why: "改写的条件是两个动作的主语相同。去掉连词和从句的主语，把从句的动词换成副动词，主句的主语保留。时间由主句动词表示，所以第 1、4、5 题从句的过去时在副动词里看不出来，也不需要。第 2 题两个并列谓语，把同时进行的次要动作 [греются]{.ru} 变成副动词。第 3 题 [хотеть]{.ru} 没有副动词（[хотя]{.ru} 已经是连词），要换成同义的 [желать]{.ru}：[не желая]{.ru}。第 5 题 [рассказывать → рассказывая]{.ru}。名词主语要留在主句里，不能随从句一起删掉。"
    items:
      - cue: Когда мы стояли на берегу, мы смотрели на волны.
        accept: ["Стоя на берегу, мы смотрели на волны.", "Мы, стоя на берегу, смотрели на волны.", "Мы смотрели на волны, стоя на берегу."]
      - cue: Нерпы лежат на камнях и греются на солнце.
        accept: ["Нерпы лежат на камнях, греясь на солнце.", "Греясь на солнце, нерпы лежат на камнях.", "Нерпы, греясь на солнце, лежат на камнях."]
      - cue: Ангара не хотела жить без Енисея и убежала к нему.
        accept: ["Не желая жить без Енисея, Ангара убежала к нему.", "Ангара, не желая жить без Енисея, убежала к нему.", "Ангара убежала к Енисею, не желая жить без него."]
      - cue: Когда мы уезжали с Байкала, мы обещали себе вернуться.
        accept: ["Уезжая с Байкала, мы обещали себе вернуться.", "Мы, уезжая с Байкала, обещали себе вернуться.", "Мы обещали себе вернуться, уезжая с Байкала."]
      - cue: Когда старый рыбак рассказывал о Байкале, он показывал нам фотографии.
        accept: ["Рассказывая о Байкале, старый рыбак показывал нам фотографии.", "Старый рыбак, рассказывая о Байкале, показывал нам фотографии.", "Старый рыбак показывал нам фотографии, рассказывая о Байкале."]

  - id: e4
    type: choice
    task: 选择正确的形式或说法。
    why: "第 1 题空位说明谓语 [гуляют]{.ru}，句中已有主语 [туристы]{.ru}，用副动词 [Отдыхая]{.ru}。第 2 题空位修饰名词 [туристы]{.ru}，要用与它一致的形动词复数第一格 [отдыхающие]{.ru}。第 3 题副动词 [гуляя]{.ru} 的主语必须和主句主语一致：散步的是“我们”，只有 [мы увидели Шаманскую скалу]{.ru} 对；[мне понравились скалы]{.ru} 的主语是 [скалы]{.ru}，[скалы казались огромными]{.ru} 的主语也是 [скалы]{.ru}，都不对。第 4 题没有主语的句子里，副动词只能和不定式连用：[трудно поверить]{.ru}；[мне было страшно]{.ru} 里没有不定式，[глубина казалась огромной]{.ru} 的主语是 [глубина]{.ru}，都错。第 5 题空位说明 [шли]{.ru}，用副动词 [глядя]{.ru}。"
    items:
      - stem: ___ в Листвянке, туристы обычно гуляют по берегу.
        options: [Отдыхая, Отдыхающие, Отдыхают]
        answer: Отдыхая
      - stem: Туристы, ___ в Листвянке, обычно гуляют по берегу.
        options: [отдыхая, отдыхающие, отдыхающих]
        answer: отдыхающие
      - stem: Гуляя по острову, ___.
        options: [мне понравились скалы, мы увидели Шаманскую скалу, скалы казались огромными]
        answer: мы увидели Шаманскую скалу
      - stem: Глядя на прозрачный лёд, ___.
        options: [трудно поверить в такую глубину, мне было страшно, глубина казалась огромной]
        answer: трудно поверить в такую глубину
      - stem: Мы медленно шли по льду, ___ под ноги.
        options: [глядя, глядящие, глядели]
        answer: глядя

  - id: e5
    type: translate
    task: 翻译下列句子，用未完成体副动词。
    items:
      - zh: 我们站在岸边，望着贝加尔湖的波浪。
        accept: ["Стоя на берегу, мы смотрели на волны Байкала.", "Мы стояли на берегу, глядя на волны Байкала.", "Стоя на берегу, мы глядели на волны Байкала.", "Мы, стоя на берегу, смотрели на волны Байкала.", "Стоя на берегу, мы смотрим на волны Байкала.", "Мы стояли на берегу, смотря на волны Байкала.", "Стоя на берегу, мы глядим на волны Байкала."]
        rubric: ["[стоя]{.ru}：[стоять]{.ru} 的副动词", "[смотреть на что]{.ru}：[на]{.ru} + 第四格"]
      - zh: 夏天海豹常常躺在石头上晒太阳。
        accept: ["Летом нерпы часто лежат на камнях, греясь на солнце.", "Летом нерпы часто лежат на камнях и греются на солнце."]
        rubric: ["[греясь на солнце]{.ru}：带 [-ся]{.ru} 的副动词词尾 [-ясь]{.ru}", "[лежать на камнях]{.ru}：[на]{.ru} + 第六格复数"]
      - zh: 离开贝加尔湖时，游客们暗下决心一定还要再来。
        accept: ["Уезжая с Байкала, туристы обещают себе вернуться сюда снова.", "Уезжая с Байкала, туристы обещают себе обязательно вернуться.", "Уезжая с Байкала, туристы обещают себе обязательно вернуться сюда.", "Уезжая с Байкала, туристы обещали себе обязательно вернуться.", "Уезжая с Байкала, туристы обещают себе вернуться снова.", "Уезжая с Байкала, туристы обещают себе обязательно вернуться сюда снова.", "Уезжая с Байкала, туристы обещают себе обязательно вернуться снова."]
        rubric: ["[уезжая с Байкала]{.ru}：[с]{.ru} + 第二格表示从哪里离开", "[обещать себе]{.ru} + 不定式"]
      - zh: 游客们不认识路，就问了一位当地居民。
        accept: ["Не зная дороги, туристы спросили местного жителя.", "Туристы, не зная дороги, спросили местного жителя.", "Не зная дорогу, туристы спросили местного жителя.", "Не зная дороги, туристы спросили одного местного жителя."]
        rubric: ["[не зная]{.ru}：否定副动词，[не]{.ru} 分写", "[спросить кого]{.ru}：[местного жителя]{.ru} 第四格（动物名词同第二格）"]

  - id: e6
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段，同时练习把从句、并列谓语改成副动词短语。
    items:
      - prompt: "提纲：湖的位置和数字；流入和流出的河与传说；湖水；动物；奥利洪岛和冬天的贝加尔湖；保护。要求：至少用三处未完成体副动词短语，其中至少一处由课文里的从句或并列谓语改写而来（如课文的 [Отец очень любил дочь и берёг её]{.ru}），再用一处形动词短语。"
        length: 120–150
        model: "Байкал, расположенный в Восточной Сибири, — самое глубокое озеро на планете: его глубина достигает 1642 метров. В нём находится около двадцати процентов пресной воды Земли. В Байкал впадает более трёхсот рек, а вытекает только Ангара. По бурятской легенде, старый Байкал, очень любя дочь Ангару, берёг её, но она, не желая жить без богатыря Енисея, убежала к нему. Вода в озере удивительно чистая: глядя с лодки вниз, можно увидеть камни на глубине до сорока метров. Природа Байкала уникальна. Здесь живёт нерпа — единственный вид тюленей, живущий только в пресной воде. Путешествуя вокруг озера, туристы пробуют омуля и бывают на острове Ольхон, священном для бурят. Зимой озеро покрывается прозрачным льдом. В 1996 году Байкал был включён в список Всемирного наследия ЮНЕСКО. Заботясь о нём, учёные изучают воду, а волонтёры убирают мусор."
        rubric: ["提纲六项都有，数字准确（1642 米、约百分之二十、1996 年）", "至少三处未完成体副动词短语，主语与谓语一致", "至少一处形动词短语，与名词一致", "120–150 词"]
        notes: "范文约 125 词。用了五处副动词短语：[очень любя дочь Ангару]{.ru}、[не желая жить без богатыря Енисея]{.ru}、[глядя с лодки вниз]{.ru}、[путешествуя вокруг озера]{.ru}、[заботясь о нём]{.ru}。第一处由课文的并列谓语 [любил дочь и берёг её]{.ru} 改写而来：两个动作主语相同，把表示原因、背景的 [любил]{.ru} 变成副动词 [любя]{.ru}。形动词短语有 [расположенный в Восточной Сибири]{.ru} 和 [живущий только в пресной воде]{.ru}。缩写时数字、名称保留，描写性的细节（浪高、丝带、滑冰）省去。"
