lesson: B2-L18
heading: 单元测试
intro: 本测试覆盖第二单元全部语法。答对 80% 以上再进入第三单元；没有达到的，名词复数各格的题错得多回看第 10–13 课，形容词和代词的题回看第 14、15 课，[бра́тья, лю́ди, де́ти]{.ru} 和 [челове́к]{.ru} 的题回看第 16、17 课，复习后重做。
grammar: "名词复数第三、五、六格（[-ам / -ям, -ами / -ями, -ах / -ях]{.ru}）；复数第四格（动物同第二格，非动物同第一格）；形容词复数各格；物主代词与指示代词复数各格；不规则复数 [бра́тья, сту́лья, друзья́, сыновья́, лю́ди, де́ти]{.ru}；[челове́к]{.ru} 与数词连用。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里名词的复数形式（第三、五、六格）。
    why: "复数第三、五、六格看复数第一格的词干：硬变化加 [-ам, -ами, -ах]{.ru}，软变化加 [-ям, -ями, -ях]{.ru}。第 1、11 题 [фильм]{.ru} 硬变化：[о фи́льмах, фи́льмами]{.ru}。第 2 题 [пло́щадь]{.ru} 以 [-ь]{.ru} 结尾，用 [-ях]{.ru}，复数重音在词尾：[на площадя́х]{.ru}。第 3 题 [общежи́тие]{.ru} 复数第六格是 [-иях]{.ru}，不能照单数写成 [в общежи́тии]{.ru}。第 4、5、12 题 [ма́ма, де́вушка, колле́га]{.ru} 硬变化，第三格 [-ам]{.ru}；[колле́га]{.ru} 虽可指男人，仍按 [-а]{.ru} 结尾的词变。第 6 题 [по]{.ru} + 复数第三格表示到处走。第 7、8 题 [с]{.ru} + 第五格 [блина́ми, вну́ками]{.ru}。第 9 题 [де́рево]{.ru} 复数是 [дере́вья]{.ru}，第五格 [дере́вьями]{.ru}。第 10 题 [царь]{.ru} 软变化：[о царя́х]{.ru}。第五格最容易漏掉末尾的 [-и]{.ru}，写成第三格。"
    items:
      - stem: Мы с Ди́мой говори́м о ___ и кни́гах.
        hint: фильм
        accept: [фи́льмах]
      - stem: Ма́сленицу пра́зднуют в па́рках и на ___.
        hint: пло́щадь
        accept: [площадя́х]
      - stem: Студе́нты из други́х городо́в живу́т в ___.
        hint: общежи́тие
        accept: [общежи́тиях]
      - stem: Восьмо́го ма́рта мужчи́ны да́рят цветы́ ___ и ба́бушкам.
        hint: ма́ма
        accept: [ма́мам]
      - stem: Ван Лэй написа́л сообще́ния всем ___ из гру́ппы.
        hint: де́вушка
        accept: [де́вушкам]
      - stem: В воскресе́нье Ван Лэй до́лго ходи́л по ___.
        hint: магази́н
        accept: [магази́нам]
      - stem: По́сле катка́ ребя́та пи́ли чай с ___.
        hint: блин
        accept: [блина́ми]
      - stem: На катке́ ба́бушки ката́лись с ___.
        hint: внук
        accept: [вну́ками]
      - stem: Ве́чером над ___ загоре́лись огни́.
        hint: де́рево
        accept: [дере́вьями]
      - stem: Ди́ма мно́го зна́ет о ___.
        hint: царь
        accept: [царя́х]
      - stem: Пьер интересу́ется ___ и кни́гами.
        hint: фильм
        accept: [фи́льмами]
      - stem: Ива́н Серге́евич позвони́л свои́м ___.
        hint: колле́га
        accept: [колле́гам]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "复数第四格：动物名词（人和动物，不分性别）同复数第二格：[актёров, студе́нток, ко́шек, госте́й]{.ru}（第 1、3、4、8 题）；非动物名词同复数第一格：[биле́ты, ку́ртки]{.ru}（第 2、5 题），不要因为前面有动词就改成第二格。第 3 题要特别注意：单数阴性第四格有自己的词尾 [студе́нтку]{.ru}，复数却和第二格一样，[на́ших]{.ru} 也说明是复数。[все]{.ru} 修饰动物名词时第四格是 [всех]{.ru}（第 6 题），修饰非动物名词时是 [все]{.ru}（第 7 题）。"
    items:
      - stem: В фойе́ мы ви́дели ___.
        options: [актёров, актёры, актёрам]
        answer: актёров
      - stem: А́нна давно́ купи́ла ___.
        options: [биле́ты, биле́тов, биле́там]
        answer: биле́ты
      - stem: В теа́тре я ви́дел на́ших ___.
        options: [студе́нток, студе́нтки, студе́нткам]
        answer: студе́нток
      - stem: Ми́ша лю́бит соба́к и ___.
        options: [ко́шек, ко́шки, ко́шкам]
        answer: ко́шек
      - stem: В гардеро́бе они́ сда́ли ___.
        options: [ку́ртки, ку́рток, ку́рткам]
        answer: ку́ртки
      - stem: Ли́за зна́ет почти́ ___ актёров э́того теа́тра.
        options: [всех, все, всем]
        answer: всех
      - stem: Прости́те меня́ за ___ мои́ оши́бки!
        options: [все, всех, всем]
        answer: все
      - stem: Сего́дня ве́чером ма́ма ждёт ___.
        options: [госте́й, го́сти, гостя́м]
        answer: госте́й

  - id: e3
    type: fill
    task: 写出括号里形容词的正确形式。
    why: "形容词复数不分性：第一格 [-ые / -ие]{.ru}，第二、六格 [-ых / -их]{.ru}，第三格 [-ым / -им]{.ru}，第五格 [-ыми / -ими]{.ru}；第四格修饰动物名词同第二格，修饰非动物名词同第一格。第 1 题 [сосе́дей]{.ru} 是动物，用 [но́вых]{.ru}；第 2 题 [коро́бки]{.ru} 是非动物，用 [тяжёлые]{.ru}。第 3 题 [к]{.ru} 后写 [и]{.ru}：[ма́ленькими]{.ru}。第 4、6 题词尾重读：[пожилы́м, плохи́х]{.ru}（[х]{.ru} 后写 [и]{.ru}）。第 5 题 [о]{.ru} + 第六格 [ра́зных]{.ru}。第 7 题 [тако́й]{.ru} 按形容词变，修饰动物名词用 [таки́х]{.ru}。第 8、9 题 [рабо́чий, знако́мый]{.ru} 是形容词式的名词：[с рабо́чими]{.ru}，[уви́дели знако́мых]{.ru}（动物，同第二格）。"
    items:
      - stem: Мари́я Никола́евна пригласи́ла ___ сосе́дей на чай.
        hint: но́вый
        accept: [но́вых]
      - stem: Рабо́чие поднима́ли по ле́стнице ___ коро́бки.
        hint: тяжёлый
        accept: [тяжёлые]
      - stem: На поро́ге стоя́ла же́нщина с ___ до́чками.
        hint: ма́ленький
        accept: [ма́ленькими]
      - stem: Все в до́ме помога́ют ___ сосе́дям.
        hint: пожило́й
        accept: [пожилы́м]
      - stem: За столо́м говори́ли о ___ веща́х.
        hint: ра́зный
        accept: [ра́зных]
      - stem: У нас в до́ме нет ___ сосе́дей.
        hint: плохо́й
        accept: [плохи́х]
      - stem: Я люблю́ ___ сосе́дей.
        hint: тако́й
        accept: [таки́х]
      - stem: Мари́я Никола́евна говори́ла с ___.
        hint: рабо́чие
        accept: [рабо́чими]
      - stem: В теа́тре мы уви́дели на́ших ___.
        hint: знако́мые
        accept: [знако́мых]

  - id: e4
    type: choice
    task: 选择代词的正确形式。
    why: "物主代词、指示代词和名词在格上一致：第 1 题 [учителе́й]{.ru} 是动物名词复数第四格，代词同第二格 [мои́х]{.ru}；第 2 题给谁用第三格 [свои́м]{.ru}（信是由美写给自己的老师的）；第 3 题 [горди́ться]{.ru} 要求第五格 [на́шими]{.ru}；第 4、7 题 [о]{.ru} + 第六格 [э́тих, ва́ших]{.ru}（[о]{.ru} 在 [э́тих]{.ru} 前写成 [об]{.ru}）；第 8 题动物名词第四格 [тех]{.ru}。第 5 题老师是主语“学生们”自己的，用 [свои́х]{.ru}；第 6 题主语是“我”，老师是安娜和迪马的，用不变格的 [их]{.ru}。"
    items:
      - stem: Я ча́сто вспомина́ю ___ пеки́нских учителе́й.
        options: [мои́х, мои́, мои́м]
        answer: мои́х
      - stem: Ю́ми до сих пор пи́шет пи́сьма ___ шко́льным учителя́м.
        options: [свои́м, свои́х, свои́ми]
        answer: свои́м
      - stem: Мы о́чень горди́мся ___ профессора́ми.
        options: [на́шими, на́ших, на́шим]
        answer: на́шими
      - stem: Об ___ профессора́х да́же пи́шут в газе́тах.
        options: [э́тих, э́ти, э́тим]
        answer: э́тих
      - stem: Студе́нты называ́ют ___ преподава́телей по и́мени и о́тчеству.
        options: [свои́х, их, свои́]
        answer: свои́х
      - stem: А́нна и Ди́ма у́чатся на филфа́ке. Я зна́ю ___ преподава́телей.
        options: [их, свои́х, свои́м]
        answer: их
      - stem: Расскажи́те о ___ шко́льных учителя́х.
        options: [ва́ших, ва́шим, ва́ши]
        answer: ва́ших
      - stem: Ты зна́ешь ___ студе́нтов?
        options: [тех, те, тем]
        answer: тех

  - id: e5
    type: fill
    task: 写出括号里名词的正确复数形式。
    why: "[брат, стул]{.ru} 复数是 [бра́тья, сту́лья]{.ru}，词尾不重读，第二格是 [-ьев]{.ru}：[бра́тьев, сту́льев]{.ru}（第 1、6 题）；[сту́лья]{.ru} 是非动物，第四格同第一格（第 2 题）。[друг, сын]{.ru} 复数 [друзья́, сыновья́]{.ru}，第二格重读 [-е́й]{.ru}：[друзе́й]{.ru}（第 9 题），第五格 [друзья́ми]{.ru}（第 4 题），第一格 [сыновья́]{.ru}（第 5 题）。[ребёнок, челове́к]{.ru} 的复数是 [де́ти, лю́ди]{.ru}，第五格 [детьми́, людьми́]{.ru}（第 3、7 题）。[сестра́]{.ru} 的复数第二格是 [сестёр]{.ru}（第 8 题）。[сосе́д]{.ru} 复数按软变化：[о сосе́дях]{.ru}（第 10 题）。"
    items:
      - stem: У Ива́на Серге́евича никогда́ не́ было ___.
        hint: брат
        accept: [бра́тьев]
      - stem: Ван Лэй и Ми́ша взя́ли у сосе́дей ___.
        hint: стул
        accept: [сту́лья]
      - stem: Бра́тья Мари́и Никола́евны бы́ли с жёнами и ___.
        hint: ребёнок
        accept: [детьми́]
      - stem: За́втра мы бу́дем пра́здновать с ___.
        hint: друг
        accept: [друзья́ми]
      - stem: ___ дя́ди Пе́ти о́чень похо́жи на отца́.
        hint: сын
        accept: [Сыновья́]
      - stem: Когда́ все ро́дственники собира́лись вме́сте, ___ никогда́ не хвата́ло.
        hint: стул
        accept: [сту́льев]
      - stem: Я люблю́ рабо́тать с ___.
        hint: челове́к
        accept: [людьми́]
      - stem: У Ван Лэ́я нет ни бра́тьев, ни ___.
        hint: сестра́
        accept: [сестёр]
      - stem: У Ива́на Серге́евича мно́го хоро́ших ___.
        hint: друг
        accept: [друзе́й]
      - stem: За столо́м мы говори́ли о на́ших ___.
        hint: сосе́д
        accept: [сосе́дях]

  - id: e6
    type: choice
    task: 选择正确的形式。
    why: "数词后面用 [челове́к]{.ru}：[три]{.ru} 后用单数第二格 [челове́ка]{.ru}（第 1 题），[пятна́дцать]{.ru} 后用零词尾的 [челове́к]{.ru}（第 2 题），[два́дцать оди́н]{.ru} 看最后的 [оди́н]{.ru}，用单数第一格 [челове́к]{.ru}（第 4 题）。[мно́го]{.ru} 后只能用 [люде́й]{.ru}（第 3 题）。数量主语的动词用单数：过去时中性 [бы́ло]{.ru}（第 5 题），将来时 [бу́дет]{.ru}（第 6 题）。"
    items:
      - stem: Из моего́ отде́ла бу́дет три ___.
        options: [челове́ка, челове́к, люде́й]
        answer: челове́ка
      - stem: Вме́сте с на́ми и ба́бушкой бу́дет пятна́дцать ___.
        options: [челове́к, челове́ка, люде́й]
        answer: челове́к
      - stem: В Москве́ мно́го ___.
        options: [люде́й, челове́к, челове́ка]
        answer: люде́й
      - stem: На катке́ был два́дцать оди́н ___.
        options: [челове́к, челове́ка, люде́й]
        answer: челове́к
      - stem: В гости́ной ___ два́дцать два челове́ка.
        options: [бы́ло, был, была́]
        answer: бы́ло
      - stem: Ве́чером у нас ___ пятна́дцать челове́к.
        options: [бу́дет, бу́дем, бу́дешь]
        answer: бу́дет

  - id: e7
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊和迪马在图书馆、咖啡馆、公园见面；三八节王磊送的是郁金香；滑冰时迪马摔了两跤，王磊一次也没摔；在剧院里迪马和宿舍的朋友们坐在楼座上；新邻居有两个小女儿；伊万等十五个人，来了二十二个人，薇拉把餐具和椅子借给了他们。
    items:
      - stem: Ван Лэй и Ди́ма встреча́ются ___.
        options: ["в библиоте́ках, в кафе́ и в па́рках", "то́лько в университе́те", "то́лько в общежи́тии"]
        answer: "в библиоте́ках, в кафе́ и в па́рках"
      - stem: Восьмо́го ма́рта Ван Лэй пода́рил Мари́и Никола́евне и А́нне ___.
        options: [тюльпа́ны, мимо́зу, шокола́д]
        answer: тюльпа́ны
      - stem: На катке́ ___.
        options: [Ди́ма упа́л два ра́за, Ван Лэй упа́л два ра́за, никто́ не упа́л]
        answer: Ди́ма упа́л два ра́за
      - stem: В теа́тре Ди́ма и его́ друзья́ сиде́ли ___.
        options: [на балко́не, ря́дом с А́нной, ря́дом с О́льгой Ви́кторовной]
        answer: на балко́не
      - stem: У но́вых сосе́дей ___.
        options: [две ма́ленькие до́чки, два ма́леньких сы́на, оди́н сын и одна́ дочь]
        answer: две ма́ленькие до́чки
      - stem: В воскресе́нье ве́чером в гости́ной бы́ло ___.
        options: [два́дцать два челове́ка, пятна́дцать челове́к, двена́дцать челове́к]
        answer: два́дцать два челове́ка

  - id: e8
    type: translate
    task: 译成俄语。
    why: "第 1 题 [о]{.ru} + 复数第六格：[о фи́льмах и кни́гах]{.ru}。第 2 题“给……”用复数第三格，[все]{.ru} 的第三格是 [всем]{.ru}。第 3 题 [сосе́дей]{.ru} 是动物名词，[таки́х сосе́дей]{.ru} 第四格同第二格；用 [нра́виться]{.ru} 时邻居是主语，用第一格。第 4 题“和……一起”用 [с]{.ru} + 第五格：形容词 [молоды́ми]{.ru}，名词 [преподава́телями]{.ru}。第 5 题 [два́дцать два]{.ru} 后用 [челове́ка]{.ru}，动词用中性 [бы́ло]{.ru}。第 6 题 [друг]{.ru} 的复数是 [друзья́]{.ru}，第五格 [друзья́ми]{.ru}；[де́ти]{.ru} 的第五格是 [детьми́]{.ru}，不能写成 [де́тями]{.ru}。"
    items:
      - zh: 我们谈了电影和书。
        accept: ["Мы говори́ли о фи́льмах и кни́гах.", "Мы говори́ли о фи́льмах и о кни́гах."]
        rubric: ["[о]{.ru} + 复数第六格 [о фи́льмах]{.ru}、[(о) кни́гах]{.ru}"]
      - zh: 王磊给班上所有的女同学发了消息。
        accept: ["Ван Лэй написа́л сообще́ния всем де́вушкам из гру́ппы.", "Ван Лэй написа́л всем де́вушкам из гру́ппы.", "Ван Лэй написа́л всем де́вушкам из гру́ппы сообще́ния.", "Ван Лэй отпра́вил сообще́ния всем де́вушкам из гру́ппы.", "Ван Лэй отпра́вил всем де́вушкам из гру́ппы сообще́ния.", "Ван Лэй написа́л сообще́ния всем одногру́ппницам.", "Ван Лэй написа́л всем одногру́ппницам.", "Ван Лэй отпра́вил сообще́ния всем одногру́ппницам.", "Ван Лэй написа́л сообще́ния всем де́вушкам в гру́ппе.", "Ван Лэй написа́л всем де́вушкам в гру́ппе сообще́ния."]
        rubric: ["复数第三格 [всем де́вушкам]{.ru} 或 [всем одногру́ппницам]{.ru}", "[написа́л / отпра́вил]{.ru} 用完成体过去时"]
      - zh: 我喜欢这样的邻居。
        accept: ["Я люблю́ таки́х сосе́дей.", "Мне нра́вятся таки́е сосе́ди."]
        rubric: ["[люби́ть]{.ru} + 第四格 [таки́х сосе́дей]{.ru}（动物，同第二格）", "或 [Мне нра́вятся таки́е сосе́ди]{.ru}，邻居作主语"]
      - zh: 我们和年轻老师们一起踢足球。
