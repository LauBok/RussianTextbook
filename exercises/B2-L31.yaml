lesson: B2-L31
grammar: "不定式与体：[начина́ть, стать, продолжа́ть, конча́ть, переста́ть, уста́ть, привыка́ть, учи́ться]{.ru} 后只用未完成体不定式；[успе́ть]{.ru} 后用完成体；[нельзя́]{.ru} + 未完成体表示禁止，+ 完成体表示做不到；[не на́до]{.ru} + 未完成体。"
exercises:

  - id: e1
    type: choice
    task: 选择不定式的体。
    why: "第 1、2、4 题前面是 [на́чал]{.ru}、[переста́л]{.ru}、[привы́кла]{.ru}，表示开始、停止、习惯，后面只能用未完成体不定式，哪怕这几个动词本身是完成体。第 3 题 [успе́ть]{.ru} 说的是能不能做成，用完成体。第 5 题 [зако́нчили]{.ru} 后面同样只用未完成体。第 6 题“想把这本书读完”，是一次具体的结果，用完成体。"
    items:
      - stem: Ди́ма на́чал ___ «Кали́нку».
        options: [игра́ть, сыгра́ть]
        answer: игра́ть
      - stem: Ван Лэй переста́л ___ на но́ги.
        options: [смотре́ть, посмотре́ть]
        answer: смотре́ть
      - stem: Я не успе́л ___ упражне́ние.
        options: [де́лать, сде́лать]
        answer: сде́лать
      - stem: Ю́ми ещё не привы́кла ___ в па́ре.
        options: [танцева́ть, станцева́ть]
        answer: танцева́ть
      - stem: В во́семь часо́в мы зако́нчили ___ уро́ки.
        options: [де́лать, сде́лать]
        answer: де́лать
      - stem: Я хочу́ ___ э́ту кни́гу до пя́тницы.
        options: [чита́ть, прочита́ть]
        answer: прочита́ть

  - id: e2
    type: choice
    task: 选择 [нельзя́]{.ru} 后面不定式的体。
    why: "[нельзя́]{.ru} + 未完成体表示禁止，[нельзя́]{.ru} + 完成体表示做不到。第 1 题说舞蹈班的规矩，是禁止。第 2 题“钥匙丢了”，门打不开，是做不到。第 3 题“这么多考签”，不可能一个晚上背完，是做不到。第 4 题医生的嘱咐，是禁止。第 5 题说图书馆的规矩，是禁止。"
    items:
      - stem: В о́буви в за́ле ___ нельзя́.
        options: [танцева́ть, станцева́ть]
        answer: танцева́ть
      - stem: Я потеря́л ключ, и тепе́рь дверь нельзя́ ___.
        options: [открыва́ть, откры́ть]
        answer: откры́ть
      - stem: Здесь сто биле́тов, их нельзя́ ___ сего́дня ве́чером.
        options: [учи́ть, вы́учить]
        answer: вы́учить
      - stem: "Врач сказа́л, что Ми́ше нельзя́ ___ моро́женое: у него́ боли́т го́рло."
        options: [есть, съесть]
        answer: есть
      - stem: В библиоте́ке нельзя́ ___ по телефо́ну.
        options: [говори́ть, поговори́ть]
        answer: говори́ть

  - id: e3
    type: fill
    task: 用括号里的动词填空（注意体和形式）。
    why: "第 1 题 [ста́ли]{.ru} 表示开始，后面用未完成体不定式。第 2 题 [танцева́ть]{.ru} 属于 [-ова-/-ева-]{.ru} 变 [-у-]{.ru} 的一类，现在时 [танцу́ю, танцу́ешь]{.ru}（下一课详讲）。第 3 题 [не на́до]{.ru} 后用未完成体。第 4 题 [уста́л]{.ru} 后用未完成体。第 5 题“学会”用 [научи́ться]{.ru} 的完成体将来时，不定式仍是未完成体。"
    items:
      - stem: Все ста́ли ___ быстре́е.
        hint: танцева́ть / станцева́ть
        accept: ["танцева́ть"]
      - stem: Ю́ми хорошо́ ___, а я ещё пло́хо.
        hint: танцева́ть
        accept: ["танцу́ет"]
      - stem: Не на́до ___ на но́ги, смотри́те на партнёршу.
        hint: смотре́ть / посмотре́ть
        accept: ["смотре́ть"]
      - stem: Ван Лэй уста́л ___ уче́бник и пошёл в кафе́.
        hint: чита́ть / прочита́ть
        accept: ["чита́ть"]
      - stem: Я обяза́тельно ___ танцева́ть «Ба́рыню»!
        hint: научи́ться
        accept: ["научу́сь"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1、2 题 [нача́ть]{.ru}、[переста́ть]{.ru} 后用未完成体不定式。第 3 题“不准”是禁止，[нельзя́]{.ru} + 未完成体。第 4 题“不可能一下子学会”是做不到，[нельзя́]{.ru} + 完成体。"
    items:
      - zh: 迪马开始弹吉他了。
        accept: ["Ди́ма на́чал игра́ть на гита́ре.", "Ди́ма стал игра́ть на гита́ре."]
        rubric: ["[на́чал]{.ru} / [стал]{.ru} 后用未完成体 [игра́ть]{.ru}", "弹乐器用 [игра́ть на]{.ru} + 第六格"]
      - zh: 王磊不再看脚了。
        accept: ["Ван Лэй переста́л смотре́ть на но́ги.", "Ван Лэй бо́льше не смо́трит на но́ги."]
        rubric: ["[переста́л]{.ru} 后用未完成体 [смотре́ть]{.ru}", "[на но́ги]{.ru} 用第四格"]
      - zh: 在舞厅里不准吃东西。
        accept: ["В за́ле нельзя́ есть.", "Есть в за́ле нельзя́.", "Нельзя́ есть в за́ле."]
        rubric: ["禁止用 [нельзя́]{.ru} + 未完成体 [есть]{.ru}，不用 [съесть]{.ru}"]
      - zh: 这个舞不可能一下子学会。
        accept: ["Э́тот та́нец нельзя́ вы́учить сра́зу.", "Э́тот та́нец сра́зу нельзя́ вы́учить.", "Нельзя́ вы́учить э́тот та́нец сра́зу.", "Сра́зу э́тот та́нец нельзя́ вы́учить."]
        rubric: ["做不到用 [нельзя́]{.ru} + 完成体 [вы́учить]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ Ю́ми пригласи́ла Ван Лэ́я? Что они́ учи́лись де́лать снача́ла? Почему́ у Ван Лэ́я снача́ла ничего́ не получа́лось? Что де́лал Ди́ма? Что реши́л Ван Лэй?]{.ru}"
        length: 50–80
        model: "В суббо́ту Ю́ми пригласи́ла Ван Лэ́я в сту́дию наро́дного та́нца. Снача́ла они́ учи́лись ходи́ть, как в хорово́де. Пото́м все ста́ли танцева́ть в па́рах. Ван Лэй всё вре́мя смотре́л на но́ги, а когда́ переста́л смотре́ть, наступи́л Ю́ми на но́гу. Ди́ма опозда́л. Ему́ нельзя́ бы́ло танцева́ть, потому́ что у него́ боле́ла нога́, и он игра́л на гита́ре. Ван Лэй реши́л не пропуска́ть заня́тия."
        rubric: ["回答全部五个问题", "[учи́лись ходи́ть]{.ru}、[ста́ли танцева́ть]{.ru}、[переста́л смотре́ть]{.ru} 后用未完成体不定式", "[нельзя́ бы́ло]{.ru}：[нельзя́]{.ru} 的过去时"]
        notes: 范文约 60 词。[нельзя́]{.ru} 本身没有变化，说过去的事加 [бы́ло]{.ru}：[Ему́ нельзя́ бы́ло танцева́ть]{.ru}。

  - id: e6
    type: open
    task: 作文。题目：“我想学会……”。
    items:
      - prompt: 写一样你正在学或想学的本领（跳舞、乐器、游泳、做饭等）：什么时候开始学的、学的时候什么最难、有什么不许做的规矩、什么一下子学不会、你打算怎样继续学。至少用三个“开始、继续、停止、习惯”一类的动词加不定式，至少用一次 [нельзя́]{.ru}。
        length: 100–150
        model: |
          Я давно́ хоте́л научи́ться игра́ть на гита́ре. В про́шлом году́ я на́чал занима́ться в музыка́льной сту́дии. Снача́ла бы́ло о́чень тру́дно: ру́ки бы́стро устава́ли, и у меня́ ничего́ не получа́лось. На пе́рвом заня́тии руководи́тель сказа́л: «Нельзя́ смотре́ть на ру́ки, на́до слу́шать му́зыку». Я до́лго не мог привы́кнуть игра́ть так. Ещё на заня́тиях нельзя́ опа́здывать, а я опа́здывал два ра́за. Че́рез ме́сяц я переста́л смотре́ть на ру́ки и сыгра́л пе́рвую пе́сню. Тепе́рь я уже́ игра́ю не́сколько пе́сен, но хорошо́ игра́ть нельзя́ научи́ться сра́зу. Я бу́ду продолжа́ть занима́ться ка́ждую неде́лю. Когда́ я научу́сь игра́ть лу́чше, я сыгра́ю роди́телям ру́сскую пе́сню. Тепе́рь я уже́ не могу́ жить без гита́ры!
        rubric: ["[нача́ть, продолжа́ть, переста́ть, привы́кнуть]{.ru} 等后用未完成体不定式", "[нельзя́]{.ru} + 未完成体表示禁止，+ 完成体表示做不到，至少用对一种", "叙述有开头、困难、进步和打算"]
        notes: 范文约 105 词：开始学—困难—规矩（[нельзя́ смотре́ть]{.ru}、[нельзя́ опа́здывать]{.ru}，禁止）—进步—打算。[хорошо́ игра́ть нельзя́ научи́ться сра́зу]{.ru} 里的 [нельзя́ научи́ться]{.ru} 是“不可能学会”，完成体；[игра́ть]{.ru} 跟在 [научи́ться]{.ru} 后面，仍用未完成体。
