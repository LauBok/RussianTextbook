lesson: B2-L45
heading: 单元测试
intro: 本测试覆盖第五单元全部语法。答对 80% 以上再进入第六单元；没有达到的，按出错的题回到相应的课复习后重做：运动动词的定向与不定向看第 37、38 课，前缀看第 39—43 课，体看第 39、43 课，转义看第 44 课。
grammar: "定向与不定向运动动词八对（[идти́ / ходи́ть]{.ru}、[е́хать / е́здить]{.ru}、[бежа́ть / бе́гать]{.ru}、[лете́ть / лета́ть]{.ru}、[плыть / пла́вать]{.ru}、[нести́ / носи́ть]{.ru}、[вести́ / води́ть]{.ru}、[везти́ / вози́ть]{.ru}）；前缀 [при-, у-, в-, вы-, под-, от-, до-, пере-, про-, за-, об-, с-, раз-]{.ru}；带前缀运动动词的体，[сходи́ть]{.ru}、[съе́здить]{.ru}；运动动词的转义。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的运动动词。
    why: "定向动词说那一次、朝一个方向：第 2 题迪马此刻正朝我们跑来（[бежи́т]{.ru}），第 6 题王磊坐在飞机上带着礼物（坐交通工具带东西用 [везти́]{.ru}：[вёз]{.ru}），第 7 题斯韦塔那一次领着王磊去他的房间（带人步行用 [вести́]{.ru}：[вела́]{.ru}），第 8 题火车的一次行程（交通工具作主语，火车用 [идти́]{.ru}：[шёл]{.ru}；说成 [е́хал]{.ru} 不规范）。不定向动词说经常、到处、泛指能力：第 1 题 [всегда́]{.ru} 随身带着（[но́сит]{.ru}，步行带东西），第 3 题 [обы́чно]{.ru} 坐火车回家（[е́здит]{.ru}），第 4 题夏天河上来来往往的船（[пла́вают]{.ru}），第 5 题会开车、开了三十年（[во́дит маши́ну]{.ru}），第 9 题 [ка́ждое ле́то]{.ru} 在河里游泳（[пла́вал]{.ru}）。"
    items:
      - stem: Ди́ма всегда́ ___ с собо́й гита́ру.
        options: [но́сит, несёт, во́зит]
        answer: но́сит
      - stem: Смотри́, вот Ди́ма! Он ___ к нам по за́лу.
        options: [бежи́т, бе́гает, бе́гал]
        answer: бежи́т
      - stem: Обы́чно Ди́ма ___ домо́й на по́езде.
        options: [е́здит, е́дет, идёт]
        answer: е́здит
      - stem: Ле́том по Во́лге ___ больши́е теплохо́ды.
        options: [пла́вают, е́здят, бе́гают]
        answer: пла́вают
      - stem: Андре́й Петро́вич ___ маши́ну уже́ три́дцать лет.
        options: [во́дит, ведёт, во́зит]
        answer: во́дит
      - stem: Ван Лэй сиде́л в самолёте и ___ пода́рки в Каза́нь.
        options: [вёз, нёс, вёл]
        answer: вёз
      - stem: Све́та ___ Ван Лэ́я в его́ ко́мнату.
        options: [вела́, везла́, несла́]
        answer: вела́
      - stem: По́езд ___ во Влади́мир всю ночь.
        options: [шёл, е́хал, ходи́л]
        answer: шёл
      - stem: В де́тстве Ди́ма ка́ждое ле́то ___ в Во́лге.
        options: [пла́вал, плыл, лета́л]
        answer: пла́вал

  - id: e2
    type: choice
    task: 选择带前缀的正确动词。
    why: "第 1 题“爸爸不在家”，说明他离开了，用 [у-]{.ru}：[уе́хал]{.ru}。第 2 题 [к нам]{.ru} 表示来到这里，用 [при-]{.ru}：[пришла́]{.ru}。第 3 题“里面很安静”，说明他们进去了，用 [в-]{.ru}：[вошли́]{.ru}。第 4 题“马上回来”，用 [вы́шел]{.ru}“出去一下”；[ушёл]{.ru} 是走了、不在这儿了。第 5 题 [к воде́]{.ru} 走到跟前用 [под-]{.ru}，第 6 题 [от него́]{.ru} 走开几步用 [от-]{.ru}，第 7 题 [до вокза́ла]{.ru} 一直走到终点用 [до-]{.ru}：三个前缀各配一个前置词，[подойти́ к]{.ru}、[отойти́ от]{.ru}、[дойти́ до]{.ru}。第 8 题从河这边到那边，用 [пере-]{.ru}：[перешли́ че́рез Каза́нку]{.ru}。第 9 题 [ми́мо]{.ru} + 第二格表示从旁边经过，用 [про-]{.ru}：[проплыва́л]{.ru}。第 10 题顺路进去一会儿，用 [за-]{.ru}：[зашли́ в кафе́]{.ru}。第 11 题“去接人”是 [зае́хать за]{.ru} + 第五格。第 12 题绕过水洼用 [об-]{.ru}：[обойди́]{.ru}；[перейди́]{.ru} 是蹚过去，正是迪马劝王磊别做的。第 13 题 [с по́езда]{.ru}：从车上下来用 [сойти́ с]{.ru}；[вы́йти]{.ru} 要和 [из]{.ru} 连用（[вы́йти из по́езда]{.ru}），所以这里不能选。第 14 题两人朝不同方向走开，用 [раз- … -ся]{.ru}：[разошли́сь]{.ru}。"
    items:
      - stem: "Па́пы нет до́ма: он ___ на да́чу."
        options: [уе́хал, прие́хал, подъе́хал]
        answer: уе́хал
      - stem: Ба́бушка ___ к нам с кули́чем и я́йцами.
        options: [пришла́, ушла́, вы́шла]
        answer: пришла́
      - stem: Друзья́ ___ в мече́ть. Внутри́ бы́ло ти́хо и светло́.
        options: [вошли́, вы́шли, отошли́]
        answer: вошли́
      - stem: — Мо́жно Ди́му? — Он ___ из ко́мнаты, сейча́с вернётся.
        options: [вы́шел, ушёл, пришёл]
        answer: вы́шел
      - stem: Ван Лэй ___ к воде́ и посмотре́л на во́лны.
        options: [подошёл, отошёл, дошёл]
        answer: подошёл
      - stem: Рыба́к сказа́л, что они́ шумя́т, и друзья́ ___ от него́.
        options: [отошли́, подошли́, дошли́]
        answer: отошли́
      - stem: Друзья́ ___ до речно́го вокза́ла и купи́ли биле́ты.
        options: [дошли́, подошли́, отошли́]
        answer: дошли́

      - stem: Друзья́ ___ че́рез Каза́нку по но́вому мосту́.
        options: [перешли́, зашли́, обошли́]
        answer: перешли́
      - stem: Теплохо́д ме́дленно ___ ми́мо ма́леньких дереве́нь.
        options: [проплыва́л, переплыва́л, подходи́л]
        answer: проплыва́л
      - stem: По доро́ге домо́й мы ___ в кафе́ на полчаса́.
        options: [зашли́, перешли́, обошли́]
        answer: зашли́
      - stem: По доро́ге с рабо́ты Андре́й Петро́вич ___ за ни́ми на маши́не.
        options: [зае́хал, прое́хал, объе́хал]
        answer: зае́хал
      - stem: Здесь больша́я лу́жа. Лу́чше ___ её, а то бу́дешь мо́крый!
        options: [обойди́, перейди́, зайди́]
        answer: обойди́
      - stem: Ра́но у́тром друзья́ ___ с по́езда во Влади́мире.
        options: [сошли́, вы́шли, разошли́сь]
        answer: сошли́
      - stem: "В Су́здале друзья́ ___: оди́н пошёл в Кремль, а друго́й — смотре́ть деревя́нные дома́."
        options: [разошли́сь, сошли́, обошли́]
        answer: разошли́сь

  - id: e3
    type: choice
    task: 选择正确的体和时。
    why: "带前缀的运动动词只剩下体的区别。第 1 题 [ча́сто]{.ru} 说经常，用未完成体 [прихо́дит]{.ru}。第 2 题奶奶来了、现在还在厨房，是结果，用完成体 [пришла́]{.ru}。第 3 题迪马来过又走了，来去抵消，用未完成体过去时 [приходи́л]{.ru}。第 4 题“别迟到”说的是明天，时刻表用未完成体现在时 [отхо́дит]{.ru}。第 5 题游客往里走和我们往外走同时进行，用未完成体 [входи́ли]{.ru}。第 6 题将来去一趟又回来，用完成体 [съе́здим]{.ru}；[е́здим]{.ru} 说的是经常去。第 7 题 [всегда́]{.ru} 说每次都这样，用未完成体 [приезжа́ешь]{.ru}。"
    items:
      - stem: Ба́бушка ча́сто ___ к нам по воскресе́ньям.
        options: [прихо́дит, придёт, пришла́]
        answer: прихо́дит
      - stem: Ба́бушка уже́ ___ и сиди́т на ку́хне.
        options: [пришла́, приходи́ла, прихо́дит]
        answer: пришла́
      - stem: — Кто к тебе́ ___ вчера́? — Ди́ма. Он был у меня́ час и ушёл.
        options: [приходи́л, пришёл, придёт]
        answer: приходи́л
      - stem: Теплохо́д ___ за́втра в де́вять утра́, не опозда́й!
        options: [отхо́дит, отходи́л, отошёл]
        answer: отхо́дит
      - stem: Тури́сты ___ в Кремль, а мы в э́то вре́мя выходи́ли.
        options: [входи́ли, вошли́, войду́т]
        answer: входи́ли
      - stem: За́втра мы ___ в Су́здаль, а ве́чером вернёмся.
        options: [съе́здим, е́здим, е́здили]
        answer: съе́здим
      - stem: Ты всегда́ ___ на три дня и сра́зу уезжа́ешь!
        options: [приезжа́ешь, прие́дешь, прие́хал]
        answer: приезжа́ешь

  - id: e4
    type: fill
    task: 写出括号里动词的正确形式。
    why: "第 1 题 [нести́]{.ru} 过去时阳性没有 [-л]{.ru}，[е]{.ru} 变 [ё]{.ru}：[нёс]{.ru}。第 2 题 [вести́]{.ru} 过去时去掉 [д]{.ru}：[вела́]{.ru}。第 3 题 [бежа́ть]{.ru} 的 [я]{.ru} 形式用 [бег-]{.ru}：[бегу́]{.ru}。第 4 题 [прийти́]{.ru} 将来时不写 [й]{.ru}：[приду́]{.ru}。第 5 题 [вы́йти]{.ru} 重音在 [вы́-]{.ru}，过去时同 [идти́]{.ru}：[вы́шли]{.ru}。第 6 题 [привезти́]{.ru} 过去时阳性 [привёз]{.ru}。第 7 题 [е́здить]{.ru} 第二人称 [е́здишь]{.ru}，只有第一人称是 [е́зжу]{.ru}。第 8 题 [плыть]{.ru} 现在时词干是 [плыв-]{.ru}：[плывём]{.ru}。"
    items:
      - stem: Ди́ма ___ торт о́чень осторо́жно. (过去时)
        hint: нести́
        accept: ["нёс"]
      - stem: Све́та ___ Ван Лэ́я в его́ ко́мнату. (过去时)
        hint: вести́
        accept: ["вела́"]
      - stem: — Ди́ма, ты где? — Я уже́ ___! (现在时)
        hint: бежа́ть
        accept: ["бегу́"]
      - stem: Обеща́ю, я ___ к теплохо́ду ра́ньше тебя́! (将来时)
        hint: прийти́
        accept: ["приду́"]
      - stem: Друзья́ ___ из до́ма в де́вять часо́в. (过去时)
        hint: вы́йти
        accept: ["вы́шли"]
      - stem: Ве́чером па́па ___ с да́чи пе́рвые цветы́. (过去时)
        hint: привезти́
        accept: ["привёз"]
      - stem: Ты ча́сто ___ в Каза́нь? (现在时)
        hint: е́здить
        accept: ["е́здишь"]
      - stem: Сейча́с мы ___ на теплохо́де в Свия́жск. (现在时)
        hint: плыть
        accept: ["плывём"]

  - id: e5
    type: choice
    task: 运动动词的转义：选择正确的形式。
    why: "转义用法一般用定向动词，不能换成不定向动词。第 1 题时间流逝用 [идёт]{.ru}。第 2 题“下起来”是开始，用 [пошёл]{.ru}；第 3 题“雨停了”用 [прошёл]{.ru}。第 4 题电视在播电影，过去时 [шёл]{.ru}。第 5 题季节来临用 [пришла́]{.ru}。第 6 题事情的进展用 [иду́т]{.ru}，和复数 [дела́]{.ru} 一致。"
    items:
      - stem: Я в Москве́ уже́ во́семь ме́сяцев. Как бы́стро ___ вре́мя!
        options: [идёт, хо́дит, е́дет]
        answer: идёт
      - stem: Мы вы́шли из кафе́, и вдруг ___ снег.
        options: [пошёл, прошёл, пришёл]
        answer: пошёл
      - stem: Дождь ___, и мы сно́ва пошли́ гуля́ть.
        options: [прошёл, пошёл, шёл]
        answer: прошёл
      - stem: Вчера́ ве́чером по телеви́зору ___ ста́рый фильм о войне́.
        options: [шёл, ходи́л, е́хал]
        answer: шёл
      - stem: Неда́вно была́ зима́, а тепе́рь ___ весна́.
        options: [пришла́, прошла́, пошла́]
        answer: пришла́
      - stem: Как ___ дела́ с кита́йским?
        options: [иду́т, хо́дят, е́дут]
        answer: иду́т

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：迪马在机场又迟到了，背着包、拿着吉他跑；娜塔莉娅·伊戈列夫娜用面包和盐迎接王磊；复活节奶奶带来了甜面包和红彩蛋，花是爸爸从别墅带回来的；去斯维亚日斯克坐的是船；离开喀山坐的是火车，在弗拉基米尔下车；在苏兹达尔两人三点在市场会合；胜利日回家路上下起了雨。
    items:
      - stem: В аэропорту́ Ди́ма ___.
        options: [опа́здывал, ждал Ван Лэ́я, покупа́л биле́ты]
        answer: опа́здывал
      - stem: Ната́лья И́горевна встре́тила Ван Лэ́я ___.
        options: [хле́бом и со́лью, то́ртом, цвета́ми]
        answer: хле́бом и со́лью
      - stem: На Па́сху ба́бушка принесла́ ___.
        options: [кули́ч и кра́сные я́йца, пе́рвые цветы́, торт из Москвы́]
        answer: кули́ч и кра́сные я́йца
      - stem: В Свия́жск друзья́ ___.
        options: [поплы́ли на теплохо́де, пое́хали на авто́бусе, пошли́ пешко́м]
        answer: поплы́ли на теплохо́де
      - stem: Из Каза́ни во Влади́мир друзья́ е́хали ___.
        options: [на по́езде, на самолёте, на маши́не]
        answer: на по́езде
      - stem: В Су́здале друзья́ встре́тились ___.
        options: [на ры́нке, на вокза́ле, у Золоты́х воро́т]
        answer: на ры́нке
      - stem: Девя́того ма́я по доро́ге домо́й ___.
        options: [пошёл дождь, пошёл снег, начался́ салю́т]
        answer: пошёл дождь

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题“每次都带”是反复的往返，坐车带东西用不定向动词 [во́зит]{.ru}，也可以用带前缀的未完成体 [приво́зит]{.ru}。第 2 题“不在家”是离开的结果，用 [уе́хал]{.ru}，不用 [пое́хал]{.ru}。第 3 题将来去一趟又回来，用完成体 [съе́здим]{.ru}。第 4 题顺路进去用 [зайти́]{.ru}，[в кафе́]{.ru} 用第四格。第 5 题从旁边驶过用 [проплы́ть / проплыва́ть ми́мо]{.ru} + 第二格。第 6 题“下了一整天雨”用定向动词 [шёл дождь]{.ru}。
    items:
      - zh: 迪马每次回家都带礼物。
        accept: ["Ди́ма ка́ждый раз во́зит домо́й пода́рки.", "Ди́ма ка́ждый раз во́зит пода́рки домо́й.", "Ка́ждый раз Ди́ма во́зит домо́й пода́рки.", "Ди́ма ка́ждый раз приво́зит домо́й пода́рки.", "Ди́ма ка́ждый раз приво́зит пода́рки домо́й.", "Ка́ждый раз Ди́ма приво́зит домо́й пода́рки.", "Когда́ Ди́ма е́дет домо́й, он всегда́ везёт пода́рки.", "Когда́ Ди́ма е́здит домо́й, он всегда́ во́зит пода́рки."]
        rubric: ["坐车、坐飞机带东西用 [вози́ть / везти́]{.ru}（或 [привози́ть]{.ru}），不用 [носи́ть]{.ru}", "“每次”是反复，用未完成体"]
      - zh: 爸爸不在家，他去别墅了。
        accept: ["Па́пы нет до́ма, он уе́хал на да́чу.", "Па́пы до́ма нет, он уе́хал на да́чу.", "Па́па не до́ма, он уе́хал на да́чу."]
        rubric: ["[Па́пы нет до́ма]{.ru}：否定存在用第二格", "[уе́хал на да́чу]{.ru}：[у-]{.ru} 表示离开、人不在这儿"]
      - zh: 咱们明天去一趟苏兹达尔吧。
        accept: ["За́втра съе́здим в Су́здаль!", "Съе́здим за́втра в Су́здаль!", "Съе́здим в Су́здаль за́втра!", "Дава́й за́втра съе́здим в Су́здаль.", "Дава́й съе́здим за́втра в Су́здаль.", "За́втра дава́й съе́здим в Су́здаль.", "Дава́йте за́втра съе́здим в Су́здаль.", "Дава́йте съе́здим за́втра в Су́здаль.", "Дава́й съе́здим в Су́здаль за́втра.", "Дава́йте съе́здим в Су́здаль за́втра."]
        rubric: ["提议用完成体 [мы]{.ru} 的将来时，像 [Пойдём!]{.ru} 一样", "“去一趟”用 [съе́здить]{.ru}，坐车去"]
      - zh: 回家路上我们顺路去了一趟咖啡馆。
        accept: ["По доро́ге домо́й мы зашли́ в кафе́.", "Мы зашли́ в кафе́ по доро́ге домо́й.", "По доро́ге домо́й мы зае́хали в кафе́.", "Мы зае́хали в кафе́ по доро́ге домо́й."]
        rubric: ["“顺路去”用 [зайти́]{.ru}（坐车用 [зае́хать]{.ru}）", "[в кафе́]{.ru}：[в]{.ru} + 第四格", "[по доро́ге домо́й]{.ru}"]
      - zh: 轮船从小岛旁边驶过。
        accept: ["Теплохо́д проплы́л ми́мо о́строва.", "Теплохо́д проплыва́л ми́мо о́строва.", "Теплохо́д проплы́л ми́мо острово́в.", "Теплохо́д проплыва́л ми́мо острово́в.", "Ми́мо о́строва проплы́л теплохо́д.", "Ми́мо острово́в проплыва́л теплохо́д."]
        rubric: ["[проплы́ть / проплыва́ть]{.ru}：船经过用 [про-]{.ru} + [плыть]{.ru}", "[ми́мо]{.ru} + 第二格"]
      - zh: 下了一整天雨。
        accept: ["Весь день шёл дождь.", "Дождь шёл весь день."]
        rubric: ["下雨用定向动词 [идти́]{.ru}，过去时 [шёл]{.ru}", "[весь день]{.ru} 用第四格，表示持续"]

  - id: e8
    type: open
    task: 缩写。
    items:
      - prompt: "按下面的问题，用第三人称把课文缩写成一段话：[Куда́ и как Ван Лэй и Ди́ма е́хали пе́рвого ма́я? Как их встре́тили в Каза́ни? Что они́ ви́дели в Каза́ни? Как они́ возвраща́лись в Москву́? Как Ван Лэй провёл День Побе́ды?]{.ru}"
        length: 70–100
        model: "Пе́рвого ма́я Ван Лэй и Ди́ма лете́ли на самолёте в Каза́нь. Там их встреча́л Андре́й Петро́вич, а до́ма Ната́лья И́горевна встре́тила Ван Лэ́я хле́бом и со́лью. Друзья́ ходи́ли в Кремль, дошли́ пешко́м до Во́лги, а пото́м поплы́ли на теплохо́де в Свия́жск. Шесто́го ма́я они́ уе́хали из Каза́ни. По доро́ге в Москву́ они́ сошли́ с по́езда во Влади́мире и съе́здили в Су́здаль. Девя́того ма́я Ван Лэй с Петро́выми е́здил к Ве́чному огню́, а ве́чером смотре́л салю́т. Он ду́мал, что вре́мя идёт о́чень бы́стро."
        rubric: ["回答全部五个问题，按时间顺序", "至少用四个带不同前缀的运动动词（如 [дошли́, поплы́ли, уе́хали, сошли́, съе́здили]{.ru}）", "去了又回来用不定向过去时（[ходи́ли, е́здил]{.ru}）", "至少一处转义（[вре́мя идёт]{.ru}）", "第三人称，过去时"]
        notes: 范文约 80 词，一个问题一到两句。去克里姆林、去长明火都是去了又回来，用不定向动词 [ходи́ли]{.ru}、[е́здил]{.ru}；[дошли́ до]{.ru} 强调走到了终点，[поплы́ли]{.ru} 是“乘船出发”，[сошли́ с по́езда]{.ru} 和 [съе́здили]{.ru} 说回程中的两个完成的动作。最后一句用间接引语转述王磊的想法，[вре́мя идёт]{.ru} 是转义用法。

  - id: e9
    type: open
    task: 作文：《一次旅行》。
    items:
      - prompt: 写你自己的一次旅行：去了哪儿，怎么去的，到了以后走了哪些地方，怎么回来的。尽量多用带前缀的运动动词（[прие́хать, вы́йти, дойти́, перейти́, зайти́, обойти́, съе́здить]{.ru} 等），注意体的用法。
        length: 100–150
        model: "Про́шлым ле́том мы с бра́том е́здили в Петербу́рг. Мы е́хали туда́ на ночно́м по́езде.\n\nРа́но у́тром мы сошли́ с по́езда и сра́зу пошли́ к реке́. Снача́ла мы дошли́ до ста́рого моста́, пото́м перешли́ че́рез него́ и до́лго гуля́ли по на́бережной. По доро́ге мы зашли́ в ма́ленькое кафе́ и вы́пили ко́фе. Днём мы се́ли на теплохо́д. Он ме́дленно проплыва́л ми́мо краси́вых ста́рых домо́в, а мы смотре́ли и фотографи́ровали.\n\nНа сле́дующий день мы обошли́ весь центр и подняли́сь на колоко́льню. Отту́да был ви́ден весь го́род. А ве́чером мы ещё съе́здили к мо́рю.\n\nДомо́й мы уе́хали в воскресе́нье. Когда́ мы прие́хали, шёл дождь. Как бы́стро прошли́ э́ти три дня!"
        rubric: ["写清去哪儿、怎么去、到了以后去了哪些地方、怎么回来", "至少用五个带不同前缀的运动动词，前置词搭配正确（[дойти́ до]{.ru}、[зайти́ в]{.ru}、[перейти́ че́рез]{.ru}、[вы́йти из]{.ru}）", "一次完成的动作用完成体，去了又回来用不定向动词过去时", "100–150 词，分段"]
        notes: 范文第一段交代去哪儿、怎么去，用 [е́здили]{.ru} 说去过又回来了；第二段按路线写，[сошли́ с — пошли́ к — дошли́ до — перешли́ че́рез — зашли́ в]{.ru} 每个前缀配对应的前置词；[теплохо́д проплыва́л ми́мо]{.ru} 用未完成体描写过程。第三段 [обошли́ весь центр]{.ru} 是“走遍”，[съе́здили к мо́рю]{.ru} 是“去了一趟又回来”。结尾 [Как бы́стро прошли́ э́ти три дня!]{.ru} 用 [пройти́]{.ru} 的转义。

  - id: e10
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊。回到莫斯科以后，迪马的奶奶写信请你夏天再来喀山。给她回一封信：谢谢她的款待和路上带的馅饼，讲讲你们回程中在弗拉基米尔和苏兹达尔做了什么，说说你夏天能不能来。
        length: 80–120
        model: "Дорога́я ба́бушка!\n\nБольшо́е спаси́бо за письмо́ и за пирожки́ в доро́гу! Мы е́ли их в по́езде, они́ бы́ли о́чень вку́сные!\n\nРа́но у́тром мы сошли́ с по́езда во Влади́мире и снача́ла пошли́ к Золоты́м воро́там. Пото́м мы съе́здили в Су́здаль. Там я обошёл весь Кремль, а Ди́ма купи́л на ры́нке огурцы́ для Мари́и Никола́евны. Ве́чером мы прие́хали в Москву́.\n\nСпаси́бо за приглаше́ние! Ле́том я, наве́рное, уже́ уе́ду в Пеки́н, но я о́чень хочу́ ещё раз прие́хать в Каза́нь.\n\nПереда́йте приве́т Андре́ю Петро́вичу, Ната́лье И́горевне и Све́те.\n\nС уваже́нием,\nВан Лэй"
        rubric: ["有称呼和落款，对长辈用 [вы]{.ru}", "感谢款待和路上的馅饼", "讲回程见闻，至少用三个带前缀的运动动词（[сошли́, съе́здили, обошёл, прие́хали]{.ru} 等）", "回答邀请，态度礼貌", "向迪马的家人问好"]
        notes: 迪马的奶奶在信里没有写名字和父称，课文里也没有给出，所以称呼直接写 [Дорога́я ба́бушка!]{.ru}，正文仍然用 [вы]{.ru} 表示尊敬。范文分四段：感谢—回程—回答邀请—问好。回程部分按时间顺序用 [сошли́ с, пошли́ к, съе́здили в, обошёл, прие́хали в]{.ru}，前缀和前置词一一对应。暂时不能答应的邀请先道谢，再说明原因，最后表示愿望（[о́чень хочу́ ещё раз прие́хать]{.ru}）。
