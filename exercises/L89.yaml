lesson: L89
grammar: "间接疑问句：转述一般疑问句用语气词 [ли]{.ru}，被问的词放在从句开头，[ли]{.ru} 紧跟其后；不能用 [е́сли]{.ru} 或 [что]{.ru} 代替；人称变、时不变。"
exercises:

  - id: e1
    type: rewrite
    task: 把直接问句改成带 [ли]{.ru} 的间接疑问句。
    example:
      cue: "О́льга Ви́кторовна спроси́ла меня́: «Вы здоро́вы?»"
      answer: О́льга Ви́кторовна спроси́ла, здоро́в ли я.
    why: 被问的词（通常是动词或谓语）放在从句开头，后面紧跟 [ли]{.ru}，再接其余部分。人称按转述者改：[вы → я]{.ru}，[у вас → у меня́]{.ru}；时保持不变。不加 [что]{.ru}，句末用句号。
    items:
      - cue: "О́льга Ви́кторовна спроси́ла меня́: «Вы де́лали упражне́ния?»"
        accept: ["О́льга Ви́кторовна спроси́ла, де́лал ли я упражне́ния.", "О́льга Ви́кторовна спроси́ла меня́, де́лал ли я упражне́ния.", "О́льга Ви́кторовна спроси́ла, де́лала ли я упражне́ния.", "О́льга Ви́кторовна спроси́ла меня́, де́лала ли я упражне́ния."]
      - cue: "О́льга Ви́кторовна спроси́ла меня́: «У вас есть спра́вка?»"
        accept: ["О́льга Ви́кторовна спроси́ла, есть ли у меня́ спра́вка.", "О́льга Ви́кторовна спроси́ла меня́, есть ли у меня́ спра́вка."]
      - cue: "Учи́тельница спроси́ла Ми́шу: «Ты гото́в к контро́льной?»"
        accept: ["Учи́тельница спроси́ла Ми́шу, гото́в ли он к контро́льной.", "Учи́тельница спроси́ла, гото́в ли Ми́ша к контро́льной."]
      - cue: "Ка́тя спроси́ла А́нну: «Ты пойдёшь на конце́рт?»"
        accept: ["Ка́тя спроси́ла А́нну, пойдёт ли она́ на конце́рт.", "Ка́тя спроси́ла, пойдёт ли А́нна на конце́рт."]
      - cue: "О́льга Ви́кторовна спроси́ла Ю́ми: «Вы звони́ли Ван Лэ́ю?»"
        accept: ["О́льга Ви́кторовна спроси́ла Ю́ми, звони́ла ли она́ Ван Лэ́ю.", "О́льга Ви́кторовна спроси́ла, звони́ла ли Ю́ми Ван Лэ́ю."]

  - id: e2
    type: choice
    task: 选择正确的连接词。
    why: "转述陈述句用 [что]{.ru}，转述特殊疑问句保留疑问词，转述一般疑问句用 [ли]{.ru}。第 1、5 题原话是陈述句（“我准备好了”“我的医生很好”），用 [что]{.ru}；第 2 题原话是一般疑问句“您好了吗”，第 4 题原话是一般疑问句“你想去听音乐会吗”，都用 [ли]{.ru}，不能用 [е́сли]{.ru}；第 3 题原话问“在哪儿”，用 [где]{.ru}。"
    items:
      - stem: Ми́ша сказа́л, ___ он гото́в.
        options: [что, ли, е́сли]
        answer: что
      - stem: Она́ спроси́ла, здоро́в ___ я.
        options: [что, ли, е́сли]
        answer: ли
      - stem: Она́ спроси́ла, ___ ты живёшь.
        options: [где, ли, что]
        answer: где
      - stem: Ка́тя спроси́ла, хо́чет ___ А́нна пойти́ на конце́рт.
        options: [что, ли, е́сли]
        answer: ли
      - stem: Я сказа́л, ___ у меня́ был хоро́ший врач.
        options: [что, ли, где]
        answer: что

  - id: e3
    type: choice
    task: 选出词序正确的句子。
    why: "[ли]{.ru} 永远紧跟在被问的词后面，不能放在从句开头，也不能放在句末。第 1 题问“做没做”，被问的是动词 [де́лал]{.ru}，动词放在最前面；第 2 题问“有没有”，焦点是 [есть]{.ru}，所以说 [есть ли у меня́]{.ru}，说成 [у меня́ ли]{.ru} 意思就变成“是不是我有”，[е́сли]{.ru} 则只表示“如果”；第 3 题焦点是 [гото́в]{.ru}，[что]{.ru} 只能转述陈述句。"
    items:
      - stem: 她问我做没做练习。___
        options: ["Она́ спроси́ла, де́лал ли я упражне́ния.", "Она́ спроси́ла, ли я де́лал упражне́ния.", "Она́ спроси́ла, я де́лал упражне́ния ли."]
        answer: Она́ спроси́ла, де́лал ли я упражне́ния.
      - stem: 她问我有没有证明。___
        options: ["Она́ спроси́ла, у меня́ ли есть спра́вка.", "Она́ спроси́ла, есть ли у меня́ спра́вка.", "Она́ спроси́ла, е́сли у меня́ есть спра́вка."]
        answer: Она́ спроси́ла, есть ли у меня́ спра́вка.
      - stem: 老师问米沙准备好了没有。___
        options: ["Учи́тельница спроси́ла, гото́в ли Ми́ша.", "Учи́тельница спроси́ла, что Ми́ша гото́в.", "Учи́тельница спроси́ла, ли Ми́ша гото́в."]
        answer: Учи́тельница спроси́ла, гото́в ли Ми́ша.

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 老师问我身体好了没有。
        accept: ["Преподава́тель спроси́л, здоро́в ли я.", "Учи́тельница спроси́ла, здоро́в ли я.", "О́льга Ви́кторовна спроси́ла, здоро́в ли я.", "Учи́тельница спроси́ла, здоро́ва ли я.", "О́льга Ви́кторовна спроси́ла, здоро́ва ли я.", "Учи́тельница спроси́ла меня́, здоро́в ли я.", "О́льга Ви́кторовна спроси́ла меня́, здоро́в ли я.", "Преподава́тель спроси́л меня́, здоро́в ли я.", "Преподава́тель спроси́л, здоро́ва ли я.", "Учи́тельница спроси́ла меня́, здоро́ва ли я.", "О́льга Ви́кторовна спроси́ла меня́, здоро́ва ли я."]
        rubric: ["“是否”用 [ли]{.ru}，不用 [е́сли]{.ru}", "[здоро́в]{.ru}（女性 [здоро́ва]{.ru}）放在 [ли]{.ru} 前"]
      - zh: 她问我知不知道你住在哪儿。
        accept: ["Она́ спроси́ла, зна́ю ли я, где ты живёшь.", "Она́ спроси́ла меня́, зна́ю ли я, где ты живёшь."]
        rubric: ["[зна́ю ли я]{.ru}", "第二层从句用疑问词 [где]{.ru}"]
      - zh: 卡佳问安娜想不想去听音乐会。
        accept: ["Ка́тя спроси́ла А́нну, хо́чет ли она́ пойти́ на конце́рт.", "Ка́тя спроси́ла, хо́чет ли А́нна пойти́ на конце́рт.", "Ка́тя спроси́ла А́нну, хо́чет ли она́ на конце́рт.", "Ка́тя спроси́ла, хо́чет ли А́нна на конце́рт."]
        rubric: ["[спроси́ть]{.ru} 问谁用第四格 [А́нну]{.ru}", "[хо́чет ли]{.ru}，人称改为第三人称"]
      - zh: 我得了五分！
        accept: ["Я получи́л пятёрку!", "Я получи́ла пятёрку!"]
        rubric: ["“五分”用 [пятёрка]{.ru}，作宾语用第四格 [пятёрку]{.ru}"]

  - id: e5
    type: open
    task: 转述一段对话。
    items:
      - prompt: "读下面的对话，然后用间接引语转述老师问了什么、米沙怎么回答的（至少用两个 [ли]{.ru}）。[Учи́тельница: «Ми́ша, ты гото́в к контро́льной?» — Ми́ша: «Да, гото́в». — Учи́тельница: «Ты де́лал упражне́ния?» — Ми́ша: «Де́лал». — Учи́тельница: «Где твоя́ тетра́дь?» — Ми́ша: «До́ма».]{.ru}"
        length: 30–60
        model: "Учи́тельница спроси́ла Ми́шу, гото́в ли он к контро́льной. Ми́ша отве́тил, что гото́в. Пото́м она́ спроси́ла, де́лал ли он упражне́ния. Ми́ша сказа́л, что де́лал. Тогда́ учи́тельница спроси́ла, где его́ тетра́дь. Ми́ша отве́тил, что тетра́дь до́ма."
        rubric: ["一般疑问句用 [ли]{.ru}，特殊疑问句保留 [где]{.ru}，陈述句用 [что]{.ru}", "人称改为第三人称：[ты → он]{.ru}，[твоя́ → его́]{.ru}", "时不变"]
        notes: 范文按对话顺序一问一答地转述。三种从句各用到了：一般疑问句用 [ли]{.ru}，特殊疑问句用 [где]{.ru}，回答用 [что]{.ru}。[твоя́ тетра́дь]{.ru} 转述时改成 [его́ тетра́дь]{.ru}，因为从句的主语是 [тетра́дь]{.ru}，不是米沙，所以不用 [своя́]{.ru}。为避免重复，主句动词交替使用 [спроси́ла, отве́тил, сказа́л]{.ru}。
