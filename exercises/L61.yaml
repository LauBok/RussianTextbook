lesson: L61
grammar: "名词单数第五格的构成；前置词 [с]{.ru} + 第五格表示“和……一起”和“带有……”；[с]{.ru} + 第五格与 [без]{.ru} + 第二格的对立。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成第五格。
    why: 阳性硬辅音和中性 [-о]{.ru} 加 [-ом]{.ru}，阴性 [-а]{.ru} 改 [-ой]{.ru}，中性 [-е]{.ru} 改 [-ем]{.ru}。第 3 题 [пирожо́к]{.ru} 的 [о]{.ru} 脱落，写成 [пирожко́м]{.ru}；第 6 题 [па́па]{.ru} 虽是阳性，但以 [-а]{.ru} 结尾，按阴性变成 [па́пой]{.ru}；第 7 题 [ба́бушка]{.ru} 的 [к]{.ru} 后照常写 [-ой]{.ru}。
    items:
      - stem: чай с ___
        hint: лимо́н
        accept: [лимо́ном]
      - stem: ко́фе с ___
        hint: молоко́
        accept: [молоко́м]
      - stem: ко́фе с ___
        hint: пирожо́к
        accept: [пирожко́м]
      - stem: пирожо́к с ___
        hint: капу́ста
        accept: [капу́стой]
      - stem: чай с ___
        hint: варе́нье
        accept: [варе́ньем]
      - stem: Ми́ша игра́ет в футбо́л с ___.
        hint: па́па
        accept: [па́пой]
      - stem: А́нна пьёт чай с ___.
        hint: ба́бушка
        accept: [ба́бушкой]
      - stem: Ван Лэй говори́т с ___.
        hint: А́нна
        accept: [А́нной]

  - id: e2
    type: choice
    task: 选择 [с]{.ru} 或 [без]{.ru}。
    why: 看后面名词的格：第五格（[-ом]{.ru}、[-ой]{.ru}、[-ем]{.ru}）前用 [с]{.ru}，第二格（[-а]{.ru}、[-ы]{.ru}）前用 [без]{.ru}。第 1、4 题的 [са́хара]{.ru}、[лимо́на]{.ru} 是第二格，不能用 [с]{.ru}；不要只看意思，要看词尾。
    items:
      - stem: Я пью чай ___ са́хара.
        options: [с, без]
        answer: без
      - stem: Мне ко́фе ___ молоко́м.
        options: [с, без]
        answer: с
      - stem: Э́то пирожо́к ___ мя́сом.
        options: [с, без]
        answer: с
      - stem: В Кита́е пьют чай ___ лимо́на.
        options: [с, без]
        answer: без
      - stem: Ба́бушка пьёт чай ___ мёдом.
        options: [с, без]
        answer: с

  - id: e3
    type: rewrite
    task: 按例句回答问题。
    placeholder: Я пью … / Мне …
    example:
      cue: Како́й чай ты пьёшь? (лимо́н)
      answer: Я пью чай с лимо́ном.
    why: 问“什么样的”可以用 [с]{.ru} + 第五格回答。第 3 题问 [с чем]{.ru}，答句可以只说 [С мя́сом]{.ru}，也可以说完整句。第 4 题要用 [без]{.ru} + 第二格 [са́хара]{.ru}，不是第五格。
    items:
      - cue: Како́й ко́фе ты пьёшь? (молоко́)
        accept: [Я пью ко́фе с молоко́м.]
      - cue: Како́й чай пьёт ба́бушка? (варе́нье)
        accept: [Ба́бушка пьёт чай с варе́ньем., Она́ пьёт чай с варе́ньем.]
      - cue: С чем э́тот пирожо́к? (мя́со)
        accept: [С мя́сом., Э́тот пирожо́к с мя́сом., Он с мя́сом.]
      - cue: Ты пьёшь чай с са́харом? (нет)
        accept: ["Нет, я пью чай без са́хара.", "Нет, без са́хара."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 3 题“就着果酱喝茶”俄语就说 [пить чай с варе́ньем]{.ru}。第 4 题的“和……说话”也用 [с]{.ru} + 第五格。
    items:
      - zh: 给我一杯加奶的咖啡，谢谢。
        accept: ["Мне ко́фе с молоко́м, пожа́луйста.", "Мне, пожа́луйста, ко́фе с молоко́м.", "Пожа́луйста, ко́фе с молоко́м."]
        rubric: ["[молоко́]{.ru} 用第五格 [молоко́м]{.ru}", "“给我”用 [мне]{.ru}，可以省略动词"]
      - zh: 我喝茶不加糖。
        accept: ["Я пью чай без са́хара."]
        rubric: ["“不加”用 [без]{.ru} + 第二格 [са́хара]{.ru}", "[пить]{.ru} 的第一人称是 [пью]{.ru}"]
      - zh: 奶奶总是就着果酱喝茶。
        accept: ["Ба́бушка всегда́ пьёт чай с варе́ньем.", "Моя́ ба́бушка всегда́ пьёт чай с варе́ньем."]
        rubric: ["[варе́нье]{.ru} 的第五格是 [варе́ньем]{.ru}", "[пить]{.ru} 第三人称单数 [пьёт]{.ru}"]
      - zh: 王磊在咖啡馆和安娜说话。
        accept: ["Ван Лэй говори́т с А́нной в кафе́.", "Ван Лэй в кафе́ говори́т с А́нной.", "В кафе́ Ван Лэй говори́т с А́нной."]
        rubric: ["[А́нна]{.ru} 用第五格 [А́нной]{.ru}", "[кафе́]{.ru} 不变格，[в кафе́]{.ru}"]
      - zh: 你要什么馅的馅饼？——白菜馅的。
        accept: ["— С чем ты хо́чешь пирожо́к? — С капу́стой.", "— Како́й ты хо́чешь пирожо́к? — С капу́стой.", "— Како́й пирожо́к ты хо́чешь? — С капу́стой."]
        rubric: ["“什么馅的”用 [с чем]{.ru} 或 [како́й]{.ru} 提问", "答句 [с капу́стой]{.ru}"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你和一位朋友在咖啡馆。服务员问你们喝什么、吃什么，你们点餐。编一段对话，6–10 句，用上 [с]{.ru} + 第五格和 [без]{.ru} + 第二格。
        length: 40–70
        model: |
          — До́брый день! Что вы бу́дете пить?
          — Мне чай с лимо́ном, пожа́луйста.
          — С са́харом?
          — Нет, без са́хара.
          — А мне ко́фе с молоко́м.
          — Что вы бу́дете есть?
          — Каки́е у вас пирожки́?
          — С мя́сом, с капу́стой и с я́блоком.
          — Мне пирожо́к с мя́сом.
          — А мне с я́блоком.
        rubric: ["服务员的问题：[Что вы бу́дете пить?]{.ru} [Что вы бу́дете есть?]{.ru}", "至少三处正确的 [с]{.ru} + 第五格", "至少一处 [без]{.ru} + 第二格", "点餐用 [Мне …, пожа́луйста]{.ru}"]
        notes: 对话按点饮料、追问加不加糖、点吃的的顺序展开，和课文一致。点餐用省略句 [Мне …]{.ru} 最自然；第二个人点同样的东西时可以只说 [А мне с я́блоком]{.ru}，省去名词。
