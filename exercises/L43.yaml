lesson: L43
grammar: 完成体将来时（完成体动词按人称变位）；与未完成体将来时 [бу́ду]{.ru} + 不定式的比较。
exercises:

  - id: e1
    type: fill
    task: 写出完成体动词的将来时形式。
    why: 完成体将来时的词尾和现在时一样。[написа́ть]{.ru} 词干里 [с]{.ru} 变成 [ш]{.ru}，各人称都变，重音从第二人称起移到词干上：[напишу́, напи́шешь]{.ru}。[уви́деть]{.ru}、[пригото́вить]{.ru} 只有第一人称单数交替：[уви́жу]{.ru}、[пригото́влю]{.ru}，第 5 题 [мы]{.ru} 不交替。
    items:
      - stem: За́втра я ___ письмо́.
        hint: написа́ть
        accept: [напишу́]
      - stem: Ве́чером ма́ма ___ у́жин.
        hint: пригото́вить
        accept: [пригото́вит]
      - stem: Ты ___ статью́ сего́дня?
        hint: прочита́ть
        accept: [прочита́ешь]
      - stem: Там я ___ ла́вру.
        hint: уви́деть
        accept: [уви́жу]
      - stem: В суббо́ту мы ___ фильм.
        hint: посмотре́ть
        accept: [посмо́трим]
      - stem: Студе́нты ___ упражне́ние.
        hint: сде́лать
        accept: [сде́лают]

  - id: e2
    type: choice
    task: 选择未完成体将来时或完成体将来时。
    why: 只说做什么、做多久，用 [бу́ду]{.ru} + 未完成体（第 1、3、5 题）。说要把一件具体的事做完，或者作保证，用完成体（第 2、4、6 题）。[бу́ду]{.ru} 后面不能接完成体，所以 [бу́ду прочита́ть]{.ru} 这样的选项不存在。
    items:
      - stem: За́втра у́тром я ___ в библиоте́ке.
        options: [бу́ду занима́ться, сде́лаю]
        answer: бу́ду занима́ться
      - stem: Я ___ упражне́ние, и пото́м мы бу́дем смотре́ть фильм.
        options: [бу́ду де́лать, сде́лаю]
        answer: сде́лаю
      - stem: — Что вы ___ в суббо́ту? — Отдыха́ть.
        options: [бу́дете де́лать, сде́лаете]
        answer: бу́дете де́лать
      - stem: Уро́ки я ___ сего́дня. Че́стное сло́во!
        options: [бу́ду де́лать, сде́лаю]
        answer: сде́лаю
      - stem: Ве́чером А́нна ___ телеви́зор.
        options: [бу́дет смотре́ть, посмо́трит]
        answer: бу́дет смотре́ть
      - stem: За́втра я ___ статью́ и напишу́ письмо́.
        options: [бу́ду чита́ть, прочита́ю]
        answer: прочита́ю

  - id: e3
    type: rewrite
    task: 按例句回答：今天做了一阵还没做完，明天一定做完。
    placeholder: Сего́дня я …
    example:
      cue: Ты прочита́л статью́?
      answer: Сего́дня я чита́л статью́, но не прочита́л. За́втра прочита́ю.
    why: 三种形式各有分工：未完成体过去时说做过这件事，完成体过去时加 [не]{.ru} 说没有结果，完成体将来时说明天会有结果。注意 [написа́ть]{.ru} 的将来时是 [напишу́]{.ru}，不是 [написа́ю]{.ru}。
    items:
      - cue: Ты написа́л письмо́?
        accept: ["Сего́дня я писа́л письмо́, но не написа́л. За́втра напишу́."]
      - cue: Ты сде́лал упражне́ние?
        accept: ["Сего́дня я де́лал упражне́ние, но не сде́лал. За́втра сде́лаю."]
      - cue: Ты посмотре́л фильм?
        accept: ["Сего́дня я смотре́л фильм, но не посмотре́л. За́втра посмотрю́."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：上午王磊要做练习，然后读文章；明天去谢尔吉耶夫镇；玛丽亚·尼古拉耶夫娜要做晚饭；米沙明天看足球。
    items:
      - stem: У́тром Ван Лэй ___.
        options: [сде́лает упражне́ние, прочита́ет статью́]
        answer: сде́лает упражне́ние
      - stem: За́втра Ван Лэй ___.
        options: [бу́дет в Се́ргиевом Поса́де, бу́дет до́ма]
        answer: бу́дет в Се́ргиевом Поса́де
      - stem: Мари́я Никола́евна пригото́вит ___.
        options: [у́жин, чай]
        answer: у́жин
      - stem: За́втра Ми́ша посмо́трит ___.
        options: [фильм, футбо́л]
        answer: футбо́л

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语“我写完信”“把电影看了”带结果，用完成体将来时；“我要学习”不说结果，用 [бу́ду]{.ru} + 未完成体。
    items:
      - zh: 明天我把信写完。
        accept: ["За́втра я напишу́ письмо́.", "Я напишу́ письмо́ за́втра.", "Письмо́ я напишу́ за́втра."]
        rubric: ["完成体将来时 [напишу́]{.ru}", "不能用 [бу́ду написа́ть]{.ru}"]
      - zh: 星期六我要学习，星期天我们要看电影。
        accept: ["В суббо́ту я бу́ду занима́ться, а в воскресе́нье мы бу́дем смотре́ть фильм.", "В суббо́ту я бу́ду занима́ться, а в воскресе́нье мы посмо́трим фильм.", "В суббо́ту я бу́ду занима́ться. В воскресе́нье мы бу́дем смотре́ть фильм.", "В суббо́ту я бу́ду занима́ться. В воскресе́нье мы посмо́трим фильм."]
        rubric: ["[бу́ду занима́ться]{.ru}", "“看电影”两种体都可以：[бу́дем смотре́ть]{.ru} 或 [посмо́трим]{.ru}"]
      - zh: 在那里你们会看到一座古老的修道院。
        accept: ["Там вы уви́дите стари́нный монасты́рь.", "Там вы уви́дите ста́рый монасты́рь.", "Вы уви́дите там стари́нный монасты́рь.", "Вы уви́дите там ста́рый монасты́рь.", "Вы там уви́дите стари́нный монасты́рь.", "Вы там уви́дите ста́рый монасты́рь."]
        rubric: ["[уви́дите]{.ru}：完成体将来时，第二人称复数", "[монасты́рь]{.ru} 阳性非动物名词，第四格同第一格"]
      - zh: 晚上我做一顿好吃的晚饭。
        accept: ["Ве́чером я пригото́влю вку́сный у́жин.", "Я пригото́влю вку́сный у́жин ве́чером.", "Я ве́чером пригото́влю вку́сный у́жин."]
        rubric: ["[пригото́влю]{.ru}，注意第一人称的 [вл]{.ru}"]

  - id: e6
    type: open
    task: 情景对话：朋友问你周末的打算（6–8 句）。
    items:
      - prompt: 朋友问你星期六、星期天做什么。你说星期六要学习，要做完练习、写完信；星期天去游览，会看到什么。朋友问你什么时候回来。两种将来时都要用到。
        length: 50–80
        model: "— Каки́е у тебя́ пла́ны на суббо́ту?\n— В суббо́ту я бу́ду занима́ться. У́тром я сде́лаю упражне́ние, а пото́м напишу́ письмо́ домо́й.\n— А в воскресе́нье?\n— В воскресе́нье мы е́дем на экску́рсию в Се́ргиев Поса́д. Там мы уви́дим ла́вру.\n— О, хорошо́! Ты сде́лаешь фо́то?\n— Коне́чно, сде́лаю.\n— А когда́ ты бу́дешь до́ма?\n— Ве́чером."
        rubric: ["用 [бу́ду]{.ru} + 未完成体说安排", "用完成体将来时说要做完的具体事情：[сде́лаю, напишу́, уви́дим]{.ru}", "已经定好的行程可以用现在时：[мы е́дем]{.ru}"]
        notes: 范文先用 [Каки́е у тебя́ пла́ны на суббо́ту?]{.ru} 引出话题，回答里先给总的安排（[бу́ду занима́ться]{.ru}），再列出具体要做完的事（[сде́лаю, напишу́]{.ru}），两种将来时的分工很清楚。简短回答直接重复动词：[Коне́чно, сде́лаю.]{.ru}
