lesson: B2-L49
grammar: "时间从句：[пока́]{.ru}、[пока́ не]{.ru}、[по́сле того́ как]{.ru}、[пе́ред тем как]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的连接词。
    why: "第 1 题两件事同时进行（妈妈上班期间米沙玩），用 [пока́]{.ru}。第 2 题“一直玩到球打中柜子”，用 [пока́ не]{.ru}；[не]{.ru} 在这里不表示否定。第 3 题先量后去，量的动作在从句里先发生，用 [по́сле того́ как]{.ru}。第 4 题“走之前”，从句是不定式 [уе́хать]{.ru}，用 [пе́ред тем как]{.ru}。第 5 题“在爸爸回来之前换掉”，说将来，用 [пока́ не]{.ru} + 完成体将来时。第 6 题“趁你看书的时候我做饭”，同时进行，用 [пока́]{.ru}。"
    items:
      - stem: ___ ма́ма была́ на рабо́те, Ми́ша игра́л с мячо́м.
        options: [Пока́, Пока́ не, Пе́ред тем как]
        answer: Пока́
      - stem: Ми́ша игра́л, ___ мяч не попа́л в шкаф.
        options: [пока́, по́сле того́ как, пе́ред тем как]
        answer: пока́
      - stem: ___ они́ изме́рили шкаф, они́ пое́хали в мастерску́ю.
        options: [Пока́, По́сле того́ как, Пе́ред тем как]
        answer: По́сле того́ как
      - stem: ___ уе́хать, па́па поговори́л с Ми́шей.
        options: [Пока́, По́сле того́ как, Пе́ред тем как]
        answer: Пе́ред тем как
      - stem: На́до поменя́ть стекло́, ___ па́па не вернётся.
        options: [пока́, по́сле того́ как, пе́ред тем как]
        answer: пока́
      - stem: ___ ты чита́ешь, я пригото́влю у́жин.
        options: [Пока́, Пока́ не, По́сле того́ как]
        answer: Пока́

  - id: e2
    type: fill
    task: 用括号里的动词的正确形式填空。
    why: "第 1 题 [пока́]{.ru} 表示同时、一段时间，用未完成体过去时 [чита́л]{.ru}。第 2 题 [пока́ не]{.ru} 讲将来，用完成体将来时 [придёт]{.ru}。第 3 题 [пе́ред тем как]{.ru} 主语相同，用不定式 [пойти́]{.ru}。第 4 题 [по́сле того́ как]{.ru} 表示先完成的动作，说的是将来，用完成体将来时 [сдаду́т]{.ru}。第 5 题 [пока́ не]{.ru} 讲过去，“直到天黑”是一次完成的结果，用完成体过去时 [ста́ло]{.ru}。"
    items:
      - stem: Пока́ Ван Лэй ___ кни́гу, Ми́ша игра́л на компью́тере.
        hint: чита́ть
        accept: ["чита́л"]
      - stem: Мы не начнём у́жин, пока́ па́па не ___.
        hint: прийти́
        accept: ["придёт"]
      - stem: Пе́ред тем как ___ спать, Ван Лэй всегда́ пи́шет ма́ме.
        hint: пойти́
        accept: ["пойти́"]
      - stem: По́сле того́ как студе́нты ___ экза́мены, они́ пое́дут домо́й.
        hint: сдать
        accept: ["сдаду́т"]
      - stem: Мы сиде́ли на на́бережной, пока́ не ___ темно́.
        hint: стать
        accept: ["ста́ло"]

  - id: e3
    type: rewrite
    task: 按例句用括号里的连接词把两句话连成一句。
    example:
      cue: "Па́па уе́хал. Пе́ред э́тим он поговори́л с Ми́шей. (пе́ред тем как)"
      answer: Пе́ред тем как уе́хать, па́па поговори́л с Ми́шей.
    why: "第 1 题主语相同（都是王磊），[пе́ред тем как]{.ru} 后用不定式。第 2 题两件事同时进行，用 [пока́]{.ru}，未完成体。第 3 题先做功课后散步，[по́сле того́ как]{.ru} 引出先发生的事，用完成体 [сде́лали]{.ru}。第 4 题“一直等到”，用 [пока́ не]{.ru}，从句用完成体过去时，不要漏掉 [не]{.ru}。"
    items:
      - cue: "Ван Лэй ушёл из до́ма. Пе́ред э́тим он позвони́л Ди́ме. (пе́ред тем как)"
        accept: ["Пе́ред тем как уйти́ из до́ма, Ван Лэй позвони́л Ди́ме.", "Ван Лэй позвони́л Ди́ме пе́ред тем, как уйти́ из до́ма.", "Ван Лэй позвони́л Ди́ме, пе́ред тем как уйти́ из до́ма."]
      - cue: "А́нна была́ в университе́те. В э́то вре́мя Ми́ша игра́л до́ма. (пока́)"
        accept: ["Пока́ А́нна была́ в университе́те, Ми́ша игра́л до́ма.", "Ми́ша игра́л до́ма, пока́ А́нна была́ в университе́те."]
      - cue: "Мы сде́лали уро́ки. Пото́м мы пошли́ гуля́ть. (по́сле того́ как)"
        accept: ["По́сле того́ как мы сде́лали уро́ки, мы пошли́ гуля́ть.", "Мы пошли́ гуля́ть по́сле того́, как сде́лали уро́ки.", "Мы пошли́ гуля́ть, по́сле того́ как сде́лали уро́ки."]
      - cue: "Ми́ша ждал. Наконе́ц па́па позвони́л. (пока́ не)"
        accept: ["Ми́ша ждал, пока́ па́па не позвони́л.", "Ми́ша ждал, пока́ наконе́ц па́па не позвони́л.", "Ми́ша ждал, пока́ па́па наконе́ц не позвони́л."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题“在……期间”用 [пока́]{.ru}；第 2 题“在……之前要做完”用 [пока́ не]{.ru} + 完成体将来时；第 3 题主语相同，[пе́ред тем как]{.ru} + 不定式；第 4 题“……以后”用 [по́сле того́ как]{.ru} + 完成体。
    items:
      - zh: 你不在家的时候，猫一直在睡觉。
        accept: ["Пока́ тебя́ не́ было до́ма, ко́шка спала́.", "Пока́ тебя́ не́ было до́ма, ко́шка всё вре́мя спала́.", "Пока́ тебя́ не́ было, ко́шка спала́.", "Пока́ тебя́ не́ было, ко́шка всё вре́мя спала́.", "Ко́шка всё вре́мя спала́, пока́ тебя́ не́ было до́ма.", "Ко́шка спала́, пока́ тебя́ не́ было до́ма.", "Пока́ тебя́ не́ было до́ма, Му́рка спала́.", "Пока́ тебя́ не́ было до́ма, Му́рка всё вре́мя спала́."]
        rubric: ["[пока́]{.ru} 表示同时", "“不在”用 [тебя́ не́ было]{.ru}，第二格"]
      - zh: 我们得在妈妈回来之前把一切做完。
        accept: ["Нам на́до всё сде́лать, пока́ ма́ма не вернётся.", "Нам ну́жно всё сде́лать, пока́ ма́ма не вернётся.", "На́до всё сде́лать, пока́ ма́ма не вернётся.", "Ну́жно всё сде́лать, пока́ ма́ма не вернётся.", "Нам на́до сде́лать всё, пока́ ма́ма не вернётся.", "Нам ну́жно сде́лать всё, пока́ ма́ма не вернётся.", "Мы должны́ всё сде́лать, пока́ ма́ма не вернётся.", "Мы должны́ сде́лать всё, пока́ ма́ма не вернётся."]
        rubric: ["[пока́ не]{.ru} + 完成体将来时 [вернётся]{.ru}", "[не]{.ru} 不表示否定"]
      - zh: 睡觉前米沙总是看一会儿书。
        accept: ["Пе́ред тем как пойти́ спать, Ми́ша всегда́ немно́го чита́ет.", "Пе́ред тем как пойти́ спать, Ми́ша всегда́ чита́ет.", "Пе́ред тем как идти́ спать, Ми́ша всегда́ немно́го чита́ет.", "Пе́ред тем как идти́ спать, Ми́ша всегда́ чита́ет.", "Пе́ред сном Ми́ша всегда́ немно́го чита́ет.", "Пе́ред сном Ми́ша всегда́ чита́ет.", "Ми́ша всегда́ немно́го чита́ет пе́ред тем, как пойти́ спать.", "Ми́ша всегда́ немно́го чита́ет пе́ред сном."]
        rubric: ["主语相同，[пе́ред тем как]{.ru} + 不定式 [пойти́ спать]{.ru}，或 [пе́ред сном]{.ru}", "习惯动作用未完成体现在时 [чита́ет]{.ru}"]
      - zh: 考完试以后，王磊要回北京。
        accept: ["По́сле того́ как Ван Лэй сдаст экза́мены, он пое́дет в Пеки́н.", "По́сле того́ как Ван Лэй сдаст экза́мены, он полети́т в Пеки́н.", "По́сле того́ как Ван Лэй сдаст экза́мены, он вернётся в Пеки́н.", "По́сле экза́менов Ван Лэй пое́дет в Пеки́н.", "По́сле экза́менов Ван Лэй полети́т в Пеки́н.", "По́сле экза́менов Ван Лэй вернётся в Пеки́н.", "Ван Лэй пое́дет в Пеки́н по́сле того́, как сдаст экза́мены.", "Ван Лэй вернётся в Пеки́н по́сле того́, как сдаст экза́мены."]
        rubric: ["[по́сле того́ как]{.ru} + 完成体将来时 [сдаст]{.ru}，或前置词短语 [по́сле экза́менов]{.ru}", "回国用 [пое́дет / полети́т / вернётся в Пеки́н]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что сказа́л па́па Ми́ше, пе́ред тем как уе́хать? Что случи́лось в четве́рг? Что реши́ли сде́лать Ми́ша и Ван Лэй? Что рассказа́л па́па по телефо́ну? Чем ко́нчилась исто́рия?]{.ru}"
        length: 60–90
        model: "Пе́ред тем как уе́хать в командиро́вку, па́па сказа́л Ми́ше, что он в до́ме гла́вный мужчи́на. В четве́рг, пока́ все бы́ли на рабо́те и в университе́те, Ми́ша игра́л в гости́ной с мячо́м, пока́ мяч не попа́л в шкаф и стекло́ не разби́лось. Ми́ша и Ван Лэй реши́ли поменя́ть стекло́, пока́ па́па не вернётся. Па́па рассказа́л по телефо́ну, что в Петербу́рге бе́лые но́чи. В пя́тницу но́вое стекло́ бы́ло на ме́сте, но Ми́ша всё рассказа́л па́пе, и па́па сказа́л, что он молоде́ц."
        rubric: ["回答全部五个问题", "至少用到三种时间连接词", "[пока́ не]{.ru} 后动词体正确"]
        notes: 范文约 85 词。课文情节按时间顺序压缩，每个关键节点用一个时间从句串起来：[пе́ред тем как]{.ru}、[пока́]{.ru}、[пока́ не]{.ru}。[пока́ мяч не попа́л…и стекло́ не разби́лось]{.ru} 两个完成体动作共用一个 [пока́ не]{.ru}。

  - id: e6
    type: open
    task: 作文：《我的一天》。写写你平常的一天，按时间顺序讲清楚各件事的先后。
    items:
      - prompt: 写清楚早上、白天、晚上做什么；至少用四个不同的时间连接词（[когда́]{.ru}、[пока́]{.ru}、[пока́ не]{.ru}、[по́сле того́ как]{.ru}、[пе́ред тем как]{.ru}）。
        length: 100–150
        model: "Обы́чно я встаю́ в семь часо́в. Пе́ред тем как поза́втракать, я умыва́юсь. Пока́ я за́втракаю, я слу́шаю ра́дио, что́бы знать, кака́я бу́дет пого́да. В во́семь часо́в я выхожу́ из до́ма и е́ду в университе́т на метро́. Пока́ я е́ду, я чита́ю кни́гу и́ли повторя́ю слова́. Заня́тия начина́ются в де́вять и конча́ются в три. По́сле того́ как ко́нчатся заня́тия, я обе́даю в кафе́ с друзья́ми. Пото́м я иду́ в библиоте́ку и занима́юсь там, пока́ не сде́лаю всё дома́шнее зада́ние. Когда́ я прихожу́ домо́й, мы у́жинаем всей семьёй. Ве́чером я немно́го отдыха́ю: смотрю́ фильм и́ли звоню́ роди́телям. Пе́ред тем как пойти́ спать, я ещё раз смотрю́ расписа́ние на за́втра."
        rubric: ["按时间顺序写一天的事", "至少四个不同的时间连接词，用法正确", "习惯动作用未完成体现在时；[пока́ не]{.ru}、[по́сле того́ как]{.ru} 后完成体用对", "100–150 词"]
        notes: 范文约 130 词，从起床写到睡觉。讲习惯的事用未完成体现在时，但 [по́сле того́ как ко́нчатся заня́тия]{.ru}、[пока́ не сде́лаю]{.ru} 强调“做完”，用完成体将来时形式表示反复发生的先后关系。

  - id: e7
    type: open
    task: 书信写作：以米沙的身份，在爸爸出差期间给他写一封短信（电子邮件），讲讲家里这几天的事。
    items:
      - prompt: 用 [Приве́т, па́па!]{.ru} 一类的称呼开头，[Твой сын]{.ru} 落款；问问彼得堡的白夜；讲讲家里的事（可以不提打碎玻璃）；用上 [пока́]{.ru} 和 [пока́ не]{.ru}。
        length: 80–120
        model: "Приве́т, па́па!\n\nКак ты? Как рабо́та? Ма́ма говори́т, что в Петербу́рге сейча́с бе́лые но́чи. Э́то пра́вда, что там но́чью светло́, как днём? Ты ви́дел, как разво́дят мосты́?\n\nУ нас всё хорошо́. У меня́ уже́ кани́кулы, поэ́тому я встаю́ по́здно. Пока́ ма́ма на рабо́те, я помога́ю по до́му: вчера́ я сам купи́л хлеб и молоко́. Ве́чером мы с Ван Лэ́ем игра́ли в ша́хматы, пока́ А́нна не сказа́ла, что пора́ спать. Му́рка спит на твоём сту́ле и ждёт тебя́. Я то́же жду! Привези́ мне, пожа́луйста, пода́рок из Петербу́рга.\n\nТвой сын Ми́ша"
        rubric: ["称呼和落款符合父子之间的口吻", "问到白夜、讲家里的事", "[пока́]{.ru} 和 [пока́ не]{.ru} 各一次，用法正确", "80–120 词"]
        notes: 范文约 100 词，分三段：问候和提问、讲家里的事、结尾的请求。孩子给父亲写信用 [ты]{.ru}，语气随便，可以用 [Приве́т]{.ru}。[пока́ ма́ма на рабо́те]{.ru} 表示同时，[пока́ А́нна не сказа́ла]{.ru} 表示一直下到安娜开口为止。
