lesson: L62
grammar: "人称代词第五格（[мной, тобо́й, им, ей, на́ми, ва́ми, и́ми]{.ru}，带前置词时第三人称加 [н-]{.ru}）；[собо́й]{.ru}；[мы с А́нной]{.ru} 表示“我和安娜”。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的代词变成第五格，连同前置词一起写出。
    why: 第三人称代词在前置词后面加 [н-]{.ru}：[с ним, с ней, с ни́ми]{.ru}，不能写 [с им]{.ru}。“和我”是 [со мной]{.ru}，前置词要写成 [со]{.ru}。
    items:
      - stem: Мо́жно ___?
        hint: с + вы
        accept: [с ва́ми]
      - stem: Ми́ша идёт в кино́ ___.
        hint: с + мы
        accept: [с на́ми]
      - stem: А́нна сиди́т ___ и помога́ет мне.
        hint: с + я
        accept: [со мной]
      - stem: Э́то Ка́тя. Я ча́сто говорю́ ___.
        hint: с + она́
        accept: [с ней]
      - stem: Э́то Ван Лэй. Мы ___ у́чимся вме́сте.
        hint: с + он
        accept: [с ним]
      - stem: Ми́ша и Ка́тя — мои́ друзья́. Я люблю́ игра́ть ___.
        hint: с + они́
        accept: [с ни́ми]
      - stem: Спаси́бо! ___ о́чень ве́село.
        hint: с + ты
        accept: [С тобо́й]

  - id: e2
    type: rewrite
    task: 按例句改写，用 [мы с …]{.ru}、[вы с …]{.ru} 句型。
    placeholder: Мы с … / Вы с …
    example:
      cue: Я и А́нна идём в кино́.
      answer: Мы с А́нной идём в кино́.
    why: “我和某人”说成 [мы с]{.ru} + 第五格，“你和某人”说成 [вы с]{.ru} + 第五格，动词仍用复数。第 2 题 [Ми́ша]{.ru} 按阴性变成 [Ми́шей]{.ru}；第 4 题的代词 [он]{.ru} 要变成 [с ним]{.ru}。
    items:
      - cue: Я и ма́ма пьём чай.
        accept: [Мы с ма́мой пьём чай.]
      - cue: Я и Ми́ша игра́ем в футбо́л.
        accept: [Мы с Ми́шей игра́ем в футбо́л.]
      - cue: Ты и па́па смо́трите телеви́зор?
        accept: ["Вы с па́пой смо́трите телеви́зор?"]
      - cue: Я и он у́чимся вме́сте.
        accept: [Мы с ним у́чимся вме́сте.]
      - cue: Ты и Ка́тя сиди́те в после́днем ряду́?
        accept: ["Вы с Ка́тей сиди́те в после́днем ряду́?"]

  - id: e3
    type: choice
    task: 选择 [кем]{.ru} 或 [чем]{.ru} 填空。
    why: 问人用 [с кем]{.ru}，问事物用 [с чем]{.ru}，和 [кто]{.ru}、[что]{.ru} 的分工一样。第 4 题问的是馅，所以用 [чем]{.ru}。
    items:
      - stem: — С ___ ты идёшь в кино́? — С бра́том.
        options: [кем, чем]
        answer: кем
      - stem: — С ___ ты пьёшь чай? — С лимо́ном.
        options: [кем, чем]
        answer: чем
      - stem: — С ___ ты говори́шь? — С Ка́тей.
        options: [кем, чем]
        answer: кем
      - stem: — С ___ э́тот пирожо́к? — С мя́сом.
        options: [кем, чем]
        answer: чем

  - id: e4
    type: translate
    task: 译成俄语。
    why: “我和……”用 [мы с]{.ru} + 第五格最自然。第 2 题是省略句，口语里不必说出动词。
    items:
      - zh: 我和安娜去看电影。
        accept: ["Мы с А́нной идём в кино́.", "Мы с А́нной идём в кинотеа́тр."]
        rubric: ["用 [мы с А́нной]{.ru}，不说 [я и А́нна]{.ru}", "[идти́]{.ru} 用复数 [идём]{.ru}", "[в кино́]{.ru} 第四格"]
      - zh: 我可以跟你们一起去吗？
        accept: ["Мо́жно с ва́ми?", "Мо́жно мне с ва́ми?", "Мо́жно мне идти́ с ва́ми?"]
        rubric: ["“跟你们”用 [с ва́ми]{.ru}"]
      - zh: 你和谁去电影院？
        accept: ["С кем ты идёшь в кино́?", "С кем ты идёшь в кинотеа́тр?", "Ты с кем идёшь в кино́?", "Ты с кем идёшь в кинотеа́тр?"]
        rubric: ["“和谁”用 [с кем]{.ru}"]
      - zh: 这是我的朋友，我和他一起上学。
        accept: ["Э́то мой друг, мы с ним у́чимся вме́сте.", "Э́то мой друг. Мы с ним у́чимся вме́сте.", "Э́то мой друг, мы с ним вме́сте у́чимся.", "Э́то мой друг. Мы с ним вме́сте у́чимся."]
        rubric: ["“我和他”用 [мы с ним]{.ru}", "[с]{.ru} 后面的 [он]{.ru} 变成 [ним]{.ru}，加 [н-]{.ru}"]
      - zh: 和你在一起很开心。
        accept: ["С тобо́й о́чень ве́село.", "С тобо́й ве́село."]
        rubric: ["无人称句，副词 [ве́село]{.ru}", "[с тобо́й]{.ru}"]

  - id: e5
    type: open
    task: 缩写。
    items:
      - prompt: 按下列问题复述课文，连成一段话：[Что хотя́т смотре́ть А́нна и Ван Лэй? Кто идёт с ни́ми? Кого́ А́нна встреча́ет в кинотеа́тре? С кем Ка́тя в кино́? Что говори́т Ми́ша по́сле фи́льма?]{.ru}
        length: 40–70
        model: |
          В суббо́ту А́нна и Ван Лэй хотя́т смотре́ть но́вую ру́сскую коме́дию. Ми́ша то́же хо́чет в кино́, и он идёт с ни́ми. В кинотеа́тре А́нна встреча́ет подру́гу Ка́тю. Ка́тя в кино́ с бра́том. Фильм о́чень весёлый. По́сле фи́льма Ми́ша говори́т: «Спаси́бо вам! С ва́ми о́чень ве́село».
        rubric: ["回答全部五个问题", "至少两处代词第五格（[с ни́ми]{.ru}、[с ва́ми]{.ru} 等）", "[с бра́том]{.ru} 用名词第五格"]
        notes: 按问题顺序作答，每个问题一两句话，问题里的词可以直接用进答句。[Кого́ А́нна встреча́ет]{.ru} 要求第四格 [подру́гу Ка́тю]{.ru}；米沙的话可以用直接引语照录。
