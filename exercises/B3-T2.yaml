  passage_zh: |
    **套娃**

    套娃是一种木制玩具，做成一个包着俄罗斯头巾的姑娘的样子。它能打开，里面是第二个小一点的玩具，第二个里面是第三个，一直到最小的一个。一个套娃通常有三到十个，但也有五十多个的。

    很多人以为套娃是很古老的俄罗斯玩具，其实它十九世纪末才出现。有一种说法是，这个点子是从日本带来的：日本有一种类似的玩具——做成老人的样子，里面装着几个小一些的玩具。第一个俄罗斯套娃是十九世纪最后几年在莫斯科做出来的，一共八个：大小不同的女孩和男孩，最小的一个是个婴儿。

    玩具的名字来源于一个女子名（玛特廖娜），这个名字在当时的俄罗斯乡村里是最常见的名字之一。所以人们常把套娃看作俄罗斯家庭的象征。

    1900 年，套娃在巴黎世界博览会上展出，获得了奖牌。此后俄罗斯许多城市都开始做套娃。如今套娃是最受欢迎的俄罗斯纪念品。它的画法各不相同：有画成童话人物的，有画成著名作家的，甚至还有画成足球运动员的。
