- id: e8
  type: open
  task: 写作。
  points: 30
  items:
  - prompt: '以“[Что важнее при выборе профессии: интересная работа или высокая зарплата?]{.ru}”为题写一段议论文字，200 词左右。先表明自己的观点，再用两三个论据和例子说明，并回应相反的看法，最后得出结论。至少用两个插入语（如 [во-первых, по-моему, конечно]{.ru}）、一个 [тот, кто]{.ru} 或 [то, что]{.ru} 结构、一个程度从句（[так… что]{.ru}、[настолько… что]{.ru}），以及一个形动词短语或副动词短语。'
    length: 180–220
    model: |
      **Что важнее при выборе профессии: интересная работа или высокая зарплата?**

      Выбирая профессию, многие молодые люди думают прежде всего о деньгах. Их можно понять: жизнь в больших городах дорогая. И всё же, по-моему, интересная работа важнее высокой зарплаты.

      Во-первых, работа занимает большую часть нашей жизни. Тот, кто каждый день занимается делом, которое не любит, быстро устаёт и теряет интерес ко всему. Мой старший брат, например, несколько лет работал в банке. Зарплата была хорошей, но работа казалась ему настолько скучной, что он ушёл и стал учителем. Сейчас он получает меньше, но говорит, что впервые чувствует себя счастливым.

      Во-вторых, человек, любящий своё дело, обычно делает его хорошо. А хорошего специалиста рано или поздно замечают, и деньги приходят сами.

      Конечно, сторонники другой точки зрения скажут, что без денег нельзя прожить и что интересом семью не накормишь. С этим трудно спорить. Однако то, что работа приносит радость, нельзя купить ни за какие деньги.

      Таким образом, выбирая профессию, нужно прежде всего слушать себя. Лучше всего, конечно, когда за интересную работу ещё и хорошо платят. Но если приходится выбирать, я выберу интерес.
    rubric:
    - 内容 10 分：观点明确（2 分）；两三个论据，每个有说明或例子（每个 2 分，最多 4 分）；回应相反的看法（2 分）；结论（2 分）
    - 语法 10 分：要求的四项（两个插入语、[тот, кто]{.ru} 或 [то, что]{.ru}、程度从句、形动词或副动词短语）各 1 分；插入语和独立成分标点正确 1 分；其余 5 分看全文语法错误：变格、变位、体、支配关系、[кто]{.ru} 后动词的数，每两处错误扣 1 分
    - 词汇 5 分：用词准确，能用上政论语体的说法（[по мнению, сторонники этой точки зрения, таким образом, ясно одно]{.ru} 等）给 5 分；用词单调、语体不统一（混进口语词）的，酌情扣 1–3 分
    - 结构 5 分：引言—论据—反驳—结论层次清楚（3 分），段落之间衔接自然（2 分）
    - 字数少于 150 词的，内容分最多给 6 分
    notes: 范文约 200 词，按政论文的结构写：引言承认对方观点有道理，再亮出自己的看法；两个论据用 [во-первых, во-вторых]{.ru} 引出，第一个论据配哥哥的例子；第四段用 [конечно… однако]{.ru} 回应相反的看法；结论用 [таким образом]{.ru}（第 33、45 课）。语法上：[Тот, кто каждый день занимается…]{.ru} 和 [то, что работа приносит радость]{.ru} 是关联词结构，[кто]{.ru} 后动词用单数（第 37 课）；[настолько скучной, что он ушёл]{.ru} 是程度从句（第 36 课）；[человек, любящий своё дело]{.ru} 是形动词短语，[Выбирая профессию]{.ru} 是副动词短语（第 1、11 课）；[интересом семью не накормишь]{.ru} 是泛指人称句（第 17 课）；[казалась ему]{.ru}、[приходится выбирать]{.ru} 是无人称结构（第 16 课）。
