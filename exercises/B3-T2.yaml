  why: 第 1 题：[который]{.ru} 是第一格、动词是过去时，换成主动形动词过去时；形动词和被说明的 [людей]{.ru} 一致，用复数第四格（同第二格）[стоявших]{.ru}，不用第一格 [стоявшие]{.ru}（第 2、6、7 课）。第 2 题：同一个主语、先完成的动作，换成完成体副动词；[-йти]{.ru} 类动词由将来时词干加 [-я]{.ru}：[войдя]{.ru}（第 12、13 课）。第 3 题：结果从句 [поэтому]{.ru} 换成程度从句：[так]{.ru} 放在主句里，[что]{.ru} 引出从句（第 36 课）。第 4 题：[люди, которые]{.ru} 换成 [те, кто]{.ru}，[кто]{.ru} 后面的动词用阳性单数 [читал]{.ru}，主句谓语跟 [те]{.ru} 用复数（第 37 课）。第 5 题：第二个分句说明原因，去掉 [потому что]{.ru} 后用冒号（第 38 课）。第 6 题：一般疑问句转述用 [ли]{.ru}，紧跟被问的动词，[вы]{.ru} 换成 [они]{.ru}；时态不变（第 39 课）。第 7 题：转述命令用 [чтобы]{.ru} + 过去时形式 [помог]{.ru}（第 39 课）。第 8 题：时间从句换成名词结构，动词 [вышел]{.ru} 变成名词 [выход]{.ru}，原来的主语 [фильм]{.ru} 变成第二格 [фильма]{.ru}（第 58 课）。第 9 题：科学语体的定义句 [является]{.ru} 后面用第五格，形容词跟着变：[самым глубоким озером]{.ru}（第 43 课）。第 10 题：申请书用 [Прошу]{.ru} + 完成体不定式，原因用 [в связи с]{.ru} + 第五格，[потому что я переезжаю]{.ru} 名词化为 [в связи с переездом]{.ru}（第 42 课）。
  example:
    cue: 'Мы не поехали за город, потому что было холодно.（改为无连接词复合句）'
    answer: 'Мы не поехали за город: было холодно.'
  items:
  - cue: Я видел людей, которые стояли в очереди.（改用形动词短语）
    accept:
    - Я видел людей, стоявших в очереди.
  - cue: Когда Наполеон вошёл в Москву, он ждал мира.（改用副动词短语）
    accept:
    - Войдя в Москву, Наполеон ждал мира.
    - Наполеон, войдя в Москву, ждал мира.
  - cue: Было очень холодно, поэтому занятия отменили.（用 [так… что]{.ru} 改写）
    accept:
    - Было так холодно, что занятия отменили.
  - cue: Люди, которые читали эту книгу, не могут её забыть.（用 [те, кто]{.ru} 改写）
    accept:
    - Те, кто читал эту книгу, не могут её забыть.
  - cue: Студенты не пришли на лекцию, потому что шёл сильный снег.（改为无连接词复合句）
    accept:
    - 'Студенты не пришли на лекцию: шёл сильный снег.'
  - cue: 'Профессор спросил студентов: «Вы прочитали статью?»（改为间接引语）'
    accept:
    - Профессор спросил студентов, прочитали ли они статью.
  - cue: 'Отец сказал сыну: «Помоги маме».（改为间接引语）'
    accept:
    - Отец сказал сыну, чтобы он помог маме.
    - Отец сказал сыну, чтобы тот помог маме.
  - cue: После того как фильм вышел, о режиссёре узнала вся страна.（把从句改成名词短语）
    accept:
    - После выхода фильма о режиссёре узнала вся страна.
  - cue: Байкал — самое глубокое озеро в мире.（用 [является]{.ru} 改写）
    accept:
    - Байкал является самым глубоким озером в мире.
    - Байкал является самым глубоким озером мира.
  - cue: Я хочу, чтобы мне дали отпуск, потому что я переезжаю.（改成申请书的说法，用 [Прошу]{.ru} 和 [в связи с]{.ru}）
    accept:
    - Прошу предоставить мне отпуск в связи с переездом.
    - Прошу дать мне отпуск в связи с переездом.
- id: e6
  type: open
  task: 俄译汉：把下面这段话译成汉语。
  points: 10
  passage: |
    ::: {.prose lang="ru"}
    В начале XVIII века Пётр Первый, мечтавший о выходе к Балтийскому морю, решил построить на Неве новый город. Место было, конечно, не самым удобным: кругом были болота, дул холодный ветер. И всё же уже в 1712 году Петербург стал главным городом России. Город строили тысячи людей, многие из которых так и не вернулись домой. Сегодня Петербург называют одним из самых красивых городов мира.
    :::
  items:
  - prompt: 译文要准确、通顺，插入语、形动词短语和 [который]{.ru} 从句按汉语的习惯处理。
    length: 120–160
    lines: 6
    model: 十八世纪初，一心想要打通波罗的海出海口的彼得一世决定在涅瓦河上建一座新城。那里当然算不上什么好地方：四周都是沼泽，冷风呼呼地刮。尽管如此，到 1712 年彼得堡就已经成了俄国的首都。建城的有成千上万的人，其中很多人再也没能回到家乡。如今，彼得堡被誉为世界上最美的城市之一。
    rubric:
    - 意思准确 6 分：五句话，第一、四句各 1.5 分，其余各 1 分；漏译、错译一处扣 1 分
    - 句法处理 2 分：[мечтавший о выходе к Балтийскому морю]{.ru} 译成定语或拆成分句都可以；[многие из которых так и не вернулись домой]{.ru} 要另起分句，并译出“终于没能”的意思；插入语 [конечно]{.ru} 和表示转折的 [и всё же]{.ru} 要译出来
    - 汉语通顺 2 分：用词恰当、没有病句给 2 分；有明显翻译腔的扣 1 分
    notes: 第一句主干是 [Пётр Первый решил построить]{.ru}，中间的形动词短语是背景，汉语放在“彼得一世”前作定语最自然。第三句 [главным городом]{.ru} 指首都。第四句 [Город строили тысячи людей]{.ru} 是宾语在前、主语在后的语序，述位是 [тысячи людей]{.ru}（第 31 课），不要译成“城市建造了成千上万的人”；[так и не вернулись]{.ru} 是完成体否定，表示想回而终于没回成（第 18 课）。第五句是不定人称句 [называют]{.ru}，译成“被誉为”或“人们称……为”。
