  passage_zh: |
    **家庭作业有必要吗？**

    每天晚上，几百万中小学生坐下来做功课。有的人一个小时就做完，有的人要伏案到深夜。近年来越来越常听到这样的问题：家庭作业到底有没有必要？

    有人认为，没有家庭作业就什么也学不会：课上讲的东西得自己复习，不然一个星期以后就全忘了。此外，家庭作业能教会孩子不靠大人帮助独立学习，合理利用自己的时间。

    另一些人不同意这种看法。他们认为，如今的中小学生本来就很忙：一天六七节课，还有兴趣小组、体育班。如果课后再做三个小时作业，就没有时间休息、运动和与家人交流了。持这种观点的人提醒说，欧洲有些国家作业留得很少，学生的成绩却非常好。

    还有第三种观点：问题不在于作业有多少，而在于作业是什么样的。一道让人想动脑筋的有趣题目，比十道枯燥的练习更有用。

    有一点是清楚的：家庭作业应该帮助孩子学习，而不是夺走他们的童年。您怎么看呢？
