    ::: {.prose lang="ru"}
    **Нужны ли домашние задания?**

    Каждый вечер миллионы школьников садятся за уроки. Одни делают их за час, другие сидят над учебниками до ночи. В последние годы всё чаще звучит вопрос: а нужны ли домашние задания вообще?

    Одни считают, что без домашней работы ничему не научишься: то, что объяснили на уроке, нужно повторить самому, иначе через неделю всё забудешь. Кроме того, домашние задания учат ребёнка работать без помощи взрослых и правильно использовать своё время.

    Другие с этим не согласны. Им кажется, что сегодняшние школьники и так очень заняты: шесть или семь уроков в день, кружки, секции. Если после этого ещё три часа делать уроки, на отдых, спорт и общение с семьёй времени не остаётся. Сторонники этой точки зрения напоминают, что в некоторых странах Европы домашних заданий задают совсем немного, а результаты у школьников очень высокие.

    Есть и третья точка зрения: дело не в том, сколько заданий, а в том, какие они. Одно интересное задание, над которым хочется подумать, полезнее десяти скучных упражнений.

    Ясно одно: домашние задания должны помогать учиться, а не забирать у детей детство. А как думаете вы?
    :::
  why: 第 1 题：第二段 [то, что объяснили на уроке, нужно повторить самому, иначе через неделю всё забудешь]{.ru}。第 2 题：第三段 [сегодняшние школьники и так очень заняты]{.ru}。第 3 题：[в некоторых странах Европы домашних заданий задают совсем немного, а результаты у школьников очень высокие]{.ru}，用来说明作业少也能学好。第 4 题：[дело не в том, сколько заданий, а в том, какие они]{.ru}，重要的是作业的质量。第 5 题：政论文常以设问开头、以向读者提问结尾：[А как думаете вы?]{.ru}（第 45 课）。
