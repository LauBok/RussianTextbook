lesson: B3-T2
heading: 期末测试
intro: 满分 150 分，建议用时 150 分钟。考查范围：第三册全册，第 31–60 课约占六成。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 单项选择。
  points: 1
  why: '第 1 题：形动词和被说明的名词同格，[с туристами]{.ru} 是复数第五格，形动词用 [приехавшими]{.ru}（第 2、7 课）。第 2 题：作谓语用短尾被动形动词，和复数主语 [билеты]{.ru} 一致：[проданы]{.ru}；长尾 [проданные]{.ru} 不能单独作谓语（第 5 课）。第 3 题：先到莫斯科、后打电话，用完成体副动词 [приехав]{.ru}；[приезжая]{.ru} 表示同时或反复，[приехавший]{.ru} 是形动词，不定式不能作状语（第 12 课）。第 4 题：[не спится]{.ru} 是无人称句，主体用第三格 [бабушке]{.ru}（第 16 课）。第 5 题：[нельзя]{.ru} + 未完成体不定式表示“不允许”，后面说“危险”，是禁止：[нельзя купаться]{.ru}；[нельзя искупаться]{.ru} 是“没法游”（第 18 课）。第 6 题：婉转的劝告用 [вы бы]{.ru} + 过去时形式 [взяли]{.ru}；[бы]{.ru} 后面不能用将来时、命令式或不定式（第 19 课）。第 7 题：年份前面有季节、月份或 [начало, конец]{.ru} 时用第二格：[осенью 1860 года]{.ru}；单说年份才用 [в 1860 году]{.ru}（第 56 课）。第 8 题：说的是城市普希金城，城市名按名词变格，第五格 [под Пушкином]{.ru}；[Пушкиным]{.ru} 是姓的第五格（第 27 课）。第 9 题：同等成分和同一个词发生关系，用同一个格；[знает]{.ru} 支配第四格，[английский, французский и китайский]{.ru} 都是第四格（同第一格），不受前面 [несколько языков]{.ru} 的第二格影响（第 32 课）。第 10 题：插入语 [по мнению]{.ru} + 第二格，[мнение]{.ru} 在 [по]{.ru} 后用第三格 [мнению]{.ru}（第 33 课）。第 11 题：主句里有 [так]{.ru} + 副词，从句用 [что]{.ru} 表示程度和结果；[так … как]{.ru} 表示方式（第 36 课）。第 12 题：指示词的格由主句决定，[помогать]{.ru} 支配第三格 [тем]{.ru}；[кто]{.ru} 的格由从句决定（第 37 课）。第 13 题：[кто]{.ru} 后面的动词按规范用阳性单数 [пришёл]{.ru}，即使前面是 [все]{.ru}（第 37 课）。第 14 题：转述请求用 [чтобы]{.ru} + 过去时形式 [купил]{.ru}（第 39 课）。第 15 题：申请书里 [Прошу]{.ru} 后面用完成体不定式 [принять]{.ru}（第 42 课）。第 16 题：[являться]{.ru} 后面用第五格 [учебником]{.ru}（第 43 课）。第 17 题：语气词 [же]{.ru} 强调显而易见的事，常带责备；[ли, бы]{.ru} 不能这样用，[разве]{.ru} 用在疑问句里，表示怀疑（第 48 课）。第 18 题：“和哥哥不同”用复合前置词 [в отличие от]{.ru} + 第二格 [брата]{.ru}；[благодаря]{.ru} 要求第三格，[по сравнению с]{.ru}、[в связи с]{.ru} 要求第五格，意思也不对（第 51 课）。第 19 题：[желать]{.ru} 支配 [кому чего]{.ru}，祝愿的内容用第二格 [здоровья]{.ru}；[желаю вам здоровье]{.ru} 是常见错误（第 49 课）。第 20 题：[не было ни одного]{.ru} 后面用第二格 [человека]{.ru}（第 53 课）。'
  items:
  - stem: Я разговаривал с туристами, ___ из Китая.
    options:
    - приехавшие
    - приехавших
    - приехавшими
    - приехавшим
    answer: приехавшими
  - stem: Все билеты на концерт уже ___.
    options:
    - проданы
    - продано
    - продана
    - проданные
    answer: проданы
  - stem: ___ в Москву, он сразу позвонил отцу.
    options:
    - Приезжая
    - Приехав
    - Приехавший
    - Приехать
    answer: Приехав
  - stem: Вчера ___ долго не спалось.
    options:
    - бабушка
    - бабушку
    - бабушкой
    - бабушке
    answer: бабушке
  - stem: 'Здесь нельзя ___: это опасно.'
    options:
    - купаться
    - искупаться
    - купается
    - искупается
    answer: купаться
  - stem: 'Вы бы ___ зонт: обещали дождь.'
    options:
    - возьмёте
    - возьмите
    - взяли
    - взять
    answer: взяли
  - stem: Художник родился осенью 1860 ___.
    options:
    - году
    - год
    - годом
    - года
    answer: года
  - stem: Летом мы жили на даче под ___, недалеко от Петербурга.
    options:
    - Пушкиным
    - Пушкином
    - Пушкине
    - Пушкина
    answer: Пушкином
  - stem: 'Он знает несколько языков: английский, ___ и китайский.'
    options:
    - французский
    - французского
    - французским
    - французском
    answer: французский
  - stem: По ___ историков, город появился в двенадцатом веке.
    options:
    - мнения
    - мнение
    - мнением
    - мнению
    answer: мнению
  - stem: Дождь шёл так сильно, ___ мы весь день сидели дома.
    options:
    - как
    - что
    - чтобы
    - где
    answer: что
  - stem: Врачи помогали ___, кто нуждался в помощи.
    options:
    - те
    - тех
    - тем
    - теми
    answer: тем
  - stem: Все, кто ___ на вечер, получили подарки.
    options:
    - пришёл
    - пришли
    - пришла
    - придут
    answer: пришёл
  - stem: Мама попросила, чтобы я ___ хлеба.
    options:
    - куплю
    - купить
    - купи
    - купил
    answer: купил
  - stem: Прошу ___ меня на работу на должность переводчика.
    options:
    - принимать
    - принять
    - приму
    - примите
    answer: принять
  - stem: Эта книга является ___ для студентов.
    options:
    - учебник
    - учебника
    - учебником
    - учебнику
    answer: учебником
  - stem: Ты ___ обещал прийти в семь!
    options:
    - же
    - ли
    - бы
    - разве
    answer: же
  - stem: ___ брата, Миша очень любит читать.
    options:
    - Благодаря
    - По сравнению с
    - В связи с
    - В отличие от
    answer: В отличие от
  - stem: Желаю вам ___!
    options:
    - здоровье
    - здоровья
    - здоровьем
    - здоровью
    answer: здоровья
  - stem: В аудитории не было ни одного ___.
    options:
    - человек
    - человеку
    - человека
    - человеком
    answer: человека
- id: e2
  type: fill
  task: 用括号里的词构成派生词，或写出它的正确形式填空。
  points: 1
  why: 第 1 题：由 [решить]{.ru} 构成动名词 [решение]{.ru}，作主语用第一格；原来的宾语 [вопрос]{.ru} 变成第二格 [вопроса]{.ru}（第 21 课）。第 2 题：动词结构 [открыли станцию]{.ru} 改成名词结构 [открытие станции]{.ru}，[после]{.ru} 后用第二格 [открытия]{.ru}（第 21、58 课）。第 3 题：[по]{.ru} 表示“……以后”时用第六格：[по приезде]{.ru}；[по приезду]{.ru} 是常见错误（第 54 课）。第 4 题：[сутки]{.ru} 只有复数，复数第二格 [суток]{.ru}，计数用集合数词 [двое суток]{.ru}（第 55 课）。第 5 题：[ножницы]{.ru} 只有复数，否定的 [не оказалось]{.ru} 后面用第二格，复数第二格是零词尾 [ножниц]{.ru}（第 53、55 课）。第 6 题：由形容词 [молодой]{.ru} 加 [-ость]{.ru} 构成 [молодость]{.ru}，阴性，[в]{.ru} 后用第六格 [молодости]{.ru}（第 21 课）。第 7 题：由外来名词 [журнал]{.ru} 加 [-ист]{.ru} 构成 [журналист]{.ru}，[работать]{.ru} 后用第五格 [журналистом]{.ru}（第 24 课）。第 8 题：[танцевать]{.ru} 现在时 [танцуют]{.ru}，主动形动词现在时 [танцующий]{.ru}，和 [девушка]{.ru} 一致用阴性 [танцующая]{.ru}（第 1、57 课）。第 9 题：[с … по …]{.ru} 表示时间段，[по]{.ru} 后面用第四格，年份是 [1890 год]{.ru}；[по 1890 году]{.ru} 是常见错误（第 56 课）。第 10 题：由 [терпение]{.ru} 构成带 [-лив-]{.ru} 的性质形容词 [терпеливый]{.ru}，和阳性的 [человек]{.ru} 一致（第 25 课）。
  items:
  - stem: ___ этого вопроса заняло два часа.
    hint: решить
    accept:
    - Решение
  - stem: После ___ новой станции метро ехать до центра стало быстрее.
    hint: открыть
    accept:
    - открытия
  - stem: По ___ в Москву сразу позвоните мне.
    hint: приезд
    accept:
    - приезде
  - stem: Мы ехали на поезде двое ___.
    hint: сутки
    accept:
    - суток
  - stem: В ящике стола не оказалось ___.
    hint: ножницы
    accept:
    - ножниц
  - stem: В ___ он много путешествовал.
    hint: молодой
    accept:
    - молодости
  - stem: Мой друг работает ___ в газете.
    hint: журнал
    accept:
    - журналистом
  - stem: Девушка, ___ на сцене, — моя сестра.
    hint: танцевать
    accept:
    - танцующая
  - stem: Он жил в Париже с 1888 по 1890 ___.
    hint: год
    accept:
    - год
  - stem: Он очень ___ человек.
    hint: терпение
    accept:
    - терпеливый
- id: e3
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1
  why: 第 1 空：形动词短语说明 [выставка]{.ru}，和它同格，用第一格 [посвящённая]{.ru}；[посвятить]{.ru} 要求 [чему]{.ru}（第 4、34 课）。第 2 空：[министр… директора… художники]{.ru} 是三个同等主语，谓语用复数 [присутствовали]{.ru}；[присутствующие]{.ru} 是名词化的形动词，不能作谓语（第 8、32 课）。第 3 空：复合前置词 [в течение]{.ru} 词尾是 [-е]{.ru}，[в течении]{.ru} 是最常见的错误；[во время]{.ru} 后接事件，不接时间长度（第 51 课）。第 4 空：[два, три, четыре]{.ru} 后面的阳性名词前，形容词用复数第二格：[три больших зала]{.ru}（第 52 课）。第 5 空：形动词说明的是复数第二格 [картин]{.ru}，和它一致用 [привезённых]{.ru}；画是被运来的，用被动形动词（第 4、7 课）。第 6 空：新闻里常用短尾被动形动词作谓语，和 [многие из них]{.ru}（复数）一致：[показаны]{.ru}（第 44 课）。第 7 空：“由……组成”是 [состоять из]{.ru} + 第二格；[включает]{.ru} 和 [делится на]{.ru} 不接 [из]{.ru}，[является]{.ru} 要求第五格（第 43 课）。第 8 空：[в]{.ru} + 第六格表示年代：[в 1870–1890-х годах]{.ru}；年代用复数，不能说 [в … году]{.ru}（第 56 课）。第 9 空：同位语和被说明的 [Саврасова]{.ru} 同格，用第二格 [знаменитого]{.ru}（第 34 课）。第 10 空：同等成分和 [из музеев]{.ru} 里的城市名一样用第二格：[Петербурга, Казани, Ярославля]{.ru}（第 32 课）。第 11 空：[по сравнению с]{.ru} + 第五格表示比较；[в отличие от]{.ru} 要求第二格，[благодаря]{.ru} 要求第三格，[в связи с]{.ru} 意思不对（第 51 课）。第 12 空：插入语 [по словам]{.ru} + 第二格，说明消息来源（第 33 课）。第 13 空：[настолько]{.ru} + 长尾形容词第五格 [большим]{.ru}，从句用 [что]{.ru}；[так]{.ru} 后面要用短尾，[такой]{.ru} 要和形容词一致（第 36 课）。第 14 空：[почти не осталось]{.ru} 是否定的无人称句，[мест]{.ru} 用第二格，动词用中性 [осталось]{.ru}，不和名词一致（第 16、53 课）。第 15 空：转述时时态不变，原话说将来的事，间接引语里也用将来时 [будет работать]{.ru}（第 39 课）。第 16 空：[для]{.ru} 要求第二格，指示词的格由主句决定：[для тех]{.ru}（第 37 课）。第 17 空：[кто]{.ru} 后的动词用单数 [может]{.ru}（第 37 课）。第 18 空：“每逢星期一”是 [по]{.ru} + 第三格复数 [по понедельникам]{.ru}（第 54 课）。第 19 空：[по]{.ru} 表示“……以后”时用第六格：[по окончании выставки]{.ru}（第 54 课）。第 20 空：背景介绍里用短尾被动形动词，和阴性的 [галерея]{.ru} 一致：[была основана]{.ru}（第 5、44 课）。
  items:
  - options:
    - посвящённой
    - посвящённая
    - посвящённую
    - посвящённый
    answer: посвящённая
  - options:
    - присутствовали
    - присутствовал
    - присутствовало
    - присутствующие
    answer: присутствовали
  - options:
    - В течении
    - Во время
    - В течение
    - Через
    answer: В течение
  - options:
    - большие
    - большого
    - большой
    - больших
    answer: больших
  - options:
    - привезённых
    - привезённые
    - привезённым
    - привезёнными
    answer: привезённых
  - options:
    - показано
    - показана
    - показаны
    - показанные
    answer: показаны
  - options:
    - является
    - включает
    - делится
    - состоит
    answer: состоит
  - options:
    - годы
    - годах
    - году
    - годов
    answer: годах
  - options:
    - знаменитый
    - знаменитого
    - знаменитому
    - знаменитым
    answer: знаменитого
  - options:
    - Ярославль
    - Ярославлю
    - Ярославлем
    - Ярославля
    answer: Ярославля
  - options:
    - По сравнению с
    - В отличие от
    - Благодаря
    - В связи с
    answer: По сравнению с
  - options:
    - По слову
    - По словами
    - По словам
    - По словах
    answer: По словам
  - options:
    - настолько
    - так
    - такой
    - столько
    answer: настолько
  - options:
    - остались
