    ::: {.prose lang="ru"}
    **Матрёшка**

    Матрёшка — это деревянная игрушка в виде девушки в русском платке. Она открывается, и внутри неё находится вторая игрушка, поменьше, внутри второй — третья, и так до самой маленькой. Обычно в матрёшке от трёх до десяти игрушек, но бывают и такие, в которых их больше пятидесяти.

    Многие считают матрёшку очень старой русской игрушкой, но на самом деле она появилась только в конце XIX века. По одной из версий, идею привезли из Японии: там была похожая игрушка в виде старика, внутри которой находились игрушки поменьше. Первую русскую матрёшку сделали в Москве в последние годы XIX века. В ней было восемь игрушек: девочки и мальчики разного возраста, а самая маленькая изображала ребёнка.

    Название игрушки происходит от женского имени, которое в то время было одним из самых распространённых в русских деревнях. Поэтому матрёшку часто называют символом русской семьи.

    В 1900 году матрёшку показали на Всемирной выставке в Париже, где она получила медаль. После этого её стали делать во многих городах России. Сегодня матрёшка — самый популярный русский сувенир. Её рисуют по-разному: в виде героев сказок, известных писателей и даже футболистов.
    :::
  why: 第 1 题：第一段给出定义：[деревянная игрушка… внутри неё находится вторая игрушка, поменьше]{.ru}（[X — это Y]{.ru} 是科学语体的定义句，第 43 课）。第 2 题：[на самом деле она появилась только в конце XIX века]{.ru}，“很古老”是很多人的误解。第 3 题：[По одной из версий, идею привезли из Японии]{.ru}；[по одной из версий]{.ru} 说明这只是一种说法。第 4 题：[Название игрушки происходит от женского имени]{.ru}。第 5 题：[В 1900 году матрёшку показали на Всемирной выставке в Париже, где она получила медаль]{.ru}；第一个套娃是在莫斯科做的，有八个。
