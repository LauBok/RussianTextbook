    **爷爷的吉他**

    爷爷去世以后，爸爸妈妈决定把他的旧吉他卖给邻居。这把吉他在客厅的墙上已经挂了四十年，早就没人弹了。“地方小，又没人弹。”父亲说。

    十二岁的米沙一声不吭地听着。他记得，晚上爷爷常常把吉他从墙上取下来，唱起老歌，米沙坐在旁边跟着一起唱。难道现在吉他要被外人拿走了吗？难道再也没有人用它弹爷爷最爱的那首歌了吗？

    晚上大家都睡了，米沙悄悄走进客厅，把吉他从墙上取下来。琴弦都旧了，有一根完全不响了。米沙想起去年冬天爷爷教他的那首歌的开头，试着弹了起来。弹得不好，可他没有停下。

    第二天邻居打来电话，说不要这把吉他了。一个星期以后，父亲下班回家，听见客厅里传来熟悉的旋律。他在走廊里站了很久，大衣也没脱。后来他走进房间说：“明天去买新琴弦。吉他留下了。”
