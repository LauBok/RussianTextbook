  passage: |
    ::: {.prose lang="ru"}
    **В Москве начала работать выставка русского пейзажа**

    *В Третьяковской галерее показывают более трёхсот картин из двадцати музеев страны*

    МОСКВА, 15 сентября. Вчера в Третьяковской галерее начала работать выставка «Русский пейзаж», (1) []{.blank} пейзажу XIX века. На открытии (2) []{.blank} министр культуры, директора музеев и известные художники.

    Сотрудники галереи готовили эту выставку (3) []{.blank} двух лет. Она занимает три (4) []{.blank} зала. Здесь можно увидеть более трёхсот картин, (5) []{.blank} из двадцати музеев России. Многие из них (6) []{.blank} в Москве впервые.

    Выставка (7) []{.blank} из трёх частей: в первой — работы начала века, во второй — его середины, в третьей — картины, написанные в 1870–1890-х (8) []{.blank}. Здесь есть картины Саврасова, (9) []{.blank} художника, и его учеников. Картины привезли из музеев Петербурга, Казани, (10) []{.blank} и других городов.

    Эта выставка — самая большая (11) []{.blank} прошлыми выставками галереи. (12) []{.blank} директора галереи, интерес к ней оказался (13) []{.blank} большим, что в первый день свободных мест в залах почти не (14) []{.blank}. Директор сообщил, что выставка (15) []{.blank} до конца января. Для (16) []{.blank}, кто не (17) []{.blank} прийти в галерею, на сайте музея можно посмотреть фильм о выставке.

    Галерея открыта с 10 до 18 часов, (18) []{.blank} понедельникам — выходной. По (19) []{.blank} выставки картины вернутся в музеи.

    Справка. Третьяковская галерея была (20) []{.blank} в 1856 году. Сегодня это один из самых известных музеев России.
    :::
  passage_zh: |
    **莫斯科举办俄罗斯风景画展**

    *特列季亚科夫画廊展出来自全国二十家博物馆的三百多幅画作*

    莫斯科，9 月 15 日。昨天，特列季亚科夫画廊开幕了一个名为“俄罗斯风景”的展览，展出的是十九世纪的风景画。文化部长、各博物馆馆长和著名画家出席了开幕式。

    画廊的工作人员为这次展览准备了两年。展览占了三个大厅。在这里可以看到从俄罗斯二十家博物馆运来的三百多幅画作，其中很多是第一次在莫斯科展出。

    展览分为三个部分：第一部分是十九世纪初的作品，第二部分是世纪中叶的，第三部分是十九世纪七十至九十年代创作的画。这里有著名画家萨符拉索夫和他的学生们的画。画作来自彼得堡、喀山、雅罗斯拉夫尔等城市的博物馆。

    同画廊以往的展览相比，这次展览规模最大。据画廊馆长说，人们对展览的兴趣之大，开幕第一天展厅里几乎没有空位。馆长说，展览将持续到一月底。不能来画廊的观众可以在博物馆网站上观看介绍展览的影片。

    画廊 10 点至 18 点开放，每周一闭馆。展览结束后，画作将送回各博物馆。

    背景：特列季亚科夫画廊创建于 1856 年，如今是俄罗斯最著名的博物馆之一。
- id: e4a
