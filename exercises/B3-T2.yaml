    ::: {.prose lang="ru"}
    **Гитара деда**

    Когда деда не стало, родители решили продать его старую гитару соседу. Она висела на стене в гостиной уже сорок лет, и на ней давно никто не играл. «Места мало, а играть на ней некому», — сказал отец.

    Миша, которому было двенадцать лет, слушал этот разговор молча. Он помнил, как по вечерам дед снимал гитару со стены и пел старые песни, а Миша, сидя рядом, пел вместе с ним. Неужели теперь гитару заберут чужие люди? Неужели больше никто никогда не сыграет на ней любимую песню деда?

    Вечером, когда все легли спать, Миша тихо вошёл в гостиную и снял гитару со стены. Струны были старые, одна из них совсем не звучала. Миша вспомнил начало песни, которое дед показал ему прошлой зимой, и попробовал его сыграть. Получилось плохо, но он не остановился.

    На следующий день сосед позвонил и сказал, что гитара ему не нужна. А через неделю отец, вернувшись с работы, услышал из гостиной знакомую мелодию. Он долго стоял в коридоре, не снимая пальто. Потом вошёл в комнату и сказал: «Завтра купим новые струны. Гитара остаётся».
    :::
  why: 第 1 题：第一段父亲说 [Места мало, а играть на ней некому]{.ru}，而且 [на ней давно никто не играл]{.ru}。第 2 题：第二段 [по вечерам дед снимал гитару со стены и пел старые песни]{.ru}。第 3 题：第二段末尾两个 [Неужели…?]{.ru} 问句没有引号，也没有“他想”这样的引导词，是用第三人称叙述直接写出米沙心里的话，这就是准直接引语（第 39 课）。第 4 题：[он позвонил и сказал, что гитара ему не нужна]{.ru}。第 5 题：父亲听见儿子在弹，决定 [Завтра купим новые струны. Гитара остаётся]{.ru}。
