lesson: L77
grammar: "[хоте́л бы]{.ru} 表示客气的愿望；[зака́зывать / заказа́ть]{.ru} 的体的对立。"
exercises:

  - id: e1
    type: choice
    task: 选择 [хоте́л бы]{.ru} 的正确形式。
    why: "[хоте́л]{.ru} 是过去时形式，要跟主语的性和数一致：男性 [хоте́л]{.ru}，女性 [хоте́ла]{.ru}，复数和 [вы]{.ru} 用 [хоте́ли]{.ru}。第 1 题说话人是王磊，第 2 题是安娜，第 5 题主语 [я]{.ru} 指的是玛丽亚·尼古拉耶夫娜，都要按说话人的性别选择。"
    items:
      - stem: Ван Лэй — Я ___ попро́бовать борщ.
        options: [хоте́л бы, хоте́ла бы, хоте́ли бы]
        answer: хоте́л бы
      - stem: А́нна — Я ___ блины́ со смета́ной.
        options: [хоте́л бы, хоте́ла бы, хоте́ли бы]
        answer: хоте́ла бы
      - stem: Мы ___ заказа́ть сто́лик на ве́чер.
        options: [хоте́л бы, хоте́ла бы, хоте́ли бы]
        answer: хоте́ли бы
      - stem: Что вы ___ заказа́ть?
        options: [хоте́л бы, хоте́ла бы, хоте́ли бы]
        answer: хоте́ли бы
      - stem: Мари́я Никола́евна — Я ___ ры́бу и сала́т.
        options: [хоте́л бы, хоте́ла бы, хоте́ли бы]
        answer: хоте́ла бы

  - id: e2
    type: choice
    task: 选择 [зака́зывать]{.ru} 或 [заказа́ть]{.ru} 的正确形式。
    why: 第 1 题有 [ча́сто]{.ru}，是经常做的事，用未完成体；第 3 题是服务员的固定问法 [Что вы бу́дете зака́зывать?]{.ru}，也用未完成体。第 2 题说点了的结果，第 4 题有 [за́втра]{.ru}，是将来点一次，第 5 题和 [хоте́л бы]{.ru} 连用说要点一样东西，都用完成体。
    items:
      - stem: В Пеки́не я ча́сто ___ борщ.
        options: [зака́зывал, заказа́л]
        answer: зака́зывал
      - stem: На десе́рт Ми́ша ___ торт.
        options: [зака́зывал, заказа́л]
        answer: заказа́л
      - stem: Что вы бу́дете ___?
        options: [зака́зывать, заказа́ть]
        answer: зака́зывать
      - stem: За́втра я ___ пельме́ни.
        options: [зака́зываю, закажу́]
        answer: закажу́
      - stem: Я хоте́л бы ___ сала́т.
        options: [зака́зывать, заказа́ть]
        answer: заказа́ть

  - id: e3
    type: rewrite
    task: 按例句把直接的要求改成客气的说法。
    example:
      cue: Я хочу́ борщ. (Ван Лэй)
      answer: Я хоте́л бы борщ.
    why: "[хочу́]{.ru} 换成 [хоте́л бы]{.ru}，[хоти́м]{.ru} 换成 [хоте́ли бы]{.ru}。注意括号里的说话人：女性要用 [хоте́ла бы]{.ru}。后面的不定式或名词第四格不变。"
    items:
      - cue: Я хочу́ заказа́ть пельме́ни. (Ван Лэй)
        accept: ["Я хоте́л бы заказа́ть пельме́ни."]
      - cue: Я хочу́ блины́. (А́нна)
        accept: ["Я хоте́ла бы блины́."]
      - cue: Мы хоти́м заказа́ть сто́лик. (Петро́вы)
        accept: ["Мы хоте́ли бы заказа́ть сто́лик."]
      - cue: Я хочу́ попро́бовать морс. (Мари́я Никола́евна)
        accept: ["Я хоте́ла бы попро́бовать морс."]

  - id: e4
    type: fill
    task: 写出动词的正确形式。
    why: "[заказа́ть]{.ru} 变位有辅音交替 [з → ж]{.ru}，第一人称单数重音在词尾（[закажу́]{.ru}），其余人称重音前移（[зака́жешь, зака́жем]{.ru}）。[зака́зывать]{.ru} 是第一变位，重音一直在 [-ка́-]{.ru} 上。完成体变位形式表示将来。"
    items:
      - stem: Сейча́с я ___ десе́рт.
        hint: заказа́ть
        accept: ["закажу́"]
      - stem: Что ты ___?
        hint: заказа́ть
        accept: ["зака́жешь"]
      - stem: Мы всегда́ ___ здесь пельме́ни.
        hint: зака́зывать
        accept: ["зака́зываем"]
      - stem: Вчера́ А́нна ___ блины́.
        hint: заказа́ть
        accept: ["заказа́ла"]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1、2 题是客气的愿望，用 [хоте́л(а) бы]{.ru}；第 3 题是一次的结果，第 4 题是经常的事，注意体的选择。
    items:
      - zh: 我（男）想尝尝俄式饺子。
        accept: ["Я хоте́л бы попро́бовать пельме́ни.", "Я хоте́л бы попро́бовать ру́сские пельме́ни."]
        rubric: ["[хоте́л бы]{.ru}，男性", "[попро́бовать]{.ru} 用完成体不定式"]
      - zh: 我（女）想点罗宋汤和沙拉。
        accept: ["Я хоте́ла бы заказа́ть борщ и сала́т.", "Я хоте́ла бы борщ и сала́т."]
        rubric: ["[хоте́ла бы]{.ru}，女性", "[заказа́ть]{.ru} 用完成体"]
      - zh: 米沙点了冰激凌。
        accept: ["Ми́ша заказа́л моро́женое."]
        rubric: ["结果用完成体 [заказа́л]{.ru}"]
      - zh: 我们在这家餐厅总是点薄饼。
        accept: ["В э́том рестора́не мы всегда́ зака́зываем блины́.", "Мы всегда́ зака́зываем блины́ в э́том рестора́не.", "В э́том рестора́не мы всегда́ берём блины́.", "Мы в э́том рестора́не всегда́ зака́зываем блины́."]
        rubric: ["经常的事用未完成体 [зака́зываем]{.ru}", "[в э́том рестора́не]{.ru} 用第六格"]

  - id: e6
    type: open
    task: 情景对话：你和朋友在一家俄餐馆吃饭，向服务员点菜。
    items:
      - prompt: 用上 [Что вы бу́дете зака́зывать?]{.ru}、[хоте́л(а) бы]{.ru}、[закажу́]{.ru} 或 [возьму́]{.ru}、[Да́йте, пожа́луйста…]{.ru}、[Счёт, пожа́луйста!]{.ru}
        length: 60–90
        model: "— До́брый ве́чер! Вот меню́. Что вы бу́дете зака́зывать?\n— Я хоте́л бы попро́бовать борщ. А пото́м пельме́ни.\n— А я возьму́ ры́бу и сала́т.\n— Что вы бу́дете пить?\n— Да́йте, пожа́луйста, чай.\n— А мне морс.\n— Бу́дете зака́зывать десе́рт?\n— Да. Я закажу́ моро́женое.\n…\n— Счёт, пожа́луйста!"
        rubric: ["服务员的问句用未完成体 [бу́дете зака́зывать]{.ru}", "顾客用 [хоте́л(а) бы]{.ru}、[возьму́]{.ru}、[закажу́]{.ru} 说要点的菜", "[хоте́л бы]{.ru} 和说话人的性别一致", "菜名用第四格"]
        notes: 范文按餐厅里的顺序写：服务员递菜单并问点什么——主菜——饮料——甜点——结账。顾客的说法有三种：[Я хоте́л бы…]{.ru} 最客气，[Я возьму́…]{.ru}、[Я закажу́…]{.ru} 直接说决定，[А мне…]{.ru} 是口语里的省略说法。服务员的问话都用未完成体将来时 [бу́дете]{.ru} 加不定式。
