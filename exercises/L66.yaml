lesson: L66
grammar: "表示方位的前置词 [над, под, пе́ред, за, ме́жду, ря́дом с]{.ru} + 第五格；[пе́ред]{.ru} 表示时间；[за, под]{.ru} 表示位置用第五格、表示方向用第四格。"
exercises:

  - id: e1
    type: choice
    task: 根据意思选择前置词。
    why: "[над]{.ru} 是在上方、不接触，[под]{.ru} 是在下面，[пе́ред]{.ru} 是在前面，[за]{.ru} 是在后面或在桌旁，[ме́жду]{.ru} 后面要有两样东西。第 5 题 [шка́фом]{.ru} 以 [ш]{.ru} 加辅音开头，前置词写成 [со]{.ru}。"
    items:
      - stem: Ла́мпа гори́т ___ столо́м.
        options: [над, под, ме́жду]
        answer: над
      - stem: Му́рка спит ___ крова́тью.
        options: [над, под, ме́жду]
        answer: под
      - stem: Ван Лэй стои́т ___ шка́фом и и́щет кни́гу.
        options: [пе́ред, ме́жду, над]
        answer: пе́ред
      - stem: Холоди́льник стои́т ___ окно́м и плито́й.
        options: [пе́ред, ме́жду, за]
        answer: ме́жду
      - stem: Батаре́я ря́дом ___ шка́фом.
        options: [с, со]
        answer: со
      - stem: Мы сиди́м ___ столо́м и за́втракаем.
        options: [за, над, ме́жду]
        answer: за

  - id: e2
    type: fill
    task: 把括号里的词变成第五格。
    why: 这几个前置词后面都用第五格。第 4 题形容词和名词都要变：[больши́м до́мом]{.ru}；第 5 题人称代词 [мы]{.ru} 变成 [на́ми]{.ru}；第 6 题 [крова́ть]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，变 [-ью]{.ru}，指示代词随之用阴性 [э́той]{.ru}。
    items:
      - stem: Мяч под ___.
        hint: стол
        accept: [столо́м]
      - stem: Над ___ виси́т фо́то.
        hint: дива́н
        accept: [дива́ном]
      - stem: Пе́ред ___ я пью ко́фе.
        hint: уро́к
        accept: [уро́ком]
      - stem: За ___ есть ма́ленький парк.
        hint: наш большо́й дом
        accept: [на́шим больши́м до́мом]
      - stem: Му́рка лю́бит сиде́ть над ___.
        hint: мы
        accept: [на́ми]
      - stem: Под ___ лежи́т ста́рый мяч.
        hint: э́та крова́ть
        accept: [э́той крова́тью]
      - stem: Ря́дом с ___ есть кафе́.
        hint: на́ша поликли́ника
        accept: [на́шей поликли́никой]

  - id: e3
    type: choice
    task: 选择第五格或第四格。
    why: 回答 [где]{.ru}（在哪里）用第五格，回答 [куда́]{.ru}（往哪里）用第四格。第 2、4 题有“放”“去”的方向，用第四格；第 1、3 题是静止的位置，用第五格。
    items:
      - stem: Мы сиди́м за ___.
        options: [стол, столо́м]
        answer: столо́м
      - stem: За́втрак на столе́. Тепе́рь за ___!
        options: [стол, столо́м]
        answer: стол
      - stem: Су́мка стои́т под ___.
        options: [крова́ть, крова́тью]
        answer: крова́тью
      - stem: Ми́ша ста́вит су́мку под ___.
        options: [крова́ть, крова́тью]
        answer: крова́ть

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题“上方”用 [над]{.ru}，不用 [на]{.ru}。第 3 题“在……之间”的两个名词都用第五格。第 4 题“饭前”用 [пе́ред]{.ru} 表示时间。
    items:
      - zh: 桌子上方亮着灯。
        accept: ["Над столо́м гори́т ла́мпа.", "Ла́мпа гори́т над столо́м."]
        rubric: ["[над]{.ru} + 第五格 [столо́м]{.ru}", "动词 [горе́ть]{.ru}"]
      - zh: 猫坐在桌子底下，等香肠。
        accept: ["Ко́шка сиди́т под столо́м и ждёт колбасу́.", "Му́рка сиди́т под столо́м и ждёт колбасу́."]
        rubric: ["[под столо́м]{.ru}", "[ждать]{.ru} + 第四格 [колбасу́]{.ru}"]
      - zh: 冰箱在窗户和炉子之间。
        accept: ["Холоди́льник ме́жду окно́м и плито́й.", "Холоди́льник стои́т ме́жду окно́м и плито́й."]
        rubric: ["[ме́жду]{.ru} 后两个名词都用第五格：[окно́м]{.ru}、[плито́й]{.ru}"]
      - zh: 饭前我们在书柜前站着聊天。
        accept: ["Пе́ред обе́дом мы стои́м пе́ред кни́жным шка́фом и разгова́риваем.", "Пе́ред обе́дом мы стои́м пе́ред кни́жным шка́фом и говори́м.", "Пе́ред у́жином мы стои́м пе́ред кни́жным шка́фом и разгова́риваем.", "Пе́ред у́жином мы стои́м пе́ред кни́жным шка́фом и говори́м."]
        rubric: ["表示时间的 [пе́ред]{.ru} + 第五格", "[пе́ред кни́жным шка́фом]{.ru}，形容词也用第五格"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 描写你的房间：家具和东西都在哪里。50–80 词，至少用上四个本课的前置词。
        length: 50–80
        model: |
          Моя́ ко́мната ма́ленькая, но све́тлая. Ря́дом с окно́м стои́т стол. Над столо́м виси́т ла́мпа, а под столо́м стои́т моя́ су́мка. За столо́м я занима́юсь и пишу́ пи́сьма. Ме́жду столо́м и крова́тью стои́т кни́жный шкаф. На ве́рхней по́лке мои́ словари́. Пе́ред крова́тью стои́т стул. Под окно́м батаре́я, и в ко́мнате всегда́ тепло́.
        rubric: ["至少四个不同的前置词 + 第五格", "[над]{.ru} 与 [на]{.ru} 不混用", "[ме́жду]{.ru} 后两个名词都用第五格"]
        notes: 范文从窗户开始，按位置顺序一件件说，每句一个方位。[стои́т]{.ru} 用于立着放的家具和东西，[лежи́т]{.ru} 用于平放的东西，[виси́т]{.ru} 用于挂着的东西；只说位置时也可以不用动词，如 [Под окно́м батаре́я]{.ru}。
