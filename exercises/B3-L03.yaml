lesson: B3-L03
grammar: "被动形动词现在时：未完成体及物动词复数第一人称 + 形容词词尾（[управля́ем → управля́емый]{.ru}，[прово́дим → проводи́мый]{.ru}）；动作发出者用第五格；与 [кото́рый]{.ru} 从句的互换。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Где и когда родился Юрий Гагарин? Где он впервые поднялся в небо? Какие требования были к будущим космонавтам? Что Гагарин делал во время полёта? Какой праздник отмечают 12 апреля?]{.ru}"
        length: 50–80
        model: "Юрий Гагарин родился 9 марта 1934 года в деревне Клушино Смоленской области. Впервые он поднялся в небо в Саратове: когда он учился в техникуме, он записался в аэроклуб. Будущий космонавт должен был иметь крепкое здоровье, небольшой рост и спокойный характер. Во время полёта Гагарин наблюдал за приборами, передавал на Землю сообщения и описывал то, что видел в иллюминатор. 12 апреля отмечают День космонавтики, а во всём мире — Международный день полёта человека в космос."
        rubric: ["五个问题都回答，日期、地名准确", "[наблюдать за чем]{.ru} 支配正确", "用完整的句子"]
        notes: 第 2 题要答出地点和原因（在萨拉托夫上中专时参加了航空俱乐部）。第 4 题注意 [наблюдать]{.ru} 要求 [за]{.ru} + 第五格：[наблюдал за приборами]{.ru}。

  - id: e2
    type: rewrite
    task: 用被动形动词现在时改写，把 [который]{.ru} 从句变成形动词短语。
    example:
      cue: Корабль, которым управляет автоматика.
      answer: Корабль, управляемый автоматикой.
    why: "转换分三步：从句的宾语就是被修饰的名词，形动词和它的性、数、格一致；从句的主语变成第五格；从句的动词变成被动形动词现在时。第 1 题 [любим → любимый]{.ru}，注意重音移动：[лю́бим]{.ru}，但 [люби́мый]{.ru}。第 4 题 [мы]{.ru} 泛指，变成第五格 [нами]{.ru} 显得累赘，一般省去。第 5 题 [передавать]{.ru} 以 [-авать]{.ru} 结尾，形动词保留 [-ва-]{.ru}：[передаваемые]{.ru}。"
    items:
      - cue: Артист, которого любят зрители.
        accept: ["Артист, любимый зрителями."]
      - cue: Проблема, которую изучают учёные.
        accept: ["Проблема, изучаемая учёными."]
      - cue: Учитель, которого уважают студенты.
        accept: ["Учитель, уважаемый студентами."]
      - cue: Звёзды, которые мы видим с Земли.
        accept: ["Звёзды, видимые с Земли.", "Звёзды, видимые нами с Земли."]
      - cue: Сообщения, которые передаёт космонавт.
        accept: ["Сообщения, передаваемые космонавтом."]

  - id: e3
    type: fill
    task: 用括号里动词的被动形动词现在时填空，注意性、数、格。
    why: "先找被修饰的名词，再定形动词的性、数、格。第 1 题 [подготовка]{.ru} 阴性第一格 → [проводимая]{.ru}。第 2 题 [на корабле]{.ru} 阳性第六格 → [управляемом]{.ru}。第 3 题 [Земля]{.ru} 阴性第一格 → [видимая]{.ru}。第 4 题 [о героях]{.ru} 复数第六格 → [уважаемых]{.ru}。第 5 题 [сообщения]{.ru} 复数第一格 → [передаваемые]{.ru}，保留 [-ва-]{.ru}。"
    items:
      - stem: Подготовка, ___ врачами и инженерами, была тяжёлой.
        hint: проводить
        accept: ["проводимая"]
      - stem: Гагарин летел на корабле, ___ автоматикой.
        hint: управлять
        accept: ["управляемом"]
      - stem: Земля, ___ из космоса, удивительно красива.
        hint: видеть
        accept: ["видимая"]
      - stem: Мы много читали о героях, ___ всей страной.
        hint: уважать
        accept: ["уважаемых"]
      - stem: Сообщения, ___ космонавтом, слушали инженеры.
        hint: передавать
        accept: ["передаваемые"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "被修饰的名词是动作的对象（“被……的”），用被动形动词；名词自己发出动作，用主动形动词。第 1 题飞船是被操纵的对象（[с Земли]{.ru} 说明从哪里操纵），用 [управляемый]{.ru}；[управляющий]{.ru}、[управлявший]{.ru} 是“操纵（别的东西）的”，飞船并不操纵别的东西。第 2 题“我心爱的作家”，作家是被爱的对象，[любимый]{.ru} 已经形容词化；[любящий]{.ru} 是“爱（别人）的”。第 3 题有第五格 [учёными]{.ru} 表示动作发出者，这是被动形动词的标志，用 [решаемая]{.ru}。第 4 题学生自己在学习，用主动形动词 [изучающие]{.ru}。"
    items:
      - stem: Корабль, ___ с Земли, облетел планету.
        options: [управляемый, управляющий, управлявший]
        answer: управляемый
      - stem: Это мой ___ писатель.
        options: [любящий, любимый, любивший]
        answer: любимый
      - stem: Задача, ___ учёными, очень сложная.
        options: [решающая, решавшая, решаемая]
        answer: решаемая
      - stem: Студенты, ___ русский язык, часто читают о Гагарине.
        options: [изучаемые, изучающие, изучаемых]
        answer: изучающие

  - id: e5
    type: translate
    task: 翻译下列句子，用被动形动词现在时。
    items:
      - zh: 由自动装置操纵的飞船绕地球飞行了一周。
        accept: ["Корабль, управляемый автоматикой, облетел Землю.", "Управляемый автоматикой корабль облетел Землю.", "Корабль, управляемый автоматикой, один раз облетел Землю."]
        rubric: ["[управляемый автоматикой]{.ru}：形动词与 [корабль]{.ru} 一致，发出者用第五格", "[облетел Землю]{.ru}：[облететь]{.ru} 直接接第四格"]
      - zh: 加加林是全国最受尊敬的英雄之一。
        accept: ["Гагарин — один из самых уважаемых героев страны.", "Гагарин — один из самых уважаемых героев в стране.", "Гагарин был одним из самых уважаемых героев страны."]
        rubric: ["[один из самых уважаемых героев]{.ru}：[один из]{.ru} + 复数第二格", "[уважаемых]{.ru} 和 [героев]{.ru} 一致"]
      - zh: 从太空看到的地球非常美。
        accept: ["Земля, видимая из космоса, удивительно красива.", "Земля, видимая из космоса, очень красива.", "Видимая из космоса Земля очень красива.", "Видимая из космоса Земля удивительно красива."]
        rubric: ["[видимая из космоса]{.ru}：阴性第一格，与 [Земля]{.ru} 一致", "形动词短语在名词后面要用逗号隔开，在名词前面不用逗号"]

  - id: e6
    type: open
    task: 段落缩写。按提纲把课文压缩成一段。
    items:
      - prompt: 提纲：童年；学习与第一次飞行；选拔与训练；1961 年 4 月 12 日的飞行；后人的纪念。每项一到两句，关键日期保留，至少用一处被动形动词现在时。
        length: 120–150
        model: "Юрий Гагарин родился в 1934 году в деревне Клушино. Его детство пришлось на годы войны: деревню заняли немецкие войска. После войны семья переехала в Гжатск. Юрий учился в ремесленном училище, а потом в техникуме в Саратове, где записался в аэроклуб и впервые поднялся в небо. После военного авиационного училища он служил лётчиком на Севере. В 1960 году его выбрали в группу из двадцати будущих космонавтов. Подготовка, проводимая врачами и инженерами, была тяжёлой, но он её выдержал. 12 апреля 1961 года Гагарин стал первым человеком в космосе. Перед стартом он сказал знаменитое слово «Поехали!». Корабль «Восток», управляемый автоматикой, облетел Землю за 108 минут. Улыбку Гагарина узнал весь мир. Гагарин погиб в 1968 году, но память о нём жива: город Гжатск носит его имя, а 12 апреля в России отмечают День космонавтики."
        rubric: ["提纲五项都有，顺序与课文一致", "日期准确：1934、1960、1961 年 4 月 12 日、1968", "至少一处被动形动词现在时，形动词与名词一致、发出者用第五格", "120–150 词"]
        notes: 范文约 125 词。次要细节（父母的职业、飞行中的具体工作、各国的欢迎）都省去了，每段经历只留一句。用了两个本课的形动词短语：[проводимая врачами и инженерами]{.ru}、[управляемый автоматикой]{.ru}。[пришлось на годы войны]{.ru}（正赶上战争年代）、[носит его имя]{.ru}（以他的名字命名）是缩写时常用的概括说法。
