lesson: L44
grammar: 体对的三种构成方法：加前缀（[чита́ть — прочита́ть]{.ru}）、换后缀（[расска́зывать — рассказа́ть]{.ru}、[покупа́ть — купи́ть]{.ru}、[дава́ть — дать]{.ru}）、异根（[говори́ть — сказа́ть]{.ru}、[брать — взять]{.ru}）。
exercises:

  - id: e1
    type: fill
    task: 写出与未完成体配对的完成体动词。
    why: 前三题加前缀，[учи́ть]{.ru} 加 [вы-]{.ru}，重音移到前缀上。第 4–7 题换后缀：[-ыва-]{.ru} 去掉，[-а-]{.ru} 换成 [-и-]{.ru}，[-ва-]{.ru} 脱落。[спра́шивать — спроси́ть]{.ru} 词根里还有 [ш — с]{.ru} 交替，[покупа́ть — купи́ть]{.ru} 完成体没有 [по-]{.ru}，都容易写错。最后两题是异根，只能死记。
    items:
      - stem: ви́деть → ___
        accept: [уви́деть]
      - stem: гото́вить → ___
        accept: [пригото́вить]
      - stem: учи́ть → ___
        accept: [вы́учить]
      - stem: пока́зывать → ___
        accept: [показа́ть]
      - stem: спра́шивать → ___
        accept: [спроси́ть]
      - stem: покупа́ть → ___
        accept: [купи́ть]
      - stem: дава́ть → ___
        accept: [дать]
      - stem: говори́ть → ___
        accept: [сказа́ть]
      - stem: брать → ___
        accept: [взять]

  - id: e2
    type: fill
    task: 用括号里动词的过去时填空，注意体和性。
    why: 第 1、4 题有 [до́лго]{.ru}、[час]{.ru}，说过程，用未完成体。第 2、3、5、6 题说一次完成的动作和结果，用完成体。[взять]{.ru}、[дать]{.ru} 的阴性过去时重音在词尾：[взяла́]{.ru}、[дала́]{.ru}。
    items:
      - stem: Экскурсово́д до́лго ___ о ла́вре.
        hint: расска́зывать / рассказа́ть
        accept: [расска́зывал]
      - stem: А́нна ___ матрёшку и поста́вила её на стол.
        hint: брать / взять
        accept: [взяла́]
      - stem: В Поса́де Ван Лэй ___ пода́рок.
        hint: покупа́ть / купи́ть
        accept: [купи́л]
      - stem: Мы ___ вас час.
        hint: ждать
        accept: [жда́ли]
      - stem: "О́льга Ви́кторовна посмотре́ла на часы́ и ___: «Мы ждём вас»."
        hint: говори́ть / сказа́ть
        accept: [сказа́ла]
      - stem: "Ма́ма ___: «Ми́ша, ты сде́лал уро́ки?»"
        hint: спра́шивать / спроси́ть
        accept: [спроси́ла]

  - id: e3
    type: rewrite
    task: 按例句回答：昨天做了很久，今天终于做完了。
    placeholder: Вчера́ я до́лго …, а сего́дня наконе́ц …
    example:
      cue: Ты вы́учил слова́?
      answer: Вчера́ я до́лго учи́л слова́, а сего́дня наконе́ц вы́учил.
    why: 前半句有 [до́лго]{.ru}，说的是过程，用未完成体；后半句有 [наконе́ц]{.ru}，说的是结果，用完成体。写的时候要先找准体对：[учи́ть — вы́учить]{.ru}（重音移到 [вы́-]{.ru} 上），[расска́зывать — рассказа́ть]{.ru}（重音不同），[чита́ть — прочита́ть]{.ru}，[писа́ть — написа́ть]{.ru}。宾语在后半句可以用代词 [его́ / её]{.ru} 重复，也可以省去。
    items:
      - cue: Ты прочита́л расска́з?
        accept: ["Вчера́ я до́лго чита́л расска́з, а сего́дня наконе́ц прочита́л.", "Вчера́ я до́лго чита́л расска́з, а сего́дня наконе́ц прочита́л его́."]
      - cue: Ты написа́л письмо́?
        accept: ["Вчера́ я до́лго писа́л письмо́, а сего́дня наконе́ц написа́л.", "Вчера́ я до́лго писа́л письмо́, а сего́дня наконе́ц написа́л его́."]
      - cue: Ты сде́лал упражне́ние?
        accept: ["Вчера́ я до́лго де́лал упражне́ние, а сего́дня наконе́ц сде́лал.", "Вчера́ я до́лго де́лал упражне́ние, а сего́дня наконе́ц сде́лал его́."]
      - cue: Ты прочита́л статью́?
        accept: ["Вчера́ я до́лго чита́л статью́, а сего́дня наконе́ц прочита́л.", "Вчера́ я до́лго чита́л статью́, а сего́дня наконе́ц прочита́л её."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊起晚了，迟到了；同学们等了他二十分钟；讲解员讲了拉多涅日的谢尔吉；王磊买的是套娃。
    items:
      - stem: В воскресе́нье Ван Лэй ___.
        options: [встал по́здно, встал ра́но]
        answer: встал по́здно
      - stem: Студе́нты жда́ли его́ ___.
        options: [час, два́дцать мину́т]
        answer: два́дцать мину́т
      - stem: Экскурсово́д рассказа́л о ___.
        options: [Се́ргии Ра́донежском, Льве Толсто́м]
        answer: Се́ргии Ра́донежском
      - stem: Ван Лэй купи́л ___.
        options: [матрёшку, кни́гу]
        answer: матрёшку

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1 题两个动作先后发生，都有结果，都用完成体。第 2 题“说”用异根动词 [сказа́ть]{.ru}，不能写成 [поговори́ть]{.ru}。第 3 题“拿了”“读完了”都是一次完成、有结果的动作，用完成体。第 5 题“做完”可以用 [зако́нчить]{.ru}，也可以用 [сде́лать]{.ru}。
    items:
      - zh: 他起晚了，迟到了。
        accept: ["Он встал по́здно и опозда́л.", "Он по́здно встал и опозда́л."]
        rubric: ["[встал]{.ru}、[опозда́л]{.ru} 都用完成体"]
      - zh: 老师说：“我们在等您。”
        accept: ["Преподава́тель сказа́л: «Мы ждём вас».", "Учи́тель сказа́л: «Мы ждём вас».", "О́льга Ви́кторовна сказа́ла: «Мы ждём вас».", "Преподава́тель сказа́л: «Мы вас ждём».", "О́льга Ви́кторовна сказа́ла: «Мы вас ждём»."]
        rubric: ["“说”用完成体 [сказа́л]{.ru}，与主语性别一致", "“等”用现在时 [ждём]{.ru}"]
      - zh: 安娜拿了那本书，把它读完了。
        accept: ["А́нна взяла́ кни́гу и прочита́ла её.", "А́нна взяла́ кни́гу и прочита́ла."]
        rubric: ["“拿”用完成体 [взяла́]{.ru}，阴性重音在词尾", "“读完”用完成体 [прочита́ла]{.ru}"]
      - zh: 他买了一件礼物。
        accept: ["Он купи́л пода́рок."]
        rubric: ["完成体 [купи́л]{.ru}；未完成体是 [покупа́ть]{.ru}"]
      - zh: 昨天晚上他终于把练习做完了。
        accept: ["Вчера́ ве́чером он наконе́ц зако́нчил упражне́ние.", "Вчера́ ве́чером он наконе́ц сде́лал упражне́ние.", "Он наконе́ц зако́нчил упражне́ние вчера́ ве́чером.", "Он наконе́ц сде́лал упражне́ние вчера́ ве́чером."]
        rubric: ["“做完”用完成体 [зако́нчил]{.ru} 或 [сде́лал]{.ru}", "[наконе́ц]{.ru} 常和完成体连用"]
