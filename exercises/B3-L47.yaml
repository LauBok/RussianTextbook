lesson: B3-L47
grammar: "书信的语体：私人信件接近口语，称呼 [Дорогой / Дорогая…!]{.ru}，结尾 [Обнимаю!]{.ru}、[Ваша Катя]{.ru}；事务信件接近公文语体，有主题栏，称呼 [Уважаемый + 名字父称!]{.ru}，先自我介绍再说事，请求用 [Не могли бы вы…?]{.ru}，结尾 [Заранее благодарю]{.ru}、[С уважением,]{.ru} + 全名。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как отправляли письма тридцать лет назад? Почему телеграммы писали так коротко? Кому Катя написала первое письмо и о чём она в нём рассказывает? Зачем она написала Андрею Петровичу? Чем начало и конец делового письма отличаются от начала и конца личного? Чем сообщения в мессенджерах похожи на устную речь?]{.ru}"
        length: 80–120
        model: "Тридцать лет назад письма писали от руки, клали в конверт, наклеивали марку и опускали в почтовый ящик. Телеграммы писали коротко, потому что за каждое слово нужно было платить. Первое письмо Катя написала своей бывшей учительнице. Она рассказывает о первом месяце в университете, о Москве осенью и вспоминает уроки литературы. Андрею Петровичу она написала, потому что хочет писать курсовую работу под его руководством. Личное письмо начинается с обращения «Дорогая…» и заканчивается словами «Обнимаю» и «Ваша Катя», а деловое начинается с обращения «Уважаемый…» и заканчивается словами «Заранее благодарю» и «С уважением». Сообщения в мессенджерах короткие, в них нет обращений и подписей, есть смайлики и сокращения."
        rubric: ["六个问题都回答，内容与课文一致", "第 5 题对比两种信件的开头和结尾", "[под руководством кого]{.ru}、[рассказывать о чём]{.ru} 用得对"]
        notes: 第 5 题用 [а]{.ru} 连接两部分，形成对比。第 6 题至少答出两点。

  - id: e2
    type: choice
    task: 选择适合事务信件的说法。
    why: "第 1 题给不太熟悉的老师写正式的信，称呼用 [Уважаемый]{.ru} + 名字和父称；[Привет]{.ru} 只对朋友，[Дорогой Андрей!]{.ru} 太亲近，而且缺父称。第 2 题请求用最委婉的 [Не могли бы вы…?]{.ru}；命令式 [Сообщите мне быстро]{.ru} 不礼貌，[Хочу, чтобы вы…]{.ru} 太直接。第 3 题事务信件的结尾是 [С уважением,]{.ru}；[Целую]{.ru}、[Пока]{.ru} 用于亲近的人。第 4 题主题栏用简短的名词短语，说明信件内容；[Привет!]{.ru} 和 [Важно!!!]{.ru} 什么都没说。"
    items:
      - stem: "___ (письмо преподавателю, с которым вы не знакомы)"
        options: ["Привет, Андрей Петрович!", "Уважаемый Андрей Петрович!", "Дорогой Андрей!"]
        answer: Уважаемый Андрей Петрович!
      - stem: ___ сообщить, когда вам удобно встретиться?
        options: ["Сообщите мне быстро", "Не могли бы вы", "Хочу, чтобы вы"]
        answer: Не могли бы вы
      - stem: "Заранее благодарю за ответ. ___ Екатерина Морозова"
        options: ["Целую,", "С уважением,", "Пока,"]
        answer: "С уважением,"
      - stem: "Тема: ___"
        options: ["Привет!", "Вопрос о курсовой работе", "Важно!!!"]
        answer: Вопрос о курсовой работе

  - id: e3
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [под руководством]{.ru} + 第二格：[профессора]{.ru}。第 2 题 [по поводу]{.ru} + 第二格：[стажировки]{.ru}。第 3 题 [прилагать что к чему]{.ru}：[к письму]{.ru}，第三格。第 4 题短尾形容词 [благодарен]{.ru} 和说话人的性别一致，写信的是 [Катя]{.ru}，用阴性 [благодарна]{.ru}。第 5 题 [благодарить кого за что]{.ru}：[за помощь]{.ru}，第四格。"
    items:
      - stem: Я хотела бы написать курсовую работу под руководством ___ Смирнова.
        hint: профессор
        accept: ["профессора"]
      - stem: Пишу вам по поводу ___.
        hint: стажировка
        accept: ["стажировки"]
      - stem: Мой план прилагаю к ___.
        hint: письмо
        accept: ["письму"]
      - stem: "Катя пишет: «Буду ___, если вы ответите до пятницы»."
        hint: благодарен
        accept: ["благодарна"]
      - stem: Заранее благодарю вас за ___.
        hint: помощь
        accept: ["помощь"]

  - id: e4
    type: rewrite
    task: 把给朋友的话改写成事务信件里的说法。
    example:
      cue: Привет!
      answer: Здравствуйте!
    why: "事务信件不用口语词和 [ты]{.ru}，请求用 [Не могли бы вы…?]{.ru}，致谢用 [Заранее благодарю…]{.ru}，结尾用 [С уважением]{.ru}。第 1 题 [скинь]{.ru} 是口语，换成 [прислать]{.ru}，[ты]{.ru} 换成 [вы]{.ru}。第 2 题 [спс]{.ru} 是网络缩写，正式信件里写全：对方已经回答了，用 [Благодарю за ответ]{.ru} 或 [Спасибо за ответ]{.ru}；[Заранее благодарю]{.ru} 只用在请求之后、对方回答之前，这里不合适。第 3 题 [Пока!]{.ru} 换成 [С уважением]{.ru}，后面写全名。"
    items:
      - cue: Скинь мне, пожалуйста, расписание.
        accept: ["Не могли бы вы прислать мне расписание?", "Не могли бы вы прислать расписание?", "Не могли бы вы, пожалуйста, прислать мне расписание?", "Не могли бы вы прислать мне, пожалуйста, расписание?", "Не могли бы вы отправить мне расписание?", "Не могли бы вы выслать мне расписание?", "Пришлите мне, пожалуйста, расписание.", "Пришлите, пожалуйста, расписание."]
      - cue: Спс за ответ!
        accept: ["Благодарю за ответ.", "Благодарю вас за ответ.", "Спасибо за ответ.", "Большое спасибо за ответ.", "Благодарю Вас за ответ."]
      - cue: Пока! Катя
        accept: ["С уважением, Екатерина Морозова"]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 您能否告知您什么时候方便见面？
        accept: ["Не могли бы вы сообщить, когда вам удобно встретиться?", "Не могли бы вы сказать, когда вам удобно встретиться?"]
        rubric: ["[Не могли бы вы]{.ru} + 不定式", "[когда вам удобно]{.ru}：第三格 + [удобно]{.ru}"]
      - zh: 随信附上我的提纲。
        accept: ["Мой план прилагаю к письму.", "Прилагаю к письму свой план.", "Прилагаю к письму мой план.", "Свой план прилагаю к письму.", "Мой план я прилагаю к письму.", "Свой план я прилагаю к письму.", "Я прилагаю к письму свой план.", "Я прилагаю к письму мой план.", "К письму прилагаю свой план.", "К письму прилагаю мой план.", "План прилагаю к письму.", "Прилагаю к письму план."]
        rubric: ["[прилагать что к чему]{.ru}", "事务信件常省去 [я]{.ru}"]
      - zh: 请原谅我这么久没有写信。
        accept: ["Простите, что так долго не писала.", "Простите, что так долго не писал.", "Прости, что так долго не писал.", "Прости, что так долго не писала.", "Простите, что я так долго не писал.", "Простите, что я так долго не писала.", "Прости, что я так долго не писал.", "Прости, что я так долго не писала."]
        rubric: ["[Простите / Прости, что…]{.ru}", "“很久没做”用未完成体 [не писал(а)]{.ru}"]

  - id: e6
    type: open
    task: 应用文：写一封事务性的电子邮件。
    items:
      - prompt: 你想参加莫斯科一所大学明年夏天的俄语短期班（[летние курсы русского языка]{.ru}），给国际处负责人 [Ирина Сергеевна Белова]{.ru} 写信：主题栏；称呼；自我介绍（姓名、学校、年级、学了几年俄语）；询问课程日期、费用、能否提供宿舍；客气地请求回复；信末套语和署名、联系方式。
        length: 70–110
        model: "Тема: Вопрос о летних курсах русского языка\n\nУважаемая Ирина Сергеевна!\n\nМеня зовут Ли Минь, я студентка третьего курса Пекинского университета, изучаю русский язык три года. Я хотела бы следующим летом учиться на летних курсах русского языка в Вашем университете.\n\nНе могли бы Вы сообщить, когда начинаются и заканчиваются курсы и сколько они стоят? Мне также важно знать, может ли университет предоставить место в общежитии.\n\nБуду благодарна за ответ.\n\nС уважением,\\\nЛи Минь\\\nПекинский университет\\\nтел. +86 138 0000 0000"
        rubric: ["有主题栏（名词短语）、正式称呼 [Уважаемая Ирина Сергеевна!]{.ru}", "先自我介绍，再提出问题，问题清楚", "请求用 [Не могли бы вы…?]{.ru} 或 [Буду благодарна (благодарен)…]{.ru}，短尾形容词与性别一致", "结尾 [С уважением,]{.ru} + 全名和联系方式，没有口语词"]
        notes: "范文约 75 词。称呼、正文各段、署名分行写；[Вы]{.ru}、[Ваш]{.ru} 在正式信件里常大写。结构：主题 → 称呼 → 自我介绍（一句）→ 目的（一句）→ 两个问题 → 致谢 → 署名。三个问题合成两句：第一句用 [Не могли бы Вы сообщить…]{.ru} 带两个间接问句，第二句用 [может ли…]{.ru} 构成间接一般疑问句。[следующим летом]{.ru}（明年夏天）用第五格表示时间。"

  - id: e7
    type: choice
    task: 选择适当的词。
    why: "第 1 题“抄送”是 [поставить в копию]{.ru}。第 2 题“点击按钮”是 [нажимать кнопку]{.ru}（也说 [нажимать на кнопку]{.ru}）；[читать]{.ru} 不能和按钮搭配，[трогать]{.ru} 只是“碰，摸”。第 3 题“标点符号”是固定说法 [знаки препинания]{.ru}。第 4 题电报写得 [предельно сжато]{.ru}，极其简短；[подробно]{.ru}、[свободно]{.ru} 与电报按字付费的特点相反。"
    items:
      - stem: Не стоит ставить в ___ людей, которых письмо не касается.
        options: [копию, кнопку, марку]
        answer: копию
      - stem: Не нужно без необходимости ___ кнопку «Ответить всем».
        options: [нажимать, читать, трогать]
        answer: нажимать
      - stem: В телеграммах не ставили знаков ___.
        options: [препинания, предлогов, приветствия]
        answer: препинания
      - stem: Телеграммы писали ___.
        options: ["подробно", "предельно сжато", "свободно"]
        answer: предельно сжато
