lesson: B3-L36
grammar: "地点从句（[где]{.ru}、[куда]{.ru}、[откуда]{.ru}，主句常有 [там]{.ru}、[туда]{.ru}、[оттуда]{.ru}）；程度从句（[так / настолько / такой / столько … что]{.ru}）；方式从句（[так … как]{.ru}）；程度从句与结果从句 [так что]{.ru} 的区别。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Каким было положение в России зимой 1917 года? Что произошло в Петрограде в конце февраля? Что такое двоевластие? Чего требовали большевики? Что произошло летом 1917 года? Как события октября 1917 года называли в Советском Союзе и как их называют сегодня многие историки?]{.ru}"
        length: 90–120
        model: "Зимой 1917 года положение в стране было очень тяжёлым: шла война, в городах не хватало продуктов, а очереди за хлебом были такими длинными, что люди стояли в них часами. В конце февраля в Петрограде начались забастовки и демонстрации, солдаты перешли на сторону восставших, и 2 марта Николай II отрёкся от престола. Двоевластие — это положение, когда власть была у Временного правительства, но одновременно большое влияние имел Совет рабочих и солдатских депутатов. Большевики требовали закончить войну, передать землю крестьянам, а власть — Советам. Летом наступление на фронте закончилось неудачей, главой правительства стал Керенский, а в конце августа выступление генерала Корнилова провалилось. В Советском Союзе эти события называли Великой Октябрьской социалистической революцией, а сегодня многие историки говорят о Великой российской революции."
        rubric: ["六个问题都回答，日期准确", "至少一个程度从句（[такой / так / настолько … что]{.ru}）", "第 6 题只转述不同的名称，不加自己的评价"]
        notes: 第 1 题可以直接用本课的程度从句。第 6 题是两种名称的对比，用 [а]{.ru} 连接；课文还提到反对者的说法（[переворот]{.ru}），也可以写上，但要说明是谁的说法。

  - id: e2
    type: choice
    task: 选择适当的词填空。
    why: "第 1 题修饰副词 [быстро]{.ru}，用 [так]{.ru}；[такой]{.ru} 只修饰名词和长尾形容词。第 2 题修饰长尾形容词 [длинными]{.ru}（复数第五格），用 [такими]{.ru}，与 [очереди]{.ru} 一致。第 3 题 [серьёзным]{.ru} 是长尾形容词第五格，[настолько]{.ru} 可以修饰长尾形容词；[так]{.ru} 不修饰长尾形容词；[такое]{.ru} 是第一格，和 [серьёзным]{.ru} 的格对不上（要说就得说 [таким серьёзным]{.ru}）。第 4 题后面是 [как]{.ru}，表示方式，用 [так]{.ru}。第 5 题 [погибло]{.ru} 说的是数量，用 [столько]{.ru}。"
    items:
      - stem: "Поддержка большевиков росла ___ быстро, что к осени они получили большинство."
        options: ["так", "такой", "столько"]
        answer: "так"
      - stem: "Очереди за хлебом стали ___ длинными, что люди стояли в них часами."
        options: ["так", "такими", "такие"]
        answer: "такими"
      - stem: "Положение было ___ серьёзным, что царю посоветовали отказаться от власти."
        options: ["настолько", "так", "такое"]
        answer: "настолько"
      - stem: "Всё произошло не ___, как думало правительство."
        options: ["так", "такой", "настолько"]
        answer: "так"
      - stem: "Солдат погибло ___, что армии не хватало людей."
        options: ["столько", "такой", "настолько"]
        answer: "столько"

  - id: e3
    type: fill
    task: 填入适当的指示词或关联词（[там]{.ru}、[туда]{.ru}、[оттуда]{.ru}、[где]{.ru}、[куда]{.ru}、[откуда]{.ru}）。
    why: "指示词看主句的动词，关联词看从句的动词。第 1 题从句 [собирались]{.ru}（聚集在哪里）用 [где]{.ru}。第 2 题主句 [посылали]{.ru}（派往哪里）用 [туда]{.ru}。第 3 题从句 [уехали]{.ru}（从哪里出发）用 [откуда]{.ru}，主句 [возвращались]{.ru}（回到哪里）用 [туда]{.ru}。第 4 题主句 [заседало]{.ru}（在哪里开会）用 [там]{.ru}。第 5 题从句 [приезжали]{.ru}（来到哪里）用 [куда]{.ru}。最常见的错误是把主句和从句写成同一个词，例如第 2 题受后面 [где]{.ru} 的影响写成 [там]{.ru}。"
    items:
      - stem: "Войска посылали туда, ___ собирались демонстранты."
        accept: ["где"]
      - stem: "Власти посылали войска ___, где были демонстрации."
        accept: ["туда"]
      - stem: "После войны солдаты возвращались туда, ___ уехали на фронт."
        accept: ["откуда"]
      - stem: "Правительство заседало ___, где когда-то жили цари."
        accept: ["там"]
      - stem: "В Петрограде, ___ приезжали солдаты с фронта, росло недовольство."
        accept: ["куда"]

  - id: e4
    type: rewrite
    task: 把两句话合成一个程度从句，用括号里的词。
    example:
      cue: "Очереди были очень длинными. Люди стояли в них часами. (такой … что)"
      answer: "Очереди были такими длинными, что люди стояли в них часами."
    why: "把第一句里的 [очень]{.ru} 换成程度指示词，第二句变成 [что]{.ru} 从句，逗号放在 [что]{.ru} 前面。[такой]{.ru} 要和名词同性、数、格：第 3 题 [положение было такое серьёзное / таким серьёзным]{.ru}，两种写法都对，书面上常用第五格。[так]{.ru} 修饰副词（第 1 题 [так быстро]{.ru}），[настолько]{.ru} 修饰形容词和副词（第 2 题）。"
    items:
      - cue: "Цены росли очень быстро. Многие не могли купить хлеб. (так … что)"
        accept: ["Цены росли так быстро, что многие не могли купить хлеб."]
      - cue: "Положение в армии было очень тяжёлым. Солдаты переходили на сторону восставших. (настолько … что)"
        accept: ["Положение в армии было настолько тяжёлым, что солдаты переходили на сторону восставших."]
      - cue: "Положение было очень серьёзным. Царь отрёкся от престола. (такой … что)"
        accept: ["Положение было таким серьёзным, что царь отрёкся от престола.", "Положение было такое серьёзное, что царь отрёкся от престола."]

  - id: e5
    type: translate
    task: 翻译下列句子，用地点、程度或方式从句。
    items:
      - zh: 局势严重到这种程度，将领们建议沙皇放弃权力。
        accept: ["Положение было настолько серьёзным, что командующие посоветовали царю отказаться от власти.", "Положение было таким серьёзным, что командующие посоветовали царю отказаться от власти.", "Положение было настолько серьёзным, что генералы посоветовали царю отказаться от власти.", "Положение было таким серьёзным, что генералы посоветовали царю отказаться от власти.", "Положение было такое серьёзное, что командующие посоветовали царю отказаться от власти.", "Положение было такое серьёзное, что генералы посоветовали царю отказаться от власти.", "Положение стало настолько серьёзным, что командующие посоветовали царю отказаться от власти.", "Положение стало настолько серьёзным, что генералы посоветовали царю отказаться от власти.", "Положение стало таким серьёзным, что командующие посоветовали царю отказаться от власти.", "Положение стало таким серьёзным, что генералы посоветовали царю отказаться от власти.", "Положение стало такое серьёзное, что командующие посоветовали царю отказаться от власти.", "Положение стало такое серьёзное, что генералы посоветовали царю отказаться от власти."]
        rubric: ["程度从句 [настолько / таким … что]{.ru}，逗号在 [что]{.ru} 前", "[посоветовать кому + 不定式]{.ru}", "[отказаться от власти]{.ru}"]
      - zh: 一切都没有像临时政府设想的那样发生。
        accept: ["Всё произошло не так, как думало Временное правительство.", "Всё случилось не так, как думало Временное правительство.", "Всё произошло не так, как думало правительство.", "Всё случилось не так, как думало правительство."]
        rubric: ["方式从句 [так, как]{.ru}，逗号在 [как]{.ru} 前", "[не]{.ru} 放在 [так]{.ru} 前面"]
      - zh: 哪里有游行的人聚集，当局就往哪里派军队。
        accept: ["Туда, где собирались демонстранты, власти посылали войска.", "Власти посылали войска туда, где собирались демонстранты."]
        rubric: ["主句用 [туда]{.ru}（[посылать]{.ru} 表示方向），从句用 [где]{.ru}（[собираться]{.ru} 表示位置）", "从句两边的逗号"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述 1917 年的主要事件。
    items:
      - prompt: "按时间顺序写一段话：1917 年冬天的形势；二月事件和沙皇退位；临时政府与苏维埃；4 月列宁回国；10 月 24—26 日的事件；1918 年初的立宪会议和改历。至少用两个程度从句、一个地点或方式从句。对事件的不同评价只转述，不加自己的看法。"
        length: 150–200
        model: "Зимой 1917 года Россия уже третий год воевала в Первой мировой войне. Положение в Петрограде было настолько тяжёлым, что люди часами стояли в очередях за хлебом. 23 февраля работницы вышли на улицы, а через несколько дней бастовал почти весь город. Солдаты, которых посылали туда, где собирались демонстранты, переходили на сторону восставших. 2 марта Николай II отрёкся от престола. Власть перешла к Временному правительству, но одновременно действовал Петроградский Совет, и началось двоевластие. В апреле в Петроград вернулся Ленин. Летом наступление на фронте закончилось неудачей, а в конце августа выступление генерала Корнилова провалилось. Поддержка большевиков росла так быстро, что осенью они получили большинство в Петроградском и Московском Советах. 24–25 октября их отряды заняли вокзалы, почту и мосты, а в ночь на 26 октября взяли Зимний дворец. Второй съезд Советов принял декреты о мире и о земле. В январе 1918 года Учредительное собрание, где большевики имели меньшинство, было распущено. В том же году Россия перешла на новый календарь. Эти события оценивают по-разному: одни называют их революцией, другие — переворотом."
        rubric: ["六部分都写到，顺序正确，日期准确", "至少两个程度从句（[так / настолько / такой … что]{.ru}）", "至少一个地点或方式从句，指示词和关联词搭配正确", "不同评价只转述，不加评价性的词", "150–200 词"]
        notes: "范文约 165 词。按月份推进：冬天、2 月 23 日、3 月 2 日、4 月、夏天、10 月 24—26 日、1918 年 1 月。两个程度从句分别说明形势（[настолько тяжёлым, что…]{.ru}）和支持率的增长（[так быстро, что…]{.ru}），交代了事件发展的原因。地点从句 [туда, где собирались демонстранты]{.ru} 嵌在定语从句里，注意 [туда]{.ru} 跟 [посылали]{.ru}，[где]{.ru} 跟 [собирались]{.ru}。最后一句用 [одни … другие …]{.ru} 转述两种评价，叙述者本人不表态。"
