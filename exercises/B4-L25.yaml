lesson: B4-L25
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что изменится в общественном транспорте Новоречинска с 1 сентября? Сколько стоит единый билет и сколько времени он действует? Почему городу нужна реформа? Кто недоволен реформой и что им отвечают?]{.ru}"
        length: 100–140
        model: "С 1 сентября город откажется от маршрутных такси, введёт единый электронный билет и выделит на шести главных улицах полосы для автобусов и трамваев. Вместо 112 маршрутов останется 48 автобусных и 6 трамвайных, а главные маршруты будут ходить каждые пять — семь минут. Единый билет стоит 50 рублей и действует 90 минут, поэтому пересаживаться можно будет бесплатно. Реформа нужна потому, что за десять лет число личных автомобилей выросло почти в два раза, а в час пик скорость движения в центре не превышает 15 километров в час. Недовольны владельцы маршрутных такси: они боятся, что около тысячи водителей останутся без работы. Мэрия обещает предложить им работу в городской транспортной компании. Жители окраин опасаются, что пересадок станет больше, а эксперт отвечает, что важнее общее время поездки. Автомобилисты боятся новых пробок, и для них построят перехватывающие парковки."
        rubric: ["四个问题都回答，事实与课文一致", "数字准确：50 卢布、90 分钟、48 加 6 条线路", "不满的三方（小巴业主、郊区居民、开车的人）至少答出两方，并写出回应"]
        notes: "第 3 题的答案在课文第 6 段，即“背景”部分：私家车增加了将近一倍，高峰时段车速很低。第 4 题要注意消息的平衡：每个反对意见后面都有市政府或专家的回应，回答时也应把双方都写出来。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[окраина]{.ru}"
        accept: ["Часть города, которая находится далеко от центра.", "Район на краю города, далеко от центра.", "Район далеко от центра города."]
        rubric: ["说明是城市的边缘部分，离市中心远"]
      - zh: "[час пик]{.ru}"
        accept: ["Время, когда на улицах и в транспорте больше всего людей и машин.", "Время, когда люди едут на работу или с работы и в транспорте очень много людей."]
        rubric: ["说明是交通最繁忙、人和车最多的时段"]
      - zh: "[проездной]{.ru}"
        accept: ["Билет, по которому можно ездить в общественном транспорте целый месяц.", "Месячный билет на общественный транспорт.", "Проездной билет на месяц."]
        rubric: ["说明是乘坐公共交通用的票", "说明在一段时间（如一个月）内有效"]
      - zh: "[перевозчик]{.ru}"
        accept: ["Человек или компания, которые за деньги возят пассажиров или грузы.", "Компания, которая возит пассажиров."]
        rubric: ["说明是运送乘客或货物的人或公司"]
      - zh: "[общественные слушания]{.ru}"
        accept: ["Собрание, на котором жители обсуждают проект и говорят, что они о нём думают.", "Открытое обсуждение проекта, в котором могут принять участие все жители."]
        rubric: ["说明是居民参加的讨论", "说明讨论的对象是方案、计划"]
      - zh: "[маршрутка]{.ru}"
        accept: ["Маршрутное такси: небольшой автобус, который ходит по определённому маршруту.", "Небольшой автобус, который возит пассажиров по определённому маршруту."]
        rubric: ["说明是沿固定线路运行的小型客车", "指出是口语词，正式说法是 [маршрутное такси]{.ru}（可不答）"]

  - id: e3
    type: choice
    task: 根据课文和本课“文体与修辞”选择正确答案。
    why: "第 1 题导语回答“什么事、在哪里、何时、谁说的”，原因和各方意见放在后面。第 2 题筹备经过是背景，对读者来说不如“明天有什么变化”重要，所以放在细节之后。第 3 题倒金字塔结构越往后越次要，删稿时从最后一段删起；标题和第一段最不能删。第 4 题 [в мэрии отвечают]{.ru} 是不定人称句，表示机构的正式立场，记者本人不表态。第 5 题第 3 段：单程票 90 分钟内有效。第 6 题最后一段：收费停车要等改革成功以后，明年才实行，这正是一条“次要信息”。"
    items:
      - stem: Первый абзац заметки отвечает на вопросы ___.
        options: ["что, где и когда произойдёт и кто об этом сообщил", "почему реформу готовили почти два года", "что думают о реформе жители окраин"]
        answer: "что, где и когда произойдёт и кто об этом сообщил"
      - stem: Рассказ о том, как готовили реформу, стоит не в начале, а в середине заметки, потому что ___.
        options: ["для читателя это менее важно, чем сами перемены", "это самая главная новость", "журналист с реформой не согласен"]
        answer: для читателя это менее важно, чем сами перемены
      - stem: Если заметку нужно сократить, редактор сначала уберёт ___.
        options: [последний абзац, первый абзац, заголовок]
        answer: последний абзац
      - stem: Слова «В мэрии отвечают, что…» показывают, что ___.
        options: ["это официальный ответ мэрии, а не мнение журналиста", "журналист сам работает в мэрии", "в мэрии не знают, что ответить"]
        answer: "это официальный ответ мэрии, а не мнение журналиста"
      - stem: Единый билет действует ___.
        options: [90 минут, один день, целый месяц]
        answer: 90 минут
      - stem: Платная парковка в историческом центре появится ___.
        options: ["в следующем году, если реформа окажется успешной", "с 1 сентября", "в декабре"]
        answer: "в следующем году, если реформа окажется успешной"

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [обойтись кому во что]{.ru} 花费，主语是 [проездной]{.ru}，完成体将来时第三人称单数 [обойдётся]{.ru}。第 2 题 [превышать что]{.ru} 直接接第四格，现在时 [превышает]{.ru}，主语是 [скорость]{.ru}。第 3 题 [подвести итоги]{.ru} 总结，主语 [власти]{.ru} 是复数，将来时 [подведут]{.ru}。第 4 题 [опасаться]{.ru} 后面接 [что]{.ru} 引出的从句，主语 [жители]{.ru} 复数：[опасаются]{.ru}。第 5 题 [отказываться от чего]{.ru}，未完成体现在时表示即将实施的计划：[отказывается]{.ru}。第 6 题 [выделить]{.ru} 的变位重音在词首：[выделит]{.ru}，主语是 [область]{.ru}。第 7 题 [помочь кому + 不定式]{.ru}：[разобраться в чём]{.ru}。第 8 题 [экономить]{.ru} 第二变位，第一人称有音变 [экономлю]{.ru}，[будет]{.ru} 后用不定式。"
    items:
      - stem: Месячный проездной ___ в 2400 рублей.
        hint: обойтись
        accept: ["обойдётся"]
      - stem: В час пик средняя скорость в центре не ___ 15 километров в час.
        hint: превышать
        accept: ["превышает"]
      - stem: В декабре власти ___ первые итоги реформы.
        hint: подвести
        accept: ["подведут"]
      - stem: Жители окраин ___, что им придётся делать больше пересадок.
        hint: опасаться
        accept: ["опасаются"]
      - stem: С 1 сентября город ___ от маршрутных такси.
        hint: отказываться
        accept: ["отказывается"]
      - stem: Половину суммы ___ из своего бюджета область.
        hint: выделить
        accept: ["выделит"]
      - stem: Волонтёры помогут пассажирам ___ в новой схеме.
        hint: разобраться
        accept: ["разобраться"]
      - stem: С единым билетом студентка будет ___ почти тысячу рублей в месяц.
        hint: экономить
        accept: ["экономить"]

  - id: e5
    type: rewrite
    task: 按新闻的写法改写：把直接引语改成带消息来源的转述（[по словам / по мнению / по данным]{.ru} 或 [что]{.ru} 从句）。
    example:
      cue: "«Реформа сократит время в пути», — сказал Левашов."
      answer: По словам Левашова, реформа сократит время в пути.
    why: "转述别人的话时，新闻常用三种插入语：[по словам кого]{.ru} 表示某人说过的话，[по мнению кого]{.ru} 表示某人的看法，[по данным кого / чего]{.ru} 表示统计或资料，后面都接第二格。也可以用说话动词加 [что]{.ru} 从句。第 1 题是承诺，用 [по словам]{.ru} 或 [пообещал, что]{.ru}。第 2 题 [считает]{.ru} 表示看法，用 [по мнению]{.ru}。第 3 题是一群人的意见，[по мнению автомобилистов]{.ru}。第 4 题是数字，最自然的是 [по данным мэрии]{.ru}。注意直接引语里的人称要改：第 3 题原话没有人称变化，第 1 题原话是“新车将按时运行”，也不变。"
    items:
      - cue: "«Новые автобусы будут ходить по расписанию», — пообещал заместитель мэра."
        accept: ["По словам заместителя мэра, новые автобусы будут ходить по расписанию.", "Заместитель мэра пообещал, что новые автобусы будут ходить по расписанию."]
      - cue: "«Реформа оставит без работы тысячу водителей», — считает Виктор Сомов."
        accept: ["По мнению Виктора Сомова, реформа оставит без работы тысячу водителей.", "Виктор Сомов считает, что реформа оставит без работы тысячу водителей.", "По словам Виктора Сомова, реформа оставит без работы тысячу водителей."]
      - cue: "«Пробки станут ещё больше», — говорят автомобилисты."
        accept: ["По мнению автомобилистов, пробки станут ещё больше.", "По словам автомобилистов, пробки станут ещё больше.", "Автомобилисты говорят, что пробки станут ещё больше.", "Автомобилисты считают, что пробки станут ещё больше."]
      - cue: "«Число личных автомобилей выросло почти в два раза», — сообщают в мэрии."
        accept: ["По данным мэрии, число личных автомобилей выросло почти в два раза.", "В мэрии сообщают, что число личных автомобилей выросло почти в два раза."]

  - id: e6
    type: open
    task: 概要写作。用俄语把课文压缩成 150 词左右的短消息，保留倒金字塔结构：先写最重要的事实，再写细节和各方意见。
    items:
      - prompt: "[Напишите краткую заметку о транспортной реформе в Новоречинске.]{.ru} 不用直接引语，用转述。"
        length: 130–170
        model: "С 1 сентября в Новоречинске начинается транспортная реформа. Как сообщил заместитель мэра по транспорту Олег Левашов, город отказывается от маршрутных такси, вводит единый электронный билет и выделяет на шести главных улицах полосы для автобусов и трамваев. Вместо 112 маршрутов будет 54; главные маршруты будут ходить каждые пять — семь минут. Единый билет стоит 50 рублей и действует 90 минут, поэтому пересадка становится бесплатной. Город уже получил 150 новых автобусов с низким полом, из них 40 электробусов. По данным мэрии, за десять лет число личных автомобилей выросло почти в два раза, а в час пик скорость движения в центре не превышает 15 километров в час. Владельцы маршрутных такси опасаются, что около тысячи водителей останутся без работы; мэрия обещает предложить им работу в городской компании. Жители окраин боятся лишних пересадок, но эксперты считают, что при едином билете это не страшно. Автомобилисты боятся новых пробок, поэтому у станций метро построят перехватывающие парковки. Первые итоги реформы подведут в декабре."
        rubric: ["第一句写清楚什么事、在哪里、什么时候", "注明消息来源（[как сообщил]{.ru}、[по данным]{.ru}）", "保留关键数字：票价、有效时间、线路数", "写出至少一方的不满和回应", "不加自己的评价", "130–170 词"]
        notes: "范文约 150 词。顺序与原文一致：导语（第 1 段）→ 线路和车票（第 2–3 段）→ 新车（第 5 段，只留一句）→ 背景（第 6 段）→ 反对意见和回应（第 8–10 段）→ 下一步（第 11 段）。压缩的办法：删掉所有直接引语，改成转述；删掉次要的数字（罚款、投资额、自行车道）；把 48 条和 6 条线路合并成一个数。专用道上的罚款和乘客的赞扬都可以删，因为它们不改变新闻的主要内容；郊区居民的担心和专家的回应合成一句。"

  - id: e7
    type: open
    task: 写一则消息。根据下面的材料，用倒金字塔结构写一篇 120–160 词的新闻，加一个标题。
    items:
      - prompt: "材料：新列钦斯克交通改革实施三个月后，副市长列瓦绍夫在 12 月的新闻发布会上公布初步结果。公共交通乘客增加 12%；乘客路上平均时间缩短 11 分钟（原计划 15 分钟）；专用道上拍下违章 3 万次；原来的小巴司机中有 400 人到市交通公司工作；郊区三条线路因乘客投诉已调整；第一座换乘停车场在北区地铁终点站启用，有 300 个车位。承运人协会会长索莫夫认为，留下来的司机太少。"
        length: 120–160
        model: "Реформа в Новоречинске: первые итоги\n\nЗа три месяца после транспортной реформы число пассажиров общественного транспорта в Новоречинске выросло на 12 %. Об этом на пресс-конференции сообщил заместитель мэра по транспорту Олег Левашов. По его словам, время в пути сократилось в среднем на 11 минут. Мэрия надеялась на 15 минут, но, как отметил Левашов, это хороший результат для первых месяцев.\n\nНа выделенных полосах камеры зафиксировали 30 тысяч нарушений. Жители окраин жаловались на новую схему, и три маршрута в этих районах изменили. Около 400 бывших водителей маршрутных такси перешли на работу в городскую транспортную компанию.\n\nПредседатель ассоциации перевозчиков Виктор Сомов считает, что этого мало: без работы остались больше половины водителей.\n\nВ декабре у конечной станции метро в районе Северный открылась первая перехватывающая парковка на 300 машин. Ещё две парковки должны появиться в следующем году."
        rubric: ["有标题", "第一段第一句写出最重要的结果，并注明消息来源", "其余材料按重要程度排列，停车场等次要信息放在后面", "反对意见注明是谁说的", "记者不加评价", "120–160 词"]
        notes: "范文约 130 词。导语选了乘客增加 12% 这一最能说明效果的数字，第二句交代来源。没有达到目标的数字（11 分钟而不是 15 分钟）不要回避，用副市长的话来解释，这是消息平衡的写法。[зафиксировать]{.ru} 是 [фиксировать]{.ru} 的完成体。注意 [на 12 %]{.ru}：增长的差额用 [на]{.ru}；[парковка на 300 машин]{.ru}：[на]{.ru} + 第四格表示容量。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的文章，表明你的看法并说明理由。
    items:
      - prompt: "[Что лучше для большого города: личный автомобиль или общественный транспорт?]{.ru} 可以举你熟悉的城市为例。"
        length: 250–300
        model: "В моём родном городе, как и в Новоречинске, за последние десять лет машин стало в несколько раз больше. Многие мои знакомые считают, что личный автомобиль — это свобода: можно ехать, куда хочешь и когда хочешь, не нужно ждать автобуса на холодной остановке. С этим трудно спорить, особенно если человек живёт на окраине или за городом, где транспорт ходит редко. Кроме того, в машине тепло и тихо, можно слушать музыку и никто не стоит рядом.\n\nОднако, по-моему, для большого города общественный транспорт важнее. Во-первых, автобус или трамвай перевозит в десятки раз больше людей, чем машины, которые занимают столько же места на дороге. Если все поедут на работу на своих машинах, в час пик город просто остановится. Именно это мы и видим каждое утро: тысячи машин, в каждой из которых сидит один человек, стоят в пробке, а скорость движения не превышает пешеходной. Во-вторых, общественный транспорт дешевле: проездной стоит в несколько раз меньше, чем машина и парковка. В-третьих, нельзя забывать о воздухе. В центре моего города летом воздух тяжёлый и грязный, а электробусы и метро не делают воздух грязным.\n\nКонечно, общественный транспорт должен быть удобным и надёжным. Люди не откажутся от машины, если автобус приходит раз в полчаса и в нём нельзя сесть. Поэтому город должен не только наказывать водителей штрафами, но и предлагать: выделять полосы для автобусов, вводить единый билет, строить перехватывающие парковки, чтобы жители окраин могли оставить машину у метро.\n\nЯ не думаю, что личный автомобиль исчезнет. Он нужен для поездок за город, для семей с маленькими детьми, для пожилых людей. Но в центре большого города главным должен быть общественный транспорт. Только тогда город останется удобным для жизни — и для тех, кто ездит на автобусе, и для тех, кто сидит за рулём."
        rubric: ["开头提出问题，承认对方观点的合理之处", "明确表态，并给出至少三条理由（[во-первых, во-вторых, в-третьих]{.ru}）", "提出条件或建议，论证不片面", "结尾总结", "恰当使用本课词语（[общественный транспорт, час пик, проездной, выделенные полосы, перехватывающие парковки]{.ru} 等）", "250–300 词"]
        notes: "范文约 280 词，分四段：第一段从自己的城市引出话题，先说出对方的理由（汽车意味着自由）；第二段用 [Однако, по-моему]{.ru} 转入自己的观点，三条理由分别是运量、价格、空气；第三段用 [Конечно]{.ru} 让步，提出公共交通本身必须改进；第四段承认汽车的用处，再重申结论。[в десятки раз больше]{.ru}：倍数用 [в]{.ru} + 第四格。"
