lesson: B4-L19
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Где и когда мы видим Обломова в начале романа? Как он выглядит? Какое выражение было главным на его лице? Почему автор так подробно описывает халат? Что значило для Обломова лежание? Какой была его комната с первого взгляда и при внимательном рассмотрении?]{.ru}"
        length: 100–140
        model: "В начале романа Обломов утром лежит в постели в своей квартире на Гороховой улице в Петербурге. Ему лет тридцать два — тридцать три, он среднего роста, с тёмно-серыми глазами, с белой шеей и маленькими пухлыми руками. На его лице нет никакой определённой мысли, а главное выражение — мягкость и беспечность. Халат описан так подробно, потому что он похож на своего хозяина: он мягкий, широкий, удобный и не мешает лежать. Для Обломова лежание не было ни необходимостью, ни наслаждением — это было его нормальное состояние. С первого взгляда комната кажется красивой: в ней дорогая мебель, ковры, картины. Но если посмотреть внимательнее, везде видны пыль и паутина, на столе стоит грязная тарелка, газета прошлогодняя, а книги давно никто не читал."
        rubric: ["六个问题都回答，事实与选文一致", "说出睡袍和主人的相似之处", "引出“躺着是他的正常状态”", "房间要写出“乍一看”和“细看”的对比", "100–140 词"]
        notes: "答案依次在第 1、2、3、6–7、9、10–14 段。第 4 题是推断题：选文没有直说睡袍为什么写得这么细，要从 [мягок, гибок]{.ru}、[как послушный раб]{.ru} 等描写看出它和主人的相似。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[беспечность]{.ru}"
        accept: ["Когда человек ни о чём не думает и ни о чём не заботится.", "Состояние, когда человек ни о чём не заботится.", "Когда человек живёт спокойно и не думает о проблемах."]
        rubric: ["说明是无忧无虑、什么都不操心"]
      - zh: "[мимоходом]{.ru}"
        accept: ["Проходя мимо.", "Быстро, проходя мимо.", "Между делом, проходя мимо."]
        rubric: ["说明是路过时、顺便"]
      - zh: "[чересчур]{.ru}"
        accept: ["Слишком.", "Очень, больше, чем нужно.", "Больше, чем нужно."]
        rubric: ["说明是过于、太"]
      - zh: "[лентяй]{.ru}"
        accept: ["Ленивый человек.", "Человек, который не любит работать.", "Тот, кто ничего не хочет делать."]
        rubric: ["说明是懒惰的人"]
      - zh: "[небрежность]{.ru}"
        accept: ["Когда человек делает что-то плохо, без внимания.", "Отсутствие внимания и порядка.", "Когда человек ни о чём не заботится и всё делает плохо."]
        rubric: ["说明是马虎、不用心、不注意秩序"]
      - zh: "[прошлогодний]{.ru}"
        accept: ["Такой, который был в прошлом году.", "Из прошлого года.", "Относящийся к прошлому году."]
        rubric: ["说明是去年的"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题第 2 段说得很清楚：[с отсутствием всякой определённой идеи]{.ru}，脸上没有任何明确的想法。第 2 题第 3 段：温和（[мягкость]{.ru}）是脸和整个心灵的主要表情。第 3 题 [ни … ни … ни …]{.ru} 排除了三种普通的解释，最后的结论才是重点：躺着是他的正常状态；作者并没有说他生病。第 4 题第 5 段：不安很少凝成想法，更少变成打算，最后总是以叹息告终，所以他并不行动。第 5 题“镜子上能写字”是夸张的说法，是作者的玩笑，说明灰尘多，并不是说镜子真的被拿来写字。第 6 题房间乍看漂亮，细看到处是灰尘，这和主人的性格一致：表面上过得去，实际上什么都不管。"
    items:
      - stem: На лице Обломова не было ___.
        options: [никакой определённой мысли, мягкости, ровного света беспечности]
        answer: никакой определённой мысли
      - stem: Главным выражением лица и души Обломова была ___.
        options: [мягкость, скука, тревога]
        answer: мягкость
      - stem: "Предложение «Лежанье … не было ни необходимостью, … ни случайностью, … ни наслаждением» показывает, что ___."
        options: ["лежание было для Обломова нормальным состоянием", "Обломов был тяжело болен", "Обломов очень уставал на работе"]
        answer: "лежание было для Обломова нормальным состоянием"
      - stem: Когда Обломов тревожился, ___.
        options: ["тревога заканчивалась вздохом, и он ничего не делал", "он сразу начинал действовать", "он писал письма друзьям"]
        answer: "тревога заканчивалась вздохом, и он ничего не делал"
      - stem: "Слова о том, что на зеркалах можно было писать по пыли, — это ___."
        options: ["шутка автора: так он показывает, сколько в комнате пыли", "точное описание того, что делал Захар", "рассказ о том, как Обломов писал заметки"]
        answer: "шутка автора: так он показывает, сколько в комнате пыли"
      - stem: Комната похожа на своего хозяина, потому что ___.
        options: ["с первого взгляда она красивая, а на самом деле о ней никто не заботится", "в ней всегда чисто и тихо", "в ней много книг, которые он читает"]
        answer: "с первого взгляда она красивая, а на самом деле о ней никто не заботится"

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题主语是 [халат]{.ru}，阳性，完成体过去时 [утратил]{.ru}。第 2 题 [покоряться чему]{.ru} 接第三格，现在时第三人称单数 [покоряется]{.ru}。第 3 题选文第 5 段用的是过去时，表示经常的情况，未完成体 [застывала]{.ru}，和阴性的 [тревога]{.ru} 一致。第 4 题主语 [страницы]{.ru} 是复数，完成体过去时 [покрылись]{.ru}。第 5 题“久久端详着”是伴随动作，用未完成体副动词 [вглядываясь]{.ru}，不能用变位形式。第 6 题 [хлопотать о чём]{.ru}，过去时阳性 [хлопотал]{.ru}，注意 [хлопотать]{.ru} 现在时变位是 [хлопочу, хлопочешь]{.ru}，但过去时按不定式构成。"
    items:
      - stem: Халат ___ свою первоначальную свежесть, но всё ещё был ярким.
        hint: утратить
        accept: ["утратил"]
      - stem: Халат, как послушный раб, ___ самомалейшему движению тела.
        hint: покоряться
        accept: ["покоряется"]
      - stem: Тревога редко ___ в форме определённой идеи.
        hint: застывать
        accept: ["застывала"]
      - stem: Страницы книг ___ пылью и пожелтели.
        hint: покрыться
        accept: ["покрылись"]
      - stem: Человек поглубже, долго ___ в лицо Обломова, отошёл бы с улыбкой.
        hint: вглядываться
        accept: ["вглядываясь"]
      - stem: Убирая кабинет, Обломов ___ только о приличиях.
        hint: хлопотать
        accept: ["хлопотал"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右。可以用长句，但每句只写一个中心意思。
    items:
      - prompt: "[Кратко перескажите, каким автор показывает Обломова, его халат и его комнату.]{.ru}"
        length: 130–170
        model: "Илья Ильич Обломов, человек лет тридцати двух, утром лежит в постели в своей квартире на Гороховой улице в Петербурге. У него приятная наружность, но на лице нет никакой определённой мысли: мысли появляются и сразу исчезают, и на лице остаются только мягкость и беспечность. Тело у него белое, мягкое, слишком изнеженное для мужчины. Если он и начинает о чём-то тревожиться, тревога быстро заканчивается вздохом и сном. Дома он всегда ходит в старом широком восточном халате и в мягких туфлях, которые сами попадают ему на ноги. Лежание для Обломова — не болезнь, не усталость и не удовольствие, а нормальное состояние. Он почти никогда не выходит из одной комнаты. С первого взгляда эта комната кажется красивой, но на самом деле в ней везде пыль и паутина, на столе стоит грязная тарелка, газета прошлогодняя, а в чернильнице живёт только муха. Хозяину и его слуге Захару всё равно."
        rubric: ["三部分都要有：肖像、睡袍和“躺”、房间", "写出人物的核心特点：温和、无忧无虑、不行动", "房间写出表面和实际的对比", "不照抄原文的长句和比喻", "130–170 词"]
        notes: "范文约 140 词。原文 14 段压缩成 10 句：第 1–5 段（肖像）压成 4 句，只留“没有明确想法”“温和与无忧无虑”“身体娇弱”“不安以叹息告终”四点；第 6–9 段（睡袍、拖鞋、躺）压成 3 句，第 9 段的否定排比保留下来，因为这是全段的结论；第 10–14 段（房间）压成 3 句。比喻（[вольной птицей]{.ru}、[как послушный раб]{.ru}、[скрижалями]{.ru}）在概要里都换成直接的说法。"

  - id: e6
    type: open
    task: 作文。以 [«Обломов живёт среди нас?»]{.ru} 为题，用俄语写一篇 250–300 词的议论文：今天还有没有“奥勃洛莫夫”？他们是什么样子？你怎样看待这种人？至少用一处 [ни … ни …]{.ru} 否定排比。
    items:
      - prompt: "[Обломов живёт среди нас?]{.ru}"
        length: 250–300
        model: "Роман Гончарова был написан больше ста пятидесяти лет назад, но слово «обломовщина» до сих пор живёт в русском языке. Значит, Обломовы есть и сегодня. Только выглядят они не так, как раньше.\n\nСовременный Обломов не носит восточного халата и не лежит целый день на диване. Он может ходить на работу, учиться в университете, иметь много друзей в интернете. Но, как и герой Гончарова, он живёт без всякой определённой цели. Он каждый день собирается начать новую жизнь: заняться спортом, выучить иностранный язык, найти интересную работу. Однако его планы редко превращаются в действия. Вечером он ложится на диван с телефоном и несколько часов смотрит короткие видео. Это для него не отдых, не удовольствие и не необходимость, а просто нормальное состояние.\n\nКак относиться к таким людям? С одной стороны, о них легко сказать много плохого. Они теряют время, не учатся ничему новому и часто зависят от других. Комната Обломова, где всё покрыто пылью, — хороший символ такой жизни: с первого взгляда всё в порядке, а внутри всё остановилось.\n\nС другой стороны, мне трудно говорить об Обломове только плохое. Гончаров показывает, что у его героя добрая, мягкая и честная душа. Он никому не делает зла и не ищет для себя пользы. Может быть, некоторые современные «Обломовы» просто устали от жизни, где все всё время спешат и соревнуются.\n\nВ целом я думаю, что Обломов действительно живёт среди нас и, наверное, немного в каждом из нас. Важно не позволить ему стать хозяином нашей жизни. Мягкость и доброта — прекрасные качества, но без желания действовать они, как халат Обломова, постепенно теряют свою свежесть."
        rubric: ["明确回答题目的问题", "有具体的现代例子", "有正反两方面的看法（批评和同情）", "至少一处 [ни … ни …]{.ru} 或 [не … не … а …]{.ru} 否定排比，用得自然", "引用选文里的细节（睡袍、房间、灰尘等）", "250–300 词"]
        notes: "范文约 250 词。结构：引子（[обломовщина]{.ru} 一词还活着）→ 现代的奥勃洛莫夫是什么样子 → 批评 → 同情 → 结论。第二段末尾仿照选文第 9 段的否定排比：[Это для него не отдых, не удовольствие и не необходимость, а просто нормальное состояние]{.ru}。结尾把睡袍“失去新鲜”的细节变成比喻，和选文呼应。议论文常用的连接语：[С одной стороны … С другой стороны …]{.ru}、[В целом]{.ru}。"
