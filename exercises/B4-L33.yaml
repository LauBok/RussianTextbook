lesson: B4-L33
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Почему ямщик предложил вернуться? Почему герой его не послушал?]{.ru}"
        length: 40–70
        model: "Ямщик увидел на востоке белое облачко и понял, что скоро начнётся буран. Он знал, что в степи во время бурана легко потерять дорогу. Герой был молод и не поверил ему: ветер показался ему не сильным, и он надеялся до бурана доехать до следующей станции."
        rubric: ["说出车夫看到了预示暴风雪的白云", "说出主人公觉得风不大、想赶到下一站"]
        notes: "答案在第 1—9 段。注意 [понадеялся добраться заблаговременно до следующей станции]{.ru} 一句：主人公的固执是年轻和没有经验造成的，萨韦利奇和车夫都比他明白。"
      - prompt: "[Как дорожный понял, что деревня близко? Что говорит это о нём?]{.ru}"
        length: 40–70
        model: "Дорожный почувствовал, что ветер дует с одной стороны и что оттуда пахнет дымом. Значит, рядом есть жильё и живут люди. Это показывает, что он хорошо знает степь, умеет наблюдать и не теряет хладнокровия даже в бурю. Недаром сам рассказчик удивляется его сметливости и тонкому чутью."
        rubric: ["说出风向和烟味两个依据", "评价人物：熟悉草原、机灵、冷静"]
        notes: "答案在第 17 段：[ветер оттоле потянул… дымом пахнуло]{.ru}。叙述者自己也说 [Сметливость его и тонкость чутья меня изумили]{.ru}。"
      - prompt: "[Почему рассказчик говорит, что видит в своём сне «нечто пророческое»? Кто такой вожатый на самом деле?]{.ru}"
        length: 40–80
        model: "Рассказчик пишет свои записки много лет спустя и знает, что было потом. Вожатый, которого он встретил в степи, оказался Пугачёвым, руководителем крестьянского восстания. Поэтому сон, который герой увидел в ту ночь, кажется ему теперь пророческим: он сравнивает его со странными обстоятельствами своей жизни и даже просит читателя простить ему это суеверие."
        rubric: ["指出叙述者是在多年后回忆，知道后来发生的事", "指出向导就是普加乔夫"]
        notes: "选文本身没有说出向导的身份，这一点要靠“作者与作品简介”和全书知识回答。[до сих пор вижу]{.ru} 的现在时说明写手记的时间是晚年。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[буран]{.ru}"
        accept: ["Сильная метель в степи.", "Снежная буря в степи.", "Метель, сильный ветер со снегом в степи."]
        rubric: ["说明是风雪、暴风雪", "说明多发生在草原上（可不答）"]
      - zh: "[ямщик]{.ru}"
        accept: ["Человек, который возит людей на лошадях.", "Тот, кто управляет лошадьми и возит пассажиров."]
        rubric: ["说明是赶马车、运送乘客的人"]
      - zh: "[постоялый двор]{.ru}"
        accept: ["Дом у дороги, где путешественники могут провести ночь.", "Место у дороги, где можно отдохнуть и провести ночь."]
        rubric: ["说明是路边供旅客过夜的地方"]
      - zh: "[ночлег]{.ru}"
        accept: ["Место, где можно провести ночь.", "Место, где ночуют."]
        rubric: ["说明是过夜的地方"]
      - zh: "[вожатый]{.ru}"
        accept: ["Человек, который показывает дорогу.", "Тот, кто ведёт других и показывает им дорогу."]
        rubric: ["说明是带路的人"]
      - zh: "[хладнокровие]{.ru}"
        accept: ["Спокойствие в трудной или опасной ситуации.", "Умение оставаться спокойным, когда трудно или опасно.", "Спокойствие."]
        rubric: ["说明是在困难或危险中保持冷静"]

  - id: e3
    type: rewrite
    task: 选文中有一些旧词和口语形式。把句中加点的词换成现代规范的说法。
    why: "第 1 题 [оборотиться]{.ru} 是旧词，现代说 [обернуться]{.ru}。第 2 题 [воротиться]{.ru} 等于 [вернуться]{.ru}，口语和旧文中常见。第 3 题 [изъяснить]{.ru} 旧词，等于 [объяснить]{.ru}。第 4 题 [подымается]{.ru} 是旧时口语形式，规范形式是 [поднимается]{.ru}。第 5 题 [недалече]{.ru} 旧、俗，等于 [недалеко]{.ru}。第 6 题 [оттоле]{.ru} 旧词，等于 [оттуда]{.ru}。第 7 题 [вишь]{.ru} 是 [видишь]{.ru} 的俗语缩略。这些词在普希金笔下多数出自人物之口，用来表现农民和仆人的口语；叙述者本人用的 [изъяснил]{.ru} 则带书卷气。"
    example:
      cue: "Ямщик оборотился ко мне."
      answer: "Ямщик обернулся ко мне."
    items:
      - cue: "Барин, не прикажешь ли воротиться?"
        accept: ["Барин, не прикажешь ли вернуться?"]
      - cue: "Ямщик изъяснил мне, что облачко предвещало буран."
        accept: ["Ямщик объяснил мне, что облачко предвещало буран."]
      - cue: "Ветер слегка подымается."
        accept: ["Ветер слегка поднимается."]
      - cue: "Почему думаешь ты, что жило недалече?"
        accept: ["Почему думаешь ты, что жило недалеко?", "Почему ты думаешь, что жило недалеко?"]
      - cue: "Ветер оттоле потянул."
        accept: ["Ветер оттуда потянул."]
      - cue: "Вишь, какая погода!"
        accept: ["Видишь, какая погода!"]

  - id: e4
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题 [принял было сперва за холмик]{.ru} 中 [было]{.ru} 表示当时的看法后来被证明是错的。第 2 题 [до сих пор вижу]{.ru} 用现在时，指写手记的“现在”，即老年的格里尼奥夫。第 3 题描写暴风雪的一段几乎都是简短的完成体过去时句子，动作一个接一个，节奏加快。第 4 题 [лошади чужие, хомут не свой]{.ru} 是谚语，车夫用它讽刺过路人：别人的马不心疼。第 5 题第 11 段：萨韦利奇责怪主人不听劝，[Савельич был прав]{.ru} 是叙述者事后的评价。第 6 题最后一段：皮袄太小，向导穿的时候把线缝撑开了。"
    items:
      - stem: "В словах «которое принял было сперва за отдалённый холмик» частица «было» показывает, что ___."
        options: ["герой сначала ошибся", "холмик был очень далеко", "герой хорошо знал степь"]
        answer: "герой сначала ошибся"
      - stem: "Слова «до сих пор вижу» принадлежат ___."
        options: ["рассказчику, который пишет записки много лет спустя", "ямщику", "Савельичу"]
        answer: "рассказчику, который пишет записки много лет спустя"
      - stem: "В описании бурана Пушкин использует в основном ___."
        options: ["короткие предложения с глаголами совершенного вида", "длинные предложения с причастиями", "разговор героев"]
        answer: "короткие предложения с глаголами совершенного вида"
      - stem: "Словами «лошади чужие, хомут не свой» ямщик хочет сказать, что дорожный ___."
        options: ["не жалеет чужих лошадей", "хорошо знает дорогу", "боится бурана"]
        answer: "не жалеет чужих лошадей"
      - stem: "Савельич недоволен, потому что ___."
        options: ["барин не послушал совета и не вернулся", "ямщик не знает дороги", "дорожный сел на облучок"]
        answer: "барин не послушал совета и не вернулся"
      - stem: "Нитки затрещали, потому что тулуп был ___."
        options: ["мал вожатому", "очень старый", "слишком дорогой"]
        answer: "мал вожатому"

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词，按事件顺序写，不要照抄原文的长句。
    items:
      - prompt: "[Напишите краткое изложение отрывка.]{.ru}"
        length: 130–170
        model: "Молодой дворянин Пётр Гринёв едет к месту службы через степь. С ним его старый слуга Савельич. Вечером ямщик замечает на краю неба белое облачко и советует вернуться: скоро начнётся буран. Герой не слушает его и велит ехать скорее. Скоро поднимается сильный ветер, начинается метель, и дороги уже не видно. Лошади останавливаются. Савельич сердится на барина, который не послушал совета. Вдруг путешественники видят в снегу человека. Это дорожный, который хорошо знает эту сторону. Он садится на облучок и уверенно говорит, что деревня недалеко: ветер оттуда принёс запах дыма. Кибитка медленно едет по глубокому снегу, а герой засыпает и видит странный сон, который потом покажется ему пророческим. На следующее утро Гринёв дарит вожатому свой заячий тулуп, хотя Савельич против этого. Тулуп мал, но мужичок всё-таки надевает его и благодарит барина. Скоро герой забывает об этой встрече."
        rubric: ["包括：车夫的警告、主人公不听、暴风雪、遇到过路人、找到村子、做梦、送皮袄", "按时间顺序，不抄原文长句", "篇幅在 130—170 词之间", "用第三人称和现在时或过去时统一叙述"]
        notes: "范文 134 词。概要的关键是取舍：车夫与主人公的对话、萨韦利奇的抱怨都压缩成一句；保留推动情节的事实（警告—不听—迷路—得救—赠皮袄）。普希金的口语（[вишь]{.ru}、[небось]{.ru}）和旧词不要搬进概要，一律换成现代说法。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评，题目任选其一：①“这次偶然的相遇为什么重要？”②“格里尼奥夫是怎样的一个年轻人？”评论要有观点、有选文中的例子。
    items:
      - prompt: "[Почему эта случайная встреча в степи важна для героя и для всего романа? / Каким человеком показан молодой Гринёв?]{.ru}"
        length: 250–300
        model: "В этом отрывке, кажется, нет ничего необыкновенного: молодой человек едет к месту службы, попадает в буран, случайный человек показывает ему дорогу, а утром герой дарит ему старый тулуп. Но именно эта простая история становится началом всего романа.\n\nВо-первых, встреча в степи показывает характер героя. Гринёв молод и не любит чужих советов: он не слушает ни ямщика, ни Савельича и едет навстречу бурану: ему кажется, что ветер не сильный и что до следующей станции можно успеть. Зато он щедрый и умеет быть благодарным. Савельич считает подарок ошибкой, но барин помнит, что этот мужичок спас их от смерти, и отдаёт ему свой тулуп. Это поступок доброго человека, а не расчёт.\n\nВо-вторых, в этом отрывке впервые появляется Пугачёв, хотя читатель ещё не знает его имени. Пушкин показывает его через поступки и речь: он спокоен, когда другие не знают, что делать, он чувствует запах дыма и понимает, откуда дует ветер, его речь простая и народная: «исхожена и изъезжена вдоль и поперёк». Даже рассказчик признаётся: «Сметливость его и тонкость чутья меня изумили». Уже здесь видно, что это необычный человек, который не боится бури.\n\nНаконец, в этой встрече есть нечто пророческое, как пишет сам рассказчик. Старый Гринёв знает то, чего не знал молодой: заячий тулуп, подаренный бродяге, потом спасёт ему жизнь. Пушкин не говорит об этом прямо, а только даёт понять это словами «до сих пор вижу нечто пророческое». Так частная история одного молодого дворянина соединяется с большой историей восстания.\n\nПо-моему, главная мысль этого отрывка в том, что добро не пропадает. Маленький поступок, о котором герой «скоро позабыл», оказывается самым важным в его жизни."
        rubric: ["有明确观点并在开头或结尾点明", "至少引用选文中两处具体细节（如车夫的警告、向导的嗅觉、皮袄）", "注意回忆录的双重视角（老年叙述者知道后来的事）", "篇幅 250—300 词，段落清楚，有连接词（[во-первых, наконец]{.ru} 等）"]
        notes: "范文 258 词，选第一题。结构：引子（看似平常的情节）—论点一（表现主人公性格）—论点二（普加乔夫第一次出场）—论点三（预言性，双重视角）—结论（善有善报）。读后评论不是复述情节，每一段都要回答“为什么”。引原文时用引号并说明出处，例如 [как пишет сам рассказчик]{.ru}。"
