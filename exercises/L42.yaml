lesson: L42
grammar: 动词的体（初识）：未完成体与完成体；加前缀构成的体对 [чита́ть — прочита́ть]{.ru} 等；过去时里未完成体表示过程、事实、反复，完成体表示结果。
exercises:

  - id: e1
    type: fill
    task: 写出完成体动词。
    why: 这几对都靠加前缀构成，前缀要逐个记：[чита́ть]{.ru} 加 [про-]{.ru}，[писа́ть]{.ru} 加 [на-]{.ru}，[де́лать]{.ru} 加 [с-]{.ru}，[смотре́ть]{.ru} 加 [по-]{.ru}。加前缀后重音位置不变。
    items:
      - stem: чита́ть → ___
        accept: [прочита́ть]
      - stem: писа́ть → ___
        accept: [написа́ть]
      - stem: де́лать → ___
        accept: [сде́лать]
      - stem: смотре́ть → ___
        accept: [посмотре́ть]

  - id: e2
    type: choice
    task: 选择正确的体。
    why: 第 1、4 题有 [два часа́]{.ru}、[до́лго]{.ru}，说的是动作持续多久，只能用未完成体。第 2、5 题有 [уже́]{.ru}，说的是结果，用完成体。第 3 题问“看过没有”，只问有没有这回事，用未完成体。第 6 题前半句说做了一阵，后半句说没有结果，后面用完成体 [не сде́лала]{.ru}。
    items:
      - stem: Ван Лэй ___ расска́з два часа́.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: Я уже́ ___ письмо́.
        options: [писа́л, написа́л]
        answer: написа́л
      - stem: — Ты ___ фильм «Война́ и мир»? — Нет, не смотре́л.
        options: [смотре́л, посмотре́л]
        answer: смотре́л
      - stem: Ми́ша до́лго ___ уро́ки.
        options: [де́лал, сде́лал]
        answer: де́лал
      - stem: А́нна уже́ ___ кни́гу.
        options: [чита́ла, прочита́ла]
        answer: прочита́ла
      - stem: Я ___ упражне́ние час, но не сде́лала.
        options: [де́лала, сде́лала]
        answer: де́лала

  - id: e3
    type: rewrite
    task: 按例句回答问题：先说做了多长时间，再说做完了。
    placeholder: Да, я …
    example:
      cue: Ты чита́л расска́з? (два часа́)
      answer: Да, я чита́л расска́з два часа́ и прочита́л его́.
    why: 持续多久用未完成体，结果用完成体。第二次提到同一个东西时用代词，阳性非动物名词和中性名词的第四格代词都是 [его́]{.ru}，阴性是 [её]{.ru}。
    items:
      - cue: Ты писа́л письмо́? (час)
        accept: ["Да, я писа́л письмо́ час и написа́л его́."]
      - cue: Ты де́лал упражне́ние? (до́лго)
        accept: ["Да, я до́лго де́лал упражне́ние и сде́лал его́.", "Да, я де́лал упражне́ние до́лго и сде́лал его́."]
      - cue: Ты чита́л кни́гу? (три часа́)
        accept: ["Да, я чита́л кни́гу три часа́ и прочита́л её."]
      - cue: Ты чита́л расска́з? (два часа́)
        accept: ["Да, я чита́л расска́з два часа́ и прочита́л его́."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊读得很慢，读了两个小时；练习还没做完；家信是昨天晚上写的；《战争与和平》他没看过。
    items:
      - stem: Ван Лэй чита́л расска́з ___.
        options: [час, два часа́]
        answer: два часа́
      - stem: Упражне́ние Ван Лэй ___.
        options: [сде́лал, ещё не сде́лал]
        answer: ещё не сде́лал
      - stem: Письмо́ домо́й Ван Лэй писа́л ___.
        options: [вчера́ ве́чером, сего́дня у́тром]
        answer: вчера́ ве́чером
      - stem: Фильм «Война́ и мир» Ван Лэй ___.
        options: [смотре́л, не смотре́л]
        answer: не смотре́л

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语的“完”“好”“过”在俄语里靠选择动词的体来表达，不是另加一个词。“读了很久”用未完成体，“读完了”用完成体，“看过”只问有没有这回事，用未完成体。
    items:
      - zh: 我读了很久，终于读完了。
        accept: ["Я до́лго чита́л и наконе́ц прочита́л.", "Я чита́л до́лго и наконе́ц прочита́л.", "Я до́лго чита́ла и наконе́ц прочита́ла.", "Я чита́ла до́лго и наконе́ц прочита́ла."]
        rubric: ["“读了很久”用未完成体 [до́лго чита́л]{.ru}", "“读完了”用完成体 [прочита́л]{.ru}"]
      - zh: ——练习你做完了吗？——还没有。
        accept: ["— Ты сде́лал упражне́ние? — Ещё нет.", "— Упражне́ние ты сде́лал? — Ещё нет.", "— Ты уже́ сде́лал упражне́ние? — Ещё нет.", "— Ты сде́лала упражне́ние? — Ещё нет.", "— Упражне́ние ты сде́лала? — Ещё нет."]
        rubric: ["问结果用完成体 [сде́лал]{.ru}", "“还没有”是 [ещё нет]{.ru}"]
      - zh: 你看过这部电影吗？
        accept: ["Ты смотре́л э́тот фильм?", "Ты смотре́ла э́тот фильм?", "Э́тот фильм ты смотре́л?", "Э́тот фильм ты смотре́ла?"]
        rubric: ["问“看过没有”用未完成体 [смотре́л]{.ru}", "“这部”是 [э́тот]{.ru}"]
      - zh: 信是我昨天晚上写的。
        accept: ["Письмо́ я писа́л вчера́ ве́чером.", "Я писа́л письмо́ вчера́ ве́чером.", "Письмо́ я писа́ла вчера́ ве́чером.", "Я писа́ла письмо́ вчера́ ве́чером."]
        rubric: ["强调什么时候写的，不强调结果，用未完成体 [писа́л]{.ru}"]

  - id: e6
    type: open
    task: 缩写：按问题回答，连成一段话（40–60 词）。
    items:
      - prompt: "[Что Ван Лэй чита́л в пя́тницу ве́чером? О чём э́тот расска́з? Ско́лько часо́в он чита́л? Как он чита́л? Он сде́лал упражне́ние? А письмо́ домо́й?]{.ru}"
        length: 40–60
        model: "В пя́тницу ве́чером Ван Лэй чита́л расска́з Толсто́го «Филиппо́к». Э́то расска́з о ма́леньком ма́льчике. Ван Лэй чита́л его́ два часа́. Он чита́л ме́дленно и ча́сто смотре́л слова́ в словаре́. Наконе́ц он прочита́л расска́з. Упражне́ние он де́лал час, но не сде́лал: оно́ о́чень тру́дное. А письмо́ домо́й он уже́ написа́л."
        rubric: ["持续多久用未完成体：[чита́л два часа́]{.ru}、[де́лал час]{.ru}", "结果用完成体：[прочита́л]{.ru}、[написа́л]{.ru}、[не сде́лал]{.ru}", "把问题里的信息都写进去"]
        notes: 范文按问题的顺序写，但把六个回答连成一段：用 [наконе́ц]{.ru}、[а]{.ru} 把句子串起来。全段要注意两种体交替出现：说过程用未完成体，说结果用完成体。
