lesson: B2-L36
heading: 单元测试
intro: 本测试覆盖第四单元全部语法。答对 80% 以上再进入第五单元；没有达到的，按出错的题回到相应的课（第 28–35 课）复习后重做，体的用法错得多的，先重读第 28–31 课。
grammar: "过去时、将来时中体的用法；命令式与体，否定命令式；不定式与体（[начина́ть, конча́ть, нельзя́]{.ru}）；[-овать, -евать]{.ru} 动词和 [дава́ть, встава́ть]{.ru}；辅音交替；[-ся]{.ru} 动词的意义；动词的支配。"
exercises:

  - id: e1
    type: choice
    task: 选择动词的体（过去时）。
    why: "问“做没做过”只关心事实，用未完成体：[Ты чита́л…? — Чита́л.]{.ru}（第 1 题）。说持续多久，用未完成体：[це́лый час]{.ru}、[всё воскресе́нье]{.ru}（第 2、5 题）。第 3 题米沙读了一部分，只是还没读完，[не]{.ru} + 完成体表示没有达到结果；[не чита́л]{.ru} 是根本没读过，和后半句矛盾。一个接一个完成的动作用完成体：[взял и дал]{.ru}（第 4 题）。第 6 题拿了又放回去，结果已经不在，用未完成体 [брал]{.ru}。第 7 题说的是结果（练习做完了，可以去玩了），用完成体。"
    items:
      - stem: — Ты ___ «Ревизо́ра»? — Чита́л.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: Вчера́ Ми́ша ___ пье́су це́лый час.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: "Ми́ша ещё не ___ всю пье́су: оста́лось три де́йствия."
        options: [прочита́л, чита́л]
        answer: прочита́л
      - stem: Ван Лэй взял с по́лки кни́гу и ___ её Ми́ше.
        options: [дал, дава́л]
        answer: дал
      - stem: Ван Лэй ___ уче́бник всё воскресе́нье, но ещё не прочита́л.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: — Ты ___ мой слова́рь? — Брал, но он уже́ на по́лке.
        options: [брал, взял]
        answer: брал
      - stem: Ма́ма, я ___ все упражне́ния. Мо́жно идти́ гуля́ть?
        options: [сде́лал, де́лал]
        answer: сде́лал

  - id: e2
    type: choice
    task: 选择动词的将来时形式。
    why: "说持续的过程（[все выходны́е]{.ru}）、问打算做什么、说活动本身（“我来问，你来答”），用未完成体将来时 [бу́ду]{.ru} + 不定式（第 1、4、5 题）。说结果（“都能考过”）用完成体：[сдашь]{.ru}（第 2 题）。[когда́]{.ru}、[е́сли]{.ru} 后面说将来的事也要用将来时，先完成的动作用完成体：[сдам, сдаст]{.ru}；用现在时 [сдаю́, сдаёт]{.ru} 或过去时都不对（第 3、6 题）。完成体不能和 [бу́ду]{.ru} 连用，[бу́ду повтори́ть, бу́дешь сде́лать]{.ru} 都是错的。"
    items:
      - stem: "Все выходны́е я ___ исто́рию: в понеде́льник у меня́ зачёт."
        options: [бу́ду повторя́ть, повторю́, бу́ду повтори́ть]
        answer: бу́ду повторя́ть
      - stem: Не волну́йся, ты всё ___.
        options: [сдашь, бу́дешь сдава́ть, сдаёшь]
        answer: сдашь
      - stem: Когда́ я ___ после́дний экза́мен, снача́ла вы́сплюсь.
        options: [сдам, сдаю́, бу́ду сдава́ть]
        answer: сдам
      - stem: Что ты ___ в суббо́ту?
        options: [бу́дешь де́лать, сде́лаешь, бу́дешь сде́лать]
        answer: бу́дешь де́лать
      - stem: "Ди́ма сказа́л: «Я ___, а ты бу́дешь отвеча́ть»."
        options: [бу́ду спра́шивать, спрошу́, спра́шивал]
        answer: бу́ду спра́шивать
      - stem: Е́сли Ди́ма ___ все экза́мены без тро́ек, он бу́дет получа́ть стипе́ндию.
        options: [сдаст, сдаёт, сдал]
        answer: сдаст

  - id: e3
    type: choice
    task: 选择命令式的体。
    why: "经常、反复的要求用未完成体：[Звони́ ка́ждый ве́чер]{.ru}、[Помога́й ма́ме ка́ждый день]{.ru}、[Не забыва́й де́лать уро́ки]{.ru}（第 1、3、6 题）。劝对方不要去做某事，用 [не]{.ru} + 未完成体：[Не буди́ Ми́шу]{.ru}（第 4 题）。提醒对方当心、别不小心造成某种结果，用 [не]{.ru} + 完成体：[Не забу́дь телефо́н]{.ru}、[не разбуди́]{.ru}、[Не опозда́й]{.ru}（第 2、5、7 题）。"
    items:
      - stem: ___ мне ка́ждый ве́чер!
        options: [Звони́, Позвони́]
        answer: Звони́
      - stem: Ва́ня, не ___ телефо́н!
        options: [забу́дь, забыва́й]
        answer: забу́дь
      - stem: Ми́ша, не ___ де́лать уро́ки!
        options: [забыва́й, забу́дь]
        answer: забыва́й
      - stem: Не ___ Ми́шу, он ещё спит.
        options: [буди́, разбуди́]
        answer: буди́
      - stem: Осторо́жно, говори́ ти́ше, не ___ Ми́шу!
        options: [разбуди́, буди́]
        answer: разбуди́
      - stem: Ми́ша, ___ ма́ме ка́ждый день!
        options: [помога́й, помоги́]
        answer: помога́й
      - stem: По́езд в оди́ннадцать. Смотри́, не ___!
        options: [опозда́й, опа́здывай]
        answer: опозда́й

  - id: e4
    type: choice
    task: 选择不定式的体。
    why: "表示开始、停止、习惯、学做某事的词后面只用未完成体不定式，即使这个词本身是完成体：[на́чал игра́ть, переста́л смотре́ть, привы́кла танцева́ть]{.ru}（第 1、2、6 题）。[нельзя́]{.ru} + 未完成体表示禁止（第 3 题），+ 完成体表示做不到（第 4 题）。[успе́ть]{.ru} 说的是能不能做成，用完成体（第 5 题）。[на́до]{.ru} 说经常要做的事，用未完成体（第 7 题）。"
    items:
      - stem: Ди́ма на́чал ___ «Кали́нку».
        options: [игра́ть, сыгра́ть]
        answer: игра́ть
      - stem: Ван Лэй переста́л ___ на но́ги.
        options: [смотре́ть, посмотре́ть]
        answer: смотре́ть
      - stem: В о́буви в за́ле ___ нельзя́.
        options: [танцева́ть, станцева́ть]
        answer: танцева́ть
      - stem: «Ба́рыню» нельзя́ ___ сра́зу.
        options: [вы́учить, учи́ть]
        answer: вы́учить
      - stem: Я не успе́л ___ упражне́ние.
        options: [сде́лать, де́лать]
        answer: сде́лать
      - stem: Ю́ми ещё не привы́кла ___ в па́ре.
        options: [танцева́ть, станцева́ть]
        answer: танцева́ть
      - stem: Но́вые слова́ на́до ___ ка́ждый день.
        options: [повторя́ть, повтори́ть]
        answer: повторя́ть

  - id: e5
    type: fill
    task: 写出动词的正确形式（没有注明的写现在时或将来时）。
    why: "[-овать, -евать]{.ru} 动词现在时 [-ова-, -ева-]{.ru} 变成 [-у-]{.ru}：[рису́ешь, сове́тует, танцу́ем]{.ru}；写成 [рисова́ешь]{.ru} 是常见错误（第 1、2、6 题）。[встава́ть, дава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[встаёт, даёт]{.ru}，命令式保留：[встава́й]{.ru}（第 3–5 题）。第二变位动词只在 [я]{.ru} 的形式交替：[ви́жу, плачу́, кормлю́, прошу́]{.ru}（第 7、9、10、12 题）；第一变位的 [маха́ть]{.ru} 所有人称都交替：[машу́]{.ru}（第 8 题）；[печь]{.ru} 除 [я]{.ru} 和 [они́]{.ru} 外都是 [ч]{.ru}：[печёт]{.ru}（第 11 题）。"
    items:
      - stem: Ми́ша, что ты ___?
        hint: рисова́ть
        accept: [рису́ешь]
      - stem: Ма́стер ___ Ми́ше рисова́ть ка́ждый день.
        hint: сове́товать
        accept: [сове́тует]
      - stem: Обы́чно в воскресе́нье Ван Лэй ___ по́здно.
        hint: встава́ть
        accept: [встаёт]
      - stem: Ма́стер ___ Ми́ше кисть.
        hint: дава́ть
        accept: [даёт]
      - stem: Ми́ша, ___! Уже́ во́семь часо́в!
        hint: встава́ть，命令式
        accept: [встава́й]
      - stem: Мы с Ю́ми ___ в студи́и ка́ждую суббо́ту.
        hint: танцева́ть
        accept: [танцу́ем]
      - stem: Я тебя́ ___! Ты сиди́шь у окна́!
        hint: ви́деть
        accept: [ви́жу]
      - stem: Я ___ тебе́ руко́й!
        hint: маха́ть
        accept: [машу́]
      - stem: Сего́дня в кафе́ я ___.
        hint: плати́ть
        accept: [плачу́]
      - stem: Ка́ждое у́тро я ___ Му́рку.
        hint: корми́ть
        accept: [кормлю́]
      - stem: Ба́бушка ___ пироги́.
        hint: печь
        accept: [печёт]
      - stem: Ми́ша, ___ тебя́, не кричи́!
        hint: проси́ть
        accept: [прошу́]

  - id: e6
    type: choice
    task: 选择带 [-ся]{.ru} 或不带 [-ся]{.ru} 的动词。
    why: "互相做某事用带 [-ся]{.ru} 的动词，人用复数主语或 [с]{.ru} + 第五格：[встреча́ются, перепи́сываются]{.ru}（第 1、7 题）；[перепи́сывать]{.ru} 不带 [-ся]{.ru} 是“抄写”，要有宾语。第 2 题“碰见了迪马”，[Ди́му]{.ru} 是第四格宾语，动词不带 [-ся]{.ru}。主语是东西、表示“被写、有卖”，用被动的 [-ся]{.ru}：[пи́шется, продаётся]{.ru}（第 3、4 题）。第 5、6 题博物馆自己开门、课自己开始，没有宾语，用不及物的 [открыва́ется, начина́ется]{.ru}；[открыва́ет, начина́ет]{.ru} 要有人作主语、有宾语。"
    items:
      - stem: Ван Лэй и Ди́ма ___ в кафе́ два ра́за в неде́лю.
        options: [встреча́ются, встреча́ют]
        answer: встреча́ются
      - stem: Вчера́ я ___ Ди́му в метро́.
        options: [встре́тил, встре́тился]
        answer: встре́тил
      - stem: Как ___ ва́ше и́мя по-кита́йски?
        options: [пи́шется, пи́шет]
        answer: пи́шется
      - stem: Здесь ___ хоро́ший слова́рь?
        options: [продаётся, продаёт]
        answer: продаётся
      - stem: Музе́й ___ в де́сять часо́в.
        options: [открыва́ется, открыва́ет]
        answer: открыва́ется
      - stem: Уро́к ___ в де́вять часо́в.
        options: [начина́ется, начина́ет]
        answer: начина́ется
      - stem: Ле́на и Ван Лэй ___ в интерне́те.
        options: [перепи́сываются, перепи́сывают]
        answer: перепи́сываются

  - id: e7
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "[боя́ться]{.ru} 支配第二格：[экза́мена]{.ru}；[жела́ть]{.ru} 祝愿的内容也用第二格：[уда́чи]{.ru}（第 1、9 题）。[помога́ть, меша́ть]{.ru} 支配第三格：[Ди́ме, нам]{.ru}，不能用第四格（第 2、3 题）。[благодари́ть]{.ru} 支配第四格：[А́нну]{.ru}（第 4 题）。[занима́ться]{.ru} 支配第五格（第 5 题）。[гото́виться к]{.ru} + 第三格（第 6 题），[ве́рить в]{.ru}、[серди́ться на]{.ru} + 第四格（第 7、8 题）。"
    items:
      - stem: Ди́ма о́чень бои́тся ___.
        hint: экза́мен
        accept: [экза́мена]
      - stem: А́нна помога́ет ___.
        hint: Ди́ма
        accept: [Ди́ме]
      - stem: Ми́ша, ты ___ меша́ешь!
        hint: мы
        accept: [нам]
      - stem: Ди́ма поблагодари́л ___ за по́мощь.
        hint: А́нна
        accept: [А́нну]
      - stem: Ван Лэй сиде́л ря́дом и занима́лся ___.
        hint: литерату́ра
        accept: [литерату́рой]
      - stem: Ве́чером они́ гото́вились к ___.
        hint: экза́мен
        accept: [экза́мену]
      - stem: Ты ве́ришь в ___?
        hint: приме́ты
        accept: [приме́ты]
      - stem: Не серди́тесь на ___!
        hint: я
        accept: [меня́]
      - stem: Жела́ю тебе́ ___!
        hint: уда́ча
        accept: [уда́чи]

  - id: e8
    type: translate
    task: 译成俄语。
    why: "第 1 题问“读没读过”，只关心事实，用未完成体 [чита́л]{.ru}。第 2 题“还没读完”是没有达到结果，用 [не]{.ru} + 完成体。第 3 题劝阻用 [не]{.ru} + 未完成体命令式，“能考过”是结果，用完成体将来时 [сдашь]{.ru}。第 4 题提醒别不小心忘了，用 [не забу́дь]{.ru}。第 5 题 [боя́ться]{.ru} 支配第二格。第 6 题“互相见面”用带 [-ся]{.ru} 的动词，经常的事用未完成体。第 7 题 [нача́ть / стать]{.ru} 后面只用未完成体不定式。"
    items:
      - zh: 你读过《上尉的女儿》吗？
        accept: ["Ты чита́л «Капита́нскую до́чку»?", "Ты чита́ла «Капита́нскую до́чку»?", "«Капита́нскую до́чку» ты чита́л?", "«Капита́нскую до́чку» ты чита́ла?"]
        rubric: ["未完成体 [чита́л / чита́ла]{.ru}：问的是事实", "书名用第四格 [«Капита́нскую до́чку»]{.ru}"]
      - zh: 我还没把课本读完。
        accept: ["Я ещё не прочита́л уче́бник.", "Я ещё не прочита́ла уче́бник.", "Уче́бник я ещё не прочита́л.", "Уче́бник я ещё не прочита́ла.", "Я ещё не прочита́л уче́бника.", "Я ещё не прочита́ла уче́бника."]
        rubric: ["[ещё не прочита́л(а)]{.ru}：[не]{.ru} + 完成体，没有达到结果", "不能用 [не чита́л]{.ru}，那是根本没读过"]
      - zh: 别着急，你都能考过。
        accept: ["Не торопи́сь, ты всё сдашь.", "Не волну́йся, ты всё сдашь.", "Не торопи́сь, ты сдашь все экза́мены.", "Не волну́йся, ты сдашь все экза́мены.", "Не торопи́сь, ты всё сдашь!", "Не волну́йся, ты всё сдашь!"]
        rubric: ["否定命令式用未完成体 [не торопи́сь]{.ru} 或 [не волну́йся]{.ru}", "完成体将来时 [сдашь]{.ru} 表示结果"]
      - zh: 别忘了带手机！
        accept: ["Не забу́дь телефо́н!", "Не забу́дь взять телефо́н!", "Не забу́дь свой телефо́н!", "Не забу́дь взять свой телефо́н!", "Не забу́дь взять с собо́й телефо́н!"]
        rubric: ["提醒当心用 [не забу́дь]{.ru}：[не]{.ru} + 完成体"]
      - zh: 迪马很怕克雷洛夫教授。
        accept: ["Ди́ма о́чень бои́тся профе́ссора Крыло́ва.", "Ди́ма о́чень боя́лся профе́ссора Крыло́ва."]
        rubric: ["[боя́ться]{.ru} + 第二格：[профе́ссора Крыло́ва]{.ru}"]
      - zh: 我们每个星期三见面。
        accept: ["Мы ви́димся по сре́дам.", "Мы встреча́емся по сре́дам.", "Мы ви́димся ка́ждую сре́ду.", "Мы встреча́емся ка́ждую сре́ду.", "По сре́дам мы ви́димся.", "По сре́дам мы встреча́емся.", "Ка́ждую сре́ду мы ви́димся.", "Ка́ждую сре́ду мы встреча́емся."]
        rubric: ["相互意义的 [ви́деться / встреча́ться]{.ru}，未完成体现在时", "[по сре́дам]{.ru} 或 [ка́ждую сре́ду]{.ru}"]
      - zh: 他开始学跳舞了。
        accept: ["Он на́чал учи́ться танцева́ть.", "Он стал учи́ться танцева́ть."]
        rubric: ["[на́чал / стал]{.ru} + 未完成体不定式 [учи́ться]{.ru}", "[учи́ться]{.ru} + 未完成体不定式 [танцева́ть]{.ru}"]

  - id: e9
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Каки́е экза́мены сдава́л Ван Лэй в конце́ апре́ля и как он к ним гото́вился? Что де́лал Ван Лэй в суббо́ту и в воскресе́нье? С кем Ди́ма познако́мил Ван Лэ́я? Чего́ боя́лся Ди́ма и кто ему́ помога́л? Куда́ Ван Лэй пое́дет на ма́йские пра́здники?]{.ru}"
        length: 60–100
        model: "В конце́ апре́ля у Ван Лэ́я бы́ли зачёт по исто́рии, пи́сьменный экза́мен по ру́сскому языку́ и у́стный экза́мен по литерату́ре. Он мно́го занима́лся: чита́л уче́бник, повторя́л биле́ты, а Ди́ма его́ спра́шивал. В суббо́ту Ван Лэй ходи́л с Ю́ми в студи́ю наро́дного та́нца, а в воскресе́нье е́здил с А́нной и Ми́шей в музе́й Андре́я Рублёва. Зачёт он сдал в понеде́льник. Ди́ма познако́мил его́ с Ле́ной, и тепе́рь они́ ви́дятся по сре́дам. Сам Ди́ма боя́лся профе́ссора Крыло́ва, и А́нна помога́ла ему́ гото́виться к экза́мену. На ма́йские пра́здники Ван Лэй пое́дет с Ди́мой в Каза́нь."
        rubric: ["回答全部五个问题", "过去时里分清体：过程、反复用未完成体，结果用完成体（[сдал]{.ru}）", "至少一个带 [-ся]{.ru} 的相互动词", "[боя́ться]{.ru}、[помога́ть]{.ru}、[гото́виться к]{.ru} 支配正确"]
        notes: "范文约 95 词。准备考试的过程用未完成体 [занима́лся, чита́л, повторя́л, спра́шивал]{.ru}，考查通过是结果，用完成体 [сдал]{.ru}；周末去过的地方用 [ходи́л, е́здил]{.ru}，说的是去了又回来。[ви́дятся]{.ru} 是相互意义；[боя́лся профе́ссора]{.ru}（第二格）、[помога́ла ему́]{.ru}（第三格）、[гото́виться к экза́мену]{.ru}（[к]{.ru} + 第三格）复习了第 35 课的支配。最后一句说将来，用完成体 [пое́дет]{.ru}。"

  - id: e10
    type: open
    task: 作文：《紧张的一周》。写一写你最近很忙的一个星期：做了哪些事，哪些已经做完了，哪些还没做完，有没有人帮你、有没有什么妨碍你，接下来你打算做什么。
    items:
      - prompt: 写 100–150 词。过去时里两种体都要用到（过程或次数、结果）；至少用两个将来时（一个未完成体、一个完成体）、一个命令式、一个“开始 / 停止 + 不定式”，再用三个不同支配的动词。
        length: 100–150
        model: "Э́та неде́ля была́ для меня́ о́чень тру́дной. В понеде́льник я сдава́л зачёт и сдал его́. Во вто́рник я три часа́ писа́л пи́сьменный экза́мен, но успе́л отве́тить на все вопро́сы. Ка́ждый ве́чер я повторя́л биле́ты к у́стному экза́мену. Мой друг помога́л мне: он спра́шивал, а я отвеча́л. Но мой сосе́д ча́сто меша́л мне: он гро́мко слу́шал му́зыку. Одна́жды я сказа́л ему́: «Пожа́луйста, не слу́шай му́зыку так гро́мко!» Он сказа́л «Извини́» и переста́л шуме́ть. Уче́бник по литерату́ре я ещё не прочита́л, оста́лось пятьдеся́т страни́ц. За́втра у меня́ после́дний экза́мен. Я немно́го бою́сь, но наде́юсь на себя́. Когда́ я сдам его́, я снача́ла вы́сплюсь, а пото́м бу́ду це́лую неде́лю отдыха́ть и гуля́ть с друзья́ми."
        rubric: ["写到做完的事、没做完的事、帮助和妨碍、以后的打算", "过去时两种体都用对", "将来时一个未完成体、一个完成体", "一个命令式、一个“开始 / 停止 + 未完成体不定式”", "三个不同支配的动词", "100–150 词"]
        notes: "范文约 130 词，按星期顺序写。[сдава́л… и сдал]{.ru} 对比过程和结果；[три часа́ писа́л]{.ru}、[ка́ждый ве́чер повторя́л]{.ru} 说持续和反复；[ещё не прочита́л]{.ru} 说没有达到结果。支配有 [помога́ть мне]{.ru}、[меша́ть мне]{.ru}（第三格）、[боя́ться]{.ru}、[наде́яться на себя́]{.ru}。否定命令式 [не слу́шай]{.ru} 用未完成体；[переста́л шуме́ть]{.ru} 后面是未完成体不定式。结尾用 [когда́ сдам]{.ru} + 完成体，再接 [бу́ду отдыха́ть]{.ru}，两种将来时都用到了。"
