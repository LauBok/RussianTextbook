lesson: B4-L20
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Сколько лет рассказчик живёт в Петербурге и сколько у него знакомых? Почему ему вдруг показалось, что «все покидают» его? С кем он «знаком» в городе? Что случилось с розовым домиком? Что рассказчик искал в своей комнате? О чём он догадался «сегодня поутру»? Почему в конце ему стало стыдно и грустно?]{.ru}"
        length: 100–140
        model: "Рассказчик живёт в Петербурге уже восемь лет, но почти ни с кем не знаком. Летом весь город уехал на дачу, и ему показалось, что все его покидают. На самом деле он «знает» весь Петербург: людей, которых встречает на улицах, одного старичка на Фонтанке и даже дома, которые как будто с ним разговаривают. Его любимый светло-розовый домик раскрасили в жёлтый цвет, и рассказчику стало очень грустно. Три дня ему было плохо, и в своей комнате он искал, чего ему недостаёт: осматривал стены, мебель и паутину. Только сегодня утром он понял, в чём дело: все уезжают на дачу. В конце ему стало стыдно и грустно, потому что ему некуда и незачем ехать и никто его не пригласил."
        rubric: ["七个问题都回答，事实与选文一致", "指出“熟人”其实是不认识他的行人和房子", "说清最后难过的原因：没人邀请他，他无处可去", "100–140 词"]
        notes: "答案依次在第 1 段开头、第 1 段中间（老人、房子）、第 1 段末（粉色小房子）和第 3 段。第 3 题要看出反讽：他说“认识全城”，其实这些人并不认识他。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[хандра]{.ru}"
        accept: ["Плохое настроение, тоска.", "Тоска и скука.", "Грустное настроение, когда ничего не хочется."]
        rubric: ["说明是苦闷、闷闷不乐的心情"]
      - zh: "[бродить]{.ru}"
        accept: ["Долго ходить без цели.", "Ходить без цели по улицам.", "Медленно ходить, никуда не спеша."]
        rubric: ["说明是没有目的地走来走去"]
      - zh: "[налегке]{.ru}"
        accept: ["Без вещей.", "Не неся ничего тяжёлого."]
        rubric: ["说明是不带行李、轻装"]
      - zh: "[прохожий]{.ru}"
        accept: ["Человек, который идёт мимо по улице.", "Человек, который проходит мимо.", "Тот, кто идёт по улице."]
        rubric: ["说明是路过的人、行人"]
      - zh: "[зачастую]{.ru}"
        accept: ["Часто.", "Очень часто.", "Нередко, часто."]
        rubric: ["说明是常常"]
      - zh: "[недоумение]{.ru}"
        accept: ["Когда человек не понимает, что происходит.", "Состояние, когда что-то непонятно.", "Удивление, когда что-то непонятно."]
        rubric: ["说明是不解、困惑"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题主人公在彼得堡住了八年，几乎没有结交一个熟人（第 1 段）。第 2 题房子会打招呼是拟人，表现的是主人公的孤独和幻想，并不是说房子真的会说话，也不是童话。第 3 题 [любезный читатель]{.ru} 是对读者的称呼，叙述者在对读者说话，独白因此带有对话性。第 4 题括号里是突然插进来的另一个念头，模仿思想的跳跃。第 5 题第 3 段：他终于明白，大家都到别墅去了；问题不在房间里，也不在马特廖娜。第 6 题“大车和小船增加到十倍、一百倍”不是数字，而是主人公激动时的感觉，是夸张。"
    items:
      - stem: Рассказчик живёт в Петербурге восемь лет и ___.
        options: [почти ни с кем не знаком, знаком со всеми соседями, каждое лето ездит на дачу]
        answer: почти ни с кем не знаком
      - stem: Дома, которые «разговаривают» с рассказчиком, показывают, что ___.
        options: ["он очень одинок и живёт в своих мечтах", "он архитектор", "в Петербурге происходят чудеса"]
        answer: "он очень одинок и живёт в своих мечтах"
      - stem: "Слова «любезный читатель» показывают, что ___."
        options: [рассказчик как будто разговаривает с читателем, рассказчик пишет письмо другу, рассказчик сердится на читателя]
        answer: рассказчик как будто разговаривает с читателем
      - stem: "Фраза «(того нет, этого нет, куда делся такой-то?)» ___."
        options: ["передаёт мысли, которые вдруг приходят в голову", "объясняет значение трудных слов", "передаёт слова Матрёны"]
        answer: "передаёт мысли, которые вдруг приходят в голову"
      - stem: Рассказчик понял, что ему плохо, потому что ___.
        options: [все уехали на дачу, в комнате много паутины, Матрёна не ответила ему]
        answer: все уехали на дачу
      - stem: "Слова «воза и лодки удесятерялись, усотерялись» — это ___."
        options: ["не цифры, а чувство рассказчика: так ему казалось", "точные цифры", "название улицы"]
        answer: "не цифры, а чувство рассказчика: так ему казалось"

  - id: e4
    type: rewrite
    task: 把下列间接引语改写成选文那样的内心独白：用第一人称、问句或感叹句。
    example:
      cue: Рассказчик спрашивал себя, чего ему недостаёт в его углу.
      answer: Чего недостаёт мне в моём углу?
    why: "内心独白直接写出人物脑子里的话：第三人称换成第一人称（[ему → мне, его → моём]{.ru}），间接问句里的 [ли]{.ru} 和 [что]{.ru} 去掉，变成直接的问句或感叹句。第 1 题 [почему]{.ru} 可以换成选文里口语的 [отчего]{.ru}。第 2 题 [ли]{.ru} 引导的间接问句变成一般疑问句，要把 [ли]{.ru} 去掉或保留在动词后面都可以。第 3 题间接引语里的 [что]{.ru} 去掉，加上感叹词，就成了选文第 3 段的 [Э! да ведь они от меня удирают на дачу!]{.ru} 那样的句子。"
    items:
      - cue: Он не понимал, почему ему так неловко в комнате.
        accept: ["Отчего мне так неловко в комнате?", "Почему мне так неловко в комнате?", "Отчего мне так неловко в моей комнате?", "Почему мне так неловко в моей комнате?"]
      - cue: Он думал, не стоит ли стул не так, как вчера.
        accept: ["Может быть, стул стоит не так, как вчера?", "Не стоит ли стул не так, как вчера?", "Стул стоит не так, как вчера?"]
      - cue: Наконец он понял, что все уезжают на дачу.
        accept: ["Да ведь все уезжают на дачу!", "Э! да ведь все уезжают на дачу!", "Все уезжают на дачу!", "Да они все уезжают на дачу!"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右，用第三人称转述。
    items:
      - prompt: "[Кратко перескажите отрывок.]{.ru}"
        length: 130–170
        model: "Рассказчик, молодой человек, который любит мечтать, живёт в Петербурге восемь лет, но почти ни с кем не знаком. Однажды летом ему вдруг показалось, что все его покидают, и три дня он в тоске бродил по городу. Дело в том, что он знает весь Петербург: он помнит лица прохожих, почти дружит с одним старичком на Фонтанке, который тоже его заметил, и даже с домами, которые как будто разговаривают с ним. Когда его любимый розовый домик раскрасили в жёлтый цвет, ему стало очень грустно. Дома ему тоже было плохо: он осматривал стены, мебель и паутину и не понимал, чего ему недостаёт. Только сегодня утром он догадался, что все уезжают на дачу. Ему казалось, что весь город уезжает, что Петербург скоро станет пустыней. Ему стало стыдно и грустно, потому что ему некуда было ехать и никто не пригласил его с собой."
        rubric: ["写出孤独的原因：住了八年没有熟人", "写出他“认识”城市的方式（行人、老人、房子）", "写出他最后明白的原因：大家都去别墅了", "结尾写出孤独和失落", "第三人称转述，130–170 词"]
        notes: "范文约 140 词。选文第 1 段很长，压缩时只保留每个例子的一句话：老人一句，房子一句，粉色小房子一句。第 3 段的长排比（三个 [потому что]{.ru}，大车和小船）压成一句 [Ему казалось, что весь город уезжает]{.ru}。对读者的称呼、括号插入和感叹在概要里都不保留，因为它们属于独白的语气，而概要只转述事实。"

  - id: e6
    type: open
    task: 作文。以 [«Один в большом городе»]{.ru} 为题，用俄语写一篇 250–300 词的内心独白：设想你在一座陌生的大城市里度过一个孤独的晚上。仿照选文，至少用到：对读者的称呼、自问自答、一处括号插入、一处拟人。
    items:
      - prompt: "[Один в большом городе]{.ru}"
        length: 250–300
        model: "Это было в первый месяц моей жизни в Москве, любезный читатель. Вы спросите: а что же тут особенного? Миллионы людей приезжают в большие города, учатся, работают и прекрасно живут. Да, конечно. Но в тот вечер мне было так одиноко, как никогда в жизни.\n\nБыла пятница. Все мои соседи по общежитию уехали домой, а мне ехать было некуда: до дома четыре тысячи километров. Я долго сидел в своей маленькой комнате и смотрел то в окно, то на телефон. Почему никто не пишет? Неужели у меня здесь совсем нет друзей? (Друзей, конечно, не было — откуда им взяться за месяц?)\n\nНаконец я не выдержал и пошёл гулять. Город жил своей жизнью. Люди спешили в кафе и в театры, смеялись, разговаривали по телефону. Каждый был с кем-то, и только я один бродил по улицам без цели. Даже фонари, казалось, смотрели на меня грустно, а старый дом на углу как будто говорил: «Ну что, опять один? Ничего, привыкнешь».\n\nЯ дошёл до реки и долго стоял на мосту. Вода была тёмная, огни отражались в ней и дрожали. Я вспомнил, что дома сейчас уже глубокая ночь и мама, наверное, спит. И вдруг мне стало немного легче. Я подумал: а ведь и этот город когда-то был для всех чужим. Каждый, кто сейчас сидит в кафе с друзьями, когда-то впервые шёл по этим улицам один.\n\nВы, может быть, улыбнётесь, читатель, но с того вечера у меня в Москве появился первый «знакомый» — этот мост. Я и сейчас прихожу к нему, когда мне грустно. Через год у меня появились и настоящие друзья. Но тот одинокий вечер я не забуду никогда."
        rubric: ["第一人称内心独白", "至少一次称呼读者，至少一处自问自答", "至少一处括号插入", "至少一处拟人（城市、房子、物体“说话”或“看”）", "有情绪的变化：孤独—转折—结尾", "250–300 词"]
        notes: "范文约 260 词。仿照选文的手段：开头和结尾称呼读者（[любезный читатель]{.ru}、[Вы, может быть, улыбнётесь, читатель]{.ru}）；替读者提问再回答（[Вы спросите: а что же тут особенного?]{.ru}）；括号里插入自嘲的念头；房子像选文里一样“说话”。注意情绪的起伏：选文从孤独走向更深的失落，范文则在河边出现转折，结构上可以自由选择。"
