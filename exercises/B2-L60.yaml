lesson: B2-L60
grammar: "否定代词 [не́кого, не́чего]{.ru} 和否定副词 [не́где, не́куда, не́когда]{.ru} + 不定式；主体用第三格；前置词放在 [не́]{.ru} 和代词中间；与 [никого́, ничего́, никогда́ + не]{.ru} 的区别。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句作否定回答。
    example:
      cue: — Кого́ ты спро́сишь?
      answer: — Мне не́кого спроси́ть.
    why: "回答用无人称句：主体用第三格（[мне]{.ru}、[нам]{.ru}），否定代词或副词加不定式，句中不再加 [не]{.ru}。问句里代词是什么格，[не́-]{.ru} 后面也用什么格：[кому́ → не́кому]{.ru}；有前置词时，前置词放在中间：[с кем → не́ с кем]{.ru}，[о чём → не́ о чем]{.ru}。[когда́ → не́когда]{.ru}，[куда́ → не́куда]{.ru}。"
    items:
      - cue: — Что ты бу́дешь де́лать ве́чером?
        accept: ["— Мне не́чего де́лать.", "— Ве́чером мне не́чего де́лать.", "— Мне не́чего де́лать ве́чером."]
      - cue: — С кем ты пойдёшь в кино́?
        accept: ["— Мне не́ с кем пойти́ в кино́.", "— Мне не́ с кем пойти́."]
      - cue: — О чём вы бу́дете говори́ть?
        accept: ["— Нам не́ о чем говори́ть."]
      - cue: — Кому́ ты позвони́шь?
        accept: ["— Мне не́кому позвони́ть."]
      - cue: — Когда́ ты бу́дешь отдыха́ть?
        accept: ["— Мне не́когда отдыха́ть."]
      - cue: — Куда́ вы пойдёте ве́чером?
        accept: ["— Нам не́куда пойти́.", "— Ве́чером нам не́куда пойти́.", "— Нам не́куда пойти́ ве́чером."]

  - id: e2
    type: choice
    task: 选择 [не́-]{.ru} 或 [ни-]{.ru}。
    why: "句中有变位动词和 [не]{.ru} 的（第 1、3、5、7 题），用不重读的 [ни-]{.ru}：[никого́ не́ было]{.ru}、[никого́ не ви́дел]{.ru}、[ничего́ не сказа́л]{.ru}、[никогда́ не́ был]{.ru}。句中是不定式、主体用第三格的（第 2、4、6 题），用重读的 [не́-]{.ru}：[мне не́кого спроси́ть]{.ru}、[Све́те не́чего де́лать]{.ru}、[мне не́когда отдыха́ть]{.ru}。"
    items:
      - stem: В кварти́ре ___ не́ было.
        options: [не́кого, никого́]
        answer: никого́
      - stem: Мне ___ спроси́ть.
        options: [не́кого, никого́]
        answer: не́кого
      - stem: Я ___ не ви́дел в библиоте́ке.
        options: [не́кого, никого́]
        answer: никого́
      - stem: "Све́те ___ де́лать: результа́ты бу́дут то́лько че́рез две неде́ли."
        options: [не́чего, ничего́]
        answer: не́чего
      - stem: Ми́ша ___ не сказа́л роди́телям.
        options: [не́чего, ничего́]
        answer: ничего́
      - stem: "Мне ___ отдыха́ть: за́втра экза́мен."
        options: [не́когда, никогда́]
        answer: не́когда
      - stem: Я ___ не́ был на Байка́ле.
        options: [не́когда, никогда́]
        answer: никогда́

  - id: e3
    type: translate
    task: 译成俄语。
    why: "五句都是无人称句：主体用第三格，否定代词或副词加不定式，不再加 [не]{.ru}。第 3 题是过去时，加 [бы́ло]{.ru}。第 4、5 题有前置词，放在 [не́]{.ru} 和代词中间。"
    items:
      - zh: 我没有人可问。
        accept: ["Мне не́кого спроси́ть."]
        rubric: ["[мне]{.ru}：第三格", "[не́кого спроси́ть]{.ru}，不加 [не]{.ru}"]
      - zh: 她没事可做。
        accept: ["Ей не́чего де́лать."]
        rubric: ["[ей не́чего де́лать]{.ru}"]
      - zh: 昨天我没有时间读书。
        accept: ["Вчера́ мне не́когда бы́ло чита́ть.", "Мне вчера́ не́когда бы́ло чита́ть.", "Вчера́ мне бы́ло не́когда чита́ть.", "Мне вчера́ бы́ло не́когда чита́ть."]
        rubric: ["[не́когда]{.ru} + 不定式", "过去时加 [бы́ло]{.ru}"]
      - zh: 他没有人可以商量。
        accept: ["Ему́ не́ с кем посове́товаться."]
        rubric: ["[не́ с кем]{.ru}：前置词在中间", "[ему́]{.ru}：第三格"]
      - zh: 我们没什么可谈的。
        accept: ["Нам не́ о чем говори́ть.", "Нам не́ о чем поговори́ть."]
        rubric: ["[не́ о чем]{.ru}：前置词在中间", "[нам]{.ru}：第三格"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Где бы́ли все Петро́вы в суббо́ту? Что чита́л Ван Лэй и чего́ он не по́нял? Почему́ он не мог никого́ спроси́ть? Почему́ Ди́ма был уста́лый? Как Ди́ма объясни́л выраже́ние «на дере́вню де́душке»?]{.ru}"
        length: 60–90
        model: "В суббо́ту роди́тели и Ми́ша пое́хали на да́чу, а А́нна пошла́ в библиоте́ку. Ван Лэй чита́л расска́з Че́хова «Ва́нька» и не по́нял выраже́ние «на дере́вню де́душке». Спроси́ть бы́ло не́кого: до́ма никого́ не́ было, а в словаре́ э́того выраже́ния то́же не́ было. Пото́м позвони́л уста́лый Ди́ма. Его́ сестра́ Све́та вчера́ сдава́ла ЕГЭ́, и тепе́рь ей не́чего де́лать, поэ́тому она́ звони́т ему́ ка́ждый час. Ди́ма объясни́л, что Ва́нька, ма́ленький сирота́, писа́л де́душке, но не знал а́дреса, и что так говоря́т, когда́ что́-то посыла́ют неизве́стно куда́."
        rubric: ["回答全部五个问题", "至少两处 [не́кого / не́чего]{.ru} + 不定式", "[никого́ не́ было]{.ru} 与 [не́кого]{.ru} 区分清楚"]
        notes: 范文约 90 词。[спроси́ть бы́ло не́кого]{.ru} 和 [никого́ не́ было]{.ru} 放在同一句里，正好对比两种结构。

  - id: e5
    type: open
    task: 作文。题目：[Оди́н день без телефо́на]{.ru}（没有手机的一天）。
    items:
      - prompt: 想象你有一整天不能用手机（比如考试、手机坏了）。写写这一天：哪些事做不了，你是怎么过的，有什么感想。至少用四个不同的 [не́-]{.ru} 结构（[не́кого, не́чего, не́ с кем, не́когда, не́куда]{.ru} 等）。
        length: 100–150
        model: "В про́шлую суббо́ту мой телефо́н упа́л в во́ду, и це́лый день я жил без него́.\n\nСнача́ла бы́ло о́чень тру́дно. У́тром я хоте́л позвони́ть дру́гу, но не мог. Я хоте́л узна́ть пого́ду, но спроси́ть бы́ло не́кого: сосе́д по ко́мнате уе́хал домо́й. В метро́ мне бы́ло не́чего де́лать: обы́чно я там чита́ю но́вости в телефо́не. А в обе́д мне бы́ло не́ с кем поговори́ть: все вокру́г смотре́ли в свои́ телефо́ны.\n\nНо пото́м я по́нял, что без телефо́на то́же мо́жно жить. Я взял в библиоте́ке кни́гу и прочита́л её за оди́н день. Ве́чером я пошёл в парк. Ра́ньше мне всегда́ бы́ло не́когда гуля́ть, а в тот день я гуля́л два часа́ и ни о чём не ду́мал.\n\nВ воскресе́нье я купи́л но́вый телефо́н. Но тепе́рь иногда́ я оставля́ю его́ до́ма про́сто так."
        rubric: ["写清哪些事做不了、怎么过的、感想", "至少四个 [не́-]{.ru} 结构，主体用第三格，不再加 [не]{.ru}", "可以和 [ни-]{.ru} 结构对比使用"]
        notes: 范文用了四个 [не́-]{.ru} 结构：[не́кого]{.ru}、[не́чего]{.ru}、[не́ с кем]{.ru}、[не́когда]{.ru}，还用了 [ни о чём не ду́мал]{.ru} 作对比。结构是：出了什么事—不方便—发现好处—结尾。
  - id: e6
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是斯韦塔。6 月 18 日晚上，你考完统一国家考试的俄语，给在莫斯科的哥哥迪马写信：讲讲考场的情形、考得怎么样、现在的心情和打算。
        length: 80–120
        model: "Каза́нь, 18 ию́ня\n\nДорого́й Ди́ма!\n\nСего́дня у меня́ был ЕГЭ́ по ру́сскому языку́. Я о́чень волнова́лась! Телефо́н брать бы́ло нельзя́, в за́ле бы́ли ка́меры, и спроси́ть бы́ло не́кого. Бо́льше трёх часо́в я сиде́ла и писа́ла. Я ду́маю, что всё сде́лала пра́вильно, но, мо́жет быть, в сочине́нии есть оши́бки.\n\nРезульта́ты бу́дут то́лько че́рез две неде́ли. А что мне де́лать сейча́с? Мне не́чего де́лать! Ма́ма говори́т: «Отдыха́й». Но как мо́жно отдыха́ть, когда́ не зна́ешь результа́тов?\n\nЗа́втра я тебе́ позвоню́. И в воскресе́нье то́же. Извини́ меня́!\n\nТвоя́ сестра́ Све́та"
        rubric: ["书信格式；兄妹之间用 [ты]{.ru}", "讲清考场情形和考试结果", "至少两处 [не́кого / не́чего]{.ru}", "写出心情"]
        notes: 斯韦塔的信语气活泼：问句 [А что мне де́лать сейча́с?]{.ru} 接着自己回答 [Мне не́чего де́лать!]{.ru}；结尾 [И в воскресе́нье то́же. Извини́ меня́!]{.ru} 和课文里迪马说她每小时打一次电话呼应。
