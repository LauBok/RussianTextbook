lesson: L33
grammar: "名词第二格表示所属：[маши́на отца́]{.ru}、[дом ба́бушки]{.ru}；第二格放在被修饰的名词后面；[оте́ц → отца́]{.ru} 一类元音脱落。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句用两个词说一句“这是谁的什么”。
    placeholder: Э́то … + 第二格.
    example:
      cue: маши́на / оте́ц
      answer: Э́то маши́на отца́.
    why: 被修饰的名词在前，表示所属的名词用第二格放在后面。[оте́ц]{.ru} 变 [отца́]{.ru}，[е]{.ru} 脱落；[де́душка]{.ru}、[Ва́ня]{.ru} 是阳性，但按 [-а]{.ru}、[-я]{.ru} 变成 [-и]{.ru}；[Мари́я]{.ru} 变 [Мари́и]{.ru}。
    items:
      - cue: соба́ка / сосе́д
        accept: [Э́то соба́ка сосе́да.]
      - cue: фо́то / де́душка
        accept: [Э́то фо́то де́душки.]
      - cue: ко́мната / Ва́ня
        accept: [Э́то ко́мната Ва́ни.]
      - cue: дом / ба́бушка
        accept: [Э́то дом ба́бушки.]
      - cue: альбо́м / семья́
        accept: [Э́то альбо́м семьи́.]
      - cue: сад / Мари́я Никола́евна
        accept: [Э́то сад Мари́и Никола́евны.]
      - cue: компью́тер / Ива́н Серге́евич
        accept: [Э́то компью́тер Ива́на Серге́евича.]

  - id: e2
    type: rewrite
    task: 按例句回答问题。
    placeholder: Э́то … + 第二格.
    example:
      cue: Чья э́то маши́на? (оте́ц)
      answer: Э́то маши́на отца́.
    why: 回答 [чей]{.ru} 的问题，用“名词 + 第二格”。第 2 题 [брат]{.ru} 是硬辅音结尾，变 [-а]{.ru}；第 3 题 [сестра́]{.ru} 的第二格重音在词尾，不要和复数 [сёстры]{.ru} 混淆；第 4 题 [учи́тель]{.ru} 软辅音结尾，变 [-я]{.ru}。
    items:
      - cue: Чья э́то соба́ка? (сосе́д)
        accept: [Э́то соба́ка сосе́да.]
      - cue: Чей э́то телефо́н? (брат)
        accept: [Э́то телефо́н бра́та.]
      - cue: Чьё э́то фо́то? (сестра́)
        accept: [Э́то фо́то сестры́.]
      - cue: Чей э́то слова́рь? (учи́тель)
        accept: [Э́то слова́рь учи́теля.]
      - cue: Чья э́то ко́мната? (Ми́ша)
        accept: [Э́то ко́мната Ми́ши.]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: 物主代词 [его́, её]{.ru} 放在名词前面；名词表示所属时用第二格放在后面。第 4 题 [па́пы маши́на]{.ru} 是按汉语语序造的错句。
    items:
      - stem: Э́то ___ маши́на.
        options: [его́, отца́]
        answer: его́
      - stem: Э́то маши́на ___.
        options: [оте́ц, отца́]
        answer: отца́
      - stem: Мы смо́трим альбо́м ___.
        options: [ба́бушка, ба́бушки]
        answer: ба́бушки
      - stem: Где ___?
        options: [маши́на па́пы, па́пы маши́на]
        answer: маши́на па́пы
      - stem: Ва́ня о́чень люби́л соба́ку ___.
        options: [сосе́д, сосе́да]
        answer: сосе́да

  - id: e4
    type: translate
    task: 译成俄语。
    why: “……的”译成第二格，放在被修饰的名词后面。注意语序和元音脱落。
    items:
      - zh: 这是爷爷的汽车。
        accept: ["Э́то маши́на де́душки."]
        rubric: ["[де́душки]{.ru} 放在 [маши́на]{.ru} 后面", "[де́душка]{.ru} 按阴性变成 [-и]{.ru}"]
      - zh: 父亲的工厂在哪儿？
        accept: ["Где заво́д отца́?"]
        rubric: ["[оте́ц]{.ru} 的第二格是 [отца́]{.ru}"]
      - zh: 那时候邻居有电话，我们家没有。
        accept: ["Тогда́ у сосе́да был телефо́н, а у нас не́ было.", "Тогда́ телефо́н был у сосе́да, а у нас не́ было.", "Тогда́ у сосе́да был телефо́н, а у нас нет.", "Тогда́ у сосе́да был телефо́н, а у нас телефо́на не́ было."]
        rubric: ["“邻居有”用 [у сосе́да]{.ru}", "过去时 [был]{.ru} 与 [телефо́н]{.ru} 一致，否定用 [не́ было]{.ru}"]
      - zh: 我们在看安娜的照片。
        accept: ["Мы смо́трим фо́то А́нны."]
        rubric: ["[А́нна]{.ru} 第二格 [А́нны]{.ru}"]

  - id: e5
    type: open
    task: 缩写。
    items:
      - prompt: 按下列问题复述课文，连成一段话：[Что пока́зывает ба́бушка?]{.ru} [Чей дом и чья маши́на на фо́то?]{.ru} [Что бы́ло и чего́ не́ было у ба́бушки ра́ньше?]{.ru} [Кто ма́льчик на фо́то? Чья соба́ка?]{.ru}
        length: 40–70
        model: |
          Ве́чером ба́бушка пока́зывает ста́рый альбо́м семьи́. Вот дом па́пы и ма́мы ба́бушки. А э́то маши́на отца́, «Москви́ч». Тогда́ на у́лице маши́на была́ то́лько у па́пы ба́бушки. Компью́тера и телефо́на у неё не́ было. Ма́льчик на фо́то — Ва́ня, па́па А́нны и Ми́ши. А соба́ка — э́то Бо́бик, соба́ка сосе́да.
        rubric: ["至少三处用第二格表示所属", "用 [не́ было]{.ru} + 第二格", "第三人称叙述，人称代词随之改变（[ваш па́па]{.ru} 改成 [па́па А́нны и Ми́ши]{.ru}）"]
        notes: 缩写时把对话改成第三人称叙述：奶奶说的“我爸爸”要改成 [па́па ба́бушки]{.ru}，“你们的爸爸”改成 [па́па А́нны и Ми́ши]{.ru}。按问题的顺序写，一个问题一到两句；“谁的”都用第二格表示。
