lesson: B4-L23
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Каким был 1918 год, по словам рассказчика? Что случилось в семье Турбиных в мае? О чём думал Николка в церкви? Какие вещи были в доме Турбиных и почему они так важны для семьи? Что сказала мать перед смертью? Сколько лет детям и что происходит вокруг них? Чем заканчивается отрывок?]{.ru}"
        length: 100–140
        model: "Рассказчик называет 1918 год великим и страшным: шла революция, и жизнь становилась всё опаснее. В мае умерла мать Турбиных, вскоре после того, как старший сын Алексей вернулся домой с войны. В церкви Николка смотрел на образ бога и не понимал, за что у них отняли мать именно тогда, когда вся семья снова собралась вместе. В доме были старые часы, изразцовая печь, ковры, бронзовая лампа и шкафы с книгами. С этими вещами дети выросли, и они казались им вечными. Перед смертью мать сказала детям: «Дружно… живите». Алексею двадцать восемь лет, Елене двадцать четыре, Николке семнадцать с половиной, а вокруг идёт война и становится всё страшнее. Отрывок заканчивается словами о том, что детям придётся мучиться и умирать."
        rubric: ["七个问题都回答，事实与选文一致", "写出母亲的遗言", "写出老房子的物品象征着家和稳定", "结尾写出母亲的嘱咐和孩子们命运的对比", "100–140 词"]
        notes: "答案依次在第 1、3–4、5、8–9、10、12、13–15 段。第 4 题要做一点推断：叙述者说钟和炉子“不朽”，说明这些东西对一家人意味着稳定和延续。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[растерянно]{.ru}"
        accept: ["Не понимая, что делать.", "Так, как будто не знаешь, что делать.", "Не зная, что делать и что думать."]
        rubric: ["说明是不知所措地"]
      - zh: "[несправедливость]{.ru}"
        accept: ["Когда человеку плохо без всякой причины, без вины.", "Когда с человеком поступают нечестно.", "Когда человек страдает, хотя ни в чём не виноват."]
        rubric: ["说明是不公平、不应得的遭遇"]
      - zh: "[бессмертный]{.ru}"
        accept: ["Такой, который никогда не умрёт.", "Вечный, который живёт всегда.", "Который не умирает."]
        rubric: ["说明是永远不死、不会消失的"]
      - zh: "[мерещиться]{.ru}"
        accept: ["Казаться, когда на самом деле этого нет.", "Видеть то, чего нет.", "Казаться."]
        rubric: ["说明是好像看见了实际上不存在的东西"]
      - zh: "[столовая]{.ru}"
        accept: ["Комната, где едят.", "Комната в квартире, где обедают.", "Комната, где вся семья обедает."]
        rubric: ["说明是吃饭的房间"]
      - zh: "[облегчение]{.ru}"
        accept: ["Когда становится легче.", "Чувство, что стало легче.", "Когда тяжёлое время кончилось и стало легче."]
        rubric: ["说明是变轻松、压力减轻"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题开头用教会纪年和革命纪年两种说法，句子仿照编年史，庄严而带反讽，不是普通的日记。第 2 题 [ёлочный дед наш]{.ru} 里的“我们的”说明叙述者像是家里的一员。第 3 题 [За что такая обида? …]{.ru} 是尼科尔卡的想法，叙述者用准直接引语写出人物的心声。第 4 题叙述者知道后来的苦难，“一切都会越来越好”是苦涩的反讽，并不是他真的这样认为。第 5 题第 8 段说钟“不朽”，第 13 段却预言墙会倒塌、书会被烧，前后对照构成反讽。第 6 题最后两段并列母亲的嘱咐（[Живите]{.ru}）和孩子们的命运（[мучиться и умирать]{.ru}），是对比。"
    items:
      - stem: "Первая фраза «Велик был год и страшен год по Рождестве Христовом 1918, от начала же революции 2-й» написана ___."
        options: ["торжественно, как старая летопись", "как записка в дневнике", "как новость в газете"]
        answer: "торжественно, как старая летопись"
      - stem: "Слова «О, ёлочный дед наш» показывают, что рассказчик ___."
        options: ["говорит как один из членов семьи", "не знает Турбиных", "смеётся над праздником"]
        answer: "говорит как один из членов семьи"
      - stem: "Вопросы «За что такая обида? Несправедливость?» — это ___."
        options: [мысли Николки, слова священника, вопрос к читателю]
        answer: мысли Николки
      - stem: "Слова «всё, что ни происходит, всегда так, как нужно и только к лучшему» звучат ___."
        options: ["горько и с иронией", "весело и уверенно", "как приказ"]
        answer: "горько и с иронией"
      - stem: "Рассказчик сначала пишет, что часы «бессмертны», а потом — что «упадут стены». Это ___."
        options: ["ирония: дом, который кажется вечным, погибнет", "ошибка автора", "описание ремонта"]
        answer: "ирония: дом, который кажется вечным, погибнет"
      - stem: "Последние слова отрывка «Мать сказала детям: — Живите. А им придётся мучиться и умирать» построены на ___."
        options: [противопоставлении, повторении одного слова, вопросе]
        answer: противопоставлении

  - id: e4
    type: rewrite
    task: 把下列句子改写成普通的中性叙述，去掉编年史式的倒装、呼告和叹词，比较两种写法的效果。
    example:
      cue: Велик был год и страшен год 1918.
      answer: 1918 год был великим и страшным.
    why: "第 1 题短尾形容词放在句首是编年史的笔调，中性写法把主语放在前面，形容词用第五格或长尾。第 2 题 [Эх… эх…]{.ru} 是叙述者的叹息，中性叙述里去掉。第 3 题呼告 [Мама, … где же ты?]{.ru} 改成第三人称的陈述句。第 4 题去掉 [-то]{.ru}，并把比喻性的 [на самом рассвете]{.ru} 改成直接的说法。改写以后意思没变，叙述者的声音却消失了。"
    items:
      - cue: Был он обилен летом солнцем, а зимою снегом.
        accept: ["Летом было много солнца, а зимой много снега.", "Летом в этом году было много солнца, а зимой — много снега.", "Летом было много солнца, а зимой было много снега."]
      - cue: И маму закопали. Эх… эх…
        accept: ["И маму похоронили.", "Маму похоронили.", "И маму закопали."]
      - cue: Мама, светлая королева, где же ты?
        accept: ["Мамы больше нет.", "Мама умерла.", "Мамы уже нет."]
      - cue: Жизнь-то им как раз перебило на самом рассвете.
        accept: ["Их жизнь изменилась, когда они были ещё молоды.", "Их жизнь изменилась, когда они были очень молоды."]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右，用第三人称转述。
    items:
      - prompt: "[Кратко перескажите начало романа «Белая гвардия».]{.ru}"
        length: 130–170
        model: "Действие начинается в конце страшного 1918 года. В мае в семье Турбиных умерла мать. Это случилось вскоре после того, как старший сын Алексей, молодой врач, вернулся домой с войны, а дочь Елена вышла замуж за капитана Тальберга. Мать похоронили рядом с отцом, профессором, который умер ещё раньше. Николке было только семнадцать с половиной лет. Младший брат Николка не понимал, за что у них отняли мать именно тогда, когда семья снова была вместе. В доме Турбиных на Алексеевском спуске прошло детство братьев и сестры: здесь стояла тёплая изразцовая печь, били старые часы, лежали ковры и стояли шкафы с любимыми книгами. Всё это мать оставила детям и перед смертью попросила их жить дружно. Но жить становится всё труднее: с севера идёт революция, вокруг тревожно, и Турбины ждут перемен. Рассказчик говорит, что дом погибнет, а детям придётся мучиться и умирать."
        rubric: ["写出时间（1918 年）和事件（母亲去世）", "写出三兄妹和老房子的细节", "写出母亲的嘱咐", "写出叙述者对未来的预言", "第三人称转述，130–170 词"]
        notes: "范文约 140 词。按选文的三节压缩：葬礼（第 1–7 段）、老房子和母亲的嘱咐（第 8–10 段）、孩子们和时代（第 11–15 段）。叙述者的呼告、叹词和比喻（[мести с севера]{.ru}、[утроба земли]{.ru}）在概要里换成直接的说法：[с севера идёт революция]{.ru}。"

  - id: e6
    type: open
    task: 作文。以 [«Вещи, которые помнят»]{.ru} 为题，用俄语写一篇 250–300 词的短文：写你家里的一件或几件老东西（钟、书、家具、照片……），它们见证了家里的哪些事。仿照布尔加科夫，叙述中至少有一处直接呼告，一处预言式的将来时或带反讽的评论。
    items:
      - prompt: "[Вещи, которые помнят]{.ru}"
        length: 250–300
        model: "В нашей квартире много новых вещей: телевизор, компьютер, удобный диван. Но когда я думаю о доме, я вспоминаю не их, а старый шкаф с книгами, который стоит в комнате у бабушки.\n\nЭтот шкаф купил ещё мой прадед, когда вернулся с войны. Он тёмный, тяжёлый, со стеклом, и пахнет от него старой бумагой и немного шоколадом, совсем как у Булгакова. На его полках живут Пушкин, Толстой, Чехов, детские сказки моей мамы и мои первые книжки с картинками. На стекле до сих пор остался след: это я в пять лет пытался достать «Сказки народов мира» и упал вместе со стулом. Каждый раз, когда я открываю его, мне кажется, что я слышу голоса тех, кто читал эти книги до меня. Бабушка говорит, что шкаф — член нашей семьи.\n\nО, старый шкаф, сколько ты видел! Ты помнишь, как бабушка читала маме вслух при свете лампы, как мама готовилась у тебя к экзаменам, как я прятался за тобой, когда играл с сестрой. Ты пережил три переезда, ремонт и нашу кошку, которая любила спать на твоей верхней полке.\n\nВзрослые часто говорят, что шкаф давно пора выбросить: он занимает слишком много места, а книги сейчас можно читать в телефоне. Конечно, они правы, ведь всё, что ни делается, — к лучшему. Но мне кажется, что вместе со шкафом из дома уйдёт что-то очень важное, что нельзя купить ни в одном магазине.\n\nКогда-нибудь шкаф всё-таки увезут, книги отдадут другим людям, а на его месте поставят что-нибудь новое и удобное. Но я знаю, что он останется в моей памяти таким, каким я вижу его сейчас: тёмным, тёплым и полным историй."
        rubric: ["写一件或几件具体的老东西，有感官细节", "写出它见证过的家庭往事", "至少一处直接呼告（[О, …]{.ru} 或对物、对人的称呼）", "至少一处预言式的将来时或带反讽的评论", "250–300 词"]
        notes: "范文约 260 词。仿照选文的手段：气味的细节直接借用布尔加科夫的“巧克力味的书”；第三段用 [О, старый шкаф, сколько ты видел!]{.ru} 对物呼告，像选文第 2 段对母亲呼告一样；第四段 [всё, что ни делается, — к лучшему]{.ru} 借用选文第 6 段的反讽；最后一段用将来时 [увезут, раздадут, поставят]{.ru} 预言，呼应选文第 13 段的 [Упадут стены …]{.ru}。"
