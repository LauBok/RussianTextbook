lesson: L63
grammar: "[занима́ться]{.ru}、[интересова́ться]{.ru} + 第五格；[интересова́ться]{.ru} 的变位（[-ова-]{.ru} → [-у-]{.ru}）；[занима́ться]{.ru} 与 [игра́ть в]{.ru} 的区别。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的正确形式。
    why: "[занима́ться]{.ru} 按 [чита́ть]{.ru} 变位再加 [-ся]{.ru}：元音后加 [-сь]{.ru}（[занима́юсь, занима́етесь]{.ru}），辅音后加 [-ся]{.ru}。[интересова́ться]{.ru} 的 [-ова-]{.ru} 在现在时变成 [-у-]{.ru}，不能写成 [интересова́ется]{.ru}。"
    items:
      - stem: Я ___ спо́ртом.
        hint: занима́ться
        accept: [занима́юсь]
      - stem: Чем ты ___?
        hint: интересова́ться
        accept: [интересу́ешься]
      - stem: А́нна ___ му́зыкой.
        hint: интересова́ться
        accept: [интересу́ется]
      - stem: Мы ___ в шахма́тном клу́бе.
        hint: занима́ться
        accept: [занима́емся]
      - stem: Чем вы ___?
        hint: занима́ться
        accept: [занима́етесь]
      - stem: Ми́ша и па́па ___ хокке́ем.
        hint: интересова́ться
        accept: [интересу́ются]

  - id: e2
    type: fill
    task: 把括号里的名词变成第五格。
    why: "[занима́ться]{.ru}、[интересова́ться]{.ru} 后面一律用第五格。第 3 题 [хокке́й]{.ru} 以 [-й]{.ru} 结尾，第五格是 [хокке́ем]{.ru}；第 4 题 [пла́вание]{.ru} 以 [-е]{.ru} 结尾，变 [-ем]{.ru}；第 5 题 [ша́хматы]{.ru} 只有复数，第五格是 [ша́хматами]{.ru}，作为固定形式记住；第 6 题 [кино́]{.ru} 不变格。"
    items:
      - stem: Ми́ша занима́ется ___.
        hint: футбо́л
        accept: [футбо́лом]
      - stem: А́нна интересу́ется ___.
        hint: му́зыка
        accept: [му́зыкой]
      - stem: Па́па интересу́ется ___.
        hint: хокке́й
        accept: [хокке́ем]
      - stem: Ма́ма занима́ется ___.
        hint: пла́вание
        accept: [пла́ванием]
      - stem: Ван Лэй занима́ется ___.
        hint: ша́хматы
        accept: [ша́хматами]
      - stem: Я интересу́юсь ___.
        hint: кино́
        accept: [кино́]
      - stem: Ка́тя интересу́ется ___.
        hint: исто́рия
        accept: [исто́рией]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "[интересова́ться]{.ru} 要第五格，[люби́ть]{.ru} 要第四格，[нра́виться]{.ru} 的主语是第一格。第 4 题 [игра́ть в]{.ru} 后用第四格 [ша́хматы]{.ru}，[занима́ться]{.ru} 后才用第五格 [ша́хматами]{.ru}。"
    items:
      - stem: Я интересу́юсь ___.
        options: [му́зыка, му́зыку, му́зыкой]
        answer: му́зыкой
      - stem: Я люблю́ ___.
        options: [му́зыка, му́зыку, му́зыкой]
        answer: му́зыку
      - stem: Мне нра́вится ___.
        options: [му́зыка, му́зыку, му́зыкой]
        answer: му́зыка
      - stem: Мы игра́ем в ___.
        options: [ша́хматы, ша́хматами]
        answer: ша́хматы
      - stem: Мы занима́емся ___.
        options: [ша́хматы, ша́хматами]
        answer: ша́хматами

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题“踢足球”指经常训练，用 [занима́ться футбо́лом]{.ru}；如果说 [игра́ть в футбо́л]{.ru} 也可以接受。第 4 题“下了四十年”用现在时。
    items:
      - zh: 米沙练足球，一周三次。
        accept: ["Ми́ша занима́ется футбо́лом три ра́за в неде́лю.", "Ми́ша занима́ется футбо́лом, три ра́за в неде́лю.", "Три ра́за в неде́лю Ми́ша занима́ется футбо́лом.", "Ми́ша игра́ет в футбо́л три ра́за в неде́лю.", "Ми́ша три ра́за в неде́лю занима́ется футбо́лом.", "Три ра́за в неде́лю Ми́ша игра́ет в футбо́л."]
        rubric: ["[занима́ться]{.ru} + 第五格 [футбо́лом]{.ru}，或 [игра́ть в футбо́л]{.ru}", "[три ра́за в неде́лю]{.ru}"]
      - zh: 你对什么感兴趣？——对历史。
        accept: ["— Чем ты интересу́ешься? — Исто́рией.", "— Чем ты интересу́ешься? — Я интересу́юсь исто́рией."]
        rubric: ["疑问词用第五格 [чем]{.ru}", "答句 [исто́рией]{.ru} 也用第五格"]
      - zh: 安娜对电影和音乐感兴趣，她弹吉他。
        accept: ["А́нна интересу́ется кино́ и му́зыкой, она́ игра́ет на гита́ре.", "А́нна интересу́ется кино́ и му́зыкой. Она́ игра́ет на гита́ре.", "А́нна интересу́ется кино́ и му́зыкой и игра́ет на гита́ре."]
        rubric: ["[интересу́ется]{.ru} + 第五格", "[кино́]{.ru} 不变格", "乐器用 [игра́ть на]{.ru} + 第六格"]
      - zh: 我下国际象棋已经四十年了。
        accept: ["Я игра́ю в ша́хматы уже́ со́рок лет.", "Я уже́ со́рок лет игра́ю в ша́хматы."]
        rubric: ["用现在时 [игра́ю]{.ru}", "[игра́ть в ша́хматы]{.ru}", "[со́рок лет]{.ru}"]
      - zh: 想跟我下一盘棋吗？——很乐意！
        accept: ["— Хо́чешь сыгра́ть со мной? — С удово́льствием!", "— Хо́чешь сыгра́ть со мной в ша́хматы? — С удово́льствием!", "— Хоти́те сыгра́ть со мной? — С удово́льствием!", "— Хоти́те сыгра́ть со мной в ша́хматы? — С удово́льствием!"]
        rubric: ["[со мной]{.ru}", "[С удово́льствием!]{.ru}"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 介绍你和你的家人、朋友的业余爱好，60–90 词。用上 [занима́ться]{.ru}、[интересова́ться]{.ru}、[игра́ть в / на]{.ru}。
        length: 60–90
        model: |
          Я давно́ интересу́юсь исто́рией. Ка́ждый ве́чер я чита́ю. А ещё я занима́юсь пла́ванием: два ра́за в неде́лю я хожу́ в бассе́йн. Мой па́па интересу́ется спо́ртом. Он лю́бит хокке́й и футбо́л и ча́сто смо́трит их по телеви́зору. Моя́ ма́ма игра́ет на гита́ре. Мой друг Ми́ша занима́ется ша́хматами. Иногда́ мы с ним игра́ем в ша́хматы, но он игра́ет о́чень хорошо́, а я ещё пло́хо.
        rubric: ["至少两处 [занима́ться]{.ru} 或 [интересова́ться]{.ru} + 第五格", "区分 [игра́ть в]{.ru} + 第四格与 [игра́ть на]{.ru} + 第六格", "写清每个人的爱好和频率"]
        notes: 范文先写自己，再写家人和朋友，每人一两句。[занима́ться]{.ru} 用于经常练的项目，[интересова́ться]{.ru} 用于感兴趣的领域，[игра́ть]{.ru} 用于具体地玩。结尾的 [мы с ним]{.ru} 复习了上一课的句型。
