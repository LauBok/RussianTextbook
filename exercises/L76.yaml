lesson: L76
grammar: "[покупа́ть / купи́ть]{.ru} 的体的对立；商店里的完成体命令式 [покажи́те, да́йте, возьми́те, приме́рьте]{.ru}；[э́ту, ту]{.ru} + 阴性名词第四格。"
exercises:

  - id: e1
    type: picture_qa
    task: 看图，用 [Что э́то?]{.ru} 问答。
    example: 1
    why: 衣物都是事物，用 [что]{.ru} 问。[перча́тки]{.ru}、[боти́нки]{.ru} 是成对的东西，通常用复数，回答时说 [Э́то перча́тки]{.ru}、[Э́то боти́нки]{.ru}。
    items:
      - image: kurtka.svg
        qword: Что
        answer: ["Э́то ку́ртка."]
      - image: shapka.svg
        qword: Что
        answer: ["Э́то ша́пка."]
      - image: sharf.svg
        qword: Что
        answer: ["Э́то шарф."]
      - image: perchatki.svg
        qword: Что
        answer: ["Э́то перча́тки."]
      - image: sviter.svg
        qword: Что
        answer: ["Э́то сви́тер."]
      - image: botinki.svg
        qword: Что
        answer: ["Э́то боти́нки."]
  - id: e2
    type: choice
    task: 选择 [покупа́ть]{.ru} 或 [купи́ть]{.ru} 的正确形式。
    why: 第 1 题有 [три часа́]{.ru}（多长时间），第 3 题有 [всегда́]{.ru}（习惯），第 5 题是此刻正在进行，都用未完成体。第 2 题说买成了的结果，第 4 题是将来买一次，第 6 题请人买一次，都用完成体。
    items:
      - stem: Ты ___ ку́ртку три часа́!
        options: [покупа́л, купи́л]
        answer: покупа́л
      - stem: Наконе́ц Ван Лэй ___ чёрную ку́ртку.
        options: [покупа́л, купи́л]
        answer: купи́л
      - stem: Ра́ньше я всегда́ ___ ве́щи в Кита́е.
        options: [покупа́л, купи́л]
        answer: покупа́л
      - stem: За́втра я ___ тёплую ша́пку.
        options: [покупа́ю, куплю́]
        answer: куплю́
      - stem: — Что ты де́лаешь? — Я ___ пода́рок для ма́мы.
        options: [покупа́ю, куплю́]
        answer: покупа́ю
      - stem: Ми́ша, ___, пожа́луйста, хлеб!
        options: [покупа́й, купи́]
        answer: купи́

  - id: e3
    type: rewrite
    task: 按例句向售货员提出请求。
    example:
      cue: показа́ть / э́та ку́ртка
      answer: Покажи́те, пожа́луйста, э́ту ку́ртку.
    why: "命令式：[показа́ть → покажи́те]{.ru}，[дать → да́йте]{.ru}。名词和指示代词都用第四格：阴性 [э́та ку́ртка → э́ту ку́ртку]{.ru}，[та ша́пка → ту ша́пку]{.ru}；阳性非动物名词、复数和中性名词第四格与第一格相同：[э́тот шарф]{.ru}、[э́ти перча́тки]{.ru}、[э́то пальто́]{.ru}。"
    items:
      - cue: дать / э́та ша́пка
        accept: ["Да́йте, пожа́луйста, э́ту ша́пку."]
      - cue: показа́ть / тот шарф
        accept: ["Покажи́те, пожа́луйста, тот шарф."]
      - cue: дать / э́ти перча́тки
        accept: ["Да́йте, пожа́луйста, э́ти перча́тки."]
      - cue: показа́ть / та си́няя ку́ртка
        accept: ["Покажи́те, пожа́луйста, ту си́нюю ку́ртку."]
      - cue: дать / э́то пальто́
        accept: ["Да́йте, пожа́луйста, э́то пальто́."]
  - id: e4
    type: fill
    task: 写出动词的正确形式。
    why: "[купи́ть]{.ru} 第一人称单数插入 [л]{.ru}：[куплю́]{.ru}，其余人称重音在词干：[ку́пишь, ку́пит]{.ru}。[дать]{.ru} 的变位不规则：[дам, дашь, даст, дади́м, дади́те, даду́т]{.ru}。[показа́ть]{.ru} 词干 [з → ж]{.ru}：[покажу́, пока́жешь]{.ru}。完成体的这些形式表示将来。"
    items:
      - stem: За́втра я ___ сви́тер.
        hint: купи́ть
        accept: ["куплю́"]
      - stem: Что ты ___ ма́ме?
        hint: купи́ть
        accept: ["ку́пишь"]
      - stem: Я ___ тебе́ мой слова́рь.
        hint: дать
        accept: ["дам"]
      - stem: Продаве́ц ___ вам разме́р пятьдеся́т.
        hint: дать
        accept: ["даст"]
      - stem: Ве́чером я ___ А́нне фо́то.
        hint: показа́ть
        accept: ["покажу́"]
  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1、2 题是向售货员提出请求，用完成体命令式；第 3 题强调买的过程用了多长时间，用未完成体；第 4 题是一次买成，用完成体。
    items:
      - zh: 请把那件黑外套给我看看。
        accept: ["Покажи́те, пожа́луйста, ту чёрную ку́ртку.", "Покажи́те мне, пожа́луйста, ту чёрную ку́ртку.", "Покажи́те, пожа́луйста, вон ту чёрную ку́ртку.", "Покажи́те мне, пожа́луйста, вон ту чёрную ку́ртку."]
        rubric: ["命令式 [покажи́те]{.ru}", "[ту чёрную ку́ртку]{.ru} 三个词都用阴性第四格"]
      - zh: 请给我 50 号的。
        accept: ["Да́йте, пожа́луйста, пятьдеся́т.", "Да́йте мне, пожа́луйста, разме́р пятьдеся́т.", "Да́йте, пожа́луйста, разме́р пятьдеся́т."]
        rubric: ["命令式 [да́йте]{.ru}", "尺码可以只说数字"]
      - zh: 他买帽子买了一个小时。
        accept: ["Он покупа́л ша́пку час.", "Он покупа́л ша́пку це́лый час.", "Он час покупа́л ша́пку."]
        rubric: ["持续的时间要求未完成体 [покупа́л]{.ru}", "[ша́пку]{.ru} 用第四格"]
      - zh: 王磊买了一顶暖和的帽子。
        accept: ["Ван Лэй купи́л тёплую ша́пку."]
        rubric: ["结果用完成体 [купи́л]{.ru}", "[тёплую ша́пку]{.ru} 用阴性第四格"]

  - id: e6
    type: open
    task: 情景对话：你在商店里买一件毛衣（或大衣、围巾），和售货员对话。
    items:
      - prompt: 用上 [Покажи́те, пожа́луйста…]{.ru}、[Да́йте, пожа́луйста…]{.ru}、[Како́й у вас разме́р?]{.ru}、[Я его́ (её) возьму́]{.ru}。
        length: 60–90
        model: "— Здра́вствуйте! Вам помо́чь?\n— Да. Покажи́те, пожа́луйста, э́тот си́ний сви́тер.\n— Пожа́луйста. Како́й у вас разме́р?\n— Со́рок шесть.\n— Вот, приме́рьте.\n— Он ма́ленький. Да́йте, пожа́луйста, со́рок во́семь.\n— Вот со́рок во́семь. Ну как?\n— Хорошо́. А ско́лько он сто́ит?\n— Цена́ на этике́тке.\n— Не о́чень до́рого. Я его́ возьму́."
        rubric: ["请求用完成体命令式 [покажи́те, да́йте, приме́рьте]{.ru}", "宾语用第四格，阳性非动物名词与第一格同形", "代词 [он / его́]{.ru} 或 [она́ / её]{.ru} 和所买的东西的性一致", "有问候和对尺码、价格的问答"]
        notes: 范文是商店对话的典型顺序：招呼——指出要看的东西——问尺码——试穿——换尺码——问价钱——决定买。[сви́тер]{.ru} 是阳性，所以说 [э́тот си́ний сви́тер]{.ru}、[он ма́ленький]{.ru}、[я его́ возьму́]{.ru}；如果买 [ку́ртка]{.ru}，就要换成 [э́ту си́нюю ку́ртку]{.ru}、[она́ ма́ленькая]{.ru}、[я её возьму́]{.ru}。
