lesson: L25
grammar: "不定向运动动词 [ходи́ть]{.ru}（[хожу́, хо́дишь]{.ru}）和 [е́здить]{.ru}（[е́зжу, е́здишь]{.ru}）表示经常的往返；与定向动词 [идти́]{.ru}、[е́хать]{.ru}（此刻一个方向）的区别；频率词 [всегда́, ка́ждый день, ча́сто, иногда́, ре́дко]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的动词形式。
    why: 有 [ка́ждый день]{.ru}、[ча́сто]{.ru}、[иногда́]{.ru}、[ре́дко]{.ru}、[всегда́]{.ru} 这类频率词，说的是经常往返，用 [ходи́ть]{.ru}、[е́здить]{.ru}；有 [сейча́с]{.ru}，或问“现在去哪儿”，说的是这一趟，用 [идти́]{.ru}、[е́хать]{.ru}。第 6 题 [ходи́ть в шко́лу]{.ru} 是“上学”。
    items:
      - stem: Сейча́с я ___ в библиоте́ку.
        options: [иду́, хожу́]
        answer: иду́
      - stem: Я ка́ждый день ___ в библиоте́ку.
        options: [иду́, хожу́]
        answer: хожу́
      - stem: Па́па ка́ждый день ___ на заво́д.
        options: [е́дет, е́здит]
        answer: е́здит
      - stem: — Куда́ ты сейча́с ___? — На да́чу.
        options: [е́дешь, е́здишь]
        answer: е́дешь
      - stem: Мы иногда́ ___ на да́чу.
        options: [е́дем, е́здим]
        answer: е́здим
      - stem: Ми́ша ___ в шко́лу.
        options: [хо́дит, е́здит]
        answer: хо́дит
      - stem: А́нна ре́дко ___ на стадио́н.
        options: [идёт, хо́дит]
        answer: хо́дит

  - id: e2
    type: fill
    task: 用 [ходи́ть]{.ru} 或 [е́здить]{.ru} 的正确形式填空。
    why: 第一人称单数有辅音交替：[ходи́ть → хожу́]{.ru}，[е́здить → е́зжу]{.ru}，不要写成 *[ходю́]{.ru}*、*[е́зду]{.ru}*。[хожу́]{.ru} 重音在词尾，其余人称 [хо́дишь, хо́дит…]{.ru} 重音在词干。
    items:
      - stem: Я ча́сто ___ в магази́н.
        hint: ходи́ть
        accept: [хожу́]
      - stem: Я ка́ждый день ___ в университе́т.
        hint: е́здить
        accept: [е́зжу]
      - stem: Вы ча́сто ___ в библиоте́ку?
        hint: ходи́ть
        accept: [хо́дите]
      - stem: Ива́н Серге́евич и Мари́я Никола́евна иногда́ ___ на да́чу.
        hint: е́здить
        accept: [е́здят]
      - stem: Ты ка́ждый день ___ пешко́м?
        hint: ходи́ть
        accept: [хо́дишь]
      - stem: Мы всегда́ ___ туда́ вме́сте.
        hint: е́здить
        accept: [е́здим]

  - id: e3
    type: rewrite
    task: 按括号里的提示，把“这一趟”改成“经常”。
    example:
      cue: Сейча́с я иду́ в библиоте́ку. (ка́ждый день)
      answer: Я ка́ждый день хожу́ в библиоте́ку.
    why: 定向动词换成对应的不定向动词，步行和乘车不变：[иду́ → хожу́]{.ru}，[е́дет → е́здит]{.ru}。去向的 [в / на]{.ru} + 第四格保持不变。频率词可以放在句首，也可以放在动词前。
    items:
      - cue: Сейча́с Ван Лэй идёт в магази́н. (ча́сто)
        accept: [Ван Лэй ча́сто хо́дит в магази́н., Ча́сто Ван Лэй хо́дит в магази́н.]
      - cue: Сейча́с па́па е́дет на заво́д. (ка́ждый день)
        accept: [Па́па ка́ждый день е́здит на заво́д., Ка́ждый день па́па е́здит на заво́д.]
      - cue: Сейча́с мы е́дем на да́чу. (иногда́)
        accept: [Мы иногда́ е́здим на да́чу., Иногда́ мы е́здим на да́чу.]
      - cue: Сейча́с А́нна идёт в библиоте́ку. (ре́дко)
        accept: [А́нна ре́дко хо́дит в библиоте́ку., Ре́дко А́нна хо́дит в библиоте́ку.]
      - cue: Сейча́с студе́нты иду́т на уро́к. (ка́ждый день)
        accept: [Студе́нты ка́ждый день хо́дят на уро́к., Ка́ждый день студе́нты хо́дят на уро́к.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、3 题说的是经常去，用 [ходи́ть]{.ru}、[е́здить]{.ru}；第 2 题“现在”是这一趟，用 [идти́]{.ru}。第 4 题两半句形成对比：前半句经常，后半句此刻。
    items:
      - zh: 我每天去学校，晚上常去图书馆。
        accept: ["Я ка́ждый день хожу́ в университе́т, а ве́чером ча́сто хожу́ в библиоте́ку.", "Ка́ждый день я хожу́ в университе́т, а ве́чером я ча́сто хожу́ в библиоте́ку.", "Я ка́ждый день е́зжу в университе́т, а ве́чером ча́сто хожу́ в библиоте́ку.", "Я ка́ждый день хожу́ в шко́лу, а ве́чером ча́сто хожу́ в библиоте́ку."]
        rubric: ["经常去用 [ходи́ть]{.ru} 或 [е́здить]{.ru}", "[в библиоте́ку]{.ru} 用第四格"]
      - zh: ——你现在去哪儿？——去商店。
        accept: ["— Куда́ ты сейча́с идёшь? — В магази́н.", "— Куда́ ты идёшь сейча́с? — В магази́н.", "— Куда́ ты сейча́с идёшь? — Я иду́ в магази́н.", "— Куда́ ты сейча́с е́дешь? — В магази́н."]
        rubric: ["此刻的去向用 [идти́]{.ru} 或 [е́хать]{.ru}", "疑问词用 [куда́]{.ru}"]
      - zh: 我们有时坐车去别墅，奶奶住在那儿。
        accept: ["Мы иногда́ е́здим на да́чу, там живёт ба́бушка.", "Иногда́ мы е́здим на да́чу. Там живёт ба́бушка.", "Мы иногда́ е́здим на да́чу. Там живёт ба́бушка."]
        rubric: ["乘车往返用 [е́здим]{.ru}", "[на да́чу]{.ru} 用 [на]{.ru} + 第四格"]
      - zh: 我常去商店。现在我也正要去那儿。
        accept: ["Я ча́сто хожу́ в магази́н. Сейча́с я то́же иду́ туда́.", "Я ча́сто хожу́ в магази́н. И сейча́с я иду́ туда́.", "Я ча́сто хожу́ в магази́н. Сейча́с я то́же иду́ в магази́н."]
        rubric: ["前半句用 [хожу́]{.ru}，后半句用 [иду́]{.ru}", "“往那儿”用 [туда́]{.ru}"]

  - id: e5
    type: open
    task: 写一写你经常去的地方。
    items:
      - prompt: 用 5–7 个句子写你每天、经常、有时、很少去哪儿，走着去还是坐车去；最后说说你现在正去哪儿。
        length: 40–70
        model: |
          Я студе́нт. Я ка́ждый день е́зжу в университе́т: он далеко́. Ве́чером я ча́сто хожу́ в библиоте́ку. Иногда́ я хожу́ в магази́н и́ли на стадио́н. В теа́тр я хожу́ ре́дко. А сейча́с я иду́ домо́й.
        rubric: ["[ходи́ть]{.ru}、[е́здить]{.ru} 和频率词搭配，至少四句", "最后一句用 [идти́]{.ru} 或 [е́хать]{.ru}", "[в / на]{.ru} + 第四格正确"]
        notes: 范文按频率由高到低排列：[ка́ждый день]{.ru}、[ча́сто]{.ru}、[иногда́]{.ru}、[ре́дко]{.ru}，最后用 [сейча́с я иду́]{.ru} 收尾，把不定向和定向动词放在一起对比。[В теа́тр я хожу́ ре́дко]{.ru} 把地点提到句首，突出对比。
