lesson: B2-L20
grammar: "反身代词 [себя́]{.ru} 的变格（[себя́, себе́, собо́й]{.ru}）；[себя́]{.ru} 指主语本人，不分人称、性、数；[себя́]{.ru} 与人称代词的区别；[чу́вствовать себя́, взять с собо́й, бере́чь себя́, у себя́]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用 [себя́]{.ru} 的正确形式填空。
    why: "[себя́]{.ru} 按动词或前置词的要求变格：[чу́вствовать себя́]{.ru}、[посмотре́ть на себя́]{.ru}、[у себя́]{.ru} 用 [себя́]{.ru}（第四格、第二格）；[купи́ть себе́]{.ru}（第三格）、[о себе́]{.ru}（第六格）用 [себе́]{.ru}；[с собо́й]{.ru} 用第五格。第五格 [собо́й]{.ru} 的第一个元音是 [о]{.ru}，不要写成 [себо́й]{.ru}。"
    items:
      - stem: Как ты ___ чу́вствуешь?
        accept: ["себя́"]
      - stem: Ди́ма купи́л ___ но́вую ку́ртку.
        accept: ["себе́"]
      - stem: Возьми́ с ___ шарф, ве́чером бу́дет хо́лодно.
        accept: ["собо́й"]
      - stem: Не ду́май то́лько о ___!
        accept: ["себе́"]
      - stem: Ми́ша посмотре́л на ___ в зе́ркало и засмея́лся.
        accept: ["себя́"]
      - stem: Ве́чером па́па обы́чно чита́ет у ___ в ко́мнате.
        accept: ["себя́"]
      - stem: Мы взя́ли с ___ бутербро́ды и чай.
        accept: ["собо́й"]

  - id: e2
    type: choice
    task: 选择 [себя́]{.ru} 的形式或人称代词。
    why: "先找出做动作的人（主语，命令式里是听话的人），再看代词指的是不是这个人。指同一个人用 [себя́]{.ru}：第 1 题安娜给自己买，第 3 题“你”只想着“你自己”，第 4 题让王磊讲他自己，第 6 题“您”随身带。指另一个人用人称代词：第 2 题安娜给米沙买，第 5 题奶奶对迪马说。"
    items:
      - stem: А́нне бы́ло хо́лодно, и она́ купи́ла ___ шарф.
        options: [себе́, ей]
        answer: себе́
      - stem: Ми́ша заболе́л, и А́нна купи́ла ___ лека́рство.
        options: [себе́, ему́]
        answer: ему́
      - stem: Ты ду́маешь то́лько о ___!
        options: [себе́, тебе́]
        answer: себе́
      - stem: Ван Лэй, расскажи́ нам о ___.
        options: [себе́, тебе́]
        answer: себе́
      - stem: "Ба́бушка позвони́ла Ди́ме и сказа́ла ___: «Береги́ себя́!»"
        options: [себе́, ему́]
        answer: ему́
      - stem: Вы взя́ли с ___ лека́рство?
        options: [собо́й, ва́ми]
        answer: собо́й

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题“感觉”用 [чу́вствовать себя́]{.ru}，[себя́]{.ru} 不能省。第 2 题“带上”用 [взять с собо́й]{.ru}。第 3 题“给自己”是第三格 [себе́]{.ru}。第 4 题“疗养”用 [лечи́ться]{.ru}。第 5 题 [навести́ть]{.ru} 直接接第四格。"
    items:
      - zh: 你今天感觉怎么样？
        accept: ["Как ты себя́ чу́вствуешь сего́дня?", "Как ты сего́дня себя́ чу́вствуешь?", "Как ты сего́дня чу́вствуешь себя́?", "Как ты чу́вствуешь себя́ сего́дня?", "Как вы себя́ чу́вствуете сего́дня?", "Как вы сего́дня себя́ чу́вствуете?", "Как вы сего́дня чу́вствуете себя́?", "Как вы чу́вствуете себя́ сего́дня?", "Сего́дня как ты себя́ чу́вствуешь?", "Как ты себя́ сего́дня чу́вствуешь?", "Как вы себя́ сего́дня чу́вствуете?"]
        rubric: ["[чу́вствовать себя́]{.ru}，不能漏掉 [себя́]{.ru}"]
      - zh: 别忘了把药带上。
        accept: ["Не забу́дь взять с собо́й лека́рство.", "Не забу́дь взять лека́рство с собо́й.", "Не забу́дьте взять с собо́й лека́рство.", "Не забу́дьте взять лека́рство с собо́й."]
        rubric: ["[взять с собо́й]{.ru}", "否定命令式用 [не забу́дь(те)]{.ru}"]
      - zh: 他给自己买了一面小镜子。
        accept: ["Он купи́л себе́ ма́ленькое зе́ркало.", "Он купи́л ма́ленькое зе́ркало себе́."]
        rubric: ["[себе́]{.ru}：第三格", "[зе́ркало]{.ru} 是中性，形容词用 [ма́ленькое]{.ru}"]
      - zh: 奶奶在疗养院疗养。
        accept: ["Ба́бушка ле́чится в санато́рии.", "Ба́бушка отдыха́ет в санато́рии."]
        rubric: ["[лечи́ться]{.ru} 或 [отдыха́ть]{.ru}", "[в санато́рии]{.ru}：[-ий]{.ru} 结尾的名词第六格是 [-ии]{.ru}"]
      - zh: 星期一我们去看望了迪马。
        accept: ["В понеде́льник мы навести́ли Ди́му.", "Мы навести́ли Ди́му в понеде́льник.", "Мы в понеде́льник навести́ли Ди́му.", "В понеде́льник мы е́здили к Ди́ме.", "Мы е́здили к Ди́ме в понеде́льник."]
        rubric: ["[навести́ть]{.ru} + 第四格 [Ди́му]{.ru}", "完成体过去时 [навести́ли]{.ru}"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ Ди́мы не́ было на ле́кции? Кто его́ навести́л и что они́ взя́ли с собо́й? Почему́ Ди́ма заболе́л? Кто ему́ позвони́л и что она́ сказа́ла? Как Ди́ма чу́вствовал себя́ ве́чером?]{.ru}"
        length: 50–80
        model: "В понеде́льник Ди́мы не́ было на ле́кции: он простуди́лся. У него́ была́ температу́ра и на́сморк. Ван Лэй и А́нна реши́ли навести́ть его́ и взя́ли с собо́й мёд, лимо́ны и лека́рство. Ди́ма заболе́л, потому́ что в суббо́ту гуля́л весь день в лёгкой ку́ртке, а ве́чером пошёл дождь. Пото́м ему́ позвони́ла ба́бушка из санато́рия и сказа́ла: «Береги́ себя́!» Ве́чером Ди́ма чу́вствовал себя́ уже́ лу́чше."
        rubric: ["回答全部五个问题", "至少用对三处 [себя́]{.ru} 的形式（[взя́ли с собо́й, береги́ себя́, чу́вствовал себя́]{.ru} 等）", "说明原因用 [потому́ что]{.ru}"]
        notes: 范文约 70 词。前两句用冒号和 [у него́]{.ru} 把生病的情况说清楚；原因用 [потому́ что]{.ru}；奶奶的话保留成直接引语，因为 [Береги́ себя́!]{.ru} 是一句固定的关心话。

  - id: e5
    type: open
    task: 作文。写一写你上一次感冒或生病：是怎么病的，有哪些症状，谁照顾了你，你自己做了什么，后来怎样。
    items:
      - prompt: 写 100–150 词。至少用四处 [себя́]{.ru} 的不同形式，用上 [чу́вствовать себя́]{.ru} 和 [взять с собо́й]{.ru}。
        length: 100–150
        model: "Зимо́й я си́льно простуди́лся. Был моро́з, а я пошёл в университе́т без ша́пки и без ша́рфа. Ве́чером я чу́вствовал себя́ ужа́сно: у меня́ боле́ла голова́ и го́рло, была́ температу́ра три́дцать во́семь. Я посмотре́л на себя́ в зе́ркало: нос кра́сный, глаза́ кра́сные. У́тром я позвони́л ма́ме. Она́ сказа́ла: «Лежи́ до́ма, пей чай с мёдом и береги́ себя́!» Мой друг купи́л мне лека́рство и лимо́ны. Я лежа́л у себя́ в ко́мнате под тёплым одея́лом, спал и чита́л. Че́рез три дня я уже́ чу́вствовал себя́ хорошо́. Тепе́рь зимо́й я всегда́ беру́ с собо́й тёплую ша́пку и шарф. Здоро́вье — э́то о́чень ва́жно, поэ́тому на́до ду́мать о себе́."
        rubric: ["内容完整：原因、症状、照顾、结果、教训", "至少四处 [себя́]{.ru}，格用对", "别人为“我”做的事用人称代词（[купи́л мне]{.ru}），不用 [себе́]{.ru}", "100–150 词"]
        notes: 范文按时间顺序写：生病的原因—症状—谁帮了忙—恢复—以后怎么做。[себя́]{.ru} 用了七次，有 [себя́, собо́й, себе́]{.ru} 三种形式：[чу́вствовал себя́]{.ru}（两次）、[посмотре́л на себя́]{.ru}、[береги́ себя́]{.ru}、[у себя́ в ко́мнате]{.ru}、[беру́ с собо́й]{.ru}、[ду́мать о себе́]{.ru}。注意 [Мой друг купи́л мне лека́рство]{.ru}：买药的是朋友，药是给“我”的，所以用 [мне]{.ru}，不用 [себе́]{.ru}。
