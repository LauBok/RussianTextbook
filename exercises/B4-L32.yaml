lesson: B4-L32
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第四单元七课的文体知识：新闻报道、评论、科普文章、访谈与转述、演讲、合同与规章、广告与网络评论，最后一题把测试选文的内容改写为三种语体。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看那一小题对应的课（第 1—2 小题第 25 课，第 3 小题第 26 课，第 4 小题第 27 课，第 5 小题第 28 课，第 6—7 小题第 29 课，第 8—9 小题第 30 课，第 10 小题第 31 课）；第 2、5 题回看测试选文和第 25 课；第 3 题回看第 30 课；第 4 题回看第 28 课；第 6 题回看第 25 课的概要写作；第 7 题回看本课“同一内容，三种语体”和第 29—31 课，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 根据本单元的文体知识选择正确答案。
    why: "第 1 题新闻按倒金字塔排列，最重要的事实放在开头的导语里，越往后越次要。第 2 题 [В мэрии отвечают]{.ru} 是不定人称句，不点出具体的人，表示这是机构的正式立场；用 [я]{.ru}、[мы]{.ru} 就成了记者或某个人自己的话。第 3 题评论“先让步，再转折”：先承认对方有道理（[С этим трудно не согласиться]{.ru}），再用 [но]{.ru} 反驳，这样显得公正。第 4 题 [называть]{.ru} 下定义时用主动的不定人称形式 [называют]{.ru}，被定义的词用第五格放在句首；[называются]{.ru} 要求被定义的词作第一格主语，[является]{.ru} 后面要第五格，都和句子的格对不上。第 5 题一般疑问句变成间接引语用 [ли]{.ru}，[ли]{.ru} 放在被提问的词后面：[согласна ли она]{.ru}；时态和语气不变。第 6 题演讲者自问自答，是设问；它把听众的注意力引到答案上。第 7 题每句开头重复 [Вы научились]{.ru}，这是首语重复（[анафора]{.ru}），属于排比（[параллелизм]{.ru}）；三句结构相同，按“三”来组织，最容易记住。第 8 题合同只说要做什么，不说“谁在做”，也不带感情：用短尾被动形动词 [запрещено]{.ru}；[пожалуйста]{.ru}、[ладно]{.ru} 是口语。第 9 题名词化：[если наниматель не заплатит вовремя]{.ru} → [в случае задержки оплаты]{.ru}，[в случае]{.ru} 后面用第二格 [задержки]{.ru}，不能用第一格或第四格。第 10 题 [универ]{.ru} 是截短词，只用于口语和网络评论，不进入合同和科普文章。"
    items:
      - stem: "Самая важная информация в новостной заметке находится ___."
        options: ["в начале текста", "в конце текста", "в середине текста"]
        answer: "в начале текста"
      - stem: "Чтобы показать официальное мнение организации, журналист пишет: «___ отвечают, что предпринимателей предупредили за год»."
        options: ["В мэрии", "Я", "Мы"]
        answer: "В мэрии"
      - stem: "Автор статьи пишет: «С этим трудно не согласиться. Но…» Так он ___."
        options: ["сначала соглашается с другой стороной, а потом спорит", "делает вывод", "даёт определение"]
        answer: "сначала соглашается с другой стороной, а потом спорит"
      - stem: "Эндемиками ___ виды, которые живут только на определённой территории."
        options: ["называют", "называются", "является"]
        answer: "называют"
      - stem: "«Вы с ней согласны?» → Журналист спросил, ___ с поговоркой."
        options: ["согласна ли она", "ли она согласна", "что она согласна"]
        answer: "согласна ли она"
      - stem: "«Каким будет мир через двадцать лет? Это зависит от вас». Это ___."
        options: ["риторический вопрос", "определение", "цитата из договора"]
        answer: "риторический вопрос"
      - stem: "«Вы научились учиться. Вы научились спорить. Вы научились работать в команде». Здесь в начале каждого предложения ___."
        options: ["повторяются одни и те же слова", "стоит вопрос", "дано определение"]
        answer: "повторяются одни и те же слова"
      - stem: "Правила проживания: «Курение в квартире ___»."
        options: ["запрещено", "нельзя, пожалуйста", "не надо, ладно"]
        answer: "запрещено"
      - stem: "«Если наниматель не заплатит вовремя…» → «В случае ___ оплаты…»"
        options: ["задержки", "задержка", "задержку"]
        answer: "задержки"
      - stem: "Слово «универ» уместно ___."
        options: ["в отзыве в социальной сети", "в договоре", "в научной статье"]
        answer: "в отзыве в социальной сети"

  - id: e2
    type: open
    task: 理解问答。根据测试选文，用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что будет в новом парке и почему главный корпус завода решили сохранить?]{.ru}"
        length: 40–70
        model: "В новом парке будут деревья, пешеходные и велосипедные дорожки, библиотека, зал для выставок, кафе, бесплатные мастерские и площадка для концертов. Главный корпус решили сохранить, потому что на заводе работали несколько поколений горожан и город хотел сохранить память о нём."
        rubric: ["列出至少四样设施", "说出保留主厂房的原因：留住对工厂的记忆"]
        notes: "答案在第 1—3 段。注意第 2 段的原因是用直接引语说出来的，回答时要改成自己的话。"
      - prompt: "[Кто недоволен проектом и почему? Что отвечает мэрия?]{.ru}"
        length: 40–70
        model: "Часть жителей считает, что деньги лучше было потратить на ремонт дорог и школ. Недовольны и предприниматели, которые держали на заводе склады: им пришлось переехать на окраину, а возить товар оттуда дальше и дороже. В мэрии отвечают, что их предупредили за год и предложили им помещения по более низкой цене."
        rubric: ["说出两类不满的人及理由", "说出市政府的回应"]
        notes: "第 7 段。这一段体现了新闻的平衡：反对意见后面紧跟着市政府的回应，记者自己不下结论。"
      - prompt: "[Как выбирали проект парка и кто за него платил?]{.ru}"
        length: 30–60
        model: "Проект выбрали на открытом конкурсе, в котором участвовали 14 команд архитекторов. Победителя выбрали сами горожане на сайте мэрии. Работы стоили 840 миллионов рублей: две трети дал бюджет области, остальное — городской бюджет и частные компании."
        rubric: ["说出公开竞赛和市民投票", "说出费用和三个出资方"]
        notes: "第 4 段。数字要准确：[две трети]{.ru} 是三分之二。"

  - id: e3
    type: fill
    task: 公园管理处要把测试选文里的信息写成规章。用括号里的词的适当形式填空，使句子符合公文语体。
    why: "第 1 题名词化：[при]{.ru} + 第六格表示“在……时”，[входить]{.ru} 的动名词是 [вход]{.ru}，第六格 [входе]{.ru}。第 2 题 [в случае]{.ru} + 第二格：[нарушения]{.ru}，不要写成第一格 [нарушение]{.ru}。第 3 题 [по]{.ru} + 第六格表示“在……之后”：[по окончании]{.ru}，这是公文的固定说法，注意词尾是 [-ии]{.ru}。第 4 题短尾被动形动词表示规定的状态，和中性名词 [курение]{.ru} 一致：[запрещено]{.ru}。第 5 题被动形动词长尾作定语，和 [ущерб]{.ru}（阳性、第一格）一致：[причинённый]{.ru}。第 6 题带 [-ся]{.ru} 的未完成体动词表示被动：[проводятся]{.ru}，和复数名词 [занятия]{.ru} 一致，用第三人称复数；写成 [проводят]{.ru} 就成了不定人称句，也不错，但规章里更常用 [-ся]{.ru}。"
    items:
      - stem: "При ___ в мастерскую посетитель показывает билет."
        hint: вход
        accept: ["входе"]
      - stem: "В случае ___ настоящих правил посетитель должен покинуть парк."
        hint: нарушение
        accept: ["нарушения"]
      - stem: "По ___ занятий мастерская закрывается."
        hint: окончание
        accept: ["окончании"]
      - stem: "Курение на территории парка ___."
        hint: запретить
        accept: ["запрещено"]
      - stem: "Ущерб, ___ имуществу парка, возмещается посетителем."
        hint: причинить
        accept: ["причинённый"]
      - stem: "Занятия в мастерских ___ бесплатно."
        hint: проводить
        accept: ["проводятся"]

  - id: e4
    type: rewrite
    task: 记者要把采访记录改写成报道。把直接引语改成间接引语。
    why: "第 1 题第一人称复数 [мы]{.ru} 变成第三人称 [они]{.ru}，时态不变。第 2 题一般疑问句用 [ли]{.ru}，[ли]{.ru} 放在被提问的动词 [предложили]{.ru} 后面；[вам]{.ru} 变成 [ему]{.ru}。第 3 题特殊疑问句保留疑问词 [почему]{.ru}，不加 [ли]{.ru}，也不加 [что]{.ru}。第 4 题 [я]{.ru} 变成 [она]{.ru}，代词也可以省去；俄语间接引语的时态和直接引语一样，不需要像英语那样“后退”。"
    example:
      cue: "Архитектор сказал: «Я считаю этот проект удачным»."
      answer: "Архитектор сказал, что он считает этот проект удачным."
    items:
      - cue: "Начальник отдела культуры объяснила: «Мы хотели сохранить память о заводе»."
        accept: ["Начальник отдела культуры объяснила, что они хотели сохранить память о заводе.", "Начальник отдела культуры объяснила, что в мэрии хотели сохранить память о заводе."]
      - cue: "Журналист спросил предпринимателя: «Вам предложили другое помещение?»"
        accept: ["Журналист спросил предпринимателя, предложили ли ему другое помещение."]
      - cue: "Журналист спросил архитектора: «Почему такие проекты важны для города?»"
        accept: ["Журналист спросил архитектора, почему такие проекты важны для города."]
      - cue: "Жительница соседнего дома рассказала: «Я раньше обходила это место стороной»."
        accept: ["Жительница соседнего дома рассказала, что она раньше обходила это место стороной.", "Жительница соседнего дома рассказала, что раньше обходила это место стороной."]

  - id: e5
    type: open
    task: 文体分析。用俄语分析测试选文属于哪种文体，说明它的结构和语言特点，每一点都从选文里举出例子。
    items:
      - prompt: "[Определите жанр текста. Как он построен? Какие языковые средства показывают его стиль?]{.ru}"
        length: 120–170
        model: "Это новостная заметка, то есть текст публицистического стиля, который сообщает о событии. Она построена как перевёрнутая пирамида. В заголовке и подзаголовке названо главное событие, первый абзац отвечает на вопросы «что? где? когда? кто сообщил?»: в июне на месте завода откроется парк, об этом сообщила начальник отдела культуры мэрии. Дальше идут подробности, затем история завода и мнения жителей, а в конце — менее важная информация о программе праздника. В тексте много точных чисел: 840 миллионов рублей, две трети, 14 команд, с 7 до 23 часов. Журналист сам ничего не оценивает: все оценки принадлежат другим людям, и каждый раз указано, кто говорит («объяснила начальник отдела культуры», «считает эксперт», «по его мнению»). Мнение мэрии передано предложением «В мэрии отвечают», где не назван конкретный человек. В тексте слышны обе стороны: после слов довольной жительницы идут мнения недовольных и ответ мэрии."
        rubric: ["判断为新闻报道，说明倒金字塔结构", "说明导语回答了哪些问题", "举出具体数字", "说明消息来源的三种写法（直接引语、插入语、不定人称句）", "说明平衡：支持与反对都有，记者不评价", "120–170 词"]
        notes: "范文约 135 词，按“文体—结构—语言—立场”的顺序写。分析题最常见的毛病是只列术语不举例：每说一个特点，都要从选文里引一个词或一句话作证据。[перевёрнутая пирамида]{.ru}、[неопределённо-личное предложение]{.ru}（不定人称句）这些术语用对了是加分项，但例子更重要。"

  - id: e6
    type: open
    task: 概要写作。用俄语把测试选文压缩成 150 词左右的短消息，保留倒金字塔结构，不用直接引语。
    items:
      - prompt: "[Напишите краткую заметку об открытии парка на месте старого завода.]{.ru}"
        length: 130–170
        model: "1 июня в Новоречинске на территории бывшего завода, которая почти двадцать лет стояла пустой, откроется новый городской парк. Как сообщили в мэрии, работы заканчиваются в конце мая. В парке посадили более двух тысяч деревьев и кустов, проложили пять километров дорожек. Главный корпус завода сохранили: в нём будут библиотека, зал для выставок и кафе, а в бывшем складе — бесплатные мастерские. Вход в парк свободный. Работы обошлись в 840 миллионов рублей; большую часть денег выделил бюджет области. Проект выбрали на открытом конкурсе по итогам голосования горожан. Многие жители рады, что опасное место наконец стало безопасным. Однако часть горожан считает, что деньги нужнее для ремонта дорог и школ, а предприниматели, которые снимали на заводе склады, недовольны переездом на окраину. По мнению специалистов, такие проекты сохраняют историю города и меняют облик района. Открытие пройдёт в День защиты детей."
        rubric: ["第一句写清楚什么事、在哪里、什么时候", "注明消息来源", "保留关键事实：设施、费用、选方案的方式", "写出支持和反对两方面意见", "不用直接引语，不加自己的评价", "130–170 词"]
        notes: "范文约 135 词。顺序与原文一致：导语（第 1 段）→ 设施（第 2—3 段）→ 费用和竞赛（第 4 段）→ 各方意见（第 6—8 段）→ 开园（第 9 段）。压缩的办法：直接引语全部改成转述或删去；次要的数字（面积、开放时间、参赛团队数）删掉；工厂的历史（第 5 段）压缩成导语里的一个从句 [которая почти двадцать лет стояла пустой]{.ru}。"

  - id: e7
    type: open
    task: 同一内容改写为三种语体。根据测试选文，把关于新公园的信息分别写成下面三种文本。注意每种文本的结构、对读者的称呼、句法和词汇，不要“半路换语体”。
    items:
      - prompt: "公文：公园入口处张贴的《游客须知》（[Правила для посетителей парка]{.ru}），用编号条款写，至少五条：开放时间、免费入园、工作坊的使用、禁止事项、违反规则的后果。"
        length: 70–110
        model: "Правила для посетителей парка\n\n1. Парк открыт каждый день с 7.00 до 23.00.\n2. Вход на территорию парка свободный.\n3. Занятия в мастерских (фотография, ремонт велосипедов, работа по дереву) проводятся бесплатно.\n4. На территории парка запрещаются курение, употребление алкоголя и движение автомобилей.\n5. Движение на велосипедах и самокатах допускается только по велосипедным дорожкам.\n6. Посетители обязаны соблюдать порядок и не ломать деревья и кусты.\n7. Ущерб, причинённый имуществу парка, возмещается посетителем.\n8. В случае нарушения настоящих правил посетитель обязан покинуть территорию парка."
        rubric: ["有标题，条款编号", "用被动结构（[запрещаются, допускается, возмещается]{.ru}、[запрещено]{.ru}）", "用名词化（[при входе, в случае нарушения, курение, употребление]{.ru}）", "不称呼读者，不用命令式，不用 [пожалуйста]{.ru} 和感叹号", "信息与选文一致", "70–110 词"]
        notes: "范文 72 词。公文不说“谁做”，只说“什么被允许、什么被禁止”：第 4 条的禁止事项全部名词化，用一个 [запрещаются]{.ru} 统领；第 7 条用第 30 课的 [Ущерб, причинённый…, возмещается…]{.ru}，施事用第五格 [посетителем]{.ru}。[настоящих правил]{.ru} 指“本规则”，是公文的固定说法。"
      - prompt: "网络帖子：住在附近的一位年轻人在社交网络上告诉朋友们这个消息，说说自己的感受。用口语。"
        length: 50–90
        model: "Народ, новость огонь!!! Помните пустой завод у нас за домом? Короче, 1 июня там открывают парк! Прочитал сегодня в новостях — норм, даже круто: дорожки для велосипедов, кафе, библиотека, а в старом складе мастерские, причём бесплатно. Можно чинить велосипед или учиться фотографировать. Вход тоже бесплатный, работает до 11 вечера. Раньше туда вечером вообще никто не ходил, а теперь будет где гулять)) Кто со мной на открытие? Там концерт будет!"
        rubric: ["对朋友说话：[народ]{.ru}、问句、[ты]{.ru} 或复数命令式", "口语词（[огонь, короче, норм, круто]{.ru} 等）", "短句、省略、情感标点（[!!!]{.ru}、[))]{.ru}）", "有个人感受和评价", "信息与选文一致", "50–90 词"]
        notes: "范文 66 词。帖子按说话的顺序写，不按倒金字塔：先喊一声引起注意，再问“记得吗”，然后才说新闻。[огонь]{.ru}、[круто]{.ru} 是网络评价词，[норм]{.ru} 是 [нормально]{.ru} 的截短词，[Короче]{.ru} 是口语的插入语。数字也口语化：[до 11 вечера]{.ru}，不写 [до 23.00]{.ru}。这些词放进第一项的规则里就是错误。"
      - prompt: "演讲：开园那天市长的致辞（[Дорогие друзья!]{.ru} 开头），对市民说话，至少用一次排比、一次设问和一次呼告，也要回应批评意见。"
        length: 120–170
        model: "Дорогие друзья! Дорогие жители Новоречинска!\n\nЕщё недавно здесь были пустые здания, разбитые окна и тёмные дворы, которые мы обходили стороной. Что мы видим сегодня? Деревья, дорожки, детей на велосипедах.\n\nЭтот парк построили вы. Вы сами выбрали проект на сайте мэрии. Вы писали нам письма и не давали забыть об этом месте. Вы просили нас навести здесь порядок — и вот он, этот порядок.\n\nЯ знаю, что не все довольны. Кто-то из вас говорит: зачем парк, если в городе плохие дороги? Это честный вопрос. И я отвечу честно: ремонт дорог мы продолжим, но город — это не только дороги. Город — это место, где хочется жить.\n\nНа этом заводе работали ваши деды и отцы. Мы сохранили его стены, чтобы память о них осталась с нами.\n\nДорогие друзья! Парк открыт. Он ваш. Берегите его!"
        rubric: ["开头和结尾用呼告", "至少一处排比或首语重复（如三次 [Вы…]{.ru}）", "至少一处设问，并自问自答", "回应批评意见，先让步再转折", "第二人称 [вы]{.ru} 对听众说话，有命令式", "句子比报道短，便于听", "120–170 词"]
        notes: "范文 129 词。结构：呼告—过去与现在的对比（设问 [Что мы видим сегодня?]{.ru}）—感谢市民（三次 [Вы…]{.ru} 排比）—回应批评（替反对者提问，再 [И я отвечу честно]{.ru}）—工厂的记忆—呼告和三个短句收尾。[Город — это не только дороги. Город — это место, где хочется жить.]{.ru} 是第 29 课那样的格言式对句。演讲里可以说 [я]{.ru}、[мы]{.ru}，可以有感情，这是它和新闻、规则最大的不同。"
