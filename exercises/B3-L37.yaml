lesson: B3-L37
grammar: "关联词：主句指示词 [тот]{.ru}、[то]{.ru}、[все]{.ru}、[всё]{.ru}、[там]{.ru}、[туда]{.ru} 与从句关联词 [кто]{.ru}、[что]{.ru}、[где]{.ru}、[куда]{.ru} 配对；指示词的格由主句决定，关联词的格由从句决定；[кто]{.ru} 作主语时动词用阳性单数。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Когда началась и когда закончилась блокада Ленинграда? Сколько хлеба получали ленинградцы в ноябре и декабре 1941 года? Что такое Дорога жизни и почему работа на ней была опасной? Что такое Дорога победы? Как жил город в годы блокады? Что записывала Таня Савичева?]{.ru}"
        length: 100–130
        model: "Блокада началась 8 сентября 1941 года, когда немецкие войска заняли Шлиссельбург, а полностью её сняли 27 января 1944 года. В ноябре и декабре 1941 года рабочие получали 250 граммов хлеба в день, а все остальные — только 125 граммов. Дорогой жизни называли дорогу по льду Ладожского озера: по ней в город везли продукты, а обратно вывозили тех, кто больше всего нуждался в помощи. Работа на ней была опасной: машины шли под обстрелом и могли провалиться под лёд вместе с грузом. Дорогой победы назвали железную дорогу, которую после прорыва блокады построили за семнадцать дней вдоль берега Ладожского озера. Те, кто мог работать, работали на заводах; работали больницы, библиотеки и многие школы. Таня Савичева записывала в маленькую книжку даты смерти своих родных."
        rubric: ["六个问题都回答，日期和数字准确", "至少两处关联词结构（[те, кто]{.ru}、[тех, кто]{.ru}、[то, что]{.ru}），格正确", "用完整的句子"]
        notes: 第 1 题注意 [сняли блокаду]{.ru}（解除）和 [прорвали блокаду]{.ru}（突破，1943 年 1 月）的区别。第 3、4 题正好练习本课的关联词：[вывозили тех, кто…]{.ru}（[тех]{.ru} 第四格，[кто]{.ru} 第一格），[Те, кто мог работать, работали…]{.ru}（[кто мог]{.ru} 单数，[работали]{.ru} 复数）。

  - id: e2
    type: fill
    task: 填入指示词 [тот]{.ru} 的适当形式。
    why: "[тот]{.ru} 的格只看主句。第 1 题 [вывозили]{.ru} 要求第四格，复数动物名词第四格同第二格 → [тех]{.ru}。第 2 题 [помогали]{.ru} 要求第三格 → [тем]{.ru}。第 3 题主句主语 → [те]{.ru}。第 4 题 [вспоминают о]{.ru} 要求第六格 → [тех]{.ru}。第 5 题 [встретились с]{.ru} 要求第五格 → [теми]{.ru}。从句里 [кто]{.ru}、[кого]{.ru}、[у кого]{.ru} 的形式与 [тот]{.ru} 无关，不要照抄。"
    items:
      - stem: "По Дороге жизни вывозили ___, кто больше всего нуждался в помощи."
        accept: ["тех"]
      - stem: "Соседи помогали ___, у кого не было сил идти за водой."
        accept: ["тем"]
      - stem: "___, кто мог стоять у станка, работали на заводах."
        accept: ["Те"]
      - stem: "В этот день вспоминают о ___, кто погиб в блокаду."
        accept: ["тех"]
      - stem: "Школьники встретились с ___, кто пережил блокаду."
        accept: ["теми"]

  - id: e3
    type: fill
    task: 填入关联词 [кто]{.ru} 或 [что]{.ru} 的适当形式（可带前置词）。
    why: "关联词的格只看从句。第 1 题 [найти]{.ru} 要求第四格 → [что]{.ru}。第 2 题从句 [успели вывезти]{.ru} 缺宾语，第四格 → [кого]{.ru}。第 3 题 [было]{.ru} 前要表示领有，[у кого не было сил]{.ru} → [у кого]{.ru}。第 4 题 [нуждались в]{.ru} 要求第六格，指事物 → [в чём]{.ru}。第 5 题 [погиб]{.ru} 的主语，第一格 → [кто]{.ru}，动词用单数。"
    items:
      - stem: "В хлеб добавляли всё, ___ можно было найти."
        accept: ["что"]
      - stem: "Спасли тех, ___ успели вывезти из города."
        accept: ["кого"]
      - stem: "Соседи помогали тем, ___ не было сил."
        accept: ["у кого"]
      - stem: "По Дороге жизни везли то, ___ город нуждался больше всего."
        accept: ["в чём"]
      - stem: "Мы помним всех, ___ погиб в блокаду."
        accept: ["кто"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [кто]{.ru} 作从句主语，动词用阳性单数 [мог]{.ru}；主句谓语跟 [те]{.ru} 一致，用复数。第 2 题主句动词 [сажали]{.ru} 表示位置（种在哪里），用 [там]{.ru}；从句 [были где]{.ru}。第 3 题主句 [ходили]{.ru} 表示方向，用 [туда]{.ru}；从句 [были сделаны]{.ru} 表示位置，用 [где]{.ru}。第 4 题指泛指的“……的人”，用 [тот, кто]{.ru}；[который]{.ru} 前面要有被说明的名词。"
    items:
      - stem: "Те, кто ___ стоять у станка, работали на заводах."
        options: ["мог", "могли", "могла"]
        answer: "мог"
      - stem: "___, где раньше были парки, весной сажали овощи."
        options: ["Там", "Туда", "Тот"]
        answer: "Там"
      - stem: "За водой ходили ___, где во льду были сделаны проруби."
        options: ["там", "туда", "оттуда"]
        answer: "туда"
      - stem: "___ читает записи Тани Савичевой, не может их забыть."
        options: ["Тот, кто", "Тот, который", "Кто, тот"]
        answer: "Тот, кто"

  - id: e5
    type: translate
    task: 翻译下列句子，用关联词结构。
    items:
      - zh: 能干活的人都在工厂里工作。
        accept: ["Те, кто мог работать, работали на заводах.", "Все, кто мог работать, работали на заводах.", "Те, кто мог работать, работали на заводе.", "Все, кто мог работать, работали на заводе."]
        rubric: ["[те / все, кто]{.ru} 结构", "[кто мог]{.ru} 用单数，主句谓语 [работали]{.ru} 用复数"]
      - zh: 人们往面包里掺进一切能找到的东西。
        accept: ["В хлеб добавляли всё, что можно было найти.", "В хлеб добавляли то, что можно было найти.", "Люди добавляли в хлеб всё, что можно было найти.", "Люди добавляли в хлеб всё, что могли найти."]
        rubric: ["[всё / то, что]{.ru} 结构", "[добавлять что во что]{.ru}：[в хлеб]{.ru} 第四格"]
      - zh: 这一天人们纪念所有在围困中死去的人。
        accept: ["В этот день вспоминают всех, кто погиб в блокаду.", "В этот день вспоминают всех, кто погиб во время блокады.", "В этот день люди вспоминают всех, кто погиб в блокаду.", "В этот день помнят всех, кто погиб в блокаду."]
        rubric: ["[всех]{.ru} 第四格（[вспоминать кого]{.ru}），[кто]{.ru} 第一格", "[кто погиб]{.ru} 单数", "[в блокаду]{.ru} / [во время блокады]{.ru}"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述列宁格勒围困的经过。
    items:
      - prompt: "按时间顺序写一段话：1941 年 6—9 月；第一个冬天的生活；生命之路；1942 年 8 月的音乐会；1943 年 1 月和 1944 年 1 月；今天的纪念。至少用三处关联词结构（[тот, кто]{.ru}、[то, что]{.ru}、[там, где]{.ru} 等）。死亡人数用“据不同估计”的说法。"
        length: 150–200
        model: "22 июня 1941 года Германия напала на Советский Союз, а 8 сентября немецкие войска заняли Шлиссельбург, и Ленинград оказался в блокаде. Первая блокадная зима была очень холодной. Запасов продуктов было мало, и в ноябре рабочие получали 250 граммов хлеба в день, а все остальные — 125 граммов. В хлеб добавляли то, что можно было найти. Не было ни отопления, ни воды, и люди сжигали всё, что могло гореть. Зимой по льду Ладожского озера проложили Дорогу жизни. По ней в город везли продукты, а обратно вывозили тех, кто больше всего нуждался в помощи. Город продолжал работать: те, кто мог стоять у станка, работали на заводах, а там, где раньше были парки, сажали овощи. 9 августа 1942 года в Ленинграде прозвучала Седьмая симфония Шостаковича. В январе 1943 года блокаду удалось прорвать, а 27 января 1944 года её сняли полностью. По разным оценкам, за эти годы погибли от шестисот тысяч до полутора миллионов человек. Сегодня 27 января в Петербурге вспоминают всех, кто погиб в блокаду."
        rubric: ["六部分都写到，顺序正确，日期准确", "至少三处关联词结构，指示词和关联词的格各自正确", "[кто]{.ru} 后的动词用单数", "死亡人数注明“据不同估计”，不加评价性的形容词", "150–200 词"]
        notes: "范文约 190 词。以日期为线索推进：1941 年 6 月 22 日、9 月 8 日、第一个冬天、1942 年 8 月 9 日、1943 年 1 月、1944 年 1 月 27 日、今天。关联词结构共五处：[то, что можно было найти]{.ru}、[всё, что могло гореть]{.ru}、[тех, кто нуждался]{.ru}、[те, кто мог]{.ru}、[там, где были парки]{.ru}，最后一句 [всех, кто погиб]{.ru} 呼应开头。这类题材容易写得情绪化，叙述时用事实和数字说话，数字有争议的注明 [по разным оценкам]{.ru}。"
