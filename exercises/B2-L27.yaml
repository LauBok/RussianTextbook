  - id: e9
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ Ди́ма простуди́лся и кто его́ навести́л? Как Петро́вы и Ди́ма шути́ли пе́рвого апре́ля? Куда́ ходи́ли друзья́ двена́дцатого апре́ля? Како́е вре́мя го́да бо́льше всего́ лю́бят Петро́вы? Что А́нна нашла́ в ста́ром шкафу́? Что Ди́ма сказа́л Ван Лэ́ю в воскресе́нье?]{.ru}"
        length: 60–100
        model: "В конце́ ма́рта Ди́ма купи́л себе́ лёгкую ку́ртку, гуля́л в ней весь день и простуди́лся. Ван Лэй и А́нна пое́хали к нему́ и взя́ли с собо́й мёд и лимо́ны. Пе́рвого апре́ля А́нна и Ми́ша положи́ли в са́харницу соль, а Ди́ма сказа́л Ван Лэ́ю, что за́втра контро́льная. Двена́дцатого апре́ля друзья́ ходи́ли в Музе́й космона́втики. А́нна бо́льше всего́ лю́бит зи́му, Ми́ша — ле́то, Мари́я Никола́евна — о́сень, а Ива́н Серге́евич ду́мает, что весна́ — интере́снейшее вре́мя. Во вре́мя убо́рки А́нна нашла́ в шкафу́ деревя́нное яйцо́: оно́ ста́рше её. А в воскресе́нье Ди́ма сказа́л Ван Лэ́ю, что он говори́т сли́шком ти́хо и ве́жливо."
        rubric: ["回答全部六个问题，按时间顺序", "至少用对一次 [себя́]{.ru} 的变格和一次前置词后的 [н-]{.ru}", "至少一个比较级或最高级、一个短尾形容词、一个副词", "过去时为主"]
        notes: "范文约 100 词，每个问题一两句，按月份和日期串起来。[купи́л себе́]{.ru}、[взя́ли с собо́й]{.ru} 是 [себя́]{.ru} 的两种格；[к нему́]{.ru} 用了前置词后的 [н-]{.ru}；[ста́рше её]{.ru} 在比较级后，不加 [н-]{.ru}。各人最喜欢的季节用 [бо́льше всего́]{.ru} 一次说完，后面用破折号代替重复的动词 [лю́бит]{.ru}。"

  - id: e10
    type: open
    task: 作文：《我的春天》。写一写今年春天你的生活：天气和以前比有什么变化，你自己做了什么，和谁一起做的，最有意思的是哪一天，你对这个季节满意不满意。
    items:
      - prompt: 写 100–150 词。至少用两个比较级、一个最高级、两个短尾形容词、两个副词，用一次 [себя́]{.ru}，用一次 [весь]{.ru} 或 [сам]{.ru}。
        length: 100–150
        model: "В ма́рте в Москве́ бы́ло ещё хо́лодно, но в апре́ле ста́ло гора́здо тепле́е. Дни ста́ли длинне́е, по у́лицам текли́ ручьи́. Я купи́л себе́ весе́ннюю ку́ртку, но ма́ма моего́ дру́га всегда́ говори́т, что в ма́рте так одева́ться вре́дно. В апре́ле у нас бы́ло мно́го заня́тий, и я занима́лся бо́льше, чем зимо́й. Но и отдыха́ли мы ча́сто. Са́мым интере́сным днём для меня́ бы́ло двена́дцатое апре́ля. Мы с друзья́ми ходи́ли по всему́ Музе́ю космона́втики до са́мого ве́чера, и я узна́л о ко́смосе мно́го но́вого. А в суббо́ту мы убира́ли кварти́ру: я сам мыл все о́кна. Когда́ о́кна бы́ли чи́сты, все бы́ли о́чень дово́льны. Весно́й в Москве́ гря́зно, но я рад, что ви́жу, как всё меня́ется ка́ждый день. Я дово́лен э́той весно́й."
        rubric: ["写到天气变化、自己做的事、和谁一起、最有意思的一天、满意与否", "至少两个比较级、一个最高级", "至少两个短尾形容词、两个副词", "一次 [себя́]{.ru}，一次 [весь]{.ru} 或 [сам]{.ru}", "100–150 词"]
        notes: "范文按“天气—学习和休息—最有意思的一天—家务—感受”展开，约 120 词。比较级有 [тепле́е, длинне́е, бо́льше]{.ru}，最高级用 [са́мым интере́сным днём]{.ru}（[быть]{.ru} 过去时后用第五格）。短尾 [чи́сты, дово́льны, рад, дово́лен]{.ru} 都作谓语；副词有 [хо́лодно, ча́сто, гря́зно]{.ru}。[себе́]{.ru}、[сам]{.ru}、[по всему́ музе́ю]{.ru}、[до са́мого ве́чера]{.ru} 复习了第 20、22 课。"
