lesson: B2-L27
heading: 单元测试
intro: 本测试覆盖第三单元全部语法。答对 80% 以上再进入第四单元；没有达到的，按出错的题回到相应的课（第 19–26 课）复习后重做。
grammar: "人称代词全表与前置词后的 [н-]{.ru}；[себя́]{.ru}；[кто, что, чей]{.ru} 的变格；[весь, сам, са́мый]{.ru}；形容词比较级与 [чем]{.ru}、第二格；最高级；短尾形容词；副词的构成与比较级。"
exercises:

  - id: e1
    type: choice
    task: 选择人称代词或 [себя́]{.ru} 的正确形式。
    why: "第三人称代词在前置词后面加 [н-]{.ru}：[к ней, о нём, без неё]{.ru}（第 2、4、7 题）；没有前置词时不加：[ви́дит её]{.ru}、[рад им]{.ru}（第 1、3 题），[рад]{.ru} 要求第三格，所以是 [им]{.ru}。第 5 题 [его́]{.ru} 修饰 [бра́та]{.ru}，是“他的”，物主代词前有前置词也不加 [н-]{.ru}。第 6 题 [с]{.ru} 在 [мной]{.ru} 前变成 [со]{.ru}。第 8–13 题：[себя́]{.ru} 指句子的主语本人，不分人称：第 10 题主语是 [я]{.ru}，“给自己”也说 [себе́]{.ru}，不说 [мне]{.ru}。格要按动词和前置词选：[чу́вствовать себя́]{.ru}（第四格）、[с собо́й]{.ru}（第五格）、[о себе́]{.ru}（第六格）。第 12 题迪马在镜子里看见的是自己，用 [себя́]{.ru}。第 13 题说“谢谢”的对象是安娜，不是主语本人，所以用人称代词 [ей]{.ru}；[спаси́бо]{.ru} 前面的人用第三格，没有前置词，不加 [н-]{.ru}。"
    items:
      - stem: Ка́ждое у́тро он ви́дит ___ в метро́.
        options: [её, неё, ней]
        answer: её
      - stem: Ве́чером он взял её су́мку и пошёл к ___.
        options: [ней, ей, неё]
        answer: ней
      - stem: Друзья́ пое́хали к Ди́ме. Ди́ма был о́чень рад ___.
        options: [им, ним, их]
        answer: им
      - stem: Я ви́дел э́того актёра в друго́м фи́льме. О ___ я зна́ю мно́го.
        options: [нём, него́, его́]
        answer: нём
      - stem: Вчера́ мы бы́ли у ___ бра́та.
        options: [его́, него́, ему́]
        answer: его́
      - stem: Пойдём ___ в кино́!
        options: [со мной, с мной, со мне]
        answer: со мной
      - stem: Покажу́ вам ещё оди́н фильм с ним, но уже́ без ___.
        options: [неё, её, ней]
        answer: неё
      - stem: Как ты ___ чу́вствуешь?
        options: [себя́, тебя́, себе́]
        answer: себя́
      - stem: Весно́й бери́ с ___ шарф!
        options: [собо́й, тобо́й, себя́]
        answer: собо́й
      - stem: Вчера́ я купи́л ___ но́вую ку́ртку.
        options: [себе́, мне, себя́]
        answer: себе́
      - stem: Ду́май о ___, а не о футбо́ле!
        options: [себе́, тебе́, себя́]
        answer: себе́
      - stem: Ди́ма посмотре́л в зе́ркало и не узна́л ___.
        options: [себя́, себе́, собо́й]
        answer: себя́
      - stem: А́нна дала́ Ди́ме свою́ тетра́дь. Ди́ма сказа́л ___ спаси́бо.
        options: [ей, себе́, ней]
        answer: ей

  - id: e2
    type: fill
    task: 写出 [кто]{.ru}、[что]{.ru} 或 [чей]{.ru} 的正确形式。
    why: "疑问词的格由动词或前置词决定，回答里的词也是这个格：[звони́ть кому́]{.ru}（[А́нне]{.ru}）、[с кем]{.ru}（[с А́нной]{.ru}）、[боя́ться чего́]{.ru}（[контро́льной]{.ru}，第二格）、[занима́ться чем]{.ru}（[ру́сским языко́м]{.ru}）、[спра́шивать кого́]{.ru}（[Ди́му]{.ru}）。[чей]{.ru} 和后面的名词一致：[чья иде́я]{.ru}、[чьи слова́]{.ru}，第 6 题 [в ко́мнате]{.ru} 是阴性第六格，用 [чьей]{.ru}。最常见的错误是一律写成 [кто]{.ru}、[что]{.ru}。"
    items:
      - stem: — ___ ты позвони́л? — А́нне.
        hint: кто
        accept: [Кому́]
      - stem: — С ___ ты э́то приду́мал? — С А́нной.
        hint: кто
        accept: [кем]
      - stem: — ___ ты бои́шься? — Контро́льной.
        hint: что
        accept: [Чего́]
      - stem: — ___ ты занима́ешься? — Ру́сским языко́м.
        hint: что
        accept: [Чем]
      - stem: — ___ ты спра́шивал? — Ди́му.
        hint: кто
        accept: [Кого́]
      - stem: — В ___ ко́мнате стои́т раке́та? — В ко́мнате Ми́ши.
        hint: чей
        accept: [чьей]
      - stem: — ___ э́то иде́я? — Моя́.
        hint: чей
        accept: [Чья]
      - stem: ___ э́то слова́? От кого́ ты э́то узна́л?
        hint: чей
        accept: [Чьи]

  - id: e3
    type: choice
    task: 选择 [весь]{.ru}、[сам]{.ru}、[са́мый]{.ru} 的正确形式。
    why: "[весь]{.ru} 和名词同性、数、格：[весь мир]{.ru}（阳性第一格）、[по всему́ музе́ю]{.ru}（[по]{.ru} + 第三格）、[всем друзья́м]{.ru}（复数第三格）。[сам]{.ru} 和所说明的人一致：[А́нна сама́]{.ru}；第 5 题“加加林本人”是第四格，用 [самого́]{.ru}。第 6 题 [под]{.ru} 要求第五格，[са́мым па́мятником]{.ru} 表示“正下方”。"
    items:
      - stem: О полёте Гага́рина сра́зу узна́л ___ мир.
        options: [весь, вся, всё]
        answer: весь
      - stem: Они́ ходи́ли по ___ музе́ю до ве́чера.
        options: [всему́, всем, всей]
        answer: всему́
      - stem: Ван Лэй рассказа́л ___ друзья́м о кита́йских космона́втах.
        options: [всем, всех, все́ми]
        answer: всем
      - stem: Сего́дня А́нна ___ пригото́вила у́жин.
        options: [сама́, сам, саму́]
        answer: сама́
      - stem: Мой де́душка ви́дел ___ Гага́рина.
        options: [самого́, сам, сами́м]
        answer: самого́
      - stem: Музе́й нахо́дится под ___ па́мятником.
        options: [са́мым, са́мом, са́мой]
        answer: са́мым

  - id: e4
    type: fill
    task: 写出形容词的比较级。
    why: "大多数形容词加 [-ее]{.ru}：[длинне́е, тепле́е]{.ru}。词干末是 [к]{.ru} 的交替成 [ч]{.ru} 再加 [-е]{.ru}：[коро́ткий → коро́че]{.ru}。[высо́кий, глубо́кий, ста́рый, большо́й]{.ru} 是特殊形式：[вы́ше, глу́бже, ста́рше, бо́льше]{.ru}，不能写成 [высоке́е]{.ru}、[глубоке́е]{.ru}。比较的对象用第二格（[Во́лги, всех озёр, А́нны]{.ru}）或 [чем]{.ru}；第 4 题比较的是 [на Ку́бе]{.ru} 和 [в Москве́]{.ru}，只能用 [чем]{.ru}。"
    items:
      - stem: Янцзы́ ___ Во́лги.
        hint: дли́нный
        accept: [длинне́е, длинне́й]
      - stem: Эльбру́с ___ Фу́дзи.
        hint: высо́кий
        accept: [вы́ше]
      - stem: Байка́л ___ всех озёр на све́те.
        hint: глубо́кий
        accept: [глу́бже]
      - stem: На Ку́бе гора́здо ___, чем в Москве́.
        hint: тёплый
        accept: [тепле́е, тепле́й]
      - stem: Се́на намно́го ___ Янцзы́.
        hint: коро́ткий
        accept: [коро́че]
      - stem: Э́то деревя́нное яйцо́ ___ А́нны.
        hint: ста́рый
        accept: [ста́рше]
      - stem: Москва́ ___ Петербу́рга.
        hint: большо́й
        accept: [бо́льше]

  - id: e5
    type: choice
    task: 选择正确的形式。
    why: "[са́мый]{.ru} 和后面的形容词、名词同性、数、格：[са́мый тру́дный ме́сяц]{.ru}、[са́мое глубо́кое о́зеро]{.ru}、[в са́мом большо́м до́ме]{.ru}（第六格）。“最好的”是 [лу́чший]{.ru}，[лу́чше]{.ru} 是比较级，不能修饰名词；[лу́чшее]{.ru} 是中性，和阳性的 [ме́сяц]{.ru} 不一致。第 5 题和所有的湖比，用 [всех]{.ru}；第 6 题“比什么都宝贵”，用 [всего́]{.ru}。第 7 题名词前要用形容词形式 [интере́снейшее]{.ru}（极有意思的），比较级 [интере́снее]{.ru} 不能这样用。"
    items:
      - stem: Апре́ль — ___ тру́дный ме́сяц для води́телей.
        options: [са́мый, са́мая, са́мое]
        answer: са́мый
      - stem: Байка́л — ___ глубо́кое о́зеро в ми́ре.
        options: [са́мое, са́мый, са́мая]
        answer: са́мое
      - stem: Мы живём в ___ большо́м до́ме на у́лице.
        options: [са́мом, са́мый, са́мого]
        answer: са́мом
      - stem: Для Ван Лэ́я май — ___ ме́сяц.
        options: [лу́чший, лу́чше, лу́чшее]
        answer: лу́чший
      - stem: Байка́л глу́бже ___ озёр.
        options: [всех, всего́, все]
        answer: всех
      - stem: Здоро́вье доро́же ___.
        options: [всего́, всех, весь]
        answer: всего́
      - stem: Весна́ — ___ вре́мя.
        options: [интере́снейшее, интере́снее, интере́сней]
        answer: интере́снейшее

  - id: e6
    type: fill
    task: 写出短尾形容词的正确形式。
    why: "短尾和主语在性、数上一致：[мы гото́вы]{.ru}，[всё бы́ло гото́во]{.ru}（[всё]{.ru} 是中性），[окно́ гря́зно]{.ru}。第 3 题说话人是玛丽亚·尼古拉耶夫娜，用阴性 [дово́льна]{.ru}；第 7 题主语 [А́нна]{.ru} 也用阴性 [согла́сна]{.ru}。[дово́льный → дово́лен]{.ru}、[гря́зный → гря́зен]{.ru} 阳性插入 [е]{.ru}，其他形式没有。第 4 题 [похо́ж на]{.ru} + 第四格。第 5 题用 [вы]{.ru} 称呼一个人，短尾用复数 [пра́вы]{.ru}。第 6 题前半句用了短尾 [чи́сто]{.ru}，后半句也用短尾 [гря́зно]{.ru}，说的是现在的状态；写长尾 [гря́зное]{.ru} 也不算错。"
    items:
      - stem: Ма́ма, мы почти́ ___!
        hint: гото́вый
        accept: [гото́вы]
      - stem: К обе́ду всё бы́ло ___.
        hint: гото́вый
        accept: [гото́во]
      - stem: "Мари́я Никола́евна сказа́ла: «Я бу́ду ___, когда́ все о́кна бу́дут чи́сты»."
        hint: дово́льный
        accept: [дово́льна]
      - stem: Ми́ша ___ на па́пу.
        hint: похо́жий
        accept: [похо́ж]
      - stem: Мари́я Никола́евна, вы ___.
        hint: прав
        accept: [пра́вы]
      - stem: Моё окно́ уже́ чи́сто, а твоё ещё ___.
        hint: гря́зный
        accept: [гря́зно, гря́зное]
      - stem: А́нна ___ со мной.
        hint: согла́сен
        accept: [согла́сна]

  - id: e7
    type: fill
    task: 写出副词或副词比较级。
    why: "副词由形容词去掉词尾加 [-о]{.ru}：[гро́мко, че́стно]{.ru}。副词比较级和形容词比较级同形：[ме́дленнее]{.ru}，[по́здно → по́зже]{.ru}，[гро́мко → гро́мче]{.ru}（[к → ч]{.ru}），[хорошо́ → лу́чше]{.ru}，[ча́сто → ча́ще]{.ru}（[ст → щ]{.ru}）。请求时可以加 [по-]{.ru}：[поме́дленнее]{.ru}。比较级 + [всех / всего́]{.ru} 表示“最……”。"
    items:
      - stem: Ди́ма ___ повторя́л кита́йские слова́.
        hint: гро́мкий
        accept: [гро́мко]
      - stem: Говори́те, пожа́луйста, ___!
        hint: ме́дленно，比较级
        accept: [ме́дленнее, поме́дленнее, ме́дленней, поме́дленней]
      - stem: Я сего́дня встал ___, чем обы́чно.
        hint: по́здно，比较级
        accept: [по́зже]
      - stem: Ди́ма говори́т ___ всех.
        hint: гро́мко，比较级
        accept: [гро́мче]
      - stem: Говори́ мне всё ___.
        hint: че́стный
        accept: [че́стно]
      - stem: Пьер говори́т по-ру́сски ___, чем я.
        hint: хорошо́，比较级
        accept: [лу́чше]
      - stem: ___ всего́ мы занима́емся в кафе́.
        hint: ча́сто，比较级
        accept: [Ча́ще]

  - id: e8
    type: translate
    task: 译成俄语。
    why: "第 1 题比较级后的代词用第二格 [его́]{.ru}，规范的说法不加 [н-]{.ru}（[ста́рше него́]{.ru} 只在口语里听得到）；也可以用 [чем он]{.ru}，或者直接说出名字 [ста́рше Ми́ши]{.ru}。第 2 题最高级 [са́мое глубо́кое]{.ru} 和 [о́зеро]{.ru} 一致，用中性。第 3 题对“您”说，命令式加 [-те]{.ru}，“自己”用 [себя́]{.ru}。第 4 题“跟谁”是 [с кем]{.ru}，不是 [с кто]{.ru}。第 5 题短尾作谓语，和主语一致：[о́кна чи́сты]{.ru}，[ма́ма дово́льна]{.ru}。第 6 题副词比较级 [гро́мче]{.ru}，请求时也可以说 [погро́мче]{.ru}。"
    items:
      - zh: 安娜比他（米沙）大。
        accept: ["А́нна ста́рше его́.", "А́нна ста́рше, чем он.", "А́нна ста́рше Ми́ши.", "А́нна ста́рше, чем Ми́ша."]
        rubric: ["[ста́рше]{.ru}：[ста́рый]{.ru} 指年龄的比较级", "比较对象用第二格 [его́]{.ru}（不加 [н-]{.ru}）或 [чем он]{.ru}"]
      - zh: 贝加尔湖是世界上最深的湖。
        accept: ["Байка́л — са́мое глубо́кое о́зеро в ми́ре.", "Байка́л — са́мое глубо́кое о́зеро на све́те.", "Байка́л — глубоча́йшее о́зеро в ми́ре.", "Байка́л — глубоча́йшее о́зеро на све́те.", "Са́мое глубо́кое о́зеро в ми́ре — Байка́л.", "Са́мое глубо́кое о́зеро на све́те — Байка́л."]
        rubric: ["[са́мое глубо́кое о́зеро]{.ru}：[са́мый]{.ru} 用中性", "“世界上”说 [в ми́ре]{.ru} 或 [на све́те]{.ru}"]
      - zh: 请您保重身体！
        accept: ["Береги́те себя́!", "Береги́те себя́, пожа́луйста!", "Пожа́луйста, береги́те себя́!"]
        rubric: ["命令式 [береги́те]{.ru}（对“您”）", "[себя́]{.ru} 第四格"]
      - zh: 你跟谁一起去博物馆？
        accept: ["С кем ты идёшь в музе́й?", "Ты с кем идёшь в музе́й?", "С кем ты пойдёшь в музе́й?", "Ты с кем пойдёшь в музе́й?", "С кем ты е́дешь в музе́й?", "Ты с кем е́дешь в музе́й?", "С кем ты пое́дешь в музе́й?", "Ты с кем пое́дешь в музе́й?", "С кем вы идёте в музе́й?", "Вы с кем идёте в музе́й?", "С кем вы пойдёте в музе́й?", "Вы с кем пойдёте в музе́й?", "С кем вы е́дете в музе́й?", "Вы с кем е́дете в музе́й?", "С кем вы пое́дете в музе́й?", "Вы с кем пое́дете в музе́й?", "С кем ты ходи́л в музе́й?", "Ты с кем ходи́л в музе́й?", "С кем ты ходи́ла в музе́й?", "Ты с кем ходи́ла в музе́й?", "С кем ты е́здил в музе́й?", "Ты с кем е́здил в музе́й?", "С кем ты е́здила в музе́й?", "Ты с кем е́здила в музе́й?", "С кем вы ходи́ли в музе́й?", "Вы с кем ходи́ли в музе́й?", "С кем вы е́здили в музе́й?", "Вы с кем е́здили в музе́й?"]
        rubric: ["[с кем]{.ru}：[кто]{.ru} 的第五格", "[в музе́й]{.ru} 表示方向，用第四格"]
      - zh: 窗户已经干净了，妈妈很满意。
        accept: ["О́кна уже́ чи́сты, и ма́ма дово́льна.", "О́кна уже́ чи́сты, ма́ма дово́льна.", "О́кна уже́ чи́сты, и ма́ма о́чень дово́льна.", "О́кна уже́ чи́сты, ма́ма о́чень дово́льна.", "Окно́ уже́ чи́сто, и ма́ма дово́льна.", "Окно́ уже́ чи́сто, ма́ма дово́льна.", "Окно́ уже́ чи́сто, и ма́ма о́чень дово́льна.", "Окно́ уже́ чи́сто, ма́ма о́чень дово́льна.", "О́кна уже́ чи́стые, и ма́ма дово́льна.", "О́кна уже́ чи́стые, ма́ма дово́льна.", "О́кна уже́ чи́стые, и ма́ма о́чень дово́льна."]
        rubric: ["“干净了”用短尾 [чи́сты]{.ru}（[чи́сто]{.ru}）或长尾 [чи́стые]{.ru}，和主语一致", "[ма́ма дово́льна]{.ru}：阴性短尾"]
      - zh: 请说大声一点！（对“你”说）
