lesson: L18
grammar: "形容词第六格单数：阳性、中性 [-ом]{.ru} / [-ем]{.ru}，阴性 [-ой]{.ru} / [-ей]{.ru}；疑问词 [в како́м]{.ru}、[в како́й]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里形容词的第六格。
    why: 先看名词的性：[дом]{.ru}、[райо́н]{.ru}、[заво́д]{.ru}、[зда́ние]{.ru} 用 [-ом]{.ru} / [-ем]{.ru}，[кварти́ра]{.ru}、[аудито́рия]{.ru}、[шко́ла]{.ru} 用 [-ой]{.ru} / [-ей]{.ru}。第 4 题 [хоро́ший]{.ru} 词干以 [ш]{.ru} 结尾、词尾不重读，写 [-ей]{.ru}；第 6 题 [си́ний]{.ru} 是软变化，用 [-ем]{.ru}；第 7 题 [зда́ние]{.ru} 是中性，形容词和阳性一样。
    items:
      - stem: Мы живём в ___ до́ме.
        hint: но́вый
        accept: ["но́вом"]
      - stem: Па́па рабо́тает на ___ заво́де.
        hint: большо́й
        accept: ["большо́м"]
      - stem: Уро́к в ___ аудито́рии.
        hint: све́тлый
        accept: ["све́тлой"]
      - stem: Ми́ша в ___ шко́ле.
        hint: хоро́ший
        accept: ["хоро́шей"]
      - stem: Они́ живу́т в ___ райо́не.
        hint: ти́хий
        accept: ["ти́хом"]
      - stem: Ко́шка в ___ ко́мнате.
        hint: си́ний
        accept: ["си́ней"]
      - stem: Библиоте́ка в ___ зда́нии.
        hint: ста́рый
        accept: ["ста́ром"]
      - stem: Я живу́ в ___ кварти́ре.
        hint: ма́ленький
        accept: ["ма́ленькой"]

  - id: e2
    type: rewrite
    task: 用括号里的词回答问题。
    placeholder: В … / На …
    example:
      cue: В како́м до́ме живёт Ван Лэй? (большо́й но́вый дом)
      answer: Он живёт в большо́м но́вом до́ме.
    why: 形容词和名词都变成第六格，各用各的词尾：[в райо́нной поликли́нике]{.ru}，形容词 [-ой]{.ru}，名词 [-е]{.ru}；[в све́тлой аудито́рии]{.ru}，名词 [-ии]{.ru}。前置词 [в]{.ru} / [на]{.ru} 的选择不变：[на]{.ru} [факульте́те]{.ru}、[заво́де]{.ru}。
    items:
      - cue: Где рабо́тает Мари́я Никола́евна? (райо́нная поликли́ника)
        accept: ["Она́ рабо́тает в райо́нной поликли́нике.", "В райо́нной поликли́нике.", "Мари́я Никола́евна рабо́тает в райо́нной поликли́нике."]
      - cue: На како́м факульте́те А́нна? (филологи́ческий факульте́т)
        accept: ["Она́ на филологи́ческом факульте́те.", "На филологи́ческом факульте́те.", "А́нна на филологи́ческом факульте́те."]
      - cue: Где рабо́тает Ива́н Серге́евич? (большо́й заво́д)
        accept: ["Он рабо́тает на большо́м заво́де.", "На большо́м заво́де.", "Ива́н Серге́евич рабо́тает на большо́м заво́де."]
      - cue: В како́м райо́не живу́т Петро́вы? (ти́хий райо́н)
        accept: ["Они́ живу́т в ти́хом райо́не.", "В ти́хом райо́не.", "Петро́вы живу́т в ти́хом райо́не."]
      - cue: В како́й аудито́рии уро́ки? (больша́я све́тлая аудито́рия)
        accept: ["Уро́ки в большо́й све́тлой аудито́рии.", "В большо́й све́тлой аудито́рии.", "Они́ в большо́й све́тлой аудито́рии."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: 第 1 题 [большо́й]{.ru} 在这里是阴性第六格，和阳性第一格同形，要看后面的名词 [аудито́рии]{.ru}。第 2 题 [зда́ние]{.ru} 是中性，用 [-ом]{.ru}。第 3 题 [райо́н]{.ru} 是阳性，[хоро́ший]{.ru} 的词尾不重读，按拼写规则写 [-ем]{.ru}，不写 [-ом]{.ru}。第 4 题 [кварти́ра]{.ru} 是阴性，用 [-ой]{.ru}。
    items:
      - stem: Мы в ___ аудито́рии.
        options: [большо́м, большо́й]
        answer: большо́й
      - stem: Музе́й в ___ зда́нии.
        options: [ста́ром, ста́рой]
        answer: ста́ром
      - stem: Они́ живу́т в ___ райо́не.
        options: [хоро́шем, хоро́шей]
        answer: хоро́шем
      - stem: Ван Лэй живёт в ___ кварти́ре.
        options: [ую́тном, ую́тной]
        answer: ую́тной

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：彼得罗夫家住在安静街区的一栋新大楼里，王磊的房间小但明亮；安娜在语文系；王磊和安娜昨天去了大剧院。
    items:
      - stem: Петро́вы живу́т в ___ райо́не.
        options: [ти́хом, большо́м, ста́ром]
        answer: ти́хом
      - stem: Его́ ко́мната ___.
        options: ["больша́я и ста́рая", "ма́ленькая, но све́тлая"]
        answer: "ма́ленькая, но све́тлая"
      - stem: А́нна на ___ факульте́те.
        options: [филологи́ческом, большо́м]
        answer: филологи́ческом
      - stem: Вчера́ Ван Лэй и А́нна бы́ли ___.
        options: [в Большо́м теа́тре, в райо́нной поликли́нике, на большо́м заво́де]
        answer: в Большо́м теа́тре

  - id: e5
    type: translate
    task: 译成俄语。
    why: 形容词和名词都用第六格，形容词词尾跟名词的性走。
    items:
      - zh: 我们住在一栋新的大楼里。
        accept: ["Мы живём в большо́м но́вом до́ме.", "Мы живём в но́вом большо́м до́ме."]
        rubric: ["[в большо́м но́вом до́ме]{.ru}：阳性第六格 [-ом]{.ru}", "[живём]{.ru}"]
      - zh: 妈妈在区门诊部工作。
        accept: ["Ма́ма рабо́тает в райо́нной поликли́нике.", "Моя́ ма́ма рабо́тает в райо́нной поликли́нике."]
        rubric: ["[в райо́нной поликли́нике]{.ru}：阴性第六格 [-ой]{.ru}"]
      - zh: 安娜在语文系。
        accept: ["А́нна на филологи́ческом факульте́те."]
        rubric: ["[на]{.ru} + [филологи́ческом факульте́те]{.ru}"]
      - zh: 你住在哪个区？——我住在一个安静的区。
        accept: ["— В како́м райо́не ты живёшь? — Я живу́ в ти́хом райо́не.", "— В како́м райо́не ты живёшь? — В ти́хом райо́не.", "— Ты в како́м райо́не живёшь? — Я живу́ в ти́хом райо́не."]
        rubric: ["[в како́м райо́не]{.ru}", "[ти́хом]{.ru}：[х]{.ru} 后按硬变化写 [-ом]{.ru}"]
      - zh: 昨天我们在大剧院。
        accept: ["Вчера́ мы бы́ли в Большо́м теа́тре.", "Мы вчера́ бы́ли в Большо́м теа́тре.", "Мы бы́ли в Большо́м теа́тре вчера́."]
        rubric: ["[бы́ли]{.ru}", "[в Большо́м теа́тре]{.ru}"]

  - id: e6
    type: open
    task: 仿照课文写一封短信。
    items:
      - prompt: 给你的朋友写一封短信，介绍你住的楼、房间和街区，你的同学在哪个系，你们在什么样的教室上课，昨天你在哪儿、做了什么。
        length: 60–100
        model: "Дорого́й Пьер!\n\nЯ живу́ в Пеки́не, в ста́ром ти́хом райо́не. Мы живём в ма́леньком до́ме. Моя́ ко́мната ма́ленькая, но ую́тная. Мой друг то́же студе́нт. Он на филологи́ческом факульте́те. На́ши уро́ки в большо́й све́тлой аудито́рии. Вчера́ я был в теа́тре. Мы смотре́ли бале́т.\n\nТвой Ван Лэй"
        rubric: ["开头有称呼 [Дорого́й …!]{.ru} / [Дорога́я …!]{.ru}，结尾有署名", "至少用三个“形容词 + 名词”的第六格词组", "地点前置词 [в]{.ru} / [на]{.ru} 选对", "至少一个过去时句子"]
        notes: 范文按“住处—房间—同学—上课—昨天”的顺序写，和课文的结构一样。每段都尽量用“形容词 + 名词”的第六格：[в ста́ром ти́хом райо́не]{.ru}、[в ма́леньком до́ме]{.ru}、[на филологи́ческом факульте́те]{.ru}、[в большо́й све́тлой аудито́рии]{.ru}。称呼要和收信人一致：给男性写 [Дорого́й]{.ru}，给女性写 [Дорога́я]{.ru}。
