lesson: B4-L21
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Что, по словам автора, связывало его с Ником? Как мальчики попали в тот день на Воробьёвы горы? Что они сделали на месте закладки храма? Как автор оценивает эту сцену через двадцать шесть лет? Что он думает о дружбе и первой любви? К кому он обращается в конце и с каким чувством?]{.ru}"
        length: 100–140
        model: "Автора и Ника связывали не только одинаковый возраст и игры, но прежде всего общие идеи и вера в своё будущее. В тот день отец Герцена поехал за город и пригласил Огарёва с его учителем. Они долго ехали в старой тяжёлой карете, потом переехали на лодке Москву-реку, и мальчики убежали вперёд, на Воробьёвы горы. Там, на месте закладки храма, они обнялись и перед всей Москвой присягнули отдать жизнь борьбе, которую выбрали. Через двадцать шесть лет автор понимает, что эта сцена может показаться театральной, но она была искренней, и это доказала вся их жизнь. Он считает, что дружба юношей так же горяча, как первая любовь. В конце он обращается к Огарёву с грустью: он чувствует, что жизнь идёт к концу, и дарит другу свои воспоминания."
        rubric: ["六个问题都回答，事实与选文一致", "写出誓言的内容：为选定的斗争献出生命", "写出作者的让步式评价：看似做作，其实真诚", "写出结尾对奥加辽夫说话时的忧伤", "100–140 词"]
        notes: "答案依次在第 1、4–5、6、7、11、13–14 段。注意转述议论时要保留作者的逻辑：[может показаться … а между тем …]{.ru}，不要只写“这一幕很做作”。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[незабвенный]{.ru}"
        accept: ["Такой, который нельзя забыть.", "Который никогда не забудешь."]
        rubric: ["说明是忘不了的"]
      - zh: "[разлука]{.ru}"
        accept: ["Когда близкие люди долго не видят друг друга.", "Жизнь далеко друг от друга.", "Когда люди расстаются и долго не видятся."]
        rubric: ["说明是亲近的人分开、不能见面"]
      - zh: "[досуг]{.ru}"
        accept: ["Свободное время.", "Время, когда не нужно работать.", "Время, свободное от работы."]
        rubric: ["说明是空闲时间"]
      - zh: "[застенчивость]{.ru}"
        accept: ["Когда человеку трудно говорить о своих чувствах.", "Когда человек боится говорить с другими о себе.", "Когда человеку трудно говорить с другими людьми."]
        rubric: ["说明是腼腆、怕羞"]
      - zh: "[юность]{.ru}"
        accept: ["Время жизни между детством и взрослой жизнью.", "Молодые годы человека.", "Время, когда человек уже не ребёнок, но ещё не взрослый."]
        rubric: ["说明是少年到青年的时期"]
      - zh: "[безбоязненно]{.ru}"
        accept: ["Без страха.", "Ничего не боясь.", "Смело, без страха."]
        rubric: ["说明是不害怕地"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题第 1 段：除了年龄和“亲和力”，把他们联系在一起的是 [наша общая религия]{.ru}，指共同的理想，不是宗教。第 2 题第 6 段：他们 [присягнули … пожертвовать нашей жизнью на избранную нами борьбу]{.ru}。第 3 题第 7 段是让步结构：先承认“可能显得做作”，再用 [а между тем]{.ru} 引出自己的看法，所以作者并不认为它可笑。第 4 题写马车的段落用夸张制造幽默，和山顶庄严的场面形成对比；作者并不是在批评父亲买东西。第 5 题第 12 段用“您们”，对读者说话；第 13 段 [Так-то, Огарёв]{.ru} 才转向朋友。第 6 题 [одной молодости недостаточно]{.ru}：赫尔岑认为光年轻不等于有青春，青春要有理想和热情。"
    items:
      - stem: Мальчиков больше всего связывала ___.
        options: ["общая вера в одни и те же идеи", "любовь к играм во дворе", "общая школа"]
        answer: "общая вера в одни и те же идеи"
      - stem: На Воробьёвых горах мальчики ___.
        options: ["присягнули отдать жизнь борьбе", "положили первый камень храма", "искали Карла Ивановича"]
        answer: "присягнули отдать жизнь борьбе"
      - stem: "Слова «Сцена эта может показаться очень натянутой … а между тем … она была свято искренна» показывают, что автор ___."
        options: ["понимает, как сцену могут увидеть другие, но верит в её искренность", "считает эту сцену смешной ошибкой юности", "не помнит, что было на горах"]
        answer: "понимает, как сцену могут увидеть другие, но верит в её искренность"
      - stem: Описание старой кареты и толстых лошадей ___.
        options: ["смешное и помогает сильнее почувствовать высокую сцену на горах", "показывает, что отец автора был бедным", "объясняет, почему мальчики опоздали"]
        answer: "смешное и помогает сильнее почувствовать высокую сцену на горах"
      - stem: "Словами «Улыбнитесь, пожалуй, да только кротко» автор говорит с ___."
        options: [читателями, Огарёвым, отцом]
        answer: читателями
      - stem: "По мнению автора, «одной молодости недостаточно», чтобы ___."
        options: [иметь юность, иметь друзей, стать писателем]
        answer: иметь юность

  - id: e4
    type: rewrite
    task: 用让步结构 [может показаться …, а между тем …]{.ru} 把两个句子合成一句，像赫尔岑那样先承认别人的看法，再提出自己的看法。
    example:
      cue: Эта сцена театральная. Она была искренней.
      answer: Эта сцена может показаться театральной, а между тем она была искренней.
    why: "[может показаться]{.ru} 后面的形容词用第五格（[театральной, смешной, скучной]{.ru}），这是最容易错的地方；[а между тем]{.ru} 引出与前面相反的事实或评价，是议论中常用的转折。第 1 题 [смешная]{.ru} → [смешной]{.ru}，阴性第五格。第 2 题 [детская]{.ru} → [детской]{.ru}。第 3 题 [скучное]{.ru} → [скучным]{.ru}，中性第五格。"
    items:
      - cue: Клятва мальчиков смешная. Они помнили её всю жизнь.
        accept: ["Клятва мальчиков может показаться смешной, а между тем они помнили её всю жизнь."]
      - cue: Их дружба детская. Она была серьёзной.
        accept: ["Их дружба может показаться детской, а между тем она была серьёзной."]
      - cue: Чтение воспоминаний скучное. Оно учит нас многому.
        accept: ["Чтение воспоминаний может показаться скучным, а между тем оно учит нас многому."]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右，叙事和作者的议论都要保留。
    items:
      - prompt: "[Кратко перескажите отрывок.]{.ru}"
        length: 130–170
        model: "Герцен вспоминает о своей дружбе с Огарёвым, которого в детстве звали Ником. С самого начала эта дружба была серьёзной: мальчиков связывали общие идеи и вера в своё будущее. Однажды отец Герцена поехал за город и взял с собой Ника и его учителя Карла Ивановича. Они долго ехали в старой тяжёлой карете, а потом переехали через Москву-реку. Мальчики убежали вперёд, на Воробьёвы горы, на место закладки храма. Там, глядя на Москву, они обнялись и присягнули отдать жизнь борьбе за свои идеи. Автор признаёт, что эта сцена может показаться театральной, но, по его словам, она была искренней, и вся их жизнь это доказала. С тех пор Воробьёвы горы стали для друзей святым местом. Автор пишет, что дружба юношей так же горяча, как первая любовь, и советует читателю благодарить судьбу, если у него был друг. В конце он обращается к Огарёву и дарит ему свои воспоминания."
        rubric: ["叙事部分：郊游、登山、誓言", "议论部分至少两点：对誓言的评价、友谊与初恋", "结尾写出献给奥加辽夫", "用转述（[автор признаёт, по его словам, пишет, советует]{.ru}）表示议论是作者的看法", "130–170 词"]
        notes: "范文约 165 词。概要回忆录类文本时，作者的议论不能删，要用转述动词标出来：[признаёт, что …]{.ru}、[по его словам]{.ru}、[пишет, что …]{.ru}、[советует …]{.ru}。马车的幽默细节、亚历山大和约瑟夫二世的典故、雅各的比喻都可以省略。"

  - id: e6
    type: open
    task: 作文。以 [«Дружба юности»]{.ru} 为题，用俄语写一篇 250–300 词的随笔：先讲一件和朋友有关的往事，再谈你对友谊的看法。仿照赫尔岑，至少用一次让步结构（[может показаться …, а между тем …]{.ru}），并在结尾直接对朋友或读者说话。
    items:
      - prompt: "[Дружба юности]{.ru}"
        length: 250–300
        model: "Мы познакомились с Анной в первый день в седьмом классе. Учительница посадила нас рядом, и уже через неделю мы не могли провести и дня, чтобы не поговорить. Мы вместе делали уроки, читали одни и те же книги и мечтали о будущем: она хотела стать врачом, а я — переводчиком.\n\nЛучше всего я помню один летний вечер, когда нам было по пятнадцать лет. Мы поднялись на холм за городом, откуда был виден весь наш город, и долго сидели молча. Потом Анна вдруг сказала: «Давай пообещаем друг другу, что никогда не перестанем мечтать». Мы взялись за руки и пообещали.\n\nЭта сцена может показаться наивной и даже смешной, а между тем я и сейчас, через десять лет, вспоминаю её с волнением. Мы обе не забыли тот вечер: Анна работает врачом в больнице, а я перевожу книги.\n\nМне кажется, что дружба в юности — особенное чувство. Взрослые часто дружат по необходимости: с коллегами, с соседями, с теми, кто может помочь. А в пятнадцать лет мы дружим просто потому, что не можем друг без друга. В такой дружбе есть всё, о чём писал Герцен: и горячность, и ревнивое желание исключительности, и страх разлуки, и полная преданность. Наверное, поэтому её нельзя повторить.\n\nСейчас мы живём в разных городах и видимся редко, раз в год. Но когда мы встречаемся, нам кажется, что мы расстались только вчера.\n\nАнна, если ты когда-нибудь прочитаешь эти строки, знай: тот вечер на холме — одно из самых дорогих моих воспоминаний. Спасибо тебе за нашу юность."
        rubric: ["有一个具体的往事场景", "有议论：对青春友谊的看法，最好有对比", "至少一次让步结构 [может показаться …, а между тем …]{.ru}，形容词用第五格", "结尾直接对朋友或读者说话", "250–300 词"]
        notes: "范文约 290 词，结构仿照选文：往事（同桌、山上的约定）→ 自我评价（让步结构）→ 议论（青春的友谊和成年人的友谊）→ 结尾转向朋友，用“你”说话。议论部分可以借用选文第 11 段的说法：[горячность, преданность, тоска разлуки]{.ru}。"
