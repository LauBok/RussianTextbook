lesson: L49
grammar: 日期的表达：[Како́е сего́дня число́? — Сего́дня деся́тое ноября́]{.ru}（序数词中性第一格 + 月份第二格）；[Како́го числа́? — Деся́того ноября́]{.ru}（序数词第二格 + 月份第二格）。
exercises:

  - id: e1
    type: fill
    task: 回答 [Како́е сего́дня число́?]{.ru}，用文字写出日期。
    placeholder: Сего́дня …
    why: 序数词用中性第一格，和省略了的 [число́]{.ru} 一致，词尾 [-ое]{.ru}（[тре́тий]{.ru} 是 [тре́тье]{.ru}）；月份用第二格。容易犯的错误是把月份写成第一格（[деся́тое ноя́брь]{.ru}），或者序数词用阳性（[деся́тый]{.ru}）。
    items:
      - stem: Сего́дня ___. (10.11)
        accept: [деся́тое ноября́]
      - stem: Сего́дня ___. (1.09)
        accept: [пе́рвое сентября́]
      - stem: Сего́дня ___. (3.03)
        accept: [тре́тье ма́рта]
      - stem: Сего́дня ___. (12.05)
        accept: [двена́дцатое ма́я]
      - stem: Сего́дня ___. (25.12)
        accept: [два́дцать пя́тое декабря́]
      - stem: Сего́дня ___. (7.01)
        accept: [седьмо́е января́]

  - id: e2
    type: fill
    task: 回答 [Како́го числа́?]{.ru}，用文字写出日期。
    placeholder: …
    why: 回答“在哪一天”，序数词和月份都用第二格，前面不加 [в]{.ru}。序数词中性第二格词尾是 [-ого]{.ru}，[тре́тий]{.ru} 是 [тре́тьего]{.ru}。复合序数词只变最后一个词：[два́дцать пя́того]{.ru}。
    items:
      - stem: — Како́го числа́ у вас контро́льная рабо́та? — ___ (25.11)
        accept: [два́дцать пя́того ноября́]
      - stem: — Како́го числа́ у тебя́ день рожде́ния? — ___ (12.05)
        accept: [двена́дцатого ма́я]
      - stem: — Како́го числа́ у О́льги Ви́кторовны день рожде́ния? — ___ (3.03)
        accept: [тре́тьего ма́рта]
      - stem: — Како́го числа́ День наро́дного еди́нства? — ___ (4.11)
        accept: [четвёртого ноября́]
      - stem: — Како́го числа́ начина́ются уро́ки в шко́ле? — ___ (1.09)
        accept: [пе́рвого сентября́]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: 只说月份用 [в]{.ru} + 第六格（第 1 题）；说“今天几号”用序数词第一格（第 2 题）；说“在几号”用序数词第二格，月份也用第二格，不加 [в]{.ru}（第 3、4 题）；说星期几用 [в]{.ru} + 第四格（第 5 题）。
    items:
      - stem: У А́нны день рожде́ния ___.
        options: [в ию́ле, ию́ля]
        answer: в ию́ле
      - stem: Сего́дня ___ ноября́.
        options: [деся́тое, деся́того]
        answer: деся́тое
      - stem: Контро́льная рабо́та бу́дет ___ ноября́.
        options: [два́дцать пя́тое, два́дцать пя́того]
        answer: два́дцать пя́того
      - stem: Мой день рожде́ния двена́дцатого ___.
        options: [ма́я, в ма́е]
        answer: ма́я
      - stem: Уро́к бу́дет ___.
        options: [во вто́рник, вто́рника]
        answer: во вто́рник

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：今天是十一月十号；王磊起先写成了 [11.10]{.ru}，那是十月十一号；测验在十一月二十五号，两周以后；王磊的生日是五月十二号。
    items:
      - stem: Сего́дня ___.
        options: [деся́тое ноября́, оди́ннадцатое октября́]
        answer: деся́тое ноября́
      - stem: «11.10» — э́то ___.
        options: [деся́тое ноября́, оди́ннадцатое октября́]
        answer: оди́ннадцатое октября́
      - stem: Контро́льная рабо́та бу́дет ___.
        options: [че́рез неде́лю, че́рез две неде́ли]
        answer: че́рез две неде́ли
      - stem: "Ван Лэй: «У меня́ день рожде́ния ___.»"
        options: [двена́дцатого ма́я, тре́тьего ма́рта]
        answer: двена́дцатого ма́я

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语的“今天十一月十号”“五月十二号”顺序是月在前、日在后，俄语正好相反，日在前、月在后，月份用第二格。注意区分“今天是几号”（第一格）和“在几号”（第二格）。
    items:
      - zh: ——今天几号？——今天九月一号。
        accept: ["— Како́е сего́дня число́? — Сего́дня пе́рвое сентября́.", "— Како́е число́ сего́дня? — Сего́дня пе́рвое сентября́.", "— Како́е сего́дня число́? — Пе́рвое сентября́."]
        rubric: ["[како́е число́]{.ru}", "序数词中性第一格 [пе́рвое]{.ru} + 月份第二格 [сентября́]{.ru}"]
      - zh: 我的生日是五月十二号。
        accept: ["Мой день рожде́ния двена́дцатого ма́я.", "У меня́ день рожде́ния двена́дцатого ма́я."]
        rubric: ["序数词第二格 [двена́дцатого]{.ru}", "月份第二格 [ма́я]{.ru}，不加 [в]{.ru}"]
      - zh: 测验在十一月二十五号。
        accept: ["Контро́льная рабо́та бу́дет два́дцать пя́того ноября́.", "Контро́льная бу́дет два́дцать пя́того ноября́.", "Контро́льная рабо́та два́дцать пя́того ноября́."]
        rubric: ["复合序数词只变最后一个词：[два́дцать пя́того]{.ru}"]
      - zh: 在俄罗斯先写日子，然后写月份。
        accept: ["В Росси́и пи́шут число́, а пото́м ме́сяц."]
        rubric: ["“人们写”用不带主语的 [пи́шут]{.ru}", "[в Росси́и]{.ru}"]

  - id: e6
    type: open
    task: 写一写你这个月和下个月的重要日子（40–60 词）。
    items:
      - prompt: 先写今天的日期，再写几个重要的日子：考试、朋友或家人的生日、节日，分别是几月几号。
        length: 40–60
        model: "Сего́дня деся́тое ноября́. Два́дцать пя́того ноября́ у нас контро́льная рабо́та. Че́рез две неде́ли у Ми́ши день рожде́ния. Тридца́того ноября́ я напишу́ письмо́ домо́й. Два́дцать пя́того декабря́ у нас экза́мен. А пе́рвого января́ — Но́вый год. Э́то пра́здник, и мы бу́дем отдыха́ть."
        rubric: ["今天的日期用序数词中性第一格 + 月份第二格", "“在某天”用序数词第二格 + 月份第二格，不加 [в]{.ru}", "至少四个日期"]
        notes: 范文第一句用第一格说今天的日期，以后每句开头都用第二格说“在哪一天”，再说那天做什么。中间穿插 [че́рез две неде́ли]{.ru} 这样的说法，避免句式单调。注意 [Но́вый год]{.ru} 前面用破折号代替省略的动词。
