lesson: B3-L20
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第二单元（第 11–19 课）的全部语法：两种副动词的构成和用法、副动词短语与从句的互换、副动词短语的意义、变成前置词的副动词、无人称句、不定人称句、否定与体、命令式与假定式，最后一题练习本单元的缩写与句式改写。没有达到 80% 的，第 1、2 题错得多回看第 11、12 课，第 3、4 题回看第 13 课，第 5 题回看第 14 课，第 6 题回看第 15 课，第 7 题回看第 16 课，第 8 题回看第 17 课，第 9 题回看第 18 课，第 10 题回看第 19 课，复习后重做。
grammar: "未完成体副动词 [-я, -а, -ясь]{.ru}（同时）；完成体副动词 [-в, -вшись, -я]{.ru}（先后）；副动词短语与 [когда, после того как, так как, если, хотя]{.ru} 从句的互换；[благодаря, несмотря на, судя по]{.ru}；无人称句 [не хватает, удалось, приходится]{.ru}；不定人称句与泛指人称句；否定与体；命令式与假定式。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里动词的副动词。
    why: "未完成体副动词由现在时复数第三人称构成：[гуляют → гуляя]{.ru}（第 1 题），[объявляют → объявляя]{.ru}（第 6 题）；带 [-ся]{.ru} 的加 [-сь]{.ru}：[греются → греясь]{.ru}（第 2 题）。[быть]{.ru} 的副动词是特殊形式 [будучи]{.ru}（第 8 题）。完成体副动词由不定式词干构成：[купить → купив]{.ru}（第 5 题）；带 [-ся]{.ru} 的只能用 [-вшись]{.ru}：[подняться → поднявшись]{.ru}，[проснуться → проснувшись]{.ru}（第 3、7 题），丢掉 [-сь]{.ru} 是常见错误。[выйти]{.ru} 属于 [-йти]{.ru} 类，由将来时词干加 [-я]{.ru}：[выйдя]{.ru}（第 4 题），样子像未完成体，其实是完成体。"
    items:
      - stem: ___ по острову, мы фотографировали скалы.
        hint: гулять
        accept: [гуляя]
      - stem: Летом нерпы лежат на камнях, ___ на солнце.
        hint: греться
        accept: [греясь]
      - stem: ___ на вершину, туристы увидели кратер.
        hint: подняться
        accept: [поднявшись]
      - stem: ___ из театра почти в полночь, зрители не верят своим глазам.
        hint: выйти
        accept: [выйдя]
      - stem: ___ билеты, туристы отправляются в круиз.
        hint: купить
        accept: [купив]
      - stem: Проводница шла по вагону, громко ___ станции.
        hint: объявлять
        accept: [объявляя]
      - stem: Утром, ___, пассажиры выходят на палубу.
        hint: проснуться
        accept: [проснувшись]
      - stem: Многие казанцы, не ___ татарами, знают татарские песни.
        hint: быть
        accept: [будучи]

  - id: e2
    type: choice
    task: 选择正确的副动词或正确的句子。
    why: "第 1 题 [весь вечер]{.ru} 说明坐着和看灯火同时进行，用未完成体 [сидя]{.ru}；[сев]{.ru} 是完成体，只表示“坐下以后”。第 2 题火车先开走、六天后才到，用完成体 [уйдя]{.ru}；[-йти]{.ru} 类的完成体副动词也以 [-я]{.ru} 结尾，别和未完成体 [уходя]{.ru} 混。第 3 题先读完再去睡，用完成体 [прочитав]{.ru}；用 [читая]{.ru} 就成了“一边读书一边去睡”。第 4 题“迟到”是先完成的动作，也是条件，用完成体 [опоздав]{.ru}。第 5 题 [медленно]{.ru} 和拉船同时进行，用 [шагая]{.ru}；[пройдя]{.ru} 是完成体，表示走完以后。第 6、7 题考主语一致：[мне понравились скалы]{.ru} 的主语是 [скалы]{.ru}，[нам было весело]{.ru} 没有主语，“散步”“参观”的人都不是句子的主语，所以不能用副动词，只能用 [когда]{.ru} 从句。"
    items:
      - stem: Весь вечер ___ на палубе, пассажиры смотрели на огни.
        options: [сидя, сев]
        answer: сидя
      - stem: ___ из Москвы, поезд через шесть дней пришёл во Владивосток.
        options: [Уйдя, Уходя]
        answer: Уйдя
      - stem: ___ книгу, он пошёл спать.
        options: [Прочитав, Читая]
        answer: Прочитав
      - stem: ___ к мосту, можно остаться на чужом берегу до утра.
        options: [Опоздав, Опаздывая]
        answer: Опоздав
      - stem: Медленно ___ по берегу, бурлаки тянули суда против течения.
        options: [шагая, пройдя]
        answer: шагая
      - stem: ___
        options:
          - "Гуляя по острову, мне понравились скалы."
          - "Когда я гулял по острову, мне понравились скалы."
        answer: "Когда я гулял по острову, мне понравились скалы."
      - stem: ___
        options:
          - "Осмотрев кремль, нам было весело."
          - "Когда мы осмотрели кремль, нам было весело."
        answer: "Когда мы осмотрели кремль, нам было весело."

  - id: e3
    type: rewrite
    task: 把副动词短语改成从句，连词用括号里给的。
    example:
      cue: Гуляя по пустым улицам, герой встречает Настеньку. (когда)
      answer: Когда герой гуляет по пустым улицам, он встречает Настеньку.
    why: "三步：选连词、补主语、定体和时。名词主语移进从句，主句改用代词 [они, она, он]{.ru}。体与副动词一致：第 1 题 [спустившись]{.ru} → 完成体 [спустились]{.ru}；第 5 题 [привыкнув]{.ru} → [привыкли]{.ru}；第 2、4、6 题未完成体 → [хотела, знает, путешествуют]{.ru}。时间与主句一致：第 3 题主句是将来时 [попадёте]{.ru}，从句也用将来时 [приедете]{.ru}，不能用现在时。第 2 题 [желать]{.ru} 在从句里换成更常用的 [хотеть]{.ru}，用 [желала]{.ru} 也对。"
    items:
      - cue: Спустившись из кремля, туристы пошли на улицу Баумана. (после того как)
        accept: ["После того как туристы спустились из кремля, они пошли на улицу Баумана.", "Туристы пошли на улицу Баумана после того, как спустились из кремля.", "Туристы пошли на улицу Баумана после того как спустились из кремля."]
      - cue: Не желая выходить замуж за Ивана Грозного, царица бросилась с башни. (потому что)
        accept: ["Царица бросилась с башни, потому что не хотела выходить замуж за Ивана Грозного.", "Царица бросилась с башни, потому что она не хотела выходить замуж за Ивана Грозного.", "Царица бросилась с башни, потому что не желала выходить замуж за Ивана Грозного.", "Царица бросилась с башни, потому что она не желала выходить замуж за Ивана Грозного."]
      - cue: Приехав в Казань в июне, вы попадёте на Сабантуй. (если)
        accept: ["Если вы приедете в Казань в июне, вы попадёте на Сабантуй.", "Если вы приедете в Казань в июне, то попадёте на Сабантуй.", "Если вы приедете в Казань в июне, попадёте на Сабантуй.", "Вы попадёте на Сабантуй, если приедете в Казань в июне."]
      - cue: Даже не зная татарского языка, гость быстро запоминает несколько слов. (хотя)
        accept: ["Хотя гость не знает татарского языка, он быстро запоминает несколько слов.", "Хотя гость не знает татарский язык, он быстро запоминает несколько слов.", "Хотя гость и не знает татарского языка, он быстро запоминает несколько слов.", "Хотя гость и не знает татарский язык, он быстро запоминает несколько слов."]
      - cue: Привыкнув к тёмным ночам, многие приезжие плохо спят. (так как)
        accept: ["Так как многие приезжие привыкли к тёмным ночам, они плохо спят.", "Многие приезжие плохо спят, так как привыкли к тёмным ночам.", "Многие приезжие плохо спят, так как они привыкли к тёмным ночам."]
      - cue: Путешествуя вокруг Байкала, туристы обязательно пробуют омуля. (когда)
        accept: ["Когда туристы путешествуют вокруг Байкала, они обязательно пробуют омуля.", "Туристы обязательно пробуют омуля, когда путешествуют вокруг Байкала.", "Туристы обязательно пробуют омуля, когда они путешествуют вокруг Байкала."]

  - id: e4
    type: rewrite
    task: 把从句或并列谓语改成副动词短语。
    example:
      cue: Когда писатели приезжали в Петербург, они писали о белых ночах.
      answer: Приезжая в Петербург, писатели писали о белых ночах.
    why: "从句和主句主语相同才能改。改的时候去掉连词，从句的谓语变成副动词，名词主语回到主句，代词去掉。体不变：第 1、3、6 题的 [осмотрели, увидел, вернулись]{.ru} 是完成体，改成 [осмотрев, увидев, вернувшись]{.ru}；第 2、4、5 题的 [верила, не знали, проезжают]{.ru} 是未完成体，改成 [веря, не зная, проезжая]{.ru}。最常见的错误是体弄错，比如把 [когда туристы осмотрели]{.ru} 改成 [осматривая]{.ru}；第 6 题别丢了 [-сь]{.ru}。"
    items:
      - cue: Когда туристы осмотрели кремль, они вернулись на теплоход.
        accept: ["Осмотрев кремль, туристы вернулись на теплоход.", "Туристы, осмотрев кремль, вернулись на теплоход."]
      - cue: Ассоль верила в свою мечту и много лет ждала корабль с алыми парусами.
        accept: ["Веря в свою мечту, Ассоль много лет ждала корабль с алыми парусами.", "Ассоль, веря в свою мечту, много лет ждала корабль с алыми парусами."]
      - cue: После того как Репин увидел бурлаков, он написал свою знаменитую картину.
        accept: ["Увидев бурлаков, Репин написал свою знаменитую картину.", "Репин, увидев бурлаков, написал свою знаменитую картину."]
      - cue: Так как мы не знали дороги, мы спросили местных жителей.
        accept: ["Не зная дороги, мы спросили местных жителей.", "Мы, не зная дороги, спросили местных жителей."]
      - cue: Когда пассажиры проезжают мимо обелиска, они смотрят в окна.
        accept: ["Проезжая мимо обелиска, пассажиры смотрят в окна.", "Пассажиры, проезжая мимо обелиска, смотрят в окна."]
      - cue: Когда мы вернулись домой, мы долго рассказывали о поездке.
        accept: ["Вернувшись домой, мы долго рассказывали о поездке.", "Мы, вернувшись домой, долго рассказывали о поездке."]

  - id: e5
    type: choice
    task: 副动词短语在句子里是什么意思？选出改写成从句时用的连词。
    why: "第 1 题前面有 [даже]{.ru}，表示让步，用 [хотя]{.ru}。第 2、6 题说的是“到时候会怎样”（[можно]{.ru} + 不定式、将来时 [купите]{.ru}），副动词表示条件，用 [если]{.ru}。第 3 题 [не желая]{.ru} 是表示意愿的副动词，说明跳塔的原因，用 [потому что]{.ru}。第 4 题“下来以后去鲍曼街”是先后发生的动作，表示时间，用 [после того как]{.ru}。第 5 题不是鞑靼人却会唱鞑靼歌，意思相对，表示让步，用 [хотя]{.ru}；理解成原因 [так как]{.ru} 不合逻辑。"
    items:
      - stem: Даже не зная языка, гость запоминает несколько слов. = ___ гость не знает языка, он запоминает несколько слов.
        options: [Хотя, Если, Так как]
        answer: Хотя
      - stem: Приехав в Казань в июне, можно попасть на Сабантуй. = ___ вы приедете в Казань в июне, вы сможете попасть на Сабантуй.
        options: [Если, Хотя, Пока]
        answer: Если
      - stem: Не желая выходить замуж, царица бросилась с башни. = Царица бросилась с башни, ___ не хотела выходить замуж.
        options: [потому что, хотя, если]
        answer: потому что
      - stem: Спустившись из кремля, мы пошли на улицу Баумана. = ___ мы спустились из кремля, мы пошли на улицу Баумана.
        options: [После того как, Хотя, Так как]
        answer: После того как
      - stem: Не будучи татарами, многие казанцы знают татарские песни. = ___ многие казанцы не татары, они знают татарские песни.
        options: [Хотя, Так как, Если]
        answer: Хотя
      - stem: Попробовав чак-чак один раз, вы обязательно купите его в подарок. = ___ вы попробуете чак-чак один раз, вы обязательно купите его в подарок.
        options: [Если, Хотя, Пока]
        answer: Если

  - id: e6
    type: fill
    task: 填入 [благодаря]{.ru}、[несмотря на]{.ru}、[судя по]{.ru}、[из-за]{.ru} 中的一个。
    why: "先看格：第四格前用 [несмотря на]{.ru}（第 2、7 题 [риск, долгую дорогу]{.ru}）；第二格前用 [из-за]{.ru}（第 4、8 题 [пепла, тумана]{.ru}），表示带来坏结果的原因。第三格前有两个可能，再看意思：带来好结果的原因用 [благодаря]{.ru}（第 1、5 题：有温泉、能提前预警都是好事）；说明判断的根据用 [судя по]{.ru}（第 3、6 题：从数字看、听居民说）。[благодаря]{.ru} 不能用于坏的结果，第 4、8 题写 [благодаря]{.ru} 就成了讽刺。"
    items:
      - stem: ___ вулканам на Камчатке много горячих источников.
        accept: [благодаря]
      - stem: ___ риск, многие жители Камчатки не хотят уезжать.
        accept: [несмотря на]
      - stem: ___ этим цифрам, это один из самых активных районов планеты.
        accept: [судя по]
      - stem: ___ пепла самолёты не могли летать.
        accept: [из-за]
      - stem: ___ работе учёных людей можно заранее предупредить об опасности.
        accept: [благодаря]
      - stem: ___ рассказам местных жителей, эта вода очень полезна для здоровья.
        accept: [судя по]
      - stem: ___ долгую дорогу, скучно нам не было.
        accept: [несмотря на]
      - stem: ___ тумана паромы на острова не ходили.
        accept: [из-за]

  - id: e7
    type: fill
    task: 写出括号里词的正确形式，组成无人称句。
    why: "无人称句的主体用第三格：[мне]{.ru}（第 2 题），[моему другу]{.ru}（第 4 题），[пассажирам]{.ru}（第 5 题），写成第一格是最常见的错误。谓语过去时永远用中性单数：[хватило, хотелось, было]{.ru}（第 3、6、7 题）。第 1、3 题 [не хватает]{.ru} 不和缺少的东西（第二格 [интернета, времени]{.ru}）一致，也不和缺东西的人一致，始终是单数；第 3 题说的是一次具体的情况，用完成体 [не хватило]{.ru}。"
    items:
      - stem: Пассажирам не ___ интернета.
        hint: хватать，现在时
        accept: [хватает]
      - stem: В первую ночь ___ не спалось.
        hint: я
        accept: [мне]
      - stem: Нам не ___ времени, чтобы поехать на Камчатку.
        hint: хватить，过去时
        accept: [хватило]
      - stem: Прошлым летом ___ удалось проехать по Транссибу.
        hint: мой друг
        accept: [моему другу]
      - stem: Почти каждый день ___ приходилось переводить часы.
        hint: пассажиры
        accept: [пассажирам]
      - stem: Всем ___ увидеть границу двух частей света.
        hint: хотеться，过去时
        accept: [хотелось]
      - stem: Несмотря на долгую дорогу, скучно нам не ___.
        hint: быть，过去时
        accept: [было]

  - id: e8
    type: rewrite
    task: 把被动结构改成不定人称句。
    example:
      cue: Город был основан в 1916 году.
      answer: Город основали в 1916 году.
    why: "不定人称句的谓语用复数第三人称，过去时用复数：[спустили, переименовали, основали, открыли, включили, построили]{.ru}。原来的主语变成宾语，用第四格：阴性名词要改词尾，第 4 题 [новая мечеть → новую мечеть]{.ru}；阳性非动物名词第四格和第一格相同，看不出变化。不能加 [они]{.ru}，加了就成了指确定的人。"
    items:
      - cue: Ледокол был спущен на воду в 1957 году.
        accept: ["Ледокол спустили на воду в 1957 году.", "В 1957 году ледокол спустили на воду."]
      - cue: Город был переименован в Мурманск в 1917 году.
        accept: ["Город переименовали в Мурманск в 1917 году.", "В 1917 году город переименовали в Мурманск."]
      - cue: Казанский университет был основан в 1804 году.
        accept: ["Казанский университет основали в 1804 году.", "В 1804 году основали Казанский университет."]
      - cue: Новая мечеть была открыта в 2005 году.
        accept: ["Новую мечеть открыли в 2005 году.", "В 2005 году открыли новую мечеть."]
      - cue: Байкал был включён в список Всемирного наследия ЮНЕСКО в 1996 году.
        accept: ["Байкал включили в список Всемирного наследия ЮНЕСКО в 1996 году.", "В 1996 году Байкал включили в список Всемирного наследия ЮНЕСКО."]
      - cue: Мост через Амур был построен в 1916 году.
        accept: ["Мост через Амур построили в 1916 году.", "В 1916 году построили мост через Амур."]

  - id: e9
    type: choice
    task: 选择动词的体。
    why: "第 1、2 题 [не стоит, не надо]{.ru} 后面用未完成体不定式，不说 [*не надо позвонить]{.ru}。第 3 题生病了“不允许”游泳，[нельзя]{.ru} + 未完成体；第 4 题题目本身有错误，“没法”解出来，[нельзя]{.ru} + 完成体 [решить]{.ru}；[нельзя решать]{.ru} 是“不许解”，和后半句不合。第 5 题担心对方无意中误了火车，是提醒，否定命令式用完成体 [не опоздайте]{.ru}；第 6 题劝对方别带，是劝阻，用未完成体 [не берите]{.ru}。第 7 题 [так и не]{.ru} 表示想做而到最后也没做成，用完成体 [искупался]{.ru}；第 8 题只陈述没打过电话这个事实，用未完成体 [не звонил]{.ru}。"
    items:
      - stem: В полдень не стоит ___ на пляж.
        options: [идти, пойти]
        answer: идти
      - stem: Не надо ___ маме, я ей уже всё рассказал.
        options: [звонить, позвонить]
        answer: звонить
      - stem: Ты болен, тебе нельзя ___ в холодном море.
        options: [купаться, искупаться]
        answer: купаться
      - stem: Эту задачу нельзя ___ — в ней ошибка.
        options: [решить, решать]
        answer: решить
      - stem: Поезд уходит в шесть утра. Не ___ на него!
        options: [опоздайте, опаздывайте]
        answer: опоздайте
      - stem: Не ___ с собой много тёплых вещей.
        options: [берите, возьмите]
        answer: берите
      - stem: Мой друг неделю жил в Сочи, но так и не ___ в море.
        options: [искупался, купался]
