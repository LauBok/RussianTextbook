  - id: e10
    type: rewrite
    task: 把直接的说法改得委婉一些，用括号里给的结构。
    example:
      cue: Покажите дорогу! (Не могли бы вы…?)
      answer: Не могли бы вы показать дорогу?
    why: "假定式由 [бы]{.ru} + 动词过去时形式构成，过去时形式和主语的性、数一致：[вы бы взяли]{.ru}（[вы]{.ru} 用复数），[я бы посоветовал / посоветовала]{.ru}，男女说话都可以。命令式改成 [Не могли бы вы…?]{.ru}、[я бы посоветовал…]{.ru} 时，原来的动词变成不定式，体不变：[помогите → помочь]{.ru}，[съездите → съездить]{.ru}。[я хочу → я хотел бы]{.ru}，[хочу → мне хотелось бы]{.ru}，后者主体用第三格。常见错误是 [бы]{.ru} 后面用现在时或将来时，如 [*я бы посоветую]{.ru}。"
    items:
      - cue: Возьмите зонт. (Вы бы…)
        accept: ["Вы бы взяли зонт."]
      - cue: Съездите на остров Русский. (Я бы посоветовал…)
        accept: ["Я бы посоветовал съездить на остров Русский.", "Я бы посоветовала съездить на остров Русский."]
      - cue: Помогите мне. (Не могли бы вы…?)
        accept: ["Не могли бы вы помочь мне?", "Не могли бы вы мне помочь?"]
      - cue: Я хочу заказать столик. (хотел бы)
        accept: ["Я хотел бы заказать столик.", "Я хотела бы заказать столик."]
      - cue: Поезжайте на поезде. (Я бы на вашем месте…)
        accept: ["Я бы на вашем месте поехал на поезде.", "Я бы на вашем месте поехала на поезде."]
      - cue: Хочу жить ближе к морю. (Мне хотелось бы…)
        accept: ["Мне хотелось бы жить ближе к морю."]

