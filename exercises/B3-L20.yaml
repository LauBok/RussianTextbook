  - id: e12
    type: open
    task: 缩写与句式改写。用第三人称（[автор]{.ru}）把复习课文压缩成一段：课文里的副动词短语至少三处改写成从句，课文里的从句或并列谓语至少两处改写成副动词短语；保留一处无人称句和一处假定式。
    items:
      - prompt: "提纲：旅行的路线和时间；彼得堡的白夜；伏尔加河与喀山；火车上；贝加尔湖；符拉迪沃斯托克；没去成的地方；给读者的建议。"
        length: 120–150
        model: "Прошлым летом автор проехал через всю Россию, от Петербурга до Владивостока. В Петербурге были белые ночи. Когда он вышел на улицу около полуночи, было светло, как вечером, но спать ему почти не удавалось, потому что он привык к тёмным ночам. Отправившись из Твери на теплоходе, он проплыл по Волге до Казани. Когда он стоял в кремле между собором и мечетью, он понял, что здесь встречаются две культуры. Сев в Казани на поезд, автор поехал дальше на восток. Интернета ему не хватало, но скучно ему не было. На Байкале он так и не увидел нерпу. Во Владивостоке он поднялся на сопку и увидел весь город и океан. Если бы у него было больше времени, он бы полетел на Камчатку. Читателям он советует не бояться больших расстояний и ехать на поезде."
        rubric: ["提纲八项都有", "至少三处由副动词短语改成的从句，体和时用对", "至少两处由从句或并列谓语改成的副动词短语，主语一致", "至少一处无人称句（[не удавалось, не хватало, было скучно]{.ru} 等）", "至少一处假定式，两个分句都有 [бы]{.ru}", "120–150 词"]
        notes: "范文约 130 词。副动词短语改成从句：[Когда он вышел на улицу]{.ru}（课文 [выйдя на улицу]{.ru}；改成从句后，主句可以换成没有主语的 [было светло]{.ru}）、[потому что он привык]{.ru}（课文 [привыкнув]{.ru}，原因）、[Когда он стоял в кремле]{.ru}（课文 [стоя в кремле]{.ru}）。从句或并列谓语改成副动词短语：[отправившись из Твери]{.ru}（课文 [поехал в Тверь, а оттуда отправился]{.ru}）、[сев в Казани на поезд]{.ru}（课文 [сел на поезд и поехал]{.ru}）。无人称句 [ему не удавалось]{.ru}、[ему не хватало]{.ru}、[скучно ему не было]{.ru}；否定与体 [так и не увидел]{.ru}；假定式 [если бы … было, он бы полетел]{.ru}；结尾把课文的命令式 [не бойтесь]{.ru} 转述为 [советует не бояться]{.ru}，否定的不定式用未完成体。"
