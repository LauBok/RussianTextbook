lesson: B4-L03
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Как обезьяна забавляла людей на палубе? Почему мальчик полез на мачту? Почему все замерли от страха? Что сделал капитан и почему? Чем кончилась эта история?]{.ru}"
        length: 90–130
        model: "Обезьяна вертелась среди людей, прыгала, делала рожи и передразнивала матросов, а все смеялись. Потом она сорвала с головы сына капитана шляпу и взобралась с ней на мачту. Мальчик рассердился, что над ним смеются, и полез за обезьяной, чтобы взять шляпу. Обезьяна повесила шляпу на край самой верхней перекладины. Мальчик бросил верёвку и ступил на перекладину, и все замерли: он мог упасть на палубу и разбиться. Когда кто-то ахнул, мальчик глянул вниз и зашатался. В это время капитан вышел из каюты с ружьём. Он понял, что сын может остаться живым, только если прыгнет в воду, прицелился в него и приказал прыгать. Мальчик прыгнул в море, матросы вытащили его, и он стал дышать. Тогда капитан убежал в каюту и заплакал."
        rubric: ["五个问题都回答，情节与选文一致", "说明船长举枪的原因：只有跳进水里才能得救", "结尾写出船长的反应"]
        notes: "第 4 题选文里没有直接说出原因，要自己推断：孩子已经慌了，回不到桅杆上，掉在甲板上必死，跳进海里却有救。用 [понял, что…]{.ru}、[только так…]{.ru} 一类说法把推断说清楚。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[передразнивать]{.ru}"
        accept: ["Повторять движения или слова другого человека, чтобы было смешно.", "Смешно повторять то, что делают другие.", "Показывать, как кто-то говорит или двигается, чтобы было смешно."]
        rubric: ["说明是模仿别人的动作或话语", "说明目的是取笑、逗乐"]
      - zh: "[взобраться]{.ru}"
        accept: ["Подняться наверх с трудом.", "Подняться на что-то высокое.", "Подняться на самый верх, держась руками."]
        rubric: ["说明是向上爬到高处"]
      - zh: "[оступиться]{.ru}"
        accept: ["Поставить ногу не туда и упасть.", "Сделать плохой шаг и упасть.", "Поставить ногу не туда, куда нужно."]
        rubric: ["说明是脚踩空、失足"]
      - zh: "[замереть]{.ru}"
        accept: ["Перестать двигаться, остановиться от страха.", "Перестать двигаться.", "Остановиться и не двигаться."]
        rubric: ["说明是一动不动、屏住呼吸"]
      - zh: "[опомниться]{.ru}"
        accept: ["Прийти в себя, понять, что происходит.", "Снова начать понимать, где ты и что с тобой.", "Прийти в себя."]
        rubric: ["说明是回过神来、明白过来"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题写猴子逗乐、和孩子追逐的前几段，句子长，一句里串着好几个动作，最长的一句在第 4 段：[обезьяна вытянулась во всю длину и, зацепившись задней рукой за верёвку, повесила шляпу…, а сама взобралась на макушку мачты и оттуда корчилась, показывала зубы и радовалась]{.ru}；孩子站上横桁以后（第 5—8 段）句子明显变短，父亲的话更短。第 2 题第 7 段 [опомнился, глянул вниз и зашатался]{.ru} 是三个完成体动词连用，没有任何修饰，写出一刹那的危险；它们不是未完成体，也不是副动词。第 3 题父亲的喊叫用的是最短的句子和命令式，感叹号连用，数数 [«Раз, два...»]{.ru} 让读者和他一起数，紧张到顶点。第 4 题作者没有写父亲在想什么，而是让读者从情节里推断，这是托尔斯泰“不说”的写法。第 5 题船长跑回船舱哭，是因为儿子得救以后，一直压着的恐惧一下子放了出来；他不是生儿子的气，也不是害怕水手。"
    items:
      - stem: Длинные предложения, в которых много глаголов, автор использует, когда рассказывает об ___.
        options: [игре обезьяны с мальчиком, опасной минуте на перекладине, приказах капитана]
        answer: игре обезьяны с мальчиком
      - stem: "В предложении «Мальчик от этого крика опомнился, глянул вниз и зашатался» три глагола ___."
        options: [совершенного вида, в настоящем времени, в форме деепричастия]
        answer: совершенного вида
      - stem: Слова капитана «В воду! прыгай сейчас в воду! застрелю!» — это ___.
        options: [короткие приказы, длинное объяснение, вопросы к сыну]
        answer: короткие приказы
      - stem: Почему капитан прицелился в сына, ___.
        options: [автор прямо не объясняет, объясняет сам капитан, объясняют матросы]
        answer: автор прямо не объясняет
      - stem: Капитан убежал в каюту, потому что ___.
        options: ["не хотел, чтобы видели его слёзы", сердился на сына, боялся матросов]
        answer: "не хотел, чтобы видели его слёзы"

  - id: e4
    type: fill
    task: 用括号里的动词的适当形式填空（过去时）。
    why: "这几个都是选文里表示“爬、跳”的带前缀动词，前缀决定方向。第 1 题 [взобраться на что]{.ru}“爬上去”，阴性过去时 [взобралась]{.ru}，主语是 [обезьяна]{.ru}。第 2 题 [полезть]{.ru} 表示“开始往上爬”，阳性 [полез]{.ru}，过去时没有 [-л]{.ru}。第 3 题 [добраться до чего]{.ru}“爬到，到达”，复数 [добрались]{.ru}，主语是 [обезьяна и мальчик]{.ru}。第 4 题 [спрыгнуть с чего]{.ru}“从……跳下”，复数 [спрыгнули]{.ru}，主语是 [матросы]{.ru}。第 5 题 [вынырнуть]{.ru}“浮出水面”，主语 [тело]{.ru} 中性，[вынырнуло]{.ru}。"
    items:
      - stem: Обезьяна сорвала с мальчика шляпу и живо ___ на мачту.
        hint: взобраться
        accept: ["взобралась"]
      - stem: "— Так не уйдёшь же ты от меня! — закричал мальчик и ___ выше."
        hint: полезть
        accept: ["полез"]
      - stem: Обезьяна и мальчик в одну минуту ___ до самого верха.
        hint: добраться
        accept: ["добрались"]
      - stem: 20 матросов ___ с корабля в море.
        hint: спрыгнуть
        accept: ["спрыгнули"]
      - stem: Секунд через 40 ___ тело мальчика.
        hint: вынырнуть
        accept: ["вынырнуло"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение рассказа «Прыжок».]{.ru}"
        length: 130–170
        model: "Корабль возвращался домой после путешествия вокруг света. Была тихая погода, и все были на палубе. Большая обезьяна забавляла людей: прыгала, делала рожи и передразнивала матросов. Вдруг она сорвала шляпу с головы двенадцатилетнего сына капитана и взобралась на мачту. Все засмеялись. Мальчик покраснел и полез за обезьяной, но она поднималась всё выше. На самом верху она повесила шляпу на край последней перекладины. Мальчик раззадорился, бросил мачту и ступил на перекладину. Все на палубе замерли от страха: стоило ему оступиться, и он разбился бы о палубу. Кто-то ахнул, мальчик глянул вниз и зашатался. В эту минуту из каюты вышел капитан с ружьём. Он прицелился в сына и закричал, чтобы тот прыгал в воду, иначе он будет стрелять. На счёт «три» мальчик прыгнул в море. Матросы вытащили его, и скоро он начал дышать. Тогда капитан закричал и убежал в каюту, чтобы никто не видел, как он плачет."
        rubric: ["130–170 词", "保留情节的几个阶段：猴子逗乐、抢帽子、追上桅杆、站上横桁、父亲举枪、跳水获救", "结尾写出船长的反应", "不加入原文没有的评论"]
        notes: "范文约 144 词。父亲的喊叫在概要里改成间接引语：[закричал, чтобы тот прыгал в воду, иначе он будет стрелять]{.ru}。[чтобы]{.ru} 引出命令内容时谓语用过去时形式；[тот]{.ru} 指前面提到的另一个人（儿子），避免与主语 [он]{.ru}（船长）混淆。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Правильно ли поступил капитан?» Как бы вы поступили на его месте? Можно ли было спасти мальчика по-другому?]{.ru}"
        length: 250–300
        model: "Когда читаешь «Прыжок» в первый раз, поступок капитана кажется страшным: отец поднимает ружьё в собственного сына. Но если подумать, становится ясно, что он поступил единственно правильно. Посмотрим, в каком положении был мальчик. Он стоял на перекладине на самом верху мачты, без верёвки, и уже потерял голову от страха. Пройти назад он не мог, а спуститься тоже было невозможно. Стоило ему оступиться, и он упал бы на палубу и разбился. Капитан увидел это за одну секунду и понял, что спасти мальчика может только вода. Но мальчик в таком состоянии не стал бы слушать простых советов. Ему нужно было что-то сильнее страха высоты. Долгие объяснения тоже не помогли бы: мальчик был слишком высоко и слишком испугался, чтобы думать. Поэтому отец и выбрал самое страшное — ружьё. Мальчик испугался выстрела больше, чем высоты, и прыгнул. Конечно, это был большой риск: падать в воду с такой высоты тоже опасно, а мальчик мог не вынырнуть. Но капитан знал, что рядом двадцать опытных матросов, которые сразу бросятся за ним. Можно ли было спасти мальчика иначе? Наверное, кто-нибудь мог бы попробовать подняться к нему. Но на это нужно время, а времени не было: мальчик уже шатался. Мне кажется, на месте капитана я бы не знал, что делать, и, может быть, начал бы кричать сыну, чтобы он держался. А это ничего бы не дало. Капитан смог в страшную минуту думать не о своих чувствах, а о жизни сына. Его настоящие чувства видны только в конце, когда он плачет в каюте. Он убегает, чтобы никто не видел его слёз: всё это время он держал свой страх в себе. Толстой прямо об этом не пишет, но читатель всё понимает. Поэтому для меня капитан — не злой человек, а настоящий отец и настоящий моряк, который умеет принять трудное решение."
        rubric: ["250–300 词", "明确回答船长做得对不对", "分析孩子的处境和船长决定的理由", "讨论其他办法的可能性", "写出“如果是我”的设想", "结论清楚"]
        notes: "范文约 286 词。论证顺序：第一印象（可怕）→ 分析处境（回不去、下不来、随时会掉下）→ 父亲的推理（只有水能救命，只有更大的恐惧能压倒对高度的恐惧）→ 承认风险并说明父亲考虑到了 → 其他办法为什么不行 → 如果是我 → 结论。虚拟语气 [я бы не знал, что делать]{.ru}、[это ничего бы не дало]{.ru} 用来写设想。"
