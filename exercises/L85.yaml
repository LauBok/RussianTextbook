lesson: L85
grammar: "[у кого́ боли́т / боля́т что]{.ru}：疼的部位作主语，动词和它的性、数一致；[боле́ть]{.ru} I（生病：[боле́ю, боле́ешь]{.ru}）与 [боле́ть]{.ru} II（疼：[боли́т, боля́т]{.ru}）；身体部位名词。"
exercises:

  - id: e1
    type: picture_qa
    task: 看图，用 [Что э́то?]{.ru} 问答。
    example: 1
    why: 身体部位是事物，用 [что]{.ru} 问。注意 [глаз]{.ru}、[у́хо]{.ru} 的复数不规则：[глаза́]{.ru}、[у́ши]{.ru}。
    items:
      - image: golova.svg
        qword: Что
        answer: [Э́то голова́.]
      - image: glaz.svg
        qword: Что
        answer: [Э́то глаз.]
      - image: ukho.svg
        qword: Что
        answer: [Э́то у́хо.]
      - image: rot.svg
        qword: Что
        answer: [Э́то рот.]
      - image: ruka.svg
        qword: Что
        answer: [Э́то рука́.]
      - image: noga.svg
        qword: Что
        answer: [Э́то нога́.]

  - id: e2
    type: choice
    task: 选择 [боли́т]{.ru} 或 [боля́т]{.ru}。
    why: "疼的部位是主语，单数用 [боли́т]{.ru}，复数用 [боля́т]{.ru}。[у́ши]{.ru}、[глаза́]{.ru}、[но́ги]{.ru} 是复数；[го́рло]{.ru}、[голова́]{.ru}、[живо́т]{.ru} 是单数。第 6 题问句里的 [что]{.ru} 作主语，动词用单数。"
    items:
      - stem: У меня́ ___ голова́.
        options: [боли́т, боля́т]
        answer: боли́т
      - stem: У Ван Лэ́я ___ у́ши.
        options: [боли́т, боля́т]
        answer: боля́т
      - stem: У тебя́ ___ го́рло?
        options: [боли́т, боля́т]
        answer: боли́т
      - stem: У меня́ ___ глаза́, когда́ я чита́ю.
        options: [боли́т, боля́т]
        answer: боля́т
      - stem: У Ми́ши ___ живо́т.
        options: [боли́т, боля́т]
        answer: боли́т
      - stem: Что у вас ___?
        options: [боли́т, боля́т]
        answer: боли́т

  - id: e3
    type: fill
    task: 写出 [боле́ть]{.ru} 过去时的正确形式。
    why: 过去时和身体部位的性、数一致：阳性 [живо́т]{.ru} → [боле́л]{.ru}，阴性 [голова́]{.ru}、[рука́]{.ru} → [боле́ла]{.ru}，中性 [го́рло]{.ru}、[у́хо]{.ru} → [боле́ло]{.ru}，复数 [глаза́]{.ru} → [боле́ли]{.ru}。不要跟着人走：“米沙的头疼”是 [боле́ла]{.ru}，不是 [боле́л]{.ru}。
    items:
      - stem: Вчера́ у меня́ ___ голова́.
        accept: [боле́ла]
      - stem: Вчера́ у Ми́ши ___ живо́т.
        accept: [боле́л]
      - stem: Вчера́ у А́нны ___ го́рло.
        accept: [боле́ло]
      - stem: Вчера́ у Ван Лэ́я ___ глаза́.
        accept: [боле́ли]
      - stem: Вчера́ у па́пы ___ рука́.
        accept: [боле́ла]

  - id: e4
    type: choice
    task: 选择正确的形式（注意两个 [боле́ть]{.ru}）。
    why: "主语是人、意思是“生病”，用第一变位 [боле́ю, боле́ешь, боле́ет]{.ru}；主语是身体部位、意思是“疼”，用第二变位 [боли́т, боля́т]{.ru}。第 3 题 [ча́сто]{.ru} 说的是人经常生病。"
    items:
      - stem: Вы давно́ ___?
        options: [боле́ете, боли́те]
        answer: боле́ете
      - stem: У меня́ ___ нога́.
        options: [боле́ет, боли́т]
        answer: боли́т
      - stem: Ми́ша ре́дко ___.
        options: [боле́ет, боли́т]
        answer: боле́ет
      - stem: Я ___ уже́ три дня.
        options: [боле́ю, боли́т]
        answer: боле́ю

  - id: e5
    type: translate
    task: 译成俄语。
    items:
      - zh: 我头疼，嗓子也疼。
        accept: ["У меня́ боли́т голова́, и го́рло то́же боли́т.", "У меня́ боли́т голова́ и го́рло.", "У меня́ боли́т голова́. И го́рло то́же боли́т.", "У меня́ боли́т голова́, го́рло то́же боли́т.", "У меня́ боля́т голова́ и го́рло."]
        rubric: ["用 [у меня́ боли́т]{.ru}，不用 [я]{.ru} 作主语", "身体部位用第一格"]
      - zh: 您怎么了？哪里疼？
        accept: ["Что с ва́ми? Что у вас боли́т?"]
        rubric: ["[Что с ва́ми?]{.ru}", "[Что у вас боли́т?]{.ru} 动词用单数"]
      - zh: 昨天安娜耳朵疼。
        accept: ["Вчера́ у А́нны боле́ли у́ши.", "У А́нны вчера́ боле́ли у́ши.", "Вчера́ у А́нны боле́ло у́хо.", "У А́нны вчера́ боле́ло у́хо."]
        rubric: ["[у А́нны]{.ru} 第二格", "过去时和 [у́ши]{.ru}（复数）或 [у́хо]{.ru}（中性）一致"]
      - zh: 这种药一天吃三次。
        accept: ["Принима́йте э́то лека́рство три ра́за в день.", "Э́то лека́рство на́до принима́ть три ра́за в день.", "Э́то лека́рство ну́жно принима́ть три ра́за в день.", "Принима́й э́то лека́рство три ра́за в день."]
        rubric: ["“吃药”用 [принима́ть лека́рство]{.ru}，不用 [есть]{.ru}", "[три ра́за в день]{.ru}"]

  - id: e6
    type: open
    task: 情景对话：看病。
    items:
      - prompt: 你感冒了，去诊所看病。编一段你和医生的对话：医生问哪里疼、病了多久、量体温，然后开药，告诉你怎么吃药、要注意什么。
        length: 60–100
        model: |-
          — Здра́вствуйте! Что с ва́ми?
          — Здра́вствуйте. У меня́ боли́т голова́ и го́рло.
          — Вы давно́ боле́ете?
          — С воскресе́нья.
          — Кака́я у вас температу́ра?
          — Три́дцать во́семь.
          — Откро́йте рот. Да, го́рло кра́сное. Э́то просту́да. Вот реце́пт. Принима́йте лека́рство три ра́за в день и пе́йте горя́чий чай.
          — А на заня́тия мо́жно ходи́ть?
          — Нет, нельзя́. Лежи́те до́ма. Е́сли температу́ра бу́дет высо́кая, звони́те.
          — Спаси́бо, до свида́ния.
        rubric: ["用 [у меня́ боли́т / боля́т]{.ru} 说明症状", "医生的问话：[Что с ва́ми? Что у вас боли́т? Вы давно́ боле́ете?]{.ru}", "医嘱用命令式", "对医生用 [вы]{.ru}"]
        notes: 对话按看病的顺序展开：问候、症状、病程、体温、检查、诊断、医嘱、告别。医生的建议都用命令式复数（[принима́йте, пе́йте, лежи́те]{.ru}）。[С воскресе́нья]{.ru} 用 [с]{.ru} + 第二格表示从什么时候开始。
