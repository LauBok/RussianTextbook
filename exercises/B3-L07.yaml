lesson: B3-L07
grammar: "形动词的变格与位置：主动形动词按 [хоро́ший]{.ru}、被动形动词按 [но́вый]{.ru} 变格，格只看被说明的名词；名词后的短语用逗号隔开，名词前的短语不用逗号（前置词 + 短语 + 名词）；短语要紧靠名词；[оди́н из учёных, получи́вших…]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Почему в Петербурге стоит памятник собаке? Какая книга повлияла на молодого Павлова? Чем новые методы Павлова отличались от методов других учёных? Что такое условный рефлекс? Что Павлов считал главным качеством учёного?]{.ru}"
        length: 60–90
        model: "Памятник собаке поставили по просьбе Павлова: он хотел поблагодарить животных, без которых его открытия были бы невозможны. На молодого Павлова сильно подействовала книга Ивана Сеченова «Рефлексы головного мозга». Учёные, работавшие до него, исследовали органы животного, которое уже не жило, а Павлов много месяцев наблюдал за органами живой, здоровой собаки. Условный рефлекс — это рефлекс, появившийся в результате опыта. Так, у собаки, много раз слышавшей метроном перед кормлением, слюна течёт от одного звука. Главным качеством учёного Павлов считал последовательность."
        rubric: ["五个问题都回答，内容与课文一致", "至少两处形动词短语，与名词一致", "用完整的句子"]
        notes: "第 2 题问句用的 [повлиять на кого]{.ru} 和课文的 [подействовать на кого]{.ru} 意思相同。第 4 题要用自己的话下定义，并举课文里的例子。[Так, …]{.ru} 在这里引出例子，“比如”。"

  - id: e2
    type: fill
    task: 用括号里形动词的适当形式填空。
    why: "形动词的格只看被说明的名词。第 1 题 [учёного]{.ru} 阳性第二格 → [изучавшего]{.ru}。第 2 题 [у собаки]{.ru} 阴性第二格 → [слышавшей]{.ru}，不受短语内 [звук]{.ru} 的影响。第 3 题 [молодёжи]{.ru} 阴性第三格 → [мечтающей]{.ru}。第 4 题 [учёным]{.ru} 单数第五格（[стать кем]{.ru}）→ [получившим]{.ru}。第 5 题 [одним из учёных]{.ru}：形动词说明的是复数 [учёных]{.ru}，用复数第二格 [получивших]{.ru}。第 6 题 [на идеях]{.ru} 复数第六格 → [предложенных]{.ru}。"
    items:
      - stem: Памятник поставили по просьбе учёного, всю жизнь ___ работу организма.
        hint: изучавший
        accept: ["изучавшего"]
      - stem: У собаки, ___ звук метронома, текла слюна.
        hint: слышавший
        accept: ["слышавшей"]
      - stem: Павлов написал письмо к молодёжи, ___ о науке.
        hint: мечтающий
        accept: ["мечтающей"]
      - stem: Павлов стал первым русским учёным, ___ Нобелевскую премию.
        hint: получивший
        accept: ["получившим"]
      - stem: Павлов был одним из учёных, ___ Нобелевскую премию в начале XX века.
        hint: получивший
        accept: ["получивших"]
      - stem: Многие методы психологии построены на идеях, ___ Павловым.
        hint: предложенный
        accept: ["предложенных"]

  - id: e3
    type: rewrite
    task: 把名词后面的形动词短语移到名词前面，注意去掉逗号。
    example:
      cue: Учёные, работавшие до него, исследовали другие органы.
      answer: Работавшие до него учёные исследовали другие органы.
    why: "短语移到名词前面，逗号去掉；有前置词时，前置词放在短语前面：前置词 + 形动词短语 + 名词。第 1 题 [на идеях, предложенных Павловым]{.ru} → [на предложенных Павловым идеях]{.ru}。第 2 题 [у собаки]{.ru} 的 [у]{.ru} 也移到最前面。第 3 题 [в городке]{.ru} 同理。第 4 题短语在句首，名词 [слова]{.ru} 紧跟其后。"
    items:
      - cue: Методы построены на идеях, предложенных Павловым.
        accept: ["Методы построены на предложенных Павловым идеях."]
      - cue: У собаки, слышавшей звук метронома, текла слюна.
        accept: ["У слышавшей звук метронома собаки текла слюна."]
      - cue: Сотрудники работали в городке, построенном под Ленинградом.
        accept: ["Сотрудники работали в построенном под Ленинградом городке."]
      - cue: Слова, написанные почти сто лет назад, вспоминают и сегодня.
        accept: ["Написанные почти сто лет назад слова вспоминают и сегодня."]

  - id: e4
    type: choice
    task: 选择正确的句子。
    why: "第 1 题名词前的形动词短语不用逗号，A 对；B 加了逗号，C 前置词放错了位置。第 2 题形动词短语要紧靠被说明的名词 [студенты]{.ru}，C 对；A 短语离开了名词，B 形动词误跟 [лекцию]{.ru} 一致。第 3 题名词后的短语在句子中间时，前后都要有逗号，B 对；A 漏了后一个逗号，C 漏了前一个。"
    items:
      - stem: ___
        options: ["Он работал над предложенной Сеченовым идеей.", "Он работал над, предложенной Сеченовым, идеей.", "Он работал предложенной над Сеченовым идеей."]
        answer: "Он работал над предложенной Сеченовым идеей."
      - stem: ___
        options: ["Студенты слушали лекцию, начинающие путь в науке.", "Студенты слушали лекцию, начинающую путь в науке.", "Студенты, начинающие путь в науке, слушали лекцию."]
        answer: "Студенты, начинающие путь в науке, слушали лекцию."
      - stem: ___
        options: ["Учёные, работавшие до него обычно исследовали органы.", "Учёные, работавшие до него, обычно исследовали органы.", "Учёные работавшие до него, обычно исследовали органы."]
        answer: "Учёные, работавшие до него, обычно исследовали органы."

  - id: e5
    type: translate
    task: 翻译下列句子，用形动词短语，注意形动词的格。
    items:
      - zh: 巴甫洛夫是第一位获得诺贝尔奖的俄国学者。
        accept: ["Павлов стал первым русским учёным, получившим Нобелевскую премию.", "Павлов был первым русским учёным, получившим Нобелевскую премию.", "Павлов — первый русский учёный, получивший Нобелевскую премию."]
        rubric: ["形动词与 [учёным]{.ru}（第五格）或 [учёный]{.ru}（第一格）一致", "[получить премию]{.ru}"]
      - zh: 他给向往科学的青年写了一封信。
        accept: ["Он написал письмо к молодёжи, мечтающей о науке.", "Он написал письмо молодёжи, мечтающей о науке.", "Он написал письмо к молодёжи, которая мечтает о науке.", "Он написал письмо молодёжи, которая мечтает о науке."]
        rubric: ["[мечтающей]{.ru}：阴性单数第三格，与集合名词 [молодёжи]{.ru} 一致", "[мечтать о чём]{.ru}"]
      - zh: 我们读了一本关于在梁赞出生的那位学者的书。
        accept: ["Мы прочитали книгу об учёном, родившемся в Рязани.", "Мы читали книгу об учёном, родившемся в Рязани.", "Мы прочитали книгу о родившемся в Рязани учёном.", "Мы прочитали книгу об учёном, который родился в Рязани."]
        rubric: ["[об учёном]{.ru}：[о]{.ru} 在元音前变 [об]{.ru}", "[родившемся]{.ru}：阳性第六格，[-ся]{.ru} 保留"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：狗的纪念碑；出身和学业；消化研究和诺贝尔奖；条件反射；晚年和给青年的信。每项一到两句，保留关键年份，至少用三处不同格的形动词。
        length: 120–150
        model: "В Петербурге стоит памятник собаке, поставленный по просьбе Ивана Павлова. Павлов родился в 1849 году в семье священника и учился в семинарии, но увлёкся естественными науками и в 1870 году поступил в Петербургский университет. Сначала он изучал пищеварение. Учёные, работавшие до него, исследовали органы животного, которое уже не жило, а он наблюдал за органами живой собаки. В 1904 году он стал первым русским учёным, получившим Нобелевскую премию. Потом Павлов открыл условные рефлексы. У собаки, много раз слышавшей метроном перед кормлением, слюна начинала течь от одного звука. Так он показал, как работает мозг. Сегодня на его идеях построены многие методы психологии и медицины. Павлов работал до последних дней и умер в 1936 году. Незадолго до смерти он написал письмо к молодёжи, мечтающей о науке, и назвал главным качеством учёного последовательность."
        rubric: ["提纲五项都有，顺序与课文一致", "年份准确：1849、1870、1904、1936", "至少三处不同格的形动词，与被说明的名词一致", "120–150 词"]
        notes: "范文约 125 词。形动词用了四个格：[поставленный]{.ru}（第一格）、[работавшие]{.ru}（第一格复数）、[получившим]{.ru}（第五格）、[слышавшей]{.ru}（第二格）、[мечтающей]{.ru}（第三格）。用 [а]{.ru} 连接两个分句，概括了“别人怎样做，他怎样做”的对比。"
