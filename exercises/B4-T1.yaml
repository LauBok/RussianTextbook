  points: 25
  items:
  - prompt: 以 [Смешное и грустное в рассказах Чехова]{.ru} 为题，至少分析契诃夫的两篇小说（[«Толстый и тонкий»]{.ru}、[«Смерть чиновника»]{.ru}、[«Выигрышный билет»]{.ru}），说明契诃夫怎样在可笑的故事里写出令人难过的东西。要有明确的观点，每个论点都举出作品里的细节，最后写出你自己的看法。
    length: 250–300
    model: |-
      Ранние рассказы Чехова обычно называют смешными. Читая их, мы смеёмся, но после последней строки нам становится грустно. Почему так происходит?

      В рассказе «Толстый и тонкий» встречаются два старых друга. Сначала они радуются, целуются, вспоминают детство. Но как только тонкий узнаёт, что друг стал тайным советником, он вдруг съёживается, говорит «ваше превосходительство» и смеётся тонким смехом. Это смешно. Но страшно то, что никто его не заставлял: чинопочитание стало его привычкой.

      В «Смерти чиновника» Червяков чихает в театре на лысину генерала. Сама история похожа на анекдот: он извиняется снова и снова, генерал сердится всё больше. Однако кончается рассказ смертью героя. Маленький человек так боится начальника, что умирает от страха.

      В «Выигрышном билете» нет ни генералов, ни чиновников. Муж и жена всего лишь мечтают о деньгах, которых у них нет. Смешно смотреть, как они уже делят выигрыш. Но за несколько минут мечта показывает, что они не любят друг друга, и после этого вечера их жизнь кажется им ещё беднее.

      Чехов не объясняет, что хорошо и что плохо. Он просто показывает поступки героев, а выводы делает читатель. Мне кажется, в этом и есть его сила: смех у Чехова не делает людей злее, а заставляет задуматься, нет ли в нас самих чего-то от тонкого, от Червякова, от Ивана Дмитрича. Поэтому эти короткие рассказы и сегодня читаются как истории о нас.
    rubric:
    - 内容与论证 10 分：开头提出观点（2 分）；至少分析两篇作品，每篇既说出可笑之处，也说出可悲之处，并举出原文细节（各 3 分）；结尾写出自己的看法（2 分）
    - 文学分析 5 分：能用上本册学过的分析方法（称呼的变化、重复、动词体、人物的语言、作者不直接评价等）
    - 语言 6 分：语法正确、用词准确，能用上本册的词语；每两处语法错误扣 1 分
    - 结构 4 分：分段清楚，段落之间有过渡（[Однако, Но, Поэтому]{.ru} 等），开头和结尾呼应
    - 字数少于 220 词的，内容与论证最多给 6 分
    notes: 范文约 270 词，分五段：设问引出论题；三篇作品各一段，每段都先写“可笑”，再用 [Но, Однако]{.ru} 转到“可悲”；最后一段总结契诃夫的写法并给出个人看法，用 [Мне кажется]{.ru} 引出，结尾回到开头的问题。分析时用到了第 1 课的称呼变化（[ваше превосходительство]{.ru}）、第 2 课的重复（一次又一次的道歉）和本测试选文的结局。评论不是复述，情节只写到能支持论点为止。
