    - Читать вслух, соблюдая ритм, и учить стихи наизусть.
    - Не учить ничего наизусть.
    answer: Читать вслух, соблюдая ритм, и учить стихи наизусть.
  passage_zh: |
    **为什么诗容易记住**

    在学校里背过诗的人都知道：背一首诗比背一页散文容易。过了许多年，我们可能已经忘了某篇小说写的是什么，可“我记得那美妙的瞬间……”这几行诗还能背得出来。为什么会这样？

    第一个原因是节奏。诗里的重读音节和非重读音节按一定的规则一个接一个地出现。读了两三行，我们就知道下一个重音在哪里，大脑也就更容易记住词句：每个词都站在自己的位置上。如果把一个词换成另一个词，节奏就被打破了，我们马上就能感觉到错误。

    第二个原因是韵。韵把诗行彼此连在一起，提示下一行会怎样结尾。学者们不止一次注意到，忘了一首诗中间部分的人，往往还清楚地记得行末的词。

    最后，诗通常能唤起强烈的感情，而使我们激动的东西，记忆会保存得更久。

    这一切，人们早在有学者之前就知道了。那时还没有文字，各民族把自己的历史和法律用歌和诗的形式一代一代传下去。这样更容易保存。

    所以，如果你需要背点什么，试试有表情地、按着节奏大声读出来。更好的办法是背几首诗：这是对记忆很好的锻炼。
- id: e4
  type: choice
  task: 文体与修辞辨析：读下列句子，选出对其中语言手段的正确分析。
  points: 2
  why: 第 1 题：《胖子和瘦子》里一连串带前缀的完成体动词 [съёжился, сгорбился, сузился]{.ru} 写的是身体“缩小”，作者不直接评价，让人物在上司面前变小（第 1 课）。第 2 题：《跳水》最危险的一刻只用三个完成体动词，没有修饰，动作一个紧接一个，造成紧张感（第 3 课）。第 3 题：《白夜》的主人公直接称呼读者，好像在和读者谈话，这是内心独白的对话性（第 20 课）；不是作者的注释，也不是人物之间的对话。第 4 题：《致凯恩》最后一节重复第一节的诗句，结尾回到开头，叫环形结构（第 9 课）；头韵是辅音的重复，夸张是言过其实，虚重是格律重音位置上不重读。第 5 题：《中奖彩票》结尾，希望和憎恨消失以后，屋子、晚饭、夜晚都变了样：外部世界随人物的心情而变，作者借环境写心理，不直接说人物多么失望。
  items:
