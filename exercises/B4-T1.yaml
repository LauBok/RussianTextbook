    **上个世纪的信**

    市中心图书馆开了一个不寻常的展览——“上个世纪的信”。展览上可以看到两百多封信，都是市民在自己家里找到的：在旧书里，在柜子里，在奶奶的盒子里。

    办这个展览的想法是一年前产生的，当时图书馆请市民把旧信和明信片拿来。“我们原以为能收到几十封，结果收到了一千多封，”图书馆馆长说，“人们拿来的有前线来信，有部队里、医院里、别的国家寄来的信。很多人讲起自己的亲人时都哭了。”

    展览选出了二百三十封信，写于 1914 年到 1990 年之间。最早的一件是一个士兵 1915 年寄给妻子的明信片。最不寻常的是一封走了四十年才到收信人手里的信：它是在拆邮局旧楼时从柜子后面找到的。

    每封信旁边都附有一段关于写信人的简短介绍。许多故事是靠中学生才弄清楚的：他们找老人谈话，到档案馆查文件。

    展览开到年底，免费参观。据组织者说，市民今后还可以把信送到图书馆来：他们打算用这些信编一本书。
