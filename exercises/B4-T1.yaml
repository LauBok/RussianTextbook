  passage_zh: |
    **白菜汤**

    一个农家寡妇的独生子死了，他二十岁，是村里头一号的好劳力。

    就是这个村子的女地主听说了农妇的不幸，在出殡那天亲自去看望她。

    她在家里找到了农妇。

    农妇站在屋子中间，站在桌子前面，不慌不忙，用右手均匀地一下一下（左手像鞭子一样垂着）从熏黑的瓦罐底里舀着清汤寡水的白菜汤，一勺接一勺地往下咽。

    农妇的脸消瘦了，发黑了；眼睛又红又肿……可她身子挺得笔直，一本正经，就像在教堂里一样。

    “天哪！”女地主想，“她在这种时候还吃得下……她们这些人的感情可真粗糙！”

    女地主这时想起，几年前她失去九个月大的女儿时，伤心得连彼得堡郊外一座漂亮的别墅都没有租，在城里过了一整个夏天！

    农妇还在一口一口地喝汤。

    女地主终于忍不住了。

    “塔季扬娜！”她说，“我的天！我真奇怪！难道你不爱你的儿子吗？你怎么还有胃口？你怎么还能喝这汤！”

    “我的瓦夏死了，”农妇轻声说，憋了很久的眼泪又顺着她凹陷的脸颊流了下来，“我也就算是完了：活生生地把我的头砍掉了。可汤不能糟蹋呀：里面放了盐的。”

    女地主只是耸了耸肩膀，就走了出去。盐，在她来说，是很便宜的。
