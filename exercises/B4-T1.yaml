    ::: {.prose lang="ru"}
    **Почему стихи легко запомнить**

    Каждый, кто учил стихи в школе, знает: стихотворение запомнить легче, чем страницу прозы. Через много лет мы можем забыть, о чём был рассказ, но строки «Я помню чудное мгновенье…» помним наизусть. Почему так происходит?

    Первая причина — ритм. В стихах ударные и безударные слоги идут друг за другом по определённому правилу. Прочитав две-три строки, мы уже знаем, где будет следующее ударение, и мозгу легче запомнить слова: каждое из них стоит на своём месте. Если заменить одно слово другим, ритм ломается, и мы сразу чувствуем ошибку.

    Вторая причина — рифма. Она связывает строки друг с другом и подсказывает, каким будет конец следующей строки. Учёные не раз замечали, что люди, забывшие середину стихотворения, хорошо помнят слова в конце строк.

    Наконец, стихи обычно вызывают сильные чувства, а то, что нас волнует, память хранит дольше.

    Всё это люди знали задолго до учёных. Когда письменности ещё не было, народы передавали свою историю и законы из поколения в поколение в форме песен и стихов. Так их было легче сохранить.

    Поэтому, если вам нужно что-то выучить, попробуйте прочитать это вслух, с выражением, соблюдая ритм. А ещё лучше — выучите несколько стихотворений: это хорошая тренировка для памяти.

    :::
  why: 第 1 题，第 1 段：全文回答的是“为什么诗比散文容易记住”。第 2 题，第 2 段：读了两三行，就知道下一个重音在哪里，每个词都在自己的位置上，所以好记；换一个词，节奏就被打破。第 3 题，第 3 段：韵把诗行连在一起，提示下一行的结尾；忘了中间部分的人还记得行末的词。第 4 题，第 5 段：没有文字的时候，人们用歌和诗的形式代代相传，这样更容易保存。第 5 题，最后一段：作者建议有节奏地大声朗读，最好背几首诗来锻炼记忆；他没有说散文没用，也没有说要少读。
