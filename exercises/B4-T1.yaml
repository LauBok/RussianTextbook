    **Письма из прошлого века**

    В центральной библиотеке города открылась необычная выставка — «Письма из прошлого века». На ней можно увидеть больше двухсот писем, которые жители города нашли у себя дома: в старых книгах, в шкафах, в бабушкиных коробках.

    Идея выставки появилась год назад, когда библиотека попросила горожан принести старые письма и открытки. «Мы ждали несколько десятков писем, а получили больше тысячи, — рассказала директор библиотеки. — Люди приносили письма с фронта, из армии, из больниц, из других стран. Многие плакали, когда рассказывали о своих родных».

    Для выставки отобрали двести тридцать писем, написанных с 1914 по 1990 год. Самое старое — открытка, которую солдат послал жене в 1915 году. Самое необычное — письмо, которое шло к адресату сорок лет: его нашли за шкафом, когда разбирали старое здание почты.

    Рядом с каждым письмом — короткий рассказ о его авторе. Многие истории удалось восстановить благодаря школьникам: они беседовали со стариками и искали документы в архивах.

    Выставка будет работать до конца года, вход свободный. По словам организаторов, жители могут и дальше приносить письма в библиотеку: из них хотят составить книгу.

    :::
  why: 第 1 题，第 1 段：展出的是市民在自己家里找到的两百多封信；第 3 段说明最后选了二百三十封。第 2 题，第 2 段：图书馆请市民把旧信和明信片拿来，原来只指望几十封，结果收到一千多封。第 3 题，第 3 段：最早的一件是 1915 年一个士兵寄给妻子的明信片；在邮局旧楼里找到的是“走了四十年”的那封信。第 4 题，第 4 段：许多故事是靠中学生找老人谈话、查档案才弄清楚的。第 5 题，最后一段：市民还可以继续把信送到图书馆，组织者打算用它们编一本书；展览开到年底，免费参观。
