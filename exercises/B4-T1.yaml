lesson: B4-T1
heading: 期中测试
intro: 满分 150 分，建议用时 150 分钟。考查范围：第四册第 1–24 课。原著选文里的生僻词见卷末注释；格律分析、翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 文学与文化常识：选出正确答案。
  points: 1
  why: 第 1 题：契诃夫在莫斯科大学学的是医学，后来当了医生（第 1、22 课简介）。第 2 题：《跳水》是托尔斯泰为《识字课本》《俄语读本》写的小故事，读者是农民的孩子（第 3 课）。第 3 题：《石榴石手镯》的作者是库普林（第 4 课）；柯罗连科写《盲音乐家》，格林写《红帆》，冈察洛夫写《奥勃洛莫夫》。第 4 题：格林的故事大多发生在一个虚构的海滨国度，评论家称之为“格林国”（第 6 课）。第 5 题：《致凯恩》是写给安娜·凯恩的，诗题只写 [К ***]{.ru}（第 9 课）。第 6 题：《帆》写于 1832 年，诗人 17 岁；26 岁是莱蒙托夫去世时的年龄（第 10 课）。第 7 题：丘特切夫大半生是外交官，在德国和意大利住了二十多年（第 11 课）。第 8 题：马雅可夫斯基 1912 年起参加未来派诗人的活动（第 13 课）。第 9 题：托尔斯泰的第一部作品就叫《童年》，是自传体三部曲的第一部；高尔基的《童年》也是三部曲的第一部（第 17、18 课）。第 10 题：[обломовщина]{.ru} 来自冈察洛夫的小说，指懒散、空想、无所作为的生活（第 19 课）。
  items:
  - stem: Чехов окончил ___ факультет Московского университета.
    options:
    - исторический
    - медицинский
    - филологический
    - экономический
    answer: медицинский
  - stem: Рассказ «Прыжок» Толстой написал ___.
    options:
    - для журнала, который издавал Некрасов
    - как главу романа «Война и мир»
    - в письме к брату
    - для книг, по которым крестьянские дети учились читать
    answer: для книг, по которым крестьянские дети учились читать
  - stem: «Гранатовый браслет» написал ___.
    options:
    - А. И. Куприн
    - В. Г. Короленко
    - А. С. Грин
    - И. А. Гончаров
    answer: А. И. Куприн
  - stem: Действие многих произведений А. С. Грина происходит ___.
    options:
    - в Москве
    - в Сибири
    - в выдуманной стране у моря
    - в Петербурге
    answer: в выдуманной стране у моря
  - stem: Стихотворение «Я помню чудное мгновенье…» Пушкин посвятил ___.
    options:
    - Анне Керн
    - своей жене
    - своей няне
    - своей сестре
    answer: Анне Керн
  - stem: Когда Лермонтов написал «Парус», ему было ___.
    options:
    - двадцать шесть лет
    - тридцать лет
    - семнадцать лет
    - двадцать два года
    answer: семнадцать лет
  - stem: Больше двадцати лет Ф. И. Тютчев ___.
    options:
    - работал врачом в Москве
    - служил в Германии и Италии
    - преподавал в университете
    - жил в Сибири
    answer: служил в Германии и Италии
  - stem: В молодости Маяковский участвовал в ___.
    options:
    - журнале Некрасова
    - войне 1812 года
    - работе Художественного театра
    - группе поэтов, которые хотели создать совсем новый язык поэзии
    answer: группе поэтов, которые хотели создать совсем новый язык поэзии
  - stem: Повесть «Детство» есть не только у Горького. Первым произведением под этим названием начал свой путь в литературе ___.
    options:
    - Ф. М. Достоевский
    - Л. Н. Толстой
    - И. А. Гончаров
    - А. И. Герцен
    answer: Л. Н. Толстой
  - stem: От фамилии героя Гончарова в русском языке появилось новое слово. Оно означает ___.
    options:
    - ленивой жизни без дела и цели
    - любви к путешествиям
    - жизни в большом городе
    - военной службы
    answer: ленивой жизни без дела и цели
- id: e2
  type: choice
  task: 词汇：第 1–9 题选出与所给词意思相同的解释，第 10–15 题选出填入空格最恰当的词。
  points: 1
  why: 第 1 题：[ошеломить]{.ru} 是使人惊呆、不知所措（第 1 课）。第 2 题：[нечаянно]{.ru} 无意地，与 [нарочно]{.ru}“故意”相对（第 2 课）。第 3 题：[тщеславие]{.ru} 虚荣心，想得到名声和夸奖（第 6 课）。第 4 题：[чинопочитание]{.ru} 对官阶的盲目崇拜（第 1 课）。第 5 题：[глушь]{.ru} 偏僻、安静的地方，穷乡僻壤（第 9 课）。第 6 题：[чересчур]{.ru} 过于、太（第 19 课）。第 7 题：[мимолётный]{.ru} 转瞬即逝的（第 9 课）。第 8 题：[хандра]{.ru} 忧郁、烦闷（第 20 课）。第 9 题：[безукоризненно]{.ru} 无可指摘地、完美地（第 13 课）。第 10 题：[настать]{.ru}“（时刻、季节）到来”（第 9 课）；[стать]{.ru} 在这里要带表语，[встать, достать]{.ru} 意思不对。第 11 题：固定搭配 [произвести впечатление на кого]{.ru}“给……留下印象”；[сделать, дать, создать]{.ru} 不和 [впечатление на]{.ru} 搭配（第 4 课）。第 12 题：[придавать значение чему]{.ru}“重视”，是固定搭配（第 6 课）。第 13 题：“自杀”是 [покончить жизнь самоубийством]{.ru}（第 4 课）；[кончить, закончить, окончить]{.ru} 都不能这样用。第 14 题：[обходиться без чего]{.ru}“没有……也行，将就”（第 7 课）；[обходить]{.ru} 是“绕过”，[проходить, уходить]{.ru} 和 [без машины]{.ru} 连用说不通。第 15 题：[прислушиваться к]{.ru}“侧耳细听”（第 5 课）；[слушать, слышать]{.ru} 直接接第四格，[подслушивать]{.ru} 是“偷听”。
  items:
  - stem: «Ошеломить» значит ___.
    options:
    - смутить так, что человек не знает, что сказать
    - громко позвать
