- id: e5
  type: open
  task: 诗歌格律分析：划分下面这首诗每一行的音步，用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，注明虚重在第几音步；最后写出格律名称（几音步什么格）和韵式。
  points: 10
  passage: |
    ::: {.poem lang="ru"}
    [А. А. Фет]{.author}

    | Чу́дная карти́на,
    | Как ты мне родна́:
    | Бе́лая равни́на,
    | По́лная луна́.
    | Свет небе́с высо́ких,
    | И блестя́щий снег,
    | И сане́й далёких
    | Одино́кий бег.

    [1842]{.year}
    :::
  items:
  - prompt: 划分写在下面横线上。
    length: 10–14
    lines: 10
    model: |-
      1: — ∪ / ∪ ∪ / — ∪ (пиррихий во второй стопе)

      2: — ∪ / — ∪ / — (пиррихия нет)

      3: — ∪ / ∪ ∪ / — ∪ (пиррихий во второй стопе)

      4: — ∪ / ∪ ∪ / — (пиррихий во второй стопе)

      5: — ∪ / — ∪ / — ∪ (пиррихия нет)

      6: ∪ ∪ / — ∪ / — (пиррихий в первой стопе)

      7: ∪ ∪ / — ∪ / — ∪ (пиррихий в первой стопе)

      8: ∪ ∪ / — ∪ / — (пиррихий в первой стопе)

      Хорей, в каждой строке три стопы. Рифмовка перекрёстная: AbAb CdCd; женские рифмы (картина — равнина, высоких — далёких) и мужские (родна — луна, снег — бег) идут через одну.
    rubric:
    - 八行划分各 1 分（共 8 分）：音步切分、重音和虚重全对才给分；第 2 行的 [Как]{.ru}、[мне]{.ru} 落在强位置上，标作重读或虚重都算对
    - 格律名称 1 分：三音步扬抑格（写成“扬抑格”而没有数出三音步的不给分）
    - 韵式 1 分：交叉韵 AbAb CdCd，指出阴性韵和阳性韵交替
    notes: "音节划分：1 [чу́д-на / я-кар / ти́-на]{.ru .syl}；2 [как-ты / мне-род / на́]{.ru .syl}；3 [бе́-ла / я-рав / ни́-на]{.ru .syl}；4 [по́л-на / я-лу / на́]{.ru .syl}；5 [свет-не / бе́с-вы / со́-ких]{.ru .syl}；6 [и-бле / стя́-щий / снег]{.ru .syl}；7 [и-са / не́й-да / лё-ких]{.ru .syl}；8 [о-ди / но́-кий / бег]{.ru .syl}。判断方法（第 11、12、16 课）：先看多音节词，[чу́дная]{.ru} 重音在第 1 音节，[карти́на]{.ru} 在第 5 音节，[небе́с]{.ru} 在第 3，[высо́ких]{.ru} 在第 5，都是奇数音节，所以是扬抑格；行末最后一个重音在第 5 音节，是第 3 个格律重音位置，所以是三音步。单数行多一个轻音节，是阴性结尾；双数行以重音结尾，是阳性结尾，最后一个音步不完整。单音节词 [Свет]{.ru}（第 5 行第 1 音节）在强位置上，按重读计；第 6、7 行开头的 [И]{.ru} 是连接词，不重读，第 1 音步虚重。这首诗和第 12 课的《白桦》同为三音步扬抑格；前四行是名词性的描写（[равнина, луна]{.ru}），最后一个画面 [Одинокий бег]{.ru} 让静止的冬夜里出现了一点运动和孤独。"
- id: e6
  type: open
  task: 俄译汉：把下面这段文字（柯罗连科《星火》，1900 年）译成汉语。
  points: 15
  passage: |
    ::: {.prose lang="ru"}
    Свойство этих ночных огней — приближаться, побеждая тьму, и сверкать, и обещать, и манить своею близостью. Кажется, вот-вот ещё два-три удара веслом, — и путь кончен… А между тем — далеко!..

    И долго ещё мы плыли по тёмной, как чернила, реке. Ущелья и скалы выплывали, надвигались и уплывали, оставаясь назади и теряясь, казалось, в бесконечной дали, а огонёк всё стоял впереди, переливаясь и маня, — всё так же близко, и всё так же далеко…

    Мне часто вспоминается теперь и эта тёмная река, затенённая скалистыми горами, и этот живой огонёк. Много огней и раньше и после манили не одного меня своею близостью. Но жизнь течёт всё в тех же угрюмых берегах, а огни ещё далеко. И опять приходится налегать на весла…

    Но всё-таки… всё-таки впереди — огни!..

    :::
  items:
  - prompt: 译文写在下面横线上。
    length: 250–320
    lines: 12
    model: |-
      这些夜间的灯火有一种特性：它们会渐渐逼近，战胜黑暗，闪闪发光，向你许诺，用它们的近在咫尺引诱你。似乎眼看着再划两三桨——路就走完了……可实际上——还远着呢！……

      我们在墨水般漆黑的河上又划了很久。峡谷和山崖一个个浮现出来，迎面逼近，又漂向身后，留在后面，仿佛消失在无尽的远方，而那点灯火却一直停在前方，闪烁着，引诱着——还是那样近，还是那样远……

      如今我常常想起那条黑沉沉的河，河上笼罩着山崖的阴影，还有那点活生生的灯火。从前和后来，有许多灯火都曾用它们的近在眼前引诱过人，引诱过的不止我一个。可是生活依旧在那阴郁的两岸之间流淌，灯火还很远。还得继续用力划桨……

      可是，不管怎样……不管怎样，前方——有灯火！……
    rubric:
    - 准确 9 分：四段的意思都译出、没有漏译误译（每处漏译误译扣 1 分）。重点：第 1 段 [Свойство этих ночных огней — приближаться…]{.ru} 是“这些灯火的特性就是……”，四个不定式要译成并列的动作；[манить своею близостью]{.ru} 不能逐词译成“用自己的接近招引”；第 2 段 [выплывали, надвигались и уплывали]{.ru} 是船上的人看到的山崖“浮现—逼近—远去”；第 3 段 [не одного меня]{.ru} 是“不止我一个人”；[налегать на вёсла]{.ru} 的本义（使劲划桨）和比喻义（继续努力）都要保留
    - 表达 4 分：句子通顺，符合汉语习惯；长句拆分得当
    - 风格 2 分：保留原文的重复（[всё так же близко, и всё так же далеко]{.ru}；[всё-таки… всё-таки]{.ru}）、省略号和破折号造成的停顿，译出抒情的语调
    notes: 这篇散文只有三百来词，从一次真实的夜航写起，最后两段转向人生：灯火是希望和理想，“还远”是现实，结尾的 [Но всё-таки… всё-таки впереди — огни!..]{.ru} 是全文的落点。翻译时要注意三点：一、动词的节奏，第 1 段的 [приближаться, побеждая тьму, и сверкать, и обещать, и манить]{.ru} 一连串，汉语可用短句排开；二、重复不能省，[близко… далеко]{.ru} 在全文出现了好几次，是全文的骨架；三、比喻要前后一致，[огни]{.ru} 从第 1 段起就译“灯火”，最后一句也用“灯火”，读者才能感到从实到虚的转变。[тёмной, как чернила]{.ru} 译“墨水般漆黑”比“像墨水一样黑”更紧凑。
