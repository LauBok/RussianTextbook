    answer: прислушивался
- id: e3a
  type: choice
  task: 阅读理解（一）：阅读下面的短篇小说节选（契诃夫《中奖彩票》，1887 年，有删节），根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose .long lang="ru"}
    **Выигрышный билет**

    Иван Дмитрич, человек средний, проживающий с семьёй тысячу двести рублей в год и очень довольный своей судьбой, как-то после ужина сел на диван и стал читать газету.

    — Забыла я сегодня в газету поглядеть, — сказала его жена, убирая со стола. — Посмотри, нет ли там таблицы тиражей?

    — Да, есть, — ответил Иван Дмитрич. — А разве твой билет не пропал в залоге?

    — Нет, я во вторник носила проценты.

    — Какой номер?

    — Серия 9 499, билет 26.

    — Так-с... Посмотрим-с... 9 499 и 26.

    Иван Дмитрич не верил в лотерейное счастие и в другое время ни за что не стал бы глядеть в таблицу тиражей, но теперь от нечего делать и — благо, газета была перед глазами — он провёл пальцем сверху вниз по номерам серий. И тотчас же, точно в насмешку над его неверием, не дальше как во второй строке сверху резко бросилась в глаза цифра 9 499! Не поглядев, какой номер билета, не проверяя себя, он быстро опустил газету на колени и, как будто кто плеснул ему на живот холодной водой, почувствовал под ложечкой приятный холодок: и щекотно, и страшно, и сладко!

    — Маша, 9 499 есть! — сказал он глухо.

    Жена поглядела на его удивлённое, испуганное лицо и поняла, что он не шутит.

    — 9 499? — спросила она, бледнея и опуская на стол сложенную скатерть.

    — Да, да... Серьёзно есть!

    — А номер билета?

    — Ах, да! Ещё номер билета. Впрочем, постой... погоди. Нет, каково? Всё-таки номер нашей серии есть! Всё-таки, понимаешь...

    Иван Дмитрич, глядя на жену, улыбался широко и бессмысленно, как ребёнок, которому показывают блестящую вещь. Жена тоже улыбалась: ей, как и ему, приятно было, что он назвал только серию и не спешит узнать номер счастливого билета. Томить и дразнить себя надеждой на возможное счастие — это так сладко, жутко!

    <…>

    — Ну, теперь взгляни.

    — Постой. Ещё успеем разочароваться. Это во второй строке сверху, значит, выигрыш в 75 000. Это не деньги, а сила, капитал! И вдруг я погляжу сейчас в таблицу, а там — 26! А? Послушай, а что если мы в самом деле выиграли?

    Супруги стали смеяться и долго глядели друг на друга молча. Возможность счастья отуманила их, они не могли даже мечтать, сказать, на что им обоим нужны эти 75 000, что они купят, куда поедут. Думали они только о цифрах 9 499 и 75 000, рисовали их в своём воображении, а о самом счастье, которое было так возможно, им как-то не думалось.

    <…>

    — А что, если мы выиграли? — сказал он. — Ведь это новая жизнь, это катастрофа! Билет твой, но если бы он был моим, то я прежде всего, конечно, купил бы тысяч за 25 какую-нибудь недвижимость вроде имения; тысяч 10 на единовременные расходы: новая обстановка... путешествие, долги заплатить и прочее... Остальные 40 тысяч в банк под проценты...

    — Да, имение — это хорошо, — сказала жена, садясь и опуская на колени руки.

    <…>

    Иван Дмитрич остановился и посмотрел на жену.

    — Я, знаешь, Маша, за границу поехал бы, — сказал он.

    И он стал думать о том, что хорошо бы поехать глубокой осенью за границу, куда-нибудь в южную Францию, Италию... Индию!

    — Я тоже непременно бы за границу поехала, — сказала жена. — Ну, посмотри номер билета!

    — Постой! Погоди...

    <…>

    «А ведь она бы меня в каждой копейке усчитывала, — подумал он, взглянув на жену. — Билет-то её, а не мой! Да и зачем ей за границу ехать? Чего она там не видала? Будет в номере сидеть да меня не отпускать от себя... Знаю!»

    И он первый раз в жизни обратил внимание на то, что его жена постарела, подурнела, вся насквозь пропахла кухней, а сам он ещё молод, здоров, свеж, хоть женись во второй раз.

    <…>

    И он уже не с улыбкою, а с ненавистью глядел на жену. Она тоже взглянула на него, и тоже с ненавистью и со злобой. У неё были свои радужные мечты, свои планы, свои соображения; она отлично понимала, о чём мечтает её муж. Она знала, кто первый протянул бы лапу к её выигрышу.

    «На чужой-то счёт хорошо мечтать! — говорил её взгляд. — Нет, ты не смеешь!»

    Муж понял её взгляд; ненависть заворочалась у него в груди, и, чтобы досадить своей жене, он назло ей быстро заглянул на четвёртую страницу газеты и провозгласил с торжеством:

    — Серия 9 499, билет 46! Но не 26!

    Надежда и ненависть обе разом исчезли, и тотчас же Ивану Дмитричу и его жене стало казаться, что их комнаты темны, малы и низки, что ужин, который они съели, не насыщает, а только давит под желудком, что вечера длинны и скучны...
    :::
  why: 第 1 题：伊万·德米特里奇本来不信彩票，平时绝不会去看开奖表；这次是妻子让他看，他又正好闲着没事（[от нечего делать]{.ru}），他并不确信会中奖。第 2 题：两人都觉得只说出组号、不急着看票号很愉快，“用可能的幸福来逗弄自己”是甜蜜的；[Ещё успеем разочароваться]{.ru} 只是丈夫拖延的借口，不是真正的原因。第 3 题：丈夫说 [Билет твой]{.ru}，后来又想 [Билет-то её, а не мой!]{.ru}：彩票是妻子的。第 4 题：想到妻子也要出国，他第一次注意到妻子老了、变丑了，此后带着憎恨看她；妻子也明白丈夫在想什么，同样怀着恨意看他。第 5 题：结尾票号是 46 而不是 26，没有中奖；希望和憎恨一下子都消失了，屋子显得又暗又小，晚上漫长而无聊。
  items:
  - stem: Иван Дмитрич стал смотреть таблицу, потому что ___.
    options:
    - был уверен, что выиграл
    - жена попросила, а ему было нечего делать
    - сам купил билет накануне
    - всегда внимательно читал эту таблицу
    answer: жена попросила, а ему было нечего делать
  - stem: Супруги не спешили узнать номер билета, потому что ___.
    options:
    - боялись разочароваться
    - не могли найти нужную страницу газеты
    - им было сладко мечтать о возможном счастье
    - жена не помнила номер
    answer: им было сладко мечтать о возможном счастье
  - stem: Билет, о котором идёт речь, ___.
    options:
    - принадлежал жене
    - принадлежал Ивану Дмитричу
    - был куплен вместе
    - был давно потерян
    answer: принадлежал жене
  - stem: Когда Иван Дмитрич подумал, что жена тоже поедет за границу, ___.
    options:
    - он решил поехать вместе с детьми
    - он предложил жене купить имение
    - жена отказалась от поездки
    - он впервые увидел, что жена постарела, и стал смотреть на неё с ненавистью
    answer: он впервые увидел, что жена постарела, и стал смотреть на неё с ненавистью
  - stem: Чем кончилась история?
    options:
    - Супруги выиграли и купили имение.
    - Иван Дмитрич ушёл из дома.
    - Номер билета не совпал, и жизнь показалась им скучной.
    - Жена отдала билет мужу.
    answer: Номер билета не совпал, и жизнь показалась им скучной.
  passage_zh: |
    **中奖彩票**

    伊万·德米特里奇是个中等人家的人，全家一年靠一千二百卢布过日子，对自己的命运很满意。有一天晚饭后，他坐到沙发上，读起报纸来。

    “今天我忘了看报，”他妻子一边收拾桌子一边说，“你看看，上面有没有开奖号码表？”

    “有，”伊万·德米特里奇回答，“你那张彩票不是押在当铺里了吗？”

    “没有，星期二我去交过利息了。”

    “多少号？”

    “第 9499 组，第 26 号。”

    “好吧……我们看看……9499 组，26 号。”

    伊万·德米特里奇不相信彩票能带来好运，换了别的时候，他说什么也不会去看开奖表；可这会儿他闲着没事，报纸又正好在眼前，他就用手指从上往下顺着各组号码划过去。立刻，就像在嘲笑他的不信似的，就在上面第二行，9499 这个数字一下子跳进了他的眼睛！他没看票号是多少，也没再核对一遍，赶紧把报纸放到膝盖上，好像有人往他肚子上泼了一瓢凉水，心口窝里感到一阵舒服的凉意：又痒，又怕，又甜！

    “玛莎，9499 组有！”他声音发闷地说。

    妻子看了看他那张又惊讶又害怕的脸，明白他不是开玩笑。

    “9499 组？”她问，脸色发白，把叠好的桌布放到桌上。

    “是的，是的……真的有！”

    “那票号呢？”

    “啊，对了！还有票号。不过，等等……别急。不，你说怎么样？反正我们这一组有了！反正，你明白……”

    伊万·德米特里奇望着妻子，咧着嘴傻乎乎地笑着，像个看见了亮晶晶的东西的孩子。妻子也笑着：她和他一样，觉得他只说出了组号、不急着去看中奖的票号，是件愉快的事。拿可能到来的幸福来折磨自己、逗弄自己——这是多么甜蜜，又多么叫人心慌！

    <…>

    “喂，现在你看吧。”

    “等等。失望还来得及。这是在上面第二行，那就是说，奖金是七万五千。这不是钱，这是力量，是资本！要是我现在往表上一看，那儿正是——26！啊？你听着，要是我们真的中了呢？”

    夫妻俩笑了起来，默默地对望了很久。中奖的可能使他们晕头转向，他们甚至没法去幻想，说不出他们俩要这七万五千做什么，要买什么，要到哪儿去。他们想的只是 9499 和 75000 这两个数字，在想象中描画着它们，至于那本来很可能到手的幸福本身，他们倒不知怎么没有去想。

    <…>

    “要是我们真中了呢？”他说，“这可是新的生活，这是翻天覆地的变化！彩票是你的，可要是它是我的，那我首先当然要花两万五千左右买一处像庄园那样的不动产；一万花在一次性的开销上：新家具……旅行，还债，等等……剩下的四万存进银行吃利息……”

    “是啊，庄园是好东西，”妻子说着坐了下来，把两只手放在膝盖上。

    <…>

    伊万·德米特里奇站住，看了看妻子。

    “你知道吗，玛莎，我要出国去，”他说。

    于是他想到，要是深秋时节出国去，到法国南部、意大利……印度去，那该多好！

    “我也一定要出国，”妻子说，“好了，你快看票号吧！”

    “等等！别急……”

    <…>

    “她肯定会在每个戈比上都跟我算账，”他瞥了妻子一眼，想道，“彩票还是她的，不是我的！再说她出国去干什么？那儿有什么她没见过的？她只会坐在旅馆房间里，不放我离开她身边……我知道！”

    他平生第一次注意到，他的妻子老了，变丑了，浑身上下都是厨房的气味，而他自己还年轻、健康、精神饱满，就是再娶一次也行。

    <…>

    他已经不是带着笑，而是带着憎恨看着妻子了。她也看了他一眼，同样带着憎恨和恼怒。她有她自己美好的幻想、自己的计划、自己的打算；她非常清楚她的丈夫在想些什么。她知道，谁会第一个把爪子伸向她的奖金。

    “拿别人的钱做梦倒是不错！”她的目光说，“不，你休想！”

    丈夫明白了她的目光；憎恨在他胸中翻腾起来，为了气气妻子，他故意飞快地朝报纸第四版看了一眼，得意洋洋地宣布：

    “9499 组，46 号！不是 26 号！”

    希望和憎恨一下子都消失了。伊万·德米特里奇和他的妻子立刻觉得，他们的屋子又暗、又小、又矮，他们吃过的晚饭不顶饱，只是压在胃里，晚上又长又无聊……
