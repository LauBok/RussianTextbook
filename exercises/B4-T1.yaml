- id: e8
  type: open
  task: 概要写作：用俄语把阅读理解（一）的选文压缩成 150 词左右的概要。按原文顺序，用第三人称转述，不用直接引语，不加自己的评价。
  points: 15
  items:
  - prompt: '[Напишите краткий пересказ отрывка из рассказа А. П. Чехова «Выигрышный билет».]{.ru}'
    length: 130–170
    model: |-
      Однажды вечером Иван Дмитрич, человек средний и довольный своей жизнью, читал газету. Жена попросила его посмотреть таблицу тиражей. Он увидел, что серия их билета есть в таблице, но номер билета смотреть не стал: обоим было приятно мечтать о возможном счастье. Выигрыш мог быть большим — 75 000 рублей.

      Иван Дмитрич начал думать, что купил бы на эти деньги имение, заплатил бы долги, поехал бы за границу. Жена тоже хотела поехать за границу. Но билет был её, и Иван Дмитрич вдруг подумал, что жена будет жалеть каждую копейку и только мешать ему. Он впервые заметил, что она постарела, и посмотрел на неё с ненавистью. Жена поняла его мысли и тоже ответила ему злым взглядом.

      Тогда, чтобы досадить жене, он посмотрел номер билета. Оказалось, что они не выиграли. Надежда и ненависть исчезли, и жизнь показалась обоим скучной и бедной.
    rubric:
    - 内容 7 分：开头（读报、组号对上了、不急着看票号）2 分；幻想和花钱的计划 1 分；转折（彩票是妻子的，丈夫开始憎恨妻子，妻子也一样）2 分；结局（没中奖，希望和憎恨都消失，生活显得乏味）2 分
    - 压缩与转述 4 分：按原文顺序，第三人称，不用直接引语，不加评价；删去细节描写
    - 语言 4 分：语法正确，用连接词把句子串起来；每两处语法错误扣 1 分
    - 字数不足 110 或超过 200 词的，总分最多给 9 分
    notes: 范文约 150 词，分三段：开头、幻想与转折、结局。压缩的办法：第 1—7 段的对话合成一句（[Жена попросила его посмотреть таблицу]{.ru}）；表示心情的大段描写（凉意、“又痒又怕又甜”）全部删去，只留“两人都愿意先幻想”这一要点；丈夫的独白改成间接引语和概括（[подумал, что жена будет жалеть каждую копейку]{.ru}）；妻子的目光 [На чужой-то счёт хорошо мечтать!]{.ru} 概括成“她明白他的想法，也恶狠狠地看着他”。语法上用了假定式 [купил бы, заплатил бы, поехал бы]{.ru} 转述幻想，用 [Оказалось, что…]{.ru} 引出结局。
