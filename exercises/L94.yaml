lesson: L94
grammar: "假定式：动词过去时形式 + [бы]{.ru}，性、数与主语一致，本身不表示时间；用于“本来想……可是……”（[Я бы пое́хал, но…]{.ru}）、不真实的条件（[е́сли бы …, … бы]{.ru}）和委婉的愿望（[я хоте́л бы]{.ru}）。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的动词变成假定式。
    why: "假定式 = 过去时形式 + [бы]{.ru}，所以性、数要和主语一致：[я]{.ru} 指男性用 [-л]{.ru}，指女性用 [-ла]{.ru}，[мы, вы, они́]{.ru} 用 [-ли]{.ru}。第 4 题主语是 [вре́мя]{.ru}，中性，用 [бы́ло]{.ru}。[бы]{.ru} 可以放在动词前，也可以放在动词后，两种都对。"
    items:
      - stem: Я (Ван Лэй) ___ на по́езде, но у меня́ нет вре́мени.
        hint: пое́хать
        accept: [пое́хал бы, бы пое́хал]
      - stem: А́нна ___ с на́ми, но у неё экза́мен.
        hint: пое́хать
        accept: [пое́хала бы, бы пое́хала]
      - stem: Мы ___ в Петербу́рг, но сейча́с у нас экза́мен.
        hint: пое́хать
        accept: [пое́хали бы, бы пое́хали]
      - stem: Е́сли бы у меня́ ___ вре́мя, я бы чита́л бо́льше.
        hint: быть
        accept: [бы́ло]
      - stem: Е́сли бы ты пое́хала со мной, ма́ма ___ ра́да.
        hint: быть
        accept: [была́ бы, бы была́]
      - stem: Я (Ван Лэй) ___ ма́ме письмо́, но у меня́ нет бума́ги.
        hint: написа́ть
        accept: [написа́л бы, бы написа́л]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "真实可能的条件用 [е́сли]{.ru} + 将来时，两个分句都用将来时；不符合事实的假设用 [е́сли бы]{.ru}，两个分句都用过去时形式，主句里也要有 [бы]{.ru}。最常见的错误是两种混用，比如 [е́сли бы]{.ru} 后面接 [бу́дет]{.ru}。"
    items:
      - stem: Е́сли за́втра ___ хоро́шая пого́да, мы пое́дем в парк.
        options: [бу́дет, была́ бы]
        answer: бу́дет
      - stem: Е́сли бы сейча́с бы́ло ле́то, мы ___ на да́чу.
        options: [пое́дем, пое́хали бы]
        answer: пое́хали бы
      - stem: Е́сли у меня́ бу́дет вре́мя, я ___ тебе́.
        options: [позвоню́, позвони́л бы]
        answer: позвоню́
      - stem: ___ я жил в Пеки́не, я бы ча́сто ви́дел ма́му.
        options: [Е́сли, Е́сли бы]
        answer: Е́сли бы
      - stem: Я ___ чай, пожа́луйста.
        options: [хоте́л бы, хоте́л]
        answer: хоте́л бы

  - id: e3
    type: rewrite
    task: 按例句改写：事实上做不到，说成“要是……就……”。
    placeholder: Е́сли бы …, … бы …
    example:
      cue: У меня́ нет вре́мени, поэ́тому я не е́ду на по́езде.
      answer: Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хал на по́езде.
    why: "改写时肯定和否定要对调：事实是“没有时间”，假设就是“有时间”。[нет вре́мени]{.ru} 变成 [бы́ло вре́мя]{.ru}，第二格变回第一格；[занята́]{.ru} 变成 [не была́ занята́]{.ru}，短尾形容词前要补上 [была́]{.ru}，性和主语一致。主句的动词用过去时形式，不再用现在时 [е́ду]{.ru}。"
    items:
      - cue: А́нна занята́, поэ́тому она́ не е́дет в Петербу́рг.
        accept: ["Е́сли бы А́нна не была́ занята́, она́ бы пое́хала в Петербу́рг.", "Е́сли бы А́нна не была́ занята́, она́ пое́хала бы в Петербу́рг.", "Е́сли бы А́нна была́ свобо́дна, она́ бы пое́хала в Петербу́рг.", "Е́сли бы А́нна была́ свобо́дна, она́ пое́хала бы в Петербу́рг."]
      - cue: Сейча́с зима́, поэ́тому мы не е́здим на да́чу.
        accept: ["Е́сли бы сейча́с бы́ло ле́то, мы бы е́здили на да́чу.", "Е́сли бы сейча́с бы́ло ле́то, мы е́здили бы на да́чу.", "Е́сли бы сейча́с была́ не зима́, а ле́то, мы бы е́здили на да́чу."]
      - cue: Ми́ша бо́лен, поэ́тому он не игра́ет в футбо́л.
        accept: ["Е́сли бы Ми́ша не был бо́лен, он бы игра́л в футбо́л.", "Е́сли бы Ми́ша не́ был бо́лен, он игра́л бы в футбо́л.", "Е́сли бы Ми́ша был здоро́в, он бы игра́л в футбо́л.", "Е́сли бы Ми́ша был здоро́в, он игра́л бы в футбо́л."]
      - cue: У меня́ нет биле́та, поэ́тому я не иду́ в теа́тр.
        accept: ["Е́сли бы у меня́ был биле́т, я бы пошёл в теа́тр.", "Е́сли бы у меня́ был биле́т, я пошёл бы в теа́тр."]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我倒是想去，可是没有时间。（男性说）
        accept: ["Я бы пое́хал, но у меня́ нет вре́мени.", "Я пое́хал бы, но у меня́ нет вре́мени.", "Я бы пошёл, но у меня́ нет вре́мени.", "Я пошёл бы, но у меня́ нет вре́мени."]
        rubric: ["假定式：过去时形式 + [бы]{.ru}", "[нет]{.ru} + 第二格 [вре́мени]{.ru}"]
      - zh: 要是我有时间，我一定坐火车去。（男性说）
        accept: ["Е́сли бы у меня́ бы́ло вре́мя, я бы обяза́тельно пое́хал на по́езде.", "Е́сли бы у меня́ бы́ло вре́мя, я обяза́тельно пое́хал бы на по́езде.", "Е́сли бы у меня́ бы́ло вре́мя, я бы обяза́тельно пое́хал по́ездом.", "Я бы обяза́тельно пое́хал на по́езде, е́сли бы у меня́ бы́ло вре́мя."]
        rubric: ["[е́сли бы]{.ru} + [бы́ло]{.ru}（中性，和 [вре́мя]{.ru} 一致）", "主句也要有 [бы]{.ru}", "“坐火车”用 [на по́езде]{.ru}"]
      - zh: 从莫斯科到北京的火车要走将近一个星期，飞机只飞七个小时。
        accept: ["По́езд из Москвы́ в Пеки́н идёт почти́ неде́лю, а самолёт лети́т то́лько семь часо́в.", "По́езд из Москвы́ в Пеки́н идёт почти́ неде́лю, а самолёт лети́т всего́ семь часо́в.", "По́езд из Москвы́ в Пеки́н идёт почти́ неде́лю, а самолёт лети́т семь часо́в.", "По́езд из Москвы́ в Пеки́н идёт почти́ неде́лю, а самолёт — то́лько семь часо́в.", "Из Москвы́ в Пеки́н по́езд идёт почти́ неде́лю, а самолёт лети́т то́лько семь часо́в.", "По́езд из Москвы́ в Пеки́н идёт почти́ неде́лю, а самолёт лети́т туда́ то́лько семь часо́в."]
        rubric: ["火车行驶用 [идти́]{.ru}，飞机用 [лете́ть]{.ru}", "持续时间用不带前置词的第四格 [неде́лю]{.ru}", "两个分句对比，用 [а]{.ru} 连接"]
      - zh: 我倒是很乐意坐火车去。（女性说）
        accept: ["Я бы с удово́льствием пое́хала на по́езде.", "Я с удово́льствием пое́хала бы на по́езде."]
        rubric: ["女性说话，用 [пое́хала]{.ru}", "“很乐意”用 [с удово́льствием]{.ru}"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 题目：“要是我有时间……”。写一写：假期里要是有时间、有钱，你想去哪儿、做什么；为什么现在做不到。至少用三次假定式。
        length: 50–80
        model: |
          Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хал в Сиби́рь на по́езде. Я бы смотре́л в окно́ на тайгу́, пил чай в ваго́не и чита́л ру́сские кни́ги. Пото́м я бы пое́хал на Байка́л. Говоря́т, зимо́й там о́чень краси́во. Но у меня́ нет вре́мени: в январе́ у меня́ экза́мены, а пото́м я е́ду домо́й. Мо́жет быть, ле́том я пое́ду на Байка́л с А́нной.
        rubric: ["至少三次假定式，[бы]{.ru} + 过去时形式，性、数和主语一致", "用 [е́сли бы]{.ru} 时两个分句都用过去时形式", "交代现实情况时改用直陈式（现在时或将来时）"]
        notes: 范文先用 [е́сли бы]{.ru} 提出假设，接着连用几个带 [бы]{.ru} 的句子展开“想做的事”，然后用 [но]{.ru} 转回现实，最后用将来时说出实际可行的打算。假设部分用假定式，现实部分用直陈式，两部分的对比是全文的骨架。
