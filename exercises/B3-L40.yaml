lesson: B3-L40
heading: 单元测试
intro: "答对 80% 以上进入下一单元。本测试覆盖第四单元（第 31—39 课）的全部句法：简单句的语序与实义切分、同等成分与概括词、插入语、独立形动词短语与同位语、复合句的标点、地点·程度·方式从句、关联词 [тот, кто；то, что；там, где]{.ru}、无连接词复合句、直接引语与间接引语，最后是一道历史叙述段落。没有达到的，语序题（第一题）错得多回看第 31 课；标点题（第二题）第 1、2 小题回看第 32 课，第 3、4 小题回看第 33 课，第 5、6 小题回看第 35 课，第 7、8 小题回看第 38 课；词形题（第三题）第 1、2 小题回看第 32 课，第 3—5 小题回看第 34 课，第 6—8 小题回看第 37 课；选择题（第四题）第 1、2 小题回看第 33 课，第 3—5 小题回看第 36 课，第 6 小题回看第 37 课，第 7、8 小题回看第 39 课；改写和翻译题按题后解析里注明的课回看。复习后重做。"
grammar: "实义切分（述位在句末）；同等成分与概括词的格和标点；插入语的意义和标点；独立形动词短语与同位语；并列复合句、主从复合句的标点；地点从句 [где, куда]{.ru}，程度从句 [так, такой, настолько … что]{.ru}，方式从句 [так … как]{.ru}；关联词 [тот, кто；то, что；там, где]{.ru}；无连接词复合句的冒号和破折号；直接引语、间接引语与准直接引语。"
exercises:

  - id: e1
    type: choice
    task: 第 1—3、6 题选出最恰当回答问题的句子（述位放在句末）；第 4、5 题判断句子的主语。（第 31 课）
    why: "问题问什么，什么就是述位，放在句末。第 1 题问“谁”，人名 [Пётр I]{.ru} 放最后，已知的 [Петербург]{.ru} 放在句首；[Пётр I основал Петербург]{.ru} 回答的是“彼得一世建立了什么”。第 2 题问时间，[в сентябре 1812 года]{.ru} 放最后；第一个选项把时间放在句首，回答的是“1812 年 9 月发生了什么”。第 3 题问“发生了什么”，整个事件都是新信息，句子从已知的日期开始，主语可以放在动词后面。第 6 题问地点，[в Зимнем дворце]{.ru} 放在句末。第 4、5 题的主语靠第一格和动词的一致关系判断，不靠位置：[подписал]{.ru} 是阳性单数，和 [Александр II]{.ru} 一致，[манифест]{.ru} 是第四格（与第一格同形）；[атаковали]{.ru} 是复数，主语是 [партизаны]{.ru}，[армию]{.ru} 是第四格。把句首的名词一律当作主语，是最常见的错误。"
    items:
      - stem: "— Кто основал Петербург? — ___"
        options: ["Пётр I основал Петербург.", "Петербург основал Пётр I.", "Основал Пётр I Петербург."]
        answer: "Петербург основал Пётр I."
      - stem: "— Когда Наполеон вошёл в Москву? — ___"
        options: ["В сентябре 1812 года Наполеон вошёл в Москву.", "Наполеон вошёл в Москву в сентябре 1812 года.", "В Москву вошёл Наполеон в сентябре 1812 года."]
        answer: "Наполеон вошёл в Москву в сентябре 1812 года."
      - stem: "— Что произошло 12 апреля 1961 года? — ___"
        options: ["12 апреля 1961 года в космос полетел Юрий Гагарин.", "Юрий Гагарин полетел в космос 12 апреля 1961 года.", "Полетел в космос 12 апреля 1961 года Юрий Гагарин."]
        answer: "12 апреля 1961 года в космос полетел Юрий Гагарин."
      - stem: "Манифест подписал Александр II. 主语：___"
        options: ["манифест", "Александр II"]
        answer: "Александр II"
      - stem: "Армию Наполеона постоянно атаковали партизаны. 主语：___"
        options: ["армия", "партизаны"]
        answer: "партизаны"
      - stem: "— Где заседало Временное правительство? — ___"
        options: ["Временное правительство заседало в Зимнем дворце.", "В Зимнем дворце заседало Временное правительство.", "Заседало в Зимнем дворце Временное правительство."]
        answer: "Временное правительство заседало в Зимнем дворце."

  - id: e2
    type: choice
    task: 选择空白处应当用的标点。（第 32、33、35、38 课）
    why: "第 1 题概括词 [несколько причин]{.ru} 在前，同等成分在后，用冒号（第 32 课）。第 2 题同等成分在前，概括词 [всё это]{.ru} 在后，用破折号（第 32 课）。第 3 题 [конечно]{.ru} 是插入语，插在句中两边都要加逗号，这里补的是前一个（第 33 课）。第 4 题 [наконец]{.ru} 在这里是“终于”，是句子的状语，不加逗号；只有在列举的最后一项前表示“最后”时才是插入语（第 33 课）。第 5 题 [работали … или платили]{.ru} 是同一个主语 [крестьяне]{.ru} 的两个谓语，[или]{.ru} 前不加逗号（第 35 课）。第 6 题 [который]{.ru} 从句插在主句中间，从句结束处也要加逗号，这是最容易漏的地方（第 35 课）。第 7 题后句说明前句的原因（可补 [потому что]{.ru}），用冒号；第 8 题两个分句顺序反过来，后句是结果（可补 [поэтому]{.ru}），用破折号（第 38 课）：原因在后用冒号，结果在后用破折号。"
    items:
      - stem: "Историки называют несколько причин ___ выгодное положение, политику московских князей и поддержку церкви."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "冒号"
      - stem: "Стены, башни, соборы ___ всё это построили при Иване III."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "破折号"
      - stem: "Место для нового города было ___ конечно, не самым удобным."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "逗号"
      - stem: "Война шла двадцать один год и наконец ___ закончилась победой России."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "不加标点"
      - stem: "Крестьяне работали на земле помещика ___ или платили ему деньгами и продуктами."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "不加标点"
      - stem: "Император, который вступил на престол в 1855 году ___ понимал, что реформы неизбежны."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "逗号"
      - stem: "Леонов не мог вернуться в корабль ___ скафандр раздулся."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "冒号"
      - stem: "Скафандр раздулся ___ Леонов не мог вернуться в корабль."
        options: ["冒号", "破折号", "逗号", "不加标点"]
        answer: "破折号"

  - id: e3
    type: fill
    task: 把括号里的词变成适当的形式。（第 32、34、37 课）
    why: "第 1、2 题同等成分和概括词同格（第 32 课）：[называют]{.ru} 要求第四格，所以 [поддержку]{.ru}，不能写第一格 [поддержка]{.ru}；概括词 [в трёх старых городах]{.ru} 是第六格，同等成分 [в Москве, в Твери]{.ru} 也是第六格，[в Новгороде]{.ru} 同样。第 3—5 题同位语、形动词和被说明的名词同格（第 34 课）：[армия Наполеона]{.ru} 里 [Наполеона]{.ru} 是第二格，同位语也用第二格 [императора]{.ru}；[армию]{.ru} 是第四格（主语是 [партизаны]{.ru}），形动词用阴性第四格 [страдавшую]{.ru}；[в Москву]{.ru} 是第四格，被动形动词用 [покинутую]{.ru}。常见的错误是看到形动词短语在逗号后面，就顺手写成第一格。第 6—8 题指示词的格看主句，关联词的格看从句（第 37 课）：[вывозили кого]{.ru} → [тех]{.ru}；[помогали кому]{.ru} → [тем]{.ru}；从句里 [говорить о чём]{.ru} → [о чём]{.ru}。"
    items:
      - stem: "Историки называют несколько причин: выгодное положение, политику князей и ___ церкви."
        hint: поддержка
        accept: ["поддержку"]
      - stem: "Мы были в трёх старых городах: в Москве, в Твери и в ___."
        hint: Новгород
        accept: ["Новгороде"]
      - stem: "Огромная армия Наполеона, ___ Франции, перешла реку Неман."
        hint: император
        accept: ["императора"]
      - stem: "Французскую армию, ___ от голода и холода, постоянно атаковали партизаны."
        hint: страдавший
        accept: ["страдавшую"]
      - stem: "2 сентября французы вошли в Москву, ___ большинством жителей."
        hint: покинутый
        accept: ["покинутую"]
      - stem: "По Дороге жизни из города вывозили ___, кто больше всего нуждался в помощи."
        hint: тот
        accept: ["тех"]
      - stem: "Соседи помогали ___, у кого не было сил."
        hint: тот
        accept: ["тем"]
      - stem: "Таня записывала то, о ___ не могла говорить."
        hint: что
        accept: ["чём"]

  - id: e4
    type: choice
    task: 选择正确的形式。（第 33、36、37、39 课）
    why: "第 1、2 题看消息来源（第 33 课）：没有文件证明、只是流传下来的说法用 [по преданию]{.ru}；转述别人的看法用 [по мнению кого]{.ru}，[по-моему]{.ru} 只能表示说话人自己的看法，后面也不能接第二格 [царя]{.ru}。第 3—5 题（第 36 课）：[такой]{.ru} 修饰长尾形容词，要和名词一致，[очереди]{.ru} 是复数，做谓语用第五格 [такими длинными]{.ru}；修饰副词 [быстро]{.ru} 用不变化的 [так]{.ru}，[такой быстро]{.ru} 是错的；[не так, как]{.ru} 表示方式（“不像……那样”），接 [что]{.ru} 就成了程度从句，意思不通。第 6 题 [те, кто]{.ru}：从句里 [кто мог]{.ru} 用单数，主句谓语跟 [те]{.ru} 一致，用复数 [работали]{.ru}（第 37 课）。第 7 题不带疑问词的问句转述时用 [ли]{.ru}，[ли]{.ru} 紧跟在被问的词后面，这个词放在从句开头；用 [если]{.ru} 是照搬英语 if 的错误。第 8 题间接引语里人称换成转述者的角度，[я прекращаю]{.ru} → [он прекращает]{.ru}，时态保持原话的现在时，不改成过去时（第 39 课）。"
    items:
      - stem: "Документов нет, но, ___, Пётр сам вырезал на острове два куска земли."
        options: ["по преданию", "к счастью", "наконец"]
        answer: "по преданию"
      - stem: "Для этого России, ___ царя, нужно было прежде всего море."
        options: ["по мнению", "по-моему", "кроме того"]
        answer: "по мнению"
      - stem: "Зимой 1917 года очереди за хлебом стали ___ длинными, что люди стояли в них часами."
        options: ["такими", "так", "такой"]
        answer: "такими"
      - stem: "Поддержка большевиков росла ___ быстро, что к осени они получили большинство в Советах."
        options: ["так", "такой", "такая"]
        answer: "так"
      - stem: "Всё произошло не так, ___ думало правительство."
        options: ["как", "что", "где"]
        answer: "как"
      - stem: "Те, кто мог стоять у станка, ___ на заводах."
        options: ["работали", "работал", "работала"]
        answer: "работали"
      - stem: "Люди не знали, ___ Горбачёв."
        options: ["болен ли", "ли болен", "если болен"]
        answer: "болен ли"
      - stem: "Горбачёв сказал: «Я прекращаю свою деятельность». → Горбачёв сказал, что ___ свою деятельность."
        options: ["он прекращает", "я прекращаю", "он прекращал"]
        answer: "он прекращает"

  - id: e5
    type: rewrite
    task: 按括号里的要求改写句子。
    example:
      cue: "Русская армия, которая уступала врагу в численности, отступала. (形动词短语)"
      answer: "Русская армия, уступавшая врагу в численности, отступала."
    why: "第 1 题（第 34 课）[которая продолжалась]{.ru} 是过去时、未完成体，换成主动形动词过去时 [продолжавшаяся]{.ru}，和 [битва]{.ru} 同为阴性单数第一格，[-ся]{.ru} 保留为 [-ся]{.ru}。第 2 题（第 34 课）把附加的背景“住在克里姆林宫”放进形动词短语 [живший в Кремле]{.ru}，主要事件 [ждал]{.ru} 留作谓语。第 3 题（第 32 课）[не только]{.ru} 放在第一个同等成分 [политическим]{.ru} 前面，[но и]{.ru} 放在第二个前面，两部分对称；把 [не только]{.ru} 放到动词前就不对称了。第 4 题（第 36 课）[настолько]{.ru} 放在主句里、紧挨着它修饰的 [серьёзным]{.ru}，从句用 [что]{.ru}，[очень]{.ru} 要去掉。第 5 题（第 37 课）[всех людей, которые погибли]{.ru} → [всех, кто погиб]{.ru}：[всех]{.ru} 的格由主句 [вспоминают]{.ru} 决定，[кто]{.ru} 后的动词用阳性单数。第 6 题（第 38 课）后句是 [доказал]{.ru} 的宾语，去掉 [что]{.ru} 后用冒号。第 7、8 题（第 39 课）带疑问词的问句转述时保留疑问词 [что]{.ru}；陈述句用 [что]{.ru} 连接，时态不变，仍用短尾形容词的现在时 [незаконны]{.ru}，不加 [были]{.ru}。"
    items:
      - cue: "Битва, которая продолжалась весь день, стала одной из самых кровопролитных в истории XIX века. (形动词短语)"
        accept: ["Битва, продолжавшаяся весь день, стала одной из самых кровопролитных в истории XIX века."]
      - cue: "Наполеон жил в Кремле. Он ждал, что Александр I предложит ему мир. (合成一句，用形动词短语)"
        accept: ["Наполеон, живший в Кремле, ждал, что Александр I предложит ему мир."]
      - cue: "Москва стала политическим центром Руси. Она стала и церковным центром. (合成一句，用 не только … но и)"
        accept: ["Москва стала не только политическим, но и церковным центром Руси.", "Москва стала не только политическим центром, но и церковным центром Руси.", "Москва стала не только политическим центром Руси, но и церковным."]
      - cue: "Положение было очень серьёзным. Командующие посоветовали царю отказаться от власти. (настолько … что)"
        accept: ["Положение было настолько серьёзным, что командующие посоветовали царю отказаться от власти."]
      - cue: "27 января вспоминают всех людей, которые погибли в блокаду. (всех, кто)"
        accept: ["27 января вспоминают всех, кто погиб в блокаду."]
      - cue: "Полёт Лайки доказал, что в невесомости можно жить. (去掉连接词，改成无连接词复合句)"
        accept: ["Полёт Лайки доказал: в невесомости можно жить."]
      - cue: "«Что случилось?» — спрашивали люди. (间接引语)"
        accept: ["Люди спрашивали, что случилось."]
      - cue: "Ельцин сказал: «Действия ГКЧП незаконны». (间接引语)"
        accept: ["Ельцин сказал, что действия ГКЧП незаконны."]

  - id: e6
    type: translate
    task: 翻译下列句子，注意本单元学过的句法。
    items:
      - zh: 把首都迁到彼得堡的是彼得一世。
        accept: ["Столицу в Петербург перенёс Пётр I.", "Столицу перенёс в Петербург Пётр I.", "В Петербург столицу перенёс Пётр I.", "Столицу в Петербург перенёс Пётр Первый.", "Столицу перенёс в Петербург Пётр Первый.", "В Петербург столицу перенёс Пётр Первый."]
        rubric: ["第 31 课：[Пётр I]{.ru} 是述位，放在句末；[столицу]{.ru} 作已知信息放在前面", "[перенести]{.ru} 过去时阳性 [перенёс]{.ru}，[в Петербург]{.ru} 用第四格"]
      - zh: 大家知道，1812 年的战争在俄罗斯被称为卫国战争。
        accept: ["Как известно, войну 1812 года в России называют Отечественной.", "Как известно, в России войну 1812 года называют Отечественной.", "Как известно, войну 1812 года в России называют Отечественной войной.", "Как известно, в России войну 1812 года называют Отечественной войной.", "Войну 1812 года в России, как известно, называют Отечественной.", "В России войну 1812 года, как известно, называют Отечественной."]
        rubric: ["第 33 课：插入语 [как известно]{.ru}，用逗号隔开", "不定人称句 [называют]{.ru}；[называть что чем]{.ru}：[войну]{.ru} 第四格，[Отечественной]{.ru} 第五格"]
      - zh: 新的总司令是米哈伊尔·库图佐夫，一位经验丰富的将军。
        accept: ["Новым главнокомандующим стал Михаил Кутузов, опытный генерал.", "Новым главнокомандующим стал Михаил Кутузов — опытный генерал.", "Новым главнокомандующим стал Кутузов, опытный генерал.", "Михаил Кутузов, опытный генерал, стал новым главнокомандующим.", "Кутузов, опытный генерал, стал новым главнокомандующим."]
        rubric: ["第 34 课：同位语 [опытный генерал]{.ru} 与 [Кутузов]{.ru} 同为第一格，用逗号（句末也可用破折号）隔开", "[стать кем]{.ru}：[новым главнокомандующим]{.ru} 用第五格"]
      - zh: 农民分到了土地，但必须为此付赎金。
