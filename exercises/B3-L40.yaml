  - id: e7
    type: open
    task: 叙述段落。按时间顺序叙述 1812 年战争的经过。（第四单元写作训练）
    items:
      - prompt: "按时间顺序写一段话，讲述 1812 年战争：拿破仑的大军进入俄国；俄军撤退和库图佐夫的任命；博罗季诺会战；放弃莫斯科和莫斯科大火；法军撤退和战争结束。每一层用时间状语开头。至少用上：一个独立形动词短语、一个同位语、一个表示消息来源的插入语（[по разным оценкам]{.ru}、[по словам современников]{.ru} 等）、一个无连接词复合句、一处间接引语。只陈述事实和通行的说法，不做评价。"
        length: 150–200
        model: "В июне 1812 года огромная армия Наполеона, императора Франции, перешла реку Неман и вошла на территорию России. По разным оценкам, в ней было от 450 до 600 тысяч человек. Русская армия, уступавшая врагу в численности, отступала. Отступление вызывало недовольство и в армии, и в обществе. В августе новым главнокомандующим стал Михаил Кутузов. Его назначение встретили в армии с радостью. 26 августа у села Бородино произошло сражение, продолжавшееся весь день. Обе армии потеряли десятки тысяч человек, но ни одна из сторон не добилась полной победы. После сражения Кутузов собрал генералов на совет в деревне Фили и принял решение оставить Москву без боя: он хотел сохранить армию. По словам современников, он сказал, что с потерей Москвы не потеряна Россия. 2 сентября французы вошли в город, покинутый большинством жителей, и в тот же вечер там начались пожары. Наполеон, живший в Кремле, ждал, что Александр I предложит ему мир, но ответа не было. В октябре французская армия начала отступать. Её постоянно атаковали русские войска и партизаны. В декабре остатки армии Наполеона покинули Россию."
        rubric: ["五个内容都写到，按时间顺序", "每层以时间状语开头作主位（[в июне 1812 года]{.ru}、[26 августа]{.ru}、[после сражения]{.ru}、[в октябре]{.ru}、[в декабре]{.ru}）", "独立形动词短语和同位语与被说明的名词同格，两边用逗号", "插入语用逗号隔开；无连接词复合句的冒号、破折号用对", "间接引语人称、时态正确", "叙述中立，不加评价；150–200 词"]
        notes: "范文约 165 词，分五层，每层第一句都以时间状语开头，读者一看就知道叙述走到了哪一步。本单元的句法几乎都用上了：同位语 [Наполеона, императора Франции]{.ru}（第二格）；独立形动词短语 [уступавшая врагу в численности]{.ru}、[продолжавшееся весь день]{.ru}、[покинутый большинством жителей]{.ru}、[живший в Кремле]{.ru}，背景信息放进形动词短语，主要事件留作谓语；重复连接词 [и в армии, и в обществе]{.ru}（第 32 课）；插入语 [по разным оценкам]{.ru}、[по словам современников]{.ru} 标明哪些是估计、哪些是转述（第 33 课）；[принял решение оставить Москву без боя: он хотел сохранить армию]{.ru} 是后句说明原因的无连接词复合句，用冒号（第 38 课）；库图佐夫的名言改成了 [что]{.ru} 引导的间接引语（第 39 课）。博罗季诺会战的结果写成“双方都没有取得完全的胜利”，莫斯科大火只说“当晚城里起火”，不写起火原因，因为史学界对此有不同说法。"

  - id: e8
    type: choice
    task: 根据本课课文选择正确的回答。
    why: "第 1 题见课文第二段：第一个展厅里有编年史和在诺夫哥罗德发现的桦树皮文书；克里姆林宫模型在第二个展厅，宣言在第五个展厅。第 2 题见关于 1917 年的一段：展厅从排队的照片开始。第 3 题见关于围困的一段：125 克是 1941 年底儿童和职员每天凭卡领到的面包，250 克是工人的定量（第 37 课）。第 4 题见最后一个展厅：屏幕上忽然放起了芭蕾，学生们不明白为什么，后面的两个问句是准直接引语，表达的正是学生们的疑问。第 5 题见最后一段：讲解员说 [такого зала нет]{.ru}，用的是 [по-моему]{.ru}，表示这是她自己的看法。"
