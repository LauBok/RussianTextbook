lesson: B2-L30
grammar: "命令式与体：完成体命令式表示具体的一次要求；未完成体命令式表示经常的要求、催促和邀请；否定命令式一般用 [не]{.ru} + 未完成体，[не]{.ru} + 完成体表示提醒当心。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里动词对 [ты]{.ru} 的命令式。
    why: "第 1 题 [торопи́ться → тороплю́сь]{.ru}，重音在词尾，加 [-и́]{.ru}，[-ся]{.ru} 在元音后变 [-сь]{.ru}。第 2 题 [взять → возьму́]{.ru}，命令式词干是 [возьм-]{.ru}，不要写成 [взяй]{.ru}。第 3 题 [забы́ть → забу́ду]{.ru}，重音在词干，加 [-ь]{.ru}。第 4 题 [крича́ть → кричу́]{.ru}，加 [-и́]{.ru}。第 5 题 [присе́сть → прися́ду]{.ru}，重音在词干，加 [-ь]{.ru}。第 6 题 [волнова́ться → волну́юсь]{.ru}，词干以元音结尾，加 [-й]{.ru} 和 [-ся]{.ru}。"
    items:
      - stem: Не ___, мы всё успе́ем!
        hint: торопи́ться
        accept: ["торопи́сь"]
      - stem: ___ па́спорт и биле́т.
        hint: взять
        accept: ["Возьми́"]
      - stem: Не ___ телефо́н!
        hint: забы́ть
        accept: ["забу́дь"]
      - stem: Не ___, Ми́ша спит.
        hint: крича́ть
        accept: ["кричи́"]
      - stem: ___ на доро́жку!
        hint: присе́сть
        accept: ["Прися́дь"]
      - stem: Не ___, ты всё сдашь.
        hint: волнова́ться
        accept: ["волну́йся"]

  - id: e2
    type: choice
    task: 选择完成体或未完成体命令式。
    why: "第 1 题“现在给我递一下”是具体的一次要求，用完成体。第 2 题 [ка́ждый ве́чер]{.ru} 是经常的要求，用未完成体。第 3 题客人刚进门，主人客气地请他坐，用未完成体 [Сади́тесь]{.ru}。第 4 题是一般的规矩“上课别迟到”，说的是经常的事，[не]{.ru} + 未完成体。第 5 题有 [Смотри́]{.ru}，提醒对方当心别把票忘在家里，[не]{.ru} + 完成体。第 6 题劝对方考试前别整晚看电视，是一般的劝阻，[не]{.ru} + 未完成体。"
    items:
      - stem: ___ мне, пожа́луйста, слова́рь.
        options: [Дава́й, Дай]
        answer: Дай
      - stem: ___ мне ка́ждый ве́чер.
        options: [Звони́, Позвони́]
        answer: Звони́
      - stem: Здра́вствуйте! ___, пожа́луйста.
        options: [Сади́тесь, Ся́дьте]
        answer: Сади́тесь
      - stem: Не ___ на уро́ки, они́ начина́ются в де́вять!
        options: [опа́здывай, опозда́й]
        answer: опа́здывай
      - stem: Смотри́, не ___ биле́т до́ма!
        options: [забыва́й, забу́дь]
        answer: забу́дь
      - stem: Пе́ред экза́меном не ___ телеви́зор весь ве́чер.
        options: [смотри́, посмотри́]
        answer: смотри́

  - id: e3
    type: choice
    task: 选择 [не]{.ru} + 未完成体 或 [не]{.ru} + 完成体。
    why: "[не]{.ru} + 未完成体是一般的劝阻：别去做这件事；[не]{.ru} + 完成体是提醒对方当心，别出了这个结果。第 1 题有 [Смотри́]{.ru}，是提醒别迟到。第 2 题“他还在睡，别去叫醒他”，是劝人不要做。第 3 题“说话小声点”，怕的是不小心把人吵醒，用完成体。第 4 题“别忘了经常写信”，说的是经常的事，用未完成体。第 5 题有 [сего́дня]{.ru}，是“今天这一次别忘了”，用完成体。"
    items:
      - stem: Смотри́, не ___ на по́езд!
        options: [опа́здывай, опозда́й]
        answer: опозда́й
      - stem: Не ___ Ми́шу, он ещё спит.
        options: [буди́, разбуди́]
        answer: буди́
      - stem: Говори́ ти́ше, не ___ ба́бушку.
        options: [буди́, разбуди́]
        answer: разбуди́
      - stem: Не ___ писа́ть нам пи́сьма!
        options: [забыва́й, забу́дь]
        answer: забыва́й
      - stem: Не ___ купи́ть сего́дня хлеб по доро́ге домо́й.
        options: [забыва́й, забу́дь]
        answer: забу́дь

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“别着急”用 [не]{.ru} + 未完成体。第 2 题“每天晚上打电话”是经常的要求，用未完成体 [звони́]{.ru}。第 3 题“可别忘了”是提醒，用 [не забу́дь]{.ru}。第 4 题客气地请人坐下，用未完成体 [сади́тесь]{.ru}。"
    items:
      - zh: 别着急，你都来得及。
        accept: ["Не торопи́сь, ты всё успе́ешь.", "Не торопи́тесь, вы всё успе́ете."]
        rubric: ["劝阻用 [не]{.ru} + 未完成体 [торопи́сь]{.ru}", "“来得及”用完成体将来时 [успе́ешь]{.ru}"]
      - zh: 每天晚上给我打电话。
        accept: ["Звони́ мне ка́ждый ве́чер.", "Ка́ждый ве́чер звони́ мне.", "Звони́те мне ка́ждый ве́чер.", "Ка́ждый ве́чер звони́те мне."]
        rubric: ["经常的要求用未完成体 [звони́]{.ru}", "[звони́ть]{.ru} 支配第三格 [мне]{.ru}"]
      - zh: 可别忘了带护照！
        accept: ["Не забу́дь па́спорт!", "Не забу́дь взять па́спорт!", "Не забу́дьте па́спорт!", "Не забу́дьте взять па́спорт!", "Смотри́, не забу́дь па́спорт!", "Смотри́, не забу́дь взять па́спорт!"]
        rubric: ["提醒当心用 [не]{.ru} + 完成体 [забу́дь]{.ru}", "[па́спорт]{.ru} 用第四格"]
      - zh: 请坐，吃馅饼吧！
        accept: ["Сади́тесь, пожа́луйста, бери́те пирожки́!", "Сади́тесь, пожа́луйста! Бери́те пирожки́!", "Сади́сь, пожа́луйста, бери́ пирожки́!", "Сади́сь, пожа́луйста! Бери́ пирожки́!", "Сади́тесь, бери́те пирожки́!", "Сади́сь, бери́ пирожки́!"]
        rubric: ["客气地邀请用未完成体 [сади́тесь]{.ru}、[бери́те]{.ru}", "不要用 [ся́дьте]{.ru}、[возьми́те]{.ru}，那听起来像命令"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ е́хал Ива́н Серге́евич? Что ему́ сказа́ла Мари́я Никола́евна? Что сде́лали все пе́ред доро́гой? Заче́м они́ э́то сде́лали? Почему́ Ива́н Серге́евич посмотре́л в зе́ркало?]{.ru}"
        length: 50–80
        model: "В пя́тницу ве́чером Ива́н Серге́евич е́хал в командиро́вку в Петербу́рг. Он о́чень торопи́лся. Мари́я Никола́евна сказа́ла ему́: «Не торопи́сь, возьми́ па́спорт и не забу́дь телефо́н». Пе́ред доро́гой все се́ли и мину́ту сиде́ли мо́лча. Э́то ста́рый обы́чай: на́до поду́мать, всё ли ты взял. Че́рез пять мину́т Ива́н Серге́евич верну́лся, потому́ что забы́л очки́. Он посмотре́л в зе́ркало: тако́й есть приме́та."
        rubric: ["回答全部五个问题", "至少引用一句课文中的命令式，体用对", "[присе́сть на доро́жку]{.ru} 的习俗说清楚"]
        notes: 范文约 60 词。玛丽亚的话保留为直接引语，正好保留了本课的三种命令式：否定的未完成体（[не торопи́сь]{.ru}）、完成体（[возьми́]{.ru}）、提醒当心的否定完成体（[не забу́дь]{.ru}）。

  - id: e6
    type: open
    task: 作文。你的俄罗斯朋友第一次去中国，给他写一段临行前的叮嘱。
    items:
      - prompt: 告诉他要带什么、在路上和在中国要注意什么、别做什么、要经常做什么。至少用四个完成体命令式、两个未完成体命令式、两个 [не]{.ru} + 未完成体、一个 [не]{.ru} + 完成体。
        length: 100–150
        model: |
          Дорого́й друг, за́втра ты е́дешь в Кита́й! Не волну́йся, всё бу́дет хорошо́. Сего́дня ве́чером положи́ в чемода́н па́спорт, биле́т и де́ньги. Возьми́ лёгкую ку́ртку: в Пеки́не уже́ тепло́. Смотри́, не забу́дь телефо́н! В аэропо́рт е́здят на метро́ и́ли на такси́. Не торопи́сь, но и не опозда́й на самолёт. В Пеки́не обяза́тельно посмотри́ ста́рый го́род и попро́буй настоя́щую кита́йскую ку́хню. Не покупа́й сувени́ры в ма́леньких магази́нах о́коло музе́ев: там всё о́чень до́рого. В метро́ и в магази́нах не бо́йся спра́шивать доро́гу. Ка́ждый день гуля́й по го́роду и говори́ с людьми́ по-кита́йски, не бо́йся оши́бок. И звони́ мне ча́сто! Когда́ вернёшься, расскажи́ мне всё.
        rubric: ["具体的一次要求用完成体命令式（[положи́, возьми́, посмотри́]{.ru}）", "经常的要求用未完成体命令式（[звони́, гуля́й]{.ru}）", "一般劝阻用 [не]{.ru} + 未完成体", "提醒当心用 [не]{.ru} + 完成体（[не забу́дь, не опозда́й]{.ru}）"]
        notes: 范文约 100 词，按时间顺序：出发前准备—路上—到了北京—经常要做的事—回来以后。每个命令式先想：是一次具体的事，还是经常的事？是劝对方别做，还是提醒他当心？[Не торопи́сь, но и не опозда́й]{.ru} 把两种否定命令式放在一句里，意思是“别着急，可也别误了飞机”。
