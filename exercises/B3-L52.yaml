lesson: B3-L52
grammar: "数词与形容词连用：[два, три, четы́ре]{.ru} 后阳性、中性名词用单数第二格，形容词用复数第二格（[два ста́рых чино́вника]{.ru}）；阴性名词的形容词多用复数第一格（[две до́лгие неде́ли]{.ru}）；[пять]{.ru} 以上都用复数第二格；形容词在数词前用复数第一格（[пе́рвые два дня]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Кем служил Акакий Акакиевич, как он относился к своей работе и почему отказался от более важной работы? Почему ему понадобилась новая шинель? Как он собрал деньги? Что случилось с ним после вечера у начальника? Что произошло после его смерти?]{.ru}"
        length: 80–120
        model: "Акакий Акакиевич был маленьким чиновником в петербургском департаменте: он переписывал бумаги. Свою работу он любил и, переписывая бумаги, даже улыбался. Когда начальник поручил ему переменить в бумаге заглавие и глаголы, он вспотел и попросил дать ему снова что-нибудь переписать. Старая шинель совсем не грела, а портной сказал, что чинить её нельзя и нужно шить новую. Сорок рублей Акакий Акакиевич откладывал много лет, а ещё сорок собрал, когда перестал пить чай по вечерам и зажигать свечу; кроме того, директор дал ему шестьдесят рублей. Когда он поздно ночью возвращался от начальника, два высоких человека сняли с него шинель. После его смерти по Петербургу пошли слухи, что у Калинкина моста мертвец в виде чиновника снимает со всех шинели."
        rubric: ["五个问题都回答，情节与课文一致", "金额准确：八十卢布，已攒四十，奖金六十", "第 4 题用上数词与形容词连用（[два высоких человека]{.ru}）"]
        notes: "第 3 题有两个来源：多年的积蓄和过节的奖金，都要答到。第 4 题写“两个人”时注意形容词的格：[два высоких человека]{.ru}，形容词用复数第二格。"

  - id: e2
    type: fill
    task: 把括号里的形容词变成正确的形式。
    why: "先看数词，再看名词的性。第 1 题 [чиновник]{.ru} 阳性，[два]{.ru} 后形容词用复数第二格 [старых]{.ru}。第 2 题 [человек]{.ru} 阳性，同理 [высоких]{.ru}。第 3 题 [неделя]{.ru} 阴性，形容词多用复数第一格 [долгие]{.ru}，复数第二格 [долгих]{.ru} 也对。第 4 题 [пять]{.ru} 以上名词、形容词都用复数第二格：[трудных месяцев]{.ru}。第 5 题形容词在数词前面，用复数第一格 [первые]{.ru}，不能用 [первых]{.ru}。第 6 题 [к двум]{.ru} 是第三格，间接格里形容词、名词都与数词同格：[молодым]{.ru}。"
    items:
      - stem: Два ___ чиновника сидели у окна.
        hint: старый
        accept: ["старых"]
      - stem: Перед ним появились два ___ человека с усами.
        hint: высокий
        accept: ["высоких"]
      - stem: Через две ___ недели шинель была готова.
        hint: долгий
        accept: ["долгие", "долгих"]
      - stem: Прошло пять ___ месяцев.
        hint: трудный
        accept: ["трудных"]
      - stem: ___ два дня Акакий Акакиевич не мог думать ни о чём, кроме шинели.
        hint: первый
        accept: ["Первые"]
      - stem: Он подошёл к двум ___ чиновникам.
        hint: молодой
        accept: ["молодым"]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [окно]{.ru} 中性，[три]{.ru} 后形容词用复数第二格 [больших]{.ru}。第 2 题 [шинель]{.ru} 阴性，形容词用复数第一格 [новые]{.ru}；[новых]{.ru} 也可以，但不在选项里，[новой]{.ru} 是单数，错。第 3 题 [четыре]{.ru} + 阳性名词：[тёплых]{.ru}；[тёплые]{.ru} 只用于阴性名词。第 4 题 [портной]{.ru} 是名词化的形容词，[два]{.ru} 后用复数第二格 [портных]{.ru}，不能按普通名词说 [портного]{.ru}。"
    items:
      - stem: В комнате было три ___ окна.
        options: [большие, больших, большого]
        answer: больших
      - stem: У генерала было две ___ шинели.
        options: [новой, новые, новая]
        answer: новые
      - stem: Он купил четыре ___ шарфа.
        options: [тёплых, тёплые, тёплого]
        answer: тёплых
      - stem: В этом доме жили два ___.
        options: [портного, портных, портные]
        answer: портных

  - id: e4
    type: rewrite
    task: 把单数改为括号里的数量，注意形容词和名词的形式。
    example:
      cue: Пришёл новый чиновник. (два)
      answer: Пришли два новых чиновника.
    why: "改为 [два, три, четыре]{.ru} 时，阳性、中性名词的形容词用复数第二格，名词用单数第二格；阴性名词的形容词多用复数第一格。第 1 题 [месяц]{.ru} 阳性：[три трудных месяца]{.ru}。第 2 题 [буква]{.ru} 阴性：[две любимые буквы]{.ru}，[две любимых буквы]{.ru} 也可以。第 3 题 [пять]{.ru} 以上名词、形容词全用复数第二格：[пять дорогих подарков]{.ru}。第 4 题 [письмо]{.ru} 中性：[четыре длинных письма]{.ru}。数量词组作主语时，谓语用复数或中性单数都可以。"
    items:
      - cue: Прошёл трудный месяц. (три)
        accept: ["Прошли три трудных месяца.", "Прошло три трудных месяца."]
      - cue: У него была любимая буква. (две)
        accept: ["У него были две любимые буквы.", "У него было две любимые буквы.", "У него были две любимых буквы.", "У него было две любимых буквы."]
      - cue: Начальник получил дорогой подарок. (пять)
        accept: ["Начальник получил пять дорогих подарков."]
      - cue: Он написал длинное письмо. (четыре)
        accept: ["Он написал четыре длинных письма."]

  - id: e5
    type: translate
    task: 翻译下列句子，注意数词后形容词的形式。
    items:
      - zh: 两个高个子扒下了他的外套。
        accept: ["Два высоких человека сняли с него шинель.", "Два высоких человека сняли шинель с него."]
        rubric: ["[два высоких человека]{.ru}：形容词复数第二格，名词单数第二格", "[снять что с кого]{.ru}"]
      - zh: 他艰难地熬了两三个月。
        accept: ["Прошли два-три трудных месяца.", "Прошло два-три трудных месяца.", "Он пережил два-три трудных месяца.", "Он прожил два-три трудных месяца."]
        rubric: ["[два-три трудных месяца]{.ru}：形容词复数第二格"]
      - zh: 头两天他不停地看自己的新外套。
        accept: ["Первые два дня он всё время смотрел на свою новую шинель.", "В первые два дня он всё время смотрел на свою новую шинель.", "Два первых дня он всё время смотрел на свою новую шинель."]
        rubric: ["形容词在数词前用复数第一格 [первые два дня]{.ru}；在数词后用复数第二格 [два первых дня]{.ru}", "时间状语用第四格，不加前置词"]

  - id: e7
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [наградить кого за что]{.ru}，不定式 [наградить]{.ru} 跟在 [желая]{.ru} 后面。第 2 题 [поручить кому что]{.ru}，过去时阳性 [поручил]{.ru}。第 3 题 [вытереть]{.ru} 过去时阳性 [вытер]{.ru}，没有 [-л]{.ru}。第 4 题 [сыпать]{.ru} 现在时词干变成 [сыпл-]{.ru}，过去时复数 [сыпали]{.ru}。第 5 题“雷鸣般的声音”，[громовой]{.ru} 与 [голосом]{.ru} 一致，阳性第五格 [громовым]{.ru}。"
    items:
      - stem: Начальник хотел ___ его за долгую службу.
        hint: наградить
        accept: ["наградить"]
      - stem: Он ___ Акакию Акакиевичу работу поважнее.
        hint: поручить
        accept: ["поручил"]
      - stem: Акакий Акакиевич вспотел и ___ лоб.
        hint: вытереть
        accept: ["вытер"]
      - stem: Молодые чиновники ___ ему на голову бумажки.
        hint: сыпать
        accept: ["сыпали"]
      - stem: «А ведь шинель моя!» — сказал один из них ___ голосом.
        hint: громовой
        accept: ["громовым"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，用课文细节说明理由，最后得出结论。
    items:
      - prompt: "[Можно ли назвать Акакия Акакиевича счастливым человеком?]{.ru} 至少用两处“数词 + 形容词 + 名词”，并用一个上一课学过的复合前置词。"
        length: 180–220
        model: "Можно ли назвать Акакия Акакиевича счастливым человеком? По-моему, можно, хотя это звучит странно. Конечно, жизнь у него была очень бедной. Он получал мало денег, жил один, молодые чиновники смеялись над ним. Но он любил свою работу: переписывая бумаги, он улыбался, а некоторые буквы были у него любимыми. Ему был нужен только этот маленький мир, и он ни у кого ничего не просил. Самыми счастливыми в его жизни стали два-три трудных месяца, когда он собирал деньги на шинель. Он пил меньше чая, ходил по улице осторожно, но каждый вечер думал о будущей шинели, и жизнь его стала полнее. У него впервые появилась цель. Однако счастье его было очень коротким. Два высоких человека сняли с него шинель, а генерал, к которому он пошёл за помощью, даже не стал его слушать. По сравнению с этими людьми Акакий Акакиевич кажется мне гораздо лучше: он никого не обижал. Я думаю, Гоголь хотел показать, как мало нужно человеку для счастья и как легко это счастье потерять. Уже на следующий день после его смерти на его месте сидел другой чиновник, и никто о нём не жалел. Поэтому слова «Я брат твой» — главные слова повести: автор просит нас видеть брата в каждом маленьком человеке, даже в самом тихом и бедном."
        rubric: ["开头用问句或陈述句明确提出看法", "有正面理由，也有让步（[однако]{.ru}），论证不片面", "引用课文细节说明理由", "至少两处数词与形容词连用，形容词的格正确", "至少一个复合前置词", "180–220 词"]
        notes: "范文约 200 词。开头先用一个问句引出话题，紧接着给出出人意料的回答（[По-моему, можно, хотя это звучит странно]{.ru}），引起读者兴趣。理由分两层：他满足于自己的小世界；攒钱做外套的几个月让他有了目标。然后用 [Однако]{.ru} 转折，写幸福的短暂。结尾回到原作的名句 [«Я брат твой»]{.ru}，把对一个人物的看法上升到作品的主题。数词与形容词连用：[два-три трудных месяца]{.ru}、[два высоких человека]{.ru}；复合前置词：[по сравнению с этими людьми]{.ru}。"
