lesson: L03
grammar: "名词的性（阳性、阴性、中性）及其判断；物主代词 [мой]{.ru}、[моя́]{.ru}、[моё]{.ru}、[мои́]{.ru} 与名词的性、数一致。"
exercises:

  - id: e1
    type: picture_qa
    task: 看图，用 [Что э́то?]{.ru} 问答。
    example: 1
    why: 家具、门窗都是事物，一律用 [что]{.ru} 问。回答时名词用第一格原形，不加系动词。
    items:
      - image: stol.svg
        qword: Что
        answer: [Э́то стол.]
      - image: krovat.svg
        qword: Что
        answer: [Э́то крова́ть.]
      - image: okno.svg
        qword: Что
        answer: [Э́то окно́.]
      - image: lampa.svg
        qword: Что
        answer: [Э́то ла́мпа.]
      - image: shkaf.svg
        qword: Что
        answer: [Э́то шкаф.]
      - image: kreslo.svg
        qword: Что
        answer: [Э́то кре́сло.]

  - id: e2
    type: choice
    task: 用 [он]{.ru}、[она́]{.ru} 或 [оно́]{.ru} 回答。
    why: 代词由名词的性决定。[шкаф]{.ru} 以硬辅音结尾，是阳性；[ла́мпа]{.ru} 以 [-а]{.ru} 结尾，是阴性；[кре́сло]{.ru}、[окно́]{.ru} 以 [-о]{.ru} 结尾，是中性。第 4、5 题最容易错：[слова́рь]{.ru} 和 [крова́ть]{.ru} 都以 [-ь]{.ru} 结尾，前者是阳性，后者是阴性，只能靠记。第 6 题 [па́па]{.ru} 指男人，是阳性。
    items:
      - stem: — Где шкаф? — Вот ___.
        options: [он, она́, оно́]
        answer: он
      - stem: — Где ла́мпа? — Вот ___.
        options: [он, она́, оно́]
        answer: она́
      - stem: — Где кре́сло? — Вот ___.
        options: [он, она́, оно́]
        answer: оно́
      - stem: — Где слова́рь? — Вот ___.
        options: [он, она́, оно́]
        answer: он
      - stem: — Где крова́ть? — Вот ___.
        options: [он, она́, оно́]
        answer: она́
      - stem: — Где па́па? — ___ до́ма.
        options: [Он, Она́, Оно́]
        answer: Он
      - stem: — Где окно́? — ___ там.
        options: [Он, Она́, Оно́]
        answer: Оно́

  - id: e3
    type: choice
    task: 选择 [мой]{.ru}、[моя́]{.ru}、[моё]{.ru} 或 [мои́]{.ru}。
    why: “我的”和后面名词的性、数一致：阳性用 [мой]{.ru}，阴性用 [моя́]{.ru}，中性用 [моё]{.ru}，两个以上的人或物用 [мои́]{.ru}。第 3 题 [крова́ть]{.ru} 是阴性，第 4 题 [слова́рь]{.ru} 是阳性，不要看到 [-ь]{.ru} 就选同一个形式。第 5 题 [фо́то]{.ru} 是中性。第 6 题 [па́па]{.ru} 虽以 [-а]{.ru} 结尾，仍用 [мой]{.ru}。
    items:
      - stem: Э́то ___ ко́мната.
        options: [мой, моя́, моё, мои́]
        answer: моя́
      - stem: Э́то ___ стол.
        options: [мой, моя́, моё, мои́]
        answer: мой
      - stem: Где ___ крова́ть?
        options: [мой, моя́, моё, мои́]
        answer: моя́
      - stem: Вот ___ слова́рь.
        options: [мой, моя́, моё, мои́]
        answer: мой
      - stem: Где ___ фо́то?
        options: [мой, моя́, моё, мои́]
        answer: моё
      - stem: Э́то ___ па́па.
        options: [мой, моя́, моё, мои́]
        answer: мой
      - stem: Тут ___ ма́ма и па́па.
        options: [мой, моя́, моё, мои́]
        answer: мои́
      - stem: Вот ___ окно́.
        options: [мой, моя́, моё, мои́]
        answer: моё

  - id: e4
    type: rewrite
    task: 按例句问答。
    placeholder: — Где мой …? — Вот он.
    example:
      cue: су́мка
      answer: — Где моя́ су́мка? — Вот она́.
    why: 一句里有两处要和名词一致：问句里的 [мой]{.ru} 和答句里的代词。[су́мка]{.ru} 是阴性，所以是 [моя́]{.ru} 和 [она́]{.ru}；[чемода́н]{.ru} 是阳性，所以是 [мой]{.ru} 和 [он]{.ru}；[кре́сло]{.ru} 是中性，所以是 [моё]{.ru} 和 [оно́]{.ru}。
    items:
      - cue: чемода́н
        accept: ["— Где мой чемода́н? — Вот он."]
      - cue: ла́мпа
        accept: ["— Где моя́ ла́мпа? — Вот она́."]
      - cue: кре́сло
        accept: ["— Где моё кре́сло? — Вот оно́."]
      - cue: слова́рь
        accept: ["— Где мой слова́рь? — Вот он."]
      - cue: крова́ть
        accept: ["— Где моя́ крова́ть? — Вот она́."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1 题“这是我的房间吗”只靠语调和问号，不加别的词。第 3 题两个人用复数 [мои́]{.ru}。第 4 题“不客气”是 [пожа́луйста]{.ru}。
    items:
      - zh: 这是我的房间吗？——是的。
        accept: ["— Э́то моя́ ко́мната? — Да."]
        rubric: ["[ко́мната]{.ru} 是阴性，用 [моя́]{.ru}", 疑问句不加疑问词]
      - zh: 这是桌子、台灯和床，那边是窗户。
        accept: ["Вот стол, ла́мпа и крова́ть, а там окно́.", "Э́то стол, ла́мпа и крова́ть, а там окно́.", "Вот стол, ла́мпа и крова́ть. А там окно́.", "Э́то стол, ла́мпа и крова́ть. А там окно́."]
        rubric: ["“桌子”[стол]{.ru}、“台灯”[ла́мпа]{.ru}、“床”[крова́ть]{.ru}、“窗户”[окно́]{.ru}", "“那边”用 [там]{.ru}，前面用 [а]{.ru} 连接"]
      - zh: 这是我的照片，上面是我的妈妈和爸爸。
        accept: ["Э́то моё фо́то. Тут мои́ ма́ма и па́па.", "Э́то моё фо́то, тут мои́ ма́ма и па́па.", "Вот моё фо́то. Тут мои́ ма́ма и па́па.", "Э́то моё фо́то. Тут ма́ма и па́па."]
        rubric: ["[фо́то]{.ru} 是中性，用 [моё]{.ru}", "妈妈和爸爸是两个人，用 [мои́]{.ru}", "“上面”用 [тут]{.ru}"]
      - zh: ——谢谢！——不客气。
        accept: ["— Спаси́бо! — Пожа́луйста."]
        rubric: ["“不客气”用 [пожа́луйста]{.ru}"]
