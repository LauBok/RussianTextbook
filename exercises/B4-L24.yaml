lesson: B4-L24
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第三单元七篇选文的叙述视角与文体：回忆视角、口语与方言、长句与人物刻画、内心独白、随笔与议论、私人书信、叙述者的声音与讽刺；第 2—5 题以屠格涅夫《初恋》的开头为测试选文。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看解析里注明的那一课；第 2 题回看测试选文和注释；第 3 题回看第 17、21、23 课；第 4 题回看本课“写叙述视角分析的步骤”和第 17、23 课的文体与修辞；第 5 题回看第 18 课的概要写作，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 选择正确答案。
    why: "第 1 题（第 17 课）：[свежесть, беззаботность, потребность любви]{.ru} 这些抽象名词孩子不会说，它们属于回头看的成年叙述者；童年视角用的是感官细节和指小形式。第 2 题（第 17 课）：[сидишь, бывало]{.ru} 里的“你”不是对读者说话，而是泛指，实际上指“我”；和 [бывало]{.ru} 一起表示过去常常发生的事。第 3 题（第 18 课）：外祖母的方言和民间说法刻画她的性格，并和叙述者的书面语形成对照；它不是作者的错误，也不是为了让读者看不懂。第 4 题（第 19 课）：三个 [ни]{.ru} 排除了所有“正常”的解释，冒号后面却是最平淡的结论，期待落空产生幽默；这是第三人称叙述者的温和讽刺。第 5 题（第 20 课）：主人公直接称呼读者、替读者提问再自己回答，独白因此有了对话性；这不是书信，也不是和真实人物的对话。第 6 题（第 21 课）：[может показаться… а между тем…]{.ru} 先承认别人可能的看法，再提出自己的论据，是议论中的让步结构。第 7 题（第 22 课）：私人书信里口语、俗语和庄重的书面语、拉丁语可以混在一起，书面语用在家常话题里产生幽默；公文和科学语体才要求统一的书面语。第 8 题（第 23 课）：叙述者知道尼科尔卡的未来，人物却不知道，“一切都会越来越好”在读者眼里成了反讽。"
    items:
      - stem: "«Вернутся ли когда-нибудь та свежесть… потребность любви и сила веры…» Эти слова принадлежат ___."
        options: [взрослому рассказчику, ребёнку Николеньке, матери Николеньки]
        answer: взрослому рассказчику
      - stem: "«Сидишь, бывало, за чайным столом…» Форма «сидишь» здесь значит ___."
        options: ["«я сидел часто, много раз»", "«ты, читатель, сидишь сейчас»", "«я буду сидеть завтра»"]
        answer: "«я сидел часто, много раз»"
      - stem: "В «Детстве» Горького речь бабушки с её особыми словами нужна, чтобы ___."
        options: [показать её характер, читатель не понял текст, показать ошибки автора]
        answer: показать её характер
      - stem: "Обломов лежит не потому, что болен или устал: «это было его нормальным состоянием». Эта фраза ___."
        options: ["смешная: читатель ждёт особой причины, а получает самую простую", "грустная: герой тяжело болен", "научная: автор объясняет болезнь"]
        answer: "смешная: читатель ждёт особой причины, а получает самую простую"
      - stem: "В «Белых ночах» герой часто говорит «читатель» и сам отвечает на вопросы читателя. Поэтому его рассказ похож на ___."
        options: [разговор с собеседником, официальное письмо, научную статью]
        answer: разговор с собеседником
      - stem: "«Сцена эта может показаться очень натянутой…, а между тем через двадцать шесть лет я тронут до слёз». Здесь автор ___."
        options: ["сначала соглашается с возможным мнением, потом спорит с ним", "просто описывает природу", "даёт слово другому герою"]
        answer: "сначала соглашается с возможным мнением, потом спорит с ним"
      - stem: "В письмах Чехова разговорные слова стоят рядом с книжными и иностранными. Это ___."
        options: ["обычно для частного письма, и это смешно", "ошибка, в письме нужен один стиль", признак официального письма]
        answer: "обычно для частного письма, и это смешно"
      - stem: "«А сам Николка ещё не знал, что всё… всегда так, как нужно и только к лучшему». Рассказчик ___."
        options: [знает больше героя и говорит с иронией, знает меньше героя, говорит словами матери]
        answer: знает больше героя и говорит с иронией

  - id: e2
    type: open
    task: 测试选文理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Где и когда происходит разговор в начале текста? Почему Владимир Петрович не хочет рассказывать, а предлагает написать? Сколько лет было ему тогда и сколько сейчас? Какие у него были отношения с родителями? Что он чувствовал в первые недели на даче? Кто поселился во флигеле и как к этому отнеслась мать?]{.ru}"
        length: 100–140
        model: "Разговор происходит поздно ночью, после ужина, когда гости уже уехали. Хозяин предлагает каждому рассказать о своей первой любви. Владимир Петрович не хочет рассказывать, потому что, по его словам, у него получается или слишком коротко и сухо, или слишком длинно и не так, как было на самом деле. Поэтому он записывает свою историю в тетрадку и через две недели читает её друзьям. Тогда ему было шестнадцать лет, а сейчас около сорока. Отец относился к нему равнодушно, хотя и ласково, а мать почти не обращала на него внимания. В первые недели на даче он гулял, читал стихи, мечтал, грустил и радовался, всё время ждал чего-то нового и прекрасного. Скоро в пустой флигель переехала семья княгини Засекиной. Мать сначала с уважением сказала «княгиня», но потом решила, что она бедная. А сам юноша тогда об этом не думал."
        rubric: ["说出引子的情境：深夜、客人散后、三个人约定讲初恋", "说出改为书面写下的原因", "说出两个年龄：当时 16 岁，现在 40 岁左右", "父母的态度：父亲冷淡而和气，母亲不理会", "少年的心情：等待、幻想、忧伤和欢乐交织", "新邻居是扎谢金公爵夫人；母亲先敬重、后看轻"]
        notes: "第 3 题要从两处找答案：第一章第一句 [Мне было тогда шестнадцать лет]{.ru}，引子里 [человек лет сорока]{.ru}。两个年龄之间的二十多年，就是叙述的距离。"

  - id: e3
    type: choice
    task: 下面各题都是关于《初恋》的叙述视角，选择正确答案。
    why: "第 1 题：引子是第三人称，叙述者不是人物；从 [Вот что стояло в его тетрадке]{.ru} 起，变成弗拉基米尔·彼得罗维奇的第一人称，这叫“故事中的故事”（框架结构）。第 2 题：本子是四十岁的人写的，讲的是十六岁时的事，叙述者和经历者是同一个人，相隔二十多年，和第 17 课托尔斯泰的《童年》相同。第 3 题：[Помнится]{.ru} 表示记忆不完全确定，是回忆的叙述者的标志；它不是对读者的命令，也不表示将来。第 4 题：[ему было суждено скоро сбыться]{.ru} 是成年叙述者知道后来的事，提前透露一句，和第 23 课布尔加科夫的预言式叙述相似；少年当时并不知道。第 5 题：[так сладко и смешно]{.ru} 里的“可笑”是成年人回头看时的评价，带着温和的微笑；当时的少年并不觉得自己可笑。第 6 题：叙述者说“我当时把这一切当耳边风”，又解释说因为刚读过席勒——这是成年人对年轻时的自己的温和的讽刺：[тогда]{.ru} 一词把“当时的我”和“现在的我”分开了。"
    items:
      - stem: "В начале текста и после слов «Вот что стояло в его тетрадке» рассказывают ___."
        options: ["сначала рассказчик, который не участвует в истории, потом Владимир Петрович", "весь текст рассказывает Сергей Николаевич", "весь текст рассказывает хозяин"]
        answer: "сначала рассказчик, который не участвует в истории, потом Владимир Петрович"
      - stem: "В тетрадке Владимир Петрович рассказывает о себе так же, как ___."
        options: ["Толстой в «Детстве»: взрослый вспоминает себя в детстве", Гончаров об Обломове, Чехов в письме брату]
        answer: "Толстой в «Детстве»: взрослый вспоминает себя в детстве"
      - stem: "Слово «помнится» показывает, что ___."
        options: [рассказчик вспоминает и не всё помнит точно, рассказчик говорит о будущем, рассказчик просит читателя запомнить]
        answer: рассказчик вспоминает и не всё помнит точно
      - stem: "«…ему было суждено скоро сбыться». Эти слова ___."
        options: ["говорит взрослый рассказчик: он уже знает, что было потом", думает юноша, говорит мать]
        answer: "говорит взрослый рассказчик: он уже знает, что было потом"
      - stem: "«…сердце ныло — так сладко и смешно». Слово «смешно» показывает ___."
        options: [взгляд взрослого на себя молодого, что над юношей смеялись родители, что юноша читал смешную книгу]
        answer: взгляд взрослого на себя молодого
      - stem: "«Впрочем, я тогда пропустил это всё мимо ушей… я недавно прочёл «Разбойников» Шиллера». Рассказчик говорит о себе молодом ___."
        options: [с лёгкой иронией, со страхом, совершенно серьёзно]
        answer: с лёгкой иронией

  - id: e4
    type: open
    task: 叙述视角分析。用俄语写一段 150—200 词的分析：《初恋》的开头有几个叙述者？在第一章里，四十岁的叙述者和十六岁的少年各自的声音从哪里听得出来？引用原文，并和本单元学过的一篇作比较。
    items:
      - prompt: "[Кто рассказывает в начале «Первой любви»? Как в первой главе слышны два голоса — взрослого человека и шестнадцатилетнего юноши? Сравните с текстом, который мы читали в этом разделе.]{.ru}"
        length: 150–200
        model: "В начале «Первой любви» два рассказчика. Сначала говорит рассказчик, который не участвует в истории: коротко, спокойно, с лёгкой улыбкой он описывает поздний разговор трёх друзей. Потом мы читаем тетрадку Владимира Петровича, и рассказ ведётся от первого лица. Так история первой любви становится рассказом в рассказе. В тетрадке мы слышим два голоса. Первый — голос человека, которому уже сорок лет и который вспоминает. Его выдают слова «помнится», «я никогда не забуду», «я тогда пропустил это всё мимо ушей». Он оценивает себя молодого с лёгкой улыбкой: его сердце ныло «так сладко и смешно», а княжеский титул на него не действовал, потому что он «недавно прочёл «Разбойников» Шиллера». Он знает, что было потом, и говорит о том, чего ждёт юноша: «ему было суждено скоро сбыться». Второй голос — голос юноши. Его чувства переданы длинным предложением с глаголами «ждал, робел, дивился, грустил и даже плакал» и яркими сравнениями: мысли юноши летают, как стрижи вокруг колокольни. Так же построено «Детство» Толстого: взрослый рассказчик вспоминает и оценивает, а детские чувства переданы через подробности. Но у Тургенева больше иронии: взрослый знает, что эта любовь принесёт боль."
        rubric: ["150–200 词", "说出两层叙述：引子的第三人称叙述者和本子里的第一人称", "指出成年叙述者的标志：[помнится]{.ru}、[тогда]{.ru}、评价（[смешно]{.ru}）、预告（[суждено сбыться]{.ru}）", "指出少年声音的标志：一连串动词、比喻、感受", "和本单元一篇作比较（最自然的是第 17 课）", "至少引用三处原文"]
        notes: "范文约 200 词。结构：两个叙述者（框架）——本子里的两个声音：先写成年叙述者，再写少年——和托尔斯泰比较——一句结论。最后一句里“这段爱情会带来痛苦”是从 [суждено сбыться]{.ru} 和全书的结局推出来的，选文里只有暗示，写分析时可以说 [кажется]{.ru}、[можно догадаться]{.ru}。"

  - id: e5
    type: open
    task: 概要写作。用俄语把测试选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение начала повести «Первая любовь».]{.ru}"
        length: 130–170
        model: "Поздно ночью, когда гости уехали, хозяин и двое его друзей, Сергей Николаевич и Владимир Петрович, решают рассказать друг другу о своей первой любви. Сергей Николаевич шутит, что первой любви у него не было, а хозяин говорит, что его история слишком простая. Тогда Владимир Петрович, которому около сорока лет, признаётся, что его первая любовь была необычной. Он не хочет рассказывать её вслух и через две недели читает друзьям свою тетрадку. В ней он вспоминает лето 1833 года. Ему было шестнадцать лет, он жил с родителями на даче под Москвой и готовился в университет, но занимался мало. Отец был с ним равнодушно-ласков, мать почти не обращала на него внимания. Юноша гулял, читал стихи, мечтал, грустил и радовался и всё время ждал чего-то нового. Скоро в соседний флигель переехала бедная княгиня Засекина. Мать говорила о ней то с уважением, то с презрением, а юноша тогда об этом не думал."
        rubric: ["130–170 词", "交代引子：三个人约定讲初恋，弗拉基米尔·彼得罗维奇改为写下来", "交代本子的内容：时间、地点、年龄、家庭关系", "写出少年的心情和新邻居的到来", "用第三人称，不照抄原文的长句"]
        notes: "范文约 160 词。分两部分：引子（约 60 词）和本子（约 100 词）。原文本子里是第一人称，概要要改成第三人称（[он вспоминает]{.ru}、[юноша гулял]{.ru}）。第一章最长的那段抒情描写只用一句话概括（[гулял, читал стихи, мечтал…]{.ru}），不要逐个复述比喻。"
