lesson: B4-L10
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Какие вопросы задаёт поэт в первой строфе? Как меняется картина моря от строфы к строфе? Меняется ли при этом парус? Почему он «просит бури»?]{.ru}"
        length: 90–130
        model: "В первой строфе поэт спрашивает, что парус ищет в далёкой стране и что он кинул в родном краю. Картина моря в каждой строфе другая. В первой строфе море спокойное, оно покрыто голубым туманом. Во второй начинается буря: играют волны, свищет ветер, мачта гнётся и скрипит. В третьей море снова тихое: внизу светлая вода, над парусом золотой луч солнца. Парус же не меняется: он всё время одинокий и мятежный. Он не ищет счастья и не бежит от счастья. Когда вокруг спокойно, он просит бури, потому что спокойная жизнь для него — не покой, а остановка. Ему нужны движение и борьба. Можно сказать, что парус похож на самого поэта и на романтического героя, который не может жить спокойно."
        rubric: ["第 1 题答出两个问题：寻找什么、抛下什么", "第 2 题答出“平静—风暴—平静”的变化", "指出帆始终不变（孤独、不安分）", "对最后两行给出合理的解释"]
        notes: "第 2 题和第 3 题要连起来看：景物从平静到风暴再回到平静，帆的态度却始终不变，这个反差是理解 [просит бури]{.ru} 的出发点。最后一句的解释不止一种，言之成理即可。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[белеть]{.ru}"
        accept: ["Быть видным издали как что-то белое.", "Быть белым на тёмном фоне.", "Казаться белым."]
        rubric: ["说明是“显出白色、远远看去是白的”"]
      - zh: "[кинуть]{.ru}"
        accept: ["Бросить.", "Бросить, оставить.", "Оставить, уйти от кого-то или чего-то."]
        rubric: ["给出同义词 [бросить]{.ru}，诗中意为“抛下、离开”"]
      - zh: "[лазурь]{.ru}"
        accept: ["Голубой цвет неба.", "Голубое небо.", "Светлый голубой цвет."]
        rubric: ["说明是天空的蔚蓝色或碧空"]
      - zh: "[увы]{.ru}"
        accept: ["Слово, которое показывает сожаление.", "К сожалению.", "Так говорят, когда жалеют о чём-то."]
        rubric: ["说明表示惋惜、遗憾，可以用 [к сожалению]{.ru} 解释"]
      - zh: "[созвучие]{.ru}"
        accept: ["Похожие звуки в словах.", "Когда звуки в словах одинаковые.", "Одинаковые звуки."]
        rubric: ["说明是声音相同或相近"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题 [одино́кой — далёкой]{.ru} 重音在倒数第二个音节，是阴性韵；判断时看读音，[-о́кой]{.ru} 和 [-ёкой]{.ru} 写法不同但读音相同。第 2 题第 1、3 行和第 2、4 行押韵是交叉韵 AbAb，《帆》三节都是这样。第 3 题相邻两行押韵是随韵 AAbb。第 4 题第 1 行和第 4 行押韵、把中间两行“围”起来，是抱韵 AbbA。第 5 题每节前两行写海，后两行写帆。第 6 题第 1 节后两行以 [?]{.ru} 结尾，是疑问句；第 2、3 节是感叹句。第 7 题 [?..]{.ru} 表示问句之后余意未尽，不是问题结束了。第 8 题 [скрыпит]{.ru} 是 [скрипит]{.ru} 的旧写法，不是错字，也不是另一个词。第 9 题一节诗里韵的排列方式叫 [рифмовка]{.ru}。第 10 题韵是诗行末尾的声音相合，即 [созвучие]{.ru}。第 11 题把意义相反的词或形象对立起来的修辞格叫 [антитеза]{.ru}。第 12 题 [...]{.ru} 叫 [многоточие]{.ru}；[пауза]{.ru} 是朗读时的停顿，不是标点的名称。"
    items:
      - stem: Рифма «одинокой — далёкой» — ___.
        options: [женская, мужская]
        answer: женская
      - stem: Если первая строка рифмуется с третьей, а вторая — с четвёртой, рифма ___.
        options: [перекрёстная, парная, опоясывающая]
        answer: перекрёстная
      - stem: Если рифмуются первая и вторая, третья и четвёртая строки, рифма ___.
        options: [перекрёстная, парная, опоясывающая]
        answer: парная
      - stem: Если первая строка рифмуется с четвёртой, а вторая — с третьей, рифма ___.
        options: [перекрёстная, парная, опоясывающая]
        answer: опоясывающая
      - stem: В каждой строфе первые две строки описывают ___.
        options: [море, парус, поэта]
        answer: море
      - stem: Последние две строки первой строфы — ___ предложения.
        options: [вопросительные, восклицательные]
        answer: вопросительные
      - stem: Знак «?..» в конце строки показывает, что ___.
        options: [мысль не закончена, вопрос окончен, говорящий кричит]
        answer: мысль не закончена
      - stem: Слово «скрыпит» — это ___.
        options: [старая форма слова «скрипит», ошибка в тексте, другое слово со своим значением]
        answer: старая форма слова «скрипит»
      - stem: Порядок рифм в строфе называется ___.
        options: [рифмовкой, интонацией, паузой]
        answer: рифмовкой
      - stem: Рифма — это ___ концов строк.
        options: [созвучие, противопоставление, многоточие]
        answer: созвучие
      - stem: Противопоставление «буря — покой» называется ___.
        options: [антитезой, рифмовкой, интонацией]
        answer: антитезой
      - stem: Знак «...» в конце шестой строки называется ___.
        options: [многоточием, паузой, рифмовкой]
        answer: многоточием

  - id: e4
    type: open
    task: 划分第二节（第 5–8 行）的音步。用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，写出虚重在第几音步、每行是阴性韵还是阳性韵。
    why: "全诗格律划分（/ 隔开音步，带重音符的是重读音节）：第 1 行 [бе-ле́ / ет-па́ / рус-о / ди-но́ / кой]{.ru .syl}，虚重在第 3 音步，阴性韵；第 2 行 [вту-ма́ / не-мо́ / ря-го / лу-бо́м]{.ru .syl}，第 3 音步，阳性韵；第 3 行 [что-и́ / щет-он / встра-не́ / да-лё / кой]{.ru .syl}，无虚重，阴性韵；第 4 行 [что-ки́ / нул-он / вкра-ю́ / ро-дно́м]{.ru .syl}，无虚重，阳性韵；第 5 行 [и-гра́ / ют-во́л / ны-ве́ / тер-сви́ / щет]{.ru .syl}，无虚重，阴性韵；第 6 行 [и-ма́ч / та-гнёт / ся-и / скры-пи́т]{.ru .syl}，第 3 音步，阳性韵；第 7 行 [у-вы́ / он-сча́ / сти-я / не-и́ / щет]{.ru .syl}，第 3 音步，阴性韵；第 8 行 [и-не / от-сча́ / сти-я / бе-жи́т]{.ru .syl}，第 1、3 音步，阳性韵；第 9 行 [под-ним / стру-я́ / свет-ле́й / ла-зу́ / ри]{.ru .syl}，无虚重，阴性韵；第 10 行 [над-ним / луч-со́лн / ца-зо / ло-то́й]{.ru .syl}，第 3 音步，[луч]{.ru} 为格外重音，阳性韵；第 11 行 [а-он / мя-те́ж / ный-про́ / сит-бу́ / ри]{.ru .syl}，无虚重，阴性韵；第 12 行 [как-бу́д / то-вбу́ / рях-есть / по-ко́й]{.ru .syl}，无虚重，阳性韵。代词 [он, ним]{.ru} 和动词 [есть]{.ru} 处在重音位置上时按重读计。"
    items:
      - prompt: "[Игра́ют во́лны — ве́тер сви́щет, / И ма́чта гнётся и скрыпи́т... / Увы́! он сча́стия не и́щет, / И не от сча́стия бежи́т!]{.ru}"
        length: 4–8
        model: |-
          5: ∪ — / ∪ — / ∪ — / ∪ — / ∪ (пиррихия нет, женская рифма)

          6: ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в третьей стопе, мужская рифма)

          7: ∪ — / ∪ — / ∪ ∪ / ∪ — / ∪ (пиррихий в третьей стопе, женская рифма)

          8: ∪ ∪ / ∪ — / ∪ ∪ / ∪ — (пиррихий в первой и третьей стопе, мужская рифма)
        rubric: ["四行都是四音步抑扬格", "第 5、7 行阴性韵，第 6、8 行阳性韵", "虚重：5 行无，6、7 行第 3 音步，8 行第 1、3 音步", "[счастия]{.ru} 按三个音节计"]
        notes: "音节划分：[и-гра́ / ют-во́л / ны-ве́ / тер-сви́ / щет]{.ru .syl}；[и-ма́ч / та-гнёт / ся-и / скры-пи́т]{.ru .syl}；[у-вы́ / он-сча́ / сти-я / не-и́ / щет]{.ru .syl}；[и-не / от-сча́ / сти-я / бе-жи́т]{.ru .syl}。第 7、8 行最容易错在 [сча́стия]{.ru}：它是三个音节，读成 [сча́стья]{.ru} 就会少一个音节。第 8 行的 [не]{.ru} 处在第 2 个音节上，但它是语气词，不重读，所以第 1 音步是虚重。"

  - id: e5
    type: rewrite
    task: 把诗句改写成现代散文的说法：恢复正常语序，旧形式换成现代形式。
    example:
      cue: Играют волны — ветер свищет.
      answer: Волны играют, ветер свистит.
    why: "诗歌常把形容词放在名词后面、把主语放在谓语后面，改成散文时要还原：第 1 题形容词 [одинокий, голубой]{.ru} 放回名词前，旧词尾 [-ой]{.ru} 改为 [-ий]{.ru}。第 2 题 [счастия]{.ru} 改为 [счастья]{.ru}，否定动词后的第二格保留。第 3 题 [светлей]{.ru} 改为 [светлее]{.ru}，比较对象可以用第二格，也可以用 [чем]{.ru} 加第一格。第 4 题 [золотой]{.ru} 放回 [луч]{.ru} 前。第 5 题主语 [он]{.ru} 放回动词前，[кинул]{.ru} 可以保留，也可以换成 [оставил]{.ru}。"
    items:
      - cue: Белеет парус одинокой в тумане моря голубом.
        accept: ["Одинокий парус белеет в голубом тумане моря.", "В голубом тумане моря белеет одинокий парус."]
      - cue: Он счастия не ищет.
        accept: ["Он не ищет счастья."]
      - cue: Под ним струя светлей лазури.
        accept: ["Под ним струя светлее лазури.", "Под ним струя светлее, чем лазурь."]
      - cue: Над ним луч солнца золотой.
        accept: ["Над ним золотой луч солнца."]
      - cue: Что кинул он в краю родном?
        accept: ["Что он кинул в родном краю?", "Что он оставил в родном краю?", "Что он бросил в родном краю?"]

  - id: e6
    type: open
    task: 概要写作。用俄语散文转述全诗的内容，并用一两句话说明它的含义，150 词左右。
    items:
      - prompt: "[Перескажите стихотворение «Парус» прозой и коротко объясните его смысл.]{.ru}"
        length: 130–170
        model: "В голубом тумане моря белеет одинокий парус. Поэт смотрит на него и спрашивает себя, что этот парус ищет в далёкой стране и что он оставил в родном краю. Ответа нет. Потом на море поднимается ветер, играют волны, мачта гнётся и скрипит. Кажется, что парус уходит от беды или ищет лучшую жизнь. Но поэт говорит, что парус не ищет счастья и не бежит от счастья. Наконец море снова становится спокойным: внизу светлая вода, над парусом золотое солнце. Казалось бы, теперь можно отдохнуть. Однако мятежный парус не хочет тишины и просит бури, как будто покой можно найти только в буре. Смысл стихотворения в том, что есть люди, которым спокойная жизнь кажется пустой. Им нужны борьба и движение. Одинокий парус — это образ романтического героя, типичного для эпохи романтизма, и, может быть, самого молодого Лермонтова."
        rubric: ["按三节顺序转述：问题—风浪—平静与渴求风暴", "恢复散文语序，不照抄诗句", "用一两句话说明含义（浪漫主义主人公、渴望斗争）", "130–170 词"]
        notes: "范文约 150 词。转述诗歌时要把诗中省略的逻辑联系写出来：[Казалось бы, теперь можно отдохнуть. Однако…]{.ru} 一句把第 3 节前后两半的对照说清楚。结尾两句点出含义，不要写成长篇议论。"

  - id: e7
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的短文。
    items:
      - prompt: "[Почему парус просит бури?]{.ru} 谈谈你对最后两行的理解，并联系现实生活说说：人为什么有时会放弃平静的生活，去寻找困难和变化？"
        length: 250–300
        model: "Последние строки стихотворения Лермонтова звучат странно: «А он, мятежный, просит бури, / Как будто в бурях есть покой!» Обычно люди ищут покоя в тишине, а не в буре. Почему же парус поступает наоборот? По-моему, для Лермонтова покой — это не отдых, а согласие с самим собой. Парус чувствует себя живым только тогда, когда он движется и борется с ветром. Когда море тихое, ему не с чем бороться, и он не знает, зачем он существует. Вокруг него «струя светлей лазури» и золотой луч солнца, но эта красота его не радует. Поэтому буря для него — не беда, а возможность быть самим собой. Такие люди есть и в жизни. Я знаю человека, который много лет спокойно работал в банке. У него была хорошая зарплата и удобная квартира, но он часто говорил, что дни его похожи один на другой. Однажды он ушёл с работы и поехал учителем в маленький город на севере. Многие считали, что он совершил ошибку. Ему действительно было трудно: другой климат, маленькая зарплата, сложные ученики. Но он говорит, что только там начал по-настоящему жить. Каждый день он видит, что его работа нужна людям, и усталость кажется ему не такой страшной, как прежняя скука. Конечно, не каждому нужна буря. Многие люди счастливы в спокойной жизни, и в этом нет ничего плохого. Спокойная жизнь тоже требует труда и терпения. Но есть люди, похожие на парус Лермонтова. Им скучно, когда всё хорошо, и они сами ищут трудности, потому что трудности делают их сильнее. Мне кажется, что в молодости каждый человек хотя бы немного похож на такой парус. Именно поэтому стихотворение, которое Лермонтов написал в семнадцать лет, так любят молодые читатели."
        rubric: ["开头引用最后两行，提出问题", "解释“在风暴中求安宁”的悖论", "举一个现实生活中的例子", "有让步：并非人人都需要“风暴”", "250–300 词"]
        notes: "范文约 280 词。结构：引诗提问 → 作者的理解（[По-моему, для Лермонтова покой — это…]{.ru}）→ 生活中的例子 → 让步（[Конечно, не каждому нужна буря]{.ru}）→ 结论，回到“十七岁的莱蒙托夫”。注意 [не с чем бороться]{.ru} 这种结构：[не + 疑问词 + 不定式]{.ru} 表示“没有可以……的”。"
