lesson: L21
grammar: "非动物名词第四格：阴性 [-а → -у]{.ru}、[-я → -ю]{.ru}，阳性、中性、[-ь]{.ru} 结尾的阴性和复数与第一格同形；不规则动词 [есть]{.ru}（[ем, ешь]{.ru}）和 [пить]{.ru}（[пью, пьёшь]{.ru}）的现在时。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的名词变成第四格填空。
    why: 只有以 [-а]{.ru}、[-я]{.ru} 结尾的阴性名词变词尾：[газе́та → газе́ту]{.ru}，[статья́ → статью́]{.ru}。第 3 题 [чай]{.ru}、第 6 题 [фильм]{.ru} 是阳性，第 5 题 [но́вость]{.ru} 是 [-ь]{.ru} 结尾的阴性，第 8 题是复数，都和第一格同形，最容易错的是把 [но́вость]{.ru} 也改成 [-ю]{.ru}。
    items:
      - stem: Я чита́ю ___.
        hint: газе́та
        accept: [газе́ту]
      - stem: Ми́ша слу́шает ___.
        hint: му́зыка
        accept: [му́зыку]
      - stem: Ма́ма пьёт ___.
        hint: чай
        accept: [чай]
      - stem: Мы еди́м ___.
        hint: ка́ша
        accept: [ка́шу]
      - stem: Па́па чита́ет ___ в телефо́не.
        hint: но́вость
        accept: [но́вость]
      - stem: А́нна смо́трит ___.
        hint: фильм
        accept: [фильм]
      - stem: Ван Лэй пи́шет ___ о Москве́.
        hint: статья́
        accept: [статью́]
      - stem: Ми́ша ест ___.
        hint: сы́рники
        accept: [сы́рники]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 在 [э́то]{.ru} 句和 [где]{.ru} 问句里，名词是主语或表语，用第一格；作动词 [чита́ть]{.ru}、[слу́шать]{.ru}、[есть]{.ru} 的宾语，用第四格。同一个词在两种位置上形式不同，判断时先找句子里的动词。
    items:
      - stem: Э́то ___.
        options: [газе́та, газе́ту]
        answer: газе́та
      - stem: Ива́н Серге́евич чита́ет ___.
        options: [газе́та, газе́ту]
        answer: газе́ту
      - stem: Где ___?
        options: [ка́ша, ка́шу]
        answer: ка́ша
      - stem: Ты ешь ___?
        options: [ка́ша, ка́шу]
        answer: ка́шу
      - stem: Вот ___ о Кита́е.
        options: [статья́, статью́]
        answer: статья́
      - stem: Я чита́ю ___ о Кита́е.
        options: [статья́, статью́]
        answer: статью́

  - id: e3
    type: fill
    task: 用 [есть]{.ru} 或 [пить]{.ru} 的正确形式填空。
    why: "[есть]{.ru} 单数是 [ем, ешь, ест]{.ru}，复数换成 [еди́м, еди́те, едя́т]{.ru}，容易把复数误写成 *[есте́]{.ru} 一类形式。[пить]{.ru} 的词干是 [пь-]{.ru}，词尾 [-ёшь, -ёт, -ём, -ёте]{.ru} 都带重音，[ё]{.ru} 要写出。"
    items:
      - stem: — Что ты ___? — Я пью чай.
        hint: пить
        accept: [пьёшь]
      - stem: Ми́ша ___ сы́рники.
        hint: есть
        accept: [ест]
      - stem: Мы ___ ко́фе.
        hint: пить
        accept: [пьём]
      - stem: — Что вы ___? — Мы еди́м ка́шу.
        hint: есть
        accept: [еди́те]
      - stem: Они́ ___ сы́рники.
        hint: есть
        accept: [едя́т]
      - stem: Па́па ___ ко́фе.
        hint: пить
        accept: [пьёт]

  - id: e4
    type: rewrite
    task: 连词成句（动词变位，名词变第四格）。
    example:
      cue: Ива́н Серге́евич / чита́ть / газе́та
      answer: Ива́н Серге́евич чита́ет газе́ту.
    why: 先按主语变动词，再按动词把宾语变成第四格。第 2 题 [му́зыка → му́зыку]{.ru}；第 4 题 [ко́фе]{.ru} 不变格；第 5 题 [пра́вда]{.ru} 是阴性，变成 [пра́вду]{.ru}。
    items:
      - cue: я / есть / ка́ша
        accept: [Я ем ка́шу.]
      - cue: Ми́ша / слу́шать / му́зыка
        accept: [Ми́ша слу́шает му́зыку.]
      - cue: мы / чита́ть / но́вости
        accept: [Мы чита́ем но́вости.]
      - cue: вы / пить / ко́фе
        accept: [Вы пьёте ко́фе.]
      - cue: А́нна / всегда́ / говори́ть / пра́вда
        accept: [А́нна всегда́ говори́т пра́вду.]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 宾语都用第四格。第 3 题“边……边……”可以用 [и… и…]{.ru}，也可以用两个并列谓语。第 4 题的“在手机上”用 [в телефо́не]{.ru}。
    items:
      - zh: ——你在读什么？——我在读一篇关于莫斯科的文章。
        accept: ["— Что ты чита́ешь? — Я чита́ю статью́ о Москве́.", "— Ты что чита́ешь? — Я чита́ю статью́ о Москве́."]
        rubric: ["[статья́]{.ru} 变成第四格 [статью́]{.ru}", "“关于莫斯科”用 [о Москве́]{.ru}（第六格）"]
      - zh: 早上好！你喝茶还是咖啡？
        accept: ["До́брое у́тро! Ты пьёшь чай и́ли ко́фе?", "До́брое у́тро! Что ты пьёшь: чай и́ли ко́фе?", "До́брое у́тро! Ты пьёшь ко́фе и́ли чай?"]
        rubric: ["[пить]{.ru} 的第二人称 [пьёшь]{.ru}", "“还是”用 [и́ли]{.ru}"]
      - zh: 米沙又吃奶渣饼又听音乐。
        accept: ["Ми́ша и ест сы́рники, и слу́шает му́зыку.", "Ми́ша ест сы́рники и слу́шает му́зыку."]
        rubric: ["[есть]{.ru} 的第三人称 [ест]{.ru}", "[му́зыку]{.ru} 用第四格"]
      - zh: 爸爸看报纸，我在手机上看新闻。
        accept: ["Па́па чита́ет газе́ту, а я чита́ю но́вости в телефо́не.", "Па́па чита́ет газе́ту, а я чита́ю в телефо́не но́вости.", "Па́па чита́ет газе́ту, и я чита́ю но́вости в телефо́не."]
        rubric: ["[газе́ту]{.ru} 用第四格", "两个主语对比用 [а]{.ru}"]

  - id: e6
    type: open
    task: 写一写你的早餐。
    items:
      - prompt: 用 4–6 个句子说说你家早上吃什么、喝什么，家里每个人早上在做什么（读报、听音乐等）。
        length: 30–50
        model: |
          До́брое у́тро! Э́то наш стол. Вот чай, ко́фе, хлеб и ка́ша. Ма́ма пьёт чай и ест ка́шу. Па́па пьёт ко́фе и чита́ет газе́ту. А я ем хлеб и слу́шаю му́зыку. Мой брат чита́ет но́вости в телефо́не.
        rubric: [至少四个宾语用对第四格，其中至少两个阴性名词, "[есть]{.ru}、[пить]{.ru} 的变位正确", 只用现在时]
        notes: 范文先用 [Вот…]{.ru} 列出桌上的东西（第一格），再逐个说家人在吃、喝、做什么（第四格），第一格和第四格的对比一目了然。阴性名词 [ка́шу]{.ru}、[газе́ту]{.ru}、[му́зыку]{.ru} 变词尾，[чай]{.ru}、[ко́фе]{.ru}、[хлеб]{.ru}、[но́вости]{.ru} 不变。
