lesson: B3-L38
grammar: "无连接词复合句：列举用逗号或分号；后句说明内容、原因或作宾语用冒号；前句表示条件、时间，后句表示结果、对比或总结用破折号。原因在后用冒号，结果在后用破折号。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Каким был первый искусственный спутник Земли? Что доказал Циолковский? Чем известны Валентина Терешкова и Алексей Леонов? Что произошло в июле 1975 года? Почему спутники важны для нас сегодня?]{.ru}"
        length: 60–90
        model: "Первый спутник был совсем простым: металлический шар диаметром 58 сантиметров с четырьмя антеннами, внутри — радиопередатчики и батареи. Циолковский доказал: ракета может достичь космоса. Валентина Терешкова в 1963 году стала первой женщиной в космосе, а Алексей Леонов в 1965 году первым вышел в открытый космос. В июле 1975 года на орбите встретились советский корабль «Союз» и американский «Аполлон», космонавты и астронавты провели совместные эксперименты. Спутники важны для нас каждый день: они передают телевидение, помогают узнать погоду и показывают дорогу."
        rubric: ["五个问题都回答，年份准确", "至少两个无连接词复合句，冒号或破折号用得对", "用完整的句子"]
        notes: 第 1、2、5 题都适合用冒号：第 1 题后面说明“怎样简单”，第 2 题后面是 [доказал]{.ru} 的内容，第 5 题后面说明原因。

  - id: e2
    type: choice
    task: 选择空白处应当用的标点。
    why: "先补连接词再定标点。第 1 题后句说明原因（[потому что]{.ru}），用冒号。第 2 题后句是前句的结果（[поэтому]{.ru}），用破折号。第 3 题前句是条件（[если]{.ru}），用破折号。第 4 题后句是 [понял]{.ru} 的宾语（[что]{.ru}），用冒号。第 5 题两句对比（[а]{.ru}），用破折号。第 6 题两个分句列举先后发生的事，第一个分句内部已经有逗号，用分号。"
    items:
      - stem: "Это было опасно ___ скафандр раздулся."
        options: ["冒号", "破折号", "分号"]
        answer: "冒号"
      - stem: "Скафандр раздулся ___ Леонов не мог вернуться в корабль."
        options: ["冒号", "破折号", "分号"]
        answer: "破折号"
      - stem: "Не будет спутников ___ не будет прогноза погоды."
        options: ["冒号", "破折号", "分号"]
        answer: "破折号"
      - stem: "Леонов понял ___ нужно выпустить часть воздуха."
        options: ["冒号", "破折号", "分号"]
        answer: "冒号"
      - stem: "Американцы высадились на Луне ___ советская программа не была выполнена."
        options: ["冒号", "破折号", "分号"]
        answer: "破折号"
      - stem: "В августе 1960 года на орбите побывали собаки Белка и Стрелка, а вместе с ними и другие животные ___ все они благополучно вернулись."
        options: ["冒号", "破折号", "分号"]
        answer: "分号"

  - id: e3
    type: rewrite
    task: 去掉连接词，改成无连接词复合句，注意标点。
    example:
      cue: "Циолковский доказал, что ракета может достичь космоса."
      answer: "Циолковский доказал: ракета может достичь космоса."
    why: "去掉连接词以后，用标点表示原来的关系。第 1 题 [потому что]{.ru} 引出原因，原因在后 → 冒号。第 2 题 [поэтому]{.ru} 引出结果 → 破折号。第 3 题 [если]{.ru} 引出条件，条件在前 → 破折号。第 4 题 [а именно]{.ru} 引出说明 → 冒号。注意冒号后面用小写字母。"
    items:
      - cue: "Выход в открытый космос был опасным, потому что скафандр раздулся."
        accept: ["Выход в открытый космос был опасным: скафандр раздулся."]
      - cue: "Спутник вошёл в атмосферу, поэтому он сгорел."
        accept: ["Спутник вошёл в атмосферу — он сгорел."]
      - cue: "Если не будет спутников, не будет связи."
        accept: ["Не будет спутников — не будет связи."]
      - cue: "У станции было одно важное качество, а именно на ней могли работать экипажи из разных стран."
        accept: ["У станции было одно важное качество: на ней могли работать экипажи из разных стран."]

  - id: e4
    type: rewrite
    task: 反过来，给无连接词复合句补上适当的连接词。
    example:
      cue: "Это было опасно: скафандр раздулся."
      answer: "Это было опасно, потому что скафандр раздулся."
    why: "冒号可能表示原因（[потому что]{.ru}）、宾语（[что]{.ru}）或说明；破折号可能表示条件（[если]{.ru}）、结果（[поэтому]{.ru}、[так что]{.ru}）或对比（[а]{.ru}）。第 1 题后句是 [услышал]{.ru} 的内容 → [что]{.ru}。第 2 题前句是条件 → [если]{.ru}，主句不变。第 3 题对比 → [а]{.ru}。第 4 题结果 → [поэтому]{.ru}。"
    items:
      - cue: "Весь мир услышал: в космосе летает спутник."
        accept: ["Весь мир услышал, что в космосе летает спутник."]
      - cue: "Не будет спутников — не будет прогноза погоды."
        accept: ["Если не будет спутников, не будет прогноза погоды.", "Если не будет спутников, то не будет прогноза погоды."]
      - cue: "Лайка не вернулась на Землю — Белка и Стрелка вернулись."
        accept: ["Лайка не вернулась на Землю, а Белка и Стрелка вернулись."]
      - cue: "Скафандр раздулся — Леонов не мог вернуться в корабль."
        accept: ["Скафандр раздулся, поэтому Леонов не мог вернуться в корабль.", "Скафандр раздулся, так что Леонов не мог вернуться в корабль."]

  - id: e5
    type: translate
    task: 翻译下列句子，用无连接词复合句。
    items:
      - zh: 卫星非常简单：一个金属球，四根天线。
        accept: ["Спутник был совсем простым: металлический шар, четыре антенны.", "Спутник был очень простым: металлический шар, четыре антенны.", "Спутник был совсем простой: металлический шар, четыре антенны.", "Спутник был очень простой: металлический шар, четыре антенны."]
        rubric: ["冒号表示后句说明前句", "[металлический шар]{.ru}、[четыре антенны]{.ru}"]
      - zh: 波利亚科夫在空间站上连续工作了 437 天多——这至今仍是纪录。
        accept: ["Поляков провёл на станции больше 437 суток подряд — это до сих пор рекорд.", "Поляков проработал на станции больше 437 суток подряд — это до сих пор рекорд.", "Поляков провёл на станции больше 437 дней подряд — это до сих пор рекорд."]
        rubric: ["破折号引出总结，后句以 [это]{.ru} 开头", "[больше 437 суток / дней]{.ru}：[больше]{.ru} + 第二格", "[подряд]{.ru} 连续"]
      - zh: 苏联和美国在太空竞赛：双方都想争第一。
        accept: ["СССР и США соревновались в космосе: каждая сторона хотела быть первой.", "СССР и США соревновались в космосе: обе стороны хотели быть первыми."]
        rubric: ["冒号引出说明", "[каждая сторона хотела]{.ru} 单数，或 [обе стороны хотели быть первыми]{.ru} 复数"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述航天时代最初二十年的主要事件。
    items:
      - prompt: "按时间顺序写一段话：1957 年 10 月和 11 月；1960 年 8 月；1961 年 4 月；1963 年 6 月；1965 年 3 月；1969 年；1975 年 7 月。至少用两处冒号、两处破折号的无连接词复合句。"
        length: 150–200
        model: "Космическая эра началась 4 октября 1957 года: в этот день на орбиту вывели первый искусственный спутник Земли. Он был совсем простым: металлический шар, четыре антенны, радиопередатчики внутри. Через месяц в космос полетела собака Лайка, но вернуть её на Землю тогда не умели. В августе 1960 года на орбите побывали Белка и Стрелка; они благополучно вернулись. Теперь можно было отправить в космос человека. 12 апреля 1961 года в космос полетел Юрий Гагарин. В июне 1963 года Валентина Терешкова стала первой женщиной в космосе. В марте 1965 года Алексей Леонов первым вышел в открытый космос. Это было опасно: скафандр раздулся, и Леонов не мог вернуться в корабль. Он выпустил часть воздуха — это помогло. В эти годы СССР и США соревновались в космосе, и в 1969 году американцы первыми высадились на Луне. Однако соперничество не мешало сотрудничеству. В июле 1975 года на орбите встретились «Союз» и «Аполлон» — так начался путь к совместным проектам."
        rubric: ["七个时间点都写到，顺序正确", "至少两处冒号、两处破折号，与分句间的意义关系相符", "冒号后用小写字母", "150–200 词"]
        notes: "范文约 175 词。冒号三处：第一句说明“航天时代从哪天开始”，第二句说明“卫星怎样简单”，[Это было опасно: …]{.ru} 说明原因。破折号两处：[выпустил часть воздуха — это помогло]{.ru} 是总结，最后一句 [встретились «Союз» и «Аполлон» — так начался путь…]{.ru} 引出结果。分号一处：[побывали Белка и Стрелка; они благополучно вернулись]{.ru}。[Теперь можно было…]{.ru} 一句把动物飞行和载人飞行连起来，使叙述更连贯。"
