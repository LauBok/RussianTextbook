lesson: B2-L72
heading: 结业测试
intro: 答对 80% 以上就可以进入第三册。本测试覆盖第二册全部语法；没有达到 80% 的，按出错的题回到相应的单元复习后重做：第 1 题对应第一、二单元，第 2 题对应第三、四单元，第 3 题对应第五、六单元，第 4 题对应第七单元，第 5、6 题对应第八单元。
grammar: "名词复数各格与数量表达；代词、比较级与最高级、短尾形容词；动词体的用法与变位难点；带前缀的运动动词；各类主从复合句；数词变格与时间状语；不定代词与否定代词；无人称句与被动结构；直接引语与间接引语；[пусть, дава́й(те)]{.ru}；语气词；表示原因的前置词；构词初识。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [двена́дцать]{.ru} 要求复数第二格 [студе́нтов]{.ru}。第 2 题度量词 [два килогра́мма]{.ru} 后面用第二格 [карто́шки]{.ru}；不可数名词用单数。第 3 题 [мно́го]{.ru} 后面可数名词用复数第二格，[друг]{.ru} 的复数不规则：[друзья́ — друзе́й]{.ru}。第 4 题数量词以 [два]{.ru} 结尾，用 [челове́ка]{.ru}；[люде́й]{.ru} 只跟 [мно́го, ма́ло, не́сколько]{.ru} 连用，不跟数词连用。第 5 题“给谁”用复数第三格 [-ам]{.ru}。第 6 题 [с]{.ru} + 复数第五格，形容词 [-ыми]{.ru}，名词 [друзья́ми]{.ru}。第 7 题 [о]{.ru} + 复数第六格，[-их]{.ru} 和 [-ях]{.ru}。第 8 题“在哪一年”用 [в]{.ru} + 第六格，合成序数词只变最后一个词：[в две ты́сячи шесто́м году́]{.ru}。"
    items:
      - stem: В на́шей гру́ппе двена́дцать ___.
        options: [студе́нт, студе́нта, студе́нтов]
        answer: студе́нтов
      - stem: На ры́нке мы купи́ли два килогра́мма ___.
        options: [карто́шка, карто́шки, карто́шку]
        answer: карто́шки
      - stem: У Ван Лэ́я в Москве́ мно́го ___.
        options: [друг, друзья́, друзе́й]
        answer: друзе́й
      - stem: На день рожде́ния Ива́на Серге́евича пришло́ два́дцать два ___.
        options: [челове́ка, челове́к, люде́й]
        answer: челове́ка
      - stem: Восьмо́го ма́рта Ван Лэй написа́л сообще́ния всем ___.
        options: [подру́гам, подру́гами, подру́гах]
        answer: подру́гам
      - stem: В суббо́ту А́нна была́ в теа́тре с ___.
        options: [но́выми друзья́ми, но́вых друзе́й, но́вым друзья́м]
        answer: но́выми друзья́ми
      - stem: Мы до́лго говори́ли о ___.
        options: [на́ших сосе́дях, на́ши сосе́ди, на́шим сосе́дям]
        answer: на́ших сосе́дях
      - stem: Ван Лэй роди́лся в две ты́сячи ___ году́.
        options: [шесто́м, шесто́го, шесто́й]
        answer: шесто́м

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [к]{.ru} 后面的第三人称代词加 [н-]{.ru}：[к нему́]{.ru}。第 2 题指回主语自己用 [себя́]{.ru}，[береги́]{.ru} 要求第四格。第 3 题比较的对象可以用第二格：[длинне́е Невы́]{.ru}，也可以说 [длинне́е, чем Нева́]{.ru}，但不能直接接第一格。第 4 题作谓语用短尾，[обе́д]{.ru} 阳性：[гото́в]{.ru}。第 5 题书已经读完、就在这里，说的是结果，用完成体 [прочита́л]{.ru}。第 6 题回答“读过两遍”，只问有没有这件事，用未完成体 [чита́л]{.ru}。第 7 题否定命令式一般用未完成体：[Не опа́здывай!]{.ru}。第 8 题 [занима́ться]{.ru} 要求第五格：[спо́ртом]{.ru}。"
    items:
      - stem: Ван Лэй пое́хал к ___ в общежи́тие.
        options: [нему́, ему́, его́]
        answer: нему́
      - stem: Береги́ ___!
        options: [себя́, себе́, собо́й]
        answer: себя́
      - stem: Во́лга длинне́е ___.
        options: [Невы́, Нева́, Неве́]
        answer: Невы́
      - stem: Обе́д ___. Сади́тесь за стол!
        options: [гото́в, гото́вый, гото́вы]
        answer: гото́в
      - stem: Я уже́ ___ э́ту кни́гу. Вот она́, возьми́!
        options: [прочита́л, чита́л]
        answer: прочита́л
      - stem: — Ты ___ «Ча́йку» Че́хова? — Да, два ра́за.
        options: [чита́л, прочита́ешь]
        answer: чита́л
      - stem: Не ___ на экза́мен!
        options: [опа́здывай, опозда́й]
        answer: опа́здывай
      - stem: Ди́ма занима́ется ___.
        options: [спо́ртом, спорт, спо́рту]
        answer: спо́ртом

  - id: e3
    type: choice
    task: 选择正确的运动动词或连接词。
    why: "运动动词看前缀的意义：[при-]{.ru} 来到（第 1 题），[вы-]{.ru} 从里面出来（第 2 题），[пере-]{.ru} 越过（第 3 题），[за-]{.ru} 顺路去一下（第 4 题）。第 5 题 [ка́ждое ле́то]{.ru} 是反复往返，用不定向的 [вози́ть]{.ru}；乘车运送用 [вози́ть]{.ru}，不用 [носи́ть]{.ru}。复合句：第 6 题 [кото́рый]{.ru} 的格由从句决定，[дал]{.ru} 给谁要第三格：[кото́рому]{.ru}。第 7 题主句是愿望 [хо́чет]{.ru}，从句主语和主句不同，用 [что́бы]{.ru} + 过去时形式。第 8 题主句有 [бы]{.ru}，是不真实的条件：[Е́сли бы]{.ru}。第 9 题“虽然下雨，还是去散步”是让步：[Хотя́]{.ru}。"
    items:
      - stem: Ди́ма ___ в семь часо́в, а не в шесть.
        options: [пришёл, ушёл, вы́шел]
        answer: пришёл
      - stem: Ван Лэй ___ из до́ма в сад.
        options: [вы́шел, вошёл, подошёл]
        answer: вы́шел
      - stem: Что́бы попа́сть в парк, на́до ___ че́рез у́лицу.
        options: [перейти́, зайти́, уйти́]
        answer: перейти́
      - stem: По доро́ге домо́й я ___ в магази́н за хле́бом.
        options: [зашёл, вы́шел, перешёл]
        answer: зашёл
      - stem: Ка́ждое ле́то роди́тели ___ дете́й на да́чу.
        options: [во́зят, везу́т, но́сят]
        answer: во́зят
      - stem: Э́то студе́нт, ___ я дал свой слова́рь.
        options: [кото́рому, кото́рый, кото́рого]
        answer: кото́рому
      - stem: Ма́ма хо́чет, ___ я позвони́л ей ве́чером.
        options: [что́бы, что, е́сли]
        answer: что́бы
      - stem: ___ я знал об э́том, я бы пришёл ра́ньше.
        options: [Е́сли бы, Хотя́, Так как]
        answer: Е́сли бы
      - stem: ___ шёл дождь, мы пошли́ гуля́ть.
        options: [Хотя́, Так как, Е́сли бы]
        answer: Хотя́

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [ме́ньше]{.ru} 后面用第二格，数词本身也变：[шести́]{.ru}。第 2 题“在几号”用序数词第二格：[пятна́дцатого]{.ru}。第 3 题 [оди́н из]{.ru} 后面用复数第二格。第 4 题用多长时间做完，完成体配 [за]{.ru}。第 5 题确有其人，只是不知道是谁：[Кто́-то]{.ru}；陈述过去的事实不用 [-нибудь]{.ru}。第 6 题“想问却找不到人”用 [не́кого]{.ru} + 不定式，人用第三格；[никого́]{.ru} 要和变位动词、[не]{.ru} 一起用。第 7 题无人称的 [ка́жется]{.ru}，人用第三格 [Мне]{.ru}。第 8 题已经建成用短尾，[зда́ние]{.ru} 中性：[постро́ено]{.ru}。"
    items:
      - stem: Самолёт лети́т до Ирку́тска ме́ньше ___ часо́в.
        options: [шесть, шести́, шестью́]
        answer: шести́
      - stem: Ван Лэй улета́ет в Пеки́н ___ ию́ля.
        options: [пятна́дцатое, пятна́дцатого, пятна́дцатом]
        answer: пятна́дцатого
      - stem: Серёжа — оди́н из лу́чших ___ ку́рса.
        options: [студе́нтов, студе́нты, студе́нта]
        answer: студе́нтов
      - stem: Ван Лэй прочита́л расска́з ___ два часа́.
        options: [за, на, че́рез]
        answer: за
      - stem: ___ звони́л тебе́ у́тром, но не сказа́л, кто.
        options: [Кто́-то, Кто́-нибудь]
        answer: Кто́-то
      - stem: В суббо́ту Ван Лэ́ю бы́ло ___ спроси́ть.
        options: [не́кого, никого́]
        answer: не́кого
      - stem: ___ ка́жется, что он придёт.
        options: [Мне, Я, Меня́]
        answer: Мне
      - stem: Гла́вное зда́ние университе́та бы́ло ___ в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́.
        options: [постро́ено, постро́ен, стро́ится]
        answer: постро́ено

  - id: e5
    type: choice
    task: 选择正确的词。
    why: "第 1 题“让他睡吧”，对第三人称用 [Пусть]{.ru}。第 2 题“咱们先吃午饭”，[Дава́йте]{.ru} + 完成体第一人称复数。第 3 题表示怀疑、惊讶的反问用 [Ра́зве]{.ru}。第 4 题提醒对方本来就知道的理由用 [ведь]{.ru}。第 5 题工作是使人来不了的不好的原因：[из-за́]{.ru} + 第二格。第 6 题米沙帮了忙，是好的原因：[Благодаря́]{.ru} + 第三格。第 7 题发抖是不由自主的状态：[от]{.ru} + 第二格。第 8 题 [-ница]{.ru} 表示女性：[писа́тельница]{.ru}；[чита́тельница]{.ru} 是女读者。"
    items:
      - stem: — А́нна ещё спит. — ___ спит, у неё сего́дня день рожде́ния.
        options: [Пусть, Дава́й, Ра́зве]
        answer: Пусть
      - stem: ___ снача́ла пообе́даем, а пото́м пойдём на ре́чку.
        options: [Дава́йте, Пусть, Ра́зве]
        answer: Дава́йте
      - stem: ___ ты не зна́ешь? Э́то же мухомо́р!
        options: [Ра́зве, Ведь, Пусть]
        answer: Ра́зве
      - stem: Не буди́ А́нну, ___ у неё сего́дня пра́здник.
        options: [ведь, ра́зве, неуже́ли]
        answer: ведь
      - stem: Роди́тели не прие́хали на пра́здник ___ рабо́ты.
        options: [из-за́, благодаря́, от]
        answer: из-за́
      - stem: ___ Ми́ше мы бы́стро нашли́ доро́гу домо́й.
        options: [Благодаря́, Из-за́, От]
        answer: Благодаря́
      - stem: Ван Лэй дрожа́л ___ хо́лода.
        options: [от, из-за́, благодаря́]
        answer: от
      - stem: Же́нщина, кото́рая пи́шет кни́ги, — э́то ___.
        options: [писа́тельница, писа́тель, чита́тельница]
        answer: писа́тельница

  - id: e6
    type: rewrite
    task: 把直接引语改成间接引语。
    example:
      cue: "Ди́ма сказа́л: «Я приду́ в шесть»."
      answer: Ди́ма сказа́л, что придёт в шесть.
    why: "陈述句用 [что]{.ru}（第 3 题）；特殊疑问句保留疑问词（第 2 题）；一般疑问句把被问的词放在前面，后面加 [ли]{.ru}（第 1、5 题）；命令句用 [что́бы]{.ru} + 过去时形式（第 4 题 [что́бы он принёс]{.ru}）。人称按转述人的角度改：[ты → он]{.ru}，[вы → они́]{.ru}，[тебе́ → ему́]{.ru}；动词的时保持原话不变，所以第 2 题仍用现在时 [улета́ет]{.ru}，第 1、3 题仍用将来时。"
    items:
      - cue: "Ми́ша спроси́л Ван Лэ́я: «Ты вернёшься?»"
        accept: ["Ми́ша спроси́л Ван Лэ́я, вернётся ли он."]
      - cue: "Ди́ма спроси́л Ван Лэ́я: «Когда́ ты улета́ешь?»"
        accept: ["Ди́ма спроси́л Ван Лэ́я, когда́ он улета́ет."]
      - cue: "А́нна сказа́ла Ван Лэ́ю: «Я помогу́ тебе́ написа́ть письмо́»."
        accept: ["А́нна сказа́ла Ван Лэ́ю, что помо́жет ему́ написа́ть письмо́.", "А́нна сказа́ла Ван Лэ́ю, что она́ помо́жет ему́ написа́ть письмо́."]
      - cue: "Ба́бушка сказа́ла Ми́ше: «Принеси́ воды́»."
        accept: ["Ба́бушка сказа́ла Ми́ше, что́бы он принёс воды́."]
      - cue: "Ба́бушка спроси́ла дете́й: «Вы хоти́те есть?»"
        accept: ["Ба́бушка спроси́ла дете́й, хотя́т ли они́ есть."]

  - id: e7
    type: translate
    task: 译成俄语。
    why: "第 1 题 [мно́го]{.ru} + 复数第二格 [друзе́й]{.ru}。第 2 题比较级后面用 [чем]{.ru} + 第一格或直接用第二格，“得多”是 [гора́здо]{.ru}。第 3 题“走过桥”用 [перейти́ (че́рез) мост]{.ru}，“走进”用 [войти́ в]{.ru} + 第四格，都是完成体过去时。第 4 题主句和从句主语不同，用 [что́бы]{.ru} + 过去时形式 [прие́хал]{.ru}，不能用不定式。第 5 题好的原因用 [благодаря́]{.ru} + 第三格 [тебе́]{.ru}。第 6 题“难道”表示惊讶和怀疑，用 [ра́зве]{.ru}；只问读没读过，用未完成体。"
    items:
      - zh: 我在莫斯科有很多朋友。
        accept: ["У меня́ в Москве́ мно́го друзе́й.", "В Москве́ у меня́ мно́го друзе́й."]
        rubric: ["[у меня́]{.ru} 表示“我有”", "[мно́го друзе́й]{.ru}：复数第二格，不规则形式"]
      - zh: 伏尔加河比涅瓦河长得多。
        accept: ["Во́лга гора́здо длинне́е, чем Нева́.", "Во́лга гора́здо длинне́е Невы́."]
        rubric: ["比较级 [длинне́е]{.ru}", "[чем Нева́]{.ru} 或第二格 [Невы́]{.ru}", "[гора́здо]{.ru}"]
      - zh: 我们走过桥，走进了克里姆林。
        accept: ["Мы перешли́ че́рез мост и вошли́ в Кремль.", "Мы перешли́ мост и вошли́ в Кремль."]
        rubric: ["[перешли́ (че́рез) мост]{.ru}：前缀 [пере-]{.ru}", "[вошли́ в Кремль]{.ru}：前缀 [в-]{.ru}，[в]{.ru} + 第四格", "完成体过去时"]
      - zh: 我想让你夏天来北京。
        accept: ["Я хочу́, что́бы ты прие́хал в Пеки́н ле́том.", "Я хочу́, что́бы ле́том ты прие́хал в Пеки́н.", "Я хочу́, что́бы ты ле́том прие́хал в Пеки́н.", "Я хочу́, что́бы ты прие́хала в Пеки́н ле́том.", "Я хочу́, что́бы ле́том ты прие́хала в Пеки́н.", "Я хочу́, что́бы ты ле́том прие́хала в Пеки́н."]
        rubric: ["[хочу́, что́бы]{.ru} + 过去时形式 [прие́хал(а)]{.ru}", "[в Пеки́н]{.ru}：方向用第四格"]
      - zh: 多亏了你，我的俄语说得好多了。
        accept: ["Благодаря́ тебе́ я говорю́ по-ру́сски гора́здо лу́чше.", "Благодаря́ тебе́ я стал говори́ть по-ру́сски гора́здо лу́чше.", "Благодаря́ тебе́ я ста́ла говори́ть по-ру́сски гора́здо лу́чше.", "Благодаря́ тебе́ я тепе́рь говорю́ по-ру́сски гора́здо лу́чше."]
        rubric: ["[благодаря́ тебе́]{.ru}：第三格", "副词比较级 [лу́чше]{.ru}，[гора́здо]{.ru}"]
      - zh: 难道你没读过这本书吗？
        accept: ["Ра́зве ты не чита́л э́ту кни́гу?", "Ра́зве ты не чита́ла э́ту кни́гу?", "Ра́зве ты не чита́л э́той кни́ги?", "Ра́зве ты не чита́ла э́той кни́ги?"]
        rubric: ["语气词 [ра́зве]{.ru}", "未完成体 [чита́л(а)]{.ru}：只问有没有读过"]

  - id: e8
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Где бы́ли друзья́ Ван Лэ́я в ию́ле? Когда́ он улета́л домо́й? Что бы́ло в сре́ду ве́чером? О чём договори́лись Ван Лэй и Ди́ма? Что Ван Лэй нашёл в коро́бке А́нны? О чём он ду́мал в самолёте?]{.ru}"
        length: 60–90
        model: "В ию́ле у студе́нтов бы́ли кани́кулы: Ю́ми уе́хала в Петербу́рг, Пьер — в Пари́ж, а Ди́ма отдыха́л в Каза́ни. Пятна́дцатого ию́ля Ван Лэй улета́л домо́й. В сре́ду ве́чером Ми́ша прие́хал с да́чи, что́бы попроща́ться с ним, и вся семья́ до́лго сиде́ла за столо́м. Позвони́л Ди́ма, и они́ договори́лись, что бу́дут разгова́ривать по ви́део два ра́за в неде́лю. В самолёте Ван Лэй откры́л коро́бку А́нны и нашёл там фотогра́фию всей семьи́ и запи́ску. Он ду́мал, что благодаря́ э́тим лю́дям у него́ тепе́рь два до́ма."
        rubric: ["回答全部六个问题", "日期 [пятна́дцатого ию́ля]{.ru} 用第二格", "至少一个复合句（[что́бы]{.ru}、[что]{.ru} 等）和一个第二册的语法点（[благодаря́]{.ru}、间接引语等）"]
        notes: 范文约 85 词，按时间顺序写：七月的假期、星期三晚上、迪马的电话、飞机上。[что́бы попроща́ться]{.ru} 是目的从句；迪马的话用间接引语 [договори́лись, что бу́дут разгова́ривать]{.ru} 转述；结尾的 [благодаря́ э́тим лю́дям]{.ru} 用第三格复数。

  - id: e9
    type: open
    task: 作文。题目：[Чему́ я научи́лся за э́тот год]{.ru}（这一年我学会了什么）。
    items:
      - prompt: 回顾你过去的一年：学会了哪些新东西（语言、技能、生活上的事）、怎样学会的、谁帮助了你、最难的是什么、明年有什么打算。至少用一个 [благодаря́]{.ru}、一个时间状语和一个复合句。
        length: 120–180
        model: "За э́тот год я научи́лся мно́гому. Са́мое гла́вное — я на́чал говори́ть по-ру́сски.\n\nВ сентябре́ я почти́ ничего́ не понима́л. Ка́ждый ве́чер я слу́шал ра́дио и повторя́л за ди́ктором, а в тече́ние семе́стра писа́л сочине́ния ка́ждую неде́лю. Са́мым тру́дным бы́ло произноше́ние. Но благодаря́ мои́м друзья́м, кото́рые всегда́ говори́ли со мной то́лько по-ру́сски, я тепе́рь говорю́ гора́здо лу́чше.\n\nЕщё я научи́лся гото́вить. Ра́ньше мне не́когда бы́ло стоя́ть на ку́хне, а тепе́рь я могу́ пригото́вить суп за полчаса́. И я научи́лся ката́ться на конька́х: снача́ла мне бы́ло стра́шно, а тепе́рь я ката́юсь лу́чше всех мои́х друзе́й.\n\nВ сле́дующем году́ я хочу́ сдать экза́мен по ру́сскому языку́ и прочита́ть «Войну́ и мир». Е́сли бы мне сказа́ли год наза́д, что я бу́ду чита́ть Толсто́го по-ру́сски, я бы не пове́рил!"
        rubric: ["讲清学会了什么、怎样学会、谁帮了忙、难点和打算", "[благодаря́]{.ru} + 第三格", "至少一个时间状语（[за, в тече́ние, че́рез]{.ru} 等）", "至少一个复合句；用 [е́сли бы]{.ru} 时主句也要有 [бы]{.ru}"]
        notes: 范文四段：总起、学语言、学别的本事、明年的打算。[научи́ться]{.ru} 后面用第三格（[мно́гому]{.ru}）或不定式（[гото́вить]{.ru}、[ката́ться]{.ru}）。全册的语法尽量都用上了：[кото́рые]{.ru} 定语从句、[благодаря́ мои́м друзья́м]{.ru}、[за полчаса́]{.ru}、[в тече́ние семе́стра]{.ru}、[мне не́когда]{.ru}、最高级 [са́мым тру́дным]{.ru}、比较级 [гора́здо лу́чше]{.ru}；最后一句的 [е́сли бы… я бы не пове́рил]{.ru} 用不真实的条件收尾，带点幽默。

  - id: e10
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。回到北京几天后，7 月 20 日给彼得罗夫一家写信：路上怎样，在飞机上打开安娜的盒子的感受，爸爸、妈妈、姥姥喜不喜欢礼物，感谢全家这一年的照顾，向奶奶问好，说说以后的打算。
        length: 100–150
        model: "Пеки́н, 20 ию́ля\n\nДороги́е Ива́н Серге́евич, Мари́я Никола́евна, А́нна и Ми́ша!\n\nЗдра́вствуйте! Я уже́ пять дней в Пеки́не. Доро́га была́ лёгкой, как хоте́ла Мари́я Никола́евна. Ма́ма и па́па жда́ли меня́ в аэропорту́.\n\nА́нна, твою́ коро́бку я откры́л в самолёте. Когда́ я уви́дел фотогра́фию, мне захоте́лось сра́зу верну́ться. Тепе́рь она́ виси́т на стене́ в мое́й ко́мнате, ря́дом с рису́нком Ми́ши.\n\nПода́рки всем понра́вились. Ма́ма ка́ждое у́тро пьёт чай из ча́шки, кото́рую мы купи́ли на Арба́те, а па́па ест суп деревя́нной ло́жкой. Моя́ ба́бушка говори́т, что в тако́м платке́ ей не бу́дет хо́лодно и зимо́й.\n\nСпаси́бо вам за э́тот год! Благодаря́ вам Москва́ ста́ла мои́м вторы́м до́мом. Я обяза́тельно верну́сь, и мы все вме́сте пое́дем на Байка́л.\n\nПереда́йте приве́т ба́бушке!\n\nВаш Ван Лэй"
        rubric: ["书信格式：地点日期、称呼、问候、结束语、落款 [Ваш Ван Лэй]{.ru}", "对全家用 [вы]{.ru}，对安娜单独说话时用 [ты]{.ru}", "讲到路上、盒子、礼物、感谢和打算", "至少一个 [кото́рый]{.ru} 从句和一个第八单元的语法点（[благодаря́]{.ru}、[пусть]{.ru}、间接引语等）"]
        notes: 范文按“到达—盒子—礼物—感谢和打算”分段，和第一册第 100 课王磊从北京写的第一封信结构相同，可以对照着读。对全家说话用复数 [вы]{.ru}（[Спаси́бо вам]{.ru}、[Переда́йте]{.ru}），转向安娜时改用 [ты]{.ru}（[твою́ коро́бку]{.ru}）。[мне захоте́лось]{.ru} 是无人称句；[ча́шки, кото́рую мы купи́ли]{.ru}：[кото́рую]{.ru} 和 [ча́шка]{.ru} 同性、同数，格由从句里的 [купи́ли]{.ru} 决定。
