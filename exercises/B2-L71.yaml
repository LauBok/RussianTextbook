lesson: B2-L71
grammar: "认识形动词（[игра́ющий, чита́вший, уважа́емый, сде́ланный]{.ru}）和副动词（[улыба́ясь, купи́в]{.ru}）：从后缀认出形式，找出原来的动词，换成 [кото́рый]{.ru} 从句或普通动词来理解。"
exercises:

  - id: e1
    type: choice
    task: 判断下列形式是形动词还是副动词。
    why: "形动词像形容词一样有性、数、格词尾（[-ий, -ые, -ый]{.ru}），后缀是 [-ющ-]{.ru}（第 1 题）、[-нн-]{.ru}（第 3、5 题）等；副动词没有变化，以 [-я, -ясь]{.ru}（第 2、6 题）或 [-в]{.ru}（第 4 题）结尾。"
    items:
      - stem: "игра́ющий ___"
        options: [形动词, 副动词]
        answer: 形动词
      - stem: "улыба́ясь ___"
        options: [形动词, 副动词]
        answer: 副动词
      - stem: "сде́ланные ___"
        options: [形动词, 副动词]
        answer: 形动词
      - stem: "купи́в ___"
        options: [形动词, 副动词]
        answer: 副动词
      - stem: "распи́санный ___"
        options: [形动词, 副动词]
        answer: 形动词
      - stem: "разгова́ривая ___"
        options: [形动词, 副动词]
        answer: 副动词

  - id: e2
    type: choice
    task: 下列形动词或副动词来自哪个动词？
    why: "去掉后缀和词尾，就能找到动词：[чита́-ющ-ий → чита́ть]{.ru}；[ку́пл-енн-ый]{.ru} 里有辅音交替 [п → пл]{.ru}，和 [куплю́]{.ru} 一样，来自 [купи́ть]{.ru}；[верну́-вшись]{.ru} 的 [-сь]{.ru} 说明来自 [-ся]{.ru} 动词，后缀 [-вшись]{.ru} 说明是完成体，所以是 [верну́ться]{.ru}，不是未完成体 [возвраща́ться]{.ru}；[уважа́-ем-ый]{.ru} 来自 [уважа́ть]{.ru}；[сид-я́щ-ий]{.ru} 来自 [сиде́ть]{.ru}。注意体：[сде́ланный]{.ru} 来自完成体 [сде́лать]{.ru}，不是 [де́лать]{.ru}。"
    items:
      - stem: "чита́ющий ← ___"
        options: [чита́ть, прочита́ть, чита́тель]
        answer: чита́ть
      - stem: "ку́пленный ← ___"
        options: [купи́ть, покупа́ть, купа́ться]
        answer: купи́ть
      - stem: "верну́вшись ← ___"
        options: [верну́ться, возвраща́ться, ве́рить]
        answer: верну́ться
      - stem: "уважа́емый ← ___"
        options: [уважа́ть, уваже́ние, ва́жный]
        answer: уважа́ть
      - stem: "сидя́щий ← ___"
        options: [сиде́ть, сесть, посиде́ть]
        answer: сиде́ть
      - stem: "сде́ланный ← ___"
        options: [сде́лать, де́лать, де́ло]
        answer: сде́лать

  - id: e3
    type: rewrite
    task: 把形动词短语改成 [кото́рый]{.ru} 从句。
    example:
      cue: "Молодо́й челове́к, игра́ющий на гита́ре, поёт ру́сские пе́сни."
      answer: "Молодо́й челове́к, кото́рый игра́ет на гита́ре, поёт ру́сские пе́сни."
    why: "主动形动词（[чита́ющий, купи́вший]{.ru}）换成 [кото́рый]{.ru}（第一格）+ 变位动词。现在时形动词表示和主句同时的动作，换成从句后时态一般跟主句（第 1 题主句是现在时，从句也用现在时）；过去时形动词用过去时。被动形动词（[распи́санную, сде́ланные]{.ru}）换成 [кото́рую, кото́рые]{.ru}（第四格）+ 不定人称的复数动词 [расписа́ли, сде́лали]{.ru}。[кото́рый]{.ru} 的性和数跟名词一致：[ча́шку → кото́рую]{.ru}，[ло́жки → кото́рые]{.ru}。"
    items:
      - cue: "Студе́нт, чита́ющий кни́гу, — мой друг."
        accept: ["Студе́нт, кото́рый чита́ет кни́гу, — мой друг."]
      - cue: "Я купи́л ча́шку, распи́санную вручну́ю."
        accept: ["Я купи́л ча́шку, кото́рую расписа́ли вручну́ю.", "Я купи́л ча́шку, кото́рую вручну́ю расписа́ли.", "Я купи́л ча́шку, кото́рая распи́сана вручну́ю.", "Я купи́л ча́шку, кото́рая была́ распи́сана вручну́ю."]
      - cue: "Ло́жки, сде́ланные в Нижегоро́дской о́бласти, о́чень краси́вые."
        accept: ["Ло́жки, кото́рые сде́лали в Нижегоро́дской о́бласти, о́чень краси́вые.", "Ло́жки, кото́рые сде́ланы в Нижегоро́дской о́бласти, о́чень краси́вые.", "Ло́жки, кото́рые бы́ли сде́ланы в Нижегоро́дской о́бласти, о́чень краси́вые."]
      - cue: "Де́вушка, купи́вшая пря́ники, — моя́ сестра́."
        accept: ["Де́вушка, кото́рая купи́ла пря́ники, — моя́ сестра́."]

  - id: e4
    type: rewrite
    task: 把带副动词的句子改成带两个变位动词的句子。
    example:
      cue: "Они́ шли по Арба́ту, разгова́ривая."
      answer: "Они́ шли по Арба́ту и разгова́ривали."
    why: "副动词的主语就是句子的主语。未完成体副动词（[улыба́ясь, слу́шая]{.ru}）表示同时进行的动作，改成 [и]{.ru} + 同一时态的未完成体动词；完成体副动词（[купи́в, верну́вшись]{.ru}）表示先发生的动作，改成 [когда́]{.ru} 从句或先后排列的两个完成体动词。"
    items:
      - cue: "Продавщи́ца, улыба́ясь, пока́зывала нам ча́шки."
        accept: ["Продавщи́ца улыба́лась и пока́зывала нам ча́шки."]
      - cue: "Купи́в пода́рки, мы пошли́ домо́й."
        accept: ["Мы купи́ли пода́рки и пошли́ домо́й.", "Когда́ мы купи́ли пода́рки, мы пошли́ домо́й.", "Когда́ мы купи́ли пода́рки, пошли́ домо́й."]
      - cue: "Верну́вшись домо́й, Ван Лэй позвони́л ма́ме."
        accept: ["Ван Лэй верну́лся домо́й и позвони́л ма́ме.", "Когда́ Ван Лэй верну́лся домо́й, он позвони́л ма́ме."]
      - cue: "Ба́бушка пила́ чай, слу́шая ра́дио."
        accept: ["Ба́бушка пила́ чай и слу́шала ра́дио."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: "第 1 题“离……还有”用 [до]{.ru} + 第二格，动词 [оста́ться]{.ru} 用过去时中性 [оста́лось]{.ru}（主语是数量词组），也可以用现在时的 [остаётся]{.ru}。第 2 题商店通知的称呼用 [Уважа́емые]{.ru}，[уважа́емый]{.ru} 原是被动形动词。第 3 题“手工彩绘的”可以用形动词 [распи́санный вручну́ю]{.ru}，也可以用 [кото́рый]{.ru} 从句。"
    items:
      - zh: 离动身还有三天。
        accept: ["До отъе́зда оста́лось три дня.", "До отъе́зда остаётся три дня.", "До отъе́зда ещё три дня.", "До отъе́зда оста́лось ещё три дня.", "До отъе́зда остаётся ещё три дня.", "Оста́лось три дня до отъе́зда.", "Остаётся три дня до отъе́зда.", "Ещё три дня до отъе́зда."]
        rubric: ["[до отъе́зда]{.ru}：[до]{.ru} + 第二格", "[оста́лось три дня]{.ru}：数量词组作主语，动词用中性单数"]
      - zh: 尊敬的顾客们！
        accept: ["Уважа́емые покупа́тели!"]
        rubric: ["[уважа́емые]{.ru} 用复数，与 [покупа́тели]{.ru} 一致"]
      - zh: 这是手工彩绘的瓷器。
        accept: ["Э́то фарфо́р, распи́санный вручну́ю.", "Э́то фарфо́р, кото́рый расписа́ли вручну́ю.", "Э́то распи́санный вручну́ю фарфо́р."]
        rubric: ["形动词 [распи́санный]{.ru} 与 [фарфо́р]{.ru} 一致，或用 [кото́рый расписа́ли]{.ru}", "[вручну́ю]{.ru}"]

  - id: e6
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ и заче́м пое́хали А́нна и Ван Лэй? Что Ван Лэй купи́л для ма́мы, для па́пы и для ба́бушки? Что он купи́л для друзе́й? Что дала́ ему́ А́нна и что она́ сказа́ла?]{.ru}"
        length: 70–100
        model: "За два дня до отъе́зда А́нна и Ван Лэй пое́хали на Арба́т покупа́ть сувени́ры. В магази́не продавщи́ца показа́ла им гжель — бе́лые ча́шки с си́ним узо́ром, кото́рые расписа́ли вручну́ю. Ван Лэй купи́л ча́шку для ма́мы. Для па́пы он взял три деревя́нные ло́жки — э́то хохлома́ из Нижегоро́дской о́бласти. Для ба́бушки он вы́брал тёплый плато́к с кра́сными цвета́ми, а для друзе́й — ту́льские пря́ники. Пото́м А́нна дала́ ему́ ма́ленькую коро́бку на па́мять и сказа́ла, что́бы он откры́л её в самолёте."
        rubric: ["回答全部四个问题", "说清每件礼物送给谁", "形动词、副动词可以改用 [кото́рый]{.ru} 从句或普通动词", "安娜的话用间接引语：[сказа́ла, что́бы он откры́л…]{.ru}"]
        notes: 范文约 85 词，按礼物的顺序写。课文里的形动词 [распи́санный вручну́ю]{.ru} 改成了 [кото́рые расписа́ли вручну́ю]{.ru}，这样更符合缩写的叙述口气。安娜的请求 [«Откро́ешь в самолёте»]{.ru} 用 [что́бы]{.ru} + 过去时形式转述（第 64 课）。

  - id: e7
    type: open
    task: 作文：一件中国的纪念品。
    items:
      - prompt: 如果俄罗斯朋友来中国，你会推荐他买什么纪念品？介绍一种中国的传统手工艺品或特产：是什么样的，在哪里做，为什么适合作礼物。可以用一两个本课学的形动词（如 [сде́ланный, распи́санный]{.ru}）。
        length: 100–150
        model: "Е́сли мой ру́сский друг прие́дет в Кита́й, я посове́тую ему́ купи́ть чай. Чай — э́то са́мый кита́йский пода́рок. В Кита́е его́ пьют уже́ не́сколько ты́сяч лет.\nЧай быва́ет ра́зный: зелёный, чёрный, бе́лый. Ка́ждая о́бласть Кита́я гото́вит свой чай. Мой люби́мый — зелёный чай. Его́ собира́ют весно́й, и он о́чень вку́сный.\nК ча́ю мо́жно купи́ть краси́вые ча́шки, сде́ланные из фарфо́ра. Лу́чший фарфо́р де́лают в одно́м ста́ром го́роде на ю́ге Кита́я. Ча́шки там, как и в Гже́ли, распи́саны вручну́ю. Я ду́маю, ру́сскому дру́гу э́то бу́дет интере́сно.\nТако́й пода́рок не о́чень дорого́й, но всегда́ прия́тный. Ведь ру́сские то́же о́чень лю́бят пить чай!"
        rubric: ["介绍清楚：是什么、在哪里做、为什么适合作礼物", "100–150 词，结构完整", "如用形动词，形式和一致关系正确"]
        notes: 范文从推荐写起，然后分段介绍茶和瓷器，最后说明为什么适合俄罗斯朋友。[ча́шки, сде́ланные из фарфо́ра]{.ru} 用了被动形动词，相当于 [кото́рые сде́лали из фарфо́ра]{.ru}。和俄罗斯的格热利作比较，能让俄罗斯读者更容易理解。

  - id: e8
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。7 月 13 日晚上，给还在奶奶别墅的米沙写一封短信：说说今天和安娜买了什么纪念品，告诉他安娜送了你一个小盒子、要你在飞机上打开，问问他和奶奶怎么样。
        length: 80–120
        model: |
          13 ию́ля

          Приве́т, Ми́ша!

          Как ты? Как ба́бушка? Мно́го грибо́в в лесу́?

          Сего́дня мы с А́нной е́здили на Арба́т за сувени́рами. Я купи́л ма́ме ча́шку — гжель, па́пе — три ло́жки, хохлому́, а ба́бушке в Пеки́н — тёплый плато́к. Для друзе́й мы взя́ли ту́льские пря́ники. Тепе́рь не зна́ю, как всё э́то положи́ть в чемода́н!

          А ещё А́нна дала́ мне ма́ленькую коро́бку и сказа́ла, что́бы я откры́л её в самолёте. Как ты зимо́й, по́мнишь? Я тепе́рь о́чень хочу́ знать, что там.

          Передава́й приве́т ба́бушке!

          Твой Ван Лэй
        rubric: ["日期、称呼、落款格式正确", "对米沙用 [ты]{.ru}", "讲清买了什么、安娜的盒子，问候米沙和奶奶", "转述安娜的话用 [что́бы]{.ru} + 过去时形式"]
        notes: 范文第一段问候，第二段讲礼物，第三段讲安娜的盒子并和米沙冬天的信联系起来（第一册第 99 课）。[три ло́жки, хохлому́]{.ru}：[хохлому́]{.ru} 是同位语，和 [ло́жки]{.ru} 一样作 [купи́л]{.ru} 的补语，用第四格。结尾 [Передава́й приве́т ба́бушке!]{.ru} 是写给朋友、家人的常用结束语。
