lesson: L20
heading: 单元测试
intro: 本测试覆盖第二单元全部语法。答对 80% 以上再进入第三单元；没有达到的，回到相应的课复习后重做。
grammar: "名词第六格单数，[в]{.ru} / [на]{.ru} 表示处所，[-ия]{.ru}、[-ие]{.ru} 词的第六格；[о]{.ru} + 第六格，人称代词第六格；[жить]{.ru}、[писа́ть]{.ru} 的变位；[по-ру́сски]{.ru} 与 [ру́сский язы́к]{.ru}；[быть]{.ru} 的过去时和动词过去时；形容词、物主代词、[э́тот]{.ru} / [тот]{.ru} 的第六格。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式。
    why: "[рабо́та]{.ru}、[ле́кция]{.ru} 习惯上用 [на]{.ru}（工作单位、活动），[библиоте́ка]{.ru} 用 [в]{.ru}。以 [-ия]{.ru}、[-ие]{.ru} 结尾的名词第六格是 [-ии]{.ru}，[в общежи́тие]{.ru} 是常见错误。[уро́к]{.ru} 以元音开头，前面用 [об]{.ru}。[Москва́]{.ru} 是阴性，代替它的第六格是 [о ней]{.ru}。问人用 [о ком]{.ru}，问事物用 [о чём]{.ru}。"
    items:
      - stem: Ма́ма сейча́с ___.
        options: [на рабо́те, в рабо́те]
        answer: на рабо́те
      - stem: А́нна сейча́с ___.
        options: [на библиоте́ке, в библиоте́ке]
        answer: в библиоте́ке
      - stem: Пьер живёт ___.
        options: [в общежи́тие, в общежи́тии]
        answer: в общежи́тии
      - stem: Сего́дня мы ___.
        options: [на ле́кции, на ле́кцие]
        answer: на ле́кции
      - stem: Мы говори́м ___ уро́ке.
        options: [о, об, обо]
        answer: об
      - stem: — Ты мно́го зна́ешь о Москве́? — Да, я ча́сто чита́ю о ___.
        options: [нём, ней, них]
        answer: ней
      - stem: — О ___ ты ду́маешь? — О ма́ме.
        options: [ком, чём]
        answer: ком

  - id: e2
    type: fill
    task: 写出 [жить]{.ru}、[писа́ть]{.ru} 现在时的正确形式。
    why: "[жить]{.ru} 的词干是 [жив-]{.ru}，重音在词尾，[живёшь, живёт, живём, живёте]{.ru} 里的 [ё]{.ru} 要写出。[писа́ть]{.ru} 的 [с]{.ru} 变 [ш]{.ru}，[я]{.ru}、[они́]{.ru} 的词尾是 [-у]{.ru}、[-ут]{.ru}，不是 [-ю]{.ru}、[-ют]{.ru}；重音只有 [пишу́]{.ru} 在词尾，其余在词干。"
    items:
      - stem: Где вы ___?
        hint: жить
        accept: [живёте]
      - stem: Мы ___ в общежи́тии.
        hint: жить
        accept: [живём]
      - stem: Мои́ роди́тели ___ в Пеки́не.
        hint: жить
        accept: [живу́т]
      - stem: Я ча́сто ___ пи́сьма.
        hint: писа́ть
        accept: [пишу́]
      - stem: О чём ты ___?
        hint: писа́ть
        accept: [пи́шешь]
      - stem: Студе́нты ___ упражне́ние.
        hint: писа́ть
        accept: [пи́шут]

  - id: e3
    type: choice
    task: 选择 [по-ру́сски]{.ru} 一类的副词，还是 [ру́сский язы́к]{.ru} 一类的词组。
    why: "[говори́ть]{.ru}、[чита́ть]{.ru}、[писа́ть]{.ru}、[понима́ть]{.ru} 说的是“用什么语言”，接副词 [по-…и]{.ru}；[знать]{.ru}、[изуча́ть]{.ru} 后面要一个事物，接“形容词 + [язы́к]{.ru}”。汉语都说“说俄语”“学俄语”，所以最容易混用。"
    items:
      - stem: Ван Лэй хорошо́ говори́т ___.
        options: [по-ру́сски, ру́сский язы́к]
        answer: по-ру́сски
      - stem: Ми́ша изуча́ет ___.
        options: [по-англи́йски, англи́йский язы́к]
        answer: англи́йский язы́к
      - stem: Пьер зна́ет ___ язы́к.
        options: [францу́зский, по-францу́зски]
        answer: францу́зский
      - stem: Ю́ми пло́хо понима́ет ___.
        options: [по-кита́йски, кита́йский]
        answer: по-кита́йски
      - stem: Я чита́ю ___, но говорю́ пло́хо.
        options: [по-англи́йски, англи́йский язы́к]
        answer: по-англи́йски

  - id: e4
    type: rewrite
    task: 把句子改成过去时。
    example:
      cue: Ван Лэй в теа́тре.
      answer: Ван Лэй был в теа́тре.
    why: 过去时只看主语的性和数：[Ю́ми]{.ru} 是女的，用 [была́]{.ru}；[мы]{.ru} 用 [бы́ли]{.ru}；没有主语的句子用 [бы́ло]{.ru}；[э́то]{.ru} 句中 [быть]{.ru} 和后面的名词一致，[о́пера]{.ru} 是阴性，所以是 [была́]{.ru}。否定时 [не́ был]{.ru} 重音移到 [не]{.ru} 上。其他动词也一样去掉 [-ть]{.ru} 加 [-л, -ла, -ли]{.ru}：[пишу́ → писа́л]{.ru}、[живу́т → жи́ли]{.ru}，词干要从不定式找，不能从现在时找。
    items:
      - cue: Ю́ми в па́рке.
        accept: [Ю́ми была́ в па́рке.]
      - cue: Мы на да́че.
        accept: [Мы бы́ли на да́че.]
      - cue: Там о́чень интере́сно.
        accept: [Там бы́ло о́чень интере́сно.]
      - cue: Э́то о́пера.
        accept: [Э́то была́ о́пера.]
      - cue: Пьер не до́ма.
        accept: [Пьер не́ был до́ма.]
      - cue: Ба́бушка гото́вит обе́д.
        accept: [Ба́бушка гото́вила обе́д.]
      - cue: Ван Лэй пи́шет письмо́.
        accept: [Ван Лэй писа́л письмо́.]
      - cue: Они́ живу́т в коммуна́лке.
        accept: [Они́ жи́ли в коммуна́лке.]

  - id: e5
    type: fill
    task: 用括号里词的第六格填空。
    why: "形容词阳性、中性第六格是 [-ом]{.ru} / [-ем]{.ru}，阴性是 [-ой]{.ru} / [-ей]{.ru}：[большо́м]{.ru}、[ти́хом]{.ru} 用 [о]{.ru}，[хоро́ший]{.ru} 词干末尾是 [ш]{.ru}，词尾不重读，写 [хоро́шем]{.ru}。[поликли́ника]{.ru}、[аудито́рия]{.ru} 是阴性，形容词用 [-ой]{.ru}，名词用 [-е]{.ru} 或 [-ии]{.ru}，各变各的。[мой]{.ru} 阴性第六格是 [мое́й]{.ru}，[наш]{.ru} 中性是 [на́шем]{.ru}；[э́тот]{.ru} 阳性是 [э́том]{.ru}，[тот]{.ru} 阴性是 [той]{.ru}。"
    items:
      - stem: Петро́вы живу́т в ___ до́ме.
        hint: большо́й
        accept: [большо́м]
      - stem: Мы живём в ___ райо́не.
        hint: ти́хий
        accept: [ти́хом]
      - stem: Э́то шко́ла в ___ райо́не.
        hint: хоро́ший
        accept: [хоро́шем]
      - stem: Мари́я Никола́евна рабо́тает в ___ поликли́нике.
        hint: райо́нный
        accept: [райо́нной]
      - stem: На́ши уро́ки в ___ аудито́рии.
        hint: све́тлый
        accept: [све́тлой]
      - stem: В ___ ко́мнате стол и большо́й шкаф.
        hint: мой
        accept: [мое́й]
      - stem: В ___ общежи́тии ко́мнаты ма́ленькие.
        hint: наш
        accept: [на́шем]
      - stem: В ___ до́ме живу́т Петро́вы.
        hint: э́тот
        accept: [э́том]
      - stem: В э́той ко́мнате живёт Ми́ша, а в ___ — А́нна.
        hint: тот
        accept: [той]

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊在写信，不是写练习；他父母住在北京；他和安娜去过大剧院；彼得罗夫一家住在安静的街区；米沙在学英语。
    items:
      - stem: Ван Лэй пи́шет ___.
        options: [упражне́ние, письмо́]
        answer: письмо́
      - stem: Его́ роди́тели живу́т ___.
        options: [в Москве́, в Пеки́не]
        answer: в Пеки́не
      - stem: А́нна и Ван Лэй бы́ли ___.
        options: [в Большо́м теа́тре, в музе́е]
        answer: в Большо́м теа́тре
      - stem: Петро́вы живу́т в ___ райо́не.
        options: [ти́хом, большо́м]
        answer: ти́хом
      - stem: Ми́ша изуча́ет ___.
        options: [кита́йский язы́к, англи́йский язы́к]
        answer: англи́йский язы́к

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题说住处从大到小，[в Москве́]{.ru} 后面接 [в но́вом до́ме]{.ru}，形容词阳性第六格 [-ом]{.ru}。第 2 题“去了剧院”俄语说“在过剧院”，用 [бы́ли в теа́тре]{.ru}；“看了”用过去时复数 [смотре́ли]{.ru}；[Большо́й теа́тр]{.ru} 的形容词也要变成第六格 [Большо́м]{.ru}。第 3 题“谈”要加 [о]{.ru}，“她”变成 [о ней]{.ru}；问话里的 [о ком]{.ru} 是 [кто]{.ru} 的第六格。
    items:
      - zh: 我住在莫斯科，住在一栋新楼里。
        accept: ["Я живу́ в Москве́, в но́вом до́ме.", "Я живу́ в Москве́ в но́вом до́ме.", "Я живу́ в но́вом до́ме в Москве́."]
        rubric: ["[живу́]{.ru} 形式正确", "[в Москве́]{.ru}、[в но́вом до́ме]{.ru} 用第六格，形容词词尾 [-ом]{.ru}"]
      - zh: 昨天我们去了大剧院，看了芭蕾。
        accept: ["Вчера́ мы бы́ли в Большо́м теа́тре и смотре́ли бале́т.", "Вчера́ мы бы́ли в Большо́м теа́тре. Мы смотре́ли бале́т.", "Вчера́ мы бы́ли в Большо́м теа́тре, мы смотре́ли бале́т.", "Мы вчера́ бы́ли в Большо́м теа́тре и смотре́ли бале́т."]
        rubric: ["“去了”用 [бы́ли в]{.ru} + 第六格，不用现在时", "[в Большо́м теа́тре]{.ru}：形容词和名词都是第六格", "[смотре́ли]{.ru} 用复数过去时"]
      - zh: ——你们在谈谁？——谈奥尔加·维克托罗夫娜。我们常常谈她。
        accept: ["— О ком вы говори́те? — Об О́льге Ви́кторовне. Мы ча́сто говори́м о ней.", "— О ком вы говори́те? — Об О́льге Ви́кторовне. Мы о ней ча́сто говори́м."]
        rubric: ["问人用 [о ком]{.ru}", "[О́льга]{.ru} 以元音开头，用 [об]{.ru}；名字和父称都用第六格 [-е]{.ru}", "“她”用 [о ней]{.ru}"]

  - id: e8
    type: open
    task: 缩写：按问题回答，连成一段话。
    items:
      - prompt: 根据课文，用第三人称回答下列问题，连成一段：王磊在写什么？他的父母住在哪儿？他在信里写些什么？彼得罗夫一家住在哪儿？王磊住在什么样的房间？在家里大家说什么语言？
        length: 50–80
        model: "Ван Лэй пи́шет письмо́. Его́ роди́тели живу́т в Пеки́не, и он ча́сто пи́шет пи́сьма. Он пи́шет о Москве́, о факульте́те и о Большо́м теа́тре: А́нна и Ван Лэй бы́ли там и смотре́ли бале́т. Он пи́шет и о семье́. Петро́вы живу́т в большо́м до́ме, в ти́хом райо́не. Ван Лэй живёт в ма́ленькой све́тлой ко́мнате. До́ма они́ говоря́т то́лько по-ру́сски. Ми́ша изуча́ет англи́йский язы́к, но говори́т пло́хо."
        rubric: ["回答全部六个问题", "[пи́шет]{.ru}、[живу́т]{.ru}、[живёт]{.ru} 形式正确", "处所用 [в]{.ru} + 第六格，形容词第六格词尾正确（[в большо́м до́ме]{.ru}、[в ма́ленькой ко́мнате]{.ru}）", "[о]{.ru} + 第六格说写信的内容", "去大剧院一事用过去时", "[говори́ть по-ру́сски]{.ru} 与 [изуча́ть англи́йский язы́к]{.ru} 不混用"]
        notes: 缩写要把对话改成叙述：问答合并成陈述句，人称从 [я]{.ru} 改成 [он]{.ru}，所以 [пишу́]{.ru} 变 [пи́шет]{.ru}，[мои́ роди́тели]{.ru} 变 [его́ роди́тели]{.ru}。范文按问题的顺序写，每个问题一两句；老师的问话不必保留，只保留王磊说的事实。课文里“这个房间”“那个房间”是指着照片说的，叙述里没有照片，所以只写王磊自己住的 [ма́ленькая све́тлая ко́мната]{.ru}。
