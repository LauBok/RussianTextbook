lesson: L79
grammar: "关系代词 [кото́рый]{.ru}（第一格）：[кото́рый, кото́рая, кото́рое, кото́рые]{.ru} 跟被说明的名词性数一致，在从句里作主语；动词 [находи́ться]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [кото́рый]{.ru} 的正确形式。
    why: "[кото́рый]{.ru} 的性和数看它前面被说明的名词：[парк, мост, теа́тр]{.ru} 阳性用 [кото́рый]{.ru}；[у́лица, пло́щадь, галере́я]{.ru} 阴性用 [кото́рая]{.ru}（[пло́щадь]{.ru} 以 [-ь]{.ru} 结尾，是阴性，容易选错）；[кафе́, ме́сто]{.ru} 中性用 [кото́рое]{.ru}；复数用 [кото́рые]{.ru}。"
    items:
      - stem: Э́то парк, ___ нахо́дится ря́дом с Кремлём.
        options: [кото́рый, кото́рая, кото́рое, кото́рые]
        answer: кото́рый
      - stem: Э́то у́лица, ___ мне о́чень нра́вится.
        options: [кото́рый, кото́рая, кото́рое, кото́рые]
        answer: кото́рая
      - stem: Э́то кафе́, ___ нахо́дится ря́дом с метро́.
        options: [кото́рый, кото́рая, кото́рое, кото́рые]
        answer: кото́рое
      - stem: Там рабо́тают худо́жники, ___ рису́ют портре́ты.
        options: [кото́рый, кото́рая, кото́рое, кото́рые]
        answer: кото́рые
      - stem: Э́то Кра́сная пло́щадь, ___ нахо́дится в це́нтре.
        options: [кото́рый, кото́рая, кото́рое, кото́рые]
        answer: кото́рая
      - stem: Э́то музе́и, ___ нахо́дятся в це́нтре.
        options: [кото́рый, кото́рая, кото́рое, кото́рые]
        answer: кото́рые

  - id: e2
    type: rewrite
    task: 按例句用 [кото́рый]{.ru} 把两句话连成一句。
    example:
      cue: Э́то парк. Он нахо́дится в це́нтре.
      answer: Э́то парк, кото́рый нахо́дится в це́нтре.
    why: "用 [кото́рый]{.ru} 代替第二句的主语 [он, она́, оно́, они́]{.ru}，性数不变：[он → кото́рый]{.ru}，[она́ → кото́рая]{.ru}，[оно́ → кото́рое]{.ru}，[они́ → кото́рые]{.ru}。从句前加逗号，从句里不要再保留 [он]{.ru}、[она́]{.ru}。"
    items:
      - cue: Э́то мост. Он виси́т над реко́й.
        accept: ["Э́то мост, кото́рый виси́т над реко́й."]
      - cue: Э́то галере́я. Она́ нахо́дится ря́дом с метро́.
        accept: ["Э́то галере́я, кото́рая нахо́дится ря́дом с метро́."]
      - cue: Э́то студе́нты. Они́ е́здили в Петербу́рг.
        accept: ["Э́то студе́нты, кото́рые е́здили в Петербу́рг."]
      - cue: Э́то де́вушка. Она́ показа́ла мне доро́гу.
        accept: ["Э́то де́вушка, кото́рая показа́ла мне доро́гу."]
      - cue: Э́то письмо́. Оно́ лежи́т на столе́.
        accept: ["Э́то письмо́, кото́рое лежи́т на столе́."]

  - id: e3
    type: fill
    task: 写出动词过去时的正确形式。
    why: "从句里的动词跟 [кото́рый]{.ru} 一致，而 [кото́рый]{.ru} 又跟被说明的名词一致：[же́нщина, кото́рая]{.ru} → 阴性 [-ла]{.ru}；[ма́льчик, кото́рый]{.ru} → 阳性；[студе́нты, кото́рые]{.ru} → 复数 [-ли]{.ru}。不要和句子主语 [э́то]{.ru} 混在一起，[э́то]{.ru} 不影响从句里动词的形式。"
    items:
      - stem: Э́то же́нщина, кото́рая ___ в по́езде ря́дом с А́нной.
        hint: сиде́ть
        accept: ["сиде́ла"]
      - stem: Э́то худо́жник, кото́рый ___ мой портре́т.
        hint: рисова́ть
        accept: ["рисова́л"]
      - stem: Э́то студе́нты, кото́рые ___ в Третьяко́вскую галере́ю.
        hint: ходи́ть
        accept: ["ходи́ли"]
      - stem: Э́то кафе́, кото́рое ___ здесь ра́ньше.
        hint: быть
        accept: ["бы́ло"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语“……的”放在名词前面，俄语的 [кото́рый]{.ru} 从句放在名词后面，并用逗号隔开。
    items:
      - zh: 这是一座位于市中心的公园。
        accept: ["Э́то парк, кото́рый нахо́дится в це́нтре.", "Э́то парк, кото́рый нахо́дится в це́нтре го́рода.", "Вот парк, кото́рый нахо́дится в це́нтре."]
        rubric: ["[парк, кото́рый]{.ru}，阳性", "[нахо́дится в це́нтре]{.ru}", "从句前有逗号"]
      - zh: 阿尔巴特是一条我很喜欢的老街。
        accept: ["Арба́т — э́то ста́рая у́лица, кото́рая мне о́чень нра́вится.", "Арба́т — ста́рая у́лица, кото́рая мне о́чень нра́вится."]
        rubric: ["[у́лица, кото́рая]{.ru}，阴性", "[нра́вится]{.ru} 的主语是 [кото́рая]{.ru}，喜欢的人 [мне]{.ru} 用第三格"]
      - zh: 那儿有给人画像的画家。
        accept: ["Там рабо́тают худо́жники, кото́рые рису́ют портре́ты.", "Там есть худо́жники, кото́рые рису́ют портре́ты."]
        rubric: ["[худо́жники, кото́рые]{.ru}，复数", "[рису́ют]{.ru} 复数第三人称"]
      - zh: 这就是给我指路的那个人。
        accept: ["Э́то челове́к, кото́рый показа́л мне доро́гу.", "Вот челове́к, кото́рый показа́л мне доро́гу.", "Э́то мужчи́на, кото́рый показа́л мне доро́гу.", "Вот мужчи́на, кото́рый показа́л мне доро́гу.", "Э́то тот челове́к, кото́рый показа́л мне доро́гу.", "Э́то тот мужчи́на, кото́рый показа́л мне доро́гу."]
        rubric: ["[кото́рый]{.ru} 作从句主语", "过去时 [показа́л]{.ru} 跟 [кото́рый]{.ru} 一致"]
      - zh: 这是一座位于河边的巨大公园。
        accept: ["Э́то огро́мный парк, кото́рый нахо́дится на берегу́ реки́.", "Вот огро́мный парк, кото́рый нахо́дится на берегу́ реки́.", "Э́то огро́мный парк, кото́рый нахо́дится ря́дом с реко́й.", "Вот огро́мный парк, кото́рый нахо́дится ря́дом с реко́й."]
        rubric: ["形容词 [огро́мный]{.ru} 放在 [парк]{.ru} 前面，[кото́рый]{.ru} 从句放在后面", "[на берегу́ реки́]{.ru} 或 [ря́дом с реко́й]{.ru}"]

  - id: e5
    type: open
    task: 介绍你的城市里你最喜欢的几个地方。
    items:
      - prompt: 至少用三次 [кото́рый]{.ru}（第一格，形式要有变化），用上 [находи́ться]{.ru}。
        length: 70–100
        model: "Я живу́ в Пеки́не. Э́то большо́й ста́рый го́род, кото́рый мне о́чень нра́вится. Моё люби́мое ме́сто — парк, кото́рый нахо́дится ря́дом с на́шим до́мом. Там есть ма́ленькая река́ и мост. Ещё я люблю́ ста́рую у́лицу, кото́рая нахо́дится в це́нтре. Там есть ма́ленькие кафе́, кото́рые рабо́тают ка́ждый день. Я хоте́л бы показа́ть э́ти места́ А́нне."
        rubric: ["至少三次 [кото́рый]{.ru}，性数和被说明的名词一致", "[кото́рый]{.ru} 都作从句主语，动词跟它一致", "用 [нахо́дится]{.ru} 说位置", "从句前有逗号"]
        notes: 范文先介绍城市，再介绍三个地方，每处用一个 [кото́рый]{.ru} 从句补充说明：[го́род, кото́рый]{.ru}、[парк, кото́рый]{.ru}（阳性）、[у́лицу, кото́рая]{.ru}（阴性）、[кафе́, кото́рые]{.ru}（复数）。注意 [ста́рую у́лицу]{.ru} 在主句里是第四格，但 [кото́рая]{.ru} 在从句里作主语，仍用第一格：[кото́рый]{.ru} 的格由它在从句里的作用决定。结尾用第 77 课的 [хоте́л бы]{.ru} 表达愿望。
