lesson: L02
grammar: "人称代词 [он]{.ru}、[она́]{.ru}、[оно́]{.ru}、[они́]{.ru}；[где]{.ru} 问处所，[вот]{.ru}、[там]{.ru}、[до́ма]{.ru} 回答；[да]{.ru} 与 [нет]{.ru}；[ИК-3]{.ru} 一般疑问句。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的人称代词。
    why: 指人按男女选：[Ми́ша]{.ru}、[па́па]{.ru} 用 [он]{.ru}，[А́нна]{.ru}、[ма́ма]{.ru} 用 [она́]{.ru}。指事物和动物要看名词的性：[чемода́н]{.ru}、[дом]{.ru} 是阳性，[су́мка]{.ru}、[ко́шка]{.ru} 是阴性，[фо́то]{.ru} 是中性。第 4 题最容易错：[па́па]{.ru} 以 [-а]{.ru} 结尾，但指男人，用 [он]{.ru}。第 7 题是两个人，用 [они́]{.ru}。
    items:
      - stem: — Где Ми́ша? — Вот ___.
        options: [он, она́, оно́, они́]
        answer: он
      - stem: — Где су́мка? — Вот ___.
        options: [он, она́, оно́, они́]
        answer: она́
      - stem: — Где фо́то? — Вот ___.
        options: [он, она́, оно́, они́]
        answer: оно́
      - stem: — Где па́па? — ___ до́ма.
        options: [Он, Она́, Оно́, Они́]
        answer: Он
      - stem: — Где чемода́н? — ___ там.
        options: [Он, Она́, Оно́, Они́]
        answer: Он
      - stem: — Где Му́рка? — ___ там.
        options: [Он, Она́, Оно́, Они́]
        answer: Она́
      - stem: — Где ма́ма и па́па? — ___ до́ма.
        options: [Он, Она́, Оно́, Они́]
        answer: Они́

  - id: e2
    type: rewrite
    task: 按例句问答：东西就在眼前，用 [вот]{.ru} 回答。
    placeholder: — Где …? — Вот …
    example:
      cue: су́мка
      answer: — Где су́мка? — Вот она́.
    why: 回答时用代词代替问句里的名词，不重复名词。[вот]{.ru} 放在句首，代词放在后面，不能说 [Она́ вот]{.ru}。
    items:
      - cue: чемода́н
        accept: ["— Где чемода́н? — Вот он."]
      - cue: фо́то
        accept: ["— Где фо́то? — Вот оно́."]
      - cue: А́нна
        accept: ["— Где А́нна? — Вот она́."]
      - cue: дом
        accept: ["— Где дом? — Вот он."]
      - cue: ма́ма и па́па
        accept: ["— Где ма́ма и па́па? — Вот они́."]

  - id: e3
    type: rewrite
    task: 按提示回答问题。
    placeholder: Да, … / Нет, …
    example:
      cue: Ми́ша до́ма? (да)
      answer: Да, он до́ма.
    why: 肯定回答用 [да]{.ru}，否定回答用 [нет]{.ru}，后面可以补一句说明人在哪里。补充的句子里名词常换成代词：[па́па]{.ru} 用 [он]{.ru}，[ма́ма и па́па]{.ru} 用 [они́]{.ru}。不能说 [Он нет до́ма]{.ru}：[нет]{.ru} 只用来回答，不用来否定句子里的词。
    items:
      - cue: Па́па до́ма? (нет, там)
        accept: ["Нет, он там.", "Нет, па́па там.", "Нет, там."]
      - cue: А́нна до́ма? (да)
        accept: ["Да, она́ до́ма.", "Да, А́нна до́ма.", "Да, до́ма."]
      - cue: Му́рка до́ма? (да)
        accept: ["Да, она́ до́ма.", "Да, Му́рка до́ма.", "Да, до́ма."]
      - cue: Ма́ма и па́па до́ма? (нет, там)
        accept: ["Нет, они́ там.", "Нет, ма́ма и па́па там.", "Нет, там."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 米沙在“那儿”，安娜喊了他一声他才过来；包就在眼前，所以安娜说 [вот она́]{.ru}；箱子在稍远的地方，所以说 [там]{.ru}。
    items:
      - stem: — Где Ми́ша? — Он ___.
        options: [там, вот]
        answer: там
      - stem: — Где су́мка? — Вот ___.
        options: [она́, он]
        answer: она́
      - stem: Чемода́н ___.
        options: [там, вот]
        answer: там
      - stem: Му́рка ___.
        options: [до́ма, не до́ма]
        answer: до́ма

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语的“吗”在俄语里不用任何词表示，只靠 [ИК-3]{.ru} 的升调，书面上写问号。第 4 题“箱子在那儿”不用系动词，也不用 [вот]{.ru}，因为箱子不在眼前。
    items:
      - zh: ——米沙在哪儿？——他在那儿。
        accept: ["— Где Ми́ша? — Он там.", "— Где Ми́ша? — Там.", "— А где Ми́ша? — Он там.", "— А где Ми́ша? — Там."]
        rubric: ["疑问词用 [где]{.ru}", "代词用 [он]{.ru}，“那儿”用 [там]{.ru}"]
      - zh: ——包在哪儿？——在这儿呢。
        accept: ["— Где су́мка? — Вот она́.", "— А где су́мка? — Вот она́."]
        rubric: ["[су́мка]{.ru} 是阴性，代词用 [она́]{.ru}", "[вот]{.ru} 放在句首"]
      - zh: ——爸爸在家吗？——不在，他在那儿。
        accept: ["— Па́па до́ма? — Нет, он там.", "— Па́па до́ма? — Нет, там.", "— Па́па до́ма? — Нет, па́па там."]
        rubric: ["问句不加疑问词，靠语调和问号", "“不在”用 [нет]{.ru}，不能说 [он нет до́ма]{.ru}", "[па́па]{.ru} 用代词 [он]{.ru}"]
      - zh: 箱子在那儿，照片在这儿。
        accept: ["Чемода́н там, а вот фо́то.", "Чемода́н там. А вот фо́то.", "Чемода́н там, вот фо́то.", "Вот фо́то, а чемода́н там."]
        rubric: ["“箱子”用 [чемода́н]{.ru}，“照片”用 [фо́то]{.ru}", 不用系动词, "两件事对比时用 [а]{.ru} 连接"]
