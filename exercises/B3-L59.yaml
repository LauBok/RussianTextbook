lesson: B3-L59
grammar: "寓言中的古旧形式：表示部分的第二格 [-у]{.ru}（[кусочек сыру]{.ru}），诗歌里的 [-ье, -ья]{.ru}（[согласья]{.ru}），旧词 [ныне, знать, очи, глас]{.ru}，连接词 [да]{.ru} = [и]{.ru}，语气词 [было]{.ru}；诗歌语序：形容词后置（[лето красное]{.ru}）、状语和宾语前置、谓语后置。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题。
    items:
      - prompt: "[Что изображено на памятнике Крылову в Летнем саду? Когда вышла первая книга его басен? Что такое басня и мораль? Чем кончается басня «Стрекоза и Муравей»? Почему Лебедь, Рак и Щука не смогли сдвинуть воз?]{.ru}"
        length: 70–100
        model: "На памятнике Крылову в Летнем саду изображён сам поэт с книгой в руках, а на постаменте — звери и птицы, герои его басен. Первая книга басен Крылова вышла в 1809 году. Басня — это короткий рассказ в стихах, в котором звери и птицы ведут себя как люди, а мораль — короткий вывод, который объясняет смысл басни. Басня «Стрекоза и Муравей» кончается словами Муравья: «Ты всё пела? это дело: Так пойди же, попляши!» Лебедь, Рак и Щука тянули воз в разные стороны: Лебедь в небо, Рак назад, а Щука в воду, поэтому воз и ныне там."
        rubric: ["五个问题都回答，内容与课文一致", "[в 1809 году]{.ru}", "能正确引用寓言原句"]
        notes: "第 5 题的关键是“各往各的方向拉”：[тянули воз в разные стороны]{.ru}。题目里的 [сдвинуть]{.ru} 意思是“挪动”。"

  - id: e2
    type: rewrite
    task: 把诗句改写成今天普通散文的语序和词形。
    example:
      cue: Лето красное пропела.
      answer: Пропела всё красное лето.
    why: "改写时先找主语和谓语，再把其他成分按普通语序排列，旧词形换成今天的形式。第 1 题主语是 [бог]{.ru}，放到句首；[сыру]{.ru} 换成普通的第二格 [сыра]{.ru}。第 2 题完成体副动词今天常用 [взгромоздившись]{.ru}，主语 [Ворона]{.ru} 从副动词短语中间移出来。第 3 题 [согласья]{.ru} 换成 [согласия]{.ru}，“在伙伴之间”今天多说 [между товарищами]{.ru}，[нет]{.ru} 提到名词前。第 4 题 [ныне]{.ru} 换成 [сейчас]{.ru} 或 [теперь]{.ru}。"
    items:
      - cue: Вороне где-то бог послал кусочек сыру.
        accept: ["Бог где-то послал Вороне кусочек сыра.", "Где-то бог послал Вороне кусочек сыра.", "Бог послал где-то Вороне кусочек сыра."]
      - cue: На ель Ворона взгромоздясь…
        accept: ["Ворона, взгромоздившись на ель…", "Взгромоздившись на ель, Ворона…"]
      - cue: Когда в товарищах согласья нет…
        accept: ["Когда между товарищами нет согласия…", "Когда у товарищей нет согласия…", "Когда нет согласия между товарищами…"]
      - cue: А воз и ныне там.
        accept: ["А воз и сейчас там.", "А воз и теперь там.", "А воз до сих пор там.", "А воз и сегодня там."]

  - id: e3
    type: choice
    task: 选出与古旧形式意思相同的今天的说法。
    why: "第 1 题 [ныне]{.ru} 是旧词，意思是“现在”。第 2 题 [знать]{.ru} 在 [«знать, она сильна»]{.ru} 里是插入语，意思是“看来”，不是动词“知道”。第 3 题 [очи]{.ru} 是 [глаза]{.ru} 的诗歌说法。第 4 题 [да]{.ru} 在 [Лебедь, Рак да Щука]{.ru} 里是连接词，相当于 [и]{.ru}，不是“是的”。第 5 题 [было]{.ru} 和完成体过去时连用，表示动作本来要发生却被打断了。"
    items:
      - stem: "«ныне» = ___"
        options: [сейчас, никогда, давно]
        answer: сейчас
      - stem: "«Моська! знать, она сильна…» — «знать» = ___"
        options: [видно, понимать, помнить]
        answer: видно
      - stem: "«очи» = ___"
        options: [уши, глаза, руки]
        answer: глаза
      - stem: "«Лебедь, Рак да Щука» — «да» = ___"
        options: [и, но, или]
        answer: и
      - stem: "«Позавтракать было совсем уж собралась» — Ворона ___"
        options: ["позавтракала", "хотела позавтракать, но не смогла", "никогда не завтракала"]
        answer: хотела позавтракать, но не смогла

  - id: e4
    type: fill
    task: 把括号里的现代形式改成寓言诗歌里的古旧形式。
    why: "第 1 题表示“一部分”的阳性名词第二格可用 [-у]{.ru}：[сыру]{.ru}。第 2 题诗歌里 [-ия]{.ru} 常写成 [-ья]{.ru}：[согласья]{.ru}，少一个音节，便于凑格律。第 3 题“至今”的旧说法 [ныне]{.ru}。第 4 题 [голос]{.ru} 的旧诗歌形式 [глас]{.ru}。"
    items:
      - stem: Вороне где-то бог послал кусочек ___.
        hint: сыра
        accept: ["сыру"]
      - stem: Когда в товарищах ___ нет…
        hint: согласия
        accept: ["согласья"]
      - stem: А воз и ___ там.
        hint: сейчас
        accept: ["ныне"]
      - stem: Услышал он чудесный ___.
        hint: голос
        accept: ["глас"]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 克雷洛夫的许多诗句早已成为谚语。
        accept: ["Многие строки Крылова давно стали пословицами.", "Многие строки Крылова уже давно стали пословицами."]
        rubric: ["[стать чем]{.ru}：第五格 [пословицами]{.ru}", "[многие строки]{.ru}"]
      - zh: 俄罗斯的孩子们背诵克雷洛夫的寓言。
        accept: ["Дети в России учат басни Крылова наизусть.", "Русские дети учат басни Крылова наизусть.", "В России дети учат басни Крылова наизусть."]
        rubric: ["[учить наизусть]{.ru}：背诵", "[басни Крылова]{.ru}"]
      - zh: 我本来要去图书馆，可是后来留在家里了。
        accept: ["Я было пошёл в библиотеку, но остался дома.", "Я было пошла в библиотеку, но осталась дома.", "Я было собрался в библиотеку, но остался дома.", "Я было собралась в библиотеку, но осталась дома."]
        rubric: ["语气词 [было]{.ru} + 完成体过去时：本来要做却没做成", "[но]{.ru} 引出转折"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，分条说明理由，最后得出结论。
    items:
      - prompt: "[Почему басни Крылова не стареют?]{.ru} 至少举两篇寓言为例，引用一句原文。"
        length: 180–220
        model: "Басни Крылова были написаны двести лет назад, но их до сих пор читают и взрослые, и дети. Почему же они не стареют? По-моему, причин несколько. Во-первых, Крылов писал не о зверях, а о людях. Хитрая Лиса, глупая Ворона, весёлая Стрекоза — это человеческие характеры, которые можно встретить в любое время и в любой стране. Каждый из нас знает человека, который любит лесть, как Ворона, или живёт сегодняшним днём, как Стрекоза. Да и сегодня в любой группе людей есть свои Лебедь, Рак и Щука. Во-вторых, мораль басен простая и понятная. Крылов не читает длинных лекций, а показывает короткую сцену, после которой вывод ясен сам. В-третьих, басни написаны живым и точным языком. Многие строки легко запомнить, и они давно стали пословицами: когда работа не двигается, русский человек говорит «А воз и ныне там», даже не думая о Крылове. Конечно, в баснях есть старые слова и необычный порядок слов, и современному школьнику не всё понятно с первого раза. Однако это не мешает понять главное. Мне кажется, что чтение басен полезно и для иностранцев: оно помогает узнать не только язык, но и народную мудрость. Поэтому я думаю, что басни Крылова будут жить ещё долго — пока люди остаются такими же, как его звери."
        rubric: ["开头提出问题并给出看法", "至少三条理由，每条有例子", "引用至少一句原文，引号使用正确", "有让步：承认古旧语言造成的困难", "180–220 词"]
        notes: "范文约 195 词。三条理由由浅入深：写的是人的性格；寓意简单明了；语言生动，成了谚语。每条都举了具体寓言为例，第三条引用了原句 [«А воз и ныне там»]{.ru}。[Конечно…, однако…]{.ru} 承认古旧语言的困难，又说明它不妨碍理解。结尾 [пока люди остаются такими же, как его звери]{.ru} 呼应第一条理由，首尾相接。引用原文时，诗句放在俄语引号 [«»]{.ru} 里。"
