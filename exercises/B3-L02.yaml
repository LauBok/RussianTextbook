lesson: B3-L02
grammar: "主动形动词过去时：过去时阳性以 [-л]{.ru} 结尾的去 [-л]{.ru} 加 [-вш-]{.ru}（[рабо́тал → рабо́тавший]{.ru}），不以 [-л]{.ru} 结尾的加 [-ш-]{.ru}（[вы́рос → вы́росший]{.ru}）；[идти́ → ше́дший]{.ru}；两种体都有；与过去时 [кото́рый]{.ru} 从句的互换。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как Менделеев заинтересовался химией? Почему мать повезла его в столицу? Зачем Менделеев начал писать «Основы химии»? Как он нашёл свою систему? Что доказало, что Менделеев был прав?]{.ru}"
        length: 60–90
        model: "Менделеев вырос рядом со стекольным заводом, которым управляла его мать, и часто смотрел, как рабочие делают стекло. Мать хотела дать сыну хорошее образование, поэтому, когда Дмитрий окончил гимназию, повезла его в Москву, а потом в Петербург. «Основы химии» Менделеев начал писать, потому что студентам нужен был хороший учебник. Он написал на карточках названия и свойства элементов, расположил элементы по атомному весу и заметил, что свойства периодически повторяются. Он оставил в таблице пустые места и описал свойства неизвестных элементов, а в 1875 году открыли галлий, свойства которого совпали с тем, что он предсказал."
        rubric: ["五个问题都回答，内容与课文一致", "[управлять чем]{.ru}、[совпасть с чем]{.ru} 支配正确", "用完整的句子"]
        notes: "第 4 题不要回答“在梦里梦见的”，课文说这只是传说。第 5 题要说出预言和后来的发现两件事。"

  - id: e2
    type: fill
    task: 用括号里动词的主动形动词过去时填空，注意性、数、格。
    why: "先写出阳性过去时：以 [-л]{.ru} 结尾的换成 [-вш-]{.ru}，不以 [-л]{.ru} 结尾的加 [-ш-]{.ru}。第 1 题 [родился → родившийся]{.ru}，[учёный]{.ru} 阳性第一格，[-ся]{.ru} 保留。第 2 题 [вырос]{.ru} 没有 [-л]{.ru}，加 [-ш-]{.ru}：[выросший]{.ru}，[о мальчике]{.ru} 阳性第六格 → [выросшем]{.ru}。第 3 题 [принёс → принёсш-]{.ru}，[работа]{.ru} 阴性第一格 → [принёсшая]{.ru}。第 4 题 [сомневались → сомневавш-ся]{.ru}，[химикам]{.ru} 复数第三格 → [сомневавшимся]{.ru}。第 5 题 [пришёл]{.ru} 不能按规则变，形动词是 [пришедший]{.ru}，[студентов]{.ru} 复数第四格（动物名词同第二格）→ [пришедших]{.ru}。第 6 题 [отдала → отдавш-]{.ru}，[о матери]{.ru} 阴性第六格 → [отдавшей]{.ru}。"
    items:
      - stem: Таблицу создал учёный, ___ в Тобольске.
        hint: родиться
        accept: ["родившийся"]
      - stem: Мы читали о мальчике, ___ рядом со стекольным заводом.
        hint: вырасти
        accept: ["выросшем"]
      - stem: Работа, ___ Менделееву славу, стала основой современной химии.
        hint: принести
        accept: ["принёсшая"]
      - stem: Менделеев ответил химикам, ___ в его системе.
        hint: сомневаться
        accept: ["сомневавшимся"]
      - stem: Профессор поблагодарил студентов, ___ на лекцию.
        hint: прийти
        accept: ["пришедших"]
      - stem: Менделеев часто вспоминал о матери, ___ детям все свои силы.
        hint: отдать
        accept: ["отдавшей"]

  - id: e3
    type: rewrite
    task: 把 [который]{.ru} 从句改成主动形动词短语。
    example:
      cue: Отец, который работал директором гимназии, рано ослеп.
      answer: Отец, работавший директором гимназии, рано ослеп.
    why: "从句的过去时动词换成过去时形动词，体不变：未完成体 [мечтала → мечтавшая]{.ru}，完成体 [открыл → открывший]{.ru}。第 1 题 [мать]{.ru} 阴性第一格 → [мечтавшая]{.ru}。第 2 题 [учёному]{.ru} 阳性第三格，[открыл → открывшему]{.ru}。第 3 题 [слышал → слышавший]{.ru}，阳性第一格。第 4 题 [умер]{.ru} 没有 [-л]{.ru}，形动词 [умерший]{.ru}，[о человеке]{.ru} 第六格 → [умершем]{.ru}。"
    items:
      - cue: Мать, которая мечтала дать сыну образование, повезла его в столицу.
        accept: ["Мать, мечтавшая дать сыну образование, повезла его в столицу.", "Мечтавшая дать сыну образование мать повезла его в столицу."]
      - cue: Химики написали письмо французскому учёному, который открыл галлий.
        accept: ["Химики написали письмо французскому учёному, открывшему галлий.", "Химики написали письмо открывшему галлий французскому учёному."]
      - cue: Менделеев, который слышал эту легенду много раз, только смеялся.
        accept: ["Менделеев, слышавший эту легенду много раз, только смеялся.", "Слышавший эту легенду много раз Менделеев только смеялся."]
      - cue: Мы долго говорили о человеке, который умер в 1907 году.
        accept: ["Мы долго говорили о человеке, умершем в 1907 году.", "Мы долго говорили об умершем в 1907 году человеке."]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题学化学是五十年前的事，早已结束，谓语 [помнит]{.ru} 是现在时，只能用过去时形动词 [изучавший]{.ru}；[изучающий]{.ru} 是“现在正在学的”；[изучавшего]{.ru} 格不对，[дед]{.ru} 是第一格。第 2 题“得到了新元素的学者”说的是一次完成、有结果的动作，用完成体 [получившие]{.ru}；[получавшие]{.ru} 是“经常得到”。第 3 题 [выросший]{.ru}：[вырос]{.ru} 不以 [-л]{.ru} 结尾，加 [-ш-]{.ru}，没有 [выросвший]{.ru}；[выросшие]{.ru} 是复数，和 [мальчик]{.ru} 不一致。第 4 题被说明的是 [таблицу]{.ru}，它不是动作的发出者，而是 [Менделеев назвал]{.ru} 的对象，不能用主动形动词，只能用 [которую]{.ru}。"
    items:
      - stem: Мой дед, ___ химию в институте пятьдесят лет назад, до сих пор помнит таблицу Менделеева.
        options: [изучающий, изучавший, изучавшего]
        answer: изучавший
      - stem: Учёные, ___ новый элемент в 1955 году, дали ему имя Менделеева.
        options: [получавшие, получившие, получающие]
        answer: получившие
      - stem: Мальчик, ___ рядом с заводом, рано заинтересовался химией.
        options: [выросший, выросвший, выросшие]
        answer: выросший
      - stem: Менделеев отправил химикам таблицу, ___ он назвал «Опыт системы элементов».
        options: [назвавшую, которая, которую]
        answer: которую

  - id: e5
    type: translate
    task: 翻译下列句子，用主动形动词过去时。
    items:
      - zh: 怀疑门捷列夫体系的学者们承认了他是对的。
        accept: ["Учёные, сомневавшиеся в системе Менделеева, признали, что он был прав.", "Сомневавшиеся в системе Менделеева учёные признали, что он был прав.", "Учёные, которые сомневались в системе Менделеева, признали, что он был прав.", "Учёные, сомневавшиеся в системе Менделеева, признали, что он прав."]
        rubric: ["[сомневавшиеся]{.ru}：未完成体过去时形动词，[-ся]{.ru} 保留", "[сомневаться в чём]{.ru}：[в системе]{.ru} 第六格"]
      - zh: 在西伯利亚长大的门捷列夫发现了周期律。
        accept: ["Менделеев, выросший в Сибири, открыл периодический закон.", "Выросший в Сибири Менделеев открыл периодический закон.", "Менделеев, который вырос в Сибири, открыл периодический закон."]
        rubric: ["[выросший]{.ru}：[вырос]{.ru} 不以 [-л]{.ru} 结尾，加 [-ш-]{.ru}", "[периодический закон]{.ru}；[открыть закон]{.ru} 发现定律"]
      - zh: 我们读了一本书，讲的是一位一生都在研究化学元素的学者。
        accept: ["Мы прочитали книгу об учёном, всю жизнь изучавшем химические элементы.", "Мы прочитали книгу об учёном, изучавшем химические элементы всю жизнь.", "Мы прочитали книгу об учёном, который всю жизнь изучал химические элементы.", "Мы прочитали книгу об учёном, который изучал химические элементы всю жизнь.", "Мы читали книгу об учёном, всю жизнь изучавшем химические элементы.", "Мы читали книгу об учёном, который всю жизнь изучал химические элементы.", "Мы прочитали книгу о всю жизнь изучавшем химические элементы учёном."]
        rubric: ["[книга о ком]{.ru}：第六格 [об учёном]{.ru}", "[изучавшем]{.ru}：未完成体过去时形动词，“一生都在研究”是已经结束的持续动作，用过去时；阳性第六格与 [учёном]{.ru} 一致；用 [который]{.ru} 从句也可以"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：出身和家庭；母亲和学习；《化学原理》和元素的排列；空位和预言的证实；门捷列夫的影响。每项一到两句，保留关键年份，至少用两处主动形动词过去时。
        length: 120–150
        model: "Дмитрий Менделеев родился в 1834 году в Тобольске, в большой семье. Его отец рано ослеп, и семью кормила мать, управлявшая стекольным заводом. Отец умер, и в 1849 году мать, мечтавшая дать сыну хорошее образование, повезла его в Москву, а потом в Петербург, где в 1850 году он поступил в Главный педагогический институт. Позже Менделеев стал профессором Петербургского университета. Для студентов он начал писать учебник «Основы химии», и перед ним встала задача: в каком порядке рассказывать об элементах? Он расположил элементы по атомному весу и увидел, что их свойства периодически повторяются. Так в 1869 году появилась его таблица. В ней были пустые места: Менделеев предсказал свойства элементов, которые ещё не нашли. Когда в 1875 году открыли галлий, учёные, сомневавшиеся в его системе, признали, что он был прав. Сегодня закон, который открыл Менделеев, лежит в основе таблицы, висящей в каждом кабинете химии."
        rubric: ["提纲五项都有，顺序与课文一致", "年份准确：1834、1869、1875", "至少两处主动形动词过去时，形式正确、与名词一致", "120–150 词"]
        notes: "范文约 130 词。家庭、学习两项各压成一两句，省去了德国、传说、门捷列夫的其他工作等细节。用了三个过去时形动词短语：[управлявшая стекольным заводом]{.ru}、[мечтавшая дать сыну хорошее образование]{.ru}、[сомневавшиеся в его системе]{.ru}；最后一句的 [висящей]{.ru} 是第 1 课的现在时形动词，说的是今天的情况。注意 [таблицы, висящей]{.ru}：形动词跟着 [таблицы]{.ru} 用第二格。"
