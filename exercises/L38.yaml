lesson: L38
grammar: "带 [-ся]{.ru} 的动词：辅音后加 [-ся]{.ru}、元音后加 [-сь]{.ru}；[-ся]{.ru} 动词不带第四格宾语；[учи́ться]{.ru}、[занима́ться]{.ru}、[учи́ть]{.ru} 的区别。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的正确形式。
    why: 先按普通动词变位，再加 [-ся]{.ru}（辅音后）或 [-сь]{.ru}（元音后）。[учи́ться]{.ru} 是第二变位：[учу́сь, у́чишься, у́чатся]{.ru}，[ч]{.ru} 后面写 [у]{.ru}、[а]{.ru}；[занима́ться]{.ru}、[возвраща́ться]{.ru} 是第一变位。过去时阳性 [-лся]{.ru}，阴性 [-лась]{.ru}。
    items:
      - stem: Где ты ___?
        hint: учи́ться
        accept: [у́чишься]
      - stem: Я ___ в университе́те.
        hint: учи́ться
        accept: [учу́сь]
      - stem: Ве́чером мы ___ в библиоте́ке.
        hint: занима́ться
        accept: [занима́емся]
      - stem: Уро́ки ___ у́тром.
        hint: начина́ться
        accept: [начина́ются]
      - stem: По́сле шко́лы Ми́ша ___ домо́й.
        hint: возвраща́ться
        accept: [возвраща́ется]
      - stem: Где ___ ва́ша шко́ла?
        hint: находи́ться
        accept: [нахо́дится]
      - stem: Ра́ньше А́нна ___ в э́той шко́ле.
        hint: учи́ться
        accept: [учи́лась]
      - stem: В Пеки́не Ван Лэй ___ в университе́те.
        hint: учи́ться
        accept: [учи́лся]
      - stem: Вы ___ ка́ждый день?
        hint: занима́ться
        accept: [занима́етесь]
      - stem: А́нна ___ в Москве́.
        hint: роди́ться，过去时
        accept: [родила́сь]

  - id: e2
    type: choice
    task: 选择 [учи́ться]{.ru}、[занима́ться]{.ru} 或 [учи́ть]{.ru} 的正确形式。
    why: 在哪个学校读书用 [учи́ться]{.ru}；坐下来用功、做功课用 [занима́ться]{.ru}；学、背具体的东西（有第四格宾语）用 [учи́ть]{.ru}。第 2 题“在图书馆学习”指自习，不能用 [учу́сь]{.ru}。
    items:
      - stem: Ми́ша ___ в шко́ле.
        options: [у́чится, занима́ется, у́чит]
        answer: у́чится
      - stem: Ве́чером я ___ в библиоте́ке.
        options: [учу́сь, занима́юсь, учу́]
        answer: занима́юсь
      - stem: Я ___ но́вые слова́.
        options: [учу́сь, занима́юсь, учу́]
        answer: учу́
      - stem: А́нна ___ на филологи́ческом факульте́те.
        options: [у́чится, занима́ется, у́чит]
        answer: у́чится
      - stem: Сейча́с Ми́ша не ___, он игра́ет на компью́тере.
        options: [у́чится, занима́ется, у́чит]
        answer: занима́ется

  - id: e3
    type: choice
    task: 选择带 [-ся]{.ru} 或不带 [-ся]{.ru} 的动词。
    why: 有第四格宾语时用不带 [-ся]{.ru} 的动词（[начина́ть уро́к]{.ru}），没有宾语、事情本身“开始”时用 [-ся]{.ru} 动词（[уро́к начина́ется]{.ru}）。
    items:
      - stem: О́льга Ви́кторовна ___ уро́к.
        options: [начина́ет, начина́ется]
        answer: начина́ет
      - stem: Уро́к ___.
        options: [начина́ет, начина́ется]
        answer: начина́ется
      - stem: Фильм ___ ве́чером.
        options: [начина́ет, начина́ется]
        answer: начина́ется
      - stem: Ми́ша ___ занима́ться.
        options: [начина́ет, начина́ется]
        answer: начина́ет

  - id: e4
    type: translate
    task: 译成俄语。
    why: 注意区分“上学/读书”（[учи́ться]{.ru}）和“学习/用功”（[занима́ться]{.ru}）。
    items:
      - zh: ——你在哪儿上学？——我在莫斯科大学读书。
        accept: ["— Где ты у́чишься? — Я учу́сь в МГУ.", "— Где ты у́чишься? — Я учу́сь в Моско́вском университе́те."]
        rubric: ["用 [учи́ться]{.ru}", "[в]{.ru} + 第六格"]
      - zh: 晚上我在家学习。
        accept: ["Ве́чером я занима́юсь до́ма.", "Я занима́юсь до́ма ве́чером.", "Ве́чером я до́ма занима́юсь.", "До́ма я занима́юсь ве́чером."]
        rubric: ["“学习、用功”用 [занима́ться]{.ru}，不用 [учи́ться]{.ru}", "“在家”用 [до́ма]{.ru}"]
      - zh: 课早上开始，下午结束。
        accept: ["Уро́ки начина́ются у́тром, а конча́ются днём.", "Уро́ки начина́ются у́тром и конча́ются днём.", "Уро́к начина́ется у́тром, а конча́ется днём.", "Уро́к начина́ется у́тром и конча́ется днём."]
        rubric: ["没有宾语，用 [начина́ться]{.ru}、[конча́ться]{.ru}", "“早上”“下午”用 [у́тром]{.ru}、[днём]{.ru}"]
      - zh: 以前安娜也在这所学校上学。
        accept: ["Ра́ньше А́нна то́же учи́лась в э́той шко́ле.", "А́нна ра́ньше то́же учи́лась в э́той шко́ле.", "А́нна то́же ра́ньше учи́лась в э́той шко́ле.", "А́нна то́же учи́лась в э́той шко́ле ра́ньше."]
        rubric: ["过去时阴性 [учи́лась]{.ru}", "[в э́той шко́ле]{.ru}：第六格"]
      - zh: 我们的学校在公园对面。
        accept: ["На́ша шко́ла нахо́дится напро́тив па́рка.", "На́ша шко́ла напро́тив па́рка."]
        rubric: ["[нахо́дится]{.ru} 可以省去", "[напро́тив па́рка]{.ru}：第二格"]

  - id: e5
    type: open
    task: 缩写。
    items:
      - prompt: 按下列问题复述课文，连成一段话：[Что де́лает Ми́ша ве́чером?]{.ru} [Где он у́чится?]{.ru} [Когда́ начина́ются и конча́ются уро́ки?]{.ru} [Ско́лько лет у́чатся в шко́ле в Росси́и и в Кита́е?]{.ru} [Где учи́лся и где сейча́с у́чится Ван Лэй?]{.ru} [Что де́лает Ми́ша пото́м?]{.ru}
        length: 50–80
        model: |
          Ве́чером Ми́ша игра́ет на компью́тере и не занима́ется. Он у́чится в шко́ле напро́тив па́рка. Уро́ки начина́ются ра́но у́тром, а конча́ются днём. В Росси́и в шко́ле у́чатся оди́ннадцать лет, а в Кита́е двена́дцать. Ван Лэй учи́лся в Пеки́нском университе́те, а сейча́с у́чится в МГУ. Ка́ждый ве́чер он занима́ется. Пото́м Ми́ша закрыва́ет компью́тер и начина́ет занима́ться.
        rubric: ["正确使用至少四个不同的 [-ся]{.ru} 动词", "区分 [учи́ться]{.ru} 与 [занима́ться]{.ru}", "过去时 [учи́лся]{.ru} 与现在时 [у́чится]{.ru} 对比"]
        notes: 范文按问题顺序，用第三人称把对话改写成叙述，每个问题一句话。王磊的话 [учу́сь здесь]{.ru} 改成 [у́чится в МГУ]{.ru}；米沙的 [занима́юсь]{.ru} 改成 [занима́ется]{.ru}。结尾一句保持原文，点明米沙听了王磊的话后的变化。
