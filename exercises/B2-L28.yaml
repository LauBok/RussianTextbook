lesson: B2-L28
grammar: "过去时中体的用法：完成体表示结果；未完成体表示过程、持续、反复和单纯的事实；[не чита́л]{.ru} 与 [не прочита́л]{.ru}；结果被取消时用未完成体（[брал / взял]{.ru}）。"
exercises:

  - id: e1
    type: choice
    task: 选择动词的体。
    why: "第 1 题有 [це́лый час]{.ru}，说的是持续多久，用未完成体。第 2 题“已经读完、现在可以还书了”，关心结果，用完成体。第 3 题只问做没做过，用未完成体；汉语说“写过”，很多人会误选完成体。第 4 题 [два ра́за]{.ru} 表示次数，用未完成体。第 5 题两个动作一个接一个完成，用完成体。第 6 题 [и ничего́ не запо́мнил]{.ru}：读了，但没有记住的结果，前一个动词说的是过程，用未完成体。"
    items:
      - stem: Вчера́ Ми́ша ___ пье́су це́лый час.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: Я уже́ ___ твою́ кни́гу, вот она́.
        options: [чита́л, прочита́л]
        answer: прочита́л
      - stem: — Ты ра́ньше ___ сочине́ния по-ру́сски? — Да, в шко́ле.
        options: [писа́л, написа́л]
        answer: писа́л
      - stem: Э́тот рома́н я ___ два ра́за.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: А́нна ___ с по́лки слова́рь и дала́ его́ Ми́ше.
        options: [брала́, взяла́]
        answer: взяла́
      - stem: Он до́лго ___ стихи́, но ничего́ не запо́мнил.
        options: [чита́л, прочита́л]
        answer: чита́л

  - id: e2
    type: choice
    task: 选择 [не]{.ru} + 未完成体 或 [не]{.ru} + 完成体。
    why: "[не]{.ru} + 未完成体表示根本没做过这件事；[не]{.ru} + 完成体表示做了、但没有做完或没有达到结果。第 1 题有 [никогда́]{.ru}，从来没读过这位作家的书，用 [не чита́л]{.ru}。第 2 题有 [ещё]{.ru} 和 [оста́лось сто страни́ц]{.ru}，说明正在读、还没读完。第 3 题“开始写了，可是……没写完”，用完成体。第 4 题“这部剧本我不知道”，即没读过。"
    items:
      - stem: Я никогда́ не ___ э́того писа́теля.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: Я ещё не ___ уче́бник, оста́лось сто страни́ц.
        options: [чита́л, прочита́л]
        answer: прочита́л
      - stem: Ми́ша на́чал сочине́ние в суббо́ту, но не ___ его́.
        options: [писа́л, написа́л]
        answer: написа́л
      - stem: Я не зна́ю э́ту пье́су, я её не ___.
        options: [чита́л, прочита́л]
        answer: чита́л

  - id: e3
    type: fill
    task: 用括号里的动词的过去时填空，注意体。
    why: "第 1 题问事实，答句也只说事实，用未完成体 [чита́ла]{.ru}（主语 [А́нна]{.ru} 是阴性）。第 2 题“背会了，现在能背出来”，结果还在，用完成体。第 3 题词典已经放回书架，拿走的结果取消了，用未完成体 [брал]{.ru}。第 4 题 [всё воскресе́нье]{.ru} 表示持续，用未完成体。第 5 题“写上了，书里现在有”，结果还在，用完成体 [написа́л]{.ru}。"
    items:
      - stem: — А́нна, ты чита́ла «Ревизо́ра»? — Да, ___.
        hint: чита́ть / прочита́ть
        accept: ["чита́ла"]
      - stem: Ми́ша ___ стихи́ Пу́шкина и тепе́рь зна́ет их наизу́сть.
        hint: учи́ть / вы́учить
        accept: ["вы́учил"]
      - stem: — Ты ___ мой слова́рь? — Да, но я его́ уже́ поста́вил на по́лку.
        hint: брать / взять
        accept: ["брал", "брала́"]
      - stem: Ван Лэй ___ уче́бник всё воскресе́нье.
        hint: чита́ть / прочита́ть
        accept: ["чита́л"]
      - stem: Он ___ в кни́ге перево́д всех тру́дных слов.
        hint: писа́ть / написа́ть
        accept: ["написа́л"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题问做没做过，用未完成体。第 2 题“读完了”有结果，用完成体；“读了一个小时”是持续，用未完成体。第 3 题“没读完”用 [не прочита́л]{.ru}。第 4 题“读过两遍”说次数，用未完成体。第 5 题前一句问事实，用 [чита́л]{.ru}；答句说的是正在读、还没有结果，用 [ещё не прочита́л]{.ru}。"
    items:
      - zh: 你读过《上尉的女儿》吗？——读过。
        accept: ["— Ты чита́л «Капита́нскую до́чку»? — Чита́л.", "— Ты чита́ла «Капита́нскую до́чку»? — Чита́ла.", "— Вы чита́ли «Капита́нскую до́чку»? — Чита́л.", "— Вы чита́ли «Капита́нскую до́чку»? — Чита́ла.", "— Ты чита́л «Капита́нскую до́чку»? — Да, чита́л.", "— Ты чита́ла «Капита́нскую до́чку»? — Да, чита́ла.", "— Вы чита́ли «Капита́нскую до́чку»? — Да, чита́л.", "— Вы чита́ли «Капита́нскую до́чку»? — Да, чита́ла."]
        rubric: ["问事实用未完成体 [чита́л]{.ru}，不能用 [прочита́л]{.ru}", "作品名做宾语用第四格 [«Капита́нскую до́чку»]{.ru}"]
      - zh: 昨天我读了一个小时，可只读完了十页。
        accept: ["Вчера́ я чита́л час, но прочита́л то́лько де́сять страни́ц.", "Вчера́ я чита́ла час, но прочита́ла то́лько де́сять страни́ц.", "Вчера́ я чита́л оди́н час, но прочита́л то́лько де́сять страни́ц.", "Вчера́ я чита́ла оди́н час, но прочита́ла то́лько де́сять страни́ц.", "Я вчера́ чита́л час, но прочита́л то́лько де́сять страни́ц.", "Я вчера́ чита́ла час, но прочита́ла то́лько де́сять страни́ц."]
        rubric: ["持续用 [чита́л]{.ru}，结果用 [прочита́л]{.ru}", "[де́сять страни́ц]{.ru}：复数第二格"]
      - zh: 米沙还没读完这个剧本。
        accept: ["Ми́ша ещё не прочита́л э́ту пье́су.", "Ми́ша ещё не прочита́л пье́су."]
        rubric: ["“没读完”用 [не прочита́л]{.ru}"]
      - zh: 这本小说我读过两遍：一遍读译本，一遍读原文。
        accept: ["Э́тот рома́н я чита́л два ра́за: в перево́де и в оригина́ле.", "Э́тот рома́н я чита́ла два ра́за: в перево́де и в оригина́ле.", "Я чита́л э́тот рома́н два ра́за: в перево́де и в оригина́ле.", "Я чита́ла э́тот рома́н два ра́за: в перево́де и в оригина́ле.", "Э́тот рома́н я чита́л два ра́за: снача́ла в перево́де, а пото́м в оригина́ле.", "Э́тот рома́н я чита́ла два ра́за: снача́ла в перево́де, а пото́м в оригина́ле.", "Я чита́л э́тот рома́н два ра́за: снача́ла в перево́де, а пото́м в оригина́ле.", "Я чита́ла э́тот рома́н два ра́за: снача́ла в перево́де, а пото́м в оригина́ле."]
        rubric: ["说次数用未完成体 [чита́л два ра́за]{.ru}", "[в перево́де]{.ru}、[в оригина́ле]{.ru}"]
      - zh: “你读过这部剧本吗？这是八年级的必读书。”——“还没读完。”
        accept: ["— Ты чита́л э́ту пье́су? Э́то обяза́тельная кни́га для восьмо́го кла́сса. — Ещё не прочита́л.", "— Ты чита́ла э́ту пье́су? Э́то обяза́тельная кни́га для восьмо́го кла́сса. — Ещё не прочита́ла.", "— Ты чита́л э́ту пье́су? Э́то обяза́тельная кни́га в восьмо́м кла́ссе. — Ещё не прочита́л.", "— Ты чита́ла э́ту пье́су? Э́то обяза́тельная кни́га в восьмо́м кла́ссе. — Ещё не прочита́ла.", "— Ты чита́л э́ту пье́су? Э́то обяза́тельная кни́га для восьмо́го кла́сса. — Я её ещё не прочита́л.", "— Ты чита́ла э́ту пье́су? Э́то обяза́тельная кни́га для восьмо́го кла́сса. — Я её ещё не прочита́ла."]
        rubric: ["问事实用 [чита́л]{.ru}", "“还没读完”用 [ещё не прочита́л]{.ru}", "“必读书”用 [обяза́тельная кни́га]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что де́лал Ван Лэй в понеде́льник ве́чером? Каку́ю пье́су Ми́ша до́лжен прочита́ть и почему́? Ско́лько раз Ван Лэй чита́л «Ревизо́ра»? Что Ми́ша прочита́л зимо́й? Ско́лько де́йствий Ми́ша прочита́л ве́чером?]{.ru}"
        length: 50–80
        model: "В понеде́льник ве́чером Ван Лэй чита́л уче́бник по исто́рии литерату́ры. Ми́ша до́лжен прочита́ть «Ревизо́ра» Го́голя, потому́ что в пя́тницу у него́ бу́дет контро́льная. Вчера́ он чита́л пье́су це́лый час, но прочита́л то́лько пе́рвое де́йствие. Ван Лэй чита́л «Ревизо́ра» два ра́за и дал Ми́ше свою́ кни́гу. Зимо́й Ми́ша прочита́л «Капита́нскую до́чку». Ве́чером он прочита́л ещё одно́ де́йствие."
        rubric: ["回答全部五个问题", "过程和次数用未完成体（[чита́л це́лый час]{.ru}、[чита́л два ра́за]{.ru}）", "结果用完成体（[прочита́л]{.ru}）"]
        notes: 范文约 55 词，按问题顺序作答。注意同一个动词在不同句子里换体：说读了多久、读过几遍用 [чита́л]{.ru}，说读完了哪部分用 [прочита́л]{.ru}。

  - id: e6
    type: open
    task: 作文。题目：“我读过的一本书”。
    items:
      - prompt: 写一本你读过的书：什么时候读的、读了多久、读的是原文还是译本、读过几遍、书里讲了什么、你喜欢不喜欢。注意区分事实、过程和结果，未完成体和完成体都要用到。
        length: 100–150
        model: |
          Я хочу́ рассказа́ть о кни́ге «Ска́зки» Пу́шкина. Я чита́л её два ра́за. Пе́рвый раз я чита́л её в шко́ле, в перево́де, когда́ мне бы́ло де́сять лет. Тогда́ мне о́чень понра́вилась ска́зка о рыбаке́ и ры́бке. В про́шлом году́ я на́чал чита́ть её в оригина́ле. Снача́ла бы́ло тру́дно: я чита́л ка́ждую ска́зку о́чень до́лго и иска́л все слова́ в словаре́. Одна́жды я чита́л це́лый ве́чер, но прочита́л то́лько две страни́цы. Но я не переста́л чита́ть и в декабре́ прочита́л всю кни́гу. Мно́гие стихи́ я да́же запо́мнил и тепе́рь зна́ю их наизу́сть. Тепе́рь я хочу́ прочита́ть «Капита́нскую до́чку». Мой друг её уже́ прочита́л и говори́т, что э́то о́чень интере́сная кни́га.
        rubric: ["说明读过几遍、读了多久：未完成体", "说明读完了、记住了：完成体", "至少有一处 [ещё не]{.ru} / [уже́]{.ru} + 完成体或否定句", "内容完整：书名、何时读、内容或感受"]
        notes: 范文约 110 词，按时间顺序写：先说读过几遍（未完成体表次数），再说两次阅读的情形。[чита́л це́лый ве́чер, но прочита́л то́лько две страни́цы]{.ru} 把过程和结果放在一句里对比，是本课最典型的句型。结尾转到将来的打算，用 [уже́ прочита́л]{.ru} 说朋友已有的结果。
