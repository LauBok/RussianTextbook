lesson: B3-L56
grammar: "时间表达的书面形式：[в 1879 году]{.ru}（第六格），[в августе 1860 года, в начале 1870-х годов, в конце XIX века]{.ru}（前面有别的词，年份用第二格）；[в 1890-е годы / в 1890-х годах]{.ru}；[с … по …]{.ru}，[к]{.ru} + 第三格，[спустя]{.ru} + 第四格；年龄 [в возрасте … лет]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，回答时写出准确的时间。
    items:
      - prompt: "[Когда и где родился Левитан? Когда он поступил в училище и кто был его учителем? Какая картина принесла ему первое признание? Где он провёл три лета подряд в конце 1880-х годов? Какие картины он написал в 1890-е годы? Когда Левитан умер?]{.ru}"
        length: 70–100
        model: "Исаак Левитан родился в августе 1860 года в местечке Кибарты на западе Российской империи. Осенью 1873 года, в возрасте тринадцати лет, он поступил в Московское училище живописи, ваяния и зодчества; его учителем был Алексей Саврасов. Первое признание ему принесла картина «Осенний день. Сокольники», написанная в 1879 году: её купил Павел Третьяков. В конце 1880-х годов Левитан провёл три лета подряд в Плёсе на Волге. В 1890-е годы он написал «Владимирку», «Над вечным покоем», «Март» и «Золотую осень». Левитан умер в Москве летом 1900 года, не дожив до сорока лет."
        rubric: ["六个问题都回答，时间准确", "[в августе 1860 года]{.ru}、[осенью 1873 года]{.ru}、[летом 1900 года]{.ru}：年份用第二格", "[в 1890-е годы]{.ru} 或 [в 1890-х годах]{.ru}"]
        notes: "这道题主要练时间状语：单独的年份用 [в … году]{.ru}，前面有月份、季节时年份用第二格 [… года]{.ru}。年龄可以用 [в возрасте тринадцати лет]{.ru}、[в тринадцать лет]{.ru} 或 [тринадцатилетний]{.ru}。"

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题年份单独出现，用 [в]{.ru} + 第六格 [году]{.ru}。第 2 题前面有季节 [осенью]{.ru}，年份用第二格 [года]{.ru}；不能再加 [в]{.ru}。第 3 题 [в конце]{.ru} 后面接第二格 [века]{.ru}。第 4 题 [в 1890-е годы]{.ru} 是复数第四格；如果用第六格要写 [в 1890-х годах]{.ru}，两种格式不能混用：[1890-е]{.ru} 和 [годах]{.ru} 不配。第 5 题 [с … по …]{.ru} 中 [по]{.ru} 要求第四格 [год]{.ru}。第 6 题 [к]{.ru} + 第三格 [началу]{.ru}，“到……时（已经）”。"
    items:
      - stem: Левитан написал «Владимирку» в 1892 ___.
        options: [году, года, год]
        answer: году
      - stem: Он поступил в училище осенью 1873 ___.
        options: [году, года, годом]
        answer: года
      - stem: Левитан — художник конца XIX ___.
        options: [века, веке, век]
        answer: века
      - stem: Главные работы Левитана появились в 1890-е ___.
        options: [годах, годы, годов]
        answer: годы
      - stem: Он учился в училище с 1873 по 1884 ___.
        options: [года, году, год]
        answer: год
      - stem: К ___ 1890-х годов Левитан стал известным художником.
        options: [начало, началу, начала]
        answer: началу

  - id: e3
    type: rewrite
    task: 把年龄的说法改成 [в возрасте]{.ru} + 第二格。
    example:
      cue: Тринадцатилетний Исаак поступил в училище.
      answer: В возрасте тринадцати лет Исаак поступил в училище.
    why: "[в возрасте]{.ru} 后面数词和名词都用第二格：[тринадцать → тринадцати]{.ru}，[девятнадцать → девятнадцати]{.ru}，[тридцать восемь → тридцати восьми]{.ru}；[год]{.ru} 的复数第二格是 [лет]{.ru}。第 3 题合成数词每个部分都变格。第 4 题 [один]{.ru} 结尾的数词后面用 [года]{.ru}：[в возрасте двадцати одного года]{.ru}，不说 [лет]{.ru}。"
    items:
      - cue: Девятнадцатилетний студент написал картину «Осенний день. Сокольники».
        accept: ["В возрасте девятнадцати лет студент написал картину «Осенний день. Сокольники».", "Студент написал картину «Осенний день. Сокольники» в возрасте девятнадцати лет."]
      - cue: В тридцать лет художник обычно уже имеет своё имя.
        accept: ["В возрасте тридцати лет художник обычно уже имеет своё имя.", "Художник в возрасте тридцати лет обычно уже имеет своё имя."]
      - cue: Мой дед начал рисовать в тридцать восемь лет.
        accept: ["Мой дед начал рисовать в возрасте тридцати восьми лет.", "В возрасте тридцати восьми лет мой дед начал рисовать."]
      - cue: В двадцать один год мой брат окончил университет.
        accept: ["В возрасте двадцати одного года мой брат окончил университет.", "Мой брат окончил университет в возрасте двадцати одного года."]

  - id: e4
    type: fill
    task: 用括号里的词填空，注意年份和时间名词的格。
    why: "第 1 题前面有月份 [в августе]{.ru}，年份用第二格：[1860 года]{.ru}，读作 [тысяча восемьсот шестидесятого года]{.ru}；填空只写 [года]{.ru}。第 2 题 [в середине]{.ru} 后用第二格，年代用复数第二格 [годов]{.ru}。第 3 题 [спустя]{.ru} + 第四格：[сорок лет]{.ru}，[сорок]{.ru} 第四格同第一格，名词 [лет]{.ru}。第 4 题 [в течение]{.ru} + 第二格：[двух лет]{.ru}。第 5 题 [с]{.ru} + 第二格：[1891 года]{.ru}。"
    items:
      - stem: Левитан родился в августе 1860 ___.
        hint: год
        accept: ["года"]
      - stem: В середине 1870-х ___ он потерял родителей.
        hint: годы
        accept: ["годов"]
      - stem: Спустя ___ с лишним прах художника перенесли на Новодевичье кладбище.
        hint: сорок лет
        accept: ["сорок лет"]
      - stem: В течение ___ он потерял мать и отца.
        hint: два года
        accept: ["двух лет"]
      - stem: С 1891 ___ Левитан был членом Товарищества.
        hint: год
        accept: ["года"]

  - id: e5
    type: translate
    task: 翻译下列句子，注意时间状语的格式。
    items:
      - zh: 1873 年秋天，十三岁的伊萨克进了学校。
        accept: ["Осенью 1873 года тринадцатилетний Исаак поступил в училище.", "Осенью 1873 года, в возрасте тринадцати лет, Исаак поступил в училище.", "Осенью 1873 года Исаак в тринадцать лет поступил в училище.", "Осенью 1873 года тринадцатилетний Исаак поступил в школу."]
        rubric: ["[осенью 1873 года]{.ru}：年份第二格，前面不加 [в]{.ru}", "年龄用 [тринадцатилетний]{.ru} 或 [в возрасте тринадцати лет]{.ru}", "[поступить в]{.ru} + 第四格"]
      - zh: 九十年代他画出了自己最好的作品。
        accept: ["В 1890-е годы он написал свои лучшие картины.", "В девяностые годы он написал свои лучшие картины.", "В 1890-х годах он написал свои лучшие картины.", "В девяностых годах он написал свои лучшие картины.", "В 1890-е годы он написал свои лучшие работы.", "В девяностые годы он написал свои лучшие работы."]
        rubric: ["[в 1890-е годы]{.ru}（第四格）或 [в 1890-х годах]{.ru}（第六格），两种格式不能混用"]
      - zh: 他不到四十岁就去世了。
        accept: ["Он умер, не дожив до сорока лет.", "Не дожив до сорока лет, он умер."]
        rubric: ["[не дожив до сорока лет]{.ru}：副动词短语，[до]{.ru} + 第二格"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，用具体作品说明理由，最后得出结论。
    items:
      - prompt: "[Почему Левитана называют создателем «пейзажа настроения»? Согласны ли вы с этим?]{.ru} 至少分析两幅作品，并用三处书面的时间表达。"
        length: 180–220
        model: "Левитана часто называют создателем «пейзажа настроения». По-моему, это очень точное название. До него многие русские художники изображали природу как красивый вид: горы, леса, реки, которые зритель рассматривает со стороны. Левитан пошёл другим путём. На его картинах нет ничего необыкновенного: простая дорога, берёзы, маленькая церковь, снег в марте. Но каждый пейзаж передаёт определённое чувство. Например, «Владимирка», написанная в 1892 году, — это просто пустая дорога под серым небом. Однако зритель, который знает, что по этой дороге когда-то вели людей на каторгу, чувствует тяжёлую грусть. А в «Марте», созданном три года спустя, всё наоборот: яркое солнце, синие тени на снегу, и кажется, что весна скоро придёт. Его картины похожи скорее на музыку или на стихи, чем на рассказ. Мне кажется, секрет Левитана в том, что он писал не только то, что видел, но и то, что переживал. Не случайно он почти никогда не изображал людей: человек на его картинах — это сам зритель. Кроме того, многие его работы, созданные в конце XIX века, до сих пор узнаёт каждый русский школьник. Поэтому я думаю, что Левитан не просто рисовал природу, а научил людей видеть в ней собственную душу. Именно за это его и любят уже больше ста лет."
        rubric: ["开头明确表示同意或不同意", "对比列维坦和以前的风景画", "至少分析两幅作品，说明各自传达的情绪", "至少三处书面时间表达，格用对", "有结论", "180–220 词"]
        notes: "范文约 195 词。论证用了“对比 + 举例”：先说以前的画家把风景当作美丽的景色来画，再说列维坦画的是普通的东西，却传达情绪；接着用《弗拉基米尔路》（忧伤）和《三月》（明朗）两个相反的例子证明。[Мне кажется, секрет … в том, что…]{.ru} 是点出核心观点的常用句型。时间表达：[в 1892 году]{.ru}、[три года спустя]{.ru}、[в конце XIX века]{.ru}、[больше ста лет]{.ru}。"
