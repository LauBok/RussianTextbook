lesson: B2-L29
grammar: "将来时中体的用法：未完成体将来时表示过程、反复和活动本身，完成体将来时表示结果和一次具体的动作；[сдава́ть / сдать]{.ru}；[когда́]{.ru}、[е́сли]{.ru} 后用将来时。"
exercises:

  - id: e1
    type: choice
    task: 选择未完成体将来时或完成体将来时。
    why: "第 1 题 [все выходны́е]{.ru} 表示持续，用未完成体。第 2 题“别担心”之后说的是结果：考得过，用完成体。第 3 题问打算做什么，问的是活动本身，用未完成体。第 4 题“先……然后……”是先后两个完成的动作，用完成体。第 5 题 [ка́ждый день]{.ru} 表示反复，用未完成体。第 6 题“星期五前背不完”，完成体将来时的否定表示做不到。"
    items:
      - stem: Все выходны́е я ___ исто́рию.
        options: [бу́ду повторя́ть, повторю́]
        answer: бу́ду повторя́ть
      - stem: Не волну́йся, ты обяза́тельно ___ экза́мен.
        options: [бу́дешь сдава́ть, сдашь]
        answer: сдашь
      - stem: — Что ты ___ в суббо́ту? — Бу́ду отдыха́ть.
        options: [бу́дешь де́лать, сде́лаешь]
        answer: бу́дешь де́лать
      - stem: Снача́ла я ___ сообще́ние ма́ме, а пото́м пойду́ в кафе́.
        options: [бу́ду писа́ть, напишу́]
        answer: напишу́
      - stem: В Каза́ни я ___ роди́телям ка́ждый день.
        options: [бу́ду звони́ть, позвоню́]
        answer: бу́ду звони́ть
      - stem: Биле́тов о́чень мно́го, я не ___ их все до пя́тницы.
        options: [бу́ду учи́ть, вы́учу]
        answer: вы́учу

  - id: e2
    type: fill
    task: 用括号里动词的将来时填空。
    why: "第 1、2 题是 [когда́]{.ru} 句，两件事一先一后，[когда́]{.ru} 部分用完成体将来时，不能用现在时：[сдам]{.ru}、[отве́тишь]{.ru}。第 3 题 [е́сли]{.ru} 后同样用将来时。第 4 题 [сдава́ть]{.ru} 是“参加考试”，说的是星期五要考，不是考过，用未完成体。第 5 题 [вы́спаться]{.ru} 第一人称单数有 [п → пл]{.ru} 交替：[вы́сплюсь]{.ru}。"
    items:
      - stem: Когда́ я ___ после́дний экза́мен, я пое́ду в Каза́нь.
        hint: сдать
        accept: ["сдам"]
      - stem: Когда́ ты ___ на все вопро́сы, мы пойдём в кафе́.
        hint: отве́тить
        accept: ["отве́тишь"]
      - stem: Е́сли Ди́ма ___ все экза́мены без тро́ек, он бу́дет получа́ть стипе́ндию.
        hint: сдать
        accept: ["сдаст"]
      - stem: В пя́тницу Ван Лэй ___ у́стный экза́мен по литерату́ре.
        hint: сдава́ть
        accept: ["бу́дет сдава́ть"]
      - stem: По́сле экза́менов я снача́ла ___!
        hint: вы́спаться
        accept: ["вы́сплюсь"]

  - id: e3
    type: choice
    task: 选择 [сдава́ть]{.ru} 或 [сдать]{.ru}、[гото́виться]{.ru} 或 [подгото́виться]{.ru}。
    why: "[сдава́ть]{.ru} 是参加考试的过程，[сдать]{.ru} 是考试通过的结果；[гото́виться]{.ru} 是准备的过程，[подгото́виться]{.ru} 是准备好了。第 1 题“考了，可是没考过”，前一个说过程、后一个说结果。第 2 题 [всю неде́лю]{.ru} 是持续。第 3 题“准备好了，所以不担心”，说的是结果。第 4 题问明天上午干什么，问的是活动，回答“要去考试”，用未完成体；[Сдам]{.ru} 说的是考过的结果，不回答这个问题。"
    items:
      - stem: Пьер ___ экза́мен, но не сдал.
        options: [сдава́л, сдал]
        answer: сдава́л
      - stem: Всю неде́лю А́нна ___ к экза́мену.
        options: [гото́вилась, подгото́вилась]
        answer: гото́вилась
      - stem: Я хорошо́ ___ и совсе́м не волну́юсь.
        options: [гото́вился, подгото́вился]
        answer: подгото́вился
      - stem: — Что ты бу́дешь де́лать за́втра у́тром? — ___ зачёт по исто́рии.
        options: [Бу́ду сдава́ть, Сдам]
        answer: Бу́ду сдава́ть

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“考完以后”用 [когда́]{.ru} + 完成体将来时。第 2 题整个晚上是持续，用未完成体将来时。第 3 题“一定能考过”是结果。第 4 题“我来问，你来答”是活动本身，用未完成体。"
    items:
      - zh: 等我考完试，我们就去喀山。
        accept: ["Когда́ я сдам экза́мены, мы пое́дем в Каза́нь.", "Когда́ сдам экза́мены, мы пое́дем в Каза́нь.", "Мы пое́дем в Каза́нь, когда́ я сдам экза́мены."]
        rubric: ["[когда́]{.ru} 部分用完成体将来时 [сдам]{.ru}，不能用现在时", "“去喀山”用 [пое́дем в Каза́нь]{.ru}"]
      - zh: 今天整个晚上我都要背考签。
        accept: ["Сего́дня весь ве́чер я бу́ду учи́ть биле́ты.", "Сего́дня я бу́ду учи́ть биле́ты весь ве́чер.", "Весь ве́чер сего́дня я бу́ду учи́ть биле́ты.", "Я сего́дня весь ве́чер бу́ду учи́ть биле́ты."]
        rubric: ["持续用未完成体将来时 [бу́ду учи́ть]{.ru}", "[весь ве́чер]{.ru} 用第四格，不加前置词"]
      - zh: 别担心，你一定能考过。
        accept: ["Не волну́йся, ты обяза́тельно сдашь.", "Не волну́йся, ты обяза́тельно сдашь экза́мен.", "Не волну́йтесь, вы обяза́тельно сдади́те.", "Не волну́йтесь, вы обяза́тельно сдади́те экза́мен."]
        rubric: ["“考过”是结果，用完成体 [сдашь]{.ru}", "[сдать]{.ru} 的变位：[сдам, сдашь, сдаст, сдади́м, сдади́те, сдаду́т]{.ru}"]
      - zh: 我来问，你来答。
        accept: ["Я бу́ду спра́шивать, а ты бу́дешь отвеча́ть.", "Я бу́ду спра́шивать, а вы бу́дете отвеча́ть."]
        rubric: ["活动本身用未完成体将来时", "两部分用 [а]{.ru} 对比"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Где бы́ли Ван Лэй и Ди́ма в сре́ду? Каки́е экза́мены бу́дут у Ван Лэ́я? Что он бу́дет де́лать, когда́ сдаст экза́мены? Куда́ Ди́ма пригласи́л дру́га? Как они́ занима́лись?]{.ru}"
        length: 50–80
        model: "В сре́ду Ван Лэй и Ди́ма сиде́ли в библиоте́ке. У Ван Лэ́я бу́дет зачёт по исто́рии, пи́сьменный экза́мен по ру́сскому языку́ и у́стный экза́мен по литерату́ре. Когда́ он сдаст после́дний экза́мен, он снача́ла вы́спится, а пото́м бу́дет отдыха́ть. Ди́ма пригласи́л его́ на ма́йские пра́здники в Каза́нь. Пото́м Ди́ма спра́шивал, а Ван Лэй отвеча́л на вопро́сы по биле́там."
        rubric: ["回答全部五个问题", "[когда́ он сдаст]{.ru} 用完成体将来时", "将来的打算区分 [вы́спится]{.ru}（结果）和 [бу́дет отдыха́ть]{.ru}（活动）"]
        notes: 范文约 55 词。课文里的直接引语改成第三人称叙述：[Когда́ сдам…, вы́сплюсь]{.ru} 变成 [Когда́ он сдаст…, он вы́спится]{.ru}，体不变。

  - id: e6
    type: open
    task: 作文。题目：“考完试以后”。
    items:
      - prompt: 写一写你考完试以后的打算：先做什么、然后做什么，假期里会经常做什么、要去哪儿。至少用三次完成体将来时、两次未完成体将来时，至少用一个 [когда́]{.ru} 句。
        length: 100–150
        model: |
          Мои́ экза́мены ко́нчатся в пя́тницу. Сейча́с я ка́ждый день гото́влюсь к ним и о́чень ма́ло сплю. Когда́ я сдам после́дний экза́мен, я снача́ла вы́сплюсь. Пото́м я позвоню́ роди́телям и расскажу́ им, как я сдал экза́мены. В суббо́ту ве́чером мы с друзья́ми пойдём в кафе́. А пото́м начну́тся пра́здники. Я пое́ду к дру́гу на да́чу. Там я не бу́ду открыва́ть уче́бники! Я бу́ду гуля́ть в лесу́, игра́ть в футбо́л и чита́ть рома́ны, но то́лько интере́сные. Ве́чером мы бу́дем пить чай и до́лго разгова́ривать. Когда́ я верну́сь в Москву́, я бу́ду уже́ свобо́ден до се́ссии. Наде́юсь, что я всё сдам без тро́ек!
        rubric: ["一先一后的动作用完成体将来时（[вы́сплюсь, позвоню́, пойдём]{.ru}）", "假期里的活动用未完成体将来时（[бу́ду гуля́ть]{.ru}）", "[когда́]{.ru} 句里用将来时，不用现在时", "顺序清楚：考完—先—然后—假期"]
        notes: 范文约 100 词，按时间顺序写：现在（现在时）—考完以后的头几件事（完成体将来时，一件接一件）—假期里的活动（未完成体将来时，说的是会经常做的事）—回来以后。[Я не бу́ду открыва́ть уче́бники]{.ru} 是未完成体将来时的否定，表示“根本不打算做”；比较 [не вы́учу]{.ru}“做不到”。
