lesson: B3-L05
grammar: "短尾被动形动词：长尾去词尾，[-нн-]{.ru} 变 [-н-]{.ru}（[постро́енный → постро́ен, -а, -о, -ы]{.ru}），[-ённый → -ён, -ена́]{.ru}，[-тый → -т]{.ru}；作谓语，时间由 [быть]{.ru} 表示；发出者用第五格；数量词组作主语时用中性单数。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Кем был Павел Третьяков и чем он занимался? Какой год считается годом основания галереи и почему? Каким художникам помогал Третьяков? Зачем по его заказу писали портреты? Что произошло с коллекцией в 1892 году?]{.ru}"
        length: 60–90
        model: "Павел Третьяков был московским купцом: вместе с братом он руководил большими льняными фабриками. Годом основания галереи считается 1856 год, потому что тогда Третьяков купил первые картины русских художников. Он помогал молодым художникам, в том числе Перову, Крамскому, Репину и Левитану, и покупал их картины, когда их ещё мало кто знал. Портреты писателей, композиторов и учёных писали по его заказу, потому что он хотел сохранить для будущих поколений лица великих людей своего времени. В 1892 году Третьяков подарил свою коллекцию Москве, и вместе с ней городу была передана коллекция его брата."
        rubric: ["五个问题都回答，内容与课文一致", "至少用一处短尾被动形动词", "用完整的句子"]
        notes: 第 2 题要说出原因（买下第一批画）。第 5 题可以用主动句 [подарил коллекцию Москве]{.ru}，也可以用被动句 [коллекция была подарена Москве]{.ru}。

  - id: e2
    type: rewrite
    task: 把主动句改成带短尾被动形动词的被动句，保留动作发出者。
    example:
      cue: Перов написал портрет Достоевского.
      answer: Портрет Достоевского был написан Перовым.
    why: "主动句的宾语变成主语（第一格），主语变成第五格，动词变成短尾被动形动词，系词 [быть]{.ru} 的时间、性、数和新主语一致。第 1 题 [фасад]{.ru} 阳性 → [был создан]{.ru}。第 2 题 [картины]{.ru} 复数 → [были куплены]{.ru}，[купить]{.ru} 有 [п → пл]{.ru} 交替。第 3 题 [галерею]{.ru} 变成阴性主语 [галерея]{.ru} → [была основана]{.ru}。第 4 题 [здание]{.ru} 中性 → [было построено]{.ru}；原句没有具体的发出者（不定人称句），被动句里也不用第五格。"
    items:
      - cue: Виктор Васнецов создал фасад здания.
        accept: ["Фасад здания был создан Виктором Васнецовым."]
      - cue: Третьяков купил эти картины.
        accept: ["Эти картины были куплены Третьяковым."]
      - cue: Павел Третьяков основал галерею в 1856 году.
        accept: ["Галерея была основана Павлом Третьяковым в 1856 году.", "В 1856 году галерея была основана Павлом Третьяковым."]
      - cue: В 1874 году построили специальное здание для галереи.
        accept: ["В 1874 году было построено специальное здание для галереи.", "Специальное здание для галереи было построено в 1874 году."]

  - id: e3
    type: fill
    task: 用括号里动词的短尾被动形动词填空，注意性、数。
    why: "短尾的性、数跟着主语走，[-нн-]{.ru} 在短尾里只写一个 [н]{.ru}。第 1 题 [галерея]{.ru} 阴性 → [открыта]{.ru}，[-т-]{.ru} 类。第 2 题 [портреты]{.ru} 复数 → [написаны]{.ru}。第 3 题主语是数量词组 [около двух тысяч произведений]{.ru}，系词 [было]{.ru} 已经是中性单数，形动词也用中性 [передано]{.ru}。第 4 题 [вопрос]{.ru} 阳性，[решить → решённый → решён]{.ru}，重音在后。第 5 题 [здание]{.ru} 中性 → [построено]{.ru}，不写 [построенно]{.ru}。"
    items:
      - stem: С 1881 года галерея была ___ для всех желающих.
        hint: открыть
        accept: ["открыта"]
      - stem: Эти портреты были ___ по заказу Третьякова.
        hint: написать
        accept: ["написаны"]
      - stem: В 1892 году городу было ___ около двух тысяч произведений.
        hint: передать
        accept: ["передано"]
      - stem: Вопрос о новом здании был ___ очень быстро.
        hint: решить
        accept: ["решён"]
      - stem: Новое здание было ___ рядом с домом Третьякова.
        hint: построить
        accept: ["построено"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题空位在名词前作定语，用长尾 [построенное]{.ru}；短尾只能作谓语。第 2 题作谓语，主语 [картина]{.ru} 阴性，用短尾 [куплена]{.ru}；[купленная]{.ru} 是长尾，带第五格发出者的被动谓语要用短尾；[куплено]{.ru} 是中性，和主语不一致。第 3 题说的是现在的状态（博物馆现在开着），不用系词：[Музей открыт]{.ru}；[был открыт]{.ru} 说的是过去的事件。第 4 题主语 [галерея]{.ru} 阴性，用 [основана]{.ru}（短尾只写一个 [н]{.ru}）；[основан]{.ru} 是阳性，[основанная]{.ru} 是长尾。"
    items:
      - stem: Мы вошли в ___ в 1874 году здание.
        options: [построено, построенное, построен]
        answer: построенное
      - stem: Эта картина была ___ Третьяковым.
        options: [купленная, куплена, куплено]
        answer: куплена
      - stem: "— Можно сейчас пойти в галерею? — Да, музей ___ до шести часов."
        options: [был открыт, открыт, открытый]
        answer: открыт
      - stem: Галерея была ___ в 1856 году.
        options: [основан, основана, основанная]
        answer: основана

  - id: e5
    type: translate
    task: 翻译下列句子，用短尾被动形动词。
    items:
      - zh: 这些画都是特列季亚科夫在画家们还不出名的时候买下的。
        accept: ["Эти картины были куплены Третьяковым, когда художники были ещё неизвестны.", "Эти картины были куплены Третьяковым, когда художников ещё никто не знал.", "Эти картины были куплены Третьяковым, когда художники ещё не были известны.", "Все эти картины были куплены Третьяковым, когда художники были ещё неизвестны."]
        rubric: ["[были куплены Третьяковым]{.ru}：复数短尾，发出者用第五格", "“还不出名”可以用 [неизвестны]{.ru}、[не были известны]{.ru} 或 [никто не знал]{.ru}"]
      - zh: 画廊的新楼是 1874 年建成的。
        accept: ["Новое здание галереи было построено в 1874 году.", "Новое здание для галереи было построено в 1874 году.", "В 1874 году было построено новое здание галереи."]
        rubric: ["[было построено]{.ru}：中性短尾，系词与 [здание]{.ru} 一致", "[в 1874 году]{.ru} 年份用 [в]{.ru} + 第六格"]
      - zh: 大约两千件作品赠送给了城市。
        accept: ["Городу было подарено около двух тысяч произведений.", "Около двух тысяч произведений было подарено городу.", "Городу было передано около двух тысяч произведений.", "Около двух тысяч произведений было передано городу.", "В дар городу было принесено около двух тысяч произведений."]
        rubric: ["数量词组作主语，系词和形动词用中性单数 [было подарено]{.ru}", "[около]{.ru} + 第二格 [двух тысяч произведений]{.ru}"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：画廊的楼；特列季亚科夫的出身；第一批画和遗嘱；收藏和肖像；捐赠给莫斯科；今天的画廊。每项一到两句，保留关键年份，至少用三处短尾被动形动词。
        length: 120–150
        model: "Третьяковская галерея — главный музей русского искусства. Её фасад был создан художником Васнецовым, а сама галерея была основана московским купцом Павлом Третьяковым. Он родился в 1832 году и вместе с братом руководил льняными фабриками. Его главной страстью была живопись. В 1856 году Третьяков купил первые картины русских художников, и этот год считается годом основания галереи. Через четыре года он написал завещание: его деньги должны были пойти на создание художественного музея в Москве. Многие картины были куплены им у молодых художников, которых тогда ещё мало кто знал. По его заказу были написаны портреты великих людей его времени. В 1892 году коллекция была подарена городу, а в 1893 году галерея открылась как городской музей. Сегодня её имя знают во всём мире."
        rubric: ["提纲六项都有，顺序与课文一致", "年份准确：1832、1856、1892、1893", "至少三处短尾被动形动词，与主语性数一致，发出者用第五格", "120–150 词"]
        notes: "范文约 130 词。用了五处短尾被动形动词：[был создан]{.ru}、[была основана]{.ru}、[были куплены]{.ru}、[были написаны]{.ru}、[была подарена]{.ru}，系词都和主语一致。韦列夏金、第二座楼等细节省去了。[которых тогда ещё мало кто знал]{.ru}（当时还没有多少人知道他们）是概括“还不出名”的常用说法。"
