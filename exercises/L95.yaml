lesson: L95
grammar: "书信格式：右上角写地点和日期；称呼用 [Дорого́й / Дорога́я / Дороги́е]{.ru} 或 [Уважа́емый / Уважа́емая]{.ru} 加名字，后面用感叹号；问候和结束语按 [ты]{.ru} / [Вы]{.ru} 选择（[Здра́вствуй! Пиши́! Передава́й приве́т …!]{.ru}）；落款 [Твой / Твоя́ / Ваш / Ва́ша]{.ru} 加自己的名字。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的称呼或落款。
    why: "称呼里的 [дорого́й]{.ru}、[уважа́емый]{.ru} 和收信人的性、数一致：[ма́ма]{.ru} 是阴性，[ма́ма и па́па]{.ru} 是复数。落款正好相反，物主代词和写信人自己的性一致，[твой]{.ru} 还是 [ваш]{.ru} 看对收信人称 [ты]{.ru} 还是 [Вы]{.ru}。第 6 题安娜给老师写信，写信人是女性，对老师称 [Вы]{.ru}，所以是 [Ва́ша]{.ru}。给老师写信用 [Уважа́емая]{.ru}，不用 [Дорога́я]{.ru}，这是第 4 题的要点。"
    items:
      - stem: ___ Ми́ша!
        options: [Дорого́й, Дорога́я, Дороги́е]
        answer: Дорого́й
      - stem: ___ ма́ма!
        options: [Дорого́й, Дорога́я, Дороги́е]
        answer: Дорога́я
      - stem: ___ ма́ма и па́па!
        options: [Дорого́й, Дорога́я, Дороги́е]
        answer: Дороги́е
      - stem: ___ О́льга Ви́кторовна!（学生给老师写信）
        options: [Дорога́я, Уважа́емая]
        answer: Уважа́емая
      - stem: А́нна пи́шет Ван Лэ́ю. В конце́ письма́： ___ А́нна.
        options: [Твой, Твоя́, Ва́ша]
        answer: Твоя́
      - stem: А́нна пи́шет О́льге Ви́кторовне. В конце́ письма́： ___ А́нна.
        options: [Твоя́, Ваш, Ва́ша]
        answer: Ва́ша

  - id: e2
    type: choice
    task: 按称呼 [ты]{.ru} 还是 [Вы]{.ru}，选择正确的形式。
    why: "对一个用 [ты]{.ru} 称呼的人（米沙、安娜、妈妈），问候语和命令式都不加 [-те]{.ru}：[Здра́вствуй, Пиши́, Передава́й]{.ru}；对用名字加父称称呼的人，或者对几个人，都加 [-те]{.ru}。[передава́й]{.ru} 保留 [-ва-]{.ru}，这个 [-ва-]{.ru} 在现在时里没有（[передаю́]{.ru}），容易漏写。"
    items:
      - stem: Дорого́й Ми́ша! ___!
        options: [Здра́вствуй, Здра́вствуйте]
        answer: Здра́вствуй
      - stem: Уважа́емая О́льга Ви́кторовна! ___!
        options: [Здра́вствуй, Здра́вствуйте]
        answer: Здра́вствуйте
      - stem: Дороги́е ма́ма и па́па! ___ мне!
        options: [Пиши́, Пиши́те]
        answer: Пиши́те
      - stem: А́нна, ___ приве́т па́пе!
        options: [передава́й, передава́йте]
        answer: передава́й
      - stem: Мари́я Никола́евна, ___ приве́т ба́бушке!
        options: [передава́й, передава́йте]
        answer: передава́йте

  - id: e3
    type: fill
    task: 把括号里的词变成需要的形式。
    why: "[передава́ть приве́т кому́]{.ru} 和 [скуча́ть по кому́]{.ru} 都要求第三格。[Ива́н Серге́евич]{.ru} 名字和父称都要变：[Ива́ну Серге́евичу]{.ru}；[Мари́я]{.ru} 以 [-ия]{.ru} 结尾，第三格是 [Мари́и]{.ru}，不是 [Мари́е]{.ru}。人称代词 [ты]{.ru} 的第三格是 [тебе́]{.ru}。"
    items:
      - stem: Передава́й приве́т ___!
        hint: ба́бушка
        accept: [ба́бушке]
      - stem: Передава́й приве́т ___!
        hint: Ива́н Серге́евич
        accept: [Ива́ну Серге́евичу]
      - stem: Передава́йте приве́т ___!
        hint: Мари́я Никола́евна
        accept: [Мари́и Никола́евне]
      - stem: Му́рка скуча́ет по ___.
        hint: ты
        accept: [тебе́]
      - stem: Ван Лэй скуча́ет по ___.
        hint: ма́ма
        accept: [ма́ме]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 亲爱的爸爸妈妈！你们好！
        accept: ["Дороги́е ма́ма и па́па! Здра́вствуйте!", "Дороги́е па́па и ма́ма! Здра́вствуйте!"]
        rubric: ["称呼用复数 [Дороги́е]{.ru}", "对两个人问好用 [Здра́вствуйте]{.ru}"]
      - zh: 穆尔卡很想你。
        accept: ["Му́рка о́чень скуча́ет по тебе́.", "Му́рка скуча́ет по тебе́."]
        rubric: ["[скуча́ть по]{.ru} + 第三格 [тебе́]{.ru}"]
      - zh: 代我向奶奶问好！来信！
        accept: ["Передава́й приве́т ба́бушке! Пиши́!", "Передава́йте приве́т ба́бушке! Пиши́те!"]
        rubric: ["[передава́ть приве́т]{.ru} + 第三格 [ба́бушке]{.ru}", "命令式前后一致：都用 [ты]{.ru} 的形式，或都用 [вы]{.ru} 的形式"]
      - zh: 我倒是很乐意现在就去看你，可是得复习功课。（男性说）
        accept: ["Я бы с удово́льствием пое́хал к тебе́ сейча́с, но на́до занима́ться.", "Я с удово́льствием пое́хал бы к тебе́ сейча́с, но на́до занима́ться.", "Я бы с удово́льствием пое́хал к тебе́ сейча́с, но мне на́до занима́ться."]
        rubric: ["假定式 [бы]{.ru} + [пое́хал]{.ru}", "去某人那里用 [к]{.ru} + 第三格 [к тебе́]{.ru}", "“得”用 [на́до]{.ru}"]

  - id: e5
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是安娜。考试期间，你给在乡下奶奶家的米沙写一封信：问候他和奶奶，说说家里和自己的近况（考试、王磊、穆尔卡），说说一月七日的打算。注意书信的格式。
        length: 60–100
        model: |
          Москва́, 6 января́

          Дорого́й Ми́ша!

          Здра́вствуй! Как ты живёшь? Как ба́бушка?

          У нас до́ма ти́хо. Я мно́го занима́юсь: де́сятого января́ у меня́ пе́рвый экза́мен. Ван Лэй то́же занима́ется, ве́чером мы вме́сте повторя́ем грамма́тику. Му́рка спит на твоём дива́не и скуча́ет по тебе́.

          Седьмо́го января́ мы пое́дем к вам на Рождество́. Я бы пое́хала к вам сейча́с, но на́до занима́ться.

          Передава́й приве́т ба́бушке! Пиши́!

          Твоя́ А́нна
        rubric: ["右上角写地点和日期", "称呼 [Дорого́й Ми́ша!]{.ru} 单独一行", "对米沙用 [ты]{.ru}：[Здра́вствуй, Пиши́, Передава́й]{.ru}", "落款用阴性 [Твоя́]{.ru}，因为写信人是安娜", "正文有近况和打算"]
        notes: 范文结构和课文的信一样：地点日期、称呼、问候、近况（一段）、打算（一段）、结束语、落款。写信人换成了安娜，最容易错的是落款：要写 [Твоя́ А́нна]{.ru}，不是 [Твой]{.ru}；假定式也要用阴性 [пое́хала бы]{.ru}。
