lesson: B2-L08
grammar: "度量词（[килогра́мм, литр, па́чка, буты́лка, коро́бка, деся́ток, полкило́…]{.ru}）+ 第二格；度量词本身按句子的需要变格。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "度量词后面用第二格。能数的东西用复数第二格：[конфе́т, мандари́нов, цвето́в, яи́ц]{.ru}；不能数的用单数第二格：[ча́я, со́ка, молока́, пече́нья, мёда]{.ru}。第 3 题 [конфе́т]{.ru} 是零词尾；第 7 题 [яйцо́ → яи́ц]{.ru} 插入 [и]{.ru}，是不规则形式，要单独记；第 6 题 [цветы́]{.ru} 的复数第二格是 [цвето́в]{.ru}。"
    items:
      - stem: па́чка ___
        hint: чай
        accept: ["ча́я", "ча́ю"]
      - stem: буты́лка ___
        hint: сок
        accept: ["со́ка"]
      - stem: коро́бка ___
        hint: конфе́та
        accept: ["конфе́т"]
      - stem: килогра́мм ___
        hint: мандари́н
        accept: ["мандари́нов"]
      - stem: литр ___
        hint: молоко́
        accept: ["молока́"]
      - stem: буке́т ___
        hint: цветы́
        accept: ["цвето́в"]
      - stem: деся́ток ___
        hint: яйцо́
        accept: ["яи́ц"]
      - stem: полкило́ ___
        hint: пече́нье
        accept: ["пече́нья"]
      - stem: ба́нка ___
        hint: мёд
        accept: ["мёда"]

  - id: e2
    type: fill
    task: 把括号里的度量词变成正确的形式。
    why: "度量词本身按句子的需要变格，后面的名词不变。第 1 题作 [купи́]{.ru} 的宾语，用第四格 [коро́бку]{.ru}；第 2 题 [три]{.ru} 后用单数第二格 [буты́лки]{.ru}；第 3 题 [пять]{.ru} 后用复数第二格，零词尾加隐现元音 [е]{.ru}：[па́чек]{.ru}；第 4 题 [нет]{.ru} 后用第二格 [ли́тра]{.ru}；第 5 题 [два]{.ru} 后用单数第二格 [килогра́мма]{.ru}。"
    items:
      - stem: Купи́, пожа́луйста, ___ конфе́т.
        hint: коро́бка
        accept: ["коро́бку"]
      - stem: Ю́ми купи́ла три ___ со́ка.
        hint: буты́лка
        accept: ["буты́лки"]
      - stem: На по́лке пять ___ ча́я.
        hint: па́чка
        accept: ["па́чек"]
      - stem: В спи́ске нет ___ молока́.
        hint: литр
        accept: ["ли́тра"]
      - stem: Мари́я Никола́евна купи́ла два ___ я́блок.
        hint: килогра́мм
        accept: ["килогра́мма"]

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题“一公斤橘子”[килогра́мм мандари́нов]{.ru} 用复数第二格，“一升牛奶”[литр молока́]{.ru} 用单数第二格。第 2 题 [три буты́лки]{.ru}：度量词随数词变。第 3 题用短尾形容词 [нужны́]{.ru} 时和复数主语一致；也可以说 [ну́жно / на́до купи́ть]{.ru} + 第四格。第 5 题“三个人”用集合数词 [тро́е]{.ru}。"
    items:
      - zh: 请给我一公斤橘子和一升牛奶。
        accept: ["Да́йте, пожа́луйста, килогра́мм мандари́нов и литр молока́.", "Да́йте мне, пожа́луйста, килогра́мм мандари́нов и литр молока́.", "Да́йте килогра́мм мандари́нов и литр молока́, пожа́луйста.", "Пожа́луйста, да́йте килогра́мм мандари́нов и литр молока́."]
        rubric: ["[килогра́мм мандари́нов]{.ru}：复数第二格", "[литр молока́]{.ru}：单数第二格"]
      - zh: 由美买了三瓶果汁。
        accept: ["Ю́ми купи́ла три буты́лки со́ка."]
        rubric: ["[три буты́лки]{.ru}：单数第二格", "[со́ка]{.ru}：第二格"]
      - zh: 我们需要两个蛋糕和一盒糖。
        accept: ["Нам ну́жно два то́рта и коро́бка конфе́т.", "Нам нужны́ два то́рта и коро́бка конфе́т.", "Нам ну́жно два то́рта и одна́ коро́бка конфе́т.", "Нам нужны́ два то́рта и одна́ коро́бка конфе́т.", "Нам ну́жно купи́ть два то́рта и коро́бку конфе́т.", "Нам на́до купи́ть два то́рта и коро́бку конфе́т."]
        rubric: ["[два то́рта]{.ru}", "[коро́бка конфе́т]{.ru}：零词尾复数第二格", "需要的人用第三格 [нам]{.ru}"]
      - zh: 一普特大约是十六公斤。
        accept: ["Пуд — э́то приме́рно шестна́дцать килогра́ммов.", "Оди́н пуд — э́то приме́рно шестна́дцать килогра́ммов.", "Пуд — приме́рно шестна́дцать килогра́ммов."]
        rubric: ["[шестна́дцать килогра́ммов]{.ru}：复数第二格", "“大约”用 [приме́рно]{.ru}"]
      - zh: 去商店的是三个人。
        accept: ["В магази́н пойду́т тро́е.", "В магази́н пойдёт тро́е.", "В магази́н иду́т тро́е.", "В магази́н идёт тро́е."]
        rubric: ["集合数词 [тро́е]{.ru}", "[в магази́н]{.ru}：方向用第四格"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что бу́дет в сре́ду? Ско́лько де́нег даёт ка́ждый студе́нт? Что Ю́ми написа́ла в спи́ске? Кто пойдёт в магази́н и когда́? Что зна́чит «съесть пуд со́ли»?]{.ru}"
        length: 50–80
        model: "В сре́ду у О́льги Ви́кторовны день рожде́ния, и по́сле заня́тий у студе́нтов бу́дет для неё чай. В гру́ппе двена́дцать челове́к, ка́ждый даёт три́ста рубле́й. Ю́ми написа́ла спи́сок: два то́рта, две коро́бки конфе́т, па́чка ча́я, три лимо́на, литр молока́, три буты́лки со́ка, полкило́ пече́нья, кни́га и буке́т цвето́в. В магази́н пойду́т тро́е: Ван Лэй, Ю́ми и Хосе́. Они́ встре́тятся у метро́ во вто́рник в че́тверть тре́тьего. «Съесть пуд со́ли» зна́чит давно́ быть вме́сте и хорошо́ знать дру́га."
        rubric: ["回答全部五个问题", "度量词 + 第二格用对：[две коро́бки конфе́т, литр молока́, три буты́лки со́ка, полкило́ пече́нья]{.ru}", "集合数词 [тро́е]{.ru}", "钟点 [в че́тверть тре́тьего]{.ru}"]
        notes: "范文约 80 词。第一句照课文的 [у нас бу́дет чай]{.ru} 改成第三人称 [у студе́нтов бу́дет чай]{.ru}。清单照抄课文即可，重点是度量词和名词的格。课文里的 [за́втра]{.ru} 在缩写里改成具体的 [во вто́рник]{.ru}。最后一句用皮埃尔的解释：[давно́ быть вме́сте]{.ru}，[хорошо́ знать дру́га]{.ru}。"
