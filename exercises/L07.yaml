lesson: L07
grammar: "第二变位动词现在时（[говорю́, говори́шь, говори́т, говори́м, говори́те, говоря́т]{.ru}）；与第一变位的对比；[ж, ш, ч, щ]{.ru} 后写 [у]{.ru}、[а]{.ru}；副词修饰动词。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的现在时形式。
    why: 第二变位词尾是 [-ю (-у), -ишь, -ит, -им, -ите, -ят (-ат)]{.ru}。第 2、4 题 [смотре́ть]{.ru} 除第一人称外重音都在词干上。第 5 题 [лежа́ть]{.ru} 的 [ж]{.ru} 后写 [а]{.ru}：[лежа́т]{.ru}，不能写 [лежя́т]{.ru}。第 6 题 [спать]{.ru} 第一人称多一个 [л]{.ru}。第 8 题 [понима́ть]{.ru} 是第一变位，不要套用第二变位的词尾。
    items:
      - stem: Я ___ ме́дленно.
        hint: говори́ть
        accept: ["говорю́"]
      - stem: Что ты ___?
        hint: смотре́ть
        accept: ["смо́тришь"]
      - stem: А́нна ___ ме́дленно.
        hint: говори́ть
        accept: ["говори́т"]
      - stem: Мы ___ телеви́зор.
        hint: смотре́ть
        accept: ["смо́трим"]
      - stem: Кни́ги ___ там.
        hint: лежа́ть
        accept: ["лежа́т"]
      - stem: Я не ___.
        hint: спать
        accept: ["сплю"]
      - stem: Ми́ша ___ тут.
        hint: стоя́ть
        accept: ["стои́т"]
      - stem: Вы ___?
        hint: понима́ть
        accept: ["понима́ете"]

  - id: e2
    type: choice
    task: 选择正确的动词形式。
    why: 先判断动词属于哪种变位，再看人称。[чита́ть]{.ru}、[разгова́ривать]{.ru} 是第一变位，词尾元音是 [е]{.ru}，第三人称复数 [-ют]{.ru}；[говори́ть]{.ru}、[смотре́ть]{.ru}、[спать]{.ru} 是第二变位，词尾元音是 [и]{.ru}，第三人称复数 [-ят]{.ru}。
    items:
      - stem: Они́ ___ фильм.
        options: [смо́трят, смо́трют, смо́трит]
        answer: смо́трят
      - stem: Ты ___ бы́стро.
        options: [говори́шь, говоре́шь, говорю́]
        answer: говори́шь
      - stem: Ма́ма и па́па ___.
        options: [разгова́ривают, разгова́ривает, разгова́риваем]
        answer: разгова́ривают
      - stem: Му́рка ___.
        options: [спит, спят, сплю]
        answer: спит
      - stem: Вы ___ журна́л?
        options: [чита́ете, чита́ите, чита́ешь]
        answer: чита́ете

  - id: e3
    type: rewrite
    task: 按例句回答问题。
    placeholder: Нет, …
    example:
      cue: Ты чита́ешь? (смотре́ть телеви́зор)
      answer: Нет, я не чита́ю. Я смотрю́ телеви́зор.
    why: 否定回答先说“不做什么”（[не]{.ru} 放在动词前），再说在做什么。两个动词都要和主语一致；[смотре́ть]{.ru}、[спать]{.ru}、[говори́ть]{.ru}、[лежа́ть]{.ru} 是第二变位，[чита́ть]{.ru}、[игра́ть]{.ru}、[гуля́ть]{.ru}、[слу́шать]{.ru} 是第一变位。
    items:
      - cue: Па́па смо́трит фильм? (спать)
        accept: ["Нет, па́па не смо́трит фильм. Он спит.", "Нет, он не смо́трит фильм. Он спит.", "Нет, он не смо́трит. Он спит.", "Нет, па́па не смо́трит. Он спит."]
      - cue: Вы гуля́ете? (смотре́ть фильм)
        accept: ["Нет, мы не гуля́ем. Мы смо́трим фильм.", "Нет, я не гуля́ю. Я смотрю́ фильм."]
      - cue: Ми́ша игра́ет? (говори́ть)
        accept: ["Нет, Ми́ша не игра́ет. Он говори́т.", "Нет, он не игра́ет. Он говори́т."]
      - cue: Ты слу́шаешь? (спать)
        accept: ["Нет, я не слу́шаю. Я сплю."]
      - cue: Му́рка игра́ет? (лежа́ть)
        accept: ["Нет, Му́рка не игра́ет. Она́ лежи́т.", "Нет, она́ не игра́ет. Она́ лежи́т."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 一家人在看电影《莫斯科不相信眼泪》；米沙说爸爸在睡觉，爸爸不承认；王磊觉得演员说话太快，安娜说得慢，他就听懂了。
    items:
      - stem: Мари́я Никола́евна, А́нна и Ми́ша смо́трят ___.
        options: [фильм, журна́л]
        answer: фильм
      - stem: Па́па не смо́трит фильм, он ___.
        options: [спит, чита́ет]
        answer: спит
      - stem: Актёры говоря́т ___.
        options: [бы́стро, ме́дленно]
        answer: бы́стро
      - stem: А́нна говори́т ___, и Ван Лэй понима́ет.
        options: [ме́дленно, бы́стро]
        answer: ме́дленно

  - id: e5
    type: translate
    task: 译成俄语。
    why: “看电视、看电影”用 [смотре́ть]{.ru}，“看书”用 [чита́ть]{.ru}。“说得快”“听不太懂”这类说法，俄语直接用副词修饰动词，不需要“得”。
    items:
      - zh: ——你们在看什么？——我们在看电视。
        accept: ["— Что вы смо́трите? — Мы смо́трим телеви́зор.", "— Что вы сейча́с смо́трите? — Мы смо́трим телеви́зор."]
        rubric: ["[вы]{.ru} 配 [смо́трите]{.ru}，[мы]{.ru} 配 [смо́трим]{.ru}", "“看电视”用 [смотре́ть телеви́зор]{.ru}"]
      - zh: 爸爸在睡觉，妈妈在看书。
        accept: ["Па́па спит, а ма́ма чита́ет.", "Па́па спит, ма́ма чита́ет."]
        rubric: ["[спать]{.ru} 第三人称单数 [спит]{.ru}", "“看书”用 [чита́ть]{.ru}，不用 [смотре́ть]{.ru}", "对比用 [а]{.ru}"]
      - zh: 他们说得很快，我听不太懂。
        accept: ["Они́ говоря́т о́чень бы́стро. Я пло́хо понима́ю.", "Они́ говоря́т о́чень бы́стро, я пло́хо понима́ю.", "Они́ о́чень бы́стро говоря́т. Я пло́хо понима́ю.", "Они́ о́чень бы́стро говоря́т, я пло́хо понима́ю.", "Они́ говоря́т о́чень бы́стро, и я пло́хо понима́ю.", "Они́ говоря́т о́чень бы́стро, я не о́чень хорошо́ понима́ю.", "Они́ говоря́т о́чень бы́стро. Я не о́чень хорошо́ понима́ю."]
        rubric: ["[они́]{.ru} 配 [говоря́т]{.ru}", "“很快”用 [о́чень бы́стро]{.ru}", "“听不太懂”用 [пло́хо понима́ю]{.ru}"]
      - zh: 你说得慢，我听得懂。
        accept: ["Ты говори́шь ме́дленно, я понима́ю.", "Ты говори́шь ме́дленно, и я понима́ю.", "Ты ме́дленно говори́шь, я понима́ю.", "Ты ме́дленно говори́шь, и я понима́ю.", "Ты говори́шь ме́дленно. Я понима́ю.", "Ты говори́шь ме́дленно, и я хорошо́ понима́ю.", "Ты говори́шь ме́дленно, я хорошо́ понима́ю."]
        rubric: ["[ты]{.ru} 配 [говори́шь]{.ru}", "[я]{.ru} 配 [понима́ю]{.ru}（第一变位）"]
