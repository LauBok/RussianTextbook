lesson: B3-L53
grammar: "否定第二格：[нет, не было, не будет]{.ru} + 第二格；及物动词带否定时，完全否定、抽象名词、泛指的宾语用第二格（[не слышал ни одного звука]{.ru}），具体确定的宾语用第四格（[не видел Татьяну]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Каким человеком был Герасим? Почему он не женился на Татьяне? Как у него появилась Муму и какой она была? Почему барыня приказала убрать собаку? Что сделал Герасим в конце рассказа?]{.ru}"
        length: 80–110
        model: "Герасим был дворником огромного роста и необыкновенной силы; он был глухонемым от рождения. Он хотел жениться на Татьяне, но барыня решила женить на ней башмачника Капитона, а дворецкий придумал хитрость: Татьяна прошла мимо Герасима, делая вид, что пьяна. Однажды Герасим спас в реке щенка, который тонул, выкормил его и назвал Муму; собачка выросла умной и красивой, с длинными ушами и пушистым хвостом. Когда барыня протянула к собаке руку, Муму показала зубы, и барыня рассердилась. В конце рассказа Герасим сам утопил Муму, а потом, не взяв ничего, кроме узелка, пешком ушёл в свою деревню."
        rubric: ["五个问题都回答，情节与课文一致", "[жениться на ком]{.ru}、[женить кого на ком]{.ru} 用法正确", "至少用一处否定第二格"]
        notes: "第 2 题要说清楚两层原因：女主人另有安排，管家用计让盖拉辛以为塔季扬娜是醉鬼。第 5 题可以用否定第二格 [не взяв ничего]{.ru}，[ничего]{.ru} 本身就是第二格。"

  - id: e2
    type: choice
    task: 选择第二格或第四格。
    why: "第 1 题有 [ни одного]{.ru}，完全否定，用第二格 [звука]{.ru}。第 2 题 [не было]{.ru} 表示“没有”，名词必须用第二格 [мужа]{.ru}。第 3 题 [не только … но и]{.ru} 里的 [не]{.ru} 不否定动词，句子是肯定的，宾语用第四格 [собаку]{.ru}。第 4 题 [мнение]{.ru} 是抽象名词，否定时多用第二格 [мнения]{.ru}。第 5 题说的是“斯捷潘卖掉的那条狗”，宾语明确，后面还有关系从句限定，用第四格 [собаку]{.ru}。第 6 题 [не терять времени]{.ru} 是固定说法，用第二格。"
    items:
      - stem: Герасим никогда не слышал ни одного ___.
        options: [звук, звука]
        answer: звука
      - stem: ___ у барыни давно не было.
        options: [Муж, Мужа]
        answer: Мужа
      - stem: Герасим не только кормил ___, но и везде брал её с собой.
        options: [собаку, собаки]
        answer: собаку
      - stem: ___ Татьяны никто не спрашивал.
        options: [Мнение, Мнения]
        answer: Мнения
      - stem: Герасим нигде не мог найти ___, которую Степан продал на рынке.
        options: [собаку, собаки]
        answer: собаку
      - stem: Герасим не терял ___ и сразу пошёл искать собаку.
        options: [время, времени]
        answer: времени

  - id: e3
    type: rewrite
    task: 把肯定句改成否定句，注意宾语或主语的格。
    example:
      cue: В каморке была собака.
      answer: В каморке не было собаки.
    why: "表示存在的 [был, была, было, были]{.ru} 变否定时，一律换成中性单数 [не было]{.ru}，名词变第二格。第 1 题 [слуга]{.ru} 是以 [-а]{.ru} 结尾的阳性名词，按 [-а]{.ru} 结尾的阴性名词变格，复数第二格是零词尾 [слуг]{.ru}。第 2 题加 [ни одного]{.ru}，完全否定用第二格 [ни одного слова]{.ru}。第 3 题将来时 [будет]{.ru} 变 [не будет]{.ru}，同样用中性单数和第二格 [собаки]{.ru}。第 4 题 [у него была семья]{.ru} 变 [у него не было семьи]{.ru}，不能说 ~~[не была семья]{.ru}~~。"
    items:
      - cue: В доме были слуги.
        accept: ["В доме не было слуг."]
      - cue: Герасим сказал ей одно слово.
        accept: ["Герасим не сказал ей ни одного слова.", "Герасим не сказал ей ни слова."]
      - cue: Во дворе будет собака.
        accept: ["Во дворе не будет собаки."]
      - cue: У Герасима была семья.
        accept: ["У Герасима не было семьи."]

  - id: e4
    type: fill
    task: 用括号里的词填空，注意格。
    why: "第 1 题 [нет]{.ru} 后用第二格 [времени]{.ru}。第 2 题 [ни]{.ru} 加强否定，第二格 [копейки]{.ru}。第 3 题否定泛指，“不养狗”指任何狗，用复数第二格 [собак]{.ru}。第 4 题 [видеть]{.ru} 的宾语是确定的人（她，即塔季扬娜），用第四格 [её]{.ru}。第 5 题 [ничего]{.ru} 是第二格，这里还要补一个数词与形容词连用的词组：[двух тяжёлых кирпичей]{.ru}，[кроме]{.ru} 要第二格，数词、形容词、名词都在第二格。"
    items:
      - stem: У Гаврилы не было ___ думать долго.
        hint: время
        accept: ["времени"]
      - stem: Степан не дал Герасиму ни ___.
        hint: копейка
        accept: ["копейки"]
      - stem: Больше Герасим никогда не держал ___.
        hint: собаки
        accept: ["собак"]
      - stem: Татьяна плакала, но Герасим не видел ___.
        hint: она
        accept: ["её"]
      - stem: Герасим не взял в лодку ничего, кроме собаки и ___.
        hint: два тяжёлых кирпича
        accept: ["двух тяжёлых кирпичей"]

  - id: e5
    type: translate
    task: 翻译下列句子，注意否定句里名词的格。
    items:
      - zh: 盖拉辛一辈子没听见过一点声音。
        accept: ["Герасим никогда в жизни не слышал ни одного звука.", "Герасим за всю жизнь не слышал ни одного звука.", "Всю жизнь Герасим не слышал ни одного звука.", "Герасим никогда не слышал ни одного звука.", "Герасим никогда в жизни не слышал ни звука."]
        rubric: ["[ни одного звука]{.ru}：有 [ни]{.ru}，用第二格", "双重否定 [никогда … не]{.ru}"]
      - zh: 谁也没有问过塔季扬娜的意见。
        accept: ["Мнения Татьяны никто не спрашивал.", "Никто не спрашивал мнения Татьяны.", "Никто не спросил мнения Татьяны.", "Мнения Татьяны никто не спросил."]
        rubric: ["抽象名词 [мнения]{.ru} 用否定第二格", "[никто не]{.ru} 双重否定"]
      - zh: 他除了一个小包袱，什么也没带。
        accept: ["Он не взял ничего, кроме небольшого узелка.", "Он ничего не взял, кроме узелка.", "Он не взял ничего, кроме узелка.", "Он ничего не взял, кроме небольшого узелка.", "Кроме небольшого узелка, он ничего не взял.", "Кроме узелка, он ничего не взял."]
        rubric: ["[ничего не взял]{.ru}：[ничего]{.ru} 是第二格", "[кроме]{.ru} + 第二格"]

  - id: e7
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [возить]{.ru} 接第四格：[бочку]{.ru}。第 2 题 [из]{.ru} + 第二格，形容词复数第二格 [дубовых]{.ru}，名词 [досок]{.ru}。第 3 题 [садясь в]{.ru} + 第四格：[в телегу]{.ru}。第 4 题 [с]{.ru} + 第五格，[с пушистым хвостом]{.ru}，形容词与阳性名词一致。第 5 题 [порода]{.ru} 作非一致定语用第二格：[испанской породы]{.ru}。"
    items:
      - stem: Герасим возил ___ с водой.
        hint: бочка
        accept: ["бочку"]
      - stem: Кровать он сделал из толстых ___ досок.
        hint: дубовый
        accept: ["дубовых"]
      - stem: Татьяна заплакала и, садясь в ___, поцеловала его.
        hint: телега
        accept: ["телегу"]
      - stem: Муму была собачкой с ___ хвостом.
        hint: пушистый
        accept: ["пушистым"]
      - stem: Это была собачка испанской ___.
        hint: порода
        accept: ["породы"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，用课文细节说明理由，最后得出结论。
    items:
      - prompt: "[Почему Герасим сам утопил Муму, а потом всё-таки ушёл в деревню?]{.ru} 至少用三处否定第二格。"
        length: 180–220
        model: "Многие читатели не могут понять, почему Герасим сам утопил Муму, а потом всё-таки ушёл в деревню. Ведь он мог сразу уйти вместе с собакой. По-моему, ответ на этот вопрос объясняет весь рассказ. Герасим всю жизнь был слугой. Барыня решала за него всё: где ему жить, что делать, на ком жениться. Он не знал другой жизни и не мог даже подумать, что барыню можно не слушать. Поэтому он сам повёл Муму к реке: он дал слово и не хотел, чтобы собаку утопил кто-то чужой. Перед этим он надел праздничный кафтан и заказал ей щи с мясом — так он прощался с единственным близким другом: ведь у него не было ни семьи, ни друзей, только Муму. Но, утопив Муму, Герасим как будто стал другим человеком. Он понял, что больше ему нечего терять, и в первый раз в жизни сам решил свою судьбу. Он не взял ничего, кроме узелка, и пешком пошёл домой. Конечно, его поступок трудно назвать правильным: собака ни в чём не была виновата. Однако виноват здесь не столько Герасим, сколько порядок, при котором один человек может решать судьбу другого. Мне кажется, именно это и хотел показать Тургенев. Поэтому этот короткий рассказ и сегодня никто не может читать спокойно."
        rubric: ["开头提出问题并给出自己的回答", "理由与课文细节对应（女主人决定一切、过节的衣服和肉菜汤、只带一个小包袱）", "有让步：承认这个行为难以接受", "结论指向作品的主题", "至少三处否定第二格", "180–220 词"]
        notes: "范文约 200 词。开头先摆出读者常有的疑问，再说“这个问题的答案能解释整篇小说”，引出论证。论证分两步：为什么他亲手做（他一辈子是仆人，答应了的事要做到，不愿让外人下手）；为什么之后还是走了（失去了唯一的亲近者，再也没什么可失去的，第一次自己决定命运）。[Конечно…, однако…]{.ru} 是常见的让步结构，[не столько…, сколько…]{.ru} 意思是“与其说……不如说……”，用来把原因从个人引向制度。否定第二格：[не знал другой жизни]{.ru}、[не было ни семьи, ни друзей]{.ru}、[нечего терять]{.ru}、[не взял ничего]{.ru}。"
