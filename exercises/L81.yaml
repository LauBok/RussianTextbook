lesson: L81
grammar: "[встава́ть]{.ru} 类动词（[встава́ть, устава́ть, дава́ть]{.ru}）现在时去掉 [-ва-]{.ru}：[встаю́, встаёшь]{.ru}；过去时和命令式保留 [-ва-]{.ru}；完成体 [встать, уста́ть]{.ru}；[-ся]{.ru} 动词复习。"
exercises:

  - id: e1
    type: fill
    task: 写出动词现在时的正确形式。
    why: "[встава́ть, устава́ть, дава́ть]{.ru} 现在时去掉 [-ва-]{.ru}，词尾重读，重读的 [е]{.ru} 写成 [ё]{.ru}：[встаёшь, даёт]{.ru}。最常见的错误是照搬不定式，写成带 [-ва-]{.ru} 的形式。"
    items:
      - stem: Я ___ в семь часо́в.
        hint: встава́ть
        accept: [встаю́]
      - stem: Ми́ша ___ по́здно.
        hint: встава́ть
        accept: [встаёт]
      - stem: Ты не ___?
        hint: устава́ть
        accept: [устаёшь]
      - stem: Ма́ма ___ мне ча́шку ча́я.
        hint: дава́ть
        accept: [даёт]
      - stem: В суббо́ту мы ___ в де́сять.
        hint: встава́ть
        accept: [встаём]
      - stem: Студе́нты о́чень ___.
        hint: устава́ть
        accept: [устаю́т]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "现在时没有 [-ва-]{.ru}，过去时和命令式有 [-ва-]{.ru}：第 1 题是现在时，用 [встаю́]{.ru}；第 2 题是命令式，用 [встава́й]{.ru}；第 3 题有 [вчера́]{.ru}，用过去时 [встава́л]{.ru}；第 4 题 [за́втра]{.ru} 说的是具体的一次，用完成体将来时 [вста́ну]{.ru}；第 5 题 [ка́ждый день]{.ru} 表示经常的动作，用未完成体。"
    items:
      - stem: Ка́ждое у́тро я ___ в семь.
        options: [встаю́, встава́ю, вста́ну]
        answer: встаю́
      - stem: Ми́ша, ___! Уже́ во́семь часо́в!
        options: [встаёшь, встава́й, встаю́]
        answer: встава́й
      - stem: Вчера́ я ___ в шесть.
        options: [встаю́, встава́л, встава́й]
        answer: встава́л
      - stem: За́втра я ___ ра́но.
        options: [встаю́, вста́ну, встава́л]
        answer: вста́ну
      - stem: Ива́н Серге́евич ка́ждый день ___ в шесть.
        options: [встаёт, вста́нет]
        answer: встаёт

  - id: e3
    type: fill
    task: 用括号里动词的正确形式填空，注意 [-ся]{.ru} 和 [-сь]{.ru}。
    why: "[-ся]{.ru} 接在辅音后，[-сь]{.ru} 接在元音后：[умыва́юсь]{.ru}（[-ю]{.ru} 是元音），[умыва́ется]{.ru}（[-т]{.ru} 是辅音）。[ложи́ться]{.ru} 是第二变位，词干末尾 [ж]{.ru} 后写 [-у]{.ru}、[-ат]{.ru}：[ложу́сь]{.ru}、[ложа́тся]{.ru}。过去时阴性 [-лась]{.ru}，阳性 [-лся]{.ru}。"
    items:
      - stem: У́тром я ___ и одева́юсь.
        hint: умыва́ться
        accept: [умыва́юсь]
      - stem: Заня́тия ___ в де́вять.
        hint: начина́ться
        accept: [начина́ются]
      - stem: Когда́ ты ___ спать?
        hint: ложи́ться
        accept: [ложи́шься]
      - stem: Мы ___ домо́й в шесть.
        hint: возвраща́ться
        accept: [возвраща́емся]
      - stem: Вчера́ А́нна ___ спать в час.
        hint: ложи́ться
        accept: [ложи́лась]
      - stem: Де́ти ___ в оди́ннадцать.
        hint: ложи́ться
        accept: [ложа́тся]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我每天七点起床。
        accept: ["Ка́ждый день я встаю́ в семь часо́в.", "Я ка́ждый день встаю́ в семь часо́в.", "Ка́ждый день я встаю́ в семь.", "Я ка́ждый день встаю́ в семь.", "Я встаю́ в семь часо́в ка́ждый день.", "Я встаю́ в семь ка́ждый день."]
        rubric: ["[встаю́]{.ru} 不带 [-ва-]{.ru}", "钟点用 [в]{.ru} + 第四格：[в семь (часо́в)]{.ru}", "[ка́ждый день]{.ru} 不加前置词"]
      - zh: 明天我六点起床。
        accept: ["За́втра я вста́ну в шесть часо́в.", "За́втра я вста́ну в шесть.", "Я за́втра вста́ну в шесть часо́в.", "Я за́втра вста́ну в шесть."]
        rubric: ["明天具体的一次用完成体将来时 [вста́ну]{.ru}", "[в шесть (часо́в)]{.ru}"]
      - zh: 他洗脸、穿衣服，然后去厨房。
        accept: ["Он умыва́ется, одева́ется и идёт на ку́хню.", "Он умыва́ется, одева́ется, пото́м идёт на ку́хню.", "Он умыва́ется, одева́ется и пото́м идёт на ку́хню."]
        rubric: ["[умыва́ется, одева́ется]{.ru} 写作 [-ется]{.ru}，不带 [ь]{.ru}", "“去厨房”用 [на ку́хню]{.ru}"]
      - zh: 你累吗？——当然累。
        accept: ["— Ты устаёшь? — Коне́чно, устаю́.", "— Ты устаёшь? — Устаю́, коне́чно.", "— Ты не устаёшь? — Устаю́, коне́чно.", "— Ты не устаёшь? — Коне́чно, устаю́."]
        rubric: ["[устаёшь, устаю́]{.ru} 不带 [-ва-]{.ru}"]
      - zh: 米沙每天上学迟到。
        accept: ["Ми́ша ка́ждый день опа́здывает в шко́лу.", "Ка́ждый день Ми́ша опа́здывает в шко́лу."]
        rubric: ["“上学迟到”用 [опа́здывать в шко́лу]{.ru}，[в]{.ru} + 第四格", "经常的动作用未完成体"]

  - id: e5
    type: open
    task: 写一写你的一天。
    items:
      - prompt: 用 8–10 句话写你平常的一天：几点起床、洗脸穿衣、吃早饭、上课或上班、回家、晚上做什么、几点睡觉。尽量用上 [встава́ть, умыва́ться, одева́ться, возвраща́ться, ложи́ться спать]{.ru}。
        length: 60–100
        model: "Я встаю́ в семь часо́в. Я умыва́юсь, одева́юсь и за́втракаю. У́тром я пью чай и чита́ю но́вости. В во́семь я е́ду в университе́т на авто́бусе. Заня́тия начина́ются в де́вять и конча́ются в два часа́. По́сле обе́да я занима́юсь в библиоте́ке. Домо́й я возвраща́юсь в шесть. Ве́чером я у́жинаю, де́лаю дома́шнее зада́ние и смотрю́ фильм. Я ложу́сь спать в оди́ннадцать. В суббо́ту я встаю́ по́здно, в де́сять."
        rubric: ["按时间顺序写清一天的主要活动", "[встаю́]{.ru} 不带 [-ва-]{.ru}", "[-ся]{.ru} 动词第一人称写 [-сь]{.ru}：[умыва́юсь, одева́юсь, ложу́сь]{.ru}", "钟点用 [в]{.ru} + 数词"]
        notes: 范文按时间顺序从早写到晚，最后用星期六作对比收尾。每句以时间状语或主语开头，句子短而清楚。注意第一人称 [-ся]{.ru} 动词都写成 [-сь]{.ru}，因为前面是元音 [-ю]{.ru} 或 [-у]{.ru}。
