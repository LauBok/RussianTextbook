lesson: L11
grammar: "名词第六格单数（[-е]{.ru}；阴性 [-ь]{.ru} 词用 [-и]{.ru}）；[в]{.ru} / [на]{.ru} + 第六格表示处所，回答 [где]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里名词的第六格。
    why: 大多数名词第六格词尾是 [-е]{.ru}：辅音结尾的阳性词直接加 [-е]{.ru}，[-а]{.ru}、[-я]{.ru}、[-о]{.ru}、[-й]{.ru} 换成 [-е]{.ru}。第 6 题 [тетра́дь]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，要换成 [-и]{.ru}，最容易错写成 [тетра́де]{.ru}。第 3 题 [стол]{.ru} 的重音移到词尾。第 8 题 [фо́то]{.ru} 不变格。
    items:
      - stem: Па́па на ___.
        hint: заво́д
        accept: ["заво́де"]
      - stem: Ма́ма в ___.
        hint: поликли́ника
        accept: ["поликли́нике"]
      - stem: Ко́шка на ___.
        hint: стол
        accept: ["столе́"]
      - stem: А́нна в ___.
        hint: университе́т
        accept: ["университе́те"]
      - stem: Ми́ша в ___.
        hint: шко́ла
        accept: ["шко́ле"]
      - stem: Ру́чка в ___.
        hint: тетра́дь
        accept: ["тетра́ди"]
      - stem: Ма́ма на ___.
        hint: ку́хня
        accept: ["ку́хне"]
      - stem: Кто э́то на ___?
        hint: фо́то
        accept: ["фо́то"]

  - id: e2
    type: choice
    task: 用 [в]{.ru} 或 [на]{.ru} 填空。
    why: "[в]{.ru} 表示在里面，[на]{.ru} 表示在表面上；[рабо́та]{.ru}、[заво́д]{.ru}、[ку́хня]{.ru} 习惯上和 [на]{.ru} 连用，要随词记住。第 4 题和第 6 题对比：在桌子上用 [на]{.ru}，在房间里用 [в]{.ru}。"
    items:
      - stem: Па́па ___ рабо́те.
        options: [в, на]
        answer: на
      - stem: Ми́ша ___ шко́ле.
        options: [в, на]
        answer: в
      - stem: Ива́н Серге́евич ___ заво́де.
        options: [в, на]
        answer: на
      - stem: Кни́га ___ столе́.
        options: [в, на]
        answer: на
      - stem: Ма́ма ___ ку́хне.
        options: [в, на]
        answer: на
      - stem: Му́рка ___ ко́мнате.
        options: [в, на]
        answer: в
      - stem: А́нна ___ библиоте́ке.
        options: [в, на]
        answer: в

  - id: e3
    type: rewrite
    task: 按括号里的提示回答问题。
    placeholder: Он / Она́ …
    example:
      cue: Где А́нна? (университе́т)
      answer: Она́ в университе́те.
    why: 回答 [где]{.ru} 用 [в]{.ru} / [на]{.ru} + 第六格。名词前置词的选择要注意：[заво́д]{.ru}、[рабо́та]{.ru}、[ку́хня]{.ru} 用 [на]{.ru}。代词要和人的性别一致：[па́па]{.ru}、[Ми́ша]{.ru} 用 [он]{.ru}，[ко́шка]{.ru} 用 [она́]{.ru}。
    items:
      - cue: Где па́па? (заво́д)
        accept: ["Он на заво́де.", "Па́па на заво́де.", "На заво́де."]
      - cue: Где ма́ма? (поликли́ника)
        accept: ["Она́ в поликли́нике.", "Ма́ма в поликли́нике.", "В поликли́нике."]
      - cue: Где Ми́ша? (шко́ла)
        accept: ["Он в шко́ле.", "Ми́ша в шко́ле.", "В шко́ле."]
      - cue: Где Му́рка? (ку́хня)
        accept: ["Она́ на ку́хне.", "Му́рка на ку́хне.", "На ку́хне."]
      - cue: Где А́нна? (библиоте́ка)
        accept: ["Она́ в библиоте́ке.", "А́нна в библиоте́ке.", "В библиоте́ке."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：妈妈在诊所，爸爸在工厂，安娜在大学的图书馆，米沙已经在家，穆尔卡在房间里的桌子上。
    items:
      - stem: Ма́ма ___.
        options: [в поликли́нике, на заво́де, в шко́ле]
        answer: в поликли́нике
      - stem: Па́па ___.
        options: [в университе́те, на заво́де, до́ма]
        answer: на заво́де
      - stem: А́нна сейча́с ___.
        options: [на ку́хне, в шко́ле, в библиоте́ке]
        answer: в библиоте́ке
      - stem: Ми́ша ___.
        options: [до́ма, в шко́ле, на рабо́те]
        answer: до́ма
      - stem: Му́рка ___.
        options: [на ку́хне, на столе́, в шко́ле]
        answer: на столе́

  - id: e5
    type: translate
    task: 译成俄语。
    why: 现在时不用系动词，“在……”直接用 [в]{.ru} / [на]{.ru} + 第六格。“在家”是副词 [до́ма]{.ru}，不说 [в до́ме]{.ru}。
    items:
      - zh: 安娜在哪儿？——她在大学。
        accept: ["— Где А́нна? — Она́ в университе́те.", "— Где А́нна? — В университе́те.", "— Где А́нна? — А́нна в университе́те."]
        rubric: ["[в университе́те]{.ru}：前置词 [в]{.ru}，名词用第六格", 不用系动词]
      - zh: 爸爸在上班，妈妈也在上班。
        accept: ["Па́па на рабо́те, ма́ма то́же на рабо́те.", "Па́па на рабо́те, и ма́ма то́же на рабо́те.", "Па́па на рабо́те. Ма́ма то́же на рабо́те.", "Па́па на рабо́те, ма́ма то́же.", "Па́па на рабо́те, и ма́ма то́же."]
        rubric: ["“在上班”是 [на рабо́те]{.ru}，不用 [в]{.ru}", "“也”用 [то́же]{.ru}"]
      - zh: 米沙已经在家了。
        accept: ["Ми́ша уже́ до́ма."]
        rubric: ["“在家”用副词 [до́ма]{.ru}", "“已经”用 [уже́]{.ru}"]
      - zh: 猫又在桌子上！
        accept: ["Ко́шка опя́ть на столе́!", "Му́рка опя́ть на столе́!", "Ко́шка на столе́ опя́ть!"]
        rubric: ["[на столе́]{.ru}：重音在词尾", "“又”用 [опя́ть]{.ru}"]
      - zh: 词典在桌子里，书在桌子上。
        accept: ["Слова́рь в столе́, а кни́га на столе́.", "Слова́рь в столе́, кни́га на столе́.", "Слова́рь в столе́. Кни́га на столе́.", "Кни́га на столе́, а слова́рь в столе́.", "Кни́га на столе́, слова́рь в столе́."]
        rubric: ["“在桌子里”用 [в]{.ru}，“在桌子上”用 [на]{.ru}", "[столе́]{.ru} 是第六格"]
