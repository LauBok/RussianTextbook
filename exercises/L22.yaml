lesson: L22
grammar: "动物名词第四格：以 [-а]{.ru}、[-я]{.ru} 结尾的变 [-у]{.ru}、[-ю]{.ru}，以辅音、[-й]{.ru}、[-ь]{.ru} 结尾的阳性动物名词加 [-а]{.ru} 或变 [-я]{.ru}；[кто → кого́]{.ru}；人称代词第四格 [меня́, тебя́, его́, её, нас, вас, их]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的名词变成第四格填空。
    why: 以 [-а]{.ru}、[-я]{.ru} 结尾的名词变 [-у]{.ru}、[-ю]{.ru}，指男人的 [Ми́ша]{.ru}、[па́па]{.ru} 也一样（第 3、6 题）。以辅音结尾的阳性动物名词加 [-а]{.ru}：[друг → дру́га]{.ru}，[Ива́н Серге́евич → Ива́на Серге́евича]{.ru}，名字和父称都要变。最容易错的是把阳性动物名词当成非动物名词，第四格照抄第一格。
    items:
      - stem: Я жду ___.
        hint: А́нна
        accept: [А́нну]
      - stem: Ты зна́ешь ___?
        hint: Ива́н Серге́евич
        accept: [Ива́на Серге́евича]
      - stem: Мы ждём ___.
        hint: Ми́ша
        accept: [Ми́шу]
      - stem: Ван Лэй хорошо́ зна́ет ___.
        hint: Мари́я Никола́евна
        accept: [Мари́ю Никола́евну]
      - stem: А́нна по́мнит ___.
        hint: Ка́тя
        accept: [Ка́тю]
      - stem: Ми́ша ждёт ___.
        hint: па́па
        accept: [па́пу]
      - stem: Я жду ___.
        hint: друг
        accept: [дру́га]
      - stem: Ты ви́дишь ___?
        hint: ко́шка Му́рка
        accept: [ко́шку Му́рку]

  - id: e2
    type: rewrite
    task: 用人称代词代替句中作宾语的名词，代词放在动词前面。
    example:
      cue: Я зна́ю А́нну.
      answer: Я её зна́ю.
    why: 代词要和被代替的名词性、数一致：[А́нна → её]{.ru}，[Ми́ша]{.ru}、[Ива́н Серге́евич → его́]{.ru}，复数 [→ их]{.ru}。[Ми́ша]{.ru} 虽然以 [-а]{.ru} 结尾，但指男孩，代词用 [его́]{.ru}，不用 [её]{.ru}。
    items:
      - cue: Мы ждём Ми́шу.
        accept: [Мы его́ ждём.]
      - cue: Ван Лэй по́мнит Ка́тю.
        accept: [Ван Лэй её по́мнит.]
      - cue: Я зна́ю Ива́на Серге́евича и Мари́ю Никола́евну.
        accept: [Я их зна́ю.]
      - cue: А́нна ждёт дру́га.
        accept: [А́нна его́ ждёт.]
      - cue: Ты по́мнишь ма́му?
        accept: ["Ты её по́мнишь?"]

  - id: e3
    type: choice
    task: 选择正确的人称代词。
    why: 回答时人称要转换：对方问“你记得我吗”，答“我记得你”，[меня́ → тебя́]{.ru}；问“你们”，答“我们”，[вас → нас]{.ru}，反之亦然。第 5 题问的是人，所以用 [кого́]{.ru}；第 6 题是物，用 [что]{.ru}。
    items:
      - stem: — Ты меня́ по́мнишь? — Да, я ___ по́мню.
        options: [меня́, тебя́, его́]
        answer: тебя́
      - stem: — Вы нас ждёте? — Да, мы ___ ждём.
        options: [нас, вас, их]
        answer: вас
      - stem: — Вы меня́ зна́ете? — Нет, я ___ не зна́ю.
        options: [вас, нас, тебя́]
        answer: вас
      - stem: — Ты ждёшь нас? — Да, я жду ___.
        options: [нас, вас, их]
        answer: вас
      - stem: — ___ ты ждёшь? — А́нну.
        options: [Кого́, Что]
        answer: Кого́
      - stem: — ___ ты чита́ешь? — Газе́ту.
        options: [Кого́, Что]
        answer: Что

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题 [кто]{.ru} 作宾语要变成 [кого́]{.ru}。第 3 题“也”可以用 [и]{.ru} 或 [то́же]{.ru}，[и]{.ru} 放在强调的词前面。第 4 题代词宾语放在动词前后都可以。
    items:
      - zh: ——你在等谁？——我在等米沙。
        accept: ["— Кого́ ты ждёшь? — Я жду Ми́шу.", "— Кого́ ты ждёшь? — Ми́шу."]
        rubric: ["疑问词用 [кого́]{.ru}", "[Ми́ша]{.ru} 变成 [Ми́шу]{.ru}"]
      - zh: 你认识伊万·谢尔盖耶维奇吗？
        accept: ["Ты зна́ешь Ива́на Серге́евича?", "Вы зна́ете Ива́на Серге́евича?", "Ива́на Серге́евича ты зна́ешь?", "Ива́на Серге́евича вы зна́ете?"]
        rubric: ["名字和父称都变第四格 [Ива́на Серге́евича]{.ru}"]
      - zh: 这么说，你也认识安娜？
        accept: ["Зна́чит, ты зна́ешь и А́нну?", "Зна́чит, ты то́же зна́ешь А́нну?", "Зна́чит, и А́нну ты зна́ешь?"]
        rubric: ["[А́нну]{.ru} 用第四格", "“这么说”用 [зна́чит]{.ru}"]
      - zh: 我记得她，她也记得我。
        accept: ["Я её по́мню, и она́ меня́ по́мнит.", "Я по́мню её, и она́ по́мнит меня́.", "Я её по́мню, и она́ то́же меня́ по́мнит.", "Я по́мню её, а она́ по́мнит меня́.", "Я по́мню её, и она́ то́же по́мнит меня́.", "Я её по́мню, и она́ меня́ то́же по́мнит."]
        rubric: ["[её]{.ru}、[меня́]{.ru} 用第四格", "[по́мнить]{.ru} 是第二变位：[по́мню, по́мнит]{.ru}"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你在地铁站等朋友时遇见一个同学。编一段 6–8 句的对话：他问你在等谁，你回答；他说自己也认识这个人；最后朋友来了。
        length: 40–70
        model: |
          — Приве́т! Кого́ ты ждёшь?
          — Приве́т! Я жду Ми́шу.
          — Ми́шу? Я его́ зна́ю! Ра́ньше он жил в на́шем до́ме.
          — Пра́вда? А он тебя́ по́мнит?
          — Наве́рное, уже́ не по́мнит.
          — О, вот и Ми́ша!
          — Ми́ша, приве́т! Ты меня́ по́мнишь?
          — Коне́чно, по́мню!
        rubric: ["用 [кого́]{.ru} 提问", 至少一个动物名词第四格, 至少两个人称代词第四格, 只用现在时和过去时]
        notes: 范文按“问—答—追问—结局”展开。动物名词第四格 [Ми́шу]{.ru}，代词第四格 [его́]{.ru}、[тебя́]{.ru}、[меня́]{.ru}，都放在动词前面，这是口语里最自然的语序。朋友之间用 [ты]{.ru} 和 [приве́т]{.ru}。
