lesson: B3-L48
grammar: "口语中的省略：省去运动动词（[Я — на дачу]{.ru}）、[нужно]{.ru}（[Мне в магазин]{.ru}）、主语和答句中重复的部分。语气词表示说话人的态度：[же]{.ru}（显而易见、责备）、[ведь]{.ru}（提醒）、[-то]{.ru}（加强）、[разве]{.ru}（怀疑）、[неужели]{.ru}（惊讶）、[вот, ну, уж, да, что ли]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как русские проводят выходные? Почему один из друзей сначала хотел ехать на дачу к маме? Что друзья решили взять с собой? Почему Лена просит не опаздывать? Что друзья собираются делать в воскресенье утром? Зачем в разговоре нужны частицы?]{.ru}"
        length: 70–110
        model: "Русские проводят выходные по-разному: на даче, в лесу, на реке, в городе, в походах. Один из друзей хотел поехать на дачу, потому что мама попросила его помочь с огородом: нужно посадить картошку. Друзья решили взять мясо, хлеб, овощи и чай. Лена просит не опаздывать, потому что в прошлый раз один из друзей опоздал на час. В воскресенье утром они хотят пойти на рыбалку: будильник поставили на пять часов. Частицы ничего не называют, но выражают отношение говорящего: удивление, сомнение, упрёк. Без них речь была бы сухой."
        rubric: ["六个问题都回答，内容与课文一致", "回答用完整的句子，不用课文里的省略句", "[помочь с чем]{.ru}、[опоздать на час]{.ru} 用得对"]
        notes: 这组回答是书面的转述，所以要把对话里的省略句补全：[Я — на дачу]{.ru} 转述为 [хотел поехать на дачу]{.ru}。

  - id: e2
    type: choice
    task: 选择适当的语气词。
    why: "第 1 题说话人听到好消息很惊讶，后面接着说 [Вот здорово!]{.ru}，用 [Неужели]{.ru}；[Разве?]{.ru} 表示怀疑，与高兴的口气不合；[Ведь]{.ru} 不能单独作答。第 2 题是疑问句，说话人以为对方是知道的（后面说“我跟你说过”），用 [Разве]{.ru}；[вот]{.ru} 不能构成疑问，[же]{.ru} 不能放在句首。第 3 题强调显而易见的事、带责备，[же]{.ru} 紧跟在 [ты]{.ru} 后面；[ведь]{.ru} 也能放在这个位置，但它口气平和，与感叹号表示的不满不相配，而 [разве]{.ru} 是问句用的。第 4 题提醒对方本来知道的理由，放在句首只能用 [Ведь]{.ru}，[же]{.ru} 不能放在句首。"
    items:
      - stem: — Лена вернулась. — ___? Вот здорово!
        options: [Неужели, Разве, Ведь]
        answer: Неужели
      - stem: ___ ты не знал, что Лена в Питере? Я же тебе говорил.
        options: [Разве, Вот, Же]
        answer: Разве
      - stem: Опять огород? Ты ___ на прошлой неделе там был!
        options: [же, разве, ли]
        answer: же
      - stem: Не опаздывай. ___ в прошлый раз ты опоздал на час.
        options: [Же, Ведь, Разве]
        answer: Ведь

  - id: e3
    type: rewrite
    task: 把口语里的省略句补全，改写成完整的句子。
    example:
      cue: Я — на дачу.
      answer: Я поеду на дачу.
    why: "先判断省去了什么：运动动词、[нужно]{.ru}、主语还是重复的部分。第 1 题省去 [нужно идти]{.ru}（或 [нужно]{.ru} + 其他动词）。第 2 题答句只剩 [Был]{.ru}，补出主语和地点。第 3 题省去 [поедем]{.ru}，[давайте]{.ru} 后面接完成体将来时第一人称复数。第 4 题省去主语和宾语：[я видел её]{.ru}。"
    items:
      - cue: Мне всё равно в магазин.
        accept: ["Мне всё равно нужно идти в магазин.", "Мне всё равно нужно в магазин.", "Мне всё равно надо идти в магазин.", "Мне всё равно нужно пойти в магазин.", "Мне всё равно надо пойти в магазин."]
      - cue: — Ты там был? — Был.
        accept: ["— Ты там был? — Да, я там был.", "— Ты там был? — Да, я был там."]
      - cue: Давайте все вместе к Серёже на дачу!
        accept: ["Давайте поедем все вместе к Серёже на дачу!", "Давайте все вместе поедем к Серёже на дачу!"]
      - cue: Вернулась уже. Вчера видел.
        accept: ["Она уже вернулась. Я видел её вчера.", "Она уже вернулась. Я её вчера видел.", "Она уже вернулась. Вчера я её видел.", "Она уже вернулась. Я вчера её видел."]

  - id: e4
    type: translate
    task: 翻译下列句子，用口语的说法。
    items:
      - zh: 你上星期不是去过了吗！
        accept: ["Ты же на прошлой неделе там был!", "Ты же был там на прошлой неделе!", "Ты же на прошлой неделе был там!"]
        rubric: ["用语气词 [же]{.ru} 表示“显而易见”，紧跟在 [ты]{.ru} 后面", "[на прошлой неделе]{.ru}：[на]{.ru} + 第六格"]
      - zh: 她难道不在彼得堡？
        accept: ["Она разве не в Питере?", "Разве она не в Питере?", "Разве она не в Петербурге?", "Она разве не в Петербурге?"]
        rubric: ["用 [разве]{.ru} 表示怀疑", "口语里可以用 [Питер]{.ru}"]
      - zh: 这是说我吗？
        accept: ["Это она мне, что ли?", "Это он мне, что ли?", "Это мне, что ли?", "Это обо мне, что ли?"]
        rubric: ["句末用 [что ли]{.ru}，前面加逗号", "省去动词 [говорит]{.ru}"]

  - id: e5
    type: open
    task: 应用文：写一段手机聊天记录，约朋友周末一起出去。
    items:
      - prompt: 两个人在即时通讯软件里聊天：一个提议周末去某地（别墅、公园、博物馆、远足……），另一个先找理由推辞，最后答应；商量时间、地点和要带的东西。每行用 [—]{.ru} 开头，至少用四个不同的语气词（[же, ведь, разве, неужели, ну, вот, -то, уж, что ли]{.ru}）和三个省略句。
        length: 80–120
        model: "— Привет! Ты в субботу как, свободен? — Привет. А что? — Давай в Коломенское! Погода ведь будет отличная. — Да ну, у меня курсовая. — Опять курсовая? Ты же вчера весь день над ней сидел! — Сидел. А кто её закончит? Сама она себя не напишет. — Ну хоть на несколько часов! Утром — в парк, после обеда — домой, за курсовую. — Ладно, ладно, еду. Во сколько? — В десять, у метро. — Неужели так рано? — Да, рано. Ты разве забыл, что в прошлый раз мы опоздали на экскурсию? — Ох уж эти экскурсии! Ладно. А что взять? — Воду и бутерброды. Я — чай в термосе. — Договорились. До субботы!"
        rubric: ["是口语对话：短句、省略句至少三个（[Утром — в парк]{.ru}、[Я — чай в термосе]{.ru} 等）", "至少四个不同的语气词，意义用得对", "对话完整：提议、推辞、答应、时间地点、要带的东西", "80–120 词"]
        notes: "范文约 100 词。语气词：[ведь]{.ru}（提醒天气好）、[же]{.ru}（责备“你昨天不是已经……”）、[ну]{.ru}（催促）、[неужели]{.ru}（惊讶）、[разве]{.ru}（怀疑对方忘了）、[уж]{.ru}（加强感叹）。省略句：[Утром — в парк, после обеда — домой]{.ru}（省去 [пойдём]{.ru}）、[Во сколько?]{.ru}、[В десять, у метро]{.ru}、[Я — чай в термосе]{.ru}（省去 [возьму]{.ru}）。[Ладно, ладно, еду]{.ru}（好吧好吧，我去）是答应时常说的话。"

  - id: e6
    type: choice
    task: 选择合适的词，补全口语对话。
    why: "第 1 题赞叹舒服用口语词 [благодать]{.ru}；[согласие]{.ru} 是“同意”，[удивление]{.ru} 是“惊讶”，都不能单独作感叹。第 2 题手机没电是 [разрядился]{.ru}。第 3 题被蚊子叮用 [загрызут]{.ru}（口语夸张）。第 4 题 [а то]{.ru} 表示“不然”，后面说出不叫醒的后果。"
    items:
      - stem: — Ох, ___! Вот это жизнь!
        options: [благодать, согласие, удивление]
        answer: благодать
      - stem: — Сам звони. У меня телефон ___.
        options: [разрядился, уговорил, затеял]
        answer: разрядился
      - stem: — Ой, а комаров сколько! Прямо ___!
        options: [загрызут, вскопают, проспят]
        answer: загрызут
      - stem: — Только разбуди меня, ___ я точно просплю.
        options: ["а то", "а вот", "а ну"]
        answer: а то
