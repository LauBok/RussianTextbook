lesson: B2-L56
grammar: "序数词的变格；合成序数词只变最后一个词；年份 [в… году́]{.ru}；完整日期中的第二格；“第几次” [в… раз]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里序数词的正确形式填空。
    why: "序数词按形容词变格。第 1、6 题“在某日”用第二格，年份跟在日期后面也用第二格；第 2 题“在某年”用 [в]{.ru} + 第六格，合成序数词只变最后一个词，[тре́тий]{.ru} 的第六格是 [тре́тьем]{.ru}；第 3 题“今天是几号”用中性第一格；第 4 题 [на]{.ru} + 第六格；第 5 题 [нача́ло]{.ru} 后用第二格，复数 [девяно́стых]{.ru}；第 7 题 [пе́ред]{.ru} 支配第五格；第 8 题 [в… раз]{.ru} 用第四格，[раз]{.ru} 是阳性非动物名词，第四格同第一格。"
    items:
      - stem: Пе́рвый экза́мен у Ван Лэ́я ___ ию́ня.
        hint: пятна́дцатый
        accept: ["пятна́дцатого"]
      - stem: Петербу́рг основа́ли в ты́сяча семьсо́т ___ году́.
        hint: тре́тий
        accept: ["тре́тьем"]
      - stem: Сего́дня ___ ию́ня, День Росси́и.
        hint: двена́дцатый
        accept: ["двена́дцатое"]
      - stem: Ди́ма у́чится на ___ ку́рсе.
        hint: второ́й
        accept: ["второ́м"]
      - stem: Пра́здник появи́лся в нача́ле ___ годо́в.
        hint: девяно́стый
        accept: ["девяно́стых"]
      - stem: А́нна родила́сь тре́тьего ию́ля две ты́сячи ___ го́да.
        hint: седьмо́й
        accept: ["седьмо́го"]
      - stem: Пе́ред ___ экза́меном Ван Лэй бу́дет отдыха́ть.
        hint: второ́й
        accept: ["вторы́м"]
      - stem: Я смотрю́ э́тот фильм уже́ в ___ раз.
        hint: тре́тий
        accept: ["тре́тий"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "只说年份时用 [в]{.ru} + 第六格（第 1 题）；年份跟在具体日期后面时用第二格（第 2 题）。问“今天几号”，回答里日期用中性第一格（第 3 题）；问“哪一天”（[како́го числа́]{.ru}），回答用第二格（第 4 题）。第 5 题 [с]{.ru} 要求第二格，但年份里只有最后的序数词变格，[две ты́сячи]{.ru} 保持原形。"
    items:
      - stem: Метро́ в Москве́ откры́ли ___.
        options: [в ты́сяча девятьсо́т три́дцать пя́том году́, ты́сяча девятьсо́т три́дцать пя́того го́да]
        answer: в ты́сяча девятьсо́т три́дцать пя́том году́
      - stem: Метро́ откры́ли пятна́дцатого ма́я ___.
        options: [в ты́сяча девятьсо́т три́дцать пя́том году́, ты́сяча девятьсо́т три́дцать пя́того го́да]
        answer: ты́сяча девятьсо́т три́дцать пя́того го́да
      - stem: — Како́е сего́дня число́? — Сего́дня ___ ию́ня.
        options: [двена́дцатое, двена́дцатого]
        answer: двена́дцатое
      - stem: — Како́го числа́ у тебя́ после́дний экза́мен? — ___ ию́ня.
        options: [Два́дцать пя́тое, Два́дцать пя́того]
        answer: Два́дцать пя́того
      - stem: Ван Лэй живёт в Москве́ с сентября́ ___ го́да.
        options: [две ты́сячи два́дцать шесто́го, двух ты́сяч два́дцать шесто́го]
        answer: две ты́сячи два́дцать шесто́го

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题年份用 [в]{.ru} + 第六格；第 2 题“在某日”用第二格；第 3 题“第一次”用 [в пе́рвый раз]{.ru}，也可以用 [впервы́е]{.ru}；第 4 题年份跟在日期后面，用第二格。"
    items:
      - zh: 彼得堡建于 1703 年。
        accept: ["Петербу́рг основа́ли в ты́сяча семьсо́т тре́тьем году́.", "В ты́сяча семьсо́т тре́тьем году́ основа́ли Петербу́рг."]
        rubric: ["[в ты́сяча семьсо́т тре́тьем году́]{.ru}：只有 [тре́тьем]{.ru} 变格", "不定人称句 [основа́ли]{.ru}"]
      - zh: 第一门考试在 6 月 15 日。
        accept: ["Пе́рвый экза́мен пятна́дцатого ию́ня.", "Пе́рвый экза́мен бу́дет пятна́дцатого ию́ня.", "Пе́рвый экза́мен — пятна́дцатого ию́ня.", "Пятна́дцатого ию́ня пе́рвый экза́мен.", "Пятна́дцатого ию́ня бу́дет пе́рвый экза́мен."]
        rubric: ["“在某日”用第二格 [пятна́дцатого ию́ня]{.ru}"]
      - zh: 我第一次在莫斯科过俄罗斯日。
        accept: ["Я в пе́рвый раз отмеча́ю День Росси́и в Москве́.", "Я пе́рвый раз отмеча́ю День Росси́и в Москве́.", "Я впервы́е отмеча́ю День Росси́и в Москве́.", "В пе́рвый раз я отмеча́ю День Росси́и в Москве́.", "Я в пе́рвый раз отмеча́ю в Москве́ День Росси́и.", "Я впервы́е отмеча́ю в Москве́ День Росси́и."]
        rubric: ["[в пе́рвый раз]{.ru} 或 [впервы́е]{.ru}", "[отмеча́ть]{.ru} 节日"]
      - zh: 安娜生于 2007 年 7 月 3 日。
        accept: ["А́нна родила́сь тре́тьего ию́ля две ты́сячи седьмо́го го́да."]
        rubric: ["日、年都用第二格", "[две ты́сячи]{.ru} 不变格", "阴性过去时 [родила́сь]{.ru}"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ двена́дцатого ию́ня никто́ не рабо́тал? Что де́лал Ван Лэй у́тром? Куда́ они́ пошли́ с Ди́мой? Что Ди́ма рассказа́л о пра́зднике? Как Ди́ма прове́рил Ван Лэ́я? Где они́ бы́ли ве́чером?]{.ru}"
        length: 60–90
        model: "Двена́дцатого ию́ня был День Росси́и, и никто́ не рабо́тал. У́тром Ван Лэй занима́лся: пе́рвый экза́мен у него́ пятна́дцатого ию́ня. Но позвони́л Ди́ма, и они́ пошли́ гуля́ть по Тверско́й. Ди́ма рассказа́л, что выходны́м днём пра́здник стал в ты́сяча девятьсо́т девяно́сто второ́м году́, а назва́ние «День Росси́и» получи́л в две ты́сячи второ́м. Пото́м Ди́ма спра́шивал Ван Лэ́я о да́тах из исто́рии Москвы́ и Петербу́рга, и Ван Лэй всё знал. Ве́чером друзья́ смотре́ли салю́т на Воробьёвых гора́х."
        rubric: ["回答全部六个问题", "年份用 [в… году́]{.ru}，日期用第二格", "序数词变格正确"]
        notes: 范文约 75 词。课文里的问答（三个历史日期）不必一一列出，用 [спра́шивал… о да́тах]{.ru} 概括即可。年份照抄课文时注意合成序数词只变最后一个词。

  - id: e5
    type: open
    task: 作文。题目：[Ва́жные да́ты в мое́й жи́зни]{.ru}（我生活中的重要日子）。
    items:
      - prompt: 写出你出生、上学、上大学、开始学俄语等几件事的日期或年份，说说每一天发生了什么。至少用五个日期或年份。
        length: 100–150
        model: "Я родила́сь девятна́дцатого ма́рта две ты́сячи седьмо́го го́да в Шанха́е. В две ты́сячи четы́рнадцатом году́ я пошла́ в шко́лу. Я хорошо́ по́мню пе́рвый день в шко́ле: у меня́ была́ но́вая су́мка, и ма́ма до́лго смотре́ла на меня́.\n\nВ шко́ле я учи́лась двена́дцать лет. В две ты́сячи два́дцать шесто́м году́ я начала́ учи́ться в университе́те. Пе́рвый уро́к ру́сского языка́ был у меня́ пе́рвого сентября́. Тогда́ я не зна́ла ни одного́ ру́сского сло́ва.\n\nЕщё одна́ ва́жная да́та — тридца́тое декабря́ две ты́сячи два́дцать шесто́го го́да. В э́тот день я в пе́рвый раз написа́ла письмо́ по-ру́сски. Э́то бы́ло письмо́ моему́ преподава́телю, и в нём бы́ло де́сять оши́бок.\n\nА сле́дующая ва́жная да́та бу́дет ле́том: я пое́ду в Москву́ и в пе́рвый раз уви́жу Кремль."
        rubric: ["至少五个日期或年份", "“在某日”用第二格，“在某年”用 [в… году́]{.ru}", "日期后面的年份用第二格", "按时间顺序叙述"]
        notes: 范文是一个中国女生写的，按时间顺序写四段。注意三种格式：[девятна́дцатого ма́рта две ты́сячи седьмо́го го́да]{.ru}（日—月—年都用第二格）、[в две ты́сячи четы́рнадцатом году́]{.ru}（只说年份，用第六格）、[тридца́тое декабря́… — ва́жная да́та]{.ru}（作主语，用第一格）。[ни одного́ сло́ва]{.ru} 意思是“一个词也不”。

  - id: e6
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。6 月 13 日你给北京的朋友写一封信：讲讲 6 月 12 日俄罗斯日你在莫斯科怎么过的，这个节日是怎么来的，再说说你的考试安排（第一门和最后一门在哪天）。
        length: 80–120
        model: "Москва́, 13 ию́ня\n\nДорого́й Ли!\n\nПриве́т! Как твои́ дела́? Как экза́мены?\n\nВчера́, двена́дцатого ию́ня, здесь был большо́й пра́здник — День Росси́и. Выходны́м днём он стал в ты́сяча девятьсо́т девяно́сто второ́м году́, а назва́ние «День Росси́и» получи́л в две ты́сячи второ́м. Мы с Ди́мой гуля́ли по Тверско́й. Везде́ висе́ли фла́ги, на у́лицах игра́ла му́зыка. А ве́чером мы смотре́ли салю́т на Воробьёвых гора́х. Э́то был мой пе́рвый День Росси́и!\n\nТепе́рь у меня́ начина́ются экза́мены. Пе́рвый бу́дет пятна́дцатого ию́ня, а после́дний — два́дцать пя́того.\n\nТвой Ван Лэй"
        rubric: ["书信格式：地点和日期、称呼、落款", "讲清节日的活动和来历", "考试日期用第二格", "至少一个年份 [в… году́]{.ru}"]
        notes: 给朋友写信用 [Дорого́й…!]{.ru}、[Приве́т!]{.ru}，落款 [Твой]{.ru}。正文先问候，再讲节日（时间、来历、活动），最后说自己的近况。
