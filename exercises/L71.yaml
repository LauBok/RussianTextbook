lesson: L71
grammar: "运动动词 [идти́]{.ru}、[е́хать]{.ru}、[ходи́ть]{.ru}、[е́здить]{.ru} 的过去时；[ходи́л / е́здил]{.ru} 表示去了一趟（往返），[шёл / е́хал]{.ru} 表示当时正在路上。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的过去时形式。
    why: "[идти́]{.ru} 的过去时词干完全不同：[шёл, шла, шло, шли]{.ru}，阳性写 [ё]{.ru}，不要写成 [шол]{.ru} 或 [идл]{.ru}。[е́хать]{.ru}、[е́здить]{.ru}、[ходи́ть]{.ru} 按一般规则去掉 [-ть]{.ru} 加 [-л, -ла, -ло, -ли]{.ru}。主语是 [вы]{.ru} 时动词一律用复数，即使指的是一个人。"
    items:
      - stem: А́нна ___ домо́й пешко́м.
        hint: идти́
        accept: ["шла"]
      - stem: Мы ___ в метро́.
        hint: е́хать
        accept: ["е́хали"]
      - stem: Ми́ша ___ в Петербу́рг.
        hint: е́здить
        accept: ["е́здил"]
      - stem: О́льга Ви́кторовна ___ в музе́й.
        hint: ходи́ть
        accept: ["ходи́ла"]
      - stem: Вчера́ ___ снег.
        hint: идти́
        accept: ["шёл"]
      - stem: Вы ___ в галере́ю?
        hint: ходи́ть
        accept: ["ходи́ли"]
  - id: e2
    type: choice
    task: 选择正确的动词。
    why: 说去了一趟、已经回来，用 [ходи́л]{.ru}、[е́здил]{.ru}（第 1、3、5 题）；说当时正在路上、给别的事情做背景，用 [шёл]{.ru}、[е́хал]{.ru}（第 2、4 题）。第 6 题有 [ка́ждый день]{.ru}，是过去经常去，也用不定向动词。步行用 [ходи́ть / идти́]{.ru}，乘车和去别的城市用 [е́здить / е́хать]{.ru}。
    items:
      - stem: Вчера́ я ___ в музе́й.
        options: [шёл, ходи́л]
        answer: ходи́л
      - stem: Мы ___ в метро́ и ви́дели там О́льгу Ви́кторовну.
        options: [е́хали, е́здили]
        answer: е́хали
      - stem: В про́шлом году́ па́па ___ в Петербу́рг.
        options: [е́хал, е́здил]
        answer: е́здил
      - stem: Я ___ домо́й. Шёл снег, бы́ло хо́лодно.
        options: [шёл, ходи́л]
        answer: шёл
      - stem: — Где ты была́ в суббо́ту? — Я ___ в библиоте́ку.
        options: [шла, ходи́ла]
        answer: ходи́ла
      - stem: В сентябре́ А́нна ка́ждый день ___ в университе́т пешко́м.
        options: [шла, ходи́ла]
        answer: ходи́ла

  - id: e3
    type: rewrite
    task: 按例句改写，用 [ходи́ть]{.ru} 或 [е́здить]{.ru} 的过去时。
    example:
      cue: Вчера́ я был в музе́е.
      answer: Вчера́ я ходи́л в музе́й.
    why: "[был]{.ru} 加 [где]{.ru}（第六格）改成 [ходи́л / е́здил]{.ru} 加 [куда́]{.ru}（第四格）：[в музе́е → в музе́й]{.ru}，[в галере́е → в галере́ю]{.ru}，[на уро́ке → на уро́к]{.ru}。在本市步行能到的地方用 [ходи́ть]{.ru}；去别的城市、乡下的别墅用 [е́здить]{.ru}。动词的性和数跟主语一致。"
    items:
      - cue: В суббо́ту А́нна была́ в галере́е.
        accept: ["В суббо́ту А́нна ходи́ла в галере́ю."]
      - cue: В про́шлом году́ мы бы́ли в Петербу́рге.
        accept: ["В про́шлом году́ мы е́здили в Петербу́рг."]
      - cue: Сего́дня Ми́ша был в шко́ле.
        accept: ["Сего́дня Ми́ша ходи́л в шко́лу."]
      - cue: Ле́том ба́бушка была́ на да́че.
        accept: ["Ле́том ба́бушка е́здила на да́чу."]
      - cue: Вчера́ студе́нты бы́ли на уро́ке.
        accept: ["Вчера́ студе́нты ходи́ли на уро́к."]
  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、4 题是去了一趟，用不定向动词；第 2、3 题是当时正在路上，用定向动词。
    items:
      - zh: 星期天我们去了一趟博物馆。
        accept: ["В воскресе́нье мы ходи́ли в музе́й.", "Мы ходи́ли в музе́й в воскресе́нье.", "В воскресе́нье мы бы́ли в музе́е.", "Мы бы́ли в музе́е в воскресе́нье.", "В воскресе́нье мы е́здили в музе́й.", "Мы е́здили в музе́й в воскресе́нье."]
        rubric: ["用 [ходи́ли]{.ru}（或 [е́здили]{.ru}）加 [в музе́й]{.ru}，或 [бы́ли в музе́е]{.ru}", "不能用 [шли]{.ru}", "“星期天”用 [в воскресе́нье]{.ru}"]
      - zh: 我们坐地铁的时候，看见了安娜。
        accept: ["Мы е́хали в метро́ и ви́дели А́нну.", "Мы е́хали на метро́ и ви́дели А́нну.", "Мы е́хали в метро́ и уви́дели А́нну.", "Мы е́хали на метро́ и уви́дели А́нну.", "Мы е́хали в метро́ и ви́дели там А́нну.", "Мы е́хали на метро́ и ви́дели там А́нну."]
        rubric: ["“坐地铁的时候”用 [е́хали]{.ru}，不能用 [е́здили]{.ru}", "[А́нну]{.ru} 用第四格"]
      - zh: 那天早上下着雪。
        accept: ["У́тром шёл снег.", "В то у́тро шёл снег.", "Шёл снег у́тром.", "Тем у́тром шёл снег."]
        rubric: ["“下雪”用 [шёл снег]{.ru}，过去时阳性"]
      - zh: 去年妈妈去了一趟北京。
        accept: ["В про́шлом году́ ма́ма е́здила в Пеки́н.", "Ма́ма е́здила в Пеки́н в про́шлом году́.", "В про́шлом году́ ма́ма была́ в Пеки́не.", "Ма́ма была́ в Пеки́не в про́шлом году́.", "Ма́ма в про́шлом году́ е́здила в Пеки́н."]
        rubric: ["去别的城市用 [е́здила]{.ru}，阴性", "“去年”用 [в про́шлом году́]{.ru}"]

  - id: e5
    type: open
    task: 按问题回答，把答案连成一段话，讲讲王磊和安娜的星期六。
    items:
      - prompt: "[Куда́ ходи́ли Ван Лэй и А́нна в суббо́ту? Как они́ е́хали туда́? Что смотре́л Ван Лэй? Кака́я карти́на ему́ понра́вилась? Как они́ шли домо́й?]{.ru}"
        length: 50–80
        model: "В суббо́ту Ван Лэй и А́нна ходи́ли в Третьяко́вскую галере́ю. Они́ е́хали на метро́, а пото́м шли пешко́м. В галере́е Ван Лэй смотре́л ру́сские карти́ны: портре́ты, пейза́жи и ико́ны. Ему́ осо́бенно понра́вилась карти́на «У́тро в сосно́вом лесу́». Домо́й они́ шли пешко́м. Шёл снег, и Москва́ была́ бе́лая."
        rubric: ["说明去了哪儿：[ходи́ли в галере́ю]{.ru}", "说明路上的情形：[е́хали на метро́]{.ru}、[шли пешко́м]{.ru}", "提到喜欢的画，[понра́вилась]{.ru} 与 [карти́на]{.ru} 一致", "运动动词过去时形式正确"]
        notes: 范文按时间顺序写：先用 [ходи́ли]{.ru} 概括整件事，再用 [е́хали]{.ru}、[шли]{.ru} 写路上的过程，然后写在画廊里看到什么，最后写回家。概括往返用不定向动词，描写路上用定向动词，这是本课的要点。
