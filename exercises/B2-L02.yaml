lesson: B2-L02
grammar: "名词复数第二格（二）：[-а, -я, -о]{.ru} 结尾名词的零词尾；[-ия, -ие → -ий]{.ru}；隐现元音 [о, е]{.ru}；[челове́к, раз]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数第二格填空。
    why: "[-а, -я, -о]{.ru} 结尾的名词复数第二格是零词尾：[книг, слов]{.ru}；[-я]{.ru} 去掉后写 [-ь]{.ru}：[неде́ль]{.ru}；[-ия, -ие]{.ru} 变 [-ий]{.ru}：[ле́кций, заня́тий]{.ru}。第 6—8 题去掉词尾后剩两个辅音，要插入元音：[де́вушек]{.ru}（[ш]{.ru} 后插 [е]{.ru}），[оши́бок]{.ru}（硬辅音后插 [о]{.ru}），[пи́сем]{.ru}（[ь]{.ru} 的位置换成 [е]{.ru}，重音也移到词首）。"
    items:
      - stem: В семе́стре семна́дцать ___.
        hint: неде́ля
        accept: ["неде́ль"]
      - stem: Ско́лько ___ на́до прочита́ть?
        hint: кни́га
        accept: ["книг"]
      - stem: Ди́ма зна́ет де́сять ___ по-кита́йски.
        hint: сло́во
        accept: ["слов"]
      - stem: У Ди́мы мно́го пар и ___.
        hint: ле́кция
        accept: ["ле́кций"]
      - stem: Ван Лэй пропусти́л пять дней ___.
        hint: заня́тие
        accept: ["заня́тий"]
      - stem: В гру́ппе Ди́мы семна́дцать ___.
        hint: де́вушка
        accept: ["де́вушек"]
      - stem: В упражне́нии не́сколько ___.
        hint: оши́бка
        accept: ["оши́бок"]
      - stem: Ско́лько ___ ты получи́л?
        hint: письмо́
        accept: ["пи́сем"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "数词 2–4 后用单数第二格（第 2 题 [три па́ры]{.ru}、第 4 题 [две студе́нтки]{.ru}），5 以上和 [ско́лько, не́сколько]{.ru} 后用复数第二格。第 1、3、5、6 题的复数第二格都是零词尾，和单数第二格（[неде́ли, сло́ва, ле́кции, оши́бки]{.ru}）不同，不要混。"
    items:
      - stem: В семе́стре семна́дцать ___.
        options: ["неде́ли", "неде́ль"]
        answer: "неде́ль"
      - stem: Ка́ждый день у нас три ___.
        options: ["па́ры", "пар"]
        answer: "па́ры"
      - stem: Ди́ма зна́ет де́сять ___ по-кита́йски.
        options: ["сло́ва", "слов"]
        answer: "слов"
      - stem: В на́шей гру́ппе две ___ из Коре́и.
        options: ["студе́нтки", "студе́нток"]
        answer: "студе́нтки"
      - stem: Ско́лько у тебя́ сего́дня ___?
        options: ["ле́кции", "ле́кций"]
        answer: "ле́кций"
      - stem: В упражне́нии не́сколько ___.
        options: ["оши́бки", "оши́бок"]
        answer: "оши́бок"

  - id: e3
    type: rewrite
    task: 按例句把肯定句改成否定句。
    example:
      cue: У меня́ есть кни́ги.
      answer: У меня́ нет книг.
    why: "[нет]{.ru} 后面用第二格，原来的复数第一格要换成复数第二格，[есть]{.ru} 去掉。第 1 题 [сёстры → сестёр]{.ru}，插入的元音是 [ё]{.ru}，重音在词尾；第 4 题 [пи́сьма → пи́сем]{.ru}；第 5 题 [ча́шки → ча́шек]{.ru}，[ш]{.ru} 后插 [е]{.ru}。"
    items:
      - cue: У него́ есть сёстры.
        accept: ["У него́ нет сестёр."]
      - cue: В э́том упражне́нии есть оши́бки.
        accept: ["В э́том упражне́нии нет оши́бок."]
      - cue: Сего́дня есть заня́тия.
        accept: ["Сего́дня нет заня́тий."]
      - cue: На столе́ есть пи́сьма.
        accept: ["На столе́ нет пи́сем."]
      - cue: На ку́хне есть ча́шки.
        accept: ["На ку́хне нет ча́шек."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题 [неде́ль]{.ru}、第 4 题 [де́вушек]{.ru}、第 5 题 [книг]{.ru} 都是零词尾。第 2 题 [дней]{.ru} 是 [день]{.ru} 的复数第二格，[е]{.ru} 脱落。第 3 题“每星期两次”说 [два ра́за в неде́лю]{.ru}，[в]{.ru} 加第四格。"
    items:
      - zh: 一个学期有十七周。
        accept: ["В семе́стре семна́дцать неде́ль.", "Семе́стр — семна́дцать неде́ль."]
        rubric: ["[семна́дцать неде́ль]{.ru}：复数第二格零词尾，写 [-ь]{.ru}"]
      - zh: 王磊缺了五天的课。
        accept: ["Ван Лэй пропусти́л пять дней заня́тий.", "Ван Лэй пропусти́л пять дней."]
        rubric: ["[пропусти́л]{.ru}：完成体过去时", "[пять дней]{.ru}；[заня́тий]{.ru}：[-ие → -ий]{.ru}"]
      - zh: 我们每星期见两次面。
        accept: ["Мы встреча́емся два ра́за в неде́лю.", "Два ра́за в неде́лю мы встреча́емся."]
        rubric: ["[встреча́ться]{.ru} 现在时 [встреча́емся]{.ru}", "[два ра́за в неде́лю]{.ru}"]
      - zh: 他们班有十七个女生。
        accept: ["В их гру́ппе семна́дцать де́вушек.", "У них в гру́ппе семна́дцать де́вушек.", "В их гру́ппе семна́дцать студе́нток.", "У них в гру́ппе семна́дцать студе́нток."]
        rubric: ["[семна́дцать де́вушек]{.ru} 或 [студе́нток]{.ru}：零词尾加隐现元音"]
      - zh: 要读多少本书？
        accept: ["Ско́лько книг на́до прочита́ть?", "Ско́лько книг ну́жно прочита́ть?"]
        rubric: ["[ско́лько книг]{.ru}：零词尾", "[на́до / ну́жно]{.ru} + 不定式"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ Ван Лэй пропусти́л пять дней заня́тий? Ско́лько неде́ль в семе́стре и что бу́дет в ию́не? Ско́лько книг на́до прочита́ть? Кто тако́й Ди́ма? Как они́ бу́дут занима́ться?]{.ru}"
        length: 50–80
        model: "Ван Лэй пропусти́л пять дней заня́тий, потому́ что он был в Пеки́не. О́льга Ви́кторовна дала́ ему́ но́вое расписа́ние. В семе́стре семна́дцать неде́ль, ка́ждый день у него́ три па́ры. В ию́не бу́дет се́ссия: три экза́мена и четы́ре зачёта. На́до прочита́ть пять книг и не́сколько расска́зов. Ди́ма — языково́й партнёр Ван Лэ́я. Он зна́ет то́лько де́сять слов по-кита́йски. Они́ бу́дут встреча́ться два ра́за в неде́лю: во вто́рник занима́ться ру́сским, а в четве́рг — кита́йским."
        rubric: ["回答全部五个问题", "复数第二格零词尾用对：[дней заня́тий, неде́ль, книг, слов]{.ru}", "2–4 后用单数第二格：[три па́ры, три экза́мена, четы́ре зачёта]{.ru}", "[два ра́за в неде́лю]{.ru}"]
        notes: "范文约 75 词。第一个问题用 [потому́ что]{.ru} 回答原因。课文里的对话都改成了叙述，数字照课文写全。最后一句用 [занима́ться]{.ru} + 第五格（[ру́сским, кита́йским]{.ru}）代替课文里的 [помога́ть с…]{.ru}，换一种说法，意思不变。"
