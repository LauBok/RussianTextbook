lesson: B2-L63
heading: 单元测试
intro: 答对 80% 以上再进入第八单元。本测试覆盖第七单元全部语法；没有达到 80% 的，按出错的题回到相应的课复习后重做：数词变格看第 55 课，序数词和日期看第 56 课，时间状语看第 57 课，[оди́н из, ка́ждый, любо́й, друго́й]{.ru} 看第 58 课，不定代词看第 59 课，否定代词看第 60 课，无人称动词看第 61 课，被动结构看第 62 课。
grammar: "数词的变格；序数词的变格，日期与年份；时间状语 [за, на, че́рез, в тече́ние]{.ru}；[оди́н из]{.ru}，[ка́ждый, любо́й, друго́й]{.ru}；不定代词 [-то, -нибудь, ко́е-]{.ru}；否定代词 [не́кого, не́чего]{.ru} + 不定式；无人称动词 [ка́жется, хо́чется, темне́ет]{.ru}；被动结构 [стро́ится, постро́ен]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的数词变成需要的形式。
    why: "[ме́ньше]{.ru} 后面用第二格：[шести́]{.ru}（第 1 题）。第 2 题 [на]{.ru} 表示处所，要第六格 [двух]{.ru}，后面的形容词、名词也用复数第六格。第 3 题 [с]{.ru} + 第五格：[четырьмя́]{.ru}（[ь]{.ru} 不能漏）。第 4 题 [со́рок]{.ru} 的间接格只有一个形式 [сорока́]{.ru}，不能按 [пять]{.ru} 的样子去变。第 5 题 [студе́нтов]{.ru} 是动物名词，[два]{.ru} 作第四格时同第二格：[двух]{.ru}。序数词像形容词一样变格：“在几号”用第二格 [пятна́дцатого]{.ru}（第 6 题）；年份 [в… году́]{.ru} 用第六格，合成序数词只变最后一个词：[ты́сяча семьсо́т тре́тьем]{.ru}，前面的 [ты́сяча семьсо́т]{.ru} 不变（第 7 题）；第 8 题 [на]{.ru} + 第六格：[деся́том этаже́]{.ru}。"
    items:
      - stem: Самолёт лети́т до Ирку́тска ме́ньше ___ часо́в.
        hint: шесть
        accept: ["шести́"]
      - stem: Ива́н Серге́евич и Мари́я Никола́евна пое́дут на ___ ни́жних по́лках.
        hint: два
        accept: ["двух"]
      - stem: В воскресе́нье А́нна пое́хала в парк с ___ друзья́ми.
        hint: четы́ре
        accept: ["четырьмя́"]
      - stem: В Байка́ле ви́дно дно на глубине́ ___ ме́тров.
        hint: со́рок
        accept: ["сорока́"]
      - stem: В коридо́ре я ви́жу ___ студе́нтов.
        hint: два
        accept: ["двух"]
      - stem: Пе́рвый экза́мен у Ван Лэ́я бу́дет ___ ию́ня.
        hint: пятна́дцатый
        accept: ["пятна́дцатого"]
      - stem: Петербу́рг основа́ли в ___ году́.
        hint: ты́сяча семьсо́т тре́тий
        accept: ["ты́сяча семьсо́т тре́тьем"]
      - stem: Ди́ма живёт на ___ этаже́.
        hint: деся́тый
        accept: ["деся́том"]

  - id: e2
    type: choice
    task: 选择正确的时间状语形式。
    why: "第 1 题说用多长时间做完，完成体 [сде́лал]{.ru} 配 [за]{.ru}。第 2、5 题说结果保持多久（书借走一个星期，在奶奶家待两天），用 [на]{.ru}。第 3、7 题说多久以后，用 [че́рез]{.ru}。第 4 题“在整个晚上之内”用 [в тече́ние]{.ru} + 第二格 [ве́чера]{.ru}；[за ве́чера]{.ru}、[на ве́чера]{.ru} 连格都不对。第 6 题说动作本身进行了多久，用不带前置词的第四格；未完成体 [занима́лись]{.ru} 不能和 [за]{.ru} 连用，这是最常见的错误。"
    items:
      - stem: Ван Лэй сде́лал два́дцать упражне́ний ___ четы́ре часа́.
        options: [за, на, че́рез]
        answer: за
      - stem: Ван Лэй взял в библиоте́ке сбо́рник упражне́ний ___ неде́лю.
        options: [за, на, че́рез]
        answer: на
      - stem: ___ четы́ре дня у меня́ второ́й экза́мен.
        options: [За, На, Че́рез]
        answer: Че́рез
      - stem: ___ ве́чера Ди́ма звони́л ему́ три ра́за.
        options: [В тече́ние, За, На]
        answer: В тече́ние
      - stem: В суббо́ту роди́тели и Ми́ша е́дут к ба́бушке ___ два дня.
        options: [за, на, в тече́ние]
        answer: на
      - stem: Друзья́ занима́лись ___ три часа́, а пото́м у́жинали.
        options: [за, че́рез, 不用前置词]
        answer: 不用前置词
      - stem: Результа́ты бу́дут ___ два дня по́сле экза́мена.
        options: [за, на, че́рез]
        answer: че́рез


  - id: e3
    type: choice
    task: 选择正确的代词。
    why: "[оди́н из]{.ru} 后面用复数第二格：[предме́тов]{.ru}（第 1 题）。第 2 题 [в]{.ru} 表示处所，[оди́н]{.ru} 本身要变成第六格，和 [ко́рпус]{.ru} 同性：[в одно́м]{.ru}。第 3 题“随便问哪一年都行”用 [любо́й]{.ru}；[ка́ждом]{.ru} 意思成了“每一年都问一遍”。第 4 题 [одни́… други́е…]{.ru} 是固定搭配。书确实在桌上，只是不知道是什么书，用 [-то]{.ru}（第 5 题）；问“有没有人来过”，有没有还不一定，用 [-нибудь]{.ru}（第 6 题）。第 7 题说将来的“总有一天”，用 [когда́-нибудь]{.ru}；[когда́-то]{.ru} 指过去的“从前”。第 8 题“我知道，但不说”用 [ко́е-что]{.ru}；肯定的陈述句里不能用 [-нибудь]{.ru}。"
    items:
      - stem: Исто́рия — оди́н из люби́мых ___ Ди́мы.
        options: [предме́т, предме́тов, предме́тами]
        answer: предме́тов
      - stem: Ди́ма живёт в ___ из корпусо́в общежи́тия.
        options: [оди́н, одно́м, одного́]
        answer: одно́м
      - stem: Спроси́ меня́ о ___ го́де — я все да́ты по́мню!
        options: [любо́м, ка́ждом, друго́м]
        answer: любо́м
      - stem: "В се́ссию все занима́ются: одни́ в ко́мнатах, ___ на ку́хне."
        options: [други́е, любы́е, ка́ждые]
        answer: други́е
      - stem: На столе́ лежа́ла ___ кни́га.
        options: [кака́я-то, кака́я-нибудь]
        answer: кака́я-то
      - stem: Ми́ша, ___ приходи́л сего́дня?
        options: [кто́-то, кто́-нибудь]
        answer: кто́-нибудь
      - stem: ___ я бу́ду говори́ть по-кита́йски так же хорошо́, как ты по-ру́сски!
        options: [Когда́-то, Когда́-нибудь]
        answer: Когда́-нибудь
      - stem: Мо́жет быть, ___ и зна́ю, но я обеща́ла никому́ не говори́ть.
        options: [ко́е-что, что́-нибудь]
        answer: ко́е-что

  - id: e4
    type: rewrite
    task: 按例句作否定回答。
    example:
      cue: — Кого́ ты спро́сишь?
      answer: — Мне не́кого спроси́ть.
    why: "回答用无人称句：说话人用第三格 [мне]{.ru}，否定代词或副词加不定式，句中不再加 [не]{.ru}。问句里的代词是什么格，[не́-]{.ru} 后面也用什么格：[что → не́чего]{.ru}；有前置词时，前置词放在中间：[с кем → не́ с кем]{.ru}，[о чём → не́ о чем]{.ru}。[где → не́где]{.ru}，[куда́ → не́куда]{.ru}，[когда́ → не́когда]{.ru}。将来时的动词在回答里变成不定式；“去”用完成体 [пойти́]{.ru}。"
    items:
      - cue: — Что ты бу́дешь чита́ть?
        accept: ["— Мне не́чего чита́ть."]
      - cue: — С кем ты посове́туешься?
        accept: ["— Мне не́ с кем посове́товаться."]
      - cue: — Где ты бу́дешь занима́ться?
        accept: ["— Мне не́где занима́ться."]
      - cue: — Куда́ ты пойдёшь в суббо́ту?
        accept: ["— Мне не́куда пойти́.", "— В суббо́ту мне не́куда пойти́.", "— Мне не́куда пойти́ в суббо́ту.", "— Мне не́куда идти́."]
      - cue: — Когда́ ты бу́дешь отдыха́ть?
        accept: ["— Мне не́когда отдыха́ть."]
      - cue: — О чём ты бу́дешь писа́ть?
        accept: ["— Мне не́ о чем писа́ть."]


  - id: e5
    type: choice
    task: 选择正确的形式。
    why: "无人称句里感受的人用第三格：[Мне ка́жется]{.ru}（第 1 题），[Ван Лэ́ю хоте́лось]{.ru}（第 2 题）。无人称动词只有第三人称单数和中性过去时：[темне́ет]{.ru}（第 3 题），[запа́хло]{.ru}（第 4 题）；第 4 题的 [мя́сом]{.ru} 是第五格，不是主语。被动结构：正在进行、还没完成的事用未完成体 + [-ся]{.ru}（第 5 题 [сейча́с]{.ru}）；已经完成、结果还在的事用完成体被动形动词短尾（第 6 题 [давно́]{.ru}，[зда́ние]{.ru} 中性，用 [постро́ено]{.ru}）；第 7 题说到某个时候以前完成，用 [до́лжен быть постро́ен]{.ru}，[к пе́рвому сентября́]{.ru} 不能和表示过程的 [стро́иться]{.ru} 连用。"
    items:
      - stem: ___ ка́жется, во Фра́нции мя́со гото́вят лу́чше.
        options: [Мне, Я, Меня́]
        answer: Мне
      - stem: Ван Лэ́ю о́чень ___ спать.
        options: [хоте́лось, хоте́лся, хоте́л]
        answer: хоте́лось
      - stem: В ию́не в Москве́ ___ то́лько по́сле десяти́.
        options: [темне́ет, темне́ют, темне́ла]
        answer: темне́ет
      - stem: Над па́рком пошёл дым, и ___ мя́сом.
        options: [запа́хло, запа́хла, запа́х]
        answer: запа́хло
      - stem: Сейча́с ря́дом с па́рком ___ спорти́вный центр.
        options: [стро́ится, постро́ен]
        answer: стро́ится
      - stem: Гла́вное зда́ние университе́та давно́ ___.
        options: [стро́ится, постро́ено]
        answer: постро́ено
      - stem: Центр до́лжен быть ___ к пе́рвому сентября́.
        options: [стро́иться, постро́ен]
        answer: постро́ен

  - id: e6
    type: rewrite
    task: 按例句把句子改成被动句。
    example:
      cue: В ты́сяча девятьсо́т пятьдеся́т тре́тьем году́ постро́или Гла́вное зда́ние.
      answer: Гла́вное зда́ние бы́ло постро́ено в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́.
    why: "原句的第四格补语变成被动句的主语（第一格），短尾跟新主语的性、数一致：[рабо́та → сде́лана]{.ru}（阴性），[окно́ → откры́то]{.ru}（中性），[центр → постро́ен]{.ru}（阳性）。时间由 [быть]{.ru} 表示：过去用 [был, была́, бы́ло]{.ru}，将来用 [бу́дет]{.ru}（第 3 题原句是将来时 [постро́ят]{.ru}）。做事的人用第五格：[Че́хов → Че́ховым]{.ru}（第 4 题）。"
    items:
      - cue: Ван Лэй сде́лал всю рабо́ту.
        accept: ["Вся рабо́та была́ сде́лана.", "Вся рабо́та была́ сде́лана Ван Лэ́ем.", "Вся рабо́та сде́лана.", "Вся рабо́та сде́лана Ван Лэ́ем."]
      - cue: Мари́я Никола́евна откры́ла окно́.
        accept: ["Окно́ бы́ло откры́то.", "Окно́ бы́ло откры́то Мари́ей Никола́евной.", "Окно́ откры́то.", "Окно́ откры́то Мари́ей Никола́евной."]
      - cue: Спорти́вный центр постро́ят к сентябрю́.
        accept: ["Спорти́вный центр бу́дет постро́ен к сентябрю́."]
      - cue: Че́хов написа́л э́тот расска́з.
        accept: ["Э́тот расска́з напи́сан Че́ховым.", "Э́тот расска́з был напи́сан Че́ховым."]


  - id: e7
    type: translate
    task: 译成俄语。
    why: "第 1 题“两个小时就做完”是用多长时间完成，完成体 + [за]{.ru}。第 2 题“……之一”用 [оди́н из]{.ru} + 复数第二格，[оди́н]{.ru} 和 [парк]{.ru} 同性。第 3 题“有人”确有其人，用 [кто́-то]{.ru}；“给你”第三格 [тебе́]{.ru}。第 4 题“没有时间”用 [не́когда]{.ru} + 不定式，人用第三格；“三天后”用 [че́рез]{.ru}。第 5 题“正在建”用 [стро́ится]{.ru} 或不定人称句 [стро́ят]{.ru}。第 6 题“我觉得”是无人称的 [мне ка́жется]{.ru}，从句说将来的事用完成体将来时 [придёт]{.ru}。"
    items:
      - zh: 我两个小时就做完了所有的练习。
        accept: ["Я сде́лал все упражне́ния за два часа́.", "Я сде́лала все упражне́ния за два часа́.", "За два часа́ я сде́лал все упражне́ния.", "За два часа́ я сде́лала все упражне́ния."]
        rubric: ["完成体 [сде́лал(а)]{.ru}", "[за два часа́]{.ru}：用多长时间完成"]
      - zh: 这是莫斯科最古老的公园之一。
        accept: ["Э́то оди́н из са́мых ста́рых па́рков Москвы́.", "Э́то оди́н из са́мых ста́рых па́рков в Москве́.", "Э́то оди́н из старе́йших па́рков Москвы́.", "Э́то оди́н из старе́йших па́рков в Москве́."]
        rubric: ["[оди́н из]{.ru} + 复数第二格 [па́рков]{.ru}", "最高级 [са́мых ста́рых]{.ru} 也用复数第二格"]
      - zh: 有人给你打过电话。
        accept: ["Тебе́ кто́-то звони́л.", "Кто́-то звони́л тебе́.", "Тебе́ звони́л кто́-то."]
        rubric: ["[кто́-то]{.ru}：确有其人，但不知道是谁", "[звони́ть]{.ru} + 第三格 [тебе́]{.ru}"]
      - zh: 我没有时间休息：三天后就考试了。
        accept: ["Мне не́когда отдыха́ть: че́рез три дня экза́мен.", "Мне не́когда отдыха́ть: че́рез три дня у меня́ экза́мен.", "Мне не́когда отдыха́ть, потому́ что че́рез три дня экза́мен.", "Мне не́когда отдыха́ть, потому́ что че́рез три дня у меня́ экза́мен.", "Мне не́когда отдыха́ть: у меня́ че́рез три дня экза́мен."]
        rubric: ["[мне не́когда]{.ru} + 不定式，不说 *[я не́когда]{.ru}*", "[че́рез три дня]{.ru}"]
      - zh: 我们城市里正在建一座新桥。
        accept: ["В на́шем го́роде стро́ится но́вый мост.", "В на́шем го́роде стро́ят но́вый мост.", "В на́шем го́роде сейча́с стро́ится но́вый мост.", "В на́шем го́роде сейча́с стро́ят но́вый мост."]
        rubric: ["[стро́ится]{.ru}（或不定人称句 [стро́ят]{.ru}）表示正在进行", "用 [стро́ят]{.ru} 时 [мост]{.ru} 是第四格，形式同第一格"]
      - zh: 我觉得他明天会来。
        accept: ["Мне ка́жется, что он придёт за́втра.", "Мне ка́жется, что за́втра он придёт.", "Мне ка́жется, он придёт за́втра.", "Мне ка́жется, за́втра он придёт."]
        rubric: ["无人称的 [мне ка́жется]{.ru}", "将来时 [придёт]{.ru}"]


  - id: e8
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пое́дут Ива́н Серге́евич и Мари́я Никола́евна в а́вгусте? Ско́лько зачётов и экза́менов бы́ло у Ван Лэ́я? Где и как он гото́вился к экза́мену по исто́рии? Како́й пода́рок он получи́л? Как друзья́ отдыха́ли в воскресе́нье? Что Ван Лэй узна́л о Гла́вном зда́нии и что стро́ится ря́дом с па́рком?]{.ru}"
        length: 60–90
        model: "Второ́го а́вгуста Ива́н Серге́евич и Мари́я Никола́евна пое́дут на по́езде на Байка́л. А у Ван Лэ́я в ию́не была́ се́ссия. За одну́ неде́лю он сдал четы́ре зачёта, а пото́м три экза́мена. К экза́мену по исто́рии он гото́вился в общежи́тии у Ди́мы: за три часа́ они́ повтори́ли два́дцать биле́тов. Ван Лэй получи́л «пять», а до́ма нашёл пода́рок Ди́мы — ста́рый слова́рь. В воскресе́нье друзья́ пое́хали на шашлыки́, и никому́ не хоте́лось е́хать домо́й. Гла́вное зда́ние университе́та бы́ло постро́ено в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́, а ря́дом с па́рком сейча́с стро́ится спорти́вный центр."
        rubric: ["回答全部六个问题", "数词、日期形式正确：[второ́го а́вгуста]{.ru}、[четы́ре зачёта]{.ru}、[три экза́мена]{.ru}", "至少两个本单元语法点：时间状语 [за]{.ru}、无人称句、被动结构等"]
        notes: 范文约 85 词，按时间顺序把一个月的事压成一段。本单元的语法用了五处：[за одну́ неде́лю]{.ru}、[за три часа́]{.ru}（用多长时间完成），[никому́ не хоте́лось]{.ru}（无人称句），[бы́ло постро́ено]{.ru} 和 [стро́ится]{.ru}（已经建成和正在建）。


  - id: e9
    type: open
    task: 作文。题目：[Экза́мен, кото́рый я по́мню]{.ru}（一次难忘的考试）。
    items:
      - prompt: 写一次你记得很清楚的考试：什么时候、考什么、考前怎样准备、考试时发生了什么、结果怎样、你有什么感受。至少用一个日期、两个时间状语（[за, на, че́рез, в тече́ние]{.ru} 或不带前置词的第四格）和一个无人称句。
        length: 100–150
        model: "Я хорошо́ по́мню свой пе́рвый экза́мен в университе́те. Э́то бы́ло два́дцать пя́того января́, экза́мен по исто́рии.\n\nВ тече́ние семе́стра я занима́лся ма́ло, поэ́тому пе́ред экза́меном мне бы́ло не́когда отдыха́ть. Я взял в библиоте́ке уче́бник на неде́лю и чита́л его́ ка́ждый день до двух часо́в но́чи. За пять дней я повтори́л все биле́ты.\n\nВ день экза́мена мне каза́лось, что я всё забы́л. Я вы́тянул биле́т — и уви́дел вопро́с, кото́рый я хорошо́ знал! На подгото́вку у меня́ бы́ло со́рок мину́т, но я на́чал отвеча́ть уже́ че́рез два́дцать.\n\nЯ получи́л «пять». Домо́й я шёл пешко́м, и мне хоте́лось петь. Тепе́рь я зна́ю: занима́ться на́до в тече́ние всего́ семе́стра, а не то́лько одну́ неде́лю пе́ред экза́меном."
        rubric: ["讲清时间、科目、准备、经过、结果和感受", "日期形式正确（[два́дцать пя́того января́]{.ru}）", "至少两个时间状语，用法正确（[за]{.ru} 配完成体，[на]{.ru} 表示结果保持多久）", "至少一个无人称句（[мне каза́лось]{.ru}、[мне хоте́лось]{.ru}、[мне не́когда]{.ru} 等）"]
        notes: 范文四段：时间和科目、考前准备、考试经过、结果和体会。时间状语用了五处：[в тече́ние семе́стра]{.ru}、[на неде́лю]{.ru}、[за пять дней]{.ru}、[че́рез два́дцать]{.ru}，还有不带前置词的 [одну́ неде́лю]{.ru}（说进行多久，所以不用 [за]{.ru}）；无人称句三个：[мне бы́ло не́когда отдыха́ть]{.ru}、[мне каза́лось]{.ru}、[мне хоте́лось петь]{.ru}。结尾一句把开头的“学得少”和结论对照起来，文章就收住了。


  - id: e10
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。6 月 26 日给北京的爸爸妈妈写信：考试周怎样过去的（四门考查、三门考试、历史得了五分），迪马送了什么礼物，伊万·谢尔盖耶维奇一家八月去哪里，再告诉父母你 7 月 15 日回北京。
        length: 80–120
        model: "Москва́, 26 ию́ня\n\nДороги́е ма́ма и па́па!\n\nУ меня́ хоро́шая но́вость: се́ссия ко́нчилась! За одну́ неде́лю я сдал все четы́ре зачёта, а пото́м три экза́мена. По исто́рии я получи́л «пять». К э́тому экза́мену я гото́вился в общежи́тии у Ди́мы, и он мне о́чень помо́г.\n\nА пото́м Ди́ма сде́лал мне пода́рок: ста́рый ру́сско-кита́йский слова́рь ты́сяча девятьсо́т пятьдеся́т восьмо́го го́да. Он купи́л его́ у букини́ста на Арба́те.\n\nВторо́го а́вгуста Ива́н Серге́евич и Мари́я Никола́евна пое́дут на по́езде на Байка́л, а А́нна и Ми́ша прилетя́т к ним на самолёте. Мне немно́го гру́стно, что я не пое́ду с ни́ми.\n\nПятна́дцатого ию́ля я улета́ю в Пеки́н. Жду встре́чи!\n\nВаш сын Ван Лэй"
        rubric: ["书信格式：地点日期、称呼 [Дороги́е ма́ма и па́па!]{.ru}、落款", "讲到考查、考试和历史成绩", "讲到迪马的礼物和贝加尔湖", "日期形式正确：[второ́го а́вгуста]{.ru}、[пятна́дцатого ию́ля]{.ru}"]
        notes: 范文按“好消息—考试—礼物—彼得罗夫家的计划—回国日期”的顺序写，每段一件事。日期都用第二格（[второ́го а́вгуста]{.ru}、[пятна́дцатого ию́ля]{.ru}），年份用第二格接在名词后面（[слова́рь ты́сяча девятьсо́т пятьдеся́т восьмо́го го́да]{.ru}）。[Мне немно́го гру́стно]{.ru} 是无人称句。结尾 [Жду встре́чи!]{.ru}（盼望见面）是家信里常用的说法。
