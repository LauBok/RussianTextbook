lesson: L91
grammar: "[поздравля́ть]{.ru} / [поздра́вить кого́ с чем]{.ru}：祝贺的对象用第四格，事由用 [с]{.ru} + 第五格；[жела́ть кому́ чего́]{.ru}：祝愿的对象用第三格，内容用第二格。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成需要的形式。
    why: "[поздравля́ть]{.ru} 的事由一律用 [с]{.ru} + 第五格。阳性、中性形容词第五格是 [-ым / -им]{.ru}，阴性是 [-ой / -ей]{.ru}。第 2 题 [день]{.ru} 的 [е]{.ru} 脱落，写成 [днём]{.ru}，[рожде́ния]{.ru} 本来就是第二格，不再变。第 4 题 [сча́стье]{.ru} 是中性名词，第五格 [-ем]{.ru}，重音不在词尾，所以不写 [-ём]{.ru}。"
    items:
      - stem: Поздравля́ю вас с ___!
        hint: Но́вый год
        accept: [Но́вым го́дом]
      - stem: Ми́ша, поздравля́ю тебя́ с ___!
        hint: день рожде́ния
        accept: [днём рожде́ния]
      - stem: О́льга Ви́кторовна, поздравля́ем Вас с ___!
        hint: пра́здник
        accept: [пра́здником]
      - stem: С Но́вым го́дом! С но́вым ___!
        hint: сча́стье
        accept: [сча́стьем]
      - stem: Мари́я Никола́евна поздра́вила Ван Лэ́я с ___.
        hint: пе́рвый Но́вый год в Москве́
        accept: [пе́рвым Но́вым го́дом в Москве́]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "关键是分清两个动词的格。[поздравля́ть]{.ru} 的对象用第四格（[тебя́, ма́му, вас]{.ru}），[жела́ть]{.ru} 的对象用第三格（[тебе́, ма́ме, вам]{.ru}），祝愿的内容用第二格（[сча́стья, здоро́вья]{.ru}）。第 5 题“已经祝贺过”是一次完成的结果，用完成体过去时 [поздра́вил]{.ru}。"
    items:
      - stem: Я поздравля́ю ___ с Но́вым го́дом.
        options: [тебя́, тебе́]
        answer: тебя́
      - stem: Я жела́ю ___ сча́стья.
        options: [тебя́, тебе́]
        answer: тебе́
      - stem: Ван Лэй поздравля́ет ___ с пра́здником.
        options: [ма́му, ма́ме]
        answer: ма́му
      - stem: Жела́ем вам ___!
        options: [здоро́вье, здоро́вья]
        answer: здоро́вья
      - stem: — Ты уже́ ___ па́пу? — Да, я звони́л ему́ ве́чером.
        options: [поздравля́л, поздра́вил]
        answer: поздра́вил

  - id: e3
    type: rewrite
    task: 按例句写一句祝贺的话。
    placeholder: …, поздравля́ю … с …!
    example:
      cue: Ми́ша / день рожде́ния
      answer: Ми́ша, поздравля́ю тебя́ с днём рожде́ния!
    why: "对熟人、孩子用 [тебя́]{.ru}，对长辈、老师用 [вас]{.ru}，书面上对一个人写成 [Вас]{.ru}（判定时不区分大小写）。称呼名字加父称的人要用 [вас]{.ru}，这是最容易忽略的地方。"
    items:
      - cue: А́нна / Но́вый год
        accept: ["А́нна, поздравля́ю тебя́ с Но́вым го́дом!"]
      - cue: О́льга Ви́кторовна / пра́здник
        accept: ["О́льга Ви́кторовна, поздравля́ю вас с пра́здником!"]
      - cue: Ива́н Серге́евич / день рожде́ния
        accept: ["Ива́н Серге́евич, поздравля́ю вас с днём рожде́ния!"]
      - cue: ма́ма / Но́вый год
        accept: ["Ма́ма, поздравля́ю тебя́ с Но́вым го́дом!"]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 新年快乐！祝你们幸福健康！
        accept: ["С Но́вым го́дом! Жела́ю вам сча́стья и здоро́вья!", "Поздравля́ю вас с Но́вым го́дом! Жела́ю вам сча́стья и здоро́вья!", "С Но́вым го́дом! Жела́ем вам сча́стья и здоро́вья!", "Поздравля́ем вас с Но́вым го́дом! Жела́ем вам сча́стья и здоро́вья!"]
        rubric: ["新年快乐用 [с Но́вым го́дом]{.ru}，可以省去 [поздравля́ю]{.ru}", "[жела́ть]{.ru} 后用第三格 [вам]{.ru} 和第二格 [сча́стья и здоро́вья]{.ru}"]
      - zh: 晚上七点王磊给家里打电话，祝爸爸妈妈新年快乐。
        accept: ["В семь часо́в ве́чера Ван Лэй звони́т домо́й и поздравля́ет ма́му и па́пу с Но́вым го́дом.", "В семь часо́в ве́чера Ван Лэй звони́т домо́й и поздравля́ет па́пу и ма́му с Но́вым го́дом.", "В семь часо́в ве́чера Ван Лэй звони́т домо́й и поздравля́ет роди́телей с Но́вым го́дом.", "В семь часо́в ве́чера Ван Лэй позвони́л домо́й и поздра́вил ма́му и па́пу с Но́вым го́дом.", "В семь часо́в ве́чера Ван Лэй позвони́л домо́й и поздра́вил па́пу и ма́му с Но́вым го́дом.", "В семь часо́в ве́чера Ван Лэй позвони́л домо́й и поздра́вил роди́телей с Но́вым го́дом.", "Ван Лэй в семь часо́в ве́чера звони́т домо́й и поздравля́ет ма́му и па́пу с Но́вым го́дом.", "Ван Лэй в семь часо́в ве́чера звони́т домо́й и поздравля́ет па́пу и ма́му с Но́вым го́дом.", "Ван Лэй в семь часо́в ве́чера звони́т домо́й и поздравля́ет роди́телей с Но́вым го́дом.", "Ван Лэй в семь часо́в ве́чера позвони́л домо́й и поздра́вил ма́му и па́пу с Но́вым го́дом.", "Ван Лэй в семь часо́в ве́чера позвони́л домо́й и поздра́вил па́пу и ма́му с Но́вым го́дом.", "Ван Лэй в семь часо́в ве́чера позвони́л домо́й и поздра́вил роди́телей с Но́вым го́дом."]
        rubric: ["“祝……新年快乐”用 [поздравля́ть]{.ru} / [поздра́вить]{.ru} + 第四格 + [с Но́вым го́дом]{.ru}", "可以用现在时，也可以用过去时，前后两个动词的时、体要一致"]
      - zh: 我昨天问爸爸，有没有严寒老人。
        accept: ["Вчера́ я спроси́л па́пу, есть ли Дед Моро́з.", "Я вчера́ спроси́л па́пу, есть ли Дед Моро́з.", "Вчера́ я спроси́ла па́пу, есть ли Дед Моро́з.", "Я вчера́ спроси́ла па́пу, есть ли Дед Моро́з.", "Я спроси́л вчера́ па́пу, есть ли Дед Моро́з.", "Я спроси́ла вчера́ па́пу, есть ли Дед Моро́з.", "Вчера́ я спроси́л у па́пы, есть ли Дед Моро́з.", "Я вчера́ спроси́л у па́пы, есть ли Дед Моро́з.", "Вчера́ я спроси́ла у па́пы, есть ли Дед Моро́з.", "Я вчера́ спроси́ла у па́пы, есть ли Дед Моро́з."]
        rubric: ["间接疑问句用 [ли]{.ru}，[ли]{.ru} 紧跟在疑问焦点 [есть]{.ru} 后面", "[спроси́ть]{.ru} 的对象用第四格 [па́пу]{.ru}"]
      - zh: 十二点整，克里姆林宫的大钟敲响了。
        accept: ["Ро́вно в двена́дцать бьют кремлёвские кура́нты.", "Ро́вно в по́лночь бьют кремлёвские кура́нты.", "Ро́вно в двена́дцать часо́в бьют кремлёвские кура́нты.", "Ро́вно в двена́дцать кремлёвские кура́нты бьют.", "Кремлёвские кура́нты бьют ро́вно в двена́дцать.", "Кремлёвские кура́нты бьют ро́вно в двена́дцать часо́в.", "Кремлёвские кура́нты бьют ро́вно в по́лночь.", "Ро́вно в двена́дцать би́ли кремлёвские кура́нты.", "Ро́вно в по́лночь би́ли кремлёвские кура́нты.", "Кремлёвские кура́нты би́ли ро́вно в двена́дцать."]
        rubric: ["“整”用 [ро́вно]{.ru}", "钟敲响用 [бить]{.ru}，复数第三人称 [бьют]{.ru}"]

  - id: e5
    type: open
    task: 写一条新年短信。
    items:
      - prompt: 给奥尔加·维克托罗夫娜写一条新年短信：祝她新年快乐，祝愿她幸福健康，说说你在莫斯科怎么过新年。
        length: 30–50
        model: |
          Дорога́я О́льга Ви́кторовна! Поздравля́ю Вас с Но́вым го́дом! Жела́ю Вам сча́стья и здоро́вья! Я встреча́ю Но́вый год в Москве́. У нас краси́вая ёлка, а в двена́дцать часо́в мы бу́дем слу́шать кремлёвские кура́нты. Спаси́бо Вам за интере́сные уро́ки! Ваш Ван Лэй.
        rubric: ["用 [поздравля́ть]{.ru} + 第四格 + [с Но́вым го́дом]{.ru}", "用 [жела́ть]{.ru} + 第三格 + 第二格", "对老师用 [Вы]{.ru}，书面上各形式大写", 至少写一两句自己怎样过新年]
        notes: 范文分三层：先贺节，再祝愿，最后写一两句自己的近况并道谢。[встреча́ть Но́вый год]{.ru} 是“迎新年、过新年”的固定说法。称呼 [Дорога́я]{.ru} 和落款 [Ваш]{.ru} 第 95 课详讲。
