lesson: L96
grammar: "过去时与动词体复习：未完成体表示过程、持续、反复、只说发生过和否定；完成体表示一次完成的结果、开始进入新状态、出发（[пошёл, пое́хал]{.ru}）和依次发生的动作；[ходи́л]{.ru}（去过又回来）与 [пошёл]{.ru}（动身去了）。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的体。
    why: "看句中的提示词：[ча́сто, всегда́, до́лго, мно́го]{.ru} 和不带前置词的时段（[неде́лю, пе́рвый ме́сяц]{.ru}）配未完成体；具体数量（[три кни́ги]{.ru}）、[уже́]{.ru}、一次性的结果配完成体。第 4 题是否定一段时间里没做的事，用未完成体 [не ходи́л]{.ru}。第 6 题是依次发生的两个动作，都用完成体。"
    items:
      - stem: В э́том семе́стре я ча́сто ___ пи́сьма домо́й.
        options: [писа́л, написа́л]
        answer: писа́л
      - stem: Вчера́ я ___ письмо́ Ми́ше и пошёл гуля́ть.
        options: [писа́л, написа́л]
        answer: написа́л
      - stem: За семе́стр Ван Лэй ___ три кни́ги.
        options: [чита́л, прочита́л]
        answer: прочита́л
      - stem: Ван Лэй был бо́лен и неде́лю не ___ на заня́тия.
        options: [ходи́л, пошёл]
        answer: ходи́л
      - stem: Пе́рвый ме́сяц я почти́ не ___, что говоря́т на у́лице.
        options: [понима́л, по́нял]
        answer: понима́л
      - stem: Он пошёл в библиоте́ку и ___ уче́бник.
        options: [брал, взял]
        answer: взял

  - id: e2
    type: choice
    task: 选择 [ходи́л]{.ru} / [пошёл]{.ru} 或 [е́здил]{.ru} / [пое́хал]{.ru}。
    why: "[ходи́л, е́здил]{.ru} 表示“去过某地，又回来了”，相当于 [был]{.ru}：[Я ходи́л в теа́тр = Я был в теа́тре]{.ru}；也用于经常性的往返。[пошёл, пое́хал]{.ru} 表示“动身前往”，说话时人可能还在那里或在路上，讲故事时后面往往接着讲到了那里以后的事。第 2 题“他现在不在家”说明人还在剧院，所以用 [пошёл]{.ru}。"
    items:
      - stem: В декабре́ мы ___ в Петербу́рг. Там бы́ло о́чень краси́во.
        options: [е́здили, пое́хали]
        answer: е́здили
      - stem: — Где Ван Лэй? — Его́ нет до́ма, он ___ в теа́тр.
        options: [ходи́л, пошёл]
        answer: пошёл
      - stem: В э́том семе́стре я ча́сто ___ в теа́тр.
        options: [ходи́л, пошёл]
        answer: ходи́л
      - stem: По́сле уро́ка А́нна ___ домо́й на метро́.
        options: [е́здила, пое́хала]
        answer: пое́хала

  - id: e3
    type: fill
    task: 把括号里的动词变成过去时，注意选择正确的体。
    why: "讲述过去时先判断：是过程、反复（未完成体），还是一次完成、有结果（完成体）。第 1 题“第一个月”是一段持续的时间；第 2 题 [заболе́ть]{.ru} 表示进入生病状态，只能用完成体；第 3 题 [всегда́]{.ru} 表示反复；第 4 题主语是阴性 [О́льга Ви́кторовна]{.ru}，词尾 [-ла]{.ru}。"
    items:
      - stem: Пе́рвый ме́сяц Ван Лэй мно́го ___.
        hint: занима́ться
        accept: [занима́лся]
      - stem: В декабре́ Ван Лэй ___.
        hint: заболе́ть
        accept: [заболе́л]
      - stem: "Он всегда́ ___ пи́сьма так: «Дороги́е ма́ма и па́па!»"
        hint: начина́ть
        accept: [начина́л]
      - stem: О́льга Ви́кторовна ___ Ван Лэ́я рассказа́ть о семе́стре.
        hint: попроси́ть
        accept: [попроси́ла]
      - stem: А́нна ___, что пальто́ на́до оставля́ть в гардеро́бе.
        hint: сказа́ть
        accept: [сказа́ла]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 这个学期我常去剧院。（男性说）
        accept: ["В э́том семе́стре я ча́сто ходи́л в теа́тр.", "Я ча́сто ходи́л в теа́тр в э́том семе́стре.", "Я в э́том семе́стре ча́сто ходи́л в теа́тр."]
        rubric: ["“常去”是反复的往返，用未完成体不定向动词 [ходи́л]{.ru}", "[в теа́тр]{.ru} 用第四格", "[в э́том семе́стре]{.ru} 第六格"]
      - zh: 我读了很多书，读完了三本。（男性说）
        accept: ["Я мно́го чита́л и прочита́л три кни́ги.", "Я чита́л мно́го и прочита́л три кни́ги."]
        rubric: ["“读了很多”是活动本身，用 [чита́л]{.ru}", "“读完了三本”是结果，用 [прочита́л]{.ru}", "[три]{.ru} 后面用单数第二格 [кни́ги]{.ru}"]
      - zh: 大衣要存在存衣处。
        accept: ["Пальто́ на́до оставля́ть в гардеро́бе.", "Пальто́ ну́жно оставля́ть в гардеро́бе.", "Пальто́ на́до оста́вить в гардеро́бе.", "В гардеро́бе на́до оставля́ть пальто́.", "Пальто́ ну́жно оста́вить в гардеро́бе."]
        rubric: ["[на́до]{.ru} + 不定式", "[пальто́]{.ru} 不变格", "[в гардеро́бе]{.ru} 第六格"]
      - zh: 十二月我病了，一个星期没去上课。（男性说）
        accept: ["В декабре́ я заболе́л и неде́лю не ходи́л на заня́тия.", "В декабре́ я заболе́л и неде́лю не ходи́л на уро́ки.", "Я заболе́л в декабре́ и неде́лю не ходи́л на заня́тия.", "В декабре́ я заболе́л и не ходи́л на заня́тия неде́лю."]
        rubric: ["“病了”用完成体 [заболе́л]{.ru}", "否定一段时间里没做的事用未完成体 [не ходи́л]{.ru}", "[неде́лю]{.ru} 第四格表示持续时间，不用前置词"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 题目：“我的这个学期”。写一写这个学期你学了什么、去过哪些地方、读了什么书，遇到过什么困难。注意动词体的选择，未完成体和完成体都要用到。
        length: 80–120
        model: |
          В э́том семе́стре я мно́го занима́лся ру́сским языко́м. Снача́ла бы́ло тру́дно: я почти́ не понима́л, что говоря́т в магази́не и в метро́. Пото́м ста́ло ле́гче. Я ча́сто ходи́л в библиоте́ку и иногда́ в теа́тр. В ноябре́ мы с друго́м е́здили в Петербу́рг и ви́дели Эрмита́ж. Ещё я прочита́л пе́рвую ру́сскую кни́гу. В декабре́ я заболе́л и неде́лю сиде́л до́ма, но О́льга Ви́кторовна написа́ла мне зада́ния, и я их сде́лал. Тепе́рь я гото́в к се́ссии.
        rubric: ["未完成体用于过程、反复（[занима́лся, ходи́л, понима́л]{.ru}）", "完成体用于结果（[прочита́л, заболе́л]{.ru}）", "去过某地用 [е́здил / ходи́л]{.ru}", "时间顺序清楚：开始—过程—现在"]
        notes: 范文按时间顺序：先总说学习，再讲开始时的困难和后来的进步，然后举几件具体的事（去剧院、去彼得堡、读书、生病），最后落到现在。每一句先想清楚是“一段时间里的活动”还是“一次完成的结果”，再选体。[ста́ло ле́гче]{.ru}“变得容易些了”，[ле́гче]{.ru} 是 [легко́]{.ru} 的比较级。
