  - id: e8
    type: open
    task: 缩写。
    items:
      - prompt: "按下面的问题，用第三人称把课文缩写成一段话：[Что Ван Лэй ви́дел на Арба́те? Куда́ его́ пригласи́ла Ка́тя? Что случи́лось у Ми́ши, пока́ па́пы не́ было? Почему́ Ван Лэй не пое́хал в Абра́мцево? Как Ван Лэй помо́г Ди́ме? Как Ди́ма игра́л в футбо́л?]{.ru}"
        length: 70–100
        model: "На Арба́те Ван Лэй ви́дел дом, в кото́ром жил Пу́шкин, и сте́ну Цо́я. Ка́тя пригласи́ла его́ на сва́дьбу: она́ хоте́ла, что́бы он уви́дел ру́сскую сва́дьбу. Пока́ па́пы не́ было до́ма, Ми́ша игра́л в гости́ной с мячо́м, и стекло́ в шкафу́ разби́лось. Но они́ с Ван Лэ́ем поменя́ли его́, пока́ па́па не верну́лся. Ван Лэй не пое́хал в Абра́мцево, так как проспа́л. Хотя́ он о́чень уста́л, он помо́г Ди́ме подгото́виться к зачёту. Пя́того ию́ня Ди́ма игра́л так, как бу́дто он настоя́щий футболи́ст."
        rubric: ["回答全部六个问题", "至少用五种不同的复合句（[кото́рый]{.ru}、[что́бы]{.ru}、[пока́ / пока́ не]{.ru}、[так как]{.ru}、[хотя́]{.ru}、[как бу́дто]{.ru} 等）", "[что́бы]{.ru} 后面用过去时形式", "第三人称，过去时"]
        notes: 范文约 80 词，每个问题一句，每句用一种本单元的复合句：[в кото́ром]{.ru}（定语）、[хоте́ла, что́бы он уви́дел]{.ru}（说明，主语不同用过去时形式）、[пока́ … пока́ не]{.ru}（时间）、[так как]{.ru}（原因）、[хотя́]{.ru}（让步）、[так, как бу́дто]{.ru}（比较）。缩写时不必照抄课文，可以把几句合成一句，例如把课文里迪马通过考查的结果省去，只保留问题问到的内容。

  - id: e9
    type: open
    task: 作文：《一位对我影响很大的人》。
    items:
      - prompt: 写一个对你影响很大的人（老师、亲人、朋友都可以）：他（她）是什么样的人，为你做过什么，要是没有他（她），你会怎么样。尽量多用本单元的复合句：[кото́рый]{.ru}、[что́бы]{.ru}、[хотя́]{.ru}、[е́сли бы]{.ru}、[как бу́дто]{.ru} 等。
        length: 100–150
        model: "Челове́к, кото́рый о́чень помо́г мне в жи́зни, — моя́ шко́льная учи́тельница матема́тики.\n\nКогда́ я пришёл в её класс, я о́чень пло́хо знал матема́тику. Хотя́ я стара́лся, у меня́ ничего́ не получа́лось. Но она́ никогда́ не говори́ла мне, что я не смогу́. По́сле уро́ков она́ оставля́ла меня́ в кла́ссе, что́бы ещё раз всё объясни́ть. Она́ говори́ла со мной так, как бу́дто я был её сын.\n\nОна́ всегда́ говори́ла: «Я хочу́, что́бы ты ве́рил в себя́». И я на́чал ве́рить. Че́рез год я получи́л пятёрку на экза́мене.\n\nЕ́сли бы не она́, я бы, наве́рное, не пошёл учи́ться в университе́т. Тепе́рь, когда́ мне тру́дно, я вспомина́ю её слова́."
        rubric: ["说清这个人是谁、做过什么、对你的影响", "至少用五种不同的复合句，[что́бы]{.ru} 和 [е́сли бы]{.ru} 用对", "100–150 词，分段"]
        notes: 范文开头用定语从句点题（[Челове́к, кото́рый…]{.ru}），中间用一个具体的经历说明老师怎么帮助“我”：[хотя́]{.ru} 写困难，[что́бы]{.ru} 写老师留下“我”的目的（主语相同用不定式），[как бу́дто]{.ru} 写老师的态度，[хочу́, что́бы ты ве́рил]{.ru} 是主语不同的说明从句。结尾 [Е́сли бы не она́, я бы…]{.ru}“要不是她，我就……”是表达感激的常用句式。

  - id: e10
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊。卡佳婚礼后几天，给卡佳和伊利亚写一封信：谢谢他们的邀请，说说婚礼上什么给你留下的印象最深，祝福他们，问问他们夏天的打算。对两个人用 [вы]{.ru}。
        length: 80–120
        model: "Дороги́е Ка́тя и Илья́!\n\nЕщё раз поздравля́ю вас! Большо́е спаси́бо, что вы пригласи́ли меня́ на сва́дьбу. Е́сли бы не вы, я бы никогда́ не уви́дел настоя́щую ру́сскую сва́дьбу.\n\nБо́льше всего́ мне понра́вилось, как Илья́ отвеча́л на зага́дки, кото́рые ему́ задава́ли подру́ги Ка́ти. А когда́ ма́ма Ка́ти вы́несла карава́й, все так смея́лись! Я обяза́тельно расскажу́ об э́том роди́телям, когда́ верну́сь в Пеки́н.\n\nЯ жела́ю вам, что́бы вы всегда́ бы́ли сча́стливы и что́бы в ва́шем до́ме всегда́ был смех.\n\nА что вы бу́дете де́лать ле́том? Куда́ вы пое́дете?\n\nВаш Ван Лэй"
        rubric: ["称呼两个人，正文用 [вы]{.ru}", "感谢邀请、讲印象、祝福、提问四部分齐全", "至少用一次 [кото́рый]{.ru}、一次 [что́бы]{.ru}、一次 [е́сли бы]{.ru}", "有落款"]
        notes: 范文按“祝贺和感谢—印象—祝福—提问”四段写。[спаси́бо, что…]{.ru} 用 [что]{.ru} 引出感谢的事实；祝福用 [жела́ю вам, что́бы…]{.ru}，从句动词用过去时形式 [бы́ли]{.ru}、[был]{.ru}，这句话呼应王磊在婚礼上说的祝酒词。[зага́дки, кото́рые ему́ задава́ли]{.ru} 中 [кото́рые]{.ru} 是第四格（[задава́ли зага́дки]{.ru}），和先行词一样是复数。给同龄朋友的信可以用 [Ваш Ван Лэй]{.ru} 落款。
