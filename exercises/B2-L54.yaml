lesson: B2-L54
heading: 单元测试
intro: 本测试覆盖第六单元全部语法。答对 80% 以上再进入第七单元；没有达到的，按出错的题回到相应的课复习后重做：[кото́рый]{.ru} 看第 46 课，[что]{.ru} 和 [что́бы]{.ru} 看第 47、48 课，时间从句看第 49 课，[е́сли бы]{.ru} 看第 50 课，原因、让步、比较看第 51—53 课。
grammar: "定语从句 [кото́рый]{.ru} 的各格；说明从句 [что]{.ru} 与 [что́бы]{.ru}；目的从句 [что́бы]{.ru}、[для того́ что́бы]{.ru}；时间从句 [пока́]{.ru}、[пока́ не]{.ru}、[по́сле того́ как]{.ru}、[пе́ред тем как]{.ru}；条件从句与假定式 [е́сли бы]{.ru}；原因与结果 [так как]{.ru}、[поэ́тому]{.ru}、[так что]{.ru}；让步从句 [хотя́]{.ru}、[несмотря́ на то что]{.ru}；比较从句 [как]{.ru}、[чем]{.ru}、[как бу́дто]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [кото́рый]{.ru} 的正确形式。
    why: "性数看先行词，格看从句里的作用，把从句还原成独立的句子就能判断。第 1 题 [жил в до́ме]{.ru}，第六格 [в кото́ром]{.ru}。第 2 题 [люби́л де́вушку]{.ru}，阴性第四格 [кото́рую]{.ru}。第 3 题 [лю́ди шли]{.ru}，复数第一格 [кото́рые]{.ru}。第 4 题 [идёт с челове́ком]{.ru}，第五格 [с кото́рым]{.ru}。第 5 题表示“他的歌”，用第二格 [кото́рого]{.ru} 放在名词后面，不受 [пе́сни]{.ru} 影响。第 6 题 [ви́дели худо́жника]{.ru}，动物名词第四格同第二格 [кото́рого]{.ru}。第 7 题 [помога́ла подру́ге]{.ru}，阴性第三格 [кото́рой]{.ru}。第 8 题 [расска́зывал о кни́ге]{.ru}，阴性第六格 [о кото́рой]{.ru}。第 9 题 [дала́ сове́т студе́нтам]{.ru}，复数第三格 [кото́рым]{.ru}。"
    items:
      - stem: Вот дом, в ___ жил Пу́шкин.
        options: [кото́ром, кото́рый, кото́рого]
        answer: кото́ром
      - stem: Ната́лья Гончаро́ва — де́вушка, ___ Пу́шкин о́чень люби́л.
        options: [кото́рую, кото́рая, кото́рой]
        answer: кото́рую
      - stem: Ван Лэй смотре́л на люде́й, ___ шли ми́мо.
        options: [кото́рые, кото́рых, кото́рым]
        answer: кото́рые
      - stem: Кто э́тот молодо́й челове́к, с ___ идёт Ка́тя?
        options: [кото́рым, кото́рый, кото́рого]
        answer: кото́рым
      - stem: Цой — музыка́нт, пе́сни ___ Ван Лэй слу́шал ещё в Пеки́не.
        options: [кото́рого, кото́рые, кото́рых]
        answer: кото́рого
      - stem: Вот худо́жник, ___ мы ви́дели на Арба́те.
        options: [кото́рого, кото́рый, кото́рому]
        answer: кото́рого
      - stem: Ка́тя — подру́га, ___ А́нна помога́ла пе́ред сва́дьбой.
        options: [кото́рой, кото́рую, кото́рая]
        answer: кото́рой
      - stem: Вот кни́га, о ___ я тебе́ расска́зывал.
        options: [кото́рой, кото́рую, кото́рая]
        answer: кото́рой
      - stem: Э́то студе́нты, ___ О́льга Ви́кторовна дала́ сове́т.
        options: [кото́рым, кото́рых, кото́рые]
        answer: кото́рым

  - id: e2
    type: choice
    task: 选择 [что]{.ru} 或 [что́бы]{.ru}，或者正确的动词形式。
    why: "陈述事实用 [что]{.ru}（第 1、3 题：安娜解释的是习俗，卡佳高兴的是已经发生的事）；表示请求、愿望、命令用 [что́бы]{.ru}（第 2 题 [попроси́ла]{.ru}；第 7 题原话是命令式 [Спой!]{.ru}，转述成 [что́бы]{.ru}）。[что́бы]{.ru} 后面一律用过去时形式，不用将来时，也不用不定式（第 4、5、6 题：[пришёл, взял, сказа́л]{.ru}）。第 8 题动作是主语自己做，直接用不定式 [пойти́]{.ru}，不能说 [что́бы я пошёл]{.ru}。"
    items:
      - stem: А́нна объясни́ла, ___ на сва́дьбу ча́сто да́рят де́ньги.
        options: [что, что́бы]
        answer: что
      - stem: Ка́тя попроси́ла, ___ А́нна пришла́ к ней в де́вять утра́.
        options: [что́бы, что]
        answer: что́бы
      - stem: Я так ра́да, ___ ты пришёл!
        options: [что, что́бы]
        answer: что
      - stem: Я о́чень хочу́, что́бы ты то́же ___ на сва́дьбу.
        options: [пришёл, придёшь, прийти́]
        answer: пришёл
      - stem: Ма́ма сказа́ла, что́бы Ми́ша ___ зонт.
        options: [взял, возьмёт, взять]
        answer: взял
      - stem: Па́па Ильи́ попроси́л, что́бы Ван Лэй ___ тост по-кита́йски.
        options: [сказа́л, ска́жет, сказа́ть]
        answer: сказа́л
      - stem: «Спой нам пе́сню!» — сказа́ла А́нна Илье́. = А́нна сказа́ла Илье́, ___ он спел пе́сню.
        options: [что́бы, что]
        answer: что́бы
      - stem: Я хочу́ ___ на сва́дьбу к Ка́те.
        options: [пойти́, что́бы я пошёл, пошёл]
        answer: пойти́

  - id: e3
    type: rewrite
    task: 用 [что́бы]{.ru} 把两句话连成一句，说明第一件事的目的。
    why: "两句话主语相同（第 1、4 题），[что́бы]{.ru} 后面用不定式；主语不同（第 2、3、5 题），[что́бы]{.ru} 后面用过去时形式，性数和从句主语一致：[не забы́л]{.ru}（王磊），[не меша́л]{.ru}（[никто́]{.ru}）。“为了不……”用 [что́бы не]{.ru} 加完成体：[не опозда́ть, не забы́л]{.ru}。第 4 题第二句的将来时 [не опозда́ет]{.ru} 变成不定式，第 2、5 题的 [не забу́дет]{.ru} 变成过去时形式 [не забы́л]{.ru}。"
    example:
      cue: Ю́ми е́дет в Петербу́рг. Она́ бу́дет учи́ться в ле́тней шко́ле.
      answer: Ю́ми е́дет в Петербу́рг, что́бы учи́ться в ле́тней шко́ле.
    items:
      - cue: Пьер возьмёт с собо́й ру́сские фи́льмы. Он бу́дет смотре́ть их по вечера́м.
        accept: ["Пьер возьмёт с собо́й ру́сские фи́льмы, что́бы смотре́ть их по вечера́м."]
      - cue: Ми́ша бу́дет писа́ть Ван Лэ́ю. Ван Лэй не забу́дет ру́сский язы́к.
        accept: ["Ми́ша бу́дет писа́ть Ван Лэ́ю, что́бы Ван Лэй не забы́л ру́сский язы́к.", "Ми́ша бу́дет писа́ть Ван Лэ́ю, что́бы он не забы́л ру́сский язы́к."]
      - cue: Ван Лэй вы́ключил телефо́н. Ему́ никто́ не бу́дет меша́ть.
        accept: ["Ван Лэй вы́ключил телефо́н, что́бы ему́ никто́ не меша́л.", "Ван Лэй вы́ключил телефо́н, что́бы никто́ ему́ не меша́л.", "Ван Лэй вы́ключил телефо́н, что́бы никто́ не меша́л ему́."]
      - cue: Ди́ма вы́шел из до́ма ра́но. Он не опозда́ет.
        accept: ["Ди́ма вы́шел из до́ма ра́но, что́бы не опозда́ть."]
      - cue: О́льга Ви́кторовна дала́ Ван Лэ́ю сове́т. Ван Лэй не забу́дет язы́к.
        accept: ["О́льга Ви́кторовна дала́ Ван Лэ́ю сове́т, что́бы он не забы́л язы́к.", "О́льга Ви́кторовна дала́ Ван Лэ́ю сове́т, что́бы Ван Лэй не забы́л язы́к."]

  - id: e4
    type: choice
    task: 选择合适的时间连接词或动词形式。
    why: "第 1 题两件事同时进行（妈妈上班期间），用 [пока́]{.ru}。第 2 题“一直玩到球打中柜子”，从句里已经有 [не]{.ru}，是 [пока́ не]{.ru}，这里的 [не]{.ru} 没有否定意义。第 3 题说的是将来，[пока́ не]{.ru} 后面用完成体将来时 [вернётся]{.ru}。第 4 题先量完再去修理铺，从句的事先发生，用 [по́сле того́ как]{.ru}。第 5 题后面是不定式（主语相同），只能用 [пе́ред тем как]{.ru}。第 6 题“等到你看完”，[пока́ не]{.ru} 加完成体将来时 [прочита́ешь]{.ru}；[чита́ешь]{.ru} 要和不带 [не]{.ru} 的 [пока́]{.ru} 连用。"
    items:
      - stem: ___ ма́ма была́ на рабо́те, Ми́ша игра́л в гости́ной с мячо́м.
        options: [Пока́, По́сле того́ как, Пе́ред тем как]
        answer: Пока́
      - stem: Ми́ша игра́л, ___ мяч не попа́л в шкаф.
        options: [пока́, по́сле того́ как, пе́ред тем как]
        answer: пока́
      - stem: На́до поменя́ть стекло́, пока́ па́па не ___.
        options: [вернётся, возвраща́ется, верну́лся]
        answer: вернётся
      - stem: ___ они́ изме́рили шкаф, они́ пое́хали в мастерску́ю.
        options: [По́сле того́ как, Пе́ред тем как, Пока́ не]
        answer: По́сле того́ как
      - stem: ___ уе́хать в командиро́вку, па́па поговори́л с Ми́шей.
        options: [Пе́ред тем как, По́сле того́ как, Пока́]
        answer: Пе́ред тем как
      - stem: Я бу́ду ждать, пока́ ты не ___ кни́гу.
        options: [прочита́ешь, чита́ешь, прочита́л]
        answer: прочита́ешь

  - id: e5
    type: rewrite
    task: 按例句把真实条件句改成非真实条件句（事实上条件没有实现）。
    why: "非真实条件句两个分句都要有 [бы]{.ru}，动词都用过去时形式：将来时 [вы́ключишь, возьмёте, позвони́т, пое́дем]{.ru} 都要改成过去时形式，性数跟各自的主语一致。第 2 题主语是 [избу́шка]{.ru}，用阴性 [была́]{.ru}。第 5 题 [не бу́дет экза́мена]{.ru} 是无人称句，改成中性 [не́ было]{.ru}。从句的 [бы]{.ru} 紧跟 [е́сли]{.ru}，主句的 [бы]{.ru} 放在主语或动词后面都可以。"
    example:
      cue: Е́сли я бу́ду знать, я вста́ну в шесть.
      answer: Е́сли бы я знал, я бы встал в шесть.
    items:
      - cue: Е́сли ты не вы́ключишь телефо́н, ты всё бу́дешь знать.
        accept: ["Е́сли бы ты не вы́ключил телефо́н, ты бы всё знал.", "Е́сли бы ты не вы́ключил телефо́н, ты всё знал бы.", "Е́сли бы ты не вы́ключил телефо́н, ты бы знал всё.", "Е́сли бы ты не вы́ключил телефо́н, ты знал бы всё."]
      - cue: Е́сли у меня́ бу́дет така́я избу́шка, я бу́ду жить в ней всё ле́то.
        accept: ["Е́сли бы у меня́ была́ така́я избу́шка, я бы жил в ней всё ле́то.", "Е́сли бы у меня́ была́ така́я избу́шка, я жил бы в ней всё ле́то.", "Е́сли бы у меня́ была́ така́я избу́шка, я бы жила́ в ней всё ле́то.", "Е́сли бы у меня́ была́ така́я избу́шка, я жила́ бы в ней всё ле́то."]
      - cue: Е́сли вы возьмёте зонт, вы не промо́кнете.
        accept: ["Е́сли бы вы взя́ли зонт, вы бы не промо́кли.", "Е́сли бы вы взя́ли зонт, вы не промо́кли бы."]
      - cue: Е́сли А́нна позвони́т, Ван Лэй пое́дет в Абра́мцево.
        accept: ["Е́сли бы А́нна позвони́ла, Ван Лэй пое́хал бы в Абра́мцево.", "Е́сли бы А́нна позвони́ла, Ван Лэй бы пое́хал в Абра́мцево."]
      - cue: Е́сли за́втра не бу́дет экза́мена, мы пое́дем на да́чу.
        accept: ["Е́сли бы за́втра не́ было экза́мена, мы бы пое́хали на да́чу.", "Е́сли бы за́втра не́ было экза́мена, мы пое́хали бы на да́чу."]

  - id: e6
    type: choice
    task: 选择合适的连接词。
    why: "第 1 题原因放在句首，用 [так как]{.ru}，不能用 [потому́ что]{.ru}。第 2 题后半句是结果，用 [так что]{.ru}。第 9 题后半句也是结果，用 [поэ́тому]{.ru}；[потому́ что]{.ru} 引出的是原因。第 3 题“很累”本来会妨碍“马上去学校”，是让步，用 [хотя́]{.ru}。第 4 题同理，用 [несмотря́ на то что]{.ru}，后面是完整的分句。第 5 题后面只有名词 [дождь]{.ru}（第四格），用前置词 [несмотря́ на]{.ru}；[хотя́]{.ru} 后面要有分句。第 6 题前面有比较级 [ра́ньше]{.ru}，用 [чем]{.ru}。第 7 题 [тако́й же]{.ru} 和 [как]{.ru} 呼应，表示相同。第 8 题迪马其实不是米沙的哥哥，是不真实的比较，用 [как бу́дто]{.ru}。"
    items:
      - stem: ___ до до́ма бы́ло далеко́, они́ побежа́ли к остано́вке.
        options: [Так как, Потому́ что, Так что]
        answer: Так как
      - stem: Бу́дет гроза́, ___ возьми́те зонт.
        options: [так что, так как, хотя́]
        answer: так что
      - stem: ___ Ван Лэй о́чень уста́л, он сра́зу пое́хал в университе́т.
        options: [Хотя́, Так как, Пока́]
        answer: Хотя́
      - stem: О́льга Ви́кторовна похвали́ла сочине́ние, ___ он писа́л его́ но́чью.
        options: [несмотря́ на то что, так как, поэ́тому]
        answer: несмотря́ на то что
      - stem: ___ дождь, мы пошли́ гуля́ть.
        options: [Несмотря́ на, Хотя́, Так как]
        answer: Несмотря́ на
      - stem: Ди́ма пришёл ра́ньше, ___ обы́чно.
        options: [чем, как, как бу́дто]
        answer: чем
      - stem: Не́бо тако́е же, ___ во вто́рник.
        options: [как, чем, как бу́дто]
        answer: как
      - stem: Ми́ша смотре́л на Ди́му так, ___ э́то был его́ ста́рший брат.
        options: [как бу́дто, чем, что́бы]
        answer: как бу́дто
      - stem: Ван Лэй по́мнил, как заболе́л в декабре́, ___ сра́зу переоде́лся.
        options: [поэ́тому, потому́ что, хотя́]
        answer: поэ́тому

  - id: e7
    type: translate
    task: 译成俄语。
    why: "第 1 题“我跟你讲过的”放在名词后面，[расска́зывать о]{.ru} 要求第六格，前置词放在 [кото́ром]{.ru} 前面。第 2 题“希望别人做”用 [хоте́ть, что́бы]{.ru} + 过去时形式。第 3 题主语相同，目的从句用 [что́бы]{.ru}（或 [для того́ что́бы]{.ru}）+ 不定式。第 4 题“等到你回来”用 [пока́ не]{.ru} + 完成体将来时。第 5 题事实上不知道，用 [е́сли бы]{.ru}，两个分句都有 [бы]{.ru}。第 6 题让步用 [хотя́]{.ru} 或 [несмотря́ на то что]{.ru}，主句不加 [но]{.ru}。第 7 题副词 [обы́чно]{.ru} 前面只能用 [чем]{.ru}。"
    items:
      - zh: 这就是我跟你讲过的那个人。
        accept: ["Вот челове́к, о кото́ром я тебе́ расска́зывал.", "Вот челове́к, о кото́ром я тебе́ расска́зывала.", "Вот тот челове́к, о кото́ром я тебе́ расска́зывал.", "Вот тот челове́к, о кото́ром я тебе́ расска́зывала.", "Э́то челове́к, о кото́ром я тебе́ расска́зывал.", "Э́то челове́к, о кото́ром я тебе́ расска́зывала.", "Э́то тот челове́к, о кото́ром я тебе́ расска́зывал.", "Э́то тот челове́к, о кото́ром я тебе́ расска́зывала.", "Вот челове́к, о кото́ром я расска́зывал тебе́.", "Вот челове́к, о кото́ром я расска́зывала тебе́."]
        rubric: ["定语从句放在 [челове́к]{.ru} 后面，用逗号隔开", "[о кото́ром]{.ru}：阳性第六格，前置词在前"]
      - zh: 妈妈希望米沙多读书。
        accept: ["Ма́ма хо́чет, что́бы Ми́ша бо́льше чита́л.", "Ма́ма хо́чет, что́бы Ми́ша чита́л бо́льше."]
        rubric: ["主语不同，用 [что́бы]{.ru}", "从句动词用过去时形式 [чита́л]{.ru}"]
      - zh: 我来莫斯科是为了学俄语。
