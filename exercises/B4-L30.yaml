lesson: B4-L30
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Кто заключил договор и на какой срок? Сколько стоит квартира и как нужно платить? Что обязан делать наниматель? В каком случае ему вернут залог? Как можно расторгнуть договор? Что запрещается в общежитии?]{.ru}"
        length: 120–160
        model: "Договор заключили Пётр Орлов, хозяин квартиры, и китайский студент Чжан Вэй на одиннадцать месяцев, с 1 сентября 2026 года по 31 июля 2027 года. Квартира стоит 30 000 рублей в месяц; платить нужно каждый месяц, не позднее пятого числа, переводом на банковскую карту хозяина. За коммунальные услуги нужно платить отдельно. Наниматель обязан жить в квартире сам, вовремя платить, поддерживать порядок, не портить имущество и сразу сообщать об авариях. Залог ему вернут после окончания договора, если имущество в порядке и у него нет долгов. Договор можно расторгнуть досрочно, если обе стороны согласны, или в одностороннем порядке, если предупредить другую сторону письменно не менее чем за 30 дней. В общежитии запрещается курить, употреблять алкоголь, держать в комнате электрические плиты, передавать пропуск другим и без разрешения переходить в другую комнату."
        rubric: ["六个问题都回答，事实与合同一致", "数字准确：11 个月、30 000 卢布、5 日、30 天", "用普通的说法转述公文的意思"]
        notes: "回答时可以把公文说法换成普通说法：[Оплата производится ежемесячно]{.ru} → [платить нужно каждый месяц]{.ru}；[при отсутствии повреждения имущества]{.ru} → [если имущество не повреждено]{.ru}。这正是读懂公文的关键。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[залог]{.ru}"
        accept: ["Деньги, которые наниматель платит при подписании договора и которые ему возвращают в конце, если всё в порядке.", "Сумма, которую дают хозяину квартиры на случай повреждения имущества."]
        rubric: ["说明是签约时交的钱", "期满无损坏时退还"]
      - zh: "[наниматель]{.ru}"
        accept: ["Человек, который снимает квартиру за плату.", "Тот, кто получает квартиру в пользование и платит за неё."]
        rubric: ["说明是付钱租房的人"]
      - zh: "[расторгнуть договор]{.ru}"
        accept: ["Закончить действие договора раньше срока.", "Закончить договор до окончания его срока."]
        rubric: ["说明是终止合同的效力"]
      - zh: "[досрочно]{.ru}"
        accept: ["Раньше срока.", "До окончания срока."]
        rubric: ["说明是在规定期限之前"]
      - zh: "[коммунальные услуги]{.ru}"
        accept: ["Вода, свет, отопление и другие услуги, за которые платят жители дома.", "Плата за воду, электричество и отопление в квартире."]
        rubric: ["说明是水、电、燃气、暖气等费用"]
      - zh: "[экземпляр]{.ru}"
        accept: ["Один из нескольких одинаковых документов или книг.", "Одна копия документа."]
        rubric: ["说明是同样的文件或书中的一份"]

  - id: e3
    type: choice
    task: 根据合同和规定选择正确答案。
    why: "第 1 题第 3.2 条：不晚于当月 5 日。第 2 题第 3.3 条：押金在合同期满、财物无损坏、无欠款时退还。第 3 题第 2.4 条：养宠物须经出租人书面同意，并非绝对禁止。第 4 题第 5.2 条：单方面解除须提前至少 30 天书面通知。第 5 题第 4.3 条：期满后留在房屋里的物品，出租人不负责任。第 6 题规定第 5 条：来访者遵守规定的责任由邀请他们的住户承担。"
    items:
      - stem: Плату за наём нужно вносить ___.
        options: ["не позднее 5-го числа каждого месяца", "один раз при подписании договора", "в конце срока действия договора"]
        answer: "не позднее 5-го числа каждого месяца"
      - stem: Залог возвращается ___.
        options: ["по окончании договора, если нет повреждений и долгов", "через месяц после подписания договора", "только в случае аварии"]
        answer: "по окончании договора, если нет повреждений и долгов"
      - stem: Домашних животных в Квартире ___.
        options: [можно держать с письменного согласия Наймодателя, держать нельзя ни в каком случае, можно держать без всякого согласия]
        answer: можно держать с письменного согласия Наймодателя
      - stem: Чтобы расторгнуть договор в одностороннем порядке, нужно ___.
        options: ["письменно предупредить другую сторону не менее чем за 30 дней", "заплатить штраф 30 000 рублей", "получить разрешение суда"]
        answer: "письменно предупредить другую сторону не менее чем за 30 дней"
      - stem: За вещи, оставленные в Квартире после окончания договора, ___.
        options: [Наймодатель ответственности не несёт, отвечает Наймодатель, отвечает администрация]
        answer: Наймодатель ответственности не несёт
      - stem: Если посетитель не соблюдает Правила общежития, ответственность несёт ___.
        options: ["проживающий, который его пригласил", "сам посетитель", "дежурный"]
        answer: "проживающий, который его пригласил"

  - id: e4
    type: rewrite
    task: 把主动句改成公文常用的被动句（带 [-ся]{.ru} 的动词，施事者用第五格）。
    example:
      cue: Наниматель производит оплату.
      answer: Оплата производится Нанимателем.
    why: "未完成体及物动词加 [-ся]{.ru} 构成被动：原来的直接补语（第四格）变成主语（第一格），原来的主语变成第五格。第 1 题 [залог]{.ru} 作主语，[возвращает]{.ru} → [возвращается]{.ru}，[Наймодатель]{.ru} → [Наймодателем]{.ru}。第 2 题 [пропуск]{.ru} 作主语，[выдаёт]{.ru} → [выдаётся]{.ru}。第 3 题 [договор]{.ru} 作主语，施事者可以省略，公文里常常不说是谁。第 4 题 [ключи]{.ru} 复数，动词也用复数 [выдаются]{.ru}。第 5 题 [ущерб]{.ru} 作主语，[возмещает]{.ru} → [возмещается]{.ru}。"
    items:
      - cue: Наймодатель возвращает залог.
        accept: ["Залог возвращается Наймодателем."]
      - cue: Администрация выдаёт пропуск.
        accept: ["Пропуск выдаётся администрацией."]
      - cue: Стороны заключают договор на 11 месяцев.
        accept: ["Договор заключается сторонами на 11 месяцев.", "Договор заключается на 11 месяцев."]
      - cue: Дежурный выдаёт ключи.
        accept: ["Ключи выдаются дежурным."]
      - cue: Наниматель возмещает ущерб.
        accept: ["Ущерб возмещается Нанимателем."]

  - id: e5
    type: rewrite
    task: 用名词化的说法改写从句（[при, по окончании, в случае]{.ru} 等 + 动名词）。
    example:
      cue: Когда подписывают договор, наниматель вносит залог.
      answer: При подписании договора наниматель вносит залог.
    why: "名词化把从句变成“前置词 + 动名词 + 第二格”。第 1 题 [выезжает]{.ru} → [при выезде]{.ru}。第 2 题“如果”用 [в случае]{.ru} + 第二格：[в случае задержки оплаты]{.ru}：动词词组 [опоздать с оплатой]{.ru} 换成名词 [задержка]{.ru}，[оплата]{.ru} 作它的第二格定语。第 3 题“期满以后”用 [по окончании]{.ru}，[по]{.ru} 在这里要求第六格。第 4 题 [если покажут паспорт]{.ru} → [при предъявлении паспорта]{.ru}，主动句同时改成被动句 [допускаются]{.ru}。第 5 题两个动词 [хранить и использовать]{.ru} 变成 [хранение и использование]{.ru}，宾语变成第二格 [электрических плит]{.ru}。"
    items:
      - cue: Когда наниматель выезжает, он возвращает ключи.
        accept: ["При выезде наниматель возвращает ключи."]
      - cue: Если наниматель опоздает с оплатой, он платит штраф.
        accept: ["В случае задержки оплаты наниматель платит штраф."]
      - cue: Когда срок договора кончится, залог возвращается.
        accept: ["По окончании срока договора залог возвращается.", "По окончании срока действия договора залог возвращается."]
      - cue: Посетителей пускают в общежитие, если они покажут паспорт.
        accept: ["Посетители допускаются в общежитие при предъявлении паспорта."]
      - cue: В комнатах нельзя хранить и использовать электрические плиты.
        accept: ["В комнатах запрещается хранение и использование электрических плит."]

  - id: e6
    type: open
    task: 概要写作。你的朋友刚到俄罗斯，看不懂这份合同。用普通的俄语（不用公文语体）给他写一封短信，转述合同的主要内容，约 150 词。
    items:
      - prompt: "[Объясните другу простыми словами, что написано в договоре.]{.ru} 用 [ты]{.ru}，不用 [производится, в случае, при отсутствии]{.ru} 这类说法。"
        length: 130–170
        model: "Привет! Я прочитал твой договор, ничего страшного в нём нет. Язык там, конечно, тяжёлый, но смысл простой. Ты снимаешь квартиру на улице Садовой у Петра Орлова на одиннадцать месяцев, с первого сентября до конца июля. Платить нужно 30 000 рублей в месяц, не позже пятого числа, переводом на его карту. За воду, свет и отопление ты платишь отдельно. Когда будешь подписывать договор, отдашь ещё 30 000 как залог. Эти деньги тебе вернут в конце, если ничего не сломаешь и не будешь должен. Если опоздаешь с оплатой больше чем на десять дней, придётся платить небольшой штраф за каждый день. Курить в квартире нельзя, а кошку или собаку можно держать только с письменного разрешения хозяина. Хозяин не может приходить без твоего согласия, кроме случаев аварии. Если захочешь уехать раньше, нужно предупредить его письменно за месяц. Всё нормально, можно подписывать!"
        rubric: ["转述合同的主要条款：期限、租金、付款方式、押金、罚金、禁止事项、解除", "全部换成口语说法，用 [ты]{.ru}", "不用被动结构和名词化", "130–170 词"]
        notes: "范文约 140 词。这道题练习的是把公文“翻译”成口语：被动改主动（[Оплата производится ежемесячно]{.ru} → [Платить нужно каждый месяц]{.ru}），名词化改动词（[в случае задержки оплаты]{.ru} → [Если опоздаешь с оплатой]{.ru}），[Наниматель]{.ru} 改成 [ты]{.ru}，[Наймодатель]{.ru} 改成 [хозяин]{.ru}。"

  - id: e7
    type: open
    task: 写一份规章：为学校图书馆的阅览室写 5–7 条使用规定，120–160 词，至少用三处被动结构和三处名词化。
    items:
      - prompt: "[Правила пользования читальным залом библиотеки.]{.ru}"
        length: 120–160
        model: "ПРАВИЛА ПОЛЬЗОВАНИЯ ЧИТАЛЬНЫМ ЗАЛОМ\n\n1. Настоящие Правила обязательны для всех читателей библиотеки.\n\n2. Читальный зал работает каждый день с 9.00 до 21.00. Вход в зал производится при предъявлении студенческого билета.\n\n3. Выдача книг производится дежурным сотрудником библиотеки. Одновременно читателю выдаётся не более пяти книг.\n\n4. Книги, полученные в читальном зале, уносить из зала запрещается. Возврат книг производится не позднее 20.45. Книги, которые читатель не вернул вовремя, выдаются другим читателям.\n\n5. Продление срока пользования книгой допускается по просьбе читателя, если книга не нужна другим читателям.\n\n6. В читальном зале запрещаются громкие разговоры, разговоры по мобильному телефону и приём пищи.\n\n7. В случае потери или повреждения книги читатель обязан возместить её стоимость. За нарушение настоящих Правил читатель может потерять право пользования читальным залом на срок до одного месяца."
        rubric: ["格式：标题、编号条款", "至少三处被动结构（[производится, выдаётся, допускается, запрещается]{.ru} 或短尾被动形动词）", "至少三处名词化（[при предъявлении, в случае потери, выдача, возврат, продление]{.ru} 等）", "用词准确、不带感情色彩", "120–160 词"]
        notes: "范文约 130 词，结构仿照课文中的宿舍规定：第 1 条说明适用范围，中间几条写权利和义务，最后一条写违反规定的后果。[выдача, возврат, продление]{.ru} 是图书馆常用的名词化说法（借出、归还、续借）。[возместить стоимость]{.ru}：赔偿价值。“在阅览室吃东西”在公文里说 [приём пищи]{.ru}（进餐），不说 [употребление еды]{.ru}：[употребление]{.ru} 通常和 [алкоголь]{.ru}、[лекарства]{.ru} 等搭配。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的文章。
    items:
      - prompt: "[Зачем нужны правила? Можно ли жить без них?]{.ru} 可以以宿舍、学校或城市为例。"
        length: 250–300
        model: "Когда я впервые прочитал правила проживания в нашем общежитии, мне показалось, что их писали люди, которые не любят студентов. Нельзя то, нельзя это, после одиннадцати — тишина, гостей — до десяти. Зачем столько запретов? Разве взрослые люди не могут договориться сами? Прошёл год, и сегодня я думаю иначе: правила нужны, но не все и не любые.\n\nВо-первых, правила защищают слабых. В общежитии живут сотни людей. Один любит слушать музыку ночью, другой утром идёт на экзамен. Если правил нет, побеждает тот, кто громче. Правило о тишине защищает того, кто хочет спать, и это справедливо.\n\nВо-вторых, многие правила написаны после аварий и пожаров. Запрет на электрические плиты в комнатах кажется глупым, пока не узнаешь, что в соседнем общежитии из-за такой плиты был пожар. За каждым скучным пунктом часто стоит настоящая беда.\n\nВ-третьих, правила экономят время. Если в договоре сразу написано, когда платить и как вернуть залог, не нужно спорить каждый месяц. Договор защищает обе стороны: и хозяина, который боится за своё имущество, и студента, который боится, что хозяин придёт, не предупредив его.\n\nОднако правила полезны только тогда, когда они понятны и справедливы. Если правило никто не может объяснить, люди перестают его соблюдать, а вместе с ним и все остальные. Поэтому правила нужно не только писать, но и время от времени менять, а жителей — спрашивать о них. Хорошее правило не боится вопросов: его всегда можно объяснить.\n\nТаким образом, жить без правил можно только одному на острове, где больше никого нет. Там, где живут вместе хотя бы двое, правила нужны. Главное — чтобы они служили людям, а не люди правилам."
        rubric: ["开头提出问题并给出论点", "三条论据，有具体例子", "有让步或条件（[Однако…]{.ru}）", "结论明确", "250–300 词"]
        notes: "范文约 260 词。开头用自己最初的反感引出问题，然后表明态度变化，读者容易产生共鸣。三条论据分别是保护弱者、防止事故、节省时间，第四段提出条件：规则必须合理、可以修改。结尾用 [чтобы они служили людям, а не люди правилам]{.ru} 这样的对称句收束。"
