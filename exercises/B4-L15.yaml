lesson: B4-L15
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Почему автор благоговел перед воробьём? Что автор получил от нищего? Как в произведении «Как хороши, как свежи были розы…» чередуются настоящее и прошлое? Что значит для автора русский язык?]{.ru}"
        length: 110–150
        model: "Автор благоговел перед старым воробьём, потому что эта маленькая птица бросилась защищать своего птенца от огромной собаки. Воробей дрожал от ужаса, но всё равно жертвовал собой. Автор понял, что любовь сильнее страха и даже сильнее смерти. В «Нищем» у автора не было с собой денег, и он просто пожал нищему руку и назвал его братом. Нищий тоже пожал ему руку и сказал, что это тоже подаяние. Автор понял, что и он получил подаяние: человеческое тепло. В произведении о розах настоящее — это зимний вечер, тёмная комната и одна свеча, а прошлое — летний вечер, девушка у окна, весёлая семья. Картины прошлого становятся всё светлее, а настоящее — всё темнее, пока свеча не гаснет. Русский язык для автора — поддержка и опора в трудные дни. Он верит, что народ, у которого такой язык, — великий народ."
        rubric: ["《麻雀》：老麻雀舍身护子，爱比恐惧更强", "《乞丐》：握手与称“兄弟”也是施舍，双方互相给予", "《玫瑰》：现在越来越暗，过去越来越亮", "《俄罗斯语言》：支柱和依靠，对民族的信念"]
        notes: "每篇用两三句话回答，注意抓住结尾：屠格涅夫的散文诗往往在最后一句点题。第 2 题的关键是“互相”：施舍从物质变成了人与人之间的温暖。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[благоговеть]{.ru}"
        accept: ["Глубоко уважать кого-то, восхищаться кем-то.", "Чувствовать глубокое уважение.", "Очень глубоко уважать."]
        rubric: ["说明是怀着深深的敬意"]
      - zh: "[подаяние]{.ru}"
        accept: ["То, что дают бедному человеку, деньги или еда.", "Помощь нищему.", "Деньги, которые дают нищему."]
        rubric: ["说明是给穷人、乞丐的东西"]
      - zh: "[пристально]{.ru}"
        accept: ["Внимательно, долго глядя на что-то.", "Очень внимательно.", "Долго и внимательно."]
        rubric: ["说明是专注地、目不转睛地（看）"]
      - zh: "[опора]{.ru}"
        accept: ["То, на что можно опереться.", "Поддержка.", "Помощь и поддержка в трудную минуту."]
        rubric: ["说明是支撑、依靠"]
      - zh: "[нищий]{.ru}"
        accept: ["Очень бедный человек, который просит деньги на улице.", "Бедный человек, который просит помощи у других.", "Человек, у которого ничего нет и который просит подаяние."]
        rubric: ["说明是极穷、靠乞讨为生的人"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题散文诗是短小的抒情作品，不分行、不押韵。第 2 题《麻雀》以“爱比死亡更强大”的格言式句子结尾。第 3 题 [брат]{.ru} 在《乞丐》里出现了五次：“我”说了两次，乞丐说了两次，最后一句又出现一次。第 4 题反复出现、把文章分成几段的句子是叠句。第 5 题最后一段 [Свеча меркнет и гаснет]{.ru}，与“他们都死了”相呼应。第 6 题这一行出自米亚特列夫的诗《玫瑰》。第 7 题《俄罗斯语言》只有三句话，是一篇小品。第 8 题直接对俄语说话，用 [о]{.ru} 加第一格，是呼告（呼语）。"
    items:
      - stem: Стихотворение в прозе — это ___ произведение без рифмы и размера.
        options: [короткое лирическое, длинное прозаическое, научное]
        answer: короткое лирическое
      - stem: «Воробей» заканчивается ___.
        options: [мыслью о любви, описанием охоты, разговором с собакой]
        answer: мыслью о любви
      - stem: Слово «брат» в «Нищем» повторяется ___ раз.
        options: [пять, два, три]
        answer: пять
      - stem: Строка «Как хороши, как свежи были розы…» повторяется в тексте как ___.
        options: [рефрен, рифма, антитеза]
        answer: рефрен
      - stem: В конце произведения о розах свеча ___.
        options: [гаснет, горит ярче, падает на пол]
        answer: гаснет
      - stem: Строка «Как хороши, как свежи были розы…» взята из стихотворения ___.
        options: [Мятлева, Пушкина, Тютчева]
        answer: Мятлева
      - stem: «Русский язык» — это короткая ___.
        options: [миниатюра, поэма, повесть]
        answer: миниатюра
      - stem: Слова «о великий, могучий, правдивый и свободный русский язык!» — это ___.
        options: [обращение, рефрен, рифма]
        answer: обращение

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [приближаться к кому]{.ru} 第一变位，主语 [собака]{.ru} 阴性，过去时 [приближалась]{.ru}。第 2 题 [жертвовать чем]{.ru} 要求第五格：[собой]{.ru}，动词现在时 [жертвует]{.ru}。第 3 题 [благоговеть перед кем]{.ru}，第一人称单数过去时 [благоговел]{.ru}（叙述者是男性）。第 4 题主语 [рука]{.ru} 阴性，[колыхаться]{.ru} 过去时 [колыхалась]{.ru}。第 5 题 [опереться на что]{.ru} 的副动词 [опершись]{.ru}。第 6 题 [свеча]{.ru} 作主语，[меркнуть]{.ru} 第三人称单数 [меркнет]{.ru}。"
    items:
      - stem: Собака медленно ___ к птенцу.
        hint: приближаться
        accept: ["приближалась"]
      - stem: Маленькая птица ___ собой ради птенца.
        hint: жертвовать
        accept: ["жертвует"]
      - stem: Я ___ перед этой героической птицей.
        hint: благоговеть
        accept: ["благоговел"]
      - stem: Протянутая рука нищего слабо ___.
        hint: колыхаться
        accept: ["колыхалась"]
      - stem: Девушка сидела у окна, ___ на руку.
        hint: опереться
        accept: ["опершись", "опёршись"]
      - stem: Свеча ___ и гаснет.
        hint: меркнуть
        accept: ["меркнет"]

  - id: e5
    type: rewrite
    task: 把带“命令式表示假设”的句子改写成 [если бы]{.ru} 引导的条件句。
    example:
      cue: Не будь тебя, как не впасть в отчаяние?
      answer: Если бы тебя не было, как не впасть в отчаяние?
    why: "[не будь кого-чего]{.ru} 是书面语的假设结构，等于 [если бы не было кого-чего]{.ru}；后半句可以保留原来的形式，也可以加 [бы]{.ru}。第 1 题 [не будь старого воробья]{.ru} → [если бы не было старого воробья]{.ru}。第 2 题 [будь у меня деньги]{.ru} 是肯定的假设 → [если бы у меня были деньги]{.ru}。第 3 题 [не будь этого стихотворения]{.ru} → [если бы не было этого стихотворения]{.ru}，注意 [стихотворение]{.ru} 中性，[было]{.ru} 用中性。"
    items:
      - cue: Не будь старого воробья, собака схватила бы птенца.
        accept: ["Если бы не было старого воробья, собака схватила бы птенца."]
      - cue: Будь у меня деньги, я бы дал их нищему.
        accept: ["Если бы у меня были деньги, я бы дал их нищему.", "Если бы у меня были деньги, я дал бы их нищему."]
      - cue: Не будь этого стихотворения, он бы не вспомнил прошлое.
        accept: ["Если бы не было этого стихотворения, он бы не вспомнил прошлое.", "Если бы не было этого стихотворения, он не вспомнил бы прошлое."]

  - id: e6
    type: open
    task: 概要写作。用俄语把四篇散文诗的内容压缩到 150 词左右，每篇写出情节或画面和结尾的思想。
    items:
      - prompt: "[Изложите кратко содержание четырёх стихотворений в прозе.]{.ru}"
        length: 130–170
        model: "В «Воробье» автор возвращается с охоты и видит, как его собака подходит к маленькому воробью, который упал из гнезда. Вдруг с дерева падает старый воробей и, дрожа от страха, защищает птенца. Собака отступает. Автор с уважением зовёт собаку и уходит и думает, что любовь сильнее смерти. В «Нищем» к автору подходит бедный старик и просит помощи. У автора ничего нет с собой, и он просто пожимает старику руку и называет его братом. Нищий благодарит и говорит, что это тоже подаяние. В произведении о розах старый, одинокий человек сидит зимой в тёмной комнате и вспоминает прошлое: девушку у окна летним вечером, весёлую семью. Свеча гаснет, все, кого он любил, умерли, а в голове звучит строка: «Как хороши, как свежи были розы…» В «Русском языке» автор говорит, что в трудные дни русский язык — его опора, и не может поверить, что такой язык дан не великому народу."
        rubric: ["四篇都写到，每篇有情节或画面", "每篇写出结尾的思想", "用第三人称或客观叙述，句子简洁", "130–170 词"]
        notes: "范文约 160 词。四篇分量大致平均，每篇两三句：一句情节，一句结尾。注意把原文的书面语换成通俗的说法：[удалился, благоговея]{.ru} 改写为 [с уважением зовёт собаку и уходит]{.ru}。"

  - id: e7
    type: open
    task: 作文。仿照屠格涅夫写一篇 250–300 词的散文诗。
    items:
      - prompt: "[Напишите своё стихотворение в прозе.]{.ru} 题目自选（例如：[Бабушкины руки]{.ru}、[Старая фотография]{.ru}、[Письмо домой]{.ru}）。用第一人称，集中写一个场景或一段回忆；可以用一个反复出现的句子（叠句）把全文分成几段；结尾用一句概括性的话或一个余音不尽的句子收束。"
        length: 250–300
        model: "Старая фотография. Вчера, разбирая старые книги, я нашёл между страницами чёрно-белую фотографию. На ней — молодая женщина в светлом платье. Она стоит у реки и смеётся. Это моя бабушка. Ей здесь двадцать лет. Она смеётся… И я вижу маленький дом в деревне, где я каждое лето жил ребёнком. Утро. В окно смотрит солнце, на столе горячие пирожки, а бабушка, уже не молодая, в простом платке, зовёт меня завтракать. Её голос тихий и ласковый. Потом мы идём к реке, к той самой реке, и она рассказывает мне, как когда-то была здесь счастлива. Я не слушаю, я бегаю за бабочками. Она смеётся… А вот другой вечер. Я уже студент, приехал на два дня. Бабушка сидит у окна, её руки лежат на коленях, и они кажутся мне очень маленькими. Она долго смотрит на меня и ничего не говорит. Я тороплюсь: завтра утром поезд, у меня столько дел… Я обещаю приехать летом. Летом я не приехал. Она смеётся… Теперь я сижу один в комнате, за окном идёт снег, а на столе передо мной лежит фотография. Девушка у реки не знает, что впереди у неё война, тяжёлая работа, дети, внуки, долгая жизнь. Она не знает, что однажды её внук будет сидеть над её фотографией и не сможет сказать ей ни слова. Она просто смеётся… Мы всегда думаем, что у нас ещё будет время. А время уходит, и остаются только фотографии."
        rubric: ["第一人称，集中写一个场景或一段回忆", "有反复出现的句子，把全文分成几段", "现在和过去交替，形成对比", "结尾有概括性的或余音不尽的句子", "250–300 词"]
        notes: "范文约 280 词，结构仿照《“玫瑰曾经多么美，多么清新……”》：现在的场景（找到照片）引出回忆；叠句 [Она смеётся…]{.ru} 出现五次，每次感情不同，最后一次变成 [Она просто смеётся…]{.ru}；回忆从童年到大学，越来越接近“现在”；结尾一句格言式的话收束全文，像《麻雀》的结尾。省略号和短句制造停顿，是散文诗的节奏手段。"
