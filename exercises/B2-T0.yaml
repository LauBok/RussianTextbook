    **Запи́ска**

    Ван Лэй!

    Мы с Ива́ном Серге́евичем сего́дня ве́чером в теа́тре и бу́дем до́ма то́лько в оди́ннадцать. А́нна у Ка́ти, она́ то́же вернётся по́здно. Суп и пирожки́ на плите́, а в холоди́льнике сала́т.

    Ми́ша вернётся в семь: сего́дня у него́ футбо́л. Пожа́луйста, прове́рь, сде́лал ли он уро́ки. Он обеща́л написа́ть упражне́ние по ру́сскому языку́.

    В во́семь позвони́т ба́бушка. Скажи́ ей, что мы позвони́м за́втра у́тром.

    И не забу́дь дать Му́рке молоко́!

    Спаси́бо!

    Мари́я Никола́евна
    :::
  why: 第 1 题，[Мы с Ива́ном Серге́евичем сего́дня ве́чером в теа́тре]{.ru}；在卡佳家的是安娜。第 2 题，[бу́дем до́ма то́лько в оди́ннадцать]{.ru}；七点是米沙回来的时间，八点是奶奶打电话的时间。第 3 题，[Суп и пирожки́ на плите́]{.ru}，冰箱里只有沙拉。第 4 题，[прове́рь, сде́лал ли он уро́ки]{.ru}（间接疑问句，第一册第 89 课）。第 5 题，[Скажи́ ей, что мы позвони́м за́втра у́тром]{.ru}。
  items:
  - stem: Сего́дня ве́чером Мари́я Никола́евна и Ива́н Серге́евич ___.
