lesson: B2-T0
heading: 入册复习测试
intro: 满分 100 分，建议用时 80 分钟。考查范围：第一册全册。答对 80% 以上可直接学习本册。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 语音与书写：根据读音规则选出正确答案。
  points: 1
  why: 第 1 题：成对的浊辅音在词末读成清辅音，[д]{.ru} 读 [т]{.ru}（第一册语音第 8 课）。第 2 题：前置词和后面的词连读，[в]{.ru} 在清辅音 [с]{.ru} 前读成 [ф]{.ru}：[в саду́]{.ru} 读作 [[фсаду́]]{.tr}（第一册语音第 8 课）。第 3 题：[ничего́]{.ru} 和 [его́]{.ru}、[-ого]{.ru} 一样，[г]{.ru} 读 [в]{.ru}（第一册第 4 课）。第 4 题：[вств]{.ru} 里的第一个 [в]{.ru} 不发音，[чу́вствовать]{.ru} 读作 [[чу́ствъвътʼ]]{.tr}，和 [здра́вствуйте]{.ru} 一样（第一册第 87 课）。第 5 题：非重读的 [о]{.ru} 在重音前第一个音节读得接近 [а]{.ru}（第一册语音第 7 课）。第 6 题：[ё]{.ru} 永远重读，[четвёртый]{.ru} 的重音在第二个音节，所以不再加重音符（第一册语音第 5 课）。
  items:
  - stem: го́род：д 读作 ___
    options:
    - д
    - т
    - з
    - 不发音
    answer: т
  - stem: в саду́：в 读作 ___
    options:
    - в
    - б
    - ф
    - 不发音
    answer: ф
  - stem: ничего́：г 读作 ___
    options:
    - г
    - к
    - х
    - в
    answer: в
  - stem: чу́вствовать：第一个 в ___
    options:
    - 不发音
    - 读 в
    - 读 ф
    - 读 б
    answer: 不发音
  - stem: Москва́：о 读得接近 ___
    options:
    - о
    - а
    - у
    - ё
    answer: а
  - stem: четвёртый：重音在第 ___ 个音节
    options:
    - 一
    - 二
    - 三
    answer: 二
- id: e2
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：[ру́чка]{.ru} 是阴性名词，物主代词用 [моя́]{.ru}（第一册第 3、8 课）。第 2 题：[на]{.ru} + 第六格表示在某个活动的场合：[на конце́рте]{.ru}（第一册第 11、12 课）。第 3 题：[знать]{.ru} 支配第四格，阳性动物名词第四格同第二格：[твоего́ бра́та]{.ru}（第一册第 22、34 课）。第 4 题：问“去哪儿”（[куда́]{.ru}），回答用 [в]{.ru} + 第四格；[в апте́ке]{.ru} 回答“在哪儿”，[из апте́ки]{.ru} 回答“从哪儿来”（第一册第 24、74 课）。第 5 题：[четы́ре]{.ru} 后面用单数第二格 [ко́мнаты]{.ru}（第一册第 35 课）。第 6 题：[наконе́ц]{.ru} 说明终于读完了，用完成体过去时 [прочита́ла]{.ru}（第一册第 42 课）。第 7 题：对米沙用 [ты]{.ru}，请他做一件具体的事，用 [дать]{.ru} 的命令式单数 [дай]{.ru}；[да́йте]{.ru} 是对 [вы]{.ru} 说的（第一册第 46 课）。第 8 题：“在几号”序数词和月份都用第二格，前面不加前置词：[пя́того января́]{.ru}（第一册第 49 课）。第 9 题：[нра́виться]{.ru} 和喜欢的东西一致，主语 [пе́сни]{.ru} 是复数，用 [нра́вятся]{.ru}（第一册第 52 课）。第 10 题：问的是 [А́нна]{.ru}，短尾形容词用阴性 [свобо́дна]{.ru}（第一册第 59 课）。第 11 题：[пе́ред]{.ru} 表示处所时要求第五格：[пе́ред до́мом]{.ru}（第一册第 66 课）。第 12 题：问从哪儿来，人用 [от]{.ru} + 第二格：[от врача́]{.ru}；[из]{.ru}、[с]{.ru} 用在地点前（第一册第 74 课）。第 13 题：后半句说明原因，用 [потому́ что]{.ru}；[поэ́тому]{.ru} 引出结果，放在原因后面（第一册第 84 课）。第 14 题：后面有 [чем]{.ru}，要用比较级；[хоро́ший]{.ru} 的比较级是不规则的 [лу́чше]{.ru}（第一册第 86 课）。第 15 题：照片是主语王磊自己的，用 [свой]{.ru}，复数第四格 [свои́]{.ru}；[его́ фотогра́фии]{.ru} 指别人的照片（第一册第 87 课）。第 16 题：[два́дцать оди́н]{.ru} 最后一个词是 [оди́н]{.ru}，“岁”用 [год]{.ru}（第一册第 35、53 课）。
  items:
  - stem: — Чья э́то ру́чка? — ___.
    options:
    - Моё
    - Мой
    - Моя́
    - Мои́
    answer: Моя́
  - stem: Вчера́ ве́чером мы бы́ли на ___.
    options:
    - конце́рт
    - конце́рте
    - конце́рта
    - конце́ртом
    answer: конце́рте
  - stem: Я хорошо́ зна́ю ___.
    options:
    - твоего́ бра́та
    - твой брат
    - твоему́ бра́ту
    - твои́м бра́том
    answer: твоего́ бра́та
  - stem: — Куда́ вы идёте? — ___.
    options:
    - В апте́ке
    - Из апте́ки
    - У апте́ки
    - В апте́ку
    answer: В апте́ку
  - stem: В на́шей кварти́ре четы́ре ___.
    options:
    - ко́мната
    - ко́мнату
    - ко́мнаты
    - ко́мнате
    answer: ко́мнаты
  - stem: Вчера́ А́нна наконе́ц ___ рома́н «Война́ и мир».
    options:
    - чита́ла
    - прочита́ла
    - чита́ет
    - прочита́ет
    answer: прочита́ла
  - stem: Ми́ша, ___ мне, пожа́луйста, хлеб.
    options:
    - да́йте
    - дашь
    - дать
    - дай
    answer: дай
  - stem: Мы пое́дем в Пеки́н ___.
    options:
    - пя́того января́
    - пя́тое января́
    - в пя́том январе́
    - в пя́тое января́
    answer: пя́того января́
  - stem: Ми́ше о́чень ___ э́ти пе́сни.
    options:
    - нра́вится
    - понра́вился
    - нра́вятся
    - нра́вилась
    answer: нра́вятся
  - stem: А́нна, ты ___ в суббо́ту?
    options:
    - свобо́ден
    - свобо́дно
    - свобо́дны
    - свобо́дна
    answer: свобо́дна
  - stem: Маши́на стои́т пе́ред ___.
    options:
    - до́мом
    - дом
    - до́ма
    - до́ме
    answer: до́мом
  - stem: — Отку́да ты идёшь? — ___ врача́.
    options:
    - Из
    - От
    - С
    - У
    answer: От
  - stem: Ван Лэй не́ был на уро́ке, ___ он был бо́лен.
    options:
    - поэ́тому
    - е́сли
    - потому́ что
    - что
    answer: потому́ что
  - stem: Сего́дня пого́да ___, чем вчера́.
    options:
    - хоро́шая
    - хорошо́
    - бо́льше
    - лу́чше
    answer: лу́чше
  - stem: Ван Лэй показа́л нам ___ фотогра́фии.
    options:
    - свои́
    - его́
    - свою́
    - своё
    answer: свои́
  - stem: Мне два́дцать оди́н ___.
    options:
    - лет
    - год
    - го́да
    - году́
    answer: год
- id: e3
  type: fill
  task: 用括号里词的正确形式填空。
  points: 1
  why: 第 1 题：[о]{.ru} + 第六格：[о Пу́шкине]{.ru}（第一册第 13 课）。第 2 题：主语 [Мари́я Никола́евна]{.ru} 是阴性，[быть]{.ru} 的过去时用 [была́]{.ru}，重音在词尾（第一册第 16 课）。第 3 题：[иска́ть]{.ru} 支配第四格，阴性物主代词第四格是 [мою́]{.ru}（第一册第 21、23 课）。第 4 题：[два]{.ru} 后面用单数第二格 [часа́]{.ru}，重音在词尾（第一册第 28 课）。第 5 题：[подари́ть]{.ru} 是完成体，变位表示将来，[ты]{.ru} 的形式是 [пода́ришь]{.ru}，重音移到词干（第一册第 51、92 课）。第 6 题：[ну́жно]{.ru} + 不定式的句子里，主体用第三格，[вы]{.ru} 的第三格是 [вам]{.ru}（第一册第 52、54 课）。第 7 题：[с]{.ru}“加上”要求第五格：[с лимо́ном]{.ru}（第一册第 61 课）。第 8 题：[ве́чером]{.ru} 要去，是一次出行，用 [пойти́]{.ru} 的将来时 [пойдём]{.ru}（第一册第 73 课）。第 9 题：[чу́вствовать себя́]{.ru} 是固定说法，[-ова-]{.ru} 在现在时变成 [-у-]{.ru}：[чу́вствуешь]{.ru}（第一册第 87 课）。第 10 题：[мы с]{.ru} + 第五格表示“我和……”，[он]{.ru} 在前置词后面加 [н-]{.ru}：[мы с ним]{.ru}（第一册第 62 课）。
  items:
  - stem: О́льга Ви́кторовна расска́зывала о ___.
    hint: Пу́шкин
    accept:
    - Пу́шкине
  - stem: Вчера́ Мари́я Никола́евна ___ до́ма.
    hint: быть
    accept:
    - была́
  - stem: Я ищу́ ___ ру́чку.
    hint: мой
    accept:
    - мою́
  - stem: Сейча́с два ___.
    hint: час
    accept:
    - часа́
  - stem: Что ты ___ ма́ме на день рожде́ния?
    hint: подари́ть
    accept:
    - пода́ришь
  - stem: ___ ну́жно бо́льше занима́ться.
    hint: вы
    accept:
    - Вам
  - stem: Я пью чай с ___.
    hint: лимо́н
    accept:
    - лимо́ном
  - stem: Ве́чером мы ___ в Большо́й теа́тр.
    hint: пойти́
    accept:
    - пойдём
  - stem: Как ты ___ себя́?
    hint: чу́вствовать
    accept:
    - чу́вствуешь
  - stem: Мы с ___ живём в одно́й ко́мнате.
    hint: он
    accept:
    - ним
- id: e4
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 2
  why: 第 1 空：[хо́лодно]{.ru} 是无人称句，过去时用中性 [бы́ло]{.ru}（第一册第 58 课）。第 2 空：需要的是 [ку́ртка и ша́пка]{.ru} 两样东西，[ну́жен]{.ru} 用复数 [нужны́]{.ru}（第一册第 55 课）。第 3 空：上个星期六去了又回来了，用不定向动词过去时 [е́здили]{.ru}；[е́хали]{.ru} 只说路上的那段时间，不能单独说明去过（第一册第 71 课）。第 4 空：[кото́рый]{.ru} 和它所指的 [ку́ртку]{.ru} 同性，在从句里作主语，用阴性第一格 [кото́рая]{.ru}（第一册第 79 课）。第 5 空：后面有 [чем]{.ru}，用比较级 [краси́вее]{.ru}（第一册第 86 课）。第 6 空：[научи́ть]{.ru} 支配第四格，[я]{.ru} 的第四格是 [меня́]{.ru}（第一册第 69 课）。第 7 空：说将来的条件用 [е́сли]{.ru}，从句用将来时 [бу́дет]{.ru}（第一册第 83 课）。第 8 空：[обяза́тельно]{.ru} 保证将来做到的一件事，用完成体将来时 [покажу́]{.ru}；[пока́зываю]{.ru} 是现在时，[показа́ла]{.ru} 是过去时（第一册第 43、44 课）。
  items:
  - options:
    - был
    - была́
    - бы́ло
    - бы́ли
    answer: бы́ло
  - options:
    - нужны́
    - ну́жен
    - нужна́
    - ну́жно
    answer: нужны́
  - options:
    - е́хали
    - е́здили
    - е́здим
    - пое́дем
    answer: е́здили
  - options:
    - кото́рый
    - кото́рое
    - кото́рые
    - кото́рая
    answer: кото́рая
  - options:
    - краси́вая
    - краси́вее
    - краси́во
    - са́мая краси́вая
    answer: краси́вее
  - options:
    - я
    - мне
    - меня́
    - мной
    answer: меня́
  - options:
    - Потому́ что
    - Поэ́тому
    - Что
    - Е́сли
    answer: Е́сли
  - options:
    - пока́зываю
    - покажу́
    - показа́ла
    - показа́ть
    answer: покажу́
  passage: |
    ::: {.prose lang="ru"}
    **Пе́рвая зима́ в Москве́**

    Я живу́ в Москве́ уже́ четы́ре ме́сяца. В декабре́ здесь (1) []{.blank} о́чень хо́лодно: ми́нус два́дцать. В То́кио зимо́й тепло́, и снача́ла я ча́сто боле́ла.

    А́нна сказа́ла: «Тебе́ (2) []{.blank} тёплая ку́ртка и ша́пка». В суббо́ту мы с ней (3) []{.blank} в торго́вый центр. Там я купи́ла ку́ртку, (4) []{.blank} мне о́чень понра́вилась. Тепе́рь я ча́сто гуля́ю в па́рке. По-мо́ему, зимо́й Москва́ (5) []{.blank}, чем о́сенью: везде́ бе́лый снег.

    В воскресе́нье я в пе́рвый раз ходи́ла на като́к. Снача́ла я пло́хо ката́лась, но Пьер научи́л (6) []{.blank}, и пото́м я ката́лась уже́ непло́хо.

    (7) []{.blank} за́втра бу́дет хоро́шая пого́да, мы пое́дем в Се́ргиев Поса́д. Я сде́лаю там мно́го фо́то и обяза́тельно (8) []{.blank} их ма́ме, когда́ верну́сь домо́й.
    :::
  passage_zh: |
    **在莫斯科的第一个冬天**

    我在莫斯科已经住了四个月了。十二月这里非常冷：零下二十度。东京冬天很暖和，所以一开始我常常生病。

    安娜说：“你需要一件暖和的外套和一顶帽子。”星期六我和她去了购物中心。我在那里买了一件外套，我非常喜欢。现在我常去公园散步。我觉得莫斯科冬天比秋天美：到处都是白雪。

    星期天我第一次去了溜冰场。开始我滑得不好，可皮埃尔教会了我，后来我就滑得挺不错了。

    如果明天天气好，我们就去谢尔吉耶夫镇。我要在那儿拍很多照片，回家的时候一定给妈妈看。
- id: e5a
  type: choice
  task: 阅读理解（一）：阅读下面的记叙文，根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose lang="ru"}
    **Ша́хматы**

    Ко́стя хорошо́ игра́ет в ша́хматы. Он занима́ется в ша́хматном клу́бе уже́ три го́да, и в кла́ссе никто́ не мо́жет вы́играть у него́.

    Одна́жды ве́чером де́душка спроси́л: «Ко́стя, хо́чешь сыгра́ть со мной?» Ко́стя засмея́лся: «Коне́чно! Но ты проигра́ешь».

    Они́ игра́ли весь ве́чер. И де́душка вы́играл! Ко́стя до́лго смотре́л на до́ску и ничего́ не говори́л. Пото́м он спроси́л: «Кто тебя́ научи́л так игра́ть?» — «Мой оте́ц, — отве́тил де́душка. — Когда́ я был ма́льчиком, мы ча́сто игра́ли ве́чером».

    По́сле э́того Ко́стя це́лую неде́лю занима́лся ша́хматами ка́ждый день. В суббо́ту они́ сыгра́ли ещё раз, и тепе́рь вы́играл Ко́стя. «Вот ви́дишь, — сказа́л де́душка, — тепе́рь и мне на́до мно́го занима́ться!»
    :::
  why: 第 1 题，[Он занима́ется в ша́хматном клу́бе уже́ три го́да]{.ru}。第 2 题，第一次下棋 [И де́душка вы́играл!]{.ru}，科斯佳原以为爷爷会输。第 3 题，爷爷回答 [Мой оте́ц]{.ru}，小时候他常和父亲下棋。第 4 题，[По́сле э́того Ко́стя це́лую неде́лю занима́лся ша́хматами ка́ждый день]{.ru}（[занима́ться]{.ru} + 第五格，第一册第 63 课）。第 5 题，[В суббо́ту они́ сыгра́ли ещё раз, и тепе́рь вы́играл Ко́стя]{.ru}。
  items:
  - stem: Ко́стя занима́ется в ша́хматном клу́бе ___.
    options:
    - два го́да
    - три го́да
    - четы́ре го́да
    - пять лет
    answer: три го́да
  - stem: В пе́рвый раз вы́играл ___.
    options:
    - Ко́стя
    - оте́ц де́душки
    - де́душка
    - никто́
    answer: де́душка
  - stem: Игра́ть в ша́хматы де́душку научи́л ___.
    options:
    - его́ оте́ц
    - Ко́стя
    - учи́тель в шко́ле
    - его́ брат
    answer: его́ оте́ц
  - stem: По́сле пе́рвой игры́ Ко́стя ___.
    options:
    - бо́льше не игра́л
    - засмея́лся
    - ничего́ не де́лал
    - це́лую неде́лю занима́лся ша́хматами
    answer: це́лую неде́лю занима́лся ша́хматами
  - stem: В суббо́ту ___.
    options:
    - де́душка сно́ва вы́играл
    - вы́играл Ко́стя
    - они́ не игра́ли
    - Ко́стя игра́л в клу́бе
    answer: вы́играл Ко́стя
  passage_zh: |
    **国际象棋**

    科斯佳国际象棋下得很好。他在象棋俱乐部已经练了三年，班上谁也赢不了他。

    一天晚上，爷爷问：“科斯佳，想和我下一盘吗？”科斯佳笑了：“当然！不过你会输的。”

    他们下了一整个晚上。结果爷爷赢了！科斯佳盯着棋盘看了很久，一句话也没说。后来他问：“谁教你下得这么好的？”“我父亲，”爷爷回答，“我小时候，我们晚上常常一起下棋。”

    从那以后，科斯佳整整一个星期每天都练棋。星期六他们又下了一盘，这次赢的是科斯佳。“你看，”爷爷说，“现在该我好好练练了！”
- id: e5b
