  passage_zh: |
    **留言条**

    王磊：

    我和伊万·谢尔盖耶维奇今天晚上去剧院，十一点才能到家。安娜在卡佳家，她也会很晚回来。汤和馅饼在炉子上，冰箱里有沙拉。

    米沙七点回来：今天他有足球训练。请你检查一下他的功课做完了没有。他答应要把俄语练习写完。

    八点奶奶会打电话来。请告诉她，我们明天早上给她打电话。

