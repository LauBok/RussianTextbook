- id: e7
  type: open
  task: 写作。
  points: 20
  items:
  - prompt: 以“我的寒假”为题写一篇短文，80–100 词。内容包括：假期在哪里过、和谁在一起；做了哪些事（至少三件）；哪一天最有意思（写出日期）。至少用到第三格、第五格各一次，运动动词的过去时，过去时的两种体。
    length: 80–100
    model: |
      **Мои́ зи́мние кани́кулы**

      В кани́кулы я жил до́ма, в Шанха́е. Ка́ждое у́тро я до́лго спал, а пото́м гуля́л с соба́кой. На Пра́здник весны́ мы е́здили к ба́бушке и де́душке. Ба́бушка пригото́вила о́чень вку́сный у́жин, а я подари́л ей шёлковый плато́к из Москвы́. Ещё я ходи́л с дру́гом в кино́ и чита́л ру́сские кни́ги.

      Са́мый интере́сный день был деся́того февраля́. В э́тот день мы с па́пой е́здили на мо́ре. Бы́ло хо́лодно, но о́чень краси́во.

      Тепе́рь я опя́ть в Москве́, но ча́сто ду́маю о до́ме.
    rubric:
    - 内容 7 分：在哪里、和谁一起（1 分）；做的三件事（各 1 分）；最有意思的一天和日期（3 分，没写日期的给 2 分）
    - 语法 7 分：要求的四项（第三格、第五格、运动动词过去时、两种体的过去时）各 1 分；其余 3 分看全文语法错误，每两处错误扣 1 分
    - 词汇 3 分：用词准确、有变化给 3 分；用词单调或有三处以上用词不当的，酌情扣 1–2 分
    - 结构 3 分：有题目（1 分），分段清楚、句子之间衔接通顺（2 分）
    - 字数少于 60 词的，内容分最多给 4 分
    notes: 范文约 90 词，分三段：假期的一般情况、最有意思的一天、结尾。语法上：[подари́л ей]{.ru} 用第三格（第一册第 51、92 课），[к ба́бушке и де́душке]{.ru} 是 [к]{.ru} + 第三格（第一册第 57 课）；[с соба́кой]{.ru}、[с дру́гом]{.ru}、[мы с па́пой]{.ru} 用第五格（第一册第 61、62 课）；[е́здили, ходи́л]{.ru} 是不定向动词过去时，表示去过又回来了（第一册第 71 课）；[до́лго спал, гуля́л, чита́л]{.ru} 说经常的或持续的动作，用未完成体，[пригото́вила, подари́л]{.ru} 说一次做成的事，用完成体（第一册第 42、45 课）；[деся́того февраля́]{.ru} 是日期的第二格（第一册第 49 课）；[Са́мый интере́сный день]{.ru} 是最高级（第一册第 89 课）。句子可以短，但每句都要检查名词的格和动词的体。
