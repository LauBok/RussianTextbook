lesson: B4-L08
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第一单元七篇短篇小说的文体与修辞：称呼与语体、动词体与叙事节奏、短句与紧张感、书信体与抒情、声音的描写、比喻与色彩词、讽刺与仿拟；后四题以契诃夫的《变色龙》为测试选文。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看解析里注明的那一课；第 2 题回看测试选文和注释；第 3 题回看第 1、2、7 课；第 4 题回看本课“分析一篇短篇小说的步骤”和第 1、7 课的文体与修辞；第 5 题回看第 1 课的概要写作，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 选择正确答案。
    why: "第 1 题（第 1 课）：[-с]{.ru} 是 [сударь]{.ru} 的缩略，加在词尾表示对对方恭敬，瘦子用得越多越显得卑躬屈膝；它不表示亲热，也不表示惊讶。第 2 题（第 2 课）：完成体过去时表示一个个已经完成的动作，排在一起就是一连串接连发生的事；持续的背景和反复的动作要用未完成体。第 3 题（第 3 课）：孩子在横桁上的那一刻是全篇最危险的地方，托尔斯泰在这里用最短的句子，三个完成体动词连在一起，没有任何修饰；长句用在甲板上热闹的场面。第 4 题（第 4 课）：报纸上的死讯用的是公文语体：名词化，复合前置词 [по причине]{.ru}、[ввиду того что]{.ru}，短尾被动形动词 [установлена]{.ru}，不带任何感情；抒情的是热尔特科夫的信，口语是丈夫的话。第 5 题（第 5 课）：[яркие камешки]{.ru}“明亮的小石子”是看得见的东西，作者用视觉的词写听觉，这叫通感。第 6 题（第 6 课）：店主像“摆好架势的猎狗”，这个比喻把人写得滑稽可笑，是幽默；写格雷时比喻才是抒情的，科学的说明里不用这样的比喻。第 7 题（第 7 课）：用 [мобилизация]{.ru}、[удар]{.ru}、[борьба]{.ru} 这些战争和政治的大词写买衣服，是大词小用，属于仿拟；词语越庄重，事情越可笑，作者是在讽刺埃洛奇卡，并不是夸她勇敢。第 8 题（第 1 课）：结尾的 [Все трое были приятно ошеломлены]{.ru} 重复开头的 [Оба были приятно ошеломлены]{.ru}，这是首尾呼应；字面相近，意思已经变了。"
    items:
      - stem: "В рассказе «Толстый и тонкий» частица «-с» в речи тонкого показывает ___."
        options: [особое уважение к собеседнику, близкие отношения, удивление говорящего]
        answer: особое уважение к собеседнику
      - stem: "«Лицо его поморщилось… дыхание остановилось…» Глаголы совершенного вида здесь показывают ___."
        options: ["действия, которые быстро следуют одно за другим", "фон, долгое состояние героя", "действия, которые повторяются каждый день"]
        answer: "действия, которые быстро следуют одно за другим"
      - stem: "В рассказе «Прыжок» самые короткие предложения автор использует ___."
        options: [в самый опасный момент, когда описывает весёлую игру на палубе, в начале рассказа]
        answer: в самый опасный момент
      - stem: "Сообщение о смерти Желткова в «Гранатовом браслете» написано ___."
        options: [официально-деловым стилем, языком письма Желткова, разговорным языком]
        answer: официально-деловым стилем
      - stem: "«Эти звуки падали в комнату, подобно ярким и звонким камешкам…» Здесь звуки описаны словами, которые обычно говорят о ___."
        options: ["том, что видят глазами", "том, что слышат ушами", людях и их чувствах]
        answer: "том, что видят глазами"
      - stem: "Хозяин лавки в «Алых парусах» ждёт Грэя, как охотничья собака. Это сравнение ___."
        options: [смешное, грустное, научное]
        answer: смешное
      - stem: "В «Двенадцати стульях» о покупке платья авторы пишут словами войны и политики («борьба», «враг», «удар»). Так они ___."
        options: [смеются над героиней, "показывают, что героиня смелая", рассказывают о настоящей войне]
        answer: смеются над героиней
      - stem: "Фраза в конце «Толстого и тонкого» «Все трое были приятно ошеломлены» ___."
        options: [повторяет фразу из начала рассказа и меняет её смысл, впервые появляется в рассказе, "говорит только о толстом"]
        answer: повторяет фразу из начала рассказа и меняет её смысл

  - id: e2
    type: open
    task: 测试选文理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Что случилось на базарной площади? Сколько раз Очумелов меняет своё мнение о собаке и о Хрюкине? От чего зависит его мнение? Что он делает со своим пальто и почему? Чем кончается рассказ?]{.ru}"
        length: 100–140
        model: "Собака укусила за палец золотых дел мастера Хрюкина, собралась толпа, и к ней подошёл полицейский надзиратель Очумелов. Сначала он строго говорит, что хозяина собаки нужно наказать, а собаку истребить. Но когда кто-то говорит, что это собака генерала Жигалова, Очумелов сразу обвиняет Хрюкина: тот, наверное, сам поранил палец. Городовой говорит, что у генерала таких собак нет, — и Очумелов снова говорит, что собака плохая, и жалеет Хрюкина. Потом снова слышит, что собака генеральская, и снова кричит на Хрюкина. Повар говорит, что собака не генеральская, и Очумелов требует истребить её. Но оказывается, что это собака брата генерала, и Очумелов радуется. Всего он меняет мнение пять раз, и его мнение зависит только от того, чья это собака. Он то снимает, то надевает пальто: ему то жарко, то холодно от волнения и страха. В конце Прохор забирает собаку, толпа смеётся над Хрюкиным, а Очумелов грозит ему и идёт дальше."
        rubric: ["说出事件：狗咬了赫留金的手指，警官来处理", "说出五次转变和每次转变的原因（狗是不是将军家的）", "说明脱大衣、穿大衣的原因：不是天气，而是紧张和害怕", "说出结尾：狗被带走，众人嘲笑赫留金，警官威胁他"]
        notes: "关键是看清转变的“开关”：每次转变前都有一个人说出狗的主人（人群、巡警、厨子），奥丘梅洛夫的态度只随这句话变。大衣是转变的外在标志：听说是将军的狗就“热”，听说不是就“冷”——借口是天气，读者却看得出是心理。"

  - id: e3
    type: choice
    task: 下面各题都是关于《变色龙》的写法，选择正确答案。
    why: "第 1 题：[Пора обратить внимание на подобных господ, не желающих подчиняться постановлениям]{.ru} 用形动词短语和公文词 [постановление]{.ru}，是官腔，表现警官的身份和架子，和第 4 课的报纸消息一样是公文语体。第 2 题：[Сними-ка… с меня пальто… Ужас как жарко!]{.ru} 和后面的 [Надень-ка… на меня пальто… Знобит…]{.ru} 前后对应，大衣成了态度转变的标志；作者不说警官害怕，只写他的动作，读者自己明白（第 1 课瘦子的身体“缩小”、第 3 课的“不说”）。第 3 题：[Да разве братец ихний приехали?]{.ru} 用复数动词和指小表爱的 [братец]{.ru} 称呼一个不在场的人，是称呼语体的转变，和第 1 课瘦子改用 [вы]{.ru}、[ваше превосходительство]{.ru} 是一回事。第 4 题：同一条狗先是 [подлость одна только]{.ru}，后来是 [нежная тварь]{.ru}、[Шустрая такая]{.ru}，评价的词前后对立，这是对照：狗没有变，变的是警官以为的主人。作者不加评论，讽刺就在对照里。第 5 题：叙述者说 [вышеписанный человек]{.ru}、[виновник скандала]{.ru}，把公文词用在一条小狗和一场小乱子上，是大词小用，和第 7 课的仿拟同一种手法。第 6 题：叙述用的是现在时（[идёт, шагает, слышит, глядит]{.ru}），事情像在读者眼前发生，接近剧本的舞台说明；小说在杂志上发表时的副标题正是 [Сценка]{.ru}“场景”。"
    items:
      - stem: "«Пора обратить внимание на подобных господ, не желающих подчиняться постановлениям!» — это ___."
        options: [официальный стиль в устной речи надзирателя, язык поэзии, разговорная речь Хрюкина]
        answer: официальный стиль в устной речи надзирателя
      - stem: "Очумелов то снимает, то надевает пальто. Автор так показывает ___."
        options: ["его страх и то, как меняется его мнение", "что погода меняется", его новую шинель]
        answer: "его страх и то, как меняется его мнение"
      - stem: "«Да разве братец ихний приехали?» Глагол во множественном числе показывает ___."
        options: [уважение к брату генерала, что приехали несколько братьев, ошибку автора]
        answer: уважение к брату генерала
      - stem: "Сначала собака — «подлость одна только», потом — «нежная тварь». Так автор показывает, что ___."
        options: [мнение Очумелова зависит от хозяина собаки, собака за это время изменилась, Очумелов очень любит собак]
        answer: мнение Очумелова зависит от хозяина собаки
      - stem: "Автор называет Хрюкина «вышеписанный человек», а щенка — «виновник скандала». Эти слова ___."
        options: [из официального языка и звучат смешно, из языка поэзии, из разговорной речи толпы]
        answer: из официального языка и звучат смешно
      - stem: "Рассказ написан в настоящем времени (идёт, шагает, слышит), поэтому он похож на ___."
        options: [сцену в театре, письмо, научную статью]
        answer: сцену в театре

  - id: e4
    type: open
    task: 文体分析。用俄语写一段 150—200 词的分析：《变色龙》里奥丘梅洛夫怎样说话？他的语言怎样随着狗的主人变化？作者用了哪些手段制造讽刺？引用选文里的例子，可以和本单元学过的篇目比较。
    items:
      - prompt: "[Как говорит Очумелов и как меняется его речь? Какие приёмы создают иронию в рассказе «Хамелеон»? Сравните с рассказом «Толстый и тонкий».]{.ru}"
        length: 150–200
        model: "В рассказе «Хамелеон» Чехов почти ничего не говорит о героях прямо: смешными их делает их собственная речь. Когда Очумелов думает, что собака бродячая, он говорит как начальник, строгим официальным языком: «Пора обратить внимание на подобных господ, не желающих подчиняться постановлениям!», «составляй протокол». Тут же он переходит на грубые слова: «болван», «чёрт знает что». Но как только он слышит имя генерала, его речь меняется. Собака из «подлости» становится «нежной тварью», а потом «собачкой». О брате генерала он говорит во множественном числе, как слуга: «Да разве братец ихний приехали?» Это похоже на тонкого, который вдруг начинает говорить другу «вы» и «ваше превосходительство». Главный приём рассказа — повторение. Пять раз Очумелов меняет мнение, и каждый раз этому соответствует пальто: ему то жарко, то холодно. Автор не объясняет, что надзиратель боится генерала, читатель понимает это сам. Иронию создаёт и язык рассказчика: о щенке и пальце он пишет официальными словами — «виновник скандала», «вышеписанный человек». Название рассказа говорит главное: Очумелов меняет цвет, как хамелеон."
        rubric: ["150–200 词", "指出警官的两种说话方式：官腔、粗话 / 恭敬、指小表爱", "至少引用三处选文原话作例子", "指出至少两种手段（称呼和语体的转变、重复与对照、用动作代替心理描写、公文词大词小用、标题的隐喻）", "和《胖子和瘦子》或本单元其他篇目作比较", "结论点明标题的意思"]
        notes: "范文约 190 词。结构：一句总起（作者不直接评价，靠人物的话制造讽刺）；警官的两种语言，各举例子；和瘦子比较；重复与对照（五次转变、大衣）；叙述者的公文词；标题收尾。写文体分析的公式是“手段——例子——效果”，例子要用引号照抄原文。"

  - id: e5
    type: open
    task: 概要写作。用俄语把《变色龙》压缩成 150 词左右的概要，用第三人称、现在时或过去时叙述。
    items:
      - prompt: "[Напишите краткое изложение рассказа «Хамелеон».]{.ru}"
        length: 130–170
        model: "Полицейский надзиратель Очумелов идёт через пустую базарную площадь и вдруг слышит крики. Собака укусила за палец золотых дел мастера Хрюкина, вокруг собирается толпа. Хрюкин показывает палец и требует, чтобы ему заплатили. Очумелов строго обещает наказать хозяина собаки, а собаку истребить. Но кто-то говорит, что это собака генерала Жигалова. Очумелов сразу меняет мнение: ему становится жарко, он снимает пальто и говорит, что Хрюкин сам поранил палец, чтобы получить деньги. Городовой замечает, что у генерала таких собак нет, и Очумелов снова говорит, что собака плохая. Потом городовой говорит, что собака, может быть, генеральская. Очумелову становится холодно, он надевает пальто и велит отвести собаку к генералу. Генеральский повар Прохор говорит, что собака не их, и Очумелов велит её истребить. Но оказывается, что это собака брата генерала. Очумелов радуется и хвалит собачку. Прохор забирает её, толпа смеётся над Хрюкиным, а надзиратель грозит ему и идёт дальше."
        rubric: ["130–170 词", "交代地点、人物和事件起因", "按顺序写出警官的每一次转变和原因", "写出大衣这个细节", "写出结尾", "不照抄原文的对话，不加评论"]
        notes: "范文约 160 词。原文几乎全是对话，概要要把对话改成叙述：[Очумелов говорит, что…]{.ru}、[приказывает…]{.ru}、[велит…]{.ru}。五次转变都要写到，每次都要交代“谁说了什么——警官怎样变”，否则看不出小说的结构。省去咬人前的追逐细节和赫留金、巡警的争吵。"
