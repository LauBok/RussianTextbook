lesson: B4-L08
heading: 单元测试
intro: 答对 80% 以上进入下一单元。本测试覆盖第一单元七篇短篇小说的文体与修辞：称呼与语体、动词体与叙事节奏、短句与紧张感、书信体与抒情、声音的描写、比喻与色彩词、讽刺与仿拟；后四题以契诃夫的《凶犯》为测试选文。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看解析里注明的那一课；第 2 题回看测试选文和注释；第 3 题回看第 1、2、7 课；第 4 题回看本课“分析一篇短篇小说的步骤”和第 1、7 课的文体与修辞；第 5 题回看第 1 课的概要写作，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 选择正确答案。
    why: "第 1 题（第 1 课）：[-с]{.ru} 是 [сударь]{.ru} 的缩略，加在词尾表示对对方恭敬，瘦子用得越多越显得卑躬屈膝；它不表示亲热，也不表示惊讶。第 2 题（第 2 课）：完成体过去时表示一个个已经完成的动作，排在一起就是一连串接连发生的事；持续的背景和反复的动作要用未完成体。第 3 题（第 3 课）：孩子在横桁上的那一刻是全篇最危险的地方，托尔斯泰在这里用最短的句子，三个完成体动词连在一起，没有任何修饰；长句用在甲板上热闹的场面。第 4 题（第 4 课）：报纸上的死讯用的是公文语体：名词化，复合前置词 [по причине]{.ru}、[ввиду того что]{.ru}，短尾被动形动词 [установлена]{.ru}，不带任何感情；抒情的是热尔特科夫的信，口语是丈夫的话。第 5 题（第 5 课）：[яркие камешки]{.ru}“明亮的小石子”是看得见的东西，作者用视觉的词写听觉，这叫通感。第 6 题（第 6 课）：店主像“摆好架势的猎狗”，这个比喻把人写得滑稽可笑，是幽默；写格雷时比喻才是抒情的，科学的说明里不用这样的比喻。第 7 题（第 7 课）：用 [мобилизация]{.ru}、[удар]{.ru}、[борьба]{.ru} 这些战争和政治的大词写买衣服，是大词小用，属于仿拟；词语越庄重，事情越可笑，作者是在讽刺埃洛奇卡，并不是夸她勇敢。第 8 题（第 1 课）：结尾的 [Все трое были приятно ошеломлены]{.ru} 重复开头的 [Оба были приятно ошеломлены]{.ru}，这是首尾呼应；字面相近，意思已经变了。"
    items:
      - stem: "В рассказе «Толстый и тонкий» частица «-с» в речи тонкого показывает ___."
        options: [особое уважение к собеседнику, близкие отношения, удивление говорящего]
        answer: особое уважение к собеседнику
      - stem: "«Лицо его поморщилось… дыхание остановилось…» Глаголы совершенного вида здесь показывают ___."
        options: ["действия, которые быстро следуют одно за другим", "фон, долгое состояние героя", "действия, которые повторяются каждый день"]
        answer: "действия, которые быстро следуют одно за другим"
      - stem: "В рассказе «Прыжок» самые короткие предложения автор использует ___."
        options: [в самый опасный момент, когда рассказывает о весёлой игре на палубе, в начале рассказа]
        answer: в самый опасный момент
      - stem: "Сообщение о смерти Желткова в «Гранатовом браслете» написано ___."
        options: [официально-деловым стилем, языком письма Желткова, разговорным языком]
        answer: официально-деловым стилем
      - stem: "«Эти звуки падали в комнату, подобно ярким и звонким камешкам…» Здесь звуки описаны словами, которые обычно говорят о ___."
        options: ["том, что видят глазами", "том, что слышат ушами", людях и их чувствах]
        answer: "том, что видят глазами"
      - stem: "Хозяин лавки в «Алых парусах» ждёт Грэя, как охотничья собака. Это сравнение ___."
        options: [смешное, грустное, научное]
        answer: смешное
      - stem: "В «Двенадцати стульях» о покупке платья авторы пишут словами войны и политики («борьба», «враг», «удар»). Так они ___."
        options: [смеются над героиней, "показывают, что героиня смелая", рассказывают о настоящей войне]
        answer: смеются над героиней
      - stem: "Фраза в конце «Толстого и тонкого» «Все трое были приятно ошеломлены» ___."
        options: [повторяет фразу из начала рассказа и меняет её смысл, впервые появляется в рассказе, "говорит только о толстом"]
        answer: повторяет фразу из начала рассказа и меняет её смысл

  - id: e2
    type: open
    task: 测试选文理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Почему Дениса Григорьева привели к следователю? Зачем, по его словам, он отвинтил гайку? Почему следователь ему не верит? Понимает ли Денис, в чём его обвиняют? Чем кончается рассказ?]{.ru}"
        length: 100–140
        model: "Железнодорожный сторож поймал крестьянина Дениса Григорьева, когда тот отвинчивал гайку на железной дороге, и его привели к следователю. Денис спокойно объясняет, что крестьяне в его деревне делают из гаек грузила для рыбалки: без грузила рыбу не поймать. Следователь думает, что Денис только прикидывается глупым. Он объясняет, что без гаек поезд может сойти с рельсов и люди погибнут, и даже читает статью закона. Но Денис его не понимает. Он уверен, что одна гайка ничего не значит, ведь они всей деревней отвинчивают гайки много лет. Когда следователь говорит, что арестует его, Денис удивляется: ему надо на ярмарку. Он думает, что его наказывают за долги брата. Солдаты ведут Дениса из комнаты, а он всё говорит о своём и просит судить по совести."
        rubric: ["说出事件：拧螺帽被看守人抓住，带到预审官面前", "说出杰尼斯的理由：做鱼线坠子", "说出两人互相不理解：预审官以为他装傻，杰尼斯不明白危险", "说出结尾：收押，杰尼斯以为是因为欠税，被带走时还在嘟囔"]
        notes: "范文约 119 词。回答的关键是“误解”：预审官认为杰尼斯装傻，杰尼斯认为预审官小题大做；到最后他还以为自己是因为哥哥欠税被抓的。答题时把对话改成叙述：[Денис объясняет, что…]{.ru}、[Следователь думает, что…]{.ru}。"

  - id: e3
    type: choice
    task: 下面各题都是关于《凶犯》的写法，选择正确答案。
    why: "第 1 题：[Седьмого числа сего июля… застал тебя за отвинчиванием гайки, коей рельсы прикрепляются к шпалам]{.ru} 用了旧公文词 [сей]{.ru}、[коей]{.ru} 和动名词 [отвинчивание]{.ru}，是预审官的公文语体，和第 4 课的报纸消息一样；对一个不识字的庄稼汉这样说话，他当然听不懂。第 2 题：[чаво, знамо, нешто, ежели, тогды, идтить]{.ru} 都是俗语和方言，表明杰尼斯是没受过教育的庄稼人；两个人说的几乎是两种语言。第 3 题：[ваше благородие]{.ru}、[господин хороший]{.ru}、[Что вы-с!]{.ru} 都是下人对老爷的恭敬说法，和第 1 课瘦子的 [-с]{.ru} 一样；预审官却一直对他说 [ты]{.ru}，称呼不对称，地位也不对称。第 4 题：小说几乎全是对话，对话之间只有几句现在时的简短说明（[хрипит Денис]{.ru}、[Денис зевает и крестит рот]{.ru}），像剧本的舞台说明；发表时的副标题正是 [Сценка]{.ru}“场景”。第 5 题：和第 2 课《一个官员的死》一样，两个人始终说不到一起，结局对“小人物”是一场灾难；这里倒过来，是上司不听下人解释。第 6 题：[злоумышленник]{.ru} 是“蓄意作案的人”，可杰尼斯根本没有恶意，他连危险都不明白，标题是反语。第 7 题：结尾 [Нас три брата]{.ru} 说了两遍，杰尼斯被带走时还在想着欠税的事，重复说明他直到最后也不明白自己为什么被抓。"
    items:
      - stem: "«Седьмого числа сего июля… застал тебя за отвинчиванием гайки, коей рельсы прикрепляются к шпалам» — это ___."
        options: [официальный язык следователя, разговорная речь Дениса, язык поэзии]
        answer: официальный язык следователя
      - stem: "Слова «чаво», «знамо», «нешто», «ежели» показывают, что Денис ___."
        options: [простой крестьянин, хорошо образованный человек, чиновник]
        answer: простой крестьянин
      - stem: "Денис говорит следователю «ваше благородие» и «Что вы-с!», а следователь говорит ему «ты». Это показывает, что ___."
        options: [они занимают разное положение в обществе, они старые друзья, Денис смеётся над следователем]
        answer: они занимают разное положение в обществе
      - stem: "Почти весь рассказ — разговор героев, а между их словами есть только короткие фразы в настоящем времени. Поэтому рассказ похож на ___."
        options: [сцену из пьесы, письмо, статью в газете]
        answer: сцену из пьесы
      - stem: "Как и в «Смерти чиновника», герои рассказа ___."
        options: ["не понимают друг друга, и это кончается бедой для маленького человека", "понимают друг друга, и всё кончается хорошо", "говорят только о погоде"]
        answer: "не понимают друг друга, и это кончается бедой для маленького человека"
      - stem: "Название «Злоумышленник» — это ирония, потому что ___."
        options: [Денис не хотел никому зла, Денис хотел убить людей, так называли всех крестьян]
        answer: Денис не хотел никому зла
      - stem: "Слова «Нас три брата» Денис повторяет и тогда, когда солдаты ведут его из комнаты. Этот повтор показывает, что Денис ___."
        options: ["так и не понял, за что его наказывают", "всё понял и согласен со следователем", хочет позвать братьев на помощь]
        answer: "так и не понял, за что его наказывают"

  - id: e4
    type: open
    task: 文体分析。用俄语写一段 150—200 词的分析：《凶犯》里预审官和杰尼斯怎样说话？两种语言怎样造成误解？作者用了哪些手段制造讽刺？引用选文里的例子，可以和本单元学过的篇目比较。
    items:
      - prompt: "[Как говорят следователь и Денис? Почему они не понимают друг друга? Какие приёмы создают иронию в рассказе «Злоумышленник»? Сравните с другими рассказами Чехова из этого раздела.]{.ru}"
        length: 150–200
        model: "В рассказе «Злоумышленник» Чехов почти ничего не говорит о героях прямо: всё мы узнаём из их речи. Следователь говорит официальным языком. Уже первая его фраза похожа на официальный документ: «Седьмого числа сего июля… застал тебя за отвинчиванием гайки, коей рельсы прикрепляются к шпалам». Позже он читает Денису статью закона, длинную и тяжёлую. Денис отвечает на простом языке крестьянина: «Чаво?», «знамо», «нешто», «ежели». Поэтому они говорят как будто на разных языках. Следователь думает, что Денис прикидывается, а Денис спокойно рассказывает о рыбалке и грузилах. Обращения тоже показывают, кто здесь начальник: Денис говорит «ваше благородие» и даже «Что вы-с!», как тонкий в рассказе «Толстый и тонкий», а следователь говорит ему «ты». Как и в «Смерти чиновника», герои не понимают друг друга, и это кончается бедой. Иронию создаёт и название: злоумышленником называют человека, у которого не было никакого злого умысла. Повтор «Нас три брата» в конце показывает, что Денис так и не понял, за что его арестовали. Автор никого не обвиняет, и поэтому смешной рассказ становится грустным."
        rubric: ["150–200 词", "指出两种语言：预审官的公文语体（法律条文）、杰尼斯的俗语方言", "至少引用三处选文原话作例子", "指出至少两种手段（称呼不对称、两种语体造成误解、对话体和现在时、反语标题、重复）", "和《胖子和瘦子》《一个官员的死》或本单元其他篇目作比较", "结论点明作者不直接评价，笑中有悲"]
        notes: "范文约 164 词。结构：一句总起（作者不直接评价，靠人物的话说明一切）；预审官的公文语体和杰尼斯的方言，各举例子；误解；称呼与地位，和瘦子比较；和《一个官员的死》比较；标题的反语和结尾的重复；结论。写文体分析的公式是“手段——例子——效果”，例子要用引号照抄原文。"

  - id: e5
    type: open
    task: 概要写作。用俄语把《凶犯》压缩成 150 词左右的概要，用第三人称、现在时或过去时叙述。
    items:
      - prompt: "[Напишите краткое изложение рассказа «Злоумышленник».]{.ru}"
        length: 130–170
        model: "Перед следователем стоит маленький крестьянин Денис Григорьев. Железнодорожный сторож поймал его, когда он отвинчивал гайку, которой рельсы прикрепляются к шпалам. Следователь спрашивает, зачем ему гайка. Денис спокойно объясняет, что крестьяне делают из гаек грузила для рыбалки, и долго рассказывает о разной рыбе. Следователь думает, что Денис прикидывается глупым. Он говорит, что без гаек поезд может сойти с рельсов и люди погибнут. Денис не верит: он считает, что одна гайка ничего не значит, ведь вся деревня отвинчивает гайки уже много лет, и они всегда оставляют несколько. Тогда следователь вспоминает, что в прошлом году здесь сошёл с рельсов поезд, и читает Денису статью закона. Денис отвечает, что люди они тёмные и ничего не понимают. Следователь решает арестовать его. Денис удивляется: ему надо на ярмарку, а арестовать его, как он думает, хотят за долги брата. Солдаты ведут его из комнаты, а он всё просит судить по совести."
        rubric: ["130–170 词", "交代人物和事件起因", "写出杰尼斯的理由和预审官的反应", "写出两人互相不理解", "写出结尾", "不照抄原文的对话，不加评论"]
        notes: "范文约 144 词。原文几乎全是对话，概要要把对话改成叙述：[Денис объясняет, что…]{.ru}、[Следователь думает, что…]{.ru}、[решает…]{.ru}。关于鱼和坠子的长篇大论只用一句话概括；法律条文不必转述内容，说“读了一条法律”即可。"
