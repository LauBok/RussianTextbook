    **茶炊**

    茶炊是俄罗斯生活的象征之一。它的名字本身就说明了它的构造：茶炊“自己煮”，也就是自己把水烧热。茶炊中间有一个又窄又高的部分，里面放烧红的炭。周围的水很快就热了，而且能热很久。茶炊上面放一把小茶壶，里面是很浓的茶。往杯子里倒茶时，先从茶壶里倒一点浓茶，再兑上茶炊里的热水。

    最早的茶炊十八世纪出现在俄罗斯。制作茶炊的主要中心是图拉——那里很早就有许多手艺高超的工匠。据说 1778 年这里开了最早的茶炊作坊之一。到十九世纪中叶，图拉已经有将近三十家这样的工厂，每年生产十万多个茶炊。俗语“到图拉别带自己的茶炊”就是从这里来的：说的是有人把东西带到本来就有很多这种东西的地方去。

    茶炊的样子五花八门：有能倒两三杯的小茶炊，也有放在小酒馆和火车站里、一次能让几十个人喝上茶的大茶炊。贵重的茶炊饰有花纹，在家里由父母传给子女。

    二十世纪出现了用电的茶炊。它们用起来更方便，可是很多人认为，用炭烧的真正的茶炊泡出来的茶更好喝。如今图拉有一座茶炊博物馆。馆里收藏着各个时代的茶炊——从最小的，到大得让人很难走近的。
