    ::: {.prose lang="ru"}
    **Один день без телефона**

    Недавно в одной московской школе провели опыт: ученики девятого класса согласились целую неделю каждый день по три часа не пользоваться телефоном. Результаты оказались неожиданными и для учителей, и для самих ребят. Многие признались, что в первый день не знали, чем заняться. Зато к концу недели почти все стали больше читать, гулять и разговаривать с родителями.

    Этот опыт заставляет задуматься. Сегодня телефон стал для нас всем: будильником, картой, библиотекой, магазином. Жить совсем без него, конечно, невозможно, да и не нужно. Но можем ли мы прожить без него хотя бы несколько часов?

    Одни считают, что ничего страшного в телефоне нет. По их мнению, современный человек просто живёт иначе: он получает информацию быстрее, чем его родители, и общается с друзьями, которые живут в других городах и странах. Бороться с телефоном — значит жить в прошлом веке.

    Другие уверены, что за то, что жить стало удобнее, мы платим слишком дорого. Врачи говорят, что люди, проводящие с телефоном больше пяти часов в день, хуже спят и быстрее устают. Учителя замечают, что школьникам всё труднее читать длинные тексты: привыкнув к коротким сообщениям, они теряют внимание уже на второй странице.

    На мой взгляд, правы и те и другие. Телефон — это всего лишь средство, и всё зависит от того, как мы им пользуемся. Плохо не то, что он у нас есть, а то, что мы уже не можем без него жить. Поэтому полезно иногда устраивать себе «день без телефона» — не для того, чтобы вернуться в прошлое, а для того, чтобы снова почувствовать себя хозяином своего времени.
    :::
  why: 第 1 题，第一段：学生每天三小时不用手机，一共一周；“一整周完全不用”是把两个时间混在一起了；第一天他们“不知道干什么”，读书、散步多起来是周末的事。第 2 题，第三段是第一种观点：现代人只是活法不同，信息来得快，能和远方的朋友交流；和手机作斗争等于活在上个世纪。第 3 题，第四段：医生说每天用手机超过五小时的人睡得差、容易累；读不了长文章是教师观察到的情况，不是医生的话。第 4 题，最后一段：作者认为两方面都有道理，问题不在于有手机，而在于离不开手机；他不主张完全不用手机（第二段说“不可能，也没必要”）。第 5 题，最后一段：偶尔给自己过“无手机日”，为的是重新做自己时间的主人，而不是回到过去。
