  passage_zh: |
    **套娃**

    套娃是一种木头娃娃，里面装着一模一样、只是小一些的娃娃。人们把它看作俄罗斯的象征之一，尽管它的历史一点也不古老。

    第一个俄罗斯套娃出现在十九世纪末的莫斯科。一般认为，这个想法来自日本：有人从那里带回一个日本智者的小像，里面藏着几个更小的人像。俄罗斯工匠按自己的方式来做：老人换成了一个围着头巾、穿着萨拉凡的姑娘，手里抱着一只黑公鸡。第一个套娃一共有八个娃娃。最小的是一个婴儿，也是唯一打不开的一个。这种玩具的名字来自女子名马特廖娜，这个名字当时在乡村里非常流行。

    1900 年，套娃在巴黎世界博览会上展出，得了一枚奖牌。此后订单从各国纷纷而来，俄罗斯有好几个城市开始制作套娃。每个地方都形成了自己的风格。比如，谢尔吉耶夫镇的套娃用鲜艳的颜色彩绘，而谢苗诺夫的套娃围裙上通常画着一大束花。

    套娃用质地软的木头制作，最常用的是椴木。工匠先旋出最小的娃娃，然后由小到大旋出其余的。接着每个娃娃都用手工彩绘，所以没有两个完全一样的套娃。

    如今的套娃五花八门：上面画着童话人物、名人和动物。不过游客最喜欢的还是经典的套娃——围着鲜艳头巾的姑娘。
