lesson: B4-T0
heading: 入册复习测试
intro: 满分 100 分，建议用时 100 分钟。考查范围：第三册全册。答对 80% 以上可直接学习本册。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：学者们自己研究了这个问题，是主动；研究在得出结论之前就已进行，用主动形动词过去时，与复数第一格 [Учёные]{.ru} 一致：[изучавшие]{.ru}；[изучаемые, изученные]{.ru} 是被动的，“被研究的”；[изучавших]{.ru} 格不对（第 1、2 课）。第 2 题：信是被寄出的，动作已完成，用短尾被动形动词作谓语，与中性的 [Письмо]{.ru} 一致：[отправлено]{.ru}；[отправлен, отправлена]{.ru} 是阳性、阴性，[отправленное]{.ru} 是长尾，不能和 [было]{.ru} 一起作这样的谓语（第 4 课）。第 3 题：先考完试，再去海边，先发生的动作用完成体副动词 [Сдав]{.ru}；[Сдавая]{.ru} 表示“一边考试一边……”，和 [сразу уехал]{.ru} 矛盾；[Сдавший]{.ru} 是形动词，要说明名词；[Сдать]{.ru} 是不定式（第 12、13 课）。第 4 题：[не хватать]{.ru} 构成无人称句，缺少东西的人用第三格 [Брату]{.ru}，缺少的东西用第二格（第 17 课）。第 5 题：[пианино]{.ru} 是以 [-о]{.ru} 结尾的外来词，表示物品，中性、不变格；[у]{.ru} 要求第二格，形容词用中性第二格 [старого]{.ru}（第 23 课）。第 6 题：[-ов]{.ru} 结尾的男姓第五格是 [-ым]{.ru}：[с Петровым]{.ru}；按名词变成 [Петровом]{.ru} 是常见错误（第 27 课）。第 7 题：[понравиться]{.ru} 要求第三格，所以主句里用 [Тем]{.ru}；从句里 [кто]{.ru} 是 [любит]{.ru} 的主语，用第一格。[тот, кто]{.ru} 里两个代词各按自己句子里的需要变格（第 37 课）。第 8 题：程度从句 [что]{.ru} 前面用指示词 [такой]{.ru} 或 [так]{.ru}：修饰形容词短尾、副词用 [так]{.ru}，修饰长尾形容词用 [такой]{.ru}，并与它同性、数、格；[тёплым]{.ru} 是长尾第五格，所以用 [таким]{.ru}（第 36 课）。第 9 题：[ведь]{.ru} 提醒对方本来就知道的事：电话是他自己放在桌上的；[разве, неужели]{.ru} 表示怀疑、惊讶，句子要变成问句；[ли]{.ru} 不能放在句首（第 47 课）。第 10 题：年份前面有季节 [осенью]{.ru} 时，年份用第二格 [1873 года]{.ru}；单说年份才用 [в 1873 году]{.ru}（第 56 课）。第 11 题：[два, три, четыре]{.ru} 后面的阳性名词用单数第二格，形容词用复数第二格：[два высоких человека]{.ru}；写成单数 [высокого]{.ru} 是最常见的错误（第 52 课）。第 12 题：[по]{.ru} 表示“……以后”时要求第六格：[по приезде]{.ru}；[по приезду]{.ru} 是常见错误（第 54 课）。
  items:
  - stem: Учёные, ___ этот вопрос много лет, пришли к интересным выводам.
    options:
    - изучаемые
    - изучавшие
    - изучавших
    - изученные
    answer: изучавшие
  - stem: Письмо было ___ ещё вчера.
    options:
    - отправленное
    - отправлен
    - отправлена
    - отправлено
    answer: отправлено
  - stem: ___ последний экзамен, Миша сразу уехал на море.
    options:
    - Сдав
    - Сдавая
    - Сдавший
    - Сдать
    answer: Сдав
  - stem: Весь год ___ не хватало времени на спорт.
    options:
    - брат
    - брата
    - брату
    - братом
    answer: брату
  - stem: Мы долго стояли у ___ пианино и слушали музыку.
    options:
    - старое
    - старой
    - старого
    - старым
    answer: старого
  - stem: Вчера я долго разговаривал с профессором ___.
    options:
    - Петровым
    - Петрова
    - Петровом
    - Петрову
    answer: Петровым
  - stem: ___, кто любит историю, обязательно понравится этот музей.
    options:
    - Те
    - Того
    - Теми
    - Тем
    answer: Тем
  - stem: Вечер был ___ тёплым, что мы гуляли до полуночи.
    options:
    - так
    - таким
    - такой
    - столько
    answer: таким
  - stem: — Где мой телефон? — ___ ты сам положил его на стол!
    options:
    - Ведь
    - Разве
    - Неужели
    - Ли
    answer: Ведь
  - stem: Эта картина была написана осенью 1873 ___.
    options:
    - год
    - году
    - года
    - годом
    answer: года
  - stem: В комнату вошли два ___ человека.
    options:
    - высокие
    - высоких
    - высокого
    - высоким
    answer: высоких
  - stem: По ___ в Москву он сразу позвонил родителям.
    options:
    - приезду
    - приезд
    - приездом
    - приезде
    answer: приезде
- id: e2
  type: fill
  task: 构词与词形填空：用括号里的词构成合适的词，或写出它的正确形式。
  points: 1
  why: 第 1 题：表示女性职业，[переводчик]{.ru} 的阴性是 [переводчица]{.ru}（[к]{.ru} 变 [ц]{.ru}）；[стать]{.ru} 要求第五格：[переводчицей]{.ru}（第 27 课）。第 2 题：[о]{.ru} 后面要名词；由形容词构成抽象名词用后缀 [-ость]{.ru}：[важность]{.ru}，阴性，第六格 [важности]{.ru}（第 21 课）。第 3 题：信是被写的，用被动形动词过去时，与中性第一格 [письмо]{.ru} 一致：[написанное]{.ru}，两个 [н]{.ru}（第 4 课）。第 4 题：散步和遇见朋友同时，主语相同，用未完成体副动词：[гулять → гуляют → гуляя]{.ru}（第 11 课）。第 5 题：主语 [Город]{.ru} 是阳性，短尾被动形动词 [основан]{.ru}，一个 [н]{.ru}（第 4 课）。第 6 题：[дрова]{.ru} 只有复数，[не хватить]{.ru} 后面用第二格 [дров]{.ru}（第 55 课）。第 7 题：爱称 [Машенька]{.ru}，用后缀 [-еньк-]{.ru}；[называть]{.ru} 后面用第五格：[Машенькой]{.ru}（第 22 课）。
  items:
  - stem: В детстве Анна мечтала стать ___.
    hint: переводчик
    accept:
    - переводчицей
  - stem: На собрании много говорили о ___ этого решения.
    hint: важный
    accept:
    - важности
  - stem: На столе лежало письмо, ___ на английском языке.
    hint: написать
    accept:
    - написанное
  - stem: ___ по парку, мы встретили старого друга.
    hint: гулять
    accept:
    - Гуляя
  - stem: Город ___ в XII веке.
    hint: основать
    accept:
    - основан
  - stem: Зимой у бабушки не хватило ___.
    hint: дрова
    accept:
    - дров
  - stem: Мама ласково называла дочь ___.
    hint: Маша
    accept:
    - Машенькой
- id: e3
  type: choice
  task: 完形填空：阅读下面的短文，为每个空选出最恰当的一项。
  points: 1
  why: 第 1 空：[долго не]{.ru} 说的是很长时间里一直没有回信，用未完成体过去时 [отвечала]{.ru}；[ответила]{.ru} 表示一次结果，和 [долго]{.ru} 不配（第 18 课）。第 2 空：房子是被建造的，用被动形动词过去时；形动词与 [в старом доме]{.ru} 一致，用阳性第六格 [построенном]{.ru}（第 4 课）。第 3 空：每次讲解的时候都会学到新东西，两个动作同时、反复，用未完成体副动词 [Рассказывая]{.ru}（第 11 课）。第 4 空：从句说明地点 [зал]{.ru}，“在那里放着”，用 [где]{.ru}；[куда]{.ru} 问方向，[который]{.ru} 要变成 [в котором]{.ru} 才行（第 35 课）。第 5 空：[документов]{.ru} 是 [нет]{.ru} 后面的复数第二格，主动形动词跟它一致：[подтверждающих]{.ru}（第 1、53 课）。第 6 空：[в течение]{.ru} + 第二格表示“在……期间”（第 51 课）。第 7 空：[судя по]{.ru} + 第三格“根据……判断”；[благодаря]{.ru} 也接第三格，但意思是“多亏”，说不通（第 15 课）。第 8 空：老奶奶在展厅里走了很久，最后哭了起来，[за-]{.ru} 表示动作开始（第 26 课）。第 9 空：[Не могла бы ты…]{.ru} 用假定式使请求委婉，后面的 [погуляли бы, сходили бы]{.ru} 也是假定式（第 19 课）。第 10 空：[если]{.ru} 从句说将来的条件，主句用完成体将来时 [покажу]{.ru}，一次具体的动作（第 18 课）。第 11 空：一般疑问句变成间接引语用 [ли]{.ru}，放在动词后面（第 39 课）。第 12 空：给朋友的私人信件结尾用 [Обнимаю]{.ru}；[С уважением]{.ru} 用在事务信件里（第 47 课）。
  items:
  - options:
    - отвечаю
    - отвечала
    - ответила
    - ответить
    answer: отвечала
  - options:
    - построенный
    - построившем
    - строящемся
    - построенном
    answer: построенном
  - options:
    - Рассказывая
    - Рассказав
    - Рассказывающая
    - Рассказать
    answer: Рассказывая
  - options:
    - куда
    - который
    - где
    - откуда
    answer: где
  - options:
    - подтверждающие
    - подтверждающих
    - подтверждённые
    - подтверждающим
    answer: подтверждающих
  - options:
    - В связи с
    - По сравнению с
    - Несмотря на
    - В течение
    answer: В течение
  - options:
    - Судя по
    - Благодаря
    - Несмотря на
    - Включая
    answer: Судя по
  - options:
    - плакала
    - поплакала
    - заплакала
    - плачет
    answer: заплакала
  - options:
    - ли
    - бы
    - же
    - ведь
    answer: бы
  - options:
    - показываю
    - показала
    - показать
    - покажу
    answer: покажу
  - options:
    - сможешь ли
    - ли сможешь
    - если сможешь
    - что сможешь
    answer: сможешь ли
  - options:
    - С уважением
    - Уважаемая
    - Обнимаю
    - Здравствуй
    answer: Обнимаю
  passage: |
    ::: {.prose lang="ru"}
    Дорогая Лена!

    Прости, что так долго не (1) []{.blank}: весь июль я работала волонтёром в новом музее. Музей находится в старом доме, (2) []{.blank} в конце XIX века одним богатым купцом. Почти сто лет в этом доме была школа, а потом он долго стоял пустой.

    Работы у нас много. Утром мы встречаем гостей, а днём проводим экскурсии для школьников. (3) []{.blank} детям об истории города, я каждый раз сама узнаю что-то новое. Больше всего мне нравится зал, (4) []{.blank} стоят старые часы и пианино. Говорят, на этом пианино когда-то играл Чайковский, но документов, (5) []{.blank} это, пока не нашли.

    (6) []{.blank} недели в музее бывает больше тысячи человек. (7) []{.blank} отзывам, людям у нас нравится. Вчера одна старушка рассказала мне, что училась в этой школе семьдесят лет назад. Она долго ходила по залам, а потом (8) []{.blank}: «Здесь всё как в моём детстве».

    В августе музей закрывается на ремонт, и я наконец буду свободна. Не могла (9) []{.blank} ты приехать ко мне на неделю? Мы бы погуляли по городу, сходили бы на реку. Если приедешь, обязательно (10) []{.blank} тебе наш музей.

    Напиши, (11) []{.blank} ты приехать. Передай привет родителям!

    (12) []{.blank}!

    Твоя Катя
    :::
  passage_zh: |
    亲爱的列娜：

    请原谅我这么久没给你回信：整个七月我都在一家新博物馆当志愿者。博物馆在一座老房子里，房子是十九世纪末一位富商建的。将近一百年里这座房子一直是学校，后来又空了很久。

    我们的工作很多。上午接待参观者，下午给中小学生讲解。每次给孩子们讲城市的历史，我自己都会学到点新东西。我最喜欢的是摆着老座钟和钢琴的那个展厅。据说柴可夫斯基曾经弹过这架钢琴，不过能证明这件事的文件到现在还没有找到。

    一个星期里来博物馆的人超过一千。从留言来看，大家很喜欢这里。昨天一位老奶奶告诉我，七十年前她就在这所学校上学。她在展厅里走了很久，后来哭了起来：“这里的一切都和我小时候一样。”

    八月博物馆闭馆整修，我终于有空了。你能不能来我这儿住一个星期？我们可以在城里逛逛，去河边走走。你要是来，我一定带你看看我们的博物馆。

    写信告诉我你能不能来。代我问你父母好！

    拥抱你！

    你的卡佳
- id: e4a
  type: choice
  task: 阅读理解（一）：阅读下面的记叙文，根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose lang="ru"}
    **Старая скрипка**

    Когда Андрею исполнилось десять лет, дедушка подарил ему старую скрипку. Скрипка была тёмная, некрасивая, и Андрей даже обиделся: друзьям на день рождения дарили телефоны и велосипеды. «Это не просто подарок, — сказал дедушка. — На этой скрипке играл мой отец».

    Андрей начал ходить в музыкальную школу, но заниматься ему не хотелось. Упражнения казались скучными, пальцы болели, а учительница была строгой. Через полгода он объявил родителям, что бросает музыку. Дедушка ничего не сказал, только попросил внука прийти к нему в субботу.

    В субботу дедушка достал из шкафа старую тетрадь. В ней были записаны песни, которые его отец играл во время войны. Тяжело раненный под Москвой, он полгода лежал в госпитале. Однажды врач принёс ему скрипку, на которой давно никто не играл. С тех пор каждый вечер прадед Андрея играл для раненых. «Отец говорил, что музыка помогала людям выздоравливать не хуже лекарств», — сказал дедушка.

    Андрей долго молчал. Потом взял скрипку и попробовал сыграть одну песню из тетради. Получилось плохо, но дедушка улыбался.

    С тех пор прошло пятнадцать лет. Андрей стал музыкантом и играет в оркестре. Скрипку прадеда отремонтировал хороший мастер. На концерты Андрей берёт другой, дорогой инструмент, но каждый год девятого мая он играет на старой скрипке песни из той тетради. Дедушки уже нет в живых, но Андрею кажется, что дедушка его слышит.
    :::
  why: 第 1 题，第一段：朋友们过生日收到的是手机和自行车，安德烈收到一把又旧又不好看的小提琴，所以觉得委屈；文中没说他不喜欢音乐。第 2 题，第二段：练习枯燥、手指疼、老师严格；不是因为爷爷，也不是家里没钱。第 3 题，第三段：曾祖父重伤住院时，医生给他拿来一把很久没人拉的小提琴；“从战场带回来”“在音乐学校得到”都是文中没有的说法。第 4 题，第二、三段：爷爷什么也没说，只是让孙子星期六去他那里，拿出旧本子，讲了曾祖父的事；他没有批评，也没有带孙子去音乐会。第 5 题，最后一段：每年五月九日他用旧琴拉本子里的歌；音乐会上用的是另一把贵重的琴。
  items:
  - stem: Андрей обиделся на дедушку, потому что ___.
    options:
    - не любил музыку
    - хотел получить такой же подарок, как у друзей
    - дедушка забыл про его день рождения
    - скрипка была сломана
    answer: хотел получить такой же подарок, как у друзей
  - stem: Через полгода Андрей решил бросить музыку, потому что ___.
    options:
    - дедушка был против
    - у родителей не было денег на школу
    - заниматься было скучно и трудно
    - он заболел
    answer: заниматься было скучно и трудно
  - stem: Прадед Андрея получил скрипку ___.
    options:
    - в госпитале от врача
    - в музыкальной школе
    - от своего отца
    - на концерте в Москве
    answer: в госпитале от врача
  - stem: Когда Андрей решил бросить музыку, дедушка ___.
    options:
    - долго ругал его
    - повёл его на концерт
    - позвонил учительнице
    - показал ему тетрадь и рассказал об отце
    answer: показал ему тетрадь и рассказал об отце
  - stem: Каждый год девятого мая Андрей ___.
    options:
    - играет песни из тетради на старой скрипке
    - даёт концерт на дорогом инструменте
    - едет в госпиталь
    - приносит скрипку мастеру
    answer: играет песни из тетради на старой скрипке
  passage_zh: |
    **旧小提琴**

    安德烈十岁那年，爷爷送给他一把旧小提琴。琴的颜色发暗，样子也不好看，安德烈甚至觉得委屈：朋友们过生日收到的都是手机和自行车。“这不是一件普通的礼物，”爷爷说，“我父亲拉过这把琴。”

    安德烈开始上音乐学校，可是他不想练琴。练习显得枯燥，手指疼，老师又很严格。半年后，他对父母宣布不学音乐了。爷爷什么也没说，只是让孙子星期六到他那里去一趟。

    星期六，爷爷从柜子里拿出一个旧本子。本子里记着他父亲在战争年代拉过的歌。他在莫斯科城下受了重伤，在医院里躺了半年。有一天，一位医生给他拿来一把很久没人拉过的小提琴。从那以后，安德烈的曾祖父每天晚上都给伤员们拉琴。“父亲说过，音乐帮助人们恢复健康，不比药差，”爷爷说。

    安德烈沉默了很久。后来他拿起小提琴，试着拉了本子里的一首歌。拉得不好，可是爷爷在微笑。

    从那以后过去了十五年。安德烈成了音乐家，在乐团里演奏。曾祖父的小提琴请一位好师傅修好了。开音乐会时安德烈用的是另一把贵重的琴，可是每年五月九日，他都用那把旧琴拉那个本子里的歌。爷爷已经不在人世了，可安德烈觉得，爷爷听得见他的琴声。
- id: e4b
