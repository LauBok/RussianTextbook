- id: e8
  type: open
  task: 写作。
  points: 20
  items:
  - prompt: 以 [Нужно ли знать историю своей семьи?]{.ru} 为题写一篇议论短文，150–200 词。先提出自己的观点，再用两个论据（可以举自己或熟人的例子）加以说明，最后得出结论。至少用一个形动词短语、一个副动词短语，用上 [во-первых, кроме того, таким образом]{.ru} 一类连接词。
    length: 150–200
    model: |
      Нужно ли знать историю своей семьи? Многие молодые люди думают, что прошлое их не касается: жить нужно сегодняшним днём. Я с этим не согласен и считаю, что знать историю своей семьи нужно каждому.

      Во-первых, история семьи помогает понять самого себя. Слушая рассказы бабушки о её детстве в деревне, я понял, почему в нашей семье так любят землю и каждое лето проводят на даче. Многие наши привычки, взгляды и даже любимые блюда пришли к нам от людей, живших сто лет назад.

      Кроме того, история семьи — это часть истории страны. Мой прадед, раненный под Сталинградом, вернулся домой только в 1946 году. Узнав его историю, я стал совсем по-другому читать учебник истории: за цифрами и датами я теперь вижу живых людей.

      Конечно, не у всех есть старые письма и фотографии, а многие свидетели прошлого уже ушли. Но это значит, что расспрашивать родных нужно как можно раньше, пока ещё не поздно.

      Таким образом, знать историю своей семьи нужно не для того, чтобы жить в прошлом, а для того, чтобы лучше понимать настоящее.
    rubric:
    - 内容 8 分：开头明确提出观点（2 分）；两个论据各有具体例子（各 2 分）；结论回应开头（2 分）
    - 语法 6 分：形动词短语、副动词短语各用对一次（各 1 分）；其余 4 分看全文语法错误，变格、变位、体、支配关系每两处错误扣 1 分
    - 词汇与连接 3 分：用上 [во-первых, кроме того, таким образом]{.ru} 一类连接词，段与段之间衔接自然（2 分）；用词准确、有变化（1 分）
    - 结构 3 分：分段清楚，开头—论据—结论层次分明
    - 字数少于 120 词的，内容分最多给 4 分
    notes: 范文约 190 词，按议论段落的结构写：第一段用设问引出话题，先说对立观点，再亮出自己的观点；第二、三段各一个论据，用 [Во-первых]{.ru}、[Кроме того]{.ru} 开头，每个论据都有自己家里的例子；第四段先让步（[Конечно…]{.ru}），再用 [Но]{.ru} 转回自己的观点；最后一段用 [Таким образом]{.ru} 总结，[не для того, чтобы…, а для того, чтобы…]{.ru} 使结论更鲜明。语法上：[Слушая рассказы]{.ru}、[Узнав его историю]{.ru} 是副动词短语（第 11、13 课），[живших сто лет назад]{.ru}、[раненный под Сталинградом]{.ru} 是形动词短语（第 1—4 课），[раненный]{.ru} 带补语时写两个 [н]{.ru}。
