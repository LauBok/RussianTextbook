  passage_zh: |
    **没有手机的一天**

    不久前，莫斯科的一所学校做了一个实验：九年级的学生同意一整个星期每天三个小时不用手机。结果让老师和孩子们自己都感到意外。很多人承认，第一天不知道该干什么。可是到周末，几乎所有人都读书多了、散步多了、和父母聊天也多了。

    这个实验让人深思。今天手机对我们来说成了一切：闹钟、地图、图书馆、商店。完全不用它当然不可能，也没有必要。但是，能不能至少几个小时离开它呢？

    有人认为手机没有什么可怕的。在他们看来，现代人只是换了一种活法：他们获取信息比父母那一代快，还能和住在别的城市、别的国家的朋友交流。禁止手机，就等于活在上个世纪。

    另一些人则确信，我们为这种便利付出的代价太高了。医生说，每天花五个多小时在手机上的人睡得更差，也更容易累。老师们发现，中小学生读长文章越来越吃力：看惯了短消息，读到第二页注意力就散了。

    我认为，两种人都有道理。手机是一种工具，一切取决于我们怎样使用它。不好的不是我们有手机，而是我们离不开它。所以，偶尔给自己过一个“无手机日”是有益的——不是为了回到过去，而是为了重新感到自己是自己时间的主人。
