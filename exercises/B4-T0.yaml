    ::: {.prose lang="ru"}
    **Самовар**

    Самовар — один из символов русской жизни. Само слово объясняет, как он устроен: самовар «сам варит», то есть сам делает воду горячей. В середине самовара есть узкая высокая часть, куда кладут горячие угли. Вода вокруг неё быстро становится горячей и долго остаётся такой. Сверху на самовар ставят маленький чайник с очень крепким чаем. В чашку сначала льют немного крепкого чая из чайника, а потом добавляют горячую воду из самовара.

    Первые самовары появились в России в XVIII веке. Главным центром их производства стала Тула — город, где давно работали хорошие мастера. Считается, что в 1778 году здесь открылась одна из первых мастерских, где делали самовары. В середине XIX века в Туле было уже почти тридцать таких фабрик, и каждый год они делали больше ста тысяч самоваров. Отсюда и поговорка «В Тулу со своим самоваром не ездят»: так говорят о человеке, который везёт что-то туда, где этого и так много.

    Самовары бывали самыми разными: маленькие, на два-три стакана, и огромные, которые стояли в трактирах и на вокзалах и могли напоить чаем сразу несколько десятков человек. Дорогие самовары украшали узорами, и их передавали в семье от родителей к детям.

    В XX веке появились самовары, которые работают от электричества. Они удобнее, но многие считают, что чай из настоящего самовара на углях вкуснее. Сегодня в Туле работает музей самоваров. В нём собраны самовары разных времён — от самых маленьких до таких, к которым трудно подойти близко.
    :::
  why: 第 1 题，第一段：[самовар]{.ru} 由 [сам]{.ru} 和 [варить]{.ru} 构成，“自己煮”，名称说明了它的构造；不是因为人们自己做茶炊，也不是来自地名。第 2 题，第一段：中间又窄又高的部分放烧红的炭，周围的水很快热起来；小茶壶里是浓茶，放在茶炊上面，倒茶时先倒浓茶再兑开水。第 3 题，第二段：据说 1778 年图拉开了最早的茶炊作坊之一；十九世纪中叶图拉有近三十家工厂；1778 年不是茶炊在俄罗斯出现的年份（十八世纪）。第 4 题，第二段末：这句俗语说的是把东西带到本来就很多的地方，是多此一举。第 5 题，第四段：电茶炊用起来更方便，但很多人认为用炭烧的茶炊泡的茶更好喝；电茶炊出现于二十世纪，并没有取代老式茶炊。
