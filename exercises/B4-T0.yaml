    model: 艾尔米塔什是世界上最大的博物馆之一。它的历史始于 1764 年，那一年叶卡捷琳娜二世在柏林买下了一批欧洲画家的画作。起初只有女皇和她的客人才能观赏这些画。直到 1852 年，博物馆才向所有人开放。如今它的藏品超过三百万件，而在博物馆占用的各座建筑中，最主要的仍然是冬宫——昔日俄国沙皇的居所。据说，如果在每件展品前哪怕只停留一分钟，要看完整个艾尔米塔什也需要好几年。
    rubric:
    - 内容 4 分：六句话的意思都译出、没有漏译误译得 4 分；每漏译或误译一处扣 1 分。重点：[один из крупнейших]{.ru}“最大的……之一”；[Открытым для всех музей стал только в 1852 году]{.ru} 的 [только]{.ru} 译“直到……才”；[главным из зданий, которые занимает музей, остаётся Зимний дворец]{.ru} 里主语是 [Зимний дворец]{.ru}；最后一句是条件句套目的从句，“要看完……需要好几年”
    - 表达 2 分：译文通顺，符合汉语习惯，不逐词硬译（如不译成“成为了对所有人开放的”）得 2 分；有两三处生硬扣 1 分
    notes: 这段话是说明文，句子不长，难点在语序和几个结构：第五格表语 [Открытым для всех… стал]{.ru} 前置，强调“对所有人开放”；[главным из зданий… остаётся Зимний дворец]{.ru} 也是表语在前、主语在后，汉语要把主语提前，译成“在……建筑中，最主要的仍然是冬宫”；最后一句 [если…, чтобы…, нужно будет…]{.ru} 按汉语习惯把条件放前面，目的从句和主句合成“要看完……需要……”。专名按通行译法：[Эрмитаж]{.ru} 艾尔米塔什，[Екатерина II]{.ru} 叶卡捷琳娜二世，[Зимний дворец]{.ru} 冬宫。
