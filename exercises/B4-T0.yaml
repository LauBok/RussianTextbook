    ::: {.prose lang="ru"}
    **Матрёшка**

    Матрёшка — деревянная кукла, внутри которой находятся другие такие же куклы, только меньше. Её считают одним из символов России, хотя история у неё совсем не древняя.

    Первая русская матрёшка появилась в конце XIX века в Москве. Считается, что идея пришла из Японии: туда привезли фигурку японского мудреца, в которой пряталось ещё несколько фигурок. Русские мастера сделали по-своему: вместо старика появилась девушка в платке и сарафане, а в руках у неё — чёрный петух. В первой матрёшке было восемь кукол. Самой маленькой была кукла-ребёнок, единственная, которая не открывалась. Своё имя игрушка получила от женского имени Матрёна, которое тогда было очень популярно в деревнях.

    В 1900 году матрёшку показали на Всемирной выставке в Париже, и она получила медаль. После этого заказы стали приходить из разных стран, и матрёшки начали делать в нескольких городах России. У каждого места появился свой стиль. Например, в Сергиевом Посаде матрёшек расписывают яркими красками, а в Семёнове на фартуке у куклы обычно рисуют большой букет цветов.

    Делают матрёшку из мягкого дерева, чаще всего из липы. Сначала мастер вытачивает самую маленькую куклу, потом все остальные — от меньшей к большей. Затем каждую куклу расписывают вручную, поэтому двух совершенно одинаковых матрёшек не бывает.

    Сегодня матрёшки бывают самыми разными: на них рисуют героев сказок, известных людей, животных. Но больше всего туристы любят классическую матрёшку — девушку в ярком платке.
    :::
  why: 第 1 题，第二段第一句：第一个俄罗斯套娃出现在十九世纪末的莫斯科；文中特意说它的历史“完全不古老”。第 2 题，第二段：套娃的想法据说来自日本的一个智者小像，里面藏着几个小人像。第 3 题，第二段：第一个套娃有八个，最小的是娃娃，是唯一打不开的；穿萨拉凡、拿公鸡的是外面最大的姑娘。第 4 题，第三段：1900 年在巴黎世界博览会上得了奖牌，此后订单从各国来，几个城市开始制作；不是巴黎人发明的，也不是从那时才起名。第 5 题，第四段：每个娃娃都手工彩绘，所以没有两个完全一样的套娃；先旋最小的，再由小到大。
