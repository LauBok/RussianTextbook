lesson: L80
heading: 单元测试
intro: 本测试覆盖第八单元全部语法。答对 80% 以上再进入第九单元；没有达到的，回到相应的课复习后重做。
grammar: "运动动词过去时 [шёл / ходи́л]{.ru}、[е́хал / е́здил]{.ru}；定向与不定向；[Когда́ я шёл…]{.ru}；[пойти́]{.ru}、[пое́хать]{.ru}；[где]{.ru} / [куда́]{.ru} / [отку́да]{.ru}；方位副词与运动动词命令式；[покупа́ть / купи́ть]{.ru}、[зака́зывать / заказа́ть]{.ru}；[покажи́те]{.ru}、[да́йте]{.ru}；[хоте́л бы]{.ru}；数词 100–1000 与 [рубль]{.ru}；[кото́рый]{.ru}（第一格）。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的运动动词。
    why: "去了一趟又回来（相当于“去过”）用不定向 [ходи́л]{.ru}、[е́здил]{.ru}；当时正在路上、给另一件事做背景用定向 [шёл]{.ru}、[е́хал]{.ru}，[когда́]{.ru} 引出的背景也是这样。去别的城市、坐车用 [е́хать]{.ru} 一组。将来的一次出行用 [пое́дем]{.ru}、[пойдём]{.ru}；[пое́хал]{.ru} 表示“已经动身去了，人还没回来”，所以问“爸爸在哪儿”时这样回答；[е́здил]{.ru}、[ходи́л]{.ru} 表示已经回来了，答非所问。"
    items:
      - stem: — Где вы бы́ли в суббо́ту? — Мы ___ в галере́ю.
        options: [шли, ходи́ли, пошли́]
        answer: ходи́ли
      - stem: Когда́ Ван Лэй ___ ми́мо кафе́, он уви́дел А́нну.
        options: [шёл, ходи́л, пойдёт]
        answer: шёл
      - stem: В про́шлом году́ Ми́ша ___ в Петербу́рг.
        options: [шёл, ходи́л, е́здил]
        answer: е́здил
      - stem: Ве́чером Ван Лэй ___ домо́й на метро́ и ду́мал о Петербу́рге.
        options: [е́хал, е́здил, ходи́л]
        answer: е́хал
      - stem: За́втра мы ___ в Петербу́рг на «Сапса́не».
        options: [пое́дем, пойдём, е́здим]
        answer: пое́дем
      - stem: — Где па́па? — Он ___ на рабо́ту.
        options: [е́здил, пое́хал, ходи́л]
        answer: пое́хал

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "[где – куда́ – отку́да]{.ru} 三组对应：[в – в – из]{.ru}，[на – на – с]{.ru}，指人用 [у – к – от]{.ru}。[рабо́та]{.ru}、[экску́рсия]{.ru}、[Ура́л]{.ru} 平时用 [на]{.ru}，“从”就用 [с]{.ru}；[дочь]{.ru}、[врач]{.ru} 是人，用 [от]{.ru}、[к]{.ru}。指路时表示方向用 [нале́во]{.ru}、[напра́во]{.ru}，表示位置用 [сле́ва]{.ru}、[спра́ва]{.ru}；[е́хать]{.ru} 的命令式是 [поезжа́й(те)]{.ru}。"
    items:
      - stem: — Отку́да ты идёшь? — ___ библиоте́ки.
        options: [Из, С, От]
        answer: Из
      - stem: Ве́чером па́па е́дет домо́й ___ рабо́ты.
        options: [из, с, от]
        answer: с
      - stem: Же́нщина е́дет от до́чери ___.
        options: [к сы́ну, у сы́на, в сы́на]
        answer: к сы́ну
      - stem: Мы бы́ли в Петербу́рге, а тепе́рь е́дем ___.
        options: [отту́да, туда́, там]
        answer: отту́да
      - stem: Иди́те пря́мо, пото́м поверни́те ___.
        options: [нале́во, сле́ва, ря́дом]
        answer: нале́во
      - stem: Торго́вый центр далеко́. ___ на метро́!
        options: [Иди́те, Ходи́те, Поезжа́йте]
        answer: Поезжа́йте

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "[три часа́]{.ru}、[це́лый час]{.ru} 这样的时间长度说的是过程，要用未完成体 [покупа́л]{.ru}；一次买成、有了结果用完成体 [купи́л]{.ru}。过去经常做用未完成体 [зака́зывал]{.ru}。向售货员提请求用完成体命令式 [покажи́те]{.ru}、[да́йте]{.ru}，[э́та ку́ртка]{.ru} 作宾语变成第四格 [э́ту ку́ртку]{.ru}。[хоте́л бы]{.ru} 跟主语的性一致，安娜是女性，用 [хоте́ла бы]{.ru}。"
    items:
      - stem: Ты ___ ку́ртку три часа́!
        options: [покупа́л, купи́л, ку́пишь]
        answer: покупа́л
      - stem: Наконе́ц Ван Лэй ___ чёрную ку́ртку.
        options: [покупа́л, купи́л, покупа́ет]
        answer: купи́л
      - stem: В Пеки́не я ча́сто ___ борщ в ру́сском рестора́не.
        options: [зака́зывал, заказа́л, закажу́]
        answer: зака́зывал
      - stem: Покажи́те, пожа́луйста, ___.
        options: [э́та ку́ртка, э́ту ку́ртку, э́той ку́ртке]
        answer: э́ту ку́ртку
      - stem: "А́нна сказа́ла: «Я ___ блины́ со смета́ной»."
        options: [хоте́л бы, хоте́ла бы, хоте́ли бы]
        answer: хоте́ла бы

  - id: e4
    type: fill
    task: 用俄语写出价钱。
    why: "数词按位依次说，中间不加 [и]{.ru}。[рубль]{.ru} 的形式只看最后一个词：[оди́н]{.ru} 后用 [рубль]{.ru}，[два, три, четы́ре]{.ru} 后用 [рубля́]{.ru}，其他数词和 [ты́сяча]{.ru} 后用 [рубле́й]{.ru}。第 4 题最后一个词是 [двена́дцать]{.ru}，不是 [два]{.ru}，所以用 [рубле́й]{.ru}。200 是 [две́сти]{.ru}，500–900 中间保留 [ь]{.ru}：[пятьсо́т]{.ru}、[девятьсо́т]{.ru}。"
    items:
      - stem: Матрёшка сто́ит ___.
        hint: 400 ₽
        accept: [четы́реста рубле́й]
      - stem: Плато́к сто́ит ___.
        hint: 550 ₽
        accept: [пятьсо́т пятьдеся́т рубле́й]
      - stem: Чай сто́ит ___.
        hint: 202 ₽
        accept: [две́сти два рубля́]
      - stem: Блины́ сто́ят ___.
        hint: 312 ₽
        accept: [три́ста двена́дцать рубле́й]
      - stem: Кни́га сто́ит ___.
        hint: 901 ₽
        accept: [девятьсо́т оди́н рубль]

  - id: e5
    type: rewrite
    task: 用 [кото́рый]{.ru} 把两句话连成一句。
    why: "[кото́рый]{.ru} 代替第二句的主语，性和数跟它说明的名词一致：[парк]{.ru}、[мост]{.ru} 阳性用 [кото́рый]{.ru}，[у́лица]{.ru} 阴性用 [кото́рая]{.ru}，[худо́жники]{.ru} 复数用 [кото́рые]{.ru}。从句前加逗号，从句里不再重复 [он]{.ru}、[она́]{.ru}；过去时动词跟着 [кото́рый]{.ru} 的性变（[кото́рая е́хала]{.ru}）。"
    example:
      cue: Э́то парк. Он нахо́дится ря́дом с Кремлём.
      answer: Э́то парк, кото́рый нахо́дится ря́дом с Кремлём.
    items:
      - cue: Э́то у́лица. Она́ мне о́чень нра́вится.
        accept: ["Э́то у́лица, кото́рая мне о́чень нра́вится."]
      - cue: Там есть мост. Он виси́т над реко́й.
        accept: ["Там есть мост, кото́рый виси́т над реко́й."]
      - cue: Там рабо́тают худо́жники. Они́ рису́ют портре́ты.
        accept: ["Там рабо́тают худо́жники, кото́рые рису́ют портре́ты."]
      - cue: Ря́дом сиде́ла же́нщина. Она́ е́хала от до́чери к сы́ну.
        accept: ["Ря́дом сиде́ла же́нщина, кото́рая е́хала от до́чери к сы́ну."]

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：从画廊回家时王磊和安娜是走回去的；女士从女儿那里来，要去儿子那里；王磊本该往左拐，却往右拐了；他买的是黑色外套；他最喜欢的地方是大学旁边的麻雀山。
    items:
      - stem: Из галере́и домо́й Ван Лэй и А́нна ___.
        options: [е́хали на метро́, шли пешко́м, е́хали на трамва́е]
        answer: шли пешко́м
      - stem: Же́нщина в по́езде е́хала ___.
        options: [от сы́на к до́чери, от до́чери к сы́ну, с Ура́ла в Петербу́рг]
        answer: от до́чери к сы́ну
      - stem: На́до бы́ло поверну́ть нале́во, а Ван Лэй поверну́л ___.
        options: [напра́во, наза́д, нале́во]
        answer: напра́во
      - stem: Ван Лэй купи́л ___ ку́ртку.
        options: [си́нюю, чёрную, бе́лую]
        answer: чёрную
      - stem: Люби́мое ме́сто Ван Лэ́я — ___.
        options: [Арба́т, Воробьёвы го́ры, Эрмита́ж]
        answer: Воробьёвы го́ры

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题“去了一趟”已经回来，用不定向 [ходи́ли]{.ru}，“画廊”用 [в]{.ru} + 第四格。第 2 题“在路上”的背景用定向 [шёл]{.ru}，[когда́]{.ru} 从句后加逗号。第 3 题“我想”是客气的请求，男性用 [хоте́л бы]{.ru}，后面接完成体 [заказа́ть]{.ru}。
    items:
      - zh: 星期六我们去了一趟画廊。
        accept: ["В суббо́ту мы ходи́ли в галере́ю.", "Мы в суббо́ту ходи́ли в галере́ю.", "В суббо́ту мы бы́ли в галере́е.", "Мы ходи́ли в галере́ю в суббо́ту.", "Мы бы́ли в галере́е в суббо́ту."]
        rubric: ["“去了一趟”用 [ходи́ли]{.ru}，不用 [шли]{.ru}", "[в галере́ю]{.ru} 第四格；用 [бы́ли]{.ru} 时是 [в галере́е]{.ru} 第六格"]
      - zh: 我去大学的路上看见了奥尔加·维克托罗夫娜。
        accept: ["Когда́ я шёл в университе́т, я ви́дел О́льгу Ви́кторовну.", "Когда́ я шёл в университе́т, я уви́дел О́льгу Ви́кторовну.", "Когда́ я е́хал в университе́т, я ви́дел О́льгу Ви́кторовну.", "Когда́ я е́хал в университе́т, я уви́дел О́льгу Ви́кторовну.", "Когда́ я шла в университе́т, я ви́дела О́льгу Ви́кторовну.", "Когда́ я шла в университе́т, я уви́дела О́льгу Ви́кторовну.", "Когда́ я е́хала в университе́т, я ви́дела О́льгу Ви́кторовну.", "Когда́ я е́хала в университе́т, я уви́дела О́льгу Ви́кторовну."]
        rubric: ["背景用 [когда́]{.ru} + 定向动词过去时 [шёл]{.ru} 或 [е́хал]{.ru}", "[О́льгу Ви́кторовну]{.ru} 第四格"]
      - zh: 我想点罗宋汤和饺子。（男子说）
        accept: ["Я хоте́л бы заказа́ть борщ и пельме́ни.", "Я бы хоте́л заказа́ть борщ и пельме́ни.", "Я хоте́л бы борщ и пельме́ни."]
        rubric: ["男性用 [хоте́л бы]{.ru}", "[заказа́ть]{.ru} 完成体不定式", "[борщ]{.ru}、[пельме́ни]{.ru} 第四格与第一格同形"]

  - id: e8
    type: open
    task: 短文写作。
    items:
      - prompt: 以 [Мой выходно́й день]{.ru} 为题，写一个周末你去了哪里：怎么去的，路上看见了什么，在那里买了或点了什么、花了多少钱。
        length: 70–100
        model: "В суббо́ту мы с дру́гом ходи́ли в музе́й. Туда́ мы е́хали на метро́, а пото́м шли пешко́м. Когда́ мы шли по у́лице, мы уви́дели ста́рую це́рковь, кото́рая нахо́дится ря́дом с музе́ем. В музе́е мы бы́ли три часа́. Пото́м мы пошли́ в кафе́. Я сказа́л официа́нту: «Я хоте́л бы заказа́ть чай и блины́». Блины́ сто́или три́ста рубле́й, чай — сто пятьдеся́т. В воскресе́нье я пое́хал в торго́вый центр и купи́л тёплую ша́пку. Она́ сто́ила семьсо́т рубле́й."
        rubric: ["“去了一趟”用 [ходи́л]{.ru} / [е́здил]{.ru}，路上的过程用 [шёл]{.ru} / [е́хал]{.ru}", "至少一句 [Когда́ я шёл (е́хал)…, я уви́дел…]{.ru}", "至少用一次 [кото́рый]{.ru}，性数一致", "价钱用数词 + [рубль]{.ru} 的正确形式", "[купи́л]{.ru}、[заказа́л]{.ru} 或 [хоте́л бы]{.ru} 用对"]
        notes: 范文按时间顺序写：先写星期六去了哪里（[ходи́ли]{.ru}，整件事），再写路上的经过（[е́хали]{.ru}、[шли]{.ru}，过程）和路上看见的东西（[когда́]{.ru} + [шли]{.ru}，[кото́рая нахо́дится]{.ru}），然后写在咖啡馆点的东西和价钱，最后写星期天的事（[пое́хал]{.ru}、[купи́л]{.ru}，一次的结果）。写这类短文时，先想清楚每一句说的是整件事还是路上的过程，再选动词。
