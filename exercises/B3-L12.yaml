lesson: B3-L12
grammar: "完成体副动词：不定式词干 + [-в]{.ru}，带 [-ся]{.ru} 的动词 + [-вшись]{.ru}，[-йти, -сти, -зти]{.ru} 类由将来时词干 + [-я]{.ru}（[пройдя]{.ru}）；表示在谓语之前完成的动作，主语必须相同。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Где находится исток Волги и что там делают туристы? Через какие города течёт Волга? Как проходит день на теплоходе? Кто такие бурлаки и кто написал о них картину? Как гидроэлектростанции изменили Волгу?]{.ru}"
        length: 60–90
        model: "Исток Волги находится на Валдайской возвышенности, в Тверской области, у деревни Волговерховье. Приехав туда, туристы проходят по мосту к часовне и трогают воду. Волга течёт через Тверь, Ярославль, Кострому, Нижний Новгород, Казань, Самару, Саратов, Волгоград и Астрахань. Утром пассажиры теплохода, проснувшись, выходят на палубу, днём гуляют по городу, а вечером сидят на палубе. Бурлаки тянули суда против течения, шагая по берегу. Илья Репин написал картину «Бурлаки на Волге». Гидроэлектростанции дали людям электричество, но течение стало медленнее, а рыбе стало труднее подниматься вверх по реке."
        rubric: ["五个问题都回答，地名准确", "至少用两处完成体副动词短语", "用完整的句子"]
        notes: "范文约 90 词。第 3 题按时间顺序说：早上、白天、晚上，正好练习完成体副动词表示先后动作。第 5 题要说出好处和代价两个方面。"

  - id: e2
    type: fill
    task: 用括号里动词的完成体副动词填空。
    why: "完成体副动词由不定式词干构成：第 1 题 [купить → купив]{.ru}，第 4 题 [осмотреть → осмотрев]{.ru}，第 7 题 [увидеть → увидев]{.ru}，词干以元音结尾，加 [-в]{.ru}。第 2、5、8 题是带 [-ся]{.ru} 的动词，用 [-вшись]{.ru}：[вернувшись]{.ru}、[проснувшись]{.ru}、[соединившись]{.ru}，不能丢掉 [-сь]{.ru}。第 3、6 题是 [-йти]{.ru} 类运动动词，由将来时词干加 [-я]{.ru}：[пройдут → пройдя]{.ru}，[придут → придя]{.ru}；虽然以 [-я]{.ru} 结尾，仍然是完成体。"
    items:
      - stem: ___ билеты, туристы отправились в круиз.
        hint: купить
        accept: ["Купив"]
      - stem: ___ на теплоход, пассажиры пошли ужинать.
        hint: вернуться
        accept: ["Вернувшись"]
      - stem: ___ тысячи километров, ручей становится огромной рекой.
        hint: пройти
        accept: ["Пройдя"]
      - stem: ___ кремль, мы пошли на набережную.
        hint: осмотреть
        accept: ["Осмотрев"]
      - stem: Утром, ___, пассажиры выходят на палубу.
        hint: проснуться
        accept: ["проснувшись"]
      - stem: ___ к истоку, туристы сразу пошли к часовне.
        hint: прийти
        accept: ["Придя"]
      - stem: ___ бурлаков на Волге, Репин решил написать картину.
        hint: увидеть
        accept: ["Увидев"]
      - stem: ___ с Камой, Волга течёт дальше на юг.
        hint: соединиться
        accept: ["Соединившись"]

  - id: e3
    type: choice
    task: 选择未完成体或完成体副动词。
    why: "两个动作同时进行用未完成体副动词，一个动作先完成、另一个随后发生用完成体副动词。第 1 题“在回家的路上”想着伏尔加河，同时进行，用 [Возвращаясь]{.ru}。第 2 题回到家以后才讲，先后关系，用 [Вернувшись]{.ru}。第 3 题读完书才做出决定，用 [Прочитав]{.ru}。第 4 题一边读一边在书页上做记号，同时进行，用 [Читая]{.ru}。第 5 题纤夫一边走一边拉船，用 [идя]{.ru}。第 6 题流完几千公里以后才注入里海，用 [Пройдя]{.ru}。"
    items:
      - stem: ___ домой на поезде, он всё время думал о Волге.
        options: [Возвращаясь, Вернувшись]
        answer: Возвращаясь
      - stem: ___ домой, он долго рассказывал друзьям о Волге.
        options: [Возвращаясь, Вернувшись]
        answer: Вернувшись
      - stem: ___ книгу о Волге, я решил поехать в круиз.
        options: [Читая, Прочитав]
        answer: Прочитав
      - stem: ___ книгу о Волге, я писал на полях названия городов.
        options: [Читая, Прочитав]
        answer: Читая
      - stem: Бурлаки тянули суда, медленно ___ по берегу.
        options: [идя, пройдя]
        answer: идя
      - stem: ___ тысячи километров, Волга впадает в Каспийское море.
        options: [Проходя, Пройдя]
        answer: Пройдя

  - id: e4
    type: rewrite
    task: 把从句或并列谓语改写成完成体副动词短语。
    example:
      cue: Когда туристы приехали к истоку, они прошли по мосту к часовне.
      answer: Приехав к истоку, туристы прошли по мосту к часовне.
    why: "从句或第一个谓语表示先完成的动作，主语与主句相同，就可以变成完成体副动词。从句的主语如果是名词，要移到主句里（第 3 题 [Репин]{.ru}）；如果是代词，直接删去（第 1、4 题 [мы]{.ru}）。第 2 题两个并列谓语 [проснулись и вышли]{.ru}，先发生的 [проснулись]{.ru} 变成 [проснувшись]{.ru}，带 [-ся]{.ru} 用 [-вшись]{.ru}。第 5 题 [выйти]{.ru} 属于 [-йти]{.ru} 类：[выйдут → выйдя]{.ru}。"
    items:
      - cue: После того как мы осмотрели монастырь, мы пошли на набережную.
        accept: ["Осмотрев монастырь, мы пошли на набережную.", "Мы, осмотрев монастырь, пошли на набережную."]
      - cue: Пассажиры проснулись и вышли на палубу.
        accept: ["Проснувшись, пассажиры вышли на палубу.", "Пассажиры, проснувшись, вышли на палубу."]
      - cue: Когда Репин увидел бурлаков, он решил написать картину.
        accept: ["Увидев бурлаков, Репин решил написать картину.", "Репин, увидев бурлаков, решил написать картину."]
      - cue: Когда мы вернулись домой, мы долго вспоминали Волгу.
        accept: ["Вернувшись домой, мы долго вспоминали Волгу.", "Мы, вернувшись домой, долго вспоминали Волгу."]
      - cue: Туристы вышли из автобуса и пошли к истоку Волги.
        accept: ["Выйдя из автобуса, туристы пошли к истоку Волги.", "Туристы, выйдя из автобуса, пошли к истоку Волги."]

  - id: e5
    type: rewrite
    task: 反过来，把完成体副动词短语改写成 [когда]{.ru} 从句。
    example:
      cue: Купив билеты, туристы отправились в круиз.
      answer: Когда туристы купили билеты, они отправились в круиз.
    why: "副动词本身没有时间和人称，改成从句时要补出主语，并按主句的时间选择动词形式。完成体副动词改成完成体动词：第 1 题主句是过去时，从句用 [осмотрели]{.ru}；第 2 题主句是将来时 [поймёт]{.ru}，从句也用将来时 [вернётся]{.ru}；第 3 题带 [-вшись]{.ru} 的副动词改回带 [-ся]{.ru} 的动词 [проснулись]{.ru}。三题都可以用 [после того как]{.ru} 代替 [когда]{.ru}，更强调先后。名词主语一般放进从句，主句改用代词。"
    items:
      - cue: Осмотрев кремль, туристы вернулись на теплоход.
        accept: ["Когда туристы осмотрели кремль, они вернулись на теплоход.", "После того как туристы осмотрели кремль, они вернулись на теплоход."]
      - cue: Вернувшись домой, путешественник поймёт, почему Волгу называют матушкой.
        accept: ["Когда путешественник вернётся домой, он поймёт, почему Волгу называют матушкой.", "После того как путешественник вернётся домой, он поймёт, почему Волгу называют матушкой."]
      - cue: Проснувшись рано утром, пассажиры вышли на палубу.
        accept: ["Когда пассажиры проснулись рано утром, они вышли на палубу.", "Когда рано утром пассажиры проснулись, они вышли на палубу.", "После того как пассажиры проснулись рано утром, они вышли на палубу."]

  - id: e6
    type: translate
    task: 翻译下列句子，用完成体副动词。
    items:
      - zh: 游客们参观完克里姆林，回到了船上。
        accept: ["Осмотрев кремль, туристы вернулись на теплоход.", "Туристы, осмотрев кремль, вернулись на теплоход.", "Осмотрев кремль, туристы вернулись на корабль."]
        rubric: ["[осмотрев]{.ru}：完成体副动词，表示先完成的动作", "[вернуться на теплоход]{.ru}：[на]{.ru} + 第四格"]
      - zh: 伏尔加河与卡马河汇合后，继续向南流。
        accept: ["Соединившись с Камой, Волга течёт дальше на юг.", "Соединившись с Камой, Волга течёт на юг дальше.", "Волга, соединившись с Камой, течёт дальше на юг."]
        rubric: ["[соединившись с Камой]{.ru}：带 [-ся]{.ru} 的动词用 [-вшись]{.ru}，[с]{.ru} + 第五格", "[течь на юг]{.ru}"]
      - zh: 早晨，乘客们醒来以后就走上甲板。
        accept: ["Утром, проснувшись, пассажиры выходят на палубу.", "Утром пассажиры, проснувшись, выходят на палубу.", "Утром, проснувшись, пассажиры выходят на палубу теплохода."]
        rubric: ["[проснувшись]{.ru}：[-вшись]{.ru}", "现在时 [выходят]{.ru} 表示经常重复的动作", "[выходить на палубу]{.ru}"]
      - zh: 走了一整天以后，我们在河边休息。
        accept: ["Пройдя целый день, мы отдыхали у реки.", "Пройдя весь день, мы отдыхали у реки.", "Пройдя целый день, мы отдохнули у реки.", "Пройдя весь день, мы отдохнули на берегу реки.", "Пройдя целый день, мы отдохнули на берегу реки."]
        rubric: ["[пройдя]{.ru}：[-йти]{.ru} 类完成体副动词以 [-я]{.ru} 结尾", "[у реки]{.ru} 或 [на берегу реки]{.ru}"]

  - id: e7
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段，练习从句和副动词短语的互换。
    items:
      - prompt: "提纲：伏尔加河的长度；源头；流经的城市和入海口；游船旅行；纤夫和列宾；水电站；伏尔加河在文化中的地位。要求：至少用四处完成体副动词短语，其中至少两处由课文里的从句或并列谓语改写而来；至少用一处未完成体副动词。"
        length: 120–150
        model: "Волга — самая длинная река Европы: её длина — 3530 километров. Она начинается на Валдайской возвышенности маленьким ручьём, над которым стоит деревянная часовня. Приехав к истоку, туристы трогают воду. Набрав силу, Волга течёт мимо древних городов: Твери, Ярославля, Нижнего Новгорода. Соединившись с Камой, она поворачивает на юг и, миновав Астрахань, впадает в Каспийское море. Летом по реке ходят теплоходы. Пассажиры, осмотрев новый город, возвращаются на теплоход. Раньше Волга была главной торговой дорогой страны. Бурлаки тянули суда против течения, медленно шагая по берегу. Увидев их, Илья Репин написал знаменитую картину «Бурлаки на Волге». В двадцатом веке на реке построили гидроэлектростанции, изменившие её природу. О Волге написано множество песен и стихов, а русские называют её матушкой."
        rubric: ["提纲七项都有，数字和地名准确（3530 公里、里海）", "至少四处完成体副动词短语，主语与谓语一致", "至少一处未完成体副动词短语", "120–150 词"]
        notes: "范文约 130 词。完成体副动词：[приехав к истоку]{.ru}、[набрав силу]{.ru}、[соединившись с Камой]{.ru}、[миновав Астрахань]{.ru}、[осмотрев новый город]{.ru}、[увидев их]{.ru}；其中 [осмотрев … возвращаются]{.ru} 由课文的并列结构压缩而来，[увидев их, … написал]{.ru} 保留了课文的先后关系。未完成体：[медленно шагая по берегу]{.ru}。[изменившие её природу]{.ru} 是形动词短语，把课文的“修建了……但改变了……”压缩成一个短语。"
