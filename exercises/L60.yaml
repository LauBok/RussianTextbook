lesson: L60
heading: 单元测试
intro: 本测试覆盖第六单元全部语法。答对 80% 以上再进入第七单元；没有达到的，回到相应的课复习后重做。
grammar: "名词、人称代词、形容词、物主代词和指示代词第三格单数；要求第三格的动词；[нра́виться]{.ru}；年龄；[на́до, ну́жно, мо́жно, нельзя́]{.ru} + 不定式；[ну́жен, нужна́, ну́жно, нужны́]{.ru}；[к]{.ru}、[по]{.ru} + 第三格；无人称句；短尾形容词 [до́лжен, рад, за́нят, свобо́ден, здоро́в]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成第三格。
    why: 阳性硬辅音结尾加 [-у]{.ru}（第 1 题），[-ь]{.ru} 结尾变 [-ю]{.ru}（第 2 题）；阴性 [-а]{.ru} 变 [-е]{.ru}，[-ия]{.ru} 变 [-ии]{.ru}（第 3、4 题，名字和父称各自变）；[па́па]{.ru} 虽是阳性，按阴性变（第 5 题）；形容词和物主代词阳性用 [-ому / -ему]{.ru}，阴性用 [-ой / -ей]{.ru}（第 6、7 题），[мла́дший]{.ru}、[мой]{.ru} 不重读时写 [е]{.ru}。
    items:
      - stem: Что ты пода́ришь ___?
        hint: брат
        accept: [бра́ту]
      - stem: А́нна звони́т ___.
        hint: учи́тель
        accept: [учи́телю]
      - stem: Ма́ма передаёт приве́т ___.
        hint: Мари́я Никола́евна
        accept: [Мари́и Никола́евне]
      - stem: Ван Лэй идёт к ___.
        hint: О́льга Ви́кторовна
        accept: [О́льге Ви́кторовне]
      - stem: Ба́бушка звони́т ___ ка́ждый день.
        hint: па́па
        accept: [па́пе]
      - stem: А́нна подари́ла ___ игру́.
        hint: мла́дший брат
        accept: [мла́дшему бра́ту]
      - stem: Мне ну́жен пода́рок ___.
        hint: мой друг
        accept: [моему́ дру́гу]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "[нра́виться]{.ru} 和 [ну́жен]{.ru} 都跟被喜欢、被需要的东西变：[блины́]{.ru}、[сапоги́]{.ru} 是复数（第 1、4 题），[Кремль]{.ru} 是阳性（第 2 题），[ша́пка]{.ru} 是阴性（第 3 题），[пальто́]{.ru} 是中性（第 5 题）。第 2 题过去时也跟 [Кремль]{.ru} 一致，不管喜欢的人是男是女。第 6 题“谁喜欢”用第三格，[она́]{.ru} 的第三格是 [ей]{.ru}。"
    items:
      - stem: Тебе́ ___ блины́?
        options: [нра́вится, нра́вятся, нра́вишься]
        answer: нра́вятся
      - stem: А́нне о́чень ___ Кремль.
        options: [понра́вилась, понра́вился, понра́вилось]
        answer: понра́вился
      - stem: Ван Лэ́ю ___ ша́пка.
        options: [ну́жен, нужна́, нужны́]
        answer: нужна́
      - stem: А́нне ___ но́вые сапоги́.
        options: [нужна́, ну́жно, нужны́]
        answer: нужны́
      - stem: Тебе́ ___ тёплое пальто́.
        options: [ну́жен, ну́жно, нужна́]
        answer: ну́жно
      - stem: Му́рке нра́вится ры́ба. ___ и ноя́брь нра́вится!
        options: [Она́, Ей, Её]
        answer: Ей

  - id: e3
    type: fill
    task: 填 [год]{.ru}、[го́да]{.ru} 或 [лет]{.ru}。
    why: 由最后一个数词决定：以 [оди́н]{.ru} 结尾用 [год]{.ru}（第 3 题），以 [два, три, четы́ре]{.ru} 结尾用 [го́да]{.ru}（第 2、5 题），其余用 [лет]{.ru}。第 1 题 [четы́рнадцать]{.ru} 是一个词，不是 [четы́ре]{.ru}，用 [лет]{.ru}；第 4 题最后一个数词是 [пять]{.ru}。
    items:
      - stem: Ми́ше четы́рнадцать ___.
        accept: [лет]
      - stem: Му́рке три ___.
        accept: [го́да]
      - stem: В ма́е Ван Лэ́ю бу́дет два́дцать оди́н ___.
        accept: [год]
      - stem: Ба́бушке се́мьдесят пять ___.
        accept: [лет]
      - stem: Ему́ со́рок четы́ре ___.
        accept: [го́да]

  - id: e4
    type: rewrite
    task: 把句子改成过去时。
    placeholder: Вчера́ …
    example:
      cue: Сего́дня хо́лодно.
      answer: Вчера́ бы́ло хо́лодно.
    why: 没有第一格主语的句子（无人称句、[на́до]{.ru} + 不定式）过去时永远用 [бы́ло]{.ru}，不跟人变（第 1、2 题）；[ну́жен]{.ru} 句跟需要的东西变，[ша́пка]{.ru} 是阴性，用 [была́]{.ru}（第 3 题）；短尾形容词跟第一格主语变（第 4 题）。人用第三格时，最容易误把 [бы́ло]{.ru} 写成 [была́]{.ru}，[А́нне была́ ску́чно]{.ru} 是错的。
    items:
      - cue: Сего́дня А́нне ску́чно.
        accept: ["Вчера́ А́нне бы́ло ску́чно."]
      - cue: Сего́дня мне на́до рабо́тать.
        accept: ["Вчера́ мне на́до бы́ло рабо́тать.", "Вчера́ мне бы́ло на́до рабо́тать."]
      - cue: Сего́дня Ми́ше нужна́ ша́пка.
        accept: ["Вчера́ Ми́ше была́ нужна́ ша́пка.", "Вчера́ Ми́ше нужна́ была́ ша́пка."]
      - cue: Сего́дня ма́ма занята́.
        accept: ["Вчера́ ма́ма была́ занята́."]

  - id: e5
    type: choice
    task: 选择正确答案。
    why: 第 1 题去找人用 [к]{.ru} + 第三格，[в]{.ru} 用于去某个地方；第 2 题“俄语作业”用 [по]{.ru} + 第三格；第 3 题“沿街走”用 [по у́лице]{.ru}；第 4 题前一句说只能在厨房吃，房间里就是“不许”，用 [нельзя́]{.ru}，表示禁止时后面用未完成体；第 5 题主语 [А́нна]{.ru} 是女性，用 [должна́]{.ru}；第 6 题对老师说 [вы]{.ru}，虽然是一个人，短尾形容词用复数。
    items:
      - stem: У Ван Лэ́я температу́ра, и он идёт ___.
        options: [к врачу́, в врача́, на врача́]
        answer: к врачу́
      - stem: А́нна берёт зада́ние ___ ру́сскому языку́.
        options: [по, к, о]
        answer: по
      - stem: Ван Лэй идёт ___ у́лице.
        options: [по, к, на]
        answer: по
      - stem: Есть мо́жно то́лько на ку́хне. В ко́мнате ___ есть.
        options: [нельзя́, мо́жно, на́до]
        answer: нельзя́
      - stem: Извини́, я ___ идти́, ма́ма ждёт.
        options: [до́лжен, должна́, должны́]
        answer: должна́
      - stem: О́льга Ви́кторовна, вы сейча́с ___?
        options: [свобо́ден, свобо́дна, свобо́дны]
        answer: свобо́дны

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊喜欢莫斯科的街道、公园和地铁，不喜欢天气；米沙十一月二十号满十四岁，王磊送他足球；医生让王磊在家躺三天；王磊星期六很忙，星期天有空。
    items:
      - stem: Ван Лэ́ю не нра́вится ___.
        options: [пого́да, метро́]
        answer: пого́да
      - stem: Двадца́того ноября́ Ми́ше бы́ло ___.
        options: [четы́рнадцать лет, трина́дцать лет]
        answer: четы́рнадцать лет
      - stem: Ван Лэй подари́л Ми́ше ___.
        options: [футбо́льный мяч, компью́терную игру́]
        answer: футбо́льный мяч
      - stem: "Врач сказа́л: «Вам на́до ___»."
        options: [лежа́ть до́ма три дня, ходи́ть на заня́тия]
        answer: лежа́ть до́ма три дня
      - stem: В воскресе́нье Ван Лэй бу́дет ___.
        options: [свобо́ден, за́нят]
        answer: свобо́ден

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1、3 题的“我”和第 4 题的“奶奶”都要用第三格：[нра́виться]{.ru} 句里喜欢的东西作主语，谓语跟它一致；无人称句和年龄句没有第一格主语，过去时用 [бы́ло]{.ru}。第 2 题“给谁”用第三格，“送什么”用第四格。第 5 题“去找某人”用 [к]{.ru} + 第三格。
    items:
      - zh: 我喜欢莫斯科的公园。
        accept: ["Мне нра́вятся па́рки Москвы́.", "Мне нра́вятся моско́вские па́рки.", "Мне нра́вятся па́рки в Москве́.", "В Москве́ мне нра́вятся па́рки."]
        rubric: ["“我”用第三格 [мне]{.ru}", "主语 [па́рки]{.ru} 是复数，用 [нра́вятся]{.ru}"]
      - zh: 安娜送给弟弟一个新的电脑游戏。
        accept: ["А́нна подари́ла мла́дшему бра́ту но́вую компью́терную игру́.", "А́нна подари́ла бра́ту но́вую компью́терную игру́.", "А́нна да́рит мла́дшему бра́ту но́вую компью́терную игру́.", "А́нна да́рит бра́ту но́вую компью́терную игру́.", "А́нна пода́рит мла́дшему бра́ту но́вую компью́терную игру́.", "А́нна пода́рит бра́ту но́вую компью́терную игру́."]
        rubric: ["“给弟弟”用第三格 [(мла́дшему) бра́ту]{.ru}", "“游戏”用第四格 [но́вую компью́терную игру́]{.ru}"]
      - zh: 昨天我觉得很冷。
        accept: ["Вчера́ мне бы́ло хо́лодно.", "Мне вчера́ бы́ло хо́лодно.", "Вчера́ мне бы́ло о́чень хо́лодно."]
        rubric: ["无人称句，“我”用 [мне]{.ru}", "过去时用中性 [бы́ло]{.ru}"]
      - zh: 我奶奶七十五岁。
        accept: ["Мое́й ба́бушке се́мьдесят пять лет.", "Ба́бушке се́мьдесят пять лет."]
        rubric: ["年龄句里人用第三格 [(мое́й) ба́бушке]{.ru}", "[пять]{.ru} 后面用 [лет]{.ru}"]
      - zh: 晚上安娜去奥尔加·维克托罗夫娜那里。
        accept: ["Ве́чером А́нна идёт к О́льге Ви́кторовне.", "А́нна ве́чером идёт к О́льге Ви́кторовне.", "Ве́чером А́нна е́дет к О́льге Ви́кторовне."]
        rubric: ["去找人用 [к]{.ru} + 第三格", "名字和父称都变第三格：[О́льге Ви́кторовне]{.ru}"]

  - id: e8
    type: open
    task: 短文：介绍你的一位家人或朋友。
    items:
      - prompt: 写 6–8 句话：他（她）多大了，喜欢什么、不喜欢什么，需要什么，你打算送他（她）什么礼物，你常给他（她）打电话吗。
        length: 60–100
        model: "У меня́ есть мла́дший брат. Ему́ четы́рнадцать лет. Он у́чится в восьмо́м кла́ссе. Ему́ нра́вится футбо́л, а ка́ша ему́ не нра́вится. Ско́ро у него́ день рожде́ния. Ему́ ну́жен но́вый мяч, и я хочу́ подари́ть бра́ту футбо́льный мяч. Ка́ждое воскресе́нье я звоню́ ему́ и расска́зываю ему́ о Москве́. Ему́ всегда́ интере́сно."
        rubric: ["年龄、[нра́виться]{.ru}、[ну́жен]{.ru} 句里人用第三格", "[нра́вится / нра́вятся]{.ru}、[ну́жен / нужна́ / нужны́]{.ru} 跟主语一致", "[звони́ть]{.ru}、[дари́ть]{.ru}、[расска́зывать]{.ru} 接第三格", "[год / го́да / лет]{.ru} 用对"]
        notes: 范文从年龄、学校说起，接着写喜好、需要，再由“需要什么”自然引到送什么礼物，最后写平时的联系。几乎每句都有第三格：年龄、[нра́виться]{.ru}、[ну́жен]{.ru}、无人称句 [ему́ интере́сно]{.ru} 里的人，以及 [подари́ть бра́ту]{.ru}、[звоню́ ему́]{.ru} 的间接对象，正好复习本单元的重点。写自己的家人时可以换成 [сестра́]{.ru}、[ма́ма]{.ru}，这时注意改成阴性 [ей]{.ru}、[сестре́]{.ru}。
