lesson: L08
grammar: "疑问代词 [чей, чья, чьё, чьи]{.ru}；物主代词 [мой, твой, наш, ваш]{.ru} 随名词变化，[его́, её, их]{.ru} 不变。"
exercises:

  - id: e1
    type: choice
    task: 选择 [чей]{.ru}、[чья]{.ru}、[чьё]{.ru} 或 [чьи]{.ru}。
    why: "[чей]{.ru} 和句末的名词一致，中间隔着的 [э́то]{.ru} 不影响。[телефо́н]{.ru}、[слова́рь]{.ru} 是阳性；[матрёшка]{.ru}、[крова́ть]{.ru} 是阴性；[фо́то]{.ru}、[письмо́]{.ru} 是中性；[очки́]{.ru} 只有复数，[ключи́]{.ru} 是复数。第 6 题 [крова́ть]{.ru} 以 [-ь]{.ru} 结尾，是阴性，用 [чья]{.ru}。"
    items:
      - stem: ___ э́то телефо́н?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чей
      - stem: ___ э́то матрёшка?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чья
      - stem: ___ э́то фо́то?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чьё
      - stem: ___ э́то очки́?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чьи
      - stem: ___ э́то слова́рь?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чей
      - stem: ___ э́то крова́ть?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чья
      - stem: ___ э́то письмо́?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чьё
      - stem: ___ э́то ключи́?
        options: [Чей, Чья, Чьё, Чьи]
        answer: Чьи

  - id: e2
    type: fill
    task: 写出括号里物主代词的正确形式。
    why: "[твой]{.ru} 和 [мой]{.ru} 变法相同：[твой, твоя́, твоё, твои́]{.ru}。[наш]{.ru}、[ваш]{.ru} 的词尾是 [-а, -е, -и]{.ru}，重音在词干上：[на́ша, на́ше, на́ши]{.ru}。第 4 题 [очки́]{.ru} 是复数；第 6 题 [фо́то]{.ru} 是中性。"
    items:
      - stem: Э́то ___ кни́га?
        hint: твой
        accept: ["твоя́"]
      - stem: Вот ___ дом.
        hint: наш
        accept: ["наш"]
      - stem: Э́то ___ ко́мната.
        hint: ваш
        accept: ["ва́ша"]
      - stem: Па́па, вот ___ очки́!
        hint: твой
        accept: ["твои́"]
      - stem: Где ___ роди́тели?
        hint: ваш
        accept: ["ва́ши"]
      - stem: Э́то ___ фо́то.
        hint: наш
        accept: ["на́ше"]
      - stem: Ми́ша, где ___ телефо́н?
        hint: твой
        accept: ["твой"]

  - id: e3
    type: choice
    task: 选择 [его́]{.ru}、[её]{.ru} 或 [их]{.ru}。
    why: "[его́]{.ru}、[её]{.ru}、[их]{.ru} 看的是东西归谁，和后面名词的性、数无关。第 2 题 [кни́га]{.ru} 是阴性，但书是米沙的，仍用 [его́]{.ru}；第 3 题 [телефо́н]{.ru} 是阳性，但手机是安娜的，用 [её]{.ru}。这两题最容易受名词的性影响而选错。第 5 题物主是两个人，用 [их]{.ru}。"
    items:
      - stem: Э́то па́па. Э́то ___ очки́.
        options: [его́, её, их]
        answer: его́
      - stem: Э́то Ми́ша. Э́то ___ кни́га.
        options: [его́, её, их]
        answer: его́
      - stem: Э́то А́нна. Э́то ___ телефо́н.
        options: [его́, её, их]
        answer: её
      - stem: Э́то ма́ма. Э́то ___ ла́мпа.
        options: [его́, её, их]
        answer: её
      - stem: Э́то Ива́н Серге́евич и Мари́я Никола́евна. Э́то ___ ко́мната.
        options: [его́, её, их]
        answer: их
      - stem: Э́то Му́рка. Э́то ___ кре́сло.
        options: [его́, её, их]
        answer: её

  - id: e4
    type: rewrite
    task: 按提示回答“这是谁的”。
    placeholder: Э́то … .
    example:
      cue: Чья э́то кни́га? (А́нна)
      answer: Э́то её кни́га.
    why: 物主是第三人称时用不变的 [его́]{.ru}、[её]{.ru}、[их]{.ru}；物主是说话人自己时用 [мой]{.ru}，是对方时用 [твой]{.ru} 或 [ваш]{.ru}，这几个要和名词一致。第 4 题“我们的”加阳性名词 [телефо́н]{.ru}，用 [наш]{.ru}。
    items:
      - cue: Чей э́то телефо́н? (Ми́ша)
        accept: ["Э́то его́ телефо́н."]
      - cue: Чьи э́то очки́? (па́па)
        accept: ["Э́то его́ очки́."]
      - cue: Чьё э́то фо́то? (я)
        accept: ["Э́то моё фо́то."]
      - cue: Чей э́то телефо́н? (мы)
        accept: ["Э́то наш телефо́н."]
      - cue: Чья э́то ко́мната? (Ива́н Серге́евич и Мари́я Никола́евна)
        accept: ["Э́то их ко́мната."]
      - cue: Чьи э́то кни́ги? (ты)
        accept: ["Э́то твои́ кни́ги."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1 题“谁的”和 [кни́га]{.ru} 一致，用阴性 [чья]{.ru}；“她的”不变。第 2 题眼镜只有复数 [очки́]{.ru}，“你的”用 [твои́]{.ru}。第 3 题对王磊说话的是长辈，用 [ва́ша]{.ru}。
    items:
      - zh: ——这是谁的书？——是她的书。
        accept: ["— Чья э́то кни́га? — Э́то её кни́га.", "— Чья э́то кни́га? — Её.", "— Чья э́то кни́га? — Её кни́га."]
        rubric: ["“谁的”用阴性 [чья]{.ru}", "“她的”用不变的 [её]{.ru}"]
      - zh: 爸爸，这是你的眼镜！
        accept: ["Па́па, вот твои́ очки́!", "Па́па, э́то твои́ очки́!", "Па́па, вот они́, твои́ очки́!"]
        rubric: ["“眼镜”用复数 [очки́]{.ru}", "孩子对父亲说 [ты]{.ru}，用 [твои́]{.ru}"]
      - zh: 这是我们的套娃，现在它是您的了。
        accept: ["Э́то на́ша матрёшка, а тепе́рь она́ ва́ша.", "Э́то на́ша матрёшка. А тепе́рь она́ ва́ша.", "Э́то на́ша матрёшка. Тепе́рь она́ ва́ша.", "Э́то на́ша матрёшка, тепе́рь она́ ва́ша."]
        rubric: ["[матрёшка]{.ru} 是阴性，用 [на́ша]{.ru}、[ва́ша]{.ru}", "“现在（从此）”用 [тепе́рь]{.ru}"]
      - zh: 他在家。这是他的房间。
        accept: ["Он до́ма. Э́то его́ ко́мната.", "Он до́ма. Вот его́ ко́мната.", "Он до́ма, а э́то его́ ко́мната.", "Он до́ма, э́то его́ ко́мната."]
        rubric: ["“他”用 [он]{.ru}，“他的”用 [его́]{.ru}，不要混用"]
