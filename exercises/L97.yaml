lesson: L97
grammar: "限定代词 [весь, вся, всё, все]{.ru} 与名词性、数、格一致，[всё]{.ru}“一切”、[все]{.ru}“大家”可单独使用；[ка́ждый]{.ru} 按形容词变格；[весь день]{.ru} 表示持续，[ка́ждый день]{.ru} 表示反复，都用不带前置词的第四格。"
exercises:

  - id: e1
    type: fill
    task: 用 [весь]{.ru} 的正确形式填空。
    why: "[весь]{.ru} 和名词一致：[день]{.ru} 阳性 → [весь]{.ru}；[неде́ля]{.ru}、[зима́]{.ru} 阴性，第四格 → [всю]{.ru}；[у́тро]{.ru} 中性 → [всё]{.ru}；[Москва́]{.ru} 阴性第一格 → [вся]{.ru}。第 5 题 [в]{.ru} 在 [всём]{.ru} 前写成 [во]{.ru}，[до́ме]{.ru} 是第六格，[весь]{.ru} 也要用第六格 [всём]{.ru}。第 6 题“大家”用复数 [все]{.ru}，不要写成中性的 [всё]{.ru}。"
    items:
      - stem: Мы бы́ли в па́рке ___ день.
        hint: весь
        accept: [весь]
      - stem: ___ неде́лю А́нна занима́лась.
        hint: весь
        accept: [Всю]
      - stem: ___ у́тро шёл снег.
        hint: весь
        accept: [Всё]
      - stem: Зимо́й ___ Москва́ бе́лая.
        hint: весь
        accept: [вся]
      - stem: Во ___ до́ме бы́ло ти́хо.
        hint: весь
        accept: [всём]
      - stem: Смотри́, ___ ката́ются!
        hint: весь
        accept: [все]

  - id: e2
    type: fill
    task: 用 [ка́ждый]{.ru} 的正确形式填空。
    why: "[ка́ждый]{.ru} 按形容词硬变化，和名词的性、格一致。表示“每……”的时间用第四格：阳性非动物名词同第一格 [ка́ждый день]{.ru}，阴性 [ка́ждую зи́му]{.ru}，中性 [ка́ждое воскресе́нье]{.ru}。第 4 题 [в]{.ru} 后用第六格，第 5 题是主语，用第一格。"
    items:
      - stem: Я хожу́ в бассе́йн ___ день.
        hint: ка́ждый
        accept: [ка́ждый]
      - stem: А́нна ката́ется здесь ___ зи́му.
        hint: ка́ждый
        accept: [ка́ждую]
      - stem: Ра́ньше мы ходи́ли сюда́ ___ воскресе́нье.
        hint: ка́ждый
        accept: [ка́ждое]
      - stem: В ___ ко́мнате стои́т стол.
        hint: ка́ждый
        accept: [ка́ждой]
      - stem: ___ студе́нт получи́л уче́бник.
        hint: ка́ждый
        accept: [Ка́ждый]

  - id: e3
    type: choice
    task: 选择 [весь]{.ru} 或 [ка́ждый]{.ru} 的形式。
    why: "问“多久”（持续了多长时间）用 [весь]{.ru}：[весь день]{.ru} 一整天；问“多久一次”（反复）用 [ка́ждый]{.ru}：[ка́ждый день]{.ru} 每天。第 3 题“每一个小时喝一次”是反复；第 4 题“整个冬天都很冷”是持续。"
    items:
      - stem: Мы бы́ли на у́лице ___ день, с утра́ до ве́чера.
        options: [весь, ка́ждый]
        answer: весь
      - stem: Ми́ша игра́ет в футбо́л ___ суббо́ту.
        options: [всю, ка́ждую]
        answer: ка́ждую
      - stem: ___ час они́ пи́ли горя́чий чай.
        options: [Весь, Ка́ждый]
        answer: Ка́ждый
      - stem: В про́шлом году́ ___ зи́му бы́ло хо́лодно.
        options: [всю, ка́ждую]
        answer: всю
      - stem: Ван Лэй звони́т ма́ме ___ неде́лю.
        options: [всю, ка́ждую]
        answer: ка́ждую

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我们在那儿待了一整天。
        accept: ["Мы бы́ли там весь день.", "Весь день мы бы́ли там.", "Мы весь день бы́ли там.", "Мы там бы́ли весь день.", "Мы бы́ли там це́лый день."]
        rubric: ["“一整天”用 [весь день]{.ru}，不加前置词"]
      - zh: 莫斯科冬天四点天就黑了。
        accept: ["Зимо́й в Москве́ в четы́ре часа́ уже́ темно́.", "В Москве́ зимо́й в четы́ре часа́ уже́ темно́.", "Зимо́й в Москве́ в четы́ре уже́ темно́.", "Зимо́й в Москве́ уже́ в четы́ре часа́ темно́.", "Зимо́й в Москве́ уже́ в четы́ре темно́.", "В Москве́ зимо́й в четы́ре уже́ темно́."]
        rubric: ["无人称句 [темно́]{.ru}", "“四点”用 [в четы́ре часа́]{.ru}", "“就”用 [уже́]{.ru}"]
      - zh: 大家都在滑，你也能行。
        accept: ["Все ката́ются, и ты смо́жешь.", "Все ката́ются, ты то́же смо́жешь.", "Все ката́ются, и ты то́же смо́жешь."]
        rubric: ["“大家”用 [все]{.ru}，动词用复数 [ката́ются]{.ru}", "“能行”用 [смо́жешь]{.ru}"]
      - zh: 我每年冬天都在这儿滑冰。（男性说）
        accept: ["Я ката́юсь здесь ка́ждую зи́му.", "Ка́ждую зи́му я ката́юсь здесь.", "Ка́ждую зи́му я ката́юсь здесь на катке́.", "Я здесь ката́юсь ка́ждую зи́му.", "Я ка́ждую зи́му ката́юсь здесь.", "Ка́ждую зи́му я здесь ката́юсь."]
        rubric: ["[ка́ждую зи́му]{.ru} 第四格", "反复的动作用未完成体 [ката́юсь]{.ru}"]

  - id: e5
    type: open
    task: 缩写。
    items:
      - prompt: 按下面的问题回答，连成一段话：星期六安娜和王磊什么时候出门？天怎么样？他们先去了哪儿，在那儿做了什么？后来去了哪儿？什么时候回家？
        length: 50–80
        model: |
          В суббо́ту А́нна и Ван Лэй отдыха́ли весь день. В де́вять часо́в утра́ они́ пое́хали в Коло́менское. На у́лице бы́ло ещё темно́: зимо́й в Москве́ со́лнце встаёт то́лько в де́вять. В Коло́менском всё бы́ло бе́лое. Они́ до́лго гуля́ли в па́рке и ка́ждый час пи́ли горя́чий чай. Пото́м они́ пое́хали на като́к в парк Го́рького. Ван Лэй ката́лся пе́рвый раз. Домо́й они́ пое́хали то́лько в семь часо́в ве́чера.
        rubric: ["至少用一次 [весь]{.ru} 的某个形式和一次 [ка́ждый]{.ru}", "按时间顺序：早上—科洛缅斯科耶—滑冰场—晚上", "对话里的内容改成叙述"]
        notes: 缩写按时间顺序写，每个地点用一两句话交代做了什么。安娜和王磊的对话不必照搬，只取信息：天黑是因为冬天太阳升得晚，王磊是第一次滑冰。出发用 [пое́хали]{.ru}，持续的活动用未完成体 [гуля́ли, пи́ли, ката́лся]{.ru}。
