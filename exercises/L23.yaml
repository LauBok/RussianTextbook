lesson: L23
grammar: "形容词单数第四格：阴性 [-ую]{.ru}（[-юю]{.ru}），阳性动物 [-ого]{.ru}（[-его]{.ru}），阳性非动物和中性同第一格；[мой, наш, э́тот, чей]{.ru} 等代词第四格：[мою́, на́шу, э́ту, чью]{.ru}，[моего́, э́того]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词组变成第四格填空。
    why: 阴性词组形容词变 [-ую]{.ru}、名词变 [-у]{.ru}，两处都要变，最常见的错误是只变一处，如 *[интере́сная кни́гу]{.ru}。阳性非动物名词（第 2、5 题）和中性名词（第 6 题）连同形容词都不变。第 7 题 [студе́нт]{.ru} 是动物名词，形容词变 [-ого]{.ru}，名词加 [-а]{.ru}。
    items:
      - stem: Я чита́ю ___.
        hint: интере́сная кни́га
        accept: [интере́сную кни́гу]
      - stem: Ми́ша покупа́ет ___.
        hint: но́вый журна́л
        accept: [но́вый журна́л]
      - stem: Ван Лэй и́щет ___.
        hint: ру́сская кла́ссика
        accept: [ру́сскую кла́ссику]
      - stem: А́нна покупа́ет ___.
        hint: краси́вая откры́тка
        accept: [краси́вую откры́тку]
      - stem: Мы смо́трим ___.
        hint: ру́сский фильм
        accept: [ру́сский фильм]
      - stem: Мы смо́трим ___.
        hint: но́вое фо́то
        accept: [но́вое фо́то]
      - stem: Ты зна́ешь ___?
        hint: но́вый студе́нт
        accept: [но́вого студе́нта]
      - stem: О́льга Ви́кторовна чита́ет ___.
        hint: коро́ткая ска́зка
        accept: [коро́ткую ска́зку]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 先看名词的性和是否是动物：[кни́гу]{.ru}、[ма́му]{.ru}、[откры́тку]{.ru} 是阴性第四格，代词用 [э́ту]{.ru}、[мою́]{.ru}、[на́шу]{.ru}；[журна́л]{.ru} 是阳性非动物，代词不变；[дру́га]{.ru} 是阳性动物，代词用 [моего́]{.ru}。第 6 题说的是普希金的童话，用 [его́]{.ru}；[его́]{.ru} 作物主代词永远不变，不随 [ска́зку]{.ru} 变格。
    items:
      - stem: Я покупа́ю ___ кни́гу.
        options: [э́та, э́ту, э́того]
        answer: э́ту
      - stem: Ты зна́ешь ___ ма́му?
        options: [моя́, мою́, моего́]
        answer: мою́
      - stem: Вы покупа́ете ___ журна́л?
        options: [э́тот, э́ту, э́того]
        answer: э́тот
      - stem: Я жду ___ дру́га.
        options: [мой, мою́, моего́]
        answer: моего́
      - stem: Мы и́щем ___ откры́тку.
        options: [на́ша, на́шу, на́шего]
        answer: на́шу
      - stem: — Ты зна́ешь Пу́шкина? — Да, я чита́л ___ ска́зку.
        options: [его́, её]
        answer: его́

  - id: e3
    type: rewrite
    task: 按提示回答问题。
    example:
      cue: Каку́ю кни́гу ты чита́ешь? (интере́сная)
      answer: Я чита́ю интере́сную кни́гу.
    why: 问句里的 [каку́ю]{.ru}、[како́й]{.ru} 已经提示了第四格：[каку́ю]{.ru} 对应阴性 [-ую]{.ru}，[како́й]{.ru}（阳性非动物）对应不变的形式。回答时形容词和名词都要和问句的名词一致。
    items:
      - cue: Каку́ю откры́тку покупа́ет А́нна? (краси́вая)
        accept: [А́нна покупа́ет краси́вую откры́тку.]
      - cue: Како́й журна́л ты и́щешь? (но́вый)
        accept: [Я ищу́ но́вый журна́л.]
      - cue: Каку́ю ска́зку чита́ет Ми́ша? (ру́сская)
        accept: [Ми́ша чита́ет ру́сскую ска́зку.]
      - cue: Каку́ю кни́гу покупа́ет Ван Лэй? (хоро́шая)
        accept: [Ван Лэй покупа́ет хоро́шую кни́гу.]
      - cue: Како́й фильм вы смо́трите? (интере́сный)
        accept: ["Мы смо́трим интере́сный фильм.", "Я смотрю́ интере́сный фильм."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题“在找”用 [иска́ть]{.ru}，变位是 [ищу́, и́щешь]{.ru}。第 3 题“买普希金”就是买他的书，[Пу́шкин]{.ru} 按动物名词变成 [Пу́шкина]{.ru}。第 4 题 [кни́гу]{.ru} 前的 [э́ту]{.ru} 和后面的 [о кино́]{.ru} 都不能漏。
    items:
      - zh: 我在找一本有意思的俄罗斯童话。
        accept: ["Я ищу́ интере́сную ру́сскую ска́зку.", "Я ищу́ ру́сскую интере́сную ска́зку."]
        rubric: ["[иска́ть]{.ru} 的变位 [ищу́]{.ru}", "两个形容词都用 [-ую]{.ru}"]
      - zh: 你认识我的朋友米沙吗？
        accept: ["Ты зна́ешь моего́ дру́га Ми́шу?", "Вы зна́ете моего́ дру́га Ми́шу?"]
        rubric: ["[моего́ дру́га]{.ru} 用阳性动物第四格", "[Ми́ша]{.ru} 变成 [Ми́шу]{.ru}"]
      - zh: 我朋友买普希金。
        accept: ["Мой друг покупа́ет Пу́шкина."]
        rubric: ["[Пу́шкина]{.ru} 用动物名词第四格"]
      - zh: 安娜在买这本关于电影的书。
        accept: ["А́нна покупа́ет э́ту кни́гу о кино́."]
        rubric: ["[э́ту кни́гу]{.ru} 都变第四格", "[кино́]{.ru} 不变格"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你和朋友在书店里。编一段 6–8 句的对话：互相问在找什么、买什么，说说书或杂志是什么样的，最后和售货员确认要买的东西。
        length: 50–80
        model: |
          — Что ты и́щешь?
          — Я ищу́ интере́сную кни́гу о Москве́. А ты?
          — А я покупа́ю но́вый журна́л и ру́сскую ска́зку.
          — Вот хоро́шая кни́га о Москве́!
          — Отли́чно, я покупа́ю э́ту кни́гу.
          — Вы покупа́ете э́ту кни́гу, э́тот журна́л и э́ту ска́зку?
          — Да.
          — Хоро́ший вы́бор!
        rubric: ["至少三个“形容词 / 代词 + 名词”的第四格词组，其中至少两个阴性", "[иска́ть]{.ru}、[покупа́ть]{.ru} 变位正确", 只用已学的时和格]
        notes: 范文前半段两人互问，后半段售货员确认。阴性第四格 [интере́сную кни́гу]{.ru}、[ру́сскую ска́зку]{.ru}、[э́ту кни́гу]{.ru} 形容词和名词都变；阳性非动物 [но́вый журна́л]{.ru}、[э́тот журна́л]{.ru} 不变，两类放在一起对比。[Вот хоро́шая кни́га]{.ru} 不是宾语，所以用第一格。
