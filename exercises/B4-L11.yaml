lesson: B4-L11
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Какие звуки и картины весенней грозы описывает поэт? Как в последней строфе меняется взгляд на грозу? Что, по мнению Тютчева, нельзя сделать с Россией и что можно?]{.ru}"
        length: 100–140
        model: "В стихотворении «Весенняя гроза» поэт описывает первый весенний гром, который грохочет в голубом небе, как будто играет. Потом брызнул дождик, полетела пыль, на ветках повисли капли дождя, и солнце сделало золотыми нити дождя. С горы бежит быстрый поток, в лесу шумят птицы, и всё весело вторит грому. В последней строфе поэт смотрит на грозу иначе: он переходит от природы к мифу. Ему кажется, что ветреная богиня Геба, которая кормила орла Зевса, засмеялась и пролила на землю кубок, полный грома. Во втором стихотворении Тютчев говорит, что Россию нельзя понять умом и нельзя измерить общей мерой, потому что она особенная. В Россию можно только верить. В этом стихотворении есть противопоставление рассудка и веры."
        rubric: ["答出雷、雨、阳光、溪流、鸟叫等至少四种声音或景象", "指出最后一节从自然转向神话", "第 3 题答出“理智不能理解、通用标准不能衡量、只能信仰”"]
        notes: "第 1 题可以按诗节顺序回答：雷声—雨和阳光—溪流和鸟叫。第 2 题的关键是“神话”（[миф]{.ru}）：雷雨被想象成女神洒下的一杯酒。第 3 题注意 [нельзя]{.ru} 加完成体不定式表示“不可能”，正好对应诗里的 [не понять, не измерить]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[проворный]{.ru}"
        accept: ["Быстрый и лёгкий в движениях.", "Быстрый.", "Такой, который быстро двигается."]
        rubric: ["说明“敏捷、迅速”"]
      - zh: "[вторить]{.ru}"
        accept: ["Повторять за кем-то.", "Повторять звуки или слова за другими.", "Отвечать таким же звуком."]
        rubric: ["说明是跟着别人重复、应和"]
      - zh: "[гам]{.ru}"
        accept: ["Громкий шум многих голосов.", "Шум, крик.", "Громкий шум, в котором много голосов."]
        rubric: ["说明是许多声音混在一起的喧闹"]
      - zh: "[аршин]{.ru}"
        accept: ["Старая русская мера длины.", "Старая мера длины, около семидесяти сантиметров.", "Старая мера длины."]
        rubric: ["说明是旧时的长度单位"]
      - zh: "[афоризм]{.ru}"
        accept: ["Короткая и точная мысль, которую легко запомнить.", "Короткое мудрое выражение.", "Краткое выражение глубокой мысли."]
        rubric: ["说明是简短、含义深刻、便于记忆的话"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题扬抑格的音步是“重—轻”，重音在第一个音节。第 2、3 题两首诗多音节词的重音都在偶数音节上，是四音步抑扬格；第 12 行开头的 [всё]{.ru} 是单音节词上的格外重音，不能据此判断为扬抑格。第 4 题重复相同辅音是头韵 [аллитерация]{.ru}，不是韵（韵在行末），也不是对照。第 5 题头韵是声音描绘 [звукопись]{.ru} 的一种手法。第 6 题简短、完整、被广泛引用的诗句成了格言 [афоризм]{.ru}。第 7 题赫柏是古希腊神话中的青春女神。第 8 题最后一节从自然景物转向神话。第 9 题首行的 [умом]{.ru}（理智）和末行的 [верить]{.ru}（信仰）对立，这是全诗的核心。第 10 题 [у ней]{.ru} 即 [у неё]{.ru}，指俄罗斯，阴性。"
    items:
      - stem: В хорее ударным является ___ слог стопы.
        options: [первый, второй]
        answer: первый
      - stem: Стихотворение «Весенняя гроза» написано четырёхстопным ___.
        options: [ямбом, хореем]
        answer: ямбом
      - stem: Стихотворение «Умом Россию не понять» написано четырёхстопным ___.
        options: [ямбом, хореем]
        answer: ямбом
      - stem: Повтор одних и тех же звуков в начале слов «гроза», «гром», «грохочет» — это ___.
        options: [аллитерация, рифма, антитеза]
        answer: аллитерация
      - stem: Аллитерация — один из приёмов ___.
        options: [звукописи, рифмовки, композиции]
        answer: звукописи
      - stem: Строки «Умом Россию не понять» стали ___, их часто повторяют.
        options: [афоризмом, рифмовкой, аллитерацией]
        answer: афоризмом
      - stem: Геба — это ___ из греческой мифологии.
        options: [богиня, царица, птица]
        answer: богиня
      - stem: В последней строфе поэт переходит от описания природы к ___.
        options: [мифу, истории, рассказу о себе]
        answer: мифу
      - stem: Антитезу к слову «умом» в первой строке составляет слово ___ в последней строке.
        options: [верить, можно, только]
        answer: верить
      - stem: «У ней» — это старая форма выражения ___.
        options: [у неё, у них, у него]
        answer: у неё

  - id: e4
    type: open
    task: 划分《春雷》第 9–12 行的音步。用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，写出虚重和格外重音的位置。
    why: "《春雷》全诗格律划分（/ 隔开音步，带重音符的是重读音节）：第 1 行 [лю-блю́ / гро-зу́ / вна-ча́ / ле-ма́ / я]{.ru .syl}，无虚重；第 2 行 [ко-гда́ / ве-се́н / ний-пе́р / вый-гром]{.ru .syl}，无虚重；第 3 行 [как-бы / рез-вя́ / ся-и / иг-ра́ / я]{.ru .syl}，虚重在第 1、3 音步；第 4 行 [гро-хо́ / чет-вне́ / бе-го / лу-бо́м]{.ru .syl}，第 3 音步；第 5 行 [гре-мя́т / рас-ка́ / ты-мо / ло-ды́ / е]{.ru .syl}，第 3 音步；第 6 行 [вот-до́ж / дик-бры́з / нул-пыль / ле-ти́т]{.ru .syl}，无虚重；第 7 行 [по-ви́с / ли-пе́р / лы-до / жде-вы́ / е]{.ru .syl}，第 3 音步；第 8 行 [и-со́лн / це-ни́ / ти-зо / ло-ти́т]{.ru .syl}，第 3 音步；第 9 行 [сго-ры́ / бе-жи́т / по-то́к / про-во́р / ный]{.ru .syl}，无虚重；第 10 行 [вле-су́ / не-мо́лк / нет-пти́ / чий-гам]{.ru .syl}，无虚重；第 11 行 [и-гам / лес-но́й / и-шум / на-го́р / ный]{.ru .syl}，无虚重；第 12 行 [всё-вто́ / рит-ве́ / се-ло / гро-ма́м]{.ru .syl}，第 3 音步，[всё]{.ru} 为格外重音；第 13 行 [ты-ска́ / жешь-ве́ / тре-на / я-ге́ / ба]{.ru .syl}，第 3 音步；第 14 行 [кор-мя́ / зе-ве́ / со-ва / ор-ла́]{.ru .syl}，第 3 音步；第 15 行 [гро-мо / ки-пя́ / щий-ку́ / бок-сне́ / ба]{.ru .syl}，第 1 音步；第 16 行 [сме-я́сь / на-зе́м / лю-про / ли-ла́]{.ru .syl}，第 3 音步。单数行阴性韵，双数行阳性韵。《用理智无法理解俄罗斯》：第 1 行 [у-мо́м / рос-си́ / ю-не / по-ня́ть]{.ru .syl}，第 3 音步虚重，阳性韵；第 2 行 [ар-ши́ / ном-о́б / щим-не / из-ме́ / рить]{.ru .syl}，第 3 音步，阴性韵；第 3 行 [у-ней / о-со́ / бен-на / я-стать]{.ru .syl}，第 3 音步，阳性韵；第 4 行 [врос-си́ / ю-мо́ж / но-то́ль / ко-ве́ / рить]{.ru .syl}，无虚重，阴性韵。"
    items:
      - prompt: "[С горы́ бежи́т пото́к прово́рный, / В лесу́ не мо́лкнет пти́чий гам, / И гам лесно́й, и шум наго́рный — / Всё вто́рит ве́село грома́м…]{.ru}"
        length: 4–8
        model: |-
          9: ∪ — / ∪ — / ∪ — / ∪ — / ∪ (пиррихия нет)

          10: ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

          11: ∪ — / ∪ — / ∪ — / ∪ — / ∪ (пиррихия нет)

          12: — — / ∪ — / ∪ ∪ / ∪ — (лишнее ударение на первом слоге, пиррихий в третьей стопе)
        rubric: ["第 9–11 行四个重音全部落实", "第 12 行第 1 音节 [всё]{.ru} 是格外重音，第 3 音步虚重", "第 9、11 行阴性韵，第 10、12 行阳性韵"]
        notes: "音节划分：[сго-ры́ / бе-жи́т / по-то́к / про-во́р / ный]{.ru .syl}；[вле-су́ / не-мо́лк / нет-пти́ / чий-гам]{.ru .syl}；[и-гам / лес-но́й / и-шум / на-го́р / ный]{.ru .syl}；[всё-вто́ / рит-ве́ / се-ло / гро-ма́м]{.ru .syl}。第 10、11 行的单音节名词 [гам, шум]{.ru} 处在重音位置上，按重读计。第 12 行开头两个重音相连，不要因此把整行判断为扬抑格：后面三个多音节词的重音都在偶数音节上。"

  - id: e5
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [грохотать]{.ru} 变位时 [т]{.ru} 换成 [ч]{.ru}：[грохочет]{.ru}。第 2 题主语 [дождик]{.ru} 阳性，完成体过去时 [брызнул]{.ru}。第 3 题主语 [капли]{.ru} 复数，[повиснуть]{.ru} 过去时去掉 [-ну-]{.ru}：[повисли]{.ru}。第 4 题 [вторить]{.ru} 第二变位，主语 [птицы]{.ru} 复数：[вторят]{.ru}，后面接第三格 [грому]{.ru}。第 5 题 [пролить]{.ru} 过去时阴性重音在词尾：[пролила]{.ru}。第 6 题 [золотить]{.ru} 第二变位，第三人称单数 [золотит]{.ru}。"
    items:
      - stem: Над лесом ___ первый весенний гром.
        hint: грохотать
        accept: ["грохочет"]
      - stem: Вдруг ___ дождик, и на дороге полетела пыль.
        hint: брызнуть
        accept: ["брызнул"]
      - stem: На ветках ___ капли дождя.
        hint: повиснуть
        accept: ["повисли"]
      - stem: Птицы весело ___ грому.
        hint: вторить
        accept: ["вторят"]
      - stem: Девочка засмеялась и ___ воду на пол.
        hint: пролить
        accept: ["пролила"]
      - stem: Вечернее солнце ___ крыши домов.
        hint: золотить
        accept: ["золотит"]

  - id: e6
    type: open
    task: 概要写作。用俄语散文转述《春雷》的内容，并说明最后一节的形象，150 词左右。
    items:
      - prompt: "[Перескажите стихотворение «Весенняя гроза» прозой.]{.ru}"
        length: 130–170
        model: "Поэт говорит, что любит грозу в начале мая, когда первый весенний гром грохочет в голубом небе, как будто играет и смеётся. Раскаты грома звучат молодо и громко. Вот брызнул дождик, и по дороге полетела пыль. На листьях и ветках повисли капли дождя, похожие на жемчуг, а солнце делает нити дождя золотыми. После дождя с горы бежит быстрый поток, в лесу громко кричат птицы. Шум леса и шум воды в горах соединяются, и вся природа весело отвечает грому. В последней строфе поэт обращается к читателю и предлагает посмотреть на грозу как на миф. Можно подумать, говорит он, что молодая и ветреная богиня Геба кормила орла Зевса, засмеялась и случайно пролила с неба на землю кубок, полный грома. Так весенняя гроза становится образом молодости и радости."
        rubric: ["按四节顺序转述：雷声—雨和阳光—溪流和鸟叫—神话", "说明最后一节的形象：女神洒下的酒杯", "恢复散文语序，不照抄诗句", "130–170 词"]
        notes: "范文约 160 词。转述时把诗中的比喻说明白：[перлы дождевые]{.ru} 改写为 [капли дождя, похожие на жемчуг]{.ru}；[Громокипящий кубок]{.ru} 改写为 [кубок, полный грома]{.ru}。最后一句点出全诗的主题：春天和青春。"

  - id: e7
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的短文。
    items:
      - prompt: "[Можно ли понять другую страну умом?]{.ru} 结合丘特切夫的四行诗和你学俄语、了解俄罗斯（或别的国家）的经历，谈谈你的看法。"
        length: 250–300
        model: "Строки Тютчева «Умом Россию не понять» знает, кажется, каждый русский. Их часто повторяют и с гордостью, и с улыбкой. Но можно ли на самом деле понять чужую страну умом? Когда я начал учить русский язык, мне казалось, что можно. Я читал учебники истории, учил падежи, смотрел новости и думал, что скоро буду знать о России всё. Конечно, всё это было полезно. Книги объяснили мне, почему в Москве так много церквей, почему русские так любят Пушкина и почему праздник Победы для них так важен. Без этих знаний я бы понимал гораздо меньше. Однако когда я приехал в Москву, я увидел, что знания — это только начало. Я не мог объяснить себе, почему незнакомые люди в метро не улыбаются, а дома у друзей встречают гостя так тепло, как родного. Я не понимал, почему разговор на кухне может продолжаться до трёх часов ночи. Меня удивляло, что одно и то же слово, например «ничего», может значить и «хорошо», и «плохо», и «не обращай внимания». Эти вещи нельзя было «измерить общим аршином». Их можно было только почувствовать, прожив рядом с людьми какое-то время. Помню, как соседка-старушка, которая никогда со мной не здоровалась, однажды зимой принесла мне банку варенья, потому что услышала, что я болею. Поэтому я думаю, что Тютчев прав не во всём. Умом можно понять очень многое: историю, язык, законы. Но понять характер народа, его шутки и его песни можно только сердцем. Для этого нужны время, уважение и желание видеть в другом человеке не «иностранца», а просто человека. Мне кажется, что это относится не только к России. Любую страну по-настоящему понимаешь тогда, когда начинаешь её любить."
        rubric: ["开头引用诗句，提出问题", "既承认理智、知识的作用，也说明其局限（让步结构）", "有具体的个人经历或例子", "结论明确，并与诗句呼应", "250–300 词"]
        notes: "范文约 280 词。结构：引诗提问 → 正面：书本知识有用（[Конечно, всё это было полезно]{.ru}）→ 转折：亲身经历中无法“理解”的现象（[Однако…]{.ru}）→ 结论：诗人“并非全对”。范文借用了诗中的说法 [измерить общим аршином]{.ru}，把诗句化进自己的论证，比单纯引用更自然。"
