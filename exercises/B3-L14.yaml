lesson: B3-L14
grammar: "副动词短语的意义：时间（[когда, после того как]{.ru}）、原因（[так как, потому что]{.ru}）、条件（[если]{.ru}）、方式和伴随、让步（[хотя]{.ru}，常带 [даже]{.ru}）；意义由上下文决定，改成从句时据此选连词。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Где находится Казань и сколько в ней жителей? Почему Казань называют городом двух культур? Что можно увидеть в Казанском кремле? Какие блюда татарской кухни можно попробовать в Казани? Что можно увидеть в Старо-Татарской слободе? Кто учился и работал в Казанском университете?]{.ru}"
        length: 70–100
        model: "Казань — столица Республики Татарстан. Она стоит на левом берегу Волги, там, где в неё впадает Казанка. В 2021 году в городе жило около 1,3 миллиона человек. Здесь встречаются две культуры, татарская и русская, и две религии, ислам и православие, а государственными языками являются татарский и русский. В Казанском кремле стоят рядом Благовещенский собор и мечеть Кул-Шариф, а недалеко от них — башня Сююмбике. В Казани можно попробовать эчпочмак и чак-чак. В Старо-Татарской слободе стоят деревянные дома с резными наличниками, купеческие особняки и старые мечети. В Казанском университете учился Лев Толстой, а ректором почти двадцать лет был математик Николай Лобачевский."
        rubric: ["六个问题都回答，数字和人名准确", "[являться чем]{.ru} 或 [стоять рядом]{.ru} 等用法正确", "用完整的句子"]
        notes: "范文约 95 词。第 2 题至少说出两点：两种文化、两种宗教、两种语言。第 3 题的建筑名称是专有名词，注意大写。"

  - id: e2
    type: choice
    task: 把副动词短语改成从句时，应该用哪个连词？
    why: "看副动词和谓语之间的意义关系。第 1 题不认识路是去问人的原因 → [так как]{.ru}。第 2 题有 [даже]{.ru}，而且结果与预期相反（住了很多年却没学会）→ [хотя]{.ru}。第 3 题散步时遇见朋友，单纯的时间关系 → [когда]{.ru}。第 4 题谓语是将来时，“提前买票”是“不用排队”的前提 → [если]{.ru}。第 5 题怕迟到是坐出租车的原因 → [так как]{.ru}。第 6 题有 [даже]{.ru}，“累了还继续走”与预期相反 → [хотя]{.ru}。"
    items:
      - stem: "Не зная дороги, мы спросили местного жителя. → ___ мы не знали дороги, мы спросили местного жителя."
        options: [Когда, Так как, Если, Хотя]
        answer: Так как
      - stem: "Даже живя в Казани много лет, он так и не выучил татарский язык. → ___ он жил в Казани много лет, он так и не выучил татарский язык."
        options: [Когда, Так как, Если, Хотя]
        answer: Хотя
      - stem: "Гуляя по улице Баумана, мы встретили друзей. → ___ мы гуляли по улице Баумана, мы встретили друзей."
        options: [Когда, Так как, Если, Хотя]
        answer: Когда
      - stem: "Купив билеты заранее, вы не будете стоять в очереди. → ___ вы купите билеты заранее, вы не будете стоять в очереди."
        options: [Хотя, Так как, Если, Пока]
        answer: Если
      - stem: "Боясь опоздать на поезд, мы взяли такси. → ___ мы боялись опоздать на поезд, мы взяли такси."
        options: [Когда, Так как, Если, Хотя]
        answer: Так как
      - stem: "Даже устав, туристы продолжали подниматься на холм. → ___ туристы устали, они продолжали подниматься на холм."
        options: [Когда, Так как, Если, Хотя]
        answer: Хотя

  - id: e3
    type: rewrite
    task: 把副动词短语改成从句。先判断它的意义（时间、原因、条件、让步），再选连词。
    example:
      cue: Не желая выходить замуж за Ивана Грозного, царица бросилась с башни.
      answer: Так как царица не хотела выходить замуж за Ивана Грозного, она бросилась с башни.
    why: "第 1 题原因：[зная]{.ru} 表示知识，是做事的原因，用 [так как]{.ru} 或 [потому что]{.ru}（[потому что]{.ru} 引出的从句放在主句后面）。第 2 题条件：谓语是 [можно]{.ru} 加不定式，“六月来”是前提，用 [если]{.ru}，主语泛指，用第二人称 [приедешь]{.ru} 或 [приехать]{.ru} 都可以。第 3 题让步：[даже]{.ru} 是标志，用 [хотя]{.ru}。第 4 题时间：完成体副动词表示先后，用 [после того как]{.ru} 或 [когда]{.ru}，从句用完成体 [спустились]{.ru}。"
    items:
      - cue: Хорошо зная историю Казани, наш друг показал нам самые интересные места.
        accept: ["Так как наш друг хорошо знал историю Казани, он показал нам самые интересные места.", "Наш друг показал нам самые интересные места, потому что хорошо знал историю Казани."]
      - cue: Приехав в Казань в июне, можно попасть на Сабантуй.
        accept: ["Если приедешь в Казань в июне, можно попасть на Сабантуй.", "Если приехать в Казань в июне, можно попасть на Сабантуй.", "Если вы приедете в Казань в июне, вы можете попасть на Сабантуй.", "Если ты приедешь в Казань в июне, ты сможешь попасть на Сабантуй.", "Если вы приедете в Казань в июне, вы сможете попасть на Сабантуй."]
      - cue: Даже не зная татарского языка, гость быстро запоминает несколько татарских слов.
        accept: ["Хотя гость не знает татарского языка, он быстро запоминает несколько татарских слов.", "Хотя гость не знает татарский язык, он быстро запоминает несколько татарских слов."]
      - cue: Спустившись из кремля, мы пошли на улицу Баумана.
        accept: ["После того как мы спустились из кремля, мы пошли на улицу Баумана.", "Когда мы спустились из кремля, мы пошли на улицу Баумана."]

  - id: e4
    type: rewrite
    task: 把从句改写成副动词短语。
    example:
      cue: Когда туристы гуляют по центру Казани, они видят много мечетей и церквей.
      answer: Гуляя по центру Казани, туристы видят много мечетей и церквей.
    why: "四句的主从句主语都相同，所以都能改。连词的意思由副动词短语承担，改写后连词消失：第 1 题原因 [так как … не знали → не зная]{.ru}；第 2 题条件 [если поднимешься → поднявшись]{.ru}，完成体；第 3 题让步：[хотя … не татары → не будучи татарами]{.ru}，[будучи]{.ru} 后用第五格，前面可以加 [даже]{.ru} 加强让步意义；第 4 题时间 [после того как попробовали → попробовав]{.ru}。"
    items:
      - cue: Так как мы не знали татарского языка, мы читали названия по-русски.
        accept: ["Не зная татарского языка, мы читали названия по-русски.", "Не зная татарский язык, мы читали названия по-русски.", "Мы, не зная татарского языка, читали названия по-русски."]
      - cue: Если поднимешься на холм, увидишь весь кремль.
        accept: ["Поднявшись на холм, увидишь весь кремль.", "Поднявшись на холм, ты увидишь весь кремль."]
      - cue: Хотя многие казанцы не татары, они знают татарские песни.
        accept: ["Не будучи татарами, многие казанцы знают татарские песни.", "Многие казанцы, не будучи татарами, знают татарские песни.", "Даже не будучи татарами, многие казанцы знают татарские песни.", "Многие казанцы, даже не будучи татарами, знают татарские песни."]
      - cue: После того как гости попробовали чак-чак, они купили его в подарок родным.
        accept: ["Попробовав чак-чак, гости купили его в подарок родным.", "Гости, попробовав чак-чак, купили его в подарок родным."]

  - id: e5
    type: translate
    task: 翻译下列句子，用副动词短语，注意它表示的意义。
    items:
      - zh: 王后不愿意嫁给伊凡雷帝，从塔上跳了下去。（原因）
        accept: ["Не желая выходить замуж за Ивана Грозного, царица бросилась с башни.", "Царица, не желая выходить замуж за Ивана Грозного, бросилась с башни.", "Не желая выходить замуж за Ивана Грозного, царица бросилась с этой башни."]
        rubric: ["[не желая]{.ru}：[хотеть]{.ru} 没有副动词，用 [желать]{.ru}", "[выходить замуж за кого]{.ru}：[за]{.ru} + 第四格", "[броситься с башни]{.ru}：[с]{.ru} + 第二格"]
      - zh: 如果六月来喀山，就能赶上撒班节。（条件）
        accept: ["Приехав в Казань в июне, можно попасть на Сабантуй.", "Приехав в Казань в июне, вы попадёте на Сабантуй.", "Приехав в Казань в июне, вы сможете попасть на Сабантуй.", "Приехав в июне в Казань, можно попасть на Сабантуй."]
        rubric: ["[приехав]{.ru}：完成体副动词表示条件", "[попасть на Сабантуй]{.ru}：[на]{.ru} + 第四格"]
      - zh: 客人即使不懂鞑靼语，也很快记住了几个鞑靼词。（让步）
        accept: ["Даже не зная татарского языка, гость быстро запомнил несколько татарских слов.", "Даже не зная татарский язык, гость быстро запомнил несколько татарских слов.", "Гость, даже не зная татарского языка, быстро запомнил несколько татарских слов.", "Даже не зная татарского языка, гость быстро запоминает несколько татарских слов.", "Гость, даже не зная татарский язык, быстро запомнил несколько татарских слов."]
        rubric: ["[даже не зная]{.ru}：[даже]{.ru} 表示让步", "[несколько татарских слов]{.ru}：[несколько]{.ru} + 复数第二格"]

  - id: e6
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段，至少用四处副动词短语，分别表示时间、原因、条件、让步中的三种以上；至少把一处课文里的副动词短语改成从句。
    items:
      - prompt: "提纲：喀山的位置和人口；两种文化、两种语言；克里姆林里的教堂和清真寺；1552 年；休尤姆比克塔的传说；鞑靼菜；喀山大学；撒班节。"
        length: 120–150
        model: "Казань, столица Татарстана, стоит на левом берегу Волги; в 2021 году здесь жило около 1,3 миллиона человек. Гуляя по городу, видишь, что здесь встречаются татарская и русская культуры, а на улицах слышны два языка. В Казанском кремле рядом стоят Благовещенский собор и мечеть Кул-Шариф, названная в честь имама, погибшего при защите города в 1552 году. В том году Казань взяли войска Ивана Грозного. По легенде, царица Сююмбике, не желая выходить замуж за царя, бросилась с башни, которая теперь носит её имя. Спустившись из кремля, туристы пробуют эчпочмак и чак-чак. Казанский университет основан в 1804 году; здесь учился Лев Толстой, а ректором был Лобачевский. Так как татары и русские много веков живут рядом, они многое взяли друг у друга. Даже не будучи татарами, многие казанцы празднуют Сабантуй, а приехав сюда в июне, можно попасть на этот праздник."
        rubric: ["提纲八项都有，日期和人名准确（2021、1552、1804）", "至少四处副动词短语，意义至少三种（时间、原因、条件、让步）", "至少一处由课文的副动词短语改成的从句", "120–150 词"]
        notes: "范文约 140 词。副动词短语：[гуляя по городу]{.ru}（时间）、[не желая выходить замуж]{.ru}（原因）、[спустившись из кремля]{.ru}（时间）、[даже не будучи татарами]{.ru}（让步）、[приехав сюда в июне]{.ru}（条件）。课文的副动词短语 [живя рядом много веков]{.ru} 改成了原因从句 [Так как татары и русские много веков живут рядом]{.ru}。[названная в честь имама]{.ru}、[погибшего при защите города]{.ru} 是形动词短语。"
