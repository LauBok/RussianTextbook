lesson: L70
heading: 单元测试
intro: 本测试覆盖第七单元全部语法。答对 80% 以上再进入第八单元；没有达到的，回到相应的课复习后重做。
grammar: "名词、代词、形容词、物主代词单数第五格；[с]{.ru} + 第五格；[мы с …]{.ru}；[занима́ться]{.ru}、[интересова́ться]{.ru}、[рабо́тать]{.ru}、[быть]{.ru}、[стать]{.ru} + 第五格；[над]{.ru}、[под]{.ru}、[пе́ред]{.ru}、[за]{.ru}、[ме́жду]{.ru}、[ря́дом с]{.ru}；[на]{.ru} + 交通工具；[с … до …]{.ru}；职业名词；[зимо́й]{.ru}、[ле́том]{.ru} 等；[идёт снег]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词填空。
    why: "[с]{.ru} 表示“加”“带”“和……一起”时接第五格。[лимо́н]{.ru} 硬辅音结尾加 [-ом]{.ru}；[капу́ста]{.ru} 变 [-ой]{.ru}；[Ми́ша]{.ru} 虽是男人名，以 [-а]{.ru} 结尾，按阴性变，[ш]{.ru} 后不重读写 [-ей]{.ru}；[оте́ц]{.ru} 的 [е]{.ru} 脱落，重音在词尾，所以是 [отцо́м]{.ru}；中性 [варе́нье]{.ru} 变 [-ем]{.ru}。[без]{.ru} 接第二格，不要跟着 [с]{.ru} 写成第五格。"
    items:
      - stem: Мне чай с ___, пожа́луйста.
        hint: лимо́н
        accept: [лимо́ном]
      - stem: Я хочу́ пирожо́к с ___.
        hint: капу́ста
        accept: [капу́стой]
      - stem: А́нна говори́т с ___.
        hint: Ми́ша
        accept: [Ми́шей]
      - stem: Ми́ша игра́ет в футбо́л с ___.
        hint: оте́ц
        accept: [отцо́м]
      - stem: Ба́бушка пьёт чай с ___.
        hint: варе́нье
        accept: [варе́ньем]
      - stem: Я пью ко́фе без ___.
        hint: са́хар
        accept: [са́хара]

  - id: e2
    type: choice
    task: 选择正确的代词形式。
    why: "[с]{.ru} 后面用第五格。“和我”写 [со мной]{.ru}；第三人称代词在前置词后加 [н-]{.ru}：[с ним]{.ru}、[с ней]{.ru}；“他的弟弟”里 [его́]{.ru} 是物主代词，不加 [н-]{.ru}。[мы с ним]{.ru} 是“我和他”，一共两个人，谓语用复数。"
    items:
      - stem: Ты идёшь в кино́? Мо́жно с ___?
        options: [ты, тобо́й, тебя́]
        answer: тобо́й
      - stem: Э́то Ван Лэй. Мы с ___ у́чимся вме́сте.
        options: [им, ним, его́]
        answer: ним
      - stem: А́нна сиди́т со ___ и помога́ет мне.
        options: [мной, мне, меня́]
        answer: мной
      - stem: Я говори́л с ___ бра́том.
        options: [его́, него́, ним]
        answer: его́
      - stem: — А ты с ___? — С Ми́шей.
        options: [кто, кем, кого́]
        answer: кем
      - stem: Мы с А́нной ___ в кафе́.
        options: [иду́, идёт, идём]
        answer: идём

  - id: e3
    type: fill
    task: 用括号里的词组填空。
    why: "[занима́ться]{.ru}、[интересова́ться]{.ru}、[рабо́тать]{.ru}、[стать]{.ru} 和 [быть]{.ru} 的过去时、将来时都要求第五格，形容词和物主代词跟着名词一起变。阳性形容词第五格是 [-ым]{.ru}，[г、к、х]{.ru} 后写 [-им]{.ru}（[кита́йским]{.ru}）；物主代词阳性 [мои́м]{.ru}、[на́шим]{.ru}；阴性名词 [арти́стка]{.ru} 变 [арти́сткой]{.ru}。第 6 句是现在时，没有系动词，职业名词仍用第一格。"
    items:
      - stem: Сын Оле́га Петро́вича интересу́ется ___.
        hint: кита́йский язы́к
        accept: [кита́йским языко́м]
      - stem: Оле́г Петро́вич рабо́тает ___.
        hint: гла́вный инжене́р
        accept: [гла́вным инжене́ром]
      - stem: В де́тстве ма́ма хоте́ла стать ___.
        hint: арти́стка
        accept: [арти́сткой]
      - stem: Два́дцать пять лет наза́д па́па был ___.
        hint: студе́нт
        accept: [студе́нтом]
      - stem: Я говори́л с ___.
        hint: мой ста́рый друг
        accept: [мои́м ста́рым дру́гом]
      - stem: Мари́я Никола́евна — ___.
        hint: врач
        accept: [врач]
      - stem: Ми́ша занима́ется ___.
        hint: спорт
        accept: [спо́ртом]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "方位前置词 [под]{.ru}、[над]{.ru}、[за]{.ru}、[ме́жду]{.ru}、[ря́дом с]{.ru} 回答 [где?]{.ru} 时接第五格，[ме́жду]{.ru} 后两个名词都用第五格。灯在桌子上方不接触桌面，用 [над]{.ru}，不用 [на]{.ru}。乘坐交通工具用 [на]{.ru} + 第六格，[метро́]{.ru} 不变格；[в метро́]{.ru} 是“在地铁里”。步行用 [пешко́м]{.ru}，不加前置词；动词 [хо́дит]{.ru} 本身就说明是走着去的，不能和 [на авто́бусе]{.ru} 连用。"
    items:
      - stem: Му́рка спит под ___.
        options: [крова́ть, крова́тью, крова́ти]
        answer: крова́тью
      - stem: ___ столо́м гори́т ла́мпа.
        options: [На, Над, Под]
        answer: Над
      - stem: Она́ сиди́т ме́жду холоди́льником и ___.
        options: [плита́, плиту́, плито́й]
        answer: плито́й
      - stem: Мари́я Никола́евна е́здит в поликли́нику на ___.
        options: [авто́бус, авто́бусе, авто́бусом]
        answer: авто́бусе
      - stem: Обы́чно мы е́здим в университе́т ___.
        options: [на метро́, в метро́, по метро́]
        answer: на метро́
      - stem: Шко́ла недалеко́, и Ми́ша хо́дит туда́ ___.
        options: [пешко́м, на авто́бусе, на метро́]
        answer: пешко́м

  - id: e5
    type: fill
    task: 用括号里的词填空。
    why: "[с … до …]{.ru} 里的 [с]{.ru}、[до]{.ru} 都接第二格：[во́семь → восьми́]{.ru}（[е]{.ru} 脱落），[де́вять → девяти́]{.ru}（重音移到词尾），[два → двух]{.ru}。季节用第五格作副词，不加前置词，不能说 [в зиме́]{.ru}；月份才用 [в]{.ru} + 第六格。下雪只用 [идти́]{.ru}，即使说经常也不用 [ходи́ть]{.ru}。"
    items:
      - stem: Мари́я Никола́евна рабо́тает с ___ до пяти́.
        hint: во́семь
        accept: [восьми́]
      - stem: Переры́в на обе́д с ча́са до ___.
        hint: два
        accept: [двух]
      - stem: Ива́н Серге́евич рабо́тает с ___ до шести́.
        hint: де́вять
        accept: [девяти́]
      - stem: ___ в Москве́ хо́лодно.
        hint: зима́
        accept: [Зимо́й]
      - stem: ___ та́ет снег.
        hint: весна́
        accept: [Весно́й]
      - stem: В Пеки́не снег ___ ре́дко.
        hint: идти́
        accept: [идёт]

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊每个星期三去象棋社，玛丽亚·尼古拉耶夫娜小时候想当演员，客人的儿子对汉语感兴趣，王磊在咖啡馆吃的是白菜馅饼，穆尔卡此刻坐在王磊旁边。
    items:
      - stem: Ка́ждую сре́ду Ван Лэй занима́ется ___.
        options: [в шахма́тном клу́бе, в бассе́йне, футбо́лом]
        answer: в шахма́тном клу́бе
      - stem: В де́тстве Мари́я Никола́евна хоте́ла стать ___.
        options: [врачо́м, арти́сткой, программи́стом]
        answer: арти́сткой
      - stem: Сын го́стя интересу́ется ___.
        options: [ша́хматами, кита́йским языко́м, му́зыкой]
        answer: кита́йским языко́м
      - stem: В кафе́ Ван Лэй ел пирожо́к с ___.
        options: [мя́сом, я́блоком, капу́стой]
        answer: капу́стой
      - stem: Сейча́с Му́рка сиди́т ___.
        options: [под крова́тью, ря́дом с Ван Лэ́ем, на по́лке]
        answer: ря́дом с Ван Лэ́ем

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题“我和安娜”用 [мы с А́нной]{.ru}，谓语用复数，“坐电车”用 [на трамва́е]{.ru}。第 2 题“想当”用 [хоте́ть стать]{.ru} + 第五格，“对……感兴趣”用 [интересова́ться]{.ru} + 第五格。第 3 题“在……工作”的职业用第五格，“从……到……”用 [с … до …]{.ru} + 第二格。
    items:
      - zh: 今天我和安娜坐有轨电车去大学。
        accept: ["Сего́дня мы с А́нной е́дем в университе́т на трамва́е.", "Сего́дня мы с А́нной е́дем на трамва́е в университе́т.", "Мы с А́нной сего́дня е́дем в университе́т на трамва́е.", "Мы с А́нной сего́дня е́дем на трамва́е в университе́т.", "Сего́дня мы с А́нной на трамва́е е́дем в университе́т."]
        rubric: ["“我和安娜”用 [мы с А́нной]{.ru}，[А́нной]{.ru} 第五格", "一次、此刻的出行用定向动词 [е́дем]{.ru}，复数", "[на трамва́е]{.ru} 第六格"]
      - zh: 米沙对编程感兴趣，他想当程序员。
        accept: ["Ми́ша интересу́ется программи́рованием, он хо́чет стать программи́стом.", "Ми́ша интересу́ется программи́рованием и хо́чет стать программи́стом.", "Ми́ша интересу́ется программи́рованием, и он хо́чет стать программи́стом."]
        rubric: ["[интересу́ется программи́рованием]{.ru}，第五格", "[стать программи́стом]{.ru}，第五格"]
      - zh: 我爸爸在工厂当工程师，从九点工作到六点。
        accept: ["Мой па́па рабо́тает инжене́ром на заво́де с девяти́ до шести́.", "Мой оте́ц рабо́тает инжене́ром на заво́де с девяти́ до шести́.", "Мой па́па рабо́тает инжене́ром на заво́де, он рабо́тает с девяти́ до шести́.", "Мой оте́ц рабо́тает инжене́ром на заво́де, он рабо́тает с девяти́ до шести́.", "Мой па́па рабо́тает на заво́де инжене́ром с девяти́ до шести́.", "Мой оте́ц рабо́тает на заво́де инжене́ром с девяти́ до шести́.", "Мой па́па рабо́тает инжене́ром на заво́де и рабо́тает с девяти́ до шести́.", "Мой па́па — инжене́р, он рабо́тает на заво́де с девяти́ до шести́.", "Мой оте́ц — инжене́р, он рабо́тает на заво́де с девяти́ до шести́."]
        rubric: ["[рабо́тает инжене́ром]{.ru}，第五格", "[на заво́де]{.ru}", "[с девяти́ до шести́]{.ru}，数词第二格"]

  - id: e8
    type: open
    task: 短文写作。
    items:
      - prompt: 以 [Моя́ семья́]{.ru} 为题，写你家里的两三个人：他们做什么工作、有什么爱好、平时坐什么去上班或上学，你自己想当什么。
        length: 60–90
        model: "Мой па́па рабо́тает инжене́ром на большо́м заво́де. Он рабо́тает с восьми́ до пяти́ и е́здит на рабо́ту на маши́не. Па́па интересу́ется ша́хматами, ве́чером мы с ним ча́сто игра́ем в ша́хматы. Моя́ ма́ма — врач. Она́ рабо́тает в поликли́нике и е́здит туда́ на авто́бусе. В де́тстве ма́ма хоте́ла стать учи́тельницей, но ста́ла врачо́м. Она́ занима́ется пла́ванием. А я студе́нт. Я е́зжу в университе́т на метро́. Я интересу́юсь литерату́рой и хочу́ стать перево́дчиком."
        rubric: ["职业用 [рабо́тать]{.ru} / [стать]{.ru} / [быть]{.ru} + 第五格，现在时“是……”用第一格", "爱好用 [занима́ться]{.ru} 或 [интересова́ться]{.ru} + 第五格", "交通工具用 [на]{.ru} + 第六格，或 [пешко́м]{.ru}", "至少用一次 [с … до …]{.ru} 或 [мы с …]{.ru}"]
        notes: 范文按人物分三段：先写爸爸，再写妈妈，最后写自己。每个人都按“职业—工作时间或交通—爱好”的顺序写，读者容易跟上。注意第五格贯穿全文：[инжене́ром]{.ru}、[ша́хматами]{.ru}、[учи́тельницей]{.ru}、[врачо́м]{.ru}、[пла́ванием]{.ru}、[литерату́рой]{.ru}、[перево́дчиком]{.ru}；而现在时的 [Моя́ ма́ма — врач]{.ru}、[я студе́нт]{.ru} 不用系动词，名词用第一格。
