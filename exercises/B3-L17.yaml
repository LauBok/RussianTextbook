lesson: B3-L17
grammar: "不定人称句：谓语用复数第三人称、不带主语，发出者不确定或不重要（[Город основали в 1916 году]{.ru}），可与被动结构互换；泛指人称句：多用单数第二人称，说任何人都适用的经验（[Такое зрелище не забудешь]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Когда и зачем основали Мурманск? Что такое полярная ночь и полярный день? Когда и где можно увидеть северное сияние? Кто такие саамы и как они живут сегодня? Какие достопримечательности есть в Мурманске?]{.ru}"
        length: 70–100
        model: "Мурманск основали в 1916 году, во время Первой мировой войны, потому что России нужен был северный порт, который не замерзает зимой. Полярная ночь — это время, когда солнце совсем не поднимается над горизонтом, а полярный день — время, когда оно не заходит. Северное сияние можно увидеть с сентября по март, если небо чистое; туристов везут за город, на берег моря или на сопки. Саамы — небольшой коренной народ Кольского полуострова. Раньше они кочевали по тундре со стадами оленей, а сегодня многие живут в селе Ловозеро и разводят оленей. В Мурманске есть ледокол «Ленин» и памятник защитникам Заполярья, который называют «Алёша»."
        rubric: ["五个问题都回答，年份准确（1916）", "至少两处不定人称句", "用完整的句子"]
        notes: "范文约 95 词。不定人称句：[Мурманск основали]{.ru}、[туристов везут за город]{.ru}、[который называют «Алёша»]{.ru}。"

  - id: e2
    type: rewrite
    task: 把被动结构改写成不定人称句。
    example:
      cue: Город был основан в 1916 году.
      answer: Город основали в 1916 году.
    why: "被动结构的主语在不定人称句里变成第四格宾语，动词用复数第三人称（过去时用复数）。第 1 题 [был переименован → переименовали]{.ru}，[город]{.ru} 是非动物名词，第四格同第一格。第 2 题 [был спущен → спустили]{.ru}。第 3 题 [был построен → построили]{.ru}，[ледокол]{.ru} 第四格不变。第 4 题 [был построен → построили]{.ru}，[памятник]{.ru} 第四格不变。第 5 题 [был проведён → провели]{.ru}，[праздник]{.ru} 第四格不变。被动结构强调结果，不定人称句强调动作，意思基本相同。"
    items:
      - cue: В 1917 году город был переименован в Мурманск.
        accept: ["В 1917 году город переименовали в Мурманск.", "Город переименовали в Мурманск в 1917 году."]
      - cue: Ледокол «Ленин» был спущен на воду в 1957 году.
        accept: ["Ледокол «Ленин» спустили на воду в 1957 году.", "В 1957 году ледокол «Ленин» спустили на воду."]
      - cue: Первый атомный ледокол был построен в Ленинграде.
        accept: ["Первый атомный ледокол построили в Ленинграде.", "В Ленинграде построили первый атомный ледокол."]
      - cue: Памятник защитникам Заполярья был построен на высоком холме.
        accept: ["Памятник защитникам Заполярья построили на высоком холме.", "На высоком холме построили памятник защитникам Заполярья."]
      - cue: Первый Праздник Севера был проведён в 1934 году.
        accept: ["Первый Праздник Севера провели в 1934 году.", "В 1934 году провели первый Праздник Севера."]

  - id: e3
    type: fill
    task: 用括号里动词的适当形式填空，构成不定人称句或泛指人称句。
    why: "第 1、2、3 题是不定人称句：发出者不确定，动词用复数第三人称，过去时用复数：[объясняют]{.ru}、[основали]{.ru}、[советуют]{.ru}。第 4、5、6 题是泛指人称句：说任何人都会有的经验，用单数第二人称：[выходишь]{.ru}、[забудешь]{.ru}（完成体将来时表示“永远不会忘”）、[чувствуешь]{.ru}。"
    items:
      - stem: Тёплую зиму в Мурманске ___ Гольфстримом.
        hint: объяснять
        accept: ["объясняют"]
      - stem: Город ___ во время Первой мировой войны.
        hint: основать
        accept: ["основали"]
      - stem: Туристам ___ следить за прогнозом.
        hint: советовать
        accept: ["советуют"]
      - stem: Утром ___ из дома — а на улице темно.
        hint: выходить
        accept: ["выходишь"]
      - stem: Такое зрелище никогда не ___.
        hint: забыть
        accept: ["забудешь"]
      - stem: Стоя на берегу Баренцева моря, ___ себя на краю земли.
        hint: чувствовать
        accept: ["чувствуешь"]

  - id: e4
    type: choice
    task: 选择正确的说法。
    why: "第 1 题空位后是第五格 [«Алёшей»]{.ru}，要用及物的 [называют]{.ru}：[называть что чем]{.ru}；[называется]{.ru} 后面用第一格。第 2 题“据说”用不定人称的 [Говорят]{.ru}，[Они говорят]{.ru} 指确定的“他们”。第 3 题不定人称句没有主语，不能带说明主语的副动词：只有 [Приехав в Мурманск, туристы едут за город]{.ru} 正确，副动词和谓语的主语都是 [туристы]{.ru}。第 4 题泛指人称句可以带副动词，两个动作都属于同一个泛指的人：[Глядя на сияние, забываешь обо всём]{.ru}；[всё забыто]{.ru} 是被动结构，[становится холодно]{.ru} 是没有不定式的无人称句，都不能带副动词。"
    items:
      - stem: Жители ___ этот памятник «Алёшей».
        options: [называют, называется, называются]
        answer: называют
      - stem: ___, к полярной ночи быстро привыкаешь.
        options: [Говорят, Они говорят, Говорит]
        answer: Говорят
      - stem: Как правильно? ___
        options: ["Приехав в Мурманск, туристов везут за город.", "Приехав в Мурманск, туристы едут за город.", "Приехав в Мурманск, туристам везут за город."]
        answer: "Приехав в Мурманск, туристы едут за город."
      - stem: Как правильно? ___
        options: ["Глядя на сияние, забываешь обо всём.", "Глядя на сияние, всё забыто.", "Глядя на сияние, становится холодно."]
        answer: "Глядя на сияние, забываешь обо всём."

  - id: e5
    type: translate
    task: 翻译下列句子，用不定人称句或泛指人称句。
    items:
      - zh: 摩尔曼斯克被称作北极地区的首府。
        accept: ["Мурманск называют столицей Заполярья."]
        rubric: ["不定人称句 [называют]{.ru}，不加 [они]{.ru}", "[называть что чем]{.ru}：[столицей]{.ru} 第五格"]
      - zh: 人们建议游客关注天气预报。
        accept: ["Туристам советуют следить за прогнозом погоды.", "Туристам советуют следить за прогнозом."]
        rubric: ["[советуют]{.ru}：复数第三人称", "[советовать кому]{.ru} + 不定式；[следить за чем]{.ru}"]
      - zh: 早上出门，天是黑的；下班回家，天又是黑的。
        accept: ["Утром выходишь из дома — темно, возвращаешься с работы — снова темно.", "Утром выходишь из дома — темно, возвращаешься с работы — опять темно.", "Утром выходишь из дома — темно, а возвращаешься с работы — снова темно.", "Выходишь утром из дома — темно, возвращаешься с работы — снова темно.", "Утром выходишь из дома — темно, вечером возвращаешься с работы — снова темно.", "Утром выходишь из дома — темно, приходишь с работы — снова темно.", "Утром выходишь из дома — темно, возвращаешься домой с работы — снова темно."]
        rubric: ["泛指人称句：单数第二人称 [выходишь]{.ru}、[возвращаешься]{.ru}", "[темно]{.ru}：无人称句"]
      - zh: 据说北极光是永远忘不了的。
        accept: ["Говорят, северное сияние никогда не забудешь.", "Говорят, что северное сияние никогда не забудешь.", "Говорят, северное сияние не забудешь никогда."]
        rubric: ["[говорят]{.ru}：不定人称句", "[не забудешь]{.ru}：泛指人称句，完成体将来时"]

  - id: e6
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段：至少用三处不定人称句、两处泛指人称句；至少把一处课文里的副动词短语改成从句，或者把一处从句改成副动词短语。
    items:
      - prompt: "提纲：摩尔曼斯克的建立；不冻港；极夜和极昼；北极光；萨米人；“列宁号”和“阿廖沙”；捷里别尔卡。"
        length: 120–150
        model: "Мурманск, самый большой город за Полярным кругом, основали в 1916 году, во время Первой мировой войны. Его порт не замерзает: это объясняют тёплым течением, которое приходит из Атлантического океана. Зимой здесь около сорока дней длится полярная ночь: выходишь утром из дома — темно, возвращаешься с работы — снова темно. Зато летом солнце не заходит совсем. Ради северного сияния туристов везут за город, подальше от огней. Стоишь на морозе, ждёшь, и вдруг по небу пробегают зелёные полосы. Предсказать сияние нельзя, поэтому туристам советуют быть терпеливыми. На Кольском полуострове живут саамы, которые раньше кочевали по тундре со стадами оленей. У морского вокзала стоит ледокол «Ленин» — первое надводное судно с атомным двигателем, а над городом — памятник, который называют «Алёша». Когда стоишь на берегу Баренцева моря в Териберке, чувствуешь себя на краю земли."
        rubric: ["提纲七项都有，年份准确（1916）", "至少三处不定人称句、两处泛指人称句", "至少一处副动词短语与从句的互换", "120–150 词"]
        notes: "范文约 130 词。不定人称句：[основали]{.ru}、[объясняют]{.ru}、[везут]{.ru}、[советуют]{.ru}、[называют]{.ru}。泛指人称句：[выходишь … возвращаешься]{.ru}、[стоишь … ждёшь]{.ru}、[чувствуешь]{.ru}。最后一句把课文的副动词短语 [Стоя на этом берегу]{.ru} 改成了时间从句 [Когда стоишь на берегу]{.ru}，主语都是泛指的“你”。课文的 [воды Гольфстрима, приходя из Атлантического океана]{.ru} 在范文里换成了定语从句 [течением, которое приходит из Атлантического океана]{.ru}，从句说明的是名词 [течение]{.ru}，这是换了一种说法，不算副动词短语和状语从句的互换。"

  - id: e7
    type: fill
    task: 用括号里词的适当形式填空（本课新词）。
    why: "第 1 题 [портиться]{.ru} 第三人称单数，主语是 [настроение]{.ru}：[портится]{.ru}。第 2 题 [родина]{.ru} 作表语用第一格。第 3 题 [кочевать]{.ru} 属 [-овать / -евать]{.ru} 类，过去时复数 [кочевали]{.ru}。第 4 题 [стадо]{.ru} 复数第五格 [стадами]{.ru}，重音移到词尾。第 5 题 [достигнуть]{.ru} 过去时阴性 [достигла]{.ru}，后面接第二格 [глубины]{.ru}。"
    items:
      - stem: Без солнца у многих ___ настроение.
        hint: портиться
        accept: ["портится"]
      - stem: Кольский полуостров — ___ саамов.
        hint: родина
        accept: ["родина"]
      - stem: Раньше саамы ___ по тундре.
        hint: кочевать
        accept: ["кочевали"]
      - stem: Они ходили вместе со ___ оленей.
        hint: стадо
        accept: ["стадами"]
      - stem: В 1989 году скважина ___ глубины 12 262 метров.
        hint: достигнуть
        accept: ["достигла"]
