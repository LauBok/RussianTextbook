lesson: B2-L23
grammar: "形容词比较级的三种构成：[-ее]{.ru}、辅音交替 + [-е]{.ru}、特殊形式；比较对象用 [чем]{.ru} 或第二格；[гора́здо, намно́го, ещё, в два ра́за]{.ru}；比较级 + [всех / всего́]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里形容词的比较级。
    why: "第 1、2、7 题加 [-ее]{.ru}：[длинне́е, тепле́е, трудне́е]{.ru}，短尾阴性重音在词尾（[длинна́, тепла́, трудна́]{.ru}），比较级重音落在 [-е́е]{.ru} 上。第 3、4、8 题是特殊形式：[вы́ше, глу́бже, ста́рше]{.ru}。第 5、6 题有辅音交替：[молодо́й → моло́же]{.ru}（[д → ж]{.ru}），[дорого́й → доро́же]{.ru}（[г → ж]{.ru}），重音都在词干上。"
    items:
      - stem: Во́лга ___ Се́ны.
        hint: дли́нный
        accept: ["длинне́е", "длинне́й"]
      - stem: Сего́дня ___, чем вчера́.
        hint: тёплый
        accept: ["тепле́е", "тепле́й"]
      - stem: Эльбру́с ___ Фу́дзи.
        hint: высо́кий
        accept: ["вы́ше"]
      - stem: Байка́л ___ всех озёр на све́те.
        hint: глубо́кий
        accept: ["глу́бже"]
      - stem: Ми́ша ___ А́нны.
        hint: молодо́й
        accept: ["моло́же"]
      - stem: Э́та ку́ртка ___, чем та.
        hint: дорого́й
        accept: ["доро́же"]
      - stem: Как ты ду́маешь, ру́сский язы́к ___ кита́йского?
        hint: тру́дный
        accept: ["трудне́е", "трудне́й"]
      - stem: Ди́ма ___ А́нны на оди́н год.
        hint: ста́рый
        accept: ["ста́рше"]

  - id: e2
    type: rewrite
    task: 按例句把 [чем]{.ru} 的说法改成用第二格表示比较对象。
    example:
      cue: Янцзы́ длинне́е, чем Во́лга.
      answer: Янцзы́ длинне́е Во́лги.
    why: "去掉 [чем]{.ru} 和逗号，把比较对象变成第二格：[Москва́ → Москвы́]{.ru}，[я → меня́]{.ru}，[о́сень → о́сени]{.ru}，[па́па → па́пы]{.ru}，[Ди́ма → Ди́мы]{.ru}。人称代词在比较级后不加 [н-]{.ru}。只有两个比较项都是第一格时才能这样改。"
    items:
      - cue: Пеки́н бо́льше, чем Москва́.
        accept: ["Пеки́н бо́льше Москвы́."]
      - cue: Ди́ма ста́рше, чем я.
        accept: ["Ди́ма ста́рше меня́."]
      - cue: Зима́ холодне́е, чем о́сень.
        accept: ["Зима́ холодне́е о́сени."]
      - cue: Мой брат вы́ше, чем па́па.
        accept: ["Мой брат вы́ше па́пы."]
      - cue: А́нна моло́же, чем Ди́ма.
        accept: ["А́нна моло́же Ди́мы."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [о́чень]{.ru} 不能修饰比较级，要用 [намно́го]{.ru}（或 [гора́здо]{.ru}）。第 2 题比较对象前用 [чем]{.ru}，不用 [как]{.ru}。第 3 题没有 [чем]{.ru}，比较对象用第二格 [того́]{.ru}。第 4 题有 [чем]{.ru}，后面的词和前面的 [ле́том]{.ru} 同样是副词，所以用 [зимо́й]{.ru}。第 5 题比较级后的代词不加 [н-]{.ru}。"
    items:
      - stem: Се́на ___ коро́че Во́лги.
        options: [о́чень, намно́го]
        answer: намно́го
      - stem: На Ку́бе тепле́е, ___ в Москве́.
        options: [чем, как]
        answer: чем
      - stem: Э́тот слова́рь лу́чше ___.
        options: [того́, тот]
        answer: того́
      - stem: Ле́том мы гуля́ем бо́льше, чем ___.
        options: [зимо́й, зимы́]
        answer: зимо́й
      - stem: Ди́ма ста́рше ___.
        options: [её, неё]
        answer: её

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题两种比较方式都可以。第 2 题“……得多”用 [гора́здо]{.ru} 或 [намно́го]{.ru}，不能用 [о́чень]{.ru}；两个副词比较只能用 [чем]{.ru}。第 3 题差几岁用 [на]{.ru} + 第四格。第 4 题 [та]{.ru} 的第二格是 [той]{.ru}。第 5 题“比什么都”用 [всего́]{.ru}。"
    items:
      - zh: 长江比伏尔加河长。
        accept: ["Янцзы́ длинне́е Во́лги.", "Янцзы́ длинне́е, чем Во́лга."]
        rubric: ["[длинне́е]{.ru}", "比较对象用第二格 [Во́лги]{.ru} 或 [чем Во́лга]{.ru}"]
      - zh: 今天比昨天冷得多。
        accept: ["Сего́дня гора́здо холодне́е, чем вчера́.", "Сего́дня намно́го холодне́е, чем вчера́.", "Сего́дня гора́здо холодне́е, чем бы́ло вчера́.", "Сего́дня намно́го холодне́е, чем бы́ло вчера́."]
        rubric: ["[гора́здо / намно́го холодне́е]{.ru}", "[чем вчера́]{.ru}：副词只能用 [чем]{.ru}"]
      - zh: 我妹妹比我小两岁。
        accept: ["Моя́ сестра́ моло́же меня́ на два го́да.", "Моя́ мла́дшая сестра́ моло́же меня́ на два го́да.", "Сестра́ моло́же меня́ на два го́да.", "Моя́ сестра́ на два го́да моло́же меня́.", "Моя́ сестра́ моло́же, чем я, на два го́да.", "Моя́ сестра́ на два го́да моло́же, чем я."]
        rubric: ["[моло́же меня́]{.ru}：代词不加 [н-]{.ru}", "[на два го́да]{.ru}"]
      - zh: 这本书比那本有意思。
        accept: ["Э́та кни́га интере́снее, чем та.", "Э́та кни́га интере́снее той."]
        rubric: ["[интере́снее]{.ru}：重音保留在词干上", "[той]{.ru} 或 [чем та]{.ru}"]
      - zh: 健康比什么都重要。
        accept: ["Здоро́вье доро́же всего́.", "Здоро́вье важне́е всего́."]
        rubric: ["比较级 + [всего́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[О чём расска́зывала О́льга Ви́кторовна на уро́ке? Что студе́нты сказа́ли о свои́х ре́ках и гора́х? Како́е о́зеро глу́бже всех на све́те? Почему́ Ван Лэй мно́го зна́ет о нём? Что сказа́л Ди́ма о Во́лге?]{.ru}"
        length: 50–80
        model: "На уро́ке О́льга Ви́кторовна расска́зывала о ре́ках и озёрах Росси́и. Длина́ Во́лги — три ты́сячи пятьсо́т три́дцать киломе́тров. Ван Лэй сказа́л, что Янцзы́ длинне́е Во́лги, а Пьер — что Се́на намно́го коро́че. Ю́ми рассказа́ла о Фу́дзи, но Эльбру́с ещё вы́ше. Байка́л глу́бже всех озёр на све́те. Ван Лэй зна́ет о нём мно́го, потому́ что в а́вгусте Петро́вы пое́дут туда́. Ди́ма сказа́л, что Во́лга краси́вее всех рек."
        rubric: ["回答全部五个问题", "至少四个比较级，形式和重音正确", "比较对象用 [чем]{.ru} 或第二格", "用间接引语转述同学们的话"]
        notes: 范文约 75 词。同学们的话用 [сказа́л, что…]{.ru} 转述，第二个分句里省去了重复的 [сказа́л]{.ru}：[а Пьер — что…]{.ru}，破折号代替省去的词。

  - id: e6
    type: open
    task: 作文。把你的家乡和莫斯科作一番比较：城市大小、人口、天气、河流和公园、交通、物价、生活节奏等，最后说说你更喜欢哪里、为什么。
    items:
      - prompt: 写 100–150 词。至少用六个不同的比较级，其中至少两个是特殊形式或辅音交替的形式；比较对象用 [чем]{.ru} 和第二格两种说法。
        length: 100–150
        model: "Я из Пеки́на. Пеки́н бо́льше Москвы́, и люде́й там то́же бо́льше. Зимо́й в Пеки́не тепле́е, чем в Москве́, и снег идёт ре́же. Зато́ ле́том у нас гора́здо жа́рче, иногда́ со́рок гра́дусов. В Москве́ бо́льше рек и па́рков, и, по-мо́ему, они́ краси́вее. Моско́вское метро́ ста́рше пеки́нского, но пеки́нское длинне́е. Еда́ в Пеки́не деше́вле, а кни́ги доро́же. Жизнь в Пеки́не, мо́жет быть, ещё быстре́е, чем в Москве́: все спеша́т, на у́лицах намно́го бо́льше маши́н. Где мне лу́чше? Тру́дно сказа́ть. В Пеки́не мой дом и моя́ семья́, он мне доро́же всех городо́в на све́те. Но Москва́ то́же ста́ла для меня́ вторы́м до́мом, и с ка́ждым ме́сяцем я люблю́ её всё бо́льше."
        rubric: ["比较的方面至少四个", "至少六个不同的比较级，形式和重音正确", "[чем]{.ru} 和第二格两种说法都用到", "结尾有自己的看法", "100–150 词"]
        notes: 范文从大小、人口、天气、河流公园、地铁、物价、人的习惯逐项比较，最后用 [доро́же всех городо́в]{.ru} 表达感情。[чем]{.ru} 用在副词和带前置词的词组前（[тепле́е, чем в Москве́]{.ru}），第二格用在两个第一格之间（[бо́льше Москвы́]{.ru}、[ста́рше пеки́нского]{.ru}）。[всё бо́льше]{.ru} 表示“越来越……”。
