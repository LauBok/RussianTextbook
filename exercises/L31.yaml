lesson: L31
grammar: "[у кого́ есть]{.ru} 句型（某人有……）；人称代词第二格 [меня́, тебя́, его́, её, нас, вас, их]{.ru}，前置词后第三人称加 [н-]{.ru}：[у него́, у неё, у них]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的代词变成第二格，填入空白。
    why: "[у]{.ru} 后面要用第二格。第三人称在前置词后面要加 [н-]{.ru}，所以是 [у него́, у неё, у них]{.ru}，最容易错写成 [у его́]{.ru}。[меня́, тебя́, нас, вас]{.ru} 与第四格同形，[у]{.ru} 后面不加 [н-]{.ru}，因为这几个词本来不以元音开头。"
    items:
      - stem: У ___ есть брат.
        hint: я
        accept: [меня́]
      - stem: У ___ есть соба́ка?
        hint: ты
        accept: [тебя́]
      - stem: У ___ есть сад.
        hint: она́
        accept: [неё]
      - stem: У ___ есть двою́родная сестра́.
        hint: он
        accept: [него́]
      - stem: У ___ есть ко́шка.
        hint: мы
        accept: [нас]
      - stem: У ___ есть ба́бушка?
        hint: вы
        accept: [вас]
      - stem: У ___ есть дом и сад.
        hint: они́
        accept: [них]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 物主代词“他的”“她的”“他们的”是 [его́, её, их]{.ru}，直接放在名词前面，不加 [н-]{.ru}；表示“他有”“她有”“他们有”时，前面有前置词 [у]{.ru}，要用 [него́, неё, них]{.ru}。判断方法：前面有没有 [у]{.ru}。
    items:
      - stem: Э́то ___ соба́ка.
        options: [его́, у него́]
        answer: его́
      - stem: ___ есть соба́ка.
        options: [Его́, У него́]
        answer: У него́
      - stem: Э́то ___ сад.
        options: [её, у неё]
        answer: её
      - stem: ___ большо́й сад.
        options: [Её, У неё]
        answer: У неё
      - stem: ___ есть да́ча.
        options: [Их, У них]
        answer: У них

  - id: e3
    type: rewrite
    task: 按例句提问，并作肯定回答。
    placeholder: — У … есть …? — Да, есть.
    example:
      cue: ты / брат
      answer: — У тебя́ есть брат? — Да, есть.
    why: 拥有者用 [у]{.ru} + 第二格，所有物用第一格，[есть]{.ru} 不变。肯定回答只说 [Да, есть]{.ru} 就够了，不必重复名词。
    items:
      - cue: вы / соба́ка
        accept: ["— У вас есть соба́ка? — Да, есть."]
      - cue: он / сестра́
        accept: ["— У него́ есть сестра́? — Да, есть."]
      - cue: она́ / двою́родный брат
        accept: ["— У неё есть двою́родный брат? — Да, есть."]
      - cue: они́ / да́ча
        accept: ["— У них есть да́ча? — Да, есть."]
      - cue: ты / слова́рь
        accept: ["— У тебя́ есть слова́рь? — Да, есть."]

  - id: e4
    type: choice
    task: 用 [есть]{.ru} 填空，不需要的地方选“—”。
    why: 告诉对方“有没有”时用 [есть]{.ru}；“有”已经知道，重点在所有物怎么样（大、小、新、快乐……）时，[есть]{.ru} 省去。第 2 题的重点是形容词。
    items:
      - stem: У меня́ ___ соба́ка.
        options: [есть, —]
        answer: есть
      - stem: У неё ___ большо́й сад.
        options: [есть, —]
        answer: —
      - stem: — У тебя́ ___ брат? — Да, есть.
        options: [есть, —]
        answer: есть

  - id: e5
    type: translate
    task: 译成俄语。
    why: 俄语表示“有”用 [у кого́ есть что]{.ru}，不要直译成“我 + 有”的动词结构。“也”用 [то́же]{.ru}。
    items:
      - zh: 你有兄弟吗？——没有。
        accept: ["— У тебя́ есть брат? — Нет.", "— У тебя́ брат есть? — Нет.", "— Брат у тебя́ есть? — Нет."]
        rubric: ["“你有”译作 [у тебя́ есть]{.ru}", "[брат]{.ru} 用第一格"]
      - zh: 我们有奶奶，她住在别墅。
        accept: ["У нас есть ба́бушка, она́ живёт на да́че.", "У нас есть ба́бушка. Она́ живёт на да́че."]
        rubric: ["[у нас есть]{.ru}", "“在别墅”用 [на да́че]{.ru}，不用 [в]{.ru}"]
      - zh: 他有一条狗，它很活泼。
        accept: ["У него́ есть соба́ка, она́ о́чень весёлая.", "У него́ есть соба́ка. Она́ о́чень весёлая.", "У него́ есть соба́ка, она́ весёлая.", "У него́ есть соба́ка. Она́ весёлая."]
        rubric: ["前置词后用 [него́]{.ru}，不用 [его́]{.ru}", "[соба́ка]{.ru} 是阴性，代词用 [она́]{.ru}，形容词用 [весёлая]{.ru}"]
      - zh: 我有一个表妹。你呢？
        accept: ["У меня́ есть двою́родная сестра́. А у тебя́?", "У меня́ есть двою́родная сестра́. А у вас?"]
        rubric: ["“表妹”译作 [двою́родная сестра́]{.ru}，形容词用阴性", "“你呢”用 [А у тебя́?]{.ru}，不说 [А ты?]{.ru}"]
      - zh: 谁有词典？
        accept: ["У кого́ есть слова́рь?"]
        rubric: ["“谁有”用 [у кого́]{.ru}，不用 [кто]{.ru}"]

  - id: e6
    type: open
    task: 介绍你的家庭。
    items:
      - prompt: 用 [у меня́ есть]{.ru}、[у него́]{.ru}、[у неё]{.ru} 等说说你家里有哪些人，他们做什么工作、住在哪里，家里有没有猫或狗。
        length: 40–70
        model: |
          Э́то моя́ семья́. У меня́ есть па́па и ма́ма. Па́па — инжене́р. Ма́ма — учи́тель, она́ рабо́тает в шко́ле. У меня́ есть ба́бушка и де́душка. Они́ живу́т в Шанха́е. У них ма́ленький дом и большо́й сад. У меня́ есть двою́родная сестра́. У неё есть ко́шка. Она́ о́чень весёлая.
        rubric: ["至少三次正确使用 [у + 第二格 + есть]{.ru}", "前置词后的第三人称用 [него́, неё, них]{.ru}", "介绍至少三位家人的工作或住处"]
        notes: 范文先总说“这是我的家”，再按父母、祖父母、其他亲戚的顺序介绍，每个人一到两句。说某人有什么时用 [есть]{.ru}；说“小房子、大花园”这类强调特征的句子省去 [есть]{.ru}。没有的亲属可以不提，“没有”的完整说法下一课学。
