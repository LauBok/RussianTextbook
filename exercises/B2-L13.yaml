lesson: B2-L13
grammar: "名词复数第四格：非动物名词同复数第一格，动物名词同复数第二格。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数第四格填空。
    why: "先判断是不是动物名词。第 1、3、6 题 [биле́т, ку́ртка, оши́бка]{.ru} 是非动物名词，第四格同复数第一格。第 2、4、5、7、8 题是人，第四格同复数第二格：[актёров]{.ru}（[-ов]{.ru}）、[зри́телей]{.ru}（[-ь]{.ru} 结尾，[-ей]{.ru}）、[студе́нток]{.ru}（零词尾，加隐现元音 [о]{.ru}）、[вну́чек]{.ru}（零词尾，加隐现元音 [е]{.ru}）、[колле́г]{.ru}（零词尾）。阴性动物名词复数第四格也同第二格，这是和单数最大的不同。"
    items:
      - stem: А́нна давно́ купи́ла ___ на февра́ль.
        hint: биле́т
        accept: ["биле́ты"]
      - stem: Ли́за зна́ет всех ___ э́того теа́тра.
        hint: актёр
        accept: ["актёров"]
      - stem: В гардеро́бе мы сда́ли ___.
        hint: ку́ртка
        accept: ["ку́ртки"]
      - stem: С балко́на Ди́ма ви́дел всех ___.
        hint: зри́тель
        accept: ["зри́телей"]
      - stem: О́льга Ви́кторовна ждёт ___ из гру́ппы.
        hint: студе́нтка
        accept: ["студе́нток"]
      - stem: Прости́те меня́ за все ___!
        hint: оши́бка
        accept: ["оши́бки"]
      - stem: Ба́бушка ждёт ___.
        hint: вну́чка
        accept: ["вну́чек"]
      - stem: Па́па пригласи́л в теа́тр ___.
        hint: колле́га
        accept: ["колле́г"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [студе́нтов]{.ru}：动物名词，复数第四格同第二格。第 2 题 [цветы́]{.ru} 是非动物名词，第四格同第一格。第 3 题 [подру́г]{.ru}：阴性动物名词，复数第四格也同第二格，不能用 [подру́ги]{.ru}。第 4 题 [аплоди́ровать]{.ru} 要求第三格 [актёрам]{.ru}，不是第四格。第 5 题 [всех]{.ru} 和动物名词连用。"
    items:
      - stem: О́льга Ви́кторовна лю́бит ___, кото́рые мно́го рабо́тают.
        options: [студе́нты, студе́нтов, студе́нтам]
        answer: студе́нтов
      - stem: Зри́тели дари́ли арти́сткам ___.
        options: [цветы́, цвето́в, цвета́м]
        answer: цветы́
      - stem: В воскресе́нье А́нна пригласи́ла ___ в теа́тр.
        options: [подру́ги, подру́г, подру́гам]
        answer: подру́г
      - stem: По́сле спекта́кля зри́тели аплоди́ровали ___.
        options: [актёров, актёрам, актёры]
        answer: актёрам
      - stem: Ди́ма ви́дел ___ зри́телей.
        options: [все, всех, всем]
        answer: всех

  - id: e3
    type: rewrite
    task: 把第四格的名词变成复数。
    example:
      cue: Я ви́жу актёра.
      answer: Я ви́жу актёров.
    why: "第 1、2 题是动物名词，单数 [студе́нтку, сосе́да]{.ru}，复数第四格同第二格：[студе́нток, сосе́дей]{.ru}。第 3 题 [програ́ммку]{.ru} 是非动物名词，复数同第一格 [програ́ммки]{.ru}。第 4 题 [учи́тельница]{.ru} 零词尾：[учи́тельниц]{.ru}。第 5 题 [пи́сьма]{.ru} 非动物，重音移到词干。"
    items:
      - cue: Я зна́ю студе́нтку.
        accept: ["Я зна́ю студе́нток."]
      - cue: Ма́ма пригласи́ла сосе́да.
        accept: ["Ма́ма пригласи́ла сосе́дей."]
      - cue: Ван Лэй взял програ́ммку.
        accept: ["Ван Лэй взял програ́ммки."]
      - cue: Ми́ша поздра́вил учи́тельницу.
        accept: ["Ми́ша поздра́вил учи́тельниц."]
      - cue: Ба́бушка чита́ет письмо́.
        accept: ["Ба́бушка чита́ет пи́сьма."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1、3 题宾语是人，复数第四格同第二格：[актёров]{.ru}、[студе́нтов]{.ru}。第 2 题“票”是非动物名词，用 [биле́ты]{.ru}；“二月的”用 [на]{.ru} + 第四格 [на февра́ль]{.ru}。第 4 题“向……挥手”用第三格加 [руко́й]{.ru}。"
    items:
      - zh: 莉莎认识这家剧院所有的演员。
        accept: ["Ли́за зна́ет всех актёров э́того теа́тра.", "Ли́за зна́ет всех актёров в э́том теа́тре.", "Ли́за зна́ет всех актёров из э́того теа́тра.", "Всех актёров э́того теа́тра Ли́за зна́ет."]
        rubric: ["[всех актёров]{.ru}：动物名词复数第四格同第二格", "“这家剧院的”用第二格 [э́того теа́тра]{.ru}"]
      - zh: 安娜买了二月的票。
        accept: ["А́нна купи́ла биле́ты на февра́ль.", "На февра́ль А́нна купи́ла биле́ты."]
        rubric: ["[биле́ты]{.ru}：非动物名词复数第四格同第一格", "[на февра́ль]{.ru}"]
      - zh: 我喜欢会犯错误的学生。
        accept: ["Я люблю́ студе́нтов, кото́рые де́лают оши́бки.", "Я люблю́ тех студе́нтов, кото́рые де́лают оши́бки.", "Мне нра́вятся студе́нты, кото́рые де́лают оши́бки."]
        rubric: ["[студе́нтов]{.ru}：动物名词复数第四格", "[кото́рые]{.ru} 引导定语从句，[оши́бки]{.ru} 用复数第四格"]
      - zh: 迪马在楼座上向我们挥了挥手。
        accept: ["Ди́ма помаха́л нам руко́й с балко́на.", "С балко́на Ди́ма помаха́л нам руко́й.", "Ди́ма помаха́л нам руко́й на балко́не.", "На балко́не Ди́ма помаха́л нам руко́й.", "Ди́ма с балко́на помаха́л нам руко́й.", "Ди́ма на балко́не помаха́л нам руко́й.", "Ди́ма помаха́л нам с балко́на руко́й."]
        rubric: ["[помаха́ть]{.ru} + 第三格 [нам]{.ru} + 第五格 [руко́й]{.ru}", "[с балко́на]{.ru} 或 [на балко́не]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пошли́ А́нна и Ван Лэй в воскресе́нье? Кого́ они́ уви́дели в фойе́? Како́й был день и что сказа́л Ван Лэй О́льге Ви́кторовне? Где сиде́л Ди́ма и кого́ он ви́дел отту́да? Что бы́ло по́сле спекта́кля?]{.ru}"
        length: 50–80
        model: "В воскресе́нье А́нна и Ван Лэй пошли́ в Худо́жественный теа́тр на «Ча́йку». В фойе́ они́ уви́дели О́льгу Ви́кторовну и её дочь Ли́зу. Бы́ло Прощёное воскресе́нье, и Ван Лэй попроси́л у О́льги Ви́кторовны проще́ния за все свои́ оши́бки. Ди́ма с ребя́тами сиде́л на балко́не. Отту́да он ви́дел не то́лько актёров, но и всех зри́телей. По́сле спекта́кля зри́тели до́лго аплоди́ровали актёрам."
        rubric: ["回答全部五个问题", "复数第四格用对：[актёров]{.ru}、[всех зри́телей]{.ru}（动物），[оши́бки]{.ru}（非动物）", "[проси́ть проще́ния у]{.ru} + 第二格"]
        notes: 范文约 65 词。王磊的话改成叙述：[попроси́л у О́льги Ви́кторовны проще́ния]{.ru}，用完成体过去时，人称代词换成 [свои́]{.ru}；迪马那一句保留 [не то́лько…, но и…]{.ru}，把动物名词复数第四格用了两次。
