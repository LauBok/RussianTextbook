lesson: L01
grammar: "[э́то]{.ru} 句型（这是……）；[кто]{.ru} 问人和动物，[что]{.ru} 问事物；否定词 [не]{.ru}；连词 [а]{.ru}。"
exercises:

  - id: e1
    type: picture_qa
    task: 看图，用 [Кто э́то?]{.ru} 或 [Что э́то?]{.ru} 问答。
    example: 1
    why: 人和动物用 [кто]{.ru}，事物用 [что]{.ru}。第 1 题最容易错：猫是动物，所以用 [кто]{.ru}，和课文结尾安娜纠正王磊的情形一样。
    items:
      - image: koshka.svg
        qword: Кто
        answer: [Э́то ко́шка.]
      - image: dom.svg
        qword: Что
        answer: [Э́то дом.]
      - image: papa.svg
        qword: Кто
        answer: [Э́то па́па.]
      - image: foto.svg
        qword: Что
        answer: [Э́то фо́то.]
      - image: misha.svg
        qword: Кто
        answer: [Э́то Ми́ша.]
      - image: mama.svg
        qword: Кто
        answer: [Э́то ма́ма.]

  - id: e2
    type: choice
    task: 用 [кто]{.ru} 或 [что]{.ru} 填空。
    why: 判断的依据是答句里的名词。[ко́шка]{.ru}、[Ми́ша]{.ru}、[ма́ма]{.ru}、[па́па]{.ru} 是活物，用 [кто]{.ru}；[дом]{.ru}、[фо́то]{.ru} 是事物，用 [что]{.ru}。第 5、6 题疑问词放在句尾，意思不变，但不在句首，所以小写。
    items:
      - stem: — ___ э́то? — Э́то ко́шка.
        options: [Кто, Что]
        answer: Кто
      - stem: — ___ э́то? — Э́то дом.
        options: [Кто, Что]
        answer: Что
      - stem: — ___ э́то? — Э́то Ми́ша.
        options: [Кто, Что]
        answer: Кто
      - stem: — ___ э́то? — Э́то фо́то.
        options: [Кто, Что]
        answer: Что
      - stem: — Э́то ___? — Э́то ма́ма.
        options: [кто, что]
        answer: кто
      - stem: — А э́то ___? — Э́то па́па.
        options: [кто, что]
        answer: кто

  - id: e3
    type: rewrite
    task: 按例句说一说。
    placeholder: Э́то не … Э́то …
    example:
      cue: дом / ко́шка
      answer: Э́то не дом. Э́то ко́шка.
    why: "[не]{.ru} 紧放在被否定的名词前面，不放在 [э́то]{.ru} 前面。"
    items:
      - cue: ма́ма / па́па
        accept: [Э́то не ма́ма. Э́то па́па.]
      - cue: фо́то / дом
        accept: [Э́то не фо́то. Э́то дом.]
      - cue: Ми́ша / А́нна
        accept: [Э́то не Ми́ша. Э́то А́нна.]
      - cue: ко́шка / фо́то
        accept: [Э́то не ко́шка. Э́то фо́то.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 3 题也可以译成两句。第 4 题的“那……呢”用 [а]{.ru} 表示，也可以说 [А э́то кто?]{.ru}
    items:
      - zh: 这是谁？——这是安娜。
        accept: ["— Кто э́то? — Э́то А́нна.", "— Э́то кто? — Э́то А́нна."]
        rubric: ["疑问词用 [кто]{.ru}，因为安娜是人", 现在时不用系动词]
      - zh: 这是什么？——这是照片。
        accept: ["— Что э́то? — Э́то фо́то.", "— Э́то что? — Э́то фо́то."]
        rubric: ["疑问词用 [что]{.ru}", "照片用 [фо́то]{.ru}"]
      - zh: 这不是房子，这是猫。
        accept: ["Э́то не дом, э́то ко́шка.", "Э́то не дом. Э́то ко́шка."]
        rubric: ["[не]{.ru} 放在 [дом]{.ru} 前", 两个分句之间用逗号或句号]
      - zh: 那这是谁？——这是米沙。
        accept: ["— А кто э́то? — Э́то Ми́ша.", "— А э́то кто? — Э́то Ми́ша."]
        rubric: ["“那……呢”用 [а]{.ru} 开头", "疑问词用 [кто]{.ru}"]
