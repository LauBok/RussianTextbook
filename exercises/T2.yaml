    - всё
    - все
    answer: весь
- id: e3
  type: fill
  task: 用括号里词的正确形式填空。
  points: 1
  why: 第 1 题：[Кремль]{.ru} 变格时重音移到词尾，第六格 [в Кремле́]{.ru}（第 11 课）。第 2 题：[жить]{.ru} 的词干是 [жив-]{.ru}，[вы]{.ru} 的形式是 [живёте]{.ru}（第 14 课）。第 3 题：[в]{.ru} + 第六格，[тот]{.ru} 的阴性第六格是 [той]{.ru}（第 19 课）。第 4 题：[три]{.ru} 后面用单数第二格，[-я]{.ru} 结尾的阴性名词第二格是 [-и]{.ru}：[неде́ли]{.ru}（第 32、35 课）。第 5 题：[ви́деть]{.ru} 支配第四格，阳性动物名词第四格同第二格，名和父称都要变：[Ива́на Серге́евича]{.ru}（第 22 课）。第 6 题：[дать]{.ru} 是不规则的完成体，[я]{.ru} 的形式是 [дам]{.ru}，表示将来（第 44 课）。第 7 题：“把书给谁”，谁用第三格，阴性名、父称都以 [-е]{.ru} 结尾：[О́льге Ви́кторовне]{.ru}（第 51 课）。第 8 题：年龄句里的人用第三格，[она́]{.ru} 的第三格是 [ей]{.ru}（第 52、53 课）。第 9 题：[позвони́ть]{.ru} 支配第三格，形容词阳性第三格是 [-ому]{.ru}：[ста́рому]{.ru}（第 56 课）。第 10 题：[мы с]{.ru} + 第五格表示“我和……”，[А́нна]{.ru} 的第五格是 [А́нной]{.ru}（第 62 课）。第 11 题：[стать]{.ru} 后面用第五格：[программи́стом]{.ru}（第 64 课）。第 12 题：[встава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[встаю́]{.ru}；[встава́ю]{.ru} 是常见错误（第 81 课）。第 13 题：[большо́й]{.ru} 的比较级是不规则的 [бо́льше]{.ru}（第 86 课）。第 14 题：[поздравля́ть с]{.ru} + 第五格，[день]{.ru} 的 [е]{.ru} 脱落：[с днём рожде́ния]{.ru}，[рожде́ния]{.ru} 不变（第 91 课）。第 15 题：[са́мый]{.ru} 和后面的名词同性同数同格，[кни́га]{.ru} 是阴性：[са́мая]{.ru}（第 89 课）。
  items:
  - stem: Ле́том мы бы́ли в ___.
    hint: Кремль
    accept:
    - Кремле́
  - stem: Где вы ___?
    hint: жить
    accept:
    - живёте
  - stem: В ___ ко́мнате живёт Ми́ша.
    hint: тот
    accept:
    - той
  - stem: Ван Лэй был в Пеки́не три ___.
    hint: неде́ля
    accept:
    - неде́ли
  - stem: В теа́тре мы ви́дели ___.
    hint: Ива́н Серге́евич
    accept:
    - Ива́на Серге́евича
  - stem: За́втра я ___ тебе́ слова́рь.
    hint: дать
    accept:
    - дам
  - stem: Я дала́ кни́гу ___.
    hint: О́льга Ви́кторовна
    accept:
    - О́льге Ви́кторовне
  - stem: ___ два́дцать лет.
    hint: она́
    accept:
    - Ей
  - stem: Ве́чером я позвоню́ ___ дру́гу.
    hint: ста́рый
    accept:
    - ста́рому
  - stem: Мы с ___ идём в кино́.
    hint: А́нна
    accept:
    - А́нной
  - stem: Мой брат хо́чет стать ___.
    hint: программи́ст
    accept:
    - программи́стом
  - stem: Обы́чно я ___ в семь часо́в.
    hint: встава́ть
    accept:
    - встаю́
  - stem: Москва́ ___, чем Петербу́рг.
    hint: большо́й
    accept:
    - бо́льше
  - stem: Поздравля́ю тебя́ с ___!
    hint: день рожде́ния
    accept:
    - днём рожде́ния
  - stem: Э́то ___ интере́сная кни́га в на́шей библиоте́ке.
    hint: са́мый
    accept:
    - са́мая
- id: e4
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 2
  why: 第 1 空：无人称句 [ве́село]{.ru} 里感受的人用第三格：[Ми́ше]{.ru}；[Ми́ша]{.ru} 作主语只能和动词连用（第 51、58 课）。第 2 空：[собира́ться]{.ru} 后面接不定式；一次出行用 [пое́хать]{.ru}，[е́здить]{.ru} 表示经常来回（第 73、93 课）。第 3 空：[никогда́]{.ru} 和 [не]{.ru} 连用表示“从来没有”；[ничего́]{.ru}、[никто́]{.ru} 指东西和人，[нигде́]{.ru} 指地点（第 98 课）。第 4 空：“给奶奶买礼物”，[ба́бушке]{.ru} 是第三格，形容词阴性第三格是 [-ой]{.ru}：[люби́мой]{.ru}（第 56 课）。第 5 空：[хоте́ть]{.ru} 后面接不定式，买一样具体的东西用完成体 [купи́ть]{.ru}（第 26、76 课）。第 6 空：[гуля́ть по]{.ru} + 第三格：[по це́нтру]{.ru}（第 57 课）。第 7 空：“就着果酱喝茶”用 [с]{.ru} + 第五格，形容词中性第五格是 [-ым]{.ru}：[с вишнёвым варе́ньем]{.ru}（第 61、65 课）。第 8 空：需要的是 [хлеб и молоко́]{.ru} 两样东西，[ну́жен]{.ru} 用复数 [нужны́]{.ru}（第 55 课）。第 9 空：后半句说明不想去的原因，用 [потому́ что]{.ru}；[поэ́тому]{.ru} 引出的是结果（第 84 课）。第 10 空：[по́сле]{.ru} 要求第二格：[по́сле футбо́ла]{.ru}（第 37 课）。
  items:
  - options:
    - Ми́ша
    - Ми́шу
    - Ми́ше
    - Ми́шей
    answer: Ми́ше
  - options:
    - пое́хать
    - пое́дет
    - е́здить
    - е́хал
    answer: пое́хать
  - options:
    - ничего́
    - никто́
    - нигде́
    - никогда́
    answer: никогда́
  - options:
    - люби́мая
    - люби́мой
    - люби́мую
    - люби́мым
    answer: люби́мой
  - options:
    - покупа́ть
    - ку́пит
    - купи́ть
    - купи́л
    answer: купи́ть
  - options:
    - центр
    - це́нтра
    - це́нтре
    - це́нтру
    answer: це́нтру
  - options:
    - вишнёвым
    - вишнёвое
    - вишнёвого
    - вишнёвом
    answer: вишнёвым
  - options:
    - ну́жен
    - нужны́
    - нужна́
    - ну́жно
    answer: нужны́
  - options:
    - поэ́тому
    - е́сли
    - потому́ что
    - что
    answer: потому́ что
  - options:
    - футбо́л
    - футбо́лом
    - футбо́ле
    - футбо́ла
    answer: футбо́ла
  passage: |
    ::: {.prose lang="ru"}
    **Пе́ред Но́вым го́дом**

    Сего́дня тридца́тое декабря́. На у́лице ми́нус два́дцать, а до́ма тепло́. Ма́ма гото́вит на ку́хне оливье́, а мы с Ми́шей украша́ем ёлку. Ми́ша о́чень лю́бит Но́вый год. (1) []{.blank} сего́дня о́чень ве́село.

    Ван Лэй то́же с на́ми. Ско́ро у него́ экза́мены, а пото́м он собира́ется (2) []{.blank} домо́й, в Пеки́н. Но Но́вый год он встреча́ет у нас. «Я (3) []{.blank} не встреча́л Но́вый год в Росси́и», — говори́т он.

    Вчера́ мы с Ван Лэ́ем ходи́ли в торго́вый центр. Я купи́ла пода́рок (4) []{.blank} ба́бушке — тёплый шарф. Ван Лэй хоте́л (5) []{.blank} шёлковый плато́к для ма́мы, но до́лго не мог вы́брать: все платки́ бы́ли краси́вые. Пото́м мы гуля́ли по (6) []{.blank}: везде́ стоя́ли ёлки и горе́ли огни́.

    Ве́чером мы пи́ли чай с (7) []{.blank} варе́ньем. Ма́ма сказа́ла: «Нам ещё (8) []{.blank} хлеб и молоко́. Ми́ша, иди́ в магази́н, пожа́луйста». Но Ми́ша не хоте́л идти́, (9) []{.blank} по телеви́зору игра́л «Спарта́к». «Я пойду́ по́сле (10) []{.blank}», — сказа́л он. Тогда́ в магази́н пошёл Ван Лэй.
