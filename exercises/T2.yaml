  passage_zh: |
    **王磊病了**

    星期一早上王磊觉得很不舒服：他头疼，嗓子也疼。体温三十八度。玛丽亚·尼古拉耶夫娜是医生。她说：“你得了流感。今天你不能去学校了。你得卧床休息，喝蜂蜜茶。”王磊给系办公室打了电话，说他病了。

    白天皮埃尔给他打来电话。他问王磊感觉怎么样，还讲了课上的事：奥尔加·维克托罗夫娜讲了新语法，星期三他们有测验。王磊非常着急。晚上安娜把本子给了他，他把练习全做完了。

    星期三早上已经不发烧了。王磊先去了诊所：医生给他开了一张交给系里的证明。课上奥尔加·维克托罗夫娜说：“您病了两天。测验您星期五再做吧。”王磊很高兴：现在他有时间把语法再复习一遍了。
