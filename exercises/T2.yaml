  passage_zh: |
    **贝加尔湖**

    贝加尔湖是西伯利亚的一个湖。它是世界上最深的湖。贝加尔湖的水非常清澈、冰冷：即使在七月也不暖和。湖的四周是群山和原始森林。

    贝加尔湖的冬天非常冷：零下三十度，甚至零下四十度。那时湖面是白色的，可以在上面行走，甚至开汽车。

    贝加尔湖离莫斯科很远。坐火车去要走四天，坐飞机要飞六个小时。可是每年夏天，俄罗斯人和外国人都会去贝加尔湖。他们在原始森林里散步，不怕冷水的话就在湖里游泳。

    很多俄罗斯人说，贝加尔湖是俄罗斯最美的地方。
