  passage_zh: |
    **新年前夕**

    今天是十二月三十日。外面零下二十度，家里却很暖和。妈妈在厨房里做奥利维耶沙拉，我和米沙在装饰枞树。米沙非常喜欢新年。今天他非常开心。

    王磊也和我们在一起。他快要考试了，考完以后打算回国，回北京。不过新年他要在我们家过。“我从来没有在俄罗斯过过新年。”他说。

    昨天我和王磊去了购物中心。我给我亲爱的奶奶买了礼物——一条暖和的围巾。王磊想给妈妈买一条丝绸头巾，可是挑了很久也挑不出来：所有的头巾都很漂亮。后来我们在市中心散步：到处都立着枞树，亮着灯。

    晚上我们就着樱桃果酱喝茶。妈妈说：“我们还需要面包和牛奶。米沙，请你去趟商店吧。”可米沙不想去，因为电视上斯巴达克队正在比赛。“踢完球我再去。”他说。于是王磊去了商店。
