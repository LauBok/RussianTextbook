    **Ван Лэй заболе́л**

    В понеде́льник у́тром Ван Лэй пло́хо себя́ чу́вствовал: у него́ боле́ли голова́ и го́рло. Температу́ра была́ три́дцать во́семь. Мари́я Никола́евна — врач. Она́ сказа́ла: «У тебя́ грипп. Сего́дня ты не пойдёшь в университе́т. Тебе́ на́до лежа́ть в посте́ли и пить чай с мёдом». Ван Лэй позвони́л в декана́т и сказа́л, что он бо́лен.

    Днём ему́ позвони́л Пьер. Он спроси́л, как Ван Лэй себя́ чу́вствует, и рассказа́л, что бы́ло на уро́ке. О́льга Ви́кторовна объясня́ла но́вую грамма́тику, а в сре́ду у них контро́льная рабо́та. Ван Лэй о́чень волнова́лся. Ве́чером А́нна дала́ ему́ тетра́дь, и он сде́лал все упражне́ния.

    В сре́ду у́тром температу́ры уже́ не́ было. Снача́ла Ван Лэй пошёл в поликли́нику: там врач дал ему́ спра́вку для декана́та. На уро́ке О́льга Ви́кторовна сказа́ла: «Вы бы́ли больны́ два дня. Контро́льную рабо́ту вы напи́шете в пя́тницу». Ван Лэй был рад: тепе́рь у него́ есть вре́мя ещё раз повтори́ть грамма́тику.
    :::
