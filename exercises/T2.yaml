lesson: T2
heading: 期末测试
intro: 满分 150 分，建议用时 120 分钟。考查范围：第一册全册，第 51–100 课约占六成。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 语音与书写：根据读音规则选出正确答案。
  points: 1
  why: 第 1 题：非重读的 [о]{.ru} 在重音前第一个音节读得接近 [а]{.ru}（语音第 7 课）。第 2 题：成对的浊辅音在词末读成清辅音，[г]{.ru} 读 [к]{.ru}（语音第 8 课）。第 3 题：浊辅音在清辅音前读成清辅音，[ж]{.ru} 在 [к]{.ru} 前读 [ш]{.ru}（语音第 8 课）。第 4 题：清辅音在浊辅音前读成浊辅音，[т]{.ru} 在 [б]{.ru} 前读 [д]{.ru}（语音第 8 课）。第 5 题：[его́]{.ru} 和形容词词尾 [-ого]{.ru} 一样，[г]{.ru} 读 [в]{.ru}（第 8 课）。第 6 题：[шестна́дцать]{.ru} 里 [стн]{.ru} 中间的 [т]{.ru} 不发音，[дц]{.ru} 读长的 [цц]{.ru}（第 35 课）。第 7 题：前置词和后面的词连读，[с]{.ru} 在浊辅音 [б]{.ru} 前读成 [з]{.ru}：[с бра́том]{.ru} 读作 [[збра́там]]{.tr}（第 61 课）。第 8 题：[сч]{.ru} 读作 [щ]{.ru}，[сча́стье]{.ru} 读作 [[ща́стьйе]]{.tr}（第 91 课）。第 9 题：[ё]{.ru} 永远重读，[весёлый]{.ru} 的重音在第二个音节，所以不再加重音符（语音第 5 课）。第 10 题：[коне́чно]{.ru} 里的 [чн]{.ru} 读作 [шн]{.ru}，是要单独记住的读法（第 17 课）。
  items:
  - stem: окно́：о 读得接近 ___
    options:
    - о
    - у
    - а
    - ы
    answer: а
  - stem: друг：г 读作 ___
    options:
    - к
    - г
    - х
    - в
    answer: к
  - stem: ло́жка：ж 读作 ___
    options:
    - ж
    - з
    - щ
    - ш
    answer: ш
  - stem: футбо́л：т 读作 ___
    options:
    - т
    - д
    - ф
    - 不发音
    answer: д
  - stem: его́：г 读作 ___
    options:
    - в
    - г
    - к
    - х
    answer: в
  - stem: шестна́дцать：第一个 т ___
    options:
    - 读 т
    - 读 д
    - 不发音
    - 读 ц
    answer: 不发音
  - stem: с бра́том：с 读作 ___
    options:
    - с
    - ш
    - 不发音
    - з
    answer: з
  - stem: сча́стье：с 和 ч 合起来读作 ___
    options:
    - щ
    - ш
    - ч
    - с + ч
    answer: щ
  - stem: весёлый：重音在第 ___ 个音节
    options:
    - 一
    - 二
    - 三
    answer: 二
  - stem: коне́чно：ч 读作 ___
    options:
    - ч
    - щ
    - ш
    - ж
    answer: ш
- id: e2
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：[очки́]{.ru} 只有复数形式，问“谁的”用 [чьи]{.ru}（第 8 课）。第 2 题：[в]{.ru} + 第六格表示处所，[поликли́ника]{.ru} 前用 [в]{.ru}（第 11、12 课）。第 3 题：[знать]{.ru} 支配第四格，阳性动物名词第四格同第二格，物主代词随之用 [на́шего]{.ru}（第 22、34 课）。第 4 题：表示所属的词放在后面用第二格，阴性物主代词第二格 [мое́й]{.ru}；[мое́й сестре́]{.ru} 是第三格或第六格（第 33、34 课）。第 5 题：[ка́ждое у́тро]{.ru} 是经常的动作，用未完成体现在时 [пьёт]{.ru}；[вы́пьет]{.ru} 是完成体将来时，[вы́пил]{.ru} 是一次喝完（第 21、45 课）。第 6 题：主语是事情本身（[ле́кция]{.ru}），用带 [-ся]{.ru} 的 [начина́ется]{.ru}；不带 [-ся]{.ru} 的 [начина́ть]{.ru} 要有人作主语、后面接宾语或不定式（第 38 课）。第 7 题：[две]{.ru} 后面用单数第二格 [сестры́]{.ru}（第 35 课）。第 8 题：“一小时以前”是 [час наза́д]{.ru}，[наза́д]{.ru} 放在时间后面；[че́рез]{.ru} 表示“以后”，要放在前面，而且和过去时 [звони́ла]{.ru} 不合（第 47 课）。第 9 题：“在几号”序数词和月份都用第二格，不加前置词：[четвёртого ноября́]{.ru}（第 49 课）。第 10 题：否定命令式一般用未完成体：[Не открыва́й]{.ru}；[откро́й]{.ru} 用在肯定的、具体的请求里（第 46、54 课）。第 11 题：[звони́ть]{.ru} 支配第三格：[звони́т ма́ме]{.ru}；汉语“给妈妈打电话”里的“妈妈”像宾语，容易误用第四格（第 51 课）。第 12 题：[нра́виться]{.ru} 的句子里喜欢的人用第三格 [мне]{.ru}，喜欢的东西作主语（第 52 课）。第 13 题：[пять]{.ru} 以上的数词后面，“岁”用 [лет]{.ru}；[год]{.ru} 用在 1 后面，[го́да]{.ru} 用在 2–4 后面（第 53 课）。第 14 题：[ну́жен]{.ru} 和主语 [ку́ртка]{.ru} 在性上一致，阴性用 [нужна́]{.ru}（第 55 课）。第 15 题：“加牛奶的茶”用 [с]{.ru} + 第五格：[с молоко́м]{.ru}（第 61 课）。第 16 题：[рабо́тать]{.ru} 表示职业时后面用第五格 [врачо́м]{.ru}（第 64 课）。第 17 题：[под]{.ru} 表示处所时要求第五格：[под столо́м]{.ru}（第 66 课）。第 18 题：“在去学校的路上”说的是正朝一个方向走的那一段时间，用定向动词过去时 [шёл]{.ru}；[ходи́л]{.ru} 表示去过又回来了（第 71、72 课）。第 19 题：[за́втра]{.ru} 出发去另一个城市，用 [пое́дем]{.ru}；[пое́хали]{.ru} 是过去时，[е́здили, е́здим]{.ru} 是往返或经常的动作（第 73 课）。第 20 题：[кото́рый]{.ru} 和它所指的名词同性同数，[у́лица]{.ru} 是阴性，从句里作主语用第一格 [кото́рая]{.ru}（第 79 课）。第 21 题：[е́сли]{.ru} 说将来的条件时用将来时 [бу́дет]{.ru}，不能像汉语那样用现在时（第 83 课）。第 22 题：宾语属于主语本人时用 [свой]{.ru}，阴性第四格 [свою́]{.ru}；[его́ сестру́]{.ru} 指的是别人的姐姐（第 87 课）。第 23 题：间接疑问句用 [ли]{.ru}，放在要问的词（这里是动词）后面；[что]{.ru} 引出的是陈述，不是疑问（第 89 课）。第 24 题：[е́сли бы]{.ru} 说的是不现实的条件，主句也要用 [бы]{.ru} + 过去时：[пое́хал бы]{.ru}（第 94 课）。第 25 题：[весь]{.ru} 和阳性名词 [день]{.ru} 一致；[весь день]{.ru} 表示“一整天”，不加前置词（第 97 课）。
  items:
  - stem: — ___ э́то очки́? — Мои́.
    options:
    - Чей
    - Чья
    - Чьё
    - Чьи
    answer: Чьи
  - stem: Мари́я Никола́евна сейча́с в ___.
    options:
    - поликли́ника
    - поликли́нику
    - поликли́нике
    - поликли́ники
    answer: поликли́нике
  - stem: Ты зна́ешь ___?
    options:
    - наш преподава́тель
    - на́шего преподава́теля
    - на́шем преподава́теле
    - на́шему преподава́телю
    answer: на́шего преподава́теля
  - stem: Э́то ко́мната ___.
    options:
    - мое́й сестры́
    - моя́ сестра́
    - мою́ сестру́
    - мое́й сестре́
    answer: мое́й сестры́
  - stem: Ка́ждое у́тро Ван Лэй ___ ко́фе.
    options:
    - вы́пьет
    - пьёт
    - вы́пил
    - пить
    answer: пьёт
  - stem: Ле́кция ___ в де́сять часо́в.
    options:
    - начина́ет
    - начина́ют
    - начина́ться
    - начина́ется
    answer: начина́ется
  - stem: У на́шей сосе́дки две ___.
    options:
    - сестры́
    - сестра́
    - сестру́
    - сестре́
    answer: сестры́
  - stem: А́нна звони́ла час ___.
    options:
    - че́рез
    - по́сле
    - наза́д
    - до
    answer: наза́д
  - stem: Пра́здник бу́дет ___ ноября́.
    options:
    - четвёртое
    - четвёртого
    - в четвёртом
    - четвёртый
    answer: четвёртого
  - stem: Не ___ окно́, на у́лице хо́лодно!
    options:
    - откро́й
    - откры́ть
    - открыва́ешь
    - открыва́й
    answer: открыва́й
  - stem: Ван Лэй ча́сто звони́т ___.
    options:
    - ма́ма
    - ма́му
    - ма́ме
    - ма́мой
    answer: ма́ме
  - stem: ___ о́чень нра́вится Москва́.
    options:
    - Мне
    - Меня́
    - Я
    - Мной
    answer: Мне
  - stem: Ба́бушке се́мьдесят пять ___.
    options:
    - год
    - го́да
    - лет
    - го́ду
    answer: лет
  - stem: Ван Лэ́ю ___ тёплая ку́ртка.
    options:
    - ну́жен
    - ну́жно
    - нужны́
    - нужна́
    answer: нужна́
  - stem: Я пью чай с ___.
    options:
    - молоко́
    - молоко́м
    - молока́
    - молоку́
    answer: молоко́м
  - stem: Мари́я Никола́евна рабо́тает ___.
    options:
    - врачо́м
    - врач
    - врача́
    - врачу́
    answer: врачо́м
  - stem: Ко́шка спит под ___.
    options:
    - стол
    - столе́
    - столо́м
    - стола́
    answer: столо́м
  - stem: Когда́ я ___ в университе́т, я уви́дел А́нну.
    options:
    - ходи́л
    - шёл
    - иду́
    - хожу́
    answer: шёл
  - stem: За́втра мы ___ в Петербу́рг.
    options:
    - е́здили
    - пое́хали
    - е́здим
    - пое́дем
    answer: пое́дем
  - stem: Э́то у́лица, ___ нахо́дится в це́нтре.
    options:
    - кото́рая
    - кото́рый
    - кото́рое
    - кото́рые
    answer: кото́рая
  - stem: Е́сли за́втра ___ дождь, мы бу́дем до́ма.
    options:
    - идёт
    - шёл
    - бу́дет
    - был
    answer: бу́дет
  - stem: Ми́ша лю́бит ___ сестру́.
    options:
    - его́
    - свою́
    - её
    - своя́
    answer: свою́
  - stem: Па́па спроси́л, зна́ю ___ я А́нну.
    options:
    - что
    - и́ли
    - ли
    - не
    answer: ли
  - stem: Е́сли бы у меня́ бы́ло вре́мя, я ___ в Сиби́рь.
