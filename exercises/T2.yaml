    **Байка́л**

    Байка́л — э́то о́зеро в Сиби́ри. Э́то са́мое глубо́кое о́зеро в ми́ре. Вода́ в Байка́ле о́чень чи́стая и холо́дная: да́же в ию́ле она́ не тёплая. Вокру́г о́зера — го́ры и тайга́.

    Зимо́й на Байка́ле о́чень хо́лодно: ми́нус три́дцать и́ли да́же ми́нус со́рок. Тогда́ о́зеро бе́лое, и по нему́ мо́жно ходи́ть и да́же е́здить на маши́не.

    Байка́л нахо́дится далеко́ от Москвы́. На по́езде туда́ на́до е́хать четы́ре дня, а на самолёте лете́ть шесть часо́в. Но ка́ждое ле́то на Байка́л е́здят и ру́сские, и иностра́нцы. Они́ гуля́ют в тайге́ и пла́вают в о́зере, е́сли не боя́тся холо́дной воды́.

    Мно́гие ру́сские говоря́т, что Байка́л — са́мое краси́вое ме́сто в Росси́и.
    :::
