- id: e7
  type: open
  task: 写作。
  points: 30
  items:
  - prompt: 寒假你回到了家，给莫斯科的一位俄罗斯朋友写一封信，100–120 词，要有称呼和落款。内容包括：回家路上和到家时的情况；假期里做了什么（至少两件事）；什么时候回莫斯科，回去以后打算做什么。至少用到第三格、第五格各一次，运动动词的过去时或将来时，一个 [е́сли]{.ru} 或 [потому́ что]{.ru} 复合句，完成体将来时。
    length: 100–120
    model: |
      Дорого́й Ми́ша!

      Приве́т из Пеки́на! Я до́ма уже́ неде́лю. В самолёте я спал почти́ всё вре́мя, потому́ что о́чень уста́л. В аэропорту́ меня́ встреча́ли роди́тели. Ма́ме о́чень понра́вился ру́сский плато́к, а па́пе — матрёшка.

      На Пра́здник весны́ мы е́здили к ба́бушке. Мы е́ли пельме́ни, а ве́чером смотре́ли пра́здничный конце́рт. Я рассказа́л ба́бушке о Москве́ и показа́л фотогра́фии. Ещё я ча́сто игра́л в ша́хматы с па́пой и чита́л по-ру́сски «Капита́нскую до́чку».

      В Москву́ я верну́сь оди́ннадцатого февраля́. Е́сли бу́дет хоро́шая пого́да, мы с тобо́й пойдём на като́к. Я о́чень скуча́ю по Москве́!

      Переда́й приве́т па́пе, ма́ме и А́нне!

      Твой Ван Лэй
    rubric:
    - 内容 10 分：路上和到家（3 分）、假期里做的两件事（各 2 分）、回莫斯科的时间和打算（3 分）
    - 语法 10 分：要求的五项（第三格、第五格、运动动词、[е́сли]{.ru} 或 [потому́ что]{.ru} 复合句、完成体将来时）各 1 分；其余 5 分看全文语法错误，名词、形容词变格，动词变位和体，前置词和格的搭配，每两处错误扣 1 分
    - 词汇 5 分：用词准确、有变化，能用上第六至十单元学过的词（[понра́виться, пра́здничный, скуча́ть, переда́ть приве́т, като́к]{.ru} 等）给 5 分；用词单调或有三处以上用词不当的，酌情扣 1–3 分
    - 结构 5 分：有称呼和落款（1 分），分段清楚、每段一个意思（2 分），开头和结尾自然、句子之间衔接通顺（2 分）
    - 字数少于 80 词的，内容分最多给 6 分
    notes: 范文约 110 词，按书信格式写（第 95 课）：称呼 [Дорого́й Ми́ша!]{.ru}，正文三段（路上和到家、假期生活、回莫斯科的打算），结尾托对方问候家人，落款 [Твой Ван Лэй]{.ru}。语法上：[ма́ме понра́вился плато́к]{.ru}、[рассказа́л ба́бушке]{.ru}、[переда́й приве́т па́пе]{.ru} 用第三格（第 51、52 课）；[с па́пой]{.ru}、[мы с тобо́й]{.ru} 用第五格（第 61、62 课）；[е́здили к ба́бушке]{.ru} 是不定向动词过去时，表示去过又回来（第 71、74 课），[пойдём на като́к]{.ru} 是 [пойти́]{.ru} 的将来时（第 73 课）；[потому́ что о́чень уста́л]{.ru} 说原因（第 84 课），[Е́сли бу́дет хоро́шая пого́да]{.ru} 从句用将来时（第 83 课）；[верну́сь, пойдём]{.ru} 是完成体将来时；[оди́ннадцатого февраля́]{.ru} 是日期的第二格（第 49 课）；[скуча́ть по]{.ru} + 第三格是固定搭配（第 95 课）。写信时先想好三段各写什么，每段两三句，句子不必长，但格要用对。
