lesson: L82
grammar: "[снача́ла…, пото́м…]{.ru} 表示先后；[когда́]{.ru} 引导时间从句：未完成体表示同时，完成体表示先后；将来的事情从句也用将来时。"
exercises:

  - id: e1
    type: rewrite
    task: 用 [когда́]{.ru} 把两个句子连成一句，表示两个动作同时进行。
    example:
      cue: Я за́втракаю. Я слу́шаю ра́дио.
      answer: Когда́ я за́втракаю, я слу́шаю ра́дио.
    why: 两个动作同时进行，从句和主句都用未完成体。[когда́]{.ru} 放在从句开头，从句和主句之间用逗号隔开。主语相同时，主句的主语也可以省略。
    items:
      - cue: Я е́ду в метро́. Я чита́ю.
        accept: ["Когда́ я е́ду в метро́, я чита́ю.", "Когда́ я е́ду в метро́, чита́ю.", "Я чита́ю, когда́ е́ду в метро́.", "Я чита́ю, когда́ я е́ду в метро́.", "Когда́ я е́ду на метро́, я чита́ю.", "Я чита́ю, когда́ е́ду на метро́."]
      - cue: Ива́н Серге́евич за́втракает. Он слу́шает но́вости.
        accept: ["Когда́ Ива́н Серге́евич за́втракает, он слу́шает но́вости.", "Ива́н Серге́евич слу́шает но́вости, когда́ за́втракает.", "Ива́н Серге́евич слу́шает но́вости, когда́ он за́втракает."]
      - cue: Идёт мо́крый снег. На доро́гах про́бки.
        accept: ["Когда́ идёт мо́крый снег, на доро́гах про́бки.", "На доро́гах про́бки, когда́ идёт мо́крый снег."]
      - cue: А́нна пила́ ко́фе. Она́ чита́ла но́вости.
        accept: ["Когда́ А́нна пила́ ко́фе, она́ чита́ла но́вости.", "А́нна чита́ла но́вости, когда́ пила́ ко́фе.", "А́нна чита́ла но́вости, когда́ она́ пила́ ко́фе."]

  - id: e2
    type: choice
    task: 选择正确的动词形式。
    why: "看两个动作是同时还是先后。第 1 题“喝咖啡时看新闻”是同时，用未完成体 [пила́]{.ru}；第 2 题“喝完咖啡才去大学”是先后，用完成体 [вы́пила]{.ru}；第 3 题“走在路上时看见”，走是背景，用未完成体 [шёл]{.ru}；第 4、5 题说的是将来，从句也要用将来时，不能用现在时 [за́втракаю]{.ru}、[конча́ются]{.ru}。"
    items:
      - stem: Когда́ А́нна ___ ко́фе, она́ чита́ла но́вости.
        options: [пила́, вы́пила]
        answer: пила́
      - stem: Когда́ А́нна ___ ко́фе, они́ пошли́ в университе́т.
        options: [пила́, вы́пила]
        answer: вы́пила
      - stem: Когда́ я ___ домо́й, я уви́дел А́нну.
        options: [шёл, пошёл]
        answer: шёл
      - stem: Когда́ я ___, я позвоню́ тебе́.
        options: [за́втракаю, поза́втракаю]
        answer: поза́втракаю
      - stem: Когда́ ___ заня́тия, мы пойдём в библиоте́ку.
        options: [конча́ются, ко́нчатся]
        answer: ко́нчатся

  - id: e3
    type: rewrite
    task: 用 [снача́ла…, пото́м…]{.ru} 说出动作的先后。
    example:
      cue: за́втракать / е́хать в университе́т
      answer: Снача́ла я за́втракаю, пото́м е́ду в университе́т.
    why: "[снача́ла]{.ru} 放在第一个动作前，[пото́м]{.ru} 放在第二个动作前，中间用逗号隔开。说的是日常习惯，动词用未完成体现在时；第二部分主语相同，可以省略。"
    items:
      - cue: умыва́ться / одева́ться
        accept: ["Снача́ла я умыва́юсь, пото́м одева́юсь.", "Снача́ла я умыва́юсь, а пото́м одева́юсь.", "Снача́ла я умыва́юсь, пото́м я одева́юсь."]
      - cue: слу́шать но́вости / слу́шать му́зыку
        accept: ["Снача́ла я слу́шаю но́вости, пото́м слу́шаю му́зыку.", "Снача́ла я слу́шаю но́вости, пото́м му́зыку.", "Снача́ла я слу́шаю но́вости, а пото́м му́зыку."]
      - cue: де́лать дома́шнее зада́ние / смотре́ть фильм
        accept: ["Снача́ла я де́лаю дома́шнее зада́ние, пото́м смотрю́ фильм.", "Снача́ла я де́лаю дома́шнее зада́ние, а пото́м смотрю́ фильм.", "Снача́ла я де́лаю дома́шнее зада́ние, пото́м я смотрю́ фильм."]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我坐地铁的时候看书。
        accept: ["Когда́ я е́ду в метро́, я чита́ю.", "Когда́ я е́ду в метро́, чита́ю.", "Я чита́ю, когда́ е́ду в метро́.", "Я чита́ю, когда́ я е́ду в метро́.", "Когда́ я е́ду на метро́, я чита́ю.", "Я чита́ю, когда́ е́ду на метро́."]
        rubric: ["用 [когда́]{.ru} 从句", "同时进行的动作，两部分都用未完成体", "从句和主句之间有逗号"]
      - zh: 安娜喝完咖啡，我们就去了大学。
        accept: ["Когда́ А́нна вы́пила ко́фе, мы пошли́ в университе́т.", "Мы пошли́ в университе́т, когда́ А́нна вы́пила ко́фе.", "Когда́ А́нна вы́пила ко́фе, мы пое́хали в университе́т.", "Мы пое́хали в университе́т, когда́ А́нна вы́пила ко́фе."]
        rubric: ["先后发生的动作用完成体 [вы́пила, пошли́]{.ru}", "“去了大学”用 [пойти́]{.ru} 或 [пое́хать в университе́т]{.ru}"]
      - zh: 我吃完早饭就给你打电话。
        accept: ["Когда́ я поза́втракаю, я позвоню́ тебе́.", "Когда́ я поза́втракаю, позвоню́ тебе́.", "Я позвоню́ тебе́, когда́ поза́втракаю.", "Я позвоню́ тебе́, когда́ я поза́втракаю.", "Когда́ я поза́втракаю, я тебе́ позвоню́."]
        rubric: ["将来的事情从句也用完成体将来时 [поза́втракаю]{.ru}，不能用现在时", "[позвони́ть]{.ru} 支配第三格 [тебе́]{.ru}"]
      - zh: 起初很难，现在容易了。
        accept: ["Снача́ла бы́ло тру́дно, а тепе́рь легко́.", "Снача́ла бы́ло тру́дно, тепе́рь легко́."]
        rubric: ["“起初”用 [снача́ла]{.ru}", "无人称句过去时用 [бы́ло]{.ru}"]
      - zh: 明天先下雪，然后下雨。
        accept: ["За́втра снача́ла бу́дет снег, пото́м дождь.", "За́втра снача́ла бу́дет снег, а пото́м дождь.", "За́втра снача́ла бу́дет снег, пото́м бу́дет дождь.", "За́втра снача́ла пойдёт снег, пото́м дождь.", "За́втра снача́ла пойдёт снег, а пото́м дождь."]
        rubric: ["将来时用 [бу́дет]{.ru} 或 [пойдёт]{.ru}", "[снача́ла…, пото́м…]{.ru}"]

  - id: e5
    type: open
    task: 回答问题，连成一段话。
    items:
      - prompt: 根据课文回答，并连成一段话：早饭时伊万·谢尔盖耶维奇做什么？王磊为什么爱听广播？天气预报说了什么？王磊什么时候看书？安娜喝完咖啡以后他们做了什么？
        length: 50–80
        model: "Когда́ Ива́н Серге́евич за́втракает, он слу́шает но́вости. Ван Лэй то́же лю́бит слу́шать ра́дио: э́то хоро́шая пра́ктика. Ди́ктор сказа́л: «За́втра снача́ла бу́дет снег, пото́м дождь». Когда́ Ван Лэй е́дет в метро́, он чита́ет. Когда́ А́нна вы́пила ко́фе, они́ пошли́ в университе́т. Снача́ла у них была́ грамма́тика, пото́м чте́ние."
        rubric: ["至少用三个 [когда́]{.ru} 从句", "用 [снача́ла…, пото́м…]{.ru}", "同时的动作用未完成体，先后的动作用完成体"]
        notes: 范文按课文顺序回答五个问题。原因用冒号引出，播音员的话用直接引语转述。三个 [когда́]{.ru} 从句里，前两个是未完成体（同时），最后一个是完成体（先后），正好对应本课讲的两种关系。
