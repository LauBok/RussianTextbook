lesson: B2-L25
grammar: "短尾形容词的构成（零词尾、[-а, -о, -ы]{.ru}，插入元音 [е / о]{.ru}）；短尾只作谓语，长尾既作定语也作谓语；带补语的短尾形容词 [гото́в, дово́лен, похо́ж, согла́сен, прав]{.ru}；短尾的时间与 [вы]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里形容词的短尾形式。
    why: "短尾和主语的性、数一致：第 1 题 [обе́д]{.ru} 阳性 → [гото́в]{.ru}；第 2 题问安娜，阴性 → [гото́ва]{.ru}；第 3 题复数 → [чи́сты]{.ru}；第 4 题 [ма́ма]{.ru} → [дово́льна]{.ru}，阳性才插入 [е]{.ru}（[дово́лен]{.ru}）；第 5 题 [Ми́ша]{.ru} 阳性 → [похо́ж]{.ru}；第 6 题说话人是“我”，按男性写 [согла́сен]{.ru}，女性说 [согла́сна]{.ru}；第 7 题 [вы]{.ru} 称呼一个人，短尾也用复数 [пра́вы]{.ru}；第 8 题 [окно́]{.ru} 中性 → [гря́зно]{.ru}。"
    items:
      - stem: Обе́д уже́ ___.
        hint: гото́вый
        accept: ["гото́в"]
      - stem: А́нна, ты ___? Мо́жно идти́?
        hint: гото́вый
        accept: ["гото́ва"]
      - stem: Наконе́ц все о́кна ___.
        hint: чи́стый
        accept: ["чи́сты"]
      - stem: Ма́ма ___ на́ми.
        hint: дово́льный
        accept: ["дово́льна"]
      - stem: Ми́ша о́чень ___ на па́пу.
        hint: похо́жий
        accept: ["похо́ж"]
      - stem: Я не ___ с тобо́й, Ми́ша.
        hint: согла́сный
        accept: ["согла́сен", "согла́сна"]
      - stem: О́льга Ви́кторовна, вы ___.
        hint: пра́вый
        accept: ["пра́вы"]
      - stem: Твоё окно́ ещё ___.
        hint: гря́зный
        accept: ["гря́зно"]

  - id: e2
    type: choice
    task: 选择长尾或短尾。
    why: "修饰名词只能用长尾：第 1 题 [но́вый пылесо́с]{.ru}，第 3 题 [чи́стое окно́]{.ru}。带补语的谓语用短尾：第 2 题 [гото́в к экза́мену]{.ru}，第 4 题 [похо́ж на па́пу]{.ru}。第 5 题 [прав]{.ru} 只有短尾，用 [вы]{.ru} 称呼一个人时用复数 [пра́вы]{.ru}。"
    items:
      - stem: Па́па купи́л ___ пылесо́с.
        options: [но́вый, нов]
        answer: но́вый
      - stem: Ты ___ к экза́мену?
        options: [гото́в, гото́вый]
        answer: гото́в
      - stem: Пе́ред на́ми бы́ло ___ окно́.
        options: [чи́стое, чи́сто]
        answer: чи́стое
      - stem: Ми́ша ___ на па́пу.
        options: [похо́ж, похо́жий]
        answer: похо́ж
      - stem: Вы ___, Ива́н Серге́евич.
        options: [пра́вы, прав]
        answer: пра́вы

  - id: e3
    type: rewrite
    task: 按例句把长尾定语改成短尾谓语。
    example:
      cue: гото́вый обе́д
      answer: Обе́д гото́в.
    why: "名词变成主语，短尾放在后面，和名词的性、数一致：[ко́мната]{.ru} 阴性 → [чиста́]{.ru}（重音移到词尾）；[ку́ртка]{.ru} → [грязна́]{.ru}，重音也在词尾；[о́кна]{.ru} 复数 → [чи́сты]{.ru}；[зада́ние]{.ru} 中性 → [гото́во]{.ru}。"
    items:
      - cue: чи́стая ко́мната
        accept: ["Ко́мната чиста́."]
      - cue: гря́зная ку́ртка
        accept: ["Ку́ртка грязна́."]
      - cue: чи́стые о́кна
        accept: ["О́кна чи́сты."]
      - cue: гото́вое зада́ние
        accept: ["Зада́ние гото́во."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "这几句都是带补语或表示状态的谓语，用短尾：[согла́сен с]{.ru} + 第五格，[гото́в]{.ru}，[похо́жа на]{.ru} + 第四格，[дово́льна]{.ru} + 第五格，[права́]{.ru}。注意性：第 3 题“她”用阴性，第 4 题奥尔加·维克托罗夫娜是女性，第 5 题安娜是女性。"
    items:
      - zh: 我同意你的意见。
        accept: ["Я согла́сен с тобо́й.", "Я согла́сна с тобо́й.", "Я с тобо́й согла́сен.", "Я с тобо́й согла́сна.", "Я согла́сен с ва́ми.", "Я согла́сна с ва́ми.", "Я с ва́ми согла́сен.", "Я с ва́ми согла́сна."]
        rubric: ["[согла́сен / согла́сна с]{.ru} + 第五格"]
      - zh: 午饭做好了。
        accept: ["Обе́д гото́в.", "Обе́д уже́ гото́в."]
        rubric: ["[гото́в]{.ru}：短尾阳性"]
      - zh: 她长得像妈妈。
        accept: ["Она́ похо́жа на ма́му.", "Она́ похо́жа на свою́ ма́му."]
        rubric: ["[похо́жа на]{.ru} + 第四格 [ма́му]{.ru}"]
      - zh: 奥尔加·维克托罗夫娜对我们很满意。
        accept: ["О́льга Ви́кторовна о́чень дово́льна на́ми.", "О́льга Ви́кторовна дово́льна на́ми."]
        rubric: ["[дово́льна]{.ru} + 第五格 [на́ми]{.ru}"]
      - zh: 安娜，你说得对。
        accept: ["А́нна, ты права́.", "Ты права́, А́нна."]
        rubric: ["[права́]{.ru}：阴性短尾，重音在词尾"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ в суббо́ту у Петро́вых была́ убо́рка? Кто что де́лал? Что А́нна нашла́ в шкафу́? Что Мари́я Никола́евна рассказа́ла о Па́схе? Что спроси́л Ми́ша по́сле убо́рки?]{.ru}"
        length: 50–80
        model: "Че́рез две неде́ли Па́сха, поэ́тому в суббо́ту у Петро́вых была́ больша́я убо́рка. Ива́н Серге́евич взял пылесо́с, А́нна вытира́ла пыль, а Ми́ша и Ван Лэй мы́ли о́кна. В ста́ром шкафу́ А́нна нашла́ деревя́нное яйцо́. Оно́ похо́же на настоя́щее. Мари́я Никола́евна рассказа́ла, что на Па́сху лю́ди кра́сят я́йца и да́рят их друг дру́гу. К обе́ду всё бы́ло гото́во, и Ми́ша спроси́л ма́му, свобо́ден ли он."
        rubric: ["回答全部五个问题", "至少三个短尾形容词，性数一致", "米沙的问话改成间接引语 [ли]{.ru}"]
        notes: 范文约 70 词。第一句用 [поэ́тому]{.ru} 交代原因；“谁做了什么”用并列句一口气说完；米沙的问话用第一册第 89 课学的 [ли]{.ru} 转述：[спроси́л ма́му, свобо́ден ли он]{.ru}。

  - id: e6
    type: open
    task: 作文。写一写你家过节（春节或别的节日）前是怎样准备的：谁做什么，你负责什么，准备好以后家里是什么样子，大家心情如何。
    items:
      - prompt: 写 100–150 词。至少用五个短尾形容词（如 [гото́в, чист, дово́лен, похо́ж, прав, согла́сен, рад, за́нят]{.ru}），其中至少两个带补语。
        length: 100–150
        model: "Пе́ред Пра́здником весны́ у нас до́ма всегда́ больша́я убо́рка. Все в семье́ за́няты. Ма́ма мо́ет о́кна и ку́хню, па́па разбира́ет ста́рые ве́щи на балко́не, а я вытира́ю пыль и мою́ пол. Я ма́ло помога́л ма́ме ра́ньше, но в про́шлом году́ сказа́л: «Я гото́в де́лать всё!» Ма́ма засмея́лась: «Хорошо́. Тогда́ все о́кна твои́». Я мыл их два часа́. Пото́м мы вме́сте де́лали пельме́ни. Ма́ма была́ дово́льна мной: мои́ пельме́ни бы́ли краси́вы, как у неё. Па́па сказа́л, что я похо́ж на де́душку: он то́же люби́л гото́вить. Ве́чером всё бы́ло гото́во, кварти́ра была́ чиста́. Ба́бушка то́же была́ дово́льна на́ми. Мы бы́ли о́чень ра́ды: пра́здник начина́лся!"
        rubric: ["写清楚准备过程：谁做什么", "至少五个短尾形容词，性数一致", "至少两个带补语（[дово́льна мной, похо́ж на]{.ru} 等）", "100–150 词"]
        notes: 范文按“分工—我的任务—成果—大家的心情”的顺序写。短尾形容词有 [за́няты, гото́в, дово́льна мной, краси́вы, похо́ж на де́душку, гото́во, чиста́, дово́льна, ра́ды]{.ru}。
