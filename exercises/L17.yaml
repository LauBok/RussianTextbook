lesson: L17
grammar: "动词过去时：不定式去掉 [-ть]{.ru}，加 [-л]{.ru}、[-ла]{.ru}、[-ло]{.ru}、[-ли]{.ru}，按主语的性和数变化，不分人称；[жил, жила́, жи́ли]{.ru} 阴性重音在词尾；[в саду́]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的过去时。
    why: 过去时看主语的性和数：男性 [-л]{.ru}，女性 [-ла]{.ru}，复数和 [вы]{.ru} 用 [-ли]{.ru}。第 3 题 [писа́ть]{.ru} 的过去时由不定式构成，没有 [ш]{.ru}；第 5 题 [жить]{.ru} 没有 [в]{.ru}，阴性重音在词尾 [жила́]{.ru}。第 6 题主语是 [ма́ма и па́па]{.ru}，用复数。
    items:
      - stem: Вчера́ Ми́ша ___ футбо́л.
        hint: смотре́ть
        accept: ["смотре́л"]
      - stem: Ма́ма ___ в па́рке.
        hint: гуля́ть
        accept: ["гуля́ла"]
      - stem: Ван Лэй ___ письмо́.
        hint: писа́ть
        accept: ["писа́л"]
      - stem: Ба́бушка ___ обе́д.
        hint: гото́вить
        accept: ["гото́вила"]
      - stem: Ра́ньше ба́бушка ___ в го́роде.
        hint: жить
        accept: ["жила́"]
      - stem: Ма́ма и па́па ___ на рабо́те.
        hint: рабо́тать
        accept: ["рабо́тали"]
      - stem: Что вы ___ вчера́, О́льга Ви́кторовна?
        hint: де́лать
        accept: ["де́лали"]

  - id: e2
    type: rewrite
    task: 把句子改成过去时，加上 [вчера́]{.ru}。
    placeholder: Вчера́ …
    example:
      cue: Я чита́ю. (Ван Лэй 说)
      answer: Вчера́ я чита́л.
    why: 过去时不分人称，[я]{.ru}、[ты]{.ru} 的形式要看说话人或对方的性别：王磊说 [я чита́л]{.ru}，安娜说 [я чита́ла]{.ru}。现在时 [пи́шет]{.ru}、[живу́т]{.ru} 词干有变化，过去时要从不定式 [писа́ть]{.ru}、[жить]{.ru} 构成。
    items:
      - cue: Я гуля́ю в па́рке. (А́нна 说)
        accept: ["Вчера́ я гуля́ла в па́рке.", "Я вчера́ гуля́ла в па́рке."]
      - cue: Пьер пи́шет упражне́ние.
        accept: ["Вчера́ Пьер писа́л упражне́ние.", "Пьер вчера́ писа́л упражне́ние."]
      - cue: Мы смо́трим бале́т.
        accept: ["Вчера́ мы смотре́ли бале́т.", "Мы вчера́ смотре́ли бале́т."]
      - cue: Ба́бушка гото́вит обе́д.
        accept: ["Вчера́ ба́бушка гото́вила обе́д.", "Ба́бушка вчера́ гото́вила обе́д."]
      - cue: Студе́нты отдыха́ют.
        accept: ["Вчера́ студе́нты отдыха́ли.", "Студе́нты вчера́ отдыха́ли."]
      - cue: Ю́ми говори́т по-япо́нски.
        accept: ["Вчера́ Ю́ми говори́ла по-япо́нски.", "Ю́ми вчера́ говори́ла по-япо́нски."]

  - id: e3
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：米沙一家去了别墅，爸爸和米沙在园子里干活、看足球，妈妈散步看书，奶奶做午饭；奶奶以前在学校工作。
    items:
      - stem: Вчера́ Ми́ша был ___.
        options: [на да́че, в теа́тре, в шко́ле]
        answer: на да́че
      - stem: Па́па и Ми́ша рабо́тали ___.
        options: [в саду́, на заво́де, на ку́хне]
        answer: в саду́
      - stem: Ма́ма ___.
        options: [гото́вила обе́д, гуля́ла и чита́ла, смотре́ла футбо́л]
        answer: гуля́ла и чита́ла
      - stem: Обе́д гото́вила ___.
        options: [ма́ма, ба́бушка, А́нна]
        answer: ба́бушка
      - stem: Ра́ньше ба́бушка рабо́тала ___.
        options: [в поликли́нике, в шко́ле, на заво́де]
        answer: в шко́ле

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语的“……了”“以前……”在这里都用过去时表达。注意主语的性别。
    items:
      - zh: 你昨天干什么了？（问女生）——我看书了。
        accept: ["— Что ты де́лала вчера́? — Я чита́ла.", "— Что ты вчера́ де́лала? — Я чита́ла.", "— Что ты де́лала вчера́? — Чита́ла.", "— Что ты вчера́ де́лала? — Чита́ла."]
        rubric: ["问女生用 [де́лала]{.ru}", "答句 [чита́ла]{.ru}"]
      - zh: 奶奶以前住在莫斯科。
        accept: ["Ра́ньше ба́бушка жила́ в Москве́.", "Ба́бушка ра́ньше жила́ в Москве́.", "Ба́бушка жила́ в Москве́ ра́ньше."]
        rubric: ["[жила́]{.ru}：阴性重音在词尾", "“以前”用 [ра́ньше]{.ru}"]
      - zh: 我们在园子里干活了。
        accept: ["Мы рабо́тали в саду́."]
        rubric: ["[рабо́тали]{.ru}：复数", "[в саду́]{.ru}：词尾 [-у́]{.ru}"]
      - zh: 王磊昨天写信了。
        accept: ["Ван Лэй вчера́ писа́л письмо́.", "Вчера́ Ван Лэй писа́л письмо́.", "Ван Лэй вчера́ писа́л пи́сьма.", "Вчера́ Ван Лэй писа́л пи́сьма."]
        rubric: ["[писа́л]{.ru}：过去时由不定式构成，没有 [ш]{.ru}"]
      - zh: 他们看了芭蕾，然后在市中心散步。
        accept: ["Они́ смотре́ли бале́т, а пото́м гуля́ли в це́нтре.", "Они́ смотре́ли бале́т, пото́м гуля́ли в це́нтре.", "Они́ смотре́ли бале́т, а пото́м они́ гуля́ли в це́нтре."]
        rubric: ["[смотре́ли]{.ru}、[гуля́ли]{.ru}：复数", "“然后”用 [пото́м]{.ru}", "[в це́нтре]{.ru}"]

  - id: e5
    type: open
    task: 缩写：按问题回答，连成一段话。
    items:
      - prompt: 根据课文回答下面的问题，然后把答案连成一段话：[Где бы́ли Петро́вы вчера́? Что де́лали па́па и Ми́ша? Что де́лала ма́ма? Что де́лала ба́бушка? О чём она́ спра́шивала? Где бы́ли Ван Лэй и А́нна?]{.ru}
        length: 40–70
        model: "Вчера́ Петро́вы бы́ли на да́че. Там живёт ба́бушка. Па́па и Ми́ша рабо́тали в саду́, а пото́м смотре́ли футбо́л. Ма́ма отдыха́ла: она́ гуля́ла и чита́ла. Ба́бушка гото́вила обе́д. Она́ спра́шивала о Кита́е. А Ван Лэй и А́нна бы́ли в теа́тре. Они́ смотре́ли бале́т."
        rubric: [用第三人称叙述, "过去时和主语的性、数一致", "[в саду́]{.ru}、[на да́че]{.ru}、[в теа́тре]{.ru} 用第六格", 包含问题里的全部信息]
        notes: 课文是对话，缩写时要改成第三人称叙述：米沙说的 [мы]{.ru} 改成 [Петро́вы]{.ru}，动词仍用复数。范文按问题的顺序组织，一个问题一到两句；用 [а пото́м]{.ru} 连接先后的动作，用 [а]{.ru} 转到另一群人。
