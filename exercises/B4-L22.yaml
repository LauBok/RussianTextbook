lesson: B4-L22
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Почему Чехов пишет брату Николаю? В чём, по мнению Чехова, единственный недостаток брата? Назовите три-четыре условия, которым, по Чехову, должны удовлетворять воспитанные люди. Что, по мнению Чехова, нужно, чтобы воспитаться? Какую неприятную новость Чехов сообщает брату Александру? Какие советы он даёт ему как автору пьесы?]{.ru}"
        length: 100–140
        model: "Чехов пишет Николаю, потому что тот обиделся на шутки брата и его друзей. По мнению Чехова, у Николая только один недостаток — невоспитанность. Воспитанные люди уважают человеческую личность и поэтому мягки и вежливы, они сострадательны, платят долги, не лгут даже в пустяках и не ищут известности. Если у них есть талант, они уважают его и жертвуют для него покоем. Чтобы воспитаться, мало прочитать несколько книг: нужен беспрерывный труд, постоянное чтение и воля. Александру Чехов сообщает, что их брат Николай тяжело заболел. Он советует Александру показать пьесу Суворину, сделать поправки, быть оригинальным и смелым, не бояться показаться глупым, писать кратко и искать новый сюжет."
        rubric: ["六个问题都回答，事实与选文一致", "至少说出三条“有教养的人”的条件", "建议至少说出三条，包括“简洁”", "100–140 词"]
        notes: "第一封信的条件不必全部列出，选三四条用自己的话说。第二封信要注意：坏消息是尼古拉的病（[Косой]{.ru} 是他的外号），建议在第三段。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[снисходительный]{.ru}"
        accept: ["Такой, который легко прощает другим их ошибки.", "Человек, который не строг к другим и легко прощает.", "Добрый, не строгий к другим."]
        rubric: ["说明是对别人宽容、不苛求的"]
      - zh: "[болтливый]{.ru}"
        accept: ["Такой, который слишком много говорит.", "Человек, который любит много говорить.", "Который говорит больше, чем нужно."]
        rubric: ["说明是话太多的"]
      - zh: "[самолюбие]{.ru}"
        accept: ["Когда человек очень заботится о том, что о нём думают другие.", "Уважение к себе."]
        rubric: ["说明是自尊心"]
      - zh: "[чистосердечный]{.ru}"
        accept: ["Честный и открытый.", "Искренний, честный.", "Такой, который говорит правду и ничего не скрывает."]
        rubric: ["说明是真诚、坦率的"]
      - zh: "[знаменитость]{.ru}"
        accept: ["Знаменитый человек.", "Человек, которого все знают.", "Очень известный человек."]
        rubric: ["说明是有名的人"]
      - zh: "[поправка]{.ru}"
        accept: ["Изменение, которое делают в тексте, чтобы он стал лучше.", "Изменение в тексте."]
        rubric: ["说明是对文字的修改"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题“扎别林”在契诃夫家是“酒鬼”的代称，称呼带着责备和玩笑，不是表示尊敬。第 2 题第一封信明说：[Недостаток же у тебя только один … Это — твоя крайняя невоспитанность]{.ru}。第 3 题第 6 条：[Истинные таланты всегда сидят в потёмках, в толпе]{.ru}，真正的天才不炫耀。第 4 题 [папаше и мамаше кушать нада]{.ru} 模仿儿语开玩笑，意思是写剧本也为了挣钱养家，并不是父母真的没饭吃。第 5 题 [брюшной тиф, притупление, хрипы, консилиум]{.ru} 是医学术语，契诃夫是医生。第 6 题拉丁语签名模仿教皇的签名，是只有家人才懂的玩笑，表示亲密。"
    items:
      - stem: "Обращение «Маленький Забелин!» — это ___."
        options: ["шутка с упрёком", "знак большого уважения", "настоящая фамилия брата"]
        answer: "шутка с упрёком"
      - stem: По мнению Чехова, главный недостаток Николая — ___.
        options: [невоспитанность, "то, что у него нет таланта", "то, что он много говорит"]
        answer: невоспитанность
      - stem: Настоящие таланты, по Чехову, ___.
        options: ["не любят показывать себя", "всегда стоят на выставке", "хвастают своими успехами"]
        answer: "не любят показывать себя"
      - stem: "Слова «папаше и мамаше кушать нада» значат, что ___."
        options: ["пьесы пишут и для того, чтобы получать деньги", "родители братьев очень голодны", "Чехов не умеет писать правильно"]
        answer: "пьесы пишут и для того, чтобы получать деньги"
      - stem: "Слова «брюшной тиф», «хрипы», «консилиум» во втором письме показывают, что ___."
        options: [Чехов был врачом, Чехов шутит, Александр был врачом]
        answer: Чехов был врачом
      - stem: "Подпись «Tuus magister bonus Antonius XIII» ___."
        options: ["шутка, понятная только своим", "официальная подпись Чехова", "название пьесы"]
        answer: "шутка, понятная только своим"

  - id: e4
    type: rewrite
    task: 两封信都是写给哥哥的私信。把下列句子改写成正式的书面语（用于文章或讲话），去掉口语、俗语和玩笑。
    example:
      cue: Не ломайся и снеси пьесу Суворину.
      answer: Не бойтесь и покажите пьесу Суворину.
    why: "私人书信的口语、俗语在正式语体里要换成中性的说法：[ломаться]{.ru}（扭捏）→ [не бояться]{.ru}，[снести]{.ru} → [показать]{.ru}；[удрать]{.ru}（溜走）→ [уйти]{.ru}、[уехать]{.ru}；[наплевать на водку]{.ru} → [бросить пить]{.ru}、[перестать пить]{.ru}；[кушать нада]{.ru} 是儿语，正式说法是 [семье нужно на что-то жить]{.ru} 或 [нужно получать деньги]{.ru}。称呼“你”也要换成“您”（命令式加 [-те]{.ru}）。"
    items:
      - cue: Недостаточно поехать на Якиманку, чтобы через неделю удрать оттуда.
        accept: ["Недостаточно поехать на Якиманку, чтобы через неделю уехать оттуда.", "Недостаточно поехать на Якиманку, чтобы через неделю уйти оттуда."]
      - cue: Он поспешит к ним и наплюёт на водку.
        accept: ["Он поспешит к ним и бросит пить.", "Он поспешит к ним и перестанет пить.", "Он поспешит к ним и бросит пить водку."]
      - cue: А главное — папаше и мамаше кушать нада.
        accept: ["А главное — нужно получать деньги.", "А главное — семье нужно на что-то жить.", "Главное — семье нужно на что-то жить."]

  - id: e5
    type: open
    task: 概要写作。用俄语把两封信的内容压缩到 150 词左右，用第三人称转述。
    items:
      - prompt: "[Кратко изложите содержание двух писем Чехова.]{.ru}"
        length: 130–170
        model: "В первом письме, написанном в 1886 году, Чехов обращается к брату Николаю, талантливому художнику, который много пил и обиделся на шутки близких. Чехов пишет, что у брата только один недостаток — невоспитанность. Затем он перечисляет условия, которым должны удовлетворять воспитанные люди: они уважают личность другого человека, сострадательны, платят долги, не лгут, не хвастают и не ищут известности, уважают свой талант. По мнению Чехова, чтобы стать воспитанным, нужен постоянный труд, чтение и воля. В конце он просит брата бросить пить и приехать к семье. Во втором письме, 1889 года, Чехов сообщает старшему брату Александру, что Николай тяжело болен. Потом он даёт советы Александру, который написал пьесу: показать её Суворину, не отдавать её в цензуру без поправок, быть смелым и оригинальным, не бояться показаться глупым и искать новые сюжеты. Он пишет, что краткость — сестра таланта. Письмо кончается шутливой подписью."
        rubric: ["两封信都写到：时间、收信人", "第一封信写出论点（缺乏教养）和至少三条条件", "第二封信写出坏消息和至少三条建议", "用转述动词（[пишет, перечисляет, сообщает, даёт советы]{.ru}）", "130–170 词"]
        notes: "范文约 130 词。概括书信时，先交代写信时间和收信人，再用转述动词说明写信人“做了什么”：[обращается, пишет, перечисляет, просит, сообщает, даёт советы]{.ru}。原信里的俗语和玩笑在概要中都换成了中性说法：[наплюёт на водку]{.ru} → [бросить пить]{.ru}。"

  - id: e6
    type: open
    task: 写一封私人信件。给一位朋友或兄弟姐妹写一封 250–300 词的俄语信：他（她）准备做一件重要的事（考试、找工作、写第一本书等），你给他（她）提出建议。要有亲切的称呼和署名，至少用一句格言式的话，口语和书面语可以混用，但要自然。
    items:
      - prompt: "[Письмо другу с советами]{.ru}"
        length: 250–300
        model: "Дорогой мой будущий великий переводчик!\n\nНаконец-то пишу тебе. Прости, что так долго молчал: всю неделю сдавал экзамены и ничего не успевал. Твоё письмо получил и очень обрадовался. Значит, ты всё-таки будешь переводить свою первую книгу! Поздравляю от всей души.\n\nТы спрашиваешь моего совета. Я, конечно, не Чехов, но кое-что скажу.\n\nВо-первых, не бойся ошибок. Первый перевод никогда не бывает хорошим. Пиши смело, а ошибки будешь искать потом. Помнишь, как Чехов советовал брату: «Не зализывай, не шлифуй, а будь неуклюж и дерзок»? Вот и ты сначала переведи всю книгу, а уже потом думай о каждом слове.\n\nВо-вторых, работай каждый день, хотя бы немного. Лучше две страницы в день, чем двадцать в воскресенье и ничего всю неделю. Талант без труда — как птица без крыльев.\n\nВ-третьих, обязательно покажи перевод опытному человеку. Нашей преподавательнице, например: она строгая, но справедливая. Не сердись на её поправки, ведь она хочет тебе помочь. А если рассердишься, вспомни, что «способность оскорбляться есть достояние только душ благородных».\n\nИ последнее: не забывай отдыхать. Гуляй, встречайся с друзьями, больше спи. Уставший переводчик похож на испорченный словарь.\n\nА главное, как говорится, папе и маме кушать надо, так что не забудь спросить, сколько тебе заплатят!\n\nКстати, я недавно снова прочитал письма Чехова к братьям. Удивительно, как просто и весело он умел говорить о самых серьёзных вещах. Мне кажется, тебе тоже будет интересно их прочитать: в них много мудрых советов и для переводчиков. Не сердись, если что-то не получится сразу.\n\nПиши, как идут дела. Летом приеду — отметим твою первую книгу.\n\nОбнимаю тебя крепко.\n\nТвой старый друг и строгий учитель Саша"
        rubric: ["有书信格式：称呼、开头的寒暄、正文、结尾、署名", "至少三条具体的建议，条理清楚（[во-первых, во-вторых]{.ru}）", "至少一句格言式的话", "口语和书面语的混用自然，体现私人书信的亲切语气", "250–300 词"]
        notes: "范文约 250 词。仿照契诃夫的手法：玩笑式的称呼（[Дорогой мой будущий великий переводчик!]{.ru}）和署名（[Твой старый друг и строгий учитель]{.ru}）；用 [во-первых, во-вторых, в-третьих]{.ru} 分条，像第一封信的编号一样；格言式的句子（[Талант без труда — как птица без крыльев]{.ru}）；引用契诃夫的话制造幽默。私人信件开头常为久不写信道歉（[Прости, что так долго молчал]{.ru}），结尾常用 [Обнимаю]{.ru}、[Пиши]{.ru}。"
