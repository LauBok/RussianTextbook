lesson: L67
grammar: "[на]{.ru} + 第六格表示乘坐的交通工具（[на авто́бусе, на метро́]{.ru}）；[на чём?]{.ru}；[пешко́м]{.ru}；[е́хать / е́здить]{.ru} 与 [идти́ / ходи́ть]{.ru} 的选择。"
exercises:

  - id: e1
    type: fill
    task: 用 [на]{.ru} + 第六格填空。
    why: 交通工具用 [на]{.ru} + 第六格，阳性、阴性名词词尾都是 [-е]{.ru}：[на авто́бусе]{.ru}、[на маши́не]{.ru}、[на трамва́е]{.ru}。第 3、5 题 [метро́]{.ru}、[такси́]{.ru} 不变格。
    items:
      - stem: Ма́ма е́здит на рабо́ту ___.
        hint: авто́бус
        accept: [на авто́бусе]
      - stem: Па́па е́здит на заво́д ___.
        hint: маши́на
        accept: [на маши́не]
      - stem: Мы обы́чно е́здим в университе́т ___.
        hint: метро́
        accept: [на метро́]
      - stem: Сего́дня мы е́дем ___.
        hint: трамва́й
        accept: [на трамва́е]
      - stem: Ве́чером Оле́г Петро́вич е́дет домо́й ___.
        hint: такси́
        accept: [на такси́]

  - id: e2
    type: choice
    task: 选择正确的动词。
    why: 坐车用 [е́хать / е́здить]{.ru}，步行用 [идти́ / ходи́ть]{.ru}；经常性的往返用不定向动词 [е́здить, ходи́ть]{.ru}，此刻、这一次用定向动词 [е́хать, идти́]{.ru}。第 4 题说的是电车本身在行驶，用 [идёт]{.ru}。
    items:
      - stem: Ми́ша ка́ждый день ___ в шко́лу пешко́м.
        options: [хо́дит, е́здит, е́дет]
        answer: хо́дит
      - stem: Мари́я Никола́евна ка́ждый день ___ в поликли́нику на авто́бусе.
        options: [хо́дит, е́здит, е́дет]
        answer: е́здит
      - stem: Сего́дня А́нна и Ван Лэй ___ на трамва́е.
        options: [е́дут, е́здят, иду́т]
        answer: е́дут
      - stem: Трамва́й ___ ме́дленно.
        options: [идёт, е́дет, хо́дит]
        answer: идёт
      - stem: — Куда́ ты ___? — В университе́т, на метро́.
        options: [е́дешь, идёшь, хо́дишь]
        answer: е́дешь

  - id: e3
    type: rewrite
    task: 按例句回答问题。
    placeholder: … на … / … пешко́м.
    example:
      cue: На чём ты е́здишь в университе́т? (метро́)
      answer: Я е́зжу в университе́т на метро́.
    why: "[е́здить]{.ru} 第一人称是 [е́зжу]{.ru}，[зд]{.ru} 变成 [зж]{.ru}，容易写错。第 4 题“走着去”要换动词：[хожу́ пешко́м]{.ru}，不说 [е́зжу пешко́м]{.ru}。"
    items:
      - cue: На чём ма́ма е́здит на рабо́ту? (авто́бус)
        accept: [Ма́ма е́здит на рабо́ту на авто́бусе., Она́ е́здит на рабо́ту на авто́бусе.]
      - cue: На чём вы е́здите на да́чу? (маши́на)
        accept: [Мы е́здим на да́чу на маши́не.]
      - cue: На чём ты е́дешь сего́дня? (трамва́й)
        accept: [Сего́дня я е́ду на трамва́е., Я е́ду сего́дня на трамва́е., Я е́ду на трамва́е.]
      - cue: Как ты хо́дишь в шко́лу? (пешко́м)
        accept: [Я хожу́ в шко́лу пешко́м.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 2 题“坐地铁”是 [на метро́]{.ru}，不是 [в метро́]{.ru}。第 4 题“能看见”用无人称句 [ви́дно]{.ru}。
    items:
      - zh: ——你怎么去大学？——坐地铁。
        accept: ["— На чём ты е́здишь в университе́т? — На метро́.", "— Как ты е́здишь в университе́т? — На метро́.", "— На чём ты е́дешь в университе́т? — На метро́.", "— На чём ты е́здишь в университе́т? — Я е́зжу на метро́.", "— На чём ты е́здишь в университе́т? — Я е́зжу в университе́т на метро́.", "— Как ты е́здишь в университе́т? — Я е́зжу на метро́."]
        rubric: ["[на чём]{.ru} 或 [как]{.ru} 提问", "[на метро́]{.ru}，不说 [в метро́]{.ru}"]
      - zh: 今天地铁站在维修，我们坐有轨电车去。
        accept: ["Сего́дня на ста́нции метро́ ремо́нт, мы е́дем на трамва́е.", "Сего́дня на ста́нции метро́ ремо́нт, и мы е́дем на трамва́е.", "Сего́дня на ста́нции метро́ ремо́нт. Мы е́дем на трамва́е."]
        rubric: ["[на ста́нции]{.ru} 第六格", "这一次用定向动词 [е́дем]{.ru}", "[на трамва́е]{.ru}"]
      - zh: 学校不远，米沙走着去上学。
        accept: ["Шко́ла недалеко́, Ми́ша хо́дит в шко́лу пешко́м.", "Шко́ла недалеко́, и Ми́ша хо́дит в шко́лу пешко́м.", "Шко́ла недалеко́. Ми́ша хо́дит в шко́лу пешко́м."]
        rubric: ["[пешко́м]{.ru} 和 [ходи́ть]{.ru} 连用", "[в шко́лу]{.ru} 第四格"]
      - zh: 从电车里能看见城市。
        accept: ["Из трамва́я ви́дно го́род.", "Из трамва́я го́род ви́дно."]
        rubric: ["[из]{.ru} + 第二格 [трамва́я]{.ru}", "无人称句 [ви́дно]{.ru}"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 写一写你和你的家人每天怎么去上班、上学：坐什么、要多长时间、路上做什么。50–80 词。
        length: 50–80
        model: |
          Мой па́па рабо́тает инжене́ром. Его́ заво́д далеко́, и он е́здит на рабо́ту на маши́не. Ма́ма е́здит в шко́лу на авто́бусе: остано́вка ря́дом с на́шим до́мом. А я обы́чно е́зжу в университе́т на метро́. На метро́ я е́ду полчаса́. В метро́ я чита́ю и́ли слу́шаю му́зыку. Иногда́ я хожу́ пешко́м: э́то це́лый час, зато́ я ви́жу го́род.
        rubric: ["每个人用 [на]{.ru} + 第六格或 [пешко́м]{.ru}", "坐车用 [е́здить]{.ru}，步行用 [ходи́ть]{.ru}", "区分 [на метро́]{.ru}（乘坐）和 [в метро́]{.ru}（在地铁里）"]
        notes: 范文按人物逐个说，每人一两句；最后写自己时加上时间长度和路上做的事。[В метро́ я чита́ю]{.ru} 里的 [в метро́]{.ru} 指在车厢里，和 [на метро́]{.ru} 用法不同，范文特意把两者放在一起。
