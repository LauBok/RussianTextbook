lesson: B3-L06
grammar: "形动词短语与 [кото́рый]{.ru} 从句的互换：第一格 [кото́рый]{.ru} ↔ 主动形动词（现在时 ↔ 现在时形动词，过去时 ↔ 过去时形动词）；第四格 [кото́рый]{.ru} ↔ 被动形动词，从句主语变第五格；其他格和带前置词的 [кото́рый]{.ru} 不能换。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Где учился Чайковский, прежде чем стать музыкантом? Что говорили знакомые о его решении поступить в консерваторию? Какую роль в его жизни сыграла Надежда фон Мекк? Какое горе пережил Чайковский в детстве? Где Чайковский выступал в 1891 году? Как сегодня помнят Чайковского?]{.ru}"
        length: 70–110
        model: "Сначала Чайковский учился в Училище правоведения в Петербурге, которое готовило чиновников, а потом служил в Министерстве юстиции. Знакомые, не понимавшие его решения, говорили, что в двадцать два года начинать учиться музыке поздно. Надежда фон Мекк, любившая его музыку, каждый год посылала ему деньги, и он смог оставить преподавание и заниматься только музыкой. Когда ему было четырнадцать лет, его мать умерла от холеры. В 1891 году Чайковский выступал в Нью-Йорке на открытии концертного зала, который сегодня называется Карнеги-холл. Сегодня в Клину работает его музей, а в Москве проходит Международный конкурс имени Чайковского."
        rubric: ["六个问题都回答，内容与课文一致", "至少一处形动词短语和一处 [который]{.ru} 从句", "用完整的句子"]
        notes: "[прежде чем]{.ru} 在……之前。范文有意交替使用形动词短语（[не понимавшие]{.ru}、[любившая]{.ru}）和 [который]{.ru} 从句（[которое готовило]{.ru}、[который называется]{.ru}）。"

  - id: e2
    type: rewrite
    task: 把 [который]{.ru} 从句改成形动词短语。先判断 [который]{.ru} 的格，再决定用主动还是被动形动词。
    example:
      cue: Балеты, которые написал Чайковский, идут во всём мире.
      answer: Балеты, написанные Чайковским, идут во всём мире.
    why: "第 1 题 [которые]{.ru} 是第一格（发出者），动词是过去时未完成体 [любили]{.ru} → 主动形动词过去时 [любившие]{.ru}。第 2 题 [которую]{.ru} 是第四格（对象），完成体过去时 [построили]{.ru} → 被动形动词过去时 [построенную]{.ru}；原句没有主语，短语里不加第五格；形动词随 [в консерваторию]{.ru} 用阴性第四格。第 3 题 [который]{.ru} 第一格，现在时 [мечтает]{.ru} → [мечтающий]{.ru}，与 [пианист]{.ru} 一致。第 4 题 [которую]{.ru} 第四格，过去时完成体 [создал]{.ru} → [созданной]{.ru}，主语 [он]{.ru} 变成第五格 [им]{.ru}；[о симфонии]{.ru} 是第六格，形动词也用第六格。第 5 题 [которая]{.ru} 第一格，[продолжалась → продолжавшаяся]{.ru}，[-ся]{.ru} 保留。"
    items:
      - cue: Родители, которые любили музыку, не думали, что сын станет музыкантом.
        accept: ["Родители, любившие музыку, не думали, что сын станет музыкантом.", "Любившие музыку родители не думали, что сын станет музыкантом."]
      - cue: Он поступил в консерваторию, которую только что построили.
        accept: ["Он поступил в консерваторию, только что построенную.", "Он поступил в только что построенную консерваторию."]
      - cue: Пианист, который мечтает о победе, много занимается.
        accept: ["Пианист, мечтающий о победе, много занимается.", "Мечтающий о победе пианист много занимается."]
      - cue: Мы говорили о симфонии, которую он создал в Клину.
        accept: ["Мы говорили о симфонии, созданной им в Клину.", "Мы говорили о созданной им в Клину симфонии."]
      - cue: Переписка, которая продолжалась тринадцать лет, помогла композитору.
        accept: ["Переписка, продолжавшаяся тринадцать лет, помогла композитору.", "Продолжавшаяся тринадцать лет переписка помогла композитору."]

  - id: e3
    type: rewrite
    task: 把形动词短语改成 [который]{.ru} 从句。
    example:
      cue: Знакомые, не понимавшие его решения, говорили, что начинать поздно.
      answer: Знакомые, которые не понимали его решения, говорили, что начинать поздно.
    why: "反方向的步骤：主动形动词 → 第一格 [который]{.ru}，形动词的时间就是从句动词的时间；被动形动词 → 第四格 [который]{.ru}，第五格的发出者变成从句的主语。[который]{.ru} 的性、数跟被说明的名词，格由它在从句里的作用决定。第 1 题 [идущие]{.ru} 现在时 → [которые идут]{.ru}。第 2 题 [приглашённый в Америку]{.ru} 是被动形动词，原短语没有发出者，从句用不定人称形式 [которого пригласили]{.ru}，[который]{.ru} 用阳性第四格（动物名词同第二格）。第 3 题 [открытую в 1862 году]{.ru} 是被动形动词，没有发出者，从句用不定人称形式 [которую открыли]{.ru}，[которую]{.ru} 与 [консерваторию]{.ru} 一样是阴性第四格。第 4 题 [ставший]{.ru} 完成体过去时 → [который стал]{.ru}。"
    items:
      - cue: Балеты, идущие на сценах многих стран, знают все.
        accept: ["Балеты, которые идут на сценах многих стран, знают все."]
      - cue: Композитор, приглашённый в Америку, выступал в Нью-Йорке.
        accept: ["Композитор, которого пригласили в Америку, выступал в Нью-Йорке.", "Композитор, который был приглашён в Америку, выступал в Нью-Йорке."]
      - cue: Он поступил в консерваторию, открытую в 1862 году.
        accept: ["Он поступил в консерваторию, которую открыли в 1862 году.", "Он поступил в консерваторию, которая была открыта в 1862 году."]
      - cue: Композитор, ставший символом русской музыки, начинал как чиновник.
        accept: ["Композитор, который стал символом русской музыки, начинал как чиновник."]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [в котором]{.ru} 带前置词、是第六格，不能换成形动词，只能用从句。第 2 题被说明的 [письма]{.ru} 是写的对象，[она]{.ru} 写的 → 被动形动词，复数第四格 [написанные]{.ru}，[ею]{.ru} 第五格；[написавшие]{.ru} 是主动形动词，意思变成“信写了（东西）”。第 3 题 [композитору]{.ru} 是第三格，形动词也要第三格：[любившему]{.ru}。第 4 题 [писать]{.ru} 没有被动形动词现在时，“正在写的交响曲”只能用从句 [которую он пишет]{.ru}。"
    items:
      - stem: Это зал, ___ выступал Чайковский.
        options: [выступавший, в котором, который]
        answer: в котором
      - stem: Чайковский внимательно читал все письма, ___ ею.
        options: [написавшие, написанные, написанных]
        answer: написанные
      - stem: Она написала письмо композитору, ___ свою работу больше всего на свете.
        options: [любивший, любившему, любившего]
        answer: любившему
      - stem: Друзья спрашивали о симфонии, ___.
        options: [пишемой им, которую он пишет, пишущей им]
        answer: которую он пишет

  - id: e5
    type: translate
    task: 翻译下列句子。能用形动词短语的句子给出两种译法：一种用形动词短语，一种用 [который]{.ru} 从句。
    items:
      - zh: 热爱他音乐的富孀给作曲家写了一封信。
        accept: ["Богатая вдова, любившая его музыку, написала композитору письмо.", "Богатая вдова, которая любила его музыку, написала композитору письмо.", "Богатая вдова, любившая его музыку, написала письмо композитору.", "Богатая вдова, которая любила его музыку, написала письмо композитору.", "Любившая его музыку богатая вдова написала композитору письмо.", "Любившая его музыку богатая вдова написала письмо композитору."]
        rubric: ["[любившая]{.ru}：阴性第一格，与 [вдова]{.ru} 一致；或 [которая любила]{.ru}", "[написать письмо кому]{.ru}：[композитору]{.ru} 第三格"]
      - zh: 柴可夫斯基写的芭蕾舞剧在世界各地上演。
        accept: ["Балеты, написанные Чайковским, идут во всём мире.", "Балеты, которые написал Чайковский, идут во всём мире.", "Балеты, написанные Чайковским, идут по всему миру.", "Балеты, которые написал Чайковский, идут по всему миру.", "Написанные Чайковским балеты идут во всём мире."]
        rubric: ["被动形动词 [написанные Чайковским]{.ru}，发出者第五格；或 [которые написал Чайковский]{.ru}", "[идти]{.ru} 上演"]
      - zh: 我们参观了他在其中写出第六交响曲的那座房子。
        accept: ["Мы были в доме, в котором он написал Шестую симфонию.", "Мы были в доме, где он написал Шестую симфонию."]
        rubric: ["[в котором]{.ru} 带前置词，不能换成形动词，只能用从句（也可以用 [где]{.ru}）"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段，形动词短语和 [который]{.ru} 从句交替使用。
    items:
      - prompt: 提纲：童年和法学学校；进音乐学院；莫斯科的十二年；冯·梅克；世界声誉和克林；纪念。每项一到两句，保留关键年份，形动词短语和 [который]{.ru} 从句各至少用两处。
        length: 120–150
        model: "Балеты Чайковского идут на сценах многих стран. Пётр Чайковский родился в 1840 году в семье горного инженера. Мальчик, рано начавший заниматься музыкой, учился в Училище правоведения, которое готовило чиновников, и потом служил в министерстве. В 1862 году он поступил в консерваторию, только что открытую в Петербурге, а через четыре года начал преподавать в Москве. Здесь были написаны его первые симфонии и балет «Лебединое озеро». Надежда фон Мекк, которая любила его музыку, много лет посылала ему деньги, и он смог заниматься только музыкой. В восьмидесятые годы композитор, которого знала уже вся Европа, дирижировал своими произведениями в разных странах, а Кембриджский университет присвоил ему звание почётного доктора. Последние годы он жил в Клину, где написал Шестую симфонию. Он умер в 1893 году. Сегодня молодые музыканты, приезжающие на конкурс его имени, играют его музыку."
        rubric: ["提纲六项都有，顺序与课文一致", "年份准确：1840、1862、1893", "形动词短语和 [который]{.ru} 从句各至少两处，格的选择正确", "120–150 词"]
        notes: "范文约 130 词。形动词短语：[рано начавший заниматься музыкой]{.ru}、[только что открытую в Петербурге]{.ru}、[приезжающие на конкурс]{.ru}；[который]{.ru} 从句：[которое готовило чиновников]{.ru}、[которая любила его музыку]{.ru}、[которого знала уже вся Европа]{.ru}（第四格 [которого]{.ru}，也可以换成 [известный уже всей Европе]{.ru}）。"

  - id: e7
    type: choice
    task: 选择适当的词填空。
    why: "第 1 题 [умереть от чего]{.ru} 死于某种疾病，[от холеры]{.ru}；[потеря]{.ru} 是“丧失”，不是病名。第 2 题“授予称号”是 [присвоить звание]{.ru}；[пригласить]{.ru} 是“邀请”，[отдать]{.ru} 是“交给”，都不和 [звание]{.ru} 搭配。第 3 题“婚姻不幸”说 [брак оказался несчастливым]{.ru}，[кризис]{.ru} 是“危机”，不能“不幸”。第 4 题能和音乐传统融合的是“民间旋律” [народные мелодии]{.ru}；[прогулки]{.ru} 是“散步”，[звания]{.ru} 是“称号”，都不是音乐。第 5 题 [расстаться с кем]{.ru} 分开、分手，主语是 [супруги]{.ru}。"
    items:
      - stem: Когда Чайковскому было четырнадцать лет, его мать умерла от ___.
        options: [потери, холеры, кризиса]
        answer: холеры
      - stem: Кембриджский университет ___ ему звание почётного доктора.
        options: [пригласил, присвоил, отдал]
        answer: присвоил
      - stem: Брак оказался ___, и вскоре супруги расстались.
        options: [несчастливым, классическим, почётным]
        answer: несчастливым
      - stem: В его музыке народные ___ соединяются с традициями европейской музыки.
        options: [мелодии, прогулки, звания]
        answer: мелодии
      - stem: Через несколько недель супруги ___.
        options: [расстались, соединялись, присвоили]
        answer: расстались
