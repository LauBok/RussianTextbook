lesson: L88
grammar: "间接引语：转述陈述句用 [что]{.ru}，转述特殊疑问句保留疑问词 [где, когда́, что]{.ru} 等；人称按转述者的角度改变，动词的时保持原话不变。"
exercises:

  - id: e1
    type: rewrite
    task: 把直接引语改成间接引语。
    example:
      cue: "Ка́тя сказа́ла: «Я позвоню́ ве́чером»."
      answer: Ка́тя сказа́ла, что позвони́т ве́чером.
    why: 陈述句用 [что]{.ru} 连接，去掉引号和冒号，加逗号。原话里的“我”改成第三人称，动词人称跟着变：[позвоню́ → позвони́т]{.ru}。时不变：原话是将来时，转述也用将来时，不能改成过去时。
    items:
      - cue: "А́нна сказа́ла: «Я бу́ду до́ма ве́чером»."
        accept: ["А́нна сказа́ла, что она́ бу́дет до́ма ве́чером.", "А́нна сказа́ла, что бу́дет до́ма ве́чером.", "А́нна сказа́ла, что ве́чером она́ бу́дет до́ма.", "А́нна сказа́ла, что ве́чером бу́дет до́ма."]
      - cue: "Ка́тя сказа́ла: «Я купи́ла биле́ты»."
        accept: ["Ка́тя сказа́ла, что она́ купи́ла биле́ты.", "Ка́тя сказа́ла, что купи́ла биле́ты."]
      - cue: "Ми́ша сказа́л: «У меня́ то́же контро́льная»."
        accept: ["Ми́ша сказа́л, что у него́ то́же контро́льная."]
      - cue: "Ван Лэй сказа́л: «Я здоро́в»."
        accept: ["Ван Лэй сказа́л, что он здоро́в.", "Ван Лэй сказа́л, что здоро́в."]
      - cue: "О́льга Ви́кторовна написа́ла: «В понеде́льник бу́дет контро́льная»."
        accept: ["О́льга Ви́кторовна написа́ла, что в понеде́льник бу́дет контро́льная."]

  - id: e2
    type: rewrite
    task: 把问句改成间接疑问句。
    example:
      cue: "Ка́тя спроси́ла: «Когда́ А́ня бу́дет до́ма?»"
      answer: Ка́тя спроси́ла, когда́ А́ня бу́дет до́ма.
    why: 特殊疑问句转述时不加 [что]{.ru}，用原来的疑问词连接，句末用句号。人称要按转述者的角度改：第 3 题米沙问“你”，我转述成“我”。
    items:
      - cue: "А́нна спроси́ла: «Где бу́дет конце́рт?»"
        accept: ["А́нна спроси́ла, где бу́дет конце́рт."]
      - cue: "Ма́ма спроси́ла: «Когда́ начина́ется уро́к?»"
        accept: ["Ма́ма спроси́ла, когда́ начина́ется уро́к."]
      - cue: "Ми́ша спроси́л меня́: «Что ты де́лаешь?»"
        accept: ["Ми́ша спроси́л, что я де́лаю.", "Ми́ша спроси́л меня́, что я де́лаю."]
      - cue: "Врач спроси́л: «Что у вас боли́т?»"
        accept: ["Врач спроси́л, что у меня́ боли́т.", "Врач спроси́л, что у него́ боли́т.", "Врач спроси́л, что у неё боли́т."]

  - id: e3
    type: choice
    task: 选择正确的连接词。
    why: "转述陈述句用 [что]{.ru}；转述问句用原来的疑问词。第 2 题原话问“在哪儿”，用 [где]{.ru}；第 4 题原话问“什么时候”，用 [когда́]{.ru}；第 5 题原话问“什么”，这里的 [что]{.ru} 是代词。"
    items:
      - stem: Ка́тя сказа́ла, ___ позвони́т ве́чером.
        options: [что, где, когда́]
        answer: что
      - stem: А́нна спроси́ла, ___ бу́дет конце́рт.
        options: [что, где, когда́]
        answer: где
      - stem: Я ду́мала, ___ контро́льная бу́дет в сре́ду.
        options: [что, где, когда́]
        answer: что
      - stem: Ка́тя спроси́ла, ___ А́нна бу́дет до́ма.
        options: [что, где, когда́]
        answer: когда́
      - stem: Ми́ша спроси́л, ___ я чита́ю.
        options: [что, где, когда́]
        answer: что

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 卡佳说她晚上打电话。
        accept: ["Ка́тя сказа́ла, что позвони́т ве́чером.", "Ка́тя сказа́ла, что она́ позвони́т ве́чером.", "Ка́тя сказа́ла, что ве́чером позвони́т.", "Ка́тя сказа́ла, что ве́чером она́ позвони́т."]
        rubric: ["[что]{.ru} 前有逗号", "动词保持将来时 [позвони́т]{.ru}，不能改成过去时"]
      - zh: 她问你什么时候在家。
        accept: ["Она́ спроси́ла, когда́ ты бу́дешь до́ма."]
        rubric: ["疑问词 [когда́]{.ru} 直接连接，不加 [что]{.ru}", "句末用句号", "将来时 [бу́дешь]{.ru}"]
      - zh: 我以为测验在星期三。
        accept: ["Я ду́мал, что контро́льная бу́дет в сре́ду.", "Я ду́мала, что контро́льная бу́дет в сре́ду."]
        rubric: ["[ду́мал / ду́мала, что…]{.ru}", "星期用 [в]{.ru} + 第四格 [в сре́ду]{.ru}"]
      - zh: 要给她带什么话吗？
        accept: ["Что ей переда́ть?", "Что ей мо́жно переда́ть?"]
        rubric: ["[переда́ть]{.ru} 不定式句", "[ей]{.ru} 第三格"]

  - id: e5
    type: open
    task: 情景：转述电话留言。
    items:
      - prompt: 你一个人在家。米沙的朋友打来电话，说明天的足球比赛改到四点，问米沙什么时候回家，还说他晚上会再打来。米沙回家后，你用间接引语把留言转述给他（至少用三句间接引语），再写一张给米沙的字条。
        length: 50–90
        model: |-
          — Ми́ша, тебе́ звони́л твой друг. Он сказа́л, что за́втра футбо́л бу́дет в четы́ре часа́. Он спроси́л, когда́ ты бу́дешь до́ма. Я отве́тил, что ты бу́дешь ве́чером. Он сказа́л, что позвони́т ещё раз.
          Запи́ска: «Ми́ша! Звони́л твой друг. Футбо́л за́втра в четы́ре. Ве́чером он позвони́т. Ван Лэй».
        rubric: ["至少三句间接引语", "陈述句用 [что]{.ru}，问句用 [когда́]{.ru}", "转述时人称改变、时不变", "字条简短，有称呼和署名"]
        notes: 转述的部分按通话顺序：对方说了什么、问了什么、你怎么回答、对方最后说了什么。字条只写要点，用短句，不用间接引语，和课文里王磊写给安娜的字条一样。
