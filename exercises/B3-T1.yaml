lesson: B3-T1
heading: 期中测试
intro: 满分 150 分，建议用时 150 分钟。考查范围：第三册第 1–30 课。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：主动形动词现在时和被说明的名词同性、数、格，[студента]{.ru} 是阳性动物名词第四格，形动词也用第四格（同第二格）[живущего]{.ru}（第 1、7 课）。第 2 题：“说了一句话”用完成体 [сказать]{.ru}，接第三格和 [что]{.ru} 从句；[разговаривать, беседовать]{.ru} 是双方交谈，要求 [с кем]{.ru}，[болтать]{.ru} 是闲聊，都不能接 [мне, что…]{.ru}（第 29 课）。第 3 题：问题是被讨论的对象，又是经常的事，用未完成体被动形动词现在时 [обсуждаемые]{.ru}；[обсуждающие, обсуждавшие]{.ru} 是主动形动词，意思变成“问题讨论别的东西”；[обсуждаемых]{.ru} 和第一格的 [вопросы]{.ru} 不一致（第 3 课）。第 4 题：信是被写的，[отцом]{.ru} 是第五格的发出者，用被动形动词过去时 [написанное]{.ru}，和中性的 [письмо]{.ru} 一致（第 4 课）。第 5 题：作谓语用短尾，和阴性的 [церковь]{.ru} 一致：[была построена]{.ru}；长尾 [построенная]{.ru} 只作定语（第 5 课）。第 6 题：[одним из студентов]{.ru} 里形动词说明的是复数第二格 [студентов]{.ru}，用 [окончивших]{.ru}，不和 [одним]{.ru} 一致（第 7 课）。第 7 题：名词化的形动词 [присутствующие]{.ru}“在场的人”作主语，用复数第一格（第 8 课）。第 8 题：[уже три года]{.ru} 说明是持续的过程，用未完成体 [-ся]{.ru} 动词 [строится]{.ru}；[построен]{.ru} 表示结果；[строят, построили]{.ru} 是不定人称句，宾语要用第四格，而这里的 [мост]{.ru} 是主语（第 9 课）。第 9 题：“一边走一边谈”是同时进行的动作，用未完成体副动词 [разговаривая]{.ru}；[поговорив]{.ru} 表示先谈完再走；[разговаривающие, разговаривавшие]{.ru} 是形动词，要说明名词（第 11 课）。第 10 题：先回到家，再坐下做功课，用完成体副动词；[вернуться]{.ru} 带 [-ся]{.ru}，副动词只能是 [вернувшись]{.ru}；[возвращаясь]{.ru} 表示同时，[вернувшийся]{.ru} 是形动词，不定式 [вернуться]{.ru} 不能单独作状语（第 12 课）。第 11 题：“尽管天气不好”用 [несмотря на]{.ru} + 第四格，[плохую погоду]{.ru} 正是第四格；[благодаря, судя по]{.ru} 要求第三格，[из-за]{.ru} 要求第二格，意思也不对（第 15 课）。第 12 题：[приходится]{.ru} 构成无人称句，主体用第三格 [брату]{.ru}；用第一格 [брат]{.ru} 是按汉语“哥哥常常得……”硬套的错误（第 16 课）。第 13 题：[не хватает]{.ru} 缺少的东西用第二格：[свободного времени]{.ru}（第 16 课）。第 14 题：[свежую рыбу]{.ru} 是第四格，句中没有主语，是不定人称句，动词用复数 [продают]{.ru}；[продаётся]{.ru} 要求主语用第一格 [рыба]{.ru}（第 17 课）。第 15 题：[не надо]{.ru} + 未完成体不定式表示“不必”：[не надо звонить]{.ru}；不说 [не надо позвонить]{.ru}（第 18 课）。第 16 题：[я бы на твоём месте]{.ru} 是委婉的建议，[бы]{.ru} 后面用过去时形式 [поговорил]{.ru}（第 19 课）。第 17 题：动名词保留动词的意思，但原来的直接宾语要变成第二格：[изучать иностранные языки → изучение иностранных языков]{.ru}（第 21 课）。第 18 题：[кофе]{.ru} 是阳性，按规范说 [вкусный кофе]{.ru}；口语里的中性 [вкусное кофе]{.ru} 不用在书面语和考试里（第 23 课）。第 19 题：[-ов, -ин]{.ru} 结尾的女姓按 [-ой]{.ru} 变格，第五格 [с Анной Ивановой]{.ru}；[Ивановым]{.ru} 是男姓的第五格（第 27 课）。第 20 题：缩略词的性看全称里的主要词，[МГУ]{.ru} 的主要词是 [университет]{.ru}，阳性：[был основан]{.ru}（第 26 课）。
  items:
  - stem: Я знаю студента, ___ в соседней комнате.
    options:
    - живущий
    - живущего
    - живущему
    - живущим
    answer: живущего
  - stem: Он ___ мне, что придёт завтра.
    options:
    - разговаривал
    - беседовал
    - болтал
    - сказал
    answer: сказал
  - stem: Вопросы, ___ на этом семинаре, всегда интересны.
    options:
    - обсуждаемые
    - обсуждающие
    - обсуждавшие
    - обсуждаемых
    answer: обсуждаемые
  - stem: Мы нашли письмо, ___ отцом много лет назад.
    options:
    - написавшее
    - пишущее
    - написанное
    - писавшее
    answer: написанное
  - stem: Эта церковь ___ в семнадцатом веке.
    options:
    - построенная
    - была построена
    - было построено
    - был построен
    answer: была построена
  - stem: Он был одним из первых студентов, ___ этот курс.
    options:
    - окончивших
    - окончившим
    - окончивший
    - окончившего
    answer: окончивших
  - stem: Когда в зал вошёл профессор, все ___ встали.
    options:
    - присутствующих
    - присутствующим
    - присутствующими
    - присутствующие
    answer: присутствующие
  - stem: Новый мост через реку ___ уже три года.
    options:
    - построен
    - строят
    - строится
    - построили
    answer: строится
  - stem: Мы шли по набережной, ___ о будущем.
    options:
    - поговорив
    - разговаривая
    - разговаривающие
    - разговаривавшие
    answer: разговаривая
  - stem: ___ домой, Миша сразу сел за уроки.
    options:
    - Возвращаясь
    - Вернуться
    - Вернувшийся
    - Вернувшись
    answer: Вернувшись
  - stem: ___ плохую погоду, мы поехали за город.
    options:
    - Несмотря на
    - Благодаря
    - Судя по
    - Из-за
    answer: Несмотря на
  - stem: В детстве ___ часто приходилось помогать родителям.
    options:
    - брат
    - брата
    - брату
    - братом
    answer: брату
  - stem: Студентам всегда не хватает ___.
    options:
    - свободного времени
    - свободное время
    - свободным временем
    - свободному времени
    answer: свободного времени
  - stem: В этом магазине ___ свежую рыбу.
    options:
    - продаёт
    - продают
    - продаётся
    - продаются
    answer: продают
  - stem: Не надо ___ ему, он сам позвонит.
    options:
    - позвонить
    - позвонишь
    - звонишь
    - звонить
    answer: звонить
  - stem: Я бы на твоём месте ___ с ним.
    options:
    - поговорю
    - поговорить
    - поговорил
    - поговори
    answer: поговорил
  - stem: Изучение ___ — интересная, но трудная работа.
    options:
    - иностранных языков
    - иностранные языки
    - иностранными языками
    - иностранным языкам
    answer: иностранных языков
  - stem: В этом кафе очень ___ кофе.
    options:
    - вкусная
    - вкусное
    - вкусные
    - вкусный
    answer: вкусный
  - stem: Вчера я познакомился с Анной ___.
    options:
    - Иванова
    - Ивановой
    - Иванову
    - Ивановым
    answer: Ивановой
  - stem: МГУ ___ в 1755 году.
    options:
    - была основана
    - было основано
    - был основан
    - были основаны
    answer: был основан
- id: e2
  type: fill
  task: 用括号里的词构成派生词，或写出它的正确形式填空。
  points: 1
  why: 第 1 题：由形容词 [близкий]{.ru} 加 [-ость]{.ru} 构成抽象名词 [близость]{.ru}，阴性，[о]{.ru} 后用第六格 [близости]{.ru}（第 21 课）。第 2 题：由 [дети]{.ru} 加 [-ство]{.ru} 构成 [детство]{.ru}，中性，和 [своё]{.ru} 一致（第 21 课）。第 3 题：由 [окончить]{.ru} 构成动名词 [окончание]{.ru}，[после]{.ru} 后用第二格；原来的宾语 [университет]{.ru} 变成第二格（第 21 课）。第 4 题：[минута]{.ru} 的指小形式是 [минуточка]{.ru}，性不变，[подождать]{.ru} 后用第四格 [минуточку]{.ru}（第 22 课）。第 5 题：[переводить]{.ru} 的词干以 [д]{.ru} 结尾，加 [-чик]{.ru}：[переводчик]{.ru}；[работать]{.ru} 后用第五格 [переводчиком]{.ru}（第 24 课）。第 6 题：[-тель]{.ru} 名词的阴性形式加 [-ница]{.ru}：[писательница]{.ru}（第 24 课）。第 7 题：[солнце]{.ru} 加 [-н-]{.ru} 构成关系形容词，[ц]{.ru} 交替成 [ч]{.ru}：[солнечный]{.ru}（第 25 课）。第 8 题：前缀 [за-]{.ru} 表示动作开始，多用于声音、情感动词：[заплакала]{.ru}，主语 [девочка]{.ru} 是阴性（第 28 课）。第 9 题：信是被收到的，[получить]{.ru} 是完成体，构成被动形动词过去时 [полученный]{.ru}，和中性的 [письмо]{.ru} 一致：[полученное]{.ru}（第 4 课）。第 10 题：先出门、后想起来，用完成体副动词；[-йти]{.ru} 类动词由将来时词干加 [-я]{.ru}：[выйдя]{.ru}（第 12 课）。
  items:
  - stem: Все говорят о ___ этих двух языков.
    hint: близкий
    accept:
    - близости
  - stem: Бабушка часто вспоминает своё ___.
    hint: дети
    accept:
    - детство
  - stem: После ___ университета он уехал работать в Сибирь.
    hint: окончить
    accept:
    - окончания
  - stem: Подождите ___, пожалуйста!
    hint: минута
    accept:
    - минуточку
  - stem: Мой брат работает ___ в большой компании.
    hint: переводить
    accept:
    - переводчиком
  - stem: Его сестра — известная ___.
    hint: писатель
    accept:
    - писательница
  - stem: Был тёплый ___ день.
    hint: солнце
    accept:
    - солнечный
  - stem: Услышав эту новость, девочка вдруг ___.
    hint: плакать，表示开始
    accept:
    - заплакала
  - stem: Письмо, ___ вчера, лежит на столе.
    hint: получить
    accept:
    - полученное
  - stem: ___ из дома, я вспомнил, что забыл ключи.
    hint: выйти
    accept:
    - Выйдя
- id: e3
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1
  why: 第 1 空：[один из самых старых городов]{.ru} 里形动词说明的是复数第二格 [городов]{.ru}，用 [стоящих]{.ru}（第 7 课）。第 2 空：先上车、后到达，用完成体副动词 [сев]{.ru}；[садясь]{.ru} 表示同时，[севший]{.ru} 是形动词，[сидя]{.ru} 是 [сидеть]{.ru}“坐着”的副动词，意思不对（第 11、12 课）。第 3 空：主语是数量词组 [много старых церквей и домов]{.ru}，谓语用中性单数 [осталось]{.ru}（第 5、16 课）。第 4 空：教堂是被建的，[на деньги жителей]{.ru} 说明是谁出钱，用被动形动词过去时 [построенная]{.ru}，和第一格的 [церковь]{.ru} 一致；[построившая, строящая]{.ru} 是主动形动词（第 4 课）。第 5 空：形动词跟被说明的 [женщина]{.ru} 一致，用阴性第一格 [работающая]{.ru}；[уже двадцать лет]{.ru} 说明工作一直持续到现在，用现在时（第 1、7 课）。第 6 空：一边听、一边忘了时间，两个动作同时，用未完成体副动词 [слушая]{.ru}；[послушав]{.ru} 表示听完以后（第 11 课）。第 7 空：[не хотелось]{.ru} 是无人称句，主体用第三格 [нам]{.ru}（第 16 课）。第 8 空：[эту набережную]{.ru} 是第四格，句中没有主语，是不定人称句，动词用复数 [называют]{.ru}（第 17 课）。第 9 空：“从……来看”是 [судя по]{.ru} + 第三格 [количеству]{.ru}；[благодаря]{.ru} 表示原因，[кроме]{.ru} 和 [из-за]{.ru} 要求第二格（第 15 课）。第 10 空：[так и не]{.ru} 表示想做而终于没做成，用完成体过去时 [успели]{.ru}（第 18 课）。第 11 空：[Ольга Смирнова]{.ru} 是句子的主语，女姓用第一格 [Смирнова]{.ru}，不要和第二格、第五格的 [Смирновой]{.ru} 混淆（第 27 课）。第 12 空：前缀 [на-]{.ru} 表示“做出许多”，宾语用第二格 [пирогов]{.ru}；[пекла]{.ru} 后面要用第四格；[напекли]{.ru} 和单数主语 [Ольга]{.ru} 不一致，[напечёт]{.ru} 是将来时（第 28 课）。第 13 空：[долго]{.ru} 和 [с ней]{.ru} 说明是双方交谈，用 [разговаривали]{.ru}；[сказать, рассказать, произнести]{.ru} 不和 [с кем]{.ru} 连用（第 29 课）。第 14 空：[кафе]{.ru} 是不变格的中性名词，格从形容词上看：[в]{.ru} + 第六格 [уютном]{.ru}（第 23 课）。第 15 空：[за]{.ru} 表示“在……旁边”用第五格：[за столиком]{.ru}；[за столик]{.ru} 是第四格，表示方向，用在 [сесть]{.ru} 后面（第 22 课）。第 16 空：[не хватило]{.ru} 是无人称句，缺少的东西用第二格 [трёх дней]{.ru}，过去时用中性；动词不和 [дней]{.ru} 一致（第 16 课）。第 17 空：不真实的条件，两个分句都用 [бы]{.ru} + 过去时形式 [съездили]{.ru}（第 19 课）。第 18 空：关系形容词 [деревянный]{.ru} 和第四格的 [ложку]{.ru} 一致：[деревянную]{.ru}（第 25 课）。第 19 空：对读者提出具体的一次性建议，用完成体命令式 [попробуйте]{.ru}；[пробовали, попробовали]{.ru} 是过去时，[попробуете]{.ru} 是将来时（第 19 课）。第 20 空：[стоит увидеть]{.ru} 的宾语是 [который]{.ru}，非动物名词第四格同第一格：[который]{.ru}（第 6 课）。
  items:
  - options:
    - стоящий
    - стоящем
    - стоящих
    - стоящими
    answer: стоящих
  - options:
    - Садясь
    - Сев
    - Севший
    - Сидя
    answer: Сев
  - options:
