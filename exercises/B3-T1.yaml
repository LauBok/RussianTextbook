- id: e8
  type: open
  task: 写作。
  points: 30
  items:
  - prompt: 以“[Путешествие — это лучший способ узнать страну.]{.ru}”为主题句写一段话，200 词左右。第一句用这个主题句，后面用两三个理由和具体的例子说明它，最后一句总结。至少用两个形动词短语、两个副动词短语和一个无人称句。
    length: 180–220
    model: |
      Путешествие — это лучший способ узнать страну. Конечно, о любой стране можно прочитать в книгах или посмотреть фильм, но по-настоящему понимаешь страну только тогда, когда видишь всё своими глазами. Во время путешествия узнаёшь то, о чём не пишут в учебниках. Приехав в новый город, сначала замечаешь только известные места: соборы, музеи, памятники. Но, гуляя по улицам, начинаешь видеть другое: как живут люди, что они едят, о чём разговаривают. Мне, например, больше всего понравился не Кремль, а маленький рынок в Суздале, где пожилая женщина, продававшая мёд, полчаса рассказывала мне о своём городе. Кроме того, путешествие учит понимать людей. Человек, никогда не выезжавший из своего города, часто думает, что везде живут так же, как у него дома. А человек, который много ездил, знает, что на одни и те же вещи можно смотреть по-разному. Наконец, в путешествии быстрее учишь язык: когда тебе нужно купить билет или спросить дорогу, приходится говорить, даже если боишься сделать ошибку. Поэтому, по-моему, ни одна книга не заменит поездку. Чтобы узнать страну, нужно в ней побывать.
    rubric:
    - 内容 10 分：第一句用给定的主题句（1 分）；有两三个清楚的理由（每个 2 分，最多 6 分）；有具体的例子（2 分）；最后一句总结（1 分）
    - 语法 10 分：要求的五项（两个形动词短语、两个副动词短语、一个无人称句）各 1 分；其余 5 分看全文语法错误：形动词、副动词的构成和一致，名词、形容词变格，动词变位和体，支配关系，每两处错误扣 1 分
    - 词汇 5 分：用词准确、有变化，能用上本册学过的词给 5 分；用词单调或有三处以上用词不当的，酌情扣 1–3 分
    - 结构 5 分：主题句、论据、结论层次清楚（3 分），用 [кроме того, наконец, например, поэтому]{.ru} 等词衔接、句子之间过渡自然（2 分）
    - 字数少于 150 词的，内容分最多给 6 分
    notes: 范文约 200 词，一段写成：主题句——让步（书和电影也能了解一个国家）——三个理由（看到书本上没有的东西、学会理解别人、学语言更快），每个理由后面都有说明或例子——结论。语法上：[женщина, продававшая мёд]{.ru}、[Человек, никогда не выезжавший из своего города]{.ru} 是形动词短语（第 2、6 课）；[Приехав в новый город]{.ru}、[гуляя по улицам]{.ru} 是副动词短语，主语都是泛指的“你”（第 11、12、17 课）；[приходится говорить]{.ru}、[нужно в ней побывать]{.ru} 是无人称句（第 16 课）；[видишь, узнаёшь, замечаешь]{.ru} 是泛指人称句（第 17 课）。论证段落可以先列出提纲：主题句、两三个理由、每个理由一个例子、结论，再把它们用连接词串起来。
