    ::: {.prose lang="ru"}
    **Нужно ли сегодня учить иностранные языки?**

    Сегодня многие говорят, что учить иностранные языки больше не нужно. Зачем годами учить грамматику, если компьютер может перевести любой текст за несколько секунд? Действительно, компьютерные программы для перевода с каждым годом работают всё лучше. Но, по-моему, язык учить всё-таки стоит, и вот почему.

    Первая причина — общение. Компьютер поможет купить билет или спросить дорогу, но настоящего разговора с его помощью не получится. Общаясь с человеком через переводчика, трудно понять его шутки, почувствовать его настроение.

    Вторая причина — культура. Язык — это не только слова и правила. Изучая язык, человек узнаёт, как думает другой народ, что он любит, над чем смеётся. Книги, прочитанные в оригинале, открывают то, чего нет ни в одном переводе.

    Наконец, изучать языки полезно для самого человека. Специалисты считают, что люди, говорящие на двух или трёх языках, лучше запоминают информацию и дольше сохраняют ясную голову в пожилом возрасте.

    Конечно, такие программы полезны, и пользоваться ими можно и нужно. Но заменить живого человека, знающего язык, они не могут. Поэтому учить языки стоит и сегодня.
    :::
  why: 第 1 题：第一段 [Зачем годами учить грамматику, если компьютер может перевести любой текст за несколько секунд?]{.ru} 是反对学外语的人的理由。第 2 题：作者的观点在第一段末尾：[по-моему, язык учить всё-таки стоит]{.ru}，结尾又重复了一次。第 3 题：[Общаясь с человеком через переводчика, трудно понять его шутки]{.ru}；买票、问路用电脑就能办到。第 4 题：[Книги, прочитанные в оригинале, открывают то, чего нет ни в одном переводе]{.ru}。第 5 题：第四段 [люди, говорящие на двух или трёх языках, лучше запоминают информацию]{.ru}；作者并不反对用翻译软件，也说语言不只是词和规则。
  items:
  - stem: Некоторые люди считают, что учить языки не нужно, потому что ___.
    options:
    - грамматика слишком трудная
    - компьютер может быстро перевести любой текст
    - все иностранцы говорят по-английски
    - книги сейчас никто не читает
    answer: компьютер может быстро перевести любой текст
  - stem: Главная мысль текста — ___.
    options:
    - учить языки больше не нужно
    - программы для перевода работают плохо
    - язык учить всё-таки стоит
    - учить нужно только английский язык
    answer: язык учить всё-таки стоит
  - stem: Через переводчика трудно ___.
    options:
    - купить билет
    - спросить дорогу
    - найти нужную книгу
    - понять шутки собеседника
    answer: понять шутки собеседника
  - stem: Книги, прочитанные в оригинале, ___.
    options:
    - открывают то, чего нет в переводе
    - читать легче, чем переводы
    - есть в каждой библиотеке
    - помогают быстро выучить грамматику
    answer: открывают то, чего нет в переводе
  - stem: Какая мысль есть в тексте?
    options:
    - Программами для перевода не нужно пользоваться.
    - Язык — это только слова и правила.
    - Люди, знающие несколько языков, лучше запоминают информацию.
    - Компьютер никогда не сможет перевести текст.
    answer: Люди, знающие несколько языков, лучше запоминают информацию.
  passage_zh: |
    **今天还需要学外语吗？**

    如今很多人说，外语已经不必学了。电脑几秒钟就能翻译任何文章，何必一年又一年地啃语法呢？的确，电脑翻译软件一年比一年好用。可是我认为，语言还是值得学的，理由如下。

    第一是交流。电脑能帮你买票、问路，可是用它没法真正地交谈。通过翻译和人交流，很难听懂对方的笑话，体会到他的情绪。

    第二是文化。语言不只是词汇和规则。人学一种语言，就会了解另一个民族怎样思考，喜欢什么，笑什么。读原文的书，能读出任何译本里都没有的东西。

    最后，学外语对人本身有好处。专家认为，会说两三种语言的人记忆力更好，上了年纪以后头脑也能更长久地保持清醒。

    当然，翻译软件是有用的，可以用，也应该用。可是它代替不了懂这门语言的活人。所以，今天仍然值得学外语。
- id: e5
  type: rewrite
  task: 按括号里的要求改写句子。
  points: 1
  why: 第 1 题：[который]{.ru} 是第一格、动词是现在时，换成主动形动词现在时 [изучающие]{.ru}，和 [студенты]{.ru} 一致（第 1、6 课）。第 2 题：[который]{.ru} 是第四格，换成被动形动词，从句的主语 [мой друг]{.ru} 变成第五格 [моим другом]{.ru}；[написать]{.ru} 是完成体，用过去时 [написанная]{.ru}，和阴性的 [книга]{.ru} 一致（第 4、6 课）。第 3 题：主动形动词过去时换成 [который]{.ru} 从句，[который]{.ru} 作主语用第一格，动词保持完成体过去时 [вернулся]{.ru}（第 6 课）。第 4 题：同一个主语、同时进行的动作，用未完成体副动词 [гуляя]{.ru}（第 11、13 课）。第 5 题：[после того как]{.ru} 表示先完成的动作，换成完成体副动词 [сдав]{.ru}（第 12、13 课）。第 6 题：[не зная]{.ru} 表示原因，换成 [так как]{.ru} 从句，补出主语 [мы]{.ru}，体和副动词一致；否定的宾语可以用第二格 [дороги]{.ru} 或第四格 [дорогу]{.ru}（第 14 课）。第 7 题：不定人称句换成被动结构，宾语变成主语，完成体用短尾被动形动词 [был открыт]{.ru}（第 9 课）。第 8 题：被动结构换成不定人称句，主语变成第四格宾语，动词用复数过去时 [построили]{.ru}（第 17 课）。第 9 题：命令式换成 [вы бы]{.ru} + 过去时形式，语气更婉转：[Вы бы взяли зонт]{.ru}（第 19 课）。第 10 题：完成体副动词换成 [когда]{.ru} 从句，体不变；名词主语移进从句，主句改用代词 [он]{.ru}（第 13 课）。
  example:
    cue: Девушка, которая сидит у окна, — моя сестра.（改用形动词短语）
    answer: Девушка, сидящая у окна, — моя сестра.
  items:
  - cue: Студенты, которые изучают русский язык, часто приезжают в Москву.（改用形动词短语）
    accept:
    - Студенты, изучающие русский язык, часто приезжают в Москву.
    - Изучающие русский язык студенты часто приезжают в Москву.
  - cue: Книга, которую написал мой друг, вышла в прошлом году.（改用形动词短语）
    accept:
