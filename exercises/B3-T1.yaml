  passage: |
    ::: {.prose lang="ru"}
    Чай пришёл в Россию из Китая в семнадцатом веке. Сначала его пили только некоторые люди, считавшие чай лекарством. Со временем чай стали пить все. Собираясь вечером за столом, русская семья пьёт чай с вареньем, пирогами или конфетами. Гостей, пришедших в дом, обязательно зовут к столу: «Садитесь пить чай!» Говорят, что без чая в России не бывает ни одного серьёзного разговора.
    :::
  items:
  - prompt: 译文要准确、通顺，形动词短语和副动词短语按汉语的习惯处理，不必照搬俄语的语序。
    length: 120–160
    lines: 6
    model: 茶是十七世纪从中国传到俄罗斯的。起初只有少数人喝茶，他们把茶当作药。后来人人都喝起茶来。晚上一家人围坐在桌旁，就着果酱、馅饼或糖果喝茶。家里来了客人，一定要请到桌边：“请坐，喝茶吧！”据说在俄罗斯，任何一次正经的谈话都离不开茶。
    rubric:
    - 意思准确 6 分：六句话各 1 分，漏译、错译一处扣 1 分
    - 形动词、副动词短语译得自然 2 分：[некоторые люди, считавшие чай лекарством]{.ru}、[гостей, пришедших в дом]{.ru} 拆成短句或译成“……的人”都可以，[собираясь вечером за столом]{.ru} 译成时间状语；生硬照搬俄语语序的扣 1 分
    - 汉语通顺 2 分：用词恰当、没有病句给 2 分；有明显翻译腔的扣 1 分
    notes: 第三句 [Со временем чай стали пить все]{.ru} 的主语是放在句末的 [все]{.ru}，[чай]{.ru} 是放在句首的宾语，[стали пить]{.ru} 表示开始做某事。第五句是不定人称句 [зовут]{.ru}，汉语不必补出主语。最后一句 [ни одного]{.ru} 加强否定，“没有一次……不……”可以译成“任何一次……都离不开”。
