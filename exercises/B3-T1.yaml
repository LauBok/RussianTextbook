    Через месяц Андрей получил первую зарплату. Держа в руках конверт с деньгами, он долго думал, что купить. Ещё весной он мечтал о новом телефоне, но теперь, зная, сколько нужно работать ради таких денег, он посмотрел на этот телефон иначе.

