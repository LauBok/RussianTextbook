    **Письмо из Москвы**

    Дорогой Ван Лэй!

    Спасибо за письмо! Очень рад, что ты снова приезжаешь в Россию и хочешь посмотреть Байкал. Ты спрашиваешь, когда лучше ехать и что взять с собой. Вот мои ответы.

    Я бы на твоём месте поехал в конце августа. В июле на Байкале очень много туристов, а в сентябре там уже бывает холодно. Вода в августе, конечно, холодная — даже летом она редко бывает теплее пятнадцати градусов, — зато погода обычно хорошая.

    Лететь из Москвы до Иркутска около шести часов. Можно поехать и на поезде, но тогда в дороге будешь почти четыре дня. Если у тебя мало времени, лучше лети на самолёте.

    Обязательно возьми тёплую куртку: даже в августе ночью бывает холодно. Не забудь крем от солнца — на Байкале очень яркое солнце. А вот много вещей брать не надо: всё нужное можно купить в Иркутске.

    И не пытайся увидеть всё за одну неделю: Байкал очень большой. Я бы посоветовал поехать на один из островов и остаться там на несколько дней.

    Если хочешь, я мог бы поехать с тобой: в августе я свободен. Напиши, что ты думаешь.

