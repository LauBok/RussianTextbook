  passage: |
    ::: {.prose lang="ru"}
    **Три дня в Ярославле**

    Прошлым летом мы с другом решили поехать на три дня в Ярославль — один из самых старых городов, (1) []{.blank} на Волге. (2) []{.blank} на поезд рано утром, к обеду мы уже гуляли по центру.

    Ярославлю больше тысячи лет, и в центре до сих пор (3) []{.blank} много старых церквей и домов. Особенно нам понравилась одна церковь семнадцатого века, (4) []{.blank} на деньги простых людей. Её стены внутри покрыты яркими картинами. Пожилая женщина, (5) []{.blank} в этой церкви уже двадцать лет, рассказывала о каждой картине так интересно, что, (6) []{.blank} её, мы совсем забыли о времени.

    Вечером мы гуляли по набережной. (7) []{.blank} не хотелось уходить: внизу медленно текла Волга, по ней шли теплоходы. Эту набережную (8) []{.blank} самой красивой на Волге. (9) []{.blank} количеству людей, которые гуляли там до поздней ночи, так думают многие. Мы хотели покататься на теплоходе, но так и не (10) []{.blank}: билетов уже не было.

    Жили мы в маленькой гостинице. Там работала Ольга (11) []{.blank} — она каждое утро встречала нас горячим чаем, а в последний день (12) []{.blank} нам пирогов. За завтраком мы долго (13) []{.blank} с ней о городе, и она советовала, что ещё посмотреть. Ужинали мы обычно в (14) []{.blank} кафе на набережной, где за (15) []{.blank} у окна можно было сидеть весь вечер.

    Трёх дней нам, конечно, (16) []{.blank}. Если бы у нас было больше времени, мы бы обязательно (17) []{.blank} в Кострому — это совсем недалеко. Перед отъездом друг купил маме (18) []{.blank} ложку — такие делают в этих местах уже несколько веков.

