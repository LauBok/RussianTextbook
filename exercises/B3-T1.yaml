  passage_zh: |
    **俄语里的新词是怎样产生的**

    语言是活的，一直随着社会的变化而变化。俄语里每年都会出现很多新词。它们是从哪里来的呢？

    新词最常见的来源是语言里已有的词。为此要用到后缀。例如，由动词“读”构成了“读者”，由形容词“新的”构成了名词“新闻”。知道了后缀的意思，不用查词典，也能明白一个生词的意思。

    第二条途径是借用，也就是从别的语言来的词。十八世纪有很多词从荷兰语进入俄语，十九世纪则来自法语。今天借词最多的来自英语：“电脑”“互联网”“足球”。很多这样的词时间一长，就开始按俄语的规则生活：由“电脑”这个词构成了形容词“电脑的”。

    第三条途径是把长名称缩短。“高校”（高等学校）和“莫斯科大学”这样的词就是这么来的。这样的词很方便，因为短。

    并不是所有新词都能在语言里长久留下来。有些词曾经风行一时，十年以后就没人记得了。留下来的是人们真正需要的词。
