    - Он думал о будущем, гуляя по парку.
  - cue: После того как Миша сдал экзамены, он уехал домой.（改用副动词短语）
    accept:
    - Сдав экзамены, Миша уехал домой.
    - Миша, сдав экзамены, уехал домой.
    - Миша уехал домой, сдав экзамены.
  - cue: Не зная дороги, мы долго искали музей.（改用 [так как]{.ru} 从句）
    accept:
    - Так как мы не знали дороги, мы долго искали музей.
    - Так как мы не знали дорогу, мы долго искали музей.
    - Мы долго искали музей, так как не знали дороги.
    - Мы долго искали музей, так как не знали дорогу.
  - cue: Этот музей открыли в 1912 году.（改为短尾被动形动词的被动结构）
    accept:
