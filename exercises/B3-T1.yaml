    ::: {.prose lang="ru"}
    **Как в русском языке появляются новые слова**

    Язык живёт и всё время меняется вместе с обществом. Каждый год в русском языке появляется много новых слов. Откуда они берутся?

    Чаще всего новые слова образуются из тех, которые уже есть в языке. Для этого используются суффиксы. Например, от глагола «читать» образовано слово «читатель», а от прилагательного «новый» — существительное «новость». Зная значение суффикса, можно понять смысл незнакомого слова, даже не открывая словарь.

    Второй путь — заимствование, то есть слова, пришедшие из других языков. В восемнадцатом веке много слов пришло в русский язык из голландского языка, в девятнадцатом — из французского. Сегодня больше всего заимствований приходит из английского: «компьютер», «интернет», «футбол». Многие такие слова со временем начинают жить по правилам русского языка: от слова «компьютер» образовано прилагательное «компьютерный».

    Третий путь — сокращение длинных названий. Так появились слова «вуз» (высшее учебное заведение) и «МГУ». Такие слова удобны, потому что они короче.

    Не все новые слова остаются в языке надолго. Некоторые слова, бывшие очень популярными, через десять лет уже никто не помнит. Остаются те, которые действительно нужны людям.
    :::
  why: 第 1 题：第一句 [Язык живёт и всё время меняется вместе с обществом]{.ru}。第 2 题：[Чаще всего новые слова образуются из тех, которые уже есть в языке]{.ru}；外来词和缩略词是第二、第三条途径。第 3 题：[Зная значение суффикса, можно понять смысл незнакомого слова]{.ru}。第 4 题：[в девятнадцатом — из французского]{.ru}；十八世纪是荷兰语，今天是英语。第 5 题：[Так появились слова «вуз»…]{.ru} 指的是第三条途径——长名称的缩略。
