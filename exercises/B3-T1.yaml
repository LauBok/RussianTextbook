  passage_zh: |
    **雅罗斯拉夫尔三日**

    去年夏天，我和朋友决定去雅罗斯拉夫尔玩三天。这是伏尔加河边最古老的城市之一。我们一大早坐上火车，到午饭时已经在市中心散步了。

    雅罗斯拉夫尔有一千多年的历史，市中心至今还保留着很多古老的教堂和房子。我们特别喜欢一座十七世纪的教堂，它是用普通老百姓的钱建起来的。教堂里面的墙上画满了色彩鲜艳的画。一位在这座教堂工作了二十年的老太太讲解每一幅画，讲得那么有趣，我们听着听着，完全忘了时间。

    晚上我们在河岸街上散步。我们都不想走：下面伏尔加河缓缓流淌，河上驶过一艘艘游船。人们说这条河岸街是伏尔加河上最美的。从深夜还在那里散步的人数来看，很多人都这样认为。我们想坐游船，可是终于没有赶上：船票已经卖完了。

    我们住在一家小旅馆里。在那里工作的奥尔加·斯米尔诺娃每天早上用热茶招待我们，最后一天还给我们烤了一大堆馅饼。吃早饭时我们和她聊了很久这座城市，她还建议我们再去看些什么。晚饭我们一般在河岸街上一家舒适的咖啡馆里吃，在那里可以靠窗坐在小桌旁待上一整个晚上。

    三天当然不够。要是时间再多一点，我们一定会去一趟科斯特罗马——那里离得很近。临走前，朋友给妈妈买了一把木勺——这一带做这种勺子已经有好几百年了。

    如果你们去雅罗斯拉夫尔，一定要尝尝当地的馅饼。这是一座每个人都值得去看看的城市。
