    **第一份工资**

    安德烈满十六岁的时候，决定夏天去打工。父母不反对。“自己干活挣来的钱是最珍贵的。”父亲常这样说。

    安德烈在离家不远的一家小咖啡馆找到了工作。他洗碗、收拾桌子，有时在厨房帮忙。活儿比他想的难得多：每天很晚回家，一到家就倒头睡下。周末尤其累，那时咖啡馆里来的人特别多。

    一个月后，安德烈领到了第一份工资。他手里拿着装钱的信封，想了很久该买什么。还在春天的时候他就梦想有一部新手机，可是现在他知道了挣这样一笔钱要干多少活，对那部手机就有了不同的看法。

    星期六安德烈去了商店。回到家，他把全家人叫到厨房，往桌上放了一个大蛋糕。他送给妈妈一束花，送给妹妹一本她早就想要的书。剩下的钱他存进了银行：“留着上学用吧。”

    父亲一直默默地看着儿子，这时笑了：“现在你明白我的意思了。”

    晚上，安德烈躺在床上想，这一个月他长大了。至于手机，他一年以后才买。
