    **莫斯科来信**

    亲爱的王磊：

    谢谢你的来信！真高兴你又要来俄罗斯，还想去看看贝加尔湖。你问什么时候去最好、要带些什么。下面是我的回答。

    要是我是你，我就八月底去。七月贝加尔湖游客特别多，九月那里就已经常常很冷了。八月的湖水当然还是凉的——就连夏天水温也很少超过十五度——不过天气一般很好。

    从莫斯科飞到伊尔库茨克大约六个小时。也可以坐火车去，不过那样路上就得花将近四天。如果你时间不多，最好坐飞机。

    一定要带上暖和的外套：就算在八月，夜里也常常很冷。别忘了带防晒霜——贝加尔湖的太阳特别强。东西倒是不用带很多：需要的东西在伊尔库茨克都能买到。

    还有，别想着一个星期把什么都看完：贝加尔湖太大了。我建议你去一个岛上住几天。

    你要是愿意，我可以和你一起去：八月我有空。来信说说你的想法吧。

    你的朋友迪马
