lesson: B3-L42
grammar: "公文语体：格式固定，不带感情色彩，多用名词结构。申请书抬头收件人用第三格、申请人用 [от]{.ru} + 第二格；正文 [Прошу]{.ru} + 完成体不定式；原因用 [в связи с]{.ru} + 第五格。简历省去 [я]{.ru}，用简短的名词短语和动词过去时。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Из каких разделов состоит резюме? В каком порядке перечисляют места работы? Чем язык резюме отличается от языка письма другу? Что советуют специалисты кандидату перед собеседованием? Что пишут в правом верхнем углу заявления? Что такое испытательный срок?]{.ru}"
        length: 80–110
        model: "В резюме указывают фамилию, имя, отчество, номер телефона и адрес электронной почты, должность, на которую претендует кандидат, опыт работы, образование и навыки. Места работы перечисляют в обратном порядке: сначала последнее, потом более ранние. В резюме почти не употребляется слово «я», вместо длинных рассказов пишут короткие фразы, а разговорные слова и эмоции неуместны. Специалисты советуют заранее узнать о компании как можно больше и подготовить свои вопросы. В правом верхнем углу заявления пишут, кому написано заявление и от кого. Испытательный срок — это время, за которое работодатель проверяет, подходит ли ему новый сотрудник; по закону он не больше трёх месяцев."
        rubric: ["六个问题都回答，内容与课文一致", "[претендовать на что]{.ru}、[отличаться от]{.ru} 支配正确", "用完整的句子"]
        notes: 第 1 题可以按简历的顺序列举各栏。第 3 题至少答出两点：不用 [я]{.ru}、用短句、不用口语词和情绪。

  - id: e2
    type: fill
    task: 补全申请书，用括号里的词的适当形式填空。
    why: "第 1 题收件人用第三格：[генеральный директор → генеральному директору]{.ru}。第 2 题姓也要变格：男性姓 [Смирнов]{.ru} 第三格 [Смирнову]{.ru}。第 3 题申请人用 [от]{.ru} + 第二格，阴性姓 [Петрова]{.ru} 按形容词变成 [Петровой]{.ru}，名和父称也变第二格：[Анны Павловны]{.ru}。第 4 题 [на должность]{.ru} 后面职位名称用第二格：[переводчика]{.ru}。第 5 题 [в связи с]{.ru} 要求第五格：[переездом]{.ru}，不要写成第二格或第四格。"
    items:
      - stem: "___ компании «Радуга» Смирнову А. В."
        hint: генеральный директор
        accept: ["Генеральному директору"]
      - stem: "Генеральному директору компании «Радуга» ___ А. В."
        hint: Смирнов
        accept: ["Смирнову"]
      - stem: от ___
        hint: Петрова Анна Павловна
        accept: ["Петровой Анны Павловны"]
      - stem: Прошу принять меня на работу на должность ___ с 1 октября 2025 года.
        hint: переводчик
        accept: ["переводчика"]
      - stem: Прошу предоставить мне отпуск с 3 по 10 марта в связи с ___.
        hint: переезд
        accept: ["переездом"]

  - id: e3
    type: choice
    task: 选择适合公文语体的说法。
    why: "第 1 题申请书只用 [Прошу]{.ru} + 不定式，[Пожалуйста, дайте]{.ru} 是口语的请求，[Я очень хочу]{.ru} 带个人感情。第 2 题请求的是一次具体的行为，用完成体 [перевести]{.ru}；[переводить]{.ru} 会理解成反复的动作。第 3 题公文说明原因用 [в связи с]{.ru} + 第五格；[потому что я болею]{.ru} 是口语，[из-за болезни]{.ru} 带有“因为不好的事”的口气，申请书里不用。第 4 题简历里省去 [я]{.ru}，用短句；另外两个是讲给人听的口语。"
    items:
      - stem: "___ предоставить мне отпуск с 1 по 14 июля."
        options: ["Пожалуйста, дайте", "Прошу", "Я очень хочу"]
        answer: Прошу
      - stem: Прошу ___ меня в отдел рекламы.
        options: [переводить, перевести, переводил]
        answer: перевести
      - stem: Прошу перенести собеседование на 5 мая ___.
        options: ["в связи с болезнью", "потому что я болею", "из-за болезни"]
        answer: в связи с болезнью
      - stem: "Опыт работы: 2021–2024, компания «Радуга», менеджер. ___"
        options: ["Отвечал за работу с клиентами.", "Я там работал с клиентами, и мне это очень нравилось.", "Ну, в общем, работал с клиентами."]
        answer: Отвечал за работу с клиентами.

  - id: e4
    type: rewrite
    task: 把口头请求改写成申请书的正文句子。
    example:
      cue: Я хочу работать у вас переводчиком с первого сентября.
      answer: Прошу принять меня на работу на должность переводчика с 1 сентября.
    why: "改写的要点：开头一律用 [Прошу]{.ru} + 完成体不定式；[потому что]{.ru} 从句改成 [в связи с]{.ru} + 动名词第五格；去掉 [очень]{.ru}、[пожалуйста]{.ru} 和语气词。第 1 题 [потому что я переезжаю]{.ru} → [в связи с переездом]{.ru}。第 2 题已经在公司工作、想去广告部，是调动，用 [перевести]{.ru}，[в отдел]{.ru} 是第四格。第 3 题“辞职”的公文说法是固定的：[уволить по собственному желанию]{.ru}。"
    items:
      - cue: Мне нужен отпуск с 1 по 14 июля, потому что я переезжаю.
        accept: ["Прошу предоставить мне отпуск с 1 по 14 июля в связи с переездом.", "В связи с переездом прошу предоставить мне отпуск с 1 по 14 июля."]
      - cue: Я уже работаю в вашей компании, но очень хочу работать в отделе рекламы.
        accept: ["Прошу перевести меня в отдел рекламы.", "Прошу перевести меня на работу в отдел рекламы."]
      - cue: Я больше не хочу у вас работать.
        accept: ["Прошу уволить меня по собственному желанию."]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 简历应当简短、准确。
        accept: ["Резюме должно быть коротким и точным."]
        rubric: ["[резюме]{.ru} 是中性不变格名词，[должно]{.ru}、[коротким]{.ru} 用中性", "[быть]{.ru} 后面的表语用第五格"]
      - zh: 应聘者申请经理职位。
        accept: ["Кандидат претендует на должность менеджера.", "Соискатель претендует на должность менеджера."]
        rubric: ["[претендовать на что]{.ru}：[на]{.ru} + 第四格", "[должность менеджера]{.ru}：职位名称用第二格"]
      - zh: 面试时应当沉着地回答问题。
        accept: ["Во время собеседования следует спокойно отвечать на вопросы.", "На собеседовании следует спокойно отвечать на вопросы.", "Во время собеседования отвечать на вопросы следует спокойно.", "На собеседовании отвечать на вопросы следует спокойно.", "Во время собеседования нужно спокойно отвечать на вопросы.", "На собеседовании нужно спокойно отвечать на вопросы.", "Во время собеседования на вопросы следует отвечать спокойно.", "На собеседовании на вопросы следует отвечать спокойно."]
        rubric: ["[следует]{.ru} + 不定式（或 [нужно]{.ru} + 不定式）", "[отвечать на вопросы]{.ru}：[на]{.ru} + 第四格"]
      - zh: 因搬家，请准许我休假。
        accept: ["Прошу предоставить мне отпуск в связи с переездом.", "В связи с переездом прошу предоставить мне отпуск."]
        rubric: ["[Прошу]{.ru} + 完成体不定式 [предоставить]{.ru}", "[в связи с переездом]{.ru}：第五格"]

  - id: e6
    type: open
    task: 应用文：写一份录用申请书。
    items:
      - prompt: 你叫 [Ли Мин]{.ru}（女），想从 2026 年 2 月 1 日起在“彩虹”有限责任公司担任翻译（[переводчик]{.ru}），总经理是 [Смирнов Андрей Викторович]{.ru}。按课文的格式写出完整的申请书：抬头、标题、正文、日期和签名。
        length: 25–45
        model: "Генеральному директору компании «Радуга» Смирнову А. В. от Ли Мин. Заявление. Прошу принять меня на работу на должность переводчика с 1 февраля 2026 года. 20 января 2026 г. Ли Мин"
        rubric: ["抬头：收件人第三格（[директору]{.ru}、[Смирнову]{.ru}），申请人 [от]{.ru} + 第二格", "居中的标题 [Заявление]{.ru}", "正文 [Прошу принять меня на работу на должность переводчика с…]{.ru}", "有日期（早于入职日期）和签名", "没有问候语、感谢语和口语词"]
        notes: "范文约 30 词。中国人的姓名 [Ли Мин]{.ru} 以辅音结尾，但指女性时不变格，指男性时可以变：[от Ли Мина]{.ru}。申请书的日期要早于入职日期。最后一行左边写日期，右边亲笔签名，签名旁写姓名，不写 [Подпись:]{.ru} 这个词。实际书写时抬头分行写在右上角：[Генеральному директору / компании «Радуга» / Смирнову А. В. / от Ли Мин]{.ru}。"

  - id: e7
    type: open
    task: 应用文：用俄语写一份自己的简历（可以虚构）。
    items:
      - prompt: 按课文介绍的栏目写：姓名和联系方式、申请的职位、工作经历（倒序，每个单位写日期、单位、职位和一两项职责）、教育背景、技能（外语、电脑）。不用 [я]{.ru}，用简短的句子和名词短语。
        length: 70–110
        model: "Чжан Хао. Телефон: +7 900 123-45-67. Электронная почта: zhanghao@mail.ru. Должность: менеджер по туризму. Опыт работы: 2023–2025, компания «Радуга», Москва, менеджер по туризму. Отвечал за работу с клиентами из Китая. Готовил документы для поездок клиентов в Россию. Организовал две международные выставки. 2021–2023, компания «Восток», Пекин, переводчик. Переводил документы с русского языка на китайский. Работал переводчиком на выставках. Образование: 2017–2021, Пекинский университет, факультет русского языка. 2020, Московский государственный университет, курс русского языка. Навыки: китайский язык — родной, русский язык — свободно, английский язык — хорошо. Уверенно владею компьютерными программами."
        rubric: ["栏目齐全：姓名和联系方式、职位、工作经历、教育背景、技能", "工作经历按倒序，每个单位有日期、单位、职位、职责", "职责用不带 [я]{.ru} 的过去时短句或名词短语，体用得对", "没有口语词和情绪"]
        notes: "范文约 75 词。各栏标题用名词：[Опыт работы]{.ru}、[Образование]{.ru}、[Навыки]{.ru}。职责中已完成的成绩用完成体（[Организовал две выставки]{.ru}），经常性的工作用未完成体（[Отвечал за…]{.ru}、[Переводил документы]{.ru}）。语言水平的常用说法：[родной]{.ru}、[свободно]{.ru}、[хорошо]{.ru}。最后一句 [Уверенно владею…]{.ru} 是简历里少数可以出现第一人称动词的地方，也可以写成名词短语 [Уверенное владение компьютером]{.ru}。"

  - id: e8
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [на сайтах]{.ru}：[на]{.ru} + 第六格复数。第 2 题 [прикладывать что к чему]{.ru}：[к резюме]{.ru}，[резюме]{.ru} 不变格，填的是第四格 [сопроводительное письмо]{.ru}。第 3 题 [заключать договор с кем]{.ru}：[с сотрудником]{.ru}，第五格。第 4 题 [предусматривать]{.ru} 后面用第四格 [испытательный срок]{.ru}，阳性非动物名词第四格同第一格。"
    items:
      - stem: Работодатели публикуют объявления о вакансиях на специальных ___.
        hint: сайт
        accept: ["сайтах"]
      - stem: К резюме часто прикладывают ___.
        hint: сопроводительное письмо
        accept: ["сопроводительное письмо"]
      - stem: С новым ___ заключают трудовой договор.
        hint: сотрудник
        accept: ["сотрудником"]
      - stem: Договор часто предусматривает ___.
        hint: испытательный срок
        accept: ["испытательный срок"]
