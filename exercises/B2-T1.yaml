    **我奶奶的一家**

    我奶奶叫薇拉·彼得罗夫娜。她 1952 年出生在伏尔加河边的一个小村子里。家里有七个孩子：四个男孩，三个女孩。奶奶是最小的。家里总是缺钱，可是奶奶说，那是她一生中最幸福的岁月。

    村里没有学校，孩子们每天走着去邻村上学：去三公里，回来三公里。冬天雪大的时候，路就更长、更难走了。哥哥们总是和妹妹们一起走。

    奶奶十七岁去莫斯科上学。她当了医生，在医院工作了四十年。在莫斯科她认识了爷爷。他们有一儿一女：我爸爸和塔尼娅姑姑。

    奶奶现在七十五岁。她的兄弟姐妹住在不同的城市，可是每年夏天大家都回到他们出生的那个村子。去年大家都来了：兄弟姐妹们带着妻子、丈夫和孩子。我们在院子里围坐在一张长桌旁，奶奶讲她的父母。我弟弟问她为什么没有留在村子里。“我想当医生，”奶奶回答，“可我的心一直在这里。”对我来说，这一天是夏天里最重要的一天。
