  passage_zh: |
    **家书**

    亲爱的妈妈、爸爸：

    请原谅我好久没写信了：四月里我们的事情特别多。明天就要开始考试了。星期一我考历史考查，星期二考俄语笔试，星期五考文学口试。这门考试我很怕：克雷洛夫教授问得很多。所有必读的书我都已经读完了，有几本甚至读了两遍。

    每天晚上我和迪马一起复习考签：他问，我答。玛丽亚·尼古拉耶夫娜对我说：“别整夜坐着啃书本，要照顾好自己！”她说得对：昨天我差不多学了一整夜，早上连早饭都没吃。

    不过有时候我也休息。昨天由美请我去民间舞蹈班。起初我怎么也跳不好，甚至踩了由美的脚。可后来就好多了。考完试以后，我每个星期六都要去舞蹈班。今天我和安娜、米沙去了安德烈·鲁勃廖夫博物馆，我看到了非常古老的圣像。

    迪马请我五月节假日去他的家乡喀山。我们五月一日出发，在那里待差不多一个星期。迪马说喀山是伏尔加河边最美的城市。

    别为我担心，我一切都会好的。到了喀山，我给你们寄照片。

    你们的儿子　王磊
