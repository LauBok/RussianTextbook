lesson: B2-T1
heading: 期中测试
intro: 满分 150 分，建议用时 120 分钟。考查范围：第二册第 1–36 课。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：[не́сколько]{.ru} 后面能数的名词用复数第二格，[помидо́р]{.ru} 的复数第二格是 [помидо́ров]{.ru}（第 1、3 课）。第 2 题：数词最后一个词是 [два]{.ru}，名词用单数第二格 [расска́за]{.ru}；[два́дцать]{.ru} 不影响后面名词的形式（第 4 课）。第 3 题：年月日一起说时，日、月、年都用第二格，年份只有最后一个词用序数词并变格：[пе́рвого ма́рта две ты́сячи шесто́го го́да]{.ru}；只说年份时才用 [в]{.ru} + 第六格 [в две ты́сячи шесто́м году́]{.ru}，前面有日期就不能再用第六格，[шесто́го году́]{.ru} 是序数词和 [год]{.ru} 的格不一致（第 5 课）。第 4 题：后半小时用 [без]{.ru} + 第二格 [че́тверти]{.ru} + 下一个钟点的基数词：[без че́тверти семь]{.ru}；前面不加 [в]{.ru}，[в без че́тверти]{.ru} 是把 [в семь]{.ru} 套过来的常见错误；[без]{.ru} 要求第二格，不能说 [без че́тверть]{.ru}；前半小时说 [в че́тверть седьмо́го]{.ru}，后面要用序数词第二格，[в че́тверть семь]{.ru} 不成话（第 6 课）。第 5 题：[де́ти]{.ru} 和集合数词 [дво́е]{.ru} 连用；[два, две]{.ru} 后面要用单数第二格，[о́ба]{.ru} 后面也是单数第二格，都不能接 [дете́й]{.ru}（第 7 课）。第 6 题：[о]{.ru} + 复数第六格，[друг]{.ru} 的复数是不规则的 [друзья́]{.ru}，第六格 [о друзья́х]{.ru}（第 10、16 课）。第 7 题：[ви́деть]{.ru} 支配第四格，复数动物名词第四格同第二格，物主代词随之用 [на́ших]{.ru}（第 13、15 课）。第 8 题：[пять]{.ru} 以上的数词后面用 [челове́к]{.ru}，不能用 [люде́й]{.ru}；[челове́ка]{.ru} 只用在 [два, три, четы́ре]{.ru} 后面（第 17 课）。第 9 题：第三人称代词在前置词后面加 [н-]{.ru}：[о ней]{.ru}（第 19 课）。第 10 题：“随身带”是固定说法 [взять с собо́й]{.ru}，[с]{.ru} 要求第五格（第 20 课）。第 11 题：[по]{.ru} + 第三格，[весь]{.ru} 的阳性第三格是 [всему́]{.ru}，和 [го́роду]{.ru} 一致（第 22 课）。第 12 题：比较的两个词都是第一格时，比较对象常用第二格：[ста́рше Ми́ши]{.ru}；用 [чем]{.ru} 时后面是第一格 [ста́рше, чем Ми́ша]{.ru}，这里没有 [чем]{.ru}，不能用第一格；[Ми́шей, Ми́ше]{.ru} 是把比较对象误当成了别的支配关系（第 23 课）。第 13 题：对一个人用 [вы]{.ru} 称呼，短尾形容词用复数 [пра́вы]{.ru}；口语里有时也能听到对女士说 [вы права́]{.ru}，但规范的说法是复数（第 25 课）。第 14 题：比较级 + [всех]{.ru} 表示“比谁都……”，修饰动词要用副词比较级 [гро́мче]{.ru}（第 26 课）。第 15 题：问“看没看过”只关心有没有这回事，用未完成体过去时 [смотре́л]{.ru}；回答“早在北京就看过”也说明问的是经历。[посмотре́л]{.ru} 问的是一件正在做或说好要做的事“看完了没有”，用在等着结果的时候，这里不合适；[смо́тришь, посмо́тришь]{.ru} 和“在北京时”的过去时间不合（第 28 课）。第 16 题：[когда́]{.ru} 从句说将来的事也要用将来时，主句的动作在读完之后才发生，用完成体将来时 [прочита́ет]{.ru}；[чита́ет]{.ru} 是现在时，[чита́л]{.ru} 是过去时，[бу́дет чита́ть]{.ru} 只表示过程、不说明读完，都不对（第 29 课）。第 17 题：[ка́ждую неде́лю]{.ru} 表示经常、反复的要求，命令式用未完成体 [пиши́]{.ru}；[напиши́]{.ru} 是一次具体的要求；[пи́шешь, напи́шешь]{.ru} 是陈述式，不是命令式（第 30 课）。第 18 题：[успе́ть]{.ru} 说的是来不来得及做成，后面用完成体不定式 [сде́лать]{.ru}（第 31 课）。第 19 题：[-овать]{.ru} 动词现在时 [-ова-]{.ru} 变成 [-у-]{.ru}，[ты]{.ru} 的形式是 [рису́ешь]{.ru}；[рисова́ешь]{.ru} 是常见错误（第 32 课）。第 20 题：[сове́товать]{.ru} 支配第三格：[сове́тует А́нне]{.ru}；汉语“建议她”里的人像宾语，容易误用第四格 [А́нну]{.ru}（第 35 课）。
  items:
  - stem: На ры́нке Ми́ша купи́л не́сколько ___.
    options:
    - помидо́ра
    - помидо́ры
    - помидо́ров
    - помидо́р
    answer: помидо́ров
  - stem: В э́той кни́ге два́дцать два ___.
    options:
    - расска́за
    - расска́зов
    - расска́з
    - расска́зы
    answer: расска́за
  - stem: Ди́ма роди́лся пе́рвого ма́рта две ты́сячи ___.
    options:
    - шесто́м году́
    - шесто́го го́да
    - шесто́й год
    - шесто́го году́
    answer: шесто́го го́да
  - stem: Конце́рт начина́ется ___ семь.
    options:
    - в че́тверть
    - в без че́тверти
    - без че́тверть
    - без че́тверти
    answer: без че́тверти
  - stem: У Ива́на Серге́евича и Мари́и Никола́евны ___ дете́й.
    options:
    - два
    - о́ба
    - дво́е
    - две
    answer: дво́е
  - stem: Ди́ма ча́сто расска́зывает нам о свои́х ___.
    options:
    - друзья́х
    - друзе́й
    - друзья́м
    - друзья́ми
    answer: друзья́х
  - stem: В теа́тре мы ви́дели ___.
    options:
    - на́ши преподава́тели
    - на́шим преподава́телям
    - на́шими преподава́телями
    - на́ших преподава́телей
    answer: на́ших преподава́телей
  - stem: В авто́бусе бы́ло пятна́дцать ___.
    options:
    - люде́й
    - челове́ка
    - челове́к
    - лю́ди
    answer: челове́к
  - stem: Ван Лэй ча́сто ду́мает о ___.
    options:
    - её
    - ней
    - ей
    - она́
    answer: ней
  - stem: Не забу́дь взять с ___ па́спорт!
    options:
    - себя́
    - себе́
    - сам
    - собо́й
    answer: собо́й
  - stem: Мы ходи́ли по ___ го́роду до са́мого ве́чера.
    options:
    - всему́
    - весь
    - всем
    - всего́
    answer: всему́
  - stem: А́нна ста́рше ___.
    options:
    - Ми́ша
    - Ми́шей
    - Ми́ши
    - Ми́ше
    answer: Ми́ши
  - stem: Мари́я Никола́евна, вы ___.
    options:
    - права́
    - прав
    - пра́вая
    - пра́вы
    answer: пра́вы
  - stem: Ди́ма говори́т ___ всех.
    options:
    - гро́мче
    - гро́мкий
    - гро́мко
    - са́мый гро́мкий
    answer: гро́мче
  - stem: — Ты ___ э́тот фильм? — Да, ещё в Пеки́не.
    options:
    - посмотре́л
    - смотре́л
    - смо́тришь
    - посмо́тришь
    answer: смотре́л
  - stem: Когда́ Ди́ма ___ э́ту кни́гу, он даст её мне.
    options:
    - чита́ет
    - чита́л
    - прочита́ет
    - бу́дет чита́ть
    answer: прочита́ет
  - stem: ___ мне ка́ждую неде́лю!
    options:
    - Пиши́
    - Напиши́
    - Пи́шешь
    - Напи́шешь
    answer: Пиши́
  - stem: Ван Лэй не успе́л ___ упражне́ние.
    options:
    - де́лать
    - сде́лал
    - де́лает
    - сде́лать
    answer: сде́лать
  - stem: Ми́ша, что ты ___?
    options:
    - рисова́ешь
    - рису́ешь
    - рису́ю
    - рису́ет
    answer: рису́ешь
  - stem: О́льга Ви́кторовна сове́тует ___ бо́льше чита́ть.
    options:
    - А́нну
    - А́нны
    - А́нне
    - А́нной
    answer: А́нне
- id: e2
  type: fill
  task: 用括号里词的正确形式填空。
  points: 1
  why: 第 1 题：[мно́го]{.ru} + 能数名词的复数第二格，[-а]{.ru} 结尾的阴性名词是零词尾：[библиоте́к]{.ru}（第 2、3 课）。第 2 题：[во́семь]{.ru} 后面用复数第二格，[день]{.ru} 词干里的 [е]{.ru} 是隐现元音，复数第二格是 [дней]{.ru}（第 1、4 课）。第 3 题：[семь]{.ru} + 复数第二格；[пода́рок]{.ru} 的 [о]{.ru} 在变格时脱落：[пода́рков]{.ru}（第 1 课）。第 4 题：[пять]{.ru} + 复数第二格，[сестра́]{.ru} 零词尾时插入隐现元音并写 [ё]{.ru}：[сестёр]{.ru}（第 2、16 课）。第 5 题：度量词 [па́чка]{.ru} 后面不能数的名词用单数第二格：[ча́я]{.ru}，口语里也说 [ча́ю]{.ru}（第 8 课）。第 6 题：[всем свои́м]{.ru} 说明是复数第三格：[подру́гам]{.ru}（第 11、15 课）。第 7 题：[уви́деть]{.ru} 支配第四格，复数动物名词第四格同第二格，代词、形容词、名词都用第二格形式：[на́ших но́вых сосе́дей]{.ru}；[сосе́д]{.ru} 的复数是软变化 [сосе́ди — сосе́дей]{.ru}（第 13–16 课）。第 8 题：[горди́ться]{.ru} 支配第五格，复数第五格 [-ами]{.ru}，[свои́]{.ru} 变成 [свои́ми]{.ru}（第 12、15 课）。第 9 题：[подари́ть]{.ru} 送给谁用第三格，形容词复数第三格 [-ым]{.ru}：[пожилы́м]{.ru}（第 14 课）。第 10 题：第三人称代词在前置词后加 [н-]{.ru}：[к нему́]{.ru}（第 19 课）。第 11 题：[с]{.ru}“和……一起”要求第五格，[кто]{.ru} 的第五格是 [кем]{.ru}（第 21 课）。第 12 题：[дорого́й]{.ru} 的比较级是辅音交替的 [доро́же]{.ru}，不是 [доро́гее]{.ru}（第 23 课）。第 13 题：短尾形容词作谓语，和中性的 [всё]{.ru} 一致：[гото́во]{.ru}（第 25 课）。第 14 题：[встава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[встаю́]{.ru}（第 32 课）。第 15 题：第二变位动词只在 [я]{.ru} 的形式交替 [д → ж]{.ru}：[ви́жу]{.ru}（第 33 课）。
  items:
  - stem: В Москве́ мно́го ___.
    hint: библиоте́ка
    accept:
    - библиоте́к
  - stem: В феврале́ э́того го́да два́дцать во́семь ___.
    hint: день
    accept:
    - дней
  - stem: Ван Лэй купи́л в Пеки́не семь ___.
    hint: пода́рок
    accept:
    - пода́рков
  - stem: У де́душки бы́ло пять ___.
    hint: сестра́
    accept:
    - сестёр
  - stem: Купи́, пожа́луйста, па́чку ___ и литр молока́.
    hint: чай
    accept:
    - ча́я
    - ча́ю
  - stem: Ди́ма написа́л сообще́ния всем свои́м ___.
    hint: подру́га
    accept:
    - подру́гам
  - stem: В фойе́ мы уви́дели ___.
    hint: на́ши но́вые сосе́ди
    accept:
    - на́ших но́вых сосе́дей
  - stem: Ба́бушка о́чень горди́тся ___.
    hint: свои́ вну́ки
    accept:
    - свои́ми вну́ками
  - stem: На пра́здник мы подари́ли цветы́ ___ сосе́дям.
    hint: пожило́й
    accept:
    - пожилы́м
  - stem: В суббо́ту мы пойдём к ___ в го́сти.
    hint: он
    accept:
    - нему́
  - stem: С ___ ты ходи́л в теа́тр?
    hint: кто
    accept:
    - кем
  - stem: Э́тот слова́рь ___, чем тот.
    hint: дорого́й
    accept:
    - доро́же
  - stem: К обе́ду всё бы́ло ___.
    hint: гото́вый
    accept:
    - гото́во
  - stem: Тепе́рь я обы́чно ___ ра́но.
    hint: встава́ть
    accept:
    - встаю́
  - stem: Тепе́рь я ка́ждое у́тро ___ А́нну в метро́.
    hint: ви́деть
    accept:
    - ви́жу
- id: e3
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 2
  why: 第 1 空：[оди́ннадцать]{.ru} 和 [пять]{.ru} 以上的数词一样，后面的名词用复数第二格 [часо́в]{.ru}；[часа́]{.ru} 只用在 [два, три, четы́ре]{.ru} 后面，[час]{.ru} 用在 [оди́н]{.ru} 后面或单说“一点”（第 4 课）。第 2 空：后面有 [чем вчера́]{.ru}，前面有 [намно́го]{.ru}，要用比较级 [тепле́е]{.ru}；[намно́го]{.ru} 不能修饰原级（第 23、26 课）。第 3 空：那天一点钟见了一次面，是一次具体的、已经完成的动作，用完成体过去时；“互相见面”要用带 [-ся]{.ru} 的 [встре́титься]{.ru}，[встре́тить]{.ru} 后面要有宾语，[встреча́лись]{.ru} 指经常见面，[встре́тимся]{.ru} 是将来时（第 6、34 课）。第 4 空：[два]{.ru} 后面用单数第二格 [килогра́мма]{.ru}，度量词后面的 [я́блок]{.ru} 是复数第二格（第 4、8 课）。第 5 空：[деся́ток]{.ru} 是度量词，后面能数的名词用复数第二格，[яйцо́]{.ru} 的复数第二格是 [яи́ц]{.ru}（第 8 课）。第 6 空：[не хвати́ло]{.ru} + 第二格是无人称句，过去时用中性；[де́нег]{.ru} 不是主语，动词不能跟它变成复数（第 16、17 课）。第 7 空：说话人是女生（[я вста́ла, я позвони́ла]{.ru}），短尾形容词用阴性 [согла́сна]{.ru}；[согла́сен с]{.ru} + 第五格只用短尾（第 25 课）。第 8 空：[дово́лен]{.ru} 支配第五格，[мои́м]{.ru} 和 [су́пом]{.ru} 一致（第 25 课）。第 9 空：“拿起吉他、开始弹”是接连发生的一次动作，用完成体 [на́чал]{.ru}；[начина́л]{.ru} 表示经常开始或开始的过程，不合这里的情节。后面接不定式 [игра́ть]{.ru} 时用不带 [-ся]{.ru} 的 [начина́ть / нача́ть]{.ru}，[начина́ться]{.ru} 的主语是事情本身（[Конце́рт начина́ется]{.ru}），不能接人和不定式（第 28、31 课）。第 10 空：[са́мый]{.ru} 放在地点、时间名词前表示“正……，一直到……”，[в]{.ru} + 第六格，和 [конце́]{.ru} 一致：[в са́мом конце́]{.ru}（第 22 课）。
  items:
  - options:
    - час
    - часа́
    - часо́в
    - часы́
    answer: часо́в
  - options:
    - тёплый
    - тепло́
    - са́мый тёплый
    - тепле́е
    answer: тепле́е
  - options:
    - встре́тились
    - встреча́лись
    - встре́тили
    - встре́тимся
    answer: встре́тились
  - options:
    - килогра́ммов
    - килогра́мма
    - килогра́мм
    - килогра́ммы
    answer: килогра́мма
  - options:
    - яйцо́
    - я́йца
    - яи́ц
    - яйцо́м
    answer: яи́ц
  - options:
    - хвати́л
    - хвати́ла
    - хвати́ли
    - хвати́ло
    answer: хвати́ло
  - options:
    - согла́сна
    - согла́сен
    - согла́сная
    - согла́сны
    answer: согла́сна
  - options:
    - мой
    - моему́
    - мои́м
    - мое́й
    answer: мои́м
  - options:
    - начина́л
    - на́чал
    - начина́лся
    - начался́
    answer: на́чал
  - options:
    - са́мый
    - са́мого
    - са́мому
    - са́мом
    answer: са́мом
  passage: |
    ::: {.prose lang="ru"}
    **Моя́ суббо́та**

    В суббо́ту я вста́ла по́здно, в оди́ннадцать (1) []{.blank}. Обы́чно по суббо́там я занима́юсь в библиоте́ке, но в э́тот раз я реши́ла отдохну́ть. За окно́м бы́ло со́лнце, и на у́лице бы́ло намно́го (2) []{.blank}, чем вчера́. Я позвони́ла Пье́ру и Ван Лэ́ю, и в час мы (3) []{.blank} у метро́.

    Снача́ла мы пошли́ на ры́нок. Покупа́телей там бы́ло ма́ло, а овоще́й и фру́ктов — о́чень мно́го. Я купи́ла два (4) []{.blank} я́блок и па́чку са́хара, а Пьер — деся́ток (5) []{.blank}. Ван Лэй хоте́л купи́ть ещё мёд, но у него́ не (6) []{.blank} де́нег. «Ничего́, — сказа́л Пьер. — Вот тебе́ мои́ де́ньги».

    Пото́м мы до́лго гуля́ли в па́рке. На доро́жках бы́ло мно́го луж и гря́зи, но пти́цы уже́ пе́ли весе́нние пе́сни. Ван Лэй сказа́л, что весна́ — са́мое краси́вое вре́мя го́да. Я не (7) []{.blank} с ним: по-мо́ему, Москва́ са́мая краси́вая зимо́й, когда́ везде́ лежи́т бе́лый снег. Пото́м мы сфотографи́ровали друг дру́га у па́мятника Пу́шкину.

