    **Письмо́ домо́й**

    Дороги́е ма́ма и па́па!

    Прости́те, что до́лго не писа́л: в апре́ле у нас бы́ло о́чень мно́го рабо́ты. За́втра начина́ются экза́мены. В понеде́льник у меня́ зачёт по исто́рии, во вто́рник пи́сьменный экза́мен по ру́сскому языку́, а в пя́тницу — у́стный экза́мен по литерату́ре. Э́того экза́мена я о́чень бою́сь: профе́ссор Крыло́в спра́шивает о́чень мно́го. Все обяза́тельные кни́ги я уже́ прочита́л, а не́которые — да́же два ра́за.

    Ка́ждый ве́чер мы с Ди́мой повторя́ем биле́ты: он спра́шивает, а я отвеча́ю. Мари́я Никола́евна говори́т мне: «Не сиди́ всю ночь над уче́бниками. Береги́ себя́!» Она́ права́: вчера́ я занима́лся почти́ всю ночь и у́тром да́же не поза́втракал.

    Но иногда́ я и отдыха́ю. Вчера́ Ю́ми пригласи́ла меня́ в сту́дию наро́дного та́нца. Снача́ла у меня́ ничего́ не получа́лось: я да́же наступи́л Ю́ми на но́гу. Но пото́м ста́ло лу́чше. По́сле экза́менов бу́ду ходи́ть в сту́дию ка́ждую суббо́ту. А сего́дня мы с А́нной и Ми́шей е́здили в музе́й Андре́я Рублёва. Я ви́дел о́чень дре́вние ико́ны.

    На ма́йские пра́здники Ди́ма пригласи́л меня́ к себе́ в Каза́нь. Мы пое́дем туда́ пе́рвого ма́я и бу́дем там почти́ неде́лю. Ди́ма говори́т, что Каза́нь — са́мый краси́вый го́род на Во́лге.

    Не волну́йтесь за меня́, у меня́ всё бу́дет хорошо́. Когда́ бу́ду в Каза́ни, пошлю́ вам фотогра́фии.

    Ваш сын Ван Лэй
    :::
  why: 第 1 题，信里说 [За́втра начина́ются экза́мены. В понеде́льник у меня́ зачёт]{.ru}，可见写信那天是星期天，考试还没开始。第 2 题，[Э́того экза́мена я о́чень бою́сь]{.ru} 指前一句的文学口试（[боя́ться]{.ru} + 第二格，第 35 课）。第 3 题，[Не сиди́ всю ночь над уче́бниками]{.ru}：否定命令式用未完成体，劝他别整夜学习（第 30 课）。第 4 题，[Снача́ла у меня́ ничего́ не получа́лось]{.ru}；踩脚的是王磊，不是由美；去博物馆才是和安娜、米沙一起。第 5 题，[Мы пое́дем туда́ пе́рвого ма́я]{.ru}，[мы]{.ru} 指他和请他去的迪马。
