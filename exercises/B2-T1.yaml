    model: |
      Дорого́й друг!

      Прости́, что до́лго не писа́л: в э́том семе́стре у меня́ бы́ло о́чень мно́го рабо́ты. Ка́ждый день у нас три па́ры, а по суббо́там я ещё хожу́ в сту́дию наро́дного та́нца. Са́мый тру́дный предме́т для меня́ — литерату́ра: за семе́стр мы прочита́ли пять больши́х книг, а одну́ пье́су я чита́л два ра́за.

      В феврале́ я познако́мился с Ди́мой. Он из Каза́ни, мы с ним в одно́й гру́ппе и ча́сто занима́емся вме́сте. Ди́ма говори́т быстре́е всех, но тепе́рь я уже́ понима́ю его́. По выходны́м мы с ним иногда́ хо́дим в музе́и и теа́тры.

      Весна́ в Москве́ по́здняя: в ма́рте ещё лежа́л снег, а в апре́ле на у́лицах бы́ли грязь и лу́жи. Ру́сские называ́ют э́то вре́мя распу́тицей. Но пого́да с ка́ждым днём всё тепле́е.

      Ско́ро у нас экза́мены. Я немно́го волну́юсь, но к экза́менам почти́ гото́в. Когда́ сдам после́дний экза́мен, пое́ду с Ди́мой в Каза́нь.

      А как твои́ дела́? Обяза́тельно напиши́ мне!

      Твой друг
    rubric:
    - 内容 10 分：五个方面（课程和最难的课、新朋友、春天的天气、考试准备、考后打算）各 2 分，写到了但只有一句、没有展开的给 1 分
    - 语法 10 分：要求的五项（比较级或最高级、短尾形容词、命令式、过去时两种体、完成体将来时）各 1 分；其余 5 分看全文语法错误，名词、形容词变格，动词变位，数词与名词连用，支配关系，每两处错误扣 1 分
    - 词汇 5 分：用词准确、有变化，能用上本册学过的词（[се́ссия, зачёт, экза́мен, одногру́ппник, распу́тица]{.ru} 等）给 5 分；用词单调或有三处以上用词不当的，酌情扣 1–3 分
    - 结构 5 分：有称呼和落款（1 分），分段清楚、每段一个意思（2 分），开头和结尾自然、句子之间衔接通顺（2 分）
    - 字数少于 100 词的，内容分最多给 6 分
    notes: 范文约 150 词，按信的格式写：称呼 [Дорого́й друг!]{.ru}，开头一句道歉，结尾问候对方并提出请求，落款 [Твой друг]{.ru}。正文五段，每段对应一个方面。语法上：[Са́мый тру́дный предме́т]{.ru} 是最高级（第 24 课），[быстре́е всех]{.ru} 是副词比较级加 [всех]{.ru}（第 26 课），[с ка́ждым днём всё тепле́е]{.ru} 是比较级作谓语（第 23 课）；[гото́в к экза́менам]{.ru} 是短尾形容词带 [к]{.ru} + 第三格（第 25 课）；[прочита́ли пять больши́х книг]{.ru} 说结果用完成体，[чита́л два ра́за]{.ru} 说次数用未完成体（第 28 课），[пять больши́х книг]{.ru} 也复习了数词和复数第二格（第 4、14 课）；[Когда́ сдам… пое́ду]{.ru} 用完成体将来时（第 29 课）；[Прости́]{.ru}、[напиши́]{.ru} 是命令式，一次具体的请求用完成体（第 30 课）。写作时可以先列五个方面的提纲，每个方面写两三句，再加上开头和结尾。
