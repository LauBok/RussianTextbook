    **Москва́ и Петербу́рг**

    Москва́ и Петербу́рг — два са́мых больши́х го́рода Росси́и. Москва́ намно́го ста́рше: в пе́рвый раз о Москве́ написа́ли в ты́сяча сто со́рок седьмо́м году́. А Петербу́рг царь Пётр Пе́рвый стал стро́ить в ты́сяча семьсо́т тре́тьем году́. В ты́сяча семьсо́т двена́дцатом году́ Петербу́рг стал гла́вным го́родом страны́, и то́лько в ты́сяча девятьсо́т восемна́дцатом году́ гла́вным го́родом сно́ва ста́ла Москва́.

    Москва́ бо́льше, чем Петербу́рг, и люде́й в Москве́ живёт намно́го бо́льше. Москвичи́ ча́сто говоря́т, что жизнь в Москве́ быстре́е, а петербу́ржцы — что их го́род краси́вее и ти́ше. В Москве́ мно́го высо́ких но́вых домо́в, а в це́нтре Петербу́рга почти́ все дома́ ста́рые и ни́зкие. В Петербу́рге мно́го рек, а мосто́в бо́льше, чем в любо́м друго́м го́роде Росси́и.

    Ле́том в Петербу́рге почти́ нет но́чи: в ию́не на у́лице светло́ да́же в по́лночь. Э́ти но́чи называ́ют бе́лыми. В бе́лые но́чи на у́лицах до утра́ мно́го люде́й. Зато́ зимо́й дни в Петербу́рге коро́че, чем в Москве́. Дожди́ в Петербу́рге иду́т ча́ще, поэ́тому петербу́ржцы всегда́ хо́дят с зонто́м.

    Ме́жду Москво́й и Петербу́ргом почти́ семьсо́т киломе́тров. Са́мый бы́стрый по́езд — «Сапса́н»: он идёт почти́ четы́ре часа́. Мно́гие москвичи́ е́здят в Петербу́рг на выходны́е, а петербу́ржцы — в Москву́. И ка́ждый, коне́чно, счита́ет, что его́ го́род лу́чше.
    :::
  why: 第 1 题，[Москва́ намно́го ста́рше]{.ru}，[Москва́ бо́льше, чем Петербу́рг]{.ru}（比较级，第 23 课）。第 2 题，[В ты́сяча семьсо́т двена́дцатом году́ Петербу́рг стал гла́вным го́родом страны́]{.ru}；1703 年是开始建城，1147 年是莫斯科第一次见于记载，1918 年莫斯科重新成为首都（年份，第 5 课）。第 3 题，[в ию́не на у́лице светло́ да́же в по́лночь. Э́ти но́чи называ́ют бе́лыми]{.ru}。第 4 题，[Дожди́ в Петербу́рге иду́т ча́ще, поэ́тому…]{.ru}。第 5 题，“游隼号”[идёт почти́ четы́ре часа́]{.ru}；人口多的是莫斯科，桥最多的是彼得堡，莫斯科人也常去彼得堡。
