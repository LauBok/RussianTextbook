    **Семья́ мое́й ба́бушки**

    Мою́ ба́бушку зову́т Ве́ра Петро́вна. Она́ родила́сь в ты́сяча девятьсо́т пятьдеся́т второ́м году́ в ма́ленькой дере́вне на Во́лге. В семье́ бы́ло семь дете́й: четы́ре бра́та и три сестры́. Ба́бушка была́ са́мой мла́дшей. В семье́ всегда́ бы́ло ма́ло де́нег, но ба́бушка говори́т, что э́то бы́ли са́мые счастли́вые го́ды её жи́зни.

    Шко́лы в дере́вне не́ было, и ка́ждый день де́ти ходи́ли в сосе́днюю дере́вню: три киломе́тра туда́ и три обра́тно. Зимо́й, когда́ бы́ло мно́го сне́га, доро́га была́ ещё длинне́е и трудне́е. Ста́ршие бра́тья всегда́ ходи́ли вме́сте с мла́дшими сёстрами.

    В семна́дцать лет ба́бушка пое́хала в Москву́ учи́ться. Она́ ста́ла врачо́м и рабо́тала в больни́це со́рок лет. В Москве́ она́ познако́милась с де́душкой. У них сын и дочь: мой па́па и тётя Та́ня.

    Сейча́с ба́бушке се́мьдесят пять лет. Её бра́тья и сёстры живу́т в ра́зных города́х, но ка́ждое ле́то все собира́ются в той дере́вне, где они́ родили́сь. В про́шлом году́ там собрали́сь все: бра́тья и сёстры с жёнами, мужья́ми и детьми́. Мы сиде́ли во дворе́ за дли́нным столо́м, и ба́бушка расска́зывала о свои́х роди́телях. Мой мла́дший брат спроси́л её, почему́ она́ не оста́лась в дере́вне. «Я хоте́ла стать врачо́м, — отве́тила ба́бушка. — Но се́рдцем я всегда́ здесь». Для меня́ э́тот день — са́мый ва́жный день ле́та.
    :::
