  passage_zh: |
    **莫斯科和彼得堡**

    莫斯科和圣彼得堡是俄罗斯最大的两座城市。莫斯科要古老得多：第一次有关它的记载是在 1147 年。彼得堡则是沙皇彼得一世在 1703 年开始建造的。1712 年彼得堡成为全国的首都，直到 1918 年莫斯科才重新成为首都。

    莫斯科比彼得堡大，人口也多得多。莫斯科人常说莫斯科的生活节奏更快，彼得堡人则说他们的城市更美、更安静。莫斯科有很多新建的高楼，而彼得堡市中心的房子几乎都是低矮的老房子。彼得堡河流很多，桥比俄罗斯任何其他城市都多。

    夏天彼得堡几乎没有黑夜：六月里，就连午夜外面也是亮的。这样的夜晚叫作白夜。白夜里街上直到早晨都有很多人。不过冬天彼得堡的白昼比莫斯科短。彼得堡下雨更多，所以彼得堡人出门总带着伞。

    莫斯科和彼得堡相距将近七百公里。最快的列车是“游隼号”：差不多要四个小时。很多莫斯科人周末去彼得堡，彼得堡人也去莫斯科。当然，每个人都认为自己的城市更好。
