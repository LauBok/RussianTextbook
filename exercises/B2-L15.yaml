lesson: B2-L15
grammar: "物主代词 [мой, твой, наш, ваш, свой]{.ru} 和指示代词 [э́тот, тот]{.ru} 的复数各格；[свои́]{.ru} 与 [их]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的代词的正确形式填空。
    why: "代词的格跟着名词走。第 1 题 [о]{.ru} + 第六格：[ва́ших]{.ru}。第 2 题 [писа́ть]{.ru} 给谁用第三格：[мои́м]{.ru}。第 3 题 [горди́ться]{.ru} 要求第五格：[на́шими]{.ru}。第 4 题动物名词作宾语，复数第四格同第二格：[свои́х]{.ru}。第 5 题 [об]{.ru} + 第六格：[э́тих]{.ru}。第 6 题非动物名词作宾语，同第一格：[ва́ши]{.ru}。第 7 题 [с]{.ru} + 第五格：[те́ми]{.ru}。第 8 题 [нет]{.ru} + 第二格：[твои́х]{.ru}。"
    items:
      - stem: Расскажи́те о ___ учителя́х.
        hint: ваш
        accept: ["ва́ших"]
      - stem: Ю́ми пи́шет пи́сьма ___ шко́льным учителя́м.
        hint: мой
        accept: ["мои́м"]
      - stem: Мы о́чень горди́мся ___ профессора́ми.
        hint: наш
        accept: ["на́шими"]
      - stem: Студе́нты называ́ют ___ преподава́телей по и́мени и о́тчеству.
        hint: свой
        accept: ["свои́х"]
      - stem: Об ___ профессора́х пи́шут в газе́тах.
        hint: э́тот
        accept: ["э́тих"]
      - stem: Я ча́сто вспомина́ю ___ уро́ки.
        hint: ваш
        accept: ["ва́ши"]
      - stem: Ди́ма игра́ет в футбо́л с ___ преподава́телями.
        hint: тот
        accept: ["те́ми"]
      - stem: У меня́ нет ___ фотогра́фий.
        hint: твой
        accept: ["твои́х"]

  - id: e2
    type: choice
    task: 选择 [свои́]{.ru} 或 [их]{.ru} 的正确形式。
    why: "宾语属于句子的主语时用 [свой]{.ru}：第 1 题“学生们称呼自己的老师”，第 3 题“孩子们给自己的妈妈”，第 5 题“我们为自己的教授自豪”（[свой]{.ru} 可以指第一、第二人称的主语）。不属于主语时用 [их]{.ru}，[их]{.ru} 不变格：第 2 题主语是“我”，老师是迪马和安娜的；第 4 题主语是 [О́льга Ви́кторовна]{.ru}，问的是学生们的父母，不是她自己的父母。"
    items:
      - stem: Студе́нты уважа́ют ___ преподава́телей.
        options: [свои́х, их]
        answer: свои́х
      - stem: Ди́ма и А́нна у́чатся в одно́й гру́ппе. Я зна́ю ___ преподава́телей.
        options: [свои́х, их]
        answer: их
      - stem: Восьмо́го ма́рта де́ти да́рят цветы́ ___ ма́мам.
        options: [свои́м, их]
        answer: свои́м
      - stem: О́льга Ви́кторовна спроси́ла студе́нтов о ___ роди́телях.
        options: [свои́х, их]
        answer: их
      - stem: Мы о́чень горди́мся ___ профессора́ми.
        options: [свои́ми, их]
        answer: свои́ми

  - id: e3
    type: rewrite
    task: 把句中的代词和名词变成复数。
    example:
      cue: Я ча́сто вспомина́ю моего́ учи́теля.
      answer: Я ча́сто вспомина́ю мои́х учителе́й.
    why: "代词、形容词、名词一起变成复数的同一个格。第 1 题第三格：[на́шим преподава́телям]{.ru}。第 2 题第五格：[э́тими студе́нтами]{.ru}。第 3 题第六格：[о твои́х друзья́х]{.ru}，[друг]{.ru} 的复数是 [друзья́]{.ru}。第 4 题非动物名词，第四格同第一格：[э́ти кни́ги]{.ru}。"
    items:
      - cue: Мы написа́ли сообще́ние на́шему преподава́телю.
        accept: ["Мы написа́ли сообще́ние на́шим преподава́телям.", "Мы написа́ли сообще́ния на́шим преподава́телям."]
      - cue: О́льга Ви́кторовна говори́ла с э́тим студе́нтом.
        accept: ["О́льга Ви́кторовна говори́ла с э́тими студе́нтами."]
      - cue: Расскажи́ о твоём дру́ге.
        accept: ["Расскажи́ о твои́х друзья́х."]
      - cue: Я уже́ прочита́л э́ту кни́гу.
        accept: ["Я уже́ прочита́л э́ти кни́ги."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“自己的老师”指主语，用 [свои́х]{.ru}，动物名词复数第四格。第 2 题 [горди́ться]{.ru} 要求第五格。第 3 题 [писа́ть]{.ru} 给谁用第三格。第 4 题“这些”用 [э́ти]{.ru} 的第六格 [э́тих]{.ru}，前置词写成 [об]{.ru}。"
    items:
      - zh: 俄罗斯学生用名字和父称称呼自己的老师。
        accept: ["Ру́сские студе́нты называ́ют свои́х преподава́телей по и́мени и о́тчеству.", "Ру́сские студе́нты называ́ют свои́х учителе́й по и́мени и о́тчеству.", "В Росси́и студе́нты называ́ют свои́х преподава́телей по и́мени и о́тчеству."]
        rubric: ["[свои́х преподава́телей]{.ru}：复数第四格同第二格", "[по и́мени и о́тчеству]{.ru}"]
      - zh: 我们为我们的教授们自豪。
        accept: ["Мы горди́мся на́шими профессора́ми.", "Мы горди́мся свои́ми профессора́ми."]
        rubric: ["[горди́ться]{.ru} + 第五格", "[на́шими]{.ru} 或 [свои́ми профессора́ми]{.ru}"]
      - zh: 由美给她的中学老师们写信。
        accept: ["Ю́ми пи́шет пи́сьма свои́м шко́льным учителя́м.", "Ю́ми пи́шет свои́м шко́льным учителя́м.", "Ю́ми пи́шет пи́сьма свои́м учителя́м из шко́лы."]
        rubric: ["“她的”指主语由美，用 [свои́м]{.ru}，不用 [её]{.ru}", "[шко́льным учителя́м]{.ru}：复数第三格"]
      - zh: 报纸上写过这些教授。
        accept: ["Об э́тих профессора́х писа́ли в газе́тах.", "Об э́тих профессора́х пи́шут в газе́тах.", "В газе́тах писа́ли об э́тих профессора́х."]
        rubric: ["[об э́тих профессора́х]{.ru}：复数第六格", "不定人称句 [писа́ли / пи́шут]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кака́я была́ те́ма уро́ка? Как называ́ют учителе́й в Япо́нии и в Кита́е? Как ру́сские студе́нты называ́ют свои́х преподава́телей? Что рассказа́л Ди́ма о свои́х преподава́телях? Кому́ Ван Лэй написа́л ве́чером?]{.ru}"
        length: 50–80
        model: "Те́ма уро́ка была́ «На́ши учителя́». В Япо́нии и в Кита́е учителе́й называ́ют по фами́лии и добавля́ют сло́во «учи́тель». А ру́сские студе́нты называ́ют свои́х преподава́телей по и́мени и о́тчеству. Ди́ма рассказа́л, что на их факульте́те рабо́тают изве́стные профессора́ и студе́нты гордя́тся э́тими профессора́ми. С не́которыми молоды́ми преподава́телями он игра́ет в футбо́л. Ве́чером Ван Лэй написа́л сообще́ние свои́м учителя́м в Пеки́н."
        rubric: ["回答全部五个问题", "物主代词或指示代词复数间接格至少三处：[свои́х преподава́телей]{.ru}、[э́тими профессора́ми]{.ru}、[свои́м учителя́м]{.ru} 等", "[свой]{.ru} 和 [их]{.ru} 用对"]
        notes: 范文约 70 词。由美和王磊的话合成一句；迪马的话改成 [рассказа́л, что…]{.ru}，原话里的 [на на́шем факульте́те]{.ru} 变成 [на их факульте́те]{.ru}，[на́шими профессора́ми]{.ru} 换成 [э́тими профессора́ми]{.ru}。
