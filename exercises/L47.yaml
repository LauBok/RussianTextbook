lesson: L47
grammar: "[в]{.ru} + 钟点表示几点做某事；[че́рез]{.ru} + 第四格（过多久以后）；第四格 + [наза́д]{.ru}（多久以前）；[мину́та]{.ru} 与数词连用。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的数词回答，写出完整的时间词组。
    placeholder: в …
    why: "[в]{.ru} 后面的钟点和第 28 课一样搭配：1 只说 [в час]{.ru}；2、3、4 后用 [часа́]{.ru}；5–12 后用 [часо́в]{.ru}。最常见的错误是忘了前置词 [в]{.ru}，或者把 [в час]{.ru} 说成 [в оди́н час]{.ru}。"
    items:
      - stem: Магази́н закрыва́ется ___. (8)
        accept: [в во́семь часо́в, в во́семь]
      - stem: Уро́к начина́ется ___. (9)
        accept: [в де́вять часо́в, в де́вять]
      - stem: Па́па бу́дет до́ма ___. (1)
        accept: [в час]
      - stem: Суперма́ркет открыва́ется ___. (7)
        accept: [в семь часо́в, в семь]
      - stem: Фильм начина́ется ___. (3)
        accept: [в три часа́, в три]
      - stem: А́нна бу́дет до́ма ___. (11)
        accept: [в оди́ннадцать часо́в, в оди́ннадцать]

  - id: e2
    type: choice
    task: 选择 [че́рез]{.ru} 或 [наза́д]{.ru}。
    why: 动作在将来的用 [че́рез]{.ru}（第 1、3、5 题，动词是将来时）；在过去的用 [наза́д]{.ru}（第 2、4、6 题，动词是过去时）。[че́рез]{.ru} 是前置词，放在时间词组前面；[наза́д]{.ru} 放在后面。
    items:
      - stem: ___ полчаса́ я бу́ду до́ма.
        options: [Че́рез, Наза́д]
        answer: Че́рез
      - stem: А́нна звони́ла час ___.
        options: [че́рез, наза́д]
        answer: наза́д
      - stem: ___ неде́лю у нас бу́дет семина́р.
        options: [Че́рез, Наза́д]
        answer: Че́рез
      - stem: Ван Лэй был в Пеки́не ме́сяц ___.
        options: [че́рез, наза́д]
        answer: наза́д
      - stem: Я сде́лаю упражне́ние ___ два часа́.
        options: [че́рез, наза́д]
        answer: че́рез
      - stem: Мы бы́ли в Се́ргиевом Поса́де неде́лю ___.
        options: [че́рез, наза́д]
        answer: наза́д

  - id: e3
    type: fill
    task: 填入 [мину́та]{.ru} 的正确形式。
    why: "[мину́та]{.ru} 是阴性名词，跟数词连用和 [час]{.ru} 规则相同：1 后用第一格单数，2–4 后用 [мину́ты]{.ru}，5–20 后用 [мину́т]{.ru}。21、22 这类数看最后一个词：[два́дцать одна́ мину́та]{.ru}，[два́дцать две мину́ты]{.ru}。"
    items:
      - stem: одна́ ___
        accept: [мину́та]
      - stem: три ___
        accept: [мину́ты]
      - stem: пять ___
        accept: [мину́т]
      - stem: два́дцать две ___
        accept: [мину́ты]
      - stem: со́рок ___
        accept: [мину́т]

  - id: e4
    type: rewrite
    task: 按例句回答，用 [че́рез]{.ru} 说什么时候做。
    placeholder: Че́рез …
    example:
      cue: Когда́ ты бу́дешь до́ма? (полчаса́)
      answer: Че́рез полчаса́.
    why: "[че́рез]{.ru} 要求第四格：[неде́ля → че́рез неде́лю]{.ru}，[мину́та → че́рез мину́ту]{.ru}；阳性非动物名词第四格同第一格：[че́рез час, че́рез ме́сяц]{.ru}。"
    items:
      - cue: Когда́ у вас семина́р? (неде́ля)
        accept: ["Че́рез неде́лю."]
      - cue: Когда́ ты пригото́вишь у́жин? (час)
        accept: ["Че́рез час."]
      - cue: Когда́ ты бу́дешь в Пеки́не? (ме́сяц)
        accept: ["Че́рез ме́сяц."]
      - cue: Когда́ ты сде́лаешь упражне́ние? (мину́та)
        accept: ["Че́рез мину́ту."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语的“八点”“一小时前”“半小时后”只是名词词组，俄语要加 [в]{.ru}、[наза́д]{.ru}、[че́рез]{.ru}。注意“一小时前”的语序是 [час наза́д]{.ru}。
    items:
      - zh: 超市早上七点开门。
        accept: ["Суперма́ркет открыва́ется в семь часо́в утра́.", "Суперма́ркет открыва́ется у́тром в семь часо́в.", "Суперма́ркет открыва́ется в семь часо́в у́тром.", "Суперма́ркет открыва́ется в семь утра́."]
        rubric: ["[в семь часо́в]{.ru}", "[открыва́ться]{.ru} 第三人称单数 [открыва́ется]{.ru}"]
      - zh: 安娜一小时前打过电话。
        accept: ["А́нна звони́ла час наза́д.", "Час наза́д звони́ла А́нна."]
        rubric: ["[час наза́д]{.ru}，[наза́д]{.ru} 放在后面"]
      - zh: 半小时以后我到家。
        accept: ["Че́рез полчаса́ я бу́ду до́ма.", "Я бу́ду до́ма че́рез полчаса́."]
        rubric: ["[че́рез полчаса́]{.ru}", "“在家”的将来时 [бу́ду до́ма]{.ru}"]
      - zh: ——你几点上课？——九点。
        accept: ["— Во ско́лько у тебя́ уро́к? — В де́вять часо́в.", "— Когда́ у тебя́ уро́к? — В де́вять часо́в.", "— Во ско́лько у тебя́ уро́к? — В де́вять.", "— Когда́ у тебя́ уро́к? — В де́вять."]
        rubric: ["问“几点”用 [во ско́лько]{.ru} 或 [когда́]{.ru}", "回答用 [в]{.ru} + 钟点"]

  - id: e6
    type: open
    task: 情景对话：请家里人去买东西，问他什么时候回来（6–8 句）。
    items:
      - prompt: 你请朋友或家人去商店买东西。他说附近的商店已经关门了，不过超市还开着；你问他几点回来。要用到命令式、[в]{.ru} + 钟点、[че́рез]{.ru} 和 [наза́д]{.ru}。
        length: 40–70
        model: "— Ми́ша, купи́, пожа́луйста, хлеб.\n— Сейча́с? Магази́н уже́ не рабо́тает. Он закрыва́ется в семь часо́в.\n— А суперма́ркет?\n— Суперма́ркет рабо́тает кру́глые су́тки. Хорошо́, куплю́.\n— Спаси́бо! Когда́ ты бу́дешь до́ма?\n— Че́рез полчаса́.\n— Хорошо́. А па́па звони́л час наза́д. Он бу́дет до́ма в де́вять часо́в."
        rubric: ["请求用命令式加 [пожа́луйста]{.ru}", "至少一次 [в]{.ru} + 钟点", "[че́рез]{.ru} 和 [наза́д]{.ru} 各至少一次"]
        notes: 范文仿照课文：先用命令式 [купи́, пожа́луйста]{.ru} 提出请求，对方用商店的营业时间（[в семь часо́в]{.ru}）说明困难，再给出办法。后半段用 [че́рез полчаса́]{.ru} 回答“什么时候回来”，用 [час наза́д]{.ru} 引出新的消息，三种时间表达都用上了。
