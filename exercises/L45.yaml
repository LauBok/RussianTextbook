lesson: L45
grammar: 体与时间状语：[ка́ждый день, всегда́, обы́чно, ча́сто]{.ru} 与未完成体连用表示经常、反复的动作；[вчера́, за́втра, сра́зу]{.ru} 等与完成体连用表示一次完成的动作；[ка́ждый]{.ru}、[тако́й]{.ru} 的变化。
exercises:

  - id: e1
    type: choice
    task: 选择正确的体。
    why: 有 [ка́ждый день]{.ru}、[обы́чно]{.ru}、[всегда́]{.ru}、[ча́сто]{.ru} 的句子说的是经常发生的事，用未完成体（第 1、3、5 题）。说某一次做成的事用完成体（第 2、4、6 题）。第 6 题 [за́втра]{.ru} 加上具体的一件事，用完成体将来时 [куплю́]{.ru}。
    items:
      - stem: Ка́ждый день Ван Лэй ___ хлеб.
        options: [покупа́ет, ку́пит]
        answer: покупа́ет
      - stem: Вчера́ Ван Лэй ___ торт.
        options: [покупа́л, купи́л]
        answer: купи́л
      - stem: Продавщи́ца всегда́ ___ «До́брое у́тро!»
        options: [говори́т, ска́жет]
        answer: говори́т
      - stem: Ми́ша уже́ ___ два куска́.
        options: [ел, съел]
        answer: съел
      - stem: Ра́ньше я ча́сто ___ пи́сьма домо́й.
        options: [писа́л, написа́л]
        answer: писа́л
      - stem: За́втра я ___ хлеб в бу́лочной.
        options: [бу́ду покупа́ть, куплю́]
        answer: куплю́

  - id: e2
    type: rewrite
    task: 按例句改写：把“每天”改成“昨天”。
    placeholder: Вчера́ …
    example:
      cue: Ка́ждый день я покупа́ю хлеб.
      answer: Вчера́ я купи́л хлеб.
    why: "[ка́ждый день]{.ru} 换成 [вчера́]{.ru}，说的就是一次完成的动作，未完成体现在时改成完成体过去时。异根和换后缀的体对要记牢：[брать — взять]{.ru}，[говори́ть — сказа́ть]{.ru}，[есть — съесть]{.ru}。"
    items:
      - cue: Ка́ждый день А́нна берёт бато́н.
        accept: ["Вчера́ А́нна взяла́ бато́н."]
      - cue: Ка́ждый день Ми́ша ест торт.
        accept: ["Вчера́ Ми́ша съел торт."]
      - cue: Ка́ждый день ма́ма гото́вит у́жин.
        accept: ["Вчера́ ма́ма пригото́вила у́жин."]
      - cue: Ка́ждый день О́льга Ви́кторовна пока́зывает фильм.
        accept: ["Вчера́ О́льга Ви́кторовна показа́ла фильм."]

  - id: e3
    type: fill
    task: 填入 [ка́ждый]{.ru} 的正确形式。
    why: "[ка́ждый]{.ru} 按形容词变格，和名词一致。表示“每……”的时间词组用第四格：阳性非动物名词第四格同第一格 [ка́ждый день]{.ru}，阴性 [ка́ждую]{.ru}，中性 [ка́ждое]{.ru}。第 4 题 [ка́ждая неде́ля]{.ru} 作主语，用第一格。"
    items:
      - stem: ___ у́тро я пью чай.
        accept: [ка́ждое]
      - stem: ___ суббо́ту мы отдыха́ем.
        accept: [ка́ждую]
      - stem: Ван Лэй покупа́ет хлеб ___ день.
        accept: [ка́ждый]
      - stem: ___ неде́ля начина́ется в понеде́льник.
        accept: [ка́ждая]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊每天早上在面包店买面包；昨天过节，他买了蛋糕；玛丽亚·尼古拉耶夫娜通常在超市买面包；米沙已经吃了两块。
    items:
      - stem: Обы́чно Ван Лэй берёт ___.
        options: [чёрный хлеб и бато́н, торт]
        answer: чёрный хлеб и бато́н
      - stem: Вчера́ Ван Лэй купи́л ___.
        options: [хлеб, торт]
        answer: торт
      - stem: Мари́я Никола́евна обы́чно покупа́ет хлеб ___.
        options: [в бу́лочной, в суперма́ркете]
        answer: в суперма́ркете
      - stem: Ми́ша уже́ съел ___.
        options: [оди́н кусо́к, два куска́]
        answer: два куска́

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语的“每天买”“昨天买了”动词形式差别不大，俄语要换体：经常的用未完成体，一次的用完成体。第 3 题“明天买”是一次的具体动作，用完成体将来时；“每天都要买”是反复的，用 [бу́ду]{.ru} + 未完成体。
    items:
      - zh: 我每天早上喝茶。
        accept: ["Ка́ждое у́тро я пью чай.", "Я пью чай ка́ждое у́тро."]
        rubric: ["[ка́ждое у́тро]{.ru}，中性第四格", "未完成体现在时 [пью]{.ru}"]
      - zh: 昨天安娜买了一个大蛋糕。
        accept: ["Вчера́ А́нна купи́ла большо́й торт.", "А́нна вчера́ купи́ла большо́й торт."]
        rubric: ["完成体过去时阴性 [купи́ла]{.ru}"]
      - zh: 明天我买面包，以后我每天都买。
        accept: ["За́втра я куплю́ хлеб, а пото́м бу́ду покупа́ть его́ ка́ждый день.", "За́втра я куплю́ хлеб, а пото́м бу́ду покупа́ть хлеб ка́ждый день.", "За́втра я куплю́ хлеб. Пото́м я бу́ду покупа́ть его́ ка́ждый день."]
        rubric: ["一次：[куплю́]{.ru}", "反复：[бу́ду покупа́ть]{.ru}"]
      - zh: 米沙很少吃黑面包。
        accept: ["Ми́ша ре́дко ест чёрный хлеб."]
        rubric: ["[ре́дко]{.ru} 与未完成体连用", "[есть]{.ru} 第三人称单数 [ест]{.ru}"]

  - id: e6
    type: open
    task: 写一写你平时早上做什么，和昨天早上有什么不同（40–60 词）。
    items:
      - prompt: 先用 [обы́чно, ка́ждое у́тро, всегда́]{.ru} 写平时的习惯，再用 [вчера́]{.ru} 写昨天早上一次性的事情。
        length: 40–60
        model: "Обы́чно я встаю́ ра́но. Ка́ждое у́тро я пью чай и ем бато́н. Пото́м я чита́ю газе́ту и иду́ в университе́т. А вчера́ был пра́здник. Я встал по́здно. Я пригото́вил большо́й за́втрак и съел его́. Пото́м я написа́л письмо́ домо́й и купи́л торт."
        rubric: ["平时的习惯用未完成体现在时：[встаю́, пью, ем]{.ru}", "昨天一次性的动作用完成体过去时：[встал, пригото́вил, съел, купи́л]{.ru}", "用上 [обы́чно, ка́ждое у́тро, вчера́]{.ru}"]
        notes: 范文分两段：前一半用未完成体现在时写习惯，后一半用 [А вчера́]{.ru} 转折，换成完成体过去时，一件一件说昨天做完的事。两半对比，体的分工一目了然。[встава́ть — встать]{.ru}、[есть — съесть]{.ru} 这些体对都用上了。
