lesson: B3-L22
grammar: "指小表爱后缀：[-ок (-ёк)]{.ru}、[-ик (-чик)]{.ru}（阳性名词），[-очк- / -ечк-]{.ru}（阴性名词，名字），[-еньк- / -оньк-]{.ru}（名字、形容词）；加后缀后词的性不变，[-ок]{.ru} 的 [о]{.ru} 变格时脱落。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Почему иностранцы жалуются, когда читают русские романы? Как обращаются к старшим и к начальнику? Какие суффиксы делают имя нежным, а какой может прозвучать грубо? Всегда ли уменьшительная форма означает, что предмет маленький? Как русские обращаются к любимым людям? Какое простое правило предлагает автор?]{.ru}"
        length: 70–100
        model: "Иностранцы жалуются, потому что у каждого героя русского романа несколько имён и трудно понять, один это человек или несколько. К старшим и к начальнику обращаются по имени и отчеству, например «Александр Сергеевич». Суффиксы -еньк- и -очк- делают имя нежным: Сашенька, Леночка. Суффикс -к- в формах Машка, Сашка может прозвучать грубо. Уменьшительная форма не всегда означает, что предмет маленький: столик в кафе может быть обычного размера. Такие формы передают чувство — доброту, нежность, вежливость. К любимым людям русские часто обращаются ласково: муж может назвать жену солнышком или зайкой. Правило простое: чем больше в имени ласковых суффиксов, тем ближе отношения."
        rubric: ["六个问题都回答，内容与课文一致", "[обращаться к кому]{.ru}、[по имени и отчеству]{.ru} 用对", "[назвать кого кем]{.ru}：第二个名词用第五格", "[чем больше…, тем…]{.ru} 用比较级"]
        notes: 第 4 题最好举出课文里的例子（[столик]{.ru}、[минуточку]{.ru}）。第 5 题注意 [назвать жену солнышком]{.ru} 用第五格。第 6 题 [чем]{.ru} 和 [тем]{.ru} 后面都要用比较级：[больше]{.ru}、[ближе]{.ru}。

  - id: e2
    type: fill
    task: 用括号里名词或形容词的指小表爱形式填空，注意性、数、格。
    why: "先选后缀，再变格。第 1 题 [дом]{.ru} 用 [-ик]{.ru}，[в]{.ru} 后第六格 [домике]{.ru}；[и]{.ru} 不脱落。第 2 题 [сын]{.ru} 用 [-ок]{.ru}，[с]{.ru} 后第五格，[о]{.ru} 脱落：[сынком]{.ru}，[о]{.ru} 不能保留。第 3 题 [минута]{.ru} 的二次指小 [минуточка]{.ru}，作 [подождать]{.ru} 的宾语用第四格 [минуточку]{.ru}。第 4 题 [город]{.ru} 用 [-ок]{.ru}，第六格 [в городке]{.ru}，[о]{.ru} 脱落。第 5 题 [белый]{.ru} 加 [-еньк-]{.ru}，与 [котик]{.ru} 一致，阳性第一格 [беленький]{.ru}。第 6 题 [заяц]{.ru} 的指小形式是 [зайчик]{.ru}，[ц]{.ru} 变 [ч]{.ru}，复数第四格（动物名词同第二格）[зайчиков]{.ru}。"
    items:
      - stem: Летом бабушка живёт в маленьком ___ у реки.
        hint: дом
        accept: ["домике"]
      - stem: Мама долго разговаривала с ___ по телефону.
        hint: сын
        accept: ["сынком"]
      - stem: Подождите ___, я сейчас приду!
        hint: минута
        accept: ["минуточку"]
      - stem: Мой дедушка родился в небольшом ___ на Волге.
        hint: город
        accept: ["городке"]
      - stem: У Миши живёт ___ котик.
        hint: белый
        accept: ["беленький"]
      - stem: В сказке девочка встретила в лесу двух ___.
        hint: заяц
        accept: ["зайчиков"]

  - id: e3
    type: choice
    task: 根据情景选择最合适的称呼。
    why: "称呼的选择看双方关系。第 1 题学生对老师，用名字加父称。第 2 题奶奶对孙子，用最温柔的 [-еньк-]{.ru} 形式。第 3 题刚认识的同学之间用简称，不带感情色彩；[Сашка]{.ru} 只用于很熟的朋友，对刚认识的人显得随便，[Александр Сергеевич]{.ru} 太正式。第 4 题对不认识的成年人，在不知道父称的情况下，用全名加 [вы]{.ru} 最稳妥；[Женька]{.ru} 粗鲁，[Женечка]{.ru} 过分亲昵。"
    items:
      - stem: "Студент — преподавателю: «___, можно спросить?»"
        options: [Саша, Александр Сергеевич, Сашенька]
        answer: Александр Сергеевич
      - stem: "Бабушка — маленькому внуку: «___, иди обедать!»"
        options: [Александр, Сашенька, Сашка]
        answer: Сашенька
      - stem: "Студентка — новому соседу в группе, с которым познакомилась вчера: «___, дай, пожалуйста, ручку»."
        options: [Саша, Сашка, Александр Сергеевич]
        answer: Саша
      - stem: "Сотрудник банка — незнакомому молодому человеку: «___, подпишите здесь, пожалуйста»."
        options: [Женька, Евгений, Женечка]
        answer: Евгений

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [сынок]{.ru} 的第二格 [сынка]{.ru}：[-ок]{.ru} 的 [о]{.ru} 脱落，重音在词尾。第 2 题 [домик]{.ru} 是阳性（性和 [дом]{.ru} 一样），形容词用 [маленький]{.ru}。第 3 题 [минуточка]{.ru} 是阴性，复数第二格 [минуточек]{.ru}，出现隐现元音 [е]{.ru}。第 4 题 [петушок]{.ru}（小公鸡）第五格 [петушком]{.ru}，[о]{.ru} 脱落。"
    items:
      - stem: У нашего ___ сегодня день рождения.
        options: [сынока, сынка, сынке]
        answer: сынка
      - stem: На берегу стоял ___ домик.
        options: [маленький, маленькая, маленькое]
        answer: маленький
      - stem: Осталось несколько ___ до начала фильма.
        options: [минуточек, минуточков, минуточки]
        answer: минуточек
      - stem: Мальчик долго играл во дворе с ___.
        options: [петушоком, петушком, петушкой]
        answer: петушком

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 对长辈和上司要用名字加父称来称呼。
        accept: ["К старшим и к начальнику обращаются по имени и отчеству.", "К старшим и к начальнику нужно обращаться по имени и отчеству.", "К старшим и начальнику обращаются по имени и отчеству.", "К старшим и начальнику нужно обращаться по имени и отчеству.", "Старших и начальника называют по имени и отчеству.", "Старших и начальника нужно называть по имени и отчеству.", "К старшим и к начальнику надо обращаться по имени и отчеству.", "К старшим и начальнику надо обращаться по имени и отчеству."]
        rubric: ["[обращаться к кому]{.ru} 用第三格，或 [называть кого]{.ru} 用第四格", "[по имени и отчеству]{.ru}", "泛指可用不定人称句（谓语用复数第三人称）"]
      - zh: 指小形式并不总是表示东西小。
        accept: ["Уменьшительная форма не всегда означает, что предмет маленький.", "Уменьшительная форма не всегда значит, что предмет маленький."]
        rubric: ["[уменьшительная форма]{.ru}", "[не всегда означает, что…]{.ru}"]
      - zh: 好朋友之间这样称呼完全正常。
        accept: ["Между близкими друзьями такая форма вполне нормальна.", "Между близкими друзьями так называть вполне нормально.", "Между близкими друзьями это вполне нормально.", "Между близкими друзьями так обращаться вполне нормально.", "Между близкими друзьями такое обращение вполне нормально."]
        rubric: ["[между]{.ru} + 第五格：[между близкими друзьями]{.ru}", "[вполне нормально / нормальна]{.ru}：短尾与主语一致，无主语时用中性"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[Выбор формы имени в русском языке говорит об отношениях между людьми.]{.ru} 用一个人的名字（如 [Мария]{.ru} 或 [Иван]{.ru}）说明在不同场合、不同的人怎样称呼他（她），至少用三种带指小表爱后缀的形式。"
        length: 140–160
        model: "Выбор формы имени в русском языке говорит об отношениях между людьми. Возьмём, например, Марию Ивановну Петрову, учительницу из небольшого городка. Ученики и их родители обращаются к ней по имени и отчеству: Мария Ивановна. Так говорят, когда хотят показать уважение. Коллеги, с которыми она работает много лет, зовут её просто Маша. Это краткая форма, нейтральная и дружеская. Мама, конечно, называет её Машенькой, как в детстве. Для мамы она всегда маленькая девочка, хотя у неё уже свои дети. А бабушка, вспоминая, какой хорошенькой была внучка, иногда говорит даже «Машуля». Младший брат, шутя, может сказать «Машка», и она не обидится, потому что между близкими людьми такая форма вполне нормальна. Но если так назовёт её незнакомый человек, это будет невежливо. А муж, разговаривая с ней, чаще всего говорит «Машенька» или называет её солнышком. Так по одной форме имени можно понять, кто говорит: ученик, коллега, мама, брат или муж."
        rubric: ["第一句是给定的主题句", "至少四种场合，称呼与关系相符", "至少三种带后缀的形式（[-еньк-]{.ru}、[-очк-]{.ru}、[-к-]{.ru} 等），并说明它们的感情色彩", "[обращаться к кому]{.ru}、[называть кого кем]{.ru} 支配正确", "约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 引出一个人 → 按关系由远到近列举：学生（名字加父称）、同事（简称）、母亲（[-еньк-]{.ru}）、奶奶、弟弟（[-к-]{.ru}）、丈夫 → 收束句 [Так по одной форме имени…]{.ru}。注意 [называть кого кем]{.ru} 第二个名词用第五格：[называет её Машенькой]{.ru}。
