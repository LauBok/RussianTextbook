lesson: L10
heading: 单元测试
intro: 本测试覆盖第一单元全部语法。答对 80% 以上再进入第二单元；没有达到的，回到相应的课复习后重做。
grammar: "[э́то]{.ru} 句型，[кто]{.ru}、[что]{.ru}；人称代词，[где]{.ru}、[вот]{.ru}、[там]{.ru}；名词的性；[ты]{.ru} 与 [вы]{.ru}，[Как вас зову́т?]{.ru}；名词复数第一格；第一、第二变位动词现在时；物主代词与 [чей]{.ru}；形容词第一格与 [како́й]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的词。
    why: 问人和动物用 [кто]{.ru}，问事物用 [что]{.ru}，所以问猫也用 [кто]{.ru}。代词替代名词时看名词的性和数：[чемода́н]{.ru} 阳性用 [он]{.ru}，[су́мка]{.ru} 阴性用 [она́]{.ru}，[фо́то]{.ru} 中性用 [оно́]{.ru}，[ключи́]{.ru} 复数用 [они́]{.ru}。指物时汉语一律说“它”，最容易在这里选错。
    items:
      - stem: — ___ э́то? — Э́то ко́шка Му́рка.
        options: [Кто, Что]
        answer: Кто
      - stem: — ___ э́то? — Э́то слова́рь.
        options: [Кто, Что]
        answer: Что
      - stem: — Где чемода́н? — Вот ___.
        options: [он, она́, оно́]
        answer: он
      - stem: — Где су́мка? — Вот ___.
        options: [он, она́, оно́]
        answer: она́
      - stem: — Где фо́то? — Вот ___.
        options: [он, она́, оно́]
        answer: оно́
      - stem: — Где мои́ ключи́? — ___ там.
        options: [Он, Она́, Они́]
        answer: Они́

  - id: e2
    type: choice
    task: 选择正确的物主代词或 [чей]{.ru} 的形式。
    why: "[мой]{.ru}、[твой]{.ru}、[наш]{.ru}、[чей]{.ru} 随后面名词的性、数变：[крова́ть]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，用 [моя́]{.ru}；[слова́рь]{.ru} 同样以 [-ь]{.ru} 结尾却是阳性，用 [твой]{.ru}；[па́па]{.ru} 指男人，是阳性，用 [мой]{.ru}；[очки́]{.ru} 只有复数，用 [чьи]{.ru}。[его́]{.ru}、[её]{.ru} 不变，只看东西归谁：书是米沙的，就用 [его́]{.ru}，不管 [кни́га]{.ru} 是阴性。"
    items:
      - stem: Э́то ___ крова́ть.
        options: [мой, моя́, моё]
        answer: моя́
      - stem: Ми́ша, вот ___ слова́рь.
        options: [твой, твоя́, твоё]
        answer: твой
      - stem: Э́то ___ па́па.
        options: [мой, моя́, мои́]
        answer: мой
      - stem: ___ э́то очки́?
        options: [Чей, Чья, Чьи]
        answer: Чьи
      - stem: Ми́ша чита́ет. Э́то ___ кни́га.
        options: [его́, её, их]
        answer: его́
      - stem: Э́то ___ ко́мната. Мы тут.
        options: [наш, на́ша, на́ше]
        answer: на́ша

  - id: e3
    type: choice
    task: 选择 [ты]{.ru} 还是 [вы]{.ru}，[тебя́]{.ru} 还是 [вас]{.ru}。
    why: 对长辈、老师、生人用 [вы]{.ru}，称呼名字加父称时也一定用 [вы]{.ru}；对家人、同学、孩子用 [ты]{.ru}；对两个以上的人不论熟不熟都用 [вы]{.ru}。问名字时 [вас]{.ru}、[тебя́]{.ru} 的选法和 [вы]{.ru}、[ты]{.ru} 一样；回答一律是 [меня́]{.ru}。
    items:
      - stem: Мари́я Никола́евна, ___ врач?
        options: [ты, вы]
        answer: вы
      - stem: Ми́ша, ___ шко́льник?
        options: [ты, вы]
        answer: ты
      - stem: А́нна и Ми́ша, ___ до́ма?
        options: [ты, вы]
        answer: вы
      - stem: — Как ___ зову́т? — Меня́ зову́т Ива́н Серге́евич.
        options: [тебя́, вас]
        answer: вас
      - stem: — Как тебя́ зову́т? — ___ зову́т Ми́ша.
        options: [Меня́, Я, Тебя́]
        answer: Меня́

  - id: e4
    type: fill
    task: 写出名词的复数第一格。
    why: "[кни́га]{.ru}、[ру́чка]{.ru} 词干末尾是 [г]{.ru}、[к]{.ru}，按拼写规则写 [и]{.ru} 不写 [ы]{.ru}；[тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，改成 [-и]{.ru}；[кре́сло]{.ru} 中性，改成 [-а]{.ru}。[стол]{.ru}、[окно́]{.ru} 的复数重音移动，[пода́рок]{.ru} 的 [о]{.ru} 脱落，[го́род]{.ru} 的复数是不规则的 [-а́]{.ru}，这几个都要单独记。"
    items:
      - stem: стол → ___
        accept: [столы́]
      - stem: кни́га → ___
        accept: [кни́ги]
      - stem: ру́чка → ___
        accept: [ру́чки]
      - stem: тетра́дь → ___
        accept: [тетра́ди]
      - stem: кре́сло → ___
        accept: [кре́сла]
      - stem: окно́ → ___
        accept: [о́кна]
      - stem: пода́рок → ___
        accept: [пода́рки]
      - stem: го́род → ___
        accept: [города́]

  - id: e5
    type: fill
    task: 写出动词现在时的正确形式。
    why: "[де́лать]{.ru}、[гуля́ть]{.ru}、[понима́ть]{.ru} 是第一变位，词尾元音是 [е]{.ru}，复数第三人称 [-ют]{.ru}；[говори́ть]{.ru}、[смотре́ть]{.ru}、[спать]{.ru} 是第二变位，词尾元音是 [и]{.ru}，复数第三人称 [-ят]{.ru}。[смотре́ть]{.ru} 只有第一人称重音在词尾，[смо́трите]{.ru} 重音在词干；[спать]{.ru} 的第一人称多一个 [л]{.ru}：[сплю]{.ru}。用 [вы]{.ru} 尊称一个人时，动词也用复数形式。"
    items:
      - stem: Что ты ___?
        hint: де́лать
        accept: [де́лаешь]
      - stem: Ве́чером они́ всегда́ ___.
        hint: гуля́ть
        accept: [гуля́ют]
      - stem: Я пло́хо ___.
        hint: понима́ть
        accept: [понима́ю]
      - stem: Актёры ___ так бы́стро!
        hint: говори́ть
        accept: [говоря́т]
      - stem: Ива́н Серге́евич, что вы ___?
        hint: смотре́ть
        accept: [смо́трите]
      - stem: Я не ___. Я слу́шаю.
        hint: спать
        accept: [сплю]

  - id: e6
    type: rewrite
    task: 把句子改成复数。
    example:
      cue: Э́то мой но́вый журна́л.
      answer: Э́то мои́ но́вые журна́лы.
    why: 名词、形容词、物主代词都要一起变成复数，[э́то]{.ru} 不变。[большо́й]{.ru}、[хоро́ший]{.ru}、[ма́ленький]{.ru} 词干末尾是 [ш]{.ru}、[к]{.ru}，复数按拼写规则写 [-ие]{.ru}；[си́ний]{.ru} 是软变化，复数 [си́ние]{.ru}。[слова́рь]{.ru} 的复数重音移到词尾：[словари́]{.ru}。
    items:
      - cue: Э́то твоя́ ма́ленькая су́мка.
        accept: [Э́то твои́ ма́ленькие су́мки.]
      - cue: Э́то наш большо́й стол.
        accept: [Э́то на́ши больши́е столы́.]
      - cue: Вот хоро́ший слова́рь.
        accept: [Вот хоро́шие словари́.]
      - cue: Где моя́ си́няя тетра́дь?
        accept: ["Где мои́ си́ние тетра́ди?"]

  - id: e7
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊说红场很大，克里姆林宫很古老；他的房间不大但很明亮；晚上安娜看书，米沙玩，父母去散步；套娃是彼得罗夫一家送给王磊的礼物，现在是王磊的。
    items:
      - stem: Кремль ___.
        options: [но́вый, ста́рый]
        answer: ста́рый
      - stem: Его́ ко́мната ___.
        options: [больша́я, ма́ленькая]
        answer: ма́ленькая
      - stem: Ве́чером Ми́ша ___.
        options: [чита́ет, игра́ет]
        answer: игра́ет
      - stem: Матрёшка — ___.
        options: [пода́рок, слова́рь]
        answer: пода́рок

  - id: e8
    type: translate
    task: 译成俄语。
    why: 第 1 题“谁的”要和 [кни́га]{.ru} 一致用阴性 [чья]{.ru}，“她的”用不变的 [её]{.ru}。第 2 题“在做什么”“在看”都用现在时，[смотре́ть]{.ru} 是第二变位，[мы смо́трим]{.ru}。第 3 题“多么……啊”用 [како́й]{.ru} 感叹句，[како́й]{.ru} 和形容词都要与阳性名词 [го́род]{.ru} 一致。
    items:
      - zh: ——这是谁的书？——这是她的书。
        accept: ["— Чья э́то кни́га? — Э́то её кни́га.", "— Чья э́то кни́га? — Её.", "— Чья э́то кни́га? — Её кни́га.", "— Чья э́то кни́га? — Э́то её."]
        rubric: ["“谁的”用阴性 [чья]{.ru}，与 [кни́га]{.ru} 一致", "“她的”用 [её]{.ru}，不变化"]
      - zh: ——你们在做什么？——我们在看电影。
        accept: ["— Что вы де́лаете? — Мы смо́трим фильм.", "— Что вы сейча́с де́лаете? — Мы смо́трим фильм.", "— Что вы де́лаете? — Мы сейча́с смо́трим фильм.", "— Что вы де́лаете? — Смо́трим фильм.", "— Что вы сейча́с де́лаете? — Смо́трим фильм."]
        rubric: ["[де́лать]{.ru} 第二人称复数 [де́лаете]{.ru}", "[смотре́ть]{.ru} 第一人称复数 [смо́трим]{.ru}"]
      - zh: 多么美丽的城市啊！
        accept: ["Како́й краси́вый го́род!", "Како́й э́то краси́вый го́род!"]
        rubric: ["用 [како́й]{.ru} 感叹句", "[како́й]{.ru} 和 [краси́вый]{.ru} 用阳性，与 [го́род]{.ru} 一致"]
