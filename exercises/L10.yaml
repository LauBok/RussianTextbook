lesson: L10
heading: 单元测试
intro: 本测试覆盖第一单元全部语法。答对 80% 以上再进入第二单元；没有达到的，回到相应的课复习后重做。
grammar: "[э́то]{.ru} 句型；[кто]{.ru}、[что]{.ru}、[где]{.ru}、[чей]{.ru}、[како́й]{.ru}；人称代词；名词的性；名词复数第一格；物主代词；第一、第二变位动词现在时；形容词第一格。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的物主代词。
    why: 物主代词随后面名词的性和数变化：[кни́га]{.ru} 是阴性，[окно́]{.ru} 是中性，[кни́ги]{.ru} 是复数，[стол]{.ru} 是阳性。
    items:
      - stem: Э́то ___ кни́га.
        options: [мой, моя́, моё]
        answer: моя́
      - stem: Э́то ___ окно́.
        options: [мой, моя́, моё]
        answer: моё
      - stem: Где ___ кни́ги?
        options: [моя́, моё, мои́]
        answer: мои́
      - stem: Э́то ___ стол.
        options: [наш, на́ша, на́ше]
        answer: наш

  - id: e2
    type: fill
    task: 写出名词的复数第一格。
    why: "[кни́га]{.ru}、[ко́шка]{.ru} 词干末尾是 [г]{.ru}、[к]{.ru}，按拼写规则写 [и]{.ru} 不写 [ы]{.ru}。[стол]{.ru}、[окно́]{.ru} 的复数重音移动，要单独记。"
    items:
      - stem: стол → ___
        accept: [столы́]
      - stem: кни́га → ___
        accept: [кни́ги]
      - stem: ма́ма → ___
        accept: [ма́мы]
      - stem: окно́ → ___
        accept: [о́кна]
      - stem: слова́рь → ___
        accept: [словари́]

  - id: e3
    type: fill
    task: 写出动词的正确形式。
    why: "[чита́ть]{.ru}、[де́лать]{.ru} 是第一变位，词尾元音是 [е]{.ru}；[говори́ть]{.ru}、[смотре́ть]{.ru} 是第二变位，词尾元音是 [и]{.ru}，复数第三人称是 [-ят]{.ru}。"
    items:
      - stem: Я ___.
        hint: чита́ть
        accept: [чита́ю]
      - stem: Мы ___.
        hint: говори́ть
        accept: [говори́м]
      - stem: Они́ ___ телеви́зор.
        hint: смотре́ть
        accept: [смо́трят]
      - stem: Что ты ___?
        hint: де́лать
        accept: [де́лаешь]

  - id: e4
    type: choice
    task: 选择正确的形容词形式。
    why: 形容词的词尾跟着名词的性走：[дом]{.ru} 阳性用 [-ый]{.ru} 或 [-ой]{.ru}，[ко́мната]{.ru} 阴性用 [-ая]{.ru}，[окно́]{.ru} 中性用 [-ое]{.ru}。
    items:
      - stem: Э́то ___ дом.
        options: [но́вый, но́вая, но́вое]
        answer: но́вый
      - stem: Э́то ___ ко́мната.
        options: [большо́й, больша́я, большо́е]
        answer: больша́я
      - stem: Э́то ___ окно́.
        options: [хоро́ший, хоро́шая, хоро́шее]
        answer: хоро́шее

  - id: e5
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：房间又大又亮，王磊晚上看书，安娜和米沙看电视，米沙说电影很有意思。
    items:
      - stem: Ко́мната больша́я и ___.
        options: [све́тлая, но́вая]
        answer: све́тлая
      - stem: Ве́чером Ван Лэй ___.
        options: [чита́ет, смо́трит телеви́зор]
        answer: чита́ет
      - stem: А́нна и Ми́ша ___.
        options: [чита́ют, смо́трят телеви́зор]
        answer: смо́трят телеви́зор
      - stem: Фильм ___.
        options: [интере́сный, но́вый]
        answer: интере́сный

  - id: e6
    type: translate
    task: 译成俄语。
    why: 第 1 题“谁的”要和 [кни́га]{.ru} 一致用阴性 [чья]{.ru}，“他的”用不变的 [его́]{.ru}。第 2 题的“在做什么”“在看”都用现在时，俄语没有进行时的专门形式。
    items:
      - zh: 这是谁的书？——这是他的书。
        accept: ["— Чья э́то кни́га? — Э́то его́ кни́га.", "— Чья э́то кни́га? — Его́."]
        rubric: ["“谁的”用阴性 [чья]{.ru}，与 [кни́га]{.ru} 一致", "“他的”用 [его́]{.ru}，不变化"]
      - zh: 你在做什么？——我在看电影。
        accept: ["— Что ты де́лаешь? — Я смотрю́ фильм."]
        rubric: ["[де́лать]{.ru} 第二人称单数 [де́лаешь]{.ru}", "[смотре́ть]{.ru} 第一人称单数 [смотрю́]{.ru}"]
