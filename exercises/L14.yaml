lesson: L14
grammar: "词干有变化的第一变位动词 [жить]{.ru}（[живу́, живёшь]{.ru}）和 [писа́ть]{.ru}（[пишу́, пи́шешь]{.ru}）；[жить]{.ru} + [в]{.ru} / [на]{.ru} + 第六格。"
exercises:

  - id: e1
    type: fill
    task: 写出 [жить]{.ru} 的正确形式。
    why: "[жить]{.ru} 的词干是 [жив-]{.ru}，重音一直在词尾，[е]{.ru} 都写成 [ё]{.ru}；[я]{.ru} 和 [они́]{.ru} 用 [-у]{.ru}、[-ут]{.ru}。第 4 题 [Петро́вы]{.ru} 是复数，用 [живу́т]{.ru}。"
    items:
      - stem: Я ___ в Москве́.
        hint: жить
        accept: ["живу́"]
      - stem: Где ты ___?
        hint: жить
        accept: ["живёшь"]
      - stem: Пьер ___ в общежи́тии.
        hint: жить
        accept: ["живёт"]
      - stem: Петро́вы ___ не в це́нтре.
        hint: жить
        accept: ["живу́т"]
      - stem: Мы ___ в го́роде.
        hint: жить
        accept: ["живём"]
      - stem: Где вы ___?
        hint: жить
        accept: ["живёте"]

  - id: e2
    type: fill
    task: 写出 [писа́ть]{.ru} 的正确形式。
    why: "[писа́ть]{.ru} 所有人称都把 [с]{.ru} 换成 [ш]{.ru}。重音只在 [я]{.ru} 的形式 [пишу́]{.ru} 上落在词尾，其余都在词干：[пи́шешь, пи́шет, пи́шут]{.ru}。[ш]{.ru} 后面写 [у]{.ru}，不写 [ю]{.ru}。"
    items:
      - stem: Я ___ письмо́.
        hint: писа́ть
        accept: ["пишу́"]
      - stem: Что ты ___?
        hint: писа́ть
        accept: ["пи́шешь"]
      - stem: А́нна ___ упражне́ние.
        hint: писа́ть
        accept: ["пи́шет"]
      - stem: Мы ___ о Москве́.
        hint: писа́ть
        accept: ["пи́шем"]
      - stem: Что вы ___?
        hint: писа́ть
        accept: ["пи́шете"]
      - stem: Студе́нты ___ пи́сьма.
        hint: писа́ть
        accept: ["пи́шут"]

  - id: e3
    type: rewrite
    task: 按提示回答“住在哪里”的问题。
    placeholder: Я живу́ … / Он живёт …
    example:
      cue: Где ты живёшь? (Москва́)
      answer: Я живу́ в Москве́.
    why: "[жить]{.ru} 后用 [в]{.ru} + 第六格。注意人称：问 [ты]{.ru} 答 [я]{.ru}，问 [вы]{.ru}（指几个人）答 [мы]{.ru}。[общежи́тие]{.ru} 第六格是 [общежи́тии]{.ru}，[семья́]{.ru} 第六格是 [семье́]{.ru}，[Кита́й]{.ru} 第六格是 [Кита́е]{.ru}。"
    items:
      - cue: Где живёт Пьер? (общежи́тие)
        accept: ["Он живёт в общежи́тии.", "Пьер живёт в общежи́тии.", "В общежи́тии."]
      - cue: Где живёт Ван Лэй? (семья́)
        accept: ["Он живёт в семье́.", "Ван Лэй живёт в семье́.", "В семье́."]
      - cue: Где живу́т его́ ма́ма и па́па? (Кита́й)
        accept: ["Они́ живу́т в Кита́е.", "Его́ ма́ма и па́па живу́т в Кита́е.", "В Кита́е."]
      - cue: Где вы живёте, Пьер и Ю́ми? (общежи́тие)
        accept: ["Мы живём в общежи́тии.", "В общежи́тии."]
      - cue: Где живёт ба́бушка? (да́ча)
        accept: ["Она́ живёт на да́че.", "Ба́бушка живёт на да́че.", "На да́че."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：皮埃尔和由美住在宿舍，王磊住在彼得罗夫家，他家不在市中心但也不远；王磊在课上写信，信里写莫斯科、上课和老师。
    items:
      - stem: Пьер и Ю́ми живу́т ___.
        options: [в семье́, в общежи́тии, в це́нтре]
        answer: в общежи́тии
      - stem: Петро́вы живу́т ___.
        options: ["в це́нтре", "далеко́", "не в це́нтре, но и не далеко́"]
        answer: "не в це́нтре, но и не далеко́"
      - stem: Его́ ма́ма и па́па живу́т ___.
        options: [в Москве́, в Пеки́не, в общежи́тии]
        answer: в Пеки́не
      - stem: На уро́ке Ван Лэй пи́шет ___.
        options: [упражне́ние, письмо́, слова́рь]
        answer: письмо́

  - id: e5
    type: translate
    task: 译成俄语。
    why: "[жить]{.ru} 和 [писа́ть]{.ru} 的变位要写对，特别是重音和 [ё]{.ru}。说住处从大到小排列。"
    items:
      - zh: 你住在哪儿？——我住在莫斯科。
        accept: ["— Где ты живёшь? — Я живу́ в Москве́.", "— Где ты живёшь? — В Москве́.", "— Ты где живёшь? — Я живу́ в Москве́.", "— Ты где живёшь? — В Москве́."]
        rubric: ["[живёшь]{.ru}、[живу́]{.ru}", "[в Москве́]{.ru}：第六格"]
      - zh: 我的爸爸妈妈住在中国，在北京。
        accept: ["Мои́ ма́ма и па́па живу́т в Кита́е, в Пеки́не.", "Мои́ па́па и ма́ма живу́т в Кита́е, в Пеки́не.", "Ма́ма и па́па живу́т в Кита́е, в Пеки́не.", "Па́па и ма́ма живу́т в Кита́е, в Пеки́не.", "Мои́ роди́тели живу́т в Кита́е, в Пеки́не.", "Роди́тели живу́т в Кита́е, в Пеки́не."]
        rubric: ["复数主语用 [живу́т]{.ru}", "[в Кита́е, в Пеки́не]{.ru}：从大到小"]
      - zh: 我常常写信。
        accept: ["Я ча́сто пишу́ пи́сьма.", "Я пишу́ пи́сьма ча́сто."]
        rubric: ["[пишу́]{.ru}：重音在词尾", "“常常”用 [ча́сто]{.ru}"]
      - zh: 他们在写什么？——他们在写莫斯科。
        accept: ["— Что они́ пи́шут? — Они́ пи́шут о Москве́.", "— Что они́ пи́шут? — О Москве́.", "— О чём они́ пи́шут? — Они́ пи́шут о Москве́.", "— О чём они́ пи́шут? — О Москве́."]
        rubric: ["[пи́шут]{.ru}：重音在词干，词尾 [-ут]{.ru}", "写的内容用 [о]{.ru} + 第六格"]
      - zh: 我们住得很近，不远。
        accept: ["Мы живём бли́зко, не далеко́.", "Мы живём бли́зко, недалеко́.", "Мы живём недалеко́.", "Мы живём бли́зко.", "Мы живём не далеко́, а бли́зко.", "Наш дом бли́зко, не далеко́.", "Наш дом бли́зко."]
        rubric: ["“远”用 [далеко́]{.ru}，“近”用 [бли́зко]{.ru}", 现在时不用系动词]

  - id: e6
    type: open
    task: 用俄语写一段话。
    items:
      - prompt: 介绍你和你的家人住在哪里：你住在哪个城市、住在宿舍还是家里，你的父母和其他家人住在哪里，你常常写什么。
        length: 30–60
        model: "Меня́ зову́т Ли На. Я живу́ в Пеки́не, в общежи́тии. Мои́ ма́ма и па́па живу́т не в Пеки́не, а в Шанха́е. Ба́бушка живёт на да́че. Я ча́сто пишу́ пи́сьма. Я пишу́ о Пеки́не, об уро́ке и об университе́те."
        rubric: ["用对 [жить]{.ru} 的变位：[живу́, живёт, живу́т]{.ru}", "处所用 [в]{.ru} / [на]{.ru} + 第六格", "至少用一次 [писа́ть]{.ru}", 只用学过的词和语法]
        notes: 范文先介绍自己（[Меня́ зову́т…]{.ru}），然后按“我—父母—其他家人”的顺序说各人住在哪里，每句都换一个主语，练习 [жить]{.ru} 的不同人称；最后用 [писа́ть о]{.ru} + 第六格收尾，复习第 13 课。[не в Пеки́не, а в Шанха́е]{.ru} 用了第 13 课的 [не …, а …]{.ru}。
