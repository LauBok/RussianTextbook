lesson: B3-L60
heading: 结业测试
intro: 答对 80% 以上就可以进入第四册。本测试覆盖第三册六个单元的全部语法，最后是一道 200 词的议论写作。没有达到 80% 的，按出错的题回到相应单元复习后重做：第 1 题对应第一单元（形动词与被动结构，第 1–9 课），第 2 题对应第二单元（副动词与无主语句，第 11–19 课），第 3 题对应第三单元（构词与变格，第 21–29 课），第 4 题对应第四单元（句法，第 31–39 课），第 5 题对应第五单元（语体，第 41–49 课），第 6 题对应第六单元（第 51–59 课）；第 7 题和第 10 题是综合题，解析里注明了每个小题对应的课；第 8 题回看第 6、13、57 课，第 9 题回看第 51、54、58 课。
grammar: "形动词的构成与用法、短尾被动形动词、被动结构；副动词、变成前置词的副动词、无人称句、不定人称句与泛指人称句、否定与体、假定式；构词后缀、外来词与姓氏的变格、动词前缀的非运动意义、近义词；实义切分、插入语、关联词、各类复合句、间接引语；五种语体与书信、礼节用语；复合前置词、数词与形容词连用、否定第二格、[по]{.ru} 的三种支配、只有复数的名词、时间的书面表达、名词化、古旧形式。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式。（第一单元）
    why: "第 1 题学生自己在学，与谓语同时，用主动形动词现在时，与 [студенты]{.ru} 一致：复数第一格 [изучающие]{.ru}；[изучаемые]{.ru} 是被动的，“被学习的”（第 1、3 课）。第 2 题科学家发现了定律，是主动；动作在过去已完成，用主动形动词过去时 [открывший]{.ru}，与阳性第一格 [учёный]{.ru} 一致；[открытый]{.ru} 是被动的（第 2 课）。第 3 题定律是“被发现的”，用被动形动词过去时 [открытый]{.ru}，发出者用第五格 [Менделеевым]{.ru}（第 4 课）。第 4 题作谓语用短尾，与阴性主语 [картина]{.ru} 一致：[написана]{.ru}；长尾 [написанная]{.ru} 不能直接作谓语（第 5 课）。第 5 题同理，[галерея]{.ru} 阴性：[основана]{.ru}（第 5 课）。第 6 题 [один из]{.ru} 后面的形动词跟复数第二格 [учёных]{.ru} 一致：[получивших]{.ru}，不跟 [одним]{.ru} 一致（第 7 课）。第 7 题 [ведущая балерина]{.ru} 是形容词化的形动词，意思是“领衔的”；在 [была]{.ru} 后面用第五格 [ведущей]{.ru}（第 8 课）。第 8 题“造了三年”是持续的过程，用未完成体 [-ся]{.ru} 动词 [строился]{.ru}；完成体的 [был построен]{.ru} 表示结果，不能和“三年”这样的持续时间连用（第 9 课）。"
    items:
      - stem: Студенты, ___ русский язык, обязательно читают Пушкина.
        options: [изучающие, изучаемые, изучающих]
        answer: изучающие
      - stem: Учёный, ___ этот закон, жил в XIX веке.
        options: [открывший, открытый, открытого]
        answer: открывший
      - stem: Закон, ___ Менделеевым, знает каждый школьник.
        options: [открытый, открывший, открывающий]
        answer: открытый
      - stem: Эта картина была ___ в 1879 году.
        options: [написана, написанная, написан]
        answer: написана
      - stem: Галерея ___ Третьяковым в 1856 году.
        options: [основана, основан, основанная]
        answer: основана
      - stem: Павлов был одним из учёных, ___ премию.
        options: [получивших, получившим, получивший]
        answer: получивших
      - stem: Много лет Уланова была ___ балериной Большого театра.
        options: [ведущей, ведущая, ведущую]
        answer: ведущей
      - stem: Корабль ___ три года.
        options: [строился, был построен, построили]
        answer: строился

  - id: e2
    type: choice
    task: 选择正确的形式。（第二单元）
    why: "第 1 题散步和看山同时进行，主语都是 [мы]{.ru}，用未完成体副动词 [Гуляя]{.ru}；[Гуляющие]{.ru} 是形动词，要说明名词，这里没有名词可说明（第 11 课）。第 2 题“回到家以后马上打电话”，先发生的动作用完成体副动词 [Вернувшись]{.ru}；[Возвращаясь]{.ru} 表示“在回家的路上”，和 [сразу]{.ru} 矛盾（第 12、13 课）。第 3 题天气好是好的原因，用 [благодаря]{.ru} + 第三格；[из-за]{.ru} 要求第二格，而且多指不好的原因（第 15 课）。第 4 题“尽管下雨”用 [несмотря на]{.ru} + 第四格；[Несмотря]{.ru} 后面必须有 [на]{.ru}，[Судя]{.ru} 要求 [по]{.ru}（第 15 课）。第 5 题无人称句里人用第三格：[Мне трудно]{.ru}（第 16 课）。第 6 题 [не хватает]{.ru} 是无人称的，永远用单数第三人称（过去时用中性），缺少的东西用第二格；不能和 [интернета]{.ru} 一致成复数（第 16 课）。第 7 题 [не надо]{.ru} 后面用未完成体不定式：[звонить]{.ru}（第 18 课）。第 8 题“没有海滩，没法游”是做不到，[нельзя]{.ru} + 完成体 [искупаться]{.ru}；[нельзя купаться]{.ru} 是“禁止游泳”（第 18 课）。"
    items:
      - stem: ___ по берегу Байкала, мы смотрели на горы.
        options: [Гуляя, Гуляющие, Гулять]
        answer: Гуляя
      - stem: ___ домой, он сразу позвонил матери.
        options: [Вернувшись, Возвращаясь, Вернувшийся]
        answer: Вернувшись
      - stem: ___ хорошей погоде мы увидели вулкан.
        options: [Благодаря, Из-за, Несмотря на]
        answer: Благодаря
      - stem: ___ на дождь, мы пошли гулять.
        options: [Несмотря, Благодаря, Судя]
        answer: Несмотря
      - stem: ___ трудно уснуть в поезде.
        options: [Мне, Я, Меня]
        answer: Мне
      - stem: Пассажирам в поезде не ___ интернета.
        options: [хватает, хватают, хватаем]
        answer: хватает
      - stem: Не надо ___ ему сейчас, он спит.
        options: [звонить, позвонить]
        answer: звонить
      - stem: Здесь нельзя ___ — нет пляжа.
        options: [искупаться, купаться]
        answer: искупаться

  - id: e3
    type: choice
    task: 选择正确的形式。（第三单元）
    why: "第 1 题 [кафе]{.ru} 是以 [-е]{.ru} 结尾的外来词，表示物品，中性，不变格：[новое кафе]{.ru}（第 23 课）。第 2 题 [кофе]{.ru} 是例外，阳性：[горячий кофе]{.ru}（第 23 课）。第 3 题 [-ова]{.ru} 结尾的女姓按形容词变格，第二格 [Ивановой]{.ru}；不能按名词变成 [Ивановы]{.ru}（第 27 课）。第 4 题“翻译”由 [перевод]{.ru} + [-чик]{.ru} 构成，[д]{.ru} 后面写 [-чик]{.ru}：[переводчик]{.ru}；[писатель]{.ru} 是写书的人，[исследователь]{.ru} 是研究者（第 24 课）。第 5 题 [китаец]{.ru} 的阴性是 [китаянка]{.ru}，[девушка]{.ru} 是阴性，不能用阳性的 [китаец]{.ru}；[китайская]{.ru} 是形容词，不能单独指人（第 24、25 课）。第 6 题 [вдруг]{.ru} 说明哭是突然开始的，用前缀 [за-]{.ru} 构成的完成体 [заплакала]{.ru}，表示动作开始；未完成体 [плакала]{.ru} 表示过程，不和 [вдруг]{.ru} 连用（第 28 课）。第 7 题“临行前坐一会儿”，前缀 [по-]{.ru} 表示“一会儿”：[посидели]{.ru}；句子说的是过去，又有 [немного]{.ru}，现在时 [сидят]{.ru} 和不定式都不对（第 28 课）。第 8 题有主题的、正式的长时间交谈用 [беседовать с кем]{.ru}；[сказать]{.ru} 是说出一句话，不和 [долго]{.ru} 连用（第 29 课）。"
    items:
      - stem: Рядом с университетом открылось ___ кафе.
        options: [новое, новый, новая]
        answer: новое
      - stem: Я заказал ___ кофе.
        options: [горячий, горячее, горячую]
        answer: горячий
      - stem: Я получил письмо от Марии ___.
        options: [Ивановой, Ивановы, Иванова]
        answer: Ивановой
      - stem: Человек, который переводит книги, — это ___.
        options: [переводчик, писатель, исследователь]
        answer: переводчик
      - stem: Девушка из Китая — ___.
        options: [китаянка, китаец, китайская]
        answer: китаянка
      - stem: Услышав эту историю, девочка вдруг ___.
        options: [заплакала, плакала, плакать]
        answer: заплакала
      - stem: Перед дорогой мы немного ___.
        options: [посидели, сидят, сидеть]
        answer: посидели
      - stem: Этнографы долго ___ со стариками о приметах.
        options: [беседовали, сказали, рассказали]
        answer: беседовали

  - id: e4
    type: choice
    task: 选择正确的答案。（第四单元）
    why: "第 1 题问的是“发生了什么事”，事件是述位，应放在句末，时间这个已知部分放在句首（第 31 课）。第 2 题“据同时代人说”是插入语，表示消息来源，两边加逗号（第 33 课）。第 3 题 [тот, кто]{.ru} 指人；[кто]{.ru} 后面的动词用单数 [мог]{.ru}，即使主句是复数 [Те]{.ru}；[Те, которые]{.ru} 后面要用复数 [могли]{.ru}（第 37 课）。第 4 题指事物用 [всё, что]{.ru}（第 37 课）。第 5 题主句修饰的是长尾形容词 [длинными]{.ru}，指示词用 [такими]{.ru}，与它同格；[так]{.ru} 修饰副词、动词和短尾形容词（第 36 课）。第 6 题“在……地方”用 [там, где]{.ru}（第 36、37 课）。第 7 题一般疑问句变成间接引语，被问的词放在前面，后面加 [ли]{.ru}：[болен ли]{.ru}；[ли]{.ru} 不能放在句首（第 39 课）。第 8 题命令、号召变成间接引语用 [чтобы]{.ru} + 过去时形式（第 39 课）。"
    items:
      - stem: — Что произошло в 988 году? — ___
        options: [В 988 году Русь приняла христианство., Русь приняла христианство в 988 году.]
        answer: В 988 году Русь приняла христианство.
      - stem: Пётр, ___, был очень высоким.
        options: [по словам современников, по книгам, по улице]
        answer: по словам современников
      - stem: ___ мог стоять у станка, работали на заводах.
        options: ["Те, кто", "Те, которые", "Тот, что"]
        answer: "Те, кто"
      - stem: Люди сжигали всё, ___ могло гореть.
        options: [что, кто, которое]
        answer: что
      - stem: Очереди стали ___ длинными, что люди стояли в них часами.
        options: [такими, так, столько]
        answer: такими
      - stem: Там, ___ раньше были парки, сажали овощи.
        options: [где, куда, откуда]
        answer: где
      - stem: Люди спрашивали, ___ Горбачёв.
        options: [болен ли, ли болен, болен]
        answer: болен ли
      - stem: Он сказал, ___ мы шли к Белому дому.
        options: [чтобы, что, ли]
        answer: чтобы

  - id: e5
    type: choice
    task: 选择正确的形式。（第五单元）
    why: "第 1 题申请书的套语是 [Прошу]{.ru} + 完成体不定式：[принять]{.ru}（第 42 课）。第 2 题 [являться]{.ru} 后面用第五格：[обязательным]{.ru}（第 43 课）。第 3 题“分为”是 [делиться на]{.ru} + 第四格（第 43 课）。第 4 题“由……组成”是 [состоять из]{.ru} + 第二格（第 43 课）。第 5 题事务信件最通用的结尾是 [С уважением]{.ru}；[Обнимаю]{.ru}、[Целую]{.ru} 只用于亲人和好朋友（第 47 课）。第 6 题对好消息表示惊讶、难以相信，用 [Неужели]{.ru}；[разве]{.ru} 表示怀疑，预期否定的回答，和后面的 [Вот здорово!]{.ru} 不配（第 48 课）。第 7 题 [поздравлять кого с чем]{.ru}：[с днём рождения]{.ru}（第 49 课）。第 8 题 [желать кому чего]{.ru}，祝愿的内容用第二格：[здоровья]{.ru}（第 49 课）。"
    items:
      - stem: Прошу ___ меня на работу на должность менеджера.
        options: [принять, принимать, приняли]
        answer: принять
      - stem: Дошкольное образование не является ___.
        options: [обязательным, обязательное, обязательно]
        answer: обязательным
      - stem: Образование делится ___ общее, профессиональное и дополнительное.
        options: [на, в, из]
        answer: на
      - stem: Резюме состоит ___ нескольких разделов.
        options: [из, на, от]
        answer: из
      - stem: "Уважаемый Андрей Петрович! … ___, Анна Петрова"
        options: [С уважением, Обнимаю, Целую]
        answer: С уважением
      - stem: — Мы выиграли! — ___? Вот здорово!
        options: [Неужели, Разве, Ведь]
        answer: Неужели
      - stem: Поздравляю вас ___ днём рождения!
        options: [с, на, в]
        answer: с
      - stem: Желаю вам крепкого ___!
        options: [здоровья, здоровье, здоровьем]
        answer: здоровья

  - id: e6
    type: choice
    task: 选择正确的形式。（第六单元）
    why: "第 1 题后面是表示一段时间的 [нескольких дней]{.ru}，用 [в течение]{.ru}；[во время]{.ru} 后面接事件；[в течении]{.ru} 是名词“水流”的第六格，不是前置词（第 51 课）。第 2 题 [по сравнению с]{.ru} + 第五格（第 51 课）。第 3 题阴性名词前，[две]{.ru} 后面的形容词多用复数第一格：[две долгие недели]{.ru}（第 52 课）。第 4 题阳性名词前，[два]{.ru} 后面的形容词用复数第二格：[два высоких человека]{.ru}；最常见的错误是写成单数（第 52 课）。第 5 题有 [ни одного]{.ru}，宾语必须用第二格：[звука]{.ru}（第 53 课）。第 6 题“一到达就……”是 [по]{.ru} + 第六格 [приезде]{.ru}（第 54 课）。第 7 题 [сутки]{.ru} 只有复数，[несколько]{.ru} 后面用复数第二格 [суток]{.ru}（第 55 课）。第 8 题前面有月份 [в августе]{.ru}，年份用第二格 [года]{.ru}（第 56 课）。"
    items:
      - stem: ___ нескольких дней гусар лежал в комнате смотрителя.
        options: [В течение, Во время, В течении]
        answer: В течение
      - stem: По сравнению ___ прошлым разом всё здесь изменилось.
        options: [с, от, к]
        answer: с
      - stem: Через две ___ недели шинель была готова.
        options: [долгие, долгая, долгой]
        answer: долгие
      - stem: Вдруг перед ним появились два ___ человека с усами.
        options: [высоких, высокий, высокого]
        answer: высоких
      - stem: Герасим никогда в жизни не слышал ни одного ___.
        options: [звука, звук, звуком]
        answer: звука
      - stem: ___ приезде на бал Иван Васильевич сразу увидел Вареньку.
        options: [По, На, С]
        answer: По
      - stem: Палец, может, несколько ___ не будет работать.
        options: [суток, сутки, суткам]
        answer: суток
      - stem: Левитан родился в августе 1860 ___.
        options: [года, году, год]
        answer: года

  - id: e7
    type: fill
    task: 用括号里的词填空，写出正确的形式。
    why: "第 1 题 [вуз]{.ru} 按单词读、以辅音结尾，像普通名词一样变格：[в вузе]{.ru}（第 26 课）。第 2 题 [два-три]{.ru} 后面的形容词用复数第二格：[трудных месяца]{.ru}（第 52 课）。第 3 题 [не было]{.ru} 表示“没有”，名词用第二格 [собаки]{.ru}（第 53 课）。第 4 题前面有季节 [осенью]{.ru}，年份用第二格 [года]{.ru}；写成 [году]{.ru} 是最常见的错误（第 56 课）。第 5 题男姓 [-ов]{.ru} 的第五格是 [-ым]{.ru}：[с Петром Ивановым]{.ru}（第 27 课）。第 6 题“被列维坦画的”，被动形动词过去时与 [картины]{.ru} 一致：复数第一格 [написанные]{.ru}（第 4、6 课）。第 7 题先回到家，再睡不着，用完成体副动词 [Вернувшись]{.ru}（第 12 课）。第 8 题 [в связи с]{.ru} 要求第五格：[болезнью]{.ru}（第 51 课）。"
    items:
      - stem: Мой брат учится в ___.
        hint: вуз
        accept: [вузе]
      - stem: Прошли два-три ___ месяца, и деньги были собраны.
        hint: трудный
        accept: [трудных]
      - stem: В доме не было ни одной ___.
        hint: собака
        accept: [собаки]
      - stem: Осенью 1873 ___ Левитан поступил в училище.
        hint: год
        accept: [года]
      - stem: Вчера я разговаривал с Петром ___.
        hint: Иванов
        accept: [Ивановым]
      - stem: Картины, ___ Левитаном в Плёсе, висят в Третьяковской галерее.
        hint: написать
        accept: [написанные]
      - stem: ___ домой после бала, Иван Васильевич долго не мог уснуть.
        hint: вернуться
        accept: [Вернувшись]
      - stem: В связи с ___ гостя смотрителю пришлось вызвать врача.
        hint: болезнь
        accept: [болезнью]

  - id: e8
    type: rewrite
    task: 把 [который]{.ru} 从句或状语从句改成形动词短语或副动词短语。
    example:
      cue: Студенты, которые изучают русский язык, читают Пушкина.
      answer: Студенты, изучающие русский язык, читают Пушкина.
    why: "[который]{.ru} 是从句的主语时换主动形动词：第 1 题过去完成的动作用 [заполнившие]{.ru}，复数第一格与 [зрители]{.ru} 一致（第 6 课）。[который]{.ru} 是第四格宾语时换被动形动词，从句的主语变成第五格：第 2 题 [написанные Чайковским]{.ru}；第 3 题从句是现在时未完成体，换被动形动词现在时 [уважаемый]{.ru}，与阳性第一格的 [учитель]{.ru} 一致，[все ученики]{.ru} 变成第五格 [всеми учениками]{.ru}（第 3、6 课）。状语从句换副动词时，两个分句的主语必须相同，从句的主语留在主句里：第 4、5 题从句是完成体过去时，用完成体副动词 [Вернувшись]{.ru}、[Увидев]{.ru}；第 5 题原来主句里的代词 [она]{.ru} 要换回名词 [Дуня]{.ru}（第 13 课）。第 6 题原因从句是未完成体，用未完成体副动词，否定词 [не]{.ru} 留在副动词前：[Не умея говорить]{.ru}（第 14 课）。第 7 题与谓语同时的动作用未完成体副动词 [Танцуя]{.ru}（第 57 课）。"
    items:
      - cue: Зрители, которые заполнили огромный зал, затихают.
        accept: ["Зрители, заполнившие огромный зал, затихают."]
      - cue: Балеты, которые написал Чайковский, знают во всём мире.
        accept: ["Балеты, написанные Чайковским, знают во всём мире."]
      - cue: Учитель, которого уважают все ученики, работает в школе тридцать лет.
        accept: ["Учитель, уважаемый всеми учениками, работает в школе тридцать лет."]
      - cue: Когда он вернулся домой, он долго не мог уснуть.
        accept: ["Вернувшись домой, он долго не мог уснуть."]
      - cue: Когда Дуня увидела отца, она упала без чувств.
        accept: ["Увидев отца, Дуня упала без чувств."]
      - cue: Так как Герасим не умел говорить, он объяснил всё знаками.
        accept: ["Не умея говорить, Герасим объяснил всё знаками."]
      - cue: Когда балерина танцует на пуантах, она держит весь свой вес на кончиках пальцев.
        accept: ["Танцуя на пуантах, балерина держит весь свой вес на кончиках пальцев."]

  - id: e9
    type: rewrite
    task: 把动词结构改成名词结构。
    example:
