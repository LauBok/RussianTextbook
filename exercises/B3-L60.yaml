  - id: e11
    type: open
    task: 理解问答。读复习课文，用完整的句子回答问题，连成一段。
    items:
      - prompt: "[Каких героев называют «маленькими людьми»? Почему Самсон Вырин остался один? Что сделал Акакий Акакиевич, чтобы собрать деньги на шинель? Почему Герасим не мог спорить с барыней? Что увидел Иван Васильевич утром после бала? Чем Очумелов похож на других маленьких людей и чем отличается от них?]{.ru}"
        length: 90–130
        model: "«Маленькими людьми» называют простых, бедных героев русской литературы XIX века. Самсон Вырин остался один, потому что гусар Минский увёз его единственную дочь Дуню, а когда старик пришёл к нему в Петербург, Минский выгнал его за дверь. Чтобы собрать деньги на шинель, Акакий Акакиевич в течение нескольких месяцев не пил чаю по вечерам и не зажигал свечи. Герасим не мог спорить с барыней, потому что не умел говорить и был крепостным. Утром после бала Иван Васильевич увидел, как отец Вареньки бьёт по лицу слабого солдата. Очумелов тоже маленький человек, но в отличие от Вырина и Башмачкина он сам обижает слабых: перед сильными он дрожит от страха, а со слабыми ведёт себя грубо."
        rubric: ["六个问题都回答，内容与课文一致", "至少用一个复合前置词（[в течение, в отличие от]{.ru} 等）", "至少一处否定第二格（[не пил чаю, не зажигал свечи]{.ru} 等）"]
        notes: "范文约 110 词，按问题的顺序回答，每个问题一到两句。原因用 [потому что]{.ru} 从句；第三问保留课文里的否定第二格 [не пил чаю, не зажигал свечи]{.ru}；最后一问用 [в отличие от]{.ru} + 第二格作对比，[тоже … но]{.ru} 说明相同和不同之处。"

  - id: e12
    type: open
    task: 议论写作。就下面的问题写一段话，表明看法，说明理由，最后得出结论。
    items:
      - prompt: "[Нужно ли сегодня читать русскую классику XIX века?]{.ru} 可以举本册读过的作品为例。至少用两处形动词短语、两处副动词短语和两个复合前置词（[в течение, в связи с, по сравнению с, в отличие от, в результате]{.ru} 等）。"
        length: 180–220
        model: "Многие считают, что русская классика XIX века сегодня уже не нужна: она написана двести лет назад, когда люди ездили в каретах, а не летали на самолётах. По сравнению с современными книгами и фильмами она кажется длинной и медленной. Однако, по-моему, читать её нужно и сегодня. Во-первых, классика рассказывает не о каретах и шинелях, а о человеке. Чувства героев, живших двести лет назад, понятны и нам: старик, потерявший единственную дочь, страдает так же, как страдал бы любой отец сегодня. Во-вторых, классика учит сочувствию. Читая о Вырине или о Башмачкине, мы начинаем замечать «маленьких людей» рядом с собой. Не случайно слова «Я брат твой», услышанные молодым чиновником в голосе Акакия Акакиевича, знает каждый русский. В-третьих, без классики трудно понять русскую культуру: в течение двух веков художники, композиторы и режиссёры снова и снова обращались к сюжетам Пушкина, Гоголя и Толстого. Например, по «Шинели» Гоголя и по «Станционному смотрителю» Пушкина в разные годы было снято несколько фильмов. Конечно, читать старые книги нелегко, особенно иностранцу. Но, прочитав хотя бы несколько рассказов, понимаешь, что в отличие от многих новых книг, их будут читать и через сто лет. Поэтому я думаю, что классика нужна не только школьникам, но и каждому, кто хочет лучше понять людей и самого себя."
        rubric: ["开头摆出一种常见看法，再明确表明自己的立场", "至少两条理由，有具体作品作例子", "承认反方的道理（让步），再得出结论", "至少两处形动词短语、两处副动词短语、两个复合前置词，形式正确", "180–220 词"]
        notes: "范文约 200 词，结构与第六单元的议论段落相同：先用 [Многие считают, что…]{.ru} 引出反方看法，再用 [Однако, по-моему, …]{.ru} 表明立场；三条理由用插入语 [во-первых, во-вторых, в-третьих]{.ru} 排列（第 33 课），每条都有作品作例子；结尾前用 [Конечно, … Но …]{.ru} 让步，最后用 [Поэтому я думаю, что…]{.ru} 收束。形动词短语：[героев, живших двести лет назад]{.ru}、[старик, потерявший единственную дочь]{.ru}、[слова, услышанные молодым чиновником]{.ru}；副动词短语：[Читая о Вырине]{.ru}、[прочитав хотя бы несколько рассказов]{.ru}；复合前置词：[по сравнению с]{.ru}、[в течение]{.ru}、[в отличие от]{.ru}。[понимаешь]{.ru} 是泛指人称句（第 17 课），[страдал бы]{.ru} 是假定式（第 19 课），[кто хочет]{.ru} 的关联词用法见第 37 课。"
