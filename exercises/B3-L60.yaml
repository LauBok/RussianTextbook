      answer: Выход фильма в 1925 году стал событием мирового значения.
    why: "名词化时，动词变成名词，原来的主语变成第二格：第 1 题 [СССР распался → распад СССР]{.ru}（[СССР]{.ru} 不变格），第 2 题 [появилось звуковое кино → появление звукового кино]{.ru}；从句的连接词变成前置词：[после того как → после]{.ru}，[до того как → до]{.ru}（第 58 课）。第 3、4 题用第 54 课的 [по]{.ru} + 第六格：[по окончании танца]{.ru}、[по возвращении домой]{.ru}，也可以用 [после]{.ru} + 第二格。第 5 题原因从句换成 [в связи с]{.ru} + 第五格（第 51 课），也可以用 [из-за]{.ru} + 第二格。第 6 题副词 [постепенно]{.ru} 变成形容词 [постепенное]{.ru}，宾语 [отрасль]{.ru} 变成第二格，句子需要一个新的谓语，如 [произошло]{.ru} 或 [началось]{.ru}（第 58 课）。"
    items:
      - cue: После того как СССР распался в 1991 году, киноиндустрия пережила трудное время.
        accept: ["После распада СССР в 1991 году киноиндустрия пережила трудное время."]
      - cue: До того как появилось звуковое кино, в зале играл тапёр.
