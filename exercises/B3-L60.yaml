      - cue: Когда он вернулся домой, он не мог уснуть.
        accept: ["По возвращении домой он не мог уснуть.", "После возвращения домой он не мог уснуть."]
      - cue: Так как гость заболел, смотрителю пришлось вызвать врача.
        accept: ["В связи с болезнью гостя смотрителю пришлось вызвать врача.", "Из-за болезни гостя смотрителю пришлось вызвать врача."]
      - cue: В 2000-е годы отрасль постепенно восстановили.
        accept: ["В 2000-е годы произошло постепенное восстановление отрасли.", "В 2000-е годы началось постепенное восстановление отрасли."]

  - id: e10
