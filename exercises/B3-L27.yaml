lesson: B3-L27
grammar: "姓氏变格：[-ов, -ин]{.ru} 男性第五格 [-ым]{.ru}，女性和复数按形容词；[-ский]{.ru} 按形容词；辅音结尾的外来姓男变女不变；[-ых, -их, -ко]{.ru} 不变格。地名：[-ов, -ин]{.ru} 城市第五格 [-ом]{.ru}；[-ово, -ино]{.ru} 按规范变格。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[От чего образованы фамилии Иванов, Кузнецов и Смирнов? Какие фамилии часто образованы от названий мест? Когда фамилии получили почти все русские крестьяне? Какую фамилию может взять женщина, выходя замуж? Чем отличается склонение фамилии Пушкин от склонения названия города Пушкин?]{.ru}"
        length: 60–90
        model: "Фамилия Иванов образована от имени отца и когда-то означала «сын Ивана». Кузнецов — от названия профессии «кузнец», а Смирнов, вероятно, от прозвища смирного человека. От названий мест часто образованы фамилии на -ский и -цкий, например Вяземский от Вязьмы. Почти все крестьяне получили фамилии только в XIX веке, особенно после отмены крепостного права в 1861 году. Выходя замуж, женщина обычно берёт фамилию мужа, но может сохранить свою или взять двойную. Фамилия Пушкин в творительном падеже имеет окончание -ым: «с Пушкиным», а название города — окончание -ом: «под Пушкином»."
        rubric: ["五个问题都回答，内容与课文一致", "[с Пушкиным]{.ru} 与 [под Пушкином]{.ru} 写对", "[образована от чего]{.ru} 支配正确"]
        notes: 第 1 题三个姓的来源各不相同：父名、职业、绰号。第 5 题是本课语法的核心，最好举例说明。

  - id: e2
    type: fill
    task: 用括号里姓氏或地名的正确形式填空。
    why: "第 1 题 [с]{.ru} + 第五格，男性 [-ов]{.ru} 姓第五格用形容词词尾：[Ивановым]{.ru}。第 2 题女性姓，[у]{.ru} + 第二格：[Петровой]{.ru}。第 3 题复数（一家人），[у]{.ru} + 第二格：[Смирновых]{.ru}。第 4 题城市名第五格像名词：[под Пушкином]{.ru}。第 5 题 [-ский]{.ru} 姓按形容词变格，第二格 [Чайковского]{.ru}。第 6 题 [-ко]{.ru} 姓不变格：[Шевченко]{.ru}。第 7 题 [-ово]{.ru} 地名按规范变格，第六格 [в Иванове]{.ru}。第 8 题女性的辅音结尾外来姓不变格：[Шмидт]{.ru}。"
    items:
      - stem: Вчера я долго разговаривал с ___.
        hint: Иванов
        accept: ["Ивановым"]
      - stem: Я взял эту книгу у Марины ___.
        hint: Петрова
        accept: ["Петровой"]
      - stem: В субботу мы были в гостях у ___.
        hint: Смирновы
        accept: ["Смирновых"]
      - stem: Летом мы жили на даче под ___.
        hint: Пушкин (город)
        accept: ["Пушкином"]
      - stem: Вечером мы слушали музыку ___.
        hint: Чайковский
        accept: ["Чайковского"]
      - stem: Студенты читали стихи Тараса ___.
        hint: Шевченко
        accept: ["Шевченко"]
      - stem: Моя бабушка родилась в ___.
        hint: Иваново
        accept: ["Иванове"]
      - stem: Я написал письмо Анне ___.
        hint: Шмидт
        accept: ["Шмидт"]

  - id: e3
    type: choice
    task: 辨析：人名还是地名？选择正确的形式。
    why: "同样结尾的姓和城市名，第五格不同：人用 [-ым]{.ru}，城市用 [-ом]{.ru}。第 1 题 [гордиться]{.ru} 的对象是诗人：[Пушкиным]{.ru}。第 2 题 [под]{.ru} 后是城市：[Королёвом]{.ru}。第 3 题 [знакомы с]{.ru} 后是人：[Гагариным]{.ru}。第 4 题 [за]{.ru} + 城市：[за Гагарином]{.ru}。"
    items:
      - stem: Все русские гордятся ___.
        options: [Пушкином, Пушкиным, Пушкине]
        answer: Пушкиным
      - stem: Наша дача находится под ___.
        options: [Королёвом, Королёвым, Королёве]
        answer: Королёвом
      - stem: Мой дедушка был знаком с Юрием ___.
        options: [Гагарином, Гагариным, Гагарине]
        answer: Гагариным
      - stem: Сразу за ___ начинается лес.
        options: [Гагарином, Гагариным, Гагарина]
        answer: Гагарином

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [-ых]{.ru} 姓不变格：[с Иваном Черных]{.ru}。第 2 题男性的辅音结尾外来姓像名词一样变格：[с Виктором Шмидтом]{.ru}。第 3 题女性 [-ова]{.ru} 姓第四格 [-у]{.ru}：[Иванову]{.ru}。第 4 题复数第五格 [-ыми]{.ru}：[с Петровыми]{.ru}。"
    items:
      - stem: Я давно знаком с Иваном ___.
        options: [Черных, Черныхом, Черныхе]
        answer: Черных
      - stem: Мы встретились с Виктором ___.
        options: [Шмидт, Шмидтом, Шмидтым]
        answer: Шмидтом
      - stem: Я хорошо знаю Марину ___.
        options: [Иванова, Иванову, Ивановой]
        answer: Иванову
      - stem: Мы ездили на дачу с ___.
        options: [Петровами, Петровыми, Петровых]
        answer: Петровыми

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 许多姓是由父亲的名字构成的。
        accept: ["Многие фамилии образованы от имени отца.", "Многие фамилии были образованы от имени отца.", "Многие фамилии образовались от имени отца.", "Многие фамилии произошли от имени отца."]
        rubric: ["[образованы от чего]{.ru}：短尾被动形动词复数", "或 [произойти от чего]{.ru}"]
      - zh: 我们星期天在彼得罗夫家做客。
        accept: ["В воскресенье мы были в гостях у Петровых.", "Мы были в гостях у Петровых в воскресенье.", "В воскресенье мы были у Петровых в гостях."]
        rubric: ["[у Петровых]{.ru}：复数第二格，形容词词尾"]
      - zh: 去年夏天我们在博罗季诺附近散步。
        accept: ["Прошлым летом мы гуляли под Бородином.", "Прошлым летом мы гуляли около Бородина.", "Прошлым летом мы гуляли недалеко от Бородина.", "Летом прошлого года мы гуляли под Бородином."]
        rubric: ["[под Бородином]{.ru}（第五格）或 [около Бородина]{.ru}（第二格）：[-ино]{.ru} 地名按规范变格", "[прошлым летом]{.ru}：第五格表示时间"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[Фамилия может многое рассказать о предках.]{.ru} 用三四个俄罗斯姓（可以加上你自己的中国姓作比较）说明姓的来源，至少用三个姓的间接格形式。"
        length: 140–160
        model: "Фамилия может многое рассказать о предках. Возьмём, например, мою подругу Анну Кузнецову. Её фамилия образована от слова «кузнец», значит, кто-то из её предков был кузнецом. У Анны есть друг Михаил Иванов. Его фамилия произошла от имени Иван: когда-то так называли сына Ивана. А с Сергеем Вяземским, моим преподавателем, связана совсем другая история. Фамилии на -ский часто образованы от названий мест, поэтому предки Вяземского, наверное, жили в Вязьме или владели землёй рядом с ней. Интересно сравнить русские фамилии с китайскими. Китайские фамилии гораздо старше, и у многих из них тоже есть своя история: одни связаны с названиями древних государств, другие с профессиями. Но в Китае фамилий намного меньше, поэтому людей с одинаковой фамилией встречаешь постоянно. Узнав, что означает фамилия, мы как будто знакомимся с людьми, которые жили сто или двести лет назад."
        rubric: ["第一句是给定的主题句", "至少三个姓，来源说明正确（父名、职业、地名、绰号）", "至少三处姓的间接格（[Кузнецову, с Сергеем Вяземским, предки Вяземского]{.ru} 等），变格正确", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 三个例子，分别代表职业、父名、地名三种来源 → 与汉语姓氏比较 → 收束句。注意范文里的间接格：[Анну Кузнецову]{.ru}（第四格）、[с Сергеем Вяземским]{.ru}（第五格，形容词变格）、[предки Вяземского]{.ru}（第二格）。
