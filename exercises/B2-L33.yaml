lesson: B2-L33
grammar: "辅音交替：第二变位动词只在第一人称单数交替（[ви́жу, прошу́, плачу́, чи́щу, люблю́, куплю́, гото́влю, кормлю́]{.ru}）；第一变位动词所有人称都交替（[пишу́ — пи́шешь, машу́ — ма́шешь, пла́чу — пла́чешь]{.ru}）；[-чь]{.ru} 动词 [мочь, печь]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里动词第一人称单数（[я]{.ru}）的形式。
    why: "第二变位动词只有 [я]{.ru} 的形式交替：[д → ж]{.ru}（[ви́жу, сижу́]{.ru}），[с → ш]{.ru}（[прошу́]{.ru}），[т → ч]{.ru}（[плачу́]{.ru}），[ст → щ]{.ru}（[чи́щу]{.ru}）；唇音后加 [л]{.ru}：[люблю́, куплю́, гото́влю, кормлю́]{.ru}。最常见的错误是忘了加 [л]{.ru}，写成 [любю́]{.ru}、[купю́]{.ru}。"
    items:
      - stem: Я тебя́ ___!
        hint: ви́деть
        accept: ["ви́жу"]
      - stem: Я ___ в кафе́ у окна́.
        hint: сиде́ть
        accept: ["сижу́"]
      - stem: Я о́чень ___ Ночь музе́ев.
        hint: люби́ть
        accept: ["люблю́"]
      - stem: Сего́дня я ___ за ко́фе.
        hint: плати́ть
        accept: ["плачу́"]
      - stem: Я ___ биле́ты в теа́тр.
        hint: купи́ть
        accept: ["куплю́"]
      - stem: Ве́чером я ___ у́жин для всех.
        hint: гото́вить
        accept: ["гото́влю"]
      - stem: Ка́ждое у́тро я ___ Му́рку.
        hint: корми́ть
        accept: ["кормлю́"]
      - stem: Я ___ тебя́ помо́чь мне.
        hint: проси́ть
        accept: ["прошу́"]
      - stem: Я ___ боти́нки ка́ждый ве́чер.
        hint: чи́стить
        accept: ["чи́щу"]

  - id: e2
    type: fill
    task: 用括号里动词的现在时填空（注意人称）。
    why: "第 1、3 题是第二变位动词，[ты]{.ru}、[они́]{.ru} 不交替：[ви́дишь]{.ru}，[лю́бят]{.ru}；第 3 题还要注意重音前移：[люблю́ — лю́бят]{.ru}。第 2、4 题是第一变位动词，所有人称都交替：[пи́шет]{.ru}，[ма́шут]{.ru}。第 5 题 [мочь]{.ru}：[ты]{.ru} 用 [ж]{.ru}，[они́]{.ru} 保留 [г]{.ru}：[мо́гут]{.ru}。第 6 题 [печь]{.ru}：[она́]{.ru} 用 [ч]{.ru}，[печёт]{.ru}。"
    items:
      - stem: Ты ___ афи́шу на стене́?
        hint: ви́деть
        accept: ["ви́дишь"]
      - stem: А́нна ___ сообще́ние Ю́ми.
        hint: писа́ть
        accept: ["пи́шет"]
      - stem: Ди́ма и Ю́ми то́же ___ музе́и.
        hint: люби́ть
        accept: ["лю́бят"]
      - stem: Смотри́, они́ ___ нам руко́й!
        hint: маха́ть
        accept: ["ма́шут"]
      - stem: Студе́нты не ___ пойти́ в музе́й днём.
        hint: мочь
        accept: ["мо́гут"]
      - stem: Ба́бушка ___ пироги́ ка́ждое воскресе́нье.
        hint: печь
        accept: ["печёт"]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题“我请客”用 [плати́ть]{.ru}，[плачу́]{.ru} 重音在词尾；[пла́чу]{.ru} 是 [пла́кать]{.ru}“哭”。第 2 题问“出了什么事”，是“哭”，[пла́кать]{.ru} 是第一变位，[ты]{.ru} 也交替：[пла́чешь]{.ru}；[пла́тишь]{.ru} 是“付钱”。第 3 题主语是 [ты]{.ru}，[ходи́ть]{.ru} 只有 [я]{.ru} 交替，[ты]{.ru} 是 [хо́дишь]{.ru}，重音前移。第 4 题主语是 [я]{.ru}，[спать]{.ru} 第一人称加 [л]{.ru}：[сплю]{.ru}。"
    items:
      - stem: — Ко́фе сего́дня за мной! Я ___.
        options: [плачу́, пла́чу]
        answer: плачу́
      - stem: Почему́ ты ___? Что случи́лось?
        options: [пла́чешь, пла́тишь]
        answer: пла́чешь
      - stem: Ты ча́сто ___ в музе́и?
        options: [хо́дишь, хожу́]
        answer: хо́дишь
      - stem: В суббо́ту я ___ до десяти́ часо́в.
        options: [сплю, спишь]
        answer: сплю

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题 [ви́деть → ви́жу]{.ru}，[маха́ть → машу́]{.ru}，挥动的东西用第五格。第 2 题 [купи́ть → куплю́]{.ru}，完成体将来时。第 3 题 [посла́ть → пошлю́]{.ru}。第 4 题 [люби́ть → люблю́]{.ru}，后接未完成体不定式。"
    items:
      - zh: 我看见你了！我在向你挥手！
        accept: ["Я тебя́ ви́жу! Я машу́ тебе́ руко́й!", "Я ви́жу тебя́! Я машу́ тебе́ руко́й!", "Я вас ви́жу! Я машу́ вам руко́й!", "Я ви́жу вас! Я машу́ вам руко́й!"]
        rubric: ["[ви́жу]{.ru}、[машу́]{.ru} 的交替", "[маха́ть кому́ руко́й]{.ru}：人用第三格，手用第五格"]
      - zh: 我来买票。
        accept: ["Я куплю́ биле́ты.", "Биле́ты куплю́ я.", "Я куплю́ биле́т."]
        rubric: ["[купи́ть → куплю́]{.ru}，加 [л]{.ru}"]
      - zh: 我把链接发给你。
        accept: ["Я пошлю́ тебе́ ссы́лку.", "Я тебе́ пошлю́ ссы́лку.", "Я пошлю́ вам ссы́лку.", "Я вам пошлю́ ссы́лку."]
        rubric: ["[посла́ть → пошлю́]{.ru}", "[тебе́]{.ru} 用第三格，[ссы́лку]{.ru} 用第四格"]
      - zh: 我很喜欢逛博物馆。
        accept: ["Я о́чень люблю́ ходи́ть в музе́и.", "Я о́чень люблю́ ходи́ть по музе́ям."]
        rubric: ["[люби́ть → люблю́]{.ru}", "后接不定向动词 [ходи́ть]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й экза́мен был у Ван Лэ́я во вто́рник? О чём он писа́л сочине́ние? Где была́ А́нна, когда́ он ей позвони́л? Каку́ю афи́шу они́ уви́дели? Что они́ реши́ли де́лать пятна́дцатого ма́я?]{.ru}"
        length: 50–80
        model: "Во вто́рник у Ван Лэ́я был пи́сьменный экза́мен по ру́сскому языку́. Он писа́л сочине́ние «Мой люби́мый го́род» о Москве́. По́сле экза́мена он позвони́л А́нне. Она́ сиде́ла в кафе́ напро́тив факульте́та, и Ван Лэй уви́дел её в окно́. В кафе́ они́ уви́дели афи́шу «Ночь музе́ев». Пятна́дцатого ма́я они́ реши́ли пойти́ в музе́и. А́нна пошлёт ему́ ссы́лку на програ́мму."
        rubric: ["回答全部五个问题", "带交替的形式写对（[пошлёт]{.ru}）", "过去时与将来时的体用对"]
        notes: 范文约 60 词。对话改成叙述时人称变了，动词形式也要跟着变：[пошлю́]{.ru} → [пошлёт]{.ru}；[Я тебя́ ви́жу]{.ru} 改成过去时 [уви́дел её]{.ru}。

  - id: e6
    type: open
    task: 作文。题目：“我喜欢的博物馆”。
    items:
      - prompt: 写一个你喜欢的博物馆：在哪儿、你常不常去、在那儿看到什么、喜欢什么、下次打算做什么。至少用五个带辅音交替的动词形式（如 [люблю́, хожу́, ви́жу, сижу́, куплю́, прошу́, пишу́]{.ru}）。
        length: 100–150
        model: |
          Я о́чень люблю́ Третьяко́вскую галере́ю. Я хожу́ туда́ ча́сто, почти́ ка́ждый ме́сяц. Обы́чно я покупа́ю биле́т в пя́тницу ве́чером, когда́ там ма́ло люде́й. В за́лах ти́хо, и я до́лго сижу́ пе́ред карти́ной, кото́рая мне нра́вится. Иногда́ я пишу́ в тетра́дь, что я ви́жу на карти́не, и учу́ но́вые слова́. Бо́льше всего́ я люблю́ пейза́жи: лес, ре́ку, зи́му. Когда́ я смотрю́ на них, я ви́жу Росси́ю, кото́рая мне ещё не знако́ма. Мой друг говори́т, что пейза́жи — э́то ску́чно, но я так не ду́маю. В ма́е я пойду́ туда́ в Ночь музе́ев. Я куплю́ друзья́м ко́фе и попрошу́ их пойти́ со мной. Наде́юсь, им то́же понра́вится.
        rubric: ["至少五个带交替的形式，写对（[люблю́, хожу́, сижу́, пишу́, ви́жу, куплю́, попрошу́]{.ru}）", "交替只在第一人称单数的动词，其他人称不要误加交替", "内容完整：在哪儿、常去不常去、看什么、打算"]
        notes: 范文约 105 词，从“常去”写到“在那儿做什么”，再写到下一次的打算。现在时说经常的事，[пойду́, куплю́, попрошу́]{.ru} 用完成体将来时说五月那一次。
