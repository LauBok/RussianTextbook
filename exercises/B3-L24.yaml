lesson: B3-L24
grammar: "人称名词后缀：[-тель]{.ru}（动词 → 做……的人），[-ист]{.ru}（职业、专业），[-чик / -щик]{.ru}（[д, т, з, с, ж]{.ru} 后写 [-чик]{.ru}），[-ец]{.ru}（变格时 [е]{.ru} 脱落）；阴性形式 [-ниц-а, -к-а, -иц-а]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Чем пословица отличается от поговорки? Что значит пословица «Не боги горшки обжигают»? Кем был Владимир Даль и что он сделал? Почему пословицы трудно переводить? Как пословицы живут сегодня?]{.ru}"
        length: 70–100
        model: "Пословица — это законченное суждение, в ней обычно есть совет или вывод. Поговорка только образно называет ситуацию и ничему не учит. Пословица «Не боги горшки обжигают» значит, что любое дело можно освоить, если учиться. Владимир Даль был морским офицером, врачом и писателем. Он стал самым известным собирателем пословиц: в его книге «Пословицы русского народа» больше тридцати тысяч пословиц и поговорок. Перевести пословицу трудно, потому что перевод слово в слово звучит странно. Переводчик должен найти в своём языке пословицу с тем же смыслом. Сегодня журналисты начинают статьи с пословиц, а молодые люди придумывают новые."
        rubric: ["五个问题都回答，内容与课文一致", "[отличаться от чего]{.ru} 支配正确", "至少用两个本课的人称名词（[собиратель]{.ru}、[переводчик]{.ru}、[журналист]{.ru} 等）"]
        notes: 第 3 题注意 [быть]{.ru} 过去时后表语用第五格：[был морским офицером, врачом и писателем]{.ru}；[стать]{.ru} 同样：[стал собирателем]{.ru}。

  - id: e2
    type: fill
    task: 由括号里的词构成表示人的名词，用正确的格填空。
    why: "第 1 题 [собирать]{.ru} 去掉 [-ть]{.ru} 加 [-тель]{.ru}：[собиратель]{.ru}，[быть]{.ru} 过去时后用第五格 [собирателем]{.ru}。第 2 题 [исследовать]{.ru} 保留 [-ова-]{.ru}：[исследователь]{.ru}，复数第一格 [исследователи]{.ru}。第 3 题 [перевод]{.ru} 以 [д]{.ru} 结尾，后缀写 [-чик]{.ru}：[переводчик]{.ru}，[для]{.ru} 后第二格 [переводчика]{.ru}。第 4 题 [камень]{.ru} 以 [н]{.ru} 结尾，写 [-щик]{.ru}：[каменщики]{.ru}。第 5 题形容词 [мудрый]{.ru} 去掉词尾加 [-ец]{.ru}：[мудрец]{.ru}，复数 [мудрецы]{.ru}（这个词的 [е]{.ru} 不脱落）。第 6 题 [журнал → журналист]{.ru}，复数第一格 [журналисты]{.ru}。"
    items:
      - stem: Даль был самым известным ___ пословиц.
        hint: собирать
        accept: ["собирателем"]
      - stem: ___ до сих пор изучают словарь Даля.
        hint: исследовать
        accept: ["Исследователи"]
      - stem: Пословицы — большая трудность для ___.
        hint: перевод
        accept: ["переводчика"]
      - stem: Этот дом строили лучшие ___ города.
        hint: камень
        accept: ["каменщики"]
      - stem: Пословицы создавали не ___, а простые люди.
        hint: мудрый
        accept: ["мудрецы"]
      - stem: ___ любят начинать статьи с пословиц.
        hint: журнал
        accept: ["Журналисты"]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [о]{.ru} 要求第六格：[о бедном сапожнике]{.ru}，和后面的 [о богатом купце]{.ru} 一样；注意 [купец]{.ru} 变格时 [е]{.ru} 脱落。第 2 题形容词 [молодая]{.ru} 是阴性，名词要用阴性形式 [продавщица]{.ru}；注意不是 [-ица]{.ru}，而是 [-щица]{.ru}。第 3 题 [певец]{.ru} 复数 [певцы]{.ru}，[е]{.ru} 脱落，重音移到词尾。第 4 题 [специалист]{.ru} 变格重音不移，第五格 [специалистом]{.ru}。第 5 题 [китаец]{.ru} 变格时 [е]{.ru} 脱落后写 [й]{.ru}：[китайцы]{.ru}。"
    items:
      - stem: В пословице говорится о бедном ___ и богатом купце.
        options: [сапожнике, сапожнику, сапожником]
        answer: сапожнике
      - stem: В магазине нам помогла молодая ___.
        options: [продавец, продавщица, продавца]
        answer: продавщица
      - stem: На концерте пели известные ___.
        options: [певецы, певцы, певца]
        answer: певцы
      - stem: Брат хочет стать ___ по русскому языку.
        options: [специалист, специалиста, специалистом]
        answer: специалистом
      - stem: Многие ___ изучают русский язык.
        options: [китаецы, китайцы, китайца]
        answer: китайцы

  - id: e4
    type: rewrite
    task: 用带后缀的人称名词改写，把 [который]{.ru} 从句或 [человек, который…]{.ru} 换成一个名词。
    example:
      cue: Даль — человек, который собирал пословицы.
      answer: Даль — собиратель пословиц.
    why: "动词的宾语变成名词后面的第二格：[собирал пословицы → собиратель пословиц]{.ru}。第 1 题 [любить музыку → любитель музыки]{.ru}。第 2 题 [водить автобус → водитель автобуса]{.ru}。第 3 题 [исследовать язык → исследователь языка]{.ru}。第 4 题 [читать журнал → читатель журнала]{.ru}，主语是复数，名词也用复数 [читатели]{.ru}。"
    items:
      - cue: Мой отец — человек, который любит музыку.
        accept: ["Мой отец — любитель музыки."]
      - cue: Он человек, который водит автобус.
        accept: ["Он водитель автобуса."]
      - cue: Он человек, который исследует русский язык.
        accept: ["Он исследователь русского языка."]
      - cue: Люди, которые читают этот журнал, часто пишут нам письма.
        accept: ["Читатели этого журнала часто пишут нам письма."]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 谚语表达人民的智慧，俗语只是形象地说出某种情况。
        accept: ["В пословице выражена народная мудрость, а поговорка только образно называет ситуацию.", "В пословице выражена народная мудрость, а поговорка только ярко называет ситуацию.", "Пословица выражает народную мудрость, а поговорка только образно называет ситуацию.", "Пословица выражает народную мудрость, а поговорка только ярко называет ситуацию.", "Пословица выражает мудрость народа, а поговорка только образно называет ситуацию.", "В пословице выражена мудрость народа, а поговорка только образно называет ситуацию.", "В пословицах выражена народная мудрость, а поговорки только образно называют ситуацию.", "Пословица выражает народную мудрость, а поговорка просто образно называет ситуацию.", "Пословица выражает народную мудрость, а поговорка только образно описывает ситуацию."]
        rubric: ["[выражена]{.ru} 短尾被动形动词与 [мудрость]{.ru} 一致，或用 [выражать]{.ru} + 第四格", "转折连词 [а]{.ru}"]
      - zh: 好的译者会在自己的语言里找意思相同的谚语。
        accept: ["Хороший переводчик ищет в своём языке пословицу с тем же смыслом.", "Хороший переводчик ищет в родном языке пословицу с тем же смыслом.", "Хороший переводчик будет искать в своём языке пословицу с тем же смыслом.", "Хороший переводчик ищет в своём языке пословицу с таким же смыслом.", "Хороший переводчик ищет в своём языке пословицу, которая имеет тот же смысл.", "Хороший переводчик ищет в своём языке пословицу с тем же значением.", "Хороший переводчик ищет пословицу с тем же смыслом в своём языке.", "Хороший переводчик ищет в родном языке пословицу с таким же смыслом."]
        rubric: ["[переводчик]{.ru}（[д]{.ru} 后写 [-чик]{.ru}）", "[с тем же смыслом]{.ru}：[с]{.ru} + 第五格"]
      - zh: 达里是最著名的谚语收集者。
        accept: ["Даль был самым известным собирателем пословиц.", "Даль — самый известный собиратель пословиц.", "Самым известным собирателем пословиц был Даль.", "Самый известный собиратель пословиц — Даль."]
        rubric: ["[собиратель пословиц]{.ru}：[-тель]{.ru} 名词 + 第二格", "[был]{.ru} 后用第五格"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[В русских пословицах много говорится о труде.]{.ru} 至少引用三条谚语或俗语（可以用课文里的，也可以用你知道的），说明意思和使用场合；至少用三个本课的人称名词。"
        length: 140–160
        model: "В русских пословицах много говорится о труде. Самая известная из них — «Без труда не вытащишь и рыбку из пруда». Её говорят ученику, который не хочет заниматься, и любому работнику, который хочет получить результат без труда. Пословица «Дело мастера боится» говорит о хорошем специалисте: настоящий мастер сделает любую работу. А пословица «Не боги горшки обжигают» помогает тем, кто боится нового дела. Каменщик, водитель или переводчик не родились мастерами, они научились. Есть и поговорка о плохом работнике: про него говорят, что он «работает спустя рукава». Интересно, что даже о мастерах народ шутит: «Сапожник без сапог». Так говорят о специалисте, который всё делает для других и ничего для себя. Собиратели пословиц записали тысячи таких выражений: в книге Даля их больше тридцати тысяч. Многие из них говорят о том, что настоящий работник уважает своё дело и не боится трудностей. Всё это показывает, что труд для русского народа всегда был очень важен."
        rubric: ["第一句是给定的主题句", "至少三条谚语或俗语，释义准确", "至少三个本课人称名词（[работник, специалист, каменщик, переводчик, собиратель]{.ru} 等），变格正确", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 三条正面谚语（各配一个使用场合）→ 一条反面俗语 → 一条玩笑式俗语 → 收束句。引用谚语时用书名号 [«…»]{.ru}，后面用 [значит]{.ru}、[так говорят о…]{.ru}、[её говорят кому]{.ru} 解释。
