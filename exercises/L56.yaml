lesson: L56
grammar: "形容词第三格 [-ому / -ему]{.ru}（阳性、中性）、[-ой / -ей]{.ru}（阴性）；物主代词和指示代词第三格 [моему́, мое́й, на́шему, на́шей, э́тому, э́той]{.ru}；[его́, её, их]{.ru} 不变；“送谁什么”：第三格 + 第四格。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词组变成第三格。
    why: 阳性形容词变 [-ому]{.ru}，阴性变 [-ой]{.ru}；[ж, ш, ч, щ]{.ru} 后面不带重音写 [-ему]{.ru}、[-ей]{.ru}（[мла́дшему]{.ru}、[ста́ршей]{.ru}）。物主代词 [мой → моему́]{.ru}，[моя́ → мое́й]{.ru}，[наш → на́шему]{.ru}。名词按第 51 课变：[брат → бра́ту]{.ru}，[сестра́ → сестре́]{.ru}，[Ми́ша → Ми́ше]{.ru}。第 5 题的 [его́]{.ru} 不变格。
    items:
      - stem: Я подарю́ ___ игру́.
        hint: мла́дший брат
        accept: [мла́дшему бра́ту]
      - stem: Ван Лэй звони́т ___.
        hint: мой ста́рый друг
        accept: [моему́ ста́рому дру́гу]
      - stem: Что ты пода́ришь ___?
        hint: ста́ршая сестра́
        accept: [ста́ршей сестре́]
      - stem: ___ я хочу́ подари́ть мяч.
        hint: наш Ми́ша
        accept: [На́шему Ми́ше]
      - stem: А́нна пи́шет ___.
        hint: его́ ма́ма
        accept: [его́ ма́ме]
      - stem: Мы покупа́ем пода́рок ___.
        hint: на́ша ба́бушка
        accept: [на́шей ба́бушке]
      - stem: Я расска́зываю ___ о Пеки́не.
        hint: э́тот студе́нт
        accept: [э́тому студе́нту]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 先分清是“给谁”还是“什么”：给谁用第三格（[-ому]{.ru}、[-ой]{.ru}），送的东西用第四格（阴性 [-ую]{.ru}，阳性非动物名词同第一格）。第 3 题 [у]{.ru} 后面要第二格 [-ого]{.ru}，不要和第三格 [-ому]{.ru} 混。
    items:
      - stem: Я подарю́ бра́ту ___ игру́.
        options: [но́вой, но́вую]
        answer: но́вую
      - stem: Я подарю́ игру́ ___ бра́ту.
        options: [мла́дшего, мла́дшему]
        answer: мла́дшему
      - stem: У ___ дру́га всегда́ бу́дут де́ньги.
        options: [твоего́, твоему́]
        answer: твоего́
      - stem: Мне ну́жен пода́рок ___ дру́гу.
        options: [моего́, моему́]
        answer: моему́
      - stem: Что ты пода́ришь ___ ба́бушке?
        options: [на́шу, на́шей]
        answer: на́шей

  - id: e3
    type: rewrite
    task: 按例句回答：谁送谁什么。
    placeholder: … подари́л(а) …
    example:
      cue: А́нна — мла́дший брат — компью́терная игра́
      answer: А́нна подари́ла мла́дшему бра́ту компью́терную игру́.
    why: 句子结构是“主语 + 动词 + 第三格 + 第四格”。人用第三格（[-ому]{.ru}、[-ой]{.ru}），东西用第四格（阴性 [-ую]{.ru}，阳性非动物名词不变）。过去时动词跟主语的性一致。
    items:
      - cue: Ван Лэй — наш Ми́ша — футбо́льный мяч
        accept: ["Ван Лэй подари́л на́шему Ми́ше футбо́льный мяч."]
      - cue: па́па — ста́ршая дочь — но́вая ку́ртка
        accept: ["Па́па подари́л ста́ршей до́чери но́вую ку́ртку."]
      - cue: мы — на́ша ба́бушка — ро́за
        accept: ["Мы подари́ли на́шей ба́бушке ро́зу."]
      - cue: я (Ван Лэй) — мой друг — кошелёк
        accept: ["Я подари́л моему́ дру́гу кошелёк."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 注意形容词、物主代词和名词都要变成第三格。
    items:
      - zh: 你送弟弟什么？
        accept: ["Что ты пода́ришь мла́дшему бра́ту?", "Что ты да́ришь мла́дшему бра́ту?", "Что ты пода́ришь бра́ту?"]
        rubric: ["[мла́дшему бра́ту]{.ru} 第三格", "“弟弟”是 [мла́дший брат]{.ru}"]
      - zh: 我想送咱们米沙一个足球。
        accept: ["Я хочу́ подари́ть на́шему Ми́ше футбо́льный мяч.", "На́шему Ми́ше я хочу́ подари́ть футбо́льный мяч."]
        rubric: ["[на́шему Ми́ше]{.ru} 第三格", "“足球”是 [футбо́льный мяч]{.ru}"]
      - zh: 钱包不能空着送。
        accept: ["Пусто́й кошелёк дари́ть нельзя́.", "Нельзя́ дари́ть пусто́й кошелёк."]
        rubric: ["[нельзя́]{.ru} + 未完成体 [дари́ть]{.ru}"]
      - zh: 我每个星期都给我的老朋友写信。
        accept: ["Я пишу́ моему́ ста́рому дру́гу ка́ждую неде́лю.", "Ка́ждую неде́лю я пишу́ моему́ ста́рому дру́гу.", "Я ка́ждую неде́лю пишу́ моему́ ста́рому дру́гу."]
        rubric: ["[моему́ ста́рому дру́гу]{.ru} 三个词都是第三格", "“每个星期”用第四格 [ка́ждую неде́лю]{.ru}"]

  - id: e5
    type: open
    task: 你要回国过年了，打算给家人和朋友带礼物。写一写你送谁什么、为什么。
    items:
      - prompt: 写 5–7 句话，至少送三个人礼物，用到形容词或物主代词的第三格。
        length: 50–90
        model: "В январе́ я бу́ду до́ма, в Пеки́не. Мне ну́жно купи́ть пода́рки. Мое́й ма́ме я подарю́ тёплый шарф: ей нра́вятся ша́рфы. Моему́ па́пе я куплю́ ру́сскую кни́гу, он лю́бит чита́ть. А моему́ ста́рому дру́гу я подарю́ кошелёк. Но пусто́й кошелёк дари́ть нельзя́. Я положу́ туда́ моне́ту."
        rubric: ["“给谁”用第三格，形容词、物主代词与名词一致", "送的东西用第四格", "每份礼物说出一个理由"]
        notes: 范文先交代情境，再一人一句说礼物，最后用本课学到的风俗收尾。把第三格放在句首（[Мое́й ма́ме я подарю́…]{.ru}）可以突出“送给谁”，读起来像列举。说理由时用冒号或另起一句，避免用还没学的 [потому́ что]{.ru}。
