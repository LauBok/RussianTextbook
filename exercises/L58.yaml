lesson: L58
grammar: "无人称句：谓语副词 [хо́лодно, тепло́, ску́чно, интере́сно, тру́дно, ве́село]{.ru} 表示环境状态、人的感受（感受者用第三格）和对行为的评价（+ 不定式）；过去时 [бы́ло]{.ru}，将来时 [бу́дет]{.ru}；副词与形容词的区别。"
exercises:

  - id: e1
    type: choice
    task: 选择形容词或副词。
    why: 修饰名词、和名词一致的用形容词（第 1、3、5 题）；没有第一格主语、说明情况或感受的用副词（第 2、4、6 题）。第 6 题 [мне]{.ru} 是第三格，说明这是无人称句，只能用副词。
    items:
      - stem: Сего́дня ___ день.
        options: [холо́дный, хо́лодно]
        answer: холо́дный
      - stem: Сего́дня на у́лице ___.
        options: [холо́дный, хо́лодно]
        answer: хо́лодно
      - stem: Э́то о́чень ___ кни́га.
        options: [интере́сная, интере́сно]
        answer: интере́сная
      - stem: На уро́ке бы́ло ___.
        options: [интере́сный, интере́сно]
        answer: интере́сно
      - stem: У меня́ ___ ку́ртка.
        options: [тёплая, тепло́]
        answer: тёплая
      - stem: Мне ___.
        options: [ску́чный, ску́чно]
        answer: ску́чно

  - id: e2
    type: rewrite
    task: 按例句改写：说出人的感受。
    placeholder: Мне …
    example:
      cue: я — хо́лодно
      answer: Мне хо́лодно.
    why: 感受的人用第三格，谓语副词不变。第 4 题 [Ван Лэй]{.ru} 变成 [Ван Лэ́ю]{.ru}，第 5 题 [на́ша ба́бушка]{.ru} 变成 [на́шей ба́бушке]{.ru}。不能写成 *[Я хо́лодно]{.ru}*。
    items:
      - cue: он — ску́чно
        accept: ["Ему́ ску́чно."]
      - cue: мы — интере́сно
        accept: ["Нам интере́сно."]
      - cue: ты — тепло́?
        accept: ["Тебе́ тепло́?"]
      - cue: Ван Лэй — тру́дно
        accept: ["Ван Лэ́ю тру́дно."]
      - cue: на́ша ба́бушка — хо́лодно
        accept: ["На́шей ба́бушке хо́лодно."]

  - id: e3
    type: fill
    task: 填 [бы́ло]{.ru} 或 [бу́дет]{.ru}。
    why: 看时间状语：[вчера́]{.ru} 是过去，用 [бы́ло]{.ru}；[за́втра]{.ru}、[сего́дня ве́чером]{.ru}（还没发生）是将来，用 [бу́дет]{.ru}。无人称句里过去时一律是中性 [бы́ло]{.ru}，第 2 题不能因为 [А́нне]{.ru} 写成 *[была́]{.ru}*。
    items:
      - stem: Вчера́ ___ хо́лодно.
        accept: [бы́ло]
      - stem: Вчера́ на уро́ке А́нне ___ ску́чно.
        accept: [бы́ло]
      - stem: За́втра ___ тепло́.
        accept: [бу́дет]
      - stem: Сего́дня ве́чером у нас ___ ве́село.
        accept: [бу́дет]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 都是无人称句，感受者用第三格。
    items:
      - zh: 今天很冷。
        accept: ["Сего́дня хо́лодно.", "Сего́дня о́чень хо́лодно."]
        rubric: ["用副词 [хо́лодно]{.ru}，重音在第一个音节"]
      - zh: 你冷吗？——不冷，我很暖和。
        accept: ["— Тебе́ хо́лодно? — Нет, мне тепло́.", "— Вам хо́лодно? — Нет, мне тепло́."]
        rubric: ["[тебе́ / вам]{.ru}、[мне]{.ru} 用第三格", "“很暖和”用 [тепло́]{.ru}"]
      - zh: 王磊在家很无聊。
        accept: ["Ван Лэ́ю до́ма ску́чно.", "До́ма Ван Лэ́ю ску́чно.", "Ван Лэ́ю ску́чно до́ма."]
        rubric: ["[Ван Лэ́ю]{.ru} 第三格", "[ску́чно]{.ru} 作谓语"]
      - zh: 学俄语很难，但是很有意思。
        accept: ["Учи́ть ру́сский язы́к тру́дно, но интере́сно.", "Учи́ться ру́сскому языку́ тру́дно, но интере́сно."]
        rubric: ["不定式 + [тру́дно]{.ru}、[интере́сно]{.ru}", "两个副词之间用 [но]{.ru}"]
      - zh: 昨天在公园里很开心。
        accept: ["Вчера́ в па́рке бы́ло ве́село.", "В па́рке вчера́ бы́ло ве́село."]
        rubric: ["过去时用 [бы́ло]{.ru}", "[в па́рке]{.ru} 第六格"]

  - id: e5
    type: open
    task: 缩写：根据课文回答问题，连成一段话。
    items:
      - prompt: "[Как до́лго Ван Лэй лежа́л до́ма? Как ему́ бы́ло до́ма? Почему́? Кака́я сего́дня пого́да? Что говори́т Ива́н Серге́евич об учёбе? Что хо́чет де́лать Ми́ша?]{.ru}"
        length: 50–80
        model: "Три дня Ван Лэй лежа́л до́ма. Ему́ бы́ло ску́чно: нельзя́ бы́ло ходи́ть на заня́тия и гуля́ть по го́роду. Сего́дня на у́лице моро́з, ми́нус пятна́дцать. Для ноября́ э́то хо́лодно. Но в но́вой ку́ртке и ша́пке Ван Лэ́ю бу́дет тепло́. Ива́н Серге́евич говори́т: «Учи́ться тру́дно, но интере́сно». А Ми́ше ве́село: он хо́чет гуля́ть по́сле шко́лы."
        rubric: ["回答全部问题", "无人称句 [ску́чно, хо́лодно, тепло́]{.ru} 用对，感受者用第三格", "过去时 [бы́ло]{.ru}、将来时 [бу́дет]{.ru} 用对"]
        notes: 范文把课文里的对话改成叙述，按时间顺序：生病的三天—今天的天气—两人的话。回答“为什么”时用冒号引出原因，因为 [потому́ что]{.ru} 第 84 课才学。伊万·谢尔盖耶维奇的话保留为直接引语，间接引语第 88 课才学。
