lesson: B4-L40
heading: 结业测试
intro: 答对 80% 以上即完成第四册。本测试覆盖全册五个单元的文体与修辞知识，测试选文是托尔斯泰的短篇小说《瓦罐阿廖沙》（节选），最后两题是概要写作和作品评论。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看那一小题对应的单元（第 1—2 小题第一单元，第 3—4 小题第二单元，第 5—6 小题第三单元，第 7 小题第四单元，第 8—10 小题第五单元）；第 2、3 题回看测试选文和第 18、23、36、39 课；第 4 题回看第 39 课的概要写作；第 5 题回看本课“概要与作品评论”，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 根据全册的文体与修辞知识选择正确答案。
    why: "第 1 题《胖子和瘦子》里瘦子听说对方官阶以后，从 [ты]{.ru} 改称 [ваше превосходительство]{.ru}，称呼的转换写出人物关系的变化。第 2 题《上尉的女儿》写暴风雪的一段，一连串完成体过去时动词（[завыл, сделалась, смешалось, исчезло]{.ru}）表示一个接一个完成的动作，节奏越来越快；未完成体才用于持续的状态和反复的动作。第一单元《一个官员的死》的开头也是这样。第 3 题 [Люблю грозу в начале мая]{.ru} 的多音节词重音在第 2、4、6、8 个音节上，是“轻—重”的抑扬格（[ямб]{.ru}）；扬抑格（[хорей]{.ru}）的重音在单数音节上。第 4 题第 1、3 行押韵，第 2、4 行押韵，叫交叉韵（AbAb）；环形韵是 AbbA，第 1、4 行押韵；复合韵（[составная рифма]{.ru}）指一个词和两个词押韵，说的不是韵式。第 5 题回忆录里成年的叙述者回头看童年，他会评价、会惋惜；童年的“我”只知道当时的事。第 6 题 [ни… ни… ни…]{.ru} 一连三次否定，是否定的排比：作家用“不是什么”来写奥勃洛莫夫的“没有特点”。第 7 题公文追求准确、不带个人色彩，用被动结构和名词化（动名词代替动词）；口语词和感叹号属于网络评论，比喻属于文学语体。第 8 题果戈理在“三驾马车”一段离开情节，直接抒发对俄罗斯的感情，这叫抒情插笔（[лирическое отступление]{.ru}）。第 9 题《普希金演讲》本来是口头演讲：用第一人称复数的祈使式（[Вникнем, поглядим]{.ru}）把听众拉进来，自问自答（设问），这是演说体的特点；合同和科学文章不对读者说话，也不设问。第 10 题纪实文体以真实的人和事为材料，用精确的数字和日期，作者交代方法和局限；童话和抒情诗都不是纪实。"
    items:
      - stem: "В рассказе «Толстый и тонкий» тонкий называет старого друга сначала на «ты», а потом «ваше превосходительство». Это показывает, что ___."
        options: ["изменились отношения между героями", "герои плохо слышат друг друга", "автор не знает, как их зовут"]
        answer: "изменились отношения между героями"
      - stem: "«Ветер завыл; сделалась метель. <…> Всё исчезло». Глаголы совершенного вида здесь показывают, что ___."
        options: ["действия быстро следуют одно за другим", "состояние долго не меняется", "действие повторяется каждый день"]
        answer: "действия быстро следуют одно за другим"
      - stem: "«Люблю грозу в начале мая» — ударения на 2-м, 4-м, 6-м и 8-м слогах. Это ___."
        options: ["ямб", "хорей", "тонический стих"]
        answer: "ямб"
      - stem: "Первая строка рифмуется с третьей, вторая — с четвёртой. Это ___ рифма."
        options: ["перекрёстная", "кольцевая", "составная"]
        answer: "перекрёстная"
      - stem: "В «Детстве» Толстого взрослый рассказчик вспоминает себя ребёнком. Он ___."
        options: ["знает больше, чем мальчик, и оценивает прошлое", "знает только то, что знал мальчик", "не появляется в тексте"]
        answer: "знает больше, чем мальчик, и оценивает прошлое"
      - stem: "«Цвет лица у Ильи Ильича не был ни румяный, ни смуглый, ни положительно бледный…» В этом предложении ___."
        options: ["несколько раз повторяется отрицание", "есть риторический вопрос", "автор обращается к читателю"]
        answer: "несколько раз повторяется отрицание"
      - stem: "В договоре обычно используются ___."
        options: ["пассивные конструкции и существительные вместо глаголов", "разговорные слова и восклицательные знаки", "сравнения и метафоры"]
        answer: "пассивные конструкции и существительные вместо глаголов"
      - stem: "В конце первого тома «Мёртвых душ» автор оставляет сюжет и обращается к Руси. Это ___."
        options: ["лирическое отступление", "новостная заметка", "договор"]
        answer: "лирическое отступление"
      - stem: "Достоевский обращается к слушателям, сам задаёт вопросы и сам отвечает на них. Это признаки ___."
        options: ["речи перед публикой", "договора", "научной статьи"]
        answer: "речи перед публикой"
      - stem: "Точные числа, даты и рассказ о том, как автор собирал материал, — признаки ___."
        options: ["документальной прозы", "сказки", "лирического стихотворения"]
        answer: "документальной прозы"

  - id: e2
    type: open
    task: 理解问答。根据测试选文，用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Почему Алёшу прозвали Горшком? Каким он был в детстве?]{.ru}"
        length: 40–70
        model: "Однажды мать послала Алёшу снести горшок молока, а он упал и разбил горшок. Мать наказала его, а ребята стали дразнить его «Горшком». Алёша был худощавый, с большими ушами и большим носом, но всегда весёлый. Когда над ним смеялись или его ругали, он молчал, а потом улыбался и снова брался за работу."
        rubric: ["说出外号的来历：摔碎了一罐牛奶", "说出他的外貌和性格：瘦、招风耳，总是乐呵呵的，挨骂也不吭声"]
        notes: "第 1—2 段。外号“瓦罐”在故事里出现了三次：开头的来历，乌斯季尼娅留粥用的罐子（第 8 段），她笑他“说是个瓦罐，倒挺会说话”（第 12 段）。"
      - prompt: "[Как Алёша служил у купца? Что он обычно отвечал, когда ему что-нибудь приказывали?]{.ru}"
        length: 40–70
        model: "Сначала Алёша никому не понравился: одежда у него была плохая, и он всем говорил «ты». Но работал он ещё лучше брата: всё делал охотно и быстро и никогда не спорил. Поэтому все посылали его по делам, и чем больше он делал, тем больше работы ему давали. На любой приказ он отвечал: «Это всё можно» — и сразу шёл делать."
        rubric: ["说出起初大家不喜欢他，后来看惯了", "说出他干活多、从不顶嘴，活儿越干越多", "说出他的口头禅 [«Это всё можно»]{.ru}"]
        notes: "第 5—6 段。[Чем больше он делал, тем больше все на него наваливали дела]{.ru} 一句概括了他在商人家的处境：他的“好”正是大家使唤他的理由。"
      - prompt: "[Какое «самое необыкновенное в его жизни событие» случилось с Алёшей?]{.ru}"
        length: 40–80
        model: "Алёша узнал, что люди нужны друг другу не только для работы. Кухарка Устинья, молодая сирота, стала жалеть его: оставляла ему кашу с маслом, заштопала ему штаны и смотрела на него, когда он ел. И Алёша в первый раз почувствовал, что другому человеку нужен он сам, а не его работа. Потом он решил жениться на ней, и она согласилась."
        rubric: ["说出“最不寻常的事”是发现自己本人被别人需要，而不是因为他有用", "说出乌斯季尼娅怎样心疼他", "说出他求婚、她答应"]
        notes: "第 8—12 段。注意托尔斯泰的说法：[он, сам он, не его услуги, а он сам нужен]{.ru} 用重复强调“他本人”。这是全篇的中心：阿廖沙一辈子被人当作干活的工具，直到乌斯季尼娅出现。"
      - prompt: "[Как Алёша принял запрет отца и свою смерть?]{.ru}"
        length: 40–70
        model: "Когда отец запретил ему жениться, Алёша не спорил: он постоял, вздохнул, улыбнулся и сказал, что это можно и оставить. Только вечером он засмеялся и тут же заплакал. Умирал он так же спокойно. Он благодарил Устинью за то, что она его жалела, и говорил, что теперь всё хорошо, а потом умер тихо, чему-то удивляясь."
        rubric: ["说出他没有反抗父亲，只是笑了笑，后来又笑又哭", "说出他平静地面对死亡，感谢乌斯季尼娅"]
        notes: "第 14—26 段和第 33—38 段。两个场面写法相同：阿廖沙说的话很少，几乎都是“好吧”“没什么”，他的感情只从动作里透出来：[засмеялся и тут же заплакал]{.ru}。"

  - id: e3
    type: open
    task: 文体分析。用俄语分析测试选文的结构、叙述方式和主要的修辞手段，每一点都从选文里举出例子。
    items:
      - prompt: "[Как построен рассказ? Как ведётся повествование? Какие повторы и детали помогают автору?]{.ru}"
        length: 150–200
        model: "Рассказ построен как короткая история одной жизни: детство, служба у купца, любовь, запрет отца и смерть. Главное событие стоит в середине: Алёша узнаёт, что он сам нужен другому человеку. Всё, что было до этого, готовит его, а всё, что после, показывает, что он потерял.\n\nРассказ ведётся от третьего лица, но язык рассказчика близок к языку самого Алёши и других простых людей: короткие предложения, разговорные слова («меньшой», «ухватка», «помер»), почти нет описаний. Автор ничего не объясняет и не оценивает. Он не говорит, что купец и отец поступили несправедливо, — читатель понимает это сам.\n\nВажную роль играют повторы. Алёша почти всегда «улыбался», и даже когда отец запрещает ему жениться, он улыбается. Его ответ «Это всё можно» повторяется в словах «это и оставить можно». Слово «горшок» связывает начало рассказа, любовь Устиньи и её шутку.\n\nСильнее всего действует конец. Последние предложения очень короткие: «Говорил он мало», «Удивился чему-то, потянулся и помер». Тихая смерть так же незаметна, как вся жизнь героя."
        rubric: ["说出结构：一生的编年，中心事件在中间", "说出叙述方式：第三人称，语言接近人物的口语，作者不评论", "说出重复（[улыбался]{.ru}、[можно]{.ru}、[горшок]{.ru}）的作用，至少两例", "说出结尾短句的效果", "每一点都有原文例子", "150–200 词"]
        notes: "范文 155 词，分四段：结构—叙述方式—重复—结尾。四个要点在全册都学过：叙述者与人物的语言（第 18、23 课），作者不评论、让细节说话（第 1、2、39 课），重复（第 36、39 课）。最重要的是“不评论”：托尔斯泰没有一句话批评商人和父亲，读者却清楚地看到他们怎样对待阿廖沙。"

  - id: e4
    type: open
    task: 概要写作。用俄语把测试选文压缩成 150 词左右的概要，按原文的顺序，用第三人称转述，不加自己的评价。
    items:
      - prompt: "[Напишите краткий пересказ рассказа «Алёша Горшок».]{.ru}"
        length: 130–170
        model: "Алёша был младшим сыном в бедной крестьянской семье. Прозвище «Горшок» он получил в детстве, когда разбил горшок с молоком. Он был худощавый и некрасивый, но всегда весёлый и с двенадцати лет работал наравне со взрослыми.\n\nВ девятнадцать лет отец отдал его в дворники к купцу. Алёша работал больше всех, никогда не спорил и на любой приказ отвечал: «Это всё можно».\n\nЧерез полтора года кухарка Устинья, молодая сирота, стала жалеть Алёшу, и он впервые почувствовал, что нужен другому человеку сам по себе. Он предложил ей выйти за него замуж, и она согласилась. Но жене купца это не понравилось, и отец, приехав за деньгами, запретил сыну жениться. Алёша не стал спорить.\n\nВскоре он упал с крыши, когда убирал с неё снег. Через несколько дней, поблагодарив Устинью за то, что она его жалела, он тихо умер."
        rubric: ["写出阿廖沙的外号和性格", "写出在商人家干活的情形", "写出和乌斯季尼娅的感情、求婚和父亲的禁止", "写出结局：摔伤、死去", "按原文顺序，第三人称，过去时，不用直接引语，不加评价", "130–170 词"]
        notes: "范文 133 词。顺序：童年（第 1—2 段）→ 在商人家（第 3—7 段）→ 乌斯季尼娅和父亲的禁止（第 8—27 段）→ 摔伤和死（第 28—38 段）。压缩的办法：大段对话改成一两句转述（父亲的训斥压缩成 [запретил сыну жениться]{.ru}）；口语词和方言（[меньшой, рассерчал, помер]{.ru}）换成中性的说法（[младший, рассердился, умер]{.ru}）；阿廖沙的口头禅 [«Это всё можно»]{.ru} 是人物性格的标志，可以作为短引用保留。"

  - id: e5
    type: open
    task: 作品评论。就测试选文写一篇 250–300 词的评论：简要介绍作品，分析它的结构和主要手段，说明作品的思想，最后写出你自己的看法和理由。
    items:
      - prompt: "[Напишите отзыв о рассказе Л. Н. Толстого «Алёша Горшок». Как вы относитесь к тому, что герой никогда не спорит и со всем соглашается?]{.ru}"
        length: 250–300
        model: "Рассказ «Алёша Горшок» Лев Толстой написал в 1905 году, в конце жизни. Это короткая история простого крестьянского парня, который всю жизнь работал на других и тихо умер.\n\nСюжет рассказа очень прост, и Толстой рассказывает его таким же простым языком, каким говорят его герои: короткие предложения, разговорные слова, почти нет описаний. Автор не объясняет поступков героя и не судит других людей. Он не пишет, что купец, его жена и отец Алёши поступили несправедливо, но читатель видит это сам: молодому человеку не разрешили жениться только потому, что хозяйка боялась: если у кухарки будет ребёнок, работать она уже не сможет.\n\nГлавное событие рассказа — не смерть героя, а любовь. Алёша впервые понимает, что нужен другому человеку не как работник, а сам по себе. Мне кажется, в этом главная мысль Толстого: человек ценен не тем, сколько пользы он приносит, а тем, что его можно любить.\n\nКак относиться к тому, что Алёша никогда не спорит? С одной стороны, то, что он всегда со всем соглашается, вызывает грусть и даже досаду. Он мог бы защитить свою любовь, но говорит только: «Это и оставить можно». С другой стороны, Толстой видит в герое не слабого человека, а человека особой силы: Алёша никого не обижает, ни на кого не сердится и умирает со спокойной душой. Для позднего Толстого именно такой человек и есть настоящий святой.\n\nЯ не могу полностью согласиться с таким взглядом: по-моему, человек имеет право бороться за своё счастье. Но рассказ заставляет задуматься о другом: замечаем ли мы тех тихих людей, которые каждый день работают рядом с нами и никогда ни о чём не просят?"
        rubric: ["开头介绍作者、作品和内容", "分析作品的语言和“作者不评论”的手法，举出原文的例子", "说出作品的中心事件和思想", "对主人公的顺从表明自己的看法，正反两面都要谈到，并给出理由", "结尾联系今天或总结", "250–300 词"]
        notes: "范文 256 词，分五段：介绍—写法—思想—两面的看法—个人结论。第四段用 [С одной стороны … С другой стороны …]{.ru} 先分析人物，再在最后一段表明自己的立场，这是第 26 课学过的论证方法。评论里可以不同意作者，但要先准确说出作者的看法（[Для позднего Толстого именно такой человек и есть настоящий святой]{.ru}），再说明自己为什么不同意。"
