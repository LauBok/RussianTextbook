lesson: B4-L40
heading: 结业测试
intro: 答对 80% 以上即完成第四册。本测试覆盖全册五个单元的文体与修辞知识，测试选文是托尔斯泰的短篇小说《舞会之后》（节选），最后两题是概要写作和作品评论。没有达到 80% 的，按出错的题回看：第 1 题错在哪一小题就回看那一小题对应的单元（第 1—2 小题第一单元，第 3—4 小题第二单元，第 5—6 小题第三单元，第 7 小题第四单元，第 8—10 小题第五单元）；第 2、3 题回看测试选文和第 17、33、37 课；第 4 题回看第 39 课的概要写作；第 5 题回看本课“概要与作品评论”，复习后重做。
exercises:

  - id: e1
    type: choice
    task: 根据全册的文体与修辞知识选择正确答案。
    why: "第 1 题《胖子和瘦子》里瘦子听说对方官阶以后，从 [ты]{.ru} 改称 [ваше превосходительство]{.ru}，称呼的转换写出人物关系的变化。第 2 题《上尉的女儿》写暴风雪的一段，一连串完成体过去时动词（[завыл, сделалась, смешалось, исчезло]{.ru}）表示一个接一个完成的动作，节奏越来越快；未完成体才用于持续的状态和反复的动作。第一单元《一个官员的死》的开头也是这样。第 3 题 [Люблю грозу в начале мая]{.ru} 的多音节词重音在第 2、4、6、8 个音节上，是“轻—重”的抑扬格（[ямб]{.ru}）；扬抑格（[хорей]{.ru}）的重音在单数音节上。第 4 题第 1、3 行押韵，第 2、4 行押韵，叫交叉韵（AbAb）；环形韵是 AbbA，第 1、4 行押韵；复合韵（[составная рифма]{.ru}）指一个词和两个词押韵，说的不是韵式。第 5 题回忆录里成年的叙述者回头看童年，他会评价、会惋惜；童年的“我”只知道当时的事。第 6 题 [ни… ни… ни…]{.ru} 一连三次否定，是否定的排比：作家用“不是什么”来写奥勃洛莫夫的“没有特点”。第 7 题公文追求准确、不带个人色彩，用被动结构和名词化（动名词代替动词）；口语词和感叹号属于网络评论，比喻属于文学语体。第 8 题果戈理在“三驾马车”一段离开情节，直接抒发对俄罗斯的感情，这叫抒情插笔（[лирическое отступление]{.ru}）。第 9 题《普希金演讲》本来是口头演讲：用第一人称复数的祈使式（[Вникнем, поглядим]{.ru}）把听众拉进来，自问自答（设问），这是演说体的特点；合同和科学文章不对读者说话，也不设问。第 10 题纪实文体以真实的人和事为材料，用精确的数字和日期，作者交代方法和局限；童话和抒情诗都不是纪实。"
    items:
      - stem: "В рассказе «Толстый и тонкий» тонкий называет старого друга сначала на «ты», а потом «ваше превосходительство». Это показывает, что ___."
        options: ["изменились отношения между героями", "герои плохо слышат друг друга", "автор не знает, как их зовут"]
        answer: "изменились отношения между героями"
      - stem: "«Ветер завыл; сделалась метель. <…> Всё исчезло». Глаголы совершенного вида здесь показывают, что ___."
        options: ["действия быстро следуют одно за другим", "состояние долго не меняется", "действие повторяется каждый день"]
        answer: "действия быстро следуют одно за другим"
      - stem: "«Люблю грозу в начале мая» — ударения на 2-м, 4-м, 6-м и 8-м слогах. Это ___."
        options: ["ямб", "хорей", "тонический стих"]
        answer: "ямб"
      - stem: "Первая строка рифмуется с третьей, вторая — с четвёртой. Это ___ рифма."
        options: ["перекрёстная", "кольцевая", "составная"]
        answer: "перекрёстная"
      - stem: "В «Детстве» Толстого взрослый рассказчик вспоминает себя ребёнком. Он ___."
        options: ["знает больше, чем мальчик, и оценивает прошлое", "знает только то, что знал мальчик", "не появляется в тексте"]
        answer: "знает больше, чем мальчик, и оценивает прошлое"
      - stem: "«Цвет лица у Ильи Ильича не был ни румяный, ни смуглый, ни положительно бледный…» Здесь использован ___."
        options: ["несколько раз повторяется отрицание", "есть риторический вопрос", "автор обращается к читателю"]
        answer: "несколько раз повторяется отрицание"
      - stem: "В договоре обычно используются ___."
        options: ["пассивные конструкции и существительные вместо глаголов", "разговорные слова и восклицательные знаки", "сравнения и метафоры"]
        answer: "пассивные конструкции и существительные вместо глаголов"
      - stem: "В конце первого тома «Мёртвых душ» автор оставляет сюжет и обращается к Руси. Это ___."
        options: ["лирическое отступление", "новостная заметка", "договор"]
        answer: "лирическое отступление"
      - stem: "Достоевский обращается к слушателям, сам задаёт вопросы и сам отвечает на них. Это признаки ___."
        options: ["речи перед публикой", "договора", "научной статьи"]
        answer: "речи перед публикой"
      - stem: "Точные числа, даты и рассказ о том, как автор собирал материал, — признаки ___."
        options: ["документальной прозы", "сказки", "лирического стихотворения"]
        answer: "документальной прозы"

  - id: e2
    type: open
    task: 理解问答。根据测试选文，用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[С какой мысли начинает свой рассказ Иван Васильевич и как связан с ней конец рассказа?]{.ru}"
        length: 40–70
        model: "Иван Васильевич спорит с теми, кто считает, что всё дело в среде. Он говорит, что всё дело в случае, и обещает рассказать о себе. В конце он возвращается к этой мысли: вся его жизнь изменилась от одного утра, и он заканчивает почти теми же словами, с которых начал: «А вы говорите…»"
        rubric: ["说出开头的论点：一切在于偶然，而不在于环境", "说出结尾呼应开头（[А вы говорите…]{.ru}）"]
        notes: "开头第 1 段和最后一段。整个故事是一个“故事中的故事”：伊万·瓦西里耶维奇对朋友们讲自己的经历，用它来证明自己的观点。"
      - prompt: "[Что увидел рассказчик утром на поле? Кем оказался высокий военный?]{.ru}"
        length: 40–80
        model: "Утром рассказчик услышал неприятную музыку и увидел два ряда солдат. Между ними вели раздетого человека, татарина, которого наказывали за побег: солдаты с двух сторон били его палками по спине. Рядом с ним шёл высокий военный. Это был отец Вареньки, тот самый полковник, который ночью так красиво танцевал с дочерью на балу."
        rubric: ["说出看到的场面：士兵排成两行，鞑靼人因逃跑受刑", "认出高个子军人是瓦莲卡的父亲、舞会上的上校"]
        notes: "第 7—11 段。注意作者的写法：先是“黑乎乎的东西”，再是“黑色的人影”“士兵”，最后才认出上校，读者和叙述者一起一步步看清。"
      - prompt: "[Почему полковник ударил солдата? Как он повёл себя, когда увидел рассказчика?]{.ru}"
        length: 40–70
        model: "Полковник ударил маленького слабого солдата по лицу, потому что тот бил татарина недостаточно сильно. Когда полковник увидел рассказчика, он сделал вид, что не знает его, сердито посмотрел и быстро отвернулся. А рассказчику стало так стыдно, будто это он сам сделал что-то плохое."
        rubric: ["说出打士兵的原因", "说出上校装作不认识叙述者", "说出叙述者的羞愧"]
        notes: "第 13—15 段。羞愧的是旁观者而不是施刑者，这一细节是理解全篇的关键之一。"
      - prompt: "[Как изменились жизнь и любовь рассказчика после этого утра?]{.ru}"
        length: 40–70
        model: "Рассказчик говорит, что от этого утра изменилась вся его жизнь. Он не мог забыть того, что видел: в ушах у него звучали барабан, флейта и голоса. Любовь к Вареньке тоже прошла: когда она улыбалась, он сразу вспоминал её отца на площади, ему становилось неловко, и он стал реже с ней видеться."
        rubric: ["说出他的一生因这个早晨而改变，那个场面一直留在他心里", "说出爱情慢慢消失及原因"]
        notes: "最后一段和第 3、15 段。爱情的消失写得很平静：没有争吵，没有分手，只是“想起广场上的上校”，“不大常去见她了”。托尔斯泰让读者自己去体会，一个早晨的所见怎样改变了一个人的感情。"

  - id: e3
    type: open
    task: 文体分析。用俄语分析测试选文的结构、叙述视角和主要的修辞手段，每一点都从选文里举出例子。
    items:
      - prompt: "[Как построен рассказ? Кто рассказывает и как это влияет на читателя? Какие детали и повторы помогают автору?]{.ru}"
        length: 150–200
        model: "Рассказ построен как рассказ в рассказе: Иван Васильевич в кругу друзей вспоминает свою молодость. Его история должна доказать мысль, с которой он начинает: «всё дело в случае». Конец возвращает нас к началу — «А вы говорите…».\n\nРассказ делится на две части, совсем не похожие друг на друга. Ночью — бал, музыка мазурки, красивый полковник танцует с дочерью. Утром — поле, барабан и флейта, тот же полковник ведёт наказание. Автор показывает, что это один и тот же человек: то же румяное лицо, те же белые усы, та же замшевая перчатка, в которой он танцевал и в которой теперь бьёт солдата. Его слова на балу «надо всё по закону» утром звучат страшно.\n\nРассказчик — человек, который через много лет вспоминает себя молодым. Он рассказывает о событиях так, как видел их тогда: сначала «что-то большое, чёрное», потом «много чёрных людей», и только потом он узнаёт полковника. Поэтому читатель вместе с ним постепенно понимает, что происходит.\n\nВажную роль играют повторы: татарин снова и снова просит «братцев» пожалеть его, полковник два раза кричит одни и те же слова. Эти голоса потом всю дорогу звучат в ушах рассказчика, и читатель слышит их вместе с ним. Автор почти ничего не объясняет: оценку даёт только чувство стыда."
        rubric: ["说出框架结构（故事中的故事）和首尾呼应", "说出舞会与清晨的对照，并举出至少两个重复出现的细节（手套、脸、胡子、“按规矩”）", "说出叙述视角：老年的叙述者按当时的感知顺序讲述", "说出重复的话语（[Братцы, помилосердуйте]{.ru}、[Будешь мазать?]{.ru}）的作用", "每一点都有原文例子", "150–200 词"]
        notes: "范文约 190 词，分四段：结构（框架）—对照—视角—重复。四个要点在全册都学过：框架和首尾呼应（第 9、36 课），对照（第 10 课），回忆的双重视角（第 17、33 课），重复（第 36、39 课）。最重要的细节是麂皮手套：舞会上上校戴上它“按规矩”跳舞，早晨用同一只手打士兵，托尔斯泰一句评论也不加，读者自己就看出了两者的联系。"

  - id: e4
    type: open
    task: 概要写作。用俄语把测试选文压缩成 150 词左右的概要，按原文的顺序，用第三人称转述，不加自己的评价。
    items:
      - prompt: "[Напишите краткий пересказ отрывка из рассказа «После бала».]{.ru}"
        length: 130–170
        model: "Иван Васильевич не согласен с друзьями, которые считают, что человек зависит от среды. По его мнению, всё решает случай, и он рассказывает историю из своей молодости.\n\nВ молодости он любил Вареньку, дочь полковника. На балу её отец сначала отказывался танцевать, но потом надел перчатку, сказал, что «надо всё по закону», и вышел с дочерью танцевать мазурку.\n\nУтром после бала рассказчик не мог спать и вышел на улицу. На поле у дома Вареньки он увидел, как солдаты наказывают татарина за побег: его вели между двумя рядами солдат, и каждый бил его палкой. Наказанием командовал отец Вареньки. Полковник ударил по лицу солдата, который бил недостаточно сильно, а потом увидел рассказчика и сделал вид, что не знает его. Рассказчику стало стыдно, и он ушёл домой.\n\nС этого дня его любовь к Вареньке стала проходить: когда она улыбалась, он вспоминал полковника на площади. Так один случай изменил всю его жизнь."
        rubric: ["开头写出框架：伊万·瓦西里耶维奇讲自己的故事，证明“一切在于偶然”", "写出舞会上的上校（手套、按规矩）", "写出清晨的场面和上校的行为", "写出结局：爱情消失，一生改变", "按原文顺序，第三人称，过去时，不用直接引语，不加评价", "130–170 词"]
        notes: "范文约 150 词。顺序：框架（开头）→ 舞会（第 4—6 段）→ 清晨（第 7—15 段）→ 结局（最后一段）。压缩的办法：环境描写（雾、融雪、铁匠的短皮袄）全部删去；受刑场面只留一句概括；上校的两句话只留“按规矩”，因为它和后面的场面形成对照；直接引语改成转述（[сказал, что «надо всё по закону»]{.ru} 保留引号里的原话，是概要中允许的短引用）。"

  - id: e5
    type: open
    task: 作品评论。就测试选文写一篇 250–300 词的评论：简要介绍作品，分析它的结构和主要手段，说明作品的思想，最后写出你自己的看法和理由。
    items:
      - prompt: "[Напишите отзыв о рассказе Л. Н. Толстого «После бала». Согласны ли вы с Иваном Васильевичем, что «всё дело в случае»?]{.ru}"
        length: 250–300
        model: "Рассказ «После бала» Лев Толстой написал в 1903 году, в конце своей долгой жизни. Это история о том, как одно утро изменило жизнь молодого человека.\n\nРассказ делится на две совсем разные части. Первая половина — бал: свет, музыка, любовь, счастье героя, который любит весь мир. Вторая половина — утро после бала: туман, мокрый снег, барабан и страшное наказание. Связывает две части полковник, отец Вареньки. Ночью он нежно танцует с дочерью и говорит, что «надо всё по закону». Утром тот же человек, в той же замшевой перчатке, бьёт по лицу солдата и следит, чтобы татарина били сильнее. Толстой ничего не объясняет и не оценивает: он только показывает детали, и читатель сам видит страшную связь между ними.\n\nГлавная мысль рассказа, по-моему, в том, что нельзя считать зло нормальным только потому, что «так принято» или «так по закону». Все вокруг считают наказание нормальным, но герой не может принять его и не может больше любить Вареньку. Он не борется со злом, но и не может жить рядом с ним спокойно.\n\nИван Васильевич говорит, что всё дело в случае. Я с ним согласен только отчасти. Да, утро после бала было случаем. Но тысячи других людей видели такие наказания и спокойно шли дальше. Герой изменился не только из-за случая, но и потому, что у него была живая совесть: он почувствовал стыд, хотя сам ничего плохого не сделал. Поэтому мне кажется, что случай только открывает человеку то, что уже есть в его душе.\n\nЭтот рассказ заставляет задуматься и сегодня: каждый из нас может оказаться на месте героя, когда рядом происходит несправедливость."
        rubric: ["开头介绍作者、作品和内容", "分析对照结构，至少举出一个贯穿两部分的细节（手套、“按规矩”）", "说出作者不评论、只写细节的手法", "概括作品的思想", "对“一切在于偶然”表明自己的看法并给出理由", "结尾联系今天或总结", "250–300 词"]
        notes: "范文约 255 词，分五段：介绍—结构与手段—思想—个人看法—结尾。评论和概要的区别在第二到第四段：每一段都在回答“怎样写的”“为什么这样写”“我怎样看”，而不是复述情节。第四段先让步（[Да, утро после бала было случаем]{.ru}），再用 [Но]{.ru} 转折，这是第 26 课学过的论证方法。评论里可以不同意人物，甚至不同意作者，但要给出理由。"
