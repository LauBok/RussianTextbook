lesson: B3-L51
grammar: "复合前置词：[в тече́ние]{.ru} + 第二格（一段时间之内），[в свя́зи с]{.ru} + 第五格（由于），[по сравне́нию с]{.ru} + 第五格（与……相比），[в отли́чие от]{.ru} + 第二格（与……不同）；[в течение]{.ru} 与 [во время]{.ru} 的区别。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Кто такой Самсон Вырин и с кем он жил? Что изображали картинки в его доме? Как Минский остался на станции на несколько дней и что потом рассказал врач? Как Дуня уехала из дома? Что Вырин увидел в Петербурге? Кто приезжал на могилу смотрителя?]{.ru}"
        length: 80–110
        model: "Самсон Вырин был станционным смотрителем, он жил вместе с дочерью Дуней. Картинки в его доме изображали историю блудного сына из Евангелия. Минский сказал, что у него болит голова, и в течение нескольких дней лежал в комнате смотрителя, а Дуня ухаживала за ним. Позже врач признался, что гусар был совершенно здоров. В воскресенье Минский предложил довезти Дуню до церкви, и отец сам уговорил её поехать, но в церковь она не приехала. В Петербурге Вырин увидел, что дочь живёт в богатой квартире; увидев отца, она упала без чувств, а Минский выгнал старика. На могилу смотрителя приезжала прекрасная барыня с тремя детьми — это была Дуня."
        rubric: ["六个问题都回答，情节与课文一致", "[ухаживать за кем]{.ru}、[уговорить кого]{.ru} 支配正确", "用完整的句子"]
        notes: "第 3 题要说出明斯基是装病留下的：他说头疼，一连几天躺在驿站长的房间里。第 4 题要说出是父亲亲自劝女儿上车的，这是故事里最让人心痛的细节。第 6 题课文没有直接说出杜尼娅的名字，直到最后一句才点明，回答时可以直接说是杜尼娅。"

  - id: e2
    type: choice
    task: 选择正确的复合前置词。
    why: "先看后面的名词用什么格，再看意思。第 1 题 [нескольких дней]{.ru} 是第二格，表示一段时间，用 [в течение]{.ru}；[во время]{.ru} 后面要接事件，不接 [дни]{.ru}、[годы]{.ru} 这类时间名词。第 2 题 [болезнью]{.ru} 是第五格，说明原因，用 [в связи с]{.ru}。第 3 题 [прошлым разом]{.ru} 是第五格，句中有比较的意思（变得更穷了），用 [по сравнению с]{.ru}。第 4 题 [героя]{.ru} 是第二格，说的是两人命运不同，用 [в отличие от]{.ru}；[по сравнению с]{.ru} 要第五格。第 5 题 [болезни]{.ru} 是事件，用 [во время]{.ru}，不能说 [в течение болезни]{.ru}。"
    items:
      - stem: ___ нескольких дней гусар лежал в комнате смотрителя.
        options: [В течение, Во время, В связи с]
        answer: В течение
      - stem: ___ болезнью гостя смотрителю пришлось вызвать врача.
        options: [В течение, В связи с, В отличие от]
        answer: В связи с
      - stem: ___ прошлым разом дом стал беднее.
        options: [В отличие от, В течение, По сравнению с]
        answer: По сравнению с
      - stem: ___ героя истории из Евангелия, Дуня вернулась слишком поздно.
        options: [По сравнению с, В отличие от, В связи с]
        answer: В отличие от
      - stem: ___ болезни гостя Дуня не отходила от него.
        options: [Во время, В течение, По сравнению с]
        answer: Во время

  - id: e3
    type: fill
    task: 把括号里的词变成复合前置词要求的形式。
    why: "[в течение]{.ru}、[в отличие от]{.ru}、[в результате]{.ru} 要第二格，[в связи с]{.ru}、[по сравнению с]{.ru} 要第五格。第 1 题 [последние годы]{.ru} 变复数第二格 [последних лет]{.ru}，[год]{.ru} 的复数第二格是 [лет]{.ru}，不是 [годов]{.ru}。第 2 题 [дела]{.ru} 复数第五格 [делами]{.ru}。第 3 题 [отец]{.ru} 第五格 [отцом]{.ru}，词干里的 [е]{.ru} 脱落。第 4 题 [Минский]{.ru} 是姓，按形容词变格，第二格 [Минского]{.ru}。第 5 题 [болезнь]{.ru} 第二格 [болезни]{.ru}。"
    items:
      - stem: В течение ___ жизни смотритель много пил.
        hint: последние годы
        accept: ["последних лет"]
      - stem: В связи с ___ рассказчик опять оказался в тех местах.
        hint: дела
        accept: ["делами"]
      - stem: По сравнению с ___ Дуня была очень молодой.
        hint: отец
        accept: ["отцом"]
      - stem: В отличие от ___ смотритель верил людям.
        hint: Минский
        accept: ["Минского"]
      - stem: В результате ___ старик не мог работать.
        hint: болезнь
        accept: ["болезни"]

  - id: e4
    type: rewrite
    task: 用复合前置词改写句子，把从句或 [потому что]{.ru} 变成前置词短语。
    example:
      cue: Смотрителю пришлось вызвать врача, потому что гость заболел.
      answer: В связи с болезнью гостя смотрителю пришлось вызвать врача.
    why: "改写时要把从句里的动词换成同根名词：[заболел → болезнь]{.ru}，[уехала → отъезд]{.ru}。第 1 题 [отъезд]{.ru} 第五格 [отъездом]{.ru}，[дочери]{.ru} 作非一致定语用第二格。第 2 题“和上次比”用 [по сравнению с]{.ru} + 第五格 [прошлым разом]{.ru}。第 3 题“三年里”用 [в течение]{.ru} + 第二格 [трёх лет]{.ru}。第 4 题“不像父亲那样”用 [в отличие от]{.ru} + 第二格 [отца]{.ru}；这里只能用 [в отличие от]{.ru}，因为说的是两人做法不同，而不是程度高低。"
    items:
      - cue: Старик заболел, потому что дочь уехала.
        accept: ["В связи с отъездом дочери старик заболел.", "Старик заболел в связи с отъездом дочери."]
      - cue: "Дом стал беднее, чем в прошлый раз."
        accept: ["По сравнению с прошлым разом дом стал беднее.", "Дом стал беднее по сравнению с прошлым разом."]
      - cue: Три года Дуня не писала отцу.
        accept: ["В течение трёх лет Дуня не писала отцу.", "Дуня не писала отцу в течение трёх лет."]
      - cue: "Отец верил людям, а Минский не верил никому."
        accept: ["В отличие от отца, Минский не верил никому.", "Минский, в отличие от отца, не верил никому.", "В отличие от Минского, отец верил людям.", "Отец, в отличие от Минского, верил людям."]

  - id: e5
    type: translate
    task: 翻译下列句子，用上本课的复合前置词。
    items:
      - zh: 一连几天杜尼娅都在照料客人。
        accept: ["В течение нескольких дней Дуня ухаживала за гостем.", "Дуня ухаживала за гостем в течение нескольких дней."]
        rubric: ["[в течение]{.ru} + 第二格 [нескольких дней]{.ru}", "[ухаживать за]{.ru} + 第五格", "动作持续，用未完成体"]
      - zh: 与上一次相比，驿站长老了很多。
        accept: ["По сравнению с прошлым разом смотритель сильно постарел.", "По сравнению с прошлым разом смотритель очень постарел.", "Смотритель сильно постарел по сравнению с прошлым разом.", "По сравнению с прошлым разом станционный смотритель сильно постарел."]
        rubric: ["[по сравнению с]{.ru} + 第五格 [прошлым разом]{.ru}", "“老了”用完成体 [постарел]{.ru}"]
      - zh: 由于客人生病，驿站长去请了医生。
        accept: ["В связи с болезнью гостя смотритель вызвал врача.", "Смотритель вызвал врача в связи с болезнью гостя.", "В связи с тем, что гость заболел, смотритель вызвал врача."]
        rubric: ["[в связи с]{.ru} + 第五格 [болезнью]{.ru}", "[гостя]{.ru} 作非一致定语用第二格", "[вызвать врача]{.ru}：请医生"]

  - id: e7
    type: fill
    task: 用课文里的新词填空，注意词形。
    why: "第 1 题“薪水”是 [жалованье]{.ru}，[маленькое]{.ru} 是中性，所以名词是中性第四格。第 2 题“忍受粗暴”：[терпеть]{.ru} 接第四格 [грубость]{.ru}，阴性名词第四格同第一格。第 3 题 [с]{.ru} + 第五格表示方式：[с сочувствием]{.ru}。第 4 题感情作主语，[охватить]{.ru} 过去时与阴性 [тревога]{.ru} 一致：[охватила]{.ru}。第 5 题“病倒”是 [слечь]{.ru}，过去时阳性 [слёг]{.ru}，词干有变化，容易写错。"
    items:
      - stem: Смотрители получали маленькое ___.
        hint: 薪水
        accept: ["жалованье"]
      - stem: Они постоянно терпели ___ проезжающих.
        hint: 粗暴
        accept: ["грубость"]
      - stem: Рассказчик относится к смотрителям с ___.
        hint: 同情
        accept: ["сочувствием"]
      - stem: Не прошло и получаса, как его ___ тревога.
        hint: охватить
        accept: ["охватила"]
      - stem: Старик ___ от горя.
        hint: слечь
        accept: ["слёг"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，先亮出你的看法，再用课文里的细节说明理由，最后得出结论。
    items:
      - prompt: "[Кто виноват в судьбе Самсона Вырина?]{.ru} 至少用两个本课的复合前置词，并用上 [по-моему]{.ru}、[конечно]{.ru}、[поэтому]{.ru} 这类表示看法和推理的词。"
        length: 180–220
        model: "По-моему, в судьбе Самсона Вырина виноват не один человек. Конечно, больше всех виноват Минский. Он обманул старика: сказал, что болен, а потом забрал у него дочь. Когда отец пришёл к нему в Петербург, Минский не стал с ним говорить, сунул ему в рукав деньги и выгнал за дверь. Этот поступок показывает, что для богатого гусара бедный смотритель был не человеком, а вещью. Но виновата и Дуня. В течение нескольких лет она ни разу не написала отцу, хотя знала, что он живёт один. Она приехала на станцию только тогда, когда отец уже умер. Наконец, в какой-то мере виноват и сам Вырин: он сам уговорил дочь сесть к гусару. Однако понять его можно: он верил людям и не думал, что гость его обманет. По сравнению с другими героями смотрителя читателю жалко больше всех. Пушкин не говорит прямо, кто виноват, но, например, картинки с историей блудного сына помогают понять его мнение. В отличие от отца из Евангелия, Вырин так и не увидел свою дочь дома. Мне кажется, Пушкин жалеет всех своих героев, но больше всего — маленького бедного человека, который не может сам себе помочь. Поэтому я думаю, что эта повесть прежде всего о том, как легко потерять близкого человека и как поздно мы это понимаем."
        rubric: ["开头一句明确表达看法", "至少两条理由，每条都有课文细节支撑", "有结论句，与开头呼应", "至少两个复合前置词，格用对", "180–220 词"]
        notes: "范文约 200 词，结构是“看法—理由—让步—结论”：第一句亮出看法（不只一个人有错）；接着按责任大小依次说明明斯基、杜尼娅、维林本人，每条理由后面都跟着课文里的具体细节；[Однако понять его можно]{.ru} 是让步，使论证更全面；最后用 [Поэтому я думаю…]{.ru} 得出结论。表示看法的说法：[по-моему, мне кажется, я думаю]{.ru}；列举理由：[конечно, но, наконец]{.ru}；引出例子：[например]{.ru}。用了三个复合前置词：[в течение нескольких лет]{.ru}、[по сравнению с другими героями]{.ru}、[в отличие от отца]{.ru}。"
