lesson: L90
heading: 单元测试
intro: 本测试覆盖第九单元全部语法。答对 80% 以上再进入第十单元；没有达到的，回到相应的课复习后重做。
grammar: "[встава́ть]{.ru} 类动词和 [-ся]{.ru} 动词；[снача́ла…, пото́м…]{.ru}；[когда́]{.ru} 从句；[е́сли]{.ru} 条件句；[потому́ что]{.ru}、[поэ́тому]{.ru}；[бо́лен]{.ru}、[здоро́в]{.ru}；[у кого́ боли́т]{.ru}，两个 [боле́ть]{.ru}；比较级与 [чем]{.ru}；[свой]{.ru}；间接引语（[что]{.ru}、疑问词、[ли]{.ru}）。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的正确形式。
    why: "[встава́ть]{.ru}、[устава́ть]{.ru}、[дава́ть]{.ru} 的现在时去掉 [-ва-]{.ru}：[встаёт, устаёшь, даю́т]{.ru}，写成 [встава́ет]{.ru} 是最常见的错误；命令式保留 [-ва-]{.ru}：[встава́й]{.ru}。[ложи́ться]{.ru} 词干末尾是 [ж]{.ru}，复数第三人称写 [-ат]{.ru}：[ложа́тся]{.ru}；主语是人、表示“洗脸”要用带 [-ся]{.ru} 的 [умыва́юсь]{.ru}。"
    items:
      - stem: Ива́н Серге́евич всегда́ ___ в шесть.
        hint: встава́ть
        accept: [встаёт]
      - stem: Ты не ___? Ты так мно́го занима́ешься!
        hint: устава́ть
        accept: [устаёшь]
      - stem: Ми́ша, ___! Уже́ во́семь часо́в!
        hint: встава́ть
        accept: [встава́й]
      - stem: Ка́ждое у́тро я бы́стро ___ и одева́юсь.
        hint: умыва́ться
        accept: [умыва́юсь]
      - stem: Ми́ша и А́нна ___ спать по́здно.
        hint: ложи́ться
        accept: [ложа́тся]
      - stem: Врачи́ в поликли́нике ___ спра́вки.
        hint: дава́ть
        accept: [даю́т]

  - id: e2
    type: choice
    task: 选择正确的连接词或动词形式。
    why: "[когда́]{.ru} 说一定会发生的事，[е́сли]{.ru} 说不一定发生的事（第 1、2 题）。说将来的事，[е́сли]{.ru}、[когда́]{.ru} 从句也要用将来时，不能用现在时 [идёт]{.ru}、[за́втракаю]{.ru}（第 3、4 题）。[потому́ что]{.ru} 引出原因，[поэ́тому]{.ru} 引出结果，两者不能同时用（第 5、6 题）。“是否”用 [ли]{.ru}，不能用 [е́сли]{.ru}（第 7 题）。"
    items:
      - stem: ___ за́втра бу́дет хоро́шая пого́да, мы пое́дем к ба́бушке.
        options: [Е́сли, Когда́, Потому́ что]
        answer: Е́сли
      - stem: ___ я поза́втракаю, я позвоню́ тебе́.
        options: [Когда́, Потому́ что, Поэ́тому]
        answer: Когда́
      - stem: Е́сли за́втра ___ дождь, мы бу́дем сиде́ть до́ма.
        options: [идёт, бу́дет, был]
        answer: бу́дет
      - stem: Когда́ я ___, я позвоню́ тебе́.
        options: [за́втракаю, поза́втракаю, поза́втракал]
        answer: поза́втракаю
      - stem: Ван Лэй не́ был на уро́ке, ___ он был бо́лен.
        options: [потому́ что, поэ́тому, е́сли]
        answer: потому́ что
      - stem: Шёл дождь, ___ мы бы́ли до́ма.
        options: [потому́ что, поэ́тому, когда́]
        answer: поэ́тому
      - stem: Она́ спроси́ла, гото́в ___ я к контро́льной.
        options: [ли, е́сли, что]
        answer: ли

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "“疼”的 [боле́ть]{.ru} 和身体部位一致：[голова́]{.ru} 单数用 [боли́т]{.ru}，[у́ши]{.ru}、[глаза́]{.ru} 复数用 [боля́т]{.ru}；过去时还要分性：[го́рло]{.ru} 中性用 [боле́ло]{.ru}。人作主语、表示“生病”的是第一变位 [боле́ть]{.ru}：[боле́ете]{.ru}。短尾形容词和主语一致：[А́нна]{.ru} 用阴性 [больна́]{.ru}，[мы]{.ru} 用复数 [здоро́вы]{.ru}。"
    items:
      - stem: У меня́ ___ голова́.
        options: [боли́т, боля́т, боле́ет]
        answer: боли́т
      - stem: У тебя́ не ___ у́ши?
        options: [боли́т, боля́т, боле́ют]
        answer: боля́т
      - stem: Вчера́ у Ван Лэ́я ___ го́рло.
        options: [боле́л, боле́ла, боле́ло]
        answer: боле́ло
      - stem: Вы давно́ ___?
        options: [боли́те, боле́ете, боля́т]
        answer: боле́ете
      - stem: Вчера́ А́нна была́ ___.
        options: [бо́лен, больна́, больны́]
        answer: больна́
      - stem: Сейча́с мы уже́ ___.
        options: [здоро́в, здоро́ва, здоро́вы]
        answer: здоро́вы

  - id: e4
    type: choice
    task: 选择 [свой]{.ru} 或 [его́]{.ru}、[её]{.ru} 的正确形式。
    why: "东西属于句子主语时，第三人称用 [свой]{.ru}，并按名词的格变化：[свой телефо́н]{.ru}（第四格非动物）、[свое́й ма́ме]{.ru}（第三格）、[свою́ тетра́дь]{.ru}（第四格阴性）。第 4 题本子是安娜的，主语是王磊，所以用 [её]{.ru}。第 5 题 [ма́ма]{.ru} 本身是主语，[свой]{.ru} 不修饰主语，只能用 [его́]{.ru}。"
    items:
      - stem: Ми́ша ка́ждый день и́щет ___ телефо́н.
        options: [свой, своего́, его́]
        answer: свой
      - stem: Ван Лэй написа́л письмо́ ___ ма́ме.
        options: [свое́й, свою́, его́]
        answer: свое́й
      - stem: А́нна взяла́ ___ тетра́дь и пошла́ занима́ться.
        options: [свою́, свое́й, её]
        answer: свою́
      - stem: А́нна дала́ Ван Лэ́ю тетра́дь. Ван Лэй перепи́сывал упражне́ния из ___ тетра́ди.
        options: [свое́й, её, его́]
        answer: её
      - stem: Ван Лэй написа́л письмо́. ___ ма́ма отве́тила о́чень бы́стро.
        options: [Своя́, Его́, Свое́й]
        answer: Его́

  - id: e5
    type: rewrite
    task: 把直接引语改成间接引语。
    why: "陈述句用 [что]{.ru}；带疑问词的问句保留疑问词，不加 [что]{.ru}；不带疑问词的问句把焦点词放在从句最前面，后面紧跟 [ли]{.ru}。人称要按转述人的角度改：[я → она́]{.ru}，[вы → я]{.ru}，[у вас → у меня́]{.ru}。动词的时不变：[позвоню́ → позвони́т]{.ru} 仍是将来时。句末用句号。"
    example:
      cue: "Ка́тя сказа́ла: «Я купи́ла биле́ты»."
      answer: Ка́тя сказа́ла, что купи́ла биле́ты.
    items:
      - cue: "Ка́тя сказа́ла: «Я позвоню́ ве́чером»."
        accept: ["Ка́тя сказа́ла, что позвони́т ве́чером.", "Ка́тя сказа́ла, что она́ позвони́т ве́чером."]
      - cue: "А́нна спроси́ла: «Где бу́дет конце́рт?»"
        accept: ["А́нна спроси́ла, где бу́дет конце́рт."]
      - cue: "О́льга Ви́кторовна спроси́ла меня́: «Вы здоро́вы?»"
        accept: ["О́льга Ви́кторовна спроси́ла меня́, здоро́в ли я.", "О́льга Ви́кторовна спроси́ла меня́, здоро́ва ли я."]
      - cue: "Врач спроси́ла меня́: «У вас есть спра́вка?»"
        accept: ["Врач спроси́ла меня́, есть ли у меня́ спра́вка."]
      - cue: "Ми́ша спроси́л Ван Лэ́я: «Где лу́чше: в Москве́ и́ли в Петербу́рге?»"
        accept: ["Ми́ша спроси́л Ван Лэ́я, где лу́чше: в Москве́ и́ли в Петербу́рге.", "Ми́ша спроси́л Ван Лэ́я, где лу́чше, в Москве́ и́ли в Петербу́рге."]

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊吃早饭时听广播；星期六下雨，全家没去奶奶家；王磊忘了带伞，冻病了；医生说是感冒不是流感；他觉得彼得堡更漂亮，但更喜欢莫斯科；卡佳打电话说买到了音乐会的票；测验他得了五分。
    items:
      - stem: Когда́ Ван Лэй за́втракает, он ___.
        options: [слу́шает ра́дио, чита́ет кни́гу, смо́трит телеви́зор]
        answer: слу́шает ра́дио
      - stem: В суббо́ту Петро́вы не пое́хали к ба́бушке, потому́ что ___.
        options: [шёл дождь, Ван Лэй был бо́лен, ба́бушки не́ было до́ма]
        answer: шёл дождь
      - stem: Ван Лэй заболе́л, потому́ что ___.
        options: [забы́л зонт, до́лго сиде́л в библиоте́ке, ката́лся на лы́жах]
        answer: забы́л зонт
      - stem: У Ван Лэ́я был ___.
        options: ["грипп", "не грипп, а просту́да"]
        answer: не грипп, а просту́да
      - stem: Ван Лэ́ю бо́льше нра́вится ___.
        options: [Москва́, Петербу́рг]
        answer: Москва́
      - stem: Ка́тя сказа́ла, что ___.
        options: [купи́ла биле́ты на конце́рт, позвони́т в понеде́льник, А́нна у ба́бушки]
        answer: купи́ла биле́ты на конце́рт
      - stem: За контро́льную Ван Лэй получи́л ___.
        options: [пятёрку, тро́йку]
        answer: пятёрку

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题条件说的是将来，从句、主句都用将来时；没有动词的“下雨”要用 [бу́дет дождь]{.ru}。第 2 题“我头疼”的“我”用 [у меня́]{.ru}，“疼”和 [голова́]{.ru} 一致用 [боли́т]{.ru}；“因为……所以……”只能用一个连词。第 3 题比较对象用 [чем]{.ru} 引出，“好多了”加 [гора́здо]{.ru}。第 4 题“是否”用 [ли]{.ru}，焦点词 [зна́ю]{.ru} 放在前面。
    items:
      - zh: 如果明天下雨，我们就待在家里。
        accept: ["Е́сли за́втра бу́дет дождь, мы бу́дем до́ма.", "Е́сли за́втра бу́дет дождь, мы бу́дем сиде́ть до́ма.", "Мы бу́дем до́ма, е́сли за́втра бу́дет дождь.", "Мы бу́дем сиде́ть до́ма, е́сли за́втра бу́дет дождь."]
        rubric: ["从句用将来时 [бу́дет дождь]{.ru}，不能用 [идёт]{.ru}", "主句用将来时 [бу́дем]{.ru}"]
      - zh: 我没来上课，因为我头疼。
        accept: ["Я не́ был на уро́ке, потому́ что у меня́ боле́ла голова́.", "Я не была́ на уро́ке, потому́ что у меня́ боле́ла голова́.", "Я не́ был на заня́тиях, потому́ что у меня́ боле́ла голова́.", "Я не была́ на заня́тиях, потому́ что у меня́ боле́ла голова́."]
        rubric: ["[не́ был / не была́]{.ru} 表示没去过", "[потому́ что]{.ru} 引出原因", "[у меня́ боле́ла голова́]{.ru}：人用 [у]{.ru} + 第二格，动词与 [голова́]{.ru} 一致，用过去时"]
      - zh: 今天我觉得比昨天好多了。
        accept: ["Сего́дня мне гора́здо лу́чше, чем вчера́.", "Мне сего́дня гора́здо лу́чше, чем вчера́.", "Мне гора́здо лу́чше сего́дня, чем вчера́.", "Сего́дня я чу́вствую себя́ гора́здо лу́чше, чем вчера́.", "Я сего́дня чу́вствую себя́ гора́здо лу́чше, чем вчера́.", "Сего́дня я гора́здо лу́чше чу́вствую себя́, чем вчера́."]
        rubric: ["无人称句 [мне лу́чше]{.ru}，或 [я чу́вствую себя́ лу́чше]{.ru}", "[гора́здо лу́чше, чем вчера́]{.ru}"]
      - zh: 王磊问我知不知道你住在哪儿。
        accept: ["Ван Лэй спроси́л меня́, зна́ю ли я, где ты живёшь.", "Ван Лэй спроси́л, зна́ю ли я, где ты живёшь."]
        rubric: ["一般疑问用 [зна́ю ли я]{.ru}，[ли]{.ru} 紧跟 [зна́ю]{.ru}", "“住在哪儿”保留疑问词 [где]{.ru}", "不能用 [е́сли]{.ru} 表示“是否”"]

  - id: e8
    type: open
    task: 缩写。
    items:
      - prompt: 按下面的问题，用王磊的口吻（第一人称）讲讲他生病的那个星期，连成一段话：你为什么病了？你哪里疼？医生说了什么？谁帮了你？你回学校那天老师问了什么？
        length: 60–100
        model: "В суббо́ту мы с А́нной пошли́ в кино́. Шёл дождь, а я забы́л свой зонт, поэ́тому о́чень замёрз и заболе́л. В понеде́льник я не́ был на уро́ке, потому́ что у меня́ была́ высо́кая температу́ра. У меня́ боле́ли голова́ и го́рло. Врач сказа́ла, что э́то не грипп, а просту́да. Мари́я Никола́евна дава́ла мне лека́рство и чай с мёдом, а А́нна дала́ мне свою́ тетра́дь. Че́рез неде́лю я взял спра́вку и пое́хал в университе́т. О́льга Ви́кторовна спроси́ла, здоро́в ли я и де́лал ли я упражне́ния. Пото́м была́ контро́льная, и я получи́л пятёрку."
        rubric: ["说明生病的原因，用 [потому́ что]{.ru} 或 [поэ́тому]{.ru}", "[у меня́ боле́л(а, о, и) …]{.ru} 和身体部位一致", "医生的话用 [что]{.ru} 转述，老师的问题用 [ли]{.ru} 转述", "至少用一次 [свой]{.ru}", "第一人称，过去时"]
        notes: 范文按时间顺序讲：怎么病的、哪里疼、医生怎么说、谁帮忙、回校。原因和结果各用了一次（[поэ́тому]{.ru}、[потому́ что]{.ru}）；医生的话用 [что]{.ru} 转述，老师的两个问题都是一般疑问句，用 [ли]{.ru} 转述，人称改成 [я]{.ru}。[свой зонт]{.ru} 指自己的伞，[свою́ тетра́дь]{.ru} 指安娜自己的本子，因为两句的主语分别是 [я]{.ru} 和 [А́нна]{.ru}。[дава́ла]{.ru} 用未完成体，表示那几天反复给药；[получи́л пятёрку]{.ru} 用完成体，表示结果。
