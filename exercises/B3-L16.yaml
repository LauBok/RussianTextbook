lesson: B3-L16
grammar: "无人称句：谓语副词（[душно, скучно, жаль]{.ru}）、情态词（[можно, нельзя, надо, пора]{.ru}）加不定式、无人称动词（[хочется, не спится, кажется, приходится, удалось, не хватает]{.ru}），主体用第三格；动词用第三人称单数或过去时中性。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Какая длина у Транссибирской магистрали и когда её построили? Как пассажиры едят и пьют в поезде? Что можно купить на станциях? Чего не хватает пассажирам в поезде и что у них появляется? Почему автору было жаль расставаться с поездом?]{.ru}"
        length: 60–90
        model: "Длина Транссибирской магистрали — 9288 километров. Её начали строить в 1891 году, а движение по всей линии открыли в 1916 году. Обедать в поезде можно в вагоне-ресторане, но большинство пассажиров берёт еду с собой, а горячую воду можно взять в любое время. На станциях местные жители продают пирожки, горячую картошку, огурцы, а на Байкале — омуля. Пассажирам не хватает интернета, зато у них появляется время, чтобы читать, смотреть в окно и разговаривать с соседями. Автору было жаль расставаться с поездом, потому что за неделю поезд стал для него почти родным домом."
        rubric: ["五个问题都回答，数字准确（9288 公里、1891、1916）", "至少两处无人称句，主体用第三格", "用完整的句子"]
        notes: "范文约 90 词。第 4 题用 [не хватает]{.ru} 加第二格回答：[пассажирам не хватает интернета]{.ru}。第 5 题用 [было жаль]{.ru}，主体 [автору]{.ru} 用第三格。"

  - id: e2
    type: rewrite
    task: 把人称句改写成无人称句，意思不变。
    example:
      cue: Я не могу уснуть.
      answer: Мне не спится.
    why: "无人称句里人用第三格。第 1 题 [хотеть → хочется]{.ru}，[я → мне]{.ru}。第 2 题“成功做到”用 [удалось]{.ru}，过去时中性。第 3 题“不得不”用 [приходится]{.ru}。第 4 题 [у нас мало времени]{.ru} 换成 [нам не хватает времени]{.ru}，[времени]{.ru} 是第二格，动词单数。第 5 题 [скучали → было скучно]{.ru}，[было]{.ru} 用中性。第 6 题 [казалось]{.ru} 也是无人称，[мы → нам]{.ru}。"
    items:
      - cue: Я хочу пить.
        accept: ["Мне хочется пить."]
      - cue: Мы смогли купить билеты на поезд «Россия».
        accept: ["Нам удалось купить билеты на поезд «Россия»."]
      - cue: Пассажиры должны каждый день переводить часы.
        accept: ["Пассажирам приходится каждый день переводить часы.", "Пассажирам каждый день приходится переводить часы.", "Пассажирам нужно каждый день переводить часы.", "Пассажирам надо каждый день переводить часы."]
      - cue: У нас мало времени.
        accept: ["Нам не хватает времени."]
      - cue: Мы не скучали в поезде.
        accept: ["Нам не было скучно в поезде.", "В поезде нам не было скучно.", "Нам было не скучно в поезде.", "В поезде нам было не скучно."]
      - cue: Мы думали, что лесам нет конца.
        accept: ["Нам казалось, что лесам нет конца."]

  - id: e3
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "无人称句里人或事物的主体用第三格，缺少的东西（[не хватает]{.ru} 后面）用第二格。第 1 题 [пассажирам]{.ru} 复数第三格。第 2 题 [времени]{.ru} 第二格，[-мя]{.ru} 结尾的中性名词第二格是 [-мени]{.ru}。第 3 题 [мне]{.ru}。第 4 题 [нам]{.ru}。第 5 题 [воды]{.ru} 第二格。第 6 题 [студенту]{.ru} 第三格；[пришлось]{.ru} 是 [прийтись]{.ru} 的过去时中性。"
    items:
      - stem: ___ не хватает интернета.
        hint: пассажиры
        accept: ["Пассажирам"]
      - stem: Нам всё время не хватало ___.
        hint: время
        accept: ["времени"]
      - stem: ___ удалось увидеть обелиск «Европа — Азия».
        hint: я
        accept: ["Мне"]
      - stem: ___ было жаль расставаться с поездом.
        hint: мы
        accept: ["Нам"]
      - stem: В жарком купе нам не хватало ___.
        hint: вода
        accept: ["воды"]
      - stem: ___ пришлось бежать к вагону.
        hint: студент
        accept: ["Студенту"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "无人称句的动词和系词用中性单数（过去时 [-о]{.ru}）。第 1 题 [было]{.ru}。第 2 题 [не хватало]{.ru}，不跟复数第二格 [мест]{.ru} 一致。第 3 题 [не спалось]{.ru}。第 4 题 [кажется]{.ru} 的主体用第三格 [Мне]{.ru}。第 5 题 [было]{.ru}。第 6 题 [удалось]{.ru}，主体 [нам]{.ru} 第三格，不能和 [мы]{.ru} 连用。"
    items:
      - stem: Нам совсем не ___ скучно.
        options: [был, было, были]
        answer: было
      - stem: В вагоне-ресторане пассажирам не ___ мест.
        options: [хватало, хватали, хватала]
        answer: хватало
      - stem: Мне всю ночь не ___.
        options: [спалось, спался, спала]
        answer: спалось
      - stem: ___ кажется, что лесам нет конца.
        options: [Я, Мне, Меня]
        answer: Мне
      - stem: Ночью в купе ___ очень душно.
        options: [был, было, была]
        answer: было
      - stem: ___ удалось разглядеть обелиск.
        options: [Мы, Нам, Нас]
        answer: Нам

  - id: e5
    type: translate
    task: 翻译下列句子，用无人称句。
    items:
      - zh: 第一夜我睡不着。
        accept: ["В первую ночь мне не спалось.", "Мне не спалось в первую ночь."]
        rubric: ["[мне не спалось]{.ru}：无人称动词过去时中性", "[в первую ночь]{.ru}：[в]{.ru} + 第四格"]
      - zh: 乘客们缺网络，但是有了看书的时间。
        accept: ["Пассажирам не хватает интернета, зато у них появляется время читать.", "Пассажирам не хватает интернета, но у них появляется время для чтения.", "Пассажирам не хватает интернета, но у них появляется время читать.", "Пассажирам не хватает интернета, зато появляется время читать."]
        rubric: ["[пассажирам не хватает интернета]{.ru}：第三格 + 第二格", "[появляется время]{.ru}"]
      - zh: 去年夏天，我终于坐上了西伯利亚大铁路。
        accept: ["Прошлым летом мне удалось проехать по Транссибу.", "Прошлым летом мне наконец удалось проехать по Транссибу.", "Прошлым летом мне наконец удалось поехать по Транссибу.", "Прошлым летом мне удалось поехать по Транссибу."]
        rubric: ["[мне удалось]{.ru} + 完成体不定式", "[прошлым летом]{.ru}：第五格表示时间"]
      - zh: 我们舍不得和列车分别。
        accept: ["Нам было жаль расставаться с поездом.", "Нам жаль расставаться с поездом.", "Нам было жалко расставаться с поездом."]
        rubric: ["[нам жаль]{.ru}：谓语副词 + 第三格", "[расставаться с чем]{.ru}"]

  - id: e6
    type: open
    task: 缩写与句式改写。以第一人称把课文压缩成一段，至少用五处不同类型的无人称句；至少用两处副动词短语，其中一处由课文的从句或并列谓语改写而来。
    items:
      - prompt: "提纲：西伯利亚大铁路的数据；第一夜；火车上的饮食；乌拉尔和方尖碑；西伯利亚和车站；时间和网络；旅伴；到达。"
        length: 120–150
        model: "Транссибирская магистраль — самая длинная железная дорога в мире: от Москвы до Владивостока 9288 километров. Прошлым летом мне удалось проехать по ней. В первую ночь мне не спалось, а в купе было душно. Обедать можно в вагоне-ресторане, но большинство пассажиров берёт еду с собой. Проезжая Урал, все смотрели в окна: каждому хотелось увидеть обелиск «Европа — Азия». За Уралом тянутся леса, и кажется, что им нет конца. Выйдя на платформу, можно купить пирожки, но нельзя опаздывать: поезд никого не ждёт. Почти каждый день приходится переводить часы, а пассажирам не хватает интернета. Зато нам было не скучно: мы делились едой и спорили о книгах. Приехав во Владивосток, я почувствовал, что мне жаль расставаться с поездом, ставшим почти родным домом."
        rubric: ["提纲八项都有，数字准确", "至少五处不同类型的无人称句", "至少两处副动词短语，一处由课文的从句或并列谓语改写", "120–150 词"]
        notes: "范文约 130 词。无人称句：[мне удалось]{.ru}、[мне не спалось]{.ru}、[было душно]{.ru}、[можно / нельзя]{.ru}、[хотелось]{.ru}、[кажется]{.ru}、[приходится]{.ru}、[не хватает]{.ru}、[было не скучно]{.ru}、[жаль]{.ru}。副动词短语：[проезжая Урал]{.ru}、[выйдя на платформу]{.ru}（由课文“可以走到站台上”的并列结构改写）、[приехав во Владивосток]{.ru}（由课文 [мы приехали во Владивосток]{.ru} 改写）。"
