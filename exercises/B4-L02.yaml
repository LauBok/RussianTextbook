lesson: B4-L02
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Где и почему Червяков почувствовал, что ему нужно извиниться? Сколько раз он извинялся перед генералом и как отвечал генерал? Что посоветовала ему жена? Почему Червяков не написал письма? Чем кончилась последняя встреча?]{.ru}"
        length: 90–130
        model: "Червяков был в театре и чихнул, а потом увидел, что обрызгал старичка, который сидел перед ним. Это был статский генерал Бризжалов, хотя и не его начальник. Червяков извинился сразу, потом ещё раз в антракте. Генерал сначала сказал «ничего, ничего», а потом — что уже забыл. Жена посоветовала мужу сходить к генералу и извиниться ещё раз, чтобы тот не подумал, будто Червяков не умеет держать себя в публике. На другой день Червяков дважды пытался объяснить генералу, что чихнул нечаянно, и генерал решил, что над ним смеются. Письмо Червяков не написал, потому что так и не смог его выдумать. На третий день генерал не выдержал и крикнул: «Пошёл вон!» Червяков вернулся домой, лёг на диван и умер."
        rubric: ["五个问题都回答，情节与选文一致", "道歉的次数和场合说清楚：剧场里、幕间、接待室两次、第二天", "结尾：将军大吼，切尔维亚科夫回家死去"]
        notes: "回答第 2 题时可以按时间顺序列出：剧场里一次，幕间一次，第二天在接待室两次，第三天一次。注意将军的回答一次比一次不耐烦，这是情节发展的线索。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[сконфузиться]{.ru}"
        accept: ["Почувствовать себя неловко.", "Почувствовать, что сделал что-то неловкое.", "Стать неловко от того, что сделал."]
        rubric: ["说明是感到难为情、不好意思"]
      - zh: "[нечаянно]{.ru}"
        accept: ["Не нарочно, случайно.", "Случайно, без желания.", "Сам не желая этого."]
        rubric: ["说明是无意的、不是故意的"]
      - zh: "[проситель]{.ru}"
        accept: ["Человек, который пришёл к начальнику с просьбой.", "Тот, кто приходит с просьбой или прошением.", "Человек, который о чём-то просит начальника."]
        rubric: ["说明是带着请求、呈文来求见的人"]
      - zh: "[раскаяние]{.ru}"
        accept: ["Чувство, когда человек жалеет о том, что сделал.", "Сожаление о своей ошибке.", "Чувство вины за то, что сделал."]
        rubric: ["说明是对自己做过的事感到后悔"]
      - zh: "[нарочно]{.ru}"
        accept: ["Специально, с желанием.", "Не случайно, а специально.", "С целью, специально."]
        rubric: ["说明是故意的，与 [нечаянно]{.ru} 相反"]
      - zh: "[машинально]{.ru}"
        accept: ["Не думая, сам не замечая.", "Не понимая, что делает.", "Как машина, не думая."]
        rubric: ["说明是不加思考、不自觉地做"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题开头描写背景、持续的状态，用未完成体 [сидел]{.ru}、[глядел]{.ru}；完成体是从 [Но вдруг…]{.ru} 开始的。第 2 题作者插话 [В рассказах часто встречается это «но вдруг»]{.ru} 取笑小说里用滥了的套话，这是作者直接对读者说话，不是人物的想法。第 3 题第 8 段 [Его начало помучивать беспокойство]{.ru}：[начать]{.ru} + 未完成体不定式表示动作开始并持续，正好写出不安一点点地增长。第 4 题切尔维亚科夫的道歉一次比一次长，将军的回答却越来越短、越来越粗暴：从 [Ничего, ничего…]{.ru} 到 [Ах, полноте…]{.ru}，再到 [Пошёл вон!!]{.ru}，既没有变得客气，也没有变长。第 5 题 [помер]{.ru} 是俗语词，和标题里中性的 [смерть]{.ru} 形成反差，主人公的死被说得像一件小事，这是契诃夫的讽刺；俗语词不带敬意，[помер]{.ru} 也不是“睡着了”的意思，是实实在在的死。"
    items:
      - stem: В начале рассказа глаголы «сидел», «глядел» показывают ___.
        options: [фон и состояние героя, быстрые действия героя, "то, что случилось потом"]
        answer: фон и состояние героя
      - stem: "Фраза «В рассказах часто встречается это „но вдруг“» — это ___."
        options: [слова автора, мысли Червякова, слова генерала]
        answer: слова автора
      - stem: "Слова «Его начало помучивать беспокойство» показывают, что беспокойство ___."
        options: [постепенно растёт, сразу проходит, мучает генерала]
        answer: постепенно растёт
      - stem: С каждой новой встречей генерал отвечает ___.
        options: [всё короче и грубее, всё вежливее, всё длиннее]
        answer: всё короче и грубее
      - stem: Слово «помер» в последней фразе ___.
        options: [делает смерть героя мелким событием, показывает уважение к герою, "значит то же самое, что «уснул»"]
        answer: делает смерть героя мелким событием

  - id: e4
    type: fill
    task: 用括号里动词的适当的体和形式填空（过去时或副动词）。
    why: "第 1 题“正在看戏、觉得幸福”是持续的状态，用未完成体 [глядел]{.ru}。第 2 题“突然打了个喷嚏”是一次性的、完成的动作，用完成体 [чихнул]{.ru}。第 3 题将军说完话“动了一下”下嘴唇，是一次性的短暂动作，带 [-ну-]{.ru} 的完成体正合适；主语 [генерал]{.ru} 阳性，过去时 [шевельнул]{.ru}，去掉 [-ть]{.ru} 加 [-л]{.ru}。第 4 题“回到家以后”是先于主要动作的完成动作，用完成体副动词 [придя]{.ru}。第 5 题“什么也看不见”和后退同时进行，用未完成体副动词 [видя]{.ru}。第 6 题最后一个动作，完成并带来结果，用完成体 [лёг]{.ru}。"
    items:
      - stem: Червяков сидел во втором ряду кресел и ___ в бинокль.
        hint: глядеть / поглядеть
        accept: ["глядел"]
      - stem: Но вдруг он нагнулся и ___.
        hint: чихать / чихнуть
        accept: ["чихнул"]
      - stem: "— Я уж забыл! — сказал генерал и нетерпеливо ___ нижней губой."
        hint: шевельнуть
        accept: ["шевельнул"]
      - stem: "___ домой, Червяков рассказал жене о своём невежестве."
        hint: приходить / прийти
        accept: ["Придя"]
      - stem: Ничего не ___, ничего не слыша, он попятился к двери.
        hint: видеть / увидеть
        accept: ["видя"]
      - stem: Не снимая вицмундира, он ___ на диван и помер.
        hint: ложиться / лечь
        accept: ["лёг"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение рассказа «Смерть чиновника».]{.ru}"
        length: 130–170
        model: "Мелкий чиновник Иван Дмитрич Червяков сидел в театре и с удовольствием смотрел спектакль. Вдруг он чихнул и обрызгал старичка, сидевшего впереди. Это был статский генерал Бризжалов. Червяков сразу извинился, и генерал ответил: «Ничего, ничего». Но Червякова начало мучить беспокойство. В антракте он извинился ещё раз, а генерал нетерпеливо сказал, что уже забыл. Червякову показалось, что генерал на него сердится. Жена тоже посоветовала ему сходить и извиниться. На другой день Червяков пришёл в приёмную генерала и начал снова объяснять, что чихнул нечаянно. Генерал не стал его слушать. Тогда Червяков пошёл за ним к двери и опять начал говорить о своём раскаянии. Генерал решил, что над ним смеются. Червяков хотел написать ему письмо, но не смог и на третий день снова пришёл объяснять. На этот раз генерал крикнул: «Пошёл вон!» Испуганный Червяков вернулся домой, не снимая вицмундира лёг на диван и умер."
        rubric: ["130–170 词", "交代起因：剧场里的喷嚏", "写出几次道歉和将军越来越不耐烦的反应", "结尾：将军大吼，切尔维亚科夫死去", "不加入原文没有的评论"]
        notes: "范文约 155 词。概要要保留情节的“阶梯”：剧场里、幕间、接待室、门口、第二天，每一步只用一两句话。人物的内心独白（如 [Забыл, а у самого ехидство в глазах]{.ru}）在概要里可以改成间接说法：[Червякову показалось, что генерал на него сердится]{.ru}。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Почему умер Червяков?» Смешной или грустный этот рассказ? Объясните, что, по-вашему, хотел показать Чехов.]{.ru}"
        length: 250–300
        model: "Когда читаешь «Смерть чиновника» первый раз, сначала смеёшься. Человек чихнул в театре — что может быть проще? Генерал сразу говорит, что это пустяки, а Червяков снова и снова идёт к нему извиняться. Его длинные и непонятные объяснения и короткие ответы генерала похожи на сцену из комедии. Но последняя фраза рассказа заставляет остановиться: человек лёг на диван и умер. Значит, это не только смешной, но и очень грустный рассказ. Почему же умер Червяков? Конечно, не от крика генерала. Мне кажется, он умер от страха, который жил в нём всю жизнь. Червяков — маленький чиновник, и он привык бояться всех, кто стоит выше. Генерал даже не его начальник, но для Червякова это не важно: перед «персоной» он чувствует себя виноватым уже потому, что существует. Он не может поверить, что большой человек просто забыл о нём. Слова генерала «Я уж забыл» он понимает не как прощение, а как угрозу. Ему кажется, что генерал сердится, а значит, может сделать ему что-то плохое. Поэтому он ходит к генералу снова и снова и сам делает так, что тот действительно начинает сердиться. Получается круг: чем больше Червяков боится, тем чаще он извиняется, а чем чаще он извиняется, тем сильнее сердится генерал. Чехов не жалеет своего героя открыто. Он даже даёт ему смешную фамилию и рассказывает о его смерти как о мелком событии: не «умер», а «помер». Но за этой насмешкой видна боль. Чехов показывает, что страх перед чином делает человека жалким и в конце концов не оставляет в нём ничего живого. Червяков умер задолго до последней сцены: в нём давно не осталось ни свободы, ни уважения к себе. Поэтому, по-моему, рассказ скорее грустный, чем смешной. Смех здесь — способ заставить читателя задуматься."
        rubric: ["250–300 词", "回答“可笑还是可悲”，有明确的观点", "分析死因：恐惧、对官阶的敬畏，而不是将军的一声吼", "引用选文细节（道歉的反复、[помер]{.ru}、姓氏等）", "结论与开头呼应"]
        notes: "范文约 280 词。结构：一、第一印象——可笑；二、转折——结尾的死让人深思；三、分析死因（恐惧、自卑、把将军的话往坏处想），引用选文细节；四、作者的态度（不直接同情，用讽刺表达痛心）；五、结论。注意 [не столько…, сколько…]{.ru}、[скорее…, чем…]{.ru} 这类表示比较和权衡的说法在议论文里很有用。"
