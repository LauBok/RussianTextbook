lesson: B4-L38
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Почему, по мнению Достоевского, появление Пушкина было «пророческим»?]{.ru}"
        length: 40–70
        model: "Пушкин появился в то время, когда после петровской реформы в русском обществе только начиналось настоящее самосознание. Его творчество как будто осветило новым светом тёмную дорогу России и показало ей путь в будущее. Поэтому Достоевский называет Пушкина пророчеством и указанием, а к словам Гоголя о Пушкине прибавляет от себя: «и пророческое»."
        rubric: ["说出普希金出现在民族自我意识刚刚萌芽的时候", "说出他为俄罗斯“照亮道路”、指明方向"]
        notes: "答案在第 1 段。作者先引果戈理的话，再加上自己的一个词 [и пророческое]{.ru}，这个词成了全篇演讲的主线。"
      - prompt: "[Как, по словам Достоевского, народная правда отвечает на «проклятый вопрос»? Где, по его мнению, находится правда?]{.ru}"
        length: 40–80
        model: "Народная правда говорит гордому человеку: смирись, сломи свою гордость, работай на родной земле. Правда находится не вне человека, не за морем и не в вещах, а в нём самом, в его труде над собой. Если человек победит себя, он станет по-настоящему свободным и поймёт свой народ."
        rubric: ["说出“谦卑下来、克服骄傲、劳动”", "说出“真理在你自身之中”"]
        notes: "第 2 段。[«Не вне тебя правда, а в тебе самом»]{.ru} 是陀思妥耶夫斯基一贯的思想：社会问题的解决首先在于个人的道德完善。"
      - prompt: "[Что значит, по Достоевскому, «стать настоящим русским»?]{.ru}"
        length: 30–60
        model: "По мнению Достоевского, стать настоящим русским — значит стать братом всех людей, «всечеловеком». Русский человек способен понять и принять дух других народов, и в этом, как он считает, его назначение. Пример этого — Пушкин с его всемирной отзывчивостью."
        rubric: ["说出“成为所有人的兄弟、全人类的人”", "联系普希金的全世界感应力"]
        notes: "第 5 段和第 3 段。注意作者的说法带着保留：[может быть]{.ru}、[если хотите]{.ru}。这是作者本人的观点，回答时用 [по мнению Достоевского]{.ru}、[как он считает]{.ru} 等说法转述。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[пророк]{.ru}"
        accept: ["Человек, который знает и говорит, что будет в будущем."]
        rubric: ["说明是预言未来的人"]
      - zh: "[отзывчивость]{.ru}"
        accept: ["Способность понимать чувства других людей и отвечать на них.", "Умение понять другого человека или другой народ и почувствовать то же, что и он."]
        rubric: ["说明是理解、感受他人（他民族）的能力"]
      - zh: "[всечеловек]{.ru}"
        accept: ["Человек, который чувствует себя братом всех людей.", "Человек, которому близки все народы."]
        rubric: ["说明是视所有人为兄弟、亲近所有民族的人"]
      - zh: "[недоразумение]{.ru}"
        accept: ["Ошибка, когда люди не так поняли друг друга.", "Ситуация, когда один человек не так понял другого."]
        rubric: ["说明是彼此理解错了"]
      - zh: "[грядущий]{.ru}"
        accept: ["Будущий.", "Тот, который будет потом."]
        rubric: ["给出同义词 [будущий]{.ru}", "指出是书面、庄重的说法（可不答）"]
      - zh: "[изобретение]{.ru}"
        accept: ["Новая вещь или новый способ, которые кто-то придумал.", "То, что человек придумал и сделал впервые."]
        rubric: ["说明是首次想出、造出的东西"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题 [Вникнем, поглядим]{.ru} 是第一人称复数命令式，把听众拉进思考过程，是演说常用手法。第 2 题“彼得改革对我们意味着什么？”之后作者自己回答，这是设问。第 3 题 [пророческое — пророчество — пророк]{.ru} 贯穿全文，是关键词的重复。第 4 题 [узришь]{.ru}、[ибо]{.ru} 和第二人称命令式都是宗教训诫的语言，使这段话庄严。第 5 题 [это подчеркните]{.ru} 直接对听众说话，这是口头演讲的痕迹。第 6 题最后一段语调平静，两个简短的陈述句，让听众陷入沉思。"
    items:
      - stem: "Формы «Вникнем… поглядим пристальнее» нужны оратору, чтобы ___."
        options: ["вместе со слушателями подумать над вопросом", "показать, что он устал", "рассказать о своей жизни"]
        answer: "вместе со слушателями подумать над вопросом"
      - stem: "Вопрос «Что означала для нас эта реформа?», на который автор сам же отвечает, — это ___."
        options: ["риторический вопрос", "вопрос к Гоголю", "вопрос без ответа"]
        answer: "риторический вопрос"
      - stem: "Слово, которое повторяется от первого до пятого абзаца и связывает речь, — это ___."
        options: ["«пророческое» (пророк, пророчество)", "«реформа»", "«гармония»"]
        answer: "«пророческое» (пророк, пророчество)"
      - stem: "Слова «узришь», «ибо» и формы «смирись», «потрудись» делают тон третьего абзаца ___."
        options: ["торжественным, почти религиозным", "разговорным, шутливым", "научным"]
        answer: "торжественным, почти религиозным"
      - stem: "Слова «это подчеркните» показывают, что текст был ___."
        options: ["речью перед слушателями", "частным письмом", "заметкой в журнале"]
        answer: "речью перед слушателями"
      - stem: "Последний абзац речи звучит ___."
        options: ["спокойно и задумчиво", "весело", "сердито"]
        answer: "спокойно и задумчиво"

  - id: e4
    type: rewrite
    task: 把庄重的书面说法换成中性说法。
    why: "第 1 题 [есть]{.ru} 作系词是庄重的书面说法，现代中性的说法省略系词，用破折号：[Пушкин — пророчество]{.ru}。第 2 题 [узришь]{.ru} 是古语，等于 [увидишь]{.ru}。第 3 题 [ибо]{.ru} 书面语，等于 [потому что]{.ru}。第 4 题 [надобно]{.ru} 旧词，等于 [надо]{.ru} 或 [нужно]{.ru}。第 5 题 [грядущее]{.ru} 庄重，中性说法是 [будущее]{.ru}。第 6 题 [после его]{.ru} 是旧式，现代第三人称代词在前置词后加 [н-]{.ru}：[после него]{.ru}。"
    example:
      cue: "Пушкин есть пророчество и указание."
      answer: "Пушкин — пророчество и указание."
    items:
      - cue: "Овладей собой — и узришь правду."
        accept: ["Овладей собой — и увидишь правду."]
      - cue: "Ты узришь счастье, ибо наполнится жизнь твоя."
        accept: ["Ты увидишь счастье, потому что наполнится жизнь твоя.", "Ты увидишь счастье, потому что твоя жизнь наполнится."]
      - cue: "За неё надобно заплатить."
        accept: ["За неё надо заплатить.", "За неё нужно заплатить."]
      - cue: "Пушкин предчувствует грядущее назначение этой силы."
        accept: ["Пушкин предчувствует будущее назначение этой силы."]
      - cue: "Такой силы не бывало до Пушкина, да и после его."
        accept: ["Такой силы не бывало до Пушкина, да и после него."]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词，用第三人称转述演说者的主要论点。
    items:
      - prompt: "[Напишите краткое изложение отрывка из речи.]{.ru}"
        length: 130–170
        model: "В своей речи о Пушкине Достоевский называет поэта не только великим, но и пророческим явлением русского духа. Пушкин появился тогда, когда после петровской реформы в русском обществе только начиналось самосознание, и указал России новый путь. Уже в ранней поэме «Цыганы», по мнению Достоевского, Пушкин подсказывает народное решение главного вопроса: гордый человек должен смириться и работать на родной земле, потому что правда не вне человека, а в нём самом. Ещё яснее это выражено в «Евгении Онегине», где показана настоящая русская жизнь. Главной чертой Пушкина Достоевский считает его всемирную отзывчивость: поэт умел почти полностью понять дух других народов и выразить его как свой. В этом оратор видит главную силу русского народа — стремление ко всемирности. Петровская реформа, по его словам, тоже была не просто усвоением европейской науки, а стремлением к единению всех людей. Стать настоящим русским — значит стать братом всех людей. Пушкин умер рано и унёс с собой великую тайну, которую мы теперь разгадываем."
        rubric: ["写出“预言性”这一中心概念", "写出《茨冈》中“谦卑、劳动、真理在自身”的思想", "写出全世界感应力和“全人类的人”", "用转述动词：[называет, считает, видит, по его словам]{.ru}", "130—170 词"]
        notes: "范文 151 词。议论性文本的概要要抓论点，不要复述修辞（重复、设问在概要中都应去掉）。要始终分清这是演说者的观点，多用 [по мнению Достоевского]{.ru}、[как считает оратор]{.ru} 等说法。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评：“你怎样看待陀思妥耶夫斯基关于‘全世界感应力’的观点？”可以谈这次演讲为什么感动了听众，也可以谈你同意或不同意的地方。
    items:
      - prompt: "[Что вы думаете о мысли Достоевского о «всемирной отзывчивости»? Напишите отзыв о прочитанной речи.]{.ru}"
        length: 250–300
        model: "Речь Достоевского о Пушкине — не просто литературная статья, а настоящая проповедь. Говорят, что после неё многие слушатели плакали, а люди, которые всегда спорили друг с другом, обнимались. Почему эта речь так подействовала на слушателей?\n\nПрежде всего, Достоевский говорил не только о Пушкине, но и о России. Его главная мысль в том, что Пушкин обладал «всемирной отзывчивостью»: он умел понять дух чужих народов и писать так, как будто сам был человеком другой страны. В этой способности оратор видит главную черту русского характера и назначение России — стать «братом всех людей». Для слушателей, которые много лет спорили, должна ли Россия идти своим путём или учиться у Европы, это было как ответ на старый вопрос: славянофильство и западничество, говорит Достоевский, — только «недоразумение».\n\nВо-вторых, речь построена очень сильно. Оратор обращается прямо к залу, сам задаёт вопросы и отвечает на них, повторяет главные слова — «пророк», «народность», «всечеловек». Его фразы звучат как молитва: «Смирись, гордый человек… потрудись на родной ниве».\n\nС чем-то в этой речи трудно согласиться. Каждый народ, наверное, может сказать о своём великом поэте, что он понимает весь мир. И с мыслью об особом назначении одного народа сегодня многие не согласятся. Сам Достоевский, кстати, понимал это и не раз повторял «может быть» и «если хотите».\n\nНо главная идея речи кажется мне прекрасной. Настоящая культура не закрывается от других, а умеет их понять и принять. Пушкин был великим русским поэтом именно потому, что был открыт всему миру. И, по-моему, этот урок важен для любой страны. Недаром речь кончается словами о том, что Пушкин унёс с собой в гроб великую тайну и мы теперь без него эту тайну разгадываем."
        rubric: ["说明演讲的中心思想（全世界感应力、全人类的人）", "分析演讲打动听众的原因（历史背景或演说技巧）", "有自己的评价，可以提出保留意见，但要有理有据", "250—300 词，结构完整"]
        notes: "范文 262 词。结构：引子（演讲的效果）—论点一（内容与历史背景）—论点二（演说技巧）—保留意见—结论。评论有争议的观点时，要先准确转述，再表达自己的看法；用 [трудно согласиться]{.ru}、[многие не согласятся]{.ru}、[кажется мне]{.ru} 等说法使语气平和。"
