lesson: B2-L44
grammar: "运动动词的转义：[вре́мя идёт / лети́т]{.ru}，[идёт дождь]{.ru}，[идёт фильм]{.ru}，[как иду́т дела́]{.ru}；带前缀的转义：[пошёл / прошёл дождь]{.ru}，[пришла́ весна́]{.ru}，[прошла́ неде́ля]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的动词形式。
    why: "转义用法一般用定向动词。第 1 题说电视在播电影，用 [идёт]{.ru}。第 2 题“下起雨来”是开始，用 [пошёл]{.ru}；第 3 题“雨停了”用 [прошёл]{.ru}。第 4 题时间流逝用 [идёт]{.ru}，不能用 [хо́дит]{.ru}。第 5 题季节来临用 [пришла́]{.ru}。第 6 题“一个星期过去了”用 [прошла́]{.ru}。"
    items:
      - stem: По телеви́зору ___ ста́рый фильм.
        options: [идёт, хо́дит, е́дет]
        answer: идёт
      - stem: Мы вы́шли из до́ма, и вдруг ___ дождь.
        options: [пошёл, прошёл, пришёл]
        answer: пошёл
      - stem: Дождь ___, и мы пошли́ гуля́ть.
        options: [пошёл, прошёл, пришёл]
        answer: прошёл
      - stem: Как бы́стро ___ вре́мя!
        options: [идёт, хо́дит, е́здит]
        answer: идёт
      - stem: Неда́вно была́ зима́, а тепе́рь ___ весна́.
        options: [пошла́, прошла́, пришла́]
        answer: пришла́
      - stem: ___ неде́ля, и Ван Лэй сно́ва в Москве́.
        options: [Пошла́, Прошла́, Пришла́]
        answer: Прошла́

  - id: e2
    type: rewrite
    task: 按例句把句子改成用运动动词转义的说法。
    example:
      cue: Сейча́с дождь.
      answer: Сейча́с идёт дождь.
    why: "俄语说下雨、下雪，说电影、节目在放，说事情进展，都用 [идти́]{.ru}：[идёт дождь]{.ru}，[идёт фильм]{.ru}，[дела́ иду́т]{.ru}。过去时要和主语的性、数一致：[шёл снег]{.ru}，[шла переда́ча]{.ru}，[шли уро́ки]{.ru}。第 4 题 [уро́к]{.ru} 正在进行，也用 [идёт]{.ru}。"
    items:
      - cue: Вчера́ весь день был снег.
        accept: ["Вчера́ весь день шёл снег."]
      - cue: Сейча́с по телеви́зору фильм о войне́.
        accept: ["Сейча́с по телеви́зору идёт фильм о войне́."]
      - cue: Как у тебя́ дела́ с кита́йским?
        accept: ["Как у тебя́ иду́т дела́ с кита́йским?", "Как иду́т у тебя́ дела́ с кита́йским?", "Как иду́т дела́ с кита́йским?"]
      - cue: Сейча́с в аудито́рии уро́к.
        accept: ["Сейча́с в аудито́рии идёт уро́к."]

  - id: e3
    type: fill
    task: 用括号里动词的正确形式填空。
    why: "第 1 题主语 [пара́д]{.ru} 是阳性，过去时 [шёл]{.ru}。第 2 题主语 [вре́мя]{.ru} 是中性，现在时 [лети́т]{.ru}。第 3 题主语 [дела́]{.ru} 是复数，[иду́т]{.ru}。第 4 题主语 [весна́]{.ru} 是阴性，[пришла́]{.ru}。第 5 题主语 [пра́здники]{.ru} 是复数，[прохо́дят]{.ru}。"
    items:
      - stem: Пара́д ___ час. (过去时)
        hint: идти́
        accept: ["шёл"]
      - stem: Вре́мя ___, а па́мять остаётся. (现在时)
        hint: лете́ть
        accept: ["лети́т"]
      - stem: У Ди́мы хорошо́ ___ дела́ с кита́йским. (现在时)
        hint: идти́
        accept: ["иду́т"]
      - stem: В Москву́ ___ весна́. (过去时)
        hint: прийти́
        accept: ["пришла́"]
      - stem: Как бы́стро ___ пра́здники! (现在时)
        hint: проходи́ть
        accept: ["прохо́дят"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“时间过得快”用 [вре́мя идёт]{.ru} 或 [лети́т]{.ru}。第 2 题电视上在放电影用 [идёт]{.ru}。第 3 题“下起雪来”用 [пошёл снег]{.ru}。第 4 题“学习怎么样”用 [как иду́т дела́]{.ru}。第 5 题“一年过去了”用 [прошёл год]{.ru}。"
    items:
      - zh: 时间过得真快！
        accept: ["Как бы́стро идёт вре́мя!", "Как бы́стро лети́т вре́мя!", "Вре́мя идёт так бы́стро!", "Вре́мя лети́т так бы́стро!", "Как бы́стро бежи́т вре́мя!", "Вре́мя так бы́стро идёт!", "Вре́мя так бы́стро лети́т!"]
        rubric: ["时间流逝用定向动词 [идёт / лети́т / бежи́т]{.ru}", "感叹句用 [как]{.ru} 或 [так]{.ru}"]
      - zh: 电视上在放一部老电影。
        accept: ["По телеви́зору идёт ста́рый фильм.", "Сейча́с по телеви́зору идёт ста́рый фильм.", "По телеви́зору сейча́с идёт ста́рый фильм.", "Ста́рый фильм идёт по телеви́зору.", "Сейча́с по телеви́зору идёт оди́н ста́рый фильм.", "По телеви́зору идёт оди́н ста́рый фильм.", "По телеви́зору пока́зывают ста́рый фильм.", "Сейча́с по телеви́зору пока́зывают ста́рый фильм.", "По телеви́зору сейча́с пока́зывают ста́рый фильм."]
        rubric: ["[идёт фильм]{.ru}", "“在电视上”用 [по телеви́зору]{.ru}"]
      - zh: 我们出门的时候下起雪来了。
        accept: ["Когда́ мы вы́шли из до́ма, пошёл снег.", "Когда́ мы вы́шли на у́лицу, пошёл снег.", "Когда́ мы выходи́ли из до́ма, пошёл снег.", "Когда́ мы вы́шли, пошёл снег.", "Когда́ мы вы́шли из до́ма, начался́ снег.", "Пошёл снег, когда́ мы вы́шли из до́ма.", "Когда́ мы вы́шли на у́лицу, начался́ снег.", "Пошёл снег, когда́ мы вы́шли на у́лицу.", "Когда́ мы выходи́ли из до́ма, начался́ снег.", "Пошёл снег, когда́ мы выходи́ли из до́ма.", "Когда́ мы выходи́ли на у́лицу, пошёл снег.", "Когда́ мы выходи́ли на у́лицу, начался́ снег.", "Пошёл снег, когда́ мы выходи́ли на у́лицу.", "Когда́ мы вы́шли, начался́ снег.", "Пошёл снег, когда́ мы вы́шли.", "Когда́ мы выходи́ли, пошёл снег.", "Когда́ мы выходи́ли, начался́ снег.", "Пошёл снег, когда́ мы выходи́ли."]
        rubric: ["“下起来”用 [пошёл снег]{.ru}", "“出门”用 [вы́йти из до́ма]{.ru} 或 [вы́йти на у́лицу]{.ru}"]
      - zh: 你的俄语学得怎么样？
        accept: ["Как иду́т дела́ с ру́сским?", "Как у тебя́ иду́т дела́ с ру́сским?", "Как иду́т твои́ дела́ с ру́сским?", "Как иду́т дела́ с ру́сским языко́м?", "Как у тебя́ иду́т дела́ с ру́сским языко́м?"]
        rubric: ["[как иду́т дела́ с]{.ru} + 第五格"]
      - zh: 一年过去了。
        accept: ["Прошёл год.", "Год прошёл."]
        rubric: ["[прошёл год]{.ru}，阳性过去时"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что Петро́вы и Ван Лэй смотре́ли у́тром? Что рассказа́ла ба́бушка о своём отце́? Куда́ пое́хала вся семья́ днём? Что де́лали ве́чером? Что Ван Лэй сказа́л о вре́мени?]{.ru}"
        length: 70–100
        model: "Девя́того ма́я был День Побе́ды. У́тром Петро́вы и Ван Лэй смотре́ли по телеви́зору пара́д на Кра́сной пло́щади. Днём прие́хала ба́бушка и привезла́ фотогра́фию своего́ отца́. Он воева́л четы́ре го́да и дошёл до Берли́на. Пото́м вся семья́ пое́хала к Ве́чному огню́, и Ми́ша положи́л там кра́сные гвозди́ки. Ве́чером пришёл Ди́ма, по телеви́зору шёл ста́рый фильм о войне́, а в де́сять часо́в начался́ салю́т. Ван Лэй сказа́л, что вре́мя идёт о́чень бы́стро: он в Москве́ уже́ во́семь ме́сяцев."
        rubric: ["回答全部五个问题", "转义用法 [шёл фильм]{.ru}、[вре́мя идёт]{.ru} 用对", "[дошёл до]{.ru} + 第二格"]
        notes: 范文约 85 词。[по телеви́зору шёл фильм]{.ru} 和 [вре́мя идёт]{.ru} 是本课的转义用法；[дошёл до Берли́на]{.ru} 是第 41 课学的 [до-]{.ru}，在这里表示经过艰难的路程到达终点。

  - id: e6
    type: open
    task: 作文：《时间过得真快》。
    items:
      - prompt: 回顾你最近半年或一年：学了什么，去过哪儿，有什么变化。用上 [вре́мя идёт / лети́т]{.ru}、[прошёл год]{.ru}、[пришла́ весна́]{.ru} 等说法。
        length: 100–150
        model: "Как бы́стро идёт вре́мя! Ка́жется, я на́чал учи́ть ру́сский язы́к совсе́м неда́вно, а прошёл уже́ год.\n\nГод наза́д я совсе́м не знал ру́сского языка́. Снача́ла бы́ло о́чень тру́дно: я до́лго учи́л бу́квы, а грамма́тику я совсе́м не понима́л. Но дела́ шли всё лу́чше. Зимо́й я прочита́л пе́рвую ру́сскую кни́гу — ска́зки Пу́шкина.\n\nВ э́том году́ я был в ра́зных города́х. Я съе́здил в Москву́ и в Петербу́рг, ходи́л в Большо́й теа́тр и в Третьяко́вскую галере́ю.\n\nА сейча́с уже́ пришла́ весна́, ско́ро ле́то и экза́мены. Вре́мя лети́т, но я не жале́ю: э́тот год был о́чень интере́сный."
        rubric: ["回顾过去、说现在、提将来", "至少用三种运动动词的转义（[вре́мя идёт / лети́т]{.ru}，[прошёл год]{.ru}，[дела́ шли]{.ru}，[пришла́ весна́]{.ru} 等）", "100–150 词，分段"]
        notes: 范文开头和结尾都用转义（[Как бы́стро идёт вре́мя!]{.ru}、[Вре́мя лети́т]{.ru}），首尾呼应。中间按时间顺序写一年的变化，[дела́ шли всё лу́чше]{.ru} 表示“情况越来越好”。[совсе́м не знал]{.ru}“完全不懂”，否定句里 [языка́]{.ru} 用第二格。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊，5 月 9 日晚上给北京的父母写信：讲讲俄罗斯人怎么过胜利日，奶奶讲了什么，再告诉他们你快过生日了。
        length: 80–120
        model: "Дороги́е ма́ма и па́па!\n\nСего́дня в Росси́и большо́й пра́здник — День Побе́ды. У́тром мы смотре́ли по телеви́зору пара́д. Пото́м прие́хала ба́бушка и показа́ла мне фотогра́фию своего́ отца́. Он воева́л четы́ре го́да и дошёл до Берли́на. Днём мы е́здили к Ве́чному огню́, а ве́чером смотре́ли салю́т с балко́на.\n\nКак бы́стро идёт вре́мя! Я в Москве́ уже́ во́семь ме́сяцев, а че́рез три дня у меня́ день рожде́ния. Мне бу́дет два́дцать оди́н год. Не волну́йтесь, у меня́ всё хорошо́: здесь я как до́ма.\n\nПиши́те!\nВаш сын Ван Лэй"
        rubric: ["有称呼和落款，给父母用 [вы]{.ru}", "讲清胜利日的活动和奶奶的话", "至少用一个运动动词的转义", "提到生日"]
        notes: 范文第一段讲节日，按时间顺序：上午—白天—晚上；第二段从“时间过得真快”转到自己的生日。[е́здили к Ве́чному огню́]{.ru} 用不定向过去时，表示去了又回来。[Не волну́йтесь]{.ru} 是给父母写信时常用的安慰话，否定命令式用未完成体。
