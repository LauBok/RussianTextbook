lesson: L39
grammar: "数词 21–100；数词与 [рубль]{.ru} 连用：[оди́н рубль]{.ru}、[два рубля́]{.ru}、[пять рубле́й]{.ru}，看数词的最后一个词；[Ско́лько сто́ит / сто́ят?]{.ru}"
exercises:

  - id: e1
    type: fill
    task: 用俄语单词写出数字。
    why: "[пятьдеся́т]{.ru}、[шестьдеся́т]{.ru}、[се́мьдесят]{.ru}、[во́семьдесят]{.ru} 中间有 [ь]{.ru}，最容易漏写；[со́рок]{.ru}、[девяно́сто]{.ru} 不按规律构成。复合数词十位和个位之间不加连词。"
    items:
      - stem: 40 — ___
        accept: [со́рок]
      - stem: 50 — ___
        accept: [пятьдеся́т]
      - stem: 70 — ___
        accept: [се́мьдесят]
      - stem: 90 — ___
        accept: [девяно́сто]
      - stem: 33 — ___
        accept: [три́дцать три]
      - stem: 68 — ___
        accept: [шестьдеся́т во́семь]
      - stem: 100 — ___
        accept: [сто]

  - id: e2
    type: choice
    task: 选择 [рубль]{.ru} 的正确形式。
    why: 看数词的最后一个词：[оди́н]{.ru} 后用 [рубль]{.ru}，[два, три, четы́ре]{.ru} 后用 [рубля́]{.ru}，[пять]{.ru} 以上和整十数后用 [рубле́й]{.ru}。11–14 是一个词，最后一个词不是 [оди́н]{.ru}、[два]{.ru}，所以第 6 题用 [рубле́й]{.ru}，这是最容易错的地方。
    items:
      - stem: два́дцать оди́н ___
        options: [рубль, рубля́, рубле́й]
        answer: рубль
      - stem: со́рок три ___
        options: [рубль, рубля́, рубле́й]
        answer: рубля́
      - stem: пятьдеся́т ___
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й
      - stem: девяно́сто шесть ___
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й
      - stem: шестьдеся́т два ___
        options: [рубль, рубля́, рубле́й]
        answer: рубля́
      - stem: двена́дцать ___
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й
      - stem: се́мьдесят оди́н ___
        options: [рубль, рубля́, рубле́й]
        answer: рубль

  - id: e3
    type: choice
    task: 用 [сто́ит]{.ru} 或 [сто́ят]{.ru} 填空。
    why: "[сто́ить]{.ru} 跟商品（主语）的数一致：[карто́шка, молоко́, укро́п]{.ru} 是单数，用 [сто́ит]{.ru}；[лимо́ны, пироги́]{.ru} 是复数，用 [сто́ят]{.ru}。价钱是多少与动词形式无关。"
    items:
      - stem: Ско́лько ___ карто́шка?
        options: [сто́ит, сто́ят]
        answer: сто́ит
      - stem: Ско́лько ___ лимо́ны?
        options: [сто́ит, сто́ят]
        answer: сто́ят
      - stem: Молоко́ ___ девяно́сто рубле́й.
        options: [сто́ит, сто́ят]
        answer: сто́ит
      - stem: Пироги́ ___ со́рок рубле́й.
        options: [сто́ит, сто́ят]
        answer: сто́ят

  - id: e4
    type: rewrite
    task: 按例句问答价钱。
    placeholder: — Ско́лько сто́ит …? — … рубл…
    example:
      cue: хлеб / 51
      answer: — Ско́лько сто́ит хлеб? — Пятьдеся́т оди́н рубль.
    why: 单数商品用 [сто́ит]{.ru}，复数用 [сто́ят]{.ru}；[рубль]{.ru} 的形式看数词的最后一个词。
    items:
      - cue: молоко́ / 90
        accept: ["— Ско́лько сто́ит молоко́? — Девяно́сто рубле́й."]
      - cue: лимо́ны / 32
        accept: ["— Ско́лько сто́ят лимо́ны? — Три́дцать два рубля́."]
      - cue: укро́п / 45
        accept: ["— Ско́лько сто́ит укро́п? — Со́рок пять рубле́й."]
      - cue: карто́шка / 41
        accept: ["— Ско́лько сто́ит карто́шка? — Со́рок оди́н рубль."]
      - cue: пироги́ / 74
        accept: ["— Ско́лько сто́ят пироги́? — Се́мьдесят четы́ре рубля́."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 单价的说法是“价钱 + 单位”：[со́рок рубле́й килогра́мм]{.ru}。买东西说 [Я беру́…]{.ru}，数词后的名词按 1 / 2–4 / 5 以上选择形式。
    items:
      - zh: 土豆五十五卢布一公斤。
        accept: ["Карто́шка сто́ит пятьдеся́т пять рубле́й килогра́мм.", "Карто́шка — пятьдеся́т пять рубле́й килогра́мм.", "Килогра́мм карто́шки сто́ит пятьдеся́т пять рубле́й.", "Килогра́мм карто́шки — пятьдеся́т пять рубле́й."]
        rubric: ["[пятьдеся́т пять рубле́й]{.ru}：最后一个词是 5，用 [рубле́й]{.ru}"]
      - zh: 我要三个柠檬。
        accept: ["Я беру́ три лимо́на."]
        rubric: ["[беру́]{.ru}", "[три лимо́на]{.ru}：3 后用单数第二格"]
      - zh: 一共多少钱？——正好一百卢布。
        accept: ["— Ско́лько всего́? — Ро́вно сто рубле́й.", "— Ско́лько с меня́? — Ро́вно сто рубле́й."]
        rubric: ["[Ско́лько всего́?]{.ru} 或 [Ско́лько с меня́?]{.ru}", "[сто рубле́й]{.ru}"]
      - zh: 面包六十二卢布。
        accept: ["Хлеб сто́ит шестьдеся́т два рубля́.", "Хлеб — шестьдеся́т два рубля́."]
        rubric: ["[шестьдеся́т два рубля́]{.ru}：最后一个词是 2，用单数第二格"]

  - id: e6
    type: open
    task: 情景对话。
    items:
      - prompt: 你在市场上买东西：问两三样东西的价钱，说要多少，问一共多少钱，付钱、找零。编一段对话（8–10 句），价钱都在 100 卢布以内。
        length: 50–90
        model: |
          — Здра́вствуйте! Ско́лько сто́ит молоко́?
          — Во́семьдесят рубле́й литр.
          — Я беру́ литр. А ско́лько сто́ят лимо́ны?
          — Два́дцать рубле́й шту́ка.
          — Хорошо́, оди́н лимо́н, пожа́луйста. Ско́лько с меня́?
          — Ро́вно сто рубле́й.
          — Вот, пожа́луйста.
          — Спаси́бо!
          — Спаси́бо! До свида́ния!
        rubric: ["用 [Ско́лько сто́ит / сто́ят?]{.ru} 问价，动词与商品的数一致", "用 [Я беру́…]{.ru} 表示要买", "[рубль]{.ru} 的形式随数词变化"]
        notes: 对话按问候、问价、决定买多少、问总价、付钱、道别的顺序展开。递钱时说 [Вот, пожа́луйста]{.ru}。自己写时价钱和总数都要在 100 以内。
