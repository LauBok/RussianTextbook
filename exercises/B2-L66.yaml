lesson: B2-L66
grammar: "语气词 [же]{.ru}（强调、追问）、[ведь]{.ru}（提醒、说明理由）、[ра́зве]{.ru}（怀疑、反问）、[неуже́ли]{.ru}（惊讶、不敢相信）。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的语气词。
    why: "第 1 题说明为什么让安娜睡，提醒大家都知道的事，用 [ведь]{.ru}。第 2 题 [же]{.ru} 紧跟被强调的 [э́то]{.ru}，强调明摆着的事。第 3 题“难道你不知道”是反问，说话人原以为对方知道，用 [ра́зве]{.ru}。第 4 题王磊对意外消息不敢相信，单独成句用 [неуже́ли]{.ru}；[ведь]{.ru}、[же]{.ru} 不能单独成句。第 5 题疑问词后面加强追问，用 [же]{.ru}。第 6 题对没想到的事表示惊讶：雨下了一整天，说话人简直不敢相信，用 [неуже́ли]{.ru}。"
    items:
      - stem: "Пусть А́нна спит: ___ у неё сего́дня день рожде́ния."
        options: [ведь, ра́зве, неуже́ли]
        answer: ведь
      - stem: "Не бери́ его́! Э́то ___ мухомо́р!"
        options: [же, ра́зве, неуже́ли]
        answer: же
      - stem: "___ ты не зна́ешь, что мухомо́р ядови́тый?"
        options: [Ра́зве, Ведь, Же]
        answer: Ра́зве
      - stem: "— Э́тот гриб ядови́тый. — ___?"
        options: [Неуже́ли, Ведь, Же]
        answer: Неуже́ли
      - stem: "Где ___ мои́ очки́? Я их везде́ иска́л."
        options: [же, ведь, ра́зве]
        answer: же
      - stem: "___ дождь шёл весь день? Я ничего́ не слы́шал!"
        options: [Неуже́ли, Ведь, Же]
        answer: Неуже́ли

  - id: e2
    type: rewrite
    task: 用括号里的语气词改写句子，表达括号里的口气。
    example:
      cue: "Ты не зна́ешь э́того? (ра́зве)"
      answer: "Ра́зве ты не зна́ешь э́того?"
    why: "[ра́зве]{.ru}、[неуже́ли]{.ru}、[ведь]{.ru} 放在句首；[же]{.ru} 紧跟在被强调的词后面，不能放在句首。第 2 题强调的是 [мы]{.ru}，[же]{.ru} 跟在 [мы]{.ru} 后面。第 4 题强调疑问词 [где]{.ru}，[же]{.ru} 放在 [где]{.ru} 后面。"
    items:
      - cue: "Вы уже́ верну́лись из ле́са? (неуже́ли)"
        accept: ["Неуже́ли вы уже́ верну́лись из ле́са?"]
      - cue: "Мы хоте́ли сде́лать тебе́ пода́рок! (же)"
        accept: ["Мы же хоте́ли сде́лать тебе́ пода́рок!"]
      - cue: "Он никогда́ не собира́л грибы́. (ведь)"
        accept: ["Ведь он никогда́ не собира́л грибы́.", "Он ведь никогда́ не собира́л грибы́."]
      - cue: "Где ты был ра́ньше? (же)"
        accept: ["Где же ты был ра́ньше?"]
      - cue: "В Кита́е нет грибо́в? (ра́зве)"
        accept: ["Ра́зве в Кита́е нет грибо́в?"]

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题“难道……不……”是反问，用 [ра́зве]{.ru}。第 2 题“真的吗”表示惊讶，用 [неуже́ли]{.ru}。第 3 题后半句说明理由，带“你也知道”的口气，用 [ведь]{.ru}。第 4 题“这可是……啊”强调明摆着的事，用 [же]{.ru}。"
    items:
      - zh: 难道你不认识这种蘑菇吗？
        accept: ["Ра́зве ты не зна́ешь э́тот гриб?", "Ра́зве ты не зна́ешь э́того гриба́?", "Ра́зве вы не зна́ете э́тот гриб?", "Ра́зве вы не зна́ете э́того гриба́?"]
        rubric: ["反问用 [ра́зве]{.ru}，放在句首", "“认识（东西）”用 [знать]{.ru}"]
      - zh: 你真的二十岁了吗？
        accept: ["Неуже́ли тебе́ два́дцать лет?", "Неуже́ли тебе́ уже́ два́дцать лет?", "Неуже́ли вам два́дцать лет?", "Неуже́ли вам уже́ два́дцать лет?"]
        rubric: ["表示惊讶用 [неуже́ли]{.ru}", "年龄用第三格 [тебе́]{.ru}，[два́дцать лет]{.ru}"]
      - zh: 别叫醒米沙：他昨天很累嘛。
        accept: ["Не буди́ Ми́шу: ведь он вчера́ о́чень уста́л.", "Не буди́ Ми́шу: он ведь вчера́ о́чень уста́л.", "Не буди́те Ми́шу: ведь он вчера́ о́чень уста́л.", "Не буди́те Ми́шу: он ведь вчера́ о́чень уста́л.", "Не буди́ Ми́шу, ведь он вчера́ о́чень уста́л.", "Не буди́те Ми́шу, ведь он вчера́ о́чень уста́л."]
        rubric: ["否定命令式用未完成体 [не буди́]{.ru}", "[ведь]{.ru} 引出理由", "“累了”用完成体过去时 [уста́л]{.ru}"]
      - zh: 这可是牛肝菌啊！
        accept: ["Э́то же бе́лый гриб!"]
        rubric: ["[же]{.ru} 紧跟被强调的 [э́то]{.ru}"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кто и когда́ пошёл за гриба́ми? Почему́ не разбуди́ли А́нну? Где расту́т подберёзовики и бе́лые грибы́? Како́й гриб нашёл Ван Лэй снача́ла и что сказа́л Ми́ша? Что бы́ло пото́м? Что сказа́ла А́нна, когда́ они́ верну́лись?]{.ru}"
        length: 70–100
        model: "В суббо́ту в шесть часо́в утра́ Ива́н Серге́евич, Ван Лэй и Ми́ша пошли́ за гриба́ми. А́нну не разбуди́ли, потому́ что у неё был день рожде́ния. Ива́н Серге́евич объясни́л, что подберёзовики расту́т под берёзами, а бе́лые грибы́ — под ёлками. Снача́ла Ван Лэй нашёл краси́вый кра́сный гриб с бе́лыми то́чками. Но Ми́ша сказа́л, что э́то мухомо́р и он ядови́тый. Пото́м Ива́н Серге́евич показа́л Ван Лэ́ю большо́й бе́лый гриб, и Ван Лэй сам сре́зал его́ но́жиком. Они́ верну́лись домо́й с по́лными корзи́нами. А́нна спроси́ла, почему́ её не разбуди́ли. Ба́бушка пожа́рила грибы́ с карто́шкой."
        rubric: ["回答全部六个问题", "对话改成叙述或间接引语，语气词的口气用 [сказа́л, спроси́ла]{.ru} 等动词表达", "时和人称正确"]
        notes: 范文约 90 词。缩写是叙述，课文里带语气词的对话多改成了间接引语：米沙的 [«Ра́зве ты не зна́ешь? Э́то же мухомо́р!»]{.ru} 写成 [сказа́л, что э́то мухомо́р]{.ru}；安娜的 [«Неуже́ли нельзя́ бы́ло меня́ разбуди́ть?»]{.ru} 写成 [спроси́ла, почему́ её не разбуди́ли]{.ru}。

  - id: e5
    type: open
    task: 作文：一次意外的发现。
    items:
      - prompt: 写一件让你感到意外的事（可以是在俄罗斯发现的、和中国不一样的习惯，也可以是第一次做某事时的经历）。写成叙述加对话，对话里用上 [же]{.ru}、[ведь]{.ru}、[ра́зве]{.ru}、[неуже́ли]{.ru} 各至少一次。
        length: 100–150
        model: "В октябре́ я пе́рвый раз был в гостя́х у ру́сской семьи́. Я купи́л для ма́мы моего́ дру́га четы́ре краси́вые ро́зы.\n— Спаси́бо! — сказа́ла она́ и улыбну́лась. — Но ра́зве ты не зна́ешь, что в Росси́и да́рят три, пять и́ли семь цвето́в, а не два и́ли четы́ре?\n— Неуже́ли? — удиви́лся я. — А почему́?\n— Ведь два и́ли четы́ре цветка́ прино́сят то́лько в о́чень гру́стные дни.\nЯ не знал, что сказа́ть. Но она́ засмея́лась:\n— Ничего́! Ты же э́того не знал. Смотри́!\nОна́ взяла́ одну́ ро́зу и подари́ла её мне: «Э́то тебе́». А три ро́зы поста́вила на стол.\n— Вот тепе́рь всё пра́вильно! — сказа́ла она́.\nВе́чером я до́лго ду́мал об э́том. У ка́ждой страны́ свои́ пра́вила. Тепе́рь я всегда́ счита́ю цветы́, когда́ покупа́ю их в Москве́."
        rubric: ["有叙述也有对话，事情交代清楚", "[же, ведь, ра́зве, неуже́ли]{.ru} 各至少一次，用法与口气相符", "100–150 词"]
        notes: 范文写的是送花的习俗：俄罗斯平时送花用单数，双数的花只在丧事时用。四个语气词各有分工：[ра́зве ты не зна́ешь]{.ru} 是女主人以为客人应该知道；[Неуже́ли?]{.ru} 是“我”吃惊；[Ведь…]{.ru} 说明原因；[Ты же э́того не знал]{.ru} 强调一个明摆着的理由，安慰对方。结尾写“我”的感想，点出这件事给自己的启发。

  - id: e6
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。7 月 3 日晚上，给北京的朋友写一封信，讲讲第一次在俄罗斯采蘑菇的经历和安娜的生日。信里用上至少三个本课的语气词。注意书信的格式。
        length: 80–120
        model: |
          3 ию́ля

          Дорого́й друг!

          Приве́т! Как ты? Я уже́ пять дней живу́ на да́че у ба́бушки.

          Сего́дня у́тром мы ходи́ли в лес за гриба́ми. Ты же зна́ешь, что я покупа́л грибы́ то́лько в магази́не! Снача́ла я уви́дел краси́вый кра́сный гриб с бе́лыми то́чками. Ми́ша удиви́лся: «Ра́зве ты не зна́ешь? Э́то мухомо́р, он ядови́тый!» Пото́м Ива́н Серге́евич показа́л мне настоя́щий бе́лый гриб и сказа́л, что в де́тстве то́же собира́л одни́ мухомо́ры. Неуже́ли э́то пра́вда?

          А ве́чером мы пра́здновали день рожде́ния А́нны: ей два́дцать лет. Ба́бушка пожа́рила на́ши грибы́ с карто́шкой. Бы́ло о́чень вку́сно!

          Пиши́!

          Твой Ван Лэй
        rubric: ["地点或日期、称呼、落款格式正确", "对朋友用 [ты]{.ru}：[Приве́т, Пиши́, Твой]{.ru}", "讲清采蘑菇和生日两件事", "至少三个语气词，口气用得对"]
        notes: 范文分两段写两件事。[Ты же зна́ешь]{.ru} 提醒朋友已知的事；米沙的话用直接引语保留了 [ра́зве]{.ru}；[Неуже́ли э́то пра́вда?]{.ru} 是写信人自己不敢相信伊万·谢尔盖耶维奇的话。称呼也可以写朋友的名字，中国人的名字在俄语里一般不变格。
