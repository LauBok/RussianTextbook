lesson: L27
grammar: "[уме́ть]{.ru} + 不定式表示学会的本领，[мочь]{.ru} + 不定式表示条件允许；[мочь]{.ru} 的变位 [могу́, мо́жешь, мо́гут]{.ru}（[г / ж]{.ru} 交替，重音移动）。"
exercises:

  - id: e1
    type: fill
    task: 用 [мочь]{.ru} 或 [уме́ть]{.ru} 的正确形式填空。
    why: "[мочь]{.ru} 的 [я]{.ru} 和 [они́]{.ru} 两个形式用 [г]{.ru}（[могу́, мо́гут]{.ru}），其余用 [ж]{.ru}（[мо́жешь, мо́жет, мо́жем, мо́жете]{.ru}）。常见错误是写成 *[мо́жут]{.ru} 或 *[могёшь]{.ru}。[уме́ть]{.ru} 是规则的第一变位。"
    items:
      - stem: Я не ___ пла́вать в холо́дной воде́.
        hint: мочь
        accept: [могу́]
      - stem: Сего́дня ве́чером мы ___ игра́ть в ша́хматы.
        hint: мочь
        accept: [мо́жем]
      - stem: Ты ___ пла́вать?
        hint: уме́ть
        accept: [уме́ешь]
      - stem: Ми́ша и его́ друг ___ игра́ть в хокке́й.
        hint: уме́ть
        accept: [уме́ют]
      - stem: А́нна и Ка́тя не ___ идти́ на конце́рт.
        hint: мочь
        accept: [мо́гут]
      - stem: Вы ___ чита́ть по-ру́сски?
        hint: мочь
        accept: [мо́жете]
      - stem: Па́па ___ пла́вать да́же в моро́з.
        hint: мочь
        accept: [мо́жет]

  - id: e2
    type: choice
    task: 选择 [уме́ть]{.ru} 或 [мочь]{.ru}。
    why: 说有没有学会一项本领，用 [уме́ть]{.ru}；会但受条件、时间、身体限制，或者说“可以”，用 [мочь]{.ru}。第 3 题冒号后说明了原因（水冷），是条件不允许；第 4 题 [ещё не]{.ru}“还没（学会）”，说的是本领。
    items:
      - stem: Ми́ша хорошо́ ___ игра́ть в футбо́л.
        options: [уме́ет, мо́жет]
        answer: уме́ет
      - stem: Сего́дня ве́чером я ___ идти́ в бассе́йн.
        options: [уме́ю, могу́]
        answer: могу́
      - stem: Я уме́ю пла́вать, но сего́дня не ___ — вода́ холо́дная.
        options: [уме́ю, могу́]
        answer: могу́
      - stem: Ми́ша ещё не ___ игра́ть в ша́хматы.
        options: [уме́ет, мо́жет]
        answer: уме́ет
      - stem: — Ты ___ сего́дня игра́ть в футбо́л? — Нет, я иду́ в поликли́нику.
        options: [уме́ешь, мо́жешь]
        answer: мо́жешь

  - id: e3
    type: rewrite
    task: 按括号里的提示简短回答。
    example:
      cue: Ты уме́ешь пла́вать? (+)
      answer: Да, уме́ю.
    why: 简短回答只重复问句里的情态动词，人称要转换：[уме́ешь → уме́ю]{.ru}，[мо́жете → мо́жем]{.ru}（问“你们”时）。否定时 [не]{.ru} 放在动词前面。
    items:
      - cue: Ты уме́ешь игра́ть в хокке́й? (–)
        accept: ["Нет, не уме́ю."]
      - cue: Вы мо́жете игра́ть в ша́хматы сего́дня ве́чером? (+, мы)
        accept: ["Да, мо́жем."]
      - cue: Ми́ша уме́ет пла́вать? (+)
        accept: ["Да, уме́ет."]
      - cue: Ты мо́жешь пить холо́дную во́ду? (–)
        accept: ["Нет, не могу́."]
      - cue: Они́ уме́ют говори́ть по-кита́йски? (–)
        accept: ["Нет, не уме́ют."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题“会”是本领，用 [уме́ть]{.ru}。第 2 题前半句是本领，后半句是条件，分别用 [уме́ю]{.ru} 和 [не могу́]{.ru}。第 3 题“可以”用 [мочь]{.ru}。
    items:
      - zh: 你会打冰球吗？
        accept: ["Ты уме́ешь игра́ть в хокке́й?", "Вы уме́ете игра́ть в хокке́й?"]
        rubric: ["用 [уме́ть]{.ru}", "[игра́ть в хокке́й]{.ru}"]
      - zh: 我会游泳，但不能在冷水里游。
        accept: ["Я уме́ю пла́вать, но не могу́ пла́вать в холо́дной воде́.", "Я уме́ю пла́вать, но в холо́дной воде́ не могу́.", "Я уме́ю пла́вать, но в холо́дной воде́ пла́вать не могу́.", "Я уме́ю пла́вать, но не могу́ в холо́дной воде́."]
        rubric: ["前半句用 [уме́ю]{.ru}，后半句用 [не могу́]{.ru}", "[в холо́дной воде́]{.ru} 用第六格"]
      - zh: 今天晚上我们可以下国际象棋。
        accept: ["Сего́дня ве́чером мы мо́жем игра́ть в ша́хматы.", "Мы мо́жем игра́ть в ша́хматы сего́дня ве́чером."]
        rubric: ["[мо́жем]{.ru} + 不定式", "[игра́ть в ша́хматы]{.ru}"]
      - zh: 爸爸连严寒天都在湖里游泳。
        accept: ["Па́па пла́вает в о́зере да́же в моро́з.", "Па́па да́же в моро́з пла́вает в о́зере.", "Да́же в моро́з па́па пла́вает в о́зере.", "Па́па пла́вает в о́зере да́же зимо́й в моро́з."]
        rubric: ["[да́же]{.ru} 放在强调的词前", "[в о́зере]{.ru} 用第六格"]

  - id: e5
    type: open
    task: 写一写你会做什么、不会做什么。
    items:
      - prompt: 用 5–7 个句子写一写你会什么、不会什么，今天能做什么、不能做什么。
        length: 40–70
        model: |
          Я уме́ю пла́вать и игра́ть в футбо́л. Я не уме́ю игра́ть в хокке́й. Я немно́го говорю́ по-ру́сски и уже́ могу́ чита́ть ру́сские ска́зки. Сего́дня ве́чером я могу́ игра́ть в ша́хматы. А пла́вать в о́зере я сейча́с не могу́: вода́ там холо́дная.
        rubric: ["[уме́ть]{.ru} 用于本领，[мочь]{.ru} 用于条件", "[мочь]{.ru} 变位正确", "[игра́ть в]{.ru} + 第四格"]
        notes: 范文先说本领（[уме́ю]{.ru}、[не уме́ю]{.ru}），再说今天的条件（[могу́]{.ru}、[не могу́]{.ru}），两类意思分开写，读者一眼能看出区别。最后一句用冒号补充原因。
