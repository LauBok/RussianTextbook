lesson: B2-L21
grammar: "疑问代词 [кто, что]{.ru} 的全部变格；[чей, чья, чьё, чьи]{.ru} 的全部变格；疑问词的格由动词或前置词决定；[кто]{.ru}、[что]{.ru} 作主语时谓语的形式。"
exercises:

  - id: e1
    type: fill
    task: 根据答句，用 [кто]{.ru} 或 [что]{.ru} 的正确形式提问（连同前置词）。
    why: "疑问词和答句里的词同格：第 1 题答句 [Ди́му]{.ru} 是第四格，人用 [кого́]{.ru}；第 2 题 [А́нне]{.ru} 第三格 → [кому́]{.ru}；第 3 题 [с Ми́шей]{.ru} → [с кем]{.ru}；第 4 题 [о контро́льной]{.ru} 是事物 → [о чём]{.ru}；第 5 题 [ру́сским языко́м]{.ru} 第五格 → [чем]{.ru}；第 6 题 [соль]{.ru} 作主语 → [что]{.ru}；第 7 题 [у О́льги Ви́кторовны]{.ru} → [у кого́]{.ru}；第 8 题 [боя́ться]{.ru} 要求第二格，[контро́льной]{.ru} 是事物 → [чего́]{.ru}。"
    items:
      - stem: — ___ ты ви́дел в университе́те? — Ди́му.
        accept: ["Кого́"]
      - stem: — ___ ты позвони́л? — А́нне.
        accept: ["Кому́"]
      - stem: — ___ ты приду́мал э́ту шу́тку? — С Ми́шей.
        accept: ["С кем"]
      - stem: — ___ ты ду́маешь? — О контро́льной.
        accept: ["О чём"]
      - stem: — ___ ты занима́ешься? — Ру́сским языко́м.
        accept: ["Чем"]
      - stem: — ___ бы́ло в са́харнице? — Соль.
        accept: ["Что"]
      - stem: — ___ мо́жно узна́ть о контро́льной? — У О́льги Ви́кторовны.
        accept: ["У кого́"]
      - stem: — ___ ты бои́шься? — Контро́льной.
        accept: ["Чего́"]

  - id: e2
    type: fill
    task: 用 [чей]{.ru} 的正确形式填空。
    why: "[чей]{.ru} 跟后面的名词在性、数、格上一致：第 1 题 [ку́ртка]{.ru} 阴性第一格 → [чья]{.ru}；第 2 题 [пи́сьма]{.ru} 复数 → [чьи]{.ru}；第 3 题 [в]{.ru} + 第六格，[ко́мната]{.ru} 阴性 → [в чьей]{.ru}；第 4 题 [с]{.ru} + 第五格，[брат]{.ru} 阳性 → [с чьим]{.ru}；第 5 题第四格，[кни́гу]{.ru} 阴性 → [чью]{.ru}；第 6 题 [у]{.ru} + 第二格，[друг]{.ru} 阳性 → [у чьего́]{.ru}。"
    items:
      - stem: ___ э́то ку́ртка?
        hint: чей
        accept: ["Чья"]
      - stem: ___ э́то пи́сьма?
        hint: чей
        accept: ["Чьи"]
      - stem: В ___ ко́мнате спит Му́рка?
        hint: чей
        accept: ["чьей"]
      - stem: С ___ бра́том ты игра́ешь в футбо́л?
        hint: чей
        accept: ["чьим"]
      - stem: ___ кни́гу ты чита́ешь?
        hint: чей
        accept: ["Чью"]
      - stem: У ___ дру́га ты был вчера́?
        hint: чей
        accept: ["чьего́"]

  - id: e3
    type: choice
    task: 选择正确的疑问词。
    why: "第 1 题 [ве́рить]{.ru} 要求第三格，问人用 [кому́]{.ru}。第 2 题 [интересова́ться]{.ru} 要求第五格，问事物用 [чем]{.ru}。第 3 题后面有名词 [сестро́й]{.ru}，问“谁的”用 [чей]{.ru} 的变格 [чьей]{.ru}。第 4 题 [кто]{.ru} 作主语，答句虽然是安娜，问句的谓语仍用阳性 [сде́лал]{.ru}。第 5 题 [расска́зывать о]{.ru} + 第六格，问人用 [о ком]{.ru}。"
    items:
      - stem: ___ мо́жно ве́рить пе́рвого апре́ля?
        options: [Кого́, Кому́, Кем]
        answer: Кому́
      - stem: ___ ты интересу́ешься?
        options: [Что, Чего́, Чем]
        answer: Чем
      - stem: С ___ сестро́й ты говори́л?
        options: [кем, чьей, чьим]
        answer: чьей
      - stem: — Кто ___ э́то? — А́нна.
        options: [сде́лал, сде́лала, сде́лали]
        answer: сде́лал
      - stem: — ___ ты рассказа́л Ми́ше? — О Ди́ме.
        options: [О ком, О чём, О чьём]
        answer: О ком

  - id: e4
    type: translate
    task: 译成俄语。
    why: "每题先确定动词或前置词要求的格：“给谁”第三格 [кому́]{.ru}；“跟谁”[с кем]{.ru}；“谁的”要和名词一致；[занима́ться]{.ru} + 第五格 [чем]{.ru}；“想出”用 [приду́мать]{.ru}。"
    items:
      - zh: 你给谁打的电话？
        accept: ["Кому́ ты звони́л?", "Кому́ ты позвони́л?", "Кому́ ты звони́ла?", "Кому́ ты позвони́ла?", "Кому́ вы звони́ли?", "Кому́ вы позвони́ли?"]
        rubric: ["[кому́]{.ru}：[звони́ть]{.ru} 要求第三格"]
      - zh: 这是谁的主意？
        accept: ["Чья э́то иде́я?", "Чья э́то была́ иде́я?"]
        rubric: ["[иде́я]{.ru} 阴性，用 [чья]{.ru}"]
      - zh: 你周末跟谁一起去滑冰了？
        accept: ["С кем ты ката́лся на конька́х в выходны́е?", "С кем ты в выходны́е ката́лся на конька́х?", "В выходны́е с кем ты ката́лся на конька́х?", "С кем ты ката́лась на конька́х в выходны́е?", "С кем ты в выходны́е ката́лась на конька́х?", "В выходны́е с кем ты ката́лась на конька́х?", "С кем ты ходи́л ката́ться на конька́х в выходны́е?", "С кем ты в выходны́е ходи́л ката́ться на конька́х?", "В выходны́е с кем ты ходи́л ката́ться на конька́х?", "С кем ты ходи́ла ката́ться на конька́х в выходны́е?", "С кем ты в выходны́е ходи́ла ката́ться на конька́х?", "В выходны́е с кем ты ходи́ла ката́ться на конька́х?", "С кем ты ходи́л на като́к в выходны́е?", "С кем ты в выходны́е ходи́л на като́к?", "В выходны́е с кем ты ходи́л на като́к?", "С кем ты ходи́ла на като́к в выходны́е?", "С кем ты в выходны́е ходи́ла на като́к?", "В выходны́е с кем ты ходи́ла на като́к?", "С кем вы ката́лись на конька́х в выходны́е?", "С кем вы в выходны́е ката́лись на конька́х?", "В выходны́е с кем вы ката́лись на конька́х?", "С кем вы ходи́ли ката́ться на конька́х в выходны́е?", "С кем вы в выходны́е ходи́ли ката́ться на конька́х?", "В выходны́е с кем вы ходи́ли ката́ться на конька́х?", "С кем вы ходи́ли на като́к в выходны́е?", "С кем вы в выходны́е ходи́ли на като́к?", "В выходны́е с кем вы ходи́ли на като́к?"]
        rubric: ["[с кем]{.ru}：第五格", "[ката́ться на конька́х]{.ru}"]
      - zh: 你在做什么？——我在学汉语。
        accept: ["— Чем ты занима́ешься? — Я занима́юсь кита́йским языко́м.", "— Чем ты занима́ешься? — Кита́йским языко́м.", "— Чем ты сейча́с занима́ешься? — Я занима́юсь кита́йским языко́м.", "— Чем ты сейча́с занима́ешься? — Кита́йским языко́м.", "— Чем вы занима́етесь? — Я занима́юсь кита́йским языко́м.", "— Чем вы занима́етесь? — Кита́йским языко́м."]
        rubric: ["[чем]{.ru} 与 [кита́йским языко́м]{.ru} 都是第五格"]
      - zh: 是谁想出了这个玩笑？
        accept: ["Кто приду́мал э́ту шу́тку?", "Кто приду́мал э́тот ро́зыгрыш?", "Кто э́то приду́мал?"]
        rubric: ["[кто]{.ru} 作主语，谓语用阳性 [приду́мал]{.ru}", "[приду́мать]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й пра́здник был пе́рвого апре́ля? Что случи́лось у́тром у Петро́вых? Чья э́то была́ иде́я? Как Ди́ма разыгра́л Ван Лэ́я? Что Ван Лэй по́нял ве́чером?]{.ru}"
        length: 50–80
        model: "Пе́рвого апре́ля был День сме́ха. У́тром Ива́н Серге́евич попро́бовал ко́фе, а он был солёный: в са́харнице была́ соль вме́сто са́хара. Иде́я была́ А́нны, а соль положи́л Ми́ша. В университе́те Ди́ма сказа́л Ван Лэ́ю, что за́втра бу́дет контро́льная. Ван Лэй испуга́лся и позвони́л А́нне, а она́ спроси́ла его́, како́е сего́дня число́. Ве́чером Ван Лэй по́нял, что пе́рвого апре́ля мо́жно ве́рить то́лько себе́."
        rubric: ["回答全部五个问题", "日期 [пе́рвого апре́ля]{.ru} 用第二格", "用间接引语转述迪马和安娜的话", "最后一句用 [себе́]{.ru}"]
        notes: 范文约 70 词。课文里的对话都改成了间接引语：[Ди́ма сказа́л, что…]{.ru}，[она́ спроси́ла, како́е сего́дня число́]{.ru}。注意第 3 个问题的答句 [Иде́я была́ А́нны]{.ru}：回答“谁的”可以用第二格。

  - id: e6
    type: open
    task: 作文。写一个你经历过或听说过的玩笑（愚人节或别的日子）：是谁开的，捉弄了谁，怎样识破的，大家的反应如何。
    items:
      - prompt: 写 100–150 词。用上至少三个 [кто]{.ru}、[что]{.ru}、[чей]{.ru} 的间接格形式（可以出现在人物的问话里）。
        length: 100–150
        model: "В про́шлом году́ пе́рвого апре́ля я разыгра́л своего́ дру́га. Мы живём в одно́й ко́мнате в общежи́тии. У́тром я сказа́л ему́: «Слу́шай, тебе́ звони́л преподава́тель. Он ждёт тебя́ в аудито́рии в во́семь часо́в». Друг сра́зу пове́рил и спроси́л: «С кем он говори́л? С тобо́й? А о чём он хо́чет со мной поговори́ть?» Я отве́тил: «Не зна́ю. Наве́рное, о твоём сочине́нии». Он сра́зу пошёл в университе́т. В аудито́рии никого́ не́ было. Че́рез полчаса́ он позвони́л мне: «Чья э́то шу́тка? Твоя́? Кому́ ещё ты э́то рассказа́л?» Я засмея́лся и сказа́л: «С пе́рвым апре́ля!» Снача́ла он серди́лся, но пото́м то́же засмея́лся. А ве́чером он разыгра́л меня́: положи́л мне в чай соль. Тепе́рь пе́рвого апре́ля мы с ним никому́ не ве́рим."
        rubric: ["情节完整：谁、捉弄了谁、怎么识破、结果", "至少三个疑问词的间接格形式，格与动词、前置词一致", "100–150 词"]
        notes: 范文按时间顺序讲一个完整的玩笑，再加一个“回敬”的结尾。疑问词出现在人物的问话里：[С кем он говори́л?]{.ru}（第五格）、[о чём он хо́чет поговори́ть]{.ru}（第六格）、[Кому́ ещё ты э́то рассказа́л?]{.ru}（第三格），还有 [Чья э́то шу́тка?]{.ru}。[никого́ не́ было]{.ru}、[никому́ не ве́рим]{.ru} 是第一册第 98 课学过的否定代词。
