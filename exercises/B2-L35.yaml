lesson: B2-L35
grammar: "动词的支配：[боя́ться]{.ru} + 第二格；[помога́ть, меша́ть, сове́товать, ве́рить]{.ru} + 第三格；[проси́ть, благодари́ть, спроси́ть]{.ru} + 第四格；[занима́ться, интересова́ться]{.ru} + 第五格；[гото́виться к, ве́рить в, серди́ться на, отвеча́ть на]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成正确的格。
    why: "第 1 题 [боя́ться]{.ru} 支配第二格：[экза́мена]{.ru}。第 2 题 [помога́ть]{.ru} 支配第三格：[Ди́ме]{.ru}。第 3 题 [меша́ть]{.ru} 支配第三格：[нам]{.ru}，不能说 [нас]{.ru}。第 4 题 [проси́ть]{.ru} 支配第四格：[тебя́]{.ru}。第 5 题 [занима́ться]{.ru} 支配第五格：[литерату́рой]{.ru}。第 6 题 [гото́виться к]{.ru} + 第三格：[экза́мену]{.ru}。第 7 题 [благодари́ть]{.ru} 支配第四格：[А́нну]{.ru}。第 8 题 [сове́товать]{.ru} 支配第三格：[вам]{.ru}。"
    items:
      - stem: Ди́ма бои́тся ___.
        hint: экза́мен
        accept: ["экза́мена"]
      - stem: А́нна помога́ет ___.
        hint: Ди́ма
        accept: ["Ди́ме"]
      - stem: Ми́ша, ты ___ меша́ешь!
        hint: мы
        accept: ["нам"]
      - stem: Прошу́ ___, не кричи́!
        hint: ты
        accept: ["тебя́"]
      - stem: Ван Лэй занима́ется ___.
        hint: литерату́ра
        accept: ["литерату́рой"]
      - stem: Они́ гото́вятся к ___.
        hint: экза́мен
        accept: ["экза́мену"]
      - stem: Ди́ма поблагодари́л ___ за по́мощь.
        hint: А́нна
        accept: ["А́нну"]
      - stem: Сове́тую ___ хорошо́ вы́спаться.
        hint: вы
        accept: ["вам"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [ве́рить]{.ru} 相信某人的话，支配第三格 [мне]{.ru}。第 2 题相信某种说法灵验，用 [в]{.ru} + 第四格。第 3 题 [серди́ться на]{.ru} + 第四格。第 4 题 [спроси́ть]{.ru} 支配第四格，[отве́тить]{.ru} 支配第三格，同一个人在两个动词后面形式不同。第 5 题 [Спаси́бо]{.ru} 后用第三格 [тебе́]{.ru}，[благодари́ть]{.ru} 后才用第四格。第 6 题 [боя́ться]{.ru} 支配第二格，问句用 [чего́]{.ru}。"
    items:
      - stem: Верь ___, я говорю́ пра́вду!
        options: [мне, меня́]
        answer: мне
      - stem: Ди́ма не ве́рит ___.
        options: [приме́там, в приме́ты]
        answer: в приме́ты
      - stem: Не серди́сь ___!
        options: [на меня́, мне]
        answer: на меня́
      - stem: Профе́ссор спроси́л Ди́му, и Ди́ма отве́тил ___.
        options: [профе́ссору, профе́ссора]
        answer: профе́ссору
      - stem: Спаси́бо ___ за сове́т!
        options: [тебе́, тебя́]
        answer: тебе́
      - stem: ___ ты бои́шься?
        options: [Что, Чего́]
        answer: Чего́

  - id: e3
    type: fill
    task: 填上适当的前置词。
    why: "第 1 题 [гото́виться к]{.ru} + 第三格。第 2 题 [благодари́ть кого́ за что]{.ru}，原因用 [за]{.ru} + 第四格。第 3 题 [отве́тить на вопро́с]{.ru}，回答的问题用 [на]{.ru} + 第四格。第 4 题 [наде́яться на]{.ru} + 第四格。第 5 题 [ве́рить в]{.ru} + 第四格。"
    items:
      - stem: Ван Лэй гото́вится ___ экза́мену по литерату́ре.
        accept: ["к"]
      - stem: Спаси́бо ___ по́мощь!
        accept: ["за"]
      - stem: Ди́ма отве́тил ___ все вопро́сы.
        accept: ["на"]
      - stem: Я наде́юсь ___ тебя́.
        accept: ["на"]
      - stem: Ты ве́ришь ___ приме́ты?
        accept: ["в"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“怕”用 [боя́ться]{.ru} + 第二格。第 2 题“帮助”用 [помога́ть]{.ru} + 第三格。第 3 题“打扰”用 [меша́ть]{.ru} + 第三格。第 4 题“相信”迷信说法用 [ве́рить в]{.ru} + 第四格。"
    items:
      - zh: 我不怕考试。
        accept: ["Я не бою́сь экза́мена.", "Я не бою́сь экза́менов.", "Экза́мена я не бою́сь.", "Экза́менов я не бою́сь."]
        rubric: ["[боя́ться]{.ru} 支配第二格：[экза́мена]{.ru} / [экза́менов]{.ru}", "不能用第四格 [экза́мен]{.ru}"]
      - zh: 安娜帮迪马准备考试。
        accept: ["А́нна помога́ет Ди́ме гото́виться к экза́мену.", "А́нна помогла́ Ди́ме подгото́виться к экза́мену.", "А́нна помога́ла Ди́ме гото́виться к экза́мену."]
        rubric: ["[помога́ть]{.ru} 支配第三格 [Ди́ме]{.ru}", "[гото́виться к экза́мену]{.ru}"]
      - zh: 对不起，我打扰您了吗？
        accept: ["Извини́те, я вам не меша́ю?", "Извини́те, я вам меша́ю?", "Прости́те, я вам не меша́ю?"]
        rubric: ["[меша́ть]{.ru} 支配第三格 [вам]{.ru}，不能用 [вас]{.ru}"]
      - zh: 你相信这些迷信说法吗？
        accept: ["Ты ве́ришь в э́ти приме́ты?", "Вы ве́рите в э́ти приме́ты?", "Ты ве́ришь в приме́ты?", "Вы ве́рите в приме́ты?"]
        rubric: ["[ве́рить в]{.ru} + 第四格：[в приме́ты]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кто и к чему́ гото́вился у Петро́вых в четве́рг? Чего́ боя́лся Ди́ма? Как А́нна помога́ла ему́? Что сове́товала Мари́я Никола́евна, а что — ба́бушка Ди́мы? Что сказа́ла А́нна Ди́ме, когда́ он собира́лся домо́й?]{.ru}"
        length: 50–80
        model: "В четве́рг А́нна и Ди́ма гото́вились у Петро́вых к экза́мену. Ди́ма боя́лся не экза́мена, а стро́гого профе́ссора. А́нна помога́ла ему́: она́ задава́ла вопро́сы, а Ди́ма отвеча́л. Ми́ша смотре́л футбо́л и меша́л им. Мари́я Никола́евна сове́товала им хорошо́ вы́спаться, а ба́бушка Ди́мы сове́тует положи́ть пята́к под пя́тку. Ди́ма не ве́рит в приме́ты, но пята́к положи́т. А́нна сказа́ла ему́: «Ни пу́ха ни пера́!»"
        rubric: ["回答全部五个问题", "[боя́ться]{.ru} + 第二格、[помога́ть, меша́ть, сове́товать]{.ru} + 第三格写对", "[гото́виться к]{.ru}、[ве́рить в]{.ru} 的前置词写对"]
        notes: 范文约 60 词。几乎每句都有一个本课的支配：[гото́вились к экза́мену, боя́лся профе́ссора, помога́ла ему́, меша́л им, сове́товала им, ве́рит в приме́ты]{.ru}。

  - id: e6
    type: open
    task: 作文。题目：“我怎样准备考试”。
    items:
      - prompt: 写一写你准备考试的方法：怎样复习、谁帮助你、什么妨碍你、你怕不怕考试、有没有考试前的习惯或迷信、你给同学什么建议。至少用六个本课的支配结构，其中第二、三、四、五格和带前置词的各至少一个。
        length: 100–150
        model: |
          Я ча́сто волну́юсь пе́ред экза́менами, но не бою́сь их, потому́ что гото́влюсь к ним до́лго и серьёзно. Ка́ждый ве́чер я повторя́ю конспе́кты. Я занима́юсь в библиоте́ке: до́ма мне меша́ют телефо́н и телеви́зор. Мой друг ча́сто помога́ет мне: он задаёт вопро́сы, а я отвеча́ю на них. Пото́м я помога́ю ему́. Е́сли я не понима́ю те́му, я прошу́ преподава́теля объясни́ть её ещё раз и всегда́ благодарю́ его́ за по́мощь. В приме́ты я не ве́рю, но пе́ред экза́меном мне всегда́ звони́т ма́ма и говори́т: «Ни пу́ха ни пера́!» Я отвеча́ю: «К чёрту!» — и мы смеёмся. Мой сове́т друзья́м: не сиди́те над кни́гами всю ночь, лу́чше хорошо́ вы́спитесь.
        rubric: ["至少六个支配结构，格用对", "[боя́ться]{.ru} + 第二格、[помога́ть/меша́ть]{.ru} + 第三格、[проси́ть/благодари́ть]{.ru} + 第四格、[занима́ться]{.ru} + 第五格", "带前置词的支配（[гото́виться к, отвеча́ть на, ве́рить в]{.ru}）", "结尾有建议"]
        notes: 范文约 105 词：对考试的态度—复习方法—谁帮忙、什么打扰—请老师讲解—考前的习惯—给同学的建议。注意 [меша́ют телефо́н и телеви́зор]{.ru}：主语是“手机和电视”（第一格），被打扰的人 [мне]{.ru} 用第三格。
