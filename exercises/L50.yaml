lesson: L50
heading: 单元测试
intro: 本测试覆盖第五单元全部语法。答对 80% 以上再进入第六单元；没有达到的，回到相应的课复习后重做。
grammar: "未完成体将来时 [бу́ду]{.ru} + 不定式；动词的体：体对的构成，过去时和将来时里两种体的意义，体与时间状语；完成体将来时；命令式及其体的选择；[в]{.ru} + 钟点，[че́рез]{.ru} / [наза́д]{.ru}；月份第六格；序数词 1–31；日期。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的体。
    why: 第 1 题有 [два часа́]{.ru}，说持续多久，只能用未完成体；第 2 题有 [уже́]{.ru}，说已经完成，用完成体；第 3 题 [ка́ждое у́тро]{.ru} 是经常的动作，现在时只有未完成体；第 4 题 [вчера́]{.ru} 本身不决定体，这里说的是一次买成了蛋糕，用完成体；第 5 题 [бу́ду]{.ru} 后面只能接未完成体不定式；第 6 题是保证把功课做完，用完成体将来时。
    items:
      - stem: Вчера́ я ___ расска́з два часа́.
        options: [чита́л, прочита́л]
        answer: чита́л
      - stem: Я уже́ ___ письмо́ домо́й.
        options: [писа́л, написа́л]
        answer: написа́л
      - stem: Ка́ждое у́тро Ван Лэй ___ хлеб в бу́лочной.
        options: [покупа́ет, ку́пит]
        answer: покупа́ет
      - stem: Вчера́ был пра́здник, и Ван Лэй ___ большо́й торт.
        options: [покупа́л, купи́л]
        answer: купи́л
      - stem: За́втра я бу́ду ___ в библиоте́ке.
        options: [занима́ться, сде́лать]
        answer: занима́ться
      - stem: — А уро́ки? — Уро́ки я ___ сего́дня. Че́стное сло́во!
        options: [де́лаю, сде́лаю]
        answer: сде́лаю

  - id: e2
    type: fill
    task: 写出括号里动词的将来时形式。
    why: 未完成体将来时用 [бу́ду]{.ru} + 不定式（第 1、2 题），[бу́ду]{.ru} 跟主语变位；完成体按人称变位就是将来时（第 3–6 题）。注意辅音交替 [уви́деть → уви́дите]{.ru} 只在第一人称单数有 [ж]{.ru}，[взять → возьмёт]{.ru}、[дать → дам]{.ru}、[встать → вста́ну]{.ru} 变位不规则。
    items:
      - stem: Что вы ___ де́лать за́втра?
        hint: быть
        accept: [бу́дете]
      - stem: В суббо́ту мы ___ на да́че.
        hint: отдыха́ть
        accept: [бу́дем отдыха́ть]
      - stem: В Се́ргиевом Поса́де вы ___ ла́вру.
        hint: уви́деть
        accept: [уви́дите]
      - stem: А́нна ___ матрёшку и поста́вит её на стол.
        hint: взять
        accept: [возьмёт]
      - stem: За́втра я ___ слова́рь.
        hint: дать
        accept: [дам]
      - stem: За́втра я ___ в семь часо́в.
        hint: встать
        accept: [вста́ну]

  - id: e3
    type: rewrite
    task: 用括号里的动词写出命令式，对 [ты]{.ru} 说用单数，对 [вы]{.ru} 说用复数。
    placeholder: …, пожа́луйста.
    example:
      cue: сказа́ть (вы)
      answer: Скажи́те, пожа́луйста.
    why: "[чита́ть]{.ru} 词干以元音结尾，加 [-й]{.ru}；[повтори́ть]{.ru}、[взять]{.ru}、[написа́ть]{.ru} 的 [я]{.ru} 形式重音在词尾（[повторю́, возьму́, напишу́]{.ru}），加重读的 [-и]{.ru}；[встать]{.ru} 的 [я]{.ru} 形式 [вста́ну]{.ru} 重音在词干，加 [-ь]{.ru}；[сади́ться]{.ru} 辅音后 [-ся]{.ru}、元音后 [-сь]{.ru}：[сади́сь, сади́тесь]{.ru}；[дать]{.ru} 是特殊形式 [дай, да́йте]{.ru}。"
    items:
      - cue: повтори́ть (вы)
        accept: ["Повтори́те, пожа́луйста."]
      - cue: взять (ты)
        accept: ["Возьми́, пожа́луйста."]
      - cue: сади́ться (ты)
        accept: ["Сади́сь, пожа́луйста."]
      - cue: дать (вы)
        accept: ["Да́йте, пожа́луйста."]
      - cue: встать (ты)
        accept: ["Встань, пожа́луйста."]
      - cue: написа́ть (вы)
        accept: ["Напиши́те, пожа́луйста."]

  - id: e4
    type: fill
    task: 把括号里的数字和词写成正确的形式（数字用词写出）。
    why: 第 1 题“今天几号”：序数词中性第一格 + 月份第二格；第 2、3 题“在几号”：序数词和月份都用第二格，不加前置词；第 4 题只说月份，用 [в]{.ru} + 第六格，[май]{.ru} 重音不动；第 5 题 [восьмо́й]{.ru} 按形容词变成第六格；第 6 题复合序数词只变最后一个词，[тре́тий]{.ru} 中性是 [тре́тье]{.ru}。
    items:
      - stem: Сего́дня ___.
        hint: 10.11
        accept: [деся́тое ноября́]
      - stem: Контро́льная рабо́та бу́дет ___.
        hint: 25.11
        accept: [два́дцать пя́того ноября́]
      - stem: У О́льги Ви́кторовны день рожде́ния ___.
        hint: 3.03
        accept: [тре́тьего ма́рта]
      - stem: А у меня́ день рожде́ния ___.
        hint: в, май
        accept: [в ма́е]
      - stem: Ми́ша у́чится в ___ кла́ссе.
        hint: 8
        accept: [восьмо́м]
      - stem: За́втра бу́дет ___.
        hint: 23.02
        accept: [два́дцать тре́тье февраля́]

  - id: e5
    type: choice
    task: 选择正确的时间说法。
    why: 几点做某事用 [в]{.ru} + 钟点（第 1 题）；“过多久以后”用 [че́рез]{.ru} 放在前面（第 2 题）；“多久以前”用 [наза́д]{.ru} 放在后面（第 3 题）；“一点”只说 [в час]{.ru}（第 4 题）；只说月份用 [в]{.ru} + 第六格，说哪一天才用第二格（第 5 题）。
    items:
      - stem: Магази́н закрыва́ется ___.
        options: [в во́семь часо́в, во́семь часо́в, че́рез во́семь часо́в]
        answer: в во́семь часо́в
      - stem: Я бу́ду до́ма ___.
        options: [че́рез полчаса́, полчаса́ наза́д, в полчаса́]
        answer: че́рез полчаса́
      - stem: А́нна звони́ла ___.
        options: [час наза́д, наза́д час, че́рез час]
        answer: час наза́д
      - stem: Уро́к начина́ется ___.
        options: [в оди́н час, в час, час]
        answer: в час
      - stem: У ба́бушки день рожде́ния ___.
        options: [в январе́, января́, в января́]
        answer: в январе́

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊星期六在邮局寄了信；面包他每天早上买，蛋糕是过节买的；他的生日是五月十二号；老师纠正他：俄罗斯先写日、后写月；测验在十一月二十五号。
    items:
      - stem: В суббо́ту Ван Лэй ___.
        options: [отпра́вил письмо́ домо́й, звони́л домо́й]
        answer: отпра́вил письмо́ домо́й
      - stem: Хлеб Ван Лэй покупа́ет ___.
        options: [ка́ждое у́тро, на пра́здник]
        answer: ка́ждое у́тро
      - stem: "Ван Лэй пи́шет: «А у меня́ день рожде́ния ___»."
        options: [двена́дцатого ма́я, оди́ннадцатого октября́]
        answer: двена́дцатого ма́я
      - stem: «11.10» — э́то ___.
        options: [оди́ннадцатое октября́, деся́тое ноября́]
        answer: оди́ннадцатое октября́
      - stem: Контро́льная рабо́та бу́дет ___.
        options: [два́дцать пя́того ноября́, деся́того ноября́]
        answer: два́дцать пя́того ноября́

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题“做了一个小时”是过程，用未完成体，“没做完”说的是结果，用完成体。第 2 题“明天把信写完”强调结果，用完成体将来时 [напишу́]{.ru}，不能说 [бу́ду написа́ть]{.ru}。第 3 题请对方做一件具体的事，用完成体命令式。第 4 题“在几号”序数词和月份都用第二格，不加 [в]{.ru}。
    items:
      - zh: 练习我做了一个小时，可是没做完。
        accept: ["Я де́лал упражне́ние час, но не сде́лал.", "Упражне́ние я де́лал час, но не сде́лал.", "Я де́лал упражне́ние час, но не сде́лал его́.", "Упражне́ние я де́лал час, но не сде́лал его́.", "Я час де́лал упражне́ние, но не сде́лал.", "Я час де́лал упражне́ние, но не сде́лал его́."]
        rubric: ["“做了一个小时”用未完成体过去时 [де́лал]{.ru}", "“没做完”用完成体 [не сде́лал]{.ru}", "[час]{.ru} 直接放在动词后面，不加前置词"]
      - zh: 明天我把信写完。
        accept: ["За́втра я напишу́ письмо́.", "Я напишу́ письмо́ за́втра.", "Письмо́ я напишу́ за́втра.", "Я за́втра напишу́ письмо́."]
        rubric: ["完成体将来时 [напишу́]{.ru}", "不能用 [бу́ду]{.ru} + 完成体"]
      - zh: 请问，邮局在哪儿？
        accept: ["Скажи́те, пожа́луйста, где по́чта?", "Извини́те, скажи́те, пожа́луйста, где по́чта?", "Извини́те, где по́чта?", "Скажи́те, пожа́луйста, где здесь по́чта?", "Извини́те, пожа́луйста, где по́чта?", "Извини́те, скажи́те, где по́чта?"]
        rubric: ["对陌生人用 [вы]{.ru} 的形式 [скажи́те]{.ru} 或 [извини́те]{.ru}", "加 [пожа́луйста]{.ru}"]
      - zh: 米沙的生日是十一月二十号。
        accept: ["У Ми́ши день рожде́ния двадца́того ноября́.", "День рожде́ния у Ми́ши двадца́того ноября́.", "Двадца́того ноября́ у Ми́ши день рожде́ния.", "День рожде́ния Ми́ши двадца́того ноября́.", "День рожде́ния у Ми́ши — двадца́того ноября́."]
        rubric: ["“谁的生日”用 [у Ми́ши день рожде́ния]{.ru}", "日期用第二格 [двадца́того ноября́]{.ru}，不加 [в]{.ru}"]

  - id: e8
    type: open
    task: 短文：写一写你下个星期的计划。
    items:
      - prompt: 写 6–8 句话，说明今天几号、星期几，下个星期哪几天做什么、几点做；既用 [бу́ду]{.ru} + 不定式，也用完成体将来时；至少写出两个日期。
        length: 60–100
        model: "Сего́дня пе́рвое ноября́, воскресе́нье. За́втра у меня́ бу́дут уро́ки в де́вять часо́в. Ве́чером я бу́ду занима́ться в библиоте́ке. Во вто́рник я напишу́ письмо́ домо́й и отпра́влю его́. Четвёртого ноября́, в сре́ду, пра́здник. Мы бу́дем отдыха́ть на да́че у ба́бушки. Там я прочита́ю расска́з Толсто́го. Седьмо́го ноября́, в суббо́ту, я куплю́ торт: у меня́ бу́дут друзья́."
        rubric: ["日期：序数词中性第一格 + 月份第二格（今天几号），序数词第二格 + 月份第二格（在几号）", "说“要做什么”用 [бу́ду]{.ru} + 未完成体不定式，说“要做完一件事”用完成体将来时", "[в]{.ru} + 钟点、[в]{.ru} + 星期第四格"]
        notes: 范文先交代今天的日期，再按时间顺序一天一天往下写，每句开头用时间状语（[за́втра]{.ru}、[во вто́рник]{.ru}、[четвёртого ноября́]{.ru}），读起来清楚。学习、休息、玩这类说安排的句子用 [бу́ду]{.ru} + 未完成体；写完一封信、读完一篇小说、买一个蛋糕这类有结果的事用完成体将来时。两种体交替使用，正是本单元的重点。
