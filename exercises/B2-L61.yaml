lesson: B2-L61
grammar: "无人称动词：[темне́ет]{.ru} 等自然现象；[мне ка́жется]{.ru}、[мне хо́чется]{.ru}（人用第三格）；插入语 [ка́жется]{.ru}；[па́хнет]{.ru} + 第五格。过去时一律用中性。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句把句子改成无人称句。
    example:
      cue: Я хочу́ спать.
      answer: Мне хо́чется спать.
    why: "无人称句里人用第三格：[я → мне]{.ru}，[мы → нам]{.ru}，[А́нна → А́нне]{.ru}，[Ди́ма → Ди́ме]{.ru}；[Ю́ми]{.ru} 不变格。动词用第三人称单数 [хо́чется]{.ru}、[ка́жется]{.ru}，过去时用中性 [хоте́лось]{.ru}、[каза́лось]{.ru}，不随人的性别变化。"
    items:
      - cue: Ю́ми хо́чет пить.
        accept: ["Ю́ми хо́чется пить."]
      - cue: Мы хоте́ли гуля́ть.
        accept: ["Нам хоте́лось гуля́ть."]
      - cue: Я ду́маю, что он прав.
        accept: ["Мне ка́жется, что он прав."]
      - cue: А́нна ду́мала, что Ди́ма опозда́ет.
        accept: ["А́нне каза́лось, что Ди́ма опозда́ет."]
      - cue: Ди́ма не хо́чет е́хать домо́й.
        accept: ["Ди́ме не хо́чется е́хать домо́й."]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题无人称句里人用第三格 [мне]{.ru}。第 2 题 [Ю́ми]{.ru} 在这里是第三格（不变格），无人称句的过去时用中性 [хоте́лось]{.ru}，[хоте́лась]{.ru} 是错误形式。第 3 题“天黑”用动词 [темне́ет]{.ru}；[темно́]{.ru} 是副词“黑暗”，不能说“黑得晚”。第 4 题 [па́хнет]{.ru} 是无人称动词，用单数，气味用第五格。第 5 题插入语用 [ка́жется]{.ru}。第 6 题 [каза́ться]{.ru} + 第五格有主语 [Пьер]{.ru}，动词跟主语一致，用 [ка́жется]{.ru}，不用中性 [каза́лось]{.ru}。"
    items:
      - stem: ___ ка́жется, что сего́дня бу́дет дождь.
        options: [Я, Мне]
        answer: Мне
      - stem: Вчера́ Ю́ми о́чень ___ спать.
        options: [хоте́лось, хоте́лась]
        answer: хоте́лось
      - stem: В ию́не в Москве́ ___ по́здно.
        options: [темне́ет, темно́]
        answer: темне́ет
      - stem: На ку́хне ___ пирога́ми.
        options: [па́хнет, па́хнут]
        answer: па́хнет
      - stem: ___, я забы́л ключи́ до́ма.
        options: [Ка́жется, Ка́жусь]
        answer: Ка́жется
      - stem: Сего́дня Пьер ___ уста́лым.
        options: [каза́лось, ка́жется]
        answer: ка́жется

  - id: e3
    type: translate
    task: 译成俄语。
    why: "五句都是无人称句。第 1、2 题人用第三格 [мне]{.ru}；第 3 题 [никому́]{.ru} 是第三格，句中要有 [не]{.ru}；第 4 题“天黑”用 [темне́ет]{.ru}，不加主语；第 5 题“有……的香味”用 [па́хнет]{.ru} + 第五格。"
    items:
      - zh: 我觉得要下雨了。
        accept: ["Мне ка́жется, что бу́дет дождь.", "Мне ка́жется, бу́дет дождь.", "Мне ка́жется, что пойдёт дождь.", "Мне ка́жется, пойдёт дождь."]
        rubric: ["[мне ка́жется]{.ru}：人用第三格"]
      - zh: 我很想睡觉。
        accept: ["Мне о́чень хо́чется спать.", "Мне так хо́чется спать."]
        rubric: ["[мне хо́чется]{.ru}，不说 [я хо́чется]{.ru}"]
      - zh: 谁都不想回家。
        accept: ["Никому́ не хоте́лось е́хать домо́й.", "Никому́ не хо́чется е́хать домо́й.", "Никому́ не хоте́лось идти́ домо́й.", "Никому́ не хо́чется идти́ домо́й."]
        rubric: ["[никому́ не хо́чется / не хоте́лось]{.ru}", "过去时用中性 [хоте́лось]{.ru}"]
      - zh: 六月莫斯科天黑得很晚。
        accept: ["В ию́не в Москве́ темне́ет о́чень по́здно.", "В Москве́ в ию́не темне́ет о́чень по́здно.", "В ию́не в Москве́ темне́ет по́здно.", "В Москве́ в ию́не темне́ет по́здно."]
        rubric: ["无人称动词 [темне́ет]{.ru}，不加主语"]
      - zh: 厨房里有馅饼的香味。
        accept: ["На ку́хне па́хнет пирога́ми.", "На ку́хне па́хнет пирожка́ми."]
        rubric: ["[па́хнет]{.ru} + 第五格"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пое́хали друзья́ в воскресе́нье и что они́ взя́ли с собо́й? Почему́ Пьер не гото́вил шашлы́к? Что ду́мал Пьер о шашлыке́? Почему́ Ю́ми хоте́лось спать? Что бы́ло ве́чером?]{.ru}"
        length: 60–90
        model: "В воскресе́нье Ди́ма, А́нна, Ван Лэй, Ю́ми и Пьер пое́хали в парк на шашлыки́. Ди́ма взял гита́ру и мя́со, а А́нна — хлеб и о́вощи. Ди́ма сказа́л, что шашлы́к — де́ло одного́ челове́ка, и Пьер не помога́л. Пье́ру каза́лось, что во Фра́нции мя́со гото́вят лу́чше, но пото́м он согласи́лся, что шашлы́к о́чень вку́сный. Ю́ми хоте́лось спать, потому́ что она́ занима́лась до трёх часо́в но́чи. Ве́чером все пе́ли, и никому́ не хоте́лось е́хать домо́й."
        rubric: ["回答全部五个问题", "至少三处无人称句：[каза́лось]{.ru}、[хоте́лось]{.ru} 等", "过去时用中性"]
        notes: 范文约 75 词。课文里皮埃尔说的 [Мне ка́жется…]{.ru} 改成第三人称叙述，变成 [Пье́ру каза́лось…]{.ru}：人名变第三格，动词变过去时中性。

  - id: e5
    type: open
    task: 作文。题目：[Выходно́й на приро́де]{.ru}（在户外过的一天）。
    items:
      - prompt: 写一次你和朋友或家人去郊外、公园或河边的经历：去了哪里，做了什么，天气怎样，你的感受。至少用四个无人称动词（[ка́жется / каза́лось]{.ru}、[хо́чется / хоте́лось]{.ru}、[темне́ет / темне́ло]{.ru}、[па́хнет / па́хло]{.ru} 等）。
        length: 100–150
        model: "В про́шлое воскресе́нье мы с друзья́ми е́здили за го́род, на ре́ку.\n\nУ́тром бы́ло хо́лодно, и мне совсе́м не хоте́лось встава́ть. Но когда́ мы прие́хали, вы́шло со́лнце, и ста́ло тепло́. Мы сиде́ли на траве́ у воды́. Па́хло цвета́ми и ле́сом. Мне каза́лось, что я не в большо́м го́роде, а где́-то далеко́, в друго́й стране́.\n\nМой друг пригото́вил шашлы́к. Он гото́вил его́ це́лый час, а мы съе́ли его́ за пять мину́т! Пото́м мы игра́ли в мяч и пе́ли пе́сни.\n\nТемне́ть на́чало то́лько в де́сять часо́в. Никому́ не хоте́лось е́хать домо́й, но за́втра на́до бы́ло рабо́тать и учи́ться. Мне ка́жется, э́то был оди́н из лу́чших дней ле́та."
        rubric: ["写清地点、活动、天气和感受", "至少四个无人称动词，人用第三格", "过去时用中性"]
        notes: 范文用了五处无人称结构：[мне не хоте́лось]{.ru}、[па́хло цвета́ми]{.ru}、[мне каза́лось]{.ru}、[темне́ть на́чало]{.ru}、[никому́ не хоте́лось]{.ru}，结尾的 [мне ка́жется]{.ru} 用现在时，表示写作时的看法。还复习了 [за пять мину́т]{.ru}（第 57 课）、[где́-то]{.ru}（第 59 课）、[оди́н из лу́чших]{.ru}（第 58 课）。

  - id: e6
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是由美。6 月 21 日给东京的父母写信：讲讲考试期间同学们去公园烤肉的事，描写当时的天气和气氛，说说你的心情。
        length: 80–120
        model: "Москва́, 21 ию́ня\n\nДороги́е ма́ма и па́па!\n\nУ меня́ всё хорошо́. Два экза́мена уже́ позади́, оста́лся оди́н.\n\nВчера́ мы с друзья́ми е́здили в парк на шашлыки́. Шашлы́к — э́то мя́со, кото́рое гото́вят на огне́. Гото́вил его́ наш друг Ди́ма. Снача́ла мне о́чень хоте́лось спать, потому́ что в суббо́ту я занима́лась до трёх часо́в но́чи, и я спала́ на траве́. А когда́ запа́хло мя́сом, я сра́зу просну́лась!\n\nВ ию́не здесь темне́ет о́чень по́здно, и мы сиде́ли в па́рке до десяти́ часо́в. Мне каза́лось, что се́ссии нет и сейча́с кани́кулы.\n\nЯ по вас о́чень скуча́ю. Жду ва́ших пи́сем!\n\nВа́ша Ю́ми"
        rubric: ["书信格式；给父母写信用 [вы]{.ru}", "讲清烤肉的经过", "至少三处无人称句", "写出心情"]
        notes: 由美给父母解释了什么是 [шашлы́к]{.ru}：外国人写信讲俄罗斯的事，常常需要这样补一句说明。[когда́ запа́хло мя́сом, я сра́зу просну́лась]{.ru} 照课文的情节写，但换成了由美自己的角度。结尾 [Я по вас о́чень скуча́ю]{.ru}：[скуча́ть по]{.ru} 加第三格，复数代词用 [по вас]{.ru}。
