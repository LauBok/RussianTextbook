lesson: B4-L17
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Где сидит мальчик в начале воспоминания и что он слышит? Что происходит, когда он прищуривает глаза? Как мать будит Николеньку и о чём она его просит? О чём мальчик молится перед сном? Кого он жалеет и почему? Какими вопросами заканчивается глава?]{.ru}"
        length: 100–140
        model: "Вечером мальчик сидит за чайным столом на своём высоком креслице и слушает, как мать говорит с кем-то; её голос кажется ему сладким и приветливым. Когда он прищуривает глаза, лицо матери становится совсем маленьким, не больше пуговки, но стоит ему пошевелиться — и очарование исчезает. Потом он засыпает в кресле. Мать будит его: проводит рукой по его волосам, щекочет его и ласково зовёт спать. Она просит сына всегда любить её и не забывать, если её не будет. Перед сном мальчик молится за папеньку и маменьку и просит, чтобы Бог дал счастья всем. Он жалеет Карла Иваныча, потому что это единственный несчастливый человек, которого он знает. Глава заканчивается вопросами взрослого рассказчика: вернутся ли когда-нибудь чистота и вера детства и неужели остались одни воспоминания."
        rubric: ["六个问题都回答，事实与选文一致", "母亲的请求要写出“不要忘记她”", "最后一问要指出提问的是成年的叙述者", "100–140 词"]
        notes: "答案依次在第 2 段（茶桌、声音、眯眼）、第 6–10 段（叫醒）、第 13 段（母亲的请求）、第 16–17 段（祷告、卡尔·伊凡内奇）和第 18–20 段（结尾的问句）。转述时把泛指的“你”改成第三人称“他”：[сидишь и слушаешь]{.ru} → [он сидит и слушает]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[досыта]{.ru}"
        accept: ["Столько, сколько хочется.", "Так много, что больше не хочется.", "Сколько хочется, до конца."]
        rubric: ["说明是“做到满足为止、尽情地”"]
      - zh: "[пристально]{.ru}"
        accept: ["Очень внимательно и долго.", "Долго и внимательно, не отводя глаз.", "Внимательно, не отводя глаз."]
        rubric: ["说明是长时间、专注地（看）"]
      - zh: "[невольно]{.ru}"
        accept: ["Само собой, без желания.", "Не желая этого, само собой.", "Не думая, само собой."]
        rubric: ["说明是不由自主、不是有意的"]
      - zh: "[равнодушный]{.ru}"
        accept: ["Такой, которому всё равно.", "Человек, которого ничто не интересует и не волнует.", "Холодный, которому всё равно."]
        rubric: ["说明是对别人、对事情漠不关心的"]
      - zh: "[участь]{.ru}"
        accept: ["Судьба.", "Судьба человека.", "То, что случается с человеком в жизни, судьба."]
        rubric: ["说明是命运、遭遇"]
      - zh: "[неуловимый]{.ru}"
        accept: ["Такой, который нельзя поймать.", "Такой, который трудно понять и поймать.", "Такой, который быстро исчезает и который нельзя поймать."]
        rubric: ["说明是抓不住、捉摸不定的"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题全章的框架是成年叙述者的回忆和感叹，开头和结尾都是他在说话，不是孩子的日记。第 2 题 [бывало]{.ru} 是插入语，表示过去常常发生的事，不是一次。第 3 题 [придёшь … станешь]{.ru} 形式上是完成体将来时，但和 [бывало]{.ru} 一起表示过去反复的动作，不是将来，也不是命令（命令式是 [приди, стань]{.ru}）。第 4 题指小形式写的是孩子眼里的小东西，表示亲切，和“不喜欢”正好相反。第 5 题母亲不久就去世了，这句话在全书中有预示作用；选文里没有说她要出门，她也没有生气。第 6 题见第 17 段：[единственном человеке, которого я знал несчастливым]{.ru}，说的是卡尔·伊凡内奇。"
    items:
      - stem: Глава написана от лица ___.
        options: ["взрослого человека, который вспоминает детство", "маленького мальчика, который пишет дневник", "матери Николеньки"]
        answer: "взрослого человека, который вспоминает детство"
      - stem: "В словах «сидишь, бывало, за чайным столом» слово «бывало» показывает, что ___."
        options: [это случалось много раз, это случилось только один раз, это случится в будущем]
        answer: это случалось много раз
      - stem: "В словах «придёшь наверх и станешь перед иконами» глаголы совершенного вида означают ___."
        options: [действие, которое часто повторялось в прошлом, действие в будущем, приказ]
        answer: действие, которое часто повторялось в прошлом
      - stem: "Слова «креслице», «одеяльце», «пальчики» ___."
        options: [помогают увидеть мир глазами ребёнка, "показывают, что рассказчик не любит эти вещи", названия мест в доме]
        answer: помогают увидеть мир глазами ребёнка
      - stem: "Слова матери «Если не будет твоей мамаши, ты не забудешь её?» важны, потому что ___."
        options: ["мать скоро умрёт, и эти слова как будто говорят об этом заранее", "мать собирается уехать в другой город", "мать сердится на сына"]
        answer: "мать скоро умрёт, и эти слова как будто говорят об этом заранее"
      - stem: Единственный несчастливый человек, которого знал мальчик, — ___.
        options: [Карл Иваныч, мать, отец]
        answer: Карл Иваныч

  - id: e4
    type: rewrite
    task: 把句子改成普通的第一人称过去时（未完成体），去掉 [бывало]{.ru} 和泛指的“你”，比较两种写法的效果。
    example:
      cue: Набегавшись досыта, сидишь, бывало, за чайным столом.
      answer: Набегавшись досыта, я обычно сидел за чайным столом.
    why: "泛指的第二人称换成 [я]{.ru}；完成体将来时（[придёшь, станешь, завернёшься, повернёшься, уснёшь]{.ru}）表示的是过去反复的动作，改成未完成体过去时：[приходил, становился, заворачивался, поворачивался, засыпал]{.ru}。[бывало]{.ru} 可以去掉，也可以换成 [обычно]{.ru} 或 [часто]{.ru}。容易错的是保留完成体过去时（[пришёл, стал]{.ru}），那就成了一次性的动作。第 4 题无人称的 [жалко станет]{.ru} 变成 [мне становилось жалко]{.ru}，要补出第三格 [мне]{.ru}。"
    items:
      - cue: Придёшь, бывало, наверх и станешь перед иконами.
        accept: ["Я приходил наверх и становился перед иконами.", "Обычно я приходил наверх и становился перед иконами.", "Я обычно приходил наверх и становился перед иконами."]
      - cue: После молитвы завернёшься, бывало, в одеяльце.
        accept: ["После молитвы я заворачивался в одеяльце.", "После молитвы я обычно заворачивался в одеяльце.", "Обычно после молитвы я заворачивался в одеяльце."]
      - cue: Повернёшься на другой бок и уснёшь.
        accept: ["Я поворачивался на другой бок и засыпал.", "Я обычно поворачивался на другой бок и засыпал."]
      - cue: Вспомнишь о Карле Иваныче, и так жалко станет.
        accept: ["Я вспоминал о Карле Иваныче, и мне становилось очень жалко.", "Я вспоминал о Карле Иваныче, и мне становилось так жалко.", "Когда я вспоминал о Карле Иваныче, мне становилось очень жалко.", "Когда я вспоминал о Карле Иваныче, мне становилось так жалко его.", "Я вспоминал о Карле Иваныче, и мне становилось его очень жалко."]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右，用第三人称（[рассказчик, мальчик]{.ru}）转述，保留开头和结尾成年叙述者的感叹。
    items:
      - prompt: "[Кратко перескажите главу «Детство».]{.ru}"
        length: 130–170
        model: "Рассказчик, уже взрослый человек, называет детство счастливой порой, которая никогда не вернётся, и говорит, что воспоминания о нём делают его душу чище. Он вспоминает, как маленьким мальчиком сидел вечером за чайным столом и слушал голос матери. Глаза у него закрывались, но он не хотел уходить спать и засыпал прямо в кресле. Потом мать будила его: нежно проводила рукой по его волосам и щекотала его. Мальчик обнимал её и говорил, как он её любит, а она просила его никогда не забывать её, если её не будет. Перед сном он молился за родителей, жалел своего несчастного учителя Карла Иваныча и просил Бога дать счастье всем людям. Потом он засыпал спокойно, ещё с мокрым от слёз лицом. В конце рассказчик с грустью спрашивает, вернутся ли когда-нибудь чистота, любовь и вера, которые были у него в детстве, и неужели у него остались одни воспоминания."
        rubric: ["开头和结尾写出成年叙述者的感慨", "保留三个场景：茶桌旁、母亲叫醒他、睡前祷告", "写出母亲“不要忘记我”的请求", "用第三人称和过去时转述，不照抄原文的长句", "130–170 词"]
        notes: "范文约 160 词，分三步：开头一句概括第 1 段的感叹；中间按时间顺序写三个场景，把原文的现在时和完成体将来时都改成未完成体过去时（[сидел, засыпал, будила, молился]{.ru}），表示“常常如此”；结尾用间接问句（[спрашивает, вернутся ли…]{.ru}）转述最后三段的问句。删去的内容：眯眼看母亲“变小”的细节、瓷玩具、对天使的描写。"

  - id: e6
    type: open
    task: 作文。以 [«Моё самое дорогое воспоминание детства»]{.ru} 为题，用俄语写一篇 250–300 词的短文。试着像托尔斯泰那样，用 [бывало]{.ru}、泛指的“你”或完成体将来时写一个常常重复的场景，开头或结尾加上今天的你对童年的看法。
    items:
      - prompt: "[Моё самое дорогое воспоминание детства]{.ru}"
        length: 250–300
        model: "Когда я думаю о детстве, я прежде всего вспоминаю летние вечера у бабушки в деревне. Мне было тогда шесть или семь лет, и каждое лето родители привозили меня к ней на два месяца.\n\nНабегаешься, бывало, за день с соседскими детьми, накупаешься в реке, придёшь домой усталый и голодный, а бабушка уже ставит на стол самовар. Сядешь у окна, пьёшь чай с вареньем и слушаешь, как она рассказывает о своей молодости. Голос у неё тихий, спокойный, и под этот голос глаза сами закрываются. Скажешь: «Я не хочу спать», — а через минуту уже спишь прямо за столом. Проснёшься утром в своей кровати и не помнишь, кто тебя туда отнёс.\n\nБабушка никогда не ругала меня, даже когда я разбивал чашки или приходил домой мокрый и грязный. Она только качала головой и говорила: «Ну, ничего, высохнешь». Мне казалось, что она знает всё на свете: как называется каждая птица в саду, когда пойдёт дождь, почему на небе столько звёзд.\n\nТеперь бабушки уже нет, а в её доме живут другие люди. Я давно вырос, живу в большом городе, у меня много работы и мало свободного времени. Но иногда вечером, когда я пью чай один, я вдруг вспоминаю её голос, запах травы и реки, тёплые летние ночи. И тогда я понимаю, что был в то время по-настоящему счастлив. Как и Толстой, я спрашиваю себя: вернётся ли когда-нибудь эта простая радость? Наверное, нет. Но у меня остались воспоминания, и за них я благодарен своему детству."
        rubric: ["写一个常常重复的童年场景，而不是一次性的事件", "至少两处用 [бывало]{.ru}、泛指的“你”或完成体将来时表示过去反复的动作，形式正确", "有成年后的回望：开头或结尾写今天的感受", "有具体的感官细节（声音、气味、触觉）", "250–300 词"]
        notes: "范文约 280 词。结构仿照选文：第一段交代时间地点；第二段用 [Набегаешься, бывало…, придёшь…, сядешь…]{.ru} 写一个反复出现的夏夜，这是本课的重点手段，完成体将来时表示的是过去，翻译成汉语是“常常是……就……”；第三段写人物；最后一段回到现在，用托尔斯泰式的问句收尾。注意时态：写“常常如此”时用完成体将来时或未完成体过去时，写“现在”时用现在时，不要混成完成体过去时。"
