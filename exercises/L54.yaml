lesson: L54
grammar: "无人称句：[на́до, ну́жно, мо́жно, нельзя́]{.ru} + 不定式，主体用第三格；过去时加 [бы́ло]{.ru}，将来时加 [бу́дет]{.ru}；[Мо́жно?]{.ru} 用于请求允许；[нельзя́]{.ru} + 未完成体表示禁止。"
exercises:

  - id: e1
    type: choice
    task: 选择 [мо́жно]{.ru}、[нельзя́]{.ru} 或 [на́до]{.ru}。
    why: "[мо́жно]{.ru} 表示允许，[нельзя́]{.ru} 表示禁止，[на́до]{.ru} 表示必须。按课文里彼得罗夫家的规矩判断：进门必须脱鞋（第 1 题），房间里不许吃东西（第 2 题），厨房里可以吃（第 3 题）。第 5 题后半句“不过只能玩一个小时”说明是允许。"
    items:
      - stem: Боти́нки ___ снять.
        options: [мо́жно, нельзя́, на́до]
        answer: на́до
      - stem: В ко́мнате есть ___.
        options: [мо́жно, нельзя́, на́до]
        answer: нельзя́
      - stem: Есть ___ то́лько на ку́хне.
        options: [мо́жно, нельзя́, на́до]
        answer: мо́жно
      - stem: Здесь ___ кури́ть.
        options: [мо́жно, нельзя́, на́до]
        answer: нельзя́
      - stem: Ну хорошо́, ___ игра́ть. Но то́лько час.
        options: [мо́жно, нельзя́, на́до]
        answer: мо́жно

  - id: e2
    type: rewrite
    task: 把句子改成无人称句。
    placeholder: Мне на́до …
    example:
      cue: Я рабо́таю. (на́до)
      answer: Мне на́до рабо́тать.
    why: 无人称句里没有第一格主语，动作的主体用第三格：[я → мне]{.ru}，[ты → тебе́]{.ru}，[мы → нам]{.ru}，[Ми́ша → Ми́ше]{.ru}。动词变成不定式。最常见的错误是保留第一格，写成 *[Я на́до…]{.ru}*。
    items:
      - cue: Ми́ша де́лает уро́ки. (ну́жно)
        accept: ["Ми́ше ну́жно де́лать уро́ки.", "Ми́ше ну́жно сде́лать уро́ки."]
      - cue: Мы игра́ем на компью́тере? (мо́жно)
        accept: ["Нам мо́жно игра́ть на компью́тере?"]
      - cue: Ты мо́ешь ру́ки. (на́до)
        accept: ["Тебе́ на́до мыть ру́ки.", "Тебе́ на́до помы́ть ру́ки."]
      - cue: Ко́стя берёт Му́рку? (мо́жно)
        accept: ["Ко́сте мо́жно взять Му́рку?", "Ко́сте мо́жно брать Му́рку?"]

  - id: e3
    type: fill
    task: 把句子改成过去时或将来时，填 [бы́ло]{.ru} 或 [бу́дет]{.ru}。
    why: 无人称句的过去时一律用中性 [бы́ло]{.ru}，将来时用 [бу́дет]{.ru}，不随第三格的人变化。第 1 题不能因为 [А́нне]{.ru} 是女性就写 *[была́]{.ru}*。
    items:
      - stem: Вчера́ А́нне на́до ___ рабо́тать.
        accept: [бы́ло]
      - stem: За́втра нам ну́жно ___ сде́лать уро́ки.
        accept: [бу́дет]
      - stem: Вчера́ Ми́ше нельзя́ ___ игра́ть на компью́тере.
        accept: [бы́ло]
      - stem: В суббо́ту мо́жно ___ спать до́лго.
        accept: [бу́дет]

  - id: e4
    type: choice
    task: 选择正确的动词体。
    why: "[нельзя́]{.ru} 表示禁止时，后面用未完成体（第 1、2 题）；表示做不到时用完成体（第 3 题：没有钥匙，门打不开）。[на́до]{.ru} 后面要做完一件具体的事，用完成体（第 4 题），表示经常要做的事用未完成体。"
    items:
      - stem: На уро́ке нельзя́ ___ по телефо́ну.
        options: [говори́ть, сказа́ть]
        answer: говори́ть
      - stem: В ко́мнате нельзя́ ___.
        options: [есть, съесть]
        answer: есть
      - stem: "Дверь нельзя́ ___: у нас нет ключа́."
        options: [открыва́ть, откры́ть]
        answer: откры́ть
      - stem: Сейча́с мне на́до ___ уро́ки, пото́м я бу́ду игра́ть.
        options: [де́лать, сде́лать]
        answer: сде́лать

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1–5 题都是无人称句：主体用第三格，后面接不定式。第 6 题是普通的人称句，主语 [Ко́стя]{.ru} 用第一格。
    items:
      - zh: 这里不许吸烟。
        accept: ["Здесь нельзя́ кури́ть.", "Кури́ть здесь нельзя́.", "Здесь кури́ть нельзя́."]
        rubric: ["用 [нельзя́]{.ru} + 未完成体 [кури́ть]{.ru}"]
      - zh: 我可以洗手吗？
        accept: ["Мне мо́жно помы́ть ру́ки?", "Мо́жно помы́ть ру́ки?", "Мо́жно мне помы́ть ру́ки?", "Я могу́ помы́ть ру́ки?"]
        rubric: ["用 [мо́жно]{.ru} 时“我”用 [мне]{.ru}，也可以省去", "[ру́ки]{.ru} 是复数"]
      - zh: 米沙得做功课。
        accept: ["Ми́ше на́до де́лать уро́ки.", "Ми́ше ну́жно де́лать уро́ки.", "Ми́ше на́до сде́лать уро́ки.", "Ми́ше ну́жно сде́лать уро́ки."]
        rubric: ["[Ми́ше]{.ru} 用第三格", "“做功课”是 [де́лать уро́ки]{.ru}"]
      - zh: 昨天我得工作。
        accept: ["Вчера́ мне на́до бы́ло рабо́тать.", "Вчера́ мне ну́жно бы́ло рабо́тать.", "Мне вчера́ на́до бы́ло рабо́тать.", "Мне вчера́ ну́жно бы́ло рабо́тать."]
        rubric: ["过去时加 [бы́ло]{.ru}", "主体用 [мне]{.ru}"]
      - zh: 在我们家进门要脱鞋。
        accept: ["У нас до́ма на́до снять боти́нки.", "У нас до́ма боти́нки на́до снять.", "У нас до́ма ну́жно снять боти́нки.", "У нас до́ма боти́нки ну́жно снять.", "У нас на́до снима́ть боти́нки.", "У нас до́ма на́до снима́ть боти́нки."]
        rubric: ["用 [на́до]{.ru} 或 [ну́жно]{.ru} + 不定式", "“鞋”用复数 [боти́нки]{.ru}"]
      - zh: 科斯佳已经不小了。
        accept: ["Ко́стя уже́ не ма́ленький."]
        rubric: ["“已经不”是 [уже́ не]{.ru}，[не]{.ru} 放在形容词前面", "[ма́ленький]{.ru} 和 [Ко́стя]{.ru} 一致，用阳性"]

  - id: e6
    type: open
    task: 你家（或宿舍）的规矩：写一写在你家什么可以做、什么不可以做、什么必须做。
    items:
      - prompt: 写 5–7 句话，[мо́жно]{.ru}、[нельзя́]{.ru}、[на́до]{.ru} 或 [ну́жно]{.ru} 每个至少用一次。
        length: 40–80
        model: "У нас до́ма то́же так. Боти́нки на́до снять, вот та́почки. Есть мо́жно то́лько на ку́хне. В ко́мнате нельзя́ кури́ть. Ве́чером мо́жно смотре́ть телеви́зор, но то́лько час. Мне ну́жно де́лать уро́ки ка́ждый день. А ко́шке мо́жно всё!"
        rubric: ["四个词都用到", "主体用第三格，不用第一格", "禁止的意思用 [нельзя́]{.ru} + 未完成体"]
        notes: 范文先总说“我们家也有规矩”，再一条一条说，最后用一句轻松的话收尾。每句只说一条规矩，句子短，容易检查语法。注意 [на́до]{.ru}、[мо́жно]{.ru} 一般紧跟在主体后面，后面再接不定式。
