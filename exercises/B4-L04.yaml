lesson: B4-L04
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Как Вера Николаевна узнала о смерти Желткова? Что говорилось в газете о причине его смерти? Что Желтков пишет о своей любви? О чём он просит Веру Николаевну? Что думает о Желткове князь Шеин?]{.ru}"
        length: 90–130
        model: "Вера Николаевна никогда не читала газет, но в этот день случайно развернула газету и прочла несколько строк о том, что чиновник Желтков покончил жизнь самоубийством. В газете говорилось, что причиной смерти была растрата казённых денег. Вечером почтальон принёс письмо от Желткова. Он пишет, что любовь к Вере — это громадное счастье, которое послал ему бог, что вся его жизнь заключается только в ней и что он благодарен ей за то, что она существует. Он просит Веру сжечь письмо, а если она его вспомнит, сыграть сонату Бетховена. Князь Шеин прочёл письмо и сказал, что не сомневается в искренности этого человека: Желтков действительно любил Веру и вовсе не был сумасшедшим."
        rubric: ["五个问题都回答，内容与选文一致", "指出报上说的死因（挪用公款）和信里透露的真实原因不同", "说出信里的请求：烧掉信、弹奏贝多芬奏鸣曲"]
        notes: "第 2 题要和第 3 题对照着答：报上说是挪用公款，信里却只谈爱情。这正是本章的结构。转述信的内容时用间接引语：[Он пишет, что…]{.ru}，[Он просит Веру…]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[самоотверженный]{.ru}"
        accept: ["Такой, кто думает о других больше, чем о себе.", "Готовый всё отдать для другого человека.", "Забывающий о себе ради другого."]
        rubric: ["说明是为了别人忘记自己、牺牲自己"]
      - zh: "[предчувствовать]{.ru}"
        accept: ["Чувствовать заранее, что что-то случится.", "Знать заранее, что произойдёт.", "Ждать, что случится что-то плохое."]
        rubric: ["说明是事情发生之前就感觉到"]
      - zh: "[растрата]{.ru}"
        accept: ["Когда человек тратит чужие или казённые деньги на себя.", "Когда человек берёт казённые деньги себе.", "Когда человек тратит деньги, которые ему не принадлежат."]
        rubric: ["说明是把别人的、公家的钱花掉"]
      - zh: "[житейский]{.ru}"
        accept: ["Связанный с обычной жизнью.", "Такой, какой бывает в обычной жизни.", "Обычный, простой."]
        rubric: ["说明是日常生活的、世俗的"]
      - zh: "[искренность]{.ru}"
        accept: ["Когда человек говорит то, что думает и чувствует.", "Правда в чувствах и словах.", "Когда человек не говорит неправду."]
        rubric: ["说明是真诚，说的和想的、感到的一致"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题报纸消息用名词化和复合前置词（[по причине растраты]{.ru}、[ввиду того что]{.ru}），是公文语体，没有感情色彩；抒情的是信，口语的是丈夫的话。第 2 题信里 [Вы]{.ru}、[Вам]{.ru}、[Вас]{.ru} 大写是书信中表示尊敬的写法，不是因为句首，也不是表示复数。第 3 题 [Да святится имя Твоё]{.ru} 是《主祷文》的第一句，原是对上帝的祈祷，热尔特科夫把它献给所爱的人，并不是诗人或薇拉说过的话。第 4 题“唯一的欢乐、唯一的安慰、唯一的思念”是三个同类成分逐步加强，这是排比和递进。第 5 题舍英说热尔特科夫 [вовсе не был сумасшедшим]{.ru}，承认他是真心相爱，所以他尊重这个人，既不嘲笑，也不害怕。"
    items:
      - stem: Сообщение в газете написано ___.
        options: [официальным языком, языком письма о любви, разговорным языком]
        answer: официальным языком
      - stem: В письме слова «Вы», «Вам», «Вас» пишутся с большой буквы, чтобы ___.
        options: [показать уважение, начать новое предложение, говорить о многих людях]
        answer: показать уважение
      - stem: "Слова «Да святится имя Твоё» — это ___."
        options: ["слова, которые говорят богу", слова Аносова, слова Веры]
        answer: "слова, которые говорят богу"
      - stem: "В словах «единственной радостью, единственным утешением, единой мыслью» автор использует ___."
        options: ["повторение, которое делает мысль сильнее", вопрос к читателю, рассказ о прошлом]
        answer: "повторение, которое делает мысль сильнее"
      - stem: Князь Шеин о Желткове говорит ___.
        options: [с уважением, с насмешкой, со страхом]
        answer: с уважением

  - id: e4
    type: fill
    task: 用括号里的词的适当形式填空，句子取自选文。
    why: "第 1 题 [разобраться в чём]{.ru}，[в]{.ru} 要求第六格，[языке]{.ru}。第 2 题 [покончить жизнь чем]{.ru}，“以自杀结束生命”，第五格 [самоубийством]{.ru}。第 3 题 [заключаться в ком-чём]{.ru}“在于”，[в Вас]{.ru} 是第六格，代词 [Вы]{.ru} 第六格是 [Вас]{.ru}，书信里大写。第 4 题 [благодарен кому за что]{.ru}，[за то, что]{.ru} 引出原因，这里是 [то]{.ru}。第 5 题 [произвести впечатление на кого]{.ru}，[впечатление]{.ru} 是第四格，形式不变。第 6 题 [сомневаться в чём]{.ru}，第六格 [искренности]{.ru}。"
    items:
      - stem: Она никогда не могла разобраться в том ___, которым нынче пишут.
        hint: язык
        accept: ["языке"]
      - stem: Вчера вечером покончил жизнь ___ чиновник Желтков.
        hint: самоубийство
        accept: ["самоубийством"]
      - stem: Для меня вся жизнь заключается только в ___.
        hint: Вы
        accept: ["Вас"]
      - stem: Я бесконечно благодарен Вам только за ___, что Вы существуете.
        hint: то
        accept: ["то"]
      - stem: Воображаю, какое он ___ произвёл на Ваших гостей.
        hint: впечатление
        accept: ["впечатление"]
      - stem: Я не сомневаюсь в ___ этого человека.
        hint: искренность
        accept: ["искренности"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение одиннадцатой главы повести «Гранатовый браслет».]{.ru}"
        length: 130–170
        model: "Княгиня Вера Николаевна случайно прочла в газете, что чиновник Желтков покончил жизнь самоубийством, а причиной была растрата казённых денег. Вера поняла, что это тот самый человек, который много лет писал ей письма и прислал гранатовый браслет. Весь день она не могла найти себе места и думала о нём: что это было — любовь или сумасшествие? Вечером почтальон принёс его последнее письмо. Желтков писал, что не виноват в своей любви, которую послал ему бог, что вся его жизнь была только в Вере и что он благодарен ей за то, что она существует. Он рассказывал, как восемь лет назад увидел её в цирке, просил прощения за браслет и просил сжечь письмо. Если она его вспомнит, пусть сыграет сонату Бетховена. Вера со слезами показала письмо мужу. Князь Шеин сказал, что этот человек действительно любил её и не был сумасшедшим. Вера решила поехать в город и посмотреть на Желткова, и муж согласился."
        rubric: ["130–170 词", "写出报上的消息、薇拉的心情、信的主要内容、丈夫的看法和薇拉的决定", "信的内容用间接引语转述", "不加入原文没有的评论"]
        notes: "范文约 160 词。信是本章的中心，概要里可以占一半篇幅，但只保留要点：爱情是上帝的赐予、感激对方存在、八年前的初见、为手镯道歉、请求烧信和弹奏奏鸣曲。抒情的修辞（排比、重复）在概要里不必保留。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Любовь или сумасшествие?» Как вы понимаете чувство Желткова? Можно ли назвать его любовь настоящей?]{.ru}"
        length: 250–300
        model: "Вера Николаевна задаёт себе вопрос: что это было — любовь или сумасшествие? На первый взгляд история Желткова действительно кажется странной. Восемь лет он любит женщину, которую видел только со стороны: в цирке, на балу, на концертах. Он пишет ей письма, хотя она запретила ему писать, берёт себе её платок и программу выставки, а в конце концов кончает жизнь самоубийством. Многие сказали бы, что это болезнь. Но, прочитав его последнее письмо, я думаю иначе. Сам Желтков пишет, что проверял себя и что это не болезнь. В его письме нет ни одного требования, ни одного упрёка. Он ничего не просит для себя, кроме одного: чтобы Вера иногда вспоминала о нём под музыку Бетховена. Он благодарит её только за то, что она существует. Такая любовь ничего не хочет для себя, она хочет только, чтобы любимый был счастлив. Недаром он желает, чтобы «ничто временное и житейское» не тревожило её душу. Даже князь Шеин, муж Веры, который мог бы сердиться на этого человека, говорит, что Желтков любил её и не был сумасшедшим. Конечно, в этой истории много грустного. Желтков жил только своим чувством и не видел ничего другого: «ни политика, ни наука, ни философия» его не интересовали. Мне кажется, это очень опасно — отдать всю жизнь одному человеку, который даже не знает тебя. И всё же я согласен с Аносовым, слова которого вспоминает Вера: её жизненный путь пересекла «настоящая, самоотверженная, истинная любовь». Она может быть трагической, но её нельзя назвать сумасшествием. Поэтому я думаю, что чувство Желткова — настоящая, самоотверженная любовь, о которой многие только мечтают."
        rubric: ["250–300 词", "明确回答“爱情还是疯狂”", "引用信中的词句作论据", "考虑相反的看法（承认这种感情的悲剧性、危险性）", "结论清楚"]
        notes: "范文约 280 词。结构：一、提出问题（借用薇拉的话）；二、相反的看法——这像是病态；三、反驳：信里没有要求、没有抱怨，只有感激；丈夫的证词；四、让步：这种感情也有悲剧和危险的一面；五、结论。议论文里引用原文要用引号并让引文和句子的语法衔接：[желает, чтобы «ничто временное и житейское» не тревожило её душу]{.ru}。"
