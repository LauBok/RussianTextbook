lesson: B2-L51
grammar: "原因与结果：[так как]{.ru}、[потому́ что]{.ru}；[поэ́тому]{.ru}、[так что]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的连接词。
    why: "先判断空后面的分句是原因还是结果。第 1、4 题后面是原因：第 1 题原因放在句首，只能用 [Так как]{.ru}；第 4 题原因在后，[потому́ что]{.ru} 最常用。第 2、3、5 题后面是结果，用 [так что]{.ru} 或 [поэ́тому]{.ru}：第 2 题给出的选项里只有 [так что]{.ru} 表示结果；第 3 题前面有 [и]{.ru}，[и]{.ru} 后只能接副词 [поэ́тому]{.ru}，不能接连接词 [так что]{.ru}；第 5 题只有 [поэ́тому]{.ru} 表示结果。"
    items:
      - stem: ___ шёл дождь, матч перенесли́ на суббо́ту.
        options: [Так как, Потому́ что, Так что]
        answer: Так как
      - stem: Бу́дет гроза́, ___ возьми́те зонт.
        options: [так как, потому́ что, так что]
        answer: так что
      - stem: Ван Лэй не взял зонт, и ___ он промо́к.
        options: [так что, поэ́тому, так как]
        answer: поэ́тому
      - stem: Ми́ша смея́лся, ___ на не́бе не́ было ни о́блака.
        options: [потому́ что, поэ́тому, так что]
        answer: потому́ что
      - stem: Ла́сточки лета́ли ни́зко, ___ ма́ма сказа́ла, что бу́дет дождь.
        options: [так как, поэ́тому, потому́ что]
        answer: поэ́тому

  - id: e2
    type: rewrite
    task: 按例句把用 [потому́ что]{.ru} 的句子改成以 [так как]{.ru} 开头的句子。
    example:
      cue: Они́ промо́кли, потому́ что не взя́ли зонт.
      answer: Так как они́ не взя́ли зонт, они́ промо́кли.
    why: "[так как]{.ru} 引出的原因放到句首，两个分句之间用逗号，主句里的主语要保留或补出。第 2 题的主语都是 [Ван Лэй]{.ru}，名词放在前面出现的分句里，后面用 [он]{.ru}。第 3 题主句是无人称句 [бы́ло ду́шно]{.ru}，原因分句 [так как бы́ло жа́рко]{.ru} 不变。"
    items:
      - cue: Матч перенесли́, потому́ что была́ гроза́.
        accept: ["Так как была́ гроза́, матч перенесли́."]
      - cue: Ван Лэй сра́зу переоде́лся, потому́ что он не хоте́л заболе́ть.
        accept: ["Так как Ван Лэй не хоте́л заболе́ть, он сра́зу переоде́лся.", "Так как он не хоте́л заболе́ть, Ван Лэй сра́зу переоде́лся."]
      - cue: Мы откры́ли окно́, потому́ что бы́ло ду́шно.
        accept: ["Так как бы́ло ду́шно, мы откры́ли окно́."]
      - cue: Ди́ма опозда́л, потому́ что он проспа́л.
        accept: ["Так как Ди́ма проспа́л, он опозда́л.", "Так как он проспа́л, Ди́ма опозда́л."]

  - id: e3
    type: rewrite
    task: 按例句把原因句改成用 [так что]{.ru} 表示结果的句子。
    example:
      cue: Мы оста́лись до́ма, так как шёл дождь.
      answer: Шёл дождь, так что мы оста́лись до́ма.
    why: "原来用 [так как]{.ru} 引出的原因变成前一个分句，原来的主句变成 [так что]{.ru} 后面的结果。[так что]{.ru} 前面用逗号，不要再保留 [так как]{.ru}：同一个句子里原因和结果只标一处。"
    items:
      - cue: Ми́ша не взял зонт, так как на не́бе не́ было ни о́блака.
        accept: ["На не́бе не́ было ни о́блака, так что Ми́ша не взял зонт."]
      - cue: Ван Лэй вы́пил горя́чего ча́ю, так как он промо́к.
        accept: ["Ван Лэй промо́к, так что он вы́пил горя́чего ча́ю.", "Ван Лэй промо́к, так что вы́пил горя́чего ча́ю."]
      - cue: Мы возьмём зонт, так как бу́дет гроза́.
        accept: ["Бу́дет гроза́, так что мы возьмём зонт."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题原因在句首，用 [так как]{.ru}（[потому́ что]{.ru} 一般不放在句首）；也可以换个语序：[Мы бы́ли до́ма, потому́ что шёл дождь]{.ru}，或 [Шёл дождь, поэ́тому мы бы́ли до́ма]{.ru}；第 2 题结果用 [поэ́тому]{.ru} 或 [так что]{.ru}；第 3 题原因在后，[потому́ что]{.ru} 或 [так как]{.ru} 都可以。注意汉语的“因为……所以……”在俄语里只译一处。
    items:
      - zh: 因为下雨，我们待在家里。
        accept: ["Так как шёл дождь, мы бы́ли до́ма.", "Так как шёл дождь, мы оста́лись до́ма.", "Так как шёл дождь, мы сиде́ли до́ма.", "Так как идёт дождь, мы сиди́м до́ма.", "Так как идёт дождь, мы до́ма.", "Так как был дождь, мы бы́ли до́ма.", "Мы бы́ли до́ма, потому́ что шёл дождь.", "Мы бы́ли до́ма, так как шёл дождь.", "Шёл дождь, поэ́тому мы бы́ли до́ма.", "Шёл дождь, так что мы бы́ли до́ма.", "Мы оста́лись до́ма, потому́ что шёл дождь.", "Мы оста́лись до́ма, так как шёл дождь.", "Шёл дождь, поэ́тому мы оста́лись до́ма.", "Шёл дождь, так что мы оста́лись до́ма.", "Мы сиде́ли до́ма, потому́ что шёл дождь.", "Мы сиде́ли до́ма, так как шёл дождь.", "Шёл дождь, поэ́тому мы сиде́ли до́ма.", "Шёл дождь, так что мы сиде́ли до́ма.", "Мы сиди́м до́ма, потому́ что идёт дождь.", "Мы сиди́м до́ма, так как идёт дождь.", "Идёт дождь, поэ́тому мы сиди́м до́ма.", "Идёт дождь, так что мы сиди́м до́ма.", "Мы до́ма, потому́ что идёт дождь.", "Мы до́ма, так как идёт дождь.", "Идёт дождь, поэ́тому мы до́ма.", "Идёт дождь, так что мы до́ма."]
        rubric: ["原因在句首用 [так как]{.ru}，主句不再加 [поэ́тому]{.ru}；也可以原因在后用 [потому́ что]{.ru}，或先说原因、再用 [поэ́тому]{.ru} / [так что]{.ru} 引出结果", "“下雨”用 [шёл дождь]{.ru}"]
      - zh: 天很闷，所以我们打开了窗户。
        accept: ["Бы́ло ду́шно, поэ́тому мы откры́ли окно́.", "Бы́ло ду́шно, так что мы откры́ли окно́.", "Бы́ло о́чень ду́шно, поэ́тому мы откры́ли окно́.", "Бы́ло о́чень ду́шно, так что мы откры́ли окно́."]
        rubric: ["无人称句 [бы́ло ду́шно]{.ru}", "结果用 [поэ́тому]{.ru} 或 [так что]{.ru}"]
      - zh: 米沙很高兴，因为比赛改到了星期六。
        accept: ["Ми́ша был рад, потому́ что матч перенесли́ на суббо́ту.", "Ми́ша был рад, так как матч перенесли́ на суббо́ту.", "Ми́ша был о́чень рад, потому́ что матч перенесли́ на суббо́ту.", "Ми́ша обра́довался, потому́ что матч перенесли́ на суббо́ту.", "Ми́ша обра́довался, так как матч перенесли́ на суббо́ту."]
        rubric: ["原因在后，用 [потому́ что]{.ru} 或 [так как]{.ru}", "“改到星期六”：[перенесли́ на суббо́ту]{.ru}，不定人称句"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пошли́ Ди́ма, Ми́ша и Ван Лэй пе́рвого ию́ня? Почему́ Мари́я Никола́евна сказа́ла, что бу́дет гроза́? Что случи́лось на стадио́не? Каки́е приме́ты вспо́мнили до́ма? Почему́ Ми́ша был рад?]{.ru}"
        length: 60–90
        model: "Пе́рвого ию́ня Ди́ма, Ми́ша и Ван Лэй пошли́ на стадио́н игра́ть в футбо́л. Так как ла́сточки лета́ли ни́зко, Мари́я Никола́евна сказа́ла, что бу́дет гроза́, но ребя́та не взя́ли зонт. Че́рез полчаса́ сверкну́ла мо́лния, начала́сь гроза́, и пошёл ли́вень, так что они́ промо́кли. До́ма Мари́я Никола́евна рассказа́ла о приме́те с ла́сточками, а Ди́ма — о приме́те с ко́шкой. Ми́ша был рад, потому́ что матч перенесли́ на суббо́ту."
        rubric: ["回答全部五个问题", "[так как]{.ru}、[так что]{.ru}、[потому́ что]{.ru} 至少用到两个", "因果关系清楚"]
        notes: 范文约 75 词。每个“为什么”的问题都用一个原因或结果从句回答：[Так как ла́сточки лета́ли ни́зко…]{.ru}、[…так что они́ промо́кли]{.ru}、[…потому́ что матч перенесли́]{.ru}。

  - id: e6
    type: open
    task: 作文：写写你家乡夏天的天气，以及你知道的天气谚语或说法。
    items:
      - prompt: 写清楚：你家乡的夏天是什么样的（气温、雨、风）；一次让你印象深的天气；一两条你们那里的天气谚语，以及你信不信。至少用三种因果连接词。
        length: 100–150
        model: "Я из Пеки́на. Ле́то у нас жа́ркое: в ию́ле быва́ет три́дцать пять гра́дусов. Так как в Пеки́не ле́том ча́сто ду́шно, мы мно́го пьём зелёный чай. Ли́вни у нас то́же быва́ют, но не ча́сто. Одна́жды, когда́ мне бы́ло де́сять лет, мы с па́пой пое́хали в парк, и вдруг начала́сь си́льная гроза́. У нас не́ было зонта́, так что мы си́льно промо́кли. Ма́ма сказа́ла, что на́до бы́ло взять зонт, и сра́зу дала́ нам горя́чего ча́ю. В Кита́е то́же есть приме́ты. Вот одна́: у нас говоря́т, что е́сли ла́сточки лета́ют ни́зко, бу́дет дождь. Я в э́то не о́чень ве́рю, потому́ что сейча́с у всех есть прогно́з пого́ды в телефо́не. Но я люблю́ э́ти ста́рые приме́ты, поэ́тому собира́ю их."
        rubric: ["写到夏天的天气、一次印象深的经历和天气谚语", "至少三种因果连接词（[потому́ что, так как, поэ́тому, так что]{.ru}）", "过去的经历用过去时，体用得恰当", "100–150 词"]
        notes: 范文约 130 词，分三层：一般情况（用现在时）、一次经历（用过去时）、谚语和看法。结尾表明自己的态度，用 [потому́ что]{.ru} 说理由、[поэ́тому]{.ru} 说结果。

  - id: e7
    type: open
    task: 书信写作：以米沙的身份给奶奶写一封短信，讲讲 6 月 1 日的雷雨和比赛。
    items:
      - prompt: 称呼 [Дорога́я ба́бушка!]{.ru}，落款 [Твой внук]{.ru}；讲雷雨、淋湿的经过和妈妈的“燕子兆头”；问问奶奶知道什么天气谚语。至少用两处 [так как]{.ru} 或 [так что]{.ru}，一处 [е́сли бы]{.ru}。
        length: 80–120
        model: "Дорога́я ба́бушка!\n\nКак ты? У нас всё хорошо́. Вчера́, пе́рвого ию́ня, мы с Ди́мой и Ван Лэ́ем ходи́ли на стадио́н игра́ть в футбо́л. Ма́ма сказа́ла, что бу́дет гроза́, так как ла́сточки лета́ли ни́зко. Но на не́бе не́ было ни о́блака, так что мы не взя́ли зонт. Че́рез полчаса́ пошёл ли́вень, и мы промо́кли. Е́сли бы мы послу́шали ма́му, мы бы не промо́кли! Ма́ма сказа́ла, что э́то ста́рая приме́та. Ба́бушка, а каки́е ещё приме́ты ты зна́ешь? Напиши́ мне, пожа́луйста! Я хочу́ узна́ть пого́ду ра́ньше, чем ма́ма.\n\nЦелу́ю тебя́.\nТвой внук Ми́ша"
        rubric: ["称呼、落款符合孙子给奶奶写信的口吻", "讲到雷雨、淋湿和燕子的兆头，并向奶奶提问", "至少两处 [так как / так что]{.ru}，一处 [е́сли бы]{.ru}", "80–120 词"]
        notes: 范文约 100 词。给长辈亲人写信用 [Дорога́я ба́бушка!]{.ru}、[Целу́ю тебя́.]{.ru}，称 [ты]{.ru}。结尾向奶奶提问、请她回信，用 [Напиши́ мне, пожа́луйста!]{.ru}。
