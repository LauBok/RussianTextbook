lesson: B2-L52
grammar: "让步从句：[хотя́]{.ru}、[несмотря́ на то что]{.ru}；[несмотря́ на]{.ru} + 第四格；让步与原因的对比。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的连接词。
    why: "先看两部分是“顺理成章”还是“出乎意料”。第 1、3、5 题前后相反（累却去帮忙，饿却专心听，下雨却去散步），用让步连接词。第 2、4 题是顺理成章的因果，用 [так как]{.ru}、[поэ́тому]{.ru}。第 5 题空后是名词 [дождь]{.ru}，不是分句，只能用前置词 [несмотря́ на]{.ru}。"
    items:
      - stem: ___ Ван Лэй о́чень уста́л, он пое́хал в библиоте́ку.
        options: [Хотя́, Так как, Поэ́тому]
        answer: Хотя́
      - stem: ___ Ди́ма не гото́вился, он попроси́л Ван Лэ́я помо́чь.
        options: [Хотя́, Так как, Несмотря́ на то что]
        answer: Так как
      - stem: Ди́ма слу́шал внима́тельно, ___ он был голо́дный.
        options: [несмотря́ на то что, так что, поэ́тому]
        answer: несмотря́ на то что
      - stem: Ван Лэй верну́лся по́здно, ___ сочине́ние он писа́л но́чью.
        options: [хотя́, поэ́тому, несмотря́ на то что]
        answer: поэ́тому
      - stem: ___ дождь, мы пошли́ гуля́ть.
        options: [Хотя́, Несмотря́ на, Несмотря́ на то что]
        answer: Несмотря́ на

  - id: e2
    type: rewrite
    task: 按例句用 [хотя́]{.ru} 把两句话连成一句。
    example:
      cue: Ван Лэй о́чень уста́л. Но он пое́хал помога́ть дру́гу.
      answer: Хотя́ Ван Лэй о́чень уста́л, он пое́хал помога́ть дру́гу.
    why: "[хотя́]{.ru} 放在表示“障碍”的那一句前面，原来的 [но]{.ru} 去掉。两个分句主语相同时，名词放在前面的分句里，后面用代词。第 4 题的障碍是第二句 [Шёл си́льный дождь]{.ru}，所以 [хотя́]{.ru} 放在它前面。"
    items:
      - cue: Ди́ма ничего́ не чита́л. Но он сдал зачёт.
        accept: ["Хотя́ Ди́ма ничего́ не чита́л, он сдал зачёт.", "Ди́ма сдал зачёт, хотя́ ничего́ не чита́л.", "Ди́ма сдал зачёт, хотя́ он ничего́ не чита́л."]
      - cue: Сочине́ние бы́ло тру́дное. Но Ван Лэй написа́л его́ хорошо́.
        accept: ["Хотя́ сочине́ние бы́ло тру́дное, Ван Лэй написа́л его́ хорошо́.", "Ван Лэй написа́л сочине́ние хорошо́, хотя́ оно́ бы́ло тру́дное."]
      - cue: А́нна хоте́ла спать. Но она́ помогла́ ма́ме.
        accept: ["Хотя́ А́нна хоте́ла спать, она́ помогла́ ма́ме.", "А́нна помогла́ ма́ме, хотя́ хоте́ла спать.", "А́нна помогла́ ма́ме, хотя́ она́ хоте́ла спать."]
      - cue: Ми́ша пошёл на стадио́н. А шёл си́льный дождь.
        accept: ["Ми́ша пошёл на стадио́н, хотя́ шёл си́льный дождь.", "Хотя́ шёл си́льный дождь, Ми́ша пошёл на стадио́н."]

  - id: e3
    type: rewrite
    task: 按例句把 [несмотря́ на то что]{.ru} 引出的从句改成 [несмотря́ на]{.ru} + 名词第四格。
    example:
      cue: Несмотря́ на то что шёл дождь, мы пошли́ гуля́ть.
      answer: Несмотря́ на дождь, мы пошли́ гуля́ть.
    why: "从句里的核心名词留下来，用第四格，动词去掉：[была́ гроза́]{.ru} → [несмотря́ на грозу́]{.ru}（阴性 [-а]{.ru} → [-у]{.ru}）；[бы́ли экза́мены]{.ru} → [несмотря́ на экза́мены]{.ru}（非动物复数第四格同第一格）；[был ве́тер]{.ru} → [несмотря́ на ве́тер]{.ru}。"
    items:
      - cue: Несмотря́ на то что была́ гроза́, матч не перенесли́.
        accept: ["Несмотря́ на грозу́, матч не перенесли́."]
      - cue: Несмотря́ на то что бы́ли экза́мены, Ди́ма ка́ждый день игра́л в футбо́л.
        accept: ["Несмотря́ на экза́мены, Ди́ма ка́ждый день игра́л в футбо́л."]
      - cue: Несмотря́ на то что был си́льный ве́тер, ла́сточки лета́ли высоко́.
        accept: ["Несмотря́ на си́льный ве́тер, ла́сточки лета́ли высоко́."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语的“虽然……但是……”译成俄语时只用 [хотя́]{.ru} 或 [несмотря́ на то что]{.ru}，主句前不再加 [но]{.ru}。第 3 题后面是名词，用 [несмотря́ на]{.ru} + 第四格。
    items:
      - zh: 虽然迪马很累，他还是听得很专心。
        accept: ["Хотя́ Ди́ма о́чень уста́л, он слу́шал о́чень внима́тельно.", "Хотя́ Ди́ма о́чень уста́л, он всё-таки слу́шал о́чень внима́тельно.", "Несмотря́ на то что Ди́ма о́чень уста́л, он слу́шал о́чень внима́тельно.", "Хотя́ Ди́ма уста́л, он слу́шал внима́тельно.", "Несмотря́ на то что Ди́ма уста́л, он слу́шал внима́тельно.", "Ди́ма слу́шал о́чень внима́тельно, хотя́ о́чень уста́л.", "Ди́ма слу́шал о́чень внима́тельно, хотя́ он о́чень уста́л."]
        rubric: ["[хотя́]{.ru} 或 [несмотря́ на то что]{.ru}，主句不加 [но]{.ru}", "[внима́тельно]{.ru}"]
      - zh: 尽管作文是夜里写的，老师还是表扬了它。
        accept: ["Несмотря́ на то что он писа́л сочине́ние но́чью, учи́тельница его́ похвали́ла.", "Хотя́ он писа́л сочине́ние но́чью, учи́тельница его́ похвали́ла.", "Учи́тельница похвали́ла сочине́ние, несмотря́ на то что он писа́л его́ но́чью.", "Учи́тельница похвали́ла сочине́ние, хотя́ он писа́л его́ но́чью."]
        rubric: ["让步连接词用对", "[похвали́ть]{.ru} + 第四格"]
      - zh: 尽管下雨，我们还是去了别墅。
        accept: ["Несмотря́ на дождь, мы пое́хали на да́чу.", "Несмотря́ на дождь, мы всё-таки пое́хали на да́чу.", "Хотя́ шёл дождь, мы пое́хали на да́чу.", "Хотя́ шёл дождь, мы всё-таки пое́хали на да́чу.", "Несмотря́ на то что шёл дождь, мы пое́хали на да́чу.", "Несмотря́ на то что шёл дождь, мы всё-таки пое́хали на да́чу.", "Мы пое́хали на да́чу, несмотря́ на дождь.", "Мы всё-таки пое́хали на да́чу, несмотря́ на дождь."]
        rubric: ["[несмотря́ на дождь]{.ru}（第四格）或让步从句", "[пое́хали на да́чу]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й день был у Ван Лэ́я тре́тьего ию́ня? Почему́ позвони́л Ди́ма? Что сде́лал Ван Лэй? Как Ди́ма сдал зачёт? Что сказа́ла А́нна?]{.ru}"
        length: 60–90
        model: "Тре́тьего ию́ня у Ван Лэ́я был тру́дный день, а ве́чером ему́ ну́жно бы́ло писа́ть сочине́ние. Ди́ма позвони́л, потому́ что за́втра у него́ был зачёт по культу́ре Кита́я, а он ничего́ не чита́л. Хотя́ Ван Лэй о́чень уста́л, он пое́хал в библиоте́ку и до десяти́ часо́в расска́зывал Ди́ме о Кита́е. На сле́дующий день Ди́ме попа́лся биле́т о Пра́зднике весны́, и он сдал зачёт. А́нна сказа́ла, что помо́г ему́ не «аво́сь», а Ван Лэй."
        rubric: ["回答全部五个问题", "至少一处让步从句", "安娜的话改成间接引语"]
        notes: 范文约 80 词。核心的一句 [Хотя́ Ван Лэй о́чень уста́л, он пое́хал…]{.ru} 用让步从句点出故事的关键。安娜的话用 [сказа́ла, что…]{.ru} 转述。

  - id: e6
    type: open
    task: 作文：写一次你虽然很累（或很忙、身体不舒服）却还是去做了某件事的经历。
    items:
      - prompt: 讲清楚：当时你为什么累或忙；是什么事、为什么一定要去做；结果怎样；你现在怎么看。至少用三处让步结构（[хотя́]{.ru}、[несмотря́ на то что]{.ru}、[несмотря́ на]{.ru} + 第四格），一处因果连接词。
        length: 100–150
        model: "В про́шлом году́ пе́ред Но́вым го́дом у меня́ бы́ло мно́го рабо́ты. Ка́ждый день я занима́лся до ве́чера, так как в январе́ у меня́ бы́ли экза́мены. Одна́жды позвони́л мой ста́рый друг и сказа́л, что у него́ в суббо́ту конце́рт. Он игра́ет на гита́ре в гру́ппе. Хотя́ я о́чень уста́л и хоте́л спать, я реши́л пойти́, потому́ что друг о́чень проси́л. Несмотря́ на си́льный моро́з, в за́ле бы́ло мно́го люде́й. Конце́рт был замеча́тельный! Мой друг игра́л так хорошо́, что я забы́л обо всём. Домо́й я верну́лся по́здно, но был о́чень рад. Несмотря́ на то что на сле́дующий день я встал по́здно, я всё сде́лал. Тепе́рь я ду́маю, что иногда́ ну́жно отдыха́ть, да́же когда́ мно́го рабо́ты."
        rubric: ["讲清楚累的原因、去做的事和结果", "至少三处让步结构，用法正确", "至少一处因果连接词", "100–150 词"]
        notes: 范文约 130 词，按“当时的情况—一次邀请—决定去—结果—感想”的顺序写。三种让步结构各用一次：[Хотя́ я о́чень уста́л…]{.ru}、[Несмотря́ на си́льный моро́з…]{.ru}、[Несмотря́ на то что…встал по́здно…]{.ru}；原因用 [так как]{.ru}、[потому́ что]{.ru}。

  - id: e7
    type: open
    task: 书信写作：以迪马的身份给王磊写一条短信，感谢他帮自己准备考查。
    items:
      - prompt: 口语化的称呼和落款；讲考查的经过；用 [хотя́]{.ru} 或 [несмотря́ на то что]{.ru} 说明王磊自己很累还来帮忙；用一处 [е́сли бы не…]{.ru}；最后约他做一件事作为答谢。
        length: 80–120
        model: "Ван Лэй, приве́т!\n\nЯ сдал! Спаси́бо тебе́ огро́мное! Хотя́ у тебя́ был тру́дный день и ещё сочине́ние, ты весь ве́чер сиде́л со мной в библиоте́ке. Е́сли бы не ты, я бы ничего́ не сказа́л. Мне попа́лся биле́т о Пра́зднике весны́, и я рассказа́л всё, что ты мне объясня́л. Преподава́тель да́же спроси́л, где я так хорошо́ узна́л о Кита́е! А́нна говори́т, что помо́г мне не «аво́сь», а ты. Наве́рное, она́ пра́вильно говори́т. В суббо́ту пойдём в кафе́. Я угоща́ю!\n\nТвой Ди́ма"
        rubric: ["称呼、落款符合朋友之间的口吻", "讲到考查的经过并表示感谢", "一处让步从句，一处 [е́сли бы не]{.ru}", "结尾提出答谢的邀请", "80–120 词"]
        notes: 范文约 95 词。先报喜，再感谢，用 [Хотя́ у тебя́ был тру́дный день…]{.ru} 点出王磊的辛苦；[Е́сли бы не ты…]{.ru} 表示“要不是你”。[Я угоща́ю!]{.ru} 是“我请客”。
