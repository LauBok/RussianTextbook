lesson: B4-L01
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Где встретились приятели и как они выглядели? Что рассказывает тонкий о своей семье и службе? Как меняется тонкий, когда узнаёт, что его друг — тайный советник? Почему толстому стало неприятно? Как кончается встреча?]{.ru}"
        length: 90–130
        model: "Приятели встретились на вокзале Николаевской железной дороги. Толстый только что пообедал, от него пахло хересом и духами, а тонкий только что вышел из вагона с женой, сыном и множеством чемоданов и узлов. Тонкий рассказывает, что он коллежский асессор, получает плохое жалованье, жена даёт уроки музыки, а сам он делает и продаёт портсигары. Когда толстый сказал, что дослужился до тайного советника, тонкий побледнел, съёжился и начал называть друга «ваше превосходительство» и говорить ему «вы». Толстый попросил его оставить этот тон, потому что они друзья детства, но тонкий не мог остановиться. Толстому стало плохо от такого чинопочитания, он отвернулся и попрощался. Тонкий почтительно пожал ему три пальца и поклонился."
        rubric: ["五个问题都回答，情节与选文一致", "说出官阶：瘦子是八等文官，胖子是三等文官", "写出称呼的变化：[ты]{.ru} → [вы]{.ru}，[ваше превосходительство]{.ru}"]
        notes: "回答第 3 题时不要只说“他变得客气了”，要说出具体表现：脸色发白、缩成一团、改称“大人”、改用 [вы]{.ru}。官阶可以照选文说 [тайный советник]{.ru}，也可以说 [важный чиновник]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[голубчик]{.ru}"
        accept: ["Ласковое обращение к близкому человеку.", "Ласковое слово, которым называют друга или близкого человека.", "Милый, дорогой — так обращаются к другу."]
        rubric: ["说明是亲昵的称呼", "说明用于熟人、朋友之间"]
      - zh: "[дослужиться]{.ru}"
        accept: ["Долго служить и получить высокую должность или чин.", "Получить какой-то чин после долгой службы.", "Служить, пока не получишь новый чин."]
        rubric: ["说明是通过长期供职得到", "说明得到的是官职、官阶"]
      - zh: "[чинопочитание]{.ru}"
        accept: ["Слишком большое уважение к тем, у кого высокий чин.", "Почтительное отношение к человеку только из-за его высокого чина.", "Уважение не к человеку, а к его чину."]
        rubric: ["说明是对官阶、地位的过分尊敬", "点出尊敬的是官阶而不是人本身"]
      - zh: "[съёжиться]{.ru}"
        accept: ["Стать меньше.", "Как будто стать меньше от страха или холода.", "Стать маленьким."]
        rubric: ["说明是身体缩起来、变小"]
      - zh: "[благоговение]{.ru}"
        accept: ["Очень глубокое уважение.", "Очень глубокое уважение, почти как к богу.", "Чувство глубокого уважения."]
        rubric: ["说明是极深的崇敬", "在选文里带有讽刺意味也可以说明"]
      - zh: "[ошеломлён]{.ru}"
        accept: ["Очень удивился и не знает, что сказать.", "Так удивился, что не может ничего сказать.", "Очень сильно удивился."]
        rubric: ["说明是非常吃惊、一时不知所措"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题胖子说出官阶以后瘦子才变了口气，所以转折点是胖子的话 [Я уже до тайного дослужился]{.ru}，前面瘦子早就说了自己的官阶，那时一切照常。第 2 题词尾 [-с]{.ru} 是 [сударь]{.ru} 的缩略，表示对对方恭敬，下级对上级、仆人对主人才这样说；它不表示亲热，也和年龄无关。第 3 题胖子始终用 [ты]{.ru}：[Мы с тобой друзья детства]{.ru}，他不愿意改变朋友关系；瘦子改用 [вы]{.ru}。第 4 题 [почтительной кислоты]{.ru} 把“恭敬”和“酸味”放在一起，是矛盾修饰的讽刺，说瘦子的恭敬让人倒胃口，而不是在写气味或食物。第 5 题结尾的 [Все трое были приятно ошеломлены]{.ru} 重复第 4 段的 [Оба были приятно ошеломлены]{.ru}，字面相近，意思已经从“重逢的惊喜”变成“见到大官的受宠若惊”。"
    items:
      - stem: Тонкий начинает говорить иначе после слов ___.
        options: ["«Я уже до тайного дослужился»", "«Коллежским асессором уже второй год»", "«Откуда ты взялся?»"]
        answer: "«Я уже до тайного дослужился»"
      - stem: "Частица «-с» в словах «приятно-с», «вы-с» показывает ___."
        options: [уважение к собеседнику, близкие отношения, детский возраст говорящего]
        answer: уважение к собеседнику
      - stem: После того как тонкий узнал о чине друга, толстый ___.
        options: [продолжает говорить ему «ты», начинает говорить ему «вы», перестаёт с ним говорить]
        answer: продолжает говорить ему «ты»
      - stem: "Выражение «почтительной кислоты» — это ___."
        options: [отношение автора к тонкому, "рассказ о том, чем пахло от тонкого", название еды на вокзале]
        answer: отношение автора к тонкому
      - stem: "Последняя фраза рассказа «Все трое были приятно ошеломлены» ___."
        options: [повторяет фразу из начала рассказа, впервые появляется в рассказе, говорит о толстом и тонком]
        answer: повторяет фразу из начала рассказа

  - id: e4
    type: fill
    task: 用括号里的词填空，注意人物对谁说话、用 [ты]{.ru} 还是 [вы]{.ru}。
    why: "第 1 题胖子对老同学说话，用 [ты]{.ru} 的变位形式 [живёшь]{.ru}。第 2 题瘦子还没听到胖子的官阶，照样用 [ты]{.ru}：[тебя]{.ru} 是第四格，作 [дразнили]{.ru} 的宾语。第 3 题 [мы с тобой]{.ru} 是固定说法“咱们俩”，[с]{.ru} 要求第五格。第 4 题 [ваше превосходительство]{.ru} 变成第二格，物主代词和名词都变：[вашего превосходительства]{.ru}，不能只变名词。第 5 题瘦子对上司说话，主语 [вы]{.ru} 省略了，动词用复数过去时 [вышли]{.ru}；写成单数 [вышел]{.ru} 就是用 [ты]{.ru} 的口气了。"
    items:
      - stem: "— Ну, как ___, друг? — спросил толстый."
        hint: жить
        accept: ["живёшь"]
      - stem: "— Помнишь, как ___ дразнили?"
        hint: ты
        accept: ["тебя"]
      - stem: "— Мы с ___ друзья детства!"
        hint: ты
        accept: ["тобой"]
      - stem: "— Милостивое внимание ___ превосходительства…"
        hint: ваш
        accept: ["вашего"]
      - stem: "— Друг детства, и вдруг ___ в такие вельможи!"
        hint: выйти
        accept: ["вышли"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称、现在时或过去时叙述。
    items:
      - prompt: "[Напишите краткое изложение рассказа «Толстый и тонкий».]{.ru}"
        length: 130–170
        model: "На вокзале Николаевской железной дороги случайно встречаются два друга детства, толстый и тонкий. Толстый только что пообедал, а тонкий приехал с женой и сыном и с множеством чемоданов и узлов. Друзья обнимаются, вспоминают гимназию и смешные прозвища, которые им давали в детстве. Тонкий с гордостью представляет другу жену и сына и рассказывает о себе: он коллежский асессор, получает небольшое жалованье, а чтобы жить лучше, делает и продаёт портсигары. Потом он спрашивает, как живёт друг. Толстый отвечает, что дослужился до тайного советника. Тонкий сразу меняется: он съёживается, начинает говорить другу «вы» и «ваше превосходительство», глупо смеётся и снова и снова представляет ему жену и сына. Толстый просит его оставить этот тон, ведь они друзья детства, но тонкий не слышит. Толстому становится плохо, и он прощается. Тонкий пожимает ему три пальца и делает низкий поклон, а вся его семья приятно ошеломлена."
        rubric: ["130–170 词", "交代地点、人物和重逢的经过", "写出转折：胖子说出官阶，瘦子的态度和称呼随之改变", "结尾：胖子厌恶地告别", "不照抄原文的长句，不加入原文没有的评论"]
        notes: "范文约 139 词。按选文顺序分三步：重逢和叙旧（约 40 词）、瘦子介绍自己并问对方（约 40 词）、转折和告别（约 70 词）。转折是全篇重点，篇幅可以多一些。省去细节（气味、外号的来历、烟盒的价钱），保留能说明人物关系的话（[ты]{.ru} 变 [вы]{.ru}，[ваше превосходительство]{.ru}）。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Почему тонкий так изменился?» Как вы понимаете поведение тонкого? Встречается ли чинопочитание в наше время? Приведите примеры.]{.ru}"
        length: 250–300
        model: "Когда тонкий узнаёт, что его друг детства стал тайным советником, он за одну минуту превращается в другого человека. Ещё недавно он обнимал друга, вспоминал гимназию и говорил ему «ты», а теперь съёживается, глупо смеётся и называет его «ваше превосходительство». Почему так происходит? Ведь толстый не его начальник и ничего от него не требует. Мне кажется, тонкий не думает о пользе для себя. Он просто привык всю жизнь бояться тех, кто стоит выше. Чинопочитание стало для него привычкой, почти рефлексом: как только он слышит о высоком чине, его тело само съёживается. Чехов показывает это очень точно: съёживаются не только тонкий, но и его чемоданы, а сын вытянулся во фрунт. Значит, этому учат и детей. Даже жена тонкого, которую он минуту назад с гордостью представлял другу, теперь только молча улыбается. Самое грустное в рассказе — то, что тонкий сам теряет друга. Толстый хочет остаться другом, но рядом с ним уже не друг, а подчинённый. Встречается ли такое в наше время? К сожалению, да. Чинов, как в девятнадцатом веке, у нас нет, но есть должности, деньги и слава. Многие люди говорят с директором совсем не так, как с простым сотрудником, а рядом с богатым или знаменитым человеком начинают улыбаться и соглашаться со всем. Я сам замечал, как мои знакомые меняли тон, когда узнавали, кем работают родители собеседника. Один мой школьный товарищ всегда спорил с учителями, но, как только в класс входил директор, сразу становился тихим и вежливым. Я думаю, уважать нужно человека, а не его место в обществе. Уважение к старшим и вежливость — это хорошо, но, когда человек забывает, что он тоже человек, он становится смешным и жалким, как тонкий. Поэтому рассказ Чехова, написанный почти полтора века назад, читается и сегодня как рассказ о нас."
        rubric: ["250–300 词", "解释瘦子变化的原因，有自己的看法", "用选文中的细节作论据（称呼、身体的“缩小”、儿子的动作等）", "联系现实，至少一个具体例子", "有结论，段落之间有衔接"]
        notes: "范文约 281 词。结构：一、复述变化（[за одну минуту превращается в другого человека]{.ru}）；二、分析原因——不是为了利益，而是习惯，甚至是“条件反射”，并用选文细节支持；三、联系今天：官阶没有了，但职位、金钱、名气还在；四、结论：尊重应该给人本身。写议论文时，引用选文的词句（[«ваше превосходительство»]{.ru}、[вытянулся во фрунт]{.ru}）比泛泛而谈更有说服力。"
