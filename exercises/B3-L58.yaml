lesson: B3-L58
grammar: "名词化：动词结构改为名词结构。动词 → 动名词（[выйти → выход]{.ru}，[восстановить → восстановление]{.ru}），主语和宾语变第二格（[фильм вышел → выход фильма]{.ru}），副词变形容词（[резко сократиться → резкое сокращение]{.ru}），从句变前置词短语（[после того как СССР распался → после распада СССР]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用名词结构说明时间和事件。
    items:
      - prompt: "[Когда и где россияне впервые увидели кино? Какой фильм считают первым русским игровым фильмом? Какой фильм снял Эйзенштейн и почему он важен? Какие награды получили советские фильмы в 1958 и 1962 годах? Чем известна студия «Союзмультфильм»? Что произошло с киноиндустрией после 1991 года?]{.ru}"
        length: 90–120
        model: "Знакомство России с кино произошло весной 1896 года в петербургском саду «Аквариум». Первым русским игровым фильмом считают «Стеньку Разина» Александра Дранкова: его премьера состоялась 15 октября 1908 года. Эйзенштейн снял фильм «Броненосец „Потёмкин“»; выход этого фильма в 1925 году стал событием мирового значения, а его монтаж изучают до сих пор. В 1958 году фильм «Летят журавли» получил «Золотую пальмовую ветвь» на Каннском кинофестивале, а в 1962 году «Иваново детство» Тарковского получило «Золотого льва» в Венеции. Студия «Союзмультфильм», основанная в 1936 году, создала мультфильмы «Ну, погоди!» и «Ёжик в тумане», которые любят несколько поколений зрителей. После распада СССР производство фильмов резко сократилось, но в 2000-е годы началось постепенное восстановление отрасли."
        rubric: ["六个问题都回答，时间、片名、奖项准确", "至少两处名词结构：[знакомство с]{.ru}、[выход фильма]{.ru}、[после распада]{.ru} 等"]
        notes: "回答第 1、3、5 题时可以把课文里的动词换成名词：[Россия познакомилась с кино → знакомство России с кино]{.ru}，[фильм вышел → выход фильма]{.ru}，[СССР распался → распад СССР]{.ru}。"

  - id: e2
    type: rewrite
    task: 把句中的动词结构（从句或动词谓语）改成名词结构。
    example:
      cue: Когда фильм вышел в 1925 году, это стало событием.
      answer: Выход фильма в 1925 году стал событием.
    why: "动词变成名词，原来的主语变成第二格放在名词后面。第 1 题 [перешли к звуковому кино → переход к звуковому кино]{.ru}，前置词 [к]{.ru} 保留，句子的谓语要和新主语 [переход]{.ru}（阳性）一致：[открыл]{.ru}。第 2 题 [после того как СССР распался → после распада СССР]{.ru}，[после]{.ru} + 第二格。第 3 题 [производство резко сократилось]{.ru} 里的副词 [резко]{.ru} 变成形容词 [резкое]{.ru}，[сокращение]{.ru} 中性。第 4 题 [чтобы развить кино → для развития кино]{.ru}，[для]{.ru} + 第二格，宾语 [кино]{.ru} 不变格。"
    items:
      - cue: Когда в начале 1930-х годов перешли к звуковому кино, это открыло новые возможности.
        accept: ["Переход к звуковому кино в начале 1930-х годов открыл новые возможности.", "В начале 1930-х годов переход к звуковому кино открыл новые возможности."]
      - cue: После того как СССР распался, киноиндустрия пережила трудное время.
        accept: ["После распада СССР киноиндустрия пережила трудное время."]
      - cue: Производство фильмов резко сократилось, и многие кинотеатры закрылись.
        accept: ["Резкое сокращение производства фильмов привело к тому, что многие кинотеатры закрылись.", "Из-за резкого сокращения производства фильмов многие кинотеатры закрылись.", "В связи с резким сокращением производства фильмов многие кинотеатры закрылись."]
      - cue: Чтобы развить кино, в 1919 году открыли киношколу.
        accept: ["Для развития кино в 1919 году открыли киношколу.", "Для развития кино в 1919 году была открыта киношкола."]

  - id: e3
    type: fill
    task: 写出与括号里的动词对应的名词，并用正确的格。
    why: "先写出动名词，再按前置词或句中的位置定格。第 1 题 [после]{.ru} + 第二格：[выхода]{.ru}。第 2 题作主语，第一格：[Распад]{.ru}。第 3 题 [до]{.ru} + 第二格：[появления]{.ru}，[-ние]{.ru} 结尾的中性名词第二格 [-ния]{.ru}。第 4 题 [с]{.ru} + 第五格：[восстановлением]{.ru}。第 5 题作主语：[Знакомство]{.ru}，[познакомиться]{.ru} 的名词是 [знакомство]{.ru}，不是 ~~[познакомление]{.ru}~~。"
    items:
      - stem: После ___ фильма о нём писали все газеты.
        hint: выйти
        accept: ["выхода"]
      - stem: ___ СССР произошёл в 1991 году.
        hint: распасться
        accept: ["Распад"]
      - stem: До ___ звукового кино все фильмы были немыми.
        hint: появиться
        accept: ["появления"]
      - stem: С ___ отрасли количество кинотеатров выросло.
        hint: восстановить
        accept: ["восстановлением"]
      - stem: ___ России с кино произошло в 1896 году.
        hint: познакомиться
        accept: ["Знакомство"]

  - id: e4
    type: choice
    task: 选择合适的名词结构。
    why: "第 1 题 [удостоить]{.ru} 要求第二格，[удостоенный награды]{.ru}；后两个选项格不对。第 2 题“为了发展”用 [для]{.ru} + 第二格 [для развития]{.ru}；[в развитии]{.ru} 意思是“在发展方面”，[развитием]{.ru} 缺前置词。第 3 题 [переход]{.ru} 要求 [к]{.ru} + 第三格：[переход к звуковому кино]{.ru}，与动词 [перейти к]{.ru} 一致。第 4 题“在……开幕时”用 [при открытии]{.ru}，[при]{.ru} + 第六格。"
    items:
      - stem: Это единственный советский фильм, удостоенный ___.
        options: [этой награды, этой наградой, этой награде]
        answer: этой награды
      - stem: В 1919 году ___ кино открыли киношколу.
        options: [для развития, в развитии, развитием]
        answer: для развития
      - stem: Переход ___ открыл новые возможности.
        options: [звукового кино, к звуковому кино, звуковым кино]
        answer: к звуковому кино
      - stem: ___ кинофестиваля показали новый фильм.
        options: [При открытии, Открытием, Открытия]
        answer: При открытии

  - id: e5
    type: translate
    task: 翻译下列句子，用名词结构。
    items:
      - zh: 1925 年《战舰波将金号》的上映成为一件具有世界意义的大事。
        accept: ["Выход фильма «Броненосец „Потёмкин“» в 1925 году стал событием мирового значения.", "Выход «Броненосца „Потёмкин“» в 1925 году стал событием мирового значения."]
        rubric: ["[выход фильма]{.ru}：动名词 + 第二格", "[стать чем]{.ru}：第五格 [событием]{.ru}", "[мирового значения]{.ru}：第二格作定语"]
      - zh: 苏联解体以后，影片产量急剧下降。
        accept: ["После распада СССР производство фильмов резко сократилось.", "После распада СССР произошло резкое сокращение производства фильмов.", "После распада Советского Союза производство фильмов резко сократилось."]
        rubric: ["[после распада СССР]{.ru}：[после]{.ru} + 动名词第二格", "[производство фильмов]{.ru}"]
      - zh: 2000 年代这个行业开始逐步恢复。
        accept: ["В 2000-е годы началось постепенное восстановление отрасли.", "В 2000-х годах началось постепенное восстановление отрасли."]
        rubric: ["[постепенное восстановление отрасли]{.ru}：副词变形容词，宾语变第二格", "[в 2000-е годы]{.ru}"]

  - id: e7
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [во время]{.ru} + 第二格：[сеанса]{.ru}。第 2 题 [стать чем]{.ru} 要第五格，形容词与 [свидетельством]{.ru}（中性）一致：[бесценным]{.ru}。第 3 题 [называть кого чем]{.ru}：第二个补语用第五格，复数 [шедеврами]{.ru}。第 4 题“成了流行语”：[стать крылатыми]{.ru}，复数第五格，与主语 [фразы]{.ru} 一致。第 5 题 [в]{.ru} + 第六格：[в прокате]{.ru}。"
    items:
      - stem: Во время ___ в зале играл тапёр.
        hint: сеанс
        accept: ["сеанса"]
      - stem: Военная хроника стала ___ свидетельством эпохи.
        hint: бесценный
        accept: ["бесценным"]
      - stem: Критики называют фильмы Тарковского ___.
        hint: шедевр
        accept: ["шедеврами"]
      - stem: Фразы из комедий Гайдая стали ___.
        hint: крылатый
        accept: ["крылатыми"]
      - stem: Российские фильмы собирают большие деньги в ___.
        hint: прокат
        accept: ["прокате"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，分条说明理由，最后得出结论。
    items:
      - prompt: "[Нужно ли сегодня смотреть старые фильмы?]{.ru} 用 [во-первых, во-вторых, в-третьих]{.ru} 分条论证，至少用三处名词结构。"
        length: 180–220
        model: "Многие молодые люди считают, что старые фильмы смотреть скучно: они чёрно-белые, медленные, а их техника кажется сегодня смешной. По-моему, это ошибка, и вот почему. Во-первых, старое кино — это окно в прошлое. Фильм «Летят журавли», снятый в 1957 году, рассказывает о войне лучше многих учебников истории: зритель видит не цифры, а судьбу одной девушки. Во-вторых, знакомство с классикой помогает понять современное кино. Приёмы монтажа, разработанные Эйзенштейном и его современниками сто лет назад, используют почти во всех сегодняшних фильмах, и человек, видевший «Броненосец „Потёмкин“», замечает это сразу. В-третьих, хорошие фильмы не стареют. Доказательством этого служит «Ирония судьбы»: появление этой комедии на экране каждый Новый год стало для многих семей такой же традицией, как ёлка. Конечно, не каждый старый фильм интересен сегодня, и смотреть только классику не нужно. Однако для человека, изучающего русский язык, такие фильмы особенно полезны: в них звучит живая речь, а герои говорят о том, что волнует людей и сейчас. Кроме того, обсуждение старых фильмов с русскими друзьями — хороший способ начать разговор и лучше узнать друг друга. Поэтому я думаю, что старое кино нужно не только специалистам. Просмотр одного хорошего фильма иногда даёт больше, чем чтение целой книги о стране."
        rubric: ["开头提出对立观点并表明自己的看法", "用 [во-первых, во-вторых, в-третьих]{.ru} 列出至少三条理由，每条有例子", "有让步", "至少三处名词结构", "180–220 词"]
        notes: "范文约 190 词。结构：反方看法 → 自己的看法（[По-моему, это ошибка, и вот почему]{.ru}）→ 三条理由（了解历史、理解现代电影、好电影不会过时），每条都有课文里的片名作例子 → 让步（[Конечно…]{.ru}）→ 补充一条对外国学生的意义 → 结论。名词结构：[знакомство с классикой]{.ru}、[доказательством этого]{.ru}、[появление этой комедии на экране]{.ru}、[обсуждение старых фильмов]{.ru}、[просмотр одного хорошего фильма]{.ru}、[чтение целой книги]{.ru}。"
