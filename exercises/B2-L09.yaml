  - id: e10
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Когда́ Ван Лэй сно́ва был в Москве́ и что бы́ло в его́ чемода́не? Ско́лько студе́нтов в его́ гру́ппе? Кто его́ языково́й партнёр и в како́м году́ они́ роди́лись? Во ско́лько Ди́ма был в кафе́ в четве́рг? Что студе́нты ку́пят на день рожде́ния О́льги Ви́кторовны?]{.ru}"
        length: 50–80
        model: "Оди́ннадцатого февраля́ Ван Лэй сно́ва был в Москве́. В его́ чемода́не бы́ло ма́ло веще́й, но мно́го пода́рков и мандари́нов. В его́ гру́ппе двена́дцать студе́нтов: семь па́рней и пять де́вушек. Его́ языково́й партнёр — Ди́ма. Они́ о́ба роди́лись в две ты́сячи шесто́м году́. Ди́ма ча́сто опа́здывает: в четве́рг он был в кафе́ то́лько без че́тверти четы́ре. На день рожде́ния О́льги Ви́кторовны студе́нты ку́пят два то́рта, две коро́бки конфе́т, три буты́лки со́ка и буке́т цвето́в."
        rubric: ["回答全部五个问题", "复数第二格：[веще́й, пода́рков, студе́нтов, де́вушек]{.ru} 等", "数词与名词连用正确：[двена́дцать студе́нтов, два то́рта, две коро́бки]{.ru}", "年份 [в две ты́сячи шесто́м году́]{.ru}，钟点 [без че́тверти четы́ре]{.ru}", "度量词后用第二格：[коро́бки конфе́т, буты́лки со́ка]{.ru}"]
        notes: 范文约 75 词，按时间顺序回答五个问题，每句至少用上本单元的一个语法点。第二句用 [ма́ло веще́й, но мно́го пода́рков]{.ru} 对比；第五句用 [о́ба]{.ru} 把两个人合在一起说；第六句先说“迪马常迟到”，再用冒号举出星期四的例子，比单纯报时间更连贯；最后一句是还没做的事，用完成体将来时 [ку́пят]{.ru}。
