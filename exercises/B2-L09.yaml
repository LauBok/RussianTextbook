lesson: B2-L09
heading: 单元测试
intro: 本测试覆盖第一单元全部语法。答对 80% 以上再进入第二单元；没有达到的，复数第二格的题错得多回看第 1、2 课，数量和数词的题错得多回看第 3、4、8 课，年份、钟点和集合数词分别回看第 5、6、7 课，复习后重做。
grammar: "名词复数第二格（[-ов, -ев, -ей]{.ru}、零词尾、隐现元音）；[мно́го, ма́ло, не́сколько, немно́го, ско́лько]{.ru} + 第二格；数词与名词连用；年份 [в … году́]{.ru}；钟点 [полови́на четвёртого, без че́тверти четы́ре]{.ru}；集合数词 [дво́е, тро́е]{.ru}，[о́ба, о́бе]{.ru}；度量词 + 第二格。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里名词的复数第二格。
    why: "辅音结尾加 [-ов]{.ru}：[пода́рков]{.ru}（[пода́рок]{.ru} 的 [о]{.ru} 脱落，和单数第二格 [пода́рка]{.ru} 一样）；[-й]{.ru} 结尾加 [-ев]{.ru}：[музе́ев]{.ru}；[-ц]{.ru} 结尾、词尾不重读用 [-ев]{.ru}：[ме́сяцев]{.ru}；[ч]{.ru} 结尾加 [-ей]{.ru}：[враче́й]{.ru}。[-а, -я, -о]{.ru} 结尾是零词尾：[неде́ль]{.ru}（保留软音写 [-ь]{.ru}）、[слов]{.ru}；[-ия]{.ru} 变 [-ий]{.ru}：[ле́кций]{.ru}。去掉词尾后剩两个辅音要插隐现元音：[де́вушек]{.ru}（[ш]{.ru} 和 [к]{.ru} 之间插 [е]{.ru}）、[пи́сем]{.ru}（原来 [ь]{.ru} 的地方写 [е]{.ru}，重音移到词首）。[де́ньги]{.ru} 只有复数，第二格 [де́нег]{.ru} 要单独记。最常见的错误是给零词尾的词加 [-ов]{.ru}，写成 [неде́лев, сло́вов]{.ru}。"
    items:
      - stem: В чемода́не бы́ло мно́го ___.
        hint: пода́рок
        accept: [пода́рков]
      - stem: В Москве́ мно́го ___.
        hint: музе́й
        accept: [музе́ев]
      - stem: Год — э́то двена́дцать ___.
        hint: ме́сяц
        accept: [ме́сяцев]
      - stem: В поликли́нике рабо́тает мно́го ___.
        hint: врач
        accept: [враче́й]
      - stem: В семе́стре семна́дцать ___.
        hint: неде́ля
        accept: [неде́ль]
      - stem: Ско́лько у тебя́ сего́дня ___?
        hint: ле́кция
        accept: [ле́кций]
      - stem: Ди́ма уже́ зна́ет де́сять ___ по-кита́йски.
        hint: сло́во
        accept: [слов]
      - stem: В на́шей гру́ппе пять ___.
        hint: де́вушка
        accept: [де́вушек]
      - stem: В пе́рвом семе́стре я написа́л ма́ме пять ___.
        hint: письмо́
        accept: [пи́сем]
      - stem: По́сле ры́нка в кошельке́ бы́ло ма́ло ___.
        hint: де́ньги
        accept: [де́нег]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "[мно́го, ма́ло, ско́лько]{.ru} 后面能数的名词用复数第二格：[я́блок, книг, проду́ктов]{.ru}（第 2、6、7 题）；不能数的用单数第二格：[вре́мени]{.ru}（第 1 题）。[не́сколько]{.ru} 只和能数的名词连用，[мёд]{.ru} 不能数，只能说 [немно́го мёда]{.ru}（第 3 题）。第 5 题后半句“我可以帮忙”说明时间还有一些，用 [немно́го]{.ru}；[ма́ло]{.ru} 是“太少、不够”，意思正相反。第 4 题 [мно́го наро́ду]{.ru} 作主语，过去时用中性 [бы́ло]{.ru}。"
    items:
      - stem: У меня́ ма́ло ___, я не могу́ пойти́ в кино́.
        options: [вре́мени, вре́мя, времена́]
        answer: вре́мени
      - stem: Ми́ше ма́ма купи́ла мно́го ___.
        options: [я́блок, я́блоки, я́блока]
        answer: я́блок
      - stem: Ван Лэй купи́л ___ мёда.
        options: [немно́го, не́сколько]
        answer: немно́го
      - stem: На ры́нке ___ мно́го наро́ду.
        options: [бы́ло, бы́ли, был]
        answer: бы́ло
      - stem: У меня́ ___ вре́мени, я могу́ тебе́ помо́чь.
        options: [немно́го, ма́ло]
        answer: немно́го
      - stem: Ско́лько у тебя́ ___?
        options: [книг, кни́ги, кни́га]
        answer: книг
      - stem: Ско́ро в су́мке бы́ло мно́го ___.
        options: [проду́ктов, проду́кты, проду́кта]
        answer: проду́ктов

  - id: e3
    type: fill
    task: 写出名词或数词的正确形式。
    why: "数词只看最后一个词：[два́дцать оди́н]{.ru} 后用单数第一格 [год]{.ru}（第 1 题），[два́дцать одно́]{.ru} 后用单数第一格 [сочине́ние]{.ru}（第 4 题）；[два́дцать четы́ре, три, две]{.ru} 后用单数第二格 [го́да, студе́нта, неде́ли]{.ru}（第 2、5、6 题）；[двена́дцать, сто]{.ru} 后用复数第二格 [студе́нтов, рубле́й]{.ru}（第 3、7 题），[оди́ннадцать]{.ru}—[девятна́дцать]{.ru} 是一个词，不能看成“十加二”写 [студе́нта]{.ru}。[оди́н]{.ru}、[два]{.ru} 要和名词的性一致：[япо́нка]{.ru} 是阴性，用 [одна́]{.ru}；[коро́бка]{.ru} 是阴性，用 [две]{.ru}（第 8、9 题）。"
    items:
      - stem: Пье́ру два́дцать оди́н ___.
        hint: год
        accept: [год]
      - stem: Хосе́ два́дцать четы́ре ___.
        hint: год
        accept: [го́да]
      - stem: В на́шей гру́ппе двена́дцать ___.
        hint: студе́нт
        accept: [студе́нтов]
      - stem: В семе́стре мы должны́ написа́ть два́дцать одно́ ___.
        hint: сочине́ние
        accept: [сочине́ние]
      - stem: У нас в гру́ппе три ___ из Коре́и.
        hint: студе́нт
        accept: [студе́нта]
      - stem: Мы бы́ли в Петербу́рге две ___.
        hint: неде́ля
        accept: [неде́ли]
      - stem: Э́та кни́га сто́ит сто ___.
        hint: рубль
        accept: [рубле́й]
      - stem: В на́шей гру́ппе ___ япо́нка.
        hint: "1"
        accept: [одна́]
      - stem: Хосе́ сказа́л, что на́до купи́ть ___ коро́бки конфе́т.
        hint: "2"
        accept: [две]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "“在哪一年”用 [в]{.ru} + 第六格，年份的最后一个词是序数词，也用第六格：[в две ты́сячи двена́дцатом году́]{.ru}，[в ты́сяча девятьсо́т восьмидеся́том году́]{.ru}（第 1、4、5 题）；前面的 [две ты́сячи, ты́сяча девятьсо́т]{.ru} 不变。第 5 题“八十”的序数词是 [восьмидеся́тый]{.ru}，不能用基数词 [во́семьдесят]{.ru}。“现在是哪一年”用第一格 [седьмо́й]{.ru}（第 2 题）。日、月、年一起说时都用第二格：[двена́дцатого ма́я … шесто́го го́да]{.ru}（第 3 题）。第 6 题 [пять]{.ru} 后用 [лет]{.ru}。"
    items:
      - stem: Ми́ша роди́лся в две ты́сячи ___ году́.
        options: [двена́дцатом, двена́дцатый, двена́дцатого]
        answer: двена́дцатом
      - stem: Сейча́с две ты́сячи два́дцать ___ год.
        options: [седьмо́й, седьмо́м, седьмо́го]
        answer: седьмо́й
      - stem: Ван Лэй роди́лся двена́дцатого ма́я две ты́сячи шесто́го ___.
        options: [го́да, году́, год]
        answer: го́да
      - stem: Ба́бушка родила́сь в ты́сяча девятьсо́т пятьдеся́т пе́рвом ___.
        options: [году́, го́да, год]
        answer: году́
      - stem: Мари́я Никола́евна родила́сь в ты́сяча девятьсо́т ___ году́.
        options: [восьмидеся́том, восьмидеся́тый, во́семьдесят]
        answer: восьмидеся́том
      - stem: Ба́бушке се́мьдесят пять ___.
        options: [лет, го́да, год]
        answer: лет

  - id: e5
    type: rewrite
    task: 按例句回答问题，用文字写出括号里的时间。
    why: "前半小时看下一个钟点，钟点用序数词第二格：4:15 是 [че́тверть пя́того]{.ru}，2:05 是 [пять мину́т тре́тьего]{.ru}，5:30 是 [полови́на шесто́го]{.ru}；“在……时”加 [в]{.ru}，三点半一类用第六格 [в полови́не]{.ru}。后半小时用 [без]{.ru} 加数词第二格，再加下一个整点：1:40 是 [без двадцати́ два]{.ru}，3:45 是 [без че́тверти четы́ре]{.ru}，9:55 是 [без пяти́ де́сять]{.ru}，前面不加 [в]{.ru}。最常见的错误是照汉语看前一个钟点，把 5:30 说成 [полови́на пя́того]{.ru}（那是 4:30）。"
    example:
      cue: Во ско́лько вы встре́тились? (3:30)
      answer: Мы встре́тились в полови́не четвёртого.
    items:
      - cue: Во ско́лько вы встре́тились? (4:15)
        accept: ["Мы встре́тились в че́тверть пя́того.", "В че́тверть пя́того."]
      - cue: Во ско́лько вы встре́тились? (2:05)
        accept: ["Мы встре́тились в пять мину́т тре́тьего.", "В пять мину́т тре́тьего."]
      - cue: Во ско́лько вы встре́тились? (5:30)
        accept: ["Мы встре́тились в полови́не шесто́го.", "В полови́не шесто́го."]
      - cue: Во ско́лько вы встре́тились? (1:40)
        accept: ["Мы встре́тились без двадцати́ два.", "Без двадцати́ два."]
      - cue: Во ско́лько вы встре́тились? (3:45)
        accept: ["Мы встре́тились без че́тверти четы́ре.", "Без че́тверти четы́ре."]
      - cue: Во ско́лько вы встре́тились? (9:55)
        accept: ["Мы встре́тились без пяти́ де́сять.", "Без пяти́ де́сять."]

  - id: e6
    type: choice
    task: 选择正确的形式。
    why: "说一群人有几个，代词用第二格，后面用集合数词：[Нас бы́ло тро́е]{.ru}（第 1 题）。[де́ти]{.ru} 前用集合数词 [дво́е]{.ru}（第 3 题）。集合数词不和表示女人的名词连用，所以第 2 题只能说 [три де́вушки]{.ru}。[о́ба]{.ru} 用于男人或阳性、中性名词（第 4、7 题），[о́бе]{.ru} 用于女人或阴性名词（第 5 题）；第 7 题 [дво́е]{.ru} 只说数目，不能当谓语用在 [инжене́ры]{.ru} 前。“两个人一起”是副词 [вдвоём]{.ru}（第 6 题）。第 8 题 [полтора́]{.ru} 和阳性名词连用，后接单数第二格 [часа́]{.ru}；[полторы́]{.ru} 用于阴性名词。"
    items:
      - stem: Нас бы́ло ___.
        options: [тро́е, тро́их, тре́тий]
        answer: тро́е
      - stem: В аудито́рии бы́ли ___ де́вушки.
        options: [три, тро́е, тро́их]
        answer: три
      - stem: У них в семье́ ___ дете́й.
        options: [дво́е, два, двух]
        answer: дво́е
      - stem: Ди́ма и Ми́ша ___ бе́гали о́чень бы́стро.
        options: [о́ба, о́бе, двух]
        answer: о́ба
      - stem: У меня́ две сестры́. ___ у́чатся в шко́ле.
        options: [О́бе, О́ба, Дво́е]
        answer: О́бе
      - stem: По́сле у́жина А́нна и Ди́ма игра́ли на гита́ре ___.
        options: [вдвоём, дво́е, двух]
        answer: вдвоём
      - stem: Мы с ним ___ инжене́ры.
        options: [о́ба, дво́е, о́бе]
        answer: о́ба
      - stem: Они́ занима́лись ___.
        options: [полтора́ часа́, полторы́ часа́, полтора́ часо́в]
        answer: полтора́ часа́

  - id: e7
    type: fill
    task: 写出括号里的词的正确形式。
    why: "度量词后面的名词始终用第二格：不能数的用单数第二格 [молока́, ча́я, пече́нья, мёда]{.ru}（第 1、7、9、10 题），能数的用复数第二格 [конфе́т, цвето́в, я́блок]{.ru}（第 2、3、6 题）。度量词本身按句子变格：第 4 题作 [купи́]{.ru} 的宾语，用第四格 [коро́бку]{.ru}；第 5 题跟在 [три]{.ru} 后用单数第二格 [буты́лки]{.ru}；第 8 题跟在 [пять]{.ru} 后用复数第二格 [па́чек]{.ru}（零词尾，[ч]{.ru} 和 [к]{.ru} 之间插 [е]{.ru}）。常见错误是让后面的名词跟着度量词变，写成 [коро́бку конфе́ту]{.ru}。"
    items:
      - stem: Купи́, пожа́луйста, литр ___.
        hint: молоко́
        accept: [молока́]
      - stem: Хосе́ купи́л две коро́бки ___.
        hint: конфе́та
        accept: [конфе́т]
      - stem: Студе́нты пода́рили О́льге Ви́кторовне большо́й буке́т ___.
        hint: цветы́
        accept: [цвето́в]
      - stem: Купи́, пожа́луйста, ___ конфе́т.
        hint: коро́бка
        accept: [коро́бку]
      - stem: "Ю́ми написа́ла в спи́ске: три ___ со́ка."
        hint: буты́лка
        accept: [буты́лки]
      - stem: Ма́ма купи́ла килогра́мм ___.
        hint: я́блоко
        accept: [я́блок]
      - stem: Ван Лэй купи́л па́чку ___.
        hint: чай
        accept: [ча́я, ча́ю]
      - stem: До́ма у нас пять ___ ча́я.
        hint: па́чка
        accept: [па́чек]
      - stem: Ещё на́до купи́ть полкило́ ___.
        hint: пече́нье
        accept: [пече́нья]
      - stem: Ско́лько сто́ит ба́нка ___?
        hint: мёд
        accept: [мёда]

  - id: e8
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊二月十一日回到莫斯科，缺了五天课；班上十二个学生，七个男生、五个女生；王磊和迪马都是 2006 年出生的；星期四迪马差一刻四点才到咖啡馆；踢足球时迪马和米沙对王磊，王磊输了；茶会每人出三百卢布。
    items:
      - stem: Ван Лэй пропусти́л ___.
        options: [пять дней заня́тий, две неде́ли заня́тий, оди́н день заня́тий]
        answer: пять дней заня́тий
      - stem: В гру́ппе Ван Лэ́я ___.
        options: [семь па́рней и пять де́вушек, пять па́рней и семь де́вушек, пятна́дцать студе́нтов]
        answer: семь па́рней и пять де́вушек
      - stem: Ван Лэй и Ди́ма роди́лись ___.
        options: [в две ты́сячи шесто́м году́, в две ты́сячи седьмо́м году́, в ра́зные го́ды]
        answer: в две ты́сячи шесто́м году́
      - stem: В четве́рг Ди́ма был в кафе́ ___.
        options: [без че́тверти четы́ре, в полови́не четвёртого, в два́дцать пять мину́т четвёртого]
        answer: без че́тверти четы́ре
      - stem: В футбо́л Ван Лэй игра́л ___.
        options: [про́тив Ди́мы и Ми́ши, вме́сте с Ди́мой про́тив Ми́ши, вме́сте с Ми́шей про́тив Ди́мы]
        answer: про́тив Ди́мы и Ми́ши
      - stem: На чай для О́льги Ви́кторовны ка́ждый даёт ___.
        options: [три́ста рубле́й, сто рубле́й, три ты́сячи шестьсо́т рубле́й]
        answer: три́ста рубле́й

  - id: e9
    type: translate
    task: 译成俄语。
    why: "第 1 题 [двена́дцать]{.ru}、[семь]{.ru}、[пять]{.ru} 后都用复数第二格，[па́рней]{.ru} 词尾 [-ей]{.ru}，[де́вушек]{.ru} 有隐现元音。第 2 题“在 2006 年”用 [в]{.ru} + 第六格 [шесто́м году́]{.ru}，女生用 [родила́сь]{.ru}。第 3 题 3:30 是 [в полови́не четвёртого]{.ru}，不是 [тре́тьего]{.ru}。第 4 题度量词后用第二格：[я́блок]{.ru} 复数，[молока́]{.ru} 单数。第 5 题“家里有两个孩子”用集合数词 [дво́е дете́й]{.ru}，代词用第二格 [нас]{.ru}。"
    items:
