lesson: B3-L28
grammar: "动词前缀的非运动意义：[по-]{.ru}（做一会儿：[посидеть]{.ru}），[за-]{.ru}（开始：[засмеяться]{.ru}），[на-]{.ru}（许多、饱足：[напечь пирогов, наесться]{.ru}），[раз- (рас-)]{.ru}（分开、变成：[разбить, разбогатеть]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Каким обычно бывает Иван-дурак и чем кончается сказка о нём? Где живёт Баба-яга и как она встречает героя? Где спрятана смерть Кощея? Что случилось с Емелей после того, как он отпустил щуку? Почему, по мнению автора, сказки живут так долго?]{.ru}"
        length: 80–110
        model: "Иван-дурак обычно младший из трёх братьев. Он любит полежать на печи, но он добрый и честный, поэтому ему помогают звери. В конце сказки он женится на царевне и становится царём. Баба-яга живёт в глухом лесу в избушке на курьих ножках. Она накормит героя, напоит, спать уложит, а утром даст ему клубок. Смерть Кощея спрятана на конце иглы, игла в яйце, яйцо в утке, утка в зайце, заяц в сундуке, а сундук на дубу. После того как Емеля отпустил щуку, вёдра сами шли домой, а печь сама ездила по дороге. Сказки живут долго, потому что в них есть простые мысли: добро побеждает зло."
        rubric: ["五个问题都回答，内容与课文一致", "至少用三个带本课前缀的动词（[полежать, накормить, напоить, разбить, засмеяться]{.ru} 等）", "第 3 题链条式描写完整"]
        notes: 第 4 题课文举了水桶和炉子的例子，可以具体回答，也可以说 [ему стало достаточно сказать…]{.ru}。

  - id: e2
    type: fill
    task: 用括号里的动词加适当前缀（[по-, за-, на-, раз-]{.ru}）构成完成体，填入正确形式。
    why: "看句子要表达的意思选前缀。第 1 题 [немного]{.ru} 提示“一会儿”，用 [по-]{.ru}：[посидели]{.ru}。第 2 题 [вдруг]{.ru} 提示动作突然开始，用 [за-]{.ru}：[заплакала]{.ru}。第 3 题宾语是第二格 [пирогов]{.ru}，表示“许多”，用 [на-]{.ru}：[напекла]{.ru}。第 4 题“打碎”，用 [раз-]{.ru}：[разбил]{.ru}。第 5 题 [полчаса]{.ru} 提示“一会儿”：[погуляли]{.ru}。第 6 题“变富”，[раз-]{.ru} + [богат-]{.ru} + [-еть]{.ru}：[разбогател]{.ru}。第 7 题动作突然开始：[запели]{.ru}。"
    items:
      - stem: Перед дорогой мы немного ___ молча.
        hint: сидеть
        accept: ["посидели"]
      - stem: Девочка испугалась и вдруг ___.
        hint: плакать
        accept: ["заплакала"]
      - stem: К празднику бабушка ___ пирогов.
        hint: печь
        accept: ["напекла"]
      - stem: Мальчик играл в мяч и ___ окно.
        hint: бить
        accept: ["разбил"]
      - stem: После обеда мы полчаса ___ в парке.
        hint: гулять
        accept: ["погуляли"]
      - stem: Емеля ничего не делал, но ___.
        hint: богатый
        accept: ["разбогател"]
      - stem: Когда начался праздник, все дружно ___.
        hint: петь
        accept: ["запели"]

  - id: e3
    type: choice
    task: 选择意思正确的动词。
    why: "第 1 题“饱了”，[на-]{.ru} + [-ся]{.ru}：[наелся]{.ru}；[поел]{.ru} 只是“吃过了”，不说明饱不饱；[ел]{.ru} 是未完成体，不表示结果。第 2 题“切成两半”，[раз-]{.ru} 表示分开：[разрезала]{.ru}；另外两个动词意思不合。第 3 题 [немного]{.ru} 提示“一会儿、一阵”，[по-]{.ru}：[погоревал]{.ru}。第 4 题“突然笑起来”，[за-]{.ru}：[засмеялась]{.ru}；[рассмешила]{.ru} 是“把别人逗笑”，必须有宾语。"
    items:
      - stem: Спасибо, я больше не хочу, я уже ___.
        options: [наелся, поел, ел]
        answer: наелся
      - stem: Мама ___ яблоко на две части.
        options: [разрезала, разбудила, разбогатела]
        answer: разрезала
      - stem: Иван немного ___ и отправился в путь.
        options: [погоревал, разбил, наелся]
        answer: погоревал
      - stem: Увидев смешную картину, царевна ___.
        options: [засмеялась, рассмешила, наелась]
        answer: засмеялась

  - id: e4
    type: rewrite
    task: 用带 [за-]{.ru} 的完成体动词改写，代替 [стать / начать]{.ru} + 不定式。
    example:
      cue: Ребёнок начал плакать.
      answer: Ребёнок заплакал.
    why: "[за-]{.ru} + 动词表示动作开始，比 [начать]{.ru} + 不定式更简洁，也更突然。第 1 题 [засмеялась]{.ru}。第 2 题 [запели]{.ru}，[запеть]{.ru} 变位 [запою, запоёшь]{.ru}，过去时 [запели]{.ru}。第 3 题 [закричал]{.ru}。注意：[за-]{.ru} 表示开始只适用于一部分动词（多为声音、情感），不能说 *[зачитал]{.ru}* 表示“开始读”。"
    items:
      - cue: Царевна стала смеяться.
        accept: ["Царевна засмеялась."]
      - cue: Дети начали петь.
        accept: ["Дети запели."]
      - cue: Мальчик начал кричать.
        accept: ["Мальчик закричал."]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 雅加婆婆给客人吃饱喝足，安排他睡下。
        accept: ["Баба-яга накормила гостя, напоила и уложила спать.", "Баба-яга накормила и напоила гостя и уложила его спать.", "Баба-яга накормила гостя, напоила его и уложила спать.", "Баба-яга накормит гостя, напоит и спать уложит.", "Баба-яга накормила, напоила гостя и уложила спать."]
        rubric: ["[накормить, напоить]{.ru}：[на-]{.ru} 表示使饱足", "[уложить спать]{.ru}"]
      - zh: 主人公砸开了箱子，捉住了兔子。
        accept: ["Герой разбил сундук и поймал зайца.", "Герой разбивает сундук и ловит зайца.", "Герой разбил сундук и поймал в нём зайца.", "Герой разбил сундук, поймал зайца.", "Разбив сундук, герой поймал зайца."]
        rubric: ["[разбить]{.ru}：[раз-]{.ru}", "[поймать зайца]{.ru}：动物名词第四格同第二格"]
      - zh: 我们在河边坐了一会儿，然后回家了。
        accept: ["Мы посидели у реки, а потом пошли домой.", "Мы немного посидели у реки, а потом пошли домой.", "Мы посидели на берегу реки, а потом пошли домой.", "Мы посидели у реки и пошли домой.", "Мы посидели у реки, потом пошли домой.", "Мы немного посидели у реки, потом пошли домой.", "Мы немного посидели у реки и пошли домой.", "Мы посидели у реки, а потом вернулись домой.", "Мы посидели у реки и вернулись домой.", "Мы посидели на берегу реки и пошли домой.", "Мы посидели у реки, а потом поехали домой.", "Мы немного посидели на берегу реки, а потом пошли домой."]
        rubric: ["[посидеть]{.ru}：[по-]{.ru} 表示一会儿", "[у реки]{.ru} 或 [на берегу реки]{.ru}"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[В русских сказках добро всегда побеждает зло.]{.ru} 以课文中的两三个人物为例（也可以和中国民间故事比较），至少用四个带 [по-, за-, на-, раз-]{.ru} 的动词。"
        length: 140–160
        model: "В русских сказках добро всегда побеждает зло. Возьмём Ивана-дурака. Братья смеются над ним, потому что он любит полежать на печи. Но Иван добр и честен, он помогает тем, кто попал в беду, и поэтому звери и волшебные помощники помогают ему. В конце сказки он женится на царевне. Совсем другой герой — Кощей Бессмертный. Он похищает красавиц, и все его боятся. Когда он похитил жену Ивана, тот погоревал, погоревал и отправился её искать. Но и Кощей не вечен: герой долго ищет дуб и наконец видит его, разбивает сундук, ловит зайца и утку, ломает иглу, и Кощей умирает. Даже Баба-яга, которая сначала кажется страшной, часто накормит и напоит доброго гостя и поможет ему. Интересно, что в китайских народных сказках тоже побеждают честные и скромные люди. Наверное, поэтому дети во всём мире любят такие истории: они учат, что за доброе сердце человек получает награду, а зло никогда не побеждает."
        rubric: ["第一句是给定的主题句", "至少两个人物的例子，情节与课文一致", "至少四个带本课前缀的动词（[полежать, разбивать, накормить, напоить]{.ru} 等），体和形式正确", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 正面人物（伊万）→ 反面人物（科谢伊，[Совсем другой герой…]{.ru}）→ 中间人物（雅加婆婆，[Даже…]{.ru}）→ 与中国故事比较 → 收束句。用 [Возьмём…]{.ru} 引出第一个例子，是写主题段时常用的方法。
