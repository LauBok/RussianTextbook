lesson: L52
grammar: "人称代词第三格 [мне, тебе́, ему́, ей, нам, вам, им]{.ru}；[нра́виться / понра́виться]{.ru}：喜欢的人用第三格，被喜欢的事物作主语；[нра́виться]{.ru} 与 [люби́ть]{.ru} 的区别。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的人称代词变成第三格。
    why: 人称代词第三格要整个记住：[я → мне]{.ru}，[ты → тебе́]{.ru}，[он / оно́ → ему́]{.ru}，[она́ → ей]{.ru}，[мы → нам]{.ru}，[вы → вам]{.ru}，[они́ → им]{.ru}。[ему́]{.ru} 和 [им]{.ru} 容易混：[ему́]{.ru} 是“他”，[им]{.ru} 是“他们”。
    items:
      - stem: ___ нра́вится Москва́.
        hint: я
        accept: [Мне]
      - stem: ___ нра́вятся блины́?
        hint: ты
        accept: [Тебе́]
      - stem: ___ нра́вится мя́со.
        hint: он
        accept: [Ему́]
      - stem: ___ нра́вится ры́ба.
        hint: она́
        accept: [Ей]
      - stem: ___ нра́вится наш го́род.
        hint: мы
        accept: [Нам]
      - stem: Мари́я Никола́евна, ___ нра́вится ноя́брь?
        hint: вы
        accept: [вам]
      - stem: ___ нра́вятся па́рки.
        hint: они́
        accept: [Им]

  - id: e2
    type: choice
    task: 选择 [нра́вится]{.ru} 或 [нра́вятся]{.ru}。
    why: "[нра́виться]{.ru} 和第一格的主语（被喜欢的事物）一致，和第三格的人无关。主语是单数或不定式用 [нра́вится]{.ru}，主语是复数用 [нра́вятся]{.ru}。第 3 题 [нам]{.ru} 虽然是复数，但主语 [Москва́]{.ru} 是单数；第 5 题的 [чита́ть]{.ru} 是不定式，用单数。"
    items:
      - stem: Мне ___ у́лицы и па́рки.
        options: [нра́вится, нра́вятся]
        answer: нра́вятся
      - stem: Ми́ше не ___ ноя́брь.
        options: [нра́вится, нра́вятся]
        answer: нра́вится
      - stem: Нам ___ Москва́.
        options: [нра́вится, нра́вятся]
        answer: нра́вится
      - stem: Тебе́ ___ блины́?
        options: [нра́вится, нра́вятся]
        answer: нра́вятся
      - stem: А́нне ___ чита́ть.
        options: [нра́вится, нра́вятся]
        answer: нра́вится

  - id: e3
    type: rewrite
    task: 用 [нра́виться]{.ru} 改写句子。
    placeholder: Мне нра́вится …
    example:
      cue: Я люблю́ метро́.
      answer: Мне нра́вится метро́.
    why: 改写时主语 [я]{.ru}、[он]{.ru} 等变成第三格，原来的宾语（第四格）变成主语（第一格）。第 2 题 [ку́хню]{.ru} 要还原成 [ку́хня]{.ru}；第 3 题主语 [блины́]{.ru} 是复数，动词用 [нра́вятся]{.ru}；第 4 题 [Ива́н Серге́евич]{.ru} 名字和父称都要变成第三格。
    items:
      - cue: Он лю́бит ры́бу.
        accept: ["Ему́ нра́вится ры́ба."]
      - cue: Мы лю́бим ру́сскую ку́хню.
        accept: ["Нам нра́вится ру́сская ку́хня."]
      - cue: Ты лю́бишь блины́?
        accept: ["Тебе́ нра́вятся блины́?"]
      - cue: Ива́н Серге́евич лю́бит мя́со.
        accept: ["Ива́ну Серге́евичу нра́вится мя́со."]
      - cue: Она́ лю́бит о́сень.
        accept: ["Ей нра́вится о́сень."]

  - id: e4
    type: fill
    task: 用 [нра́виться]{.ru} 的过去时填空。
    why: 过去时跟主语的性和数变：[Кремль]{.ru} 阳性 → [нра́вился]{.ru}，[Москва́]{.ru} 阴性 → [нра́вилась]{.ru}，[метро́]{.ru} 中性 → [нра́вилось]{.ru}，[блины́]{.ru} 复数 → [нра́вились]{.ru}。容易错的是跟着第三格的人变，比如第 2 题 [Ми́ше]{.ru} 是男孩，但主语 [Москва́]{.ru} 是阴性，要用 [нра́вилась]{.ru}。
    items:
      - stem: А́нне ___ Кремль.
        hint: нра́виться
        accept: [нра́вился]
      - stem: Ми́ше ___ Москва́.
        hint: нра́виться
        accept: [нра́вилась]
      - stem: Нам ___ метро́.
        hint: нра́виться
        accept: [нра́вилось]
      - stem: Ива́ну Серге́евичу ___ блины́.
        hint: нра́виться
        accept: [нра́вились]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 都用 [нра́виться]{.ru} 句型：喜欢的人用第三格，喜欢的东西作主语。
    items:
      - zh: 我喜欢莫斯科的地铁。
        accept: ["Мне нра́вится моско́вское метро́.", "Мне нра́вится метро́ в Москве́.", "Мне в Москве́ нра́вится метро́.", "В Москве́ мне нра́вится метро́."]
        rubric: ["“我”用第三格 [мне]{.ru}", "[метро́]{.ru} 是不变格的中性名词，动词用 [нра́вится]{.ru}"]
      - zh: 你喜欢俄罗斯菜吗？
        accept: ["Тебе́ нра́вится ру́сская ку́хня?", "Вам нра́вится ру́сская ку́хня?"]
        rubric: ["[тебе́]{.ru} 或 [вам]{.ru} 用第三格", "“俄罗斯菜”是 [ру́сская ку́хня]{.ru}"]
      - zh: 她不喜欢十一月。
        accept: ["Ей не нра́вится ноя́брь."]
        rubric: ["“她”用 [ей]{.ru}，不是 [её]{.ru}", "[не]{.ru} 放在 [нра́вится]{.ru} 前"]
      - zh: 米沙喜欢足球，他也喜欢雪。
        accept: ["Ми́ше нра́вится футбо́л, ему́ то́же нра́вится снег.", "Ми́ше нра́вится футбо́л. Ему́ то́же нра́вится снег.", "Ми́ше нра́вится футбо́л, и ему́ нра́вится снег.", "Ми́ше нра́вится футбо́л, и снег ему́ то́же нра́вится.", "Ми́ше нра́вится футбо́л, снег ему́ то́же нра́вится.", "Ми́ше нра́вится футбо́л, ещё ему́ нра́вится снег."]
        rubric: ["[Ми́ше]{.ru}、[ему́]{.ru} 用第三格"]
      - zh: 我们很喜欢克里姆林宫。（指参观过后）
        accept: ["Нам о́чень понра́вился Кремль.", "Нам Кремль о́чень понра́вился."]
        rubric: ["用完成体过去时 [понра́вился]{.ru}，表示看了以后喜欢上", "[Кремль]{.ru} 是阳性，动词用阳性"]

  - id: e6
    type: open
    task: 情景对话：你的俄罗斯朋友问你喜欢不喜欢你住的城市。写一段 6–8 句的对话，说说你喜欢和不喜欢的东西（街道、公园、天气、饭菜等）。
    items:
      - prompt: 两人对话，至少用四次 [нра́вится / нра́вятся]{.ru}，至少用到两个不同的人称代词第三格。
        length: 50–90
        model: "— Тебе́ нра́вится Пеки́н?\n— Да, о́чень нра́вится! Мне нра́вятся па́рки и у́лицы.\n— А пого́да?\n— О́сень мне нра́вится, она́ тёплая и со́лнечная. А ноя́брь не о́чень.\n— А твой друг? Ему́ нра́вится Пеки́н?\n— Нет, ему́ нра́вится Шанха́й. Там мо́ре.\n— А кита́йская ку́хня тебе́ нра́вится?\n— Коне́чно! Мне нра́вится ры́ба и мя́со."
        rubric: ["对话自然，问答对应", "[нра́вится]{.ru} 和 [нра́вятся]{.ru} 与主语的数一致", "人称代词第三格用对"]
        notes: 范文从总的印象（城市）问到具体方面（天气、饭菜），一问一答。用 [А…?]{.ru} 引出新话题，口语里很自然。注意 [ры́ба и мя́со]{.ru} 是两个并列的主语，动词放在它们前面时，常常只和最近的一个主语 [ры́ба]{.ru} 一致，用单数 [нра́вится]{.ru}；用复数 [нра́вятся]{.ru} 也对。
