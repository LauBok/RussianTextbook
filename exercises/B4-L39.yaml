lesson: B4-L39
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Зачем Чехов сделал перепись и почему он почти не пользовался помощью других людей?]{.ru}"
        length: 40–70
        model: "Чехов хотел побывать во всех селениях и поближе познакомиться с жизнью ссыльных. Для него были важны не столько результаты переписи, сколько впечатления, которые давал сам процесс: он заходил в каждую избу и разговаривал с людьми. Поэтому он почти всё делал сам, хотя ему предлагали помощников."
        rubric: ["说出目的：了解流放犯的生活", "说出原因：重要的是登记过程给人的印象"]
        notes: "答案在第 1 段。这一段说明了全书的方法：契诃夫的“登记”首先是一种接近人、观察人的方式。"
      - prompt: "[Почему ссыльные не могли сразу сказать, в каком году они пришли на Сахалин? Как они отвечали?]{.ru}"
        length: 40–80
        model: "Для ссыльных год прибытия на Сахалин был годом страшного несчастья, но они его не знали или не помнили. Они отвечали неуверенно, спорили друг с другом, считали годы каторги и поселения или называли события: «одного сплава с Гладким», «в тот год, когда Дербина убили», «тогда Мицуль помер»."
        rubric: ["说出“不知道或记不得”", "举出至少两种回答方式（同一船、按事件记年、计算刑期）"]
        notes: "第 4—8 段。作者没有解释人们为什么记不得，但从回答方式可以看出：在岛上，时间是按犯人的经历来计算的。"
      - prompt: "[Что думали ссыльные о переписи? Чей голос звучит в конце отрывка и что он выражает?]{.ru}"
        length: 40–70
        model: "Ссыльные считали перепись ещё одной формальной процедурой. Одни думали, что начальство хочет распределить пособие, другие — что всех будут переселять на материк, третьи говорили, что ничего хорошего не ждут. А в конце из сеней или с печки звучит усталый голос: «И всё они пишут…» В нём слышатся скука и досада: люди устали от бесконечных записей, которые ничего не меняют."
        rubric: ["说出三种猜测", "说出结尾声音中的疲倦和嘲讽"]
        notes: "第 14—17 段。结尾的声音没有名字，它代表的是所有已经不再相信“登记”的人。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[перепись]{.ru}"
        accept: ["Работа, когда записывают всех жителей и сведения о них.", "Когда считают и записывают всё население."]
        rubric: ["说明是登记全体居民及其情况"]
      - zh: "[каторжный]{.ru}"
        accept: ["Человек, которого за преступление послали на каторгу.", "Тот, кто за преступление живёт и работает на каторге."]
        rubric: ["说明是被判服苦役的人"]
      - zh: "[поселенец]{.ru}"
        accept: ["Ссыльный, который уже был на каторге и теперь живёт на поселении.", "Человек, который закончил свой срок на каторге и остался жить на Сахалине."]
        rubric: ["说明是服满苦役后在当地定居的流放犯"]
      - zh: "[материк]{.ru}"
        accept: ["Большая земля, в отличие от острова.", "Большая часть земли, а не остров."]
        rubric: ["说明是与岛屿相对的大陆"]
      - zh: "[надзиратель]{.ru}"
        accept: ["Человек, который следит за заключёнными.", "Тот, кто смотрит за ссыльными и каторжными."]
        rubric: ["说明是看管犯人的人"]
      - zh: "[острить]{.ru}"
        accept: ["Говорить что-то смешное и умное.", "Шутить."]
        rubric: ["说明是说俏皮话、开玩笑"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题纪实文体以真实的人和事为材料，精确的数字、日期和编号是它的标志。第 2 题第 1 段作者承认自己的工作不能叫做真正的普查，结果不完全准确，这种谨慎增加了可信度。第 3 题作者让人物自己说话，用原话代替评论。第 4 题“我们萨哈林什么都拴着链子”是户主的俏皮话，暗指岛上的人也不自由。第 5 题 [И всё они пишут]{.ru} 重复三次，表现疲倦和嘲讽。第 6 题作者在一长串记录之后用一句话点出意义：来岛的那一年是“遭受可怕不幸的一年”。"
    items:
      - stem: "Точные даты, числа и номера строк в карточке показывают, что это ___."
        options: ["документальная проза", "сказка", "лирическое стихотворение"]
        answer: "документальная проза"
      - stem: "Чехов пишет, что его работу «нельзя назвать переписью». Это делает его рассказ ___."
        options: ["более честным и убедительным", "смешным", "непонятным"]
        answer: "более честным и убедительным"
      - stem: "Вместо того чтобы самому оценивать жизнь ссыльных, автор чаще всего ___."
        options: ["приводит их собственные слова", "ругает начальство", "рассказывает о себе"]
        answer: "приводит их собственные слова"
      - stem: "Слова «У нас на Сахалине всё на цепи» значат, что ___."
        options: ["на Сахалине не только собаки, но и люди живут без свободы", "на Сахалине много собак", "хозяин боится воров"]
        answer: "на Сахалине не только собаки, но и люди живут без свободы"
      - stem: "Повтор «И всё они пишут, и всё они пишут, и всё они пишут» выражает ___."
        options: ["усталость и насмешку", "радость", "уважение к переписи"]
        answer: "усталость и насмешку"
      - stem: "Фраза «Год прибытия на Сахалин — год страшного несчастья» нужна автору, чтобы ___."
        options: ["одной фразой показать смысл записанных ответов", "назвать точную дату", "начать новую главу"]
        answer: "одной фразой показать смысл записанных ответов"

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形和支配关系。
    why: "第 1 题 [прибегнуть к чему]{.ru} 要求第三格：[приёму]{.ru}。第 2 题 [пользоваться чем]{.ru} 要求第五格：[помощью]{.ru}。第 3 题 [отличаться чем]{.ru} 要求第五格，两个名词并列：[точностью и полнотой]{.ru}，这里填 [точностью]{.ru}。第 4 题 [за неимением чего]{.ru}，形容词与 [данных]{.ru} 一致，复数第二格 [серьёзных]{.ru}。第 5 题 [на привязи]{.ru} 固定说法，第六格。第 6 题 [вызвать что]{.ru}，[возражение]{.ru} 中性第四格同第一格。"
    items:
      - stem: "Я прибегнул к ___, который казался мне единственным."
        hint: приём
        accept: ["приёму"]
      - stem: "Я пользовался чужою ___ только в очень редких случаях."
        hint: помощь
        accept: ["помощью"]
      - stem: "Результаты её не могут отличаться ___ и полнотой."
        hint: точность
        accept: ["точностью"]
      - stem: "За неимением более ___ данных пригодятся и мои цифры."
        hint: серьёзный
        accept: ["серьёзных"]
      - stem: "Эти смирные собаки почему-то на ___."
        hint: привязь
        accept: ["привязи"]
      - stem: "Они говорили это, чтобы вызвать с моей стороны ___."
        hint: возражение
        accept: ["возражение"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词。保持纪实文体的客观语气，可以保留一两个关键的数字或原话。
    items:
      - prompt: "[Напишите краткое изложение отрывка.]{.ru}"
        length: 130–170
        model: "Чтобы познакомиться с жизнью ссыльных, Чехов сделал на Сахалине перепись. За три месяца он один обошёл все избы в селениях, где побывал, и записал всех жителей. Он признаёт, что результаты его работы не очень точны, но других данных нет. Для переписи он пользовался карточками, в которых было несколько строк: название селения, номер дома, звание человека и другие сведения. Труднее всего ссыльным было ответить, с какого года они на Сахалине. Они не помнили этого, спорили, считали годы или называли события: «одного сплава с Гладким», «когда Дербина убили». Обычно Чехова сопровождал кто-нибудь из ссыльных, а иногда надзиратель с револьвером, который ничего не мог объяснить. Избы бедные, вокруг ни одного дерева, даже собаки и петухи на привязи. Ссыльные считали перепись формальной процедурой и строили разные догадки: одни ждали пособия, другие — переселения на материк. А кто-то устало говорил: «И всё они пишут…»"
        rubric: ["写出登记的目的和方法", "写出关于来岛年份的回答", "写出登记时的情景（向导、看守、拴着的动物）", "写出犯人对登记的看法和结尾的声音", "130—170 词，客观语气"]
        notes: "范文 138 词。纪实文本的概要可以保留第一人称（[я]{.ru}），也可以改为第三人称（[Чехов]{.ru}），但要统一。精确数字保留最重要的（[за три месяца]{.ru}）即可；原话只选最有代表性的一两句。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评：“契诃夫怎样用‘冷静’的事实写出了萨哈林的悲剧？”谈作者的立场和写法，也可以和你读过的其他纪实作品比较。
    items:
      - prompt: "[Как Чехов показывает трагедию Сахалина через спокойное описание фактов? Напишите отзыв о прочитанном отрывке.]{.ru}"
        length: 250–300
        model: "Когда читаешь главу о переписи, сначала кажется, что это обычный отчёт. Чехов спокойно объясняет, как он работал, какие строки были в его карточке, о чём он спрашивал людей. Но чем дальше читаешь, тем яснее понимаешь, какая страшная жизнь скрывается за этими сухими фактами.\n\nПрежде всего, Чехов почти никогда не говорит прямо, что он чувствует. Он не пишет «мне было жаль этих людей» и не ругает начальство. Вместо этого он даёт слово самим ссыльным. Женщина не помнит, в каком году её привезли на остров; мужчина говорит, что он «одного сплава с Гладким»; другой считает время с того года, когда убили Дербина. Из этих ответов видно, что у людей как будто взяли собственную жизнь: они считают годы не по своим праздникам, а по каторге.\n\nВо-вторых, автор очень точно выбирает детали. Надзиратель с револьвером, который на все вопросы отвечает «Не могу знать»; босой проводник с чернильницей; собаки и петух на привязи. И шутка хозяина: «У нас на Сахалине всё на цепи». После этой фразы ничего не нужно объяснять.\n\nВ-третьих, Чехов честен по отношению к себе. Он признаёт, что его работа неточна и неполна, а в конце приводит слова ссыльного, который смеётся над всеми, кто «всё пишет», — в том числе и над самим автором. Писатель понимает, что для этих людей он тоже чиновник с бумагами.\n\nПо-моему, в этом и сила книги. Чехов не делает из ссыльных героев или злодеев, он показывает их обычными людьми в страшных условиях. Спокойный тон заставляет читателя самого сделать выводы. После такой книги трудно остаться равнодушным: факты говорят громче любых громких слов."
        rubric: ["说明契诃夫“不直接表态”的立场", "分析至少两种手法（人物原话、细节选择、自我反省、一句话点题），每种有例子", "写出自己的评价", "250—300 词，结构完整"]
        notes: "范文 252 词。结构：引子（像报告，又不只是报告）—手法一（让人物说话）—手法二（细节）—手法三（诚实与自嘲）—结论（事实胜于呼喊）。评论纪实作品时，要把“写了什么事实”和“作者怎样安排这些事实”区分开来。"
