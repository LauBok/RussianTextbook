lesson: B4-L29
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что, по словам ректора, самое главное из того, что выпускники получили в университете? Что сказал ректору его старый профессор? Зачем, по мнению ректора, нужен университет, если есть интернет? Какие три совета он даёт выпускникам? Кого ещё благодарит ректор?]{.ru}"
        length: 110–150
        model: "По словам ректора, самое главное, что выпускники получили в университете, — это не диплом и даже не знания, а умение учиться, спорить, работать в команде, ошибаться и исправлять ошибки. Старый профессор сказал ректору, что знания устареют через десять лет, а умение думать не устареет никогда. Университет нужен потому, что интернет не научит отличать правду от лжи, задавать правильные вопросы и дружить; этому учит только живое общение. Ректор советует выпускникам не бояться ошибаться, не бояться менять направление и не забывать, откуда они пришли. Кроме выпускников, ректор благодарит родителей, которые верили в своих детей и переживали за каждый экзамен, и преподавателей — за терпение, знания и за то, что они отдавали студентам часть своей души."
        rubric: ["五个问题都回答，内容与课文一致", "三条建议完整", "用第三人称转述"]
        notes: "第 1 题的答案在第 3–4 段：毕业证书和知识只是铺垫，[Но]{.ru} 后面才是真正的答案。第 4 题的三条建议都以 [не бойтесь / не забывайте]{.ru} 开头，转述时改成 [советует не бояться…]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[однокурсник]{.ru}"
        accept: ["Студент, который учится на том же курсе, что и ты.", "Человек, с которым ты учился на одном курсе в университете."]
        rubric: ["说明是同一年级的大学同学"]
      - zh: "[поражение]{.ru}"
        accept: ["Неудача, когда человек или команда проиграли.", "Результат, когда ты не смог победить."]
        rubric: ["说明是失败、没有获胜"]
      - zh: "[устареть]{.ru}"
        accept: ["Стать старым и больше не нужным, потому что появилось что-то новое.", "Перестать быть современным."]
        rubric: ["说明因为新事物出现而变得不再适用"]
      - zh: "[растерянный]{.ru}"
        accept: ["Такой, который не знает, что делать.", "Человек, который не понимает, что ему делать, и немного боится."]
        rubric: ["说明不知道该怎么办、慌乱"]
      - zh: "[вручение дипломов]{.ru}"
        accept: ["Церемония, на которой выпускникам дают дипломы.", "Торжественный день, когда выпускники получают дипломы."]
        rubric: ["说明是向毕业生颁发证书的仪式"]
      - zh: "[оратор]{.ru}"
        accept: ["Человек, который выступает с речью перед слушателями.", "Человек, который умеет хорошо выступать перед людьми."]
        rubric: ["说明是向听众发表演说的人"]

  - id: e3
    type: choice
    task: 下列句子分别用了哪种修辞手法？
    why: "第 1 题四句话都以 [Вы научились]{.ru} 开头，是首语重复（[анафора]{.ru}）。第 2 题演讲者自问自答，是设问（[риторический вопрос]{.ru}）。第 3 题直接称呼听众，是呼告（[обращение]{.ru}）。第 4 题三句都以 [Интернет не научит]{.ru} 开头，是首语重复。第 5 题 [Страшно ли это? Немного.]{.ru} 自问自答，是设问。第 6 题 [Друзья мои!]{.ru} 是呼告，用在演讲的最后部分，比 [Дорогие выпускники!]{.ru} 更亲近。"
    items:
      - stem: "«Вы научились учиться. Вы научились не спать ночами… Вы научились спорить…» — это ___."
        options: [анафора, риторический вопрос, обращение]
        answer: анафора
      - stem: "«Что же вы уносите с собой из этих стен? Диплом? Безусловно.» — это ___."
        options: [риторический вопрос, анафора, обращение]
        answer: риторический вопрос
      - stem: "«Уважаемые родители!» — это ___."
        options: [обращение, анафора, риторический вопрос]
        answer: обращение
      - stem: "«Интернет не научит отличать правду от лжи. Интернет не научит задавать правильные вопросы.» — это ___."
        options: [анафора, обращение, риторический вопрос]
        answer: анафора
      - stem: "«Страшно ли это? Немного.» — это ___."
        options: [риторический вопрос, обращение, анафора]
        answer: риторический вопрос
      - stem: "«Друзья мои!» — это ___."
        options: [обращение, риторический вопрос, анафора]
        answer: обращение

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [справиться с чем]{.ru}，完成体将来时第二人称复数 [справитесь]{.ru}，词干 [справ-]{.ru} 重音不移。第 2 题 [пригодиться кому]{.ru}，主语 [это]{.ru} 中性单数，将来时 [пригодится]{.ru}。第 3 题 [отличать что от чего]{.ru}，[не научит]{.ru} 后用不定式。第 4 题 [оторваться от чего]{.ru}，[не могли]{.ru} 后用不定式。第 5 题 [выигрывать]{.ru} 重音在 [-и́-]{.ru}，[научились]{.ru} 后用不定式。第 6 题 [свернуть]{.ru} 的命令式复数是 [сверните]{.ru}。第 7 题 [устареть]{.ru} 将来时第三人称复数 [устареют]{.ru}，主语是 [знания]{.ru}。"
    items:
      - stem: Пять лет назад вам тоже было страшно, и вы ___ и теперь.
        hint: справиться
        accept: ["справитесь"]
      - stem: В жизни это ___ больше, чем любая формула.
        hint: пригодиться
        accept: ["пригодится"]
      - stem: Интернет не научит ___ правду от лжи.
        hint: отличать
        accept: ["отличать"]
      - stem: Вы читали книги, потому что не могли от них ___.
        hint: оторваться
        accept: ["оторваться"]
      - stem: Вы научились спорить с преподавателями и иногда ___ эти споры.
        hint: выигрывать
        accept: ["выигрывать"]
      - stem: Если вы выбрали не ту дорогу, — ___!
        hint: свернуть
        accept: ["сверните"]
      - stem: Знания, которые вы получили, ___ через десять лет.
        hint: устареть
        accept: ["устареют"]

  - id: e5
    type: rewrite
    task: 演讲中常用命令式直接对听众提出建议。把下面的句子改成命令式。
    example:
      cue: Вы должны звонить родителям.
      answer: Звоните родителям.
    why: "建议、号召一般用未完成体命令式（[звоните, помогайте, приезжайте]{.ru}），表示经常要做的事。否定命令式几乎总用未完成体：[не бойтесь, не забывайте]{.ru}，用完成体（[не забудьте]{.ru}）则表示提醒、警告“别忘了（某一件事）”。第 4 题 [поверить]{.ru} 是一次性的请求，用完成体 [поверьте]{.ru}。[бояться]{.ru} 的命令式是 [бойтесь]{.ru}，后面可以接名词第二格（[ошибок]{.ru}），也可以接不定式（[ошибаться]{.ru}）。"
    items:
      - cue: Вы не должны бояться ошибок.
        accept: ["Не бойтесь ошибок.", "Не бойтесь ошибаться."]
      - cue: Вам нужно помогать тем, кто идёт за вами.
        accept: ["Помогайте тем, кто идёт за вами."]
      - cue: Вы не должны забывать, откуда вы пришли.
        accept: ["Не забывайте, откуда вы пришли."]
      - cue: Вам надо поверить мне.
        accept: ["Поверьте мне."]
      - cue: Вы должны приезжать к нам.
        accept: ["Приезжайте к нам."]

  - id: e6
    type: open
    task: 概要写作。用俄语把演讲压缩成 150 词左右的报道，用第三人称转述。
    items:
      - prompt: "[Изложите кратко содержание речи ректора.]{.ru} 开头写明谁、在什么场合讲话。"
        length: 130–170
        model: "На церемонии вручения дипломов ректор Новоречинского технического университета Сергей Ветров обратился к выпускникам с речью. Как опытный оратор, он говорил просто и коротко. Он сказал, что главное, что студенты получили за пять лет, — не диплом, а умение учиться, спорить, работать в команде и исправлять свои ошибки. Ректор вспомнил слова своего старого профессора: знания устареют, а умение думать — никогда. По его мнению, университет нужен и в эпоху интернета, потому что только живое общение учит отличать правду от лжи, задавать правильные вопросы и дружить. Ректор признал, что мир меняется очень быстро, но выразил уверенность, что выпускники справятся. Он дал им три совета: не бояться ошибок, не бояться менять направление и не забывать, откуда они пришли, — и призвал их работать честно и ответственно. Ректор поблагодарил родителей и преподавателей и напомнил, что будущее мира и города теперь зависит от выпускников."
        rubric: ["开头写明讲话人和场合", "用转述动词（[сказал, вспомнил, признал, дал совет, поблагодарил]{.ru}）", "写出主要内容：收获、大学的意义、三条建议、感谢", "删去排比和设问，不用直接引语", "130–170 词"]
        notes: "范文约 140 词。演讲改成报道时，修辞手法要“拆掉”：四句排比 [Вы научились…]{.ru} 合成一个列举；设问 [Страшно ли это? Немного.]{.ru} 改成陈述 [Ректор признал, что…]{.ru}；呼告全部删去。转述动词要选准：[обратился с речью]{.ru}（发表讲话）、[призвал]{.ru}（号召）、[выразил уверенность]{.ru}（表示相信）。"

  - id: e7
    type: open
    task: 写一篇演讲稿：你代表毕业生在毕业典礼上致辞（或代表老生在新生入学典礼上致辞）。180–220 词，至少用一组排比、一个设问和两次呼告。
    items:
      - prompt: "[Речь выпускника на церемонии вручения дипломов.]{.ru}"
        length: 180–220
        model: "Дорогие друзья! Уважаемые преподаватели! Дорогие родители!\n\nПять лет назад мы пришли сюда чужими людьми. Сегодня мы уходим отсюда друзьями. Что изменилось за эти пять лет? Мы стали старше? Конечно. Мы стали умнее? Надеюсь. Но главное — мы стали другими.\n\nМы помним первую лекцию, на которой ничего не поняли. Мы помним первый экзамен, после которого хотелось всё бросить. Мы помним ночи перед сессией, когда мы помогали друг другу. И мы помним, как однажды поняли, что справились.\n\nУважаемые преподаватели! Спасибо вам за то, что вы верили в нас больше, чем мы сами. Спасибо за то, что не ставили нам хорошие оценки просто так. Спасибо за то, что учили нас не только формулам, но и честности. Спасибо за то, что ваши двери всегда были открыты, даже в восемь вечера.\n\nДорогие родители! Это вы отправили нас сюда. Это вы ждали наших звонков. Это вы радовались каждому нашему успеху. Сегодня этот диплом — и ваш тоже.\n\nДрузья! Нас ждёт непростой мир. Через год многие из нас будут жить в разных городах и даже в разных странах, но наша дружба не устареет. Мы будем ошибаться, будем менять направление, будем начинать сначала. Но мы уже знаем главное: вместе мы справимся. В добрый путь!"
        rubric: ["开头呼告听众", "至少一组排比（同一个词开头的三个句子）", "至少一个设问并自己回答", "感谢老师和家长", "结尾有号召或祝愿", "180–220 词"]
        notes: "范文约 190 词。结构与校长的致辞相似，但视角是学生：第二段用设问开场，第三段用 [Мы помним…]{.ru} 排比回顾大学生活，第四段 [Спасибо…]{.ru}、第五段 [Это вы…]{.ru} 两组排比分别感谢老师和家长，最后用 [Друзья!]{.ru} 转入展望。排比的最后一句常常改变结构（[И мы помним, как однажды поняли, что справились]{.ru}），使节奏收住。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的文章。
    items:
      - prompt: "[Чему на самом деле учит университет?]{.ru}"
        length: 250–300
        model: "Когда я поступал в университет, я думал, что еду туда за знаниями. Через несколько лет я понял, что это не совсем так. Знания, конечно, важны, но многое из того, что мы учили на лекциях, можно найти в интернете или в книгах. Чему же тогда на самом деле учит университет? По-моему, трём вещам, которые трудно получить в другом месте.\n\nВо-первых, университет учит учиться. В школе учитель объясняет всё сам, а в университете никто не будет стоять у тебя за спиной. Нужно самому найти книги, самому решить, что важно, самому решить, сколько времени на что тратить перед сессией. Это умение пригодится всю жизнь, потому что профессии меняются, и учиться придётся постоянно.\n\nВо-вторых, университет учит думать критически. На хороших семинарах преподаватель не даёт готовых ответов, а задаёт вопросы. Студенты спорят, ошибаются, исправляют ошибки. Так человек учится отличать факты от мнений, а правду — от лжи. В эпоху интернета это, может быть, самое важное умение.\n\nВ-третьих, университет учит жить среди людей. В общежитии, в студенческих командах, на практике мы встречаем людей из разных городов и стран, с разными привычками и взглядами. Мы учимся договариваться, работать вместе, отвечать не только за себя.\n\nКонечно, всему этому можно научиться и без университета. Многие известные люди не получили высшего образования. Однако для большинства из нас университет — это лучшее место, где можно спокойно, без больших рисков, сделать первые ошибки. Здесь за ошибку получаешь плохую оценку, а не теряешь работу, и рядом всегда есть преподаватель, который поможет её понять.\n\nТаким образом, диплом — это не главное, что выпускник уносит из университета. Главное — это он сам, человек, который умеет учиться, думать и жить с другими."
        rubric: ["开头提出问题并给出论点", "三条论据，每条有具体说明", "有让步（[Конечно…, однако…]{.ru}）", "结尾总结并呼应开头", "250–300 词"]
        notes: "范文约 260 词。开头用自己的经历引出问题，再用设问 [Чему же тогда на самом деле учит университет?]{.ru} 提出论点。三条论据分别是学习能力、批判思维、与人相处。倒数第二段让步，承认不上大学也能学会这些，然后用 [Однако]{.ru} 拉回。"
