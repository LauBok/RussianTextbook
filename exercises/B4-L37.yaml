lesson: B4-L37
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Почему князь Андрей бросился к знамени? О чём он думал в эту минуту?]{.ru}"
        length: 40–70
        model: "Войска бежали, знамя упало, и старый Кутузов в отчаянии обратился к Болконскому. Князь Андрей почувствовал стыд и злобу, соскочил с лошади и побежал к знамени. Он думал: «Вот оно!» Ему казалось, что наступила та минута, о которой он давно мечтал, минута подвига и славы."
        rubric: ["说出背景：军队溃逃、库图佐夫求助", "说出安德烈的感受：羞愧、愤怒；以为建功的时刻到了"]
        notes: "第 1—5 段。[«Вот оно!»]{.ru} 很重要：安德烈一直梦想自己的“土伦”，即像拿破仑那样一举成名的时刻。读者应该感觉到，他这时想的还是荣誉。"
      - prompt: "[Что понял князь Андрей, когда увидел над собой небо?]{.ru}"
        length: 40–70
        model: "Он понял, что всё, что было до этого — бег, крики, борьба, его мечты о славе, — пусто и не имеет смысла. Важно только высокое, тихое и бесконечное небо. Он удивился, что не видел его раньше, и почувствовал себя счастливым, потому что наконец узнал его. Ему кажется, что нет ничего, кроме неба, и даже его нет — есть только тишина и покой."
        rubric: ["说出“一切都是空虚，除了天空”", "说出他的惊讶和幸福感"]
        notes: "第 8 段的内心独白。注意 [Как же я не видал прежде этого высокого неба?]{.ru}：天空一直都在，只是他以前看不见。"
      - prompt: "[Каким показался князю Андрею Наполеон? Почему он ничего не ответил императору?]{.ru}"
        length: 40–80
        model: "Раньше Наполеон был героем князя Андрея, но теперь он показался ему маленьким и ничтожным человеком с мелким тщеславием и радостью победы. По сравнению с высоким и справедливым небом, которое он увидел, всё, что интересовало Наполеона, было пустым. Поэтому князь Андрей молчал и не мог ему отвечать."
        rubric: ["说出拿破仑在他眼里变得渺小、虚荣", "说出原因：与天空和死亡相比，一切都微不足道"]
        notes: "第十九章的两段（选文倒数第一、二段）。安德烈五分钟前还能说话，所以他的沉默不是因为伤重，而是因为他已经不把拿破仑当作英雄了。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[знамя]{.ru}"
        accept: ["Флаг полка или армии.", "Большой флаг, который несут перед войсками."]
        rubric: ["说明是军队的旗帜"]
      - zh: "[неприятель]{.ru}"
        accept: ["Враг на войне.", "Армия, с которой воюют.", "Враг."]
        rubric: ["说明是战争中的敌人"]
      - zh: "[навзничь]{.ru}"
        accept: ["На спину.", "Лицом вверх."]
        rubric: ["说明是仰面、背朝下"]
      - zh: "[трофей]{.ru}"
        accept: ["Вещь, которую взяли у врага после победы.", "То, что победители взяли у врага."]
        rubric: ["说明是从敌人手里夺来的东西"]
      - zh: "[тщеславие]{.ru}"
        accept: ["Желание, чтобы все тебя хвалили и считали великим.", "Желание славы."]
        rubric: ["说明是追求荣誉、喜欢别人称赞"]
      - zh: "[адъютант]{.ru}"
        accept: ["Офицер, который помогает генералу и передаёт его приказания.", "Помощник генерала, который передаёт его приказы."]
        rubric: ["说明是协助将领、传达命令的军官"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题托尔斯泰写的天空“不晴朗”、云是灰色的，强调的是“高”“静”“无边”，而不是美丽。第 2 题 [совсем не так]{.ru} 连续出现在几个分句开头，是首语重复，用来对比天空和战斗。第 3 题安德烈受伤时只觉得“有点儿疼，主要是不舒服”，疼痛分散了他的注意力，这是出人意料的感觉细节。第 4 题拿破仑的话在他听来像苍蝇的嗡嗡声：他不感兴趣，马上就忘了。第 5 题最后一段写到天空时用的是 [справедливым и добрым]{.ru}，修饰语带上了道德意义。第 6 题 [ничтожность — ничтожество]{.ru} 同根词重复，层层递进。"
    items:
      - stem: "Небо над князем Андреем было ___."
        options: ["не ясным, но неизмеримо высоким", "синим и солнечным", "тёмным и страшным"]
        answer: "не ясным, но неизмеримо высоким"
      - stem: "Повтор «совсем не так… совсем не так…» помогает ___."
        options: ["показать разницу между тишиной неба и шумом боя", "описать французского солдата", "показать, что князь Андрей боится"]
        answer: "показать разницу между тишиной неба и шумом боя"
      - stem: "Удар в голову показался князю Андрею прежде всего ___."
        options: ["неприятным, потому что мешал смотреть", "очень страшным", "совсем не больным"]
        answer: "неприятным, потому что мешал смотреть"
      - stem: "Слова Наполеона князь Андрей слышал, «как бы он слышал жужжание мухи». Это значит, что они ___."
        options: ["были ему совсем не интересны", "были очень громкими", "сделали его счастливым"]
        answer: "были ему совсем не интересны"
      - stem: "В последней части отрывка небо названо «справедливым и добрым». Это показывает, что для героя небо стало ___."
        options: ["образом высшей правды", "знаком плохой погоды", "местом, куда он хочет улететь"]
        answer: "образом высшей правды"
      - stem: "Слова «о ничтожности величия, о ничтожности жизни… о ещё большем ничтожестве смерти» построены на ___."
        options: ["повторе слов с одним корнем", "разговоре героев", "описании природы"]
        answer: "повторе слов с одним корнем"

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [знамя]{.ru} 是以 [-мя]{.ru} 结尾的中性名词，第三格 [знамени]{.ru}，跟在 [к]{.ru} 后面。第 2 题 [древко]{.ru} 第四格同第一格。第 3 题 [ползти]{.ru} 现在时复数第三人称 [ползут]{.ru}，主语 [облака]{.ru}。第 4 题 [стонать]{.ru} 过去时阳性 [стонал]{.ru}，未完成体表示持续。第 5 题 [виднеться]{.ru} 过去时中性还是阴性取决于主语 [бесконечность]{.ru}（阴性）：[виднелась]{.ru}。第 6 题 [ничтожный]{.ru} 第五格阳性 [ничтожным]{.ru}，与 [человеком]{.ru} 一致，[казаться кем]{.ru} 要求第五格。"
    items:
      - stem: "Князь Андрей соскочил с лошади и бежал к ___."
        hint: знамя
        accept: ["знамени"]
      - stem: "Он схватил ___ знамени."
        hint: древко
        accept: ["древко"]
      - stem: "Совсем не так ___ облака по этому высокому небу."
        hint: ползти
        accept: ["ползут"]
      - stem: "Он ___ тихим, жалостным и детским стоном."
        hint: стонать
        accept: ["стонал"]
      - stem: "Сквозь облака ___ синеющая бесконечность."
        hint: виднеться
        accept: ["виднелась"]
      - stem: "Наполеон казался ему маленьким, ___ человеком."
        hint: ничтожный
        accept: ["ничтожным"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词，写清楚事件经过和主人公思想的变化。
    items:
      - prompt: "[Напишите краткое изложение отрывка.]{.ru}"
        length: 130–170
        model: "Во время сражения под Аустерлицем русские войска бегут. Старый Кутузов в отчаянии показывает князю Андрею на бегущий батальон. Болконский хватает упавшее знамя и бежит вперёд, думая, что пришла минута его славы. Солдаты бегут за ним, но вдруг князь Андрей получает удар в голову и падает. Над ним только высокое тихое небо с серыми облаками. Он понимает, что всё, кроме этого неба, — пустое, и чувствует себя счастливым. Вечером он приходит в себя от сильной боли и снова ищет глазами небо. К нему подъезжает Наполеон, который объезжает поле сражения. Император говорит: «Вот прекрасная смерть», — но князь Андрей почти не слышит его. Наполеон, его прежний герой, кажется ему теперь маленьким и ничтожным по сравнению с небом. Раненого уносят. Позже Наполеон снова обращается к нему, но князь Андрей молчит: он думает о ничтожности величия, жизни и смерти."
        rubric: ["写出冲锋、负伤、看见天空", "写出拿破仑出现、安德烈对他的态度变化", "写出结尾的沉默和关于渺小的思考", "130—170 词"]
        notes: "范文 133 词。这一段的概要要兼顾“外部事件”和“内心变化”两条线。可以用现在时叙述，使节奏紧凑。法语对话只保留一句，用俄语转述。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评：“奥斯特里茨的天空对安德烈意味着什么？”可以联系全书内容，也可以谈你自己对“英雄”和“荣誉”的看法。
    items:
      - prompt: "[Что значит для князя Андрея «небо Аустерлица»? Напишите отзыв о прочитанном отрывке.]{.ru}"
        length: 250–300
        model: "Сцена под Аустерлицем — одна из самых известных в «Войне и мире». В ней почти нет действия: раненый человек лежит на земле и смотрит в небо. Но именно в эту минуту жизнь князя Андрея меняется.\n\nДо сражения Болконский мечтал о славе. Его героем был Наполеон, и он хотел, как Наполеон, одним подвигом стать великим. Поэтому, когда он хватает знамя и бежит вперёд, он думает только: «Вот оно!» Ему кажется, что пришла его минута.\n\nНо Толстой показывает, что настоящее открытие ждёт героя не в подвиге, а после него. Упав, князь Андрей видит небо — не ясное и не красивое, а высокое, тихое и бесконечное. Рядом с ним вся суета боя кажется пустой: люди бегут, кричат, дерутся, а облака спокойно ползут по небу. Герой понимает, что «всё пустое, всё обман, кроме этого бесконечного неба», и удивляется, как он не видал этого неба прежде.\n\nОсобенно сильна встреча с Наполеоном. Император стоит рядом и говорит красивые слова о «прекрасной смерти», но для князя Андрея они звучат как жужжание мухи. Великий человек вдруг становится маленьким и ничтожным, потому что его интересы — слава, победа, трофеи — ничего не стоят перед лицом неба и смерти.\n\nПо-моему, небо Аустерлица — это образ правды, которую человек видит, когда исчезает всё лишнее. Это не значит, что слава и подвиг совсем не нужны. Но Толстой напоминает, что настоящая жизнь — не в том, чтобы тебя хвалили, а в том, чтобы понять, что действительно важно. Недаром выражение «небо Аустерлица» стало крылатым: у многих людей бывает своя минута, когда они смотрят на свою жизнь совсем другими глазами. Эта сцена напоминает мне, что иногда нужно остановиться и посмотреть вверх."
        rubric: ["说明天空的象征意义（真理、永恒、与虚荣对立）", "写出安德烈前后的变化，以对荣誉的态度为线索", "引用选文中至少两处细节（“就是这个时刻”、苍蝇的嗡嗡声等）", "有个人的看法，250—300 词"]
        notes: "范文 260 词。结构：引子—战前的理想—天空的发现—与拿破仑的对照—个人看法与结论。注意不要把评论写成概要：每段都应该回答“这说明了什么”。[крылатое выражение]{.ru}（名言、成语）这个说法可以用在结尾。"
