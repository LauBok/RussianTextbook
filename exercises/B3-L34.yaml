lesson: B3-L34
grammar: "独立成分：名词后面的形动词短语用逗号隔开，名词前面的一般不隔开（兼有原因意义或说明人称代词时隔开）；带说明词的同位语和说明普通名词的专有名词用逗号隔开，句末可用破折号；形动词、同位语与被说明的名词同格。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Сколько солдат было в армии Наполеона? Почему русская армия отступала? Чем закончилось Бородинское сражение? Почему Кутузов решил оставить Москву? Что случилось с армией Наполеона после того, как она ушла из Москвы? Что можно увидеть в панораме «Бородинская битва»?]{.ru}"
        length: 80–110
        model: "Сколько солдат было в армии Наполеона, точно не известно: по разным оценкам, от 450 до 600 тысяч человек. Русская армия, уступавшая врагу в численности, отступала: Барклай-де-Толли боялся погубить армию в большом сражении у границы, хотя Багратион и многие офицеры хотели дать сражение. В Бородинском сражении ни одна из сторон не добилась полной победы, обе армии потеряли десятки тысяч человек. Кутузов решил оставить Москву без боя, чтобы сохранить армию. Армию Наполеона, страдавшую от голода и холода, постоянно атаковали русские войска и партизаны, и в декабре её остатки покинули Россию. В панораме «Бородинская битва» можно увидеть огромное полотно Франца Рубо, написанное к столетию сражения."
        rubric: ["六个问题都回答，事实与课文一致", "人数用“据不同估计”的说法，不写成确切数字", "至少一处独立的形动词短语，逗号和格正确"]
        notes: 第 1 题课文没有给确切的数字，回答时要保留 [по разным оценкам]{.ru}。第 3 题注意 [добиться чего]{.ru} 要求第二格：[не добилась полной победы]{.ru}。第 5 题 [армию, страдавшую…]{.ru}：[армию]{.ru} 是第四格，形动词也用第四格。

  - id: e2
    type: rewrite
    task: 把 [который]{.ru} 从句改成独立的形动词短语。
    example:
      cue: "Наполеон, который привык к быстрым победам, надеялся закончить войну за несколько недель."
      answer: "Наполеон, привыкший к быстрым победам, надеялся закончить войну за несколько недель."
    why: "[который]{.ru} 在从句里做主语时，换成主动形动词：过去时动词去掉 [-л]{.ru} 加 [-вш-]{.ru}（[продолжалась → продолжавшаяся]{.ru}，[-ся]{.ru} 动词后面保留 [-ся]{.ru}）；[который]{.ru} 做宾语时，换成被动形动词，从句的主语变成第五格（第 3 题 [который покинуло большинство жителей → покинутый большинством жителей]{.ru}）。形动词的性、数、格跟被说明的名词一致：第 2 题 [армию]{.ru} 是第四格，所以是 [страдавшую]{.ru}；第 4 题 [в Кремле]{.ru} 不影响形动词，被说明的是主语 [Наполеон]{.ru}。"
    items:
      - cue: "Битва, которая продолжалась весь день, была очень кровопролитной."
        accept: ["Битва, продолжавшаяся весь день, была очень кровопролитной."]
      - cue: "Партизаны атаковали армию, которая страдала от голода и холода."
        accept: ["Партизаны атаковали армию, страдавшую от голода и холода."]
      - cue: "Французы вошли в город, который покинуло большинство жителей."
        accept: ["Французы вошли в город, покинутый большинством жителей."]
      - cue: "Наполеон, который жил в Кремле, ждал ответа от Александра I."
        accept: ["Наполеон, живший в Кремле, ждал ответа от Александра I."]
      - cue: "Пожары, которые начались вечером, уничтожили большую часть города."
        accept: ["Пожары, начавшиеся вечером, уничтожили большую часть города."]

  - id: e3
    type: fill
    task: 把括号里的同位语变成适当的格。
    why: "同位语和被说明的名词同格，同位语自己的说明词格不变。第 1 题 [армия Наполеона]{.ru}，[Наполеона]{.ru} 第二格，同位语 [императора]{.ru} 也用第二格，[Франции]{.ru} 不变。第 2 题 [стал Михаил Кутузов]{.ru}，[Кутузов]{.ru} 第一格，同位语 [генерал]{.ru} 第一格。第 3 题 [о Денисе Давыдове]{.ru} 第六格，[гусаре]{.ru}。第 4 题 [Кутузову]{.ru} 第三格，[главнокомандующему]{.ru}，名词化的形容词按形容词变格。第 5 题 [о Лермонтове]{.ru} 第六格，[поэте]{.ru}；后面的形动词 [написавшем]{.ru} 也是第六格。最常见的错误是同位语一律用第一格。"
    items:
      - stem: "Армия Наполеона, ___ Франции, перешла Неман."
        hint: император
        accept: ["императора"]
      - stem: "Новым главнокомандующим стал Михаил Кутузов, опытный ___."
        hint: генерал
        accept: ["генерал"]
      - stem: "Мы много читали о Денисе Давыдове, ___ и поэте."
        hint: гусар
        accept: ["гусаре"]
      - stem: "Александр I дал Кутузову, новому ___, большую власть."
        hint: главнокомандующий
        accept: ["главнокомандующему"]
      - stem: "Студенты читали книгу о Лермонтове, ___, написавшем «Бородино»."
        hint: поэт
        accept: ["поэте"]

  - id: e4
    type: choice
    task: 选出标点正确的句子。
    why: "第 1 题形动词短语在名词后面，两边都要逗号；另外两句一句缺了短语后面的逗号，一句把逗号加在了短语中间。第 2 题形动词短语在名词前面，又没有原因意义，不用逗号。第 3 题带说明词的同位语 [император Франции]{.ru} 在名词后面，两边加逗号。第 4 题 [река Неман]{.ru} 是不独立的同位语，不加逗号。"
    items:
      - stem: "___"
        options: ["Битва, продолжавшаяся весь день стала кровопролитной.", "Битва, продолжавшаяся весь день, стала кровопролитной.", "Битва продолжавшаяся, весь день стала кровопролитной."]
        answer: "Битва, продолжавшаяся весь день, стала кровопролитной."
      - stem: "___"
        options: ["Спалённая пожаром Москва была отдана французам.", "Спалённая пожаром, Москва, была отдана французам.", "Спалённая, пожаром Москва была отдана французам."]
        answer: "Спалённая пожаром Москва была отдана французам."
      - stem: "___"
        options: ["Наполеон император Франции жил в Кремле.", "Наполеон, император Франции жил в Кремле.", "Наполеон, император Франции, жил в Кремле."]
        answer: "Наполеон, император Франции, жил в Кремле."
      - stem: "___"
        options: ["Армия перешла реку, Неман.", "Армия перешла реку Неман.", "Армия перешла, реку Неман."]
        answer: "Армия перешла реку Неман."

  - id: e5
    type: translate
    task: 翻译下列句子，用独立的形动词短语或同位语。
    items:
      - zh: 兵力不如敌人的俄军在撤退。
        accept: ["Русская армия, уступавшая врагу в численности, отступала.", "Уступавшая врагу в численности русская армия отступала.", "Русская армия, которая уступала врагу в численности, отступала.", "Русские войска, уступавшие врагу в численности, отступали.", "Русские войска, которые уступали врагу в численности, отступали."]
        rubric: ["[уступать кому в чём]{.ru}：[врагу]{.ru} 第三格，[в численности]{.ru}", "形动词短语在名词后用逗号隔开，在名词前不用"]
      - zh: 新的总司令是米哈伊尔·库图佐夫，一位经验丰富的将军。
        accept: ["Новым главнокомандующим стал Михаил Кутузов, опытный генерал.", "Новым главнокомандующим был назначен Михаил Кутузов, опытный генерал.", "Новым главнокомандующим стал Михаил Кутузов — опытный генерал.", "Новым главнокомандующим был назначен Михаил Кутузов — опытный генерал."]
        rubric: ["[стать кем]{.ru} 用第五格 [главнокомандующим]{.ru}", "同位语 [опытный генерал]{.ru} 与 [Кутузов]{.ru} 同为第一格，用逗号或破折号隔开", "述位 [Михаил Кутузов]{.ru} 放在动词后面"]
      - zh: 法军进入了大多数居民已经离开的城市。
        accept: ["Французы вошли в город, покинутый большинством жителей.", "Французская армия вошла в город, покинутый большинством жителей.", "Французы вошли в город, который покинуло большинство жителей."]
        rubric: ["被动形动词 [покинутый]{.ru} 与 [город]{.ru} 同为第四格", "动作发出者 [большинством жителей]{.ru} 用第五格"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述 1812 年战争的经过。
    items:
      - prompt: "按时间顺序写一段话：6 月拿破仑越过涅曼河；俄军撤退与库图佐夫的任命；博罗季诺会战；放弃莫斯科与大火；拿破仑撤退；12 月战争结束。至少用三处独立的形动词短语和两处独立的同位语。"
        length: 150–200
        model: "В июне 1812 года огромная армия Наполеона, императора Франции, перешла Неман. Русская армия, уступавшая врагу в численности, отступала. В августе главнокомандующим стал Михаил Кутузов, ученик Суворова. Его назначение встретили в армии с радостью. 26 августа у села Бородино произошло сражение, продолжавшееся весь день. Обе армии потеряли десятки тысяч человек, но ни одна из них не добилась полной победы. После сражения Кутузов собрал генералов на совет в деревне Фили. Мнения разделились, но главнокомандующий решил оставить Москву без боя, чтобы сохранить армию. 2 сентября французы вошли в город, покинутый большинством жителей. В тот же вечер начались пожары, уничтожившие большую часть Москвы. Наполеон, живший в Кремле, ждал, что Александр I предложит ему мир, но ответа не было. В октябре французская армия, оставшаяся без продовольствия, ушла из Москвы. Отступление, начавшееся осенью, продолжалось и зимой, и солдаты страдали от голода и холода. Их постоянно атаковали русские войска и партизаны. Одним из командиров партизан был Денис Давыдов, гусар и поэт. В декабре остатки армии Наполеона покинули Россию. Война, длившаяся около полугода, закончилась."
        rubric: ["六个阶段都写到，顺序正确，日期准确", "至少三处独立的形动词短语，逗号和格正确", "至少两处独立的同位语，与被说明的名词同格", "每句以时间状语开头，主要事件用谓语，背景放进独立成分", "150–200 词"]
        notes: "范文约 165 词。每个阶段的主要事件用谓语表达（[перешла]{.ru}、[отступала]{.ru}、[произошло сражение]{.ru}、[вошли]{.ru}、[ушла]{.ru}、[покинули]{.ru}），背景和原因放进形动词短语（[уступавшая врагу в численности]{.ru}、[оставшаяся без продовольствия]{.ru}、[начавшееся осенью]{.ru}）。同位语用来介绍人物：[Наполеона, императора Франции]{.ru}（第二格）、[Михаил Кутузов, ученик Суворова]{.ru}、[Денис Давыдов, гусар и поэт]{.ru}。日期按课文用旧历，不必两个都写。"
