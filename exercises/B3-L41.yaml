lesson: B3-L41
grammar: "口语与书面语的对比：书面语用书面词语、动名词、形动词短语、插入语和完整的长句；口语用口语词、小名和爱称、不完全句、语气词（[же, вот, ну, уж, ведь]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как изменилась российская семья по сравнению с серединой прошлого века? Чем учёные объясняют эти перемены? Что такое материнский капитал? Какие традиции сохраняются? Когда вышла замуж Валентина Петровна? Почему её внучка не торопится выходить замуж? Где нужна книжная речь, а где разговорная?]{.ru}"
        length: 90–130
        model: "Во-первых, семья стала меньше: обычно в городской семье один или два ребёнка. Во-вторых, люди позже вступают в брак: сначала получают образование и находят работу. Учёные объясняют это тем, что жизнь в городах дорогая, жильё стоит немало, а женщины строят карьеру наравне с мужчинами. Материнский капитал — это деньги, которые государство выплачивает семье при рождении второго ребёнка; их можно потратить на жильё, образование детей или пенсию матери. Сохраняется связь между поколениями: бабушки и дедушки участвуют в воспитании внуков. Валентина Петровна вышла замуж в двадцать лет. Её внучка говорит, что сначала хочет сделать карьеру. Книжная речь нужна в статье, в докладе и в официальном письме, а разговорная — в общении близких людей."
        rubric: ["七个问题都回答，内容与课文一致", "回答用书面语的完整句子，不照搬瓦莲京娜的口语句式", "[вступать в брак]{.ru}、[участвовать в чём]{.ru} 等支配正确"]
        notes: 第 6 题课文里是直接引语，回答时改成间接引语：[Внучка говорит, что сначала хочет сделать карьеру]{.ru}。整组回答是书面语，所以 [бабуль]{.ru}、[садик]{.ru} 这类词不要搬进来。

  - id: e2
    type: choice
    task: 判断下列说法属于口语（[разговорная речь]{.ru}）还是书面语（[книжная речь]{.ru}）。
    why: "看词和句子结构。第 1 题有形动词短语 [имеющие]{.ru} 和书面词 [более]{.ru}，是书面语。第 2 题省去了动词，只剩第三格和第四格，是口语的省略。第 3 题 [вступать в брак]{.ru} 是书面说法，口语说 [пожениться]{.ru}、[свадьба]{.ru}。第 4 题有语气词 [ж]{.ru} 和附加问 [правда?]{.ru}，是口语。第 5 题 [оказывать поддержку]{.ru} 是书面语的“动词 + 动名词”组合。第 6 题小名 [Димка]{.ru}、口语词 [садик]{.ru}，是口语。"
    items:
      - stem: "«Семьи, имеющие трёх и более детей, называются многодетными» — это ___ речь."
        options: [разговорная, книжная]
        answer: книжная
      - stem: "«Я им пироги, а они мне: „Ещё!“» — это ___ речь."
        options: [разговорная, книжная]
        answer: разговорная
      - stem: "«Люди стали позже вступать в брак» — это ___ речь."
        options: [разговорная, книжная]
        answer: книжная
      - stem: "«Семья — это ж самое главное, правда?» — это ___ речь."
        options: [разговорная, книжная]
        answer: разговорная
      - stem: "«Государство оказывает поддержку многодетным семьям» — это ___ речь."
        options: [разговорная, книжная]
        answer: книжная
      - stem: "«Кто Димку из садика заберёт?» — это ___ речь."
        options: [разговорная, книжная]
        answer: разговорная

  - id: e3
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "这些动词的支配要记住。第 1 题 [состоять из]{.ru} + 第二格：[из родителей]{.ru}。第 2 题 [отличаться от]{.ru} + 第二格，[семья]{.ru} 单数第二格是 [семьи]{.ru}。第 3 题 [участвовать в]{.ru} + 第六格：[в воспитании]{.ru}。第 4 题 [оказывать что кому]{.ru}：受益者用第三格，[многодетные семьи]{.ru} 复数第三格是 [многодетным семьям]{.ru}。第 5 题 [называться]{.ru} 后面用第五格：[разговорной]{.ru}，容易误用第一格。"
    items:
      - stem: Обычная городская семья состоит из ___ и одного или двух детей.
        hint: родители
        accept: ["родителей"]
      - stem: Современная семья сильно отличается от ___ середины прошлого века.
        hint: семья
        accept: ["семьи"]
      - stem: Бабушки и дедушки участвуют в ___ детей.
        hint: воспитание
        accept: ["воспитании"]
      - stem: Государство оказывает поддержку ___.
        hint: многодетные семьи
        accept: ["многодетным семьям"]
      - stem: Речь, которая живёт в общении близких людей, называется ___.
        hint: разговорная
        accept: ["разговорной"]

  - id: e4
    type: rewrite
    task: 把口语句子改写成书面语：补全省去的成分，换掉口语词和小名，去掉语气词。
    example:
      cue: Через год Танька родилась, потом Серёжка.
      answer: Через год у них родилась дочь Татьяна, а затем сын Сергей.
    why: "改写分三步：补出省去的成分（动词、[лет]{.ru}），口语词换成书面词（[свадьба → вступили в брак]{.ru}，[садик → детский сад]{.ru}），去掉 [ну, вот, ж]{.ru} 一类语气词。第 1 题补出 [было … лет]{.ru}，年龄用第三格。第 2 题 [поженились]{.ru} 在书面语里换成 [вступили в брак]{.ru}，[после института]{.ru} 换成动名词 [после окончания института]{.ru}。第 3 题补出动词 [едут]{.ru}，[все]{.ru} 改成具体的人。第 4 题 [один, ну два]{.ru} 补成完整的句子，[у них]{.ru} 指的是现在的家庭，书面语里要说清楚。"
    items:
      - cue: Мне двадцать, Коле двадцать два.
        accept: ["Мне было двадцать лет, а Коле двадцать два.", "Мне было двадцать лет, а Коле — двадцать два года.", "Мне было двадцать лет, а Коле двадцать два года.", "Мне было двадцать лет, Коле было двадцать два года.", "Мне было двадцать лет, а Николаю двадцать два года."]
      - cue: Они поженились сразу после института.
        accept: ["Они вступили в брак сразу после окончания института.", "Сразу после окончания института они вступили в брак."]
      - cue: Летом все ко мне на дачу.
        accept: ["Летом дети и внуки приезжают ко мне на дачу.", "Летом все приезжают ко мне на дачу.", "Летом вся семья приезжает ко мне на дачу.", "Летом дети и внуки едут ко мне на дачу.", "Летом все едут ко мне на дачу."]
      - cue: Детей у них теперь мало. Один, ну два.
        accept: ["В современных семьях обычно один или два ребёнка.", "В современной семье обычно один или два ребёнка.", "Теперь в семьях обычно один или два ребёнка.", "Теперь в семье обычно один или два ребёнка.", "Сейчас в семьях обычно один или два ребёнка.", "Сейчас в семье обычно один или два ребёнка.", "В современных семьях мало детей: обычно один или два."]

  - id: e5
    type: translate
    task: 翻译下列句子，注意语体。
    items:
      - zh: （书面语）大多数俄罗斯人认为家庭是最重要的价值。
        accept: ["Большинство россиян считают семью главной ценностью.", "Большинство россиян считает семью главной ценностью.", "Большинство россиян считают, что семья — главная ценность.", "Большинство россиян считает, что семья — главная ценность.", "Большинство россиян считают, что семья — самая важная ценность.", "Большинство россиян считают семью самой важной ценностью.", "Большинство россиян считает семью самой важной ценностью."]
        rubric: ["[большинство россиян]{.ru}：[большинство]{.ru} + 复数第二格，谓语单复数都可以", "[считать кого-что кем-чем]{.ru}：[семью главной ценностью]{.ru}，第四格 + 第五格"]
      - zh: （书面语）现代家庭和上个世纪的家庭有很大不同。
        accept: ["Современная семья сильно отличается от семьи прошлого века.", "Современная семья очень отличается от семьи прошлого века.", "Современные семьи сильно отличаются от семей прошлого века."]
        rubric: ["[отличаться от]{.ru} + 第二格", "[прошлого века]{.ru} 作非一致定语，放在名词后面"]
      - zh: （口语）工作归工作，可没有家怎么行？
        accept: ["Работа работой, а без семьи куда?", "Работа работой, а без семьи никуда.", "Работа работой, а как без семьи?"]
        rubric: ["口语句式 [Работа работой, а…]{.ru}：第一格 + 同一名词第五格", "不要译成书面语的完整句"]
      - zh: （书面语）掌握一门语言，就是要懂得在什么场合用什么样的话。
        accept: ["Хорошо владеть языком — значит понимать, где какая речь уместна.", "Владеть языком — значит понимать, где какая речь уместна.", "Владеть языком — значит понимать, какая речь где уместна."]
        rubric: ["[владеть чем]{.ru}：第五格 [языком]{.ru}", "不定式 + [значит]{.ru} + 不定式，前面加破折号", "[где какая речь уместна]{.ru}：两个疑问词连用"]

  - id: e6
    type: open
    task: 应用文：为地方报纸的“我们的家庭”栏目写一篇书面语的人物介绍。
    items:
      - prompt: 根据瓦莲京娜·彼得罗夫娜的口述，用第三人称、书面语写一篇介绍她家庭的短文：结婚的年龄、孩子、她和孙辈的关系、她对家庭的看法。不用小名、语气词和不完全句，至少用一处形动词短语和一处插入语。
        length: 100–130
        model: "Валентина Петровна живёт в Твери. Она вступила в брак в двадцать лет, сразу после окончания учёбы. Её мужу, Николаю, было тогда двадцать два года. Через год у них родилась дочь Татьяна, а затем сын Сергей. Сама Валентина Петровна выросла в многодетной семье: у её матери было пятеро детей. Сегодня главное место в её жизни занимают внуки. Сын и невестка целый день работают, поэтому именно бабушка забирает внука Дмитрия из детского сада. Летом вся семья приезжает к ней на дачу. По мнению Валентины Петровны, семья — это главная ценность в жизни человека. Её внучка, получившая хорошее образование, считает, что сначала нужно сделать карьеру. Бабушка это понимает, но уверена, что без семьи счастья не бывает."
        rubric: ["第三人称、书面语：没有小名、语气词、不完全句", "信息与课文一致（结婚年龄、两个孩子、孙辈、看法）", "至少一处形动词短语（如 [получившая…]{.ru}）和一处插入语（[во-первых]{.ru}、[по мнению]{.ru} 等）", "100–130 词"]
        notes: 范文约 110 词。口述里的小名全部换成正式名字（[Коля → Николай]{.ru}、[Танька → Татьяна]{.ru}、[Димка → Дмитрий]{.ru}），省略句都补全（[мне двадцать → она вступила в брак в двадцать лет]{.ru}）。结构：人物和住地 → 家庭经历 → 现在的生活 → 她的看法。报纸人物介绍一般用现在时写现状，用过去时写经历；结尾转述人物的观点，用 [по мнению]{.ru}、[считает, что]{.ru}，不直接照搬口语引语。

  - id: e7
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [потратить что на что]{.ru}：用途用 [на]{.ru} + 第四格，[жильё]{.ru} 中性第四格与第一格同形。第 2 题 [наравне с]{.ru} + 第五格：[мужчинами]{.ru}。第 3 题 [заводить]{.ru} 在 [не спешат]{.ru} 后面用不定式。第 4 题节日名称里 [верность]{.ru} 用第二格 [верности]{.ru}，与 [семьи, любви]{.ru} 并列。第 5 题 [пока не]{.ru} 后面用完成体将来时：[встанут]{.ru}。"
    items:
      - stem: Материнский капитал можно потратить на ___.
        hint: жильё
        accept: ["жильё"]
      - stem: Женщины строят карьеру наравне с ___.
        hint: мужчины
        accept: ["мужчинами"]
      - stem: Молодые супруги не спешат ___ детей.
        hint: заводить
        accept: ["заводить"]
      - stem: 8 июля отмечается День семьи, любви и ___.
        hint: верность
        accept: ["верности"]
      - stem: Они не заводят детей, пока не ___ на ноги.
        hint: встать
        accept: ["встанут"]
