lesson: P8
grammar: "词末清化；清浊同化；字母表的顺序和字母名称。"
exercises:

  - id: e1
    type: choice
    task: 选出词中所给辅音的读音。
    why: "成对的浊辅音在词末读成清辅音：[хлеб]{.ru} 的 [б]{.ru} 读 [p]，[друг]{.ru} 的 [г]{.ru} 读 [k]。两个辅音相连时，前一个的清浊跟着后一个变：[ло́жка]{.ru} 的 [ж]{.ru} 在 [к]{.ru} 前读 [ʂ]，[всё]{.ru} 的 [в]{.ru} 在 [с]{.ru} 前读 [f]；反过来，[вокза́л]{.ru} 的 [к]{.ru} 在 [з]{.ru} 前读 [ɡ]，[футбо́л]{.ru} 的 [т]{.ru} 在 [б]{.ru} 前读 [d]。照字母读是最常见的错误。"
    items:
      - stem: "хлеб: б = ___"
        options: ["[b]", "[p]"]
        answer: "[p]"
      - stem: "го́род: д = ___"
        options: ["[d]", "[t]"]
        answer: "[t]"
      - stem: "друг: г = ___"
        options: ["[ɡ]", "[k]"]
        answer: "[k]"
      - stem: "ло́жка: ж = ___"
        options: ["[ʐ]", "[ʂ]"]
        answer: "[ʂ]"
      - stem: "всё: в = ___"
        options: ["[v]", "[f]"]
        answer: "[f]"
      - stem: "вокза́л: к = ___"
        options: ["[k]", "[ɡ]"]
        answer: "[ɡ]"
      - stem: "футбо́л: т = ___"
        options: ["[t]", "[d]"]
        answer: "[d]"
      - stem: "Москва́: с = ___"
        options: ["[s]", "[z]"]
        answer: "[s]"

  - id: e2
    type: fill
    task: 按字母表顺序写出下一个字母。
    why: "字母表的顺序要背熟，查词典时才不会耽误时间。容易记错的地方有：[ё]{.ru} 紧跟在 [е]{.ru} 后面，[й]{.ru} 紧跟在 [и]{.ru} 后面；[ъ]{.ru}、[ы]{.ru}、[ь]{.ru} 排在 [щ]{.ru} 和 [э]{.ru} 之间；[э]{.ru}、[ю]{.ru}、[я]{.ru} 是最后三个字母。"
    items:
      - stem: а, б, в, ___
        accept: [г]
      - stem: е, ё, ___
        accept: [ж]
      - stem: з, и, ___
        accept: [й]
      - stem: к, л, м, ___
        accept: [н]
      - stem: р, с, т, ___
        accept: [у]
      - stem: ш, щ, ъ, ___
        accept: [ы]
      - stem: э, ю, ___
        accept: [я]

  - id: e3
    type: choice
    task: 选出在词典里排在前面的词。
    why: "词典按字母表顺序排列：先比第一个字母，相同再比第二个，依此类推；一个词是另一个词的开头部分时，短的在前，所以 [мат]{.ru} 在 [мать]{.ru} 前，[час]{.ru} 在 [ча́шка]{.ru} 前。[э]{.ru}、[ю]{.ru}、[я]{.ru} 排在字母表最后，[ё]{.ru} 排在 [е]{.ru} 后面、[ж]{.ru} 前面。"
    items:
      - stem: "брат / дом: ___"
        options: [брат, дом]
        answer: брат
      - stem: "сок / нос: ___"
        options: [сок, нос]
        answer: нос
      - stem: "мать / мат: ___"
        options: [мать, мат]
        answer: мат
      - stem: "ча́шка / час: ___"
        options: [ча́шка, час]
        answer: час
      - stem: "юг / э́то: ___"
        options: [юг, э́то]
        answer: э́то
      - stem: "журна́л / ёлка: ___"
        options: [журна́л, ёлка]
        answer: ёлка

  - id: e4
    type: fill
    task: 根据读音写出单词。
    why: "清化和同化不改变拼写，听到的清辅音可能写成浊辅音字母，反之亦然。拿不准时，找一个让这个辅音处在元音前的词形：[хлеб]{.ru} — [хле́ба]{.ru}，[друг]{.ru} — [дру́га]{.ru}，[го́род]{.ru} — [города́]{.ru}，元音前就能听出原来的辅音。[всё]{.ru}、[вокза́л]{.ru}、[футбо́л]{.ru} 这类词要记住拼写。"
    items:
      - stem: "[xlʲep] → ___"
        accept: [хлеб]
      - stem: "[druk] → ___"
        accept: [друг]
      - stem: "[ˈɡorət] → ___"
        accept: [го́род]
      - stem: "[muʂ] → ___"
        accept: [муж]
      - stem: "[snʲek] → ___"
        accept: [снег]
      - stem: "[ˈɫoʂkə] → ___"
        accept: [ло́жка]
      - stem: "[fsʲo] → ___"
        accept: [всё]
      - stem: "[vɐɡˈzaɫ] → ___"
        accept: [вокза́л]
      - stem: "[fʊdˈboɫ] → ___"
        accept: [футбо́л]
