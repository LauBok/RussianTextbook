lesson: B4-L18
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的说法。
    items:
      - prompt: "[Что делала бабушка, когда мальчик проснулся? Какая она была внешне? Как она говорила? Почему мальчик пишет, что до неё он «как будто спал»? Что бабушка рассказывала на пароходе? Как вела себя мать во время путешествия? Как бабушка встретила Нижний?]{.ru}"
        length: 100–140
        model: "Когда мальчик проснулся, бабушка сидела рядом и чесала свои длинные чёрные волосы. Она была полная, почти горбатая, с тёмным лицом, рыхлым носом и тёмными, как вишни, глазами, но лицо её казалось молодым и светлым, а двигалась она легко и ловко, как большая кошка. Говорила она ласково, как будто пела, и её слова легко оставались в памяти. Мальчик пишет, что до неё он как будто спал, потому что она открыла ему мир и стала самым близким человеком на всю жизнь. На пароходе бабушка рассказывала сказки о разбойниках, святых людях и домовом, а матросы слушали её и смеялись. Мать всё время молчала и держалась в стороне. Увидев Нижний, бабушка радовалась, как ребёнок, и просила мать тоже порадоваться."
        rubric: ["七个问题都回答，事实与选文一致", "外貌至少写出三个细节", "说清“好像一直在睡”的意思：外祖母让他认识了世界", "写出母亲和外祖母的对照", "100–140 词"]
        notes: "答案在第 1 段（梳头）、第 6 段（外貌和说话方式）、第 7 段（“在她之前我好像一直在睡”）、第 15–18 段（故事）、第 25 段（母亲）和第 29–32 段（到达下诺夫哥罗德）。第 7 段的比喻不必照抄，可以说 [она открыла ему мир]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[бескорыстный]{.ru}"
        accept: ["Такой, который делает добро не для себя и не ради денег.", "Человек, который помогает другим и ничего не ждёт за это.", "Такой, который ничего не хочет получить для себя."]
        rubric: ["说明是不为自己、不图回报的"]
      - zh: "[ежеминутно]{.ru}"
        accept: ["Каждую минуту, очень часто.", "Очень часто, каждую минуту.", "Постоянно, каждую минуту."]
        rubric: ["说明是每分钟、时时刻刻"]
      - zh: "[диковинный]{.ru}"
        accept: ["Очень странный, необыкновенный.", "Необыкновенный, удивительный.", "Странный и удивительный."]
        rubric: ["说明是稀奇的、不寻常的"]
      - zh: "[скрытно]{.ru}"
        accept: ["Так, чтобы никто не видел.", "Тайно, так, чтобы другие не знали.", "Тайно."]
        rubric: ["说明是偷偷地、不让别人看见"]
      - zh: "[неприветливо]{.ru}"
        accept: ["Холодно, без улыбки.", "Холодно и строго."]
        rubric: ["说明是冷淡、不友好地"]
      - zh: "[ловко]{.ru}"
        accept: ["Быстро и умело.", "Легко и умело.", "Умело, легко и быстро."]
        rubric: ["说明是灵巧、熟练地"]

  - id: e3
    type: choice
    task: 外祖母的话里有许多口语和方言。选出与画线部分意思相同的标准说法。
    why: "第 1 题 [ино]{.ru} 是方言、旧词，“那么、那就”，外祖母顺着孩子的话说“那就别睡了”。第 2 题 [Ась?]{.ru} 是没听清时的应答，相当于 [Что?]{.ru}，不是叹气，也不是“是的”。第 3 题 [чай]{.ru} 在这里是口语插入语，“想必、大概”，和饮料没有关系。第 4 题 [-те]{.ru} 是方言语气词，等于标准语的 [-то]{.ru}，起强调作用，不表示“你们”，也不是复数词尾。第 5 题 [Айда]{.ru} 是口语，招呼别人一起去，相当于 [Пойдём]{.ru}。第 6 题 [богов]{.ru} 来自 [бог]{.ru}，表示赞叹：多么好的城市。"
    items:
      - stem: "«Ну, ино не спи» = «Ну, ___ не спи»."
        options: [тогда, никогда, ещё]
        answer: тогда
      - stem: "«Ась? — встрепенётся она» = «___ — встрепенётся она»."
        options: ["Что?", "Да!", "Ох!"]
        answer: "Что?"
      - stem: "«Варюша, погляди, чай, а?» Слово «чай» здесь значит ___."
        options: [наверное, "чай, который пьют", сейчас же]
        answer: наверное
      - stem: "«Церкви-те, гляди-ка ты, летят будто!» Частица «-те» здесь ___."
        options: ["то же, что «-то»", "то же, что «вы»", окончание множественного числа]
        answer: "то же, что «-то»"
      - stem: "«Айда ужинать с нами!» = «___ ужинать с нами!»"
        options: [Пойдём, Не хочешь, Перестань]
        answer: Пойдём
      - stem: "«Вот он какой, богов!» Бабушка хочет сказать, что Нижний ___."
        options: [очень красивый, очень старый, очень далеко]
        answer: очень красивый

  - id: e4
    type: rewrite
    task: 把外祖母的话改写成中性的标准语，去掉方言、语气词和民间说法，体会两种说法的差别。
    example:
      cue: Как это ты вчера бутыль-то раскокал?
      answer: Как ты вчера разбил бутылку?
    why: "第 1 题 [ино]{.ru} → [тогда]{.ru}。第 2 题语气词 [-то]{.ru} 只起强调作用，去掉即可；[гляди]{.ru} 口语，标准说法是 [смотри]{.ru}。第 3 题 [за шестой десяток лета-вёсны мои перекинулись-пошли]{.ru} 意思是“我已经五十多岁了”，成对词 [лета-вёсны]{.ru}、[перекинулись-пошли]{.ru} 在中性语体里不用。第 4 题插入语 [чай]{.ru}、[поди]{.ru} 换成 [наверное]{.ru}。改写以后意思没变，外祖母的性格和声音却消失了，这正说明方言在人物刻画中的作用。"
    items:
      - cue: Ну, ино не спи.
        accept: ["Ну, тогда не спи.", "Хорошо, тогда не спи.", "Тогда не спи."]
      - cue: Ты гляди, как хорошо-то!
        accept: ["Смотри, как хорошо!", "Посмотри, как хорошо!", "Ты посмотри, как хорошо!"]
      - cue: За шестой десяток лета-вёсны мои перекинулись-пошли.
        accept: ["Мне уже больше пятидесяти лет.", "Мне уже за пятьдесят.", "Мне уже больше пятидесяти."]
      - cue: Варюша, погляди, чай, а? Поди, забыла ведь!
        accept: ["Варюша, посмотри! Наверное, ты уже забыла!", "Варюша, посмотри, ты, наверное, забыла!", "Варюша, посмотри! Ты, наверное, забыла!"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右，用第三人称转述，不用直接引语。
    items:
      - prompt: "[Кратко перескажите отрывок.]{.ru}"
        length: 130–170
        model: "Маленький Алёша вместе с бабушкой и матерью плывёт на пароходе по Волге в Нижний. Проснувшись однажды утром, он видит, как бабушка с трудом чешет свои длинные чёрные волосы. Бабушка полная, почти горбатая, с тёмным лицом и рыхлым носом, но, когда она улыбается, лицо её становится молодым и светлым. Говорит она ласково, как будто поёт, и мальчик сразу запоминает её слова. Взрослый рассказчик вспоминает, что бабушка открыла ему мир и стала самым близким человеком на всю жизнь. Целые дни они проводят на палубе: бабушка любуется берегами Волги и рассказывает мальчику и матросам сказки. Мать всё время молчит и держится в стороне, а однажды строго говорит бабушке, что люди над ней смеются. Но бабушку это не волнует. Когда пароход подходит к Нижнему, она радуется, как ребёнок, и просит мать посмотреть на родной город. Мать только хмуро улыбается."
        rubric: ["按时间顺序：醒来—外祖母的样子—甲板上的日子—到达下诺夫哥罗德", "写出叙述者对外祖母的评价（“打开了世界”）", "写出母亲的沉默和外祖母的快乐的对照", "不用直接引语，把对话改成转述", "130–170 词"]
        notes: "范文约 150 词，用现在时转述，和选文中间部分的时态一致。外祖母的话都改成了转述：[говорит бабушке, что люди над ней смеются]{.ru}，[просит мать посмотреть]{.ru}。方言和语气词在概要里都不保留，第 7 段的比喻压缩成一句 [бабушка открыла ему мир]{.ru}。"

  - id: e6
    type: open
    task: 作文。以 [«Человек, который открыл мне мир»]{.ru} 为题，用俄语写一篇 250–300 词的短文，写一位对你影响很大的长辈或老师。至少引用他（她）说过的两句话，保留说话人的特点。
    items:
      - prompt: "[Человек, который открыл мне мир]{.ru}"
        length: 250–300
        model: "Когда я читал, как Горький пишет о своей бабушке, я всё время вспоминал своего дедушку. Он тоже открыл мне мир, хотя никогда не учился в университете и всю жизнь проработал на заводе.\n\nДедушка был невысокий, с большими рабочими руками и весёлыми глазами. Говорил он мало, но всегда как-то особенно, своими словами. Когда я плакал из-за плохой оценки, он клал мне руку на голову и говорил: «Ну что ты, внук! Плохая оценка — не беда, беда — когда учиться неинтересно». А когда я хвастался, что знаю больше всех в классе, он смеялся: «Умный человек не тот, кто много знает, а тот, кто много спрашивает».\n\nКаждое воскресенье мы с ним ходили в парк или на реку. Дедушка знал названия всех деревьев и птиц, умел по облакам сказать, какая будет погода, и рассказывал мне истории о своём детстве в деревне. Иногда эти истории были такие диковинные, что я не знал, верить ему или нет. Но слушать его было невыразимо приятно.\n\nИменно дедушка научил меня читать. Вечером он сажал меня рядом с собой, открывал старую книгу сказок и медленно, с удовольствием читал вслух, а потом просил: «А теперь ты». Так я начал любить книги, и эта любовь осталась со мной на всю жизнь.\n\nДедушки нет уже несколько лет. Но я часто слышу его голос, когда мне трудно или когда я начинаю слишком гордиться собой. Я думаю, что лучшее, что он мне дал, — это не знания, а интерес к жизни и бескорыстная любовь к людям и к миру."
        rubric: ["人物有外貌和性格的具体描写", "至少两句直接引语，体现人物说话的特点", "写清楚这个人怎样“打开了世界”：教会了什么、带来了什么变化", "结尾有今天的回望", "250–300 词"]
        notes: "范文约 270 词。开头借高尔基的选文引出人物；第二段外貌加说话方式，两句引语都带口语色彩（[Ну что ты, внук!]{.ru}），比第三人称描写更能显出人物；第三、四段写具体的事；最后一段回到现在，用 [бескорыстная любовь к людям и к миру]{.ru} 呼应选文第 7 段。描写人物说话时可以用选文里的说法：[говорил как-то особенно]{.ru}、[слушать его было невыразимо приятно]{.ru}。"
