lesson: L65
grammar: "形容词单数第五格（[-ым / -им]{.ru}，[-ой / -ей]{.ru}）；物主代词、指示代词单数第五格（[мои́м, мое́й, на́шим, э́тим]{.ru} 等）；[с]{.ru} 与 [со]{.ru}；第五格用法小结。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词组变成第五格。
    why: 形容词阳性、中性用 [-ым]{.ru}（[г、к、х、ж、ш]{.ru} 后用 [-им]{.ru}），阴性用 [-ой]{.ru}（[ж、ш、ч、щ]{.ru} 后不重读用 [-ей]{.ru}）。第 3 题 [кита́йский]{.ru} 写 [кита́йским]{.ru}，不写 [кита́йскым]{.ru}；第 5 题 [хоро́шая]{.ru} 写 [хоро́шей]{.ru}；第 6 题 [ста́рый]{.ru} 前要用 [со]{.ru}。
    items:
      - stem: Я познако́мился с ___.
        hint: ваш сын
        accept: [ва́шим сы́ном]
      - stem: Мы пьём чай с ___.
        hint: вишнёвое варе́нье
        accept: [вишнёвым варе́ньем]
      - stem: Он интересу́ется ___.
        hint: кита́йский язы́к
        accept: [кита́йским языко́м]
      - stem: Оле́г Петро́вич рабо́тает ___.
        hint: гла́вный инжене́р
        accept: [гла́вным инжене́ром]
      - stem: Ка́тя ста́ла ___.
        hint: хоро́шая арти́стка
        accept: [хоро́шей арти́сткой]
      - stem: Па́па разгова́ривает ___.
        hint: с + ста́рый друг
        accept: [со ста́рым дру́гом]
      - stem: А́нна сиди́т в кино́ с ___.
        hint: моя́ подру́га
        accept: [мое́й подру́гой]
      - stem: Оле́г Петро́вич ча́сто говори́т с ___.
        hint: наш дире́ктор
        accept: [на́шим дире́ктором]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 看名词的性：[сестра́]{.ru}、[ба́бушка]{.ru} 是阴性，用 [мое́й]{.ru}、[на́шей]{.ru}；[брат]{.ru}、[профе́ссор]{.ru} 是阳性，用 [мои́м]{.ru}、[на́шим]{.ru}。第 5 题 [его́]{.ru} 不变格。
    items:
      - stem: Я иду́ в кино́ с ___ сестро́й.
        options: [мои́м, мое́й]
        answer: мое́й
      - stem: Он говори́т с ___ бра́том.
        options: [твои́м, твое́й]
        answer: твои́м
      - stem: Мы рабо́тали с ___ профе́ссором.
        options: [на́шим, на́шей]
        answer: на́шим
      - stem: Ма́ма пьёт чай с ___ ба́бушкой.
        options: [на́шим, на́шей]
        answer: на́шей
      - stem: Я познако́мился с ___ сы́ном.
        options: [его́, им, ним]
        answer: его́

  - id: e3
    type: rewrite
    task: 按例句回答问题。
    placeholder: С …
    example:
      cue: С кем ты говори́л? (мой ста́рый друг)
      answer: С мои́м ста́рым дру́гом.
    why: 答句保留问句里的格：[с кем]{.ru}、[с чем]{.ru} 问，答句也用第五格。第 2 题 [мла́дший]{.ru} 的 [ш]{.ru} 后写 [-им]{.ru}；第 4 题 [вку́сный]{.ru}、[мясно́й]{.ru} 不能省略词尾。
    items:
      - cue: С кем ты идёшь в кино́? (моя́ сестра́)
        accept: [С мое́й сестро́й.]
      - cue: С кем ты игра́ешь в ша́хматы? (мой мла́дший брат)
        accept: [С мои́м мла́дшим бра́том.]
      - cue: С кем ты разгова́ривал? (наш но́вый преподава́тель)
        accept: [С на́шим но́вым преподава́телем.]
      - cue: С чем ты пьёшь чай? (вишнёвое варе́нье)
        accept: [С вишнёвым варе́ньем.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 2 题“请……喝茶”用 [угоща́ть]{.ru} + 第四格 + 第五格。第 3 题“当总工程师”用第五格，第 4 题的 [рад]{.ru} 随主语的性变化。
    items:
      - zh: 昨天我和我的老朋友谈了很久。
        accept: ["Вчера́ я до́лго разгова́ривал с мои́м ста́рым дру́гом.", "Вчера́ я до́лго говори́л с мои́м ста́рым дру́гом.", "Вчера́ я до́лго разгова́ривал со ста́рым дру́гом.", "Вчера́ я до́лго говори́л со ста́рым дру́гом.", "Вчера́ я до́лго разгова́ривала с мои́м ста́рым дру́гом.", "Вчера́ я до́лго говори́ла с мои́м ста́рым дру́гом."]
        rubric: ["[с мои́м ста́рым дру́гом]{.ru}，形容词和物主代词都用第五格", "[разгова́ривать]{.ru} 或 [говори́ть]{.ru} 用过去时"]
      - zh: 妈妈请客人喝樱桃果酱茶。
        accept: ["Ма́ма угоща́ет го́стя ча́ем с вишнёвым варе́ньем.", "Ма́ма угоща́ет на́шего го́стя ча́ем с вишнёвым варе́ньем."]
        rubric: ["[угоща́ть]{.ru} + 第四格 [го́стя]{.ru} + 第五格 [ча́ем]{.ru}", "[с вишнёвым варе́ньем]{.ru}"]
      - zh: 他在一家大工厂当总工程师。
        accept: ["Он рабо́тает гла́вным инжене́ром на большо́м заво́де.", "Он рабо́тает на большо́м заво́де гла́вным инжене́ром.", "На большо́м заво́де он рабо́тает гла́вным инжене́ром."]
        rubric: ["[гла́вным инжене́ром]{.ru} 第五格", "[на большо́м заво́де]{.ru} 第六格"]
      - zh: 我很高兴认识您的女儿。
        accept: ["Я бу́ду рад познако́миться с ва́шей до́черью.", "Я бу́ду ра́да познако́миться с ва́шей до́черью.", "Я рад познако́миться с ва́шей до́черью.", "Я ра́да познако́миться с ва́шей до́черью."]
        rubric: ["[с ва́шей до́черью]{.ru}：[дочь]{.ru} 第五格 [до́черью]{.ru}，物主代词用阴性 [ва́шей]{.ru}"]

  - id: e5
    type: open
    task: 缩写。
    items:
      - prompt: 按下列问题复述课文，连成一段话：[Кто тако́й Оле́г Петро́вич? Где он живёт и кем рабо́тает? Чем Мари́я Никола́евна угоща́ет го́стя? О ком вспомина́ют друзья́? Чем интересу́ется сын Оле́га Петро́вича?]{.ru}
        length: 50–80
        model: |
          Оле́г Петро́вич — ста́рый друг Ива́на Серге́евича. Они́ вме́сте учи́лись в институ́те. Тепе́рь он живёт в Новосиби́рске и рабо́тает гла́вным инжене́ром на большо́м заво́де. Ве́чером Петро́вы и гость сидя́т на ку́хне. Мари́я Никола́евна угоща́ет го́стя пирого́м с капу́стой и ча́ем с вишнёвым варе́ньем. Друзья́ вспомина́ют о ста́ром профе́ссоре, о Никола́е Ива́новиче. Сын Оле́га Петро́вича интересу́ется кита́йским языко́м и хо́чет стать перево́дчиком.
        rubric: ["回答全部五个问题", "至少三处形容词或物主代词第五格", "[рабо́тать]{.ru}、[стать]{.ru}、[интересова́ться]{.ru} 后用第五格"]
        notes: 按问题顺序作答。第二个问题的答句把“住在哪里”和“做什么”用 [и]{.ru} 连成一句；第三个问题要用 [угоща́ть]{.ru} + 第四格 + 第五格。第四个问题问 [о ком]{.ru}，答句可以直接说出教授的名字。
