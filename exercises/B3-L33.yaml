lesson: B3-L33
grammar: "插入语：表示确信与推测（[конечно]{.ru}、[пожалуй]{.ru}、[кажется]{.ru}）、消息来源（[как известно]{.ru}、[по преданию]{.ru}、[по мнению кого]{.ru}、[по-моему]{.ru}）、次序与联系（[во-первых]{.ru}、[кроме того]{.ru}、[впрочем]{.ru}）、情感（[к сожалению]{.ru}）；用逗号隔开；与同形的句子成分区分。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Чем Пётр занимался во время путешествия по Европе? Зачем России, по мнению царя, нужно было море? Что, по преданию, сделал Пётр в день основания города? Почему место для города было неудобным? Как Пётр менял привычки своих подданных? Почему Петербург называют «окном в Европу»?]{.ru}"
        length: 90–120
        model: "Во время путешествия по Европе Пётр работал плотником на верфях, изучал строительство кораблей, посещал заводы и музеи. По мнению царя, море было нужно России, чтобы изменить жизнь страны по европейскому образцу. По преданию, Пётр вырезал на острове два куска земли, положил их крестом и сказал: «Здесь быть городу». Место было неудобным: во-первых, земля была болотистой, во-вторых, Нева часто выходила из берегов, кроме того, климат здесь холодный и влажный. Пётр менял и привычки подданных: во-первых, велел дворянам брить бороды и носить европейское платье, во-вторых, перенёс Новый год на 1 января; кроме того, при нём появились первая газета, первый музей и Табель о рангах. Петербург называют «окном в Европу», потому что в поэме Пушкина Пётр думает, что здесь нужно «в Европу прорубить окно»."
        rubric: ["六个问题都回答，事实与课文一致", "第 3 题用 [по преданию]{.ru} 表明这是传说", "第 4 题用 [во-первых]{.ru}、[во-вторых]{.ru}、[кроме того]{.ru} 列举原因，插入语用逗号隔开"]
        notes: 第 3 题课文说历史学家没有找到证据，所以回答时要保留 [по преданию]{.ru}，不能当作事实来讲。第 4 题是练习列举类插入语的好机会，注意每个插入语后面都有逗号。

  - id: e2
    type: choice
    task: 选择最合适的插入语。
    why: "按插入语的意义选。第 1 题这件事来自传说，没有文件证实，用 [по преданию]{.ru}。第 2 题是大家都知道的事实，用 [как известно]{.ru}；[по-моему]{.ru} 只表示说话人个人的看法，不适合叙述公认的事实。第 3 题列举原因的第二项，用 [во-вторых]{.ru}。第 4 题前面说了一个普遍的说法，后面加以限制、补充，用 [впрочем]{.ru}（不过）。第 5 题转述沙皇本人的看法，用 [по мнению царя]{.ru}；[по-моему]{.ru} 是“我认为”。"
    items:
      - stem: "___, Пётр сам вырезал два куска земли и положил их крестом."
        options: ["По преданию", "Во-вторых", "К счастью"]
        answer: "По преданию"
      - stem: "___, Петербург был столицей России около двухсот лет."
        options: ["По-моему", "Как известно", "Во-первых"]
        answer: "Как известно"
      - stem: "Во-первых, земля здесь была болотистой. ___, Нева часто выходила из берегов."
        options: ["Наконец", "Во-вторых", "Впрочем"]
        answer: "Во-вторых"
      - stem: "Обычно считают, что столица переехала в 1712 году. ___, документа об этом нет."
        options: ["Впрочем", "Во-первых", "Конечно"]
        answer: "Впрочем"
      - stem: "Для этого России, ___, нужно было прежде всего море."
        options: ["по-моему", "по мнению царя", "к сожалению"]
        answer: "по мнению царя"

  - id: e3
    type: choice
    task: 判断引号里的词在句中是插入语还是句子成分。
    why: "能去掉而句子结构完整、意思基本不变的是插入语，要用逗号隔开。第 1 题 [кажется]{.ru} 去掉后句子完整，是插入语。第 2 题 [кажется]{.ru} 是谓语（[город кажется Петру раем]{.ru}“彼得觉得城市像天堂”），去掉后句子不完整。第 3 题 [наконец]{.ru} 意思是“终于”，是状语，不加逗号。第 4 题 [наконец]{.ru} 引出列举的最后一项，是插入语。第 5 题 [может быть]{.ru} 是谓语（[может быть правдой]{.ru}“可能是事实”）。"
    items:
      - stem: "Пётр, кажется, был в Англии. «кажется» — ___"
        options: ["插入语", "句子成分"]
        answer: "插入语"
      - stem: "Новый город кажется Петру настоящим раем. «кажется» — ___"
        options: ["插入语", "句子成分"]
        answer: "句子成分"
      - stem: "Через двадцать один год война наконец закончилась. «наконец» — ___"
        options: ["插入语", "句子成分"]
        answer: "句子成分"
      - stem: "Во-первых, земля была болотистой, во-вторых, Нева выходила из берегов, наконец, климат здесь холодный. «наконец» — ___"
        options: ["插入语", "句子成分"]
        answer: "插入语"
      - stem: "Эта история может быть правдой. «может быть» — ___"
        options: ["插入语", "句子成分"]
        answer: "句子成分"

  - id: e4
    type: rewrite
    task: 用括号里的插入语改写句子，注意逗号。
    example:
      cue: "Говорят, что Пётр сам вырезал два куска земли. (по преданию)"
      answer: "По преданию, Пётр сам вырезал два куска земли."
    why: "用插入语代替 [говорят, что]{.ru}、[все знают, что]{.ru}、[царь считал, что]{.ru} 这类主句，句子更紧凑：主句去掉，插入语放在句首，后面加逗号，从句变成独立的句子。第 1 题 [все знают, что → как известно]{.ru}。第 2 题 [Пётр считал, что → по мнению Петра]{.ru}，[мнение]{.ru} 后面用第二格 [Петра]{.ru}。第 3 题 [Пушкин писал, что → по словам Пушкина]{.ru}。第 4 题 [вероятно]{.ru} 代替 [возможно, что]{.ru}，表示推测。"
    items:
      - cue: "Все знают, что царь ехал не под своим именем. (как известно)"
        accept: ["Как известно, царь ехал не под своим именем."]
      - cue: "Пётр считал, что России нужно море. (по мнению Петра)"
        accept: ["По мнению Петра, России нужно море.", "По мнению Петра, России нужно было море."]
      - cue: "Пушкин писал, что здесь нужно в Европу прорубить окно. (по словам Пушкина)"
        accept: ["По словам Пушкина, здесь нужно в Европу прорубить окно.", "По словам Пушкина, здесь нужно прорубить окно в Европу."]
      - cue: "Возможно, что Пётр не говорил этих слов. (вероятно)"
        accept: ["Вероятно, Пётр не говорил этих слов."]

  - id: e5
    type: translate
    task: 翻译下列句子，用插入语。
    items:
      - zh: 据传说，彼得说过：“这里要建一座城市。”
        accept: ["По преданию, Пётр сказал: «Здесь быть городу».", "По преданию, Пётр сказал: «Здесь будет город»."]
        rubric: ["[по преданию]{.ru} 放句首，后面加逗号", "引语前用冒号，引语加引号"]
      - zh: 第一，这里的土地多沼泽；第二，涅瓦河经常泛滥。
        accept: ["Во-первых, земля здесь была болотистой, во-вторых, Нева часто выходила из берегов.", "Во-первых, земля здесь болотистая, во-вторых, Нева часто выходит из берегов.", "Во-первых, земля здесь была болотистой; во-вторых, Нева часто выходила из берегов."]
        rubric: ["[во-первых]{.ru}、[во-вторых]{.ru} 后面加逗号", "[выходить из берегов]{.ru} 泛滥"]
      - zh: 在历史学家看来，这个故事大概是传说。
        accept: ["По мнению историков, эта история, вероятно, предание.", "По мнению историков, эта история, по-видимому, предание.", "По мнению историков, эта история, вероятно, только предание.", "По мнению историков, это, вероятно, предание.", "По мнению историков, это, по-видимому, предание."]
        rubric: ["[по мнению историков]{.ru}：别人的看法不能用 [по-моему]{.ru}", "[вероятно]{.ru} / [по-видимому]{.ru} 在句中，两边加逗号"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述圣彼得堡的建立和最初的历史。
    items:
      - prompt: "按时间顺序写一段话：1700 年北方战争开始；1703 年 5 月 16 日；建城的困难；1709 年；1712 年；1721 年。至少用四个插入语，其中要有表示消息来源的（[как известно]{.ru}、[по преданию]{.ru}、[по мнению кого]{.ru}）和表示次序的（[во-первых]{.ru}、[кроме того]{.ru}）。"
        length: 150–200
        model: "Пётр I хотел, чтобы Россия стала морской страной. По его мнению, без Балтийского моря страна не могла жить по европейскому образцу. Поэтому в 1700 году началась долгая война со Швецией. В 1703 году русская армия заняла устье Невы, и 16 мая на небольшом острове заложили крепость. Как известно, этот день считается днём основания Санкт-Петербурга. По преданию, царь сказал тогда: «Здесь быть городу». Строить город было очень трудно. Во-первых, земля здесь болотистая. Во-вторых, Нева часто выходила из берегов. Кроме того, климат здесь холодный и влажный. Тысячи строителей приехали сюда со всей России, и многие из них, к сожалению, умерли от болезней. Пётр очень любил свой новый город и называл его «парадизом». Он приглашал сюда архитекторов из Италии, Франции и Германии, и город строили по плану. В 1709 году русская армия разбила шведов под Полтавой, и с тех пор город был в безопасности. В 1712 году столица переехала из Москвы в Петербург. Наконец, в 1721 году война закончилась победой России, и Пётр стал первым российским императором."
        rubric: ["六个时间点都写到，顺序正确，年份准确", "至少四个插入语，逗号正确", "传说用 [по преданию]{.ru}，不当作事实叙述", "[по мнению кого]{.ru} 后面用第二格", "150–200 词"]
        notes: "范文约 165 词。开头两句交代原因（为什么要出海口），然后按年份推进。表示消息来源的插入语分清了三种信息：彼得本人的看法（[По его мнению]{.ru}）、公认的事实（[Как известно]{.ru}）、传说（[По преданию]{.ru}）。困难部分用 [Во-первых… Во-вторых… Кроме того…]{.ru} 列举。最后一个年份前用 [Наконец]{.ru}，这里它是插入语，表示叙述的最后一步，所以加逗号。"
