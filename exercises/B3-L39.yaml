lesson: B3-L39
grammar: "直接引语的四种标点格式；间接引语：陈述句用 [что]{.ru}，特殊问句保留疑问词，一般问句用 [ли]{.ru}，命令句用 [чтобы]{.ru} + 过去时形式，人称换成转述者的角度，时态不变；准直接引语：第三人称，保留原话语气，无引号、无引导词。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Что такое перестройка и гласность? Что произошло в Чернобыле в 1986 году? Что произошло 17 марта 1991 года? Что случилось 19–21 августа 1991 года? Какое соглашение подписали 8 декабря 1991 года? Что сказал Горбачёв 25 декабря?]{.ru}"
        length: 90–120
        model: "Перестройкой назвали новую политику Горбачёва, а гласность означала, что газеты и журналы могли писать о том, о чём раньше говорить было нельзя. В 1986 году произошла авария на Чернобыльской атомной электростанции: после взрыва реактора радиация распространилась на огромную территорию. 17 марта 1991 года прошёл референдум о сохранении СССР, и большинство участников голосования ответили «да». 19 августа объявили, что Горбачёв болен и что власть перешла к ГКЧП, но через три дня члены комитета были арестованы. 8 декабря руководители России, Украины и Белоруссии подписали соглашение, в котором говорилось, что СССР прекращает своё существование. 25 декабря Горбачёв сказал, что прекращает свою деятельность на посту Президента СССР."
        rubric: ["六个问题都回答，日期准确", "至少两处间接引语，人称和时态正确", "用完整的句子"]
        notes: 第 3、4、5 题都是转述别人的话，正好用间接引语。注意第 5 题：原话 [«Я прекращаю…»]{.ru} 变成 [сказал, что прекращает…]{.ru}，人称变成第三人称，时态仍是现在时，不改成过去时。

  - id: e2
    type: rewrite
    task: 把直接引语改成间接引语。
    example:
      cue: "Горбачёв заявил: «Стране нужны перемены»."
      answer: "Горбачёв заявил, что стране нужны перемены."
    why: "第 1 题陈述句用 [что]{.ru}，[я]{.ru} 变成 [он]{.ru}（也可以省去），[прекращаю → прекращает]{.ru}，时态不变。第 2 题有疑问词 [где]{.ru}，保留疑问词，不加 [что]{.ru}。第 3 题没有疑问词，用 [ли]{.ru}，[ли]{.ru} 放在被问的词 [болен]{.ru} 后面。第 4 题命令句用 [чтобы]{.ru} + 过去时形式，[вы]{.ru} 换成 [они]{.ru}：[чтобы они оставались]{.ru}。第 5 题原话是现在时 [не может]{.ru}，转述时保持现在时，不改成 [не мог]{.ru}。"
    items:
      - cue: "Горбачёв сказал: «Я прекращаю свою деятельность на посту Президента СССР»."
        accept: ["Горбачёв сказал, что он прекращает свою деятельность на посту Президента СССР.", "Горбачёв сказал, что прекращает свою деятельность на посту Президента СССР."]
      - cue: "Люди спрашивали: «Где Горбачёв?»"
        accept: ["Люди спрашивали, где Горбачёв."]
      - cue: "Люди спрашивали: «Президент болен?»"
        accept: ["Люди спрашивали, болен ли президент."]
      - cue: "Мама сказала детям: «Оставайтесь дома!»"
        accept: ["Мама сказала детям, чтобы они оставались дома."]
      - cue: "По радио объявили: «Президент не может работать»."
        accept: ["По радио объявили, что президент не может работать."]

  - id: e3
    type: choice
    task: 选出正确的间接引语。
    why: "第 1 题人称要换成第三人称，时态保持现在时：[что он болен]{.ru}；[был болен]{.ru} 意思变成“曾经病过”，[я болен]{.ru} 没换人称。第 2 题一般疑问句用 [ли]{.ru}，俄语不用 [если]{.ru} 引导间接问句，[что]{.ru} 会把问句变成陈述。第 3 题请求、命令用 [чтобы]{.ru} + 过去时形式 [пришли]{.ru}；[чтобы]{.ru} 后面不用将来时 [придут]{.ru}。第 4 题有疑问词 [почему]{.ru}，直接用它连接，不加 [ли]{.ru}，也不加 [что]{.ru}。"
    items:
      - stem: "«Я болен», — сказал он. → Он сказал, ___."
        options: ["что он болен", "что он был болен", "что я болен"]
        answer: "что он болен"
      - stem: "«Будут ли выборы?» → Все спрашивали, ___."
        options: ["если будут выборы", "будут ли выборы", "что будут выборы"]
        answer: "будут ли выборы"
      - stem: "«Приходите к Белому дому!» → Он попросил, ___ к Белому дому."
        options: ["чтобы люди пришли", "чтобы люди придут", "что люди придут"]
        answer: "чтобы люди пришли"
      - stem: "«Почему нет новостей?» → Люди не понимали, ___."
        options: ["почему нет новостей", "почему ли нет новостей", "что почему нет новостей"]
        answer: "почему нет новостей"

  - id: e4
    type: choice
    task: 判断破折号后面引出的那部分属于哪种引语。
    why: "第 1 题有引号和引导词 [сказал]{.ru}，是直接引语。第 2 题用 [что]{.ru} 连接，人称已换成第三人称，是间接引语。第 3 题问句没有引号，也没有“他们想”之类的引导词，表达的却是人物心里的疑问，是准直接引语。第 4 题用 [ли]{.ru} 连接的从句，是间接引语。"
    items:
      - stem: "Горбачёв сказал: «Я прекращаю свою деятельность». — «Я прекращаю свою деятельность» — ___"
        options: ["直接引语", "间接引语", "准直接引语"]
        answer: "直接引语"
      - stem: "Объявили, что президент болен. — «что президент болен» — ___"
        options: ["直接引语", "间接引语", "准直接引语"]
        answer: "间接引语"
      - stem: "Люди смотрели на экран. Почему нет новостей? — «Почему нет новостей?» — ___"
        options: ["直接引语", "间接引语", "准直接引语"]
        answer: "准直接引语"
      - stem: "Все спрашивали, будут ли стрелять. — «будут ли стрелять» — ___"
        options: ["直接引语", "间接引语", "准直接引语"]
        answer: "间接引语"

  - id: e5
    type: translate
    task: 翻译下列句子，注意直接引语和间接引语的标点、人称和时态。
    items:
      - zh: 戈尔巴乔夫宣布，国家需要变革。
        accept: ["Горбачёв заявил, что стране нужны перемены.", "Горбачёв сказал, что стране нужны перемены.", "Горбачёв объявил, что стране нужны перемены."]
        rubric: ["间接引语用 [что]{.ru}，前面加逗号", "时态保持现在时 [нужны]{.ru}", "[стране]{.ru} 第三格"]
      - zh: 人们不明白出了什么事，戈尔巴乔夫在哪儿。
        accept: ["Люди не понимали, что случилось и где Горбачёв.", "Люди не понимали, что произошло и где Горбачёв.", "Люди не понимали, что случилось и где находится Горбачёв."]
        rubric: ["特殊问句转述时保留疑问词 [что]{.ru}、[где]{.ru}", "两个同类从句用 [и]{.ru} 连接，[и]{.ru} 前不加逗号"]
      - zh: “我停止履行苏联总统的职务。”戈尔巴乔夫说。
        accept: ["«Я прекращаю свою деятельность на посту Президента СССР», — сказал Горбачёв."]
        rubric: ["作者的话在后：«P», — a.", "引号外先逗号再破折号，[сказал]{.ru} 小写"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述 1985—1991 年的事件。
    items:
      - prompt: "按时间顺序写一段话：1985 年；改革与公开性；1990 年的主权宣言；1991 年 3 月 17 日；8 月 19—21 日；12 月 8 日；12 月 25 日。至少用一处直接引语、三处间接引语（其中一处用 [ли]{.ru}），可以用一处准直接引语。对解体的评价只转述不同的看法。"
        length: 150–200
        model: "В 1985 году руководителем СССР стал Михаил Горбачёв. Он заявил, что стране нужны перемены, и начал перестройку. Благодаря гласности газеты стали писать о том, о чём раньше молчали. Но экономика работала всё хуже, а союзные республики хотели сами решать свою судьбу. В 1990 году они одна за другой приняли декларации о суверенитете. 17 марта 1991 года прошёл референдум, и большинство его участников ответили, что хотят сохранить СССР. 19 августа люди увидели по телевизору балет «Лебединое озеро». Что случилось? Где Горбачёв? Скоро объявили, что президент болен, а власть перешла к ГКЧП. Москвичи пришли к Белому дому, и через три дня комитет потерял власть. После этого многие спрашивали, сохранится ли Советский Союз. 8 декабря руководители России, Украины и Белоруссии подписали соглашение о том, что СССР прекращает своё существование. 25 декабря Горбачёв сказал: «Я прекращаю свою деятельность на посту Президента СССР». Одни считают эти события трагедией, другие — началом новой жизни для многих народов."
        rubric: ["七个时间点都写到，顺序正确，日期准确", "至少一处直接引语，标点正确", "至少三处间接引语，其中一处用 [ли]{.ru}；人称和时态正确", "评价只转述，叙述者不表态", "150–200 词"]
        notes: "范文约 180 词。间接引语四处：[заявил, что стране нужны перемены]{.ru}、[ответили, что хотят сохранить СССР]{.ru}、[объявили, что президент болен]{.ru}、[спрашивали, сохранится ли Советский Союз]{.ru}（一般疑问句，用 [ли]{.ru}）；直接引语一处，引的是戈尔巴乔夫讲话的原话；[Что случилось? Где Горбачёв?]{.ru} 是准直接引语，表现 8 月 19 日早晨人们的疑问。结尾用 [Одни … другие …]{.ru} 转述两种评价。"
