lesson: B3-L43
grammar: "科学语体：先下定义再讲分类和结构；下定义用 [X — это Y]{.ru}、[X является Y]{.ru}（第五格）、[X представляет собой Y]{.ru}（第四格）、[Под X понимается Y]{.ru}；讲结构用 [делится на]{.ru}、[включает]{.ru}、[состоит из]{.ru}、[относится к]{.ru}、[характеризуется]{.ru}；现在时表示恒常的事实，多用被动结构。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[На какие виды делится образование в России? Сколько лет продолжается обучение в школе и в каком возрасте оно начинается? Какие экзамены сдают учащиеся и когда? Что такое среднее профессиональное образование? Кто учится в вузе бесплатно? Какие черты научного стиля называет автор?]{.ru}"
        length: 80–120
        model: "Образование в России делится на общее, профессиональное и дополнительное. Обучение в школе продолжается одиннадцать лет и начинается в возрасте от шести с половиной до восьми лет. После 9 класса учащиеся сдают ОГЭ, а после 11 класса — ЕГЭ. Среднее профессиональное образование — это подготовка к профессии, которую дают колледжи и техникумы. Бесплатно учатся студенты, поступившие на бюджетные места; успешно сдавшие сессию получают стипендию. Автор называет такие черты научного стиля: определения, термины, конструкции, описывающие структуру явления, то, что в тексте нет слова «я» и оценочных слов, настоящее время и конструкции с глаголами на «-ся»."
        rubric: ["六个问题都回答，内容与课文一致", "[делится на]{.ru} + 第四格，[в возрасте от … до …]{.ru} 正确", "第 4 题用下定义的句式"]
        notes: 第 4 题本身就是下定义，可以用本课的任何一个句式：[… — это подготовка к профессии]{.ru}，或 [… представляет собой подготовку к профессии]{.ru}（第四格）。第 5 题至少答出三点。

  - id: e2
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "每个句式要求的格不同，这是本课的难点。第 1 题 [являться]{.ru} 后面用第五格：[обязательным]{.ru}。第 2 题 [представлять собой]{.ru} 后面用第四格：[подготовку]{.ru}，不是第五格。第 3 题 [под]{.ru} 在这里要求第五格：[под этим термином]{.ru}。第 4 题 [делиться на]{.ru} + 第四格，但这里前面有 [три]{.ru}，数词 [два, три, четыре]{.ru} 后面的名词用单数第二格：[на три уровня]{.ru}。第 5 题 [относиться к]{.ru} + 第三格：[к дополнительному образованию]{.ru}。第 6 题 [характеризоваться]{.ru} + 第五格：[точностью]{.ru}。"
    items:
      - stem: Дошкольное образование не является ___.
        hint: обязательный
        accept: ["обязательным"]
      - stem: Профессиональное образование представляет собой ___ к определённой профессии.
        hint: подготовка
        accept: ["подготовку"]
      - stem: Под ___ понимается обязательная проверка знаний.
        hint: этот термин
        accept: ["этим термином"]
      - stem: Школьное образование делится на три ___.
        hint: уровень
        accept: ["уровня"]
      - stem: Музыкальные школы относятся к ___.
        hint: дополнительное образование
        accept: ["дополнительному образованию"]
      - stem: Научный стиль характеризуется ___.
        hint: точность
        accept: ["точностью"]

  - id: e3
    type: rewrite
    task: 用括号里的句式改写定义，注意格的变化。
    example:
      cue: Образование — это процесс обучения и воспитания. (является)
      answer: Образование является процессом обучения и воспитания.
    why: "[— это]{.ru} 后面用第一格；[является]{.ru} 后面用第五格；[представляет собой]{.ru} 后面用第四格；[Под X понимается Y]{.ru} 中 X 用第五格，Y 保持第一格，[понимается]{.ru} 与 Y 一致。第 1 题 [подготовка → подготовку]{.ru}，阴性第四格。第 2 题 X 是 [ЕГЭ]{.ru}，[под]{.ru} 后面的缩写词不变格。第 3 题 [являться]{.ru} 要求第五格：[частью]{.ru}。第 4 题 [проверка знаний → проверку знаний]{.ru}。"
    items:
      - cue: Колледж — это подготовка к профессии. (представляет собой)
        accept: ["Колледж представляет собой подготовку к профессии."]
      - cue: ЕГЭ — это экзамен после 11 класса. (под … понимается)
        accept: ["Под ЕГЭ понимается экзамен после 11 класса."]
      - cue: Экзамены — важная часть системы образования. (являются)
        accept: ["Экзамены являются важной частью системы образования."]
      - cue: ОГЭ — это проверка знаний после 9 класса. (представляет собой)
        accept: ["ОГЭ представляет собой проверку знаний после 9 класса."]

  - id: e4
    type: choice
    task: 选择正确的词。
    why: "第 1 题部分作主语、整体作宾语，用 [составляют]{.ru}；[состоят]{.ru} 要求 [из]{.ru}，[включают]{.ru} 的主语应该是整体。第 2 题后面是第二格 [из нескольких разделов]{.ru}，只有 [состоит]{.ru} 能接 [из]{.ru}。第 3 题后面是 [к]{.ru} + 第三格，用 [относятся]{.ru}。第 4 题科学语体用现在时表示恒常的事实：[оцениваются]{.ru}；[оценивались]{.ru} 会理解成过去的情况；[оценивается]{.ru} 是单数，与复数主语 [знания]{.ru} 不一致。"
    items:
      - stem: Три уровня ___ школьное образование.
        options: [составляют, состоят, включают]
        answer: составляют
      - stem: Резюме ___ из нескольких разделов.
        options: [включает, состоит, составляет]
        answer: состоит
      - stem: К профессиональному образованию ___ среднее профессиональное и высшее.
        options: [делятся, относятся, являются]
        answer: относятся
      - stem: В российских школах знания учащихся ___ по пятибалльной шкале.
        options: [оценивались, оценивается, оцениваются]
        answer: оцениваются

  - id: e5
    type: translate
    task: 翻译下列句子，用科学语体。
    items:
      - zh: 普通教育包括四个阶段。
        accept: ["Общее образование включает четыре уровня.", "Общее образование включает в себя четыре уровня.", "Общее образование состоит из четырёх уровней."]
        rubric: ["[включать]{.ru} + 第四格，或 [состоять из]{.ru} + 第二格", "[четыре уровня]{.ru}：[четыре]{.ru} 后面用单数第二格"]
      - zh: 学前教育不是义务性的。
        accept: ["Дошкольное образование не является обязательным."]
        rubric: ["[являться]{.ru} + 第五格 [обязательным]{.ru}", "科学语体用 [не является]{.ru}，不用口语的 [не обязательно]{.ru}"]
      - zh: 知识按五分制评定。
        accept: ["Знания оцениваются по пятибалльной шкале.", "Знания учащихся оцениваются по пятибалльной шкале."]
        rubric: ["被动结构 [оцениваются]{.ru}，与复数 [знания]{.ru} 一致", "[по пятибалльной шкале]{.ru}：[по]{.ru} + 第三格"]
      - zh: 补充教育的特点是它不提供新的学历层次。
        accept: ["Дополнительное образование характеризуется тем, что оно не даёт нового уровня образования.", "Дополнительное образование характеризуется тем, что не даёт нового уровня образования."]
        rubric: ["[характеризоваться тем, что…]{.ru}", "否定句里 [нового уровня]{.ru} 用第二格"]

  - id: e6
    type: open
    task: 应用文：为俄语版的百科词条写一段说明，用科学语体介绍中国的教育体系（或你所在国家的教育体系）。
    items:
      - prompt: 先给“中国的学校教育”下定义，再说明它由哪些阶段组成、每个阶段几年、什么考试，最后说明高等教育包括哪些阶段。至少用三种本课的句式（下定义一种、讲结构两种），用现在时和被动结构，不用 [я]{.ru} 和评价性的词。
        length: 110–150
        model: "Школьное образование в Китае — это обучение детей в школе, которое продолжается двенадцать лет. Оно делится на три уровня: начальную школу, младшую среднюю школу и старшую среднюю школу. Обучение в начальной школе начинается в возрасте шести лет и продолжается шесть лет. Затем учащиеся три года учатся в младшей средней школе. Начальная и младшая средняя школа составляют обязательное образование, которое продолжается девять лет. После 9 класса учащиеся сдают экзамен, по результатам которого они поступают в старшую среднюю школу или в профессиональную школу. Обучение в старшей средней школе продолжается три года и заканчивается государственным экзаменом гаокао. Под гаокао понимается единый экзамен, по результатам которого выпускники поступают в вузы. Высшее образование включает бакалавриат, магистратуру и аспирантуру."
        rubric: ["结构：定义 → 阶段 → 考试 → 高等教育", "至少三种本课句式，格用得对（[делится на]{.ru} + 第四格，[составляют]{.ru}，[под … понимается]{.ru} 等）", "现在时，有被动结构或无人称说明，不用 [я]{.ru}、不用评价性的词", "110–150 词"]
        notes: 范文约 130 词。百科词条第一句就是定义，后面每句只讲一个事实。中国的“初中”“高中”可以译为 [младшая средняя школа]{.ru}、[старшая средняя школа]{.ru}；“高考”音译为 [гаокао]{.ru}，第一次出现时要用 [Под … понимается…]{.ru} 解释。“九年义务教育”可以说成 [обязательное образование, которое продолжается девять лет]{.ru}。[аспирантура]{.ru}（研究生阶段，博士）可以作为补充词使用。

  - id: e7
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [поступить на]{.ru} + 第四格：[на бюджетные места]{.ru}。第 2 题 [делиться на]{.ru} + 第四格，[два]{.ru} 后面用单数第二格 [семестра]{.ru}。第 3 题 [заканчиваться чем]{.ru}：第五格 [сессией]{.ru}。第 4 题被动意义的 [-ся]{.ru} 动词与主语 [диплом]{.ru} 一致，用单数 [выдаётся]{.ru}。"
    items:
      - stem: Бесплатно учатся студенты, поступившие на ___.
        hint: бюджетные места
        accept: ["бюджетные места"]
      - stem: Учебный год в вузе делится на два ___.
        hint: семестр
        accept: ["семестра"]
      - stem: Каждый семестр заканчивается ___.
        hint: сессия
        accept: ["сессией"]
      - stem: По окончании вуза выпускнику ___ диплом.
        hint: выдаваться
        accept: ["выдаётся"]
