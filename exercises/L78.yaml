lesson: L78
grammar: "数词 100–1000（[сто, две́сти, три́ста … ты́сяча]{.ru}）；数词后 [рубль / рубля́ / рубле́й]{.ru} 的选择；[Ско́лько сто́ит / сто́ят?]{.ru}"
exercises:

  - id: e1
    type: fill
    task: 用俄语写出数字。
    why: "200 是 [две́сти]{.ru}；300、400 加 [-ста]{.ru}（[три́ста, четы́реста]{.ru}）；500–900 加 [-сот]{.ru}，中间保留 [ь]{.ru}（[пятьсо́т, семьсо́т]{.ru}）。合成数词按位说出，中间不加 [и]{.ru}。最常见的错误是把 [две́сти]{.ru} 写成 [-ста]{.ru} 结尾，或者漏写 [пятьсо́т]{.ru} 中间的 [ь]{.ru}。"
    items:
      - stem: 200 — ___
        accept: ["две́сти"]
      - stem: 400 — ___
        accept: ["четы́реста"]
      - stem: 500 — ___
        accept: ["пятьсо́т"]
      - stem: 780 — ___
        accept: ["семьсо́т во́семьдесят"]
      - stem: 950 — ___
        accept: ["девятьсо́т пятьдеся́т"]
      - stem: 1000 — ___
        accept: ["ты́сяча"]

  - id: e2
    type: choice
    task: 选择 [рубль]{.ru} 的正确形式。
    why: 只看数词的最后一个词：[оди́н]{.ru} 后用 [рубль]{.ru}，[два, три, четы́ре]{.ru} 后用 [рубля́]{.ru}，其他数词和 [ты́сяча]{.ru} 后用 [рубле́й]{.ru}。第 4 题最后一个词是 [двена́дцать]{.ru}，不是 [два]{.ru}，所以用 [рубле́й]{.ru}，这里最容易错。
    items:
      - stem: сто оди́н ___
        options: [рубль, рубля́, рубле́й]
        answer: рубль
      - stem: две́сти три ___
        options: [рубль, рубля́, рубле́й]
        answer: рубля́
      - stem: три́ста ___
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й
      - stem: сто двена́дцать ___
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й
      - stem: пятьсо́т два́дцать четы́ре ___
        options: [рубль, рубля́, рубле́й]
        answer: рубля́
      - stem: ты́сяча ___
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й

  - id: e3
    type: rewrite
    task: 按例句问价钱并回答。
    example:
      cue: матрёшка / 400
      answer: — Ско́лько сто́ит матрёшка? — Четы́реста рубле́й.
    why: "一样东西用 [сто́ит]{.ru}，复数名词（[блины́, откры́тки, перча́тки]{.ru}）用 [сто́ят]{.ru}。价钱里 [рубль]{.ru} 的形式看最后一个数词：[три́ста два́дцать]{.ru} 后用 [рубле́й]{.ru}，[две́сти два]{.ru} 后用 [рубля́]{.ru}，[сто оди́н]{.ru} 后用 [рубль]{.ru}。"
    items:
      - cue: плато́к / 650
        accept: ["— Ско́лько сто́ит плато́к? — Шестьсо́т пятьдеся́т рубле́й."]
      - cue: блины́ / 320
        accept: ["— Ско́лько сто́ят блины́? — Три́ста два́дцать рубле́й."]
      - cue: ша́пка / 900
        accept: ["— Ско́лько сто́ит ша́пка? — Девятьсо́т рубле́й."]
      - cue: перча́тки / 702
        accept: ["— Ско́лько сто́ят перча́тки? — Семьсо́т два рубля́."]
      - cue: сувени́р / 101
        accept: ["— Ско́лько сто́ит сувени́р? — Сто оди́н рубль."]
      - cue: вино́ / 850
        accept: ["— Ско́лько сто́ит вино́? — Восемьсо́т пятьдеся́т рубле́й."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 注意 [сто́ит / сто́ят / сто́ил]{.ru} 和主语一致，以及数词后 [рубль]{.ru} 的形式。
    items:
      - zh: 这个套娃多少钱？——八百卢布。
        accept: ["— Ско́лько сто́ит э́та матрёшка? — Восемьсо́т рубле́й.", "— Ско́лько сто́ит э́та матрёшка? — Она́ сто́ит восемьсо́т рубле́й."]
        rubric: ["[Ско́лько сто́ит]{.ru}", "[восемьсо́т рубле́й]{.ru}，[рубле́й]{.ru} 用复数第二格"]
      - zh: 茶是二百卢布，薄饼是三百五十卢布。
        accept: ["Чай сто́ил две́сти рубле́й, блины́ — три́ста пятьдеся́т.", "Чай сто́ил две́сти рубле́й, а блины́ — три́ста пятьдеся́т рубле́й.", "Чай сто́ит две́сти рубле́й, блины́ — три́ста пятьдеся́т.", "Чай сто́ит две́сти рубле́й, а блины́ сто́ят три́ста пятьдеся́т рубле́й.", "Чай сто́ил две́сти рубле́й, а блины́ сто́или три́ста пятьдеся́т рубле́й.", "Чай сто́ил две́сти рубле́й, а блины́ — три́ста пятьдеся́т.", "Чай сто́ит две́сти рубле́й, а блины́ — три́ста пятьдеся́т.", "Чай сто́ит две́сти рубле́й, а блины́ — три́ста пятьдеся́т рубле́й.", "Чай сто́ил две́сти рубле́й, блины́ — три́ста пятьдеся́т рубле́й."]
        rubric: ["[две́сти]{.ru}、[три́ста пятьдеся́т]{.ru} 写对", "复数 [блины́]{.ru} 对应 [сто́ят / сто́или]{.ru}，可以用破折号省略动词"]
      - zh: 我该付多少钱？——九百五十卢布。
        accept: ["— Ско́лько с меня́? — Девятьсо́т пятьдеся́т рубле́й.", "— Ско́лько с меня́? — С вас девятьсо́т пятьдеся́т рубле́й.", "— Ско́лько мне плати́ть? — Девятьсо́т пятьдеся́т рубле́й."]
        rubric: ["固定说法 [Ско́лько с меня́?]{.ru}", "[девятьсо́т пятьдеся́т рубле́й]{.ru}"]
      - zh: 可以留一百卢布小费。
        accept: ["Мо́жно оста́вить сто рубле́й чаевы́х.", "Мо́жно оста́вить сто рубле́й на чай.", "Мо́жно оста́вить на чай сто рубле́й.", "На чай мо́жно оста́вить сто рубле́й."]
        rubric: ["[мо́жно]{.ru} 加完成体不定式 [оста́вить]{.ru}", "[сто рубле́й]{.ru}"]

  - id: e5
    type: open
    task: 情景对话：你在纪念品市场给家人买礼物，问价钱，试着还价，最后付钱。
    items:
      - prompt: 用上 [Ско́лько сто́ит / сто́ят…?]{.ru}、[Да́йте, пожа́луйста…]{.ru}、[Ско́лько с меня́?]{.ru}，价钱用 100–1000 之间的数。
        length: 60–90
        model: "— Скажи́те, пожа́луйста, ско́лько сто́ит э́тот плато́к?\n— Семьсо́т рубле́й.\n— Дорогова́то. А мо́жет быть, шестьсо́т?\n— Хорошо́, шестьсо́т пятьдеся́т.\n— А ско́лько сто́ят э́ти откры́тки?\n— Сто рубле́й.\n— Да́йте, пожа́луйста, плато́к и одну́ откры́тку. Ско́лько с меня́?\n— Семьсо́т пятьдеся́т рубле́й.\n— Вот, пожа́луйста. Спаси́бо!"
        rubric: ["[сто́ит]{.ru} 用于单数，[сто́ят]{.ru} 用于复数", "100–1000 的数词写对", "[рубль]{.ru} 的形式符合最后一个数词", "有讨价还价和付钱的话"]
        notes: 范文按买东西的顺序写：问价——嫌贵还价——再问另一样——说要买什么——问总价——付钱道谢。[плато́к]{.ru} 是单数，用 [сто́ит]{.ru}；[откры́тки]{.ru} 是复数，用 [сто́ят]{.ru}。总价 [семьсо́т пятьдеся́т]{.ru} 最后一个词是 [пятьдеся́т]{.ru}，所以用 [рубле́й]{.ru}。
