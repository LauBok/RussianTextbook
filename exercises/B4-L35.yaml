lesson: B4-L35
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Почему Павел Петрович уважает аристократов? Какой пример он приводит?]{.ru}"
        length: 40–70
        model: "Павел Петрович считает, что у настоящих аристократов развито чувство собственного достоинства и уважение к себе, а без этого у общества нет прочного основания. В пример он приводит английских аристократов: они не уступают своих прав, но и сами исполняют свои обязанности. По его словам, именно аристократия дала свободу Англии."
        rubric: ["说出自尊心是社会的基础", "说出英国贵族的例子：维护权利、履行义务"]
        notes: "答案在第 5 段和第 7 段。注意帕维尔自称 [человека либерального и любящего прогресс]{.ru}：他是一个崇拜英国的自由派贵族，而不是守旧派。"
      - prompt: "[Как Базаров отвечает на слова Павла Петровича о самоуважении?]{.ru}"
        length: 30–60
        model: "Базаров говорит, что от самоуважения Павла Петровича обществу нет никакой пользы: он уважает себя, но ничего не делает, сидит сложа руки. Если бы он себя не уважал, всё было бы так же. Для Базарова важно только то, что полезно."
        rubric: ["说出巴扎罗夫指责对方袖手旁观、无所作为", "指出巴扎罗夫的标准是“有用”"]
        notes: "第 8 段。巴扎罗夫没有反驳“自尊”本身，而是改变了讨论的标准：不问“对不对”，只问“有没有用”。"
      - prompt: "[Что отрицают Базаров и Аркадий? Что, по словам Николая Петровича, они забывают?]{.ru}"
        length: 30–60
        model: "Базаров и Аркадий — нигилисты. Они отрицают всё: авторитеты, принципы, искусство, поэзию и даже веру. Николай Петрович замечает, что они только разрушают, а ведь нужно и строить. Базаров отвечает, что строить — не их дело: сначала нужно расчистить место."
        rubric: ["说出“否定一切”，包括艺术、诗歌，甚至信仰", "说出尼古拉的反驳和巴扎罗夫的回答"]
        notes: "第 19—27 段。帕维尔 [страшно вымолвить]{.ru} 没有说出口的是宗教信仰，要从上下文推断出来。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[нигилист]{.ru}"
        accept: ["Человек, который ничего не признаёт и всё отрицает.", "Человек, который не признаёт никаких авторитетов и принципов."]
        rubric: ["说明是否定一切、不承认权威和原则的人"]
      - zh: "[сидеть сложа руки]{.ru}"
        accept: ["Ничего не делать.", "Сидеть без дела."]
        rubric: ["说明是什么也不做"]
      - zh: "[соотечественник]{.ru}"
        accept: ["Человек из той же страны.", "Человек, у которого с тобой одна родина.", "Человек одной с тобой страны."]
        rubric: ["说明是同一个国家的人"]
      - zh: "[авторитет]{.ru}"
        accept: ["Человек или идея, которым все верят и которых все уважают.", "Влияние и уважение, которые человек получает благодаря своим знаниям или опыту."]
        rubric: ["说明是受人尊敬和信任的人或思想，或这种影响力"]
      - zh: "[глушь]{.ru}"
        accept: ["Место далеко от городов, где мало людей.", "Далёкое и тихое место, где почти ничего не происходит."]
        rubric: ["说明是远离城市、偏僻的地方"]
      - zh: "[надменный]{.ru}"
        accept: ["Такой, кто считает себя лучше других.", "Такой, кто не уважает других и считает себя выше их."]
        rubric: ["说明是骄傲、看不起别人"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题 [милостивый государь]{.ru}、[изволите]{.ru}、[-с]{.ru} 都是旧式的客气说法，帕维尔用它们在争论中保持冷冰冰的距离。第 2 题作者在括号里说明：帕维尔故意这样说，学的是亚历山大时代权贵的习惯，意思是“我们是地道的俄罗斯人，可以不守学校的规矩”。第 3 题巴扎罗夫用“往嘴里放面包”这样的日常比喻，说明实际生活不需要抽象的逻辑。第 4 题 [— Всё? — Всё.]{.ru} 一问一答只有一个词，是争论的高潮，也就是最重要的地方。第 5 题作者把阿尔卡季比作棋手是讽刺：他只是重复朋友的话。第 6 题巴扎罗夫说自己的祖父耕过地，意思是农民更会把他当作自己人。"
    items:
      - stem: "Обращение «милостивый государь», которое повторяет Павел Петрович, звучит ___."
        options: ["холодно и вежливо", "по-дружески", "грубо"]
        answer: "холодно и вежливо"
      - stem: "Павел Петрович говорит «эфтим» и «эфто», потому что ___."
        options: ["говорит, как вельможи Александровского времени", "плохо знает русский язык", "так говорят в его деревне"]
        answer: "говорит, как вельможи Александровского времени"
      - stem: "Пример с куском хлеба Базаров приводит, чтобы показать, что ___."
        options: ["в жизни можно обойтись без логики", "он голоден", "крестьяне живут бедно"]
        answer: "в жизни можно обойтись без логики"
      - stem: "Самые короткие реплики — «Всё? — Всё.» — это ___ спора."
        options: ["самое важное место", "начало", "конец"]
        answer: "самое важное место"
      - stem: "Сравнение Аркадия с опытным шахматным игроком звучит ___."
        options: ["смешно", "восторженно", "грустно"]
        answer: "смешно"
      - stem: "Словами «Мой дед землю пахал» Базаров хочет сказать, что ___."
        options: ["он ближе к народу, чем Павел Петрович", "он сам любит работать в поле", "его дед был богатым помещиком"]
        answer: "он ближе к народу, чем Павел Петрович"

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形和支配关系。
    why: "第 1 题 [накинуться на кого]{.ru}，不定式作目的状语：[чтобы накинуться]{.ru}。第 2 题 [в присутствии кого]{.ru} 是固定说法，第六格 [присутствии]{.ru}。第 3 题 [пренебрегать чем]{.ru} 要求第五格：[правилами]{.ru}。第 4 题 [обходиться без чего]{.ru}，主语 [мы]{.ru}，现在时 [обходимся]{.ru}。第 5 题 [отрицать]{.ru} 第一变位，主语 [вы]{.ru}：[отрицаете]{.ru}。第 6 题 [уставиться на кого]{.ru}，完成体过去时阳性 [уставился]{.ru}。第 7 题 [признавать]{.ru} 现在时第一人称复数是 [признаём]{.ru}，词干 [-ва-]{.ru} 脱落，容易误写成 ~~[признаваем]{.ru}~~。"
    items:
      - stem: "Он ждал только предлога, чтобы ___ на врага."
        hint: накинуться
        accept: ["накинуться"]
      - stem: "Базаров говорил мало в ___ «старичков Кирсановых»."
        hint: присутствие
        accept: ["присутствии"]
      - stem: "Вельможам позволялось пренебрегать школьными ___."
        hint: правила
        accept: ["правилами"]
      - stem: "Да на что нам эта логика? Мы и без неё ___."
        hint: обходиться
        accept: ["обходимся"]
      - stem: "Вы всё ___, или, выражаясь точнее, вы всё разрушаете."
        hint: отрицать
        accept: ["отрицаете"]
      - stem: "Павел Петрович ___ на него: он этого не ожидал."
        hint: уставиться
        accept: ["уставился"]
      - stem: "Мы не ___ авторитетов."
        hint: признавать
        accept: ["признаём"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词。写清楚争论的起因、双方的主要观点和结果，可以用间接引语转述。
    items:
      - prompt: "[Напишите краткое изложение спора.]{.ru}"
        length: 130–170
        model: "Вечером за чаем Павел Петрович Кирсанов, который давно ждал случая начать спор с Базаровым, начинает его. Поводом становится слово «аристократишко», которым Базаров назвал одного соседа. Павел Петрович говорит, что уважает настоящих аристократов, например английских: у них развито чувство собственного достоинства, а на личности строится всё общество. Базаров отвечает, что от такого самоуважения нет пользы, если человек сидит сложа руки. Он смеётся над словами «аристократизм», «либерализм», «принципы» и говорит, что русскому человеку они не нужны. Он и его друзья действуют только так, как считают полезным, а полезнее всего сейчас отрицание. Они отрицают всё. Николай Петрович напоминает, что нужно и строить, но Базаров отвечает, что сначала надо расчистить место. Павел Петрович говорит, что Базаров не знает русского народа и идёт против него. Базаров отвечает, что его дед был крестьянином и что народ скорее признает своим его, а не Павла Петровича."
        rubric: ["写出争论的起因（“小贵族”一词）", "写出帕维尔的观点：自尊、原则、英国贵族", "写出巴扎罗夫的观点：有用、否定一切、先清理地方", "写出关于人民的最后交锋", "130—170 词，多用间接引语"]
        notes: "范文约 165 词。争论类文本的概要可以按“甲说—乙答”的顺序写，用 [говорит, отвечает, напоминает, смеётся над]{.ru} 等动词转述，避免照抄对话。帕维尔的长篇议论要概括成一两句。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评：“在这场争论中谁对？”表明你自己的看法，并用选文中的话作论据。
    items:
      - prompt: "[Кто прав в этом споре — Павел Петрович или Базаров? Напишите отзыв о прочитанном отрывке.]{.ru}"
        length: 250–300
        model: "Спор Павла Петровича и Базарова — одна из самых известных сцен русской литературы. С первого взгляда кажется, что побеждает Базаров: он говорит коротко и спокойно, а его противник волнуется, бледнеет и машет руками. Но, по-моему, ни один из них не прав до конца.\n\nПавел Петрович смешон своими привычками. Он говорит «эфтим» и «принсип», вставляет французские слова, повторяет «милостивый государь». Он много говорит об обязанностях, но сам живёт в деревне и ничего не делает. Базаров справедливо замечает, что от такого самоуважения обществу нет пользы. И всё-таки главная мысль Павла Петровича важна: без уважения к человеческой личности, без принципов общество действительно не может быть прочным.\n\nБазаров умнее и сильнее в споре. Он не боится говорить правду и смеётся над пустыми словами. Он ближе к народу: его дед пахал землю. Но его программа очень опасна. «Мы отрицаем всё», — говорит он, отрицая и искусство, и поэзию, и веру. А когда Николай Петрович спрашивает, кто же будет строить, Базаров отвечает: «Это уже не наше дело». Разрушать легко; трудно предложить что-то новое.\n\nТургенев, мне кажется, не стоит ни на одной стороне. Он показывает слабые места обоих героев: старого поколения, которое говорит красивые слова, но живёт праздно, и молодого, которое умеет только отрицать. Поэтому роман и вызвал такие горячие споры после выхода: каждый читатель видел в нём своё.\n\nЯ думаю, что этот спор интересен и сегодня. Он напоминает, что любой новой идее нужно отвечать не только на вопрос «что мы отрицаем?», но и на вопрос «что мы построим?»."
        rubric: ["表明自己的立场（可以支持一方，也可以认为双方各有道理）", "引用选文中至少三处原话或细节作论据", "注意作者的态度和写法（不偏不倚、讽刺）", "250—300 词，结构完整：引子—论证—结论"]
        notes: "范文约 290 词，持“双方都不完全对”的立场。也可以写支持一方的评论，但要回应对方最有力的论点（例如支持巴扎罗夫，就要回答“破坏之后建设什么”）。引用原话时注意用俄语引号 «…»。"
