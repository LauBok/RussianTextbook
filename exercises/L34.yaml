lesson: L34
grammar: "形容词单数第二格（[-ого]{.ru} / [-его]{.ru}，[-ой]{.ru} / [-ей]{.ru}）；物主代词、指示代词单数第二格（[моего́, мое́й, на́шего, на́шей, э́того, э́той]{.ru}）；[его́, её, их]{.ru} 不变。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词组变成第二格，填入空白。
    why: 阳性、中性形容词变 [-ого]{.ru} / [-его]{.ru}，阴性变 [-ой]{.ru} / [-ей]{.ru}。[ста́рший]{.ru}、[хоро́ший]{.ru} 的 [ш]{.ru} 后面不重读的 [о]{.ru} 写成 [е]{.ru}；[большо́й]{.ru} 重音在词尾，写 [о]{.ru}。第 5 题 [па́па]{.ru} 是阳性，代词用 [моего́]{.ru}，不用 [мое́й]{.ru}。
    items:
      - stem: Э́то дом ___.
        hint: мой ста́рший брат
        accept: [моего́ ста́ршего бра́та]
      - stem: Я студе́нтка ___.
        hint: медици́нский институ́т
        accept: [медици́нского институ́та]
      - stem: Вот фо́то ___.
        hint: весёлая соба́ка
        accept: [весёлой соба́ки]
      - stem: Э́то окно́ ___.
        hint: моя́ ко́мната
        accept: [мое́й ко́мнаты]
      - stem: Где маши́на ___?
        hint: мой па́па
        accept: [моего́ па́пы]
      - stem: Мы смо́трим альбо́м ___.
        hint: на́ша семья́
        accept: [на́шей семьи́]
      - stem: Э́то сад ___.
        hint: хоро́ший сосе́д
        accept: [хоро́шего сосе́да]
      - stem: Он студе́нт ___.
        hint: э́тот факульте́т
        accept: [э́того факульте́та]
      - stem: У ___ есть соба́ка.
        hint: на́ша ба́бушка
        accept: [на́шей ба́бушки]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 形容词、代词的形式由名词的性决定，不看名词的词尾。[де́душка]{.ru} 是阳性，用 [на́шего]{.ru}；[семья́]{.ru} 是阴性，用 [ва́шей]{.ru}。[его́]{.ru}、[её]{.ru}（他的、她的）不变，直接放在名词前面；[у неё]{.ru} 是“她那里、她有”，这里不合适。
    items:
      - stem: Э́то да́ча ___ де́душки.
        options: [на́шего, на́шей]
        answer: на́шего
      - stem: Где фо́то ___ семьи́?
        options: [ва́шего, ва́шей]
        answer: ва́шей
      - stem: Э́то ко́мната ___ сестры́.
        options: [её, у неё]
        answer: её
      - stem: Он сын ___ сосе́да.
        options: [ста́рого, ста́рой]
        answer: ста́рого
      - stem: Я подру́га ___ сестры́.
        options: [твоего́, твое́й]
        answer: твое́й

  - id: e3
    type: rewrite
    task: 按例句回答问题。
    placeholder: Э́то … + 第二格.
    example:
      cue: Чей э́то дом? (мой ста́рший брат)
      answer: Э́то дом моего́ ста́ршего бра́та.
    why: 名词词组整体变成第二格，形容词、代词和名词一起变，放在被修饰的名词后面。
    items:
      - cue: Чья э́то соба́ка? (наш сосе́д)
        accept: [Э́то соба́ка на́шего сосе́да.]
      - cue: Чья э́то кни́га? (моя́ подру́га)
        accept: [Э́то кни́га мое́й подру́ги.]
      - cue: Чьё э́то фо́то? (мой двою́родный брат)
        accept: [Э́то фо́то моего́ двою́родного бра́та.]
      - cue: Чей э́то сад? (на́ша ба́бушка)
        accept: [Э́то сад на́шей ба́бушки.]
      - cue: Чья э́то маши́на? (твой оте́ц)
        accept: [Э́то маши́на твоего́ отца́.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语“……的”放在名词前面，俄语第二格放在名词后面；形容词、物主代词随名词一起变成第二格。
    items:
      - zh: 这是我哥哥的照片。
        accept: ["Э́то фо́то моего́ ста́ршего бра́та."]
        rubric: ["“哥哥”译作 [ста́рший брат]{.ru}", "[моего́ ста́ршего бра́та]{.ru} 整体用第二格，放在 [фо́то]{.ru} 后面"]
      - zh: 卡佳是医学院的学生。
        accept: ["Ка́тя — студе́нтка медици́нского институ́та.", "Ка́тя студе́нтка медици́нского институ́та."]
        rubric: ["女大学生用 [студе́нтка]{.ru}", "[медици́нского институ́та]{.ru} 用第二格"]
      - zh: 我们的爷爷有一个很大的花园。
        accept: ["У на́шего де́душки большо́й сад.", "У на́шего де́душки есть большо́й сад."]
        rubric: ["[у на́шего де́душки]{.ru}：[де́душка]{.ru} 是阳性，代词用 [на́шего]{.ru}", "强调“大”时可以省去 [есть]{.ru}"]
      - zh: 安娜是我妹妹的朋友。
        accept: ["А́нна — подру́га мое́й мла́дшей сестры́.", "А́нна подру́га мое́й мла́дшей сестры́.", "А́нна — подру́га мое́й сестры́."]
        rubric: ["女性之间的朋友用 [подру́га]{.ru}", "[мое́й (мла́дшей) сестры́]{.ru} 用阴性第二格"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 你把一位朋友介绍给同学。编一段对话（6–8 句），说说朋友在哪里学习、住在哪里、有没有兄弟姐妹，至少用三次形容词或物主代词的第二格。
        length: 50–80
        model: |
          — Ли На, э́то Том, мой друг.
          — Приве́т!
          — Приве́т! Ты студе́нт филологи́ческого факульте́та?
          — Нет, я студе́нт медици́нского институ́та.
          — А где ты живёшь?
          — Я живу́ в кварти́ре моего́ ста́ршего бра́та. Вот фо́то на́шего до́ма.
          — Како́й большо́й дом! А сестра́ у тебя́ есть?
          — Нет, сестры́ нет. Но у мое́й ма́мы есть соба́ка. Вот фо́то её соба́ки!
        rubric: ["开头用 [э́то …, мой друг / моя́ подру́га]{.ru} 介绍", "至少三次正确使用形容词或物主代词第二格", "[его́, её]{.ru} 不变"]
        notes: 范文先介绍、互致问候，再一问一答谈学习、住处、家人，最后以一句感叹或看照片收尾。第二格出现在 [филологи́ческого факульте́та]{.ru}、[медици́нского институ́та]{.ru}、[моего́ ста́ршего бра́та]{.ru}、[на́шего до́ма]{.ru}、[мое́й ма́мы]{.ru}；[её соба́ки]{.ru} 中 [её]{.ru} 不变。
