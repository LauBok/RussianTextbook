lesson: B2-L03
grammar: "[мно́го, ма́ло, немно́го, не́сколько, ско́лько, сто́лько]{.ru} + 第二格：可数名词用复数第二格，不可数名词用单数第二格；[не́сколько]{.ru} 与 [немно́го]{.ru}；谓语用中性单数。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "能数的东西用复数第二格：[покупа́телей, я́блок, огурцо́в, фру́ктов]{.ru}；不能数的东西用单数第二格：[мёда, вре́мени, молока́, морко́ви]{.ru}。第 4 题 [вре́мя]{.ru} 的第二格是 [вре́мени]{.ru}。第 5 题 [огуре́ц]{.ru} 的 [е]{.ru} 脱落，词尾重读，写 [-о́в]{.ru}。第 7 题 [де́ньги]{.ru} 只有复数，复数第二格是零词尾加隐现元音：[де́нег]{.ru}。第 9 题 [килогра́мм]{.ru} 后面同样用第二格，[морко́вь]{.ru} 不可数，用单数。"
    items:
      - stem: На ры́нке мно́го ___.
        hint: покупа́тель
        accept: ["покупа́телей"]
      - stem: Ван Лэй купи́л немно́го ___.
        hint: мёд
        accept: ["мёда"]
      - stem: Ми́ше купи́ли мно́го ___.
        hint: я́блоко
        accept: ["я́блок"]
      - stem: У меня́ ма́ло ___.
        hint: вре́мя
        accept: ["вре́мени"]
      - stem: Возьмём не́сколько ___.
        hint: огуре́ц
        accept: ["огурцо́в"]
      - stem: В холоди́льнике ма́ло ___.
        hint: молоко́
        accept: ["молока́"]
      - stem: Ско́лько у тебя́ ___?
        hint: де́ньги
        accept: ["де́нег"]
      - stem: Зимо́й на ры́нке сто́лько ___!
        hint: фру́кты
        accept: ["фру́ктов"]
      - stem: Да́йте, пожа́луйста, килогра́мм ___.
        hint: морко́вь
        accept: ["морко́ви"]

  - id: e2
    type: choice
    task: 选择正确的词。
    why: "[не́сколько]{.ru}“几个”只和能数的名词连用（第 2 题 [дней]{.ru}、第 4 题 [сорто́в]{.ru}）；[са́хар, мёд, молоко́]{.ru} 不能数，只能说 [немно́го]{.ru}。第 5、6 题：[мно́го]{.ru} 加名词作主语，动词用中性单数 [бы́ло]{.ru}，不随后面的复数名词变。"
    items:
      - stem: Купи́, пожа́луйста, ___ са́хара.
        options: ["не́сколько", "немно́го"]
        answer: "немно́го"
      - stem: Ми́ша был на да́че ___ дней.
        options: ["не́сколько", "немно́го"]
        answer: "не́сколько"
      - stem: Попро́буй ___ мёда!
        options: ["не́сколько", "немно́го"]
        answer: "немно́го"
      - stem: Ван Лэй попро́бовал ___ сорто́в мёда.
        options: ["не́сколько", "немно́го"]
        answer: "не́сколько"
      - stem: На ры́нке ___ мно́го наро́ду.
        options: ["бы́ло", "бы́ли"]
        answer: "бы́ло"
      - stem: В на́шей гру́ппе ___ мно́го студе́нтов из Кита́я.
        options: ["бы́ло", "бы́ли"]
        answer: "бы́ло"

  - id: e3
    type: rewrite
    task: 按例句用括号里的词回答问题。
    example:
      cue: Ско́лько у тебя́ книг? (мно́го)
      answer: У меня́ мно́го книг.
    why: "回答时问句里的名词形式不变，只把 [ско́лько]{.ru} 换成括号里的词：[ско́лько]{.ru} 和 [мно́го, ма́ло, немно́го, не́сколько]{.ru} 要求的格相同。人称要按回答的人改：[у вас → у нас]{.ru}，[у тебя́ → у меня́]{.ru}，[ты был → я был]{.ru}。"
    items:
      - cue: Ско́лько у вас вре́мени? (ма́ло)
        accept: ["У нас ма́ло вре́мени."]
      - cue: Ско́лько на ры́нке наро́ду? (мно́го)
        accept: ["На ры́нке мно́го наро́ду.", "На ры́нке мно́го наро́да."]
      - cue: Ско́лько у Ми́ши я́блок? (мно́го)
        accept: ["У Ми́ши мно́го я́блок."]
      - cue: Ско́лько у тебя́ де́нег? (немно́го)
        accept: ["У меня́ немно́го де́нег."]
      - cue: Ско́лько дней ты был на да́че? (не́сколько)
        accept: ["Я был на да́че не́сколько дней.", "На да́че я был не́сколько дней.", "Я была́ на да́че не́сколько дней.", "На да́че я была́ не́сколько дней."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题 [наро́д]{.ru} 是集合名词，用单数第二格 [наро́ду]{.ru}（或 [наро́да]{.ru}）。第 2 题西红柿能数，用 [не́сколько помидо́ров]{.ru}。第 3、4 题时间、蜂蜜不能数，用单数第二格 [вре́мени, мёда]{.ru}；“一点儿”用 [немно́го]{.ru}，不能用 [не́сколько]{.ru}。第 5 题“这么多”是 [сто́лько]{.ru}。"
    items:
      - zh: 市场上人很多。
        accept: ["На ры́нке мно́го наро́ду.", "На ры́нке мно́го наро́да.", "На ры́нке мно́го люде́й."]
        rubric: ["[мно́го наро́ду / наро́да]{.ru}：单数第二格"]
      - zh: 请给我几个西红柿。
        accept: ["Да́йте, пожа́луйста, не́сколько помидо́ров.", "Да́йте не́сколько помидо́ров, пожа́луйста.", "Да́йте мне, пожа́луйста, не́сколько помидо́ров.", "Да́йте мне не́сколько помидо́ров, пожа́луйста.", "Пожа́луйста, да́йте не́сколько помидо́ров."]
        rubric: ["[не́сколько помидо́ров]{.ru}：复数第二格", "命令式 [да́йте]{.ru}"]
      - zh: 我时间很少。
        accept: ["У меня́ ма́ло вре́мени."]
        rubric: ["[ма́ло вре́мени]{.ru}：[вре́мя]{.ru} 的第二格"]
      - zh: 王磊买了一点儿蜂蜜。
        accept: ["Ван Лэй купи́л немно́го мёда."]
        rubric: ["[немно́го мёда]{.ru}：不可数名词用单数第二格", "[купи́л]{.ru}：完成体"]
      - zh: 冬天市场上有这么多水果！
        accept: ["Зимо́й на ры́нке сто́лько фру́ктов!", "На ры́нке зимо́й сто́лько фру́ктов!"]
        rubric: ["[сто́лько фру́ктов]{.ru}：复数第二格", "[зимо́й]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Заче́м Мари́я Никола́евна и Ван Лэй пошли́ на ры́нок? Почему́ Ван Лэй удиви́лся? Что они́ купи́ли? Почему́ Мари́я Никола́евна спеши́ла? Что спроси́л Ми́ша до́ма?]{.ru}"
        length: 50–80
        model: "Во вто́рник пра́здник, поэ́тому в суббо́ту Мари́я Никола́евна и Ван Лэй пошли́ на ры́нок: на́до бы́ло купи́ть проду́кты для пра́здничного у́жина. На ры́нке бы́ло мно́го наро́ду. Ван Лэй удиви́лся: на у́лице зима́, а там сто́лько овоще́й и фру́ктов! Они́ купи́ли мя́со, не́сколько помидо́ров, лук, морко́вь, не́сколько огурцо́в и мно́го я́блок для Ми́ши. Ван Лэй купи́л немно́го мёда. Мари́я Никола́евна спеши́ла, потому́ что в час у неё был бассе́йн. До́ма Ми́ша спроси́л, где торт."
        rubric: ["回答全部五个问题", "[мно́го наро́ду]{.ru}、[сто́лько овоще́й и фру́ктов]{.ru}、[не́сколько помидо́ров]{.ru}、[немно́го мёда]{.ru}：第二格用对", "[не́сколько]{.ru} 不能和 [мёд]{.ru} 连用"]
        notes: "范文约 80 词。第一句用 [поэ́тому]{.ru} 和冒号交代去市场的原因。购物清单用一句话列举，数量词按本课规则配第二格：能数的 [помидо́ров, огурцо́в, я́блок]{.ru} 用复数，[мёда]{.ru} 用单数；[лук, морко́вь]{.ru} 不说数量，直接用第四格。米沙的问话改成间接引语 [спроси́л, где торт]{.ru}。"
