lesson: B4-L09
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Сколько строф в стихотворении и на какие части его можно разделить по смыслу? Какие строки повторяются и что даёт этот повтор? Что лирический герой потерял в годы заточения и что к нему вернулось в конце?]{.ru}"
        length: 100–140
        model: "Стихотворение состоит из шести строф, каждая строфа — четверостишие. По смыслу его можно разделить на три части. В первой строфе лирический герой вспоминает первую встречу: перед ним явилась любимая женщина, как мимолётное видение. Во второй, третьей и четвёртой строфах говорится о том, что было после расставания. Сначала он ещё слышит её нежный голос и видит во сне её черты, потом проходят годы, прежние мечты исчезают, и в глуши, во мраке заточения, его дни тянутся без вдохновения и без любви. В пятой и шестой строфах происходит новая встреча и пробуждение души. Пятая строфа почти повторяет первую, поэтому у стихотворения кольцевая композиция: конец возвращает нас к началу. В четвёртой строфе герой потерял всё — божество, вдохновение, слёзы, жизнь и любовь, а в последней строфе всё это возвращается вновь. Это одно из самых известных произведений русской лирики о любви."
        rubric: ["说出六节、三个阶段（相遇—离别与幽禁—再次相遇）", "指出第 5 节重复第 1 节，构成环形结构", "第 3 题答出第 4 节失去、第 6 节复活的同一组词"]
        notes: "第 2 题的关键词是 [кольцевая композиция]{.ru}：重复不是简单的“再说一遍”，而是让结尾回到开头，突出“又一次”出现。第 3 题最好直接引用第 15–16 行和第 23–24 行的词，说明二者一一对应。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[мимолётный]{.ru}"
        accept: ["Очень короткий, быстро проходящий.", "Такой, который быстро проходит и исчезает.", "Короткий, который быстро проходит."]
        rubric: ["说明时间极短、很快消失"]
      - zh: "[вдохновение]{.ru}"
        accept: ["Состояние, когда человеку легко писать стихи, музыку или картины.", "Особое состояние, когда легко писать или работать.", "Сильное желание и силы создавать что-то новое."]
        rubric: ["说明是一种创作时精神高涨的状态"]
      - zh: "[глушь]{.ru}"
        accept: ["Место далеко от города, где живёт мало людей.", "Далёкое место, где мало людей.", "Место далеко от больших городов."]
        rubric: ["说明是偏远、人少的地方"]
      - zh: "[мятежный]{.ru}"
        accept: ["Бурный, полный тревоги.", "Не спокойный, бурный.", "Такой, который не может жить спокойно."]
        rubric: ["说明“不平静、动荡”的意思（本诗中不是“叛乱的”）"]
      - zh: "[настать]{.ru}"
        accept: ["Прийти, начаться.", "Наступить.", "Начаться, прийти о времени."]
        rubric: ["说明是（时刻、季节等）到来、开始"]
      - zh: "[сниться]{.ru}"
        accept: ["Видеться во сне.", "Появляться во сне.", "Быть во сне."]
        rubric: ["说明是在梦中出现；注意梦见的对象作主语"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题抑扬格的音步是“轻—重”，重音在每个音步的第二个音节。第 2 题 [Как мимолётное виденье]{.ru} 只有 [-лёт-]{.ru} 和 [-де́-]{.ru} 两个重音，第 1、3 音步都是虚重。第 3 题 [ты — красоты́]{.ru} 重音落在最后一个音节上，是阳性韵。第 4 题每节第 1、3 行和第 2、4 行押韵，是交叉韵。第 5 题第 19–20 行与第 3–4 行完全相同，第 18 行又重复了第 2 行的 [явилась ты]{.ru}，构成环形结构，第 6 节则对应第 4 节。第 6 题虚重是格律重音位置上的音节不重读；“格律轻位置上出现重音”是格外重音，正好相反。第 7 题 [шли]{.ru} 处在第 1 个音节，即第一音步的第一个（轻）音节上，所以是格外重音。"
    items:
      - stem: В четырёхстопном ямбе ударным является ___ слог каждой стопы.
        options: [первый, второй, третий]
        answer: второй
      - stem: В строке «Как мимолётное виденье» ___ ударения.
        options: [два, три, четыре]
        answer: два
      - stem: Рифма «ты — красоты» — ___.
        options: [мужская, женская]
        answer: мужская
      - stem: Во всех строфах рифма ___.
        options: [перекрёстная, только мужская, только женская]
        answer: перекрёстная
      - stem: Почти полностью повторяет первую строфу ___ строфа.
        options: [третья, пятая, шестая]
        answer: пятая
      - stem: Пиррихий — это ___.
        options: [безударный слог на месте ударения, ударный слог на безударном месте, лишний безударный слог в конце строки]
        answer: безударный слог на месте ударения
      - stem: В строке «Шли годы. Бурь порыв мятежный» слово «шли» стоит на ___ слоге первой стопы.
        options: [первом, втором]
        answer: первом

  - id: e4
    type: open
    task: 划分第 13–16 行的音步。用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，并写出虚重在第几音步。
    why: "全诗格律划分（/ 隔开音步，带重音符的是重读音节）：第 1 行 [я-по́ / мню-чу́д / но-е / мгно-ве́ / нье]{.ru .syl}，虚重在第 3 音步；第 2 行 [пе-ре / до-мно́й / я-ви́ / лась-ты]{.ru .syl}，第 1 音步；第 3 行 [как-ми / мо-лёт / но-е / ви-де́ / нье]{.ru .syl}，第 1、3 音步；第 4 行 [как-ге́ / ний-чи́ / стой-кра / со-ты́]{.ru .syl}，第 3 音步；第 5 行 [втом-ле́ / ньях-гру́ / сти-без / на-дёж / ной]{.ru .syl}，第 3 音步；第 6 行 [втре-во́ / гах-шу́м / ной-су / е-ты́]{.ru .syl}，第 3 音步；第 7 行 [зву-ча́л / мне-до́л / го-го́ / лос-не́ж / ный]{.ru .syl}，无虚重；第 8 行 [и-сни́ / лись-ми́ / лы-е / чер-ты́]{.ru .syl}，第 3 音步；第 9 行 [шли-го́ / ды-бурь / по-ры́в / мя-те́ж / ный]{.ru .syl}，无虚重，[шли]{.ru} 为格外重音；第 10 行 [рас-се́ / ял-пре́ж / ни-е / меч-ты́]{.ru .syl}，第 3 音步；第 11 行 [и-я / за-бы́л / твой-го́ / лос-не́ж / ный]{.ru .syl}，无虚重；第 12 行 [тво-и́ / не-бе́с / ны-е / чер-ты́]{.ru .syl}，第 3 音步；第 13 行 [вглу-ши́ / во-мра́ / ке-за / то-че́ / нья]{.ru .syl}，第 3 音步；第 14 行 [тя-ну́ / лись-ти́ / хо-дни / мо-и́]{.ru .syl}，无虚重；第 15 行 [без-бо / жест-ва́ / без-вдох / но-ве́ / нья]{.ru .syl}，第 1、3 音步；第 16 行 [без-слёз / без-жи́з / ни-без / люб-ви́]{.ru .syl}，第 3 音步；第 17 行 [ду-ше́ / на-ста́ / ло-про / буж-де́ / нье]{.ru .syl}，第 3 音步；第 18 行 [и-вот / о-пя́ть / я-ви́ / лась-ты]{.ru .syl}，无虚重；第 19、20 行同第 3、4 行；第 21 行 [и-се́рд / це-бьёт / ся-ву / по-е́ / нье]{.ru .syl}，第 3 音步；第 22 行 [и-для / не-го́ / вос-кре́с / ли-вновь]{.ru .syl}，第 1 音步；第 23 行 [и-бо / жест-во́ / и-вдох / но-ве́ / нье]{.ru .syl}，第 1、3 音步；第 24 行 [и-жизнь / и-слё / зы-и / лю-бо́вь]{.ru .syl}，第 3 音步。单音节的代词、名词、动词（[ты, я, дни, вот, вновь, жизнь]{.ru}）处在重音位置上时按重读计；前置词和连接词（[для, без, и]{.ru}）不重读。"
    items:
      - prompt: "[В глуши́, во мра́ке заточе́нья / Тяну́лись ти́хо дни мои́ / Без божества́, без вдохнове́нья, / Без слёз, без жи́зни, без любви́.]{.ru}"
        length: 4–8
        model: |-
          13: ∪ — / ∪ — / ∪ ∪ / ∪ — / ∪ (пиррихий в третьей стопе)

          14: ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

          15: ∪ ∪ / ∪ — / ∪ ∪ / ∪ — / ∪ (пиррихий в первой и третьей стопе)

          16: ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в третьей стопе)
        rubric: ["四行都是四音步抑扬格", "第 13、15 行末多一个轻音节（阴性韵），第 14、16 行以重音结尾（阳性韵）", "虚重位置：13 行第 3 音步，14 行无，15 行第 1、3 音步，16 行第 3 音步"]
        notes: "音节划分：[вглу-ши́ / во-мра́ / ке-за / то-че́ / нья]{.ru .syl}；[тя-ну́ / лись-ти́ / хо-дни / мо-и́]{.ru .syl}；[без-бо / жест-ва́ / без-вдох / но-ве́ / нья]{.ru .syl}；[без-слёз / без-жи́з / ни-без / люб-ви́]{.ru .syl}。第 14 行的 [дни]{.ru} 是单音节名词，处在第 6 个音节（重音位置）上，按重读计。第 15 行的 [без]{.ru} 是前置词，不重读，所以第 1 音步是虚重。"

  - id: e5
    type: fill
    task: 用括号里的词填空，注意词形。动词用过去时，只有第 4 题照原诗用现在时。
    why: "第 1 题 [в глуши]{.ru} 第六格，阴性名词 [глушь]{.ru} 在 [в]{.ru} 后重音移到词尾。第 2 题 [сниться кому]{.ru}，梦见的对象 [голос]{.ru} 作主语，阳性单数过去时 [снился]{.ru}。第 3 题主语 [весна]{.ru} 阴性，完成体过去时 [настала]{.ru}。第 4 题 [биться]{.ru} 第一变位，第三人称单数 [бьётся]{.ru}，不要写成 [бится]{.ru}。第 5 题主语 [девушка]{.ru} 阴性，[явиться кому]{.ru} 过去时 [явилась]{.ru}。第 6 题 [без]{.ru} 要求第二格：[без вдохновения]{.ru}。"
    items:
      - stem: Два года поэт прожил в ___, далеко от столицы.
        hint: глушь
        accept: ["глуши"]
      - stem: Ему долго ___ её нежный голос.
        hint: сниться
        accept: ["снился"]
      - stem: Наконец ___ весна.
        hint: настать
        accept: ["настала"]
      - stem: Сердце ___ в упоенье.
        hint: биться
        accept: ["бьётся"]
      - stem: Перед ним снова ___ та самая девушка.
        hint: явиться
        accept: ["явилась"]
      - stem: Без ___ он не мог написать ни строчки.
        hint: вдохновение
        accept: ["вдохновения", "вдохновенья"]

  - id: e6
    type: open
    task: 概要写作。用俄语散文把全诗的内容复述出来，150 词左右，按“相遇—离别—再次相遇”三个阶段写，用第三人称。
    items:
      - prompt: "[Перескажите содержание стихотворения прозой от третьего лица.]{.ru}"
        length: 130–170
        model: "Лирический герой вспоминает чудное мгновение: однажды перед ним явилась женщина, прекрасная, как мимолётное видение. Он не мог её забыть. Эта встреча была очень короткой, но осталась в его памяти на всю жизнь. Долгое время, в грусти и в шумной суете жизни, он слышал её нежный голос, а её милые черты снились ему по ночам. Но прошли годы. Бури жизни рассеяли прежние мечты, и герой забыл и голос, и черты этой женщины. Он оказался в глуши, далеко от друзей, и дни его тянулись тихо и пусто. В это время у него не было ни вдохновения, ни любви, ни слёз, ни настоящей жизни. И вот наступило пробуждение: та же женщина снова явилась перед ним, такая же прекрасная, как в первый раз. Сердце героя снова бьётся в упоенье. Всё, что он потерял, вернулось к нему: и вдохновение, и слёзы, и жизнь, и любовь."
        rubric: ["三个阶段齐全，顺序正确", "用第三人称、散文句式，不照抄诗句", "点出第 4 节和第 6 节的对应：失去的东西又回来了", "130–170 词"]
        notes: "范文约 140 词。诗句改写成散文时要恢复正常语序：[Бурь порыв мятежный рассеял прежние мечты]{.ru} 改成 [Бури жизни рассеяли прежние мечты]{.ru}；诗歌形式 [-енье]{.ru} 一般换成 [-ение]{.ru}，只有固定说法 [в упоенье]{.ru} 可以保留。结尾用 [и…, и…]{.ru} 呼应原诗。"

  - id: e7
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的短文。
    items:
      - prompt: "[«Чудное мгновенье»: встреча, которую я помню.]{.ru} 写一次让你难忘的相遇（人、地方、一本书或一段音乐都可以），说明它为什么重要，后来又怎样回到你的生活中。可以借用本课的词：[мгновение, вдохновение, явиться, сниться, вновь]{.ru}。"
        length: 250–300
        model: "У Пушкина есть строка, которую знает каждый русский: «Я помню чудное мгновенье». У каждого человека, наверное, есть такое мгновение. Моё было связано не с человеком, а с городом. Мне было пятнадцать лет, когда родители впервые взяли меня в Пекин. Был поздний вечер, мы вышли из метро на площадь, и передо мной вдруг явилось огромное тёмное небо, а под ним — старые красные стены и тысячи огней. Я остановился и долго не мог сказать ни слова. Это продолжалось, может быть, минуту, но мне показалось, что в эту минуту я понял, как велик мир и как мало я о нём знаю. После этой поездки я начал много читать по истории, учить иностранные языки и мечтать о путешествиях. Площадь с огнями долго снилась мне. Потом пришли обычные школьные годы: экзамены, суета, домашние задания. Я почти забыл то чувство. Мне казалось, что жизнь — это только уроки и оценки, и никакого вдохновения в ней нет. Но в прошлом году я поехал учиться в Москву. В первый же вечер я пришёл на Красную площадь. Снова был поздний вечер, снова — огни, старые стены и огромное небо. И вдруг ко мне вновь вернулось то самое чувство, которое я почувствовал в детстве. Я понял, что оно никуда не исчезало, а только ждало своего часа. Теперь я думаю, что такие мгновения — главное, что у нас есть. Они бывают редко и быстро проходят, но именно они дают нам силы жить и работать. Поэтому стихотворение Пушкина мне так близко: оно о том, что вдохновение может вернуться, даже если кажется, что оно потеряно навсегда."
        rubric: ["写清一次具体的相遇：时间、地点、当时的感受", "有“遗忘—重新找回”的变化，与本课诗歌的结构呼应", "至少用三个本课生词", "结尾说明这段经历的意义", "250–300 词"]
        notes: "范文约 250 词。结构仿照本课的诗：开头引用诗句点题；第一部分写初次相遇（[передо мной вдруг явилось…]{.ru}）；第二部分写日常生活把感受冲淡（[суета, я почти забыл]{.ru}）；第三部分写在另一个城市又找回它（[вновь вернулось]{.ru}）；最后一段回到普希金，总结意义。时间顺序清楚，段与段之间用 [после этой поездки, потом, но в прошлом году]{.ru} 过渡。"
