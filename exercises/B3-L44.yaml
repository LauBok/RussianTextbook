lesson: B3-L44
grammar: "新闻语体：消息按“倒金字塔”组织——标题、副标题、电头、导语（什么事、在哪里、什么时候）、细节、背景；语言中立，多用数字和名称、过去时完成体动词和被动结构（[завершено строительство]{.ru}、[метро было открыто]{.ru}）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Что произошло в Москве 1 марта 2023 года? Какова длина Большой кольцевой линии и сколько на ней станций? Какая главная задача новой линии? Когда открылось московское метро? Почему новостной текст сокращают с конца? На что ссылается журналист, если сведения получены не им самим?]{.ru}"
        length: 80–110
        model: "1 марта 2023 года в Москве открылись последние девять станций Большой кольцевой линии, и кольцо полностью замкнулось. Длина линии составляет 70 километров, на ней 31 станция. Главная задача линии — разгрузить центр: жителям не нужно ехать через центр, чтобы попасть в соседний район. Московское метро открылось в 1935 году. Новостной текст сокращают с конца, потому что самое важное сообщается в начале, а менее важное — в конце. Если сведения получены не самим журналистом, он ссылается на источник: официальный сайт, пресс-службу, информационное агентство или очевидцев."
        rubric: ["六个问题都回答，日期、数字准确", "[31 станция]{.ru}：数词与名词一致", "用完整的句子"]
        notes: 第 2 题注意 [31 станция]{.ru} 用单数第一格。第 5 题要答出“倒金字塔”的原则：重要的在前，次要的在后。

  - id: e2
    type: fill
    task: 把括号里的名词变成与数词相配的形式。
    why: "以 [один]{.ru} 结尾的数词（21、31、101，但 11 除外）后面用单数第一格：[31 станция]{.ru}。以 [два, три, четыре]{.ru} 结尾的数词（但 12–14 除外）后面用单数第二格：[22 станции]{.ru}、[3 участка]{.ru}。其余数词（5–20、25……）和以 0 结尾的数词后面用复数第二格：[9 станций]{.ru}、[70 километров]{.ru}、[13 станций]{.ru}。第 5 题 13 不是以 3 结尾的“三”，而是“十三”，用复数第二格。"
    items:
      - stem: На Большой кольцевой линии находится 31 ___.
        hint: станция
        accept: ["станция"]
      - stem: Длина линии составляет 70 ___.
        hint: километр
        accept: ["километров"]
      - stem: 1 марта открылись последние 9 ___.
        hint: станция
        accept: ["станций"]
      - stem: В этом году на линии открылись 3 новых ___.
        hint: участок
        accept: ["участка"]
      - stem: В 1935 году в метро было всего 13 ___.
        hint: станция
        accept: ["станций"]
      - stem: Сегодня в Москве открылись 22 ___.
        hint: станция
        accept: ["станции"]

  - id: e3
    type: rewrite
    task: 改写成新闻里常用的被动结构，不提动作的发出者。
    example:
      cue: Строители завершили строительство линии.
      answer: Строительство линии завершено.
    why: "完成体及物动词的宾语变成主语（第一格），动词变成短尾被动形动词，与新主语在性、数上一致；发出者 [строители]{.ru}、[город]{.ru} 不重要，省去。第 1 题 [станция]{.ru} 阴性 → [открыта]{.ru}。第 2 题 [метро]{.ru} 中性不变格 → [открыто]{.ru}，过去时加 [было]{.ru}。第 3 题 [участки]{.ru} 复数 → [построены]{.ru}。第 4 题未完成体动词没有常用的短尾被动形动词，用 [-ся]{.ru} 动词：[вводились]{.ru}。"
    items:
      - cue: Сегодня город открыл новую станцию.
        accept: ["Сегодня открыта новая станция.", "Сегодня новая станция открыта."]
      - cue: Метро открыли в 1935 году.
        accept: ["Метро было открыто в 1935 году.", "В 1935 году метро было открыто."]
      - cue: Строители построили два новых участка.
        accept: ["Построены два новых участка.", "Два новых участка построены."]
      - cue: Строители вводили новые участки один за другим.
        accept: ["Новые участки вводились один за другим."]

  - id: e4
    type: choice
    task: 选择适合新闻消息的说法。
    why: "第 1 题导语要回答“什么事、在哪里、什么时候”，只有第二个选项三者齐全；第一个是背景，第三个是个人感受。第 2 题新闻语体中立，不用带评价和感情的词：[прекрасная, к счастью]{.ru} 是评论和口语的说法。第 3 题标题要短而有力，说出最重要的事；第三个是解释说明，太长，第一个带口语语气。第 4 题报道已经发生的事用过去时完成体 [открылась]{.ru}；[открывалась]{.ru} 表示过程或反复，[откроется]{.ru} 是将来。"
    items:
      - stem: "Лид: ___"
        options: ["Московское метро было открыто в 1935 году.", "Сегодня в Москве открылись последние девять станций Большой кольцевой линии.", "Я давно ждал, когда откроют новые станции."]
        answer: Сегодня в Москве открылись последние девять станций Большой кольцевой линии.
      - stem: ___
        options: ["К счастью, прекрасная новая линия наконец открылась.", "Новая линия открылась 1 марта.", "Ну вот, линию наконец открыли!"]
        answer: Новая линия открылась 1 марта.
      - stem: "Заголовок: ___"
        options: ["Ура, кольцо готово!", "Большое кольцо замкнулось", "О том, как в Москве много лет строили новую линию метро и что из этого получилось"]
        answer: Большое кольцо замкнулось
      - stem: Вчера в городе ___ новая станция метро.
        options: [открывалась, открылась, откроется]
        answer: открылась

  - id: e5
    type: translate
    task: 翻译下列句子，用新闻语体。
    items:
      - zh: 新线路全长 70 公里。
        accept: ["Длина новой линии составляет 70 километров.", "Длина новой линии — 70 километров."]
        rubric: ["[составлять]{.ru} + 第四格报数字", "[70 километров]{.ru}：复数第二格"]
      - zh: 莫斯科地铁于 1935 年开通。
        accept: ["Московское метро было открыто в 1935 году.", "Московское метро открылось в 1935 году.", "Метро в Москве было открыто в 1935 году.", "Метро в Москве открылось в 1935 году."]
        rubric: ["被动结构 [было открыто]{.ru}（中性，与 [метро]{.ru} 一致），或 [открылось]{.ru}", "[в 1935 году]{.ru}：[в]{.ru} + 第六格"]
      - zh: 过去居民不得不经过市中心换乘。
        accept: ["Раньше жителям приходилось ехать через центр с пересадками.", "Раньше жителям приходилось делать пересадки в центре.", "Раньше жителям приходилось ездить через центр с пересадками."]
        rubric: ["无人称句 [кому приходилось + 不定式]{.ru}，[жителям]{.ru} 用第三格", "[через центр]{.ru}：[через]{.ru} + 第四格"]

  - id: e6
    type: open
    task: 应用文：写一则新闻消息。
    items:
      - prompt: 根据下面的材料，按“倒金字塔”写一则消息，要有标题、副标题、电头和导语。材料：你所在的城市（可以写 [в нашем городе]{.ru}）9 月 1 日开通了一条新的有轨电车线路（[трамвайная линия]{.ru}）；长 12 公里，14 个车站；连接火车站和大学城；乘客每天可节省约 20 分钟；第一批乘客早上 6 点上车；本市第一条有轨电车线路开通于 1950 年代。语言中立，至少用两处被动结构。
        length: 90–130
        model: "Новый трамвай соединил вокзал и университет. В городе открыта новая трамвайная линия. 1 сентября. Сегодня в нашем городе открылась новая трамвайная линия. Её длина составляет 12 километров, на ней находится 14 остановок. Линия соединяет железнодорожный вокзал с университетом. Первые пассажиры вошли в трамвай уже в 6 часов утра. Многие из них — студенты, которые теперь могут быстрее доехать до занятий. Раньше жителям приходилось ехать до университета с пересадкой. Теперь поездка займёт примерно на 20 минут меньше. Первая трамвайная линия в городе была открыта в 1950-е годы."
        rubric: ["有标题、副标题、电头（日期）和导语，导语回答什么事、在哪里、什么时候", "信息按重要性排列，背景放在最后", "数词与名词一致（[12 километров]{.ru}、[14 остановок]{.ru}）", "至少两处被动结构（[открыта]{.ru}、[была открыта]{.ru} 等），语言中立"]
        notes: "范文约 100 词。标题用过去时完成体的完整句，副标题用短尾被动形动词 [открыта]{.ru}，省去系词。导语一句话说清事件；第二、三句给数字；接着是第一批乘客和意义；最后一句是背景（本市第一条线路），删掉也不影响理解。[остановка]{.ru}（车站）是有轨电车和公共汽车的“站”，地铁的“站”是 [станция]{.ru}。消息只写材料里有的事实，不要自己添加数字。"

  - id: e7
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [оборудовать что чем]{.ru}：工具用第五格复数 [лифтами]{.ru}。第 2 题 [ссылаться на что]{.ru}：[на источник]{.ru}，第四格。第 3 题 [от кого требуется что]{.ru}：[от журналиста]{.ru}，第二格。第 4 题 [по данным]{.ru} 后面用第二格：[информационного агентства]{.ru}。"
    items:
      - stem: Новые станции оборудованы ___.
        hint: лифты
        accept: ["лифтами"]
      - stem: Журналист всегда ссылается на ___.
        hint: источник
        accept: ["источник"]
      - stem: От ___ требуются оперативность и достоверность.
        hint: журналист
        accept: ["журналиста"]
      - stem: По данным ___, станции открылись утром.
        hint: информационное агентство
        accept: ["информационного агентства"]
