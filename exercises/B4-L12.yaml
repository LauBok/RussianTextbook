lesson: B4-L12
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Где стоит берёза и чем она покрыта? Какие слова в стихотворении связаны с одеждой? Какие цвета есть в стихотворении? Что делает заря в последней строфе?]{.ru}"
        length: 90–130
        model: "Берёза стоит под окном у поэта. Зимой на ней лежит снег, и он блестит, как серебро. Во второй строфе поэт говорит, что на пушистых ветках снег висит, как кайма, кисти и бахрома. Эти слова связаны с одеждой: так украшают платки и шали. Поэтому берёза похожа на девушку в нарядном белом платке. В стихотворении всего три цвета: белый цвет снега и берёзы, серебряный и золотой. Белизна снега становится золотой, когда на неё падает солнечный свет, и снежинки горят, как в огне. В последней строфе заря, как живой человек, медленно и лениво обходит берёзу и снова обсыпает её ветки снегом, похожим на серебро."
        rubric: ["答出白桦在窗下、盖着雪", "列出与服饰有关的词：[кайма, кисти, бахрома]{.ru}", "答出白、银、金三种颜色", "说明朝霞被拟人化"]
        notes: "第 2 题是本课的重点：三个服饰词让白桦像一个穿盛装的姑娘。回答第 4 题时可以用 [как живой человек]{.ru} 说明拟人手法。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[бахрома]{.ru}"
        accept: ["Кисти, которыми украшают край платка или шали.", "Украшение по краю платка.", "Кисти на краю шали."]
        rubric: ["说明是衣物边上作装饰的穗子、线头"]
      - zh: "[сонный]{.ru}"
        accept: ["Такой, который хочет спать.", "Очень тихий и спокойный, как во сне.", "Полный сна, тихий."]
        rubric: ["说明“想睡的、沉睡的”，诗中引申为“寂静不动的”"]
      - zh: "[нарядный]{.ru}"
        accept: ["Красивый и праздничный.", "Красивый, праздничный.", "В праздничной одежде."]
        rubric: ["说明是穿得漂亮、有节日气氛的"]
      - zh: "[обсыпать]{.ru}"
        accept: ["Покрывать чем-то со всех сторон.", "Сыпать что-то на что-то со всех сторон.", "Покрывать снегом или чем-то другим."]
        rubric: ["说明是把（细碎的东西）撒满在……上"]
      - zh: "[частушка]{.ru}"
        accept: ["Короткая весёлая народная песня из четырёх строк.", "Короткая народная песня.", "Небольшая народная песня, обычно весёлая."]
        rubric: ["说明是俄罗斯民间的短歌，通常四行、诙谐"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题每行三个音步，“重—轻”，是三音步扬抑格。第 2 题扬抑格的格律重音在第 1、3、5 个音节，即单数音节。第 3 题全诗每行都只有两个重音，第 1 或第 2 音步总有一处虚重。第 4 题单数行不押韵，韵式是 XaXa。第 5 题不押韵的诗行叫 [холостая строка]{.ru}；阴性、阳性说的是韵的类型，不是押不押韵。第 6 题 [белая берёза]{.ru} 和 [синее море]{.ru} 一样是民歌中的固定修饰语。第 7 题 [точно серебром]{.ru} 用 [точно]{.ru} 连接两个事物，是比喻（明喻）。第 8 题 [кайма, кисти, бахрома]{.ru} 都是头巾、披肩上的装饰。第 9 题叶赛宁出生在梁赞省的农民家庭。第 10 题“白色的白桦”是民歌里的形象，来自民间文学。第 11 题朝霞“懒洋洋地绕着走”，像人一样行动，是拟人。"
    items:
      - stem: Стихотворение «Берёза» написано трёхстопным ___.
        options: [хореем, ямбом]
        answer: хореем
      - stem: В хорее ударение падает на ___ слоги.
        options: [нечётные, чётные]
        answer: нечётные
      - stem: В каждой строке стихотворения ___ ударения.
        options: [два, три, четыре]
        answer: два
      - stem: Первая и третья строки каждой строфы ___.
        options: [не рифмуются, рифмуются между собой, рифмуются со второй строкой]
        answer: не рифмуются
      - stem: Строка, которая ни с чем не рифмуется, называется ___.
        options: [холостой, женской, мужской]
        answer: холостой
      - stem: «Белая берёза» — это ___, обычный для народных песен.
        options: [постоянный эпитет, редкий эпитет, антитеза]
        answer: постоянный эпитет
      - stem: В строках «Принакрылась снегом, точно серебром» есть ___.
        options: [сравнение, аллитерация, антитеза]
        answer: сравнение
      - stem: Слова «кайма», «кисти», «бахрома» связаны с ___.
        options: [одеждой и украшениями, деревом и лесом, погодой]
        answer: одеждой и украшениями
      - stem: Есенин родился в ___ семье.
        options: [крестьянской, купеческой, городской]
        answer: крестьянской
      - stem: Образ белой берёзы пришёл в стихотворение из ___.
        options: [фольклора, древнегреческой мифологии, городской жизни]
        answer: фольклора
      - stem: Строки «А заря, лениво обходя кругом…» — пример ___.
        options: [олицетворения, рифмы, частушки]
        answer: олицетворения

  - id: e4
    type: open
    task: 划分第 13–16 行的音步。用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，写出虚重在第几音步。
    why: "全诗格律划分（三音步扬抑格，/ 隔开音步，带重音符的是重读音节）：第 1 行 [бе́-ла / я-бе / рё-за]{.ru .syl}，虚重在第 2 音步；第 2 行 [под-мо / и́м-ок / но́м]{.ru .syl}，第 1 音步；第 3 行 [при-на / кры́-лась / сне́-гом]{.ru .syl}，第 1 音步；第 4 行 [то́ч-но / се-ре / бро́м]{.ru .syl}，第 2 音步；第 5 行 [на-пу / ши́-стых / ве́т-ках]{.ru .syl}，第 1 音步；第 6 行 [сне́-жно / ю-кай / мо́й]{.ru .syl}，第 2 音步；第 7 行 [рас-пу / сти́-лись / ки́-сти]{.ru .syl}，第 1 音步；第 8 行 [бе́-лой / ба-хро / мо́й]{.ru .syl}，第 2 音步；第 9 行 [и-сто / и́т-бе / рё-за]{.ru .syl}，第 1 音步；第 10 行 [всо́н-ной / ти-ши / не́]{.ru .syl}，第 2 音步；第 11 行 [и-го / ря́т-сне / жи́н-ки]{.ru .syl}，第 1 音步；第 12 行 [взо-ло / то́м-ог / не́]{.ru .syl}，第 1 音步；第 13 行 [а-за / ря́-ле / ни́-во]{.ru .syl}，第 1 音步；第 14 行 [об-хо / дя́-кру / го́м]{.ru .syl}，第 1 音步；第 15 行 [об-сы / па́-ет / ве́т-ки]{.ru .syl}，第 1 音步；第 16 行 [но́-вым / се-ре / бро́м]{.ru .syl}，第 2 音步。单数行阴性结尾、不押韵，双数行阳性韵。"
    items:
      - prompt: "[А заря́, лени́во / Обходя́ круго́м, / Обсыпа́ет ве́тки / Но́вым серебро́м.]{.ru}"
        length: 4–8
        model: |-
          13: ∪ ∪ / — ∪ / — ∪ (пиррихий в первой стопе)

          14: ∪ ∪ / — ∪ / — (пиррихий в первой стопе)

          15: ∪ ∪ / — ∪ / — ∪ (пиррихий в первой стопе)

          16: — ∪ / ∪ ∪ / — (пиррихий во второй стопе)
        rubric: ["四行都是三音步扬抑格，每行两个重音", "第 13–15 行虚重在第 1 音步，第 16 行在第 2 音步", "第 13、15 行阴性结尾，第 14、16 行以重音结尾"]
        notes: "音节划分：[а-за / ря́-ле / ни́-во]{.ru .syl}；[об-хо / дя́-кру / го́м]{.ru .syl}；[об-сы / па́-ет / ве́т-ки]{.ru .syl}；[но́-вым / се-ре / бро́м]{.ru .syl}。扬抑格的格律重音在单数音节上，所以 [заря́]{.ru} 的重读音节 [-ря́]{.ru} 是第 3 个音节，落在第 2 音步的开头。最容易错的是把 [а]{.ru} 当作重读音节：它是连接词，不重读。"

  - id: e5
    type: fill
    task: 用括号里的词填空，注意词形。第 2 题用过去时，第 3 题用现在时。
    why: "第 1 题 [покрыться чем]{.ru}，第五格 [серебром]{.ru}。第 2 题主语 [цветы]{.ru} 复数，完成体过去时 [распустились]{.ru}。第 3 题 [обсыпать что чем]{.ru} 第一变位，主语 [ветер]{.ru} 单数：[обсыпает]{.ru}。第 4 题 [в]{.ru} 加第六格，阴性形容词 [сонной]{.ru} 与 [тишине]{.ru} 一致。第 5 题 [в]{.ru} 加第六格表示穿着，[нарядном]{.ru} 与阳性的 [платке]{.ru} 一致。第 6 题 [с]{.ru} 加第五格，[каймой]{.ru}。"
    items:
      - stem: Поле было покрыто снегом, точно ___.
        hint: серебро
        accept: ["серебром"]
      - stem: В саду ___ первые цветы.
        hint: распуститься
        accept: ["распустились"]
      - stem: Ветер ___ дорогу жёлтыми листьями.
        hint: обсыпать
        accept: ["обсыпает"]
      - stem: Деревня спала в ___ тишине.
        hint: сонный
        accept: ["сонной"]
      - stem: Девушка была в ___ платке.
        hint: нарядный
        accept: ["нарядном"]
      - stem: Бабушка подарила мне платок с красной ___.
        hint: кайма
        accept: ["каймой"]

  - id: e6
    type: open
    task: 概要写作。用俄语散文描写诗中的画面，按诗节顺序写，150 词左右。
    items:
      - prompt: "[Опишите прозой картину, которую рисует стихотворение «Берёза».]{.ru}"
        length: 130–170
        model: "Зимнее утро. Под окном у поэта стоит белая берёза. Ночью шёл снег, и теперь берёза покрыта им, как будто серебром. Снег лежит на её тонких пушистых ветках. Он висит, как белая кайма, как кисти и бахрома на краю праздничной шали. Кажется, что под окном стоит не дерево, а молодая девушка в нарядном белом платке. Вокруг тихо. Деревенская улица пуста, никто не выходит из дома, ветра нет, и берёза стоит и не двигается. Но вот встаёт солнце. Его лучи падают на снег, и снежинки на ветках начинают гореть, как в золотом огне. Зимнее солнце поднимается невысоко и движется медленно. Поэту кажется, что заря не торопится: она лениво обходит берёзу вокруг и как будто снова обсыпает её ветки новым серебром. В этой простой картине нет ни одного человека, но в ней много света, тишины и спокойной радости."
        rubric: ["按四节顺序描写：雪中的白桦—“服饰”—寂静与阳光—朝霞", "写出比喻：雪像银子，雪挂像流苏，阳光像金色的火", "用散文句式，不照抄诗句", "130–170 词"]
        notes: "范文约 135 词。诗只有 16 行，概要写作在这里变成“扩写”：把诗里省略的东西（时间、天气、寂静的原因）补出来，但不添加诗中没有的情节。开头用无动词句 [Зимнее утро.]{.ru} 点出时间，是描写文常见的开头。"

  - id: e7
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的短文。
    items:
      - prompt: "[Дерево или цветок — символ родины.]{.ru} 在俄罗斯，白桦是祖国的象征。在中国（或你的家乡），哪种树或花有这样的意义？它出现在哪些诗歌、歌曲或习俗中？为什么人们喜欢它？"
        length: 250–300
        model: "Для русских берёза — не просто дерево. Белую берёзу можно увидеть почти везде: в лесу, в поле, в деревне и даже во дворе городского дома. О берёзе поют в фольклорных песнях и частушках, её рисуют художники, а Есенин сравнивает её с девушкой в нарядной шали. Когда русский человек долго живёт за границей, он часто вспоминает именно берёзы. Есть ли такое дерево в Китае? Мне кажется, что у нас есть даже несколько таких растений. Я хочу рассказать о китайской сливе. Она цветёт в конце зимы, когда вокруг ещё холодно и иногда лежит снег. На голых тёмных ветках вдруг появляются маленькие белые или розовые цветы. Поэтому в Китае слива — символ силы и надежды: она не боится холода и первой встречает весну. Её тонкий запах чувствуешь раньше, чем видишь сами цветы. О сливе писали поэты разных эпох. Её рисуют на картинах вместе со снегом, а на праздник Весны цветущие ветки ставят в доме. В детстве бабушка часто говорила мне: «Будь как слива: чем труднее, тем ярче цвети». Я тогда не понимал этих слов, но теперь, когда я учусь далеко от дома, я часто их вспоминаю. Когда на экзамене или в чужом городе мне трудно, я думаю о маленьких цветах на холодных ветках. Интересно, что берёза и слива очень разные. Берёза — дерево спокойное и нежное, её любят за тихую красоту. Слива — маленькое, но сильное растение, её любят за то, что она не боится трудностей. Но в обоих случаях люди видят в растении то, что они больше всего ценят в своей стране и в себе. Может быть, поэтому, глядя на берёзу у окна в Москве, я думаю о сливе в саду моей бабушки."
        rubric: ["说明白桦在俄罗斯文化中的意义，可引用本课的诗", "介绍一种中国（或家乡）的象征性植物，写出具体的习俗、诗画或个人回忆", "有比较：两种植物的异同", "结尾回到“祖国、家乡”", "250–300 词"]
        notes: "范文约 267 词。结构：俄罗斯的白桦 → 提问引出中国的梅花 → 梅花的特点、象征意义、诗画和习俗 → 个人回忆（奶奶的话）→ 比较两种植物 → 结尾把两者连在一起。梅花在俄语里叫 [китайская слива]{.ru}，第一次出现时写全，后面可以只说 [слива]{.ru} 或用代词 [она]{.ru}。"
