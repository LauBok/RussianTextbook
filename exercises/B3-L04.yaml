lesson: B3-L04
grammar: "被动形动词过去时：[-ать/-ять]{.ru} 动词加 [-нн-]{.ru}（[написа́ть → напи́санный]{.ru}），[-ить/-еть]{.ru} 及辅音词干动词加 [-енн-/-ённ-]{.ru}（[купи́ть → ку́пленный]{.ru}，[реши́ть → решённый]{.ru}），[-ыть, -уть]{.ru} 及单音节词根动词加 [-т-]{.ru}（[откры́ть → откры́тый]{.ru}）；发出者用第五格；[ра́ненный]{.ru} 与 [ра́неный]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Почему жизнь Пушкина в 1836 году была нелёгкой? Что Пушкин сделал в Святогорском монастыре весной 1836 года? Что печатал журнал «Современник»? Над какой книгой Пушкин работал в архивах? С чего начался конфликт с Дантесом? Как закончилась дуэль?]{.ru}"
        length: 70–100
        model: "У Пушкина была большая семья, денег не хватало, а долги росли. Кроме того, весной умерла его мать. Пушкин похоронил её в Святогорском монастыре и купил там место для себя. «Современник» печатал стихи и прозу лучших писателей, в том числе повесть Гоголя «Нос», стихи Тютчева и роман самого Пушкина «Капитанская дочка». В архивах Пушкин собирал материалы для истории Петра Первого. Конфликт начался в ноябре, когда Пушкин и его друзья получили анонимные письма, оскорблявшие честь поэта и его жены. На дуэли Дантес выстрелил первым и смертельно ранил Пушкина. Поэт ранил противника в руку, но через два дня умер."
        rubric: ["六个问题都回答，内容与课文一致", "[ранить кого во что]{.ru} 用法正确", "用完整的句子"]
        notes: 第 1 题至少说出两个原因（家庭负担、缺钱和债务、母亲去世）。第 5 题注意课文的说法：信是匿名的，普希金把它们和丹特士联系在一起。

  - id: e2
    type: fill
    task: 用括号里动词的被动形动词过去时填空，注意性、数、格。
    why: "先定后缀，再定词尾。第 1 题 [издать]{.ru} 以 [-ать]{.ru} 结尾，加 [-нн-]{.ru}：[изданный]{.ru}，[номер]{.ru} 阳性第一格。第 2 题 [купить]{.ru} 以 [-ить]{.ru} 结尾，加 [-енн-]{.ru}，并有和 [куплю]{.ru} 一样的 [п → пл]{.ru} 交替；[в месте]{.ru} 中性第六格 → [купленном]{.ru}。第 3 题 [получить → полученн-]{.ru}，[письма]{.ru} 复数第一格 → [полученные]{.ru}。第 4 题 [открыть]{.ru} 以 [-ыть]{.ru} 结尾，加 [-т-]{.ru}：[в музее]{.ru} 阳性第六格 → [открытом]{.ru}。第 5 题 [написать → написанн-]{.ru}，重音前移：[напи́санные]{.ru}，[строки]{.ru} 复数第一格。第 6 题 [остановить]{.ru} 有 [в → вл]{.ru} 交替（[остановлю]{.ru}），[часы]{.ru} 只有复数，第四格同第一格 → [остановленные]{.ru}。"
    items:
      - stem: Первый номер журнала, ___ в апреле, Пушкин готовил почти один.
        hint: издать
        accept: ["изданный"]
      - stem: Поэта похоронили в месте, ___ за год до этого.
        hint: купить
        accept: ["купленном"]
      - stem: Письма, ___ в один день, оскорбляли честь поэта.
        hint: получить
        accept: ["полученные"]
      - stem: Мы были в музее, ___ в последней квартире Пушкина.
        hint: открыть
        accept: ["открытом"]
      - stem: Строки, ___ летом 1836 года, знает каждый школьник.
        hint: написать
        accept: ["написанные"]
      - stem: В кабинете мы увидели часы, ___ в минуту смерти поэта.
        hint: остановить
        accept: ["остановленные"]

  - id: e3
    type: rewrite
    task: 把 [который]{.ru} 从句改成被动形动词过去时短语。
    example:
      cue: Роман, который написал Пушкин, читают и сегодня.
      answer: Роман, написанный Пушкиным, читают и сегодня.
    why: "从句的宾语 [который]{.ru}（第四格）就是被说明的名词，形动词和它一致；从句的主语变成第五格；从句没有主语（不定人称句）时，形动词短语里也不出现发出者。第 1 题 [номер]{.ru} 阳性第一格，[издал → изданный]{.ru}，[поэт → поэтом]{.ru}；说的是一次完成的出版，所以用完成体构成的过去时形动词（比较练习四第 2 题：一直在编的杂志用 [издаваемый]{.ru}）。第 2 题 [письма]{.ru} 复数第一格，[получили → полученные]{.ru}，[друзья → друзьями]{.ru}。第 3 题 [повесть]{.ru} 阴性，在句中是 [прочитать]{.ru} 的宾语，第四格 → [опубликованную]{.ru}；原句的主语 [журнал «Современник»]{.ru} 变成第五格 [журналом «Современник»]{.ru}，引号里的刊名不变格。第 4 题 [в месте]{.ru} 中性第六格 → [купленном]{.ru}；原句主语 [он]{.ru} 变成第五格 [им]{.ru}，也可以不说出发出者。"
    items:
      - cue: Первый номер журнала, который издал поэт, вышел в апреле.
        accept: ["Первый номер журнала, изданный поэтом, вышел в апреле.", "Изданный поэтом первый номер журнала вышел в апреле."]
      - cue: Письма, которые получили друзья Пушкина, были анонимными.
        accept: ["Письма, полученные друзьями Пушкина, были анонимными.", "Полученные друзьями Пушкина письма были анонимными."]
      - cue: Я прочитал повесть, которую опубликовал журнал «Современник».
        accept: ["Я прочитал повесть, опубликованную журналом «Современник».", "Я прочитал опубликованную журналом «Современник» повесть."]
      - cue: Поэта похоронили рядом с могилой матери, в месте, которое он купил за год до этого.
        accept: ["Поэта похоронили рядом с могилой матери, в месте, купленном им за год до этого.", "Поэта похоронили рядом с могилой матери, в месте, купленном за год до этого.", "Поэта похоронили рядом с могилой матери, в купленном им за год до этого месте."]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题有状语 [смертельно]{.ru}，是形动词，写 [-нн-]{.ru}：[раненный]{.ru}；[раненый]{.ru} 是不带从属词的形容词。第 2 题被说明的 [журнал]{.ru} 是被编辑的对象，而且说的是一直在进行的工作（[выходил четыре раза в год]{.ru}），用未完成体被动形动词现在时 [издаваемый]{.ru}；[издавший]{.ru} 是主动形动词，意思是“出版了（别的东西）的”。第 3 题读者自己读过小说，是动作的发出者，用主动形动词 [прочитавшие]{.ru}；[прочитанные]{.ru} 是“被读过的”。第 4 题 [купить]{.ru} 第一人称是 [куплю]{.ru}，形动词有同样的交替：[купленный]{.ru}，没有 [купенный]{.ru}。"
    items:
      - stem: Смертельно ___ поэт упал, но нашёл силы выстрелить.
        options: [раненый, раненный, ранивший]
        answer: раненный
      - stem: Журнал, ___ самим поэтом, выходил четыре раза в год.
        options: [издавший, издаваемый, издающий]
        answer: издаваемый
      - stem: Читатели, ___ «Капитанскую дочку», не знали имени автора.
        options: [прочитанные, прочитавшие, прочитанных]
        answer: прочитавшие
      - stem: Место, ___ Пушкиным, находилось рядом с могилой матери.
        options: [купленное, купенное, купившее]
        answer: купленное

  - id: e5
    type: translate
    task: 翻译下列句子，用被动形动词过去时。
    items:
      - zh: 《上尉的女儿》是普希金写的一部长篇小说。
        accept: ["«Капитанская дочка» — роман, написанный Пушкиным.", "«Капитанская дочка» — это роман, написанный Пушкиным.", "«Капитанская дочка» — роман, который написал Пушкин."]
        rubric: ["[написанный Пушкиным]{.ru}：形动词与 [роман]{.ru} 一致，发出者用第五格", "形动词短语放在名词后面，用逗号隔开"]
      - zh: 我们读了一首在诗人遇难前半年写下的诗。
        accept: ["Мы прочитали стихотворение, написанное за полгода до гибели поэта.", "Мы прочитали стихотворение, написанное поэтом за полгода до гибели.", "Мы читали стихотворение, написанное за полгода до гибели поэта.", "Мы прочитали стихотворение, которое поэт написал за полгода до гибели.", "Мы прочитали стихотворение, которое было написано за полгода до гибели поэта."]
        rubric: ["[написанное]{.ru}：中性第四格，与 [стихотворение]{.ru} 一致", "[за полгода до гибели]{.ru}：[за]{.ru} + 时间 + [до]{.ru} + 第二格"]
      - zh: 在莫伊卡河边开办的博物馆里，参观者可以看到诗人的书。
        accept: ["В музее, открытом на Мойке, посетители могут увидеть книги поэта.", "В открытом на Мойке музее посетители могут увидеть книги поэта.", "В музее, открытом на Мойке, посетители могут видеть книги поэта.", "В музее, который открыли на Мойке, посетители могут увидеть книги поэта."]
        rubric: ["[открытом]{.ru}：后缀 [-т-]{.ru}，阳性第六格与 [музее]{.ru} 一致", "[посетители]{.ru} 参观者"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：1836 年初普希金的生活；母亲去世；《同时代人》杂志；匿名信和冲突；决斗和诗人之死；后人的纪念。每项一到两句，保留关键日期，至少用两处被动形动词过去时。
        length: 120–150
        model: "В 1836 году Пушкину было тридцать шесть лет. У него была большая семья, и денег постоянно не хватало. Весной умерла мать поэта, и он похоронил её в Святогорском монастыре. Главным делом года стал журнал «Современник», который печатал лучших писателей. В последнем номере, изданном в конце года, вышла «Капитанская дочка». Кроме того, Пушкин собирал в архивах материалы для истории Петра Первого. Осенью Пушкин и его друзья получили анонимные письма, оскорблявшие честь поэта и его жены. Письма, полученные в один день, Пушкин связал с именем Дантеса и вызвал его на дуэль. Дуэль состоялась 27 января 1837 года на Чёрной речке. Смертельно раненный поэт через два дня умер в своей квартире на Мойке. Его похоронили рядом с матерью, в месте, купленном за год до этого. Молодой поэт Лермонтов написал на его смерть стихотворение «Смерть поэта». Сегодня в последней квартире Пушкина работает музей."
        rubric: ["提纲六项都有，顺序与课文一致", "日期准确：1836、1837 年 1 月 27 日", "至少两处被动形动词过去时，后缀和词尾正确", "120–150 词"]
        notes: "范文约 135 词。省去了报纸上的话、证人丹扎斯等细节，每件事只留一句。用了四个被动形动词过去时：[изданном]{.ru}（中性第六格，与 [номере]{.ru} 一致）、[полученные]{.ru}、[раненный]{.ru}（带状语 [смертельно]{.ru}，写 [-нн-]{.ru}）、[купленном]{.ru}。[печатал лучших писателей]{.ru}：[печатать кого]{.ru} 意思是“刊登某人的作品”。"

  - id: e7
    type: choice
    task: 选择适当的词填空。
    why: "第 1 题“举行（决斗、会议）”用 [состояться]{.ru}：[состоялась дуэль]{.ru}；[удаться]{.ru} 是“（某人）得以做成”，要求第三格的人和不定式；[оскорблять]{.ru} 是“侮辱”，要有宾语。第 2 题研究历史要到档案馆查资料：[в архивах]{.ru}；[рукопись]{.ru} 是作者自己写的稿子，不是存放资料的地方；[могила]{.ru} 是坟墓。第 3 题“因疼痛而受苦”是 [страдать от боли]{.ru}；[прощаться]{.ru} 要求 [с кем]{.ru}，[ухаживать]{.ru} 要求 [за кем]{.ru}，都不和 [от боли]{.ru} 搭配。第 4 题 [удаться]{.ru} 用于无人称句，做事的人用第三格，动词用中性过去时 [удалось]{.ru}，不和 [дуэль]{.ru} 一致，因为 [дуэль]{.ru} 在这里是 [остановить]{.ru} 的宾语。"
    items:
      - stem: 27 января 1837 года на Чёрной речке ___ дуэль.
        options: [состоялась, удалась, оскорбляла]
        answer: состоялась
      - stem: Пушкин собирал материалы для истории Петра Первого в ___.
        options: [архивах, рукописях, могилах]
        answer: архивах
      - stem: Два дня Пушкин ___ от боли.
        options: [страдал, прощался, ухаживал]
        answer: страдал
      - stem: Друзьям ___ остановить дуэль.
        options: [удалось, удалась, удался]
        answer: удалось
