lesson: B2-L34
grammar: "带 [-ся]{.ru} 动词的意义：反身（[одева́ться]{.ru}）、相互（[встреча́ться, знако́миться, здоро́ваться]{.ru}）、被动（[пи́шется, продаю́тся]{.ru}）、不及物（[начина́ться]{.ru}）、只有 [-ся]{.ru} 形式的动词（[смея́ться, боя́ться]{.ru}）。"
exercises:

  - id: e1
    type: choice
    task: 选择带 [-ся]{.ru} 或不带 [-ся]{.ru} 的动词。
    why: "动词后面有直接宾语（第四格）时一般不带 [-ся]{.ru}；没有宾语、表示互相、自己对自己或事物自己发生时带 [-ся]{.ru}。第 1 题有宾语 [Ми́шу]{.ru}，用 [одева́ет]{.ru}。第 2 题米沙给自己穿衣服，用 [одева́ется]{.ru}。第 3 题 [с Ди́мой]{.ru} 表示互相见面，用 [встреча́ется]{.ru}。第 4 题有宾语 [уро́к]{.ru}，用 [начина́ет]{.ru}。第 5 题课自己开始，没有宾语，用 [начина́ется]{.ru}。第 6 题主语是事物 [уче́бники]{.ru}，被卖，用 [продаю́тся]{.ru}。"
    items:
      - stem: Ма́ма ___ Ми́шу.
        options: [одева́ет, одева́ется]
        answer: одева́ет
      - stem: Ми́ша бы́стро ___ и идёт в шко́лу.
        options: [одева́ет, одева́ется]
        answer: одева́ется
      - stem: Ван Лэй ___ с Ди́мой два ра́за в неде́лю.
        options: [встреча́ет, встреча́ется]
        answer: встреча́ется
      - stem: О́льга Ви́кторовна ___ уро́к в де́вять часо́в.
        options: [начина́ет, начина́ется]
        answer: начина́ет
      - stem: Уро́к ___ в де́вять часо́в.
        options: [начина́ет, начина́ется]
        answer: начина́ется
      - stem: В э́том магази́не ___ кита́йские уче́бники.
        options: [продаю́т, продаю́тся]
        answer: продаю́тся

  - id: e2
    type: fill
    task: 用括号里动词的正确形式填空，并想一想 [-ся]{.ru} 在这里表示什么意义。
    why: "第 1 题相互意义：[мы с Ле́ной]{.ru} 互相见面，[ви́деться]{.ru} 第一人称复数 [ви́димся]{.ru}，复数不交替。第 2 题被动意义，主语 [сло́во]{.ru} 是中性单数：[пи́шется]{.ru}。第 3 题相互意义，[здоро́ваться]{.ru} 不是 [-овать]{.ru} 类，[-ов-]{.ru} 属于词根 [здоро́в-]{.ru}，变位时不变：[здоро́ваются]{.ru}。第 4 题 [целова́ться]{.ru} 是 [-овать]{.ru} 类：[целу́ются]{.ru}。第 5 题 [знако́миться]{.ru} 第一人称单数 [м → мл]{.ru}：[знако́млюсь]{.ru}。"
    items:
      - stem: Мы с Ле́ной ___ по сре́дам.
        hint: ви́деться
        accept: ["ви́димся"]
      - stem: Как ___ э́то сло́во?
        hint: писа́ться
        accept: ["пи́шется"]
      - stem: Студе́нты ___ с преподава́телем.
        hint: здоро́ваться
        accept: ["здоро́ваются"]
      - stem: Когда́ встреча́ются ста́рые подру́ги, они́ ___.
        hint: целова́ться
        accept: ["целу́ются"]
      - stem: Я ча́сто ___ с но́выми людьми́ в клу́бе.
        hint: знако́миться
        accept: ["знако́млюсь"]

  - id: e3
    type: choice
    task: 选择 [кого́]{.ru}（第四格）或 [с кем]{.ru}（[с]{.ru} + 第五格）。
    why: "不带 [-ся]{.ru} 的及物动词接第四格；表示相互意义的 [-ся]{.ru} 动词接 [с]{.ru} + 第五格。第 1 题 [встре́тил]{.ru} 接第四格 [Ди́му]{.ru}。第 2 题 [встре́тился]{.ru} 接 [с Ди́мой]{.ru}。第 3 题 [познако́мился]{.ru} 接 [с Ле́ной]{.ru}。第 4 题 [ви́жу]{.ru} 接第四格 [Ле́ну]{.ru}。"
    items:
      - stem: Вчера́ я встре́тил ___ в метро́.
        options: [Ди́му, с Ди́мой]
        answer: Ди́му
      - stem: В сре́ду я встре́тился ___ в кафе́.
        options: [Ди́му, с Ди́мой]
        answer: с Ди́мой
      - stem: Ван Лэй познако́мился ___.
        options: [Ле́ну, с Ле́ной]
        answer: с Ле́ной
      - stem: Я ча́сто ви́жу ___ в библиоте́ке.
        options: [Ле́ну, с Ле́ной]
        answer: Ле́ну

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“你的名字怎么写”用被动意义的 [пи́шется]{.ru}。第 2 题“我们每星期见两次”是相互意义。第 3 题“认识”用 [познако́миться с]{.ru} + 第五格。第 4 题“这里卖……”可以用被动意义的 [продаю́тся]{.ru}，也可以用不定人称句 [продаю́т]{.ru}。第 5 题 [шути́ть]{.ru} 是只有在第一人称单数交替的第二变位动词：[шу́тит]{.ru}。"
    items:
      - zh: 你的名字用中文怎么写？
        accept: ["Как пи́шется твоё и́мя по-кита́йски?", "Как пи́шется ва́ше и́мя по-кита́йски?", "Как по-кита́йски пи́шется твоё и́мя?", "Как по-кита́йски пи́шется ва́ше и́мя?", "Как твоё и́мя пи́шется по-кита́йски?", "Как ва́ше и́мя пи́шется по-кита́йски?"]
        rubric: ["被动意义用 [пи́шется]{.ru}，主语是 [и́мя]{.ru}", "[и́мя]{.ru} 是中性名词：[твоё и́мя]{.ru}"]
      - zh: 我们每星期见两次面。
        accept: ["Мы встреча́емся два ра́за в неде́лю.", "Мы ви́димся два ра́за в неде́лю.", "Два ра́за в неде́лю мы встреча́емся.", "Два ра́за в неде́лю мы ви́димся."]
        rubric: ["相互意义用 [встреча́емся]{.ru} 或 [ви́димся]{.ru}", "[два ра́за в неде́лю]{.ru}"]
      - zh: 我想认识一下这位姑娘。
        accept: ["Я хочу́ познако́миться с э́той де́вушкой.", "Я хоте́л бы познако́миться с э́той де́вушкой.", "Я хоте́ла бы познако́миться с э́той де́вушкой."]
        rubric: ["[познако́миться с]{.ru} + 第五格 [э́той де́вушкой]{.ru}"]
      - zh: 那儿卖很好的课本。
        accept: ["Там продаю́тся хоро́шие уче́бники.", "Там продаю́т хоро́шие уче́бники."]
        rubric: ["被动意义 [продаю́тся]{.ru}，主语 [уче́бники]{.ru} 用第一格", "用 [продаю́т]{.ru} 时 [уче́бники]{.ru} 是第四格，形式相同"]
      - zh: 迪马总爱开玩笑。
        accept: ["Ди́ма всегда́ шу́тит.", "Ди́ма лю́бит шути́ть.", "Ди́ма всё вре́мя шу́тит.", "Ди́ма всегда́ лю́бит шути́ть."]
        rubric: ["[шути́ть]{.ru} 第一人称单数 [т → ч]{.ru}（[шучу́]{.ru}），第三人称不交替：[шу́тит]{.ru}", "[люби́ть]{.ru} 后用未完成体不定式"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[С кем встреча́ется Ван Лэй по сре́дам? Кто така́я Ле́на? Как они́ познако́мились? Что Ле́на хоте́ла узна́ть? О чём они́ договори́лись?]{.ru}"
        length: 50–80
        model: "Ван Лэй и Ди́ма встреча́ются в кафе́ на факульте́те два ра́за в неде́лю. В сре́ду Ди́ма был с Ле́ной. Они́ с Ди́мой из одного́ го́рода, а тепе́рь она́ изуча́ет кита́йский язы́к. Ди́ма познако́мил её с Ван Лэ́ем. Ван Лэй протяну́л ей ру́ку, и Ле́на пожа́ла её. Она́ спроси́ла, как пи́шется его́ и́мя по-кита́йски. Ле́на и Ван Лэй договори́лись ви́деться по сре́дам."
        rubric: ["回答全部五个问题", "相互意义的 [-ся]{.ru} 动词用对，接 [с]{.ru} + 第五格", "被动意义的 [пи́шется]{.ru}"]
        notes: 范文约 60 词。[Ди́ма познако́мил её с Ван Лэ́ем]{.ru}“迪马介绍她和王磊认识”：不带 [-ся]{.ru} 的 [познако́мить]{.ru} 接第四格（被介绍的人）和 [с]{.ru} + 第五格。

  - id: e6
    type: open
    task: 作文。题目：“我是怎样认识我的朋友的”。
    items:
      - prompt: 写你和一位朋友是怎样认识的：在哪儿、谁介绍的、第一次见面时说了什么、做了什么，现在你们怎样联系。至少用四个带 [-ся]{.ru} 的动词，其中至少两个表示相互意义。最后用两三句话比较中国和俄罗斯初次见面的习惯。
        length: 100–150
        model: |
          С мои́м ру́сским дру́гом я познако́мился в про́шлом году́ в Пеки́не. Он учи́лся в на́шем университе́те, и одна́жды мой преподава́тель сказа́л: «Познако́мьтесь, э́то ваш но́вый сосе́д из Москвы́». Он улыбну́лся, протяну́л мне ру́ку и сказа́л по-кита́йски: «О́чень прия́тно!» Я засмея́лся, потому́ что он говори́л о́чень смешно́. Пото́м мы ча́сто встреча́лись в библиоте́ке и учи́ли друг дру́га: я его́ — кита́йскому языку́, он меня́ — ру́сскому. Тепе́рь он живёт в Москве́, и мы ви́димся ре́же, но ча́сто перепи́сываемся. Когда́ встреча́емся, мы обнима́емся, как ста́рые друзья́. В Кита́е, когда́ знако́мятся, то́же ча́сто здоро́ваются за ру́ку. Но в Росси́и мужчи́на ждёт, когда́ же́нщина протя́нет ру́ку пе́рвой, а у нас э́то не так ва́жно.
        rubric: ["至少四个 [-ся]{.ru} 动词，形式正确", "相互意义的动词接 [с]{.ru} + 第五格或复数主语", "认识的经过清楚：地点、介绍、第一次的话", "有中俄习惯的比较"]
        notes: 范文约 110 词：认识的经过—之后怎样来往—现在—中俄比较。相互意义的动词都用复数主语 [мы]{.ru}：[встреча́лись, ви́димся, перепи́сываемся, обнима́емся]{.ru}。[учи́ли друг дру́га]{.ru}“互相教”：[учи́ть]{.ru} 没有对应的相互意义 [-ся]{.ru} 动词，所以用 [друг дру́га]{.ru} 表示“互相”。
