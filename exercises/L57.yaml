lesson: L57
grammar: "前置词 [к]{.ru} + 第三格（到某人那里、走近某处；[ко мне, к нему́, к ней, к ним]{.ru}）；前置词 [по]{.ru} + 第三格（沿着、通过通讯工具、某门学科）。"
exercises:

  - id: e1
    type: fill
    task: 用 [к]{.ru} + 第三格回答：他去找谁？
    why: 去找人用 [к]{.ru} + 第三格，名词、形容词、物主代词都要变成第三格。第 4 题人称代词前加 [н-]{.ru}：[к нему́]{.ru}；第 5 题 [мне]{.ru} 前用 [ко]{.ru}。
    items:
      - stem: Ван Лэй идёт ___.
        hint: врач
        accept: [к врачу́]
      - stem: В суббо́ту мы е́дем ___.
        hint: ба́бушка
        accept: [к ба́бушке]
      - stem: А́нна идёт ___.
        hint: О́льга Ви́кторовна
        accept: [к О́льге Ви́кторовне]
      - stem: Ми́ша идёт ___.
        hint: он
        accept: [к нему́]
      - stem: Ми́ша, иди́ ___!
        hint: я
        accept: [ко мне]
      - stem: Ко́стя идёт ___.
        hint: наш ста́рый врач
        accept: [к на́шему ста́рому врачу́]

  - id: e2
    type: choice
    task: 选择正确的前置词。
    why: 去某个地方用 [в / на]{.ru} + 第四格；去找人用 [к]{.ru} + 第三格（第 1、2 题）。[по]{.ru} 表示沿着某处走动（第 4 题）、通过电话等（第 5 题）、某门学科的（第 6 题）。第 3 题 [поликли́нику]{.ru} 是地方，用 [в]{.ru}。
    items:
      - stem: Я иду́ ___ врачу́.
        options: [в, к, по]
        answer: к
      - stem: Мы е́дем ___ ба́бушке на да́чу.
        options: [в, к, по]
        answer: к
      - stem: Ван Лэй идёт ___ поликли́нику.
        options: [в, к, по]
        answer: в
      - stem: Мы гуля́ем ___ го́роду.
        options: [в, к, по]
        answer: по
      - stem: Ма́ма говори́т ___ телефо́ну.
        options: [в, к, по]
        answer: по
      - stem: У нас уро́к ___ ру́сскому языку́.
        options: [в, к, по]
        answer: по

  - id: e3
    type: rewrite
    task: 按例句改写：用 [к]{.ru} 说去谁那里。
    placeholder: … идёт в … к …
    example:
      cue: Ван Лэй — поликли́ника — врач
      answer: Ван Лэй идёт в поликли́нику к врачу́.
    why: 地方用 [в / на]{.ru} + 第四格，人用 [к]{.ru} + 第三格，两个可以在同一句里。第 3 题“去学校”用 [в]{.ru}，[шко́лу]{.ru} 是第四格。
    items:
      - cue: А́нна — университе́т — О́льга Ви́кторовна
        accept: ["А́нна идёт в университе́т к О́льге Ви́кторовне."]
      - cue: Ми́ша — да́ча — ба́бушка
        accept: ["Ми́ша идёт на да́чу к ба́бушке.", "Ми́ша е́дет на да́чу к ба́бушке."]
      - cue: ма́ма — шко́ла — учи́тель
        accept: ["Ма́ма идёт в шко́лу к учи́телю."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 注意 [к]{.ru} 和 [по]{.ru} 后面都用第三格。
    items:
      - zh: 我去看医生。
        accept: ["Я иду́ к врачу́.", "Я е́ду к врачу́."]
        rubric: ["“去看医生”用 [к врачу́]{.ru}，第三格"]
      - zh: 你得在家躺三天。
        accept: ["Тебе́ на́до лежа́ть до́ма три дня.", "Три дня тебе́ на́до лежа́ть до́ма.", "Тебе́ ну́жно лежа́ть до́ма три дня.", "Три дня тебе́ ну́жно лежа́ть до́ма.", "Вам на́до лежа́ть до́ма три дня.", "Три дня вам на́до лежа́ть до́ма.", "Вам ну́жно лежа́ть до́ма три дня.", "Три дня вам ну́жно лежа́ть до́ма.", "Тебе́ на́до три дня лежа́ть до́ма.", "Вам на́до три дня лежа́ть до́ма.", "До́ма тебе́ на́до лежа́ть три дня."]
        rubric: ["无人称句 [на́до / ну́жно]{.ru} + 不定式", "[три дня]{.ru} 不加前置词"]
      - zh: 安娜去奥尔加·维克托罗夫娜那里拿俄语作业。
        accept: ["А́нна идёт к О́льге Ви́кторовне и берёт зада́ние по ру́сскому языку́.", "А́нна идёт к О́льге Ви́кторовне, берёт зада́ние по ру́сскому языку́."]
        rubric: ["[к О́льге Ви́кторовне]{.ru} 名字和父称都用第三格", "“俄语作业”是 [зада́ние по ру́сскому языку́]{.ru}"]
      - zh: 他沿着长长的走廊走。
        accept: ["Он идёт по дли́нному коридо́ру."]
        rubric: ["[по]{.ru} + 第三格 [дли́нному коридо́ру]{.ru}"]
      - zh: 妈妈在打电话。
        accept: ["Ма́ма звони́т по телефо́ну.", "Ма́ма говори́т по телефо́ну."]
        rubric: ["“打电话”可用 [звони́ть]{.ru} 或 [говори́ть по телефо́ну]{.ru}"]

  - id: e5
    type: open
    task: 情景对话：你感冒了，去诊所看医生。
    items:
      - prompt: 写 6–8 句医生和病人的对话：病人说哪里不舒服，医生检查、给建议，病人问能不能去上课。
        length: 50–90
        model: "— Здра́вствуйте, до́ктор!\n— Здра́вствуйте. Что случи́лось?\n— У меня́ ка́шель и температу́ра.\n— Покажи́те го́рло… Да, у вас просту́да.\n— Мне мо́жно ходи́ть на заня́тия?\n— Нет, вам на́до лежа́ть до́ма два дня. Вот реце́пт.\n— А где мо́жно купи́ть лека́рство?\n— Апте́ка недалеко́. И пе́йте мно́го ча́я!\n— Спаси́бо, до́ктор!"
        rubric: ["用到 [на́до / мо́жно / нельзя́]{.ru} 等无人称句", "医生用 [вы]{.ru} 和命令式 [-те]{.ru}", "问句和回答对应"]
        notes: 对话按看病的实际顺序：问候—说病情—检查—医嘱—买药—道谢。医生对病人一律用 [вы]{.ru}，命令式用 [покажи́те, пе́йте]{.ru}。说病情用 [у меня́]{.ru} + 第一格，“哪里疼”的说法第 85 课才学，这里只用“发烧”“咳嗽”。
