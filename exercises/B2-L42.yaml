lesson: B2-L42
grammar: "前缀 [пере-]{.ru}（越过）、[про-]{.ru}（经过；走完）、[за-]{.ru}（顺路去一下）；[ми́мо]{.ru} + 第二格，[че́рез]{.ru} + 第四格，[за]{.ru} + 第五格（去接、去取）。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的前缀动词。
    why: "第 1 题从桥上到河对岸，第 4 题游到对岸，都是“越过”，用 [пере-]{.ru}。第 2 题 [ми́мо]{.ru}、第 5 题 [ми́мо]{.ru} 是从旁边经过，用 [про-]{.ru}。第 3 题、第 6 题是顺路进去一下，用 [за-]{.ru}。"
    items:
      - stem: Друзья́ ___ че́рез Каза́нку по мосту́.
        options: [перешли́, прошли́, зашли́]
        answer: перешли́
      - stem: Пото́м они́ ___ ми́мо Кремля́.
        options: [перешли́, прошли́, зашли́]
        answer: прошли́
      - stem: В Свия́жске они́ ___ в ма́ленькое кафе́.
        options: [перешли́, прошли́, зашли́]
        answer: зашли́
      - stem: Де́душка Ди́мы в мо́лодости ___ Во́лгу.
        options: [переплы́л, проплы́л, поплы́л]
        answer: переплы́л
      - stem: Теплохо́д ___ ми́мо острово́в.
        options: [переплыва́л, проплыва́л, заходи́л]
        answer: проплыва́л
      - stem: По доро́ге с рабо́ты па́па ___ за на́ми на маши́не.
        options: [подъе́хал, прое́хал, зае́хал]
        answer: зае́хал

  - id: e2
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "[ми́мо]{.ru} 要求第二格（第 1 题 [Кремля́]{.ru}，重音在词尾）。[че́рез]{.ru} 要求第四格（第 2 题 [у́лицу]{.ru}）。[по]{.ru} 要求第三格（第 3 题 [мосту́]{.ru}，重音在词尾）。“去接某人”用 [за]{.ru} 加第五格（第 4 题 [бра́том]{.ru}）。顺路到某人那里用 [к]{.ru} 加第三格（第 5 题 [ба́бушке]{.ru}）。"
    items:
      - stem: Мы прошли́ ми́мо ___.
        hint: Кремль
        accept: ["Кремля́"]
      - stem: Здесь нельзя́ переходи́ть че́рез ___.
        hint: у́лица
        accept: ["у́лицу"]
      - stem: Маши́на прое́хала по ___.
        hint: мост
        accept: ["мосту́"]
      - stem: Я зайду́ за ___, и мы пойдём в кино́.
        hint: брат
        accept: ["бра́том"]
      - stem: По доро́ге домо́й Ми́ша зашёл к ___.
        hint: ба́бушка
        accept: ["ба́бушке"]

  - id: e3
    type: choice
    task: 选择未完成体或完成体。
    why: "第 1 题 [ка́ждый день]{.ru} 表示经常，用未完成体。第 2 题有 [ме́дленно]{.ru}，又和 [фотографи́ровали]{.ru} 同时进行，是过程，用未完成体。第 3 题说一次完成的结果，用完成体。第 4 题“走完全城”是结果，用完成体 [прошли́]{.ru}。第 5 题 [сего́дня]{.ru} 说的是将来一次的行为，又和完成体 [куплю́]{.ru} 连用，用完成体将来时 [зайду́]{.ru}。"
    items:
      - stem: Ка́ждый день по доро́ге в университе́т Ван Лэй ___ ми́мо па́рка.
        options: [прохо́дит, пройдёт]
        answer: прохо́дит
      - stem: Когда́ теплохо́д ме́дленно ___ ми́мо дере́вни, мы фотографи́ровали це́рковь.
        options: [проплыва́л, проплы́л]
        answer: проплыва́л
      - stem: Ми́ша ___ у́лицу и пошёл в шко́лу.
        options: [переходи́л, перешёл]
        answer: перешёл
      - stem: Мы ___ пешко́м весь го́род и о́чень уста́ли.
        options: [проходи́ли, прошли́]
        answer: прошли́
      - stem: Сего́дня по доро́ге домо́й я ___ в магази́н и куплю́ хлеб.
        options: [захожу́, зайду́]
        answer: зайду́

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“过马路”用 [перейти́ (че́рез) у́лицу]{.ru}。第 2 题“从旁边经过”用 [про-]{.ru} + [ми́мо]{.ru}。第 3 题顺路去接人用 [зайти́ / зае́хать за]{.ru} + 第五格。第 4 题顺路进商店用 [зайти́ в]{.ru}。"
    items:
      - zh: 米沙过了马路。
        accept: ["Ми́ша перешёл у́лицу.", "Ми́ша перешёл че́рез у́лицу."]
        rubric: ["[перешёл]{.ru}", "[у́лицу]{.ru} 第四格，可以加 [че́рез]{.ru}"]
      - zh: 我们的公共汽车从克里姆林旁边开过去。
        accept: ["Наш авто́бус прое́хал ми́мо Кремля́.", "Наш авто́бус проезжа́л ми́мо Кремля́.", "Наш авто́бус проезжа́ет ми́мо Кремля́.", "Мы прое́хали на авто́бусе ми́мо Кремля́.", "Мы проезжа́ли на авто́бусе ми́мо Кремля́.", "Наш авто́бус прошёл ми́мо Кремля́."]
        rubric: ["“开过”用 [прое́хать / проезжа́ть]{.ru}", "[ми́мо Кремля́]{.ru} 第二格"]
      - zh: 明天早上我去接你。
        accept: ["За́втра у́тром я зайду́ за тобо́й.", "Я зайду́ за тобо́й за́втра у́тром.", "За́втра у́тром я зае́ду за тобо́й.", "Я зае́ду за тобо́й за́втра у́тром.", "За́втра у́тром я зайду́ за ва́ми.", "За́втра у́тром я зае́ду за ва́ми."]
        rubric: ["“去接”用 [зайти́ / зае́хать за]{.ru} + 第五格 [тобо́й]{.ru}", "将来一次的行为用完成体 [зайду́]{.ru}"]
      - zh: 回家的路上我顺便去了一趟面包店。
        accept: ["По доро́ге домо́й я зашёл в бу́лочную.", "По доро́ге домо́й я зашла́ в бу́лочную.", "Я зашёл в бу́лочную по доро́ге домо́й.", "Я зашла́ в бу́лочную по доро́ге домо́й."]
        rubric: ["“顺路去一下”用 [зайти́ в]{.ru} + 第四格", "[по доро́ге домо́й]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Как друзья́ шли до речно́го вокза́ла? Что они́ ви́дели с теплохо́да? Что рассказа́л Ди́ма о де́душке? Что друзья́ де́лали в Свия́жске? Как они́ верну́лись домо́й?]{.ru}"
        length: 70–100
        model: "Пя́того ма́я друзья́ шли до речно́го вокза́ла пешко́м. Они́ перешли́ че́рез Каза́нку по мосту́ и прошли́ ми́мо Кремля́. Теплохо́д проплыва́л ми́мо острово́в, дереве́нь и церкве́й. Ди́ма рассказа́л, что его́ де́душка в мо́лодости переплы́л здесь Во́лгу. В Свия́жске друзья́ зашли́ в монасты́рь, в деревя́нную це́рковь и в кафе́, где е́ли пироги́ с ры́бой. Ве́чером на при́стани их ждал па́па Ди́мы: он зае́хал за ни́ми на маши́не. Они́ прое́хали по мосту́ и ми́мо большо́го стадио́на."
        rubric: ["回答全部五个问题", "[перешли́]{.ru}、[прошли́ ми́мо]{.ru}、[зашли́ в]{.ru}、[зае́хал за]{.ru} 用对", "前置词后的格用对"]
        notes: 范文约 80 词，三个前缀都用了：[пере-]{.ru} 越过（[перешли́, переплы́л]{.ru}），[про-]{.ru} 经过（[прошли́, проплыва́л, прое́хали]{.ru}），[за-]{.ru} 顺路进去（[зашли́]{.ru}）和顺路去接（[зае́хал за ни́ми]{.ru}）。[где е́ли пироги́]{.ru} 用 [где]{.ru} 引出地点从句，也可以拆成两句。

  - id: e6
    type: open
    task: 作文：《从家到学校》。
    items:
      - prompt: 写写你每天从家到学校（或单位）的路：从哪儿经过，要不要过马路、过桥，路上常顺便去哪儿。再写一次路上发生的特别的事。
        length: 100–150
        model: "Ка́ждый день я е́зжу в университе́т на метро́. Снача́ла я выхожу́ из до́ма и прохожу́ ми́мо па́рка. Пото́м я перехожу́ у́лицу и вхожу́ в метро́. Е́хать на́до шесть ста́нций. В метро́ я обы́чно чита́ю. По доро́ге домо́й я ча́сто захожу́ в бу́лочную и покупа́ю хлеб.\n\nНо одна́жды я чита́л в метро́ интере́сную кни́гу и прое́хал свою́ ста́нцию! Я вы́шел на сле́дующей ста́нции и пое́хал обра́тно. На уро́к я, коне́чно, опозда́л.\n\nТепе́рь я чита́ю в метро́ ме́ньше. А е́сли у меня́ есть вре́мя, я иду́ домо́й пешко́м: так интере́снее."
        rubric: ["写清每天的路线（未完成体）和一次特别的经历（完成体）", "至少用三个本课或前几课的前缀动词，前置词和格用对", "100–150 词，分段"]
        notes: 范文第一段写每天的路，全用未完成体现在时（[выхожу́, прохожу́, перехожу́, вхожу́, захожу́]{.ru}）；第二段写那一次坐过了站，换成完成体过去时（[прое́хал, вы́шел]{.ru}）。“坐过站”俄语说 [прое́хать свою́ ста́нцию / остано́вку]{.ru}。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊，给北京的一位朋友写信，介绍斯维亚日斯克：怎么去的，路上看见了什么，在岛上去了哪些地方。
        length: 80–120
        model: "Приве́т, Ли!\n\nКак ты? Я сейча́с в Каза́ни, у моего́ ру́сского дру́га Ди́мы. Сего́дня мы е́здили в Свия́жск. Э́то ма́ленький ста́рый го́род на о́строве.\n\nМы плы́ли туда́ на теплохо́де два часа́. Теплохо́д проплыва́л ми́мо зелёных острово́в и ма́леньких дереве́нь. Ди́ма рассказа́л, что его́ де́душка в мо́лодости переплы́л здесь Во́лгу!\n\nВ Свия́жске мы зашли́ в ста́рый монасты́рь и в деревя́нную це́рковь, а пото́м в кафе́. Там я в пе́рвый раз попро́бовал пиро́г с ры́бой. О́чень вку́сно!\n\nЕ́сли ты бу́дешь в Росси́и, обяза́тельно приезжа́й сюда́.\n\nТвой Ван Лэй"
        rubric: ["有称呼和落款", "讲清怎么去的、路上看见什么、去了哪些地方", "[проплыва́л ми́мо]{.ru}、[переплы́л]{.ru}、[зашли́ в]{.ru} 等用对"]
        notes: 范文按“在哪儿—路上—岛上—邀请”分段。[е́здили в Свия́жск]{.ru} 用不定向过去时，表示去了又回来；路上那段经过用 [плы́ли, проплыва́л]{.ru}。结尾一句 [Е́сли ты бу́дешь…, приезжа́й]{.ru} 是第一册学过的条件句。
