lesson: B2-L01
grammar: "名词复数第二格（一）：以辅音、[-й]{.ru}、[-ь]{.ru} 结尾的名词加 [-ов, -ев, -ей]{.ru}；数词 1、2–4、5 以上与名词连用。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数第二格填空。
    why: "硬辅音结尾加 [-ов]{.ru}（[мандари́нов, ро́дственников, семина́ров]{.ru}）；[-й]{.ru} 换成 [-ев]{.ru}（[музе́ев, трамва́ев]{.ru}）；[ж, ш, ч, щ]{.ru} 和 [-ь]{.ru} 结尾加 [-ей]{.ru}（[веще́й]{.ru}）。第 1 题 [вещь]{.ru} 是阴性，同样加 [-ей]{.ru}，重音移到词尾。第 5 题 [стихи́]{.ru} 复数第一格重音在词尾，复数第二格也在词尾：[стихо́в]{.ru}。第 6 题 [ме́сяц]{.ru} 以 [-ц]{.ru} 结尾、词尾不重读，加 [-ев]{.ru}，不要写成 [ме́сяцов]{.ru}。"
    items:
      - stem: Ско́лько у тебя́ ___?
        hint: вещь
        accept: ["веще́й"]
      - stem: В чемода́не бы́ло мно́го ___.
        hint: мандари́н
        accept: ["мандари́нов"]
      - stem: В Пеки́не у Ван Лэ́я мно́го ___.
        hint: ро́дственник
        accept: ["ро́дственников"]
      - stem: В Москве́ мно́го ___ и теа́тров.
        hint: музе́й
        accept: ["музе́ев"]
      - stem: А́нна чита́ет кни́гу ___ Ли Бо.
        hint: стихи́
        accept: ["стихо́в"]
      - stem: Ван Лэй бу́дет в Москве́ ещё пять ___.
        hint: ме́сяц
        accept: ["ме́сяцев"]
      - stem: В на́шем райо́не нет ___.
        hint: трамва́й
        accept: ["трамва́ев"]
      - stem: Сего́дня у А́нны нет ___.
        hint: семина́р
        accept: ["семина́ров"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "数词 2–4 后用单数第二格（第 2 题 [три пода́рка]{.ru}、第 5 题 [четы́ре ме́сяца]{.ru}），5 以上和 [мно́го, не́сколько, ско́лько]{.ru} 后用复数第二格。第 1 题 [два́дцать]{.ru} 是 5 以上的数，用 [рубле́й]{.ru}，不能只看到“二”就用 [рубля́]{.ru}。第 6 题 [ско́лько]{.ru} 后面不能用复数第一格。"
    items:
      - stem: Э́то сто́ит два́дцать ___.
        options: ["рубля́", "рубле́й"]
        answer: "рубле́й"
      - stem: У Ми́ши три ___.
        options: ["пода́рка", "пода́рков"]
        answer: "пода́рка"
      - stem: Ве́чером у нас бы́ло мно́го ___.
        options: ["го́сти", "госте́й"]
        answer: "госте́й"
      - stem: Ван Лэй купи́л не́сколько ___.
        options: ["словаря́", "словаре́й"]
        answer: "словаре́й"
      - stem: Мой друг был в Пеки́не два ___.
        options: ["ме́сяца", "ме́сяцев"]
        answer: "ме́сяца"
      - stem: Ско́лько у нас ___?
        options: ["мандари́ны", "мандари́нов"]
        answer: "мандари́нов"

  - id: e3
    type: rewrite
    task: 按例句用括号里的词改写句子。
    example:
      cue: В чемода́не пода́рки. (мно́го)
      answer: В чемода́не мно́го пода́рков.
    why: "[мно́го, ма́ло, не́сколько, нет]{.ru} 后面的名词都要从复数第一格变成复数第二格：[пода́рки → пода́рков]{.ru}，[музе́и → музе́ев]{.ru}，[карандаши́ → карандаше́й]{.ru}。第 3 题有 [нет]{.ru}，原句里的 [есть]{.ru} 要去掉。"
    items:
      - cue: На столе́ мандари́ны. (мно́го)
        accept: ["На столе́ мно́го мандари́нов."]
      - cue: В на́шем го́роде музе́и. (ма́ло)
        accept: ["В на́шем го́роде ма́ло музе́ев."]
      - cue: У Ми́ши есть карандаши́. (нет)
        accept: ["У Ми́ши нет карандаше́й."]
      - cue: В Пеки́не у Ван Лэ́я ро́дственники. (мно́го)
        accept: ["В Пеки́не у Ван Лэ́я мно́го ро́дственников."]
      - cue: В аудито́рии студе́нты. (не́сколько)
        accept: ["В аудито́рии не́сколько студе́нтов."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1、3 题 [мно́го, ма́ло]{.ru} 后用复数第二格 [пода́рков, веще́й, ро́дственников]{.ru}。第 4 题“来得正是时候”用 [кста́ти]{.ru}，不需要动词。第 5 题 [двена́дцать]{.ru} 后用复数第二格 [студе́нтов]{.ru}。"
    items:
      - zh: 箱子里礼物很多，东西很少。
        accept: ["В чемода́не мно́го пода́рков и ма́ло веще́й.", "В чемода́не мно́го пода́рков, а веще́й ма́ло.", "В чемода́не мно́го пода́рков, но ма́ло веще́й.", "В чемода́не пода́рков мно́го, а веще́й ма́ло."]
        rubric: ["[мно́го пода́рков]{.ru}、[ма́ло веще́й]{.ru}：复数第二格", "[в чемода́не]{.ru} 用第六格"]
      - zh: 王磊送给米沙一副耳机。
        accept: ["Ван Лэй подари́л Ми́ше нау́шники.", "Ми́ше Ван Лэй подари́л нау́шники."]
        rubric: ["[подари́ть кому́ что]{.ru}：[Ми́ше]{.ru} 用第三格", "[нау́шники]{.ru} 只有复数"]
      - zh: 王磊在北京有很多亲戚。
        accept: ["У Ван Лэ́я в Пеки́не мно́го ро́дственников.", "В Пеки́не у Ван Лэ́я мно́го ро́дственников.", "У Ван Лэ́я мно́го ро́дственников в Пеки́не."]
        rubric: ["[у кого́]{.ru} 表示“某人有”", "[мно́го ро́дственников]{.ru}：复数第二格"]
      - zh: 你的礼物来得正是时候！
        accept: ["Твой пода́рок о́чень кста́ти!", "Твой пода́рок кста́ти!", "Ваш пода́рок о́чень кста́ти!", "Ваш пода́рок кста́ти!"]
        rubric: ["用 [кста́ти]{.ru}"]
      - zh: 我们班有十二个学生。
        accept: ["В на́шей гру́ппе двена́дцать студе́нтов.", "У нас в гру́ппе двена́дцать студе́нтов.", "В на́шей гру́ппе двена́дцать челове́к.", "У нас в гру́ппе двена́дцать челове́к."]
        rubric: ["[двена́дцать]{.ru} 后用复数第二格 [студе́нтов]{.ru}（或 [челове́к]{.ru}）"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Когда́ Ван Лэй сно́ва был в Москве́? Кто его́ встреча́л? Что бы́ло в его́ чемода́не? Что он подари́л ка́ждому? Почему́ пода́рок Ива́ну Серге́евичу о́чень кста́ти? Каку́ю но́вость рассказа́ла А́нна?]{.ru}"
        length: 50–80
        model: "Оди́ннадцатого февраля́ Ван Лэй сно́ва был в Москве́. Его́ встреча́ли Ива́н Серге́евич и А́нна. В чемода́не бы́ло ма́ло веще́й и мно́го пода́рков. Ива́ну Серге́евичу Ван Лэй подари́л кита́йские ша́хматы, Мари́и Никола́евне — ве́ер, А́нне — кни́гу стихо́в Ли Бо, а Ми́ше — нау́шники. Пода́рок Ива́ну Серге́евичу о́чень кста́ти: два́дцать тре́тьего февраля́ — День защи́тника Оте́чества. А А́нна рассказа́ла, что тепе́рь у Ван Лэ́я есть языково́й партнёр — её одногру́ппник Ди́ма."
        rubric: ["回答全部六个问题", "复数第二格用对：[мно́го пода́рков]{.ru}、[ма́ло веще́й]{.ru}", "日期 [оди́ннадцатого февраля́]{.ru} 用第二格", "[подари́ть кому́ что]{.ru}：人用第三格"]
        notes: "范文约 70 词，按问题顺序，每个问题一两句。列举礼物时只在第一处写出动词 [подари́л]{.ru}，后面用破折号代替，课文里也是这样写的。课文中的对话改成叙述：[А́нна рассказа́ла, что…]{.ru}。"
