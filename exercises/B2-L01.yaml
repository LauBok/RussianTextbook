lesson: B2-L01
grammar: "名词复数第二格（一）：辅音、-й、-ь 结尾名词的 [-ов, -ев, -ей]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "硬辅音结尾加 [-ов]{.ru}；[-й]{.ru} 换成 [-ев]{.ru}；[ж, ш, ч, щ]{.ru} 和 [-ь]{.ru} 结尾加 [-ей]{.ru}。第 5 题 [пода́рок]{.ru} 的 о 是隐现元音，变格时脱落。第 6 题是本组最容易错的一题：数词 2–4 后用单数第二格 [ме́сяца]{.ru}，不是复数第二格。第 7 题 [-ц]{.ru} 结尾、词尾不重读，加 [-ев]{.ru}；比较 [оте́ц → отцо́в]{.ru}。第 8 题 [мно́го]{.ru} 后两个名词都用复数第二格。"
    items:
      - stem: В на́шей гру́ппе де́сять ___.
        hint: студе́нт
        accept: ["студе́нтов"]
      - stem: В Москве́ мно́го ___.
        hint: музе́й
        accept: ["музе́ев"]
      - stem: У Ми́ши нет ___.
        hint: каранда́ш
        accept: ["карандаше́й"]
      - stem: Ско́лько у тебя́ ___?
        hint: слова́рь
        accept: ["словаре́й"]
      - stem: На столе́ не́сколько ___.
        hint: пода́рок
        accept: ["пода́рков"]
      - stem: Ван Лэй был до́ма два ___.
        hint: ме́сяц
        accept: ["ме́сяца"]
      - stem: До экза́менов ещё пять ___.
        hint: ме́сяц
        accept: ["ме́сяцев"]
      - stem: В э́том го́роде мно́го ___ и па́рков.
        hint: теа́тр
        accept: ["теа́тров"]

  - id: e2
    type: open
    task: 缩写。按下列问题回答，连成一段。
    why: 按问题顺序作答，每个问题用一两句话；问题里的词可以直接用进答句；保留课文中的数量表达，这正是本课要练的形式。
    items:
      - prompt: "[Когда́ Ван Лэй верну́лся в Москву́? Кто его́ встре́тил? Что бы́ло в его́ чемода́нах? Како́й пра́здник был на сле́дующий день? Что Ван Лэй хо́чет де́лать в Москве́?]{.ru}"
        length: 50–80
        model: "Два́дцать второ́го февраля́ Ван Лэй верну́лся в Москву́. В аэропорту́ его́ встре́тили А́нна и Ми́ша. У него́ бы́ло два чемода́на, и в них бы́ло мно́го пода́рков: чай, па́лочки, календа́рь и игру́шка для Ми́ши. На сле́дующий день был пра́здник — День защи́тника Оте́чества. Второ́й семе́стр начина́ется в понеде́льник. В Москве́ мно́го музе́ев, теа́тров и па́рков, и Ван Лэй хо́чет уви́деть всё."
        rubric: ["回答全部五个问题", "数量表达用对：[два чемода́на]{.ru}、[мно́го пода́рков]{.ru}", "日期 [два́дцать второ́го февраля́]{.ru}"]
        notes: 范文约 60 词，按问题顺序组织，每句对应一个问题。

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题“他有”用 [у него́]{.ru}，两个名词都用复数第二格。第 4 题“四个月”用单数第二格 [ме́сяца]{.ru}；“离考试还有”用 [до]{.ru} + 第二格，[экза́менов]{.ru} 是复数第二格。"
    items:
      - zh: 他有很多词典和教科书。
        accept: ["У него́ мно́го словаре́й и уче́бников."]
        rubric: ["[мно́го]{.ru} 后用复数第二格：[словаре́й]{.ru}、[уче́бников]{.ru}"]
      - zh: 我们班有十二个学生。
        accept: ["В на́шей гру́ппе двена́дцать студе́нтов.", "У нас в гру́ппе двена́дцать студе́нтов."]
        rubric: ["[двена́дцать]{.ru} 后用复数第二格 [студе́нтов]{.ru}"]
      - zh: 莫斯科有很多公园和剧院。
        accept: ["В Москве́ мно́го па́рков и теа́тров.", "В Москве́ мно́го теа́тров и па́рков."]
        rubric: ["[па́рков]{.ru}、[теа́тров]{.ru}：复数第二格"]
      - zh: 离考试还有四个月。
        accept: ["До экза́менов ещё четы́ре ме́сяца."]
        rubric: ["[четы́ре ме́сяца]{.ru}：2–4 后用单数第二格", "[до экза́менов]{.ru}"]
