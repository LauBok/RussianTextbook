lesson: B4-L14
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Как меняется степь утром и днём? Что Егорушка видит по дороге? Почему автор спрашивает: «Счастлив ли этот красавец?»]{.ru}"
        length: 100–140
        model: "Рано утром степь оживает. Солнце поднимается из-за города, по земле бегут жёлтые полосы света, и вся степь как будто улыбается и сверкает росой. Трава оживает, кричат птицы, в траве поют кузнечики и сверчки. Но скоро роса испаряется, наступает жара, и степь становится унылой и однообразной. По дороге Егорушка видит холмы, равнину, грачей, коршуна, ветряную мельницу, которая похожа на маленького человечка. Иногда мелькают череп, булыжник или суслик. Потом им навстречу едет воз со снопами, на холме стоит одинокий тополь, а за ним крестьяне косят пшеницу. Автор спрашивает, счастлив ли тополь, потому что тополь всю жизнь стоит один, и летом, и зимой. Мне кажется, что одинокий тополь похож на самого Егорушку, который уехал от матери и чувствует себя одиноким."
        rubric: ["答出清晨的生机和正午的沉闷两个阶段", "列出路上看到的至少五样东西", "说明杨树的孤独，并联系到叶戈鲁什卡"]
        notes: "第 3 题没有唯一答案。关键是看出叙述者在这里离开了单纯的描写，用一个问句表达同情；杨树的“一辈子孤零零”和离开母亲的孩子有相通之处。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[зной]{.ru}"
        accept: ["Сильная жара.", "Очень жаркая погода.", "Сильная летняя жара."]
        rubric: ["说明是酷热"]
      - zh: "[унылый]{.ru}"
        accept: ["Грустный и скучный.", "Скучный, печальный.", "Такой, который вызывает тоску."]
        rubric: ["说明是沉闷、忧郁的"]
      - zh: "[монотонный]{.ru}"
        accept: ["Однообразный, без изменений.", "Скучный и однообразный.", "Всё время одинаковый."]
        rubric: ["说明是单调、没有变化的"]
      - zh: "[встречный]{.ru}"
        accept: ["Такой, который едет или идёт навстречу.", "Который движется навстречу.", "Человек, которого встречаешь по дороге."]
        rubric: ["说明是迎面而来的"]
      - zh: "[надоесть]{.ru}"
        accept: ["Стать скучным, неприятным.", "Стать скучным, потому что долго продолжается.", "Стать неинтересным, потому что повторяется много раз."]
        rubric: ["说明是使人厌烦、腻了"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题第 1 段太阳升起的过程写成一个用分号隔开的长句。第 2 题短句写正午的寂静和炎热，草原失去生气。第 3 题从 [Как душно и уныло!]{.ru} 起叙述换成现在时，让读者和人物一起经历时间。第 4 题像小人儿的风车在选段开头和结尾各出现一次，首尾呼应。第 5 题“被欺骗的草原”把草原写成人，是拟人。第 6 题同样的三项列举加省略号，表现路途单调。第 7 题问句说的是山上那棵孤零零的杨树。第 8 题 [вжжи]{.ru} 是割麦人挥动镰刀的声音。"
    items:
      - stem: Восход солнца в первом абзаце описан ___.
        options: [одним длинным предложением, несколькими короткими предложениями, в разговоре]
        answer: одним длинным предложением
      - stem: Короткие фразы «Трава поникла, жизнь замерла» передают ___.
        options: [тишину и жару, движение и радость, страх]
        answer: тишину и жару
      - stem: Начиная со слов «Как душно и уныло!», автор рассказывает в ___ времени.
        options: [настоящем, прошедшем, будущем]
        answer: настоящем
      - stem: Мельница, похожая на маленького человечка, появляется ___.
        options: [в начале и в конце отрывка, только в начале, только в середине]
        answer: в начале и в конце отрывка
      - stem: Слова «обманутая степь» — пример ___.
        options: [олицетворения, рифмы, гиперболы]
        answer: олицетворения
      - stem: Перечисления вроде «небо, равнину, холмы…» передают ___.
        options: [однообразие пути, радость путешественников, много разных картин]
        answer: однообразие пути
      - stem: Вопрос «Счастлив ли этот красавец?» относится к ___.
        options: [тополю, коршуну, Дениске]
        answer: тополю
      - stem: «Вжжи, вжжи!» — это звук ___.
        options: [кос, птиц, ветра]
        answer: кос

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。动词（副动词除外）一律用过去时。
    why: "第 1 题主语 [равнина]{.ru} 阴性，过去时 [расстилалась]{.ru}。第 2 题 [коснуться чего]{.ru} 要求第二格，主语 [луч]{.ru} 阳性：[коснулся]{.ru}。第 3 题主语 [роса]{.ru} 阴性，完成体过去时 [испарилась]{.ru}。第 4 题 [взмахивать чем]{.ru} 要求第五格，副动词 [взмахивая]{.ru} 后接 [крыльями]{.ru}。第 5 题 [надоесть кому]{.ru}：厌烦的事物作主语，感到厌烦的人用第三格；主语 [дорога]{.ru} 阴性，过去时 [надоела]{.ru}，不能写成无人称的 [надоело]{.ru}。第 6 题 [ползти]{.ru} 的完成体 [поползти]{.ru}，阴性过去时 [поползла]{.ru}。"
    items:
      - stem: Перед ними ___ бесконечная равнина.
        hint: расстилаться
        accept: ["расстилалась"]
      - stem: Тёплый луч ___ его спины.
        hint: коснуться
        accept: ["коснулся"]
      - stem: Через час роса ___, и стало жарко.
        hint: испариться
        accept: ["испарилась"]
      - stem: Коршун летел над землёй, плавно ___ крыльями.
        hint: взмахивать
        accept: ["взмахивая"]
      - stem: Длинная дорога скоро ___ мальчику.
        hint: надоесть
        accept: ["надоела"]
      - stem: По земле ___ широкая жёлтая полоса.
        hint: поползти
        accept: ["поползла"]

  - id: e5
    type: rewrite
    task: 把下列现在时的句子改成过去时，注意体的选择保持不变。
    example:
      cue: Бричка бежит, а Егорушка видит всё одно и то же.
      answer: Бричка бежала, а Егорушка видел всё одно и то же.
    why: "原文用现在时（未完成体）写持续、反复的动作，改成过去时仍用未完成体。第 1 题 [носятся]{.ru} 改为 [носились]{.ru}。第 2 题 [летит]{.ru} 改为 [летел]{.ru}，副动词 [взмахивая]{.ru} 没有时间，不用改。原文下一句 [и вдруг останавливается в воздухе]{.ru} 是用现在时讲一次具体的动作，改成过去时要换成完成体 [остановился]{.ru}，所以不放进本题。第 3 题 [машет]{.ru} 改为 [махала]{.ru}，主语 [мельница]{.ru} 阴性。第 4 题 [стоят, взмахивают]{.ru} 改为 [стояли, взмахивали]{.ru}。第 5 题 [глядит]{.ru} 改为 [глядела]{.ru}，主语 [собака]{.ru} 阴性。"
    items:
      - cue: Над травой носятся грачи.
        accept: ["Над травой носились грачи."]
      - cue: Летит коршун над самой землёй, плавно взмахивая крыльями.
        accept: ["Летел коршун над самой землёй, плавно взмахивая крыльями.", "Коршун летел над самой землёй, плавно взмахивая крыльями."]
      - cue: Вдали машет крыльями мельница.
        accept: ["Вдали махала крыльями мельница.", "Вдали мельница махала крыльями."]
      - cue: Шесть косарей стоят рядом и взмахивают косами.
        accept: ["Шесть косарей стояли рядом и взмахивали косами."]
      - cue: Собака равнодушно глядит на Дениску.
        accept: ["Собака равнодушно глядела на Дениску."]

  - id: e6
    type: open
    task: 概要写作。用俄语把选文压缩到 150 词左右，保留景物变化的顺序和路上的主要场景。
    items:
      - prompt: "[Изложите кратко содержание отрывка.]{.ru}"
        length: 130–170
        model: "Бричка выезжает из города, и перед путешественниками открывается бесконечная степь с холмами. Встаёт солнце. Сначала по земле бегут жёлтые полосы света, а потом вся степь сверкает росой и как будто улыбается. Трава оживает, кричат птицы, в траве поют кузнечики и сверчки. Но скоро роса испаряется, наступает жара, и степь становится унылой. Егорушка видит одно и то же: небо, равнину, холмы. Над степью летает коршун, вдали машет крыльями мельница, похожая на маленького человечка. Иногда на пути бывает что-нибудь интересное: воз со снопами, на котором спит девушка, одинокий тополь на холме. Автор задаёт вопрос, счастлив ли этот тополь, который всю жизнь стоит один. Потом бричка проезжает мимо поля, где крестьяне косят пшеницу, а одна женщина долго смотрит вслед мальчику. И снова тянется однообразная степь, а мельница всё так же далеко, как будто бежит от брички."
        rubric: ["保留顺序：日出与清晨—正午的沉闷—路上的场景—又回到单调", "写出风车、杨树、割麦这几个场景", "概括而不逐句复述，句子之间有连接", "130–170 词"]
        notes: "范文约 133 词。概要写作要舍弃细节（昆虫和鸟的名字、车夫的玩笑），保留结构：变化（清晨—正午）和反复（单调的景色、风车）。结尾回到风车，和原文一样首尾呼应。"

  - id: e7
    type: open
    task: 作文。写一篇 250–300 词的景物描写。
    items:
      - prompt: "[Дорога, которую я помню.]{.ru} 描写一次旅途中窗外的景色（火车、汽车或步行都可以），学习契诃夫的写法：写出景物随时间的变化，长句和短句交替，用拟人和声音让景物“活”起来，可以有一处抒情的插话。"
        length: 250–300
        model: "Прошлым летом мы с отцом ехали на поезде из Пекина в Шанхай. Поезд вышел рано утром, когда город ещё спал. Сначала за окном тянулись серые дома, заводы, мосты, потом город кончился, и перед нами открылись поля. Солнце поднялось над далёкими горами, его лучи легли на зелёные поля, побежали по каналам, осветили маленькие деревни, и вдруг вся равнина засверкала, как будто проснулась и улыбнулась нам. На полях уже работали крестьяне. Они поднимали головы и смотрели на поезд, а потом снова возвращались к работе. Над водой летали белые птицы. В вагоне пахло чаем, кто-то смеялся, проводница предлагала газеты. Но к полудню стало жарко. Поля стали одинаковыми. Птицы исчезли. Отец уснул. Разговоры в вагоне смолкли, и все пассажиры, казалось, тоже заснули. Я смотрел в окно и видел одно и то же: поле, дорогу, деревню, снова поле… Иногда мелькали маленькая станция, старый грузовик на дороге или мальчик на велосипеде, который махал поезду рукой, и опять тянулись поля. Мне казалось, что мы никогда не доедем. Даже колёса, казалось, стучали устало и сердито: «Далеко, далеко…» Вдруг на краю поля я увидел одинокое дерево. Вокруг не было ни домов, ни людей, только жёлтая земля и белое небо. Кто посадил его здесь? Скучно ли ему стоять одному, когда мимо каждый день проходят поезда с людьми, которые спешат в большие города? Я долго смотрел на него, пока оно не исчезло. К вечеру жара спала. Небо стало розовым, потом лиловым, в деревнях появились первые огни, и поля снова ожили: над ними опять полетели птицы. Вечером мы приехали в Шанхай. Я уже забыл многие подробности этой поездки, но то одинокое дерево помню до сих пор."
        rubric: ["景物随时间变化（清晨—正午—傍晚）", "长句和短句交替，有列举和省略号", "至少一处拟人和一处声音或气味的描写", "有一处抒情的插话或问句", "250–300 词"]
        notes: "范文约 264 词，结构模仿选文：日出时的长句（[его лучи легли…, побежали…, осветили…]{.ru}）；正午的短句（[Поля стали одинаковыми. Птицы исчезли. Отец уснул.]{.ru}）；单调的三项列举加省略号；路上偶尔“闪过”的东西（[мелькали…]{.ru}）；对孤树的提问。结尾一句点明这段记忆为什么留下来。"
