lesson: B2-L10
grammar: "名词复数第六格：[-ах]{.ru}（硬变化）与 [-ях]{.ru}（软变化）；复数第六格以复数第一格的词干为准。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数第六格填空。
    why: "硬辅音、[-а]{.ru}、[-о]{.ru} 结尾的词加 [-ах]{.ru}（第 1、3 题）；[-ь]{.ru}、[-й]{.ru}、[-ие]{.ru} 结尾的词加 [-ях]{.ru}（第 4、5、6、7、8 题）。第 2 题 [го́род]{.ru} 的复数是 [города́]{.ru}，重音在词尾，第六格也是 [города́х]{.ru}。第 5 题 [царь]{.ru} 变格时重音移到词尾。第 8 题 [-ие]{.ru} 结尾的词复数第六格是 [-иях]{.ru}，不要写成单数第六格的 [-ии]{.ru}。第 9 题 [друг]{.ru} 的复数是 [друзья́]{.ru}，第六格要从复数第一格变出来：[друзья́х]{.ru}。"
    items:
      - stem: Мы ча́сто говори́м о ___.
        hint: фильм
        accept: ["фи́льмах"]
      - stem: Ди́ма расска́зывает о ___ на Во́лге.
        hint: го́род
        accept: ["города́х"]
      - stem: В ___ сейча́с мно́го студе́нтов.
        hint: библиоте́ка
        accept: ["библиоте́ках"]
      - stem: Ма́сленицу пра́зднуют на ___.
        hint: пло́щадь
        accept: ["площадя́х"]
      - stem: Ди́ма мно́го зна́ет о ___.
        hint: царь
        accept: ["царя́х"]
      - stem: Мари́я Никола́евна спра́шивала о ___.
        hint: преподава́тель
        accept: ["преподава́телях"]
      - stem: В ___ Москвы́ мно́го карти́н.
        hint: музе́й
        accept: ["музе́ях"]
      - stem: Мно́гие студе́нты живу́т в ___.
        hint: общежи́тие
        accept: ["общежи́тиях"]
      - stem: Ма́ма лю́бит говори́ть о ___.
        hint: друг
        accept: ["друзья́х"]

  - id: e2
    type: rewrite
    task: 把句中前置词后面的名词变成复数。
    example:
      cue: Я ду́маю о пра́зднике.
      answer: Я ду́маю о пра́здниках.
    why: "先想复数第一格，再换词尾：[па́рки → па́рках]{.ru}，[пи́сьма → пи́сьмах]{.ru}，[аудито́рии → аудито́риях]{.ru}。第 3 题 [письмо́]{.ru} 的复数重音移到词干：[пи́сьма, пи́сьмах]{.ru}。第 4 题 [экза́мен]{.ru} 以元音开头，前面写 [об]{.ru}。第 6 题 [сосе́д]{.ru} 的复数按软变化：[сосе́ди → сосе́дях]{.ru}。"
    items:
      - cue: Мы гуля́ли в па́рке.
        accept: ["Мы гуля́ли в па́рках."]
      - cue: Ми́ша расска́зывает о шко́ле.
        accept: ["Ми́ша расска́зывает о шко́лах."]
      - cue: Студе́нты говоря́т о письме́.
        accept: ["Студе́нты говоря́т о пи́сьмах."]
      - cue: Ди́ма ча́сто ду́мает об экза́мене.
        accept: ["Ди́ма ча́сто ду́мает об экза́менах."]
      - cue: Мы занима́емся в аудито́рии.
        accept: ["Мы занима́емся в аудито́риях."]
      - cue: Ба́бушка спра́шивала о сосе́де.
        accept: ["Ба́бушка спра́шивала о сосе́дях."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1、4 题前置词后是复数，用复数第六格 [-ах / -ях]{.ru}；第 2 题 [о]{.ru} 后面的 [обы́чаях]{.ru} 是复数第六格，不是复数第一格 [обы́чаи]{.ru}；第 3 题 [мно́го]{.ru} 后面用复数第二格 [библиоте́к]{.ru}，不是第六格；第 5 题 [два]{.ru} 后面用单数第二格 [килогра́мма]{.ru}。注意区分：前置词 [в, на, о]{.ru} 要求第六格，[мно́го]{.ru}、数词要求第二格。"
    items:
      - stem: Ма́сленицу пра́зднуют в ___.
        options: [шко́лы, шко́лах, школ]
        answer: шко́лах
      - stem: Ди́ма лю́бит расска́зывать об ___.
        options: [обы́чаи, обы́чаях, обы́чаев]
        answer: обы́чаях
      - stem: В Москве́ мно́го ___.
        options: [библиоте́ки, библиоте́ках, библиоте́к]
        answer: библиоте́к
      - stem: Мы с Ди́мой ча́сто встреча́емся в ___.
        options: [библиоте́ки, библиоте́ках, библиоте́к]
        answer: библиоте́ках
      - stem: Ма́ма купи́ла два ___ муки́.
        options: [килогра́мма, килогра́ммов, килогра́ммах]
        answer: килогра́мма

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题 [о]{.ru} 后两个名词都用复数第六格，第二个 [о]{.ru} 可以省略。第 2 题“在广场上”用 [на площадя́х]{.ru}，不说 [в]{.ru}。第 3 题不定人称句“人们庆祝”用复数第三人称 [пра́зднуют]{.ru}，不加主语。第 4 题“图书馆”“公园”都用复数第六格。"
    items:
      - zh: 我们谈电影、谈书。
        accept: ["Мы говори́м о фи́льмах и кни́гах.", "Мы говори́м о фи́льмах и о кни́гах.", "Мы разгова́риваем о фи́льмах и кни́гах.", "Мы разгова́риваем о фи́льмах и о кни́гах."]
        rubric: ["[о фи́льмах]{.ru}、[о кни́гах]{.ru}：复数第六格", "动词 [говори́ть]{.ru} 或 [разгова́ривать]{.ru}"]
      - zh: 谢肉节在公园里和广场上庆祝。
        accept: ["Ма́сленицу пра́зднуют в па́рках и на площадя́х.", "В па́рках и на площадя́х пра́зднуют Ма́сленицу.", "Ма́сленицу пра́зднуют на площадя́х и в па́рках.", "На площадя́х и в па́рках пра́зднуют Ма́сленицу.", "В па́рках и на площадя́х Ма́сленицу пра́зднуют.", "Ма́сленицу пра́зднуют и в па́рках, и на площадя́х."]
        rubric: ["[в па́рках]{.ru}、[на площадя́х]{.ru}", "不定人称句 [пра́зднуют]{.ru}，[Ма́сленицу]{.ru} 用第四格"]
      - zh: 迪马对俄罗斯的城市知道得很多。
        accept: ["Ди́ма мно́го зна́ет о города́х Росси́и.", "Ди́ма зна́ет мно́го о города́х Росси́и."]
        rubric: ["[мно́го зна́ет о]{.ru} + 第六格", "[о города́х]{.ru}：重音在词尾", "“俄罗斯的”用第二格 [Росси́и]{.ru}"]
      - zh: 你们在哪儿见面？——在图书馆和公园里。
        accept: ["— Где вы встреча́етесь? — В библиоте́ках и в па́рках.", "— Где вы встреча́етесь? — В библиоте́ках и па́рках.", "— Где вы встреча́етесь? — Мы встреча́емся в библиоте́ках и в па́рках.", "— Где вы встреча́етесь? — Мы встреча́емся в библиоте́ках и па́рках."]
        rubric: ["[встреча́ться]{.ru} 的变位 [встреча́етесь]{.ru}", "[в библиоте́ках]{.ru}、[в па́рках]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кто тако́й Ди́ма? Как ча́сто они́ с Ван Лэ́ем встреча́ются и что де́лают? О чём они́ говоря́т? Что тако́е Ма́сленица? Что бу́дет де́лать Мари́я Никола́евна?]{.ru}"
        length: 50–80
        model: "Ди́ма — друг и языково́й партнёр Ван Лэ́я. Он из Каза́ни, у́чится на второ́м ку́рсе и живёт в общежи́тии. Два ра́за в неде́лю они́ встреча́ются: во вто́рник говоря́т по-ру́сски, а в четве́рг — по-кита́йски. Они́ говоря́т о фи́льмах, о кни́гах, о пра́здниках и обы́чаях. Ско́ро Ма́сленица. Э́то ста́рый ру́сский пра́здник: лю́ди провожа́ют зи́му и едя́т блины́. Мари́я Никола́евна ку́пит муку́ и молоко́ и бу́дет печь блины́ всю неде́лю."
        rubric: ["回答全部五个问题", "至少用三个复数第六格：[о фи́льмах]{.ru}、[о кни́гах]{.ru}、[о пра́здниках]{.ru} 等", "人称和时间正确：讲迪马用第三人称，讲玛丽亚的打算用将来时"]
        notes: 范文约 70 词，每个问题一两句。第一句用破折号代替“是”介绍迪马；讲他们谈什么时，把课文里的复数第六格整组保留下来；最后一句用将来时 [ку́пит]{.ru}、[бу́дет печь]{.ru} 说玛丽亚的打算。
