lesson: B2-L37
grammar: "运动动词全表（一）：[идти́ / ходи́ть]{.ru}、[е́хать / е́здить]{.ru}、[бежа́ть / бе́гать]{.ru}、[лете́ть / лета́ть]{.ru}、[плыть / пла́вать]{.ru}；定向与不定向的用法；交通工具作主语。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里动词的现在时形式。
    why: "[бежа́ть]{.ru} 是不规则动词：[бегу́, бегу́т]{.ru} 用 [бег-]{.ru}，其余人称用 [беж-]{.ru}（第 1、6 题）。[лете́ть]{.ru} 只有第一人称单数交替成 [лечу́]{.ru}，复数第三人称是 [летя́т]{.ru}（第 2、7 题）。[плыть]{.ru} 的现在时词干是 [плыв-]{.ru}（第 3 题）。[бе́гать, лета́ть, пла́вать]{.ru} 按 [чита́ть]{.ru} 变位（第 4、5、8 题）。"
    items:
      - stem: — Ди́ма, ты где? — Я уже́ ___!
        hint: бежа́ть
        accept: ["бегу́"]
      - stem: За́втра я ___ в Каза́нь.
        hint: лете́ть
        accept: ["лечу́"]
      - stem: Смотри́, по реке́ ___ теплохо́д.
        hint: плыть
        accept: ["плывёт"]
      - stem: Ди́ма ка́ждое у́тро ___ в па́рке.
        hint: бе́гать
        accept: ["бе́гает"]
      - stem: Над водо́й ___ пти́цы.
        hint: лета́ть
        accept: ["лета́ют"]
      - stem: Куда́ вы ___? Ещё ра́но!
        hint: бежа́ть
        accept: ["бежи́те"]
      - stem: Пти́цы ___ на юг.
        hint: лете́ть
        accept: ["летя́т"]
      - stem: Ты хорошо́ ___?
        hint: пла́вать
        accept: ["пла́ваешь"]

  - id: e2
    type: choice
    task: 选择定向动词或不定向动词。
    why: "第 1、3、6 题说的是那一次、朝一个方向的移动（此刻正在跑、那天在大厅里跑、那一次坐船过河），用定向动词。第 2 题 [ча́сто]{.ru}、第 4 题 [по утра́м]{.ru}、第 7 题 [ка́ждое ле́то]{.ru} 表示经常，用不定向动词。第 5 题鸟在水面上飞来飞去，没有固定方向，用 [лета́ют]{.ru}。第 8 题 [ле́том]{.ru} 加过去时，说的是去过一趟又回来了，用 [лета́л]{.ru}。"
    items:
      - stem: Я опа́здываю, поэ́тому ___ на остано́вку.
        options: [бегу́, бе́гаю]
        answer: бегу́
      - stem: Ты ча́сто ___ домо́й?
        options: [лети́шь, лета́ешь]
        answer: лета́ешь
      - stem: Ди́ма ___ по за́лу с рюкзако́м и гита́рой.
        options: [бежа́л, бе́гал]
        answer: бежа́л
      - stem: По утра́м Ди́ма ___ в па́рке.
        options: [бежи́т, бе́гает]
        answer: бе́гает
      - stem: Над Во́лгой ___ пти́цы.
        options: [летя́т, лета́ют]
        answer: лета́ют
      - stem: Оди́н раз мы с па́пой ___ на ло́дке че́рез ре́ку.
        options: [плы́ли, пла́вали]
        answer: плы́ли
      - stem: В де́тстве Ди́ма ка́ждое ле́то ___ в Во́лге.
        options: [плыл, пла́вал]
        answer: пла́вал
      - stem: Ле́том я ___ в Пеки́н, а в сентябре́ верну́лся в Москву́.
        options: [лете́л, лета́л]
        answer: лета́л

  - id: e3
    type: choice
    task: 交通工具作主语：选择合适的动词。
    why: "火车、公共汽车、有轨电车自己移动用 [идти́]{.ru}（第 1、4 题），不用 [е́хать]{.ru}；飞机用 [лете́ть]{.ru}（第 2 题）；船用 [плыть]{.ru}（第 3 题）。人坐车才用 [е́хать]{.ru}（第 5 题）。"
    items:
      - stem: По́езд в Каза́нь ___ всю ночь.
        options: [идёт, е́дет, лети́т]
        answer: идёт
      - stem: Самолёт ___ над облака́ми.
        options: [идёт, плывёт, лети́т]
        answer: лети́т
      - stem: По Во́лге ___ большо́й теплохо́д.
        options: [плывёт, лети́т, бежи́т]
        answer: плывёт
      - stem: Вон ___ наш авто́бус!
        options: [идёт, е́дет, лети́т]
        answer: идёт
      - stem: Ди́ма обы́чно ___ домо́й на по́езде.
        options: [хо́дит, е́здит, лета́ет]
        answer: е́здит

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题是此刻正在路上，用 [лечу́]{.ru}。第 2 题“会游泳”用不定向动词 [пла́вать]{.ru}。第 3 题“每天早上”是习惯，用 [бе́гаю]{.ru}，“在公园里”用 [в па́рке]{.ru}。第 4 题“火车开一夜”是交通工具作主语，用 [идёт]{.ru}。第 5 题看见船正朝一个方向开，用 [плывёт]{.ru}。"
    items:
      - zh: 我现在正坐飞机去喀山。
        accept: ["Я сейча́с лечу́ в Каза́нь.", "Сейча́с я лечу́ в Каза́нь.", "Я лечу́ сейча́с в Каза́нь.", "Я сейча́с лечу́ в Каза́нь на самолёте.", "Сейча́с я лечу́ в Каза́нь на самолёте.", "Я сейча́с лечу́ на самолёте в Каза́нь.", "Сейча́с я лечу́ на самолёте в Каза́нь."]
        rubric: ["此刻正在路上，用定向动词 [лечу́]{.ru}", "[в Каза́нь]{.ru} 用第四格表示方向"]
      - zh: 你会游泳吗？——会，可是我只在游泳池里游。
        accept: ["— Ты уме́ешь пла́вать? — Да, но я пла́ваю то́лько в бассе́йне.", "— Ты уме́ешь пла́вать? — Уме́ю, но я пла́ваю то́лько в бассе́йне.", "— Ты уме́ешь пла́вать? — Да, но пла́ваю я то́лько в бассе́йне.", "— Ты пла́ваешь? — Да, но то́лько в бассе́йне.", "— Ты уме́ешь пла́вать? — Да, но то́лько в бассе́йне."]
        rubric: ["“会游泳”用 [уме́ть пла́вать]{.ru} 或 [пла́вать]{.ru}，不能用 [плыть]{.ru}", "[в бассе́йне]{.ru} 用第六格"]
      - zh: 我每天早上在公园里跑步。
        accept: ["Я бе́гаю в па́рке ка́ждое у́тро.", "Ка́ждое у́тро я бе́гаю в па́рке.", "Я ка́ждое у́тро бе́гаю в па́рке.", "По утра́м я бе́гаю в па́рке.", "Я бе́гаю в па́рке по утра́м.", "Я по утра́м бе́гаю в па́рке."]
        rubric: ["习惯性动作用不定向动词 [бе́гаю]{.ru}", "“每天早上”用 [ка́ждое у́тро]{.ru} 或 [по утра́м]{.ru}"]
      - zh: 去喀山的火车要开一整夜。
        accept: ["По́езд в Каза́нь идёт всю ночь.", "По́езд идёт в Каза́нь всю ночь.", "По́езд до Каза́ни идёт всю ночь.", "По́езд идёт до Каза́ни всю ночь."]
        rubric: ["火车作主语用 [идёт]{.ru}，不用 [е́дет]{.ru}", "“一整夜”用第四格 [всю ночь]{.ru}"]
      - zh: 看，河上开过来一条大船！
        accept: ["Смотри́, по реке́ плывёт большо́й теплохо́д!", "Смотри́, по реке́ плывёт больша́я ло́дка!", "Смотри́, по реке́ плывёт теплохо́д!", "Смотри́! По реке́ плывёт большо́й теплохо́д!"]
        rubric: ["此刻朝一个方向开，用定向动词 [плывёт]{.ru}", "“在河上”用 [по реке́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ и когда́ лете́ли Ван Лэй и Ди́ма? Почему́ Ван Лэй до́лго ждал дру́га? Как Ди́ма обы́чно е́здит домо́й и почему́? Что Ван Лэй ви́дел из окна́? Что Ди́ма рассказа́л о Во́лге?]{.ru}"
        length: 70–100
        model: "Пе́рвого ма́я Ван Лэй и Ди́ма лете́ли в Каза́нь, к роди́телям Ди́мы. Ван Лэй был в аэропорту́ в шесть часо́в, а Ди́ма, как всегда́, опа́здывал. Пото́м он бежа́л по за́лу с рюкзако́м и гита́рой. Обы́чно Ди́ма е́здит домо́й на по́езде: по́езд идёт всю ночь, но биле́т на самолёт доро́же. Из окна́ Ван Лэй ви́дел облака́, леса́, поля́ и ре́ки. Ди́ма показа́л ему́ Во́лгу и рассказа́л, что ле́том по ней пла́вают теплохо́ды, а в де́тстве он ка́ждое ле́то пла́вал в Во́лге. В де́вять три́дцать самолёт был в Каза́ни."
        rubric: ["回答全部五个问题", "定向与不定向动词用对：[бежа́л]{.ru}、[е́здит]{.ru}、[по́езд идёт]{.ru}、[пла́вают]{.ru}", "用第三人称叙述"]
        notes: 范文约 90 词，按问题顺序一句接一句。迪马那天在大厅里跑是一次具体的移动，用 [бежа́л]{.ru}；他平时怎么回家是习惯，用 [е́здит]{.ru}；船在伏尔加河上来往、他小时候常游泳，用 [пла́вают]{.ru}、[пла́вал]{.ru}。转述迪马的话用 [рассказа́л, что…]{.ru}。

  - id: e6
    type: open
    task: 作文：《我的一次旅行》。
    items:
      - prompt: 写一次你坐飞机、火车或船的旅行：去哪儿、和谁去、怎么去的、路上看见了什么。再写写你平时怎么出行。
        length: 100–150
        model: "Ле́том я лета́л в Пеки́н. Я лете́л оди́н, а в аэропорту́ меня́ жда́ли роди́тели. Рейс был ра́но у́тром, и я, коне́чно, боя́лся опозда́ть. Когда́ я е́хал в аэропо́рт на такси́, бы́ли про́бки, поэ́тому пото́м я бежа́л по за́лу с больши́м чемода́ном. Но я успе́л!\n\nСамолёт лете́л семь часо́в. Снача́ла я смотре́л в окно́: внизу́ бы́ли леса́, ре́ки и поля́, а пото́м то́лько облака́. Пото́м я чита́л и спал.\n\nВообще́ я не о́чень люблю́ лета́ть. Мне бо́льше нра́вится е́здить на по́езде: мо́жно смотре́ть в окно́, разгова́ривать с людьми́, пить чай. А ещё я люблю́ пла́вать на теплохо́де по реке́. Ле́том я обяза́тельно бу́ду пла́вать по Во́лге!"
        rubric: ["写清去哪儿、和谁、怎么去、路上看见了什么", "一次行程中的经过用定向动词：[лете́л]{.ru}、[е́хал]{.ru}、[бежа́л]{.ru}", "去过一趟、平时的习惯和爱好用不定向动词：[лета́л]{.ru}、[е́здить]{.ru}、[пла́вать]{.ru}", "100–150 词，分段"]
        notes: 范文分三段：第一段交代去了哪儿（[лета́л в Пеки́н]{.ru}，去过一趟又回来），再讲那天路上的经过（[е́хал]{.ru}、[бежа́л]{.ru}，定向）；第二段写飞机上看见的东西；第三段讲平时的出行习惯和爱好，全用不定向动词。开头用不定向、讲经过时换成定向，这是叙述旅行最常见的写法。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊，5 月 1 日晚上到了迪马家。给安娜写一封短信：路上怎么样，迪马为什么差点误了飞机，你从飞机上看见了什么，明天打算做什么。用上称呼和落款。
        length: 80–120
        model: "Приве́т, А́ня!\n\nМы уже́ в Каза́ни! Ты зна́ешь Ди́му: он, как всегда́, опа́здывал. Я до́лго ждал его́ в аэропорту́, а пото́м он бежа́л по за́лу с рюкзако́м и гита́рой. Но мы успе́ли.\n\nСамолёт лете́л бы́стро, и я всё вре́мя смотре́л в окно́. Снача́ла мы лете́ли над облака́ми, а пото́м я уви́дел Во́лгу. Она́ о́чень больша́я! Ди́ма говори́т, что ле́том по Во́лге пла́вают теплохо́ды.\n\nРоди́тели Ди́мы о́чень до́брые. За́втра мы бу́дем ходи́ть по го́роду.\n\nПереда́й приве́т па́пе, ма́ме и Ми́ше!\n\nТвой Ван Лэй"
        rubric: ["有称呼（[Приве́т, А́ня!]{.ru} 或 [Дорога́я А́нна!]{.ru}）和落款（[Твой Ван Лэй]{.ru}）", "回答提示里的四点", "定向与不定向动词用对", "结尾问候安娜的家人"]
        notes: 给朋友的信用 [ты]{.ru}，称呼可以用小名 [А́ня]{.ru}，结尾常写 [Переда́й приве́т…]{.ru} 和 [Твой / Твоя́ …]{.ru}。范文按“到了—路上—看见—明天”的顺序分段。[лете́ли над облака́ми]{.ru} 是那一次飞行的经过，用定向；[пла́вают теплохо́ды]{.ru} 是经常的情形，用不定向；[бу́дем ходи́ть по го́роду]{.ru} 是在城里到处走。
