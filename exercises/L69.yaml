lesson: L69
grammar: "四季的表达：[зимо́й, весно́й, ле́том, о́сенью]{.ru}（第五格作副词，不加前置词）；天气的表达：[Кака́я сего́дня пого́да?]{.ru}、[идёт дождь / снег]{.ru}、无人称句、气温。"
exercises:

  - id: e1
    type: fill
    task: 写出表示“在……季节”的形式。
    why: 季节名词的第五格直接当副词用，不加前置词：[зима́ → зимо́й]{.ru}，[весна́ → весно́й]{.ru}，[ле́то → ле́том]{.ru}，[о́сень → о́сенью]{.ru}。[о́сень]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，变 [-ью]{.ru}；不要写成 [в о́сени]{.ru}。
    items:
      - stem: ___ в Москве́ хо́лодно и идёт снег.
        hint: зима́
        accept: [Зимо́й]
      - stem: ___ та́ет снег.
        hint: весна́
        accept: [Весно́й]
      - stem: ___ в Пеки́не о́чень жа́рко.
        hint: ле́то
        accept: [Ле́том]
      - stem: ___ ча́сто идёт дождь.
        hint: о́сень
        accept: [О́сенью]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: 季节用第五格、不加前置词（[зимо́й]{.ru}）；月份用 [в]{.ru} + 第六格（[в ноябре́]{.ru}）；星期用 [в]{.ru} + 第四格（[в суббо́ту]{.ru}）。第 4 题“下雪”只能用 [идёт]{.ru}，即使是经常发生也不用 [хо́дит]{.ru}。
    items:
      - stem: ___ мы с Ми́шей хо́дим на като́к.
        options: [Зимо́й, В зи́му, В зиме́]
        answer: Зимо́й
      - stem: В Москве́ зима́ ча́сто начина́ется ___.
        options: [ноябрём, в ноябре́, в ноя́брь]
        answer: в ноябре́
      - stem: ___ мы е́дем на да́чу.
        options: [Суббо́той, В суббо́ту, В суббо́те]
        answer: В суббо́ту
      - stem: В Пеки́не снег ___ ре́дко.
        options: [идёт, хо́дит, е́дет]
        answer: идёт
      - stem: Ле́том в Москве́ ча́сто ___ дождь.
        options: [идёт, хо́дит, бы́ло]
        answer: идёт

  - id: e3
    type: rewrite
    task: 按例句回答问题。
    placeholder: … тепло́ / хо́лодно / идёт …
    example:
      cue: Кака́я пого́да в Москве́ зимо́й? (хо́лодно, снег)
      answer: Зимо́й в Москве́ хо́лодно, ча́сто идёт снег.
    why: 回答天气用无人称句（[хо́лодно, тепло́, жа́рко]{.ru}）和 [идёт дождь / снег]{.ru}。季节副词放在句首，回答的重点放在句末。
    items:
      - cue: Кака́я пого́да в Москве́ ле́том? (тепло́, дождь)
        accept: ["Ле́том в Москве́ тепло́, ча́сто идёт дождь.", "Ле́том в Москве́ тепло́, но ча́сто идёт дождь.", "Ле́том в Москве́ тепло́ и ча́сто идёт дождь."]
      - cue: Кака́я пого́да в Пеки́не о́сенью? (тепло́, со́лнечно)
        accept: ["О́сенью в Пеки́не тепло́ и со́лнечно.", "О́сенью в Пеки́не тепло́, со́лнечно."]
      - cue: Кака́я сего́дня пого́да? (ми́нус пять, снег)
        accept: ["Сего́дня ми́нус пять, идёт снег.", "Сего́дня ми́нус пять и идёт снег."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1 题“下雪了”就是 [Идёт снег]{.ru}，现在时。第 3 题“冬天”不加前置词。第 4 题“最喜欢的季节”用 [люби́мое вре́мя го́да]{.ru}。
    items:
      - zh: 看，下雪了！
        accept: ["Смотри́, идёт снег!", "Смотри́те, идёт снег!"]
        rubric: ["[идёт снег]{.ru}，用 [идти́]{.ru}"]
      - zh: ——今天天气怎么样？——零下五度，刮大风。
        accept: ["— Кака́я сего́дня пого́да? — Ми́нус пять, си́льный ве́тер.", "— Кака́я пого́да сего́дня? — Ми́нус пять, си́льный ве́тер.", "— Кака́я сего́дня пого́да? — Сего́дня ми́нус пять, си́льный ве́тер."]
        rubric: ["[Кака́я сего́дня пого́да?]{.ru}", "[ми́нус пять]{.ru}", "[си́льный ве́тер]{.ru}"]
      - zh: 北京冬天也冷，可是很少下雪。
        accept: ["Зимо́й в Пеки́не то́же хо́лодно, но снег идёт ре́дко.", "В Пеки́не зимо́й то́же хо́лодно, но снег идёт ре́дко.", "Зимо́й в Пеки́не то́же хо́лодно, но ре́дко идёт снег.", "В Пеки́не зимо́й то́же хо́лодно, но ре́дко идёт снег."]
        rubric: ["[зимо́й]{.ru} 不加前置词", "无人称句 [хо́лодно]{.ru}", "[снег идёт ре́дко]{.ru}"]
      - zh: 秋天是我最喜欢的季节。
        accept: ["О́сень — моё люби́мое вре́мя го́да.", "Моё люби́мое вре́мя го́да — о́сень."]
        rubric: ["[вре́мя]{.ru} 是中性，[моё люби́мое]{.ru}", "这里“秋天”是主语，用第一格 [о́сень]{.ru}"]

  - id: e5
    type: open
    task: 写一段话。
    items:
      - prompt: 介绍你家乡一年四季的天气，并说说你最喜欢哪个季节、这个季节常做什么。60–90 词。
        length: 60–90
        model: |
          Я из Пеки́на. Зимо́й у нас хо́лодно, но снег идёт ре́дко. В кварти́рах тепло́: отопле́ние рабо́тает с ноября́ до ма́рта. Весно́й в Пеки́не тепло́, но ча́сто си́льный ве́тер. Ле́том о́чень жа́рко, иногда́ идёт дождь. А о́сенью тепло́ и со́лнечно. О́сень — моё люби́мое вре́мя го́да. О́сенью мы с дру́гом гуля́ем в па́рке и е́здим на да́чу.
        rubric: ["四个季节都用第五格副词表达", "天气用无人称句和 [идёт дождь / снег]{.ru}", "写出最喜欢的季节：[моё люби́мое вре́мя го́да]{.ru}"]
        notes: 范文按冬、春、夏、秋的顺序，每个季节一两句，最后用一个季节引出自己的爱好。季节副词放在句首，读的时候自成一个语段。
