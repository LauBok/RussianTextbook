    **市图书馆阅览室使用规则**

    **1\. 总则**

    1.1. 阅览室（以下简称阅览室）除星期一外每天开放，时间为 10:00 至 20:00。每月最后一个星期四闭馆。

    1.2. 凡领有读者证的公民均有权使用阅览室。读者证凭护照免费办理。

    **2\. 读者的权利**

    2.1. 读者有权在阅览室借阅图书、杂志和报纸，并可使用电脑和免费无线网络。

    2.2. 每位读者一次借阅的图书和杂志不超过五种。

    **3\. 读者的义务**

    3.1. 读者必须爱护图书和图书馆的财物。

    3.2. 阅览室内必须保持安静。禁止打电话。

    3.3. 禁止将图书、杂志带出阅览室。珍本图书只限在阅览室内阅读。

    3.4. 阅览室内禁止进食和吸烟。

    **4\. 读者的责任**

    4.1. 图书损坏或丢失时，读者须以同样的图书赔偿，或赔付该书的价款。

    4.2. 违反本规则者，可被暂停使用阅览室的权利，期限最长为一个月。
