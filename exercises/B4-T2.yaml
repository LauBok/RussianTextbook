  passage_zh: |
    **博物馆是属于所有人，还是只属于付得起钱的人？**

    上个月，市美术馆宣布每周三免费参观。第一个星期三，门口就排起了这里多年未见的长队。看上去，这个决定无疑是成功的。可是社交网络上马上争论起来：为什么不让博物馆天天免费呢？

    支持这个主张的人提出了有分量的论据。博物馆的藏品属于所有人，是用社会的钱建立起来的。如今一家四口的门票钱，相当于在咖啡馆吃一顿好饭，很多人根本负担不起。此外，其他国家的经验表明：免费以后，来博物馆的年轻人更多了，还有许多以前从没去过博物馆的人。

    反对者回答说，世上没有免费的东西。博物馆需要钱来维修、安保、办新展览、给员工发工资。如果没有门票收入，这笔钱就得从城市预算里找，也就是说，实际上付钱的还是居民——只不过不是在博物馆售票处付。反对者还说，白得的东西人们不太珍惜：免费日很多人进去“待一会儿”，几乎什么也没看。

    我认为，真理往往就在两种意见之间。让所有人永远免费参观恐怕不现实。但每周一个免费日，中小学生、大学生和退休者免费——这不是赠品，而是对未来的关心。一个从小就习惯去博物馆的人，长大以后还会去——而且会买票去。
