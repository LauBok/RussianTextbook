- id: e5
  type: open
  task: 诗歌格律分析：划分下面这首诗每一行的音步，用 ∪ 表示非重读音节、— 表示重读音节，音步之间用 / 隔开，注明虚重在第几音步；最后写出格律名称（几音步什么格）和韵式。
  points: 10
  passage: |
    ::: {.poem lang="ru"}
    [М. Ю. Ле́рмонтов]{.author}

    **Звезда́**

    | Свети́сь, свети́сь, далёкая звезда́,
    | Чтоб я в ночи́ встреча́л тебя́ всегда́;
    | Твой сла́бый луч, сража́ясь с темното́й,
    | Несёт мечты́ душе́ мое́й больно́й;
    | Она́ к тебе́ лета́ет высоко́;
    | И гру́ди сей свобо́дно и легко́...
    | Я ви́дел взгляд, испо́лненный огня́
    | (Уж он давно́ закры́лся для меня́),
    | Но, как к тебе́, к нему́ ещё лечу́;
    | И хоть нельзя́ — смотре́ть его́ хочу́...

    [1830]{.year}
    :::
  items:
  - prompt: 划分写在下面横线上。
    length: 12–16
    lines: 12
    model: |-
      1: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

      2: ∪ — / ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

      3: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

      4: ∪ — / ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

      5: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

      6: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

      7: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

      8: ∪ — / ∪ — / ∪ — / ∪ ∪ / ∪ — (пиррихий в четвёртой стопе)

      9: ∪ — / ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

      10: ∪ — / ∪ — / ∪ — / ∪ — / ∪ — (пиррихия нет)

      Ямб, в каждой строке пять стоп. Рифмовка парная: AABBCCDDEE, все рифмы мужские (звезда — всегда, темнотой — больной, высоко — легко, огня — меня, лечу — хочу).
    rubric:
    - 十行划分共 8 分：每行音步切分、重音和虚重全对算对，对一行得 0.8 分；第 2、8、9、10 行第 2 音节上的单音节词（[я, он, как, хоть]{.ru}）标作重读或虚重都算对
    - 格律名称 1 分：五音步抑扬格（没有数出五音步的不给分）
    - 韵式 1 分：随韵 AABB…，全部是阳性韵
    notes: "音节划分：1 [све-ти́сь / све-ти́сь / да-лё / ка-я / звез-да́]{.ru .syl}；2 [чтоб-я / вно-чи́ / встре-ча́л / те-бя́ / всег-да́]{.ru .syl}；3 [твой-сла́ / бый-луч / сра-жа́ / ясь-стем / но-то́й]{.ru .syl}；4 [не-сёт / меч-ты́ / ду-ше́ / мо-е́й / боль-но́й]{.ru .syl}；5 [о-на́ / кте-бе́ / ле-та́ / ет-вы / со-ко́]{.ru .syl}；6 [и-гру́ / ди-сей / сво-бо́д / но-и / лег-ко́]{.ru .syl}；7 [я-ви́ / дел-взгляд / ис-по́л / нен-ный / ог-ня́]{.ru .syl}；8 [уж-он / дав-но́ / за-кры́л / ся-для / ме-ня́]{.ru .syl}；9 [но-как / кте-бе́ / кне-му́ / е-щё / ле-чу́]{.ru .syl}；10 [и-хоть / нель-зя́ / смот-ре́ть / е-го́ / хо-чу́]{.ru .syl}。判断方法（第 9、16 课）：多音节词 [свети́сь]{.ru} 重音在第 2 音节，[далёкая]{.ru} 在第 6，[звезда́]{.ru} 在第 10，都是偶数音节，所以是抑扬格；行末重音在第 10 音节，是第 5 个格律重音位置，所以是五音步；每行正好十个音节，都以重音结尾，是阳性韵。第 6 行的 [гру́ди]{.ru} 是旧时诗歌里与格的读法，重音在第一个音节，正好落在第 2 音节；[сей]{.ru}（这）在第 4 音节，按重读计。容易错的是把第 1 行的 [далёкая]{.ru} 看成两个重音：它只有一个重音，第 8 音节 [-я]{.ru} 不重读，第 4 音步虚重。第 4、9、10 行五个重音全部落实，读起来最饱满；前六行写星光和心灵飞向星星，后四行转到“我见过的目光”，星星原来是那双眼睛的比喻。"
- id: e6
  type: open
  task: 俄译汉：把下面这段文字（屠格涅夫《阿霞》第一章，1858 年，有删节）译成汉语。
  points: 15
  passage: |
    ::: {.prose lang="ru"}
    Я путешествовал без всякой цели, без плана; останавливался везде, где мне нравилось, и отправлялся тотчас далее, как только чувствовал желание видеть новые лица — именно лица. Меня занимали исключительно одни люди; я ненавидел любопытные памятники, замечательные собрания, один вид лон-лакея возбуждал во мне ощущение тоски и злобы <…>. Природа действовала на меня чрезвычайно, но я не любил так называемых её красот, необыкновенных гор, утёсов, водопадов; я не любил, чтобы она навязывалась мне, чтобы она мне мешала. Зато лица, живые, человеческие лица — речи людей, их движения, смех — вот без чего я обойтись не мог. В толпе мне было всегда особенно легко и отрадно; мне было весело идти, куда шли другие, кричать, когда другие кричали, и в то же время я любил смотреть, как эти другие кричат. Меня забавляло наблюдать людей... да я даже не наблюдал их — я их рассматривал с каким-то радостным и ненасытным любопытством. Но я опять сбиваюсь в сторону.
    :::
  items:
  - prompt: 译文写在下面横线上。
    length: 250–320
    lines: 12
    model: |-
      我旅行没有任何目的，也没有计划；我喜欢哪里就在哪里停下来，一想看到新的面孔——正是面孔——就马上再往前走。我感兴趣的只有人；我讨厌那些名胜古迹、了不起的收藏，一看见导游就感到烦闷和恼怒……大自然对我的影响非常大，可我不喜欢它那些所谓的美景：奇特的山峦、峭壁、瀑布；我不喜欢它硬要塞给我，不喜欢它妨碍我。可是面孔，活生生的人的面孔——人们的话语、他们的动作、他们的笑声——这才是我离不开的东西。在人群里我总觉得特别轻松愉快；别人往哪儿走，我也高高兴兴地跟着走，别人喊，我也跟着喊，同时我又喜欢看着这些别人怎样喊叫。观察人使我感到有趣……其实我甚至不是在观察他们——我是带着一种快活的、永远不会满足的好奇心在端详他们。不过我又扯远了。
    rubric:
    - 准确 9 分：意思都译出、没有漏译误译（每处漏译误译扣 1 分）。重点：[именно лица]{.ru} 是强调“正是面孔（人）”，不是“只是脸”；[Меня занимали исключительно одни люди]{.ru}“我感兴趣的只有人”；[так называемых её красот]{.ru}“它那些所谓的美景”带讽刺；[чтобы она навязывалась мне]{.ru}“硬塞给我”；[вот без чего я обойтись не мог]{.ru}“这才是我离不开的”；[сбиваюсь в сторону]{.ru}“扯远了，离题了”
    - 表达 4 分：句子通顺，长句拆分得当，三处分号连接的排比要译出层次
    - 风格 2 分：保留叙述者讲故事的口吻（自我纠正 [да я даже не наблюдал их]{.ru}、结尾的自嘲），破折号和省略号造成的停顿
    notes: 这一段是小说开头叙述者 [Н. Н.]{.ru} 对年轻时自己的回忆，口吻轻松，带着自嘲。翻译的难点：一、几个“我不喜欢……”“我喜欢……”的排比，汉语要排得整齐；二、[лица]{.ru} 在这里既是“面孔”也代指“人”，前后要统一译“面孔”，第二次出现时可以加“活生生的人的”补足；三、[эти другие]{.ru} 译“这些别人”保留原文的俏皮；四、[Но я опять сбиваюсь в сторону]{.ru} 是讲故事的人对听众说的话，译成口语“不过我又扯远了”。
