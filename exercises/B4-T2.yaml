    ::: {.prose lang="ru"}
    **Правила пользования читальным залом городской библиотеки**

    **1\. Общие положения**

    1.1. Читальный зал (далее — зал) работает каждый день, кроме понедельника, с 10:00 до 20:00. В последний четверг месяца зал закрыт.

    1.2. Пользоваться залом имеют право все граждане, получившие билет читателя. Билет читателя выдаётся бесплатно при предъявлении паспорта.

    **2\. Права читателей**

    2.1. Читатель вправе получать в зале книги, журналы и газеты, а также пользоваться компьютерами и бесплатным вайфаем.

    2.2. Одновременно читателю выдаётся не более пяти книг и журналов.

    **3\. Обязанности читателей**

    3.1. Читатель обязан аккуратно обращаться с книгами и имуществом библиотеки.

    3.2. В зале необходимо соблюдать тишину. Разговоры по телефону не допускаются.

    3.3. Выносить книги и журналы из зала запрещается. Редкие книги выдаются только для работы в зале.

    3.4. В зале не допускаются приём пищи и курение.

    **4\. Ответственность читателей**

    4.1. В случае повреждения или потери книги читатель обязан заменить её такой же книгой или заплатить её стоимость.

    4.2. За нарушение настоящих Правил читатель может потерять право пользования залом на срок до одного месяца.

    :::
  why: 第 1 题，第 1.1 条：阅览室每天开放，星期一除外；每月最后一个星期四也关闭。第 2 题，第 1.2 条：凭护照免费办读者证。第 3 题，第 2.2 条：一次最多借五种书刊。第 4 题，第 3.3 条：书刊不准带出阅览室，珍本书只能在阅览室里看；电脑和无线网可以用（第 2.1 条），手机要静音的规定原文没有，原文是不准打电话（第 3.2 条）。第 5 题，第 4.1 条：损坏或丢失书，要用同样的书赔偿，或者赔付书价；暂停使用阅览室一个月是违反规章的处罚上限（第 4.2 条），不是丢书的规定处理办法。
