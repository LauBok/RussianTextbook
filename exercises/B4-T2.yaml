    **我的名字对你有什么意义？**

    我的名字对你有什么意义？
    它会死去，就像悲伤的声响，
    像浪花拍打着遥远的岸，
    像幽深的林中夜晚的声音。

    它在纪念册的一页上
    会留下死去的痕迹，好比
    墓碑上铭文的花纹，
    刻着一种看不懂的文字。

    它算得了什么？早已被遗忘
