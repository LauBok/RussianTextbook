- id: e8
  type: open
  task: 概要写作：用俄语把阅读理解（一）的选文压缩成 150 词左右的概要。按原文顺序，用第三人称转述，不用直接引语，不加自己的评价。
  points: 15
  items:
  - prompt: '[Напишите краткий пересказ отрывка из рассказа А. П. Чехова «Дама с собачкой».]{.ru}'
    length: 130–170
    model: |-
      В Ялте появилась новая отдыхающая — молодая дама с белым шпицем. Её часто видели на набережной, она всегда гуляла одна, и никто не знал, кто она. Дмитрий Дмитрич Гуров, который отдыхал в Ялте уже две недели, решил с ней познакомиться.

      Гурову не было ещё сорока лет. Женили его рано, жену он не любил, считал её недалёкой и часто ей изменял. О женщинах он говорил плохо, но без них жить не мог.

      Однажды дама села за соседний стол в саду. Гуров позвал её собачку, и так начался разговор. После обеда они вместе гуляли у моря. Гуров рассказал, что служит в банке в Москве, а она — что выросла в Петербурге, замужем и живёт в городе С. Её звали Анна Сергеевна.

      Вечером Гуров думал о ней. Он вспоминал, как она ещё молода и несмела, и ему казалось, что в ней есть что-то жалкое.
    rubric:
    - 内容 7 分：带小狗的女士出现、古罗夫想认识她（2 分）；古罗夫的家庭和他对女人的态度（2 分）；相识和谈话的内容（2 分）；睡前对她的看法（1 分）
    - 压缩与转述 4 分：按原文顺序，第三人称，不用直接引语，不加评价；删去环境描写
    - 语言 4 分：语法正确，连接自然；每两处语法错误扣 1 分
    - 字数不足 110 或超过 200 词的，总分最多给 9 分
    notes: 范文约 150 词，分四段：女士出现—古罗夫其人—相识—当晚的想法。压缩的办法：月光下的海、淡紫色的海水等景物描写全部删去；人物的话改成转述（[Гуров рассказал, что…, а она — что…]{.ru}）；古罗夫对女人的那句 [Низшая раса!]{.ru} 概括为“说女人的坏话，却离不开她们”。动词用过去时，持续的状态用未完成体（[гуляла, не любил, изменял]{.ru}），一次的事件用完成体（[решил, села, рассказал]{.ru}）。
- id: e9
  type: open
  task: 作品评论：写一篇 250–300 词的评论。
  points: 25
  items:
  - prompt: 以 [Произведение, которое заставило меня задуматься]{.ru} 为题，从本册学过的作品中选一部（小说、诗歌或散文均可），写一篇评论：简要介绍作品和选段，分析作者用了什么手段，说明作品的思想，最后写出它为什么让你思考、你同意还是不同意作者。
    length: 250–300
    model: |-
      Из всех текстов, прочитанных в этом году, больше всего меня заставил задуматься отрывок из романа Льва Толстого «Война и мир» — сцена, где князь Андрей Болконский лежит раненый на поле под Аустерлицем.

      Князь Андрей мечтал о славе, как Наполеон. В бою он схватил знамя и повёл солдат вперёд. Но вдруг его ранили, и он упал навзничь. Над ним было только высокое небо с медленно плывущими облаками.

      Толстой строит эту сцену на противопоставлении. До того как его ранили, всё вокруг — шум, крики, бег, борьба. После — тишина и бесконечное небо. Автор много раз повторяет слово «небо» и прилагательные «высокое», «бесконечное». Мы видим мир глазами героя и вместе с ним понимаем, что всё, о чём он мечтал, кажется теперь пустым. Даже Наполеон, которого он считал своим героем, выглядит маленьким человеком.

      Мысль Толстого, по-моему, в том, что слава и победы не главное в жизни. Человек часто живёт так, будто впереди только то, о чём он мечтает сегодня, и не замечает того, что действительно важно.

      Эта сцена заставила меня задуматься о себе. Мы тоже постоянно спешим: оценки, экзамены, работа, успех. Конечно, без цели жить нельзя, и я не могу полностью согласиться с тем, что всё это «пустое». Но иногда полезно остановиться и посмотреть на своё «небо» — на то, ради чего мы на самом деле живём. Поэтому я считаю, что книги Толстого нужно читать не только в школе, но и потом, когда мы становимся взрослыми.
