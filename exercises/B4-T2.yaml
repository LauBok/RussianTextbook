lesson: B4-T2
heading: 期末测试
intro: 满分 150 分，建议用时 150 分钟。考查范围：第四册全册（第 25–40 课约占六成）。原著选文里的生僻词见卷末注释；格律分析、翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 文学与文化常识：选出正确答案。
  points: 1
  why: 第 1 题：《上尉的女儿》用回忆录的形式写成，叙述者是年老的格里尼奥夫（第 33 课）。第 2 题：果戈理把《死魂灵》称为“长诗”（[поэма]{.ru}）（第 34 课）。第 3 题：巴扎罗夫自称“虚无主义者”（[нигилист]{.ru}）；讲究贵族风度、自称自由主义者的是帕维尔·彼得罗维奇（第 35 课）。第 4 题：拉斯柯尔尼科夫是因贫穷而退学的大学生，住在干草市场附近的斗室里（第 36 课）。第 5 题：安德烈·博尔孔斯基在奥斯特里茨战役中举着军旗冲锋时负伤，仰面看见了高远的天空（第 37 课）。第 6 题：1880 年 6 月 8 日，莫斯科普希金纪念像落成时，陀思妥耶夫斯基发表演讲（第 38 课）。第 7 题：1890 年契诃夫自己前往萨哈林岛，逐户登记居民，写成纪实作品《萨哈林岛》（第 39 课）。第 8 题：《白卫军》的作者是布尔加科夫（第 23 课）。第 9 题：叶赛宁在 1920 年的一首诗里自称“乡村最后一个诗人”（第 12 课）。第 10 题：陀思妥耶夫斯基 1849 年被捕，在西伯利亚的鄂木斯克服苦役四年（第 20、36 课）；契诃夫去萨哈林是自愿的考察。
  items:
  - stem: Рассказ в «Капитанской дочке» ведётся от лица ___.
    options:
    - Емельяна Пугачёва
    - Савельича
    - Петра Андреевича Гринёва
    - автора, который изучал историю
    answer: Петра Андреевича Гринёва
  - stem: Свои «Мёртвые души» Гоголь назвал ___.
    options:
    - поэмой
    - повестью
    - комедией
    - рассказом
    answer: поэмой
  - stem: В романе «Отцы и дети» Базаров называет себя ___.
    options:
    - аристократом
    - поэтом
    - офицером
    - нигилистом
    answer: нигилистом
  - stem: Раскольников — это ___.
    options:
    - богатый помещик
    - бедный бывший студент
    - старый офицер
    - известный врач
    answer: бедный бывший студент
  - stem: Андрей Болконский был ранен ___.
    options:
    - под Аустерлицем
    - на Сенной площади
    - под Оренбургом
    - на Сахалине
    answer: под Аустерлицем
  - stem: Речь о Пушкине Достоевский произнёс ___.
    options:
    - в 1837 году в Петербурге
    - в 1866 году в Петербурге
    - в 1880 году в Москве
    - в 1890 году в Киеве
    answer: в 1880 году в Москве
  - stem: На Сахалин Чехов поехал, ___.
    options:
    - чтобы лечиться
    - чтобы увидеть жизнь каторги своими глазами и описать её
    - потому что его отправили туда на каторгу
    - чтобы работать в газете
    answer: чтобы увидеть жизнь каторги своими глазами и описать её
  - stem: Роман «Белая гвардия» написал ___.
    options:
    - Ф. М. Достоевский
    - И. С. Тургенев
    - М. Горький
    - М. А. Булгаков
    answer: М. А. Булгаков
  - stem: Есенин назвал себя ___.
    options:
    - последним поэтом деревни
    - первым поэтом большого города
    - учеником Маяковского
    - певцом Петербурга
    answer: последним поэтом деревни
  - stem: Несколько лет на каторге в Сибири провёл ___.
    options:
    - И. С. Тургенев
    - Л. Н. Толстой
    - Ф. М. Достоевский
    - А. П. Чехов
    answer: Ф. М. Достоевский
- id: e2
  type: choice
  task: 词汇：第 1–9 题选出与所给词意思相同的解释，第 10–15 题选出填入空格最恰当的词。
  points: 1
  why: 第 1 题：[бесспорный]{.ru} 无可争辩的（第 26 课）。第 2 题：[хрупкий]{.ru} 易碎的、脆弱的（第 27 课）。第 3 题：[устареть]{.ru} 过时（第 29 课）。第 4 题：[подчас]{.ru} 有时（第 34 课）。第 5 题：[насущный]{.ru} 迫切的、日常必需的（第 36 课）。第 6 题：[вздор]{.ru} 胡说、废话（第 36 课）。第 7 题：[уцелеть]{.ru} 幸存、保全下来（第 39 课）。第 8 题：[навзничь]{.ru} 仰面（第 37 课）；脸朝下是 [ничком]{.ru}。第 9 题：[целиком]{.ru} 整个地、全部（第 28 课）。第 10 题：“交费”是 [вносить плату]{.ru}，公文里的固定搭配（第 30 课）；[класть, ставить, давать]{.ru} 不和 [плату]{.ru} 这样搭配。第 11 题：[способствовать]{.ru} + 第三格“促进”（第 38 课）；[привести]{.ru} 要接 [к]{.ru}，[вызвать, сделать]{.ru} 要接第四格，和 [развитию]{.ru} 连不上。第 12 题：[пренебрегать]{.ru} + 第五格“忽视”（第 35 课）；其余三个动词都不接第五格。第 13 题：[пожертвовать чем]{.ru}“牺牲、舍弃”（第 28 课）；[потерять, оставить, бросить]{.ru} 不接第五格。第 14 题：[справиться с]{.ru} + 第五格“应付、胜任，控制住”（第 29 课）。第 15 题：[по всей вероятности]{.ru}“多半”是固定说法（第 39 课）。
  items:
  - stem: «Бесспорный» значит ___.
    options:
    - не вызывающий сомнений
    - неизвестный
    - временный
    - опасный
    answer: не вызывающий сомнений
  - stem: «Хрупкий» значит ___.
    options:
    - тяжёлый
    - крепкий
    - легко ломающийся
    - тёплый
    answer: легко ломающийся
  - stem: «Устареть» значит ___.
    options:
    - стать моложе
    - перестать быть современным
    - стать тяжелее
    - вырасти
    answer: перестать быть современным
  - stem: «Подчас» значит ___.
    options:
    - никогда
    - всегда
    - сейчас
    - иногда
    answer: иногда
  - stem: «Насущный» значит ___.
    options:
    - лишний
    - древний
    - необходимый каждый день
    - праздничный
    answer: необходимый каждый день
  - stem: «Вздор» — это ___.
    options:
    - глупые, пустые слова
    - громкий крик
    - тихая музыка
    - серьёзный спор
    answer: глупые, пустые слова
  - stem: «Уцелеть» значит ___.
    options:
    - погибнуть
    - вырасти
    - уехать
    - остаться целым и живым
    answer: остаться целым и живым
  - stem: «Упасть навзничь» значит упасть ___.
    options:
    - лицом вниз
    - на спину
    - на колени
    - вперёд
    answer: на спину
  - stem: «Целиком» значит ___.
    options:
    - полностью
    - не до конца
    - никогда
    - медленно
    answer: полностью
  - stem: По договору наниматель обязан ___ плату за квартиру до десятого числа каждого месяца.
    options:
    - класть
    - ставить
    - вносить
    - давать
    answer: вносить
  - stem: Новое метро ___ развитию района.
    options:
    - привело
    - вызвало
    - сделало
    - способствовало
    answer: способствовало
  - stem: Не стоит ___ советами опытных людей.
    options:
    - забывать
    - пренебрегать
    - слушать
    - не замечать
    answer: пренебрегать
  - stem: Ради краткости переводчику иногда приходится ___ точностью.
    options:
    - потерять
    - оставить
    - пожертвовать
    - бросить
    answer: пожертвовать
  - stem: Он долго не мог ___ с волнением.
    options:
    - справиться
    - сделать
    - решить
    - победить
    answer: справиться
  - stem: По всей ___, он уже уехал.
    options:
    - возможности
    - правде
    - случайности
    - вероятности
    answer: вероятности
- id: e3a
  type: choice
  task: 阅读理解（一）：阅读下面的小说节选（契诃夫《带小狗的女人》第一章，1899 年，有删节），根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose .long lang="ru"}
    **Дама с собачкой**

    Говорили, что на набережной появилось новое лицо: дама с собачкой. Дмитрий Дмитрич Гуров, проживший в Ялте уже две недели и привыкший тут, тоже стал интересоваться новыми лицами. Сидя в павильоне у Верне, он видел, как по набережной прошла молодая дама, невысокого роста блондинка, в берете: за нею бежал белый шпиц.

    И потом он встречал её в городском саду и на сквере по нескольку раз в день. Она гуляла одна, всё в том же берете, с белым шпицем; никто не знал, кто она, и называли её просто так: дама с собачкой.

    «Если она здесь без мужа и без знакомых, — соображал Гуров, — то было бы не лишнее познакомиться с ней».

    Ему не было ещё сорока, но у него была уже дочь двенадцати лет и два сына-гимназиста. Его женили рано, когда он был ещё студентом второго курса, и теперь жена казалась в полтора раза старше его. Это была женщина высокая, с тёмными бровями, прямая, важная, солидная и, как она сама себя называла, мыслящая. Она много читала, не писала в письмах ъ, называла мужа не Дмитрием, а Димитрием, а он втайне считал её недалёкой, узкой, неизящной, боялся её и не любил бывать дома. Изменять ей он начал уже давно, изменял часто и, вероятно, поэтому о женщинах отзывался почти всегда дурно, и когда в его присутствии говорили о них, то он называл их так:

    — Низшая раса!

    <…>

    И вот однажды под вечер он обедал в саду, а дама в берете подходила не спеша, чтобы занять соседний стол. Её выражение, походка, платье, причёска говорили ему, что она из порядочного общества, замужем, в Ялте в первый раз и одна, что ей скучно здесь... В рассказах о нечистоте местных нравов много неправды, он презирал их и знал, что такие рассказы в большинстве сочиняются людьми, которые сами бы охотно грешили, если б умели, но, когда дама села за соседний стол в трёх шагах от него, ему вспомнились эти рассказы о лёгких победах, о поездках в горы, и соблазнительная мысль о скорой, мимолётной связи, о романе с неизвестною женщиной, которой не знаешь по имени и фамилии, вдруг овладела им.

    Он ласково поманил к себе шпица и, когда тот подошёл, погрозил ему пальцем. Шпиц заворчал. Гуров опять погрозил.

    Дама взглянула на него и тотчас же опустила глаза.

    — Он не кусается, — сказала она и покраснела.

    — Можно дать ему кость? — И когда она утвердительно кивнула головой, он спросил приветливо: — Вы давно изволили приехать в Ялту?

    — Дней пять.

    — А я уже дотягиваю здесь вторую неделю.

    Помолчали немного.

    — Время идёт быстро, а между тем здесь такая скука! — сказала она, не глядя на него.

    <…>

    Она засмеялась. Потом оба продолжали есть молча, как незнакомые; но после обеда пошли рядом — и начался шутливый, лёгкий разговор людей свободных, довольных, которым всё равно, куда бы ни идти, о чём ни говорить. Они гуляли и говорили о том, как странно освещено море; вода была сиреневого цвета, такого мягкого и тёплого, и по ней от луны шла золотая полоса. Говорили о том, как душно после жаркого дня. Гуров рассказал, что он москвич, по образованию филолог, но служит в банке; готовился когда-то петь в частной опере, но бросил, имеет в Москве два дома... А от неё он узнал, что она выросла в Петербурге, но вышла замуж в С., где живёт уже два года, что пробудет она в Ялте ещё с месяц и за ней, быть может, приедет её муж, которому тоже хочется отдохнуть. Она никак не могла объяснить, где служит её муж, — в губернском правлении или в губернской земской управе, и это ей самой было смешно. И узнал ещё Гуров, что её зовут Анной Сергеевной.

    Потом у себя в номере он думал о ней, о том, что завтра она, наверное, встретится с ним. Так должно быть. Ложась спать, он вспомнил, что она ещё так недавно была институткой, училась, всё равно как теперь его дочь, вспомнил, сколько ещё несмелости, угловатости было в её смехе, в разговоре с незнакомым, — должно быть, это первый раз в жизни она была одна, в такой обстановке, когда за ней ходят, и на неё смотрят, и говорят с ней только с одною тайною целью, о которой она не может не догадываться. Вспомнил он её тонкую, слабую шею, красивые, серые глаза.

    «Что-то в ней есть жалкое всё-таки», — подумал он и стал засыпать.
    :::
  why: 第 1 题：古罗夫心想“如果她在这里既没有丈夫也没有熟人，那么和她认识一下倒也不坏”；“大家都想认识她”“她是他的老相识”文中都没有。第 2 题：他心里认为妻子见识短浅、心胸狭窄、不雅致，怕她，不爱待在家里；“很爱妻子”“妻子比他年轻”与原文相反。第 3 题：他亲切地招小狗过来，又用手指吓唬它，小狗叫了，女士才开口说“它不咬人”。第 4 题：从安娜·谢尔盖耶夫娜那里他知道，她在彼得堡长大，在 C 城出嫁，在那里住了两年，还要在雅尔塔待一个月左右；她说不清丈夫在哪里任职。第 5 题：睡前他想到她不久前还是贵族女子学校的学生，笑声里还有多少羞怯和生涩，于是想“她身上总有点可怜的地方”；他并没有想要离开雅尔塔，也没有打算第二天就去见她的丈夫。
  items:
  - stem: Гуров решил, что было бы неплохо познакомиться с дамой, потому что ___.
    options:
    - все в Ялте хотели с ней познакомиться
    - она была здесь без мужа и без знакомых
    - она была его старой знакомой
    - его попросила об этом жена
    answer: она была здесь без мужа и без знакомых
  - stem: О своей жене Гуров втайне думал, что ___.
    options:
    - она умная и добрая
    - она моложе его
    - она недалёкая и неизящная
    - она самая интересная женщина
    answer: она недалёкая и неизящная
  - stem: Разговор между Гуровым и дамой начался, когда ___.
    options:
    - Гуров погрозил пальцем её шпицу
    - дама попросила его о помощи
    - их познакомили в театре
    - Гуров спросил, как её зовут
    answer: Гуров погрозил пальцем её шпицу
  - stem: Анна Сергеевна рассказала Гурову, что ___.
    options:
    - родилась и выросла в Москве
    - её муж служит в банке
    - собирается уехать из Ялты завтра
    - вышла замуж в С. и живёт там два года
    answer: вышла замуж в С. и живёт там два года
  - stem: Перед сном Гуров подумал, что ___.
    options:
    - в ней есть что-то жалкое
    - ему нужно уехать из Ялты
    - завтра он познакомится с её мужем
    - она похожа на его жену
    answer: в ней есть что-то жалкое
  passage_zh: |
    **带小狗的女人**

    听说海滨大道上出现了一个新面孔：一位带小狗的女士。德米特里·德米特里奇·古罗夫在雅尔塔已经住了两个星期，住惯了，也开始对新面孔感兴趣了。他坐在韦尔奈的亭子里，看见一位年轻的女士沿着海滨大道走过去，个子不高，金色头发，戴一顶贝雷帽；一条白色的狐狸犬跟在她后面跑。

    后来他在市立公园和街心花园里，一天要遇见她好几次。她一个人散步，总戴着那顶贝雷帽，带着那条白色狐狸犬；谁也不知道她是什么人，大家就简单地叫她：带小狗的女人。

    “如果她在这里既没有丈夫也没有熟人，”古罗夫心想，“那么和她认识认识倒也不坏。”

    他还不到四十岁，可已经有一个十二岁的女儿和两个上中学的儿子了。他结婚很早，那时还是大学二年级的学生，现在妻子看上去比他大一半。她是个高个子女人，眉毛很黑，腰板挺直，神气庄重，举止持重，用她自己的话说，是个有思想的女人。她读很多书，写信不用硬音符号，叫丈夫不叫德米特里，而叫季米特里；他暗地里却认为她见识短浅，心胸狭窄，毫无风雅可言，怕她，不爱待在家里。他早就开始对她不忠了，而且常常不忠，大概正因为这样，他说起女人来几乎总是没有好话，别人当着他的面谈起女人，他就这样称呼她们：

    “低等人种！”

    <…>

    有一天傍晚，他在公园里吃饭，那位戴贝雷帽的女士不慌不忙地走过来，要在邻桌坐下。她的神情、步态、衣着、发型都告诉他，她出身上流社会，已经出嫁，第一次来雅尔塔，而且是一个人，她在这里觉得无聊……关于本地风气不正的传说有许多不实之词，他瞧不起这些传说，知道这类故事大都是那些自己只要有本事也乐意犯罪的人编出来的；可是，当那位女士在离他三步远的邻桌坐下时，他想起了那些关于轻易得手、关于结伴进山游玩的故事，一个诱人的念头——来一段短暂的露水姻缘，同一个连姓名都不知道的陌生女人谈一场恋爱——一下子抓住了他。

    他亲切地招呼狐狸犬到他身边来，等它走过来，又用手指吓唬它。狐狸犬汪汪叫起来。古罗夫又吓唬它。

    那位女士看了他一眼，马上又垂下了眼睛。

    “它不咬人。”她说，脸红了。

    “可以给它一根骨头吗？”她肯定地点了点头，他就亲切地问道：“您来雅尔塔很久了吗？”

    “五六天了。”

    “我在这里已经熬到第二个星期了。”

    两人沉默了一会儿。

    “时间过得很快，可这里真无聊！”她说，没有看他。

    <…>

    她笑了。后来两人像陌生人那样默默地吃饭；可饭后并排走了——于是开始了轻松愉快的谈话，那是无拘无束、心满意足的人之间的谈话，他们去哪儿都行，谈什么都无所谓。他们一边散步一边谈海面上的光多么奇特；海水是淡紫色的，那么柔和，那么温暖，月光在海面上铺出一条金色的光带。他们谈到炎热的白天过后多么闷热。古罗夫讲到他是莫斯科人，学的是语文，却在银行里做事；从前准备在私人歌剧院唱歌，后来放弃了；他在莫斯科有两所房子……他从她那里知道，她在彼得堡长大，但嫁到了 C 城，在那里已经住了两年，她还要在雅尔塔待一个月左右，她丈夫也许会来接她，他也想休息一下。她怎么也说不清丈夫在哪里任职——是在省政府还是在省地方自治局，她自己也觉得好笑。古罗夫还知道了她叫安娜·谢尔盖耶夫娜。

    后来他回到自己的房间里，想着她，想着明天她多半还会遇见他。一定会这样的。躺下睡觉时，他想起她不久前还是个女中学生，还在念书，就跟他现在的女儿一样；想起她跟陌生人说话时，笑声里还有多少羞怯和生涩——想必这是她平生第一次一个人待在这样的环境里：有人跟着她，看着她，跟她说话，只怀着一个秘密的目的，而这个目的她不会猜不到。他想起她纤细柔弱的脖子，美丽的灰眼睛。

    “她身上总有点可怜的地方。”他想着，渐渐睡着了。
