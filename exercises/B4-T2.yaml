  passage: |
    ::: {.prose lang="ru"}
    **Музей для всех или для тех, кто может заплатить?**

    В прошлом месяце городской художественный музей объявил, что вход по средам будет бесплатным. Уже в первую среду у дверей стояла очередь, какой здесь не видели много лет. Казалось бы, решение бесспорно удачное. Однако в соцсетях сразу начался спор: не сделать ли музей бесплатным каждый день?

    Сторонники этой идеи приводят серьёзные аргументы. Коллекции музеев принадлежат всем, и их создавали на деньги общества. Билет для семьи из четырёх человек стоит сегодня столько же, сколько хороший обед в кафе, и многие просто не могут себе этого позволить. Кроме того, опыт других стран показывает: когда вход становится бесплатным, в музеи приходит больше молодёжи и людей, которые раньше там никогда не бывали.

    Противники отвечают, что бесплатного в мире не бывает. Музею нужны деньги на ремонт, на охрану, на новые выставки, на зарплату сотрудникам. Если не будет денег от билетов, их придётся искать в городском бюджете, то есть, в сущности, всё равно платить будут жители — только не в кассе музея. К тому же, говорят противники, то, что получаешь даром, люди меньше ценят: в бесплатный день многие заходят «на минутку» и почти ничего не видят.

    На мой взгляд, правда, как это часто бывает, лежит где-то между этими мнениями. Сделать вход бесплатным для всех и всегда вряд ли реально. Но один бесплатный день в неделю, бесплатный вход для школьников, студентов и пенсионеров — это не подарок, а забота о будущем. Человек, который в детстве привык ходить в музеи, придёт туда и взрослым — и уже с билетом.

    :::
  why: 第 1 题，第 1 段：第一个免费的星期三门口就排起了多年未见的长队，网上随即争论起来；文中没说博物馆决定天天免费。第 2 题，第 2 段：支持者说四口之家的门票相当于在咖啡馆吃一顿好饭，许多人负担不起；还说免费后来的年轻人更多。第 3 题，第 3 段：反对者说没有门票收入，钱就得从城市预算里出，实际上还是居民在付钱，只不过不是在博物馆售票处。第 4 题，第 3 段末：白得的东西人们不太珍惜，免费日很多人进去“待一会儿”，几乎什么也没看。第 5 题，最后一段：作者认为每周一个免费日、中小学生、大学生和退休者免费是合理的，是对未来的关心；“天天对所有人免费”他认为不现实。
