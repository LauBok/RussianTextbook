lesson: L37
grammar: "支配第二格的前置词 [у, о́коло, напро́тив, до, по́сле, без]{.ru}；第三人称代词在前置词后加 [н-]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成正确的形式。
    why: 六个前置词后面都用第二格，形容词、物主代词随名词一起变：[на́шего до́ма]{.ru}，[э́той у́лицы]{.ru}。[метро́]{.ru} 不变格；第 6 题 [он]{.ru} 在前置词后变成 [него́]{.ru}，最容易漏掉 [н-]{.ru}。
    items:
      - stem: Наш дом напро́тив ___.
        hint: парк
        accept: [па́рка]
      - stem: Апте́ка о́коло ___.
        hint: метро́
        accept: [метро́]
      - stem: По́сле ___ Ми́ша игра́ет в футбо́л.
        hint: шко́ла
        accept: [шко́лы]
      - stem: Я пью чай без ___.
        hint: са́хар
        accept: [са́хара]
      - stem: Магази́н о́коло ___.
        hint: наш дом
        accept: [на́шего до́ма]
      - stem: Шко́ла напро́тив ___.
        hint: он
        accept: [него́]
      - stem: Мы гуля́ем до ___.
        hint: обе́д
        accept: [обе́да]
      - stem: Ка́тя ждёт у ___.
        hint: подъе́зд
        accept: [подъе́зда]
      - stem: Ми́ша не мо́жет жить без ___.
        hint: футбо́л
        accept: [футбо́ла]

  - id: e2
    type: choice
    task: 选择意思合适的前置词。
    why: "[у]{.ru} 紧挨着，[о́коло]{.ru} 在附近，[напро́тив]{.ru} 在对面，[до]{.ru} 到……为止或在……以前，[по́сле]{.ru} 在……以后，[без]{.ru} 没有。第 1 题“紧挨着门口”用 [у]{.ru}；第 4 题“在奶奶家”也用 [у]{.ru}。"
    items:
      - stem: Соба́ка ждёт ___ подъе́зда.
        options: [у, без, по́сле]
        answer: у
      - stem: ___ уро́ка мы идём в библиоте́ку.
        options: [По́сле, Без, Напро́тив]
        answer: По́сле
      - stem: Я не могу́ чита́ть ___ словаря́.
        options: [о́коло, без, до]
        answer: без
      - stem: В суббо́ту мы обе́даем ___ ба́бушки.
        options: [у, без, напро́тив]
        answer: у
      - stem: ___ метро́ де́сять мину́т.
        options: [До, По́сле, Без]
        answer: До

  - id: e3
    type: rewrite
    task: 根据提示回答 [Где…?]{.ru}
    placeholder: … + 前置词 + 第二格.
    example:
      cue: Где апте́ка? (о́коло / метро́)
      answer: Апте́ка о́коло метро́.
    why: 回答时主语用第一格，前置词后的名词用第二格。第 3 题的 [на́ша шко́ла]{.ru} 整体变成第二格 [на́шей шко́лы]{.ru}。
    items:
      - cue: Где парк? (напро́тив / дом)
        accept: [Парк напро́тив до́ма.]
      - cue: Где магази́н? (о́коло / парк)
        accept: [Магази́н о́коло па́рка.]
      - cue: Где стадио́н? (напро́тив / на́ша шко́ла)
        accept: [Стадио́н напро́тив на́шей шко́лы.]
      - cue: Где Ка́тя? (у / подъе́зд)
        accept: [Ка́тя у подъе́зда.]
      - cue: Где Ми́ша? (у / ба́бушка)
        accept: [Ми́ша у ба́бушки.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语的“在……对面/附近/以后”是后置的方位词，俄语用前置词放在名词前面，名词用第二格。
    items:
      - zh: 我们家在公园对面。
        accept: ["Наш дом напро́тив па́рка."]
        rubric: ["[напро́тив]{.ru} + 第二格 [па́рка]{.ru}"]
      - zh: 药店在地铁站附近。
        accept: ["Апте́ка о́коло метро́.", "Апте́ка о́коло ста́нции метро́."]
        rubric: ["[о́коло]{.ru} + 第二格", "[метро́]{.ru} 不变格"]
      - zh: 下课以后我们去公园。
        accept: ["По́сле уро́ка мы идём в парк.", "По́сле уро́ков мы идём в парк.", "По́сле уро́ка мы хо́дим в парк.", "По́сле уро́ков мы хо́дим в парк."]
        rubric: ["[по́сле уро́ка]{.ru}", "去向用 [в парк]{.ru}（第四格）"]
      - zh: 他喝咖啡不加糖。
        accept: ["Он пьёт ко́фе без са́хара."]
        rubric: ["[без са́хара]{.ru}：[без]{.ru} + 第二格"]
      - zh: 到学校五分钟。
        accept: ["До шко́лы пять мину́т."]
        rubric: ["[до шко́лы]{.ru}", "[пять мину́т]{.ru}：5 以后用复数第二格"]

  - id: e5
    type: open
    task: 介绍你家附近。
    items:
      - prompt: 写一段话介绍你住的地方附近有什么：商店、药店、公园、地铁站、学校等各在哪里，你放学（下课）以后常做什么。至少用四个本课的前置词。
        length: 50–80
        model: |
          Я живу́ в Пеки́не, в большо́м до́ме. Напро́тив до́ма — шко́ла, а о́коло шко́лы — парк. Метро́ то́же недалеко́: до метро́ де́сять мину́т. О́коло метро́ есть апте́ка и магази́н. У подъе́зда всегда́ сидя́т ба́бушки и разгова́ривают. По́сле шко́лы я ча́сто гуля́ю в па́рке. Я не могу́ жить без па́рка!
        rubric: ["至少四个不同的前置词 [у, о́коло, напро́тив, до, по́сле, без]{.ru} + 第二格", "名词、形容词第二格词尾正确", "表示去向用第四格，表示处所用第六格"]
        notes: 范文从住处写起，再由近到远介绍周围的地方，最后写放学以后的活动。每句话都以地点开头（[Напро́тив до́ма…]{.ru}、[О́коло метро́…]{.ru}），这是俄语描写方位时常用的语序：先说已知的参照物，再说新的信息。
