lesson: L06
grammar: "第一变位动词现在时（[чита́ю, чита́ешь, чита́ет, чита́ем, чита́ете, чита́ют]{.ru}）；现在时表示正在进行和经常的动作；[не]{.ru} 放在动词前。"
exercises:

  - id: e1
    type: fill
    task: 写出动词的现在时形式。
    why: 第一变位去掉 [-ть]{.ru} 后加 [-ю, -ешь, -ет, -ем, -ете, -ют]{.ru}。第 7 题主语 [Ми́ша]{.ru} 是单数名词，动词用第三人称单数；第 8 题 [А́нна и Ми́ша]{.ru} 是两个人，用第三人称复数 [-ют]{.ru}。第 5 题用 [вы]{.ru} 称呼一个人，动词仍是复数形式 [-ете]{.ru}。
    items:
      - stem: Я ___.
        hint: чита́ть
        accept: ["чита́ю"]
      - stem: Что ты ___?
        hint: де́лать
        accept: ["де́лаешь"]
      - stem: Он ___.
        hint: гуля́ть
        accept: ["гуля́ет"]
      - stem: Мы ___.
        hint: отдыха́ть
        accept: ["отдыха́ем"]
      - stem: Ива́н Серге́евич, вы ___?
        hint: рабо́тать
        accept: ["рабо́таете"]
      - stem: Они́ не ___.
        hint: знать
        accept: ["зна́ют"]
      - stem: Ми́ша ___.
        hint: игра́ть
        accept: ["игра́ет"]
      - stem: А́нна и Ми́ша ___.
        hint: слу́шать
        accept: ["слу́шают"]

  - id: e2
    type: rewrite
    task: 按提示回答问题。
    placeholder: Я … / Мы … / Он …
    example:
      cue: Что ты де́лаешь? (чита́ть)
      answer: Я чита́ю.
    why: 回答时人称跟着回答的人走：问 [ты]{.ru} 答 [я]{.ru}，问 [вы]{.ru} 答 [мы]{.ru}（几个人一起回答）或 [я]{.ru}（对一个人用 [вы]{.ru} 时），问第三人称就用第三人称回答。不要照抄问句里的动词形式，[Что ты де́лаешь? — Я де́лаешь]{.ru} 是常见错误。
    items:
      - cue: Что вы де́лаете? (отдыха́ть)
        accept: ["Мы отдыха́ем.", "Я отдыха́ю."]
      - cue: Что де́лает Ми́ша? (игра́ть)
        accept: ["Ми́ша игра́ет.", "Он игра́ет."]
      - cue: Что де́лают роди́тели? (гуля́ть)
        accept: ["Роди́тели гуля́ют.", "Они́ гуля́ют."]
      - cue: Что де́лает Ива́н Серге́евич? (рабо́тать)
        accept: ["Ива́н Серге́евич рабо́тает.", "Он рабо́тает."]
      - cue: Что ты чита́ешь? (рома́н)
        accept: ["Я чита́ю рома́н.", "Рома́н."]
      - cue: Что ты де́лаешь? (слу́шать)
        accept: ["Я слу́шаю."]

  - id: e3
    type: choice
    task: 根据课文选择正确答案。
    why: 安娜在读长篇小说；王磊在休息；米沙说自己在玩，不是在做作业；伊万·谢尔盖耶维奇和玛丽亚·尼古拉耶夫娜在散步，这是他们每天晚上的习惯。
    items:
      - stem: А́нна ___.
        options: [чита́ет, отдыха́ет]
        answer: чита́ет
      - stem: Ван Лэй ___.
        options: [отдыха́ет, рабо́тает]
        answer: отдыха́ет
      - stem: Ми́ша не де́лает уро́ки, он ___.
        options: [игра́ет, гуля́ет]
        answer: игра́ет
      - stem: Ве́чером Ива́н Серге́евич и Мари́я Никола́евна всегда́ ___.
        options: [гуля́ют, чита́ют]
        answer: гуля́ют

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语的“在”“正在”“总是”的区别，俄语都用现在时表示，“总是”用 [всегда́]{.ru}。否定词 [не]{.ru} 放在动词前面。第 4 题用 [вы]{.ru} 称呼长辈，动词用复数形式。
    items:
      - zh: ——你们在做什么？——我们在休息。
        accept: ["— Что вы де́лаете? — Мы отдыха́ем.", "— Что вы сейча́с де́лаете? — Мы отдыха́ем.", "— Что вы де́лаете? — Отдыха́ем.", "— Что вы де́лаете? — Мы сейча́с отдыха́ем."]
        rubric: ["[вы]{.ru} 配 [де́лаете]{.ru}", "[мы]{.ru} 配 [отдыха́ем]{.ru}"]
      - zh: 安娜在读长篇小说。
        accept: ["А́нна чита́ет рома́н.", "А́нна сейча́с чита́ет рома́н."]
        rubric: ["[А́нна]{.ru} 配第三人称单数 [чита́ет]{.ru}", "“长篇小说”用 [рома́н]{.ru}"]
      - zh: 他们晚上总是散步。
        accept: ["Ве́чером они́ всегда́ гуля́ют.", "Они́ всегда́ гуля́ют ве́чером.", "Ве́чером они́ гуля́ют всегда́.", "Они́ ве́чером всегда́ гуля́ют."]
        rubric: ["“晚上”用 [ве́чером]{.ru}，不加前置词", "“总是”用 [всегда́]{.ru}", "[они́]{.ru} 配 [гуля́ют]{.ru}"]
      - zh: ——伊万·谢尔盖耶维奇，您在工作吗？——不，我在休息。
        accept: ["— Ива́н Серге́евич, вы рабо́таете? — Нет, я отдыха́ю.", "— Ива́н Серге́евич, вы сейча́с рабо́таете? — Нет, я отдыха́ю.", "— Ива́н Серге́евич, вы рабо́таете? — Нет, я не рабо́таю, я отдыха́ю.", "— Ива́н Серге́евич, вы рабо́таете? — Нет, я не рабо́таю. Я отдыха́ю."]
        rubric: ["对长辈用 [вы]{.ru}，动词用 [рабо́таете]{.ru}", "回答用 [я]{.ru} 配 [отдыха́ю]{.ru}"]
      - zh: 我不知道。
        accept: ["Я не зна́ю.", "Не зна́ю."]
        rubric: ["[не]{.ru} 放在动词前面", "[знать]{.ru} 第一人称单数 [зна́ю]{.ru}"]
