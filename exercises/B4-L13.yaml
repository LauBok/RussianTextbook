lesson: B4-L13
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Каким поэт изображает себя в прологе и кому он себя противопоставляет? Что происходит в начале первой части? Почему поэма называется «Облако в штанах»?]{.ru}"
        length: 100–140
        model: "В прологе поэт изображает себя молодым, сильным и грубым. Ему двадцать два года, в душе у него нет ни одного седого волоса, а голос у него такой мощный, что мир становится огромным. Он противопоставляет себя «нежным» людям, которые спокойно живут в своих гостиных, говорят о любви, как будто играют на скрипке, и думают, как выжиревший лакей на засаленной кушетке. Поэт обещает издеваться над их мыслями. В начале первой части действие происходит в Одессе. Мария обещала прийти в четыре часа, но не пришла. Поэт ждёт её в восемь, в девять, в десять, стоит у окна и думает о любви. Название показывает, что в поэте соединяются грубость и нежность: он может быть «от мяса бешеный», а может быть нежным, как облако."
        rubric: ["序诗：年轻、强壮、粗野，与“温柔的人们”对立", "第一部分：在敖德萨等玛丽亚，她没有按时来", "标题：粗野与温柔的结合"]
        notes: "第 1 题要指出“对立”：诗人用粗野的形象嘲弄市侩的、虚假的温柔。第 3 题可以引用第 26 行 [не мужчина, а — облако в штанах]{.ru}。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[нахальный]{.ru}"
        accept: ["Грубый и невежливый.", "Невежливый, грубый.", "Такой, который ведёт себя грубо, не думая о других."]
        rubric: ["说明是蛮横、不顾礼貌的"]
      - zh: "[дряхлый]{.ru}"
        accept: ["Очень старый и слабый.", "Старый и слабый."]
        rubric: ["说明是年老体衰的"]
      - zh: "[громадина]{.ru}"
        accept: ["Что-то очень большое.", "Очень большой предмет или человек.", "Огромная вещь."]
        rubric: ["说明是庞然大物"]
      - zh: "[безукоризненно]{.ru}"
        accept: ["Очень хорошо, без ошибок.", "Так хорошо, что нечего сказать против.", "Совершенно правильно."]
        rubric: ["说明是完美无缺地"]
      - zh: "[конка]{.ru}"
        accept: ["Старый городской вагон, который тянули лошади.", "Вагон, который тянули лошади.", "Старый городской вагон с лошадьми."]
        rubric: ["说明是旧时由马拉的轨道车"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题诗行长短不一，重音间的轻音节数不固定，是重音诗。第 2 题重音诗的节奏只靠重音，没有固定的音步和音节数。第 3 题 [бронзовый]{.ru} 一个词和 [звон свой]{.ru} 两个词押韵，是复合韵。第 4 题 [мозгу́ — лоску́т]{.ru} 重读元音相同，词末辅音不同，是近似韵。第 5 题本课的选段（1915）里切开的诗行左对齐，是竖排；阶梯式从 1923 年的长诗《关于这个》开始。第 6 题见第 5 题。第 7 题马雅可夫斯基 1912 年起参加未来派的活动。第 8 题“用声音的威力使世界变得巨大”是夸张。第 9 题全诗四部分是对旧的爱情、艺术、制度和宗教的抗议，诗人称之为“四声呐喊”。第 10 题指小词写“小小的爱情”，和形容诗人巨大身体的 [громадина, глыба]{.ru} 对比。"
    items:
      - stem: Поэма «Облако в штанах» написана ___ стихом.
        options: [тоническим, четырёхстопным, трёхстопным]
        answer: тоническим
      - stem: В тоническом стихе Маяковского ритм создают ___.
        options: [ударения, стопы, одинаковое число слогов]
        answer: ударения
      - stem: Рифма «бронзовый — звон свой» — ___.
        options: [составная, перекрёстная, парная]
        answer: составная
      - stem: Рифма «мозгу — лоскут» — ___.
        options: [неточная, точная]
        answer: неточная
      - stem: Строки «Восемь. / Девять. / Десять.» в этой поэме — пример разбивки ___.
        options: [столбиком, лесенкой]
        answer: столбиком
      - stem: Лесенкой Маяковский стал писать с ___ года.
        options: ["1923", "1915", "1912"]
        answer: "1923"
      - stem: В молодости Маяковский был связан с ___.
        options: [футуризмом, романтизмом, фольклором]
        answer: футуризмом
      - stem: Строка «Мир огромив мощью голоса» — пример ___.
        options: [гиперболы, частушки, рифмовки]
        answer: гиперболы
      - stem: Поэма — это бунт и ___ против старой любви, искусства, общества и религии.
        options: [протест, шутка, песня радости]
        answer: протест
      - stem: Слова «любёночек», «звоночки», «окошечное» составляют антитезу со словами ___.
        options: [«громадина» и «глыба», «конка» и «гудок», «скрипка» и «литавры»]
        answer: «громадина» и «глыба»

