        model: |-
          21: 3 слога, 1 ударение (2); рифмуется с 24.

          22: 8 слогов, 3 ударения (1, 4, 6); рифмуется с 25.

          23: 9 слогов, 3 ударения (3, 6, 9); рифмуется с 26.

          24: 3 слога, 1 ударение (2); рифмуется с 21.

          25: 10 слогов, 3 ударения (1, 6, 9); рифмуется с 22.

          26: 10 слогов, 3 ударения (3, 6, 10); рифмуется с 23.

          Между ударениями стоит разное число безударных слогов, поэтому стопы найти нельзя: это тонический стих.
        rubric: ["音节数和重音位置基本正确", "看出第 21 与 24 行、22 与 25 行、23 与 26 行押韵", "说明重音间的轻音节数不固定，所以是重音诗"]
        notes: "第 22 行 [бу́-ду-от-мя́-са-бе́-ше-ный]{.ru .syl}：重音在 1、4、6。第 25 行 [бу́-ду-без-у-ко-ри́з-нен-но-не́ж-ный]{.ru .syl}：重音在 1、6、9，中间隔了 4 个轻音节，这在格律诗里是不可能的。押韵：[хоти́те — хоти́те]{.ru} 是重复，[бе́шеный — не́жный]{.ru} 是近似韵，[тона́ — штана́х]{.ru} 是近似韵。"

  - id: e5
    type: rewrite
    task: 把诗中的口语、诗人自造或旧式的说法改成标准语的说法。
    example:
      cue: Что может хотеться этакой глыбе?
      answer: Что может хотеться такой глыбе?
    why: "第 1 题俗语 [ложить]{.ru} 在标准语中换成 [класть]{.ru}：[кладёте]{.ru}。第 2 题 [шарахаться]{.ru} 在标准语中要加前置词 [от]{.ru}。第 3 题 [железкою]{.ru} 是第五格旧式词尾，现代用 [-ой]{.ru}。第 4 题诗人自造的 [декабрый]{.ru} 改为 [декабрьский]{.ru}，形容词放回名词前。第 5 题 [любёночек]{.ru} 是诗人造的指小词，标准语说 [маленькая любовь]{.ru}。"
    items:
      - cue: Вы любовь на скрипки ложите.
        accept: ["Вы кладёте любовь на скрипки.", "Вы любовь на скрипки кладёте."]
      - cue: Она шарахается автомобильных гудков.
        accept: ["Она шарахается от автомобильных гудков."]
      - cue: Сердце — холодной железкою.
        accept: ["Сердце — холодной железкой.", "Сердце — холодная железка."]
      - cue: Вечер, хмурый, декабрый.
        accept: ["Хмурый декабрьский вечер.", "Хмурый, декабрьский вечер."]
      - cue: Смирный любёночек.
        accept: ["Смирная маленькая любовь.", "Маленькая смирная любовь."]

  - id: e6
    type: open
    task: 概要写作。用俄语散文转述选段的内容（序诗和第一部分开头），150 词左右。
    items:
      - prompt: "[Перескажите прозой пролог и начало первой части поэмы.]{.ru}"
        length: 130–170
        model: "Поэма начинается с вызова. Поэт обращается к читателям, которые спокойно и богато живут своей жизнью, и обещает издеваться над их мыслями. Он молод, ему двадцать два года, и в его душе нет никакой старческой нежности. «Нежные» люди говорят о любви тихо и красиво, а он может вывернуть себя так, что от него останутся одни губы. Он может быть грубым и бешеным, а может быть нежным, как облако. Поэт не хочет больше хвалить скучных мужчин и женщин. Затем начинается первая часть. Действие происходит в Одессе. Мария сказала, что придёт в четыре часа, но уже восемь, девять, десять, а её всё нет. Наступает хмурый декабрьский вечер. Поэт, огромный и сильный, стоит у окна, касаясь лбом стекла, и думает о том, какой будет его любовь. Ему кажется, что она будет маленькой и тихой, как будто боится шума большого города."
        rubric: ["序诗：挑战、诗人的自画像、与“温柔的人们”的对立", "第一部分：在敖德萨等待玛丽亚，时间一点点过去", "说出巨大的诗人和“小小的爱情”的对比", "130–170 词"]
        notes: "范文约 160 词。马雅可夫斯基的比喻要用散文说清楚：[плавлю лбом стекло]{.ru} 改写为 [касаясь лбом стекла]{.ru}。开头一句 [Поэма начинается с вызова]{.ru} 概括序诗的语气，比逐句转述更像概要。"

  - id: e7
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的短文。
    items:
      - prompt: "[Грубость и нежность: «не мужчина, а — облако в штанах».]{.ru} 马雅可夫斯基的诗人形象外表粗野、内心温柔。你认为人为什么有时会把温柔藏在粗野后面？结合选段和生活中的例子谈谈你的看法。"
        length: 250–300
        model: "В прологе к поэме «Облако в штанах» молодой футурист Маяковский говорит о себе так, что читатель сначала удивляется. Он грубый, нахальный, он обещает издеваться над «нежными» людьми и называет себя огромной глыбой. Но уже через несколько строк мы видим, что этот огромный человек стоит у окна и ждёт девушку, которая не пришла, и мечтает о маленькой, тихой любви. Почему же поэт прячет свою нежность за грубостью? Мне кажется, причин несколько. Во-первых, нежность делает человека слабым. Тот, кто открыто показывает свои чувства, боится, что над ним будут смеяться. Грубость — это как стена: она защищает. Во-вторых, Маяковский был против нежности, которая есть только на словах. Он видел, как в гостиных красиво и спокойно говорят о любви, ничего не чувствуя. Поэтому он выбирает грубый, громкий язык: ему кажется, что так он скажет правду. В жизни это тоже часто бывает. У меня был школьный друг, которого все считали грубым. Он мало говорил, мог резко ответить учителю и никогда не плакал. Но когда у девочки из нашего класса умерла мама, именно он каждый день провожал её домой и молча нёс её сумку. Никто его об этом не просил. Конечно, грубость не всегда скрывает нежность. Иногда грубый человек просто не уважает других. Но стоит помнить, что за громким голосом может прятаться очень ранимая душа. Наверное, поэтому образ «облака в штанах» и сегодня понятен молодым читателям: каждый из нас хотя бы раз боялся показать, как сильно он чувствует."
        rubric: ["从选段出发：粗野的自画像与等待爱情的温柔", "提出至少两个原因（自我保护、反对虚伪的温柔等）", "有一个生活中的例子", "有让步：粗野并不总是掩盖温柔", "250–300 词"]
        notes: "范文约 280 词。结构：选段中的反差 → 提问 → 两个原因（[Во-первых… Во-вторых…]{.ru}）→ 生活中的例子 → 让步（[Конечно, грубость не всегда…]{.ru}）→ 结论回到标题。比喻 [грубость — это как стена]{.ru} 让议论更生动。"
