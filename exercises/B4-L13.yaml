    items:
      - prompt: "[Хоти́те — / бу́ду от мя́са бе́шеный / — и, как не́бо, меня́я тона́ — / хоти́те — / бу́ду безукори́зненно не́жный, / не мужчи́на, а — о́блако в штана́х!]{.ru}"
