lesson: L59
grammar: "短尾形容词 [до́лжен, рад, за́нят, свобо́ден, здоро́в]{.ru}：只作谓语，按主语的性、数变化；[до́лжен]{.ru} + 不定式；[рад]{.ru} + 不定式或第三格；过去时 [был, была́, бы́ло, бы́ли]{.ru}，将来时 [бу́ду, бу́дешь…]{.ru}；用 [вы]{.ru} 称呼一人时用复数形式。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里短尾形容词的正确形式。
    why: 短尾形容词跟主语的性、数一致：阳性没有词尾，阴性 [-а]{.ru}，复数 [-ы]{.ru}。第 2 题 [А́нна]{.ru} 是女性，用 [должна́]{.ru}，重音在词尾；第 4 题对老师用 [вы]{.ru}，虽然只是一个人，也要用复数 [свобо́дны]{.ru}；第 6 题 [мы]{.ru} 用复数 [за́няты]{.ru}。
    items:
      - stem: В суббо́ту Ван Лэй ___.
        hint: за́нят
        accept: [за́нят]
      - stem: А́нна ___ идти́.
        hint: до́лжен
        accept: [должна́]
      - stem: Ба́бушка всегда́ ___ тебя́ ви́деть.
        hint: рад
        accept: [ра́да]
      - stem: О́льга Ви́кторовна, вы сейча́с ___?
        hint: свобо́ден
        accept: [свобо́дны]
      - stem: Ма́ма сего́дня ___.
        hint: за́нят
        accept: [занята́]
      - stem: Мы о́чень ___.
        hint: за́нят
        accept: [за́няты]
      - stem: Ван Лэй уже́ ___.
        hint: здоро́в
        accept: [здоро́в]

  - id: e2
    type: choice
    task: 选择长尾或短尾形式。
    why: 修饰名词用长尾（第 1、3 题），作谓语用短尾（第 2、4 题）。第 3 题 [свобо́дное]{.ru} 修饰 [вре́мя]{.ru}（中性），要用长尾。
    items:
      - stem: У меня́ ___ ве́чер.
        options: [свобо́дный, свобо́ден]
        answer: свобо́дный
      - stem: Ве́чером я ___.
        options: [свобо́дный, свобо́ден]
        answer: свобо́ден
      - stem: У тебя́ есть ___ вре́мя?
        options: [свобо́дное, свобо́дно]
        answer: свобо́дное
      - stem: Па́па сейча́с ___.
        options: [за́нятый, за́нят]
        answer: за́нят

  - id: e3
    type: rewrite
    task: 用 [до́лжен]{.ru} 改写句子。
    placeholder: Я до́лжен …
    example:
      cue: Мне на́до идти́. (я — 男)
      answer: Я до́лжен идти́.
    why: "[на́до]{.ru} 句是无人称句，人用第三格；[до́лжен]{.ru} 句有主语，人用第一格，[до́лжен]{.ru} 跟主语的性、数变化。改写时 [мне → я]{.ru}，[ей → она́]{.ru}，[нам → мы]{.ru}，[Ми́ше → Ми́ша]{.ru}。"
    items:
      - cue: Ей на́до рабо́тать.
        accept: ["Она́ должна́ рабо́тать."]
      - cue: Нам ну́жно сде́лать зада́ние.
        accept: ["Мы должны́ сде́лать зада́ние."]
      - cue: Ми́ше на́до де́лать уро́ки.
        accept: ["Ми́ша до́лжен де́лать уро́ки."]
      - cue: А́нне ну́жно идти́ домо́й.
        accept: ["А́нна должна́ идти́ домо́й."]

  - id: e4
    type: fill
    task: 把句子改成过去时，填 [был]{.ru}、[была́]{.ru}、[бы́ло]{.ru} 或 [бы́ли]{.ru}。
    why: 短尾形容词句有第一格主语，过去时跟主语变（第 1–3 题）；无人称句没有主语，一律用 [бы́ло]{.ru}（第 4 题）。第 3 题 [вы]{.ru} 即使指一个人，也用复数 [бы́ли]{.ru}。
    items:
      - stem: Вчера́ А́нна ___ занята́.
        accept: [была́]
      - stem: Вчера́ Ван Лэй ___ свобо́ден.
        accept: [был]
      - stem: О́льга Ви́кторовна, вы вчера́ ___ за́няты?
        accept: [бы́ли]
      - stem: Вчера́ мне ___ хо́лодно.
        accept: [бы́ло]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 注意短尾形容词和主语一致；说“您”时用复数形式。
    items:
      - zh: 对不起，我得走了。（女性说）
        accept: ["Извини́те, я должна́ идти́.", "Извини́, я должна́ идти́."]
        rubric: ["女性用 [должна́]{.ru}", "后面接不定式 [идти́]{.ru}"]
      - zh: 您现在有空吗？
        accept: ["Вы сейча́с свобо́дны?", "Вы свобо́дны сейча́с?", "Извини́те, вы сейча́с свобо́дны?"]
        rubric: ["对 [вы]{.ru} 用复数 [свобо́дны]{.ru}"]
      - zh: 星期六我很忙，星期天我有空。（男性说）
        accept: ["В суббо́ту я за́нят, а в воскресе́нье я свобо́ден.", "В суббо́ту я за́нят, а в воскресе́нье свобо́ден.", "В суббо́ту я за́нят. А в воскресе́нье я свобо́ден."]
        rubric: ["[за́нят]{.ru}、[свобо́ден]{.ru} 用阳性", "“星期六”用 [в суббо́ту]{.ru}，第四格", "前后对比用 [а]{.ru}"]
      - zh: 我很高兴见到您。（男性说）
        accept: ["Я рад вас ви́деть.", "Я о́чень рад вас ви́деть."]
        rubric: ["[рад]{.ru} + 不定式", "[вас]{.ru} 第四格"]
      - zh: 昨天妈妈很忙。
        accept: ["Вчера́ ма́ма была́ занята́.", "Ма́ма вчера́ была́ занята́."]
        rubric: ["过去时 [была́]{.ru} 跟主语 [ма́ма]{.ru} 一致", "阴性 [занята́]{.ru}，重音在词尾"]

  - id: e6
    type: open
    task: 情景对话：朋友约你星期六去看奶奶（或去公园），你那天没空，请你道歉并说明原因，再约别的时间，最后告别。
    items:
      - prompt: 写 6–8 句对话，用到 [за́нят]{.ru}、[свобо́ден]{.ru}、[до́лжен]{.ru}、[рад]{.ru} 中至少三个，最后用合适的告别语。
        length: 50–90
        model: "— Приве́т! Ты свобо́ден в суббо́ту? Мы е́дем в парк.\n— Извини́, в суббо́ту я за́нят. Я до́лжен писа́ть зада́ние по ру́сскому языку́.\n— Жаль! А в воскресе́нье?\n— В воскресе́нье я свобо́ден. Я бу́ду о́чень рад!\n— Хорошо́, тогда́ в воскресе́нье.\n— Ой, уже́ три часа́! Извини́, я до́лжен идти́.\n— Пока́! До воскресе́нья!"
        rubric: ["短尾形容词与说话人的性别一致", "道歉用 [извини́ / извини́те]{.ru}", "告别语和关系相符：朋友之间用 [пока́]{.ru}"]
        notes: 对话的结构是：邀请—道歉并说明原因—另约时间—同意—告辞。说明原因时用 [до́лжен]{.ru} + 不定式，比单说“我很忙”更礼貌。朋友之间用 [ты]{.ru} 和 [извини́]{.ru}，告别说 [Пока́!]{.ru}；如果对象是老师，要换成 [вы]{.ru}、[извини́те]{.ru}、[До свида́ния!]{.ru}，短尾形容词也要用复数。
