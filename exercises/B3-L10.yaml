    why: 答案都在课文里：展览是大学生们筹备的；元素表上的空位用红色显示；艺术展厅玻璃下面放的是《同时代人》；响着的是《儿童曲集》里的小曲；科罗廖夫在世时名字没有公开；最后那块板子上，参观者写的是九个人里自己觉得谁最亲近。
