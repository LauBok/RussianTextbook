lesson: B3-L10
heading: 单元测试
intro: "答对 80% 以上进入下一单元。本测试覆盖第一单元全部语法：四种形动词的构成和意义、短尾被动形动词、形动词短语与 [который]{.ru} 从句的互换、形动词的变格与位置、形容词化与名词化的形动词、三种被动结构，最后一题是段落缩写。没有达到 80% 的，按出错的题回看相应的课，复习后重做：第 1 题的第 1—4 小题和第 2 题错得多，回看第 1—4 课；第 1 题的第 5—8 小题回看第 7 课；第 3 题回看第 6 课；第 4、6 题回看第 5、9 课；第 5 题回看第 4、8 课；第 7 题按题后括号里的语法点回看对应的课；第 8、9 题对照复习课文。"
grammar: "主动形动词现在时与过去时（[изучающий, получивший]{.ru}）；被动形动词现在时与过去时（[управляемый, написанный]{.ru}）；短尾被动形动词（[был создан]{.ru}）；形动词短语与 [который]{.ru} 从句的互换；形动词的变格与位置；形容词化与名词化的形动词（[ведущий, присутствующие]{.ru}）；被动结构：短尾被动形动词、[-ся]{.ru} 动词、不定人称句。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形动词形式。
    why: "第 1 题被说明的名词 [студенты]{.ru} 是复数第一格，形动词跟它一致用 [проходящие]{.ru}。第 2 题 [вырасти]{.ru} 的过去时 [вырос]{.ru} 不以 [-л]{.ru} 结尾，直接加 [-ш-]{.ru}：[выросший]{.ru}；[выросвший]{.ru} 是把 [-вш-]{.ru} 硬加上去的错误形式；[выросшая]{.ru} 是阴性，和 [мальчик]{.ru} 不一致。第 3 题飞船是被操纵的对象，用被动形动词现在时 [управляемый]{.ru}；[управляющий]{.ru}、[управлявший]{.ru} 是主动形动词，意思变成“飞船操纵别的东西”。第 4 题 [стихотворение]{.ru} 是中性，诗是被写的，用被动形动词过去时中性 [написанное]{.ru}；[пишущее]{.ru} 是主动形动词。第 5 题 [стать кем]{.ru} 要求第五格，[учёным]{.ru} 是单数第五格，形动词跟着用 [получившим]{.ru}。第 6 题 [одним из учёных]{.ru} 里形动词说明的是“获奖的学者们”，和复数第二格 [учёных]{.ru} 一致，用 [получивших]{.ru}，不和 [одним]{.ru} 一致。第 7 题 [сомневаться]{.ru} 是 [-ся]{.ru} 动词，形动词后面永远是 [-ся]{.ru}，不写成 [-сь]{.ru}；形动词和复数第一格 [учёные]{.ru} 一致，用 [сомневавшиеся]{.ru}，[сомневавшийся]{.ru} 是阳性单数，[сомневавшихся]{.ru} 是第二格。第 8 题 [стихотворение]{.ru} 是中性，[начинаться]{.ru} 的形动词保留 [-ся]{.ru}：[начинающееся]{.ru}；[начинающаяся]{.ru} 是阴性。"
    items:
      - stem: Студенты, ___ мимо памятника, знают, что Ломоносов пришёл в Москву пешком.
        options: [проходящие, проходящих, проходящая]
        answer: проходящие
      - stem: Мальчик, ___ рядом с заводом, часто смотрел, как рабочие делают стекло.
        options: [выросший, выросвший, выросшая]
        answer: выросший
      - stem: Корабль, ___ в основном автоматикой, один раз облетел Землю.
        options: [управляемый, управляющий, управлявший]
        answer: управляемый
      - stem: Это стихотворение, ___ за полгода до гибели поэта, знает каждый школьник.
        options: [написанное, написанный, пишущее]
        answer: написанное
      - stem: Павлов стал первым русским учёным, ___ Нобелевскую премию.
        options: [получившим, получивший, получившего]
        answer: получившим
      - stem: Павлов был одним из учёных, ___ Нобелевскую премию.
        options: [получивших, получившим, получивший]
        answer: получивших
      - stem: Учёные, ___ в системе Менделеева, признали, что он был прав.
        options: [сомневавшиеся, сомневавшийся, сомневавшихся]
        answer: сомневавшиеся
      - stem: Лермонтов написал стихотворение «Смерть поэта», ___ словами «Погиб поэт…».
        options: [начинающееся, начинающийся, начинающаяся]
        answer: начинающееся

  - id: e2
    type: fill
    task: 用括号里动词的形动词填空，注意形动词的种类和性、数、格。
    why: "先判断主动还是被动，再定时间。第 1 题年轻人自己梦想，主动；谓语 [приходят]{.ru} 是现在时，用现在时 [мечтающих]{.ru}，和复数第二格 [людей]{.ru} 一致。第 2 题杂志是被出版的，被动；[издавать]{.ru} 是未完成体，构成被动现在时，保留 [-ва-]{.ru}：[издаваемый]{.ru}。第 3 题 [получить]{.ru} 是完成体，没有现在时形动词，主动过去时 [получившие]{.ru}，和 [учёные]{.ru} 一致。第 4 题地方是被买下的，[купить]{.ru} 有辅音交替 [куплю]{.ru}，形动词 [купленный]{.ru}，和第六格 [месте]{.ru} 一致：[купленном]{.ru}，不要写成 [купенном]{.ru}。第 5 题信号是被接收的，[принимать]{.ru} 未完成体 → 被动现在时 [принимаемые]{.ru}。第 6 题钟是被停下的，[остановить]{.ru} 第一人称 [остановлю]{.ru}，形动词 [остановленные]{.ru}。第 7 题 [издать]{.ru} 是完成体 → 被动过去时 [изданный]{.ru}，和第四格 [номер]{.ru} 一致（非动物名词第四格同第一格）。第 8 题 [увидеть]{.ru} 完成体 → 主动过去时 [увидевшие]{.ru}。"
    items:
      - stem: Тысячи молодых людей, ___ учиться в Московском университете, приходят на Воробьёвы горы.
        hint: мечтать
        accept: [мечтающих]
      - stem: Журнал, ___ самим поэтом, выходил четыре раза в год.
        hint: издавать
        accept: [издаваемый]
      - stem: В 1955 году американские учёные, ___ новый элемент, назвали его менделевием.
        hint: получить
        accept: [получившие]
      - stem: Похоронили его в месте, ___ за год до этого.
        hint: купить
        accept: [купленном]
      - stem: Его сигналы, ___ радиолюбителями разных стран, слушала вся планета.
        hint: принимать
        accept: [принимаемые]
      - stem: Посетители видят часы, ___ в минуту его смерти.
        hint: остановить
        accept: [остановленные]
      - stem: Первый номер журнала, ___ в апреле, Пушкин готовил почти один.
        hint: издать
        accept: [изданный]
      - stem: Школьники, впервые ___ эту таблицу, часто думают, что она существовала всегда.
        hint: увидеть
        accept: [увидевшие]

  - id: e3
    type: rewrite
    task: 把 [который]{.ru} 从句改成形动词短语。
    example:
      cue: Молодёжь, которая мечтает о науке, читает письмо Павлова.
      answer: Молодёжь, мечтающая о науке, читает письмо Павлова.
    why: "[который]{.ru} 是第一格的，换成主动形动词：第 1 题 [любили]{.ru} 过去时 → [любившие]{.ru}；第 2 题 [любила]{.ru} → [любившая]{.ru}，和阴性的 [вдова]{.ru} 一致；第 6 题 [казаться]{.ru} 不及物，只能换成主动形动词 [казавшаяся]{.ru}；第 7 题现在时 [приходят]{.ru} → 现在时 [приходящие]{.ru}。[который]{.ru} 是第四格的，换成被动形动词，从句的主语变第五格：第 3 题 [написал]{.ru} 完成体 → [написанные Чайковским]{.ru}；第 4 题 [покупал]{.ru} 未完成体，被动现在时 [покупаемые Третьяковым]{.ru}；第 5 题 [построила]{.ru} 完成体 → [построенная группой]{.ru}，和阴性的 [ракета]{.ru} 一致。体不能改：第 4 题不能换成 [купленные]{.ru}，那是完成体 [купить]{.ru} 的形动词。常见错误是让形动词和从句里的主语一致，写成 [балеты, написанный Чайковским]{.ru}。"
    items:
      - cue: Родители, которые сами любили музыку, не думали, что сын станет музыкантом.
        accept: ["Родители, сами любившие музыку, не думали, что сын станет музыкантом."]
      - cue: Богатая вдова, которая любила его музыку, написала композитору письмо.
        accept: ["Богатая вдова, любившая его музыку, написала композитору письмо."]
      - cue: Балеты, которые написал Чайковский, идут на сценах многих стран.
        accept: ["Балеты, написанные Чайковским, идут на сценах многих стран.", "Написанные Чайковским балеты идут на сценах многих стран."]
      - cue: Картины, которые покупал Третьяков, сначала висели в его доме.
        accept: ["Картины, покупаемые Третьяковым, сначала висели в его доме.", "Покупаемые Третьяковым картины сначала висели в его доме."]
      - cue: Ракета, которую построила группа, поднялась всего на четыреста метров.
        accept: ["Ракета, построенная группой, поднялась всего на четыреста метров.", "Построенная группой ракета поднялась всего на четыреста метров."]
      - cue: Работа, которая казалась ему скучной, не приносила радости.
        accept: ["Работа, казавшаяся ему скучной, не приносила радости."]
      - cue: Посетители, которые приходят в музей, видят кабинет поэта.
        accept: ["Посетители, приходящие в музей, видят кабинет поэта.", "Приходящие в музей посетители видят кабинет поэта."]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [здание]{.ru} 是中性，系词和短尾都用中性 [было построено]{.ru}；短尾只写一个 [н]{.ru}，[построенно]{.ru} 是错的。第 2 题主语是数量词组 [около двух тысяч произведений]{.ru}，用中性单数 [было принесено]{.ru}。第 3 题 [до сих пор]{.ru} 说的是一直在进行的事，用未完成体 [-ся]{.ru} 动词 [строятся]{.ru}；完成体短尾 [построены]{.ru} 表示结果，不和 [до сих пор]{.ru} 连用；[строится]{.ru} 是单数，和复数主语 [корабли]{.ru} 不一致。第 4 题 [Королёва]{.ru} 是第四格，句中没有主语，是不定人称句，动词用复数 [арестовали]{.ru}；[арестовал]{.ru} 意思变成“某个男人逮捕了他”；[был арестован]{.ru} 要求主语用第一格 [Королёв]{.ru}。第 5 题被动句里动作的发出者用第五格 [Перовым]{.ru}。第 6 题 [зал]{.ru} 是阳性，将来时 [будет открыт]{.ru}。第 7 题短尾作谓语，现在时不用系词，和阴性的 [галерея]{.ru} 一致：[открыта]{.ru}；长尾 [открытая]{.ru} 只能作定语。"
    items:
      - stem: В 1874 году рядом с домом ___ специальное здание для галереи.
        options: [было построено, был построен, было построенно]
        answer: было построено
      - stem: В дар ___ около двух тысяч произведений.
        options: [было принесено, была принесена, был принесён]
        answer: было принесено
      - stem: В этом городе до сих пор ___ космические корабли.
        options: [строятся, построены, строится]
        answer: строятся
      - stem: В 1938 году Королёва ___.
        options: [арестовали, арестовал, был арестован]
        answer: арестовали
      - stem: Портрет Достоевского был написан ___.
        options: [Перовым, Перов, Перова]
        answer: Перовым
      - stem: Новый зал ___ в мае.
        options: [будет открыт, будет открыто, будут открыты]
        answer: будет открыт
      - stem: Галерея ___ для всех желающих, и входить в неё можно бесплатно.
        options: [открыта, открытая, открыто]
        answer: открыта

  - id: e5
    type: choice
    task: 选择正确的形式。
    why: "第 1、3、4、7 题是名词化的形动词，按形容词变格：第 1 题作主语，用第一格 [Присутствующие]{.ru}；第 3 题 [для]{.ru} 要求第二格 [желающих]{.ru}；第 4 题作主语 [отдыхающие]{.ru}；第 7 题 [для]{.ru} 后用 [учащихся]{.ru}。第 2 题“领衔的”是形容词化的 [ведущий]{.ru}，[стать кем]{.ru} 用第五格 [ведущей]{.ru}；[ведомой]{.ru} 是被动形动词“被引领的”，意思不对。第 5 题 [солдат]{.ru} 前只有一个词，没有任何从属词，是形容词，写一个 [н]{.ru}：[раненый]{.ru}，第五格 [раненым]{.ru}。第 6 题有状语 [смертельно]{.ru}，是形动词 [раненный]{.ru}，写两个 [н]{.ru}；短尾 [ранен]{.ru} 不能作定语。第 8 题“原马林斯基剧院”用 [бывший]{.ru}，[на сцене]{.ru} 后面是第二格 [бывшего Мариинского театра]{.ru}；[будущего]{.ru} 是“未来的”。"
    items:
      - stem: ___ в зале долго не отпускали артистов.
        options: [Присутствующие, Присутствующих, Присутствующими]
        answer: Присутствующие
      - stem: В 1944 году Уланова стала ___ балериной Большого театра.
        options: [ведущей, ведомой, ведущая]
        answer: ведущей
      - stem: Галерея была открыта для всех ___.
        options: [желающих, желающие, желающим]
        answer: желающих
      - stem: В парке Победы ___ останавливаются у её памятника.
        options: [отдыхающие, отдыхающих, отдыхающими]
        answer: отдыхающие
      - stem: Врач долго разговаривал с ___ солдатом.
        options: [раненым, раненным, ранен]
        answer: раненым
      - stem: Смертельно ___ поэт упал, но нашёл силы выстрелить.
        options: [раненный, раненый, ранен]
        answer: раненный
      - stem: В этот зал вход только для ___.
        options: [учащихся, учащиеся, учащимся]
        answer: учащихся
      - stem: В 1928 году Уланова стала танцевать на сцене ___ Мариинского театра.
        options: [бывшего, будущего, бывшем]
        answer: бывшего

  - id: e6
    type: rewrite
    task: 把主动句改成带短尾被动形动词的被动句，保留动作的发出者。
    example:
      cue: Художник Васнецов создал фасад здания.
      answer: Фасад здания был создан художником Васнецовым.
    why: "主动句的宾语（第四格）变成被动句的主语（第一格），主语变第五格，系词 [быть]{.ru} 和短尾都和新主语在性、数上一致。第 1 题 [картины]{.ru} 复数：[были куплены Третьяковым]{.ru}，[купить]{.ru} 有交替 [п → пл]{.ru}。第 2 题 [музей]{.ru} 阳性：[был открыт Модестом]{.ru}。第 3 题 [лаборатория]{.ru} 阴性：[была открыта Ломоносовым]{.ru}，形容词 [первая, химическая]{.ru} 也随着变成第一格。第 4 题 [проект]{.ru} 阳性：[был разработан Королёвым]{.ru}。第 5 题 [указ]{.ru} 阳性：[был подписан императрицей Елизаветой]{.ru}，同位语 [императрица Елизавета]{.ru} 两个词都变第五格。第 6 题 [балет]{.ru} 阳性：[был написан Чайковским]{.ru}。最常见的错误是忘了把发出者变成第五格，或者系词跟着原来的主语走。"
    items:
      - cue: Третьяков купил эти картины.
        accept: ["Эти картины были куплены Третьяковым."]
      - cue: Модест открыл музей в Клину.
        accept: ["Музей в Клину был открыт Модестом."]
      - cue: Ломоносов открыл первую в России химическую лабораторию.
        accept: ["Первая в России химическая лаборатория была открыта Ломоносовым."]
      - cue: Королёв разработал проект планёра.
        accept: ["Проект планёра был разработан Королёвым."]
      - cue: Императрица Елизавета подписала указ.
        accept: ["Указ был подписан императрицей Елизаветой."]
      - cue: Чайковский написал балет «Щелкунчик».
        accept: ["Балет «Щелкунчик» был написан Чайковским."]

  - id: e7
    type: translate
    task: 译成俄语。括号里注明了要用的语法。
    why: "第 1 题“研究……的学者”用主动形动词现在时 [изучающие]{.ru}，也可以用 [которые изучают]{.ru}；[называть кого кем]{.ru} 后面用第五格 [первым русским учёным]{.ru}。第 2 题一次完成的结果，用完成体短尾 [был запущен]{.ru}，和阳性的 [спутник]{.ru} 一致。第 3 题“柴可夫斯基写的”用被动形动词过去时 [написанные Чайковским]{.ru}，发出者第五格；“上演”是 [идти]{.ru}。第 4 题不定人称句，[Королёва]{.ru} 用第四格，动词复数 [арестовали]{.ru}，不能加发出者。第 5 题名词化的形动词 [присутствующие]{.ru} 单独作主语，后面不加 [люди]{.ru}。第 6 题短尾 [была основана]{.ru} 和阴性的 [галерея]{.ru} 一致，[московским купцом]{.ru} 第五格。第 7 题 [стать / быть кем]{.ru} 用第五格，形动词 [получившим]{.ru} 也跟着用单数第五格。"
    items:
      - zh: 研究罗蒙诺索夫生平的学者称他为第一位俄罗斯学者。（主动形动词现在时，第 1 课）
        accept: ["Учёные, изучающие жизнь Ломоносова, называют его первым русским учёным.", "Изучающие жизнь Ломоносова учёные называют его первым русским учёным.", "Учёные, которые изучают жизнь Ломоносова, называют его первым русским учёным."]
        rubric: ["[изучающие]{.ru}：主动形动词现在时，复数第一格，和 [учёные]{.ru} 一致；也可以用 [которые изучают]{.ru}", "[называть кого кем]{.ru}：[первым русским учёным]{.ru} 用第五格"]
      - zh: 第一颗人造地球卫星是 1957 年 10 月 4 日发射的。（短尾被动形动词，第 5、9 课）
        accept: ["Первый искусственный спутник Земли был запущен 4 октября 1957 года.", "4 октября 1957 года был запущен первый искусственный спутник Земли."]
        rubric: ["[был запущен]{.ru}：完成体短尾，阳性，和 [спутник]{.ru} 一致", "[искусственный спутник Земли]{.ru}", "日期用第二格：[4 октября 1957 года]{.ru}"]
