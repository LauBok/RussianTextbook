        length: 120–150
        model: "В сентябре в главном здании Московского университета открылась выставка «Девять портретов», подготовленная студентами. Она открыта для всех желающих. В первом зале посетители видят «Российскую грамматику» Ломоносова и таблицу, которую Менделеев отправил химикам разных стран в 1869 году. Пустые места, оставленные для ещё не открытых элементов, показаны красным цветом. Следующий зал посвящён искусству: здесь висят картины, купленные Третьяковым, лежит журнал «Современник», издаваемый когда-то самим Пушкиным, звучит музыка Чайковского и показывают фильм-балет с Улановой. В третьем зале рассказывают о Павлове — первом русском учёном, получившем Нобелевскую премию. В самом большом зале стоят модели корабля «Восток» и первого спутника, запущенного в 1957 году. Там же висит портрет Королёва, под руководством которого готовились эти полёты. При жизни его имя не называлось. Студенты, подготовившие выставку, хотели показать людей, отдавших своему делу всю жизнь."
        rubric: ["提纲六项都有，顺序与课文一致", "至少用三种形动词，性、数、格和被说明的名词一致，发出者用第五格", "三种被动结构都用到：短尾被动形动词、[-ся]{.ru} 动词、不定人称句", "形动词短语的逗号正确", "120–150 词"]
        notes: "范文约 125 词。用了三种形动词：主动过去时 [получившем, подготовившие, отдавших]{.ru}；被动现在时 [издаваемый]{.ru}；被动过去时 [подготовленная, оставленные, купленные, запущенного]{.ru}。[получившем]{.ru} 跟着 [о Павлове — первом русском учёном]{.ru} 用第六格。被动结构：短尾 [открыта, показаны, посвящён]{.ru}，[-ся]{.ru} 动词 [готовились, не называлось]{.ru}，不定人称句 [показывают, рассказывают]{.ru}。第三句保留 [который]{.ru} 从句，和前后的形动词短语交替，读起来不单调。展厅里的细节（钢琴、地图、照片、板子）都省去了，只留每个展厅最主要的展品。"
