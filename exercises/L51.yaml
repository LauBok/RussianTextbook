lesson: L51
grammar: "名词第三格单数：阳性、中性 [-у / -ю]{.ru}，阴性 [-е]{.ru}、[-ии]{.ru}、[-и]{.ru}；疑问代词 [кому́]{.ru}；要求第三格的动词 [звони́ть, писа́ть, расска́зывать, дари́ть, сове́товать, передава́ть приве́т]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里名词的第三格。
    why: 阳性硬辅音结尾加 [-у]{.ru}（[бра́ту]{.ru}、[дру́гу]{.ru}）；[-ь]{.ru}、[-й]{.ru} 结尾变 [-ю]{.ru}（[учи́телю]{.ru}、[Серге́ю]{.ru}）。阴性 [-а]{.ru} 变 [-е]{.ru}，[-ия]{.ru} 变 [-ии]{.ru}——[Мари́и]{.ru} 不能写成 *[Мари́е]{.ru}*。[па́па]{.ru}、[Ми́ша]{.ru} 虽是阳性，以 [-а]{.ru} 结尾，按阴性变成 [па́пе]{.ru}、[Ми́ше]{.ru}。[оте́ц]{.ru} 变格时 [е]{.ru} 脱落，是 [отцу́]{.ru}。
    items:
      - stem: Ван Лэй звони́т ___.
        hint: ма́ма
        accept: [ма́ме]
      - stem: А́нна пи́шет сообще́ние ___.
        hint: ба́бушка
        accept: [ба́бушке]
      - stem: Ма́ма передаёт приве́т ___.
        hint: Мари́я Никола́евна
        accept: [Мари́и Никола́евне]
      - stem: Что мы пода́рим ___?
        hint: Ми́ша
        accept: [Ми́ше]
      - stem: Я расска́зываю ___ о Пеки́не.
        hint: учи́тель
        accept: [учи́телю]
      - stem: Ба́бушка звони́т ___ ка́ждый день.
        hint: па́па
        accept: [па́пе]
      - stem: Сын пи́шет ___.
        hint: оте́ц
        accept: [отцу́]
      - stem: А́нна сове́тует ___ чита́ть.
        hint: брат
        accept: [бра́ту]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "[звони́ть]{.ru}、[писа́ть]{.ru}、[расска́зывать]{.ru}、[дари́ть]{.ru} 的对象“给谁”用第三格；[спра́шивать]{.ru}、[ви́деть]{.ru}、[знать]{.ru} 的对象用第四格。第 1 题最容易错：汉语说“给妈妈打电话”，[звони́ть]{.ru} 后面要用第三格 [ма́ме]{.ru}，不是第四格 [ма́му]{.ru}。第 4 题 [спра́шивать]{.ru} 正好相反，要用第四格。"
    items:
      - stem: Я ча́сто звоню́ ___.
        options: [ма́му, ма́ме]
        answer: ма́ме
      - stem: Ми́ша пи́шет сообще́ние ___.
        options: [А́нну, А́нне]
        answer: А́нне
      - stem: Я хорошо́ зна́ю ___.
        options: [А́нну, А́нне]
        answer: А́нну
      - stem: А́нна спра́шивает ___.
        options: [ба́бушку, ба́бушке]
        answer: ба́бушку
      - stem: Па́па расска́зывает ___ о рабо́те.
        options: [сы́на, сы́ну]
        answer: сы́ну
      - stem: Что ты пода́ришь ___?
        options: [бра́та, бра́ту]
        answer: бра́ту

  - id: e3
    type: rewrite
    task: 就划线部分提问，用 [кому́]{.ru} 或 [кого́]{.ru}。
    placeholder: Кому́ … ? / Кого́ … ?
    example:
      cue: Ван Лэй звони́т ма́ме.
      answer: Кому́ звони́т Ван Лэй?
    why: 对第三格提问用 [кому́]{.ru}，对第四格提问用 [кого́]{.ru}。先看动词要求哪个格：[звони́ть, писа́ть, сове́товать]{.ru} 要求第三格；[спра́шивать]{.ru} 要求第四格。
    items:
      - cue: А́нна пи́шет ба́бушке.
        accept: ["Кому́ пи́шет А́нна?", "Кому́ А́нна пи́шет?"]
      - cue: Па́па сове́тует сы́ну.
        accept: ["Кому́ сове́тует па́па?", "Кому́ па́па сове́тует?"]
      - cue: А́нна спра́шивает ба́бушку.
        accept: ["Кого́ спра́шивает А́нна?", "Кого́ А́нна спра́шивает?"]
      - cue: Ба́бушка звони́т па́пе.
        accept: ["Кому́ звони́т ба́бушка?", "Кому́ ба́бушка звони́т?"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 注意“给谁”一律用第三格；“问奶奶”用第四格。
    items:
      - zh: 每个星期天王磊都给妈妈打电话。
        accept: ["Ка́ждое воскресе́нье Ван Лэй звони́т ма́ме.", "Ван Лэй звони́т ма́ме ка́ждое воскресе́нье.", "Ван Лэй ка́ждое воскресе́нье звони́т ма́ме."]
        rubric: ["[ма́ме]{.ru} 用第三格", "“每个星期天”是 [ка́ждое воскресе́нье]{.ru}，[воскресе́нье]{.ru} 是中性"]
      - zh: 妈妈向伊万·谢尔盖耶维奇问好。
        accept: ["Ма́ма передаёт приве́т Ива́ну Серге́евичу.", "Ма́ма передаёт Ива́ну Серге́евичу приве́т."]
        rubric: ["[передава́ть приве́т]{.ru} + 第三格", "名字和父称都变成第三格：[Ива́ну Серге́евичу]{.ru}"]
      - zh: 你给谁写短信？——给奶奶。
        accept: ["— Кому́ ты пи́шешь сообще́ние? — Ба́бушке.", "— Кому́ ты пи́шешь? — Ба́бушке."]
        rubric: ["疑问词用 [кому́]{.ru}", "答句只用一个第三格 [Ба́бушке]{.ru}"]
      - zh: 我们送米沙什么？
        accept: ["Что мы пода́рим Ми́ше?", "Что мы да́рим Ми́ше?", "Что пода́рим Ми́ше?"]
        rubric: ["[Ми́ше]{.ru} 是第三格", "[что]{.ru} 是直接对象（第四格，与第一格同形）"]
      - zh: 爸爸给儿子讲莫斯科的事。
        accept: ["Па́па расска́зывает сы́ну о Москве́.", "Па́па расска́зывает о Москве́ сы́ну."]
        rubric: ["[сы́ну]{.ru} 用第三格", "[о Москве́]{.ru} 用第六格"]

  - id: e5
    type: open
    task: 根据课文回答问题，把答案连成一段话。
    items:
      - prompt: "[Когда́ Ван Лэй звони́т домо́й? Кому́ он звони́т? О чём он расска́зывает ма́ме? Что сове́тует сы́ну па́па? Кому́ ма́ма передаёт приве́т? Кому́ ба́бушка звони́т ка́ждый день?]{.ru}"
        length: 40–70
        model: "Ка́ждое воскресе́нье Ван Лэй звони́т домо́й. Он звони́т ма́ме и па́пе. Он расска́зывает ма́ме о Москве́ и об университе́те. Па́па сове́тует сы́ну чита́ть и говори́ть по-ру́сски ка́ждый день. Ма́ма передаёт приве́т Мари́и Никола́евне и Ива́ну Серге́евичу. А ба́бушка ка́ждый день звони́т па́пе, Ива́ну Серге́евичу."
        rubric: ["回答全部六个问题", "[ма́ме, па́пе, сы́ну, Мари́и Никола́евне, Ива́ну Серге́евичу]{.ru} 都用第三格", "[о Москве́]{.ru}、[об университе́те]{.ru} 用第六格"]
        notes: 范文按问题的顺序组织，每个问题一句话。第四个问题把课文里的直接引语改成了 [сове́товать]{.ru} + 不定式，这样更像叙述。最后一句点明“爸爸”是谁，避免和王磊的爸爸混淆。
