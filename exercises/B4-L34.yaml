lesson: B4-L34
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что видит и чувствует путешественник в дороге ночью и утром (первая часть отрывка)?]{.ru}"
        length: 50–80
        model: "Ночью путешественник дремлет, иногда проснётся и видит незнакомый город при свете луны, старые церкви, деревянные и каменные дома, тёмные тени. Всё спит, только где-то в окошке горит огонёк. Утром перед ним поля и степи, холодное небо с золотой полосой, потом деревня у пруда и церковь. Он чувствует холод и голод, но ему хорошо: дорога кажется ему прекрасной."
        rubric: ["写出夜里看到的城市和月光", "写出早晨的田野、天空、村庄", "说出旅行者的感受：困倦、寒冷、饥饿，但心情愉快"]
        notes: "第一部分按时间顺序写：上车—入睡—夜里醒来（城市、月光）—再睡—早晨醒来（草原、天空）—中午（池塘、村庄）。最后一句 [Боже! как ты хороша подчас, далёкая, далёкая дорога!]{.ru} 是全段的结论。"
      - prompt: "[Почему автор пишет, что дорога много раз его «спасала»?]{.ru}"
        length: 30–60
        model: "Для автора дорога — не только путешествие, но и источник сил и вдохновения. Когда ему было тяжело, он уезжал, и в пути у него появлялись новые замыслы и поэтические мечты. Поэтому он говорит о дороге как о друге, который всегда помогал ему."
        rubric: ["指出道路给作者带来力量和灵感", "引用或转述“诞生了多少构思”一句"]
        notes: "果戈理一生大部分时间在旅途中度过，《死魂灵》第一卷主要是在国外写成的。这一句是作者本人的声音，叙述从“你”变成了“我”：[я хватался за тебя]{.ru}。"
      - prompt: "[Что общего у тройки и Руси в последнем абзаце? Какой вопрос автор задаёт Руси и получает ли он ответ?]{.ru}"
        length: 40–70
        model: "Как и тройка, Русь несётся вперёд быстро и сильно, и все остальные народы смотрят на неё с удивлением и дают ей дорогу. Автор спрашивает: «Русь, куда ж несёшься ты?» Но ответа нет. Автор верит в силу и будущее России, но не знает, куда она идёт."
        rubric: ["说出相同点：速度、力量、神秘、别的民族让路", "指出作者问“你要奔向哪里”，没有得到回答"]
        notes: "答题时注意 [Не так ли и ты, Русь…]{.ru} 是比较句：“你不也像……吗”。结尾的 [Не даёт ответа]{.ru} 很重要：作者对俄罗斯的未来既充满信心，又感到不安。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[даль]{.ru}"
        accept: ["Место, которое находится очень далеко.", "То, что видно далеко впереди.", "Далёкое пространство."]
        rubric: ["说明是远处、远方"]
      - zh: "[верста]{.ru}"
        accept: ["Старая русская мера длины, немного больше километра.", "Старая мера расстояния, около одного километра.", "Столб у дороги, на котором написано расстояние."]
        rubric: ["说明是旧时的长度单位，约一公里", "或说明是路边的里程标"]
      - zh: "[мчаться]{.ru}"
        accept: ["Очень быстро ехать или бежать.", "Двигаться очень быстро.", "Лететь, нестись."]
        rubric: ["说明是非常快地移动"]
      - zh: "[колокольчик]{.ru}"
        accept: ["Маленький звонок.", "Маленький звонок, который звучит, когда едет тройка."]
        rubric: ["说明是小铃铛"]
      - zh: "[пекарь]{.ru}"
        accept: ["Человек, который печёт хлеб.", "Тот, кто печёт хлеб."]
        rubric: ["说明是烤面包的人"]
      - zh: "[вихрь]{.ru}"
        accept: ["Очень сильный ветер, который кружится.", "Сильный ветер, который движется по кругу."]
        rubric: ["说明是旋转的强风"]

  - id: e3
    type: rewrite
    task: 把句中带庄重或口语色彩的词换成中性的现代说法。
    why: "第 1 题 [очи]{.ru} 是古语、诗歌词，中性说法是 [глаза]{.ru}。第 2 题 [сей]{.ru} 的第六格 [сём]{.ru} 是古语，现代用 [этот]{.ru}：[в этом]{.ru}。第 3 题 [сих]{.ru} 是 [сей]{.ru} 的复数第六格，现代说 [в этих]{.ru}。第 4 题 [кажись]{.ru} 是俗语，规范说法是 [кажется]{.ru}。第 5 题 [недвижны]{.ru} 是诗歌词，现代说 [неподвижны]{.ru}。第 6 题 [прижавши]{.ru} 是旧式副动词，现代用 [прижав]{.ru}。替换以后意思不变，但庄重或民间的色彩没有了，这正说明果戈理是有意混用不同语体的。"
    example:
      cue: "Смежаются очи."
      answer: "Смежаются глаза."
    items:
      - cue: "Что-то страшное заключено в сём быстром мельканье."
        accept: ["Что-то страшное заключено в этом быстром мельканье.", "Что-то страшное заключено в этом быстром мелькании."]
      - cue: "Что за неведомая сила заключена в сих конях?"
        accept: ["Что за неведомая сила заключена в этих конях?"]
      - cue: "Кажись, неведомая сила подхватила тебя."
        accept: ["Кажется, неведомая сила подхватила тебя."]
      - cue: "Только небо да месяц кажутся недвижны."
        accept: ["Только небо да месяц кажутся неподвижны.", "Только небо да месяц кажутся неподвижными."]
      - cue: "Храпишь, прижавши к углу своего соседа."
        accept: ["Храпишь, прижав к углу своего соседа."]

  - id: e4
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题抒情插笔是作者离开情节、直接表达感情和思考的段落。第 2 题 [ты]{.ru} 不指具体的人，而是把每个读者都带进车里，是泛指的第二人称。第 3 题 [летят… летят… летит… летит]{.ru} 同一个词放在几个句子开头，是首语重复，造成飞速掠过的感觉。第 4 题“道路”一段写到马车装配时说，做车的是一个雅罗斯拉夫尔的庄稼汉，车子很简单，没有铁螺丝。第 5 题 [Дымом дымится]{.ru} 是同根词重复，民歌常用。第 6 题最后两句：作者问俄罗斯奔向哪里，[Не даёт ответа]{.ru}。"
    items:
      - stem: "Лирическое отступление — это часть текста, где ___."
        options: ["автор оставляет сюжет и говорит о своих чувствах и мыслях", "герои разговаривают друг с другом", "автор описывает, как выглядит герой"]
        answer: "автор оставляет сюжет и говорит о своих чувствах и мыслях"
      - stem: "В словах «и сам летишь, и всё летит» слово «ты» обозначает ___."
        options: ["любого человека, в том числе читателя", "Чичикова", "ямщика"]
        answer: "любого человека, в том числе читателя"
      - stem: "Повтор «летят вёрсты, летят навстречу купцы…, летит лес» помогает ___."
        options: ["почувствовать быструю езду", "описать купцов подробнее", "показать, что тройка стоит на месте"]
        answer: "почувствовать быструю езду"
      - stem: "Тройку, по словам автора, собрал ___."
        options: ["ярославский мужик с одним топором да долотом", "немецкий мастер", "сам Чичиков"]
        answer: "ярославский мужик с одним топором да долотом"
      - stem: "Слова «Дымом дымится» — это приём, взятый из ___."
        options: ["народной поэзии", "научного языка", "деловых бумаг"]
        answer: "народной поэзии"
      - stem: "На вопрос «Русь, куда ж несёшься ты?» ___."
        options: ["ответа нет", "Русь отвечает автору", "отвечает Чичиков"]
        answer: "ответа нет"

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词。注意这是一段抒情插笔：概要要交代作者的感情和思想的发展，而不仅仅是列举景物。
    items:
      - prompt: "[Напишите краткое изложение отрывка.]{.ru}"
        length: 130–170
        model: "Отрывок взят из последней главы первого тома «Мёртвых душ». Чичиков уезжает из города, и автор оставляет своего героя, чтобы поговорить о дороге и о России. Сначала он описывает, как человек едет ночью: дремлет, иногда проснётся и видит при свете луны незнакомый город, а утром — поля, степи и деревню у пруда. Автор признаётся, что дорога не раз спасала его и что в пути у него появлялись лучшие замыслы. Потом автор возвращается к Чичикову, который любит быструю езду, и говорит, что быструю езду любит каждый русский. Когда мчится тройка, кажется, что летит всё вокруг. Тройку собрал простой мужик, но в ней есть что-то чудесное. В конце автор сравнивает с тройкой всю Русь: она так же быстро несётся вперёд, и другие народы дают ей дорогу. Автор спрашивает Русь, куда она несётся, но ответа нет."
        rubric: ["交代出处和情境（乞乞科夫离城）", "写出两部分：道路与旅途感受；三驾马车与俄罗斯", "写出结尾的比喻和无答之问", "篇幅 130—170 词，用自己的话"]
        notes: "范文约 160 词。抒情插笔的概要不能逐句复述景物（月光、屋顶、池塘只需一句概括），重点是思路：道路—作者本人—乞乞科夫—每个俄罗斯人—三驾马车—罗斯。用 [сначала, потом, в конце]{.ru} 标出层次。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评：“三驾马车为什么成为俄罗斯的象征？”可以谈果戈理的比喻、选文的语言，也可以谈你自己对这一形象的理解。
    items:
      - prompt: "[Почему тройка стала символом России? Напишите отзыв о прочитанном отрывке.]{.ru}"
        length: 250–300
        model: "Слова «Русь, куда ж несёшься ты?» знает, наверное, каждый русский школьник. Почему именно тройка, которую сделал простой мужик, стала у Гоголя символом всей страны?\n\nВо-первых, тройка связана с самой русской землёй. Россия огромна, она «разметнулась на полсвета», и расстояния в ней считают не километрами, а днями пути. Поэтому дорога и быстрая езда стали частью русской жизни и русского характера. Гоголь говорит, что быструю езду любит каждый русский, потому что его душа стремится к свободе и не боится риска.\n\nВо-вторых, тройка — образ народный. Её собрал не немецкий мастер, а простой ярославский мужик «с одним топором да долотом», и ямщик сидит на ней не в ботфортах, а в рукавицах. Но в этой простой вещи есть огромная сила. Так и Россия казалась Гоголю бедной и простой, но полной неведомой силы.\n\nВ-третьих, образ тройки передаёт движение. Мимо летят вёрсты, лес, купцы, и всё остаётся позади. Гоголь писал «Мёртвые души» о людях, которые никуда не движутся, живут скучно и мелко. А в конце книги появляется совсем другая Россия — живая, быстрая, устремлённая вперёд.\n\nНо самое интересное, по-моему, — последние слова: «Не даёт ответа». Автор восхищается Русью, но не знает, куда она несётся. В его вопросе есть и восторг, и тревога. Наверное, поэтому этот образ остаётся живым и сегодня: каждое поколение снова задаёт тот же вопрос."
        rubric: ["有明确的中心论点，开头提出问题、结尾回应", "至少从两个角度论证（土地辽阔、民间性、运动感、无答之问等），每个角度有选文的例子", "注意抒情插笔在全书中的作用（与停滞的地主世界对照）可作为加分点", "篇幅 250—300 词，用 [во-первых, во-вторых, в-третьих]{.ru} 等组织段落"]
        notes: "范文约 270 词。结构：引子（名句与问题）—三个论点（土地与性格、民间性、运动）—转折（无答之问的双重情感）—结论（形象至今有生命力）。读后评论要引用原文的关键词，并用引号标出，但不要大段抄录。"
