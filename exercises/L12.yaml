lesson: L12
grammar: "以 [-ия]{.ru}、[-ие]{.ru} 结尾的名词第六格用 [-ии]{.ru}；表示处所时 [в]{.ru} 与 [на]{.ru} 的选择：活动、工作单位、开阔的地方用 [на]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里名词的第六格。
    why: 以 [-ия]{.ru}、[-ие]{.ru} 结尾的名词第六格是 [-ии]{.ru}，不要按普通 [-я]{.ru}、[-е]{.ru} 词写成 [-ие]{.ru}。第 5 题 [пло́щадь]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，也用 [-и]{.ru}；第 6 题 [у́лица]{.ru} 是普通的 [-а]{.ru} 词，用 [-е]{.ru}。
    items:
      - stem: О́льга Ви́кторовна в ___.
        hint: аудито́рия
        accept: ["аудито́рии"]
      - stem: Студе́нтка в ___.
        hint: общежи́тие
        accept: ["общежи́тии"]
      - stem: А́нна на ___.
        hint: ле́кция
        accept: ["ле́кции"]
      - stem: Библиоте́ка в ___.
        hint: зда́ние
        accept: ["зда́нии"]
      - stem: Мы на ___.
        hint: пло́щадь
        accept: ["пло́щади"]
      - stem: Ми́ша на ___.
        hint: у́лица
        accept: ["у́лице"]
      - stem: Студе́нты в ___.
        hint: лаборато́рия
        accept: ["лаборато́рии"]
      - stem: Москва́ в ___.
        hint: Росси́я
        accept: ["Росси́и"]

  - id: e2
    type: choice
    task: 用 [в]{.ru} 或 [на]{.ru} 填空。
    why: 活动（[уро́к]{.ru}、[ле́кция]{.ru}、[конце́рт]{.ru}、[экску́рсия]{.ru}）、工作单位（[рабо́та]{.ru}、[факульте́т]{.ru}、[ка́федра]{.ru}）和开阔的地方（[у́лица]{.ru}）用 [на]{.ru}；有墙有顶的地方（[аудито́рия]{.ru}、[зда́ние]{.ru}、[музе́й]{.ru}）用 [в]{.ru}。第 1 题和第 2 题对比：在上课用 [на]{.ru}，在教室用 [в]{.ru}。第 8 题也一样：人在博物馆里用 [в]{.ru}，“在参观”是活动，用 [на]{.ru}。
    items:
      - stem: Мы ___ уро́ке.
        options: [в, на]
        answer: на
      - stem: Мы ___ аудито́рии.
        options: [в, на]
        answer: в
      - stem: О́льга Ви́кторовна ___ ка́федре.
        options: [в, на]
        answer: на
      - stem: А́нна ___ конце́рте.
        options: [в, на]
        answer: на
      - stem: Библиоте́ка ___ зда́нии.
        options: [в, на]
        answer: в
      - stem: Ван Лэй ___ факульте́те.
        options: [в, на]
        answer: на
      - stem: Ми́ша ___ у́лице.
        options: [в, на]
        answer: на
      - stem: Мы в музе́е, ___ экску́рсии.
        options: [в, на]
        answer: на

  - id: e3
    type: rewrite
    task: 按例句回答问题：先说“不”，再按括号里的提示说出在哪里。
    placeholder: Нет, …
    example:
      cue: А́нна в библиоте́ке? (ле́кция)
      answer: Нет, она́ на ле́кции.
    why: 前置词跟着新的名词走：[ле́кция]{.ru}、[ка́федра]{.ru}、[рабо́та]{.ru}、[конце́рт]{.ru} 用 [на]{.ru}，[аудито́рия]{.ru}、[общежи́тие]{.ru} 用 [в]{.ru}。[-ия]{.ru}、[-ие]{.ru} 词的第六格是 [-ии]{.ru}。
    items:
      - cue: О́льга Ви́кторовна в аудито́рии? (ка́федра)
        accept: ["Нет, она́ на ка́федре.", "Нет, на ка́федре.", "Нет, О́льга Ви́кторовна на ка́федре."]
      - cue: Па́па до́ма? (рабо́та)
        accept: ["Нет, он на рабо́те.", "Нет, на рабо́те.", "Нет, па́па на рабо́те."]
      - cue: Студе́нты на уро́ке? (общежи́тие)
        accept: ["Нет, они́ в общежи́тии.", "Нет, в общежи́тии.", "Нет, студе́нты в общежи́тии."]
      - cue: Ван Лэй в библиоте́ке? (лаборато́рия)
        accept: ["Нет, он в лаборато́рии.", "Нет, в лаборато́рии.", "Нет, Ван Лэй в лаборато́рии."]
      - cue: А́нна до́ма? (конце́рт)
        accept: ["Нет, она́ на конце́рте.", "Нет, на конце́рте.", "Нет, А́нна на конце́рте."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：图书馆在系里，老师还在教研室，安娜听完课去博物馆参观，王磊上完课去听音室。
    items:
      - stem: Библиоте́ка ___.
        options: [на факульте́те, в общежи́тии, в музе́е]
        answer: на факульте́те
      - stem: О́льга Ви́кторовна ещё ___.
        options: [в аудито́рии, на ка́федре, на ле́кции]
        answer: на ка́федре
      - stem: Сего́дня А́нна ___.
        options: [на уро́ке, на ле́кции, в лаборато́рии]
        answer: на ле́кции
      - stem: Пото́м А́нна ___.
        options: [на экску́рсии в музе́е, на уро́ке, до́ма]
        answer: на экску́рсии в музе́е
      - stem: Пото́м Ван Лэй ___.
        options: [в библиоте́ке, в лаборато́рии, на конце́рте]
        answer: в лаборато́рии

  - id: e5
    type: translate
    task: 译成俄语。
    why: “在上课”“在上班”“在听音乐会”这类说法汉语里不出现处所词，俄语要用 [на]{.ru} + 第六格。
    items:
      - zh: 我们在上课。
        accept: ["Мы на уро́ке."]
        rubric: ["“在上课”用 [на уро́ке]{.ru}，不用 [в]{.ru}"]
      - zh: 爸爸在上班，妈妈在家。
        accept: ["Па́па на рабо́те, а ма́ма до́ма.", "Па́па на рабо́те, ма́ма до́ма.", "Па́па на рабо́те. Ма́ма до́ма.", "Ма́ма до́ма, а па́па на рабо́те."]
        rubric: ["[на рабо́те]{.ru}", "“在家”用 [до́ма]{.ru}", "对比时可以用 [а]{.ru}"]
      - zh: 老师还在教研室。
        accept: ["Преподава́тель ещё на ка́федре.", "О́льга Ви́кторовна ещё на ка́федре."]
        rubric: ["[на ка́федре]{.ru}", "“还”用 [ещё]{.ru}"]
      - zh: 安娜已经在教室里了。
        accept: ["А́нна уже́ в аудито́рии."]
        rubric: ["[в аудито́рии]{.ru}：[-ия]{.ru} 词第六格是 [-ии]{.ru}", "“已经”用 [уже́]{.ru}"]
      - zh: 宿舍在那儿，图书馆在这儿。
        accept: ["Общежи́тие там, а библиоте́ка здесь.", "Общежи́тие там, библиоте́ка здесь.", "Общежи́тие там. Библиоте́ка здесь.", "Там общежи́тие, а здесь библиоте́ка.", "Там общежи́тие, здесь библиоте́ка.", "Библиоте́ка здесь, а общежи́тие там."]
        rubric: ["[там]{.ru} 那里，[здесь]{.ru} 这里", 不用系动词]
