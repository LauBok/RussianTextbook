lesson: L92
grammar: "[дари́ть]{.ru} / [подари́ть кому́ что]{.ru}：送给谁用第三格，送什么用第四格；[подари́ть]{.ru} 的变位重音移动（[подарю́, пода́ришь]{.ru}）；已知信息在前、新信息在句末。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的词变成需要的形式。
    why: "送给谁用第三格：阴性 [-а → -е]{.ru}（[ма́ма → ма́ме]{.ru}），阳性加 [-у]{.ru}（[брат → бра́ту]{.ru}）；[А́нна]{.ru}、[Ми́ша]{.ru} 也按阴性名词变成 [А́нне]{.ru}、[Ми́ше]{.ru}，[Ми́ша]{.ru} 虽是男孩的名字，变格却看词尾。送什么用第四格：阴性 [-а → -у]{.ru}（[кни́га → кни́гу]{.ru}），阳性非动物名词不变（[шарф]{.ru}）。人称代词的第三格是 [ей, ему́, им]{.ru}，不要和第四格 [её, его́, их]{.ru} 混淆。"
    items:
      - stem: Ван Лэй подари́л ___ альбо́м.
        hint: А́нна
        accept: [А́нне]
      - stem: Что ты пода́ришь ___?
        hint: па́па
        accept: [па́пе]
      - stem: Ма́ма купи́ла ___ футбо́лку.
        hint: Ми́ша
        accept: [Ми́ше]
      - stem: А́нна да́рит Ван Лэ́ю ___.
        hint: кни́га
        accept: [кни́гу]
      - stem: Мари́я Никола́евна, я дарю́ ___ э́тот плато́к.
        hint: вы
        accept: [вам]
      - stem: Ба́бушка о́чень лю́бит чай. Я подарю́ ___ кита́йский чай.
        hint: она́
        accept: [ей]
      - stem: Ми́ша и А́нна лю́бят рисова́ть. Я подарю́ ___ альбо́м.
        hint: они́
        accept: [им]

  - id: e2
    type: fill
    task: 用 [дари́ть]{.ru} 或 [подари́ть]{.ru} 的正确形式填空。
    why: "两个动词的变位重音都移动：只有第一人称单数 [дарю́]{.ru}、[подарю́]{.ru} 重音在词尾，其余都在词干 [да́-]{.ru}。[дари́ть]{.ru} 的现在时表示此刻正在送；[подари́ть]{.ru} 没有现在时，它的“现在时”形式表示将来。第 5 题 [вчера́]{.ru} 说的是已经送出的结果，用完成体过去时；主语是阴性 [ма́ма]{.ru}，词尾 [-а]{.ru}。"
    items:
      - stem: — Что ты ___ А́нне за́втра? — Я подарю́ ей кни́гу.
        hint: подари́ть
        accept: [пода́ришь]
      - stem: Ма́ма и па́па сейча́с ___ тебе́ шарф.
        hint: дари́ть
        accept: [да́рят]
      - stem: Что вы ___ О́льге Ви́кторовне?
        hint: подари́ть
        accept: [пода́рите]
      - stem: Ско́ро мы ___ Ми́ше но́вый мяч.
        hint: подари́ть
        accept: [пода́рим]
      - stem: Вчера́ ма́ма ___ мне шёлковый плато́к.
        hint: подари́ть
        accept: [подари́ла]

  - id: e3
    type: rewrite
    task: 按提示回答问题，把新信息放在句末。
    placeholder: …
    example:
      cue: Что ты пода́ришь ма́ме? (плато́к)
      answer: Ма́ме я подарю́ плато́к.
    why: "问 [что]{.ru} 时，新信息是礼物，放在句末，送给谁放在句首；问 [кому́]{.ru} 时正好相反。词序换了，格不变：礼物永远是第四格，收礼人永远是第三格。"
    items:
      - cue: Что ты пода́ришь па́пе? (матрёшка)
        accept: ["Па́пе я подарю́ матрёшку.", "Я подарю́ па́пе матрёшку."]
      - cue: Кому́ ты пода́ришь шарф? (Ива́н Серге́евич)
        accept: ["Шарф я подарю́ Ива́ну Серге́евичу.", "Я подарю́ шарф Ива́ну Серге́евичу."]
      - cue: Что ты пода́ришь А́нне? (альбо́м)
        accept: ["А́нне я подарю́ альбо́м.", "Я подарю́ А́нне альбо́м."]
      - cue: Кому́ ты пода́ришь э́ту игру́? (брат)
        accept: ["Э́ту игру́ я подарю́ бра́ту.", "Я подарю́ э́ту игру́ бра́ту."]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 你送妈妈什么？
        accept: ["Что ты пода́ришь ма́ме?", "Что ты да́ришь ма́ме?"]
        rubric: ["[ма́ме]{.ru} 用第三格", "说的是将来的打算，最好用完成体 [пода́ришь]{.ru}"]
      - zh: 我送你一幅画。
        accept: ["Я дарю́ тебе́ рису́нок.", "Я подарю́ тебе́ рису́нок.", "Я тебе́ дарю́ рису́нок.", "Я тебе́ подарю́ рису́нок.", "Тебе́ я дарю́ рису́нок.", "Тебе́ я подарю́ рису́нок."]
        rubric: ["[тебе́]{.ru} 是第三格，不是 [тебя́]{.ru}", "[рису́нок]{.ru} 第四格同第一格"]
      - zh: 严寒老人送给米沙一个新游戏。
        accept: ["Дед Моро́з подари́л Ми́ше но́вую игру́.", "Дед Моро́з да́рит Ми́ше но́вую игру́.", "Ми́ше Дед Моро́з подари́л но́вую игру́.", "Ми́ше Дед Моро́з да́рит но́вую игру́.", "Дед Моро́з подари́л но́вую игру́ Ми́ше.", "Дед Моро́з да́рит но́вую игру́ Ми́ше."]
        rubric: ["[Ми́ше]{.ru} 第三格", "[но́вую игру́]{.ru} 形容词和名词都用第四格"]
      - zh: 我送安娜一本画册，送米沙一件 T 恤衫。
        accept: ["Я дарю́ А́нне альбо́м, а Ми́ше — футбо́лку.", "Я дарю́ А́нне альбо́м, а Ми́ше футбо́лку.", "Я дарю́ А́нне альбо́м и Ми́ше футбо́лку.", "Я дарю́ А́нне альбо́м, а Ми́ше я дарю́ футбо́лку.", "А́нне я дарю́ альбо́м, а Ми́ше — футбо́лку.", "А́нне я дарю́ альбо́м, а Ми́ше футбо́лку.", "А́нне я дарю́ альбо́м и Ми́ше футбо́лку.", "А́нне я дарю́ альбо́м, а Ми́ше я дарю́ футбо́лку.", "Я подарю́ А́нне альбо́м, а Ми́ше — футбо́лку.", "Я подарю́ А́нне альбо́м, а Ми́ше футбо́лку.", "Я подарю́ А́нне альбо́м и Ми́ше футбо́лку.", "Я подарю́ А́нне альбо́м, а Ми́ше я подарю́ футбо́лку.", "А́нне я подарю́ альбо́м, а Ми́ше — футбо́лку.", "А́нне я подарю́ альбо́м, а Ми́ше футбо́лку.", "А́нне я подарю́ альбо́м и Ми́ше футбо́лку.", "А́нне я подарю́ альбо́м, а Ми́ше я подарю́ футбо́лку."]
        rubric: ["收礼人第三格，礼物第四格", "第二个分句可以省去动词，用破折号代替"]

  - id: e5
    type: open
    task: 情景对话。
    items:
      - prompt: 新年快到了。你和朋友商量送家里人什么礼物：每人至少问一次“送给谁什么”，说出理由（他/她喜欢什么）。写一段 6–8 句的对话。
        length: 50–80
        model: |
          — Ско́ро Но́вый год. Что ты пода́ришь ма́ме?
          — Ма́ме я подарю́ шёлковый плато́к. Она́ лю́бит краси́вые платки́.
          — А па́пе?
          — Па́пе — кни́гу. Он о́чень лю́бит чита́ть. А ты что пода́ришь бра́ту?
          — Бра́ту я подарю́ мяч. Он игра́ет в футбо́л.
          — А ба́бушке?
          — Ещё не зна́ю. Мо́жет быть, тёплый шарф. Зимо́й у неё в до́ме хо́лодно.
          — Хоро́ший пода́рок!
        rubric: ["每个收礼人用第三格，礼物用第四格", "至少用一次 [пода́ришь]{.ru} / [подарю́]{.ru}，重音位置正确", "用 [А ...?]{.ru} 的不完全问句接话", "给出理由，用上已学的 [люби́ть]{.ru}、[игра́ть]{.ru} 等"]
        notes: 范文一问一答推进，后面几轮用 [А па́пе?]{.ru}、[А ба́бушке?]{.ru} 这样的不完全问句，省去重复的动词，回答时也可以只说 [Па́пе — кни́гу]{.ru}。每送一样礼物都补一句理由，对话才自然。
