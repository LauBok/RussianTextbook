lesson: B4-L07
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Сколько слов было в словаре Эллочки и как она их использовала? С кем и почему Эллочка начала «борьбу»? Что она сделала, чтобы не отстать от соперницы? Чем эта борьба была опасна для её мужа? Почему Эрнест Павлович решил уйти от жены?]{.ru}"
        length: 90–130
        model: "Эллочка Щукина обходилась тридцатью словами и выражениями. Одно и то же слово, например «хо-хо», могло у неё значить и радость, и удивление, и ненависть. Четыре года назад она увидела в журнале мод фотографию дочери американского миллиардера Вандербильда и решила, что должна одеваться не хуже. Она перекрасила волосы в рыжий цвет, купила собачью шкуру вместо дорогого меха, палантин из зайца, шляпу и перешила пиджак мужа в модный жакет. Муж получал всего двести рублей в месяц, и вся эта борьба разрушала их хозяйство: он брал работу на дом, отказался от прислуги и сам готовил. Когда Эллочка купила на аукционе два стула на деньги, оставленные на обед, муж понял, что так жить нельзя, и решил уйти от неё."
        rubric: ["五个问题都回答，内容与选文一致", "说出对手是谁：美国亿万富翁范德比尔特的女儿", "列举至少三项“战斗”行动", "离婚的直接原因：用伙食费买椅子"]
        notes: "回答第 3 题时可以顺便点出这些东西都是冒牌货：狗皮冒充麝鼠皮，兔皮冒充栗鼠皮。作者正是用括号里的说明戳穿这些“名贵”东西的。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[соперница]{.ru}"
        accept: ["Женщина, которая хочет быть лучше другой и борется с ней.", "Та, с кем соревнуются.", "Женщина, с которой ты борешься за первое место."]
        rubric: ["说明是竞争的对手（女性）"]
      - zh: "[обходиться (чем)]{.ru}"
        accept: ["Жить с тем, что есть, и не просить больше.", "Иметь достаточно того, что есть.", "Использовать только это и не просить больше."]
        rubric: ["说明是用很少的东西就够了、将就"]
      - zh: "[жаргон]{.ru}"
        accept: ["Особые слова, на которых говорит небольшая группа людей.", "Язык какой-то группы людей, непонятный другим.", "Грубые или модные слова, которых нет в литературном языке."]
        rubric: ["说明是某一群体的特殊用语、不规范的语言"]
      - zh: "[презрительно]{.ru}"
        accept: ["Показывая, что не уважаешь человека.", "Без уважения, как будто человек ничего не стоит.", "Так, как говорят о том, кого совсем не уважают."]
        rubric: ["说明是带着轻视、蔑视"]
      - zh: "[взятка]{.ru}"
        accept: ["Деньги, которые незаконно дают чиновнику, чтобы он что-то сделал.", "Незаконная плата чиновнику.", "Деньги или подарок за помощь, которую чиновник не должен оказывать за деньги."]
        rubric: ["说明是非法地送给官员的钱物"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题开头三个句子的数字从一万二千降到三百再降到三十，用统计的口吻做比较，是讽刺，不是真的在介绍研究成果。第 2 题 [грандиозная борьба]{.ru}、[нанесло первый меткий удар]{.ru}、[произвела мобилизацию]{.ru} 都是战争、政治的词汇，用来写买衣服，是“大词小用”的仿拟。第 3 题 [«великого, многословного и могучего русского языка»]{.ru} 仿的是屠格涅夫赞美俄语的名句，用伟大的语言反衬埃洛奇卡的贫乏。第 4 题括号里的 [(русский заяц, умерщвлённый в Тульской губернии)]{.ru} 说明“栗鼠皮”其实是兔皮，作者用一句话戳穿了假货。第 5 题丈夫说长句、埃洛奇卡只用词表里的几个词回答，而且常常答非所问，对话的喜剧效果正来自这种不对称。"
    items:
      - stem: Сравнение словаря Шекспира и словаря Эллочки — это ___.
        options: [насмешка автора над Эллочкой, научный факт, слова самой Эллочки]
        answer: насмешка автора над Эллочкой
      - stem: "Слова «борьба», «удар», «мобилизация» в рассказе о покупках взяты из языка ___."
        options: [войны, моды, торговли]
        answer: войны
      - stem: "Выражение «великого, многословного и могучего русского языка» напоминает слова ___."
        options: [Тургенева о русском языке, Шекспира об английском языке, мужа Эллочки]
        answer: Тургенева о русском языке
      - stem: "Слова «русский заяц, умерщвлённый в Тульской губернии» показывают, что ___."
        options: [палантин был не из дорогого меха, палантин привезли из-за океана, Эллочка любит охоту]
        answer: палантин был не из дорогого меха
      - stem: В разговоре с мужем Эллочка ___.
        options: [отвечает словами из своего короткого словаря, говорит длинными фразами, молчит]
        answer: отвечает словами из своего короткого словаря

  - id: e4
    type: fill
    task: 用括号里的词的适当形式填空，句子取自选文。
    why: "第 1 题 [обходиться чем]{.ru} 要求第五格，数词 [тридцать]{.ru} 第五格是 [тридцатью]{.ru}。第 2 题 [нанести удар кому]{.ru}，被打击的对象用第三格：[Вандербильдихе]{.ru}，前面的形容词 [заносчивой]{.ru} 也是阴性第三格。第 3 题 [перекрасить волосы во что]{.ru}：[в рыжий цвет]{.ru}，第四格与第一格同形。第 4 题 [взять ссуду в кассе]{.ru}，[в]{.ru} 表示地点，第六格 [кассе]{.ru}。第 5 题 [жить не по средствам]{.ru} 是固定说法，[по]{.ru} + 复数第三格 [средствам]{.ru}。"
    items:
      - stem: Эллочка Щукина легко и свободно обходилась ___.
        hint: тридцать
        accept: ["тридцатью"]
      - stem: Платье, отороченное собакой, нанесло заносчивой ___ первый меткий удар.
        hint: Вандербильдиха
        accept: ["Вандербильдихе"]
      - stem: Здесь она потеряла прекрасную чёрную косу и перекрасила волосы в рыжий ___.
        hint: цвет
        accept: ["цвет"]
      - stem: Папа-Щукин взял ссуду в ___ взаимопомощи.
        hint: касса
        accept: ["кассе"]
      - stem: "— Но ведь это возмутительно! Ты живёшь не по ___!"
        hint: средства
        accept: ["средствам"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение отрывка «Людоедка Эллочка».]{.ru}"
        length: 130–170
        model: "Словарь Шекспира составляет двенадцать тысяч слов, а Эллочка Щукина обходилась тридцатью. Этими словами, вроде «хо-хо», «мрак» и «знаменито», она выражала любые чувства. Муж Эллочки, инженер Эрнест Павлович, получал двести рублей в месяц, и этих денег ей не хватало. Уже четыре года Эллочка вела «борьбу» с дочерью американского миллиардера Вандербильда, фотографии которой видела в журнале мод. Чтобы быть не хуже соперницы, она перекрасила волосы, купила собачью шкуру, которая изображала дорогой мех, палантин из зайца, модную шляпу и перешила пиджак мужа в дамский жакет. Семья жила всё хуже: муж брал работу на дом и сам готовил. Однажды Эллочка купила на аукционе два стула на деньги, оставленные на обед. Эрнест Павлович хотел серьёзно поговорить с женой, но она отвечала только своими тридцатью словами. Тогда он решил уйти от неё, разделить мебель и переехать к знакомому."
        rubric: ["130–170 词", "写出埃洛奇卡词汇贫乏的特点", "写出与美国富家女的“竞争”及其后果", "结尾：买椅子引起的争吵和丈夫的决定", "不照抄原文的长句和词表"]
        notes: "范文约 150 词。词表不必逐条转述，举两三个词作例子即可。“战争”的比喻可以用一个带引号的词 [«борьба»]{.ru} 保留下来，引号表示这是作者的反语。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Эллочки среди нас». Встречаются ли в наше время люди, похожие на Эллочку? Как изменился язык и мода с 1920-х годов? Что, по-вашему, высмеивают Ильф и Петров?]{.ru}"
        length: 250–300
        model: "Эллочка Щукина появилась в романе почти сто лет назад, но, когда читаешь эту главу, кажется, что она живёт рядом с нами. Ильф и Петров высмеивают не одну смешную женщину, а целый тип человека. Во-первых, они смеются над тем, как беден язык. У Эллочки всего тридцать слов, и одно «хо-хо» должно выражать и радость, и ненависть. Сегодня многие люди тоже обходятся несколькими модными словами. В интернете вместо длинной мысли часто пишут только «класс» или просто ставят смешную картинку. Слова другие, но смысл тот же: человек не ищет точного слова, потому что ему нечего сказать. Во-вторых, авторы высмеивают погоню за модой. Эллочка борется с дочерью миллиардера, которую видела только в журнале. Для этого она покупает собачью шкуру вместо дорогого меха и разрушает хозяйство своей семьи. Сегодня журналов мод стало меньше, но есть интернет, где каждый день можно увидеть жизнь богатых и знаменитых. И многие, как Эллочка, тратят последние деньги, чтобы выглядеть «не хуже». Наконец, авторы показывают, что такая жизнь пуста. Самое смешное в главе — то, что Эллочка называет свою погоню «грандиозной борьбой». Ильф и Петров нарочно используют язык войны, чтобы показать, как мелка эта «борьба». А платит за неё муж, тихий инженер, который мечтает только о новой чертёжной доске. Конечно, любить красивые вещи не стыдно. Но Эллочка напоминает нам, что за модой и модными словами нужно не потерять себя. Поэтому глава о «людоедке» и сегодня читается как очень современная сатира."
        rubric: ["250–300 词", "回答作者讽刺的是什么（语言贫乏、追逐时髦、生活空虚）", "联系今天的语言和生活，有具体例子", "引用选文细节", "结构清楚：分点论述（[во-первых, во-вторых, наконец]{.ru}）"]
        notes: "范文约 280 词。用 [во-первых, во-вторых, наконец]{.ru} 分三点论述，每点都先说选文、再联系今天。今天的流行语（[класс]{.ru}）放在引号里，表示是引用别人的说法。"
