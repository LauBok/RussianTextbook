lesson: B4-L28
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Как Наталья Лебедева стала переводчиком? Что для неё самое трудное в переводе? Почему она не перевела «старый Ван» буквально? Как она относится к машинному переводу? Как она работает над книгой и что советует молодым переводчикам?]{.ru}"
        length: 120–160
        model: "Наталья Лебедева стала переводчиком случайно: в шестнадцать лет ей попалась книга китайских стихов в русском переводе, и ей захотелось узнать, как они звучат в оригинале. Самое трудное для неё — не понять текст, а написать по-русски так, чтобы русский читатель почувствовал то же, что китайский. «Старый Ван» по-китайски звучит тепло, а по-русски почти обидно, поэтому буквальный перевод был бы неточен по смыслу. Машинным переводом она пользуется каждый день для инструкций и деловых писем, но считает, что художественный текст машина перевести не может, потому что не видит связи между фразами всей книги. Сначала она читает книгу целиком, потом быстро делает черновой перевод, а потом много раз переписывает каждую фразу и читает текст вслух. Молодым переводчикам она советует больше читать по-русски и не бояться задавать вопросы авторам."
        rubric: ["五个问题都回答，内容与课文一致", "用第三人称转述，不照抄第一人称的原话", "第 3 题说明字面与意思的差别"]
        notes: "回答时要把受访者的第一人称改成第三人称：[я пользуюсь]{.ru} → [она пользуется]{.ru}。第 5 题包括三个步骤（通读、初译、反复修改并朗读）和两条建议，都要答到。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[буквальный перевод]{.ru}"
        accept: ["Перевод, в котором каждое слово переведено точно так, как в оригинале, без изменений.", "Перевод слово в слово."]
        rubric: ["说明是逐字翻译，紧跟原文的词"]
      - zh: "[черновой перевод]{.ru}"
        accept: ["Первый, ещё не готовый вариант перевода, который потом нужно исправлять.", "Первый быстрый перевод, над которым потом ещё работают."]
        rubric: ["说明是第一稿，尚未修改完成"]
      - zh: "[издательство]{.ru}"
        accept: ["Компания, которая готовит и выпускает книги.", "Организация, которая издаёт книги."]
        rubric: ["说明是出版书籍的机构"]
      - zh: "[предатель]{.ru}"
        accept: ["Человек, который изменил своим друзьям или своей стране.", "Человек, который предал тех, кто ему верил."]
        rubric: ["说明是背叛信任他的人"]
      - zh: "[диалект]{.ru}"
        accept: ["Язык, на котором говорят в определённом районе или в деревне и который отличается от литературного языка.", "Местный вариант языка."]
        rubric: ["说明是某一地区的语言变体"]
      - zh: "[цитата]{.ru}"
        accept: ["Точные слова другого человека, которые приводят в тексте.", "Слова из книги или чужой речи, которые повторяют точно."]
        rubric: ["说明是原样引用的别人的话"]

  - id: e3
    type: choice
    task: 根据课文和本课“文体与修辞”选择正确答案。
    why: "第 1 题第 2 问的回答：读懂只是开始，最难的是用俄语写出同样的感受。第 2 题第 4 问：译者在两种坏翻译之间寻找“中间点”，既不逐字照搬，也不自由发挥。第 3 题第 7 问：她每天用机器翻译，但认为文学翻译仍是人的工作，机器看不出全书各句之间的联系。第 4 题第 8 问：朗读时拗口，说明句子不好。第 5 题 [Можно пример?]{.ru} 是追问，接着上一个回答要求举例。第 6 题报道里最精彩的句子保留为直接引语（[цитата]{.ru}），其余转述。"
    items:
      - stem: По словам Лебедевой, самое трудное в переводе — ___.
        options: ["написать по-русски так, чтобы читатель почувствовал то же, что в оригинале", "понять китайский текст", "найти слова в словаре"]
        answer: "написать по-русски так, чтобы читатель почувствовал то же, что в оригинале"
      - stem: Хороший переводчик, по мнению Лебедевой, ___.
        options: ["ищет середину между буквальным и свободным переводом", "всегда переводит буквально", "пишет свою книгу вместо чужой"]
        answer: ищет середину между буквальным и свободным переводом
      - stem: Лебедева считает, что машины ___.
        options: ["пока не могут переводить художественные тексты", "уже переводят лучше людей", "совсем не нужны переводчику"]
        answer: пока не могут переводить художественные тексты
      - stem: Лебедева читает перевод вслух, чтобы ___.
        options: ["найти плохие фразы", "выучить текст наизусть", "показать его редактору"]
        answer: найти плохие фразы
      - stem: Вопрос «Можно пример?» — это ___.
        options: [вопрос к предыдущему ответу, первый вопрос интервью, вопрос, который задают все читатели]
        answer: вопрос к предыдущему ответу
      - stem: Когда интервью превращают в статью, самые яркие слова собеседника обычно ___.
        options: [оставляют в виде цитаты, убирают, переводят на другой язык]
        answer: оставляют в виде цитаты

  - id: e4
    type: rewrite
    task: 把直接引语改成间接引语。
    example:
      cue: "«Я пользуюсь машинным переводом каждый день», — сказала Лебедева."
      answer: Лебедева сказала, что пользуется машинным переводом каждый день.
    why: "俄语间接引语的规则：第一人称改为第三人称，动词时态不变。第 1 题 [я хотела]{.ru} → [она хотела]{.ru}，时态仍是过去时。第 2 题一般疑问句用 [ли]{.ru}，[ли]{.ru} 放在提问的词后面：[согласна ли она]{.ru}；[вы]{.ru} 改成 [она]{.ru}。第 3 题特殊疑问句保留疑问词 [как]{.ru}，不加 [ли]{.ru}。第 4 题祈使句改成 [чтобы]{.ru} + 过去时：[советует, чтобы они читали]{.ru}，也可以用 [советует + 不定式]{.ru}。第 5 题 [мы]{.ru} 指记者和读者，转述时说明是谁。"
    items:
      - cue: "«В школе я хотела быть врачом», — вспоминает Лебедева."
        accept: ["Лебедева вспоминает, что в школе хотела быть врачом.", "Лебедева вспоминает, что в школе она хотела быть врачом."]
      - cue: "«Вы согласны с поговоркой?» — спросил журналист."
        accept: ["Журналист спросил, согласна ли она с поговоркой.", "Журналист спросил Лебедеву, согласна ли она с поговоркой."]
      - cue: "«Как вы работаете над книгой?» — спросил журналист."
        accept: ["Журналист спросил, как она работает над книгой.", "Журналист спросил Лебедеву, как она работает над книгой."]
      - cue: "«Читайте по-русски!» — советует Лебедева молодым переводчикам."
        accept: ["Лебедева советует молодым переводчикам читать по-русски.", "Лебедева советует молодым переводчикам, чтобы они читали по-русски."]
      - cue: "«Машина не знает, что герой шутит», — подчеркнула Лебедева."
        accept: ["Лебедева подчеркнула, что машина не знает, что герой шутит."]

  - id: e5
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [пожертвовать чем]{.ru} 要求第五格，[выбирает, чем пожертвовать]{.ru} 里是不定式。第 2 题 [увлекаться]{.ru} 主语 [переводчик]{.ru} 单数：[увлекается]{.ru}。第 3 题 [сойтись]{.ru} 过去时阳性 [сошёлся]{.ru}，与 [счёт]{.ru} 一致，词干变化要记住。第 4 题 [ругать]{.ru} 第一人称 [ругаю]{.ru}。第 5 题 [подчеркнуть]{.ru} 过去时阴性 [подчеркнула]{.ru}，主语是女翻译家。第 6 题 [добавить]{.ru} 过去时阴性 [добавила]{.ru}。"
    items:
      - stem: Переводчик стихов всегда выбирает, чем ___.
        hint: пожертвовать
        accept: ["пожертвовать"]
      - stem: Плохой переводчик так ___, что пишет свою книгу вместо чужой.
        hint: увлекаться
        accept: ["увлекается"]
      - stem: Главное, чтобы в конце счёт ___.
        hint: сойтись
        accept: ["сошёлся"]
      - stem: Я себя за это не ___.
        hint: ругать
        accept: ["ругаю"]
      - stem: Лебедева ___, что большинство ошибок молодых переводчиков — в русском языке.
        hint: подчеркнуть
        accept: ["подчеркнула"]
      - stem: "«И ещё: не бойтесь спрашивать», — ___ она."
        hint: добавить
        accept: ["добавила"]

  - id: e6
    type: open
    task: 概要写作。用俄语把访谈压缩成 150 词左右的概要，用第三人称，不用直接引语。
    items:
      - prompt: "[Изложите кратко, что Наталья Лебедева рассказала о переводе.]{.ru}"
        length: 130–170
        model: "Переводчица Наталья Лебедева, которая перевела на русский язык больше тридцати книг китайских писателей, рассказала журналисту о своей работе. Китайским языком она начала заниматься случайно, после того как прочитала книгу китайских стихов в русском переводе. Самым трудным в переводе она считает не понимание текста, а умение передать по-русски интонацию, юмор и ритм оригинала. Буквальный перевод, по её словам, бывает точен по словам, но неточен по смыслу, поэтому переводчик должен искать середину между точностью и свободой. Стихи переводить ещё труднее: приходится выбирать между смыслом и краткостью. Лебедева пользуется машинным переводом, но уверена, что художественный текст машина пока перевести не может. Над книгой она работает в несколько этапов: читает её целиком, делает черновой перевод и много раз переписывает каждую фразу. Молодым переводчикам она советует больше читать по-русски и не бояться задавать вопросы авторам."
        rubric: ["开头介绍受访者", "用第三人称和转述动词（[рассказала, считает, по её словам, советует]{.ru}）", "概括翻译难点、直译问题、机器翻译、工作方法和建议", "不用直接引语", "130–170 词"]
        notes: "范文约 150 词。访谈的问答顺序在概要里可以保留，但问题本身要去掉，直接写回答的内容。转述动词要变化，不要每句都用 [сказала]{.ru}。例子（“老王”、第二十页的笑话）在概要里删去，只留下结论。"

  - id: e7
    type: open
    task: 把访谈改写为报道。写一篇 150–200 词的文章，加标题和导语；正文以转述为主，保留一两句最精彩的直接引语。
    items:
      - prompt: "[Напишите на основе интервью небольшую статью о Наталье Лебедевой для сайта издательства.]{.ru} 用上 [рассказала, подчеркнула, добавила, по её словам, считает]{.ru}。"
        length: 150–200
        model: "«Машина пока не умеет читать книги с удовольствием»\n\nВ издательстве готовится к выходу новая книга в переводе Натальи Лебедевой. Известная переводчица современной китайской прозы рассказала о том, как она работает и почему не боится нейросетей.\n\nПо словам Лебедевой, самое трудное в переводе — не понять оригинал, а написать по-русски так, чтобы читатель почувствовал то же, что китайский. Она считает, что переводчик должен всё время искать середину между буквальным и свободным переводом. «Плохой переводчик либо боится отойти от оригинала, либо пишет свою книгу вместо чужой», — подчеркнула она.\n\nЛебедева каждый день пользуется машинным переводом, но уверена, что художественный текст машине пока не по силам: машина не видит, как фразы на разных страницах книги связаны между собой.\n\nМолодым переводчикам Лебедева советует прежде всего читать по-русски. Большинство их ошибок, добавила она, связано не с иностранным, а с родным языком.\n\nСейчас переводчица работает над большим семейным романом об истории одной китайской деревни. Книга выйдет через год."
        rubric: ["有标题，标题可以用受访者的一句话", "导语说明是谁、为什么写", "以转述为主，转述动词多样", "保留一两句直接引语，并注明说话人", "人称和时态转换正确", "150–200 词"]
        notes: "范文约 180 词。标题用了访谈里最有趣的一句话，改成了自己的说法，这是报刊的常见做法。正文每段写一个话题，顺序按重要性重新安排，不必照搬访谈的提问顺序。直接引语只保留一句（[«Плохой переводчик…»]{.ru}），其余全部转述。注意 [добавила она]{.ru} 可以插在句子中间，主谓倒装。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的文章。
    items:
      - prompt: "[Заменят ли машины переводчиков?]{.ru}"
        length: 250–300
        model: "Ещё двадцать лет назад машинный перевод был поводом для шуток: машина переводила слово за словом, и получались фразы, над которыми смеялись все. Сегодня нейросети переводят почти без ошибок, и многие молодые люди спрашивают: зачем учить иностранный язык и становиться переводчиком, если машина сделает это за секунду? На мой взгляд, машины действительно заменят переводчиков, но не всех.\n\nВо-первых, там, где важна скорость, а не красота, машина уже победила. Инструкцию, деловое письмо, меню в ресторане нейросеть переводит быстрее и дешевле человека. Я сам пользуюсь машинным переводом, когда читаю новости на незнакомом языке, и меня это вполне устраивает.\n\nВо-вторых, однако, есть тексты, в которых важно не только что сказано, но и как. Это художественная литература, стихи, реклама, речи политиков. Как говорит переводчица Наталья Лебедева, машина переводит предложения, а писатель пишет книгу. Машина не чувствует юмора, не слышит интонации и не знает, что шутка на двадцатой странице связана с грустной сценой в конце романа.\n\nВ-третьих, перевод — это ответственность. Если машина ошибётся в переводе договора или медицинской инструкции, кто будет отвечать? Поэтому даже в будущем рядом с машиной, по крайней мере в важных случаях, будет сидеть человек, который проверит её работу.\n\nТаким образом, профессия переводчика не исчезнет, но изменится. Переводчик будущего будет меньше переводить сам и больше редактировать то, что сделала машина. А литературный перевод, я думаю, ещё долго останется искусством, которое требует человека."
        rubric: ["开头提出问题和有保留的论点", "三条论据，分清哪些翻译能被取代、哪些不能", "引用课文中翻译家的观点（转述）", "结论明确", "250–300 词"]
        notes: "范文约 270 词。论点不是简单的“能”或“不能”，而是“取代一部分”，因此第二段承认机器的优势，第三、四段说明人不可取代的理由。第三段转述了课文里翻译家的话（[Как говорит переводчица Наталья Лебедева, …]{.ru}），这是议论文引用权威的方法。"
