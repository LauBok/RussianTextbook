lesson: B2-L32
grammar: "[-овать]{.ru}、[-евать]{.ru} 动词：现在时 [-ова-]{.ru} 变 [-у-]{.ru}（[рису́ю, танцу́ю, сове́тую]{.ru}）；[дава́ть, встава́ть, узнава́ть]{.ru} 现在时去掉 [-ва-]{.ru}（[даю́, встаю́, узнаю́]{.ru}），命令式保留（[дава́й, встава́й]{.ru}）。"
exercises:

  - id: e1
    type: fill
    task: 用括号里动词的现在时填空。
    why: "第 1—5 题都是 [-овать]{.ru}、[-евать]{.ru} 动词，现在时把 [-ова-]{.ru}、[-ева-]{.ru} 换成 [-у-]{.ru}：[рису́ет, танцу́ют, сове́тую, фотографи́руешь, путеше́ствуем]{.ru}。不定式重音在 [-ова́-]{.ru} 上的，变位后重音落在 [-у́-]{.ru} 上（[рису́ет]{.ru}）；重音在词根上的，变位后不动（[сове́тую]{.ru}）。第 4 题最容易写成 [фотографи́роваешь]{.ru}，这是错的。第 6 题 [интересова́ться]{.ru} 也属于这一类，[-ся]{.ru} 照常加在后面。"
    items:
      - stem: Ми́ша сиди́т на ку́хне и ___.
        hint: рисова́ть
        accept: ["рису́ет"]
      - stem: Ю́ми и Ван Лэй ___ в студи́и ка́ждую суббо́ту.
        hint: танцева́ть
        accept: ["танцу́ют"]
      - stem: Я ___ тебе́ прочита́ть э́ту кни́гу.
        hint: сове́товать
        accept: ["сове́тую"]
      - stem: Почему́ ты всё вре́мя ___?
        hint: фотографи́ровать
        accept: ["фотографи́руешь"]
      - stem: Ле́том мы ча́сто ___.
        hint: путеше́ствовать
        accept: ["путеше́ствуем"]
      - stem: А́нна ___ дре́вними ико́нами.
        hint: интересова́ться
        accept: ["интересу́ется"]

  - id: e2
    type: fill
    task: 用括号里动词的正确形式填空。没有过去时间提示的句子用现在时。
    why: "[дава́ть, встава́ть, узнава́ть, устава́ть]{.ru} 现在时去掉 [-ва-]{.ru}，重音在词尾：[встаёт, даёт, узнаю́, устаю́т]{.ru}。第 3 题是命令式，命令式保留 [-ва-]{.ru}：[Встава́й]{.ru}，不能说 [встай]{.ru}。第 6 题有 [вчера́]{.ru}，用过去时，过去时也保留 [-ва-]{.ru}：[дава́л]{.ru}。"
    items:
      - stem: Обы́чно Ван Лэй ___ в семь часо́в.
        hint: встава́ть
        accept: ["встаёт"]
      - stem: Смотри́, ма́стер ___ Ми́ше кисть!
        hint: дава́ть
        accept: ["даёт"]
      - stem: ___, Ми́ша, уже́ во́семь часо́в!
        hint: встава́ть（命令式）
        accept: ["Встава́й"]
      - stem: — Ты меня́ не узнаёшь? — Коне́чно, ___!
        hint: узнава́ть
        accept: ["узнаю́"]
      - stem: Студе́нты о́чень ___ во вре́мя се́ссии.
        hint: устава́ть
        accept: ["устаю́т"]
      - stem: Вчера́ Ди́ма ___ мне свой конспе́кт.
        hint: дава́ть
        accept: ["дава́л"]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题“现在认出来了”用现在时 [узнаю́]{.ru}，重音在词尾；[узна́ю]{.ru} 是完成体 [узна́ть]{.ru} 的将来时“我会打听到”。第 2 题 [за́втра]{.ru} 说一次，用完成体将来时 [вста́ну]{.ru}；[встаю́]{.ru} 是现在时，说经常的事。第 3 题 [обы́чно]{.ru} 说经常的事，用现在时 [встаёшь]{.ru}。第 4 题 [ка́ждый день]{.ru}，经常的事，用未完成体 [даю́]{.ru}。"
    items:
      - stem: — Узнаёшь э́ту ико́ну? — Да, ___!
        options: [узнаю́, узна́ю]
        answer: узнаю́
      - stem: За́втра я ___ в шесть часо́в.
        options: [встаю́, вста́ну]
        answer: вста́ну
      - stem: Ты обы́чно ___ по́здно?
        options: [встаёшь, вста́нешь]
        answer: встаёшь
      - stem: Я ка́ждый день ___ ко́шке молоко́.
        options: [даю́, дам]
        answer: даю́

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“在画什么”用 [рису́ешь]{.ru}。第 2 题“通常几点起床”用现在时 [встаёшь]{.ru}。第 3 题“建议”用 [сове́тую]{.ru}，[сове́товать кому́]{.ru} 支配第三格。第 4 题“不许拍照”是禁止，[нельзя́]{.ru} + 未完成体（第 31 课）。"
    items:
      - zh: 你在画什么？
        accept: ["Что ты рису́ешь?", "Что вы рису́ете?"]
        rubric: ["[рисова́ть → рису́ешь]{.ru}"]
      - zh: 你通常几点起床？
        accept: ["Во ско́лько ты обы́чно встаёшь?", "Когда́ ты обы́чно встаёшь?", "Во ско́лько вы обы́чно встаёте?", "Когда́ вы обы́чно встаёте?", "Ты обы́чно во ско́лько встаёшь?", "В кото́ром часу́ ты обы́чно встаёшь?", "В кото́ром часу́ вы обы́чно встаёте?"]
        rubric: ["[встава́ть → встаёшь]{.ru}，去掉 [-ва-]{.ru}", "经常的事用未完成体"]
      - zh: 我建议你每天画画。
        accept: ["Я сове́тую тебе́ рисова́ть ка́ждый день.", "Сове́тую тебе́ рисова́ть ка́ждый день.", "Я сове́тую вам рисова́ть ка́ждый день.", "Сове́тую вам рисова́ть ка́ждый день.", "Я сове́тую тебе́ ка́ждый день рисова́ть.", "Я сове́тую вам ка́ждый день рисова́ть."]
        rubric: ["[сове́товать → сове́тую]{.ru}", "[тебе́]{.ru} 用第三格", "每天做的事用未完成体不定式"]
      - zh: 展厅里不许拍照。
        accept: ["В за́ле нельзя́ фотографи́ровать.", "Фотографи́ровать в за́ле нельзя́.", "Нельзя́ фотографи́ровать в за́ле."]
        rubric: ["禁止用 [нельзя́]{.ru} + 未完成体 [фотографи́ровать]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что де́лал Ми́ша в воскресе́нье у́тром? Куда́ пое́хали Ми́ша, А́нна и Ван Лэй и заче́м? Что они́ уви́дели в мастерско́й? Из чего́ ма́стер де́лает кра́ски? Что нарисова́л Ми́ша?]{.ru}"
        length: 50–80
        model: "В воскресе́нье у́тром Ми́ша рисова́л ико́ну: э́то бы́ло зада́ние по исто́рии. А́нне ну́жно бы́ло написа́ть докла́д, и они́ вме́сте пое́хали в музе́й Андре́я Рублёва. В музе́е нельзя́ бы́ло фотографи́ровать. В мастерско́й ма́стер пока́зывал, как пи́шут ико́ны. Кра́ски он де́лает из ка́мня и яйца́. Ми́ша нарисова́л ма́ленький золото́й круг. Ве́чером он показа́л Ван Лэ́ю свой рису́нок."
        rubric: ["回答全部五个问题", "[рисова́ть]{.ru} 类动词的形式写对", "[писа́ть ико́ны]{.ru} 用 [писа́ть]{.ru}"]
        notes: 范文约 55 词。注意 [пока́зывал]{.ru} 说的是师傅一边演示一边讲解的过程，用未完成体；[нарисова́л]{.ru} 说的是画成了，用完成体。

  - id: e6
    type: open
    task: 作文。题目：“我的星期天”。
    items:
      - prompt: 写一写你通常怎样过星期天：几点起床、做什么、喜欢什么；再写一个特别的星期天。至少用三个 [-овать]{.ru} 类动词的现在时，用上 [встава́ть]{.ru}、[дава́ть]{.ru} 或 [узнава́ть]{.ru} 的现在时。
        length: 100–150
        model: |
          В воскресе́нье я обы́чно встаю́ по́здно, в де́сять часо́в. Я не тороплю́сь: пью ко́фе и чита́ю но́вости. Пото́м я звоню́ роди́телям. Ма́ма всегда́ говори́т мне: «Не сиди́ до́ма, иди́ гуля́ть!» Днём я ча́сто гуля́ю в па́рке и фотографи́рую дере́вья и цветы́. Ве́чером я рису́ю и́ли смотрю́ фильм. Мой друг интересу́ется ста́рым кино́ и ча́сто даёт мне хоро́шие фи́льмы. Он сове́тует мне смотре́ть и чёрно-бе́лые фи́льмы.
          Но одно́ воскресе́нье я хорошо́ по́мню. Мы с дру́гом пое́хали в ста́рый монасты́рь недалеко́ от Москвы́. Там мы уви́дели дре́вние ико́ны. Я хоте́л их сфотографи́ровать, но там нельзя́ бы́ло фотографи́ровать. Тогда́ я на́чал их рисова́ть. Тепе́рь, когда́ я смотрю́ на э́тот рису́нок, я сра́зу узнаю́ тот монасты́рь.
        rubric: ["[-овать]{.ru} 动词的现在时写对（[фотографи́рую, рису́ю, интересу́ется, сове́тует]{.ru}）", "[встаю́]{.ru}、[даёт]{.ru}、[узнаю́]{.ru} 去掉 [-ва-]{.ru}", "平常的星期天用现在时，特别的那一天用过去时，体用对"]
        notes: 范文约 110 词，分两段：第一段用现在时写平常的星期天，正好用到本课的两类动词；第二段用过去时写一个特别的日子。
