lesson: B3-L54
grammar: "前置词 [по]{.ru} 的支配：[по]{.ru} + 第三格（沿着、通过、按照、每逢、部位：[по улице, по просьбе, по вечерам, по лицу]{.ru}）；[по]{.ru} + 第六格表示“……以后”（[по приезде, по окончании, по возвращении]{.ru}）；[по]{.ru} + 第四格（直到；与 [два]{.ru} 以上数词连用表示“各”）。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что Иван Васильевич хотел доказать своей историей? Почему он был так счастлив на балу? Что тронуло его, когда полковник танцевал с дочерью? Что он увидел утром на поле и за что наказывали татарина? Как эта история изменила его жизнь?]{.ru}"
        length: 80–110
        model: "Иван Васильевич хотел показать, что жизнь человека часто меняет не среда, а случай. На балу он был счастлив, потому что весь вечер танцевал с Варенькой, в которую был влюблён. Его тронуло, что полковник носил старые, немодные сапоги: он не покупал себе новых, чтобы одевать любимую дочь. Утром на поле он увидел, как солдаты бьют палками татарина, которого наказывали за побег, а полковник идёт рядом и даже ударил по лицу слабого солдата. После этого Иван Васильевич не поступил на военную службу, нигде не служил, а его любовь к Вареньке стала уходить."
        rubric: ["五个问题都回答，情节与课文一致", "用上 [по]{.ru} 的结构（[по лицу]{.ru}、[по просьбе]{.ru} 等）", "[влюблён в кого]{.ru} 支配正确"]
        notes: "第 3 题要说出旧靴子背后的原因：父亲省钱给女儿置办衣服，这正是后面强烈反差的铺垫。第 4 题注意 [ударить кого по чему]{.ru}：人用第四格，部位用 [по]{.ru} + 第三格。"

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题“每逢晚上”用 [по]{.ru} + 复数第三格 [по вечерам]{.ru}。第 2 题“到达以后”是 [по]{.ru} + 第六格 [по приезде]{.ru}，[по приезду]{.ru} 是不规范的口语形式。第 3 题“沿着城市走”是 [по]{.ru} + 第三格 [по городу]{.ru}。第 4 题 [окончание]{.ru} 的第六格 [окончании]{.ru}，[по окончании]{.ru} 表示“结束以后”；[по окончанию]{.ru} 是常见错误。第 5 题“按照请求”是 [по]{.ru} + 第三格 [по просьбе]{.ru}；[просьба]{.ru} 第三格和第六格同形，但这里的意义是“按照”，属于第三格。第 6 题打的部位用 [по]{.ru} + 第三格 [по спине]{.ru}。"
    items:
      - stem: Иван Васильевич ___ ездил на балы.
        options: [по вечерам, по вечерах, по вечера]
        answer: по вечерам
      - stem: ___ на бал он сразу увидел Вареньку.
        options: [По приезду, По приезде, По приезда]
        answer: По приезде
      - stem: Утром он пошёл ___ к дому Вареньки.
        options: [по городе, по городу, по город]
        answer: по городу
      - stem: ___ танца гости долго аплодировали.
        options: [По окончанию, По окончании, По окончания]
        answer: По окончании
      - stem: Полковник танцевал с дочерью по ___ хозяйки.
        options: [просьбе, просьбу, просьбы]
        answer: просьбе
      - stem: Каждый солдат бил татарина палкой по ___.
        options: [спину, спине, спины]
        answer: спине

  - id: e3
    type: rewrite
    task: 用 [по]{.ru} + 第六格的书面说法改写句子开头的 [после]{.ru} + 第二格或 [когда]{.ru} 从句。
    example:
      cue: Когда он вернулся домой, он не мог уснуть.
      answer: По возвращении домой он не мог уснуть.
    why: "[после приезда → по приезде]{.ru}，[после окончания → по окончании]{.ru}，[когда вернулся → по возвращении]{.ru}。[по]{.ru} 后面的名词用第六格，词尾 [-е]{.ru} 或 [-и]{.ru}；后面如果还有名词，用第二格（第 2 题 [бала]{.ru}）。从句改成前置词短语时，主语就不再出现了，所以只有从句和主句主语相同时才能这样改。第 3、4 题从句和主句的主语相同（上校、士兵），可以改；动词 [прибыть]{.ru} 对应的名词是 [прибытие]{.ru}，第六格 [прибытии]{.ru}。"
    items:
      - cue: После приезда в город он поступил в университет.
        accept: ["По приезде в город он поступил в университет."]
      - cue: После окончания бала Варенька уехала домой.
        accept: ["По окончании бала Варенька уехала домой."]
      - cue: Когда полковник вернулся домой, он снова стал нежным отцом.
        accept: ["По возвращении домой полковник снова стал нежным отцом."]
      - cue: Когда солдат прибыл на место, он увидел полковника.
        accept: ["По прибытии на место солдат увидел полковника."]

  - id: e4
    type: fill
    task: 用括号里的词填空，[по]{.ru} 后面用正确的格。
    why: "第 1 题“通过电话”用第三格 [телефону]{.ru}。第 2 题“想念女儿”，[скучать по]{.ru} + 第三格 [дочери]{.ru}。第 3 题“每逢星期六”用复数第三格 [субботам]{.ru}。第 4 题学科用第三格：[истории]{.ru}。第 5 题“每人两卢布”，[по]{.ru} 与 [два]{.ru} 连用时数词用第四格 [два]{.ru}，名词照常 [рубля]{.ru}。第 6 题“由于差错”用第三格 [ошибке]{.ru}。"
    items:
      - stem: Он узнал об этом по ___.
        hint: телефон
        accept: ["телефону"]
      - stem: Полковник часто скучал по ___.
        hint: дочь
        accept: ["дочери"]
      - stem: По ___ они ездили за город.
        hint: субботы
        accept: ["субботам"]
      - stem: У него завтра экзамен по ___.
        hint: история
        accept: ["истории"]
      - stem: Хозяйка дала детям по ___ рубля.
        hint: два
        accept: ["два"]
      - stem: Он сел в чужую карету по ___.
        hint: ошибка
        accept: ["ошибке"]

  - id: e5
    type: translate
    task: 翻译下列句子，注意 [по]{.ru} 的用法。
    items:
      - zh: 舞会结束以后，他步行穿过城市回家。
        accept: ["По окончании бала он пошёл домой пешком по городу.", "По окончании бала он пешком пошёл по городу домой.", "После окончания бала он пошёл домой пешком по городу.", "По окончании бала он шёл домой пешком по городу.", "По окончании бала он пошёл пешком по городу домой.", "После окончания бала он пешком пошёл по городу домой."]
        rubric: ["[по окончании бала]{.ru}：[по]{.ru} + 第六格，[бала]{.ru} 第二格", "[по городу]{.ru}：[по]{.ru} + 第三格"]
      - zh: 应女主人的请求，上校和女儿跳了一圈玛祖卡。
        accept: ["По просьбе хозяйки полковник прошёл с дочерью один круг мазурки.", "По просьбе хозяйки полковник станцевал с дочерью мазурку.", "По просьбе хозяйки полковник танцевал с дочерью мазурку.", "По просьбе хозяйки полковник прошёл с дочерью круг мазурки."]
        rubric: ["[по просьбе хозяйки]{.ru}：[по]{.ru} + 第三格", "[с дочерью]{.ru} 第五格"]
      - zh: 上校打了士兵一个耳光。
        accept: ["Полковник ударил солдата по лицу."]
        rubric: ["[ударить кого по чему]{.ru}：人用第四格，部位用 [по]{.ru} + 第三格"]

  - id: e7
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [девушку]{.ru} 是阴性第四格，形容词同格：[грациозную]{.ru}。第 2 题 [с]{.ru} + 第五格 [румяным лицом]{.ru}。第 3 题 [бакенбарды]{.ru} 一般用复数，[с]{.ru} + 复数第五格 [бакенбардами]{.ru}。第 4 题 [в]{.ru} + 第六格表示穿着：[в чёрных мундирах]{.ru}。第 5 题 [до]{.ru} + 第二格：[до тошноты]{.ru}。"
    items:
      - stem: Он был влюблён в высокую ___ девушку.
        hint: грациозный
        accept: ["грациозную"]
      - stem: Полковник был стариком с ___ лицом.
        hint: румяный
        accept: ["румяным"]
      - stem: У него были белые усы с ___.
        hint: бакенбарды
        accept: ["бакенбардами"]
      - stem: На поле стояли солдаты в чёрных ___.
        hint: мундир
        accept: ["мундирах"]
      - stem: Его мучила тоска, доходившая почти до ___.
        hint: тошнота
        accept: ["тошноты"]

  - id: e6
    type: open
    task: 议论段落。就下面的问题写一段话，表明看法，用课文细节说明理由，最后得出结论。
    items:
      - prompt: "[Прав ли Иван Васильевич, что жизнь человека меняет не среда, а случай?]{.ru} 至少用两处 [по]{.ru} 的结构，其中一处是 [по]{.ru} + 第六格。"
        length: 180–220
        model: "Иван Васильевич считает, что жизнь человека меняет не среда, а случай. По-моему, он прав только отчасти. Конечно, если бы он не пошёл утром по городу к дому Вареньки, он бы ничего не увидел. Он, может быть, женился бы на ней и поступил бы на военную службу. В этом смысле случай действительно изменил его жизнь. Однако случай только открыл ему правду, которую он раньше не видел. Наказание солдат было не случайным событием, а обычным делом: все считали, что так нужно. Полковник, который так нежно танцевал с дочерью, по утрам спокойно смотрел, как бьют человека. Мне кажется, главное в рассказе — не случай, а выбор героя. Многие молодые люди на его месте сделали бы вид, что ничего не случилось. Иван Васильевич не смог этого сделать. Ему было стыдно, и по возвращении домой он решил, что никогда не будет служить. Значит, его жизнь изменила не только встреча на поле, но и его собственная совесть. Толстой показывает, что за красивой жизнью на балу может стоять жестокость, и каждый человек должен сам решить, принимать её или нет. Поэтому я думаю, что этот рассказ не о случае, а об ответственности человека за свои поступки."
        rubric: ["开头明确回答“对”“不对”或“部分对”", "先承认对方观点的合理之处，再提出不同看法", "理由用课文细节支撑（清晨的偶遇、上校的两面、主人公的选择）", "至少两处 [по]{.ru} 结构，一处为 [по]{.ru} + 第六格", "180–220 词"]
        notes: "范文约 190 词，采用“部分同意”的写法：[По-моему, он прав только отчасти]{.ru}。先用 [Конечно]{.ru} 承认偶然的作用（用假定式 [если бы… бы…]{.ru} 设想另一种结果），再用 [Однако]{.ru} 转到自己的观点：偶然只是揭示了真相，决定命运的是主人公自己的良心和选择。结论把话题提升到人对自己行为的责任。[по]{.ru} 的用法：[по городу]{.ru}、[по утрам]{.ru}（第三格）、[по возвращении домой]{.ru}（第六格）。"
