lesson: B3-L26
grammar: "复合词：词根 + 连接元音 [-о- / -е-]{.ru} + 词根（[пароход, пылесос]{.ru}）；缩略词四类：按字母读（[МГУ]{.ru}）、按单词读（[вуз]{.ru}）、开头部分组合（[универмаг]{.ru}）、开头 + 整词（[зарплата]{.ru}）；性由全称主要词决定，按单词读、辅音结尾的变格。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Какие бывают сокращения? Приведите по одному примеру каждого типа. Что такое загс, ЕГЭ и ВДНХ? Почему в 1920-е годы появилось так много сокращений? Как образованы слова «самолёт» и «пылесос»? Почему говорят «МГУ основан», а не «основана»?]{.ru}"
        length: 80–110
        model: "Одни сокращения читаются по названиям букв, например МГУ. Другие произносятся как обычное слово, например вуз. Есть сокращения из начальных частей слов, например универмаг, и сокращения, в которых сокращается только первое слово, например зарплата. Загс — это отдел записи актов гражданского состояния, ЕГЭ — единый государственный экзамен, а ВДНХ — Выставка достижений народного хозяйства, большой парк в Москве. В 1920-е годы новое государство создавало новые учреждения, и для каждого нужно было короткое название. Слово «самолёт» образовано из корней «сам» и «лет», а «пылесос» — из «пыль» и «сосать» с помощью соединительных гласных. Говорят «МГУ основан», потому что главное слово — «университет», а оно мужского рода."
        rubric: ["四类缩略词各举一例", "[загс]{.ru}、[ЕГЭ]{.ru}、[ВДНХ]{.ru} 的全称正确", "说明 [МГУ]{.ru} 的性由 [университет]{.ru} 决定"]
        notes: 第 1 题四类可以按课文顺序回答。第 5 题的关键词是“主要词”[главное слово]{.ru}。

  - id: e2
    type: rewrite
    task: 把全称改成通用的缩略词或复合词。
    example:
      cue: Высшее учебное заведение
      answer: Вуз
    why: "第 1 题由两个词的开头部分组成：[универ(сальный) маг(азин)]{.ru}。第 2—4 题只缩略第一个词，第二个词保持完整：[физ(ическая) культура]{.ru}，[мед(ицинская) сестра]{.ru}，[зар(аботная) плата]{.ru}。第 5、6 题按首字母组成：[М(осковский) Г(осударственный) У(ниверситет)]{.ru}，[М(еждународная) К(осмическая) С(танция)]{.ru}。"
    items:
      - cue: Универсальный магазин
        accept: ["Универмаг"]
      - cue: Физическая культура
        accept: ["Физкультура"]
      - cue: Медицинская сестра
        accept: ["Медсестра"]
      - cue: Заработная плата
        accept: ["Зарплата"]
      - cue: Московский государственный университет
        accept: ["МГУ"]
      - cue: Международная космическая станция
        accept: ["МКС"]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "缩略词的性看全称的主要词。第 1 题 [МГУ]{.ru} = [университет]{.ru}，阳性：[основан]{.ru}。第 2 题 [РФ]{.ru} = [федерация]{.ru}，阴性：[большая]{.ru}。第 3 题 [ЕГЭ]{.ru} = [экзамен]{.ru}，阳性：[был]{.ru}。第 4 题 [вуз]{.ru} 按单词读、以辅音结尾，像阳性名词一样变格：[в другом вузе]{.ru}。第 5 题 [МГУ]{.ru} 按字母读，不变格，[в МГУ]{.ru} 就是第六格；[вуз]{.ru} 是变格的，这里应为 [вузе]{.ru}，所以 [вуз]{.ru}、[вузу]{.ru} 都不对。第 6 题 [МИД]{.ru} 变格，“在哪里”用第六格，格词尾小写直接接在后面：[в МИДе]{.ru}；[в МИД]{.ru} 是第四格，表示“去哪里”。"
    items:
      - stem: МГУ ___ в 1755 году.
        options: [основан, основана, основано]
        answer: основан
      - stem: РФ — очень ___ страна.
        options: [большой, большая, большое]
        answer: большая
      - stem: ЕГЭ в этом году ___ трудным.
        options: [был, была, было]
        answer: был
      - stem: Его сестра учится в другом ___.
        options: [вуз, вузе, вузу]
        answer: вузе
      - stem: Лена учится в ___ на третьем курсе.
        options: [МГУ, вуз, вузу]
        answer: МГУ
      - stem: Отец работает в ___.
        options: [МИД, МИДе, МИДа]
        answer: МИДе

  - id: e4
    type: fill
    task: 写出复合词。根据括号里的提示，用连接元音 [-о-]{.ru} 或 [-е-]{.ru} 把两个词根连起来。
    why: "硬辅音后用 [-о-]{.ru}，软辅音后用 [-е-]{.ru}。第 1 题 [пар + о + ход]{.ru}：[пароход]{.ru}。第 2 题 [вод(а) + о + пад]{.ru}：[водопад]{.ru}。第 3 题 [пыль]{.ru} 的 [л]{.ru} 是软辅音，用 [-е-]{.ru}：[пылесос]{.ru}。第 4 题 [сам + о + лёт]{.ru}：[самолёт]{.ru}，[лёт]{.ru} 里的 [ё]{.ru} 不能丢。第 5 题 [тепл(о) + о + ход]{.ru}：[теплоход]{.ru}。第 6 题 [лёд + о + кол]{.ru}：[ледокол]{.ru}，重音不在第一部分，[ё]{.ru} 变成 [е]{.ru}。"
    items:
      - stem: Раньше по Волге ходили большие ___.
        hint: "пар + ходить"
        accept: ["пароходы"]
      - stem: На Камчатке мы видели высокий ___.
        hint: "вода + падать"
        accept: ["водопад"]
      - stem: Мама купила новый ___.
        hint: "пыль + сосать"
        accept: ["пылесос"]
      - stem: ___ прилетел в Москву точно по расписанию.
        hint: "сам + летать"
        accept: ["Самолёт"]
      - stem: Туристы плыли по реке на большом ___.
        hint: "тепло + ходить"
        accept: ["теплоходе"]
      - stem: Первый в мире атомный ___ «Ленин» был спущен на воду в 1957 году.
        hint: "лёд + колоть"
        accept: ["ледокол"]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 要知道缩略词的性，就要想起全称里的主要词。
        accept: ["Чтобы узнать род сокращения, нужно вспомнить главное слово полного названия.", "Чтобы узнать род сокращения, надо вспомнить главное слово полного названия.", "Чтобы узнать род сокращения, нужно вспомнить главное слово в полном названии.", "Чтобы узнать род аббревиатуры, нужно вспомнить главное слово полного названия."]
        rubric: ["[чтобы]{.ru} + 不定式表示目的", "[род сокращения]{.ru}：第二格", "[нужно]{.ru} + 不定式"]
      - zh: 我姐姐在外交部工作。
        accept: ["Моя сестра работает в МИДе.", "Моя старшая сестра работает в МИДе.", "Моя сестра работает в Министерстве иностранных дел.", "Моя старшая сестра работает в Министерстве иностранных дел."]
        rubric: ["[в МИДе]{.ru}：按单词读的缩略词变格，词尾小写"]
      - zh: 莫斯科大学创建于 1755 年。
        accept: ["МГУ основан в 1755 году.", "МГУ был основан в 1755 году.", "Московский университет основан в 1755 году.", "Московский университет был основан в 1755 году."]
        rubric: ["[основан]{.ru}：短尾阳性，与 [МГУ]{.ru}（[университет]{.ru}）一致", "[в 1755 году]{.ru}：[в]{.ru} + 第六格"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[Без сокращений трудно представить современную жизнь.]{.ru} 用一天的生活（学习、购物、出行、办事）举例，至少用五个缩略词或复合词，其中至少两个要变格。"
        length: 140–160
        model: "Без сокращений трудно представить современную жизнь. Посмотрим на обычный день студента. Утром он едет в вуз на метро, а не в «высшее учебное заведение». В вузе у него много друзей, и все говорят именно так. На занятии преподаватель рассказывает, как сдавать ЕГЭ, потому что многие студенты потом будут работать в школе. После обеда студент идёт на физкультуру. Вечером он заходит в ГУМ, чтобы купить подарок сестре, а в магазине думает о том, что зарплата у его родителей небольшая. Его друг, который учится в МГУ, мечтает работать в МИДе, а сестра работает медсестрой в больнице. Если бы все эти слова пришлось каждый раз говорить без сокращений, разговор стал бы в два раза длиннее. Конечно, иностранцу сокращения сначала кажутся непонятными, ведь в обычном словаре их не всегда найдёшь. Но стоит узнать полное название, и всё становится ясно. Поэтому сокращения не портят язык: это удобный способ говорить быстро и коротко."
        rubric: ["第一句是给定的主题句", "至少五个缩略词或复合词，用法正确", "至少两个变格（[в вузе, в МИДе, в ГУМе]{.ru} 等），按字母读的不变格", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 按时间顺序（早上、上课、午后、晚上）列举 → 假设（[Если бы…, …бы]{.ru}，用上第 19 课的假定式）→ 让步（[Конечно…]{.ru}）→ 收束句。注意 [в вуз]{.ru}（去哪里，第四格）和 [в вузе]{.ru}（在哪里，第六格）。
