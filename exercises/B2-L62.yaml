lesson: B2-L62
grammar: "被动结构初识：未完成体 + [-ся]{.ru}（[стро́ится]{.ru}，正在进行）；完成体短尾被动形动词（[постро́ен, напи́сан, сде́лан, откры́т]{.ru}，已经完成），短尾与主语的性、数一致，时间由 [быть]{.ru} 表示。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里动词的短尾被动形动词，注意性、数一致。
    why: "短尾跟主语的性、数一致：第 1 题 [зда́ние]{.ru} 是中性，用 [постро́ено]{.ru}；第 2 题 [расска́з]{.ru} 阳性，[напи́сан]{.ru}（注意重音移到 [-пи́-]{.ru} 上）；第 3 题 [два этажа́]{.ru} 作主语，用复数 [постро́ены]{.ru}；第 4 题 [магази́н]{.ru} 阳性，[откры́т]{.ru}；第 5 题 [рабо́та]{.ru} 阴性，[сде́лана]{.ru}；第 6 题 [библиоте́ка]{.ru} 阴性，[откры́та]{.ru}。"
    items:
      - stem: Гла́вное зда́ние университе́та бы́ло ___ в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́.
        hint: постро́ить
        accept: ["постро́ено"]
      - stem: Э́тот расска́з ___ Че́ховым.
        hint: написа́ть
        accept: ["напи́сан"]
      - stem: Два этажа́ спорти́вного це́нтра уже́ ___.
        hint: постро́ить
        accept: ["постро́ены"]
      - stem: Магази́н ___ до девяти́ часо́в ве́чера.
        hint: откры́ть
        accept: ["откры́т"]
      - stem: Вся рабо́та уже́ ___.
        hint: сде́лать
        accept: ["сде́лана"]
      - stem: Но́вая библиоте́ка бу́дет ___ в сентябре́.
        hint: откры́ть
        accept: ["откры́та"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "正在进行、还没完成的事用未完成体 + [-ся]{.ru}（第 1、3 题：[сейча́с]{.ru}、[ещё не гото́ва]{.ru}）；已经完成、结果存在的事用完成体短尾（第 2、5 题）。第 4 题说将来某时以前完成，用 [бу́дет постро́ен]{.ru}；[бу́дет стро́иться]{.ru} 不能和 [к Но́вому го́ду]{.ru}（到新年以前）连用。"
    items:
      - stem: Сейча́с ря́дом с па́рком ___ спорти́вный центр.
        options: [стро́ится, постро́ен]
        answer: стро́ится
      - stem: Гла́вное зда́ние университе́та давно́ ___.
        options: [стро́ится, постро́ено]
        answer: постро́ено
      - stem: Э́та шко́ла ___ уже́ два го́да, но она́ ещё не гото́ва.
        options: [стро́ится, постро́ена]
        answer: стро́ится
      - stem: Па́па ду́мает, что центр бу́дет ___ то́лько к Но́вому го́ду.
        options: [стро́иться, постро́ен]
        answer: постро́ен
      - stem: Письмо́ уже́ ___, его́ мо́жно отпра́вить.
        options: [пи́шется, напи́сано]
        answer: напи́сано

  - id: e3
    type: rewrite
    task: 按例句把主动句改成被动句。
    example:
      cue: Архите́кторы постро́или э́тот дом в ты́сяча девятьсо́т пятидеся́том году́.
      answer: Э́тот дом был постро́ен в ты́сяча девятьсо́т пятидеся́том году́.
    why: "主动句的直接补语（第四格）变成被动句的主语（第一格）；动词变成短尾，和新主语的性、数一致，时间用 [быть]{.ru} 表示：过去 [был / была́ / бы́ло / бы́ли]{.ru}，将来 [бу́дет / бу́дут]{.ru}。做事的人一般省去，如果要说出来，用第五格（第 2 题 [Че́ховым]{.ru}）。"
    items:
      - cue: Студе́нты сде́лали все упражне́ния.
        accept: ["Все упражне́ния бы́ли сде́ланы.", "Все упражне́ния сде́ланы.", "Все упражне́ния бы́ли сде́ланы студе́нтами.", "Все упражне́ния сде́ланы студе́нтами."]
      - cue: Че́хов написа́л э́тот расска́з.
        accept: ["Э́тот расска́з напи́сан Че́ховым.", "Э́тот расска́з был напи́сан Че́ховым."]
      - cue: Ма́ма откры́ла окно́.
        accept: ["Окно́ бы́ло откры́то.", "Окно́ откры́то."]
      - cue: Рабо́чие постро́ят шко́лу к сентябрю́.
        accept: ["Шко́ла бу́дет постро́ена к сентябрю́."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“建于”可以用被动句 [бы́ло постро́ено]{.ru}，也可以用不定人称句 [постро́или]{.ru}。第 2 题“正在建”用 [стро́ится]{.ru} 或不定人称句 [стро́ят]{.ru}。第 3 题“是契诃夫写的”用 [напи́сан Че́ховым]{.ru}，也可以用主动句。第 4 题 [откры́т]{.ru} 是短尾，和 [магази́н]{.ru} 一致。"
    items:
      - zh: 这座楼建于 1953 年。
        accept: ["Э́то зда́ние бы́ло постро́ено в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́.", "Э́то зда́ние постро́ено в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́.", "Э́то зда́ние постро́или в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́."]
        rubric: ["[бы́ло постро́ено]{.ru}：中性，和 [зда́ние]{.ru} 一致；或不定人称句 [постро́или]{.ru}", "年份 [в… тре́тьем году́]{.ru}"]
      - zh: 我们家旁边正在建一所新学校。
        accept: ["Ря́дом с на́шим до́мом стро́ится но́вая шко́ла.", "Ря́дом с на́шим до́мом стро́ят но́вую шко́лу.", "О́коло на́шего до́ма стро́ится но́вая шко́ла.", "О́коло на́шего до́ма стро́ят но́вую шко́лу."]
        rubric: ["[стро́ится]{.ru}（或 [стро́ят]{.ru}）：正在进行", "[ря́дом с]{.ru} + 第五格 或 [о́коло]{.ru} + 第二格"]
      - zh: 这篇小说是契诃夫写的。
        accept: ["Э́тот расска́з напи́сан Че́ховым.", "Э́тот расска́з был напи́сан Че́ховым.", "Э́тот расска́з написа́л Че́хов."]
        rubric: ["[напи́сан Че́ховым]{.ru}：做事的人用第五格"]
      - zh: 商店开着吗？
        accept: ["Магази́н откры́т?"]
        rubric: ["短尾 [откры́т]{.ru}，阳性"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пошли́ Ван Лэй и А́нна по́сле консульта́ции? Что А́нна рассказа́ла о Гла́вном зда́нии и о высо́тках? Что Ван Лэй рассказа́л о Пеки́не? Что стро́ится ря́дом с па́рком? Почему́ Ван Лэ́ю ста́ло гру́стно и что сказа́л Ми́ша?]{.ru}"
        length: 60–100
        model: "По́сле консульта́ции Ван Лэй и А́нна пошли́ к Гла́вному зда́нию университе́та. А́нна рассказа́ла, что оно́ бы́ло постро́ено в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́ и что в Москве́ семь таки́х высо́ток. Звезда́ на шпи́ле ве́сит двена́дцать тонн. В Пеки́не то́же есть похо́жее зда́ние, оно́ бы́ло постро́ено по прое́кту сове́тских архите́кторов. Ве́чером Ива́н Серге́евич рассказа́л, что ря́дом с па́рком стро́ится спорти́вный центр. Он до́лжен быть постро́ен к пе́рвому сентября́. Ван Лэ́ю ста́ло гру́стно, потому́ что в сентябре́ его́ уже́ не бу́дет в Москве́. Но Ми́ша сказа́л, что когда́-нибудь они́ бу́дут пла́вать там вме́сте."
        rubric: ["回答全部五个问题", "至少三处被动结构：[бы́ло постро́ено]{.ru}、[стро́ится]{.ru}、[до́лжен быть постро́ен]{.ru}", "短尾和主语一致"]
        notes: 范文约 90 词。被动结构用了四处，[стро́ится]{.ru} 和 [бы́ло постро́ено]{.ru} 正好形成对比：一个正在建，一个早已建成。

  - id: e6
    type: open
    task: 作文。题目：[Зда́ние, кото́рое мне нра́вится]{.ru}（我喜欢的一座建筑）。
    items:
      - prompt: 介绍一座你喜欢的建筑（在你的城市或你去过的地方）：它在哪里、什么时候建成的、样子如何、里面有什么、你为什么喜欢它。至少用三个被动结构。
        length: 100–150
        model: "Моё люби́мое зда́ние в Москве́ — Большо́й теа́тр. Он нахо́дится в це́нтре го́рода, недалеко́ от Кра́сной пло́щади.\n\nТеа́тр был откры́т в ты́сяча восемьсо́т два́дцать пя́том году́, а зда́ние, кото́рое мы ви́дим сего́дня, бы́ло постро́ено в ты́сяча восемьсо́т пятьдеся́т шесто́м году́. Пе́ред теа́тром есть краси́вый фонта́н.\n\nВнутри́ теа́тр о́чень краси́вый: большо́й кра́сный зал и мно́го све́та. Ка́ждый ве́чер здесь идёт бале́т и́ли о́пера.\n\nЯ был в Большо́м теа́тре на «Лебеди́ном о́зере». Мне каза́лось, что я попа́л в ска́зку. Ря́дом нахо́дится ещё одно́ зда́ние теа́тра, оно́ бы́ло откры́то в две ты́сячи второ́м году́. Но для меня́ ста́рое зда́ние всегда́ бу́дет лу́чшим."
        rubric: ["讲清位置、年代、样子、内部、喜欢的原因", "至少三个被动结构，短尾与主语一致", "年份用 [в… году́]{.ru}"]
        notes: 范文用了三个被动结构：[был откры́т]{.ru}、[бы́ло постро́ено]{.ru}、[бы́ло откры́то]{.ru}。注意 [зда́ние, кото́рое мы ви́дим сего́дня, бы́ло постро́ено]{.ru}：插入了定语从句，短尾仍和主语 [зда́ние]{.ru} 一致。最后一句 [бу́дет лу́чшим]{.ru} 中的表语用第五格。
  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 假设你是王磊。6 月 24 日给当工程师的妈妈写信：讲讲莫斯科大学主楼和斯大林式高楼，提到北京的那座相似的楼，再说说家旁边正在建的体育中心。
        length: 80–120
        model: "Москва́, 24 ию́ня\n\nДорога́я ма́ма!\n\nЗа́втра у меня́ после́дний экза́мен, по литерату́ре. Я мно́го занима́юсь, но вчера́ мы с А́нной немно́го гуля́ли о́коло Гла́вного зда́ния университе́та.\n\nТы, наве́рное, зна́ешь, что оно́ бы́ло постро́ено в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́. Таки́х зда́ний в Москве́ семь, их называ́ют ста́линскими высо́тками. Я сказа́л А́нне, что в Пеки́не то́же есть похо́жее зда́ние. По́мнишь, мы ходи́ли туда́ на вы́ставку?\n\nА ря́дом с на́шим па́рком сейча́с стро́ится спорти́вный центр. Ива́н Серге́евич говори́т, что он до́лжен быть постро́ен к сентябрю́. Тебе́ как инжене́ру бы́ло бы интере́сно посмотре́ть!\n\nЦелу́ю тебя́ и па́пу.\n\nТвой сын Ван Лэй"
        rubric: ["书信格式；给妈妈用 [ты]{.ru}", "介绍主楼和高楼，提到北京的楼", "说到体育中心", "至少三个被动结构"]
        notes: 给妈妈写信可以用 [Дорога́я ма́ма!]{.ru} 开头，结尾 [Целу́ю тебя́ и па́пу]{.ru}（吻你和爸爸）是俄罗斯家信常用的亲切说法。[Тебе́ как инжене́ру]{.ru}：[как]{.ru} 表示身份“作为”，和 [тебе́]{.ru} 同格；[бы́ло бы интере́сно]{.ru} 是假定式。
