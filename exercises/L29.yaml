lesson: L29
grammar: "星期名称；“在星期几”用 [в]{.ru} + 第四格（[в понеде́льник, во вто́рник, в сре́ду]{.ru}）；时段副词 [у́тром, днём, ве́чером, но́чью]{.ru}；用现在时表示已定的计划。"
exercises:

  - id: e1
    type: fill
    task: 用 [в / во]{.ru} + 第四格填空。
    why: 星期几前用 [в]{.ru} + 第四格。阴性的 [среда́, пя́тница, суббо́та]{.ru} 变 [-у]{.ru}，[среда́]{.ru} 的重音前移成 [сре́ду]{.ru}；阳性、中性的不变。[вто́рник]{.ru} 前要写 [во]{.ru}。最常见的错误是按第六格写成 *[в сре́де]{.ru}*、*[в пя́тнице]{.ru}*。
    items:
      - stem: ___ я иду́ на уро́к.
        hint: понеде́льник
        accept: [В понеде́льник]
      - stem: ___ Ван Лэй хо́дит в бассе́йн.
        hint: вто́рник
        accept: [Во вто́рник]
      - stem: ___ мы идём в консервато́рию.
        hint: среда́
        accept: [В сре́ду]
      - stem: ___ А́нна и Ван Лэй иду́т в кино́.
        hint: пя́тница
        accept: [В пя́тницу]
      - stem: ___ мы е́дем на да́чу.
        hint: суббо́та
        accept: [В суббо́ту]
      - stem: ___ ве́чером мы е́дем домо́й.
        hint: воскресе́нье
        accept: [В воскресе́нье]
      - stem: ___ я то́же хожу́ в бассе́йн.
        hint: четве́рг
        accept: [В четве́рг]

  - id: e2
    type: choice
    task: 选择合适的时段副词或星期的形式。
    why: 按句子内容判断时段：去上课、喝早茶是 [у́тром]{.ru}；午后学习、干活是 [днём]{.ru}；音乐会、看电视是 [ве́чером]{.ru}；大家睡觉是 [но́чью]{.ru}。这些副词前面不加前置词，不说 *[в у́тро]{.ru}。第 5、6 题区分两种用法：回答“今天星期几”用第一格 [среда́]{.ru}；说“在星期三做什么”用 [в сре́ду]{.ru}。
    items:
      - stem: ___ я пью ко́фе и иду́ на уро́к.
        options: [У́тром, Но́чью]
        answer: У́тром
      - stem: ___ все спят.
        options: [Днём, Но́чью]
        answer: Но́чью
      - stem: Сего́дня ___ мы идём на конце́рт.
        options: [у́тром, ве́чером]
        answer: ве́чером
      - stem: На да́че мы ___ собира́ем я́блоки, а ве́чером пьём чай.
        options: [днём, но́чью]
        answer: днём
      - stem: — Како́й сего́дня день? — Сего́дня ___.
        options: [среда́, в сре́ду]
        answer: среда́
      - stem: ___ я до́ма.
        options: [Среда́, В сре́ду]
        answer: В сре́ду

  - id: e3
    type: rewrite
    task: 根据课文回答问题。
    example:
      cue: "Что де́лает Ван Лэй в понеде́льник у́тром?"
      answer: В понеде́льник у́тром он идёт на уро́к.
    why: 回答时保留问句里的时间状语（星期用 [в]{.ru} + 第四格），把 [Ван Лэй]{.ru} 换成 [он]{.ru}，动词换成第三人称。第 2 题是每周的习惯，用 [хо́дит]{.ru}；第 4 题是这一次的安排，用 [е́дут]{.ru}。
    items:
      - cue: "Что де́лает Ван Лэй в понеде́льник днём?"
        accept: [В понеде́льник днём он рабо́тает в библиоте́ке., Он рабо́тает в библиоте́ке.]
      - cue: "Куда́ хо́дит Ван Лэй во вто́рник и в четве́рг?"
        accept: [Во вто́рник и в четве́рг он хо́дит в бассе́йн., Он хо́дит в бассе́йн.]
      - cue: "Куда́ они́ иду́т в сре́ду?"
        accept: [В сре́ду они́ иду́т в консервато́рию., Они́ иду́т в консервато́рию.]
      - cue: "Куда́ они́ е́дут в суббо́ту?"
        accept: [В суббо́ту они́ е́дут на да́чу., Они́ е́дут на да́чу.]
      - cue: "Что они́ де́лают на да́че ве́чером?"
        accept: [Ве́чером они́ пьют чай и игра́ют в ша́хматы., Они́ пьют чай и игра́ют в ша́хматы.]

  - id: e4
    type: translate
    task: 译成俄语。
    why: “星期几”用 [в]{.ru} + 第四格，时段用副词，先日子后时段。第 2 题“每星期四”是习惯，用 [хожу́]{.ru}；第 3 题“今天星期几”的回答用第一格。
    items:
      - zh: 星期六上午我们坐车去别墅。
        accept: ["В суббо́ту у́тром мы е́дем на да́чу.", "Мы е́дем на да́чу в суббо́ту у́тром."]
        rubric: ["[в суббо́ту]{.ru} 用第四格", "[у́тром]{.ru} 不加前置词", "乘车用 [е́дем]{.ru}"]
      - zh: 星期二和星期四我去游泳池。
        accept: ["Во вто́рник и в четве́рг я хожу́ в бассе́йн.", "Я хожу́ в бассе́йн во вто́рник и в четве́рг."]
        rubric: ["[во вто́рник]{.ru} 写 [во]{.ru}", "经常去用 [хожу́]{.ru}"]
      - zh: ——今天星期几？——今天星期三。
        accept: ["— Како́й сего́дня день? — Сего́дня среда́.", "— Како́й день сего́дня? — Сего́дня среда́.", "— Како́й сего́дня день? — Среда́."]
        rubric: ["回答用第一格 [среда́]{.ru}"]
      - zh: 星期日晚上我在家。
        accept: ["В воскресе́нье ве́чером я до́ма.", "Я до́ма в воскресе́нье ве́чером."]
        rubric: ["[в воскресе́нье]{.ru}", "“在家”用 [до́ма]{.ru}"]

  - id: e5
    type: open
    task: 写一写你下个星期的安排。
    items:
      - prompt: 用 6–8 个句子写你下个星期每天（至少五天）做什么、去哪儿，要用上 [у́тром]{.ru}、[днём]{.ru}、[ве́чером]{.ru}。
        length: 50–90
        model: |
          В понеде́льник у́тром я иду́ на уро́к, а днём рабо́таю в библиоте́ке. Во вто́рник и в четве́рг я хожу́ в бассе́йн. В сре́ду ве́чером я иду́ на конце́рт. В пя́тницу днём я покупа́ю кни́ги, а ве́чером смотрю́ фильм. В суббо́ту мы е́дем на да́чу. А в воскресе́нье ве́чером я до́ма и звоню́ домо́й.
        rubric: ["至少五个星期用 [в / во]{.ru} + 第四格写对", "时段副词至少用两个", "计划用现在时；每周都做的事用 [ходи́ть / е́здить]{.ru}"]
        notes: 范文按星期一到星期日的顺序写，每句以时间状语开头，结构整齐。同一天里的两项安排用 [а]{.ru} 对照（[у́тром…, а днём…]{.ru}）。每周两次的游泳用不定向动词 [хожу́]{.ru}，其余的一次性安排用定向动词或一般动词的现在时。
