lesson: L41
grammar: "[быть]{.ru} 的将来时 [бу́ду, бу́дешь, бу́дет, бу́дем, бу́дете, бу́дут]{.ru}；未完成体将来时：[бу́ду]{.ru} + 不定式。"
exercises:

  - id: e1
    type: fill
    task: 填入 [быть]{.ru} 的将来时形式。
    why: "[бу́ду]{.ru} 和主语的人称、数一致：[я — бу́ду]{.ru}，[ты — бу́дешь]{.ru}，[он, она́ — бу́дет]{.ru}，[мы — бу́дем]{.ru}，[вы — бу́дете]{.ru}，[они́ — бу́дут]{.ru}。第 3 题主语是 [А́нна и Ми́ша]{.ru} 两个人，要用复数 [бу́дут]{.ru}。第 6 题 [бу́ду]{.ru} 单独作谓语，表示“将在某处”。"
    items:
      - stem: За́втра я ___ рабо́тать.
        hint: быть
        accept: [бу́ду]
      - stem: Что ты ___ де́лать ве́чером?
        hint: быть
        accept: [бу́дешь]
      - stem: А́нна и Ми́ша ___ смотре́ть фильм.
        hint: быть
        accept: [бу́дут]
      - stem: В суббо́ту мы ___ отдыха́ть.
        hint: быть
        accept: [бу́дем]
      - stem: Что вы ___ де́лать за́втра?
        hint: быть
        accept: [бу́дете]
      - stem: Ве́чером па́па ___ до́ма.
        hint: быть
        accept: [бу́дет]

  - id: e2
    type: rewrite
    task: 把句子改成将来时，句首加 [за́втра]{.ru}。
    placeholder: За́втра …
    example:
      cue: Я чита́ю журна́л.
      answer: За́втра я бу́ду чита́ть журна́л.
    why: 变位的动词换成不定式，前面加上与主语一致的 [бу́ду]{.ru}。最常见的错误是把原来的变位形式保留下来，写成 [бу́ду чита́ю]{.ru}。第 4 题的 [-ся]{.ru} 留在不定式上：[занима́ться]{.ru}。第 5 题 [мы в библиоте́ке]{.ru} 没有动词，将来时只加 [бу́дем]{.ru}，不能写 [бу́дем быть]{.ru}。
    items:
      - cue: Ми́ша игра́ет в футбо́л.
        accept: [За́втра Ми́ша бу́дет игра́ть в футбо́л.]
      - cue: Мы смо́трим телеви́зор.
        accept: [За́втра мы бу́дем смотре́ть телеви́зор.]
      - cue: Па́па рабо́тает.
        accept: [За́втра па́па бу́дет рабо́тать.]
      - cue: Я занима́юсь в библиоте́ке.
        accept: [За́втра я бу́ду занима́ться в библиоте́ке.]
      - cue: Мы в библиоте́ке.
        accept: [За́втра мы бу́дем в библиоте́ке.]
      - cue: Они́ у́жинают на ку́хне.
        accept: [За́втра они́ бу́дут у́жинать на ку́хне.]

  - id: e3
    type: rewrite
    task: 按提示用否定式回答问题。
    placeholder: Нет, …
    example:
      cue: Ты бу́дешь смотре́ть телеви́зор? (чита́ть)
      answer: Нет, я не бу́ду смотре́ть телеви́зор. Я бу́ду чита́ть.
    why: "[не]{.ru} 放在 [бу́ду]{.ru} 前面，不放在不定式前面。问句里用 [ты]{.ru}、[вы]{.ru}，回答时要换成 [я]{.ru}、[мы]{.ru}，[бу́ду]{.ru} 的形式也跟着换。"
    items:
      - cue: Ты бу́дешь игра́ть в футбо́л? (де́лать уро́ки)
        accept: ["Нет, я не бу́ду игра́ть в футбо́л. Я бу́ду де́лать уро́ки."]
      - cue: Вы бу́дете отдыха́ть? (рабо́тать)
        accept: ["Нет, я не бу́ду отдыха́ть. Я бу́ду рабо́тать.", "Нет, мы не бу́дем отдыха́ть. Мы бу́дем рабо́тать."]
      - cue: А́нна бу́дет до́ма? (в библиоте́ке)
        accept: ["Нет, она́ не бу́дет до́ма. Она́ бу́дет в библиоте́ке.", "Нет, А́нна не бу́дет до́ма. Она́ бу́дет в библиоте́ке."]
      - cue: Они́ бу́дут смотре́ть фильм? (занима́ться)
        accept: ["Нет, они́ не бу́дут смотре́ть фильм. Они́ бу́дут занима́ться."]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊上午有课，然后在图书馆学习；米沙要踢足球，晚上做功课；伊万照常上班；去别墅的电气火车票九十卢布。
    items:
      - stem: "Ван Лэй: «За́втра у́тром у меня́ ___.»"
        options: [уро́ки, семина́р]
        answer: уро́ки
      - stem: Ми́ша бу́дет де́лать уро́ки ___.
        options: [у́тром, ве́чером]
        answer: ве́чером
      - stem: Ива́н Серге́евич за́втра бу́дет ___.
        options: [рабо́тать, отдыха́ть]
        answer: рабо́тать
      - stem: Биле́т на электри́чку сто́ит ___ рубле́й.
        options: [девяно́сто, девятна́дцать]
        answer: девяно́сто

  - id: e5
    type: translate
    task: 译成俄语。
    why: 汉语“明天我在家”“明天做什么”里没有表示将来的词，俄语一定要用 [бу́ду]{.ru}。第 4 题是“将有”，用 [у меня́ бу́дет]{.ru}；按课文注释 2，也可以用现在时表示已经安排好的事。
    items:
      - zh: 明天你做什么？——我要工作。
        accept: ["— Что ты бу́дешь де́лать за́втра? — Я бу́ду рабо́тать.", "— Что ты за́втра бу́дешь де́лать? — Я бу́ду рабо́тать.", "— За́втра что ты бу́дешь де́лать? — Я бу́ду рабо́тать.", "— Что ты бу́дешь де́лать за́втра? — За́втра я бу́ду рабо́тать."]
        rubric: ["[ты бу́дешь де́лать]{.ru}，[я бу́ду рабо́тать]{.ru}", "不定式不能变位"]
      - zh: 星期六我们休息。
        accept: ["В суббо́ту мы бу́дем отдыха́ть.", "Мы бу́дем отдыха́ть в суббо́ту."]
        rubric: ["“星期六”用 [в суббо́ту]{.ru}", "[мы бу́дем отдыха́ть]{.ru}"]
      - zh: 晚上爸爸在家。
        accept: ["Ве́чером па́па бу́дет до́ма.", "Па́па бу́дет до́ма ве́чером."]
        rubric: ["[быть]{.ru} 的将来时单独作谓语：[бу́дет до́ма]{.ru}", "不说 [бу́дет быть]{.ru}"]
      - zh: 星期一我有讨论课。
        accept: ["В понеде́льник у меня́ бу́дет семина́р.", "У меня́ в понеде́льник бу́дет семина́р.", "В понеде́льник у меня́ семина́р.", "У меня́ в понеде́льник семина́р."]
        rubric: ["“我有”用 [у меня́]{.ru}", "将来时用 [бу́дет]{.ru}，也可用现在时表示已安排的事"]

  - id: e6
    type: open
    task: 写一写你明天要做什么（40–60 词）。
    items:
      - prompt: 按时间顺序写：上午、下午（[днём]{.ru}）、晚上分别做什么，在哪里。至少用四个 [бу́ду]{.ru} + 不定式的句子。
        length: 40–60
        model: "За́втра пя́тница. У́тром у меня́ уро́ки. Пото́м я бу́ду занима́ться в библиоте́ке. Я бу́ду чита́ть и писа́ть. Днём я бу́ду до́ма. Я бу́ду обе́дать и отдыха́ть. Ве́чером мы бу́дем у́жинать на ку́хне. Пото́м я бу́ду смотре́ть фильм. А в суббо́ту я бу́ду игра́ть в футбо́л."
        rubric: ["至少四处用 [бу́ду]{.ru} + 未完成体不定式，[бу́ду]{.ru} 与主语一致", "有时间词：[у́тром, днём, ве́чером]{.ru}", "地点用 [в / на]{.ru} + 第六格"]
        notes: 范文按“上午—下午—晚上”的顺序展开，每个时间段先说在哪儿，再说做什么。[У́тром у меня́ уро́ки]{.ru} 用现在时表示已经排定的课；其余的打算都用 [бу́ду]{.ru} + 不定式。最后一句用 [а]{.ru} 转到星期六，让短文有个收尾。
