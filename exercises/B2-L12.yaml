lesson: B2-L12
grammar: "名词复数第五格：[-ами]{.ru}（硬变化）与 [-ями]{.ru}（软变化）；复数第三、五、六格的词尾对照。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数第五格填空。
    why: "硬变化加 [-ами]{.ru}，软变化加 [-ями]{.ru}。第 2 题 [я́блоко]{.ru} 复数 [я́блоки]{.ru}，第五格 [я́блоками]{.ru}。第 3 题 [роди́тели]{.ru} 只用复数，[-и]{.ru} 前是软辅音，所以是 [-ями]{.ru}。第 5 题 [пло́щадь]{.ru} 复数间接格重音移到词尾：[площадя́ми]{.ru}。第 6 题 [зда́ние]{.ru} → [зда́ниями]{.ru}。第 7 题 [ребя́та]{.ru} 只用复数，第五格 [ребя́тами]{.ru}。"
    items:
      - stem: Ба́бушки ката́лись на катке́ с ___.
        hint: внук
        accept: ["вну́ками"]
      - stem: Я люблю́ блины́ с ___.
        hint: я́блоко
        accept: ["я́блоками"]
      - stem: Ван Лэй ча́сто говори́т с ___ по телефо́ну.
        hint: роди́тели
        accept: ["роди́телями"]
      - stem: На ры́нке продаю́т пироги́ с ___.
        hint: гриб
        accept: ["гриба́ми"]
      - stem: Ме́жду ___ стоя́т дома́.
        hint: пло́щадь
        accept: ["площадя́ми"]
      - stem: Пе́ред ___ университе́та большо́й сад.
        hint: зда́ние
        accept: ["зда́ниями"]
      - stem: В суббо́ту мы с ___ бы́ли на катке́.
        hint: ребя́та
        accept: ["ребя́тами"]
      - stem: Ми́ша интересу́ется ___.
        hint: фильм
        accept: ["фи́льмами"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [с]{.ru} 表示“和……一起”，用第五格 [с ребя́тами]{.ru}。第 2 题 [отпра́вить]{.ru} 寄给谁用第三格 [роди́телям]{.ru}。第 3 题 [на конька́х]{.ru} 是 [на]{.ru} 加第六格。第 4 题 [над]{.ru} 要求第五格。第 5 题 [мно́го]{.ru} 后用复数第二格 [гриб]{.ru} → [грибо́в]{.ru}。三、五、六格只差一点：[-ам]{.ru}、[-ами]{.ru}、[-ах]{.ru}，要看前面的词要求哪个格。"
    items:
      - stem: Ван Лэй ката́лся на катке́ с ___.
        options: [ребя́там, ребя́тами, ребя́тах]
        answer: ребя́тами
      - stem: Ван Лэй отпра́вил фотогра́фии ___.
        options: [роди́телям, роди́телями, роди́телях]
        answer: роди́телям
      - stem: Ю́ми никогда́ не ката́лась на ___.
        options: [конька́м, конька́ми, конька́х]
        answer: конька́х
      - stem: Над ___ загоре́лись огни́.
        options: [дере́вьям, дере́вьями, дере́вьях]
        answer: дере́вьями
      - stem: Ле́том в лесу́ бы́ло мно́го ___.
        options: [грибо́в, гриба́ми, гриба́х]
        answer: грибо́в

  - id: e3
    type: rewrite
    task: 把第五格的名词变成复数。
    example:
      cue: Я ходи́л в кино́ с дру́гом.
      answer: Я ходи́л в кино́ с друзья́ми.
    why: "单数第五格 [-ом / -ем, -ой / -ей]{.ru} 换成复数 [-ами / -ями]{.ru}。第 2 题 [сосе́д]{.ru} 复数按软变化：[сосе́дями]{.ru}。第 3 题 [студе́нтка]{.ru} → [студе́нтками]{.ru}。第 4 题 [преподава́тель]{.ru} → [преподава́телями]{.ru}。"
    items:
      - cue: Мы пи́ли чай с блино́м.
        accept: ["Мы пи́ли чай с блина́ми."]
      - cue: Ма́ма говори́ла с сосе́дом.
        accept: ["Ма́ма говори́ла с сосе́дями."]
      - cue: Пьер ката́лся со студе́нткой.
        accept: ["Пьер ката́лся со студе́нтками.", "Пьер ката́лся с студе́нтками."]
      - cue: Мы встре́тились с преподава́телем.
        accept: ["Мы встре́тились с преподава́телями."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“我和同学们”用 [мы с ребя́тами]{.ru}，动词用复数。第 2 题“苹果馅的”用 [с я́блоками]{.ru}。第 3 题“滑冰”是 [ката́ться на конька́х]{.ru}，[никогда́ не]{.ru} 连用。第 4 题“一次也没”是 [ни ра́зу не]{.ru}。"
    items:
      - zh: 星期六我和同学们去滑冰了。
        accept: ["В суббо́ту мы с ребя́тами ката́лись на конька́х.", "Мы с ребя́тами ката́лись на конька́х в суббо́ту.", "В суббо́ту мы с ребя́тами бы́ли на катке́.", "В суббо́ту мы с одногру́ппниками ката́лись на конька́х.", "В суббо́ту я с ребя́тами ката́лся на конька́х.", "В суббо́ту я с ребя́тами ката́лась на конька́х.", "В суббо́ту мы с ребя́тами ходи́ли на като́к.", "В суббо́ту мы с ребя́тами е́здили на като́к."]
        rubric: ["[с ребя́тами]{.ru} 或 [с одногру́ппниками]{.ru}：复数第五格", "[ката́ться на конька́х]{.ru} 或 [быть на катке́]{.ru}"]
      - zh: 我喜欢苹果馅的薄饼。
        accept: ["Я люблю́ блины́ с я́блоками.", "Мне нра́вятся блины́ с я́блоками."]
        rubric: ["[с я́блоками]{.ru}：复数第五格", "[люблю́]{.ru} 或 [мне нра́вятся]{.ru}"]
      - zh: 由美从来没滑过冰。
        accept: ["Ю́ми никогда́ не ката́лась на конька́х."]
        rubric: ["[никогда́ не]{.ru}", "[ката́лась]{.ru}：阴性过去时", "[на конька́х]{.ru}：复数第六格"]
      - zh: 王磊一次也没摔倒。
        accept: ["Ван Лэй ни ра́зу не упа́л."]
        rubric: ["[ни ра́зу не]{.ru}", "完成体过去时 [упа́л]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пое́хали ребя́та в суббо́ту? Что бы́ло в па́рке? Кто ката́лся пе́рвый раз? Как ката́лись Ван Лэй и Ди́ма? Что ребя́та де́лали пото́м?]{.ru}"
        length: 50–80
        model: "В суббо́ту Ван Лэй, А́нна, Ди́ма, Ю́ми и Пьер пое́хали в парк Го́рького. Там был пра́здник: игра́ла му́зыка, продава́ли блины́ с я́блоками и с гриба́ми. Ю́ми пе́рвый раз ката́лась на конька́х, и ребя́та держа́ли её за ру́ки. Ван Лэй ни ра́зу не упа́л, а Ди́ма, кото́рый шути́л над все́ми, упа́л два ра́за. Пото́м ребя́та пи́ли в кафе́ горя́чий чай с блина́ми."
        rubric: ["回答全部五个问题", "至少用两个复数第五格：[с я́блоками]{.ru}、[с гриба́ми]{.ru}、[с блина́ми]{.ru}、[над все́ми]{.ru} 等", "[ни ра́зу не]{.ru} 的用法正确"]
        notes: 范文约 70 词。第一句把五个人一起交代清楚；中间用 [а]{.ru} 对比王磊和迪马，带出一个 [кото́рый]{.ru} 从句；复数第五格集中在“配什么吃”的地方。
