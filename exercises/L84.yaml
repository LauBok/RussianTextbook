lesson: L84
grammar: "[потому́ что]{.ru} 引出原因，[поэ́тому]{.ru} 引出结果，两者不能在同一句里同时使用；短尾形容词 [бо́лен]{.ru}、[здоро́в]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [потому́ что]{.ru} 或 [поэ́тому]{.ru}。
    why: "逗号后面是原因，用 [потому́ что]{.ru}（因为）；逗号后面是结果，用 [поэ́тому]{.ru}（所以）。判断方法：问一问后半句是“为什么”的答案，还是前半句带来的后果。第 2 题“她是医生”是原因、“她什么都知道”是结果，所以用 [поэ́тому]{.ru}。"
    items:
      - stem: Я не́ был на уро́ке, ___ был бо́лен.
        options: [потому́ что, поэ́тому]
        answer: потому́ что
      - stem: Мари́я Никола́евна — врач, ___ она́ всё зна́ет.
        options: [потому́ что, поэ́тому]
        answer: поэ́тому
      - stem: Шёл дождь, ___ мы бы́ли до́ма.
        options: [потому́ что, поэ́тому]
        answer: поэ́тому
      - stem: Мы бы́ли до́ма, ___ шёл дождь.
        options: [потому́ что, поэ́тому]
        answer: потому́ что
      - stem: Ван Лэй замёрз, ___ он забы́л зонт.
        options: [потому́ что, поэ́тому]
        answer: потому́ что
      - stem: Ван Лэ́ю бы́ло ску́чно, ___ он написа́л сообще́ние.
        options: [потому́ что, поэ́тому]
        answer: поэ́тому
      - stem: Мы пошли́ гуля́ть, ___ нам ну́жен све́жий во́здух.
        options: [потому́ что, поэ́тому]
        answer: потому́ что
      - stem: Всё зави́село от пого́ды. Шёл дождь, ___ мы не пое́хали к ба́бушке.
        options: [потому́ что, поэ́тому]
        answer: поэ́тому

  - id: e2
    type: rewrite
    task: 把 [потому́ что]{.ru} 句改成 [поэ́тому]{.ru} 句。
    example:
      cue: Я до́ма, потому́ что шёл дождь.
      answer: Шёл дождь, поэ́тому я до́ма.
    why: "两部分调换位置：原来 [потому́ что]{.ru} 后面的原因移到前面，结果放在 [поэ́тому]{.ru} 后面。不要同时保留 [потому́ что]{.ru}，俄语不说“因为……所以……”。"
    items:
      - cue: Петро́вы не пое́хали к ба́бушке, потому́ что Ван Лэй был бо́лен.
        accept: ["Ван Лэй был бо́лен, поэ́тому Петро́вы не пое́хали к ба́бушке."]
      - cue: Ему́ ску́чно, потому́ что он оди́н.
        accept: ["Он оди́н, поэ́тому ему́ ску́чно."]
      - cue: А́нна пошла́ на заня́тия одна́, потому́ что Ван Лэй был бо́лен.
        accept: ["Ван Лэй был бо́лен, поэ́тому А́нна пошла́ на заня́тия одна́."]
      - cue: Пьер здоро́в, потому́ что он был до́ма.
        accept: ["Пьер был до́ма, поэ́тому он здоро́в.", "Пьер был до́ма, поэ́тому здоро́в."]

  - id: e3
    type: fill
    task: 写出短尾形容词的正确形式。
    why: 短尾形容词和主语在性、数上一致：阳性 [бо́лен, здоро́в]{.ru}，阴性 [больна́, здоро́ва]{.ru}，复数 [больны́, здоро́вы]{.ru}。注意 [бо́лен]{.ru} 重音在词干，[больна́, больны́]{.ru} 重音在词尾。“您”即使指一个人也用复数形式。
    items:
      - stem: Вчера́ А́нна была́ ___.
        hint: бо́лен
        accept: [больна́]
      - stem: Ван Лэй ___, у него́ температу́ра.
        hint: бо́лен
        accept: [бо́лен]
      - stem: Ми́ша и А́нна ___.
        hint: здоро́в
        accept: [здоро́вы]
      - stem: Ю́ми, вы ___?
        hint: здоро́в
        accept: [здоро́вы]
      - stem: Мари́я Никола́евна ___.
        hint: здоро́в
        accept: [здоро́ва]

  - id: e4
    type: translate
    task: 译成俄语。
    items:
      - zh: 我没来上课，因为我病了。
        accept: ["Я не́ был на уро́ке, потому́ что был бо́лен.", "Я не́ был на уро́ке, потому́ что я был бо́лен.", "Я не была́ на уро́ке, потому́ что была́ больна́.", "Я не была́ на уро́ке, потому́ что я была́ больна́.", "Я не́ был на заня́тиях, потому́ что был бо́лен.", "Я не была́ на заня́тиях, потому́ что была́ больна́."]
        rubric: ["原因用 [потому́ что]{.ru}，前面有逗号", "“病了”用 [был бо́лен]{.ru}，女性说 [была́ больна́]{.ru}", "不要再加 [поэ́тому]{.ru}"]
      - zh: 下雨了，所以我们待在家里。
        accept: ["Шёл дождь, поэ́тому мы бы́ли до́ма.", "Шёл дождь, поэ́тому мы сиде́ли до́ма.", "Идёт дождь, поэ́тому мы до́ма.", "Идёт дождь, поэ́тому мы сиди́м до́ма."]
        rubric: ["结果用 [поэ́тому]{.ru}", "“下雨”用 [идёт / шёл дождь]{.ru}", "前后时间一致"]
      - zh: 他怎么没来？——他病了。
        accept: ["— Почему́ его́ нет? — Он бо́лен.", "— Почему́ его́ нет? — Потому́ что он бо́лен.", "— Почему́ его́ нет? — Он заболе́л."]
        rubric: ["“某人不在”用 [его́ нет]{.ru}", "“病了”用短尾 [бо́лен]{.ru} 或完成体 [заболе́л]{.ru}"]
      - zh: 她是医生，所以她什么都知道。
        accept: ["Она́ врач, поэ́тому она́ всё зна́ет.", "Она́ врач, поэ́тому всё зна́ет.", "Она́ — врач, поэ́тому она́ всё зна́ет."]
        rubric: ["[поэ́тому]{.ru} 引出结果", "现在时不用系动词"]

  - id: e5
    type: open
    task: 写一条请假短信。
    items:
      - prompt: 你病了，不能去上课。给老师写一条短信：说明今天不能来、为什么，问需要做哪些练习。用上 [потому́ что]{.ru} 和 [поэ́тому]{.ru}。
        length: 30–60
        model: "О́льга Ви́кторовна, здра́вствуйте! Извини́те, пожа́луйста, сего́дня я не бу́ду на уро́ке, потому́ что я бо́лен. У меня́ температу́ра, поэ́тому врач сказа́л: «Лежи́те до́ма». Я хочу́ занима́ться до́ма. Каки́е упражне́ния на́до сде́лать? Спаси́бо! Ван Лэй."
        rubric: ["开头有称呼和问候，结尾署名", "用 [потому́ что]{.ru} 说明原因", "用 [поэ́тому]{.ru} 说明结果", "给老师写信用 [вы]{.ru} 的形式"]
        notes: 范文的结构是：称呼和问候、道歉、原因、补充说明、请求、致谢和署名。给老师写短信也要礼貌，用名字加父称和 [вы]{.ru}。[Извини́те, пожа́луйста]{.ru} 放在说明原因之前，语气更客气。
