lesson: B3-L45
grammar: "政论语体：评论文章由标题（常用问句）、引言（问题 + 事实）、主体（各方观点和论据）、结论组成；介绍观点用 [одни считают…, другие…]{.ru}、[сторонники / противники этой точки зрения]{.ru}、[по мнению]{.ru} + 第二格、[с точки зрения]{.ru} + 第二格；修辞手段有设问、反复、对比。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как изменилась доля городского населения России за сто лет? Какие доводы приводят те, кто считает уход людей в города естественным процессом? Почему другие считают, что деревне нужно помогать? Что такое программа «Земский доктор»? Что такое сельский туризм? Из каких частей состоит публицистическая статья?]{.ru}"
        length: 90–130
        model: "В 1926 году в городах жил примерно каждый шестой житель страны, а по данным переписи 2021 года — почти 75 процентов россиян. Сторонники первой точки зрения говорят, что город даёт выбор работы и учёбы, больницы и театры, а в деревне сегодня нужно меньше рук, потому что работу выполняют машины. Другие считают, что деревня — часть культуры и истории страны, там сохранились старинные песни, ремёсла и праздники. «Земский доктор» — это программа, по которой врачи, переехавшие работать в село, получают денежную выплату. Сельский туризм — это отдых, когда горожане платят за то, чтобы несколько дней пожить в деревне, поработать в огороде или подоить корову. Публицистическая статья состоит из заголовка, вступления, основной части и заключения."
        rubric: ["六个问题都回答，数字准确", "第 2、3 题说明是谁的观点（[сторонники первой точки зрения говорят]{.ru}、[другие считают]{.ru}）", "用完整的句子"]
        notes: 第 1 题用两次普查的数据作对比。第 2、3 题是转述别人的观点，要用 [говорят, что]{.ru}、[считают, что]{.ru} 引出，不要写成自己的结论。

  - id: e2
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1、2 题 [с точки зрения]{.ru} 和 [по мнению]{.ru} 后面都用第二格：[экономики]{.ru}、[сторонников]{.ru}。第 3 题 [сторонники]{.ru} 后面的 [эта точка зрения]{.ru} 作非一致定语，用第二格 [этой точки зрения]{.ru}。第 4 题 [в отличие от]{.ru} + 第二格：[новости]{.ru}。第 5 题 [заставлять кого + 不定式]{.ru}，[читатель]{.ru} 用第四格 [читателя]{.ru}（动物名词，第四格同第二格）。"
    items:
      - stem: С точки зрения ___, уход людей в города — естественный процесс.
        hint: экономика
        accept: ["экономики"]
      - stem: По мнению ___ этой точки зрения, деревне нужно помогать.
        hint: сторонники
        accept: ["сторонников"]
      - stem: Сторонники ___ говорят, что изменить ничего нельзя.
        hint: эта точка зрения
        accept: ["этой точки зрения"]
      - stem: В отличие от ___, статья объясняет события.
        hint: новость
        accept: ["новости"]
      - stem: Хорошая статья заставляет ___ думать.
        hint: читатель
        accept: ["читателя"]

  - id: e3
    type: choice
    task: 选择正确的说法。
    why: "第 1 题“我认为”是 [по-моему]{.ru} 或 [по моему мнению]{.ru}，[по мнению]{.ru} 后面不能直接加人称代词 [меня]{.ru}；[с моей точки зрения]{.ru} 也对，但选项里写成了 [с точки зрения меня]{.ru}，是错的。第 2 题引出第二种观点用复数 [Другие]{.ru}，和前面的 [Одни]{.ru} 成对；单数 [другой]{.ru} 与复数动词 [уверены]{.ru} 不一致，[вторые]{.ru} 不能这样用。第 3 题“补充论据”用 [к тому же]{.ru}；[однако]{.ru} 表示转折，[таким образом]{.ru} 用于总结。第 4 题总结全文用 [Таким образом]{.ru}；[Во-первых]{.ru} 用来开始列举，[Например]{.ru} 引出例子。"
    items:
      - stem: ___, деревня не исчезнет.
        options: ["По мнению меня", "По-моему", "С точки зрения меня"]
        answer: По-моему
      - stem: Одни считают, что деревня исчезнет. ___ уверены, что она изменится.
        options: [Другие, Другой, Вторые]
        answer: Другие
      - stem: Жить в деревне без машины трудно. ___ магазин часто находится в соседнем селе.
        options: ["Однако", "К тому же", "Таким образом"]
        answer: К тому же
      - stem: ___, у каждой точки зрения есть свои сторонники.
        options: ["Во-первых", "Например", "Таким образом"]
        answer: Таким образом

  - id: e4
    type: rewrite
    task: 改写成转述观点的句子，用括号里的说法，说明这是谁的看法。
    example:
      cue: Деревне нужно помогать. (по мнению, сторонники этой точки зрения)
      answer: По мнению сторонников этой точки зрения, деревне нужно помогать.
    why: "[по мнению]{.ru}、[с точки зрения]{.ru} 后面用第二格，整个短语用逗号与句子隔开。[считать, что]{.ru} 后面接从句。第 1 题 [одни]{.ru} 作主语，后面用 [считают, что]{.ru}。第 2 题 [с точки зрения]{.ru} + 第二格 [горожан]{.ru}，[горожане]{.ru} 复数第二格是 [горожан]{.ru}，没有词尾。第 3 题插入的 [говорят они]{.ru} 放在主语后面，前后加逗号。"
    items:
      - cue: Уход людей в города — естественный процесс. (одни считают)
        accept: ["Одни считают, что уход людей в города — естественный процесс."]
      - cue: Жизнь в деревне скучная. (с точки зрения, многие горожане)
        accept: ["С точки зрения многих горожан, жизнь в деревне скучная."]
      - cue: Деревня — часть культуры страны. (говорят они)
        accept: ["Деревня, говорят они, — часть культуры страны.", "Деревня, говорят они, часть культуры страны."]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 根据 2021 年人口普查的数据，将近 75% 的俄罗斯人住在城市。
        accept: ["По данным переписи населения 2021 года, почти 75 процентов россиян живут в городах.", "По данным переписи 2021 года, почти 75 процентов россиян живут в городах.", "По данным переписи населения 2021 года, в городах живут почти 75 процентов россиян.", "По данным переписи 2021 года, в городах живут почти 75 процентов россиян.", "По данным переписи населения 2021 года, почти 75 процентов россиян живёт в городах.", "По данным переписи 2021 года, в городах живёт почти 75 процентов россиян."]
        rubric: ["[по данным]{.ru} + 第二格注明来源", "[75 процентов]{.ru}：复数第二格，谓语单复数都可以"]
      - zh: 持这种观点的人说，没有必要和不可改变的事情作斗争。
        accept: ["Сторонники этой точки зрения говорят, что не стоит бороться с тем, что изменить невозможно.", "Сторонники этой точки зрения говорят, что не нужно бороться с тем, что изменить невозможно.", "Сторонники этой точки зрения считают, что не стоит бороться с тем, что изменить невозможно."]
        rubric: ["[сторонники этой точки зрения]{.ru}", "[не стоит]{.ru} + 不定式", "[бороться с тем, что…]{.ru}：关联词结构"]
      - zh: 与新闻不同，评论文章不仅报道事件，还解释事件。
        accept: ["В отличие от новости, статья не только сообщает о событиях, но и объясняет их.", "В отличие от новости, публицистическая статья не только сообщает о событиях, но и объясняет их."]
        rubric: ["[в отличие от]{.ru} + 第二格", "[не только…, но и…]{.ru}", "[сообщать о]{.ru} + 第六格"]

  - id: e6
    type: open
    task: 应用文：为报纸的讨论栏目写一篇短评《在大城市生活好，还是在小城市生活好？》。
    items:
      - prompt: "按评论文章的结构写：问句标题；引言（提出问题，用一个事实或现象说明它的现实性）；介绍两种观点，每种至少两条论据，说明是谁的看法；结论。至少用一个设问，用 [одни … другие]{.ru}、[сторонники этой точки зрения]{.ru}、[к тому же]{.ru} 或 [таким образом]{.ru} 中的三个。"
        length: 150–200
        model: "Где лучше жить — в большом городе или в маленьком?\n\nКаждый год тысячи выпускников школ уезжают из небольших городов в Москву, Санкт-Петербург и другие крупные города. Многие из них остаются там навсегда. Правильно ли они поступают?\n\nОдни считают, что настоящая жизнь возможна только в большом городе. Там лучшие университеты, больше работы и выше зарплаты. К тому же в большом городе есть театры, музеи, выставки, и каждый может найти дело по душе.\n\nДругие с этим не согласны. По их мнению, жизнь в маленьком городе спокойнее и дешевле. Не нужно тратить два часа в день на дорогу, квартира стоит гораздо меньше, а до природы можно дойти пешком. Сторонники этой точки зрения говорят: зачем жить в шуме и пробках, если можно жить спокойно? Кроме того, интернет позволяет сегодня работать удалённо из любого места.\n\nТаким образом, у каждой точки зрения есть свои доводы. Наверное, единого ответа на этот вопрос нет: каждый выбирает то, что ему ближе."
        rubric: ["结构完整：问句标题、引言、两种观点、结论", "每种观点至少两条论据，并说明是谁的看法", "至少一个设问", "用了 [одни … другие]{.ru}、[сторонники этой точки зрения]{.ru}、[к тому же]{.ru}、[таким образом]{.ru} 中的至少三个", "150–200 词"]
        notes: "范文约 150 词，分五段：标题、引言、两种观点各一段、结论。引言用一个大家熟悉的现象（毕业生去大城市）说明问题的现实性，再用设问 [Правильно ли они поступают?]{.ru} 引出讨论。两段观点结构对称：[Одни считают… / Другие с этим не согласны.]{.ru} 每段先给观点，再用 [к тому же]{.ru}、[кроме того]{.ru} 补充论据。第二段里还有一个反问 [зачем жить в шуме и пробках…?]{.ru}，它出自持这种观点的人，所以前面写明 [Сторонники этой точки зрения говорят]{.ru}。结论用 [Таким образом]{.ru} 开头，不替任何一方下结论。"

  - id: e7
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [на месте]{.ru} + 第二格复数：[колхозов]{.ru}。第 2 题 [выращивать]{.ru} 直接接第四格，[овощи]{.ru} 复数第四格同第一格。第 3 题 [заменить кого]{.ru}：[постоянных жителей]{.ru}，动物名词复数第四格同第二格。第 4 题 [работать с перебоями]{.ru}：[с]{.ru} + 第五格复数。"
    items:
      - stem: На месте советских ___ работают крупные агропредприятия.
        hint: колхоз
        accept: ["колхозов"]
      - stem: Фермеры выращивают ___ и разводят скот.
        hint: овощи
        accept: ["овощи"]
      - stem: Туристы не заменят ___.
        hint: постоянные жители
        accept: ["постоянных жителей"]
      - stem: В деревне мобильная связь работает с ___.
        hint: перебои
        accept: ["перебоями"]
