lesson: B4-L36
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Где живёт молодой человек? Почему он не хочет встречаться с хозяйкой?]{.ru}"
        length: 40–70
        model: "Он живёт в маленькой каморке под самой крышей пятиэтажного дома; она больше похожа на шкаф, чем на квартиру. Он должен хозяйке много денег. Он не хочет слушать её жалобы и угрозы, не хочет извиняться и лгать, поэтому старается пройти мимо её кухни незаметно."
        rubric: ["描述住处：五层楼顶下的小屋，像柜子", "说出欠房东的债和不愿听抱怨、说谎"]
        notes: "答案在第 2—3 段。注意第 3 段的转折：主人公其实并不怕房东太太本人，他怕的是那些琐碎的纠缠。"
      - prompt: "[Почему герой сам удивляется своему страху?]{.ru}"
        length: 30–60
        model: "Он задумал большое и страшное дело, а боится таких пустяков, как встреча с хозяйкой на лестнице. Ему кажется странным, что человек, который хочет совершить такой шаг, может бояться мелочей."
        rubric: ["说出“大事”与“小事”的反差", "引用或转述 [каких пустяков боюсь]{.ru}"]
        notes: "第 4—5 段。[На какое дело хочу покуситься и в то же время каких пустяков боюсь!]{.ru} 是理解全段的钥匙。"
      - prompt: "[Как изменилось отношение героя к своей «мечте» за последний месяц? Что он чувствует, когда выходит от старухи?]{.ru}"
        length: 40–80
        model: "Месяц назад он сам не верил своей мечте и только думал о ней. Теперь он привык считать её предприятием и даже идёт делать пробу. Но когда он выходит от старухи, ему становится отвратительно: он думает, что это вздор и нелепость, и удивляется, как такой ужас мог прийти ему в голову."
        rubric: ["说出从“幻想”到“计划、试验”的变化", "说出出门后的厌恶和自责"]
        notes: "第 7 段和第 9—10 段。注意 [«безобразную» мечту]{.ru} 中的引号：主人公自己曾经这样称呼它，现在却开始认真对待了。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[каморка]{.ru}"
        accept: ["Очень маленькая бедная комната.", "Маленькая тесная комната."]
        rubric: ["说明是很小的（简陋的）房间"]
      - zh: "[жилец]{.ru}"
        accept: ["Человек, который снимает комнату или квартиру.", "Тот, кто живёт в чужой квартире и платит за неё."]
        rubric: ["说明是租房住的人"]
      - zh: "[нерешимость]{.ru}"
        accept: ["Состояние, когда человек не может решиться что-то сделать.", "Когда человек не знает, делать ему что-то или нет."]
        rubric: ["说明是下不了决心、犹豫"]
      - zh: "[пустяк]{.ru}"
        accept: ["Что-то неважное, мелочь.", "Мелочь, на которую не стоит обращать внимания."]
        rubric: ["说明是无关紧要的小事"]
      - zh: "[духота]{.ru}"
        accept: ["Жаркий воздух, которым трудно дышать.", "Когда очень жарко и трудно дышать."]
        rubric: ["说明是闷热、呼吸困难"]
      - zh: "[забытьё]{.ru}"
        accept: ["Состояние, когда человек почти ничего не замечает вокруг себя.", "Состояние между сном и явью, когда человек не понимает, что происходит вокруг."]
        rubric: ["说明是对周围的事几乎没有知觉的状态"]

  - id: e3
    type: choice
    task: 根据选文和本课“文体与修辞”选择正确答案。
    why: "第 1 题主人公的“事”始终没有名字，作者用 [дело, это, мечта, предприятие, проба, ужас]{.ru} 代替，制造悬念。第 2 题 [Оттого и ничего не делаю, что болтаю… оттого болтаю, что ничего не делаю]{.ru} 词语颠倒重复，思路来回摇摆。第 3 题“犹豫”一词在第 1 段和第 7 段都出现，前后呼应。第 4 题第 6 段：酷热、臭味和醉汉 [потрясло… расстроенные нервы]{.ru}，环境加重了心理紧张。第 5 题第 7 段：他数过，从家门口到老太婆家有七百三十步。第 6 题最后一段：主人公出门后感到厌恶，认为这是 [вздор]{.ru} 和 [нелепость]{.ru}。"
    items:
      - stem: "Достоевский не называет прямо «дело», которое задумал герой, потому что хочет ___."
        options: ["создать напряжение и показать, что герой сам боится о нём думать", "сделать текст короче", "скрыть, где живёт герой"]
        answer: "создать напряжение и показать, что герой сам боится о нём думать"
      - stem: "Фраза «оттого болтаю, что ничего не делаю» показывает, что мысль героя ___."
        options: ["ходит по кругу", "ясна и спокойна", "направлена на других людей"]
        answer: "ходит по кругу"
      - stem: "Слово «нерешимость» встречается и в первом, и в седьмом абзаце. Это ___."
        options: ["повтор, который связывает начало и конец отрывка", "ошибка автора", "слово из речи хозяйки"]
        answer: "повтор, который связывает начало и конец отрывка"
      - stem: "Описание жары, пыли и вони на улице ___."
        options: ["усиливает тяжёлое состояние героя", "показывает, что герой любит лето", "не связано с героем"]
        answer: "усиливает тяжёлое состояние героя"
      - stem: "От ворот дома героя до дома старухи ___."
        options: ["семьсот тридцать шагов", "два часа пути", "одна лестница"]
        answer: "семьсот тридцать шагов"
      - stem: "Выйдя от старухи, герой чувствует ___."
        options: ["отвращение к самому себе", "радость", "полное спокойствие"]
        answer: "отвращение к самому себе"

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形和支配关系。
    why: "第 1 题 [походить на что]{.ru} 像，第四格 [шкаф]{.ru}，[более… чем]{.ru} 比较。第 2 题 [стыдиться чего]{.ru} 要求第二格；先行词 [ощущение]{.ru} 是中性，关系代词用中性第二格 [которого]{.ru}（与阳性同形）。第 3 题 [углубиться в себя]{.ru}，完成体过去时 [углубился]{.ru}。第 4 题 [тяготить кого]{.ru}，不定式跟在 [перестало]{.ru} 后面。第 5 题 [покуситься на что]{.ru}，主语 [я]{.ru}，不定式跟在 [хочу]{.ru} 后面。第 6 题 [возрастать]{.ru} 未完成体过去时，主语 [волнение]{.ru} 是中性：[возрастало]{.ru}。"
    items:
      - stem: "Каморка походила более на ___, чем на квартиру."
        hint: шкаф
        accept: ["шкаф"]
      - stem: "Он чувствовал какое-то болезненное ощущение, ___ стыдился."
        hint: который
        accept: ["которого"]
      - stem: "Он до того ___ в себя, что боялся всякой встречи."
        hint: углубиться
        accept: ["углубился"]
      - stem: "Даже стеснённое положение перестало ___ его."
        hint: тяготить
        accept: ["тяготить"]
      - stem: "На какое дело хочу ___!"
        hint: покуситься
        accept: ["покуситься"]
      - stem: "С каждым шагом волнение его ___ всё сильнее и сильнее."
        hint: возрастать
        accept: ["возрастало"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩到约 150 词。保留人物的主要想法和感受，不必列举街上的每一个细节。
    items:
      - prompt: "[Напишите краткое изложение отрывка.]{.ru}"
        length: 130–170
        model: "Жарким июльским вечером бедный молодой человек выходит из своей каморки под крышей и медленно идёт по Петербургу. Он должен хозяйке много денег и всегда старается незаметно пройти мимо её кухни: ему противно слушать её жалобы и самому лгать. Последний месяц он живёт один, почти ни с кем не говорит, ничего не делает и всё время думает. Он задумал какое-то страшное дело и сам удивляется, что при этом боится таких пустяков, как встреча с хозяйкой. Он спорит с собой: то называет свой план игрушкой, то относится к нему серьёзно. На улице стоят жара, пыль и вонь, всюду пьяные, и это ещё больше расстраивает его. Он два дня ничего не ел и чувствует себя очень слабым. Теперь он идёт делать «пробу» своего предприятия. Выйдя через некоторое время на улицу, Раскольников чувствует отвращение к себе и называет свою мысль ужасом и нелепостью."
        rubric: ["写出主人公的处境：贫穷、欠债、孤独", "写出“大事”与害怕小事的反差、犹豫", "写出去“试验”和出来后的厌恶", "不说破“那件事”是什么也可以，但要有悬念", "130—170 词"]
        notes: "范文约 160 词。心理小说的概要要以人物的想法和感受为线索，环境描写压缩成一句（[жара, пыль и вонь]{.ru}）。可以保留原文里加引号的关键词，如 «проба»。"

  - id: e6
    type: open
    task: 读后评论。用俄语写一篇 250—300 词的短评：“陀思妥耶夫斯基怎样表现人物的内心？”结合选文谈两三种手法，并说说这种写法给你的感受。
    items:
      - prompt: "[Как Достоевский показывает внутреннее состояние героя? Напишите отзыв о прочитанном отрывке.]{.ru}"
        length: 250–300
        model: "Первая глава «Преступления и наказания» почти лишена событий: молодой человек выходит из дома и идёт по улице. И всё-таки читать её очень трудно оторваться, потому что главное действие происходит не на улице, а в душе героя.\n\nПрежде всего, Достоевский ничего не объясняет прямо. Мы не знаем, какое «дело» задумал герой: он называет его то «это», то «мечтой», то «предприятием», то «пробой». Читатель вместе с героем боится назвать эту мысль, и от этого напряжение только растёт.\n\nВо-вторых, автор позволяет нам слышать мысли героя. Раскольников всё время разговаривает сам с собой, спорит, перебивает себя. Его фразы обрываются, слова повторяются: «игрушки!.. игрушки», «неужели, неужели я…», «гадко, гадко!». Особенно интересна фраза «Оттого и ничего не делаю, что болтаю… оттого болтаю, что ничего не делаю»: мысль ходит по кругу, как и сам герой, который не может решиться.\n\nВ-третьих, внешний мир у Достоевского отражает внутренний. Жара, духота, вонь, пьяные на улице, маленькая каморка, похожая на шкаф, — всё это давит на героя так же, как бедность и его страшная идея.\n\nНаконец, в отрывке много противоречий. Герой красив и умён, но живёт как нищий. Он задумал страшное дело, но боится хозяйки. Он идёт делать пробу, а потом сам называет свою мысль «ужасом». Эти противоречия делают его живым человеком, а не схемой.\n\nМне этот отрывок показался тяжёлым, но очень сильным. Достоевский заставляет читателя не просто наблюдать за героем, а чувствовать вместе с ним его тревогу и сомнения. Уже с первых страниц понятно, что роман будет не о преступлении, а о душе человека."
        rubric: ["谈到至少两种手法（不点破的“事”、内心独白与重复、环境与心理、矛盾）", "每种手法有选文中的例子", "写出自己的阅读感受", "250—300 词，段落清楚"]
        notes: "范文约 290 词。结构：引子（没有事件的一章）—手法一（不点破）—手法二（独白与重复）—手法三（环境）—手法四（矛盾）—个人感受。评论心理描写时，要说明“手法”和“效果”之间的联系，例如“重复→思路打转→表现犹豫”。"
