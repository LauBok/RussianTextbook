lesson: L04
grammar: "[ты]{.ru} 与 [вы]{.ru} 的区别；[Как вас (тебя́) зову́т? — Меня́ зову́т…]{.ru}；名字、父称、姓与称呼；[ИК-4]{.ru} 带 [а]{.ru} 的不完全疑问句。"
exercises:

  - id: e1
    type: choice
    task: 根据称呼选择 [ты]{.ru} 或 [вы]{.ru}。
    why: 称呼和代词要配套。叫名字加父称（[Ива́н Серге́евич]{.ru}、[Мари́я Никола́евна]{.ru}）用 [вы]{.ru}；叫小名（[Ми́ша]{.ru}）用 [ты]{.ru}；孩子对父母说 [ты]{.ru}，所以第 3 题是 [ты]{.ru}，这是中国学生最容易错的地方。第 5 题同时对两个人说话，不论熟不熟，都用 [вы]{.ru}。
    items:
      - stem: Ива́н Серге́евич, ___ инжене́р?
        options: [ты, вы]
        answer: вы
      - stem: Ми́ша, ___ шко́льник?
        options: [ты, вы]
        answer: ты
      - stem: Ма́ма, ___ до́ма?
        options: [ты, вы]
        answer: ты
      - stem: Мари́я Никола́евна, ___ врач?
        options: [ты, вы]
        answer: вы
      - stem: А́нна и Ми́ша, ___ до́ма?
        options: [ты, вы]
        answer: вы
      - stem: А́нна, ___ студе́нтка?
        options: [ты, вы]
        answer: ты

  - id: e2
    type: choice
    task: 选择 [вас]{.ru}、[тебя́]{.ru} 或 [меня́]{.ru}。
    why: 问名字时，对长辈、生人说 [Как вас зову́т?]{.ru}，对孩子、同学说 [Как тебя́ зову́т?]{.ru}；回答一律是 [Меня́ зову́т…]{.ru}。第 2 题回答的是中学生米沙，问孩子的名字，用 [тебя́]{.ru}；第 4 题反问时只说 [А вас?]{.ru}，形式和问句一致。
    items:
      - stem: — Как ___ зову́т? — Меня́ зову́т Ива́н Серге́евич.
        options: [вас, тебя́, меня́]
        answer: вас
      - stem: — Как ___ зову́т? — Меня́ зову́т Ми́ша. Я шко́льник.
        options: [вас, тебя́, меня́]
        answer: тебя́
      - stem: — Как вас зову́т? — ___ зову́т Ван Лэй.
        options: [Вас, Тебя́, Меня́]
        answer: Меня́
      - stem: — Меня́ зову́т Лэй. А ___? — Меня́ зову́т Ива́н Серге́евич.
        options: [вас, тебя́, меня́]
        answer: вас

  - id: e3
    type: choice
    task: 选择正确的父称。
    why: 父称跟着父亲的名字走，再按本人的性别选词尾：男性 [-ович]{.ru}、[-евич]{.ru}，女性 [-овна]{.ru}、[-евна]{.ru}。米沙和安娜的父亲是 [Ива́н]{.ru}，伊万的父亲是 [Серге́й]{.ru}。注意 [Серге́й]{.ru} 以 [-й]{.ru} 结尾，构成 [Серге́евич]{.ru}，不是 [Серге́йович]{.ru}。
    items:
      - stem: Ми́ша — Михаи́л ___ Петро́в.
        options: [Ива́нович, Ива́новна, Серге́евич]
        answer: Ива́нович
      - stem: А́нна — А́нна ___ Петро́ва.
        options: [Ива́нович, Ива́новна, Никола́евна]
        answer: Ива́новна
      - stem: Па́па — Ива́н ___ Петро́в.
        options: [Ива́нович, Серге́евич, Серге́евна]
        answer: Серге́евич

  - id: e4
    type: rewrite
    task: 按例句反问对方。
    placeholder: … А ты? / … А вы?
    example:
      cue: Я студе́нт. (Ми́ша)
      answer: Я студе́нт. А ты?
    why: 反问用 [а]{.ru} 加代词，读 [ИК-4]{.ru}。对谁说话决定用 [ты]{.ru} 还是 [вы]{.ru}：对米沙、安娜用 [ты]{.ru}，对伊万·谢尔盖耶维奇、玛丽亚·尼古拉耶夫娜用 [вы]{.ru}。
    items:
      - cue: Я студе́нт. (Ива́н Серге́евич)
        accept: ["Я студе́нт. А вы?"]
      - cue: Я до́ма. (А́нна)
        accept: ["Я до́ма. А ты?"]
      - cue: Я инжене́р. (Мари́я Никола́евна)
        accept: ["Я инжене́р. А вы?"]
      - cue: Меня́ зову́т Ми́ша. (Ван Лэй)
        accept: ["Меня́ зову́т Ми́ша. А тебя́?", "Меня́ зову́т Ми́ша. А вас?"]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 第 1 题对长辈问名字用 [вас]{.ru}，反问也用 [вас]{.ru}。第 2 题说身份不用系动词。第 3 题说姓、名时，两个名词之间可以用破折号代替“是”，也可以用 [э́то]{.ru}。
    items:
      - zh: ——您叫什么名字？——我叫王磊。您呢？
        accept: ["— Как вас зову́т? — Меня́ зову́т Ван Лэй. А вас?", "— Как вас зову́т? — Я Ван Лэй. А вас?"]
        rubric: ["对长辈问名字用 [Как вас зову́т?]{.ru}", "回答用 [Меня́ зову́т…]{.ru}", "反问用 [А вас?]{.ru}"]
      - zh: ——米沙，你是中学生吗？——是的，我是中学生。
        accept: ["— Ми́ша, ты шко́льник? — Да, я шко́льник.", "— Ми́ша, ты шко́льник? — Да, шко́льник."]
        rubric: ["对米沙用 [ты]{.ru}", "不用系动词", "“中学生”用 [шко́льник]{.ru}"]
      - zh: 王是姓，磊是名字。
        accept: ["Ван — фами́лия, Лэй — и́мя.", "Ван — фами́лия, а Лэй — и́мя.", "Ван — э́то фами́лия, а Лэй — э́то и́мя.", "Ван — э́то фами́лия, Лэй — э́то и́мя."]
        rubric: ["“姓”[фами́лия]{.ru}，“名字”[и́мя]{.ru}", "不用系动词，可加破折号或 [э́то]{.ru}"]
      - zh: 伊万·谢尔盖耶维奇是工程师，玛丽亚·尼古拉耶夫娜是医生。
        accept: ["Ива́н Серге́евич — инжене́р, а Мари́я Никола́евна — врач.", "Ива́н Серге́евич инжене́р, а Мари́я Никола́евна врач.", "Ива́н Серге́евич — инжене́р, Мари́я Никола́евна — врач.", "Ива́н Серге́евич инжене́р, Мари́я Никола́евна врач."]
        rubric: ["“工程师”[инжене́р]{.ru}，“医生”[врач]{.ru}", "[врач]{.ru} 指女医生时形式不变", "两个分句对比用 [а]{.ru}"]
