lesson: B3-L23
grammar: "外来词的性与变格：辅音结尾为阳性、[-а]{.ru} 结尾为阴性，都正常变格；[-о, -е, -и, -у, -ю]{.ru} 结尾的词不变格，物品为中性、动物为阳性、人按自然性别、地名按类名；[кофе]{.ru} 为阳性。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Какие слова пришли в русский язык из греческого и тюркских языков? Почему при Петре I в языке появилось много голландских слов? Как изменилось значение слова «бутерброд»? На каком языке говорили в дворянских семьях в XVIII–XIX веках? Какой язык стал главным источником новых слов в XX веке?]{.ru}"
        length: 60–90
        model: "Из греческого языка пришли слова «тетрадь» и «огурец», а из тюркских — «деньги» и «карандаш». При Петре I появилось много голландских слов, потому что царь строил флот и сам учился строить корабли в Голландии. Так в русском языке оказались слова «гавань» и «матрос». В немецком языке «бутерброд» — это хлеб с маслом, а у русских бутербродом называют и хлеб с колбасой или сыром. В XVIII–XIX веках в дворянских семьях говорили по-французски, поэтому из французского пришли слова «пальто», «пляж», «меню». В XX веке главным источником новых слов стал английский язык."
        rubric: ["五个问题都回答，例词与课文一致", "[при]{.ru} + 第六格：[при Петре I]{.ru}", "[стать]{.ru} 后用第五格：[стал главным источником]{.ru}"]
        notes: 第 3 题要说出意思的变化：德语里只是“抹黄油的面包”，俄语里夹什么都可以。第 5 题注意 [источник]{.ru} 是阳性，[главным источником]{.ru}。

  - id: e2
    type: choice
    task: 选择与名词一致的正确形式（按规范）。
    why: "不变格名词的性按意思判断。第 1 题 [пальто]{.ru} 是物品，中性：[новое]{.ru}。第 2 题 [кофе]{.ru} 是例外，按规范为阳性：[горячий]{.ru}。第 3 题 [кенгуру]{.ru} 是动物，阳性：[смешной]{.ru}。第 4 题 [Сочи]{.ru} 是城市，取 [город]{.ru} 的性，阳性：[солнечный]{.ru}。第 5 题 [Миссисипи]{.ru} 是河流，取 [река]{.ru} 的性，阴性：[широкая]{.ru}。第 6 题 [такси]{.ru} 中性，过去时用 [-о]{.ru}：[приехало]{.ru}。"
    items:
      - stem: Брат купил ___ пальто.
        options: [новый, новая, новое]
        answer: новое
      - stem: Утром я пью ___ кофе.
        options: [горячий, горячее, горячая]
        answer: горячий
      - stem: У нас в парке живёт ___ кенгуру.
        options: [смешной, смешное, смешная]
        answer: смешной
      - stem: Летом мы ездили в ___ Сочи.
        options: [солнечное, солнечный, солнечную]
        answer: солнечный
      - stem: Миссисипи — очень ___ река.
        options: [широкий, широкое, широкая]
        answer: широкая
      - stem: Такси уже ___.
        options: [приехал, приехала, приехало]
        answer: приехало

  - id: e3
    type: fill
    task: 用括号里的词填空。能变格的要变成正确的格，不变格的保持原形。
    why: "先看结尾。第 1 题 [компьютер]{.ru} 以辅音结尾，阳性，[на]{.ru} + 第六格 [компьютере]{.ru}。第 2 题 [кафе]{.ru} 以 [-е]{.ru} 结尾，不变格，第六格仍是 [кафе]{.ru}。第 3 题 [пицца]{.ru} 以 [-а]{.ru} 结尾，阴性，[без]{.ru} + 第二格 [пиццы]{.ru}。第 4 题 [метро]{.ru} 不变格。第 5 题 [гавань]{.ru} 阴性，[в]{.ru} + 第六格 [гавани]{.ru}。第 6 题 [такси]{.ru} 不变格，[три]{.ru} 后面也不变。"
    items:
      - stem: Сестра весь вечер играла на ___.
        hint: компьютер
        accept: ["компьютере"]
      - stem: Мы встретились в маленьком ___ у вокзала.
        hint: кафе
        accept: ["кафе"]
      - stem: Какой же праздник без ___!
        hint: пицца
        accept: ["пиццы"]
      - stem: До университета я езжу на ___.
        hint: метро
        accept: ["метро"]
      - stem: В ___ стояли большие корабли.
        hint: гавань
        accept: ["гавани"]
      - stem: У театра ждали три ___.
        hint: такси
        accept: ["такси"]

  - id: e4
    type: choice
    task: 选择与不变格名词一致的正确形式。
    why: "不变格名词本身看不出格，要靠形容词、代词、动词表现出来。第 1 题 [пальто]{.ru} 中性，[в]{.ru} + 第六格：[в моём пальто]{.ru}。第 2 题 [кофе]{.ru} 为阳性，过去时用 [был]{.ru}；中性 [было]{.ru} 只是口语中允许的说法。第 3 题 [около]{.ru} 要求第二格，[такси]{.ru} 中性：[нашего]{.ru}。第 4 题 [атташе]{.ru} 指男人，阳性：[приехал]{.ru}。第 5 题 [Сочи]{.ru} 取 [город]{.ru} 的性，[по]{.ru} + 第三格：[по солнечному Сочи]{.ru}。"
    items:
      - stem: Я оставил ключи в ___ пальто.
        options: [моём, моей, моих]
        answer: моём
      - stem: Кофе ___ очень вкусный.
        options: [был, было, была]
        answer: был
      - stem: Около ___ такси стоял водитель.
        options: [нашего, нашей, наше]
        answer: нашего
      - stem: Вчера в Москву ___ новый атташе.
        options: [приехал, приехало, приехала]
        answer: приехал
      - stem: Мы целый день гуляли по ___ Сочи.
        options: [солнечному, солнечной, солнечном]
        answer: солнечному

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 这些词是希腊来源的。
        accept: ["Эти слова греческого происхождения.", "Эти слова — греческого происхождения.", "Эти слова пришли из греческого языка.", "Эти слова пришли из греческого."]
        rubric: ["第二格表示特征：[греческого происхождения]{.ru}", "或 [прийти из какого языка]{.ru}"]
      - zh: 外来词进入俄语以后，必须服从俄语语法。
        accept: ["Попадая в русский язык, иностранное слово должно подчиниться русской грамматике.", "Попав в русский язык, иностранное слово должно подчиниться русской грамматике.", "Когда иностранное слово попадает в русский язык, оно должно подчиниться русской грамматике.", "Попадая в русский язык, иностранные слова должны подчиниться русской грамматике.", "Попав в русский язык, иностранные слова должны подчиниться русской грамматике.", "Когда иностранные слова попадают в русский язык, они должны подчиниться русской грамматике."]
        rubric: ["[подчиниться чему]{.ru} 用第三格：[русской грамматике]{.ru}", "副动词短语或 [когда]{.ru} 从句均可", "[попадать в]{.ru} + 第四格"]
      - zh: 按规范 [кофе]{.ru} 是阳性名词。
        accept: ["По норме слово «кофе» мужского рода.", "По норме «кофе» мужского рода.", "По норме кофе — существительное мужского рода.", "По норме слово «кофе» — существительное мужского рода.", "Слово «кофе» по норме мужского рода.", "По норме «кофе» — существительное мужского рода.", "Слово «кофе» по норме — существительное мужского рода."]
        rubric: ["[по норме]{.ru}", "第二格表示特征：[мужского рода]{.ru}"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面的句子用例子证明它，最后一句收束全段。
    items:
      - prompt: "主题句：[Иностранные слова не портят язык, если ими пользуются с умом.]{.ru} 至少举三个课文中的外来词，说明它们来自哪种语言、怎样融入了俄语；至少用一个不变格名词并让形容词与它一致。"
        length: 140–160
        model: "Иностранные слова не портят язык, если ими пользуются с умом. История русского языка показывает, что заимствования делают его богаче. Слова «тетрадь» и «огурец» пришли из греческого языка много веков назад, но сегодня никто не считает их чужими. При Петре I в русском языке появились голландские слова «гавань» и «матрос», потому что в стране начали строить флот. Этими словами назвали то, чего раньше в России не было. Немецкое слово «бутерброд» тоже стало русским, но изменило значение: у нас это хлеб не только с маслом, но и с колбасой или сыром. Французские слова «пальто» и «меню» не склоняются, но русские легко их используют: мы говорим «новое пальто», «в меню нет супа». Попадая в русский язык, иностранное слово должно подчиниться русской грамматике и постепенно становится своим. Конечно, если вместо простого русского слова человек говорит английское только потому, что так говорят все, это плохо. Но язык сам решает, какие слова оставить. Поэтому бояться заимствований не нужно: нужно просто пользоваться ими с умом."
        rubric: ["第一句是给定的主题句", "至少三个外来词，来源与课文一致", "至少一个不变格名词与形容词一致（[новое пальто]{.ru} 等）", "[пользоваться чем]{.ru} 用第五格", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 总述（借词使语言更丰富）→ 四组例证（希腊语、荷兰语、德语、法语）→ 让步（[Конечно, если…]{.ru}）→ 收束句呼应主题句。议论性段落里加一句让步，承认反面意见，再回到自己的观点，段落会更有说服力。
