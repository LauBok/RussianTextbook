lesson: L35
grammar: "数词 13–20；数词与名词连用：1 + 单数第一格（[оди́н, одна́, одно́]{.ru}），2–4 + 单数第二格（[два / две]{.ru}），5–20 + 复数第二格（[челове́к, часо́в]{.ru}）；[ско́лько]{.ru} + 第二格。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的数词形式。
    why: "[оди́н, одна́, одно́]{.ru} 和名词的性一致；“二”在阴性名词前用 [две]{.ru}，在阳性、中性名词前用 [два]{.ru}。[дочь]{.ru}、[сестра́]{.ru}、[соба́ка]{.ru}、[ко́мната]{.ru} 是阴性；[де́душка]{.ru} 以 [-а]{.ru} 结尾，但是阳性，所以用 [два]{.ru}，这是最容易错的一题。"
    items:
      - stem: У меня́ ___ сестра́.
        options: [оди́н, одна́, одно́]
        answer: одна́
      - stem: У него́ ___ сын.
        options: [оди́н, одна́, одно́]
        answer: оди́н
      - stem: Вот ___ фо́то.
        options: [оди́н, одна́, одно́]
        answer: одно́
      - stem: У О́льги Ви́кторовны ___ соба́ки.
        options: [два, две]
        answer: две
      - stem: У Ю́ми ___ де́душки.
        options: [два, две]
        answer: два
      - stem: У них ___ ко́мнаты.
        options: [два, две]
        answer: две
      - stem: У Пье́ра ___ бра́та.
        options: [два, две]
        answer: два

  - id: e2
    type: fill
    task: 把括号里的名词变成正确的形式。
    why: 2–4 后面用单数第二格，5–20 后面用复数第二格。[челове́к]{.ru} 的复数第二格与单数第一格同形：[пять челове́к]{.ru}；2–4 后面是 [челове́ка]{.ru}。[час]{.ru} 的第二格重音在词尾：[два часа́]{.ru}。[дочь]{.ru} 的第二格是 [до́чери]{.ru}，词干多出 [-ер-]{.ru}，要单独记。
    items:
      - stem: три ___
        hint: брат
        accept: [бра́та]
      - stem: две ___
        hint: тётя
        accept: [тёти]
      - stem: четы́ре ___
        hint: челове́к
        accept: [челове́ка]
      - stem: пятна́дцать ___
        hint: челове́к
        accept: [челове́к]
      - stem: две ___
        hint: дочь
        accept: [до́чери]
      - stem: три ___
        hint: час
        accept: [часа́]
      - stem: два́дцать ___
        hint: час
        accept: [часо́в]
      - stem: две ___
        hint: сестра́
        accept: [сестры́]

  - id: e3
    type: fill
    task: 用俄语单词写出数字。
    why: 13–19 都以 [-на́дцать]{.ru} 结尾，重音在 [-на́-]{.ru} 上；[четы́рнадцать]{.ru} 例外，重音在 [ы]{.ru} 上。[пятна́дцать]{.ru}、[шестна́дцать]{.ru} 等去掉 [пять, шесть]{.ru} 的 [-ь]{.ru} 再加 [-на́дцать]{.ru}，不要写成 [пятьна́дцать]{.ru}。
    items:
      - stem: 14 — ___
        accept: [четы́рнадцать]
      - stem: 15 — ___
        accept: [пятна́дцать]
      - stem: 16 — ___
        accept: [шестна́дцать]
      - stem: 18 — ___
        accept: [восемна́дцать]
      - stem: 20 — ___
        accept: [два́дцать]

  - id: e4
    type: rewrite
    task: 按例句回答问题。
    placeholder: Нас … челове́к(а).
    example:
      cue: Ско́лько вас в семье́? (3)
      answer: Нас три челове́ка.
    why: 回答 [Ско́лько вас…?]{.ru} 用 [Нас…]{.ru}。2–4 后面用 [челове́ка]{.ru}，5 以上用 [челове́к]{.ru}。
    items:
      - cue: Ско́лько вас в семье́? (4)
        accept: [Нас четы́ре челове́ка.]
      - cue: Ско́лько вас в семье́? (5)
        accept: [Нас пять челове́к.]
      - cue: Ско́лько вас в гру́ппе? (12)
        accept: [Нас двена́дцать челове́к.]
      - cue: Ско́лько вас в гру́ппе? (17)
        accept: [Нас семна́дцать челове́к.]
      - cue: Ско́лько вас в семье́? (2)
        accept: [Нас два челове́ка.]

  - id: e5
    type: translate
    task: 译成俄语。
    why: 说“有几个”时，[у кого́]{.ru} 后面通常省去 [есть]{.ru}；数词后名词的形式按 1 / 2–4 / 5–20 的规则选择。
    items:
      - zh: 我有两个兄弟和一个姐妹。
        accept: ["У меня́ два бра́та и одна́ сестра́.", "У меня́ есть два бра́та и одна́ сестра́.", "У меня́ одна́ сестра́ и два бра́та.", "У меня́ есть одна́ сестра́ и два бра́та."]
        rubric: ["[два бра́та]{.ru}：2 后面用单数第二格", "[одна́ сестра́]{.ru}：阴性用 [одна́]{.ru}"]
      - zh: 我们班有十六个人。
        accept: ["В на́шей гру́ппе шестна́дцать челове́к.", "У нас в гру́ппе шестна́дцать челове́к.", "Нас в гру́ппе шестна́дцать челове́к.", "В гру́ппе у нас шестна́дцать челове́к.", "В на́шей гру́ппе шестна́дцать студе́нтов."]
        rubric: ["[шестна́дцать челове́к]{.ru}：5 以上用复数第二格 [челове́к]{.ru}"]
      - zh: 奶奶有三个儿子。
        accept: ["У ба́бушки три сы́на.", "У ба́бушки есть три сы́на."]
        rubric: ["[у ба́бушки]{.ru}", "[три сы́на]{.ru}：3 后面用单数第二格"]
      - zh: 你家有几口人？
        accept: ["Ско́лько вас в семье́?", "Ско́лько челове́к в ва́шей семье́?", "Ско́лько челове́к в твое́й семье́?", "Ско́лько челове́к у вас в семье́?", "Ско́лько челове́к у тебя́ в семье́?"]
        rubric: ["用 [Ско́лько вас в семье́?]{.ru} 或 [Ско́лько челове́к…]{.ru}，不要直译“有”"]

  - id: e6
    type: open
    task: 介绍你家有几口人。
    items:
      - prompt: 回答 [Ско́лько вас в семье́?]{.ru}，再说说你有哪些亲戚、各有几个（兄弟姐妹、叔叔阿姨、堂表兄弟姐妹等），用上 [оди́н / одна́]{.ru}、[два / две]{.ru} 和 5 以上的数字。
        length: 40–70
        model: |
          Нас четы́ре челове́ка: па́па, ма́ма, мла́дший брат и я. У па́пы оди́н брат и две сестры́. Э́то мой дя́дя и мои́ тёти. У ма́мы одна́ сестра́. А ещё у меня́ есть ба́бушка и два де́душки. Ка́ждое воскресе́нье мы обе́даем у ба́бушки. Тогда́ нас там двена́дцать челове́к!
        rubric: ["用 [Нас … челове́к(а)]{.ru} 回答家里几口人", "[оди́н / одна́]{.ru}、[два / две]{.ru} 与名词的性一致", "2–4 后用单数第二格，5 以上用 [челове́к]{.ru}"]
        notes: 范文先用 [Нас четы́ре челове́ка]{.ru} 回答总人数并列出家人，再按父亲一方、母亲一方介绍亲戚，最后用一句话说全家团聚的情景。数词后名词的形式是本题的批改重点。
