lesson: B2-L05
grammar: "年份：[Како́й сейча́с год?]{.ru}（第一格）、[В како́м году́?]{.ru}（[в]{.ru} + 第六格）、完整日期中的年份（第二格）；整十的序数词；[год, го́да, лет]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的序数词的正确形式填空。
    why: "年份只有最后一个词用序数词并变格。[в … году́]{.ru} 里序数词用第六格（[шесто́м, седьмо́м, восьмидеся́том, пе́рвом, восемна́дцатом]{.ru}）；回答 [Како́й сейча́с год?]{.ru} 用第一格（第 5 题 [седьмо́й]{.ru}）；完整日期“日 + 月 + 年”里年份用第二格，前面不加 [в]{.ru}（第 7 题 [шесто́го го́да]{.ru}）。第 3 题 [восьмидеся́тый]{.ru} 是整十的序数词，不要写成 [во́семьдесятом]{.ru}。"
    items:
      - stem: Ван Лэй роди́лся в две ты́сячи ___ году́.
        hint: шесто́й
        accept: ["шесто́м"]
      - stem: А́нна родила́сь в две ты́сячи ___ году́.
        hint: седьмо́й
        accept: ["седьмо́м"]
      - stem: Мари́я Никола́евна родила́сь в ты́сяча девятьсо́т ___ году́.
        hint: восьмидеся́тый
        accept: ["восьмидеся́том"]
      - stem: Ба́бушка родила́сь в ты́сяча девятьсо́т пятьдеся́т ___ году́.
        hint: пе́рвый
        accept: ["пе́рвом"]
      - stem: Сейча́с две ты́сячи два́дцать ___ год.
        hint: седьмо́й
        accept: ["седьмо́й"]
      - stem: Росси́я ста́ла жить по но́вому календарю́ в ты́сяча девятьсо́т ___ году́.
        hint: восемна́дцатый
        accept: ["восемна́дцатом"]
      - stem: Ван Лэй роди́лся двена́дцатого ма́я две ты́сячи ___ го́да.
        hint: шесто́й
        accept: ["шесто́го"]

  - id: e2
    type: choice
    task: 选择 [год, го́да]{.ru} 或 [лет]{.ru}。
    why: "看数词的最后一个词：[оди́н]{.ru} → [год]{.ru}（第 4 题），[два, три, четы́ре]{.ru} → [го́да]{.ru}（第 2、3 题），其他 → [лет]{.ru}。第 6 题 [четы́рнадцать]{.ru} 是一个词，属于 11–19，用 [лет]{.ru}，不要因为里面有 [четы́р-]{.ru} 就选 [го́да]{.ru}。"
    items:
      - stem: Ба́бушке се́мьдесят пять ___.
        options: ["год", "го́да", "лет"]
        answer: "лет"
      - stem: Мой брат жил в Москве́ два ___.
        options: ["год", "го́да", "лет"]
        answer: "го́да"
      - stem: Хосе́ два́дцать четы́ре ___.
        options: ["год", "го́да", "лет"]
        answer: "го́да"
      - stem: Пье́ру два́дцать оди́н ___.
        options: ["год", "го́да", "лет"]
        answer: "год"
      - stem: Ива́н Серге́евич рабо́тает на заво́де два́дцать пять ___.
        options: ["год", "го́да", "лет"]
        answer: "лет"
      - stem: Ми́ше четы́рнадцать ___.
        options: ["год", "го́да", "лет"]
        answer: "лет"

  - id: e3
    type: rewrite
    task: 按例句回答：他（她）是哪一年出生的？年份用文字写出。
    example:
      cue: Когда́ роди́лся Ван Лэй? (2006)
      answer: Ван Лэй роди́лся в две ты́сячи шесто́м году́.
    why: "[в]{.ru} + 序数词第六格 + [году́]{.ru}。前面的 [ты́сяча девятьсо́т]{.ru}、[две ты́сячи]{.ru} 不变，只有最后一个词变成序数词第六格。动词过去时和主语的性一致：女人用 [родила́сь]{.ru}。"
    items:
      - cue: Когда́ родила́сь А́нна? (2007)
        accept: ["А́нна родила́сь в две ты́сячи седьмо́м году́.", "В две ты́сячи седьмо́м году́ родила́сь А́нна."]
      - cue: Когда́ роди́лся Ми́ша? (2012)
        accept: ["Ми́ша роди́лся в две ты́сячи двена́дцатом году́.", "В две ты́сячи двена́дцатом году́ роди́лся Ми́ша."]
      - cue: Когда́ роди́лся Ива́н Серге́евич? (1977)
        accept: ["Ива́н Серге́евич роди́лся в ты́сяча девятьсо́т се́мьдесят седьмо́м году́.", "В ты́сяча девятьсо́т се́мьдесят седьмо́м году́ роди́лся Ива́н Серге́евич."]
      - cue: Когда́ родила́сь Мари́я Никола́евна? (1980)
        accept: ["Мари́я Никола́евна родила́сь в ты́сяча девятьсо́т восьмидеся́том году́.", "В ты́сяча девятьсо́т восьмидеся́том году́ родила́сь Мари́я Никола́евна."]
      - cue: Когда́ родила́сь ба́бушка? (1951)
        accept: ["Ба́бушка родила́сь в ты́сяча девятьсо́т пятьдеся́т пе́рвом году́.", "В ты́сяча девятьсо́т пятьдеся́т пе́рвом году́ родила́сь ба́бушка."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“在某年”用 [в … году́]{.ru}，说话人是女性时用 [родила́сь]{.ru}。第 2 题“今年是……”用第一格。第 3 题年龄用第三格 + [лет]{.ru}。第 4 题年月日都有，全部用第二格，不加 [в]{.ru}。第 5 题“同一年”是 [в одно́м году́]{.ru}。"
    items:
      - zh: 我是 2006 年出生的。
        accept: ["Я роди́лся в две ты́сячи шесто́м году́.", "Я родила́сь в две ты́сячи шесто́м году́."]
        rubric: ["[в две ты́сячи шесто́м году́]{.ru}：序数词第六格 + [году́]{.ru}", "[роди́лся / родила́сь]{.ru} 和说话人的性一致"]
      - zh: 今年是 2027 年。
        accept: ["Сейча́с две ты́сячи два́дцать седьмо́й год.", "Э́тот год — две ты́сячи два́дцать седьмо́й."]
        rubric: ["第一格：[две ты́сячи два́дцать седьмо́й год]{.ru}"]
      - zh: 奶奶七十五岁。
        accept: ["Ба́бушке се́мьдесят пять лет."]
        rubric: ["[ба́бушке]{.ru}：第三格", "[се́мьдесят пять лет]{.ru}"]
      - zh: 王磊生于 2006 年 5 月 12 日。
        accept: ["Ван Лэй роди́лся двена́дцатого ма́я две ты́сячи шесто́го го́да.", "Двена́дцатого ма́я две ты́сячи шесто́го го́да роди́лся Ван Лэй."]
        rubric: ["日、月、年都用第二格：[двена́дцатого ма́я две ты́сячи шесто́го го́да]{.ru}", "不加 [в]{.ru}"]
      - zh: 我和他是同一年出生的。
        accept: ["Мы с ним роди́лись в одно́м году́.", "Мы с ним родили́сь в одно́м году́."]
        rubric: ["[мы с ним]{.ru}“我和他”，动词用复数", "[в одно́м году́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что де́лали Ива́н Серге́евич и Ван Лэй вчера́? О чём Ван Лэй рассказа́л за у́жином? В како́м году́ родили́сь Ми́ша, А́нна и Ван Лэй и како́й у них знак? Како́й сейча́с год по кита́йскому календарю́? Что сказа́л Ми́ша по́сле у́жина?]{.ru}"
        length: 50–80
        model: "Вчера́ был пра́здник, и Ива́н Серге́евич и Ван Лэй игра́ли в кита́йские ша́хматы. За у́жином Ван Лэй рассказа́л о восто́чном календаре́: у ка́ждого го́да есть свой знак. Ми́ша роди́лся в две ты́сячи двена́дцатом году́, он — Драко́н. А́нна родила́сь в две ты́сячи седьмо́м году́, она́ — Свинья́. Ван Лэй и Ди́ма родили́сь в две ты́сячи шесто́м году́, в год Соба́ки. Сейча́с год Козы́. Ми́ша сказа́л, что че́рез де́вять лет опя́ть бу́дет год Драко́на."
        rubric: ["回答全部五个问题", "年份用 [в … году́]{.ru}，序数词第六格写对", "[че́рез де́вять лет]{.ru}"]
        notes: "范文约 75 词。每个人用“出生年份 + 属相”两部分，结构一致，读起来清楚。王磊和迪马合成一句，动词用复数 [родили́сь]{.ru}。米沙的话改成间接引语 [сказа́л, что…]{.ru}，人称不变。"
