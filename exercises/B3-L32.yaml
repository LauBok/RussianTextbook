lesson: B3-L32
grammar: "同等成分与概括词：同等成分同格，用逗号、[и]{.ru}、[и … и]{.ru}、[а]{.ru}、[но]{.ru}、[не только … но и]{.ru} 连接；概括词在前用冒号，在后用破折号，同等成分后句子未完再加破折号。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Когда название Москвы впервые встречается в летописи? Что произошло с русскими землями в XIII веке? Какие причины помогли Москве объединить русские земли? Что сделали для Москвы Иван Калита и Дмитрий Донской? Кто такой Андрей Рублёв? Какие события произошли при Иване III?]{.ru}"
        length: 90–120
        model: "Впервые название Москвы встречается в летописи под 1147 годом. В XIII веке войска хана Батыя разорили многие русские города. Русские земли попали в зависимость от Золотой Орды. Москве помогли три причины: выгодное положение, политика московских князей и поддержка церкви. Иван Калита собирал дань для хана, покупал новые земли, и при нём в Москву переехал митрополит. Дмитрий построил Кремль из белого камня и в 1380 году разбил армию Мамая на Куликовом поле. Андрей Рублёв — иконописец, который в начале XV века расписывал кремлёвские соборы; его икона «Троица» хранится в Третьяковской галерее. При Иване III к Москве присоединили Новгород и Тверь, Русь освободилась от власти Орды, а итальянские мастера построили новые стены Кремля. В 1497 году появился Судебник — первый свод законов единого государства."
        rubric: ["六个问题都回答，年份准确：1147、1380、1497", "第 3 题用概括词加冒号列举三个原因，同等成分同格", "用完整的句子"]
        notes: '第 3 题最好用概括词：[Москве помогли три причины: …]{.ru}，冒号后三个名词都是第一格，和 [причины]{.ru} 一致。如果写 [Историки называют три причины: …]{.ru}，冒号后就要用第四格：[политику]{.ru}、[поддержку]{.ru}。'

  - id: e2
    type: choice
    task: 选择空白处应当用的标点。
    why: "看概括词的位置。第 1 题概括词 [города]{.ru} 在前，同等成分在后，句子到同等成分就结束，用冒号。第 2 题同等成分在前，概括词 [всё это]{.ru} 在后，用破折号。第 3 题概括词 [везде]{.ru} 在前，列举之后句子还没完（[строили храмы]{.ru}），所以列举前用冒号、列举后用破折号；本题空在列举之前，填冒号。第 4 题与第 3 题是同一个句子，空在列举之后，填破折号。第 5 题 [и Новгород, и Тверь]{.ru} 是重复的 [и … и]{.ru}，第二个 [и]{.ru} 前要加逗号。"
    items:
      - stem: "Батый разорил многие города ___ Рязань, Владимир, Киев."
        options: ["冒号", "破折号", "逗号"]
        answer: "冒号"
      - stem: "Стены, башни, соборы ___ всё это можно увидеть в Кремле."
        options: ["冒号", "破折号", "逗号"]
        answer: "破折号"
      - stem: "Везде ___ в Москве, в Твери, в Новгороде — строили храмы."
        options: ["冒号", "破折号", "逗号"]
        answer: "冒号"
      - stem: "Везде: в Москве, в Твери, в Новгороде ___ строили храмы."
        options: ["冒号", "破折号", "逗号"]
        answer: "破折号"
      - stem: "Иван III присоединил к Москве и Новгород ___ и Тверь."
        options: ["冒号", "破折号", "逗号"]
        answer: "逗号"

  - id: e3
    type: fill
    task: 把括号里的词变成适当的形式，使同等成分与概括词同格。
    why: "同等成分的格由支配它们的词决定，和概括词一致。第 1 题 [называют]{.ru} 要求第四格，阴性 [поддержка → поддержку]{.ru}。第 2 题 [защищали]{.ru} 的主语是第一格，[реки]{.ru} 复数第一格。第 3 题 [из многих земель]{.ru} 第二格，同等成分 [из Москвы, из Владимира, из]{.ru} 后面也用第二格：[Рязани]{.ru}。第 4 题 [присоединил]{.ru} 要求第四格，[Тверь]{.ru} 第四格与第一格同形。第 5 题 [в трёх городах]{.ru} 第六格，[в Новгороде]{.ru}。最容易错的是第 1 题：冒号后面习惯性地用第一格，写成 [поддержка]{.ru}。"
    items:
      - stem: "Историки называют несколько причин: выгодное положение, политику князей и ___ церкви."
        hint: поддержка
        accept: ["поддержку"]
      - stem: "Москву защищали леса, ___ и другие княжества."
        hint: река
        accept: ["реки"]
      - stem: "Дмитрий собрал войска из многих земель: из Москвы, из Владимира, из ___."
        hint: Рязань
        accept: ["Рязани"]
      - stem: "Иван III присоединил к Москве и Новгород, и ___."
        hint: Тверь
        accept: ["Тверь"]
      - stem: "Храмы строили в трёх городах: в Москве, в Твери и в ___."
        hint: Новгород
        accept: ["Новгороде"]

  - id: e4
    type: rewrite
    task: 按括号里的要求，把两句话合成一句，用同等成分。
    example:
      cue: "Москва стала политическим центром. Москва стала церковным центром. (не только … но и)"
      answer: "Москва стала не только политическим, но и церковным центром."
    why: "合并时相同的部分只说一次，不同的部分变成同等成分，格保持不变。第 1 题用 [и … и]{.ru}，第二个 [и]{.ru} 前加逗号。第 2 题 [не только … но и]{.ru} 两部分对称地放在两个补语前面：[не только земли, но и города]{.ru}；[но и]{.ru} 前加逗号。第 3 题用对别连接词 [а]{.ru}，前面加逗号；否定的部分放在后面：[а не]{.ru}。第 4 题两个谓语共用主语，单个 [и]{.ru} 前不加逗号。"
    items:
      - cue: "Иван III присоединил Новгород. Иван III присоединил Тверь. (и … и)"
        accept: ["Иван III присоединил и Новгород, и Тверь."]
      - cue: "Калита покупал земли. Калита покупал города. (не только … но и)"
        accept: ["Калита покупал не только земли, но и города."]
      - cue: "Русские земли объединила Москва. Их объединил не Киев. (а не)"
        accept: ["Русские земли объединила Москва, а не Киев.", "Москва, а не Киев, объединила русские земли."]
      - cue: "Дмитрий собрал войска. Дмитрий разбил армию Мамая. (и)"
        accept: ["Дмитрий собрал войска и разбил армию Мамая."]

  - id: e5
    type: translate
    task: 翻译下列句子，注意同等成分的格和标点。
    items:
      - zh: 金帐汗国的军队洗劫了许多城市：梁赞、弗拉基米尔和基辅。
        accept: ["Войска Золотой Орды разорили многие города: Рязань, Владимир и Киев.", "Войска Орды разорили многие города: Рязань, Владимир и Киев.", "Войска Золотой Орды разорили много городов: Рязань, Владимир и Киев.", "Войска Орды разорили много городов: Рязань, Владимир и Киев."]
        rubric: ["概括词 [города]{.ru} 在前，后面用冒号", "同等成分与概括词同为第四格", "单个 [и]{.ru} 前不加逗号"]
      - zh: 城墙、塔楼、教堂——这一切都是意大利工匠修建的。
        accept: ["Стены, башни, соборы — всё это построили итальянские мастера.", "Стены, башни, соборы — всё это было построено итальянскими мастерами.", "Стены, башни, соборы — всё это строили итальянские мастера.", "Стены, башни, соборы — всё это построено итальянскими мастерами."]
        rubric: ["概括词 [всё это]{.ru} 在同等成分后面，前面用破折号", "述位 [итальянские мастера]{.ru} 放在句末"]
      - zh: 莫斯科不仅成了政治中心，而且成了宗教中心。
        accept: ["Москва стала не только политическим, но и церковным центром.", "Москва стала не только политическим центром, но и церковным."]
        rubric: ["[не только … но и]{.ru} 对称地放在两个同等定语前", "[но и]{.ru} 前加逗号", "[стать чем]{.ru} 用第五格"]

  - id: e6
    type: open
    task: 叙述段落。按时间顺序叙述莫斯科从一座小要塞成长为国家首都的过程。
    items:
      - prompt: "按时间顺序写一段话：1147 年；13 世纪的拔都入侵；伊凡·卡利塔；德米特里·顿斯科伊与 1380 年；伊凡三世与 1480 年；1547 年。至少用一处概括词加冒号的列举、一处 [не только … но и]{.ru} 或 [и … и]{.ru}。"
        length: 150–200
        model: "Впервые название Москвы встречается в летописи под 1147 годом. Тогда это была маленькая крепость на границе Ростово-Суздальской земли. В XIII веке войска хана Батыя разорили многие русские города: Рязань, Владимир, Киев и другие. Русские земли попали в зависимость от Золотой Орды и почти два с половиной века платили ей дань. Князья должны были ездить к хану за ярлыком. В XIV веке московский князь Иван Калита получил право собирать дань для хана. Он покупал не только земли, но и сёла и города, а при нём в Москву переехал митрополит. Его внук Дмитрий построил Кремль из белого камня, а в 1380 году разбил армию Мамая на Куликовом поле. После этой победы князя стали называть Дмитрием Донским. Главный этап объединения пришёлся на время правления Ивана III. Он присоединил к Москве и Новгород, и Тверь. В 1480 году войска Ивана III и хана Ахмата стояли на реке Угре, но битва так и не началась. Хан увёл войска, и Русь освободилась от власти Орды. Наконец, в 1547 году Иван IV венчался на царство. Так Москва стала столицей Русского государства."
        rubric: ["六个时间点都写到，顺序正确，年份准确", "至少一处概括词加冒号，同等成分与概括词同格", "至少一处 [не только … но и]{.ru} 或 [и … и]{.ru}，逗号正确", "每句以时间状语或已知信息开头", "150–200 词"]
        notes: "范文约 165 词。每个阶段一两句，开头都是时间：[под 1147 годом]{.ru}、[В XIII веке]{.ru}、[В XIV веке]{.ru}、[в 1380 году]{.ru}、[В 1480 году]{.ru}、[в 1547 году]{.ru}；[Наконец]{.ru}（最后）提示叙述进入最后一步。概括词句 [многие русские города: Рязань, Владимир, Киев и другие]{.ru} 用来压缩细节。卡利塔是 1325 年起执政的，所以写 [В XIV веке]{.ru}。"
