lesson: B2-L22
grammar: "[весь]{.ru} 的单复数各格；[сам]{.ru}（自己，亲自；本人）的变格和用法；[са́мый]{.ru} 表示“正……，紧……；一直到……”；[сам]{.ru} 与 [себя́]{.ru}、[сам]{.ru} 与 [са́мый]{.ru} 的区别。"
exercises:

  - id: e1
    type: fill
    task: 用 [весь]{.ru} 的正确形式填空。
    why: "[весь]{.ru} 跟名词一致。第 1 题 [мир]{.ru} 阳性第一格 → [весь]{.ru}；第 2 题 [по]{.ru} + 第三格 → [всему́]{.ru}；第 3 题复数第三格 → [всем]{.ru}；第 4 题 [в]{.ru} + 复数第六格 → [всех]{.ru}，[в]{.ru} 写成 [во]{.ru}；第 5 题 [страна́]{.ru} 阴性 → [вся]{.ru}；第 6 题 [всё]{.ru} 单独用作“一切”，第六格 [всём]{.ru}，前面的 [о]{.ru} 写成 [обо]{.ru}；第 7 题指人的复数第四格同第二格 → [всех]{.ru}。"
    items:
      - stem: ___ мир узна́л о Гага́рине.
        hint: весь
        accept: ["Весь"]
      - stem: Мы ходи́ли по ___ музе́ю.
        hint: весь
        accept: ["всему́"]
      - stem: Ван Лэй рассказа́л ___ друзья́м о Кита́е.
        hint: весь
        accept: ["всем"]
      - stem: Гага́рина зна́ют во ___ стра́нах.
        hint: весь
        accept: ["всех"]
      - stem: ___ страна́ была́ на у́лицах.
        hint: весь
        accept: ["Вся"]
      - stem: Ве́чером мы говори́ли обо ___.
        hint: всё
        accept: ["всём"]
      - stem: Ми́ша поздра́вил с пра́здником ___ свои́х друзе́й.
        hint: весь
        accept: ["всех"]

  - id: e2
    type: fill
    task: 用 [сам]{.ru} 的正确形式填空。
    why: "[сам]{.ru} 和它说明的人一致：第 1 题 [Ми́ша]{.ru} → [сам]{.ru}；第 2 题 [А́нна]{.ru} → [сама́]{.ru}；第 3 题 [мы]{.ru} → [са́ми]{.ru}；第 4 题 [с]{.ru} + 第五格，[дире́ктором]{.ru} 阳性 → [сами́м]{.ru}；第 5 题 [звони́ть]{.ru} + 第三格，[О́льге Ви́кторовне]{.ru} 阴性 → [само́й]{.ru}。除第一格复数 [са́ми]{.ru} 外，重音都在词尾。"
    items:
      - stem: Ми́ша ___ сде́лал раке́ту.
        hint: сам
        accept: ["сам"]
      - stem: А́нна ___ пригото́вила у́жин.
        hint: сам
        accept: ["сама́"]
      - stem: Не говори́ нам, мы ___ всё узна́ем.
        hint: сам
        accept: ["са́ми"]
      - stem: В музе́е мы говори́ли с ___ дире́ктором.
        hint: сам
        accept: ["сами́м"]
      - stem: Позвони́ ___ О́льге Ви́кторовне, она́ всё зна́ет.
        hint: сам
        accept: ["само́й"]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1、3、5 题是表示地点或时间的“正、紧、一直到”，用 [са́мый]{.ru}（重音在词干）。第 2 题“迪马本人”，用 [сам]{.ru} 的第四格 [самого́]{.ru}（重音在词尾）。第 4 题“自己（动手）买”说明谁做了动作，用 [сам]{.ru}；买给谁已经由 [себе́]{.ru} 说出了。"
    items:
      - stem: Музе́й нахо́дится под ___ па́мятником.
        options: [са́мым, сами́м]
        answer: са́мым
      - stem: Я спроси́л об э́том ___ Ди́му.
        options: [са́мого, самого́]
        answer: самого́
      - stem: Мы ждём тебя́ с ___ утра́.
        options: [са́мого, самого́]
        answer: са́мого
      - stem: Ми́ша ___ купи́л себе́ но́вый мяч.
        options: [сам, себя́]
        answer: сам
      - stem: Их дом нахо́дится в ___ це́нтре го́рода.
        options: [са́мом, само́м]
        answer: са́мом

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“全城的人”用 [весь го́род]{.ru}。第 2 题“自己做的”用 [сама́]{.ru}，和 [А́нна]{.ru} 一致。第 3 题“一直到傍晚”用 [до са́мого ве́чера]{.ru}。第 4 题“所有的朋友”是复数第三格 [всем друзья́м]{.ru}。第 5 题 [стать / быть]{.ru} 后用第五格。"
    items:
      - zh: 全城的人都知道这件事。
        accept: ["Об э́том зна́ет весь го́род.", "Весь го́род зна́ет об э́том.", "Весь го́род об э́том зна́ет."]
        rubric: ["[весь го́род]{.ru} 作主语，谓语用单数 [зна́ет]{.ru}", "[об э́том]{.ru}"]
      - zh: 这顿晚饭是安娜自己做的。
        accept: ["Э́тот у́жин А́нна пригото́вила сама́.", "А́нна сама́ пригото́вила э́тот у́жин.", "Э́тот у́жин А́нна сама́ пригото́вила.", "А́нна сама́ пригото́вила у́жин.", "У́жин А́нна пригото́вила сама́.", "У́жин А́нна сама́ пригото́вила."]
        rubric: ["[сама́]{.ru}：与 [А́нна]{.ru} 一致", "[пригото́вить у́жин]{.ru}"]
      - zh: 我们一直散步到傍晚。
        accept: ["Мы гуля́ли до са́мого ве́чера.", "Мы до са́мого ве́чера гуля́ли.", "До са́мого ве́чера мы гуля́ли."]
        rubric: ["[до са́мого ве́чера]{.ru}：[са́мый]{.ru} 的第二格，重音在词干"]
      - zh: 他给所有的朋友都打了电话。
        accept: ["Он позвони́л всем друзья́м.", "Он позвони́л всем свои́м друзья́м.", "Он всем друзья́м позвони́л.", "Он всем свои́м друзья́м позвони́л."]
        rubric: ["[всем друзья́м]{.ru}：复数第三格", "[друзья́]{.ru} 的复数第三格是 [друзья́м]{.ru}"]
      - zh: 加加林是第一个进入太空的人。
        accept: ["Гага́рин был пе́рвым челове́ком в ко́смосе.", "Гага́рин стал пе́рвым челове́ком в ко́смосе.", "Пе́рвым челове́ком в ко́смосе был Гага́рин.", "Пе́рвым челове́ком в ко́смосе стал Гага́рин."]
        rubric: ["[пе́рвым челове́ком]{.ru}：[быть / стать]{.ru} 后用第五格", "[в ко́смосе]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й пра́здник быва́ет двена́дцатого апре́ля и почему́? Куда́ пое́хали Ван Лэй, Ди́ма и Ми́ша? Что Ми́ша взял с собо́й? Что они́ уви́дели в музе́е? Кем хо́чет стать Ми́ша? Что рассказа́л друзья́м Ван Лэй?]{.ru}"
        length: 50–80
        model: "Двена́дцатого апре́ля — День космона́втики. В э́тот день Ю́рий Гага́рин соверши́л пе́рвый полёт в ко́смос, и о нём узна́л весь мир. Ван Лэй, Ди́ма и Ми́ша пое́хали в Музе́й космона́втики. Ми́ша взял с собо́й раке́ту. Он сам сде́лал её в шко́ле. В музе́е они́ уви́дели Бе́лку и Стре́лку. Ми́ша хо́чет стать лётчиком, а пото́м космона́втом. Ван Лэй рассказа́л друзья́м о пе́рвом кита́йском космона́вте."
        rubric: ["回答全部六个问题", "用对 [весь мир]{.ru}、[сам]{.ru}", "[стать]{.ru} 后用第五格"]
        notes: 范文约 70 词。第一句点明节日，第二句说明原因，用 [и]{.ru} 连起来。[сам сде́лал]{.ru} 强调火箭是米沙亲手做的。

  - id: e6
    type: open
    task: 作文。写一写你们国家的一个节日：全城（全国）的人怎样过这个节日，你自己通常做什么，今年你是怎么过的。
    items:
      - prompt: 写 100–150 词。[весь]{.ru}、[сам]{.ru}、[са́мый]{.ru}（“正……，一直到……”的意思）各至少用一次。
        length: 100–150
        model: "Гла́вный пра́здник в Кита́е — Пра́здник весны́. Он быва́ет зимо́й, в конце́ января́ и́ли в феврале́. Пе́ред пра́здником лю́ди е́дут домо́й со всей страны́: все хотя́т быть вме́сте с семьёй. Вся страна́ в э́ти дни отдыха́ет. В после́дний ве́чер ста́рого го́да вся семья́ сиди́т за столо́м, смо́трит телеви́зор и ест пельме́ни. У нас до́ма пельме́ни де́лают са́ми, никто́ их не покупа́ет. Мой де́душка всегда́ сам гото́вит мя́со для пельме́ней, а я ему́ помога́ю. Мы не спим до са́мого утра́, а в по́лночь на у́лице всё гори́т и шуми́т. Сам пра́здник продолжа́ется две неде́ли. В э́том году́ я встреча́л пра́здник в Пеки́не вме́сте со всей семьёй, а пото́м верну́лся в Москву́. Ру́сские друзья́ спра́шивали меня́ обо всём: что мы е́ли, что де́лали, что дари́ли."
        rubric: ["说明节日的时间和习俗", "[весь]{.ru} 至少一次，格用对", "[сам]{.ru} 至少一次，与所说明的人一致", "[са́мый]{.ru} 表示“一直到、正”至少一次", "100–150 词"]
        notes: 范文先介绍节日（时间、全国的人怎么过），再写自己家，最后写今年。[весь]{.ru} 用了六次（[со всей страны́, все, вся страна́, вся семья́, со всей семьёй, обо всём]{.ru}），[сам]{.ru} 用了三次，[до са́мого утра́]{.ru} 是本课学的 [са́мый]{.ru}。[Сам пра́здник]{.ru} 的 [сам]{.ru} 表示“节日本身”。
