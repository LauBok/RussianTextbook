lesson: B3-L25
grammar: "形容词后缀：[-ск- (-еск-)]{.ru}（属于某人某地），[-н- (-янн-)]{.ru}（与某物有关、材料、时间地点），[-ов- (-ев-)]{.ru}（材料、关系），[-лив- (-чив-)]{.ru}（经常具有的特点）；辅音交替 [г → ж, к → ч, ц → ч]{.ru}；关系形容词与性质形容词。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как здороваются русские мужчины и женщины? Почему нельзя здороваться через порог? Что значит выражение «держать фигу в кармане»? Почему русские мало улыбаются незнакомым людям? Что делать иностранцу, если он по ошибке сделал не тот жест?]{.ru}"
        length: 60–90
        model: "Русские мужчины при встрече пожимают друг другу руки, и рукопожатие должно быть крепким. Женщины обычно рук не пожимают, а близкие подруги могут обняться. Через порог не здороваются из-за старой приметы, и многие помнят о ней, даже не веря в приметы. «Держать фигу в кармане» значит на словах соглашаться, а в душе оставаться несогласным. Русские мало улыбаются незнакомым людям, потому что улыбка для них — знак личного, дружеского отношения. Улыбка без причины может показаться неискренней. Если иностранец по ошибке сделал не тот жест, достаточно улыбнуться и извиниться."
        rubric: ["五个问题都回答，内容与课文一致", "[пожимать руки]{.ru}（第四格）与 [пожимать плечами]{.ru}（第五格）不混", "至少用两个本课带后缀的形容词（[личный, дружеский, молчаливый]{.ru} 等）"]
        notes: 第 2 题课文没有说出原因，只说是“古老的迷信”；可以补充注释里的说法（门槛是分界）。第 4 题要用课文里的解释：微笑表示个人的、友好的态度。

  - id: e2
    type: fill
    task: 由括号里的词构成形容词，用正确的形式填空。
    why: "第 1 题 [друг]{.ru} + [-еск-]{.ru}，[г]{.ru} 变 [ж]{.ru}：[дружеский]{.ru}，与 [жест]{.ru} 一致用阳性第一格。第 2 题 [дерево]{.ru} 表示材料，用 [-янн-]{.ru}：[деревянному]{.ru}，[по]{.ru} 后第三格。第 3 题 [молчать]{.ru} + [-лив-]{.ru}：[молчаливый]{.ru}。第 4 题 [дело]{.ru} + [-ов-]{.ru}，词尾重读：[деловые]{.ru}，复数第一格。第 5 题 [лицо]{.ru} + [-н-]{.ru}，[ц]{.ru} 变 [ч]{.ru}：[личного]{.ru}，第二格。第 6 题 [дождь]{.ru} + [-лив-]{.ru}：[дождливая]{.ru}，与 [осень]{.ru} 一致。"
    items:
      - stem: Улыбка — это ___ жест.
        hint: друг
        accept: ["дружеский"]
      - stem: Он постучал по ___ столу.
        hint: дерево
        accept: ["деревянному"]
      - stem: Мой брат — ___ человек, он редко говорит.
        hint: молчать
        accept: ["молчаливый"]
      - stem: В Москву приехали ___ люди из Китая.
        hint: дело
        accept: ["деловые"]
      - stem: Улыбка — знак ___ отношения.
        hint: лицо
        accept: ["личного"]
      - stem: В этом году была очень ___ осень.
        hint: дождь
        accept: ["дождливая"]

  - id: e3
    type: rewrite
    task: 用形容词改写词组。
    example:
      cue: жест друга
      answer: дружеский жест
    why: "第二格或 [из]{.ru} + 第二格的词组常可换成形容词 + 名词。第 1 题 [человек → человеческий]{.ru}，[к]{.ru} 变 [ч]{.ru}。第 2 题材料：[дерево → деревянный]{.ru}。第 3 题 [лес → лесной]{.ru}，词尾重读，与 [дорога]{.ru} 一致：[лесная]{.ru}。第 4 题 [берёза → берёзовый]{.ru}，与 [сок]{.ru} 一致：[берёзовый сок]{.ru}（白桦汁，俄罗斯春天的传统饮料）。第 5 题 [речь → речевой]{.ru}：[ч]{.ru} 后的后缀不重读（重音在词尾），写 [-ев-]{.ru}：[речевое поведение]{.ru}。"
    items:
      - cue: Жизнь человека
        accept: ["Человеческая жизнь"]
      - cue: Дом из дерева
        accept: ["Деревянный дом"]
      - cue: Дорога в лесу
        accept: ["Лесная дорога"]
      - cue: Сок берёзы
        accept: ["Берёзовый сок"]
      - cue: Поведение в речи
        accept: ["Речевое поведение"]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [рукопожатие]{.ru} 是中性（[-ние]{.ru} 名词），形容词用中性 [мужское]{.ru}；[мужской]{.ru} 词尾重读，原形写 [-ской]{.ru}。第 2 题 [деревянный]{.ru} 是关系形容词，没有比较级，所以不能说 [более деревянный]{.ru}；能比较的是性质形容词 [молчаливее]{.ru}。第 3 题 [терпеливый]{.ru} 是性质形容词，有短尾：[терпелив]{.ru}。第 4 题 [пожимать плечами]{.ru} 用第五格。"
    items:
      - stem: Крепкое ___ рукопожатие.
        options: [мужское, мужской, мужская]
        answer: мужское
      - stem: Сестра ___ брата.
        options: [молчаливее, деревяннее, деловее]
        answer: молчаливее
      - stem: Учитель должен быть ___.
        options: [терпелив, терпеливо, терпеливом]
        answer: терпелив
      - stem: Он ничего не ответил, только пожал ___.
        options: [плечи, плечами, плечах]
        answer: плечами

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 戴着手套伸手被认为是不礼貌的。
        accept: ["Подать руку в перчатке считается невежливым.", "Протягивать руку в перчатке считается невежливым."]
        rubric: ["不定式短语作主语", "[считаться]{.ru} 后用第五格：[невежливым]{.ru}"]
      - zh: 在俄罗斯文化里，微笑是个人的、友好的态度的标志。
        accept: ["В русской культуре улыбка — знак личного, дружеского отношения.", "В русской культуре улыбка — это знак личного, дружеского отношения.", "В русской культуре улыбка — признак личного, дружеского отношения.", "В русской культуре улыбка является знаком личного, дружеского отношения."]
        rubric: ["[личного, дружеского]{.ru}：形容词第二格与 [отношения]{.ru} 一致", "[дружеский]{.ru} 由 [друг]{.ru} 构成，[г → ж]{.ru}"]
      - zh: 沉默寡言的人不一定在生气。
        accept: ["Молчаливый человек не обязательно сердитый.", "Молчаливый человек не обязательно сердится.", "Молчаливый человек не всегда сердитый.", "Молчаливый человек не всегда сердится."]
        rubric: ["[молчаливый]{.ru}：[-лив-]{.ru} 形容词", "[не обязательно]{.ru} 或 [не всегда]{.ru}"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[Язык жестов у каждого народа свой.]{.ru} 比较俄罗斯和中国的两三个手势或交际习惯（握手、微笑、指人、竖大拇指等），至少用四个本课带后缀的形容词。"
        length: 140–160
        model: "Язык жестов у каждого народа свой. Возьмём, например, рукопожатие. Русские мужчины при встрече обязательно пожимают друг другу руки, и рукопожатие должно быть крепким. В Китае рукопожатие тоже обычное дело, но оно бывает мягче, а пожилые люди иногда просто здороваются словами. Ещё интереснее улыбка. В Китае улыбаются и незнакомым людям: это вежливо и по-дружески. А в России улыбка — знак личного отношения, поэтому продавец в магазине может показаться иностранцу сердитым, хотя он просто серьёзный. Иностранцу трудно понять, почему молчаливый человек в метро не отвечает на его улыбку. Есть и общие правила. И в России, и в Китае детям объясняют, что показывать пальцем на людей некрасиво. Поднятый большой палец и там, и здесь означает «отлично». Однако даже маленький жест может стать причиной большой ошибки. Поэтому деловому человеку, который едет в другую страну, полезно заранее узнать местный язык жестов, чтобы его дружеская улыбка или крепкое рукопожатие были поняты правильно."
        rubric: ["第一句是给定的主题句", "至少两组比较，有异有同", "至少四个本课带后缀的形容词（[личный, дружеский, деловой, сердитый, молчаливый]{.ru} 等），一致关系正确", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 例一（握手：不同）→ 例二（微笑：不同，最有意思，用 [Ещё интереснее]{.ru} 引出）→ 例三（指人、竖大拇指：相同，用 [Есть и общие правила]{.ru} 转折）→ 收束句（给出建议）。比较时常用 [и… и…]{.ru}、[и там, и здесь]{.ru}、[а в России…]{.ru}。
