lesson: B2-L65
grammar: "[пусть]{.ru} + 第三人称形式；[дава́й(те)]{.ru} + 完成体将来时第一人称复数 / 未完成体不定式；[дава́й(те) я]{.ru} + 第一人称单数；[не бу́дем]{.ru} + 不定式。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句用 [пусть]{.ru} 回答，表示同意。
    example:
      cue: "Ми́ша хо́чет пойти́ на ре́чку."
      answer: "Пусть идёт!"
    why: "[пусть]{.ru} 后面用第三人称形式，人称和数跟主语一致：一个人用 [идёт, спит]{.ru}，几个人用 [иду́т, гуля́ют]{.ru}。原句的 [хо́чет]{.ru} + 不定式变成 [пусть]{.ru} + 变位动词，[хоте́ть]{.ru} 本身不保留。第 1 题 [пойти́]{.ru} 对应 [идёт]{.ru} 或 [пойдёт]{.ru} 都可以。第 4 题 [пусть]{.ru} 后面的完成体将来时 [посмо́трит]{.ru}、未完成体 [смо́трит]{.ru} 都对，意思稍有差别：前者是看一次，后者是让他看着吧。"
    items:
      - cue: "Ребя́та хотя́т пойти́ в лес."
        accept: ["Пусть иду́т!", "Пусть пойду́т!"]
      - cue: "Ми́ша хо́чет спать на чердаке́."
        accept: ["Пусть спит!", "Пусть спит на чердаке́!"]
      - cue: "Де́ти хотя́т гуля́ть до десяти́."
        accept: ["Пусть гуля́ют!", "Пусть гуля́ют до десяти́!"]
      - cue: "Ван Лэй хо́чет посмотре́ть огоро́д."
        accept: ["Пусть посмо́трит!", "Пусть смо́трит!", "Пусть посмо́трит огоро́д!"]
      - cue: "А́нна хо́чет отдыха́ть."
        accept: ["Пусть отдыха́ет!"]

  - id: e2
    type: fill
    task: 用括号里的动词的正确形式填空。
    why: "[дава́й(те)]{.ru} 接完成体时用将来时第一人称复数（第 1、2 题 [пообе́даем, пойдём]{.ru}），接未完成体时用不定式（第 3 题 [полива́ть]{.ru}）。第 4 题 [дава́йте я]{.ru} 后面用第一人称单数 [помогу́]{.ru}。第 5 题 [пусть]{.ru} 后面用第三人称 [принесёт]{.ru}。第 6 题否定的提议用 [не бу́дем]{.ru} + 未完成体不定式，不能用完成体。"
    items:
      - stem: "Дава́йте снача́ла ___, а пото́м пойдём на ре́чку."
        hint: пообе́дать
        accept: ["пообе́даем"]
      - stem: "Дава́й ___ к ба́бушке на электри́чке."
        hint: пое́хать
        accept: ["пое́дем"]
      - stem: "Дава́й ___ гря́дки вме́сте ка́ждый ве́чер."
        hint: полива́ть
        accept: ["полива́ть"]
      - stem: "Дава́йте я вам ___."
        hint: помо́чь
        accept: ["помогу́"]
      - stem: "Ми́ша пусть ___ воды́ из коло́дца."
        hint: принести́
        accept: ["принесёт"]
      - stem: "Дава́й не бу́дем ___ об э́том."
        hint: говори́ть
        accept: ["говори́ть"]

  - id: e3
    type: choice
    task: 选择正确的说法。
    why: "第 1 题是咱们一起做，用 [дава́й]{.ru} + 第一人称复数。第 2 题让第三者（米沙）做，用 [пусть]{.ru}。第 3 题说话人自己做，用 [дава́й я]{.ru} + 第一人称单数。第 4 题 [вам]{.ru} 说明说话人对奶奶用 [вы]{.ru}（王磊就这样称呼奶奶），所以用 [дава́йте]{.ru}；米沙、安娜对奶奶用 [ты]{.ru}，说 [дава́й]{.ru}。第 5 题是祝愿，用 [пусть]{.ru}。"
    items:
      - stem: "Ва́ня, ___ посиди́м на берегу́!"
        options: [дава́й, пусть, дава́й я]
        answer: дава́й
      - stem: "— Ми́ша не хо́чет есть. — ___ не ест."
        options: [Пусть, Дава́й, Дава́йте]
        answer: Пусть
      - stem: "— Кто принесёт воды́? — ___ принесу́!"
        options: [Дава́й я, Пусть, Дава́й]
        answer: Дава́й я
      - stem: "Ба́бушка, ___ я вам помогу́ полива́ть клубни́ку!"
        options: [дава́йте, дава́й, пусть]
        answer: дава́йте
      - stem: "___ у тебя́ всё бу́дет хорошо́!"
        options: [Пусть, Дава́й, Дава́йте]
        answer: Пусть

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题提议一起做一件具体的事，用 [дава́йте]{.ru} + 完成体将来时；对一个人说用 [дава́й]{.ru}。第 2 题让第三者做，用 [пусть]{.ru}。第 3 题说话人主动提出，用 [дава́й(те) я]{.ru}。第 4 题否定提议用 [не бу́дем]{.ru} + 未完成体不定式。"
    items:
      - zh: 咱们在河边坐一会儿吧。
        accept: ["Дава́йте посиди́м на берегу́.", "Дава́й посиди́м на берегу́.", "Дава́йте посиди́м на берегу́ ре́чки.", "Дава́й посиди́м на берегу́ ре́чки.", "Дава́йте посиди́м на берегу́ реки́.", "Дава́й посиди́м на берегу́ реки́."]
        rubric: ["[дава́й(те)]{.ru} + [посиди́м]{.ru}", "[на берегу́]{.ru} 是特殊的第六格"]
      - zh: 让米沙去打点水来。
        accept: ["Пусть Ми́ша принесёт воды́.", "Ми́ша пусть принесёт воды́.", "Пусть Ми́ша принесёт во́ду.", "Ми́ша пусть принесёт во́ду."]
        rubric: ["[пусть]{.ru} + 第三人称 [принесёт]{.ru}", "“一些水”用第二格 [воды́]{.ru}"]
      - zh: 奶奶，我来帮您吧！
        accept: ["Ба́бушка, дава́йте я вам помогу́!", "Ба́бушка, дава́йте я помогу́ вам!", "Ба́бушка, дава́йте я помогу́!"]
        rubric: ["[дава́й(те) я]{.ru} + 第一人称单数 [помогу́]{.ru}", "[помо́чь]{.ru} 支配第三格 [вам]{.ru}", "“您”用 [вы]{.ru} 称呼，所以说 [дава́йте]{.ru}"]
      - zh: 咱们别争了。
        accept: ["Дава́й не бу́дем спо́рить.", "Дава́йте не бу́дем спо́рить.", "Не бу́дем спо́рить."]
        rubric: ["否定提议用 [не бу́дем]{.ru} + 未完成体不定式 [спо́рить]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ и на чём пое́хали ребя́та в понеде́льник? Почему́ роди́тели оста́лись в Москве́? Что бы́ло в огоро́де у ба́бушки? Что де́лали Ван Лэй и Ми́ша по́сле обе́да? Куда́ хоте́л пойти́ Ми́ша ве́чером и что отве́тила ба́бушка?]{.ru}"
        length: 70–100
        model: "Экза́мены ко́нчились, и в понеде́льник А́нна, Ми́ша и Ван Лэй пое́хали к ба́бушке на да́чу на электри́чке. Роди́тели оста́лись в Москве́, потому́ что им на́до рабо́тать. Они́ прие́дут в пя́тницу ве́чером. Ба́бушка ждала́ ребя́т и пригото́вила обе́д. По́сле обе́да она́ показа́ла им огоро́д: там бы́ли гря́дки с огурца́ми, помидо́рами и клубни́кой. Ван Лэй помога́л ба́бушке полива́ть гря́дки, а Ми́ша носи́л во́ду из коло́дца. Ве́чером Ми́ша хоте́л пойти́ на ре́чку. А́нна сказа́ла, что уже́ по́здно, но ба́бушка отве́тила: «Пусть идёт!» Пото́м все пошли́ на ре́чку и пи́ли чай на берегу́."
        rubric: ["回答全部五个问题", "至少用一次 [пусть]{.ru}（可以放在引语里）", "用过去时叙述，转述时人称和时正确"]
        notes: 范文约 90 词。课文的对话多半改成了叙述：[«Дава́йте я вам помогу́»]{.ru} 写成 [помога́л ба́бушке полива́ть]{.ru}，安娜的话改成间接引语 [сказа́ла, что уже́ по́здно]{.ru}；奶奶的 [«Пусть идёт!»]{.ru} 是本课的核心句，保留为直接引语。米沙多次打水，用未完成体 [носи́л]{.ru}。

  - id: e6
    type: open
    task: 作文：一个夏天的周末计划。
    items:
      - prompt: 你和朋友们（或家人）商量怎样过一个夏天的周末。写成一段叙述加对话的短文：谁提了什么建议，大家怎么决定。至少用三次 [дава́й(те)]{.ru}（包括一次 [дава́й(те) я]{.ru}）、两次 [пусть]{.ru}。
        length: 100–150
        model: "В пя́тницу ве́чером мы с друзья́ми ду́мали, что де́лать в суббо́ту. Бы́ло о́чень жа́рко.\n— Дава́йте пое́дем в лес, — сказа́л Пьер. — Там есть краси́вая ре́чка.\n— Дава́йте! — отве́тила Ю́ми. — Дава́йте возьмём с собо́й чай и бутербро́ды.\n— Дава́й я куплю́ хлеб и колбасу́, — сказа́л я. — Ря́дом с мои́м до́мом есть магази́н.\nПото́м мы вспо́мнили, что Карл в суббо́ту у́тром занима́ется в библиоте́ке.\n— Пусть прие́дет ве́чером, — сказа́ла Ю́ми. — Хосе́ то́же хо́чет пое́хать с на́ми? Пусть позвони́т мне.\nВ суббо́ту мы пое́хали на электри́чке. Мы купа́лись, игра́ли в футбо́л и до́лго сиде́ли на берегу́. Ве́чером прие́хал Карл.\n— Дава́йте не бу́дем спеши́ть домо́й! — сказа́л он. И мы оста́лись до девяти́ часо́в."
        rubric: ["有叙述也有对话", "[дава́й(те)]{.ru} + 完成体将来时第一人称复数至少一次", "[дава́й(те) я]{.ru} + 第一人称单数一次", "[пусть]{.ru} + 第三人称至少两次", "100–150 词"]
        notes: 范文是“叙述 + 对话 + 叙述”的结构：开头交代时间和起因，中间是商量，结尾是结果。提议大家做用 [дава́йте пое́дем, дава́йте возьмём]{.ru}，自己主动承担用 [дава́й я куплю́]{.ru}，说到不在场的人用 [пусть прие́дет, пусть позвони́т]{.ru}，最后 [дава́йте не бу́дем спеши́ть]{.ru} 是否定的提议，用未完成体不定式。

  - id: e7
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。到奶奶别墅的第一天晚上，给北京的父母写一封信：说说别墅、奶奶和菜园，你做了什么，打算在别墅里怎样过这两个星期，请他们放心。用上 [пусть]{.ru} 和 [дава́йте]{.ru}。注意书信的格式。
        length: 80–120
        model: |
          28 ию́ня

          Дороги́е ма́ма и па́па!

          Здра́вствуйте! Я пишу́ вам с да́чи. Сего́дня у́тром мы с А́нной и Ми́шей прие́хали к ба́бушке на электри́чке. Здесь о́чень краси́во: лес, ре́чка и большо́й сад. У ба́бушки есть огоро́д, там есть огурцы́, помидо́ры и клубни́ка. По́сле обе́да я полива́л гря́дки. Я никогда́ не рабо́тал в огоро́де, но мне понра́вилось!

          Ве́чером в де́вять часо́в бы́ло ещё светло́. Мы пи́ли чай на берегу́ ре́чки. Здесь я бу́ду помога́ть ба́бушке, чита́ть и купа́ться. Не волну́йтесь: я здоро́в, а ба́бушка о́чень хорошо́ гото́вит. Она́ говори́т: «Пусть твои́ роди́тели прие́дут к нам в го́сти!»

          А когда́ я верну́сь домо́й, дава́йте все вме́сте пое́дем на мо́ре!

          Ваш сын
        rubric: ["地点或日期、称呼、落款格式正确", "称呼父母用 [вы]{.ru}：[Здра́вствуйте]{.ru}，落款 [Ваш сын]{.ru}", "介绍别墅、做了什么、打算", "用对 [пусть]{.ru} + 第三人称、[дава́йте]{.ru} + 第一人称复数"]
        notes: 范文三段：到达和见闻（过去时）、打算（将来时 [бу́ду помога́ть, чита́ть, купа́ться]{.ru}）、回去以后的提议。请父母放心，直接对两人说 [Не волну́йтесь]{.ru}。[«Пусть твои́ роди́тели прие́дут к нам в го́сти!»]{.ru} 是奶奶的话：说到不在场的第三者，用 [пусть]{.ru} + 第三人称。[дава́йте … пое́дем]{.ru} 是对父母二人的提议，用 [дава́йте]{.ru}。
