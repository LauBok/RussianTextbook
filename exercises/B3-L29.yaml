lesson: B3-L29
grammar: "近义词辨析：[говорить]{.ru}（泛指说话、会说某种语言）、[сказать]{.ru}（完成体，说出一句话）、[разговаривать]{.ru}（双方交谈，[с кем]{.ru}，不接直接宾语）、[беседовать]{.ru}（正式、有主题的交谈）；同根词族 [разговор, рассказ, беседа, собеседник]{.ru}。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Какие числа считаются в России несчастливыми, а какие счастливыми? Сколько цветов можно дарить и почему? Почему многие мужчины не празднуют сорокалетие? Какой билет называли «счастливым»? Что делают перед долгой поездкой?]{.ru}"
        length: 60–90
        model: "Несчастливым числом считают тринадцать, его называют «чёртовой дюжиной». Счастливыми считаются семь и три: о них говорят многие пословицы. Цветы дарят только в нечётном количестве, потому что чётное число цветов приносят на похороны. Многие мужчины не празднуют сорокалетие, потому что число сорок связывают с памятью об умерших: их вспоминают на сороковой день после смерти. «Счастливым» называли билет, у которого сумма первых трёх цифр была равна сумме последних трёх. Перед долгой поездкой вся семья садится и минуту молча сидит — это называется «присесть на дорожку»."
        rubric: ["五个问题都回答，内容与课文一致", "[считаться]{.ru} 后用第五格", "[в нечётном количестве]{.ru}、[равна сумме]{.ru} 用对"]
        notes: 第 1 题要同时说出不吉利和吉利的数字。第 4 题 [равен, равна чему]{.ru} 要求第三格：[равна сумме последних трёх]{.ru}。

  - id: e2
    type: choice
    task: 选择恰当的动词。
    why: "第 1 题“会说俄语”只能用 [говорить]{.ru}。第 2 题直接引语前说出一句话，完成体 [сказала]{.ru}。第 3 题 [с соседом]{.ru} 表示双方交谈，用 [разговаривали]{.ru}；[сказали]{.ru} 不能接 [с кем]{.ru}。第 4 题记者采访作家，正式、有话题，用 [беседует]{.ru}。第 5 题 [ни слова]{.ru} 和 [произнести]{.ru} 搭配，侧重说出声音和词句。第 6 题女孩们随便聊天，口语，用 [болтали]{.ru}；[беседовали]{.ru} 太正式。"
    items:
      - stem: Мой друг хорошо ___ по-русски.
        options: [говорит, скажет, беседует]
        answer: говорит
      - stem: "Мама ___: «Посидим на дорожку»."
        options: [разговаривала, сказала, беседовала]
        answer: сказала
      - stem: Вчера мы долго ___ с соседом о погоде.
        options: [сказали, разговаривали, произнесли]
        answer: разговаривали
      - stem: Журналист ___ с известным писателем о его новой книге.
        options: [болтает, беседует, скажет]
        answer: беседует
      - stem: Он так испугался, что не мог ___ ни слова.
        options: [произнести, разговаривать, беседовать]
        answer: произнести
      - stem: Девочки весь вечер ___ по телефону о новых фильмах.
        options: [беседовали, болтали, заявили]
        answer: болтали

  - id: e3
    type: fill
    task: 用 [говорить, сказать, разговаривать, беседовать]{.ru} 的适当形式填空。
    why: "第 1 题“据说”是不定人称句，用复数第三人称 [говорят]{.ru}。第 2 题说出一句话，完成体过去时 [сказал]{.ru}。第 3 题双方谈话、带 [с кем]{.ru}，未完成体副动词 [разговаривая]{.ru}。第 4 题正式会见、谈论严肃话题，[беседовал]{.ru}。第 5 题“讲真话”，[разговаривать]{.ru} 不接直接宾语，用 [говорить]{.ru}：[говори]{.ru}。"
    items:
      - stem: ___, что в наше время в приметы верят немногие.
        hint: говорить / сказать
        accept: ["Говорят"]
      - stem: "Увидев чёрную кошку, друг ___ мне: «Давай подождём»."
        hint: говорить / сказать
        accept: ["сказал"]
      - stem: ___ с русским коллегой, не спрашивайте о его сорокалетии.
        hint: разговаривать
        accept: ["Разговаривая"]
      - stem: Директор долго ___ с родителями о будущем школы.
        hint: беседовать
        accept: ["беседовал"]
      - stem: Всегда ___ правду!
        hint: говорить / разговаривать
        accept: ["говори", "говорите"]

  - id: e4
    type: rewrite
    task: 用 [разговор]{.ru}、[беседа]{.ru} 等名词改写，意思不变。
    example:
      cue: Мы долго разговаривали.
      answer: У нас был долгий разговор.
    why: "动词换成同根名词，修饰动词的副词变成修饰名词的形容词：[долго → долгий]{.ru}，[интересно → интересный]{.ru}。第 1 题 [беседовать → беседа]{.ru}，阴性，[интересная беседа]{.ru}。第 2 题 [разговаривать → разговор]{.ru}，[серьёзный разговор]{.ru}。第 3 题 [рассказывать → рассказ]{.ru}。"
    items:
      - cue: Этнографы интересно беседовали со стариками.
        accept: ["У этнографов была интересная беседа со стариками."]
      - cue: Отец серьёзно разговаривал с сыном.
        accept: ["У отца был серьёзный разговор с сыном."]
      - cue: Бабушка интересно рассказывала о приметах.
        accept: ["Бабушка интересно рассказала о приметах.", "У бабушки был интересный рассказ о приметах."]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 据说相信预兆的人不多，但遵守预兆的人很多。
        accept: ["Говорят, что в приметы верят немногие, но соблюдают их многие.", "Говорят, что в приметы верят немногие, но соблюдают их очень многие.", "Говорят, в приметы верят немногие, но соблюдают их многие."]
        rubric: ["[говорят, что…]{.ru}：不定人称句", "[верить в приметы]{.ru}：[в]{.ru} + 第四格", "[соблюдать]{.ru}"]
      - zh: 俄罗斯人送花只送单数。
        accept: ["Русские дарят цветы только в нечётном количестве.", "Русские дарят только нечётное количество цветов.", "Русские дарят только нечётное число цветов.", "В России цветы дарят только в нечётном количестве."]
        rubric: ["[в нечётном количестве]{.ru} 或 [нечётное число / количество цветов]{.ru}"]
      - zh: 民族学家和村里的老人们座谈了很多年。
        accept: ["Этнографы много лет беседовали со стариками в деревне.", "Этнографы много лет беседовали со стариками в деревнях."]
        rubric: ["[беседовать с кем]{.ru}：正式的谈话", "[со стариками]{.ru}：[с]{.ru} 在辅音群前写成 [со]{.ru}"]

  - id: e6
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[У каждого народа есть свои счастливые и несчастливые числа.]{.ru} 比较俄罗斯和中国关于数字的说法（如 3、4、7、8、13），至少用三个本课的“说话”类动词，并注意它们的区别。"
        length: 140–160
        model: "У каждого народа есть свои счастливые и несчастливые числа. В России несчастливым считают тринадцать: его называют «чёртовой дюжиной». А в Китае многие люди стараются не говорить о числе четыре, потому что по-китайски оно звучит почти как слово «смерть». Счастливые числа тоже разные. Русские любят семь и три. Если что-то не получилось, русский скажет: «Бог троицу любит» — и попробует ещё раз. Китайцы же больше всего любят восемь: это слово похоже на слово «разбогатеть». Однажды я разговаривал с русской подругой о цветах и узнал, что в России дарят только нечётное количество цветов. В Китае, наоборот, подарки часто дарят парами. Этнографы, которые беседуют со стариками в деревнях, говорят, что такие обычаи появились очень давно. Сегодня мало кто верит в силу чисел, но знать эти правила полезно: они помогают понять культуру другого народа и не расстроить друзей."
        rubric: ["第一句是给定的主题句", "中俄两国各有不吉利和吉利数字的例子", "至少三个“说话”类动词，用法正确（[говорить о чём, сказать, разговаривать с кем, беседовать с кем]{.ru}）", "有收束句，约 150 词"]
        notes: 范文约 150 词。结构：主题句 → 不吉利的数字（俄 13、中 4）→ 吉利的数字（俄 7 和 3、中 8）→ 送礼的单数与双数 → 民族学家的看法 → 收束句。对比时用 [А в Китае…]{.ru}、[Китайцы же…]{.ru}、[наоборот]{.ru}。注意四个动词各用在合适的地方：[говорить о числе]{.ru}、[русский скажет]{.ru}、[разговаривал с подругой]{.ru}、[беседуют со стариками]{.ru}。
