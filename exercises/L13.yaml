lesson: L13
grammar: "前置词 [о]{.ru}（[об]{.ru}、[обо]{.ru}）+ 第六格表示“关于”；[о ком]{.ru}、[о чём]{.ru}；人称代词第六格 [обо мне, о тебе́, о нём, о ней, о нас, о вас, о них]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 用 [о]{.ru}、[об]{.ru} 或 [обо]{.ru} 填空。
    why: 元音 [а、о、у、э、и]{.ru} 开头的词前用 [об]{.ru}，[мне]{.ru} 前用 [обо]{.ru}，其余用 [о]{.ru}。第 4 题最容易错：[Япо́ния]{.ru} 虽然写的是元音字母 [я]{.ru}，但开头的音是 [[й]]{.tr}，所以用 [о]{.ru}。
    items:
      - stem: Мы говори́м ___ уро́ке.
        options: [о, об, обо]
        answer: об
      - stem: Я ду́маю ___ ма́ме.
        options: [о, об, обо]
        answer: о
      - stem: Вы говори́те ___ мне?
        options: [о, об, обо]
        answer: обо
      - stem: Ю́ми ду́мает ___ Япо́нии.
        options: [о, об, обо]
        answer: о
      - stem: Ми́ша спра́шивает ___ А́нне.
        options: [о, об, обо]
        answer: об
      - stem: Пьер ду́мает ___ Пари́же.
        options: [о, об, обо]
        answer: о

  - id: e2
    type: fill
    task: 用括号里的词填空。
    why: "[о]{.ru} 后面的名词用第六格。第 3 题 [Япо́ния]{.ru} 是 [-ия]{.ru} 词，第六格是 [-ии]{.ru}；第 4 题 [Кремль]{.ru} 第六格重音移到词尾；第 5 题 [тетра́дь]{.ru} 是阴性 [-ь]{.ru} 词，用 [-и]{.ru}。"
    items:
      - stem: Мы говори́м о ___.
        hint: Москва́
        accept: ["Москве́"]
      - stem: Ван Лэй ду́мает о ___.
        hint: Пеки́н
        accept: ["Пеки́не"]
      - stem: Я ма́ло зна́ю о ___.
        hint: Япо́ния
        accept: ["Япо́нии"]
      - stem: Он чита́ет о ___.
        hint: Кремль
        accept: ["Кремле́"]
      - stem: Ми́ша спра́шивает о ___.
        hint: тетра́дь
        accept: ["тетра́ди"]
      - stem: Ю́ми расска́зывает об ___.
        hint: уро́к
        accept: ["уро́ке"]

  - id: e3
    type: rewrite
    task: 用人称代词回答问题。
    placeholder: Да, …
    example:
      cue: Вы говори́те о Москве́?
      answer: Да, мы говори́м о ней.
    why: 代词跟所代替的名词的性、数一致：[Москва́]{.ru}、[А́нна]{.ru} 用 [о ней]{.ru}，[Пеки́н]{.ru}、[уро́к]{.ru} 用 [о нём]{.ru}，[ма́ма и па́па]{.ru} 用 [о них]{.ru}。第 4、5 题要换人称：问 [обо мне]{.ru} 答 [о тебе́]{.ru}，问 [о вас]{.ru} 答 [о нас]{.ru}。
    items:
      - cue: Ты ду́маешь о Пеки́не?
        accept: ["Да, я ду́маю о нём.", "Да, о нём."]
      - cue: Вы говори́те об А́нне?
        accept: ["Да, мы говори́м о ней.", "Да, о ней."]
      - cue: Ван Лэй ду́мает о ма́ме и о па́пе?
        accept: ["Да, он ду́мает о них.", "Да, о них."]
      - cue: Ты ду́маешь обо мне?
        accept: ["Да, я ду́маю о тебе́.", "Да, о тебе́."]
      - cue: Вы говори́те о нас?
        accept: ["Да, мы говори́м о вас.", "Да, о вас."]
      - cue: Пьер расска́зывает об уро́ке?
        accept: ["Да, он расска́зывает о нём.", "Да, о нём."]

  - id: e4
    type: rewrite
    task: 就句中 [о]{.ru} 后面的部分提问，用 [О ком]{.ru} 或 [О чём]{.ru}。
    placeholder: О ком / О чём …?
    example:
      cue: Мы говори́м о Москве́.
      answer: О чём вы говори́те?
    why: 问人用 [о ком]{.ru}，问事物和地方用 [о чём]{.ru}。问句里的人称也要变：[мы]{.ru} 变 [вы]{.ru}，[я]{.ru} 变 [ты]{.ru}。
    items:
      - cue: Я ду́маю о ма́ме.
        accept: ["О ком ты ду́маешь?"]
      - cue: Ю́ми ду́мает о Япо́нии.
        accept: ["О чём ду́мает Ю́ми?", "О чём Ю́ми ду́мает?"]
      - cue: Мы говори́м об О́льге Ви́кторовне.
        accept: ["О ком вы говори́те?"]
      - cue: Пьер чита́ет о Кремле́.
        accept: ["О чём чита́ет Пьер?", "О чём Пьер чита́ет?"]

  - id: e5
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊想家，皮埃尔想巴黎，由美想今天的课；课上谈的是莫斯科。
    items:
      - stem: Ван Лэй ду́мает ___.
        options: [о до́ме, об уро́ке, о Пари́же]
        answer: о до́ме
      - stem: Пьер ча́сто ду́мает ___.
        options: [о Пеки́не, о Пари́же, о Япо́нии]
        answer: о Пари́же
      - stem: Ю́ми ду́мает ___.
        options: [о Япо́нии, об уро́ке, о ма́ме]
        answer: об уро́ке
      - stem: Сего́дня на уро́ке говоря́т ___.
        options: [об О́льге Ви́кторовне, о Москве́, о Пари́же]
        answer: о Москве́

  - id: e6
    type: translate
    task: 译成俄语。
    why: “想……”“谈……”“讲……”在俄语里都要用 [о]{.ru} + 第六格，不能直接带名词。
    items:
      - zh: 你们在谈什么？——谈莫斯科。
        accept: ["— О чём вы говори́те? — О Москве́.", "— О чём вы говори́те? — Мы говори́м о Москве́."]
        rubric: ["问事物用 [о чём]{.ru}", "[о Москве́]{.ru}：第六格"]
      - zh: 我常常想家。
        accept: ["Я ча́сто ду́маю о до́ме."]
        rubric: ["[ду́мать о]{.ru} + 第六格", "“常常”用 [ча́сто]{.ru}"]
      - zh: 由美在讲日本。
        accept: ["Ю́ми расска́зывает о Япо́нии."]
        rubric: ["[расска́зывать о]{.ru} + 第六格", "[Япо́нии]{.ru}：[-ия]{.ru} 词第六格"]
      - zh: 他们在说我吗？——不，不是说你。
        accept: ["— Они́ говоря́т обо мне? — Нет, не о тебе́.", "— Они́ говоря́т обо мне? — Нет, они́ говоря́т не о тебе́."]
        rubric: ["[обо мне]{.ru}", "[о тебе́]{.ru}", "[не]{.ru} 放在被否定的 [о тебе́]{.ru} 前"]
      - zh: 我对克里姆林宫知道得很少。
        accept: ["Я ма́ло зна́ю о Кремле́."]
        rubric: ["[знать о]{.ru} + 第六格", "[Кремле́]{.ru}：重音在词尾", "“很少”用 [ма́ло]{.ru}"]
