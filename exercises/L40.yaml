lesson: L40
heading: 单元测试
intro: 本测试覆盖第四单元全部语法。答对 80% 以上再进入第五单元；没有达到的，回到相应的课复习后重做。
grammar: "[у кого́ есть]{.ru}；人称代词第二格；名词单数第二格；[нет]{.ru}、[не́ было]{.ru} + 第二格；第二格表示所属；形容词、物主代词、指示代词第二格；数词 1–100 与名词连用，[ско́лько]{.ru}；[отку́да]{.ru}，[из / с]{.ru} + 第二格，国籍名词；[у, о́коло, напро́тив, до, по́сле, без]{.ru} + 第二格；带 [-ся]{.ru} 的动词。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式。
    why: 第 1 题 [у]{.ru} 是前置词，第三人称代词前面要加 [н-]{.ru}：[у него́]{.ru}；第 6 题 [его́]{.ru} 是物主代词“他的”，后面跟名词，不加 [н-]{.ru}。第 2、3 题：[нет]{.ru} 后面用第二格。第 4 题：[не́ было]{.ru} 的句子没有主语，一律用中性，不随名词变。第 5 题是肯定句，[брат]{.ru} 是主语，[был]{.ru} 跟它在性上一致。
    items:
      - stem: У ___ есть соба́ка.
        options: [его́, него́]
        answer: него́
      - stem: У меня́ нет ___.
        options: [брат, бра́та]
        answer: бра́та
      - stem: На да́че нет ___.
        options: [интерне́т, интерне́та]
        answer: интерне́та
      - stem: Ра́ньше здесь ___ магази́на.
        options: [не был, не́ было]
        answer: не́ было
      - stem: У ба́бушки ___ ста́рший брат.
        options: [был, бы́ло]
        answer: был
      - stem: Э́то ___ соба́ка.
        options: [его́, него́]
        answer: его́

  - id: e2
    type: fill
    task: 用括号里的词的第二格填空。
    why: "第 1 题 [оте́ц]{.ru} 变格时 [е]{.ru} 脱落，重音移到词尾：[отца́]{.ru}。第 2 题 [-я]{.ru} 变 [-и]{.ru}。第 4 题名字和父称都要变：[-а]{.ru} 变 [-ы]{.ru}，[г]{.ru} 后写 [-и]{.ru}。第 5–8 题形容词、物主代词跟名词的性走：阳性、中性 [-ого / -его]{.ru}，阴性 [-ой / -ей]{.ru}；[ста́рший]{.ru} 的 [ш]{.ru} 后不重读的 [о]{.ru} 写成 [е]{.ru}。"
    items:
      - stem: Э́то маши́на ___.
        hint: оте́ц
        accept: [отца́]
      - stem: Ба́бушка пока́зывает альбо́м ___.
        hint: семья́
        accept: [семьи́]
      - stem: Ва́ня о́чень люби́л соба́ку ___.
        hint: сосе́д
        accept: [сосе́да]
      - stem: В гру́ппе ___ пятна́дцать челове́к.
        hint: О́льга Ви́кторовна
        accept: [О́льги Ви́кторовны]
      - stem: Э́то дом ___.
        hint: мой ста́рший брат
        accept: [моего́ ста́ршего бра́та]
      - stem: Ка́тя — студе́нтка ___.
        hint: медици́нский институ́т
        accept: [медици́нского институ́та]
      - stem: Они́ смо́трят фо́то ___.
        hint: весёлая соба́ка
        accept: [весёлой соба́ки]
      - stem: Апте́ка о́коло ___.
        hint: наш дом
        accept: [на́шего до́ма]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: 名词的形式看数词的最后一个词：[оди́н]{.ru} 后用单数第一格，[два, три, четы́ре]{.ru} 后用单数第二格，[пять]{.ru} 以上用复数第二格。第 2 题 [сестра́]{.ru} 是阴性，“二”用 [две]{.ru}。第 3 题 [челове́к]{.ru} 的复数第二格和第一格同形。第 6 题 [оди́ннадцать]{.ru} 是一个词，后面用 [рубле́й]{.ru}。第 7 题 [лимо́ны]{.ru} 是复数，动词用 [сто́ят]{.ru}。
    items:
      - stem: У Пье́ра два ___.
        options: [брат, бра́та]
        answer: бра́та
      - stem: У ба́бушки ___ сестры́.
        options: [два, две]
        answer: две
      - stem: Нас пять ___.
        options: [челове́ка, челове́к]
        answer: челове́к
      - stem: Лимо́н сто́ит три́дцать оди́н ___.
        options: [рубль, рубля́, рубле́й]
        answer: рубль
      - stem: Два лимо́на — шестьдеся́т два ___.
        options: [рубль, рубля́, рубле́й]
        answer: рубля́
      - stem: Хлеб сто́ит оди́ннадцать ___.
        options: [рубль, рубля́, рубле́й]
        answer: рубле́й
      - stem: Ско́лько ___ лимо́ны?
        options: [сто́ит, сто́ят]
        answer: сто́ят

  - id: e4
    type: rewrite
    task: 回答问题：他（她）从哪里来？
    example:
      cue: Ю́ми живёт в Япо́нии. Отку́да она́?
      answer: Она́ из Япо́нии.
    why: 所在用 [в]{.ru} 的地方，来处用 [из]{.ru}；所在用 [на]{.ru} 的，来处用 [с]{.ru}：[на Ку́бе → с Ку́бы]{.ru}。[-ия]{.ru} 结尾的国名第二格是 [-ии]{.ru}，[-ь]{.ru} 结尾的 [Каза́нь]{.ru} 变 [-и]{.ru}，[Пеки́н]{.ru} 加 [-а]{.ru}。
    items:
      - cue: Хосе́ живёт на Ку́бе. Отку́да он?
        accept: [Он с Ку́бы., С Ку́бы.]
      - cue: Же́нщина живёт в Каза́ни. Отку́да она́?
        accept: [Она́ из Каза́ни., Из Каза́ни.]
      - cue: Пьер жил в Пари́же. Отку́да он?
        accept: [Он из Пари́жа., Из Пари́жа.]
      - cue: Ван Лэй жил в Пеки́не. Отку́да он?
        accept: [Он из Пеки́на., Из Пеки́на.]

  - id: e5
    type: choice
    task: 选择正确的词。
    why: 第 1–4 题：[учи́ться]{.ru} 是在某个学校读书，[занима́ться]{.ru} 是坐下来用功、自习；[учи́ть]{.ru} 带第四格宾语，学具体的东西；[-ся]{.ru} 动词不带宾语，所以“课开始”说 [уро́ки начина́ются]{.ru}。第 5–7 题：[по́сле]{.ru} 在……以后，[без]{.ru} 没有，[о́коло]{.ru} 在附近，后面都用第二格。
    items:
      - stem: Ми́ша ___ в шко́ле напро́тив па́рка.
        options: [у́чится, занима́ется]
        answer: у́чится
      - stem: Ве́чером Ван Лэй ___ в библиоте́ке.
        options: [у́чится, занима́ется]
        answer: занима́ется
      - stem: Я ___ но́вые слова́.
        options: [учу́, учу́сь]
        answer: учу́
      - stem: Уро́ки ___ ра́но у́тром.
        options: [начина́ют, начина́ются]
        answer: начина́ются
      - stem: ___ шко́лы Ми́ша игра́ет в футбо́л.
        options: [По́сле, Без]
        answer: По́сле
      - stem: Я не могу́ жить ___ футбо́ла!
        options: [по́сле, без]
        answer: без
      - stem: Ры́нок нахо́дится ___ метро́.
        options: [о́коло, без]
        answer: о́коло

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：彼得罗夫家在公园对面；奶奶的别墅没有网；老照片上伊万·谢尔盖耶维奇还很小；班上十五个人；三个苹果六十三卢布。
    items:
      - stem: Дом Ива́на Серге́евича нахо́дится ___.
        options: [напро́тив па́рка, о́коло ры́нка]
        answer: напро́тив па́рка
      - stem: На да́че нет ___.
        options: [интерне́та, реки́]
        answer: интерне́та
      - stem: На ста́ром фо́то Ива́н Серге́евич ещё ___.
        options: [ма́ленький, инжене́р]
        answer: ма́ленький
      - stem: В гру́ппе О́льги Ви́кторовны ___ челове́к.
        options: [пятна́дцать, пять]
        answer: пятна́дцать
      - stem: Три я́блока сто́ят ___.
        options: [шестьдеся́т три рубля́, два́дцать оди́н рубль]
        answer: шестьдеся́т три рубля́

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题“没有”用 [нет]{.ru} + 第二格，[брат → бра́та]{.ru}，[сестра́ → сестры́]{.ru}。第 2 题 [напро́тив]{.ru}、[о́коло]{.ru} 后面用第二格，[метро́]{.ru} 不变格。第 3 题 [лимо́ны]{.ru} 是复数，用 [сто́ят]{.ru}；31 的最后一个词是 [оди́н]{.ru}，[рубль]{.ru} 用第一格。第 4 题国籍名词小写，来处用 [из]{.ru} + 第二格。
    items:
      - zh: 我没有兄弟，也没有姐妹。
        accept: ["У меня́ нет бра́та и нет сестры́.", "У меня́ нет бра́та, и сестры́ то́же нет.", "У меня́ нет бра́та и сестры́."]
        rubric: ["[у меня́]{.ru} 表示拥有者", "[нет]{.ru} + 第二格：[бра́та]{.ru}、[сестры́]{.ru}"]
      - zh: 我们家在公园对面，药店在地铁站附近。
        accept: ["Наш дом напро́тив па́рка, а апте́ка о́коло метро́.", "Наш дом нахо́дится напро́тив па́рка, а апте́ка о́коло метро́.", "Наш дом нахо́дится напро́тив па́рка, а апте́ка нахо́дится о́коло метро́.", "Наш дом напро́тив па́рка, апте́ка о́коло метро́."]
        rubric: ["[напро́тив па́рка]{.ru}：[напро́тив]{.ru} + 第二格", "[о́коло метро́]{.ru}：[метро́]{.ru} 不变格", "可以用 [нахо́дится]{.ru}，也可以不用"]
      - zh: 柠檬多少钱？——三十一卢布一个。
        accept: ["— Ско́лько сто́ят лимо́ны? — Три́дцать оди́н рубль шту́ка.", "— Ско́лько сто́ит лимо́н? — Три́дцать оди́н рубль.", "— Ско́лько сто́ят лимо́ны? — Три́дцать оди́н рубль.", "— Ско́лько сто́ит лимо́н? — Три́дцать оди́н рубль шту́ка."]
        rubric: ["复数 [лимо́ны]{.ru} 用 [сто́ят]{.ru}，单数 [лимо́н]{.ru} 用 [сто́ит]{.ru}", "[три́дцать оди́н рубль]{.ru}：最后一个词是 [оди́н]{.ru}，用单数第一格"]
      - zh: 我是中国人，从北京来。
        accept: ["Я кита́ец, я из Пеки́на.", "Я кита́ец, из Пеки́на.", "Я кита́ец. Я из Пеки́на.", "Я кита́янка, я из Пеки́на.", "Я кита́янка, из Пеки́на.", "Я кита́янка. Я из Пеки́на.", "Я кита́ец из Пеки́на.", "Я кита́янка из Пеки́на."]
        rubric: ["国籍名词小写：[кита́ец]{.ru}（女性 [кита́янка]{.ru}）", "[из Пеки́на]{.ru}：[из]{.ru} + 第二格"]

  - id: e8
    type: open
    task: 短文写作。
    items:
      - prompt: 以“[Моя́ семья́]{.ru}”为题写一篇短文：家里几口人，都是谁，有没有兄弟姐妹，爷爷奶奶住在哪儿，家在什么地方（附近有什么），你在哪里上学。
        length: 80–120
        model: |
          Моя́ семья́

          Нас три челове́ка: па́па, ма́ма и я. У меня́ нет бра́та и нет сестры́, но у меня́ есть двою́родный брат. Мой па́па — инжене́р, а ма́ма — врач. Па́па из Шанха́я, а ма́ма из Пеки́на. У нас есть ба́бушка и де́душка. Они́ живу́т в Шанха́е. У них большо́й сад.

          Наш дом нахо́дится в Пеки́не, напро́тив па́рка. О́коло до́ма есть магази́н и апте́ка, а до метро́ де́сять мину́т. Ра́ньше я учи́лся в шко́ле о́коло на́шего до́ма. А сейча́с я учу́сь в Москве́, в университе́те. Ве́чером я занима́юсь в библиоте́ке.
        rubric: ["用 [у кого́ есть]{.ru} 和 [нет]{.ru} + 第二格说有没有兄弟姐妹", "数词和名词连用，如 [три челове́ка]{.ru}、[два бра́та]{.ru}", "至少用一次第二格表所属或形容词、物主代词第二格", "用 [из]{.ru} + 第二格说家人从哪里来", "用 [напро́тив, о́коло, до]{.ru} 等前置词说家附近有什么", "用 [учи́ться]{.ru}、[занима́ться]{.ru} 说在哪里上学、自习"]
        notes: 范文分两段：第一段写人，先说几口人，再说有没有兄弟姐妹，然后写父母的职业和家乡、爷爷奶奶住在哪里；第二段写地方，从家的位置写到附近有什么，最后写自己在哪里上学。说人数时 [челове́к]{.ru} 的形式随数词变：[два, три, четы́ре челове́ка]{.ru}，[пять челове́к]{.ru}。说“没有”时名词一定换成第二格。写女生的作文，[учи́лся]{.ru} 改成 [учи́лась]{.ru}。
