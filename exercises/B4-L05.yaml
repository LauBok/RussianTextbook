lesson: B4-L05
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Как весна вошла в комнату для зрячих людей и для слепого мальчика? Как мальчик вёл себя, когда слышал весенние звуки? Куда решили повести мальчика? Что видели мать и Максим и что чувствовал мальчик? Чем кончилась прогулка?]{.ru}"
        length: 90–130
        model: "Когда вынули вторые рамы, зрячие люди увидели в окнах весеннее солнце, ветки буков и поля с последним снегом. Для слепого мальчика весна вошла в комнату только шумом: он слышал, как бегут потоки, как стучит капель и кричат журавли. Эти звуки его тревожили: он сдвигал брови, прислушивался, а потом протягивал руки, искал мать и крепко прижимался к ней. Когда стало теплее, мальчика повели в поле, на берег реки. Мать и Максим видели прекрасную картину, похожую на храм, приготовленный к празднику, а для мальчика это была только тьма, которая звенела и шумела вокруг. Он пытался различать отдельные звуки, но не мог соединить их в одно целое. Звуков было слишком много, и мальчик упал в обморок."
        rubric: ["五个问题都回答，内容与选文一致", "写出明眼人和盲孩子感受的对比", "结尾：孩子昏了过去"]
        notes: "回答第 1、4 题都要用对比的句式：[Для зрячих людей…, а для слепого мальчика…]{.ru}。[зрячий]{.ru}（看得见的）是 [слепой]{.ru} 的反义词。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[капель]{.ru}"
        accept: ["Капли воды, которые падают с крыши весной, когда тает снег.", "Вода, которая падает с крыши каплями весной.", "Капли с тающих сосулек."]
        rubric: ["说明是春天屋檐融雪滴下的水"]
      - zh: "[недоумение]{.ru}"
        accept: ["Состояние, когда человек не понимает, что происходит.", "Когда не понимаешь и удивляешься.", "Удивление, когда что-то непонятно."]
        rubric: ["说明是困惑、不明白"]
      - zh: "[прислушиваться]{.ru}"
        accept: ["Внимательно слушать, стараться услышать.", "Стараться услышать тихие звуки.", "Слушать с большим вниманием."]
        rubric: ["说明是集中注意力去听"]
      - zh: "[необъятный]{.ru}"
        accept: ["Очень большой, такой, что не видно конца.", "Огромный, без конца и края.", "Такой большой, что нельзя охватить."]
        rubric: ["说明是大得无边无际"]
      - zh: "[обморок]{.ru}"
        accept: ["Состояние, когда человек вдруг теряет сознание.", "Когда человек падает и ничего не чувствует.", "Потеря сознания."]
        rubric: ["说明是突然失去知觉"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题第 2 段写窗外的阳光、枝条、田地、雪斑，全是看得见的东西，是给明眼人的春天；声音集中在第 3 段。第 2 题 [подобно ярким и звонким камешкам]{.ru} 用“明亮的”“清脆的”小石子比喻声音，把听觉写成看得见、摸得着的东西，这是比喻和通感；它不是在说真的有石子落进屋里。第 3 题 [ветки буков шептались]{.ru} 把枝条写成会窃窃私语的人，是拟人。第 4 题第 15 段对照：明眼人看到 [великий храм]{.ru}，盲孩子感到的是 [необъятная тьма]{.ru}。第 5 题孩子昏倒是因为声音太多太杂，他的意识没有视觉表象帮助，没法把它们合成一个整体；不是因为冷，也不是因为母亲没注意他。"
    items:
      - stem: Во втором абзаце (о весне в комнате) автор описывает в основном то, что ___.
        options: [видят зрячие люди, слышит мальчик, чувствует мать]
        answer: видят зрячие люди
      - stem: "В словах «звуки падали в комнату, подобно ярким и звонким камешкам» звуки ___."
        options: [похожи на камешки, превращаются в камешки, мешают камешкам]
        answer: похожи на камешки
      - stem: "Слова «ветки буков шептались» — это пример того, как ___."
        options: [о предметах говорят как о людях, автор передаёт мысли мальчика, мать говорит о весне]
        answer: о предметах говорят как о людях
      - stem: Природа для матери — «великий храм», а для мальчика — ___.
        options: [необъятная тьма, тихий праздник, белое поле]
        answer: необъятная тьма
      - stem: Мальчик упал в обморок, потому что ___.
        options: [не смог понять множество звуков, замёрз на ветру, мать не заметила его]
        answer: не смог понять множество звуков

  - id: e4
    type: fill
    task: 用括号里的动词的适当形式填空，句子取自选文。
    why: "这几句都在写声音，动词的主语是发出声音的东西。第 1 题主语 [потоки]{.ru} 复数，过去时 [звенели]{.ru}。第 2 题 [ветки]{.ru} 复数，带 [-ся]{.ru} 的 [шептались]{.ru}。第 3 题 [капель]{.ru} 是阴性名词，过去时 [стучала]{.ru}，不要看成阳性。第 4 题主语 [тьма]{.ru} 阴性，[рокотала]{.ru}。第 5 题 [ласточка]{.ru} 阴性，[свистела]{.ru}。第 6 题 [всё]{.ru} 中性单数，[смолкло]{.ru}，完成体，表示声音“一下子”消失。"
    items:
      - stem: На дворе уже таял снег, ___ весенние потоки.
        hint: звенеть
        accept: ["звенели"]
      - stem: Ветки буков ___ за окнами.
        hint: шептаться
        accept: ["шептались"]
      - stem: Торопливая весенняя капель ___ тысячью звонких ударов.
        hint: стучать
        accept: ["стучала"]
      - stem: Для слепого это была только необъятная тьма, которая ___ и звенела.
        hint: рокотать
        accept: ["рокотала"]
      - stem: Ласточка ___ лёгким крылом.
        hint: свистеть
        accept: ["свистела"]
      - stem: Ещё раз пролетела длинная нота человеческого окрика, и затем всё сразу ___.
        hint: смолкнуть
        accept: ["смолкло"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение отрывка из повести «Слепой музыкант».]{.ru}"
        length: 130–170
        model: "Слепому мальчику шёл третий год. Всю зиму он болел и не выходил из комнаты, а весной стал поправляться. Когда вынули вторые рамы, все увидели весеннее солнце и почувствовали себя бодрее. Для мальчика же весна была только шумом: потоками воды, стуком капели, криками журавлей. Эти новые звуки его тревожили, он не понимал их и в страхе прижимался к матери. Когда стало тепло, мать и дядя Максим повели мальчика на берег реки. Мать вела его за руку, рядом шёл дядя Максим. Взрослые видели яркий весенний день, а для мальчика вокруг была только тьма, которая шумела и звенела со всех сторон. Сначала он стал различать отдельные звуки: жаворонка, шелест берёзы, всплески реки, крик пахаря. Но он не мог соединить их в одно целое, потому что у него не было зрительных представлений. Звуков становилось всё больше, они смешивались и мучили его. Наконец мальчик застонал и упал на траву в глубоком обмороке."
        rubric: ["130–170 词", "两个场面：屋里听到的春天；河边的散步", "写出明眼人和盲孩子的对比", "结尾：孩子昏倒", "不照抄长句，不加评论"]
        notes: "范文约 160 词。选文的比喻和声音细节很多，概要里只保留能说明情节的几个（溪水、滴水、鹤、云雀、农夫的吆喝），其余省去。注意用 [для мальчика же]{.ru}、[а для мальчика]{.ru} 一类说法写出对比。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Мир звуков». Опишите место, которое вы хорошо знаете (улицу, парк, вокзал, свою комнату утром), только через звуки — так, как его мог бы услышать слепой человек. Используйте сравнения и глаголы звука из текста.]{.ru}"
        length: 250–300
        model: "Каждое утро я открываю окно и несколько минут слушаю двор. Глаза можно не открывать: двор сам рассказывает о себе. Сначала кажется, что вокруг тишина. Но если внимательно слушать, тишина начинает звенеть. Где-то далеко, точно в другом мире, ровно рокочет большая улица. Этот рокот никогда не смолкает, он похож на шум моря, которое лежит за домами. Потом рядом слышен быстрый стук — это соседка спешит на работу, и её туфли торопливо стучат по асфальту. Стук уходит за угол и постепенно тает в воздухе. На старом дереве под окном шепчутся листья. Когда налетает ветер, они сталкиваются и шелестят громче, а потом снова затихают. Если прислушаться, можно различить, как одна ветка тихо стучит по стеклу, будто просит пустить её в комнату. В ветках кричат птицы: их голоса падают вниз, подобно мелким звонким камешкам. Иногда сверху, с крыши, слышен протяжный голос какой-то большой птицы, мягкий и низкий. Вот внизу хлопает дверь подъезда, и во дворе звучат детские голоса. Дети смеются, кричат, кто-то плачет, кто-то зовёт маму. Эти голоса толпятся, смешиваются, и через минуту уже нельзя понять ни одного слова. Потом приезжает тяжёлая машина, и её грохот на время закрывает все остальные звуки, как тёмная волна. Даже стёкла в окне отвечают ей тонким дрожащим звоном. Когда она уезжает, становится особенно тихо, и снова слышно, как звенит над двором какая-то птица. Раньше я никогда не думал, что утро может быть таким пёстрым. Но однажды я закрыл глаза, как слепой мальчик из повести Короленко, и понял, что зрение часто мешает нам слушать. Глаза видят всё сразу, а уши получают мир по частям, звук за звуком. Может быть, поэтому мир звуков кажется мне богаче и интереснее, чем мир, который мы видим."
        rubric: ["250–300 词", "全篇只通过声音描写一个地方", "至少五个声音动词（[звенеть]{.ru}、[шептаться]{.ru}、[рокотать]{.ru}、[смолкать]{.ru}、[шелестеть]{.ru} 等）", "至少三个比喻（[подобно]{.ru}、[точно]{.ru}、[как]{.ru}、[похож на]{.ru}）", "结尾有自己的感想"]
        notes: "范文约 280 词。结构按声音的远近和先后组织：远处的街道 → 近处的脚步 → 树和鸟 → 院子里的人声 → 卡车 → 重新安静；最后联系课文写感想。描写声音时让声音本身作主语（[рокочет улица]{.ru}、[шепчутся листья]{.ru}），比“我听见……”更生动。"
