lesson: B4-L27
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Чем Байкал отличается от большинства других озёр? Что такое экосистема и что такое эндемик? На какие группы можно разделить обитателей Байкала? Какую роль играет эпишура? Какие угрозы для Байкала называют учёные?]{.ru}"
        length: 120–160
        model: "Байкал — самое глубокое и одно из самых древних озёр на Земле: ему больше 25 миллионов лет, а большинство озёр живёт всего несколько десятков тысяч лет. В нём находится примерно пятая часть пресной воды озёр и рек планеты, и при этом оно не становится мельче. Экосистемой называют сообщество живых организмов вместе со средой, в которой они живут. Эндемики — это виды, которые живут только на определённой территории. Обитателей Байкала делят на три группы по месту жизни: организмы прибрежной зоны, например губки, обитатели открытой воды, например эпишура, и глубоководные организмы, например голомянка. Эпишура питается водорослями и бактериями и фильтрует воду, поэтому байкальская вода такая прозрачная; кроме того, эпишурой питаются молодые рыбы. Учёные называют четыре группы угроз: загрязнение, слишком большой вылов рыбы, изменение климата и туризм. Из-за загрязнения у берегов стало много спирогиры, а омуль ловить запрещено."
        rubric: ["五个问题都回答，内容与课文一致", "两个定义说清楚", "分类说明标准（按栖息地），每类有例子", "四类威胁都列出"]
        notes: "第 2 题可以照搬课文的定义，也可以换一种说法，但要包含“种概念 + 特征”。第 3 题注意分类的标准：[по тому, где они живут]{.ru}，三类各举一个例子。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语（可以下定义，也可以用同义说法）。
    items:
      - zh: "[эндемик]{.ru}"
        accept: ["Вид, который живёт только на определённой территории и больше нигде не встречается.", "Животное или растение, которое встречается только в одном месте."]
        rubric: ["说明是物种", "只生活在某一地区，别处没有"]
      - zh: "[экосистема]{.ru}"
        accept: ["Сообщество живых организмов вместе со средой, в которой они живут.", "Растения, животные и среда, которые связаны между собой."]
        rubric: ["说明包括生物和环境", "两者相互联系"]
      - zh: "[пищевая цепочка]{.ru}"
        accept: ["Ряд организмов, в котором одни служат едой для других.", "Связь между организмами, когда один организм ест другой, а его самого ест третий."]
        rubric: ["说明是生物之间吃与被吃的关系"]
      - zh: "[живородящий]{.ru}"
        accept: ["Такой, который не откладывает яйца или икру: его дети сразу появляются на свет живыми.", "Такой, у которого дети появляются на свет живыми."]
        rubric: ["说明不产卵，直接生下幼体"]
      - zh: "[глубоководный]{.ru}"
        accept: ["Такой, который живёт на большой глубине.", "Живущий глубоко под водой."]
        rubric: ["说明生活在很深的水里"]
      - zh: "[очистные сооружения]{.ru}"
        accept: ["Сооружения, в которых грязную воду делают чистой, прежде чем она попадёт в реку или озеро.", "Место, где грязную воду делают чистой."]
        rubric: ["说明是设施", "作用是净化污水"]

  - id: e3
    type: choice
    task: 根据课文和本课“文体与修辞”选择正确答案。
    why: "第 1 题第 1 段：多数湖泊只存在几万年，贝加尔湖超过 2500 万年。第 2 题第 4 段：物种多样是因为湖古老，生物有几百万年时间适应环境。第 3 题第 5 段：镖水蚤生活在开阔水域，胎鳚是深水鱼，海绵在沿岸带。第 4 题第 5 段：湖水透明是靠镖水蚤过滤。第 5 题第 6 段：海豹位于食物链顶端，科学家根据它的健康判断整个湖的状态。第 6 题 [… называют …]{.ru} 是下定义的句式；分类用 [можно разделить на группы]{.ru}，举例用 [например, такие как]{.ru}。"
    items:
      - stem: Большинство озёр живёт ___.
        options: [несколько десятков тысяч лет, больше 25 миллионов лет, несколько сотен лет]
        answer: несколько десятков тысяч лет
      - stem: В Байкале так много эндемиков, потому что ___.
        options: ["озеро очень древнее", "в него впадает больше трёхсот рек", "зимой оно замерзает"]
        answer: "озеро очень древнее"
      - stem: Эпишура относится к ___.
        options: [обитателям открытой воды, организмам прибрежной зоны, глубоководным организмам]
        answer: обитателям открытой воды
      - stem: Вода в Байкале такая прозрачная благодаря ___.
        options: [эпишуре, нерпе, спирогире]
        answer: эпишуре
      - stem: Учёные судят о состоянии всего озера по здоровью ___.
        options: [нерпы, омуля, губок]
        answer: нерпы
      - stem: Предложение «Эндемиками называют виды, которые живут только на определённой территории» — это ___.
        options: [определение, классификация, пример]
        answer: определение

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题 [питаться чем]{.ru} 要求第五格，主语 [нерпа]{.ru} 单数：[питается]{.ru}。第 2 题 [объясняться чем]{.ru}，主语 [разнообразие]{.ru} 中性单数：[объясняется]{.ru}。第 3 题 [приспособиться к чему]{.ru}，[успели]{.ru} 后面用不定式。第 4 题 [уступить место кому]{.ru}，[могут]{.ru} 后面用不定式。第 5 题 [относиться к кому-чему]{.ru}，主语 [эпишура]{.ru} 单数：[относится]{.ru}。第 6 题 [фильтровать]{.ru} 是 [-овать]{.ru} 动词，现在时词干变成 [-у-]{.ru}：[фильтруют]{.ru}，主语是复数 [рачки]{.ru}。"
    items:
      - stem: Байкальская нерпа в основном ___ голомянкой.
        hint: питаться
        accept: ["питается"]
      - stem: Разнообразие видов ___ возрастом озера.
        hint: объясняться
        accept: ["объясняется"]
      - stem: За миллионы лет обитатели Байкала успели ___ к холодной воде.
        hint: приспособиться
        accept: ["приспособиться"]
      - stem: Виды, которые любят холод, могут ___ место другим.
        hint: уступить
        accept: ["уступить"]
      - stem: К обитателям открытой воды ___ эпишура.
        hint: относиться
        accept: ["относится"]
      - stem: Маленькие рачки ___ воду и делают её прозрачной.
        hint: фильтровать
        accept: ["фильтруют"]

  - id: e5
    type: rewrite
    task: 把下面用破折号表示的定义改成 [… называют …]{.ru} 的句式。
    example:
      cue: Эндемик — вид, который живёт только на определённой территории.
      answer: Эндемиком называют вид, который живёт только на определённой территории.
    why: "[называть кого-что кем-чем]{.ru}：被定义的词作第二补语，用第五格；动词用不定人称形式 [называют]{.ru}，句子里没有主语。第 1 题 [экосистема]{.ru} 第五格 [экосистемой]{.ru}。第 2 题复数 [млекопитающие]{.ru} 按形容词变格，第五格 [млекопитающими]{.ru}。第 3 题 [мальки]{.ru} 第五格复数 [мальками]{.ru}，[малёк]{.ru} 变格时 [ё]{.ru} 脱落。第 4 题 [губка]{.ru} 第五格 [губкой]{.ru}。注意定义部分（[сообщество, животных]{.ru} 等）的格不变。"
    items:
      - cue: Экосистема — сообщество живых организмов вместе со средой, в которой они живут.
        accept: ["Экосистемой называют сообщество живых организмов вместе со средой, в которой они живут."]
      - cue: Млекопитающие — животные, которые кормят детей молоком.
        accept: ["Млекопитающими называют животных, которые кормят детей молоком."]
      - cue: Мальки — молодые рыбы.
        accept: ["Мальками называют молодых рыб."]
      - cue: Губка — простое животное, похожее на куст.
        accept: ["Губкой называют простое животное, похожее на куст."]

  - id: e6
    type: open
    task: 概要写作。用俄语把课文压缩成 150 词左右，保留主要数据、两个定义、分类和威胁。
    items:
      - prompt: "[Изложите кратко содержание статьи «Байкал: хрупкое равновесие».]{.ru}"
        length: 130–170
        model: "Байкал — самое глубокое и одно из самых древних озёр на Земле: его глубина достигает 1642 метров, а возраст превышает 25 миллионов лет. В нём находится около пятой части пресной воды озёр и рек планеты. Но главное богатство Байкала — жизнь. В озере обитает более 2500 видов и подвидов животных и более тысячи видов растений, и большинство из них — эндемики, то есть виды, которые больше нигде не встречаются. Обитателей озера можно разделить на три группы: организмы прибрежной зоны, например губки, обитатели открытой воды, например рачок эпишура, который фильтрует воду, и глубоководные организмы, например голомянка. Все они связаны пищевыми цепочками, на вершине которых находится нерпа. Сегодня равновесие этой экосистемы под угрозой. Учёные называют четыре группы угроз: загрязнение, из-за которого у берегов стало много спирогиры, слишком большой вылов омуля, изменение климата и туризм. В 1996 году Байкал был включён в список объектов всемирного наследия ЮНЕСКО, и его сохранение — задача для всего человечества."
        rubric: ["保留关键数据（深度、年龄、物种数）", "写出特有物种的定义", "写出三类生物，各有一例", "写出四类威胁", "130–170 词"]
        notes: "范文约 150 词。原文第 2–3 段关于“生态系统”的定义可以省去，只在后面用一次这个词；海豹的来历（第 7 段）是附带的有趣细节，概要里删掉。保留的例子每类只留一个。[то есть]{.ru}（也就是）是概要里压缩定义的好办法：[эндемики, то есть виды, которые…]{.ru}。"

  - id: e7
    type: open
    task: 写一段说明文：介绍“特有物种”这个概念，并以中国为例。150–200 词，要有定义、分类和例子。
    items:
      - prompt: "[Что такое эндемик? Эндемики Китая.]{.ru} 用上 [называют, можно разделить на, к ним относится, например, такие как]{.ru}。"
        length: 150–200
        model: "Эндемиками называют виды животных и растений, которые живут только на определённой территории и больше нигде в мире не встречаются. Такая территория может быть очень маленькой, например одно озеро или один остров, а может быть целой страной.\n\nВ Китае много эндемиков. Их можно разделить на две большие группы: животные и растения. Самый известный эндемик среди животных — большая панда. В дикой природе она живёт только в горах на юго-западе Китая и питается почти одним бамбуком. Сегодня большинство панд живёт в заповедниках, где их охраняют. Эндемиков среди растений в Китае ещё больше: к ним относятся многие виды деревьев и цветов, которые растут в горах юго-запада.\n\nПочему эндемики так важны? Каждый из них — звено в своей экосистеме. Если исчезнет эндемик, его нельзя будет найти нигде в мире: он исчезнет навсегда. Поэтому охрана эндемиков — задача не только одной страны, но и всего человечества. Классификация таких видов помогает учёным понять, какие из них находятся под угрозой и как их лучше охранять."
        rubric: ["第一句下定义，用 [называют]{.ru} 句式", "说明分类的标准", "至少一个具体例子，附有细节", "说明为什么要保护", "150–200 词"]
        notes: "范文约 160 词，结构和课文相同：定义 → 分类 → 例子 → 意义。例子不只写名字，还写出能让读者记住的细节（只吃竹子、只生活在西南山区）。大熊猫是中国特有物种，野生大熊猫分布在四川、陕西、甘肃的山区，写作时可以按这个事实发挥。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的文章。
    items:
      - prompt: "[Туризм и природа: можно ли путешествовать, не нанося вреда природе?]{.ru} 可以用贝加尔湖或你熟悉的景区为例。"
        length: 250–300
        model: "Каждый год сотни тысяч туристов приезжают на Байкал, чтобы увидеть самое глубокое озеро на Земле. Но чем больше людей приезжает, тем больше угроз для его хрупкой экосистемы. Появляется вопрос: можно ли путешествовать, не нанося вреда природе? На мой взгляд, можно, но только если каждый турист и каждый город, который принимает туристов, будут соблюдать несколько простых правил.\n\nВо-первых, мусор. Казалось бы, забрать с собой пустую бутылку — это очень просто. Однако на берегах популярных озёр и в горах мусор лежит везде: бутылки, пакеты, остатки костров. Убирать всё это приходится волонтёрам, и работы у них с каждым годом становится больше. Если каждый турист будет забирать свой мусор, проблема исчезнет.\n\nВо-вторых, вода. Многие базы отдыха и кафе стоят прямо на берегу, а очистных сооружений не хватает. Грязная вода попадает в озеро, и у берегов становится всё больше водорослей. Это уже задача не туристов, а местных властей: они должны строить очистные сооружения и проверять базы отдыха и рестораны.\n\nВ-третьих, число туристов. Есть места, куда нельзя пускать всех желающих. В некоторые заповедники уже пускают только определённое число посетителей в день, и, по-моему, это правильное решение. Безусловно, туристам это не нравится, но лучше подождать своей очереди, чем увидеть мёртвое озеро.\n\nНаконец, нельзя забывать, что туризм не только вредит природе, но и помогает её сохранить. Деньги, которые оставляют туристы, могут идти на охрану заповедников, а человек, который сам увидел Байкал, будет больше думать о том, как его сохранить.\n\nТаким образом, туризм и природа не враги. Всё зависит от того, как мы путешествуем: как гости, которые уважают хозяина, или как люди, которым всё равно, что будет после них."
        rubric: ["开头提出问题和论点", "分条论述，每条有原因和办法", "有让步或对立观点", "结论明确", "用上本课词语（[экосистема, угроза, очистные сооружения, охрана, заповедник]{.ru} 等）", "250–300 词"]
        notes: "范文约 260 词。论点是“可以，但有条件”，正文按 [во-первых… наконец]{.ru} 列出四点，前三点是问题和办法，第四点换一个角度，说旅游对保护自然也有好处，让文章不片面。[не нанося вреда]{.ru}：否定的副动词短语，补语用第二格；[наносить вред чему]{.ru} 对……造成损害。"
