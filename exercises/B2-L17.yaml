lesson: B2-L17
grammar: "[челове́к]{.ru} 与数词连用：[оди́н челове́к, два челове́ка, пять челове́к]{.ru}；[мно́го люде́й]{.ru}；数量主语的动词用单数（过去时中性）。"
exercises:

  - id: e1
    type: fill
    task: 填入 [челове́к]{.ru}、[челове́ка]{.ru} 或 [люде́й]{.ru}。
    why: "数词 1、21 后用 [челове́к]{.ru}（单数第一格），2–4、22–24 后用 [челове́ка]{.ru}，5–20、25–30 后用零词尾的 [челове́к]{.ru}。[мно́го, ма́ло]{.ru} 后只能用 [люде́й]{.ru}（第 3、6 题）。第 4 题 [три и́ли четы́ре]{.ru} 看紧挨着名词的 [четы́ре]{.ru}。第 7 题 [ско́лько]{.ru} 后两种都可以。第 8 题 [два́дцать оди́н]{.ru} 看最后的 [оди́н]{.ru}。"
    items:
      - stem: Из моего́ отде́ла бу́дет три ___.
        accept: ["челове́ка"]
      - stem: Вме́сте с на́ми бу́дет пятна́дцать ___.
        accept: ["челове́к"]
      - stem: В Москве́ мно́го ___.
        accept: ["люде́й"]
      - stem: На день рожде́ния собира́лось три и́ли четы́ре ___.
        accept: ["челове́ка"]
      - stem: В гости́ной бы́ло два́дцать два ___.
        accept: ["челове́ка"]
      - stem: Ра́но у́тром на катке́ бы́ло ма́ло ___.
        accept: ["люде́й"]
      - stem: Ско́лько ___ бы́ло в теа́тре?
        accept: ["челове́к", "люде́й"]
      - stem: В на́шей гру́ппе два́дцать оди́н ___.
        accept: ["челове́к"]

  - id: e2
    type: choice
    task: 选择动词的正确形式。
    why: "数词加名词作主语时，动词一般用单数：过去时用中性 [бы́ло, собира́лось]{.ru}（第 1、3 题），将来时用 [бу́дет]{.ru}（第 2 题），现在时用第三人称单数 [живёт]{.ru}（第 4 题）。第 5 题 [мно́го люде́й]{.ru} 作主语也用单数中性 [бы́ло]{.ru}。"
    items:
      - stem: В гости́ной ___ два́дцать два челове́ка.
        options: [был, бы́ло, была́]
        answer: бы́ло
      - stem: Ве́чером ___ пятна́дцать челове́к.
        options: [бу́дет, бу́дут, бу́дем]
        answer: бу́дет
      - stem: Ра́ньше на мой день рожде́ния ___ четы́ре челове́ка.
        options: [собира́лся, собира́лось, собира́лась]
        answer: собира́лось
      - stem: В Кита́е ___ почти́ полтора́ миллиа́рда челове́к.
        options: [живёт, живу́, живёшь]
        answer: живёт
      - stem: На пра́зднике ___ мно́го люде́й.
        options: [был, бы́ло, была́]
        answer: бы́ло

  - id: e3
    type: rewrite
    task: 按例句回答问题，用括号里的数词。
    example:
      cue: Ско́лько челове́к бы́ло на уро́ке? (12)
      answer: На уро́ке бы́ло двена́дцать челове́к.
    why: "答句用问句里的词，把数词和名词放在动词后面。第 1 题 [два]{.ru} 后用 [челове́ка]{.ru}，第 2 题 [пять]{.ru} 后用 [челове́к]{.ru}，第 3 题 [два́дцать оди́н]{.ru} 后用单数第一格 [челове́к]{.ru}，动词仍用中性 [бы́ло]{.ru}，第 4 题将来时 [бу́дет]{.ru}。"
    items:
      - cue: Ско́лько челове́к бы́ло в кафе́? (2)
        accept: ["В кафе́ бы́ло два челове́ка."]
      - cue: Ско́лько челове́к бы́ло на катке́? (5)
        accept: ["На катке́ бы́ло пять челове́к."]
      - cue: Ско́лько челове́к бы́ло в гру́ппе? (21)
        accept: ["В гру́ппе бы́ло два́дцать оди́н челове́к.", "В гру́ппе был два́дцать оди́н челове́к."]
      - cue: Ско́лько челове́к бу́дет на пра́зднике? (14)
        accept: ["На пра́зднике бу́дет четы́рнадцать челове́к."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“十五个人”用 [пятна́дцать челове́к]{.ru}，将来时 [бу́дет]{.ru}。第 2 题“人很多”用 [мно́го люде́й]{.ru}。第 3 题“三个人”用 [три челове́ка]{.ru}，动词过去时用中性。第 4 题“够吗”用 [хва́тит]{.ru} + 第二格。"
    items:
      - zh: 晚上会有十五个人。
        accept: ["Ве́чером бу́дет пятна́дцать челове́к.", "Ве́чером у нас бу́дет пятна́дцать челове́к.", "Бу́дет пятна́дцать челове́к ве́чером."]
        rubric: ["[пятна́дцать челове́к]{.ru}：数词 5 以上后用零词尾的 [челове́к]{.ru}", "动词 [бу́дет]{.ru} 用单数"]
      - zh: 莫斯科人很多。
        accept: ["В Москве́ мно́го люде́й.", "В Москве́ живёт мно́го люде́й."]
        rubric: ["[мно́го]{.ru} 后用 [люде́й]{.ru}，不能用 [челове́к]{.ru}"]
      - zh: 冰场上只有三个人。
        accept: ["На катке́ бы́ло то́лько три челове́ка.", "На катке́ бы́ли то́лько три челове́ка."]
        rubric: ["[три челове́ка]{.ru}：2–4 后用单数第二格", "过去时最好用中性 [бы́ло]{.ru}"]
      - zh: 椅子够吗？
        accept: ["Сту́льев хва́тит?", "А сту́льев хва́тит?", "Хва́тит сту́льев?", "Сту́льев хвата́ет?", "Хвата́ет сту́льев?"]
        rubric: ["无人称句 [хва́тит]{.ru} 或 [хвата́ет]{.ru}", "[сту́льев]{.ru}：复数第二格"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Ско́лько челове́к ждал Ива́н Серге́евич? Почему́ говоря́т «пятна́дцать челове́к», а не «пятна́дцать люде́й»? Кто был с жёнами и детьми́? Ско́лько челове́к бы́ло ве́чером? Что сказа́л Ива́н Серге́евич гостя́м?]{.ru}"
        length: 50–80
        model: "Ива́н Серге́евич ждал пятна́дцать челове́к. По́сле числи́тельных говоря́т «челове́к», а по́сле слов «мно́го» и «ма́ло» — «люде́й». Но сосе́ди бы́ли с до́чками, а колле́ги и ста́рые друзья́ — с жёнами и детьми́. Поэ́тому ве́чером в гости́ной бы́ло два́дцать два челове́ка. Ива́н Серге́евич сказа́л, что ра́ньше на его́ день рожде́ния собира́лось три и́ли четы́ре челове́ка, и сказа́л всем «спаси́бо»."
        rubric: ["回答全部五个问题", "[челове́к]{.ru} 与数词连用正确：[пятна́дцать челове́к]{.ru}、[два́дцать два челове́ка]{.ru}", "数量主语的动词用单数中性 [бы́ло]{.ru}"]
        notes: 范文约 65 词。第二句把安娜的解释压成一句规则；第三、四句用 [но]{.ru}、[поэ́тому]{.ru} 把“没想到人多”的因果连起来；伊万的话改成 [сказа́л, что…]{.ru}，[мой]{.ru} 变成 [его́]{.ru}。
