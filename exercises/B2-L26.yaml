lesson: B2-L26
grammar: "副词的构成：[-о]{.ru}、[-е]{.ru}、[по-…-ски]{.ru}；副词比较级（与形容词比较级同形）；口语请求用 [по-]{.ru} + 比较级；副词比较级 + [всех / всего́]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 把括号里的形容词变成副词。
    why: "大多数形容词去掉词尾加 [-о]{.ru}：[гро́мко, внима́тельно, пра́вильно, че́стно]{.ru}。第 4、7 题 [-ский]{.ru} 结尾的形容词变成 [по-…-ски]{.ru}，要写连字符：[по-ру́сски, по-дру́жески]{.ru}（第 7 题也可以说 [дру́жески]{.ru}）。第 5 题 [весёлый]{.ru} 变成副词时重音前移：[ве́село]{.ru}。"
    items:
      - stem: Ди́ма всегда́ говори́т ___.
        hint: гро́мкий
        accept: ["гро́мко"]
      - stem: Ми́ша ___ слу́шал па́пу.
        hint: внима́тельный
        accept: ["внима́тельно"]
      - stem: Ты всё сде́лал ___.
        hint: пра́вильный
        accept: ["пра́вильно"]
      - stem: Ван Лэй уже́ хорошо́ говори́т ___.
        hint: ру́сский
        accept: ["по-ру́сски"]
      - stem: Ба́бушка ___ засмея́лась.
        hint: весёлый
        accept: ["ве́село"]
      - stem: Скажи́ мне ___, что ты ду́маешь.
        hint: че́стный
        accept: ["че́стно"]
      - stem: Сосе́д ___ улыбну́лся нам.
        hint: дру́жеский
        accept: ["по-дру́жески", "дру́жески"]

  - id: e2
    type: fill
    task: 写出括号里副词的比较级。
    why: "第 1 题加 [-ее]{.ru}：[ме́дленнее]{.ru}，重音不变。第 2、3 题辅音交替：[гро́мко → гро́мче]{.ru}（[к → ч]{.ru}），[ти́хо → ти́ше]{.ru}（[х → ш]{.ru}）。第 4、6 题是特殊形式：[ра́но → ра́ньше]{.ru}，[хорошо́ → лу́чше]{.ru}。第 5 题 [бы́стро → быстре́е]{.ru}，重音移到 [-е́е]{.ru}。第 7 题 [ча́сто → ча́ще]{.ru}，[ст → щ]{.ru}；[ча́ще всех]{.ru} 表示“比谁都常”。"
    items:
      - stem: Говори́ ___, пожа́луйста, я не понима́ю.
        hint: ме́дленно
        accept: ["ме́дленнее", "ме́дленней"]
      - stem: Я вас пло́хо слы́шу! Говори́те ___!
        hint: гро́мко
        accept: ["гро́мче"]
      - stem: Ми́ша спит. Говори́те ___.
        hint: ти́хо
        accept: ["ти́ше"]
      - stem: Сего́дня я встал ___, чем обы́чно.
        hint: ра́но
        accept: ["ра́ньше"]
      - stem: Ди́ма пла́вает ___ всех.
        hint: бы́стро
        accept: ["быстре́е", "быстре́й"]
      - stem: Тепе́рь Ван Лэй говори́т по-ру́сски ___, чем в сентябре́.
        hint: хорошо́
        accept: ["лу́чше"]
      - stem: Ди́ма опа́здывает ___ всех.
        hint: ча́сто
        accept: ["ча́ще"]

  - id: e3
    type: choice
    task: 选择形容词或副词。
    why: "说明动词用副词（第 1、3、5 题：[говори́т пря́мо, говори́шь пра́вильно, говори́те поме́дленнее]{.ru}），说明名词用形容词（第 2、4 题：[че́стный отве́т, гро́мкий го́лос]{.ru}）。第 5 题请求时用 [по-]{.ru} + 比较级，语气比单用比较级缓和。"
    items:
      - stem: Ди́ма всегда́ говори́т ___.
        options: [пря́мо, прямо́й]
        answer: пря́мо
      - stem: Спаси́бо за ___ отве́т.
        options: [че́стный, че́стно]
        answer: че́стный
      - stem: Ты говори́шь ___, но сли́шком ти́хо.
        options: [пра́вильно, пра́вильный]
        answer: пра́вильно
      - stem: У Ди́мы о́чень ___ го́лос.
        options: [гро́мкий, гро́мко]
        answer: гро́мкий
      - stem: Говори́те, пожа́луйста, ___.
        options: [поме́дленнее, ме́дленный]
        answer: поме́дленнее

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1、4 题是请求，用命令式加比较级，可以加 [по-]{.ru}。第 2 题比较对象是副词 [обы́чно]{.ru}，用 [чем]{.ru}。第 3、5 题“比谁都”“最常”用比较级 + [всех]{.ru}、[всего́]{.ru}。"
    items:
      - zh: 请您说慢一点。
        accept: ["Говори́те, пожа́луйста, ме́дленнее.", "Говори́те, пожа́луйста, поме́дленнее.", "Пожа́луйста, говори́те ме́дленнее.", "Пожа́луйста, говори́те поме́дленнее.", "Говори́те ме́дленнее, пожа́луйста.", "Говори́те поме́дленнее, пожа́луйста."]
        rubric: ["命令式 [говори́те]{.ru}", "[ме́дленнее]{.ru} 或 [поме́дленнее]{.ru}"]
      - zh: 他今天起得比平时早。
        accept: ["Сего́дня он встал ра́ньше, чем обы́чно.", "Он сего́дня встал ра́ньше, чем обы́чно.", "Он встал сего́дня ра́ньше, чем обы́чно.", "Сего́дня он встал ра́ньше обы́чного.", "Он сего́дня встал ра́ньше обы́чного."]
        rubric: ["[ра́ньше]{.ru}：[ра́но]{.ru} 的比较级", "[чем обы́чно]{.ru}"]
      - zh: 迪马说话比谁都大声。
        accept: ["Ди́ма говори́т гро́мче всех.", "Ди́ма гро́мче всех говори́т.", "Гро́мче всех говори́т Ди́ма."]
        rubric: ["[гро́мче всех]{.ru}"]
      - zh: 请你说得简单一点。
        accept: ["Говори́ про́ще, пожа́луйста.", "Говори́, пожа́луйста, про́ще.", "Пожа́луйста, говори́ про́ще.", "Говори́ попро́ще, пожа́луйста.", "Говори́, пожа́луйста, попро́ще.", "Пожа́луйста, говори́ попро́ще.", "Скажи́ про́ще, пожа́луйста.", "Скажи́, пожа́луйста, про́ще.", "Скажи́ попро́ще, пожа́луйста.", "Скажи́, пожа́луйста, попро́ще."]
        rubric: ["[про́ще]{.ru}：[про́сто]{.ru} 的比较级，[ст → щ]{.ru}", "对“你”用 [говори́ / скажи́]{.ru}"]
      - zh: 我们最常在咖啡馆见面。
        accept: ["Ча́ще всего́ мы встреча́емся в кафе́.", "Мы ча́ще всего́ встреча́емся в кафе́.", "Мы встреча́емся ча́ще всего́ в кафе́."]
        rubric: ["[ча́ще всего́]{.ru}", "[встреча́ться]{.ru} 表示经常见面，用未完成体"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Где и как ча́сто занима́ются Ван Лэй и Ди́ма? Как Ди́ма повторя́л кита́йские слова́ и что сказа́л ему́ Ван Лэй? Что Ди́ма сказа́л о ру́сском языке́ Ван Лэ́я? Оби́делся ли Ван Лэй? Что он написа́л ве́чером в дневнике́?]{.ru}"
        length: 50–80
        model: "Ван Лэй и Ди́ма занима́ются вме́сте два ра́за в неде́лю, а в э́то воскресе́нье встре́тились ещё раз в кафе́: час говори́ли по-кита́йски, час — по-ру́сски. Ди́ма повторя́л кита́йские слова́ сли́шком гро́мко и бы́стро, и Ван Лэй попроси́л его́ говори́ть ти́ше и ме́дленнее. А Ди́ма сказа́л, что Ван Лэй говори́т пра́вильно, но сли́шком ти́хо и ве́жливо. Ван Лэй не оби́делся. Ве́чером он написа́л в дневнике́, что бу́дет говори́ть гро́мче, я́снее и про́ще."
        rubric: ["回答全部五个问题", "至少三个副词和三个副词比较级", "转述请求用 [попроси́л + 不定式]{.ru}"]
        notes: 范文约 70 词。王磊的请求 [Не так гро́мко! И ме́дленнее]{.ru} 转述成 [попроси́л его́ говори́ть ти́ше и ме́дленнее]{.ru}；迪马的话用 [сказа́л, что…]{.ru}。副词比较级集中出现在请求和日记里，正好对应课文的两个场景。

  - id: e6
    type: open
    task: 作文：《我是怎样学俄语的》。写一写你学俄语的方法和体会：什么容易、什么难，怎样练听力和口语，和以前比有什么进步，以后打算怎样学。
    items:
      - prompt: 写 100–150 词。至少用六个副词，其中至少三个是比较级；用一次“比较级 + [всего́]{.ru}”。
        length: 100–150
        model: "Я учу́ ру́сский язы́к уже́ два го́да. Ле́гче всего́ мне чита́ть: я чита́ю ме́дленно, но понима́ю почти́ всё. Трудне́е всего́ говори́ть. Снача́ла я говори́л о́чень ти́хо, потому́ что боя́лся оши́бок. Тепе́рь я говорю́ гро́мче и ча́ще. Ка́ждый день я слу́шаю ра́дио и внима́тельно повторя́ю слова́. Ра́ньше я понима́л люде́й, то́лько когда́ они́ говори́ли ме́дленно, а сейча́с понима́ю, да́же когда́ они́ говоря́т бы́стро. Мой ру́сский друг всегда́ говори́т мне пря́мо о мои́х оши́бках. Э́то о́чень помога́ет. Тепе́рь я пишу́ пра́вильнее, и у меня́ ме́ньше оши́бок, чем в пе́рвом семе́стре. В сле́дующем семе́стре я хочу́ ча́ще говори́ть с ру́сскими студе́нтами и бо́льше чита́ть газе́ты."
        rubric: ["写到容易的和难的方面、方法、进步、打算", "至少六个副词，其中三个比较级", "一次“比较级 + [всего́]{.ru}”", "100–150 词"]
        notes: 范文按“难易—方法—进步—打算”展开。副词有 [ме́дленно, ти́хо, внима́тельно, бы́стро, пря́мо]{.ru}，比较级有 [ле́гче всего́, трудне́е всего́, гро́мче, ча́ще, пра́вильнее, ме́ньше, бо́льше]{.ru}。“以前……，现在……”的对比最适合用比较级：[Ра́ньше я понима́л то́лько…, а сейча́с…]{.ru}。
