lesson: B2-L50
grammar: "非真实条件句：[е́сли бы]{.ru} + 过去时形式，主句过去时形式 + [бы]{.ru}；与真实条件 [е́сли]{.ru} + 将来时的对比。"
exercises:

  - id: e1
    type: rewrite
    task: 按例句把事实改成非真实条件句，说“要是……就……”。
    example:
      cue: Я не знал, что вы е́дете в Абра́мцево, поэ́тому я не встал ра́но.
      answer: Е́сли бы я знал, что вы е́дете в Абра́мцево, я бы встал ра́но.
    why: "非真实条件句和事实正好相反：事实是否定的，条件句就去掉 [не]{.ru}；事实是肯定的，条件句就加上 [не]{.ru}。两个分句都用过去时形式，都要有 [бы]{.ru}。第 2 题事实在现在（[нет]{.ru}），条件句用 [бы́ло]{.ru}，主语 [вре́мя]{.ru} 是中性。第 3 题事实是 [вы́ключил]{.ru}，条件句变成 [не вы́ключил]{.ru}。第 4 题 [у Ми́ши нет избу́шки]{.ru} → [е́сли бы у Ми́ши была́ избу́шка]{.ru}，[избу́шка]{.ru} 是阴性。"
    items:
      - cue: Ди́ма не позвони́л мне, поэ́тому я не пришёл.
        accept: ["Е́сли бы Ди́ма позвони́л мне, я бы пришёл.", "Е́сли бы Ди́ма мне позвони́л, я бы пришёл."]
      - cue: У меня́ нет вре́мени, поэ́тому я не пойду́ в кино́.
        accept: ["Е́сли бы у меня́ бы́ло вре́мя, я бы пошёл в кино́.", "Е́сли бы у меня́ бы́ло вре́мя, я бы пошла́ в кино́."]
      - cue: Ван Лэй вы́ключил телефо́н, поэ́тому он ничего́ не знал.
        accept: ["Е́сли бы Ван Лэй не вы́ключил телефо́н, он бы всё знал.", "Е́сли бы Ван Лэй не вы́ключил телефо́н, он бы знал всё."]
      - cue: У Ми́ши нет избу́шки, поэ́тому он не живёт в ней ле́том.
        accept: ["Е́сли бы у Ми́ши была́ избу́шка, он бы жил в ней ле́том.", "Е́сли бы у Ми́ши была́ избу́шка, он жил бы в ней ле́том."]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1、4 题是可能发生的真实条件，用 [е́сли]{.ru} + 将来时，主句也用将来时。第 2、3、5 题是与事实相反的设想，两个分句都用过去时形式加 [бы]{.ru}：第 2 题从句缺的是 [бы]{.ru} + 过去时，不能用 [е́сли]{.ru} + 将来时；第 3 题主句必须有 [бы]{.ru}；第 5 题 [пого́да]{.ru} 是阴性，用 [была́]{.ru}。"
    items:
      - stem: Е́сли ты опя́ть ___, я приду́ тебя́ буди́ть.
        options: [проспи́шь, проспа́л бы, проспа́л]
        answer: проспи́шь
      - stem: Е́сли бы я ___ ра́ньше, я бы пое́хал с ва́ми.
        options: [встал, вста́ну, встаю́]
        answer: встал
      - stem: Е́сли бы у меня́ была́ така́я избу́шка, я ___ в ней всё ле́то.
        options: [жил бы, бу́ду жить, живу́]
        answer: жил бы
      - stem: Е́сли за́втра ___ дождь, мы бу́дем до́ма.
        options: [бу́дет, был бы, был]
        answer: бу́дет
      - stem: Е́сли бы вчера́ ___ хоро́шая пого́да, мы бы гуля́ли в па́рке.
        options: [был, была́, бы́ло]
        answer: была́

  - id: e3
    type: fill
    task: 用括号里的动词完成非真实条件句。
    why: "两个分句里的动词都用过去时形式，跟各自主语的性数一致：第 1 题 [А́нна]{.ru} → [зна́ла]{.ru}；第 2 题 [мы]{.ru} → [пое́хали]{.ru}；第 3 题 [ма́ма]{.ru} → [чита́ла]{.ru}，否定的条件 [не чита́ла]{.ru}；第 4 题无人称句用中性 [бы́ло]{.ru}；第 5 题 [ты]{.ru} 指米沙，男性 [помо́г]{.ru}，注意 [помо́чь]{.ru} 的阳性过去时没有 [-л]{.ru}。"
    items:
      - stem: Е́сли бы А́нна ___ об э́том, она́ бы сказа́ла.
        hint: знать
        accept: ["зна́ла"]
      - stem: Е́сли бы не́ было экза́менов, мы бы ___ на мо́ре.
        hint: пое́хать
        accept: ["пое́хали"]
      - stem: Е́сли бы ма́ма не ___ мне ска́зки, я бы не люби́ла кни́ги.
        hint: чита́ть
        accept: ["чита́ла"]
      - stem: Е́сли бы ты пришёл, нам бы ___ веселе́е.
        hint: быть
        accept: ["бы́ло"]
      - stem: Ми́ша, е́сли бы ты ___ мне, я бы всё сде́лал быстре́е.
        hint: помо́чь
        accept: ["помо́г"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、2、4 题都是与事实相反的设想，两个分句都用 [бы]{.ru} 和过去时形式；第 3 题是可能发生的条件，用 [е́сли]{.ru} + 将来时，不用 [бы]{.ru}。
    items:
      - zh: 要是我有时间，我就去阿布拉姆采沃了。
        accept: ["Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хал в Абра́мцево.", "Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хала в Абра́мцево.", "Е́сли бы у меня́ бы́ло вре́мя, я пое́хал бы в Абра́мцево.", "Е́сли бы у меня́ бы́ло вре́мя, я пое́хала бы в Абра́мцево."]
        rubric: ["[е́сли бы у меня́ бы́ло вре́мя]{.ru}：中性 [бы́ло]{.ru}", "主句 [бы]{.ru} + 过去时形式 [пое́хал / пое́хала]{.ru}", "[Абра́мцево]{.ru} 不变格"]
      - zh: 要是你没睡过头，你就和我们一起去了。
        accept: ["Е́сли бы ты не проспа́л, ты бы пое́хал с на́ми.", "Е́сли бы ты не проспа́ла, ты бы пое́хала с на́ми.", "Е́сли бы ты не проспа́л, ты пое́хал бы с на́ми.", "Е́сли бы ты не проспа́ла, ты пое́хала бы с на́ми.", "Е́сли бы ты не проспа́л, ты бы пошёл с на́ми.", "Е́сли бы ты не проспа́ла, ты бы пошла́ с на́ми."]
        rubric: ["否定条件 [е́сли бы ты не проспа́л]{.ru}", "主句有 [бы]{.ru}"]
      - zh: 要是明天下雨，我们就待在家里。
        accept: ["Е́сли за́втра бу́дет дождь, мы бу́дем до́ма.", "Е́сли за́втра пойдёт дождь, мы бу́дем до́ма.", "Е́сли за́втра бу́дет дождь, мы оста́немся до́ма.", "Е́сли за́втра пойдёт дождь, мы оста́немся до́ма."]
        rubric: ["真实条件：[е́сли]{.ru} + 将来时，不用 [бы]{.ru}"]
      - zh: 要是妈妈没给我读童话，我就不会这么喜欢书。
        accept: ["Е́сли бы ма́ма не чита́ла мне ска́зки, я бы не люби́л так кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я бы не люби́ла так кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я бы так не люби́л кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я бы так не люби́ла кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зок, я бы так не люби́л кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зок, я бы так не люби́ла кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я бы не люби́л кни́ги так.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я бы не люби́ла кни́ги так.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я не люби́л бы так кни́ги.", "Е́сли бы ма́ма не чита́ла мне ска́зки, я не люби́ла бы так кни́ги."]
        rubric: ["否定条件 [е́сли бы ма́ма не чита́ла]{.ru}", "主句 [я бы так не люби́л]{.ru}，说话人是女性用 [люби́ла]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ Ван Лэй не пое́хал с друзья́ми в Абра́мцево? Что тако́е Абра́мцево? Что сказа́л Ван Лэй, когда́ уви́дел фо́то? Каку́ю кни́гу взяла́ А́нна? Что обеща́л Ди́ма?]{.ru}"
        length: 60–90
        model: "В пя́тницу Ван Лэй занима́лся до трёх часо́в но́чи и вы́ключил телефо́н. У́тром А́нна постуча́ла в его́ дверь, но он сно́ва засну́л, и А́нна с Ди́мой пое́хали в Абра́мцево без него́. Абра́мцево — ста́рая уса́дьба, где жи́ли худо́жники. Там есть избу́шка на ку́рьих но́жках. Когда́ Ван Лэй уви́дел фо́то, он сказа́л: «Е́сли бы я знал, я бы встал в шесть!» Пото́м А́нна взяла́ кни́гу «Ру́сские ска́зки». Ди́ма обеща́л, что они́ ещё раз пое́дут в Абра́мцево."
        rubric: ["回答全部五个问题", "至少一处 [е́сли бы]{.ru}，两个分句都有 [бы]{.ru}", "叙述用过去时，体用得恰当"]
        notes: 范文约 85 词。第一个问题要交代清楚原因：熬夜、关手机、又睡着了。王磊的话保留为直接引语，正好用上本课的 [е́сли бы]{.ru}。

  - id: e6
    type: open
    task: 作文：《要是我会魔法》。写写要是你能实现三个愿望，你会要什么，为什么。
    items:
      - prompt: 写出三个愿望和理由；每个愿望至少用一个 [е́сли бы]{.ru} 句子；结尾说说在现实中你可以怎样实现其中一个愿望（可用 [е́сли]{.ru} + 将来时）。
        length: 100–150
        model: "Е́сли бы я мог получи́ть всё, что хочу́, я бы попроси́л три ве́щи. Пе́рвое: я бы хоте́л говори́ть на всех языка́х ми́ра. Е́сли бы я знал все языки́, я бы мог разгова́ривать с ка́ждым челове́ком и чита́ть кни́ги без словаря́. Второ́е: я бы попроси́л ма́ленький дом у мо́ря. Е́сли бы у меня́ был тако́й дом, я бы жил там ка́ждое ле́то с роди́телями и друзья́ми. Тре́тье: я бы хоте́л, что́бы все мои́ бли́зкие бы́ли здоро́вы. Е́сли бы никто́ не боле́л, все бы́ли бы счастли́вее. Коне́чно, так быва́ет то́лько в ска́зках. Но е́сли я бу́ду мно́го занима́ться, я хорошо́ вы́учу ру́сский и англи́йский. Э́то то́же непло́хо!"
        rubric: ["三个愿望，每个都有理由", "每个愿望至少一个 [е́сли бы]{.ru} 句子，[бы]{.ru} 不漏", "结尾用 [е́сли]{.ru} + 将来时说现实的打算，和前面形成对比", "100–150 词"]
        notes: 范文约 130 词，用 [Пе́рвое… Второ́е… Тре́тье…]{.ru} 把三个愿望排列清楚。前面全是非真实的设想，结尾一句 [Но е́сли я бу́ду мно́го занима́ться, я вы́учу…]{.ru} 转到真实条件，从幻想回到现实。

  - id: e7
    type: open
    task: 书信写作：以王磊的身份给迪马写一条短信，为自己睡过头道歉，并约好下次一起去阿布拉姆采沃。
    items:
      - prompt: 口语化的称呼和落款；道歉、说明原因；至少用两处 [е́сли бы]{.ru} 和一处 [е́сли]{.ru} + 将来时；提出具体的日子和见面的地点、时间。
        length: 80–120
        model: "Ди́ма, приве́т!\n\nПрости́, что я вчера́ проспа́л. Я занима́лся до трёх часо́в но́чи и вы́ключил телефо́н. Е́сли бы я его́ не вы́ключил, я бы, коне́чно, пое́хал с ва́ми. Фо́то о́чень краси́вые! Е́сли бы я сам уви́дел избу́шку на ку́рьих но́жках, я бы сде́лал сто фо́то для роди́телей. Дава́й пое́дем туда́ по́сле экза́менов, в воскресе́нье, два́дцать седьмо́го ию́ня. Е́сли ты не бу́дешь за́нят, встре́тимся на вокза́ле в семь три́дцать. На э́тот раз я попрошу́ А́нну меня́ разбуди́ть и не вы́ключу телефо́н. Обеща́ю!\n\nТвой Ван Лэй"
        rubric: ["称呼、落款符合朋友之间的口吻", "道歉并说明原因，约定日期、地点和时间", "至少两处 [е́сли бы]{.ru}，一处 [е́сли]{.ru} + 将来时", "80–120 词"]
        notes: 范文约 100 词。开头用 [Прости́, что…]{.ru} 道歉，[что]{.ru} 引出道歉的原因。中间用 [е́сли бы]{.ru} 表示遗憾，后面用 [е́сли ты не бу́дешь за́нят]{.ru}（[е́сли]{.ru} + 将来时）提出真实的约定，最后用 [Обеща́ю!]{.ru} 表示决心。
