lesson: B2-L70
grammar: "书面语与口语：称呼、问候、告别的套语；成对的书面词和口语词；书面语用动名词和 [Прошу́]{.ru} + 不定式，口语用命令式、问句和省略。"
exercises:

  - id: e1
    type: choice
    task: 判断句子属于书面语还是口语。
    why: "第 1 题 [в связи́ с]{.ru} + 第五格是公文用语。第 2 题有感叹的 [Ну ты что!]{.ru} 和语气词 [же]{.ru}，是口语。第 3 题 [Прошу́ вас]{.ru} + 不定式、动名词 [реше́нии]{.ru}，是书面语。第 4 题网络缩略 [прив]{.ru}、用问句表示请求，是口语。第 5 题动名词作主语、[необходи́мо]{.ru}，是书面语。第 6 题省略了动词 [е́ду]{.ru}，告别用 [До за́втра!]{.ru}，是口语。"
    items:
      - stem: "В связи́ с ремо́нтом библиоте́ка не рабо́тает. ___"
        options: [书面语, 口语]
        answer: 书面语
      - stem: "Ну ты что! Я же говори́л! ___"
        options: [书面语, 口语]
        answer: 口语
      - stem: "Прошу́ вас сообщи́ть о ва́шем реше́нии. ___"
        options: [书面语, 口语]
        answer: 书面语
      - stem: "Прив! Позвони́шь ве́чером? ___"
        options: [书面语, 口语]
        answer: 口语
      - stem: "Изуче́ние языка́ необходи́мо для рабо́ты. ___"
        options: [书面语, 口语]
        answer: 书面语
      - stem: "Я — домо́й. До за́втра! ___"
        options: [书面语, 口语]
        answer: 口语

  - id: e2
    type: rewrite
    task: 把口语说法改成正式的书面说法。
    example:
      cue: "Сде́лайте спра́вку, пожа́луйста!"
      answer: "Прошу́ вас подгото́вить спра́вку."
    why: "口语的命令式在正式信件里换成 [Прошу́ (вас)]{.ru} + 不定式；[спаси́бо]{.ru} 换成 [благодарю́]{.ru}；[потому́ что я уезжа́ю]{.ru} 换成 [в связи́ с отъе́здом]{.ru}（动名词）；[ну́жен, нужна́]{.ru} 换成 [необходи́м, необходи́ма]{.ru}；[сказа́ть]{.ru} 换成 [сообщи́ть, сообща́ть]{.ru}；[приве́т, пока́]{.ru} 换成 [здра́вствуйте, до свида́ния]{.ru}。"
    items:
      - cue: "Приве́т!"
        accept: ["Здра́вствуйте!", "До́брый день!"]
      - cue: "Спаси́бо!"
        accept: ["Благодарю́ вас!", "Благодарю́!", "Зара́нее благодарю́."]
      - cue: "Мне нужна́ спра́вка, потому́ что я уезжа́ю."
        accept: ["В связи́ с отъе́здом мне необходи́ма спра́вка.", "Мне необходи́ма спра́вка в связи́ с отъе́здом."]
      - cue: "Хочу́ сказа́ть вам, что я уезжа́ю пятна́дцатого ию́ля."
        accept: ["Сообща́ю вам, что я уезжа́ю пятна́дцатого ию́ля.", "Сообща́ю вам, что пятна́дцатого ию́ля я уезжа́ю."]
      - cue: "Пока́!"
        accept: ["До свида́ния!"]

  - id: e3
    type: translate
    task: 译成俄语，注意语体。
    why: "第 1、2、3 题是正式信件里的话，用书面语：[Зара́нее благодарю́]{.ru}，[Прошу́ (вас)]{.ru} + 不定式，[в связи́ с]{.ru} + 第五格。第 4 题是朋友之间的短信，用口语：问句表示请求，可以省略主语。"
    items:
      - zh: （正式信件结尾）先行致谢。
        accept: ["Зара́нее благодарю́.", "Зара́нее благодарю́ вас.", "Зара́нее благодарю́ Вас."]
        rubric: ["书面语用 [благодарю́]{.ru}，不用 [спаси́бо]{.ru}", "[зара́нее]{.ru}"]
      - zh: （正式）请为我开具一份学习证明。
        accept: ["Прошу́ вы́дать мне спра́вку об обуче́нии.", "Прошу́ вас вы́дать мне спра́вку об обуче́нии.", "Прошу́ подгото́вить для меня́ спра́вку об обуче́нии.", "Прошу́ вас подгото́вить для меня́ спра́вку об обуче́нии.", "Прошу́ подгото́вить мне спра́вку об обуче́нии.", "Прошу́ вас подгото́вить мне спра́вку об обуче́нии."]
        rubric: ["[Прошу́ (вас)]{.ru} + 不定式，不用命令式", "[спра́вка об обуче́нии]{.ru}"]
      - zh: （通知）由于天气不好，飞机将晚点。
        accept: ["В связи́ с плохо́й пого́дой самолёт опа́здывает.", "В связи́ с плохо́й пого́дой самолёт опозда́ет.", "Самолёт опа́здывает в связи́ с плохо́й пого́дой.", "Самолёт опозда́ет в связи́ с плохо́й пого́дой."]
        rubric: ["书面语用 [в связи́ с]{.ru} + 第五格 [плохо́й пого́дой]{.ru}", "不用口语的 [из-за́]{.ru}"]
      - zh: （给朋友的短信）明天打个电话？
        accept: ["Позвони́шь за́втра?", "За́втра позвони́шь?", "Ты позвони́шь за́втра?", "Ты за́втра позвони́шь?"]
        rubric: ["口语用问句表示请求", "[позвони́шь]{.ru}：完成体将来时"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Каки́е два сообще́ния ну́жно бы́ло написа́ть Ван Лэ́ю? Что он снача́ла написа́л в декана́т и что сказа́ла А́нна? Как они́ написа́ли сообще́ние вме́сте? Каку́ю оши́бку Ван Лэй сде́лал в сообще́нии Ди́ме? Каки́е отве́ты он получи́л?]{.ru}"
        length: 70–100
        model: "Ван Лэ́ю ну́жно бы́ло написа́ть два сообще́ния: в декана́т, потому́ что ему́ нужна́ спра́вка об обуче́нии, и Ди́ме, что́бы попроща́ться пе́ред отъе́здом. Снача́ла он написа́л в декана́т «Приве́т!» и «Сде́лайте до четверга́». А́нна сказа́ла, что так пи́шут дру́гу. Вме́сте они́ написа́ли официа́льное сообще́ние: «Уважа́емые сотру́дники декана́та», «Прошу́ вас подгото́вить», «С уваже́нием». А Ди́ме Ван Лэй снача́ла написа́л сли́шком официа́льно, как в декана́т. Пото́м он написа́л про́сто: «Прив! В четве́рг улета́ю». Ве́чером из декана́та сообщи́ли, что спра́вка гото́ва, а Ди́ма отве́тил, что позвони́т. Пото́м они́ проговори́ли це́лый час."
        rubric: ["回答全部五个问题", "说清两条消息各自的语体错误", "转述时人称和时正确"]
        notes: 范文约 85 词。引用信里的套语时可以直接放在引号里；回信的内容用间接引语转述：[сообщи́ли, что спра́вка гото́ва]{.ru}，[отве́тил, что позвони́т]{.ru}（原话将来时，转述仍是将来时）。

  - id: e5
    type: open
    task: 作文：同一件事，两种写法。
    items:
      - prompt: 你下星期一因为生病不能去上课。先给奥尔加·维克托罗夫娜写一封正式的电子邮件说明情况、请她把作业发给你；再就同一件事给朋友发一条短信。两段合起来 100–150 词，注意两种语体在称呼、用词、句子上的区别。
        length: 100–150
        model: "Уважа́емая О́льга Ви́кторовна!\nВ понеде́льник я не смогу́ быть на заня́тиях в связи́ с боле́знью. У меня́ высо́кая температу́ра, и врач сказа́л, что мне необходи́мо оста́ться до́ма три дня. Спра́вку от врача́ я принесу́ в четве́рг. Прошу́ Вас сообщи́ть мне дома́шнее зада́ние: я хочу́ подгото́виться к сле́дующему уро́ку. Зара́нее благодарю́.\nС уваже́нием,\nВан Лэй\n\nПьер, прив! Я заболе́л: температу́ра, ка́шель((( В понеде́льник меня́ не бу́дет. Ска́жешь О́льге Ви́кторовне? И пришли́ фо́то дома́шнего зада́ния, ок? Спс! Пока́)"
        rubric: ["正式邮件：[Уважа́емая]{.ru} + 名字和父称，[Вы]{.ru}，[Прошу́ Вас]{.ru} + 不定式，[С уваже́нием]{.ru} 和全名", "短信：[ты]{.ru}，问句表示请求，可以有缩略和省略", "两段内容一致，语体区分清楚", "合计 100–150 词"]
        notes: 两段说的是同一件事。正式邮件用 [в связи́ с боле́знью]{.ru}、[необходи́мо]{.ru}、[Прошу́ Вас сообщи́ть]{.ru}、[Зара́нее благодарю́]{.ru}，句子完整；短信用 [прив, ок, спс]{.ru}，用问句 [Ска́жешь О́льге Ви́кторовне?]{.ru} 表示请求，[(((]{.ru} 表示难过。

  - id: e6
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。回国前，给奥尔加·维克托罗夫娜写一封正式的告别信（电子邮件）：感谢她这一年的教导，说说你最大的收获，告诉她你什么时候回国，祝她一切都好。注意正式信件的格式和用语。
        length: 80–120
        model: |
          Уважа́емая О́льга Ви́кторовна!

          Пятна́дцатого ию́ля я уезжа́ю в Пеки́н и хочу́ поблагодари́ть Вас за э́тот год.

          Когда́ я прие́хал в Москву́, я ма́ло понима́л по-ру́сски. Благодаря́ Ва́шим уро́кам я тепе́рь свобо́дно говорю́, чита́ю ру́сские кни́ги и да́же пишу́ статьи́. Осо́бенно мне помогли́ Ва́ши объясне́ния грамма́тики и на́ши экску́рсии. Тепе́рь у меня́ одно́ жела́ние — и да́льше изуча́ть ру́сский язы́к и стать перево́дчиком.

          Жела́ю Вам здоро́вья и успе́хов! Наде́юсь, что мы ещё встре́тимся.

          С уваже́нием,
          Ван Лэй
        rubric: ["称呼 [Уважа́емая О́льга Ви́кторовна!]{.ru}，[Вы]{.ru} 的各种形式大写", "有感谢、收获、回国时间和祝愿", "用书面语的词和动名词：[объясне́ния, жела́ние]{.ru} 等", "结尾 [С уваже́нием]{.ru} 和全名"]
        notes: 范文开头一句说明写信的目的，中间一段讲收获，结尾一段祝愿。[Благодаря́ Ва́шим уро́кам]{.ru}：[благодаря́]{.ru} + 复数第三格。[Жела́ю Вам здоро́вья и успе́хов]{.ru}：[жела́ть]{.ru} 后面祝愿的内容用第二格，是正式信件常用的结尾。
