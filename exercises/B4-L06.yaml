lesson: B4-L06
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量用自己的话。
    items:
      - prompt: "[Каким увидел Пантен капитана, когда тот вернулся на корабль? Какие распоряжения дал Грэй и что подумал о них Пантен? Сколько лавок обошёл Грэй и что он нашёл в каждой? Каким был цвет, который выбрал Грэй? Как вёл себя хозяин лавки, когда узнал, сколько шёлка нужно капитану?]{.ru}"
        length: 90–130
        model: "Вернувшись на «Секрет», Грэй долго стоял неподвижно и странно улыбался, и Пантен решил, что с капитаном что-то случилось. Грэй приказал поднять якорь и перейти в устье Лилианы, отказался от выгодного фрахта и попросил ни о чём его не спрашивать. Пантен подумал, что капитан хочет заняться контрабандой или даже стать пиратом. Грэй обошёл три лавки: в первых двух ему показывали шёлк простых базарных цветов, а в третьей он нашёл много оттенков красного. Наконец он нашёл совершенно чистый алый цвет, без смешанных оттенков и без тени, полный благородного веселья. Когда Грэй сказал, что ему нужно две тысячи метров, хозяин начал подскакивать от радости, назвал очень высокую цену и проводил покупателя с большими почестями."
        rubric: ["五个问题都回答，内容与选文一致", "写出潘顿的误会（走私、海盗）", "说出理想颜色的特点：纯净、没有杂色、没有阴影", "店主的反应：激动、抬价、恭送"]
        notes: "第 4 题可以借用选文的词句，但最好改成自己的句子，比如把否定的描写（[не было… ни синевы, ни тени]{.ru}）改成肯定的说法（[совершенно чистый цвет]{.ru}）。"

  - id: e2
    type: translate
    task: 用俄语解释下列词语在选文中的意思（可以下定义，也可以用同义说法）。
    items:
      - zh: "[замешательство]{.ru}"
        accept: ["Состояние, когда человек не знает, что делать или сказать.", "Когда человек не знает, как себя вести.", "Когда человек не может сразу понять, как поступить."]
        rubric: ["说明是慌乱、不知所措"]
      - zh: "[тщеславие]{.ru}"
        accept: ["Желание, чтобы все тобой восхищались.", "Желание казаться лучше других.", "Любовь к славе."]
        rubric: ["说明是希望别人夸奖、羡慕的心理"]
      - zh: "[оттенок]{.ru}"
        accept: ["Один из вариантов цвета, например светлый или тёмный.", "Небольшое отличие в цвете.", "Светлый или тёмный вариант одного цвета."]
        rubric: ["说明是同一颜色的不同浓淡、色调"]
      - zh: "[торговаться]{.ru}"
        accept: ["Спорить с продавцом о цене, чтобы купить дешевле.", "Просить продавца сделать цену ниже.", "Спорить о цене."]
        rubric: ["说明是买卖双方就价钱争论、讲价"]
      - zh: "[алый]{.ru}"
        accept: ["Яркий, чистый красный цвет.", "Очень яркий красный.", "Красный, очень яркий."]
        rubric: ["说明是鲜艳的红色"]

  - id: e3
    type: choice
    task: 选择正确答案。
    why: "第 1 题 [Грэй был серьёзен, как анатом]{.ru} 用解剖学家比喻格雷挑选绸子时的专注和精确，并不是说他学过医。第 2 题作者说几种红色“看上去像是一家，其实各不相同”，就像意思相近的形容词 [«очаровательно» — «прекрасно» — «великолепно» — «совершенно»]{.ru}，是把颜色比作同义词。第 3 题理想的颜色是用否定来写的：[не было смешанных оттенков… ни синевы, ни тени]{.ru}，强调它纯净。第 4 题 [как пружинный]{.ru}、[с почестями китайского короля]{.ru} 这些比喻用在店主身上，制造的是幽默效果，与写格雷时的抒情不同。第 5 题 [как прошлогодний снег]{.ru} 是熟语，表示“毫无用处”，和天气、季节无关。"
    items:
      - stem: "Сравнение «серьёзен, как анатом» показывает, что Грэй ___."
        options: [выбирает шёлк очень внимательно, раньше изучал медицину, не любит хозяина лавки]
        answer: выбирает шёлк очень внимательно
      - stem: Оттенки красного автор сравнивает ___.
        options: ["со словами, близкими по смыслу", с утренним небом, с картинами художника]
        answer: "со словами, близкими по смыслу"
      - stem: "Настоящий алый цвет описан в основном через то, ___."
        options: [чего в нём нет, сколько он стоит, где его сделали]
        answer: чего в нём нет
      - stem: "Сравнения «как пружинный» и «с почестями китайского короля» о хозяине лавки звучат ___."
        options: [смешно, печально, торжественно]
        answer: смешно
      - stem: "Слова «выгодный фрахт мне нужен как прошлогодний снег» значат, что фрахт ___."
        options: [совсем не нужен Грэю, нужен Грэю зимой, был у Грэя в прошлом году]
        answer: совсем не нужен Грэю

  - id: e4
    type: fill
    task: 用括号里的颜色词的适当形式填空，句子取自选文。
    why: "颜色形容词要和所说明的名词在性、数、格上一致。第 1 题 [множество]{.ru} 后面接复数第二格：[алых полос]{.ru}。第 2 题 [волна]{.ru} 阴性单数第一格：[пурпурная]{.ru}。第 3 题 [отсвет]{.ru} 阳性单数第一格：[розовый]{.ru}。第 4 题 [тонов]{.ru} 复数第二格，形容词也用复数第二格：[оранжевых]{.ru}。第 5 题 [струя]{.ru} 阴性单数第一格，形容词放在名词前：[алая]{.ru}。第 6 题 [намёков]{.ru} 复数第二格：[лиловых]{.ru}。"
    items:
      - stem: Он смотрел на свет такое множество ___ полос, что прилавок, казалось, вспыхнет.
        hint: алый
        accept: ["алых"]
      - stem: На носок сапога Грэя легла ___ волна.
        hint: пурпурный
        accept: ["пурпурная"]
      - stem: На его руках и лице блестел ___ отсвет.
        hint: розовый
        accept: ["розовый"]
      - stem: Здесь были густые закипи вишнёвых, ___ и мрачно-рыжих тонов.
        hint: оранжевый
        accept: ["оранжевых"]
      - stem: Этот совершенно чистый, как ___ утренняя струя, цвет искал Грэй.
        hint: алый
        accept: ["алая"]
      - stem: В нём не было игры фиолетовых или ___ намёков.
        hint: лиловый
        accept: ["лиловых"]

  - id: e5
    type: open
    task: 概要写作。用俄语把选文压缩成 150 词左右的概要，用第三人称叙述。
    items:
      - prompt: "[Напишите краткое изложение отрывка из повести «Алые паруса».]{.ru}"
        length: 130–170
        model: "Капитан Грэй вернулся на свой корабль «Секрет» таким странным, что его помощник Пантен решил, будто с ним что-то случилось. Грэй отказался от выгодного фрахта, приказал поднять якорь и перейти в устье реки Лилианы, а матросам велел сказать, что кораблю нужен ремонт. Объяснять ничего он не стал. Пантен ничего не понял и подумал, что капитан хочет заняться контрабандой или стать пиратом. Тем временем Грэй отправился в город Лисс. Он точно знал, какой цвет ему нужен, и обошёл три лавки. В первых двух был только шёлк простых цветов, а в третьей хозяин показал ему множество оттенков красного. Грэй долго и внимательно выбирал и наконец нашёл совершенно чистый, гордый алый цвет без всяких других оттенков. Он купил две тысячи метров этого шёлка. Хозяин лавки, не веря своему счастью, назвал очень высокую цену, но Грэй не стал торговаться, договорился о доставке и ушёл."
        rubric: ["130–170 词", "两个部分：船上和潘顿的对话；进城挑绸子", "写出理想颜色的特点", "结尾：买下两千米，不讲价", "不加评论，不照抄长句"]
        notes: "范文约 139 词。颜色的描写在概要里只能保留一两个关键词（[чистый]{.ru}、[гордый]{.ru}、[алый]{.ru}），比喻都要省去。潘顿的独白改成间接说法：[подумал, что капитан хочет заняться контрабандой]{.ru}。"

  - id: e6
    type: open
    task: 作文。用俄语写一篇 250—300 词的短文。
    items:
      - prompt: "[«Можно ли сделать чудо своими руками?» Грэй решил сам сделать так, чтобы мечта девушки сбылась. Как вы относитесь к его поступку? Был ли в вашей жизни или в жизни ваших знакомых случай, когда кто-то сделал «чудо» для другого человека?]{.ru}"
        length: 250–300
        model: "Обычно мы думаем, что чудо — это то, что приходит само, без нашего участия. Герой повести Грина думает иначе. Капитан Грэй узнаёт, что бедной девушке когда-то сказали: за ней придёт корабль под алыми парусами. Он мог бы просто улыбнуться, услышав эту детскую сказку. Но Грэй решает сам сделать так, чтобы сказка стала правдой. Он покупает две тысячи метров алого шёлка, ищет музыкантов и готовит корабль. Мне нравится, как серьёзно он к этому относится. В лавке он выбирает цвет «как анатом», потому что хочет, чтобы всё было совершенно. Для него это не игра и не способ показать свои деньги, а настоящая работа художника. Можно сказать, что Грэй поступает немного странно: он тратит огромные деньги на один день. Но, по-моему, в этом и есть смысл его поступка. Человек, который верил в чудо всю жизнь, наконец видит, что мир его не обманул. Такое счастье нельзя купить, но можно подарить. Конечно, в жизни редко бывают алые паруса. Но маленькие чудеса бывают. Когда моя бабушка болела, она часто говорила, что хотела бы ещё раз увидеть море, у которого прошла её молодость. Ехать далеко она уже не могла. Тогда мой брат снял на видео целый день на этом море: волны, старую пристань, улицу, где она жила, — и привёз ей. Бабушка смотрела и плакала от радости. Брат ничего особенного не сделал, у него не было ни корабля, ни шёлка. Но для бабушки это был её алый парус. Я думаю, Грин прав: чудо можно сделать своими руками. Для этого нужно не много денег, а внимание к другому человеку и желание сделать его счастливым."
        rubric: ["250–300 词", "表明对格雷行为的态度并说明理由", "引用选文细节（挑选颜色、两千米绸子等）", "有一个生活中的具体例子", "结论呼应题目"]
        notes: "范文约 254 词。结构：一、提出“奇迹是自己来的”这一常见看法，引出格雷的不同态度；二、分析格雷的行为（认真、像艺术家），承认它也许奇怪，再说明意义；三、生活中的例子；四、结论。注意 [сделать так, чтобы…]{.ru}（设法使……）这个句式，是本题的关键表达。"
