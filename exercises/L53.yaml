lesson: L53
grammar: "年龄的表达：第三格 + 数词 + [год / го́да / лет]{.ru}；问句 [Ско́лько + 第三格 + лет?]{.ru}；过去时用 [бы́ло]{.ru}（以 1 结尾用 [был]{.ru}），将来时用 [бу́дет]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择 [год]{.ru}、[го́да]{.ru} 或 [лет]{.ru}。
    why: 看最后一个数词：1 用 [год]{.ru}，2–4 用 [го́да]{.ru}，5–20 和以零结尾的数用 [лет]{.ru}。第 3 题 [четы́рнадцать]{.ru} 不是 [четы́ре]{.ru}，用 [лет]{.ru}；第 4 题 [два́дцать оди́н]{.ru} 最后一个词是 [оди́н]{.ru}，用 [год]{.ru}；第 6 题 [со́рок]{.ru} 以零结尾，用 [лет]{.ru}。
    items:
      - stem: Му́рке три ___.
        options: [год, го́да, лет]
        answer: го́да
      - stem: Мне два́дцать ___.
        options: [год, го́да, лет]
        answer: лет
      - stem: Ми́ше бу́дет четы́рнадцать ___.
        options: [год, го́да, лет]
        answer: лет
      - stem: Бра́ту два́дцать оди́н ___.
        options: [год, го́да, лет]
        answer: год
      - stem: Ма́ме со́рок шесть ___.
        options: [год, го́да, лет]
        answer: лет
      - stem: Па́пе со́рок ___.
        options: [год, го́да, лет]
        answer: лет
      - stem: Ба́бушке се́мьдесят два ___.
        options: [год, го́да, лет]
        answer: го́да

  - id: e2
    type: rewrite
    task: 按例句说出年龄。
    placeholder: Ей … лет.
    example:
      cue: А́нна — 19
      answer: А́нне девятна́дцать лет.
    why: 说年龄的人用第三格：[А́нна → А́нне]{.ru}，[Ми́ша → Ми́ше]{.ru}，[па́па → па́пе]{.ru}，[я → мне]{.ru}，[она́ → ей]{.ru}。名词按第 51 课的规则变，代词按第 52 课的表变。[год]{.ru} 的形式看最后一个数词。
    items:
      - cue: Ми́ша — 13
        accept: ["Ми́ше трина́дцать лет."]
      - cue: па́па — 49
        accept: ["Па́пе со́рок де́вять лет."]
      - cue: я — 20
        accept: ["Мне два́дцать лет."]
      - cue: она́ — 3
        accept: ["Ей три го́да."]
      - cue: он — 41
        accept: ["Ему́ со́рок оди́н год."]
      - cue: Ива́н Серге́евич — 49
        accept: ["Ива́ну Серге́евичу со́рок де́вять лет."]

  - id: e3
    type: fill
    task: 用 [был]{.ru}、[бы́ло]{.ru} 或 [бу́дет]{.ru} 填空。
    why: 过去的年龄用 [бы́ло]{.ru}，数词以 [оди́н]{.ru} 结尾时用 [был]{.ru}（和 [год]{.ru} 一致）；将来一律用 [бу́дет]{.ru}。容易错的是按人的性别变：第 1 题说的是奶奶，但动词不用 *[была́]{.ru}*，因为主语是数词，不是 [ба́бушка]{.ru}。
    items:
      - stem: Вчера́ ба́бушке ___ се́мьдесят пять лет.
        accept: [бы́ло]
      - stem: Двадца́того ноября́ Ми́ше ___ четы́рнадцать лет.
        accept: [бу́дет]
      - stem: Год наза́д А́нне ___ восемна́дцать лет.
        accept: [бы́ло]
      - stem: Год наза́д Ми́ше ___ двена́дцать лет.
        accept: [бы́ло]
      - stem: Год наза́д па́пе ___ со́рок во́семь лет, а за́втра ему́ ___ пятьдеся́т.
        accept: ["бы́ло, бу́дет", "бы́ло бу́дет"]

  - id: e4
    type: translate
    task: 译成俄语。
    why: 都用“第三格 + 数词 + [год / го́да / лет]{.ru}”。
    items:
      - zh: ——你多大了？——我二十岁。
        accept: ["— Ско́лько тебе́ лет? — Мне два́дцать лет.", "— Ско́лько тебе́ лет? — Мне два́дцать.", "— Ско́лько вам лет? — Мне два́дцать лет.", "— Ско́лько вам лет? — Мне два́дцать."]
        rubric: ["问句结构 [Ско́лько + 第三格 + лет]{.ru}", "答句用 [мне]{.ru}，不用 [я]{.ru}"]
      - zh: 穆尔卡三岁。
        accept: ["Му́рке три го́да."]
        rubric: ["[Му́рке]{.ru} 用第三格", "[три]{.ru} 后面用 [го́да]{.ru}"]
      - zh: 11 月 20 日米沙就满十四岁了。
        accept: ["Двадца́того ноября́ Ми́ше бу́дет четы́рнадцать лет.", "Ми́ше бу́дет четы́рнадцать лет двадца́того ноября́."]
        rubric: ["日期用第二格 [двадца́того ноября́]{.ru}", "将来用 [бу́дет]{.ru}", "[четы́рнадцать]{.ru} 后用 [лет]{.ru}"]
      - zh: 昨天奶奶满七十五岁。
        accept: ["Вчера́ ба́бушке бы́ло се́мьдесят пять лет.", "Ба́бушке вчера́ бы́ло се́мьдесят пять лет."]
        rubric: ["过去用 [бы́ло]{.ru}，不随“奶奶”变成 [была́]{.ru}", "[ба́бушке]{.ru} 用第三格"]
      - zh: 他的哥哥二十一岁。
        accept: ["Его́ бра́ту два́дцать оди́н год.", "Его́ ста́ршему бра́ту два́дцать оди́н год."]
        rubric: ["[его́]{.ru} 不变格，[бра́ту]{.ru} 用第三格", "[два́дцать оди́н]{.ru} 后用 [год]{.ru}"]

  - id: e5
    type: open
    task: 介绍你的家人：每个人叫什么、多大年纪、喜欢什么。
    items:
      - prompt: 写 5–7 句话，至少说出三个人的年龄，至少用两次 [нра́вится / нра́вятся]{.ru}。
        length: 40–80
        model: "Меня́ зову́т Ли Мин. Мне два́дцать оди́н год. Ма́ме со́рок шесть лет, а па́пе со́рок де́вять. Ма́ма врач, ей нра́вится её рабо́та. Па́па инжене́р, ему́ нра́вятся маши́ны. У меня́ есть сестра́. Её зову́т Ли На, ей двена́дцать лет. Ей нра́вятся ко́шки."
        rubric: ["年龄句都用第三格", "[год / го́да / лет]{.ru} 与数词搭配正确", "[нра́вится / нра́вятся]{.ru} 与主语一致"]
        notes: 范文先介绍自己，再按父母、兄弟姐妹的顺序介绍家人。每人两句：一句年龄，一句爱好。第三句里 [па́пе со́рок де́вять]{.ru} 省去了 [лет]{.ru}，因为前面刚说过，口语里很自然。注意 [ему́ нра́вятся маши́ны]{.ru} 主语是复数，用 [нра́вятся]{.ru}。
