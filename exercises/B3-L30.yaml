  - id: e10
    type: open
    task: 理解问答。读复习课文，用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[О чём была лекция Смирновой? Что общего у слов «близость», «сходство», «изучение» и «цивилизация»? Как называют студентку в группе, дома и когда брат сердится? Почему правильно говорить «чёрный кофе» и «МГУ основан»? От чего, вероятно, образована фамилия Смирнова? О чём спросил молчаливый мальчик?]{.ru}"
        length: 80–110
        model: "Лекция была о том, что может рассказать одно слово. Слова «близость», «сходство», «изучение» и «цивилизация» образованы с помощью разных суффиксов, но все они называют не вещи, а то, что нельзя увидеть или взять в руки. В группе студентку зовут Машей, мама называет её Машенькой, а младший брат, когда сердится, — Машкой. «Чёрный кофе» правильно потому, что по норме слово «кофе» мужского рода. А «МГУ основан» говорят потому, что главное слово полного названия — «университет». Фамилия Смирнова, вероятно, образована от прозвища предка, смирного человека. Молчаливый мальчик спросил, правда ли, что тринадцать — несчастливое число."
        rubric: ["六个问题都回答，内容与课文一致", "[зовут / называет кого кем]{.ru}：名字用第五格 [Машей, Машенькой, Машкой]{.ru}", "[МГУ]{.ru} 和 [кофе]{.ru} 的性说清理由", "最后一问用间接问句 [правда ли, что…]{.ru}"]
        notes: 第 3 题三个名字都是 [звать, называть]{.ru} 要求的第五格。第 4 题要分别说出两个理由：[кофе]{.ru} 是例外，按规范为阳性；[МГУ]{.ru} 的性由全称的主要词决定。第 6 题把直接问句改成间接问句，用语气词 [ли]{.ru}。

  - id: e11
    type: open
    task: 按给定的主题句写一个段落。主题句放在段首，后面用例子说明，最后一句收束全段。
    items:
      - prompt: "主题句：[Каждое слово — это маленький рассказ о прошлом.]{.ru} 从本单元学过的内容中至少选四类词举例（如带后缀的名词、指小表爱形式、外来词、缩略词或复合词、姓氏），说明它们能告诉我们什么；至少用两个姓氏或地名的间接格形式，注意不变格名词的一致关系。"
        length: 140–160
        model: "Каждое слово — это маленький рассказ о прошлом. Возьмём, например, фамилию Кузнецов. Она образована от слова «кузнец», и мы сразу понимаем, что предок Кузнецовых был мастером, а не купцом или крестьянином. Слово «тетрадь» пришло из греческого вместе с христианством, а «гавань» и «матрос» — из голландского, когда Пётр I строил флот. Сокращения тоже помнят свою эпоху: многие из них появились в 1920-е годы, когда новое государство создавало новые учреждения. А сложные слова «самолёт» и «пароход» показывают, как люди называли новые машины. Даже уменьшительные суффиксы говорят о жизни народа. Русские называют близких людей Сашенькой или Леночкой, а в уютном кафе вежливо просят подождать минуточку. Это рассказывает о том, как важны в России тёплые отношения между людьми. Поэтому, изучая происхождение слов, мы изучаем и историю народа, который на этом языке говорит."
        rubric: ["第一句是给定的主题句，有收束句，约 150 词", "至少四类词的例子，每个例子都说明它告诉我们什么", "至少两个姓氏或名字的间接格形式（如 [Кузнецовых, Сашенькой]{.ru}），变格正确", "不变格名词的一致关系正确（如 [в уютном кафе]{.ru}）；至少一个副动词短语或 [который]{.ru} 从句"]
        notes: 范文约 150 词，按“姓氏—外来词—缩略词和复合词—指小表爱形式”的顺序举例，每个例子后面都说明它反映了什么历史或生活。[предок Кузнецовых]{.ru} 用复数第二格表示一家人；[называют … Сашенькой или Леночкой]{.ru} 用第五格；[в уютном кафе]{.ru}：形容词和不变格名词一致，用中性第六格。收束句用副动词短语 [изучая происхождение слов]{.ru} 和 [который]{.ru} 从句，把全段归结到“学词就是学历史”上。
