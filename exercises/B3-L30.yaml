lesson: B3-L30
heading: 单元测试
intro: "答对 80% 以上进入下一单元。本测试覆盖第三单元的构词法和词汇学：名词、人称名词和形容词的后缀，指小表爱后缀，外来词和缩略词的性与变格，复合词，姓氏与地名的变格，动词前缀的非运动意义，“说话”类近义词。没有达到 80% 的，按出错的题回看：第 1 题回看第 21、23、26 课，第 2 题回看第 21、24 课，第 3 题回看第 22、25 课，第 4 题回看第 27 课，第 5 题回看第 28 课，第 6 题回看第 29 课，第 7 题回看第 25、26 课，第 8 题回看第 21 课，第 9 题按各小题的语法点回看相应的课，第 11 题的写法回看本单元各课最后一道练习，复习后重做。"
grammar: "名词后缀 [-ость, -ство, -ние, -ация]{.ru}；指小表爱后缀 [-ок, -ик, -очк-, -еньк-]{.ru}；外来词的性与变格；人称名词后缀 [-тель, -ист, -чик, -щик, -ец]{.ru}；形容词后缀 [-ск-, -н-, -ов-, -лив-]{.ru}；复合词与缩略词；姓氏与地名的变格；前缀 [по-, за-, на-, раз-]{.ru} 的非运动意义；[говорить, сказать, разговаривать, беседовать]{.ru} 辨析。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式，注意名词的性和变格。
    why: "第 1 题 [кофе]{.ru} 按规范是阳性：[горячий кофе]{.ru}；选中性 [горячее]{.ru} 是口语说法，考试里不用。第 2 题按字母读的缩略词看全称的主要词，[МГУ]{.ru} 的主要词是 [университет]{.ru}，阳性：[основан]{.ru}；最常见的错误是看到 [У]{.ru} 结尾就以为是阴性。第 3 题 [такси]{.ru} 是不变格的物品名词，中性：[новое такси]{.ru}，谓语 [стояло]{.ru} 也是中性。第 4 题 [-ость]{.ru} 名词都是阴性：[большая близость]{.ru}。第 5 题不变格的动物名词是阳性：[смешной кенгуру]{.ru}。第 6 题地名按类名定性，[Сочи]{.ru} 是城市（[город]{.ru}），阳性：[Солнечный Сочи]{.ru}。第 7 题按单词读、以辅音结尾的缩略词像阳性名词一样变格：[в вузе]{.ru}。第 8 题 [МИД]{.ru} 按单词读、以辅音结尾，像阳性名词一样变格：[в МИДе]{.ru}，格词尾用小写，直接接在后面；按字母读的 [МГУ]{.ru} 就不变格。"
    items:
      - stem: В этом кафе всегда есть ___ кофе.
        options: [горячий, горячее, горячая]
        answer: горячий
      - stem: МГУ ___ в 1755 году.
        options: [основан, основана, основано]
        answer: основан
      - stem: На улице стояло ___ такси.
        options: [новое, новый, новая]
        answer: новое
      - stem: Между этими языками есть ___ близость.
        options: [большая, большой, большое]
        answer: большая
      - stem: Это очень ___ кенгуру.
        options: [смешной, смешное, смешная]
        answer: смешной
      - stem: ___ Сочи ждёт гостей.
        options: [Солнечный, Солнечное, Солнечная]
        answer: Солнечный
      - stem: Моя сестра учится в другом ___.
        options: [вузе, вуз, вуза]
        answer: вузе
      - stem: Мой брат работает в ___.
        options: [МИДе, МИД, МИДа]
        answer: МИДе

  - id: e2
    type: fill
    task: 由括号里的词构成名词，用正确的格填空。
    why: "第 1 题形容词 [случайный]{.ru} 加 [-ость]{.ru}：[случайность]{.ru}，阴性，作谓语用第一格。第 2 题 [заниматься]{.ru} 要求第五格，[изучать → изучение]{.ru}，第五格 [изучением]{.ru}；后面的 [истории]{.ru} 是第二格，因为动词的直接宾语变成名词后改用第二格。第 3 题 [приня́ть → приня́тие]{.ru}（[-тие]{.ru}），[после]{.ru} 要求第二格：[принятия]{.ru}。第 4 题 [дети → детство]{.ru}，中性：[счастливое детство]{.ru}。第 5 题 [собирать]{.ru} 去掉 [-ть]{.ru} 加 [-тель]{.ru}，[был]{.ru} 后用第五格，软变化：[собирателем]{.ru}。第 6 题 [перевод]{.ru} 的 [д]{.ru} 后写 [-чик]{.ru}：[переводчик]{.ru}，谓语 [работал]{.ru} 是阳性；写成 [-щик]{.ru} 是常见的拼写错误。第 7 题 [продавец]{.ru} 的阴性是 [продавщица]{.ru}，形容词 [молодая]{.ru} 提示要用阴性。第 8 题 [журнал]{.ru} 加 [-ист]{.ru}，[работать]{.ru} 后用第五格：[журналистом]{.ru}。"
    items:
      - stem: Это не ___, а правило.
        hint: случайный
        accept: ["случайность"]
      - stem: Учёные много лет занимаются ___ истории языка.
        hint: изучать
        accept: ["изучением"]
      - stem: После ___ христианства на Руси начали читать и переписывать книги.
        hint: принять
        accept: ["принятия"]
      - stem: У моего отца было счастливое ___.
        hint: дети
        accept: ["детство"]
      - stem: Даль был известным ___ пословиц.
        hint: собирать
        accept: ["собирателем"]
      - stem: На встрече с китайскими гостями работал опытный ___.
        hint: перевод
        accept: ["переводчик"]
      - stem: В магазине нам помогла молодая ___.
        hint: продавец
        accept: ["продавщица"]
      - stem: Мой старший брат работает ___.
        hint: журнал
        accept: ["журналистом"]

  - id: e3
    type: fill
    task: 用括号里的词构成指小表爱形式或形容词，填入正确形式。
    why: "第 1 题 [стол]{.ru} 的指小形式是 [столик]{.ru}，不说 [столок]{.ru}：[-ик]{.ru} 和 [-ок]{.ru} 要逐词记。第 2 题“二次指小” [минута → минутка → минуточка]{.ru}，[подождать]{.ru} 后用第四格 [минуточку]{.ru}。第 3 题形容词加 [-еньк-]{.ru}：[свежий → свеженький]{.ru}，和 [хлеб]{.ru} 一致，第四格同第一格。第 4 题 [сынок]{.ru} 变格时 [о]{.ru} 脱落，重音移到词尾，第三格 [сынку]{.ru}，不能写成 [сыноку]{.ru}。第 5 题表示材料用 [-янн-]{.ru}，写两个 [н]{.ru}：[деревянный]{.ru}。第 6 题 [-еск-]{.ru} 前 [г]{.ru} 变 [ж]{.ru}，带 [по-]{.ru} 的副词：[по-дружески]{.ru}。第 7 题 [молчать]{.ru} 加 [-лив-]{.ru}：[молчаливый]{.ru}，性质形容词，可以和 [очень]{.ru} 连用。第 8 题 [ключ]{.ru} 以 [ч]{.ru} 结尾，重读时写 [-ев-]{.ru}：[ключевой]{.ru}，不写 [ключовой]{.ru}。"
    items:
      - stem: "Официант сказал: «Ваш ___ у окна»."
        hint: стол
        accept: ["столик"]
      - stem: Подождите ___, я сейчас вернусь!
        hint: минута
        accept: ["минуточку"]
      - stem: Продавщица предложила нам ___ хлеб.
        hint: свежий
        accept: ["свеженький"]
      - stem: Бабушка дала ___ пирожок.
        hint: сынок
        accept: ["сынку"]
      - stem: В саду стоял старый ___ стол.
        hint: дерево
        accept: ["деревянный"]
      - stem: Он улыбнулся и по-___ пожал мне руку.
        hint: друг
        accept: ["дружески"]
      - stem: Мой брат очень ___ человек, он может целый день не сказать ни слова.
        hint: молчать
        accept: ["молчаливый"]
      - stem: Это ___ вопрос всей лекции.
        hint: ключ
        accept: ["ключевой"]

  - id: e4
    type: choice
    task: 按规范选择姓氏或地名的正确形式。
    why: "第 1 题男性 [-ов]{.ru} 姓第五格用形容词词尾 [-ым]{.ru}：[со Смирновым]{.ru}。第 2 题城市名按普通阳性名词变格，第五格 [-ом]{.ru}：[под Пушкином]{.ru}；和诗人的 [Пушкиным]{.ru} 正好相反，这是本单元最容易混的一点。第 3 题女性 [-ова]{.ru} 姓第三格按形容词：[Петровой]{.ru}。第 4 题一家人用复数，第二格 [у Ивановых]{.ru}。第 5 题辅音结尾的外来姓，女性不变格：[у Марины Шмидт]{.ru}。第 6 题 [-ых]{.ru} 姓本来就是形容词复数第二格，不再变格：[с Иваном Черных]{.ru}。第 7 题 [-ово]{.ru} 地名按规范像中性名词变格：[в Иванове]{.ru}；口语里的 [в Иваново]{.ru} 不是规范形式。"
    items:
      - stem: Вчера я долго разговаривал с Сергеем ___.
        options: [Смирновым, Смирновом, Смирнове]
        answer: Смирновым
      - stem: Летом мы жили на даче под ___.
        options: [Пушкином, Пушкиным, Пушкине]
        answer: Пушкином
      - stem: Я написал письмо Анне ___.
        options: [Петровой, Петрове, Петрову]
        answer: Петровой
      - stem: В субботу мы были в гостях у ___.
        options: [Ивановых, Ивановов, Ивановах]
        answer: Ивановых
      - stem: Я взяла эту книгу у Марины ___.
        options: [Шмидт, Шмидты, Шмидте]
        answer: Шмидт
      - stem: Я давно знаком с Иваном ___.
        options: [Черных, Черныхом, Черныхе]
        answer: Черных
      - stem: Моя бабушка родилась в ___.
        options: [Иванове, Иваново, Ивановом]
        answer: Иванове

  - id: e5
    type: fill
    task: 给括号里的动词加前缀 [по-, за-, на-, раз-]{.ru}，按括号里的意思填入过去时的正确形式。
    why: "第 1、5 题表示动作突然开始，声音、情感动词加 [за-]{.ru}：[засмеялась, заплакал]{.ru}，常和 [вдруг]{.ru} 连用。第 2 题“一会儿”加 [по-]{.ru}：[погуляли]{.ru}，和 [немного]{.ru} 呼应。第 3 题“做出许多”加 [на-]{.ru}，宾语用第二格 [пирогов]{.ru}：[напекла]{.ru}（[печь]{.ru} 的过去时阴性 [пекла]{.ru}）。第 4 题“打碎”是 [раз-]{.ru}：[разбил]{.ru}。第 6 题“让人吃饱”是 [накормить]{.ru}：[накормила]{.ru}。第 7 题 [раз-]{.ru} + 形容词词根 + [-еть]{.ru} 表示“变成”：[разбогател]{.ru}。"
    items:
      - stem: Царевна вдруг ___.
        hint: смеяться，开始
        accept: ["засмеялась"]
      - stem: Мы немного ___ в парке и пошли домой.
        hint: гулять，一会儿
        accept: ["погуляли"]
      - stem: К празднику бабушка ___ пирогов.
        hint: печь，许多
        accept: ["напекла"]
      - stem: Кто ___ мою чашку?
        hint: бить，打碎
        accept: ["разбил"]
      - stem: Ребёнок испугался и вдруг ___.
        hint: плакать，开始
        accept: ["заплакал"]
      - stem: Баба-яга ___ гостя и уложила его спать.
        hint: кормить，吃饱
        accept: ["накормила"]
      - stem: Емеля так и не начал работать, но ___.
        hint: богатый，变成
        accept: ["разбогател"]

  - id: e6
    type: choice
    task: 选择恰当的动词。
    why: "第 1 题“会说某种语言”只能用 [говорить]{.ru}。第 2 题直接引语后说出一句话，用完成体 [сказала]{.ru}。第 3 题校长和家长正式地谈一个严肃的话题，用 [беседовал]{.ru}；[болтал]{.ru} 是口语里的闲聊，语体不合适。第 4 题 [с соседом]{.ru} 表示双方交谈，用 [разговаривали]{.ru}；[сказали]{.ru} 不能接 [с кем]{.ru}，也不能和 [целый час]{.ru} 连用。第 5 题 [ни слова]{.ru} 和 [произнести]{.ru} 搭配，侧重说出声音和词句。第 6 题“据说”是不定人称句 [говорят]{.ru}；[разговаривают, беседуют]{.ru} 都不能引出 [что]{.ru} 从句。"
    items:
      - stem: Моя подруга свободно ___ по-русски и по-китайски.
        options: [говорит, разговаривает, беседует]
        answer: говорит
      - stem: "«Постучу по дереву», — ___ преподавательница."
        options: [сказала, разговаривала, беседовала]
        answer: сказала
      - stem: Директор долго ___ с родителями о будущем школы.
        options: [беседовал, болтал, сказал]
        answer: беседовал
      - stem: Мы ___ с соседом о погоде целый час.
        options: [разговаривали, сказали, произнесли]
        answer: разговаривали
      - stem: Он так испугался, что не мог ___ ни слова.
        options: [произнести, разговаривать, беседовать]
        answer: произнести
      - stem: ___, что тринадцать — несчастливое число.
        options: [Говорят, Разговаривают, Беседуют]
        answer: Говорят

  - id: e7
    type: rewrite
    task: 用一个形容词、缩略词或复合词代替句中的词组，其余部分不变。
    why: "第 1—3 题用形容词代替“名词 + 第二格”或从句：[друг → дружеский]{.ru}（[-еск-]{.ru} 前 [г]{.ru} 变 [ж]{.ru}），[город → городской]{.ru}（词尾重读写 [-ской]{.ru}，复数第三格 [по городским улицам]{.ru}），[молчать → молчаливый]{.ru}（[-лив-]{.ru} 表示经常具有的特点）。第 4 题按字母读的缩略词 [МГУ]{.ru} 不变格：[в МГУ]{.ru}。第 5 题按单词读、以辅音结尾的 [вуз]{.ru} 像阳性名词一样变格：[в вузе]{.ru}。第 6 题由两个词的开头部分组成的 [универмаг]{.ru} 是普通名词，正常变格：[в универмаге]{.ru}。第 7 题第一个词的开头 + 整个第二个词：[медсестра]{.ru}，[работать]{.ru} 后用第五格 [медсестрой]{.ru}。"
    example:
      cue: В саду стоял стол из дерева.
      answer: В саду стоял деревянный стол.
    items:
      - cue: Это был жест друга.
        accept: ["Это был дружеский жест."]
      - cue: Мы долго гуляли по улицам города.
        accept: ["Мы долго гуляли по городским улицам."]
      - cue: Мой сосед — человек, который любит молчать.
        accept: ["Мой сосед — молчаливый человек."]
      - cue: Лена учится в Московском государственном университете.
        accept: ["Лена учится в МГУ."]
      - cue: Моя сестра учится в высшем учебном заведении.
        accept: ["Моя сестра учится в вузе."]
      - cue: Мама купила платье в универсальном магазине.
        accept: ["Мама купила платье в универмаге."]
      - cue: Моя тётя работает медицинской сестрой.
        accept: ["Моя тётя работает медсестрой."]

  - id: e8
    type: rewrite
    task: 把从句改成带 [-ние, -тие]{.ru} 的名词词组。
    why: "动词变成 [-ние, -тие]{.ru} 名词：从句的主语和直接宾语都改成第二格，[о]{.ru} 后的名词用第六格，词尾是 [-ии]{.ru}，不是 [-е]{.ru}。第 1 题单音节词根的 [принять]{.ru} 构成 [-тие]{.ru}：[о принятии христианства]{.ru}。第 2 题带 [-ся]{.ru} 的动词，名词里没有 [-ся]{.ru}：[развиваться → развитие]{.ru}，主语 [язык]{.ru} 改成第二格 [русского языка]{.ru}。第 3 题 [изучать → изучение]{.ru}，以元音开头的词前 [о]{.ru} 写成 [об]{.ru}；直接宾语 [историю]{.ru} 改成第二格 [истории]{.ru}，保留第四格是最常见的错误。第 4 题 [решать → решение]{.ru}，[такие задачи]{.ru} 改成复数第二格 [таких задач]{.ru}。第 5 题 [пригласить → приглашение]{.ru}，辅音交替 [с → ш]{.ru} 和被动形动词过去时 [приглашённый]{.ru} 相同；直接宾语改成复数第二格 [иностранных мастеров]{.ru}，带前置词的 [в Россию]{.ru} 保留不变。"
    example:
      cue: Учитель рассказал о том, как создали славянскую письменность.
      answer: Учитель рассказал о создании славянской письменности.
    items:
      - cue: Учитель рассказал о том, как Русь приняла христианство.
        accept: ["Учитель рассказал о принятии христианства.", "Учитель рассказал о принятии христианства на Руси.", "Учитель рассказал о принятии Русью христианства."]
      - cue: Учитель рассказал о том, как развивался русский язык.
        accept: ["Учитель рассказал о развитии русского языка."]
      - cue: Учитель рассказал о том, как учёные изучают историю языка.
        accept: ["Учитель рассказал об изучении истории языка.", "Учитель рассказал об изучении учёными истории языка."]
      - cue: Учитель рассказал о том, как надо решать такие задачи.
        accept: ["Учитель рассказал о решении таких задач."]
      - cue: Учитель рассказал о том, как Пётр I пригласил в Россию иностранных мастеров.
        accept: ["Учитель рассказал о приглашении в Россию иностранных мастеров.", "Учитель рассказал о приглашении иностранных мастеров в Россию.", "Учитель рассказал о приглашении Петром I в Россию иностранных мастеров.", "Учитель рассказал о приглашении Петром I иностранных мастеров в Россию."]

  - id: e9
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 莫斯科大学创建于 1755 年。
        accept: ["МГУ основан в 1755 году.", "МГУ был основан в 1755 году.", "Московский университет основан в 1755 году.", "Московский университет был основан в 1755 году.", "Московский государственный университет основан в 1755 году.", "Московский государственный университет был основан в 1755 году.", "В 1755 году был основан МГУ.", "В 1755 году был основан Московский университет."]
        rubric: ["[МГУ]{.ru} 是阳性（主要词 [университет]{.ru}）：[основан]{.ru}，不是 [основана]{.ru}", "[в 1755 году]{.ru}：[в]{.ru} + 第六格"]
      - zh: 这家舒适的咖啡馆里总有热咖啡。
        accept: ["В этом уютном кафе всегда есть горячий кофе.", "В этом уютном кафе всегда бывает горячий кофе.", "В этом уютном кафе всегда горячий кофе."]
        rubric: ["[кафе]{.ru} 不变格、中性：[в этом уютном кафе]{.ru}", "[кофе]{.ru} 阳性：[горячий кофе]{.ru}"]
