lesson: L30
heading: 单元测试
intro: 本测试覆盖第三单元全部语法。答对 80% 以上再进入第四单元；没有达到的，回到相应的课复习后重做。
grammar: "名词、人称代词、形容词和物主代词、指示代词第四格；[кого́]{.ru}；[идти́ / е́хать]{.ru} 与 [ходи́ть / е́здить]{.ru}；[куда́]{.ru} + [в / на]{.ru} + 第四格；[люби́ть]{.ru}、[хоте́ть]{.ru}、[уме́ть]{.ru}、[мочь]{.ru}；[есть]{.ru}、[пить]{.ru}、[спать]{.ru} 的变位；数词 1–12 与 [час]{.ru}；[в]{.ru} + 星期第四格，[у́тром, днём, ве́чером, но́чью]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式。
    why: 第 1、2 题：以 [-а]{.ru} 结尾的名词不论指女人还是男人，第四格都是 [-у]{.ru}。第 3 题：[Ива́н]{.ru} 是阳性动物名词，第四格加 [-а]{.ru}；[журна́л]{.ru} 是非动物名词，第四格不变（第 4 题），不要把动物名词的规则类推过去。第 5 题：[её]{.ru} 在这里自己作宾语，是 [она́]{.ru} 的第四格。第 6、7 题：阴性形容词和指示代词第四格是 [-ую]{.ru}、[-у]{.ru}；第 8 题 [друг]{.ru} 是阳性动物名词，[мой]{.ru} 要变成 [моего́]{.ru}。
    items:
      - stem: Я жду ___.
        options: [А́нна, А́нну]
        answer: А́нну
      - stem: Ми́ша ждёт ___.
        options: [па́па, па́пу]
        answer: па́пу
      - stem: Ты зна́ешь ___ Серге́евича?
        options: [Ива́н, Ива́на]
        answer: Ива́на
      - stem: Ми́ша чита́ет ___.
        options: [журна́л, журна́ла]
        answer: журна́л
      - stem: — Ты по́мнишь Ка́тю? — Да, я ___ по́мню.
        options: [она́, её]
        answer: её
      - stem: Я ищу́ ___ кни́гу.
        options: [ру́сская, ру́сскую, ру́сской]
        answer: ру́сскую
      - stem: Вы покупа́ете ___ откры́тку?
        options: [э́та, э́ту, э́то]
        answer: э́ту
      - stem: Я жду ___ дру́га.
        options: [мой, моего́, мою́]
        answer: моего́

  - id: e2
    type: rewrite
    task: 把表示所在的句子改成表示去向的句子。
    example:
      cue: Ма́ма на рабо́те. (идти́)
      answer: Ма́ма идёт на рабо́ту.
    why: 所在问 [где]{.ru}，用 [в / на]{.ru} + 第六格；去向问 [куда́]{.ru}，用 [в / на]{.ru} + 第四格，前置词不变。[консервато́рия]{.ru} 第六格是 [-ии]{.ru}，第四格是 [-ию]{.ru}。第 5 题 [до́ма]{.ru} 对应副词 [домо́й]{.ru}，不加前置词。去别墅路远，用 [е́хать]{.ru}。
    items:
      - cue: Ми́ша на уро́ке. (идти́)
        accept: [Ми́ша идёт на уро́к.]
      - cue: Ива́н Серге́евич на да́че. (е́хать)
        accept: [Ива́н Серге́евич е́дет на да́чу.]
      - cue: Мы в бассе́йне. (идти́)
        accept: [Мы идём в бассе́йн.]
      - cue: Студе́нты в консервато́рии. (идти́)
        accept: [Студе́нты иду́т в консервато́рию.]
      - cue: Я до́ма. (идти́)
        accept: [Я иду́ домо́й.]

  - id: e3
    type: choice
    task: 选择正确的运动动词。
    why: 说“这一趟”“此刻在路上”用定向动词 [идти́ / е́хать]{.ru}；有 [ка́ждый день, ча́сто, иногда́, всегда́]{.ru} 这类频率词、说的是经常往返，用不定向动词 [ходи́ть / е́здить]{.ru}。第 1 题有 [сейча́с]{.ru}，第 5 题是已经定好的一次安排，都用定向动词。步行还是乘车看情境：工厂、别墅远，坐车去。
    items:
      - stem: Сейча́с я ___ в магази́н.
        options: [иду́, хожу́]
        answer: иду́
      - stem: Па́па ка́ждый день ___ на заво́д.
        options: [е́дет, е́здит]
        answer: е́здит
      - stem: Мы ча́сто ___ в консервато́рию.
        options: [идём, хо́дим]
        answer: хо́дим
      - stem: Ми́ша, куда́ ты ___ так ра́но?
        options: [идёшь, хо́дишь]
        answer: идёшь
      - stem: В суббо́ту мы ___ на да́чу.
        options: [е́дем, е́здим]
        answer: е́дем
      - stem: Иногда́ Петро́вы ___ на да́чу.
        options: [е́дут, е́здят]
        answer: е́здят

  - id: e4
    type: fill
    task: 写出动词的正确形式。
    why: "[хоте́ть]{.ru} 单数按第一变位（[хочу́, хо́чешь, хо́чет]{.ru}），复数按第二变位（[хоти́м, хоти́те, хотя́т]{.ru}），不要写成 *[хо́чем]{.ru}。[мочь]{.ru} 的 [я]{.ru} 和 [они́]{.ru} 形式是 [г]{.ru}：[могу́, мо́гут]{.ru}。[люби́ть]{.ru}、[спать]{.ru} 的 [я]{.ru} 形式插入 [л]{.ru}：[люблю́, сплю]{.ru}。[есть]{.ru} 复数用词干 [ед-]{.ru}：[еди́те]{.ru}。第 3 题说的是学会的本领，用 [уме́ть]{.ru}。"
    items:
      - stem: Мы ___ идти́ на конце́рт.
        hint: хоте́ть
        accept: [хоти́м]
      - stem: Они́ не ___ пла́вать в холо́дной воде́.
        hint: мочь
        accept: [мо́гут]
      - stem: Ты ___ игра́ть в ша́хматы?
        hint: уме́ть
        accept: [уме́ешь]
      - stem: Я ___ слу́шать му́зыку.
        hint: люби́ть
        accept: [люблю́]
      - stem: Что вы ___ у́тром?
        hint: есть
        accept: [еди́те]
      - stem: Уже́ по́здно, я ___.
        hint: спать
        accept: [сплю]
      - stem: Ми́ша ___ чай.
        hint: пить
        accept: [пьёт]

  - id: e5
    type: fill
    task: 用括号里的词填空。
    why: "[час]{.ru} 的形式看数词：1 用 [час]{.ru}，2–4 用 [часа́]{.ru}，5–12 用 [часо́в]{.ru}。“在星期几”用 [в]{.ru} + 第四格：阴性 [среда́, пя́тница]{.ru} 变 [-у]{.ru}，[среда́]{.ru} 的重音前移成 [сре́ду]{.ru}；[вто́рник]{.ru} 前面写 [во]{.ru}。"
    items:
      - stem: Сейча́с три ___.
        hint: час
        accept: [часа́]
      - stem: В Пеки́не сейча́с де́вять ___.
        hint: час
        accept: [часо́в]
      - stem: ___ мы идём в консервато́рию.
        hint: среда́
        accept: [В сре́ду]
      - stem: ___ я хожу́ в бассе́йн.
        hint: вто́рник
        accept: [Во вто́рник]
      - stem: ___ ве́чером мы идём в кино́.
        hint: пя́тница
        accept: [В пя́тницу]

  - id: e6
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊晚上常去“列宁卡”，现在在读普希金；星期三去音乐学院；莫斯科五点时北京十点；王磊想下国际象棋，米沙不会下，但喜欢踢足球。
    items:
      - stem: Ве́чером Ван Лэй ча́сто хо́дит ___.
        options: [в «Ле́нинку», в бассе́йн]
        answer: в «Ле́нинку»
      - stem: Сейча́с Ван Лэй чита́ет ___.
        options: [Пу́шкина, Чайко́вского]
        answer: Пу́шкина
      - stem: В консервато́рию они́ иду́т ___.
        options: [в сре́ду, в четве́рг]
        answer: в сре́ду
      - stem: В Москве́ пять часо́в, а в Пеки́не ___.
        options: [де́сять, два]
        answer: де́сять
      - stem: Ми́ша ___ игра́ть в ша́хматы.
        options: [уме́ет, не уме́ет]
        answer: не уме́ет

  - id: e7
    type: translate
    task: 译成俄语。
    why: 第 1 题问人用 [кого́]{.ru}，[А́нна]{.ru} 第四格是 [А́нну]{.ru}。第 2 题“会”是学会的本领，用 [уме́ть]{.ru}；“今天游不了”是条件不允许，用 [мочь]{.ru}。第 3 题“星期六”用 [в]{.ru} + 第四格，别墅路远用 [е́хать]{.ru}，计划好的一次去向用现在时。
    items:
      - zh: 你在等谁？——我在等安娜。
        accept: ["— Кого́ ты ждёшь? — Я жду А́нну.", "— Кого́ ты ждёшь? — А́нну.", "— Ты кого́ ждёшь? — Я жду А́нну.", "— Ты кого́ ждёшь? — А́нну."]
        rubric: ["问人用 [кого́]{.ru}", "[ждать]{.ru} 的变位：[ждёшь, жду]{.ru}", "[А́нна]{.ru} 第四格 [А́нну]{.ru}"]
      - zh: 我会游泳，但今天游不了：水很冷。
        accept: ["Я уме́ю пла́вать, но сего́дня не могу́: вода́ о́чень холо́дная.", "Я уме́ю пла́вать, но сего́дня не могу́: вода́ холо́дная.", "Я уме́ю пла́вать, но сего́дня не могу́ пла́вать: вода́ о́чень холо́дная.", "Я уме́ю пла́вать, но сего́дня не могу́ пла́вать: вода́ холо́дная."]
        rubric: ["“会”用 [уме́ю]{.ru}", "“游不了”用 [не могу́]{.ru}", "[вода́]{.ru} 阴性，形容词用 [холо́дная]{.ru}"]
      - zh: 星期六我们坐车去别墅。
        accept: ["В суббо́ту мы е́дем на да́чу.", "Мы в суббо́ту е́дем на да́чу.", "Мы е́дем на да́чу в суббо́ту."]
        rubric: ["[в суббо́ту]{.ru}：[в]{.ru} + 第四格", "坐车用 [е́хать]{.ru}：[е́дем]{.ru}", "[на да́чу]{.ru}：[на]{.ru} + 第四格"]

  - id: e8
    type: open
    task: 短文写作。
    items:
      - prompt: 以“[Моя́ неде́ля]{.ru}”为题写一篇短文，介绍你的一周：早上吃什么、喝什么，每天去哪儿，星期几做什么，喜欢做什么，会做什么。
        length: 50–80
        model: |
          Моя́ неде́ля

          У́тром я ем хлеб и пью ко́фе. Пото́м я е́ду в университе́т. Я ка́ждый день хожу́ на уро́к. В понеде́льник и в сре́ду ве́чером я хожу́ в библиоте́ку. Я люблю́ чита́ть ру́сские ска́зки. Во вто́рник я хожу́ в бассе́йн: я уме́ю пла́вать. В пя́тницу ве́чером мы идём в кино́. В суббо́ту я игра́ю в футбо́л, а в воскресе́нье я до́ма. Я звоню́ домо́й и слу́шаю му́зыку.
        rubric: ["动词宾语用第四格：[ем хлеб]{.ru}、[чита́ть ру́сские ска́зки]{.ru}", "经常去的地方用 [ходи́ть / е́здить]{.ru}，计划好的一次用 [идти́ / е́хать]{.ru}", "去向用 [в / на]{.ru} + 第四格", "星期用 [в]{.ru} + 第四格，时段用 [у́тром, ве́чером]{.ru}", "至少用一次 [люби́ть]{.ru} 或 [уме́ть]{.ru} + 不定式"]
        notes: 范文按一天、一周的顺序写：先写早上，再写每天固定做的事，然后按星期一到星期日排列。写习惯时每句都可以用现在时；经常去的地方用 [хожу́, е́зжу]{.ru}，“星期五晚上我们去看电影”这样定好的一次安排用 [идём]{.ru}。说完去哪儿，可以补一句为什么去，例如 [я уме́ю пла́вать]{.ru}、[я люблю́ чита́ть]{.ru}，句子就不单调。
