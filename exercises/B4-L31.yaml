lesson: B4-L31
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式。
    items:
      - prompt: "[Что обещала реклама кофейни, онлайн-школы, хозяина квартиры и службы доставки и что получилось на самом деле? Как ответили на отзывы кофейня и школа? Чем доволен и чем недоволен покупатель смартфона?]{.ru}"
        length: 120–160
        model: "Кофейня обещала кофе за пять минут, но Анна ждала минут двадцать, потому что в субботу работал только один бариста. Онлайн-школа обещала английский за три месяца с носителями языка, а Максим получил записи уроков и чат-бот; живого преподавателя он видел всего два раза. Хозяин квартиры писал, что до метро десять минут пешком, а на самом деле — пятнадцать, но в остальном студент Чжан доволен. Доставка обещала продукты за пятнадцать минут, а курьер приехал через сорок, и половина фруктов была в ужасном виде. Кофейня ответила вежливо: взяла второго бариста и предложила Анне бесплатный круассан. Школа предложила Максиму скидку на более дорогую программу, и это ему совсем не понравилось. Покупатель смартфона доволен камерой и батареей, но недоволен тем, что телефон греется во время игры, а чехол пришлось покупать отдельно."
        rubric: ["四组“承诺与现实”都写出", "两个商家的回复都写出，并指出效果不同", "手机评论的优缺点各一条以上", "用标准语转述，不照抄俚语"]
        notes: "转述评论时要把口语换成标准语：[Кофе норм]{.ru} → [кофе неплохой]{.ru}，[препод классный]{.ru} → [преподаватель хороший]{.ru}。第 2 题注意两个回复的区别：咖啡馆承认问题并改进，网校却借机推销更贵的课程。"

  - id: e2
    type: translate
    task: 把下列口语词、缩略语换成标准语的说法（用俄语）。
    items:
      - zh: "[препод]{.ru}"
        accept: ["Преподаватель."]
        rubric: ["[преподаватель]{.ru}"]
      - zh: "[универ]{.ru}"
        accept: ["Университет."]
        rubric: ["[университет]{.ru}"]
      - zh: "[домашка]{.ru}"
        accept: ["Домашнее задание."]
        rubric: ["[домашнее задание]{.ru}"]
      - zh: "[соцсети]{.ru}"
        accept: ["Социальные сети."]
        rubric: ["[социальные сети]{.ru}"]
      - zh: "[ТЦ]{.ru}"
        accept: ["Торговый центр."]
        rubric: ["[торговый центр]{.ru}"]
      - zh: "[Кофе норм.]{.ru}"
        accept: ["Кофе нормальный.", "Кофе неплохой.", "Кофе хороший."]
        rubric: ["用 [нормальный, неплохой]{.ru} 等标准语形容词"]
      - zh: "[Цены кусаются.]{.ru}"
        accept: ["Цены очень высокие.", "Здесь очень дорого.", "Цены высокие."]
        rubric: ["说明价格很高"]
      - zh: "[Круассаны — огонь!]{.ru}"
        accept: ["Круассаны очень вкусные!", "Круассаны отличные!", "Круассаны замечательные!"]
        rubric: ["说明羊角面包非常好"]

  - id: e3
    type: choice
    task: 根据本课“文体与修辞”选择正确答案。
    why: "第 1 题 [препод]{.ru} 是把 [преподаватель]{.ru} 截短得到的，属于截短词。第 2 题 [промокод]{.ru} 来自英语 promo code，是外来新词。第 3 题 [ТЦ]{.ru} 由 [торговый центр]{.ru} 两个词的首字母组成，是字母缩略词。第 4 题 [норм, огонь, топ]{.ru} 是年轻人口语和网络上的俚语，不是广告语，更不是公文用语。第 5 题伊戈尔写的 [Оценил.]{.ru} 表面上是照办，实际上是打了低分，是反讽。第 6 题 [бариста]{.ru} 以元音 [-а]{.ru} 结尾却不变格，[второго бариста]{.ru} 中只有形容词变格。"
    items:
      - stem: Слово «препод» — это ___.
        options: [сокращённое разговорное слово, заимствование из английского, слоган]
        answer: сокращённое разговорное слово
      - stem: Слово «промокод» — это ___.
        options: ["неологизм, пришедший из английского", "старое русское слово", "сокращение от двух русских слов"]
        answer: "неологизм, пришедший из английского"
      - stem: «ТЦ» — это сокращение от слов ___.
        options: [торговый центр, транспортный центр, технический центр]
        answer: торговый центр
      - stem: Слова «норм», «огонь», «топ» в отзывах — это ___.
        options: [сленг, рекламные слоганы, слова официального стиля]
        answer: сленг
      - stem: В отзыве Игоря слово «Оценил» показывает ___.
        options: ["иронию: он поставил плохую оценку", "что он доволен курьером", "что он не умеет пользоваться приложением"]
        answer: "иронию: он поставил плохую оценку"
      - stem: В словах «взяли второго бариста» не изменяется ___.
        options: [существительное, прилагательное, глагол]
        answer: существительное

  - id: e4
    type: fill
    task: 用括号里的词填空，注意词形。
    why: "第 1 题广告用命令式复数 [скачайте]{.ru}（[скачать]{.ru} 第一变位）。第 2 题 [рекомендовать]{.ru} 现在时词干 [рекоменду-]{.ru}：[рекомендую]{.ru}。第 3 题 [удалить]{.ru} 过去时阳性 [удалил]{.ru}，主语 [Игорь]{.ru} 是男性（见伊戈尔的评论：[Удалил приложение]{.ru}）。第 4 题 [предупреждать]{.ru} 未完成体过去时表示反复：[предупреждал]{.ru}。第 5 题 [вестись на что]{.ru} 的否定命令式 [не ведитесь]{.ru}。第 6 题 [кусаться]{.ru} 主语 [цены]{.ru} 复数：[кусаются]{.ru}。"
    items:
      - stem: ___ приложение и найдите самокат на карте.
        hint: скачать
        accept: ["Скачайте"]
      - stem: Всем ___!
        hint: рекомендовать
        accept: ["рекомендую"]
      - stem: Курьер опоздал, и Игорь ___ приложение.
        hint: удалить
        accept: ["удалил"]
      - stem: Хозяин всегда заранее ___, когда хотел прийти.
        hint: предупреждать
        accept: ["предупреждал"]
      - stem: Не ___ на рекламу!
        hint: вестись
        accept: ["ведитесь"]
      - stem: Цены в кофейне ___.
        hint: кусаться
        accept: ["кусаются"]

  - id: e5
    type: rewrite
    task: 把下面的网络评论改写成中性的书面语。
    example:
      cue: Препод классный.
      answer: Преподаватель очень хороший.
    why: "改写时要把俚语、截短词换成标准词：[препод]{.ru} → [преподаватель]{.ru}，[классный]{.ru} → [хороший, отличный]{.ru}，[домашка]{.ru} → [домашнее задание]{.ru}，[универ]{.ru} → [университет]{.ru}，[по факту]{.ru} → [на самом деле]{.ru}，[глючит]{.ru} → [плохо работает, работает с ошибками]{.ru}，[залипать в соцсетях]{.ru} → [долго сидеть в социальных сетях]{.ru}。情感标点 [!!!]{.ru} 和 [)))]{.ru} 也要去掉。"
    items:
      - cue: Домашки много, это минус.
        accept: ["Домашних заданий много, это минус.", "Домашнего задания много, это недостаток.", "Домашних заданий много, и это недостаток.", "Домашних заданий слишком много, это недостаток."]
      - cue: До универа теперь 10 минут!
        accept: ["До университета теперь 10 минут.", "Теперь до университета можно доехать за 10 минут."]
      - cue: Обещали живых преподавателей, а по факту — чат-бот.
        accept: ["Обещали живых преподавателей, а на самом деле — чат-бот.", "Обещали живых преподавателей, а на самом деле был чат-бот."]
      - cue: Приложение глючит.
        accept: ["Приложение плохо работает.", "Приложение работает с ошибками.", "В приложении бывают ошибки."]
      - cue: Батарея держит день, если не залипать в соцсетях.
        accept: ["Батарея работает целый день, если долго не сидеть в социальных сетях.", "Батарея держит целый день, если не сидеть долго в социальных сетях."]

  - id: e6
    type: open
    task: 概要写作。为一个城市生活网站写一篇约 150 词的“用户评论综述”，用中性的书面语概括课文中的评论，不用俚语。
    items:
      - prompt: "[Обзор отзывов пользователей: кофейня, онлайн-школа, самокаты, доставка, смартфон.]{.ru}"
        length: 130–170
        model: "Мы прочитали отзывы пользователей о нескольких популярных услугах. Кофейня «Зерно» получила среднюю оценку: посетители хвалят свежую выпечку, но жалуются на высокие цены и на то, что в выходные кофе приходится ждать гораздо дольше обещанных пяти минут. Кофейня уже взяла на выходные второго бариста. Мнения об онлайн-школе «Говорун» разделились. Одни ученики довольны преподавателями и своими успехами, другие пишут, что вместо живых уроков получили записи и чат-бот, а вернуть деньги было трудно. Самокаты «Ветер» хвалят за то, что они удобные и недорогие, однако приложение иногда работает с ошибками. О доставке продуктов «Быстро» мы нашли резко отрицательный отзыв: курьер опоздал почти на полчаса и привёз не все продукты. Покупатели смартфона «Тайфун 7» довольны камерой и батареей, но замечают, что телефон сильно греется. В целом отзывы пользователей показывают, что реклама обещает больше, чем получает клиент."
        rubric: ["每项服务一两句，优缺点都写", "全部用中性书面语，不用俚语和截短词", "注明评价是用户的看法（[посетители хвалят, пишут, жалуются]{.ru}）", "有总结句", "130–170 词"]
        notes: "范文约 130 词。综述的写法：每段先给总体评价（[получила среднюю оценку, мнения разделились]{.ru}），再分别写优点和缺点。评论里的口语全部换成书面语：[цены кусаются]{.ru} → [высокие цены]{.ru}，[глючит]{.ru} → [работает с ошибками]{.ru}。最后一句点出广告与现实的差距，与课文的主题呼应。"

  - id: e7
    type: open
    task: 写作任务：先为一家虚构的店铺或服务写一则广告（40–60 词），再以顾客身份写一条网络评论（60–90 词），最后以店家身份写一条回复（30–50 词）。总共 140–200 词。
    items:
      - prompt: "[Реклама, отзыв и ответ.]{.ru} 广告里用上命令式、问句和数字；评论里用上至少三个口语词或新词；回复要礼貌。"
        length: 140–200
        model: "Реклама\nНе успеваешь позавтракать? Мы приготовим за тебя! Кофейня «Утро» — свежий хлеб и выпечка с 6 утра. Закажи через приложение — и курьер привезёт завтрак к твоей двери за 20 минут. Первый заказ — со скидкой 30 % по промокоду УТРО.\n\nОтзыв\nОльга С. Четыре звезды. Заказывала три раза, в целом норм. Круассаны — огонь, хлеб тоже классный, ещё тёплый. Но один раз курьер приехал не через 20 минут, а через 50, и кофе был уже холодный. Я позвонила в поддержку, там извинились, но деньги не вернули. В приложении удобно, промокод работает. Цены не кусаются, а круассаны большие. Короче, рекомендую, но кофе лучше варить дома)))\n\nОтвет кофейни\nОльга, спасибо за отзыв! Нам очень жаль, что кофе приехал холодным. Мы уже обсудили этот случай с нашими курьерами и теперь возим кофе в специальных термосах. В следующий раз кофе будет за наш счёт. Ждём ваших новых заказов!"
        rubric: ["广告：问句开头、命令式、具体数字", "评论：有星级、有优点和缺点，至少三个口语词或新词（[норм, огонь, классный, короче, промокод]{.ru} 等）", "回复：感谢、承认问题、提出补偿", "三部分语体分明", "140–200 词"]
        notes: "范文约 140 词。三段文字语体各不相同：广告短促、用 [ты]{.ru} 和命令式；评论随意、带俚语和情感标点；回复礼貌、用 [вы]{.ru}，结构是“感谢—道歉—改进—补偿”，和课文中咖啡馆的回复一样。注意评论里的口语词不要用进回复。"

  - id: e8
    type: open
    task: 作文。就下面的题目写一篇 250–300 词的文章。
    items:
      - prompt: "[Можно ли доверять отзывам в интернете?]{.ru}"
        length: 250–300
        model: "Прежде чем выбрать кафе, купить смартфон или записаться в онлайн-школу, почти все мы читаем отзывы. Кажется, это честнее, чем верить рекламе, ведь реклама всегда говорит только о плюсах: рекламу пишет продавец, а отзыв — такой же покупатель, как мы. Но можно ли на самом деле доверять отзывам в интернете? По-моему, можно, но только если читать их внимательно.\n\nВо-первых, отзывы действительно помогают. Реклама онлайн-школы обещает английский за три месяца, а в отзывах пользователи рассказывают, что за этими словами стоит на самом деле. Реклама никогда не скажет, что кофе приходится ждать двадцать минут или что телефон греется. Об этом скажут только клиенты.\n\nВо-вторых, однако, не все отзывы пишут настоящие покупатели. Известно, что некоторые компании платят за хорошие отзывы о себе и плохие — о других компаниях. Если у нового кафе за неделю появилось сто прекрасных комментариев, написанных одинаковыми словами, им трудно верить.\n\nВ-третьих, даже честный отзыв — это мнение одного человека. Кто-то ставит одну звезду, потому что курьер опоздал на пять минут, а кто-то — пять звёзд, потому что ему понравился дизайн чашки. Поэтому одна оценка почти ничего не значит. Важно не то, сколько звёзд поставил человек, а то, за что он их поставил.\n\nКак же читать отзывы? Я стараюсь читать не только лучшие и худшие, а средние: в них обычно больше конкретных фактов и меньше эмоций. Полезно смотреть и на ответы компании. Если кофейня вежливо признаёт ошибку и что-то меняет, ей хочется доверять больше, чем той, где всё всегда «отлично».\n\nТаким образом, отзывы — полезная вещь, но не вся правда. Доверять можно не одному отзыву, а общей картине, которую дают десятки разных мнений."
        rubric: ["开头提出问题和有条件的论点", "论据既有正面也有反面（真实性、主观性）", "给出具体的阅读建议", "结论明确", "用上本课的词语（[отзыв, реклама, комментарий, оценка, клиент]{.ru} 等）", "250–300 词"]
        notes: "范文约 260 词。论点是“可以信，但要会读”。第二段写评论的价值（揭穿广告），第三、四段写评论的两个问题（虚假评论、主观评价），第五段给出实用建议，这比单纯的“是”或“否”更有说服力。范文是书面语，课文里的俚语只能作为引用出现。"
