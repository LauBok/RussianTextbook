lesson: B2-L14
grammar: "形容词复数各格：[-ые / -ие, -ых / -их, -ым / -им, -ыми / -ими]{.ru}；第四格同第一格或第二格。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的形容词的正确形式填空。
    why: "先看名词是什么格，再给形容词配上同一个格的词尾。第 1 题 [с]{.ru} + 第五格：[ма́ленькими]{.ru}，[к]{.ru} 后按拼写规则写 [и]{.ru}。第 2 题动物名词复数第四格同第二格：[но́вых]{.ru}。第 3 题 [помога́ть]{.ru} 要求第三格，[пожило́й]{.ru} 重音在词尾：[пожилы́м]{.ru}。第 4 题 [о]{.ru} + 第六格：[компью́терных]{.ru}。第 5 题 [нет]{.ru} + 第二格：[плохи́х]{.ru}。第 6 题非动物名词复数第四格同第一格：[ста́рые]{.ru}。第 7 题 [в]{.ru} + 第六格，软变化：[си́них]{.ru}。第 8 题 [ж]{.ru} 后写 [и]{.ru}：[све́жими]{.ru}。"
    items:
      - stem: На поро́ге стоя́ла же́нщина с ___ до́чками.
        hint: ма́ленький
        accept: ["ма́ленькими"]
      - stem: Мари́я Никола́евна пригласи́ла ___ сосе́дей на чай.
        hint: но́вый
        accept: ["но́вых"]
      - stem: В на́шем до́ме все помога́ют ___ сосе́дям.
        hint: пожило́й
        accept: ["пожилы́м"]
      - stem: Ми́ша расска́зывал о ___ и́грах.
        hint: компью́терный
        accept: ["компью́терных"]
      - stem: У нас в до́ме нет ___ сосе́дей.
        hint: плохо́й
        accept: ["плохи́х"]
      - stem: Рабо́чие поднима́ли ___ кре́сла.
        hint: ста́рый
        accept: ["ста́рые"]
      - stem: Все ве́щи ещё в ___ коро́бках.
        hint: си́ний
        accept: ["си́них"]
      - stem: Ма́ма пригото́вила пироги́ со ___ я́блоками.
        hint: све́жий
        accept: ["све́жими"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题“谈论……”用 [о]{.ru} + 第六格 [ра́зных]{.ru}。第 2 题 [рассказа́ть]{.ru} 给谁用第三格 [но́вым]{.ru}。第 3 题 [актёров]{.ru} 是动物名词，形容词复数第四格同第二格 [молоды́х]{.ru}；如果用 [молоды́е]{.ru}，就成了非动物名词的变法。第 4 题 [пе́ред]{.ru} + 第五格。第 5 题 [мно́го]{.ru} + 复数第二格。"
    items:
      - stem: За столо́м говори́ли о ___ веща́х.
        options: [ра́зные, ра́зных, ра́зным]
        answer: ра́зных
      - stem: Ива́н Серге́евич рассказа́л ___ сосе́дям о до́ме.
        options: [но́вых, но́вым, но́выми]
        answer: но́вым
      - stem: Ли́за зна́ет всех ___ актёров теа́тра.
        options: [молоды́е, молоды́х, молоды́м]
        answer: молоды́х
      - stem: Пе́ред ___ дома́ми стоя́ли маши́ны.
        options: [высо́кими, высо́ких, высо́кие]
        answer: высо́кими
      - stem: В Москве́ мно́го ___ па́рков.
        options: [краси́вые, краси́вых, краси́вым]
        answer: краси́вых

  - id: e3
    type: rewrite
    task: 把句中的名词和形容词变成复数。
    example:
      cue: Мы говори́ли о но́вом сосе́де.
      answer: Мы говори́ли о но́вых сосе́дях.
    why: "形容词和名词一起变：第六格 [-ых]{.ru} + [-ах / -ях]{.ru}，第三格 [-ым]{.ru} + [-ам / -ям]{.ru}，第五格 [-ыми]{.ru} + [-ами / -ями]{.ru}。第 2 题 [студе́нтку]{.ru} 是动物名词，复数第四格同第二格：[но́вых студе́нток]{.ru}。第 4 题 [ру́сский]{.ru} 按拼写规则写 [и]{.ru}。"
    items:
      - cue: Ма́ма помогла́ пожило́й сосе́дке.
        accept: ["Ма́ма помогла́ пожилы́м сосе́дкам."]
      - cue: Я ви́дел но́вую студе́нтку.
        accept: ["Я ви́дел но́вых студе́нток."]
      - cue: Ми́ша игра́л с ма́леньким ма́льчиком.
        accept: ["Ми́ша игра́л с ма́ленькими ма́льчиками."]
      - cue: Ди́ма расска́зывал о ру́сском го́роде.
        accept: ["Ди́ма расска́зывал о ру́сских города́х."]
      - cue: Пьер купи́л ста́рую кни́гу.
        accept: ["Пьер купи́л ста́рые кни́ги."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“新邻居”是动物名词，作宾语时形容词和名词都同第二格。第 2 题 [о]{.ru} 后形容词和名词都用复数第六格。第 3 题 [помога́ть]{.ru} 要求第三格。第 4 题“这样的邻居”用 [таки́х сосе́дей]{.ru}。"
    items:
      - zh: 妈妈请新邻居来喝茶。
        accept: ["Ма́ма пригласи́ла но́вых сосе́дей на чай.", "Ма́ма пригласи́ла на чай но́вых сосе́дей."]
        rubric: ["[но́вых сосе́дей]{.ru}：动物名词复数第四格同第二格", "[пригласи́ть на чай]{.ru}"]
      - zh: 我们谈了各种各样的事情。
        accept: ["Мы говори́ли о ра́зных веща́х.", "Мы разгова́ривали о ра́зных веща́х."]
        rubric: ["[о ра́зных веща́х]{.ru}：形容词和名词复数第六格", "[веща́х]{.ru} 重音在词尾"]
      - zh: 我们楼里大家都帮助上了年纪的邻居。
        accept: ["В на́шем до́ме все помога́ют пожилы́м сосе́дям.", "У нас в до́ме все помога́ют пожилы́м сосе́дям.", "Все в на́шем до́ме помога́ют пожилы́м сосе́дям."]
        rubric: ["[помога́ть]{.ru} + 第三格 [пожилы́м сосе́дям]{.ru}", "[все]{.ru} 作主语，动词用复数"]
      - zh: 我喜欢这样的邻居。
        accept: ["Я люблю́ таки́х сосе́дей.", "Мне нра́вятся таки́е сосе́ди."]
        rubric: ["[таки́х сосе́дей]{.ru}：复数第四格同第二格", "用 [нра́виться]{.ru} 时主语是 [таки́е сосе́ди]{.ru}，动词用复数"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что Ван Лэй уви́дел у подъе́зда во вто́рник? Кто позвони́л в дверь ве́чером и что они́ попроси́ли? О чём говори́ли за столо́м? Почему́ у сосе́дей была́ ко́шка? Что сказа́ла Ве́ра на проща́ние?]{.ru}"
        length: 50–80
        model: "Во вто́рник у подъе́зда стоя́л грузови́к, и рабо́чие поднима́ли по ле́стнице тяжёлые коро́бки. Ве́чером к Петро́вым позвони́ли но́вые сосе́ди, Ники́та и Ве́ра, с ма́ленькими до́чками. Они́ попроси́ли немно́го со́ли. Мари́я Никола́евна пригласи́ла их на чай. За столо́м говори́ли о ра́зных веща́х. Ко́шку сосе́ди взя́ли у ма́мы: по ста́рому обы́чаю в но́вую кварти́ру пе́рвой должна́ войти́ ко́шка. На проща́ние Ве́ра пригласи́ла всех на новосе́лье."
        rubric: ["回答全部五个问题", "至少用三个形容词复数间接格：[тяжёлые коро́бки]{.ru}、[с ма́ленькими до́чками]{.ru}、[о ра́зных веща́х]{.ru} 等", "解释猫的习俗"]
        notes: 范文约 70 词。形容词复数分别出现在第四格、第五格和第六格；最后一句把薇拉的话压缩成 [пригласи́ла всех на новосе́лье]{.ru}。
