lesson: L55
grammar: "[ну́жен, нужна́, ну́жно, нужны́]{.ru}：需要的人用第三格，需要的东西作主语，短尾形容词与主语性数一致；过去时 [был, была́, бы́ло, бы́ли]{.ru}，将来时 [бу́дет, бу́дут]{.ru}；[ну́жно]{.ru} + 名词与 [ну́жно]{.ru} + 不定式的区别。"
exercises:

  - id: e1
    type: picture_qa
    task: 看图，用 [Что э́то?]{.ru} 问答。
    example: 1
    why: 这些都是物品，用 [что]{.ru} 问。[перча́тки]{.ru}、[сапоги́]{.ru} 一般用复数，答句里的 [э́то]{.ru} 不变。
    items:
      - image: shapka.svg
        qword: Что
        answer: [Э́то ша́пка.]
      - image: sharf.svg
        qword: Что
        answer: [Э́то шарф.]
      - image: palto.svg
        qword: Что
        answer: [Э́то пальто́.]
      - image: perchatki.svg
        qword: Что
        answer: [Э́то перча́тки.]
      - image: sapogi.svg
        qword: Что
        answer: [Э́то сапоги́.]

  - id: e2
    type: choice
    task: 选择 [ну́жен]{.ru}、[нужна́]{.ru}、[ну́жно]{.ru} 或 [нужны́]{.ru}。
    why: 形式跟着需要的东西（主语）变：[шарф, телефо́н]{.ru} 阳性 → [ну́жен]{.ru}；[ша́пка, ку́ртка]{.ru} 阴性 → [нужна́]{.ru}；[пальто́]{.ru} 中性 → [ну́жно]{.ru}；[перча́тки, сапоги́, де́ньги]{.ru} 复数 → [нужны́]{.ru}。第 3 题 [пальто́]{.ru} 不变格，但它是中性名词。第 6 题 [де́ньги]{.ru} 只有复数。
    items:
      - stem: Ван Лэ́ю ___ шарф.
        options: [ну́жен, нужна́, ну́жно, нужны́]
        answer: ну́жен
      - stem: Мне ___ тёплая ша́пка.
        options: [ну́жен, нужна́, ну́жно, нужны́]
        answer: нужна́
      - stem: Тебе́ ___ тёплое пальто́.
        options: [ну́жен, нужна́, ну́жно, нужны́]
        answer: ну́жно
      - stem: А́нне ___ но́вые сапоги́.
        options: [ну́жен, нужна́, ну́жно, нужны́]
        answer: нужны́
      - stem: Ми́ше ___ но́вый телефо́н.
        options: [ну́жен, нужна́, ну́жно, нужны́]
        answer: ну́жен
      - stem: В суббо́ту нам ___ де́ньги.
        options: [ну́жен, нужна́, ну́жно, нужны́]
        answer: нужны́

  - id: e3
    type: rewrite
    task: 按例句改写。
    placeholder: Мне ну́жен …
    example:
      cue: У меня́ нет ша́пки. (я)
      answer: Мне нужна́ ша́пка.
    why: 改写后第二格（[нет]{.ru} 后面）变回第一格作主语，[ну́жен]{.ru} 跟它一致；括号里的人变成第三格。第 3 题 [су́мки]{.ru} 的第一格是阴性 [су́мка]{.ru}，用 [нужна́]{.ru}。
    items:
      - cue: У меня́ нет ша́рфа. (я)
        accept: ["Мне ну́жен шарф."]
      - cue: У него́ нет пальто́. (он)
        accept: ["Ему́ ну́жно пальто́."]
      - cue: У неё нет су́мки. (она́)
        accept: ["Ей нужна́ су́мка."]
      - cue: У Ми́ши нет телефо́на. (Ми́ша)
        accept: ["Ми́ше ну́жен телефо́н."]
      - cue: У нас нет ку́ртки. (мы)
        accept: ["Нам нужна́ ку́ртка."]

  - id: e4
    type: fill
    task: 把句子改成过去时，填 [был]{.ru}、[была́]{.ru}、[бы́ло]{.ru} 或 [бы́ли]{.ru}。
    why: "[ну́жен]{.ru} + 名词的过去时跟主语变（第 1–3 题）；[ну́жно]{.ru} + 不定式是无人称句，过去时永远用 [бы́ло]{.ru}（第 4 题）。最容易错的是第 4 题：句里有复数 [сапоги́]{.ru}，但它只是 [купи́ть]{.ru} 的宾语，不是主语。"
    items:
      - stem: Вчера́ мне ___ нужна́ ша́пка.
        accept: [была́]
      - stem: Ми́ше ___ ну́жен телефо́н.
        accept: [был]
      - stem: А́нне ___ нужны́ сапоги́.
        accept: [бы́ли]
      - stem: А́нне ну́жно ___ купи́ть сапоги́.
        accept: [бы́ло]

  - id: e5
    type: translate
    task: 译成俄语。
    why: “某人需要某物”用“第三格 + [ну́жен]{.ru} + 第一格”，“需要做某事”用“第三格 + [ну́жно]{.ru} + 不定式”。
    items:
      - zh: 我需要一条暖和的围巾。
        accept: ["Мне ну́жен тёплый шарф."]
        rubric: ["[шарф]{.ru} 阳性，用 [ну́жен]{.ru}", "形容词 [тёплый]{.ru} 和 [шарф]{.ru} 一致"]
      - zh: 你需要什么？
        accept: ["Что тебе́ ну́жно?", "Что вам ну́жно?", "Тебе́ что ну́жно?"]
        rubric: ["[что]{.ru} 当中性，用 [ну́жно]{.ru}"]
      - zh: 安娜需要新靴子。
        accept: ["А́нне нужны́ но́вые сапоги́."]
        rubric: ["[А́нне]{.ru} 第三格", "[сапоги́]{.ru} 复数，用 [нужны́]{.ru}"]
      - zh: 米沙不需要帽子，他需要一部新手机。
        accept: ["Ми́ше не нужна́ ша́пка, ему́ ну́жен но́вый телефо́н.", "Ша́пка Ми́ше не нужна́, ему́ ну́жен но́вый телефо́н.", "Ми́ше ша́пка не нужна́, ему́ ну́жен но́вый телефо́н."]
        rubric: ["[не нужна́]{.ru} 和 [ша́пка]{.ru} 一致", "[ну́жен]{.ru} 和 [телефо́н]{.ru} 一致"]
      - zh: 王磊得买一件大衣。
        accept: ["Ван Лэ́ю ну́жно купи́ть пальто́.", "Ван Лэ́ю на́до купи́ть пальто́."]
        rubric: ["“得买”是 [ну́жно / на́до]{.ru} + 不定式", "[Ван Лэй]{.ru} 变成第三格 [Ван Лэ́ю]{.ru}"]

  - id: e6
    type: open
    task: 情景对话：你和俄罗斯朋友商量周末去买冬衣。说说每个人需要什么。
    items:
      - prompt: 写 6–8 句对话，[ну́жен]{.ru}、[нужна́]{.ru}、[ну́жно]{.ru}、[нужны́]{.ru} 至少用三种。
        length: 50–90
        model: "— Что тебе́ ну́жно?\n— Мне нужна́ тёплая ку́ртка. И ша́пка то́же нужна́.\n— А перча́тки?\n— Перча́тки у меня́ есть. А тебе́ что ну́жно?\n— Мне ну́жен шарф. А бра́ту нужны́ сапоги́.\n— Дава́й в суббо́ту ку́пим всё вме́сте!\n— Хорошо́. Но нам нужны́ де́ньги!"
        rubric: ["[ну́жен]{.ru} 的各个形式和主语一致", "需要的人用第三格", "对话自然，有问有答"]
        notes: 范文用 [Что тебе́ ну́жно?]{.ru} 开头，两人轮流说自己需要什么，最后用 [Дава́й…]{.ru} 提出建议。说“有”的东西时换用 [у меня́ есть]{.ru}，避免每句都是 [ну́жен]{.ru}。[бра́ту нужны́ сапоги́]{.ru} 里人换成了名词，结构不变。
