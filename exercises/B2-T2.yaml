  type: rewrite
  task: 按括号里的要求改写句子。
  points: 1
  why: 第 1 题：比较对象用第二格时没有 [чем]{.ru}，改用 [чем]{.ru} 后，[Петербу́рг]{.ru} 用第一格，[чем]{.ru} 前加逗号（第 23 课）。第 2 题：[-ейший]{.ru} 由形容词词干加后缀构成，本身就是“非常、最”的意思，不再加 [о́чень]{.ru}（第 24 课）。第 3 题：短尾形容词作谓语，阳性去掉词尾，[тру́дный]{.ru} 的短尾是 [тру́ден]{.ru}，隐现元音 [е]{.ru} 插在 [дн]{.ru} 之间（第 25 课）。第 4 题：表示相互的动作，带 [-ся]{.ru} 的动词本身就有“互相”的意思，不再加 [друг дру́га]{.ru}（第 34 课）。第 5 题：[мно́го]{.ru} + 复数第二格 [покупа́телей]{.ru}，数量词作主语时谓语用中性单数 [бы́ло]{.ru}（第 3 课）。第 6 题：复数动物名词第四格同第二格，形容词也用复数第二格：[но́вых преподава́телей]{.ru}（第 13、14 课）。第 7 题：前缀 [при-]{.ru}（到来）和 [у-]{.ru}（离开）方向相反，[в]{.ru} + 第四格变成 [из]{.ru} + 第二格：[уе́хал из Москвы́]{.ru}（第 39 课）。第 8 题：[кото́рый]{.ru} 在从句里是 [писа́ть]{.ru} 的对象，用第三格 [кото́рому]{.ru}，性数和 [друг]{.ru} 一致（第 46 课）。第 9 题：转述命令、请求用 [что́бы]{.ru} + 过去时，人称改从转述人的角度：[что́бы я купи́л]{.ru}（第 47、64 课）。第 10 题：两个分句主语相同，[что́бы]{.ru} 后面用不定式 [рабо́тать]{.ru}（第 48 课）。第 11 题：[по́сле того́ как]{.ru} 引出先发生的动作，从句和主句都用完成体过去时（第 49 课）。第 12 题：把现实的情况改成不现实的假设：否定变肯定，[нет вре́мени]{.ru} 变成 [бы́ло вре́мя]{.ru}，两个分句都用 [бы]{.ru} + 过去时（第 50 课）。第 13 题：[пусть]{.ru} + 第三人称的将来时或现在时，表示让第三者去做：[Пусть Ди́ма позвони́т мне]{.ru}（第 65 课）。第 14 题：[хотя́]{.ru} 引出让步从句，主句里不再用 [но]{.ru}（第 52 课）。第 15 题：一般疑问句转成间接引语用 [ли]{.ru}，放在要问的动词后面；[ты]{.ru} 从转述人的角度改成 [я]{.ru}，动词跟着变成 [пое́ду]{.ru}，时间不变（第 64 课）。
  example:
    cue: Здесь стро́ят но́вую шко́лу.（改用 [стро́иться]{.ru}）
    answer: Здесь стро́ится но́вая шко́ла.
