    Е́сли вы хоти́те пое́хать, приходи́те в Междунаро́дный отде́л (ко́мната 215) до пя́того ию́ля. Не забу́дьте взять с собо́й па́спорт. И ещё возьми́те зонт: пого́да ле́том мо́жет быть ра́зной.
