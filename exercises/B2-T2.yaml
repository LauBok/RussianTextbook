lesson: B2-T2
heading: 期末测试
intro: 满分 150 分，建议用时 120 分钟。考查范围：第二册全册，第 37–71 课约占六成。翻译和写作按书末评分细则给分。
exercises:
- id: e1
  type: choice
  task: 单项选择。
  points: 1
  why: 第 1 题：[мно́го]{.ru} + 能数名词的复数第二格，[музе́й]{.ru} 以 [-й]{.ru} 结尾，复数第二格是 [музе́ев]{.ru}（第 1、3 课）。第 2 题：数词最后一个词是 [три]{.ru}，名词用单数第二格 [студе́нта]{.ru}；[два́дцать]{.ru} 不影响后面名词的形式（第 4 课）。第 3 题：“几点半”说 [в полови́не]{.ru} + 下一个钟点的序数词第二格：[в полови́не шесто́го]{.ru} 是五点半（第 6 课）。第 4 题：[дово́лен]{.ru} 支配第五格，复数第五格是 [-ами]{.ru}：[свои́ми оце́нками]{.ru}（第 12、25 课）。第 5 题：[писа́ть]{.ru} 写给谁用第三格，形容词复数第三格是 [-ым]{.ru}，和 [друзья́м]{.ru} 一致（第 14 课）。第 6 题：后面有 [чем]{.ru}，用比较级；[высо́кий]{.ru} 的比较级是辅音交替的 [вы́ше]{.ru}（第 23 课）。第 7 题：[нача́ть]{.ru} 后面只能接未完成体不定式：[на́чал учи́ть]{.ru}（第 31 课）。第 8 题：[боя́ться]{.ru} 支配第二格，[соба́ка]{.ru} 的复数第二格是零词尾 [соба́к]{.ru}（第 2、35 课）。第 9 题：上个星期六带妹妹去了剧院又回来了，用不定向动词 [води́л]{.ru}；[вёл]{.ru} 只说路上的过程；[нёс, носи́л]{.ru} 是用手拿着东西（第 38 课）。第 10 题：教授现在不在，说明他离开了还没回来，用 [ушёл]{.ru}；[уходи́л]{.ru} 表示离开过又回来了；[пришёл]{.ru} 是来到这里（第 39 课）。第 11 题：走到窗前用 [подойти́ к]{.ru} + 第三格；[дойти́]{.ru} 要和 [до]{.ru} 连用，[войти́]{.ru} 要和 [в]{.ru} 连用，[отойти́]{.ru} 是从窗前走开（第 41 课）。第 12 题：从句里“把词典给谁”，[кото́рый]{.ru} 用第三格 [кото́рому]{.ru}，性数和 [студе́нт]{.ru} 一致（第 46 课）。第 13 题：[что́бы]{.ru} 引出的说明从句，动词一律用过去时 [пришёл]{.ru}，即使说的是将来的事；用 [придёшь]{.ru} 是照汉语直译的常见错误（第 47 课）。第 14 题：两个动作同时进行，用 [пока́]{.ru} + 未完成体；[пока́ не]{.ru} 表示“直到……为止”（第 49 课）。第 15 题：[е́сли бы]{.ru} 句子里主句也用 [бы]{.ru} + 过去时：[я бы навести́л]{.ru}（第 50 课）。第 16 题：前半句是原因，后半句是结果，用 [так что]{.ru}；[так как]{.ru}、[потому́ что]{.ru} 引出的是原因，[хотя́]{.ru} 表示让步（第 51 课）。第 17 题：条件从句里说的是“不管谁、随便哪个人”，用 [кто́-нибудь]{.ru}；[кто́-то]{.ru} 指确有其人、只是不知道是谁（第 59 课）。第 18 题：[не́чего]{.ru} + 不定式表示“没有什么可做”，主体用第三格 [мне]{.ru}；[ничего́]{.ru} 要和动词前的 [не]{.ru} 连用（第 60 课）。第 19 题：[из-за́]{.ru} + 第二格表示造成不好结果的原因；[благодаря́]{.ru} 用于好的结果，而且要求第三格（第 67 课）。第 20 题：[любо́й]{.ru} 表示“随便哪一个”；[ка́ждое вре́мя]{.ru} 不能这样说（第 58 课）。
  items:
  - stem: В Москве́ мно́го ___.
    options:
    - музе́и
    - музе́ев
    - музе́й
    - музе́ям
    answer: музе́ев
  - stem: В на́шей гру́ппе два́дцать три ___.
    options:
    - студе́нтов
    - студе́нт
    - студе́нта
    - студе́нты
    answer: студе́нта
  - stem: Мы договори́лись встре́титься в ___ шесто́го.
    options:
    - полови́не
    - полови́ну
    - полови́на
    - полови́ны
    answer: полови́не
  - stem: Ми́ша дово́лен свои́ми ___.
    options:
    - оце́нки
    - оце́нок
    - оце́нках
    - оце́нками
    answer: оце́нками
  - stem: Я ча́сто пишу́ ___ друзья́м.
    options:
    - ста́рые
    - ста́рым
    - ста́рых
    - ста́рыми
    answer: ста́рым
  - stem: Э́тот дом ___, чем наш.
    options:
    - высо́кий
    - высоко́
    - вы́ше
    - са́мый высо́кий
    answer: вы́ше
  - stem: В апре́ле Ван Лэй на́чал ___ ру́сские та́нцы.
    options:
    - учи́ть
    - вы́учить
    - у́чит
    - вы́учил
    answer: учи́ть
  - stem: Ми́ша бои́тся ___.
    options:
    - соба́кам
    - соба́ками
    - соба́ках
    - соба́к
    answer: соба́к
  - stem: В суббо́ту Ди́ма ___ сестру́ в теа́тр.
    options:
    - вёл
    - води́л
    - нёс
    - носи́л
    answer: води́л
  - stem: Профе́ссора сейча́с нет, он ___ на ле́кцию.
    options:
    - пришёл
    - приходи́л
    - ушёл
    - уходи́л
    answer: ушёл
  - stem: Ди́ма ___ к окну́ и откры́л его́.
    options:
    - подошёл
    - отошёл
    - вошёл
    - дошёл
    answer: подошёл
  - stem: Э́то студе́нт, ___ я дал свой слова́рь.
    options:
    - кото́рый
    - кото́рого
    - кото́рым
    - кото́рому
    answer: кото́рому
  - stem: Я хочу́, что́бы ты ___ ко мне в го́сти.
    options:
    - придёшь
    - пришёл
    - прихо́дишь
    - прийти́
    answer: пришёл
  - stem: ___ ма́ма гото́вила у́жин, па́па чита́л газе́ту.
    options:
    - Пока́ не
    - По́сле того́ как
    - Пока́
    - Пе́ред тем как
    answer: Пока́
  - stem: Е́сли бы я знал, что ты бо́лен, я бы ___ тебя́.
    options:
    - навещу́
    - навести́т
    - навести́ть
    - навести́л
    answer: навести́л
  - stem: Шёл дождь, ___ мы оста́лись до́ма.
    options:
    - так что
    - так как
    - хотя́
    - потому́ что
    answer: так что
  - stem: Е́сли ___ позвони́т, скажи́, что я в библиоте́ке.
    options:
    - кто́-то
    - кто́-нибудь
    - никто́
    - не́кого
    answer: кто́-нибудь
  - stem: Мне ___ де́лать, мне ску́чно.
    options:
    - не́где
    - не́кого
    - не́чего
    - ничего́
    answer: не́чего
  - stem: Мы опозда́ли ___ дождя́.
    options:
    - благодаря́
    - от
    - для
    - из-за́
    answer: из-за́
  - stem: Ты мо́жешь позвони́ть мне в ___ вре́мя.
    options:
    - любо́е
    - ка́ждое
    - никако́е
    - само́
    answer: любо́е
- id: e2
  type: fill
  task: 用括号里词的正确形式填空。
  points: 1
  why: 第 1 题：[не́сколько]{.ru} + 能数名词的复数第二格，[я́блоко]{.ru} 的复数第二格是零词尾 [я́блок]{.ru}（第 2、3 课）。第 2 题：[подари́ть]{.ru} 送给谁用第三格，复数第三格 [-ам]{.ru}：[учи́тельницам]{.ru}（第 11 课）。第 3 题：[горди́ться]{.ru} 支配第五格，物主代词复数第五格 [мои́ми]{.ru}，名词 [роди́телями]{.ru}（第 12、15 课）。第 4 题：[лю́ди]{.ru} 是 [челове́к]{.ru} 的复数，复数第二格是 [люде́й]{.ru}；数词后面才用 [челове́к]{.ru}（第 16、17 课）。第 5 题：[коро́ткий]{.ru} 的比较级是辅音交替的 [коро́че]{.ru}（第 23 课）。第 6 题：[-овать]{.ru} 动词现在时 [-ова-]{.ru} 变成 [-у-]{.ru}：[рису́ем]{.ru}（第 32 课）。第 7 题：坐车带来的东西用 [везти́]{.ru} 一组，加前缀 [при-]{.ru}，过去时阳性 [привёз]{.ru}（第 38、39 课）。第 8 题：走遍某个地方用前缀 [об-]{.ru}，[обойти́]{.ru} 直接接第四格，过去时复数 [обошли́]{.ru}（第 43 课）。第 9 题：[кото́рая]{.ru} 和 [кни́га]{.ru} 同性同数，在从句里是 [дать]{.ru} 的直接宾语，用阴性第四格 [кото́рую]{.ru}（第 46 课）。第 10 题：从里面出来用前缀 [вы-]{.ru}，[вы́йти]{.ru} 的过去时阳性是 [вы́шел]{.ru}，重音永远在前缀 [вы́-]{.ru} 上（第 40 课）。第 11 题：数词要和名词同格，[о]{.ru} + 第六格 [о трёх кни́гах]{.ru}（第 55 课）。第 12 题：[написа́ть]{.ru} 写给谁用第三格，[два]{.ru} 的第三格是 [двум]{.ru}（第 55 课）。第 13 题：[постро́ить]{.ru} 的短尾被动形动词是 [постро́ен]{.ru}，和阳性的 [мост]{.ru} 一致（第 62 课）。第 14 题：无人称动词 [хоте́ться]{.ru} 现在时只用第三人称单数 [хо́чется]{.ru}，主体用第三格（第 61 课）。第 15 题：[одна́ из]{.ru} + 复数第二格，形容词也用复数第二格 [ста́рых]{.ru}；[оди́н]{.ru} 和 [у́лица]{.ru} 一致，用阴性 [одна́]{.ru}（第 58 课）。
  items:
  - stem: На столе́ лежи́т не́сколько ___.
    hint: я́блоко
    accept:
    - я́блок
  - stem: На пра́здник мы подари́ли цветы́ на́шим ___.
    hint: учи́тельница
    accept:
    - учи́тельницам
  - stem: Я горжу́сь ___.
    hint: мои́ роди́тели
    accept:
    - мои́ми роди́телями
  - stem: В э́том го́роде живёт мно́го ___.
    hint: лю́ди
    accept:
    - люде́й
  - stem: Зимо́й дни ___, чем ле́том.
    hint: коро́ткий
    accept:
    - коро́че
  - stem: Сейча́с мы с Ми́шей ___ портре́т ба́бушки.
    hint: рисова́ть
    accept:
    - рису́ем
  - stem: Вчера́ Ди́ма ___ нам из Каза́ни большо́й торт.
    hint: привезти́
    accept:
    - привёз
  - stem: В пе́рвый день мы ___ весь центр Каза́ни и о́чень уста́ли.
    hint: обойти́
    accept:
    - обошли́
  - stem: Кни́га, ___ ты мне дал, о́чень интере́сная.
    hint: кото́рая
    accept:
    - кото́рую
  - stem: В пять часо́в Ди́ма ___ из библиоте́ки и пошёл домо́й.
    hint: вы́йти
    accept:
    - вы́шел
  - stem: Мы до́лго говори́ли о ___ кни́гах.
    hint: три
    accept:
    - трёх
  - stem: Я написа́л ___ друзья́м.
    hint: два
    accept:
    - двум
  - stem: Э́тот мост был ___ в про́шлом году́.
    hint: постро́ить
    accept:
    - постро́ен
  - stem: Мне сейча́с о́чень ___ спать.
    hint: хоте́ться
    accept:
    - хо́чется
  - stem: Э́то одна́ из ___ у́лиц Москвы́.
    hint: ста́рый
    accept:
    - ста́рых
- id: e3
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 2
  why: 第 1 空：顺路到某处去一下用前缀 [за-]{.ru}：[зашёл в университе́т]{.ru}；[вошёл]{.ru} 只说走进去，[перешёл]{.ru} 是越过，[обошёл]{.ru} 是绕过或走遍（第 40、42、43 课）。第 2 空：在多长时间里做完了一件事，用 [за]{.ru} + 第四格，动词用完成体 [прочита́л]{.ru}；[на]{.ru} 表示结果持续多久，[че́рез]{.ru} 表示过多久以后（第 57 课）。第 3 空：[у]{.ru} 要求第二格，[кото́рый]{.ru} 和 [О́льга Ви́кторовна]{.ru} 同性，阴性第二格是 [кото́рой]{.ru}（第 46 课）。第 4 空：[ведь]{.ru} 引出对方也知道的理由，“您不是想当翻译吗”；[ра́зве]{.ru}、[неуже́ли]{.ru} 用在问句里，[пусть]{.ru} 表示让第三者做事（第 65、66 课）。第 5 空：好的结果的原因用 [благодаря́]{.ru} + 第三格 [ей]{.ru}；[из-за́]{.ru} 用于不好的结果，而且要求第二格（第 67 课）。第 6 空：[по́сле того́ как]{.ru} 从句里的动作在主句之前已经完成，用完成体过去时 [попроща́лся]{.ru}（第 28、49 课）。第 7 空：[для]{.ru} 要求第二格，数词也要变：[для двух друзе́й]{.ru}（第 55 课）。第 8 空：迪马对王磊一个人提议一起做，用 [дава́й]{.ru} + 完成体将来时第一人称复数；[пусть]{.ru} 是让别人做（第 65 课）。第 9 空：无人称动词 [каза́ться]{.ru} 表示“觉得、好像”，主体用第三格 [мне]{.ru}，动词用第三人称单数 [ка́жется]{.ru}（第 61 课）。第 10 空：[е́сли бы]{.ru} 句子说不现实的条件，主句用 [бы]{.ru} + 过去时 [оста́лся]{.ru}（第 50 课）。
  items:
  - options:
    - вошёл
    - зашёл
    - перешёл
    - обошёл
    answer: зашёл
  - options:
    - За
    - На
    - Че́рез
    - По́сле
    answer: За
  - options:
    - кото́рая
    - кото́рую
    - кото́рым
    - кото́рой
    answer: кото́рой
  - options:
    - ведь
    - ра́зве
    - неуже́ли
    - пусть
    answer: ведь
  - options:
    - Из-за́
    - Для
    - Благодаря́
    - От
    answer: Благодаря́
  - options:
    - проща́лся
    - попроща́лся
    - попроща́юсь
    - проща́юсь
    answer: попроща́лся
  - options:
    - два
    - двум
    - двумя́
    - двух
    answer: двух
  - options:
    - Пусть
    - Хотя́
    - Дава́й
    - Е́сли бы
    answer: Дава́й
  - options:
    - ка́жется
    - ка́жусь
    - хо́чется
    - нра́вится
    answer: ка́жется
  - options:
    - остаю́сь
    - оста́нусь
    - остава́ться
    - оста́лся
    answer: оста́лся
  passage: |
    ::: {.prose lang="ru"}
    **После́дний день в Москве́**

    За́втра я лечу́ домо́й, в Пеки́н. У́тром я (1) []{.blank} в университе́т к О́льге Ви́кторовне. Я жил в Москве́ почти́ год. (2) []{.blank} э́тот год я прочита́л двена́дцать ру́сских книг. О́льга Ви́кторовна, у (3) []{.blank} я учи́лся весь год, подари́ла мне сбо́рник стихо́в Пу́шкина. «Чита́йте ка́ждый день: вы (4) []{.blank} хоти́те стать перево́дчиком», — сказа́ла она́. (5) []{.blank} ей я хорошо́ сдал все экза́мены.

    По́сле того́ как я (6) []{.blank} с ней, мы с Ди́мой пое́хали в Изма́йлово. Там я купи́л сувени́ры для роди́телей и для (7) []{.blank} друзе́й в Пеки́не. Ма́ме я купи́л краси́вую ча́шку, а па́пе — ша́хматы.

    Ве́чером мы до́лго гуля́ли по Арба́ту. Вдруг Ди́ма сказа́л: «(8) []{.blank} ку́пим ещё моро́женое!»

    Мне (9) []{.blank}, что я уезжа́ю ненадо́лго. Е́сли бы у меня́ бы́ло бо́льше вре́мени, я бы (10) []{.blank} в Москве́ ещё на ме́сяц. Но я обяза́тельно верну́сь.
    :::
  passage_zh: |
    **在莫斯科的最后一天**

    明天我就要飞回家，回北京了。上午我顺路去学校看了看奥尔加·维克托罗夫娜。我在莫斯科住了将近一年。这一年里我读了十二本俄语书。我跟奥尔加·维克托罗夫娜学了一整年，她送给我一本普希金诗集。“每天都要读书：您不是想当翻译吗。”她说。多亏了她，我所有的考试都考得很好。

    和她告别以后，我和迪马去了伊兹梅洛沃。我在那儿给父母和北京的两个朋友买了纪念品。给妈妈买了一个漂亮的杯子，给爸爸买了一副国际象棋。

    晚上我们在阿尔巴特街散了很久的步。迪马忽然说：“我们再买个冰激凌吧！”

    我觉得自己这次离开不会太久。要是我有更多的时间，我会在莫斯科再待一个月。不过我一定会回来的。
- id: e4a
  type: choice
  task: 阅读理解（一）：阅读下面的记叙文，根据内容选出正确答案。
  points: 2
  passage: |
    ::: {.prose lang="ru"}
    **Грибы́**

    Ле́том Ва́ня жил у де́душки на да́че. Одна́жды у́тром де́душка сказа́л: «Пойдём за гриба́ми!» Ва́ня обра́довался: он ещё ни ра́зу не ходи́л за гриба́ми.

    Они́ взя́ли корзи́ны и пошли́ в лес. Снача́ла Ва́ня ничего́ не мог найти́, а в корзи́не у де́душки бы́ло уже́ мно́го подберёзовиков. Пото́м Ва́ня уви́дел под берёзой краси́вый кра́сный гриб с бе́лыми то́чками. «Де́душка, смотри́, како́й краси́вый!» — кри́кнул он. «Не бери́ его́, — сказа́л де́душка. — Э́то мухомо́р. Он ядови́тый».

    Они́ до́лго ходи́ли по ле́су и не заме́тили, что ста́ло темне́ть. Пошёл дождь. Ва́ня испуга́лся: он не знал, куда́ идти́. Но де́душка сказа́л: «Не бо́йся. Слы́шишь? Там идёт электри́чка. На́ша да́ча недалеко́ от ста́нции». Они́ пошли́ туда́, и че́рез полчаса́ уже́ сиде́ли до́ма.

    Ба́бушка пожа́рила грибы́. Ва́ня сказа́л, что никогда́ не ел ничего́ вкусне́е.
    :::
  why: 第 1 题，[он ещё ни ра́зу не ходи́л за гриба́ми]{.ru}。第 2 题，[Снача́ла Ва́ня ничего́ не мог найти́]{.ru}；采到很多桦树菇的是爷爷。第 3 题，爷爷说 [Э́то мухомо́р. Он ядови́тый]{.ru}。第 4 题，冒号后面说明原因：[он не знал, куда́ идти́]{.ru}。第 5 题，爷爷听见了电气火车的声音，[На́ша да́ча недалеко́ от ста́нции]{.ru}，就朝那边走。
