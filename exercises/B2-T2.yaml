  passage_zh: |
    **伏尔加河**

    伏尔加河是欧洲最长的河流，全长三千五百三十公里。伏尔加河发源时只是一条小溪，很容易就能跨过去。它注入里海。

    伏尔加河畔有许多古老的俄罗斯城市：雅罗斯拉夫尔、下诺夫哥罗德、喀山、萨马拉、伏尔加格勒等等。伏尔加河上有许多桥，但有些地方至今仍要坐轮船和小船过河。

    俄罗斯人热爱伏尔加河，常常称它为“母亲河”。关于伏尔加河写过很多诗和歌。

    夏天，伏尔加河上有载着游客的大型游轮。这样的旅行要一个多星期：游客每天都能看到一座新的城市。
