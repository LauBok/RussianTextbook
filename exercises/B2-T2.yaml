  passage_zh: |
    **蘑菇**

    夏天瓦尼亚住在爷爷的别墅里。一天早上，爷爷说：“我们去采蘑菇吧！”瓦尼亚很高兴：他还一次也没采过蘑菇呢。

    他们拿上篮子进了树林。起初瓦尼亚什么也找不到，爷爷的篮子里却已经有很多桦树菇了。后来瓦尼亚在一棵白桦树下看见一个漂亮的红蘑菇，上面有白点。“爷爷，你看，多漂亮啊！”他喊道。“别拿它，”爷爷说，“这是毒蝇伞，有毒。”

    他们在树林里走了很久，没发觉天开始黑了。下起了雨。瓦尼亚害怕了：他不知道该往哪儿走。可是爷爷说：“别怕。听见了吗？那边有电气火车开过去。我们的别墅离车站不远。”他们朝那边走，半小时后已经坐在家里了。

    奶奶把蘑菇煎了。瓦尼亚说，他从来没吃过比这更好吃的东西。
