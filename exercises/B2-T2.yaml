    **Во́лга**

    Во́лга — са́мая дли́нная река́ в Евро́пе. Её длина́ — три ты́сячи пятьсо́т три́дцать киломе́тров. Начина́ется Во́лга ма́леньким ручьём, че́рез кото́рый легко́ перейти́. А впада́ет она́ в Каспи́йское мо́ре.

    На Во́лге стоя́т ста́рые ру́сские города́: Яросла́вль, Ни́жний Но́вгород, Каза́нь, Сама́ра, Волгогра́д и други́е. Че́рез Во́лгу есть мно́го мосто́в, но в не́которых места́х её и сейча́с переплыва́ют на теплохо́дах и ло́дках.

    Ру́сские лю́бят Во́лгу и ча́сто называ́ют её ма́тушкой. О Во́лге напи́сано мно́го стихо́в и пе́сен.

    Ле́том по Во́лге хо́дят больши́е теплохо́ды с тури́стами. Така́я пое́здка продолжа́ется бо́льше неде́ли: ка́ждый день тури́сты ви́дят но́вый го́род.
