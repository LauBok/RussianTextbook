- id: e7
  type: open
  task: 写作。
  points: 30
  items:
  - prompt: 以“一次难忘的旅行”为题写一篇短文，150 词左右。内容包括：什么时候、和谁去了哪里，怎么去的；在那里看到了什么、做了什么；一件印象最深的事；你对这次旅行的感受。至少用到三个带前缀的运动动词、一个带 [кото́рый]{.ru} 的定语从句（[кото́рый]{.ru} 不用第一格）、一个时间从句或让步从句。
    length: 130–170
    model: |
      **Пое́здка, кото́рую я не забу́ду**

      В ма́е мы с дру́гом е́здили в Каза́нь. Мы прилете́ли туда́ пе́рвого ма́я у́тром. В аэропорту́ нас встре́тили роди́тели дру́га, кото́рые пригласи́ли нас к себе́ в го́сти.

      На сле́дующий день мы пошли́ в Каза́нский Кремль. Мы вошли́ в него́ че́рез Спа́сскую ба́шню и весь день ходи́ли по Кремлю́. Бо́льше всего́ мне понра́вилась больша́я мече́ть с голубы́ми купола́ми.

      Пото́м, хотя́ шёл дождь, мы подошли́ к Во́лге и переплы́ли её на теплохо́де. На друго́м берегу́ мы обошли́ ста́рый о́стров Свия́жск.

      Са́мым интере́сным для меня́ был ве́чер в семье́ дру́га. Его́ ма́ма, кото́рой я подари́л кита́йский чай, пригото́вила о́чень вку́сный у́жин. Мы до́лго разгова́ривали, и я почти́ всё понима́л. Когда́ мы уезжа́ли, она́ сказа́ла: «Приезжа́йте ещё!»

      Э́ту пое́здку я никогда́ не забу́ду. Я хочу́, что́бы мои́ роди́тели то́же уви́дели Каза́нь.
    rubric:
    - 内容 10 分：时间、同伴、地点和交通（2 分）；看到和做的事（3 分）；印象最深的一件事（3 分）；感受（2 分）
    - 语法 10 分：要求的三项（三个带前缀的运动动词 3 分，非第一格的 [кото́рый]{.ru} 从句 1 分，时间从句或让步从句 1 分）共 5 分；其余 5 分看全文语法错误，名词、形容词单复数变格，动词的体和变位，前置词和格的搭配，每两处错误扣 1 分
    - 词汇 5 分：用词准确、有变化，能用上本册学过的词（[пое́здка, путеше́ствовать, о́стров, кре́пость, на па́мять, знамени́т]{.ru} 等）给 5 分；用词单调或有三处以上用词不当的，酌情扣 1–3 分
    - 结构 5 分：有题目（1 分），按时间顺序分段、每段一个意思（2 分），开头和结尾呼应、句子之间衔接通顺（2 分）
    - 字数少于 100 词的，内容分最多给 6 分
    notes: 范文约 150 词，按时间顺序分五段：出发和到达、参观克里姆林、过伏尔加河、在朋友家的晚上、感受。语法上：[прилете́ли, вошли́, подошли́, переплы́ли, обошли́]{.ru} 是带前缀的运动动词，注意 [войти́ в]{.ru}、[подойти́ к]{.ru} 的前置词和前缀相配，[переплы́ть]{.ru}、[обойти́]{.ru} 直接接第四格（第 39–43 课）；[кото́рую я не забу́ду]{.ru} 用第四格，[кото́рой я подари́л]{.ru} 用第三格，[кото́рые пригласи́ли]{.ru} 用第一格（第 46 课）；[Хотя́ шёл дождь]{.ru} 是让步从句（第 52 课），[Когда́ мы уезжа́ли]{.ru} 是时间从句；[с голубы́ми купола́ми]{.ru} 是复数第五格（第 12、14 课）；[Я хочу́, что́бы…уви́дели]{.ru} 是 [что́бы]{.ru} 说明从句（第 47 课）。写作时先列出要用的运动动词，想清楚每个动词的前缀和后面的前置词，再连成文章。
