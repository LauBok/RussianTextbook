lesson: B2-L48
grammar: "目的从句：[что́бы]{.ru}、[для того́ что́бы]{.ru}；主语相同用不定式，主语不同用过去时形式；[что́бы не…]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的动词填空：主语相同用不定式，主语不同用过去时形式。
    why: "先找两个动作的主语。第 1、3、5 题主句和从句是同一个人（由美、皮埃尔、迪马），用不定式。第 2 题写信的是米沙，不忘的是王磊（[ты]{.ru}，男性），用 [забы́л]{.ru}。第 4 题主句是无人称的 [на́до]{.ru}，泛指，用不定式。第 6 题主句主语是老师，从句主语是 [студе́нты]{.ru}，用复数过去时形式 [по́няли]{.ru}。"
    items:
      - stem: Ю́ми е́дет в Петербу́рг, что́бы ___ в ле́тней шко́ле.
        hint: учи́ться
        accept: ["учи́ться"]
      - stem: Ми́ша бу́дет писа́ть Ван Лэ́ю, что́бы он не ___ ру́сский.
        hint: забы́ть
        accept: ["забы́л"]
      - stem: Пьер возьмёт фи́льмы, что́бы ___ их до́ма.
        hint: смотре́ть
        accept: ["смотре́ть"]
      - stem: Что́бы хорошо́ ___ язы́к, на́до говори́ть ка́ждый день.
        hint: знать
        accept: ["знать"]
      - stem: Ди́ма у́чит кита́йский, что́бы ___ в Пеки́н.
        hint: пое́хать
        accept: ["пое́хать"]
      - stem: О́льга Ви́кторовна говори́т ме́дленно, что́бы студе́нты всё ___.
        hint: поня́ть
        accept: ["по́няли"]

  - id: e2
    type: rewrite
    task: 按例句用 [что́бы]{.ru} 把两句话连成一句，说明前一个动作的目的。
    example:
      cue: Ван Лэй взял кни́гу. Он бу́дет чита́ть в самолёте.
      answer: Ван Лэй взял кни́гу, что́бы чита́ть в самолёте.
    why: "第 1、3 题两句主语相同，第二句改成 [что́бы]{.ru} + 不定式，主语和人称形式都去掉。第 2、4 题主语不同，保留从句主语，动词改成过去时形式：第 2 题 [А́нна]{.ru} → [помогла́]{.ru}；第 4 题 [ма́ма]{.ru} → [не волнова́лась]{.ru}，否定的目的用 [что́бы не]{.ru}。"
    items:
      - cue: Ю́ми пое́дет в Петербу́рг. Она́ сдаст экза́мен.
        accept: ["Ю́ми пое́дет в Петербу́рг, что́бы сдать экза́мен."]
      - cue: Ван Лэй позвони́л А́нне. Она́ помо́жет ему́.
        accept: ["Ван Лэй позвони́л А́нне, что́бы она́ помогла́ ему́."]
      - cue: Ди́ма и Ван Лэй бу́дут созва́ниваться. Они́ бу́дут говори́ть по-ру́сски и по-кита́йски.
        accept: ["Ди́ма и Ван Лэй бу́дут созва́ниваться, что́бы говори́ть по-ру́сски и по-кита́йски."]
      - cue: Ван Лэй пи́шет ма́ме ка́ждую неде́лю. Ма́ма не волну́ется.
        accept: ["Ван Лэй пи́шет ма́ме ка́ждую неде́лю, что́бы ма́ма не волнова́лась.", "Ван Лэй пи́шет ма́ме ка́ждую неде́лю, что́бы она́ не волнова́лась."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题主语相同（[я]{.ru} 来，[я]{.ru} 谈），运动动词后可以直接用不定式，也可以用 [что́бы]{.ru} + 不定式，但不能用过去时形式。第 2 题是说明从句，[хоте́ть]{.ru} 后主语不同，用 [что́бы]{.ru} + 过去时。第 3 题强调目的的 [для того́]{.ru} 拆开时，逗号在 [что́бы]{.ru} 前面。第 4 题“为了不迟到”是否定的目的，主语相同，用 [что́бы не опозда́ть]{.ru}。"
    items:
      - stem: Я пришёл, ___ с тобо́й.
        options: [что́бы поговори́ть, что́бы поговори́л, что поговорю́]
        answer: что́бы поговори́ть
      - stem: Ди́ма хо́чет, ___ Ван Лэй не забы́л ру́сский.
        options: [что, что́бы, для того́]
        answer: что́бы
      - stem: Ю́ми е́дет в Петербу́рг для того́, ___ учи́ться в ле́тней шко́ле.
        options: [что, что́бы, потому́ что]
        answer: что́бы
      - stem: Ди́ма вы́шел из до́ма ра́но, ___.
        options: [что́бы не опозда́ть, что́бы не опозда́л, что не опозда́ет]
        answer: что́бы не опозда́ть

  - id: e4
    type: translate
    task: 译成俄语。
    why: 第 1、3 题主语相同，用 [что́бы]{.ru} + 不定式；第 2 题主语不同，用过去时形式；第 4 题强调目的，用 [для того́ что́бы]{.ru}，主句是无人称的 [ну́жно / на́до]{.ru}，从句用不定式。
    items:
      - zh: 由美去彼得堡学俄语。
        accept: ["Ю́ми е́дет в Петербу́рг, что́бы учи́ть ру́сский язы́к.", "Ю́ми е́дет в Петербу́рг учи́ть ру́сский язы́к.", "Ю́ми е́дет в Петербу́рг, что́бы учи́ть ру́сский.", "Ю́ми е́дет в Петербу́рг учи́ть ру́сский.", "Ю́ми пое́дет в Петербу́рг, что́бы учи́ть ру́сский язы́к.", "Ю́ми пое́дет в Петербу́рг учи́ть ру́сский язы́к.", "Ю́ми е́дет в Петербу́рг, что́бы изуча́ть ру́сский язы́к.", "Ю́ми пое́дет в Петербу́рг, что́бы изуча́ть ру́сский язы́к."]
        rubric: ["目的用 [что́бы]{.ru} + 不定式，运动动词后也可直接用不定式", "[в Петербу́рг]{.ru}：第四格表示方向"]
      - zh: 我说得很慢，好让你们都听懂。
        accept: ["Я говорю́ ме́дленно, что́бы вы всё по́няли.", "Я говорю́ ме́дленно, что́бы все по́няли.", "Я говорю́ ме́дленно, что́бы вы все по́няли."]
        rubric: ["主语不同，用 [что́бы]{.ru} + 过去时形式 [по́няли]{.ru}"]
      - zh: 王磊带了一本书，好在飞机上看。
        accept: ["Ван Лэй взял кни́гу, что́бы чита́ть в самолёте.", "Ван Лэй взял с собо́й кни́гу, что́бы чита́ть в самолёте.", "Ван Лэй взял кни́гу, что́бы чита́ть её в самолёте.", "Ван Лэй взял с собо́й кни́гу, что́бы чита́ть её в самолёте."]
        rubric: ["主语相同，[что́бы]{.ru} + 不定式 [чита́ть]{.ru}", "[в самолёте]{.ru}：第六格"]
      - zh: 为了学好外语，需要每天说。
        accept: ["Для того́ что́бы хорошо́ знать иностра́нный язы́к, ну́жно говори́ть ка́ждый день.", "Для того́ что́бы хорошо́ знать иностра́нный язы́к, на́до говори́ть ка́ждый день.", "Что́бы хорошо́ знать иностра́нный язы́к, ну́жно говори́ть ка́ждый день.", "Что́бы хорошо́ знать иностра́нный язы́к, на́до говори́ть ка́ждый день.", "Для того́ что́бы хорошо́ вы́учить иностра́нный язы́к, ну́жно говори́ть ка́ждый день.", "Для того́ что́бы хорошо́ вы́учить иностра́нный язы́к, на́до говори́ть на нём ка́ждый день.", "Для того́ что́бы хорошо́ знать иностра́нный язы́к, на́до говори́ть на нём ка́ждый день.", "Что́бы хорошо́ знать иностра́нный язы́к, на́до говори́ть на нём ка́ждый день."]
        rubric: ["[для того́ что́бы]{.ru} 或 [что́бы]{.ru} + 不定式", "无人称谓语 [ну́жно]{.ru} 或 [на́до]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[О чём спроси́ла студе́нтов О́льга Ви́кторовна? Что бу́дут де́лать ле́том Ю́ми и Пьер? Како́й сове́т дала́ Ван Лэ́ю О́льга Ви́кторовна? Что предложи́л Ди́ма? Что сказа́л Ми́ша?]{.ru}"
        length: 60–90
        model: "О́льга Ви́кторовна спроси́ла студе́нтов о пла́нах на ле́то. Ю́ми пое́дет в Петербу́рг, что́бы учи́ться в ле́тней шко́ле и сдать экза́мен на пе́рвый у́ровень. Пьер возьмёт домо́й ру́сские фи́льмы, что́бы смотре́ть их по вечера́м. О́льга Ви́кторовна сказа́ла Ван Лэ́ю, что для того́ что́бы не забы́ть язы́к, на́до говори́ть на нём ка́ждый день. Ди́ма предложи́л созва́ниваться два ра́за в неде́лю, что́бы Ван Лэй не забы́л ру́сский, а Ди́ма учи́л кита́йский. А Ми́ша бу́дет писа́ть Ван Лэ́ю, что́бы он не забы́л их."
        rubric: ["回答全部五个问题", "至少四处目的从句，不定式和过去时形式用对", "对话改成第三人称叙述"]
        notes: 范文约 85 词。每个人的计划都用一个目的从句说明：由美、皮埃尔主语相同用不定式；迪马和米沙的句子里从句主语换成王磊，用过去时形式 [забы́л]{.ru}。

  - id: e6
    type: open
    task: 作文：《我怎样学俄语》。写写你为了学好俄语做了哪些事，暑假打算怎样不忘俄语。
    items:
      - prompt: 讲清楚：为什么学俄语；平时为了提高听、说、读、写各做什么；暑假的计划。至少用四处 [что́бы]{.ru}（其中至少一处主语不同），一处 [для того́ что́бы]{.ru}。
        length: 100–150
        model: "Я учу́ ру́сский язы́к уже́ год. Я на́чал его́ учи́ть, потому́ что хочу́ стать перево́дчиком. Что́бы лу́чше понима́ть ру́сских, я ка́ждое у́тро слу́шаю ра́дио. Что́бы бы́стрее чита́ть, я чита́ю ру́сские ска́зки и расска́зы. Ка́ждую неде́лю я пишу́ письмо́ моему́ ру́сскому дру́гу, и он пи́шет мне отве́т, что́бы я ви́дел, как пи́шут ру́сские. Говори́ть мне трудне́е всего́, поэ́тому я ча́сто хожу́ в кафе́ с ру́сскими студе́нтами. Для того́ что́бы не забы́ть язы́к ле́том, я бу́ду созва́ниваться с дру́гом два ра́за в неде́лю. А ещё я возьму́ домо́й ру́сские фи́льмы, что́бы смотре́ть их по вечера́м. Я ду́маю, что ле́том мой ру́сский не ста́нет ху́же."
        rubric: ["说明学习目的、平时的方法、暑假计划", "至少四处 [что́бы]{.ru}，其中至少一处主语不同、用过去时形式", "一处 [для того́ что́бы]{.ru}", "100–150 词"]
        notes: 范文约 120 词，按“为什么学—听、读、写、说各做什么—暑假计划—总结”的顺序写。目的从句大多放在句首（[Что́бы лу́чше понима́ть…, я…]{.ru}），强调目的；[он пи́шет мне отве́т, что́бы я ви́дел…]{.ru} 是主语不同的例子。

  - id: e7
    type: open
    task: 书信写作：以由美的身份给一所圣彼得堡的俄语暑期学校写一封咨询信。
    items:
      - prompt: 用正式的称呼和落款（对收信人用 [вы]{.ru}）；说明你是谁、为什么想上暑期班；问课程的时间、价格、住宿和考试。至少用三处 [что́бы]{.ru}。
        length: 80–120
        model: "Здра́вствуйте!\n\nМеня́ зову́т Ю́ми, я из Япо́нии. Сейча́с я учу́сь в Моско́вском университе́те. Я хочу́ в ию́ле учи́ться в ва́шей ле́тней шко́ле, что́бы не забы́ть ру́сский язы́к за ле́то. Пото́м я хочу́ рабо́тать перево́дчицей, поэ́тому мне ну́жно сдать экза́мен на пе́рвый у́ровень. Скажи́те, пожа́луйста, когда́ начина́ются заня́тия и ско́лько сто́ит курс? Мо́жно ли сдать экза́мен в конце́ ку́рса? Ещё я хоте́ла бы жить в ру́сской семье́, что́бы бо́льше говори́ть по-ру́сски. Что ну́жно сде́лать, что́бы учи́ться у вас?\n\nСпаси́бо!\nЮ́ми"
        rubric: ["正式书信：开头 [Здра́вствуйте!]{.ru}，对收信人用 [вы]{.ru}，结尾致谢、签名", "说明身份和目的，至少提两个问题", "至少三处 [что́бы]{.ru}", "80–120 词"]
        notes: 范文约 100 词。给不认识的人写信，开头用 [Здра́вствуйте!]{.ru}，全信对收信人用 [вы]{.ru}，结尾道谢、签名。提问用 [Скажи́те, пожа́луйста…]{.ru}、[Мо́жно ли…?]{.ru}，语气礼貌。
