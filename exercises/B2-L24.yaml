lesson: B2-L24
grammar: "复合式最高级 [са́мый]{.ru} + 形容词；单一式最高级 [-ейший, -айший]{.ru}；[лу́чший, ху́дший]{.ru}；比较级 + [всех / всего́]{.ru} 表示最高级意义。"
exercises:

  - id: e1
    type: fill
    task: 用 [са́мый]{.ru} 的正确形式填空。
    why: "[са́мый]{.ru} 和后面的形容词同性、同数、同格：第 1 题 [о́зеро]{.ru} 中性 → [са́мое]{.ru}；第 2 题 [река́]{.ru} 阴性 → [са́мая]{.ru}；第 3 题 [ме́сяц]{.ru} 阳性 → [са́мый]{.ru}；第 4 题 [в]{.ru} + 第六格 → [са́мом]{.ru}；第 5 题 [с]{.ru} + 第五格 → [са́мым]{.ru}；第 6 题复数 → [са́мые]{.ru}。最常见的错误是只变形容词，忘了 [са́мый]{.ru} 也要变格。"
    items:
      - stem: Байка́л — ___ глубо́кое о́зеро в ми́ре.
        hint: са́мый
        accept: ["са́мое"]
      - stem: Во́лга — ___ дли́нная река́ в Евро́пе.
        hint: са́мый
        accept: ["са́мая"]
      - stem: Апре́ль — ___ тру́дный ме́сяц для води́телей.
        hint: са́мый
        accept: ["са́мый"]
      - stem: Мы живём в ___ большо́м до́ме на у́лице.
        hint: са́мый
        accept: ["са́мом"]
      - stem: Ми́ша игра́ет в футбо́л с ___ высо́ким ма́льчиком в кла́ссе.
        hint: са́мый
        accept: ["са́мым"]
      - stem: Ди́ма и А́нна — мои́ ___ бли́зкие друзья́.
        hint: са́мый
        accept: ["са́мые"]

  - id: e2
    type: rewrite
    task: 按例句把“比较级 + [всех]{.ru}”改成用 [са́мый]{.ru} 的最高级。
    example:
      cue: Байка́л глу́бже всех озёр.
      answer: Байка́л — са́мое глубо́кое о́зеро.
    why: "比较级还原成形容词原级：[вы́ше → высо́кий]{.ru}，[длинне́е → дли́нный]{.ru}，[трудне́е → тру́дный]{.ru}，[моло́же → молодо́й]{.ru}，再按名词的性加 [са́мый]{.ru}：[гора́]{.ru} 阴性 → [са́мая высо́кая]{.ru}，[ме́сяц]{.ru} 阳性 → [са́мый тру́дный]{.ru}。[всех]{.ru} 后面的复数名词变回单数作表语。"
    items:
      - cue: Эльбру́с вы́ше всех гор в Росси́и.
        accept: ["Эльбру́с — са́мая высо́кая гора́ в Росси́и."]
      - cue: Во́лга длинне́е всех рек в Евро́пе.
        accept: ["Во́лга — са́мая дли́нная река́ в Евро́пе."]
      - cue: Апре́ль трудне́е всех ме́сяцев для води́телей.
        accept: ["Апре́ль — са́мый тру́дный ме́сяц для води́телей.", "Для води́телей апре́ль — са́мый тру́дный ме́сяц."]
      - cue: Ми́ша моло́же всех в семье́.
        accept: ["Ми́ша — са́мый молодо́й в семье́.", "Ми́ша — са́мый мла́дший в семье́."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题修饰名词 [вре́мя]{.ru}，要用形容词 [лу́чшее]{.ru}，比较级 [лу́чше]{.ru} 不能修饰名词。第 2 题 [что]{.ru} 问事物，“比什么都”用 [всего́]{.ru}；第 3 题 [кто]{.ru} 问人，“比谁都”用 [всех]{.ru}。第 4、5 题修饰名词，用单一式最高级 [важне́йший]{.ru}、[глубоча́йшее]{.ru}。"
    items:
      - stem: Ле́то — ___ вре́мя го́да для Ми́ши.
        options: [лу́чшее, лу́чше]
        answer: лу́чшее
      - stem: Что ты лю́бишь бо́льше ___?
        options: [всего́, всех]
        answer: всего́
      - stem: Кто в на́шей гру́ппе вы́ше ___?
        options: [всего́, всех]
        answer: всех
      - stem: Э́то ___ вопро́с.
        options: [важне́йший, важне́е]
        answer: важне́йший
      - stem: Байка́л — ___ о́зеро в ми́ре.
        options: [глубоча́йшее, глу́бже]
        answer: глубоча́йшее

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1、3、4 题用 [са́мый]{.ru} + 形容词，和名词一致；第 4 题在 [в]{.ru} 后面，[са́мый]{.ru} 和形容词都用第六格。第 2 题“最喜欢”用 [бо́льше всего́]{.ru}。第 5 题“到处是泥”用 [везде́ грязь]{.ru}。"
    items:
      - zh: 冬天是安娜最喜欢的季节。
        accept: ["Зима́ — са́мое люби́мое вре́мя го́да А́нны.", "Са́мое люби́мое вре́мя го́да А́нны — зима́.", "Зима́ — са́мое люби́мое вре́мя го́да у А́нны.", "У А́нны са́мое люби́мое вре́мя го́да — зима́.", "Зима́ — люби́мое вре́мя го́да А́нны.", "Люби́мое вре́мя го́да А́нны — зима́.", "Зима́ — люби́мое вре́мя го́да у А́нны.", "У А́нны люби́мое вре́мя го́да — зима́.", "Бо́льше всего́ А́нна лю́бит зи́му.", "А́нна бо́льше всего́ лю́бит зи́му.", "А́нна лю́бит зи́му бо́льше всего́.", "Бо́льше всего́ А́нне нра́вится зима́.", "А́нне бо́льше всего́ нра́вится зима́.", "А́нне зима́ нра́вится бо́льше всего́."]
        rubric: ["[са́мое люби́мое вре́мя го́да]{.ru}，或者 [бо́льше всего́ лю́бит]{.ru}", "[вре́мя]{.ru} 是中性"]
      - zh: 你最喜欢什么季节？
        accept: ["Како́е вре́мя го́да ты лю́бишь бо́льше всего́?", "Како́е вре́мя го́да тебе́ нра́вится бо́льше всего́?", "Како́е твоё люби́мое вре́мя го́да?", "Како́е у тебя́ люби́мое вре́мя го́да?", "Како́е вре́мя го́да вы лю́бите бо́льше всего́?", "Како́е вре́мя го́да вам нра́вится бо́льше всего́?", "Како́е ва́ше люби́мое вре́мя го́да?", "Како́е у вас люби́мое вре́мя го́да?"]
        rubric: ["[како́е вре́мя го́да]{.ru}", "[бо́льше всего́]{.ru} 或 [люби́мое]{.ru}"]
      - zh: 五月是一年里最好的月份。
        accept: ["Май — са́мый лу́чший ме́сяц в году́.", "Май — лу́чший ме́сяц в году́.", "Май — лу́чший ме́сяц го́да.", "Май — са́мый лу́чший ме́сяц го́да.", "Май — са́мый хоро́ший ме́сяц в году́.", "Май — са́мый хоро́ший ме́сяц го́да."]
        rubric: ["[лу́чший]{.ru} 或 [са́мый лу́чший / хоро́ший]{.ru}", "[в году́]{.ru} 或 [го́да]{.ru}"]
      - zh: 我们住在这条街上最高的楼里。
        accept: ["Мы живём в са́мом высо́ком до́ме на э́той у́лице.", "Мы живём в са́мом высо́ком до́ме на у́лице.", "На э́той у́лице мы живём в са́мом высо́ком до́ме."]
        rubric: ["[в са́мом высо́ком до́ме]{.ru}：三个词都用第六格"]
      - zh: 四月路上到处是泥。
        accept: ["В апре́ле на доро́гах везде́ грязь.", "В апре́ле везде́ на доро́гах грязь.", "В апре́ле на доро́ге везде́ грязь.", "В апре́ле на доро́гах мно́го гря́зи."]
        rubric: ["[грязь]{.ru} 是阴性名词", "[в апре́ле]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́е зада́ние дала́ студе́нтам О́льга Ви́кторовна? Како́е вре́мя го́да лю́бит ка́ждый из Петро́вых? Что тако́е распу́тица? Что случи́лось в про́шлом году́? Что написа́л в сочине́нии Ван Лэй?]{.ru}"
        length: 50–80
        model: "О́льга Ви́кторовна дала́ студе́нтам зада́ние — написа́ть сочине́ние «Са́мое краси́вое вре́мя го́да». А́нна бо́льше всего́ лю́бит зи́му, Ми́ша — ле́то, Мари́я Никола́евна — о́сень. Ива́н Серге́евич лю́бит весну́, но апре́ль для него́ — са́мый тру́дный ме́сяц: сейча́с распу́тица, на доро́гах грязь и лу́жи. В про́шлом году́ их маши́на застря́ла по доро́ге на да́чу. Ван Лэй написа́л, что са́мое краси́вое вре́мя — когда́ ря́дом са́мые бли́зкие лю́ди."
        rubric: ["回答全部五个问题", "至少用三个最高级（[са́мый]{.ru} + 形容词、[бо́льше всего́]{.ru} 等）", "[са́мый]{.ru} 和形容词、名词一致"]
        notes: 范文约 70 词。第二句用破折号省去了重复的 [лю́бит]{.ru}：[Ми́ша — ле́то, Мари́я Никола́евна — о́сень]{.ru}，一句话交代了三个人的喜好。“泥泞季是什么”没有单独下定义，而是用冒号后面的具体情形来解释。

  - id: e6
    type: open
    task: 作文：《我最喜欢的季节》。说说你家乡的四季，哪个季节最美、最舒服、最难熬，你最喜欢哪个季节、为什么，这个季节里你通常做什么。
    items:
      - prompt: 写 100–150 词。至少用四个 [са́мый]{.ru} + 形容词的最高级，再用上 [бо́льше всего́]{.ru} 和至少两个比较级。
        length: 100–150
        model: "Я из Пеки́на. Са́мое тру́дное вре́мя го́да у нас — ле́то: в ию́ле о́чень жа́рко, иногда́ со́рок гра́дусов. Зима́ в Пеки́не холо́дная и суха́я, снег идёт ре́дко. Весно́й ча́сто быва́ет си́льный ве́тер. А бо́льше всего́ я люблю́ о́сень. По-мо́ему, о́сень — са́мое краси́вое и са́мое прия́тное вре́мя го́да в Пеки́не. В октябре́ мно́го со́лнца, во́здух чи́ще, чем ле́том, и не так жа́рко. Па́рки и го́ры о́чень краси́вые. В выходны́е мы с друзья́ми е́здим в го́ры за го́родом. Там краси́вее, чем в це́нтре, и люде́й ме́ньше. Ещё о́сенью в Пеки́не са́мые вку́сные фру́кты. А в нача́ле октября́ у нас са́мые дли́нные пра́здники: вся страна́ отдыха́ет це́лую неде́лю."
        rubric: ["写到至少三个季节，重点写最喜欢的一个", "至少四个 [са́мый]{.ru} + 形容词，性数格一致", "[бо́льше всего́]{.ru} 和至少两个比较级", "100–150 词"]
        notes: 范文先用一两句话分别写夏、冬、春，再用 [А бо́льше всего́ я люблю́ о́сень]{.ru} 转入正题，详细写秋天：天气、景色、活动、水果、节日。最高级用了五次，比较级有 [чи́ще, краси́вее, ме́ньше]{.ru}，[чем]{.ru} 后面的词和前面的词同格（[чем ле́том]{.ru}、[чем в це́нтре]{.ru}）。
