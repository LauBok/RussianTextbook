lesson: B2-L64
grammar: "直接引语与间接引语的转换：陈述句用 [что]{.ru}，特殊疑问句保留疑问词，一般疑问句用 [ли]{.ru}，请求和命令用 [что́бы]{.ru} + 过去时形式；人称和物主代词的变化；直接引语的标点。"
exercises:

  - id: e1
    type: rewrite
    task: 把直接引语改成间接引语。
    example:
      cue: "Ди́ма сказа́л: «Я приду́ в шесть»."
      answer: Ди́ма сказа́л, что придёт в шесть.
    why: "第 1、6 题是陈述句，用 [что]{.ru}；第 6 题原话是将来时 [позвоню́]{.ru}，转述仍用将来时 [позвони́т]{.ru}，不能改成过去时。第 2 题保留疑问词 [где]{.ru}，[ты]{.ru} 换成 [он]{.ru}。第 3 题是一般疑问句，被问的是动词 [купи́ла]{.ru}，把它放在从句最前面，[ли]{.ru} 紧跟其后。第 4、5 题是命令式，用 [что́бы]{.ru} + 过去时形式；第 5 题原话是否定命令式，转述保留 [не]{.ru} 和未完成体。第 7 题带 [не]{.ru} 的问句，[не уста́ла]{.ru} 一起放在 [ли]{.ru} 前面。第 8 题从句的主语是 [брат]{.ru}，“她的”不指从句主语，所以用 [её]{.ru}，不用 [свой]{.ru}。"
    items:
      - cue: "Све́та сказа́ла: «Я хочу́ учи́ться в Москве́»."
        accept: ["Све́та сказа́ла, что хо́чет учи́ться в Москве́.", "Све́та сказа́ла, что она́ хо́чет учи́ться в Москве́."]
      - cue: "Ми́ша спроси́л Ди́му: «Где ты был?»"
        accept: ["Ми́ша спроси́л Ди́му, где он был."]
      - cue: "Ма́ма спроси́ла Све́ту: «Ты купи́ла пла́тье?»"
        accept: ["Ма́ма спроси́ла Све́ту, купи́ла ли она́ пла́тье."]
      - cue: "А́нна сказа́ла Ди́ме: «Позвони́ сестре́!»"
        accept: ["А́нна сказа́ла Ди́ме, что́бы он позвони́л сестре́.", "А́нна сказа́ла, что́бы Ди́ма позвони́л сестре́."]
      - cue: "Учи́тель сказа́л выпускника́м: «Не опа́здывайте на бал!»"
        accept: ["Учи́тель сказа́л выпускника́м, что́бы они́ не опа́здывали на бал.", "Учи́тель сказа́л, что́бы выпускники́ не опа́здывали на бал."]
      - cue: "Ди́ма сказа́л: «Я позвоню́ ве́чером»."
        accept: ["Ди́ма сказа́л, что позвони́т ве́чером.", "Ди́ма сказа́л, что он позвони́т ве́чером."]
      - cue: "Ван Лэй спроси́л А́нну: «Ты не уста́ла?»"
        accept: ["Ван Лэй спроси́л А́нну, не уста́ла ли она́."]
      - cue: "Све́та сказа́ла: «Мой брат живёт в Москве́»."
        accept: ["Све́та сказа́ла, что её брат живёт в Москве́."]

  - id: e2
    type: choice
    task: 选择正确的词填空。
    why: "第 1 题转述陈述句，用 [что]{.ru}。第 2 题转述请求（原话是 [«Позвони́ мне!»]{.ru}），用 [что́бы]{.ru}。第 3 题转述一般疑问句，[ли]{.ru} 跟在被问的词 [был]{.ru} 后面。第 4 题只有 [почему́]{.ru} 能引出“不知道为什么”；[ли]{.ru} 不能放在从句第一位，[что́бы]{.ru} 不用于 [не зна́ет]{.ru} 后。第 5 题 [что́бы]{.ru} 后用过去时形式 [пришли́]{.ru}，不用将来时，也不用不定式（从句有自己的主语 [мы]{.ru}）。第 6 题转述陈述句时间不变，有 [за́втра]{.ru}，原话是将来时，所以用 [позвони́т]{.ru}。第 7 题“她的连衣裙”：从句主语是 [э́то]{.ru}，不是斯韦塔，所以用 [её]{.ru}；[своё]{.ru} 只能指从句的主语，[моё]{.ru} 是没改人称的原话。"
    items:
      - stem: Ди́ма сказа́л, ___ его́ сестра́ око́нчила шко́лу.
        options: [что, что́бы, ли]
        answer: что
      - stem: Ма́ма попроси́ла, ___ Све́та позвони́ла ей с на́бережной.
        options: [что, что́бы, ли]
        answer: что́бы
      - stem: Ми́ша спроси́л, был ___ Ди́ма на выпускно́м.
        options: [ли, что, что́бы]
        answer: ли
      - stem: А́нна не зна́ет, ___ Ди́ма опя́ть опозда́л.
        options: [почему́, что́бы, ли]
        answer: почему́
      - stem: Учи́тель сказа́л, что́бы мы ___ ро́вно в шесть.
        options: [пришли́, придём, прийти́]
        answer: пришли́
      - stem: Све́та сказа́ла, что за́втра ___ ба́бушке.
        options: [позвони́т, позвони́ла, позвони́ть]
        answer: позвони́т
      - stem: Све́та сказа́ла, что э́то ___ пла́тье.
        options: [её, своё, моё]
        answer: её

  - id: e3
    type: rewrite
    task: 把间接引语改成直接引语，作者的话放在后面。
    example:
      cue: Ди́ма сказа́л, что придёт в шесть.
      answer: «Я приду́ в шесть», — сказа́л Ди́ма.
    why: "改回直接引语时，转述里的 [он, она́]{.ru} 变回说话人自己的 [я]{.ru}，被问的人变回 [ты]{.ru}。作者的话放在后面时，主语和动词倒装（[сказа́ла Све́та]{.ru}），引号后先写逗号再写破折号；原话是问句或命令句时，问号、感叹号留在引号里，后面不加逗号。第 2 题 [ли]{.ru} 去掉，恢复成一般疑问句。第 3 题 [что́бы]{.ru} + 过去时形式变回命令式 [позвони́]{.ru}。第 4 题原话里斯韦塔说的是自己，[свой]{.ru}/[её]{.ru} 变回 [мой]{.ru}。"
    items:
      - cue: Све́та сказа́ла, что хо́чет поступа́ть в Моско́вский университе́т.
        accept: ["«Я хочу́ поступа́ть в Моско́вский университе́т», — сказа́ла Све́та."]
      - cue: Ма́ма спроси́ла Све́ту, не бои́тся ли она́ жить одна́.
        accept: ["«Ты не бои́шься жить одна́?» — спроси́ла ма́ма.", "«Ты не бои́шься жить одна́?» — спроси́ла ма́ма Све́ту."]
      - cue: А́нна сказа́ла Ди́ме, что́бы он позвони́л сестре́.
        accept: ["«Позвони́ сестре́!» — сказа́ла А́нна.", "«Позвони́ сестре́», — сказа́ла А́нна.", "«Позвони́ сестре́!» — сказа́ла А́нна Ди́ме."]
      - cue: Све́та сказа́ла, что её брат живёт в Москве́.
        accept: ["«Мой брат живёт в Москве́», — сказа́ла Све́та."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“他会飞回家”是将来的事，转述仍用将来时 [полети́т]{.ru}（表示计划时也可用现在时 [лети́т]{.ru}）。第 2 题是一般疑问，用 [ли]{.ru}；中文“怕不怕”可以用带 [не]{.ru} 的委婉问法。第 3 题转述请求，可以用 [попроси́ть кого́ + 不定式]{.ru}，也可以用 [что́бы]{.ru} + 过去时形式。第 4 题“会不会来”是“是否”，只能用 [ли]{.ru}，不能用 [е́сли]{.ru}。"
    items:
      - zh: 迪马说他星期二飞回家。
        accept: ["Ди́ма сказа́л, что во вто́рник полети́т домо́й.", "Ди́ма сказа́л, что он во вто́рник полети́т домо́й.", "Ди́ма сказа́л, что полети́т домо́й во вто́рник.", "Ди́ма сказа́л, что он полети́т домо́й во вто́рник.", "Ди́ма сказа́л, что во вто́рник лети́т домо́й.", "Ди́ма сказа́л, что он во вто́рник лети́т домо́й.", "Ди́ма сказа́л, что лети́т домо́й во вто́рник.", "Ди́ма сказа́л, что он лети́т домо́й во вто́рник."]
        rubric: ["转述陈述句用 [что]{.ru}", "从句保持将来的意义：[полети́т]{.ru} 或 [лети́т]{.ru}，不能用过去时", "[во вто́рник]{.ru}"]
      - zh: 妈妈问斯韦塔一个人住怕不怕。
        accept: ["Ма́ма спроси́ла Све́ту, не бои́тся ли она́ жить одна́.", "Ма́ма спроси́ла Све́ту, бои́тся ли она́ жить одна́.", "Ма́ма спроси́ла у Све́ты, не бои́тся ли она́ жить одна́.", "Ма́ма спроси́ла у Све́ты, бои́тся ли она́ жить одна́."]
        rubric: ["一般疑问句转述用 [ли]{.ru}，[ли]{.ru} 紧跟 [бои́тся]{.ru}", "[одна́]{.ru} 用阴性", "人称改为 [она́]{.ru}"]
      - zh: 安娜请王磊给她打电话。
        accept: ["А́нна попроси́ла Ван Лэ́я позвони́ть ей.", "А́нна попроси́ла Ван Лэ́я ей позвони́ть.", "А́нна попроси́ла, что́бы Ван Лэй позвони́л ей.", "А́нна попроси́ла, что́бы Ван Лэй ей позвони́л.", "А́нна попроси́ла Ван Лэ́я, что́бы он позвони́л ей.", "А́нна попроси́ла Ван Лэ́я, что́бы он ей позвони́л."]
        rubric: ["[попроси́ла]{.ru} + 第四格 + 不定式，或 [что́бы]{.ru} + 过去时形式", "不能用 [что]{.ru}"]
      - zh: 我不知道他会不会来。
        accept: ["Я не зна́ю, придёт ли он.", "Не зна́ю, придёт ли он.", "Я не зна́ю, придёт ли он и́ли нет.", "Не зна́ю, придёт ли он и́ли нет.", "Я не зна́ю, прие́дет ли он.", "Не зна́ю, прие́дет ли он."]
        rubric: ["“是否”用 [ли]{.ru}，不用 [е́сли]{.ru}", "[придёт]{.ru} 放在 [ли]{.ru} 前面"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Во ско́лько Ди́ма обеща́л прийти́ к Петро́вым и когда́ он пришёл? Почему́ он не пое́хал на выпускно́й к сестре́? Что бы́ло на выпускно́м? Куда́ выпускники́ пошли́ у́тром? Что Све́та хо́чет де́лать тепе́рь? О чём Мари́я Никола́евна попроси́ла Ди́му?]{.ru}"
        length: 70–100
        model: "Ди́ма сказа́л, что придёт к Петро́вым в шесть, но пришёл в семь: он разгова́ривал с сестро́й. Вчера́ у Све́ты был выпускно́й. Ди́ма не пое́хал в Каза́нь, потому́ что его́ после́дний экза́мен был в пя́тницу, а биле́тов на самолёт уже́ не́ было. Он рассказа́л, что дире́ктор вручи́л выпускника́м аттеста́ты, а пото́м был бал. Све́та танцева́ла пе́рвый вальс с па́пой, и па́па сказа́л, что э́то был са́мый тро́гательный та́нец в его́ жи́зни. В три часа́ но́чи выпускники́ пошли́ на на́бережную встреча́ть рассве́т. Све́та сказа́ла, что хо́чет поступа́ть в Моско́вский университе́т. Мари́я Никола́евна попроси́ла, что́бы Ди́ма переда́л Све́те поздравле́ния."
        rubric: ["回答全部六个问题", "至少三处间接引语，其中有 [что]{.ru} 和 [что́бы]{.ru} 各一处", "转述时时不变：[сказа́л, что придёт]{.ru}"]
        notes: 范文约 95 词，按问题顺序写。课文里的对话都改成了转述：迪马的原话 [«Я приду́ в шесть»]{.ru} 写成 [сказа́л, что придёт в шесть]{.ru}，玛丽亚的请求写成 [попроси́ла, что́бы … переда́л]{.ru}。迟到的原因用冒号直接接在后面，比 [потому́ что]{.ru} 更简洁。

  - id: e6
    type: open
    task: 作文：我的毕业晚会。
    items:
      - prompt: 写一写你中学（或大学）毕业时的晚会或典礼：在哪里、有什么活动、校长和老师说了什么、同学问了你什么、父母说了什么。至少用四句间接引语，其中要有 [что]{.ru}、[ли]{.ru} 和 [что́бы]{.ru}。
        length: 100–150
        model: "Я око́нчил шко́лу два го́да наза́д, и я хорошо́ по́мню наш выпускно́й. Снача́ла в шко́ле был торже́ственный ве́чер. Дире́ктор сказа́л, что мы все молодцы́, и вручи́л нам аттеста́ты. На́ша учи́тельница сказа́ла, что бу́дет скуча́ть по нам, и попроси́ла, что́бы мы ча́сто писа́ли ей. Пото́м мы пе́ли пе́сни и де́лали фо́то. Мой друг спроси́л меня́, куда́ я бу́ду поступа́ть. Я отве́тил, что хочу́ изуча́ть ру́сский язы́к. Он засмея́лся и спроси́л, не тру́дно ли э́то. Я сказа́л, что тру́дно, но о́чень интере́сно. Но́чью мы до́лго гуля́ли по го́роду, а у́тром встре́тили рассве́т в па́рке. До́ма ма́ма спроси́ла, почему́ я пришёл так по́здно. А па́па сказа́л, что выпускно́й быва́ет то́лько оди́н раз в жи́зни. Тепе́рь я учу́сь в Москве́ и ча́сто вспомина́ю тот ве́чер."
        rubric: ["说明时间、地点和主要活动", "至少四句间接引语：[что]{.ru}、疑问词或 [ли]{.ru}、[что́бы]{.ru} 都要用到", "转述时人称改对、时不变", "100–150 词，有开头和结尾"]
        notes: 范文按时间顺序写：典礼、晚会、夜里散步、回家。每个环节都有一句转述：校长的话（[сказа́л, что]{.ru}）、老师的请求（[попроси́ла, что́бы]{.ru} + 过去时形式）、同学的问题（[спроси́л, куда́]{.ru}、[спроси́л, не тру́дно ли]{.ru}）、妈妈的问题（[спроси́ла, почему́]{.ru}）。注意 [бу́дет скуча́ть]{.ru}、[бу́ду поступа́ть]{.ru}：原话是将来时，转述仍是将来时。女生写时动词过去时用阴性：[я око́нчила, отве́тила, пришла́]{.ru}。

  - id: e7
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是迪马。星期六晚上从彼得罗夫家回来后，给斯韦塔写一封短信：再次祝贺她毕业，转述彼得罗夫家每个人说了什么、问了什么、请你转告什么，说说你什么时候回家。注意书信的格式。
        length: 80–120
        model: |
          Москва́, 26 ию́ня

          Дорога́я Све́та!

          Ещё раз поздравля́ю тебя́ с выпускны́м! Я о́чень горжу́сь тобо́й.

          Сего́дня я был у Петро́вых и всё им рассказа́л. Ива́н Серге́евич сказа́л, что золота́я меда́ль — э́то о́чень хорошо́. Мари́я Никола́евна попроси́ла, что́бы я переда́л тебе́ поздравле́ния от всей семьи́. Ми́ша спроси́л, уме́ешь ли ты игра́ть в футбо́л. Я отве́тил, что ты не уме́ешь, но о́чень краси́во танцу́ешь вальс! А́нна спроси́ла, когда́ ты бу́дешь в Москве́: она́ хо́чет показа́ть тебе́ университе́т. А Ван Лэй сказа́л, что то́же хо́чет уви́деть рассве́т над Во́лгой.

          Во вто́рник я бу́ду до́ма. Скажи́ ма́ме, что́бы она́ не встреча́ла меня́ в аэропорту́: я сам прие́ду.

          Твой брат Ди́ма
        rubric: ["地点、日期、称呼、落款格式正确", "对妹妹用 [ты]{.ru}，落款用 [Твой брат]{.ru}", "至少四句间接引语，[что]{.ru}、[ли]{.ru} 或疑问词、[что́бы]{.ru} 都要有", "转述时把人称改成从迪马的角度：[тебе́]{.ru}、[ты]{.ru}"]
        notes: 范文分三段：祝贺、转述、打算。转述部分每个人一句，人称都要从迪马对斯韦塔说话的角度改：米沙问的“她会不会踢足球”写成 [уме́ешь ли ты]{.ru}，玛丽亚的请求写成 [переда́л тебе́]{.ru}。最后一句 [Скажи́ ма́ме, что́бы она́ не встреча́ла меня́]{.ru} 是让斯韦塔转达的请求，否定命令用未完成体 [не встреча́ла]{.ru}。
