lesson: B2-L46
grammar: "定语从句：[кото́рый]{.ru} 的各格；带前置词的 [кото́рый]{.ru}；表示所属的 [кото́рого]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用 [кото́рый]{.ru} 的适当形式填空，需要时加上前置词。
    why: "先看先行词定性和数，再把从句还原成独立的句子定格。第 1 题 [в до́ме]{.ru} → [в кото́ром]{.ru}。第 2 题 [люби́л де́вушку]{.ru}，阴性第四格 [кото́рую]{.ru}。第 3 题 [с челове́ком]{.ru} → [с кото́рым]{.ru}。第 4 题 [худо́жника]{.ru} 是动物名词，阳性第四格同第二格 [кото́рого]{.ru}，最容易错写成 [кото́рый]{.ru}。第 5 题 [расска́зывала о друзья́х]{.ru} → [о кото́рых]{.ru}。第 6 题 [пе́сни музыка́нта]{.ru}，表示所属用第二格 [кото́рого]{.ru}，放在 [пе́сни]{.ru} 后面，不受 [пе́сни]{.ru} 的数影响。第 7 题 [на у́лице]{.ru} → [на кото́рой]{.ru}。第 8 题 [звони́т подру́ге]{.ru} → 第三格 [кото́рой]{.ru}。"
    items:
      - stem: Вот дом, ___ жил Пу́шкин.
        hint: кото́рый
        accept: ["в кото́ром"]
      - stem: Ната́лья Гончаро́ва — де́вушка, ___ Пу́шкин о́чень люби́л.
        hint: кото́рый
        accept: ["кото́рую"]
      - stem: Кто э́тот молодо́й челове́к, ___ идёт Ка́тя?
        hint: кото́рый
        accept: ["с кото́рым"]
      - stem: Вот худо́жник, ___ мы ви́дели на углу́.
        hint: кото́рый
        accept: ["кото́рого"]
      - stem: Э́то мои́ друзья́, ___ я тебе́ расска́зывала.
        hint: кото́рый
        accept: ["о кото́рых"]
      - stem: Цой — музыка́нт, пе́сни ___ я слу́шаю ка́ждый день.
        hint: кото́рый
        accept: ["кото́рого"]
      - stem: Арба́т — у́лица, ___ всегда́ мно́го тури́стов.
        hint: кото́рый
        accept: ["на кото́рой"]
      - stem: Ка́тя — подру́га, ___ А́нна ча́сто звони́т.
        hint: кото́рый
        accept: ["кото́рой"]

  - id: e2
    type: rewrite
    task: 按例句用 [кото́рый]{.ru} 把两句话连成一句。
    example:
      cue: Э́то па́мятник. Мы ви́дели его́ на Арба́те.
      answer: Э́то па́мятник, кото́рый мы ви́дели на Арба́те.
    why: "第二句里指代先行词的代词换成 [кото́рый]{.ru}，放在从句开头，有前置词的连前置词一起提前。第 1 题 [в нём]{.ru} → [в кото́ром]{.ru}。第 2 题 [её]{.ru} 是第四格，先行词阴性 → [кото́рую]{.ru}。第 3 题 [с ним]{.ru} → [с кото́рым]{.ru}。第 4 题 [о ней]{.ru} → [о кото́рой]{.ru}。第 5 题 [его́ пе́сни]{.ru} 表示所属 → [пе́сни кото́рого]{.ru}，注意语序。"
    items:
      - cue: Вот кафе́. Мы бы́ли в нём вчера́.
        accept: ["Вот кафе́, в кото́ром мы бы́ли вчера́."]
      - cue: Э́то де́вушка. Я встре́тил её на Арба́те.
        accept: ["Э́то де́вушка, кото́рую я встре́тил на Арба́те."]
      - cue: Э́то Илья́. Ка́тя гуля́ла с ним по Арба́ту.
        accept: ["Э́то Илья́, с кото́рым Ка́тя гуля́ла по Арба́ту."]
      - cue: Вот у́лица. Ди́ма мно́го расска́зывал о ней.
        accept: ["Вот у́лица, о кото́рой Ди́ма мно́го расска́зывал."]
      - cue: Цой — музыка́нт. Его́ пе́сни зна́ют все.
        accept: ["Цой — музыка́нт, пе́сни кото́рого зна́ют все."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "第 1 题从句主语是 [кото́рый]{.ru} 本身（[лю́ди шли]{.ru}），用第一格 [кото́рые]{.ru}。第 2 题 [жени́ться на ком]{.ru}，阴性第六格 [на кото́рой]{.ru}。第 3 题 [портре́т]{.ru} 是非动物名词，第四格同第一格 [кото́рый]{.ru}；[кото́рого]{.ru} 只用于动物名词。第 4 题 [дари́ть кому́]{.ru}，复数第三格 [кото́рым]{.ru}。第 5 题先行词 [пла́тье]{.ru} 是中性，[купи́ла пла́тье]{.ru} → [кото́рое]{.ru}。"
    items:
      - stem: Ван Лэй смотре́л на люде́й, ___ шли ми́мо.
        options: [кото́рые, кото́рых, кото́рым]
        answer: кото́рые
      - stem: Э́то де́вушка, ___ он жени́лся.
        options: [на кото́рую, на кото́рой, с кото́рой]
        answer: на кото́рой
      - stem: Вот портре́т, ___ нарисова́л худо́жник.
        options: [кото́рый, кото́рого, кото́рому]
        answer: кото́рый
      - stem: Я позвони́л друзья́м, ___ я дарю́ пода́рки на Но́вый год.
        options: [кото́рые, кото́рых, кото́рым]
        answer: кото́рым
      - stem: А́нна показа́ла пла́тье, ___ она́ купи́ла на сва́дьбу.
        options: [кото́рый, кото́рое, кото́рую]
        answer: кото́рое

  - id: e4
    type: translate
    task: 译成俄语。
    why: 汉语的“……的”放在名词前，俄语的定语从句放在名词后，用逗号隔开；[кото́рый]{.ru} 的性数随先行词，格随它在从句里的作用。
    items:
      - zh: 这就是普希金住过的房子。
        accept: ["Вот дом, в кото́ром жил Пу́шкин.", "Э́то дом, в кото́ром жил Пу́шкин.", "Вот дом, где жил Пу́шкин.", "Э́то дом, где жил Пу́шкин."]
        rubric: ["[дом]{.ru} 在前，从句在后", "[в кото́ром]{.ru}：前置词放在 [кото́рый]{.ru} 前，第六格"]
      - zh: 和卡佳一起走的那个年轻人是谁？
        accept: ["Кто э́тот молодо́й челове́к, с кото́рым идёт Ка́тя?", "Кто э́тот молодо́й челове́к, с кото́рым Ка́тя идёт?", "Кто тот молодо́й челове́к, с кото́рым идёт Ка́тя?", "Кто тот молодо́й челове́к, с кото́рым Ка́тя идёт?"]
        rubric: ["[с кото́рым]{.ru}：第五格", "从句紧跟 [молодо́й челове́к]{.ru}"]
      - zh: 我喜欢那位画师，他画的肖像很好。
        accept: ["Мне нра́вится худо́жник, портре́ты кото́рого о́чень хоро́шие.", "Мне нра́вится э́тот худо́жник, портре́ты кото́рого о́чень хоро́шие.", "Мне нра́вится тот худо́жник, портре́ты кото́рого о́чень хоро́шие.", "Мне нра́вится худо́жник, у кото́рого о́чень хоро́шие портре́ты.", "Мне нра́вится э́тот худо́жник, у кото́рого о́чень хоро́шие портре́ты."]
        rubric: ["表示所属用 [портре́ты кото́рого]{.ru}，[кото́рого]{.ru} 在名词后", "“喜欢”用 [нра́виться]{.ru}"]
      - zh: 这是我们在阿尔巴特街上遇见的朋友们。
        accept: ["Э́то друзья́, кото́рых мы встре́тили на Арба́те.", "Вот друзья́, кото́рых мы встре́тили на Арба́те.", "Э́то друзья́, кото́рых мы встре́тили на Ста́ром Арба́те.", "Вот друзья́, кото́рых мы встре́тили на Ста́ром Арба́те."]
        rubric: ["[друзья́]{.ru} 是动物名词，复数第四格同第二格 [кото́рых]{.ru}", "[на Арба́те]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Где гуля́ли Ван Лэй, А́нна и Ди́ма? Что они́ уви́дели на Арба́те? Что подари́ли Ван Лэ́ю друзья́? Кого́ они́ встре́тили? Куда́ пригласи́ла Ка́тя Ван Лэ́я?]{.ru}"
        length: 60–90
        model: "Пятна́дцатого ма́я Ван Лэй, А́нна и Ди́ма гуля́ли по Ста́рому Арба́ту. Они́ уви́дели дом, в кото́ром жил Пу́шкин, и па́мятник Пу́шкину и его́ жене́. На углу́ сиде́л худо́жник, кото́рый рисова́л портре́ты. А́нна и Ди́ма подари́ли Ван Лэ́ю портре́т, потому́ что в сре́ду у него́ был день рожде́ния. Пото́м они́ ходи́ли к стене́ Цо́я. Там они́ встре́тили Ка́тю и её жениха́ Илью́. Ка́тя пригласи́ла Ван Лэ́я на сва́дьбу, кото́рая бу́дет два́дцать второ́го ма́я."
        rubric: ["回答全部五个问题", "至少用两次不同格的 [кото́рый]{.ru}", "日期 [два́дцать второ́го ма́я]{.ru}"]
        notes: 范文约 80 词，按问题顺序写，每个问题一两句。三处 [кото́рый]{.ru} 分别是第六格、第一格和第一格，把课文里较长的说明压进从句，句子就紧凑了。

  - id: e6
    type: open
    task: 作文：写一写你的城市里你最喜欢的一条街。
    items:
      - prompt: 写清楚：这条街在哪里、街上有什么（房子、商店、咖啡馆、纪念像）、你常和谁去、在那里做什么、为什么喜欢它。至少用四个不同格的 [кото́рый]{.ru}。
        length: 100–150
        model: "Я живу́ в Пеки́не. Моя́ люби́мая у́лица нахо́дится в це́нтре го́рода, недалеко́ от пло́щади, кото́рую зна́ют все тури́сты. Э́то пешехо́дная у́лица, на кото́рой всегда́ мно́го люде́й. Там есть больши́е магази́ны, кафе́ и ста́рый кни́жный магази́н, в кото́ром я покупа́л пе́рвые уче́бники ру́сского языка́. Ещё там есть ста́рая це́рковь, о кото́рой мне расска́зывал па́па. Я ча́сто гуля́ю там с дру́гом, с кото́рым мы вме́сте учи́лись в шко́ле. Мы хо́дим по магази́нам, пьём чай и смо́трим на тури́стов, кото́рые де́лают фо́то на ка́ждом углу́. Ве́чером на у́лице горя́т фонари́, и тогда́ она́ ещё краси́вее. Я люблю́ э́ту у́лицу, потому́ что там мне всегда́ ве́село."
        rubric: ["说明街道的位置、街上的事物、和谁去、做什么、为什么喜欢", "至少四个不同格的 [кото́рый]{.ru}，性数格正确", "带前置词的 [кото́рый]{.ru} 前置词位置正确", "100–150 词"]
        notes: 范文约 120 词，按“位置—街上有什么—和谁去做什么—为什么喜欢”的顺序展开。[кото́рый]{.ru} 用了第四格（[кото́рую зна́ют]{.ru}）、第六格（[на кото́рой]{.ru}、[в кото́ром]{.ru}、[о кото́рой]{.ru}）、第五格（[с кото́рым]{.ru}）和第一格（[кото́рые де́лают]{.ru}）。结尾一句点明喜欢的理由，呼应开头。

  - id: e7
    type: open
    task: 书信写作：以王磊的身份给北京的父母写一封短信，讲讲 5 月 15 日在阿尔巴特街的一天。
    items:
      - prompt: 写上称呼、日期和落款；讲到普希金故居、画像和卡佳的婚礼邀请；用上至少三个 [кото́рый]{.ru}。
        length: 80–120
        model: "Москва́, 15 ма́я\n\nДороги́е ма́ма и па́па!\n\nСпаси́бо, что вы позвони́ли мне в день рожде́ния! Сего́дня я гуля́л с А́нной и Ди́мой по Ста́рому Арба́ту. Мы ви́дели дом, в кото́ром жил Пу́шкин, и па́мятник Пу́шкину и его́ жене́. Пото́м друзья́ сде́лали мне пода́рок: худо́жник, кото́рый сиди́т на углу́, нарисова́л мой портре́т. Я привезу́ его́ домо́й, и вы уви́дите, как я вы́гляжу в Москве́! А ещё мы встре́тили Ка́тю, подру́гу А́нны, о кото́рой я вам писа́л. Ско́ро у неё сва́дьба, и она́ пригласи́ла меня́! \nЦелу́ю вас.\nВаш сын Ван Лэй"
        rubric: ["书信格式：地点日期、称呼 [Дороги́е…!]{.ru}、落款 [Ваш сын]{.ru}", "讲到普希金故居、画像、婚礼邀请", "至少三个 [кото́рый]{.ru}，形式正确", "80–120 词"]
        notes: 范文约 100 词。开头先感谢父母在生日那天打来电话，再按时间顺序讲一天的经过，最后用一句感受收尾。给父母写信用 [Дороги́е ма́ма и па́па!]{.ru} 开头、[Целу́ю вас.]{.ru} 结尾，这是第一册第 95 课学过的格式。
