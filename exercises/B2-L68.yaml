lesson: B2-L68
grammar: "构词初识：后缀 [-тель]{.ru}（做某事的人）、[-ник]{.ru}（具有某种特点的人）、[-ница]{.ru}（阴性）；前缀 [не-]{.ru}（意思相反）；[не-]{.ru} 连写与 [не]{.ru} 分写。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词构成表示人的名词，填空。
    why: "第 1、2、3、7 题由动词构成：去掉 [-ть]{.ru}，加 [-тель]{.ru}，重音和不定式相同：[писа́ть → писа́тель]{.ru}，[покупа́ть → покупа́тель]{.ru}，[слу́шать → слу́шатель]{.ru}，[води́ть → води́тель]{.ru}。第 4 题 [-тель]{.ru} 名词的阴性直接加 [-ница]{.ru}：[учи́тельница]{.ru}。第 5、6 题 [-ник]{.ru} 名词的阴性把 [-ник]{.ru} 换成 [-ница]{.ru}：[шко́льница, отли́чница]{.ru}。"
    items:
      - stem: "Тот, кто пи́шет кни́ги, — ___."
        hint: писа́ть
        accept: ["писа́тель"]
      - stem: "Тот, кто покупа́ет в магази́не, — ___."
        hint: покупа́ть
        accept: ["покупа́тель"]
      - stem: "Тот, кто слу́шает конце́рт и́ли ле́кцию, — ___."
        hint: слу́шать
        accept: ["слу́шатель"]
      - stem: "Же́нщина, кото́рая у́чит дете́й в шко́ле, — ___."
        hint: учи́тель
        accept: ["учи́тельница"]
      - stem: "Де́вочка, кото́рая у́чится в шко́ле, — ___."
        hint: шко́льник
        accept: ["шко́льница"]
      - stem: "Студе́нтка, у кото́рой все пятёрки, — ___."
        hint: отли́чник
        accept: ["отли́чница"]
      - stem: "Тот, кто во́дит маши́ну, — ___."
        hint: води́ть
        accept: ["води́тель"]

  - id: e2
    type: choice
    task: 选择连写或分写。
    why: "前缀 [не-]{.ru} 和后面的词连写，构成表示一种性质的新词（第 1、3、4、5 题）。第 2 题有 [а]{.ru} 引出的对比（不是贵，而是便宜），[не]{.ru} 是否定语气词，分写。第 4 题 [непра́вда]{.ru} 是一个名词“假话”，连写。"
    items:
      - stem: "По-мо́ему, э́та по́весть ___."
        options: [неинтере́сная, не интере́сная]
        answer: неинтере́сная
      - stem: "Кни́ги здесь ___, а дешёвые."
        options: [не дороги́е, недороги́е]
        answer: не дороги́е
      - stem: "Вокру́г бы́ли одни́ ___ лю́ди."
        options: [незнако́мые, не знако́мые]
        answer: незнако́мые
      - stem: "Э́то ___! Я никогда́ так не говори́л."
        options: [непра́вда, не пра́вда]
        answer: непра́вда
      - stem: "Э́то ___ фильм, но кни́га лу́чше."
        options: [неплохо́й, не плохо́й]
        answer: неплохо́й

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题女作家用 [писа́тельница]{.ru}。第 2 题“是优等生”用在 [была́]{.ru} 后面，名词通常用第五格 [отли́чницей]{.ru}；安娜是女性，用阴性。第 3 题“不好意思”是无人称句，人用第三格：[мне нело́вко]{.ru}。第 4 题“不贵”用连写的 [недороги́е]{.ru}。"
    items:
      - zh: 她是一位很有名的女作家。
        accept: ["Она́ о́чень изве́стная писа́тельница."]
        rubric: ["[писа́тельница]{.ru}", "形容词 [изве́стная]{.ru} 用阴性"]
      - zh: 安娜上中学时是优等生。
        accept: ["А́нна в шко́ле была́ отли́чницей.", "В шко́ле А́нна была́ отли́чницей.", "А́нна была́ отли́чницей в шко́ле.", "А́нна в шко́ле была́ отли́чница.", "В шко́ле А́нна была́ отли́чница."]
        rubric: ["阴性 [отли́чница]{.ru}", "[была́]{.ru} 后面最好用第五格 [отли́чницей]{.ru}"]
      - zh: 我有点不好意思问。
        accept: ["Мне бы́ло нело́вко спроси́ть.", "Мне бы́ло немно́го нело́вко спроси́ть.", "Мне бы́ло нело́вко спра́шивать.", "Мне бы́ло немно́го нело́вко спра́шивать.", "Мне нело́вко спроси́ть.", "Мне немно́го нело́вко спроси́ть.", "Мне нело́вко спра́шивать.", "Мне немно́го нело́вко спра́шивать."]
        rubric: ["无人称句：[мне]{.ru} + [нело́вко]{.ru}", "后接不定式 [спроси́ть]{.ru} 或 [спра́шивать]{.ru}"]
      - zh: 这些书不贵。
        accept: ["Э́ти кни́ги недороги́е."]
        rubric: ["[недороги́е]{.ru} 连写", "复数形容词与 [кни́ги]{.ru} 一致"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Куда́ пошли́ А́нна и Ван Лэй в пя́тницу? Каки́е кни́ги пи́шет Ве́ра Ко́лосова? Кем она́ была́ ра́ньше? О чём спроси́л её ма́льчик и что она́ отве́тила? Почему́ Ван Лэ́ю бы́ло нело́вко и что он спроси́л? Что он купи́л?]{.ru}"
        length: 70–100
        model: "В пя́тницу А́нна и Ван Лэй пошли́ в кни́жный магази́н на встре́чу с писа́тельницей Ве́рой Ко́лосовой. Она́ пи́шет весёлые по́вести о шко́льниках. Говори́ла она́ ти́хим, неторопли́вым го́лосом. Ра́ньше она́ была́ учи́тельницей, и её пе́рвыми слу́шателями бы́ли её ученики́. Оди́н ма́льчик спроси́л, пра́вда ли, что геро́й её но́вой по́вести — её сын. Она́ отве́тила, что э́то непра́вда. Ван Лэ́ю бы́ло нело́вко, потому́ что вокру́г бы́ли незнако́мые лю́ди, но благодаря́ А́нне он спроси́л, мо́жно ли иностра́нцам чита́ть её кни́ги. Писа́тельница подписа́ла ему́ кни́гу, и он купи́л ещё одну́ для па́пы."
        rubric: ["回答全部六个问题", "用上本课的构词词：[писа́тельница, учи́тельница, слу́шатели, незнако́мые, непра́вда]{.ru} 等", "对话改成间接引语"]
        notes: 范文约 85 词。直接引语都改成了转述：男孩的问题用 [спроси́л, пра́вда ли, что…]{.ru}，王磊的问题用 [спроси́л, мо́жно ли…]{.ru}。[её пе́рвыми слу́шателями бы́ли её ученики́]{.ru}：过去时里表示身份的名词用第五格。

  - id: e5
    type: open
    task: 作文：我喜欢的一位作家。
    items:
      - prompt: 介绍一位你喜欢的作家（中国或外国的都可以）：他（她）是谁，写什么样的书，你第一次读他的书是什么时候，为什么喜欢。至少用五个本课学的构词词（[-тель, -ник, -ница]{.ru} 或 [не-]{.ru}）。
        length: 100–150
        model: "Мой люби́мый писа́тель — Че́хов. Он писа́л коро́ткие расска́зы и пье́сы. Пе́рвый раз я прочита́л его́ расска́зы в шко́ле. Тогда́ я был ещё шко́льником и ду́мал, что э́то неинтере́сно: там всё о́чень про́сто. Но на́ша учи́тельница сказа́ла, что Че́хова на́до чита́ть ме́дленно.\nТепе́рь я чита́ю его́ по-ру́сски. Его́ язы́к просто́й и поня́тный, но ка́ждый расска́з о́чень глубо́кий. Геро́и Че́хова — обы́чные лю́ди: учителя́, врачи́, студе́нты, чино́вники. Они́ живу́т ску́чной жи́знью, но мечта́ют о друго́й жи́зни. Чита́тель снача́ла смеётся, а пото́м ду́мает о свое́й жи́зни.\nЧе́хов был врачо́м и хорошо́ знал жизнь просты́х люде́й. Я ду́маю, что его́ расска́зы нужны́ и сего́дня, и у него́ мно́го чита́телей во всём ми́ре."
        rubric: ["介绍作家和他的作品", "说明自己为什么喜欢，有个人经历", "至少五个构词词，构成和用法正确", "100–150 词"]
        notes: 范文用了 [писа́тель, шко́льник, неинтере́сно, учи́тельница, чита́тель]{.ru} 等构词词。结构是：作家是谁、写什么；第一次读的印象；现在的看法；结论。表示身份时注意第五格：[был шко́льником]{.ru}，[был врачо́м]{.ru}。

  - id: e6
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。7 月 9 日晚上给北京的爸爸写一封信：讲讲和女作家的见面会，告诉他你也给他买了一本她的书，说说你为什么觉得他会喜欢。注意书信的格式。
        length: 80–120
        model: |
          Москва́, 9 ию́ля

          Дорого́й па́па!

          Здра́вствуй! Сего́дня мы с А́нной бы́ли на встре́че с писа́тельницей Ве́рой Ко́лосовой. Она́ пи́шет весёлые по́вести о шко́льниках. Ра́ньше она́ была́ учи́тельницей, как ты, и её пе́рвыми слу́шателями бы́ли её ученики́.

          В за́ле бы́ло мно́го чита́телей. Снача́ла мне бы́ло нело́вко задава́ть вопро́сы, но пото́м я спроси́л, мо́жно ли иностра́нцам чита́ть её кни́ги. Она́ отве́тила, что её язы́к просто́й и поня́тный.

          Я купи́л тебе́ её но́вую кни́гу. Ду́маю, тебе́ понра́вится: ведь ты то́же учи́тель и лю́бишь хоро́шие кни́ги. А кни́ги здесь недороги́е!

          До встре́чи!

          Твой сын
        rubric: ["地点日期、称呼、落款格式正确", "对爸爸用 [ты]{.ru}，落款 [Твой сын]{.ru}", "讲清见面会和礼物", "用上本课的构词词和至少一处间接引语"]
        notes: 范文三段：见面会、自己提问、礼物。[была́ учи́тельницей, как ты]{.ru} 把作家和爸爸联系起来，为最后说明“你会喜欢”埋下伏笔；[ведь ты то́же учи́тель]{.ru} 用 [ведь]{.ru} 说明理由。
