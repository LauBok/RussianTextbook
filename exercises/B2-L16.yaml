lesson: B2-L16
grammar: "不规则复数：[бра́тья, сту́лья, сыновья́, друзья́]{.ru}（[-ья]{.ru}），[лю́ди, де́ти]{.ru}（第五格 [-ьми́]{.ru}）；[сёстры, жёны]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数正确形式填空。
    why: "第 1 题 [нет]{.ru} + 第二格，[бра́тья]{.ru} 词尾不重读，第二格 [бра́тьев]{.ru}。第 2 题 [с]{.ru} + 第五格：[детьми́]{.ru}，不按一般规则加 [-ями]{.ru}。第 3 题 [друзья́]{.ru} 词尾重读，第二格 [друзе́й]{.ru}。第 4 题非动物名词第四格同第一格：[сту́лья]{.ru}。第 5 题 [сын]{.ru} 复数 [сыновья́]{.ru}，第六格 [сыновья́х]{.ru}。第 6 题第三格 [лю́дям]{.ru}。第 7 题第五格 [людьми́]{.ru}。第 8 题动物名词第四格同第二格：[жён]{.ru}，复数重音前移，[е]{.ru} 变成 [ё]{.ru}。"
    items:
      - stem: У Ива́на Серге́евича никогда́ не́ было ___.
        hint: брат
        accept: ["бра́тьев"]
      - stem: Бра́тья бы́ли с жёнами и ___.
        hint: ребёнок
        accept: ["детьми́"]
      - stem: У меня́ в Москве́ мно́го ___.
        hint: друг
        accept: ["друзе́й"]
      - stem: Ван Лэй и Ми́ша взя́ли у сосе́дей ___.
        hint: стул
        accept: ["сту́лья"]
      - stem: Дя́дя Пе́тя ча́сто расска́зывает о свои́х ___.
        hint: сын
        accept: ["сыновья́х"]
      - stem: Ма́ма всегда́ помога́ет ___.
        hint: челове́к
        accept: ["лю́дям"]
      - stem: Мари́я Никола́евна лю́бит рабо́тать с ___.
        hint: челове́к
        accept: ["людьми́"]
      - stem: Дя́дя Пе́тя и дя́дя Ю́ра о́чень лю́бят свои́х ___.
        hint: жена́
        accept: ["жён"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [с]{.ru} + 第五格：[с друзья́ми]{.ru}。第 2 题第二格 [бра́тьев]{.ru}：词尾不重读用 [-ьев]{.ru}；[бра́тей]{.ru} 不存在。第 3 题 [о]{.ru} + 第六格：[о де́тях]{.ru}。第 4 题 [мно́го]{.ru} + 第二格：[сту́льев]{.ru}。第 5 题 [звони́ть]{.ru} 给谁用第三格：[друзья́м]{.ru}。"
    items:
      - stem: За́втра мы бу́дем пра́здновать с ___.
        options: [друзья́ми, друзья́м, друзе́й]
        answer: друзья́ми
      - stem: У отца́ ба́бушки бы́ло шесть ___.
        options: [бра́тьев, бра́тей, бра́тья]
        answer: бра́тьев
      - stem: Ба́бушка лю́бит говори́ть о ___.
        options: [де́тях, детя́х, детьми́]
        answer: де́тях
      - stem: В гости́ной бы́ло мно́го ___.
        options: [сту́льев, сту́лей, сту́лья]
        answer: сту́льев
      - stem: Ива́н Серге́евич позвони́л ___.
        options: [друзья́м, друзья́ми, друзе́й]
        answer: друзья́м

  - id: e3
    type: rewrite
    task: 把句中的名词变成复数。
    example:
      cue: Я ча́сто звоню́ бра́ту.
      answer: Я ча́сто звоню́ бра́тьям.
    why: "先写出复数第一格，再按格变：[друг → друзья́ → с друзья́ми]{.ru}，[ребёнок → де́ти → дете́й]{.ru}，[челове́к → лю́ди → о лю́дях]{.ru}，[сын → сыновья́ → сыновья́м]{.ru}。第 2 题 [дете́й]{.ru} 是动物名词复数第四格，同第二格。"
    items:
      - cue: Ми́ша игра́л в футбо́л с дру́гом.
        accept: ["Ми́ша игра́л в футбо́л с друзья́ми."]
      - cue: Ве́ра ждёт ребёнка из шко́лы.
        accept: ["Ве́ра ждёт дете́й из шко́лы."]
      - cue: Ди́ма расска́зывал об интере́сном челове́ке.
        accept: ["Ди́ма расска́зывал об интере́сных лю́дях."]
      - cue: Оте́ц купи́л пода́рок сы́ну.
        accept: ["Оте́ц купи́л пода́рок сыновья́м.", "Оте́ц купи́л пода́рки сыновья́м."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“既没有……也没有……”用 [нет ни…, ни…]{.ru}，两个名词都用第二格。第 2 题“带着妻子和孩子”用 [с]{.ru} + 第五格 [жёнами и детьми́]{.ru}。第 3 题“儿子们”是 [сыновья́]{.ru}，[похо́жи на]{.ru} + 第四格。第 4 题“椅子不够”用无人称句 [не хвата́ло]{.ru} + 第二格 [сту́льев]{.ru}。"
    items:
      - zh: 我既没有兄弟，也没有姐妹。
        accept: ["У меня́ нет ни бра́тьев, ни сестёр."]
        rubric: ["[нет ни…, ни…]{.ru}", "[бра́тьев]{.ru}、[сестёр]{.ru}：复数第二格"]
      - zh: 舅舅们是带着妻子和孩子一起来的。
        accept: ["Дя́ди бы́ли с жёнами и детьми́."]
        rubric: ["[с жёнами и детьми́]{.ru}：复数第五格", "[детьми́]{.ru} 的词尾是 [-ьми́]{.ru}"]
      - zh: 彼佳舅舅的儿子们长得很像父亲。
        accept: ["Сыновья́ дя́ди Пе́ти о́чень похо́жи на отца́."]
        rubric: ["[сыновья́]{.ru}：不规则复数", "[похо́жи на отца́]{.ru}：短尾形容词复数，[на]{.ru} + 第四格"]
      - zh: 椅子总是不够。
        accept: ["Сту́льев всегда́ не хвата́ло.", "Сту́льев никогда́ не хвата́ло.", "Всегда́ не хвата́ло сту́льев."]
        rubric: ["无人称句 [не хвата́ло]{.ru}，中性过去时", "[сту́льев]{.ru}：复数第二格"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Почему́ у Петро́вых собрала́сь вся семья́? Кто был за столо́м? Что сказа́л дя́дя Пе́тя в пе́рвом то́сте? Что отве́тил Ива́н Серге́евич? Что подари́л ему́ Ван Лэй?]{.ru}"
        length: 50–80
        model: "Ива́ну Серге́евичу испо́лнилось пятьдеся́т лет, и у Петро́вых собрала́сь вся семья́. За столо́м сиде́ли ба́бушка, бра́тья Мари́и Никола́евны с жёнами и детьми́, Петро́вы и Ван Лэй. Дя́дя Пе́тя сказа́л, что Ива́н Серге́евич для них не про́сто муж сестры́, а тре́тий брат. Ива́н Серге́евич отве́тил, что у него́ никогда́ не́ было бра́тьев, а тепе́рь их дво́е. Ван Лэй подари́л ему́ кни́гу о кита́йских ша́хматах."
        rubric: ["回答全部五个问题", "不规则复数至少三处：[бра́тья]{.ru}、[детьми́]{.ru}、[бра́тьев]{.ru} 等", "直接引语改成 [сказа́л, что…]{.ru}，人称相应改变"]
        notes: 范文约 65 词。舅舅和伊万的话都改成 [сказа́л, что…]{.ru}、[отве́тил, что…]{.ru}：[для нас]{.ru} 变成 [для них]{.ru}，[у меня́]{.ru} 变成 [у него́]{.ru}。不规则复数集中在第二句和第四句。
