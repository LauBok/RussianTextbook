lesson: B2-L11
grammar: "名词复数第三格：[-ам]{.ru}（硬变化）与 [-ям]{.ru}（软变化）；[по]{.ru} + 复数第三格。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的复数第三格填空。
    why: "硬变化加 [-ам]{.ru}，软变化加 [-ям]{.ru}，三个性都一样。第 2 题 [сестра́]{.ru} 复数是 [сёстры]{.ru}，第三格 [сёстрам]{.ru}，重音在词干。第 4 题 [колле́га]{.ru} 虽然可以指男性，变格却和 [-а]{.ru} 结尾的阴性名词一样。第 5 题 [-ь]{.ru} 结尾，加 [-ям]{.ru}。第 6 题 [сосе́д]{.ru} 复数按软变化：[сосе́ди → сосе́дям]{.ru}。第 7 题 [по]{.ru} 加复数第三格表示在许多地方走动。第 8 题 [го́род]{.ru} 复数重音在词尾：[города́м]{.ru}。"
    items:
      - stem: Восьмо́го ма́рта мужчи́ны да́рят цветы́ ___.
        hint: ма́ма
        accept: ["ма́мам"]
      - stem: Мой друг ча́сто звони́т ___.
        hint: сестра́
        accept: ["сёстрам"]
      - stem: Ван Лэй позвони́л ___ из гру́ппы.
        hint: студе́нтка
        accept: ["студе́нткам"]
      - stem: Па́па купи́л пода́рки ___.
        hint: колле́га
        accept: ["колле́гам"]
      - stem: Студе́нты пи́шут ___ на «вы».
        hint: преподава́тель
        accept: ["преподава́телям"]
      - stem: Ма́ма дала́ ___ блины́.
        hint: сосе́д
        accept: ["сосе́дям"]
      - stem: В воскресе́нье мы ходи́ли по ___.
        hint: музе́й
        accept: ["музе́ям"]
      - stem: Э́тот челове́к мно́го е́здит по ___ Росси́и.
        hint: го́род
        accept: ["города́м"]

  - id: e2
    type: rewrite
    task: 把第三格的名词变成复数。
    example:
      cue: Ван Лэй написа́л сообще́ние подру́ге.
      answer: Ван Лэй написа́л сообще́ния подру́гам.
    why: "第三格单数 [-у / -ю, -е]{.ru} 换成复数 [-ам / -ям]{.ru}。第 1 题 [сосе́дка]{.ru} 复数 [сосе́дки]{.ru}，第三格 [сосе́дкам]{.ru}，不要和阳性 [сосе́дям]{.ru} 混淆。第 3 题 [ба́бушка]{.ru} 的单数第三格是 [ба́бушке]{.ru}，复数是 [ба́бушкам]{.ru}。第 4 题 [де́вочка]{.ru} 复数 [де́вочки]{.ru}，第三格 [де́вочкам]{.ru}。"
    items:
      - cue: Ми́ша подари́л откры́тку сосе́дке.
        accept: ["Ми́ша подари́л откры́тку сосе́дкам.", "Ми́ша подари́л откры́тки сосе́дкам."]
      - cue: Мы позвони́ли студе́нту.
        accept: ["Мы позвони́ли студе́нтам."]
      - cue: Ма́ма купи́ла пода́рок ба́бушке.
        accept: ["Ма́ма купи́ла пода́рок ба́бушкам.", "Ма́ма купи́ла пода́рки ба́бушкам."]
      - cue: Он подари́л шокола́д де́вочке.
        accept: ["Он подари́л шокола́д де́вочкам."]
      - cue: А́нна помога́ет сосе́ду.
        accept: ["А́нна помога́ет сосе́дям."]

  - id: e3
    type: choice
    task: 选择正确的形式。
    why: "[дари́ть, писа́ть, звони́ть]{.ru} 的对象用第三格（第 1、3 题）。第 2 题 [на экза́менах]{.ru} 是 [на]{.ru} 加复数第六格。第 4 题 [по]{.ru} 表示“在各处走动”，用第三格 [по у́лицам]{.ru}。第 5 题“和……一起”用 [с]{.ru} 加第五格 [с преподава́телем]{.ru}，别和复数第三格 [преподава́телям]{.ru} 混淆。"
    items:
      - stem: Восьмо́го ма́рта мы да́рим цветы́ ___.
        options: [же́нщинах, же́нщинам, же́нщин]
        answer: же́нщинам
      - stem: Жела́ю тебе́ успе́хов на ___!
        options: [экза́менам, экза́менах, экза́менов]
        answer: экза́менах
      - stem: Ван Лэй написа́л сообще́ния ___ из гру́ппы.
        options: [де́вушкам, де́вушках, де́вушек]
        answer: де́вушкам
      - stem: Ве́чером мы до́лго ходи́ли по ___.
        options: [у́лицах, у́лицам, у́лиц]
        answer: у́лицам
      - stem: Ван Лэй говори́л с ___ о кни́ге.
        options: [преподава́телям, преподава́телем, преподава́телях]
        answer: преподава́телем

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“给……送花”用 [дари́ть]{.ru} + 第三格 + 第四格。第 2 题“逛商店”是固定说法 [ходи́ть по магази́нам]{.ru}。第 3 题给老师用 [на «вы»]{.ru}。第 4 题 [жела́ть]{.ru} 后祝愿的内容用第二格 [успе́хов]{.ru}。"
    items:
      - zh: 三八节男人们给妈妈和奶奶送花。
        accept: ["Восьмо́го ма́рта мужчи́ны да́рят цветы́ ма́мам и ба́бушкам.", "На Восьмо́е ма́рта мужчи́ны да́рят цветы́ ма́мам и ба́бушкам.", "Восьмо́го ма́рта мужчи́ны да́рят ма́мам и ба́бушкам цветы́.", "На Восьмо́е ма́рта мужчи́ны да́рят ма́мам и ба́бушкам цветы́."]
        rubric: ["[ма́мам]{.ru}、[ба́бушкам]{.ru}：复数第三格", "[да́рят]{.ru}：现在时表示每年的习惯", "“三八节”用 [Восьмо́го ма́рта]{.ru} 或 [на Восьмо́е ма́рта]{.ru}"]
      - zh: 星期天我逛了很久商店。
        accept: ["В воскресе́нье я до́лго ходи́л по магази́нам.", "В воскресе́нье я до́лго ходи́ла по магази́нам.", "Я до́лго ходи́л по магази́нам в воскресе́нье.", "Я до́лго ходи́ла по магази́нам в воскресе́нье.", "Я в воскресе́нье до́лго ходи́л по магази́нам.", "Я в воскресе́нье до́лго ходи́ла по магази́нам."]
        rubric: ["[ходи́ть по магази́нам]{.ru}，[по]{.ru} + 复数第三格", "过去时 [ходи́л / ходи́ла]{.ru}"]
      - zh: 给老师们写信要用“您”。
        accept: ["Преподава́телям на́до писа́ть на «вы».", "Преподава́телям пи́шут на «вы».", "Учителя́м на́до писа́ть на «вы».", "Учителя́м пи́шут на «вы».", "Преподава́телям ну́жно писа́ть на «вы».", "Учителя́м ну́жно писа́ть на «вы»."]
        rubric: ["[преподава́телям]{.ru} 或 [учителя́м]{.ru}：复数第三格", "[на «вы»]{.ru}"]
      - zh: 我祝同学们考试顺利。
        accept: ["Я жела́ю студе́нтам успе́хов на экза́менах.", "Жела́ю студе́нтам успе́хов на экза́менах.", "Я жела́ю ребя́там успе́хов на экза́менах.", "Жела́ю ребя́там успе́хов на экза́менах.", "Я жела́ю одногру́ппникам успе́хов на экза́менах.", "Жела́ю одногру́ппникам успе́хов на экза́менах."]
        rubric: ["[жела́ть]{.ru} + 第三格（人）+ 第二格（祝愿的内容）", "[на экза́менах]{.ru}：复数第六格"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Како́й пра́здник был восьмо́го ма́рта? Что сказа́л Ди́ма Ван Лэ́ю? Что Ван Лэй подари́л Мари́и Никола́евне и А́нне? Кому́ он написа́л сообще́ния? Как на́до писа́ть преподава́телям и подру́гам?]{.ru}"
        length: 50–80
        model: "Восьмо́го ма́рта был Междунаро́дный же́нский день. Ди́ма сказа́л Ван Лэ́ю, что в э́тот день мужчи́ны да́рят цветы́ ма́мам, ба́бушкам и сёстрам, а подру́гам и колле́гам пи́шут поздравле́ния. Ван Лэй подари́л Мари́и Никола́евне и А́нне тюльпа́ны. Пото́м он написа́л сообще́ния ма́ме и ба́бушке в Пеки́н, О́льге Ви́кторовне и всем де́вушкам из гру́ппы. Преподава́телям на́до писа́ть на «вы», а подру́гам мо́жно на «ты»."
        rubric: ["回答全部五个问题", "至少用三个复数第三格：[ма́мам]{.ru}、[подру́гам]{.ru}、[преподава́телям]{.ru} 等", "迪马的话可以用 [сказа́л, что…]{.ru} 转述"]
        notes: 范文约 70 词。迪马的话用 [сказа́л, что…]{.ru} 转成间接说法，省去了引号；“给谁写”这一句把收信人排成一串，都用第三格；最后一句用 [а]{.ru} 对比老师和朋友两种写法。
