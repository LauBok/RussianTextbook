lesson: B2-L43
grammar: "前缀 [об-]{.ru}（绕过、走遍）、[с-]{.ru}（下来）、[раз- … -ся]{.ru}（散开）；带前缀运动动词的体：前缀 + 不定向动词 = 未完成体，前缀 + 定向动词 = 完成体；完成体 [сходи́ть]{.ru}、[съе́здить]{.ru}“去一趟”。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的前缀动词。
    why: "第 1 题从火车上下来，用 [с-]{.ru}：[сошли́ с]{.ru}。第 2 题汽车绕着门开，第 3 题绕过水洼，用 [об-]{.ru}。第 4 题两人朝不同方向走开，第 5 题大家各自回家，用 [раз- … -ся]{.ru}。第 6 题去了一趟又回来，用完成体 [съе́здили]{.ru}。"
    items:
      - stem: Ра́но у́тром друзья́ ___ с по́езда.
        options: [сошли́, обошли́, разошли́сь]
        answer: сошли́
      - stem: Маши́ны ___ Золоты́е воро́та.
        options: [объезжа́ют, разъезжа́ются, схо́дят]
        answer: объезжа́ют
      - stem: Лу́чше ___ лу́жу!
        options: [сойди́, обойди́, разойди́сь]
        answer: обойди́
      - stem: "В Су́здале друзья́ ___: Ди́ма пошёл смотре́ть дома́, а Ван Лэй — в Кремль."
        options: [сошли́, обошли́, разошли́сь]
        answer: разошли́сь
      - stem: По́сле пра́здника все го́сти ___ по дома́м.
        options: [объе́хали, разъе́хались, съе́здили]
        answer: разъе́хались
      - stem: Вчера́ мы ___ в Су́здаль и ве́чером верну́лись в Москву́.
        options: [съе́здили, разъе́хались, объе́хали]
        answer: съе́здили

  - id: e2
    type: rewrite
    task: 按例句把不定向动词的过去时改成完成体 [сходи́ть]{.ru} 或 [съе́здить]{.ru} 的将来时（表示打算去一趟）。
    example:
      cue: Вчера́ я ходи́л в магази́н.
      answer: За́втра я схожу́ в магази́н.
    why: "[ходи́л]{.ru}、[е́здил]{.ru} 说的是过去去过一趟。说将来去一趟又回来，要用完成体 [сходи́ть]{.ru}、[съе́здить]{.ru} 的将来时：[схожу́, схо́дишь…]{.ru}，[съе́зжу, съе́здишь…]{.ru}。不能说 *[бу́ду ходи́ть в магази́н]{.ru}* 表示“明天去一趟”，那是“经常去”的意思。"
    items:
      - cue: Вчера́ мы е́здили в Су́здаль.
        accept: ["За́втра мы съе́здим в Су́здаль."]
      - cue: Вчера́ А́нна ходи́ла в библиоте́ку.
        accept: ["За́втра А́нна схо́дит в библиоте́ку."]
      - cue: Вчера́ ты е́здил на да́чу.
        accept: ["За́втра ты съе́здишь на да́чу."]
      - cue: Вчера́ я ходи́л к врачу́.
        accept: ["За́втра я схожу́ к врачу́."]

  - id: e3
    type: choice
    task: 选择未完成体或完成体。
    why: "第 1 题“经常”用未完成体 [объезжа́ют]{.ru}。第 2 题一次的结果用完成体 [обошёл]{.ru}。第 3 题迪马早上来过，现在已经不在了（所以晚上才打电话），来去已经抵消，用未完成体过去时 [приходи́л]{.ru}；第 4 题“来了，还在这儿”用完成体 [пришёл]{.ru}。第 5 题 [обы́чно]{.ru} 表示经常，用未完成体 [схо́дят]{.ru}。第 6 题“明天去一趟”用完成体 [съе́зжу]{.ru}。"
    items:
      - stem: Маши́ны всегда́ ___ э́ти воро́та.
        options: [объезжа́ют, объе́дут]
        answer: объезжа́ют
      - stem: Ван Лэй ___ весь Кремль за два часа́.
        options: [обходи́л, обошёл]
        answer: обошёл
      - stem: У́тром к тебе́ ___ Ди́ма. Он сказа́л, что позвони́т ве́чером.
        options: [приходи́л, пришёл]
        answer: приходи́л
      - stem: — Кто там? — Э́то Ди́ма ___! Он ждёт тебя́ на ку́хне.
        options: [приходи́л, пришёл]
        answer: пришёл
      - stem: Обы́чно здесь все ___ с авто́буса.
        options: [схо́дят, сойду́т]
        answer: схо́дят
      - stem: За́втра я ___ к ба́бушке на да́чу.
        options: [е́зжу, съе́зжу]
        answer: съе́зжу

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“下车”用 [сойти́ с]{.ru} 或 [вы́йти из]{.ru}。第 2 题“绕一圈”用 [обойти́]{.ru} + 第四格。第 3 题“去一趟”将来用 [схожу́]{.ru}。第 4 题“各自回家”用 [разъе́хаться / разойти́сь по дома́м]{.ru}。"
    items:
      - zh: 我们在弗拉基米尔下了火车。
        accept: ["Мы сошли́ с по́езда во Влади́мире.", "Во Влади́мире мы сошли́ с по́езда.", "Мы вы́шли из по́езда во Влади́мире.", "Во Влади́мире мы вы́шли из по́езда."]
        rubric: ["“下车”用 [сошли́ с по́езда]{.ru} 或 [вы́шли из по́езда]{.ru}", "[во Влади́мире]{.ru} 第六格，前置词写作 [во]{.ru}"]
      - zh: 两个朋友绕着金门走了一圈。
        accept: ["Друзья́ обошли́ Золоты́е воро́та круго́м.", "Друзья́ обошли́ круго́м Золоты́е воро́та.", "Друзья́ обошли́ вокру́г Золоты́х воро́т.", "Друзья́ обошли́ Золоты́е воро́та."]
        rubric: ["[обошли́]{.ru} + 第四格 [Золоты́е воро́та]{.ru}"]
      - zh: 我去一趟商店，马上回来。
        accept: ["Я схожу́ в магази́н и сра́зу верну́сь.", "Я схожу́ в магази́н и ско́ро верну́сь.", "Я схожу́ в магази́н, сейча́с верну́сь.", "Я схожу́ в магази́н и сейча́с верну́сь."]
        rubric: ["“去一趟”用完成体 [схожу́]{.ru}", "[в магази́н]{.ru} 第四格"]
      - zh: 晚上大家各自回家了。
        accept: ["Ве́чером все разъе́хались по дома́м.", "Ве́чером все разошли́сь по дома́м.", "Все разъе́хались по дома́м ве́чером.", "Все разошли́сь по дома́м ве́чером."]
        rubric: ["[разъе́хались / разошли́сь]{.ru}", "[по дома́м]{.ru}：[по]{.ru} + 复数第三格"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Как друзья́ уезжа́ли из Каза́ни? Что они́ ви́дели во Влади́мире? Что они́ де́лали в Су́здале? Почему́ Ди́ма сказа́л Ван Лэ́ю «Обойди́ её!»? Как зако́нчилась пое́здка?]{.ru}"
        length: 70–100
        model: "Шесто́го ма́я ве́чером друзья́ уе́хали из Каза́ни на ночно́м по́езде. Ра́но у́тром они́ сошли́ с по́езда во Влади́мире. Там они́ обошли́ Золоты́е воро́та и посмотре́ли фре́ски Рублёва в Успе́нском собо́ре. Пото́м они́ съе́здили в Су́здаль. Там друзья́ разошли́сь, а в три часа́ встре́тились на ры́нке. Ди́ма купи́л ба́нку огурцо́в для Мари́и Никола́евны. Ван Лэй хоте́л перейти́ большу́ю лу́жу, но Ди́ма сказа́л, что лу́чше её обойти́. Ве́чером они́ прие́хали в Москву́, и на вокза́ле их встреча́ла А́нна."
        rubric: ["回答全部五个问题", "[сошли́ с]{.ru}、[обошли́]{.ru}、[съе́здили]{.ru}、[разошли́сь]{.ru} 用对", "一次完成的事用完成体"]
        notes: 范文约 85 词，几乎全用完成体过去时，因为讲的是一连串依次完成的动作。转述命令式 [Обойди́ её!]{.ru} 可以写成 [сказа́л, что лу́чше её обойти́]{.ru}。

  - id: e6
    type: open
    task: 作文：《一日游》。
    items:
      - prompt: 写一次你一天之内去附近城市或郊区游玩的经历：怎么去的，到了以后去了哪些地方，和同伴有没有分头行动，晚上怎么回来的。用上 [съе́здить]{.ru}、[обойти́]{.ru}、[разойти́сь]{.ru} 等动词。
        length: 100–150
        model: "В про́шлую суббо́ту мы с друзья́ми съе́здили в Се́ргиев Поса́д. Э́то ста́рый ру́сский го́род недалеко́ от Москвы́.\n\nМы е́хали туда́ на электри́чке почти́ два часа́. Когда́ мы сошли́ с по́езда, шёл дождь, но пото́м пого́да ста́ла хоро́шая. Снача́ла мы пошли́ в Ла́вру и обошли́ её круго́м. Пото́м мы разошли́сь: мои́ друзья́ пошли́ в музе́й, а я до́лго ходи́л по ста́рым у́лицам. В два часа́ мы встре́тились в кафе́ и вме́сте обе́дали.\n\nВе́чером мы се́ли на электри́чку и пое́хали обра́тно. В Москве́ мы разъе́хались по дома́м. Мы о́чень уста́ли, но день был замеча́тельный. Ле́том я обяза́тельно съе́зжу во Влади́мир и в Су́здаль."
        rubric: ["写清怎么去、去了哪些地方、怎么回来", "至少用三个本课的前缀动词（[съе́здить, сойти́, обойти́, разойти́сь, разъе́хаться]{.ru}），前置词和格用对", "一连串完成的动作用完成体", "100–150 词，分段"]
        notes: 范文第一段用 [съе́здили]{.ru} 概括整趟行程（去了又回来）；第二段按顺序讲经过，用完成体（[сошли́, обошли́, разошли́сь, встре́тились]{.ru}），只有 [до́лго ходи́л по у́лицам]{.ru} 是没有方向地到处走，用不定向动词；第三段讲回程，结尾 [съе́зжу]{.ru} 是完成体将来时，表示打算去一趟。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊，回到莫斯科后给迪马的父母写一封感谢信：谢谢他们的款待，讲讲回程路上在弗拉基米尔和苏兹达尔看到了什么，请他们来莫斯科做客。
        length: 80–120
        model: "Дороги́е Андре́й Петро́вич и Ната́лья И́горевна!\n\nБольшо́е спаси́бо за всё! Мне о́чень понра́вилась Каза́нь, и мне бы́ло у вас как до́ма.\n\nПо доро́ге в Москву́ мы с Ди́мой съе́здили во Влади́мир и в Су́здаль. Во Влади́мире мы обошли́ Золоты́е воро́та и ви́дели фре́ски Андре́я Рублёва. В Су́здале я подня́лся на колоко́льню и обошёл весь Кремль. Там так мно́го церкве́й!\n\nТепе́рь я до́ма, в Москве́. Приезжа́йте к нам в го́сти! Я бу́ду рад показа́ть вам Москву́.\n\nПереда́йте приве́т Све́те и ба́бушке.\n\nС уваже́нием,\nВан Лэй"
        rubric: ["称呼长辈用名字和父称，正文用 [вы]{.ru}", "先感谢，再讲回程见闻，最后邀请", "[съе́здили]{.ru}、[обошли́]{.ru}、[приезжа́йте]{.ru} 用对", "有落款"]
        notes: 感谢信开头直接写 [Большо́е спаси́бо за всё!]{.ru}；[мне бы́ло у вас как до́ма]{.ru}“在你们家就像在自己家一样”是常用的客气话。邀请用未完成体命令式 [Приезжа́йте к нам в го́сти!]{.ru}。给长辈的信结尾用 [С уваже́нием]{.ru}。
