lesson: B3-L15
grammar: "变成前置词的副动词：[благодаря]{.ru}（+ 第三格）、[несмотря на]{.ru}（+ 第四格）、[судя по]{.ru}（+ 第三格）、[включая]{.ru}（+ 第四格）、[начиная с]{.ru}（+ 第二格）、[спустя]{.ru}（+ 第四格）；它们不要求与句子主语一致。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Как можно попасть на Камчатку? Какой вулкан самый высокий в Евразии и почему его высота меняется? Кто и когда открыл Долину гейзеров? Почему природа в Долине гейзеров хорошо сохранилась? Чем опасны вулканы?]{.ru}"
        length: 60–90
        model: "На Камчатку можно попасть только на самолёте или на корабле, потому что дорог, соединяющих полуостров с остальной частью страны, нет. Самый высокий действующий вулкан Евразии — Ключевская сопка. Её высота — около 4750 метров, но после извержений вершина становится то выше, то ниже. Долину гейзеров открыла в 1941 году геолог Татьяна Устинова. Природа там хорошо сохранилась благодаря тому, что попасть в долину можно только на вертолёте. Вулканы опасны тем, что во время сильных извержений пепел поднимается на высоту больше десяти километров и становится опасным для самолётов."
        rubric: ["五个问题都回答，数字、人名、年份准确", "至少用一处 [благодаря]{.ru}、[несмотря на]{.ru} 或 [судя по]{.ru}", "用完整的句子"]
        notes: "范文约 90 词。第 4 题用了 [благодаря тому, что …]{.ru}：[благодаря]{.ru} 后面接从句时要加 [тому, что]{.ru}，和 [несмотря на то что]{.ru} 的道理一样。第 5 题 [опасны тем, что …]{.ru}“危险在于……”。"

  - id: e2
    type: choice
    task: 选择合适的前置词。
    why: "第 1 题温泉多是火山带来的好结果，用 [Благодаря]{.ru}；[Из-за]{.ru} 多用于坏结果。第 2 题“尽管有风险”，后面是与预期相反的结果，用 [Несмотря на]{.ru}。第 3 题火山灰导致飞机不能飞，是坏结果，用 [Из-за]{.ru}；[пепла]{.ru} 是第二格，也只有 [из-за]{.ru} 要求第二格。第 4 题“从照片上看”，是做出判断的依据，用 [Судя по]{.ru}，后面第三格 [фотографиям]{.ru}。第 5 题是好结果（很快到达），而且 [вертолёту]{.ru} 是第三格，用 [Благодаря]{.ru}。"
    items:
      - stem: ___ вулканам на Камчатке много горячих источников.
        options: [Благодаря, Из-за, Несмотря на]
        answer: Благодаря
      - stem: ___ риск, многие жители не хотят уезжать с Камчатки.
        options: [Благодаря, Судя по, Несмотря на]
        answer: Несмотря на
      - stem: ___ пепла самолёты три дня не могли летать.
        options: [Благодаря, Из-за, Судя по]
        answer: Из-за
      - stem: ___ фотографиям, в Долине гейзеров очень красиво.
        options: [Благодаря, Судя по, Несмотря на]
        answer: Судя по
      - stem: ___ вертолёту мы за час попали в Долину гейзеров.
        options: [Из-за, Благодаря, Несмотря на]
        answer: Благодаря

  - id: e3
    type: fill
    task: 把括号里的词变成前置词要求的格。
    why: "第 1 题 [благодаря]{.ru} 要第三格：[работе]{.ru}。第 2 题 [несмотря на]{.ru} 要第四格：[плохую погоду]{.ru}，形容词和名词都变。第 3 题 [судя по]{.ru} 要第三格复数：[рассказам]{.ru}。第 4 题 [начиная с]{.ru} 要第二格：[1941 года]{.ru}，“年”的序数词和 [год]{.ru} 都用第二格。第 5 题 [спустя]{.ru} 要第四格：[несколько часов]{.ru}，[несколько]{.ru} 第四格与第一格同形，后面的名词仍用复数第二格。第 6 题 [включая]{.ru} 要第四格：[Ключевскую сопку]{.ru}。"
    items:
      - stem: Благодаря ___ учёных людей можно заранее предупредить об опасности.
        hint: работа
        accept: ["работе"]
      - stem: Несмотря на ___, мы поднялись на вулкан.
        hint: плохая погода
        accept: ["плохую погоду"]
      - stem: Судя по ___ туристов, в долине очень красиво.
        hint: рассказы
        accept: ["рассказам"]
      - stem: Начиная с ___, в Долину гейзеров стали приезжать учёные.
        hint: 1941 год
        accept: ["1941 года", "тысяча девятьсот сорок первого года"]
      - stem: Спустя ___ после извержения пепел упал на город.
        hint: несколько часов
        accept: ["несколько часов"]
      - stem: Мы видели много вулканов, включая ___.
        hint: Ключевская сопка
        accept: ["Ключевскую сопку"]

  - id: e4
    type: rewrite
    task: 用括号里的前置词改写句子，把从句变成名词短语。
    example:
      cue: Хотя погода была плохая, мы поднялись на вулкан. (несмотря на)
      answer: Несмотря на плохую погоду, мы поднялись на вулкан.
    why: "从句里的谓语形容词或动词要变成名词：第 1 题 [высокий → высота]{.ru}，[несмотря на высоту]{.ru}（第四格）。第 2 题 [потому что учёные работают → благодаря работе учёных]{.ru}，第三格。第 3 题 [если судить по тому, что рассказывают → судя по рассказам]{.ru}，第三格复数。第 4 题“雪”第四格不变：[несмотря на снег]{.ru}。也可以保留从句，用 [несмотря на то что]{.ru}，但本题要求变成名词短语。"
    items:
      - cue: Хотя вулкан высокий, на него может подняться даже неопытный турист. (несмотря на)
        accept: ["Несмотря на высоту вулкана, на него может подняться даже неопытный турист.", "Несмотря на высоту, на вулкан может подняться даже неопытный турист."]
      - cue: Людей можно предупредить об опасности, потому что учёные хорошо работают. (благодаря)
        accept: ["Благодаря хорошей работе учёных людей можно предупредить об опасности.", "Людей можно предупредить об опасности благодаря хорошей работе учёных."]
      - cue: Если верить тому, что рассказывают местные жители, вода в источниках полезна для здоровья. (судя по)
        accept: ["Судя по рассказам местных жителей, вода в источниках полезна для здоровья."]
      - cue: Хотя вокруг лежал снег, мы купались в горячем источнике. (несмотря на)
        accept: ["Несмотря на снег, мы купались в горячем источнике.", "Несмотря на снег вокруг, мы купались в горячем источнике.", "Мы купались в горячем источнике, несмотря на снег."]

  - id: e5
    type: translate
    task: 翻译下列句子。
    items:
      - zh: 多亏有火山，堪察加有很多温泉。
        accept: ["Благодаря вулканам на Камчатке много горячих источников.", "Благодаря вулканам на Камчатке есть много горячих источников."]
        rubric: ["[благодаря вулканам]{.ru}：第三格复数", "[много горячих источников]{.ru}：复数第二格"]
      - zh: 尽管有风险，很多居民不想离开堪察加。
        accept: ["Несмотря на риск, многие жители не хотят уезжать с Камчатки.", "Несмотря на риск, многие жители не хотят уезжать из Камчатки.", "Несмотря на опасность, многие жители не хотят уезжать с Камчатки."]
        rubric: ["[несмотря на риск]{.ru}：[несмотря]{.ru} 连写，[на]{.ru} 分写，第四格", "[уезжать с Камчатки]{.ru}：半岛用 [с]{.ru}"]
      - zh: 从这些数字来看，这是地球上最活跃的地区之一。
        accept: ["Судя по этим цифрам, это один из самых активных районов планеты.", "Судя по этим цифрам, это один из самых активных районов Земли.", "Судя по этим цифрам, это один из самых активных районов на планете.", "Судя по этим цифрам, это один из самых активных районов на Земле."]
        rubric: ["[судя по этим цифрам]{.ru}：第三格复数", "[один из самых активных районов]{.ru}"]

  - id: e6
    type: open
    task: 缩写与句式改写。按提纲把课文压缩成一段：至少用三个本课的前置词（[благодаря, несмотря на, судя по]{.ru} 等）；至少把课文里的一处副动词短语改成从句，再把一处从句改成副动词短语。
    items:
      - prompt: "提纲：堪察加的位置和交通；火山的数量；克柳切夫火山；城边的火山；间歇泉谷；温泉；火山的危险；熊。"
        length: 120–150
        model: "Камчатка — полуостров на северо-востоке России, куда можно попасть только на самолёте или на корабле. Несмотря на это, туристов здесь становится всё больше. На Камчатке более трёхсот вулканов, около тридцати из них — действующие. Самый высокий из них, Ключевская сопка, достигает примерно 4750 метров. Над Петропавловском-Камчатским поднимаются «домашние» вулканы, и когда турист поднимается на вершину Авачинского вулкана, он видит кратер и океан. В 1941 году геолог Татьяна Устинова, исследуя одну из рек, открыла Долину гейзеров. Благодаря тому что попасть туда можно только на вертолёте, природа долины хорошо сохранилась. Судя по рассказам местных жителей, вода горячих источников полезна для здоровья. Но извержения опасны: пепел поднимается на высоту больше десяти километров. Летом, выйдя к рекам, медведи ловят лосося, а туристы фотографируют их с безопасного расстояния."
        rubric: ["提纲八项都有，数字准确（300 多座、约 30 座、约 4750 米、1941 年）", "至少三个本课的前置词，格用对", "至少一处副动词短语改成从句、一处从句改成副动词短语", "120–150 词"]
        notes: "范文约 140 词。本课的前置词：[несмотря на это]{.ru}、[благодаря тому что]{.ru}、[судя по рассказам]{.ru}。副动词短语改成从句：[когда турист поднимается на вершину]{.ru}（课文 [поднявшись на вершину]{.ru}）。从句改成副动词短语：[выйдя к рекам]{.ru}（课文 [медведи выходят к воде ловить рыбу]{.ru}）。[исследуя одну из рек]{.ru} 保留了课文的副动词短语。"
