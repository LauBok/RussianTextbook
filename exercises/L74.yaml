lesson: L74
grammar: "[где / куда́ / отку́да]{.ru} 三组对应：[в – в – из]{.ru}，[на – на – с]{.ru}，[у – к – от]{.ru}；[здесь – сюда́ – отсю́да]{.ru}，[там – туда́ – отту́да]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的前置词。
    why: 先看这个名词平时跟 [в]{.ru} 还是 [на]{.ru}：[в библиоте́ке]{.ru}、[в шко́ле]{.ru} 用 [в]{.ru}，所以“从”用 [из]{.ru}；[на рабо́те]{.ru}、[на уро́ке]{.ru}、[на Ура́ле]{.ru} 用 [на]{.ru}，所以“从”用 [с]{.ru}。[врач]{.ru}、[ба́бушка]{.ru} 是人，“从某人那里”用 [от]{.ru}。最常见的错误是 [из рабо́ты]{.ru}、[из врача́]{.ru}。
    items:
      - stem: Я иду́ ___ библиоте́ки.
        options: [из, с, от]
        answer: из
      - stem: Па́па е́дет ___ рабо́ты.
        options: [из, с, от]
        answer: с
      - stem: Ми́ша идёт ___ врача́.
        options: [из, с, от]
        answer: от
      - stem: Она́ е́дет ___ Ура́ла.
        options: [из, с, от]
        answer: с
      - stem: Мы идём ___ шко́лы.
        options: [из, с, от]
        answer: из
      - stem: Студе́нты иду́т ___ уро́ка.
        options: [из, с, от]
        answer: с
      - stem: Я е́ду ___ ба́бушки.
        options: [из, с, от]
        answer: от

  - id: e2
    type: rewrite
    task: 按例句回答：人从刚才去过的地方回来了。
    example:
      cue: Ми́ша был в шко́ле.
      answer: Ми́ша идёт из шко́лы.
    why: "[в]{.ru} + 第六格 → [из]{.ru} + 第二格；[на]{.ru} + 第六格 → [с]{.ru} + 第二格；[у]{.ru} + 第二格（人）→ [от]{.ru} + 第二格。[у ба́бушки]{.ru} 本来就是第二格，换成 [от]{.ru} 后词形不变。本市内步行用 [идти́]{.ru}，从别的城市来用 [е́хать]{.ru}。"
    items:
      - cue: А́нна была́ в библиоте́ке.
        accept: ["А́нна идёт из библиоте́ки."]
      - cue: Па́па был на рабо́те.
        accept: ["Па́па идёт с рабо́ты.", "Па́па е́дет с рабо́ты."]
      - cue: Ма́ма была́ у врача́.
        accept: ["Ма́ма идёт от врача́.", "Ма́ма е́дет от врача́."]
      - cue: Студе́нты бы́ли в Петербу́рге.
        accept: ["Студе́нты е́дут из Петербу́рга."]
      - cue: Ван Лэй был на уро́ке.
        accept: ["Ван Лэй идёт с уро́ка."]
      - cue: Ми́ша был у ба́бушки.
        accept: ["Ми́ша е́дет от ба́бушки.", "Ми́ша идёт от ба́бушки."]
  - id: e3
    type: fill
    task: 用括号里的词填空，注意前置词和格。
    why: "[где]{.ru} 用第六格（[у]{.ru} + 第二格），[куда́]{.ru} 用第四格（[к]{.ru} + 第三格），[отку́да]{.ru} 用第二格。[дочь]{.ru} 的间接格词干是 [до́чер-]{.ru}，第二、三、六格都是 [до́чери]{.ru}。[сын]{.ru} 的第三格是 [сы́ну]{.ru}。"
    items:
      - stem: Она́ живёт ___.
        hint: в Петербу́рг
        accept: ["в Петербу́рге"]
      - stem: Я е́ду ___.
        hint: к сын
        accept: ["к сы́ну"]
      - stem: Же́нщина е́дет ___.
        hint: от дочь
        accept: ["от до́чери"]
      - stem: Вчера́ мы бы́ли ___.
        hint: у ба́бушка
        accept: ["у ба́бушки"]
      - stem: Студе́нты е́дут ___.
        hint: из Москва́
        accept: ["из Москвы́"]
      - stem: Па́па е́дет ___, ему́ на́до быть там в семь часо́в.
        hint: на вокза́л
        accept: ["на вокза́л"]
  - id: e4
    type: translate
    task: 译成俄语。
    why: 每题先判断是 [где]{.ru}、[куда́]{.ru} 还是 [отку́да]{.ru}，再判断这个地方用 [в]{.ru}、[на]{.ru} 还是指人。
    items:
      - zh: ——你从哪儿来？——从图书馆来。
        accept: ["— Отку́да ты идёшь? — Из библиоте́ки.", "— Отку́да ты идёшь? — Я иду́ из библиоте́ки.", "— Отку́да ты? — Из библиоте́ки."]
        rubric: ["问句用 [отку́да]{.ru}", "[из библиоте́ки]{.ru}，第二格"]
      - zh: 爸爸下班回家。
        accept: ["Па́па идёт с рабо́ты домо́й.", "Па́па е́дет с рабо́ты домо́й.", "Па́па идёт домо́й с рабо́ты.", "Па́па е́дет домо́й с рабо́ты."]
        rubric: ["“从单位”用 [с рабо́ты]{.ru}，不能用 [из]{.ru}", "“回家”用 [домо́й]{.ru}"]
      - zh: 我从女儿那儿到儿子那儿去。
        accept: ["Я е́ду от до́чери к сы́ну.", "Я иду́ от до́чери к сы́ну."]
        rubric: ["“从某人那儿”用 [от]{.ru} + 第二格 [до́чери]{.ru}", "“到某人那儿”用 [к]{.ru} + 第三格 [сы́ну]{.ru}"]
      - zh: 她住在乌拉尔，叶卡捷琳堡。
        accept: ["Она́ живёт на Ура́ле, в Екатеринбу́рге."]
        rubric: ["[на Ура́ле]{.ru} 用 [на]{.ru}", "[в Екатеринбу́рге]{.ru} 用 [в]{.ru}"]

  - id: e5
    type: open
    task: 情景对话：你在火车上遇见一位旅客，互相问问从哪儿来、到哪儿去、是哪里人。
    items:
      - prompt: 对话里用上 [отку́да]{.ru}、[куда́]{.ru}，以及 [из]{.ru}、[с]{.ru}、[от]{.ru}、[к]{.ru} 中的至少三个。
        length: 60–90
        model: "— Отку́да вы е́дете?\n— Из Петербу́рга, от сестры́. А вы?\n— Я то́же из Петербу́рга. Я был там на экску́рсии.\n— А куда́ вы сейча́с е́дете?\n— В Москву́, домо́й. Я живу́ и учу́сь в Москве́. А вы?\n— Я е́ду в Москву́ к бра́ту, а пото́м на Ура́л.\n— А вы отку́да?\n— Я с Ура́ла, из Екатеринбу́рга."
        rubric: ["问行程用 [Отку́да вы е́дете?]{.ru}、[Куда́ вы е́дете?]{.ru}", "地方和人的前置词选对：[из, с, от, к]{.ru}", "[из, с, от]{.ru} 后用第二格，[к]{.ru} 后用第三格", "问籍贯用 [Отку́да вы?]{.ru}"]
        notes: 范文用了三组对应的全部形式：[из Петербу́рга]{.ru}（城市，[в]{.ru} 组），[с Ура́ла]{.ru}（用 [на]{.ru} 的地名），[от сестры́]{.ru}、[к бра́ту]{.ru}（人）。[Отку́да вы е́дете?]{.ru} 问的是从哪儿来，结尾的 [А вы отку́да?]{.ru} 不带动词，问的是籍贯，两种问法要分清。
