lesson: L46
grammar: 命令式的构成（[-й]{.ru}、[-и]{.ru}、[-ь]{.ru}，复数加 [-те]{.ru}；[-ся]{.ru} 动词；[дай, ешь, пей]{.ru} 等特殊形式）；命令式里体的选择；[пожа́луйста]{.ru}。
exercises:

  - id: e1
    type: fill
    task: 写出动词的命令式（对 [вы]{.ru} 说）。
    why: 先找复数第三人称的词干：[чита́-ют]{.ru} 以元音结尾，加 [-й]{.ru}；[говор-я́т]{.ru}、[ска́ж-ут]{.ru} 以辅音结尾，第一人称重音在词尾，加 [-и]{.ru}；[откро́-ют]{.ru} 也以元音结尾，所以是 [откро́йте]{.ru}，不要按不定式写成 [откры́йте]{.ru}。[вста́н-ут]{.ru}、[отве́т-ят]{.ru} 第一人称重音在词干（[вста́ну, отве́чу]{.ru}），加 [-ь]{.ru}；[отве́тить]{.ru} 第一人称的 [т → ч]{.ru} 交替不进入命令式，是 [отве́тьте]{.ru}。最后再加 [-те]{.ru}。[дать]{.ru} 是特殊形式 [да́йте]{.ru}，不能按 [даду́т]{.ru} 推。[сади́ться]{.ru} 的 [-ся]{.ru} 在元音 [е]{.ru} 后变成 [-сь]{.ru}。
    items:
      - stem: чита́ть → ___
        accept: [чита́йте]
      - stem: говори́ть → ___
        accept: [говори́те]
      - stem: сказа́ть → ___
        accept: [скажи́те]
      - stem: встать → ___
        accept: [вста́ньте]
      - stem: дать → ___
        accept: [да́йте]
      - stem: сади́ться → ___
        accept: [сади́тесь]
      - stem: взять → ___
        accept: [возьми́те]
      - stem: отдыха́ть → ___
        accept: [отдыха́йте]
      - stem: откры́ть → ___
        accept: [откро́йте]
      - stem: отве́тить → ___
        accept: [отве́тьте]

  - id: e2
    type: rewrite
    task: 把对 [вы]{.ru} 说的命令式改成对 [ты]{.ru} 说的。
    placeholder: Ми́ша, …
    example:
      cue: Скажи́те, пожа́луйста, где по́чта?
      answer: Ми́ша, скажи́, пожа́луйста, где по́чта?
    why: 对 [ты]{.ru} 说时去掉 [-те]{.ru}。[-ся]{.ru} 动词要注意：[сади́тесь]{.ru} 去掉 [-те]{.ru} 后，[-сь]{.ru} 直接接在 [и]{.ru} 后面，成为 [сади́сь]{.ru}。[ешь]{.ru} 的复数是 [е́шьте]{.ru}。
    items:
      - cue: Сади́тесь, пожа́луйста.
        accept: ["Ми́ша, сади́сь, пожа́луйста."]
      - cue: Да́йте, пожа́луйста, хлеб.
        accept: ["Ми́ша, дай, пожа́луйста, хлеб."]
      - cue: Напиши́те а́дрес.
        accept: ["Ми́ша, напиши́ а́дрес."]
      - cue: Е́шьте торт.
        accept: ["Ми́ша, ешь торт."]
      - cue: Посмотри́те, пожа́луйста.
        accept: ["Ми́ша, посмотри́, пожа́луйста."]

  - id: e3
    type: choice
    task: 选择合适的体。
    why: 请人做一件具体的、要有结果的事，用完成体（第 1、2、4 题）。招呼别人坐下、请人开始做或者说一般应该怎样做，用未完成体（第 3、5 题）。第 3 题的完成体 [ся́дьте]{.ru} 听起来像命令，招待客人时不用。否定命令一般用未完成体（第 6 题）。
    items:
      - stem: ___, пожа́луйста, где метро́?
        options: [Говори́те, Скажи́те]
        answer: Скажи́те
      - stem: ___, пожа́луйста, ма́рку.
        options: [Дава́йте, Да́йте]
        answer: Да́йте
      - stem: ___, пожа́луйста! Вот стул.
        options: [Сади́тесь, Ся́дьте]
        answer: Сади́тесь
      - stem: ___ а́дрес вот здесь.
        options: [Пиши́те, Напиши́те]
        answer: Напиши́те
      - stem: Чита́йте по-ру́сски ка́ждый день и ___ слова́.
        options: [учи́те, вы́учите]
        answer: учи́те
      - stem: Не ___ здесь, пожа́луйста.
        options: [пиши́те, напиши́те]
        answer: пиши́те

  - id: e4
    type: choice
    task: 下面每句里的 [пожа́луйста]{.ru} 是什么意思？
    why: 用在请求里是“请”；回答 [спаси́бо]{.ru} 是“不客气”；把东西递给别人时是“给您”。判断时看上下文：前面有没有人道谢，说话人手里是不是正递着东西。
    items:
      - stem: "— Спаси́бо! — ___ Пожа́луйста."
        options: [请, 不客气, 给您]
        answer: 不客气
      - stem: Скажи́те, пожа́луйста, где по́чта? ___
        options: [请, 不客气, 给您]
        answer: 请
      - stem: "— Да́йте конве́рт. — Вот, пожа́луйста. ___"
        options: [请, 不客气, 给您]
        answer: 给您
      - stem: Сади́тесь, пожа́луйста. ___
        options: [请, 不客气, 给您]
        answer: 请

  - id: e5
    type: translate
    task: 译成俄语。
    why: 对陌生人用 [вы]{.ru} 的形式，对家里人用 [ты]{.ru} 的形式。第 1 题问路的固定开头是 [Извини́те, скажи́те, пожа́луйста]{.ru}。第 3 题“请坐”是邀请，用未完成体 [сади́сь]{.ru}。
    items:
      - zh: 劳驾，请问邮局在哪儿？
        accept: ["Извини́те, скажи́те, пожа́луйста, где по́чта?", "Извини́те, где по́чта?", "Скажи́те, пожа́луйста, где по́чта?"]
        rubric: ["对陌生人用 [вы]{.ru} 的命令式 [скажи́те]{.ru}", "加 [пожа́луйста]{.ru}"]
      - zh: 请给我一个信封和一张邮票。
        accept: ["Да́йте, пожа́луйста, конве́рт и ма́рку.", "Да́йте конве́рт и ма́рку, пожа́луйста."]
        rubric: ["[да́йте]{.ru} 是 [дать]{.ru} 的特殊形式", "[ма́рку]{.ru} 用第四格"]
      - zh: 米沙，请坐，拿块面包吃吧！
        accept: ["Ми́ша, сади́сь, пожа́луйста, возьми́ хлеб и ешь!", "Ми́ша, сади́сь, возьми́ хлеб и ешь!"]
        rubric: ["对家里人用 [ты]{.ru} 的形式：[сади́сь, возьми́, ешь]{.ru}"]
      - zh: 请在这里写地址。
        accept: ["Напиши́те, пожа́луйста, а́дрес здесь.", "Напиши́те а́дрес здесь.", "Напиши́те а́дрес вот здесь.", "Напиши́те здесь а́дрес."]
        rubric: ["具体的一件事，用完成体 [напиши́те]{.ru}"]

  - id: e6
    type: open
    task: 情景对话：在街上问路，然后在邮局买信封和邮票（8–10 句）。
    items:
      - prompt: 你在街上问一位行人邮局在哪儿，行人告诉你；到了邮局，你要信封和邮票，职员请你写地址。至少用五个命令式，注意 [пожа́луйста]{.ru} 的不同用法。
        length: 50–80
        model: "— Извини́те, скажи́те, пожа́луйста, где по́чта?\n— Вон там, о́коло па́рка. Посмотри́те: ви́дите но́вый дом?\n— Ви́жу. Спаси́бо!\n— Пожа́луйста.\n— Здра́вствуйте! Да́йте, пожа́луйста, конве́рт и ма́рку.\n— Пожа́луйста. Куда́ письмо́?\n— В Кита́й.\n— Напиши́те а́дрес здесь. Пиши́те по-англи́йски.\n— Хорошо́. Вот, пожа́луйста."
        rubric: ["问路用 [Извини́те, скажи́те, пожа́луйста]{.ru}", "具体请求用完成体命令式：[да́йте, напиши́те]{.ru}", "[пожа́луйста]{.ru} 至少有两种用法（请、不客气、给您）"]
        notes: 范文分两个场景：街上和邮局。问路时先说 [извини́те]{.ru} 引起注意，回答里用 [посмотри́те]{.ru} 指路。邮局里用 [да́йте, пожа́луйста]{.ru} 提出请求，职员用 [напиши́те]{.ru}（具体的一次）和 [пиши́те]{.ru}（怎样写）两种体的命令式。[пожа́луйста]{.ru} 三种意思都出现了。
