lesson: B2-L41
grammar: "前缀 [под-]{.ru}（走近，[к]{.ru} + 第三格）、[от-]{.ru}（走开，[от]{.ru} + 第二格）、[до-]{.ru}（走到，[до]{.ru} + 第二格）；交通工具的进站和开出。"
exercises:

  - id: e1
    type: choice
    task: 选择合适的前缀动词。
    why: "看前置词：[к]{.ru} + 第三格配 [под-]{.ru}（第 1、4 题），[от]{.ru} + 第二格配 [от-]{.ru}（第 2 题），[до]{.ru} + 第二格配 [до-]{.ru}（第 3、5 题）。第 6 题说船按时刻表开出，用 [отхо́дит]{.ru}。"
    items:
      - stem: Ван Лэй ___ к воде́.
        options: [подошёл, отошёл, дошёл]
        answer: подошёл
      - stem: Друзья́ засмея́лись и ___ от рыбака́.
        options: [подошли́, отошли́, дошли́]
        answer: отошли́
      - stem: Снача́ла они́ ___ до Кремля́.
        options: [подошли́, отошли́, дошли́]
        answer: дошли́
      - stem: К при́стани ___ авто́бус с тури́стами.
        options: [подъе́хал, дое́хал, отошёл]
        answer: подъе́хал
      - stem: До реки́ мо́жно ___ на авто́бусе.
        options: [подъе́хать, дое́хать, отойти́]
        answer: дое́хать
      - stem: Теплохо́д ___ в де́вять утра́.
        options: [подхо́дит, отхо́дит, дохо́дит]
        answer: отхо́дит

  - id: e2
    type: fill
    task: 用括号里的词的正确形式填空，注意前置词要求的格。
    why: "[к]{.ru} 要求第三格（第 1、2 题），[от]{.ru} 和 [до]{.ru} 要求第二格（第 3、4、5 题）。第 1 题 [вода́]{.ru} 第三格 [воде́]{.ru}；第 2 题 [при́стань]{.ru} 是 [-ь]{.ru} 结尾的阴性名词，第三格 [при́стани]{.ru}；第 4 题 [на́бережная]{.ru} 按形容词变格，第二格 [на́бережной]{.ru}。"
    items:
      - stem: Ди́ма подошёл к ___.
        hint: вода́
        accept: ["воде́"]
      - stem: Теплохо́д ме́дленно подошёл к ___.
        hint: при́стань
        accept: ["при́стани"]
      - stem: Мы отошли́ от ___.
        hint: окно́
        accept: ["окна́"]
      - stem: Они́ дошли́ до ___.
        hint: на́бережная
        accept: ["на́бережной"]
      - stem: Как дое́хать до ___?
        hint: вокза́л
        accept: ["вокза́ла"]

  - id: e3
    type: choice
    task: 比较前缀，选择合适的动词。
    why: "第 1 题“到朋友家里去”用 [прийти́ к]{.ru}；第 2 题“走到老师跟前”用 [подойти́ к]{.ru}。第 3 题“离门远一点”，人还在附近，用 [отойти́]{.ru} 的命令式 [отойди́те]{.ru}；第 4 题“回家了，不在这儿”用 [уйти́]{.ru}。第 5 题问路问的是怎么到达终点，用 [дойти́ до]{.ru}。"
    items:
      - stem: Ве́чером ко мне ___ друзья́, мы пи́ли чай.
        options: [пришли́, подошли́]
        answer: пришли́
      - stem: По́сле уро́ка Ван Лэй ___ к О́льге Ви́кторовне с вопро́сом.
        options: [пришёл, подошёл]
        answer: подошёл
      - stem: Здесь шу́мно, ___ немно́го от две́ри!
        options: [отойди́те, уйди́те]
        answer: отойди́те
      - stem: Ба́бушки нет, она́ уже́ ___ домо́й.
        options: [отошла́, ушла́]
        answer: ушла́
      - stem: Скажи́те, пожа́луйста, как ___ до Кремля́?
        options: [дойти́, подойти́]
        answer: дойти́

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题“走到跟前”用 [подойти́ к]{.ru} + 第三格。第 2 题问路用 [дойти́ до]{.ru} + 第二格。第 3 题按时刻表开出用未完成体现在时 [отхо́дит]{.ru}。第 4 题“走开”用 [отойти́ от]{.ru}，命令式 [отойди́(те)]{.ru}。"
    items:
      - zh: 两个朋友走到渔夫跟前。
        accept: ["Друзья́ подошли́ к рыбаку́.", "Два дру́га подошли́ к рыбаку́."]
        rubric: ["[подошли́]{.ru}", "[к рыбаку́]{.ru} 第三格"]
      - zh: 请问，到内河客运站怎么走？
        accept: ["Скажи́те, пожа́луйста, как дойти́ до речно́го вокза́ла?", "Извини́те, как дойти́ до речно́го вокза́ла?", "Прости́те, как дойти́ до речно́го вокза́ла?", "Скажи́те, пожа́луйста, как пройти́ к речно́му вокза́лу?", "Извини́те, как пройти́ к речно́му вокза́лу?", "Прости́те, как пройти́ к речно́му вокза́лу?", "Извини́те, пожа́луйста, как дойти́ до речно́го вокза́ла?"]
        rubric: ["[как дойти́ до]{.ru} + 第二格（也可以用第一册学的 [как пройти́ к]{.ru} + 第三格）", "[речно́го вокза́ла]{.ru}"]
      - zh: 船早上九点开。
        accept: ["Теплохо́д отхо́дит в де́вять утра́.", "Теплохо́д отхо́дит в де́вять часо́в утра́.", "В де́вять утра́ отхо́дит теплохо́д.", "Теплохо́д отхо́дит у́тром в де́вять часо́в.", "Теплохо́д отхо́дит у́тром в де́вять."]
        rubric: ["开船用 [отхо́дит]{.ru}，时刻表用未完成体现在时", "“早上九点”用 [в де́вять утра́]{.ru}"]
      - zh: 别靠水太近！走开一点！
        accept: ["Не подходи́ бли́зко к воде́! Отойди́!", "Не подходи́ к воде́! Отойди́!", "Не подходи́те бли́зко к воде́! Отойди́те!", "Не подходи́те к воде́! Отойди́те!", "Не подходи́ так бли́зко к воде́! Отойди́!", "Не подходи́ бли́зко к воде́! Отойди́ немно́го!", "Не подходи́ к воде́! Отойди́ немно́го!", "Не подходи́те бли́зко к воде́! Отойди́те немно́го!", "Не подходи́ бли́зко к воде́! Отойди́ пода́льше!", "Не подходи́ к воде́! Отойди́ пода́льше!", "Не подходи́ так бли́зко к воде́! Отойди́ немно́го!", "Не подходи́ так бли́зко к воде́! Отойди́ пода́льше!", "Не подходи́ к воде́ бли́зко! Отойди́!", "Не подходи́ к воде́ бли́зко! Отойди́ немно́го!", "Не подходи́ к воде́ бли́зко! Отойди́ пода́льше!", "Не подходи́ сли́шком бли́зко к воде́! Отойди́!", "Не подходи́ сли́шком бли́зко к воде́! Отойди́ немно́го!", "Не подходи́ сли́шком бли́зко к воде́! Отойди́ пода́льше!", "Не подходи́те бли́зко к воде́! Отойди́те пода́льше!", "Не подходи́те к воде́! Отойди́те немно́го!", "Не подходи́те к воде́! Отойди́те пода́льше!", "Не подходи́те так бли́зко к воде́! Отойди́те!", "Не подходи́те так бли́зко к воде́! Отойди́те немно́го!", "Не подходи́те так бли́зко к воде́! Отойди́те пода́льше!", "Не подходи́те к воде́ бли́зко! Отойди́те!", "Не подходи́те к воде́ бли́зко! Отойди́те немно́го!", "Не подходи́те к воде́ бли́зко! Отойди́те пода́льше!", "Не подходи́те сли́шком бли́зко к воде́! Отойди́те!", "Не подходи́те сли́шком бли́зко к воде́! Отойди́те немно́го!", "Не подходи́те сли́шком бли́зко к воде́! Отойди́те пода́льше!"]
        rubric: ["否定命令式用未完成体 [не подходи́]{.ru}", "“走开”用完成体命令式 [отойди́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Как друзья́ шли к Во́лге? Кака́я Во́лга в Каза́ни? Что сказа́л ста́рый рыба́к? Что друзья́ ви́дели у при́стани? Что они́ купи́ли на речно́м вокза́ле и заче́м?]{.ru}"
        length: 70–100
        model: "Четвёртого ма́я друзья́ пошли́ к Во́лге пешко́м. Снача́ла они́ дошли́ до Кремля́, а пото́м пошли́ вниз, к на́бережной. Во́лга здесь о́чень широ́кая, друго́й бе́рег далеко́. Друзья́ подошли́ к ста́рому рыбаку́, но он сказа́л, что они́ шумя́т и вся ры́ба ушла́. Тогда́ они́ отошли́ от него́. У при́стани они́ ви́дели большо́й бе́лый теплохо́д: он подошёл к при́стани и че́рез де́сять мину́т отошёл. На речно́м вокза́ле друзья́ купи́ли биле́ты: за́втра они́ поплыву́т на теплохо́де в Свия́жск."
        rubric: ["回答全部五个问题", "[дошли́ до]{.ru}、[подошли́ к]{.ru}、[отошли́ от]{.ru} 和后面的格用对", "转述渔夫的话用 [сказа́л, что…]{.ru}"]
        notes: 范文约 90 词。三个前缀各用到两次以上：[дошли́ до Кремля́]{.ru}、[подошли́ к рыбаку́]{.ru}、[отошли́ от него́]{.ru}、[подошёл к при́стани]{.ru}、[отошёл]{.ru}。转述直接引语时人称要改：渔夫说 [Вы шуми́те]{.ru}，转述成 [они́ шумя́т]{.ru}。

  - id: e6
    type: open
    task: 作文：《一条河》。
    items:
      - prompt: 写一条你熟悉的河（长江、黄河、莫斯科河或你家乡的河）：它在哪儿，什么样，你在河边做过什么，最近一次是怎么去的。用上 [подойти́]{.ru}、[дойти́]{.ru}、[дое́хать]{.ru} 等动词。
        length: 100–150
        model: "Я хорошо́ зна́ю Москву́-ре́ку. Она́ не о́чень широ́кая, но краси́вая. На её берега́х — Кремль, парк Го́рького и Воробьёвы го́ры.\n\nОт на́шего до́ма до реки́ далеко́. Обы́чно я доезжа́ю до Воробьёвых гор на метро́, а пото́м иду́ пешко́м. В про́шлую суббо́ту мы с друзья́ми дошли́ до са́мой воды́. По реке́ плы́ли теплохо́ды с тури́стами. Мы подошли́ к при́стани и спроси́ли, когда́ отхо́дит теплохо́д. Оказа́лось, что теплохо́ды отхо́дят ка́ждый час.\n\nЛе́том мы обяза́тельно пое́дем на теплохо́де по Москве́-реке́. Говоря́т, из окна́ теплохо́да Москва́ совсе́м друга́я."
        rubric: ["写清河在哪儿、什么样、在河边做过什么", "[под-]{.ru}、[от-]{.ru}、[до-]{.ru} 前缀动词至少用三个，前置词和格用对", "定向与不定向、体用对", "100–150 词，分段"]
        notes: 范文分三段：介绍河—去河边的经过—计划。经常的路线用未完成体 [доезжа́ю]{.ru}，上星期六那一次用完成体 [дошли́]{.ru}、[подошли́]{.ru}；时刻表用 [отхо́дит]{.ru}。第一段 [На её берега́х — Кремль…]{.ru} 用破折号代替 [нахо́дятся]{.ru}，列举河边的名胜。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是迪马，5 月 4 日晚上给在莫斯科的安娜写一封短信：今天你和王磊去了哪儿，遇到了什么好笑的事，明天有什么计划。
        length: 70–100
        model: "Приве́т, А́ня!\n\nКак дела́ в Москве́? А у нас всё отли́чно. Сего́дня мы с Ван Лэ́ем ходи́ли к Во́лге. Он подошёл к воде́ и спроси́л: «Э́то река́ и́ли мо́ре?»\n\nНа берегу́ мы подошли́ к ста́рому рыбаку́. А он сказа́л, что мы шуми́м и вся ры́ба ушла́! Мы, коне́чно, сра́зу отошли́.\n\nЗа́втра у́тром мы поплывём на теплохо́де в Свия́жск. Теплохо́д отхо́дит в де́вять, и Ван Лэй ду́мает, что я опозда́ю. Но я не опозда́ю!\n\nДо встре́чи в Москве́!\nДи́ма"
        rubric: ["有称呼和落款", "讲清去了哪儿、好笑的事、明天的计划", "[подошёл к]{.ru}、[отошли́]{.ru}、[отхо́дит]{.ru} 等用对", "朋友之间用 [ты]{.ru}"]
        notes: 朋友之间的信可以用 [Как дела́?]{.ru} 开头，结尾用 [До встре́чи!]{.ru}“回头见！”。[ходи́ли к Во́лге]{.ru} 用不定向过去时，表示去了一趟又回来了。
