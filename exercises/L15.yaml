lesson: L15
grammar: "语言的两种说法：副词 [по-ру́сски]{.ru}（与 [говори́ть, чита́ть, писа́ть, понима́ть]{.ru} 连用）和名词词组 [ру́сский язы́к]{.ru}（与 [знать, изуча́ть]{.ru} 连用）；副词作状语：[хорошо́, пло́хо, ме́дленно, бы́стро]{.ru}。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的形式。
    why: "[говори́ть]{.ru}、[чита́ть]{.ru}、[писа́ть]{.ru}、[понима́ть]{.ru} 和副词 [по-…ски]{.ru} 连用；[знать]{.ru}、[изуча́ть]{.ru} 后面要名词词组 [… язы́к]{.ru}。第 3 题和第 4 题对比最能说明区别。"
    items:
      - stem: Я говорю́ ___.
        options: [по-ру́сски, ру́сский язы́к]
        answer: по-ру́сски
      - stem: Ми́ша изуча́ет ___.
        options: [по-англи́йски, англи́йский язы́к]
        answer: англи́йский язы́к
      - stem: Ван Лэй зна́ет ___.
        options: [по-кита́йски, кита́йский язы́к]
        answer: кита́йский язы́к
      - stem: Ван Лэй пи́шет ___.
        options: [по-кита́йски, кита́йский язы́к]
        answer: по-кита́йски
      - stem: Ю́ми понима́ет ___.
        options: [по-францу́зски, францу́зский язы́к]
        answer: по-францу́зски
      - stem: Пьер зна́ет ___.
        options: [по-япо́нски, япо́нский язы́к]
        answer: япо́нский язы́к

  - id: e2
    type: rewrite
    task: 按例句改写句子。
    placeholder: Он говори́т по-…
    example:
      cue: Пьер зна́ет францу́зский язы́к.
      answer: Пьер говори́т по-францу́зски.
    why: 把 [знать]{.ru} + 形容词 + [язы́к]{.ru} 换成 [говори́ть]{.ru} + 副词：形容词去掉 [-ий]{.ru}，加 [по-]{.ru} 和 [-и]{.ru}。注意副词词尾是 [-и]{.ru}，不是 [-ий]{.ru}，连字符不能省。
    items:
      - cue: Ван Лэй зна́ет кита́йский язы́к.
        accept: ["Ван Лэй говори́т по-кита́йски.", "Он говори́т по-кита́йски."]
      - cue: Ю́ми зна́ет япо́нский язы́к.
        accept: ["Ю́ми говори́т по-япо́нски.", "Она́ говори́т по-япо́нски."]
      - cue: Ми́ша зна́ет англи́йский язы́к.
        accept: ["Ми́ша говори́т по-англи́йски.", "Он говори́т по-англи́йски."]
      - cue: Мы зна́ем ру́сский язы́к.
        accept: ["Мы говори́м по-ру́сски."]

  - id: e3
    type: fill
    task: 写出动词的正确形式，并注意后面语言的说法。
    why: 复习第一变位（[изуча́ть, понима́ть, писа́ть, жить]{.ru}）和第二变位（[говори́ть]{.ru}）。[писа́ть]{.ru} 的 [с]{.ru} 换成 [ш]{.ru}；[говори́ть]{.ru} 复数第三人称是 [говоря́т]{.ru}。
    items:
      - stem: Мы ___ кита́йский язы́к.
        hint: изуча́ть
        accept: ["изуча́ем"]
      - stem: Они́ ___ по-ру́сски.
        hint: говори́ть
        accept: ["говоря́т"]
      - stem: Ты ___ по-англи́йски?
        hint: понима́ть
        accept: ["понима́ешь"]
      - stem: А́нна ___ по-францу́зски.
        hint: писа́ть
        accept: ["пи́шет"]
      - stem: В Казахста́не ___ по-каза́хски и по-ру́сски.
        hint: говори́ть
        accept: ["говоря́т"]

  - id: e4
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：王磊会汉语和英语，说俄语说得慢；上课只说俄语；米沙在学校学英语；由美常讲哈萨克斯坦，因为她的朋友住在那里。
    items:
      - stem: Ван Лэй зна́ет ___.
        options: [кита́йский и англи́йский языки́, францу́зский язы́к, япо́нский язы́к]
        answer: кита́йский и англи́йский языки́
      - stem: По-ру́сски Ван Лэй говори́т ___.
        options: [бы́стро, ме́дленно]
        answer: ме́дленно
      - stem: На уро́ке студе́нты говоря́т ___.
        options: [по-англи́йски, по-францу́зски, то́лько по-ру́сски]
        answer: то́лько по-ру́сски
      - stem: Ми́ша в шко́ле изуча́ет ___.
        options: [ру́сский язы́к, англи́йский язы́к, кита́йский язы́к]
        answer: англи́йский язы́к
      - stem: Ю́ми ча́сто расска́зывает о ___.
        options: [Казахста́не, Япо́нии, Пари́же]
        answer: Казахста́не

  - id: e5
    type: translate
    task: 译成俄语。
    why: 先判断动词：“说、读、写、懂”用 [по-…ски]{.ru}；“懂（一门语言）、学”用 [знать]{.ru}、[изуча́ть]{.ru} + [… язы́к]{.ru}。
    items:
      - zh: 我会说一点儿俄语。
        accept: ["Я немно́го говорю́ по-ру́сски.", "Я говорю́ по-ру́сски немно́го.", "Я говорю́ немно́го по-ру́сски."]
        rubric: ["[говори́ть по-ру́сски]{.ru}", "“一点儿”用 [немно́го]{.ru}"]
      - zh: 皮埃尔懂法语和英语。
        accept: ["Пьер зна́ет францу́зский и англи́йский языки́.", "Пьер зна́ет францу́зский язы́к и англи́йский язы́к.", "Пьер говори́т по-францу́зски и по-англи́йски.", "Пьер зна́ет англи́йский и францу́зский языки́.", "Пьер понима́ет по-францу́зски и по-англи́йски."]
        rubric: ["[знать]{.ru} + [… язы́к]{.ru}，两种语言共用名词时用复数 [языки́]{.ru}", "或用 [говори́ть по-…]{.ru}"]
      - zh: 米沙在学校学英语。
        accept: ["Ми́ша изуча́ет англи́йский язы́к в шко́ле.", "Ми́ша в шко́ле изуча́ет англи́йский язы́к.", "В шко́ле Ми́ша изуча́ет англи́йский язы́к."]
        rubric: ["[изуча́ть англи́йский язы́к]{.ru}，不能用 [по-англи́йски]{.ru}", "[в шко́ле]{.ru}"]
      - zh: 你俄语说得很好！
        accept: ["Ты хорошо́ говори́шь по-ру́сски!", "Ты о́чень хорошо́ говори́шь по-ру́сски!", "Ты говори́шь по-ру́сски хорошо́!", "Ты говори́шь по-ру́сски о́чень хорошо́!"]
        rubric: ["“说得好”用副词 [хорошо́]{.ru}", "[говори́шь по-ру́сски]{.ru}"]
      - zh: 她读英语读得快，可是说得慢。
        accept: ["Она́ бы́стро чита́ет по-англи́йски, но ме́дленно говори́т.", "Она́ чита́ет по-англи́йски бы́стро, но говори́т ме́дленно.", "Она́ бы́стро чита́ет по-англи́йски, но говори́т ме́дленно.", "Она́ чита́ет по-англи́йски бы́стро, а говори́т ме́дленно.", "Она́ бы́стро чита́ет по-англи́йски, а говори́т ме́дленно."]
        rubric: ["[бы́стро]{.ru}、[ме́дленно]{.ru}", "[чита́ть по-англи́йски]{.ru}", "“可是”用 [но]{.ru}"]

  - id: e6
    type: open
    task: 情景对话。
    items:
      - prompt: 你在莫斯科认识了一个新同学。两人互相问会哪些语言、说得怎么样、在学什么语言。写一段 6–8 句的对话。
        length: 40–70
        model: "— Каки́е языки́ ты зна́ешь?\n— Я зна́ю кита́йский и англи́йский языки́. А ты?\n— Я зна́ю францу́зский язы́к. И немно́го говорю́ по-англи́йски.\n— Ты хорошо́ говори́шь по-ру́сски!\n— Спаси́бо, но я говорю́ ещё ме́дленно.\n— Я то́же. А что ты сейча́с изуча́ешь?\n— Сейча́с я изуча́ю ру́сский язы́к."
        rubric: ["[знать]{.ru} / [изуча́ть]{.ru} 和 [… язы́к]{.ru} 连用", "[говори́ть]{.ru} / [чита́ть]{.ru} 和 [по-…ски]{.ru} 连用", 用副词说明水平, "用 [ты]{.ru} 称呼同学"]
        notes: 范文以一问一答推进，第二句末尾用 [А ты?]{.ru} 把问题抛回给对方，这是口语里最自然的接话方式。对话里两种语言说法交替出现，正好对比 [знать францу́зский язы́к]{.ru} 和 [говорю́ по-англи́йски]{.ru}。同学之间用 [ты]{.ru}。
