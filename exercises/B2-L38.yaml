lesson: B2-L38
grammar: "运动动词全表（二）：[нести́ / носи́ть]{.ru}、[вести́ / води́ть]{.ru}、[везти́ / вози́ть]{.ru}；带东西还是带人、步行还是坐车；[води́ть маши́ну]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 写出括号里动词的正确形式（现在时或过去时）。
    why: "定向动词 [нести́, вести́, везти́]{.ru} 是第一变位，重音在词尾（第 1、3、5 题）；过去时阳性没有 [-л]{.ru}，[е]{.ru} 变成 [ё]{.ru}：[нёс, вёз]{.ru}，[вести́]{.ru} 的过去时是 [вёл, вела́]{.ru}（第 2、6 题）。不定向动词第一人称单数交替：[носи́ть → ношу́]{.ru}，[води́ть → вожу́]{.ru}，[вози́ть → вожу́]{.ru}（第 4、7 题）；第 8 题复数第三人称是 [во́дят]{.ru}。"
    items:
      - stem: Смотри́, Ди́ма ___ торт. (现在时)
        hint: нести́
        accept: ["несёт"]
      - stem: Вчера́ Ван Лэй ___ большу́ю су́мку. (过去时)
        hint: нести́
        accept: ["нёс"]
      - stem: Я ___ пода́рки в Каза́нь. (现在时)
        hint: везти́
        accept: ["везу́"]
      - stem: Я всегда́ ___ с собо́й слова́рь. (现在时)
        hint: носи́ть
        accept: ["ношу́"]
      - stem: Куда́ ты ___ ребёнка? (现在时)
        hint: вести́
        accept: ["ведёшь"]
      - stem: Све́та ___ Ван Лэ́я в его́ ко́мнату. (过去时)
        hint: вести́
        accept: ["вела́"]
      - stem: Я ка́ждый раз ___ домо́й пода́рки. (现在时)
        hint: вози́ть
        accept: ["вожу́"]
      - stem: Мои́ роди́тели ___ маши́ну. (现在时)
        hint: води́ть
        accept: ["во́дят"]

  - id: e2
    type: choice
    task: 选择合适的动词。
    why: "先看带的是东西还是人，再看是步行还是坐车。第 1 题步行拿着东西，用 [несёт]{.ru}。第 2 题领着孩子走路，用 [ведёт]{.ru}。第 3 题坐车送人，用 [везёт]{.ru}。第 4 题坐飞机带东西，用 [везу́]{.ru}，东西虽然在箱子里也一样。第 5 题导游带游客走着参观，用 [во́дит]{.ru}。第 6 题开车用 [води́ть маши́ну]{.ru}。"
    items:
      - stem: Ма́ма ___ из магази́на хлеб и молоко́.
        options: [несёт, ведёт, везёт]
        answer: несёт
      - stem: Ба́бушка ___ вну́ка в шко́лу пешко́м.
        options: [несёт, ведёт, везёт]
        answer: ведёт
      - stem: Па́па ___ друзе́й домо́й на маши́не.
        options: [несёт, ведёт, везёт]
        answer: везёт
      - stem: Я лечу́ в Пеки́н и ___ роди́телям пода́рки.
        options: [несу́, веду́, везу́]
        answer: везу́
      - stem: Ди́ма ле́том ___ тури́стов по Кремлю́.
        options: [но́сит, во́дит, во́зит]
        answer: во́дит
      - stem: Ты уме́ешь ___ маши́ну?
        options: [носи́ть, води́ть, вози́ть]
        answer: води́ть

  - id: e3
    type: choice
    task: 选择定向动词或不定向动词。
    why: "第 1、4 题说的是那一次的经过，用定向动词。第 2 题 [всегда́]{.ru}、第 3 题 [ча́сто]{.ru} 表示经常，用不定向动词。第 5 题说会开车，是能力，用不定向的 [во́дит]{.ru}。第 6 题“穿、戴”只能用 [носи́ть]{.ru}。"
    items:
      - stem: Когда́ Андре́й Петро́вич ___ маши́ну из аэропо́рта, он пока́зывал друзья́м го́род.
        options: [вёл, води́л]
        answer: вёл
      - stem: Ди́ма всегда́ ___ с собо́й гита́ру.
        options: [несёт, но́сит]
        answer: но́сит
      - stem: Ди́ма ча́сто ___ домо́й пода́рки из Москвы́.
        options: [везёт, во́зит]
        answer: во́зит
      - stem: Сейча́с я ___ су́мку к маши́не.
        options: [несу́, ношу́]
        answer: несу́
      - stem: Па́па Ди́мы ___ маши́ну уже́ три́дцать лет.
        options: [ведёт, во́дит]
        answer: во́дит
      - stem: Ива́н Серге́евич ___ очки́.
        options: [несёт, но́сит]
        answer: но́сит

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题坐车送人，用 [везти́]{.ru}。第 2 题步行拎着包，用 [нести́]{.ru} 的过去时 [нёс]{.ru}。第 3 题“会开车”用 [води́ть маши́ну]{.ru}。第 4 题导游带人多次参观，用 [води́ть по]{.ru} 加第三格。第 5 题“每次都带”是经常，坐火车带东西用 [вози́ть]{.ru}。"
    items:
      - zh: 爸爸开车送我们回家。
        accept: ["Па́па везёт нас домо́й.", "Па́па вёз нас домо́й.", "Па́па везёт нас домо́й на маши́не.", "Па́па вёз нас домо́й на маши́не.", "Па́па на маши́не везёт нас домо́й.", "Па́па на маши́не вёз нас домо́й.", "Па́па везёт нас на маши́не домо́й.", "Па́па вёз нас на маши́не домо́й."]
        rubric: ["坐车送人用 [везти́]{.ru}：[везёт]{.ru} 或 [вёз]{.ru}", "[нас]{.ru} 第四格，[домо́й]{.ru} 表示方向"]
      - zh: 王磊拎着一个很沉的包。
        accept: ["Ван Лэй нёс о́чень тяжёлую су́мку.", "Ван Лэй несёт о́чень тяжёлую су́мку.", "Ван Лэй нёс тяжёлую су́мку.", "Ван Лэй несёт тяжёлую су́мку."]
        rubric: ["步行拿着东西用 [нести́]{.ru}", "[тяжёлую су́мку]{.ru} 第四格"]
      - zh: 你会开车吗？——还不会。
        accept: ["— Ты уме́ешь води́ть маши́ну? — Ещё нет.", "— Ты уме́ешь води́ть маши́ну? — Пока́ нет.", "— Ты уме́ешь води́ть? — Ещё нет.", "— Ты уме́ешь води́ть? — Пока́ нет.", "— Ты во́дишь маши́ну? — Ещё нет.", "— Ты уме́ешь води́ть маши́ну? — Нет, ещё не уме́ю.", "— Ты уме́ешь води́ть? — Нет, ещё не уме́ю.", "— Вы уме́ете води́ть маши́ну? — Ещё нет.", "— Вы уме́ете води́ть маши́ну? — Пока́ нет.", "— Вы уме́ете води́ть? — Ещё нет.", "— Вы уме́ете води́ть? — Пока́ нет.", "— Ты уме́ешь води́ть маши́ну? — Нет, пока́ не уме́ю.", "— Ты уме́ешь води́ть маши́ну? — Ещё не уме́ю.", "— Ты уме́ешь води́ть маши́ну? — Пока́ не уме́ю.", "— Ты уме́ешь води́ть? — Нет, пока́ не уме́ю.", "— Ты уме́ешь води́ть? — Ещё не уме́ю.", "— Ты уме́ешь води́ть? — Пока́ не уме́ю.", "— Ты во́дишь маши́ну? — Пока́ нет.", "— Ты во́дишь маши́ну? — Нет, ещё не уме́ю.", "— Ты во́дишь маши́ну? — Нет, пока́ не уме́ю.", "— Ты во́дишь маши́ну? — Ещё не уме́ю.", "— Ты во́дишь маши́ну? — Пока́ не уме́ю.", "— Вы уме́ете води́ть маши́ну? — Нет, ещё не уме́ю.", "— Вы уме́ете води́ть маши́ну? — Нет, пока́ не уме́ю.", "— Вы уме́ете води́ть маши́ну? — Ещё не уме́ю.", "— Вы уме́ете води́ть маши́ну? — Пока́ не уме́ю.", "— Вы уме́ете води́ть? — Нет, ещё не уме́ю.", "— Вы уме́ете води́ть? — Нет, пока́ не уме́ю.", "— Вы уме́ете води́ть? — Ещё не уме́ю.", "— Вы уме́ете води́ть? — Пока́ не уме́ю.", "— Вы во́дите маши́ну? — Ещё нет.", "— Вы во́дите маши́ну? — Пока́ нет.", "— Вы во́дите маши́ну? — Нет, ещё не уме́ю.", "— Вы во́дите маши́ну? — Нет, пока́ не уме́ю.", "— Вы во́дите маши́ну? — Ещё не уме́ю.", "— Вы во́дите маши́ну? — Пока́ не уме́ю."]
        rubric: ["“开车”用 [води́ть маши́ну]{.ru}，不能用 [е́хать]{.ru} 或 [вести́]{.ru}"]
      - zh: 夏天迪马带游客参观克里姆林。
        accept: ["Ле́том Ди́ма во́дит тури́стов по Кремлю́.", "Ле́том Ди́ма води́л тури́стов по Кремлю́.", "Ди́ма ле́том во́дит тури́стов по Кремлю́.", "Ди́ма ле́том води́л тури́стов по Кремлю́.", "Ле́том Ди́ма во́дит экску́рсии по Кремлю́.", "Ле́том Ди́ма води́л экску́рсии по Кремлю́."]
        rubric: ["多次带人参观，用不定向动词 [води́ть]{.ru}", "[по Кремлю́]{.ru} 用第三格"]
      - zh: 我每次坐火车回家都给妹妹带礼物。
        accept: ["Когда́ я е́зжу домо́й на по́езде, я ка́ждый раз вожу́ сестре́ пода́рки.", "Ка́ждый раз, когда́ я е́зжу домо́й на по́езде, я вожу́ сестре́ пода́рки.", "Когда́ я е́зжу домо́й на по́езде, я всегда́ вожу́ сестре́ пода́рки.", "Я всегда́ вожу́ сестре́ пода́рки, когда́ е́зжу домо́й на по́езде.", "Ка́ждый раз, когда́ я е́ду домо́й на по́езде, я везу́ сестре́ пода́рки."]
        rubric: ["坐车带东西用 [вози́ть / везти́]{.ru}，不用 [носи́ть]{.ru}", "“每次”表示经常，一般用不定向 [вожу́]{.ru}；[ка́ждый раз, когда́ я е́ду…, я везу́…]{.ru} 着眼于每一次路上，也对", "给谁用第三格 [сестре́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Кто встреча́л друзе́й в аэропорту́? Что нёс Ван Лэй, а что — Ди́ма? Как ма́ма Ди́мы встреча́ла Ван Лэ́я? Каки́е пода́рки Ван Лэй подари́л семье́ Ди́мы? Что Ди́ма обеща́л Ван Лэ́ю?]{.ru}"
        length: 70–100
        model: "В аэропорту́ друзе́й встреча́л па́па Ди́мы, Андре́й Петро́вич. Ван Лэй нёс большу́ю тяжёлую су́мку с пода́рками, а Ди́ма — рюкза́к, гита́ру и торт. Андре́й Петро́вич вёз их домо́й на маши́не. До́ма ма́ма Ди́мы встреча́ла Ван Лэ́я хле́бом и со́лью, потому́ что он их пе́рвый гость из Кита́я. Ван Лэй подари́л па́пе Ди́мы чай, ма́ме — диск с кита́йской му́зыкой, Све́те — ве́ер, а ба́бушке — тёплый плато́к. Ве́чером Ди́ма обеща́л в понеде́льник води́ть дру́га по го́роду."
        rubric: ["回答全部五个问题", "[нёс]{.ru}、[вёз]{.ru}、[води́ть]{.ru} 用对", "送礼物的对象用第三格"]
        notes: 范文约 75 词。拎包是步行带东西（[нёс]{.ru}），开车送人是坐车带人（[вёз]{.ru}），领着逛城是步行带人、到处走（[води́ть по го́роду]{.ru}）。列举礼物时后几个分句省去 [подари́л]{.ru}，用破折号，和课文一样。

  - id: e6
    type: open
    task: 作文：《送礼物》。
    items:
      - prompt: 你去朋友或亲戚家做客，带了什么礼物，怎么带去的（拎着、开车、坐火车或飞机），主人怎么迎接你？也可以写写你们家怎么迎接客人。
        length: 100–150
        model: "Зимо́й я е́здил в Шанха́й к двою́родному бра́ту. Я е́хал на по́езде, а пода́рки вёз в большо́м чемода́не. Бра́ту я вёз кни́гу, его́ жене́ — краси́вый плато́к, а их ма́ленькой до́чери — игру́шку.\n\nНа вокза́ле меня́ встреча́л брат. Он сам нёс мой чемода́н до маши́ны, а пото́м вёз меня́ домо́й. Он во́дит маши́ну о́чень хорошо́.\n\nДо́ма его́ жена́ пригото́вила большо́й у́жин. Когда́ я откры́л чемода́н, их дочь сра́зу начала́ игра́ть с но́вой игру́шкой. А брат сказа́л: «Ты ка́ждый раз во́зишь нам пода́рки! Не на́до!»\n\nВ на́шей семье́ то́же лю́бят госте́й. Когда́ у нас го́сти, ма́ма гото́вит пельме́ни, а па́па пока́зывает им на́ши фотогра́фии."
        rubric: ["写清带了什么、给谁、怎么带去的", "按情境用对 [нести́ / везти́ / вести́]{.ru} 和对应的不定向动词", "送给谁用第三格", "100–150 词，分段"]
        notes: 范文按“出发—到站—在家里—我们家的习惯”分四段。坐火车带东西用 [вёз]{.ru}；到站后拎着箱子走是 [нёс]{.ru}；开车送人用 [вёз]{.ru}；会开车用 [во́дит]{.ru}；“你每次都带礼物”是经常，用 [во́зишь]{.ru}。最后一段 [Когда́ у нас го́сти]{.ru}“家里来客人的时候”是常用说法。

  - id: e7
    type: open
    task: 书信写作。
    items:
      - prompt: 你是王磊，给北京的父母写一封信：讲讲喀山的迪马一家怎么迎接你，你送了哪些礼物，大家喜不喜欢。称呼和落款要写全。
        length: 80–120
        model: "Дороги́е ма́ма и па́па!\n\nЯ пишу́ вам из Каза́ни. Я здесь в гостя́х у моего́ дру́га Ди́мы. В аэропорту́ нас встреча́л его́ па́па. Он вёз нас домо́й на маши́не и пока́зывал го́род.\n\nА до́ма ма́ма Ди́мы встреча́ла меня́ хле́бом и со́лью! Так в Росси́и встреча́ют госте́й. На́до взять кусо́к хле́ба и съесть его́ с со́лью.\n\nПода́рки я купи́л в Москве́ и вёз их в большо́й су́мке. Па́пе Ди́мы я подари́л чай, его́ ма́ме — диск с кита́йской му́зыкой, сестре́ — ве́ер, а ба́бушке — плато́к. Всем о́чень понра́вилось!\n\nПиши́те!\nВаш сын Ван Лэй"
        rubric: ["有称呼（[Дороги́е ма́ма и па́па!]{.ru}）和落款", "讲清迎接的情形和礼物", "[вёз]{.ru} 等运动动词用对", "给父母写信用 [вы]{.ru}"]
        notes: 给父母的信称呼用 [Дороги́е ма́ма и па́па!]{.ru}，正文用 [вы]{.ru}（指父母两人）。结尾常写 [Пиши́те!]{.ru}“来信！”，落款写 [Ваш сын]{.ru} 加名字。[в гостя́х у]{.ru} 加第二格表示“在某人家做客”。范文先说在哪里，再讲迎接，最后讲礼物，每段一件事。
