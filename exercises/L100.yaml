lesson: L100
heading: 结业测试
intro: 本测试覆盖第一册全部语法。答对 80% 以上就可以进入第二册；没有达到的，按出错的题回到相应的课复习后重做。
grammar: "名词、形容词、代词六个格的单数；名词复数第一格；动词的时和体；运动动词；命令式；无人称句；复合句（[когда́]{.ru}、[е́сли]{.ru}、[е́сли бы]{.ru}、[потому́ что]{.ru}、[что]{.ru}、[ли]{.ru}、[кото́рый]{.ru}）。"
exercises:

  - id: e1
    type: choice
    task: 选择正确的格的形式。
    why: "[нет]{.ru} 要求第二格：[вре́мени]{.ru}。[дари́ть]{.ru} 送给谁用第三格：[ма́ме]{.ru}。[ви́деть]{.ru} 的直接补语是动物名词，阳性用第四格 = 第二格：[бра́та]{.ru}，这一题最容易错选第一格。[рабо́тать]{.ru} 表示职业要求第五格：[врачо́м]{.ru}。[говори́ть о]{.ru} 要求第六格，形容词和名词都要变：[о но́вом фи́льме]{.ru}。[у]{.ru} 后面的第三人称代词加 [н-]{.ru}：[у него́]{.ru}。"
    items:
      - stem: У меня́ нет ___.
        options: [вре́мя, вре́мени, вре́менем]
        answer: вре́мени
      - stem: Что ты пода́ришь ___?
        options: [ма́ма, ма́му, ма́ме]
        answer: ма́ме
      - stem: Я ви́жу ___ А́нны.
        options: [брат, бра́та, бра́ту]
        answer: бра́та
      - stem: Мари́я Никола́евна рабо́тает ___.
        options: [врач, врача́, врачо́м]
        answer: врачо́м
      - stem: Мы говори́м о ___.
        options: [но́вый фильм, но́вом фи́льме, но́вого фи́льма]
        answer: но́вом фи́льме
      - stem: У ___ есть ста́рший брат?
        options: [его́, него́, ему́]
        answer: него́

  - id: e2
    type: fill
    task: 写出名词的复数第一格。
    why: "[кни́га]{.ru} 的 [г]{.ru} 后按拼写规则写 [и]{.ru}；[неде́ля]{.ru} 以 [-я]{.ru} 结尾，复数用 [-и]{.ru}；[письмо́]{.ru} 中性复数用 [-а]{.ru}，重音前移；[брат, друг, глаз, ребёнок]{.ru} 的复数不规则，要单独记。"
    items:
      - stem: кни́га → ___
        accept: [кни́ги]
      - stem: неде́ля → ___
        accept: [неде́ли]
      - stem: письмо́ → ___
        accept: [пи́сьма]
      - stem: брат → ___
        accept: [бра́тья]
      - stem: друг → ___
        accept: [друзья́]
      - stem: ребёнок → ___
        accept: [де́ти]

  - id: e3
    type: choice
    task: 选择正确的体。
    why: "[ка́ждый день]{.ru}、[весь ве́чер]{.ru} 表示反复和持续，用未完成体（第 1、2 题）。具体的一次、有结果用完成体：[прочита́л три кни́ги]{.ru}（第 3 题）、将来的一次 [куплю́]{.ru}（第 4 题）。“只说做没做过，不问结果”用未完成体：[Ты чита́л…?]{.ru}（第 5 题）。[бу́ду]{.ru} 后面只能接未完成体不定式，不能说 [бу́ду прочита́ть]{.ru}（第 6 题）。"
    items:
      - stem: Ка́ждый день я ___ в семь часо́в.
        options: [встаю́, вста́ну]
        answer: встаю́
      - stem: Вчера́ мы весь ве́чер ___ телеви́зор.
        options: [смотре́ли, посмотре́ли]
        answer: смотре́ли
      - stem: В э́том семе́стре я ___ три кни́ги.
        options: [чита́л, прочита́л]
        answer: прочита́л
      - stem: За́втра я ___ биле́т на самолёт.
        options: [покупа́ю, куплю́]
        answer: куплю́
      - stem: Ты ___ «Капита́нскую до́чку»? — Нет, не чита́л.
        options: [чита́л, прочита́ешь]
        answer: чита́л
      - stem: Ле́том я бу́ду ___ мно́го.
        options: [чита́ть, прочита́ть]
        answer: чита́ть

  - id: e4
    type: choice
    task: 选择正确的运动动词。
    why: "此刻朝一个方向走用定向 [идти́]{.ru}（第 1 题）；经常去用不定向 [ходи́ть]{.ru}（第 2 题）；去了又回来了用不定向的过去时 [е́здили]{.ru}（第 3 题）；“在……的路上”用定向的过去时 [шёл]{.ru}（第 4 题）；打算动身去用 [пое́хать]{.ru}（第 5 题）。乘车用 [е́хать / е́здить]{.ru}，步行用 [идти́ / ходи́ть]{.ru}。"
    items:
      - stem: — Куда́ ты сейча́с ___? — В библиоте́ку.
        options: [идёшь, хо́дишь, пошёл]
        answer: идёшь
      - stem: Ван Лэй ча́сто ___ в теа́тр.
        options: [идёт, хо́дит, пошёл]
        answer: хо́дит
      - stem: В декабре́ мы ___ в Петербу́рг.
        options: [е́хали, е́здили, е́дем]
        answer: е́здили
      - stem: Когда́ я ___ домо́й, я ви́дел А́нну.
        options: [шёл, ходи́л, пойду́]
        answer: шёл
      - stem: Ле́том мы ___ на Байка́л.
        options: [е́здим, пое́дем, е́здили]
        answer: пое́дем

  - id: e5
    type: fill
    task: 写出括号里动词的命令式。
    why: "[откры́ть]{.ru}（[откро́ют]{.ru}）、[передава́ть]{.ru} 词干以元音结尾，加 [-й]{.ru}，[передава́ть]{.ru} 保留 [-ва-]{.ru}；[сказа́ть]{.ru}（[скажу́]{.ru}）、[написа́ть]{.ru}（[напишу́]{.ru}）第一人称重音在词尾，加 [-и]{.ru}；[встать]{.ru}（[вста́ну]{.ru}）重音在词干，加 [-ь]{.ru}。对 [вы]{.ru} 说加 [-те]{.ru}。[дать]{.ru} 的命令式特殊：[да́йте]{.ru}。"
    items:
      - stem: Ми́ша, ___ окно́, пожа́луйста!
        hint: откры́ть
        accept: [откро́й]
      - stem: ___ приве́т ба́бушке!
        hint: передава́ть（对 вы）
        accept: [передава́йте]
      - stem: ___, пожа́луйста, где по́чта?
        hint: сказа́ть（对 вы）
        accept: [скажи́те]
      - stem: ___ мне из Пеки́на!
        hint: написа́ть（对 ты）
        accept: [напиши́]
      - stem: Ми́ша, ___! Уже́ во́семь часо́в!
        hint: встать
        accept: [встань]
      - stem: ___, пожа́луйста, чай.
        hint: дать（对 вы）
        accept: [да́йте]

  - id: e6
    type: choice
    task: 选择正确的形式。
    why: "无人称句里感受的人用第三格：[Мне хо́лодно]{.ru}，不能说 [Я хо́лодно]{.ru}（第 1 题）。过去时用中性 [бы́ло]{.ru}，不随人变化（第 2 题）。[нра́виться]{.ru} 喜欢的东西是主语，人用第三格：[Ему́ нра́вится]{.ru}（第 3 题）。[ну́жен]{.ru} 和需要的东西一致：[ку́ртка]{.ru} 阴性用 [нужна́]{.ru}（第 4 题）。年龄用第三格加 [год / го́да / лет]{.ru}，五以上用 [лет]{.ru}（第 5 题）。"
    items:
      - stem: Зимо́й в Москве́ ___ хо́лодно.
        options: [мне, я, меня́]
        answer: мне
      - stem: А́нне ___ ску́чно.
        options: [была́, бы́ло, был]
        answer: бы́ло
      - stem: ___ нра́вится Москва́.
        options: [Он, Его́, Ему́]
        answer: Ему́
      - stem: Ван Лэ́ю ___ тёплая ку́ртка.
        options: [ну́жен, нужна́, ну́жно]
        answer: нужна́
      - stem: Ба́бушке се́мьдесят пять ___.
        options: [год, го́да, лет]
        answer: лет

  - id: e7
    type: choice
    task: 选择正确的连接词。
    why: "[е́сли]{.ru} 说可能发生的条件（第 1 题），[е́сли бы]{.ru} 说不真实的条件，主句也要有 [бы]{.ru}（第 2 题）。[потому́ что]{.ru} 引出原因，[поэ́тому]{.ru} 引出结果（第 3、4 题）。转述陈述句用 [что]{.ru}，转述一般疑问句用 [ли]{.ru}，“是否”不能用 [е́сли]{.ru}（第 5、6 题）。[кото́рый]{.ru} 和前面的名词性、数一致：[парк]{.ru} 阳性用 [кото́рый]{.ru}（第 7 题）。"
    items:
      - stem: ___ за́втра бу́дет хоро́шая пого́да, мы пое́дем к ба́бушке.
        options: [Е́сли, Е́сли бы, Потому́ что]
        answer: Е́сли
      - stem: ___ у меня́ бы́ло вре́мя, я бы пое́хал на по́езде.
        options: [Е́сли, Е́сли бы, Когда́]
        answer: Е́сли бы
      - stem: Я не́ был на уро́ке, ___ был бо́лен.
        options: [потому́ что, поэ́тому, что]
        answer: потому́ что
      - stem: Шёл дождь, ___ мы бы́ли до́ма.
        options: [потому́ что, поэ́тому, е́сли]
        answer: поэ́тому
      - stem: Ка́тя сказа́ла, ___ позвони́т ве́чером.
        options: [что, ли, е́сли]
        answer: что
      - stem: Па́па спроси́л, по́мню ___ я кита́йский язы́к.
        options: [что, ли, е́сли]
        answer: ли
      - stem: Э́то парк, ___ нахо́дится в це́нтре Москвы́.
        options: [кото́рый, кото́рая, кото́рое]
        answer: кото́рый

  - id: e8
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在王磊的信里：爸爸妈妈在机场等他；他送妈妈套娃、送爸爸关于莫斯科的书；他在家里给父母拜年，不是打电话；他觉得住在宿舍俄语会差得多；米沙的画挂在他房间的墙上；夏天要去贝加尔湖；三天后他就回莫斯科了。
    items:
      - stem: В аэропорту́ Ван Лэ́я жда́ли ___.
        options: [ма́ма и па́па, А́нна и Ми́ша]
        answer: ма́ма и па́па
      - stem: Па́пе Ван Лэй подари́л ___.
        options: [матрёшку, кни́гу о Москве́, варе́нье]
        answer: кни́гу о Москве́
      - stem: С Пра́здником весны́ Ван Лэй поздра́вил ма́му и па́пу ___.
        options: [по телефо́ну, до́ма]
        answer: до́ма
      - stem: Е́сли бы Ван Лэй жил в общежи́тии, он бы говори́л по-ру́сски ___.
        options: [лу́чше, ху́же]
        answer: ху́же
      - stem: Рису́нок Ми́ши виси́т ___.
        options: [на стене́ в ко́мнате Ван Лэ́я, на ку́хне]
        answer: на стене́ в ко́мнате Ван Лэ́я
      - stem: Ле́том они́ собира́ются пое́хать ___.
        options: [на Байка́л, в Пеки́н, в Петербу́рг]
        answer: на Байка́л
      - stem: Ван Лэй бу́дет в Москве́ ___.
        options: [че́рез три дня, че́рез две неде́ли]
        answer: че́рез три дня

  - id: e9
    type: translate
    task: 译成俄语。
    why: 第 1 题“我从来没去过”要双重否定 [никогда́ не]{.ru}，阳性 [не́ был]{.ru} 重音在 [не]{.ru} 上，“在西伯利亚”用 [в]{.ru} + 第六格 [Сиби́ри]{.ru}。第 2 题“祝贺”用 [поздравля́ть]{.ru} + 第四格 + [с]{.ru} + 第五格，“祝愿”用 [жела́ть]{.ru} + 第三格 + 第二格。第 3 题“打算”用 [собира́ться]{.ru}，“待两个星期”是打算的期限，用 [на]{.ru} + 第四格。第 4 题“我冷”是无人称句 [мне хо́лодно]{.ru}，“因为……所以……”只能用一个连词。
    items:
      - zh: 我从来没去过西伯利亚。
        accept: ["Я никогда́ не́ был в Сиби́ри.", "Я никогда́ не была́ в Сиби́ри.", "Я никогда́ не е́здил в Сиби́рь.", "Я никогда́ не е́здила в Сиби́рь."]
        rubric: ["双重否定 [никогда́ не]{.ru}", "[в Сиби́ри]{.ru} 第六格；用 [е́здил]{.ru} 时是 [в Сиби́рь]{.ru} 第四格"]
      - zh: 祝你们新年快乐！祝你们幸福健康！
        accept: ["Поздравля́ю вас с Но́вым го́дом! Жела́ю вам сча́стья и здоро́вья!", "С Но́вым го́дом! Жела́ю вам сча́стья и здоро́вья!", "Поздравля́ю вас с Но́вым го́дом и жела́ю вам сча́стья и здоро́вья!", "Поздравля́ем вас с Но́вым го́дом! Жела́ем вам сча́стья и здоро́вья!", "Поздравля́ю вас с Но́вым го́дом! Жела́ю вам здоро́вья и сча́стья!", "С Но́вым го́дом! Жела́ю вам здоро́вья и сча́стья!"]
        rubric: ["[поздравля́ть кого́ с чем]{.ru}：[вас]{.ru} 第四格，[с Но́вым го́дом]{.ru} 第五格", "[жела́ть кому́ чего́]{.ru}：[вам]{.ru} 第三格，[сча́стья и здоро́вья]{.ru} 第二格"]
      - zh: 一月底我打算回北京待两个星期。
        accept: ["В конце́ января́ я собира́юсь пое́хать в Пеки́н на две неде́ли.", "В конце́ января́ я собира́юсь пое́хать домо́й в Пеки́н на две неде́ли.", "В конце́ января́ я собира́юсь в Пеки́н на две неде́ли.", "Я собира́юсь в конце́ января́ пое́хать в Пеки́н на две неде́ли.", "В конце́ января́ я собира́юсь пое́хать на две неде́ли в Пеки́н."]
        rubric: ["[собира́ться]{.ru} + 不定式 [пое́хать]{.ru}", "[на две неде́ли]{.ru} 表示打算待多久", "[в конце́ января́]{.ru}"]
      - zh: 我很冷，因为我忘了带大衣。
        accept: ["Мне о́чень хо́лодно, потому́ что я забы́л пальто́.", "Мне о́чень хо́лодно, потому́ что я забы́ла пальто́.", "Мне хо́лодно, потому́ что я забы́л пальто́.", "Мне хо́лодно, потому́ что я забы́ла пальто́.", "Мне о́чень хо́лодно, потому́ что я забы́л взять пальто́.", "Мне о́чень хо́лодно, потому́ что я забы́ла взять пальто́.", "Мне о́чень хо́лодно, потому́ что я забы́л своё пальто́.", "Мне о́чень хо́лодно, потому́ что я забы́ла своё пальто́."]
        rubric: ["无人称句 [мне хо́лодно]{.ru}，不说 [я хо́лодно]{.ru}", "[потому́ что]{.ru} 引出原因", "[пальто́]{.ru} 不变格"]

  - id: e10
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是安娜，给在北京的王磊回信。要有书信格式（地点日期、称呼、问候、结束语、落款），写写莫斯科家里这两个星期的事（米沙、穆尔卡、考试或别的消息），问问王磊在北京的情况，说说二月的打算。
        length: 100–150
        model: "Москва́, 9 февраля́\n\nДорого́й Ван Лэй!\n\nЗдра́вствуй! Спаси́бо за письмо́! Мы все его́ чита́ли за у́жином, а Ми́ша прочита́л его́ два ра́за.\n\nУ нас всё хорошо́. Се́ссия ко́нчилась, и тепе́рь у меня́ кани́кулы. Я е́здила в Петербу́рг к подру́ге, и мы бы́ли в Эрмита́же. Ми́ша ка́ждый день хо́дит в шко́лу, а ве́чером игра́ет в ша́хматы с па́пой. Му́рка ча́сто спит на твое́й крова́ти: она́ то́же скуча́ет по тебе́.\n\nВ Москве́ о́чень хо́лодно и мно́го сне́га. Когда́ ты бу́дешь здесь, мы пое́дем на като́к. Ты по́мнишь, что в феврале́ мы идём в теа́тр? Я уже́ купи́ла биле́ты.\n\nКак твои́ ма́ма и па́па? Что ты де́лал на Пра́здник весны́? Напиши́, когда́ ты бу́дешь в Москве́, и мы с па́пой пое́дем в аэропо́рт.\n\nПереда́й приве́т ма́ме и па́пе!\n\nТвоя́ А́нна"
        rubric: ["书信格式完整：地点日期、[Дорого́й Ван Лэй!]{.ru}、[Здра́вствуй!]{.ru}、结束语、[Твоя́ А́нна]{.ru}", "对王磊用 [ты]{.ru}，命令式用单数", "安娜是女性，过去时用阴性：[е́здила, купи́ла]{.ru}", "至少一个复合句（[когда́, что, е́сли]{.ru} 等）", "至少一个问题问王磊的情况"]
        notes: 范文按书信格式写：右上角地点日期，称呼单独一行，用感叹号；正文先感谢来信，再讲家里的消息（自己、米沙、穆尔卡、天气），然后提问、说打算，最后用命令式 [Переда́й приве́т …!]{.ru} 结束，落款 [Твоя́ А́нна]{.ru}。体的用法：[ка́ждый день хо́дит]{.ru} 表示经常，[прочита́л два ра́за]{.ru}、[купи́ла биле́ты]{.ru} 表示结果。[Когда́ ты бу́дешь здесь, мы пое́дем…]{.ru} 说将来的事，从句也用将来时。
