lesson: B2-L04
grammar: "数词与名词连用：看最后一个词——[оди́н]{.ru} + 单数第一格，[два, три, четы́ре]{.ru} + 单数第二格，5 以上 + 复数第二格；[оди́н, два]{.ru} 的性；[нас бы́ло пятна́дцать]{.ru}。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的词的正确形式填空。
    why: "合成数词只看最后一个词：第 2 题 [два́дцать оди́н]{.ru} 后用单数第一格 [год]{.ru}，第 3 题 [два́дцать четы́ре]{.ru}、第 8 题 [три́дцать два]{.ru} 后用单数第二格 [го́да, рубля́]{.ru}。第 1 题 [двена́дцать]{.ru} 是一个词，属于 5–20，用复数第二格 [студе́нтов]{.ru}。第 5 题 [одно́]{.ru} 后用单数第一格 [сочине́ние]{.ru}。第 6 题 [откры́ток]{.ru} 是零词尾加隐现元音 [о]{.ru}。"
    items:
      - stem: В гру́ппе двена́дцать ___.
        hint: студе́нт
        accept: ["студе́нтов"]
      - stem: Пье́ру два́дцать оди́н ___.
        hint: год
        accept: ["год"]
      - stem: Хосе́ два́дцать четы́ре ___.
        hint: год
        accept: ["го́да"]
      - stem: В гру́ппе пять ___.
        hint: де́вушка
        accept: ["де́вушек"]
      - stem: Мы должны́ написа́ть два́дцать одно́ ___.
        hint: сочине́ние
        accept: ["сочине́ние"]
      - stem: Де́вушки подписа́ли семь ___.
        hint: откры́тка
        accept: ["откры́ток"]
      - stem: В гру́ппе три ___ из Вьетна́ма.
        hint: студе́нт
        accept: ["студе́нта"]
      - stem: Э́та ру́чка сто́ит три́дцать два ___.
        hint: рубль
        accept: ["рубля́"]

  - id: e2
    type: choice
    task: 选择正确的数词形式。
    why: "[оди́н, одна́, одно́]{.ru} 和 [два, две]{.ru} 要和名词的性一致：[неде́ля, де́вушка]{.ru} 是阴性，[сочине́ние, письмо́]{.ru} 是中性，[год, студе́нт]{.ru} 是阳性。中性和阳性一样用 [два]{.ru}（第 5 题），只有阴性用 [две]{.ru}。"
    items:
      - stem: ___ неде́ля
        options: ["оди́н", "одна́", "одно́"]
        answer: "одна́"
      - stem: два́дцать ___ сочине́ние
        options: ["оди́н", "одна́", "одно́"]
        answer: "одно́"
      - stem: ___ де́вушки
        options: ["два", "две"]
        answer: "две"
      - stem: ___ студе́нта
        options: ["два", "две"]
        answer: "два"
      - stem: ___ письма́
        options: ["два", "две"]
        answer: "два"
      - stem: со́рок ___ год
        options: ["оди́н", "одна́", "одно́"]
        answer: "оди́н"

  - id: e3
    type: rewrite
    task: 按例句回答：他（她）多大了？
    example:
      cue: Ско́лько лет Ю́ми? (18)
      answer: Ю́ми восемна́дцать лет.
    why: "说年龄时人用第三格，后面是数词加 [год, го́да, лет]{.ru}：以 [оди́н]{.ru} 结尾用 [год]{.ru}，以 [два, три, четы́ре]{.ru} 结尾用 [го́да]{.ru}，其他用 [лет]{.ru}。[оди́ннадцать]{.ru}—[девятна́дцать]{.ru}（第 3 题 [девятна́дцать]{.ru}、第 4 题 [четы́рнадцать]{.ru}）后面总是 [лет]{.ru}。[Хосе́]{.ru} 不变格，[Ива́н Серге́евич]{.ru} 的名字和父称都要变成第三格。"
    items:
      - cue: Ско́лько лет Пье́ру? (21)
        accept: ["Пье́ру два́дцать оди́н год."]
      - cue: Ско́лько лет Хосе́? (24)
        accept: ["Хосе́ два́дцать четы́ре го́да."]
      - cue: Ско́лько лет А́нне? (19)
        accept: ["А́нне девятна́дцать лет."]
      - cue: Ско́лько лет Ми́ше? (14)
        accept: ["Ми́ше четы́рнадцать лет."]
      - cue: Ско́лько лет Ива́ну Серге́евичу? (49)
        accept: ["Ива́ну Серге́евичу со́рок де́вять лет."]
      - cue: Ско́лько лет ба́бушке? (75)
        accept: ["Ба́бушке се́мьдесят пять лет."]

  - id: e4
    type: translate
    task: 译成俄语。
    why: "第 1 题 [двена́дцать, семь, пять]{.ru} 后都用复数第二格，[па́рней]{.ru} 来自 [па́рень]{.ru}。第 2 题以 [оди́н]{.ru} 结尾，用 [год]{.ru}。第 3 题说人数用 [нас бы́ло пятна́дцать]{.ru}，或者用 [челове́к]{.ru}。第 5 题价钱以 [четы́ре]{.ru} 结尾，用 [рубля́]{.ru}。"
    items:
      - zh: 我们班有十二个学生：七个男生和五个女生。
        accept: ["В на́шей гру́ппе двена́дцать студе́нтов: семь па́рней и пять де́вушек.", "У нас в гру́ппе двена́дцать студе́нтов: семь па́рней и пять де́вушек.", "В на́шей гру́ппе двена́дцать студе́нтов: семь студе́нтов и пять студе́нток.", "У нас в гру́ппе двена́дцать студе́нтов: семь студе́нтов и пять студе́нток.", "В на́шей гру́ппе двена́дцать челове́к: семь па́рней и пять де́вушек.", "У нас в гру́ппе двена́дцать челове́к: семь па́рней и пять де́вушек."]
        rubric: ["[двена́дцать студе́нтов]{.ru}（或 [челове́к]{.ru}）", "[семь па́рней / студе́нтов]{.ru}、[пять де́вушек / студе́нток]{.ru}：复数第二格"]
      - zh: 皮埃尔二十一岁。
        accept: ["Пье́ру два́дцать оди́н год."]
        rubric: ["人用第三格 [Пье́ру]{.ru}", "[два́дцать оди́н год]{.ru}：单数第一格"]
      - zh: 第一学期我们班有十五个人。
        accept: ["В пе́рвом семе́стре нас бы́ло пятна́дцать.", "В пе́рвом семе́стре в на́шей гру́ппе бы́ло пятна́дцать челове́к.", "В пе́рвом семе́стре у нас в гру́ппе бы́ло пятна́дцать челове́к.", "В пе́рвом семе́стре в на́шей гру́ппе бы́ло пятна́дцать студе́нтов.", "В пе́рвом семе́стре у нас в гру́ппе бы́ло пятна́дцать студе́нтов."]
        rubric: ["[нас бы́ло пятна́дцать]{.ru} 或 [бы́ло пятна́дцать челове́к / студе́нтов]{.ru}", "动词用中性 [бы́ло]{.ru}"]
      - zh: 我们一星期有十六节课。
        accept: ["У нас шестна́дцать пар в неде́лю.", "В неде́лю у нас шестна́дцать пар.", "У нас в неде́лю шестна́дцать пар."]
        rubric: ["[шестна́дцать пар]{.ru}：零词尾", "[в неде́лю]{.ru}"]
      - zh: 这本词典三百二十四卢布。
        accept: ["Э́тот слова́рь сто́ит три́ста два́дцать четы́ре рубля́."]
        rubric: ["[сто́ить]{.ru}", "以 [четы́ре]{.ru} 结尾，用单数第二格 [рубля́]{.ru}"]

  - id: e5
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Ско́лько студе́нтов в гру́ппе Ван Лэ́я? Отку́да они́? Ско́лько им лет? Ско́лько языко́в в гру́ппе и како́й язы́к о́бщий? Что сде́лали де́вушки в переры́ве и почему́?]{.ru}"
        length: 50–80
        model: "В гру́ппе Ван Лэ́я двена́дцать студе́нтов: семь па́рней и пять де́вушек. Три студе́нта из Кита́я, три из Коре́и, три из Вьетна́ма, а ещё в гру́ппе есть францу́з, япо́нка и студе́нт с Ку́бы. Ю́ми восемна́дцать лет, Пье́ру два́дцать оди́н год, Хосе́ два́дцать четы́ре го́да, а Ван Лэ́ю два́дцать лет. В гру́ппе шесть языко́в, но о́бщий язы́к оди́н — ру́сский. В переры́ве де́вушки да́ли ка́ждому па́рню откры́тку и шокола́дку, потому́ что за́втра День защи́тника Оте́чества."
        rubric: ["回答全部五个问题", "数词后名词的形式用对：[двена́дцать студе́нтов, три студе́нта, два́дцать оди́н год, два́дцать четы́ре го́да, шесть языко́в]{.ru}", "年龄句里人用第三格"]
        notes: "范文约 75 词。第二句列举国籍时，用 [есть]{.ru} 引出另外三个人，避免重复 [оди́н]{.ru}。年龄一句并列四个人，注意 [год, го́да, лет]{.ru} 随数词的最后一个词变化。最后用 [потому́ что]{.ru} 说明原因。"
