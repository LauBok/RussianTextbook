lesson: B3-L01
grammar: "主动形动词现在时：未完成体动词复数第三人称去 [-т]{.ru}，加 [-щ-]{.ru} 和词尾 [-ий]{.ru}（[чита́ют → чита́ющий]{.ru}，[говоря́т → говоря́щий]{.ru}）；[-ся]{.ru} 动词一律加 [-ся]{.ru}；与第一格 [кото́рый]{.ru} 从句的互换。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[Где родился Ломоносов и чем занимался его отец? Как Ломоносов попал в Москву? Почему ему было трудно учиться в академии? Чем он занимался, когда вернулся из Германии? Какую роль он сыграл в истории Московского университета?]{.ru}"
        length: 70–100
        model: "Ломоносов родился в 1711 году недалеко от Холмогор, на берегу Северной Двины. Его отец был богатым помором: он занимался рыбной ловлей и морской торговлей. В декабре 1730 года Михаил тайно ушёл из дома, догнал рыбный обоз и вместе с ним пришёл в Москву. В академии ему было трудно: он был намного старше других учеников, а денег у него почти не было. Когда он вернулся из Германии, он стал профессором химии, открыл первую в России химическую лабораторию, писал стихи и создавал мозаики. Ломоносов предложил открыть университет в Москве, и в 1755 году императрица подписала указ о его основании."
        rubric: ["五个问题都回答，年份、地名准确", "[заниматься чем]{.ru} 支配正确", "用完整的句子"]
        notes: "第 3 题要答出两个原因：年龄大、钱少。第 5 题课文没有直接说“罗蒙诺索夫起了什么作用”，要自己概括：他提出建议，舒瓦洛夫支持，女皇签署命令。[указ о его основании]{.ru} 中 [его]{.ru} 指大学，物主代词不变格。"

  - id: e2
    type: fill
    task: 用括号里动词的主动形动词现在时填空，注意性、数、格。
    why: "先写出动词的复数第三人称，再换后缀：[-ут/-ют]{.ru} → [-ущ-/-ющ-]{.ru}，[-ат/-ят]{.ru} → [-ащ-/-ящ-]{.ru}；然后按被说明的名词定词尾。第 1 题 [мечтают → мечтающ-]{.ru}，[молодых людей]{.ru} 复数第二格 → [мечтающих]{.ru}。第 2 题 [занимаются → занимающ-ся]{.ru}，[людей]{.ru} 复数第四格（动物名词同第二格）→ [занимающихся]{.ru}，[-ся]{.ru} 不变 [-сь]{.ru}。第 3 题 [стоят]{.ru} 是第二变位，后缀 [-ящ-]{.ru}，[памятнику]{.ru} 阳性第三格 → [стоящему]{.ru}。第 4 题 [живут → живущ-]{.ru}，[девушка]{.ru} 阴性第一格 → [живущая]{.ru}。第 5 题 [пишут → пишущ-]{.ru}，[о студентах]{.ru} 复数第六格 → [пишущих]{.ru}。第 6 题 [объясняют → объясняющ-]{.ru}，[по учебнику]{.ru} 阳性第三格 → [объясняющему]{.ru}。"
    items:
      - stem: Тысячи молодых людей, ___ учиться в МГУ, приходят на Воробьёвы горы.
        hint: мечтать
        accept: ["мечтающих"]
      - stem: Я знаю людей, ___ рыбной ловлей.
        hint: заниматься
        accept: ["занимающихся"]
      - stem: Мы подошли к памятнику, ___ перед главным зданием.
        hint: стоять
        accept: ["стоящему"]
      - stem: Девушка, ___ в соседней комнате, учится на химическом факультете.
        hint: жить
        accept: ["живущая"]
      - stem: Преподаватель рассказал о студентах, ___ стихи.
        hint: писать
        accept: ["пишущих"]
      - stem: Он долго учился по учебнику, ___ правила русской грамматики.
        hint: объяснять
        accept: ["объясняющему"]

  - id: e3
    type: rewrite
    task: 把 [который]{.ru} 从句改成主动形动词短语。
    example:
      cue: Люди, которые живут на берегах Белого моря, — поморы.
      answer: Люди, живущие на берегах Белого моря, — поморы.
    why: "只有第一格的 [который]{.ru}（它是从句的主语）才能换成主动形动词：去掉 [который]{.ru}，把从句的现在时动词换成形动词，性、数、格和被说明的名词一致，其余部分不变。第 1 题 [студенты]{.ru} 复数第一格 → [проходящие]{.ru}。第 2 题 [о девушке]{.ru} 阴性第六格 → [изучающей]{.ru}。第 3 题 [учёным]{.ru} 复数第三格 → [занимающимся]{.ru}，保留 [-ся]{.ru}。第 4 题 [смотреть]{.ru} 第二变位，[смотрят → смотрящих]{.ru}，和 [детей]{.ru} 一样是复数第四格。"
    items:
      - cue: Студенты, которые проходят мимо памятника, знают его историю.
        accept: ["Студенты, проходящие мимо памятника, знают его историю.", "Проходящие мимо памятника студенты знают его историю."]
      - cue: Мы говорили о девушке, которая изучает химию.
        accept: ["Мы говорили о девушке, изучающей химию."]
      - cue: Музей помогает учёным, которые занимаются историей России.
        accept: ["Музей помогает учёным, занимающимся историей России."]
      - cue: Я видел детей, которые смотрят на северное сияние.
        accept: ["Я видел детей, смотрящих на северное сияние."]

  - id: e4
    type: choice
    task: 选择正确的形式。
    why: "第 1 题 [говорить]{.ru} 是第二变位（[говорят]{.ru}），形动词是 [говорящий]{.ru}；[говорющие]{.ru} 是把它当成了第一变位；[говорящих]{.ru} 后缀对了，但 [студенты]{.ru} 是第一格，形动词也要用第一格。第 2 题“正在读书的人”，现在时形动词只能由未完成体构成，[прочитать]{.ru} 是完成体，没有 [прочитающие]{.ru}；[читающих]{.ru} 格不对，[люди]{.ru} 是第一格。第 3 题 [сестра]{.ru} 是阴性单数第一格，形动词用 [занимающаяся]{.ru}；[занимающейся]{.ru} 是阴性间接格，[занимающиеся]{.ru} 是复数。[-ся]{.ru} 动词的形动词后面永远是 [-ся]{.ru}，不变成 [-сь]{.ru}。第 4 题被说明的名词 [юношей]{.ru} 是复数第五格（[с]{.ru} + 第五格），形动词也要用第五格 [мечтающими]{.ru}。"
    items:
      - stem: Студенты, ___ по-русски, легко поймут эту книгу.
        options: [говорющие, говорящие, говорящих]
        answer: говорящие
      - stem: В библиотеке сидели люди, ___ газеты.
        options: [читающие, прочитающие, читающих]
        answer: читающие
      - stem: Сестра, ___ физикой, хочет поступить в университет.
        options: [занимающейся, занимающаяся, занимающиеся]
        answer: занимающаяся
      - stem: Он познакомился с юношами, ___ о море.
        options: [мечтающие, мечтающих, мечтающими]
        answer: мечтающими

  - id: e5
    type: translate
    task: 翻译下列句子，用主动形动词现在时。
    items:
      - zh: 在白海沿岸住着以捕鱼为生的人。
        accept: ["На берегах Белого моря живут люди, занимающиеся рыбной ловлей.", "На берегу Белого моря живут люди, занимающиеся рыбной ловлей.", "На берегах Белого моря живут люди, которые занимаются рыбной ловлей.", "На берегу Белого моря живут люди, которые занимаются рыбной ловлей."]
        rubric: ["[занимающиеся рыбной ловлей]{.ru}：复数第一格，与 [люди]{.ru} 一致；[-ся]{.ru} 保留", "[заниматься]{.ru} 接第五格 [рыбной ловлей]{.ru}"]
      - zh: 研究罗蒙诺索夫生平的学者们称他为第一位俄罗斯学者。
        accept: ["Учёные, изучающие жизнь Ломоносова, называют его первым русским учёным.", "Изучающие жизнь Ломоносова учёные называют его первым русским учёным.", "Учёные, которые изучают жизнь Ломоносова, называют его первым русским учёным."]
        rubric: ["[изучающие жизнь Ломоносова]{.ru}：形动词复数第一格，补语用第四格", "[называть кого кем]{.ru}：[называют его первым русским учёным]{.ru}，第五格"]
      - zh: 我们走近了站在大楼前面的学生们。
        accept: ["Мы подошли к студентам, стоящим перед зданием.", "Мы подошли к стоящим перед зданием студентам.", "Мы подошли к студентам, которые стоят перед зданием."]
        rubric: ["[подойти к кому]{.ru}：第三格 [к студентам]{.ru}", "[стоящим]{.ru}：第二变位后缀 [-ящ-]{.ru}，复数第三格与 [студентам]{.ru} 一致"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：出身和童年；去莫斯科；在学院的学习；在德国学习和回国后的科学工作；创建莫斯科大学。每项一到两句，保留关键年份，至少用两处主动形动词现在时。
        length: 120–150
        model: "Михаил Ломоносов родился в 1711 году в северной деревне, в семье помора. Поморы — это люди, занимающиеся рыбной ловлей и морской торговлей. С детства Михаил ходил с отцом в море и много читал. В 1730 году девятнадцатилетний юноша тайно ушёл из дома и с рыбным обозом пришёл в Москву. Он поступил в Славяно-греко-латинскую академию, хотя туда не принимали детей крестьян. Жить было трудно: студент получал всего три копейки в день. Но Ломоносов не бросил учёбу и в 1736 году поехал учиться в Германию. Когда он вернулся в Россию, он стал первым русским профессором Петербургской академии наук. Он занимался химией и физикой, писал стихи и создавал мозаики. В 1755 году по его плану открыли Московский университет, который сегодня носит его имя. Студенты, изучающие историю университета, хорошо знают этого человека."
        rubric: ["提纲五项都有，顺序与课文一致", "年份准确：1711、1730、1736、1755", "至少两处主动形动词现在时，形式正确、与名词一致", "120–150 词"]
        notes: "范文约 125 词。每个阶段只留一两句，省去了引语、同学的嘲笑等细节。用了两个本课的形动词短语：[занимающиеся рыбной ловлей]{.ru}、[изучающие историю университета]{.ru}。[открыли]{.ru} 是不定人称句，不必说出是谁开办的。缩写时常用 [С детства]{.ru}、[По его плану]{.ru} 这样的短语概括较长的叙述。"
