lesson: L48
grammar: 月份名称及 [в]{.ru} + 第六格（[в ма́е, в январе́]{.ru}）；序数词 [пе́рвый, второ́й, тре́тий, четвёртый, восьмо́й]{.ru} 及其性、数、格的变化；复合序数词。
exercises:

  - id: e1
    type: fill
    task: 用 [в]{.ru} + 第六格回答“在几月”。
    placeholder: в …
    why: 月份都是阳性，第六格词尾 [-е]{.ru}。[янва́рь, февра́ль, сентя́брь, октя́брь, ноя́брь, дека́брь]{.ru} 去掉 [-ь]{.ru} 加 [-е]{.ru}，重音移到词尾；[май]{.ru} 去掉 [-й]{.ru} 加 [-е]{.ru}，写成 [в ма́е]{.ru}。
    items:
      - stem: — Когда́ у А́нны день рожде́ния? — ___ (ию́ль)
        accept: [в ию́ле]
      - stem: — Когда́ у па́пы день рожде́ния? — ___ (март)
        accept: [в ма́рте]
      - stem: — Когда́ у ма́мы день рожде́ния? — ___ (дека́брь)
        accept: [в декабре́]
      - stem: — Когда́ у тебя́ день рожде́ния? — ___ (май)
        accept: [в ма́е]
      - stem: — Когда́ у ба́бушки день рожде́ния? — ___ (ноя́брь)
        accept: [в ноябре́]
      - stem: — Когда́ начина́ются уро́ки в шко́ле? — ___ (сентя́брь)
        accept: [в сентябре́]

  - id: e2
    type: fill
    task: 写出序数词的正确形式。
    why: 序数词和形容词一样，要跟名词的性、数、格一致。第 1 题 [кни́га]{.ru} 阴性；第 2 题 [письмо́]{.ru} 中性；第 3 题是阴性第四格，[тре́тий]{.ru} 的阴性第四格是 [тре́тью]{.ru}，不是 [тре́тую]{.ru}；第 4 题是第六格，[восьмо́й]{.ru} 词尾重读，第六格 [восьмо́м]{.ru}；第 5 题 [кусо́к]{.ru} 阳性，[четвёртый]{.ru} 里的 [ё]{.ru} 不能丢；第 6 题复合序数词只变最后一个词。
    items:
      - stem: Э́то моя́ ___ кни́га. (1)
        accept: [пе́рвая]
      - stem: Э́то её ___ письмо́ домо́й. (2)
        accept: [второ́е]
      - stem: Ми́ша чита́ет ___ кни́гу. (3)
        accept: [тре́тью]
      - stem: Ми́ша у́чится в ___ кла́ссе. (8)
        accept: [восьмо́м]
      - stem: Ми́ша, э́то уже́ ___ кусо́к! (4)
        accept: [четвёртый]
      - stem: Э́то бу́дет мой ___ день рожде́ния. (21)
        accept: [два́дцать пе́рвый]

  - id: e3
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：米沙读八年级；聚会星期六三点开始；安娜的生日在七月；王磊的生日在五月；米沙想要一个新的电脑游戏。
    items:
      - stem: Ми́ша у́чится в ___ кла́ссе.
        options: [четвёртом, восьмо́м]
        answer: восьмо́м
      - stem: Пра́здник у Ми́ши начнётся в суббо́ту ___.
        options: [в три часа́, в пять часо́в]
        answer: в три часа́
      - stem: У А́нны день рожде́ния ___.
        options: [в ию́не, в ию́ле]
        answer: в ию́ле
      - stem: "Ван Лэй: «У меня́ день рожде́ния ___.»"
        options: [в ма́е, в ма́рте]
        answer: в ма́е
      - stem: Ми́ша хо́чет в пода́рок ___.
        options: [но́вую кни́гу, но́вую компью́терную игру́]
        answer: но́вую компью́терную игру́

  - id: e4
    type: rewrite
    task: 按例句回答问题，序数词要和名词一致。
    placeholder: Э́то …
    example:
      cue: Како́й э́то уро́к? (2)
      answer: Э́то второ́й уро́к.
    why: 问句里的 [како́й, кака́я, како́е]{.ru} 已经告诉你名词的性，序数词用同样的词尾：阳性 [-ый / -о́й / -ий]{.ru}，阴性 [-ая]{.ru}，中性 [-ое]{.ru}。[тре́тий]{.ru} 的阴性、中性是 [тре́тья, тре́тье]{.ru}，词尾前有 [ь]{.ru}。
    items:
      - cue: Кака́я э́то неде́ля? (3)
        accept: ["Э́то тре́тья неде́ля."]
      - cue: Како́е э́то письмо́? (4)
        accept: ["Э́то четвёртое письмо́."]
      - cue: Кака́я э́то ко́мната? (1)
        accept: ["Э́то пе́рвая ко́мната."]
      - cue: Како́й э́то класс? (8)
        accept: ["Э́то восьмо́й класс."]
      - cue: Како́е э́то упражне́ние? (3)
        accept: ["Э́то тре́тье упражне́ние."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: “在几月”用 [в]{.ru} + 第六格；“八年级”“第一个月”要用序数词，序数词按形容词变格。
    items:
      - zh: ——你的生日在几月？——在十月。
        accept: ["— В како́м ме́сяце у тебя́ день рожде́ния? — В октябре́.", "— Когда́ у тебя́ день рожде́ния? — В октябре́.", "— В како́м ме́сяце твой день рожде́ния? — В октябре́.", "— Когда́ твой день рожде́ния? — В октябре́.", "— В како́м ме́сяце у тебя́ день рожде́ния? — У меня́ день рожде́ния в октябре́."]
        rubric: ["[в како́м ме́сяце]{.ru} 或 [когда́]{.ru}", "[в октябре́]{.ru}，重音在词尾"]
      - zh: 这是我在莫斯科的第一个月。
        accept: ["Э́то мой пе́рвый ме́сяц в Москве́."]
        rubric: ["[пе́рвый ме́сяц]{.ru}：[ме́сяц]{.ru} 阳性"]
      - zh: 米沙读八年级。
        accept: ["Ми́ша у́чится в восьмо́м кла́ссе."]
        rubric: ["[учи́ться в]{.ru} + 第六格", "[восьмо́м]{.ru}，词尾重读"]
      - zh: 米沙的生日在十一月，安娜的生日在七月。
        accept: ["У Ми́ши день рожде́ния в ноябре́, а у А́нны — в ию́ле.", "У Ми́ши день рожде́ния в ноябре́, а у А́нны в ию́ле.", "У Ми́ши день рожде́ния в ноябре́, а у А́нны день рожде́ния в ию́ле.", "У Ми́ши день рожде́ния в ноябре́, у А́нны — в ию́ле."]
        rubric: ["“某人的生日”用 [у кого́ день рожде́ния]{.ru}，[у]{.ru} + 第二格", "[в ноябре́, в ию́ле]{.ru}"]

  - id: e6
    type: open
    task: 写一写你家里人的生日分别在几月（40–60 词）。
    items:
      - prompt: 写出家里每个人（或几位朋友）的生日在几月，你自己的生日在几月，你打算怎样过下一个生日（第几个生日）。
        length: 40–60
        model: "У меня́ есть па́па и ма́ма. У па́пы день рожде́ния в а́вгусте, а у ма́мы — в феврале́. У ба́бушки день рожде́ния в ноябре́. А мой день рожде́ния в апре́ле. Э́то бу́дет мой два́дцать пе́рвый день рожде́ния. Друзья́ бу́дут у нас в суббо́ту. Ма́ма пригото́вит у́жин, а па́па ку́пит большо́й торт."
        rubric: ["每个月份都用 [в]{.ru} + 第六格，注意重音移动的六个月份", "至少一个序数词，与名词一致", "“某人的生日”用 [у кого́ день рожде́ния]{.ru}"]
        notes: 范文从家里人说起，统一用 [у кого́ день рожде́ния в …]{.ru} 的句式，第二次出现时用破折号省略重复的部分（[а у ма́мы — в феврале́]{.ru}）。最后用序数词 [два́дцать пе́рвый]{.ru} 和将来时写自己的打算。
