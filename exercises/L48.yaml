lesson: L48
grammar: 月份名称及 [в]{.ru} + 第六格（[в ма́е, в январе́]{.ru}）；序数词 1–31 的构成和性、数、格的变化。
exercises:

  - id: e1
    type: fill
    task: 用 [в]{.ru} + 第六格回答“在几月”。
    placeholder: в …
    why: 月份都是阳性，第六格词尾 [-е]{.ru}。[янва́рь, февра́ль, сентя́брь, октя́брь, ноя́брь, дека́брь]{.ru} 去掉 [-ь]{.ru} 加 [-е]{.ru}，重音移到词尾；[май]{.ru} 去掉 [-й]{.ru} 加 [-е]{.ru}，写成 [в ма́е]{.ru}。
    items:
      - stem: — Когда́ у А́нны день рожде́ния? — ___ (ию́ль)
        accept: [в ию́ле]
      - stem: — Когда́ у па́пы день рожде́ния? — ___ (март)
        accept: [в ма́рте]
      - stem: — Когда́ у ма́мы день рожде́ния? — ___ (дека́брь)
        accept: [в декабре́]
      - stem: — Когда́ у тебя́ день рожде́ния? — ___ (май)
        accept: [в ма́е]
      - stem: — Когда́ у ба́бушки день рожде́ния? — ___ (янва́рь)
        accept: [в январе́]
      - stem: — Когда́ начина́ются уро́ки в шко́ле? — ___ (сентя́брь)
        accept: [в сентябре́]

  - id: e2
    type: fill
    task: 写出序数词的正确形式。
    why: 序数词和形容词一样，要跟名词的性、数、格一致。第 1 题 [кни́га]{.ru} 阴性；第 2 题 [окно́]{.ru} 中性；第 3 题 [тре́тий]{.ru} 的阴性是 [тре́тья]{.ru}，不是 [тре́тая]{.ru}；第 4、5 题是第六格，[восьмо́й]{.ru} 词尾重读，第六格 [восьмо́м]{.ru}；第 6 题复合序数词只变最后一个词。
    items:
      - stem: Э́то моя́ ___ кни́га. (1)
        accept: [пе́рвая]
      - stem: Э́то ___ окно́. (2)
        accept: [второ́е]
      - stem: А́нна живёт в ___ ко́мнате. (3)
        accept: [тре́тьей]
      - stem: Ми́ша у́чится в ___ кла́ссе. (8)
        accept: [восьмо́м]
      - stem: Мы живём на ___ этаже́. (5)
        accept: [пя́том]
      - stem: Э́то бу́дет мой ___ день рожде́ния. (21)
        accept: [два́дцать пе́рвый]

  - id: e3
    type: choice
    task: 根据课文选择正确答案。
    why: 答案都在课文里：米沙读八年级；他满十五岁；朋友们星期六三点来；王磊的生日在五月。
    items:
      - stem: Ми́ша у́чится в ___ кла́ссе.
        options: [седьмо́м, восьмо́м]
        answer: восьмо́м
      - stem: Э́то бу́дет ___ день рожде́ния Ми́ши.
        options: [четы́рнадцатый, пятна́дцатый]
        answer: пятна́дцатый
      - stem: Друзья́ бу́дут у Ми́ши в суббо́ту ___.
        options: [в три часа́, в пять часо́в]
        answer: в три часа́
      - stem: "Ван Лэй: «У меня́ день рожде́ния ___.»"
        options: [в ма́е, в ию́ле]
        answer: в ма́е

  - id: e4
    type: rewrite
    task: 按例句回答，说说你们住在几楼。
    placeholder: Мы живём на …
    example:
      cue: Где вы живёте? (5)
      answer: Мы живём на пя́том этаже́.
    why: "“几楼”用 [на]{.ru} + 序数词第六格 + [этаже́]{.ru}。阳性序数词第六格词尾是 [-ом]{.ru}；[тре́тий]{.ru} 例外，第六格是 [тре́тьем]{.ru}。"
    items:
      - cue: Где вы живёте? (2)
        accept: ["Мы живём на второ́м этаже́."]
      - cue: Где вы живёте? (3)
        accept: ["Мы живём на тре́тьем этаже́."]
      - cue: Где вы живёте? (7)
        accept: ["Мы живём на седьмо́м этаже́."]
      - cue: Где вы живёте? (9)
        accept: ["Мы живём на девя́том этаже́."]

  - id: e5
    type: translate
    task: 译成俄语。
    why: “在几月”用 [в]{.ru} + 第六格；“五楼”“八年级”要用序数词，序数词按形容词变格。
    items:
      - zh: ——你的生日在几月？——在十月。
        accept: ["— В како́м ме́сяце у тебя́ день рожде́ния? — В октябре́.", "— Когда́ у тебя́ день рожде́ния? — В октябре́.", "— В како́м ме́сяце твой день рожде́ния? — В октябре́."]
        rubric: ["[в како́м ме́сяце]{.ru}", "[в октябре́]{.ru}，重音在词尾"]
      - zh: 彼得罗夫一家住在五层。
        accept: ["Петро́вы живу́т на пя́том этаже́."]
        rubric: ["[на пя́том этаже́]{.ru}，序数词第六格"]
      - zh: 米沙读八年级。
        accept: ["Ми́ша у́чится в восьмо́м кла́ссе."]
        rubric: ["[учи́ться в]{.ru} + 第六格", "[восьмо́м]{.ru}，词尾重读"]
      - zh: 这是我的第一个俄语老师。
        accept: ["Э́то мой пе́рвый преподава́тель ру́сского языка́.", "Э́то моя́ пе́рвая преподава́тельница ру́сского языка́.", "Э́то мой пе́рвый учи́тель ру́сского языка́.", "Э́то моя́ пе́рвая учи́тельница ру́сского языка́."]
        rubric: ["序数词与名词性一致：[пе́рвый]{.ru} / [пе́рвая]{.ru}", "“俄语的”用第二格 [ру́сского языка́]{.ru}"]

  - id: e6
    type: open
    task: 写一写你家里人的生日分别在几月（40–60 词）。
    items:
      - prompt: 写出家里每个人（或几位朋友）的生日在几月，你自己的生日在几月，你打算怎样过下一个生日（第几个生日）。
        length: 40–60
        model: "У меня́ есть па́па и ма́ма. У па́пы день рожде́ния в а́вгусте, а у ма́мы — в феврале́. У ба́бушки день рожде́ния в ноябре́. А мой день рожде́ния в апре́ле. Э́то бу́дет мой два́дцать пе́рвый день рожде́ния. Друзья́ бу́дут у нас в суббо́ту. Ма́ма пригото́вит у́жин, а па́па ку́пит большо́й торт."
        rubric: ["每个月份都用 [в]{.ru} + 第六格，注意重音移动的六个月份", "至少一个序数词，与名词一致", "“某人的生日”用 [у кого́ день рожде́ния]{.ru}"]
        notes: 范文从家里人说起，统一用 [у кого́ день рожде́ния в …]{.ru} 的句式，第二次出现时用破折号省略重复的部分（[а у ма́мы — в феврале́]{.ru}）。最后用序数词 [два́дцать пе́рвый]{.ru} 和将来时写自己的打算。
