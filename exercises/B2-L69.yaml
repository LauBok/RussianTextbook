lesson: B2-L69
grammar: "动名词：[-ние]{.ru}（[-ание, -ение]{.ru}）、[-тие]{.ru} 的构成；动词的第四格补语和动作主体在动名词后变成第二格，其他支配不变；动名词多用于书面语。"
exercises:

  - id: e1
    type: fill
    task: 用括号里的动词构成动名词，按句子要求的格填空。
    why: "[-ать, -ять]{.ru} 动词多用 [-ание, -яние]{.ru}（[жела́ть → жела́ние]{.ru}，[понима́ть → понима́ние]{.ru}）；[-ить]{.ru} 动词用 [-ение]{.ru}，辅音交替同第一人称单数（[пригласи́ть → приглашу́ → приглаше́ние]{.ru}）；单音节词根的 [-ыть]{.ru} 动词用 [-тие]{.ru}（[откры́ть → откры́тие]{.ru}）。第 1 题 [чита́ть → чте́ние]{.ru} 是特殊形式。第 5 题 [для]{.ru} 要求第二格：[понима́ния]{.ru}。其余各题是第一格或第四格，中性名词两格同形。注意动名词后面的补语都用第二格：[стихо́в, пра́вила, грамма́тики, те́кста]{.ru}。"
    items:
      - stem: "Я о́чень люблю́ ___ стихо́в."
        hint: чита́ть
        accept: ["чте́ние"]
      - stem: "Спаси́бо за ___ пра́вила!"
        hint: объясни́ть
        accept: ["объясне́ние"]
      - stem: "Пе́ред экза́меном у нас бу́дет ___ грамма́тики."
        hint: повтори́ть
        accept: ["повторе́ние"]
      - stem: "Ско́ро бу́дет ___ но́вого магази́на."
        hint: откры́ть
        accept: ["откры́тие"]
      - stem: "Для ___ те́кста ну́жно знать слова́."
        hint: понима́ть
        accept: ["понима́ния"]
      - stem: "Я получи́л ___ на пра́здник."
        hint: пригласи́ть
        accept: ["приглаше́ние"]
      - stem: "Тепе́рь у меня́ одно́ ___ — верну́ться в Москву́."
        hint: жела́ть
        accept: ["жела́ние"]

  - id: e2
    type: choice
    task: 选择正确的形式。
    why: "第 1 题动词 [изуча́ть]{.ru} 的第四格补语在动名词后变成第二格 [ру́сского языка́]{.ru}。第 2 题 [обще́ние]{.ru} 保留 [с]{.ru} + 第五格。第 3 题动作的主体（谁发言）用第二格 [Ван Лэ́я]{.ru}。第 4 题 [са́мое тру́дное]{.ru} 是名词化的中性形容词，意思是“最难的事”，不跟 [произноше́ние]{.ru} 的性一致：说 [Для меня́ грамма́тика — са́мое тру́дное]{.ru} 也用中性。第 5 题 [при́нял]{.ru} 后面的补语用第四格；[реше́ние]{.ru} 是中性，第四格同第一格。"
    items:
      - stem: "Изуче́ние ___ — моё люби́мое заня́тие."
        options: [ру́сского языка́, ру́сский язы́к, ру́сским языко́м]
        answer: ру́сского языка́
      - stem: "Мне о́чень помога́ет обще́ние ___."
        options: [с ру́сской семьёй, ру́сской семьи́, ру́сскую семью́]
        answer: с ру́сской семьёй
      - stem: "Выступле́ние ___ всем понра́вилось."
        options: [Ван Лэ́я, Ван Лэ́ю, Ван Лэ́ем]
        answer: Ван Лэ́я
      - stem: "Для меня́ произноше́ние — са́мое ___."
        options: [тру́дное, тру́дный, тру́дная]
        answer: тру́дное
      - stem: "Он при́нял ___: он бу́дет перево́дчиком."
        options: [реше́ние, реше́нием, реше́ния]
        answer: реше́ние

  - id: e3
    type: translate
    task: 译成俄语。
    why: "第 1 题“发音”用动名词 [произноше́ние]{.ru}，中性。第 2 题“发言”用 [выступле́ние]{.ru}，“她的”用 [её]{.ru}；“喜欢”用 [понра́виться]{.ru}，人用第三格。第 3 题“作出决定”是固定搭配 [приня́ть реше́ние]{.ru}，女性说话人用 [приняла́]{.ru}。第 4 题“为……感谢”用 [за]{.ru} + 第四格。"
    items:
      - zh: 对我来说，发音最难。
        accept: ["Для меня́ произноше́ние — са́мое тру́дное.", "Для меня́ са́мое тру́дное — произноше́ние.", "Са́мое тру́дное для меня́ — произноше́ние.", "Произноше́ние для меня́ — са́мое тру́дное."]
        rubric: ["[произноше́ние]{.ru}", "“最难”用 [са́мое тру́дное]{.ru}", "“对我来说”用 [для меня́]{.ru}"]
      - zh: 大家都很喜欢她的发言。
        accept: ["Её выступле́ние всем о́чень понра́вилось.", "Всем о́чень понра́вилось её выступле́ние.", "Её выступле́ние о́чень понра́вилось всем."]
        rubric: ["[выступле́ние]{.ru} 作主语", "[понра́вилось]{.ru} 用中性，和 [выступле́ние]{.ru} 一致", "喜欢的人用第三格 [всем]{.ru}"]
      - zh: 我作出了决定：我要当翻译。
        accept: ["Я при́нял реше́ние: я бу́ду перево́дчиком.", "Я приняла́ реше́ние: я бу́ду перево́дчиком.", "Я при́нял реше́ние: я бу́ду перево́дчицей.", "Я приняла́ реше́ние: я бу́ду перево́дчицей.", "Я при́нял реше́ние стать перево́дчиком.", "Я приняла́ реше́ние стать перево́дчицей.", "Я приняла́ реше́ние стать перево́дчиком."]
        rubric: ["[приня́ть реше́ние]{.ru}", "[бу́ду]{.ru} 后面职业用第五格 [перево́дчиком]{.ru}"]
      - zh: 谢谢你的邀请！
        accept: ["Спаси́бо за приглаше́ние!", "Спаси́бо тебе́ за приглаше́ние!", "Спаси́бо вам за приглаше́ние!"]
        rubric: ["[спаси́бо за]{.ru} + 第四格 [приглаше́ние]{.ru}"]

  - id: e4
    type: open
    task: 缩写。按下列问题回答，连成一段。
    items:
      - prompt: "[Что попроси́ла сде́лать О́льга Ви́кторовна? Что бы́ло са́мым тру́дным для Ван Лэ́я и что ему́ помога́ло? Что случи́лось шесто́го ию́ня? Како́е реше́ние при́нял Ван Лэй? Что сказа́ла А́нна о его́ статье́?]{.ru}"
        length: 70–100
        model: "О́льга Ви́кторовна попроси́ла иностра́нных студе́нтов написа́ть статью́ об изуче́нии ру́сского языка́. Ван Лэй написа́л, что са́мым тру́дным для него́ бы́ло произноше́ние. Ему́ помога́ли ра́дио, чте́ние и обще́ние с ру́сской семьёй. В статье́ есть и смешно́й слу́чай: одна́жды он сказа́л Мари́и Никола́евне «вы о́чень вку́сная». Шесто́го ию́ня, в День ру́сского языка́, он чита́л у па́мятника Пу́шкину стихотворе́ние «Зи́мнее у́тро». От волне́ния он забы́л втору́ю строку́, но лю́ди вокру́г ста́ли чита́ть вме́сте с ним. Ван Лэй при́нял реше́ние стать перево́дчиком. А́нна сказа́ла, что статья́ неплоха́я, но в ней сли́шком мно́го слов на «-ние»."
        rubric: ["回答全部五个问题", "至少用四个动名词，支配正确（[об изуче́нии]{.ru}、[обще́ние с]{.ru} 等）", "第一人称的文章改成第三人称转述"]
        notes: 范文约 100 词。王磊的文章是第一人称，缩写时改成第三人称：[я до́лго не мог…]{.ru} 写成 [Ван Лэй написа́л, что…]{.ru}。[статью́ об изуче́нии ру́сского языка́]{.ru}：动名词在 [о]{.ru} 后用第六格 [изуче́нии]{.ru}，[о]{.ru} 在元音前变成 [об]{.ru}。

  - id: e5
    type: open
    task: 作文：我学俄语的经历。
    items:
      - prompt: 写一篇短文，题目是“我学俄语”。写什么时候开始学、什么最难、什么对你有帮助、以后有什么打算。因为是“文章”，可以多用动名词：至少用五个，如 [изуче́ние, произноше́ние, чте́ние, обще́ние, повторе́ние, упражне́ние, жела́ние, реше́ние]{.ru}。
        length: 100–150
        model: "Изуче́ние ру́сского языка́ я на́чал два го́да наза́д в университе́те. Снача́ла всё бы́ло тру́дно: бу́квы, произноше́ние, грамма́тика. Мне каза́лось, что в ру́сском языке́ сли́шком мно́го оконча́ний.\nОсо́бенно мне помога́ло чте́ние. Снача́ла я чита́л коро́ткие ска́зки, а пото́м — расска́зы Че́хова. Ка́ждый день я де́лал упражне́ния и слу́шал ра́дио. Ещё мне о́чень помога́ет обще́ние с ру́сскими друзья́ми. Мы пи́шем друг дру́гу в интерне́те, а иногда́ ви́дим друг дру́га по ви́део.\nПо́сле ка́ждого уро́ка я обяза́тельно повторя́ю но́вые слова́: без повторе́ния я их бы́стро забыва́ю.\nТепе́рь у меня́ большо́е жела́ние — пое́хать в Москву́ в ле́тнюю шко́лу и посмотре́ть, как живу́т ру́сские. А по́сле университе́та я хочу́ рабо́тать перево́дчиком."
        rubric: ["说清开始时间、困难、帮助、打算", "至少五个动名词，支配和格正确", "100–150 词，分段清楚"]
        notes: 范文按“开始—困难—方法—打算”的顺序写。动名词用得比口语多，适合文章：[изуче́ние ру́сского языка́]{.ru}（第二格补语）、[обще́ние с друзья́ми]{.ru}（保留 [с]{.ru} + 第五格）、[без повторе́ния]{.ru}（前置词后变格）。

  - id: e6
    type: open
    task: 写一封信。
    items:
      - prompt: 假设你是王磊。7 月 10 日给在喀山的语伴迪马写一封短信：说说你给系报写的文章、俄语日那天发生的事，请他帮你看看文章里的错误。注意书信的格式。
        length: 80–120
        model: |
          10 ию́ля

          Приве́т, Ди́ма!

          Как ты? Как Све́та?

          О́льга Ви́кторовна попроси́ла нас написа́ть статью́ для газе́ты факульте́та. Те́ма — «Изуче́ние ру́сского языка́: мой год в Москве́». Я написа́л, что снача́ла мне бы́ло о́чень тру́дно и что са́мым тру́дным бы́ло произноше́ние. А ещё я написа́л про День ру́сского языка́. По́мнишь, я тебе́ расска́зывал? От волне́ния я забы́л втору́ю строку́ «Зи́мнего у́тра»!

          А́нна сказа́ла, что статья́ неплоха́я, но в ней сли́шком мно́го слов на «-ние». Посмотри́, пожа́луйста, есть ли там оши́бки. Ведь ты мой лу́чший учи́тель!

          Статью́ я пришлю́ тебе́ сего́дня ве́чером.

          Твой Ван Лэй
        rubric: ["日期、称呼、落款格式正确", "对朋友用 [ты]{.ru}", "讲清文章和俄语日的事，提出请求", "用上几个动名词和一处间接问句（[есть ли]{.ru}）"]
        notes: 范文第一段说文章，第二段提出请求。请求用 [Посмотри́, пожа́луйста, есть ли там оши́бки]{.ru}，[ли]{.ru} 引出间接问句。[«Зи́мнего у́тра»]{.ru}：作品名放在引号里也要变格。最后 [Ведь ты мой лу́чший учи́тель!]{.ru} 用 [ведь]{.ru} 说明为什么请他帮忙。
