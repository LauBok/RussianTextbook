lesson: B3-L08
grammar: "形容词化与名词化的形动词：[веду́щая балери́на]{.ru}、[бу́дущий]{.ru}、[бы́вший]{.ru}、[ра́неный]{.ru} 表示固定特征；[учёный]{.ru}、[уча́щиеся]{.ru}、[начина́ющие]{.ru}、[прису́тствующие]{.ru}、[отдыха́ющие]{.ru} 指一类人，按形容词变格。"
exercises:

  - id: e1
    type: open
    task: 理解问答。用完整的句子回答问题，尽量换用自己的句式，不要整句照抄课文。
    items:
      - prompt: "[В какой семье родилась Уланова? Кто были её педагоги? Какие роли стали её лучшими? Что произошло во время гастролей в Лондоне в 1956 году? В чём был секрет её искусства? Чем Уланова занималась после того, как ушла со сцены?]{.ru}"
        length: 70–110
        model: "Уланова родилась в Петербурге, в семье артистов балета Мариинского театра. Её первым педагогом была мать, а потом с ней занималась знаменитая Агриппина Ваганова. Лучшими её ролями стали Мария в «Бахчисарайском фонтане» и Джульетта в балете Прокофьева «Ромео и Джульетта». Во время гастролей в Лондоне спектакли с её участием имели огромный успех: присутствующие в зале долго не отпускали артистов, и после этого её имя узнал весь мир. Секрет её искусства был в огромном труде: даже когда она стала знаменитой, она каждый день занималась у балетного станка. Когда Уланова ушла со сцены, она ещё тридцать лет работала педагогом-репетитором в Большом театре."
        rubric: ["六个问题都回答，内容与课文一致", "至少用一个名词化的形动词", "用完整的句子"]
        notes: 第 4 题要说出两点：演出大获成功、从此世界闻名。范文用了名词化的形动词 [присутствующие]{.ru}。

  - id: e2
    type: choice
    task: 判断引号里的词是形动词、形容词化的形动词还是名词化的形动词。
    why: "第 1 题 [ведущая]{.ru} 带补语 [к театру]{.ru}，可以换成 [которая ведёт к театру]{.ru}，是形动词。第 2 题 [ведущей балериной]{.ru} 意思是“领衔的”，不能带补语，是形容词化的形动词。第 3 题 [начинающие]{.ru} 单独作主语，指“初学者”这一类人，是名词化的形动词。第 4 题 [начинающие свой путь в науке]{.ru} 有补语，修饰 [студенты]{.ru}，是形动词。第 5 题 [будущая]{.ru} 只能作形容词“未来的”，是形容词化的形动词。"
    items:
      - stem: "Мы шли по дороге, ведущей к театру. «Ведущей» — ___"
        options: [形动词, 形容词化的形动词, 名词化的形动词]
        answer: 形动词
      - stem: "В 1944 году Уланова стала ведущей балериной Большого театра. «Ведущей» — ___"
        options: [形动词, 形容词化的形动词, 名词化的形动词]
        answer: 形容词化的形动词
      - stem: "Начинающие мечтали попасть к ней в класс. «Начинающие» — ___"
        options: [形动词, 形容词化的形动词, 名词化的形动词]
        answer: 名词化的形动词
      - stem: "Студенты, начинающие свой путь в науке, вспоминают эти слова. «Начинающие» — ___"
        options: [形动词, 形容词化的形动词, 名词化的形动词]
        answer: 形动词
      - stem: "Будущая балерина росла за кулисами. «Будущая» — ___"
        options: [形动词, 形容词化的形动词, 名词化的形动词]
        answer: 形容词化的形动词

  - id: e3
    type: fill
    task: 用括号里名词化的形动词的适当形式填空。
    why: "名词化的形动词按形容词变格，数看所指的人。第 1 题 [с]{.ru} + 第五格复数 → [отдыхающими]{.ru}。第 2 题 [для]{.ru} + 第二格复数 → [учащихся]{.ru}，[-ся]{.ru} 保留。第 3 题 [показать кому]{.ru}，第三格复数 → [присутствующим]{.ru}。第 4 题 [один из]{.ru} + 第二格复数 → [учёных]{.ru}。第 5 题 [для всех]{.ru} + 第二格复数 → [желающих]{.ru}。"
    items:
      - stem: Экскурсовод долго разговаривал с ___.
        hint: отдыхающие
        accept: ["отдыхающими"]
      - stem: В училище открыли новую библиотеку для ___.
        hint: учащиеся
        accept: ["учащихся"]
      - stem: Перед спектаклем артистка показала ___ свой новый костюм.
        hint: присутствующие
        accept: ["присутствующим"]
      - stem: Он стал одним из ___, изучающих историю балета.
        hint: учёные
        accept: ["учёных"]
      - stem: Музей открыт для всех ___.
        hint: желающие
        accept: ["желающих"]

  - id: e4
    type: rewrite
    task: 用名词化的形动词替换括号里的词组。
    example:
      cue: (Люди, которые присутствовали в зале,) долго не отпускали артистов.
      answer: Присутствующие в зале долго не отпускали артистов.
    why: "“……的人”可以只用名词化的形动词，[люди]{.ru} 省去。时间要合适：说过去的场面，课文用的仍是 [присутствующие]{.ru}，这类词已经名词化，不强调时间。第 1 题 [которые отдыхают в парке]{.ru} → [отдыхающие в парке]{.ru}。第 2 题 [для людей, которые желают]{.ru}：[для]{.ru} 要第二格 → [для желающих]{.ru}。第 3 题 [те, кто учится]{.ru} → [учащиеся]{.ru}。第 4 题 [с людьми, которые начинают]{.ru}：[с]{.ru} 要第五格 → [с начинающими]{.ru}。"
    items:
      - cue: (Люди, которые отдыхают в парке,) останавливаются у памятника.
        accept: ["Отдыхающие в парке останавливаются у памятника."]
      - cue: (Для людей, которые желают) попасть в музей, билеты продают с утра.
        accept: ["Для желающих попасть в музей билеты продают с утра."]
      - cue: (Те, кто учится) в училище, ходят на репетиции.
        accept: ["Учащиеся училища ходят на репетиции.", "Учащиеся в училище ходят на репетиции."]
      - cue: Уланова любила работать (с теми, кто начинает).
        accept: ["Уланова любила работать с начинающими."]

  - id: e5
    type: translate
    task: 翻译下列句子，注意名词化和形容词化的形动词。
    items:
      - zh: 在场的人久久不让演员们离开。
        accept: ["Присутствующие долго не отпускали артистов.", "Присутствующие в зале долго не отпускали артистов.", "Присутствовавшие долго не отпускали артистов.", "Присутствовавшие в зале долго не отпускали артистов.", "Присутствующие долго не отпускали артистов со сцены.", "Присутствовавшие долго не отпускали артистов со сцены.", "Присутствующие долго не отпускали актёров.", "Присутствовавшие долго не отпускали актёров."]
        rubric: ["[присутствующие]{.ru} 单独作主语，不加 [люди]{.ru}", "[не отпускали]{.ru}：未完成体，表示持续的动作"]
      - zh: 研究芭蕾史的学者们称她为最伟大的芭蕾舞演员之一。
        accept: ["Учёные, изучающие историю балета, называют её одной из величайших балерин.", "Учёные, которые изучают историю балета, называют её одной из величайших балерин.", "Учёные, изучающие историю балета, называют её одной из самых великих балерин.", "Изучающие историю балета учёные называют её одной из величайших балерин."]
        rubric: ["[учёные]{.ru} 名词化的形动词作主语；[изучающие]{.ru} 是形动词", "[называть кого кем]{.ru}：[одной из величайших балерин]{.ru}，第五格 + 复数第二格"]
      - zh: 她成了大剧院的领衔芭蕾舞演员。
        accept: ["Она стала ведущей балериной Большого театра."]
        rubric: ["[стать кем]{.ru}：第五格 [ведущей балериной]{.ru}", "[ведущий]{.ru} 形容词化，意思是“领衔的”"]

  - id: e6
    type: open
    task: 段落缩写。把课文压缩成一段。
    items:
      - prompt: 提纲：童年和学习；在列宁格勒的成名角色；大剧院和伦敦巡演；当老师；纪念。每项一到两句，保留关键年份，至少用三个形容词化或名词化的形动词。
        length: 120–150
        model: "Галина Уланова родилась в 1910 году в Петербурге, в семье артистов балета. Будущая балерина росла за кулисами, а в 1919 году поступила в хореографическое училище, где с ней занималась Агриппина Ваганова. После училища она танцевала в бывшем Мариинском театре. Её лучшими ролями стали Мария в «Бахчисарайском фонтане» и Джульетта в балете Прокофьева. В 1944 году Уланова стала ведущей балериной Большого театра. Во время гастролей в Лондоне в 1956 году присутствующие в зале долго не отпускали артистов, и её имя узнал весь мир. В 1955 году вышел фильм-балет «Ромео и Джульетта», в котором она исполнила роль Джульетты. После того как Уланова ушла со сцены, она тридцать лет работала педагогом, и начинающие балерины мечтали попасть к ней в класс. При жизни ей поставили два памятника. Она умерла в 1998 году, и сегодня в её квартире в Москве работает музей. Учёные называют её одной из величайших балерин XX века."
        rubric: ["提纲五项都有，顺序与课文一致", "年份准确：1910、1919、1944、1956", "至少三个形容词化或名词化的形动词，变格正确", "120–150 词"]
        notes: "范文约 140 词。用了 [будущая]{.ru}、[бывшем]{.ru}、[ведущей]{.ru}（形容词化）和 [присутствующие]{.ru}、[учёные]{.ru}（名词化）。注意 [начинающие балерины]{.ru} 里 [начинающие]{.ru} 修饰名词，作用相当于形容词“初学的”。"

  - id: e7
    type: fill
    task: 用括号里的词的适当形式填空。
    why: "第 1 题 [исполнить роль]{.ru} 扮演角色，主语 [она]{.ru} 阴性，过去时 [исполнила]{.ru}。第 2 题 [стремиться к чему]{.ru}：[к совершенству]{.ru} 第三格。第 3 题 [быть требовательным к себе]{.ru}，主语阴性，课文用短尾 [требовательна]{.ru}；长尾第五格 [требовательной]{.ru} 也对。第 4 题 [за этой лёгкостью]{.ru}：[за]{.ru} 表示“在……后面”要第五格。第 5 题 [удостоить кого чего]{.ru}，被动短尾阴性 [удостоена]{.ru}，荣誉 [звания]{.ru} 用第二格。"
    items:
      - stem: В фильме-балете она ___ роль Джульетты.
        hint: исполнить
        accept: ["исполнила"]
      - stem: Всю жизнь Уланова стремилась к ___.
        hint: совершенство
        accept: ["совершенству"]
      - stem: Она была очень ___ к себе.
        hint: требовательный
        accept: ["требовательна", "требовательной"]
      - stem: За этой ___ стояли годы тяжёлой работы.
        hint: лёгкость
        accept: ["лёгкостью"]
      - stem: Уланова была дважды ___ звания Героя Социалистического Труда.
        hint: удостоить
        accept: ["удостоена"]
