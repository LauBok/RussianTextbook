heading: 第 26 课　喜好与愿望
groups:
- id: L26-01
  tags:
  - 第二变位：люби́ть 的 л 插入与重音移动
  - 不规则变位：хоте́ть
  task: 按主语写出 [люби́ть]{.ru} 和 [хоте́ть]{.ru} 的现在时。
  type: matrix
  cols:
  - 主语
  - '[люби́ть]{.ru}'
  - '[хоте́ть]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[люблю́]{.ru}'
    - '[хочу́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[лю́бишь]{.ru}'
    - '[хо́чешь]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[лю́бит]{.ru}'
    - '[хо́чет]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[лю́бим]{.ru}'
    - '[хоти́м]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[лю́бите]{.ru}'
    - '[хоти́те]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[лю́бят]{.ru}'
    - '[хотя́т]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[лю́бит]{.ru}'
    - '[хо́чет]{.ru}'
  - base: '[А́нна и Ка́тя]{.ru}'
    cells:
    - '[А́нна и Ка́тя]{.ru}'
    - '[лю́бят]{.ru}'
    - '[хотя́т]{.ru}'
  why: '第 1 题：[люби́ть]{.ru} 的 [я]{.ru} 形式插入 [л]{.ru}：[люблю́]{.ru}，重音在词尾；从 [ты]{.ru} 起重音在词干：[лю́бишь … лю́бят]{.ru}。[хоте́ть]{.ru} 单数 [т → ч]{.ru}：[хочу́]{.ru}。

    第 2、3、7 题：[хо́чешь, хо́чет]{.ru} 按第一变位，重音在词干。

    第 4–6、8 题：[хоте́ть]{.ru} 复数按第二变位，词干恢复 [т]{.ru}，重音在词尾：[хоти́м, хоти́те, хотя́т]{.ru}，不要写成 *[хо́чем]{.ru}。'
- id: L26-02
  tags:
  - 补语：名词第四格与不定式
  task: 组成句子：动词按主语变位；补语是名词的变第四格，是动词的保持不定式。
  type: matrix
  cols:
  - 主语 + 动词 + 补语
  - 句子
  rows:
  - base: '[я + люби́ть + му́зыка]{.ru}'
    cells:
    - '[я + люби́ть + му́зыка]{.ru}'
    - '[я люблю́ му́зыку]{.ru}'
  - base: '[Ми́ша + люби́ть + футбо́л]{.ru}'
    cells:
    - '[Ми́ша + люби́ть + футбо́л]{.ru}'
    - '[Ми́ша лю́бит футбо́л]{.ru}'
  - base: '[мы + люби́ть + чита́ть]{.ru}'
    cells:
    - '[мы + люби́ть + чита́ть]{.ru}'
    - '[мы лю́бим чита́ть]{.ru}'
  - base: '[ты + хоте́ть + чай]{.ru}'
    cells:
    - '[ты + хоте́ть + чай]{.ru}'
    - '[ты хо́чешь чай]{.ru}'
  - base: '[они́ + хоте́ть + гуля́ть]{.ru}'
    cells:
    - '[они́ + хоте́ть + гуля́ть]{.ru}'
    - '[они́ хотя́т гуля́ть]{.ru}'
  - base: '[А́нна + люби́ть + кла́ссика]{.ru}'
    cells:
    - '[А́нна + люби́ть + кла́ссика]{.ru}'
    - '[А́нна лю́бит кла́ссику]{.ru}'
  - base: '[вы + хоте́ть + ка́ша]{.ru}'
    cells:
    - '[вы + хоте́ть + ка́ша]{.ru}'
    - '[вы хоти́те ка́шу]{.ru}'
  - base: '[я + хоте́ть + отдыха́ть]{.ru}'
    cells:
    - '[я + хоте́ть + отдыха́ть]{.ru}'
    - '[я хочу́ отдыха́ть]{.ru}'
  - base: '[де́ти + люби́ть + ска́зка]{.ru}'
    cells:
    - '[де́ти + люби́ть + ска́зка]{.ru}'
    - '[де́ти лю́бят ска́зку]{.ru}'
    new: true
    gloss: 孩子们
  - base: '[ты + люби́ть + Чайко́вский]{.ru}'
    cells:
    - '[ты + люби́ть + Чайко́вский]{.ru}'
    - '[ты лю́бишь Чайко́вского]{.ru}'
  - base: '[ба́бушка + люби́ть + гото́вить]{.ru}'
    cells:
    - '[ба́бушка + люби́ть + гото́вить]{.ru}'
    - '[ба́бушка лю́бит гото́вить]{.ru}'
  - base: '[я + люби́ть + ма́ма]{.ru}'
    cells:
    - '[я + люби́ть + ма́ма]{.ru}'
    - '[я люблю́ ма́му]{.ru}'
  - base: '[Ван Лэй + хоте́ть + жить в Москве́]{.ru}'
    cells:
    - '[Ван Лэй + хоте́ть + жить в Москве́]{.ru}'
    - '[Ван Лэй хо́чет жить в Москве́]{.ru}'
  why: '第 1、2、4、6、7、9、10、12 题：补语是名词，用第四格：[му́зыку, кла́ссику, ка́шу, ска́зку]{.ru}；阳性非动物不变：[футбо́л, чай]{.ru}。

    第 10 题：[Чайко́вский]{.ru} 是人名，指作品时也按动物名词变，按形容词词尾 [-ого]{.ru}：[Чайко́вского]{.ru}。

    第 12 题：[люби́ть]{.ru} 用于人是“爱”，[ма́му]{.ru} 也是第四格。

    第 3、5、8、11、13 题：补语是动词，只写不定式，人称由 [люби́ть / хоте́ть]{.ru} 表示：[мы лю́бим чита́ть]{.ru}，不要写成 *[мы лю́бим чита́ем]{.ru}。'
- id: L26-03
  tags:
  - 情态意义：люби́ть 与 хоте́ть 辨别
  task: 根据情景判断说“一贯喜欢”还是“现在想要”。
  type: classify
  bins:
  - '[люби́ть]{.ru}'
  - '[хоте́ть]{.ru}'
  items:
  - text: '[слу́шать кла́ссику]{.ru}：他从小就爱听'
    answer: '[люби́ть]{.ru}'
  - text: '[пить чай]{.ru}：现在渴了'
    answer: '[хоте́ть]{.ru}'
  - text: '[игра́ть в футбо́л]{.ru}：米沙一有空就踢球'
    answer: '[люби́ть]{.ru}'
  - text: '[спать]{.ru}：已经夜里一点了'
    answer: '[хоте́ть]{.ru}'
  - text: '[чита́ть рома́ны]{.ru}：安娜一向爱读小说'
    answer: '[люби́ть]{.ru}'
  - text: '[есть]{.ru}：一整天没吃饭了'
    answer: '[хоте́ть]{.ru}'
  - text: '[гуля́ть в па́рке]{.ru}：爷爷每天都去，这是他的爱好'
    answer: '[люби́ть]{.ru}'
  - text: '[смотре́ть э́тот фильм]{.ru}：听说很好看，今晚就想看'
    answer: '[хоте́ть]{.ru}'
  - text: '[рок]{.ru}：她一直是摇滚迷'
    answer: '[люби́ть]{.ru}'
  - text: '[жить в Москве́]{.ru}：王磊的愿望：毕业后留在莫斯科'
    answer: '[хоте́ть]{.ru}'
  - text: '[гото́вить]{.ru}：妈妈很喜欢下厨'
    answer: '[люби́ть]{.ru}'
  - text: '[отдыха́ть]{.ru}：今天太累了，只想休息'
    answer: '[хоте́ть]{.ru}'
  - text: '[Пу́шкин]{.ru}：这是他最喜欢的诗人'
    answer: '[люби́ть]{.ru}'
  - text: '[ко́фе]{.ru}：现在想来一杯'
    answer: '[хоте́ть]{.ru}'
  why: '第 1、3、5、7、9、11、13 题：一贯的爱好、长期的喜爱，用 [люби́ть]{.ru}。

    第 2、4、6、8、12、14 题：此刻的愿望，用 [хоте́ть]{.ru}。

    第 10 题：长期的愿望（想在莫斯科生活）也用 [хоте́ть]{.ru}：[Я хочу́ жить в Москве́]{.ru}。'
- id: L26-04
  tags:
  - 动词支配：игра́ть в + 第四格
  task: 用 [игра́ть в]{.ru} + 第四格组成句子，[игра́ть]{.ru} 按主语变位。
  type: matrix
  cols:
  - 主语 + 游戏
  - 句子
  rows:
  - base: '[мы + ша́хматы]{.ru}'
    cells:
    - '[мы + ша́хматы]{.ru}'
    - '[мы игра́ем в ша́хматы]{.ru}'
    new: true
    gloss: 国际象棋
  - base: '[Ми́ша + футбо́л]{.ru}'
    cells:
    - '[Ми́ша + футбо́л]{.ru}'
    - '[Ми́ша игра́ет в футбо́л]{.ru}'
  - base: '[я + компью́тер]{.ru}'
    cells:
    - '[я + компью́тер]{.ru}'
    - '[я игра́ю в компью́тер]{.ru}'
  - base: '[они́ + те́ннис]{.ru}'
    cells:
    - '[они́ + те́ннис]{.ru}'
    - '[они́ игра́ют в те́ннис]{.ru}'
    new: true
    gloss: 网球
  - base: '[ты + баскетбо́л]{.ru}'
    cells:
    - '[ты + баскетбо́л]{.ru}'
    - '[ты игра́ешь в баскетбо́л]{.ru}'
    new: true
    gloss: 篮球
  - base: '[Ми́ша и Ка́тя + но́вая игра́]{.ru}'
    cells:
    - '[Ми́ша и Ка́тя + но́вая игра́]{.ru}'
    - '[Ми́ша и Ка́тя игра́ют в но́вую игру́]{.ru}'
    new: true
    gloss: 游戏
  - base: '[па́па + ка́рты]{.ru}'
    cells:
    - '[па́па + ка́рты]{.ru}'
    - '[па́па игра́ет в ка́рты]{.ru}'
    new: true
    gloss: 扑克牌
  - base: '[студе́нты + ру́сская игра́]{.ru}'
    cells:
    - '[студе́нты + ру́сская игра́]{.ru}'
    - '[студе́нты игра́ют в ру́сскую игру́]{.ru}'
    new: true
    gloss: 游戏
  - base: '[я + интере́сная игра́]{.ru}'
    cells:
    - '[я + интере́сная игра́]{.ru}'
    - '[я игра́ю в интере́сную игру́]{.ru}'
    new: true
    gloss: 游戏
  why: '第 1–5、7 题：[игра́ть в]{.ru} 后面用第四格；这些名词是阳性非动物或复数，形式同第一格：[в футбо́л, в ша́хматы, в ка́рты]{.ru}。

    第 6、8、9 题：阴性 [игра́]{.ru} 变 [игру́]{.ru}，修饰语 [-ую]{.ru}：[в но́вую игру́]{.ru}。

    第 1–9 题：[игра́ть]{.ru} 是规则的第一变位：[игра́ю, игра́ешь … игра́ют]{.ru}。'
