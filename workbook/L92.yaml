  why: '第 1、2 题：[дари́ть, подари́ть]{.ru} 第一人称重音在词尾，其余人称移到词干：[дарю́, да́ришь, да́рят]{.ru}，[подарю́, пода́ришь, пода́рят]{.ru}。

    第 3 题：[дава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[даю́, даёшь]{.ru}。第 4 题：[дать]{.ru} 变位不规则：[дам, дашь, даст, дади́м, дади́те, даду́т]{.ru}。

    第 6 题：[купи́ть]{.ru} 第一人称加 [л]{.ru}，重音后移：[куплю́, ку́пишь]{.ru}。第 8 题：[показа́ть]{.ru} 的 [з]{.ru} 在各人称都变 [ж]{.ru}：[покажу́, пока́жешь, пока́жут]{.ru}。第 5、7 题是规则的第一变位。'
- id: L92-02
  tags:
  - дари́ть кому́ что：第三格与第四格
  task: “送给谁什么”：写出收礼人的第三格和礼物的第四格。
  type: matrix
  cols:
  - 收礼人 + 礼物
  - 送给谁：第三格
  - 送什么：第四格
  given:
  - 0
  rows:
  - base: '[ма́ма + но́вая су́мка]{.ru}'
    cells:
    - '[ма́ма + но́вая су́мка]{.ru}'
    - '[ма́ме]{.ru}'
    - '[но́вую су́мку]{.ru}'
  - base: '[па́па + тёплый шарф]{.ru}'
    cells:
    - '[па́па + тёплый шарф]{.ru}'
    - '[па́пе]{.ru}'
    - '[тёплый шарф]{.ru}'
  - base: '[А́нна + краси́вый альбо́м]{.ru}'
    cells:
    - '[А́нна + краси́вый альбо́м]{.ru}'
    - '[А́нне]{.ru}'
    - '[краси́вый альбо́м]{.ru}'
  - base: '[Ми́ша + но́вая игра́]{.ru}'
    cells:
    - '[Ми́ша + но́вая игра́]{.ru}'
    - '[Ми́ше]{.ru}'
    - '[но́вую игру́]{.ru}'
  - base: '[ба́бушка + шёлковый плато́к]{.ru}'
    cells:
    - '[ба́бушка + шёлковый плато́к]{.ru}'
    - '[ба́бушке]{.ru}'
    - '[шёлковый плато́к]{.ru}'
  - base: '[брат + интере́сная кни́га]{.ru}'
    cells:
    - '[брат + интере́сная кни́га]{.ru}'
    - '[бра́ту]{.ru}'
    - '[интере́сную кни́гу]{.ru}'
  - base: '[сестра́ + бе́лая футбо́лка]{.ru}'
    cells:
    - '[сестра́ + бе́лая футбо́лка]{.ru}'
    - '[сестре́]{.ru}'
    - '[бе́лую футбо́лку]{.ru}'
  - base: '[О́льга Ви́кторовна + рису́нок]{.ru}'
    cells:
    - '[О́льга Ви́кторовна + рису́нок]{.ru}'
    - '[О́льге Ви́кторовне]{.ru}'
    - '[рису́нок]{.ru}'
  - base: '[друг + большо́й торт]{.ru}'
    cells:
    - '[друг + большо́й торт]{.ru}'
    - '[дру́гу]{.ru}'
    - '[большо́й торт]{.ru}'
  - base: '[Ю́ми + ру́сская ку́кла]{.ru}'
    cells:
    - '[Ю́ми + ру́сская ку́кла]{.ru}'
    - '[Ю́ми]{.ru}'
    - '[ру́сскую ку́клу]{.ru}'
    new: true
    gloss: 娃娃
  - base: '[Пьер + кита́йский чай]{.ru}'
    cells:
    - '[Пьер + кита́йский чай]{.ru}'
    - '[Пье́ру]{.ru}'
    - '[кита́йский чай]{.ru}'
  - base: '[ты + ма́ленький пода́рок]{.ru}'
    cells:
    - '[ты + ма́ленький пода́рок]{.ru}'
    - '[тебе́]{.ru}'
    - '[ма́ленький пода́рок]{.ru}'
  - base: '[он + шёлковый га́лстук]{.ru}'
    cells:
    - '[он + шёлковый га́лстук]{.ru}'
    - '[ему́]{.ru}'
    - '[шёлковый га́лстук]{.ru}'
    new: true
    gloss: 领带
  - base: '[она́ + си́няя ча́шка]{.ru}'
    cells:
    - '[она́ + си́няя ча́шка]{.ru}'
    - '[ей]{.ru}'
    - '[си́нюю ча́шку]{.ru}'
    new: true
    gloss: 杯子
  - base: '[мы + оливье́]{.ru}'
    cells:
    - '[мы + оливье́]{.ru}'
    - '[нам]{.ru}'
    - '[оливье́]{.ru}'
  why: '第三格：[-а]{.ru} 结尾的名词变 [-е]{.ru}：[ма́ме, па́пе, А́нне, Ми́ше, сестре́, О́льге Ви́кторовне]{.ru}；阳性加 [-у]{.ru}：[бра́ту, дру́гу, Пье́ру]{.ru}；代词 [тебе́, ему́, ей, нам]{.ru}；[Ю́ми]{.ru} 不变。

    第四格：阴性名词 [-а → -у]{.ru}，形容词 [-ая → -ую, -яя → -юю]{.ru}：[но́вую су́мку, интере́сную кни́гу, си́нюю ча́шку]{.ru}；阳性非动物名词和修饰它的形容词同第一格：[тёплый шарф, шёлковый плато́к, рису́нок, большо́й торт]{.ru}；[оливье́]{.ru} 不变格。

    易错点：收礼人用第四格（[ма́му]{.ru}），或礼物用第三格。'
- id: L92-03
  tags:
  - 双补语语序：新信息在句末
  task: 看句末的词，判断这句话回答的是“送什么”还是“送给谁”。
  type: classify
  bins:
  - 新信息是“送什么”
  - 新信息是“送给谁”
  items:
  - text: Ма́ме я подарю́ плато́к.
    answer: 新信息是“送什么”
  - text: Плато́к я подарю́ ма́ме.
    answer: 新信息是“送给谁”
  - text: А́нне Ван Лэй подари́л альбо́м.
    answer: 新信息是“送什么”
  - text: Альбо́м Ван Лэй подари́л А́нне.
    answer: 新信息是“送给谁”
  - text: Ми́ше ма́ма купи́ла футбо́лку.
    answer: 新信息是“送什么”
  - text: Футбо́лку ма́ма купи́ла Ми́ше.
    answer: 新信息是“送给谁”
  - text: Ба́бушке мы пода́рим шарф.
    answer: 新信息是“送什么”
  - text: Э́тот рису́нок Ми́ша подари́л О́льге Ви́кторовне.
    answer: 新信息是“送给谁”
  - text: Па́пе Ю́ми подари́ла кита́йский чай.
    answer: 新信息是“送什么”
  - text: Кни́гу я дам Пье́ру.
    answer: 新信息是“送给谁”
  - text: Пье́ру я дам кни́гу.
    answer: 新信息是“送什么”
  - text: Тёплый шарф ба́бушка подари́ла вну́чке.
    answer: 新信息是“送给谁”
  - text: Вну́чке ба́бушка подари́ла тёплый шарф.
    answer: 新信息是“送什么”
  - text: Письмо́ Ми́ша написа́л Де́ду Моро́зу.
    answer: 新信息是“送给谁”
  why: '俄语把已知的信息放在前面，新信息放在句末。

    第 1、3、5、7、9、11、13 题：收礼人（第三格）在句首，是已知的，句末是礼物（第四格），回答 [Что ты пода́ришь ма́ме?]{.ru} 这类问题。

    第 2、4、6、8、10、12、14 题：礼物（第四格）在句首，句末是收礼人（第三格），回答 [Кому́ ты пода́ришь плато́к?]{.ru} 这类问题。格不随语序改变：[ма́ме]{.ru} 在句首还是句末都是第三格。'
- id: L92-04
  tags:
  - дари́ть / подари́ть：变位与补语代词
  task: 用括号里词的正确形式填空。
  type: fill
  items:
  - stem: Ма́ма подари́ла ___ но́вую игру́.
    hint: я
    accept:
    - мне
  - stem: Что ты пода́ришь ___?
    hint: она́
    accept:
    - ей
  - stem: Я подарю́ ___ альбо́м.
    hint: он
    accept:
    - ему́
  - stem: Дед Моро́з подари́л ___ игру́.
    hint: они́
    accept:
    - им
  - stem: Мы пода́рим ___ шарф.
    hint: вы
    accept:
    - вам
  - stem: Вчера́ па́па ___ мне но́вый телефо́н.
    hint: подари́ть
    accept:
    - подари́л
  - stem: Что ты ___ А́нне за́втра?
    hint: подари́ть
    accept:
    - пода́ришь
  - stem: За́втра мы ___ ба́бушке плато́к.
    hint: подари́ть
    accept:
    - пода́рим
  - stem: Ван Лэй ча́сто ___ А́нне кни́ги.
    hint: дари́ть
    accept:
    - да́рит
  - stem: За́втра я ___ тебе́ шарф.
    hint: подари́ть
    accept:
    - подарю́
  - stem: Что вы ___ О́льге Ви́кторовне?
    hint: подари́ть
    accept:
    - пода́рите
  - stem: Вчера́ Петро́вы ___ Ван Лэ́ю альбо́м.
    hint: подари́ть
    accept:
    - подари́ли
  - stem: Покажи́те ___, пожа́луйста, шарф.
    hint: я
    accept:
    - мне
  - stem: Ми́ша ви́дел ___ в па́рке.
    hint: она́
    accept:
    - её
  - stem: Я спроси́л ___ о пода́рке.
    hint: он
    accept:
    - его́
  - stem: Де́ти ___ ма́ме рису́нки.
    hint: дари́ть
    accept:
    - да́рят
  why: '第 1–5、13 题：收礼人、“给谁看”用人称代词第三格：[мне, ей, ему́, им, вам]{.ru}。第 14、15 题：[ви́деть, спроси́ть]{.ru} 要求第四格：[её, его́]{.ru}，和第三格 [ей, ему́]{.ru} 要分清。

    第 7、8、10、11 题：[подари́ть]{.ru} 将来时第一人称重音在词尾 [подарю́]{.ru}，其余人称在词干：[пода́ришь, пода́рим, пода́рите]{.ru}。第 9、16 题：[дари́ть]{.ru} 现在时同样 [да́рит, да́рят]{.ru}。

    第 6、12 题：过去时与主语性数一致：[па́па подари́л, Петро́вы подари́ли]{.ru}。'
- id: L92-05
  tags:
  - “第三格 + 第四格”动词：双补语填空
  task: 其他要求“给谁 + 什么”的动词：用括号里词的正确形式填空。
  type: fill
  items:
  - stem: Ма́ма купи́ла ___ футбо́лку.
    hint: Ми́ша
    accept:
    - Ми́ше
  - stem: Да́йте мне, пожа́луйста, ___.
    hint: вода́
    accept:
    - во́ду
  - stem: Ми́ша написа́л ___ письмо́.
    hint: Дед Моро́з
    accept:
    - Де́ду Моро́зу
  - stem: Покажи́те мне, пожа́луйста, ___.
    hint: си́няя су́мка
    accept:
    - си́нюю су́мку
  - stem: Ба́бушка расска́жет ___ ска́зку.
    hint: вну́чка
    accept:
    - вну́чке
  - stem: Ван Лэй показа́л ___ свой рису́нок.
    hint: Пьер
    accept:
    - Пье́ру
  - stem: А́нна дала́ ___ свой слова́рь.
    hint: Ю́ми
    accept:
    - Ю́ми
  - stem: Па́па купи́л ма́ме ___.
    hint: краси́вый плато́к
    accept:
    - краси́вый плато́к
  - stem: Я напишу́ ___ письмо́.
    hint: ба́бушка
    accept:
    - ба́бушке
  - stem: Расскажи́ ___ о Пеки́не.
    hint: мы
    accept:
    - нам
  - stem: Ма́ма дала́ ___ пирожки́.
    hint: он
    accept:
    - ему́
  - stem: О́льга Ви́кторовна дала́ ___ но́вую кни́гу.
    hint: А́нна
    accept:
    - А́нне
  - stem: Ми́ша рассказа́л ___ интере́сную исто́рию.
    hint: сестра́
    accept:
    - сестре́
  - stem: Я куплю́ ___ в магази́не.
    hint: но́вая ру́чка
    accept:
    - но́вую ру́чку
  why: '[дава́ть / дать, покупа́ть / купи́ть, писа́ть / написа́ть, пока́зывать / показа́ть, расска́зывать / рассказа́ть]{.ru} 和 [дари́ть]{.ru} 一样：给谁用第三格，给什么用第四格。

    第 1、3、5、6、7、9、10、11、12、13 题：收件人、听话人用第三格：[Ми́ше, Де́ду Моро́зу, вну́чке, Пье́ру, ба́бушке, нам, ему́, А́нне, сестре́]{.ru}；[Ю́ми]{.ru} 不变格。第 3 题名字的两部分都变。

    第 2、4、8、14 题：东西用第四格：[во́ду]{.ru}（[вода́]{.ru} 第四格重音移到词干），[си́нюю су́мку, но́вую ру́чку]{.ru}；阳性非动物名词同第一格：[краси́вый плато́к]{.ru}。'
