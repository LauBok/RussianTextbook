heading: 第 92 课　дари́ть / подари́ть кому́ что
groups:
- id: L92-01
  tags:
  - дари́ть / подари́ть 等“给予”类体对：人称变位
  task: 写出体对的六个人称形式（未完成体是现在时，完成体是将来时）。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[он / она́]{.ru}'
  - '[мы]{.ru}'
  - '[вы]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[дари́ть]{.ru}'
    cells:
    - '[дари́ть]{.ru}'
    - '[дарю́]{.ru}'
    - '[да́ришь]{.ru}'
    - '[да́рит]{.ru}'
    - '[да́рим]{.ru}'
    - '[да́рите]{.ru}'
    - '[да́рят]{.ru}'
    hint: II；[дарю́, да́ришь]{.ru}
  - base: '[подари́ть]{.ru}'
    cells:
    - '[подари́ть]{.ru}'
    - '[подарю́]{.ru}'
    - '[пода́ришь]{.ru}'
    - '[пода́рит]{.ru}'
    - '[пода́рим]{.ru}'
    - '[пода́рите]{.ru}'
    - '[пода́рят]{.ru}'
    hint: II；[подарю́, пода́ришь]{.ru}
  - base: '[дава́ть]{.ru}'
    cells:
    - '[дава́ть]{.ru}'
    - '[даю́]{.ru}'
    - '[даёшь]{.ru}'
    - '[даёт]{.ru}'
    - '[даём]{.ru}'
    - '[даёте]{.ru}'
    - '[даю́т]{.ru}'
  - base: '[дать]{.ru}'
    cells:
    - '[дать]{.ru}'
    - '[дам]{.ru}'
    - '[дашь]{.ru}'
    - '[даст]{.ru}'
    - '[дади́м]{.ru}'
    - '[дади́те]{.ru}'
    - '[даду́т]{.ru}'
    hint: irreg.
  - base: '[покупа́ть]{.ru}'
    cells:
    - '[покупа́ть]{.ru}'
    - '[покупа́ю]{.ru}'
    - '[покупа́ешь]{.ru}'
    - '[покупа́ет]{.ru}'
    - '[покупа́ем]{.ru}'
    - '[покупа́ете]{.ru}'
    - '[покупа́ют]{.ru}'
  - base: '[купи́ть]{.ru}'
    cells:
    - '[купи́ть]{.ru}'
    - '[куплю́]{.ru}'
    - '[ку́пишь]{.ru}'
    - '[ку́пит]{.ru}'
    - '[ку́пим]{.ru}'
    - '[ку́пите]{.ru}'
    - '[ку́пят]{.ru}'
    hint: II；[куплю́, ку́пишь]{.ru}
  - base: '[пока́зывать]{.ru}'
    cells:
    - '[пока́зывать]{.ru}'
    - '[пока́зываю]{.ru}'
    - '[пока́зываешь]{.ru}'
    - '[пока́зывает]{.ru}'
    - '[пока́зываем]{.ru}'
    - '[пока́зываете]{.ru}'
    - '[пока́зывают]{.ru}'
  - base: '[показа́ть]{.ru}'
    cells:
    - '[показа́ть]{.ru}'
    - '[покажу́]{.ru}'
    - '[пока́жешь]{.ru}'
    - '[пока́жет]{.ru}'
    - '[пока́жем]{.ru}'
    - '[пока́жете]{.ru}'
    - '[пока́жут]{.ru}'
