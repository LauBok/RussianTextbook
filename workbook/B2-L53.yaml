heading: 第 53 课　比较从句：как、чем、как бу́дто
groups:
- id: B2-L53-01
  tags:
  - 比较从句：意义
  task: 这些意思该用哪个词表达？归入相应的栏。
  type: classify
  bins:
  - '[как]{.ru}'
  - '[чем]{.ru}'
  - '[как бу́дто]{.ru}'
  - '[похо́же / ка́жется]{.ru}'
  items:
  - text: 我的手机和你的一样（[тако́й же]{.ru}）
    answer: '[как]{.ru}'
  - text: 他踢得像真正的球员那样（[так]{.ru}）
    answer: '[как]{.ru}'
  - text: 一切都照你说的做了（[так]{.ru}）
    answer: '[как]{.ru}'
  - text: 天空和昨天一样阴沉（[тако́е же]{.ru}）
    answer: '[как]{.ru}'
  - text: 迪马今天来得比平时早（[ра́ньше]{.ru}）
    answer: '[чем]{.ru}'
  - text: 今天比昨天冷（[холодне́е]{.ru}）
    answer: '[чем]{.ru}'
  - text: 他比我们约好的时间来得早（[ра́ньше]{.ru}）
    answer: '[чем]{.ru}'
  - text: 莫斯科比喀山大（[бо́льше]{.ru}）
    answer: '[чем]{.ru}'
  - text: 她说话（[говори́ла]{.ru}）的样子好像什么都知道（其实不知道）
    answer: '[как бу́дто]{.ru}'
  - text: 米沙看着我（[смотре́л]{.ru}），好像不认识我（其实认识）
    answer: '[как бу́дто]{.ru}'
  - text: 他笑着（[улыба́лся]{.ru}），好像什么事也没发生（其实出了事）
    answer: '[как бу́дто]{.ru}'
  - text: 王磊说俄语（[говори́т по-ру́сски]{.ru}），好像他一辈子住在莫斯科（其实没有）
    answer: '[как бу́дто]{.ru}'
  - text: 看样子要下雨了（[бу́дет дождь]{.ru}）
    answer: '[похо́же / ка́жется]{.ru}'
  - text: 我好像把钥匙忘在家里了（[забы́л ключи́]{.ru}）
    answer: '[похо́же / ка́жется]{.ru}'
  - text: 看样子迪马今天没迟到（[не опозда́л]{.ru}）
    answer: '[похо́же / ка́жется]{.ru}'
  - text: 看样子大家都已经走了（[все ушли́]{.ru}）
    answer: '[похо́же / ка́жется]{.ru}'
  why: |-
    第 1–4 题：真实的相同、相似，主句常有 [так, тако́й же]{.ru}：[У меня́ тако́й же телефо́н, как у тебя́.]{.ru}
    第 5–8 题：程度不同，跟在比较级后：[ра́ньше, чем обы́чно; холодне́е, чем вчера́]{.ru}。
    第 9–12 题：不真实的比较，“看起来好像，其实不是”：[как бу́дто]{.ru}。
    第 13–16 题：说话人推测，不是比较两件事，用插入语 [похо́же, ка́жется]{.ru}，用逗号隔开。
- id: B2-L53-02
  tags:
  - такой же：变格
  task: 写出 [тако́й же]{.ru} 和名词的指定格。
  type: matrix
  cols:
  - 词组
  - 形式
  given:
  - 0
  rows:
  - base: '[тако́й же дом]{.ru}'
    cells:
    - '[тако́й же дом]{.ru}'
    - '[в тако́м же до́ме]{.ru}'
    hint: 第六格；在……里
  - base: '[така́я же су́мка]{.ru}'
    cells:
    - '[така́я же су́мка]{.ru}'
    - '[таку́ю же су́мку]{.ru}'
    hint: 第四格
  - base: '[тако́е же кафе́]{.ru}'
    cells:
    - '[тако́е же кафе́]{.ru}'
    - '[в тако́м же кафе́]{.ru}'
    hint: 第六格；在……里
  - base: '[таки́е же кни́ги]{.ru}'
    cells:
    - '[таки́е же кни́ги]{.ru}'
    - '[таки́х же книг]{.ru}'
    hint: 第二格
  - base: '[така́я же маши́на]{.ru}'
    cells:
    - '[така́я же маши́на]{.ru}'
    - '[тако́й же маши́ной]{.ru}'
    hint: 第五格
  - base: '[тако́й же брат]{.ru}'
    cells:
    - '[тако́й же брат]{.ru}'
    - '[тако́го же бра́та]{.ru}'
    hint: 第四格
  - base: '[таки́е же друзья́]{.ru}'
    cells:
    - '[таки́е же друзья́]{.ru}'
    - '[таки́м же друзья́м]{.ru}'
    hint: 第三格
  - base: '[така́я же у́лица]{.ru}'
    cells:
    - '[така́я же у́лица]{.ru}'
    - '[на тако́й же у́лице]{.ru}'
    hint: 第六格；在……上
  - base: '[тако́е же зда́ние]{.ru}'
    cells:
    - '[тако́е же зда́ние]{.ru}'
    - '[тако́го же зда́ния]{.ru}'
    hint: 第二格
  - base: '[таки́е же ко́мнаты]{.ru}'
    cells:
    - '[таки́е же ко́мнаты]{.ru}'
    - '[в таки́х же ко́мнатах]{.ru}'
    hint: 第六格；在……里
  - base: '[тако́й же костю́м]{.ru}'
    cells:
    - '[тако́й же костю́м]{.ru}'
    - '[таки́м же костю́мом]{.ru}'
    hint: 第五格
    new: true
    gloss: 西服
  - base: '[така́я же подру́га]{.ru}'
    cells:
    - '[така́я же подру́га]{.ru}'
    - '[тако́й же подру́ге]{.ru}'
    hint: 第三格
  - base: '[тако́й же парк]{.ru}'
    cells:
    - '[тако́й же парк]{.ru}'
    - '[в тако́м же па́рке]{.ru}'
    hint: 第六格；在……里
  - base: '[така́я же ла́мпа]{.ru}'
    cells:
    - '[така́я же ла́мпа]{.ru}'
    - '[тако́й же ла́мпы]{.ru}'
    hint: 第二格
  - base: '[таки́е же де́ти]{.ru}'
    cells:
    - '[таки́е же де́ти]{.ru}'
    - '[таки́х же дете́й]{.ru}'
    hint: 第四格
  - base: '[тако́е же окно́]{.ru}'
    cells:
    - '[тако́е же окно́]{.ru}'
    - '[тако́му же окну́]{.ru}'
    hint: 第三格
  why: |-
    [тако́й]{.ru} 按形容词变格（重音在词尾），[же]{.ru} 不变，和名词的性数格一致。
    第 1、3 题：阳性、中性第六格：[в тако́м же до́ме, в тако́м же кафе́]{.ru}（[кафе́]{.ru} 不变格）。
    第 6、9 题：阳性动物第四格、中性第二格：[тако́го же]{.ru}。
    第 11 题：阳性第五格：[таки́м же костю́мом]{.ru}。
    第 2 题：阴性第四格：[таку́ю же су́мку]{.ru}；第 5、8、12 题：阴性第五、六、三格都是 [тако́й же]{.ru}。
    第 4、7、10 题：复数：[таки́х же книг, таки́м же друзья́м, в таки́х же ко́мнатах]{.ru}。
    第 13 题：[в тако́м же па́рке]{.ru}。第 14 题：阴性第二格 [тако́й же ла́мпы]{.ru}。第 15 题：复数动物第四格同第二格：[таки́х же дете́й]{.ru}。第 16 题：中性第三格 [тако́му же окну́]{.ru}。
- id: B2-L53-03
  tags:
  - 比较从句：选词（句中）
  task: 用 [как, чем, как бу́дто, похо́же, ка́жется]{.ru} 填空。
  type: fill
  items:
  - stem: Ди́ма игра́ет лу́чше, ___ я.
    accept:
    - чем
  - stem: У меня́ така́я же ку́ртка, ___ у тебя́.
    accept:
    - как
  - stem: Он говори́т по-ру́сски так, ___ всю жизнь жил в Москве́.
    accept:
    - как бу́дто
  - stem: Сего́дня холодне́е, ___ вчера́.
    accept:
    - чем
  - stem: '___, за́втра бу́дет дождь: не́бо уже́ тяжёлое.'
    accept:
    - Похо́же
    - Ка́жется
  - stem: Ми́ша смотре́л на нас так, ___ ничего́ не понима́л.
    accept:
    - как бу́дто
  - stem: Пьер сде́лал всё так, ___ его́ проси́ли.
    accept:
    - как
  - stem: Ты пришёл ра́ньше, ___ мы договори́лись.
    accept:
    - чем
  - stem: Она́ улыба́лась, ___ ничего́ не случи́лось.
    accept:
    - как бу́дто
  - stem: ___, я забы́л ключи́ до́ма.
    accept:
    - Ка́жется
    - Похо́же
  - stem: Москва́ бо́льше, ___ Каза́нь.
    accept:
    - чем
  - stem: Ди́ма игра́ет так же, ___ его́ брат.
    accept:
    - как
  - stem: Ле́том здесь жа́рко, ___ на ю́ге.
    accept:
    - как
  - stem: Ван Лэй устаёт ме́ньше, ___ ра́ньше.
    accept:
    - чем
  - stem: Ди́ма молча́л, ___ не слы́шал вопро́са.
    accept:
    - как бу́дто
  why: |-
    第 1、4、8、11 题：跟在比较级后，表示程度不同：[чем]{.ru}。第 8 题后面是分句，只能用 [чем]{.ru}。
    第 2、7、12 题：真实的相同，主句有 [тако́й же, так, так же]{.ru}：[как]{.ru}。
    第 3、6、9 题：其实不是那样，只是看上去像：[как бу́дто]{.ru}，从句动词用普通时间形式。
    第 5、10 题：推测的插入语，用逗号隔开：[похо́же]{.ru}（有迹象，看样子）、[ка́жется]{.ru}（自己不太确定，好像），两个都可以。
    第 13 题：真实的相同：[как на ю́ге]{.ru}。第 14 题：比较级 [ме́ньше]{.ru} 后跟副词 [ра́ньше]{.ru}，只能用 [чем]{.ru}。第 15 题：其实听见了，只是像没听见：[как бу́дто]{.ru}。
