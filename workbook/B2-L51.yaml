heading: 第 51 课　原因与结果：так как、поэ́тому、так что
groups:
- id: B2-L51-01
  tags:
  - 原因与结果：连接词的位置
  task: 按空的位置判断能用哪个连接词，归入相应的栏。
  type: classify
  bins:
  - '[так как]{.ru}'
  - '[потому́ что / так как]{.ru}'
  - '[поэ́тому / так что]{.ru}'
  items:
  - text: '[… бы́ло жа́рко, мы пошли́ купа́ться.]{.ru}'
    answer: '[так как]{.ru}'
  - text: '[Мы пошли́ купа́ться, … бы́ло жа́рко.]{.ru}'
    answer: '[потому́ что / так как]{.ru}'
  - text: '[Бы́ло жа́рко, … мы пошли́ купа́ться.]{.ru}'
    answer: '[поэ́тому / так что]{.ru}'
  - text: '[… Ди́ма боле́л, он не пришёл на матч.]{.ru}'
    answer: '[так как]{.ru}'
  - text: '[Ди́ма не пришёл на матч, … он боле́л.]{.ru}'
    answer: '[потому́ что / так как]{.ru}'
  - text: '[Ди́ма боле́л, … не пришёл на матч.]{.ru}'
    answer: '[поэ́тому / так что]{.ru}'
  - text: '[… шёл ли́вень, матч перенесли́.]{.ru}'
    answer: '[так как]{.ru}'
  - text: '[Матч перенесли́, … шёл ли́вень.]{.ru}'
    answer: '[потому́ что / так как]{.ru}'
  - text: '[Шёл ли́вень, … матч перенесли́.]{.ru}'
    answer: '[поэ́тому / так что]{.ru}'
  - text: '[Ю́ми не позвони́ла, … забы́ла телефо́н до́ма.]{.ru}'
    answer: '[потому́ что / так как]{.ru}'
  - text: '[… в ко́мнате бы́ло ду́шно, мы откры́ли окно́.]{.ru}'
    answer: '[так как]{.ru}'
  - text: '[Ван Лэй хорошо́ знал доро́гу, … мы не заблуди́лись.]{.ru}'
    answer: '[поэ́тому / так что]{.ru}'
    new: true
    gloss: 迷路
  why: |-
    第 1、4、7、11 题：空在句首，后面是原因，接着才是结果：原因放在前面只能用 [так как]{.ru}，不能用 [потому́ что]{.ru}。
    第 2、5、8、10 题：结果在前，空后面说原因：[потому́ что]{.ru} 和 [так как]{.ru} 都可以。
    第 3、6、9、12 题：原因在前，空后面说结果：[поэ́тому]{.ru} 或 [так что]{.ru}。
- id: B2-L51-02
  tags:
  - 原因与结果：选连接词（句中）
  task: 用 [потому́ что, так как, поэ́тому, так что]{.ru} 填空。
  type: fill
  items:
  - stem: ___ у меня́ не́ было зонта́, я промо́к.
    accept:
    - Так как
  - stem: Я промо́к, ___ у меня́ не́ было зонта́.
    accept:
    - потому́ что
    - так как
  - stem: У меня́ не́ было зонта́. ___ я промо́к.
    accept:
    - Поэ́тому
  - stem: Бы́ло о́чень ду́шно, и ___ мы откры́ли все о́кна.
    accept:
    - поэ́тому
  - stem: Матч перенесли́, ___ у нас есть ещё два дня.
    accept:
    - так что
    - поэ́тому
  - stem: — Почему́ ты не позвони́л? — ___ я забы́л телефо́н до́ма.
    accept:
    - Потому́ что
  - stem: ___ Ди́ма боле́л, он не пришёл на матч.
    accept:
    - Так как
  - stem: Ван Лэй не пошёл в кино́, ___ ему́ на́до бы́ло гото́виться к экза́мену.
    accept:
    - потому́ что
    - так как
  - stem: Лифт не рабо́тал. ___ мы пошли́ пешко́м.
    accept:
    - Поэ́тому
  - stem: Ди́ма сдал все экза́мены, ___ ле́то у него́ свобо́дное.
    accept:
    - так что
    - поэ́тому
  - stem: Мы не взя́ли зонт, а ___ промо́кли.
    accept:
    - поэ́тому
  - stem: Я о́чень уста́л, ___ сра́зу лёг спать.
    accept:
    - поэ́тому
    - так что
  - stem: ___ за́втра экза́мен, Ди́ма весь ве́чер занима́лся.
    accept:
    - Так как
  - stem: Ско́ро бу́дет гроза́. ___ возьми́те зонт.
    accept:
    - Поэ́тому
  - stem: Ми́ша не пошёл гуля́ть, ___ у него́ боле́ла голова́.
    accept:
    - потому́ что
    - так как
  - stem: Ю́ми хорошо́ зна́ет го́род, ___ мы не заблу́димся.
    accept:
    - так что
    - поэ́тому
  why: |-
    第 1、7 题：原因放在句首，只能用 [так как]{.ru}。
    第 2、8 题：原因放在主句后，[потому́ что]{.ru} 和 [так как]{.ru} 都可以。
    第 6 题：回答 [почему́]{.ru} 用 [Потому́ что]{.ru}，[так как]{.ru} 不单独回答问题。
    第 3、9 题：结果开始一个新句子，只能用 [Поэ́тому]{.ru}；[так что]{.ru} 只连接同一个句子的两部分。
    第 4、11 题：前面有 [и]{.ru} 或 [а]{.ru}，只能用 [поэ́тому]{.ru}。
    第 5、10、12 题：同一句里说结果，[так что]{.ru} 和 [поэ́тому]{.ru} 都可以；[так что]{.ru} 更像顺带的推论。
    第 13 题：原因在句首：[Так как]{.ru}。第 14 题：新句子开头：[Поэ́тому]{.ru}。第 15 题：原因在后：[потому́ что / так как]{.ru}。第 16 题：同一句里的结果：[так что / поэ́тому]{.ru}。
- id: B2-L51-03
  tags:
  - 原因与结果：换说法
  task: 按例句换一种说法，只写出空里的分句。
  type: fill
  items:
  - stem: Ми́ша не пришёл в шко́лу, потому́ что заболе́л. → Так как ___, он не пришёл в шко́лу.
    accept:
    - Ми́ша заболе́л
    - он заболе́л
  - stem: Мы взя́ли такси́, потому́ что опа́здывали. → Мы опа́здывали, поэ́тому ___.
    accept:
    - взя́ли такси́
    - мы взя́ли такси́
  - stem: Ю́ми ча́сто звони́т домо́й, так как скуча́ет по семье́. → Ю́ми скуча́ет по семье́, так что ___.
    accept:
    - ча́сто звони́т домо́й
    - она́ ча́сто звони́т домо́й
  - stem: Ван Лэй хорошо́ говори́т по-ру́сски, потому́ что живёт в ру́сской семье́. → Так как ___, он хорошо́ говори́т по-ру́сски.
    accept:
    - Ван Лэй живёт в ру́сской семье́
    - он живёт в ру́сской семье́
  - stem: Пьер не купи́л биле́т, потому́ что в ка́ссе не́ было биле́тов. → В ка́ссе не́ было биле́тов, поэ́тому ___.
    accept:
    - Пьер не купи́л биле́т
  - stem: Ба́бушка не смотре́ла фильм, потому́ что ра́но легла́ спать. → Так как ___, она́ не смотре́ла фильм.
    accept:
    - ба́бушка ра́но легла́ спать
    - она́ ра́но легла́ спать
  - stem: Мы откры́ли окно́, потому́ что в ко́мнате бы́ло ду́шно. → В ко́мнате бы́ло ду́шно, так что ___.
    accept:
    - мы откры́ли окно́
  - stem: Ди́ма опозда́л на по́езд, потому́ что проспа́л. → Так как ___, он опозда́л на по́езд.
    accept:
    - Ди́ма проспа́л
    - он проспа́л
  - stem: Мы не пошли́ на пляж, потому́ что бы́ло хо́лодно. → Бы́ло хо́лодно, поэ́тому ___.
    accept:
    - мы не пошли́ на пляж
    - не пошли́ на пляж
    new: true
    gloss: 海滩
  - stem: А́нна не позвони́ла, так как у неё не́ было вре́мени. → Так как ___, А́нна не позвони́ла.
    accept:
    - у неё не́ было вре́мени
    - у А́нны не́ было вре́мени
  - stem: Пьер мно́го чита́ет по-ру́сски, поэ́тому зна́ет мно́го слов. → Пьер зна́ет мно́го слов, потому́ что ___.
    accept:
    - мно́го чита́ет по-ру́сски
    - он мно́го чита́ет по-ру́сски
  - stem: Магази́н был закры́т, так что мы ничего́ не купи́ли. → Мы ничего́ не купи́ли, так как ___.
    accept:
    - магази́н был закры́т
  why: |-
    第 1、4、6、8 题：[так как]{.ru} 放在句首，后面写原因分句：[Так как Ми́ша заболе́л, он не пришёл в шко́лу]{.ru}。原因在句首时，名词主语一般放在前一个分句里，后一个分句用代词。
    第 2、3、5、7 题：[поэ́тому / так что]{.ru} 后面写结果分句：[Мы опа́здывали, поэ́тому взя́ли такси́]{.ru}。主语和前一个分句相同时可以省去（第 2、3 题）。
    易错：原因和结果只标一处，不要在换说法时又加上 [потому́ что]{.ru}。
    第 9 题：结果分句放在 [поэ́тому]{.ru} 后。第 10 题：原因放在 [так как]{.ru} 后。第 11、12 题：反过来，把结果改成原因：[потому́ что, так как]{.ru} 后写原来的原因分句。
