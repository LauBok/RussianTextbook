heading: 第 25 课　短尾形容词
groups:
- id: B2-L25-01
  tags:
  - 短尾形容词：构成
  task: 写出形容词的短尾形式。
  type: matrix
  cols:
  - 长尾
  - 阳性
  - 阴性
  - 中性
  - 复数
  given:
  - 0
  rows:
  - base: '[гото́вый]{.ru}'
    cells:
    - '[гото́вый]{.ru}'
    - '[гото́в]{.ru}'
    - '[гото́ва]{.ru}'
    - '[гото́во]{.ru}'
    - '[гото́вы]{.ru}'
  - base: '[краси́вый]{.ru}'
    cells:
    - '[краси́вый]{.ru}'
    - '[краси́в]{.ru}'
    - '[краси́ва]{.ru}'
    - '[краси́во]{.ru}'
    - '[краси́вы]{.ru}'
  - base: '[похо́жий]{.ru}'
    cells:
    - '[похо́жий]{.ru}'
    - '[похо́ж]{.ru}'
    - '[похо́жа]{.ru}'
    - '[похо́же]{.ru}'
    - '[похо́жи]{.ru}'
  - base: '[ве́жливый]{.ru}'
    cells:
    - '[ве́жливый]{.ru}'
    - '[ве́жлив]{.ru}'
    - '[ве́жлива]{.ru}'
    - '[ве́жливо]{.ru}'
    - '[ве́жливы]{.ru}'
  - base: '[дово́льный]{.ru}'
    cells:
    - '[дово́льный]{.ru}'
    - '[дово́лен]{.ru}'
    - '[дово́льна]{.ru}'
    - '[дово́льно]{.ru}'
    - '[дово́льны]{.ru}'
  - base: '[свобо́дный]{.ru}'
    cells:
    - '[свобо́дный]{.ru}'
    - '[свобо́ден]{.ru}'
    - '[свобо́дна]{.ru}'
    - '[свобо́дно]{.ru}'
    - '[свобо́дны]{.ru}'
  - base: '[интере́сный]{.ru}'
    cells:
    - '[интере́сный]{.ru}'
    - '[интере́сен]{.ru}'
    - '[интере́сна]{.ru}'
    - '[интере́сно]{.ru}'
    - '[интере́сны]{.ru}'
  - base: '[бли́зкий]{.ru}'
    cells:
    - '[бли́зкий]{.ru}'
    - '[бли́зок]{.ru}'
    - '[близка́]{.ru}'
    - '[бли́зко]{.ru}'
    - '[бли́зки]{.ru}'
  - base: '[гря́зный]{.ru}'
    cells:
    - '[гря́зный]{.ru}'
    - '[гря́зен]{.ru}'
    - '[грязна́]{.ru}'
    - '[гря́зно]{.ru}'
    - '[гря́зны]{.ru}'
  - base: '[чи́стый]{.ru}'
    cells:
    - '[чи́стый]{.ru}'
    - '[чист]{.ru}'
    - '[чиста́]{.ru}'
    - '[чи́сто]{.ru}'
    - '[чи́сты]{.ru}'
  - base: '[за́нятый]{.ru}'
    cells:
    - '[за́нятый]{.ru}'
    - '[за́нят]{.ru}'
    - '[занята́]{.ru}'
    - '[за́нято]{.ru}'
    - '[за́няты]{.ru}'
  - base: '[ну́жный]{.ru}'
    cells:
    - '[ну́жный]{.ru}'
    - '[ну́жен]{.ru}'
    - '[нужна́]{.ru}'
    - '[ну́жно]{.ru}'
    - '[нужны́]{.ru}'
  why: |-
    第 1–12 题：阳性零词尾，阴性 [-а]{.ru}，中性 [-о]{.ru}，复数 [-ы]{.ru}。
    第 3、8 题：[ж, к]{.ru} 后复数按拼写规则写 [-и]{.ru}：[похо́жи, бли́зки]{.ru}；[ж]{.ru} 后中性写不重读的 [-е]{.ru}：[похо́же]{.ru}。
    第 5–9、12 题：阳性词干末两个辅音之间插入 [е]{.ru} 或 [о]{.ru}：[дово́лен, свобо́ден, интере́сен, бли́зок, гря́зен, ну́жен]{.ru}；其他形式不插：[дово́льна, свобо́дны]{.ru}。
    第 8–12 题：阴性重音移到词尾：[близка́, грязна́, чиста́, занята́, нужна́]{.ru}；[нужны́]{.ru} 复数重音也在词尾；[чи́сты]{.ru} 也说 [чисты́]{.ru}。
    第 1–4 题：词干不变、重音不动：[гото́в — гото́ва — гото́во — гото́вы]{.ru}。
- id: B2-L25-02
  tags:
  - 短尾形容词：带补语
  task: 写出短尾形容词和补语组成的词组。
  type: matrix
  cols:
  - 短尾形容词 + 补语
  - 词组
  given:
  - 0
  rows:
  - base: '[дово́лен + на́ша гру́ппа]{.ru}'
    cells:
    - '[дово́лен + на́ша гру́ппа]{.ru}'
    - '[дово́лен на́шей гру́ппой]{.ru}'
  - base: '[похо́ж на + па́па]{.ru}'
    cells:
    - '[похо́ж на + па́па]{.ru}'
    - '[похо́ж на па́пу]{.ru}'
  - base: '[гото́в к + экза́мен]{.ru}'
    cells:
    - '[гото́в к + экза́мен]{.ru}'
    - '[гото́в к экза́мену]{.ru}'
  - base: '[согла́сен с + ты]{.ru}'
    cells:
    - '[согла́сен с + ты]{.ru}'
    - '[согла́сен с тобо́й]{.ru}'
  - base: '[дово́льна + они́]{.ru}'
    cells:
    - '[дово́льна + они́]{.ru}'
    - '[дово́льна и́ми]{.ru}'
  - base: '[похо́жа на + ма́ма]{.ru}'
    cells:
    - '[похо́жа на + ма́ма]{.ru}'
    - '[похо́жа на ма́му]{.ru}'
  - base: '[гото́вы к + пра́здник]{.ru}'
    cells:
    - '[гото́вы к + пра́здник]{.ru}'
    - '[гото́вы к пра́зднику]{.ru}'
  - base: '[согла́сны с + профе́ссор]{.ru}'
    cells:
    - '[согла́сны с + профе́ссор]{.ru}'
    - '[согла́сны с профе́ссором]{.ru}'
  - base: '[дово́лен + рабо́та]{.ru}'
    cells:
    - '[дово́лен + рабо́та]{.ru}'
    - '[дово́лен рабо́той]{.ru}'
  - base: '[похо́жи на + роди́тели]{.ru}'
    cells:
    - '[похо́жи на + роди́тели]{.ru}'
    - '[похо́жи на роди́телей]{.ru}'
  - base: '[согла́сна на + така́я рабо́та]{.ru}'
    cells:
    - '[согла́сна на + така́я рабо́та]{.ru}'
    - '[согла́сна на таку́ю рабо́ту]{.ru}'
  - base: '[гото́ва к + уро́к]{.ru}'
    cells:
    - '[гото́ва к + уро́к]{.ru}'
    - '[гото́ва к уро́ку]{.ru}'
  - base: '[дово́льны + мы]{.ru}'
    cells:
    - '[дово́льны + мы]{.ru}'
    - '[дово́льны на́ми]{.ru}'
  - base: '[похо́ж на + он]{.ru}'
    cells:
    - '[похо́ж на + он]{.ru}'
    - '[похо́ж на него́]{.ru}'
  - base: '[гото́в + помога́ть]{.ru}'
    cells:
    - '[гото́в + помога́ть]{.ru}'
    - '[гото́в помога́ть]{.ru}'
  - base: '[согла́сен с + она́]{.ru}'
    cells:
    - '[согла́сен с + она́]{.ru}'
    - '[согла́сен с ней]{.ru}'
  why: |-
    第 1、5、9、13 题：[дово́лен]{.ru} + 第五格：[на́шей гру́ппой, и́ми, рабо́той, на́ми]{.ru}。第 5 题没有前置词，[и́ми]{.ru} 不加 [н-]{.ru}。
    第 2、6、10、14 题：[похо́ж на]{.ru} + 第四格：[на па́пу, на ма́му]{.ru}；复数指人同第二格：[на роди́телей]{.ru}；前置词后 [н-]{.ru}：[на него́]{.ru}。
    第 3、7、12 题：[гото́в к]{.ru} + 第三格：[к экза́мену, к пра́зднику, к уро́ку]{.ru}；第 15 题 [гото́в]{.ru} + 不定式，不定式不变。
    第 4、8、16 题：[согла́сен с]{.ru} + 第五格：[с тобо́й, с профе́ссором, с ней]{.ru}。
    第 11 题：[согла́сен на]{.ru} + 第四格“愿意接受”：[на таку́ю рабо́ту]{.ru}。
- id: B2-L25-03
  tags:
  - 短尾形容词：时间与一致
  task: 用短尾形式写出现在时、过去时和将来时的谓语。
  type: matrix
  cols:
  - 主语 + 形容词
  - 现在时
  - 过去时
  - 将来时
  given:
  - 0
  rows:
  - base: '[я + гото́вый]{.ru}'
    cells:
    - '[я + гото́вый]{.ru}'
    - '[гото́ва]{.ru}'
    - '[была́ гото́ва]{.ru}'
    - '[бу́ду гото́ва]{.ru}'
    hint: 女
  - base: '[мы + дово́льный]{.ru}'
    cells:
    - '[мы + дово́льный]{.ru}'
    - '[дово́льны]{.ru}'
    - '[бы́ли дово́льны]{.ru}'
    - '[бу́дем дово́льны]{.ru}'
  - base: '[вы + прав]{.ru}'
    cells:
    - '[вы + прав]{.ru}'
    - '[пра́вы]{.ru}'
    - '[бы́ли пра́вы]{.ru}'
    - '[бу́дете пра́вы]{.ru}'
    hint: 称呼一人
  - base: '[обе́д + гото́вый]{.ru}'
    cells:
    - '[обе́д + гото́вый]{.ru}'
    - '[гото́в]{.ru}'
    - '[был гото́в]{.ru}'
    - '[бу́дет гото́в]{.ru}'
  - base: '[окно́ + чи́стый]{.ru}'
    cells:
    - '[окно́ + чи́стый]{.ru}'
    - '[чи́сто]{.ru}'
    - '[бы́ло чи́сто]{.ru}'
    - '[бу́дет чи́сто]{.ru}'
  - base: '[ко́мната + свобо́дный]{.ru}'
    cells:
    - '[ко́мната + свобо́дный]{.ru}'
    - '[свобо́дна]{.ru}'
    - '[была́ свобо́дна]{.ru}'
    - '[бу́дет свобо́дна]{.ru}'
  - base: '[он + за́нятый]{.ru}'
    cells:
    - '[он + за́нятый]{.ru}'
    - '[за́нят]{.ru}'
    - '[был за́нят]{.ru}'
    - '[бу́дет за́нят]{.ru}'
  - base: '[они́ + согла́сен]{.ru}'
    cells:
    - '[они́ + согла́сен]{.ru}'
    - '[согла́сны]{.ru}'
    - '[бы́ли согла́сны]{.ru}'
    - '[бу́дут согла́сны]{.ru}'
  - base: '[ты + свобо́дный]{.ru}'
    cells:
    - '[ты + свобо́дный]{.ru}'
    - '[свобо́ден]{.ru}'
    - '[был свобо́ден]{.ru}'
    - '[бу́дешь свобо́ден]{.ru}'
    hint: 男
  - base: '[все о́кна + чи́стый]{.ru}'
    cells:
    - '[все о́кна + чи́стый]{.ru}'
    - '[чи́сты]{.ru}'
    - '[бы́ли чи́сты]{.ru}'
    - '[бу́дут чи́сты]{.ru}'
  - base: '[Ма́ша + за́нятый]{.ru}'
    cells:
    - '[Ма́ша + за́нятый]{.ru}'
    - '[занята́]{.ru}'
    - '[была́ занята́]{.ru}'
    - '[бу́дет занята́]{.ru}'
  - base: '[вы + гото́вый]{.ru}'
    cells:
    - '[вы + гото́вый]{.ru}'
    - '[гото́вы]{.ru}'
    - '[бы́ли гото́вы]{.ru}'
    - '[бу́дете гото́вы]{.ru}'
    hint: 称呼一人
  why: |-
    第 1–12 题：现在时不用系词；过去时、将来时加 [быть]{.ru}，[быть]{.ru} 和短尾都与主语一致：[я была́ гото́ва, мы бу́дем дово́льны, окно́ бы́ло чи́сто]{.ru}。
    第 3、12 题：用 [вы]{.ru} 称呼一个人，短尾和 [быть]{.ru} 都用复数：[Вы пра́вы. Вы бы́ли гото́вы.]{.ru}
    第 6、11 题：阴性：[свобо́дна, занята́]{.ru}；[занята́]{.ru} 重音在词尾。
    第 9 题：阳性插入元音：[свобо́ден]{.ru}。
    第 8 题：[согла́сен]{.ru} 只用短尾，复数 [согла́сны]{.ru}。
