heading: 第 28 课　过去时中体的用法
groups:
- id: B2-L28-01
  tags:
  - 过去时中体的意义
  task: 句中过去时动词表示什么？归栏。
  type: classify
  bins:
  - 结果
  - 过程
  - 反复
  - 事实
  - 结果已取消
  items:
  - text: '[Ми́ша прочита́л кни́гу и верну́л её в библиоте́ку.]{.ru}'
    answer: 结果
  - text: '[Я написа́л письмо́, вот оно́.]{.ru}'
    answer: 结果
  - text: '[Па́па откры́л окно́, и тепе́рь в ко́мнате хо́лодно.]{.ru}'
    answer: 结果
  - text: '[Ю́ми сде́лала уро́ки, тепе́рь она́ свобо́дна.]{.ru}'
    answer: 结果
  - text: '[Вчера́ Ми́ша чита́л це́лый час.]{.ru}'
    answer: 过程
  - text: '[Весь ве́чер Ван Лэй писа́л сочине́ние.]{.ru}'
    answer: 过程
  - text: '[Когда́ я вошёл, па́па чита́л газе́ту.]{.ru}'
    answer: 过程
  - text: '[Мы до́лго смотре́ли на мо́ре.]{.ru}'
    answer: 过程
  - text: '[«Ревизо́ра» он чита́л два ра́за.]{.ru}'
    answer: 反复
  - text: '[В шко́ле я ча́сто писа́л стихи́.]{.ru}'
    answer: 反复
  - text: '[Ка́ждое у́тро А́нна учи́ла но́вые слова́.]{.ru}'
    answer: 反复
  - text: '[Мы не́сколько раз смотре́ли э́тот фильм.]{.ru}'
    answer: 反复
  - text: '[— Ты чита́л «Ревизо́ра»? — Чита́л.]{.ru}'
    answer: 事实
  - text: '[Ми́ша да́же писа́л сочине́ние о Гринёве.]{.ru}'
    answer: 事实
  - text: '[— Ты учи́л неме́цкий в шко́ле? — Учи́л.]{.ru}'
    answer: 事实
  - text: '[Мы уже́ говори́ли об э́том на уро́ке.]{.ru}'
    answer: 事实
  - text: '[— Ты брал мой слова́рь? — Брал, но он уже́ на по́лке.]{.ru}'
    answer: 结果已取消
  - text: '[Кто открыва́л окно́? В ко́мнате так хо́лодно!]{.ru}'
    answer: 结果已取消
  - text: '[Я брал у А́нны зонт, вчера́ верну́л.]{.ru}'
    answer: 结果已取消
  - text: '[— Ты открыва́л мою́ су́мку? — Открыва́л, взял ру́чку.]{.ru}'
    answer: 结果已取消
  why: |-
    第 1–4 题：完成体，动作完成，结果到现在还在：书还了、信写好了、窗户开着、作业做完了。
    第 5–8 题：未完成体表示过程、持续，或某时正在进行：[це́лый час, весь ве́чер, до́лго]{.ru}，“我进来时爸爸正在看报”。
    第 9–12 题：未完成体表示反复、次数：[два ра́за, ча́сто, ка́ждое у́тро, не́сколько раз]{.ru}。
    第 13–16 题：未完成体只说“做没做过”这个事实，不关心结果。汉语说“读过了”，俄语仍用 [чита́л]{.ru}；第 16 题的 [уже́]{.ru} 不改变这一点：说的是“这件事谈过”。
    第 17–20 题：未完成体表示做过，但结果已经取消：词典放回去了，窗户关上了（所以冷），伞还了，包又关上了。
- id: B2-L28-02
  tags:
  - 过去时中体的选择
  task: 按行末的两个语境写出“他”做这件事的过去时。
  type: matrix
  cols:
  - 体对
  - 语境①
  - 语境②
  given:
  - 0
  rows:
  - base: '[чита́ть / прочита́ть]{.ru}'
    cells:
    - '[чита́ть / прочита́ть]{.ru}'
    - '[чита́л]{.ru}'
    - '[прочита́л]{.ru}'
    hint: ①读了整整一小时；②读完了
  - base: '[писа́ть / написа́ть]{.ru}'
    cells:
    - '[писа́ть / написа́ть]{.ru}'
    - '[писа́л]{.ru}'
    - '[написа́л]{.ru}'
    hint: ①写过（只说事实）；②写好了
  - base: '[де́лать / сде́лать]{.ru}'
    cells:
    - '[де́лать / сде́лать]{.ru}'
    - '[де́лал]{.ru}'
    - '[сде́лал]{.ru}'
    hint: ①做了一晚上；②做完了
  - base: '[брать / взять]{.ru}'
    cells:
    - '[брать / взять]{.ru}'
    - '[брал]{.ru}'
    - '[взял]{.ru}'
    hint: ①拿过（已经还回）；②拿走了（还在他那里）
  - base: '[открыва́ть / откры́ть]{.ru}'
    cells:
    - '[открыва́ть / откры́ть]{.ru}'
    - '[открыва́л]{.ru}'
    - '[откры́л]{.ru}'
    hint: ①开过（现在又关上了）；②打开了（现在开着）
  - base: '[учи́ть / вы́учить]{.ru}'
    cells:
    - '[учи́ть / вы́учить]{.ru}'
    - '[учи́л]{.ru}'
    - '[вы́учил]{.ru}'
    hint: ①背了很久；②背会了
  - base: '[смотре́ть / посмотре́ть]{.ru}'
    cells:
    - '[смотре́ть / посмотре́ть]{.ru}'
    - '[смотре́л]{.ru}'
    - '[посмотре́л]{.ru}'
    hint: ①看过两遍；②看完了，然后去睡觉
  - base: '[гото́вить / пригото́вить]{.ru}'
    cells:
    - '[гото́вить / пригото́вить]{.ru}'
    - '[гото́вил]{.ru}'
    - '[пригото́вил]{.ru}'
    hint: ①做饭做了两小时；②把饭做好了
  - base: '[звони́ть / позвони́ть]{.ru}'
    cells:
    - '[звони́ть / позвони́ть]{.ru}'
    - '[звони́л]{.ru}'
    - '[позвони́л]{.ru}'
    hint: ①常常打电话；②打了一次电话
  - base: '[покупа́ть / купи́ть]{.ru}'
    cells:
    - '[покупа́ть / купи́ть]{.ru}'
    - '[покупа́л]{.ru}'
    - '[купи́л]{.ru}'
    hint: ①每天都买；②买到了
  why: |-
    第 1–10 题：语境②都关心结果（完成、做成、一次），用完成体：[прочита́л, написа́л, взял, вы́учил, купи́л]{.ru}。
    第 1、3、6、8 题：语境①说持续多久，用未完成体：[чита́л, де́лал, учи́л, гото́вил]{.ru}。
    第 7、9、10 题：语境①说次数、经常，用未完成体：[смотре́л, звони́л, покупа́л]{.ru}。
    第 2 题：只说事实“写过”，用未完成体 [писа́л]{.ru}。
    第 4、5 题：结果已取消用未完成体 [брал, открыва́л]{.ru}；结果还在用完成体 [взял, откры́л]{.ru}。
- id: B2-L28-03
  tags:
  - 过去时否定句中的体
  task: 否定的意思是什么？归栏。
  type: classify
  bins:
  - 根本没做过
  - 做了，但没有结果
  items:
  - text: '[Я не чита́л э́ту пье́су.]{.ru}'
    answer: 根本没做过
  - text: '[Он никогда́ не учи́л францу́зский.]{.ru}'
    answer: 根本没做过
  - text: '[А́нна не де́лала э́то упражне́ние: его́ не задава́ли.]{.ru}'
    answer: 根本没做过
  - text: '[Я не писа́л ему́ — у меня́ нет его́ а́дреса.]{.ru}'
    answer: 根本没做过
  - text: '[Мы не смотре́ли э́тот фильм.]{.ru}'
    answer: 根本没做过
  - text: '[Ю́ми сего́дня не гото́вила у́жин: все бы́ли в кафе́.]{.ru}'
    answer: 根本没做过
  - text: '[Я ещё не прочита́л уче́бник.]{.ru}'
    answer: 做了，但没有结果
  - text: '[Ми́ша писа́л письмо́, но не написа́л.]{.ru}'
    answer: 做了，但没有结果
  - text: '[Я чита́л, чита́л и ничего́ не запо́мнил.]{.ru}'
    answer: 做了，但没有结果
  - text: '[Я учи́л стихи́, но не вы́учил.]{.ru}'
    answer: 做了，但没有结果
  - text: '[Ди́ма ещё не сде́лал дома́шнее зада́ние.]{.ru}'
    answer: 做了，但没有结果
  - text: '[Пьер реша́л зада́чу це́лый час, но не реши́л.]{.ru}'
    answer: 做了，但没有结果
  why: |-
    第 1–6 题：[не]{.ru} + 未完成体：根本没做过这件事：[не чита́л, не учи́л, не де́лала, не писа́л, не смотре́ли, не гото́вила]{.ru}。
    第 7–12 题：[не]{.ru} + 完成体：做了（或正在做），但还没达到结果：[ещё не прочита́л, не написа́л, не запо́мнил, не вы́учил, не сде́лал, не реши́л]{.ru}。常和 [ещё]{.ru}、前面的未完成体（[писа́л, но не написа́л]{.ru}）一起出现。
- id: B2-L28-04
  tags:
  - 过去时中体的选择：句中
  task: 用括号里体对中合适的动词的过去时填空。
  type: fill
  items:
  - stem: Я ___ тебе́ вчера́ три ра́за!
    hint: звони́ть / позвони́ть
    accept:
    - звони́л
  - stem: — Ты ___ упражне́ние? — Да, вот тетра́дь.
    hint: де́лать / сде́лать
    accept:
    - сде́лал
  - stem: Па́па ___ газе́ту, когда́ я пришёл.
    hint: чита́ть / прочита́ть
    accept:
    - чита́л
  - stem: Кто ___ мою́ ру́чку? Она́ лежи́т не там.
    hint: брать / взять
    accept:
    - брал
  - stem: А́нна ___ окно́, и в ко́мнате ста́ло хо́лодно.
    hint: открыва́ть / откры́ть
    accept:
    - откры́ла
  why: |-
    第 1 题：说次数（[три ра́за]{.ru}），用未完成体 [звони́л]{.ru}。
    第 2 题：关心结果（作业就在这儿），用完成体 [сде́лал]{.ru}。
    第 3 题：某时正在进行，用未完成体 [чита́л]{.ru}。
    第 4 题：笔放回去了，只是不在原处——拿过又还了，结果已取消，用未完成体 [брал]{.ru}。
    第 5 题：窗开着，所以冷，结果还在，用完成体 [откры́ла]{.ru}。
