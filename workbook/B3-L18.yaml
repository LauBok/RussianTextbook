heading: 第 18 课　否定与动词的体
groups:
- id: B3-L18-01
  lessons:
  - B3-L18
  tags:
  - 否定中的体：не на́до 类
  - 否定中的体：нельзя́ + 两种体
  - 否定中的体：否定命令式
  - 否定中的体：过去时否定
  task: 这些否定说法表示什么？归栏。
  type: classify
  bins:
  - 不必
  - 禁止
  - 做不到
  - 劝阻
  - 提醒
  - 没做过
  - 该做没做成
  items:
  - text: '[Не на́до брать зонт: дождя́ не бу́дет.]{.ru}'
    answer: 不必
  - text: '[В музе́е нельзя́ фотографи́ровать.]{.ru}'
    answer: 禁止
  - text: '[Дверь нельзя́ откры́ть: нет ключа́.]{.ru}'
    answer: 做不到
  - text: '[Не заплыва́йте далеко́!]{.ru}'
    answer: 劝阻
  - text: '[Не забу́дьте па́спорт!]{.ru}'
    answer: 提醒
  - text: '[Я никогда́ не был в Со́чи.]{.ru}'
    answer: 没做过
  - text: '[Мы жда́ли, но он так и не пришёл.]{.ru}'
    answer: 该做没做成
  - text: '[Не сто́ит покупа́ть э́ту кни́гу: она́ есть в библиоте́ке.]{.ru}'
    answer: 不必
  - text: '[Здесь нельзя́ купа́ться: э́то порт.]{.ru}'
    answer: 禁止
  - text: '[Э́тот текст нельзя́ перевести́ за час.]{.ru}'
    answer: 做不到
  - text: '[Не покупа́й э́ти ту́фли, они́ неудо́бные.]{.ru}'
    answer: 劝阻
  - text: '[Не опозда́й на по́езд!]{.ru}'
    answer: 提醒
  - text: '[Он ни ра́зу не загора́л на пля́же.]{.ru}'
    answer: 没做过
  - text: '[Я ещё не прочита́л кни́гу, кото́рую ты мне дал.]{.ru}'
    answer: 该做没做成
  - text: '[Не ну́жно приходи́ть так ра́но.]{.ru}'
    answer: 不必
  - text: '[В аудито́рии нельзя́ есть.]{.ru}'
    answer: 禁止
  - text: '[В темноте́ здесь ничего́ нельзя́ уви́деть.]{.ru}'
    answer: 做不到
  - text: '[Не звони́те ему́ так по́здно.]{.ru}'
    answer: 劝阻
  - text: '[Смотри́, не упади́!]{.ru}'
    answer: 提醒
  - text: '[— Ты звони́л ма́ме? — Нет, не звони́л.]{.ru}'
    answer: 没做过
  - text: '[Почему́ ты не позвони́л? Я ждала́ весь ве́чер!]{.ru}'
    answer: 该做没做成
  why: |-
    第 1、8、15 题：[не на́до, не сто́ит, не ну́жно]{.ru} + 未完成体不定式：不必、不值得做。
    第 2、9、16 题：[нельзя́]{.ru} + 未完成体：不允许、禁止。
    第 3、10、17 题：[нельзя́]{.ru} + 完成体：做不到（没有钥匙、一小时译不完、黑暗中看不见）。
    第 4、11、18 题：未完成体否定命令式：劝对方不要做某事。
    第 5、12、19 题：完成体否定命令式：提醒对方小心，别无意中做出不好的事（忘、迟到、摔倒）。
    第 6、13、20 题：[не]{.ru} + 未完成体过去时：动作根本没有发生，只陈述事实；[никогда́ не, ни ра́зу не]{.ru} 用未完成体。
    第 7、14、21 题：[не]{.ru} + 完成体过去时：预期的、该做的事没有做成；[так и не, ещё не]{.ru} 多用完成体。
- id: B3-L18-02
  lessons:
  - B3-L18
  tags:
  - 否定中的体：否定命令式
  task: 写出两种体的否定命令式（对 [ты]{.ru}）。
  type: matrix
  cols:
  - 体对
  - 未完成体
  - 完成体
  given:
  - 0
  rows:
  - base: '[забыва́ть / забы́ть]{.ru}'
    cells:
    - '[забыва́ть / забы́ть]{.ru}'
    - '[Не забыва́й!]{.ru}'
    - '[Не забу́дь!]{.ru}'
  - base: '[опа́здывать / опозда́ть]{.ru}'
    cells:
    - '[опа́здывать / опозда́ть]{.ru}'
    - '[Не опа́здывай!]{.ru}'
    - '[Не опозда́й!]{.ru}'
  - base: '[теря́ть / потеря́ть]{.ru}'
    cells:
    - '[теря́ть / потеря́ть]{.ru}'
    - '[Не теря́й!]{.ru}'
    - '[Не потеря́й!]{.ru}'
  - base: '[па́дать / упа́сть]{.ru}'
    cells:
    - '[па́дать / упа́сть]{.ru}'
    - '[Не па́дай!]{.ru}'
    - '[Не упади́!]{.ru}'
  - base: '[простужа́ться / простуди́ться]{.ru}'
    cells:
    - '[простужа́ться / простуди́ться]{.ru}'
    - '[Не простужа́йся!]{.ru}'
    - '[Не простуди́сь!]{.ru}'
    new: true
    gloss: 感冒
  - base: '[разбива́ть / разби́ть]{.ru}'
    cells:
    - '[разбива́ть / разби́ть]{.ru}'
    - '[Не разбива́й!]{.ru}'
    - '[Не разбе́й!]{.ru}'
    new: true
    gloss: 打碎
  - base: '[пролива́ть / проли́ть]{.ru}'
    cells:
    - '[пролива́ть / проли́ть]{.ru}'
    - '[Не пролива́й!]{.ru}'
    - '[Не проле́й!]{.ru}'
    new: true
    gloss: 洒出
  - base: '[буди́ть / разбуди́ть]{.ru}'
    cells:
    - '[буди́ть / разбуди́ть]{.ru}'
    - '[Не буди́!]{.ru}'
    - '[Не разбуди́!]{.ru}'
  - base: '[ошиба́ться / ошиби́ться]{.ru}'
    cells:
    - '[ошиба́ться / ошиби́ться]{.ru}'
    - '[Не ошиба́йся!]{.ru}'
    - '[Не ошиби́сь!]{.ru}'
  - base: '[пу́тать / перепу́тать]{.ru}'
    cells:
    - '[пу́тать / перепу́тать]{.ru}'
    - '[Не пу́тай!]{.ru}'
    - '[Не перепу́тай!]{.ru}'
    new: true
    gloss: 弄混
  why: |-
    第 1–10 题：未完成体否定命令式一般表示劝阻（[Не опа́здывай на уро́ки!]{.ru} 别老迟到），完成体否定命令式表示提醒、警告，担心对方无意中出事（[Не опозда́й на по́езд!]{.ru} 可别误了火车）。这里列出的动词都是“无意中发生的坏事”，所以两种都常用。
    第 1、4、6、7 题：命令式由将来时词干构成：[забу́дут → забу́дь]{.ru}，[упаду́т → упади́]{.ru}，[разобью́т → разбе́й]{.ru}，[пролью́t → проле́й]{.ru}（[-ей]{.ru} 形式要记）。
    第 5、9 题：[-ся]{.ru} 动词命令式元音后 [-сь]{.ru}、辅音后 [-ся]{.ru}：[простужа́йся, простуди́сь, ошиба́йся, ошиби́сь]{.ru}。
- id: B3-L18-03
  lessons:
  - B3-L18
  tags:
  - 否定中的体：句中选体
  task: 从括号里的一对动词中选一个，写出合适的形式。
  type: fill
  items:
  - stem: 'Не на́до ___ так мно́го веще́й: на мо́ре тепло́.'
    hint: брать / взять
    accept:
    - брать
  - stem: Тебе́ не сто́ит ___ э́тот фильм, он ску́чный.
    hint: смотре́ть / посмотре́ть
    accept:
    - смотре́ть
  - stem: 'Здесь нельзя́ ___ маши́ну: э́то вход в больни́цу.'
    hint: ста́вить / поста́вить
    accept:
    - ста́вить
  - stem: На экза́мене нельзя́ ___ словарём.
    hint: по́льзоваться / воспо́льзоваться
    accept:
    - по́льзоваться
    new: true
    gloss: 使用
  - stem: 'Э́ту зада́чу нельзя́ ___ без компью́тера: сли́шком мно́го ци́фр.'
    hint: реша́ть / реши́ть
    accept:
    - реши́ть
  - stem: Нельзя́ ___ ты́сячу слов за оди́н день.
    hint: запомина́ть / запо́мнить
    accept:
    - запо́мнить
  - stem: Де́ти, не ___ на дива́н в гря́зной оде́жде!
    hint: сади́ться / сесть
    accept:
    - сади́тесь
  - stem: 'Ми́ша, не ___ так гро́мко: ба́бушка спит.'
    hint: говори́ть / сказа́ть
    accept:
    - говори́
  - stem: Не ___ ключи́, когда́ бу́дете уходи́ть!
    hint: забыва́ть / забы́ть
    accept:
    - забу́дьте
  - stem: По́езд в семь утра́. Смотри́, не ___!
    hint: опа́здывать / опозда́ть
    accept:
    - опозда́й
  - stem: Всю неде́лю шёл дождь, и я ни ра́зу не ___ в мо́ре.
    hint: купа́ться / искупа́ться
    accept:
    - купа́лся
  - stem: Я никогда́ не ___ кра́сную икру́.
    hint: про́бовать / попро́бовать
    accept:
    - про́бовал
  - stem: Мы жда́ли весь ве́чер, но она́ так и не ___.
    hint: звони́ть / позвони́ть
    accept:
    - позвони́ла
  - stem: Уже́ де́сять часо́в, а А́нна ещё не ___ из университе́та.
    hint: возвраща́ться / верну́ться
    accept:
    - верну́лась
  - stem: Не на́до ___ мне по́мощь, я сам спра́влюсь.
    hint: предлага́ть / предложи́ть
    accept:
    - предлага́ть
  - stem: В Росси́и нельзя́ ___ у́лицу на кра́сный свет.
    hint: переходи́ть / перейти́
    accept:
    - переходи́ть
  - stem: Я спра́шивал не́сколько раз, но он так и не ___ мне, где живёт.
    hint: говори́ть / сказа́ть
    accept:
    - сказа́л
  - stem: Мы ни ра́зу не ___ в э́том рестора́не.
    hint: обе́дать / пообе́дать
    accept:
    - обе́дали
  why: |-
    第 1、2、15 题：[не на́до, не сто́ит]{.ru} + 未完成体：[брать, смотре́ть, предлага́ть]{.ru}，不说 [не на́до взять]{.ru}。
    第 3、4、16 题：禁止：[нельзя́]{.ru} + 未完成体：[ста́вить, по́льзоваться, переходи́ть]{.ru}。
    第 5、6 题：做不到：[нельзя́]{.ru} + 完成体：[реши́ть, запо́мнить]{.ru}（数字太多、一天记不住）。
    第 7、8 题：劝阻：未完成体否定命令式：[не сади́тесь]{.ru}（对孩子们，复数），[не говори́]{.ru}（对 [Ми́ша]{.ru}，单数）。
    第 9、10 题：提醒：完成体否定命令式：[не забу́дьте, не опозда́й]{.ru}。
    第 11、12、18 题：[ни ра́зу не, никогда́ не]{.ru} + 未完成体过去时：[не купа́лся, не про́бовал, не обе́дали]{.ru}。
    第 13、14、17 题：[так и не, ещё не]{.ru} + 完成体过去时，该发生的没有发生：[не позвони́ла, не верну́лась, не сказа́л]{.ru}，与主语一致。
