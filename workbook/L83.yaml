heading: 第 83 课　е́сли 条件句
groups:
- id: L83-01
  tags:
  - е́сли 条件句：将来、规律与命令式
  task: 判断 [е́сли]{.ru} 条件句说的是哪一类情况。
  type: classify
  bins:
  - 将来的某一次
  - 经常的规律
  - 提出建议或要求
  items:
  - text: Е́сли за́втра бу́дет дождь, мы бу́дем до́ма.
    answer: 将来的某一次
  - text: Е́сли идёт дождь, я сижу́ до́ма.
    answer: 经常的规律
  - text: Е́сли пойдёте в го́род, возьми́те зонт.
    answer: 提出建议或要求
  - text: Е́сли бу́дет хо́лодно, наде́нь ку́ртку.
    answer: 提出建议或要求
  - text: Е́сли я вы́пью горя́чий чай, всё бу́дет хорошо́.
    answer: 将来的某一次
  - text: Е́сли Ми́ша мно́го игра́ет в футбо́л, он устаёт.
    answer: 经常的规律
  - text: Е́сли ты заболе́ешь, ты бу́дешь лежа́ть в посте́ли.
    answer: 将来的某一次
  - text: Е́сли у тебя́ бу́дет вре́мя, позвони́ мне.
    answer: 提出建议或要求
  - text: Е́сли ма́ма до́ма, мы у́жинаем вме́сте.
    answer: 经常的规律
  - text: Е́сли в суббо́ту бу́дет хоро́шая пого́да, мы пое́дем на да́чу.
    answer: 将来的某一次
  - text: Е́сли вы уста́нете, ложи́тесь спать.
    answer: 提出建议或要求
  - text: Е́сли Ван Лэй не успева́ет поза́втракать, он покупа́ет пирожо́к.
    answer: 经常的规律
  - text: Е́сли А́нна вста́нет ра́но, она́ позвони́т тебе́.
    answer: 将来的某一次
  - text: Е́сли бу́дет мо́крый снег, не е́здите на маши́не.
    answer: 提出建议或要求
  - text: Е́сли на у́лице о́чень хо́лодно, де́ти не гуля́ют.
    answer: 经常的规律
  - text: Е́сли ты ку́пишь лы́жи, мы бу́дем ката́ться вме́сте.
    answer: 将来的某一次
  - text: Е́сли ты пойдёшь в магази́н, купи́ хлеб.
    answer: 提出建议或要求
  - text: Е́сли я мно́го рабо́таю, я пло́хо сплю.
    answer: 经常的规律
  why: '第 1、5、7、10、13、16 题：两部分都是将来时（[бу́дет — бу́дем, вы́пью — бу́дет, вста́нет — позвони́т]{.ru}），说的是将来可能发生的一次。

    第 2、6、9、12、15、18 题：两部分都是现在时（[идёт — сижу́, игра́ет — устаёт]{.ru}），说的是“每逢……就……”的规律。第 9、15 题没有动词，现在时省去 [есть]{.ru}。

    第 3、4、8、11、14、17 题：主句是命令式（[возьми́те, наде́нь, позвони́, ложи́тесь, не е́здите, купи́]{.ru}），在条件之后提出建议或要求；从句仍用将来时。'
- id: L83-02
  tags:
  - е́сли 条件句：从句动词的时
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Е́сли за́втра ___ дождь, мы бу́дем до́ма.
    hint: быть
    accept:
    - бу́дет
  - stem: Е́сли ___ дождь, я всегда́ сижу́ до́ма.
    hint: идти́
    accept:
    - идёт
  - stem: Е́сли ты ___, ты бу́дешь лежа́ть в посте́ли.
    hint: заболе́ть
    accept:
    - заболе́ешь
  - stem: Ми́ша, е́сли бу́дет хо́лодно, ___ ку́ртку!
    hint: наде́ть
    accept:
    - наде́нь
  - stem: Е́сли в суббо́ту ___ хоро́шая пого́да, мы пое́дем на да́чу.
    hint: быть
    accept:
    - бу́дет
  - stem: Е́сли я ___ горя́чий чай, всё бу́дет хорошо́.
    hint: вы́пить
    accept:
    - вы́пью
  - stem: Е́сли Ми́ша мно́го ___ в футбо́л, он устаёт.
    hint: игра́ть
    accept:
    - игра́ет
  - stem: Ребя́та, е́сли пойдёте в го́род, ___ зонт!
    hint: взять
    accept:
    - возьми́те
  - stem: Е́сли вы ___ в Петербу́рг, позвони́те нам.
    hint: пое́хать
    accept:
    - пое́дете
  - stem: Е́сли ты ___ ра́но, позвони́ мне.
    hint: встать
    accept:
    - вста́нешь
  - stem: Е́сли за́втра бу́дет хо́лодно, мы ___ до́ма.
    hint: сиде́ть
    accept:
    - бу́дем сиде́ть
  - stem: Е́сли я уста́ну, я ___ домо́й.
    hint: пое́хать
    accept:
    - пое́ду
  - stem: Е́сли па́па ___ ра́но, мы у́жинаем вме́сте.
    hint: возвраща́ться
    accept:
    - возвраща́ется
  - stem: Е́сли ты ___ в магази́н, купи́ хлеб.
    hint: пойти́
    accept:
    - пойдёшь
  - stem: Е́сли Ван Лэй не ___ поза́втракать, он покупа́ет пирожо́к.
    hint: успева́ть
    accept:
    - успева́ет
  - stem: Е́сли ты не ___ шарф, ты замёрзнешь.
    hint: наде́ть
    accept:
    - наде́нешь
  - stem: Е́сли у меня́ ___ вре́мя, я позвоню́ тебе́.
    hint: быть
    accept:
    - бу́дет
  - stem: Е́сли ба́бушка ___, мы пое́дем к ней.
    hint: заболе́ть
    accept:
    - заболе́ет
  - stem: Е́сли вы бу́дете в Москве́, ___ нам!
    hint: позвони́ть
    accept:
    - позвони́те
  - stem: Е́сли на у́лице хо́лодно, Ми́ша ___ ша́пку.
    hint: брать
    accept:
    - берёт
  why: '第 1、3、5、6、9、10、12、14、16、17、18 题：另一部分是将来时或命令式，说的是将来的一次，从句用将来时：[бу́дет, заболе́ешь, вы́пью, пое́дете, вста́нешь, пойдёшь, наде́нешь, заболе́ет]{.ru}。第 1、5、17 题没有别的动词，[бу́дет]{.ru} 不能省。

    第 11 题：主句说“待在家里”这段时间的状态，用未完成体将来时 [бу́дем сиде́ть]{.ru}。第 12 题主句用完成体将来时 [пое́ду]{.ru}。

    第 2、7、13、15、20 题：另一部分是现在时（[сижу́, устаёт, у́жинаем, покупа́ет]{.ru}）或没有动词的现在时（[хо́лодно]{.ru}），是经常的规律，这一部分也用现在时：第 20 题 [брать]{.ru} 现在时 [берёт]{.ru}。

    第 4、8、19 题：主句提出要求，用命令式：对米沙一个人用 [наде́нь]{.ru}，对 [ребя́та]{.ru}、[вы]{.ru} 用 [возьми́те, позвони́те]{.ru}。'
- id: L83-03
  tags:
  - е́сли 条件句：两分句时态配合核查
  task: 判断句子是否正确。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Е́сли за́втра бу́дет дождь, мы бу́дем до́ма.
    answer: 正确
  - text: Е́сли за́втра идёт дождь, мы бу́дем до́ма.
    answer: 有错
  - text: Е́сли хоро́шая пого́да, мы пое́дем на да́чу.
    answer: 有错
  - text: Е́сли ты заболе́ешь, ты бу́дешь лежа́ть в посте́ли.
    answer: 正确
  - text: Е́сли я пью горя́чий чай, всё бу́дет хорошо́.
    answer: 有错
  - text: Е́сли идёт дождь, я сижу́ до́ма.
    answer: 正确
  - text: Е́сли бу́дет хо́лодно, наде́нь ку́ртку.
    answer: 正确
  - text: Е́сли у меня́ есть вре́мя за́втра, я позвоню́ тебе́.
    answer: 有错
  - text: Е́сли ты вста́нешь ра́но, мы успе́ем на по́езд.
    answer: 正确
  - text: Е́сли Ми́ша сде́лает уро́ки, он бу́дет игра́ть в футбо́л.
    answer: 正确
  - text: Е́сли за́втра я за́втракаю ра́но, я позвоню́ тебе́.
    answer: 有错
  - text: Е́сли бу́дет снег, мы бу́дем ката́ться на лы́жах.
    answer: 正确
  - text: Е́сли в суббо́ту хо́лодно, мы бу́дем сиде́ть до́ма.
    answer: 有错
  - text: Е́сли ты уста́нешь, ложи́сь спать.
    answer: 正确
  - text: Е́сли ты пойдёшь в магази́н, покупа́ешь хлеб.
    answer: 有错
  - text: Е́сли за́втра Пьер звони́т, я скажу́ ему́ о конце́рте.
    answer: 有错
  why: '第 1、4、6、7、9、10、12、14 题：配合正确：将来的一次两部分都用将来时（或主句用命令式），规律两部分都用现在时。

    第 2、5、11、16 题：说的是将来的一次（[за́втра]{.ru}，主句将来时），从句却用了现在时，应改为 [пойдёт]{.ru}（或 [бу́дет идти́]{.ru}）、[вы́пью]{.ru}、[поза́втракаю]{.ru}、[позвони́т]{.ru}。

    第 3、8、13 题：从句没有动词或用了 [есть]{.ru}，说将来要加 [бу́дет]{.ru}：[Е́сли бу́дет хоро́шая пого́да…]{.ru}，[Е́сли у меня́ бу́дет вре́мя…]{.ru}，[Е́сли в суббо́ту бу́дет хо́лодно…]{.ru}

    第 15 题：从句是将来时，主句用现在时 [покупа́ешь]{.ru} 不配合，应改为命令式 [купи́]{.ru}（或将来时 [ку́пишь]{.ru}）。'
