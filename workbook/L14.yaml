  why: '第 1–6 题：[жить]{.ru} 现在时词干是 [жив-]{.ru}，重音在词尾：[живу́, живёшь, живу́т]{.ru}。

    第 7–12 题：[писа́ть]{.ru} 现在时 [с]{.ru} 变 [ш]{.ru}，重音从第二人称起前移：[пишу́, пи́шешь, пи́шут]{.ru}。

    第 13、14 题：[пла́кать]{.ru} 的 [к]{.ru} 变 [ч]{.ru}：[пла́чу, пла́чешь, пла́чет]{.ru}。

    第 15–20 题：同上，[жить]{.ru} 用 [жив-]{.ru}，[писа́ть]{.ru} 用 [пиш-]{.ru}，[пла́кать]{.ru} 用 [плач-]{.ru}。'
- id: L14-03
  tags:
  - 第一变位：规则与词干变化归类
  task: 按现在时词干是否变化把动词归类。
  type: classify
  bins:
  - 词干不变
  - 词干变化
  items:
  - text: чита́ть
    answer: 词干不变
  - text: жить
    answer: 词干变化
  - text: писа́ть
    answer: 词干变化
  - text: де́лать
    answer: 词干不变
  - text: пла́кать
    answer: 词干变化
  - text: гуля́ть
    answer: 词干不变
  - text: рабо́тать
    answer: 词干不变
  - text: слу́шать
    answer: 词干不变
  - text: отдыха́ть
    answer: 词干不变
  - text: понима́ть
    answer: 词干不变
  - text: зна́ть
    answer: 词干不变
  - text: ду́мать
    answer: 词干不变
  why: '第 2、3、5 题：[жить → живу́]{.ru}、[писа́ть → пишу́]{.ru}、[пла́кать → пла́чу]{.ru}，现在时词干和不定式不同，要单独记。

    其余各题：去掉 [-ть]{.ru} 直接加第一变位词尾：[чита́ю, де́лаю, гуля́ю]{.ru}。'
