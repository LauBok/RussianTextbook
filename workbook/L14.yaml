heading: 第 14 课　词干变化的第一变位
groups:
- id: L14-01
  tags:
  - 词干变化的第一变位：六个人称
  task: 词干变化的第一变位动词：按提示的第一、二人称写出六个现在时形式。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[он / она́]{.ru}'
  - '[мы]{.ru}'
  - '[вы]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[жить]{.ru}'
    cells:
    - '[жить]{.ru}'
    - '[живу́]{.ru}'
    - '[живёшь]{.ru}'
    - '[живёт]{.ru}'
    - '[живём]{.ru}'
    - '[живёте]{.ru}'
    - '[живу́т]{.ru}'
    hint: '[живу́, живёшь]{.ru}'
  - base: '[писа́ть]{.ru}'
    cells:
    - '[писа́ть]{.ru}'
    - '[пишу́]{.ru}'
    - '[пи́шешь]{.ru}'
    - '[пи́шет]{.ru}'
    - '[пи́шем]{.ru}'
    - '[пи́шете]{.ru}'
    - '[пи́шут]{.ru}'
    hint: '[пишу́, пи́шешь]{.ru}'
  - base: '[звать]{.ru}'
    cells:
    - '[звать]{.ru}'
    - '[зову́]{.ru}'
    - '[зовёшь]{.ru}'
    - '[зовёт]{.ru}'
    - '[зовём]{.ru}'
    - '[зовёте]{.ru}'
    - '[зову́т]{.ru}'
    hint: '[зову́, зовёшь]{.ru}'
  - base: '[пла́кать]{.ru}'
    cells:
    - '[пла́кать]{.ru}'
    - '[пла́чу]{.ru}'
    - '[пла́чешь]{.ru}'
    - '[пла́чет]{.ru}'
    - '[пла́чем]{.ru}'
    - '[пла́чете]{.ru}'
    - '[пла́чут]{.ru}'
    hint: '[пла́чу, пла́чешь]{.ru}'
    new: true
    gloss: 哭
  - base: '[иска́ть]{.ru}'
    cells:
    - '[иска́ть]{.ru}'
    - '[ищу́]{.ru}'
    - '[и́щешь]{.ru}'
    - '[и́щет]{.ru}'
    - '[и́щем]{.ru}'
    - '[и́щете]{.ru}'
    - '[и́щут]{.ru}'
    hint: '[ищу́, и́щешь]{.ru}'
    new: true
    gloss: 找
  - base: '[ждать]{.ru}'
    cells:
    - '[ждать]{.ru}'
    - '[жду]{.ru}'
    - '[ждёшь]{.ru}'
    - '[ждёт]{.ru}'
    - '[ждём]{.ru}'
    - '[ждёте]{.ru}'
    - '[ждут]{.ru}'
    hint: '[жду, ждёшь]{.ru}'
    new: true
    gloss: 等
  - base: '[ре́зать]{.ru}'
    cells:
    - '[ре́зать]{.ru}'
    - '[ре́жу]{.ru}'
    - '[ре́жешь]{.ru}'
    - '[ре́жет]{.ru}'
    - '[ре́жем]{.ru}'
    - '[ре́жете]{.ru}'
    - '[ре́жут]{.ru}'
    hint: '[ре́жу, ре́жешь]{.ru}'
    new: true
    gloss: 切
  why: |-
    各题都用提示里的现在时词干（[жив-, пиш-, зов-, плач-, ищ-, жд-, реж-]{.ru}）贯穿六个人称；词干以辅音结尾，[я]{.ru} 用 [-у]{.ru}，[они́]{.ru} 用 [-ут]{.ru}。
    第 1、3、6 题：重音一直在词尾，词尾的 [е]{.ru} 写成 [ё]{.ru}：[живёшь, живёт, живу́т]{.ru}；[зовёшь, зову́т]{.ru}；[ждёшь, ждут]{.ru}（[жду, ждут]{.ru} 只有一个音节，不标重音）。
    第 2、5 题：第一人称重音在词尾，从 [ты]{.ru} 起移到词干：[пишу́, пи́шешь, пи́шут]{.ru}；[ищу́, и́щешь, и́щут]{.ru}。
    第 4、7 题：重音一直在词干：[пла́чу, пла́чешь, пла́чут]{.ru}；[ре́жу, ре́жешь, ре́жут]{.ru}。
- id: L14-02
  tags:
  - 第一变位：规则词干与变化词干对照
  task: 规则动词和词干变化的动词混合：写出 [я]{.ru}、[ты]{.ru}、[они́]{.ru} 三个形式。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[чита́ть]{.ru}'
    cells:
    - '[чита́ть]{.ru}'
    - '[чита́ю]{.ru}'
    - '[чита́ешь]{.ru}'
    - '[чита́ют]{.ru}'
  - base: '[жить]{.ru}'
    cells:
    - '[жить]{.ru}'
    - '[живу́]{.ru}'
    - '[живёшь]{.ru}'
    - '[живу́т]{.ru}'
  - base: '[де́лать]{.ru}'
    cells:
    - '[де́лать]{.ru}'
    - '[де́лаю]{.ru}'
    - '[де́лаешь]{.ru}'
    - '[де́лают]{.ru}'
  - base: '[писа́ть]{.ru}'
    cells:
    - '[писа́ть]{.ru}'
    - '[пишу́]{.ru}'
    - '[пи́шешь]{.ru}'
    - '[пи́шут]{.ru}'
  - base: '[спра́шивать]{.ru}'
    cells:
    - '[спра́шивать]{.ru}'
    - '[спра́шиваю]{.ru}'
    - '[спра́шиваешь]{.ru}'
    - '[спра́шивают]{.ru}'
  - base: '[звать]{.ru}'
    cells:
    - '[звать]{.ru}'
    - '[зову́]{.ru}'
    - '[зовёшь]{.ru}'
    - '[зову́т]{.ru}'
  - base: '[расска́зывать]{.ru}'
    cells:
    - '[расска́зывать]{.ru}'
    - '[расска́зываю]{.ru}'
    - '[расска́зываешь]{.ru}'
    - '[расска́зывают]{.ru}'
  - base: '[ду́мать]{.ru}'
    cells:
    - '[ду́мать]{.ru}'
    - '[ду́маю]{.ru}'
    - '[ду́маешь]{.ru}'
    - '[ду́мают]{.ru}'
  - base: '[пла́кать]{.ru}'
    cells:
    - '[пла́кать]{.ru}'
    - '[пла́чу]{.ru}'
    - '[пла́чешь]{.ru}'
    - '[пла́чут]{.ru}'
    hint: '[пла́чу]{.ru}'
    new: true
    gloss: 哭
  - base: '[понима́ть]{.ru}'
    cells:
    - '[понима́ть]{.ru}'
    - '[понима́ю]{.ru}'
    - '[понима́ешь]{.ru}'
    - '[понима́ют]{.ru}'
  - base: '[изуча́ть]{.ru}'
    cells:
    - '[изуча́ть]{.ru}'
    - '[изуча́ю]{.ru}'
    - '[изуча́ешь]{.ru}'
    - '[изуча́ют]{.ru}'
    new: true
    gloss: 学习，研究
  - base: '[иска́ть]{.ru}'
    cells:
    - '[иска́ть]{.ru}'
    - '[ищу́]{.ru}'
    - '[и́щешь]{.ru}'
    - '[и́щут]{.ru}'
    hint: '[ищу́]{.ru}'
    new: true
    gloss: 找
  why: |-
    第 1、3、5、7、8、10、11 题：规则动词词干以元音 [а]{.ru} 结尾，用 [-ю, -ешь, -ют]{.ru}：[чита́ю, спра́шиваешь, расска́зывают, изуча́ют]{.ru}。
    第 2 题：[жить]{.ru}：词干 [жив-]{.ru} 以辅音结尾，用 [-у, -ёшь, -ут]{.ru}：[живу́, живёшь, живу́т]{.ru}，不是 [живю́т]{.ru}。
    第 4 题：[писа́ть]{.ru}：[с]{.ru} 换成 [ш]{.ru}，[пишу́, пи́шешь, пи́шут]{.ru}；按 [чита́ть]{.ru} 写成 [писа́ю]{.ru} 是典型错误。
    第 6 题：[звать]{.ru}：词干 [зов-]{.ru}：[зову́, зовёшь, зову́т]{.ru}。
    第 9 题：[пла́кать]{.ru}：[к]{.ru} 换成 [ч]{.ru}，[пла́чу, пла́чешь, пла́чут]{.ru}。
    第 12 题：[иска́ть]{.ru}：[ск]{.ru} 换成 [щ]{.ru}，重音从 [ты]{.ru} 起前移：[ищу́, и́щешь, и́щут]{.ru}。
- id: L14-03
  tags:
  - 词干变化的第一变位：辅音交替与重音核查
  task: 每个形式在词干、词尾或重音上有一处错误，写出正确的动词形式。
  type: matrix
  cols:
  - 有错的形式
  - 正确的动词
  given:
  - 0
  rows:
  - base: '[я писа́ю]{.ru}'
    cells:
    - '[я писа́ю]{.ru}'
    - '[пишу́]{.ru}'
  - base: '[они́ пи́шют]{.ru}'
    cells:
    - '[они́ пи́шют]{.ru}'
    - '[пи́шут]{.ru}'
  - base: '[я пи́шу]{.ru}'
    cells:
    - '[я пи́шу]{.ru}'
    - '[пишу́]{.ru}'
  - base: '[он пише́т]{.ru}'
    cells:
    - '[он пише́т]{.ru}'
    - '[пи́шет]{.ru}'
  - base: '[они́ живю́т]{.ru}'
    cells:
    - '[они́ живю́т]{.ru}'
    - '[живу́т]{.ru}'
  - base: '[я жи́ву]{.ru}'
    cells:
    - '[я жи́ву]{.ru}'
    - '[живу́]{.ru}'
  - base: '[ты живи́шь]{.ru}'
    cells:
    - '[ты живи́шь]{.ru}'
    - '[живёшь]{.ru}'
  - base: '[я зва́ю]{.ru}'
    cells:
    - '[я зва́ю]{.ru}'
    - '[зову́]{.ru}'
  - base: '[они́ зову́ют]{.ru}'
    cells:
    - '[они́ зову́ют]{.ru}'
    - '[зову́т]{.ru}'
  - base: '[я пла́каю]{.ru}'
    cells:
    - '[я пла́каю]{.ru}'
    - '[пла́чу]{.ru}'
  - base: '[они́ и́скают]{.ru}'
    cells:
    - '[они́ и́скают]{.ru}'
    - '[и́щут]{.ru}'
  - base: '[мы пи́шим]{.ru}'
    cells:
    - '[мы пи́шим]{.ru}'
    - '[пи́шем]{.ru}'
  why: |-
    第 1、8、10、11 题：现在时词干要变，不能直接在不定式词干上加 [-ю]{.ru}：[пишу́, зову́, пла́чу, и́щут]{.ru}。
    第 2、5、9 题：词干以辅音结尾，[они́]{.ru} 用 [-ут]{.ru}：[пи́шут, живу́т, зову́т]{.ru}。
    第 3、4、6 题：重音错了：[пишу́]{.ru} 重音在词尾，[пи́шет]{.ru} 在词干；[живу́]{.ru} 在词尾。
    第 7、12 题：这些是第一变位，词尾元音是 [е / ё]{.ru}，不是第二变位的 [и]{.ru}：[живёшь, пи́шем]{.ru}。
- id: L14-04
  tags:
  - 词干变化的第一变位：更换主语
  task: 按主语写出括号里动词的现在时（规则动词和词干变化动词混合）。
  type: fill
  items:
  - stem: Я ___ в Москве́.
    hint: жить
    accept:
    - живу́
  - stem: Где ты ___?
    hint: жить
    accept:
    - живёшь
  - stem: Ю́ми ___ в общежи́тии.
    hint: жить
    accept:
    - живёт
  - stem: Мои́ роди́тели ___ в Кита́е.
    hint: жить
    accept:
    - живу́т
  - stem: Я ___ письмо́.
    hint: писа́ть
    accept:
    - пишу́
  - stem: Что ты ___?
    hint: писа́ть
    accept:
    - пи́шешь
  - stem: А́нна ___ упражне́ние.
    hint: писа́ть
    accept:
    - пи́шет
  - stem: Мы ___ о Москве́.
    hint: писа́ть
    accept:
    - пи́шем
  - stem: Студе́нты ___ упражне́ние.
    hint: писа́ть
    accept:
    - пи́шут
  - stem: Ба́бушка ___ на да́че.
    hint: жить
    accept:
    - живёт
  - stem: Вы ___ далеко́?
    hint: жить
    accept:
    - живёте
  - stem: Я ___, а ты пи́шешь.
    hint: чита́ть
    accept:
    - чита́ю
  - stem: Мы ___ бли́зко.
    hint: жить
    accept:
    - живём
  - stem: Ми́ша ___ уро́ки.
    hint: де́лать
    accept:
    - де́лает
  - stem: Вы ___ по-ру́сски?
    hint: писа́ть
    accept:
    - пи́шете
  - stem: Они́ ___ о Кита́е.
    hint: спра́шивать
    accept:
    - спра́шивают
  why: |-
    第 1–4、10、11、13 题：[жить]{.ru} 用词干 [жив-]{.ru}，重音在词尾：[живу́, живёшь, живёт, живём, живёте, живу́т]{.ru}。
    第 5 题：[писа́ть]{.ru} 第一人称重音在词尾：[пишу́]{.ru}。
    第 6–9、15 题：其余人称重音在词干：[пи́шешь, пи́шет, пи́шем, пи́шете, пи́шут]{.ru}。
    第 12、14、16 题：规则动词照常变位：[чита́ю, де́лает, спра́шивают]{.ru}。
