  why: |
    第 1–12 题：先认百位：[две́сти]{.ru} 200，[три́ста]{.ru} 300，[четы́реста]{.ru} 400，[пятьсо́т]{.ru} 500……[девятьсо́т]{.ru} 900；再认十位和个位。
    第 6 题：[семьсо́т семь]{.ru} 中间没有十位，写 707。
    第 9、10 题：[се́мьдесят]{.ru} 70 和 [шестьдеся́т]{.ru} 60 容易混：[се́мьдесят]{.ru} 重音在前，[шестьдеся́т]{.ru} 重音在后。
    第 3、7、8、11、12 题：[-на́дцать]{.ru} 是 11–19：[оди́ннадцать]{.ru} 11，[двена́дцать]{.ru} 12，[девятна́дцать]{.ru} 19。
