  why: |
    第 2 题：200 是 [две́сти]{.ru}，要单独记。第 9、11 题：300、400 是 [три́ста, четы́реста]{.ru}，重音在前面。第 12–17 题：500–900 是 [-со́т]{.ru}，中间保留 [ь]{.ru}：[пятьсо́т, шестьсо́т, семьсо́т, восемьсо́т, девятьсо́т]{.ru}。
    第 3–17 题：合成数词按位依次说出，中间不加 [и]{.ru}：[три́ста со́рок пять]{.ru}。
    第 3、7、13 题：最后一个词是 [оди́н]{.ru}，用 [рубль]{.ru}。
    第 4、8、12、17 题：最后一个词是 [два, три, четы́ре]{.ru}，用 [рубля́]{.ru}。
    第 5、6、11、16 题：11–14 的最后一个词是 [оди́ннадцать … четы́рнадцать]{.ru}，不是 [оди́н … четы́ре]{.ru}，用 [рубле́й]{.ru}。这是最容易错的一组。
    第 1、2、9、10、14、15、18 题：其他数词和 [ты́сяча]{.ru} 后用 [рубле́й]{.ru}。
- id: L78-02
  tags:
  - 数词与 рубль 的形式：11–14 结尾
  task: 数字后面的 [рубль]{.ru} 用哪个形式？把数字归类。
  type: classify
  bins:
  - '[рубль]{.ru}'
  - '[рубля́]{.ru}'
  - '[рубле́й]{.ru}'
