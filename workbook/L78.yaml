- id: L78-05
  tags:
  - 价格表达：стоить 的配合
  task: 按主语写出 [сто́ить]{.ru} 的形式。
  type: fill
  items:
  - stem: Ско́лько ___ э́та матрёшка?
    hint: '[сто́ить]{.ru}，现在时'
    accept:
    - сто́ит
  - stem: Ско́лько ___ блины́?
    hint: '[сто́ить]{.ru}，现在时'
    accept:
    - сто́ят
  - stem: Матрёшка ___ четы́реста рубле́й.
    hint: '[сто́ить]{.ru}，过去时'
    accept:
    - сто́ила
  - stem: Чай ___ две́сти рубле́й.
    hint: '[сто́ить]{.ru}，过去时'
    accept:
    - сто́ил
  - stem: Блины́ ___ три́ста два́дцать рубле́й.
    hint: '[сто́ить]{.ru}，过去时'
    accept:
    - сто́или
  - stem: Э́тот плато́к ___ пятьсо́т рубле́й.
    hint: '[сто́ить]{.ru}，现在时'
    accept:
    - сто́ит
  - stem: Ско́лько ___ э́ти сувени́ры?
    hint: '[сто́ить]{.ru}，现在时'
    accept:
    - сто́ят
  - stem: Моро́женое ___ сто рубле́й.
    hint: '[сто́ить]{.ru}，过去时'
    accept:
    - сто́ило
  - stem: Ско́лько ___ твоя́ ша́пка?
    hint: '[сто́ить]{.ru}，过去时'
    accept:
    - сто́ила
  - stem: Биле́ты в теа́тр ___ девятьсо́т рубле́й.
    hint: '[сто́ить]{.ru}，过去时'
    accept:
    - сто́или
  why: |
    第 1、6 题：一样东西（单数主语）用 [сто́ит]{.ru}。第 2、7 题：复数主语用 [сто́ят]{.ru}。
    第 3、9 题：阴性主语过去时 [сто́ила]{.ru}；第 4 题阳性 [сто́ил]{.ru}；第 8 题中性 [моро́женое]{.ru} 用 [сто́ило]{.ru}；第 5、10 题复数 [сто́или]{.ru}。
    [сто́ить]{.ru} 跟东西一致，不跟钱数一致。
- id: L78-06
  tags:
  - 数词与 рубль 的形式：11–14 结尾
  task: 写出 [рубль]{.ru} 的正确形式。
  type: fill
  items:
  - stem: Сувени́р сто́ит две́сти два ___.
    hint: рубль
    accept:
    - рубля́
  - stem: Плато́к сто́ит семьсо́т ___.
    hint: рубль
    accept:
    - рубле́й
  - stem: Ко́фе сто́ит сто оди́ннадцать ___.
    hint: рубль
    accept:
    - рубле́й
  - stem: Ша́пка сто́ит девятьсо́т девяно́сто оди́н ___.
    hint: рубль
    accept:
    - рубль
  - stem: Чай сто́ил сто четы́рнадцать ___.
    hint: рубль
    accept:
    - рубле́й
  - stem: Кни́га сто́ит три́ста со́рок три ___.
    hint: рубль
    accept:
    - рубля́
  - stem: Сувени́р сто́ит восемьсо́т ___.
    hint: рубль
    accept:
    - рубле́й
  - stem: Сала́т сто́ил две́сти два́дцать оди́н ___.
    hint: рубль
    accept:
    - рубль
  - stem: Моро́женое сто́ит сто двена́дцать ___.
    hint: рубль
    accept:
    - рубле́й
  - stem: Матрёшка сто́ила пятьсо́т четы́ре ___.
    hint: рубль
    accept:
    - рубля́
  why: |
    第 1、6、10 题：最后一个词是 [два, три, четы́ре]{.ru}：[рубля́]{.ru}。
    第 4、8 题：最后一个词是 [оди́н]{.ru}：[рубль]{.ru}。
    第 3、5、9 题：最后一个词是 [оди́ннадцать, четы́рнадцать, двена́дцать]{.ru}：[рубле́й]{.ru}，不要看见 [-два, -четы́ре]{.ru} 的字形就写 [рубля́]{.ru}。
    第 2、7 题：整百：[рубле́й]{.ru}。
