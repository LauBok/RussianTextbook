  - text: '[122]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[444]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[311]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[502]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[960]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[271]{.ru}'
    answer: '[рубль]{.ru}'
  - text: '[119]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[833]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[400]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[101]{.ru}'
    answer: '[рубль]{.ru}'
  why: |
    第 1、5、9、16、20 题：最后一位是 1（不是 11）：[рубль]{.ru}，如 [две́сти три́дцать оди́н рубль]{.ru}。
    第 3、7、11、12、14、18 题：最后一位是 2、3、4（不是 12–14）：[рубля́]{.ru}。
    第 2、6、10、13、17 题：以 11–19 结尾，最后一个词是 [двена́дцать, четы́рнадцать, трина́дцать, оди́ннадцать, девятна́дцать]{.ru}：[рубле́й]{.ru}。
    第 4、8、15、19 题：整百、整十和 [ты́сяча]{.ru}：[рубле́й]{.ru}。
