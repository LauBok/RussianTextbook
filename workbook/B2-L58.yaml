    - '[друг дру́гу]{.ru}'
  - base: '[говори́ть о]{.ru}'
    cells:
    - '[говори́ть о]{.ru}'
    - '[друг о дру́ге]{.ru}'
  - base: '[ждать]{.ru}'
    cells:
    - '[ждать]{.ru}'
    - '[друг дру́га]{.ru}'
  - base: '[звони́ть]{.ru}'
    cells:
    - '[звони́ть]{.ru}'
    - '[друг дру́гу]{.ru}'
  - base: '[игра́ть с]{.ru}'
    cells:
    - '[игра́ть с]{.ru}'
    - '[друг с дру́гом]{.ru}'
  - base: '[ду́мать о]{.ru}'
    cells:
    - '[ду́мать о]{.ru}'
    - '[друг о дру́ге]{.ru}'
  - base: '[боя́ться]{.ru}'
    cells:
    - '[боя́ться]{.ru}'
    - '[друг дру́га]{.ru}'
  - base: '[ходи́ть в го́сти к]{.ru}'
    cells:
    - '[ходи́ть в го́сти к]{.ru}'
    - '[друг к дру́гу]{.ru}'
  - base: '[смотре́ть на]{.ru}'
    cells:
    - '[смотре́ть на]{.ru}'
    - '[друг на дру́га]{.ru}'
  - base: '[люби́ть]{.ru}'
    cells:
    - '[люби́ть]{.ru}'
    - '[друг дру́га]{.ru}'
  - base: '[жить без]{.ru}'
    cells:
    - '[жить без]{.ru}'
    - '[друг без дру́га]{.ru}'
  - base: '[получа́ть пи́сьма от]{.ru}'
    cells:
    - '[получа́ть пи́сьма от]{.ru}'
    - '[друг от дру́га]{.ru}'
  - base: '[интересова́ться]{.ru}'
    cells:
    - '[интересова́ться]{.ru}'
    - '[друг дру́гом]{.ru}'
  why: '第 3、10 题：第四格补语：[ждать, люби́ть друг дру́га]{.ru}。第一个 [друг]{.ru} 永远不变，只变第二个。

    第 7 题：[боя́ться]{.ru} 要求第二格：[друг дру́га]{.ru}（形式同第四格）。

    第 1、4 题：第三格：[помога́ть, звони́ть друг дру́гу]{.ru}。

    第 13 题：[интересова́ться]{.ru} 要求第五格：[друг дру́гом]{.ru}。

    第 2、5、6、8、9、11、12 题：有前置词时，前置词放在两个词中间：[друг о дру́ге, друг с дру́гом, друг к дру́гу, друг на дру́га, друг без дру́га, друг от дру́га]{.ru}，不说 *[о друг дру́ге]{.ru}*；第二个词的格由前置词决定。'
- id: B2-L58-03
  tags:
  - ка́ждый / любо́й / друго́й 的意义
  task: 说这些话时用哪个词？按意义归栏。
  type: classify
  bins:
  - '[ка́ждый]{.ru}'
  - '[любо́й]{.ru}'
  - '[друго́й]{.ru}'
  items:
  - text: 每层楼都有厨房。
    answer: '[ка́ждый]{.ru}'
  - text: 随便问我哪一年都行。
    answer: '[любо́й]{.ru}'
  - text: 换个问题吧。
    answer: '[друго́й]{.ru}'
  - text: 我每天早上跑步。
    answer: '[ка́ждый]{.ru}'
  - text: 这本书在任何一家书店都能买到。
    answer: '[любо́й]{.ru}'
  - text: 今天不行，改天吧。
    answer: '[друго́й]{.ru}'
  - text: 每个学生都得交作业。
    answer: '[ка́ждый]{.ru}'
  - text: 你随便什么时候给我打电话都行。
    answer: '[любо́й]{.ru}'
  - text: 哥俩一个是医生，另一个是工程师。
    answer: '[друго́й]{.ru}'
  - text: 每个人都讲了自己的假期。
    answer: '[ка́ждый]{.ru}'
  - text: 随便拿一支笔吧。
    answer: '[любо́й]{.ru}'
  - text: 一些人在跳舞，另一些人在唱歌。
    answer: '[друго́й]{.ru}'
  - text: 他住在别的城市。
    answer: '[друго́й]{.ru}'
  - text: 每次见面他都送我花。
    answer: '[ка́ждый]{.ru}'
  - text: 随便哪个孩子都知道这个童话。
    answer: '[любо́й]{.ru}'
  why: '第 1、4、7、10、14 题：一个一个、无一例外：[ка́ждый]{.ru}（[на ка́ждом этаже́, ка́ждое у́тро, ка́ждый студе́нт, ка́ждый раз]{.ru}）；单独用指“每个人”。

    第 2、5、8、11、15 题：随便挑哪一个都行：[любо́й]{.ru}（[о любо́м го́де, в любо́м магази́не, в любо́е вре́мя]{.ru}）。“随便哪个孩子都知道”强调随便挑一个，用 [любо́й ребёнок]{.ru}。

    第 3、6、9、12、13 题：别的、另一个，以及 [в друго́й раз]{.ru}、[оди́н… друго́й…]{.ru}、[одни́… други́е…]{.ru}。'
- id: B2-L58-04
  tags:
  - оди́н из：句中的格
  - друг дру́га：句中
  task: 用括号里的词组填空（句中）。
  type: fill
  items:
  - stem: Мы обе́дали в ___ го́рода.
    hint: оди́н из + лу́чшие рестора́ны
    accept:
    - одно́м из лу́чших рестора́нов
  - stem: Ю́ми подари́ла цветы́ ___.
    hint: одна́ из + учи́тельницы
    accept:
    - одно́й из учи́тельниц
  - stem: Я говори́л с ___.
    hint: оди́н из + на́ши студе́нты
    accept:
    - одни́м из на́ших студе́нтов
  - stem: ___ опозда́л на ле́кцию.
    hint: оди́н из + студе́нты
    accept:
    - оди́н из студе́нтов
  - stem: Э́то ___ теа́тров Москвы́.
    hint: оди́н из + са́мые ста́рые
    accept:
    - оди́н из са́мых ста́рых
  - stem: Ван Лэй взял слова́рь у ___.
    hint: одна́ из + сосе́дки
    accept:
    - одно́й из сосе́док
  - stem: Байка́л — ___ ми́ра.
    hint: одно́ из + са́мые краси́вые озёра
    accept:
    - одно́ из са́мых краси́вых озёр
  - stem: Мы поговори́м об ___.
    hint: оди́н из + ва́ши вопро́сы
    accept:
    - одно́м из ва́ших вопро́сов
  - stem: Ле́кция бу́дет в ___.
    hint: одна́ из + но́вые аудито́рии
    accept:
    - одно́й из но́вых аудито́рий
  - stem: Я позвони́л ___.
    hint: оди́н из + бра́тья
    accept:
    - одному́ из бра́тьев
  - stem: Ю́ми и А́нна ча́сто пи́шут ___.
    hint: друг дру́га
    accept:
    - друг дру́гу
  - stem: Мы мно́го ду́мали ___.
    hint: о + друг дру́га
    accept:
    - друг о дру́ге
  - stem: Сосе́ди по ко́мнате ча́сто спо́рят ___.
    hint: с + друг дру́га
    accept:
    - друг с дру́гом
  - stem: Ми́ша и Ди́ма ждут ___ у вхо́да.
    hint: друг дру́га
    accept:
    - друг дру́га
  why: '第 4、5、7 题：作主语或表语时 [оди́н]{.ru} 用第一格，性随 [из]{.ru} 后的名词：[оди́н из студе́нтов]{.ru}（谓语 [опозда́л]{.ru} 用单数）、[оди́н из са́мых ста́рых теа́тров]{.ru}、[одно́ из са́мых краси́вых озёр]{.ru}（[о́зеро]{.ru} 是中性，虽然主语 [Байка́л]{.ru} 是阳性）。

    第 1、3、8、10 题：[оди́н]{.ru} 的格看它在句中的作用：[в одно́м из…, с одни́м из…, об одно́м из…, одному́ из бра́тьев]{.ru}（[позвони́ть]{.ru} 要第三格）；[из]{.ru} 后的形容词、物主代词也用复数第二格：[лу́чших рестора́нов, на́ших студе́нтов, ва́ших вопро́сов]{.ru}。

    第 2、6、9 题：阴性的间接格都是 [одно́й]{.ru}：[одно́й из учи́тельниц, у одно́й из сосе́док, в одно́й из но́вых аудито́рий]{.ru}。

    第 11–14 题：第一个 [друг]{.ru} 不变，第二个按动词或前置词变格，前置词放在中间：[пи́шут друг дру́гу, ду́мали друг о дру́ге, спо́рят друг с дру́гом, ждут друг дру́га]{.ru}。'
