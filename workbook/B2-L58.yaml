heading: 第 58 课　“……之一”；每个、任何、别的
groups:
- id: B2-L58-01
  tags:
  - оди́н из + 复数第二格
  - оди́н из：оди́н 的性和格
  task: 写出“……之一”的第一格，再按行末的前置词写出词组。
  type: matrix
  cols:
  - 名词
  - '[оди́н из]{.ru} + 第一格'
  - 前置词 + 词组
  given:
  - 0
  rows:
  - base: '[го́род]{.ru}'
    cells:
    - '[го́род]{.ru}'
    - '[оди́н из городо́в]{.ru}'
    - '[в одно́м из городо́в]{.ru}'
    hint: '[в]{.ru}'
  - base: '[ко́мната]{.ru}'
    cells:
    - '[ко́мната]{.ru}'
    - '[одна́ из ко́мнат]{.ru}'
    - '[в одно́й из ко́мнат]{.ru}'
    hint: '[в]{.ru}'
  - base: '[письмо́]{.ru}'
    cells:
    - '[письмо́]{.ru}'
    - '[одно́ из пи́сем]{.ru}'
    - '[в одно́м из пи́сем]{.ru}'
    hint: '[в]{.ru}'
  - base: '[подру́га]{.ru}'
    cells:
    - '[подру́га]{.ru}'
    - '[одна́ из подру́г]{.ru}'
    - '[с одно́й из подру́г]{.ru}'
    hint: '[с]{.ru}'
  - base: '[студе́нт]{.ru}'
    cells:
    - '[студе́нт]{.ru}'
    - '[оди́н из студе́нтов]{.ru}'
    - '[с одни́м из студе́нтов]{.ru}'
    hint: '[с]{.ru}'
  - base: '[ко́рпус]{.ru}'
    cells:
    - '[ко́рпус]{.ru}'
    - '[оди́н из корпусо́в]{.ru}'
    - '[в одно́м из корпусо́в]{.ru}'
    hint: '[в]{.ru}'
  - base: '[эта́ж]{.ru}'
    cells:
    - '[эта́ж]{.ru}'
    - '[оди́н из этаже́й]{.ru}'
    - '[на одно́м из этаже́й]{.ru}'
    hint: '[на]{.ru}'
  - base: '[сестра́]{.ru}'
    cells:
    - '[сестра́]{.ru}'
    - '[одна́ из сестёр]{.ru}'
    - '[к одно́й из сестёр]{.ru}'
    hint: '[к]{.ru}'
  - base: '[о́зеро]{.ru}'
    cells:
    - '[о́зеро]{.ru}'
    - '[одно́ из озёр]{.ru}'
    - '[на одно́м из озёр]{.ru}'
    hint: '[на]{.ru}；复数 [озёра]{.ru}'
  - base: '[преподава́тель]{.ru}'
    cells:
    - '[преподава́тель]{.ru}'
    - '[оди́н из преподава́телей]{.ru}'
    - '[у одного́ из преподава́телей]{.ru}'
    hint: '[у]{.ru}'
  - base: '[кни́га]{.ru}'
    cells:
    - '[кни́га]{.ru}'
    - '[одна́ из книг]{.ru}'
    - '[об одно́й из книг]{.ru}'
    hint: '[о]{.ru}'
  - base: '[окно́]{.ru}'
    cells:
    - '[окно́]{.ru}'
    - '[одно́ из о́кон]{.ru}'
    - '[у одного́ из о́кон]{.ru}'
    hint: '[у]{.ru}'
  - base: '[музе́й]{.ru}'
    cells:
    - '[музе́й]{.ru}'
    - '[оди́н из музе́ев]{.ru}'
    - '[в одно́м из музе́ев]{.ru}'
    hint: '[в]{.ru}'
  - base: '[друг]{.ru}'
    cells:
    - '[друг]{.ru}'
    - '[оди́н из друзе́й]{.ru}'
    - '[от одного́ из друзе́й]{.ru}'
    hint: '[от]{.ru}'
  why: '第 1、5–7、10、13、14 题：[из]{.ru} 后用复数第二格，[оди́н]{.ru} 的性随名词：阳性 [оди́н из городо́в]{.ru}；格由前置词决定：[в одно́м]{.ru}（第六格）、[с одни́м]{.ru}（第五格）、[у / от одного́]{.ru}（第二格）。[из]{.ru} 后面的部分始终不变。

    第 2、4、8、11 题：阴性名词用 [одна́]{.ru}：[одна́ из ко́мнат]{.ru}；[одна́]{.ru} 的间接格都是 [одно́й]{.ru}：[в / с / к одно́й из…]{.ru}。

    第 3、9、12 题：中性名词用 [одно́]{.ru}：[одно́ из пи́сем]{.ru}；间接格同阳性：[в одно́м, у одного́]{.ru}。

    第 3、8、12 题：复数第二格插入元音、重音变化：[пи́сем, сестёр, о́кон]{.ru}。

    第 6、9、14 题：复数特殊的词按复数第一格变：[корпуса́ → корпусо́в]{.ru}，[озёра → озёр]{.ru}，[друзья́ → друзе́й]{.ru}。

    第 11 题：[одно́й]{.ru} 以元音开头，前置词用 [об]{.ru}：[об одно́й из книг]{.ru}。'
- id: B2-L58-02
  tags:
  - друг дру́га：格与前置词的位置
