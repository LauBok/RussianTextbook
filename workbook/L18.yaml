  why: |-
    第 1–6 题：硬变化：阳性、中性 [-ом]{.ru}，阴性 [-ой]{.ru}：[но́вом, но́вой; тёплом, тёплой]{.ru}。
    第 7、8 题：重读词尾也是 [-о́м, -о́й]{.ru}：[большо́м, большо́й; родно́м, родно́й]{.ru}。阴性第六格和阳性第一格同形，不要弄混。
