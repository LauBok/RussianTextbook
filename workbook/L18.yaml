    第 1–4 题：[ж, ш, ч, щ]{.ru} 后词尾不重读，写 [-ем, -ей]{.ru}：[хоро́шем, хоро́шей; о́бщем, о́бщей; све́жем]{.ru}。
    第 5–8 题：[г, к, х]{.ru} 后第六格和硬变化一样：[ти́хом, ти́хой; ма́леньком; филологи́ческом]{.ru}。
    第 9 题：[дорого́й]{.ru} 词尾重读：[дорого́м, дорого́й]{.ru}。
- id: L18-04
  tags:
  - 形容词与名词单数第六格：共同变格
  task: 形容词和名词一起变成第六格（前置词已印出）。
  type: matrix
  cols:
  - 形容词＋名词
  - 第六格词组
  given:
  - 0
  rows:
  - base: '[но́вый + дом]{.ru}'
    cells:
    - '[но́вый + дом]{.ru}'
    - '[в но́вом до́ме]{.ru}'
  - base: '[ста́рый + зда́ние]{.ru}'
    cells:
    - '[ста́рый + зда́ние]{.ru}'
    - '[в ста́ром зда́нии]{.ru}'
  - base: '[краси́вый + ко́мната]{.ru}'
    cells:
    - '[краси́вый + ко́мната]{.ru}'
    - '[в краси́вой ко́мнате]{.ru}'
  - base: '[све́тлый + аудито́рия]{.ru}'
    cells:
    - '[све́тлый + аудито́рия]{.ru}'
    - '[в све́тлой аудито́рии]{.ru}'
  - base: '[ую́тный + кварти́ра]{.ru}'
    cells:
    - '[ую́тный + кварти́ра]{.ru}'
    - '[в ую́тной кварти́ре]{.ru}'
  - base: '[большо́й + пло́щадь]{.ru}'
    cells:
    - '[большо́й + пло́щадь]{.ru}'
    - '[на большо́й пло́щади]{.ru}'
    hint: f
  - base: '[си́ний + су́мка]{.ru}'
    cells:
    - '[си́ний + су́мка]{.ru}'
    - '[в си́ней су́мке]{.ru}'
  - base: '[зи́мний + сад]{.ru}'
    cells:
    - '[зи́мний + сад]{.ru}'
    - '[в зи́мнем саду́]{.ru}'
    new: true
    gloss: 冬天的
  - base: '[вече́рний + ле́кция]{.ru}'
    cells:
    - '[вече́рний + ле́кция]{.ru}'
    - '[на вече́рней ле́кции]{.ru}'
    new: true
    gloss: 晚上的
  - base: '[сосе́дний + райо́н]{.ru}'
    cells:
    - '[сосе́дний + райо́н]{.ru}'
    - '[в сосе́днем райо́не]{.ru}'
    new: true
    gloss: 相邻的
  - base: '[хоро́ший + шко́ла]{.ru}'
    cells:
    - '[хоро́ший + шко́ла]{.ru}'
    - '[в хоро́шей шко́ле]{.ru}'
  - base: '[большо́й + общежи́тие]{.ru}'
    cells:
    - '[большо́й + общежи́тие]{.ru}'
    - '[в большо́м общежи́тии]{.ru}'
  - base: '[ти́хий + у́лица]{.ru}'
    cells:
    - '[ти́хий + у́лица]{.ru}'
    - '[на ти́хой у́лице]{.ru}'
  - base: '[филологи́ческий + факульте́т]{.ru}'
    cells:
    - '[филологи́ческий + факульте́т]{.ru}'
    - '[на филологи́ческом факульте́те]{.ru}'
  - base: '[райо́нный + поликли́ника]{.ru}'
    cells:
    - '[райо́нный + поликли́ника]{.ru}'
    - '[в райо́нной поликли́нике]{.ru}'
  - base: '[дома́шний + зада́ние]{.ru}'
    cells:
    - '[дома́шний + зада́ние]{.ru}'
    - '[в дома́шнем зада́нии]{.ru}'
    new: true
    gloss: 家庭的；作业
  - base: '[тёплый + мо́ре]{.ru}'
    cells:
    - '[тёплый + мо́ре]{.ru}'
    - '[на тёплом мо́ре]{.ru}'
    new: true
    gloss: 暖和的
  - base: '[о́бщий + ку́хня]{.ru}'
    cells:
    - '[о́бщий + ку́хня]{.ru}'
    - '[на о́бщей ку́хне]{.ru}'
  why: |-
    第 1、14 题：阳性名词前用 [-ом]{.ru}：[в но́вом до́ме, на филологи́ческом факульте́те]{.ru}。
    第 10 题：软变化阳性 [-ем]{.ru}：[в сосе́днем райо́не]{.ru}。
    第 8 题：[сад]{.ru} 表示处所用 [-у́]{.ru}，形容词照常变：[в зи́мнем саду́]{.ru}。
    第 17 题：中性名词前形容词和阳性一样：[на тёплом мо́ре]{.ru}，[мо́ре]{.ru} 不变。
    第 2、12、16 题：中性 [-ие]{.ru} 名词变 [-ии]{.ru}，形容词用阳性、中性词尾：[в ста́ром зда́нии, в большо́м общежи́тии, в дома́шнем зада́нии]{.ru}。
    第 3、5、13、15 题：阴性：形容词 [-ой]{.ru}，名词 [-е]{.ru}：[в краси́вой ко́мнате, в ую́тной кварти́ре, на ти́хой у́лице, в райо́нной поликли́нике]{.ru}。
    第 7、11、18 题：阴性软变化和 [ш, щ]{.ru} 词干写 [-ей]{.ru}：[в си́ней су́мке, в хоро́шей шко́ле, на о́бщей ку́хне]{.ru}。
    第 4、9 题：名词和形容词各变各的：[в све́тлой аудито́рии, на вече́рней ле́кции]{.ru}。
    第 6 题：[пло́щадь]{.ru} 是阴性：形容词 [-о́й]{.ru}，名词 [-и]{.ru}：[на большо́й пло́щади]{.ru}。
- id: L18-05
  tags:
  - 形容词单数第六格：句中填空
  task: 只把括号里的形容词变成第六格。
  type: fill
  items:
  - stem: Мы живём в ___ до́ме.
    hint: большо́й
    accept:
    - большо́м
  - stem: А́нна на ___ факульте́те.
    hint: филологи́ческий
    accept:
    - филологи́ческом
  - stem: Мари́я Никола́евна рабо́тает в ___ поликли́нике.
    hint: райо́нный
    accept:
    - райо́нной
  - stem: Ба́бушка живёт в ___ райо́не.
    hint: ти́хий
    accept:
    - ти́хом
  - stem: Студе́нты в ___ аудито́рии.
    hint: све́тлый
    accept:
    - све́тлой
  - stem: Ми́ша игра́ет в ___ па́рке.
    hint: сосе́дний
    accept:
    - сосе́днем
  - stem: Мы бы́ли на ___ конце́рте.
    hint: интере́сный
    accept:
    - интере́сном
  - stem: Пьер живёт в ___ общежи́тии.
    hint: ста́рый
    accept:
    - ста́ром
  - stem: Ко́шка спит на ___ крова́ти.
    hint: ма́ленький
    accept:
    - ма́ленькой
  - stem: Я чита́ю о ___ теа́тре.
    hint: Большо́й
    accept:
    - Большо́м
  - stem: Ма́ма на ___ ку́хне.
    hint: но́вый
    accept:
    - но́вой
  - stem: Ключи́ в ___ су́мке.
    hint: си́ний
    accept:
    - си́ней
  - stem: Мы отдыха́ли на ___ мо́ре.
    hint: тёплый
    accept:
    - тёплом
  - stem: Они́ говоря́т о ___ кварти́ре.
    hint: хоро́ший
    accept:
    - хоро́шей
  - stem: Мы обе́дали в ___ кафе́.
    hint: ма́ленький
    accept:
    - ма́леньком
  - stem: Студе́нты бы́ли на ___ ле́кции.
    hint: вече́рний
    accept:
    - вече́рней
  - stem: Пьер живёт в ___ кварти́ре.
    hint: ую́тный
    accept:
    - ую́тной
  why: |-
    第 1、2、4、7、10 题：阳性名词前 [-ом]{.ru}：[большо́м, филологи́ческом, ти́хом, интере́сном, Большо́м]{.ru}。
    第 6 题：软变化 [-ем]{.ru}：[сосе́днем]{.ru}。
    第 8、13、15 题：中性名词前和阳性一样：[ста́ром (общежи́тии), тёплом (мо́ре), ма́леньком (кафе́)]{.ru}。
    第 3、5、9、11、17 题：阴性名词前 [-ой]{.ru}：[райо́нной, све́тлой, ма́ленькой, но́вой, ую́тной]{.ru}。
    第 12、14、16 题：软变化和 [ш]{.ru} 词干阴性写 [-ей]{.ru}：[си́ней, хоро́шей, вече́рней]{.ru}。
