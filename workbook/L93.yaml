  why: '现在时按第一变位，再加 [-ся / -сь]{.ru}：元音后 [-сь]{.ru}（[собира́юсь, собира́етесь]{.ru}），辅音后 [-ся]{.ru}（[собира́ешься, собира́ется, собира́емся, собира́ются]{.ru}）。

    过去时按性数：阳性 [собира́лся]{.ru}（[л]{.ru} 是辅音，加 [-ся]{.ru}），阴性 [собира́лась]{.ru}，复数 [собира́лись]{.ru}（元音后 [-сь]{.ru}）。第 1–4 题同一个 [я, ты]{.ru}，过去时要看说话人是男是女。第 9、10 题复数主语用 [собира́ются, собира́лись]{.ru}。'
