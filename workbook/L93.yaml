    第 2、6、8、13 题：数词词组的第四格同第一格：[на две неде́ли, на три дня, на два ме́сяца, на пять лет]{.ru}。

    第 14–18 题：表示为哪个节日，非动物名词第四格同第一格：[на Но́вый год, на Рождество́, на кани́кулы]{.ru}。'
- id: L93-03
  tags:
  - на + 第四格与 че́рез + 第四格：期限与间隔
  task: 填 [на]{.ru} 或 [че́рез]{.ru}。
  type: fill
  items:
  - stem: 'Я пое́ду в Петербу́рг ___ неде́лю: я бу́ду там семь дней.'
    accept:
    - на
  - stem: 'Ми́ша вернётся ___ неде́лю: сейча́с он ещё у ба́бушки.'
    accept:
    - че́рез
  - stem: 'Ван Лэй собира́ется домо́й ___ ме́сяц: он бу́дет в Пеки́не четы́ре неде́ли.'
    accept:
    - на
  - stem: Конце́рт начнётся ___ час.
    accept:
    - че́рез
  - stem: 'Мы е́дем на да́чу ___ два дня: в суббо́ту и в воскресе́нье.'
    accept:
    - на
  - stem: Подожди́те, пожа́луйста, я верну́сь ___ мину́ту.
    accept:
    - че́рез
  - stem: Ю́ми взяла́ слова́рь у А́нны ___ два дня.
    accept:
    - на
  - stem: Кани́кулы начну́тся ___ две неде́ли.
    accept:
    - че́рез
  - stem: Мы пое́дем к ба́бушке ___ Рождество́.
    accept:
    - на
  - stem: Ю́ми е́дет домо́й ___ Но́вый год.
    accept:
    - на
  - stem: ___ три дня у нас экза́мен.
    accept:
    - Че́рез
  - stem: Я взял кни́гу в библиоте́ке ___ неде́лю.
    accept:
    - на
  - stem: Ми́ша поза́втракает и ___ пять мину́т пойдёт в шко́лу.
    accept:
    - че́рез
  - stem: Мы собира́емся в Сиби́рь ___ ле́то.
    accept:
    - на
  - stem: Ле́кция ко́нчится ___ де́сять мину́т.
    accept:
    - че́рез
  - stem: Пьер пое́дет во Фра́нцию ___ кани́кулы.
    accept:
    - на
  why: '第 1、3、5、7、12、14 题：[на]{.ru} + 第四格说预定的期限，到了那里以后打算待多久（或东西借多久），常和 [е́хать, пое́хать, собира́ться, взять]{.ru} 连用。第 9、10、16 题：[на]{.ru} + 节日、假期，表示为了过节或度假而去。

    第 2、4、6、8、11、13、15 题：[че́рез]{.ru} + 第四格说从现在起过多久动作才发生：[че́рез неде́лю]{.ru}“一周以后”，[че́рез час]{.ru}“一小时以后”。第 2 题米沙现在还在奶奶家，说的是他什么时候回来，用 [че́рез]{.ru}。'
