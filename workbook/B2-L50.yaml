heading: 第 50 课　条件从句与假定式：е́сли бы
groups:
- id: B2-L50-01
  tags:
  - если бы：构成
  task: 写出非真实条件句的从句和主句形式。
  type: matrix
  cols:
  - 主语 + 动词
  - 从句（条件）
  - 主句（结果）
  given:
  - 0
  rows:
  - base: '[я + знать]{.ru}'
    cells:
    - '[я + знать]{.ru}'
    - '[е́сли бы я зна́ла]{.ru}'
    - '[я бы зна́ла]{.ru}'
    hint: 女
  - base: '[ты + прийти́]{.ru}'
    cells:
    - '[ты + прийти́]{.ru}'
    - '[е́сли бы ты пришёл]{.ru}'
    - '[ты бы пришёл]{.ru}'
    hint: 男
  - base: '[мы + жить]{.ru}'
    cells:
    - '[мы + жить]{.ru}'
    - '[е́сли бы мы жи́ли]{.ru}'
    - '[мы бы жи́ли]{.ru}'
  - base: '[она́ + мочь]{.ru}'
    cells:
    - '[она́ + мочь]{.ru}'
    - '[е́сли бы она́ могла́]{.ru}'
    - '[она́ бы могла́]{.ru}'
  - base: '[он + не опозда́ть]{.ru}'
    cells:
    - '[он + не опозда́ть]{.ru}'
    - '[е́сли бы он не опозда́л]{.ru}'
    - '[он бы не опозда́л]{.ru}'
  - base: '[вы + быть]{.ru}'
    cells:
    - '[вы + быть]{.ru}'
    - '[е́сли бы вы бы́ли]{.ru}'
    - '[вы бы бы́ли]{.ru}'
  - base: '[де́ти + спать]{.ru}'
    cells:
    - '[де́ти + спать]{.ru}'
    - '[е́сли бы де́ти спа́ли]{.ru}'
    - '[де́ти бы спа́ли]{.ru}'
  - base: '[А́нна + пое́хать]{.ru}'
    cells:
    - '[А́нна + пое́хать]{.ru}'
    - '[е́сли бы А́нна пое́хала]{.ru}'
    - '[А́нна бы пое́хала]{.ru}'
  - base: '[Ди́ма + принести́]{.ru}'
    cells:
    - '[Ди́ма + принести́]{.ru}'
    - '[е́сли бы Ди́ма принёс]{.ru}'
    - '[Ди́ма бы принёс]{.ru}'
  - base: '[ты + позвони́ть]{.ru}'
    cells:
    - '[ты + позвони́ть]{.ru}'
    - '[е́сли бы ты позвони́ла]{.ru}'
    - '[ты бы позвони́ла]{.ru}'
    hint: 女
  - base: '[они́ + купи́ть]{.ru}'
    cells:
    - '[они́ + купи́ть]{.ru}'
    - '[е́сли бы они́ купи́ли]{.ru}'
    - '[они́ бы купи́ли]{.ru}'
  - base: '[я + встать]{.ru}'
    cells:
    - '[я + встать]{.ru}'
    - '[е́сли бы я встал]{.ru}'
    - '[я бы встал]{.ru}'
    hint: 男
  why: |-
    从句：[е́сли бы]{.ru} + 过去时形式，[бы]{.ru} 紧跟 [е́сли]{.ru}；主句：过去时形式 + [бы]{.ru}，[бы]{.ru} 一般放在主语或动词后（[я бы зна́ла]{.ru} 也可以说 [я зна́ла бы]{.ru}）。动词的性数跟各自的主语。
    第 1、10 题：女性的 [я, ты]{.ru} 用阴性：[зна́ла, позвони́ла]{.ru}；第 2、12 题男性用阳性。
    第 4、9 题：特殊过去时：[мочь → могла́]{.ru}，[принести́ → принёс]{.ru}。
    第 3、6、7、11 题：复数（包括 [вы]{.ru}）：[жи́ли, бы́ли, спа́ли, купи́ли]{.ru}。
    易错：不要把 [е́сли бы]{.ru} 拆开写成 [е́сли я бы]{.ru}；主句不能漏 [бы]{.ru}。
- id: B2-L50-02
  tags:
  - 真实条件与非真实条件
  task: 按条件句说的情况归栏。
  type: classify
  bins:
  - 真实条件
  - 非真实·过去
  - 非真实·现在
  - 非真实·将来
  items:
  - text: '[Е́сли за́втра бу́дет хоро́шая пого́да, мы пое́дем на да́чу.]{.ru}'
    answer: 真实条件
  - text: '[Е́сли ты уста́нешь, отдохни́.]{.ru}'
    answer: 真实条件
  - text: '[Е́сли Ди́ма позвони́т, скажи́ ему́, что я до́ма.]{.ru}'
    answer: 真实条件
  - text: '[Е́сли у меня́ бу́дет вре́мя, я тебе́ помогу́.]{.ru}'
    answer: 真实条件
  - text: '[Е́сли бы вчера́ не́ было дождя́, мы бы пошли́ в парк.]{.ru}'
    answer: 非真实·过去
  - text: '[Е́сли бы ты позвони́л мне вчера́, я бы пришла́.]{.ru}'
    answer: 非真实·过去
  - text: '[Е́сли бы Ван Лэй не вы́ключил телефо́н в суббо́ту, он бы не проспа́л.]{.ru}'
    answer: 非真实·过去
  - text: '[Е́сли бы я знал об э́том ра́ньше, я бы тебе́ сказа́л.]{.ru}'
    answer: 非真实·过去
  - text: '[Е́сли бы я сейча́с был в Пеки́не, я бы пошёл к роди́телям.]{.ru}'
    answer: 非真实·现在
  - text: '[Е́сли бы у меня́ была́ маши́на, я бы е́здил на рабо́ту на маши́не.]{.ru}'
    answer: 非真实·现在
  - text: '[Е́сли бы ты жил ря́дом, мы бы встреча́лись ча́ще.]{.ru}'
    answer: 非真实·现在
  - text: '[Е́сли бы я уме́л пла́вать, я бы сейча́с купа́лся в мо́ре.]{.ru}'
    answer: 非真实·现在
  - text: '[Е́сли бы за́втра не на́до бы́ло рабо́тать, я бы до́лго спал.]{.ru}'
    answer: 非真实·将来
  - text: '[Е́сли бы в сле́дующую суббо́ту я не рабо́тала, я бы пошла́ с ва́ми в теа́тр.]{.ru}'
    answer: 非真实·将来
  - text: '[Е́сли бы на сле́дующей неде́ле у меня́ был о́тпуск, я бы пое́хал в Каза́нь.]{.ru}'
    answer: 非真实·将来
    new: true
    gloss: 假期
  - text: '[Е́сли бы за́втра была́ хоро́шая пого́да, мы бы пое́хали в лес, но обеща́ют дождь.]{.ru}'
    answer: 非真实·将来
  why: |-
    第 1–4 题：真实条件用 [е́сли]{.ru} + 将来时，主句用将来时或命令式，事情可能发生。
    第 5–16 题：[е́сли бы]{.ru} 的过去时形式本身不表示时间，要看 [вчера́, сейча́с, за́втра, в сле́дующую суббо́ту]{.ru} 这类词和上下文：
    第 5–8 题：说过去没有实现的事（[вчера́, в суббо́ту, ра́ньше]{.ru}）。
    第 9–12 题：说现在不是事实（[сейча́с]{.ru}，或一向如此：我没有车、你不住附近、我不会游泳）。
    第 13–16 题：说将来不会实现（[за́втра, в сле́дующую суббо́ту, на сле́дующей неде́ле]{.ru}）。
- id: B2-L50-03
  tags:
  - если бы：改错
  task: 找出句中的错误，写出错的部分和改正后的形式。
  type: matrix
  cols:
  - 句子
  - 错误
  - 改正
  given:
  - 0
  rows:
  - base: '[Е́сли бы я знал, я встал в шесть.]{.ru}'
    cells:
    - '[Е́сли бы я знал, я встал в шесть.]{.ru}'
    - '[я встал]{.ru}'
    - '[я бы встал]{.ru}'
  - base: '[Е́сли бы я бу́ду бога́тым, я бы купи́л дом.]{.ru}'
    cells:
    - '[Е́сли бы я бу́ду бога́тым, я бы купи́л дом.]{.ru}'
    - '[бу́ду]{.ru}'
    - '[был]{.ru}'
    new: true
    gloss: 富有的
  - base: '[Е́сли бы ма́ма была́ до́ма, она́ бы помо́г.]{.ru}'
    cells:
    - '[Е́сли бы ма́ма была́ до́ма, она́ бы помо́г.]{.ru}'
    - '[помо́г]{.ru}'
    - '[помогла́]{.ru}'
  - base: '[Е́сли бы у нас бы́ло вре́мя, мы бы пойдём в кино́.]{.ru}'
    cells:
    - '[Е́сли бы у нас бы́ло вре́мя, мы бы пойдём в кино́.]{.ru}'
    - '[пойдём]{.ru}'
    - '[пошли́]{.ru}'
  - base: '[Е́сли я бы знал её а́дрес, я бы написа́л.]{.ru}'
    cells:
    - '[Е́сли я бы знал её а́дрес, я бы написа́л.]{.ru}'
    - '[е́сли я бы]{.ru}'
    - '[е́сли бы я]{.ru}'
  - base: '[Е́сли бы Ди́ма не проспа́ла, он бы не опозда́л.]{.ru}'
    cells:
    - '[Е́сли бы Ди́ма не проспа́ла, он бы не опозда́л.]{.ru}'
    - '[проспа́ла]{.ru}'
    - '[проспа́л]{.ru}'
  - base: '[Е́сли бы вчера́ была́ хоро́шая пого́да, мы бы гуля́ет в па́рке.]{.ru}'
    cells:
    - '[Е́сли бы вчера́ была́ хоро́шая пого́да, мы бы гуля́ет в па́рке.]{.ru}'
    - '[гуля́ет]{.ru}'
    - '[гуля́ли]{.ru}'
  - base: '[Е́сли бы де́ти спал, мы бы говори́ли гро́мче.]{.ru}'
    cells:
    - '[Е́сли бы де́ти спал, мы бы говори́ли гро́мче.]{.ru}'
    - '[спал]{.ru}'
    - '[спа́ли]{.ru}'
  - base: '[Е́сли за́втра бу́дет дождь, мы бы оста́лись до́ма.]{.ru}'
    cells:
    - '[Е́сли за́втра бу́дет дождь, мы бы оста́лись до́ма.]{.ru}'
    - '[мы бы оста́лись]{.ru}'
    - '[мы оста́немся]{.ru}'
  - base: '[Е́сли бы я была́ на твоём ме́сте, я бы не волнова́лся.]{.ru}'
    cells:
    - '[Е́сли бы я была́ на твоём ме́сте, я бы не волнова́лся.]{.ru}'
    - '[волнова́лся]{.ru}'
    - '[волнова́лась]{.ru}'
  - base: '[Е́сли бы ты мне сказа́л, я бы тебе́ помогу́.]{.ru}'
    cells:
    - '[Е́сли бы ты мне сказа́л, я бы тебе́ помогу́.]{.ru}'
    - '[помогу́]{.ru}'
    - '[помо́г]{.ru}'
  - base: '[Е́сли бы у меня́ был слова́рь, я бы перевела́ бы текст.]{.ru}'
    cells:
    - '[Е́сли бы у меня́ был слова́рь, я бы перевела́ бы текст.]{.ru}'
    - '[перевела́ бы]{.ru}'
    - '[перевела́]{.ru}'
  why: |-
    第 1 题：主句漏了 [бы]{.ru}，就成了陈述事实“我六点起了”，和条件矛盾。
    第 2、4、7、11 题：[е́сли бы]{.ru} 句两个分句都用过去时形式，不用将来时、现在时：[был, пошли́, гуля́ли, помо́г]{.ru}。
    第 3、6、8、10 题：性数跟各自的主语：[ма́ма → помогла́]{.ru}，[Ди́ма → проспа́л]{.ru}，[де́ти → спа́ли]{.ru}，说话人是女性 → [волнова́лась]{.ru}。
    第 5 题：从句里 [бы]{.ru} 紧跟 [е́сли]{.ru}。
    第 9 题：[за́втра бу́дет дождь]{.ru} 是真实条件，主句用将来时，不加 [бы]{.ru}。
    第 12 题：一个分句只要一个 [бы]{.ru}。
