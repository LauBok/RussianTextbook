    gloss: 湖
  - base: '[Ива́н]{.ru}'
    cells:
    - '[Ива́н]{.ru}'
    - '[об Ива́не]{.ru}'
  - base: '[Кита́й]{.ru}'
    cells:
    - '[Кита́й]{.ru}'
    - '[о Кита́е]{.ru}'
    new: true
    gloss: 中国
  why: |-
    第 1、3、7、9 题：[-а]{.ru} 换成 [-е]{.ru}：[о ма́ме, о Москве́, о рабо́те, об А́нне]{.ru}。
    第 2、8、12、14、19、20 题：阳性辅音结尾加 [-е]{.ru}，[-й]{.ru} 换 [-е]{.ru}：[об уро́ке, о фи́льме, о музе́е, о Пье́ре]{.ru}。
    第 4–6、15、17 题：[-ия, -ие]{.ru} 换成 [-ии]{.ru}：[об исто́рии, о Росси́и, об общежи́тии, об экску́рсии]{.ru}。
    第 10、18 题：中性 [-о]{.ru} 换成 [-е]{.ru}，重音仍在词尾：[о письме́]{.ru}；[об о́зере]{.ru}。
    第 11 题：阴性 [-ь]{.ru} 用 [-и]{.ru}：[о тетра́ди]{.ru}。
    第 13 题：[мо́ре]{.ru} 不变：[о мо́ре]{.ru}。
    第 16 题：[Ю́ми]{.ru} 是外国名字，不变格：[о Ю́ми]{.ru}。
- id: L13-04
  tags:
  - 人称代词第六格：替换名词
  task: 用代词的第六格填空。
  type: fill
  items:
  - stem: — Вы говори́те о Пье́ре? — Да, о ___.
    accept:
    - нём
  - stem: — Ты ду́маешь о ма́ме? — Да, о ___.
    accept:
    - ней
  - stem: — Вы чита́ете о Москве́? — Да, мы мно́го чита́ем о ___.
    accept:
    - ней
  - stem: — Ты зна́ешь о фи́льме? — Да, я зна́ю о ___.
    accept:
    - нём
  - stem: — Они́ говоря́т о Ю́ми и Пье́ре? — Да, о ___.
    accept:
    - них
  - stem: — Ты спра́шиваешь обо мне? — Да, о ___.
    accept:
    - тебе́
  - stem: — Вы говори́те о нас? — Нет, не о ___.
    accept:
    - вас
  - stem: — О ___ ты ду́маешь? — О ма́ме.
    accept:
    - ком
  - stem: — О ___ вы говори́те? — О Москве́.
    accept:
    - чём
  - stem: — Ма́ма спра́шивает о тебе́? — Да, обо ___.
    accept:
    - мне
  - stem: — Вы ду́маете об уро́ке? — Да, о ___.
    accept:
    - нём
  - stem: — Он расска́зывает об экску́рсии? — Да, о ___.
    accept:
    - ней
  - stem: — Где слова́рь? — Вот он. Тетра́дь в ___.
    accept:
    - нём
  - stem: — Где су́мка? — Вот она́. Ключи́ в ___.
    accept:
    - ней
  - stem: — О ___ расска́зывает А́нна? — Об исто́рии.
    accept:
    - чём
  - stem: — Ты ду́маешь о письме́? — Да, о ___.
    accept:
    - нём
  - stem: — Вы говори́те об А́нне и Ми́ше? — Да, о ___.
    accept:
    - них
  - stem: — Где кре́сло? — Вот оно́. Ко́шка на ___.
    accept:
    - нём
  - stem: — Где крова́ть? — Вот она́. Па́па на ___.
    accept:
    - ней
  - stem: — Вы спра́шиваете обо мне? — Да, о ___.
    accept:
    - вас
  why: |-
    第 1、4、11、13、16、18 题：阳性、中性名词用 [нём]{.ru}：[о Пье́ре → о нём]{.ru}，[о фи́льме, об уро́ке, о письме́ → о нём]{.ru}，[в словаре́ → в нём]{.ru}。代替 [уро́к]{.ru} 时前置词随代词改回 [о]{.ru}。
    第 2、3、12、14、19 题：阴性名词用 [ней]{.ru}：[о ма́ме, о Москве́, об экску́рсии → о ней]{.ru}，[в су́мке → в ней]{.ru}。
    第 5、17 题：两个人用 [них]{.ru}：[о них]{.ru}；[кре́сло, письмо́]{.ru} 是中性，也用 [нём]{.ru}。
    第 6、7、10、20 题：问答中人称要转换：问 [обо мне]{.ru} 答 [о тебе́]{.ru}，问 [о тебе́]{.ru} 答 [обо мне]{.ru}，问 [о нас]{.ru} 答 [о вас]{.ru}；对一个人用 [вы]{.ru} 时，问 [обо мне]{.ru} 答 [о вас]{.ru}。
    第 8、9、15 题：问人用 [о ком]{.ru}，问事物用 [о чём]{.ru}：[О ком … ? — О ма́ме]{.ru}；[О чём … ? — О Москве́, Об исто́рии]{.ru}。
