    第 2 题：写成 [о ко́мнате]{.ru}。这个形式以辅音音素开头。

    第 3 题：写成 [о шко́ле]{.ru}。这个形式以辅音音素开头。

    第 4 题：写成 [о музе́е]{.ru}。这个形式以辅音音素开头。

    第 5 题：写成 [об уро́ке]{.ru}。这个词以元音音素开头。

    第 6 题：写成 [об аудито́рии]{.ru}。这个词以元音音素开头。

    第 7 题：写成 [об исто́рии]{.ru}。这个词以元音音素开头。

    第 8 题：写成 [об общежи́тии]{.ru}。这个词以元音音素开头。

    第 9 题：写成 [об экску́рсии]{.ru}。这个词以元音音素开头。

    第 10 题：写成 [об упражне́нии]{.ru}。这个词以元音音素开头。

    第 11 题：写成 [о Япо́нии]{.ru}。这个形式以辅音音素开头。

    第 12 题：写成 [о Ю́ми]{.ru}。这个形式以辅音音素开头。

    第 13 题：写成 [обо мне]{.ru}。这里使用固定形式。

    第 14 题：写成 [о тебе́]{.ru}。这个形式以辅音音素开头。

    第 15 题：写成 [о нём]{.ru}。这个形式以辅音音素开头。

    第 16 题：写成 [о ней]{.ru}。这个形式以辅音音素开头。

    第 17 题：写成 [о нас]{.ru}。这个形式以辅音音素开头。

    第 18 题：写成 [о вас]{.ru}。这个形式以辅音音素开头。

    第 19 题：写成 [о них]{.ru}。这个形式以辅音音素开头。

    第 20 题：写成 [о зда́нии]{.ru}。这个形式以辅音音素开头。

    '
- id: L13-03
  tags:
  - 人称代词第六格：句中填空
  task: 用括号里人称代词的第六格填空。
  type: fill
  items:
  - stem: Мы ча́сто ду́маем о ___.
    hint: ты
    accept:
    - тебе́
  - stem: А́нна расска́зывает обо ___.
    hint: я
    accept:
    - мне
  - stem: Ба́бушка спра́шивает о ___.
    hint: он
    accept:
    - нём
  - stem: Ми́ша говори́т о ___.
    hint: она́
    accept:
    - ней
  - stem: Учи́тель зна́ет о ___.
    hint: мы
    accept:
    - нас
  - stem: Па́па ду́мает о ___.
    hint: вы
    accept:
    - вас
  - stem: Студе́нты расска́зывают о ___.
    hint: они́
    accept:
    - них
  - stem: Я чита́ю о ___.
    hint: оно́
    accept:
    - нём
  - stem: Ма́ма ча́сто ду́мает обо ___.
    hint: я
    accept:
    - мне
  - stem: Ты зна́ешь о ___?
    hint: они́
    accept:
    - них
  why: 第 1–10 题：人称代词第六格是 [мне, тебе́, нём, ней, нас, вас, них]{.ru}；[он, оно́]{.ru} 都变 [нём]{.ru}。[я]{.ru} 前用 [обо]{.ru}：[обо мне]{.ru}；第三人称在前置词后有 [н-]{.ru}：[о нём, о ней, о них]{.ru}。
