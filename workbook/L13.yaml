heading: 第 13 课　“关于”与人称代词第六格
groups:
- id: L13-01
  tags:
  - 人称代词与疑问代词第六格
  task: 写出代词的第六格（连同前置词）。
  type: matrix
  cols:
  - 前置词＋代词
  - 第六格
  given:
  - 0
  rows:
  - base: '[о + я]{.ru}'
    cells:
    - '[о + я]{.ru}'
    - '[обо мне]{.ru}'
  - base: '[о + ты]{.ru}'
    cells:
    - '[о + ты]{.ru}'
    - '[о тебе́]{.ru}'
  - base: '[о + он]{.ru}'
    cells:
    - '[о + он]{.ru}'
    - '[о нём]{.ru}'
  - base: '[о + она́]{.ru}'
    cells:
    - '[о + она́]{.ru}'
    - '[о ней]{.ru}'
  - base: '[о + оно́]{.ru}'
    cells:
    - '[о + оно́]{.ru}'
    - '[о нём]{.ru}'
  - base: '[о + мы]{.ru}'
    cells:
    - '[о + мы]{.ru}'
    - '[о нас]{.ru}'
  - base: '[о + вы]{.ru}'
    cells:
    - '[о + вы]{.ru}'
    - '[о вас]{.ru}'
  - base: '[о + они́]{.ru}'
    cells:
    - '[о + они́]{.ru}'
    - '[о них]{.ru}'
  - base: '[о + кто]{.ru}'
    cells:
    - '[о + кто]{.ru}'
    - '[о ком]{.ru}'
  - base: '[о + что]{.ru}'
    cells:
    - '[о + что]{.ru}'
    - '[о чём]{.ru}'
  - base: '[в + он]{.ru}'
    cells:
    - '[в + он]{.ru}'
    - '[в нём]{.ru}'
  - base: '[на + она́]{.ru}'
    cells:
    - '[на + она́]{.ru}'
    - '[на ней]{.ru}'
  - base: '[в + они́]{.ru}'
    cells:
    - '[в + они́]{.ru}'
    - '[в них]{.ru}'
  - base: '[на + оно́]{.ru}'
    cells:
    - '[на + оно́]{.ru}'
    - '[на нём]{.ru}'
  why: |-
    第 1 题：[я]{.ru} 的第六格是 [мне]{.ru}，前面的 [о]{.ru} 要说成 [обо]{.ru}：[обо мне]{.ru}。
    第 2、6、7 题：[тебе́, нас, вас]{.ru} 要单独记。
    第 3–5、8 题：第三人称在前置词后加 [н]{.ru}：[о нём, о ней, о них]{.ru}；[он]{.ru} 和 [оно́]{.ru} 都是 [нём]{.ru}。
    第 9、10 题：[кто → о ком]{.ru}，[что → о чём]{.ru}。
    第 11–14 题：在 [в]{.ru}、[на]{.ru} 后面同样加 [н]{.ru}：[в нём, на ней, в них, на нём]{.ru}。
- id: L13-02
  tags:
  - 关于：о / об / обо 的选择
  task: 这些第六格前面用 [о]{.ru}、[об]{.ru} 还是 [обо]{.ru}？归入相应一栏。
  type: classify
  bins:
  - '[о]{.ru}'
  - '[об]{.ru}'
  - '[обо]{.ru}'
  items:
  - text: '[ма́ме]{.ru}'
    answer: '[о]{.ru}'
  - text: '[уро́ке]{.ru}'
    answer: '[об]{.ru}'
  - text: '[А́нне]{.ru}'
    answer: '[об]{.ru}'
  - text: '[исто́рии]{.ru}'
    answer: '[об]{.ru}'
  - text: '[Москве́]{.ru}'
    answer: '[о]{.ru}'
  - text: '[Япо́нии]{.ru}'
    answer: '[о]{.ru}'
  - text: '[Ива́не]{.ru}'
    answer: '[об]{.ru}'
  - text: '[университе́те]{.ru}'
    answer: '[об]{.ru}'
  - text: '[мне]{.ru}'
    answer: '[обо]{.ru}'
  - text: '[музе́е]{.ru}'
    answer: '[о]{.ru}'
  - text: '[экску́рсии]{.ru}'
    answer: '[об]{.ru}'
  - text: '[Ю́ми]{.ru}'
    answer: '[о]{.ru}'
  - text: '[общежи́тии]{.ru}'
    answer: '[об]{.ru}'
  - text: '[Евро́пе]{.ru}'
    answer: '[о]{.ru}'
    new: true
    gloss: 欧洲
  - text: '[ле́кции]{.ru}'
    answer: '[о]{.ru}'
  - text: '[Ита́лии]{.ru}'
    answer: '[об]{.ru}'
    new: true
    gloss: 意大利
  - text: '[Кита́е]{.ru}'
    answer: '[о]{.ru}'
  - text: '[о́пере]{.ru}'
    answer: '[об]{.ru}'
    new: true
    gloss: 歌剧
  why: |-
    第 2–4、7、8、11、13、16、18 题：以元音 [а, о, у, э, и]{.ru} 开头的词前用 [об]{.ru}：[об уро́ке, об А́нне, об исто́рии, об Ива́не, об университе́те, об экску́рсии, об общежи́тии, об Ита́лии, об о́пере]{.ru}。
    第 1、5、10、15、17 题：以辅音开头的词前用 [о]{.ru}：[о ма́ме, о Москве́, о музе́е, о ле́кции, о Кита́е]{.ru}。
    第 6、12、14 题：[я, е, ё, ю]{.ru} 开头的音是 [[й]]{.tr}，是辅音，前面仍用 [о]{.ru}：[о Япо́нии, о Ю́ми, о Евро́пе]{.ru}。这几个最容易误放到 [об]{.ru} 栏。
    第 9 题：只有 [мне]{.ru} 前用 [обо]{.ru}：[обо мне]{.ru}。
- id: L13-03
  tags:
  - 关于：名词第六格
  task: 写出“关于……”词组。
  type: matrix
  cols:
  - 名词
  - 关于……
  given:
  - 0
  rows:
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[о ма́ме]{.ru}'
  - base: '[уро́к]{.ru}'
    cells:
    - '[уро́к]{.ru}'
    - '[об уро́ке]{.ru}'
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[о Москве́]{.ru}'
  - base: '[исто́рия]{.ru}'
    cells:
    - '[исто́рия]{.ru}'
    - '[об исто́рии]{.ru}'
  - base: '[Росси́я]{.ru}'
    cells:
    - '[Росси́я]{.ru}'
    - '[о Росси́и]{.ru}'
  - base: '[общежи́тие]{.ru}'
    cells:
    - '[общежи́тие]{.ru}'
    - '[об общежи́тии]{.ru}'
  - base: '[рабо́та]{.ru}'
    cells:
    - '[рабо́та]{.ru}'
    - '[о рабо́те]{.ru}'
  - base: '[фильм]{.ru}'
    cells:
    - '[фильм]{.ru}'
    - '[о фи́льме]{.ru}'
  - base: '[А́нна]{.ru}'
    cells:
    - '[А́нна]{.ru}'
    - '[об А́нне]{.ru}'
  - base: '[письмо́]{.ru}'
    cells:
    - '[письмо́]{.ru}'
    - '[о письме́]{.ru}'
  - base: '[тетра́дь]{.ru}'
    cells:
    - '[тетра́дь]{.ru}'
    - '[о тетра́ди]{.ru}'
  - base: '[музе́й]{.ru}'
    cells:
    - '[музе́й]{.ru}'
    - '[о музе́е]{.ru}'
  - base: '[мо́ре]{.ru}'
    cells:
    - '[мо́ре]{.ru}'
    - '[о мо́ре]{.ru}'
  - base: '[Пьер]{.ru}'
    cells:
    - '[Пьер]{.ru}'
    - '[о Пье́ре]{.ru}'
  - base: '[экску́рсия]{.ru}'
    cells:
    - '[экску́рсия]{.ru}'
    - '[об экску́рсии]{.ru}'
  - base: '[Ю́ми]{.ru}'
    cells:
    - '[Ю́ми]{.ru}'
    - '[о Ю́ми]{.ru}'
  - base: '[ле́кция]{.ru}'
    cells:
    - '[ле́кция]{.ru}'
    - '[о ле́кции]{.ru}'
  - base: '[о́зеро]{.ru}'
    cells:
    - '[о́зеро]{.ru}'
    - '[об о́зере]{.ru}'
