heading: 第 53 课　否定第二格
groups:
- id: B3-L53-01
  lessons:
  - B3-L53
  tags:
  - 否定第二格：нет, не было, не будет
  - 否定第二格：не оказалось, не осталось, не существует
  task: 把肯定句改成否定句，写出名词的形式和否定谓语。
  type: matrix
  cols:
  - 肯定句
  - 名词
  - 否定谓语
  given:
  - 0
  rows:
  - base: '[Соба́ка была́ до́ма.]{.ru}'
    cells:
    - '[Соба́ка была́ до́ма.]{.ru}'
    - '[соба́ки]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[Слу́ги бу́дут.]{.ru}'
    cells:
    - '[Слу́ги бу́дут.]{.ru}'
    - '[слуг]{.ru}'
    - '[не бу́дет]{.ru}'
  - base: '[В ко́мнате есть телеви́зор.]{.ru}'
    cells:
    - '[В ко́мнате есть телеви́зор.]{.ru}'
    - '[телеви́зора]{.ru}'
    - '[нет]{.ru}'
  - base: '[На столе́ была́ газе́та.]{.ru}'
    cells:
    - '[На столе́ была́ газе́та.]{.ru}'
    - '[газе́ты]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[За́втра бу́дет экза́мен.]{.ru}'
    cells:
    - '[За́втра бу́дет экза́мен.]{.ru}'
    - '[экза́мена]{.ru}'
    - '[не бу́дет]{.ru}'
  - base: '[В э́том го́роде есть метро́.]{.ru}'
    cells:
    - '[В э́том го́роде есть метро́.]{.ru}'
    - '[метро́]{.ru}'
    - '[нет]{.ru}'
  - base: '[В шко́ле был большо́й зал.]{.ru}'
    cells:
    - '[В шко́ле был большо́й зал.]{.ru}'
    - '[большо́го за́ла]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[На у́лице бы́ли лю́ди.]{.ru}'
    cells:
    - '[На у́лице бы́ли лю́ди.]{.ru}'
    - '[люде́й]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[В карма́не оказа́лись ключи́.]{.ru}'
    cells:
    - '[В карма́не оказа́лись ключи́.]{.ru}'
    - '[ключе́й]{.ru}'
    - '[не оказа́лось]{.ru}'
  - base: '[Тако́е сло́во существу́ет.]{.ru}'
    cells:
    - '[Тако́е сло́во существу́ет.]{.ru}'
    - '[тако́го сло́ва]{.ru}'
    - '[не существу́ет]{.ru}'
  - base: '[У нас оста́лось вре́мя.]{.ru}'
    cells:
    - '[У нас оста́лось вре́мя.]{.ru}'
    - '[вре́мени]{.ru}'
    - '[не оста́лось]{.ru}'
  - base: '[Брат был до́ма.]{.ru}'
    cells:
    - '[Брат был до́ма.]{.ru}'
    - '[бра́та]{.ru}'
    - '[не́ было]{.ru}'
  why: |-
    第 1–12 题：表示“没有”“不存在”时，名词一律用第二格：[соба́ки, слуг, телеви́зора, люде́й, вре́мени]{.ru}；不变格的 [метро́]{.ru} 形式不变。
    第 1、4、7、8、12 题：[не́ было]{.ru} 永远是中性单数，不和名词一致：[Соба́ки не́ было]{.ru}，[Люде́й не́ было]{.ru}，不说 [не была́ соба́ка]{.ru}、[не бы́ли лю́ди]{.ru}。
    第 2、5 题：将来时同样用中性单数 [не бу́дет]{.ru}：[Слуг не бу́дет]{.ru}。
    第 3、6 题：现在时用 [нет]{.ru}。
    第 9–11 题：[оказа́ться, оста́ться, существова́ть]{.ru} 否定时也用中性单数（过去时 [-о]{.ru}），名词用第二格：[Ключе́й не оказа́лось]{.ru}，[Вре́мени не оста́лось]{.ru}，[Тако́го сло́ва не существу́ет]{.ru}。
- id: B3-L53-02
  lessons:
  - B3-L53
  tags:
  - 否定第二格：及物动词否定时宾语的格
  task: 括号里的宾语在否定句里该用第二格还是第四格？按格归栏。
  type: classify
  bins:
  - 第二格
  - 第四格
  - 两者都可
  items:
  - text: '[Он не ви́дел (фильм), о кото́ром ты говори́шь.]{.ru}'
    answer: 第四格
  - text: '[Я не слы́шал ни одного́ (звук).]{.ru}'
    answer: 第二格
  - text: '[Гера́сим не мог сказа́ть ей ни (сло́во).]{.ru}'
    answer: 第二格
  - text: '[Э́то не име́ет (значе́ние).]{.ru}'
    answer: 第二格
  - text: '[Она́ не чу́вствовала (ра́дость).]{.ru}'
    answer: 第二格
  - text: '[Я давно́ не ви́дел (Татья́на).]{.ru}'
    answer: 第四格
  - text: '[Он взял не (кни́га), а журна́л.]{.ru}'
    answer: 第四格
  - text: '[Не теря́йте (вре́мя)!]{.ru}'
    answer: 第二格
  - text: '[Я не мог не заме́тить (ва́ша оши́бка).]{.ru}'
    answer: 第四格
  - text: '[Гера́сим бо́льше никогда́ не держа́л (соба́ки).]{.ru}'
    answer: 第二格
  - text: '[Ты не име́ешь (пра́во) так говори́ть.]{.ru}'
    answer: 第二格
  - text: '[Мы не получи́ли никако́й (информа́ция).]{.ru}'
    answer: 第二格
  - text: '[Я ещё не прочита́л (кни́га), кото́рую ты мне дал.]{.ru}'
    answer: 第四格
  - text: '[Она́ забы́ла и не закры́ла (окно́).]{.ru}'
    answer: 两者都可
  - text: '[Ми́ша не спра́шивал (мне́ние) роди́телей.]{.ru}'
    answer: 第二格
  - text: '[Ва́ня не купи́л (хлеб).]{.ru}'
    answer: 两者都可
  - text: '[Мы не ви́дели ночну́ю (Москва́).]{.ru}'
    answer: 第四格
  - text: '[Он не по́нял (вопро́с).]{.ru}'
    answer: 两者都可
  why: |-
    第 2、3、12 题：有 [ни, ни оди́н, никако́й]{.ru}，表示完全否定，用第二格：[ни одного́ зву́ка, ни сло́ва, никако́й информа́ции]{.ru}。
    第 4、8、11 题：固定说法用第二格：[не име́ет значе́ния, не теря́йте вре́мени, не име́ешь пра́ва]{.ru}。
    第 5、15 题：宾语是抽象名词，用第二格：[не чу́вствовала ра́дости, не спра́шивал мне́ния]{.ru}。
    第 10 题：宾语泛指、数量不定，用第二格：[не держа́л соба́к]{.ru}。
    第 1、13 题：宾语是说话双方都知道的“那一个”（有从句指明），用第四格：[фильм, кни́гу]{.ru}。
    第 6、17 题：人名、地名这类具体的、确定的宾语用第四格：[Татья́ну, ночну́ю Москву́]{.ru}。
    第 7 题：否定针对的不是动词，而是宾语本身（不是书，而是杂志），用第四格：[кни́гу]{.ru}。
    第 9 题：双重否定 [не мог не]{.ru} 用第四格：[ва́шу оши́бку]{.ru}。
    第 14、16、18 题：具体的事物，没有上面这些条件，两种格都可以：[окно́ / окна́, хлеб / хле́ба, вопро́с / вопро́са]{.ru}；书面语多用第二格，口语多用第四格。
- id: B3-L53-03
  lessons:
  - B3-L53
  tags:
  - 否定第二格：ни + 第二格
  task: 用 [ни]{.ru} 和括号里的词组成词组。
  type: matrix
  cols:
  - 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[сло́во]{.ru}'
    cells:
    - '[сло́во]{.ru}'
    - '[ни сло́ва]{.ru}'
  - base: '[звук]{.ru}'
    cells:
    - '[звук]{.ru}'
    - '[ни зву́ка]{.ru}'
  - base: '[копе́йка]{.ru}'
    cells:
    - '[копе́йка]{.ru}'
    - '[ни копе́йки]{.ru}'
  - base: '[мину́та]{.ru}'
    cells:
    - '[мину́та]{.ru}'
    - '[ни мину́ты]{.ru}'
  - base: '[оди́н челове́к]{.ru}'
    cells:
    - '[оди́н челове́к]{.ru}'
    - '[ни одного́ челове́ка]{.ru}'
  - base: '[одна́ оши́бка]{.ru}'
    cells:
    - '[одна́ оши́бка]{.ru}'
    - '[ни одно́й оши́бки]{.ru}'
  - base: '[рубль]{.ru}'
    cells:
    - '[рубль]{.ru}'
    - '[ни рубля́]{.ru}'
  - base: '[ка́пля]{.ru}'
    cells:
    - '[ка́пля]{.ru}'
    - '[ни ка́пли]{.ru}'
    new: true
    gloss: 滴
  - base: '[оди́н раз]{.ru}'
    cells:
    - '[оди́н раз]{.ru}'
    - '[ни ра́зу]{.ru}'
  why: |-
    第 1–8 题：[ни]{.ru} 加强否定，后面的名词总用第二格：[ни сло́ва, ни зву́ка, ни копе́йки, ни рубля́]{.ru}（重音移到词尾），[ни ка́пли]{.ru}；带 [оди́н]{.ru} 时 [оди́н]{.ru} 也变成第二格：[ни одного́ челове́ка, ни одно́й оши́бки]{.ru}。
    第 9 题：“一次也没有”是固定说法 [ни ра́зу]{.ru}（第 18 课），不说 [ни одного́ ра́за]{.ru} 以外的 [ни ра́за]{.ru}。
- id: B3-L53-04
  lessons:
  - B3-L53
  tags:
  - 否定第二格：句中
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: В дере́вне не́ было ни одно́й ___.
    hint: шко́ла
    accept:
    - шко́лы
  - stem: У старика́ не оста́лось ___.
    hint: де́ньги
    accept:
    - де́нег
  - stem: В холоди́льнике не оказа́лось ___.
    hint: молоко́
    accept:
    - молока́
  - stem: В на́шем до́ме нет ___.
    hint: лифт
    accept:
    - ли́фта
  - stem: Вчера́ на уро́ке не́ было ___.
    hint: Пьер
    accept:
    - Пье́ра
  - stem: В ко́мнате не́ было ни одного́ ___.
    hint: стул
    accept:
    - сту́ла
  - stem: У меня́ сего́дня нет ___.
    hint: вре́мя
    accept:
    - вре́мени
  - stem: На конце́рте не оста́лось ___.
    hint: свобо́дные места́
    accept:
    - свобо́дных мест
  why: |-
    第 1–8 题：[нет, не́ было, не бу́дет, не оста́лось, не оказа́лось]{.ru} 后面的名词都用第二格，谓语用中性单数。
    第 2、8 题：复数名词用复数第二格：[де́нег, свобо́дных мест]{.ru}。
    第 3、7 题：单数第二格：[молока́, вре́мени]{.ru}。
    第 4 题：[нет ли́фта]{.ru}。
    第 5 题：人名在否定存在句里同样用第二格：[Пье́ра не́ было]{.ru}。
    第 1、6 题：有 [ни одно́й, ни одного́]{.ru}，名词也用第二格：[шко́лы, сту́ла]{.ru}。
