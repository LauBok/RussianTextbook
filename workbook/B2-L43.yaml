heading: 第 43 课　前缀 об-、с-、раз-…-ся；带前缀运动动词的体
groups:
- id: B2-L43-01
  tags:
  - 前缀 об- / с- / раз-…-ся：变位
  task: 写出动词的现在时、将来时和过去时。
  type: matrix
  cols:
  - 动词对
  - 未完成体 [они́]{.ru}
  - 完成体将来时 [мы]{.ru}
  - 完成体过去时复数
  given:
  - 0
  rows:
  - base: '[обходи́ть / обойти́]{.ru}'
    cells:
    - '[обходи́ть / обойти́]{.ru}'
    - '[обхо́дят]{.ru}'
    - '[обойдём]{.ru}'
    - '[обошли́]{.ru}'
  - base: '[объезжа́ть / объе́хать]{.ru}'
    cells:
    - '[объезжа́ть / объе́хать]{.ru}'
    - '[объезжа́ют]{.ru}'
    - '[объе́дем]{.ru}'
    - '[объе́хали]{.ru}'
  - base: '[сходи́ть / сойти́]{.ru}'
    cells:
    - '[сходи́ть / сойти́]{.ru}'
    - '[схо́дят]{.ru}'
    - '[сойдём]{.ru}'
    - '[сошли́]{.ru}'
  - base: '[расходи́ться / разойти́сь]{.ru}'
    cells:
    - '[расходи́ться / разойти́сь]{.ru}'
    - '[расхо́дятся]{.ru}'
    - '[разойдёмся]{.ru}'
    - '[разошли́сь]{.ru}'
  - base: '[разъезжа́ться / разъе́хаться]{.ru}'
    cells:
    - '[разъезжа́ться / разъе́хаться]{.ru}'
    - '[разъезжа́ются]{.ru}'
    - '[разъе́демся]{.ru}'
    - '[разъе́хались]{.ru}'
  why: |-
    第 1、3、4 题：在 [идти́]{.ru} 前加 [о]{.ru}：[обойдём, сойдём, разойдёмся]{.ru}；过去时 [обошли́, сошли́, разошли́сь]{.ru}。
    第 2、5 题：在 [е]{.ru} 前加 [ъ]{.ru}：[объе́дем, разъе́демся]{.ru}。
    第 4、5 题：[-ся]{.ru} 在辅音后写 [-ся]{.ru}，在元音后写 [-сь]{.ru}：[расхо́дятся, разошли́сь]{.ru}。[раз-]{.ru} 在清辅音 [х]{.ru} 前写成 [рас-]{.ru}：[расхо́дятся]{.ru}，在 [й]{.ru} 前写成 [разо-]{.ru}：[разойдёмся]{.ru}。
    第 3 题：这里的 [сходи́ть]{.ru} 是“下来”，未完成体，和完成体 [сойти́]{.ru} 成对。
- id: B2-L43-02
  tags:
  - 带前缀运动动词的体
  task: 按动词在句中的意义把句子归栏。
  type: classify
  bins:
  - 一次，有结果
  - 经常、反复
  - 过程或同时进行
  - 来过、去过（已回来）
  items:
  - text: '[Ю́ми прие́хала в Москву́ в сентябре́.]{.ru}'
    answer: 一次，有结果
  - text: '[Наконе́ц мы дошли́ до при́стани.]{.ru}'
    answer: 一次，有结果
  - text: '[Ди́ма перешёл у́лицу и сел в авто́бус.]{.ru}'
    answer: 一次，有结果
  - text: '[Тури́сты обошли́ весь монасты́рь.]{.ru}'
    answer: 一次，有结果
  - text: '[Мой друг ча́сто заезжа́ет ко мне по́сле рабо́ты.]{.ru}'
    answer: 经常、反复
  - text: '[Ка́ждое у́тро я выхожу́ из до́ма в во́семь.]{.ru}'
    answer: 经常、反复
  - text: '[По́езд всегда́ подхо́дит к ста́нции в шесть.]{.ru}'
    answer: 经常、反复
  - text: '[На э́той остано́вке мно́гие схо́дят с авто́буса.]{.ru}'
    answer: 经常、反复
  - text: '[Когда́ теплохо́д проплыва́л ми́мо о́строва, мы фотографи́ровали.]{.ru}'
    answer: 过程或同时进行
  - text: '[Мы выходи́ли из теа́тра, а лю́ди ещё входи́ли.]{.ru}'
    answer: 过程或同时进行
  - text: '[Ди́ма ме́дленно подходи́л к две́ри.]{.ru}'
    answer: 过程或同时进行
  - text: '[Когда́ я переходи́л у́лицу, я уви́дел А́нну.]{.ru}'
    answer: 过程或同时进行
  - text: '[Вчера́ к нам приходи́ла ба́бушка.]{.ru}'
    answer: 来过、去过（已回来）
  - text: '[Ле́том к нам приезжа́л брат из Каза́ни.]{.ru}'
    answer: 来过、去过（已回来）
  - text: '[Ди́ма заходи́л к тебе́ у́тром.]{.ru}'
    answer: 来过、去过（已回来）
  - text: '[В ма́е па́па уезжа́л в командиро́вку.]{.ru}'
    answer: 来过、去过（已回来）
  why: |-
    第 1–4 题：一次完成、有结果，用完成体：[прие́хала, дошли́, перешёл, обошли́]{.ru}。
    第 5–8 题：[ча́сто, ка́ждое у́тро, всегда́]{.ru} 或泛指许多人，用未完成体现在时。
    第 9–12 题：说动作的过程，或两件事同时进行，用未完成体过去时：[проплыва́л, выходи́ли / входи́ли, подходи́л, переходи́л]{.ru}。
    第 13–16 题：未完成体过去时说来了又走了、去了又回来，结果已经抵消：[к нам приходи́ла ба́бушка]{.ru}（现在已经走了）；比较 [к нам пришла́ ба́бушка]{.ru}（她还在这儿）。[уезжа́л в командиро́вку]{.ru} 是说出过差，已经回来。
- id: B2-L43-03
  tags:
  - сходить / съездить
  task: 按主语写出三种形式。
  type: matrix
  cols:
  - 主语 + 地点
  - 去过（不定向过去时）
  - 去了一趟（完成体过去时）
  - 将去一趟（完成体将来时）
  given:
  - 0
  rows:
  - base: '[я + магази́н]{.ru}'
    cells:
    - '[я + магази́н]{.ru}'
    - '[ходи́л]{.ru}'
    - '[сходи́л]{.ru}'
    - '[схожу́]{.ru}'
    hint: 男；步行
  - base: '[мы + Су́здаль]{.ru}'
    cells:
    - '[мы + Су́здаль]{.ru}'
    - '[е́здили]{.ru}'
    - '[съе́здили]{.ru}'
    - '[съе́здим]{.ru}'
    hint: 乘车
  - base: '[А́нна + апте́ка]{.ru}'
    cells:
    - '[А́нна + апте́ка]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[сходи́ла]{.ru}'
    - '[схо́дит]{.ru}'
    hint: 步行
  - base: '[Ди́ма + да́ча]{.ru}'
    cells:
    - '[Ди́ма + да́ча]{.ru}'
    - '[е́здил]{.ru}'
    - '[съе́здил]{.ru}'
    - '[съе́здит]{.ru}'
    hint: 乘车
  - base: '[ты + по́чта]{.ru}'
    cells:
    - '[ты + по́чта]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[сходи́ла]{.ru}'
    - '[схо́дишь]{.ru}'
    hint: 女；步行
  - base: '[роди́тели + Каза́нь]{.ru}'
    cells:
    - '[роди́тели + Каза́нь]{.ru}'
    - '[е́здили]{.ru}'
    - '[съе́здили]{.ru}'
    - '[съе́здят]{.ru}'
    hint: 乘车
  - base: '[я + Влади́мир]{.ru}'
    cells:
    - '[я + Влади́мир]{.ru}'
    - '[е́здила]{.ru}'
    - '[съе́здила]{.ru}'
    - '[съе́зжу]{.ru}'
    hint: 女；乘车
  - base: '[вы + библиоте́ка]{.ru}'
    cells:
    - '[вы + библиоте́ка]{.ru}'
    - '[ходи́ли]{.ru}'
    - '[сходи́ли]{.ru}'
    - '[схо́дите]{.ru}'
    hint: 步行
  - base: '[Ми́ша + врач]{.ru}'
    cells:
    - '[Ми́ша + врач]{.ru}'
    - '[ходи́л]{.ru}'
    - '[сходи́л]{.ru}'
    - '[схо́дит]{.ru}'
    hint: 步行
  - base: '[они́ + мо́ре]{.ru}'
    cells:
    - '[они́ + мо́ре]{.ru}'
    - '[е́здили]{.ru}'
    - '[съе́здили]{.ru}'
    - '[съе́здят]{.ru}'
    hint: 乘车
  why: |-
    第一栏用不定向动词过去时 [ходи́л, е́здил]{.ru}，说“去过”这件事。第二栏是完成体 [сходи́ть, съе́здить]{.ru} 的过去时，强调去了一趟、办完回来了。第三栏是它们的将来时，说将来去一趟：[Я схожу́ в магази́н]{.ru}。[е́здить]{.ru} 没有这种将来用法。
    第 1、3、5、8、9 题：[сходи́ть]{.ru} 照 [ходи́ть]{.ru} 变：[схожу́ — схо́дишь]{.ru}，[я]{.ru} 重音在词尾，其余前移。
    第 2、4、6、7、10 题：[съе́здить]{.ru} 照 [е́здить]{.ru} 变，[я]{.ru} 交替 [зд → зж]{.ru}：[съе́зжу]{.ru}，别忘了 [ъ]{.ru}。
- id: B2-L43-04
  tags:
  - 带前缀运动动词：体（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Ди́ма, ___ в магази́н за хле́бом, пожа́луйста!
    hint: сходи́ть
    accept:
    - сходи́
  - stem: Мы ___ всю Каза́нь и о́чень уста́ли.
    hint: обходи́ть / обойти́
    accept:
    - обошли́
  - stem: Ты зна́ешь, где мне ___ с авто́буса?
    hint: сходи́ть / сойти́
    accept:
    - сойти́
  - stem: По́сле конце́рта лю́ди ме́дленно ___ по дома́м.
    hint: расходи́ться / разойти́сь
    accept:
    - расходи́лись
    - разошли́сь
  - stem: Э́та у́лица закры́та, маши́ны ___ её.
    hint: объезжа́ть / объе́хать
    accept:
    - объезжа́ют
  - stem: — Где ты был ле́том? — Я ___ в Су́здаль.
    hint: е́здить / съе́здить
    accept:
    - е́здил
  - stem: За́втра я ___ к врачу́.
    hint: ходи́ть / сходи́ть
    accept:
    - схожу́
  - stem: По́сле ле́кции студе́нты ___ , и аудито́рия ста́ла пусто́й.
    hint: расходи́ться / разойти́сь
    accept:
    - разошли́сь
  - stem: У́тром к тебе́ ___ Пьер, но тебя́ не́ было до́ма. Он придёт ещё раз ве́чером.
    hint: приходи́ть / прийти́
    accept:
    - приходи́л
  - stem: Ле́том мы обяза́тельно ___ к ба́бушке в дере́вню.
    hint: е́здить / съе́здить
    accept:
    - съе́здим
  why: |-
    第 1 题：请人去一趟，用完成体 [сходи́ть]{.ru} 的命令式：[сходи́]{.ru}。
    第 2、8 题：一次完成：[обошли́]{.ru}（走遍）、[разошли́сь]{.ru}（散了，教室空了）。
    第 3 题：“下车”用 [сойти́ с авто́буса]{.ru}，问在哪儿下，用完成体不定式。
    第 4 题：慢慢散去的过程用 [расходи́лись]{.ru}；只说结果也可以用 [разошли́сь]{.ru}。
    第 5 题：经常绕行，用未完成体现在时：[объезжа́ют]{.ru}。
    第 6 题：“去过哪儿”说去过这件事，用 [е́здил]{.ru}。
    第 7、10 题：将来去一趟又回来，用 [сходи́ть, съе́здить]{.ru} 的将来时：[схожу́, съе́здим]{.ru}。
    第 9 题：来过又走了，用未完成体过去时：[приходи́л]{.ru}。
