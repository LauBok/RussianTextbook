    - '[не́ было да́чи]{.ru}'
  - base: '[тетра́дь]{.ru}'
    cells:
    - '[тетра́дь]{.ru}'
    - '[нет тетра́ди]{.ru}'
    - '[была́ тетра́дь]{.ru}'
    - '[не́ было тетра́ди]{.ru}'
  - base: '[музе́й]{.ru}'
    cells:
    - '[музе́й]{.ru}'
    - '[нет музе́я]{.ru}'
    - '[был музе́й]{.ru}'
    - '[не́ было музе́я]{.ru}'
  - base: '[фо́то]{.ru}'
    cells:
    - '[фо́то]{.ru}'
    - '[нет фо́то]{.ru}'
    - '[бы́ло фо́то]{.ru}'
    - '[не́ было фо́то]{.ru}'
  why: '第 1–12 题：肯定句里名词是主语，用第一格，[был, была́, бы́ло]{.ru} 跟名词的性一致：[была́ сестра́, бы́ло письмо́]{.ru}。

    第 1–12 题：否定句没有主语，名词用第二格，过去时一律用中性 [не́ было]{.ru}，重音在 [не́]{.ru} 上；不要按名词的性说成 *[не была́ сестры́]{.ru}。

    第 8、12 题：[метро́, фо́то]{.ru} 不变格，第二格也不变；它们是中性，肯定句用 [бы́ло]{.ru}。

    第 4 题：[словаря́]{.ru} 重音在词尾。'
- id: L32-05
  tags:
  - нет / не́ было + 第二格：人不在
  task: 用括号里词的第二格填空。
  type: fill
  items:
  - stem: ___ нет до́ма.
    hint: Ми́ша
    accept:
    - Ми́ши
  - stem: Сего́дня ___ нет на уро́ке.
    hint: Пьер
    accept:
    - Пье́ра
  - stem: Вчера́ ___ не́ было на ле́кции.
    hint: она́
    accept:
    - её
  - stem: Вчера́ ___ не́ было до́ма.
    hint: я
    accept:
    - меня́
  - stem: ___ нет в библиоте́ке.
    hint: А́нна
    accept:
    - А́нны
  - stem: ___ нет на рабо́те.
    hint: Ива́н Серге́евич
    accept:
    - Ива́на Серге́евича
  - stem: ___ сейча́с нет в поликли́нике.
    hint: Мари́я Никола́евна
    accept:
    - Мари́и Никола́евны
  - stem: Сего́дня ___ нет в шко́ле.
    hint: учи́тель
    accept:
    - учи́теля
  - stem: Вчера́ ___ не́ было в университе́те.
    hint: мы
    accept:
    - нас
  - stem: ___ нет в Москве́.
    hint: они́
    accept:
    - их
  - stem: ___ не́ было на да́че.
    hint: де́душка
    accept:
    - де́душки
  - stem: Сего́дня ___ нет.
    hint: О́льга Ви́кторовна
    accept:
    - О́льги Ви́кторовны
  - stem: ___ нет до́ма.
    hint: он
    accept:
    - Его́
  - stem: Вчера́ ___ не́ было на конце́рте.
    hint: Ю́ми
    accept:
    - Ю́ми
  - stem: У меня́ нет ___.
    hint: слова́рь
    accept:
    - словаря́
  - stem: Сего́дня ___ нет до́ма.
    hint: па́па
    accept:
    - па́пы
  - stem: Вчера́ ___ не́ было на уро́ке.
    hint: ты
    accept:
    - тебя́
  - stem: В на́шем райо́не нет ___.
    hint: апте́ка
    accept:
    - апте́ки
    new: true
    gloss: 药店
  - stem: У Ми́ши нет ___.
    hint: компью́тер
    accept:
    - компью́тера
  - stem: Вчера́ ___ не́ было до́ма.
    hint: сестра́
    accept:
    - сестры́
  - stem: У нас нет ___.
    hint: соба́ка
    accept:
    - соба́ки
  - stem: Сего́дня ___ нет в Москве́.
    hint: вы
    accept:
    - вас
  - stem: Здесь нет ___.
    hint: метро́
    accept:
    - метро́
  - stem: У меня́ нет ___.
    hint: ключ
    accept:
    - ключа́
  - stem: Вчера́ ___ не́ было на рабо́те.
    hint: врач
    accept:
    - врача́
  - stem: В на́шем го́роде нет ___.
    hint: лес
    accept:
    - ле́са
  - stem: ___ нет на ку́хне.
    hint: ма́ма
    accept:
    - Ма́мы
  why: |-
    第 1、2、5–8、11、12、20、27 题：人不在某处用 [нет / не́ было]{.ru} + 第二格：阳性加 [-а / -я]{.ru}，[-а]{.ru} 结尾的人名改 [-ы / -и]{.ru}。第 6、7、12 题名字和父称都变：[Ива́на Серге́евича, Мари́и Никола́евны]{.ru}。第 20 题 [сестры́]{.ru} 重音在词尾。
    第 11、16 题：[де́душка, па́па]{.ru} 是阳性，按 [-а]{.ru} 变：[де́душки, па́пы]{.ru}。
    第 3、4、9、10、13、17、22 题：人称代词第二格 [её, меня́, нас, их, его́, тебя́, вас]{.ru}；前面没有前置词，不加 [н-]{.ru}。
    第 14 题：[Ю́ми]{.ru} 不变格。
    第 15、19、24–26 题：“没有某物、某人”也用 [нет]{.ru} + 第二格，阳性加 [-а / -я]{.ru}：[словаря́, компью́тера, ключа́, врача́, ле́са]{.ru}；[словаря́, ключа́, врача́]{.ru} 重音在词尾。
    第 18、21 题：[к]{.ru} 后不写 [ы]{.ru}，写 [и]{.ru}：[апте́ки, соба́ки]{.ru}。
    第 23 题：[метро́]{.ru} 不变格。
