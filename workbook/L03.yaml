heading: 第 3 课　名词的性与“我的”
groups:
- id: L03-01
  tags:
  - 名词的性：按词尾判断
  task: 按词尾判断名词的性，归入相应一栏（以 [-ь]{.ru} 结尾的名词不在本题）。
  type: classify
  bins:
  - 阳性
  - 阴性
  - 中性
  items:
  - text: '[стол]{.ru}'
    answer: 阳性
  - text: '[ла́мпа]{.ru}'
    answer: 阴性
  - text: '[окно́]{.ru}'
    answer: 中性
  - text: '[чемода́н]{.ru}'
    answer: 阳性
  - text: '[кре́сло]{.ru}'
    answer: 中性
  - text: '[ко́шка]{.ru}'
    answer: 阴性
  - text: '[дива́н]{.ru}'
    answer: 阳性
    new: true
    gloss: 沙发
  - text: '[ва́за]{.ru}'
    answer: 阴性
    new: true
    gloss: 花瓶
  - text: '[па́па]{.ru}'
    answer: 阳性
  - text: '[зе́ркало]{.ru}'
    answer: 中性
    new: true
    gloss: 镜子
  - text: '[музе́й]{.ru}'
    answer: 阳性
    new: true
    gloss: 博物馆
  - text: '[ку́хня]{.ru}'
    answer: 阴性
    new: true
    gloss: 厨房
  - text: '[мо́ре]{.ru}'
    answer: 中性
    new: true
    gloss: 海
  - text: '[фо́то]{.ru}'
    answer: 中性
  - text: '[шкаф]{.ru}'
    answer: 阳性
  - text: '[карти́на]{.ru}'
    answer: 阴性
    new: true
    gloss: 画
  - text: '[трамва́й]{.ru}'
    answer: 阳性
    new: true
    gloss: 有轨电车
  - text: '[пла́тье]{.ru}'
    answer: 中性
    new: true
    gloss: 连衣裙
  - text: '[де́душка]{.ru}'
    answer: 阳性
    new: true
    gloss: 爷爷
  - text: '[су́мка]{.ru}'
    answer: 阴性
  - text: '[неде́ля]{.ru}'
    answer: 阴性
    new: true
    gloss: 星期
  - text: '[по́ле]{.ru}'
    answer: 中性
    new: true
    gloss: 田野
  why: |-
    第 1、4、7、15 题：以硬辅音结尾的名词是阳性：[стол, шкаф, дива́н]{.ru}。
    第 11、17 题：以 [-й]{.ru} 结尾的名词也是阳性：[музе́й, трамва́й]{.ru}。
    第 2、6、8、12、16、20、21 题：以 [-а]{.ru}、[-я]{.ru} 结尾的名词是阴性：[ла́мпа, ко́шка, ку́хня, неде́ля]{.ru}。
    第 3、5、10、14 题：以 [-о]{.ru} 结尾的名词是中性：[окно́, кре́сло, зе́ркало]{.ru}；[фо́то]{.ru} 不变格，也是中性。
    第 13、18、22 题：以 [-е]{.ru} 结尾的名词是中性：[мо́ре, пла́тье, по́ле]{.ru}。
    第 9、19 题：[па́па, де́душка]{.ru} 虽以 [-а]{.ru} 结尾，指的是男人，按意义算阳性，不按词尾。这是本题最容易放错的两个词。
