  why: |-
    第 1、4、6、8 题：阳性 [-ь]{.ru} 名词用 [он]{.ru}、[мой]{.ru}：[мой слова́рь, мой учи́тель]{.ru}。
    第 2、3、5、7、9 题：阴性 [-ь]{.ru} 名词用 [она́]{.ru}、[моя́]{.ru}：[моя́ крова́ть, моя́ мать]{.ru}。[-ь]{.ru} 从词形上看不出性，要连同性一起记。
    第 10–12 题：指男人的名词按意义是阳性，以 [-а]{.ru}、[-я]{.ru} 结尾也用 [он]{.ru}、[мой]{.ru}：[мой па́па, мой дя́дя]{.ru}，不能写 [моя́]{.ru}。
    第 13、14 题：两个人用 [они́]{.ru} 代替，“我的”用复数 [мои́]{.ru}，不管各自是什么性：[мои́ ма́ма и па́па]{.ru}。
