    第 3、7、11 题：中性名词用 [моё]{.ru}：[моё окно́, моё фо́то, моё кре́сло]{.ru}。
    第 4、12 题：阳性名词用 [мой]{.ru}：[мой стол, мой чемода́н]{.ru}。
    第 5、13 题：[крова́ть, тетра́дь]{.ru} 是阴性，用 [моя́]{.ru}。
    第 6 题：[слова́рь]{.ru} 是阳性，用 [мой]{.ru}。
