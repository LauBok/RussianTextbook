    第 1、6、12、15、18 题：阴性 [-а]{.ru} 名词用 [моя́]{.ru}：[моя́ ко́мната, моя́ сестра́]{.ru}。
    第 3、4、8、11、16 题：中性名词用 [моё]{.ru}：[моё кре́сло, моё пла́тье]{.ru}；[фо́то]{.ru} 也是中性，[моё фо́то]{.ru}。[моё]{.ru} 的 [ё]{.ru} 本身重读，不再标重音符号。
