heading: 第 36 课　来源与国籍
groups:
- id: L36-01
  tags:
  - 来源：в—из 与 на—с 对照
  task: 写出所在地（[где?]{.ru}）和来源（[отку́да?]{.ru}）的说法。
  type: matrix
  cols:
  - 第一格
  - '[где?]{.ru}'
  - '[отку́да?]{.ru}'
  rows:
  - base: '[Кита́й]{.ru}'
    cells:
    - '[Кита́й]{.ru}'
    - '[в Кита́е]{.ru}'
    - '[из Кита́я]{.ru}'
  - base: '[Япо́ния]{.ru}'
    cells:
    - '[Япо́ния]{.ru}'
    - '[в Япо́нии]{.ru}'
    - '[из Япо́нии]{.ru}'
  - base: '[Фра́нция]{.ru}'
    cells:
    - '[Фра́нция]{.ru}'
    - '[во Фра́нции]{.ru}'
    - '[из Фра́нции]{.ru}'
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[в Москве́]{.ru}'
    - '[из Москвы́]{.ru}'
  - base: '[Пеки́н]{.ru}'
    cells:
    - '[Пеки́н]{.ru}'
    - '[в Пеки́не]{.ru}'
    - '[из Пеки́на]{.ru}'
  - base: '[Каза́нь]{.ru}'
    cells:
    - '[Каза́нь]{.ru}'
    - '[в Каза́ни]{.ru}'
    - '[из Каза́ни]{.ru}'
    hint: f
  - base: '[Ку́ба]{.ru}'
    cells:
    - '[Ку́ба]{.ru}'
    - '[на Ку́бе]{.ru}'
    - '[с Ку́бы]{.ru}'
    hint: 岛国，用 [на]{.ru}
  - base: '[шко́ла]{.ru}'
    cells:
    - '[шко́ла]{.ru}'
    - '[в шко́ле]{.ru}'
    - '[из шко́лы]{.ru}'
  - base: '[университе́т]{.ru}'
    cells:
    - '[университе́т]{.ru}'
    - '[в университе́те]{.ru}'
    - '[из университе́та]{.ru}'
  - base: '[да́ча]{.ru}'
    cells:
    - '[да́ча]{.ru}'
    - '[на да́че]{.ru}'
    - '[с да́чи]{.ru}'
  - base: '[рабо́та]{.ru}'
    cells:
    - '[рабо́та]{.ru}'
    - '[на рабо́те]{.ru}'
    - '[с рабо́ты]{.ru}'
  - base: '[уро́к]{.ru}'
    cells:
    - '[уро́к]{.ru}'
    - '[на уро́ке]{.ru}'
    - '[с уро́ка]{.ru}'
  - base: '[стадио́н]{.ru}'
    cells:
    - '[стадио́н]{.ru}'
    - '[на стадио́не]{.ru}'
    - '[со стадио́на]{.ru}'
  - base: '[библиоте́ка]{.ru}'
    cells:
    - '[библиоте́ка]{.ru}'
    - '[в библиоте́ке]{.ru}'
    - '[из библиоте́ки]{.ru}'
  - base: '[ле́кция]{.ru}'
    cells:
    - '[ле́кция]{.ru}'
    - '[на ле́кции]{.ru}'
    - '[с ле́кции]{.ru}'
  why: '第 1–6、8 题：国家、城市用 [в]{.ru}，来源用 [из]{.ru} + 第二格：[из Кита́я, из Москвы́]{.ru}；[-ия]{.ru} 结尾变 [-ии]{.ru}：[из Япо́нии]{.ru}；[-ь]{.ru} 结尾的阴性城市名 [из Каза́ни]{.ru}。第 3 题 [Фра́нция]{.ru} 以两个辅音 [фр]{.ru}
    开头，处所写成 [во Фра́нции]{.ru}。

    第 9、10、15 题：处所用 [в]{.ru} 的词，来源用 [из]{.ru}。

    第 7、11–14、16 题：处所用 [на]{.ru} 的词，来源用 [с]{.ru}：[с Ку́бы, с да́чи, с рабо́ты]{.ru}。第 14 题 [с]{.ru} 在 [ст]{.ru} 前写成 [со]{.ru}：[со стадио́на]{.ru}。'
- id: L36-02
  tags:
  - 国籍名词：男女对应
  task: 写出国家对应的男性、女性国籍名词。
  type: matrix
  cols:
  - 国家
  - 男
  - 女
  rows:
  - base: '[Кита́й]{.ru}'
    cells:
    - '[Кита́й]{.ru}'
    - '[кита́ец]{.ru}'
    - '[китая́нка]{.ru}'
  - base: '[Япо́ния]{.ru}'
    cells:
    - '[Япо́ния]{.ru}'
    - '[япо́нец]{.ru}'
    - '[япо́нка]{.ru}'
  - base: '[Фра́нция]{.ru}'
    cells:
    - '[Фра́нция]{.ru}'
    - '[францу́з]{.ru}'
    - '[францу́женка]{.ru}'
  - base: '[Росси́я]{.ru}'
    cells:
    - '[Росси́я]{.ru}'
    - '[ру́сский]{.ru}'
    - '[ру́сская]{.ru}'
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[москви́ч]{.ru}'
    - '[москви́чка]{.ru}'
  why: '第 1、2 题：男性多以 [-ец]{.ru} 结尾，女性多以 [-ка]{.ru} 结尾：[япо́нец — япо́нка]{.ru}。注意 [кита́ец — китая́нка]{.ru}，女性形式多了 [-ян-]{.ru}。

    第 3 题：[францу́з — францу́женка]{.ru}，[з]{.ru} 变 [ж]{.ru}。

    第 4 题：[ру́сский]{.ru} 是形容词作名词用，女性是 [ру́сская]{.ru}。

    第 5 题：[москви́ч — москви́чка]{.ru}。'
- id: L36-03
  tags:
  - 国籍名词：第二格与复数
  task: 写出国籍名词的单数第二格和复数第一格。
  type: matrix
  cols:
  - 第一格
  - 单数第二格
  - 复数第一格
  rows:
  - base: '[кита́ец]{.ru}'
    cells:
    - '[кита́ец]{.ru}'
    - '[кита́йца]{.ru}'
    - '[кита́йцы]{.ru}'
  - base: '[япо́нец]{.ru}'
    cells:
    - '[япо́нец]{.ru}'
    - '[япо́нца]{.ru}'
    - '[япо́нцы]{.ru}'
  - base: '[иностра́нец]{.ru}'
    cells:
    - '[иностра́нец]{.ru}'
    - '[иностра́нца]{.ru}'
    - '[иностра́нцы]{.ru}'
  - base: '[францу́з]{.ru}'
    cells:
    - '[францу́з]{.ru}'
    - '[францу́за]{.ru}'
    - '[францу́зы]{.ru}'
  - base: '[москви́ч]{.ru}'
    cells:
    - '[москви́ч]{.ru}'
    - '[москвича́]{.ru}'
    - '[москвичи́]{.ru}'
  - base: '[тата́рин]{.ru}'
    cells:
    - '[тата́рин]{.ru}'
    - '[тата́рина]{.ru}'
    - '[тата́ры]{.ru}'
    hint: 复数 [тата́ры]{.ru}
  - base: '[ру́сский]{.ru}'
    cells:
    - '[ру́сский]{.ru}'
    - '[ру́сского]{.ru}'
    - '[ру́сские]{.ru}'
  - base: '[китая́нка]{.ru}'
    cells:
    - '[китая́нка]{.ru}'
    - '[китая́нки]{.ru}'
    - '[китая́нки]{.ru}'
  - base: '[япо́нка]{.ru}'
    cells:
    - '[япо́нка]{.ru}'
    - '[япо́нки]{.ru}'
    - '[япо́нки]{.ru}'
  - base: '[францу́женка]{.ru}'
    cells:
    - '[францу́женка]{.ru}'
    - '[францу́женки]{.ru}'
    - '[францу́женки]{.ru}'
  why: '第 1–3 题：[-ец]{.ru} 变格时 [е]{.ru} 脱落：[япо́нец → япо́нца → япо́нцы]{.ru}；[кита́ец]{.ru} 的 [е]{.ru} 脱落后 [й]{.ru} 要写出来：[кита́йца, кита́йцы]{.ru}。

    第 4 题：规则变化。第 5 题：[москвича́, москвичи́]{.ru} 重音在词尾，[ч]{.ru} 后复数写 [и]{.ru}。

    第 6 题：[тата́рин]{.ru} 单数照常变，复数去掉 [-ин]{.ru}：[тата́ры]{.ru}。

    第 7 题：按形容词变：[ру́сского, ру́сские]{.ru}。

    第 8–10 题：[-ка]{.ru} 结尾，[к]{.ru} 后写 [и]{.ru}，单数第二格和复数第一格同形。'
- id: L36-04
  tags:
  - 国籍名词：性别对应
  task: 用国籍名词填空。
  type: fill
  items:
  - stem: Ван Лэй из Кита́я. Он ___.
    accept:
    - кита́ец
  - stem: Ли На из Кита́я. Она́ ___.
    accept:
    - китая́нка
  - stem: Ю́ми из Япо́нии. Она́ ___.
    accept:
    - япо́нка
  - stem: Пьер из Фра́нции. Он ___.
    accept:
    - францу́з
  - stem: Мари́ из Фра́нции. Она́ ___.
    accept:
    - францу́женка
  - stem: А́нна из Москвы́. Она́ ___.
    hint: москви́ч / москви́чка
    accept:
    - москви́чка
  - stem: Ива́н Серге́евич из Москвы́. Он ___.
    hint: москви́ч / москви́чка
    accept:
    - москви́ч
  - stem: Ми́ша из Росси́и. Он ___.
    accept:
    - ру́сский
  - stem: Ка́тя из Росси́и. Она́ ___.
    accept:
    - ру́сская
  - stem: Ри́нат из Каза́ни. Он ___.
    hint: тата́рин / тата́рка
    accept:
    - тата́рин
  - stem: Гульна́ра из Каза́ни. Она́ ___.
    hint: тата́рин / тата́рка
    accept:
    - тата́рка
  - stem: Хосе́ с Ку́бы. В Москве́ он ___.
    hint: иностра́нец / иностра́нка
    accept:
    - иностра́нец
  why: '第 1、4、7、10、12 题：男性：[кита́ец, францу́з, москви́ч, тата́рин, иностра́нец]{.ru}。

    第 2、3、5、6、11 题：女性多加 [-ка]{.ru}：[китая́нка, япо́нка, францу́женка, москви́чка, тата́рка]{.ru}。

    第 8、9 题：[ру́сский, ру́сская]{.ru} 按形容词变。国籍名词都小写。'
