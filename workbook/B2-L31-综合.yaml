heading: 综合练习　动词体的用法
lessons:
- B2-L28
- B2-L29
- B2-L30
- B2-L31
groups:
- id: B2-L31-综合-a
  tags:
  - 综合：体的选择（过去、将来、命令式）
  task: 按行末的语境，写出“我”的过去时、将来时和对 [ты]{.ru} 的命令式。
  type: matrix
  cols:
  - 体对
  - 过去时
  - 将来时
  - 命令式
  given:
  - 0
  rows:
  - base: '[чита́ть / прочита́ть]{.ru}'
    cells:
    - '[чита́ть / прочита́ть]{.ru}'
    - '[прочита́л]{.ru}'
    - '[бу́ду чита́ть]{.ru}'
    - '[чита́й]{.ru}'
    hint: 过去：读完了；将来：要读一整天；命令：每天都读
  - base: '[писа́ть / написа́ть]{.ru}'
    cells:
    - '[писа́ть / написа́ть]{.ru}'
    - '[писа́л]{.ru}'
    - '[напишу́]{.ru}'
    - '[напиши́]{.ru}'
    hint: 过去：写过（只说事实）；将来：会写好；命令：写一下（这一次）
  - base: '[звони́ть / позвони́ть]{.ru}'
    cells:
    - '[звони́ть / позвони́ть]{.ru}'
    - '[звони́л]{.ru}'
    - '[позвоню́]{.ru}'
    - '[звони́]{.ru}'
    hint: 过去：常常打；将来：打一次；命令：每天晚上打
  - base: '[брать / взять]{.ru}'
    cells:
    - '[брать / взять]{.ru}'
    - '[взял]{.ru}'
    - '[возьму́]{.ru}'
    - '[бери́]{.ru}'
    hint: 过去：拿走了（还在我这儿）；将来：会拿走；命令：客气地请对方拿
  - base: '[забыва́ть / забы́ть]{.ru}'
    cells:
    - '[забыва́ть / забы́ть]{.ru}'
    - '[забы́л]{.ru}'
    - '[забу́ду]{.ru}'
    - '[не забу́дь]{.ru}'
    hint: 过去：（这一次）忘了；将来：会忘；命令：当心别忘
  - base: '[гото́вить / пригото́вить]{.ru}'
    cells:
    - '[гото́вить / пригото́вить]{.ru}'
    - '[гото́вил]{.ru}'
    - '[пригото́влю]{.ru}'
    - '[пригото́вь]{.ru}'
    hint: 过去：做了两个小时；将来：会做好；命令：（这一次）做好
  - base: '[учи́ть / вы́учить]{.ru}'
    cells:
    - '[учи́ть / вы́учить]{.ru}'
    - '[вы́учил]{.ru}'
    - '[бу́ду учи́ть]{.ru}'
    - '[вы́учи]{.ru}'
    hint: 过去：背会了；将来：每天都背；命令：（这一次）背会
  - base: '[открыва́ть / откры́ть]{.ru}'
    cells:
    - '[открыва́ть / откры́ть]{.ru}'
    - '[открыва́л]{.ru}'
    - '[откро́ю]{.ru}'
    - '[не открыва́й]{.ru}'
    hint: 过去：开过（现在又关上了）；将来：会打开；命令：一般地劝“别开”
  why: |-
    第 1–8 题：说结果、一次具体的事用完成体：[прочита́л, напишу́, позвоню́, взял, возьму́, вы́учил, откро́ю, напиши́, пригото́вь, вы́учи]{.ru}。
    第 1、6 题：说持续用未完成体：[бу́ду чита́ть, гото́вил]{.ru}；第 3 题说经常：[звони́л, звони́]{.ru}；第 7 题“每天都背”：[бу́ду учи́ть]{.ru}。
    第 2 题：只说事实“写过”，用未完成体 [писа́л]{.ru}。
    第 8 题：结果已取消用未完成体 [открыва́л]{.ru}；一般劝阻用 [не]{.ru} + 未完成体：[не открыва́й]{.ru}。
    第 4 题：客气地邀请用未完成体命令式：[бери́]{.ru}。
    第 5 题：提醒当心用 [не]{.ru} + 完成体：[не забу́дь]{.ru}。
  lessons:
  - B2-L28
  - B2-L29
  - B2-L30
  - B2-L31
  recycles:
  - B2-L28-02
  - B2-L29-01
  - B2-L30-01
- id: B2-L31-综合-b
  tags:
  - 综合：体的意义
  task: 句中动词的体表示什么？归栏。
  type: classify
  bins:
  - 一次、有结果
  - 过程、持续
  - 反复、经常
  - 只说事实或活动本身
  - 没做成、做不到、当心
  items:
  - text: '[Я прочита́л пье́су.]{.ru}'
    answer: 一次、有结果
  - text: '[Ма́ма пригото́вит у́жин.]{.ru}'
    answer: 一次、有结果
  - text: '[Возьми́ зонт.]{.ru}'
    answer: 一次、有结果
  - text: '[Мне на́до купи́ть хлеб.]{.ru}'
    answer: 一次、有结果
  - text: '[Я успе́л сде́лать упражне́ние.]{.ru}'
    answer: 一次、有结果
  - text: '[Мы це́лый час гуля́ли по па́рку.]{.ru}'
    answer: 过程、持续
  - text: '[Весь ве́чер я бу́ду писа́ть докла́д.]{.ru}'
    answer: 过程、持续
  - text: '[Когда́ ма́ма пришла́, Ми́ша спал.]{.ru}'
    answer: 过程、持续
  - text: '[Чита́й, чита́й, я слу́шаю.]{.ru}'
    answer: 过程、持续
  - text: '[Па́па до́лго реша́л зада́чу.]{.ru}'
    answer: 过程、持续
  - text: '[Я ча́сто звони́л ба́бушке.]{.ru}'
    answer: 反复、经常
  - text: '[Звони́ мне ка́ждый день.]{.ru}'
    answer: 反复、经常
  - text: '[Слова́ на́до повторя́ть ка́ждый день.]{.ru}'
    answer: 反复、经常
  - text: '[Ле́том я бу́ду ка́ждое у́тро пла́вать.]{.ru}'
    answer: 反复、经常
  - text: '[— Ты чита́л «Ревизо́ра»? — Чита́л.]{.ru}'
    answer: 只说事实或活动本身
  - text: '[Что ты бу́дешь де́лать за́втра?]{.ru}'
    answer: 只说事实或活动本身
  - text: '[Я люблю́ танцева́ть.]{.ru}'
    answer: 只说事实或活动本身
  - text: '[Мы уже́ говори́ли об э́том.]{.ru}'
    answer: 只说事实或活动本身
  - text: '[Пьер да́же писа́л стихи́ по-ру́сски.]{.ru}'
    answer: 只说事实或活动本身
  - text: '[Я не вы́учу все слова́ до за́втра.]{.ru}'
    answer: 没做成、做不到、当心
  - text: '[Не опозда́й!]{.ru}'
    answer: 没做成、做不到、当心
  - text: '[Э́ту дверь нельзя́ откры́ть.]{.ru}'
    answer: 没做成、做不到、当心
  - text: '[Осторо́жно, не урони́ ча́шку!]{.ru}'
    answer: 没做成、做不到、当心
  - text: '[Я ещё не прочита́л кни́гу.]{.ru}'
    answer: 没做成、做不到、当心
  why: |-
    第 1–5 题：完成体（过去、将来、命令式、[на́до, успе́ть]{.ru} 后的不定式）表示一次、做成：[прочита́л, пригото́вит, возьми́, купи́ть, сде́лать]{.ru}。
    第 6–10 题：未完成体表示过程、持续：[це́лый час, весь ве́чер, до́лго]{.ru}，某时正在进行（[Ми́ша спал]{.ru}），命令式催对方接着做（[Чита́й, чита́й]{.ru}）。
    第 11–14 题：未完成体表示反复：[ча́сто, ка́ждый день, ка́ждое у́тро]{.ru}。
    第 15–19 题：未完成体只说有没有做过、打算做什么活动、喜欢做什么：[чита́л, бу́дешь де́лать, люблю́ танцева́ть, говори́ли, писа́л]{.ru}。
    第 20–24 题：否定和完成体连用：将来时“做不到”（[не вы́учу]{.ru}），命令式“当心别”（[не опозда́й, не урони́]{.ru}），[нельзя́]{.ru}“不可能”（[нельзя́ откры́ть]{.ru}），过去时“还没做成”（[ещё не прочита́л]{.ru}）。
  lessons:
  - B2-L28
  - B2-L29
  - B2-L30
  - B2-L31
  recycles:
  - B2-L28-01
  - B2-L29-02
  - B2-L30-02
  - B2-L31-02
- id: B2-L31-综合-c
  tags:
  - 综合：体与形式（句中）
  task: 用括号里体对中合适的动词填空，写成句子需要的形式。
  type: fill
  items:
  - stem: Вчера́ я ___ це́лый ве́чер.
    hint: чита́ть / прочита́ть
    accept:
    - чита́л
  - stem: — Ты уже́ ___ письмо́? — Да, вот оно́.
    hint: писа́ть / написа́ть
    accept:
    - написа́л
  - stem: За́втра я ___ тебе́ в семь часо́в.
    hint: звони́ть / позвони́ть
    accept:
    - позвоню́
  - stem: ___ мне ка́ждое воскресе́нье!
    hint: писа́ть / написа́ть
    accept:
    - Пиши́
  - stem: Не ___ окно́, на у́лице хо́лодно.
    hint: открыва́ть / откры́ть
    accept:
    - открыва́й
  - stem: Смотри́, не ___ па́спорт!
    hint: забыва́ть / забы́ть
    accept:
    - забу́дь
  - stem: Ми́ша переста́л ___ телеви́зор.
    hint: смотре́ть / посмотре́ть
    accept:
    - смотре́ть
  - stem: Я не успе́л ___ уро́ки.
    hint: де́лать / сде́лать
    accept:
    - сде́лать
  - stem: Когда́ ты ___ все биле́ты, мы пойдём гуля́ть.
    hint: учи́ть / вы́учить
    accept:
    - вы́учишь
  - stem: Все выходны́е я ___ к экза́мену.
    hint: гото́виться / подгото́виться
    accept:
    - бу́ду гото́виться
  - stem: — Кто ___ мой слова́рь? Он лежи́т не на ме́сте.
    hint: брать / взять
    accept:
    - брал
  - stem: Сади́тесь, ___ пирожки́!
    hint: брать / взять
    accept:
    - бери́те
  - stem: 'Мне на́до ___ ма́ме: у неё сего́дня день рожде́ния.'
    hint: звони́ть / позвони́ть
    accept:
    - позвони́ть
  - stem: Я уста́л ___ одно́ и то же.
    hint: объясня́ть / объясни́ть
    accept:
    - объясня́ть
  why: |-
    第 1 题：[це́лый ве́чер]{.ru} 说持续，未完成体过去时 [чита́л]{.ru}。
    第 2 题：问结果（信写好了，就在这儿），完成体 [написа́л]{.ru}。
    第 3 题：一次具体的事，完成体将来时 [позвоню́]{.ru}，不加 [бу́ду]{.ru}。
    第 4 题：经常的要求，未完成体命令式 [Пиши́]{.ru}。
    第 5 题：一般劝阻，[не]{.ru} + 未完成体 [открыва́й]{.ru}。
    第 6 题：提醒当心，[не]{.ru} + 完成体 [забу́дь]{.ru}。
    第 7、14 题：[переста́ть, уста́ть]{.ru} 后只用未完成体不定式。
    第 8、13 题：[успе́ть]{.ru} 和表示一次的 [на́до]{.ru} 后用完成体。
    第 9 题：[когда́]{.ru} 从句说将来先完成的动作，完成体将来时 [вы́учишь]{.ru}。
    第 10 题：持续（[все выходны́е]{.ru}），未完成体将来时 [бу́ду гото́виться]{.ru}。
    第 11 题：词典又放回去了（结果已取消），未完成体 [брал]{.ru}。
    第 12 题：客气地请客人吃，未完成体命令式 [бери́те]{.ru}。
  lessons:
  - B2-L28
  - B2-L29
  - B2-L30
  - B2-L31
  recycles:
  - B2-L29-03
  - B2-L31-03
