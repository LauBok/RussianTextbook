heading: 第 19 课　人称代词变格
groups:
- id: B2-L19-01
  tags:
  - 人称代词：变格全表
  task: 写出人称代词的第二至第六格（第六格连同前置词 [о]{.ru} 写）。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  - 第四格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[меня́]{.ru}'
    - '[мне]{.ru}'
    - '[меня́]{.ru}'
    - '[мной]{.ru}'
    - '[обо мне]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[тебя́]{.ru}'
    - '[тебе́]{.ru}'
    - '[тебя́]{.ru}'
    - '[тобо́й]{.ru}'
    - '[о тебе́]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[его́]{.ru}'
    - '[ему́]{.ru}'
    - '[его́]{.ru}'
    - '[им]{.ru}'
    - '[о нём]{.ru}'
  - base: '[оно́]{.ru}'
    cells:
    - '[оно́]{.ru}'
    - '[его́]{.ru}'
    - '[ему́]{.ru}'
    - '[его́]{.ru}'
    - '[им]{.ru}'
    - '[о нём]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[её]{.ru}'
    - '[ей]{.ru}'
    - '[её]{.ru}'
    - '[ей]{.ru}'
    - '[о ней]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[нас]{.ru}'
    - '[нам]{.ru}'
    - '[нас]{.ru}'
    - '[на́ми]{.ru}'
    - '[о нас]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[вас]{.ru}'
    - '[вам]{.ru}'
    - '[вас]{.ru}'
    - '[ва́ми]{.ru}'
    - '[о вас]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[их]{.ru}'
    - '[им]{.ru}'
    - '[их]{.ru}'
    - '[и́ми]{.ru}'
    - '[о них]{.ru}'
  why: |-
    第 1–8 题：所有人称代词的第二格和第四格相同：[меня́ — меня́, её — её, их — их]{.ru}。
    第 1、2 题：[я, ты]{.ru} 第三格和第六格同形：[мне — обо мне, тебе́ — о тебе́]{.ru}；[о]{.ru} 在 [мне]{.ru} 前写成 [обо]{.ru}。第五格也可写 [мно́ю]{.ru}。
    第 3、4 题：[он]{.ru} 和 [оно́]{.ru} 除第一格外完全相同；第五格 [им]{.ru}，第六格只有带 [н-]{.ru} 的 [о нём]{.ru}。
    第 5 题：[она́]{.ru} 第二、四格 [её]{.ru}，第三、五格 [ей]{.ru}（第五格书面也写 [е́ю]{.ru}），第六格 [о ней]{.ru}。
    第 6、7 题：[мы, вы]{.ru} 第二、四、六格同形：[нас, вас]{.ru}；第五格重音在词干：[на́ми, ва́ми]{.ru}。
    第 8 题：[им]{.ru} 是 [они́]{.ru} 的第三格，又是 [он]{.ru} 的第五格，别混；[они́]{.ru} 的第五格是 [и́ми]{.ru}。
- id: B2-L19-02
  tags:
  - 人称代词：前置词后的 н-
  - 人称代词：ко мне, со мной, обо мне
  task: 写出前置词和人称代词组成的词组。
  type: matrix
  cols:
  - 代词
  - '[к]{.ru} + 第三格'
  - '[с]{.ru} + 第五格'
  - '[у]{.ru} + 第二格'
  - '[без]{.ru} + 第二格'
  - '[для]{.ru} + 第二格'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[ко мне]{.ru}'
    - '[со мной]{.ru}'
    - '[у меня́]{.ru}'
    - '[без меня́]{.ru}'
    - '[для меня́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[к тебе́]{.ru}'
    - '[с тобо́й]{.ru}'
    - '[у тебя́]{.ru}'
    - '[без тебя́]{.ru}'
    - '[для тебя́]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[к нему́]{.ru}'
    - '[с ним]{.ru}'
    - '[у него́]{.ru}'
    - '[без него́]{.ru}'
    - '[для него́]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[к ней]{.ru}'
    - '[с ней]{.ru}'
    - '[у неё]{.ru}'
    - '[без неё]{.ru}'
    - '[для неё]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[к нам]{.ru}'
    - '[с на́ми]{.ru}'
    - '[у нас]{.ru}'
    - '[без нас]{.ru}'
    - '[для нас]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[к вам]{.ru}'
    - '[с ва́ми]{.ru}'
    - '[у вас]{.ru}'
    - '[без вас]{.ru}'
    - '[для вас]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[к ним]{.ru}'
    - '[с ни́ми]{.ru}'
    - '[у них]{.ru}'
    - '[без них]{.ru}'
    - '[для них]{.ru}'
  why: |-
    第 1 题：[к, с]{.ru} 在 [мне, мной]{.ru} 前写成 [ко, со]{.ru}：[ко мне, со мной]{.ru}；[у, без, для]{.ru} 不变：[у меня́, без меня́, для меня́]{.ru}。
    第 2、5、6 题：第一、二人称前不加 [н-]{.ru}：[к тебе́, с на́ми, у вас]{.ru}。
    第 3、4、7 题：第三人称代词在前置词后一律加 [н-]{.ru}：[к нему́, с ним, у него́, без неё, для них]{.ru}。常见错误是写成 [у его́, с им]{.ru}。
- id: B2-L19-03
  tags:
  - 人称代词：前置词后的 н-
  - 物主代词 его, её, их 不加 н-
  task: 用代词填空（括号里给出原形和所指）。
  type: fill
  items:
  - stem: Я был у ___.
    hint: '[он]{.ru}　“他”'
    accept:
    - него́
  - stem: Я был у ___ бра́та.
    hint: '[он]{.ru}　“他的”'
    accept:
    - его́
  - stem: Мы говори́ли с ___ ма́мой.
    hint: '[она́]{.ru}　“她的”'
    accept:
    - её
  - stem: Мы говори́ли с ___.
    hint: '[она́]{.ru}　“她”'
    accept:
    - ней
  - stem: У ___ есть да́ча.
    hint: '[они́]{.ru}　“他们”'
    accept:
    - них
  - stem: У ___ сы́на есть да́ча.
    hint: '[они́]{.ru}　“他们的”'
    accept:
    - их
  - stem: Ю́ми пошла́ к ___ подру́ге.
    hint: '[она́]{.ru}　“她的”'
    accept:
    - её
  - stem: Ю́ми пошла́ к ___.
    hint: '[она́]{.ru}　“她”'
    accept:
    - ней
  - stem: Без ___ мы не начнём.
    hint: '[он]{.ru}　“他”'
    accept:
    - него́
  - stem: Без ___ слова́ря я не могу́ чита́ть.
    hint: '[он]{.ru}　“他的”'
    accept:
    - его́
  - stem: Ми́ша игра́ет с ___ соба́кой.
    hint: '[они́]{.ru}　“他们的”'
    accept:
    - их
  - stem: Ми́ша игра́ет с ___.
    hint: '[они́]{.ru}　“他们”'
    accept:
    - ни́ми
  - stem: Э́то пода́рок для ___.
    hint: '[она́]{.ru}　“她”'
    accept:
    - неё
  - stem: Э́то пода́рок для ___ сестры́.
    hint: '[она́]{.ru}　“她的”'
    accept:
    - её
  - stem: Я ничего́ не зна́ю о ___ рабо́те.
    hint: '[он]{.ru}　“他的”'
    accept:
    - его́
  - stem: Я ничего́ не зна́ю о ___.
    hint: '[он]{.ru}　“他”'
    accept:
    - нём
  why: |-
    第 1、4、5、8、9、12、13、16 题：代词本身作前置词的补语（“他、她、他们”），第三人称加 [н-]{.ru}：[у него́, с ней, у них, к ней, без него́, с ни́ми, для неё, о нём]{.ru}。
    第 2、3、6、7、10、11、14、15 题：代词后面有它修饰的名词，是物主代词“他的、她的、他们的”，不变格，也不加 [н-]{.ru}：[у его́ бра́та, с её ма́мой, у их сы́на, к её подру́ге]{.ru}。判断方法：看代词后面有没有名词。
- id: B2-L19-04
  tags:
  - 人称代词：句中各格
  task: 用括号里的代词填空。
  type: fill
  items:
  - stem: Ты меня́ слы́шишь? Позвони́ ___ ве́чером.
    hint: я
    accept:
    - мне
  - stem: Э́то А́нна. Ты зна́ешь ___?
    hint: она́
    accept:
    - её
  - stem: Ди́ма у́чится в на́шей гру́ппе. Мы ча́сто помога́ем ___.
    hint: он
    accept:
    - ему́
  - stem: Пое́дем ___ на да́чу!
    hint: к + я
    accept:
    - ко мне
  - stem: Ба́бушка о́чень лю́бит вну́ков и ча́сто звони́т ___.
    hint: они́
    accept:
    - им
  - stem: Что О́льга Ви́кторовна сказа́ла ___?
    hint: о + я
    accept:
    - обо мне
  - stem: Мы пригласи́ли ___ в теа́тр.
    hint: вы
    accept:
    - вас
  - stem: Учи́тель горди́тся ___.
    hint: мы
    accept:
    - на́ми
  - stem: Где Пьер? Я хочу́ поговори́ть с ___.
    hint: он
    accept:
    - ним
  - stem: Мои́ роди́тели в Пеки́не, я пишу́ ___ ка́ждую неде́лю.
    hint: они́
    accept:
    - им
  - stem: Иди́ сюда́, сади́сь ря́дом со ___.
    hint: я
    accept:
    - мной
  - stem: Мы интересу́емся ___ — э́то хоро́шие кни́ги.
    hint: они́
    accept:
    - и́ми
  why: |-
    第 1、3、5、10 题：[звони́ть, помога́ть, писа́ть кому́]{.ru} 要求第三格：[мне, ему́, им]{.ru}。第 5、10 题的 [им]{.ru} 是 [они́]{.ru} 的第三格，没有前置词，不加 [н-]{.ru}。
    第 2、7 题：及物动词要求第四格：[её, вас]{.ru}。
    第 4、6、11 题：[к, о, с]{.ru} 在 [мне, мной]{.ru} 前写成 [ко, обо, со]{.ru}；第 11 题题面已印出 [со]{.ru}，只写 [мной]{.ru}。
    第 8、12 题：[горди́ться, интересова́ться]{.ru} 要求第五格：[на́ми, и́ми]{.ru}；第 12 题没有前置词，不加 [н-]{.ru}。
    第 9 题：[с]{.ru} + 第五格，第三人称加 [н-]{.ru}：[с ним]{.ru}。
