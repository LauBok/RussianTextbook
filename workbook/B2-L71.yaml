heading: 第 71 课　形动词与副动词的识别
groups:
- id: B2-L71-01
  tags:
  - 形动词与副动词的识别：后缀
  task: 这些是什么形式？按后缀归栏。
  type: classify
  bins:
  - 主动现在时形动词
  - 主动过去时形动词
  - 被动现在时形动词
  - 被动过去时形动词
  - 未完成体副动词
  - 完成体副动词
  items:
  - text: '[пи́шущий]{.ru}'
    answer: 主动现在时形动词
  - text: '[прие́хавший]{.ru}'
    answer: 主动过去时形动词
  - text: '[изуча́емый]{.ru}'
    answer: 被动现在时形动词
  - text: '[напи́санный]{.ru}'
    answer: 被动过去时形动词
  - text: '[чита́я]{.ru}'
    answer: 未完成体副动词
  - text: '[прочита́в]{.ru}'
    answer: 完成体副动词
  - text: '[рабо́тающий]{.ru}'
    answer: 主动现在时形动词
  - text: '[написа́вший]{.ru}'
    answer: 主动过去时形动词
  - text: '[люби́мый]{.ru}'
    answer: 被动现在时形动词
  - text: '[откры́тый]{.ru}'
    answer: 被动过去时形动词
  - text: '[говоря́]{.ru}'
    answer: 未完成体副动词
  - text: '[сказа́в]{.ru}'
    answer: 完成体副动词
  - text: '[стоя́щий]{.ru}'
    answer: 主动现在时形动词
  - text: '[прочита́вший]{.ru}'
    answer: 主动过去时形动词
  - text: '[получа́емый]{.ru}'
    answer: 被动现在时形动词
  - text: '[пригото́вленный]{.ru}'
    answer: 被动过去时形动词
  - text: '[слу́шая]{.ru}'
    answer: 未完成体副动词
  - text: '[посмотре́в]{.ru}'
    answer: 完成体副动词
  - text: '[живу́щий]{.ru}'
    answer: 主动现在时形动词
  - text: '[сказа́вший]{.ru}'
    answer: 主动过去时形动词
  - text: '[забы́тый]{.ru}'
    answer: 被动过去时形动词
  - text: '[занима́ясь]{.ru}'
    answer: 未完成体副动词
  - text: '[прие́хав]{.ru}'
    answer: 完成体副动词
  why: '第 1、7、13、19 题：带 [-ущ-, -ющ-, -ащ-, -ящ-]{.ru} 和形容词词尾：主动现在时形动词（“正在……的”）：[пи́шущий, рабо́тающий, стоя́щий, живу́щий]{.ru}。

    第 2、8、14、20 题：带 [-вш-]{.ru}：主动过去时形动词（“……过的”）：[прие́хавший, написа́вший, прочита́вший, сказа́вший]{.ru}。

    第 3、9、15 题：带 [-ем-, -им-]{.ru}：被动现在时形动词：[изуча́емый, люби́мый, получа́емый]{.ru}。

    第 4、10、16、21 题：带 [-нн-, -енн-, -т-]{.ru}：被动过去时形动词（“被……了的”）：[напи́санный, откры́тый, пригото́вленный, забы́тый]{.ru}。

    第 5、11、17、22 题：没有词尾变化，以 [-я, -а]{.ru}（[-ясь, -ась]{.ru}）结尾：未完成体副动词（“一边……”）：[чита́я, говоря́, слу́шая, занима́ясь]{.ru}。

    第 6、12、18、23 题：以 [-в]{.ru}（[-вшись]{.ru}）结尾、没有形容词词尾：完成体副动词（“……以后”）：[прочита́в, сказа́в, посмотре́в, прие́хав]{.ru}。不要和带 [-вш-]{.ru} 又有词尾 [-ий]{.ru} 的形动词混淆。'
