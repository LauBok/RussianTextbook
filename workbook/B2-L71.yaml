  why: '第 1、3、5、7、11、13 题：现在时形动词（[-ущ-/-ящ-, -ем-]{.ru}）和 [-я]{.ru} 副动词只由未完成体构成：[пи́шущий ← писа́ть, изуча́емый ← изуча́ть, чита́я ← чита́ть, говоря́ ← говори́ть, живу́щий ← жить]{.ru}。从第三人称复数找词干：[пи́шут → пи́шущий]{.ru}。

    第 2、4、6、8、10、14 题：[-в]{.ru} 副动词和这里的 [-вш-, -нн-, -т-]{.ru} 形动词来自完成体：[посмотре́в ← посмотре́ть, отдохну́в ← отдохну́ть, прие́хавший ← прие́хать, забы́тый ← забы́ть]{.ru}。

    第 12 题：[-енн-]{.ru} 前可能有交替：[пригото́вленный ← пригото́вить]{.ru}；[постро́енный ← постро́ить]{.ru}（第 62 课的 [постро́ен]{.ru} 是它的短尾）。

    第 9 题：[-ясь, -ась]{.ru} 来自 [-ся]{.ru} 动词：[занима́ясь ← занима́ться]{.ru}。'
