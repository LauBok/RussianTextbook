heading: 第 27 课　能力与可能
groups:
- id: L27-01
  tags:
  - 第一变位：уме́ть
  - 不规则变位：мочь 的 г / ж 交替
  task: 按主语写出 [уме́ть]{.ru} 和 [мочь]{.ru} 的现在时。
  type: matrix
  cols:
  - 主语
  - '[уме́ть]{.ru}'
  - '[мочь]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[уме́ю]{.ru}'
    - '[могу́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[уме́ешь]{.ru}'
    - '[мо́жешь]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[уме́ет]{.ru}'
    - '[мо́жет]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[уме́ем]{.ru}'
    - '[мо́жем]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[уме́ете]{.ru}'
    - '[мо́жете]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[уме́ют]{.ru}'
    - '[мо́гут]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[уме́ет]{.ru}'
    - '[мо́жет]{.ru}'
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[уме́ют]{.ru}'
    - '[мо́гут]{.ru}'
  - base: '[А́нна и я]{.ru}'
    cells:
    - '[А́нна и я]{.ru}'
    - '[уме́ем]{.ru}'
    - '[мо́жем]{.ru}'
  - base: '[па́па]{.ru}'
    cells:
    - '[па́па]{.ru}'
    - '[уме́ет]{.ru}'
    - '[мо́жет]{.ru}'
  why: '第 1–10 题：[уме́ть]{.ru} 是规则的第一变位，词干 [уме́-]{.ru} 加 [-ю, -ешь … -ют]{.ru}。

    第 1、6、8 题：[мочь]{.ru} 的 [я]{.ru} 和 [они́]{.ru} 用 [г]{.ru}：[могу́, мо́гут]{.ru}；其余人称用 [ж]{.ru}：[мо́жешь, мо́жет, мо́жем, мо́жете]{.ru}。不要写成 *[мо́жут]{.ru}。

    第 2–10 题：[мочь]{.ru} 只有 [могу́]{.ru} 重音在词尾，从 [ты]{.ru} 起重音移到词干。'
- id: L27-02
  tags:
  - 情态意义：уме́ть 与 мочь 辨别
  task: 根据情景选择 [уме́ть]{.ru} 或 [мочь]{.ru}。
  type: classify
  bins:
  - '[уме́ть]{.ru}'
  - '[мочь]{.ru}'
  items:
  - text: '[пла́вать]{.ru}：小时候学过，游得很好'
    answer: '[уме́ть]{.ru}'
  - text: '[пла́вать]{.ru}：会游，可今天水太冷，游不了'
    answer: '[мочь]{.ru}'
  - text: '[игра́ть в ша́хматы]{.ru}：从没学过下棋'
    answer: '[уме́ть]{.ru}'
  - text: '[идти́ на конце́рт]{.ru}：今晚有课，去不了'
    answer: '[мочь]{.ru}'
  - text: '[гото́вить]{.ru}：妈妈教过他做饭'
    answer: '[уме́ть]{.ru}'
  - text: '[чита́ть]{.ru}：五岁的米沙已经学会认字'
    answer: '[уме́ть]{.ru}'
  - text: '[чита́ть]{.ru}：灯坏了，太暗，没法看书'
    answer: '[мочь]{.ru}'
  - text: '[игра́ть в футбо́л]{.ru}：脚受伤了，今天踢不了'
    answer: '[мочь]{.ru}'
  - text: '[игра́ть в хокке́й]{.ru}：米沙在学校学会了打冰球'
    answer: '[уме́ть]{.ru}'
  - text: '[гуля́ть]{.ru}：功课做完了，现在可以去散步'
    answer: '[мочь]{.ru}'
  - text: '[говори́ть по-кита́йски]{.ru}：王磊的同学学过两年汉语'
    answer: '[уме́ть]{.ru}'
  - text: '[спать]{.ru}：外面太吵，睡不着'
    answer: '[мочь]{.ru}'
  - text: '[писа́ть по-ру́сски]{.ru}：由美学过俄文书写'
    answer: '[уме́ть]{.ru}'
  - text: '[пить горя́чий чай]{.ru}：茶太烫，现在还喝不了'
    answer: '[мочь]{.ru}'
  why: '第 1、3、5、6、9、11、13 题：说的是学没学过、掌握没掌握某种技能，用 [уме́ть]{.ru}；否定时是“没学过，不会”：[Я не уме́ю игра́ть в ша́хматы]{.ru}。

    第 2、4、7、8、10、12、14 题：会不会不是问题，问题是现在的条件、身体状况允不允许，用 [мочь]{.ru}：[Сего́дня я не могу́ пла́вать]{.ru}。第 2 题前半句“会游”要用 [уме́ть]{.ru}，后半句“游不了”用 [мочь]{.ru}。'
- id: L27-03
  tags:
  - 情态动词 + 不定式 + 第四格宾语
  task: 用所给的词组成句子。
  type: matrix
  cols:
  - 词语
  - 句子
  rows:
  - base: '[он + мочь + чита́ть + ру́сская кла́ссика]{.ru}'
    cells:
    - '[он + мочь + чита́ть + ру́сская кла́ссика]{.ru}'
    - '[он мо́жет чита́ть ру́сскую кла́ссику]{.ru}'
  - base: '[я + уме́ть + гото́вить + ка́ша]{.ru}'
    cells:
    - '[я + уме́ть + гото́вить + ка́ша]{.ru}'
    - '[я уме́ю гото́вить ка́шу]{.ru}'
  - base: '[мы + хоте́ть + пить + горя́чий чай]{.ru}'
    cells:
    - '[мы + хоте́ть + пить + горя́чий чай]{.ru}'
    - '[мы хоти́м пить горя́чий чай]{.ru}'
  - base: '[ты + мочь + ждать + А́нна]{.ru}'
    cells:
    - '[ты + мочь + ждать + А́нна]{.ru}'
    - '[ты мо́жешь ждать А́нну]{.ru}'
  - base: '[они́ + люби́ть + слу́шать + рок]{.ru}'
    cells:
    - '[они́ + люби́ть + слу́шать + рок]{.ru}'
    - '[они́ лю́бят слу́шать рок]{.ru}'
  - base: '[Ми́ша + уме́ть + писа́ть + ска́зка]{.ru}'
    cells:
    - '[Ми́ша + уме́ть + писа́ть + ска́зка]{.ru}'
    - '[Ми́ша уме́ет писа́ть ска́зку]{.ru}'
  - base: '[вы + хоте́ть + смотре́ть + но́вый фильм]{.ru}'
    cells:
    - '[вы + хоте́ть + смотре́ть + но́вый фильм]{.ru}'
    - '[вы хоти́те смотре́ть но́вый фильм]{.ru}'
  - base: '[я + мочь + слу́шать + ле́кция]{.ru}'
    cells:
    - '[я + мочь + слу́шать + ле́кция]{.ru}'
    - '[я могу́ слу́шать ле́кцию]{.ru}'
  - base: '[А́нна + люби́ть + слу́шать + Чайко́вский]{.ru}'
    cells:
    - '[А́нна + люби́ть + слу́шать + Чайко́вский]{.ru}'
    - '[А́нна лю́бит слу́шать Чайко́вского]{.ru}'
  - base: '[мы + мочь + покупа́ть + откры́тка]{.ru}'
    cells:
    - '[мы + мочь + покупа́ть + откры́тка]{.ru}'
    - '[мы мо́жем покупа́ть откры́тку]{.ru}'
  - base: '[ба́бушка + уме́ть + гото́вить + вку́сная ры́ба]{.ru}'
    cells:
    - '[ба́бушка + уме́ть + гото́вить + вку́сная ры́ба]{.ru}'
    - '[ба́бушка уме́ет гото́вить вку́сную ры́бу]{.ru}'
    new: true
    gloss: 好吃的鱼
  - base: '[они́ + хоте́ть + ви́деть + наш преподава́тель]{.ru}'
    cells:
    - '[они́ + хоте́ть + ви́деть + наш преподава́тель]{.ru}'
    - '[они́ хотя́т ви́деть на́шего преподава́теля]{.ru}'
  why: '第 1–12 题：人称只由第一个动词表示，第二个动词保持不定式；不定式后面的宾语照常用第四格。

    第 1、11 题：形容词修饰阴性名词用 [-ую]{.ru}：[ру́сскую кла́ссику, вку́сную ры́бу]{.ru}；第 2、6、8、10 题阴性名词改 [-у / -ю]{.ru}。

    第 3、5、7 题：阳性非动物宾语同第一格：[горя́чий чай, рок, но́вый фильм]{.ru}。

    第 4、9、12 题：动物名词宾语：[А́нну, Чайко́вского, на́шего преподава́теля]{.ru}。

    第 1、4、8、10 题：[мо́жет, мо́жешь, мо́жем]{.ru} 用 [ж]{.ru}，[могу́]{.ru} 用 [г]{.ru}。'
