heading: 第 16 课　无人称句
groups:
- id: B3-L16-01
  lessons:
  - B3-L16
  tags:
  - не хвата́ть
  task: 用 [не хвата́ть]{.ru} 写句子：现在时和过去时。
  type: matrix
  cols:
  - 主体 + 缺少的东西
  - 现在时
  - 过去时
  given:
  - 0
  rows:
  - base: '[я + вре́мя]{.ru}'
    cells:
    - '[я + вре́мя]{.ru}'
    - '[Мне не хвата́ет вре́мени.]{.ru}'
    - '[Мне не хвата́ло вре́мени.]{.ru}'
  - base: '[студе́нты + кни́ги]{.ru}'
    cells:
    - '[студе́нты + кни́ги]{.ru}'
    - '[Студе́нтам не хвата́ет книг.]{.ru}'
    - '[Студе́нтам не хвата́ло книг.]{.ru}'
  - base: '[ба́бушка + си́лы]{.ru}'
    cells:
    - '[ба́бушка + си́лы]{.ru}'
    - '[Ба́бушке не хвата́ет сил.]{.ru}'
    - '[Ба́бушке не хвата́ло сил.]{.ru}'
  - base: '[мы + де́ньги]{.ru}'
    cells:
    - '[мы + де́ньги]{.ru}'
    - '[Нам не хвата́ет де́нег.]{.ru}'
    - '[Нам не хвата́ло де́нег.]{.ru}'
  - base: '[он + о́пыт]{.ru}'
    cells:
    - '[он + о́пыт]{.ru}'
    - '[Ему́ не хвата́ет о́пыта.]{.ru}'
    - '[Ему́ не хвата́ло о́пыта.]{.ru}'
  - base: '[го́род + вода́]{.ru}'
    cells:
    - '[го́род + вода́]{.ru}'
    - '[Го́роду не хвата́ет воды́.]{.ru}'
    - '[Го́роду не хвата́ло воды́.]{.ru}'
  - base: '[шко́ла + учителя́]{.ru}'
    cells:
    - '[шко́ла + учителя́]{.ru}'
    - '[Шко́ле не хвата́ет учителе́й.]{.ru}'
    - '[Шко́ле не хвата́ло учителе́й.]{.ru}'
  - base: '[она́ + терпе́ние]{.ru}'
    cells:
    - '[она́ + терпе́ние]{.ru}'
    - '[Ей не хвата́ет терпе́ния.]{.ru}'
    - '[Ей не хвата́ло терпе́ния.]{.ru}'
    new: true
    gloss: 耐心
  - base: '[они́ + места́]{.ru}'
    cells:
    - '[они́ + места́]{.ru}'
    - '[Им не хвата́ет мест.]{.ru}'
    - '[Им не хвата́ло мест.]{.ru}'
  - base: '[де́ти + све́жий во́здух]{.ru}'
    cells:
    - '[де́ти + све́жий во́здух]{.ru}'
    - '[Де́тям не хвата́ет све́жего во́здуха.]{.ru}'
    - '[Де́тям не хвата́ло све́жего во́здуха.]{.ru}'
  why: |-
    第 1–10 题：缺的人用第三格（[мне, студе́нтам, ба́бушке, нам, ему́, го́роду, шко́ле, ей, им, де́тям]{.ru}），缺少的东西用第二格（[вре́мени, книг, сил, де́нег, о́пыта, воды́, учителе́й, терпе́ния, мест, све́жего во́здуха]{.ru}），动词永远是单数：现在时 [не хвата́ет]{.ru}，过去时中性 [не хвата́ло]{.ru}。
    第 2、3、4、7、9 题：缺少的东西是复数时动词也不变成复数：[не хвата́ло книг]{.ru}，不说 [не хвата́ли]{.ru}。复数第二格：[книг, сил, де́нег, учителе́й, мест]{.ru}。
- id: B3-L16-02
  lessons:
  - B3-L16
  tags:
  - 无人称动词：удава́ться、приходи́ться、спа́ться
  - 状态词 + 第三格
  task: 改成无人称说法：写出主体和谓语。
  type: matrix
  cols:
  - 人称说法
  - 主体
  - 谓语
  given:
  - 0
  rows:
  - base: '[Я смог купи́ть биле́т.]{.ru}'
    cells:
    - '[Я смог купи́ть биле́т.]{.ru}'
    - '[мне]{.ru}'
    - '[удало́сь]{.ru}'
  - base: '[Вчера́ мы должны́ бы́ли бежа́ть к ваго́ну.]{.ru}'
    cells:
    - '[Вчера́ мы должны́ бы́ли бежа́ть к ваго́ну.]{.ru}'
    - '[нам]{.ru}'
    - '[пришло́сь]{.ru}'
  - base: '[Я всю ночь не мог засну́ть.]{.ru}'
    cells:
    - '[Я всю ночь не мог засну́ть.]{.ru}'
    - '[мне]{.ru}'
    - '[не спало́сь]{.ru}'
  - base: '[Он хо́чет пить.]{.ru}'
    cells:
    - '[Он хо́чет пить.]{.ru}'
    - '[ему́]{.ru}'
    - '[хо́чется]{.ru}'
  - base: '[Студе́нты ча́сто должны́ рабо́тать по вечера́м.]{.ru}'
    cells:
    - '[Студе́нты ча́сто должны́ рабо́тать по вечера́м.]{.ru}'
    - '[студе́нтам]{.ru}'
    - '[прихо́дится]{.ru}'
  - base: '[Она́ смогла́ найти́ рабо́ту.]{.ru}'
    cells:
    - '[Она́ смогла́ найти́ рабо́ту.]{.ru}'
    - '[ей]{.ru}'
    - '[удало́сь]{.ru}'
  - base: '[Мы ску́чали в по́езде.]{.ru}'
    cells:
    - '[Мы ску́чали в по́езде.]{.ru}'
    - '[нам]{.ru}'
    - '[бы́ло ску́чно]{.ru}'
  - base: '[Де́ти хоте́ли спать.]{.ru}'
    cells:
    - '[Де́ти хоте́ли спать.]{.ru}'
    - '[де́тям]{.ru}'
    - '[хоте́лось]{.ru}'
  - base: '[Я сего́дня не могу́ засну́ть.]{.ru}'
    cells:
    - '[Я сего́дня не могу́ засну́ть.]{.ru}'
    - '[мне]{.ru}'
    - '[не спи́тся]{.ru}'
  - base: '[Ты до́лжен был ждать два часа́.]{.ru}'
    cells:
    - '[Ты до́лжен был ждать два часа́.]{.ru}'
    - '[тебе́]{.ru}'
    - '[пришло́сь]{.ru}'
  - base: '[Мы боя́лись.]{.ru}'
    cells:
    - '[Мы боя́лись.]{.ru}'
    - '[нам]{.ru}'
    - '[бы́ло стра́шно]{.ru}'
  - base: '[Ми́ша смо́жет реши́ть э́ту зада́чу.]{.ru}'
    cells:
    - '[Ми́ша смо́жет реши́ть э́ту зада́чу.]{.ru}'
    - '[Ми́ше]{.ru}'
    - '[уда́стся]{.ru}'
  why: |-
    第 1–12 题：无人称句的主体用第三格：[мне, нам, ему́, студе́нтам, ей, де́тям, тебе́, Ми́ше]{.ru}；谓语是第三人称单数或过去时中性。
    第 1、6、12 题：[смочь]{.ru} → [уда́ться]{.ru}：过去 [удало́сь]{.ru}，将来 [уда́стся]{.ru}。
    第 2、5、10 题：[до́лжен]{.ru} → [прийти́сь / приходи́ться]{.ru}：一次的事用完成体 [пришло́сь]{.ru}，经常的事用未完成体 [прихо́дится]{.ru}。
    第 3、9 题：[не мочь засну́ть]{.ru} → [не спа́ться]{.ru}：过去 [не спало́сь]{.ru}，现在 [не спи́тся]{.ru}。
    第 4、8 题：[хоте́ть]{.ru} → [хоте́ться]{.ru}：[хо́чется, хоте́лось]{.ru}。
    第 7、11 题：状态词 + 第三格，过去时加 [бы́ло]{.ru}：[бы́ло ску́чно, бы́ло стра́шно]{.ru}。
- id: B3-L16-03
  lessons:
  - B3-L16
  tags:
  - 无人称句：改错
  task: 改正错误，正确的照抄。
  type: matrix
  cols:
  - 句子
  - 改正
  given:
  - 0
  rows:
  - base: '[Я хо́чется спать.]{.ru}'
    cells:
    - '[Я хо́чется спать.]{.ru}'
    - '[Мне хо́чется спать.]{.ru}'
  - base: '[Нам не хвата́ли де́нег.]{.ru}'
    cells:
    - '[Нам не хвата́ли де́нег.]{.ru}'
    - '[Нам не хвата́ло де́нег.]{.ru}'
  - base: '[Пассажи́ры не хвата́ет интерне́та.]{.ru}'
    cells:
    - '[Пассажи́ры не хвата́ет интерне́та.]{.ru}'
    - '[Пассажи́рам не хвата́ет интерне́та.]{.ru}'
  - base: '[Нам бы́ли ску́чно.]{.ru}'
    cells:
    - '[Нам бы́ли ску́чно.]{.ru}'
    - '[Нам бы́ло ску́чно.]{.ru}'
  - base: '[Мне не хвата́ет вре́мя.]{.ru}'
    cells:
    - '[Мне не хвата́ет вре́мя.]{.ru}'
    - '[Мне не хвата́ет вре́мени.]{.ru}'
  - base: '[Ей бы́ло жаль расстава́ться с друзья́ми.]{.ru}'
    cells:
    - '[Ей бы́ло жаль расстава́ться с друзья́ми.]{.ru}'
    - '[Ей бы́ло жаль расстава́ться с друзья́ми.]{.ru}'
  - base: '[Я удало́сь купи́ть биле́т.]{.ru}'
    cells:
    - '[Я удало́сь купи́ть биле́т.]{.ru}'
    - '[Мне удало́сь купи́ть биле́т.]{.ru}'
  - base: '[Нам пришло́сь ждать два часа́.]{.ru}'
    cells:
    - '[Нам пришло́сь ждать два часа́.]{.ru}'
    - '[Нам пришло́сь ждать два часа́.]{.ru}'
  - base: '[Де́тям не хвати́ли игру́шек.]{.ru}'
    cells:
    - '[Де́тям не хвати́ли игру́шек.]{.ru}'
    - '[Де́тям не хвати́ло игру́шек.]{.ru}'
  - base: '[Вчера́ ему́ не спало́сь.]{.ru}'
    cells:
    - '[Вчера́ ему́ не спало́сь.]{.ru}'
    - '[Вчера́ ему́ не спало́сь.]{.ru}'
  - base: '[Мне удала́сь сдать экза́мен.]{.ru}'
    cells:
    - '[Мне удала́сь сдать экза́мен.]{.ru}'
    - '[Мне удало́сь сдать экза́мен.]{.ru}'
  - base: '[Студе́нты бы́ло ве́село.]{.ru}'
    cells:
    - '[Студе́нты бы́ло ве́село.]{.ru}'
    - '[Студе́нтам бы́ло ве́село.]{.ru}'
  why: |-
    第 1、3、7、12 题：无人称句的主体用第三格，不用第一格：[Мне хо́чется, Пассажи́рам не хвата́ет, Мне удало́сь, Студе́нтам бы́ло]{.ru}。
    第 2、9、11 题：无人称动词的过去时永远是中性单数，不和缺少的东西或别的词一致：[не хвата́ло де́нег, не хвати́ло игру́шек, удало́сь]{.ru}。
    第 4 题：状态词前的系词也是中性单数：[бы́ло ску́чно]{.ru}。
    第 5 题：缺少的东西用第二格：[вре́мени]{.ru}。
    第 6、8、10 题：原文正确，照抄。
