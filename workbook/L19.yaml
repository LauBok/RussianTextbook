heading: 第 19 课　物主代词与指示代词第六格
groups:
- id: L19-01
  tags:
  - 物主代词单数第六格：按性配合
  task: 写出代词和名词的第六格词组。
  type: matrix
  cols:
  - 代词＋名词
  - 第六格词组
  given:
  - 0
  rows:
  - base: '[мой + ко́мната]{.ru}'
    cells:
    - '[мой + ко́мната]{.ru}'
    - '[в мое́й ко́мнате]{.ru}'
  - base: '[мой + дом]{.ru}'
    cells:
    - '[мой + дом]{.ru}'
    - '[в моём до́ме]{.ru}'
  - base: '[твой + общежи́тие]{.ru}'
    cells:
    - '[твой + общежи́тие]{.ru}'
    - '[в твоём общежи́тии]{.ru}'
  - base: '[наш + шко́ла]{.ru}'
    cells:
    - '[наш + шко́ла]{.ru}'
    - '[в на́шей шко́ле]{.ru}'
  - base: '[ваш + факульте́т]{.ru}'
    cells:
    - '[ваш + факульте́т]{.ru}'
    - '[на ва́шем факульте́те]{.ru}'
  - base: '[твой + су́мка]{.ru}'
    cells:
    - '[твой + су́мка]{.ru}'
    - '[в твое́й су́мке]{.ru}'
  - base: '[наш + университе́т]{.ru}'
    cells:
    - '[наш + университе́т]{.ru}'
    - '[в на́шем университе́те]{.ru}'
  - base: '[ваш + аудито́рия]{.ru}'
    cells:
    - '[ваш + аудито́рия]{.ru}'
    - '[в ва́шей аудито́рии]{.ru}'
  - base: '[чей + ко́мната]{.ru}'
    cells:
    - '[чей + ко́мната]{.ru}'
    - '[в чьей ко́мнате]{.ru}'
  - base: '[чей + дом]{.ru}'
    cells:
    - '[чей + дом]{.ru}'
    - '[в чьём до́ме]{.ru}'
  - base: '[его́ + кварти́ра]{.ru}'
    cells:
    - '[его́ + кварти́ра]{.ru}'
    - '[в его́ кварти́ре]{.ru}'
  - base: '[её + райо́н]{.ru}'
    cells:
    - '[её + райо́н]{.ru}'
    - '[в её райо́не]{.ru}'
  - base: '[их + шко́ла]{.ru}'
    cells:
    - '[их + шко́ла]{.ru}'
    - '[в их шко́ле]{.ru}'
  - base: '[мой + портфе́ль]{.ru}'
    cells:
    - '[мой + портфе́ль]{.ru}'
    - '[в моём портфе́ле]{.ru}'
    hint: m
    new: true
    gloss: 公文包
  - base: '[наш + пло́щадь]{.ru}'
    cells:
    - '[наш + пло́щадь]{.ru}'
    - '[на на́шей пло́щади]{.ru}'
  - base: '[ваш + мо́ре]{.ru}'
    cells:
    - '[ваш + мо́ре]{.ru}'
    - '[на ва́шем мо́ре]{.ru}'
  why: |-
    第 2、3、5、7、14、16 题：阳性、中性名词前：[моём, твоём]{.ru}（重音在词尾），[на́шем, ва́шем]{.ru}：[в моём до́ме, в твоём общежи́тии, на ва́шем факульте́те, в моём портфе́ле]{.ru}。
    第 1、4、6、8、15 题：阴性名词前：[мое́й, твое́й, на́шей, ва́шей]{.ru}：[в мое́й ко́мнате, в на́шей шко́ле, на на́шей пло́щади]{.ru}。
    第 9、10 题：[чей]{.ru} 同样变：[в чьей ко́мнате, в чьём до́ме]{.ru}。
    第 11–13 题：[его́, её, их]{.ru} 不变，前面也不加 [н]{.ru}：[в его́ кварти́ре, в её райо́не, в их шко́ле]{.ru}。
- id: L19-02
  tags:
  - 指示代词 э́тот / тот：第一格与第六格对照
  task: 写出带 [э́тот]{.ru}、[тот]{.ru} 的第一格和第六格词组。
  type: matrix
  cols:
  - 名词
  - 这个（第一格）
  - 那个（第一格）
  - 在这个……（第六格）
  - 在那个……（第六格）
  given:
  - 0
  rows:
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[э́тот дом]{.ru}'
    - '[тот дом]{.ru}'
    - '[в э́том до́ме]{.ru}'
    - '[в том до́ме]{.ru}'
  - base: '[ко́мната]{.ru}'
    cells:
    - '[ко́мната]{.ru}'
    - '[э́та ко́мната]{.ru}'
    - '[та ко́мната]{.ru}'
    - '[в э́той ко́мнате]{.ru}'
    - '[в той ко́мнате]{.ru}'
  - base: '[зда́ние]{.ru}'
    cells:
    - '[зда́ние]{.ru}'
    - '[э́то зда́ние]{.ru}'
    - '[то зда́ние]{.ru}'
    - '[в э́том зда́нии]{.ru}'
    - '[в том зда́нии]{.ru}'
  - base: '[кварти́ра]{.ru}'
    cells:
    - '[кварти́ра]{.ru}'
    - '[э́та кварти́ра]{.ru}'
    - '[та кварти́ра]{.ru}'
    - '[в э́той кварти́ре]{.ru}'
    - '[в той кварти́ре]{.ru}'
  - base: '[райо́н]{.ru}'
    cells:
    - '[райо́н]{.ru}'
    - '[э́тот райо́н]{.ru}'
    - '[тот райо́н]{.ru}'
    - '[в э́том райо́не]{.ru}'
    - '[в том райо́не]{.ru}'
  - base: '[о́зеро]{.ru}'
    cells:
    - '[о́зеро]{.ru}'
    - '[э́то о́зеро]{.ru}'
    - '[то о́зеро]{.ru}'
    - '[на э́том о́зере]{.ru}'
    - '[на том о́зере]{.ru}'
  - base: '[аудито́рия]{.ru}'
    cells:
    - '[аудито́рия]{.ru}'
    - '[э́та аудито́рия]{.ru}'
    - '[та аудито́рия]{.ru}'
    - '[в э́той аудито́рии]{.ru}'
    - '[в той аудито́рии]{.ru}'
  - base: '[факульте́т]{.ru}'
    cells:
    - '[факульте́т]{.ru}'
    - '[э́тот факульте́т]{.ru}'
    - '[тот факульте́т]{.ru}'
    - '[на э́том факульте́те]{.ru}'
    - '[на том факульте́те]{.ru}'
  - base: '[пло́щадь]{.ru}'
    cells:
    - '[пло́щадь]{.ru}'
    - '[э́та пло́щадь]{.ru}'
    - '[та пло́щадь]{.ru}'
    - '[на э́той пло́щади]{.ru}'
    - '[на той пло́щади]{.ru}'
  - base: '[общежи́тие]{.ru}'
    cells:
    - '[общежи́тие]{.ru}'
    - '[э́то общежи́тие]{.ru}'
    - '[то общежи́тие]{.ru}'
    - '[в э́том общежи́тии]{.ru}'
    - '[в том общежи́тии]{.ru}'
  why: |-
    第 1、5、8 题：阳性：[э́тот / тот]{.ru}，第六格 [в э́том / в том]{.ru}：[в э́том до́ме, на том факульте́те]{.ru}。
    第 3、6、10 题：中性：[э́то / то]{.ru}，第六格和阳性相同：[в э́том зда́нии, на том о́зере]{.ru}。
    第 2、4、7、9 题：阴性：[э́та / та]{.ru}，第六格 [в э́той / в той]{.ru}：[в э́той ко́мнате, на той пло́щади]{.ru}。
- id: L19-03
  tags:
  - 代词、形容词与名词单数第六格：三词配合
  task: 把三个词组成第六格词组。
  type: matrix
  cols:
  - 原形
  - 第六格词组
  given:
  - 0
  rows:
  - base: '[мой + но́вый + дом]{.ru}'
    cells:
    - '[мой + но́вый + дом]{.ru}'
    - '[в моём но́вом до́ме]{.ru}'
  - base: '[э́тот + ста́рый + зда́ние]{.ru}'
    cells:
    - '[э́тот + ста́рый + зда́ние]{.ru}'
    - '[в э́том ста́ром зда́нии]{.ru}'
  - base: '[наш + краси́вый + ко́мната]{.ru}'
    cells:
    - '[наш + краси́вый + ко́мната]{.ru}'
    - '[в на́шей краси́вой ко́мнате]{.ru}'
  - base: '[тот + ую́тный + кварти́ра]{.ru}'
    cells:
    - '[тот + ую́тный + кварти́ра]{.ru}'
    - '[в той ую́тной кварти́ре]{.ru}'
  - base: '[ваш + большо́й + общежи́тие]{.ru}'
    cells:
    - '[ваш + большо́й + общежи́тие]{.ru}'
    - '[в ва́шем большо́м общежи́тии]{.ru}'
  - base: '[твой + си́ний + су́мка]{.ru}'
    cells:
    - '[твой + си́ний + су́мка]{.ru}'
    - '[в твое́й си́ней су́мке]{.ru}'
  - base: '[э́тот + ти́хий + райо́н]{.ru}'
    cells:
    - '[э́тот + ти́хий + райо́н]{.ru}'
    - '[в э́том ти́хом райо́не]{.ru}'
  - base: '[наш + ру́сский + шко́ла]{.ru}'
    cells:
    - '[наш + ру́сский + шко́ла]{.ru}'
    - '[в на́шей ру́сской шко́ле]{.ru}'
  - base: '[тот + филологи́ческий + факульте́т]{.ru}'
    cells:
    - '[тот + филологи́ческий + факульте́т]{.ru}'
    - '[на том филологи́ческом факульте́те]{.ru}'
  - base: '[мой + ста́рый + портфе́ль]{.ru}'
    cells:
    - '[мой + ста́рый + портфе́ль]{.ru}'
    - '[в моём ста́ром портфе́ле]{.ru}'
    hint: m
    new: true
    gloss: 公文包
  - base: '[э́тот + о́бщий + ку́хня]{.ru}'
    cells:
    - '[э́тот + о́бщий + ку́хня]{.ru}'
    - '[на э́той о́бщей ку́хне]{.ru}'
  - base: '[ваш + хоро́ший + университе́т]{.ru}'
    cells:
    - '[ваш + хоро́ший + университе́т]{.ru}'
    - '[в ва́шем хоро́шем университе́те]{.ru}'
  - base: '[его́ + ма́ленький + ко́мната]{.ru}'
    cells:
    - '[его́ + ма́ленький + ко́мната]{.ru}'
    - '[в его́ ма́ленькой ко́мнате]{.ru}'
  - base: '[их + но́вый + дом]{.ru}'
    cells:
    - '[их + но́вый + дом]{.ru}'
    - '[в их но́вом до́ме]{.ru}'
  - base: '[тот + большо́й + пло́щадь]{.ru}'
    cells:
    - '[тот + большо́й + пло́щадь]{.ru}'
    - '[на той большо́й пло́щади]{.ru}'
  - base: '[наш + сосе́дний + райо́н]{.ru}'
    cells:
    - '[наш + сосе́дний + райо́н]{.ru}'
    - '[в на́шем сосе́днем райо́не]{.ru}'
    new: true
    gloss: 相邻的
  why: |-
    第 1、7、9、10 题：阳性：代词 [-ём / -ем, том, э́том]{.ru}，形容词 [-ом]{.ru}，名词 [-е]{.ru}：[в моём но́вом до́ме, в э́том ти́хом райо́не, на том филологи́ческом факульте́те]{.ru}。
    第 12、16 题：形容词是 [ш]{.ru} 词干或软变化时写 [-ем]{.ru}：[в ва́шем хоро́шем университе́те, в на́шем сосе́днем райо́не]{.ru}。
    第 2、5 题：中性和阳性词尾相同，名词 [-ие]{.ru} 变 [-ии]{.ru}：[в э́том ста́ром зда́нии, в ва́шем большо́м общежи́тии]{.ru}。
    第 3、4、8、15 题：阴性：代词 [-ей, той, э́той]{.ru}，形容词 [-ой]{.ru}：[в на́шей краси́вой ко́мнате, в той ую́тной кварти́ре, на той большо́й пло́щади]{.ru}。
    第 6、11 题：阴性软变化和 [щ]{.ru} 词干写 [-ей]{.ru}：[в твое́й си́ней су́мке, на э́той о́бщей ку́хне]{.ru}。
    第 13、14 题：[его́, их]{.ru} 不变，只变形容词和名词：[в его́ ма́ленькой ко́мнате, в их но́вом до́ме]{.ru}。
- id: L19-04
  tags:
  - 物主与指示代词：句中填空
  task: 用括号里代词的适当形式填空。
  type: fill
  items:
  - stem: Мы живём в ___ до́ме.
    hint: наш
    accept:
    - на́шем
  - stem: Кни́га в ___ су́мке.
    hint: мой
    accept:
    - мое́й
  - stem: Что в ___ портфе́ле?
    hint: твой
    accept:
    - твоём
  - stem: Мы говори́м об ___ фи́льме.
    hint: э́тот
    accept:
    - э́том
  - stem: ___ дом большо́й, а тот ма́ленький.
    hint: э́тот
    accept:
    - Э́тот
  - stem: В ___ ко́мнате живёт Ми́ша, а в той — А́нна.
    hint: э́тот
    accept:
    - э́той
  - stem: Па́па ду́мает о ___ рабо́те.
    hint: ваш
    accept:
    - ва́шей
  - stem: ___ кни́га интере́сная.
    hint: э́тот
    accept:
    - Э́та
  - stem: Ми́ша игра́ет в ___ па́рке.
    hint: тот
    accept:
    - том
  - stem: ___ студе́нты живу́т в общежи́тии.
    hint: э́тот
    accept:
    - Э́ти
  - stem: Ру́чка на ___ столе́.
    hint: мой
    accept:
    - моём
  - stem: ___ о́зеро большо́е, а э́то ма́ленькое.
    hint: тот
    accept:
    - То
  - stem: В ___ ко́мнате ты живёшь?
    hint: чей
    accept:
    - чьей
  - stem: Студе́нты в ___ аудито́рии.
    hint: наш
    accept:
    - на́шей
  - stem: ___ пи́сьма на столе́.
    hint: тот
    accept:
    - Те
  - stem: Мы бы́ли на ___ конце́рте.
    hint: тот
    accept:
    - том
  - stem: ___ кварти́ра больша́я, а э́та ма́ленькая.
    hint: тот
    accept:
    - Та
  - stem: Мы говори́м о ___ шко́ле.
    hint: твой
    accept:
    - твое́й
  - stem: В ___ общежи́тии живёт Пьер?
    hint: э́тот
    accept:
    - э́том
  - stem: Ми́ша живёт в ___ ко́мнате.
    hint: тот
    accept:
    - той
  - stem: Мы ду́маем о ___ до́ме.
    hint: ваш
    accept:
    - ва́шем
  why: |-
    第 1–3、7、11、13、14、18、21 题：物主代词第六格：阳性、中性 [на́шем, твоём, моём]{.ru}，阴性 [мое́й, ва́шей, на́шей, чьей, твое́й]{.ru}；[ва́шем (до́ме)]{.ru}。
    第 4、6、9、16、19、20 题：指示代词第六格：阳性、中性 [э́том, том]{.ru}，阴性 [э́той, той]{.ru}；[э́том]{.ru} 以元音开头，前面用 [об]{.ru}：[об э́том фи́льме]{.ru}。
    第 5、8、10、12、15、17 题：作主语的部分用第一格，和名词的性数一致：[Э́тот дом, Э́та кни́га, То о́зеро, Та кварти́ра]{.ru}；复数 [Э́ти студе́нты, Те пи́сьма]{.ru}。
