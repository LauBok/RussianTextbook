  why: '第 1、4、5、9、10、12 题：序数词按硬变化形容词变格：[-ого, -ому, -ым, о -ом]{.ru}；阴性第二格 [-ой]{.ru}，阴性第三、五、六格与它同形（[пя́той]{.ru}）。重音在词干上，不动。

    第 2、6–8、11 题：[второ́й, шесто́й, седьмо́й, восьмо́й, сороково́й]{.ru} 重音在词尾，按 [молодо́й]{.ru} 变：[второ́го, вторы́м, о второ́м]{.ru}；第五格写 [-ы́м]{.ru}。阴性第二格 [второ́й]{.ru} 和阳性第一格同形。

    第 3 题：[тре́тий]{.ru} 变格时词尾前有 [-ь-]{.ru}：[тре́тьего, тре́тьему, тре́тьим, о тре́тьем, тре́тьей]{.ru}；不要写成 *[тре́тего]{.ru}*。

    第 9 题：[оди́ннадцатый]{.ru} 以元音开头，第六格前置词用 [об]{.ru}。'
- id: B2-L56-02
  tags:
  - 年份：в … году́ 与 с / до + 第二格
  task: 用文字写出年份的两种说法。
  type: matrix
  cols:
  - 年份
  - 在……年
  - 从……年起
  given:
  - 0
  rows:
  - base: '[1147 год]{.ru}'
    cells:
    - '[1147 год]{.ru}'
    - '[в ты́сяча сто со́рок седьмо́м году́]{.ru}'
    - '[с ты́сяча сто со́рок седьмо́го го́да]{.ru}'
  - base: '[1703 год]{.ru}'
    cells:
    - '[1703 год]{.ru}'
    - '[в ты́сяча семьсо́т тре́тьем году́]{.ru}'
    - '[с ты́сяча семьсо́т тре́тьего го́да]{.ru}'
  - base: '[1812 год]{.ru}'
    cells:
    - '[1812 год]{.ru}'
    - '[в ты́сяча восемьсо́т двена́дцатом году́]{.ru}'
    - '[с ты́сяча восемьсо́т двена́дцатого го́да]{.ru}'
  - base: '[1945 год]{.ru}'
    cells:
    - '[1945 год]{.ru}'
    - '[в ты́сяча девятьсо́т со́рок пя́том году́]{.ru}'
    - '[с ты́сяча девятьсо́т со́рок пя́того го́да]{.ru}'
  - base: '[1961 год]{.ru}'
    cells:
    - '[1961 год]{.ru}'
    - '[в ты́сяча девятьсо́т шестьдеся́т пе́рвом году́]{.ru}'
    - '[с ты́сяча девятьсо́т шестьдеся́т пе́рвого го́да]{.ru}'
  - base: '[1990 год]{.ru}'
    cells:
    - '[1990 год]{.ru}'
    - '[в ты́сяча девятьсо́т девяно́стом году́]{.ru}'
    - '[с ты́сяча девятьсо́т девяно́стого го́да]{.ru}'
  - base: '[2002 год]{.ru}'
    cells:
    - '[2002 год]{.ru}'
    - '[в две ты́сячи второ́м году́]{.ru}'
    - '[с две ты́сячи второ́го го́да]{.ru}'
  - base: '[2026 год]{.ru}'
    cells:
    - '[2026 год]{.ru}'
    - '[в две ты́сячи два́дцать шесто́м году́]{.ru}'
    - '[с две ты́сячи два́дцать шесто́го го́да]{.ru}'
  - base: '[1953 год]{.ru}'
    cells:
    - '[1953 год]{.ru}'
    - '[в ты́сяча девятьсо́т пятьдеся́т тре́тьем году́]{.ru}'
    - '[с ты́сяча девятьсо́т пятьдеся́т тре́тьего го́да]{.ru}'
  - base: '[1917 год]{.ru}'
    cells:
    - '[1917 год]{.ru}'
    - '[в ты́сяча девятьсо́т семна́дцатом году́]{.ru}'
    - '[с ты́сяча девятьсо́т семна́дцатого го́да]{.ru}'
  - base: '[2010 год]{.ru}'
    cells:
    - '[2010 год]{.ru}'
    - '[в две ты́сячи деся́том году́]{.ru}'
    - '[с две ты́сячи деся́того го́да]{.ru}'
  why: '第 1–11 题：“在……年”用 [в]{.ru} + 第六格，[год]{.ru} 的第六格是 [году́]{.ru}；“从……年起”用 [с]{.ru} + 第二格（“到……年为止”[до]{.ru} 也一样） [го́да]{.ru}。年份里只有最后一个词（序数词）变格，前面的 [ты́сяча, семьсо́т, со́рок]{.ru} 等保持原形。

    第 1 题：[седьмо́й]{.ru} 重音在词尾：[седьмо́м, седьмо́го]{.ru}。

    第 2、9 题：[тре́тий]{.ru} 带 [-ь-]{.ru}：[в … тре́тьем году́, с … тре́тьего го́да]{.ru}。

    第 3–6、10 题：不要把前面的基数词也变格：*[в ты́сяче девятиста́х…]{.ru}* 是错的。

    第 7、8、11 题：2000 年以后，“两千”说 [две ты́сячи]{.ru}，也不变格：[в две ты́сячи второ́м году́, с две ты́сячи два́дцать шесто́го го́да]{.ru}。'
- id: B2-L56-03
  tags:
  - 日期：Како́е число́? / Како́го числа́?
  task: 用文字回答两个问题：第一问只说日和月，第二问连年份一起说。
  type: matrix
  cols:
  - 日期
  - '[Како́е сего́дня число́?]{.ru}'
  - '[Како́го числа́?]{.ru}'
  given:
  - 0
  rows:
  - base: '[1.09.2025]{.ru}'
    cells:
    - '[1.09.2025]{.ru}'
    - '[пе́рвое сентября́]{.ru}'
    - '[пе́рвого сентября́ две ты́сячи два́дцать пя́того го́да]{.ru}'
  - base: '[12.06.1990]{.ru}'
    cells:
    - '[12.06.1990]{.ru}'
    - '[двена́дцатое ию́ня]{.ru}'
    - '[двена́дцатого ию́ня ты́сяча девятьсо́т девяно́стого го́да]{.ru}'
  - base: '[3.07.2005]{.ru}'
    cells:
    - '[3.07.2005]{.ru}'
    - '[тре́тье ию́ля]{.ru}'
    - '[тре́тьего ию́ля две ты́сячи пя́того го́да]{.ru}'
  - base: '[25.12.2002]{.ru}'
    cells:
    - '[25.12.2002]{.ru}'
    - '[два́дцать пя́тое декабря́]{.ru}'
    - '[два́дцать пя́того декабря́ две ты́сячи второ́го го́да]{.ru}'
  - base: '[8.03.1980]{.ru}'
    cells:
    - '[8.03.1980]{.ru}'
    - '[восьмо́е ма́рта]{.ru}'
    - '[восьмо́го ма́рта ты́сяча девятьсо́т восьмидеся́того го́да]{.ru}'
  - base: '[6.06.1799]{.ru}'
    cells:
    - '[6.06.1799]{.ru}'
    - '[шесто́е ию́ня]{.ru}'
    - '[шесто́го ию́ня ты́сяча семьсо́т девяно́сто девя́того го́да]{.ru}'
  - base: '[31.01.2011]{.ru}'
    cells:
    - '[31.01.2011]{.ru}'
    - '[три́дцать пе́рвое января́]{.ru}'
    - '[три́дцать пе́рвого января́ две ты́сячи оди́ннадцатого го́да]{.ru}'
  - base: '[9.05.1945]{.ru}'
    cells:
    - '[9.05.1945]{.ru}'
    - '[девя́тое ма́я]{.ru}'
    - '[девя́того ма́я ты́сяча девятьсо́т со́рок пя́того го́да]{.ru}'
  - base: '[23.02.2018]{.ru}'
    cells:
    - '[23.02.2018]{.ru}'
    - '[два́дцать тре́тье февраля́]{.ru}'
    - '[два́дцать тре́тьего февраля́ две ты́сячи восемна́дцатого го́да]{.ru}'
  why: '第 1、2、5、6、8 题：回答 [Како́е число́?]{.ru}，日用中性第一格（[число́]{.ru} 是中性）：[пе́рвое, двена́дцатое]{.ru}；回答 [Како́го числа́?]{.ru}，日用第二格：[пе́рвого, двена́дцатого]{.ru}。月份总是第二格：[сентября́, ию́ня, ма́рта]{.ru}。

    第 3 题：[тре́тий]{.ru} 的中性第一格是 [тре́тье]{.ru}，第二格是 [тре́тьего]{.ru}。

    第 4、7、9 题：合成序数词只变最后一个词：[два́дцать пя́тое → два́дцать пя́того]{.ru}，[три́дцать пе́рвое → три́дцать пе́рвого]{.ru}。

    第 1–9 题：跟在具体日期后面的年份用第二格 [… го́да]{.ru}，不用 [в … году́]{.ru}；年份里同样只变最后一个词。'
- id: B2-L56-04
  tags:
  - 序数词：句中各格
  - “第几次”与年代
  task: 把括号里的数字写成序数词的正确形式填空。
  type: fill
  items:
  - stem: Ван Лэй в Петербу́рге в ___ раз.
    hint: '1'
    accept:
    - пе́рвый
  - stem: Ми́ша чита́ет э́ту кни́гу уже́ в ___ раз.
    hint: '4'
    accept:
    - четвёртый
  - stem: Ди́ма сдаёт э́тот экза́мен во ___ раз.
    hint: '2'
    accept:
    - второ́й
  - stem: В ___ го́ды в Москве́ откры́лось мно́го но́вых магази́нов.
    hint: 90-е
    accept:
    - девяно́стые
  - stem: Ба́бушка родила́сь в нача́ле ___ годо́в.
    hint: 50-е
    accept:
    - пятидеся́тых
  - stem: Мы живём на ___ этаже́.
    hint: '5'
    accept:
    - пя́том
  - stem: Све́та у́чится в ___ кла́ссе.
    hint: '11'
    accept:
    - оди́ннадцатом
  - stem: Экза́мен бу́дет в ___ аудито́рии.
    hint: '21'
    accept:
    - два́дцать пе́рвой
  - stem: Мы ждём ___ авто́бус.
    hint: '43'
    accept:
    - со́рок тре́тий
  - stem: Ключ от ___ ко́мнаты у вахтёрши.
    hint: '102'
    accept:
    - сто второ́й
  - stem: Пе́ред ___ экза́меном я всегда́ не́рвничаю.
    hint: '1'
    accept:
    - пе́рвым
  - stem: Мы говори́ли о ___ уро́ке.
    hint: '3'
    accept:
    - тре́тьем
  - stem: Ле́кции ___ ку́рса начина́ются в де́вять.
    hint: '2'
    accept:
    - второ́го
  - stem: Мы ждём ___ трамва́й.
    hint: '17'
    accept:
    - семна́дцатый
  - stem: Магази́н закры́т до ___ ию́ля.
    hint: '3'
    accept:
    - тре́тьего
  - stem: Пра́здник бу́дет ___ ма́я.
    hint: '9'
    accept:
    - девя́того
  - stem: Мы живём на ___ этаже́.
    hint: '22'
    accept:
    - два́дцать второ́м
  - stem: Он звони́т мне уже́ в ___ раз.
    hint: '10'
    accept:
    - деся́тый
  why: '第 1–3、18 题：“第几次”用 [в]{.ru} + 第四格：[в пе́рвый раз, в четвёртый раз, во второ́й раз]{.ru}；[раз]{.ru} 是非动物阳性名词，第四格同第一格。

    第 4、5 题：年代用复数：[в девяно́стые го́ды]{.ru}（第四格同第一格）；[в нача́ле]{.ru} 后用第二格 [пятидеся́тых годо́в]{.ru}。

    第 6、7、11–13 题：序数词和名词的性、数、格一致：[на пя́том этаже́, в оди́ннадцатом кла́ссе, пе́ред пе́рвым экза́меном, о тре́тьем уро́ке, второ́го ку́рса]{.ru}。

    第 8、10、17 题：合成序数词只变最后一个词：[в два́дцать пе́рвой аудито́рии, от сто второ́й ко́мнаты, на два́дцать второ́м этаже́]{.ru}，前面的 [два́дцать, сто]{.ru} 不变。

    第 9、14 题：[авто́бус, трамва́й]{.ru} 是非动物名词，第四格同第一格：[со́рок тре́тий авто́бус, семна́дцатый трамва́й]{.ru}。

    第 15、16 题：“在某日”“到某日”日用第二格：[девя́того ма́я, до тре́тьего ию́ля]{.ru}。'
