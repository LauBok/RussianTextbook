heading: 第 29 课　将来时中体的用法
groups:
- id: B2-L29-01
  tags:
  - 将来时：两种形式
  task: 写出体对的将来时。
  type: matrix
  cols:
  - 体对
  - '[я]{.ru} 未完成体'
  - '[я]{.ru} 完成体'
  - '[они́]{.ru} 未完成体'
  - '[они́]{.ru} 完成体'
  given:
  - 0
  rows:
  - base: '[писа́ть / написа́ть]{.ru}'
    cells:
    - '[писа́ть / написа́ть]{.ru}'
    - '[бу́ду писа́ть]{.ru}'
    - '[напишу́]{.ru}'
    - '[бу́дут писа́ть]{.ru}'
    - '[напи́шут]{.ru}'
  - base: '[чита́ть / прочита́ть]{.ru}'
    cells:
    - '[чита́ть / прочита́ть]{.ru}'
    - '[бу́ду чита́ть]{.ru}'
    - '[прочита́ю]{.ru}'
    - '[бу́дут чита́ть]{.ru}'
    - '[прочита́ют]{.ru}'
  - base: '[де́лать / сде́лать]{.ru}'
    cells:
    - '[де́лать / сде́лать]{.ru}'
    - '[бу́ду де́лать]{.ru}'
    - '[сде́лаю]{.ru}'
    - '[бу́дут де́лать]{.ru}'
    - '[сде́лают]{.ru}'
  - base: '[гото́виться / подгото́виться]{.ru}'
    cells:
    - '[гото́виться / подгото́виться]{.ru}'
    - '[бу́ду гото́виться]{.ru}'
    - '[подгото́влюсь]{.ru}'
    - '[бу́дут гото́виться]{.ru}'
    - '[подгото́вятся]{.ru}'
  - base: '[учи́ть / вы́учить]{.ru}'
    cells:
    - '[учи́ть / вы́учить]{.ru}'
    - '[бу́ду учи́ть]{.ru}'
    - '[вы́учу]{.ru}'
    - '[бу́дут учи́ть]{.ru}'
    - '[вы́учат]{.ru}'
  - base: '[отдыха́ть / отдохну́ть]{.ru}'
    cells:
    - '[отдыха́ть / отдохну́ть]{.ru}'
    - '[бу́ду отдыха́ть]{.ru}'
    - '[отдохну́]{.ru}'
    - '[бу́дут отдыха́ть]{.ru}'
    - '[отдохну́т]{.ru}'
  - base: '[покупа́ть / купи́ть]{.ru}'
    cells:
    - '[покупа́ть / купи́ть]{.ru}'
    - '[бу́ду покупа́ть]{.ru}'
    - '[куплю́]{.ru}'
    - '[бу́дут покупа́ть]{.ru}'
    - '[ку́пят]{.ru}'
  - base: '[звони́ть / позвони́ть]{.ru}'
    cells:
    - '[звони́ть / позвони́ть]{.ru}'
    - '[бу́ду звони́ть]{.ru}'
    - '[позвоню́]{.ru}'
    - '[бу́дут звони́ть]{.ru}'
    - '[позвоня́т]{.ru}'
  - base: '[реша́ть / реши́ть]{.ru}'
    cells:
    - '[реша́ть / реши́ть]{.ru}'
    - '[бу́ду реша́ть]{.ru}'
    - '[решу́]{.ru}'
    - '[бу́дут реша́ть]{.ru}'
    - '[реша́т]{.ru}'
  - base: '[повторя́ть / повтори́ть]{.ru}'
    cells:
    - '[повторя́ть / повтори́ть]{.ru}'
    - '[бу́ду повторя́ть]{.ru}'
    - '[повторю́]{.ru}'
    - '[бу́дут повторя́ть]{.ru}'
    - '[повторя́т]{.ru}'
  why: |-
    第 1–10 题：未完成体将来时 = [бу́ду, бу́дешь … бу́дут]{.ru} + 未完成体不定式：[бу́ду писа́ть, бу́дут гото́виться]{.ru}。
    第 1–10 题：完成体将来时就是完成体动词变位，形式像现在时，不加 [бу́ду]{.ru}：[напишу́, прочита́ю, вы́учу]{.ru}。不能说 [бу́ду написа́ть]{.ru}。
    第 1 题：[писа́ть]{.ru} 类所有人称都有 [с → ш]{.ru}：[напишу́, напи́шут]{.ru}。
    第 4、7 题：第二变位唇音词干 [я]{.ru} 加 [л]{.ru}：[подгото́влюсь, куплю́]{.ru}，[они́]{.ru} 不加：[подгото́вятся, ку́пят]{.ru}。
    第 5 题：[вы́-]{.ru} 开头的完成体重音总在 [вы́-]{.ru}：[вы́учу, вы́учат]{.ru}。
- id: B2-L29-02
  tags:
  - 将来时中体的意义
  task: 句中将来时表示什么？归栏。
  type: classify
  bins:
  - 过程
  - 反复
  - 活动本身
  - 结果
  - 先后
  - 做不到
  items:
  - text: '[Все выходны́е я бу́ду повторя́ть исто́рию.]{.ru}'
    answer: 过程
  - text: '[Весь ве́чер мы бу́дем гото́виться к экза́мену.]{.ru}'
    answer: 过程
  - text: '[За́втра я це́лый день бу́ду писа́ть докла́д.]{.ru}'
    answer: 过程
  - text: '[В Каза́ни я бу́ду ка́ждый день звони́ть роди́телям.]{.ru}'
    answer: 反复
  - text: '[Ле́том я бу́ду ча́сто пла́вать в мо́ре.]{.ru}'
    answer: 反复
  - text: '[Я бу́ду писа́ть тебе́ ка́ждую неде́лю.]{.ru}'
    answer: 反复
  - text: '[Что ты бу́дешь де́лать в суббо́ту?]{.ru}'
    answer: 活动本身
  - text: '[Я бу́ду спра́шивать, а ты бу́дешь отвеча́ть.]{.ru}'
    answer: 活动本身
  - text: '[Сего́дня на уро́ке мы бу́дем чита́ть Пу́шкина.]{.ru}'
    answer: 活动本身
  - text: '[Не волну́йся, ты всё сдашь.]{.ru}'
    answer: 结果
  - text: '[Ма́ма пригото́вит большо́й у́жин.]{.ru}'
    answer: 结果
  - text: '[Я обяза́тельно вы́учу э́ти слова́.]{.ru}'
    answer: 结果
  - text: '[Когда́ сдам экза́мен, сра́зу пое́ду домо́й.]{.ru}'
    answer: 先后
  - text: '[Я вы́сплюсь, а пото́м пойду́ гуля́ть.]{.ru}'
    answer: 先后
  - text: '[Ди́ма пообе́дает и позвони́т тебе́.]{.ru}'
    answer: 先后
  - text: '[Я не вы́учу все биле́ты до пя́тницы.]{.ru}'
    answer: 做不到
  - text: '[Он не реши́т э́ту зада́чу: она́ сли́шком тру́дная.]{.ru}'
    answer: 做不到
  - text: '[Без словаря́ я не прочита́ю э́тот текст.]{.ru}'
    answer: 做不到
  why: |-
    第 1–3 题：未完成体将来时表示过程、持续：[все выходны́е, весь ве́чер, це́лый день]{.ru}。
    第 4–6 题：未完成体表示反复：[ка́ждый день, ча́сто, ка́ждую неде́лю]{.ru}。
    第 7–9 题：未完成体表示活动本身，问打算、分工，不说做完：[Что ты бу́дешь де́лать?]{.ru}
    第 10–12 题：完成体表示一次、有结果：[сдашь, пригото́вит, вы́учу]{.ru}。
    第 13–15 题：几个动作一个接一个，都用完成体：[сдам — пое́ду, вы́сплюсь — пойду́, пообе́дает — позвони́т]{.ru}。
    第 16–18 题：完成体将来时的否定表示“做不到、来不及”：[не вы́учу, не реши́т, не прочита́ю]{.ru}。
- id: B2-L29-03
  tags:
  - когда, если 后的将来时
  task: 用括号里的动词填空（只写从句的动词）。
  type: fill
  items:
  - stem: Когда́ ты ___ на все вопро́сы, пойдём в кафе́.
    hint: '[отвеча́ть / отве́тить]{.ru} 回答完'
    accept:
    - отве́тишь
  - stem: Е́сли он ___ все экза́мены, он бу́дет получа́ть стипе́ндию.
    hint: '[сдава́ть / сдать]{.ru} 考过'
    accept:
    - сдаст
  - stem: Когда́ я ___ в Каза́ни, я бу́ду мно́го гуля́ть.
    hint: '[быть]{.ru} 在'
    accept:
    - бу́ду
  - stem: Когда́ мы ___ к экза́мену, мы пойдём в кино́.
    hint: '[гото́виться / подгото́виться]{.ru} 准备好'
    accept:
    - подгото́вимся
  - stem: Е́сли ты ___ ра́но, позвони́ мне.
    hint: '[встава́ть / встать]{.ru} 起床（这一次）'
    accept:
    - вста́нешь
  - stem: Когда́ ты ___ э́ту кни́гу, дай её мне.
    hint: '[чита́ть / прочита́ть]{.ru} 读完'
    accept:
    - прочита́ешь
  - stem: Когда́ ма́ма ___ у́жин, мы ся́дем за стол.
    hint: '[гото́вить / пригото́вить]{.ru} 做好'
    accept:
    - пригото́вит
  - stem: Когда́ я ___ в библиоте́ке, я бу́ду чита́ть журна́лы.
    hint: '[занима́ться]{.ru} 学习（同时）'
    accept:
    - бу́ду занима́ться
  - stem: Когда́ ты ___ письмо́, покажи́ его́ мне.
    hint: '[писа́ть / написа́ть]{.ru} 写好'
    accept:
    - напи́шешь
  - stem: Е́сли ты ___ ка́ждый день, ты бы́стро вы́учишь язы́к.
    hint: '[занима́ться]{.ru} 学习（经常）'
    accept:
    - бу́дешь занима́ться
  - stem: Е́сли за́втра ___ хоро́шая пого́да, мы пое́дем на да́чу.
    hint: '[быть]{.ru}'
    accept:
    - бу́дет
  - stem: Когда́ ты ___ все слова́, я тебя́ прове́рю.
    hint: '[учи́ть / вы́учить]{.ru} 背会'
    accept:
    - вы́учишь
  why: |-
    第 1–12 题：说将来的事，[когда́, е́сли]{.ru} 引出的部分也用将来时，不能用现在时：不说 [Когда́ ты отвеча́ешь…]{.ru}。
    第 1、2、4–7、9、12 题：从句的动作先完成、主句的动作后发生，用完成体：[отве́тишь, сдаст, подгото́вимся, вста́нешь, прочита́ешь, пригото́вит, напи́шешь, вы́учишь]{.ru}。
    第 8、10 题：两件事同时进行或反复，用未完成体将来时：[бу́ду занима́ться, бу́дешь занима́ться]{.ru}。
    第 3、11 题：[быть]{.ru} 的将来时：[бу́ду, бу́дет]{.ru}。
