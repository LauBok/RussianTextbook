heading: 第 30 课　命令式与体
groups:
- id: B2-L30-01
  tags:
  - 命令式：构成
  task: 写出体对的命令式。
  type: matrix
  cols:
  - 体对
  - 未完成体 [ты]{.ru}
  - 完成体 [ты]{.ru}
  - 未完成体 [вы]{.ru}
  - 完成体 [вы]{.ru}
  given:
  - 0
  rows:
  - base: '[чита́ть / прочита́ть]{.ru}'
    cells:
    - '[чита́ть / прочита́ть]{.ru}'
    - '[чита́й]{.ru}'
    - '[прочита́й]{.ru}'
    - '[чита́йте]{.ru}'
    - '[прочита́йте]{.ru}'
  - base: '[писа́ть / написа́ть]{.ru}'
    cells:
    - '[писа́ть / написа́ть]{.ru}'
    - '[пиши́]{.ru}'
    - '[напиши́]{.ru}'
    - '[пиши́те]{.ru}'
    - '[напиши́те]{.ru}'
  - base: '[звони́ть / позвони́ть]{.ru}'
    cells:
    - '[звони́ть / позвони́ть]{.ru}'
    - '[звони́]{.ru}'
    - '[позвони́]{.ru}'
    - '[звони́те]{.ru}'
    - '[позвони́те]{.ru}'
  - base: '[брать / взять]{.ru}'
    cells:
    - '[брать / взять]{.ru}'
    - '[бери́]{.ru}'
    - '[возьми́]{.ru}'
    - '[бери́те]{.ru}'
    - '[возьми́те]{.ru}'
    hint: '[они́ беру́т / возьму́т]{.ru}'
  - base: '[забыва́ть / забы́ть]{.ru}'
    cells:
    - '[забыва́ть / забы́ть]{.ru}'
    - '[забыва́й]{.ru}'
    - '[забу́дь]{.ru}'
    - '[забыва́йте]{.ru}'
    - '[забу́дьте]{.ru}'
    hint: '[они́ забу́дут]{.ru}'
  - base: '[сади́ться / сесть]{.ru}'
    cells:
    - '[сади́ться / сесть]{.ru}'
    - '[сади́сь]{.ru}'
    - '[сядь]{.ru}'
    - '[сади́тесь]{.ru}'
    - '[ся́дьте]{.ru}'
    hint: '[они́ ся́дут]{.ru}'
  - base: '[гото́вить / пригото́вить]{.ru}'
    cells:
    - '[гото́вить / пригото́вить]{.ru}'
    - '[гото́вь]{.ru}'
    - '[пригото́вь]{.ru}'
    - '[гото́вьте]{.ru}'
    - '[пригото́вьте]{.ru}'
  - base: '[покупа́ть / купи́ть]{.ru}'
    cells:
    - '[покупа́ть / купи́ть]{.ru}'
    - '[покупа́й]{.ru}'
    - '[купи́]{.ru}'
    - '[покупа́йте]{.ru}'
    - '[купи́те]{.ru}'
  - base: '[отвеча́ть / отве́тить]{.ru}'
    cells:
    - '[отвеча́ть / отве́тить]{.ru}'
    - '[отвеча́й]{.ru}'
    - '[отве́ть]{.ru}'
    - '[отвеча́йте]{.ru}'
    - '[отве́тьте]{.ru}'
  - base: '[помога́ть / помо́чь]{.ru}'
    cells:
    - '[помога́ть / помо́чь]{.ru}'
    - '[помога́й]{.ru}'
    - '[помоги́]{.ru}'
    - '[помога́йте]{.ru}'
    - '[помоги́те]{.ru}'
    hint: '[они́ помо́гут]{.ru}'
  - base: '[буди́ть / разбуди́ть]{.ru}'
    cells:
    - '[буди́ть / разбуди́ть]{.ru}'
    - '[буди́]{.ru}'
    - '[разбуди́]{.ru}'
    - '[буди́те]{.ru}'
    - '[разбуди́те]{.ru}'
  - base: '[торопи́ться / поторопи́ться]{.ru}'
    cells:
    - '[торопи́ться / поторопи́ться]{.ru}'
    - '[торопи́сь]{.ru}'
    - '[поторопи́сь]{.ru}'
    - '[торопи́тесь]{.ru}'
    - '[поторопи́тесь]{.ru}'
  why: |-
    第 1、8–10 题：词干以元音结尾（[чита́ют, покупа́ют, отвеча́ют, помога́ют]{.ru}）加 [-й]{.ru}：[чита́й, покупа́й]{.ru}；第 5 题 [забыва́ют → забыва́й]{.ru} 同。
    第 2–4、8、10–12 题：辅音词干，[я]{.ru} 的重音在词尾，加 [-и́]{.ru}：[пиши́, звони́, возьми́, купи́, помоги́, разбуди́]{.ru}；[-ся]{.ru} 在 [-и]{.ru} 后写 [-сь]{.ru}：[торопи́сь]{.ru}。第 10 题 [помо́гут → помоги́]{.ru}，词干末 [г]{.ru}。
    第 5–7、9 题：辅音词干，重音在词干，加 [-ь]{.ru}：[забу́дь, сядь, гото́вь, пригото́вь, отве́ть]{.ru}。第 6 题 [сади́сь]{.ru} 按 [-и́]{.ru} 规则，[сядь]{.ru} 按 [-ь]{.ru} 规则。
    第 1–12 题：对 [вы]{.ru} 说加 [-те]{.ru}：[ся́дьте, сади́тесь]{.ru}（[-сь]{.ru} 在 [-те]{.ru} 后变为 [-тесь]{.ru}）。
- id: B2-L30-02
  tags:
  - 命令式中体的意义
  task: 命令句表示什么？归栏。
  type: classify
  bins:
  - 一次具体的要求
  - 经常、反复
  - 催促、邀请
  - 一般的劝阻
  - 提醒当心
  items:
  - text: '[Возьми́ па́спорт и биле́т.]{.ru}'
    answer: 一次具体的要求
  - text: '[Позвони́ из по́езда.]{.ru}'
    answer: 一次具体的要求
  - text: '[Закро́й, пожа́луйста, окно́.]{.ru}'
    answer: 一次具体的要求
  - text: '[Купи́ хлеб по доро́ге домо́й.]{.ru}'
    answer: 一次具体的要求
  - text: '[Звони́ мне ка́ждый ве́чер.]{.ru}'
    answer: 经常、反复
  - text: '[Помога́й ма́ме.]{.ru}'
    answer: 经常、反复
  - text: '[Повторя́й слова́ ка́ждый день.]{.ru}'
    answer: 经常、反复
  - text: '[Сади́сь за уро́ки!]{.ru}'
    answer: 催促、邀请
  - text: '[Чита́й, чита́й, я слу́шаю.]{.ru}'
    answer: 催促、邀请
  - text: '[Сади́тесь, пожа́луйста.]{.ru}'
    answer: 催促、邀请
  - text: '[Бери́те пирожки́!]{.ru}'
    answer: 催促、邀请
  - text: '[Не торопи́сь!]{.ru}'
    answer: 一般的劝阻
  - text: '[Не сиди́ над уче́бниками всю ночь.]{.ru}'
    answer: 一般的劝阻
  - text: '[Не буди́ Ми́шу, он ещё спит.]{.ru}'
    answer: 一般的劝阻
  - text: '[Не забу́дь телефо́н!]{.ru}'
    answer: 提醒当心
  - text: '[Не опозда́й!]{.ru}'
    answer: 提醒当心
  - text: '[Осторо́жно, не урони́ ча́шку!]{.ru}'
    answer: 提醒当心
  - text: '[Говори́ ти́ше, не разбуди́ Ми́шу.]{.ru}'
    answer: 提醒当心
  why: |-
    第 1–4 题：肯定的完成体命令式：一件具体的事，要做成：[Возьми́, Позвони́, Закро́й, Купи́]{.ru}。
    第 5–7 题：未完成体：经常、反复地做：[ка́ждый ве́чер, ка́ждый день]{.ru}，[Помога́й ма́ме]{.ru} 是一般的做法。
    第 8–11 题：未完成体：催对方开始或继续一件双方都知道的事（[Сади́сь за уро́ки! Чита́й, чита́й]{.ru}），或客气地邀请（[Сади́тесь. Бери́те пирожки́!]{.ru}）。
    第 12–14 题：[не]{.ru} + 未完成体：一般地劝对方别做：[Не торопи́сь! Не буди́ Ми́шу]{.ru}（别去叫醒他）。
    第 15–18 题：[не]{.ru} + 完成体：提醒当心，别不小心造成某种结果：[Не забу́дь! Не опозда́й! Не урони́! Не разбуди́]{.ru}（别把他吵醒）。
- id: B2-L30-03
  tags:
  - 否定命令式：劝阻与提醒
  task: 写出两种否定命令式。
  type: matrix
  cols:
  - 完成体命令式
  - 一般的劝阻
  - 提醒当心
  given:
  - 0
  rows:
  - base: '[разбуди́]{.ru}'
    cells:
    - '[разбуди́]{.ru}'
    - '[не буди́]{.ru}'
    - '[не разбуди́]{.ru}'
  - base: '[забу́дь]{.ru}'
    cells:
    - '[забу́дь]{.ru}'
    - '[не забыва́й]{.ru}'
    - '[не забу́дь]{.ru}'
  - base: '[урони́]{.ru}'
    cells:
    - '[урони́]{.ru}'
    - '[не роня́й]{.ru}'
    - '[не урони́]{.ru}'
    hint: '[роня́ть]{.ru} 未完成体'
  - base: '[опозда́й]{.ru}'
    cells:
    - '[опозда́й]{.ru}'
    - '[не опа́здывай]{.ru}'
    - '[не опозда́й]{.ru}'
    hint: '[опа́здывать]{.ru} 未完成体'
  - base: '[потеря́й]{.ru}'
    cells:
    - '[потеря́й]{.ru}'
    - '[не теря́й]{.ru}'
    - '[не потеря́й]{.ru}'
    hint: '[теря́ть]{.ru} 未完成体'
    new: true
    gloss: 丢失
  - base: '[слома́й]{.ru}'
    cells:
    - '[слома́й]{.ru}'
    - '[не лома́й]{.ru}'
    - '[не слома́й]{.ru}'
    hint: '[лома́ть]{.ru} 未完成体'
    new: true
    gloss: 弄坏
  - base: '[простуди́сь]{.ru}'
    cells:
    - '[простуди́сь]{.ru}'
    - '[не простужа́йся]{.ru}'
    - '[не простуди́сь]{.ru}'
    hint: '[простужа́ться]{.ru} 未完成体'
  - base: '[проле́й]{.ru}'
    cells:
    - '[проле́й]{.ru}'
    - '[не пролива́й]{.ru}'
    - '[не проле́й]{.ru}'
    hint: '[пролива́ть]{.ru} 未完成体'
    new: true
    gloss: 洒出
  why: |-
    第 1–8 题：一般的劝阻“别去做”用 [не]{.ru} + 未完成体：[не буди́, не забыва́й, не роня́й, не опа́здывай, не простужа́йся]{.ru}；提醒“当心别弄得……”用 [не]{.ru} + 完成体，形式就是在肯定命令式前加 [не]{.ru}：[не разбуди́, не забу́дь, не урони́, не опозда́й]{.ru}。
    第 2 题：[Не забыва́й звони́ть]{.ru} 说经常的事；[Не забу́дь позвони́ть]{.ru} 说这一次。
    第 3–8 题：这些动词说的都是人不愿意出现的结果（摔、迟到、丢、坏、着凉、洒），所以 [не]{.ru} + 完成体很常用，前面常加 [Смотри́, Осторо́жно]{.ru}。
