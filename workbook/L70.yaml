heading: 第 70 课　第七单元复习
groups:
- id: L70-01
  tags:
  - 单数第五格：词组共同变化
  - 单数第六格：与第五格对照
  task: 把词组分别变成第五格和第六格。
  type: matrix
  cols:
  - 词组
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[наш но́вый врач]{.ru}'
    cells:
    - '[наш но́вый врач]{.ru}'
    - '[на́шим но́вым врачо́м]{.ru}'
    - '[на́шем но́вом враче́]{.ru}'
  - base: '[моя́ ста́ршая сестра́]{.ru}'
    cells:
    - '[моя́ ста́ршая сестра́]{.ru}'
    - '[мое́й ста́ршей сестро́й]{.ru}'
    - '[мое́й ста́ршей сестре́]{.ru}'
  - base: '[э́тот молодо́й инжене́р]{.ru}'
    cells:
    - '[э́тот молодо́й инжене́р]{.ru}'
    - '[э́тим молоды́м инжене́ром]{.ru}'
    - '[э́том молодо́м инжене́ре]{.ru}'
  - base: '[твоя́ ру́сская подру́га]{.ru}'
    cells:
    - '[твоя́ ру́сская подру́га]{.ru}'
    - '[твое́й ру́сской подру́гой]{.ru}'
    - '[твое́й ру́сской подру́ге]{.ru}'
  - base: '[ваш стро́гий профе́ссор]{.ru}'
    cells:
    - '[ваш стро́гий профе́ссор]{.ru}'
    - '[ва́шим стро́гим профе́ссором]{.ru}'
    - '[ва́шем стро́гом профе́ссоре]{.ru}'
  - base: '[э́та ма́ленькая пло́щадь]{.ru}'
    cells:
    - '[э́та ма́ленькая пло́щадь]{.ru}'
    - '[э́той ма́ленькой пло́щадью]{.ru}'
    - '[э́той ма́ленькой пло́щади]{.ru}'
  - base: '[их си́нее мо́ре]{.ru}'
    cells:
    - '[их си́нее мо́ре]{.ru}'
    - '[их си́ним мо́рем]{.ru}'
    - '[их си́нем мо́ре]{.ru}'
  - base: '[мой хоро́ший друг]{.ru}'
    cells:
    - '[мой хоро́ший друг]{.ru}'
    - '[мои́м хоро́шим дру́гом]{.ru}'
    - '[моём хоро́шем дру́ге]{.ru}'
  - base: '[на́ша после́дняя ле́кция]{.ru}'
    cells:
    - '[на́ша после́дняя ле́кция]{.ru}'
    - '[на́шей после́дней ле́кцией]{.ru}'
    - '[на́шей после́дней ле́кции]{.ru}'
  - base: '[его́ большо́й дом]{.ru}'
    cells:
    - '[его́ большо́й дом]{.ru}'
    - '[его́ больши́м до́мом]{.ru}'
    - '[его́ большо́м до́ме]{.ru}'
  - base: '[э́то но́вое зда́ние]{.ru}'
    cells:
    - '[э́то но́вое зда́ние]{.ru}'
    - '[э́тим но́вым зда́нием]{.ru}'
    - '[э́том но́вом зда́нии]{.ru}'
  - base: '[твой ста́рый слова́рь]{.ru}'
    cells:
    - '[твой ста́рый слова́рь]{.ru}'
    - '[твои́м ста́рым словарём]{.ru}'
    - '[твоём ста́ром словаре́]{.ru}'
  why: |
    第 1–12 题：第五格阳性、中性修饰语 [-ым / -им]{.ru}，名词 [-ом / -ем]{.ru}；第六格阳性、中性修饰语 [-ом / -ем]{.ru}，名词 [-е]{.ru}。阴性第五格 [-ой / -ей]{.ru} + [-ой / -ей]{.ru}，第六格 [-ой / -ей]{.ru} + [-е]{.ru}。物主代词第五格 [мои́м, на́шим]{.ru}，第六格 [моём, на́шем]{.ru}，不要混。
    第 2、4、9 题：阴性修饰语两个格同形（[мое́й ста́ршей, твое́й ру́сской]{.ru}），只有名词不同：[сестро́й — сестре́]{.ru}；第 9 题 [ле́кцией — ле́кции]{.ru}。
    第 6 题：阴性 [-ь]{.ru} 名词：第五格 [пло́щадью]{.ru}，第六格 [пло́щади]{.ru}。
    第 7 题：[си́ний]{.ru} 软变化：[си́ним — си́нем]{.ru}；[их]{.ru} 不变。
    第 10 题：[большо́й]{.ru}：第五格 [больши́м]{.ru}，第六格 [большо́м]{.ru}；[его́]{.ru} 不变。
    第 11 题：[-ие]{.ru} 名词第六格 [-ии]{.ru}：[зда́нии]{.ru}；第五格 [зда́нием]{.ru}。
    第 12 题：[слова́рь]{.ru} 词尾重读：[словарём, словаре́]{.ru}。
- id: L70-02
  tags:
  - 前置词支配：第二至第六格
  task: 前置词后面是第几格？把词组归类。
  type: classify
  bins:
  - 第二格（[без са́хара]{.ru}）
  - 第三格（[к врачу́]{.ru}）
  - 第四格（[в шко́лу]{.ru}）
  - 第五格（[с бра́том]{.ru}）
  - 第六格（[в шко́ле]{.ru}）
  items:
  - text: '[с утра́]{.ru}'
    answer: 第二格（[без са́хара]{.ru}）
  - text: '[с бра́том]{.ru}'
    answer: 第五格（[с бра́том]{.ru}）
  - text: '[на авто́бусе]{.ru}'
    answer: 第六格（[в шко́ле]{.ru}）
  - text: '[под столо́м]{.ru}'
    answer: 第五格（[с бра́том]{.ru}）
  - text: '[под стол]{.ru}'
    answer: 第四格（[в шко́лу]{.ru}）
  - text: '[к врачу́]{.ru}'
    answer: 第三格（[к врачу́]{.ru}）
  - text: '[у врача́]{.ru}'
    answer: 第二格（[без са́хара]{.ru}）
  - text: '[без молока́]{.ru}'
    answer: 第二格（[без са́хара]{.ru}）
  - text: '[о кни́ге]{.ru}'
    answer: 第六格（[в шко́ле]{.ru}）
  - text: '[в теа́тр]{.ru}'
    answer: 第四格（[в шко́лу]{.ru}）
  - text: '[в теа́тре]{.ru}'
    answer: 第六格（[в шко́ле]{.ru}）
  - text: '[до ве́чера]{.ru}'
    answer: 第二格（[без са́хара]{.ru}）
  - text: '[пе́ред уро́ком]{.ru}'
    answer: 第五格（[с бра́том]{.ru}）
  - text: '[по у́лице]{.ru}'
    answer: 第三格（[к врачу́]{.ru}）
  - text: '[ме́жду до́мом и па́рком]{.ru}'
    answer: 第五格（[с бра́том]{.ru}）
  - text: '[на рабо́ту]{.ru}'
    answer: 第四格（[в шко́лу]{.ru}）
  - text: '[за окно́м]{.ru}'
    answer: 第五格（[с бра́том]{.ru}）
  - text: '[из Кита́я]{.ru}'
    answer: 第二格（[без са́хара]{.ru}）
  - text: '[в суббо́ту]{.ru}'
    answer: 第四格（[в шко́лу]{.ru}）
  - text: '[на метро́]{.ru}'
    answer: 第六格（[в шко́ле]{.ru}）
  why: |
    第 1、7、8、12、18 题：[с]{.ru}（从……起）、[у, без, до, из]{.ru} 接第二格。
    第 6、14 题：[к, по]{.ru} 接第三格：[к врачу́, по у́лице]{.ru}。
    第 5、10、16、19 题：[в, на, за, под]{.ru} 表示方向，以及 [в]{.ru} + 星期，接第四格：[под стол, в теа́тр, на рабо́ту, в суббо́ту]{.ru}。
    第 2、4、13、15、17 题：[с]{.ru}（和……一起）、[под, пе́ред, ме́жду, за]{.ru} 表示位置，接第五格。
    第 3、9、11、20 题：[в, на]{.ru} 表示位置或交通工具、[о]{.ru} 表示谈论对象，接第六格；第 20 题 [метро́]{.ru} 不变格，但 [на]{.ru} 表示交通工具时要求第六格。
- id: L70-03
  tags:
  - 交通工具：на + 第六格
  - 去向与处所：в + 第四格 / 第六格
  task: 同一种交通工具，写出三种不同意思的词组。
  type: matrix
  cols:
  - 名词
  - 在车里（[где?]{.ru}）
  - 上车（[куда́?]{.ru}）
  - 坐车（[на чём?]{.ru}）
  given:
  - 0
  rows:
  - base: '[авто́бус]{.ru}'
    cells:
    - '[авто́бус]{.ru}'
    - '[в авто́бусе]{.ru}'
    - '[в авто́бус]{.ru}'
    - '[на авто́бусе]{.ru}'
  - base: '[трамва́й]{.ru}'
    cells:
    - '[трамва́й]{.ru}'
    - '[в трамва́е]{.ru}'
    - '[в трамва́й]{.ru}'
    - '[на трамва́е]{.ru}'
  - base: '[маши́на]{.ru}'
    cells:
    - '[маши́на]{.ru}'
    - '[в маши́не]{.ru}'
    - '[в маши́ну]{.ru}'
    - '[на маши́не]{.ru}'
  - base: '[по́езд]{.ru}'
    cells:
    - '[по́езд]{.ru}'
    - '[в по́езде]{.ru}'
    - '[в по́езд]{.ru}'
    - '[на по́езде]{.ru}'
  - base: '[электри́чка]{.ru}'
    cells:
    - '[электри́чка]{.ru}'
    - '[в электри́чке]{.ru}'
    - '[в электри́чку]{.ru}'
    - '[на электри́чке]{.ru}'
  - base: '[такси́]{.ru}'
    cells:
    - '[такси́]{.ru}'
    - '[в такси́]{.ru}'
    - '[в такси́]{.ru}'
    - '[на такси́]{.ru}'
  - base: '[метро́]{.ru}'
    cells:
    - '[метро́]{.ru}'
    - '[в метро́]{.ru}'
    - '[в метро́]{.ru}'
    - '[на метро́]{.ru}'
  why: |
    第 1–7 题：“在车里”是处所，用 [в]{.ru} + 第六格：[в авто́бусе]{.ru}；“上车、进车里”是方向，用 [в]{.ru} + 第四格：[в авто́бус, в маши́ну]{.ru}；“坐车去”表示方式，用 [на]{.ru} + 第六格：[на авто́бусе]{.ru}。
    第 3、5 题：阴性第四格改 [-у]{.ru}：[в маши́ну, в электри́чку]{.ru}。
    第 6、7 题：[такси́, метро́]{.ru} 不变格，三个词组只靠前置词区分。“我坐地铁去”要说 [на метро́]{.ru}，[в метро́]{.ru} 是“在地铁里”。
- id: L70-04
  tags:
  - с + 第二格与 с + 第五格对照
  - 交通工具：на + 第六格
  - 季节与时段：第五格作副词
  task: 判断句子是否正确；有错的说出错在哪里。
  type: classify
  bins:
  - '[да]{.ru}（正确）'
  - '[нет]{.ru}（有错）'
  items:
  - text: '[Я рабо́таю с восьми́ до пяти́.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я рабо́таю с во́семь до пять.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ты пьёшь чай с са́харом?]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Мы рабо́таем с у́тром до ве́чера.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Па́па е́дет на рабо́ту на авто́бусе.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я е́ду в университе́т в метро́.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ми́ша хо́дит в шко́лу пешко́м.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Ми́ша е́дет в шко́лу на пешко́м.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[В зиме́ в Москве́ хо́лодно.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ле́том ча́сто идёт дождь.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Ле́том ча́сто хо́дит дождь.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Обе́д у нас с ча́са до двух.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я говорю́ с ма́мы.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Учёба продолжа́ется с сентября́ до ма́я.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Трамва́й идёт ме́дленно.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[В ма́е в Москве́ тепло́.]{.ru}'
    answer: '[да]{.ru}（正确）'
  why: |
    第 1、12、14 题：[с … до …]{.ru} 后用第二格：[с восьми́ до пяти́, с ча́са до двух, с сентября́]{.ru}，正确。
    第 2 题：数词要变第二格：[с восьми́ до пяти́]{.ru}。
    第 3 题：“加糖”用 [с]{.ru} + 第五格，正确。第 13 题：“和妈妈说话”用第五格：[с ма́мой]{.ru}。
    第 4 题：“从早上起”用第二格：[с утра́]{.ru}；[с у́тром]{.ru} 是第五格，意思不对。
    第 5 题：坐车用 [на]{.ru} + 第六格，正确。第 6 题：表示乘坐方式要说 [на метро́]{.ru}。
    第 7 题：步行用 [пешко́м]{.ru}，不加前置词，动词用 [ходи́ть]{.ru}，正确。第 8 题：应改成 [Ми́ша идёт в шко́лу пешко́м]{.ru}。
    第 9 题：季节用第五格作副词：[Зимо́й в Москве́ хо́лодно.]{.ru}
    第 10、11 题：下雨只用 [идти́]{.ru}，即使是“常常”也不用 [ходи́ть]{.ru}。
    第 15 题：车辆行驶用 [идти́]{.ru}，正确。第 16 题：月份用 [в]{.ru} + 第六格，正确。
- id: L70-05
  tags:
  - 前置词支配：第二至第六格
  - с + 第二格与 с + 第五格对照
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Мы е́дем в центр на ___.
    hint: трамва́й
    accept:
    - трамва́е
  - stem: Я рабо́таю с ___ до пяти́.
    hint: де́вять
    accept:
    - девяти́
  - stem: Ты пьёшь чай с ___?
    hint: лимо́н
    accept:
    - лимо́ном
  - stem: Магази́н рабо́тает с утра́ до ___.
    hint: ве́чер
    accept:
    - ве́чера
  - stem: Ко́шка спит под ___.
    hint: крова́ть
    accept:
    - крова́тью
  - stem: Ми́ша ста́вит су́мку под ___.
    hint: крова́ть
    accept:
    - крова́ть
  - stem: Па́па е́здит на рабо́ту на ___.
    hint: маши́на
    accept:
    - маши́не
  - stem: Мы с ___ идём в кино́.
    hint: Ка́тя
    accept:
    - Ка́тей
  - stem: Я пью ко́фе без ___.
    hint: са́хар
    accept:
    - са́хара
  - stem: Вчера́ мы бы́ли у ___.
    hint: ба́бушка
    accept:
    - ба́бушки
  - stem: За́втра мы е́дем к ___.
    hint: ба́бушка
    accept:
    - ба́бушке
  - stem: Учёба продолжа́ется с ___ до ма́я.
    hint: сентя́брь
    accept:
    - сентября́
  - stem: Пе́ред ___ мы гуля́ем в па́рке.
    hint: у́жин
    accept:
    - у́жином
  - stem: Мари́я Никола́евна рабо́тает ___.
    hint: врач
    accept:
    - врачо́м
  - stem: А́нна интересу́ется ___.
    hint: ру́сская му́зыка
    accept:
    - ру́сской му́зыкой
  - stem: Мы гуля́ем по ___.
    hint: Москва́
    accept:
    - Москве́
  why: |
    第 1、7 题：交通工具用 [на]{.ru} + 第六格：[на трамва́е, на маши́не]{.ru}。
    第 2、4、12 题：[с … до …]{.ru} 表示时间段，两端都用第二格：[с девяти́, до ве́чера, с сентября́]{.ru}。
    第 3、8 题：[с]{.ru} 表示“带有”“和……一起”，用第五格：[с лимо́ном, с Ка́тей]{.ru}。
    第 5、6 题：[спать под]{.ru} 表示位置，用第五格 [крова́тью]{.ru}；[ста́вить под]{.ru} 表示方向，用第四格 [крова́ть]{.ru}。
    第 9、10 题：[без, у]{.ru} 接第二格：[без са́хара, у ба́бушки]{.ru}。第 11 题：[к]{.ru} 接第三格：[к ба́бушке]{.ru}。
    第 13 题：[пе́ред]{.ru} 表示时间，用第五格：[пе́ред у́жином]{.ru}。
    第 14、15 题：[рабо́тать, интересова́ться]{.ru} 接第五格。
    第 16 题：[гуля́ть по]{.ru}“在……各处走”，接第三格：[по Москве́]{.ru}。
