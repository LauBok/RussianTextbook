heading: 第 25 课　不定向运动动词
groups:
- id: L25-01
  tags:
  - 运动动词现在时：ходи́ть、е́здить
  task: 按主语写出 [ходи́ть]{.ru} 和 [е́здить]{.ru} 的现在时。
  type: matrix
  cols:
  - 主语
  - '[ходи́ть]{.ru}'
  - '[е́здить]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[хожу́]{.ru}'
    - '[е́зжу]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[хо́дишь]{.ru}'
    - '[е́здишь]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[хо́дит]{.ru}'
    - '[е́здит]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[хо́дим]{.ru}'
    - '[е́здим]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[хо́дите]{.ru}'
    - '[е́здите]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́здят]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[хо́дит]{.ru}'
    - '[е́здит]{.ru}'
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́здят]{.ru}'
  - base: '[па́па и я]{.ru}'
    cells:
    - '[па́па и я]{.ru}'
    - '[хо́дим]{.ru}'
    - '[е́здим]{.ru}'
  - base: '[О́льга Ви́кторовна]{.ru}'
    cells:
    - '[О́льга Ви́кторовна]{.ru}'
    - '[хо́дит]{.ru}'
    - '[е́здит]{.ru}'
  - base: '[Ю́ми и Пьер]{.ru}'
    cells:
    - '[Ю́ми и Пьер]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́здят]{.ru}'
  - base: '[ты и Ми́ша]{.ru}'
    cells:
    - '[ты и Ми́ша]{.ru}'
    - '[хо́дите]{.ru}'
    - '[е́здите]{.ru}'
  why: '第 1 题：第一人称辅音交替：[д → ж]{.ru}，[зд → зж]{.ru}：[хожу́, е́зжу]{.ru}。只有 [я]{.ru} 的形式交替，其余人称保留 [д]{.ru}。

    第 2–12 题：第二变位词尾 [-ишь, -ит, -им, -ите, -ят]{.ru}。[ходи́ть]{.ru} 只有 [хожу́]{.ru} 重音在词尾，其余重音移到词干：[хо́дишь, хо́дят]{.ru}；[е́здить]{.ru} 重音一直在词干。'
- id: L25-02
  tags:
  - 运动动词：定向与不定向辨别
  - 运动动词：步行与乘车
  task: 根据情景在四个运动动词中选择：先看是这一趟还是经常往返，再看步行还是乘车。
  type: classify
  bins:
  - '[идти́]{.ru}'
  - '[е́хать]{.ru}'
  - '[ходи́ть]{.ru}'
  - '[е́здить]{.ru}'
  items:
  - text: '[в шко́лу]{.ru}：米沙每天走着去上学'
    answer: '[ходи́ть]{.ru}'
  - text: '[в шко́лу]{.ru}：米沙现在正走在去学校的路上'
    answer: '[идти́]{.ru}'
  - text: '[на заво́д]{.ru}：爸爸每天坐地铁去'
    answer: '[е́здить]{.ru}'
  - text: '[на заво́д]{.ru}：爸爸此刻正坐地铁去工厂'
    answer: '[е́хать]{.ru}'
  - text: '[на да́чу]{.ru}：周末全家常坐车去'
    answer: '[е́здить]{.ru}'
  - text: '[на да́чу]{.ru}：今天晚上全家坐车去，已经定好了'
    answer: '[е́хать]{.ru}'
  - text: '[в библиоте́ку]{.ru}：王磊常走着去'
    answer: '[ходи́ть]{.ru}'
  - text: '[в магази́н]{.ru}：我现在正走去商店'
    answer: '[идти́]{.ru}'
  - text: '[в теа́тр]{.ru}：剧院就在附近，安娜很少去'
    answer: '[ходи́ть]{.ru}'
  - text: '[в центр]{.ru}：他们有时坐车去'
    answer: '[е́здить]{.ru}'
  - text: '[на стадио́н]{.ru}：你现在正走着去吗'
    answer: '[идти́]{.ru}'
  - text: '[в Москву́]{.ru}：皮埃尔的父母每年坐火车去'
    answer: '[е́здить]{.ru}'
  - text: '[в парк]{.ru}：我们经常走着去'
    answer: '[ходи́ть]{.ru}'
  - text: '[на рабо́ту]{.ru}：妈妈现在正坐车去上班'
    answer: '[е́хать]{.ru}'
  - text: '[на уро́к]{.ru}：同学们现在正走着去上课'
    answer: '[идти́]{.ru}'
  - text: '[в Шанха́й]{.ru}：王磊今天晚上坐火车去，已经定好了'
    answer: '[е́хать]{.ru}'
  - text: '[в университе́т]{.ru}：安娜总是走着去上学'
    answer: '[ходи́ть]{.ru}'
  - text: '[в Пеки́н]{.ru}：王磊的父亲常坐火车去出差'
    answer: '[е́здить]{.ru}'
  - text: '[домо́й]{.ru}：下课了，同学们现在正走回家'
    answer: '[идти́]{.ru}'
  - text: '[в Каза́нь]{.ru}：我们今天晚上坐火车去，票已经买好了'
    answer: '[е́хать]{.ru}'
  why: '第 2、8、11、15、19 题：此刻正走在路上，用 [идти́]{.ru}。

    第 4、14 题：此刻正坐车去，用 [е́хать]{.ru}；第 6、16、20 题是定好的一次乘车出行，用 [е́хать]{.ru} 的现在时表示将来。

    第 1、7、9、13、17 题：经常、反复、有去有回，步行，用 [ходи́ть]{.ru}。第 9 题“很少去”也是说习惯，同样用不定向动词。

    第 3、5、10、12、18 题：经常乘车往返，用 [е́здить]{.ru}。'
- id: L25-03
  tags:
  - 运动动词现在时：四个动词混合
  task: 用括号里给定动词的现在时填空，注意人称。
  type: fill
  items:
  - stem: Ми́ша ка́ждый день ___ в шко́лу.
    hint: ходи́ть
    accept:
    - хо́дит
  - stem: Я ча́сто ___ в библиоте́ку.
    hint: ходи́ть
    accept:
    - хожу́
  - stem: Сейча́с я ___ в магази́н.
    hint: идти́
    accept:
    - иду́
  - stem: Па́па ка́ждый день ___ на заво́д.
    hint: е́здить
    accept:
    - е́здит
  - stem: Я ре́дко ___ на да́чу.
    hint: е́здить
    accept:
    - е́зжу
  - stem: — Куда́ вы ___? — На рабо́ту.
    hint: е́хать
    accept:
    - е́дете
  - stem: Мы иногда́ ___ в центр.
    hint: е́здить
    accept:
    - е́здим
  - stem: Студе́нты сейча́с ___ на уро́к.
    hint: идти́
    accept:
    - иду́т
  - stem: Ты всегда́ ___ пешко́м?
    hint: ходи́ть
    accept:
    - хо́дишь
  - stem: Ве́чером они́ ___ на да́чу.
    hint: е́хать
    accept:
    - е́дут
  - stem: Вы ча́сто ___ в теа́тр?
    hint: ходи́ть
    accept:
    - хо́дите
  - stem: Ма́ма и па́па ка́ждое воскресе́нье ___ на да́чу.
    hint: е́здить
    accept:
    - е́здят
  - stem: — Куда́ ты ___? — В парк.
    hint: идти́
    accept:
    - идёшь
  - stem: Мы всегда́ ___ в парк пешко́м.
    hint: ходи́ть
    accept:
    - хо́дим
  - stem: Я ка́ждый день ___ в университе́т.
    hint: е́здить
    accept:
    - е́зжу
  - stem: Сейча́с мы ___ домо́й.
    hint: е́хать
    accept:
    - е́дем
  - stem: Ты ча́сто ___ на да́чу?
    hint: е́здить
    accept:
    - е́здишь
  - stem: Ми́ша ___ в шко́лу, а А́нна в университе́т.
    hint: ходи́ть
    accept:
    - хо́дит
  - stem: Я ___ на стадио́н, а ты?
    hint: идти́
    accept:
    - иду́
  - stem: Вы иногда́ ___ в центр?
    hint: е́здить
    accept:
    - е́здите
  why: '第 2、5、15 题：[я]{.ru} 的形式有辅音交替：[хожу́, е́зжу]{.ru}。

    第 1、9、11、14、18 题：[ходи́ть]{.ru} 其余人称重音在词干：[хо́дит, хо́дишь, хо́дите, хо́дим]{.ru}。

    第 4、7、12、17、20 题：[е́здит, е́здим, е́здят, е́здишь, е́здите]{.ru}，词干 [-зд-]{.ru} 不变。

    第 3、8、13、19 题：[иду́, иду́т, идёшь]{.ru}；第 6、10、16 题：[е́дете, е́дут, е́дем]{.ru}。'
