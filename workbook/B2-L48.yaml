heading: 第 48 课　目的从句：что́бы、для того́ что́бы
groups:
- id: B2-L48-01
  tags:
  - чтобы：说明从句与目的从句
  task: 把句子按 [что́бы]{.ru} 从句的种类归栏。
  type: classify
  bins:
  - 说明从句
  - 目的从句
  items:
  - text: '[Ма́ма хо́чет, что́бы я позвони́л.]{.ru}'
    answer: 说明从句
  - text: '[Я встал ра́но, что́бы не опозда́ть.]{.ru}'
    answer: 目的从句
  - text: '[Учи́тель тре́бует, что́бы мы говори́ли по-ру́сски.]{.ru}'
    answer: 说明从句
  - text: '[Пьер купи́л слова́рь, что́бы чита́ть ру́сские кни́ги.]{.ru}'
    answer: 目的从句
  - text: '[Я попроси́л, что́бы Ди́ма помо́г мне.]{.ru}'
    answer: 说明从句
  - text: '[Мы откры́ли окно́, что́бы в ко́мнате бы́ло свеже́е.]{.ru}'
    answer: 目的从句
  - text: '[Ну́жно, что́бы все пришли́ во́время.]{.ru}'
    answer: 说明从句
  - text: '[Ма́ма дала́ Ми́ше де́ньги, что́бы он купи́л хлеб.]{.ru}'
    answer: 目的从句
  - text: '[Ба́бушка жела́ет, что́бы мы бы́ли сча́стливы.]{.ru}'
    answer: 说明从句
  - text: '[Что́бы хорошо́ говори́ть по-ру́сски, на́до мно́го говори́ть.]{.ru}'
    answer: 目的从句
  - text: '[Скажи́ ему́, что́бы он купи́л хлеб.]{.ru}'
    answer: 说明从句
  - text: '[Ван Лэй взял зонт, что́бы не заболе́ть.]{.ru}'
    answer: 目的从句
  - text: '[Я не хочу́, что́бы ты уезжа́л.]{.ru}'
    answer: 说明从句
  - text: '[Мы пое́хали на вокза́л ра́ньше, что́бы купи́ть биле́ты.]{.ru}'
    answer: 目的从句
  - text: '[Па́па написа́л, что́бы мы его́ встре́тили.]{.ru}'
    answer: 说明从句
  - text: '[Я пишу́ тебе́ пи́сьма, что́бы ты не скуча́л.]{.ru}'
    answer: 目的从句
  why: |-
    说明从句跟在 [хоте́ть, тре́бовать, проси́ть, жела́ть, ну́жно, сказа́ть, написа́ть]{.ru} 这类词后面，补充“要什么、请求什么”；目的从句说明整个主句的动作是为了什么，回答 [заче́м]{.ru}。
    第 1、3、5、7、9、11、13、15 题：去掉从句，主句不完整（[Ма́ма хо́чет…]{.ru} 想要什么？），是说明从句。
    第 2、4、6、8、10、12、14、16 题：主句本身完整（[Я встал ра́но]{.ru}），从句说为什么这样做，是目的从句。第 8、16 题主语不同，第 2、4、10、12、14 题主语相同或泛指，这只影响动词形式，不影响从句种类。
- id: B2-L48-02
  tags:
  - 目的从句：不定式还是过去时形式
  task: 看主句和目的动作的执行者，判断 [что́бы]{.ru} 后该用哪种形式。
  type: classify
  bins:
  - 不定式
  - 过去时形式
  items:
  - text: '[Я встаю́ ра́но]{.ru}　执行者：[я]{.ru}'
    answer: 不定式
  - text: '[Ма́ма включи́ла свет]{.ru}　执行者：[Ми́ша]{.ru}（读书）'
    answer: 过去时形式
  - text: '[На́до мно́го чита́ть]{.ru}　执行者：泛指的人'
    answer: 不定式
  - text: '[Пьер купи́л слова́рь]{.ru}　执行者：[Пьер]{.ru}'
    answer: 不定式
  - text: '[Пьер купи́л слова́рь]{.ru}　执行者：[сестра́]{.ru}'
    answer: 过去时形式
  - text: '[Мы говори́м ти́хо]{.ru}　执行者：[ребёнок]{.ru}（睡觉）'
    answer: 过去时形式
  - text: '[Мы говори́м ти́хо]{.ru}　执行者：[мы]{.ru}（不打扰别人）'
    answer: 不定式
  - text: '[Ну́жно мно́го рабо́тать]{.ru}　执行者：泛指的人'
    answer: 不定式
  - text: '[Учи́тель повтори́л пра́вило]{.ru}　执行者：[студе́нты]{.ru}（听懂）'
    answer: 过去时形式
  - text: '[Я позвони́л Ди́ме]{.ru}　执行者：[я]{.ru}（打听消息）'
    answer: 不定式
  - text: '[Ди́ма объясни́л зада́чу ещё раз]{.ru}　执行者：[Ми́ша]{.ru}（明白）'
    answer: 过去时形式
  - text: '[Мо́жно взять такси́]{.ru}　执行者：泛指的人（不迟到）'
    answer: 不定式
  - text: '[Ба́бушка испекла́ пиро́г]{.ru}　执行者：[мы]{.ru}（尝一尝）'
    answer: 过去时形式
  - text: '[Ю́ми е́дет в Петербу́рг]{.ru}　执行者：[Ю́ми]{.ru}'
    answer: 不定式
  why: |-
    第 1、4、7、10、14 题：主句主语自己是目的动作的执行者，用 [что́бы]{.ru} + 不定式：[Я встаю́ ра́но, что́бы не опозда́ть]{.ru}。
    第 3、8、12 题：主句是无人称句（[на́до, ну́жно, мо́жно]{.ru}）或泛指，用不定式：[Что́бы не опозда́ть, мо́жно взять такси́]{.ru}。
    第 2、5、6、9、11、13 题：执行者是别人，用过去时形式，性数跟从句主语：[что́бы Ми́ша чита́л, что́бы ребёнок спал, что́бы студе́нты по́няли]{.ru}。易错：主语不同还用不定式，意思就变成“为了主语自己”。
- id: B2-L48-03
  tags:
  - чтобы не + 完成体
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Я поста́вил буди́льник, что́бы не ___ .
    hint: опа́здывать / опозда́ть
    accept:
    - опозда́ть
    new: true
    gloss: 闹钟
  - stem: Запиши́ телефо́н, что́бы не ___ его́.
    hint: забыва́ть / забы́ть
    accept:
    - забы́ть
  - stem: Оде́нься тепле́е, что́бы не ___ .
    hint: заболева́ть / заболе́ть
    accept:
    - заболе́ть
  - stem: Мы говори́ли ти́хо, что́бы не ___ ребёнка.
    hint: буди́ть / разбуди́ть
    accept:
    - разбуди́ть
  - stem: Я прове́рил рабо́ту ещё раз, что́бы не ___ оши́бок.
    hint: де́лать / сде́лать
    accept:
    - сде́лать
  - stem: Я записа́л а́дрес, что́бы не ___ его́.
    hint: теря́ть / потеря́ть
    accept:
    - потеря́ть
  - stem: Повтори́ слова́, что́бы не ___ их на экза́мене.
    hint: пу́тать / перепу́тать
    accept:
    - перепу́тать
    new: true
    gloss: 弄混
  - stem: Иди́ ме́дленно, что́бы не ___ .
    hint: па́дать / упа́сть
    accept:
    - упа́сть
  - stem: Мы вы́шли ра́но, что́бы ___ на по́езд.
    hint: успева́ть / успе́ть
    accept:
    - успе́ть
  - stem: Я позвони́л ма́ме, что́бы она́ не ___ .
    hint: волнова́ться
    accept:
    - волнова́лась
  why: |-
    第 1–8 题：“为了不……”说成 [что́бы не]{.ru} + 完成体不定式，指一次具体的、要避免的结果：[что́бы не опозда́ть, не забы́ть, не заболе́ть]{.ru}。主语相同，用不定式。
    第 9 题：肯定的目的“为了赶上”也用完成体：[что́бы успе́ть на по́езд]{.ru}。
    第 10 题：执行者是 [она́]{.ru}，和主句主语不同，用过去时形式：[что́бы она́ не волнова́лась]{.ru}。[волнова́ться]{.ru} 没有成对的完成体，这里用未完成体。
