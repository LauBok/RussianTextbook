heading: 第 56 课　时间表达的书面形式
groups:
- id: B3-L56-01
  lessons:
  - B3-L56
  tags:
  - 时间的书面表达：年份与世纪的格
  - 时间的书面表达：年代的词尾
  - 时间的书面表达：с … по …, до, к, накануне
  task: 按括号里的格式写出时间状语。
  type: matrix
  cols:
  - 格式 + 时间
  - 时间状语
  given:
  - 0
  rows:
  - base: '[в … + 1879 год]{.ru}'
    cells:
    - '[в … + 1879 год]{.ru}'
    - '[в 1879 году́]{.ru}'
  - base: '[о́сенью … + 1873 год]{.ru}'
    cells:
    - '[о́сенью … + 1873 год]{.ru}'
    - '[о́сенью 1873 го́да]{.ru}'
  - base: '[в а́вгусте … + 1860 год]{.ru}'
    cells:
    - '[в а́вгусте … + 1860 год]{.ru}'
    - '[в а́вгусте 1860 го́да]{.ru}'
  - base: '[в … + XIX век]{.ru}'
    cells:
    - '[в … + XIX век]{.ru}'
    - '[в XIX ве́ке]{.ru}'
  - base: '[в конце́ … + XIX век]{.ru}'
    cells:
    - '[в конце́ … + XIX век]{.ru}'
    - '[в конце́ XIX ве́ка]{.ru}'
  - base: '[в … + 1890-е го́ды]{.ru}'
    cells:
    - '[в … + 1890-е го́ды]{.ru}'
    - '[в 1890-е го́ды / в 1890-х года́х]{.ru}'
  - base: '[в нача́ле … + 1870-е го́ды]{.ru}'
    cells:
    - '[в нача́ле … + 1870-е го́ды]{.ru}'
    - '[в нача́ле 1870-х годо́в]{.ru}'
  - base: '[к … + 1890-е го́ды]{.ru}'
    cells:
    - '[к … + 1890-е го́ды]{.ru}'
    - '[к 1890-м года́м]{.ru}'
  - base: '[с … + 1891 год]{.ru}'
    cells:
    - '[с … + 1891 год]{.ru}'
    - '[с 1891 го́да]{.ru}'
  - base: '[с 1888 по … + 1890 год]{.ru}'
    cells:
    - '[с 1888 по … + 1890 год]{.ru}'
    - '[с 1888 по 1890 год]{.ru}'
  - base: '[до … + 1900 год]{.ru}'
    cells:
    - '[до … + 1900 год]{.ru}'
    - '[до 1900 го́да]{.ru}'
  - base: '[накану́не … + 1917 год]{.ru}'
    cells:
    - '[накану́не … + 1917 год]{.ru}'
    - '[накану́не 1917 го́да]{.ru}'
  - base: '[на рубеже́ … + XIX и XX век]{.ru}'
    cells:
    - '[на рубеже́ … + XIX и XX век]{.ru}'
    - '[на рубеже́ XIX и XX веко́в]{.ru}'
  why: |-
    第 1、4 题：年份、世纪单独出现时用 [в]{.ru} + 第六格：[в 1879 году́, в XIX ве́ке]{.ru}。
    第 2、3、5、7 题：前面有季节、月份、[нача́ло, коне́ц]{.ru} 时，年份、世纪用第二格：[о́сенью 1873 го́да]{.ru}（不写 [о́сенью в 1873 году́]{.ru}），[в а́вгусте 1860 го́да, в конце́ XIX ве́ка, в нача́ле 1870-х годо́в]{.ru}。
    第 6 题：年代用 [в]{.ru} + 复数第四格 [в 1890-е го́ды]{.ru}，更书面的说法是 [в]{.ru} + 复数第六格 [в 1890-х года́х]{.ru}。数字后的词尾跟着格变：[-е]{.ru}（第一、四格），[-х]{.ru}（第二、六格）。
    第 8 题：[к]{.ru} + 第三格，数字后写 [-м]{.ru}：[к 1890-м года́м]{.ru}。
    第 9、11、12 题：[с, до, накану́не]{.ru} 要求第二格：[с 1891 го́да, до 1900 го́да, накану́не 1917 го́да]{.ru}。
    第 10 题：[с]{.ru} … [по]{.ru} … 里 [по]{.ru} 后面用第四格：[по 1890 год]{.ru}。
    第 13 题：两个世纪之交用复数第二格：[на рубеже́ XIX и XX веко́в]{.ru}。
- id: B3-L56-02
  lessons:
  - B3-L56
  tags:
  - 时间的书面表达：年龄的说法
  task: 用三种方式写出年龄。
  type: matrix
  cols:
  - 年龄
  - '[в]{.ru} + 第四格'
  - '[в во́зрасте]{.ru} + 第二格'
  - 复合形容词
  given:
  - 0
  rows:
  - base: '[два]{.ru}'
    cells:
    - '[два]{.ru}'
    - '[в два го́да]{.ru}'
    - '[в во́зрасте двух лет]{.ru}'
    - '[двухле́тний]{.ru}'
  - base: '[три]{.ru}'
    cells:
    - '[три]{.ru}'
    - '[в три го́да]{.ru}'
    - '[в во́зрасте трёх лет]{.ru}'
    - '[трёхле́тний]{.ru}'
  - base: '[пять]{.ru}'
    cells:
    - '[пять]{.ru}'
    - '[в пять лет]{.ru}'
    - '[в во́зрасте пяти́ лет]{.ru}'
    - '[пятиле́тний]{.ru}'
  - base: '[семь]{.ru}'
    cells:
    - '[семь]{.ru}'
    - '[в семь лет]{.ru}'
    - '[в во́зрасте семи́ лет]{.ru}'
    - '[семиле́тний]{.ru}'
  - base: '[трина́дцать]{.ru}'
    cells:
    - '[трина́дцать]{.ru}'
    - '[в трина́дцать лет]{.ru}'
    - '[в во́зрасте трина́дцати лет]{.ru}'
    - '[тринадцатиле́тний]{.ru}'
  - base: '[девятна́дцать]{.ru}'
    cells:
    - '[девятна́дцать]{.ru}'
    - '[в девятна́дцать лет]{.ru}'
    - '[в во́зрасте девятна́дцати лет]{.ru}'
    - '[девятнадцатиле́тний]{.ru}'
  - base: '[со́рок]{.ru}'
    cells:
    - '[со́рок]{.ru}'
    - '[в со́рок лет]{.ru}'
    - '[в во́зрасте сорока́ лет]{.ru}'
    - '[сорокале́тний]{.ru}'
  why: |-
    第 1–7 题：[в]{.ru} + 第四格：在 [два, три]{.ru} 后用 [го́да]{.ru}，五以上用 [лет]{.ru}：[в два го́да, в пять лет]{.ru}。
    第 1–7 题：[в во́зрасте]{.ru} 后数词和名词都用第二格，名词一律是 [лет]{.ru}：[в во́зрасте двух лет, трина́дцати лет, сорока́ лет]{.ru}。
    第 1–7 题：复合形容词的第一部分用数词的第二格，加 [-ле́тний]{.ru}，整个词只有一个重音：[двухле́тний, трёхле́тний]{.ru}（[ё]{.ru} 保留）, [тринадцатиле́тний, сорокале́тний]{.ru}。
- id: B3-L56-03
  lessons:
  - B3-L56
  tags:
  - 时间的书面表达：句中
  task: 用括号里的词填空；括号里是带数字的写法时，只填数字后的词尾。
  type: fill
  items:
  - stem: Чайко́вский учи́лся в консервато́рии с 1862 по 1865 ___.
    hint: год
    accept:
    - год
  - stem: Весно́й 1877 ___ он на́чал писа́ть о́перу «Евге́ний Оне́гин».
    hint: год
    accept:
    - го́да
  - stem: Он роди́лся в ма́е 1840 ___.
    hint: год
    accept:
    - го́да
  - stem: В 1870-___ го́ды он преподава́л в Москве́.
    hint: 1870-е
    accept:
    - е
  - stem: В 1880-___ года́х он мно́го е́здил за грани́цу.
    hint: 1880-е
    accept:
    - х
  - stem: К ___ 1880-х годо́в его́ му́зыку зна́ли во всём ми́ре.
    hint: коне́ц
    accept:
    - концу́
  - stem: В после́дние го́ды ___ он жил под Москво́й.
    hint: жизнь
    accept:
    - жи́зни
  - stem: Накану́не ___ певе́ц заболе́л.
    hint: конце́рт
    accept:
    - конце́рта
  - stem: В ___ двадцати́ лет он реши́л стать музыка́нтом.
    hint: во́зраст
    accept:
    - во́зрасте
  - stem: Пу́шкин у́мер, не дожи́в до сорока́ ___.
    hint: год
    accept:
    - лет
  - stem: Мы отдыха́ли на э́том о́зере три ___ подря́д.
    hint: ле́то
    accept:
    - ле́та
  - stem: Спустя́ два́дцать ___ друзья́ сно́ва встре́тились.
    hint: год
    accept:
    - лет
  why: |-
    第 1 题：[с]{.ru} … [по]{.ru} … 的 [по]{.ru} 后面用第四格：[по 1865 год]{.ru}。
    第 2、3 题：前面有季节、月份，年份用第二格：[весно́й 1877 го́да, в ма́е 1840 го́да]{.ru}。
    第 4、5 题：年代数字后的词尾跟着格：[в 1870-е го́ды]{.ru}（第四格 [-е]{.ru}），[в 1880-х года́х]{.ru}（第六格 [-х]{.ru}）。
    第 6 题：[к]{.ru} + 第三格：[к концу́ 1880-х годо́в]{.ru}（[коне́ц]{.ru} 的 [е]{.ru} 脱落，重音移到词尾）。
    第 7 题：[в после́дние го́ды]{.ru} + 第二格：[жи́зни]{.ru}。
    第 8 题：[накану́не]{.ru} + 第二格：[накану́не конце́рта]{.ru}。
    第 9 题：在……岁时：[в во́зрасте]{.ru} + 第二格；[во́зраст]{.ru} 本身用第六格：[в во́зрасте]{.ru}。
    第 10、12 题：数词 [со́рок, два́дцать]{.ru} 后用 [лет]{.ru}：[до сорока́ лет, спустя́ два́дцать лет]{.ru}。
    第 11 题：第四格 + [подря́д]{.ru} 表示“一连”：[три ле́та подря́д]{.ru}（[три]{.ru} 后单数第二格）。
