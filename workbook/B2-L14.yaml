  - base: '[но́вая студе́нтка]{.ru}'
    cells:
    - '[но́вая студе́нтка]{.ru}'
    - '[две но́вые студе́нтки]{.ru}'
    - '[пять но́вых студе́нток]{.ru}'
  - base: '[све́жее я́блоко]{.ru}'
    cells:
    - '[све́жее я́блоко]{.ru}'
    - '[два све́жих я́блока]{.ru}'
    - '[пять све́жих я́блок]{.ru}'
  - base: '[ста́рый дом]{.ru}'
