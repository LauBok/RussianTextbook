    第 5–9 题：[к, г, х, ж, ш, ч, щ]{.ru} 后不写 [ы]{.ru}，写 [и]{.ru}：[ма́ленькие, ру́сских, хоро́шим, све́жими, высо́ких]{.ru}。
    第 10–12 题：词尾重读，又在 [х, ш, г]{.ru} 后：写 [и]{.ru}，重音在词尾：[плохи́е, больши́х, дороги́ми]{.ru}。
