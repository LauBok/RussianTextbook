    第 5–7、10 题：阴性名词：2–4 后形容词多用复数第一格：[две интере́сные кни́ги, две но́вые студе́нтки]{.ru}（[две интере́сных кни́ги]{.ru} 也有人说）；5 以上用复数第二格：[пять интере́сных книг]{.ru}。
