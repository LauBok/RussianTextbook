heading: 第 39 课　前缀 при- 和 у-
groups:
- id: B2-L39-01
  tags:
  - 前缀 при- / у-：构成体对
  task: 写出加前缀 [при-]{.ru} 和 [у-]{.ru} 后的未完成体和完成体。
  type: matrix
  cols:
  - 不带前缀
  - '[при-]{.ru} 未完成体'
  - '[при-]{.ru} 完成体'
  - '[у-]{.ru} 未完成体'
  - '[у-]{.ru} 完成体'
  given:
  - 0
  rows:
  - base: '[ходи́ть / идти́]{.ru}'
    cells:
    - '[ходи́ть / идти́]{.ru}'
    - '[приходи́ть]{.ru}'
    - '[прийти́]{.ru}'
    - '[уходи́ть]{.ru}'
    - '[уйти́]{.ru}'
  - base: '[е́здить / е́хать]{.ru}'
    cells:
    - '[е́здить / е́хать]{.ru}'
    - '[приезжа́ть]{.ru}'
    - '[прие́хать]{.ru}'
    - '[уезжа́ть]{.ru}'
    - '[уе́хать]{.ru}'
  - base: '[лета́ть / лете́ть]{.ru}'
    cells:
    - '[лета́ть / лете́ть]{.ru}'
    - '[прилета́ть]{.ru}'
    - '[прилете́ть]{.ru}'
    - '[улета́ть]{.ru}'
    - '[улете́ть]{.ru}'
  - base: '[носи́ть / нести́]{.ru}'
    cells:
    - '[носи́ть / нести́]{.ru}'
    - '[приноси́ть]{.ru}'
    - '[принести́]{.ru}'
    - '[—]{.ru}'
    - '[—]{.ru}'
    hint: '{у-} 两栏不填'
  - base: '[вози́ть / везти́]{.ru}'
    cells:
    - '[вози́ть / везти́]{.ru}'
    - '[привози́ть]{.ru}'
    - '[привезти́]{.ru}'
    - '[—]{.ru}'
    - '[—]{.ru}'
    hint: '{у-} 两栏不填'
  why: |-
    前缀加在不定向动词上构成未完成体，加在定向动词上构成完成体：[ходи́ть → приходи́ть]{.ru}，[идти́ → прийти́]{.ru}。
    第 1 题：[идти́]{.ru} 加前缀写成 [-йти]{.ru}：[прийти́, уйти́]{.ru}。
    第 2 题：[е́здить]{.ru} 加前缀变成 [-езжа́ть]{.ru}：[приезжа́ть, уезжа́ть]{.ru}，不写 [приезди́ть]{.ru}。
    第 3–5 题：其余直接加前缀：[прилета́ть / прилете́ть, приноси́ть / принести́, привози́ть / привезти́]{.ru}。
- id: B2-L39-02
  tags:
  - 前缀 при- / у-：完成体变位
  task: 写出完成体动词的将来时和过去时。
  type: matrix
  cols:
  - 完成体
  - 将来时 [я]{.ru}
  - 将来时 [ты]{.ru}
  - 过去时阳性
  - 过去时阴性
  given:
  - 0
  rows:
  - base: '[прийти́]{.ru}'
    cells:
    - '[прийти́]{.ru}'
    - '[приду́]{.ru}'
    - '[придёшь]{.ru}'
    - '[пришёл]{.ru}'
    - '[пришла́]{.ru}'
  - base: '[уйти́]{.ru}'
    cells:
    - '[уйти́]{.ru}'
    - '[уйду́]{.ru}'
    - '[уйдёшь]{.ru}'
    - '[ушёл]{.ru}'
    - '[ушла́]{.ru}'
  - base: '[прие́хать]{.ru}'
    cells:
    - '[прие́хать]{.ru}'
    - '[прие́ду]{.ru}'
    - '[прие́дешь]{.ru}'
    - '[прие́хал]{.ru}'
    - '[прие́хала]{.ru}'
  - base: '[уе́хать]{.ru}'
    cells:
    - '[уе́хать]{.ru}'
    - '[уе́ду]{.ru}'
    - '[уе́дешь]{.ru}'
    - '[уе́хал]{.ru}'
    - '[уе́хала]{.ru}'
  - base: '[прилете́ть]{.ru}'
    cells:
    - '[прилете́ть]{.ru}'
    - '[прилечу́]{.ru}'
    - '[прилети́шь]{.ru}'
    - '[прилете́л]{.ru}'
    - '[прилете́ла]{.ru}'
  - base: '[улете́ть]{.ru}'
    cells:
    - '[улете́ть]{.ru}'
    - '[улечу́]{.ru}'
    - '[улети́шь]{.ru}'
    - '[улете́л]{.ru}'
    - '[улете́ла]{.ru}'
  - base: '[принести́]{.ru}'
    cells:
    - '[принести́]{.ru}'
    - '[принесу́]{.ru}'
    - '[принесёшь]{.ru}'
    - '[принёс]{.ru}'
    - '[принесла́]{.ru}'
  - base: '[привезти́]{.ru}'
    cells:
    - '[привезти́]{.ru}'
    - '[привезу́]{.ru}'
    - '[привезёшь]{.ru}'
    - '[привёз]{.ru}'
    - '[привезла́]{.ru}'
  why: |-
    前缀动词照不带前缀的定向动词变：[иду́ → приду́, уйду́]{.ru}；[е́ду → прие́ду]{.ru}；[лечу́ → прилечу́]{.ru}；[несу́ → принесу́]{.ru}。
    第 1、2 题：[приду́]{.ru} 不写 [й]{.ru}，[уйду́]{.ru} 写 [й]{.ru}；过去时 [пришёл, ушла́]{.ru}。
    第 3、4 题：[прие́ду, прие́дешь]{.ru}，重音不动。
    第 5、6 题：[я]{.ru} 有交替 [т → ч]{.ru}：[прилечу́, улечу́]{.ru}。
    第 7、8 题：过去时阳性没有 [-л]{.ru}：[принёс, привёз]{.ru}；阴性重音在词尾：[принесла́, привезла́]{.ru}。
- id: B2-L39-03
  tags:
  - 前缀 при- / у-：未完成体变位
  task: 写出未完成体动词的现在时。
  type: matrix
  cols:
  - 未完成体
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[приходи́ть]{.ru}'
    cells:
    - '[приходи́ть]{.ru}'
    - '[прихожу́]{.ru}'
    - '[прихо́дишь]{.ru}'
    - '[прихо́дят]{.ru}'
  - base: '[уходи́ть]{.ru}'
    cells:
    - '[уходи́ть]{.ru}'
    - '[ухожу́]{.ru}'
    - '[ухо́дишь]{.ru}'
    - '[ухо́дят]{.ru}'
  - base: '[приезжа́ть]{.ru}'
    cells:
    - '[приезжа́ть]{.ru}'
    - '[приезжа́ю]{.ru}'
    - '[приезжа́ешь]{.ru}'
    - '[приезжа́ют]{.ru}'
  - base: '[уезжа́ть]{.ru}'
    cells:
    - '[уезжа́ть]{.ru}'
    - '[уезжа́ю]{.ru}'
    - '[уезжа́ешь]{.ru}'
    - '[уезжа́ют]{.ru}'
  - base: '[прилета́ть]{.ru}'
    cells:
    - '[прилета́ть]{.ru}'
    - '[прилета́ю]{.ru}'
    - '[прилета́ешь]{.ru}'
    - '[прилета́ют]{.ru}'
  - base: '[улета́ть]{.ru}'
    cells:
    - '[улета́ть]{.ru}'
    - '[улета́ю]{.ru}'
    - '[улета́ешь]{.ru}'
    - '[улета́ют]{.ru}'
  - base: '[приноси́ть]{.ru}'
    cells:
    - '[приноси́ть]{.ru}'
    - '[приношу́]{.ru}'
    - '[прино́сишь]{.ru}'
    - '[прино́сят]{.ru}'
  - base: '[привози́ть]{.ru}'
    cells:
    - '[привози́ть]{.ru}'
    - '[привожу́]{.ru}'
    - '[приво́зишь]{.ru}'
    - '[приво́зят]{.ru}'
  why: |-
    第 1、2、7、8 题：照 [ходи́ть, носи́ть, вози́ть]{.ru} 变：[я]{.ru} 有交替（[д → ж, с → ш, з → ж]{.ru}），重音在词尾，其余人称重音前移：[прихожу́ — прихо́дишь, приношу́ — прино́сишь]{.ru}。
    第 3–6 题：[-а́ть]{.ru} 第一变位，重音不动：[приезжа́ю, улета́ю]{.ru}。[приезжа́ть]{.ru} 不能照 [е́хать]{.ru} 变成 [прие́ду]{.ru}——那是完成体。
- id: B2-L39-04
  tags:
  - 前缀 при- / у-：前置词搭配
  task: 写出“来到”和“离开”的词组。
  type: matrix
  cols:
  - 地点或人
  - '[при-]{.ru}'
  - '[у-]{.ru}'
  given:
  - 0
  rows:
  - base: '[Каза́нь]{.ru}'
    cells:
    - '[Каза́нь]{.ru}'
    - '[прие́хать в Каза́нь]{.ru}'
    - '[уе́хать из Каза́ни]{.ru}'
    hint: 乘车
  - base: '[ба́бушка]{.ru}'
    cells:
    - '[ба́бушка]{.ru}'
    - '[прийти́ к ба́бушке]{.ru}'
    - '[уйти́ от ба́бушки]{.ru}'
    hint: 步行
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[прилете́ть в Москву́]{.ru}'
    - '[улете́ть из Москвы́]{.ru}'
    hint: 乘飞机
  - base: '[шко́ла]{.ru}'
    cells:
    - '[шко́ла]{.ru}'
    - '[прийти́ в шко́лу]{.ru}'
    - '[уйти́ из шко́лы]{.ru}'
    hint: 步行
  - base: '[врач]{.ru}'
    cells:
    - '[врач]{.ru}'
    - '[прийти́ к врачу́]{.ru}'
    - '[уйти́ от врача́]{.ru}'
    hint: 步行
  - base: '[Пеки́н]{.ru}'
    cells:
    - '[Пеки́н]{.ru}'
    - '[прилете́ть в Пеки́н]{.ru}'
    - '[улете́ть из Пеки́на]{.ru}'
    hint: 乘飞机
  - base: '[друг]{.ru}'
    cells:
    - '[друг]{.ru}'
    - '[прийти́ к дру́гу]{.ru}'
    - '[уйти́ от дру́га]{.ru}'
    hint: 步行
  - base: '[дере́вня]{.ru}'
    cells:
    - '[дере́вня]{.ru}'
    - '[прие́хать в дере́вню]{.ru}'
    - '[уе́хать из дере́вни]{.ru}'
    hint: 乘车
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[прие́хать к роди́телям]{.ru}'
    - '[уе́хать от роди́телей]{.ru}'
    hint: 乘车
  - base: '[библиоте́ка]{.ru}'
    cells:
    - '[библиоте́ка]{.ru}'
    - '[прийти́ в библиоте́ку]{.ru}'
    - '[уйти́ из библиоте́ки]{.ru}'
    hint: 步行
  - base: '[Влади́мир]{.ru}'
    cells:
    - '[Влади́мир]{.ru}'
    - '[прие́хать во Влади́мир]{.ru}'
    - '[уе́хать из Влади́мира]{.ru}'
    hint: 乘车
  - base: '[О́льга Ви́кторовна]{.ru}'
    cells:
    - '[О́льга Ви́кторовна]{.ru}'
    - '[прийти́ к О́льге Ви́кторовне]{.ru}'
    - '[уйти́ от О́льги Ви́кторовны]{.ru}'
    hint: 步行
  why: |-
    第 1、3、4、6、8、10、11 题：去某地 [в]{.ru} + 第四格，从某地 [из]{.ru} + 第二格：[прие́хать в Каза́нь / уе́хать из Каза́ни]{.ru}。第 11 题 [Влади́мир]{.ru} 以 [вл]{.ru} 开头，写 [во Влади́мир]{.ru}。
    第 2、5、7、9、12 题：到某人那里 [к]{.ru} + 第三格，从某人那里 [от]{.ru} + 第二格：[прийти́ к ба́бушке / уйти́ от ба́бушки]{.ru}。人名父称两个词都变：[к О́льге Ви́кторовне]{.ru}。常见错误是对人也用 [в / из]{.ru}。
    第 5 题：[врач]{.ru} 重音在词尾：[к врачу́, от врача́]{.ru}。第 9 题复数：[к роди́телям, от роди́телей]{.ru}。
