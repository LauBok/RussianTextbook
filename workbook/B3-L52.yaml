heading: 第 52 课　数词与形容词连用
groups:
- id: B3-L52-01
  lessons:
  - B3-L52
  tags:
  - 数词与形容词：два, три, четыре 后的形容词
  - 数词与形容词：阴性名词前两可
  - 数词与形容词：五以上
  task: 把词组和数词连用。
  type: matrix
  cols:
  - 形容词 + 名词
  - '[два / две]{.ru}'
  - '[пять]{.ru}'
  - '[о́ба / о́бе]{.ru}'
  given:
  - 0
  rows:
  - base: '[ста́рый чино́вник]{.ru}'
    cells:
    - '[ста́рый чино́вник]{.ru}'
    - '[два ста́рых чино́вника]{.ru}'
    - '[пять ста́рых чино́вников]{.ru}'
    - '[о́ба ста́рых чино́вника]{.ru}'
  - base: '[большо́й го́род]{.ru}'
    cells:
    - '[большо́й го́род]{.ru}'
    - '[два больши́х го́рода]{.ru}'
    - '[пять больши́х городо́в]{.ru}'
    - '[о́ба больши́х го́рода]{.ru}'
  - base: '[молодо́й врач]{.ru}'
    cells:
    - '[молодо́й врач]{.ru}'
    - '[два молоды́х врача́]{.ru}'
    - '[пять молоды́х враче́й]{.ru}'
    - '[о́ба молоды́х врача́]{.ru}'
  - base: '[но́вое пла́тье]{.ru}'
    cells:
    - '[но́вое пла́тье]{.ru}'
    - '[два но́вых пла́тья]{.ru}'
    - '[пять но́вых пла́тьев]{.ru}'
    - '[о́ба но́вых пла́тья]{.ru}'
  - base: '[большо́е окно́]{.ru}'
    cells:
    - '[большо́е окно́]{.ru}'
    - '[два больши́х окна́]{.ru}'
    - '[пять больши́х о́кон]{.ru}'
    - '[о́ба больши́х окна́]{.ru}'
  - base: '[интере́сное письмо́]{.ru}'
    cells:
    - '[интере́сное письмо́]{.ru}'
    - '[два интере́сных письма́]{.ru}'
    - '[пять интере́сных пи́сем]{.ru}'
    - '[о́ба интере́сных письма́]{.ru}'
  - base: '[до́лгая неде́ля]{.ru}'
    cells:
    - '[до́лгая неде́ля]{.ru}'
    - '[две до́лгие (до́лгих) неде́ли]{.ru}'
    - '[пять до́лгих неде́ль]{.ru}'
    - '[о́бе до́лгие (до́лгих) неде́ли]{.ru}'
  - base: '[но́вая шине́ль]{.ru}'
    cells:
    - '[но́вая шине́ль]{.ru}'
    - '[две но́вые (но́вых) шине́ли]{.ru}'
    - '[пять но́вых шине́лей]{.ru}'
    - '[о́бе но́вые (но́вых) шине́ли]{.ru}'
  - base: '[ста́ршая сестра́]{.ru}'
    cells:
    - '[ста́ршая сестра́]{.ru}'
    - '[две ста́ршие (ста́рших) сестры́]{.ru}'
    - '[пять ста́рших сестёр]{.ru}'
    - '[о́бе ста́ршие (ста́рших) сестры́]{.ru}'
  why: |-
    第 1–6 题：[два, о́ба]{.ru} 后面阳性、中性名词用单数第二格，形容词却用复数第二格：[два ста́рых чино́вника, о́ба но́вых пла́тья]{.ru}。不能把形容词写成单数 [ста́рого]{.ru}。
    第 7–9 题：阴性名词前的形容词多用复数第一格，也可以用复数第二格：[две до́лгие]{.ru} ([до́лгих]{.ru}) [неде́ли, о́бе ста́ршие]{.ru} ([ста́рших]{.ru}) [сестры́]{.ru}。两种都对。
    第 1–9 题：[пять]{.ru} 以上名词和形容词都用复数第二格：[пять ста́рых чино́вников, пять до́лгих неде́ль]{.ru}。注意复数第二格的特殊形式：[городо́в, враче́й, пла́тьев, о́кон, пи́сем, шине́лей, сестёр]{.ru}。
    第 5、6、9 题：和 [два]{.ru} 连用的单数第二格重音与复数不同：[два окна́, два письма́, две сестры́]{.ru}。
- id: B3-L52-02
  lessons:
  - B3-L52
  tags:
  - 数词与形容词：形容词在数词前
  task: 写出词组：形容词放在数词后面和放在数词前面。
  type: matrix
  cols:
  - 形容词 + 数词 + 名词
  - 形容词在数词后
  - 形容词在数词前
  given:
  - 0
  rows:
  - base: '[пе́рвый + 2 + день]{.ru}'
    cells:
    - '[пе́рвый + 2 + день]{.ru}'
    - '[два пе́рвых дня]{.ru}'
    - '[пе́рвые два дня]{.ru}'
  - base: '[после́дний + 3 + неде́ля]{.ru}'
    cells:
    - '[после́дний + 3 + неде́ля]{.ru}'
    - '[три после́дние (после́дних) неде́ли]{.ru}'
    - '[после́дние три неде́ли]{.ru}'
  - base: '[сле́дующий + 2 + год]{.ru}'
    cells:
    - '[сле́дующий + 2 + год]{.ru}'
    - '[два сле́дующих го́да]{.ru}'
    - '[сле́дующие два го́да]{.ru}'
  - base: '[после́дний + 4 + ме́сяц]{.ru}'
    cells:
    - '[после́дний + 4 + ме́сяц]{.ru}'
    - '[четы́ре после́дних ме́сяца]{.ru}'
    - '[после́дние четы́ре ме́сяца]{.ru}'
  - base: '[пе́рвый + 3 + уро́к]{.ru}'
    cells:
    - '[пе́рвый + 3 + уро́к]{.ru}'
    - '[три пе́рвых уро́ка]{.ru}'
    - '[пе́рвые три уро́ка]{.ru}'
  - base: '[друго́й + 2 + студе́нт]{.ru}'
    cells:
    - '[друго́й + 2 + студе́нт]{.ru}'
    - '[два други́х студе́нта]{.ru}'
    - '[други́е два студе́нта]{.ru}'
  - base: '[пе́рвый + 2 + кни́га]{.ru}'
    cells:
    - '[пе́рвый + 2 + кни́га]{.ru}'
    - '[две пе́рвые (пе́рвых) кни́ги]{.ru}'
    - '[пе́рвые две кни́ги]{.ru}'
  - base: '[после́дний + 2 + сло́во]{.ru}'
    cells:
    - '[после́дний + 2 + сло́во]{.ru}'
    - '[два после́дних сло́ва]{.ru}'
    - '[после́дние два сло́ва]{.ru}'
  why: |-
    第 1–8 题：形容词放在数词后面，按数词的规则：阳性、中性名词前用复数第二格（[два пе́рвых дня]{.ru}），阴性名词前多用复数第一格，也可以用第二格（[три после́дние / после́дних неде́ли]{.ru}）。
    第 1–8 题：形容词放在数词前面时，一律用复数第一格：[пе́рвые два дня, после́дние три неде́ли, други́е два студе́нта]{.ru}。名词仍用单数第二格。
- id: B3-L52-03
  lessons:
  - B3-L52
  tags:
  - 数词与形容词：名词化的形容词和形动词
  task: 把名词和数词连用。
  type: matrix
  cols:
  - 名词
  - '[два / две]{.ru}'
  - '[пять]{.ru}'
  given:
  - 0
  rows:
  - base: '[портно́й]{.ru}'
    cells:
    - '[портно́й]{.ru}'
    - '[два портны́х]{.ru}'
    - '[пять портны́х]{.ru}'
  - base: '[учёный]{.ru}'
    cells:
    - '[учёный]{.ru}'
    - '[два учёных]{.ru}'
    - '[пять учёных]{.ru}'
  - base: '[рабо́чий]{.ru}'
    cells:
    - '[рабо́чий]{.ru}'
    - '[два рабо́чих]{.ru}'
    - '[пять рабо́чих]{.ru}'
  - base: '[подчинённый]{.ru}'
    cells:
    - '[подчинённый]{.ru}'
    - '[два подчинённых]{.ru}'
    - '[пять подчинённых]{.ru}'
  - base: '[взро́слый]{.ru}'
    cells:
    - '[взро́слый]{.ru}'
    - '[два взро́слых]{.ru}'
    - '[пять взро́слых]{.ru}'
  - base: '[знако́мый]{.ru}'
    cells:
    - '[знако́мый]{.ru}'
    - '[два знако́мых]{.ru}'
    - '[пять знако́мых]{.ru}'
  - base: '[уча́щийся]{.ru}'
    cells:
    - '[уча́щийся]{.ru}'
    - '[два уча́щихся]{.ru}'
    - '[пять уча́щихся]{.ru}'
  - base: '[прису́тствующий]{.ru}'
    cells:
    - '[прису́тствующий]{.ru}'
    - '[два прису́тствующих]{.ru}'
    - '[пять прису́тствующих]{.ru}'
    new: true
    gloss: 在场的人
  - base: '[ва́нная]{.ru}'
    cells:
    - '[ва́нная]{.ru}'
    - '[две ва́нные (ва́нных)]{.ru}'
    - '[пять ва́нных]{.ru}'
  - base: '[столо́вая]{.ru}'
    cells:
    - '[столо́вая]{.ru}'
    - '[две столо́вые (столо́вых)]{.ru}'
    - '[пять столо́вых]{.ru}'
    new: true
    gloss: 食堂
  why: |-
    第 1–8 题：名词化的形容词和形动词仍按形容词变格，在 [два]{.ru} 后用复数第二格：[два портны́х, три учёных, два уча́щихся]{.ru}；不写 [два портно́го]{.ru}。[пять]{.ru} 后也是复数第二格，所以两列形式相同。
    第 9、10 题：阴性的名词化形容词和普通阴性名词前的形容词一样，[два]{.ru} 后多用复数第一格，也可以用复数第二格：[две столо́вые]{.ru} ([столо́вых]{.ru})。
- id: B3-L52-04
  lessons:
  - B3-L52
  tags:
  - 数词与形容词：间接格
  task: 写出数量词组的第三、五、六格。
  type: matrix
  cols:
  - 词组
  - 第三格
  - 第五格
  - '[о]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[два но́вых студе́нта]{.ru}'
    cells:
    - '[два но́вых студе́нта]{.ru}'
    - '[двум но́вым студе́нтам]{.ru}'
    - '[двумя́ но́выми студе́нтами]{.ru}'
    - '[о двух но́вых студе́нтах]{.ru}'
  - base: '[три ста́рых чино́вника]{.ru}'
    cells:
    - '[три ста́рых чино́вника]{.ru}'
    - '[трём ста́рым чино́вникам]{.ru}'
    - '[тремя́ ста́рыми чино́вниками]{.ru}'
    - '[о трёх ста́рых чино́вниках]{.ru}'
  - base: '[две ста́ршие сестры́]{.ru}'
    cells:
    - '[две ста́ршие сестры́]{.ru}'
    - '[двум ста́ршим сёстрам]{.ru}'
    - '[двумя́ ста́ршими сёстрами]{.ru}'
    - '[о двух ста́рших сёстрах]{.ru}'
  - base: '[четы́ре но́вых пла́тья]{.ru}'
    cells:
    - '[четы́ре но́вых пла́тья]{.ru}'
    - '[четырём но́вым пла́тьям]{.ru}'
    - '[четырьмя́ но́выми пла́тьями]{.ru}'
    - '[о четырёх но́вых пла́тьях]{.ru}'
  - base: '[пять больши́х городо́в]{.ru}'
    cells:
    - '[пять больши́х городо́в]{.ru}'
    - '[пяти́ больши́м города́м]{.ru}'
    - '[пятью́ больши́ми города́ми]{.ru}'
    - '[о пяти́ больши́х города́х]{.ru}'
  - base: '[два портны́х]{.ru}'
    cells:
    - '[два портны́х]{.ru}'
    - '[двум портны́м]{.ru}'
    - '[двумя́ портны́ми]{.ru}'
    - '[о двух портны́х]{.ru}'
  why: |-
    第 1–6 题：数词在第三、五、六格时，名词和形容词都用复数，并与数词同格：[двум но́вым студе́нтам, тремя́ ста́рыми чино́вниками, о двух ста́рших сёстрах]{.ru}。不再区分阳性和阴性。
    第 3 题：[сестра́]{.ru} 的复数是 [сёстры]{.ru}：[сёстрам, сёстрами, о сёстрах]{.ru}。
    第 5 题：[пять]{.ru} 变成 [пяти́, пятью́]{.ru}；[го́род]{.ru} 的复数 [города́]{.ru} 重音在词尾：[города́м, города́ми]{.ru}。
    第 6 题：名词化的形容词同样跟数词同格：[двум портны́м, двумя́ портны́ми]{.ru}。
