  why: |-
    第 1–14 题：只有复数的名词，复数第二格要逐词记：[де́нег, дров, воро́т, сане́й, очко́в, су́ток, но́жниц, брюк, часо́в, имени́н, кани́кул]{.ru}。第三、五格按一般规则：硬变化 [-ам, -ами]{.ru}，软变化 [-ям, -ями]{.ru}。
    第 1、4 题：[де́ньги, са́ни]{.ru} 的间接格重音移到词尾：[деньга́м, деньга́ми]{.ru}；[саня́м, саня́ми]{.ru}。
    第 5、9、13 题：重音在词尾的词，各格重音都在词尾：[очко́в, очка́м]{.ru}；[часо́в, часа́ми]{.ru}；[духо́в, духа́ми]{.ru}。
    第 14 题：[обо́и]{.ru} 是软变化：[обо́ям, обо́ями]{.ru}。
- id: B3-L55-02
  lessons:
  - B3-L55
  tags:
  - 只有复数的名词：计数（одни, двое, пара）
  task: 写出“一个”“两个”“五个”的说法；有几种说法的都写出来。
  type: matrix
  cols:
  - 名词
  - 一个
  - 两个
  - 五个
  given:
  - 0
  rows:
  - base: '[часы́]{.ru}'
    cells:
    - '[часы́]{.ru}'
    - '[одни́ часы́]{.ru}'
    - '[дво́е часо́в]{.ru}'
    - '[пять часо́в]{.ru}'
  - base: '[су́тки]{.ru}'
    cells:
    - '[су́тки]{.ru}'
    - '[одни́ су́тки]{.ru}'
    - '[дво́е су́ток]{.ru}'
    - '[пять су́ток]{.ru}'
  - base: '[но́жницы]{.ru}'
    cells:
    - '[но́жницы]{.ru}'
    - '[одни́ но́жницы]{.ru}'
    - '[дво́е но́жниц]{.ru}'
    - '[пять но́жниц]{.ru}'
  - base: '[са́ни]{.ru}'
    cells:
    - '[са́ни]{.ru}'
    - '[одни́ са́ни]{.ru}'
    - '[дво́е сане́й]{.ru}'
    - '[пять сане́й]{.ru}'
  - base: '[воро́та]{.ru}'
    cells:
    - '[воро́та]{.ru}'
    - '[одни́ воро́та]{.ru}'
    - '[дво́е воро́т]{.ru}'
    - '[пять воро́т]{.ru}'
  - base: '[брю́ки]{.ru}'
    cells:
    - '[брю́ки]{.ru}'
    - '[одни́ брю́ки]{.ru}'
    - '[две па́ры брюк / дво́е брюк]{.ru}'
    - '[пять пар брюк]{.ru}'
  - base: '[очки́]{.ru}'
    cells:
    - '[очки́]{.ru}'
    - '[одни́ очки́]{.ru}'
    - '[две па́ры очко́в / дво́е очко́в]{.ru}'
    - '[пять пар очко́в]{.ru}'
  - base: '[весы́]{.ru}'
    cells:
    - '[весы́]{.ru}'
    - '[одни́ весы́]{.ru}'
    - '[дво́е весо́в]{.ru}'
    - '[пять весо́в]{.ru}'
    hint: 第二格 весо́в
    new: true
    gloss: 秤
  why: |-
    第 1–8 题：“一个”用复数形式的 [одни́]{.ru}：[одни́ часы́, одни́ су́тки]{.ru}，不说 [оди́н часы́]{.ru}。
    第 1–5、8 题：“两个”不能用 [два]{.ru}，要用集合数词 [дво́е]{.ru} + 复数第二格：[дво́е су́ток, дво́е но́жниц, дво́е сане́й]{.ru}。
    第 6、7 题：成对穿戴的东西常用 [па́ра]{.ru} 计数：[две па́ры брюк, две па́ры очко́в]{.ru}；也可以说 [дво́е брюк, дво́е очко́в]{.ru}。
    第 1–8 题：[пять]{.ru} 以上直接用复数第二格：[пять су́ток, пять но́жниц]{.ru}；用 [па́ра]{.ru} 时说 [пять пар брюк]{.ru}。
- id: B3-L55-03
  lessons:
  - B3-L55
  tags:
  - 只有复数的名词：形容词与过去时的一致
  task: 用括号里的词写出词组和过去时谓语。
  type: matrix
