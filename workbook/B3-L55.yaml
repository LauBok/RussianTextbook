  why: |-
    第 1–10 题：只有复数的名词不分性，形容词、代词都用复数，过去时也用复数：[но́вые брю́ки лежа́ли, ста́рые часы́ останови́лись, мои́ очки́ упа́ли, все де́ньги ко́нчились]{.ru}。
    第 6 题：形容词作谓语时也用复数：[щи бы́ли вку́сные]{.ru}。
