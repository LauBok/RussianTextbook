  - base: '[дорого́й + духи́ + стоя́ть на по́лке]{.ru}'
    cells:
    - '[дорого́й + духи́ + стоя́ть на по́лке]{.ru}'
    - '[дороги́е духи́ стоя́ли]{.ru}'
  - base: '[горя́чий + щи + быть вку́сный]{.ru}'
