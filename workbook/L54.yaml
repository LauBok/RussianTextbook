heading: 第 54 课　必要、许可与禁止
groups:
- id: L54-01
  tags: [无人称句：必要、许可、禁止与不可能]
  task: 判断句子表示哪一种意思，填写序号。
  type: classify
  bins: [必要、应该, 许可, 禁止, 不可能、做不到]
  items:
  - {text: '[Мне на́до рабо́тать.]{.ru}', answer: 必要、应该}
  - {text: '[Здесь нельзя́ кури́ть.]{.ru}', answer: 禁止}
  - {text: '[Мо́жно взять Му́рку?]{.ru}', answer: 许可}
  - {text: '[Без ключа́ дверь нельзя́ откры́ть.]{.ru}', answer: 不可能、做不到}
  - {text: '[Ми́ше ну́жно сде́лать уро́ки.]{.ru}', answer: 必要、应该}
  - {text: '[Вам мо́жно игра́ть в па́рке.]{.ru}', answer: 许可}
  - {text: '[В ко́мнате есть нельзя́.]{.ru}', answer: 禁止}
  - {text: '[Боти́нки на́до снять.]{.ru}', answer: 必要、应该}
  - {text: '[Э́тот расска́з нельзя́ поня́ть: он о́чень сло́жный.]{.ru}', answer: 不可能、做不到}
  - {text: '[В музе́е нельзя́ говори́ть по телефо́ну.]{.ru}', answer: 禁止}
  - {text: '[Здесь мо́жно сиде́ть.]{.ru}', answer: 许可}
  - {text: '[За́втра нам на́до встать в шесть часо́в.]{.ru}', answer: 必要、应该}
  - {text: '[Э́то упражне́ние нельзя́ сде́лать без словаря́.]{.ru}', answer: 不可能、做不到}
  - {text: '[Ве́чером Ми́ше нельзя́ игра́ть на компью́тере.]{.ru}', answer: 禁止}
  - {text: '[— Мо́жно помы́ть ру́ки? — Коне́чно.]{.ru}', answer: 许可}
  - {text: '[Ива́ну Серге́евичу ну́жно отдыха́ть.]{.ru}', answer: 必要、应该}
  - {text: '[На уро́к нельзя́ опа́здывать.]{.ru}', answer: 禁止}
  - {text: '[Тако́й большо́й торт нельзя́ съесть сра́зу.]{.ru}', answer: 不可能、做不到}
  why: |
    第 1、5、8、12、16 题：[на́до, ну́жно]{.ru} + 不定式表示需要、应该。
    第 3、6、11、15 题：[мо́жно]{.ru} 表示允许；单独问 [Мо́жно…?]{.ru} 是请求允许。
    第 2、7、10、14、17 题：[нельзя́]{.ru} + 未完成体不定式表示禁止：[кури́ть, есть, говори́ть, игра́ть, опа́здывать]{.ru}。
    第 4、9、13、18 题：[нельзя́]{.ru} + 完成体不定式表示做不到：[откры́ть, поня́ть, сде́лать, съесть]{.ru}。句中的“没有钥匙”“太难”“没有词典”“太大”都说明是条件不允许，不是规定不许。
- id: L54-02
  tags: [无人称句：必要、许可、禁止的时间]
  task: 写出无人称句的过去时和将来时。
  type: matrix
  cols: [现在, 过去, 将来]
  given: [0]
  rows:
  - {base: '[Мне на́до рабо́тать.]{.ru}', cells: ['[Мне на́до рабо́тать.]{.ru}', '[Мне на́до бы́ло рабо́тать.]{.ru}', '[Мне на́до бу́дет рабо́тать.]{.ru}']}
  - {base: '[Здесь мо́жно кури́ть.]{.ru}', cells: ['[Здесь мо́жно кури́ть.]{.ru}', '[Здесь мо́жно бы́ло кури́ть.]{.ru}', '[Здесь мо́жно бу́дет кури́ть.]{.ru}']}
  - {base: '[Ми́ше ну́жно сде́лать уро́ки.]{.ru}', cells: ['[Ми́ше ну́жно сде́лать уро́ки.]{.ru}', '[Ми́ше ну́жно бы́ло сде́лать уро́ки.]{.ru}', '[Ми́ше ну́жно бу́дет сде́лать уро́ки.]{.ru}']}
  - {base: '[Нам нельзя́ опа́здывать.]{.ru}', cells: ['[Нам нельзя́ опа́здывать.]{.ru}', '[Нам нельзя́ бы́ло опа́здывать.]{.ru}', '[Нам нельзя́ бу́дет опа́здывать.]{.ru}']}
  - {base: '[А́нне на́до купи́ть хлеб.]{.ru}', cells: ['[А́нне на́до купи́ть хлеб.]{.ru}', '[А́нне на́до бы́ло купи́ть хлеб.]{.ru}', '[А́нне на́до бу́дет купи́ть хлеб.]{.ru}']}
  - {base: '[Здесь нельзя́ игра́ть.]{.ru}', cells: ['[Здесь нельзя́ игра́ть.]{.ru}', '[Здесь нельзя́ бы́ло игра́ть.]{.ru}', '[Здесь нельзя́ бу́дет игра́ть.]{.ru}']}
  - {base: '[Тебе́ мо́жно отдыха́ть.]{.ru}', cells: ['[Тебе́ мо́жно отдыха́ть.]{.ru}', '[Тебе́ мо́жно бы́ло отдыха́ть.]{.ru}', '[Тебе́ мо́жно бу́дет отдыха́ть.]{.ru}']}
  - {base: '[Ива́ну Серге́евичу ну́жно рабо́тать.]{.ru}', cells: ['[Ива́ну Серге́евичу ну́жно рабо́тать.]{.ru}', '[Ива́ну Серге́евичу ну́жно бы́ло рабо́тать.]{.ru}', '[Ива́ну Серге́евичу ну́жно бу́дет рабо́тать.]{.ru}']}
  - {base: '[Вам на́до снять боти́нки.]{.ru}', cells: ['[Вам на́до снять боти́нки.]{.ru}', '[Вам на́до бы́ло снять боти́нки.]{.ru}', '[Вам на́до бу́дет снять боти́нки.]{.ru}']}
  - {base: '[Им мо́жно взять Му́рку.]{.ru}', cells: ['[Им мо́жно взять Му́рку.]{.ru}', '[Им мо́жно бы́ло взять Му́рку.]{.ru}', '[Им мо́жно бу́дет взять Му́рку.]{.ru}']}
  why: |
    第 1–10 题：无人称句没有第一格主语，过去时一律加中性 [бы́ло]{.ru}，将来时一律加 [бу́дет]{.ru}，不随第三格的人变化：[А́нне на́до бы́ло]{.ru}，不是 [А́нне на́до была́]{.ru}；第 9、10 题 [вам, им]{.ru} 后面也不用 [бу́дете, бу́дут]{.ru}。
    [бы́ло, бу́дет]{.ru} 一般放在 [на́до, ну́жно, мо́жно, нельзя́]{.ru} 后面。第 9 题 [боти́нки]{.ru}、第 10 题 [Му́рку]{.ru} 是不定式的宾语，不是主语，不影响 [бы́ло]{.ru}。
- id: L54-03
  tags: [“能”与“可以”：有人称与无人称对照]
  task: 用 [мочь]{.ru} 和 [мо́жно]{.ru} 分别说“某人可以做某事”。
  type: matrix
  cols: [人和动作, '[мочь]{.ru}（主语用第一格）', '[мо́жно]{.ru}（人用第三格）']
  given: [0]
  rows:
  - {base: '[я, взять]{.ru}', cells: ['[я, взять]{.ru}', '[я могу́ взять]{.ru}', '[мне мо́жно взять]{.ru}']}
  - {base: '[ты, игра́ть]{.ru}', cells: ['[ты, игра́ть]{.ru}', '[ты мо́жешь игра́ть]{.ru}', '[тебе́ мо́жно игра́ть]{.ru}']}
  - {base: '[он, отдыха́ть]{.ru}', cells: ['[он, отдыха́ть]{.ru}', '[он мо́жет отдыха́ть]{.ru}', '[ему́ мо́жно отдыха́ть]{.ru}']}
  - {base: '[она́, сесть]{.ru}', cells: ['[она́, сесть]{.ru}', '[она́ мо́жет сесть]{.ru}', '[ей мо́жно сесть]{.ru}']}
  - {base: '[мы, гуля́ть]{.ru}', cells: ['[мы, гуля́ть]{.ru}', '[мы мо́жем гуля́ть]{.ru}', '[нам мо́жно гуля́ть]{.ru}']}
  - {base: '[вы, помы́ть ру́ки]{.ru}', cells: ['[вы, помы́ть ру́ки]{.ru}', '[вы мо́жете помы́ть ру́ки]{.ru}', '[вам мо́жно помы́ть ру́ки]{.ru}']}
  - {base: '[они́, смотре́ть телеви́зор]{.ru}', cells: ['[они́, смотре́ть телеви́зор]{.ru}', '[они́ мо́гут смотре́ть телеви́зор]{.ru}', '[им мо́жно смотре́ть телеви́зор]{.ru}']}
  - {base: '[Ми́ша, игра́ть в футбо́л]{.ru}', cells: ['[Ми́ша, игра́ть в футбо́л]{.ru}', '[Ми́ша мо́жет игра́ть в футбо́л]{.ru}', '[Ми́ше мо́жно игра́ть в футбо́л]{.ru}']}
  - {base: '[А́нна, откры́ть окно́]{.ru}', cells: ['[А́нна, откры́ть окно́]{.ru}', '[А́нна мо́жет откры́ть окно́]{.ru}', '[А́нне мо́жно откры́ть окно́]{.ru}']}
  - {base: '[па́па, спать]{.ru}', cells: ['[па́па, спать]{.ru}', '[па́па мо́жет спать]{.ru}', '[па́пе мо́жно спать]{.ru}']}
  why: |
    第 1–10 题：[мочь]{.ru} 是有人称的动词，主语用第一格，动词按人称变：[могу́, мо́жешь, мо́жет, мо́жем, мо́жете, мо́гут]{.ru}（[г — ж]{.ru} 交替，[я]{.ru} 的形式重音在词尾）。[мо́жно]{.ru} 是无人称的，人用第三格，[мо́жно]{.ru} 本身不变。
    第 8、10 题：[Ми́ша, па́па]{.ru} 第三格是 [Ми́ше, па́пе]{.ru}。
    请求允许时两种说法都可以：[Мо́жно взять? / Я могу́ взять?]{.ru}
- id: L54-04
  tags: [禁止与不可能：后接体的选择]
  task: 根据语境选择体，写出不定式。
  type: fill
  items:
  - {stem: 'В библиоте́ке нельзя́ ___ ко́фе.', hint: пить / вы́пить, accept: [пить]}
  - {stem: 'Тако́й большо́й торт нельзя́ ___ сра́зу.', hint: есть / съесть, accept: [съесть]}
  - {stem: 'Без ключа́ дверь нельзя́ ___.', hint: открыва́ть / откры́ть, accept: [откры́ть]}
  - {stem: 'Э́ту дверь нельзя́ ___: там рабо́тает па́па.', hint: открыва́ть / откры́ть, accept: [открыва́ть]}
  - {stem: 'На уро́к нельзя́ ___.', hint: опа́здывать / опозда́ть, accept: [опа́здывать]}
  - {stem: 'Э́то сло́во нельзя́ ___: его́ нет в словаре́.', hint: понима́ть / поня́ть, accept: [поня́ть]}
  - {stem: 'В ко́мнате нельзя́ ___ хлеб.', hint: есть / съесть, accept: [есть]}
  - {stem: 'Э́то письмо́ нельзя́ ___: оно́ не ва́ше.', hint: чита́ть / прочита́ть, accept: [чита́ть]}
  - {stem: 'Э́то упражне́ние нельзя́ ___ без словаря́.', hint: де́лать / сде́лать, accept: [сде́лать]}
  - {stem: 'Ми́ша, ве́чером нельзя́ ___ телеви́зор так до́лго!', hint: смотре́ть / посмотре́ть, accept: [смотре́ть]}
  why: |
    第 1、4、5、7、8、10 题：说的是规定、不许做，[нельзя́]{.ru} 后面用未完成体：[пить, открыва́ть, опа́здывать, есть, чита́ть, смотре́ть]{.ru}。第 4 题门能开，只是不许开；第 8 题信能读，只是不该读。
    第 2、3、6、9 题：说的是条件不允许、做不到，[нельзя́]{.ru} 后面用完成体：[съесть, откры́ть, поня́ть, сде́лать]{.ru}。第 3 题和第 4 题同是开门，看语境决定体。
