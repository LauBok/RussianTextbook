heading: 第 24 课　定向运动动词与去向
groups:
- id: L24-01
  tags:
  - 运动动词现在时：идти́、е́хать
  task: 按主语写出 [идти́]{.ru} 和 [е́хать]{.ru} 的现在时。
  type: matrix
  cols:
  - 主语
  - '[идти́]{.ru}'
  - '[е́хать]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[иду́]{.ru}'
    - '[е́ду]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[идёшь]{.ru}'
    - '[е́дешь]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[идёт]{.ru}'
    - '[е́дет]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[идёт]{.ru}'
    - '[е́дет]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[идём]{.ru}'
    - '[е́дем]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[идёте]{.ru}'
    - '[е́дете]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[иду́т]{.ru}'
    - '[е́дут]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[идёт]{.ru}'
    - '[е́дет]{.ru}'
  - base: '[па́па и ма́ма]{.ru}'
    cells:
    - '[па́па и ма́ма]{.ru}'
    - '[иду́т]{.ru}'
    - '[е́дут]{.ru}'
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[иду́т]{.ru}'
    - '[е́дут]{.ru}'
  - base: '[Ка́тя и я]{.ru}'
    cells:
    - '[Ка́тя и я]{.ru}'
    - '[идём]{.ru}'
    - '[е́дем]{.ru}'
  - base: '[Ива́н Серге́евич]{.ru}'
    cells:
    - '[Ива́н Серге́евич]{.ru}'
    - '[идёт]{.ru}'
    - '[е́дет]{.ru}'
  why: '第 1–12 题：[идти́]{.ru} 的词干是 [ид-]{.ru}，词尾重读：[иду́, идёшь … иду́т]{.ru}；[е́хать]{.ru} 的词干是 [е́д-]{.ru}，重音一直在词干：[е́ду, е́дешь … е́дут]{.ru}。不要按不定式写成 *[е́хаю]{.ru}。

    第 11 题：[Ка́тя и я]{.ru} 等于 [мы]{.ru}。'
- id: L24-02
  tags:
  - 运动动词：步行与乘车
  task: 根据情景判断用步行的 [идти́]{.ru} 还是乘车的 [е́хать]{.ru}。
  type: classify
  bins:
  - '[идти́]{.ru}'
  - '[е́хать]{.ru}'
  items:
  - text: '[в шко́лу]{.ru}（学校就在家旁边）'
    answer: '[идти́]{.ru}'
  - text: '[в Пеки́н]{.ru}（坐火车回中国）'
    answer: '[е́хать]{.ru}'
  - text: '[на да́чу]{.ru}（别墅在城外六十公里）'
    answer: '[е́хать]{.ru}'
  - text: '[на ку́хню]{.ru}（从房间去厨房）'
    answer: '[идти́]{.ru}'
  - text: '[на заво́д]{.ru}（坐地铁去）'
    answer: '[е́хать]{.ru}'
  - text: '[домо́й пешко́м]{.ru}'
    answer: '[идти́]{.ru}'
  - text: '[в теа́тр]{.ru}（坐地铁要四十分钟）'
    answer: '[е́хать]{.ru}'
  - text: '[в Пари́ж]{.ru}（去另一个国家）'
    answer: '[е́хать]{.ru}'
  - text: '[в библиоте́ку]{.ru}（图书馆就在宿舍旁边）'
    answer: '[идти́]{.ru}'
  - text: '[на стадио́н]{.ru}（体育场就在附近）'
    answer: '[идти́]{.ru}'
  - text: '[в Шанха́й]{.ru}（坐火车）'
    answer: '[е́хать]{.ru}'
  - text: '[на уро́к]{.ru}（教室在二楼）'
    answer: '[идти́]{.ru}'
  - text: '[в центр]{.ru}（坐公共汽车）'
    answer: '[е́хать]{.ru}'
  - text: '[в парк]{.ru}（公园就在街对面）'
    answer: '[идти́]{.ru}'
  - text: '[в Москву́]{.ru}（坐火车）'
    answer: '[е́хать]{.ru}'
  - text: '[в аудито́рию]{.ru}（同一栋楼里）'
    answer: '[идти́]{.ru}'
  why: '第 1、4、6、9、10、12、14、16 题：目的地很近，或者明说 [пешко́м]{.ru}，用 [идти́]{.ru}。在一栋楼里走动也用 [идти́]{.ru}。

    第 2、3、5、7、8、11、13、15 题：坐地铁、公共汽车、火车，或者去别的城市、国家，用 [е́хать]{.ru}。汉语都说“去”，俄语要看是不是乘交通工具。'
- id: L24-03
  tags:
  - 处所与去向：в / на + 第六格与第四格对照
  task: 按提示的前置词写出表示处所的第六格和表示去向的第四格。
  type: matrix
  cols:
  - 第一格
  - '[где?]{.ru}'
  - '[куда́?]{.ru}'
  rows:
  - base: '[шко́ла]{.ru}'
    cells:
    - '[шко́ла]{.ru}'
    - '[в шко́ле]{.ru}'
    - '[в шко́лу]{.ru}'
    hint: '[в]{.ru}'
  - base: '[университе́т]{.ru}'
    cells:
    - '[университе́т]{.ru}'
    - '[в университе́те]{.ru}'
    - '[в университе́т]{.ru}'
    hint: '[в]{.ru}'
  - base: '[рабо́та]{.ru}'
    cells:
    - '[рабо́та]{.ru}'
    - '[на рабо́те]{.ru}'
    - '[на рабо́ту]{.ru}'
    hint: '[на]{.ru}'
  - base: '[заво́д]{.ru}'
    cells:
    - '[заво́д]{.ru}'
    - '[на заво́де]{.ru}'
    - '[на заво́д]{.ru}'
    hint: '[на]{.ru}'
  - base: '[стадио́н]{.ru}'
    cells:
    - '[стадио́н]{.ru}'
    - '[на стадио́не]{.ru}'
    - '[на стадио́н]{.ru}'
    hint: '[на]{.ru}'
  - base: '[библиоте́ка]{.ru}'
    cells:
    - '[библиоте́ка]{.ru}'
    - '[в библиоте́ке]{.ru}'
    - '[в библиоте́ку]{.ru}'
    hint: '[в]{.ru}'
  - base: '[уро́к]{.ru}'
    cells:
    - '[уро́к]{.ru}'
    - '[на уро́ке]{.ru}'
    - '[на уро́к]{.ru}'
    hint: '[на]{.ru}'
  - base: '[ку́хня]{.ru}'
    cells:
    - '[ку́хня]{.ru}'
    - '[на ку́хне]{.ru}'
    - '[на ку́хню]{.ru}'
    hint: '[на]{.ru}'
  - base: '[да́ча]{.ru}'
    cells:
    - '[да́ча]{.ru}'
    - '[на да́че]{.ru}'
    - '[на да́чу]{.ru}'
    hint: '[на]{.ru}'
  - base: '[аудито́рия]{.ru}'
    cells:
    - '[аудито́рия]{.ru}'
    - '[в аудито́рии]{.ru}'
    - '[в аудито́рию]{.ru}'
    hint: '[в]{.ru}'
  - base: '[общежи́тие]{.ru}'
    cells:
    - '[общежи́тие]{.ru}'
    - '[в общежи́тии]{.ru}'
    - '[в общежи́тие]{.ru}'
    hint: '[в]{.ru}'
  - base: '[пло́щадь]{.ru}'
    cells:
    - '[пло́щадь]{.ru}'
    - '[на пло́щади]{.ru}'
    - '[на пло́щадь]{.ru}'
    hint: f；[на]{.ru}
  - base: '[Росси́я]{.ru}'
    cells:
    - '[Росси́я]{.ru}'
    - '[в Росси́и]{.ru}'
    - '[в Росси́ю]{.ru}'
    hint: '[в]{.ru}'
  - base: '[Кремль]{.ru}'
    cells:
    - '[Кремль]{.ru}'
    - '[в Кремле́]{.ru}'
    - '[в Кремль]{.ru}'
    hint: '[в]{.ru}'
  - base: '[сад]{.ru}'
    cells:
    - '[сад]{.ru}'
    - '[в саду́]{.ru}'
    - '[в сад]{.ru}'
    hint: '[в]{.ru}；处所词尾 [у́]{.ru}'
  - base: '[по́чта]{.ru}'
    cells:
    - '[по́чта]{.ru}'
    - '[на по́чте]{.ru}'
    - '[на по́чту]{.ru}'
    hint: '[на]{.ru}'
    new: true
    gloss: 邮局
  why: '第 1–9、16 题：处所 [в / на]{.ru} + 第六格 [-е]{.ru}；去向用同一个前置词加第四格：阴性 [-у / -ю]{.ru}，阳性非动物不变：[на рабо́те → на рабо́ту]{.ru}，[на заво́де → на заво́д]{.ru}。

    第 10、11、13 题：[-ия, -ие]{.ru} 结尾的词第六格是 [-ии]{.ru}，第四格却是 [-ию]{.ru}、[-ие]{.ru}：[в аудито́рии → в аудито́рию]{.ru}，[в общежи́тии → в общежи́тие]{.ru}。

    第 12 题：[-ь]{.ru} 结尾的阴性名词第六格 [-и]{.ru}，第四格不变：[на пло́щадь]{.ru}。

    第 14 题：[Кремль]{.ru} 第六格重音落在词尾 [в Кремле́]{.ru}，第四格同第一格。

    第 15 题：处所说 [в саду́]{.ru}，去向说 [в сад]{.ru}，[-у́]{.ru} 只用于处所。'
- id: L24-04
  tags:
  - 处所与去向：句中辨别
  - 处所与去向：здесь / сюда́、там / туда́、до́ма / домо́й
  task: 句中辨别处所和去向：名词用 [в / на]{.ru} 加第六格或第四格，副词二选一。
  type: fill
  items:
  - stem: Ма́ма сейча́с ___.
    hint: рабо́та
    accept:
    - на рабо́те
  - stem: Па́па е́дет ___.
    hint: рабо́та
    accept:
    - на рабо́ту
  - stem: Студе́нты иду́т ___.
    hint: библиоте́ка
    accept:
    - в библиоте́ку
  - stem: Ве́чером мы чита́ем ___.
    hint: библиоте́ка
    accept:
    - в библиоте́ке
  - stem: Я до́ма, а А́нна ещё идёт ___.
    hint: до́ма / домо́й
    accept:
    - домо́й
  - stem: Ми́ша уже́ ___.
    hint: до́ма / домо́й
    accept:
    - до́ма
  - stem: Библиоте́ка там. Мы идём ___.
    hint: там / туда́
    accept:
    - туда́
  - stem: Ка́тя здесь. Ми́ша то́же идёт ___.
    hint: здесь / сюда́
    accept:
    - сюда́
  - stem: Ива́н Серге́евич е́дет ___.
    hint: заво́д
    accept:
    - на заво́д
  - stem: Вчера́ мы бы́ли ___.
    hint: стадио́н
    accept:
    - на стадио́не
  - stem: — Куда́ ты идёшь? — ___.
    hint: уро́к
    accept:
    - На уро́к
  - stem: Пьер е́дет ___.
    hint: Росси́я
    accept:
    - в Росси́ю
  - stem: Ю́ми живёт ___.
    hint: Япо́ния
    accept:
    - в Япо́нии
  - stem: Ве́чером мы идём ___.
    hint: теа́тр
    accept:
    - в теа́тр
  - stem: Ба́бушка живёт ___.
    hint: да́ча
    accept:
    - на да́че
  - stem: А́нна е́дет ___.
    hint: университе́т
    accept:
    - в университе́т
  why: '第 1、4、10、13、15 题：说在哪里（[быть, жить, чита́ть]{.ru} 在某处），用第六格：[на рабо́те, в библиоте́ке, в Япо́нии]{.ru}。

    第 2、3、9、11、12、14、16 题：[идти́, е́хать]{.ru} 和 [куда́]{.ru} 表示去向，用第四格：[на рабо́ту, в Росси́ю, в теа́тр]{.ru}。

    第 5–8 题：去向用 [домо́й, туда́, сюда́]{.ru}，处所用 [до́ма, там, здесь]{.ru}。第 6 题 [уже́ до́ма]{.ru} 是“已经在家”。'
