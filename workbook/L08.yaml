  why: |-
    第 1、6、11、12、17 题：[мой, твой]{.ru} 看名词的性和数：[твоя́ кни́га, твой слова́рь, твоё кре́сло, мои́ роди́тели, твои́ ключи́]{.ru}。
    第 3、4、7、10、14、16 题：[наш, ваш]{.ru} 同样看名词：[на́ше фо́то, ва́ши очки́, на́ша матрёшка, ва́ша тетра́дь, ваш дом]{.ru}。
    第 2、5、8、13、15、18 题：[его́, её, их]{.ru} 只看所属者，不看名词：[её телефо́н, его́ су́мка, их письмо́, её крова́ть]{.ru}。[су́мка]{.ru} 是阴性，“他的”仍是 [его́]{.ru}。
    第 9 题：[па́па]{.ru} 是阳性：[твой па́па]{.ru}。
- id: L08-03
  tags:
  - 物主代词与 чей：句中填空
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Вот ___ ко́мната.
    hint: я
    accept:
    - моя́
  - stem: Где ___ ключи́?
    hint: ты
    accept:
    - твои́
  - stem: Э́то ___ фо́то.
    hint: мы
    accept:
    - на́ше
  - stem: Вот ___ чемода́н.
    hint: вы
    accept:
    - ваш
  - stem: ___ э́то матрёшка?
    hint: чей
    accept:
    - Чья
  - stem: ___ э́то очки́?
    hint: чей
    accept:
    - Чьи
  - stem: А́нна до́ма. Вот ___ су́мка.
    hint: она́
    accept:
    - её
  - stem: Ми́ша и А́нна до́ма. Э́то ___ ко́мнаты.
    hint: они́
    accept:
    - их
  - stem: Па́па, где ___ телефо́н?
    hint: ты
    accept:
    - твой
  - stem: О́льга Ви́кторовна, э́то ___ су́мка?
    hint: вы
    accept:
    - ва́ша
  - stem: ___ э́то письмо́?
    hint: чей
    accept:
    - Чьё
  - stem: Где ___ слова́рь?
    hint: мы
    accept:
    - наш
  - stem: Э́то Ми́ша. Э́то ___ кре́сло.
    hint: он
    accept:
    - его́
  - stem: ___ э́то каранда́ш?
    hint: чей
    accept:
    - Чей
  - stem: Ива́н Серге́евич, вот ___ очки́.
    hint: вы
    accept:
    - ва́ши
  - stem: ___ э́то тетра́дь?
    hint: чей
    accept:
    - Чья
  why: |-
    第 1–4、12 题：[мой, твой, наш, ваш]{.ru} 和后面的名词一致：[моя́ ко́мната, твои́ ключи́, на́ше фо́то, ваш чемода́н, наш слова́рь]{.ru}。
    第 5、6、11、14、16 题：[чей]{.ru} 在句首，中间隔着 [э́то]{.ru}，仍和后面的名词一致：[Чья … матрёшка, Чьи … очки́, Чьё … письмо́, Чей … каранда́ш, Чья … тетра́дь]{.ru}（[тетра́дь]{.ru} 是阴性）。
    第 7、8、13 题：第三人称的所属者用不变的 [её, их, его́]{.ru}，和名词的性数无关：[её су́мка, их ко́мнаты, его́ кре́сло]{.ru}。
    第 9 题：对爸爸用 [ты]{.ru}，所以是 [твой телефо́н]{.ru}。
    第 10、15 题：对老师或长辈用 [вы]{.ru}，物主代词用 [ваш]{.ru}：[ва́ша су́мка, ва́ши очки́]{.ru}。
- id: L08-04
  tags:
  - 物主代词：人称代词与物主形式核查
  task: 改正词组中的错误。
  type: matrix
  cols:
  - 有错的词组
  - 正确的词组
  given:
