heading: 第 8 课　物主代词与“谁的”
groups:
- id: L08-01
  tags:
  - 物主代词：所属者 × 名词性数
  task: 按行首的所属者填表。
  type: matrix
  cols:
  - 所属者
  - '[стол]{.ru}'
  - '[ко́мната]{.ru}'
  - '[окно́]{.ru}'
  - '[очки́]{.ru}'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[мой стол]{.ru}'
    - '[моя́ ко́мната]{.ru}'
    - '[моё окно́]{.ru}'
    - '[мои́ очки́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[твой стол]{.ru}'
    - '[твоя́ ко́мната]{.ru}'
    - '[твоё окно́]{.ru}'
    - '[твои́ очки́]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[его́ стол]{.ru}'
    - '[его́ ко́мната]{.ru}'
    - '[его́ окно́]{.ru}'
    - '[его́ очки́]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[её стол]{.ru}'
    - '[её ко́мната]{.ru}'
    - '[её окно́]{.ru}'
    - '[её очки́]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[наш стол]{.ru}'
    - '[на́ша ко́мната]{.ru}'
    - '[на́ше окно́]{.ru}'
    - '[на́ши очки́]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[ваш стол]{.ru}'
    - '[ва́ша ко́мната]{.ru}'
    - '[ва́ше окно́]{.ru}'
    - '[ва́ши очки́]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[их стол]{.ru}'
    - '[их ко́мната]{.ru}'
    - '[их окно́]{.ru}'
    - '[их очки́]{.ru}'
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[чей стол]{.ru}'
    - '[чья ко́мната]{.ru}'
    - '[чьё окно́]{.ru}'
    - '[чьи очки́]{.ru}'
  why: |-
    第 1、2 题：[мой, твой]{.ru} 随名词变：阳性 [мой стол]{.ru}，阴性 [моя́ ко́мната]{.ru}，中性 [моё окно́]{.ru}，复数 [мои́ очки́]{.ru}；[твой]{.ru} 完全同一个模式。
    第 5、6 题：[наш, ваш]{.ru} 也随名词变，词尾是 [-а, -е, -и]{.ru}：[на́ша ко́мната, ва́ше окно́, ва́ши очки́]{.ru}。
    第 3、4、7 题：[его́, её, их]{.ru} 不变，四个名词前都一样：[его́ стол, его́ ко́мната, его́ окно́, его́ очки́]{.ru}。
    第 8 题：问“谁的”用 [чей]{.ru}，它和名词一致：[чей стол, чья ко́мната, чьё окно́, чьи очки́]{.ru}。
