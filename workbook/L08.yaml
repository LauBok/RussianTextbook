    hint: 她的包
  - base: '[твоя́ па́па]{.ru}'
    cells:
    - '[твоя́ па́па]{.ru}'
    - '[твой па́па]{.ru}'
  - base: '[они́ дом]{.ru}'
    cells:
    - '[они́ дом]{.ru}'
    - '[их дом]{.ru}'
    hint: 他们的房子
  - base: '[Чьё э́то кни́ги?]{.ru}'
