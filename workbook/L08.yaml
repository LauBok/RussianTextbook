    - '[Чьё э́то кни́ги?]{.ru}'
    - '[Чьи э́то кни́ги?]{.ru}'
  - base: '[наш тетра́дь]{.ru}'
    cells:
    - '[наш тетра́дь]{.ru}'
    - '[на́ша тетра́дь]{.ru}'
  - base: '[ваш окно́]{.ru}'
    cells:
    - '[ваш окно́]{.ru}'
    - '[ва́ше окно́]{.ru}'
  - base: '[ты ключи́]{.ru}'
    cells:
    - '[ты ключи́]{.ru}'
    - '[твои́ ключи́]{.ru}'
    hint: 你的钥匙
  - base: '[твоя́ кре́сло]{.ru}'
    cells:
    - '[твоя́ кре́сло]{.ru}'
    - '[твоё кре́сло]{.ru}'
  - base: '[на́ши ко́мната]{.ru}'
    cells:
    - '[на́ши ко́мната]{.ru}'
    - '[на́ша ко́мната]{.ru}'
  why: |-
    第 1、6、8、12 题：[он, она́, они́, ты]{.ru} 是“他、她、他们、你”，作主语；“……的”要用物主代词：[его́ кни́га, её су́мка, их дом, твои́ ключи́]{.ru}。
    第 2、4、5、10、11、13、14 题：物主代词和名词的性数不一致：[мой слова́рь]{.ru}（阳性），[на́ше фо́то, ва́ше окно́, твоё кре́сло]{.ru}（中性），[ва́ши очки́]{.ru}（复数），[на́ша тетра́дь, на́ша ко́мната]{.ru}（阴性）。
    第 7 题：[па́па]{.ru} 是阳性：[твой па́па]{.ru}。
    第 3、9 题：[чей]{.ru} 和名词一致：[Чей … телефо́н?]{.ru}（阳性），[Чьи … кни́ги?]{.ru}（复数）。
