    - '[исполня́ющая]{.ru}'
  - base: '[уви́деть]{.ru}｜[принц]{.ru}（第一格），他看见了她｜在前'
    cells:
    - '[уви́деть]{.ru}｜[принц]{.ru}（第一格），他看见了她｜在前'
    - '[уви́девший]{.ru}'
  - base: '[запо́лнить]{.ru}｜[зри́тели]{.ru}（第一格），他们坐满了大厅｜在前'
    cells:
    - '[запо́лнить]{.ru}｜[зри́тели]{.ru}（第一格），他们坐满了大厅｜在前'
    - '[запо́лнившие]{.ru}'
  - base: '[танцева́ть]{.ru}｜[де́вушек]{.ru}（第四格），她们在跳舞｜同时'
    cells:
    - '[танцева́ть]{.ru}｜[де́вушек]{.ru}（第四格），她们在跳舞｜同时'
    - '[танцу́ющих]{.ru}'
  - base: '[написа́ть]{.ru}｜[му́зыка]{.ru}（第一格），音乐是作曲家写的｜在前'
    cells:
    - '[написа́ть]{.ru}｜[му́зыка]{.ru}（第一格），音乐是作曲家写的｜在前'
    - '[напи́санная]{.ru}'
  why: |-
    第 1–8 题：说明主语的动作，用副动词。与谓语同时的用未完成体副动词：[дви́гаясь, каса́ясь, улыба́ясь, смотря́]{.ru}；发生在谓语以前的用完成体副动词：[подня́в, опусти́в, зако́нчив]{.ru}；[-ся]{.ru} 动词用 [-вшись]{.ru}：[верну́вшись]{.ru}。
    第 9–16 题：说明名词，用形动词，并与名词同性、数、格：[заколдо́ванная Оде́тта, заколдо́ванную Оде́тту, освещённое о́зеро, танцу́ющих де́вушек]{.ru}。
    第 9–11、16 题：名词承受动作，用被动形动词；动作在前，用完成体被动形动词过去时：[заколдо́ванная, освещённое, напи́санная]{.ru}。
    第 12、15 题：名词自己发出动作，与谓语同时，用主动形动词现在时：[исполня́ющая, танцу́ющих]{.ru}。
    第 13、14 题：名词自己发出的动作在前，用完成体主动形动词过去时：[уви́девший, запо́лнившие]{.ru}。
- id: B3-L57-02
  lessons:
  - B3-L57
  tags:
  - 形动词与副动词：描写中的运用
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Балери́на, ___ роль Оде́тты, выхо́дит на сце́ну.
    hint: исполня́ть
    accept:
    - исполня́ющая
  - stem: ___ ру́ки, похо́жие на кры́лья, она́ на мгнове́ние остана́вливается.
    hint: подня́ть
    accept:
    - Подня́в
  - stem: По сце́не, легко́ ___, бегу́т де́вушки в бе́лых пла́тьях.
    hint: дви́гаться
    accept:
    - дви́гаясь
  - stem: Принц ви́дит о́зеро, ___ луно́й.
    hint: освети́ть
    accept:
    - освещённое
  - stem: Зри́тели, ___ на спекта́кль, занима́ют свои́ места́.
    hint: прийти́
    accept:
    - прише́дшие
  - stem: ___, балери́на благодари́т зри́телей.
    hint: улыба́ться
    accept:
    - Улыба́ясь
  - stem: Мы смотре́ли на лебеде́й, ___ по о́зеру.
    hint: плыть
    accept:
    - плыву́щих
  - stem: Э́то му́зыка, ___ Чайко́вским.
    hint: написа́ть
    accept:
    - напи́санная
  - stem: ___ та́нец, де́вушки ухо́дят со сце́ны.
    hint: зако́нчить
    accept:
    - Зако́нчив
  - stem: Свет, ___ на сце́ну, стано́вится голубы́м.
    hint: па́дать
    accept:
    - па́дающий
  - stem: Мы до́лго сиде́ли в за́ле, ___ му́зыку.
    hint: слу́шать
    accept:
    - слу́шая
  - stem: ___ Оде́тту, принц влюбля́ется в неё.
    hint: уви́деть
    accept:
    - Уви́дев
  why: |-
    第 2、3、6、9、11、12 题：说明主语的动作，用副动词：同时用未完成体（[дви́гаясь, Улыба́ясь, слу́шая]{.ru}），在前用完成体（[Подня́в, Зако́нчив, Уви́дев]{.ru}）。
    第 1、7、10 题：名词自己发出、与谓语同时的动作，用主动形动词现在时，与名词一致：[исполня́ющая]{.ru}（[балери́на]{.ru}），[плыву́щих]{.ru}（[лебеде́й]{.ru}，第四格同第二格），[па́дающий]{.ru}（[свет]{.ru}）。
    第 5 题：观众先来，后入座，用完成体主动形动词过去时：[прише́дшие]{.ru}。
    第 4、8 题：名词承受动作，用完成体被动形动词过去时：[освещённое]{.ru}（[о́зеро]{.ru}，中性第四格），[напи́санная]{.ru}（[му́зыка]{.ru}）。
