    - '[Ла́нде, обуча́вшего та́нцу дете́й, пригласи́ли во дворе́ц.]{.ru}'
  - base: '[ле́беди, плыву́щая по о́зеру]{.ru}'
    cells:
    - '[ле́беди, плыву́щая по о́зеру]{.ru}'
    - '[ле́беди, плыву́щие по о́зеру]{.ru}'
  - base: '[Верну́вшись домо́й, мы до́лго говори́ли о бале́те.]{.ru}'
    cells:
    - '[Верну́вшись домо́й, мы до́лго говори́ли о бале́те.]{.ru}'
    - '[Верну́вшись домо́й, мы до́лго говори́ли о бале́те.]{.ru}'
  why: |-
    第 1、4、5、7、9、11 题：形动词要与被说明的名词同性、数、格：[заколдо́ванная]{.ru}（[Оде́тта]{.ru}），[уви́девший]{.ru}（[принц]{.ru}），[освещённое]{.ru}（[о́зеро]{.ru}），[запо́лнившие]{.ru}（[зри́тели]{.ru}），[бегу́щие]{.ru}（[де́вушки]{.ru}），[плыву́щие]{.ru}（[ле́беди]{.ru}）。
    第 2 题：[похо́жие]{.ru} 说明 [ру́ки]{.ru}，[ру́ки]{.ru} 是 [подня́в]{.ru} 的宾语，用第四格（复数第四格同第一格）：[похо́жие]{.ru}。
    第 3 题：举手在前，用完成体副动词：[Подня́в]{.ru}。
    第 8 题：微笑和跳舞同时进行，用未完成体副动词：[Улыба́ясь]{.ru}。
    第 6、10、12 题：没有错误。第 10 题 [Ла́нде]{.ru} 是 [пригласи́ли]{.ru} 的宾语，形动词用阳性第四格 [обуча́вшего]{.ru}。
