  lessons:
  - B3-L57
  tags:
  - 形动词与副动词：一致与体的常见错误
  task: 检查下列句子或短语。有错的写出改正后的形式，没有错的照抄。
  type: matrix
  cols:
  - 句子或短语
  - 改正
