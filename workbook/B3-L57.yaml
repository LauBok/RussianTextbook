    - '[улыба́ясь]{.ru}'
  - base: '[опуска́ть / опусти́ть]{.ru}｜主语的动作｜在前'
    cells:
    - '[опуска́ть / опусти́ть]{.ru}｜主语的动作｜在前'
    - '[опусти́в]{.ru}'
  - base: '[возвраща́ться / верну́ться]{.ru}｜主语的动作｜在前'
    cells:
    - '[возвраща́ться / верну́ться]{.ru}｜主语的动作｜在前'
    - '[верну́вшись]{.ru}'
  - base: '[смотре́ть]{.ru}｜主语的动作｜同时'
    cells:
    - '[смотре́ть]{.ru}｜主语的动作｜同时'
    - '[смотря́]{.ru}'
  - base: '[зака́нчивать / зако́нчить]{.ru}｜主语的动作｜在前'
    cells:
    - '[зака́нчивать / зако́нчить]{.ru}｜主语的动作｜在前'
    - '[зако́нчив]{.ru}'
  - base: '[заколдова́ть]{.ru}｜[Оде́тта]{.ru}（第一格），她被施了魔法｜在前'
