  tags:
  - 主动形动词过去时：-вш- 与 -ш-
  - 主动形动词过去时：ше́дший、ве́дший 类
  task: 写出动词的过去时阳性和主动形动词过去时（阳性第一格）。
  type: matrix
  cols:
