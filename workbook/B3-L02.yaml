  why: |-
    第 1–8 题：过去时阳性以 [-л]{.ru} 结尾，去 [-л]{.ru} 加 [-вший]{.ru}：[игра́вший, ви́девший, существова́вший, предсказа́вший]{.ru}；[-ся]{.ru} 动词后面照写 [-ся]{.ru}：[верну́вшийся, встре́тившийся]{.ru}。第 5 题重音同不定式：[нача́вший]{.ru}，不随过去时 [на́чал]{.ru}。第 6 题 [совпа́сть]{.ru} 的过去时是 [совпа́л]{.ru}，以 [-л]{.ru} 结尾，所以是 [совпа́вший]{.ru}，不能由不定式的 [-сть]{.ru} 去推。
    第 9–14 题：过去时阳性以辅音结尾（不是 [-л]{.ru}），直接加 [-ший]{.ru}，不加 [-в-]{.ru}：[привёзший, спа́сший, лёгший, поги́бший, дости́гший, засо́хший]{.ru}。[-нуть]{.ru} 动词过去时去掉 [-ну-]{.ru}（[поги́б, засо́х]{.ru}），形动词也没有 [-ну-]{.ru}。常见错误是写成 [поги́бвший]{.ru}。
    第 15–18 题：[идти́, вести́]{.ru} 及其派生词要记：[проше́дший, наше́дший]{.ru}（词干 [-шед-]{.ru}），[приве́дший, переве́дший]{.ru}（词干 [вед-]{.ru} 取自 [веду́т]{.ru}），重音都在词干上。
- id: B3-L02-02
  lessons:
  - B3-L02
  tags:
  - 主动形动词现在时与过去时对照
  - 主动形动词现在时：完成体没有
  task: 写出动词的主动形动词现在时和过去时（阳性第一格）。
  type: matrix
  cols:
  - 不定式
  - 主动形动词现在时
  - 主动形动词过去时
  given:
  - 0
  rows:
  - base: '[чита́ть]{.ru}'
    cells:
    - '[чита́ть]{.ru}'
    - '[чита́ющий]{.ru}'
    - '[чита́вший]{.ru}'
  - base: '[прочита́ть]{.ru}'
    cells:
    - '[прочита́ть]{.ru}'
    - —
    - '[прочита́вший]{.ru}'
  - base: '[стро́ить]{.ru}'
    cells:
    - '[стро́ить]{.ru}'
    - '[стро́ящий]{.ru}'
    - '[стро́ивший]{.ru}'
  - base: '[постро́ить]{.ru}'
    cells:
    - '[постро́ить]{.ru}'
    - —
    - '[постро́ивший]{.ru}'
  - base: '[нести́]{.ru}'
    cells:
    - '[нести́]{.ru}'
    - '[несу́щий]{.ru}'
    - '[нёсший]{.ru}'
  - base: '[унести́]{.ru}'
    cells:
    - '[унести́]{.ru}'
    - —
    - '[унёсший]{.ru}'
    new: true
    gloss: 拿走，带走
  - base: '[идти́]{.ru}'
    cells:
    - '[идти́]{.ru}'
    - '[иду́щий]{.ru}'
    - '[ше́дший]{.ru}'
  - base: '[уйти́]{.ru}'
    cells:
    - '[уйти́]{.ru}'
    - —
    - '[уше́дший]{.ru}'
  - base: '[боя́ться]{.ru}'
    cells:
    - '[боя́ться]{.ru}'
    - '[боя́щийся]{.ru}'
    - '[боя́вшийся]{.ru}'
  - base: '[сади́ться]{.ru}'
    cells:
    - '[сади́ться]{.ru}'
    - '[садя́щийся]{.ru}'
    - '[сади́вшийся]{.ru}'
  - base: '[сесть]{.ru}'
    cells:
    - '[сесть]{.ru}'
    - —
    - '[се́вший]{.ru}'
  - base: '[вести́]{.ru}'
    cells:
    - '[вести́]{.ru}'
    - '[веду́щий]{.ru}'
    - '[ве́дший]{.ru}'
  - base: '[расти́]{.ru}'
    cells:
    - '[расти́]{.ru}'
    - '[расту́щий]{.ru}'
    - '[ро́сший]{.ru}'
  - base: '[ложи́ться]{.ru}'
    cells:
    - '[ложи́ться]{.ru}'
    - '[ложа́щийся]{.ru}'
    - '[ложи́вшийся]{.ru}'
  why: |-
    第 1、3、5、7、9、10、12–14 题：未完成体两种形动词都有。现在时由复数第三人称构成：[чита́ют → чита́ющий]{.ru}，[стро́ят → стро́ящий]{.ru}，[боя́тся → боя́щийся]{.ru}，[ложа́тся → ложа́щийся]{.ru}；过去时由过去时词干构成：[чита́л → чита́вший]{.ru}，[стро́ил → стро́ивший]{.ru}。
    第 2、4、6、8、11 题：完成体没有现在时形动词，只有过去时：[прочита́вший, постро́ивший, унёсший, уше́дший, се́вший]{.ru}。
    第 5–8、12、13 题：词干以辅音结尾的动词，现在时形动词看复数第三人称（[несу́т, иду́т, веду́т, расту́т]{.ru}），过去时形动词看阳性过去时：[нёс → нёсший]{.ru}，[рос → ро́сший]{.ru}；[идти́, вести́]{.ru} 是特殊形式 [ше́дший, ве́дший]{.ru}。
    第 10、11 题：[сади́ться]{.ru} 是未完成体：[садя́щийся, сади́вшийся]{.ru}；[сесть]{.ru} 是完成体，过去时 [сел]{.ru} 按规则得 [се́вший]{.ru}。
- id: B3-L02-03
  lessons:
