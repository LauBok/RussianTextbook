    - '[о соба́ке, спа́вшем у две́ри]{.ru}'
    - '[спа́вшей]{.ru}'
  - base: '[студе́нты, сдава́вшие экза́мены всю неде́лю]{.ru}'
    cells:
    - '[студе́нты, сдава́вшие экза́мены всю неде́лю]{.ru}'
    - '[сдава́вшие]{.ru}'
  - base: '[о жене́, привы́кшей к се́веру]{.ru}'
    cells:
    - '[о жене́, привы́кшей к се́веру]{.ru}'
    - '[привы́кшей]{.ru}'
  - base: '[о́зеро, замёрзвшее зимо́й]{.ru}'
    cells:
    - '[о́зеро, замёрзвшее зимо́й]{.ru}'
    - '[замёрзшее]{.ru}'
  - base: '[с подру́гой, уе́хавшим в Ки́ев]{.ru}'
    cells:
    - '[с подру́гой, уе́хавшим в Ки́ев]{.ru}'
    - '[уе́хавшей]{.ru}'
  - base: '[де́вочка, принёсшая цветы́]{.ru}'
    cells:
    - '[де́вочка, принёсшая цветы́]{.ru}'
    - '[принёсшая]{.ru}'
  - base: '[челове́к, иду́вший по у́лице]{.ru}'
    cells:
    - '[челове́к, иду́вший по у́лице]{.ru}'
    - '[ше́дший]{.ru}'
  - base: '[лю́ди, по́мнившие войну́]{.ru}'
    cells:
    - '[лю́ди, по́мнившие войну́]{.ru}'
    - '[по́мнившие]{.ru}'
  why: |-
    第 1、6、10 题：过去时阳性 [вы́рос, помо́г, замёрз]{.ru} 不以 [-л]{.ru} 结尾，只加 [-ш-]{.ru}，不加 [-в-]{.ru}：[вы́росший, помо́гший, замёрзшее]{.ru}。
    第 3、13 题：[идти́]{.ru} 类的形动词要记：[вы́шедший]{.ru}（不能由将来时 [вы́йду]{.ru} 构成），[ше́дший]{.ru}（不能由现在时 [иду́]{.ru} 构成）。
    第 5 题：形动词由过去时词干构成，不由将来时 [умру́]{.ru} 构成；重音特殊：[уме́рший]{.ru}。
    第 4、7、11 题：形动词与被说明的名词一致：[мать]{.ru} 是阴性第一格 → [верну́вшаяся]{.ru}；[о соба́ке]{.ru} 阴性第六格 → [спа́вшей]{.ru}；[с подру́гой]{.ru} 阴性第五格 → [уе́хавшей]{.ru}。
    第 2、8、9、12、14 题：原文正确，照抄。第 8 题未完成体 [сдава́вшие]{.ru} 表示整整一周的过程，可以用。
- id: B3-L02-04
  lessons:
  - B3-L02
  tags:
  - 主动形动词过去时：句中填空
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Я ещё не ви́дел дру́га, ___ вчера́ из Пеки́на.
    hint: прилете́ть
    accept:
    - прилете́вшего
  - stem: Мы поблагодари́ли люде́й, ___ нам найти́ доро́гу.
    hint: помо́чь
    accept:
    - помо́гших
  - stem: В музе́е есть портре́т учёного, ___ в XVIII ве́ке.
    hint: жить
    accept:
    - жи́вшего
  - stem: Студе́нты, ___ на ле́кцию ра́ньше всех, се́ли в пе́рвом ряду́.
    hint: прийти́
    accept:
    - прише́дшие
  - stem: Врач подбежа́л к челове́ку, ___ на у́лице.
    hint: упа́сть
    accept:
    - упа́вшему
  - stem: Ба́бушка ча́сто расска́зывает о бра́те, ___ на войне́.
    hint: поги́бнуть
    accept:
    - поги́бшем
    new: true
    gloss: 牺牲
  - stem: Учи́тель похвали́л ученика́, ___ тру́дную зада́чу.
    hint: реши́ть
    accept:
    - реши́вшего
  - stem: Я хорошо́ по́мню де́вушку, ___ нас в го́сти.
    hint: пригласи́ть
    accept:
    - пригласи́вшую
  - stem: Мы познако́мились с сосе́дкой, ___ сюда́ из Сиби́ри.
    hint: перее́хать
    accept:
    - перее́хавшей
  - stem: Вчера́ я встре́тил друзе́й, ___ со мной в шко́ле.
    hint: учи́ться
    accept:
    - учи́вшихся
  - stem: Под де́ревом сиде́л ма́льчик, ___ свою́ соба́ку.
    hint: потеря́ть
    accept:
    - потеря́вший
  - stem: Ма́ма вы́бросила цветы́, ___ за неде́лю.
    hint: засо́хнуть
    accept:
    - засо́хшие
    new: true
    gloss: 枯萎
  why: |-
    第 1、2、4–9、11、12 题：完成体动词只有过去时形动词，表示已经完成的动作：[прилете́вшего, помо́гших, прише́дшие, упа́вшему, поги́бшем, реши́вшего, пригласи́вшую, перее́хавшей, потеря́вший, засо́хшие]{.ru}。[помо́г, поги́б, засо́х]{.ru} 以辅音结尾，只加 [-ш-]{.ru}；[прийти́]{.ru} 的形动词是 [прише́дший]{.ru}；[упа́сть]{.ru} 的过去时是 [упа́л]{.ru}，所以是 [упа́вший]{.ru}。
    第 3、10 题：未完成体，动作在过去（[в XVIII ве́ке]{.ru}，同学们当年在学校），用过去时形动词：[жи́вшего, учи́вшихся]{.ru}；说“现在住在……的”才用 [живу́щего]{.ru}。
    各题的格看被说明的名词：第 1、7 题动物名词第四格同第二格；第 5 题 [к челове́ку]{.ru} 第三格；第 6 题 [о бра́те]{.ru} 第六格；第 8 题 [де́вушку]{.ru} 第四格；第 9 题 [с сосе́дкой]{.ru} 第五格。
