heading: 第 44 课　体对的构成与特殊变位
groups:
- id: L44-01
  tags: [体对：构成方式]
  task: 按构成方式把体对归类，填写序号。
  type: classify
  bins: [加前缀, 换后缀, 异根]
  items:
  - {text: '[чита́ть — прочита́ть]{.ru}', answer: 加前缀}
  - {text: '[расска́зывать — рассказа́ть]{.ru}', answer: 换后缀}
  - {text: '[говори́ть — сказа́ть]{.ru}', answer: 异根}
  - {text: '[писа́ть — написа́ть]{.ru}', answer: 加前缀}
  - {text: '[покупа́ть — купи́ть]{.ru}', answer: 换后缀}
  - {text: '[де́лать — сде́лать]{.ru}', answer: 加前缀}
  - {text: '[брать — взять]{.ru}', answer: 异根}
  - {text: '[пока́зывать — показа́ть]{.ru}', answer: 换后缀}
  - {text: '[ви́деть — уви́деть]{.ru}', answer: 加前缀}
  - {text: '[спра́шивать — спроси́ть]{.ru}', answer: 换后缀}
  - {text: '[гото́вить — пригото́вить]{.ru}', answer: 加前缀}
  - {text: '[дава́ть — дать]{.ru}', answer: 换后缀}
  - {text: '[учи́ть — вы́учить]{.ru}', answer: 加前缀}
  - {text: '[опа́здывать — опозда́ть]{.ru}', answer: 换后缀}
  - {text: '[смотре́ть — посмотре́ть]{.ru}', answer: 加前缀}
  - {text: '[реша́ть — реши́ть]{.ru}', answer: 换后缀, new: true, gloss: 解决}
  - {text: '[класть — положи́ть]{.ru}', answer: 异根, new: true, gloss: 放（平放）}
  - {text: '[звони́ть — позвони́ть]{.ru}', answer: 加前缀, new: true, gloss: 打电话}
  - {text: '[получа́ть — получи́ть]{.ru}', answer: 换后缀, new: true, gloss: 收到}
  - {text: '[стро́ить — постро́ить]{.ru}', answer: 加前缀, new: true, gloss: 建造}
  - {text: '[закрыва́ть — закры́ть]{.ru}', answer: 换后缀, new: true, gloss: 关上（完成体）}
  why: |
    第 1、4、6、9、11、13、15、18、20 题：完成体只比未完成体多一个前缀，其余部分完全相同：[про-, на-, с-, у-, при-, вы-, по-]{.ru}。前缀不止一个，要随词记。
    第 2、5、8、10、12、14、16、19、21 题：词根相同，后缀不同，后缀长的一般是未完成体：[-ыва- / -ива-]{.ru}（[расска́зывать, пока́зывать, опа́здывать, спра́шивать]{.ru}）、[-а-]{.ru} 对 [-и-]{.ru}（[покупа́ть — купи́ть, реша́ть — реши́ть, получа́ть — получи́ть]{.ru}）、[-ва-]{.ru}（[дава́ть — дать, закрыва́ть — закры́ть]{.ru}）。第 10 题词根里还有 [ш — с]{.ru} 的交替，但仍属于换后缀。
    第 3、7、17 题：两个词词根完全不同，只能成对记住。
- id: L44-02
  tags: [完成体将来时：特殊变位]
  task: 写出动词将来时的六个人称形式。
  type: matrix
  cols: [不定式, '[я]{.ru}', '[ты]{.ru}', '[он / она́]{.ru}', '[мы]{.ru}', '[вы]{.ru}', '[они́]{.ru}']
  given: [0]
  rows:
  - {base: '[сказа́ть]{.ru}', cells: ['[сказа́ть]{.ru}', '[скажу́]{.ru}', '[ска́жешь]{.ru}', '[ска́жет]{.ru}', '[ска́жем]{.ru}', '[ска́жете]{.ru}', '[ска́жут]{.ru}']}
  - {base: '[рассказа́ть]{.ru}', cells: ['[рассказа́ть]{.ru}', '[расскажу́]{.ru}', '[расска́жешь]{.ru}', '[расска́жет]{.ru}', '[расска́жем]{.ru}', '[расска́жете]{.ru}', '[расска́жут]{.ru}']}
  - {base: '[показа́ть]{.ru}', cells: ['[показа́ть]{.ru}', '[покажу́]{.ru}', '[пока́жешь]{.ru}', '[пока́жет]{.ru}', '[пока́жем]{.ru}', '[пока́жете]{.ru}', '[пока́жут]{.ru}']}
  - {base: '[взять]{.ru}', cells: ['[взять]{.ru}', '[возьму́]{.ru}', '[возьмёшь]{.ru}', '[возьмёт]{.ru}', '[возьмём]{.ru}', '[возьмёте]{.ru}', '[возьму́т]{.ru}']}
  - {base: '[дать]{.ru}', cells: ['[дать]{.ru}', '[дам]{.ru}', '[дашь]{.ru}', '[даст]{.ru}', '[дади́м]{.ru}', '[дади́те]{.ru}', '[даду́т]{.ru}']}
  - {base: '[встать]{.ru}', cells: ['[встать]{.ru}', '[вста́ну]{.ru}', '[вста́нешь]{.ru}', '[вста́нет]{.ru}', '[вста́нем]{.ru}', '[вста́нете]{.ru}', '[вста́нут]{.ru}']}
  - {base: '[поня́ть]{.ru}', cells: ['[поня́ть]{.ru}', '[пойму́]{.ru}', '[поймёшь]{.ru}', '[поймёт]{.ru}', '[поймём]{.ru}', '[поймёте]{.ru}', '[пойму́т]{.ru}']}
  - {base: '[купи́ть]{.ru}', cells: ['[купи́ть]{.ru}', '[куплю́]{.ru}', '[ку́пишь]{.ru}', '[ку́пит]{.ru}', '[ку́пим]{.ru}', '[ку́пите]{.ru}', '[ку́пят]{.ru}']}
  - {base: '[спроси́ть]{.ru}', cells: ['[спроси́ть]{.ru}', '[спрошу́]{.ru}', '[спро́сишь]{.ru}', '[спро́сит]{.ru}', '[спро́сим]{.ru}', '[спро́сите]{.ru}', '[спро́сят]{.ru}']}
  - {base: '[поста́вить]{.ru}', cells: ['[поста́вить]{.ru}', '[поста́влю]{.ru}', '[поста́вишь]{.ru}', '[поста́вит]{.ru}', '[поста́вим]{.ru}', '[поста́вите]{.ru}', '[поста́вят]{.ru}']}
  - {base: '[опозда́ть]{.ru}', cells: ['[опозда́ть]{.ru}', '[опозда́ю]{.ru}', '[опозда́ешь]{.ru}', '[опозда́ет]{.ru}', '[опозда́ем]{.ru}', '[опозда́ете]{.ru}', '[опозда́ют]{.ru}']}
  - {base: '[вы́учить]{.ru}', cells: ['[вы́учить]{.ru}', '[вы́учу]{.ru}', '[вы́учишь]{.ru}', '[вы́учит]{.ru}', '[вы́учим]{.ru}', '[вы́учите]{.ru}', '[вы́учат]{.ru}']}
  why: |
    第 1–3 题：[-каза́ть]{.ru} 的动词所有人称都是 [з → ж]{.ru}，重音只在 [я]{.ru} 的形式上落在词尾：[скажу́, ска́жешь … ска́жут]{.ru}。
    第 4、7 题：词干完全变了，要整个记住：[взять → возьм-]{.ru}，[поня́ть → пойм-]{.ru}；重音都在词尾，[ё]{.ru} 一定写出。
    第 5 题：[дать]{.ru} 是不规则变位，单数 [дам, дашь, даст]{.ru}，复数 [дади́м, дади́те, даду́т]{.ru}，要整体记。
    第 6 题：[встать]{.ru} 的词干是 [вста́н-]{.ru}，按第一变位变，重音不动。
    第 8–10 题：第二变位，交替只在 [я]{.ru}：[куплю́]{.ru}（[п → пл]{.ru}）、[спрошу́]{.ru}（[с → ш]{.ru}）、[поста́влю]{.ru}（[в → вл]{.ru}）；[купи́ть, спроси́ть]{.ru} 从 [ты]{.ru} 起重音移到词干：[ку́пишь, спро́сишь]{.ru}。
    第 11 题：规则的第一变位：[опозда́ю, опозда́ешь]{.ru}。第 12 题：[ч]{.ru} 后面写 [-у, -ат]{.ru}：[вы́учу, вы́учат]{.ru}，重音始终在 [вы́-]{.ru}。
- id: L44-03
  tags: [体对：补全体对与词干变化]
  task: 写出配对的完成体及其 [я]{.ru}、[ты]{.ru} 的形式。
  type: matrix
  cols: [未完成体, 完成体, '完成体（[я]{.ru}）', '完成体（[ты]{.ru}）']
  given: [0]
  rows:
  - {base: '[расска́зывать]{.ru}', cells: ['[расска́зывать]{.ru}', '[рассказа́ть]{.ru}', '[расскажу́]{.ru}', '[расска́жешь]{.ru}']}
  - {base: '[пока́зывать]{.ru}', cells: ['[пока́зывать]{.ru}', '[показа́ть]{.ru}', '[покажу́]{.ru}', '[пока́жешь]{.ru}']}
  - {base: '[опа́здывать]{.ru}', cells: ['[опа́здывать]{.ru}', '[опозда́ть]{.ru}', '[опозда́ю]{.ru}', '[опозда́ешь]{.ru}']}
  - {base: '[спра́шивать]{.ru}', cells: ['[спра́шивать]{.ru}', '[спроси́ть]{.ru}', '[спрошу́]{.ru}', '[спро́сишь]{.ru}']}
  - {base: '[покупа́ть]{.ru}', cells: ['[покупа́ть]{.ru}', '[купи́ть]{.ru}', '[куплю́]{.ru}', '[ку́пишь]{.ru}']}
  - {base: '[дава́ть]{.ru}', cells: ['[дава́ть]{.ru}', '[дать]{.ru}', '[дам]{.ru}', '[дашь]{.ru}']}
  - {base: '[говори́ть]{.ru}', cells: ['[говори́ть]{.ru}', '[сказа́ть]{.ru}', '[скажу́]{.ru}', '[ска́жешь]{.ru}']}
  - {base: '[брать]{.ru}', cells: ['[брать]{.ru}', '[взять]{.ru}', '[возьму́]{.ru}', '[возьмёшь]{.ru}']}
  - {base: '[учи́ть]{.ru}', cells: ['[учи́ть]{.ru}', '[вы́учить]{.ru}', '[вы́учу]{.ru}', '[вы́учишь]{.ru}']}
  - {base: '[гото́вить]{.ru}', cells: ['[гото́вить]{.ru}', '[пригото́вить]{.ru}', '[пригото́влю]{.ru}', '[пригото́вишь]{.ru}']}
  - {base: '[ви́деть]{.ru}', cells: ['[ви́деть]{.ru}', '[уви́деть]{.ru}', '[уви́жу]{.ru}', '[уви́дишь]{.ru}']}
  - {base: '[писа́ть]{.ru}', cells: ['[писа́ть]{.ru}', '[написа́ть]{.ru}', '[напишу́]{.ru}', '[напи́шешь]{.ru}']}
  - {base: '[смотре́ть]{.ru}', cells: ['[смотре́ть]{.ru}', '[посмотре́ть]{.ru}', '[посмотрю́]{.ru}', '[посмо́тришь]{.ru}']}
  - {base: '[де́лать]{.ru}', cells: ['[де́лать]{.ru}', '[сде́лать]{.ru}', '[сде́лаю]{.ru}', '[сде́лаешь]{.ru}']}
  why: |
    第 1–6 题：换后缀构成的体对。完成体去掉 [-ыва- / -ива- / -а- / -ва-]{.ru}：[рассказа́ть, показа́ть, опозда́ть, спроси́ть, купи́ть, дать]{.ru}。注意第 3 题 [опа́здывать — опозда́ть]{.ru} 词根元音 [а — о]{.ru} 不同，第 4 题 [спра́шивать — спроси́ть]{.ru} 辅音 [ш — с]{.ru} 不同。
    第 7、8 题：异根体对，完成体的变位也要单独记：[скажу́, ска́жешь; возьму́, возьмёшь]{.ru}。
    第 9–14 题：加前缀构成的体对，变位与未完成体相同，只多一个前缀：[уви́жу, пригото́влю, напишу́, посмотрю́]{.ru} 里的交替和重音都和 [ви́жу, гото́влю, пишу́, смотрю́]{.ru} 一样。第 9 题前缀 [вы-]{.ru} 带重音：[вы́учу]{.ru}。
- id: L44-04
  tags: [完成体：过去时重音]
  task: 写出动词的过去时形式。
  type: matrix
  cols: [不定式, '[он]{.ru}', '[она́]{.ru}', '[они́]{.ru}']
  given: [0]
  rows:
  - {base: '[взять]{.ru}', cells: ['[взять]{.ru}', '[взял]{.ru}', '[взяла́]{.ru}', '[взя́ли]{.ru}']}
  - {base: '[поня́ть]{.ru}', cells: ['[поня́ть]{.ru}', '[по́нял]{.ru}', '[поняла́]{.ru}', '[по́няли]{.ru}']}
  - {base: '[дать]{.ru}', cells: ['[дать]{.ru}', '[дал]{.ru}', '[дала́]{.ru}', '[да́ли]{.ru}']}
  - {base: '[встать]{.ru}', cells: ['[встать]{.ru}', '[встал]{.ru}', '[вста́ла]{.ru}', '[вста́ли]{.ru}']}
  - {base: '[сказа́ть]{.ru}', cells: ['[сказа́ть]{.ru}', '[сказа́л]{.ru}', '[сказа́ла]{.ru}', '[сказа́ли]{.ru}']}
  - {base: '[купи́ть]{.ru}', cells: ['[купи́ть]{.ru}', '[купи́л]{.ru}', '[купи́ла]{.ru}', '[купи́ли]{.ru}']}
  - {base: '[спроси́ть]{.ru}', cells: ['[спроси́ть]{.ru}', '[спроси́л]{.ru}', '[спроси́ла]{.ru}', '[спроси́ли]{.ru}']}
  - {base: '[опозда́ть]{.ru}', cells: ['[опозда́ть]{.ru}', '[опозда́л]{.ru}', '[опозда́ла]{.ru}', '[опозда́ли]{.ru}']}
  - {base: '[рассказа́ть]{.ru}', cells: ['[рассказа́ть]{.ru}', '[рассказа́л]{.ru}', '[рассказа́ла]{.ru}', '[рассказа́ли]{.ru}']}
  - {base: '[показа́ть]{.ru}', cells: ['[показа́ть]{.ru}', '[показа́л]{.ru}', '[показа́ла]{.ru}', '[показа́ли]{.ru}']}
  - {base: '[поста́вить]{.ru}', cells: ['[поста́вить]{.ru}', '[поста́вил]{.ru}', '[поста́вила]{.ru}', '[поста́вили]{.ru}']}
  - {base: '[вы́учить]{.ru}', cells: ['[вы́учить]{.ru}', '[вы́учил]{.ru}', '[вы́учила]{.ru}', '[вы́учили]{.ru}']}
  why: |
    第 1–3 题：重音会移动，要特别记：阴性重音在词尾 [взяла́, поняла́, дала́]{.ru}；[поня́ть]{.ru} 的阳性和复数重音移到前缀 [по́нял, по́няли]{.ru}；[дать]{.ru} 的复数是 [да́ли]{.ru}。
    第 4 题：[встать]{.ru} 将来时是 [вста́ну]{.ru}，过去时仍从不定式构成：[встал, вста́ла, вста́ли]{.ru}，重音不动。
    第 5–12 题：过去时从不定式构成，重音和不定式一致，不随将来时移动：[ска́жешь]{.ru} 但 [сказа́л]{.ru}，[ку́пишь]{.ru} 但 [купи́л]{.ru}，[спро́сишь]{.ru} 但 [спроси́л]{.ru}。
- id: L44-05
  tags: [完成体：特殊变位句中填空]
  task: 用括号里动词的适当形式填空。
  type: fill
  items:
  - {stem: 'За́втра я ___ в семь часо́в.', hint: встать, accept: [вста́ну]}
  - {stem: 'Вчера́ А́нна ___ в шесть часо́в.', hint: встать, accept: [вста́ла]}
  - {stem: 'За́втра мы ___ на́ши фо́то.', hint: показа́ть, accept: [пока́жем]}
  - {stem: 'Ми́ша, ты за́втра ___ слова́рь?', hint: дать, accept: [дашь]}
  - {stem: 'Вчера́ ма́ма ___ хлеб.', hint: взять, accept: [взяла́]}
  - {stem: 'Я не ___, что он сказа́л.', hint: поня́ть, accept: [по́нял, поняла́]}
  - {stem: 'Ю́ми сра́зу ___ э́то сло́во.', hint: поня́ть, accept: [поняла́]}
  - {stem: 'Вы ___ э́ту кни́гу?', hint: взять, accept: [возьмёте, взя́ли]}
  - {stem: 'Студе́нты ___ кни́ги в библиоте́ке.', hint: взять, accept: [взя́ли, возьму́т]}
  - {stem: 'За́втра экскурсово́д ___ о ла́вре.', hint: рассказа́ть, accept: [расска́жет]}
  - {stem: 'За́втра я ___ торт в бу́лочной.', hint: купи́ть, accept: [куплю́]}
  - {stem: 'Ско́ро они́ ___ но́вые слова́.', hint: вы́учить, accept: [вы́учат]}
  - {stem: 'Вчера́ Ван Лэй ___ на уро́к.', hint: опозда́ть, accept: [опозда́л]}
  - {stem: 'Я сейча́с ___ О́льгу Ви́кторовну.', hint: спроси́ть, accept: [спрошу́]}
  - {stem: 'Вчера́ па́па ___ но́вый телефо́н.', hint: купи́ть, accept: [купи́л]}
  - {stem: 'Что вы ___? Я не по́нял.', hint: сказа́ть, accept: [сказа́ли]}
  why: |
    第 1、3、4、10、11、12、14 题：[за́втра, ско́ро]{.ru} 和“这就问”说的是将来，完成体变位：[вста́ну, пока́жем, дашь, расска́жет, куплю́, вы́учат, спрошу́]{.ru}。注意交替 [з → ж]{.ru}、[п → пл]{.ru}、[с → ш]{.ru}。
    第 2、5、7、13、15、16 题：已经发生的事用过去时，按主语性数变：[вста́ла, взяла́, поняла́, опозда́л, купи́л, сказа́ли]{.ru}；[взяла́, поняла́]{.ru} 阴性重音在词尾。
    第 6 题：说话人性别不明，[по́нял]{.ru}（男）和 [поняла́]{.ru}（女）都对；阳性重音在前缀 [по́-]{.ru}。
    第 8、9 题：句中没有时间词，将来时和过去时都说得通：[возьмёте / взя́ли]{.ru}，[взя́ли / возьму́т]{.ru}。
