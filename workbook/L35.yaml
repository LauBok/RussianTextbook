  why: '第 1–16 题：1 后面用单数第一格，[оди́н / одна́ / одно́]{.ru} 跟名词的性一致；2 后面用单数第二格。

    第 1、3、6、8、11、13 题：阳性 [оди́н, два]{.ru}；[де́душка, дя́дя]{.ru} 按词尾变格，但是阳性，所以说 [два де́душки, два дя́ди]{.ru}。

    第 4、9、16 题：中性 [одно́, два]{.ru}：[два окна́, два мо́ря]{.ru}。

    第 2、5、7、10、12、14、15 题：阴性 [одна́, две]{.ru}：[две сестры́, две кни́ги, две тетра́ди]{.ru}。'
