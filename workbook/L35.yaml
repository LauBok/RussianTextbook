    第 1、3、6、7、9、10、12、15、17 题：2–4 后面用单数第二格：[три бра́та, четы́ре ко́мнаты, три челове́ка]{.ru}。第 6 题 [дочь]{.ru} 第二格是 [до́чери]{.ru}，“二”用阴性 [две]{.ru}。第 17 题 [доски́]{.ru} 重音在词尾。

    第 2、4、8、11、14、16 题：5–20 后面用复数第二格，本册只用 [челове́к, часо́в]{.ru}：[пятна́дцать челове́к]{.ru}；[челове́к]{.ru} 的复数第二格和第一格同形。'
- id: L35-04
  tags:
  - 数词与名词连用：челове́к 的三种形式
  task: 数词后面的 [челове́к]{.ru} 用哪个形式？归入相应一栏。
  type: classify
  bins:
  - '[челове́к]{.ru}'
  - '[челове́ка]{.ru}'
  items:
  - text: '[оди́н]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[два]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[пять]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[четы́ре]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[оди́ннадцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[три]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[двена́дцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[семна́дцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[два́дцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[четы́рнадцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[шесть]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[трина́дцать]{.ru}'
    answer: '[челове́к]{.ru}'
  why: '第 1 题：1 后面是单数第一格 [челове́к]{.ru}。

    第 2、4、6 题：2–4 后面是单数第二格 [челове́ка]{.ru}。

    第 3、5、7–12 题：5–20 后面是复数第二格，形式也是 [челове́к]{.ru}。第 5、7、10、12 题 [оди́ннадцать, двена́дцать, четы́рнадцать, трина́дцать]{.ru} 是独立的数词，不按“一、二、三、四”处理。'
- id: L35-05
  tags:
  - 数词与名词连用：句中
  task: 把括号里的数字和名词写成俄语。
  type: fill
  items:
  - stem: У меня́ ___.
    hint: 2 брат
    accept:
    - два бра́та
  - stem: У А́нны ___.
    hint: 1 сестра́
    accept:
    - одна́ сестра́
  - stem: У О́льги Ви́кторовны ___.
    hint: 1 дочь
    accept:
    - одна́ дочь
  - stem: У де́душки ___.
    hint: 3 сын
    accept:
    - три сы́на
  - stem: — Ско́лько вас в семье́? — Нас ___.
    hint: 4 челове́к
    accept:
    - четы́ре челове́ка
  - stem: В на́шей гру́ппе ___.
    hint: 15 челове́к
    accept:
    - пятна́дцать челове́к
  - stem: У Ми́ши ___.
    hint: 2 тётя
    accept:
    - две тёти
  - stem: У ба́бушки ___.
    hint: 2 соба́ка
    accept:
    - две соба́ки
  - stem: В кварти́ре ___.
    hint: 3 ко́мната
    accept:
    - три ко́мнаты
  - stem: Мы рабо́таем ___.
    hint: 8 час
    accept:
    - во́семь часо́в
  - stem: В ко́мнате ___.
    hint: 2 окно́
    accept:
    - два окна́
  - stem: У Пье́ра ___.
    hint: 2 дя́дя
    accept:
    - два дя́ди
  why: '第 2、3 题：1 后用单数第一格，[одна́]{.ru} 和阴性名词一致。

    第 1、4、5、7–9、11、12 题：2–4 后用单数第二格；阴性用 [две]{.ru}：[две тёти, две соба́ки]{.ru}；第 12 题 [дя́дя]{.ru} 是阳性，用 [два]{.ru}。

    第 6、10 题：5 以上用复数第二格 [челове́к, часо́в]{.ru}。

    第 1–12 题：有数词时 [есть]{.ru} 一般省去。'
