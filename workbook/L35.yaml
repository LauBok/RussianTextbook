  why: '第 1–7 题：个位数加 [-на́дцать]{.ru}，重音都在 [-на́-]{.ru} 上，只有 [четы́рнадцать]{.ru} 重音在 [ы́]{.ru}。[пять … де́вять]{.ru} 先去掉 [-ь]{.ru}：[пятна́дцать, девятна́дцать]{.ru}；[во́семь]{.ru} 去掉 [-ь]{.ru} 后元音照写：[восемна́дцать]{.ru}。

    第 8 题：[два́дцать]{.ru} 是“两个十”，[-дцать]{.ru} 前面没有 [на]{.ru}。

    第 9、10 题：[оди́ннадцать]{.ru} 两个 [н]{.ru}；[двена́дцать]{.ru} 来自 [две]{.ru}。'
