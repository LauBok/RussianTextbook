    第 6 题：[не на́до]{.ru} + 未完成体：[звони́ть]{.ru}。
    第 7 题：主语不同，不能用副动词，改成从句。
    第 9 题：坏结果用 [из-за́]{.ru} + 第二格。
    第 10 题：港口里是“禁止”游泳，[нельзя́]{.ru} + 未完成体：[купа́ться]{.ru}；[нельзя́ искупа́ться]{.ru} 是“没法游”。
    第 11 题：不定人称句的谓语用复数：[арестова́ли]{.ru}。
    第 8、12 题：原文正确，照抄。
