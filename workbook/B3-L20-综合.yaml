  why: |-
    第 1、3、5、7、9、11 题：未完成体有现在时和过去时两种主动形动词，副动词由复数第三人称构成：[чита́я, возвраща́ясь, приходя́, принося́]{.ru}；[-ава́ть]{.ru} 保留 [-ва-]{.ru}：[дава́я]{.ru}（形动词却是 [даю́щий]{.ru}）；[писа́ть]{.ru} 没有副动词。形动词的 [-ся]{.ru}、副动词的 [-сь]{.ru}：[возвраща́ющийся / возвраща́ясь]{.ru}。
    第 2、4、6、8、10、12 题：完成体没有现在时形动词，也没有未完成体副动词；完成体副动词由不定式词干加 [-в / -вшись]{.ru}：[прочита́в, верну́вшись, написа́в, дав]{.ru}；[-йти, -сти]{.ru} 类由将来时词干加 [-я]{.ru}：[придя́, принеся́]{.ru}。过去时形动词：[прише́дший]{.ru}（[идти́]{.ru} 类），[принёсший]{.ru}（辅音词干只加 [-ш-]{.ru}）。
