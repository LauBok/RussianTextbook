  - base: '[дава́ть]{.ru}'
    cells:
    - '[дава́ть]{.ru}'
    - '[даю́щий]{.ru}'
    - '[дава́вший]{.ru}'
    - '[дава́я]{.ru}'
    - —
  - base: '[дать]{.ru}'
    cells:
    - '[дать]{.ru}'
    - —
    - '[да́вший]{.ru}'
    - —
    - '[дав]{.ru}'
  - base: '[приноси́ть]{.ru}'
    cells:
