    - '[Его́ сестру́ пригласи́ли на сва́дьбу.]{.ru}'
    hint: 改成不定人称句
  - base: '[Но́вый музе́й бу́дет откры́т в ма́е.]{.ru}'
    cells:
    - '[Но́вый музе́й бу́дет откры́т в ма́е.]{.ru}'
    - '[Но́вый музе́й откро́ют в ма́е.]{.ru}'
    hint: 改成不定人称句
  why: |-
    第 1–5 题：前置词化副动词的格：[благодаря́]{.ru} + 第三格，[несмотря́ на]{.ru} + 第四格，[начина́я с]{.ru} + 第二格（辅音组前写 [со]{.ru}），[спустя́]{.ru} + 第四格，[су́дя по]{.ru} + 第三格。
    第 6–9 题：无人称句：主体第三格，谓语过去时中性单数：[не хвата́ло де́нег, удало́сь, пришло́сь, бы́ло ску́чно]{.ru}。
    第 10–12 题：不定人称句：被动句的主语变第四格宾语（[сестру́]{.ru}；非动物阳性同第一格），谓语用复数第三人称：[запусти́ли, пригласи́ли, откро́ют]{.ru}。
- id: B3-L20-综合-d
  lessons: *id001
  tags:
  - 综合：否定中的体
  recycles:
  - B3-L18-01
  - B3-L18-03
  task: 从括号里的一对动词中选一个，写出合适的形式。
  type: fill
  items:
  - stem: 'Не на́до ___ такси́: вокза́л ря́дом.'
    hint: вызыва́ть / вы́звать
    accept:
    - вызыва́ть
    new: true
    gloss: 叫（车）
  - stem: В метро́ нельзя́ ___.
    hint: кури́ть / покури́ть
    accept:
    - кури́ть
  - stem: Без слова́ря э́тот текст нельзя́ ___.
    hint: переводи́ть / перевести́
    accept:
    - перевести́
  - stem: Не ___ па́спорт до́ма!
    hint: оставля́ть / оста́вить
    accept:
    - оста́вьте
  - stem: Пожа́луйста, не ___ во вре́мя ле́кции, Ми́ша.
    hint: разгова́ривать / поговори́ть
    accept:
    - разгова́ривай
  - stem: Я ещё не ___ кни́гу, кото́рую ты мне дал.
    hint: чита́ть / прочита́ть
    accept:
    - прочита́л
  - stem: Мой брат никогда́ не ___ на самолёте.
    hint: лета́ть / полете́ть
    accept:
    - лета́л
  - stem: Мы жда́ли его́ весь день, но он так и не ___.
    hint: приходи́ть / прийти́
    accept:
    - пришёл
  - stem: 'Тебе́ не сто́ит ___ э́ту ку́ртку: она́ сли́шком дорога́я.'
    hint: покупа́ть / купи́ть
    accept:
    - покупа́ть
  - stem: Смотри́, не ___ ключи́!
    hint: теря́ть / потеря́ть
    accept:
    - потеря́й
  why: |-
    第 1、9 题：[не на́до, не сто́ит]{.ru} + 未完成体：[вызыва́ть, покупа́ть]{.ru}。
    第 2 题：禁止：[нельзя́ кури́ть]{.ru}。第 3 题：做不到：[нельзя́ перевести́]{.ru}。
    第 4、10 题：提醒，完成体否定命令式：[не оста́вьте, не потеря́й]{.ru}。第 5 题：劝阻，未完成体：[не разгова́ривай]{.ru}（对 [Ми́ша]{.ru}）。
    第 6、8 题：[ещё не, так и не]{.ru} + 完成体：[не прочита́л, не пришёл]{.ru}。第 7 题：[никогда́ не]{.ru} + 未完成体：[не лета́л]{.ru}。
