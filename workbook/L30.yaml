- id: L30-04
  lessons:
  - L24
  - L25
  tags:
  - 复习：定向与不定向运动动词辨别
  task: 判断空格处用哪一组动词。
  type: classify
  bins:
  - '[идти́ / е́хать]{.ru}'
  - '[ходи́ть / е́здить]{.ru}'
  items:
  - text: '[Сейча́с Ми́ша … в шко́лу.]{.ru}'
    answer: '[идти́ / е́хать]{.ru}'
  - text: '[Ми́ша ка́ждый день … в шко́лу.]{.ru}'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[— Куда́ ты …? — В магази́н.]{.ru}'
    answer: '[идти́ / е́хать]{.ru}'
  - text: '[Мы ча́сто … на да́чу.]{.ru}'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[В суббо́ту мы … на да́чу.]{.ru}（这个星期六，已经定好）'
    answer: '[идти́ / е́хать]{.ru}'
  - text: '[Ка́ждую суббо́ту мы … на да́чу.]{.ru}'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[Ве́чером мы … в теа́тр.]{.ru}（今天晚上，票已买好）'
    answer: '[идти́ / е́хать]{.ru}'
  - text: '[Я ре́дко … в теа́тр.]{.ru}'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[Па́па всегда́ … на рабо́ту.]{.ru}（坐地铁）'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[Вот … О́льга Ви́кторовна.]{.ru}'
    answer: '[идти́ / е́хать]{.ru}'
  - text: '[Во вто́рник и в четве́рг я … в бассе́йн.]{.ru}（每星期）'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[Студе́нты сейча́с … на ле́кцию.]{.ru}'
    answer: '[идти́ / е́хать]{.ru}'
  - text: '[Вы иногда́ … в Пеки́н?]{.ru}'
    answer: '[ходи́ть / е́здить]{.ru}'
  - text: '[Уже́ де́сять часо́в, мы … домо́й.]{.ru}（此刻在路上）'
    answer: '[идти́ / е́хать]{.ru}'
  why: '第 1、3、10、12、14 题：说话这一刻正在路上，用定向动词。

    第 5、7 题：已经定好的一次去向，用定向动词的现在时表示将来。

    第 2、4、6、8、9、11、13 题：经常、反复的往返，有 [ка́ждый день, ча́сто, ре́дко, всегда́, иногда́]{.ru} 或“每星期”，用不定向动词。第 5 题和第 6 题、第 7 题和第 8 题都要看是一次还是经常。'
