  why: |-
    第 1–5 题：长尾 [-ённый]{.ru} 的短尾，阳性 [-ён]{.ru}，其余各形式重音都在词尾：[приглашена́, переведено́, включены́, освобождена́, привезено́]{.ru}。阳性重读的 [ё]{.ru} 不能写成 [е]{.ru}。
    第 6–9 题：长尾去掉 [-ный]{.ru}，只留一个 [н]{.ru}，交替照留：[пригото́влен, опла́чена, встре́чено, отпра́влены]{.ru}，重音不动。常见错误是写成 [пригото́вленно]{.ru}。
    第 10–12 题：阴性有两读，重音可以在词干上，也可以移到词尾：[со́здана / создана́, пе́редана / передана́, на́чата / начата́]{.ru}，两种都对；其余形式重音在词干上：[со́здано, пе́реданы, на́чат]{.ru}。
- id: B3-L05-02
  lessons:
  - B3-L05
  tags:
  - 短尾被动形动词：быть 表时间
  - 短尾被动形动词：数量主语
  task: 写出被动句的谓语：过去、现在、将来。
  type: matrix
  cols:
  - 主语 + 动词
  - 过去
  - 现在
  - 将来
  given:
  - 0
  rows:
  - base: '[вы́ставка + откры́ть]{.ru}'
    cells:
    - '[вы́ставка + откры́ть]{.ru}'
    - '[была́ откры́та]{.ru}'
    - '[откры́та]{.ru}'
    - '[бу́дет откры́та]{.ru}'
  - base: '[мост + постро́ить]{.ru}'
    cells:
    - '[мост + постро́ить]{.ru}'
    - '[был постро́ен]{.ru}'
    - '[постро́ен]{.ru}'
    - '[бу́дет постро́ен]{.ru}'
  - base: '[пи́сьма + отпра́вить]{.ru}'
    cells:
    - '[пи́сьма + отпра́вить]{.ru}'
    - '[бы́ли отпра́влены]{.ru}'
    - '[отпра́влены]{.ru}'
    - '[бу́дут отпра́влены]{.ru}'
  - base: '[мно́го книг + изда́ть]{.ru}'
    cells:
    - '[мно́го книг + изда́ть]{.ru}'
    - '[бы́ло и́здано]{.ru}'
    - '[и́здано]{.ru}'
    - '[бу́дет и́здано]{.ru}'
  - base: '[зада́ча + реши́ть]{.ru}'
    cells:
    - '[зада́ча + реши́ть]{.ru}'
    - '[была́ решена́]{.ru}'
    - '[решена́]{.ru}'
    - '[бу́дет решена́]{.ru}'
  - base: '[пять портре́тов + купи́ть]{.ru}'
    cells:
    - '[пять портре́тов + купи́ть]{.ru}'
    - '[бы́ло ку́плено]{.ru}'
    - '[ку́плено]{.ru}'
    - '[бу́дет ку́плено]{.ru}'
  - base: '[окно́ + закры́ть]{.ru}'
    cells:
    - '[окно́ + закры́ть]{.ru}'
    - '[бы́ло закры́то]{.ru}'
    - '[закры́то]{.ru}'
    - '[бу́дет закры́то]{.ru}'
  - base: '[о́коло ты́сячи книг + перевести́]{.ru}'
    cells:
    - '[о́коло ты́сячи книг + перевести́]{.ru}'
    - '[бы́ло переведено́]{.ru}'
    - '[переведено́]{.ru}'
    - '[бу́дет переведено́]{.ru}'
  - base: '[рома́н + перевести́]{.ru}'
    cells:
    - '[рома́н + перевести́]{.ru}'
    - '[был переведён]{.ru}'
    - '[переведён]{.ru}'
    - '[бу́дет переведён]{.ru}'
  - base: '[не́сколько студе́нтов + пригласи́ть]{.ru}'
    cells:
    - '[не́сколько студе́нтов + пригласи́ть]{.ru}'
    - '[бы́ло приглашено́]{.ru}'
    - '[приглашено́]{.ru}'
    - '[бу́дет приглашено́]{.ru}'
  - base: '[карти́на + созда́ть]{.ru}'
    cells:
    - '[карти́на + созда́ть]{.ru}'
    - '[была́ со́здана / создана́]{.ru}'
    - '[со́здана / создана́]{.ru}'
    - '[бу́дет со́здана / создана́]{.ru}'
  - base: '[все биле́ты + прода́ть]{.ru}'
    cells:
    - '[все биле́ты + прода́ть]{.ru}'
    - '[бы́ли про́даны]{.ru}'
    - '[про́даны]{.ru}'
    - '[бу́дут про́даны]{.ru}'
  why: |-
    第 1–3、5、7、9、11、12 题：短尾形式和系词都与主语的性、数一致：[вы́ставка была́ откры́та]{.ru}，[мост был постро́ен]{.ru}，[окно́ бы́ло закры́то]{.ru}，[пи́сьма бы́ли отпра́влены]{.ru}；将来时复数用 [бу́дут]{.ru}。现在时不用系词：[Вы́ставка откры́та]{.ru} 说的是结果现在仍在。
    第 5、9 题：[-ён]{.ru} 类的重音：[решена́, переведён]{.ru}。第 11 题阴性两读都对。第 12 题 [про́дан]{.ru} 的重音同长尾 [про́данный]{.ru}。
    第 4、6、8、10 题：主语是数量词组（[мно́го книг, пять портре́тов, о́коло ты́сячи книг, не́сколько студе́нтов]{.ru}），系词和短尾用中性单数：[бы́ло и́здано, бы́ло ку́плено, бы́ло переведено́, бы́ло приглашено́]{.ru}；将来时 [бу́дет]{.ru}。
- id: B3-L05-03
  lessons:
  - B3-L05
  tags:
  - 短尾被动形动词：长尾与短尾的分工
  - 短尾被动形动词：быть 表时间
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Мы вошли́ в ___ в про́шлом году́ зда́ние.
    hint: постро́ить
    accept:
    - постро́енное
  - stem: Э́то зда́ние ___ в 1912 году́.
    hint: постро́ить
    accept:
    - бы́ло постро́ено
  - stem: Ско́ро в на́шем райо́не ___ но́вая шко́ла.
    hint: откры́ть
    accept:
    - бу́дет откры́та
  - stem: Магази́н ___ до девяти́ часо́в, мо́жно не спеши́ть.
    hint: откры́ть
    accept:
    - откры́т
  - stem: На уро́ке мы обсужда́ли рома́н, ___ Толсты́м.
    hint: написа́ть
    accept:
    - напи́санный
  - stem: 'Посмотри́: все зада́чи уже́ ___!'
    hint: реши́ть
    accept:
    - решены́
  - stem: В 2010 году́ в го́роде ___ мно́го но́вых домо́в.
    hint: постро́ить
    accept:
    - бы́ло постро́ено
  - stem: За́втра на конце́рт ___ все студе́нты на́шего ку́рса.
    hint: пригласи́ть
    accept:
    - бу́дут приглашены́
  - stem: 'Музе́й рабо́тает уже́ сто лет: он ___ в 1925 году́.'
    hint: основа́ть
    accept:
    - был осно́ван
  - stem: Мы до́лго иска́ли ___ ключи́.
    hint: потеря́ть
    accept:
    - поте́рянные
  - stem: Вчера́ в библиоте́ку ___ о́коло ста но́вых книг.
    hint: привезти́
    accept:
    - бы́ло привезено́
  - stem: Я прочита́л все пи́сьма, ___ ба́бушкой.
    hint: сохрани́ть
    accept:
    - сохранённые
    new: true
    gloss: 保存
  why: |-
    第 1、5、10、12 题：形动词在名词前后作定语，用长尾，与名词同格：[в постро́енное зда́ние]{.ru}（中性第四格），[рома́н, напи́санный]{.ru}，[поте́рянные ключи́]{.ru}，[пи́сьма, сохранённые]{.ru}。这里不能用短尾。
    第 2、7、9、11 题：作谓语用短尾，时间状语（[в 1912 году́, в 2010 году́, вчера́]{.ru}）说明是过去，加 [был]{.ru} 的相应形式：[бы́ло постро́ено, был осно́ван]{.ru}；第 7、11 题主语是数量词组，用中性单数：[бы́ло постро́ено, бы́ло привезено́]{.ru}。
    第 3、8 题：[ско́ро, за́втра]{.ru} 说明是将来：[бу́дет откры́та, бу́дут приглашены́]{.ru}。
    第 4、6 题：说的是现在的状态，不用系词：[откры́т, решены́]{.ru}。[Магази́н был откры́т]{.ru} 是说过去的事。
