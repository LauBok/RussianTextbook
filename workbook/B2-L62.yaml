    - '[вы́мыто]{.ru}'
    - '[вы́мыты]{.ru}'
    new: true
    gloss: 洗干净（完成体）
  why: '第 1–3 题：[-ить → -ен]{.ru}：[постро́ен, прове́рен, вы́учен]{.ru}；阴、中、复加 [-а, -о, -ы]{.ru}，重音不动。

    第 4、5 题：[-вить]{.ru} 动词有交替 [в → вл]{.ru}，和第一人称单数相同（[пригото́влю]{.ru}）：[пригото́влен, отпра́влена]{.ru}。

    第 6、9 题：[-ать → -ан]{.ru}：[сде́лан, заброни́рован]{.ru}，只写一个 [н]{.ru}。

    第 7、8、10 题：[напи́сан, прочи́тан, поте́рян]{.ru} 的重音比不定式前移一个音节，各形式都保持这个重音：[напи́сана, прочи́тано, поте́ряны]{.ru}。

    第 11–14 题：[-ыть → -ыт]{.ru}：[откры́т, закры́т, забы́т, вы́мыт]{.ru}。'
- id: B2-L62-02
  tags:
  - 短尾被动形动词：与主语一致和 быть 的时间
  task: 写出被动句的谓语：过去、现在、将来。
  type: matrix
  cols:
  - 主语 + 动词
  - 过去
  - 现在（结果仍在）
  - 将来
  given:
  - 0
  rows:
  - base: '[зда́ние + постро́ить]{.ru}'
    cells:
    - '[зда́ние + постро́ить]{.ru}'
    - '[бы́ло постро́ено]{.ru}'
    - '[постро́ено]{.ru}'
    - '[бу́дет постро́ено]{.ru}'
  - base: '[мост + постро́ить]{.ru}'
    cells:
    - '[мост + постро́ить]{.ru}'
    - '[был постро́ен]{.ru}'
    - '[постро́ен]{.ru}'
    - '[бу́дет постро́ен]{.ru}'
  - base: '[письмо́ + написа́ть]{.ru}'
    cells:
    - '[письмо́ + написа́ть]{.ru}'
    - '[бы́ло напи́сано]{.ru}'
    - '[напи́сано]{.ru}'
    - '[бу́дет напи́сано]{.ru}'
  - base: '[кни́га + прочита́ть]{.ru}'
    cells:
    - '[кни́га + прочита́ть]{.ru}'
    - '[была́ прочи́тана]{.ru}'
    - '[прочи́тана]{.ru}'
    - '[бу́дет прочи́тана]{.ru}'
  - base: '[биле́ты + заброни́ровать]{.ru}'
    cells:
    - '[биле́ты + заброни́ровать]{.ru}'
    - '[бы́ли заброни́рованы]{.ru}'
    - '[заброни́рованы]{.ru}'
    - '[бу́дут заброни́рованы]{.ru}'
  - base: '[рабо́та + сде́лать]{.ru}'
    cells:
    - '[рабо́та + сде́лать]{.ru}'
    - '[была́ сде́лана]{.ru}'
    - '[сде́лана]{.ru}'
    - '[бу́дет сде́лана]{.ru}'
  - base: '[магази́н + закры́ть]{.ru}'
    cells:
    - '[магази́н + закры́ть]{.ru}'
    - '[был закры́т]{.ru}'
    - '[закры́т]{.ru}'
    - '[бу́дет закры́т]{.ru}'
  - base: '[о́кна + откры́ть]{.ru}'
    cells:
    - '[о́кна + откры́ть]{.ru}'
    - '[бы́ли откры́ты]{.ru}'
    - '[откры́ты]{.ru}'
    - '[бу́дут откры́ты]{.ru}'
  - base: '[обе́д + пригото́вить]{.ru}'
    cells:
    - '[обе́д + пригото́вить]{.ru}'
    - '[был пригото́влен]{.ru}'
    - '[пригото́влен]{.ru}'
    - '[бу́дет пригото́влен]{.ru}'
  - base: '[упражне́ния + прове́рить]{.ru}'
    cells:
    - '[упражне́ния + прове́рить]{.ru}'
    - '[бы́ли прове́рены]{.ru}'
    - '[прове́рены]{.ru}'
    - '[бу́дут прове́рены]{.ru}'
  why: '第 1、3 题：中性主语：[бы́ло постро́ено / постро́ено / бу́дет постро́ено]{.ru}；[бы́ло]{.ru} 和短尾都用中性，不写 *[бы́ло постро́ен]{.ru}*。

    第 2、7、9 题：阳性主语：[был постро́ен, был закры́т, был пригото́влен]{.ru}；现在时不用 [быть]{.ru}。

    第 4、6 题：阴性主语：[была́ прочи́тана, была́ сде́лана]{.ru}；将来时 [бу́дет]{.ru} 不分性。

    第 5、8、10 题：复数主语：[бы́ли / бу́дут]{.ru} + 复数短尾：[бы́ли заброни́рованы, бу́дут откры́ты, бы́ли прове́рены]{.ru}。'
- id: B2-L62-03
  tags:
  - стро́ится 与 постро́ен 的区别
  task: 按意义把句子归栏。
  type: classify
  bins:
  - 正在进行或经常发生
  - 已经完成，结果仍在
  items:
  - text: '[В на́шем райо́не стро́ится шко́ла.]{.ru}'
    answer: 正在进行或经常发生
  - text: '[Шко́ла постро́ена в про́шлом году́.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Магази́н открыва́ется в де́вять.]{.ru}'
    answer: 正在进行或经常发生
  - text: '[Дверь уже́ откры́та.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Как пи́шется э́то сло́во?]{.ru}'
    answer: 正在进行或经常发生
  - text: '[Письмо́ напи́сано по-ру́сски.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Обе́д ещё гото́вится.]{.ru}'
    answer: 正在进行或经常发生
  - text: '[Обе́д уже́ пригото́влен.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Э́ти кни́ги продаю́тся во всех магази́нах.]{.ru}'
    answer: 正在进行或经常发生
  - text: '[Все биле́ты заброни́рованы.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Но́вая ста́нция метро́ стро́ится уже́ два го́да.]{.ru}'
    answer: 正在进行或经常发生
  - text: '[Рабо́та сде́лана хорошо́.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Упражне́ния прове́рены.]{.ru}'
    answer: 已经完成，结果仍在
  - text: '[Магази́н закрыва́ется в во́семь.]{.ru}'
    answer: 正在进行或经常发生
  why: '第 1、3、5、7、9、11、14 题：未完成体 + [-ся]{.ru}（[стро́ится, открыва́ется, пи́шется, гото́вится, продаю́тся]{.ru}）：事情正在进行（还没完成）或经常、按规律发生。

    第 2、4、6、8、10、12、13 题：完成体短尾被动形动词（[постро́ена, откры́та, напи́сано, пригото́влен]{.ru}）：动作已经完成，结果还在。'
- id: B2-L62-04
  tags:
  - 被动句：施事第五格
  - 被动句：句中的谓语
  task: 用括号里的词填空（句中）。
  type: fill
  items:
  - stem: Э́ти стихи́ напи́саны ___.
    hint: Пу́шкин
    accept:
    - Пу́шкиным
  - stem: Зда́ние бы́ло постро́ено ___.
    hint: изве́стный архите́ктор
    accept:
    - изве́стным архите́ктором
  - stem: Все упражне́ния прове́рены ___.
    hint: О́льга Ви́кторовна
    accept:
    - О́льгой Ви́кторовной
  - stem: Кварти́ра ___ на неде́лю.
    hint: заброни́ровать，过去
    accept:
    - была́ заброни́рована
  - stem: Ско́ро в на́шем райо́не ___ но́вый парк.
    hint: откры́ть，将来
    accept:
    - бу́дет откры́т
  - stem: Письмо́ ___ вчера́.
    hint: отпра́вить
    accept:
    - бы́ло отпра́влено
  - stem: Мост ещё ___, по нему́ нельзя́ е́здить.
    hint: стро́иться
    accept:
    - стро́ится
  why: '第 1–3 题：被动句里做事的人用第五格：[Пу́шкиным, изве́стным архите́ктором, О́льгой Ви́кторовной]{.ru}。

    第 4–6 题：短尾和主语的性、数一致，时间由 [быть]{.ru} 表示：[была́ заброни́рована, бу́дет откры́т, бы́ло отпра́влено]{.ru}（[вчера́]{.ru} 要求过去时）。

    第 7 题：“还在建”用未完成体 + [-ся]{.ru}：[стро́ится]{.ru}。'
