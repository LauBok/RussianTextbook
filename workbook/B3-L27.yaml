    - '[Дюма́]{.ru}'
    - '[о Дюма́]{.ru}'
    hint: 男
  why: |-
    第 1、4 题：[-ов, -ин]{.ru} 男性姓大部分像名词：[Ивано́ва, Ивано́ву, об Ивано́ве]{.ru}；只有第五格像形容词：[Ивано́вым, Пу́шкиным]{.ru}，不写 [Ивано́вом]{.ru}。
    第 2、5 题：女性姓除第四格 [-у]{.ru} 以外都是 [-ой]{.ru}：[Ивано́вой, Королёвой]{.ru}。
    第 3 题：复数全部像形容词：[Ивано́вых, Ивано́вым, Ивано́выми]{.ru}。
    第 6–9 题：[-ский, -ой]{.ru} 姓按形容词变格：[Достое́вского, Достое́вским]{.ru}；[Толсто́й]{.ru} — [Толсто́го]{.ru} — [Толсты́м]{.ru}；女性 [Чайко́вской, Толсто́й]{.ru}。注意 [Толсто́й]{.ru} 既是男性第一格，又是女性的间接格。
    第 10、11 题：辅音结尾的外来姓男性像阳性名词一样变格：[Шми́дта, Шми́дтом]{.ru}；女性不变格：[о А́нне Шмидт]{.ru}，不写 [Шми́дтой]{.ru}。
    第 12–14 题：[-ых]{.ru}、[-ко / -енко]{.ru} 和以重读 [-а́]{.ru} 结尾的外来姓不变格：[Черны́х, Шевче́нко, Дюма́]{.ru}。
- id: B3-L27-02
  lessons:
  - B3-L27
  tags:
  - 姓氏与城市名：第五格的区别
  task: 写出下列名称作人名和作城市名时的形式。
  type: matrix
  cols:
  - 名称
  - '[с]{.ru} + 第五格（人）'
  - '[под]{.ru} + 第五格（城市）'
  - '[в]{.ru} + 第六格（城市）'
  given:
  - 0
  rows:
  - base: '[Пу́шкин]{.ru}'
    cells:
    - '[Пу́шкин]{.ru}'
    - '[с Пу́шкиным]{.ru}'
    - '[под Пу́шкином]{.ru}'
    - '[в Пу́шкине]{.ru}'
  - base: '[Королёв]{.ru}'
    cells:
    - '[Королёв]{.ru}'
    - '[с Королёвым]{.ru}'
    - '[под Королёвом]{.ru}'
    - '[в Королёве]{.ru}'
  - base: '[Гага́рин]{.ru}'
    cells:
    - '[Гага́рин]{.ru}'
    - '[с Гага́риным]{.ru}'
    - '[под Гага́рином]{.ru}'
    - '[в Гага́рине]{.ru}'
  - base: '[Ки́ров]{.ru}'
    cells:
    - '[Ки́ров]{.ru}'
    - '[с Ки́ровым]{.ru}'
    - '[под Ки́ровом]{.ru}'
    - '[в Ки́рове]{.ru}'
  - base: '[Че́хов]{.ru}'
    cells:
    - '[Че́хов]{.ru}'
    - '[с Че́ховым]{.ru}'
    - '[под Че́ховом]{.ru}'
    - '[в Че́хове]{.ru}'
  - base: '[Дми́тров]{.ru}'
    cells:
    - '[Дми́тров]{.ru}'
    - '[с Дми́тровым]{.ru}'
    - '[под Дми́тровом]{.ru}'
    - '[в Дми́трове]{.ru}'
  why: 第 1–6 题：作姓时第五格像形容词：[с Пу́шкиным, с Королёвым]{.ru}；作城市名时按普通阳性名词变格，第五格是 [-ом]{.ru}：[под Пу́шкином, под Королёвом]{.ru}。第六格两者相同：[о Пу́шкине, в Пу́шкине]{.ru}。
- id: B3-L27-03
  lessons:
  - B3-L27
  tags:
  - 地名：-ово, -ино 地名的变格
  - 地名：两部分组成的地名
  task: 写出地名的第五格和第六格。
  type: matrix
  cols:
  - 地名
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[Ива́ново]{.ru}'
    cells:
    - '[Ива́ново]{.ru}'
    - '[Ива́новом]{.ru}'
    - '[в Ива́нове]{.ru}'
  - base: '[Пу́шкино]{.ru}'
    cells:
    - '[Пу́шкино]{.ru}'
    - '[Пу́шкином]{.ru}'
    - '[в Пу́шкине]{.ru}'
  - base: '[Шереме́тьево]{.ru}'
    cells:
    - '[Шереме́тьево]{.ru}'
    - '[Шереме́тьевом]{.ru}'
    - '[в Шереме́тьеве]{.ru}'
    new: true
    gloss: 谢列梅捷沃（机场）
  - base: '[Переде́лкино]{.ru}'
    cells:
    - '[Переде́лкино]{.ru}'
    - '[Переде́лкином]{.ru}'
    - '[в Переде́лкине]{.ru}'
    new: true
    gloss: 佩列杰尔金诺（作家村）
  - base: '[Москва́-река́]{.ru}'
    cells:
    - '[Москва́-река́]{.ru}'
    - '[Москво́й-реко́й]{.ru}'
    - '[на Москве́-реке́]{.ru}'
  - base: '[го́род Пу́шкин]{.ru}'
    cells:
    - '[го́род Пу́шкин]{.ru}'
    - '[го́родом Пу́шкином]{.ru}'
    - '[в го́роде Пу́шкине]{.ru}'
  why: |-
    第 1–4 题：[-ово, -ево, -ино]{.ru} 地名按规范像中性名词变格：[под Ива́новом, в Ива́нове, в Шереме́тьеве]{.ru}。口语里常不变格，书面语用变格的形式。注意 [Пу́шкино]{.ru} 的第六格和 [Пу́шкин]{.ru} 相同：[в Пу́шкине]{.ru}。
    第 5 题：[Москва́-река́]{.ru} 两部分都变格：[Москво́й-реко́й, на Москве́-реке́]{.ru}。
    第 6 题：城市名与 [го́род]{.ru} 同格：[в го́роде Пу́шкине]{.ru}，名称也按城市名变，第五格 [-ом]{.ru}：[го́родом Пу́шкином]{.ru}。
- id: B3-L27-04
  lessons:
  - B3-L27
  tags:
  - 姓氏与地名：句中变格
  task: 用括号里的姓或地名填空。
  type: fill
  items:
  - stem: Ван Лэй це́лый год жил у ___.
    hint: Петро́вы
    accept:
    - Петро́вых
  - stem: Студе́нты написа́ли письмо́ Мари́и ___.
    hint: Королёва
    accept:
    - Королёвой
  - stem: Мы мно́го говори́ли о Со́фье Андре́евне ___.
    hint: Толста́я
    accept:
    - Толсто́й
  - stem: Ю́ми чита́ет рома́н ___.
    hint: Достое́вский
    accept:
    - Достое́вского
  - stem: Все зна́ют стихи́ Алекса́ндра ___.
    hint: Блок
    accept:
    - Бло́ка
  - stem: Пьер рассказа́л нам о Ви́кторе ___.
    hint: Гюго́
    accept:
    - Гюго́
  - stem: Я получи́л письмо́ от Ви́ктора ___.
    hint: Шмидт
    accept:
    - Шми́дта
  - stem: На́ши друзья́ живу́т под ___.
    hint: Королёв（го́род）
    accept:
    - Королёвом
  - stem: Мы прие́хали в Москву́ из ___.
    hint: Ки́ров（го́род）
    accept:
    - Ки́рова
  why: |-
    第 1 题：复数姓像形容词：[у Петро́вых]{.ru}。
    第 2 题：[-ов]{.ru} 女性间接格 [-ой]{.ru}：[Мари́и Королёвой]{.ru}。
    第 3、4 题：形容词式的姓：[о Толсто́й]{.ru}（女性第六格），[рома́н Достое́вского]{.ru}（第二格）。
    第 5、7 题：辅音结尾的外来男性姓像名词一样变格：[Бло́ка, от Ви́ктора Шми́дта]{.ru}。
    第 6 题：以重读元音结尾的外来姓不变格：[о Ви́кторе Гюго́]{.ru}。
    第 8、9 题：城市名按名词变格：[под Королёвом]{.ru}（第五格 [-ом]{.ru}），[из Ки́рова]{.ru}。
