heading: 第 27 课　姓氏与地名的变格
groups:
- id: B3-L27-01
  lessons:
  - B3-L27
  tags:
  - 姓氏：-ов, -ин 混合变格
  - 姓氏：-ский, -ой 形容词变格
  - 姓氏：辅音结尾的外来姓
  - 姓氏：不变格的姓
  task: 写出姓的第二、三、五、六格。
  type: matrix
  cols:
  - 姓
  - 第二格
  - 第三格
  - 第五格
  - '[о]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[Ивано́в]{.ru}'
    cells:
    - '[Ивано́в]{.ru}'
    - '[Ивано́ва]{.ru}'
    - '[Ивано́ву]{.ru}'
    - '[Ивано́вым]{.ru}'
    - '[об Ивано́ве]{.ru}'
    hint: 男
  - base: '[Ивано́ва]{.ru}'
    cells:
    - '[Ивано́ва]{.ru}'
    - '[Ивано́вой]{.ru}'
    - '[Ивано́вой]{.ru}'
    - '[Ивано́вой]{.ru}'
    - '[об Ивано́вой]{.ru}'
    hint: 女
  - base: '[Ивано́вы]{.ru}'
    cells:
    - '[Ивано́вы]{.ru}'
    - '[Ивано́вых]{.ru}'
    - '[Ивано́вым]{.ru}'
    - '[Ивано́выми]{.ru}'
    - '[об Ивано́вых]{.ru}'
    hint: 复数
  - base: '[Пу́шкин]{.ru}'
    cells:
    - '[Пу́шкин]{.ru}'
    - '[Пу́шкина]{.ru}'
    - '[Пу́шкину]{.ru}'
    - '[Пу́шкиным]{.ru}'
    - '[о Пу́шкине]{.ru}'
    hint: 男
  - base: '[Королёва]{.ru}'
    cells:
    - '[Королёва]{.ru}'
    - '[Королёвой]{.ru}'
    - '[Королёвой]{.ru}'
    - '[Королёвой]{.ru}'
    - '[о Королёвой]{.ru}'
    hint: 女
  - base: '[Достое́вский]{.ru}'
    cells:
    - '[Достое́вский]{.ru}'
    - '[Достое́вского]{.ru}'
    - '[Достое́вскому]{.ru}'
    - '[Достое́вским]{.ru}'
    - '[о Достое́вском]{.ru}'
    hint: 男
  - base: '[Чайко́вская]{.ru}'
    cells:
    - '[Чайко́вская]{.ru}'
    - '[Чайко́вской]{.ru}'
    - '[Чайко́вской]{.ru}'
    - '[Чайко́вской]{.ru}'
    - '[о Чайко́вской]{.ru}'
    hint: 女
  - base: '[Толсто́й]{.ru}'
    cells:
    - '[Толсто́й]{.ru}'
    - '[Толсто́го]{.ru}'
    - '[Толсто́му]{.ru}'
    - '[Толсты́м]{.ru}'
    - '[о Толсто́м]{.ru}'
    hint: 男
  - base: '[Толста́я]{.ru}'
    cells:
    - '[Толста́я]{.ru}'
    - '[Толсто́й]{.ru}'
    - '[Толсто́й]{.ru}'
    - '[Толсто́й]{.ru}'
    - '[о Толсто́й]{.ru}'
    hint: 女
  - base: '[Шмидт]{.ru}'
    cells:
    - '[Шмидт]{.ru}'
    - '[Шми́дта]{.ru}'
    - '[Шми́дту]{.ru}'
    - '[Шми́дтом]{.ru}'
    - '[о Шми́дте]{.ru}'
    hint: 男
  - base: '[Шмидт]{.ru}'
    cells:
    - '[Шмидт]{.ru}'
    - '[Шмидт]{.ru}'
    - '[Шмидт]{.ru}'
    - '[Шмидт]{.ru}'
    - '[о Шмидт]{.ru}'
    hint: 女
  - base: '[Черны́х]{.ru}'
    cells:
    - '[Черны́х]{.ru}'
    - '[Черны́х]{.ru}'
    - '[Черны́х]{.ru}'
    - '[Черны́х]{.ru}'
    - '[о Черны́х]{.ru}'
    hint: 男
  - base: '[Шевче́нко]{.ru}'
    cells:
    - '[Шевче́нко]{.ru}'
    - '[Шевче́нко]{.ru}'
    - '[Шевче́нко]{.ru}'
    - '[Шевче́нко]{.ru}'
    - '[о Шевче́нко]{.ru}'
    hint: 男
  - base: '[Дюма́]{.ru}'
    cells:
    - '[Дюма́]{.ru}'
    - '[Дюма́]{.ru}'
