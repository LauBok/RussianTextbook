heading: 第 45 课　体与时间状语
groups:
- id: L45-01
  tags: [动词的体：反复、一次与过程]
  task: 判断句中的动词表示哪一种意义，填写序号。
  type: classify
  bins: [经常、反复, 一次的具体结果, 过程、持续多久]
  items:
  - {text: '[Ка́ждый день я покупа́ю хлеб.]{.ru}', answer: 经常、反复}
  - {text: '[Вчера́ я купи́л торт.]{.ru}', answer: 一次的具体结果}
  - {text: '[Обы́чно ма́ма покупа́ет хлеб в суперма́ркете.]{.ru}', answer: 经常、反复}
  - {text: '[За́втра ма́ма ку́пит хлеб в бу́лочной.]{.ru}', answer: 一次的具体结果}
  - {text: '[Вчера́ я до́лго чита́л.]{.ru}', answer: 过程、持续多久}
  - {text: '[Вчера́ я прочита́л расска́з.]{.ru}', answer: 一次的具体结果}
  - {text: '[Ми́ша ча́сто опа́здывает на уро́к.]{.ru}', answer: 经常、反复}
  - {text: '[Сего́дня Ми́ша опозда́л на уро́к.]{.ru}', answer: 一次的具体结果}
  - {text: '[Ра́ньше мы ча́сто е́здили на да́чу.]{.ru}', answer: 经常、反复}
  - {text: '[Ван Лэй сра́зу съел кусо́к то́рта.]{.ru}', answer: 一次的具体结果}
  - {text: '[Ю́ми иногда́ покупа́ет чёрный хлеб.]{.ru}', answer: 经常、反复}
  - {text: '[Ма́ма час гото́вила обе́д.]{.ru}', answer: 过程、持续多久}
  - {text: '[Я потеря́л ключ!]{.ru}', answer: 一次的具体结果}
  - {text: '[Ка́ждое у́тро А́нна пьёт ко́фе.]{.ru}', answer: 经常、反复}
  - {text: '[За́втра мы бу́дем до́лго гуля́ть в па́рке.]{.ru}', answer: 过程、持续多久}
  - {text: '[Ве́чером Пьер наконе́ц написа́л письмо́.]{.ru}', answer: 一次的具体结果}
  - {text: '[Ка́ждую суббо́ту мы бу́дем игра́ть в футбо́л.]{.ru}', answer: 经常、反复}
  - {text: '[Я два часа́ де́лал упражне́ние.]{.ru}', answer: 过程、持续多久}
  why: |
    第 1、3、7、9、11、14、17 题：[ка́ждый день, обы́чно, ча́сто, иногда́, ка́ждое у́тро, ка́ждую суббо́ту]{.ru} 表示动作反复发生，用未完成体，过去、现在、将来都一样。
    第 2、4、6、8、10、13、16 题：完成体表示某一次做成了一件具体的事：[купи́л, ку́пит, прочита́л, опозда́л, съел, потеря́л, написа́л]{.ru}。
    第 5、12、15、18 题：[до́лго, час, два часа́]{.ru} 表示持续多久，用未完成体。第 5 题和第 6 题都有 [вчера́]{.ru}，可见 [вчера́]{.ru} 本身不决定体，要看说的是过程还是结果。
- id: L45-02
  tags: [动词的体：三个时间的对比]
  task: 同一体对按要求写出三种形式（主语都是 [я]{.ru}，男性）。
  type: matrix
  cols: [体对, 每天（现在时）, 昨天一次（过去时）, 明天一次（将来时）]
  given: [0]
  rows:
  - {base: '[покупа́ть / купи́ть]{.ru}', cells: ['[покупа́ть / купи́ть]{.ru}', '[покупа́ю]{.ru}', '[купи́л]{.ru}', '[куплю́]{.ru}']}
  - {base: '[чита́ть / прочита́ть]{.ru}', cells: ['[чита́ть / прочита́ть]{.ru}', '[чита́ю]{.ru}', '[прочита́л]{.ru}', '[прочита́ю]{.ru}']}
  - {base: '[писа́ть / написа́ть]{.ru}', cells: ['[писа́ть / написа́ть]{.ru}', '[пишу́]{.ru}', '[написа́л]{.ru}', '[напишу́]{.ru}']}
  - {base: '[де́лать / сде́лать]{.ru}', cells: ['[де́лать / сде́лать]{.ru}', '[де́лаю]{.ru}', '[сде́лал]{.ru}', '[сде́лаю]{.ru}']}
  - {base: '[гото́вить / пригото́вить]{.ru}', cells: ['[гото́вить / пригото́вить]{.ru}', '[гото́влю]{.ru}', '[пригото́вил]{.ru}', '[пригото́влю]{.ru}']}
  - {base: '[смотре́ть / посмотре́ть]{.ru}', cells: ['[смотре́ть / посмотре́ть]{.ru}', '[смотрю́]{.ru}', '[посмотре́л]{.ru}', '[посмотрю́]{.ru}']}
  - {base: '[спра́шивать / спроси́ть]{.ru}', cells: ['[спра́шивать / спроси́ть]{.ru}', '[спра́шиваю]{.ru}', '[спроси́л]{.ru}', '[спрошу́]{.ru}']}
  - {base: '[расска́зывать / рассказа́ть]{.ru}', cells: ['[расска́зывать / рассказа́ть]{.ru}', '[расска́зываю]{.ru}', '[рассказа́л]{.ru}', '[расскажу́]{.ru}']}
  - {base: '[брать / взять]{.ru}', cells: ['[брать / взять]{.ru}', '[беру́]{.ru}', '[взял]{.ru}', '[возьму́]{.ru}']}
  - {base: '[дава́ть / дать]{.ru}', cells: ['[дава́ть / дать]{.ru}', '[даю́]{.ru}', '[дал]{.ru}', '[дам]{.ru}']}
  - {base: '[опа́здывать / опозда́ть]{.ru}', cells: ['[опа́здывать / опозда́ть]{.ru}', '[опа́здываю]{.ru}', '[опозда́л]{.ru}', '[опозда́ю]{.ru}']}
  - {base: '[учи́ть / вы́учить]{.ru}', cells: ['[учи́ть / вы́учить]{.ru}', '[учу́]{.ru}', '[вы́учил]{.ru}', '[вы́учу]{.ru}']}
  - {base: '[говори́ть / сказа́ть]{.ru}', cells: ['[говори́ть / сказа́ть]{.ru}', '[говорю́]{.ru}', '[сказа́л]{.ru}', '[скажу́]{.ru}']}
  - {base: '[пока́зывать / показа́ть]{.ru}', cells: ['[пока́зывать / показа́ть]{.ru}', '[пока́зываю]{.ru}', '[показа́л]{.ru}', '[покажу́]{.ru}']}
  why: |
    第 1–14 题：“每天”是反复的动作，只能用未完成体现在时；“昨天一次”“明天一次”是具体的一次，用完成体的过去时和将来时。完成体没有现在时，所以第二栏一定是体对里的前一个动词。
    第 9、10 题：[беру́, даю́]{.ru} 是未完成体现在时，[возьму́, дам]{.ru} 是完成体将来时；[дава́ть]{.ru} 现在时没有 [-ва-]{.ru}。
    第 1、5、7、8、13、14 题：完成体将来时的 [я]{.ru} 形式有交替：[куплю́, пригото́влю, спрошу́, расскажу́, скажу́, покажу́]{.ru}；过去时仍从不定式构成：[купи́л, спроси́л, сказа́л]{.ru}。
- id: L45-03
  tags: [“每个”与“这样的”：性数与第四格]
  task: 写出 [ка́ждый]{.ru} 和 [тако́й]{.ru} 与名词搭配的形式。
  type: matrix
  cols: [名词, '[ка́ждый]{.ru}（第一格）', '[ка́ждый]{.ru}（第四格）', '[тако́й]{.ru}（第一格）']
  given: [0]
  rows:
  - {base: '[день]{.ru}', cells: ['[день]{.ru}', '[ка́ждый]{.ru}', '[ка́ждый]{.ru}', '[тако́й]{.ru}']}
  - {base: '[у́тро]{.ru}', cells: ['[у́тро]{.ru}', '[ка́ждое]{.ru}', '[ка́ждое]{.ru}', '[тако́е]{.ru}']}
  - {base: '[неде́ля]{.ru}', cells: ['[неде́ля]{.ru}', '[ка́ждая]{.ru}', '[ка́ждую]{.ru}', '[така́я]{.ru}']}
  - {base: '[ве́чер]{.ru}', cells: ['[ве́чер]{.ru}', '[ка́ждый]{.ru}', '[ка́ждый]{.ru}', '[тако́й]{.ru}']}
  - {base: '[суббо́та]{.ru}', cells: ['[суббо́та]{.ru}', '[ка́ждая]{.ru}', '[ка́ждую]{.ru}', '[така́я]{.ru}']}
  - {base: '[воскресе́нье]{.ru}', cells: ['[воскресе́нье]{.ru}', '[ка́ждое]{.ru}', '[ка́ждое]{.ru}', '[тако́е]{.ru}']}
  - {base: '[ме́сяц]{.ru}', new: true, gloss: 月, cells: ['[ме́сяц]{.ru}', '[ка́ждый]{.ru}', '[ка́ждый]{.ru}', '[тако́й]{.ru}']}
  - {base: '[ночь]{.ru}', cells: ['[ночь]{.ru}', '[ка́ждая]{.ru}', '[ка́ждую]{.ru}', '[така́я]{.ru}']}
  - {base: '[сло́во]{.ru}', cells: ['[сло́во]{.ru}', '[ка́ждое]{.ru}', '[ка́ждое]{.ru}', '[тако́е]{.ru}']}
  - {base: '[кни́га]{.ru}', cells: ['[кни́га]{.ru}', '[ка́ждая]{.ru}', '[ка́ждую]{.ru}', '[така́я]{.ru}']}
  - {base: '[торт]{.ru}', cells: ['[торт]{.ru}', '[ка́ждый]{.ru}', '[ка́ждый]{.ru}', '[тако́й]{.ru}']}
  - {base: '[бу́лочная]{.ru}', cells: ['[бу́лочная]{.ru}', '[ка́ждая]{.ru}', '[ка́ждую]{.ru}', '[така́я]{.ru}']}
  - {base: '[письмо́]{.ru}', cells: ['[письмо́]{.ru}', '[ка́ждое]{.ru}', '[ка́ждое]{.ru}', '[тако́е]{.ru}']}
  - {base: '[тетра́дь]{.ru}', cells: ['[тетра́дь]{.ru}', '[ка́ждая]{.ru}', '[ка́ждую]{.ru}', '[така́я]{.ru}']}
  - {base: '[уро́к]{.ru}', cells: ['[уро́к]{.ru}', '[ка́ждый]{.ru}', '[ка́ждый]{.ru}', '[тако́й]{.ru}']}
  why: |
    第 1、4、7、11、15 题：阳性非动物名词第四格同第一格：[ка́ждый день, ка́ждый ве́чер]{.ru}；[тако́й]{.ru} 重音在词尾。
    第 2、6、9、13 题：中性第一格、第四格都是 [ка́ждое, тако́е]{.ru}。
    第 3、5、8、10、12、14 题：阴性第一格 [ка́ждая, така́я]{.ru}，第四格 [ка́ждую]{.ru}：[ка́ждую неде́лю, ка́ждую суббо́ту, ка́ждую ночь]{.ru}。第 8、14 题 [ночь, тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，是阴性；第 12 题 [бу́лочная]{.ru} 按形容词变格，也是阴性。
- id: L45-04
  tags: [“每个”与“这样的”：句中配合]
  task: 用括号里词的适当形式填空。
  type: fill
  items:
  - {stem: '___ у́тро я пью чай.', hint: ка́ждый, accept: [ка́ждое]}
  - {stem: 'Я хожу́ в бассе́йн ___ суббо́ту.', hint: ка́ждый, accept: [ка́ждую]}
  - {stem: 'Я ещё не ел ___ торт.', hint: тако́й, accept: [тако́й]}
  - {stem: '___ неде́лю мы е́здим на да́чу.', hint: ка́ждый, accept: [ка́ждую]}
  - {stem: 'Где ты купи́ла ___ су́мку?', hint: тако́й, accept: [таку́ю]}
  - {stem: 'Ван Лэй гуля́ет в па́рке ___ ве́чер.', hint: ка́ждый, accept: [ка́ждый]}
  - {stem: 'В Москве́ ___ краси́вые па́рки!', hint: тако́й, accept: [таки́е]}
  - {stem: '___ день я покупа́ю чёрный хлеб.', hint: ка́ждый, accept: [ка́ждый]}
  - {stem: 'Э́то ___ интере́сная кни́га!', hint: тако́й, accept: [така́я]}
  - {stem: '___ студе́нт зна́ет э́то сло́во.', hint: ка́ждый, accept: [ка́ждый]}
  - {stem: '___ студе́нтка в на́шей гру́ппе изуча́ет англи́йский язы́к.', hint: ка́ждый, accept: [ка́ждая]}
  - {stem: 'Тут ___ интере́сное зда́ние!', hint: тако́й, accept: [тако́е]}
  - {stem: '___ сло́во я пишу́ в тетра́дь.', hint: ка́ждый, accept: [ка́ждое]}
  - {stem: 'Ра́ньше я не ви́дел ___ больши́е дома́.', hint: тако́й, accept: [таки́е]}
  why: |
    第 1、4、6、8 题：表示“每……”的时间词组用第四格：[ка́ждое у́тро, ка́ждую неде́лю, ка́ждый ве́чер, ка́ждый день]{.ru}；第 2 题 [в]{.ru} 后面的 [ка́ждую суббо́ту]{.ru} 也是第四格。
    第 3、5、14 题：作 [ел, купи́ла, не ви́дел]{.ru} 的直接宾语，用第四格：阳性非动物 [тако́й торт]{.ru}，阴性 [таку́ю су́мку]{.ru}，复数非动物 [таки́е дома́]{.ru}。
    第 7、9、10–13 题：作主语或谓语的名词词组用第一格，按名词的性数选：[таки́е па́рки, така́я кни́га, ка́ждый студе́нт, ка́ждая студе́нтка, тако́е зда́ние, ка́ждое сло́во]{.ru}。第 13 题 [ка́ждое сло́во]{.ru} 虽在句首，却是 [пишу́]{.ru} 的宾语，中性第四格同第一格。
    [тако́й]{.ru} 的复数是 [таки́е]{.ru}：[к]{.ru} 后面写 [и]{.ru}，重音在词尾。
- id: L45-05
  tags: [动词的体：反复与一次的选择]
  task: 用括号里动词的适当形式填空。
  type: fill
  items:
  - {stem: 'Ка́ждый день Ми́ша ___ на уро́к.', hint: опа́здывать / опозда́ть, accept: [опа́здывает]}
  - {stem: 'Сего́дня у́тром Ми́ша ___ на уро́к.', hint: опа́здывать / опозда́ть, accept: [опозда́л]}
  - {stem: 'Ра́ньше ма́ма ча́сто ___ торт.', hint: покупа́ть / купи́ть, accept: [покупа́ла]}
  - {stem: 'Вчера́ ма́ма ___ большо́й торт.', hint: покупа́ть / купи́ть, accept: [купи́ла]}
  - {stem: 'Ка́ждую суббо́ту па́па ___ у́жин.', hint: гото́вить / пригото́вить, accept: [гото́вит]}
  - {stem: 'Вчера́ па́па ___ вку́сный у́жин.', hint: гото́вить / пригото́вить, accept: [пригото́вил]}
  - {stem: 'Ван Лэй всегда́ ___ слова́ ве́чером.', hint: учи́ть / вы́учить, accept: [у́чит]}
  - {stem: 'Ван Лэй наконе́ц ___ э́ти слова́.', hint: учи́ть / вы́учить, accept: [вы́учил]}
  why: |
    第 1、3、5、7 题：[ка́ждый день, ча́сто, ка́ждую суббо́ту, всегда́]{.ru} 表示反复的动作，用未完成体；说现在的习惯用现在时（[опа́здывает, гото́вит, у́чит]{.ru}），说过去的习惯用过去时（[покупа́ла]{.ru}）。第 7 题 [учи́ть]{.ru} 的现在时重音在词干：[у́чит]{.ru}。
    第 2、4、6、8 题：说的是一次做成的事，用完成体过去时：[опозда́л, купи́ла, пригото́вил, вы́учил]{.ru}。[сего́дня у́тром, вчера́]{.ru} 本身不决定体，这里是因为说的是那一次的结果；[наконе́ц]{.ru} 更明确指向结果。
