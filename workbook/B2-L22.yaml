heading: 第 22 课　限定代词
groups:
- id: B2-L22-01
  tags:
  - 限定代词 весь：单复数各格
  task: 写出词组的第二、三、五、六格。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  - 第五格
  - '[в]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[весь мир]{.ru}'
    cells:
    - '[весь мир]{.ru}'
    - '[всего́ ми́ра]{.ru}'
    - '[всему́ ми́ру]{.ru}'
    - '[всем ми́ром]{.ru}'
    - '[во всём ми́ре]{.ru}'
  - base: '[вся страна́]{.ru}'
    cells:
    - '[вся страна́]{.ru}'
    - '[всей страны́]{.ru}'
    - '[всей стране́]{.ru}'
    - '[всей страно́й]{.ru}'
    - '[во всей стране́]{.ru}'
  - base: '[всё письмо́]{.ru}'
    cells:
    - '[всё письмо́]{.ru}'
    - '[всего́ письма́]{.ru}'
    - '[всему́ письму́]{.ru}'
    - '[всем письмо́м]{.ru}'
    - '[во всём письме́]{.ru}'
  - base: '[весь го́род]{.ru}'
    cells:
    - '[весь го́род]{.ru}'
    - '[всего́ го́рода]{.ru}'
    - '[всему́ го́роду]{.ru}'
    - '[всем го́родом]{.ru}'
    - '[во всём го́роде]{.ru}'
  - base: '[вся гру́ппа]{.ru}'
    cells:
    - '[вся гру́ппа]{.ru}'
    - '[всей гру́ппы]{.ru}'
    - '[всей гру́ппе]{.ru}'
    - '[всей гру́ппой]{.ru}'
    - '[во всей гру́ппе]{.ru}'
  - base: '[вся семья́]{.ru}'
    cells:
    - '[вся семья́]{.ru}'
    - '[всей семьи́]{.ru}'
    - '[всей семье́]{.ru}'
    - '[всей семьёй]{.ru}'
    - '[во всей семье́]{.ru}'
  - base: '[все магази́ны]{.ru}'
    cells:
    - '[все магази́ны]{.ru}'
    - '[всех магази́нов]{.ru}'
    - '[всем магази́нам]{.ru}'
    - '[все́ми магази́нами]{.ru}'
    - '[во всех магази́нах]{.ru}'
  - base: '[все ко́мнаты]{.ru}'
    cells:
    - '[все ко́мнаты]{.ru}'
    - '[всех ко́мнат]{.ru}'
    - '[всем ко́мнатам]{.ru}'
    - '[все́ми ко́мнатами]{.ru}'
    - '[во всех ко́мнатах]{.ru}'
  - base: '[все кни́ги]{.ru}'
    cells:
    - '[все кни́ги]{.ru}'
    - '[всех книг]{.ru}'
    - '[всем кни́гам]{.ru}'
    - '[все́ми кни́гами]{.ru}'
    - '[во всех кни́гах]{.ru}'
  why: |-
    第 1、3、4 题：阳性、中性单数：[всего́, всему́, всем, всём]{.ru}；第六格前的 [в]{.ru} 写成 [во]{.ru}：[во всём ми́ре]{.ru}。
    第 2、5、6 题：阴性单数除第一、四格外都是 [всей]{.ru}：[всей страны́, всей стране́, всей страно́й, во всей стране́]{.ru}。
    第 7–9 题：复数 [всех, всем, все́ми, всех]{.ru}，名词用复数相应的格。易混：[всем]{.ru} 既是阳性单数第五格（[всем ми́ром]{.ru}），又是复数第三格（[всем кни́гам]{.ru}）；[всех]{.ru} 既是复数第二格，又是第六格。
- id: B2-L22-02
  tags:
  - 限定代词 сам：变格与一致
  task: 写出与人一致的 [сам]{.ru} 的形式（按括号里的格）。
  type: matrix
  cols:
  - 人
  - '[сам]{.ru} 的形式'
  given:
  - 0
  rows:
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[сам]{.ru}'
    hint: 第一格
  - base: '[А́нна]{.ru}'
    cells:
    - '[А́нна]{.ru}'
    - '[сама́]{.ru}'
    hint: 第一格
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[са́ми]{.ru}'
    hint: 第一格
  - base: '[Гага́рин]{.ru}'
    cells:
    - '[Гага́рин]{.ru}'
    - '[самого́]{.ru}'
    hint: 第四格
  - base: '[О́льга Ви́кторовна]{.ru}'
    cells:
    - '[О́льга Ви́кторовна]{.ru}'
    - '[само́й]{.ru}'
    hint: 第三格
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[сами́х]{.ru}'
    hint: 第二格
  - base: '[дире́ктор]{.ru}'
    cells:
    - '[дире́ктор]{.ru}'
    - '[сами́м]{.ru}'
    hint: 第五格
  - base: '[А́нна]{.ru}'
    cells:
    - '[А́нна]{.ru}'
    - '[саму́]{.ru}'
    hint: 第四格
  - base: '[профе́ссор]{.ru}'
    cells:
    - '[профе́ссор]{.ru}'
    - '[само́м]{.ru}'
    hint: 第六格
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[сами́ми]{.ru}'
    hint: 第五格
  - base: '[писа́тель]{.ru}'
    cells:
    - '[писа́тель]{.ru}'
    - '[самому́]{.ru}'
    hint: 第三格
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[сама́]{.ru}'
    hint: 第一格，女
  - base: '[А́нна]{.ru}'
    cells:
    - '[А́нна]{.ru}'
    - '[само́й]{.ru}'
    hint: 第二格
  - base: '[космона́вты]{.ru}'
    cells:
    - '[космона́вты]{.ru}'
    - '[сами́х]{.ru}'
    hint: 第四格
  why: |-
    第 1–3、12 题：第一格按性、数一致：[Ми́ша сам, А́нна сама́, мы са́ми]{.ru}；第 12 题“你”是女性，用 [сама́]{.ru}。[са́ми]{.ru} 是唯一重音在词干的形式。
    第 4、14 题：第四格指人同第二格：[самого́ Гага́рина, сами́х космона́втов]{.ru}。
    第 5、8、13 题：阴性：第四格 [саму́]{.ru}，其余间接格都是 [само́й]{.ru}。
    第 6、7、9–11 题：其余各格重音都在词尾：[сами́х, сами́м, само́м, сами́ми, самому́]{.ru}。
- id: B2-L22-03
  tags:
  - 限定代词 самый：正是、紧挨着
  task: 用 [са́мый]{.ru} 的正确形式填空。
  type: fill
  items:
  - stem: Мы гуля́ли до ___ ве́чера.
    hint: са́мый
    accept:
    - са́мого
  - stem: Их дом в ___ це́нтре Москвы́.
    hint: са́мый
    accept:
    - са́мом
  - stem: С ___ утра́ идёт дождь.
    hint: са́мый
    accept:
    - са́мого
  - stem: Музе́й нахо́дится под ___ па́мятником.
    hint: са́мый
    accept:
    - са́мым
  - stem: Э́то тот ___ фильм!
    hint: са́мый
    accept:
    - са́мый
  - stem: Я прочита́л кни́гу до ___ конца́.
    hint: са́мый
    accept:
    - са́мого
  - stem: Кафе́ на ___ берегу́ реки́.
    hint: са́мый
    accept:
    - са́мом
  - stem: Ты чита́ла ту ___ кни́гу?
    hint: са́мый
    accept:
    - са́мую
  - stem: Па́мятник стои́т пе́ред ___ вхо́дом.
    hint: са́мый
    accept:
    - са́мым
  - stem: Ми́ша засну́л в ___ нача́ле фи́льма.
    hint: са́мый
    accept:
    - са́мом
  why: |-
    第 1、3、6 题：[до, с]{.ru} + 第二格：[до са́мого ве́чера, с са́мого утра́, до са́мого конца́]{.ru}。
    第 2、7、10 题：[в, на]{.ru} + 第六格：[в са́мом це́нтре, на са́мом берегу́, в са́мом нача́ле]{.ru}。
    第 4、9 题：[под, пе́ред]{.ru} + 第五格：[под са́мым па́мятником, пе́ред са́мым вхо́дом]{.ru}。
    第 5、8 题：[тот са́мый]{.ru}“正是那个”，两个词都变：[ту са́мую кни́гу]{.ru}。
    第 1–10 题：[са́мый]{.ru} 按形容词硬变化，重音始终在词干 [са́м-]{.ru}。
- id: B2-L22-04
  tags:
  - 限定代词 сам 与 самый：区分
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Я ви́дел ___ Гага́рина!
    hint: сам
    accept:
    - самого́
  - stem: Я ждал тебя́ с ___ утра́.
    hint: са́мый
    accept:
    - са́мого
  - stem: Мы спроси́ли об э́том ___ профе́ссора.
    hint: сам
    accept:
    - самого́
  - stem: Мы бы́ли там до ___ ве́чера.
    hint: са́мый
    accept:
    - са́мого
  - stem: Э́то письмо́ от ___ дире́ктора.
    hint: сам
    accept:
    - самого́
  - stem: Мы живём у ___ мо́ря.
    hint: са́мый
    accept:
    - са́мого
  - stem: Об э́том расска́зывала ___ А́нна.
    hint: сам
    accept:
    - сама́
  - stem: Апте́ка в ___ конце́ у́лицы.
    hint: са́мый
    accept:
    - са́мом
  - stem: Мы говори́ли с ___ а́втором кни́ги.
    hint: сам
    accept:
    - сами́м
  - stem: Ди́ма живёт в ___ це́нтре.
    hint: са́мый
    accept:
    - са́мом
  - stem: Мы ___ всё сде́лали.
    hint: сам
    accept:
    - са́ми
  - stem: Я позвони́л ___ дире́ктору.
    hint: сам
    accept:
    - самому́
  - stem: Мы рабо́тали до ___ утра́.
    hint: са́мый
    accept:
    - са́мого
  why: |-
    第 1、3、5 题：[сам]{.ru} 的第二、四格 [самого́]{.ru}，重音在词尾，意思是“本人”。
    第 2、4、6 题：[са́мый]{.ru} 的第二格 [са́мого]{.ru}，重音在词干，意思是“正、一直到、紧挨着”。两个词只差重音，书面上看不出，读的时候要分清。第 13 题同。
    第 7、11 题：[сам]{.ru} 第一格和主语一致：[сама́ А́нна, мы са́ми]{.ru}。
    第 8、10 题：[в са́мом]{.ru}，[са́мый]{.ru} 第六格，重音在词干；对照 [сам]{.ru} 的第六格 [само́м]{.ru}。
    第 9、12 题：[сам]{.ru} 第五格 [сами́м]{.ru}、第三格 [самому́]{.ru}，重音在词尾。
