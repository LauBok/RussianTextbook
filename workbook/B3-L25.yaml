heading: 第 25 课　形容词后缀
groups:
- id: B3-L25-01
  lessons:
  - B3-L25
  tags:
  - 形容词后缀：-ск-, -еск- 与交替
  - 形容词后缀：-н-, -янн- 与交替
  - 形容词后缀：-ов- / -ев-
  - 形容词后缀：-лив-, -чив-
  task: 由下列词构成形容词（阳性单数第一格）。
  type: matrix
  cols:
  - 来源词
  - 形容词
  given:
  - 0
  rows:
  - base: '[Росси́я]{.ru}'
    cells:
    - '[Росси́я]{.ru}'
    - '[росси́йский]{.ru}'
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[моско́вский]{.ru}'
  - base: '[го́род]{.ru}'
    cells:
    - '[го́род]{.ru}'
    - '[городско́й]{.ru}'
  - base: '[друг]{.ru}'
    cells:
    - '[друг]{.ru}'
    - '[дру́жеский]{.ru}'
    hint: 友好的，朋友式的
  - base: '[челове́к]{.ru}'
    cells:
    - '[челове́к]{.ru}'
    - '[челове́ческий]{.ru}'
  - base: '[лицо́]{.ru}'
    cells:
    - '[лицо́]{.ru}'
    - '[ли́чный]{.ru}'
  - base: '[кни́га]{.ru}'
    cells:
    - '[кни́га]{.ru}'
    - '[кни́жный]{.ru}'
  - base: '[со́лнце]{.ru}'
    cells:
    - '[со́лнце]{.ru}'
    - '[со́лнечный]{.ru}'
  - base: '[ночь]{.ru}'
    cells:
    - '[ночь]{.ru}'
    - '[ночно́й]{.ru}'
  - base: '[рука́]{.ru}'
    cells:
    - '[рука́]{.ru}'
    - '[ручно́й]{.ru}'
    hint: 手工的，手的
  - base: '[де́рево]{.ru}'
    cells:
    - '[де́рево]{.ru}'
    - '[деревя́нный]{.ru}'
    hint: 木头的，木制的
  - base: '[у́лица]{.ru}'
    cells:
    - '[у́лица]{.ru}'
    - '[у́личный]{.ru}'
    hint: 后缀 -н-
  - base: '[берёза]{.ru}'
    cells:
    - '[берёза]{.ru}'
    - '[берёзовый]{.ru}'
  - base: '[де́ло]{.ru}'
    cells:
    - '[де́ло]{.ru}'
    - '[делово́й]{.ru}'
  - base: '[ключ]{.ru}'
    cells:
    - '[ключ]{.ru}'
    - '[ключево́й]{.ru}'
  - base: '[речь]{.ru}'
    cells:
    - '[речь]{.ru}'
    - '[речево́й]{.ru}'
  - base: '[молча́ть]{.ru}'
    cells:
    - '[молча́ть]{.ru}'
    - '[молчали́вый]{.ru}'
  - base: '[терпе́ть]{.ru}'
    cells:
    - '[терпе́ть]{.ru}'
    - '[терпели́вый]{.ru}'
  - base: '[дождь]{.ru}'
    cells:
    - '[дождь]{.ru}'
    - '[дождли́вый]{.ru}'
  - base: '[разгово́р]{.ru}'
    cells:
    - '[разгово́р]{.ru}'
    - '[разгово́рчивый]{.ru}'
  why: |-
    第 1–3 题：[-ск-]{.ru}：[Росси́я]{.ru} → [росси́йский]{.ru}（[и]{.ru} + [й]{.ru}），[Москва́]{.ru} → [моско́вский]{.ru}；词尾重读时写 [-ско́й]{.ru}：[городско́й]{.ru}。
    第 4、5 题：[-еск-]{.ru} 前 [г]{.ru} 变 [ж]{.ru}，[к]{.ru} 变 [ч]{.ru}：[дру́жеский, челове́ческий]{.ru}。
    第 6–12 题：[-н]{.ru}- 前常有交替：[ц]{.ru} → [ч]{.ru}（[ли́чный, со́лнечный, у́личный]{.ru}），[г]{.ru} → [ж]{.ru}（[кни́жный]{.ru}），[к]{.ru} → [ч]{.ru}（[ручно́й]{.ru}）；[ночь, лес]{.ru} 这类直接加：[ночно́й]{.ru}。表示材料用 [-янн-]{.ru}，写两个 [н]{.ru}：[деревя́нный]{.ru}。
    第 13–16 题：硬辅音后写 [-ов-]{.ru}：[берёзовый, делово́й]{.ru}；[ч]{.ru} 和软辅音 [чь]{.ru} 后，后缀不重读写 [-ев-]{.ru}：[ключево́й, речево́й]{.ru}（重音在词尾 [-о́й]{.ru}，不写 [ключово́й]{.ru}）。
    第 17–19 题：[-лив-]{.ru} 一般重读：[молчали́вый, терпели́вый, дождли́вый]{.ru}。
    第 20 题：[разгово́р]{.ru} 用 [-чив-]{.ru}：[разгово́рчивый]{.ru}。
- id: B3-L25-02
  lessons:
  - B3-L25
  tags:
  - 形容词后缀：名词词组改成形容词 + 名词
  task: 用形容词改写词组。
  type: matrix
  cols:
  - 词组
  - 形容词 + 名词
  given:
  - 0
  rows:
  - base: '[свет со́лнца]{.ru}'
    cells:
    - '[свет со́лнца]{.ru}'
    - '[со́лнечный свет]{.ru}'
  - base: '[у́лица го́рода]{.ru}'
    cells:
    - '[у́лица го́рода]{.ru}'
    - '[городска́я у́лица]{.ru}'
  - base: '[стол из де́рева]{.ru}'
    cells:
    - '[стол из де́рева]{.ru}'
    - '[деревя́нный стол]{.ru}'
  - base: '[магази́н книг]{.ru}'
    cells:
    - '[магази́н книг]{.ru}'
    - '[кни́жный магази́н]{.ru}'
  - base: '[оде́жда для мужчи́н]{.ru}'
    cells:
    - '[оде́жда для мужчи́н]{.ru}'
    - '[мужска́я оде́жда]{.ru}'
  - base: '[жизнь но́чью]{.ru}'
    cells:
    - '[жизнь но́чью]{.ru}'
    - '[ночна́я жизнь]{.ru}'
  - base: '[во́здух ле́са]{.ru}'
    cells:
    - '[во́здух ле́са]{.ru}'
    - '[лесно́й во́здух]{.ru}'
  - base: '[пое́здка по дела́м]{.ru}'
    cells:
    - '[пое́здка по дела́м]{.ru}'
    - '[делова́я пое́здка]{.ru}'
  - base: '[исто́рия Росси́и]{.ru}'
    cells:
    - '[исто́рия Росси́и]{.ru}'
    - '[росси́йская исто́рия]{.ru}'
  - base: '[у́лицы Москвы́]{.ru}'
    cells:
    - '[у́лицы Москвы́]{.ru}'
    - '[моско́вские у́лицы]{.ru}'
  - base: '[пробле́мы люде́й]{.ru}'
    cells:
    - '[пробле́мы люде́й]{.ru}'
    - '[челове́ческие пробле́мы]{.ru}'
  - base: '[письмо́ дру́га]{.ru}'
    cells:
    - '[письмо́ дру́га]{.ru}'
    - '[дру́жеское письмо́]{.ru}'
  why: |-
    第 1–12 题：形容词放在名词前面，与名词的性、数一致：[со́лнечный свет]{.ru}（阳性），[городска́я у́лица]{.ru}（阴性），[дру́жеское письмо́]{.ru}（中性），[моско́вские у́лицы]{.ru}（复数）。
    第 1、4 题：注意 [-н]{.ru}- 前的交替：[со́лнечный, кни́жный]{.ru}。
    第 2、5、8 题：词尾重读的形容词：[городска́я, мужска́я, делова́я]{.ru}；阴性词尾都是 [-а́я]{.ru}。
    第 11、12 题：[-еск-]{.ru} 前的交替：[челове́ческие, дру́жеское]{.ru}。
- id: B3-L25-03
  lessons:
  - B3-L25
  tags:
  - 形容词后缀：性质形容词与关系形容词
  task: 把形容词词组按形容词的类别归栏。
  type: classify
  bins:
  - 性质形容词
  - 关系形容词
  items:
  - text: '[деревя́нный стол]{.ru}'
    answer: 关系形容词
  - text: '[молчали́вый ма́льчик]{.ru}'
    answer: 性质形容词
  - text: '[со́лнечный свет]{.ru}'
    answer: 关系形容词
  - text: '[терпели́вый учи́тель]{.ru}'
    answer: 性质形容词
  - text: '[городска́я у́лица]{.ru}'
    answer: 关系形容词
  - text: '[дождли́вая о́сень]{.ru}'
    answer: 性质形容词
  - text: '[кни́жный магази́н]{.ru}'
    answer: 关系形容词
  - text: '[счастли́вая семья́]{.ru}'
    answer: 性质形容词
  - text: '[лесно́й во́здух]{.ru}'
    answer: 关系形容词
  - text: '[разгово́рчивая сосе́дка]{.ru}'
    answer: 性质形容词
  - text: '[о́чень делово́й челове́к]{.ru}'
    answer: 性质形容词
  - text: '[делова́я пое́здка]{.ru}'
    answer: 关系形容词
  - text: '[мужска́я оде́жда]{.ru}'
    answer: 关系形容词
  - text: '[ночно́й по́езд]{.ru}'
    answer: 关系形容词
  - text: '[берёзовая ро́ща]{.ru}'
    answer: 关系形容词
  - text: '[бо́лее терпели́вый врач]{.ru}'
    answer: 性质形容词
  why: |-
    第 2、4、6、8、10、16 题：[-лив-, -чив-]{.ru} 形容词是性质形容词，说明程度可以变化的特点，有比较级和短尾：[молчали́вее, терпели́в]{.ru}。
    第 1、3、5、7、9、13–15 题：[-ск-, -н-, -ов-]{.ru} 形容词是关系形容词，说明和别的事物的关系（木头的、城市的、书的），没有比较级，不说 [о́чень деревя́нный]{.ru}。
    第 11、12 题：[делово́й]{.ru} 本来是关系形容词：[делова́я пое́здка]{.ru} 因公出行；用在人身上转义为“干练的”，成了性质形容词，可以说 [о́чень делово́й челове́к]{.ru}。
- id: B3-L25-04
  lessons:
  - B3-L25
  tags:
  - 形容词后缀：性质形容词的比较级与短尾
  task: 写出形容词的比较级和阳性短尾；没有这些形式的写“—”。
  type: matrix
  cols:
  - 形容词
  - 比较级
  - 短尾（阳性）
  given:
  - 0
  rows:
  - base: '[молчали́вый]{.ru}'
    cells:
    - '[молчали́вый]{.ru}'
    - '[молчали́вее]{.ru}'
    - '[молчали́в]{.ru}'
  - base: '[деревя́нный]{.ru}'
    cells:
    - '[деревя́нный]{.ru}'
    - —
    - —
  - base: '[терпели́вый]{.ru}'
    cells:
    - '[терпели́вый]{.ru}'
    - '[терпели́вее]{.ru}'
    - '[терпели́в]{.ru}'
  - base: '[городско́й]{.ru}'
    cells:
    - '[городско́й]{.ru}'
    - —
    - —
  - base: '[кни́жный]{.ru}'
    cells:
    - '[кни́жный]{.ru}'
    - —
    - —
  - base: '[болтли́вый]{.ru}'
    cells:
    - '[болтли́вый]{.ru}'
    - '[болтли́вее]{.ru}'
    - '[болтли́в]{.ru}'
    new: true
    gloss: 爱唠叨的
  - base: '[лесно́й]{.ru}'
    cells:
    - '[лесно́й]{.ru}'
    - —
    - —
  - base: '[забо́тливый]{.ru}'
    cells:
    - '[забо́тливый]{.ru}'
    - '[забо́тливее]{.ru}'
    - '[забо́тлив]{.ru}'
    new: true
    gloss: 关心人的，体贴的
  - base: '[мужско́й]{.ru}'
    cells:
    - '[мужско́й]{.ru}'
    - —
    - —
  why: |-
    第 1、3、6、8 题：[-лив-]{.ru} 形容词是性质形容词，比较级加 [-ее]{.ru}，短尾去掉词尾，重音都留在后缀上：[молчали́вее, терпели́в, болтли́в, забо́тлив]{.ru}。
    第 2、4、5、7、9 题：[-янн-, -ск-, -н-]{.ru} 构成的关系形容词没有比较级和短尾，不说 [деревя́ннее, лесне́е]{.ru}。要表示程度时只能换别的词。
