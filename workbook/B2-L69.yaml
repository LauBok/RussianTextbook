heading: 第 69 课　动名词
groups:
- id: B2-L69-01
  tags:
  - 动名词：-ание / -ение / -тие 的构成
  task: 写出动词的动名词。
  type: matrix
  cols:
  - 动词
  - 动名词
  given:
  - 0
  rows:
  - base: '[жела́ть]{.ru}'
    cells:
    - '[жела́ть]{.ru}'
    - '[жела́ние]{.ru}'
  - base: '[понима́ть]{.ru}'
    cells:
    - '[понима́ть]{.ru}'
    - '[понима́ние]{.ru}'
  - base: '[запомина́ть]{.ru}'
    cells:
    - '[запомина́ть]{.ru}'
    - '[запомина́ние]{.ru}'
    new: true
    gloss: 记住
  - base: '[назва́ть]{.ru}'
    cells:
    - '[назва́ть]{.ru}'
    - '[назва́ние]{.ru}'
  - base: '[стара́ться]{.ru}'
    cells:
    - '[стара́ться]{.ru}'
    - '[стара́ние]{.ru}'
  - base: '[реши́ть]{.ru}'
    cells:
    - '[реши́ть]{.ru}'
    - '[реше́ние]{.ru}'
  - base: '[повтори́ть]{.ru}'
    cells:
    - '[повтори́ть]{.ru}'
    - '[повторе́ние]{.ru}'
  - base: '[объясни́ть]{.ru}'
    cells:
    - '[объясни́ть]{.ru}'
    - '[объясне́ние]{.ru}'
  - base: '[изучи́ть]{.ru}'
    cells:
    - '[изучи́ть]{.ru}'
    - '[изуче́ние]{.ru}'
  - base: '[произноси́ть]{.ru}'
    cells:
    - '[произноси́ть]{.ru}'
    - '[произноше́ние]{.ru}'
  - base: '[пригласи́ть]{.ru}'
    cells:
    - '[пригласи́ть]{.ru}'
    - '[приглаше́ние]{.ru}'
  - base: '[откры́ть]{.ru}'
    cells:
    - '[откры́ть]{.ru}'
    - '[откры́тие]{.ru}'
  - base: '[заня́ть]{.ru}'
    cells:
    - '[заня́ть]{.ru}'
    - '[заня́тие]{.ru}'
  why: '第 1–5 题：[-ать]{.ru} 动词（[-ся]{.ru} 去掉）变 [-ание]{.ru}：[жела́ние, понима́ние, запомина́ние, назва́ние, стара́ние]{.ru}。

    第 6–9 题：[-ить]{.ru} 动词变 [-ение]{.ru}：[реше́ние, повторе́ние, объясне́ние, изуче́ние]{.ru}；重音常落在 [-е́ние]{.ru} 上。

    第 10、11 题：[-ение]{.ru} 前的辅音交替和第一人称单数相同：[произношу́ → произноше́ние, приглашу́ → приглаше́ние]{.ru}。

    第 12、13 题：单音节词根的 [-ыть, -ять, -ить]{.ru} 动词用 [-тие]{.ru}：[откры́тие, заня́тие]{.ru}。'
- id: B2-L69-02
  tags:
  - 动名词：支配关系的变化
  task: 把动词词组改成名词词组。
  type: matrix
  cols:
  - 动词词组
  - 名词词组
  given:
  - 0
  rows:
  - base: '[изуча́ть ру́сский язы́к]{.ru}'
    cells:
    - '[изуча́ть ру́сский язы́к]{.ru}'
    - '[изуче́ние ру́сского языка́]{.ru}'
  - base: '[объясня́ть пра́вило]{.ru}'
    cells:
    - '[объясня́ть пра́вило]{.ru}'
    - '[объясне́ние пра́вила]{.ru}'
  - base: '[повторя́ть грамма́тику]{.ru}'
    cells:
    - '[повторя́ть грамма́тику]{.ru}'
    - '[повторе́ние грамма́тики]{.ru}'
  - base: '[откры́ть но́вый магази́н]{.ru}'
    cells:
    - '[откры́ть но́вый магази́н]{.ru}'
    - '[откры́тие но́вого магази́на]{.ru}'
  - base: '[студе́нты понима́ют]{.ru}'
    cells:
    - '[студе́нты понима́ют]{.ru}'
    - '[понима́ние студе́нтов]{.ru}'
  - base: '[произноси́ть зву́ки]{.ru}'
    cells:
    - '[произноси́ть зву́ки]{.ru}'
    - '[произноше́ние зву́ков]{.ru}'
  - base: '[Ван Лэй выступа́ет]{.ru}'
    cells:
    - '[Ван Лэй выступа́ет]{.ru}'
    - '[выступле́ние Ван Лэ́я]{.ru}'
  - base: '[приглаша́ть друзе́й]{.ru}'
    cells:
    - '[приглаша́ть друзе́й]{.ru}'
    - '[приглаше́ние друзе́й]{.ru}'
  - base: '[занима́ться спо́ртом]{.ru}'
    cells:
    - '[занима́ться спо́ртом]{.ru}'
    - '[заня́тия спо́ртом]{.ru}'
  - base: '[выступа́ть на конце́рте]{.ru}'
    cells:
    - '[выступа́ть на конце́рте]{.ru}'
    - '[выступле́ние на конце́рте]{.ru}'
  - base: '[чита́ть стихи́]{.ru}'
    cells:
    - '[чита́ть стихи́]{.ru}'
    - '[чте́ние стихо́в]{.ru}'
    hint: 动名词 [чте́ние]{.ru}
  - base: '[гото́виться к экза́мену]{.ru}'
    cells:
    - '[гото́виться к экза́мену]{.ru}'
    - '[подгото́вка к экза́мену]{.ru}'
    hint: 名词 [подгото́вка]{.ru}
  why: '第 1–4、6、8、11 题：第四格补语变成第二格，形容词跟着变：[изуче́ние ру́сского языка́, объясне́ние пра́вила, откры́тие но́вого магази́на, произноше́ние зву́ков, приглаше́ние друзе́й, чте́ние стихо́в]{.ru}。

    第 5、7 题：动作的主体也变第二格，放在动名词后面：[понима́ние студе́нтов, выступле́ние Ван Лэ́я]{.ru}。

    第 9、10、12 题：其他格和前置词短语不变：[заня́тия спо́ртом]{.ru}（第五格），[на конце́рте]{.ru}，[к экза́мену]{.ru}；“体育活动”通常用复数 [заня́тия]{.ru}。'
- id: B2-L69-03
  tags:
  - 动名词：补语变不变
  task: 把这些词组改成名词词组时，补语或主体变成第二格，还是保持不变？归栏。
  type: classify
  bins:
  - 变成第二格
  - 保持不变
  items:
  - text: '[изуча́ть исто́рию]{.ru}'
    answer: 变成第二格
  - text: '[занима́ться му́зыкой]{.ru}'
    answer: 保持不变
  - text: '[откры́ть вы́ставку]{.ru}'
    answer: 变成第二格
  - text: '[А́нна выступа́ет]{.ru}'
    answer: 变成第二格
  - text: '[поздра́вить с пра́здником]{.ru}'
    answer: 保持不变
  - text: '[пригласи́ть на сва́дьбу]{.ru}'
    answer: 保持不变
  - text: '[реши́ть зада́чу]{.ru}'
    answer: 变成第二格
  - text: '[путеше́ствовать по Росси́и]{.ru}'
    answer: 保持不变
  - text: '[жела́ть верну́ться домо́й]{.ru}'
    answer: 保持不变
  - text: '[Пу́шкин роди́лся]{.ru}'
    answer: 变成第二格
  - text: '[повтори́ть слова́]{.ru}'
    answer: 变成第二格
  - text: '[гото́виться к экза́мену]{.ru}'
    answer: 保持不变
  - text: '[выступа́ть по ра́дио]{.ru}'
    answer: 保持不变
  - text: '[студе́нты понима́ют]{.ru}'
    answer: 变成第二格
  why: '第 1、3、4、7、10、11、14 题：第四格补语和主体变第二格：[изуче́ние исто́рии, откры́тие вы́ставки, выступле́ние А́нны, реше́ние зада́чи, рожде́ние Пу́шкина, повторе́ние слов, понима́ние студе́нтов]{.ru}。

    第 2、5、6、8、9、12、13 题：第五格、前置词短语、不定式不变：[заня́тия му́зыкой, поздравле́ние с пра́здником, приглаше́ние на сва́дьбу, путеше́ствие по Росси́и, жела́ние верну́ться, подгото́вка к экза́мену, выступле́ние по ра́дио]{.ru}。'
- id: B2-L69-04
  tags:
  - 动名词：句中的格
  task: 由括号里的动词构成动名词，按句子要求填空。
  type: fill
  items:
  - stem: По́сле ___ шко́лы Све́та бу́дет поступа́ть в университе́т.
    hint: око́нчить
    accept:
    - оконча́ния
  - stem: Мне помога́ет в ___ языка́ мой друг.
    hint: изуча́ть
    accept:
    - изуче́нии
  - stem: Ван Лэй занима́ется ___ ру́сской грамма́тики.
    hint: изучи́ть
    accept:
    - изуче́нием
  - stem: Спаси́бо за ___!
    hint: пригласи́ть
    accept:
    - приглаше́ние
  - stem: Мы пришли́ на ___ вы́ставки.
    hint: откры́ть
    accept:
    - откры́тие
  - stem: У меня́ пробле́мы с ___ зву́ка «ы».
    hint: произноси́ть
    accept:
    - произноше́нием
  - stem: Без ___ пра́вила тру́дно де́лать упражне́ния.
    hint: объясни́ть
    accept:
    - объясне́ния
  - stem: Ма́ма расска́зывала о своём ___ пое́хать на Байка́л.
    hint: жела́ть
    accept:
    - жела́нии
  - stem: По́сле ___ всех слов мы на́чали чита́ть текст.
    hint: повтори́ть
    accept:
    - повторе́ния
  - stem: На ___ я хожу́ с удово́льствием.
    hint: заня́ть
    accept:
    - заня́тия
  - stem: Он при́нял пра́вильное ___.
    hint: реши́ть
    accept:
    - реше́ние
  - stem: Сего́дня на уро́ке бу́дет ___ стихо́в.
    hint: чита́ть
    accept:
    - чте́ние
  why: '第 2–9、11 题：动名词是中性名词，按 [зда́ние]{.ru} 变格：第二格 [-ия]{.ru}（[без объясне́ния, по́сле повторе́ния]{.ru}），第五格 [-ием]{.ru}（[занима́ется изуче́нием, с произноше́нием]{.ru}），第六格 [-ии]{.ru}（[в изуче́нии, о жела́нии]{.ru}），第四格同第一格（[за приглаше́ние, на откры́тие, реше́ние]{.ru}）。

    第 10 题：“上课”说 [ходи́ть на заня́тия]{.ru}，用复数第四格。

    第 1、12 题：有些动名词不按规则构成，要单独记：[око́нчить → оконча́ние]{.ru}（[по́сле оконча́ния]{.ru}），[чита́ть → чте́ние]{.ru}。'
