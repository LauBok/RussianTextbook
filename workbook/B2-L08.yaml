    - '[сто грамм конфе́т]{.ru}'
  - base: '[па́чка + са́хар]{.ru}'
    cells:
    - '[па́чка + са́хар]{.ru}'
    - '[па́чка са́хара]{.ru}'
  - base: '[килогра́мм + морко́вь]{.ru}'
