  why: |-
    第 1–3、6、9–11、13、14、17、18 题：不可数的东西用单数第二格：[буты́лка воды́, па́чка пече́нья, кусо́к сы́ра, полкило́ мя́са, килогра́мм морко́ви]{.ru}。
    第 4、5、7、8、12、15、16、19 题：可数的东西用复数第二格：[ба́нка огурцо́в, килогра́мм помидо́ров, буке́т роз, деся́ток я́блок, коро́бка карандаше́й, па́чка тетра́дей]{.ru}。
    第 20 题：[ко́фе]{.ru} 不变格：[ба́нка ко́фе]{.ru}。
- id: B2-L08-02
  tags:
  - 度量词本身变格
  task: 只写度量词的形式，后面的名词不用写。
  type: matrix
  cols:
  - 度量词（+ 名词）
  - '2'
  - '5'
  - '[купи́ть]{.ru} …'
  - '[нет]{.ru} …'
  given:
  - 0
  rows:
  - base: '[буты́лка (со́ка)]{.ru}'
    cells:
    - '[буты́лка (со́ка)]{.ru}'
    - '[две буты́лки]{.ru}'
    - '[пять буты́лок]{.ru}'
    - '[буты́лку]{.ru}'
    - '[буты́лки]{.ru}'
  - base: '[коро́бка (конфе́т)]{.ru}'
    cells:
    - '[коро́бка (конфе́т)]{.ru}'
    - '[две коро́бки]{.ru}'
    - '[пять коро́бок]{.ru}'
    - '[коро́бку]{.ru}'
    - '[коро́бки]{.ru}'
  - base: '[па́чка (ча́я)]{.ru}'
    cells:
    - '[па́чка (ча́я)]{.ru}'
    - '[две па́чки]{.ru}'
    - '[пять па́чек]{.ru}'
    - '[па́чку]{.ru}'
    - '[па́чки]{.ru}'
  - base: '[ба́нка (мёда)]{.ru}'
    cells:
    - '[ба́нка (мёда)]{.ru}'
    - '[две ба́нки]{.ru}'
    - '[пять ба́нок]{.ru}'
    - '[ба́нку]{.ru}'
    - '[ба́нки]{.ru}'
  - base: '[паке́т (молока́)]{.ru}'
    cells:
    - '[паке́т (молока́)]{.ru}'
    - '[два паке́та]{.ru}'
    - '[пять паке́тов]{.ru}'
    - '[паке́т]{.ru}'
    - '[паке́та]{.ru}'
  - base: '[литр (молока́)]{.ru}'
    cells:
    - '[литр (молока́)]{.ru}'
    - '[два ли́тра]{.ru}'
    - '[пять ли́тров]{.ru}'
    - '[литр]{.ru}'
    - '[ли́тра]{.ru}'
  - base: '[килогра́мм (я́блок)]{.ru}'
    cells:
    - '[килогра́мм (я́блок)]{.ru}'
    - '[два килогра́мма]{.ru}'
    - '[пять килогра́ммов]{.ru}'
    - '[килогра́мм]{.ru}'
    - '[килогра́мма]{.ru}'
  - base: '[кусо́к (то́рта)]{.ru}'
    cells:
    - '[кусо́к (то́рта)]{.ru}'
    - '[два куска́]{.ru}'
    - '[пять куско́в]{.ru}'
    - '[кусо́к]{.ru}'
    - '[куска́]{.ru}'
  - base: '[буке́т (цвето́в)]{.ru}'
    cells:
    - '[буке́т (цвето́в)]{.ru}'
    - '[два буке́та]{.ru}'
    - '[пять буке́тов]{.ru}'
    - '[буке́т]{.ru}'
    - '[буке́та]{.ru}'
  - base: '[деся́ток (яи́ц)]{.ru}'
    cells:
    - '[деся́ток (яи́ц)]{.ru}'
    - '[два деся́тка]{.ru}'
    - '[пять деся́тков]{.ru}'
    - '[деся́ток]{.ru}'
    - '[деся́тка]{.ru}'
  why: |-
    第 1、2、4 题：阴性度量词：2 后单数第二格 [-и]{.ru}，5 后复数第二格零词尾加 [о]{.ru}：[буты́лок, коро́бок, ба́нок]{.ru}；[купи́ть]{.ru} 后第四格 [-у]{.ru}，[нет]{.ru} 后第二格 [-и]{.ru}。
    第 3 题：[ч]{.ru} 和 [к]{.ru} 之间插 [е]{.ru}：[пять па́чек]{.ru}。
    第 5–7、9 题：阳性非动物名词第四格同第一格：[купи́ть паке́т, литр, килогра́мм]{.ru}；[нет паке́та]{.ru}。
    第 8、10 题：[кусо́к, деся́ток]{.ru} 变格时 [о / е]{.ru} 脱落：[два куска́, пять куско́в]{.ru}，[два деся́тка, пять деся́тков]{.ru}；[куска́, куско́в]{.ru} 重音在词尾。
- id: B2-L08-03
  tags:
  - 度量词：句中
  task: 把括号里的度量词变成正确的形式。
  type: fill
  items:
  - stem: Ма́ма купи́ла три ___ молока́.
    hint: паке́т
    accept:
    - паке́та
  - stem: Возьми́, пожа́луйста, ___ хле́ба.
    hint: кусо́к
    accept:
    - кусо́к
  - stem: На столе́ стоя́ло шесть ___ воды́.
    hint: буты́лка
    accept:
    - буты́лок
  - stem: Для пирога́ на́до две ___ са́хара.
    hint: па́чка
    accept:
    - па́чки
  - stem: В холоди́льнике нет ни одно́й ___ со́ка.
    hint: буты́лка
    accept:
    - буты́лки
  - stem: Ба́бушка ка́ждую неде́лю покупа́ет два ___ яи́ц.
    hint: деся́ток
    accept:
    - деся́тка
  - stem: Ди́ма съел пять ___ пирога́.
    hint: кусо́к
    accept:
    - куско́в
  - stem: Купи́, пожа́луйста, ___ ча́я.
    hint: па́чка
    accept:
    - па́чку
  - stem: Мы вы́пили два ___ со́ка.
    hint: литр
    accept:
    - ли́тра
  - stem: На по́лке стоя́т четы́ре ___ мёда.
    hint: ба́нка
    accept:
    - ба́нки
  - stem: На пра́здник па́па купи́л три ___ цвето́в.
    hint: буке́т
    accept:
    - буке́та
  - stem: У нас нет ни одно́го ___ мя́са.
    hint: килогра́мм
    accept:
    - килогра́мма
  - stem: Ю́ми подари́ла ба́бушке ___ конфе́т.
    hint: коро́бка
    accept:
    - коро́бку
  - stem: Я купи́л де́сять ___ тетра́дей.
    hint: па́чка
    accept:
    - па́чек
  - stem: Для сала́та мне ну́жно полкило́ помидо́ров и два ___ огурцо́в.
    hint: килогра́мм
    accept:
    - килогра́мма
  - stem: Мы взя́ли на да́чу пять ___ молока́.
    hint: паке́т
    accept:
    - паке́тов
  - stem: Ма́ма откры́ла ___ огурцо́в.
    hint: ба́нка
    accept:
    - ба́нку
  why: |-
    第 1、9、11、15 题：阳性度量词，2–4 后单数第二格：[три паке́та, два ли́тра, три буке́та]{.ru}。
    第 2 题：阳性非动物第四格同第一格：[возьми́ кусо́к хле́ба]{.ru}。
    第 3、14 题：5 以上用复数第二格：[шесть буты́лок, де́сять па́чек]{.ru}。
    第 4、10 题：2–4 后单数第二格：[две па́чки, четы́ре ба́нки]{.ru}。
    第 16 题：阳性度量词 5 以上加 [-ов]{.ru}：[пять паке́тов]{.ru}。
    第 5、12 题：否定 [нет ни одно́й / ни одного́]{.ru} 后用第二格：[буты́лки, килогра́мма]{.ru}。
    第 6、7 题：[е / о]{.ru} 脱落：[два деся́тка, пять куско́в]{.ru}。
    第 8、13、17 题：作直接补语用第四格：[купи́ па́чку ча́я, подари́ла коро́бку конфе́т]{.ru}；后面的名词始终是第二格。
