  why: |
    第 1 题：脱落元音，[ц]{.ru} 后重读写 [о]{.ru}：[отцо́м]{.ru}。第 4 题同理 [врачо́м]{.ru}；第 6 题 [ч]{.ru} 后不重读写 [е]{.ru}：[да́чей]{.ru}。
    第 2 题：[-я]{.ru} 重读写 [-ёй]{.ru}：[семьёй]{.ru}。第 7 题：阳性 [-ь]{.ru} 词尾重读写 [-ём]{.ru}：[словарём]{.ru}。
    第 3、9 题：阴性 [-ь]{.ru} 词写 [-ью]{.ru}；[дочь]{.ru} 要加 [-ер-]{.ru}：[до́черью]{.ru}。
    第 5 题：[-ие]{.ru} 加 [-м]{.ru}：[зда́нием]{.ru}。第 8 题：[Ми́ша]{.ru} 按阴性变：[Ми́шей]{.ru}。
    第 10–14 题：代词第五格 [мной, ей, и́ми, кем, собо́й]{.ru}；带前置词时第三人称加 [н-]{.ru}：[с ней, с ни́ми]{.ru}。
    第 15–20 题：修饰语阳性、中性 [-ым / -им]{.ru}，阴性 [-ой / -ей]{.ru}，与名词一起变：[на́шим ста́рым учи́телем, твое́й хоро́шей подру́гой, си́ним мо́рем]{.ru}。第 16 题 [молода́я]{.ru} 阴性第五格 [молодо́й]{.ru}。
- id: L66-综合-b
  lessons: *id001
  tags:
  - 综合：第五格的用法
  recycles:
  - L61-04
  - L62-02
  - L63-02
  - L64-04
  - L66-05
  task: 第五格在句中表示什么？按用法归类。
  type: classify
  bins:
  - 陪同（[с кем?]{.ru}）
  - 带有（[с чем?]{.ru}）
  - 职业（[кем?]{.ru}）
  - 兴趣、活动（[чем?]{.ru}）
  - 方位（[где?]{.ru}）
  items:
  - text: '[Я говорю́ с бра́том.]{.ru}'
    answer: 陪同（[с кем?]{.ru}）
  - text: '[Ма́ма рабо́тает врачо́м.]{.ru}'
    answer: 职业（[кем?]{.ru}）
  - text: '[Ми́ша занима́ется футбо́лом.]{.ru}'
    answer: 兴趣、活动（[чем?]{.ru}）
  - text: '[Ко́шка спит под столо́м.]{.ru}'
    answer: 方位（[где?]{.ru}）
  - text: '[Я пью чай с лимо́ном.]{.ru}'
    answer: 带有（[с чем?]{.ru}）
  - text: '[Он стал инжене́ром.]{.ru}'
    answer: 职业（[кем?]{.ru}）
  - text: '[А́нна интересу́ется му́зыкой.]{.ru}'
    answer: 兴趣、活动（[чем?]{.ru}）
  - text: '[Мы с Ка́тей идём в кино́.]{.ru}'
    answer: 陪同（[с кем?]{.ru}）
  - text: '[Ла́мпа виси́т над столо́м.]{.ru}'
    answer: 方位（[где?]{.ru}）
  - text: '[Ба́бушка де́лает пирожки́ с капу́стой.]{.ru}'
    answer: 带有（[с чем?]{.ru}）
  - text: '[Па́па был дире́ктором.]{.ru}'
    answer: 职业（[кем?]{.ru}）
  - text: '[Пьер занима́ется ру́сским языко́м.]{.ru}'
    answer: 兴趣、活动（[чем?]{.ru}）
  - text: '[Ря́дом с до́мом парк.]{.ru}'
    answer: 方位（[где?]{.ru}）
  - text: '[Ко́фе с молоко́м, пожа́луйста.]{.ru}'
    answer: 带有（[с чем?]{.ru}）
  - text: '[Пьер живёт с дру́гом.]{.ru}'
    answer: 陪同（[с кем?]{.ru}）
  - text: '[Я хочу́ стать перево́дчиком.]{.ru}'
    answer: 职业（[кем?]{.ru}）
  - text: '[Мяч лежи́т за дива́ном.]{.ru}'
    answer: 方位（[где?]{.ru}）
  - text: '[Он интересу́ется исто́рией.]{.ru}'
    answer: 兴趣、活动（[чем?]{.ru}）
  - text: '[Я познако́мился с ва́шим сы́ном.]{.ru}'
    answer: 陪同（[с кем?]{.ru}）
  - text: '[Ма́ма угоща́ет го́стя пирого́м.]{.ru}'
    answer: 带有（[с чем?]{.ru}）
  why: |
    第 1、8、15、19 题：[с]{.ru} + 指人的第五格，表示“和谁一起”；[мы с Ка́тей]{.ru} 是“我和卡佳”；[познако́миться с]{.ru} 也是和人打交道。
    第 5、10、14、20 题：食物、饮料里加的、带的东西；第 20 题 [угоща́ть]{.ru} 后的第五格表示请吃的东西，也回答 [чем?]{.ru}，归入“带有”一栏（食物）。
    第 2、6、11、16 题：[рабо́тать, стать, быть]{.ru} 后的职业名词，回答 [кем?]{.ru}。
    第 3、7、12、18 题：[занима́ться, интересова́ться]{.ru} 后的活动和兴趣对象。
    第 4、9、13、17 题：[под, над, ря́дом с, за]{.ru} 表示位置，回答 [где?]{.ru}。
- id: L66-综合-c
  lessons:
  - L66
  tags:
  - 综合：位置与方向的格
  recycles:
  - L66-03
  task: 写出回答 [где?]{.ru} 和 [куда́?]{.ru} 的两个词组。
  type: matrix
  cols:
  - 前置词 + 名词
  - '[где?]{.ru}'
  - '[куда́?]{.ru}'
  given:
  - 0
  rows:
  - base: '[в + шко́ла]{.ru}'
    cells:
    - '[в + шко́ла]{.ru}'
    - '[в шко́ле]{.ru}'
    - '[в шко́лу]{.ru}'
  - base: '[за + стол]{.ru}'
    cells:
    - '[за + стол]{.ru}'
    - '[за столо́м]{.ru}'
    - '[за стол]{.ru}'
  - base: '[на + рабо́та]{.ru}'
    cells:
    - '[на + рабо́та]{.ru}'
    - '[на рабо́те]{.ru}'
    - '[на рабо́ту]{.ru}'
  - base: '[под + крова́ть]{.ru}'
    cells:
    - '[под + крова́ть]{.ru}'
    - '[под крова́тью]{.ru}'
    - '[под крова́ть]{.ru}'
  - base: '[в + ко́мната]{.ru}'
    cells:
    - '[в + ко́мната]{.ru}'
    - '[в ко́мнате]{.ru}'
    - '[в ко́мнату]{.ru}'
  - base: '[под + дива́н]{.ru}'
    cells:
    - '[под + дива́н]{.ru}'
    - '[под дива́ном]{.ru}'
    - '[под дива́н]{.ru}'
  - base: '[на + по́лка]{.ru}'
    cells:
    - '[на + по́лка]{.ru}'
    - '[на по́лке]{.ru}'
    - '[на по́лку]{.ru}'
  - base: '[за + дом]{.ru}'
    cells:
    - '[за + дом]{.ru}'
    - '[за до́мом]{.ru}'
    - '[за дом]{.ru}'
  - base: '[в + шкаф]{.ru}'
    cells:
    - '[в + шкаф]{.ru}'
    - '[в шкафу́]{.ru}'
    - '[в шкаф]{.ru}'
  - base: '[под + стол]{.ru}'
    cells:
    - '[под + стол]{.ru}'
    - '[под столо́м]{.ru}'
    - '[под стол]{.ru}'
  - base: '[на + стол]{.ru}'
    cells:
    - '[на + стол]{.ru}'
    - '[на столе́]{.ru}'
    - '[на стол]{.ru}'
  - base: '[за + дверь]{.ru}'
    cells:
    - '[за + дверь]{.ru}'
    - '[за две́рью]{.ru}'
    - '[за дверь]{.ru}'
  why: |
    第 1、3、5、7、9、11 题：[в, на]{.ru} 表示位置用第六格，表示方向用第四格：[в шко́ле — в шко́лу]{.ru}，[на по́лке — на по́лку]{.ru}。第 9 题 [шкаф]{.ru} 表示处所用 [-у́]{.ru}：[в шкафу́]{.ru}。
    第 2、4、6、8、10、12 题：[за, под]{.ru} 表示位置用第五格，表示方向用第四格：[за столо́м — за стол]{.ru}，[под крова́тью — под крова́ть]{.ru}。
    第 10、11 题：[под столо́м]{.ru} 在桌子下面，[на столе́]{.ru} 在桌面上，前置词不同，格也不同。
- id: L66-综合-d
  lessons: *id001
  tags:
  - 综合：第五格核查
  recycles:
  - L62-03
  - L64-04
  - L65-05
  - L66-05
  task: 判断句子是否正确；有错的说出错在哪里。
  type: classify
  bins:
  - '[да]{.ru}（正确）'
  - '[нет]{.ru}（有错）'
  items:
  - text: '[Он рабо́тает инжене́р.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Я интересу́юсь му́зыку.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Мы с А́нной идём в кино́.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Ла́мпа виси́т на столо́м.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ми́ша занима́ется спо́ртом.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Он был врач.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Мы сиди́м за стол.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ка́тя идёт в кино́ с ней.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Па́па ста́вит маши́ну за до́мом.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ма́ма — врач.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я пью чай с са́хара.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ко́шка спит под крова́тью.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Она́ ста́ла хоро́шей учи́тельницей.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Он познако́мился с её бра́том.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Пе́редо мной стои́т Ми́ша.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Мы с ним у́чится вме́сте.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ты пьёшь ко́фе без молока́?]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я говорю́ с им.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  why: |
    第 1、6 题：[рабо́тать]{.ru} 和过去时 [был]{.ru} 后职业用第五格：[рабо́тает инжене́ром]{.ru}，[был врачо́м]{.ru}。第 10 题现在时不用系动词，用第一格，正确。
    第 2 题：[интересова́ться]{.ru} 只接第五格：[интересу́юсь му́зыкой]{.ru}。
    第 4 题：“在桌子上方”用 [над]{.ru} + 第五格：[над столо́м]{.ru}；[на]{.ru} 要接第六格 [на столе́]{.ru}，意思也不同。
    第 7 题：[сиде́ть]{.ru} 表示位置，用第五格：[за столо́м]{.ru}。
    第 9 题：[ста́вить]{.ru} 表示放到哪儿去，用第四格：[за дом]{.ru}。
    第 11 题：“加糖”用 [с]{.ru} + 第五格：[с са́харом]{.ru}；第二格用于 [без са́хара]{.ru}，第 17 题正确。
    第 16 题：[мы с ним]{.ru} 是两个人，谓语用复数：[у́чимся]{.ru}。
    第 18 题：前置词后第三人称代词加 [н-]{.ru}：[с ним]{.ru}。
    第 3、5、8、12–15 题：形式和用法都正确。第 15 题 [пе́ред]{.ru} 在 [мной]{.ru} 前写成 [пе́редо]{.ru}。
- id: L66-综合-e
  lessons: *id001
  tags:
  - 综合：第五格句中填空
  recycles:
  - L62-01
  - L63-04
  - L64-04
  - L65-06
  - L66-05
  task: 把括号里的词变成第五格填空。
  type: fill
  items:
  - stem: Я ча́сто говорю́ с ___.
    hint: он
    accept:
    - ним
  - stem: Его́ брат рабо́тает ___.
    hint: гла́вный врач
    accept:
    - гла́вным врачо́м
  - stem: Ко́шка сиди́т под ___.
    hint: наш стол
    accept:
    - на́шим столо́м
  - stem: Ты занима́ешься ___?
    hint: пла́вание
    accept:
    - пла́ванием
  - stem: Вчера́ мы познако́мились с ___.
    hint: её сестра́
    accept:
    - её сестро́й
  - stem: Ба́бушка угоща́ет нас ___.
    hint: вишнёвое варе́нье
    accept:
    - вишнёвым варе́ньем
  - stem: Ка́тя хо́чет стать ___.
    hint: настоя́щая арти́стка
    accept:
    - настоя́щей арти́сткой
  - stem: Что виси́т над ___?
    hint: твоя́ крова́ть
    accept:
    - твое́й крова́тью
  - stem: Ми́ша игра́ет в ша́хматы ___.
    hint: с + я
    accept:
    - со мной
  - stem: Ме́жду ___ и окно́м стои́т стол.
    hint: дверь
    accept:
    - две́рью
  - stem: Па́па был ___.
    hint: хоро́ший инжене́р
    accept:
    - хоро́шим инжене́ром
  - stem: — Чем ты интересу́ешься? — ___.
    hint: ру́сская литерату́ра
    accept:
    - Ру́сской литерату́рой
  - stem: Мы с ___ идём в теа́тр.
    hint: Та́ня
    accept:
    - Та́ней
  - stem: Мари́я Никола́евна разгова́ривает с ___.
    hint: э́тот врач
    accept:
    - э́тим врачо́м
  why: |
    第 1 题：前置词后第三人称代词加 [н-]{.ru}：[с ним]{.ru}。第 9 题：“和我”写成 [со мной]{.ru}。
    第 2、11 题：[рабо́тать, быть]{.ru} 后职业用第五格；[ч]{.ru} 后重读写 [-о́м]{.ru}：[гла́вным врачо́м]{.ru}；[ш]{.ru} 后形容词阳性写 [-им]{.ru}：[хоро́шим инжене́ром]{.ru}。
    第 3、8、10 题：方位前置词表示位置，用第五格：[под на́шим столо́м, над твое́й крова́тью, ме́жду две́рью и окно́м]{.ru}。
    第 4、12 题：[занима́ться, интересова́ться]{.ru} 接第五格：[пла́ванием, ру́сской литерату́рой]{.ru}。
    第 5 题：[её]{.ru} 作物主代词不变：[с её сестро́й]{.ru}。
    第 6 题：[угоща́ть]{.ru} 用第五格表示请吃的东西。
    第 7 题：[стать]{.ru} 接第五格；[щ]{.ru} 后不重读写 [-ей]{.ru}：[настоя́щей арти́сткой]{.ru}。
    第 13 题：[мы с Та́ней]{.ru}“我和塔尼亚”，[-я]{.ru} 不重读写 [-ей]{.ru}。
    第 14 题：[э́тот]{.ru} 第五格 [э́тим]{.ru}：[с э́тим врачо́м]{.ru}。
