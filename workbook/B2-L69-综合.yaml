    answer: 做事的人
  - text: '[шко́льница]{.ru}'
    answer: 女性
  - text: '[произноше́ние]{.ru}'
    answer: 动作、过程或结果
  - text: '[неве́жливый]{.ru}'
    answer: 意思相反
  - text: '[гро́мко]{.ru}'
    answer: 怎样（副词）
  - text: '[отли́чница]{.ru}'
    answer: 女性
  - text: '[заня́тие]{.ru}'
