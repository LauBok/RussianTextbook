  why: '第 1–8 题：做事的人：去 [-ть]{.ru} 加 [-тель]{.ru}，女性再加 [-ница]{.ru}；动名词：[-ать → -ание]{.ru}，[-ить → -ение]{.ru}：[преподава́ние, уче́ние]{.ru}。

    第 1 题：[чита́ть]{.ru} 的动名词不规则：[чте́ние]{.ru}。

    第 4、7 题：[-ение]{.ru} 前的交替同第一人称单数：[посещу́ → посеще́ние, приглашу́ → приглаше́ние]{.ru}。

    第 5 题：[покупа́ть]{.ru} 没有 [-ние]{.ru} 动名词（“购买”说 [поку́пка]{.ru}）。

    第 6、8 题：[изуча́ть, пригласи́ть, жела́ть]{.ru} 没有 [-тель]{.ru} 名词；[изуча́ть]{.ru} 的动名词来自完成体 [изучи́ть]{.ru}：[изуче́ние]{.ru}。'
