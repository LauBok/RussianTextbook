  why: '第 1、2、7、8、13、14 题：[-тель, -ник]{.ru}：做某事、有某种特点的人（阳性）。

    第 3、9、15、19 题：[-ница]{.ru}：女性：[учи́тельница, писа́тельница, шко́льница, отли́чница]{.ru}。

    第 4、10、16、20 题：[-ние, -тие]{.ru}：由动词构成的中性名词：[реше́ние, откры́тие, произноше́ние, заня́тие]{.ru}。

    第 5、11、17、21 题：[не-]{.ru} 和后面的词连写，意思相反：[непра́вда, незнако́мый, неве́жливый, недорого́й]{.ru}。

    第 6、12、18、22 题：形容词去掉词尾加 [-о]{.ru} 构成副词（第 26 课）：[бы́стро, интере́сно, гро́мко, ти́хо]{.ru}。'
- id: B2-L69-综合-c
  lessons:
  - B2-L26
  - B2-L68
  - B2-L69
  tags:
  - 综合：句中填派生词
  recycles:
  - B2-L68-04
  - B2-L69-04
  task: 由括号里的词构成派生词，按句子要求填空。
  type: fill
  items:
  - stem: Мой оте́ц — ___, он во́дит авто́бус.
    hint: води́ть
    accept:
    - води́тель
  - stem: Ната́ша — ___, у неё все пятёрки.
    hint: отли́чно
    accept:
    - отли́чница
  - stem: ___ ру́сского языка́ тре́бует вре́мени.
    hint: изуча́ть
    accept:
    - изуче́ние
  - stem: Пу́шкин — люби́мый ___ мно́гих ру́сских.
    hint: писа́ть
    accept:
    - писа́тель
  - stem: Спаси́бо за ___ пра́вила.
    hint: объясни́ть
    accept:
    - объясне́ние
  - stem: Он говори́т по-ру́сски о́чень ___.
    hint: бы́стрый
    accept:
    - бы́стро
  - stem: Э́то ___ кни́га, она́ сто́ит сто рубле́й.
    hint: дорого́й；意思相反
    accept:
    - недорога́я
  - stem: Писа́тельница ча́сто встреча́ется со свои́ми ___.
    hint: чита́ть
    accept:
    - чита́телями
  - stem: По́сле ___ ле́кции студе́нты задава́ли вопро́сы.
    hint: око́нчить
    accept:
    - оконча́ния
  - stem: Мари́я Никола́евна — врач, а её сестра́ — ___.
    hint: учи́ть；女
    accept:
    - учи́тельница
  - stem: Он отве́тил ___ и да́же не посмотре́л на нас.
    hint: ве́жливый；意思相反
    accept:
    - неве́жливо
  - stem: Музе́й ждёт ___.
    hint: посети́ть
    accept:
    - посети́телей
  why: '第 1、2、4、8、10、12 题：表示人的名词按句子变格：[со свои́ми чита́телями]{.ru}（复数第五格），[ждёт посети́телей]{.ru}（动物名词复数第四格同第二格）；女性用 [-ница]{.ru}：[отли́чница, учи́тельница]{.ru}。

    第 3、5、9 题：动名词：[изуче́ние ру́сского языка́]{.ru}（作主语用第一格），[за объясне́ние]{.ru}，[по́сле оконча́ния]{.ru}（[оконча́ние]{.ru} 不规则）。

    第 6 题：修饰动词用副词：[говори́т бы́стро]{.ru}。

    第 7、11 题：[не-]{.ru} 和形容词、副词连写：[недорога́я]{.ru}（和 [кни́га]{.ru} 一致），[неве́жливо]{.ru}（修饰动词用副词）。'
