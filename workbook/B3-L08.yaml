heading: 第 8 课　形容词化与名词化的形动词
groups:
- id: B3-L08-01
  lessons:
  - B3-L08
  tags:
  - 名词化的形动词：变格
  task: 写出第二、三、五、六格。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[учёный]{.ru}'
    cells:
    - '[учёный]{.ru}'
    - '[учёного]{.ru}'
    - '[учёному]{.ru}'
    - '[учёным]{.ru}'
    - '[об учёном]{.ru}'
  - base: '[учёные]{.ru}'
    cells:
    - '[учёные]{.ru}'
    - '[учёных]{.ru}'
    - '[учёным]{.ru}'
    - '[учёными]{.ru}'
    - '[об учёных]{.ru}'
  - base: '[уча́щиеся]{.ru}'
    cells:
    - '[уча́щиеся]{.ru}'
    - '[уча́щихся]{.ru}'
    - '[уча́щимся]{.ru}'
    - '[уча́щимися]{.ru}'
    - '[об уча́щихся]{.ru}'
  - base: '[отдыха́ющие]{.ru}'
    cells:
    - '[отдыха́ющие]{.ru}'
    - '[отдыха́ющих]{.ru}'
    - '[отдыха́ющим]{.ru}'
    - '[отдыха́ющими]{.ru}'
    - '[об отдыха́ющих]{.ru}'
  - base: '[прису́тствующие]{.ru}'
    cells:
    - '[прису́тствующие]{.ru}'
    - '[прису́тствующих]{.ru}'
    - '[прису́тствующим]{.ru}'
    - '[прису́тствующими]{.ru}'
    - '[о прису́тствующих]{.ru}'
  - base: '[начина́ющие]{.ru}'
    cells:
    - '[начина́ющие]{.ru}'
    - '[начина́ющих]{.ru}'
    - '[начина́ющим]{.ru}'
    - '[начина́ющими]{.ru}'
    - '[о начина́ющих]{.ru}'
  - base: '[провожа́ющие]{.ru}'
    cells:
    - '[провожа́ющие]{.ru}'
    - '[провожа́ющих]{.ru}'
    - '[провожа́ющим]{.ru}'
    - '[провожа́ющими]{.ru}'
    - '[о провожа́ющих]{.ru}'
  - base: '[жела́ющие]{.ru}'
    cells:
    - '[жела́ющие]{.ru}'
    - '[жела́ющих]{.ru}'
    - '[жела́ющим]{.ru}'
    - '[жела́ющими]{.ru}'
    - '[о жела́ющих]{.ru}'
  - base: '[уча́щийся]{.ru}'
    cells:
    - '[уча́щийся]{.ru}'
    - '[уча́щегося]{.ru}'
    - '[уча́щемуся]{.ru}'
    - '[уча́щимся]{.ru}'
    - '[об уча́щемся]{.ru}'
  - base: '[встреча́ющие]{.ru}'
    cells:
    - '[встреча́ющие]{.ru}'
    - '[встреча́ющих]{.ru}'
    - '[встреча́ющим]{.ru}'
    - '[встреча́ющими]{.ru}'
    - '[о встреча́ющих]{.ru}'
    new: true
    gloss: 迎接的人
  why: |-
    第 1、2 题：[учёный]{.ru} 作名词仍按形容词变格：单数 [учёного, учёному, учёным, об учёном]{.ru}，复数 [учёных, учёным, учёными, об учёных]{.ru}。注意单数第五格和复数第三格都是 [учёным]{.ru}。
    第 3–8、10 题：名词化的主动形动词按 [хоро́ший]{.ru} 的复数变格：第二、六格 [-их]{.ru}，第三格 [-им]{.ru}，第五格 [-ими]{.ru}：[отдыха́ющих, прису́тствующим, начина́ющими]{.ru}。第 3 题 [-ся]{.ru} 放在格词尾后面：[уча́щихся, уча́щимся, уча́щимися]{.ru}。常见错误是按名词变格，写成 [с отдыха́ющиями]{.ru} 之类。
    第 9 题：单数按 [хоро́ший]{.ru} 的阳性变格：[уча́щегося, уча́щемуся, уча́щимся, об уча́щемся]{.ru}。
    第 1–4、9 题：元音前用 [об]{.ru}：[об учёном, об уча́щихся, об отдыха́ющих, об уча́щемся]{.ru}。
- id: B3-L08-02
  lessons:
  - B3-L08
  tags:
  - 名词化的形动词：句中的格
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Э́ти уче́бники — для ___.
    hint: уча́щиеся
    accept:
    - уча́щихся
  - stem: Врач подошёл к ___ на пля́же.
    hint: отдыха́ющие
    accept:
    - отдыха́ющим
  - stem: Среди́ ___ бы́ли журнали́сты.
    hint: прису́тствующие
    accept:
    - прису́тствующих
  - stem: Преподава́тель дал ___ просто́е зада́ние.
    hint: начина́ющие
    accept:
    - начина́ющим
  - stem: Пассажи́ры ма́хали ___ из окна́.
    hint: провожа́ющие
    accept:
    - провожа́ющим
    new: true
    gloss: ма́хать 挥手
  - stem: Запиши́те фами́лии всех ___.
    hint: жела́ющие
    accept:
    - жела́ющих
  - stem: Он стал изве́стным ___.
    hint: учёный
    accept:
    - учёным
  - stem: На конфере́нции выступа́ли ___ из ра́зных стран.
    hint: учёный
    accept:
    - учёные
  - stem: Дире́ктор поблагодари́л ___ за внима́ние.
    hint: прису́тствующие
    accept:
    - прису́тствующих
  - stem: Мы говори́ли об ___ на́шей шко́лы.
    hint: уча́щиеся
    accept:
    - уча́щихся
  - stem: Тре́нер лю́бит рабо́тать с ___.
    hint: начина́ющие
    accept:
    - начина́ющими
  - stem: Ле́том на берегу́ мо́ря бы́ло мно́го ___.
    hint: отдыха́ющие
    accept:
    - отдыха́ющих
  - stem: Учи́тельница вошла́ в класс и поздоро́валась с ___.
    hint: уча́щиеся
    accept:
    - уча́щимися
  - stem: На вокза́ле бы́ло мно́го ___.
    hint: провожа́ющие
    accept:
    - провожа́ющих
  - stem: Профе́ссор рассказа́л ___ о свое́й рабо́те.
    hint: прису́тствующие
    accept:
    - прису́тствующим
  - stem: Мы пригласи́ли на пра́здник всех ___.
    hint: жела́ющие
    accept:
    - жела́ющих
  why: |-
    第 1、3、6、10、12、14 题：前置词 [для, среди́, об]{.ru} 和 [всех, мно́го]{.ru} 后用复数第二格（第六格同形）：[уча́щихся, прису́тствующих, жела́ющих, отдыха́ющих]{.ru}。
    第 2、4、5、15 题：第三格 [-им]{.ru}：[к отдыха́ющим, дал начина́ющим, ма́хали провожа́ющим, рассказа́л прису́тствующим]{.ru}（[ма́хать кому́]{.ru}）。
    第 7 题：[стать]{.ru} 后用第五格，单数：[изве́стным учёным]{.ru}。第 8 题：主语，复数第一格 [учёные]{.ru}。
    第 9、16 题：[поблагодари́ть, пригласи́ть]{.ru} 要求第四格，指人的复数第四格同第二格：[прису́тствующих, жела́ющих]{.ru}。
    第 11、13 题：[с]{.ru} + 第五格 [начина́ющими, уча́щимися]{.ru}，[-ся]{.ru} 放在最后。
- id: B3-L08-03
  lessons:
  - B3-L08
  tags:
  - 名词化的形动词：改错
  - 形容词化的形动词：-н- 与 -нн-
  task: 改正错误，正确的照抄。
  type: matrix
  cols:
  - 原文
  - 改正
  given:
  - 0
  rows:
  - base: '[с отдыха́ющиеми]{.ru}'
    cells:
    - '[с отдыха́ющиеми]{.ru}'
    - '[с отдыха́ющими]{.ru}'
  - base: '[Прису́тствующие лю́ди до́лго аплоди́ровали.]{.ru}'
    cells:
    - '[Прису́тствующие лю́ди до́лго аплоди́ровали.]{.ru}'
    - '[Прису́тствующие до́лго аплоди́ровали.]{.ru}'
  - base: '[ра́ненный солда́т]{.ru}'
    cells:
    - '[ра́ненный солда́т]{.ru}'
    - '[ра́неный солда́т]{.ru}'
  - base: '[для уча́щихсь]{.ru}'
    cells:
    - '[для уча́щихсь]{.ru}'
    - '[для уча́щихся]{.ru}'
  - base: '[Он стал изве́стным учёным.]{.ru}'
    cells:
    - '[Он стал изве́стным учёным.]{.ru}'
    - '[Он стал изве́стным учёным.]{.ru}'
  - base: '[Я разгова́ривал с учёном.]{.ru}'
    cells:
    - '[Я разгова́ривал с учёном.]{.ru}'
    - '[Я разгова́ривал с учёным.]{.ru}'
  - base: '[Вход то́лько для уча́щиеся.]{.ru}'
    cells:
    - '[Вход то́лько для уча́щиеся.]{.ru}'
    - '[Вход то́лько для уча́щихся.]{.ru}'
  - base: '[веду́щая балери́на]{.ru}'
    cells:
    - '[веду́щая балери́на]{.ru}'
    - '[веду́щая балери́на]{.ru}'
  - base: '[Все жела́ющих мо́гут прийти́.]{.ru}'
    cells:
    - '[Все жела́ющих мо́гут прийти́.]{.ru}'
    - '[Все жела́ющие мо́гут прийти́.]{.ru}'
  - base: '[Провожа́ющие, вы́йдите из ваго́нов!]{.ru}'
    cells:
    - '[Провожа́ющие, вы́йдите из ваго́нов!]{.ru}'
    - '[Провожа́ющие, вы́йдите из ваго́нов!]{.ru}'
  - base: '[по́мощь начина́ющем]{.ru}'
    cells:
    - '[по́мощь начина́ющем]{.ru}'
    - '[по́мощь начина́ющим]{.ru}'
  - base: '[ра́неный в ру́ку солда́т]{.ru}'
    cells:
    - '[ра́неный в ру́ку солда́т]{.ru}'
    - '[ра́ненный в ру́ку солда́т]{.ru}'
  why: |-
    第 1、4、6、7、11 题：名词化的形动词按形容词变格：[с отдыха́ющими]{.ru}（第五格 [-ими]{.ru}），[для уча́щихся]{.ru}（第二格，[-ся]{.ru} 在格词尾后，不改 [-сь]{.ru}），[с учёным]{.ru}，[по́мощь начина́ющим]{.ru}（第三格）。
    第 9 题：[все жела́ющие]{.ru} 是主语，用第一格。
    第 2 题：名词化以后一般不再加名词，[прису́тствующие]{.ru} 本身就指“在场的人”。
    第 3、12 题：不带从属词的 [ра́неный]{.ru} 是形容词，一个 [н]{.ru}；带了 [в ру́ку]{.ru} 就是形动词，写 [нн]{.ru}。
    第 5、8、10 题：原文正确，照抄。
- id: B3-L08-04
  lessons:
  - B3-L08
  tags:
  - 形容词化与名词化的形动词：区分
  task: 这些词组和句子里的形动词属于哪一类？归栏。
  type: classify
  bins:
  - 形动词
  - 形容词化
  - 名词化
  items:
  - text: '[веду́щая балери́на]{.ru}'
    answer: 形容词化
  - text: '[доро́га, веду́щая к мо́рю]{.ru}'
    answer: 形动词
  - text: '[Начина́ющие ча́сто де́лают оши́бки.]{.ru}'
    answer: 名词化
  - text: '[бы́вший дире́ктор шко́лы]{.ru}'
    answer: 形容词化
  - text: '[студе́нты, начина́ющие изуча́ть язы́к]{.ru}'
    answer: 形动词
  - text: '[Уважа́емые колле́ги!]{.ru}'
    answer: 形容词化
  - text: '[журна́л, уважа́емый все́ми чита́телями]{.ru}'
    answer: 形动词
  - text: '[Прису́тствующие до́лго аплоди́ровали.]{.ru}'
    answer: 名词化
  - text: '[Мы разгова́ривали с отдыха́ющими.]{.ru}'
    answer: 名词化
  - text: '[тури́сты, отдыха́ющие на мо́ре]{.ru}'
    answer: 形动词
  - text: '[блестя́щий арти́ст]{.ru}'
    answer: 形容词化
  - text: '[вода́, блестя́щая на со́лнце]{.ru}'
    answer: 形动词
  - text: '[Вход то́лько для уча́щихся.]{.ru}'
    answer: 名词化
  - text: '[люби́мая кни́га]{.ru}'
    answer: 形容词化
  - text: '[кни́га, люби́мая детьми́]{.ru}'
    answer: 形动词
  - text: '[ра́неный солда́т]{.ru}'
    answer: 形容词化
  - text: '[Все жела́ющие мо́гут записа́ться.]{.ru}'
    answer: 名词化
  - text: '[лю́ди, жела́ющие помо́чь]{.ru}'
    answer: 形动词
  - text: '[учёная сте́пень]{.ru}'
    answer: 形容词化
  - text: '[Он изве́стный учёный.]{.ru}'
    answer: 名词化
  why: |-
    第 2、5、7、10、12、15、18 题：带补语或状语，能换成 [кото́рый]{.ru} 从句，是形动词：[доро́га, кото́рая ведёт к мо́рю]{.ru}，[журна́л, кото́рый уважа́ют чита́тели]{.ru}，[вода́, кото́рая блести́т на со́лнце]{.ru}。
    第 1、4、6、11、14、16、19 题：不带从属词，表示固定特征，意思和动词不同，是形容词化的形动词：[веду́щая]{.ru} 领衔的，[бы́вший]{.ru} 原来的，[уважа́емые]{.ru} 尊敬的，[блестя́щий]{.ru} 出色的，[люби́мая]{.ru} 心爱的，[ра́неный]{.ru}（一个 [н]{.ru}）受伤的，[учёная сте́пень]{.ru} 学位。
    第 3、8、9、13、17、20 题：单独使用，指一类人，在句中作主语或补语，是名词化的形动词：[начина́ющие]{.ru} 初学者，[прису́тствующие]{.ru} 在场的人，[с отдыха́ющими]{.ru}，[для уча́щихся]{.ru}，[все жела́ющие]{.ru}，[учёный]{.ru} 学者。
