  - {base: '[пло́щадь]{.ru}', hint: f, cells: ['[пло́щадь]{.ru}', '[пло́щади]{.ru}']}
  - {base: '[мать]{.ru}', hint: '[ма́тери]{.ru}', cells: ['[мать]{.ru}', '[ма́тери]{.ru}']}
  - {base: '[дочь]{.ru}', hint: '[до́чери]{.ru}', cells: ['[дочь]{.ru}', '[до́чери]{.ru}']}
  - {base: '[па́па]{.ru}', cells: ['[па́па]{.ru}', '[па́пе]{.ru}']}
  - {base: '[Ми́ша]{.ru}', cells: ['[Ми́ша]{.ru}', '[Ми́ше]{.ru}']}
  - {base: '[де́душка]{.ru}', cells: ['[де́душка]{.ru}', '[де́душке]{.ru}']}
  - {base: '[дя́дя]{.ru}', cells: ['[дя́дя]{.ru}', '[дя́де]{.ru}']}
  why: |
    第 1–7 题：阴性 [-а / -я]{.ru} 名词第三格换成 [-е]{.ru}，和第六格同形：[ма́ме, Та́не, сестре́]{.ru}。
    第 8–10 题：[-ия]{.ru} 结尾的名词用 [-ии]{.ru}：[Мари́и, Росси́и, исто́рии]{.ru}，不写 [-ие]{.ru}。
    第 11、12 题：以 [-ь]{.ru} 结尾的阴性名词用 [-и]{.ru}：[тетра́ди, пло́щади]{.ru}。
    第 13、14 题：[мать, дочь]{.ru} 变格时词干加 [-ер-]{.ru}：[ма́тери, до́чери]{.ru}，重音在词干。
    第 15–18 题：以 [-а / -я]{.ru} 结尾的阳性名词按阴性变：[па́пе, Ми́ше, де́душке, дя́де]{.ru}。
- id: L51-03
  tags: [第一变位现在时：-авать 类与 -овать 类]
  task: 写出动词的现在时人称形式。
  type: matrix
  cols: [不定式, '[я]{.ru}', '[ты]{.ru}', '[он / она́]{.ru}', '[мы]{.ru}', '[вы]{.ru}', '[они́]{.ru}']
  given: [0]
  rows:
  - {base: '[передава́ть]{.ru}', hint: 'I；[передаю́, передаёшь]{.ru}', cells: ['[передава́ть]{.ru}', '[передаю́]{.ru}', '[передаёшь]{.ru}', '[передаёт]{.ru}', '[передаём]{.ru}', '[передаёте]{.ru}', '[передаю́т]{.ru}']}
  - {base: '[дава́ть]{.ru}', cells: ['[дава́ть]{.ru}', '[даю́]{.ru}', '[даёшь]{.ru}', '[даёт]{.ru}', '[даём]{.ru}', '[даёте]{.ru}', '[даю́т]{.ru}']}
  - {base: '[продава́ть]{.ru}', new: true, gloss: 卖, cells: ['[продава́ть]{.ru}', '[продаю́]{.ru}', '[продаёшь]{.ru}', '[продаёт]{.ru}', '[продаём]{.ru}', '[продаёте]{.ru}', '[продаю́т]{.ru}']}
  - {base: '[встава́ть]{.ru}', new: true, gloss: 起床（未完成体）, cells: ['[встава́ть]{.ru}', '[встаю́]{.ru}', '[встаёшь]{.ru}', '[встаёт]{.ru}', '[встаём]{.ru}', '[встаёте]{.ru}', '[встаю́т]{.ru}']}
  - {base: '[узнава́ть]{.ru}', new: true, gloss: 认出；打听到, cells: ['[узнава́ть]{.ru}', '[узнаю́]{.ru}', '[узнаёшь]{.ru}', '[узнаёт]{.ru}', '[узнаём]{.ru}', '[узнаёте]{.ru}', '[узнаю́т]{.ru}']}
  - {base: '[преподава́ть]{.ru}', new: true, gloss: 教（课）, cells: ['[преподава́ть]{.ru}', '[преподаю́]{.ru}', '[преподаёшь]{.ru}', '[преподаёт]{.ru}', '[преподаём]{.ru}', '[преподаёте]{.ru}', '[преподаю́т]{.ru}']}
  - {base: '[сове́товать]{.ru}', hint: 'I；[сове́тую, сове́туешь]{.ru}', cells: ['[сове́товать]{.ru}', '[сове́тую]{.ru}', '[сове́туешь]{.ru}', '[сове́тует]{.ru}', '[сове́туем]{.ru}', '[сове́туете]{.ru}', '[сове́туют]{.ru}']}
  - {base: '[рисова́ть]{.ru}', hint: 'I；[рису́ю, рису́ешь]{.ru}', new: true, gloss: 画画, cells: ['[рисова́ть]{.ru}', '[рису́ю]{.ru}', '[рису́ешь]{.ru}', '[рису́ет]{.ru}', '[рису́ем]{.ru}', '[рису́ете]{.ru}', '[рису́ют]{.ru}']}
  why: |
    第 1–6 题：[-ава́ть]{.ru} 类动词现在时去掉 [-ва-]{.ru}，词干以 [-а-]{.ru} 结尾，词尾重读：[-ю́, -ёшь, -ёт, -ём, -ёте, -ю́т]{.ru}，[ё]{.ru} 一定写出。不能写成 [передава́ю]{.ru}。
    第 7、8 题：[-ова́ть]{.ru} 类动词现在时把 [-ова-]{.ru} 换成 [-у-]{.ru}，再加 [-ю, -ешь…]{.ru}：[сове́тую, рису́ю]{.ru}。重音和 [я]{.ru} 的形式一致，各人称不移动。
- id: L51-04
  tags: [名词单数第三格：动词支配]
  task: 用括号里名词的适当形式填空（注意哪个动词不要求第三格）。
  type: fill
  items:
  - {stem: 'Ван Лэй звони́т ___.', hint: ма́ма, accept: [ма́ме]}
  - {stem: 'А́нна пи́шет сообще́ние ___.', hint: ба́бушка, accept: [ба́бушке]}
  - {stem: 'Что мы пода́рим ___?', hint: брат, accept: [бра́ту]}
  - {stem: 'Ма́ма передаёт приве́т ___.', hint: Ива́н Серге́евич, accept: [Ива́ну Серге́евичу]}
  - {stem: 'Па́па сове́тует ___ чита́ть ка́ждый день.', hint: сын, accept: [сы́ну]}
  - {stem: 'Ми́ша расска́зывает ___ о шко́ле.', hint: па́па, accept: [па́пе]}
  - {stem: 'Ю́ми пи́шет письмо́ ___.', hint: подру́га, accept: [подру́ге]}
  - {stem: 'Я спра́шиваю ___ о Москве́.', hint: ба́бушка, accept: [ба́бушку]}
  - {stem: 'Что ты говори́шь ___?', hint: Ми́ша, accept: [Ми́ше]}
  - {stem: 'Пьер звони́т ___.', hint: преподава́тель, accept: [преподава́телю]}
  - {stem: 'А́нна да́рит ___ кни́гу.', hint: Мари́я Никола́евна, accept: [Мари́и Никола́евне]}
  - {stem: 'Ван Лэй передаёт приве́т ___.', hint: оте́ц, accept: [отцу́]}
  - {stem: 'Мы сове́туем ___ отдыха́ть.', hint: учи́тель, accept: [учи́телю]}
  - {stem: 'Я ча́сто звоню́ ___.', hint: дочь, accept: [до́чери]}
  - {stem: 'Ми́ша спра́шивает ___ о Кита́е.', hint: брат, accept: [бра́та]}
  - {stem: 'Та́ня пи́шет ___ о Пеки́не.', hint: Серге́й, accept: [Серге́ю]}
  why: |
    第 1–7、9–14、16 题：[звони́ть, писа́ть, дари́ть, передава́ть приве́т, сове́товать, расска́зывать, говори́ть]{.ru} 的对象（给谁、对谁）用第三格。
    第 4、11 题：名字和父称各自变格：[Ива́ну Серге́евичу, Мари́и Никола́евне]{.ru}。
    第 6、9 题：[па́па, Ми́ша]{.ru} 是阳性，但按阴性变：[па́пе, Ми́ше]{.ru}。
    第 12 题：[оте́ц]{.ru} 变格时 [е]{.ru} 脱落：[отцу́]{.ru}。第 14 题：[дочь → до́чери]{.ru}。
    第 8、15 题：[спра́шивать]{.ru} 的对象用第四格：[ба́бушку, бра́та]{.ru}，不能用第三格。汉语都说“问某人”“给某人打电话”，俄语要按动词分别记。
