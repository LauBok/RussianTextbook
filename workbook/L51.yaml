- id: L51-01
  tags: [名词单数第三格：阳性与中性]
  task: 阳性和中性名词变第三格。
  type: matrix
  cols: [第一格, 第三格]
  given: [0]
  rows:
  - {base: '[брат]{.ru}', cells: ['[брат]{.ru}', '[бра́ту]{.ru}']}
  - {base: '[студе́нт]{.ru}', cells: ['[студе́нт]{.ru}', '[студе́нту]{.ru}']}
  - {base: '[врач]{.ru}', cells: ['[врач]{.ru}', '[врачу́]{.ru}']}
  - {base: '[друг]{.ru}', cells: ['[друг]{.ru}', '[дру́гу]{.ru}']}
  - {base: '[сосе́д]{.ru}', cells: ['[сосе́д]{.ru}', '[сосе́ду]{.ru}']}
  - {base: '[инжене́р]{.ru}', cells: ['[инжене́р]{.ru}', '[инжене́ру]{.ru}']}
  - {base: '[сын]{.ru}', cells: ['[сын]{.ru}', '[сы́ну]{.ru}']}
  - {base: '[Пьер]{.ru}', cells: ['[Пьер]{.ru}', '[Пье́ру]{.ru}']}
  - {base: '[Серге́й]{.ru}', cells: ['[Серге́й]{.ru}', '[Серге́ю]{.ru}']}
  - {base: '[Андре́й]{.ru}', new: true, gloss: 安德烈（男名）, cells: ['[Андре́й]{.ru}', '[Андре́ю]{.ru}']}
  - {base: '[учи́тель]{.ru}', hint: m, cells: ['[учи́тель]{.ru}', '[учи́телю]{.ru}']}
  - {base: '[преподава́тель]{.ru}', hint: m, cells: ['[преподава́тель]{.ru}', '[преподава́телю]{.ru}']}
  - {base: '[писа́тель]{.ru}', hint: m, new: true, gloss: 作家, cells: ['[писа́тель]{.ru}', '[писа́телю]{.ru}']}
  - {base: '[музе́й]{.ru}', cells: ['[музе́й]{.ru}', '[музе́ю]{.ru}']}
  - {base: '[окно́]{.ru}', cells: ['[окно́]{.ru}', '[окну́]{.ru}']}
  - {base: '[письмо́]{.ru}', cells: ['[письмо́]{.ru}', '[письму́]{.ru}']}
  - {base: '[мо́ре]{.ru}', cells: ['[мо́ре]{.ru}', '[мо́рю]{.ru}']}
  - {base: '[зда́ние]{.ru}', cells: ['[зда́ние]{.ru}', '[зда́нию]{.ru}']}
  why: |
    第 1–8、15、16 题：词尾是硬辅音的阳性名词和以 [-о]{.ru} 结尾的中性名词，第三格加 [-у]{.ru} 或把 [-о]{.ru} 换成 [-у]{.ru}：[бра́ту, окну́]{.ru}。第 3 题 [врач]{.ru} 变格时重音在词尾：[врачу́]{.ru}。
    第 9–14、17、18 题：以 [-й, -ь]{.ru} 结尾的阳性名词和以 [-е]{.ru} 结尾的中性名词用软词尾 [-ю]{.ru}：[Серге́ю, учи́телю, мо́рю]{.ru}；[-ие]{.ru} 结尾的中性名词同样用 [-ю]{.ru}：[зда́нию]{.ru}，不用 [-и]{.ru}。
    阳性和中性用同一套词尾：硬的 [-у]{.ru}，软的 [-ю]{.ru}。
