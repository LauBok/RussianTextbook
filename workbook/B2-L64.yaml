heading: 第 64 课　直接引语与间接引语
groups:
- id: B2-L64-01
  tags:
  - 间接引语：连接方法
  task: 把原话转述成间接引语时用什么连接？归栏。
  type: classify
  bins:
  - '[что]{.ru}'
  - 保留疑问词
  - '[ли]{.ru}'
  - '[что́бы]{.ru}'
  items:
  - text: '[«Я приду́ в шесть.»]{.ru}'
    answer: '[что]{.ru}'
  - text: '[«Где ты живёшь?»]{.ru}'
    answer: 保留疑问词
  - text: '[«Ты спишь?»]{.ru}'
    answer: '[ли]{.ru}'
  - text: '[«Позвони́ ба́бушке!»]{.ru}'
    answer: '[что́бы]{.ru}'
  - text: '[«Не опа́здывайте!»]{.ru}'
    answer: '[что́бы]{.ru}'
  - text: '[«Ты не бои́шься?»]{.ru}'
    answer: '[ли]{.ru}'
  - text: '[«Когда́ начина́ется конце́рт?»]{.ru}'
    answer: 保留疑问词
  - text: '[«Мы уже́ ко́нчили.»]{.ru}'
    answer: '[что]{.ru}'
  - text: '[«Переда́й Све́те приве́т!»]{.ru}'
    answer: '[что́бы]{.ru}'
  - text: '[«Вы бы́ли на выпускно́м?»]{.ru}'
    answer: '[ли]{.ru}'
  - text: '[«Почему́ ты опозда́л?»]{.ru}'
    answer: 保留疑问词
  - text: '[«Я не зна́ю его́ а́дреса.»]{.ru}'
    answer: '[что]{.ru}'
  - text: '[«Принеси́те словари́!»]{.ru}'
    answer: '[что́бы]{.ru}'
  - text: '[«Ско́лько сто́ит биле́т?»]{.ru}'
    answer: 保留疑问词
  - text: '[«Ты хо́чешь чаю?»]{.ru}'
    answer: '[ли]{.ru}'
  - text: '[«За́втра бу́дет дождь.»]{.ru}'
    answer: '[что]{.ru}'
  - text: '[«Не говори́ ма́ме!»]{.ru}'
    answer: '[что́бы]{.ru}'
  - text: '[«Чей э́то телефо́н?»]{.ru}'
    answer: 保留疑问词
  - text: '[«Он уже́ уе́хал?»]{.ru}'
    answer: '[ли]{.ru}'
  - text: '[«Э́то моё пла́тье.»]{.ru}'
    answer: '[что]{.ru}'
  why: '第 1、8、12、16、20 题：陈述句用 [что]{.ru}：[Он сказа́л, что придёт в шесть.]{.ru}

    第 2、7、11、14、18 题：特殊疑问句保留疑问词，不加 [ли]{.ru}：[где, когда́, почему́, ско́лько, чей]{.ru}。

    第 3、6、10、15、19 题：一般疑问句用 [ли]{.ru}，[ли]{.ru} 放在要问的词（通常是动词）后面；带 [не]{.ru} 的问句 [не]{.ru} 和动词一起放在 [ли]{.ru} 前：[не бои́тся ли]{.ru}。

    第 4、5、9、13、17 题：命令、请求（命令式，包括否定命令式）用 [что́бы]{.ru} + 过去时形式，不能用 [что]{.ru}。'
- id: B2-L64-02
  tags:
  - что́бы：转述命令时的过去时形式
  task: 转述括号里的人收到的命令：写出 [что́бы]{.ru} 后的动词形式。
  type: matrix
  cols:
  - 原话（从句主语）
  - '[что́бы]{.ru} + ……'
  given:
  - 0
  rows:
  - base: '[Позвони́! (Све́та)]{.ru}'
    cells:
    - '[Позвони́! (Све́та)]{.ru}'
    - '[позвони́ла]{.ru}'
  - base: '[Не опа́здывайте! (мы)]{.ru}'
    cells:
    - '[Не опа́здывайте! (мы)]{.ru}'
    - '[не опа́здывали]{.ru}'
  - base: '[Переда́й приве́т! (Ди́ма)]{.ru}'
    cells:
    - '[Переда́й приве́т! (Ди́ма)]{.ru}'
    - '[переда́л]{.ru}'
  - base: '[Принеси́те словари́! (студе́нты)]{.ru}'
    cells:
    - '[Принеси́те словари́! (студе́нты)]{.ru}'
    - '[принесли́]{.ru}'
  - base: '[Не забу́дь ключи́! (я)]{.ru}'
    cells:
    - '[Не забу́дь ключи́! (я)]{.ru}'
    - '[не забы́ла]{.ru}'
    hint: 女
  - base: '[Купи́ хле́ба! (Ми́ша)]{.ru}'
    cells:
    - '[Купи́ хле́ба! (Ми́ша)]{.ru}'
    - '[купи́л]{.ru}'
  - base: '[Отдыха́йте! (роди́тели)]{.ru}'
    cells:
    - '[Отдыха́йте! (роди́тели)]{.ru}'
    - '[отдыха́ли]{.ru}'
  - base: '[Помоги́ мне! (А́нна)]{.ru}'
    cells:
    - '[Помоги́ мне! (А́нна)]{.ru}'
    - '[помогла́]{.ru}'
  - base: '[Не спо́рь! (Ми́ша)]{.ru}'
    cells:
    - '[Не спо́рь! (Ми́ша)]{.ru}'
    - '[не спо́рил]{.ru}'
  - base: '[Приходи́те в шесть! (вы)]{.ru}'
    cells:
    - '[Приходи́те в шесть! (вы)]{.ru}'
    - '[приходи́ли]{.ru}'
  - base: '[Иди́ спать! (Ми́ша)]{.ru}'
    cells:
    - '[Иди́ спать! (Ми́ша)]{.ru}'
    - '[шёл]{.ru}'
  - base: '[Сади́тесь! (го́сти)]{.ru}'
    cells:
    - '[Сади́тесь! (го́сти)]{.ru}'
    - '[сади́лись]{.ru}'
  - base: '[Не говори́ никому́! (Све́та)]{.ru}'
    cells:
    - '[Не говори́ никому́! (Све́та)]{.ru}'
    - '[не говори́ла]{.ru}'
  - base: '[Закро́й окно́! (ты)]{.ru}'
    cells:
    - '[Закро́й окно́! (ты)]{.ru}'
    - '[закры́л]{.ru}'
    hint: 男
  - base: '[Скажи́те пра́вду! (Ди́ма и Ми́ша)]{.ru}'
    cells:
    - '[Скажи́те пра́вду! (Ди́ма и Ми́ша)]{.ru}'
    - '[сказа́ли]{.ru}'
  - base: '[Не волну́йся! (ма́ма)]{.ru}'
    cells:
    - '[Не волну́йся! (ма́ма)]{.ru}'
    - '[не волнова́лась]{.ru}'
  why: '第 1、3、6、14、15 题：从句动词用过去时形式，性、数跟从句主语：[Све́та → позвони́ла]{.ru}，[Ди́ма, Ми́ша, ты（男）→ переда́л, купи́л, закры́л]{.ru}。体照原话：完成体命令式 → 完成体过去时形式。

    第 7、10、12 题：原话是未完成体（邀请、一般吩咐），转述也用未完成体：[отдыха́ли, приходи́ли, сади́лись]{.ru}；主语是复数或 [вы]{.ru}，用复数形式。

    第 2、5、9、13、16 题：否定命令式（未完成体）转述时保留 [не]{.ru} 和未完成体：[не опа́здывали, не спо́рил, не говори́ла, не волнова́лась]{.ru}；[не забу́дь]{.ru} 是完成体，转述成 [не забы́ла]{.ru}。

    第 4、8、11 题：过去时特殊的动词：[принести́ → принесли́]{.ru}，[помо́чь → помогла́]{.ru}，[идти́ → шёл]{.ru}。这里的过去时形式不表示过去。'
- id: B2-L64-03
  tags:
  - 间接引语：人称与物主代词的转换
  task: 按括号里的转述人写出间接引语的从句（从连接词写起）。
  type: matrix
  cols:
  - 原话
  - 间接引语的从句
  given:
  - 0
  rows:
  - base: '[Све́та — Ди́ме: «Я жду тебя́.»]{.ru}'
    cells:
    - '[Све́та — Ди́ме: «Я жду тебя́.»]{.ru}'
    - '[что ждёт меня́]{.ru}'
    hint: 迪马转述给朋友
  - base: '[Ма́ма — Све́те: «Ты не бои́шься жить одна́?»]{.ru}'
    cells:
    - '[Ма́ма — Све́те: «Ты не бои́шься жить одна́?»]{.ru}'
    - '[не бои́тся ли она́ жить одна́]{.ru}'
    hint: 迪马转述给大家
  - base: '[А́нна — Ди́ме: «Ты сказа́л Све́те?»]{.ru}'
    cells:
    - '[А́нна — Ди́ме: «Ты сказа́л Све́те?»]{.ru}'
    - '[сказа́л ли я тебе́]{.ru}'
    hint: 迪马转述给斯韦塔
  - base: '[Све́та: «Э́то моё пла́тье.»]{.ru}'
    cells:
    - '[Све́та: «Э́то моё пла́тье.»]{.ru}'
    - '[что э́то её пла́тье]{.ru}'
    hint: 迪马转述给大家
  - base: '[Ди́ма — А́нне: «Где твой брат?»]{.ru}'
    cells:
    - '[Ди́ма — А́нне: «Где твой брат?»]{.ru}'
    - '[где мой брат]{.ru}'
    hint: 安娜转述给妈妈
  - base: '[Пьер — Ю́ми: «Я дам тебе́ мой слова́рь.»]{.ru}'
    cells:
    - '[Пьер — Ю́ми: «Я дам тебе́ мой слова́рь.»]{.ru}'
    - '[что даст мне свой слова́рь]{.ru}'
    hint: 由美转述给安娜
  - base: '[Ван Лэй — роди́телям: «Я позвоню́ вам за́втра.»]{.ru}'
    cells:
    - '[Ван Лэй — роди́телям: «Я позвоню́ вам за́втра.»]{.ru}'
    - '[что позвони́т нам за́втра]{.ru}'
    hint: 妈妈转述给王磊的爸爸
  - base: '[О́льга Ви́кторовна — студе́нтам: «Принеси́те ва́ши тетра́ди!»]{.ru}'
    cells:
    - '[О́льга Ви́кторовна — студе́нтам: «Принеси́те ва́ши тетра́ди!»]{.ru}'
    - '[что́бы мы принесли́ свои́ тетра́ди]{.ru}'
    hint: 王磊转述给同学
  - base: '[Ми́ша — А́нне: «Помоги́ мне!»]{.ru}'
    cells:
    - '[Ми́ша — А́нне: «Помоги́ мне!»]{.ru}'
    - '[что́бы я помогла́ ему́]{.ru}'
    hint: 安娜转述给妈妈
  - base: '[Ма́ма — Ди́ме: «Переда́й Све́те мои́ поздравле́ния!»]{.ru}'
    cells:
    - '[Ма́ма — Ди́ме: «Переда́й Све́те мои́ поздравле́ния!»]{.ru}'
    - '[что́бы я переда́л тебе́ её поздравле́ния]{.ru}'
    hint: 迪马转述给斯韦塔
  - base: '[Ю́ми — Ван Лэ́ю: «Ты ви́дел мой телефо́н?»]{.ru}'
    cells:
    - '[Ю́ми — Ван Лэ́ю: «Ты ви́дел мой телефо́н?»]{.ru}'
    - '[ви́дел ли я её телефо́н]{.ru}'
    hint: 王磊转述给安娜
  - base: '[Све́та — ма́ме: «Мой брат опя́ть опозда́л.»]{.ru}'
    cells:
    - '[Све́та — ма́ме: «Мой брат опя́ть опозда́л.»]{.ru}'
    - '[что ты опя́ть опозда́л]{.ru}'
    hint: 妈妈转述给迪马
  why: '第 1、5、7、9、12 题：原话里的“我”“你”换成转述时真正指的人：斯韦塔对迪马说“你”，迪马转述时是“我”（[меня́]{.ru}）；安娜的弟弟，安娜对妈妈说是 [мой брат]{.ru}；王磊说“你们”，妈妈转述时是 [нам]{.ru}；米沙说“我”，安娜转述时是 [ему́]{.ru}，“你”是安娜自己（[я помогла́]{.ru}）；斯韦塔说的“我哥哥”就是听话的迪马（[ты]{.ru}）。从句主语和主句主语相同时可以省略：[что ждёт меня́]{.ru} 也可写 [что она́ ждёт меня́]{.ru}。

    第 2、3 题：一般疑问用 [ли]{.ru}：[не бои́тся ли она́…]{.ru}，[сказа́л ли я тебе́]{.ru}；时不变。

    第 4、10、11 题：物主代词指别人（不是从句主语）时用 [его́, её]{.ru}：[э́то её пла́тье]{.ru}（主语是 [э́то]{.ru}），[её поздравле́ния]{.ru}（主语是 [я]{.ru}，祝贺是妈妈的），[её телефо́н]{.ru}。

    第 6、8 题：物主代词指从句主语时用 [свой]{.ru}：[даст мне свой слова́рь]{.ru}（皮埃尔自己的），[мы принесли́ свои́ тетра́ди]{.ru}（也可说 [на́ши]{.ru}）。'
