- id: L22-07
  tags:
  - 名词单数第四格：句中混合
  - 人称代词第四格
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Ты по́мнишь ___?
    hint: сосе́д
    accept:
    - сосе́да
  - stem: Ми́ша ждёт ___.
    hint: па́па
    accept:
    - па́пу
  - stem: А́нна ви́дит ___.
    hint: Пьер
    accept:
    - Пье́ра
  - stem: Я давно́ не ви́жу ___.
    hint: И́горь
    accept:
    - И́горя
  - stem: Мы ждём ___.
    hint: Ю́ми
    accept:
    - Ю́ми
  - stem: Вы по́мните ___?
    hint: я
    accept:
    - меня́
  - stem: Я хорошо́ зна́ю ___.
    hint: она́
    accept:
    - её
  - stem: Ба́бушка ждёт ___.
    hint: мы
    accept:
    - нас
  - stem: Ми́ша ви́дит ___ на окне́.
    hint: ко́шка
    accept:
    - ко́шку
  - stem: Ты слу́шаешь ___?
    hint: ле́кция
    accept:
    - ле́кцию
  - stem: Мы ждём ___.
    hint: по́езд
    accept:
    - по́езд
  - stem: Я по́мню ___.
    hint: Серге́й
    accept:
    - Серге́я
  why: '第 1、3、4、12 题：阳性动物名词加 [-а]{.ru} 或换成 [-я]{.ru}：[сосе́да, Пье́ра, И́горя, Серге́я]{.ru}。

    第 2、9 题：[-а]{.ru} 结尾的动物名词改 [-у]{.ru}：[па́пу, ко́шку]{.ru}；[на окне́]{.ru} 是第六格，表示处所。

    第 5 题：[Ю́ми]{.ru} 以 [-и]{.ru} 结尾，不变格。

    第 6–8 题：人称代词第四格 [меня́, её, нас]{.ru}。

    第 10 题：非动物阴性 [-я]{.ru} 改 [-ю]{.ru}。

    第 11 题：[по́езд]{.ru} 是非动物名词，等火车也用第一格形式。'
