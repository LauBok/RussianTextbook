    answer: 同第一格
  - text: '[брат]{.ru}'
    answer: '[-а / -я]{.ru}'
  - text: '[тетра́дь]{.ru}'
    answer: 同第一格
  - text: '[Мари́я]{.ru}'
    answer: '[-у / -ю]{.ru}'
