  - text: '[телефо́н]{.ru}'
    answer: 同第一格
  - text: '[Ми́ша]{.ru}'
    answer: '[-у / -ю]{.ru}'
  why: '第 1、5、7、9、11、13、16、19 题：非动物的阳性、中性名词和 [-ь]{.ru} 结尾的阴性名词第四格同第一格：[ви́деть стол, музе́й, слова́рь, тетра́дь]{.ru}。

    第 2、6、8、12、15、18 题：阳性动物名词以辅音、[-й]{.ru}、[-ь]{.ru} 结尾，加 [-а]{.ru} 或换成 [-я]{.ru}：[студе́нта, Серге́я, преподава́теля, дру́га]{.ru}。第 6 题和第 5 题、第 8 题和第 7 题词尾相同，只有动物名词才变。

    第 3、4、10、14、17、20 题：[-а]{.ru}、[-я]{.ru} 结尾的词，不论动物、非动物、阴性还是阳性，都改成 [-у]{.ru}、[-ю]{.ru}。'
