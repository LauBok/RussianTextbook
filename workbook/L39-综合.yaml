  - text: '[11 + мину́та]{.ru}'
    answer: 复数第二格
  - text: '[1 + час]{.ru}'
    answer: 单数第一格
  - text: '[93 + рубль]{.ru}'
    answer: 单数第二格
  - text: '[30 + мину́та]{.ru}'
    answer: 复数第二格
  - text: '[4 + челове́к]{.ru}'
    answer: 单数第二格
  - text: '[61 + челове́к]{.ru}'
    answer: 单数第一格
  - text: '[13 + год]{.ru}'
    answer: 复数第二格
  - text: '[2 + час]{.ru}'
    answer: 单数第二格
  - text: '[100 + год]{.ru}'
    answer: 复数第二格
  why: '第 1、5、9、13 题：末位是 1（不是 11）：[со́рок оди́н рубль, два́дцать оди́н год, шестьдеся́т оди́н челове́к]{.ru}。

    第 3、6、10、12、15 题：末位是 2–4（不是 12–14）：[три мину́ты, пятьдеся́т два рубля́]{.ru}。

    第 2、4、8、14 题：11–14 一律用复数第二格：[двена́дцать часо́в, оди́ннадцать мину́т]{.ru}。

    第 7、11、16 题：末位 5–9、0 和 [сто]{.ru}：[семь лет, три́дцать мину́т, сто лет]{.ru}。'
