- id: L39-综合-b
  tags:
  - 综合：末位数字规则
  recycles:
  - L28-03
  - L35-04
  - L39-03
  task: 数词后面的名词用哪个形式？归入相应一栏。
  type: classify
  bins:
  - 单数第一格
  - 单数第二格
  - 复数第二格
  items:
  - text: '[41 + рубль]{.ru}'
    answer: 单数第一格
  - text: '[12 + час]{.ru}'
    answer: 复数第二格
  - text: '[3 + мину́та]{.ru}'
    answer: 单数第二格
  - text: '[14 + челове́к]{.ru}'
