heading: 第 69 课　季节与天气
groups:
- id: L69-01
  tags:
  - 季节与时段：第五格作副词
  - 时间表达：月份与星期的格
  task: 表示“在……时候”要用哪种说法？把词归类。
  type: classify
  bins:
  - 不加前置词（[зимо́й]{.ru} 类）
  - '[в]{.ru} + 第六格'
  - '[в]{.ru} + 第四格'
  items:
  - text: '[зима́]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[май]{.ru}'
    answer: '[в]{.ru} + 第六格'
  - text: '[суббо́та]{.ru}'
    answer: '[в]{.ru} + 第四格'
  - text: '[ле́то]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[ноя́брь]{.ru}'
    answer: '[в]{.ru} + 第六格'
  - text: '[понеде́льник]{.ru}'
    answer: '[в]{.ru} + 第四格'
  - text: '[о́сень]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[ве́чер]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[янва́рь]{.ru}'
    answer: '[в]{.ru} + 第六格'
  - text: '[среда́]{.ru}'
    answer: '[в]{.ru} + 第四格'
  - text: '[у́тро]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[март]{.ru}'
    answer: '[в]{.ru} + 第六格'
  - text: '[весна́]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[пя́тница]{.ru}'
    answer: '[в]{.ru} + 第四格'
  - text: '[ночь]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[ию́ль]{.ru}'
    answer: '[в]{.ru} + 第六格'
  - text: '[день]{.ru}'
    answer: 不加前置词（[зимо́й]{.ru} 类）
  - text: '[четве́рг]{.ru}'
    answer: '[в]{.ru} + 第四格'
  why: |
    第 1、4、7、13 题：季节用第五格作副词，不加前置词：[зимо́й, ле́том, о́сенью, весно́й]{.ru}。
    第 8、11、15、17 题：一天里的时段同样不加前置词：[ве́чером, у́тром, но́чью, днём]{.ru}。
    第 2、5、9、12、16 题：月份用 [в]{.ru} + 第六格：[в ма́е, в ноябре́]{.ru}。
    第 3、6、10、14、18 题：星期用 [в]{.ru} + 第四格：[в суббо́ту, в понеде́льник]{.ru}。
- id: L69-02
  tags:
  - 季节与时段：第五格作副词
  - 时间表达：月份与星期的格
  task: 写出回答 [когда́?]{.ru} 的形式。
  type: matrix
  cols:
  - 名词
  - '[когда́?]{.ru}'
  given:
  - 0
  rows:
  - base: '[зима́]{.ru}'
    cells:
    - '[зима́]{.ru}'
    - '[зимо́й]{.ru}'
  - base: '[весна́]{.ru}'
    cells:
    - '[весна́]{.ru}'
    - '[весно́й]{.ru}'
  - base: '[ле́то]{.ru}'
    cells:
    - '[ле́то]{.ru}'
    - '[ле́том]{.ru}'
  - base: '[о́сень]{.ru}'
    cells:
    - '[о́сень]{.ru}'
    - '[о́сенью]{.ru}'
  - base: '[у́тро]{.ru}'
    cells:
    - '[у́тро]{.ru}'
    - '[у́тром]{.ru}'
  - base: '[день]{.ru}'
    cells:
    - '[день]{.ru}'
    - '[днём]{.ru}'
  - base: '[ве́чер]{.ru}'
    cells:
    - '[ве́чер]{.ru}'
    - '[ве́чером]{.ru}'
  - base: '[ночь]{.ru}'
    cells:
    - '[ночь]{.ru}'
    - '[но́чью]{.ru}'
  - base: '[янва́рь]{.ru}'
    cells:
    - '[янва́рь]{.ru}'
    - '[в январе́]{.ru}'
  - base: '[май]{.ru}'
    cells:
    - '[май]{.ru}'
    - '[в ма́е]{.ru}'
  - base: '[ию́ль]{.ru}'
    cells:
    - '[ию́ль]{.ru}'
    - '[в ию́ле]{.ru}'
  - base: '[сентя́брь]{.ru}'
    cells:
    - '[сентя́брь]{.ru}'
    - '[в сентябре́]{.ru}'
  - base: '[суббо́та]{.ru}'
    cells:
    - '[суббо́та]{.ru}'
    - '[в суббо́ту]{.ru}'
  - base: '[среда́]{.ru}'
    cells:
    - '[среда́]{.ru}'
    - '[в сре́ду]{.ru}'
  - base: '[воскресе́нье]{.ru}'
    cells:
    - '[воскресе́нье]{.ru}'
    - '[в воскресе́нье]{.ru}'
  - base: '[вто́рник]{.ru}'
    cells:
    - '[вто́рник]{.ru}'
    - '[во вто́рник]{.ru}'
  why: |
    第 1–4 题：季节的第五格：[зимо́й, весно́й]{.ru} 重音在词尾，[ле́том]{.ru} 加 [-м]{.ru}，[о́сенью]{.ru} 写 [-ью]{.ru}。不要说 [в зиме́]{.ru}、[в ле́то]{.ru}。
    第 5–8 题：[у́тром, ве́чером, но́чью]{.ru}；[день]{.ru} 脱落 [е]{.ru}：[днём]{.ru}。
    第 9–12 题：月份 [в]{.ru} + 第六格：[в январе́, в сентябре́]{.ru} 重音在词尾；[в ма́е, в ию́ле]{.ru} 重音不动。
    第 13–16 题：星期 [в]{.ru} + 第四格：阴性改 [-у]{.ru}：[в суббо́ту]{.ru}，[среда́ → в сре́ду]{.ru} 重音前移；阳性、中性不变：[в воскресе́нье]{.ru}；[вто́рник]{.ru} 前写 [во]{.ru}：[во вто́рник]{.ru}。
- id: L69-03
  tags:
  - 天气表达：现在、过去与将来
  task: 把今天的天气改成昨天和明天的说法。
  type: matrix
  cols:
  - 今天
  - 昨天
  - 明天
  given:
  - 0
  rows:
  - base: '[Сего́дня хо́лодно.]{.ru}'
    cells:
    - '[Сего́дня хо́лодно.]{.ru}'
    - '[Вчера́ бы́ло хо́лодно]{.ru}'
    - '[За́втра бу́дет хо́лодно]{.ru}'
  - base: '[Сего́дня тепло́.]{.ru}'
    cells:
    - '[Сего́дня тепло́.]{.ru}'
    - '[Вчера́ бы́ло тепло́]{.ru}'
    - '[За́втра бу́дет тепло́]{.ru}'
  - base: '[Сего́дня жа́рко.]{.ru}'
    cells:
    - '[Сего́дня жа́рко.]{.ru}'
    - '[Вчера́ бы́ло жа́рко]{.ru}'
    - '[За́втра бу́дет жа́рко]{.ru}'
  - base: '[Сего́дня со́лнечно.]{.ru}'
    cells:
    - '[Сего́дня со́лнечно.]{.ru}'
    - '[Вчера́ бы́ло со́лнечно]{.ru}'
    - '[За́втра бу́дет со́лнечно]{.ru}'
  - base: '[Сего́дня дождь.]{.ru}'
    cells:
    - '[Сего́дня дождь.]{.ru}'
    - '[Вчера́ был дождь]{.ru}'
    - '[За́втра бу́дет дождь]{.ru}'
  - base: '[Сего́дня снег.]{.ru}'
    cells:
    - '[Сего́дня снег.]{.ru}'
    - '[Вчера́ был снег]{.ru}'
    - '[За́втра бу́дет снег]{.ru}'
  - base: '[Сего́дня си́льный ве́тер.]{.ru}'
    cells:
    - '[Сего́дня си́льный ве́тер.]{.ru}'
    - '[Вчера́ был си́льный ве́тер]{.ru}'
    - '[За́втра бу́дет си́льный ве́тер]{.ru}'
  - base: '[Сего́дня хоро́шая пого́да.]{.ru}'
    cells:
    - '[Сего́дня хоро́шая пого́да.]{.ru}'
    - '[Вчера́ была́ хоро́шая пого́да]{.ru}'
    - '[За́втра бу́дет хоро́шая пого́да]{.ru}'
  - base: '[Сего́дня плоха́я пого́да.]{.ru}'
    cells:
    - '[Сего́дня плоха́я пого́да.]{.ru}'
    - '[Вчера́ была́ плоха́я пого́да]{.ru}'
    - '[За́втра бу́дет плоха́я пого́да]{.ru}'
  - base: '[Сего́дня ми́нус пять.]{.ru}'
    cells:
    - '[Сего́дня ми́нус пять.]{.ru}'
    - '[Вчера́ бы́ло ми́нус пять]{.ru}'
    - '[За́втра бу́дет ми́нус пять]{.ru}'
  - base: '[Сего́дня плюс два́дцать.]{.ru}'
    cells:
    - '[Сего́дня плюс два́дцать.]{.ru}'
    - '[Вчера́ бы́ло плюс два́дцать]{.ru}'
    - '[За́втра бу́дет плюс два́дцать]{.ru}'
  why: |
    第 1–4 题：无人称句没有主语，过去时用中性 [бы́ло]{.ru}，将来时用 [бу́дет]{.ru}：[Вчера́ бы́ло хо́лодно. За́втра бу́дет хо́лодно.]{.ru}
    第 5–7 题：[дождь, снег, ве́тер]{.ru} 是阳性主语，过去时用 [был]{.ru}。
    第 8、9 题：[пого́да]{.ru} 是阴性，过去时用 [была́]{.ru}，重音在词尾。
    第 10、11 题：气温句同无人称句，过去时 [бы́ло]{.ru}。
    所有将来时都是 [бу́дет]{.ru}，不随性变化。
- id: L69-04
  tags:
  - 天气表达：现在、过去与将来
  task: 按提示写出动词形式。
  type: fill
  items:
  - stem: Сего́дня ___ снег.
    hint: '[идти́]{.ru}，现在时'
    accept:
    - идёт
  - stem: За́втра ___ дождь.
    hint: '[идти́]{.ru}，将来时'
    accept:
    - бу́дет идти́
  - stem: Ле́том в Пеки́не ча́сто ___ дождь.
    hint: '[идти́]{.ru}，现在时'
    accept:
    - идёт
  - stem: Вчера́ ___ хо́лодно.
    hint: '[быть]{.ru}，过去时'
    accept:
    - бы́ло
  - stem: За́втра ___ тепло́.
    hint: '[быть]{.ru}，将来时'
    accept:
    - бу́дет
  - stem: Вчера́ ___ си́льный дождь.
    hint: '[быть]{.ru}，过去时'
    accept:
    - был
  - stem: Вчера́ ___ плоха́я пого́да.
    hint: '[быть]{.ru}，过去时'
    accept:
    - была́
  - stem: Зимо́й в Москве́ ча́сто ___ снег.
    hint: '[идти́]{.ru}，现在时'
    accept:
    - идёт
  - stem: За́втра ___ снег.
    hint: '[быть]{.ru}，将来时'
    accept:
    - бу́дет
  - stem: Вчера́ ___ ми́нус де́сять.
    hint: '[быть]{.ru}，过去时'
    accept:
    - бы́ло
  - stem: Сейча́с на у́лице ___ дождь?
    hint: '[идти́]{.ru}，现在时'
    accept:
    - идёт
  - stem: За́втра ___ хоро́шая пого́да.
    hint: '[быть]{.ru}，将来时'
    accept:
    - бу́дет
  - stem: ___ та́ет снег.
    hint: весна́
    accept:
    - Весно́й
  - stem: ___ в Москве́ хо́лодно.
    hint: зима́
    accept:
    - Зимо́й
  - stem: ___ мы отдыха́ем на мо́ре.
    hint: ле́то
    accept:
    - Ле́том
  - stem: ___ ча́сто идёт дождь.
    hint: о́сень
    accept:
    - О́сенью
  why: |
    第 1、3、8、11 题：“下雪、下雨”用 [идти́]{.ru}，即使说“常常下雨”也不换成 [ходи́ть]{.ru}：[ча́сто идёт дождь]{.ru}。
    第 2 题：将来时 [бу́дет идти́]{.ru}；也可以只说 [За́втра бу́дет дождь.]{.ru}
    第 4、10 题：无人称句、气温句过去时用 [бы́ло]{.ru}。
    第 6、7 题：过去时跟主语一致：[был дождь]{.ru}，[была́ пого́да]{.ru}。
    第 5、9、12 题：将来时一律 [бу́дет]{.ru}。
    第 13–16 题：季节用第五格，不加前置词：[Весно́й, Зимо́й, Ле́том, О́сенью]{.ru}，句首大写。
