    gloss: 黑色的
  - base: '[у́мный]{.ru}'
    cells:
    - '[у́мный]{.ru}'
    - '[у́мная]{.ru}'
    - '[у́мное]{.ru}'
    - '[у́мные]{.ru}'
    new: true
    gloss: 聪明的
  - base: '[дли́нный]{.ru}'
    cells:
    - '[дли́нный]{.ru}'
    - '[дли́нная]{.ru}'
    - '[дли́нное]{.ru}'
    - '[дли́нные]{.ru}'
    new: true
    gloss: 长的
  - base: '[тёплый]{.ru}'
    cells:
    - '[тёплый]{.ru}'
    - '[тёплая]{.ru}'
    - '[тёплое]{.ru}'
    - '[тёплые]{.ru}'
    new: true
    gloss: 暖和的
  - base: '[холо́дный]{.ru}'
    cells:
    - '[холо́дный]{.ru}'
    - '[холо́дная]{.ru}'
    - '[холо́дное]{.ru}'
    - '[холо́дные]{.ru}'
    new: true
    gloss: 冷的
  - base: '[молодо́й]{.ru}'
    cells:
    - '[молодо́й]{.ru}'
    - '[молода́я]{.ru}'
    - '[молодо́е]{.ru}'
    - '[молоды́е]{.ru}'
    new: true
    gloss: 年轻的
  - base: '[голубо́й]{.ru}'
    cells:
    - '[голубо́й]{.ru}'
    - '[голуба́я]{.ru}'
    - '[голубо́е]{.ru}'
    - '[голубы́е]{.ru}'
    new: true
    gloss: 浅蓝色的
  - base: '[родно́й]{.ru}'
    cells:
    - '[родно́й]{.ru}'
    - '[родна́я]{.ru}'
    - '[родно́е]{.ru}'
    - '[родны́е]{.ru}'
    new: true
    gloss: 家乡的，亲生的
  why: |-
    第 1–7 题：硬变化：[-ый]{.ru} 换成 [-ая, -ое, -ые]{.ru}，重音不动：[кра́сная, кра́сное, кра́сные]{.ru}；[чёрный]{.ru} 的 [ё]{.ru} 在各形式里都保留：[чёрная]{.ru}。
    第 8–10 题：阳性词尾重读写成 [-о́й]{.ru}，其余形式照常是硬变化，重音都在词尾：[молода́я, молодо́е, молоды́е]{.ru}；[голуба́я, родна́я]{.ru}。
- id: L09-02
  tags:
  - 形容词第一格：软变化与混合变化
  task: 软变化和受拼写规则影响的形容词：写出阴性、中性和复数形式。
  type: matrix
  cols: *id001
  given:
  - 0
  rows:
  - base: '[си́ний]{.ru}'
    cells:
    - '[си́ний]{.ru}'
    - '[си́няя]{.ru}'
    - '[си́нее]{.ru}'
    - '[си́ние]{.ru}'
  - base: '[после́дний]{.ru}'
    cells:
    - '[после́дний]{.ru}'
    - '[после́дняя]{.ru}'
    - '[после́днее]{.ru}'
    - '[после́дние]{.ru}'
    new: true
    gloss: 最后的
  - base: '[хоро́ший]{.ru}'
    cells:
    - '[хоро́ший]{.ru}'
    - '[хоро́шая]{.ru}'
    - '[хоро́шее]{.ru}'
    - '[хоро́шие]{.ru}'
  - base: '[горя́чий]{.ru}'
    cells:
    - '[горя́чий]{.ru}'
    - '[горя́чая]{.ru}'
    - '[горя́чее]{.ru}'
    - '[горя́чие]{.ru}'
    new: true
    gloss: 热的
  - base: '[ма́ленький]{.ru}'
    cells:
    - '[ма́ленький]{.ru}'
    - '[ма́ленькая]{.ru}'
    - '[ма́ленькое]{.ru}'
    - '[ма́ленькие]{.ru}'
  - base: '[ру́сский]{.ru}'
    cells:
    - '[ру́сский]{.ru}'
    - '[ру́сская]{.ru}'
    - '[ру́сское]{.ru}'
    - '[ру́сские]{.ru}'
    new: true
    gloss: 俄罗斯的
  - base: '[большо́й]{.ru}'
    cells:
    - '[большо́й]{.ru}'
    - '[больша́я]{.ru}'
    - '[большо́е]{.ru}'
    - '[больши́е]{.ru}'
  - base: '[плохо́й]{.ru}'
    cells:
    - '[плохо́й]{.ru}'
    - '[плоха́я]{.ru}'
    - '[плохо́е]{.ru}'
    - '[плохи́е]{.ru}'
    new: true
    gloss: 坏的
  - base: '[дорого́й]{.ru}'
    cells:
    - '[дорого́й]{.ru}'
    - '[дорога́я]{.ru}'
    - '[дорого́е]{.ru}'
    - '[дороги́е]{.ru}'
    new: true
    gloss: 贵的
  - base: '[како́й]{.ru}'
    cells:
    - '[како́й]{.ru}'
    - '[кака́я]{.ru}'
    - '[како́е]{.ru}'
    - '[каки́е]{.ru}'
  why: |-
    第 1、2 题：软变化：[-ий]{.ru} 换成 [-яя, -ее, -ие]{.ru}：[си́няя, си́нее, си́ние]{.ru}；[после́дняя, после́днее]{.ru}。
    第 3、4 题：词干末尾是 [ш, ж, ч]{.ru}，词尾不重读：阴性照常 [-ая]{.ru}，中性写 [-ее]{.ru}，复数写 [-ие]{.ru}：[хоро́шее, горя́чее]{.ru}。把中性写成 [-ое]{.ru} 是常见错误。
    第 5、6 题：词干末尾是 [к, х]{.ru}：阳性和复数不写 [ы]{.ru}，写 [-ий, -ие]{.ru}；阴性、中性仍是 [-ая, -ое]{.ru}：[ма́ленькое, ру́сское]{.ru}。
    第 7–10 题：重音在词尾的 [-о́й]{.ru}：阴性、中性是 [-а́я, -о́е]{.ru}，复数因 [ш, х, г]{.ru} 写 [-и́е]{.ru}：[больши́е, плохи́е, дороги́е, каки́е]{.ru}。
- id: L09-03
  tags:
  - 形容词与名词主格配合
  task: 形容词和名词组成词组（名词有单数也有复数）。
  type: matrix
  cols:
  - 形容词＋名词
  - 词组
  given:
  - 0
  rows:
  - base: '[но́вый + су́мка]{.ru}'
    cells:
    - '[но́вый + су́мка]{.ru}'
    - '[но́вая су́мка]{.ru}'
  - base: '[большо́й + окно́]{.ru}'
    cells:
    - '[большо́й + окно́]{.ru}'
    - '[большо́е окно́]{.ru}'
  - base: '[си́ний + чемода́н]{.ru}'
    cells:
    - '[си́ний + чемода́н]{.ru}'
    - '[си́ний чемода́н]{.ru}'
  - base: '[хоро́ший + фо́то]{.ru}'
    cells:
    - '[хоро́ший + фо́то]{.ru}'
    - '[хоро́шее фо́то]{.ru}'
  - base: '[ма́ленький + ко́шка]{.ru}'
    cells:
    - '[ма́ленький + ко́шка]{.ru}'
    - '[ма́ленькая ко́шка]{.ru}'
  - base: '[краси́вый + пло́щадь]{.ru}'
    cells:
    - '[краси́вый + пло́щадь]{.ru}'
    - '[краси́вая пло́щадь]{.ru}'
    hint: f
  - base: '[интере́сный + журна́лы]{.ru}'
    cells:
    - '[интере́сный + журна́лы]{.ru}'
    - '[интере́сные журна́лы]{.ru}'
  - base: '[све́тлый + ко́мнаты]{.ru}'
    cells:
    - '[све́тлый + ко́мнаты]{.ru}'
    - '[све́тлые ко́мнаты]{.ru}'
  - base: '[си́ний + не́бо]{.ru}'
    cells:
    - '[си́ний + не́бо]{.ru}'
    - '[си́нее не́бо]{.ru}'
  - base: '[хоро́ший + па́па]{.ru}'
    cells:
    - '[хоро́ший + па́па]{.ru}'
    - '[хоро́ший па́па]{.ru}'
  - base: '[большо́й + слова́рь]{.ru}'
    cells:
    - '[большо́й + слова́рь]{.ru}'
    - '[большо́й слова́рь]{.ru}'
    hint: m
  - base: '[ма́ленький + о́кна]{.ru}'
    cells:
    - '[ма́ленький + о́кна]{.ru}'
    - '[ма́ленькие о́кна]{.ru}'
  - base: '[ста́рый + го́род]{.ru}'
    cells:
    - '[ста́рый + го́род]{.ru}'
    - '[ста́рый го́род]{.ru}'
  - base: '[хоро́ший + студе́нтка]{.ru}'
    cells:
    - '[хоро́ший + студе́нтка]{.ru}'
    - '[хоро́шая студе́нтка]{.ru}'
  - base: '[си́ний + тетра́дь]{.ru}'
    cells:
    - '[си́ний + тетра́дь]{.ru}'
    - '[си́няя тетра́дь]{.ru}'
    hint: f
  - base: '[но́вый + пи́сьма]{.ru}'
    cells:
    - '[но́вый + пи́сьма]{.ru}'
    - '[но́вые пи́сьма]{.ru}'
  - base: '[большо́й + кни́ги]{.ru}'
    cells:
    - '[большо́й + кни́ги]{.ru}'
    - '[больши́е кни́ги]{.ru}'
  - base: '[си́ний + ру́чки]{.ru}'
    cells:
    - '[си́ний + ру́чки]{.ru}'
    - '[си́ние ру́чки]{.ru}'
  why: |-
    第 3、11、13 题：阳性名词前用阳性原形：[си́ний чемода́н, большо́й слова́рь, ста́рый го́род]{.ru}。
    第 10 题：[па́па]{.ru} 是阳性：[хоро́ший па́па]{.ru}。
    第 1、5、14 题：阴性 [-ая]{.ru}：[но́вая су́мка, ма́ленькая ко́шка, хоро́шая студе́нтка]{.ru}。
    第 6、15 题：[пло́щадь, тетра́дь]{.ru} 是阴性：[краси́вая пло́щадь]{.ru}；软变化写 [-яя]{.ru}：[си́няя тетра́дь]{.ru}。
    第 2 题：中性 [-ое]{.ru}：[большо́е окно́]{.ru}。
    第 4、9 题：中性 [фо́то, не́бо]{.ru} 前：[хоро́ший]{.ru} 因拼写规则写 [хоро́шее]{.ru}，软变化 [си́ний]{.ru} 写 [си́нее]{.ru}。
    第 7、8、16 题：复数名词前用 [-ые]{.ru}：[интере́сные журна́лы, све́тлые ко́мнаты, но́вые пи́сьма]{.ru}。
    第 12、17、18 题：[к, ш]{.ru} 后和软变化的复数都是 [-ие]{.ru}：[ма́ленькие о́кна, больши́е кни́ги, си́ние ру́чки]{.ru}。
