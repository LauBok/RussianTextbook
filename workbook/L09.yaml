heading: 第 9 课　形容词第一格
groups:
- id: L09-01
  tags:
  - 形容词第一格：硬变化
  task: 硬变化形容词（含重音在词尾的 [-о́й]{.ru}）：写出阴性、中性和复数形式。
  type: matrix
  cols: &id001
  - 阳性
  - 阴性
  - 中性
  - 复数
  given:
  - 0
  rows:
  - base: '[но́вый]{.ru}'
    cells:
    - '[но́вый]{.ru}'
    - '[но́вая]{.ru}'
    - '[но́вое]{.ru}'
    - '[но́вые]{.ru}'
  - base: '[кра́сный]{.ru}'
    cells:
    - '[кра́сный]{.ru}'
    - '[кра́сная]{.ru}'
    - '[кра́сное]{.ru}'
    - '[кра́сные]{.ru}'
