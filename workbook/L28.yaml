heading: 第 28 课　数词 1–12 与钟点
groups:
- id: L28-01
  tags:
  - 数词 1–12
  - 数词与 час 连用
  task: 用俄语写出数词，再写出它和 [час]{.ru} 连用的形式。
  type: matrix
  cols:
  - 数字
  - 数词
  - 数词 + [час]{.ru}
  rows:
  - base: '[1]{.ru}'
    cells:
    - '[1]{.ru}'
    - '[оди́н]{.ru}'
    - '[оди́н час]{.ru}'
  - base: '[2]{.ru}'
    cells:
    - '[2]{.ru}'
    - '[два]{.ru}'
    - '[два часа́]{.ru}'
  - base: '[3]{.ru}'
    cells:
    - '[3]{.ru}'
    - '[три]{.ru}'
    - '[три часа́]{.ru}'
  - base: '[4]{.ru}'
    cells:
    - '[4]{.ru}'
    - '[четы́ре]{.ru}'
    - '[четы́ре часа́]{.ru}'
  - base: '[5]{.ru}'
    cells:
    - '[5]{.ru}'
    - '[пять]{.ru}'
    - '[пять часо́в]{.ru}'
  - base: '[6]{.ru}'
    cells:
    - '[6]{.ru}'
    - '[шесть]{.ru}'
    - '[шесть часо́в]{.ru}'
  - base: '[7]{.ru}'
    cells:
    - '[7]{.ru}'
    - '[семь]{.ru}'
    - '[семь часо́в]{.ru}'
  - base: '[8]{.ru}'
    cells:
    - '[8]{.ru}'
    - '[во́семь]{.ru}'
    - '[во́семь часо́в]{.ru}'
  - base: '[9]{.ru}'
    cells:
    - '[9]{.ru}'
    - '[де́вять]{.ru}'
    - '[де́вять часо́в]{.ru}'
  - base: '[10]{.ru}'
    cells:
    - '[10]{.ru}'
    - '[де́сять]{.ru}'
    - '[де́сять часо́в]{.ru}'
  - base: '[11]{.ru}'
    cells:
    - '[11]{.ru}'
    - '[оди́ннадцать]{.ru}'
    - '[оди́ннадцать часо́в]{.ru}'
  - base: '[12]{.ru}'
    cells:
    - '[12]{.ru}'
    - '[двена́дцать]{.ru}'
    - '[двена́дцать часо́в]{.ru}'
  why: '第 1 题：1 后面用 [час]{.ru}；报钟点时常常只说 [Сейча́с час]{.ru}。

    第 2–4 题：2、3、4 后面用 [часа́]{.ru}，重音在词尾。[час]{.ru} 是阳性，“二”用 [два]{.ru}。

    第 5–12 题：5 以上用 [часо́в]{.ru}，重音在词尾。[пять … де́сять]{.ru} 以 [ь]{.ru} 结尾，别漏写。

    第 11、12 题：[оди́ннадцать]{.ru} 来自 [оди́н]{.ru}，[двена́дцать]{.ru} 来自 [две]{.ru}，中间是 [-на́дцать]{.ru}；注意 [оди́ннадцать]{.ru} 有两个 [н]{.ru}。'
