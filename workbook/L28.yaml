    - '[одно́]{.ru}'
    - '[два]{.ru}'
  - base: '[слова́рь]{.ru}'
    cells:
    - '[слова́рь]{.ru}'
    - '[оди́н]{.ru}'
    - '[два]{.ru}'
  - base: '[тетра́дь]{.ru}'
    cells:
    - '[тетра́дь]{.ru}'
    - '[одна́]{.ru}'
    - '[две]{.ru}'
  - base: '[фо́то]{.ru}'
    cells:
    - '[фо́то]{.ru}'
    - '[одно́]{.ru}'
    - '[два]{.ru}'
  - base: '[ру́чка]{.ru}'
    cells:
    - '[ру́чка]{.ru}'
    - '[одна́]{.ru}'
    - '[две]{.ru}'
  - base: '[зда́ние]{.ru}'
    cells:
    - '[зда́ние]{.ru}'
    - '[одно́]{.ru}'
    - '[два]{.ru}'
  - base: '[ночь]{.ru}'
    cells:
    - '[ночь]{.ru}'
    - '[одна́]{.ru}'
    - '[две]{.ru}'
    hint: f
  - base: '[брат]{.ru}'
    cells:
    - '[брат]{.ru}'
    - '[оди́н]{.ru}'
    - '[два]{.ru}'
  - base: '[ко́мната]{.ru}'
    cells:
    - '[ко́мната]{.ru}'
    - '[одна́]{.ru}'
    - '[две]{.ru}'
  why: '第 1、4、7、13 题：阳性 [оди́н]{.ru}、[два]{.ru}。第 7 题 [слова́рь]{.ru} 是阳性。

    第 3、6、9、11 题：中性 [одно́]{.ru}、[два]{.ru}，“二”和阳性同形。

    第 2、5、8、10、12、14 题：阴性 [одна́]{.ru}、[две]{.ru}。第 8、12 题 [тетра́дь, ночь]{.ru} 是 [-ь]{.ru} 结尾的阴性名词。'
- id: L28-03
  tags:
  - 数词与 час 连用
  task: 数词后面的 [час]{.ru} 用哪个形式？归入相应一栏。
  type: classify
  bins:
  - '[час]{.ru}'
  - '[часа́]{.ru}'
  - '[часо́в]{.ru}'
  items:
  - text: '[два]{.ru}'
    answer: '[часа́]{.ru}'
  - text: '[пять]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[оди́ннадцать]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[оди́н]{.ru}'
    answer: '[час]{.ru}'
  - text: '[четы́ре]{.ru}'
    answer: '[часа́]{.ru}'
  - text: '[семь]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[три]{.ru}'
    answer: '[часа́]{.ru}'
  - text: '[двена́дцать]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[де́сять]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[шесть]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[во́семь]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[де́вять]{.ru}'
    answer: '[часо́в]{.ru}'
  why: '第 4 题：1 后面用 [час]{.ru}。

    第 1、5、7 题：2、3、4 后面用 [часа́]{.ru}。

    第 2、3、6、8–12 题：5–12 后面用 [часо́в]{.ru}。第 8 题 [двена́дцать]{.ru} 虽然里面有“二”，但它是一个数词，按 5 以上处理。'
- id: L28-04
  tags:
  - 第二变位：спать 的 л 插入
  - 第二变位：звони́ть
  task: 按主语写出 [спать]{.ru} 和 [звони́ть]{.ru} 的现在时。
  type: matrix
  cols:
  - 主语
  - '[спать]{.ru}'
  - '[звони́ть]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[сплю]{.ru}'
    - '[звоню́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[спишь]{.ru}'
    - '[звони́шь]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[спит]{.ru}'
    - '[звони́т]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[спим]{.ru}'
    - '[звони́м]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[спи́те]{.ru}'
    - '[звони́те]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[спят]{.ru}'
    - '[звоня́т]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[спит]{.ru}'
    - '[звони́т]{.ru}'
  - base: '[па́па и ма́ма]{.ru}'
    cells:
    - '[па́па и ма́ма]{.ru}'
    - '[спят]{.ru}'
    - '[звоня́т]{.ru}'
  - base: '[Ка́тя и я]{.ru}'
    cells:
    - '[Ка́тя и я]{.ru}'
    - '[спим]{.ru}'
    - '[звони́м]{.ru}'
  - base: '[ба́бушка]{.ru}'
    cells:
    - '[ба́бушка]{.ru}'
    - '[спит]{.ru}'
    - '[звони́т]{.ru}'
  why: '第 1 题：[спать]{.ru} 不定式是 [-ать]{.ru}，却属第二变位，[я]{.ru} 的形式插入 [л]{.ru}：[сплю]{.ru}。

    第 2–10 题：[спать]{.ru} 其余形式 [спишь, спит, спим, спи́те, спят]{.ru}；[звони́ть]{.ru} 重音一直在词尾：[звони́шь, звони́т, звоня́т]{.ru}，不要读成 *[зво́нит]{.ru}。'
- id: L28-05
  tags:
  - 钟点、时长与动词变位：句中填空
  task: 用括号里的词填空，数字写成文字。
  type: fill
  items:
  - stem: Сейча́с ___.
    hint: 7, час
    accept:
    - семь часо́в
  - stem: В Пеки́не сейча́с ___.
    hint: 4, час
    accept:
    - четы́ре часа́
  - stem: Ба́бушка ___ уже́ два часа́.
    hint: спать
    accept:
    - спит
  - stem: В Москве́ сейча́с ___.
    hint: 11, час
    accept:
    - оди́ннадцать часо́в
  - stem: Я ___ ве́чером.
    hint: звони́ть
    accept:
    - звоню́
  - stem: Я чита́ю уже́ ___.
    hint: 2, час
    accept:
    - два часа́
  - stem: Сейча́с ___.
    hint: 1, час
    accept:
    - час
    - оди́н час
  - stem: Ми́ша и Ка́тя ___.
    hint: спать
    accept:
    - спят
  - stem: Сейча́с ___.
    hint: 12, час
    accept:
    - двена́дцать часо́в
  - stem: Ты ещё не ___?
    hint: спать
    accept:
    - спишь
  - stem: Мы ___ ве́чером.
    hint: звони́ть
    accept:
    - звони́м
  - stem: Во Владивосто́ке сейча́с ___.
    hint: 5, час
    accept:
    - пять часо́в
  - stem: Па́па рабо́тает уже́ ___.
    hint: 8, час
    accept:
    - во́семь часо́в
  - stem: Вы ___?
    hint: спать
    accept:
    - спи́те
  - stem: Сейча́с ___.
    hint: 3, час
    accept:
    - три часа́
  - stem: Кто ___?
    hint: звони́ть
    accept:
    - звони́т
  - stem: Ты ___ ве́чером?
    hint: звони́ть
    accept:
    - звони́шь
  - stem: В Пеки́не сейча́с ___.
    hint: 10, час
    accept:
    - де́сять часо́в
  - stem: Сейча́с ___.
    hint: 9, час
    accept:
    - де́вять часо́в
  why: |-
    第 1、4、9、12、13、18、19 题：5–12 后面用 [часо́в]{.ru}：[семь часо́в, оди́ннадцать часо́в, двена́дцать часо́в, пять часо́в, во́семь часо́в, де́сять часо́в, де́вять часо́в]{.ru}；[двена́дцать]{.ru} 虽然含有“二”，仍按 5 以上处理。
    第 2、6、15 题：2、3、4 后面用 [часа́]{.ru}，重音在词尾：[четы́ре часа́, два часа́, три часа́]{.ru}。
    第 7 题：一点钟一般只说 [час]{.ru}，也可以说 [оди́н час]{.ru}。
    第 3、8、10、14 题：[спать]{.ru} 是第二变位：[спит, спят, спишь, спи́те]{.ru}，不要类推成 *[спа́ет]{.ru}。
    第 5、11、16、17 题：[звони́ть]{.ru} 重音一直在词尾：[звоню́, звони́м, звони́т, звони́шь]{.ru}。
