    第 3、6、9、11 题：中性 [одно́]{.ru}、[два]{.ru}，“二”和阳性同形。

    第 2、5、8、10、12、14 题：阴性 [одна́]{.ru}、[две]{.ru}。第 8、12 题 [тетра́дь, ночь]{.ru} 是 [-ь]{.ru} 结尾的阴性名词。'
- id: L28-03
  tags:
  - 数词与 час 连用
  task: 按数词选择 [час]{.ru} 的形式。
  type: classify
  bins:
  - '[час]{.ru}'
  - '[часа́]{.ru}'
  - '[часо́в]{.ru}'
  items:
  - text: '[два]{.ru}'
    answer: '[часа́]{.ru}'
  - text: '[пять]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[оди́ннадцать]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[оди́н]{.ru}'
    answer: '[час]{.ru}'
  - text: '[четы́ре]{.ru}'
    answer: '[часа́]{.ru}'
  - text: '[семь]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[три]{.ru}'
    answer: '[часа́]{.ru}'
  - text: '[двена́дцать]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[де́сять]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[шесть]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[во́семь]{.ru}'
    answer: '[часо́в]{.ru}'
  - text: '[де́вять]{.ru}'
    answer: '[часо́в]{.ru}'
  why: '第 4 题：1 后面用 [час]{.ru}。

    第 1、5、7 题：2、3、4 后面用 [часа́]{.ru}。

    第 2、3、6、8–12 题：5–12 后面用 [часо́в]{.ru}。第 8 题 [двена́дцать]{.ru} 虽然里面有“二”，但它是一个数词，按 5 以上处理。'
