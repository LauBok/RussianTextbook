    cells:
    - '[Э́то подру́га, … я подари́л цветы́. (кото́рый)]{.ru}'
    - '[кото́рой]{.ru}'
  - base: '[Я зна́ю челове́ка, … рабо́тает в музе́е. (кото́рый)]{.ru}'
    cells:
    - '[Я зна́ю челове́ка, … рабо́тает в музе́е. (кото́рый)]{.ru}'
    - '[кото́рый]{.ru}'
  - base: '[Е́сли за́втра … (быть) дождь, мы оста́немся до́ма.]{.ru}'
    cells:
    - '[Е́сли за́втра … (быть) дождь, мы оста́немся до́ма.]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[Па́па сказа́л, что́бы мы … (вы́ключить) свет.]{.ru}'
    cells:
    - '[Па́па сказа́л, что́бы мы … (вы́ключить) свет.]{.ru}'
    - '[вы́ключили]{.ru}'
  - base: '[Пе́ред тем как … (лечь) спать, Ми́ша почи́стил зу́бы.]{.ru}'
    cells:
    - '[Пе́ред тем как … (лечь) спать, Ми́ша почи́стил зу́бы.]{.ru}'
    - '[лечь]{.ru}'
  - base: '[Мы бу́дем игра́ть, пока́ ма́ма не … (позва́ть) нас.]{.ru}'
    cells:
    - '[Мы бу́дем игра́ть, пока́ ма́ма не … (позва́ть) нас.]{.ru}'
    - '[позовёт]{.ru}'
  - base: '[Э́то студе́нты, … я помога́ю. (кото́рый)]{.ru}'
    cells:
    - '[Э́то студе́нты, … я помога́ю. (кото́рый)]{.ru}'
    - '[кото́рым]{.ru}'
  - base: '[Е́сли бы вы … (прийти́) вчера́, вы бы уви́дели Ди́му.]{.ru}'
    cells:
    - '[Е́сли бы вы … (прийти́) вчера́, вы бы уви́дели Ди́му.]{.ru}'
    - '[пришли́]{.ru}'
  - base: '[Ди́ма вы́шел ра́но, что́бы не … (опозда́ть).]{.ru}'
    cells:
    - '[Ди́ма вы́шел ра́но, что́бы не … (опозда́ть).]{.ru}'
    - '[опозда́ть]{.ru}'
  why: |-
    第 1、9 题：[что́бы]{.ru} 后另有主语，用过去时形式：[пришёл, вы́ключили]{.ru}。
    第 2、13 题：[е́сли бы]{.ru} + 过去时形式：说话人是女性 [зна́ла]{.ru}；[вы]{.ru} 用 [пришли́]{.ru}。
    第 3、11 题：[пока́ не]{.ru} 说将来，用完成体将来时：[верну́сь, позовёт]{.ru}。
    第 4、8 题：[когда́, е́сли]{.ru} 说将来的事，用将来时：[прие́дешь, бу́дет]{.ru}；不能用现在时。
    第 5–7、12 题：[кото́рый]{.ru} 的格看从句：[жил в до́ме → в кото́ром]{.ru}，[подари́л подру́ге → кото́рой]{.ru}，从句主语 [кото́рый]{.ru}，[помога́ю студе́нтам → кото́рым]{.ru}。
    第 10、14 题：主语相同，[пе́ред тем как, что́бы]{.ru} 后用不定式。
