    第 5 题：[е́сли бы]{.ru} 后不用将来时：[е́сли бы я знал]{.ru}。
    第 6 题：原因放在句首只能用 [так как]{.ru}。
    第 7 题：[кото́рый]{.ru} 在从句里作主语，用第一格。
    第 8 题：[пока́ не]{.ru} 说将来，用完成体将来时：[пока́ я не приду́]{.ru}。
    第 9 题：主语相同用不定式：[Я хочу́ пойти́ в кино́]{.ru}。
    第 10 题：[е́сли бы]{.ru} 句的主句也要有 [бы]{.ru}。
    第 11 题：副词 [обы́чно]{.ru} 前面要用 [чем]{.ru}；也可以说 [ра́ньше обы́чного]{.ru}。
    第 13 题：两件事同时进行，用 [пока́]{.ru} + 未完成体，不用 [пока́ не]{.ru}。
    第 14 题：[кото́рый]{.ru} 的性数跟先行词 [у́лица]{.ru}：[на кото́рой]{.ru}。
    第 15 题：目的从句主语相同，用不定式。
    第 16 题：真实条件，主句用将来时，不加 [бы]{.ru}。
    第 17 题：下雨所以待在家里，是顺理成章的原因，不是让步：[Так как шёл дождь, мы оста́лись до́ма]{.ru}。
