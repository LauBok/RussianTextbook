    - '[Е́сли бы я … (знать), я бы сказа́ла тебе́.]{.ru}'
    - '[зна́ла]{.ru}'
  - base: '[Подожди́, пока́ я не … (верну́ться).]{.ru}'
    cells:
    - '[Подожди́, пока́ я не … (верну́ться).]{.ru}'
    - '[верну́сь]{.ru}'
  - base: '[Когда́ ты … (прие́хать) в Москву́, позвони́ мне.]{.ru}'
