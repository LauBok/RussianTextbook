  - B2-L51-01
  - B2-L52-01
  - B2-L53-01
  tags:
  - 综合：连接词与意义
  task: 句中的俄语部分该用哪个连接词引出？归入相应的栏。
  type: classify
  bins:
  - '[так как]{.ru}'
  - '[так что]{.ru}'
  - '[хотя́]{.ru}'
  - '[пока́ не]{.ru}'
  - '[пока́]{.ru}'
  - '[как бу́дто]{.ru}'
  - '[по́сле того́ как]{.ru}'
  - '[пе́ред тем как]{.ru}'
  items:
  - text: 因为[бы́ло по́здно]{.ru}，我们打了车。
    answer: '[так как]{.ru}'
  - text: 因为[Ди́ма боле́л]{.ru}，他没来比赛。
    answer: '[так как]{.ru}'
  - text: 天晚了，所以[мы взя́ли такси́]{.ru}。
    answer: '[так что]{.ru}'
  - text: 迪马考完了所有考试，所以[ле́то у него́ свобо́дное]{.ru}。
    answer: '[так что]{.ru}'
  - text: 虽然[бы́ло хо́лодно]{.ru}，我们还是去散步了。
    answer: '[хотя́]{.ru}'
  - text: 虽然[он уста́л]{.ru}，他还是去帮朋友了。
    answer: '[хотя́]{.ru}'
  - text: 我们一直等到[па́па пришёл]{.ru}。
    answer: '[пока́ не]{.ru}'
  - text: 在你回来（[ты вернёшься]{.ru}）之前，我不走。
    answer: '[пока́ не]{.ru}'
  - text: 在[ты спал]{.ru}的时候，来了一封信。
    answer: '[пока́]{.ru}'
  - text: 趁[ма́ма гото́вит у́жин]{.ru}，我们去散散步。
    answer: '[пока́]{.ru}'
  - text: 他说话的样子，好像[он всё зна́ет]{.ru}。
    answer: '[как бу́дто]{.ru}'
  - text: 米沙看着我，好像[не узнаёт меня́]{.ru}。
    answer: '[как бу́дто]{.ru}'
  - text: 在[мы поу́жинали]{.ru}以后，我们去散步了。
    answer: '[по́сле того́ как]{.ru}'
  - text: 在[дождь ко́нчился]{.ru}以后，孩子们跑到院子里。
    answer: '[по́сле того́ как]{.ru}'
  - text: 在[уйти́]{.ru}之前，迪马关了灯。
    answer: '[пе́ред тем как]{.ru}'
  - text: 在[гости́ пришли́]{.ru}之前，我们收拾了房间。
    answer: '[пе́ред тем как]{.ru}'
  why: |-
    第 1、2 题：原因放在句首：[Так как бы́ло по́здно, мы взя́ли такси́.]{.ru}
    第 3、4 题：后一分句说结果：[так что]{.ru}（也可以用 [поэ́тому]{.ru}）。
    第 5、6 题：让步：[Хотя́ бы́ло хо́лодно, …]{.ru}；主句不再加 [но]{.ru}。
    第 7、8 题：一直到某事发生为止：[пока́ па́па не пришёл]{.ru}；第 8 题说将来，用 [пока́ ты не вернёшься]{.ru}（[не]{.ru} 没有否定意义）。
    第 9、10 题：同时进行：[пока́ ты спал, пока́ ма́ма гото́вит у́жин]{.ru}。
    第 11、12 题：想象的比较，其实不是这样：[как бу́дто]{.ru}。
    第 13、14 题：从句的事先发生：[по́сле того́ как мы поу́жинали]{.ru}。
    第 15、16 题：从句的事后发生：[пе́ред тем как]{.ru}；主语相同用不定式（第 15 题），不同用变位动词（第 16 题）。
