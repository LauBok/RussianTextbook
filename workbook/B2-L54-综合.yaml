  why: |-
    第 1 题：原因和结果只标一处：去掉 [поэ́тому]{.ru}（或改说 [Шёл дождь, поэ́тому мы бы́ли до́ма]{.ru}）。
    第 2 题：用了 [хотя́]{.ru}，主句不再加 [но]{.ru}。
    第 3 题：[несмотря́ на то что]{.ru} 的 [то]{.ru} 不能漏。
