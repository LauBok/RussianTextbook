  task: 按从句（或后一分句）的种类把句子归栏。
  type: classify
  bins:
  - 定语
  - 说明
  - 目的
  - 时间
  - 条件
  - 原因
  - 结果
  - 让步
  - 比较
  items:
  - text: '[Вот кафе́, в кото́ром мы познако́мились.]{.ru}'
    answer: 定语
  - text: '[Я чита́ю кни́гу, кото́рую ты мне подари́л.]{.ru}'
    answer: 定语
  - text: '[Студе́нт, с кото́рым я живу́, из Фра́нции.]{.ru}'
    answer: 定语
  - text: '[Ма́ма хо́чет, что́бы я позвони́л ей.]{.ru}'
    answer: 说明
  - text: '[Я зна́ю, что ты уста́л.]{.ru}'
    answer: 说明
  - text: '[Учи́тель сказа́л, что́бы мы откры́ли кни́ги.]{.ru}'
    answer: 说明
  - text: '[Я встал ра́но, что́бы не опозда́ть.]{.ru}'
    answer: 目的
  - text: '[Па́па купи́л слова́рь, что́бы Ми́ша учи́л англи́йский.]{.ru}'
    answer: 目的
  - text: '[Мы пришли́ ра́ньше, для того́ что́бы заня́ть места́.]{.ru}'
    answer: 目的
    new: true
    gloss: 占座
  - text: '[Пока́ ты спал, пришло́ письмо́.]{.ru}'
    answer: 时间
  - text: '[Подожди́, пока́ я не приду́.]{.ru}'
    answer: 时间
  - text: '[По́сле того́ как мы поу́жинали, мы пошли́ гуля́ть.]{.ru}'
    answer: 时间
  - text: '[Е́сли бы я знал, я бы пришёл.]{.ru}'
    answer: 条件
  - text: '[Е́сли пойдёт дождь, мы оста́немся до́ма.]{.ru}'
    answer: 条件
  - text: '[Е́сли бы у меня́ бы́ло вре́мя, я бы почита́л.]{.ru}'
    answer: 条件
  - text: '[Так как бы́ло по́здно, мы взя́ли такси́.]{.ru}'
    answer: 原因
  - text: '[Я не пришёл, потому́ что боле́л.]{.ru}'
    answer: 原因
  - text: '[Бы́ло по́здно, так что мы взя́ли такси́.]{.ru}'
    answer: 结果
  - text: '[Шёл дождь, поэ́тому мы оста́лись до́ма.]{.ru}'
    answer: 结果
  - text: '[Хотя́ бы́ло хо́лодно, мы пошли́ гуля́ть.]{.ru}'
    answer: 让步
  - text: '[Несмотря́ на то что Пьер уста́л, он помо́г нам.]{.ru}'
    answer: 让步
  - text: '[Он говори́т так, как бу́дто всё зна́ет.]{.ru}'
    answer: 比较
  - text: '[Сего́дня тепле́е, чем вчера́.]{.ru}'
    answer: 比较
  - text: '[Я сде́лал всё так, как ты сказа́л.]{.ru}'
    answer: 比较
  why: |-
    第 1–3 题：[кото́рый]{.ru} 说明前面的名词，是定语从句。
    第 4–6 题：[что, что́бы]{.ru} 跟在 [хоте́ть, знать, сказа́ть]{.ru} 后面，补充它们的内容，是说明从句。
    第 7–9 题：[что́бы, для того́ что́бы]{.ru} 说明整个主句的动作为了什么，是目的从句。第 4、6 题和第 7、8 题都用 [что́бы]{.ru}，要看它说明的是主句里的某个词，还是整个动作。
    第 10–12 题：[пока́, пока́ не, по́сле того́ как]{.ru} 是时间从句。
    第 13–15 题：[е́сли, е́сли бы]{.ru} 是条件从句。
    第 16、17 题：[так как, потому́ что]{.ru} 引出原因；第 18、19 题：[так что, поэ́тому]{.ru} 引出结果。第 16 题和第 18 题说的是同一件事，只是连接词标在不同的分句上。
    第 20、21 题：[хотя́, несмотря́ на то что]{.ru} 是让步从句。
    第 22–24 题：[как, как бу́дто, чем]{.ru} 是比较从句。
