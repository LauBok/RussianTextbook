  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[идём]{.ru}'
    - '[е́дем]{.ru}'
    - '[хо́дим]{.ru}'
    - '[е́здим]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[идёте]{.ru}'
    - '[е́дете]{.ru}'
    - '[хо́дите]{.ru}'
    - '[е́здите]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[иду́т]{.ru}'
    - '[е́дут]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́здят]{.ru}'
  - base: '[Ван Лэй]{.ru}'
    cells:
    - '[Ван Лэй]{.ru}'
    - '[идёт]{.ru}'
    - '[е́дет]{.ru}'
    - '[хо́дит]{.ru}'
    - '[е́здит]{.ru}'
  - base: '[А́нна и Ми́ша]{.ru}'
    cells:
    - '[А́нна и Ми́ша]{.ru}'
    - '[иду́т]{.ru}'
    - '[е́дут]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́здят]{.ru}'
  why: '第 1 题：最容易错的是 [я]{.ru}：定向的 [иду́, е́ду]{.ru} 没有交替，不定向的 [хожу́, е́зжу]{.ru} 有交替。

    第 2–8 题：定向动词是第一变位，词尾 [-ёшь / -ешь, -ут]{.ru}：[идёшь, иду́т, е́дешь, е́дут]{.ru}；不定向动词是第二变位，词尾 [-ишь, -ят]{.ru}：[хо́дишь, хо́дят, е́здишь, е́здят]{.ru}。'
- id: L25-综合-b
  tags:
  - 综合：运动动词意义辨别
  recycles:
  - L24-02
  - L25-02
  task: 判断句中运动动词表示的意思。
  type: classify
  bins:
  - 此刻正在路上
  - 定好的一次去向
  - 经常往返
  items:
  - text: '[— Куда́ ты идёшь? — В библиоте́ку.]{.ru}'
    answer: 此刻正在路上
  - text: '[Ка́ждый день па́па е́здит на заво́д.]{.ru}'
    answer: 经常往返
  - text: '[Сего́дня ве́чером мы е́дем на да́чу.]{.ru}'
    answer: 定好的一次去向
  - text: '[Ми́ша хо́дит в шко́лу.]{.ru}'
    answer: 经常往返
  - text: '[Сейча́с я е́ду в центр.]{.ru}'
    answer: 此刻正在路上
  - text: '[Мы ча́сто хо́дим в парк.]{.ru}'
    answer: 经常往返
  - text: '[Ве́чером мы идём в теа́тр.]{.ru}'
    answer: 定好的一次去向
  - text: '[Вот идёт О́льга Ви́кторовна.]{.ru}'
    answer: 此刻正在路上
  - text: '[Я ре́дко е́зжу в центр.]{.ru}'
    answer: 经常往返
  - text: '[Сего́дня ве́чером А́нна идёт на конце́рт.]{.ru}'
    answer: 定好的一次去向
  - text: '[Студе́нты сейча́с иду́т на уро́к.]{.ru}'
    answer: 此刻正在路上
  - text: '[Вы иногда́ е́здите в Пеки́н?]{.ru}'
    answer: 经常往返
  - text: '[Ве́чером Ван Лэй е́дет в Шанха́й.]{.ru}'
    answer: 定好的一次去向
  - text: '[Ты всегда́ хо́дишь пешко́м?]{.ru}'
    answer: 经常往返
  - text: '[Па́па сейча́с е́дет домо́й.]{.ru}'
    answer: 此刻正在路上
  why: '第 1、5、8、11、15 题：[сейча́с]{.ru}、[Куда́ ты идёшь?]{.ru}、[Вот идёт…]{.ru} 说的是说话这一刻正在路上，用定向动词。

    第 3、7、10、13 题：定向动词现在时加 [ве́чером, сего́дня ве́чером]{.ru}，是已经安排好的一次去向，用现在时表示将来。

    第 2、4、6、9、12、14 题：不定向动词说经常、反复的往返；第 4 题 [Ми́ша хо́дит в шко́лу]{.ru} 是“米沙在上中学”。[ре́дко, иногда́]{.ru} 也是说习惯。'
