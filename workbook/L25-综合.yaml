  tags:
  - 综合：运动动词现在时
  recycles:
  - L24-01
  - L25-01
  - L25-03
  task: 按主语写出四个运动动词的现在时。
  type: matrix
  cols:
  - 主语
  - '[идти́]{.ru}'
  - '[е́хать]{.ru}'
  - '[ходи́ть]{.ru}'
  - '[е́здить]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[иду́]{.ru}'
    - '[е́ду]{.ru}'
    - '[хожу́]{.ru}'
    - '[е́зжу]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[идёшь]{.ru}'
    - '[е́дешь]{.ru}'
    - '[хо́дишь]{.ru}'
    - '[е́здишь]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[идёт]{.ru}'
    - '[е́дет]{.ru}'
    - '[хо́дит]{.ru}'
