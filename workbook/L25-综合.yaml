  why: '第 1、3、5、7、8、12、15 题：阴性：处所修饰语 [-ой / -ей, на́шей, мое́й, э́той]{.ru}，去向修饰语 [-ую / -юю, на́шу, мою́, э́ту]{.ru}。第 8、12 题名词 [-ии]{.ru} 对 [-ию]{.ru}。

    第 10 题：[пло́щадь]{.ru} 是阴性，处所 [на Кра́сной пло́щади]{.ru}，去向时名词不变，修饰语仍要变：[на Кра́сную пло́щадь]{.ru}。

    第 2、4、6、11、13、14 题：阳性非动物：去向时修饰语和名词都同第一格，处所时都变：[на э́том стадио́не → на э́тот стадио́н]{.ru}。

    第 9 题：中性去向同第一格；处所 [в на́шем общежи́тии]{.ru}。'
