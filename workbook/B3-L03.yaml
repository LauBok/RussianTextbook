  why: |-
    第 1–4、6 题：第一变位动词，复数第一人称 [-ем]{.ru} 加 [-ый]{.ru}：[изуча́емый, чита́емый, получа́емый, выполня́емый]{.ru}；[-ова-]{.ru} 动词由 [контроли́руем]{.ru} 构成：[контроли́руемый]{.ru}。
    第 7–10、15 题：第二变位动词，[-им]{.ru} 加 [-ый]{.ru}：[производи́мый, храни́мый, слы́шимый, цени́мый, переводи́мый]{.ru}。单数第一人称的交替（[произвожу́, перевожу́]{.ru}）不进入形动词。重音要逐个记：[слы́шимый]{.ru} 在词干，[производи́мый, цени́мый, переводи́мый]{.ru} 在 [-и́-]{.ru} 上，与复数第一人称 [произво́дим, це́ним]{.ru} 不同。
    第 12–14 题：[-ава́ть]{.ru} 动词保留 [-ва-]{.ru}，不由 [создаём]{.ru} 构成：[создава́емый, издава́емый, узнава́емый]{.ru}。常见错误是写成 [создаёмый]{.ru}。
    第 5、11、16 题：[писа́ть, ждать, брать]{.ru} 是课文列出的没有被动形动词现在时的动词，写“—”。要表达这个意思，用 [кото́рый]{.ru} 从句：[письмо́, кото́рое он пи́шет]{.ru}。
- id: B3-L03-02
  lessons:
  - B3-L03
  tags:
  - 被动形动词现在时：与第四格 кото́рый 从句互换
  - 被动形动词现在时：发出者第五格
  task: 把从句换成被动形动词短语：写出与名词一致的形动词和发出者的形式。
  type: matrix
  cols:
  - 名词 + 从句
  - 被动形动词
  - 发出者
  given:
  - 0
  rows:
  - base: '[в журна́ле, кото́рый издаёт поэ́т]{.ru}'
    cells:
    - '[в журна́ле, кото́рый издаёт поэ́т]{.ru}'
    - '[издава́емом]{.ru}'
    - '[поэ́том]{.ru}'
    new: true
    gloss: издава́ть 出版
  - base: '[о зада́че, кото́рую реша́ют инжене́ры]{.ru}'
    cells:
    - '[о зада́че, кото́рую реша́ют инжене́ры]{.ru}'
    - '[реша́емой]{.ru}'
    - '[инжене́рами]{.ru}'
  - base: '[с де́вушкой, кото́рую все лю́бят]{.ru}'
    cells:
    - '[с де́вушкой, кото́рую все лю́бят]{.ru}'
    - '[люби́мой]{.ru}'
    - '[все́ми]{.ru}'
  - base: '[к о́пытам, кото́рые прово́дит профе́ссор]{.ru}'
    cells:
    - '[к о́пытам, кото́рые прово́дит профе́ссор]{.ru}'
    - '[проводи́мым]{.ru}'
    - '[профе́ссором]{.ru}'
  - base: '[кни́ги, кото́рые чита́ет молодёжь]{.ru}'
    cells:
    - '[кни́ги, кото́рые чита́ет молодёжь]{.ru}'
    - '[чита́емые]{.ru}'
    - '[молодёжью]{.ru}'
  - base: '[для програ́ммы, кото́рую передаёт ра́дио]{.ru}'
    cells:
