    - '[язы́к, изуча́емый студе́нтами]{.ru}'
  - base: '[о кни́ге, чита́емая все́ми]{.ru}'
    cells:
    - '[о кни́ге, чита́емая все́ми]{.ru}'
    - '[о кни́ге, чита́емой все́ми]{.ru}'
  - base: '[письмо́, пи́шемое бра́том]{.ru}'
    cells:
    - '[письмо́, пи́шемое бра́том]{.ru}'
    - '[письмо́, кото́рое пи́шет брат]{.ru}'
  - base: '[вопро́сы, обсужда́емые на уро́ке]{.ru}'
    cells:
    - '[вопро́сы, обсужда́емые на уро́ке]{.ru}'
    - '[вопро́сы, обсужда́емые на уро́ке]{.ru}'
  - base: '[сло́во, слы́шемое везде́]{.ru}'
    cells:
    - '[сло́во, слы́шемое везде́]{.ru}'
    - '[сло́во, слы́шимое везде́]{.ru}'
  - base: '[газе́та, издава́ема в Москве́]{.ru}'
    cells:
    - '[газе́та, издава́ема в Москве́]{.ru}'
    - '[газе́та, издава́емая в Москве́]{.ru}'
  - base: '[о́пыты, проводи́мые на́шей лаборато́рией]{.ru}'
    cells:
    - '[о́пыты, проводи́мые на́шей лаборато́рией]{.ru}'
    - '[о́пыты, проводи́мые на́шей лаборато́рией]{.ru}'
  - base: '[това́ры, производя́емые заво́дом]{.ru}'
    cells:
    - '[това́ры, производя́емые заво́дом]{.ru}'
    - '[това́ры, производи́мые заво́дом]{.ru}'
  - base: '[с дру́гом, люби́мым всем кла́ссом]{.ru}'
    cells:
    - '[с дру́гом, люби́мым всем кла́ссом]{.ru}'
    - '[с дру́гом, люби́мым всем кла́ссом]{.ru}'
  why: |-
    第 1 题：[-ава́ть]{.ru} 动词保留 [-ва-]{.ru}：[передава́емые]{.ru}，不由 [передаём]{.ru} 构成。
    第 2 题：发出者用第五格：[реша́емая учёными]{.ru}。
    第 4 题：[язы́к]{.ru} 是被学习的对象，要用被动形动词 [изуча́емый]{.ru}；[изуча́ющий]{.ru} 是“学习……的（人）”。带第五格发出者的一定是被动形动词。
    第 5、9 题：形动词与被说明的名词一致：[о кни́ге]{.ru} 是阴性第六格 → [чита́емой]{.ru}；[газе́та]{.ru} 作主语的定语用长尾第一格 [издава́емая]{.ru}。
    第 6 题：[писа́ть]{.ru} 没有被动形动词现在时，只能用从句：[письмо́, кото́рое пи́шет брат]{.ru}。
    第 8、11 题：第二变位动词用 [-им-]{.ru}：[слы́шим → слы́шимое]{.ru}，[произво́дим → производи́мые]{.ru}。
    第 3、7、10、12 题：原文正确，照抄。[уважа́емый]{.ru} 已形容词化；[всем кла́ссом]{.ru} 是第五格发出者。
- id: B3-L03-04
  lessons:
  - B3-L03
  tags:
  - 被动形动词现在时：句中填空
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Э́то зада́ча, ___ то́лько с по́мощью компью́тера.
    hint: реша́ть
    accept:
    - реша́емая
  - stem: Нам нра́вятся пе́сни, ___ э́тим арти́стом.
    hint: исполня́ть
    accept:
    - исполня́емые
    new: true
    gloss: 演唱，表演
  - stem: В статье́ говори́тся о ме́тодах, ___ в на́шей шко́ле.
    hint: применя́ть
    accept:
    - применя́емых
    new: true
    gloss: 运用
  - stem: Э́то оди́н из са́мых популя́рных журна́лов, ___ в Росси́и.
    hint: издава́ть
    accept:
    - издава́емых
    new: true
    gloss: 出版
  - stem: Мы пое́хали на вы́ставку, ___ музе́ем ка́ждый год.
    hint: устра́ивать
    accept:
    - устра́иваемую
    new: true
    gloss: 举办
  - stem: Учи́тель дово́лен рабо́той, ___ студе́нтами.
    hint: выполня́ть
    accept:
    - выполня́емой
    new: true
    gloss: 完成
  - stem: Ма́рки, ___ де́душкой, лежа́т в шкафу́.
    hint: собира́ть
    accept:
    - собира́емые
  - stem: Мы говори́ли о кни́ге, ___ в шко́ле.
    hint: изуча́ть
    accept:
    - изуча́емой
  - stem: Карти́на, ___ все́ми тури́стами, виси́т в Ру́сском музе́е.
    hint: люби́ть
    accept:
    - люби́мая
  - stem: Я давно́ хоте́л посмотре́ть фильм, ___ все́ми мои́ми друзья́ми.
    hint: обсужда́ть
    accept:
    - обсужда́емый
  - stem: Мы отве́тили на вопро́сы, ___ чита́телями.
    hint: задава́ть
    accept:
    - задава́емые
  - stem: В це́нтре го́рода мно́го зда́ний, ___ госуда́рством.
    hint: охраня́ть
    accept:
    - охраня́емых
    new: true
    gloss: 保护
  - stem: Ле́кции, ___ э́тим профе́ссором, всегда́ интере́сны.
    hint: чита́ть
    accept:
    - чита́емые
  - stem: Я написа́л о пра́здниках, ___ в мое́й семье́.
    hint: отмеча́ть
    accept:
    - отмеча́емых
  why: |-
    第 1、6、8、9 题：阴性单数：第一格 [реша́емая, люби́мая]{.ru}，第五格 [рабо́той → выполня́емой]{.ru}，第六格 [о кни́ге → изуча́емой]{.ru}。[дово́лен]{.ru} 要求第五格。
    第 2、7、11 题：复数第一格或非动物名词复数第四格：[исполня́емые, собира́емые, задава́емые]{.ru}；[задава́ть]{.ru} 保留 [-ва-]{.ru}。
    第 3、4、12 题：复数第六格、第二格：[о ме́тодах → применя́емых]{.ru}；[оди́н из]{.ru} 后的名词和形动词都用复数第二格：[журна́лов, издава́емых]{.ru}；[мно́го зда́ний → охраня́емых]{.ru}。
    第 5 题：[на вы́ставку]{.ru} 是阴性第四格：[устра́иваемую]{.ru}。
    第 10 题：[фильм]{.ru} 是非动物名词，第四格同第一格：[обсужда́емый]{.ru}。
    第 13、14 题：复数第一格 [ле́кции → чита́емые]{.ru}，复数第六格 [о пра́здниках → отмеча́емых]{.ru}。
    第 1、3、4、8、12、14 题没有说出发出者，被动形动词照样可以用；说出时用第五格（第 2、5、6、7、9–11、13 题）。
