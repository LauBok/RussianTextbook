    - '[ра́дио]{.ru}'
  - base: '[о языке́, кото́рый изуча́ют студе́нты]{.ru}'
    cells:
    - '[о языке́, кото́рый изуча́ют студе́нты]{.ru}'
    - '[изуча́емом]{.ru}'
    - '[студе́нтами]{.ru}'
  - base: '[у учи́теля, кото́рого уважа́ют ученики́]{.ru}'
    cells:
    - '[у учи́теля, кото́рого уважа́ют ученики́]{.ru}'
    - '[уважа́емого]{.ru}'
    - '[ученика́ми]{.ru}'
  - base: '[зда́ние, кото́рое охраня́ет госуда́рство]{.ru}'
    cells:
    - '[зда́ние, кото́рое охраня́ет госуда́рство]{.ru}'
    - '[охраня́емое]{.ru}'
    - '[госуда́рством]{.ru}'
    new: true
    gloss: охраня́ть 保护
  - base: '[о студе́нтах, кото́рых хва́лит преподава́тель]{.ru}'
    cells:
    - '[о студе́нтах, кото́рых хва́лит преподава́тель]{.ru}'
    - '[хвали́мых]{.ru}'
    - '[преподава́телем]{.ru}'
    hint: хвалю́, хва́лишь
    new: true
    gloss: хвали́ть 表扬
  - base: '[това́ры, кото́рые произво́дит заво́д]{.ru}'
    cells:
    - '[това́ры, кото́рые произво́дит заво́д]{.ru}'
    - '[производи́мые]{.ru}'
    - '[заво́дом]{.ru}'
  - base: '[тради́ции, кото́рые храни́т наро́д]{.ru}'
    cells:
    - '[тради́ции, кото́рые храни́т наро́д]{.ru}'
    - '[храни́мые]{.ru}'
    - '[наро́дом]{.ru}'
  why: |-
    第 1–12 题：从句里的 [кото́рый]{.ru} 是第四格（动作的对象），可以换成被动形动词；从句的主语变成第五格，放在形动词后面：[кото́рый издаёт поэ́т → издава́емый поэ́том]{.ru}。
    形动词的性、数、格看被说明的名词：第 1、7 题阳性第六格 [издава́емом, изуча́емом]{.ru}；第 2 题阴性第六格 [реша́емой]{.ru}；第 3 题阴性第五格 [люби́мой]{.ru}；第 4 题复数第三格 [проводи́мым]{.ru}；第 5、11、12 题复数第一格 [чита́емые, производи́мые, храни́мые]{.ru}；第 6 题阴性第二格 [передава́емой]{.ru}；第 8 题阳性第二格 [уважа́емого]{.ru}；第 9 题中性第一格 [охраня́емое]{.ru}；第 10 题复数第六格 [хвали́мых]{.ru}。
    发出者：[все → все́ми]{.ru}，[молодёжь → молодёжью]{.ru}（阴性 [-ь]{.ru}），[ра́дио]{.ru} 不变格。第 6 题 [передава́ть]{.ru} 保留 [-ва-]{.ru}：[передава́емой]{.ru}。
