  why: |-
    第 1–7 题：复数第三人称去掉词尾，加 [-я]{.ru}：[чита́я, рису́я, ду́мая, говоря́, смотря́, ходя́, неся́]{.ru}。第二变位动词的副动词重音多半在词尾：[говоря́, смотря́, ходя́]{.ru}，不随 [смо́трят, хо́дят]{.ru}。
    第 9–11 题：词干以 [ж, ш, ч, щ]{.ru} 结尾，写 [-а]{.ru}：[спеша́, крича́, дрожа́]{.ru}，不写 [-я]{.ru}。
    第 13–15 题：[-ся]{.ru} 动词的副动词以 [-сь]{.ru} 结尾：[уча́сь, улыба́ясь, возвраща́ясь]{.ru}（形动词才是 [-ся]{.ru}）。第 13 题 [ч]{.ru} 后写 [-а]{.ru}：[уча́сь]{.ru}。
    第 16、17 题：[-ава́ть]{.ru} 动词由不定式词干构成，保留 [-ва-]{.ru}：[продава́я, сдава́я]{.ru}，不能由 [продаю́т]{.ru} 构成。
    第 8、12、18 题：[писа́ть, пить, ждать]{.ru} 没有未完成体副动词，写“—”；需要时用从句：[когда́ он писа́л…]{.ru}。
- id: B3-L11-02
  lessons:
  - B3-L11
  tags:
  - 主动形动词现在时与未完成体副动词对照
  task: 写出动词的主动形动词现在时（阳性第一格）和未完成体副动词，不存在的写“—”。
  type: matrix
