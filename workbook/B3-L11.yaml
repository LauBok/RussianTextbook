    cells:
    - '[люби́ть]{.ru}'
    - '[лю́бящий]{.ru}'
    - '[любя́]{.ru}'
  why: |-
    第 1、5、10 题：形动词后面是 [-ся]{.ru}，副动词后面是 [-сь]{.ru}：[занима́ющийся / занима́ясь]{.ru}，[боя́щийся / боя́сь]{.ru}，[гото́вящийся / гото́вясь]{.ru}。形动词有性、数、格的变化，副动词不变。
    第 2、7 题：形动词由 [даю́т, встаю́т]{.ru} 构成：[даю́щий, встаю́щий]{.ru}；副动词保留 [-ва-]{.ru}：[дава́я, встава́я]{.ru}。
    第 3、4、8、11、12 题：两种形式都由复数第三人称构成：[живу́т → живу́щий / живя́]{.ru}，[летя́т → летя́щий / летя́]{.ru}，[де́ржат → держа́щий / держа́]{.ru}，[плыву́т → плыву́щий / плывя́]{.ru}；第 12 题形动词重音例外 [лю́бящий]{.ru}，副动词 [любя́]{.ru}。
    第 6、9 题：[петь, е́хать]{.ru} 有形动词 [пою́щий, е́дущий]{.ru}，但没有副动词。
- id: B3-L11-03
  lessons:
  - B3-L11
  tags:
  - 未完成体副动词：主语相同
  - 未完成体副动词：无人称句与不定式
  task: 这些句子里的副动词用得对不对？归栏。
  type: classify
  bins:
  - 副动词用得对
  - 副动词用得不对
  items:
  - text: '[Гуля́я по па́рку, я ду́мал о бу́дущем.]{.ru}'
    answer: 副动词用得对
  - text: '[Гуля́я по па́рку, мне понра́вились дере́вья.]{.ru}'
    answer: 副动词用得不对
  - text: '[Сто́я на мосту́, тру́дно не смотре́ть на ре́ку.]{.ru}'
    answer: 副动词用得对
  - text: '[Чита́я кни́гу, у меня́ заболе́ла голова́.]{.ru}'
    answer: 副动词用得不对
  - text: '[Возвраща́ясь домо́й, мы зашли́ в магази́н.]{.ru}'
    answer: 副动词用得对
  - text: '[Подходя́ к до́му, на́чался дождь.]{.ru}'
    answer: 副动词用得不对
  - text: '[Чита́я э́ту кни́гу, мо́жно мно́го узна́ть о Байка́ле.]{.ru}'
    answer: 副动词用得对
  - text: '[Си́дя у окна́, ей бы́ло ску́чно.]{.ru}'
    answer: 副动词用得不对
  - text: '[Он слу́шал мою́ исто́рию, не говоря́ ни сло́ва.]{.ru}'
    answer: 副动词用得对
  - text: '[Пи́ша письмо́, он ду́мал о ма́ме.]{.ru}'
    answer: 副动词用得不对
  - text: '[Не зна́я доро́ги, мы до́лго иска́ли музе́й.]{.ru}'
    answer: 副动词用得对
  - text: '[Возвраща́ясь из шко́лы, Ми́шу встре́тила ба́бушка.]{.ru}'
    answer: 副动词用得不对
  - text: '[Отдыха́я на мо́ре, мы ка́ждый день пла́вали.]{.ru}'
    answer: 副动词用得对
  - text: '[Е́дя на по́езде, мы смотре́ли в окно́.]{.ru}'
    answer: 副动词用得不对
  why: |-
    第 1、5、9、11、13 题：副动词和谓语是同一个主语发出的（[я, мы, он]{.ru}），用得对。第 11 题否定 [не]{.ru} 和副动词分写。
    第 3、7 题：无人称句里副动词和不定式连用（[тру́дно не смотре́ть, мо́жно узна́ть]{.ru}），说明的是不定式的动作，用得对。
    第 2、4、6、12 题：主语不同：[понра́вились дере́вья, заболе́ла голова́, на́чался дождь, встре́тила ба́бушка]{.ru}，散步、读书、走近、回家的却是另一个人。改法：[Когда́ я гуля́л по па́рку, мне понра́вились дере́вья]{.ru}；[Когда́ Ми́ша возвраща́лся из шко́лы, его́ встре́тила ба́бушка]{.ru}。
    第 8 题：无人称句里没有不定式，不能用副动词：[Когда́ она́ сиде́ла у окна́, ей бы́ло ску́чно]{.ru}。
    第 10、14 题：[писа́ть, е́хать]{.ru} 没有副动词：[Когда́ он писа́л письмо́…]{.ru}，[Когда́ мы е́хали на по́езде…]{.ru}，或用 [проезжа́я]{.ru} 一类的别的动词。
- id: B3-L11-04
  lessons:
  - B3-L11
  tags:
  - 未完成体副动词：句中填空
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: ___ по у́лице, я встре́тил ста́рого дру́га.
    hint: идти́
    accept:
    - идя́
  - stem: Ба́бушка сиде́ла у окна́, ___ носки́.
    hint: 'вяза́ть: вяжу́, вя́жешь'
    accept:
    - вя́жа
    new: true
    gloss: 编织
  - stem: ___ в Москве́, он ча́сто ходи́л в теа́тр.
    hint: жить
    accept:
    - живя́
  - stem: Мы до́лго разгова́ривали, ___ о ле́те.
    hint: мечта́ть
    accept:
    - мечта́я
  - stem: ___ на вопро́сы, студе́нт о́чень волнова́лся.
    hint: отвеча́ть
    accept:
    - отвеча́я
  - stem: ___ по-ру́сски, стара́йтесь не спеши́ть.
    hint: говори́ть
    accept:
    - говоря́
  - stem: Он вошёл в ко́мнату, ___ большу́ю коро́бку.
    hint: нести́
    accept:
    - неся́
  - stem: ___ ру́сский язы́к, Ван Лэй мно́го чита́л.
    hint: изуча́ть
    accept:
    - изуча́я
  - stem: ___ в университе́те, А́нна рабо́тала в кафе́.
    hint: учи́ться
    accept:
    - уча́сь
  - stem: Де́ти бежа́ли к мо́рю, ___ и крича́.
    hint: смея́ться
    accept:
    - смея́сь
  - stem: ___ ра́но, мы успева́ли на пе́рвый авто́бус.
    hint: встава́ть
    accept:
    - встава́я
  - stem: ___ в Москве́ в пе́рвый раз, он мно́гого не понима́л.
    hint: быть
    accept:
    - бу́дучи
  why: |-
    第 1、3、7 题：[иду́т, живу́т, несу́т]{.ru} 去词尾加 [-я]{.ru}：[идя́, живя́, неся́]{.ru}，重音在词尾。
    第 2 题：[вя́жут]{.ru}，[ж]{.ru} 后写 [-а]{.ru}：[вя́жа]{.ru}。
    第 4、5、8 题：[мечта́я, отвеча́я, изуча́я]{.ru}。第 6 题：[говоря́]{.ru}；命令式谓语也可以带副动词，时间由谓语决定。
    第 9、10 题：[-ся]{.ru} 动词的副动词以 [-сь]{.ru} 结尾：[уча́сь]{.ru}（[ч]{.ru} 后写 [-а]{.ru}），[смея́сь]{.ru}。
    第 11 题：[-ава́ть]{.ru} 保留 [-ва-]{.ru}：[встава́я]{.ru}。
    第 12 题：[быть]{.ru} 的副动词是 [бу́дучи]{.ru}。
    各句副动词和谓语的主语相同，动作同时进行，时间跟谓语：第 1 题过去，第 6 题命令。
