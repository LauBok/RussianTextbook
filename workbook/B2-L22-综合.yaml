heading: 综合练习　代词变格
lessons:
- B2-L15
- B2-L19
- B2-L20
- B2-L21
- B2-L22
groups:
- id: B2-L22-综合-a
  tags:
  - 综合：代词变格
  task: 写出代词的第二、三、五、六格（第六格连同前置词 [о]{.ru} 写）。
  type: matrix
  cols:
  - 代词
  - 第二格
  - 第三格
  - 第五格
  - '[о]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[меня́]{.ru}'
    - '[мне]{.ru}'
    - '[мной]{.ru}'
    - '[обо мне]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[его́]{.ru}'
    - '[ему́]{.ru}'
    - '[им]{.ru}'
    - '[о нём]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[её]{.ru}'
    - '[ей]{.ru}'
    - '[ей]{.ru}'
    - '[о ней]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[их]{.ru}'
    - '[им]{.ru}'
    - '[и́ми]{.ru}'
    - '[о них]{.ru}'
  - base: '[себя́]{.ru}'
    cells:
    - '[себя́]{.ru}'
    - '[себя́]{.ru}'
    - '[себе́]{.ru}'
    - '[собо́й]{.ru}'
    - '[о себе́]{.ru}'
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[кого́]{.ru}'
    - '[кому́]{.ru}'
    - '[кем]{.ru}'
    - '[о ком]{.ru}'
  - base: '[что]{.ru}'
    cells:
    - '[что]{.ru}'
    - '[чего́]{.ru}'
    - '[чему́]{.ru}'
    - '[чем]{.ru}'
    - '[о чём]{.ru}'
  - base: '[чья]{.ru}'
    cells:
    - '[чья]{.ru}'
    - '[чьей]{.ru}'
    - '[чьей]{.ru}'
    - '[чьей]{.ru}'
    - '[о чьей]{.ru}'
  - base: '[все]{.ru}'
    cells:
    - '[все]{.ru}'
    - '[всех]{.ru}'
    - '[всем]{.ru}'
    - '[все́ми]{.ru}'
    - '[обо всех]{.ru}'
  - base: '[сам]{.ru}'
    cells:
    - '[сам]{.ru}'
    - '[самого́]{.ru}'
    - '[самому́]{.ru}'
    - '[сами́м]{.ru}'
    - '[о само́м]{.ru}'
  - base: '[на́ши]{.ru}'
    cells:
    - '[на́ши]{.ru}'
    - '[на́ших]{.ru}'
    - '[на́шим]{.ru}'
    - '[на́шими]{.ru}'
    - '[о на́ших]{.ru}'
  - base: '[э́ти]{.ru}'
    cells:
    - '[э́ти]{.ru}'
    - '[э́тих]{.ru}'
    - '[э́тим]{.ru}'
    - '[э́тими]{.ru}'
    - '[об э́тих]{.ru}'
  - base: '[те]{.ru}'
    cells:
    - '[те]{.ru}'
    - '[тех]{.ru}'
    - '[тем]{.ru}'
    - '[те́ми]{.ru}'
    - '[о тех]{.ru}'
  why: |-
    第 1–4 题：人称代词：[я]{.ru} 第三、六格同形 [мне]{.ru}；[им]{.ru} 是 [он]{.ru} 的第五格，也是 [они́]{.ru} 的第三格；第六格第三人称带 [н-]{.ru}：[о нём, о ней, о них]{.ru}；[о]{.ru} 在 [мне]{.ru} 前写 [обо]{.ru}。
    第 5 题：[себя́]{.ru} 和 [тебя́]{.ru} 变法相同：[себя́, себе́, собо́й, о себе́]{.ru}。
    第 6、7 题：[кого́, кому́, кем, о ком]{.ru}；[чего́, чему́, чем, о чём]{.ru}。
    第 8 题：[чья]{.ru} 除第一、四格外都是 [чьей]{.ru}。
    第 9 题：[все]{.ru} 复数：[всех, всем, все́ми, обо всех]{.ru}（[о]{.ru} 在 [всех, всём]{.ru} 前写 [обо]{.ru}）。
    第 10 题：[сам]{.ru} 间接格重音在词尾：[самого́, самому́, сами́м, само́м]{.ru}。
    第 11–13 题：物主、指示代词复数：第二、六格 [-х]{.ru}，第三格 [-м]{.ru}，第五格 [-ми]{.ru}；[э́ти]{.ru} 前 [о]{.ru} 写成 [об]{.ru}。
  lessons:
  - B2-L15
  - B2-L19
  - B2-L20
  - B2-L21
  - B2-L22
  recycles:
  - B2-L19-01
  - B2-L20-01
  - B2-L21-01
  - B2-L22-01
  - B2-L22-02
- id: B2-L22-综合-b
  tags:
  - 综合：代词与前置词、动词连用
  task: 写出代词（或代词词组）的形式；前置词形式有变化的，连同前置词写。
  type: matrix
  cols:
  - 词组
  - 形式
  given:
  - 0
  rows:
  - base: '[звони́ть + она́]{.ru}'
    cells:
    - '[звони́ть + она́]{.ru}'
    - '[ей]{.ru}'
  - base: '[пойти́ к + я]{.ru}'
    cells:
    - '[пойти́ к + я]{.ru}'
    - '[ко мне]{.ru}'
  - base: '[говори́ть с + он]{.ru}'
    cells:
    - '[говори́ть с + он]{.ru}'
    - '[ним]{.ru}'
  - base: '[ду́мать о + они́]{.ru}'
    cells:
    - '[ду́мать о + они́]{.ru}'
    - '[них]{.ru}'
  - base: '[взять с + себя́]{.ru}'
    cells:
    - '[взять с + себя́]{.ru}'
    - '[собо́й]{.ru}'
  - base: '[купи́ть + себя́]{.ru}'
    cells:
    - '[купи́ть + себя́]{.ru}'
    - '[себе́]{.ru}'
  - base: '[боя́ться + кто]{.ru}'
    cells:
    - '[боя́ться + кто]{.ru}'
    - '[кого́]{.ru}'
  - base: '[интересова́ться + что]{.ru}'
    cells:
    - '[интересова́ться + что]{.ru}'
    - '[чем]{.ru}'
  - base: '[у + кто]{.ru}'
    cells:
    - '[у + кто]{.ru}'
    - '[кого́]{.ru}'
  - base: '[поговори́ть с + я]{.ru}'
    cells:
    - '[поговори́ть с + я]{.ru}'
    - '[со мной]{.ru}'
  - base: '[помога́ть + все]{.ru}'
    cells:
    - '[помога́ть + все]{.ru}'
    - '[всем]{.ru}'
  - base: '[горди́ться + на́ши де́ти]{.ru}'
    cells:
    - '[горди́ться + на́ши де́ти]{.ru}'
    - '[на́шими детьми́]{.ru}'
  - base: '[для + он]{.ru}'
    cells:
    - '[для + он]{.ru}'
    - '[него́]{.ru}'
  - base: '[без + она́]{.ru}'
    cells:
    - '[без + она́]{.ru}'
    - '[неё]{.ru}'
  - base: '[уви́деть + сам Гага́рин]{.ru}'
    cells:
    - '[уви́деть + сам Гага́рин]{.ru}'
    - '[самого́ Гага́рина]{.ru}'
  - base: '[ду́мать о + себя́]{.ru}'
    cells:
    - '[ду́мать о + себя́]{.ru}'
    - '[себе́]{.ru}'
  - base: '[ждать + мы]{.ru}'
    cells:
    - '[ждать + мы]{.ru}'
    - '[нас]{.ru}'
  - base: '[писа́ть + э́ти друзья́]{.ru}'
    cells:
    - '[писа́ть + э́ти друзья́]{.ru}'
    - '[э́тим друзья́м]{.ru}'
  - base: '[спроси́ть + все студе́нты]{.ru}'
    cells:
    - '[спроси́ть + все студе́нты]{.ru}'
    - '[всех студе́нтов]{.ru}'
  - base: '[к + они́]{.ru}'
    cells:
    - '[к + они́]{.ru}'
    - '[ним]{.ru}'
  why: |-
    第 1、11、18 题：[звони́ть, помога́ть, писа́ть]{.ru} 要求第三格：[ей, всем, э́тим друзья́м]{.ru}。
    第 2、10 题：[к, с]{.ru} 在 [мне, мной]{.ru} 前写成 [ко, со]{.ru}。
    第 3、4、13、14、20 题：前置词后的第三人称加 [н-]{.ru}：[с ним, о них, для него́, без неё, к ним]{.ru}。
    第 5、6、16 题：[себя́]{.ru}：[с собо́й, себе́, о себе́]{.ru}。
    第 7、9 题：[боя́ться, у]{.ru} 要求第二格，问人用 [кого́]{.ru}。
    第 8、12 题：[интересова́ться, горди́ться]{.ru} 要求第五格：[чем, на́шими детьми́]{.ru}。
    第 15、17、19 题：及物动词 + 第四格，指人同第二格：[самого́ Гага́рина, нас, всех студе́нтов]{.ru}。
  lessons:
  - B2-L15
  - B2-L19
  - B2-L20
  - B2-L21
  - B2-L22
  recycles:
  - B2-L19-02
  - B2-L19-04
  - B2-L20-03
  - B2-L21-02
- id: B2-L22-综合-c
  tags:
  - 综合：себя、人称代词与 сам
  task: 按括号里的所指，用 [себя́]{.ru}、人称代词或 [сам]{.ru} 填空。
  type: fill
  items:
  - stem: Ди́ма ___ сде́лал э́ту раке́ту.
    hint: '[]{.ru}自己，没人帮'
    accept:
    - сам
  - stem: А́нна купи́ла ___ шарф.
    hint: '[]{.ru}给自己'
    accept:
    - себе́
  - stem: А́нна купи́ла ___ шарф.
    hint: '[]{.ru}给他'
    accept:
    - ему́
  - stem: Я ви́дел ___ Гага́рина!
    hint: '[]{.ru}本人'
    accept:
    - самого́
  - stem: Мы ___ всё узна́ем.
    hint: '[]{.ru}自己'
    accept:
    - са́ми
  - stem: Ты ду́маешь то́лько о ___.
    hint: '[]{.ru}你自己'
    accept:
    - себе́
  - stem: Об э́том мне сказа́ла ___ О́льга Ви́кторовна.
    hint: '[]{.ru}本人'
    accept:
    - сама́
  - stem: Они́ взя́ли с ___ зонт.
    hint: '[]{.ru}自己'
    accept:
    - собо́й
  - stem: Па́па попроси́л Ми́шу купи́ть ___ газе́ту.
    hint: '[]{.ru}给爸爸'
    accept:
    - ему́
  - stem: Па́па попроси́л Ми́шу купи́ть ___ моро́женое.
    hint: '[]{.ru}给米沙自己'
    accept:
    - себе́
  - stem: Я хочу́ поговори́ть с ___ дире́ктором.
    hint: '[]{.ru}本人'
    accept:
    - сами́м
  - stem: Пьер до́лго смотре́л на ___ в зе́ркале.
    hint: '[]{.ru}他自己'
    accept:
    - себя́
  why: |-
    第 1、5 题：“自己做，没人帮”用 [сам]{.ru}，和主语一致：[Ди́ма сам, мы са́ми]{.ru}。
    第 4、7、11 题：“本人”用 [сам]{.ru}，和名词同格：[самого́ Гага́рина, сама́ О́льга Ви́кторовна, с сами́м дире́ктором]{.ru}。
    第 2、6、8、12 题：动作的对象是主语本人，用 [себя́]{.ru}：[себе́, о себе́, с собо́й, на себя́]{.ru}。
    第 3、9 题：对象是别人，用人称代词：[ему́]{.ru}。
    第 10 题：不定式句里 [себя́]{.ru} 指做不定式动作的人（米沙）。
  lessons:
  - B2-L15
  - B2-L19
  - B2-L20
  - B2-L21
  - B2-L22
  recycles:
  - B2-L20-02
  - B2-L22-02
  - B2-L22-04
