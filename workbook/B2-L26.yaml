  why: |-
    第 1–12 题：去掉词尾加 [-о]{.ru}，重音不动：[гро́мко, ме́дленно, внима́тельно]{.ru}；[просто́й]{.ru} 例外，副词 [про́сто]{.ru}。副词比较级和形容词比较级同形：[гро́мче, ти́ше, ме́дленнее, быстре́е, чётче, про́ще, ча́ще, ре́же]{.ru}。
    第 13–17 题：副词重音和形容词不同，要单独记：[хорошо́, пло́хо, ве́село, тепло́, хо́лодно]{.ru}；比较级 [лу́чше, ху́же]{.ru} 是特殊形式。
    第 18 题：软变化形容词加 [-е]{.ru}：[и́скренне]{.ru}。
    第 19–22 题：[-ский]{.ru} 形容词构成 [по-]{.ru} + 词干 + [-ски]{.ru}，带连字符，没有比较级。
- id: B2-L26-02
  tags:
  - 副词与短尾中性、形容词比较级同形
  task: 句中以 [-о]{.ru}、[-е]{.ru}、[-ее]{.ru} 结尾的那个词说明什么？归栏。
  type: classify
  bins:
  - 说明名词（短尾中性或形容词比较级）
  - 说明动词（副词或副词比较级）
  items:
  - text: '[Окно́ чи́сто.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Ди́ма пи́шет чи́сто.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Пла́тье краси́во.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Ю́ми краси́во поёт.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Ру́сский язы́к трудне́е.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Говори́те ме́дленнее!]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Э́та река́ длинне́е.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Пьер говори́т гро́мче всех.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Мо́ре споко́йно.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Он споко́йно отве́тил.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Сего́дня я встал по́зже.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Твой чемода́н ле́гче.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Мя́со гото́во.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Он гото́вит вку́сно.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  - text: '[Э́тот путь коро́че.]{.ru}'
    answer: 说明名词（短尾中性或形容词比较级）
  - text: '[Ми́ша бе́гает быстре́е меня́.]{.ru}'
    answer: 说明动词（副词或副词比较级）
  why: |-
    第 1、3、9、13 题：说明中性名词主语，是短尾中性形容词：[Окно́ чи́сто. Мо́ре споко́йно. Мя́со гото́во.]{.ru}
    第 5、7、12、15 题：说明名词主语，是形容词比较级：[Язы́к трудне́е. Чемода́н ле́гче.]{.ru}
    第 2、4、10、14 题：说明动词，是副词：[пи́шет чи́сто, краси́во поёт, споко́йно отве́тил]{.ru}。
    第 6、8、11、16 题：说明动词，是副词比较级：[Говори́те ме́дленнее. Встал по́зже.]{.ru}判断方法：看它说明的是名词还是动作，形式一样不能作依据。
