    - '[бли́зко]{.ru}'
    - '[побли́же]{.ru}'
  why: |-
    第 1–9 题：比较级前加 [по-]{.ru}，连写，不加连字符：[поме́дленнее, погро́мче, пора́ньше, поти́ше]{.ru}。
    第 3、6、9 题：先写出比较级 [ра́ньше, по́зже, бли́же]{.ru}，再加 [по-]{.ru}。
