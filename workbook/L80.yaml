    - '[ры́нок]{.ru}'
    - '[на ры́нке]{.ru}'
    - '[на ры́нок]{.ru}'
    - '[с ры́нка]{.ru}'
    hint: gen. [ры́нка]{.ru}
  - base: '[учи́тель]{.ru}'
    cells:
    - '[учи́тель]{.ru}'
    - '[у учи́теля]{.ru}'
    - '[к учи́телю]{.ru}'
    - '[от учи́теля]{.ru}'
  - base: '[Арба́т]{.ru}'
    cells:
    - '[Арба́т]{.ru}'
    - '[на Арба́те]{.ru}'
    - '[на Арба́т]{.ru}'
    - '[с Арба́та]{.ru}'
  - base: '[Кремль]{.ru}'
    cells:
    - '[Кремль]{.ru}'
    - '[в Кремле́]{.ru}'
    - '[в Кремль]{.ru}'
    - '[из Кремля́]{.ru}'
  - base: '[галере́я]{.ru}'
    cells:
    - '[галере́я]{.ru}'
    - '[в галере́е]{.ru}'
    - '[в галере́ю]{.ru}'
    - '[из галере́и]{.ru}'
  - base: '[ле́кция]{.ru}'
    cells:
    - '[ле́кция]{.ru}'
    - '[на ле́кции]{.ru}'
    - '[на ле́кцию]{.ru}'
    - '[с ле́кции]{.ru}'
  - base: '[де́душка]{.ru}'
    cells:
    - '[де́душка]{.ru}'
    - '[у де́душки]{.ru}'
    - '[к де́душке]{.ru}'
    - '[от де́душки]{.ru}'
  - base: '[Росси́я]{.ru}'
    cells:
    - '[Росси́я]{.ru}'
    - '[в Росси́и]{.ru}'
    - '[в Росси́ю]{.ru}'
    - '[из Росси́и]{.ru}'
  - base: '[кафе́]{.ru}'
    cells:
    - '[кафе́]{.ru}'
    - '[в кафе́]{.ru}'
    - '[в кафе́]{.ru}'
    - '[из кафе́]{.ru}'
  why: |
    第 1、5、6、9、10 题：[в — в — из]{.ru}。第 5 题 [Кремль]{.ru} 重音移到词尾：[в Кремле́, из Кремля́]{.ru}。第 6 题 [галере́я]{.ru}：[в галере́е, в галере́ю, из галере́и]{.ru}。第 9 题 [-ия]{.ru}：[в Росси́и, из Росси́и]{.ru}。第 10 题 [кафе́]{.ru} 不变格。
    第 2、4、7 题：[на — на — с]{.ru}：[на ры́нке — на ры́нок — с ры́нка]{.ru}，[ры́нок]{.ru} 脱落 [о]{.ru}。
    第 3、8 题：指人用 [у — к — от]{.ru}：[у учи́теля — к учи́телю — от учи́теля]{.ru}；[де́душка]{.ru} 按阴性变：[у де́душки, к де́душке]{.ru}。
- id: L80-04
  tags:
  - 体对：покупать / купить
  - 体对：заказывать / заказать
  - 命令式：购物请求
  task: 写出完成体动词的将来时和对 [вы]{.ru} 的命令式。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}（将来时）'
  - '[ты]{.ru}（将来时）'
  - 命令式（对 [вы]{.ru}）
  given:
  - 0
  rows:
  - base: '[купи́ть]{.ru}'
    cells:
    - '[купи́ть]{.ru}'
    - '[куплю́]{.ru}'
    - '[ку́пишь]{.ru}'
    - '[купи́те]{.ru}'
  - base: '[заказа́ть]{.ru}'
    cells:
    - '[заказа́ть]{.ru}'
    - '[закажу́]{.ru}'
    - '[зака́жешь]{.ru}'
    - '[закажи́те]{.ru}'
  - base: '[показа́ть]{.ru}'
    cells:
    - '[показа́ть]{.ru}'
    - '[покажу́]{.ru}'
    - '[пока́жешь]{.ru}'
    - '[покажи́те]{.ru}'
  - base: '[дать]{.ru}'
    cells:
    - '[дать]{.ru}'
    - '[дам]{.ru}'
    - '[дашь]{.ru}'
    - '[да́йте]{.ru}'
  - base: '[взять]{.ru}'
    cells:
    - '[взять]{.ru}'
    - '[возьму́]{.ru}'
    - '[возьмёшь]{.ru}'
    - '[возьми́те]{.ru}'
  - base: '[приме́рить]{.ru}'
    cells:
    - '[приме́рить]{.ru}'
    - '[приме́рю]{.ru}'
    - '[приме́ришь]{.ru}'
    - '[приме́рьте]{.ru}'
  - base: '[заплати́ть]{.ru}'
    cells:
    - '[заплати́ть]{.ru}'
    - '[заплачу́]{.ru}'
    - '[запла́тишь]{.ru}'
    - '[заплати́те]{.ru}'
  - base: '[вы́брать]{.ru}'
    cells:
    - '[вы́брать]{.ru}'
    - '[вы́беру]{.ru}'
    - '[вы́берешь]{.ru}'
    - '[вы́берите]{.ru}'
  why: |
    第 1、7 题：第一人称有交替或插入 [л]{.ru}：[куплю́, заплачу́]{.ru}，第二人称重音前移：[ку́пишь, запла́тишь]{.ru}；命令式重音在词尾：[купи́те, заплати́те]{.ru}。
    第 2、3 题：[з → ж]{.ru}：[закажу́, зака́жешь; покажу́, пока́жешь]{.ru}；命令式 [закажи́те, покажи́те]{.ru}。
    第 4 题：[дать]{.ru} 不规则：[дам, дашь]{.ru}，命令式 [да́йте]{.ru}。
    第 5 题：[возьму́, возьмёшь]{.ru}，命令式 [возьми́те]{.ru}。
    第 6 题：重音在词干，命令式用 [-ь]{.ru}：[приме́рьте]{.ru}。
    第 8 题：[вы́брать]{.ru} 重音一直在 [вы́-]{.ru}：[вы́беру, вы́берите]{.ru}。
- id: L80-05
  tags:
  - 数词 100–1000
  - 数词与 рубль 的形式
  task: 用文字写出价格。
  type: matrix
  cols:
  - 价格
  - 文字
  given:
  - 0
  rows:
  - base: 150 ₽
    cells:
    - 150 ₽
    - '[сто пятьдеся́т рубле́й]{.ru}'
  - base: 202 ₽
    cells:
    - 202 ₽
    - '[две́сти два рубля́]{.ru}'
  - base: 311 ₽
    cells:
    - 311 ₽
    - '[три́ста оди́ннадцать рубле́й]{.ru}'
  - base: 491 ₽
    cells:
    - 491 ₽
    - '[четы́реста девяно́сто оди́н рубль]{.ru}'
  - base: 564 ₽
    cells:
    - 564 ₽
    - '[пятьсо́т шестьдеся́т четы́ре рубля́]{.ru}'
  - base: 614 ₽
    cells:
    - 614 ₽
    - '[шестьсо́т четы́рнадцать рубле́й]{.ru}'
  - base: 780 ₽
    cells:
    - 780 ₽
    - '[семьсо́т во́семьдесят рубле́й]{.ru}'
  - base: 923 ₽
    cells:
    - 923 ₽
    - '[девятьсо́т два́дцать три рубля́]{.ru}'
  why: |
    第 2、5、8 题：最后一个词是 [два, три, четы́ре]{.ru}：[рубля́]{.ru}。第 4 题：最后是 [оди́н]{.ru}：[рубль]{.ru}。
    第 3、6 题：以 11、14 结尾，最后一个词是 [оди́ннадцать, четы́рнадцать]{.ru}：[рубле́й]{.ru}。
    第 1、7 题：其他数词：[рубле́й]{.ru}。注意 [пятьдеся́т]{.ru} 重音在后，[во́семьдесят]{.ru} 重音在前。
- id: L80-06
  tags:
  - 关系代词 который：性数选择
  - 关系代词 который：从句谓语配合
  task: 填上 [кото́рый]{.ru} 的正确形式。
  type: fill
  items:
  - stem: Э́то Большо́й теа́тр, ___ нахо́дится в це́нтре Москвы́.
    accept:
    - кото́рый
  - stem: Вот пло́щадь, ___ мне о́чень нра́вится.
    accept:
    - кото́рая
  - stem: Мы бы́ли в кафе́, ___ нахо́дится на Арба́те.
    accept:
    - кото́рое
  - stem: На Арба́те рабо́тают худо́жники, ___ рису́ют портре́ты.
    accept:
    - кото́рые
  - stem: Э́то мост, ___ виси́т над Москво́й-реко́й.
    accept:
    - кото́рый
  - stem: Я зна́ю де́вушку, ___ живёт в э́том до́ме.
    accept:
    - кото́рая
  - stem: Где слова́рь, ___ лежа́л на столе́?
    accept:
    - кото́рый
  - stem: Э́то студе́нтка, ___ е́здила в Петербу́рг.
    accept:
    - кото́рая
  - stem: Вот ме́сто, ___ нам понра́вилось.
    accept:
    - кото́рое
  - stem: Э́то музыка́нты, ___ игра́ли на конце́рте.
    accept:
    - кото́рые
  - stem: Мы гуля́ли по па́рку, ___ нахо́дится на берегу́ реки́.
    accept:
    - кото́рый
  - stem: Где письмо́, ___ лежа́ло на столе́?
    accept:
    - кото́рое
  - stem: Вот у́лица, ___ идёт к Кремлю́.
    accept:
    - кото́рая
  - stem: Где де́ти, ___ игра́ли в саду́?
    accept:
    - кото́рые
  why: |
    第 1、5、7、11 题：阳性名词 [теа́тр, мост, слова́рь, парк]{.ru}：[кото́рый]{.ru}；第 11 题先行词是第三格 [по па́рку]{.ru}，[кото́рый]{.ru} 仍用第一格。
    第 2、6、8、13 题：阴性名词：[кото́рая]{.ru}。第 6 题先行词 [де́вушку]{.ru} 是第四格，但 [кото́рая]{.ru} 在从句里作主语，仍用第一格。
    第 3、9、12 题：中性 [кафе́, ме́сто, письмо́]{.ru}：[кото́рое]{.ru}。
    第 4、10、14 题：复数：[кото́рые]{.ru}。
