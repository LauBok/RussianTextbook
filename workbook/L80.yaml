heading: 第 80 课　第八单元复习
groups:
- id: L80-01
  tags:
  - 运动动词现在时：定向与不定向
  - 运动动词过去时：性数形式
  - пойти / поехать：将来时变位
  task: 写出运动动词的人称形式和过去时（[пойти́, пое́хать]{.ru} 的人称形式表示将来）。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  - 过去时阳性
  - 过去时阴性
  - 过去时复数
  given:
  - 0
  rows:
  - base: '[идти́]{.ru}'
    cells:
    - '[идти́]{.ru}'
    - '[иду́]{.ru}'
    - '[идёшь]{.ru}'
    - '[иду́т]{.ru}'
    - '[шёл]{.ru}'
    - '[шла]{.ru}'
    - '[шли]{.ru}'
  - base: '[ходи́ть]{.ru}'
    cells:
    - '[ходи́ть]{.ru}'
    - '[хожу́]{.ru}'
    - '[хо́дишь]{.ru}'
    - '[хо́дят]{.ru}'
    - '[ходи́л]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[ходи́ли]{.ru}'
  - base: '[е́хать]{.ru}'
    cells:
    - '[е́хать]{.ru}'
    - '[е́ду]{.ru}'
    - '[е́дешь]{.ru}'
    - '[е́дут]{.ru}'
    - '[е́хал]{.ru}'
    - '[е́хала]{.ru}'
    - '[е́хали]{.ru}'
  - base: '[е́здить]{.ru}'
    cells:
    - '[е́здить]{.ru}'
    - '[е́зжу]{.ru}'
    - '[е́здишь]{.ru}'
    - '[е́здят]{.ru}'
    - '[е́здил]{.ru}'
    - '[е́здила]{.ru}'
    - '[е́здили]{.ru}'
  - base: '[пойти́]{.ru}'
    cells:
    - '[пойти́]{.ru}'
    - '[пойду́]{.ru}'
    - '[пойдёшь]{.ru}'
    - '[пойду́т]{.ru}'
    - '[пошёл]{.ru}'
    - '[пошла́]{.ru}'
    - '[пошли́]{.ru}'
  - base: '[пое́хать]{.ru}'
    cells:
    - '[пое́хать]{.ru}'
    - '[пое́ду]{.ru}'
    - '[пое́дешь]{.ru}'
    - '[пое́дут]{.ru}'
    - '[пое́хал]{.ru}'
    - '[пое́хала]{.ru}'
    - '[пое́хали]{.ru}'
  why: |
    第 1、5 题：[идти́]{.ru} 和 [пойти́]{.ru} 过去时词干特殊：[шёл, шла, шли; пошёл, пошла́, пошли́]{.ru}；[пойти́]{.ru} 变位 [и → й]{.ru}：[пойду́]{.ru}。
    第 2、4 题：第一人称交替 [хожу́, е́зжу]{.ru}；[ходи́ть]{.ru} 从第二人称起重音前移：[хо́дишь]{.ru}；复数 [-ят]{.ru}。
    第 3、6 题：[е́хать, пое́хать]{.ru} 词干 [е́д-]{.ru}：[е́ду, пое́ду]{.ru}；过去时按不定式构成：[е́хал, пое́хал]{.ru}。
- id: L80-02
  tags:
  - 综合：运动动词的意义
  task: 句中的运动动词表示什么？按意思归类。
  type: classify
  bins:
  - 当时在路上（[шёл]{.ru}）
  - 去过、已回来（[ходи́л]{.ru}）
  - 已经动身去了（[пошёл]{.ru}）
  items:
  - text: '[Вчера́ ве́чером мы ходи́ли в Большо́й теа́тр.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Когда́ я шёл по Арба́ту, я уви́дел худо́жника.]{.ru}'
    answer: 当时在路上（[шёл]{.ru}）
  - text: '[— Где Ми́ша? — Он пошёл на стадио́н.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[Ле́том Петро́вы е́здили в Петербу́рг.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Мы е́хали в метро́ и разгова́ривали.]{.ru}'
    answer: 当时在路上（[шёл]{.ru}）
  - text: '[Ба́бушки нет, она́ пое́хала на да́чу.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[В суббо́ту А́нна ходи́ла на ры́нок.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[По доро́ге домо́й па́па шёл ми́мо по́чты.]{.ru}'
    answer: 当时在路上（[шёл]{.ru}）
  - text: '[Ван Лэй пое́хал на вокза́л, его́ сейча́с нет.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[— Где ты был у́тром? — Я ходи́л к врачу́.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Когда́ Ю́ми е́хала в университе́т, шёл снег.]{.ru}'
    answer: 当时在路上（[шёл]{.ru}）
  - text: '[Студе́нты уже́ пошли́ на ле́кцию.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[В про́шлом году́ Пьер е́здил на Ура́л.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Ка́тя шла домо́й и ду́мала о конце́рте.]{.ru}'
    answer: 当时在路上（[шёл]{.ru}）
  - text: '[Па́па пошёл спать.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[Вчера́ мы е́здили в Кремль.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Когда́ мы шли с ле́кции, мы уви́дели О́льгу Ви́кторовну.]{.ru}'
    answer: 当时在路上（[шёл]{.ru}）
  - text: '[Ма́мы нет до́ма, она́ пошла́ в апте́ку.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  why: |
    第 2、5、8、11、14、17 题：[шёл, е́хал]{.ru} 表示当时正在路上，给别的事情做背景；[когда́, по доро́ге]{.ru} 引出的部分都属于这一类。
    第 1、4、7、10、13、16 题：[ходи́л, е́здил]{.ru} 表示去了一趟，已经回来，等于 [был]{.ru} + 处所。
    第 3、6、9、12、15、18 题：[пошёл, пое́хал]{.ru} 表示已经动身去了，人现在多半不在这里（[его́ сейча́с нет, ма́мы нет до́ма]{.ru}）。
- id: L80-03
  tags:
  - 综合：所在地、去向和来源
  task: 写出所在地、去向和来源三个词组。
  type: matrix
  cols:
  - 名词
  - '[где?]{.ru}'
  - '[куда́?]{.ru}'
  - '[отку́да?]{.ru}'
  given:
  - 0
  rows:
  - base: '[парк]{.ru}'
    cells:
    - '[парк]{.ru}'
    - '[в па́рке]{.ru}'
    - '[в парк]{.ru}'
    - '[из па́рка]{.ru}'
  - base: '[ры́нок]{.ru}'
