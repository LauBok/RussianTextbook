heading: 第 41 课　前缀 под-、от- 和 до-
groups:
- id: B2-L41-01
  tags:
  - 前缀 под- / от- / до-：变位
  task: 写出动词的现在时、将来时和过去时。
  type: matrix
  cols:
  - 动词对
  - 未完成体 [он]{.ru}
  - 完成体将来时 [я]{.ru}
  - 过去时阳性
  - 过去时阴性
  given:
  - 0
  rows:
  - base: '[подходи́ть / подойти́]{.ru}'
    cells:
    - '[подходи́ть / подойти́]{.ru}'
    - '[подхо́дит]{.ru}'
    - '[подойду́]{.ru}'
    - '[подошёл]{.ru}'
    - '[подошла́]{.ru}'
  - base: '[отходи́ть / отойти́]{.ru}'
    cells:
    - '[отходи́ть / отойти́]{.ru}'
    - '[отхо́дит]{.ru}'
    - '[отойду́]{.ru}'
    - '[отошёл]{.ru}'
    - '[отошла́]{.ru}'
  - base: '[доходи́ть / дойти́]{.ru}'
    cells:
    - '[доходи́ть / дойти́]{.ru}'
    - '[дохо́дит]{.ru}'
    - '[дойду́]{.ru}'
    - '[дошёл]{.ru}'
    - '[дошла́]{.ru}'
  - base: '[подъезжа́ть / подъе́хать]{.ru}'
    cells:
    - '[подъезжа́ть / подъе́хать]{.ru}'
    - '[подъезжа́ет]{.ru}'
    - '[подъе́ду]{.ru}'
    - '[подъе́хал]{.ru}'
    - '[подъе́хала]{.ru}'
  - base: '[доезжа́ть / дое́хать]{.ru}'
    cells:
    - '[доезжа́ть / дое́хать]{.ru}'
    - '[доезжа́ет]{.ru}'
    - '[дое́ду]{.ru}'
    - '[дое́хал]{.ru}'
    - '[дое́хала]{.ru}'
  why: |-
    过去时一栏写完成体的过去时。
    第 1、2 题：[под-, от-]{.ru} 在 [идти́]{.ru} 前加 [о]{.ru}：[подойду́, отошёл]{.ru}。
    第 3 题：[до-]{.ru} 本身以元音结尾，不加 [о]{.ru}，写 [й]{.ru}：[дойду́, дошёл]{.ru}。
    第 4 题：[под-]{.ru} 在 [е]{.ru} 前加 [ъ]{.ru}：[подъезжа́ет, подъе́ду]{.ru}；第 5 题 [доезжа́ет, дое́ду]{.ru} 不加 [ъ]{.ru}。
    第 1–3 题未完成体 [он]{.ru}：重音在词干 [подхо́дит]{.ru}，和 [хо́дит]{.ru} 一样。
- id: B2-L41-02
  tags:
  - 前缀 под- / от- / до-：前置词搭配
  task: 写出三个前缀动词的词组。
  type: matrix
  cols:
  - 目标
  - '[подойти́]{.ru}'
  - '[отойти́]{.ru}'
  - '[дойти́]{.ru}'
  given:
  - 0
  rows:
  - base: '[дверь]{.ru}'
    cells:
    - '[дверь]{.ru}'
    - '[подойти́ к две́ри]{.ru}'
    - '[отойти́ от две́ри]{.ru}'
    - '[дойти́ до две́ри]{.ru}'
    hint: f
  - base: '[окно́]{.ru}'
    cells:
    - '[окно́]{.ru}'
    - '[подойти́ к окну́]{.ru}'
    - '[отойти́ от окна́]{.ru}'
    - '[дойти́ до окна́]{.ru}'
  - base: '[река́]{.ru}'
    cells:
    - '[река́]{.ru}'
    - '[подойти́ к реке́]{.ru}'
    - '[отойти́ от реки́]{.ru}'
    - '[дойти́ до реки́]{.ru}'
  - base: '[доска́]{.ru}'
    cells:
    - '[доска́]{.ru}'
    - '[подойти́ к доске́]{.ru}'
    - '[отойти́ от доски́]{.ru}'
    - '[дойти́ до доски́]{.ru}'
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[подойти́ к до́му]{.ru}'
    - '[отойти́ от до́ма]{.ru}'
    - '[дойти́ до до́ма]{.ru}'
  - base: '[вокза́л]{.ru}'
    cells:
    - '[вокза́л]{.ru}'
    - '[подойти́ к вокза́лу]{.ru}'
    - '[отойти́ от вокза́ла]{.ru}'
    - '[дойти́ до вокза́ла]{.ru}'
  - base: '[ста́нция]{.ru}'
    cells:
    - '[ста́нция]{.ru}'
    - '[подойти́ к ста́нции]{.ru}'
    - '[отойти́ от ста́нции]{.ru}'
    - '[дойти́ до ста́нции]{.ru}'
  - base: '[при́стань]{.ru}'
    cells:
    - '[при́стань]{.ru}'
    - '[подойти́ к при́стани]{.ru}'
    - '[отойти́ от при́стани]{.ru}'
    - '[дойти́ до при́стани]{.ru}'
    hint: f
  - base: '[стол]{.ru}'
    cells:
    - '[стол]{.ru}'
    - '[подойти́ к столу́]{.ru}'
    - '[отойти́ от стола́]{.ru}'
    - '[дойти́ до стола́]{.ru}'
  - base: '[па́мятник]{.ru}'
    cells:
    - '[па́мятник]{.ru}'
    - '[подойти́ к па́мятнику]{.ru}'
    - '[отойти́ от па́мятника]{.ru}'
    - '[дойти́ до па́мятника]{.ru}'
  why: |-
    [подойти́]{.ru} + [к]{.ru} + 第三格，[отойти́]{.ru} + [от]{.ru} + 第二格，[дойти́]{.ru} + [до]{.ru} + 第二格。
    第 1、8 题：阴性 [-ь]{.ru} 名词第三格、第二格都是 [-и]{.ru}：[к две́ри, от при́стани]{.ru}。
    第 2–4、9 题：重音在词尾的词：[к окну́, от окна́; к реке́, от реки́; к доске́; к столу́, от стола́]{.ru}。
    第 7 题：[-ия]{.ru} 名词第三格、第二格都是 [-ии]{.ru}：[к ста́нции, до ста́нции]{.ru}。
    常见错误：[отойти́]{.ru} 后用 [из]{.ru}，[дойти́]{.ru} 后用第四格。
- id: B2-L41-03
  tags:
  - пришёл / подошёл / ушёл / отошёл
  task: 下面每件事该用哪个动词？归入相应的栏。
  type: classify
  bins:
  - '[пришёл]{.ru}'
  - '[подошёл]{.ru}'
  - '[ушёл]{.ru}'
  - '[отошёл]{.ru}'
  items:
  - text: 王磊走到老师（[преподава́тель]{.ru}）跟前问问题
    answer: '[подошёл]{.ru}'
  - text: 迪马到朋友家（[к дру́гу]{.ru}）去找他
    answer: '[пришёл]{.ru}'
  - text: 王磊从窗边（[окно́]{.ru}）走开几步
    answer: '[отошёл]{.ru}'
  - text: 皮埃尔离开晚会（[ве́чер]{.ru}），回家了
    answer: '[ушёл]{.ru}'
  - text: 米沙走到黑板（[доска́]{.ru}）前
    answer: '[подошёл]{.ru}'
  - text: 爷爷（[де́душка]{.ru}）来我们家做客了
    answer: '[пришёл]{.ru}'
  - text: 渔夫（[рыба́к]{.ru}）从水边退开一点
    answer: '[отошёл]{.ru}'
  - text: 爸爸已经去上班了（[на рабо́ту]{.ru}），不在家
    answer: '[ушёл]{.ru}'
  - text: 火车（[по́езд]{.ru}）进站，停在站台边
    answer: '[подошёл]{.ru}'
  - text: 船（[теплохо́д]{.ru}）离开码头几米
    answer: '[отошёл]{.ru}'
  - text: 新同学（[но́вый студе́нт]{.ru}）第一次来到班上
    answer: '[пришёл]{.ru}'
  - text: 医生（[врач]{.ru}）下班回家了
    answer: '[ушёл]{.ru}'
  - text: 男孩（[ма́льчик]{.ru}）走到妈妈跟前
    answer: '[подошёл]{.ru}'
  - text: 王磊离开售票处窗口（[ка́сса]{.ru}），让后面的人买票
    answer: '[отошёл]{.ru}'
  why: |-
    第 1、5、9、13 题：走到跟前、距离变近：[подошёл к преподава́телю, к доске́]{.ru}；火车进站也说 [по́езд подошёл]{.ru}。
    第 2、6、11 题：来到某处、某人那里（到家里、班上）：[пришёл к дру́гу, в класс]{.ru}。比较 [подошёл к дру́гу]{.ru}（走到他身边）。
    第 3、7、10、14 题：走开几步、离开不远，人还在附近：[отошёл от окна́]{.ru}；船离开码头也说 [отошёл]{.ru}。
    第 4、8、12 题：离开了、人已经不在这里：[ушёл]{.ru}。
- id: B2-L41-04
  tags:
  - под- / от- / до-（句中）
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Как ___ до Кра́сной пло́щади?
    hint: доходи́ть / дойти́
    accept:
    - дойти́
  - stem: Ван Лэй ___ к ка́ссе и купи́л биле́т.
    hint: подойти́
    accept:
    - подошёл
  - stem: Не стой у окна́, ___ от него́!
    hint: отойти́
    accept:
    - отойди́
  - stem: Мы шли весь день и то́лько ве́чером ___ до о́зера.
    hint: дойти́
    accept:
    - дошли́
  - stem: По́езд на Каза́нь ___ в де́вять ве́чера.
    hint: отходи́ть
    accept:
    - отхо́дит
  - stem: Когда́ мы ___ к до́му, мы уви́дели Ми́шу.
    hint: подходи́ть
    accept:
    - подходи́ли
  - stem: Такси́ ___ к гости́нице, и мы се́ли в маши́ну.
    hint: подъе́хать
    accept:
    - подъе́хало
  - stem: Мы ___ до Каза́ни за два часа́.
    hint: дое́хать
    accept:
    - дое́хали
  - stem: А́нна ___ к две́ри и откры́ла её.
    hint: подойти́
    accept:
    - подошла́
  - stem: Тури́сты ___ от па́мятника и на́чали фотографи́ровать.
    hint: отойти́
    accept:
    - отошли́
  why: |-
    第 1 题：问路的固定说法 [Как дойти́ до…?]{.ru} 用不定式。
    第 2、4、7–10 题：一次完成的动作用完成体过去时，和主语性数一致：[подошёл, дошли́, подъе́хало, дое́хали, подошла́, отошли́]{.ru}。第 7 题 [такси́]{.ru} 是中性：[подъе́хало]{.ru}。
    第 3 题：命令式 [отойди́]{.ru}。
    第 5 题：时刻表上的开车时间用未完成体现在时：[отхо́дит]{.ru}。
    第 6 题：正在走近的过程，同时看见了米沙，用未完成体过去时：[подходи́ли]{.ru}。
