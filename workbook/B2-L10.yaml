- id: B2-L10-05
  tags:
  - о / об + 复数第六格：句中
  task: 用 [о]{.ru} 和括号里的词填空，前置词也写出。
  type: fill
  items:
  - stem: Ди́ма ча́сто расска́зывает ___ Росси́и.
    hint: обы́чаи
    accept:
    - об обы́чаях
  - stem: Студе́нты всё вре́мя говоря́т ___.
    hint: экза́мены
    accept:
    - об экза́менах
  - stem: Ма́ма ду́мает ___.
    hint: де́ти
    accept:
    - о де́тях
  - stem: Ба́бушка лю́бит расска́зывать ___.
    hint: друзья́
    accept:
    - о друзья́х
  - stem: Мы говори́ли ___.
    hint: уро́ки
    accept:
    - об уро́ках
  - stem: Ми́ша мно́го зна́ет ___.
    hint: и́гры
    accept:
    - об и́грах
  - stem: Студе́нты ча́сто вспомина́ют ___.
    hint: учителя́
    accept:
    - об учителя́х
  - stem: Ди́ма спроси́л ___.
    hint: сосе́ди
    accept:
    - о сосе́дях
  - stem: Пьер мно́го чита́л ___ Сиби́ри.
    hint: озёра
    accept:
    - об озёрах
  - stem: В газе́те пи́шут ___.
    hint: иностра́нцы
    accept:
    - об иностра́нцах
    new: true
    gloss: 外国人
  - stem: Ю́ми ду́мает ___ из Япо́нии.
    hint: пи́сьма
    accept:
    - о пи́сьмах
  - stem: Мы говори́ли ___ на Ма́сленицу.
    hint: блины́
    accept:
    - о блина́х
  - stem: Ван Лэй написа́л сочине́ние ___.
    hint: пра́здники
    accept:
    - о пра́здниках
  - stem: Оте́ц ча́сто расска́зывает ___.
    hint: упражне́ния
    accept:
    - об упражне́ниях
  why: |-
    第 1、2、5、6、9、10、14 题：名词以元音开头，[о]{.ru} 写成 [об]{.ru}：[об обы́чаях, об экза́менах, об уро́ках, об и́грах, об озёрах, об иностра́нцах, об упражне́ниях]{.ru}。
    第 7 题：[учителя́]{.ru} 复数重音在词尾：[об учителя́х]{.ru}。
    第 3、4、8、11、13 题：辅音开头用 [о]{.ru}；复数第六格照复数第一格的词干：[о де́тях, о друзья́х, о сосе́дях, о пи́сьмах, о пра́здниках]{.ru}。
    第 12 题：[блины́]{.ru} 重音在词尾：[о блина́х]{.ru}。
