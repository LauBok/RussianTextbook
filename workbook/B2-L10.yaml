    - '[о́зеро — озёра]{.ru}'
    - '[на озёрах]{.ru}'
  - base: '[каранда́ш — карандаши́]{.ru}'
    cells:
    - '[каранда́ш — карандаши́]{.ru}'
    - '[о карандаша́х]{.ru}'
  why: |-
    第 1–3、6、12、13 题：硬辅音阳性、[-а]{.ru} 阴性、[-о]{.ru} 中性加 [-ах]{.ru}，重音同复数第一格：[в па́рках, о кни́гах, в пи́сьмах, на у́лицах, на озёрах]{.ru}。
    第 4、5 题：复数重音在词尾，第六格也在词尾：[на стола́х, в города́х]{.ru}。
    第 7–9、14 题：[ж, ш, ч, щ]{.ru} 结尾（包括 [вещь, ночь]{.ru}）用 [-ах]{.ru}，不用 [-ях]{.ru}：[о врача́х, о карандаша́х, о веща́х, о ноча́х]{.ru}。
    第 10 题：[-ц]{.ru} 也用 [-ах]{.ru}；元音开头的词前 [о]{.ru} 写成 [об]{.ru}：[об отца́х]{.ru}。
    第 11 题：在复数第一格词干上加词尾，脱落的元音不回来：[о пода́рках]{.ru}。
