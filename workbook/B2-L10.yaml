  why: |-
    第 2、3、7–10、12 题：[-ь, -й, -я]{.ru} 结尾的软变化名词用 [-ях]{.ru}：[в музе́ях, о неде́лях, о преподава́телях, на ку́хнях, в тетра́дях, о роди́телях]{.ru}。
    第 1、4 题：复数重音在词尾的，第六格也在词尾：[в словаря́х, на моря́х]{.ru}。
    第 5、6、11、13 题：[-ие, -ия]{.ru} 的复数第六格是 [-иях]{.ru}：[в зда́ниях, в общежи́тиях, на ста́нциях]{.ru}。不要照单数第六格写成 [-ии]{.ru}。
    第 14 题：[обы́чай]{.ru} 元音开头，前置词写成 [об]{.ru}：[об обы́чаях]{.ru}。
