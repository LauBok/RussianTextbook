heading: 第 7 课　集合数词与“两个都”
groups:
- id: B2-L07-01
  tags:
  - 集合数词：нас / их бы́ло + 集合数词
  task: 写出集合数词，再用过去时说“我们（他们……）一共几个人”。
  type: matrix
  cols:
  - 数字 + 代词
  - 集合数词
  - 句子
  given:
  - 0
  rows:
  - base: '[2 + мы]{.ru}'
    cells:
    - '[2 + мы]{.ru}'
    - '[дво́е]{.ru}'
    - '[Нас бы́ло дво́е.]{.ru}'
  - base: '[3 + они́]{.ru}'
    cells:
    - '[3 + они́]{.ru}'
    - '[тро́е]{.ru}'
    - '[Их бы́ло тро́е.]{.ru}'
  - base: '[4 + вы]{.ru}'
    cells:
    - '[4 + вы]{.ru}'
    - '[че́тверо]{.ru}'
    - '[Вас бы́ло че́тверо.]{.ru}'
  - base: '[5 + мы]{.ru}'
    cells:
    - '[5 + мы]{.ru}'
    - '[пя́теро]{.ru}'
    - '[Нас бы́ло пя́теро.]{.ru}'
  - base: '[6 + они́]{.ru}'
    cells:
    - '[6 + они́]{.ru}'
    - '[ше́стеро]{.ru}'
    - '[Их бы́ло ше́стеро.]{.ru}'
  - base: '[7 + мы]{.ru}'
    cells:
    - '[7 + мы]{.ru}'
    - '[се́меро]{.ru}'
    - '[Нас бы́ло се́меро.]{.ru}'
  - base: '[3 + мы]{.ru}'
    cells:
    - '[3 + мы]{.ru}'
    - '[тро́е]{.ru}'
    - '[Нас бы́ло тро́е.]{.ru}'
  - base: '[2 + они́]{.ru}'
    cells:
    - '[2 + они́]{.ru}'
    - '[дво́е]{.ru}'
    - '[Их бы́ло дво́е.]{.ru}'
  - base: '[5 + вы]{.ru}'
    cells:
    - '[5 + вы]{.ru}'
    - '[пя́теро]{.ru}'
    - '[Вас бы́ло пя́теро.]{.ru}'
  - base: '[4 + они́]{.ru}'
    cells:
    - '[4 + они́]{.ru}'
    - '[че́тверо]{.ru}'
    - '[Их бы́ло че́тверо.]{.ru}'
  why: 第 1–10 题：人称代词用第二格 [нас, вас, их]{.ru}，集合数词是主语，动词用中性 [бы́ло]{.ru}。不说 [Мы бы́ли тро́е]{.ru}。集合数词重音都在第一个音节：[дво́е, тро́е, че́тверо, пя́теро, ше́стеро, се́меро]{.ru}。
- id: B2-L07-02
  tags:
  - 集合数词：能和哪些名词连用
  task: 这个名词能不能和集合数词（[дво́е, тро́е]{.ru}……）连用？归类。
  type: classify
  bins:
  - 能用集合数词
  - 只能用普通数词
  items:
  - text: '[де́ти]{.ru}'
    answer: 能用集合数词
  - text: '[сестра́]{.ru}'
    answer: 只能用普通数词
  - text: '[студе́нт]{.ru}'
    answer: 能用集合数词
  - text: '[кни́га]{.ru}'
    answer: 只能用普通数词
  - text: '[ребя́та]{.ru}'
    answer: 能用集合数词
  - text: '[де́вушка]{.ru}'
    answer: 只能用普通数词
  - text: '[брат]{.ru}'
    answer: 能用集合数词
  - text: '[су́тки]{.ru}'
    answer: 能用集合数词
  - text: '[стол]{.ru}'
    answer: 只能用普通数词
  - text: '[подру́га]{.ru}'
    answer: 只能用普通数词
  - text: '[сын]{.ru}'
    answer: 能用集合数词
  - text: '[часы́]{.ru}'
    answer: 能用集合数词
  - text: '[студе́нтка]{.ru}'
    answer: 只能用普通数词
  - text: '[мужчи́на]{.ru}'
    answer: 能用集合数词
  - text: '[биле́т]{.ru}'
    answer: 只能用普通数词
  - text: '[дочь]{.ru}'
    answer: 只能用普通数词
  - text: '[ма́льчик]{.ru}'
    answer: 能用集合数词
  - text: '[но́жницы]{.ru}'
    answer: 能用集合数词
    new: true
    gloss: 剪刀
  why: |-
    第 1、5 题：[де́ти, ребя́та]{.ru} 最常和集合数词连用：[дво́е дете́й, тро́е ребя́т]{.ru}。
    第 3、7、11、14、17 题：表示男人的名词可以用集合数词（也可以用普通数词）：[тро́е студе́нтов / три студе́нта]{.ru}。
    第 8、12、18 题：只有复数的名词：[дво́е су́ток, тро́е часо́в, дво́е но́жниц]{.ru}。
    第 2、6、10、13、16 题：表示女人的名词不用集合数词：[две сестры́, три де́вушки, две до́чери]{.ru}，不说 [тро́е де́вушек]{.ru}。
    第 4、9、15 题：一般的东西用普通数词：[две кни́ги, три стола́, два биле́та]{.ru}。
- id: B2-L07-03
  tags:
  - о́ба / о́бе + 单数第二格
  task: 写出 [о́ба]{.ru} 或 [о́бе]{.ru} 和名词的词组。
  type: matrix
  cols:
  - 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[брат]{.ru}'
    cells:
    - '[брат]{.ru}'
    - '[о́ба бра́та]{.ru}'
  - base: '[сестра́]{.ru}'
    cells:
    - '[сестра́]{.ru}'
    - '[о́бе сестры́]{.ru}'
  - base: '[окно́]{.ru}'
    cells:
    - '[окно́]{.ru}'
    - '[о́ба окна́]{.ru}'
  - base: '[студе́нт]{.ru}'
    cells:
    - '[студе́нт]{.ru}'
    - '[о́ба студе́нта]{.ru}'
  - base: '[подру́га]{.ru}'
    cells:
    - '[подру́га]{.ru}'
    - '[о́бе подру́ги]{.ru}'
  - base: '[письмо́]{.ru}'
    cells:
    - '[письмо́]{.ru}'
    - '[о́ба письма́]{.ru}'
  - base: '[кни́га]{.ru}'
    cells:
    - '[кни́га]{.ru}'
    - '[о́бе кни́ги]{.ru}'
  - base: '[сын]{.ru}'
    cells:
    - '[сын]{.ru}'
    - '[о́ба сы́на]{.ru}'
  - base: '[дочь]{.ru}'
    cells:
    - '[дочь]{.ru}'
    - '[о́бе до́чери]{.ru}'
  - base: '[маши́на]{.ru}'
    cells:
    - '[маши́на]{.ru}'
    - '[о́бе маши́ны]{.ru}'
  - base: '[слова́рь]{.ru}'
    cells:
    - '[слова́рь]{.ru}'
    - '[о́ба словаря́]{.ru}'
  - base: '[ме́сто]{.ru}'
    cells:
    - '[ме́сто]{.ru}'
    - '[о́ба ме́ста]{.ru}'
  - base: '[тетра́дь]{.ru}'
    cells:
    - '[тетра́дь]{.ru}'
    - '[о́бе тетра́ди]{.ru}'
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[о́ба до́ма]{.ru}'
  why: |-
    第 1、4、8、11、14 题：阳性用 [о́ба]{.ru}，名词用单数第二格：[о́ба бра́та, о́ба сы́на, о́ба словаря́, о́ба до́ма]{.ru}。
    第 3、6、12 题：中性也用 [о́ба]{.ru}：[о́ба окна́, о́ба письма́, о́ба ме́ста]{.ru}。
    第 2、5、7、10 题：阴性用 [о́бе]{.ru}：[о́бе сестры́, о́бе подру́ги, о́бе кни́ги, о́бе маши́ны]{.ru}。
    第 9、13 题：[-ь]{.ru} 阴性名词单数第二格 [-и]{.ru}：[о́бе тетра́ди]{.ru}；[дочь]{.ru} 第二格 [до́чери]{.ru}。
- id: B2-L07-04
  tags:
  - 集合数词、вдвоём / втроём、о́ба / о́бе：句中
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: У на́ших сосе́дей ___ дете́й.
    hint: '3'
    accept:
    - тро́е
  - stem: В ко́мнате бы́ло ___ де́вушки.
    hint: '2'
    accept:
    - две
  - stem: Мы с Ди́мой пое́хали на да́чу ___.
    hint: '2'
    accept:
    - вдвоём
  - stem: ___ мои́х бра́та живу́т в Каза́ни.
    hint: о́ба / о́бе
    accept:
    - О́ба
  - stem: ___ сестры́ лю́бят петь.
    hint: о́ба / о́бе
    accept:
    - О́бе
  - stem: Пьер, Ю́ми и Ван Лэй гото́вили у́жин ___.
    hint: '3'
    accept:
    - втроём
  - stem: Мы бы́ли в Каза́ни ___ су́ток.
    hint: '2'
    accept:
    - дво́е
  - stem: За столо́м нас бы́ло ___.
    hint: '7'
    accept:
    - се́меро
  - stem: У меня́ ___ сестры́.
    hint: '2'
    accept:
    - две
  - stem: Ле́том ___ дру́га рабо́тали на заво́де.
    hint: о́ба / о́бе
    accept:
    - о́ба
  - stem: Ми́ша и А́нна ___ лю́бят ша́хматы.
    hint: о́ба / о́бе
    accept:
    - о́ба
  - stem: В гру́ппе ___ студе́нток из Япо́нии.
    hint: '5'
    accept:
    - пять
  why: |-
    第 1、7、8 题：集合数词：[тро́е дете́й, дво́е су́ток, нас бы́ло се́меро]{.ru}。
    第 2、9、12 题：表示女人的名词只用普通数词：[две де́вушки, две сестры́, пять студе́нток]{.ru}。
    第 3、6 题：“两个人一起”“三个人一起”：[вдвоём, втроём]{.ru}。
    第 4、5、10 题：[о́ба]{.ru} 用于阳性、中性，[о́бе]{.ru} 用于阴性，后面名词用单数第二格：[о́ба бра́та, о́бе сестры́, о́ба дру́га]{.ru}。
    第 11 题：一男一女两人也用 [о́ба]{.ru}，作同位语放在动词前：[Ми́ша и А́нна о́ба лю́бят…]{.ru}。
