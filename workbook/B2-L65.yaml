    第 2、5、6、8–13、15 题：完成体用将来时第三人称：[пусть принесёт, позвони́т, подождёт, ку́пит, напи́шут, посиди́т, отве́тит, расска́жет, отдохнёт, пое́дет]{.ru}，不用不定式，也不用命令式。

    第 16 题：祝愿用 [пусть]{.ru} + [бу́дет]{.ru}：[Пусть всё бу́дет хорошо́!]{.ru}'
