  why: '第 1–13 题：“你做”用命令式；“咱们做”用 [дава́й]{.ru} + 完成体第一人称复数，不加 [мы]{.ru}；“我来做”用 [дава́й я]{.ru} + 第一人称单数；“让他做”用 [пусть]{.ru} + 第三人称。后三种都是动词将来时（或现在时）的变位形式，不是命令式。

    第 1 题：[идти́]{.ru}：命令式 [иди́]{.ru}，提议用完成体 [пойдём, я пойду́]{.ru}；让他去用 [пусть он идёт]{.ru}（[пусть пойдёт]{.ru} 也可以）。

    第 2–13 题：完成体变位注意交替和重音：[помо́жем, помогу́]{.ru}；[ку́пим, куплю́]{.ru}；[пригото́влю]{.ru}；[спой, споём]{.ru}；[напиши́, напи́шем]{.ru}；[посмо́трим, посмотрю́]{.ru}；[вы́учи]{.ru}（重音在 [вы́-]{.ru} 上的动词命令式词尾不重读）；[отве́чу]{.ru}（[т → ч]{.ru}）。'
