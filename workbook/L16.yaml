heading: 第 16 课　“是、在”的过去时
groups:
- id: L16-01
  tags:
  - быть 过去时：主语性数与否定
  task: 按主语写出 [быть]{.ru} 的过去时和否定形式（标出重音）。
  type: matrix
  cols:
  - 主语
  - 过去时
  - 否定
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
    hint: 男
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
    hint: 女
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
    hint: 女
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
  - base: '[оно́]{.ru}'
    cells:
    - '[оно́]{.ru}'
    - '[бы́ло]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
    hint: 尊称一人
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  - base: '[па́па]{.ru}'
    cells:
    - '[па́па]{.ru}'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
  - base: '[о́зеро]{.ru}'
    cells:
    - '[о́зеро]{.ru}'
    - '[бы́ло]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
  why: |-
    第 1、4、10、14 题：阳性单数主语（男性的 [я]{.ru}、[он]{.ru}、[па́па, Ми́ша]{.ru}）用 [был]{.ru}，否定 [не́ был]{.ru}，重音移到 [не]{.ru} 上。[Ми́ша]{.ru} 以 [-а]{.ru} 结尾，仍是男人。
    第 2、3、5、11 题：阴性单数（女性的 [я, ты]{.ru}、[она́, ма́ма]{.ru}）用 [была́]{.ru}，否定 [не была́]{.ru}，重音不移。
    第 6、12 题：中性单数用 [бы́ло]{.ru}，否定 [не́ было]{.ru}。
    第 7、9、13 题：复数用 [бы́ли]{.ru}，否定 [не́ были]{.ru}。
    第 8 题：[вы]{.ru} 即使尊称一个人也用 [бы́ли]{.ru}、[не́ были]{.ru}。
- id: L16-02
  tags:
  - быть 过去时：几种句型中的配合
  task: 用 [быть]{.ru} 的过去时填空。
  type: fill
  items:
  - stem: Вчера́ Ю́ми ___ в теа́тре.
    hint: быть
    accept:
    - была́
  - stem: Пьер ___ в музе́е.
    hint: быть
    accept:
    - был
  - stem: Мы ___ на конце́рте.
    hint: быть
    accept:
    - бы́ли
  - stem: Э́то ___ о́пера.
    hint: быть
    accept:
    - была́
  - stem: Э́то ___ Пьер и Ю́ми.
    hint: быть
    accept:
    - бы́ли
  - stem: Э́то ___ Большо́й теа́тр.
    hint: быть
    accept:
    - был
  - stem: В музе́е ___ интере́сно.
    hint: быть
    accept:
    - бы́ло
  - stem: Вчера́ ___ воскресе́нье.
    hint: быть
    accept:
    - бы́ло
  - stem: Бале́т ___ краси́вый.
    hint: быть
    accept:
    - был
  - stem: О́пера ___ интере́сная.
    hint: быть
    accept:
    - была́
  - stem: — Ми́ша, где ты ___ вчера́?
    hint: быть
    accept:
    - был
  - stem: — А́нна, где ты ___?
    hint: быть
    accept:
    - была́
  - stem: О́льга Ви́кторовна, вы ___ в теа́тре?
    hint: быть
    accept:
    - бы́ли
  - stem: Ма́ма и па́па ___ на да́че.
    hint: быть
    accept:
    - бы́ли
  - stem: Письмо́ ___ на столе́.
    hint: быть
    accept:
    - бы́ло
  - stem: Вчера́ то́же ___ хорошо́.
    hint: быть
    accept:
    - бы́ло
  - stem: О́зеро ___ о́чень краси́вое.
    hint: быть
    accept:
    - бы́ло
  - stem: Э́то ___ мой друг.
    hint: быть
    accept:
    - был
  why: |-
    第 1–3、8、14、15 题：[быть]{.ru} 和主语的性数一致：[Ю́ми была́, Пьер был, мы бы́ли, ма́ма и па́па бы́ли]{.ru}；[воскресе́нье, письмо́]{.ru} 是中性，用 [бы́ло]{.ru}。
    第 4–6、18 题：[э́то]{.ru} 句里 [быть]{.ru} 和后面的名词一致，不和 [э́то]{.ru} 一致：[Э́то была́ о́пера. Э́то бы́ли Пьер и Ю́ми. Э́то был Большо́й теа́тр. Э́то был мой друг.]{.ru}
    第 7、16 题：没有主语的句子用中性 [бы́ло]{.ru}：[В музе́е бы́ло интере́сно. Вчера́ то́же бы́ло хорошо́.]{.ru}
    第 9、10、17 题：形容词作谓语时，[быть]{.ru} 和形容词都与主语一致：[Бале́т был краси́вый. О́пера была́ интере́сная. О́зеро бы́ло … краси́вое.]{.ru}
    第 11、12 题：[ты]{.ru} 看对方是男是女：对米沙说 [ты был]{.ru}，对安娜说 [ты была́]{.ru}。
    第 13 题：对老师用 [вы]{.ru}，过去时用 [бы́ли]{.ru}。
- id: L16-03
  tags:
  - быть 过去时：否定
  task: 用 [не быть]{.ru} 的过去时填空（标出重音）。
  type: fill
  items:
  - stem: Па́па ___ до́ма.
    hint: не быть
    accept:
    - не́ был
  - stem: Ма́ма ___ на рабо́те.
    hint: не быть
    accept:
    - не была́
  - stem: Мы ___ в музе́е.
    hint: не быть
    accept:
    - не́ были
  - stem: В теа́тре ___ интере́сно.
    hint: не быть
    accept:
    - не́ было
  - stem: Ми́ша ___ в шко́ле.
    hint: не быть
    accept:
    - не́ был
  - stem: Студе́нты ___ на ле́кции.
    hint: не быть
    accept:
    - не́ были
  - stem: — Ю́ми, ты ___ на уро́ке?
    hint: не быть
    accept:
    - не была́
  - stem: Пьер и Ю́ми ___ на экску́рсии.
    hint: не быть
    accept:
    - не́ были
  - stem: Ван Лэй ___ в теа́тре.
    hint: не быть
    accept:
    - не́ был
  - stem: Э́то ___ о́пера, э́то был бале́т.
    hint: не быть
    accept:
    - не была́
  - stem: Вчера́ ___ хорошо́.
    hint: не быть
    accept:
    - не́ было
  - stem: Вы ___ на конце́рте?
    hint: не быть
    accept:
    - не́ были
  why: |-
    第 1、5、9 题：[не́ был]{.ru}：重音移到 [не]{.ru} 上，[был]{.ru} 读得轻。
    第 2、7、10 题：[не была́]{.ru}：阴性重音仍在 [-ла́]{.ru} 上，不移。
    第 4、11 题：[не́ было]{.ru}：重音在 [не]{.ru} 上。
    第 3、6、8、12 题：[не́ были]{.ru}：重音在 [не]{.ru} 上；[вы]{.ru} 也用这个形式。
