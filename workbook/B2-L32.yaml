  why: |-
    第 1–10 题：现在时和命令式里 [-ова-, -ева-]{.ru} 变成 [-у-]{.ru}，再按第一变位加词尾：[рису́ю, рису́ешь, рису́ют, рису́й]{.ru}；不定式和过去时保留：[рисова́л, танцева́л]{.ru}。
    第 2、10 题：[-ева-]{.ru} 也变成 [-у-]{.ru}：[танцу́ю, ночу́ю]{.ru}，不写成 [танцею́]{.ru}。
    第 1、2、7–10 题：不定式重音在 [-ова́-, -ева́-]{.ru}，变位后重音落在 [-у́-]{.ru}：[рису́ю, волну́юсь, организу́ю]{.ru}。
    第 3–6 题：不定式重音在词根，变位后重音不动：[сове́тую, фотографи́рую, чу́вствую, путеше́ствую]{.ru}。
    第 7、8 题：[-ся]{.ru} 在元音后写 [-сь]{.ru}：[интересу́юсь, волну́юсь]{.ru}；命令式 [волну́йся]{.ru}，过去时 [волнова́лся]{.ru}。
