  why: |-
    第 1–8 题：[-дава́ть, -става́ть, -знава́ть]{.ru} 现在时去掉 [-ва-]{.ru}，重音在词尾，[е]{.ru} 写成 [ё]{.ru}：[даю́, даёшь, даю́т; встаю́, встаёшь]{.ru}；命令式和过去时保留 [-ва-]{.ru}：[дава́й, встава́й, дава́л]{.ru}。常见错误：[встава́ю, дава́ешь]{.ru}，或命令式写成 [встай]{.ru}。
    第 9 题：完成体 [дать]{.ru} 变位特殊：[дам, дашь, даст, дади́м, дади́те, даду́т]{.ru}；命令式 [дай]{.ru}。
    第 10 题：完成体 [встать]{.ru}：[вста́ну, вста́нешь, вста́нут]{.ru}，命令式 [встань]{.ru}。
    第 11 题：完成体 [узна́ть]{.ru} 按普通 [-ать]{.ru} 变：[узна́ю, узна́ешь]{.ru}，重音在 [-на́-]{.ru}；对照未完成体 [узнаю́]{.ru}，重音在词尾。
- id: B2-L32-03
  tags:
  - -овать 与 -ывать：区分
  task: 动词的现在时怎样变？按变位方式归栏。
  type: classify
  bins:
  - '[-ова- / -ева-]{.ru} 变 [-у-]{.ru}'
  - 去掉 [-ва-]{.ru}
  - 后缀不变（[-ывать, -ивать]{.ru}）
  - 普通 [-ать]{.ru}
  items:
  - text: '[рисова́ть]{.ru}'
    answer: '[-ова- / -ева-]{.ru} 变 [-у-]{.ru}'
  - text: '[сове́товать]{.ru}'
    answer: '[-ова- / -ева-]{.ru} 变 [-у-]{.ru}'
  - text: '[танцева́ть]{.ru}'
    answer: '[-ова- / -ева-]{.ru} 变 [-у-]{.ru}'
  - text: '[фотографи́ровать]{.ru}'
    answer: '[-ова- / -ева-]{.ru} 变 [-у-]{.ru}'
  - text: '[путеше́ствовать]{.ru}'
    answer: '[-ова- / -ева-]{.ru} 变 [-у-]{.ru}'
  - text: '[дава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[встава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[узнава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[продава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[устава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[расска́зывать]{.ru}'
    answer: 后缀不变（[-ывать, -ивать]{.ru}）
  - text: '[пока́зывать]{.ru}'
    answer: 后缀不变（[-ывать, -ивать]{.ru}）
  - text: '[спра́шивать]{.ru}'
    answer: 后缀不变（[-ывать, -ивать]{.ru}）
  - text: '[опа́здывать]{.ru}'
    answer: 后缀不变（[-ывать, -ивать]{.ru}）
  - text: '[перепи́сывать]{.ru}'
    answer: 后缀不变（[-ывать, -ивать]{.ru}）
    new: true
    gloss: 抄写
  - text: '[чита́ть]{.ru}'
    answer: 普通 [-ать]{.ru}
  - text: '[отдыха́ть]{.ru}'
    answer: 普通 [-ать]{.ru}
  - text: '[знать]{.ru}'
    answer: 普通 [-ать]{.ru}
  - text: '[слу́шать]{.ru}'
    answer: 普通 [-ать]{.ru}
  - text: '[понима́ть]{.ru}'
    answer: 普通 [-ать]{.ru}
  why: |-
    第 1–5 题：[-овать, -евать]{.ru}：[рису́ю, сове́тую, танцу́ю, фотографи́рую, путеше́ствую]{.ru}。
    第 6–10 题：[-дава́ть, -става́ть, -знава́ть]{.ru}：[даю́, встаю́, узнаю́, продаю́, устаю́]{.ru}。
    第 11–15 题：[-ывать, -ивать]{.ru} 不属于 [-овать]{.ru} 类，后缀不变：[расска́зываю, пока́зываю, спра́шиваю, опа́здываю, перепи́сываю]{.ru}。不要写成 [расска́зую]{.ru}。
    第 16–20 题：普通第一变位，去 [-ть]{.ru} 加词尾：[чита́ю, отдыха́ю, зна́ю, слу́шаю, понима́ю]{.ru}。[знать]{.ru} 里没有 [-ва-]{.ru}，[узнава́ть]{.ru} 才有。
