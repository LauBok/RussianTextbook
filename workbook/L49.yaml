heading: 第 49 课　日期
groups:
- id: L49-01
  tags: [序数词：5–31 的构成]
  task: 写出序数词的阳性、阴性和中性形式。
  type: matrix
  cols: [数, 阳性, 阴性, 中性]
  given: [0]
  rows:
  - {base: '[5]{.ru}', cells: ['[5]{.ru}', '[пя́тый]{.ru}', '[пя́тая]{.ru}', '[пя́тое]{.ru}']}
  - {base: '[6]{.ru}', cells: ['[6]{.ru}', '[шесто́й]{.ru}', '[шеста́я]{.ru}', '[шесто́е]{.ru}']}
  - {base: '[7]{.ru}', cells: ['[7]{.ru}', '[седьмо́й]{.ru}', '[седьма́я]{.ru}', '[седьмо́е]{.ru}']}
  - {base: '[9]{.ru}', cells: ['[9]{.ru}', '[девя́тый]{.ru}', '[девя́тая]{.ru}', '[девя́тое]{.ru}']}
  - {base: '[10]{.ru}', cells: ['[10]{.ru}', '[деся́тый]{.ru}', '[деся́тая]{.ru}', '[деся́тое]{.ru}']}
  - {base: '[11]{.ru}', cells: ['[11]{.ru}', '[оди́ннадцатый]{.ru}', '[оди́ннадцатая]{.ru}', '[оди́ннадцатое]{.ru}']}
  - {base: '[12]{.ru}', cells: ['[12]{.ru}', '[двена́дцатый]{.ru}', '[двена́дцатая]{.ru}', '[двена́дцатое]{.ru}']}
  - {base: '[14]{.ru}', cells: ['[14]{.ru}', '[четы́рнадцатый]{.ru}', '[четы́рнадцатая]{.ru}', '[четы́рнадцатое]{.ru}']}
  - {base: '[16]{.ru}', cells: ['[16]{.ru}', '[шестна́дцатый]{.ru}', '[шестна́дцатая]{.ru}', '[шестна́дцатое]{.ru}']}
  - {base: '[17]{.ru}', cells: ['[17]{.ru}', '[семна́дцатый]{.ru}', '[семна́дцатая]{.ru}', '[семна́дцатое]{.ru}']}
  - {base: '[19]{.ru}', cells: ['[19]{.ru}', '[девятна́дцатый]{.ru}', '[девятна́дцатая]{.ru}', '[девятна́дцатое]{.ru}']}
  - {base: '[20]{.ru}', cells: ['[20]{.ru}', '[двадца́тый]{.ru}', '[двадца́тая]{.ru}', '[двадца́тое]{.ru}']}
  - {base: '[25]{.ru}', cells: ['[25]{.ru}', '[два́дцать пя́тый]{.ru}', '[два́дцать пя́тая]{.ru}', '[два́дцать пя́тое]{.ru}']}
  - {base: '[27]{.ru}', cells: ['[27]{.ru}', '[два́дцать седьмо́й]{.ru}', '[два́дцать седьма́я]{.ru}', '[два́дцать седьмо́е]{.ru}']}
  - {base: '[30]{.ru}', cells: ['[30]{.ru}', '[тридца́тый]{.ru}', '[тридца́тая]{.ru}', '[тридца́тое]{.ru}']}
  - {base: '[29]{.ru}', cells: ['[29]{.ru}', '[два́дцать девя́тый]{.ru}', '[два́дцать девя́тая]{.ru}', '[два́дцать девя́тое]{.ru}']}
  why: |
    第 1、4–13、15、16 题：基数词去掉末尾的 [-ь]{.ru}，加形容词词尾 [-ый, -ая, -ое]{.ru}：[пять → пя́тый, оди́ннадцать → оди́ннадцатый]{.ru}。
    第 2、3、14 题：[шесто́й, седьмо́й]{.ru} 重音在词尾，用 [-о́й, -а́я, -о́е]{.ru}；[семь → седьмо́й]{.ru} 词干多一个 [д]{.ru}，要单独记。注意 17 是规则的 [семна́дцатый]{.ru}，没有 [д]{.ru}。
    第 4、5 题：[де́вять, де́сять]{.ru} 变成序数词时重音后移：[девя́тый, деся́тый]{.ru}。第 12、15 题同样：[два́дцать → двадца́тый, три́дцать → тридца́тый]{.ru}。
    第 13、14、16 题：复合序数词只变最后一个词：[два́дцать пя́тый, два́дцать седьмо́й]{.ru}。
- id: L49-02
  tags: [日期：第一格与第二格对照]
  task: 用文字写出同一日期的两种说法。
  type: matrix
  cols: [日期, 今天几号（第一格）, 在几号（第二格）]
  given: [0]
  rows:
  - {base: '[1.09]{.ru}', cells: ['[1.09]{.ru}', '[пе́рвое сентября́]{.ru}', '[пе́рвого сентября́]{.ru}']}
  - {base: '[2.01]{.ru}', cells: ['[2.01]{.ru}', '[второ́е января́]{.ru}', '[второ́го января́]{.ru}']}
  - {base: '[3.03]{.ru}', cells: ['[3.03]{.ru}', '[тре́тье ма́рта]{.ru}', '[тре́тьего ма́рта]{.ru}']}
  - {base: '[4.11]{.ru}', cells: ['[4.11]{.ru}', '[четвёртое ноября́]{.ru}', '[четвёртого ноября́]{.ru}']}
  - {base: '[5.05]{.ru}', cells: ['[5.05]{.ru}', '[пя́тое ма́я]{.ru}', '[пя́того ма́я]{.ru}']}
  - {base: '[7.07]{.ru}', cells: ['[7.07]{.ru}', '[седьмо́е ию́ля]{.ru}', '[седьмо́го ию́ля]{.ru}']}
  - {base: '[8.03]{.ru}', cells: ['[8.03]{.ru}', '[восьмо́е ма́рта]{.ru}', '[восьмо́го ма́рта]{.ru}']}
  - {base: '[10.11]{.ru}', cells: ['[10.11]{.ru}', '[деся́тое ноября́]{.ru}', '[деся́того ноября́]{.ru}']}
  - {base: '[12.04]{.ru}', cells: ['[12.04]{.ru}', '[двена́дцатое апре́ля]{.ru}', '[двена́дцатого апре́ля]{.ru}']}
  - {base: '[15.08]{.ru}', cells: ['[15.08]{.ru}', '[пятна́дцатое а́вгуста]{.ru}', '[пятна́дцатого а́вгуста]{.ru}']}
  - {base: '[16.06]{.ru}', cells: ['[16.06]{.ru}', '[шестна́дцатое ию́ня]{.ru}', '[шестна́дцатого ию́ня]{.ru}']}
  - {base: '[23.02]{.ru}', cells: ['[23.02]{.ru}', '[два́дцать тре́тье февраля́]{.ru}', '[два́дцать тре́тьего февраля́]{.ru}']}
  - {base: '[25.12]{.ru}', cells: ['[25.12]{.ru}', '[два́дцать пя́тое декабря́]{.ru}', '[два́дцать пя́того декабря́]{.ru}']}
  - {base: '[28.10]{.ru}', cells: ['[28.10]{.ru}', '[два́дцать восьмо́е октября́]{.ru}', '[два́дцать восьмо́го октября́]{.ru}']}
  - {base: '[31.12]{.ru}', cells: ['[31.12]{.ru}', '[три́дцать пе́рвое декабря́]{.ru}', '[три́дцать пе́рвого декабря́]{.ru}']}
  - {base: '[9.05]{.ru}', cells: ['[9.05]{.ru}', '[девя́тое ма́я]{.ru}', '[девя́того ма́я]{.ru}']}
  - {base: '[6.12]{.ru}', cells: ['[6.12]{.ru}', '[шесто́е декабря́]{.ru}', '[шесто́го декабря́]{.ru}']}
  - {base: '[11.10]{.ru}', cells: ['[11.10]{.ru}', '[оди́ннадцатое октября́]{.ru}', '[оди́ннадцатого октября́]{.ru}']}
  - {base: '[13.01]{.ru}', cells: ['[13.01]{.ru}', '[трина́дцатое января́]{.ru}', '[трина́дцатого января́]{.ru}']}
  - {base: '[17.09]{.ru}', cells: ['[17.09]{.ru}', '[семна́дцатое сентября́]{.ru}', '[семна́дцатого сентября́]{.ru}']}
  - {base: '[19.07]{.ru}', cells: ['[19.07]{.ru}', '[девятна́дцатое ию́ля]{.ru}', '[девятна́дцатого ию́ля]{.ru}']}
  - {base: '[30.04]{.ru}', cells: ['[30.04]{.ru}', '[тридца́тое апре́ля]{.ru}', '[тридца́того апре́ля]{.ru}']}
  why: |
    第 1–22 题：俄罗斯写日期先日后月。回答“今天几号”，序数词用中性第一格 [-ое / -ье]{.ru}（和 [число́]{.ru} 一致）；回答“在几号”，序数词用中性第二格 [-ого / -ьего]{.ru}，前面不加前置词。两种说法里月份都用第二格。
    第 3、12 题：[тре́тий]{.ru} 特殊：[тре́тье, тре́тьего]{.ru}。
    第 1、2、4、8、12–15、17–20 题：[сентя́брь, янва́рь, ноя́брь, февра́ль, дека́брь, октя́брь]{.ru} 第二格重音在词尾：[сентября́, января́, ноября́]{.ru}；第 3、5–7、9–11、16、21、22 题的 [ма́рта, ма́я, ию́ля, апре́ля, а́вгуста, ию́ня]{.ru} 重音不动。
    第 12–15 题：复合序数词只变最后一个词：[два́дцать тре́тьего]{.ru}，不变 [два́дцать]{.ru}。
- id: L49-03
  tags: [时间表达：日期、月份、星期与钟点]
  task: 这些时间说法分别回答哪个问题？填写序号。
  type: classify
  bins: ['[Како́е сего́дня число́?]{.ru}', '[Како́го числа́?]{.ru}', '[В како́м ме́сяце?]{.ru}', '[В како́й день?]{.ru}', '[Во ско́лько?]{.ru}']
  items:
  - {text: '[деся́тое ноября́]{.ru}', answer: '[Како́е сего́дня число́?]{.ru}'}
  - {text: '[деся́того ноября́]{.ru}', answer: '[Како́го числа́?]{.ru}'}
  - {text: '[в ноябре́]{.ru}', answer: '[В како́м ме́сяце?]{.ru}'}
  - {text: '[во вто́рник]{.ru}', answer: '[В како́й день?]{.ru}'}
  - {text: '[в де́вять часо́в]{.ru}', answer: '[Во ско́лько?]{.ru}'}
  - {text: '[пе́рвое сентября́]{.ru}', answer: '[Како́е сего́дня число́?]{.ru}'}
  - {text: '[в сентябре́]{.ru}', answer: '[В како́м ме́сяце?]{.ru}'}
  - {text: '[пе́рвого сентября́]{.ru}', answer: '[Како́го числа́?]{.ru}'}
  - {text: '[в сре́ду]{.ru}', answer: '[В како́й день?]{.ru}'}
  - {text: '[в час]{.ru}', answer: '[Во ско́лько?]{.ru}'}
  - {text: '[два́дцать пя́того декабря́]{.ru}', answer: '[Како́го числа́?]{.ru}'}
  - {text: '[в декабре́]{.ru}', answer: '[В како́м ме́сяце?]{.ru}'}
  - {text: '[в суббо́ту]{.ru}', answer: '[В како́й день?]{.ru}'}
  - {text: '[три́дцать пе́рвое декабря́]{.ru}', answer: '[Како́е сего́дня число́?]{.ru}'}
  - {text: '[в семь три́дцать]{.ru}', answer: '[Во ско́лько?]{.ru}'}
  - {text: '[тре́тьего ма́рта]{.ru}', answer: '[Како́го числа́?]{.ru}'}
  - {text: '[в ма́е]{.ru}', answer: '[В како́м ме́сяце?]{.ru}'}
  - {text: '[восьмо́е ма́рта]{.ru}', answer: '[Како́е сего́дня число́?]{.ru}'}
  - {text: '[в пя́тницу]{.ru}', answer: '[В како́й день?]{.ru}'}
  - {text: '[в два часа́]{.ru}', answer: '[Во ско́лько?]{.ru}'}
  why: |
    第 1、6、14、18 题：序数词中性第一格 + 月份第二格，回答“今天几号”。
    第 2、8、11、16 题：序数词中性第二格 [-ого]{.ru} + 月份第二格，不带前置词，回答“在几号”。
    第 3、7、12、17 题：只说月份，用 [в]{.ru} + 第六格：[в ноябре́, в ма́е]{.ru}。
    第 4、9、13、19 题：星期几用 [в]{.ru} + 第四格：[во вто́рник, в сре́ду, в суббо́ту, в пя́тницу]{.ru}。
    第 5、10、15、20 题：钟点用 [в]{.ru} + 第四格：[в де́вять часо́в, в час]{.ru}。
    最容易混的是第 2 题和第 3 题：说具体哪一天，月份用第二格且不加 [в]{.ru}；只说月份才用 [в ноябре́]{.ru}。
- id: L49-04
  tags: [日期：序数词与月份核查]
  task: 每个说法有一处错误，写出正确的说法（括号里是它回答的问题）。
  type: matrix
  cols: [有错误的说法, 正确的说法]
  given: [0]
  rows:
  - {base: '[в пя́тое ма́я]{.ru}', hint: 在几号, cells: ['[в пя́тое ма́я]{.ru}', '[пя́того ма́я]{.ru}']}
  - {base: '[пя́тый ма́я]{.ru}', hint: 今天几号, cells: ['[пя́тый ма́я]{.ru}', '[пя́тое ма́я]{.ru}']}
  - {base: '[двадцати́ пя́того ноября́]{.ru}', hint: 在几号, cells: ['[двадцати́ пя́того ноября́]{.ru}', '[два́дцать пя́того ноября́]{.ru}']}
  - {base: '[в ноя́бре]{.ru}', hint: 在几月, cells: ['[в ноя́бре]{.ru}', '[в ноябре́]{.ru}']}
  - {base: '[деся́того ноя́брь]{.ru}', hint: 在几号, cells: ['[деся́того ноя́брь]{.ru}', '[деся́того ноября́]{.ru}']}
  - {base: '[в деся́того ноября́]{.ru}', hint: 在几号, cells: ['[в деся́того ноября́]{.ru}', '[деся́того ноября́]{.ru}']}
  - {base: '[пе́рвого января́]{.ru}', hint: 今天几号, cells: ['[пе́рвого января́]{.ru}', '[пе́рвое января́]{.ru}']}
  - {base: '[тре́тое ма́рта]{.ru}', hint: 今天几号, cells: ['[тре́тое ма́рта]{.ru}', '[тре́тье ма́рта]{.ru}']}
  - {base: '[семо́е ию́ля]{.ru}', hint: 今天几号, cells: ['[семо́е ию́ля]{.ru}', '[седьмо́е ию́ля]{.ru}']}
  - {base: '[в ма́ю]{.ru}', hint: 在几月, cells: ['[в ма́ю]{.ru}', '[в ма́е]{.ru}']}
  - {base: '[двадца́тое а́вгуст]{.ru}', hint: 今天几号, cells: ['[двадца́тое а́вгуст]{.ru}', '[двадца́тое а́вгуста]{.ru}']}
  - {base: '[восьмо́й ма́рта]{.ru}', hint: 今天几号, cells: ['[восьмо́й ма́рта]{.ru}', '[восьмо́е ма́рта]{.ru}']}
  - {base: '[в а́вгусту]{.ru}', hint: 在几月, cells: ['[в а́вгусту]{.ru}', '[в а́вгусте]{.ru}']}
  - {base: '[тре́тьего феврале́]{.ru}', hint: 在几号, cells: ['[тре́тьего феврале́]{.ru}', '[тре́тьего февраля́]{.ru}']}
  why: |
    第 1、6 题：“在几号”不加前置词，序数词用第二格：[пя́того ма́я, деся́того ноября́]{.ru}。
    第 2、7、12 题：“今天几号”序数词用中性第一格（和 [число́]{.ru} 一致）：[пя́тое, пе́рвое, восьмо́е]{.ru}，不用阳性，也不用第二格。
    第 3 题：复合序数词只变最后一个词，[два́дцать]{.ru} 不变。
    第 4 题：[ноя́брь]{.ru} 变格时重音移到词尾：[в ноябре́]{.ru}。
    第 5、11、14 题：日期里的月份一律用第二格：[ноября́, а́вгуста, февраля́]{.ru}，不用第一格，也不用第六格。
    第 8、9 题：[тре́тье]{.ru} 词尾前有 [ь]{.ru}；7 的序数词是 [седьмо́й]{.ru}，词干有 [д]{.ru}。
    第 10、13 题：“在几月”用 [в]{.ru} + 第六格：[в ма́е, в а́вгусте]{.ru}。
