heading: 第 59 课　短尾形容词
groups:
- id: L59-01
  tags: [短尾形容词：四种性数形式]
  task: 写出短尾形容词的四种形式（没有的形式写“—”）。
  type: matrix
  cols: [长尾或原形, 阳性, 阴性, 中性, 复数]
  given: [0]
  rows:
  - {base: '[свобо́дный]{.ru}', cells: ['[свобо́дный]{.ru}', '[свобо́ден]{.ru}', '[свобо́дна]{.ru}', '[свобо́дно]{.ru}', '[свобо́дны]{.ru}']}
  - {base: '[за́нятый]{.ru}', cells: ['[за́нятый]{.ru}', '[за́нят]{.ru}', '[занята́]{.ru}', '[за́нято]{.ru}', '[за́няты]{.ru}']}
  - {base: '[здоро́вый]{.ru}', cells: ['[здоро́вый]{.ru}', '[здоро́в]{.ru}', '[здоро́ва]{.ru}', '[здоро́во]{.ru}', '[здоро́вы]{.ru}']}
  - {base: '[рад]{.ru}', cells: ['[рад]{.ru}', '[рад]{.ru}', '[ра́да]{.ru}', —, '[ра́ды]{.ru}']}
  - {base: '[до́лжен]{.ru}', cells: ['[до́лжен]{.ru}', '[до́лжен]{.ru}', '[должна́]{.ru}', '[должно́]{.ru}', '[должны́]{.ru}']}
  - {base: '[гото́вый]{.ru}', new: true, gloss: 准备好的, cells: ['[гото́вый]{.ru}', '[гото́в]{.ru}', '[гото́ва]{.ru}', '[гото́во]{.ru}', '[гото́вы]{.ru}']}
  - {base: '[согла́сный]{.ru}', new: true, gloss: 同意的, cells: ['[согла́сный]{.ru}', '[согла́сен]{.ru}', '[согла́сна]{.ru}', '[согла́сно]{.ru}', '[согла́сны]{.ru}']}
  - {base: '[дово́льный]{.ru}', new: true, gloss: 满意的, cells: ['[дово́льный]{.ru}', '[дово́лен]{.ru}', '[дово́льна]{.ru}', '[дово́льно]{.ru}', '[дово́льны]{.ru}']}
  - {base: '[больно́й]{.ru}', new: true, gloss: 生病的, cells: ['[больно́й]{.ru}', '[бо́лен]{.ru}', '[больна́]{.ru}', '[больно́]{.ru}', '[больны́]{.ru}']}
  why: |
    第 1、3、6–8 题：去掉长尾词尾，阳性不加词尾，阴性 [-а]{.ru}，中性 [-о]{.ru}，复数 [-ы]{.ru}；重音不动。第 1、7、8 题阳性词尾两个辅音相连，中间加 [е]{.ru}：[свобо́ден, согла́сен, дово́лен]{.ru}；其他形式没有这个 [е]{.ru}：[свобо́дна, дово́льны]{.ru}。
    第 2 题：[за́нят]{.ru} 的阴性重音移到词尾：[занята́]{.ru}，其余形式重音在词首。
    第 4 题：[рад]{.ru} 只有短尾形式，没有中性。
    第 5 题：[до́лжен]{.ru} 除阳性外重音都在词尾：[должна́, должно́, должны́]{.ru}。
    第 9 题：[бо́лен]{.ru} 阳性重音在词干，其余重音在词尾：[больна́, больно́, больны́]{.ru}。
- id: L59-02
  tags: [短尾形容词：按实际所指选择形式]
  task: 写出短尾形容词（括号里是说话人或所指的人）。
  type: matrix
  cols: [主语, '[за́нят]{.ru}', '[свобо́ден]{.ru}', '[до́лжен]{.ru}']
  given: [0]
  rows:
  - {base: '[я]{.ru}', hint: 王磊说, cells: ['[я]{.ru}', '[за́нят]{.ru}', '[свобо́ден]{.ru}', '[до́лжен]{.ru}']}
  - {base: '[я]{.ru}', hint: 安娜说, cells: ['[я]{.ru}', '[занята́]{.ru}', '[свобо́дна]{.ru}', '[должна́]{.ru}']}
  - {base: '[ты]{.ru}', hint: 对米沙说, cells: ['[ты]{.ru}', '[за́нят]{.ru}', '[свобо́ден]{.ru}', '[до́лжен]{.ru}']}
  - {base: '[ты]{.ru}', hint: 对塔尼娅说, cells: ['[ты]{.ru}', '[занята́]{.ru}', '[свобо́дна]{.ru}', '[должна́]{.ru}']}
  - {base: '[вы]{.ru}', hint: 对奥尔加·维克托罗夫娜说, cells: ['[вы]{.ru}', '[за́няты]{.ru}', '[свобо́дны]{.ru}', '[должны́]{.ru}']}
  - {base: '[вы]{.ru}', hint: 对米沙和安娜说, cells: ['[вы]{.ru}', '[за́няты]{.ru}', '[свобо́дны]{.ru}', '[должны́]{.ru}']}
  - {base: '[мы]{.ru}', cells: ['[мы]{.ru}', '[за́няты]{.ru}', '[свобо́дны]{.ru}', '[должны́]{.ru}']}
  - {base: '[па́па]{.ru}', cells: ['[па́па]{.ru}', '[за́нят]{.ru}', '[свобо́ден]{.ru}', '[до́лжен]{.ru}']}
  - {base: '[ма́ма]{.ru}', cells: ['[ма́ма]{.ru}', '[занята́]{.ru}', '[свобо́дна]{.ru}', '[должна́]{.ru}']}
  - {base: '[Пьер]{.ru}', cells: ['[Пьер]{.ru}', '[за́нят]{.ru}', '[свобо́ден]{.ru}', '[до́лжен]{.ru}']}
  - {base: '[Ю́ми]{.ru}', cells: ['[Ю́ми]{.ru}', '[занята́]{.ru}', '[свобо́дна]{.ru}', '[должна́]{.ru}']}
  - {base: '[студе́нты]{.ru}', cells: ['[студе́нты]{.ru}', '[за́няты]{.ru}', '[свобо́дны]{.ru}', '[должны́]{.ru}']}
  - {base: '[О́льга Ви́кторовна и Ива́н Серге́евич]{.ru}', cells: ['[О́льга Ви́кторовна и Ива́н Серге́евич]{.ru}', '[за́няты]{.ru}', '[свобо́дны]{.ru}', '[должны́]{.ru}']}
  why: |
    第 1–4 题：[я, ты]{.ru} 本身看不出性别，要按实际所指：男性用阳性 [за́нят, свобо́ден, до́лжен]{.ru}，女性用阴性 [занята́, свобо́дна, должна́]{.ru}。
    第 5、6 题：[вы]{.ru} 不论指一个人还是几个人，短尾形容词都用复数：[О́льга Ви́кторовна, вы свобо́дны?]{.ru}
    第 8–11 题：按名词所指的人的性别：[па́па, Пьер]{.ru} 阳性，[ма́ма, Ю́ми]{.ru} 阴性；[Ю́ми]{.ru} 不变格，但指女性。
    第 7、12、13 题：复数主语和两个并列的人用复数 [за́няты, свобо́дны, должны́]{.ru}。
- id: L59-03
  tags: [短尾形容词：过去与将来]
  task: 写出句子的过去时和将来时。
  type: matrix
  cols: [现在, 过去, 将来]
  given: [0]
  rows:
  - {base: '[Я за́нят.]{.ru}', cells: ['[Я за́нят.]{.ru}', '[Я был за́нят.]{.ru}', '[Я бу́ду за́нят.]{.ru}']}
  - {base: '[Она́ занята́.]{.ru}', cells: ['[Она́ занята́.]{.ru}', '[Она́ была́ занята́.]{.ru}', '[Она́ бу́дет занята́.]{.ru}']}
  - {base: '[Мы свобо́дны.]{.ru}', cells: ['[Мы свобо́дны.]{.ru}', '[Мы бы́ли свобо́дны.]{.ru}', '[Мы бу́дем свобо́дны.]{.ru}']}
  - {base: '[Ми́ша здоро́в.]{.ru}', cells: ['[Ми́ша здоро́в.]{.ru}', '[Ми́ша был здоро́в.]{.ru}', '[Ми́ша бу́дет здоро́в.]{.ru}']}
  - {base: '[Ба́бушка ра́да.]{.ru}', cells: ['[Ба́бушка ра́да.]{.ru}', '[Ба́бушка была́ ра́да.]{.ru}', '[Ба́бушка бу́дет ра́да.]{.ru}']}
  - {base: '[Ты до́лжен рабо́тать.]{.ru}', cells: ['[Ты до́лжен рабо́тать.]{.ru}', '[Ты до́лжен был рабо́тать.]{.ru}', '[Ты до́лжен бу́дешь рабо́тать.]{.ru}']}
  - {base: '[Вы свобо́дны?]{.ru}', cells: ['[Вы свобо́дны?]{.ru}', '[Вы бы́ли свобо́дны?]{.ru}', '[Вы бу́дете свобо́дны?]{.ru}']}
  - {base: '[А́нна должна́ сдать зада́ние.]{.ru}', cells: ['[А́нна должна́ сдать зада́ние.]{.ru}', '[А́нна должна́ была́ сдать зада́ние.]{.ru}', '[А́нна должна́ бу́дет сдать зада́ние.]{.ru}']}
  - {base: '[Они́ ра́ды.]{.ru}', cells: ['[Они́ ра́ды.]{.ru}', '[Они́ бы́ли ра́ды.]{.ru}', '[Они́ бу́дут ра́ды.]{.ru}']}
  - {base: '[Я свобо́дна.]{.ru}', cells: ['[Я свобо́дна.]{.ru}', '[Я была́ свобо́дна.]{.ru}', '[Я бу́ду свобо́дна.]{.ru}']}
  why: |
    第 1–10 题：短尾形容词句有第一格主语，过去时 [был, была́, бы́ли]{.ru} 和将来时 [бу́ду, бу́дешь…]{.ru} 都跟主语变，不像无人称句那样一律用 [бы́ло, бу́дет]{.ru}。
    第 1、10 题：[я]{.ru} 的性别由短尾形容词看出：[за́нят]{.ru} 是男性，用 [был]{.ru}；[свобо́дна]{.ru} 是女性，用 [была́]{.ru}。将来时都是 [бу́ду]{.ru}。
    第 7 题：[вы]{.ru} 用复数 [бы́ли, бу́дете]{.ru}。
    第 6、8 题：[до́лжен]{.ru} + 不定式，[быть]{.ru} 一般放在 [до́лжен]{.ru} 后面：[до́лжен был, должна́ была́]{.ru}；放在前面（[был до́лжен]{.ru}）也对。
- id: L59-04
  tags: [短尾形容词：句中配合]
  task: 用括号里的词填空。
  type: fill
  items:
  - {stem: 'А́нна, ты ___ в суббо́ту?', hint: свобо́ден, accept: [свобо́дна]}
  - {stem: 'Ми́ша сказа́л: «Извини́те, я ___ идти́».', hint: до́лжен, accept: [до́лжен]}
  - {stem: 'О́льга Ви́кторовна, вы ___?', hint: за́нят, accept: [за́няты]}
  - {stem: 'Ба́бушка всегда́ ___ тебя́ ви́деть.', hint: рад, accept: [ра́да]}
  - {stem: 'Ми́ша ___ сне́гу.', hint: рад, accept: [рад]}
  - {stem: 'Мы ___ сдать зада́ние в пя́тницу.', hint: до́лжен, accept: [должны́]}
  - {stem: 'Вчера́ па́па был ___.', hint: за́нят, accept: [за́нят]}
  - {stem: 'Ю́ми уже́ ___.', hint: здоро́в, accept: [здоро́ва]}
  - {stem: 'За́втра студе́нты бу́дут ___.', hint: свобо́ден, accept: [свобо́дны]}
  - {stem: 'Ива́н Серге́евич, вы уже́ ___?', hint: здоро́в, accept: [здоро́вы]}
  - {stem: '— А́нна, ты свобо́дна? — Нет, я ___.', hint: за́нят, accept: [занята́]}
  - {stem: 'Э́тот стул ___?', hint: свобо́ден, accept: [свобо́ден]}
  - {stem: 'Пьер и Ван Лэй ___ вас ви́деть.', hint: рад, accept: [ра́ды]}
  - {stem: 'Ты, Ми́ша, ___ сде́лать уро́ки.', hint: до́лжен, accept: [до́лжен]}
  - {stem: 'Ма́ма вчера́ была́ ___.', hint: за́нят, accept: [занята́]}
  - {stem: 'Вы ___ за́втра ве́чером?', hint: свобо́ден, accept: [свобо́дны]}
  - {stem: 'Ми́ша, ты уже́ ___?', hint: здоро́в, accept: [здоро́в]}
  - {stem: 'Мы бы́ли ___ в воскресе́нье.', hint: свобо́ден, accept: [свобо́дны]}
  - stem: Па́па, ты ___ в воскресе́нье?
    hint: свобо́ден
    accept:
    - свобо́ден
  - stem: Ма́ма ___ рабо́тать в суббо́ту.
    hint: до́лжен
    accept:
    - должна́
  - stem: Мы о́чень ___ вас ви́деть.
    hint: рад
    accept:
    - ра́ды
  - stem: Вчера́ А́нна была́ ___.
    hint: свобо́ден
    accept:
    - свобо́дна
  - stem: Студе́нты ___ сдать зада́ние в понеде́льник.
    hint: до́лжен
    accept:
    - должны́
  - stem: Ба́бушка уже́ ___.
    hint: здоро́в
    accept:
    - здоро́ва
  - stem: За́втра я бу́ду ___.
    hint: за́нят
    accept:
    - за́нят
    - занята́
  - stem: Ми́ша о́чень ___ пода́рку.
    hint: рад
    accept:
    - рад
  - stem: О́льга Ви́кторовна, вы ___ сего́дня?
    hint: свобо́ден
    accept:
    - свобо́дны
  - stem: Па́па и ма́ма сего́дня ___.
    hint: за́нят
    accept:
    - за́няты
  why: |-
    第 1、8、11、15、20、22、24 题：主语指女性，用阴性：[свобо́дна, здоро́ва, занята́, должна́]{.ru}；[занята́]{.ru} 重音在词尾。第 4 题 [ба́бушка]{.ru} 用 [ра́да]{.ru}。
    第 2、5、7、12、14、17、19、26 题：主语是阳性（[Ми́ша, па́па, стул]{.ru}），用阳性：[до́лжен, рад, за́нят, свобо́ден]{.ru}。第 12 题说的是椅子有没有人坐，[свобо́ден]{.ru} 也能用于东西。
    第 3、10、16、27 题：[вы]{.ru} 称呼一个人，短尾形容词也用复数：[за́няты, здоро́вы, свобо́дны]{.ru}。
    第 6、9、13、18、21、23、28 题：复数主语：[должны́, свобо́дны, ра́ды, за́няты]{.ru}。
    第 5、26 题：[рад]{.ru} 可以接第三格，表示为什么高兴：[рад сне́гу, рад пода́рку]{.ru}。
    第 25 题：[я]{.ru} 可以是男性或女性：[за́нят / занята́]{.ru}。
- id: L59-05
  tags: [短尾形容词：常见错误核查]
  task: 每句都有一处错误，写出正确的句子。
  type: matrix
  cols: [有错误的句子, 正确的句子]
  given: [0]
  rows:
  - {base: '[Ве́чером я свобо́дный.]{.ru}', cells: ['[Ве́чером я свобо́дный.]{.ru}', '[Ве́чером я свобо́ден.]{.ru}']}
  - {base: '[Вы свобо́ден?]{.ru}', hint: 对老师说, cells: ['[Вы свобо́ден?]{.ru}', '[Вы свобо́дны?]{.ru}']}
  - {base: '[Мне до́лжен идти́.]{.ru}', cells: ['[Мне до́лжен идти́.]{.ru}', '[Я до́лжен идти́.]{.ru}']}
  - {base: '[А́нна рад.]{.ru}', cells: ['[А́нна рад.]{.ru}', '[А́нна ра́да.]{.ru}']}
  - {base: '[Мы был за́няты.]{.ru}', cells: ['[Мы был за́няты.]{.ru}', '[Мы бы́ли за́няты.]{.ru}']}
  - {base: '[Ба́бушка бу́дут ра́да.]{.ru}', cells: ['[Ба́бушка бу́дут ра́да.]{.ru}', '[Ба́бушка бу́дет ра́да.]{.ru}']}
  - {base: '[Ми́ша уже́ здоро́вый.]{.ru}', hint: 病好了, cells: ['[Ми́ша уже́ здоро́вый.]{.ru}', '[Ми́ша уже́ здоро́в.]{.ru}']}
  - {base: '[Студе́нты свобо́ден.]{.ru}', cells: ['[Студе́нты свобо́ден.]{.ru}', '[Студе́нты свобо́дны.]{.ru}']}
  - {base: '[Я был занята́.]{.ru}', hint: 安娜说, cells: ['[Я был занята́.]{.ru}', '[Я была́ занята́.]{.ru}']}
  - {base: '[У меня́ свобо́ден ве́чер.]{.ru}', cells: ['[У меня́ свобо́ден ве́чер.]{.ru}', '[У меня́ свобо́дный ве́чер.]{.ru}']}
  - {base: '[Ты свобо́ден, А́нна?]{.ru}', cells: ['[Ты свобо́ден, А́нна?]{.ru}', '[Ты свобо́дна, А́нна?]{.ru}']}
  - {base: '[Ю́ми до́лжен сдать зада́ние.]{.ru}', cells: ['[Ю́ми до́лжен сдать зада́ние.]{.ru}', '[Ю́ми должна́ сдать зада́ние.]{.ru}']}
  - {base: '[Па́па бы́ло за́нят.]{.ru}', cells: ['[Па́па бы́ло за́нят.]{.ru}', '[Па́па был за́нят.]{.ru}']}
  - {base: '[Ми́ша и Пьер рад.]{.ru}', cells: ['[Ми́ша и Пьер рад.]{.ru}', '[Ми́ша и Пьер ра́ды.]{.ru}']}
  - base: '[Мы до́лжен идти́.]{.ru}'
    cells:
    - '[Мы до́лжен идти́.]{.ru}'
    - '[Мы должны́ идти́.]{.ru}'
  - base: '[Ма́ма за́нят.]{.ru}'
    cells:
    - '[Ма́ма за́нят.]{.ru}'
    - '[Ма́ма занята́.]{.ru}'
  - base: '[Сего́дня я свобо́дная.]{.ru}'
    cells:
    - '[Сего́дня я свобо́дная.]{.ru}'
    - '[Сего́дня я свобо́дна.]{.ru}'
    hint: 安娜说
  - base: '[Ты бу́дешь свобо́дный за́втра?]{.ru}'
    cells:
    - '[Ты бу́дешь свобо́дный за́втра?]{.ru}'
    - '[Ты бу́дешь свобо́ден за́втра?]{.ru}'
    hint: 对米沙说
  why: |-
    第 1、7、17、18 题：作谓语说“有空”“病好了”，用短尾形式：[свобо́ден, здоро́в]{.ru}。第 10 题相反：修饰名词要用长尾形式：[свобо́дный ве́чер]{.ru}。
    第 2 题：[вы]{.ru} 指一个人时短尾形容词也用复数 [свобо́дны]{.ru}。
    第 3 题：[до́лжен]{.ru} 是有人称的，主语用第一格 [я]{.ru}；和 [на́до]{.ru} 不同（[Мне на́до идти́]{.ru}）。
    第 4、11、12、16 题：主语指女性，用阴性 [ра́да, свобо́дна, должна́, занята́]{.ru}。第 8、14、15 题：复数主语用 [свобо́дны, ра́ды, должны́]{.ru}。
    第 5、6、9、13 题：[быть]{.ru} 跟主语变：[мы бы́ли, ба́бушка бу́дет, я（女）была́, па́па был]{.ru}。短尾形容词句有主语，不用无人称句的 [бы́ло]{.ru}。
