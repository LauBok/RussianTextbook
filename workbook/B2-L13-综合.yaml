    - '[ку́ртки]{.ru}'
  - base: '[Ми́ша расска́зывал о сёстрам.]{.ru}'
    cells:
    - '[Ми́ша расска́зывал о сёстрам.]{.ru}'
    - '[сёстрах]{.ru}'
  - base: '[Мы ви́дели колле́гов.]{.ru}'
    cells:
    - '[Мы ви́дели колле́гов.]{.ru}'
    - '[колле́г]{.ru}'
  - base: '[У меня́ нет пи́сьмов.]{.ru}'
    cells:
    - '[У меня́ нет пи́сьмов.]{.ru}'
    - '[пи́сем]{.ru}'
  - base: '[Ба́бушка пи́шет вну́кам и вну́чкими.]{.ru}'
    cells:
    - '[Ба́бушка пи́шет вну́кам и вну́чкими.]{.ru}'
    - '[вну́чкам]{.ru}'
  why: |-
    第 1、10 题：动物名词复数第四格同第二格：[ви́жу студе́нток, люблю́ соба́к]{.ru}。
    第 2 题：[ч]{.ru} 后写 [а]{.ru}，不写 [я]{.ru}：[о врача́х]{.ru}。
    第 3、12 题：非动物名词复数第四格同第一格：[купи́ла биле́ты, сда́ли ку́ртки]{.ru}。
    第 4、8、16 题：给谁、[по]{.ru} 后用第三格：[позвони́л друзья́м, по у́лицам, вну́чкам]{.ru}。
    第 5、9、11 题：[с, пе́ред]{.ru} 和 [интересова́ться]{.ru} 要求第五格：[с ребя́тами, музе́ями, пе́ред экза́менами]{.ru}。
    第 6、7、14、15 题：零词尾的复数第二格不加 [-ов]{.ru}：[мужчи́н, карти́н, колле́г, пи́сем]{.ru}。
    第 13 题：[о]{.ru} 要求第六格：[о сёстрах]{.ru}。
