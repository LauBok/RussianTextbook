  - base: '[помога́ть + сосе́ди]{.ru}'
    cells:
    - '[помога́ть + сосе́ди]{.ru}'
    - '[сосе́дям]{.ru}'
  - base: '[нет + де́ньги]{.ru}'
    cells:
    - '[нет + де́ньги]{.ru}'
    - '[де́нег]{.ru}'
  - base: '[интересова́ться + фильм]{.ru}'
    cells:
    - '[интересова́ться + фильм]{.ru}'
    - '[фи́льмами]{.ru}'
  - base: '[люби́ть + соба́ка]{.ru}'
    cells:
    - '[люби́ть + соба́ка]{.ru}'
    - '[соба́к]{.ru}'
  - base: '[музе́й]{.ru}'
    cells:
    - '[музе́й]{.ru}'
    - '[в музе́ях]{.ru}'
  why: |-
    第 1、8、14、20 题：[о, в, на]{.ru} + 复数第六格：[о города́х, в общежи́тиях, на ле́кциях, в музе́ях]{.ru}。
    第 2、9、16 题：[к, по]{.ru} 和 [помога́ть]{.ru} 要求第三格：[ба́бушкам, магази́нам, сосе́дям]{.ru}。
    第 3、10、15、18 题：[с, ме́жду]{.ru} 和 [интересова́ться]{.ru} 要求第五格：[друзья́ми, дома́ми, ребя́тами, фи́льмами]{.ru}。
    第 4、11、17 题：[без, мно́го, нет]{.ru} 后用第二格：[биле́тов, оши́бок, де́нег]{.ru}。
    第 5、7、12、19 题：动物名词复数第四格同第二格：[студе́нток, госте́й, колле́г, соба́к]{.ru}。
    第 6、13 题：非动物名词复数第四格同第一格：[ку́ртки, конфе́ты]{.ru}。
