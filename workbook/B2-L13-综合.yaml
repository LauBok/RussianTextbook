    - '[музе́и]{.ru}'
    - '[музе́ев]{.ru}'
    - '[музе́ям]{.ru}'
    - '[музе́ями]{.ru}'
    - '[о музе́ях]{.ru}'
  - base: '[лаборато́рии]{.ru}'
    cells:
    - '[лаборато́рии]{.ru}'
    - '[лаборато́рий]{.ru}'
    - '[лаборато́риям]{.ru}'
    - '[лаборато́риями]{.ru}'
    - '[о лаборато́риях]{.ru}'
  - base: '[сёстры]{.ru}'
    cells:
    - '[сёстры]{.ru}'
    - '[сестёр]{.ru}'
    - '[сёстрам]{.ru}'
    - '[сёстрами]{.ru}'
    - '[о сёстрах]{.ru}'
  - base: '[мужчи́ны]{.ru}'
    cells:
    - '[мужчи́ны]{.ru}'
    - '[мужчи́н]{.ru}'
    - '[мужчи́нам]{.ru}'
    - '[мужчи́нами]{.ru}'
    - '[о мужчи́нах]{.ru}'
  - base: '[города́]{.ru}'
    cells:
    - '[города́]{.ru}'
    - '[городо́в]{.ru}'
    - '[города́м]{.ru}'
    - '[города́ми]{.ru}'
    - '[о города́х]{.ru}'
  - base: '[пи́сьма]{.ru}'
    cells:
    - '[пи́сьма]{.ru}'
    - '[пи́сем]{.ru}'
    - '[пи́сьмам]{.ru}'
    - '[пи́сьмами]{.ru}'
    - '[о пи́сьмах]{.ru}'
  - base: '[де́вушки]{.ru}'
    cells:
    - '[де́вушки]{.ru}'
    - '[де́вушек]{.ru}'
    - '[де́вушкам]{.ru}'
    - '[де́вушками]{.ru}'
    - '[о де́вушках]{.ru}'
  - base: '[словари́]{.ru}'
    cells:
    - '[словари́]{.ru}'
    - '[словаре́й]{.ru}'
    - '[словаря́м]{.ru}'
    - '[словаря́ми]{.ru}'
    - '[о словаря́х]{.ru}'
  - base: '[неде́ли]{.ru}'
    cells:
    - '[неде́ли]{.ru}'
    - '[неде́ль]{.ru}'
    - '[неде́лям]{.ru}'
    - '[неде́лями]{.ru}'
    - '[о неде́лях]{.ru}'
  - base: '[оши́бки]{.ru}'
    cells:
    - '[оши́бки]{.ru}'
    - '[оши́бок]{.ru}'
    - '[оши́бкам]{.ru}'
    - '[оши́бками]{.ru}'
    - '[об оши́бках]{.ru}'
  - base: '[ме́сяцы]{.ru}'
    cells:
    - '[ме́сяцы]{.ru}'
    - '[ме́сяцев]{.ru}'
    - '[ме́сяцам]{.ru}'
    - '[ме́сяцами]{.ru}'
    - '[о ме́сяцах]{.ru}'
  why: |-
    第 1、8 题：第二格零词尾加隐现元音（[студе́нток, де́вушек]{.ru}），其余格在复数第一格词干上加 [-ам, -ами, -ах]{.ru}，不带插入的元音。
    第 2、10 题：软变化：第二格 [музе́ев]{.ru}、零词尾 [неде́ль]{.ru}；其余 [-ям, -ями, -ях]{.ru}。
    第 3 题：[-ия]{.ru}：第二格 [-ий]{.ru}，第六格 [-иях]{.ru}：[лаборато́рий, о лаборато́риях]{.ru}。
    第 4 题：[сестёр]{.ru} 插 [ё]{.ru}，其余格照复数第一格 [сёстр-]{.ru}：[сёстрам, сёстрами, о сёстрах]{.ru}。
    第 5 题：[-а]{.ru} 阳性按阴性变：[мужчи́н, мужчи́нам]{.ru}。
    第 6 题：复数重音在词尾，各格都在词尾：[городо́в, города́м, города́ми, о города́х]{.ru}。
    第 7 题：[пи́сем]{.ru} 插 [е]{.ru}，其余格重音同 [пи́сьма]{.ru}。
    第 9 题：[словаре́й]{.ru}；软变化 [словаря́м, словаря́ми, о словаря́х]{.ru}，重音在词尾。
    第 11 题：元音开头的词前 [о]{.ru} 写成 [об]{.ru}：[об оши́бках]{.ru}。
    第 12 题：[-ц]{.ru} 非重读：[ме́сяцев]{.ru}；[ц]{.ru} 后用 [-ам, -ами, -ах]{.ru}。
