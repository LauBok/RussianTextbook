  - base: '[мно́го + оши́бка]{.ru}'
    cells:
    - '[мно́го + оши́бка]{.ru}'
    - '[оши́бок]{.ru}'
  - base: '[пригласи́ть + колле́га]{.ru}'
    cells:
    - '[пригласи́ть + колле́га]{.ru}'
    - '[колле́г]{.ru}'
  - base: '[купи́ть + конфе́та]{.ru}'
    cells:
    - '[купи́ть + конфе́та]{.ru}'
    - '[конфе́ты]{.ru}'
  - base: '[ле́кция]{.ru}'
    cells:
    - '[ле́кция]{.ru}'
    - '[на ле́кциях]{.ru}'
  - base: '[с + ребя́та]{.ru}'
    cells:
    - '[с + ребя́та]{.ru}'
