  task: 写出复数第二、三、五、六格。
  type: matrix
  cols:
  - 复数第一格
  - 第二格
  - 第三格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[студе́нтки]{.ru}'
    cells:
    - '[студе́нтки]{.ru}'
    - '[студе́нток]{.ru}'
    - '[студе́нткам]{.ru}'
    - '[студе́нтками]{.ru}'
    - '[о студе́нтках]{.ru}'
  - base: '[музе́и]{.ru}'
