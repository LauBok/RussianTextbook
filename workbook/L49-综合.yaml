heading: 综合练习　时间表达
lessons: [L29, L47, L48, L49]
groups:
- id: L49-综合-a
  lessons: [L29, L47, L48, L49]
  tags: [综合：时间词组的形式]
  recycles: [L47-01, L47-02, L48-01, L49-02]
  task: 按括号里的要求写出时间词组（数字用词写出）。
  type: matrix
  cols: [给出的词, 时间词组]
  given: [0]
  rows:
  - {base: '[среда́]{.ru}', hint: 在星期几, cells: ['[среда́]{.ru}', '[в сре́ду]{.ru}']}
  - {base: '[март]{.ru}', hint: 在几月, cells: ['[март]{.ru}', '[в ма́рте]{.ru}']}
  - {base: '[3 час]{.ru}', hint: 在几点, cells: ['[3 час]{.ru}', '[в три часа́]{.ru}']}
  - {base: '[10 ноя́брь]{.ru}', hint: 在几号, cells: ['[10 ноя́брь]{.ru}', '[деся́того ноября́]{.ru}']}
  - {base: '[2 неде́ля]{.ru}', hint: 过多久以后, cells: ['[2 неде́ля]{.ru}', '[че́рез две неде́ли]{.ru}']}
  - {base: '[5 год]{.ru}', hint: 多久以前, cells: ['[5 год]{.ru}', '[пять лет наза́д]{.ru}']}
  - {base: '[вто́рник]{.ru}', hint: 在星期几, cells: ['[вто́рник]{.ru}', '[во вто́рник]{.ru}']}
  - {base: '[февра́ль]{.ru}', hint: 在几月, cells: ['[февра́ль]{.ru}', '[в феврале́]{.ru}']}
  - {base: '[1 час]{.ru}', hint: 在几点, cells: ['[1 час]{.ru}', '[в час]{.ru}']}
  - {base: '[3 май]{.ru}', hint: 今天几号, cells: ['[3 май]{.ru}', '[тре́тье ма́я]{.ru}']}
  - {base: '[1 ме́сяц]{.ru}', hint: 多久以前, cells: ['[1 ме́сяц]{.ru}', '[ме́сяц наза́д]{.ru}']}
  - {base: '[полчаса́]{.ru}', hint: 过多久以后, cells: ['[полчаса́]{.ru}', '[че́рез полчаса́]{.ru}']}
  - {base: '[суббо́та]{.ru}', hint: 在星期几, cells: ['[суббо́та]{.ru}', '[в суббо́ту]{.ru}']}
  - {base: '[октя́брь]{.ru}', hint: 在几月, cells: ['[октя́брь]{.ru}', '[в октябре́]{.ru}']}
  - {base: '[22 час]{.ru}', hint: 在几点, cells: ['[22 час]{.ru}', '[в два́дцать два часа́]{.ru}']}
  - {base: '[21 ию́нь]{.ru}', hint: 在几号, cells: ['[21 ию́нь]{.ru}', '[два́дцать пе́рвого ию́ня]{.ru}']}
  - {base: '[3 мину́та]{.ru}', hint: 多久以前, cells: ['[3 мину́та]{.ru}', '[три мину́ты наза́д]{.ru}']}
  - {base: '[1 неде́ля]{.ru}', hint: 过多久以后, cells: ['[1 неде́ля]{.ru}', '[че́рез неде́лю]{.ru}']}
  why: |
    第 1、7、13 题：星期几用 [в]{.ru} + 第四格：[в сре́ду, в суббо́ту]{.ru}；[вто́рник]{.ru} 前写 [во]{.ru}。
    第 2、8、14 题：月份用 [в]{.ru} + 第六格；[февра́ль, октя́брь]{.ru} 重音移到词尾：[в феврале́, в октябре́]{.ru}。
    第 3、9、15 题：钟点用 [в]{.ru} + 第四格：[в три часа́, в два́дцать два часа́]{.ru}；一点只说 [в час]{.ru}。
    第 4、16 题：在几号，序数词和月份都用第二格，不加前置词：[деся́того ноября́, два́дцать пе́рвого ию́ня]{.ru}。第 10 题“今天几号”序数词用中性第一格：[тре́тье ма́я]{.ru}。
    第 5、12、18 题：[че́рез]{.ru} + 第四格：[че́рез две неде́ли, че́рез полчаса́, че́рез неде́лю]{.ru}。
    第 6、11、17 题：时长 + [наза́д]{.ru}：[пять лет наза́д, ме́сяц наза́д, три мину́ты наза́д]{.ru}；5 以上的“年”用 [лет]{.ru}。
- id: L49-综合-b
  lessons: [L48, L49]
  tags: [综合：日期与月份]
  recycles: [L48-01, L49-02, L49-04]
  task: 同一日期写出三种说法。
  type: matrix
  cols: [日期, 今天几号, 在几号, 在几月]
  given: [0]
  rows:
  - {base: '[1.01]{.ru}', cells: ['[1.01]{.ru}', '[пе́рвое января́]{.ru}', '[пе́рвого января́]{.ru}', '[в январе́]{.ru}']}
  - {base: '[2.06]{.ru}', cells: ['[2.06]{.ru}', '[второ́е ию́ня]{.ru}', '[второ́го ию́ня]{.ru}', '[в ию́не]{.ru}']}
  - {base: '[3.10]{.ru}', cells: ['[3.10]{.ru}', '[тре́тье октября́]{.ru}', '[тре́тьего октября́]{.ru}', '[в октябре́]{.ru}']}
  - {base: '[6.08]{.ru}', cells: ['[6.08]{.ru}', '[шесто́е а́вгуста]{.ru}', '[шесто́го а́вгуста]{.ru}', '[в а́вгусте]{.ru}']}
  - {base: '[7.11]{.ru}', cells: ['[7.11]{.ru}', '[седьмо́е ноября́]{.ru}', '[седьмо́го ноября́]{.ru}', '[в ноябре́]{.ru}']}
  - {base: '[11.04]{.ru}', cells: ['[11.04]{.ru}', '[оди́ннадцатое апре́ля]{.ru}', '[оди́ннадцатого апре́ля]{.ru}', '[в апре́ле]{.ru}']}
  - {base: '[14.02]{.ru}', cells: ['[14.02]{.ru}', '[четы́рнадцатое февраля́]{.ru}', '[четы́рнадцатого февраля́]{.ru}', '[в феврале́]{.ru}']}
  - {base: '[20.07]{.ru}', cells: ['[20.07]{.ru}', '[двадца́тое ию́ля]{.ru}', '[двадца́того ию́ля]{.ru}', '[в ию́ле]{.ru}']}
  - {base: '[24.05]{.ru}', cells: ['[24.05]{.ru}', '[два́дцать четвёртое ма́я]{.ru}', '[два́дцать четвёртого ма́я]{.ru}', '[в ма́е]{.ru}']}
  - {base: '[30.09]{.ru}', cells: ['[30.09]{.ru}', '[тридца́тое сентября́]{.ru}', '[тридца́того сентября́]{.ru}', '[в сентябре́]{.ru}']}
  - {base: '[18.03]{.ru}', cells: ['[18.03]{.ru}', '[восемна́дцатое ма́рта]{.ru}', '[восемна́дцатого ма́рта]{.ru}', '[в ма́рте]{.ru}']}
  - {base: '[27.12]{.ru}', cells: ['[27.12]{.ru}', '[два́дцать седьмо́е декабря́]{.ru}', '[два́дцать седьмо́го декабря́]{.ru}', '[в декабре́]{.ru}']}
  why: |
    第 1–12 题：同一个月份有两种形式：日期里用第二格（[января́, ию́ня, октября́]{.ru}），只说月份用 [в]{.ru} + 第六格（[в январе́, в ию́не, в октябре́]{.ru}）。两种形式的重音规律相同：[янва́рь, февра́ль, сентя́брь, октя́брь, ноя́брь, дека́брь]{.ru} 重音移到词尾，其余不动。
    序数词：“今天几号”用中性第一格 [-ое]{.ru}，“在几号”用中性第二格 [-ого]{.ru}；第 3 题 [тре́тье, тре́тьего]{.ru}，第 4、5、12 题 [шесто́е, седьмо́е]{.ru} 重音在词尾，第 8、10 题 [двадца́тое, тридца́тое]{.ru} 重音在 [-ца́-]{.ru} 上。
- id: L49-综合-c
  lessons: [L29, L47, L49]
  tags: [综合：时刻、时长与日期句中填空]
  recycles: [L47-03, L47-04, L49-03]
  task: 把括号里的时间写成正确的形式（数字用词写出，需要时加前置词）。
  type: fill
  items:
  - {stem: 'Магази́н открыва́ется ___.', hint: '9:00', accept: [в де́вять часо́в]}
  - {stem: 'Ми́ша игра́л в футбо́л ___.', hint: '2 час', accept: [два часа́]}
  - {stem: 'У меня́ день рожде́ния ___.', hint: '12.04', accept: [двена́дцатого апре́ля]}
  - {stem: 'Сего́дня ___.', hint: '12.04', accept: [двена́дцатое апре́ля]}
  - {stem: 'Мы бы́ли на да́че ___.', hint: 'суббо́та', accept: [в суббо́ту]}
  - {stem: 'А́нна верну́лась ___ наза́д.', hint: '1 час', accept: [час]}
  - {stem: 'Контро́льная рабо́та бу́дет ___.', hint: '25.11', accept: [два́дцать пя́того ноября́]}
  - {stem: 'Ван Лэй был в Пеки́не ___.', hint: 'а́вгуст', accept: [в а́вгусте]}
  - {stem: 'Ле́кция начина́ется ___.', hint: '13:00', accept: [в трина́дцать часо́в, в час]}
  - {stem: 'Мы жда́ли электри́чку ___.', hint: '15 мину́та', accept: [пятна́дцать мину́т]}
  - {stem: 'Че́рез ___ бу́дет пра́здник.', hint: '3 ме́сяц', accept: [три ме́сяца]}
  - {stem: 'Ско́ро ___ — День наро́дного еди́нства.', hint: '4.11', accept: [четвёртое ноября́]}
  - {stem: 'Ми́ша роди́лся ___.', hint: '20.11', accept: [двадца́того ноября́]}
  - {stem: 'Уро́к начался́ ___ наза́д.', hint: '5 мину́та', accept: [пять мину́т]}
  - {stem: 'Мы бу́дем у́жинать ___.', hint: '19:30', accept: [в девятна́дцать три́дцать, в девятна́дцать часо́в три́дцать мину́т]}
  - {stem: 'Ю́ми жила́ в Пеки́не ___.', hint: 'сентя́брь', accept: [в сентябре́]}
  why: |
    第 1、9、15 题：几点做某事用 [в]{.ru} + 钟点：[в де́вять часо́в]{.ru}；13 点可以说 [в трина́дцать часо́в]{.ru}，口语里也说 [в час]{.ru}；带分钟时口语只说两个数：[в девятна́дцать три́дцать]{.ru}。
    第 2、10 题：没有前置词的时间长度表示持续多久：[два часа́, пятна́дцать мину́т]{.ru}。
    第 3、7、13 题：某事发生在哪一天，序数词和月份都用第二格，不加 [в]{.ru}。第 4、12 题回答“今天是几号”，序数词用中性第一格：[двена́дцатое апре́ля, четвёртое ноября́]{.ru}。
    第 5 题：星期几用 [в]{.ru} + 第四格：[в суббо́ту]{.ru}。
    第 6、14 题：[наза́д]{.ru} 前面的时长用第四格：[час, пять мину́т]{.ru}。第 11 题 [че́рез]{.ru} + [три ме́сяца]{.ru}。
    第 8、16 题：只说月份，用 [в]{.ru} + 第六格：[в а́вгусте, в сентябре́]{.ru}。
