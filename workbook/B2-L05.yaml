heading: 第 5 课　年份
groups:
- id: B2-L05-01
  tags:
  - 序数词：整十与 1–19
  task: 写出序数词（阳性第一格）。
  type: matrix
  cols:
  - 基数词
  - 序数词
  given:
  - 0
  rows:
  - base: '[со́рок]{.ru}'
    cells:
    - '[со́рок]{.ru}'
    - '[сороково́й]{.ru}'
  - base: '[пятьдеся́т]{.ru}'
    cells:
    - '[пятьдеся́т]{.ru}'
    - '[пятидеся́тый]{.ru}'
  - base: '[шестьдеся́т]{.ru}'
    cells:
    - '[шестьдеся́т]{.ru}'
    - '[шестидеся́тый]{.ru}'
  - base: '[се́мьдесят]{.ru}'
    cells:
    - '[се́мьдесят]{.ru}'
    - '[семидеся́тый]{.ru}'
  - base: '[во́семьдесят]{.ru}'
    cells:
    - '[во́семьдесят]{.ru}'
    - '[восьмидеся́тый]{.ru}'
  - base: '[девяно́сто]{.ru}'
    cells:
    - '[девяно́сто]{.ru}'
    - '[девяно́стый]{.ru}'
  - base: '[сто]{.ru}'
    cells:
    - '[сто]{.ru}'
    - '[со́тый]{.ru}'
  - base: '[два́дцать]{.ru}'
    cells:
    - '[два́дцать]{.ru}'
    - '[двадца́тый]{.ru}'
  - base: '[три́дцать]{.ru}'
    cells:
    - '[три́дцать]{.ru}'
    - '[тридца́тый]{.ru}'
  - base: '[оди́ннадцать]{.ru}'
    cells:
    - '[оди́ннадцать]{.ru}'
    - '[оди́ннадцатый]{.ru}'
  - base: '[пятна́дцать]{.ru}'
    cells:
    - '[пятна́дцать]{.ru}'
    - '[пятна́дцатый]{.ru}'
  - base: '[восемна́дцать]{.ru}'
    cells:
    - '[восемна́дцать]{.ru}'
    - '[восемна́дцатый]{.ru}'
  - base: '[три]{.ru}'
    cells:
    - '[три]{.ru}'
    - '[тре́тий]{.ru}'
  - base: '[семь]{.ru}'
    cells:
    - '[семь]{.ru}'
    - '[седьмо́й]{.ru}'
  - base: '[во́семь]{.ru}'
    cells:
    - '[во́семь]{.ru}'
    - '[восьмо́й]{.ru}'
  - base: '[два]{.ru}'
    cells:
    - '[два]{.ru}'
    - '[второ́й]{.ru}'
  why: |-
    第 1 题：[со́рок → сороково́й]{.ru}，重音在词尾。
    第 2–5 题：50–80 的序数词前一半变成 [-и]{.ru}：[пятидеся́тый, шестидеся́тый, семидеся́тый, восьмидеся́тый]{.ru}（[во́семь → восьми-]{.ru}），重音都在 [-де́сятый]{.ru} 的 [я]{.ru} 上，不要照基数词写成 [пятьдеся́тый]{.ru}。
    第 6、7 题：[девяно́сто → девяно́стый]{.ru}，[сто → со́тый]{.ru}。
    第 8、9 题：[двадца́тый, тридца́тый]{.ru} 去掉 [ь]{.ru}，重音后移。
    第 10–12 题：11–19 去掉 [-ь]{.ru} 加 [-ый]{.ru}，重音不动：[оди́ннадцатый, пятна́дцатый, восемна́дцатый]{.ru}。
    第 13–16 题：第一册学过的特殊形式：[тре́тий, седьмо́й, восьмо́й, второ́й]{.ru}，后三个重音在词尾。
- id: B2-L05-02
  tags:
  - 年份：第一格与 в … году́
  task: 用文字写出年份：回答 [Како́й год?]{.ru} 和 [В како́м году́?]{.ru}
  type: matrix
  cols:
  - 年份
  - '[Како́й год?]{.ru}'
  - '[В како́м году́?]{.ru}'
  given:
  - 0
  rows:
  - base: '[1918]{.ru}'
    cells:
    - '[1918]{.ru}'
    - '[ты́сяча девятьсо́т восемна́дцатый год]{.ru}'
    - '[в ты́сяча девятьсо́т восемна́дцатом году́]{.ru}'
  - base: '[1945]{.ru}'
    cells:
    - '[1945]{.ru}'
    - '[ты́сяча девятьсо́т со́рок пя́тый год]{.ru}'
    - '[в ты́сяча девятьсо́т со́рок пя́том году́]{.ru}'
  - base: '[1961]{.ru}'
    cells:
    - '[1961]{.ru}'
    - '[ты́сяча девятьсо́т шестьдеся́т пе́рвый год]{.ru}'
    - '[в ты́сяча девятьсо́т шестьдеся́т пе́рвом году́]{.ru}'
  - base: '[1980]{.ru}'
    cells:
    - '[1980]{.ru}'
    - '[ты́сяча девятьсо́т восьмидеся́тый год]{.ru}'
    - '[в ты́сяча девятьсо́т восьмидеся́том году́]{.ru}'
  - base: '[1990]{.ru}'
    cells:
    - '[1990]{.ru}'
    - '[ты́сяча девятьсо́т девяно́стый год]{.ru}'
    - '[в ты́сяча девятьсо́т девяно́стом году́]{.ru}'
  - base: '[2000]{.ru}'
    cells:
    - '[2000]{.ru}'
    - '[двухты́сячный год]{.ru}'
    - '[в двухты́сячном году́]{.ru}'
  - base: '[2003]{.ru}'
    cells:
    - '[2003]{.ru}'
    - '[две ты́сячи тре́тий год]{.ru}'
    - '[в две ты́сячи тре́тьем году́]{.ru}'
  - base: '[2008]{.ru}'
    cells:
    - '[2008]{.ru}'
    - '[две ты́сячи восьмо́й год]{.ru}'
    - '[в две ты́сячи восьмо́м году́]{.ru}'
  why: |-
    第 1–3 题：只有最后一个词用序数词，前面都是基数词：[ты́сяча девятьсо́т со́рок пя́тый год]{.ru}；“在哪一年”序数词变第六格 [-ом]{.ru}，[год → году́]{.ru}，前面的 [ты́сяча девятьсо́т]{.ru} 不变。
    第 4、5 题：整十的年份最后一个词就是整十的序数词：[восьмидеся́тый, девяно́стый]{.ru}；第六格 [в … восьмидеся́том году́]{.ru}。
    第 6 题：2000 年是一个词：[двухты́сячный год]{.ru}，[в двухты́сячном году́]{.ru}。
    第 7 题：2001 年以后前面是 [две ты́сячи]{.ru}；[тре́тий]{.ru} 的第六格是 [тре́тьем]{.ru}（第一册学过）。
    第 8 题：重音在词尾的序数词第六格仍重读词尾：[восьмо́м]{.ru}。
- id: B2-L05-03
  tags:
  - 完整日期中的年份：第二格
  task: 用文字写出括号里的年份（句中）。
  type: fill
  items:
  - stem: Ван Лэй на́чал учи́ться в Москве́ пе́рвого сентября́ ___ го́да.
    hint: '2026'
    accept:
    - две ты́сячи два́дцать шесто́го
  - stem: Мари́я Никола́евна родила́сь пя́того ию́ня ___ го́да.
    hint: '1981'
    accept:
    - ты́сяча девятьсо́т во́семьдесят пе́рвого
  - stem: Ба́бушка родила́сь седьмо́го ма́рта ___ го́да.
    hint: '1950'
    accept:
    - ты́сяча девятьсо́т пятидеся́того
  - stem: Ми́ша роди́лся тре́тьего ию́ля ___ го́да.
    hint: '2012'
    accept:
    - две ты́сячи двена́дцатого
  - stem: Па́па на́чал рабо́тать на заво́де в ___ году́.
    hint: '1970'
    accept:
    - ты́сяча девятьсо́т семидеся́том
  - stem: Мы познако́мились в ___ году́.
    hint: '2023'
    accept:
    - две ты́сячи два́дцать тре́тьем
  - stem: Он роди́лся девя́того ма́я ___ го́да.
    hint: '2000'
    accept:
    - двухты́сячного
  - stem: Э́то бы́ло в ___ ве́ке.
    hint: '19'
    accept:
    - девятна́дцатом
  - stem: Мы живём в ___ ве́ке.
    hint: '21'
    accept:
    - два́дцать пе́рвом
  - stem: А́нна родила́сь в ___ году́.
    hint: '2007'
    accept:
    - две ты́сячи седьмо́м
  - stem: Ива́н Серге́евич роди́лся двена́дцатого ма́я ___ го́да.
    hint: '1976'
    accept:
    - ты́сяча девятьсо́т се́мьдесят шесто́го
  - stem: Де́душка роди́лся в ___ году́.
    hint: '1940'
    accept:
    - ты́сяча девятьсо́т сороково́м
  - stem: Ди́ма роди́лся второ́го января́ ___ го́да.
    hint: '2005'
    accept:
    - две ты́сячи пя́того
  - stem: Пу́шкин жил в ___ ве́ке.
    hint: '19'
    accept:
    - девятна́дцатом
  - stem: Сейча́с ___ год.
    hint: '2027'
    accept:
    - две ты́сячи два́дцать седьмо́й
  why: |-
    第 1、2、4、11、13 题：完整日期里日、月、年都用第二格，序数词词尾 [-ого]{.ru}：[две ты́сячи два́дцать шесто́го го́да]{.ru}；前面不加 [в]{.ru}。
    第 3 题：整十：[пятидеся́того]{.ru}。
    第 5、6 题：只说年份用 [в]{.ru} + 第六格 [-ом]{.ru}：[в ты́сяча девятьсо́т семидеся́том году́, в две ты́сячи два́дцать тре́тьем году́]{.ru}。
    第 10、12 题：重音在词尾的序数词第六格仍重读词尾：[в две ты́сячи седьмо́м году́, в ты́сяча девятьсо́т сороково́м году́]{.ru}。
    第 7 题：[двухты́сячный]{.ru} 第二格：[двухты́сячного го́да]{.ru}。
    第 8、9、14 题：世纪也用 [в]{.ru} + 第六格：[в девятна́дцатом ве́ке, в два́дцать пе́рвом ве́ке]{.ru}。
    第 15 题：[Како́й сейча́с год?]{.ru} 用第一格：[две ты́сячи два́дцать седьмо́й год]{.ru}。
- id: B2-L05-04
  tags:
  - год / го́да / лет
  task: 数值后面说 [год]{.ru}、[го́да]{.ru} 还是 [лет]{.ru}？把数值归类。
  type: classify
  bins:
  - '[год]{.ru}'
  - '[го́да]{.ru}'
  - '[лет]{.ru}'
  items:
  - text: '[1]{.ru}'
    answer: '[год]{.ru}'
  - text: '[2]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[3]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[5]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[11]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[12]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[13]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[14]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[21]{.ru}'
    answer: '[год]{.ru}'
  - text: '[22]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[24]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[25]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[30]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[31]{.ru}'
    answer: '[год]{.ru}'
  - text: '[43]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[51]{.ru}'
    answer: '[год]{.ru}'
  - text: '[68]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[101]{.ru}'
    answer: '[год]{.ru}'
  - text: '[104]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[111]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[112]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[32]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[15]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[61]{.ru}'
    answer: '[год]{.ru}'
  - text: '[73]{.ru}'
    answer: '[го́да]{.ru}'
  - text: '[90]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[114]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[200]{.ru}'
    answer: '[лет]{.ru}'
  - text: '[121]{.ru}'
    answer: '[год]{.ru}'
  why: |-
    第 1、9、14、16、18、24、29 题：最后一个词是 [оди́н]{.ru}：1、21、31、51、61、101、121 后用 [год]{.ru}。
    第 2、3、10、11、15、19、22、25 题：最后一个词是 2–4：2、3、22、24、32、43、73、104 后用 [го́да]{.ru}。
    第 4、12、13、17、26、28 题：5 以上、整十：5、25、30、68、90、200 后用 [лет]{.ru}。
    第 5–8、20、21、23、27 题：11–14 不看个位，一律用 [лет]{.ru}：[оди́ннадцать лет, пятна́дцать лет, сто двена́дцать лет, сто четы́рнадцать лет]{.ru}。
