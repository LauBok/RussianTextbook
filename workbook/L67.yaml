    - '[на авто́бусе]{.ru}'
  - base: '[трамва́й]{.ru}'
    cells:
    - '[трамва́й]{.ru}'
    - '[на трамва́е]{.ru}'
  - base: '[маши́на]{.ru}'
    cells:
    - '[маши́на]{.ru}'
    - '[на маши́не]{.ru}'
  - base: '[метро́]{.ru}'
    cells:
    - '[метро́]{.ru}'
    - '[на метро́]{.ru}'
  - base: '[такси́]{.ru}'
    cells:
    - '[такси́]{.ru}'
    - '[на такси́]{.ru}'
  - base: '[по́езд]{.ru}'
    cells:
