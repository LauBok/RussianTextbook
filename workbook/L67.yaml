  why: |
    第 1–14 题：表示乘坐的方式用 [на]{.ru} + 第六格，回答 [на чём?]{.ru}：阳性、阴性 [-а]{.ru} 名词词尾 [-е]{.ru}：[на авто́бусе, на маши́не, на ло́дке]{.ru}；[-й]{.ru} 结尾换成 [-е]{.ru}：[на трамва́е]{.ru}。
    第 4、5 题：[метро́, такси́]{.ru} 不变格：[на метро́, на такси́]{.ru}。不要说 [в метро́]{.ru}，那是“在地铁里”。
- id: L67-02
  tags:
  - 运动动词：步行与乘车、定向与不定向
  task: 判断句中应该用哪个动词，填写序号。
  type: classify
  bins:
  - '[идти́]{.ru}'
  - '[ходи́ть]{.ru}'
  - '[е́хать]{.ru}'
  - '[е́здить]{.ru}'
  items:
  - text: '[Сейча́с я … в университе́т на метро́.]{.ru}'
    answer: '[е́хать]{.ru}'
  - text: '[Ми́ша ка́ждый день … в шко́лу пешко́м.]{.ru}'
    answer: '[ходи́ть]{.ru}'
  - text: '[Смотри́, вот … наш авто́бус!]{.ru}'
    answer: '[идти́]{.ru}'
  - text: '[Мы обы́чно … на да́чу на маши́не.]{.ru}'
    answer: '[е́здить]{.ru}'
  - text: '[Сего́дня па́па … на рабо́ту на такси́.]{.ru}'
    answer: '[е́хать]{.ru}'
  - text: '[Ба́бушка лю́бит … пешко́м.]{.ru}'
    answer: '[ходи́ть]{.ru}'
  - text: '[— Куда́ ты сейча́с …? — В апте́ку.]{.ru}'
    answer: '[идти́]{.ru}'
  - text: '[Ты ча́сто … на трамва́е?]{.ru}'
    answer: '[е́здить]{.ru}'
  - text: '[Трамва́й … ме́дленно.]{.ru}'
    answer: '[идти́]{.ru}'
  - text: '[Сейча́с мы … в Новосиби́рск на по́езде.]{.ru}'
    answer: '[е́хать]{.ru}'
  - text: '[Ка́ждую суббо́ту А́нна … в бассе́йн пешко́м.]{.ru}'
    answer: '[ходи́ть]{.ru}'
  - text: '[Студе́нты ча́сто … в центр на метро́.]{.ru}'
    answer: '[е́здить]{.ru}'
  - text: '[Сейча́с Ю́ми … в библиоте́ку пешко́м.]{.ru}'
    answer: '[идти́]{.ru}'
  - text: '[Ле́том мы всегда́ … на мо́ре на по́езде.]{.ru}'
    answer: '[е́здить]{.ru}'
  - text: '[Сего́дня я … на авто́бусе: метро́ на ремо́нте.]{.ru}'
    answer: '[е́хать]{.ru}'
  - text: '[Ми́ша обы́чно … в кино́ пешко́м.]{.ru}'
    answer: '[ходи́ть]{.ru}'
  why: |
    第 3、7、9、13 题：此刻朝一个方向走，用 [идти́]{.ru}；车辆本身行驶也用 [идти́]{.ru}：[вот идёт наш авто́бус, трамва́й идёт ме́дленно]{.ru}。
    第 2、6、11、16 题：步行，又有 [ка́ждый день, обы́чно, ка́ждую суббо́ту]{.ru} 表示经常，用 [ходи́ть]{.ru}；第 6 题“喜欢走路”泛指这种动作，也用 [ходи́ть]{.ru}。
    第 1、5、10、15 题：坐交通工具，[сейча́с, сего́дня]{.ru} 指这一次，用 [е́хать]{.ru}。
    第 4、8、12、14 题：坐交通工具，[обы́чно, ча́сто, всегда́]{.ru} 表示经常，用 [е́здить]{.ru}。去别的城市、去海边都要坐车，用 [е́хать / е́здить]{.ru}。
- id: L67-03
  tags:
  - 交通工具：на + 第六格
  - 去向：в / на + 第四格
  task: 写出“坐……去某处”的说法。
  type: matrix
  cols:
  - 去处 + 交通工具
  - '[Я е́ду / иду́ …]{.ru}'
  given:
  - 0
  rows:
  - base: '[университе́т + метро́]{.ru}'
    cells:
    - '[университе́т + метро́]{.ru}'
    - '[в университе́т на метро́]{.ru}'
  - base: '[рабо́та + авто́бус]{.ru}'
    cells:
    - '[рабо́та + авто́бус]{.ru}'
    - '[на рабо́ту на авто́бусе]{.ru}'
  - base: '[да́ча + электри́чка]{.ru}'
    cells:
    - '[да́ча + электри́чка]{.ru}'
    - '[на да́чу на электри́чке]{.ru}'
  - base: '[центр + трамва́й]{.ru}'
    cells:
    - '[центр + трамва́й]{.ru}'
    - '[в центр на трамва́е]{.ru}'
  - base: '[шко́ла + пешко́м]{.ru}'
    cells:
    - '[шко́ла + пешко́м]{.ru}'
    - '[в шко́лу пешко́м]{.ru}'
  - base: '[теа́тр + такси́]{.ru}'
    cells:
    - '[теа́тр + такси́]{.ru}'
    - '[в теа́тр на такси́]{.ru}'
  - base: '[Новосиби́рск + по́езд]{.ru}'
    cells:
    - '[Новосиби́рск + по́езд]{.ru}'
    - '[в Новосиби́рск на по́езде]{.ru}'
  - base: '[стадио́н + маши́на]{.ru}'
    cells:
    - '[стадио́н + маши́на]{.ru}'
    - '[на стадио́н на маши́не]{.ru}'
  - base: '[библиоте́ка + пешко́м]{.ru}'
    cells:
    - '[библиоте́ка + пешко́м]{.ru}'
    - '[в библиоте́ку пешко́м]{.ru}'
  - base: '[поликли́ника + тролле́йбус]{.ru}'
    cells:
    - '[поликли́ника + тролле́йбус]{.ru}'
    - '[в поликли́нику на тролле́йбусе]{.ru}'
    new: true
    gloss: 无轨电车
  - base: '[по́чта + велосипе́д]{.ru}'
    cells:
    - '[по́чта + велосипе́д]{.ru}'
    - '[на по́чту на велосипе́де]{.ru}'
    new: true
    gloss: 自行车
  - base: '[конце́рт + метро́]{.ru}'
    cells:
    - '[конце́рт + метро́]{.ru}'
    - '[на конце́рт на метро́]{.ru}'
  why: |
    第 1–12 题：去处回答 [куда́?]{.ru}，用 [в / на]{.ru} + 第四格：[в университе́т, на рабо́ту, в библиоте́ку]{.ru}；交通工具回答 [на чём?]{.ru}，用 [на]{.ru} + 第六格：[на авто́бусе, на трамва́е]{.ru}。同一句里两个 [на]{.ru} 后面的格不同。
    第 2、3、8、11、12 题：[рабо́та, да́ча, стадио́н, по́чта, конце́рт]{.ru} 习惯用 [на]{.ru}：[на рабо́ту, на по́чту]{.ru}。
    第 5、9 题：步行用 [пешко́м]{.ru}，不加前置词，动词用 [идти́ / ходи́ть]{.ru}。
    第 1、6、12 题：[метро́, такси́]{.ru} 不变格。
- id: L67-04
  tags:
  - 运动动词：步行与乘车、定向与不定向
  task: 按主语写出括号里动词的现在时。
  type: fill
  items:
  - stem: Я обы́чно ___ в университе́т на метро́.
    hint: е́здить
    accept:
    - е́зжу
  - stem: Сего́дня я ___ на авто́бусе.
    hint: е́хать
    accept:
    - е́ду
  - stem: Я ка́ждый день ___ на рабо́ту пешко́м.
    hint: ходи́ть
    accept:
    - хожу́
  - stem: Мы ___ на уро́к.
    hint: идти́
    accept:
    - идём
  - stem: Ты ча́сто ___ на такси́?
    hint: е́здить
    accept:
    - е́здишь
  - stem: Куда́ вы сейча́с ___?
    hint: е́хать
    accept:
    - е́дете
  - stem: Ми́ша ___ в шко́лу пешко́м.
    hint: ходи́ть
    accept:
    - хо́дит
  - stem: Авто́бус ___ до ста́нции метро́.
    hint: идти́
    accept:
    - идёт
  - stem: Студе́нты ___ в центр на трамва́е.
    hint: е́хать
    accept:
    - е́дут
  - stem: Ма́ма и па́па ___ на да́чу на электри́чке.
    hint: е́здить
    accept:
    - е́здят
  - stem: Вы ча́сто ___ в теа́тр?
    hint: ходи́ть
    accept:
    - хо́дите
  - stem: — На чём ты ___ домо́й? — На маши́не.
    hint: е́хать
    accept:
    - е́дешь
  - stem: Ва́ши де́ти ___ в шко́лу пешко́м?
    hint: ходи́ть
    accept:
    - хо́дят
  - stem: Мы с А́нной ___ на рабо́ту на метро́.
    hint: е́здить
    accept:
    - е́здим
  why: |
    第 1、3 题：[е́здить]{.ru} 第一人称 [зд → зж]{.ru}：[е́зжу]{.ru}；[ходи́ть]{.ru} 第一人称 [д → ж]{.ru}：[хожу́]{.ru}，其余人称不交替。
    第 2、6、9、12 题：[е́хать]{.ru} 词干变成 [е́д-]{.ru}：[е́ду, е́дешь, е́дете, е́дут]{.ru}。
    第 4、8 题：[идти́]{.ru}：[идём, идёт]{.ru}。第 8 题车辆行驶用 [идти́]{.ru}。
    第 5、10、14 题：[е́здишь, е́здят, е́здим]{.ru}，重音一直在词干。
    第 7、11、13 题：[ходи́ть]{.ru} 从第二人称起重音前移：[хо́дит, хо́дите, хо́дят]{.ru}。
    第 14 题：[мы с А́нной]{.ru} 用 [мы]{.ru} 的形式。
