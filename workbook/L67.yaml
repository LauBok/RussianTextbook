    cells:
    - '[тролле́йбус]{.ru}'
    - '[на тролле́йбусе]{.ru}'
    new: true
    gloss: 无轨电车
  - base: '[мотоци́кл]{.ru}'
    cells:
    - '[мотоци́кл]{.ru}'
    - '[на мотоци́кле]{.ru}'
    new: true
    gloss: 摩托车
  - base: '[ло́дка]{.ru}'
    cells:
    - '[ло́дка]{.ru}'
    - '[на ло́дке]{.ru}'
    new: true
