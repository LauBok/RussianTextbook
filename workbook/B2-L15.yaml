heading: 第 15 课　物主代词与指示代词复数各格
groups:
- id: B2-L15-01
  tags:
  - 物主代词与指示代词复数各格
  task: 写出代词复数第二、三、五、六格。
  type: matrix
  cols:
  - 复数第一格
  - 第二格
  - 第三格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[мои́]{.ru}'
    cells:
    - '[мои́]{.ru}'
    - '[мои́х]{.ru}'
    - '[мои́м]{.ru}'
    - '[мои́ми]{.ru}'
    - '[о мои́х]{.ru}'
  - base: '[твои́]{.ru}'
    cells:
    - '[твои́]{.ru}'
    - '[твои́х]{.ru}'
    - '[твои́м]{.ru}'
    - '[твои́ми]{.ru}'
    - '[о твои́х]{.ru}'
  - base: '[свои́]{.ru}'
    cells:
    - '[свои́]{.ru}'
    - '[свои́х]{.ru}'
    - '[свои́м]{.ru}'
    - '[свои́ми]{.ru}'
    - '[о свои́х]{.ru}'
  - base: '[на́ши]{.ru}'
    cells:
    - '[на́ши]{.ru}'
    - '[на́ших]{.ru}'
    - '[на́шим]{.ru}'
    - '[на́шими]{.ru}'
    - '[о на́ших]{.ru}'
  - base: '[ва́ши]{.ru}'
    cells:
    - '[ва́ши]{.ru}'
    - '[ва́ших]{.ru}'
    - '[ва́шим]{.ru}'
    - '[ва́шими]{.ru}'
    - '[о ва́ших]{.ru}'
  - base: '[э́ти]{.ru}'
    cells:
    - '[э́ти]{.ru}'
    - '[э́тих]{.ru}'
    - '[э́тим]{.ru}'
    - '[э́тими]{.ru}'
    - '[об э́тих]{.ru}'
  - base: '[те]{.ru}'
    cells:
    - '[те]{.ru}'
    - '[тех]{.ru}'
    - '[тем]{.ru}'
    - '[те́ми]{.ru}'
    - '[о тех]{.ru}'
  why: |-
    第 1–3 题：[мои́, твои́, свои́]{.ru}：[-и́х, -и́м, -и́ми]{.ru}，重音在词尾：[мои́х, твои́м, свои́ми]{.ru}。
    第 4、5 题：[на́ши, ва́ши]{.ru}：重音在词干：[на́ших, ва́шим, ва́шими]{.ru}。
    第 6 题：[э́ти]{.ru}：[э́тих, э́тим, э́тими]{.ru}；元音前用 [об]{.ru}：[об э́тих]{.ru}。
    第 7 题：[те]{.ru}：[тех, тем, те́ми, о тех]{.ru}；第五格 [те́ми]{.ru} 是两个音节，要标重音。
- id: B2-L15-02
  tags:
  - 代词 + 形容词 + 名词：复数第三、五、六格
  task: 写出词组的复数第三、五、六格。
  type: matrix
  cols:
  - 复数第一格
  - 第三格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[мои́ шко́льные учителя́]{.ru}'
    cells:
    - '[мои́ шко́льные учителя́]{.ru}'
    - '[мои́м шко́льным учителя́м]{.ru}'
    - '[мои́ми шко́льными учителя́ми]{.ru}'
    - '[о мои́х шко́льных учителя́х]{.ru}'
  - base: '[на́ши но́вые сосе́ди]{.ru}'
    cells:
    - '[на́ши но́вые сосе́ди]{.ru}'
    - '[на́шим но́вым сосе́дям]{.ru}'
    - '[на́шими но́выми сосе́дями]{.ru}'
    - '[о на́ших но́вых сосе́дях]{.ru}'
  - base: '[э́ти молоды́е актёры]{.ru}'
    cells:
    - '[э́ти молоды́е актёры]{.ru}'
    - '[э́тим молоды́м актёрам]{.ru}'
    - '[э́тими молоды́ми актёрами]{.ru}'
    - '[об э́тих молоды́х актёрах]{.ru}'
  - base: '[те ста́рые пи́сьма]{.ru}'
    cells:
    - '[те ста́рые пи́сьма]{.ru}'
    - '[тем ста́рым пи́сьмам]{.ru}'
    - '[те́ми ста́рыми пи́сьмами]{.ru}'
    - '[о тех ста́рых пи́сьмах]{.ru}'
  - base: '[ва́ши ру́сские друзья́]{.ru}'
    cells:
    - '[ва́ши ру́сские друзья́]{.ru}'
    - '[ва́шим ру́сским друзья́м]{.ru}'
    - '[ва́шими ру́сскими друзья́ми]{.ru}'
    - '[о ва́ших ру́сских друзья́х]{.ru}'
  - base: '[твои́ ле́тние кани́кулы]{.ru}'
    cells:
    - '[твои́ ле́тние кани́кулы]{.ru}'
    - '[твои́м ле́тним кани́кулам]{.ru}'
    - '[твои́ми ле́тними кани́кулами]{.ru}'
    - '[о твои́х ле́тних кани́кулах]{.ru}'
    new: true
    gloss: 暑假
  - base: '[на́ши хоро́шие преподава́тели]{.ru}'
    cells:
    - '[на́ши хоро́шие преподава́тели]{.ru}'
    - '[на́шим хоро́шим преподава́телям]{.ru}'
    - '[на́шими хоро́шими преподава́телями]{.ru}'
    - '[о на́ших хоро́ших преподава́телях]{.ru}'
  - base: '[э́ти интере́сные кни́ги]{.ru}'
    cells:
    - '[э́ти интере́сные кни́ги]{.ru}'
    - '[э́тим интере́сным кни́гам]{.ru}'
    - '[э́тими интере́сными кни́гами]{.ru}'
    - '[об э́тих интере́сных кни́гах]{.ru}'
  why: |-
    第 1、2 题：代词、形容词、名词都用同一个格：[мои́м шко́льным учителя́м, на́шими но́выми сосе́дями]{.ru}。
    第 3、8 题：[э́тих]{.ru} 以元音开头，前置词写 [об]{.ru}：[об э́тих молоды́х актёрах]{.ru}。
    第 4 题：[те]{.ru}：[тем, те́ми, о тех]{.ru}。
    第 5、7 题：[ру́сский, хоро́ший]{.ru} 写 [и]{.ru}：[ру́сским, хоро́шими]{.ru}；[друзья́]{.ru} 软变化：[друзья́м]{.ru}。
    第 6 题：[ле́тний]{.ru} 软变化：[ле́тним, ле́тними, ле́тних]{.ru}；[кани́кулы]{.ru} 只有复数。
- id: B2-L15-03
  tags:
  - свой 还是 их / его́ / на́ш…
  task: 按括号里的说明，填入表示“谁的”的代词的正确形式。
  type: fill
  items:
  - stem: Студе́нты уважа́ют ___ преподава́телей.
    hint: 学生们自己的
    accept:
    - свои́х
  - stem: Я зна́ю ___ преподава́телей.
    hint: 他们的
    accept:
    - их
  - stem: Мы ча́сто говори́м о ___ роди́телях.
    hint: 我们的
    accept:
    - свои́х
    - на́ших
  - stem: Де́ти помога́ют ___ роди́телям.
    hint: 孩子们自己的
    accept:
    - свои́м
  - stem: Я разгова́ривал с ___ сосе́дями.
    hint: 他们的
    accept:
    - их
  - stem: Ди́ма расска́зывал о ___ друзья́х.
    hint: 迪马自己的
    accept:
    - свои́х
  - stem: А́нна зна́ет ___ друзе́й.
    hint: 迪马的
    accept:
    - его́
  - stem: Ты звони́шь ___ роди́телям?
    hint: 你自己的
    accept:
    - свои́м
    - твои́м
  - stem: Ю́ми горди́тся ___ бра́тьями.
    hint: 由美自己的
    accept:
    - свои́ми
  - stem: О́льга Ви́кторовна спроси́ла нас о ___ шко́льных учителя́х.
    hint: 我们的
    accept:
    - на́ших
  - stem: Роди́тели Ми́ши ча́сто говоря́т о ___ сыновья́х.
    hint: 他们自己的
    accept:
    - свои́х
  - stem: Я ча́сто ду́маю о ___ уро́ках.
    hint: 您的
    accept:
    - ва́ших
  why: |-
    第 1、4、6、9、11 题：所有者就是本句主语时用 [свой]{.ru}，随名词变格：[свои́х преподава́телей, свои́м роди́телям, о свои́х друзья́х, свои́ми бра́тьями]{.ru}。
    第 2、5、7 题：所有者不是主语时用 [его́, её, их]{.ru}，它们不变格：[их преподава́телей, с их сосе́дями, его́ друзе́й]{.ru}。
    第 10、12 题：所有者不是主语，用 [наш, ваш]{.ru} 的相应形式：[о на́ших роди́телях, о на́ших учителя́х, о ва́ших уро́ках]{.ru}。
    第 3、8 题：主语是第一、二人称（[мы, ты]{.ru}）时，所有者就是主语，[свой]{.ru} 和 [наш, твой]{.ru} 两种都对：[о свои́х / на́ших роди́телях, свои́м / твои́м роди́телям]{.ru}。
