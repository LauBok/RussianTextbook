    - '[ходи́ли]{.ru}'
    - '[е́хали]{.ru}'
    - '[е́здили]{.ru}'
  why: |
    第 1–11 题：[идти́]{.ru} 的过去时词干完全不同：[шёл, шла, шли]{.ru}；阳性写 [ё]{.ru}，不写 [шол]{.ru}。其余三个动词去掉 [-ть]{.ru} 加 [-л, -ла, -ли]{.ru}：[ходи́л, е́хал, е́здил]{.ru}，重音位置和不定式相同。
    第 1–4 题：[я, ты]{.ru} 的过去时看实际性别：男性 [шёл]{.ru}，女性 [шла]{.ru}。
    第 8 题：[вы]{.ru} 一律用复数 [шли, ходи́ли]{.ru}。第 11 题：两个人用复数。
- id: L71-02
  tags:
  - 运动动词过去时：在路上与往返
  task: 句中的运动动词表示什么？按意思归类。
  type: classify
  bins:
  - 当时在路上（[шёл, е́хал]{.ru}）
  - 去了一趟（[ходи́л, е́здил]{.ru}）
  - 过去经常去（[ча́сто ходи́л]{.ru}）
  items:
  - text: '[Вчера́ я ходи́л в музе́й.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  - text: '[Мы е́хали в метро́ и ви́дели там О́льгу Ви́кторовну.]{.ru}'
    answer: 当时在路上（[шёл, е́хал]{.ru}）
  - text: '[В про́шлом году́ Ми́ша е́здил в Петербу́рг.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  - text: '[Я шёл домо́й. Шёл снег.]{.ru}'
    answer: 当时在路上（[шёл, е́хал]{.ru}）
  - text: '[В сентябре́ я ка́ждый день ходи́л в библиоте́ку.]{.ru}'
    answer: 过去经常去（[ча́сто ходи́л]{.ru}）
  - text: '[Ра́ньше па́па ча́сто е́здил на да́чу.]{.ru}'
    answer: 过去经常去（[ча́сто ходи́л]{.ru}）
  - text: '[В суббо́ту мы ходи́ли в галере́ю.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  - text: '[Мы шли по у́лице и разгова́ривали.]{.ru}'
    answer: 当时在路上（[шёл, е́хал]{.ru}）
  - text: '[Ле́том ба́бушка е́здила в Новосиби́рск.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  - text: '[А́нна е́хала на авто́бусе и чита́ла кни́гу.]{.ru}'
    answer: 当时在路上（[шёл, е́хал]{.ru}）
  - text: '[Ра́ньше мы ка́ждое ле́то е́здили на мо́ре.]{.ru}'
    answer: 过去经常去（[ча́сто ходи́л]{.ru}）
  - text: '[— Где ты был у́тром? — Я ходи́л в апте́ку.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  - text: '[Ва́ня шёл на уро́к и ду́мал о пра́ктике.]{.ru}'
    answer: 当时在路上（[шёл, е́хал]{.ru}）
  - text: '[Ра́ньше О́льга Ви́кторовна ча́сто ходи́ла в теа́тр.]{.ru}'
    answer: 过去经常去（[ча́сто ходи́л]{.ru}）
  - text: '[В воскресе́нье Пьер ходи́л на стадио́н.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  - text: '[Студе́нты е́хали на экску́рсию и слу́шали му́зыку.]{.ru}'
    answer: 当时在路上（[шёл, е́хал]{.ru}）
  - text: '[В шко́ле Ми́ша всегда́ ходи́л на уро́ки пешко́м.]{.ru}'
    answer: 过去经常去（[ча́сто ходи́л]{.ru}）
  - text: '[Вчера́ ве́чером мы е́здили в теа́тр.]{.ru}'
    answer: 去了一趟（[ходи́л, е́здил]{.ru}）
  why: |
    第 2、4、8、10、13、16 题：[шёл, е́хал]{.ru} 说的是当时正在路上的过程，常常给另一件事做背景（看见了谁、在读书、在下雪）。
    第 1、3、7、9、12、15、18 题：[ходи́л, е́здил]{.ru} 说的是去了一趟又回来，等于 [был]{.ru} + 处所：[Вчера́ я ходи́л в музе́й = Вчера́ я был в музе́е.]{.ru} 问“你去哪儿了”时也用这一组（第 12 题）。
    第 5、6、11、14、17 题：有 [ка́ждый день, ча́сто, ка́ждое ле́то, всегда́]{.ru}，表示过去经常去，也用不定向动词 [ходи́л, е́здил]{.ru}。
- id: L71-03
  tags:
  - 运动动词过去时：在路上与往返
  task: 根据句意选用括号里的一个形式填空。
  type: fill
  items:
  - stem: Вчера́ я ___ в кино́.
    hint: шёл / ходи́л
    accept:
    - ходи́л
  - stem: Я ___ домо́й. Бы́ло хо́лодно.
    hint: шёл / ходи́л
    accept:
    - шёл
  - stem: В про́шлом году́ мы ___ в Петербу́рг.
    hint: е́хали / е́здили
    accept:
    - е́здили
  - stem: Мы ___ в метро́ и разгова́ривали.
    hint: е́хали / е́здили
    accept:
    - е́хали
  - stem: — Где ты была́ вчера́? — Я ___ в музе́й.
    hint: шла / ходи́ла
    accept:
    - ходи́ла
  - stem: В ию́ле ба́бушка ка́ждый день ___ в парк.
    hint: шла / ходи́ла
    accept:
    - ходи́ла
  - stem: А́нна ___ на авто́бусе и смотре́ла в окно́.
    hint: е́хала / е́здила
    accept:
    - е́хала
  - stem: Ле́том Пьер ___ во Фра́нцию.
    hint: е́хал / е́здил
    accept:
    - е́здил
  - stem: Студе́нты ___ по у́лице и смея́лись.
    hint: шли / ходи́ли
    accept:
    - шли
  - stem: Ра́ньше па́па ча́сто ___ на да́чу.
    hint: е́хал / е́здил
    accept:
    - е́здил
  - stem: В суббо́ту Ми́ша ___ на стадио́н.
    hint: шёл / ходи́л
    accept:
    - ходи́л
  - stem: Ве́чером мы ___ домо́й на такси́ и смотре́ли на Москву́.
    hint: е́хали / е́здили
    accept:
    - е́хали
  - stem: — Что вы де́лали в воскресе́нье? — Мы ___ в галере́ю.
    hint: шли / ходи́ли
    accept:
    - ходи́ли
  - stem: ___ снег, и бы́ло хо́лодно.
    hint: Шёл / Ходи́л
    accept:
    - Шёл
  - stem: Я ___ на уро́к и ду́мал о пра́ктике.
    hint: шёл / ходи́л
    accept:
    - шёл
  - stem: В про́шлом году́ Ю́ми ___ в Япо́нию.
    hint: е́хала / е́здила
    accept:
    - е́здила
  why: |
    第 1、5、11、13 题：说的是去了一趟（已经回来），用 [ходи́л]{.ru}；第 5、13 题回答“去哪儿了”“做了什么”，问的是整件事。
    第 3、8、16 题：去别的城市、别的国家，要坐车，去了一趟又回来，用 [е́здил]{.ru}。
    第 6、10 题：[ка́ждый день, ча́сто]{.ru} 表示过去经常去，用不定向动词。
    第 2、4、7、9、12、15 题：说当时正在路上，后面接着讲路上的情形（冷、聊天、看窗外、笑、想事情），用 [шёл, е́хал]{.ru}。
    第 14 题：“下雪”只用 [идти́]{.ru}：[Шёл снег]{.ru}。
