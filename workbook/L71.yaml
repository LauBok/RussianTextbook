heading: 第 71 课　运动动词过去时
groups:
- id: L71-01
  tags:
  - 运动动词过去时：性数形式
  task: 按主语写出四个运动动词的过去时。
  type: matrix
  cols:
  - 主语
  - '[идти́]{.ru}'
  - '[ходи́ть]{.ru}'
  - '[е́хать]{.ru}'
  - '[е́здить]{.ru}'
  given:
  - 0
  rows:
  - base: '[я]{.ru}（[Ван Лэй]{.ru}）'
    cells:
    - '[я]{.ru}（[Ван Лэй]{.ru}）'
    - '[шёл]{.ru}'
    - '[ходи́л]{.ru}'
    - '[е́хал]{.ru}'
    - '[е́здил]{.ru}'
  - base: '[я]{.ru}（[А́нна]{.ru}）'
    cells:
    - '[я]{.ru}（[А́нна]{.ru}）'
    - '[шла]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[е́хала]{.ru}'
    - '[е́здила]{.ru}'
  - base: '[ты]{.ru}（[Ми́ша]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ми́ша]{.ru}）'
    - '[шёл]{.ru}'
    - '[ходи́л]{.ru}'
    - '[е́хал]{.ru}'
    - '[е́здил]{.ru}'
  - base: '[ты]{.ru}（[Ю́ми]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ю́ми]{.ru}）'
    - '[шла]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[е́хала]{.ru}'
    - '[е́здила]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[шёл]{.ru}'
    - '[ходи́л]{.ru}'
    - '[е́хал]{.ru}'
    - '[е́здил]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[шла]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[е́хала]{.ru}'
    - '[е́здила]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[шли]{.ru}'
    - '[ходи́ли]{.ru}'
    - '[е́хали]{.ru}'
    - '[е́здили]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[шли]{.ru}'
    - '[ходи́ли]{.ru}'
    - '[е́хали]{.ru}'
    - '[е́здили]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[шли]{.ru}'
    - '[ходи́ли]{.ru}'
    - '[е́хали]{.ru}'
    - '[е́здили]{.ru}'
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[шла]{.ru}'
    - '[ходи́ла]{.ru}'
    - '[е́хала]{.ru}'
    - '[е́здила]{.ru}'
  - base: '[Пьер и Ю́ми]{.ru}'
    cells:
    - '[Пьер и Ю́ми]{.ru}'
