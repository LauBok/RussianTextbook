heading: 综合练习　动词体、将来时与命令式
lessons: [L41, L42, L43, L44, L45, L46]
groups:
- id: L46-综合-a
  lessons: [L41, L43, L44, L46]
  tags: [综合：体对的各种形式]
  recycles: [L41-02, L43-02, L44-03, L44-04, L46-02]
  task: 同一体对写出四种形式。
  type: matrix
  cols: [体对, '未完成体将来时（[мы]{.ru}）', '完成体将来时（[мы]{.ru}）', '完成体过去时（[она́]{.ru}）', '完成体命令式（[вы]{.ru}）']
  given: [0]
  rows:
  - {base: '[чита́ть / прочита́ть]{.ru}', cells: ['[чита́ть / прочита́ть]{.ru}', '[бу́дем чита́ть]{.ru}', '[прочита́ем]{.ru}', '[прочита́ла]{.ru}', '[прочита́йте]{.ru}']}
  - {base: '[писа́ть / написа́ть]{.ru}', cells: ['[писа́ть / написа́ть]{.ru}', '[бу́дем писа́ть]{.ru}', '[напи́шем]{.ru}', '[написа́ла]{.ru}', '[напиши́те]{.ru}']}
  - {base: '[покупа́ть / купи́ть]{.ru}', cells: ['[покупа́ть / купи́ть]{.ru}', '[бу́дем покупа́ть]{.ru}', '[ку́пим]{.ru}', '[купи́ла]{.ru}', '[купи́те]{.ru}']}
  - {base: '[брать / взять]{.ru}', cells: ['[брать / взять]{.ru}', '[бу́дем брать]{.ru}', '[возьмём]{.ru}', '[взяла́]{.ru}', '[возьми́те]{.ru}']}
  - {base: '[дава́ть / дать]{.ru}', cells: ['[дава́ть / дать]{.ru}', '[бу́дем дава́ть]{.ru}', '[дади́м]{.ru}', '[дала́]{.ru}', '[да́йте]{.ru}']}
  - {base: '[говори́ть / сказа́ть]{.ru}', cells: ['[говори́ть / сказа́ть]{.ru}', '[бу́дем говори́ть]{.ru}', '[ска́жем]{.ru}', '[сказа́ла]{.ru}', '[скажи́те]{.ru}']}
  - {base: '[гото́вить / пригото́вить]{.ru}', cells: ['[гото́вить / пригото́вить]{.ru}', '[бу́дем гото́вить]{.ru}', '[пригото́вим]{.ru}', '[пригото́вила]{.ru}', '[пригото́вьте]{.ru}']}
  - {base: '[отвеча́ть / отве́тить]{.ru}', cells: ['[отвеча́ть / отве́тить]{.ru}', '[бу́дем отвеча́ть]{.ru}', '[отве́тим]{.ru}', '[отве́тила]{.ru}', '[отве́тьте]{.ru}']}
  - {base: '[спра́шивать / спроси́ть]{.ru}', cells: ['[спра́шивать / спроси́ть]{.ru}', '[бу́дем спра́шивать]{.ru}', '[спро́сим]{.ru}', '[спроси́ла]{.ru}', '[спроси́те]{.ru}']}
  - {base: '[расска́зывать / рассказа́ть]{.ru}', cells: ['[расска́зывать / рассказа́ть]{.ru}', '[бу́дем расска́зывать]{.ru}', '[расска́жем]{.ru}', '[рассказа́ла]{.ru}', '[расскажи́те]{.ru}']}
  - {base: '[смотре́ть / посмотре́ть]{.ru}', cells: ['[смотре́ть / посмотре́ть]{.ru}', '[бу́дем смотре́ть]{.ru}', '[посмо́трим]{.ru}', '[посмотре́ла]{.ru}', '[посмотри́те]{.ru}']}
  - {base: '[пока́зывать / показа́ть]{.ru}', cells: ['[пока́зывать / показа́ть]{.ru}', '[бу́дем пока́зывать]{.ru}', '[пока́жем]{.ru}', '[показа́ла]{.ru}', '[покажи́те]{.ru}']}
  why: |
    第 1–12 题：未完成体将来时只能用 [бу́дем]{.ru} + 未完成体不定式；完成体没有现在时，变位就是将来时，不加 [бу́дем]{.ru}。
    第 3、9 题：[ку́пим, спро́сим]{.ru} 重音在词干，过去时 [купи́ла, спроси́ла]{.ru} 和命令式 [купи́те, спроси́те]{.ru} 重音在词尾附近，三种形式各按自己的规则。
    第 4、5 题：[взять]{.ru} 的将来时和命令式用词干 [возьм-]{.ru}，过去时用不定式词干 [взя-]{.ru}，阴性重音在词尾 [взяла́]{.ru}；[дать]{.ru} 的将来时 [дади́м]{.ru}、过去时 [дала́]{.ru}、命令式 [да́йте]{.ru} 都要单独记。
    第 7、8 题：[я]{.ru} 的形式重音在词干（[пригото́влю, отве́чу]{.ru}），命令式加 [-ь]{.ru}：[пригото́вьте, отве́тьте]{.ru}，不带交替。
    第 2、6、10、11、12 题：[я]{.ru} 的形式重音在词尾，命令式加 [-и́те]{.ru}，[з → ж]{.ru}、[с → ш]{.ru} 交替保留：[напиши́те, скажи́те, расскажи́те, покажи́те]{.ru}。
- id: L46-综合-b
  lessons: [L42, L43, L45]
  tags: [综合：体的意义（过程、结果、反复）]
  recycles: [L42-02, L43-03, L45-01]
  task: 判断句中的动词表示哪一种意义，填写序号。
  type: classify
  bins: [过程、持续多久, 完成、有结果, 经常、反复]
  items:
  - {text: '[За́втра я бу́ду два часа́ занима́ться.]{.ru}', answer: 过程、持续多久}
  - {text: '[Я уже́ вы́учил но́вые слова́.]{.ru}', answer: 完成、有结果}
  - {text: '[Ка́ждый ве́чер Ми́ша бу́дет гуля́ть в па́рке.]{.ru}', answer: 经常、反复}
  - {text: '[Па́па пригото́вит у́жин, и мы бу́дем у́жинать.]{.ru}', answer: 完成、有结果}
  - {text: '[А́нна до́лго иска́ла ключ.]{.ru}', answer: 过程、持续多久}
  - {text: '[Обы́чно Пьер обе́дает в университе́те.]{.ru}', answer: 经常、反复}
  - {text: '[Ю́ми сра́зу поняла́ э́то сло́во.]{.ru}', answer: 完成、有结果}
  - {text: '[Мы час жда́ли авто́бус.]{.ru}', answer: 过程、持续多久}
  - {text: '[Ра́ньше ба́бушка ча́сто расска́зывала ска́зки.]{.ru}', answer: 经常、反复}
  - {text: '[Ван Лэй ку́пит биле́т на электри́чку.]{.ru}', answer: 完成、有结果}
  - {text: '[Иногда́ мы смо́трим ру́сские фи́льмы.]{.ru}', answer: 经常、反复}
  - {text: '[Вчера́ Ми́ша опозда́л на уро́к.]{.ru}', answer: 完成、有结果}
  - {text: '[Ве́чером я бу́ду до́лго писа́ть письмо́.]{.ru}', answer: 过程、持续多久}
  - {text: '[Ка́ждое воскресе́нье мы е́здим на да́чу.]{.ru}', answer: 经常、反复}
  - {text: '[Сего́дня я прочита́ю расска́з «Филиппо́к».]{.ru}', answer: 完成、有结果}
  - {text: '[Студе́нты два часа́ писа́ли упражне́ние.]{.ru}', answer: 过程、持续多久}
  - {text: '[Я всегда́ покупа́ю хлеб в э́той бу́лочной.]{.ru}', answer: 经常、反复}
  - {text: '[Мари́я Никола́евна взяла́ газе́ту.]{.ru}', answer: 完成、有结果}
  why: |
    第 1、5、8、13、16 题：[два часа́, до́лго, час]{.ru} 说明持续多久，过去、将来都用未完成体：[бу́ду занима́ться, иска́ла, жда́ли, бу́ду писа́ть, писа́ли]{.ru}。
    第 2、4、7、10、12、15、18 题：完成体过去时表示已经做成，完成体将来时表示将要做成：[вы́учил, поняла́, опозда́л, взяла́; пригото́вит, ку́пит, прочита́ю]{.ru}。第 4 题做好饭以后才能吃，前一个动作必须有结果。
    第 3、6、9、11、14、17 题：[ка́ждый ве́чер, обы́чно, ча́сто, иногда́, ка́ждое воскресе́нье, всегда́]{.ru} 表示反复，用未完成体；将来的反复也用 [бу́дет]{.ru} + 未完成体（第 3 题）。
- id: L46-综合-c
  lessons: [L44, L46]
  tags: [综合：命令式的构成]
  recycles: [L46-01, L46-02, L46-03]
  task: 写出 [они́]{.ru} 的形式和单数命令式。
  type: matrix
  cols: [不定式, '[они́]{.ru} 的形式', 单数命令式]
  given: [0]
  rows:
  - {base: '[прочита́ть]{.ru}', cells: ['[прочита́ть]{.ru}', '[прочита́ют]{.ru}', '[прочита́й]{.ru}']}
  - {base: '[отве́тить]{.ru}', cells: ['[отве́тить]{.ru}', '[отве́тят]{.ru}', '[отве́ть]{.ru}']}
  - {base: '[купи́ть]{.ru}', cells: ['[купи́ть]{.ru}', '[ку́пят]{.ru}', '[купи́]{.ru}']}
  - {base: '[сесть]{.ru}', cells: ['[сесть]{.ru}', '[ся́дут]{.ru}', '[сядь]{.ru}']}
  - {base: '[откры́ть]{.ru}', cells: ['[откры́ть]{.ru}', '[откро́ют]{.ru}', '[откро́й]{.ru}']}
  - {base: '[взять]{.ru}', cells: ['[взять]{.ru}', '[возьму́т]{.ru}', '[возьми́]{.ru}']}
  - {base: '[занима́ться]{.ru}', cells: ['[занима́ться]{.ru}', '[занима́ются]{.ru}', '[занима́йся]{.ru}']}
  - {base: '[повтори́ть]{.ru}', cells: ['[повтори́ть]{.ru}', '[повторя́т]{.ru}', '[повтори́]{.ru}']}
  - {base: '[встать]{.ru}', cells: ['[встать]{.ru}', '[вста́нут]{.ru}', '[встань]{.ru}']}
  - {base: '[рассказа́ть]{.ru}', cells: ['[рассказа́ть]{.ru}', '[расска́жут]{.ru}', '[расскажи́]{.ru}']}
  - {base: '[поста́вить]{.ru}', cells: ['[поста́вить]{.ru}', '[поста́вят]{.ru}', '[поста́вь]{.ru}']}
  - {base: '[сади́ться]{.ru}', cells: ['[сади́ться]{.ru}', '[садя́тся]{.ru}', '[сади́сь]{.ru}']}
  - {base: '[слу́шать]{.ru}', cells: ['[слу́шать]{.ru}', '[слу́шают]{.ru}', '[слу́шай]{.ru}']}
  - {base: '[объясни́ть]{.ru}', cells: ['[объясни́ть]{.ru}', '[объясня́т]{.ru}', '[объясни́]{.ru}']}
  - {base: '[посмотре́ть]{.ru}', cells: ['[посмотре́ть]{.ru}', '[посмо́трят]{.ru}', '[посмотри́]{.ru}']}
  - {base: '[пригото́вить]{.ru}', cells: ['[пригото́вить]{.ru}', '[пригото́вят]{.ru}', '[пригото́вь]{.ru}']}
  why: |
    第 1、5、7、13 题：去掉 [-ют]{.ru} 后词干以元音结尾，加 [-й]{.ru}：[прочита́й, откро́й, слу́шай]{.ru}；[-ся]{.ru} 动词在 [-й]{.ru} 后加 [-ся]{.ru}：[занима́йся]{.ru}。
    第 3、6、8、10、12、14、15 题：词干以辅音结尾，[я]{.ru} 的形式重音在词尾（[куплю́, возьму́, повторю́, расскажу́, сажу́сь, объясню́, посмотрю́]{.ru}），加重读 [-и́]{.ru}；第 12 题 [-и]{.ru} 后加 [-сь]{.ru}：[сади́сь]{.ru}。注意 [ку́пят, посмо́трят]{.ru} 重音在词干，命令式却是 [купи́, посмотри́]{.ru}：判断看 [я]{.ru} 的形式，不看 [они́]{.ru}。
    第 2、4、9、11、16 题：[я]{.ru} 的形式重音在词干（[отве́чу, ся́ду, вста́ну, поста́влю, пригото́влю]{.ru}），加 [-ь]{.ru}：[отве́ть, сядь, встань, поста́вь, пригото́вь]{.ru}。
- id: L46-综合-d
  lessons: [L41, L42, L43, L45, L46]
  tags: [综合：体与时间的选择]
  recycles: [L42-03, L43-04, L45-02, L46-04]
  task: 用括号里的动词填空。
  type: fill
  items:
  - {stem: 'Вчера́ А́нна до́лго ___ письмо́.', hint: писа́ть / написа́ть, accept: [писа́ла]}
  - {stem: 'Хорошо́, за́втра я ___ кни́гу.', hint: дава́ть / дать, accept: [дам]}
  - {stem: 'Ми́ша, ___ хлеб, пожа́луйста!', hint: покупа́ть / купи́ть, accept: [купи́]}
  - {stem: 'Ка́ждое у́тро па́па ___ газе́ту.', hint: чита́ть / прочита́ть, accept: [чита́ет]}
  - {stem: 'Ван Лэй уже́ ___ но́вые слова́.', hint: учи́ть / вы́учить, accept: [вы́учил]}
  - {stem: 'О́льга Ви́кторовна, ___, пожа́луйста, ещё раз.', hint: объясня́ть / объясни́ть, accept: [объясни́те]}
  - {stem: 'За́втра я ___ в библиоте́ке три часа́.', hint: занима́ться, accept: [бу́ду занима́ться]}
  - {stem: 'Не ___ на уро́к!', hint: опа́здывать / опозда́ть, accept: [опа́здывай, опа́здывайте]}
  - {stem: 'Ско́ро ма́ма ___ вку́сный у́жин.', hint: гото́вить / пригото́вить, accept: [пригото́вит]}
  - {stem: 'Ра́ньше мы ча́сто ___ ру́сские фи́льмы.', hint: смотре́ть / посмотре́ть, accept: [смотре́ли]}
  - {stem: '— Ты ___ о Москве́? — Да, коне́чно, расскажу́.', hint: расска́зывать / рассказа́ть, accept: [расска́жешь]}
  - {stem: 'Сади́тесь, пожа́луйста, и ___ чай.', hint: пить / вы́пить, accept: [пе́йте]}
  - {stem: 'Ю́ми ___ упражне́ние час, но не сде́лала.', hint: де́лать / сде́лать, accept: [де́лала]}
  - {stem: 'Вчера́ Пьер ___ ключ.', hint: теря́ть / потеря́ть, accept: [потеря́л]}
  - {stem: 'Вчера́ я ___ упражне́ние и сейча́с отдыха́ю.', hint: де́лать / сде́лать, accept: [сде́лал, сде́лала]}
  - {stem: 'В суббо́ту мы ___ на да́че.', hint: отдыха́ть, accept: [бу́дем отдыха́ть]}
  - {stem: 'Па́па, не ___ сего́дня!', hint: рабо́тать, accept: [рабо́тай]}
  - {stem: 'Обы́чно Ю́ми ___ ру́сские газе́ты.', hint: чита́ть / прочита́ть, accept: [чита́ет]}
  - {stem: 'Я ___ расска́з, и пото́м мы посмо́трим фильм.', hint: чита́ть / прочита́ть, accept: [прочита́ю]}
  - {stem: 'Ми́ша ___ уро́ки два часа́.', hint: де́лать / сде́лать, accept: [де́лал]}
  - {stem: 'Извини́те, ___, пожа́луйста, ваш а́дрес.', hint: писа́ть / написа́ть, accept: [напиши́те]}
  - {stem: 'Че́стное сло́во, за́втра я не ___!', hint: опа́здывать / опозда́ть, accept: [опозда́ю]}
  why: |
    第 1、13 题：[до́лго, час]{.ru} 和“没做完”说明是过程，用未完成体过去时 [писа́ла, де́лала]{.ru}。
    第 2、9、11 题：将来一次做成的事、对方的承诺，用完成体将来时：[дам, пригото́вит, расска́жешь]{.ru}。
    第 3、6 题：请对方做一件具体的事，用完成体命令式：对 [Ми́ша]{.ru} 用单数 [купи́]{.ru}，对老师用复数 [объясни́те]{.ru}。
    第 4、10 题：[ка́ждое у́тро, ча́сто]{.ru} 表示反复，用未完成体：现在时 [чита́ет]{.ru}，过去时 [смотре́ли]{.ru}。
    第 5、14 题：[уже́]{.ru} 和“丢了”都是结果，用完成体过去时 [вы́учил, потеря́л]{.ru}。
    第 7 题：[три часа́]{.ru} 表示持续，将来时用 [бу́ду занима́ться]{.ru}。
    第 8 题：否定命令式用未完成体；句中没有说明对谁说，单复数都可以：[Не опа́здывай / Не опа́здывайте]{.ru}。
    第 12 题：邀请对方喝茶，用未完成体命令式 [пе́йте]{.ru}，和 [сади́тесь]{.ru} 一致用复数。
    第 15 题：练习做完了才能休息，用完成体过去时；说话人性别不明，[сде́лал / сде́лала]{.ru} 都对。第 20 题：[два часа́]{.ru} 表示持续，用 [де́лал]{.ru}。
    第 16 题：[быть]{.ru} 将来时 + 未完成体不定式：[бу́дем отдыха́ть]{.ru}。
    第 17 题：否定命令式用未完成体，对爸爸说用单数 [не рабо́тай]{.ru}。第 21 题：请陌生人写下地址，是具体的结果，用完成体复数 [напиши́те]{.ru}。
    第 18 题：[обы́чно]{.ru} 表示习惯，用未完成体现在时 [чита́ет]{.ru}。
    第 19 题：读完小说再看电影，前一个动作要有结果，用 [прочита́ю]{.ru}。
    第 22 题：保证“不会迟到”，说的是将来的一次结果，用完成体 [не опозда́ю]{.ru}。
