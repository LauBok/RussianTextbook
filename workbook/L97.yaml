  why: '第 1–4 题：阳性 [весь, всего́, всему́, всем, всём]{.ru}；第四格修饰非动物名词，同第一格 [весь]{.ru}（[весь день]{.ru}）。

    第 5–7 题：中性第一格、第四格是 [всё]{.ru}（两点不能省，[все]{.ru} 是复数），其余各格同阳性。

    第 8–13 题：阴性第一格 [вся]{.ru}，第四格 [всю]{.ru}，其余四格都是 [всей]{.ru}；第 9 题 [ночь]{.ru} 是阴性，用 [вся, всю ночь]{.ru}。

    注意第五格 [всем]{.ru} 和第六格 [всём]{.ru} 只差两点；第六格前的 [в, о]{.ru} 要写成 [во всём, обо всём]{.ru}。'
