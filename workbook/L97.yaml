  why: '[ка́ждый]{.ru} 按形容词硬变化变：阳性、中性 [ка́ждого, ка́ждому, ка́ждым, ка́ждом]{.ru}，阴性 [ка́ждую]{.ru}（第四格）和 [ка́ждой]{.ru}（其余各格）。

    第 1–4、13、14 题：表示时间的第四格：阳性非动物和中性同第一格（[ка́ждый день, ка́ждое у́тро, ка́ждый ме́сяц]{.ru}），阴性 [ка́ждую неде́лю, ка́ждую зи́му]{.ru}；[зима́]{.ru} 第四格重音移到词干：[зи́му]{.ru}。第 13 题星期几前用 [в]{.ru}：[в ка́ждую суббо́ту]{.ru}。

    第 7 题：[студе́нт]{.ru} 是动物名词，第四格同第二格：[ка́ждого студе́нта]{.ru}。第 10 题：[ребёнок]{.ru} 第二格去掉 [о]{.ru}：[ребёнка]{.ru}。'
- id: L97-03
  tags:
  - весь / ка́ждый：整体与反复；весь 的形式
  task: 按句意用 [весь]{.ru} 或 [ка́ждый]{.ru} 的正确形式填空。
  type: fill
  items:
  - stem: Шёл дождь, и мы сиде́ли до́ма ___ день.
    accept:
    - весь
  - stem: Я звоню́ ма́ме ___ ве́чер.
    accept:
    - ка́ждый
  - stem: Пе́ред контро́льной мы занима́лись ___ неде́лю.
    accept:
    - всю
  - stem: Ван Лэй хо́дит в библиоте́ку ___ суббо́ту.
    accept:
    - ка́ждую
  - stem: Ми́ша спал ___ у́тро и не пошёл гуля́ть.
    accept:
    - всё
  - stem: ___ у́тро па́па пьёт ко́фе.
    accept:
    - Ка́ждое
  - stem: Э́той зимо́й Ю́ми боле́ла ___ янва́рь.
    accept:
    - весь
  - stem: Ба́бушка ___ год е́здит в Сиби́рь.
    accept:
    - ка́ждый
  - stem: Во ___ до́ме бы́ло ти́хо.
    accept:
    - всём
  - stem: Мы говори́ли обо ___.
    accept:
    - всём
  - stem: ___ студе́нт получи́л но́вый уче́бник.
    accept:
    - Ка́ждый
  - stem: ___ Москва́ бе́лая.
    accept:
    - Вся
  - stem: О́льга Ви́кторовна говори́т с ___ студе́нтом.
    accept:
    - ка́ждым
  - stem: ___ ката́ются, и ты смо́жешь.
    accept:
    - Все
  - stem: В Коло́менском ___ бы́ло бе́лое.
    accept:
    - всё
  - stem: Вчера́ я чита́л ___ ночь.
    accept:
    - всю
  why: '第 1、3、5、7、16 题：说动作持续了整个一段时间，用 [весь]{.ru}：[весь день, всю неде́лю, всё у́тро, весь янва́рь, всю ночь]{.ru}，形式跟名词的性一致。

    第 2、4、6、8 题：说动作每逢这个时间就重复一次（[звоню́, хо́дит, пьёт, е́здит]{.ru} 表示经常的动作），用 [ка́ждый]{.ru}：[ка́ждый ве́чер, ка́ждую суббо́ту, ка́ждое у́тро, ка́ждый год]{.ru}。

    第 9、10、12 题：[весь]{.ru} 的格和性：[во всём до́ме]{.ru}（[в]{.ru} 写成 [во]{.ru}），[обо всём]{.ru}，[вся Москва́]{.ru}。第 11、13 题：“每个学生”用 [ка́ждый]{.ru}，第五格 [с ка́ждым студе́нтом]{.ru}。

    第 14、15 题：单独使用：[все]{.ru}“大家”（复数，动词 [ката́ются]{.ru}），[всё]{.ru}“一切”（中性，[бы́ло]{.ru}）。'
