heading: 第 26 课　复合词与缩略词
groups:
- id: B3-L26-01
  lessons:
  - B3-L26
  tags:
  - 复合词：连接元音 -о- / -е-
  task: 把两个词根连成复合词时，中间用哪个连接元音？按连接元音归栏。
  type: classify
  bins:
  - '[-о-]{.ru}'
  - '[-е-]{.ru}'
  items:
  - text: '[пар + ход]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 轮船
  - text: '[пыль + сос]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 吸尘器
  - text: '[лёд + кол]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 破冰船
  - text: '[пеш + ход]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 行人
  - text: '[газ + прово́д]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 煤气管道
  - text: '[нефть + прово́д]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 输油管道
  - text: '[земл(я́) + трясе́ние]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 地震
  - text: '[снег + пад]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 下雪，降雪
  - text: '[сердц(е) + бие́ние]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 心跳
  - text: '[рыб(а) + лов]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 钓鱼的人
  - text: '[птиц(а) + фа́брика]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 养鸡场
  - text: '[лун(а́) + ход]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 月球车
  - text: '[сталь + вар]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 炼钢工人
  - text: '[нос + рог]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 犀牛
  - text: '[огн(ь) + туши́тель]{.ru}'
    answer: '[-е-]{.ru}'
    hint: 灭火器
  - text: '[вод(а́) + прово́д]{.ru}'
    answer: '[-о-]{.ru}'
    hint: 自来水管
  why: |-
    第 1、3、5、8、10、12、14、16 题：第一个词根以硬辅音结尾，连接元音写 [-о]{.ru}-：[парохо́д, ледоко́л]{.ru}（[ё]{.ru} 不重读变 [е]{.ru}）, [газопрово́д, снегопа́д, рыболо́в, лунохо́д, носоро́г, водопрово́д]{.ru}。
    第 2、6、7、13、15 题：第一个词根以软辅音结尾，写 [-е]{.ru}-：[пылесо́с, нефтепрово́д, землетрясе́ние, сталева́р, огнетуши́тель]{.ru}。
    第 4、9、11 题：词根以 [ж, ш, ч, щ, ц]{.ru} 结尾，也写 [-е]{.ru}-：[пешехо́д, сердцебие́ние, птицефа́брика]{.ru}。
- id: B3-L26-02
  lessons:
  - B3-L26
  tags:
  - 缩略词：性
  - 缩略词：变格与否
  task: 写出缩略词的性（m / f / n）、变不变格（写“变”或“不变”）和括号里前置词要求的第六格。
  type: matrix
  cols:
  - 缩略词
  - 性
  - 变不变格
  - 第六格
  given:
  - 0
  rows:
  - base: '[МГУ]{.ru}'
    cells:
    - '[МГУ]{.ru}'
    - m
    - 不变
    - '[в МГУ]{.ru}'
    hint: 用 в
  - base: '[вуз]{.ru}'
    cells:
    - '[вуз]{.ru}'
    - m
    - 变
    - '[в ву́зе]{.ru}'
    hint: 用 в
  - base: '[РФ]{.ru}'
    cells:
    - '[РФ]{.ru}'
    - f
    - 不变
    - '[в РФ]{.ru}'
    hint: 用 в
  - base: '[МИД]{.ru}'
    cells:
    - '[МИД]{.ru}'
    - m
    - 变
    - '[в МИ́Де]{.ru}'
    hint: 用 в
  - base: '[ЕГЭ]{.ru}'
    cells:
    - '[ЕГЭ]{.ru}'
    - m
    - 不变
    - '[о ЕГЭ]{.ru}'
    hint: 用 о
  - base: '[ГУМ]{.ru}'
    cells:
    - '[ГУМ]{.ru}'
    - m
    - 变
    - '[в ГУ́Ме]{.ru}'
    hint: 用 в
  - base: '[загс]{.ru}'
    cells:
    - '[загс]{.ru}'
    - m
    - 变
    - '[в за́гсе]{.ru}'
    hint: 用 в
  - base: '[СНГ]{.ru}'
    cells:
    - '[СНГ]{.ru}'
    - n
    - 不变
    - '[в СНГ]{.ru}'
    hint: Содру́жество Незави́симых Госуда́рств；用 в
    new: true
    gloss: 独联体
  - base: '[МКС]{.ru}'
    cells:
    - '[МКС]{.ru}'
    - f
    - 不变
    - '[на МКС]{.ru}'
    hint: Междунаро́дная косми́ческая ста́нция；用 на
    new: true
    gloss: 国际空间站
  - base: '[МХАТ]{.ru}'
    cells:
    - '[МХАТ]{.ru}'
    - m
    - 变
    - '[во МХА́Те]{.ru}'
    hint: Моско́вский худо́жественный теа́тр；用 в
    new: true
    gloss: 莫斯科艺术剧院
  - base: '[универма́г]{.ru}'
    cells:
    - '[универма́г]{.ru}'
    - m
    - 变
    - '[в универма́ге]{.ru}'
    hint: 用 в
  - base: '[зарпла́та]{.ru}'
    cells:
    - '[зарпла́та]{.ru}'
    - f
    - 变
    - '[о зарпла́те]{.ru}'
    hint: 用 о
  - base: '[физкульту́ра]{.ru}'
    cells:
    - '[физкульту́ра]{.ru}'
    - f
    - 变
    - '[на физкульту́ре]{.ru}'
    hint: 用 на
  - base: '[медсестра́]{.ru}'
    cells:
    - '[медсестра́]{.ru}'
    - f
    - 变
    - '[о медсестре́]{.ru}'
    hint: 用 о
  why: |-
    第 1、3、8、9 题：按字母名称读的缩略词不变格，性由全称的主要词决定：[МГУ]{.ru}（[университе́т]{.ru}）阳性，[РФ]{.ru}（[федера́ция]{.ru}）阴性，[СНГ]{.ru}（[содру́жество]{.ru}）中性，[МКС]{.ru}（[ста́нция]{.ru}）阴性。不写 [в МГУе]{.ru}。
    第 5 题：[ЕГЭ]{.ru} 按单词读，但以元音结尾，也不变格；主要词是 [экза́мен]{.ru}，阳性：[о ЕГЭ]{.ru}。
    第 2、4、6、7、10 题：以辅音结尾、按单词读的缩略词作阳性名词变格；大写的词尾用小写，不加连字符：[в ву́зе, в МИ́Де, в ГУ́Ме, в за́гсе, во МХА́Те]{.ru}（[в]{.ru} 在 [мх]{.ru} 前写成 [во]{.ru}）。
    第 11–14 题：由词的开头部分组成的缩略词已经是普通的词，按词尾定性并正常变格：[в универма́ге, о зарпла́те, на физкульту́ре, о медсестре́]{.ru}。
- id: B3-L26-03
  lessons:
  - B3-L26
  tags:
  - 缩略词：与谓语的一致
  task: 用括号里的主语和动词写出过去时谓语。
  type: matrix
  cols:
  - 主语 + 动词
  - 过去时谓语
  given:
  - 0
  rows:
  - base: '[МГУ]{.ru} + [основа́ть]{.ru} (短尾)'
    cells:
    - '[МГУ]{.ru} + [основа́ть]{.ru} (短尾)'
    - '[был осно́ван]{.ru}'
  - base: '[РФ + подписа́ть догово́р]{.ru}'
    cells:
    - '[РФ + подписа́ть догово́р]{.ru}'
    - '[подписа́ла]{.ru}'
  - base: '[МИД + сообщи́ть]{.ru}'
    cells:
    - '[МИД + сообщи́ть]{.ru}'
    - '[сообщи́л]{.ru}'
  - base: '[СНГ + появи́ться в 1991 году́]{.ru}'
    cells:
    - '[СНГ + появи́ться в 1991 году́]{.ru}'
    - '[появи́лось]{.ru}'
  - base: '[ЕГЭ + пройти́ хорошо́]{.ru}'
    cells:
    - '[ЕГЭ + пройти́ хорошо́]{.ru}'
    - '[прошёл]{.ru}'
  - base: '[МКС + пролете́ть над Москво́й]{.ru}'
    cells:
    - '[МКС + пролете́ть над Москво́й]{.ru}'
    - '[пролете́ла]{.ru}'
  - base: '[ГУМ + откры́ться по́сле ремо́нта]{.ru}'
    cells:
    - '[ГУМ + откры́ться по́сле ремо́нта]{.ru}'
    - '[откры́лся]{.ru}'
  - base: '[вуз + получи́ть де́ньги]{.ru}'
    cells:
    - '[вуз + получи́ть де́ньги]{.ru}'
    - '[получи́л]{.ru}'
  - base: '[зарпла́та + вы́расти]{.ru}'
    cells:
    - '[зарпла́та + вы́расти]{.ru}'
    - '[вы́росла]{.ru}'
  - base: '[медсестра́ + прийти́]{.ru}'
    cells:
    - '[медсестра́ + прийти́]{.ru}'
    - '[пришла́]{.ru}'
  why: |-
    第 1 题：[МГУ]{.ru} 的主要词是 [университе́т]{.ru}，阳性：[был осно́ван]{.ru}，不写 [осно́вана]{.ru}。
    第 2、6 题：[РФ]{.ru}（[федера́ция]{.ru}）、[МКС]{.ru}（[ста́нция]{.ru}）是阴性：[подписа́ла, пролете́ла]{.ru}。
    第 3、5 题：[МИД]{.ru}（[министе́рство]{.ru} 本是中性，但按单词读、以辅音结尾的缩略词作阳性用）、[ЕГЭ]{.ru}（[экза́мен]{.ru}）用阳性：[сообщи́л, прошёл]{.ru}。
    第 4 题：[СНГ]{.ru} 的主要词 [содру́жество]{.ru} 是中性：[появи́лось]{.ru}。
    第 7、8 题：[ГУМ, вуз]{.ru} 按阳性名词用：[откры́лся, получи́л]{.ru}。
    第 9、10 题：[зарпла́та, медсестра́]{.ru} 是普通阴性名词：[вы́росла, пришла́]{.ru}。
