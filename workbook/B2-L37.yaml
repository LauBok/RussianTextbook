heading: 第 37 课　定向与不定向运动动词
groups:
- id: B2-L37-01
  tags:
  - 运动动词变位：自身移动五对
  task: 写出动词的现在时和过去时。
  type: matrix
  cols:
  - 动词
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  - 过去时阳性
  - 过去时阴性
  given:
  - 0
  rows:
  - base: '[идти́]{.ru}'
    cells:
    - '[идти́]{.ru}'
    - '[иду́]{.ru}'
    - '[идёшь]{.ru}'
    - '[иду́т]{.ru}'
    - '[шёл]{.ru}'
    - '[шла]{.ru}'
  - base: '[ходи́ть]{.ru}'
    cells:
    - '[ходи́ть]{.ru}'
    - '[хожу́]{.ru}'
    - '[хо́дишь]{.ru}'
    - '[хо́дят]{.ru}'
    - '[ходи́л]{.ru}'
    - '[ходи́ла]{.ru}'
  - base: '[е́хать]{.ru}'
    cells:
    - '[е́хать]{.ru}'
    - '[е́ду]{.ru}'
    - '[е́дешь]{.ru}'
    - '[е́дут]{.ru}'
    - '[е́хал]{.ru}'
    - '[е́хала]{.ru}'
  - base: '[е́здить]{.ru}'
    cells:
    - '[е́здить]{.ru}'
    - '[е́зжу]{.ru}'
    - '[е́здишь]{.ru}'
    - '[е́здят]{.ru}'
    - '[е́здил]{.ru}'
    - '[е́здила]{.ru}'
  - base: '[бежа́ть]{.ru}'
    cells:
    - '[бежа́ть]{.ru}'
    - '[бегу́]{.ru}'
    - '[бежи́шь]{.ru}'
    - '[бегу́т]{.ru}'
    - '[бежа́л]{.ru}'
    - '[бежа́ла]{.ru}'
  - base: '[бе́гать]{.ru}'
    cells:
    - '[бе́гать]{.ru}'
    - '[бе́гаю]{.ru}'
    - '[бе́гаешь]{.ru}'
    - '[бе́гают]{.ru}'
    - '[бе́гал]{.ru}'
    - '[бе́гала]{.ru}'
  - base: '[лете́ть]{.ru}'
    cells:
    - '[лете́ть]{.ru}'
    - '[лечу́]{.ru}'
    - '[лети́шь]{.ru}'
    - '[летя́т]{.ru}'
    - '[лете́л]{.ru}'
    - '[лете́ла]{.ru}'
  - base: '[лета́ть]{.ru}'
    cells:
    - '[лета́ть]{.ru}'
    - '[лета́ю]{.ru}'
    - '[лета́ешь]{.ru}'
    - '[лета́ют]{.ru}'
    - '[лета́л]{.ru}'
    - '[лета́ла]{.ru}'
  - base: '[плыть]{.ru}'
    cells:
    - '[плыть]{.ru}'
    - '[плыву́]{.ru}'
    - '[плывёшь]{.ru}'
    - '[плыву́т]{.ru}'
    - '[плыл]{.ru}'
    - '[плыла́]{.ru}'
  - base: '[пла́вать]{.ru}'
    cells:
    - '[пла́вать]{.ru}'
    - '[пла́ваю]{.ru}'
    - '[пла́ваешь]{.ru}'
    - '[пла́вают]{.ru}'
    - '[пла́вал]{.ru}'
    - '[пла́вала]{.ru}'
  why: |-
    第 1 题：[идти́]{.ru} 过去时换词干：[шёл, шла]{.ru}。
    第 2、4 题：第二变位，[я]{.ru} 有交替：[д → ж]{.ru}（[хожу́]{.ru}），[зд → зж]{.ru}（[е́зжу]{.ru}）；[ходи́ть]{.ru} 的重音 [я]{.ru} 在词尾、其余前移：[хожу́ — хо́дишь]{.ru}。
    第 3 题：[е́хать]{.ru} 现在时词干是 [е́д-]{.ru}：[е́ду, е́дешь]{.ru}，不能写成 [е́хаю]{.ru}。
    第 5 题：[бежа́ть]{.ru} 不规则：[я]{.ru} 和 [они́]{.ru} 用 [бег-]{.ru} 加第一变位词尾（[бегу́, бегу́т]{.ru}），其余用 [беж-]{.ru} 加第二变位词尾（[бежи́шь]{.ru}）。[они́]{.ru} 不写 [бежа́т]{.ru}。
    第 7 题：[лете́ть]{.ru} 第二变位，[я]{.ru} 有 [т → ч]{.ru}：[лечу́]{.ru}，[они́]{.ru} 用 [-я́т]{.ru}：[летя́т]{.ru}。
    第 9 题：[плыть]{.ru} 现在时词干 [плыв-]{.ru}：[плыву́, плывёшь]{.ru}；过去时阴性重音在词尾：[плыла́]{.ru}。
    第 6、8、10 题：三个不定向动词都像 [чита́ть]{.ru} 一样变，重音不动：[бе́гаю, лета́ю, пла́ваю]{.ru}。
- id: B2-L37-02
  tags:
  - 定向与不定向：意义
  task: 按运动动词在句中的意义把句子归栏。
  type: classify
  bins:
  - 此刻朝一个方向
  - 过去某时正在路上
  - 经常、多次
  - 去过一趟（已回来）
  - 没有固定方向
  - 会、能
  items:
  - text: '[Смотри́, вон бежи́т Ми́ша!]{.ru}'
    answer: 此刻朝一个方向
  - text: '[Наш самолёт сейча́с лети́т в Каза́нь.]{.ru}'
    answer: 此刻朝一个方向
  - text: '[Смотри́, по реке́ плывёт теплохо́д!]{.ru}'
    answer: 此刻朝一个方向
  - text: '[Когда́ я бежа́л на уро́к, я уви́дел О́льгу Ви́кторовну.]{.ru}'
    answer: 过去某时正在路上
  - text: '[Когда́ мы лете́ли в Пеки́н, я спал.]{.ru}'
    answer: 过去某时正在路上
  - text: '[Когда́ Ди́ма шёл домо́й, он встре́тил А́нну.]{.ru}'
    answer: 过去某时正在路上
  - text: '[Ю́ми ча́сто лета́ет домо́й в То́кио.]{.ru}'
    answer: 经常、多次
  - text: '[Ка́ждую суббо́ту мы е́здим на да́чу.]{.ru}'
    answer: 经常、多次
  - text: '[Ми́ша ка́ждый день хо́дит в шко́лу пешко́м.]{.ru}'
    answer: 经常、多次
  - text: '[В воскресе́нье мы е́здили в Каза́нь.]{.ru}'
    answer: 去过一趟（已回来）
  - text: '[Вчера́ А́нна ходи́ла в теа́тр.]{.ru}'
    answer: 去过一趟（已回来）
  - text: '[В ма́е Пьер лета́л в Пари́ж.]{.ru}'
    answer: 去过一趟（已回来）
  - text: '[Над реко́й лета́ют пти́цы.]{.ru}'
    answer: 没有固定方向
  - text: '[Де́ти бе́гают по двору́.]{.ru}'
    answer: 没有固定方向
  - text: '[Ло́дки пла́вают по о́зеру.]{.ru}'
    answer: 没有固定方向
  - text: '[Ми́ша о́чень хорошо́ пла́вает.]{.ru}'
    answer: 会、能
  - text: '[Пингви́ны не лета́ют.]{.ru}'
    answer: 会、能
    new: true
    gloss: 企鹅
  - text: '[Ребёнок уже́ хо́дит.]{.ru}'
    answer: 会、能
  why: |-
    第 1–3 题：[вон, сейча́с, смотри́]{.ru} 说明动作就在眼前，朝一个方向：用定向动词现在时 [бежи́т, лети́т, плывёт]{.ru}。
    第 4–6 题：[когда́]{.ru} 从句说过去某一时刻正在路上，另一件事这时发生：用定向动词过去时 [бежа́л, лете́ли, шёл]{.ru}。
    第 7–9 题：[ча́сто, ка́ждую суббо́ту, ка́ждый день]{.ru} 表示反复往返：用不定向动词现在时。
    第 10–12 题：不定向动词过去时说一次去了又回来，等于 [был]{.ru}：[е́здили в Каза́нь = бы́ли в Каза́ни]{.ru}。容易和第 4–6 题混：那里是“在路上”，这里是“去过”。
    第 13–15 题：[над реко́й, по двору́, по о́зеру]{.ru} 没有终点，到处移动：用不定向动词。
    第 16–18 题：说会不会、能不能做这种动作（游泳、飞、走路），不说去哪儿：用不定向动词。
- id: B2-L37-03
  tags:
  - 交通工具作主语
  task: 写出主语后面运动动词的现在时和过去时。
  type: matrix
  cols:
  - 主语
  - 现在时
  - 过去时
  given:
  - 0
  rows:
  - base: '[по́езд]{.ru}'
    cells:
    - '[по́езд]{.ru}'
    - '[идёт]{.ru}'
    - '[шёл]{.ru}'
  - base: '[авто́бус]{.ru}'
    cells:
    - '[авто́бус]{.ru}'
    - '[идёт]{.ru}'
    - '[шёл]{.ru}'
  - base: '[самолёт]{.ru}'
    cells:
    - '[самолёт]{.ru}'
    - '[лети́т]{.ru}'
    - '[лете́л]{.ru}'
  - base: '[теплохо́д]{.ru}'
    cells:
    - '[теплохо́д]{.ru}'
    - '[плывёт (идёт)]{.ru}'
    - '[плыл (шёл)]{.ru}'
  - base: '[ло́дка]{.ru}'
    cells:
    - '[ло́дка]{.ru}'
    - '[плывёт]{.ru}'
    - '[плыла́]{.ru}'
  - base: '[трамва́й]{.ru}'
    cells:
    - '[трамва́й]{.ru}'
    - '[идёт]{.ru}'
    - '[шёл]{.ru}'
    hint: m
    new: true
    gloss: 有轨电车
  - base: '[Ди́ма на по́езде]{.ru}'
    cells:
    - '[Ди́ма на по́езде]{.ru}'
    - '[е́дет]{.ru}'
    - '[е́хал]{.ru}'
  - base: '[А́нна на авто́бусе]{.ru}'
    cells:
    - '[А́нна на авто́бусе]{.ru}'
    - '[е́дет]{.ru}'
    - '[е́хала]{.ru}'
  - base: '[мы на самолёте]{.ru}'
    cells:
    - '[мы на самолёте]{.ru}'
    - '[лети́м]{.ru}'
    - '[лете́ли]{.ru}'
  - base: '[Пьер на теплохо́де]{.ru}'
    cells:
    - '[Пьер на теплохо́де]{.ru}'
    - '[плывёт]{.ru}'
    - '[плыл]{.ru}'
  - base: '[тури́сты на ло́дке]{.ru}'
    cells:
    - '[тури́сты на ло́дке]{.ru}'
    - '[плыву́т]{.ru}'
    - '[плы́ли]{.ru}'
  - base: '[ма́ма на такси́]{.ru}'
    cells:
    - '[ма́ма на такси́]{.ru}'
    - '[е́дет]{.ru}'
    - '[е́хала]{.ru}'
  why: |-
    第 1、2、6 题：火车、汽车、电车本身移动用 [идти́]{.ru}：[по́езд идёт, авто́бус шёл]{.ru}。不说 [по́езд е́дет]{.ru}。
    第 3 题：飞机用 [лете́ть]{.ru}：[самолёт лети́т]{.ru}。
    第 4、5 题：船用 [плыть]{.ru}：[теплохо́д плывёт]{.ru}；大船也可以用 [идти́]{.ru}：[теплохо́д идёт]{.ru}。[плыла́]{.ru} 重音在词尾。
    第 7、8、12 题：人坐车用 [е́хать]{.ru}：[Ди́ма е́дет на по́езде]{.ru}。主语换成人，动词也跟着换：火车 [идёт]{.ru}，坐火车的人 [е́дет]{.ru}。
    第 9 题：人坐飞机常用 [лете́ть]{.ru}：[мы лети́м]{.ru}。
    第 10、11 题：人坐船用 [плыть]{.ru}：[Пьер плывёт, тури́сты плыву́т]{.ru}；复数过去时 [плы́ли]{.ru}。
- id: B2-L37-04
  tags:
  - 定向与不定向：句中
  task: 从括号里的一对动词中选一个，写出合适的形式。
  type: fill
  items:
  - stem: — Куда́ ты так бы́стро ___? — На авто́бус!
    hint: бежа́ть / бе́гать
    accept:
    - бежи́шь
  - stem: По утра́м па́па ___ в па́рке.
    hint: бежа́ть / бе́гать
    accept:
    - бе́гает
  - stem: Ле́том мы ___ в Каза́нь к ба́бушке, а в сентябре́ верну́лись.
    hint: лете́ть / лета́ть
    accept:
    - лета́ли
  - stem: Когда́ мы ___ над Во́лгой, я смотре́л в окно́.
    hint: лете́ть / лета́ть
    accept:
    - лете́ли
  - stem: Смотри́, над на́ми ___ самолёт!
    hint: лете́ть / лета́ть
    accept:
    - лети́т
  - stem: Мой брат не уме́ет ___ .
    hint: плыть / пла́вать
    accept:
    - пла́вать
  - stem: Мы сиде́ли в ло́дке и ___ к о́строву.
    hint: плыть / пла́вать
    accept:
    - плы́ли
    new: true
    gloss: 岛
  - stem: В бассе́йне де́ти ___ це́лый час.
    hint: плыть / пла́вать
    accept:
    - пла́вали
  - stem: Мари́я Никола́евна ка́ждый день ___ на рабо́ту на метро́.
    hint: е́хать / е́здить
    accept:
    - е́здит
  - stem: — Где ты была́ вчера́? — Я ___ к подру́ге.
    hint: идти́ / ходи́ть
    accept:
    - ходи́ла
  - stem: Сейча́с А́нна ___ на по́езде в Петербу́рг.
    hint: е́хать / е́здить
    accept:
    - е́дет
  - stem: Смотри́, по у́лице ___ трамва́й.
    hint: идти́ / ходи́ть
    accept:
    - идёт
  - stem: Де́ти ве́село ___ по са́ду.
    hint: бежа́ть / бе́гать
    accept:
    - бе́гали
    - бе́гают
  - stem: Когда́ я ___ домо́й, я встре́тил Пье́ра.
    hint: идти́ / ходи́ть
    accept:
    - шёл
  why: |-
    第 1、5、11、12 题：此刻朝一个方向，用定向动词现在时：[бежи́шь, лети́т, е́дет, идёт]{.ru}。
    第 4、14 题：过去某时正在路上，同时发生另一件事，用定向动词过去时：[лете́ли, шёл]{.ru}。第 7 题“坐在船里朝岛划去”也是那一次的过程：[плы́ли]{.ru}。
    第 3、10 题：去了又回来，用不定向动词过去时：[лета́ли, ходи́ла]{.ru}（说话人是女性，句中 [была́]{.ru} 已经表明）。
    第 2、9 题：经常、每天，用不定向动词现在时：[бе́гает, е́здит]{.ru}。
    第 6 题：会不会游泳，用不定向动词：[уме́ет пла́вать]{.ru}。
    第 8、13 题：在一个地方来回游、跑，没有方向：[пла́вали, бе́гали]{.ru}；第 13 题现在时 [бе́гают]{.ru} 也对。
