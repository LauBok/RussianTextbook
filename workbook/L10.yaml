  why: |-
    第 1、3、5、7 题：第一变位 [-ю, -ешь, -ет, -ем, -ете, -ют]{.ru}：[де́лаю, понима́ешь, разгова́ривают, гуля́ют]{.ru}。
    第 8、10 题：第二变位 [-ю, -ишь, -ит, -им, -ите, -ят]{.ru}：[говорю́, говоря́т]{.ru}；[звоню́, звони́шь, звоня́т]{.ru}。
    第 2 题：[смотре́ть]{.ru}：[смотрю́]{.ru}，从 [ты]{.ru} 起重音在词干：[смо́тришь … смо́трят]{.ru}。
    第 6 题：[лежа́ть]{.ru}：[ж]{.ru} 后写 [у, а]{.ru}：[лежу́, лежа́т]{.ru}。
    第 4 题：[спать]{.ru}：只有 [сплю]{.ru} 多一个 [л]{.ru}。
    第 9 题：[ви́деть]{.ru} 只有第一人称 [д]{.ru} 变 [ж]{.ru}：[ви́жу]{.ru}；其余 [ви́дишь … ви́дят]{.ru}，生词表给出的两个形式就是提示。
- id: L10-03
  tags:
  - 单元复习：动词变位类型归类
  recycles:
  - L07-02
  task: 按变位类型把动词归类。
  type: classify
  bins:
  - 第一变位
  - 第二变位
  items:
  - text: '[чита́ть]{.ru}'
    answer: 第一变位
  - text: '[говори́ть]{.ru}'
    answer: 第二变位
  - text: '[понима́ть]{.ru}'
    answer: 第一变位
  - text: '[смотре́ть]{.ru}'
    answer: 第二变位
  - text: '[лежа́ть]{.ru}'
    answer: 第二变位
  - text: '[гуля́ть]{.ru}'
    answer: 第一变位
  - text: '[стоя́ть]{.ru}'
    answer: 第二变位
  - text: '[знать]{.ru}'
    answer: 第一变位
  - text: '[спать]{.ru}'
    answer: 第二变位
  - text: '[слу́шать]{.ru}'
    answer: 第一变位
  - text: '[звони́ть]{.ru}'
    answer: 第二变位
  - text: '[отдыха́ть]{.ru}'
    answer: 第一变位
  - text: '[ви́деть]{.ru}'
    answer: 第二变位
  - text: '[разгова́ривать]{.ru}'
    answer: 第一变位
  - text: '[рабо́тать]{.ru}'
    answer: 第一变位
  - text: '[игра́ть]{.ru}'
    answer: 第一变位
  why: |-
    第 1、6、8、10、12、15、16 题：第一变位：[чита́ешь, гуля́ешь, зна́ешь, слу́шаешь, отдыха́ешь, рабо́таешь, игра́ешь]{.ru}，词尾元音是 [е]{.ru}。
    第 3、14 题：[понима́ть, разгова́ривать]{.ru} 也是第一变位：[понима́ешь, разгова́ривают]{.ru}。
    第 2、4、11、13 题：[-ить, -еть]{.ru} 的这几个是第二变位：[говори́шь, смо́тришь, звони́шь, ви́дишь]{.ru}。
    第 5、7、9 题：[лежа́ть, стоя́ть, спать]{.ru} 不定式像第一变位，却是第二变位：[лежи́шь, стои́шь, спишь]{.ru}。这几个最容易归错。
- id: L10-04
  tags:
  - 单元复习：主谓一致（动词、形容词谓语）
  recycles:
  - L06-03
  - L07-04
  - L09-03
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: На́ши студе́нты ___ по-ру́сски.
    hint: говори́ть
    accept:
    - говоря́т
  - stem: Моя́ ко́мната ___.
    hint: све́тлый
    accept:
    - све́тлая
  - stem: Твои́ очки́ ___ тут.
    hint: лежа́ть
    accept:
    - лежа́т
  - stem: Окно́ ___.
    hint: ма́ленький
    accept:
    - ма́ленькое
  - stem: Ми́ша и А́нна ___ телеви́зор.
    hint: смотре́ть
    accept:
    - смо́трят
  - stem: Ты и Пьер ___ по-францу́зски?
    hint: говори́ть
    accept:
    - говори́те
  - stem: Кремль о́чень ___.
    hint: ста́рый
    accept:
    - ста́рый
  - stem: Пло́щадь ___.
    hint: краси́вый
    accept:
    - краси́вая
  - stem: Мои́ роди́тели ___ ве́чером.
    hint: гуля́ть
    accept:
    - гуля́ют
  - stem: Не́бо ___.
    hint: си́ний
    accept:
    - си́нее
  - stem: Па́па ___.
    hint: спать
    accept:
    - спит
  - stem: Его́ кни́ги ___.
    hint: интере́сный
    accept:
    - интере́сные
  - stem: Я ___ Кремль.
    hint: ви́деть
    accept:
    - ви́жу
  - stem: Кто ___?
    hint: звони́ть
    accept:
    - звони́т
  - stem: Пьер и я ___ рома́н.
    hint: чита́ть
    accept:
    - чита́ем
  - stem: Наш па́па ___.
    hint: хоро́ший
    accept:
    - хоро́ший
  - stem: Ива́н Серге́евич, вы ___?
    hint: понима́ть
    accept:
    - понима́ете
  - stem: Ва́ша ко́шка ___.
    hint: ма́ленький
    accept:
    - ма́ленькая
  why: |-
    第 1、3、5、9、11、13 题：动词和主语的人称、数一致：复数名词用第三人称复数 [говоря́т, лежа́т, смо́трят, гуля́ют]{.ru}，单数名词用 [спит]{.ru}，[я]{.ru} 用 [ви́жу]{.ru}。
    第 6、17 题：[ты и Пьер]{.ru} 合起来是 [вы]{.ru}；对一个人用 [вы]{.ru} 也一样：[говори́те, понима́ете]{.ru}。
    第 15 题：[Пьер и я]{.ru} 合起来是 [мы]{.ru}：[чита́ем]{.ru}。
    第 14 题：[кто]{.ru} 配第三人称单数：[звони́т]{.ru}。
    第 2、4、7、10、12、18 题：形容词作谓语和主语的性数一致：[све́тлая, ма́ленькое, ста́рый, си́нее, интере́сные, ма́ленькая]{.ru}。
    第 8 题：[пло́щадь]{.ru} 是阴性：[краси́вая]{.ru}。
    第 16 题：[па́па]{.ru} 是阳性：[хоро́ший]{.ru}。
- id: L10-05
  tags:
  - 单元复习：主谓一致核查
  recycles:
  - L06-04
  - L07-03
  - L08-04
  task: 每句有一处错误，写出改正后的词。
  type: matrix
  cols:
  - 有错的句子
  - 改正的词
  given:
  - 0
  rows:
  - base: '[Мои́ роди́тели рабо́тает.]{.ru}'
    cells:
    - '[Мои́ роди́тели рабо́тает.]{.ru}'
    - '[рабо́тают]{.ru}'
  - base: '[Моя́ ко́мната све́тлый.]{.ru}'
    cells:
    - '[Моя́ ко́мната све́тлый.]{.ru}'
    - '[све́тлая]{.ru}'
  - base: '[А́нна говоря́т ме́дленно.]{.ru}'
    cells:
    - '[А́нна говоря́т ме́дленно.]{.ru}'
    - '[говори́т]{.ru}'
  - base: '[Па́па, где твоя́ очки́?]{.ru}'
    cells:
    - '[Па́па, где твоя́ очки́?]{.ru}'
    - '[твои́]{.ru}'
  - base: '[Его́ кни́га интере́сный.]{.ru}'
    cells:
    - '[Его́ кни́га интере́сный.]{.ru}'
    - '[интере́сная]{.ru}'
  - base: '[Мы смо́трят фильм.]{.ru}'
    cells:
    - '[Мы смо́трят фильм.]{.ru}'
    - '[смо́трим]{.ru}'
  - base: '[Ты и А́нна гуля́ешь?]{.ru}'
    cells:
    - '[Ты и А́нна гуля́ешь?]{.ru}'
    - '[гуля́ете]{.ru}'
  - base: '[Окно́ большо́й.]{.ru}'
    cells:
    - '[Окно́ большо́й.]{.ru}'
    - '[большо́е]{.ru}'
  - base: '[Чья э́то фо́то?]{.ru}'
    cells:
    - '[Чья э́то фо́то?]{.ru}'
    - '[Чьё]{.ru}'
  - base: '[Ми́ша и Пьер игра́ет.]{.ru}'
    cells:
    - '[Ми́ша и Пьер игра́ет.]{.ru}'
    - '[игра́ют]{.ru}'
  - base: '[Не́бо си́ний.]{.ru}'
    cells:
    - '[Не́бо си́ний.]{.ru}'
    - '[си́нее]{.ru}'
  - base: '[Я ви́дю Кремль.]{.ru}'
    cells:
    - '[Я ви́дю Кремль.]{.ru}'
    - '[ви́жу]{.ru}'
  - base: '[Ива́н Серге́евич, вы спишь?]{.ru}'
    cells:
    - '[Ива́н Серге́евич, вы спишь?]{.ru}'
    - '[спи́те]{.ru}'
  - base: '[Они́ лежя́т.]{.ru}'
    cells:
    - '[Они́ лежя́т.]{.ru}'
    - '[лежа́т]{.ru}'
  why: |-
    第 1、3、6、10 题：动词没有和主语一致：复数主语 [рабо́тают, игра́ют]{.ru}，单数 [говори́т]{.ru}，[мы смо́трим]{.ru}。
    第 7、13 题：[вы]{.ru}（包括“你和安娜”、对一个人的尊称）用 [-ете / -ите]{.ru}：[гуля́ете, спи́те]{.ru}。
    第 2、5、8、11 题：形容词谓语没有和主语的性一致：[све́тлая, интере́сная, большо́е, си́нее]{.ru}。
    第 4、9 题：物主代词、[чей]{.ru} 没有和名词一致：[твои́ очки́, Чьё … фо́то]{.ru}。
    第 12、14 题：动词形式本身写错：[ви́жу]{.ru}（[д]{.ru} 变 [ж]{.ru}），[лежа́т]{.ru}（[ж]{.ru} 后写 [а]{.ru}）。
