  - base: '[сын]{.ru}'
    cells:
    - '[сын]{.ru}'
    - m
    - '[сыновья́]{.ru}'
  why: |-
    第 1、7、10、14 题：[-а]{.ru}、[-я]{.ru} 结尾的是阴性；复数 [-ы]{.ru} 或 [-и]{.ru}：[ла́мпы]{.ru}，[фами́лии]{.ru}，[к, г]{.ru} 后写 [и]{.ru}：[кни́ги, ре́ки]{.ru}（[ре́ки]{.ru} 重音前移）。
    第 2、4、9、15 题：[-ь]{.ru} 结尾的性要记：[слова́рь]{.ru} 阳性，[тетра́дь, крова́ть, пло́щадь]{.ru} 阴性；复数都改 [-и]{.ru}，[словари́]{.ru} 重音在词尾。
    第 3、8、12 题：[-о]{.ru} 结尾的是中性，复数 [-а]{.ru}：[кре́сла]{.ru}；[о́кна, пи́сьма]{.ru} 重音前移。
    第 5 题：[па́па]{.ru} 指男人，是阳性；复数按词尾 [-а → -ы]{.ru}：[па́пы]{.ru}。
    第 6 题：辅音结尾的是阳性；[ч]{.ru} 后写 [и]{.ru}：[ключи́]{.ru}。
    第 11、16 题：阳性，复数特殊：[дома́, сыновья́]{.ru}。
    第 13 题：[фо́то]{.ru} 是中性，不变格，复数不变。
