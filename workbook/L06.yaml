heading: 第 6 课　第一变位现在时
groups:
- id: L06-01
  tags:
  - 第一变位现在时：六个人称
  task: 写出第一变位动词的六个现在时人称形式。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[он / она́]{.ru}'
  - '[мы]{.ru}'
  - '[вы]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[чита́ть]{.ru}'
    cells:
    - '[чита́ть]{.ru}'
    - '[чита́ю]{.ru}'
    - '[чита́ешь]{.ru}'
    - '[чита́ет]{.ru}'
    - '[чита́ем]{.ru}'
    - '[чита́ете]{.ru}'
    - '[чита́ют]{.ru}'
  - base: '[гуля́ть]{.ru}'
    cells:
    - '[гуля́ть]{.ru}'
    - '[гуля́ю]{.ru}'
    - '[гуля́ешь]{.ru}'
    - '[гуля́ет]{.ru}'
    - '[гуля́ем]{.ru}'
    - '[гуля́ете]{.ru}'
    - '[гуля́ют]{.ru}'
  - base: '[знать]{.ru}'
    cells:
    - '[знать]{.ru}'
    - '[зна́ю]{.ru}'
    - '[зна́ешь]{.ru}'
    - '[зна́ет]{.ru}'
    - '[зна́ем]{.ru}'
    - '[зна́ете]{.ru}'
    - '[зна́ют]{.ru}'
  - base: '[отвеча́ть]{.ru}'
    cells:
    - '[отвеча́ть]{.ru}'
    - '[отвеча́ю]{.ru}'
    - '[отвеча́ешь]{.ru}'
    - '[отвеча́ет]{.ru}'
    - '[отвеча́ем]{.ru}'
    - '[отвеча́ете]{.ru}'
    - '[отвеча́ют]{.ru}'
    new: true
    gloss: 回答
  - base: '[обе́дать]{.ru}'
    cells:
    - '[обе́дать]{.ru}'
    - '[обе́даю]{.ru}'
    - '[обе́даешь]{.ru}'
    - '[обе́дает]{.ru}'
    - '[обе́даем]{.ru}'
    - '[обе́даете]{.ru}'
    - '[обе́дают]{.ru}'
    new: true
    gloss: 吃午饭
  - base: '[у́жинать]{.ru}'
    cells:
    - '[у́жинать]{.ru}'
    - '[у́жинаю]{.ru}'
    - '[у́жинаешь]{.ru}'
    - '[у́жинает]{.ru}'
    - '[у́жинаем]{.ru}'
    - '[у́жинаете]{.ru}'
    - '[у́жинают]{.ru}'
    new: true
    gloss: 吃晚饭
  - base: '[повторя́ть]{.ru}'
    cells:
    - '[повторя́ть]{.ru}'
    - '[повторя́ю]{.ru}'
    - '[повторя́ешь]{.ru}'
    - '[повторя́ет]{.ru}'
    - '[повторя́ем]{.ru}'
    - '[повторя́ете]{.ru}'
    - '[повторя́ют]{.ru}'
    new: true
    gloss: 重复，复习
  - base: '[понима́ть]{.ru}'
    cells:
    - '[понима́ть]{.ru}'
    - '[понима́ю]{.ru}'
    - '[понима́ешь]{.ru}'
    - '[понима́ет]{.ru}'
    - '[понима́ем]{.ru}'
    - '[понима́ете]{.ru}'
    - '[понима́ют]{.ru}'
    new: true
    gloss: 懂，明白
  - base: '[опа́здывать]{.ru}'
    cells:
    - '[опа́здывать]{.ru}'
    - '[опа́здываю]{.ru}'
    - '[опа́здываешь]{.ru}'
    - '[опа́здывает]{.ru}'
    - '[опа́здываем]{.ru}'
    - '[опа́здываете]{.ru}'
    - '[опа́здывают]{.ru}'
    new: true
    gloss: 迟到
  - base: '[теря́ть]{.ru}'
    cells:
    - '[теря́ть]{.ru}'
    - '[теря́ю]{.ru}'
    - '[теря́ешь]{.ru}'
    - '[теря́ет]{.ru}'
    - '[теря́ем]{.ru}'
    - '[теря́ете]{.ru}'
    - '[теря́ют]{.ru}'
    new: true
    gloss: 丢失
  why: |-
    第 1、4–6、8、9 题：去掉 [-ть]{.ru}，词干以元音 [а]{.ru} 结尾，依次加 [-ю, -ешь, -ет, -ем, -ете, -ют]{.ru}：[отвеча́ю, отвеча́ешь, отвеча́ют]{.ru}。重音和不定式在同一个音节，[у́жинаю, опа́здываю]{.ru} 重音都在前面。
    第 2、7、10 题：[-ять]{.ru} 动词一样：[гуля́ю, гуля́ешь, гуля́ют]{.ru}，[повторя́ю, теря́ю]{.ru}。
    第 3 题：[знать]{.ru} 只有一个音节，变位后的形式重音都落在 [а]{.ru} 上：[зна́ю, зна́ешь, зна́ют]{.ru}。
- id: L06-02
  tags:
  - 第一变位现在时：按给定人称变位
  task: 按括号里的代词写出动词的现在时形式（各人称混合）。
  type: matrix
  cols:
  - 代词＋不定式
  - 现在时
  given:
  - 0
  rows:
  - base: '[ты + отдыха́ть]{.ru}'
    cells:
    - '[ты + отдыха́ть]{.ru}'
    - '[отдыха́ешь]{.ru}'
  - base: '[они́ + слу́шать]{.ru}'
    cells:
    - '[они́ + слу́шать]{.ru}'
    - '[слу́шают]{.ru}'
  - base: '[я + игра́ть]{.ru}'
    cells:
    - '[я + игра́ть]{.ru}'
    - '[игра́ю]{.ru}'
  - base: '[вы + рабо́тать]{.ru}'
    cells:
    - '[вы + рабо́тать]{.ru}'
    - '[рабо́таете]{.ru}'
  - base: '[он + знать]{.ru}'
    cells:
    - '[он + знать]{.ru}'
    - '[зна́ет]{.ru}'
  - base: '[мы + гуля́ть]{.ru}'
    cells:
    - '[мы + гуля́ть]{.ru}'
    - '[гуля́ем]{.ru}'
  - base: '[она́ + де́лать]{.ru}'
    cells:
    - '[она́ + де́лать]{.ru}'
    - '[де́лает]{.ru}'
  - base: '[я + у́жинать]{.ru}'
    cells:
    - '[я + у́жинать]{.ru}'
    - '[у́жинаю]{.ru}'
    new: true
    gloss: 吃晚饭
  - base: '[они́ + отвеча́ть]{.ru}'
    cells:
    - '[они́ + отвеча́ть]{.ru}'
    - '[отвеча́ют]{.ru}'
    new: true
    gloss: 回答
  - base: '[ты + чита́ть]{.ru}'
    cells:
    - '[ты + чита́ть]{.ru}'
    - '[чита́ешь]{.ru}'
  - base: '[мы + обе́дать]{.ru}'
    cells:
    - '[мы + обе́дать]{.ru}'
    - '[обе́даем]{.ru}'
    new: true
    gloss: 吃午饭
  - base: '[вы + понима́ть]{.ru}'
    cells:
    - '[вы + понима́ть]{.ru}'
    - '[понима́ете]{.ru}'
    new: true
    gloss: 懂
  - base: '[он + опа́здывать]{.ru}'
    cells:
    - '[он + опа́здывать]{.ru}'
    - '[опа́здывает]{.ru}'
    new: true
    gloss: 迟到
  - base: '[я + повторя́ть]{.ru}'
    cells:
    - '[я + повторя́ть]{.ru}'
    - '[повторя́ю]{.ru}'
    new: true
    gloss: 复习
  - base: '[ты + теря́ть]{.ru}'
    cells:
    - '[ты + теря́ть]{.ru}'
    - '[теря́ешь]{.ru}'
    new: true
    gloss: 丢失
  - base: '[они́ + гуля́ть]{.ru}'
    cells:
    - '[они́ + гуля́ть]{.ru}'
    - '[гуля́ют]{.ru}'
  - base: '[мы + слу́шать]{.ru}'
    cells:
    - '[мы + слу́шать]{.ru}'
    - '[слу́шаем]{.ru}'
  - base: '[вы + отдыха́ть]{.ru}'
    cells:
    - '[вы + отдыха́ть]{.ru}'
    - '[отдыха́ете]{.ru}'
  why: |-
    第 3、8、14 题：[я]{.ru} 用 [-ю]{.ru}：[игра́ю, у́жинаю, повторя́ю]{.ru}。
    第 1、10、15 题：[ты]{.ru} 用 [-ешь]{.ru}，[ь]{.ru} 不能丢：[отдыха́ешь, чита́ешь, теря́ешь]{.ru}。
    第 5、7、13 题：[он, она́]{.ru} 用 [-ет]{.ru}：[зна́ет, де́лает, опа́здывает]{.ru}。
    第 6、11、17 题：[мы]{.ru} 用 [-ем]{.ru}：[гуля́ем, обе́даем, слу́шаем]{.ru}。
    第 4、12、18 题：[вы]{.ru} 用 [-ете]{.ru}：[рабо́таете, понима́ете, отдыха́ете]{.ru}。
    第 2、9、16 题：[они́]{.ru} 用 [-ют]{.ru}：[слу́шают, отвеча́ют, гуля́ют]{.ru}。
- id: L06-03
  tags:
  - 第一变位现在时：名词作主语
  task: 主语是名词或几个人：先判断用哪个人称，再写出动词的现在时。
  type: fill
  items:
  - stem: Роди́тели ___ ве́чером.
    hint: гуля́ть
    accept:
    - гуля́ют
  - stem: Ма́ма ___ рома́н.
    hint: чита́ть
    accept:
    - чита́ет
  - stem: Ива́н Серге́евич, вы ___ сейча́с?
    hint: рабо́тать
    accept:
    - рабо́таете
  - stem: Пьер и я ___.
    hint: отдыха́ть
    accept:
    - отдыха́ем
  - stem: Студе́нты ___.
    hint: слу́шать
    accept:
    - слу́шают
  - stem: Кто ___?
    hint: знать
    accept:
    - зна́ет
  - stem: Ми́ша и Пьер ___.
    hint: игра́ть
    accept:
    - игра́ют
  - stem: Ю́ми всегда́ ___ уро́ки.
    hint: де́лать
    accept:
    - де́лает
  - stem: Ты и А́нна ___?
    hint: гуля́ть
    accept:
    - гуля́ете
  - stem: Па́па не ___.
    hint: знать
    accept:
    - зна́ет
  - stem: Мои́ роди́тели ___.
    hint: рабо́тать
    accept:
    - рабо́тают
  - stem: Что ___ Ми́ша?
    hint: де́лать
    accept:
    - де́лает
  - stem: А́нна и я ___ рома́н.
    hint: чита́ть
    accept:
    - чита́ем
  - stem: Ко́шка ___.
    hint: игра́ть
    accept:
    - игра́ет
  - stem: О́льга Ви́кторовна, вы ___?
    hint: отдыха́ть
    accept:
    - отдыха́ете
  - stem: Что ___ студе́нты?
    hint: де́лать
    accept:
    - де́лают
  why: |-
    第 2、8、10、12、14 题：单数名词作主语，用第三人称单数 [-ет]{.ru}：[Ма́ма чита́ет]{.ru}；[Что де́лает Ми́ша?]{.ru} 主语在动词后面，仍是单数。
    第 1、5、7、11、16 题：复数名词或用 [и]{.ru} 连起来的两个人，用第三人称复数 [-ют]{.ru}：[Роди́тели гуля́ют, Ми́ша и Пьер игра́ют]{.ru}。
    第 4、13 题：“别人和我”合起来就是 [мы]{.ru}，用 [-ем]{.ru}：[Пьер и я отдыха́ем]{.ru}。
    第 9 题：“你和别人”合起来就是 [вы]{.ru}，用 [-ете]{.ru}：[Ты и А́нна гуля́ете?]{.ru}
    第 3、15 题：用 [вы]{.ru} 称呼一个人，动词仍是复数形式：[вы рабо́таете, вы отдыха́ете]{.ru}。
    第 6 题：[кто]{.ru} 作主语，动词用第三人称单数：[Кто зна́ет?]{.ru}
- id: L06-04
  tags:
  - 第一变位现在时：词尾核查
  task: 每个形式的动词词尾和代词不一致，写出正确的动词形式。
  type: matrix
  cols:
  - 有错的形式
  - 正确的动词
  given:
  - 0
  rows:
  - base: '[я чита́ет]{.ru}'
    cells:
    - '[я чита́ет]{.ru}'
    - '[чита́ю]{.ru}'
  - base: '[ты гуля́ет]{.ru}'
    cells:
    - '[ты гуля́ет]{.ru}'
    - '[гуля́ешь]{.ru}'
  - base: '[они́ зна́ет]{.ru}'
    cells:
    - '[они́ зна́ет]{.ru}'
    - '[зна́ют]{.ru}'
  - base: '[мы рабо́тают]{.ru}'
    cells:
    - '[мы рабо́тают]{.ru}'
    - '[рабо́таем]{.ru}'
  - base: '[вы де́лаешь]{.ru}'
    cells:
    - '[вы де́лаешь]{.ru}'
    - '[де́лаете]{.ru}'
  - base: '[он игра́ют]{.ru}'
    cells:
    - '[он игра́ют]{.ru}'
    - '[игра́ет]{.ru}'
  - base: '[они́ слу́шаем]{.ru}'
    cells:
    - '[они́ слу́шаем]{.ru}'
    - '[слу́шают]{.ru}'
  - base: '[я отдыха́ешь]{.ru}'
    cells:
    - '[я отдыха́ешь]{.ru}'
    - '[отдыха́ю]{.ru}'
  - base: '[ты чита́ю]{.ru}'
    cells:
    - '[ты чита́ю]{.ru}'
    - '[чита́ешь]{.ru}'
  - base: '[вы зна́ем]{.ru}'
    cells:
    - '[вы зна́ем]{.ru}'
    - '[зна́ете]{.ru}'
  - base: '[она́ гуля́ешь]{.ru}'
    cells:
    - '[она́ гуля́ешь]{.ru}'
    - '[гуля́ет]{.ru}'
  - base: '[мы игра́ете]{.ru}'
    cells:
    - '[мы игра́ете]{.ru}'
    - '[игра́ем]{.ru}'
  why: |-
    第 1、8 题：[я]{.ru} 的词尾是 [-ю]{.ru}：[я чита́ю, я отдыха́ю]{.ru}。
    第 2、9 题：[ты]{.ru} 的词尾是 [-ешь]{.ru}：[ты гуля́ешь, ты чита́ешь]{.ru}。
    第 6、11 题：[он, она́]{.ru} 的词尾是 [-ет]{.ru}：[он игра́ет, она́ гуля́ет]{.ru}。
    第 4、12 题：[мы]{.ru} 的词尾是 [-ем]{.ru}：[мы рабо́таем, мы игра́ем]{.ru}。
    第 5、10 题：[вы]{.ru} 的词尾是 [-ете]{.ru}：[вы де́лаете, вы зна́ете]{.ru}。
    第 3、7 题：[они́]{.ru} 的词尾是 [-ют]{.ru}：[они́ зна́ют, они́ слу́шают]{.ru}。
