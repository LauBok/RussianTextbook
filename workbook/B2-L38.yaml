heading: 第 38 课　带着东西或人移动的运动动词
groups:
- id: B2-L38-01
  tags:
  - 运动动词变位：带东西或人移动三对
  task: 写出动词的现在时和过去时。
  type: matrix
  cols:
  - 动词
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  - 过去时阳性
  - 过去时阴性
  given:
  - 0
  rows:
  - base: '[нести́]{.ru}'
    cells:
    - '[нести́]{.ru}'
    - '[несу́]{.ru}'
    - '[несёшь]{.ru}'
    - '[несу́т]{.ru}'
    - '[нёс]{.ru}'
    - '[несла́]{.ru}'
  - base: '[носи́ть]{.ru}'
    cells:
    - '[носи́ть]{.ru}'
    - '[ношу́]{.ru}'
    - '[но́сишь]{.ru}'
    - '[но́сят]{.ru}'
    - '[носи́л]{.ru}'
    - '[носи́ла]{.ru}'
  - base: '[вести́]{.ru}'
    cells:
    - '[вести́]{.ru}'
    - '[веду́]{.ru}'
    - '[ведёшь]{.ru}'
    - '[веду́т]{.ru}'
    - '[вёл]{.ru}'
    - '[вела́]{.ru}'
  - base: '[води́ть]{.ru}'
    cells:
    - '[води́ть]{.ru}'
    - '[вожу́]{.ru}'
    - '[во́дишь]{.ru}'
    - '[во́дят]{.ru}'
    - '[води́л]{.ru}'
    - '[води́ла]{.ru}'
  - base: '[везти́]{.ru}'
    cells:
    - '[везти́]{.ru}'
    - '[везу́]{.ru}'
    - '[везёшь]{.ru}'
    - '[везу́т]{.ru}'
    - '[вёз]{.ru}'
    - '[везла́]{.ru}'
  - base: '[вози́ть]{.ru}'
    cells:
    - '[вози́ть]{.ru}'
    - '[вожу́]{.ru}'
    - '[во́зишь]{.ru}'
    - '[во́зят]{.ru}'
    - '[вози́л]{.ru}'
    - '[вози́ла]{.ru}'
  why: |-
    第 1、3、5 题：定向动词第一变位，重音在词尾：[несу́, несёшь; веду́, ведёшь; везу́, везёшь]{.ru}。过去时阳性没有 [-л]{.ru}，[е]{.ru} 变 [ё]{.ru}：[нёс, вёз]{.ru}；[вести́]{.ru} 的 [д]{.ru} 消失：[вёл]{.ru}；阴性重音在词尾：[несла́, вела́, везла́]{.ru}。
    第 2、4、6 题：不定向动词第二变位，只有 [я]{.ru} 交替：[ношу́, вожу́, вожу́]{.ru}，其余人称重音前移：[но́сишь, во́дишь, во́зишь]{.ru}。[води́ть]{.ru} 和 [вози́ть]{.ru} 的 [я]{.ru} 都是 [вожу́]{.ru}。
- id: B2-L38-02
  tags:
  - нести / вести / везти：意义
  task: 下面每件事该用哪一对动词？归入相应的栏。
  type: classify
  bins:
  - '[нести́ / носи́ть]{.ru}'
  - '[вести́ / води́ть]{.ru}'
  - '[везти́ / вози́ть]{.ru}'
  items:
  - text: 抱着蛋糕（[торт]{.ru}）走去朋友家
    answer: '[нести́ / носи́ть]{.ru}'
  - text: 领着孩子们（[де́ти]{.ru}）走去学校
    answer: '[вести́ / води́ть]{.ru}'
  - text: 开车送朋友（[друг]{.ru}）去火车站
    answer: '[везти́ / вози́ть]{.ru}'
  - text: 坐飞机把礼物（[пода́рки]{.ru}）带回国
    answer: '[везти́ / вози́ть]{.ru}'
  - text: 提着包（[су́мка]{.ru}）走到车站
    answer: '[нести́ / носи́ть]{.ru}'
  - text: 领游客（[тури́сты]{.ru}）走进博物馆
    answer: '[вести́ / води́ть]{.ru}'
  - text: 用船把苹果（[я́блоки]{.ru}）运到城里
    answer: '[везти́ / вози́ть]{.ru}'
  - text: 抱着猫（[ко́шка]{.ru}）步行去兽医那里
    answer: '[нести́ / носи́ть]{.ru}'
  - text: 牵着狗（[соба́ка]{.ru}）散步
    answer: '[вести́ / води́ть]{.ru}'
  - text: 坐公共汽车给奶奶带花（[цветы́]{.ru}）
    answer: '[везти́ / вози́ть]{.ru}'
  - text: 拿着书（[кни́ги]{.ru}）走去图书馆
    answer: '[нести́ / носи́ть]{.ru}'
  - text: 领新同学（[но́вый студе́нт]{.ru}）去教室
    answer: '[вести́ / води́ть]{.ru}'
  - text: 开着车（[маши́на]{.ru}）
    answer: '[вести́ / води́ть]{.ru}'
  - text: 坐火车把奶奶（[ба́бушка]{.ru}）接到莫斯科
    answer: '[везти́ / вози́ть]{.ru}'
  - text: 背着双肩包（[рюкза́к]{.ru}）爬山
    answer: '[нести́ / носи́ть]{.ru}'
  why: |-
    第 1、5、8、11、15 题：步行，带的是东西（拿着、抱着、背着），用 [нести́ / носи́ть]{.ru}：[нести́ торт, нести́ рюкза́к]{.ru}。猫、狗由人抱着走，也用 [нести́]{.ru}（第 8 题）。
    第 2、6、9、12 题：步行，带的是人或动物，他们自己走，人在旁边领着：[вести́ / води́ть]{.ru}：[вести́ дете́й в шко́лу, вести́ соба́ку]{.ru}。
    第 13 题：“开车、驾驶”也用 [вести́ / води́ть]{.ru}：[вести́ маши́ну]{.ru}。
    第 3、4、7、10、14 题：坐车、船、飞机，不管带的是人还是东西，都用 [везти́ / вози́ть]{.ru}：[везти́ дру́га на вокза́л, везти́ пода́рки]{.ru}。第 10 题花虽然拿在手里，但人坐公共汽车，仍用 [везти́]{.ru}。
- id: B2-L38-03
  tags:
  - нести / вести / везти：定向与不定向
  task: 按动词在句中的意义把句子归栏。
  type: classify
  bins:
  - 那一次
  - 经常往返
  - 到处走
  - 会开车
  - 穿、戴
  items:
  - text: '[Ди́ма несёт торт на ку́хню.]{.ru}'
    answer: 那一次
  - text: '[Вчера́, когда́ я вёл сы́на в шко́лу, я встре́тил учи́теля.]{.ru}'
    answer: 那一次
  - text: '[Смотри́, па́па везёт ба́бушку с вокза́ла.]{.ru}'
    answer: 那一次
  - text: '[Ка́ждое у́тро А́нна во́дит соба́ку в парк.]{.ru}'
    answer: 经常往返
  - text: '[Я всегда́ вожу́ домо́й пода́рки из Москвы́.]{.ru}'
    answer: 经常往返
  - text: '[Ле́том ба́бушка ча́сто но́сит нам я́блоки.]{.ru}'
    answer: 经常往返
  - text: '[Андре́й Петро́вич во́дит тури́стов по го́роду.]{.ru}'
    answer: 到处走
  - text: '[Це́лый день я носи́л рюкза́к по го́роду.]{.ru}'
    answer: 到处走
  - text: '[Друг вози́л нас по Каза́ни на маши́не.]{.ru}'
    answer: 到处走
  - text: '[Мой брат хорошо́ во́дит маши́ну.]{.ru}'
    answer: 会开车
  - text: '[Ба́бушка не уме́ет води́ть маши́ну.]{.ru}'
    answer: 会开车
  - text: '[А́нна уже́ во́дит маши́ну, а Ми́ша ещё нет.]{.ru}'
    answer: 会开车
  - text: '[Ива́н Серге́евич но́сит очки́.]{.ru}'
    answer: 穿、戴
  - text: '[Зимо́й Ю́ми всегда́ но́сит ша́пку.]{.ru}'
    answer: 穿、戴
  - text: '[Ми́ша не лю́бит носи́ть шарф.]{.ru}'
    answer: 穿、戴
  why: |-
    第 1–3 题：定向动词说那一次、朝一个方向：[несёт, вёл, везёт]{.ru}。第 2 题是过去某时正在路上。
    第 4–6 题：不定向动词加 [ка́ждое у́тро, всегда́, ча́сто]{.ru}，说每次带去又回来：[во́дит, вожу́, но́сит]{.ru}。
    第 7–9 题：[по]{.ru} + 第三格（[по го́роду, по Каза́ни]{.ru}）说在一个地方到处走，没有一个方向，用不定向动词。
    第 10–12 题：[води́ть маши́ну]{.ru} 说会开车、平常开车，用不定向动词；正在开的那一次才用 [вести́]{.ru}。
    第 13–15 题：“穿着、戴着”只用 [носи́ть]{.ru}，没有对应的定向用法。
- id: B2-L38-04
  tags:
  - нести / вести / везти：句中
  task: 从括号里的一对动词中选一个，写出合适的形式。
  type: fill
  items:
  - stem: Ми́ша ___ из магази́на хлеб и молоко́. Вот он идёт!
    hint: нести́ / носи́ть
    accept:
    - несёт
  - stem: Ка́ждый год я ___ роди́телям пода́рки из Росси́и.
    hint: везти́ / вози́ть
    accept:
    - вожу́
  - stem: Когда́ па́па ___ нас на да́чу, на доро́ге бы́ло мно́го маши́н.
    hint: везти́ / вози́ть
    accept:
    - вёз
  - stem: Ива́н Серге́евич ___ маши́ну два́дцать лет.
    hint: вести́ / води́ть
    accept:
    - во́дит
  - stem: Сейча́с я ___ дете́й в парк, а пото́м пойду́ в магази́н.
    hint: вести́ / води́ть
    accept:
    - веду́
  - stem: 'А́нна шла ме́дленно: она́ ___ тяжёлую су́мку.'
    hint: нести́ / носи́ть
    accept:
    - несла́
  - stem: Ты всегда́ ___ с собо́й слова́рь?
    hint: нести́ / носи́ть
    accept:
    - но́сишь
  - stem: Вчера́ я ___ дру́га по Москве́ це́лый день.
    hint: вести́ / води́ть
    accept:
    - води́л
    - води́ла
  - stem: Смотри́, како́й большо́й торт ___ Ди́ма и Ван Лэй!
    hint: нести́ / носи́ть
    accept:
    - несу́т
  - stem: Э́тот авто́бус ___ тури́стов в Кремль ка́ждый час.
    hint: везти́ / вози́ть
    accept:
    - во́зит
  - stem: Кто ___ маши́ну, когда́ вы е́хали в Каза́нь?
    hint: вести́ / води́ть
    accept:
    - вёл
  - stem: Ба́бушка ___ очки́ то́лько когда́ чита́ет.
    hint: нести́ / носи́ть
    accept:
    - но́сит
  - stem: Ле́том мы ___ дете́й на мо́ре.
    hint: везти́ / вози́ть
    accept:
    - вози́ли
  - stem: Смотри́, па́па ___ на маши́не но́вый шкаф!
    hint: везти́ / вози́ть
    accept:
    - везёт
  - stem: Учи́тель ___ дете́й в музе́й ка́ждую пя́тницу.
    hint: вести́ / води́ть
    accept:
    - во́дит
  - stem: — Что у тебя́ в су́мке? Ты всегда́ ___ её с собо́й.
    hint: нести́ / носи́ть
    accept:
    - но́сишь
  why: |-
    第 1、5、9、14 题：此刻正在带，用定向动词现在时：[несёт, веду́, несу́т, везёт]{.ru}。
    第 3、6、11 题：过去某时正在路上，用定向动词过去时：[вёз, несла́, вёл]{.ru}。注意 [вёз, вёл]{.ru} 没有 [-л]{.ru} 或词干的 [д]{.ru}。
    第 2、7、10、15、16 题：经常、每次往返，用不定向动词：[вожу́, но́сишь, во́зит, во́дит]{.ru}。第 13 题“去过一趟”也用不定向动词：[вози́ли]{.ru}。[вожу́]{.ru} 是 [вози́ть]{.ru} 的 [я]{.ru} 形式（坐车带东西）。
    第 4 题：会开车、开了多年车，用 [води́ть маши́ну]{.ru}：[во́дит]{.ru}。
    第 8 题：在城里到处走，用 [води́ть]{.ru}：[води́л]{.ru}（说话人是女性写 [води́ла]{.ru}）。
    第 12 题：“戴眼镜”只用 [носи́ть]{.ru}：[но́сит]{.ru}。
