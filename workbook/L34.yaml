  why: '第 1 题：“哥哥”是 [ста́рший брат]{.ru}，[ш]{.ru} 后写 [-его]{.ru}：[ста́ршего]{.ru}；[ста́рого]{.ru} 是“老的”。

    第 2、10 题：[па́па, де́душка]{.ru} 是阳性，修饰语用 [моего́, э́того]{.ru}。

    第 3、11 题：[ш]{.ru} 后不重读的 [о]{.ru} 写成 [е]{.ru}：[хоро́шего, мла́дшей]{.ru}。

    第 4 题：[-ого]{.ru} 里的 [г]{.ru} 读 [[в]]{.tr}，但要写 [г]{.ru}：[большо́го]{.ru}。

    第 8 题：软变化是 [си́него]{.ru}，没有 [ь]{.ru}。

    第 13 题：[ваш]{.ru} 的阴性第二格是 [ва́шей]{.ru}。第 14 题：[ма́ма]{.ru} 是阴性，修饰语用 [на́шей]{.ru}。第 16 题：[моего́]{.ru} 重音在最后，[е]{.ru} 不重读。

    第 5、6、7、9、12、15 题：原本就对；第 6、7 题的 [её]{.ru} 永远不变。'
