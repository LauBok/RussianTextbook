    第 3、4 题：[на́шего, ва́шего]{.ru}，阴性 [на́шей, ва́шей]{.ru}，重音都在词干。

    第 5 题：[чьего́, чьей]{.ru} 带 [ь]{.ru}。第 6 题：[э́того, э́той]{.ru}。

    第 7–9 题：“他的、她的、他们的”永远不变：[дом её бра́та]{.ru}。'
- id: L34-03
  tags:
  - 修饰语与名词第二格配合
  task: 写出第二格词组。
  type: matrix
  cols:
  - 词组
  - 第二格词组
  rows:
  - base: '[мой + ста́рший + брат]{.ru}'
