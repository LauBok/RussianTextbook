    cells:
    - '[э́тот + молодо́й + па́рень]{.ru}'
    - '[э́того молодо́го па́рня]{.ru}'
  why: '第 1、3、5、9、11、12、16 题：阳性和中性修饰语 [-ого / -его, моего́, э́того]{.ru}，名词 [-а / -я]{.ru}。第 9 题 [её]{.ru} 不变。第 16 题 [па́рень → па́рня]{.ru}，[е]{.ru} 脱落。

    第 2、4、8、10、13、15 题：阴性修饰语 [-ой / -ей, на́шей, твое́й, э́той]{.ru}，名词 [-ы / -и]{.ru}。第 13 题 [тетра́дь → тетра́ди]{.ru}。

    第 6、7、14 题：[па́па, де́душка, дя́дя]{.ru} 是阳性，修饰语用阳性 [моего́, на́шего, твоего́]{.ru}，名词按 [-а / -я]{.ru} 变：[па́пы, де́душки, дя́ди]{.ru}。不说 *[мое́й па́пы]{.ru}。'
- id: L34-04
  tags:
