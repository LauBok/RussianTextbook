    - '[у мла́дшей сестры́]{.ru}'
  - base: '[у сосе́дней кварти́ры]{.ru}'
    cells:
    - '[у сосе́дней кварти́ры]{.ru}'
    - '[у сосе́дней кварти́ры]{.ru}'
