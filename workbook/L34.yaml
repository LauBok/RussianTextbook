    cells:
    - '[у си́нього до́ма]{.ru}'
    - '[у си́него до́ма]{.ru}'
  - base: '[студе́нт медици́нского институ́та]{.ru}'
    cells:
    - '[студе́нт медици́нского институ́та]{.ru}'
    - '[студе́нт медици́нского институ́та]{.ru}'
  - base: '[дом э́той де́душки]{.ru}'
    cells:
