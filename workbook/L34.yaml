    第 8–10 题：重音在词尾，写 [-о́го, -о́й]{.ru}：[большо́го, большо́й]{.ru}。阴性第二格 [большо́й]{.ru} 和阳性第一格同形，靠上下文区分。

    第 11–15 题：[ш, щ]{.ru} 后不重读的 [о]{.ru} 写成 [е]{.ru}：[хоро́шего, хоро́шей, бу́дущего]{.ru}。

