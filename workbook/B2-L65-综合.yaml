groups:
- id: B2-L65-综合-a
  lessons:
  - B2-L30
  - B2-L47
  - B2-L64
  - B2-L65
  tags:
  - 综合：命令、否定命令、提议、пусть、转述
  recycles:
  - B2-L65-01
  - B2-L64-02
  task: 写出同一动作的五种说法（[вы]{.ru} 的命令式；转述别人对“他”的吩咐）。
  type: matrix
  cols:
  - 动作（完成体 / 未完成体）
  - 命令式
  - 否定命令式
  - '[дава́йте]{.ru} …'
  - '[пусть]{.ru} …'
  - 转述：[что́бы]{.ru} …
  given:
  - 0
  rows:
  - base: '[позвони́ть / звони́ть]{.ru}'
    cells:
    - '[позвони́ть / звони́ть]{.ru}'
    - '[позвони́те]{.ru}'
    - '[не звони́те]{.ru}'
    - '[дава́йте позвони́м]{.ru}'
    - '[пусть он позвони́т]{.ru}'
    - '[что́бы он позвони́л]{.ru}'
  - base: '[купи́ть / покупа́ть]{.ru}'
    cells:
    - '[купи́ть / покупа́ть]{.ru}'
    - '[купи́те]{.ru}'
    - '[не покупа́йте]{.ru}'
    - '[дава́йте ку́пим]{.ru}'
    - '[пусть он ку́пит]{.ru}'
    - '[что́бы он купи́л]{.ru}'
  - base: '[откры́ть / открыва́ть]{.ru}'
    cells:
    - '[откры́ть / открыва́ть]{.ru}'
    - '[откро́йте]{.ru}'
    - '[не открыва́йте]{.ru}'
    - '[дава́йте откро́ем]{.ru}'
    - '[пусть он откро́ет]{.ru}'
    - '[что́бы он откры́л]{.ru}'
  - base: '[рассказа́ть / расска́зывать]{.ru}'
    cells:
    - '[рассказа́ть / расска́зывать]{.ru}'
    - '[расскажи́те]{.ru}'
    - '[не расска́зывайте]{.ru}'
    - '[дава́йте расска́жем]{.ru}'
    - '[пусть он расска́жет]{.ru}'
    - '[что́бы он рассказа́л]{.ru}'
  - base: '[взять / брать]{.ru}'
    cells:
    - '[взять / брать]{.ru}'
    - '[возьми́те]{.ru}'
    - '[не бери́те]{.ru}'
    - '[дава́йте возьмём]{.ru}'
    - '[пусть он возьмёт]{.ru}'
    - '[что́бы он взял]{.ru}'
  - base: '[пригото́вить / гото́вить]{.ru}'
    cells:
    - '[пригото́вить / гото́вить]{.ru}'
    - '[пригото́вьте]{.ru}'
    - '[не гото́вьте]{.ru}'
    - '[дава́йте пригото́вим]{.ru}'
    - '[пусть он пригото́вит]{.ru}'
    - '[что́бы он пригото́вил]{.ru}'
  - base: '[написа́ть / писа́ть]{.ru}'
    cells:
    - '[написа́ть / писа́ть]{.ru}'
    - '[напиши́те]{.ru}'
    - '[не пиши́те]{.ru}'
    - '[дава́йте напи́шем]{.ru}'
    - '[пусть он напи́шет]{.ru}'
    - '[что́бы он написа́л]{.ru}'
  - base: '[отве́тить / отвеча́ть]{.ru}'
    cells:
    - '[отве́тить / отвеча́ть]{.ru}'
    - '[отве́тьте]{.ru}'
    - '[не отвеча́йте]{.ru}'
    - '[дава́йте отве́тим]{.ru}'
    - '[пусть он отве́тит]{.ru}'
    - '[что́бы он отве́тил]{.ru}'
  why: 第 1–8 题：一次具体的事：命令式、[дава́йте]{.ru}、[пусть]{.ru} 和转述都用完成体：[позвони́те, дава́йте позвони́м, пусть он позвони́т, что́бы он позвони́л]{.ru}。劝阻“别做”用 [не]{.ru} + 未完成体命令式：[не звони́те, не покупа́йте, не бери́те]{.ru}。[возьми́те / не бери́те]{.ru} 的两个体词根不同；[отве́тьте, пригото́вьте]{.ru} 重音在词干，词尾是 [-ь(те)]{.ru}。转述时 [что́бы]{.ru} 后用过去时形式：[взял, отве́тил]{.ru}。
- id: B2-L65-综合-b
  lessons:
  - B2-L30
  - B2-L47
  - B2-L64
  - B2-L65
  tags:
  - 综合：命令、提议、пусть 的意义
  recycles:
  - B2-L65-01
  task: 按意义把句子归栏。
  type: classify
  bins:
  - 一次具体请求
  - 一般劝阻
  - 提醒当心
  - 提议一起做
  - 让第三者做
  - 祝愿
  items:
  - text: '[Позвони́ мне из по́езда.]{.ru}'
    answer: 一次具体请求
  - text: '[Не торопи́сь!]{.ru}'
    answer: 一般劝阻
  - text: '[Не забу́дь телефо́н!]{.ru}'
    answer: 提醒当心
  - text: '[Дава́йте пообе́даем.]{.ru}'
    answer: 提议一起做
  - text: '[Пусть Ми́ша принесёт воды́.]{.ru}'
    answer: 让第三者做
  - text: '[Пусть всегда́ бу́дет со́лнце!]{.ru}'
    answer: 祝愿
  - text: '[Переда́й, пожа́луйста, соль.]{.ru}'
    answer: 一次具体请求
  - text: '[Не спо́рьте с ним.]{.ru}'
    answer: 一般劝阻
  - text: '[Смотри́, не опозда́й!]{.ru}'
    answer: 提醒当心
  - text: '[Пойдём в кино́!]{.ru}'
    answer: 提议一起做
  - text: '[— Ди́ма хо́чет спать. — Пусть спит.]{.ru}'
    answer: 让第三者做
  - text: '[Пусть у тебя́ всё бу́дет хорошо́!]{.ru}'
    answer: 祝愿
  - text: '[Подожди́ мину́ту!]{.ru}'
    answer: 一次具体请求
  - text: '[Не сиди́ всю ночь за компью́тером.]{.ru}'
    answer: 一般劝阻
  - text: '[Не потеря́й па́спорт!]{.ru}'
    answer: 提醒当心
  - text: '[Дава́й не бу́дем спо́рить.]{.ru}'
    answer: 提议一起做
  - text: '[Пусть они́ игра́ют.]{.ru}'
    answer: 让第三者做
  - text: '[Пусть ваш сын бу́дет здоро́в!]{.ru}'
    answer: 祝愿
  why: '第 1、7、13 题：完成体命令式：要对方做一件具体的事并做成。

    第 2、8、14 题：[не]{.ru} + 未完成体命令式：劝对方别做（[не торопи́сь, не спо́рьте, не сиди́]{.ru}）。

    第 3、9、15 题：[не]{.ru} + 完成体命令式：提醒别不小心出某种结果（忘、迟到、丢），常加 [смотри́]{.ru}。

    第 4、10、16 题：[дава́й(те)]{.ru} + 第一人称复数，或口语只说 [пойдём]{.ru}；否定提议 [дава́й не бу́дем…]{.ru} 也是提议。

    第 5、11、17 题：[пусть]{.ru} + 第三人称：对第三者的吩咐或同意。

    第 6、12、18 题：[пусть]{.ru} + [бу́дет]{.ru}：祝愿。'
- id: B2-L65-综合-c
  lessons:
  - B2-L30
  - B2-L47
  - B2-L64
  - B2-L65
  tags:
  - 综合：转述请求时 что́бы 后的过去时形式
  recycles:
  - B2-L64-02
  - B2-L65-02
  task: 用原话里的动词填空（转述句）。
  type: fill
  items:
  - stem: «Позвони́ мне ве́чером!» — Ю́ми попроси́ла, что́бы Пьер ___ ей ве́чером.
    accept:
    - позвони́л
  - stem: «Не опа́здывай!» — Учи́тель сказа́л, что́бы Ми́ша не ___.
    accept:
    - опа́здывал
  - stem: «Пусть Ми́ша принесёт воды́.» — Ба́бушка сказа́ла, что́бы Ми́ша ___ воды́.
    accept:
    - принёс
  - stem: «Купи́те хле́ба!» — Ма́ма попроси́ла, что́бы мы ___ хле́ба.
    accept:
    - купи́ли
  - stem: «Не забу́дь ключи́!» — А́нна сказа́ла бра́ту, что́бы он не ___ ключи́.
    accept:
    - забы́л
  - stem: «Пусть де́ти отдыха́ют.» — Па́па сказа́л, что́бы де́ти ___.
    accept:
    - отдыха́ли
  - stem: «Помоги́ ба́бушке!» — Ма́ма попроси́ла, что́бы А́нна ___ ба́бушке.
    accept:
    - помогла́
  - stem: «Возьми́ па́спорт!» — Мари́я Никола́евна сказа́ла, что́бы Ван Лэй ___ па́спорт.
    accept:
    - взял
  - stem: «Пусть Све́та позвони́т мне.» — Ма́ма сказа́ла, что́бы Све́та ___ ей.
    accept:
    - позвони́ла
  - stem: «Сади́тесь!» — О́льга Ви́кторовна сказа́ла, что́бы студе́нты ___.
    accept:
    - сади́лись
  - stem: «Не спо́рьте!» — Па́па попроси́л, что́бы мы не ___.
    accept:
    - спо́рили
  - stem: «Пусть Ди́ма прочита́ет э́ту кни́гу.» — Учи́тельница сказа́ла, что́бы Ди́ма ___ э́ту кни́гу.
    accept:
    - прочита́л
  why: '第 1、4、7、8 题：完成体命令式转述成完成体过去时形式，性、数随从句主语：[позвони́л, купи́ли, помогла́, взял]{.ru}。

    第 2、5、11 题：否定命令式里的体照原样保留：[не опа́здывай → не опа́здывал]{.ru}，[не спо́рьте → не спо́рили]{.ru}，[не забу́дь → не забы́л]{.ru}。

    第 10 题：未完成体命令式转述成未完成体：[сади́тесь → сади́лись]{.ru}。

    第 3、6、9、12 题：[пусть]{.ru} 句转述时同样用 [что́бы]{.ru} + 过去时形式：[принесёт → принёс, отдыха́ют → отдыха́ли, позвони́т → позвони́ла, прочита́ет → прочита́л]{.ru}。'
