  why: |-
    第 1、2、5、6、9、10、13、14、17 题：不定式词干以元音结尾，加 [-в]{.ru}：[прочита́в, реши́в, сказа́в, прие́хав, вы́учив, закры́в, нача́в, взяв]{.ru}；[сесть]{.ru} 的词干是 [се-]{.ru}（[сел]{.ru}）：[сев]{.ru}。重音同不定式。第 6 题不能由 [прие́дут]{.ru} 构成。
    第 4、7、11、15、18 题：[-ся]{.ru} 动词只能用 [-вшись]{.ru}：[оде́вшись, познако́мившись, останови́вшись, попроща́вшись, умы́вшись]{.ru}。
    第 3、8、12、16 题：[-йти]{.ru} 类由将来时词干加 [-я]{.ru}：[уйду́ → уйдя́]{.ru}，[войдя́, найдя́, перейдя́]{.ru}。形式像未完成体，其实是完成体副动词。
    第 19–21 题：[-сти, -зти]{.ru} 类同样由将来时词干加 [-я]{.ru}：[унесу́ → унеся́]{.ru}，[перевезу́ → перевезя́]{.ru}，[приведу́ → приведя́]{.ru}。
- id: B3-L12-02
  lessons:
  - B3-L12
  tags:
  - 完成体副动词与未完成体副动词对照
  - 未完成体副动词：没有此形式的动词
  task: 写出体对的未完成体副动词和完成体副动词，不存在的写“—”。
  type: matrix
