    - '[посмотре́в]{.ru}'
  - base: '[одева́ться / оде́ться]{.ru}'
    cells:
    - '[одева́ться / оде́ться]{.ru}'
    - '[одева́ясь]{.ru}'
    - '[оде́вшись]{.ru}'
  why: |-
    第 1–13 题：未完成体副动词由复数第三人称构成（[возвраща́ются → возвраща́ясь]{.ru}，[прохо́дят → проходя́]{.ru}，[смо́трят → смотря́]{.ru}），完成体副动词由不定式词干构成（[верну́вшись, осмотре́в, посмотре́в]{.ru}）。
    第 1、5、8 题：[писа́ть, ждать, пить]{.ru} 没有未完成体副动词，完成体照常：[написа́в, подожда́в, вы́пив]{.ru}。
    第 2、9、13 题：未完成体 [-ясь]{.ru}，完成体 [-вшись]{.ru}：[гото́вясь / подгото́вившись]{.ru}，[одева́ясь / оде́вшись]{.ru}。
    第 3、7 题：两个形式都以 [-я]{.ru} 结尾，靠词干区分体：[проходя́ / пройдя́]{.ru}，[принося́ / принеся́]{.ru}。
    第 6 题：[встава́ть]{.ru} 保留 [-ва-]{.ru}：[встава́я]{.ru}；完成体 [встать → встав]{.ru}。
- id: B3-L12-03
  lessons:
  - B3-L12
  tags:
  - 完成体副动词：改错
  task: 改正错误，正确的照抄（只写副动词）。
  type: matrix
  cols:
  - 句子
  - 改正
  given:
  - 0
  rows:
  - base: '[Прие́дя в Москву́, он позвони́л ма́ме.]{.ru}'
    cells:
    - '[Прие́дя в Москву́, он позвони́л ма́ме.]{.ru}'
