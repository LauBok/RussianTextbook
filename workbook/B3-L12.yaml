  - base: '[открыва́ть / откры́ть]{.ru}'
    cells:
    - '[открыва́ть / откры́ть]{.ru}'
    - '[открыва́я]{.ru}'
    - '[откры́в]{.ru}'
  - base: '[уезжа́ть / уе́хать]{.ru}'
    cells:
    - '[уезжа́ть / уе́хать]{.ru}'
    - '[уезжа́я]{.ru}'
    - '[уе́хав]{.ru}'
  - base: '[смотре́ть / посмотре́ть]{.ru}'
    cells:
    - '[смотре́ть / посмотре́ть]{.ru}'
