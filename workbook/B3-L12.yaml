    - '[Просну́вши, он вы́глянул в окно́.]{.ru}'
    - '[Просну́вшись]{.ru}'
  - base: '[Войдя́ в ко́мнату, она́ включи́ла свет.]{.ru}'
    cells:
    - '[Войдя́ в ко́мнату, она́ включи́ла свет.]{.ru}'
    - '[Войдя́]{.ru}'
  - base: '[Чита́я кни́гу до конца́, я верну́л её в библиоте́ку.]{.ru}'
    cells:
    - '[Чита́я кни́гу до конца́, я верну́л её в библиоте́ку.]{.ru}'
    - '[Прочита́в]{.ru}'
  - base: '[Прочита́я письмо́, ба́бушка запла́кала.]{.ru}'
    cells:
    - '[Прочита́я письмо́, ба́бушка запла́кала.]{.ru}'
    - '[Прочита́в]{.ru}'
  - base: '[Купи́в биле́ты, мы пошли́ в зал.]{.ru}'
    cells:
    - '[Купи́в биле́ты, мы пошли́ в зал.]{.ru}'
    - '[Купи́в]{.ru}'
  - base: '[Сдава́я после́дний экза́мен, студе́нты пое́хали отдыха́ть.]{.ru}'
    cells:
    - '[Сдава́я после́дний экза́мен, студе́нты пое́хали отдыха́ть.]{.ru}'
    - '[Сдав]{.ru}'
  - base: '[Принёсши кни́ги, он положи́л их на стол.]{.ru}'
    cells:
    - '[Принёсши кни́ги, он положи́л их на стол.]{.ru}'
    - '[Принеся́]{.ru}'
  - base: '[Познако́мившись с ним, я по́нял, что он хоро́ший челове́к.]{.ru}'
    cells:
    - '[Познако́мившись с ним, я по́нял, что он хоро́ший челове́к.]{.ru}'
    - '[Познако́мившись]{.ru}'
  - base: '[Посмотря́ фильм, мы до́лго спо́рили.]{.ru}'
    cells:
    - '[Посмотря́ фильм, мы до́лго спо́рили.]{.ru}'
    - '[Посмотре́в]{.ru}'
  - base: '[Поу́жинав, де́ти легли́ спать.]{.ru}'
    cells:
    - '[Поу́жинав, де́ти легли́ спать.]{.ru}'
    - '[Поу́жинав]{.ru}'
  why: |-
    第 1、6 题：只有 [-йти, -сти, -зти]{.ru} 类由将来时词干加 [-я]{.ru}；[прие́хать, прочита́ть]{.ru} 由不定式词干加 [-в]{.ru}：[прие́хав, прочита́в]{.ru}。
    第 2、3 题：[-ся]{.ru} 动词用 [-вшись]{.ru}，不能丢 [-сь]{.ru}，也不用 [-вши]{.ru}：[верну́вшись, просну́вшись]{.ru}。
    第 5、8、11 题：动作先完成，再发生谓语的动作（读完再还书、考完再去休息、看完再争论），要用完成体副动词：[Прочита́в, Сдав, Посмотре́в]{.ru}。第 11 题 [посмотре́ть]{.ru} 是完成体，[смотря́]{.ru} 类的形式只属于未完成体。
    第 9 题：[принести́]{.ru} 属于 [-сти]{.ru} 类：[принеся́]{.ru}；[-ши]{.ru} 形式今天不用。
    第 4、7、10、12 题：原文正确，照抄。
