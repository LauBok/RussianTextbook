    - '[осмотре́в]{.ru}'
  - base: '[ждать / подожда́ть]{.ru}'
    cells:
    - '[ждать / подожда́ть]{.ru}'
    - —
    - '[подожда́в]{.ru}'
  - base: '[встава́ть / встать]{.ru}'
    cells:
    - '[встава́ть / встать]{.ru}'
    - '[встава́я]{.ru}'
    - '[встав]{.ru}'
  - base: '[приноси́ть / принести́]{.ru}'
    cells:
    - '[приноси́ть / принести́]{.ru}'
    - '[принося́]{.ru}'
    - '[принеся́]{.ru}'
  - base: '[пить / вы́пить]{.ru}'
    cells:
    - '[пить / вы́пить]{.ru}'
    - —
    - '[вы́пив]{.ru}'
  - base: '[гото́виться / подгото́виться]{.ru}'
    cells:
    - '[гото́виться / подгото́виться]{.ru}'
    - '[гото́вясь]{.ru}'
