heading: 第 57 课　时间状语
groups:
- id: B2-L57-01
  tags:
  - 时间状语：за / на / 第四格 / че́рез / в тече́ние 的意义
  task: 按时间说法的意义把句子归栏。
  type: classify
  bins:
  - 用多久做完
  - 结果保持多久
  - 动作进行多久
  - 多久以后
  - 在一段时间之内
  items:
  - text: '[Ди́ма написа́л сочине́ние за час.]{.ru}'
    answer: 用多久做完
  - text: '[Пьер уе́хал в Пари́ж на ме́сяц.]{.ru}'
    answer: 结果保持多久
  - text: '[Мы гуля́ли в па́рке три часа́.]{.ru}'
    answer: 动作进行多久
  - text: '[Че́рез ме́сяц начну́тся кани́кулы.]{.ru}'
    answer: 多久以后
  - text: '[В тече́ние ле́кции он три ра́за смотре́л на часы́.]{.ru}'
    answer: 在一段时间之内
  - text: '[А́нна взяла́ у подру́ги слова́рь на два дня.]{.ru}'
    answer: 结果保持多久
  - text: '[Ми́ша спал весь день.]{.ru}'
    answer: 动作进行多久
  - text: '[Мы дое́хали до да́чи за два часа́.]{.ru}'
    answer: 用多久做完
  - text: '[Я позвоню́ тебе́ че́рез час.]{.ru}'
    answer: 多久以后
  - text: '[В тече́ние дня ма́ма звони́ла мне два ра́за.]{.ru}'
    answer: 在一段时间之内
  - text: '[Ю́ми вы́учила все слова́ за ве́чер.]{.ru}'
    answer: 用多久做完
  - text: '[Дождь шёл всю ночь.]{.ru}'
    answer: 动作进行多久
  - text: '[Ба́бушка прие́хала к нам на неде́лю.]{.ru}'
    answer: 结果保持多久
  - text: '[По́езд пришёл че́рез пять мину́т.]{.ru}'
    answer: 多久以后
  - text: '[В тече́ние семе́стра мы писа́ли контро́льные.]{.ru}'
    answer: 在一段时间之内
  - text: '[За ско́лько вре́мени ты прочита́л рома́н?]{.ru}'
    answer: 用多久做完
  - text: '[Па́па дал Ми́ше маши́ну на ве́чер.]{.ru}'
    answer: 结果保持多久
  - text: '[Ван Лэй учи́л ру́сский язы́к год.]{.ru}'
    answer: 动作进行多久
  - text: '[Све́та прие́дет че́рез неде́лю.]{.ru}'
    answer: 多久以后
  - text: '[В тече́ние ме́сяца стоя́ла хоро́шая пого́да.]{.ru}'
    answer: 在一段时间之内
  why: '第 1、8、11、16 题：[за]{.ru} + 第四格说明做完一件事用了多少时间，动词是完成体：[написа́л за час, дое́хали за два часа́, вы́учила за ве́чер]{.ru}；问句 [За ско́лько вре́мени…?]{.ru}

    第 2、6、13、17 题：[на]{.ru} + 第四格说明动作结束后结果保持多久，常和 [уе́хать, взять, прие́хать, дать]{.ru} 连用：借两天、去一个月、住一个星期。

    第 3、7、12、18 题：不带前置词的第四格说明动作本身进行了多久，动词是未完成体：[гуля́ли три часа́, спал весь день, шёл всю ночь, учи́л год]{.ru}。

    第 4、9、14、19 题：[че́рез]{.ru} + 第四格：从说话时或某件事算起，过多久以后。

    第 5、10、15、20 题：[в тече́ние]{.ru} + 第二格：在整段时间之内，动作持续或多次重复（[три ра́за, два ра́за]{.ru}），比不带前置词的第四格更书面。'
- id: B2-L57-02
  tags:
  - 时间状语：时段词组的第四格与 в тече́ние + 第二格
  task: 写出时段词组的第四格和 [в тече́ние]{.ru} 后的形式。
  type: matrix
  cols:
  - 第一格
  - 第四格
  - '[в тече́ние]{.ru} + 第二格'
  given:
  - 0
  rows:
  - base: '[неде́ля]{.ru}'
    cells:
    - '[неде́ля]{.ru}'
    - '[неде́лю]{.ru}'
    - '[в тече́ние неде́ли]{.ru}'
  - base: '[вся неде́ля]{.ru}'
    cells:
    - '[вся неде́ля]{.ru}'
    - '[всю неде́лю]{.ru}'
    - '[в тече́ние всей неде́ли]{.ru}'
  - base: '[два дня]{.ru}'
    cells:
    - '[два дня]{.ru}'
    - '[два дня]{.ru}'
    - '[в тече́ние двух дней]{.ru}'
  - base: '[весь ве́чер]{.ru}'
    cells:
    - '[весь ве́чер]{.ru}'
    - '[весь ве́чер]{.ru}'
    - '[в тече́ние всего́ ве́чера]{.ru}'
  - base: '[ме́сяц]{.ru}'
    cells:
    - '[ме́сяц]{.ru}'
    - '[ме́сяц]{.ru}'
    - '[в тече́ние ме́сяца]{.ru}'
  - base: '[три часа́]{.ru}'
    cells:
    - '[три часа́]{.ru}'
    - '[три часа́]{.ru}'
    - '[в тече́ние трёх часо́в]{.ru}'
  - base: '[четы́ре го́да]{.ru}'
    cells:
    - '[четы́ре го́да]{.ru}'
    - '[четы́ре го́да]{.ru}'
    - '[в тече́ние четырёх лет]{.ru}'
  - base: '[пять лет]{.ru}'
    cells:
    - '[пять лет]{.ru}'
    - '[пять лет]{.ru}'
    - '[в тече́ние пяти́ лет]{.ru}'
  - base: '[вся зима́]{.ru}'
    cells:
    - '[вся зима́]{.ru}'
    - '[всю зи́му]{.ru}'
    - '[в тече́ние всей зимы́]{.ru}'
    hint: 第四格 [зи́му]{.ru}
  - base: '[це́лый день]{.ru}'
    cells:
    - '[це́лый день]{.ru}'
    - '[це́лый день]{.ru}'
    - '[в тече́ние це́лого дня]{.ru}'
  - base: '[семе́стр]{.ru}'
    cells:
    - '[семе́стр]{.ru}'
    - '[семе́стр]{.ru}'
    - '[в тече́ние семе́стра]{.ru}'
  - base: '[одна́ мину́та]{.ru}'
    cells:
    - '[одна́ мину́та]{.ru}'
    - '[одну́ мину́ту]{.ru}'
    - '[в тече́ние одно́й мину́ты]{.ru}'
  - base: '[два ме́сяца]{.ru}'
    cells:
    - '[два ме́сяца]{.ru}'
    - '[два ме́сяца]{.ru}'
    - '[в тече́ние двух ме́сяцев]{.ru}'
  - base: '[вся жизнь]{.ru}'
    cells:
    - '[вся жизнь]{.ru}'
    - '[всю жизнь]{.ru}'
    - '[в тече́ние всей жи́зни]{.ru}'
  why: '第 1、2、9、12、14 题：阴性名词第四格 [-у / -ю]{.ru}，修饰语同样变：[неде́лю, всю неде́лю, одну́ мину́ту]{.ru}；阴性 [-ь]{.ru} 名词第四格不变：[всю жизнь]{.ru}。第二格：[всей неде́ли, одно́й мину́ты, всей жи́зни]{.ru}。

    第 4、5、10、11 题：阳性非动物名词第四格同第一格：[ме́сяц, весь ве́чер, це́лый день]{.ru}；第二格 [ме́сяца, всего́ ве́чера, це́лого дня]{.ru}。[день]{.ru} 变格时 [е]{.ru} 脱落：[дня]{.ru}。

    第 2、4、9、14 题：[весь]{.ru} 的形式：[весь — всего́]{.ru}，[вся — всю — всей]{.ru}。

    第 3、6–8、13 题：数量词组第四格同第一格；在 [в тече́ние]{.ru} 后数词变成第二格，名词跟着用复数第二格：[двух дней, трёх часо́в, двух ме́сяцев]{.ru}。

    第 7、8 题：“年”的复数第二格用 [лет]{.ru}：[в тече́ние четырёх лет, пяти́ лет]{.ru}，不写 *[годо́в]{.ru}*。

    第 9 题：[зима́]{.ru} 第四格重音前移：[всю зи́му]{.ru}；第二格 [зимы́]{.ru} 重音在词尾。'
- id: B2-L57-03
  tags:
  - 时间状语：句中选用 за / на / 第四格 / че́рез / наза́д / в тече́ние
  task: 按括号里的意思填入时间说法（连同前置词）。
  type: fill
  items:
  - stem: Ми́ша взял у дру́га велосипе́д ___.
    hint: 一个星期
    accept:
    - на неде́лю
  - stem: Ван Лэй прочита́л э́ту кни́гу ___.
    hint: 三天
    accept:
    - за три дня
  - stem: Мы жда́ли авто́бус ___.
    hint: 二十分钟
    accept:
    - два́дцать мину́т
  - stem: ___ начну́тся экза́мены.
    hint: 两个星期以后
    accept:
    - че́рез две неде́ли
  - stem: Ди́ма прие́хал в Москву́ ___.
    hint: 一年以前
    accept:
    - год наза́д
  - stem: Роди́тели уе́хали на да́чу ___.
    hint: 整个夏天
    accept:
    - на всё ле́то
  - stem: А́нна гото́вилась к экза́мену ___.
    hint: 整整一个星期
    accept:
    - всю неде́лю
    - в тече́ние всей неде́ли
  - stem: ___ Ю́ми три ра́за звони́ла домо́й.
    hint: 在这一个月之内
    accept:
    - в тече́ние ме́сяца
  - stem: Пьер сде́лал все упражне́ния ___.
    hint: 一个小时
    accept:
    - за час
  - stem: Я позвоню́ тебе́ ___.
    hint: 十分钟以后
    accept:
    - че́рез де́сять мину́т
  - stem: Ба́бушка прие́хала к нам ___.
    hint: 两天
    accept:
    - на два дня
  - stem: Ми́ша смотре́л телеви́зор ___.
    hint: 整个晚上
    accept:
    - весь ве́чер
    - в тече́ние всего́ ве́чера
  - stem: Э́тот дом постро́или ___.
    hint: 五年以前
    accept:
    - пять лет наза́д
  - stem: Мы дое́хали до Петербу́рга ___.
    hint: 四个小时
    accept:
    - за четы́ре часа́
  - stem: Мо́жно я уйду́ ___?
    hint: 一分钟
    accept:
    - на мину́ту
  - stem: ___ студе́нты писа́ли три контро́льные.
    hint: 在整个学期之内
    accept:
    - в тече́ние всего́ семе́стра
  why: '第 1、6、11、15 题：动作完成后结果保持多久：借车一个星期、去别墅整个夏天、来住两天、离开一分钟，用 [на]{.ru} + 第四格：[на неде́лю, на всё ле́то, на два дня, на мину́ту]{.ru}。不能说 *[уе́хали всё ле́то]{.ru}*。

    第 2、9、14 题：完成体动词表示用多久做完，用 [за]{.ru} + 第四格：[за три дня, за час, за четы́ре часа́]{.ru}。

    第 3、7、12 题：未完成体动词表示动作本身进行多久，用不带前置词的第四格：[два́дцать мину́т, всю неде́лю, весь ве́чер]{.ru}；后两题也可以说 [в тече́ние всей неде́ли, в тече́ние всего́ ве́чера]{.ru}。

    第 4、10 题：多久以后用 [че́рез]{.ru} + 第四格：[че́рез две неде́ли, че́рез де́сять мину́т]{.ru}。

    第 5、13 题：多久以前用第四格 + [наза́д]{.ru}，[наза́д]{.ru} 放在后面：[год наза́д, пять лет наза́д]{.ru}。

    第 8、16 题：强调在一段时间之内多次发生，用 [в тече́ние]{.ru} + 第二格：[в тече́ние ме́сяца, в тече́ние всего́ семе́стра]{.ru}。'
