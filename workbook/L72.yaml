heading: 第 72 课　定向与不定向
groups:
- id: L72-01
  tags:
  - 运动动词现在时：定向与不定向
  task: 按主语写出四个运动动词的现在时。
  type: matrix
  cols:
  - 主语
  - '[идти́]{.ru}'
  - '[ходи́ть]{.ru}'
  - '[е́хать]{.ru}'
  - '[е́здить]{.ru}'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[иду́]{.ru}'
    - '[хожу́]{.ru}'
    - '[е́ду]{.ru}'
    - '[е́зжу]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[идёшь]{.ru}'
    - '[хо́дишь]{.ru}'
    - '[е́дешь]{.ru}'
    - '[е́здишь]{.ru}'
  - base: '[он / она́]{.ru}'
    cells:
    - '[он / она́]{.ru}'
    - '[идёт]{.ru}'
    - '[хо́дит]{.ru}'
    - '[е́дет]{.ru}'
    - '[е́здит]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[идём]{.ru}'
    - '[хо́дим]{.ru}'
    - '[е́дем]{.ru}'
    - '[е́здим]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[идёте]{.ru}'
    - '[хо́дите]{.ru}'
    - '[е́дете]{.ru}'
    - '[е́здите]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[иду́т]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́дут]{.ru}'
    - '[е́здят]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[идёт]{.ru}'
    - '[хо́дит]{.ru}'
    - '[е́дет]{.ru}'
    - '[е́здит]{.ru}'
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[иду́т]{.ru}'
    - '[хо́дят]{.ru}'
    - '[е́дут]{.ru}'
    - '[е́здят]{.ru}'
  why: |
    第 1 题：[ходи́ть]{.ru} 第一人称 [д → ж]{.ru}：[хожу́]{.ru}；[е́здить]{.ru} 第一人称 [зд → зж]{.ru}：[е́зжу]{.ru}。
    第 1–8 题：[идти́]{.ru} 重音在词尾，写 [ё]{.ru}：[идёшь, идёт]{.ru}；[е́хать]{.ru} 词干变成 [е́д-]{.ru}，重音不动：[е́ду, е́дешь]{.ru}；[ходи́ть]{.ru} 从第二人称起重音前移：[хо́дишь, хо́дят]{.ru}；[е́здить]{.ru} 重音一直在词干：[е́здишь, е́здят]{.ru}。
    第 6、8 题：第二变位的 [ходи́ть, е́здить]{.ru} 复数第三人称是 [-ят]{.ru}，第一变位的 [идти́, е́хать]{.ru} 是 [-ут]{.ru}。
- id: L72-02
  tags:
  - 定向与不定向：动作性质
  task: 句中的运动动词表示什么？按意思归类。
  type: classify
  bins:
  - 正在路上（[идёт, шёл]{.ru}）
  - 经常去（[ча́сто хо́дит]{.ru}）
  - 去了一趟（[ходи́л]{.ru}）
  - 各处走、泛指走路（[хо́дит по]{.ru}）
  items:
  - text: '[Сейча́с мы идём на уро́к.]{.ru}'
    answer: 正在路上（[идёт, шёл]{.ru}）
  - text: '[Я ка́ждый день хожу́ в университе́т.]{.ru}'
    answer: 经常去（[ча́сто хо́дит]{.ru}）
  - text: '[Ми́ша ходи́л в Эрмита́ж.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Ве́чером он е́хал домо́й и чита́л.]{.ru}'
    answer: 正在路上（[идёт, шёл]{.ru}）
  - text: '[Мы бу́дем ходи́ть по Эрмита́жу.]{.ru}'
    answer: 各处走、泛指走路（[хо́дит по]{.ru}）
  - text: '[Ми́ша мно́го хо́дит пешко́м.]{.ru}'
    answer: 各处走、泛指走路（[хо́дит по]{.ru}）
  - text: '[Обы́чно Ван Лэй и А́нна е́здят в университе́т вме́сте.]{.ru}'
    answer: 经常去（[ча́сто хо́дит]{.ru}）
  - text: '[Во вто́рник Ван Лэй е́хал на метро́ оди́н.]{.ru}'
    answer: 正在路上（[идёт, шёл]{.ru}）
  - text: '[Я ка́ждый день хожу́ по Москве́.]{.ru}'
    answer: 各处走、泛指走路（[хо́дит по]{.ru}）
  - text: '[Вы идёте на факульте́т?]{.ru}'
    answer: 正在路上（[идёт, шёл]{.ru}）
  - text: '[В суббо́ту мы е́здили на да́чу.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Ба́бушка лю́бит ходи́ть по па́рку.]{.ru}'
    answer: 各处走、泛指走路（[хо́дит по]{.ru}）
  - text: '[Куда́ ты е́дешь?]{.ru}'
    answer: 正在路上（[идёт, шёл]{.ru}）
  - text: '[Па́па ча́сто е́здит в Петербу́рг.]{.ru}'
    answer: 经常去（[ча́сто хо́дит]{.ru}）
  - text: '[Вчера́ мы ходи́ли в кино́.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Ты ча́сто хо́дишь в бассе́йн?]{.ru}'
    answer: 经常去（[ча́сто хо́дит]{.ru}）
  - text: '[Ле́том Ю́ми е́здила в Япо́нию.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Де́ти ходи́ли по музе́ю це́лый день.]{.ru}'
    answer: 各处走、泛指走路（[хо́дит по]{.ru}）
  why: |
    第 1、4、8、10、13 题：定向动词 [идти́, е́хать]{.ru}：此刻或过去某时朝一个方向走在路上。
    第 2、7、14、16 题：不定向动词表示经常、有规律地去：[ка́ждый день, обы́чно, ча́сто]{.ru}。
    第 3、11、15、17 题：不定向动词过去时表示去了一趟又回来，等于 [был]{.ru} + 处所。
    第 5、6、9、12、18 题：[ходи́ть по]{.ru} + 第三格表示在某处到处走，没有固定方向；第 6 题“米沙走路走得多”泛指走路这种动作。这些都用不定向动词，即使是一次（第 18 题）。
- id: L72-03
  tags:
  - 定向与不定向：现在时选择
  task: 根据句意选用括号里的一个形式填空。
  type: fill
  items:
  - stem: Сейча́с я ___ в библиоте́ку.
    hint: иду́ / хожу́
    accept:
    - иду́
  - stem: Я ка́ждый день ___ в библиоте́ку.
    hint: иду́ / хожу́
    accept:
    - хожу́
  - stem: Смотри́, вот ___ наш авто́бус!
    hint: идёт / хо́дит
    accept:
    - идёт
  - stem: Мы обы́чно ___ на да́чу на электри́чке.
    hint: е́дем / е́здим
    accept:
    - е́здим
  - stem: Куда́ вы сейча́с ___?
    hint: е́дете / е́здите
    accept:
    - е́дете
  - stem: Ты ча́сто ___ в теа́тр?
    hint: идёшь / хо́дишь
    accept:
    - хо́дишь
  - stem: Мой брат лю́бит ___ по го́роду.
    hint: идти́ / ходи́ть
    accept:
    - ходи́ть
  - stem: За́втра мы ___ в Петербу́рг. Биле́ты уже́ есть.
    hint: е́дем / е́здим
    accept:
    - е́дем
  - stem: Ми́ша ещё ма́ленький, он ___ в шко́лу с ма́мой.
    hint: идёт / хо́дит
    accept:
    - хо́дит
  - stem: — Ты куда́? — Я ___ домо́й.
    hint: иду́ / хожу́
    accept:
    - иду́
  - stem: Ба́бушка ре́дко ___ в центр на метро́.
    hint: е́дет / е́здит
    accept:
    - е́здит
  - stem: 'Посмотри́ в окно́: ___ снег.'
    hint: идёт / хо́дит
    accept:
    - идёт
  - stem: Студе́нты ___ по Эрмита́жу и смо́трят карти́ны.
    hint: иду́т / хо́дят
    accept:
    - хо́дят
  - stem: Сего́дня Ван Лэй ___ в университе́т оди́н.
    hint: е́дет / е́здит
    accept:
    - е́дет
  why: |
    第 1、5、10、14 题：[сейча́с, сего́дня]{.ru} 或“你去哪儿？我回家”说的是此刻朝一个方向去，用定向动词。
    第 2、4、6、9、11 题：[ка́ждый день, обы́чно, ча́сто, ре́дко]{.ru} 或经常性的事实，用不定向动词；第 9 题“上学时总是和妈妈一起去”是经常的事。
    第 3 题：车辆行驶、此刻开过来，用 [идёт]{.ru}。第 12 题：下雪只用 [идти́]{.ru}。
    第 7、13 题：[по]{.ru} + 第三格“到处走”用 [ходи́ть]{.ru}。
    第 8 题：[за́втра]{.ru} 一次、朝一个方向的安排，现在时定向动词可以表示最近的打算：[За́втра мы е́дем в Петербу́рг.]{.ru}
- id: L72-04
  tags:
  - 定向与不定向：当……的时候
  task: 根据句意选用括号里的一个形式填空。
  type: fill
  items:
  - stem: Когда́ я ___ в университе́т, я уви́дел Пье́ра.
    hint: шёл / ходи́л
    accept:
    - шёл
  - stem: Вчера́ я ___ в университе́т пешко́м.
    hint: шёл / ходи́л
    accept:
    - ходи́л
  - stem: Когда́ мы ___ на да́чу, шёл дождь.
    hint: е́хали / е́здили
    accept:
    - е́хали
  - stem: В суббо́ту мы ___ на да́чу.
    hint: е́хали / е́здили
    accept:
    - е́здили
  - stem: Когда́ А́нна ___ ми́мо кафе́, она́ заме́тила Ка́тю.
    hint: шла / ходи́ла
    accept:
    - шла
  - stem: Когда́ Ми́ша ___ домо́й из шко́лы, он уви́дел ко́шку.
    hint: шёл / ходи́л
    accept:
    - шёл
  - stem: В про́шлом году́ па́па ча́сто ___ в Петербу́рг.
    hint: е́хал / е́здил
    accept:
    - е́здил
  - stem: Когда́ Ю́ми ___ в метро́, она́ чита́ла.
    hint: е́хала / е́здила
    accept:
    - е́хала
  - stem: По доро́ге на рабо́ту па́па ___ ми́мо по́чты.
    hint: шёл / ходи́л
    accept:
    - шёл
  - stem: — Где вы бы́ли вчера́? — Мы ___ в галере́ю.
    hint: шли / ходи́ли
    accept:
    - ходи́ли
  - stem: Когда́ студе́нты ___ на экску́рсию, они́ смея́лись.
    hint: е́хали / е́здили
    accept:
    - е́хали
  - stem: Ра́ньше я ка́ждую суббо́ту ___ в бассе́йн.
    hint: шёл / ходи́л
    accept:
    - ходи́л
  why: |
    第 1、3、5、6、8、11 题：[когда́]{.ru} 引出的部分是另一件事的背景，说的是“正在路上”，用 [шёл, е́хал]{.ru}，不用 [ходи́л, е́здил]{.ru}。
    第 9 题：[по доро́ге]{.ru}“在路上”，说的也是路上的过程：[шёл ми́мо по́чты]{.ru}。
    第 2、4、10 题：说的是去了一趟又回来，用 [ходи́л, е́здил]{.ru}；第 2 题不能说 [Вчера́ я шёл в университе́т]{.ru}，那是话没说完的“昨天我正往学校走”。
    第 7、12 题：过去经常去，用不定向动词。
