heading: 第 52 课　人称代词第三格与“喜欢”的表达
groups:
- id: L52-01
  tags: [人称代词第三格：与其他格对照]
  task: 写出人称代词和疑问代词的各格形式，第三格是本课新学的。
  type: matrix
  cols: [第一格, 第二格, 第四格, '第六格（带 [о]{.ru}）', 第三格]
  given: [0]
  rows:
  - {base: '[я]{.ru}', cells: ['[я]{.ru}', '[меня́]{.ru}', '[меня́]{.ru}', '[обо мне]{.ru}', '[мне]{.ru}']}
  - {base: '[ты]{.ru}', cells: ['[ты]{.ru}', '[тебя́]{.ru}', '[тебя́]{.ru}', '[о тебе́]{.ru}', '[тебе́]{.ru}']}
  - {base: '[он]{.ru}', cells: ['[он]{.ru}', '[его́]{.ru}', '[его́]{.ru}', '[о нём]{.ru}', '[ему́]{.ru}']}
  - {base: '[она́]{.ru}', cells: ['[она́]{.ru}', '[её]{.ru}', '[её]{.ru}', '[о ней]{.ru}', '[ей]{.ru}']}
  - {base: '[мы]{.ru}', cells: ['[мы]{.ru}', '[нас]{.ru}', '[нас]{.ru}', '[о нас]{.ru}', '[нам]{.ru}']}
  - {base: '[вы]{.ru}', cells: ['[вы]{.ru}', '[вас]{.ru}', '[вас]{.ru}', '[о вас]{.ru}', '[вам]{.ru}']}
  - {base: '[они́]{.ru}', cells: ['[они́]{.ru}', '[их]{.ru}', '[их]{.ru}', '[о них]{.ru}', '[им]{.ru}']}
  - {base: '[кто]{.ru}', cells: ['[кто]{.ru}', '[кого́]{.ru}', '[кого́]{.ru}', '[о ком]{.ru}', '[кому́]{.ru}']}
  - {base: '[что]{.ru}', cells: ['[что]{.ru}', '[чего́]{.ru}', '[что]{.ru}', '[о чём]{.ru}', '[чему́]{.ru}']}
  why: |
    第 1、2 题：第三格和第六格同形：[мне, тебе́]{.ru}；第六格前 [о]{.ru} 要说 [обо мне]{.ru}。
    第 3、4、7 题：第三格 [ему́, ей, им]{.ru} 不带前置词时没有 [н-]{.ru}；第六格总带前置词，所以是 [о нём, о ней, о них]{.ru}。[он]{.ru} 和 [оно́]{.ru} 第三格都是 [ему́]{.ru}。
    第 5、6 题：[мы, вы]{.ru} 第三格 [нам, вам]{.ru}，和第二、四、六格的 [нас, вас]{.ru} 不同。
    第 8、9 题：[кто, что]{.ru} 第三格是 [кому́, чему́]{.ru}，重音在词尾。
- id: L52-02
  tags: [“喜欢”句型：喜欢者与被喜欢对象]
  task: 找出句中喜欢的人和被喜欢的东西，喜欢的人写出第一格（原形）。
  type: matrix
  cols: [句子, 喜欢的人（第一格）, 被喜欢的东西]
  given: [0]
  rows:
  - {base: '[Ми́ше нра́вится футбо́л.]{.ru}', cells: ['[Ми́ше нра́вится футбо́л.]{.ru}', '[Ми́ша]{.ru}', '[футбо́л]{.ru}']}
  - {base: '[Мне нра́вятся блины́.]{.ru}', cells: ['[Мне нра́вятся блины́.]{.ru}', '[я]{.ru}', '[блины́]{.ru}']}
  - {base: '[Па́пе нра́вится э́та пе́сня.]{.ru}', cells: ['[Па́пе нра́вится э́та пе́сня.]{.ru}', '[па́па]{.ru}', '[пе́сня]{.ru}']}
  - {base: '[Москва́ нра́вится А́нне.]{.ru}', cells: ['[Москва́ нра́вится А́нне.]{.ru}', '[А́нна]{.ru}', '[Москва́]{.ru}']}
  - {base: '[Ей нра́вится о́сень.]{.ru}', cells: ['[Ей нра́вится о́сень.]{.ru}', '[она́]{.ru}', '[о́сень]{.ru}']}
  - {base: '[Нам понра́вился Кремль.]{.ru}', cells: ['[Нам понра́вился Кремль.]{.ru}', '[мы]{.ru}', '[Кремль]{.ru}']}
  - {base: '[Ба́бушке не нра́вится дождь.]{.ru}', cells: ['[Ба́бушке не нра́вится дождь.]{.ru}', '[ба́бушка]{.ru}', '[дождь]{.ru}']}
  - {base: '[Тебе́ нра́вится ры́ба?]{.ru}', cells: ['[Тебе́ нра́вится ры́ба?]{.ru}', '[ты]{.ru}', '[ры́ба]{.ru}']}
  - {base: '[Пье́ру нра́вилась ру́сская ку́хня.]{.ru}', cells: ['[Пье́ру нра́вилась ру́сская ку́хня.]{.ru}', '[Пьер]{.ru}', '[ку́хня]{.ru}']}
  - {base: '[Им нра́вятся моско́вские па́рки.]{.ru}', cells: ['[Им нра́вятся моско́вские па́рки.]{.ru}', '[они́]{.ru}', '[па́рки]{.ru}']}
  - {base: '[Ему́ нра́вилось чита́ть.]{.ru}', cells: ['[Ему́ нра́вилось чита́ть.]{.ru}', '[он]{.ru}', '[чита́ть]{.ru}']}
  - {base: '[Мари́и Никола́евне нра́вится мя́со?]{.ru}', cells: ['[Мари́и Никола́евне нра́вится мя́со?]{.ru}', '[Мари́я Никола́евна]{.ru}', '[мя́со]{.ru}']}
  - {base: '[Вам нра́вится снег?]{.ru}', cells: ['[Вам нра́вится снег?]{.ru}', '[вы]{.ru}', '[снег]{.ru}']}
  - {base: '[Учи́телю понра́вилось моё письмо́.]{.ru}', cells: ['[Учи́телю понра́вилось моё письмо́.]{.ru}', '[учи́тель]{.ru}', '[письмо́]{.ru}']}
  why: |
    第 1–14 题：[нра́виться]{.ru} 句里喜欢的人用第三格（[Ми́ше, мне, па́пе, А́нне, ей…]{.ru}），被喜欢的东西才是第一格主语。找主语要看哪个词是第一格，不看词序：第 4 题 [Москва́]{.ru} 在句首，[А́нне]{.ru} 在句尾，喜欢的人仍是 [А́нна]{.ru}。
    第 9、10、14 题：动词的形式跟着被喜欢的东西变：[нра́вилась ку́хня, нра́вятся па́рки, понра́вилось письмо́]{.ru}。
    第 11 题：被喜欢的是一个动作（不定式），动词用中性 [нра́вилось]{.ru}。
- id: L52-03
  tags: [“喜欢”句型：动词与主语一致]
  task: 按被喜欢的东西写出 [нра́виться]{.ru} 的现在时和过去时。
  type: matrix
  cols: [被喜欢的东西, 现在时, 过去时]
  given: [0]
  rows:
  - {base: '[Кремль]{.ru}', cells: ['[Кремль]{.ru}', '[нра́вится]{.ru}', '[нра́вился]{.ru}']}
  - {base: '[Москва́]{.ru}', cells: ['[Москва́]{.ru}', '[нра́вится]{.ru}', '[нра́вилась]{.ru}']}
  - {base: '[метро́]{.ru}', cells: ['[метро́]{.ru}', '[нра́вится]{.ru}', '[нра́вилось]{.ru}']}
  - {base: '[блины́]{.ru}', cells: ['[блины́]{.ru}', '[нра́вятся]{.ru}', '[нра́вились]{.ru}']}
  - {base: '[пого́да]{.ru}', cells: ['[пого́да]{.ru}', '[нра́вится]{.ru}', '[нра́вилась]{.ru}']}
  - {base: '[мя́со]{.ru}', cells: ['[мя́со]{.ru}', '[нра́вится]{.ru}', '[нра́вилось]{.ru}']}
  - {base: '[пе́сни]{.ru}', cells: ['[пе́сни]{.ru}', '[нра́вятся]{.ru}', '[нра́вились]{.ru}']}
  - {base: '[дождь]{.ru}', cells: ['[дождь]{.ru}', '[нра́вится]{.ru}', '[нра́вился]{.ru}']}
  - {base: '[о́сень]{.ru}', hint: f, cells: ['[о́сень]{.ru}', '[нра́вится]{.ru}', '[нра́вилась]{.ru}']}
  - {base: '[чита́ть]{.ru}', hint: 不定式, cells: ['[чита́ть]{.ru}', '[нра́вится]{.ru}', '[нра́вилось]{.ru}']}
  - {base: '[па́рки]{.ru}', cells: ['[па́рки]{.ru}', '[нра́вятся]{.ru}', '[нра́вились]{.ru}']}
  - {base: '[Пеки́н]{.ru}', cells: ['[Пеки́н]{.ru}', '[нра́вится]{.ru}', '[нра́вился]{.ru}']}
  - {base: '[ры́ба]{.ru}', cells: ['[ры́ба]{.ru}', '[нра́вится]{.ru}', '[нра́вилась]{.ru}']}
  - {base: '[пальто́]{.ru}', hint: n, new: true, gloss: 大衣, cells: ['[пальто́]{.ru}', '[нра́вится]{.ru}', '[нра́вилось]{.ru}']}
  - {base: '[гуля́ть]{.ru}', hint: 不定式, cells: ['[гуля́ть]{.ru}', '[нра́вится]{.ru}', '[нра́вилось]{.ru}']}
  - {base: '[ру́сские фи́льмы]{.ru}', cells: ['[ру́сские фи́льмы]{.ru}', '[нра́вятся]{.ru}', '[нра́вились]{.ru}']}
  why: |
    第 1–16 题：现在时只用两个形式：单数主语 [нра́вится]{.ru}，复数主语 [нра́вятся]{.ru}。过去时按主语的性和数：阳性 [нра́вился]{.ru}、阴性 [нра́вилась]{.ru}、中性 [нра́вилось]{.ru}、复数 [нра́вились]{.ru}。
    第 3、14 题：[метро́, пальто́]{.ru} 不变格，是中性：[нра́вилось]{.ru}。第 8、9 题：[дождь]{.ru} 是阳性，[о́сень]{.ru} 是阴性，要先判断以 [-ь]{.ru} 结尾的名词的性。
    第 10、15 题：被喜欢的是动作，现在时 [нра́вится]{.ru}，过去时一律用中性 [нра́вилось]{.ru}。
    [-ся]{.ru} 在辅音后写 [-ся]{.ru}（[нра́вится, нра́вился]{.ru}），在元音后写 [-сь]{.ru}（[нра́вилась, нра́вилось, нра́вились]{.ru}）。
- id: L52-04
  tags: [“喜欢”句型：喜欢者用第三格]
  task: 把括号里表示喜欢者的词变成第三格。
  type: fill
  items:
  - {stem: '___ нра́вится Москва́.', hint: А́нна, accept: [А́нне]}
  - {stem: '___ нра́вятся блины́.', hint: я, accept: [мне]}
  - {stem: '___ нра́вится футбо́л.', hint: Ми́ша, accept: [Ми́ше]}
  - {stem: '___ нра́вится ру́сская ку́хня?', hint: вы, accept: [вам]}
  - {stem: '___ не нра́вится дождь.', hint: ба́бушка, accept: [ба́бушке]}
  - {stem: '___ понра́вился Кремль.', hint: Пьер, accept: [Пье́ру]}
  - {stem: '___ нра́вятся ру́сские пе́сни.', hint: мы, accept: [нам]}
  - {stem: '___ нра́вится чита́ть.', hint: па́па, accept: [па́пе]}
  - {stem: '___ нра́вится э́та пого́да?', hint: ты, accept: [тебе́]}
  - {stem: '___ нра́вилась Москва́.', hint: они́, accept: [им]}
  - {stem: '___ нра́вится мя́со.', hint: брат, accept: [бра́ту]}
  - {stem: '___ нра́вится о́сень.', hint: он, accept: [ему́]}
  - {stem: '___ нра́вится Пеки́н.', hint: Мари́я Никола́евна, accept: [Мари́и Никола́евне]}
  - {stem: '___ нра́вятся ко́шки.', hint: она́, accept: [ей]}
  - {stem: '___ понра́вилась э́та кни́га.', hint: учи́тель, accept: [учи́телю]}
  - {stem: '___ нра́вится гуля́ть в па́рке.', hint: дочь, accept: [до́чери]}
  why: |
    第 1–16 题：[нра́виться]{.ru} 句里喜欢的人用第三格，不用第一格；动词形式只看被喜欢的东西，和喜欢的人无关。
    第 2、4、7、9、10、12、14 题：人称代词第三格：[мне, вам, нам, тебе́, им, ему́, ей]{.ru}；不带前置词，所以不加 [н-]{.ru}。
    第 1、5、13 题：阴性 [-а]{.ru} 变 [-е]{.ru}，[-ия]{.ru} 变 [-ии]{.ru}：[А́нне, ба́бушке, Мари́и Никола́евне]{.ru}；第 3、8 题阳性 [Ми́ша, па́па]{.ru} 也变 [-е]{.ru}。
    第 6、11、15 题：阳性 [-у / -ю]{.ru}：[Пье́ру, бра́ту, учи́телю]{.ru}。第 16 题：[дочь → до́чери]{.ru}。
