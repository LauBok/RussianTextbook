heading: 第 15 课　变成前置词和副词的副动词
groups:
- id: B3-L15-01
  lessons:
  - B3-L15
  tags:
  - 前置词化的副动词：支配的格
  task: 写出前置词后面的词组。
  type: matrix
  cols:
  - 前置词 + 第一格
  - 词组
  given:
  - 0
  rows:
  - base: '[благодаря́ + по́мощь друзе́й]{.ru}'
    cells:
    - '[благодаря́ + по́мощь друзе́й]{.ru}'
    - '[по́мощи друзе́й]{.ru}'
  - base: '[благодаря́ + хоро́шая пого́да]{.ru}'
    cells:
    - '[благодаря́ + хоро́шая пого́да]{.ru}'
    - '[хоро́шей пого́де]{.ru}'
  - base: '[благодаря́ + на́ши учителя́]{.ru}'
    cells:
    - '[благодаря́ + на́ши учителя́]{.ru}'
    - '[на́шим учителя́м]{.ru}'
  - base: '[несмотря́ на + плоха́я пого́да]{.ru}'
    cells:
    - '[несмотря́ на + плоха́я пого́да]{.ru}'
    - '[плоху́ю пого́ду]{.ru}'
  - base: '[несмотря́ на + си́льный дождь]{.ru}'
    cells:
    - '[несмотря́ на + си́льный дождь]{.ru}'
    - '[си́льный дождь]{.ru}'
  - base: '[несмотря́ на + все тру́дности]{.ru}'
    cells:
    - '[несмотря́ на + все тру́дности]{.ru}'
    - '[все тру́дности]{.ru}'
  - base: '[су́дя по + э́ти ци́фры]{.ru}'
    cells:
    - '[су́дя по + э́ти ци́фры]{.ru}'
    - '[э́тим ци́фрам]{.ru}'
  - base: '[су́дя по + его́ слова́]{.ru}'
    cells:
    - '[су́дя по + его́ слова́]{.ru}'
    - '[его́ слова́м]{.ru}'
  - base: '[су́дя по + фотогра́фии]{.ru}'
    cells:
    - '[су́дя по + фотогра́фии]{.ru}'
    - '[фотогра́фиям]{.ru}'
  - base: '[включа́я + на́ша учи́тельница]{.ru}'
    cells:
    - '[включа́я + на́ша учи́тельница]{.ru}'
    - '[на́шу учи́тельницу]{.ru}'
  - base: '[включа́я + де́ти]{.ru}'
    cells:
    - '[включа́я + де́ти]{.ru}'
    - '[дете́й]{.ru}'
  - base: '[начина́я с + 1941 год]{.ru}'
    cells:
    - '[начина́я с + 1941 год]{.ru}'
    - '[1941 го́да]{.ru}'
  - base: '[начина́я с + пе́рвый курс]{.ru}'
    cells:
    - '[начина́я с + пе́рвый курс]{.ru}'
    - '[пе́рвого ку́рса]{.ru}'
  - base: '[начина́я с + сле́дующая неде́ля]{.ru}'
    cells:
    - '[начина́я с + сле́дующая неде́ля]{.ru}'
    - '[сле́дующей неде́ли]{.ru}'
  - base: '[спустя́ + не́сколько лет]{.ru}'
    cells:
    - '[спустя́ + не́сколько лет]{.ru}'
    - '[не́сколько лет]{.ru}'
  - base: '[спустя́ + два ме́сяца]{.ru}'
    cells:
    - '[спустя́ + два ме́сяца]{.ru}'
    - '[два ме́сяца]{.ru}'
  - base: '[спустя́ + неде́ля]{.ru}'
    cells:
    - '[спустя́ + неде́ля]{.ru}'
    - '[неде́лю]{.ru}'
  - base: '[начина́я с + сентя́брь]{.ru}'
    cells:
    - '[начина́я с + сентя́брь]{.ru}'
    - '[сентября́]{.ru}'
  - base: '[благодаря́ + его́ сове́т]{.ru}'
    cells:
    - '[благодаря́ + его́ сове́т]{.ru}'
    - '[его́ сове́ту]{.ru}'
  - base: '[включа́я + ба́бушка и де́душка]{.ru}'
    cells:
    - '[включа́я + ба́бушка и де́душка]{.ru}'
    - '[ба́бушку и де́душку]{.ru}'
  - base: '[несмотря́ на + её боле́знь]{.ru}'
    cells:
    - '[несмотря́ на + её боле́знь]{.ru}'
    - '[её боле́знь]{.ru}'
  - base: '[спустя́ + мину́та]{.ru}'
    cells:
    - '[спустя́ + мину́та]{.ru}'
    - '[мину́ту]{.ru}'
  - base: '[су́дя по + расска́зы друзе́й]{.ru}'
    cells:
    - '[су́дя по + расска́зы друзе́й]{.ru}'
    - '[расска́зам друзе́й]{.ru}'
  why: |-
    第 1–3 题：[благодаря́]{.ru} + 第三格：[по́мощи друзе́й, хоро́шей пого́де, на́шим учителя́м]{.ru}；不跟第四格（[благодаря́ дру́га]{.ru} 只能是副动词“感谢朋友”）。
    第 4–6 题：[несмотря́ на]{.ru} + 第四格：[плоху́ю пого́ду]{.ru}；阳性非动物名词和复数非动物名词的第四格同第一格：[си́льный дождь, все тру́дности]{.ru}。
    第 7–9 题：[су́дя по]{.ru} + 第三格：[э́тим ци́фрам, его́ слова́м, фотогра́фиям]{.ru}（[его́]{.ru} 不变）。
    第 10、11 题：[включа́я]{.ru} + 第四格：[на́шу учи́тельницу]{.ru}；动物名词复数第四格同第二格：[дете́й]{.ru}。
    第 12–14 题：[начина́я с]{.ru} + 第二格：[(с) 1941 го́да, пе́рвого ку́рса, сле́дующей неде́ли]{.ru}。
    第 15–17 题：[спустя́]{.ru} + 第四格：数量词组不变（[не́сколько лет, два ме́сяца]{.ru}），[неде́ля → неде́лю]{.ru}。
    第 18–23 题：混排：[(начина́я) с сентября́]{.ru}（第二格，重音在词尾），[благодаря́ его́ сове́ту]{.ru}（第三格），[включа́я ба́бушку и де́душку]{.ru}（第四格，[де́душка]{.ru} 按阴性 [-а]{.ru} 变格），[несмотря́ на её боле́знь]{.ru}（阴性 [-ь]{.ru} 第四格同第一格），[спустя́ мину́ту]{.ru}，[су́дя по расска́зам друзе́й]{.ru}。
- id: B3-L15-02
  lessons:
  - B3-L15
  tags:
  - благодаря́ / из-за́
  - несмотря́ на 与让步
  task: 原因和结果之间该用哪个前置词？归栏。
  type: classify
  bins:
  - благодаря́
  - из-за́
  - несмотря́ на
  items:
  - text: '[по́мощь друзе́й]{.ru}：按时完成了工作'
    answer: благодаря́
  - text: '[дождь]{.ru}：比赛取消了'
    answer: из-за́
  - text: '[плоха́я пого́да]{.ru}：我们还是去爬山了'
    answer: несмотря́ на
  - text: '[хоро́шая пого́да]{.ru}：我们登上了火山'
    answer: благодаря́
  - text: '[боле́знь]{.ru}：他没来上课'
    answer: из-за́
  - text: '[боле́знь]{.ru}：他还是来上课了'
    answer: несмотря́ на
  - text: '[горя́чие исто́чники]{.ru}：冬天也能在室外游泳'
    answer: благодаря́
  - text: '[пе́пел]{.ru}：飞机不能起飞'
    answer: из-за́
  - text: '[си́льный ве́тер]{.ru}：渔民还是出海了'
    answer: несмотря́ на
  - text: '[вертолёт]{.ru}：一个小时就到了山谷'
    answer: благодаря́
  - text: '[си́льный ве́тер]{.ru}：船没能出海'
    answer: из-за́
  - text: '[по́здний час]{.ru}：街上人还很多'
    answer: несмотря́ на
  - text: '[о́пыт врача́]{.ru}：病人很快康复了'
    answer: благодаря́
  - text: '[оши́бка]{.ru}：计算结果不对'
    answer: из-за́
  - text: '[большо́й риск]{.ru}：居民不愿离开'
    answer: несмотря́ на
  why: |-
    第 1、4、7、10、13 题：原因带来好结果，用 [благодаря́]{.ru} + 第三格：[благодаря́ по́мощи друзе́й, хоро́шей пого́де, горя́чим исто́чникам, вертолёту, о́пыту врача́]{.ru}。
    第 2、5、8、11、14 题：原因带来坏结果，用 [из-за́]{.ru} + 第二格：[из-за́ дождя́, боле́зни, пе́пла, си́льного ве́тра, оши́бки]{.ru}。
    第 3、6、9、12、15 题：结果和原因相反（“还是”“仍然”），是让步，用 [несмотря́ на]{.ru} + 第四格：[несмотря́ на плоху́ю пого́ду, боле́знь, си́льный ве́тер, по́здний час, большо́й риск]{.ru}。第 5、6 题和第 9、11 题名词相同，前置词看结果。
- id: B3-L15-03
  lessons:
  - B3-L15
  tags:
  - 前置词化的副动词：与副动词的区别
  - несмотря́ 与 не смотря́
  task: 句中的 [су́дя, благодаря́, включа́я, начина́я, спустя́, несмотря́ / не смотря́]{.ru} 是前置词还是副动词？归栏。
  type: classify
  bins:
  - 前置词
  - 副动词
  items:
  - text: '[Су́дя по его́ лицу́, он о́чень уста́л.]{.ru}'
    answer: 前置词
  - text: '[Су́дя о кни́ге по назва́нию, мо́жно оши́биться.]{.ru}'
    answer: 副动词
  - text: '[Благодаря́ дру́гу я сдал экза́мен.]{.ru}'
    answer: 前置词
  - text: '[Благодаря́ дру́га за по́мощь, я пожа́л ему́ ру́ку.]{.ru}'
    answer: 副动词
  - text: '[Все, включа́я дете́й, пошли́ в лес.]{.ru}'
    answer: 前置词
  - text: '[Включа́я свет, он уви́дел на столе́ письмо́.]{.ru}'
    answer: 副动词
  - text: '[Несмотря́ на дождь, мы пошли́ гуля́ть.]{.ru}'
    answer: 前置词
  - text: '[Он шёл, не смотря́ под но́ги.]{.ru}'
    answer: 副动词
  - text: '[Начина́я с понеде́льника, мы бу́дем занима́ться в но́вой аудито́рии.]{.ru}'
    answer: 前置词
  - text: '[Начина́я рабо́ту, он всегда́ пьёт ко́фе.]{.ru}'
    answer: 副动词
  - text: '[Спустя́ два го́да он верну́лся домо́й.]{.ru}'
    answer: 前置词
  - text: '[Не смотря́ на нас, она́ прошла́ ми́мо.]{.ru}'
    answer: 副动词
  - text: '[Су́дя по фотогра́фиям, там о́чень краси́во.]{.ru}'
    answer: 前置词
  - text: '[Благодаря́ ма́му за пода́рок, сын улыба́лся.]{.ru}'
    answer: 副动词
  - text: '[Все, включа́я учи́теля, смея́лись.]{.ru}'
    answer: 前置词
  why: |-
    第 1、3、5、7、9、11、13、15 题：前置词：后面跟固定的格（[по]{.ru} + 第三格、第三格、第四格、[на]{.ru} + 第四格、[с]{.ru} + 第二格），和句子主语没有关系：“判断”的不是 [он]{.ru}，“多亏”不是“感谢”。[несмотря́]{.ru} 连写。
    第 2、4、6、8、10、12、14 题：副动词：保留动词意义，动作的发出者就是句子的主语（或无人称句里不定式的发出者）：[су́дя о кни́ге]{.ru} 评判书，[благодаря́ дру́га, благодаря́ ма́му]{.ru} 感谢朋友、感谢妈妈（第四格），[включа́я свет]{.ru} 开灯，[не смотря́ под но́ги]{.ru} 不看脚下（分写），[начина́я рабо́ту]{.ru} 开始工作。
- id: B3-L15-04
  lessons:
  - B3-L15
  tags:
  - 副词化的副动词
  task: 句中的 [мо́лча, сто́я, си́дя, лёжа, шутя́]{.ru} 是副词还是副动词？归栏。
  type: classify
  bins:
  - 副词
  - 副动词
  items:
  - text: '[Тури́сты мо́лча смотре́ли на кра́тер.]{.ru}'
    answer: 副词
  - text: '[Сто́я у окна́, она́ смотре́ла на у́лицу.]{.ru}'
    answer: 副动词
  - text: '[Он всегда́ чита́ет лёжа.]{.ru}'
    answer: 副词
  - text: '[Си́дя в кафе́, мы разгова́ривали о Каза́ни.]{.ru}'
    answer: 副动词
  - text: '[В авто́бусе мне пришло́сь е́хать сто́я.]{.ru}'
    answer: 副词
  - text: '[Лёжа на пля́же, мы слу́шали шум мо́ря.]{.ru}'
    answer: 副动词
  - text: '[Он реши́л э́ту зада́чу шутя́.]{.ru}'
    answer: 副词
  - text: '[Шутя́ с друзья́ми, он забы́л о вре́мени.]{.ru}'
    answer: 副动词
  - text: '[Студе́нты слу́шали ле́кцию си́дя.]{.ru}'
    answer: 副词
  why: |-
    第 1、3、5、7、9 题：单独使用，说明动作的方式，是副词：[мо́лча]{.ru} 默默地，[лёжа]{.ru} 躺着，[сто́я]{.ru} 站着，[шутя́]{.ru} 轻而易举地，[си́дя]{.ru} 坐着；不用逗号隔开。
    第 2、4、6、8 题：带了自己的从属词（[у окна́, в кафе́, на пля́же, с друзья́ми]{.ru}），构成副动词短语，前后用逗号隔开。
- id: B3-L15-05
  lessons:
  - B3-L15
  tags:
  - 前置词化的副动词：句中填空
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Благодаря́ ___ мы бы́стро нашли́ доро́гу.
    hint: наш гид
    accept:
    - на́шему ги́ду
  - stem: Несмотря́ на ___, он пришёл на рабо́ту.
    hint: высо́кая температу́ра
    accept:
    - высо́кую температу́ру
  - stem: Су́дя по ___, за́втра бу́дет тепло́.
    hint: прогно́з пого́ды
    accept:
    - прогно́зу пого́ды
  - stem: Все, включа́я ___, сда́ли экза́мен.
    hint: А́нна и Ми́ша
    accept:
    - А́нну и Ми́шу
  - stem: Начина́я с ___, мы бу́дем занима́ться ка́ждый день.
    hint: э́та неде́ля
    accept:
    - э́той неде́ли
  - stem: Спустя́ ___ по́езд останови́лся.
    hint: полчаса́
    accept:
    - полчаса́
  why: |-
    第 1 题：[благодаря́]{.ru} + 第三格：[на́шему ги́ду]{.ru}。
    第 2 题：[несмотря́ на]{.ru} + 第四格：[высо́кую температу́ру]{.ru}。
    第 3 题：[су́дя по]{.ru} + 第三格：[прогно́зу пого́ды]{.ru}（[пого́ды]{.ru} 是第二格定语，不变）。
    第 4 题：[включа́я]{.ru} + 第四格：[А́нну и Ми́шу]{.ru}（[Ми́ша]{.ru} 按 [-а]{.ru} 变格）。
    第 5 题：[начина́я с]{.ru} + 第二格：[э́той неде́ли]{.ru}。
    第 6 题：[спустя́]{.ru} + 第四格，[полчаса́]{.ru} 不变。
