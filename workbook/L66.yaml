heading: 第 66 课　方位前置词
groups:
- id: L66-01
  tags:
  - 方位前置词 + 第五格：名词
  task: 写出方位前置词与名词组成的词组。
  type: matrix
  cols:
  - 前置词 + 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[под + стол]{.ru}'
    cells:
    - '[под + стол]{.ru}'
    - '[под столо́м]{.ru}'
  - base: '[над + стол]{.ru}'
    cells:
    - '[над + стол]{.ru}'
    - '[над столо́м]{.ru}'
  - base: '[за + дива́н]{.ru}'
    cells:
    - '[за + дива́н]{.ru}'
    - '[за дива́ном]{.ru}'
  - base: '[пе́ред + шкаф]{.ru}'
    cells:
    - '[пе́ред + шкаф]{.ru}'
    - '[пе́ред шка́фом]{.ru}'
  - base: '[под + крова́ть]{.ru}'
    cells:
    - '[под + крова́ть]{.ru}'
    - '[под крова́тью]{.ru}'
  - base: '[над + плита́]{.ru}'
    cells:
    - '[над + плита́]{.ru}'
    - '[над плито́й]{.ru}'
  - base: '[за + дом]{.ru}'
    cells:
    - '[за + дом]{.ru}'
    - '[за до́мом]{.ru}'
  - base: '[под + окно́]{.ru}'
    cells:
    - '[под + окно́]{.ru}'
    - '[под окно́м]{.ru}'
  - base: '[ря́дом с + батаре́я]{.ru}'
    cells:
    - '[ря́дом с + батаре́я]{.ru}'
    - '[ря́дом с батаре́ей]{.ru}'
  - base: '[ря́дом с + ко́мната]{.ru}'
    cells:
    - '[ря́дом с + ко́мната]{.ru}'
    - '[ря́дом с ко́мнатой]{.ru}'
  - base: '[ме́жду + окно́ и дверь]{.ru}'
    cells:
    - '[ме́жду + окно́ и дверь]{.ru}'
    - '[ме́жду окно́м и две́рью]{.ru}'
  - base: '[ме́жду + холоди́льник и плита́]{.ru}'
    cells:
    - '[ме́жду + холоди́льник и плита́]{.ru}'
    - '[ме́жду холоди́льником и плито́й]{.ru}'
  - base: '[пе́ред + уро́к]{.ru}'
    cells:
    - '[пе́ред + уро́к]{.ru}'
    - '[пе́ред уро́ком]{.ru}'
  - base: '[пе́ред + за́втрак]{.ru}'
    cells:
    - '[пе́ред + за́втрак]{.ru}'
    - '[пе́ред за́втраком]{.ru}'
  - base: '[пе́ред + обе́д]{.ru}'
    cells:
    - '[пе́ред + обе́д]{.ru}'
    - '[пе́ред обе́дом]{.ru}'
  - base: '[за + окно́]{.ru}'
    cells:
    - '[за + окно́]{.ru}'
    - '[за окно́м]{.ru}'
  why: |
    第 1–10 题：方位前置词回答 [где?]{.ru}，后面用第五格：[под столо́м, за дива́ном, над плито́й, под крова́тью]{.ru}。[плита́]{.ru} 词尾重读，写 [плито́й]{.ru}；[батаре́я]{.ru} 写 [батаре́ей]{.ru}。
    第 11、12 题：[ме́жду]{.ru} 后两个名词都用第五格，中间用 [и]{.ru}：[ме́жду окно́м и две́рью]{.ru}。
    第 13–15 题：[пе́ред]{.ru} 加表示活动的名词，表示时间“在……之前”：[пе́ред уро́ком, пе́ред за́втраком]{.ru}。
    第 16 题：固定搭配 [за окно́м]{.ru}“在窗外”。
- id: L66-02
  tags:
  - 方位前置词 + 第五格：人称代词
  task: 写出方位前置词与人称代词组成的词组。
  type: matrix
  cols:
  - 前置词 + 代词
  - 词组
  given:
  - 0
  rows:
  - base: '[пе́ред + я]{.ru}'
    cells:
    - '[пе́ред + я]{.ru}'
    - '[пе́редо мной]{.ru}'
  - base: '[над + ты]{.ru}'
    cells:
    - '[над + ты]{.ru}'
    - '[над тобо́й]{.ru}'
  - base: '[под + я]{.ru}'
    cells:
    - '[под + я]{.ru}'
    - '[подо мной]{.ru}'
  - base: '[ря́дом с + я]{.ru}'
    cells:
    - '[ря́дом с + я]{.ru}'
    - '[ря́дом со мной]{.ru}'
  - base: '[за + он]{.ru}'
    cells:
    - '[за + он]{.ru}'
    - '[за ним]{.ru}'
  - base: '[пе́ред + вы]{.ru}'
    cells:
    - '[пе́ред + вы]{.ru}'
    - '[пе́ред ва́ми]{.ru}'
  - base: '[над + мы]{.ru}'
    cells:
    - '[над + мы]{.ru}'
    - '[над на́ми]{.ru}'
  - base: '[ме́жду + мы]{.ru}'
    cells:
    - '[ме́жду + мы]{.ru}'
    - '[ме́жду на́ми]{.ru}'
  - base: '[за + она́]{.ru}'
    cells:
    - '[за + она́]{.ru}'
    - '[за ней]{.ru}'
  - base: '[под + они́]{.ru}'
    cells:
    - '[под + они́]{.ru}'
    - '[под ни́ми]{.ru}'
  - base: '[ря́дом с + ты]{.ru}'
    cells:
    - '[ря́дом с + ты]{.ru}'
    - '[ря́дом с тобо́й]{.ru}'
  - base: '[пе́ред + они́]{.ru}'
    cells:
    - '[пе́ред + они́]{.ru}'
    - '[пе́ред ни́ми]{.ru}'
  why: |
    第 1、3、4 题：在 [мной]{.ru} 前，[пе́ред, под, с]{.ru} 都加 [-о]{.ru}：[пе́редо мной, подо мной, со мной]{.ru}。
    第 5、9、10、12 题：第三人称代词在前置词后加 [н-]{.ru}：[за ним, за ней, под ни́ми, пе́ред ни́ми]{.ru}。
    第 2、6–8、11 题：[тобо́й, ва́ми, на́ми]{.ru} 前前置词不变：[над тобо́й, ря́дом с тобо́й]{.ru}。
- id: L66-03
  tags:
  - за / под：静态第五格与方向第四格
  task: 写出回答 [где?]{.ru} 和 [куда́?]{.ru} 的两个词组。
  type: matrix
  cols:
  - 前置词 + 名词
  - '[где?]{.ru}'
  - '[куда́?]{.ru}'
  given:
  - 0
  rows:
  - base: '[за + стол]{.ru}'
    cells:
    - '[за + стол]{.ru}'
    - '[за столо́м]{.ru}'
    - '[за стол]{.ru}'
  - base: '[под + крова́ть]{.ru}'
    cells:
    - '[под + крова́ть]{.ru}'
    - '[под крова́тью]{.ru}'
    - '[под крова́ть]{.ru}'
  - base: '[под + дива́н]{.ru}'
    cells:
    - '[под + дива́н]{.ru}'
    - '[под дива́ном]{.ru}'
    - '[под дива́н]{.ru}'
  - base: '[за + дом]{.ru}'
    cells:
    - '[за + дом]{.ru}'
    - '[за до́мом]{.ru}'
    - '[за дом]{.ru}'
  - base: '[за + шкаф]{.ru}'
    cells:
    - '[за + шкаф]{.ru}'
    - '[за шка́фом]{.ru}'
    - '[за шкаф]{.ru}'
  - base: '[под + стул]{.ru}'
    cells:
    - '[под + стул]{.ru}'
    - '[под сту́лом]{.ru}'
    - '[под стул]{.ru}'
  - base: '[за + дверь]{.ru}'
    cells:
    - '[за + дверь]{.ru}'
    - '[за две́рью]{.ru}'
    - '[за дверь]{.ru}'
  - base: '[под + по́лка]{.ru}'
    cells:
    - '[под + по́лка]{.ru}'
    - '[под по́лкой]{.ru}'
    - '[под по́лку]{.ru}'
  - base: '[под + таре́лка]{.ru}'
    cells:
    - '[под + таре́лка]{.ru}'
    - '[под таре́лкой]{.ru}'
    - '[под таре́лку]{.ru}'
  - base: '[под + маши́на]{.ru}'
    cells:
    - '[под + маши́на]{.ru}'
    - '[под маши́ной]{.ru}'
    - '[под маши́ну]{.ru}'
  - base: '[за + холоди́льник]{.ru}'
    cells:
    - '[за + холоди́льник]{.ru}'
    - '[за холоди́льником]{.ru}'
    - '[за холоди́льник]{.ru}'
  - base: '[за + дива́н]{.ru}'
    cells:
    - '[за + дива́н]{.ru}'
    - '[за дива́ном]{.ru}'
    - '[за дива́н]{.ru}'
  why: |
    第 1–12 题：[за, под]{.ru} 表示位置（[где?]{.ru}）用第五格，表示方向（[куда́?]{.ru}）用第四格，和 [в / на]{.ru} 的第六格、第四格对立一样。
    第 1–7、11、12 题：阳性和以 [-ь]{.ru} 结尾的阴性非动物名词，第四格同第一格：[за стол, под крова́ть, за дверь]{.ru}；第五格 [за столо́м, под крова́тью, за две́рью]{.ru}。
    第 8–10 题：阴性 [-а]{.ru} 名词第四格改 [-у]{.ru}，第五格改 [-ой]{.ru}：[под по́лку — под по́лкой]{.ru}。
- id: L66-04
  tags:
  - 方位前置词：按位置关系选择
  task: 按中文说明选用前置词，写出表示位置的词组。
  type: matrix
  cols:
  - 位置关系
  - 词组
  given:
  - 0
  rows:
  - base: 在桌子下面（[стол]{.ru}）
    cells:
    - 在桌子下面（[стол]{.ru}）
    - '[под столо́м]{.ru}'
  - base: 在灯下面（[ла́мпа]{.ru}）
    cells:
    - 在灯下面（[ла́мпа]{.ru}）
    - '[под ла́мпой]{.ru}'
  - base: 在沙发上方（[дива́н]{.ru}）
    cells:
    - 在沙发上方（[дива́н]{.ru}）
    - '[над дива́ном]{.ru}'
  - base: 在柜子前面（[шкаф]{.ru}）
    cells:
    - 在柜子前面（[шкаф]{.ru}）
    - '[пе́ред шка́фом]{.ru}'
  - base: 在房子后面（[дом]{.ru}）
    cells:
    - 在房子后面（[дом]{.ru}）
    - '[за до́мом]{.ru}'
  - base: 在冰箱旁边（[холоди́льник]{.ru}）
    cells:
    - 在冰箱旁边（[холоди́льник]{.ru}）
    - '[ря́дом с холоди́льником]{.ru}'
  - base: 在窗户和门之间（[окно́, дверь]{.ru}）
    cells:
    - 在窗户和门之间（[окно́, дверь]{.ru}）
    - '[ме́жду окно́м и две́рью]{.ru}'
  - base: 在床下面（[крова́ть]{.ru}）
    cells:
    - 在床下面（[крова́ть]{.ru}）
    - '[под крова́тью]{.ru}'
  - base: 在炉灶上方（[плита́]{.ru}）
    cells:
    - 在炉灶上方（[плита́]{.ru}）
    - '[над плито́й]{.ru}'
  - base: 在剧院前面（[теа́тр]{.ru}）
    cells:
    - 在剧院前面（[теа́тр]{.ru}）
    - '[пе́ред теа́тром]{.ru}'
  - base: 在门后面（[дверь]{.ru}）
    cells:
    - 在门后面（[дверь]{.ru}）
    - '[за две́рью]{.ru}'
  - base: 在书架旁边（[по́лка]{.ru}）
    cells:
    - 在书架旁边（[по́лка]{.ru}）
    - '[ря́дом с по́лкой]{.ru}'
  - base: 在大学和公园之间（[университе́т, парк]{.ru}）
    cells:
    - 在大学和公园之间（[университе́т, парк]{.ru}）
    - '[ме́жду университе́том и па́рком]{.ru}'
  - base: 在桌旁（吃饭）（[стол]{.ru}）
    cells:
    - 在桌旁（吃饭）（[стол]{.ru}）
    - '[за столо́м]{.ru}'
  - base: 在我们上方（[мы]{.ru}）
    cells:
    - 在我们上方（[мы]{.ru}）
    - '[над на́ми]{.ru}'
  - base: 在他前面（[он]{.ru}）
    cells:
    - 在他前面（[он]{.ru}）
    - '[пе́ред ним]{.ru}'
  why: |
    第 1、2、8 题：“在……下面”用 [под]{.ru}：[под столо́м, под ла́мпой, под крова́тью]{.ru}。
    第 3、9、15 题：“在……上方”（不接触）用 [над]{.ru}：[над дива́ном, над плито́й, над на́ми]{.ru}。东西放在表面上才用 [на]{.ru} + 第六格。
    第 4、10、16 题：“在……前面”用 [пе́ред]{.ru}；第 16 题加 [н-]{.ru}：[пе́ред ним]{.ru}。
    第 5、11 题：“在……后面”用 [за]{.ru}：[за до́мом, за две́рью]{.ru}。
    第 6、12 题：“在……旁边”用 [ря́дом с]{.ru}：[ря́дом с холоди́льником, ря́дом с по́лкой]{.ru}。
    第 7、13 题：“在……之间”用 [ме́жду]{.ru}，两个名词都用第五格。
    第 14 题：“在桌旁”吃饭、工作用 [за столо́м]{.ru}，不说 [ря́дом со столо́м]{.ru}。
- id: L66-05
  tags:
  - 方位前置词 + 第五格：名词
  - за / под：静态第五格与方向第四格
  task: 用括号里的名词填空：表示位置用第五格，表示方向用第四格。
  type: fill
  items:
  - stem: Ко́шка спит под ___.
    hint: дива́н
    accept:
    - дива́ном
  - stem: Ми́ша ста́вит су́мку под ___.
    hint: крова́ть
    accept:
    - крова́ть
  - stem: Су́мка стои́т под ___.
    hint: крова́ть
    accept:
    - крова́тью
  - stem: Мы сиди́м за ___ и обе́даем.
    hint: стол
    accept:
    - столо́м
  - stem: Тепе́рь все за ___!
    hint: стол
    accept:
    - стол
  - stem: Над ___ виси́т ла́мпа.
    hint: стол
    accept:
    - столо́м
  - stem: Ми́ша стои́т пе́ред ___.
    hint: дверь
    accept:
    - две́рью
  - stem: Па́па ста́вит маши́ну за ___.
    hint: дом
    accept:
    - дом
  - stem: Маши́на стои́т за ___.
    hint: дом
    accept:
    - до́мом
  - stem: Ма́ма ста́вит таре́лку под ___.
    hint: по́лка
    accept:
    - по́лку
  - stem: Холоди́льник стои́т ме́жду ___ и окно́м.
    hint: плита́
    accept:
    - плито́й
  - stem: Мы гуля́ем пе́ред ___.
    hint: у́жин
    accept:
    - у́жином
  - stem: Ми́ша положи́л мяч под ___.
    hint: стул
    accept:
    - стул
  - stem: Мяч лежи́т под ___.
    hint: стул
    accept:
    - сту́лом
  - stem: Ря́дом с ___ стои́т шкаф.
    hint: крова́ть
    accept:
    - крова́тью
  - stem: За ___ темно́.
    hint: окно́
    accept:
    - окно́м
  why: |
    第 1、3、9、14 题：[спать, стоя́ть, лежа́ть]{.ru} 说的是在哪儿，用第五格：[под дива́ном, под крова́тью, за до́мом, под сту́лом]{.ru}。
    第 2、8、10、13 题：[ста́вить, положи́ть]{.ru} 说的是放到哪儿去，用第四格：[под крова́ть, за дом, под по́лку, под стул]{.ru}。
    第 4、5 题：[сиде́ть за столо́м]{.ru} 是位置；[Тепе́рь все за стол!]{.ru} 是招呼大家入座，表示方向，用第四格。
    第 6、7、11、15 题：[над, пе́ред, ме́жду, ря́дом с]{.ru} 在本课只表示位置，用第五格。
    第 12 题：[пе́ред]{.ru} 表示时间“在……之前”：[пе́ред у́жином]{.ru}。
    第 16 题：[за окно́м]{.ru}“在窗外”，用第五格。
