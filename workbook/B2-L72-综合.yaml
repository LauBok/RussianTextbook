  tags:
  - 总复习：连接词与转述
  recycles:
  - B2-L64-01
  - B2-L65-综合-c
  task: 填入连接词（或关联词）。
  type: fill
  items:
  - stem: Мы оста́лись до́ма, ___ шёл си́льный дождь.
    accept:
    - так как
    - потому́ что
  - stem: ___ Ван Лэй о́чень уста́л, он занима́лся до ве́чера.
    accept:
    - хотя́
    - несмотря́ на то что
  - stem: Подожди́ здесь, ___ я не верну́сь.
    accept:
    - пока́
  - stem: Она́ смотре́ла на меня́ так, ___ не узнава́ла.
    accept:
    - как бу́дто
  - stem: Ма́ма попроси́ла, ___ Ми́ша купи́л хлеб.
    accept:
    - что́бы
  - stem: Ди́ма спроси́л, придёт ___ Ю́ми на вечери́нку.
    accept:
    - ли
  - stem: Я пришёл, ___ попроща́ться.
    accept:
    - что́бы
  - stem: Мы гуля́ли, ___ не ста́ло темно́.
    accept:
    - пока́
  - stem: Бы́ло о́чень хо́лодно, ___ мы ско́ро пошли́ домо́й.
    accept:
    - так что
  - stem: ___ я знал, что ты бо́лен, я бы пришёл.
    accept:
    - е́сли бы
  - stem: Э́то дом, ___ жил Пу́шкин.
    accept:
    - в кото́ром
    - где
  - stem: Ю́ми сказа́ла, ___ уже́ купи́ла биле́ты.
    accept:
    - что
  - stem: Он говори́т по-ру́сски так, ___ он ру́сский.
    accept:
    - как бу́дто
  - stem: Учи́тель спроси́л, не забы́л ___ я тетра́дь.
    accept:
    - ли
  - stem: 'Пьер не знал, ___ начина́ется конце́рт: в семь и́ли в во́семь.'
    accept:
    - когда́
    - во ско́лько
  why: '第 1 题：后半句说原因：[так как]{.ru}（也可用 [потому́ что]{.ru}）。

    第 9 题：后半句说结果：[так что]{.ru}。

    第 2 题：虽然累，还是学到晚上：让步 [хотя́]{.ru}（书面也说 [несмотря́ на то что]{.ru}）。

    第 3、8 题：“直到……为止”：[пока́ не]{.ru}，[не]{.ru} 已在句中：[пока́ я не верну́сь, пока́ не ста́ло темно́]{.ru}。

    第 4、13 题：“好像……似的”：[как бу́дто]{.ru}，说的不是事实。

    第 5 题：转述请求：[что́бы]{.ru} + 过去时形式 [купи́л]{.ru}。

    第 7 题：表示目的，主语相同：[что́бы]{.ru} + 不定式。

    第 6、14 题：转述一般疑问句用 [ли]{.ru}，放在动词后；带 [не]{.ru} 的问句 [не]{.ru} 和动词一起在 [ли]{.ru} 前：[не забы́л ли я]{.ru}。

    第 10 题：后半句有 [бы]{.ru}，表示与事实相反的条件：[е́сли бы]{.ru} + 过去时。

    第 11 题：定语从句：[дом, в кото́ром…]{.ru}（[кото́рый]{.ru} 阳性第六格），也可用 [где]{.ru}。

    第 12 题：转述陈述句用 [что]{.ru}。

    第 15 题：转述特殊疑问句保留疑问词：[когда́]{.ru}（或 [во ско́лько]{.ru}），不加 [ли]{.ru}。'
