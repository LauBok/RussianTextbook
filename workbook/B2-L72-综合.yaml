  why: '第 1、9 题：[-овать]{.ru} 动词变位时 [-ова-]{.ru} 换成 [-у-]{.ru}：[рису́ю, нарису́й, сове́тую, посове́туй]{.ru}；过去时保留 [-ова-]{.ru}：[нарисова́л]{.ru}。

    第 2、8 题：[дава́ть, встава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[даю́, встаю́]{.ru}；完成体 [дать]{.ru} 特殊：[дам, дай, дал]{.ru}；[встать — вста́ну, встань]{.ru}。

    第 3 题：第一变位的交替贯穿所有人称：[пишу́, пи́шешь]{.ru}，重音从第二人称起前移。

    第 4、7、12 题：第二变位的交替只在第一人称单数：[гото́влю — гото́вишь, куплю́ — ку́пишь, прошу́ — про́сишь]{.ru}；命令式和过去时没有交替：[пригото́вь, купи́, попроси́л]{.ru}。

    第 5、6、10、11 题：带前缀的运动动词：未完成体 [приходи́ть, приноси́ть, отвози́ть, переходи́ть]{.ru} 有交替（[прихожу́, приношу́, отвожу́]{.ru}）；完成体 [прийти́, перейти́]{.ru} 的将来时 [приду́, перейду́]{.ru}，过去时 [пришёл, перешёл]{.ru}；[принёс, отвёз]{.ru} 的过去时没有 [-л]{.ru}。'
