  tags:
  - 总复习：名词词组复数各格与数词连用
  recycles:
  - B2-L55-03
  task: 写出词组的复数第二、三、五格，以及和 [два / две]{.ru}、[о двух]{.ru} 连用的形式。
  type: matrix
  cols:
  - 词组
  - 复数第二格
  - 复数第三格
  - 复数第五格
  - '[два / две]{.ru} + ……'
  - '[о двух]{.ru} + ……'
  given:
  - 0
  rows:
  - base: '[но́вый студе́нт]{.ru}'
    cells:
    - '[но́вый студе́нт]{.ru}'
    - '[но́вых студе́нтов]{.ru}'
    - '[но́вым студе́нтам]{.ru}'
    - '[но́выми студе́нтами]{.ru}'
    - '[два но́вых студе́нта]{.ru}'
    - '[о двух но́вых студе́нтах]{.ru}'
  - base: '[ста́ршая сестра́]{.ru}'
    cells:
    - '[ста́ршая сестра́]{.ru}'
    - '[ста́рших сестёр]{.ru}'
    - '[ста́ршим сёстрам]{.ru}'
    - '[ста́ршими сёстрами]{.ru}'
    - '[две ста́ршие сестры́]{.ru}'
    - '[о двух ста́рших сёстрах]{.ru}'
  - base: '[ру́сская пе́сня]{.ru}'
    cells:
    - '[ру́сская пе́сня]{.ru}'
    - '[ру́сских пе́сен]{.ru}'
    - '[ру́сским пе́сням]{.ru}'
    - '[ру́сскими пе́снями]{.ru}'
    - '[две ру́сские пе́сни]{.ru}'
    - '[о двух ру́сских пе́снях]{.ru}'
  - base: '[ста́рый друг]{.ru}'
    cells:
    - '[ста́рый друг]{.ru}'
    - '[ста́рых друзе́й]{.ru}'
    - '[ста́рым друзья́м]{.ru}'
    - '[ста́рыми друзья́ми]{.ru}'
    - '[два ста́рых дру́га]{.ru}'
    - '[о двух ста́рых друзья́х]{.ru}'
  - base: '[большо́е окно́]{.ru}'
    cells:
    - '[большо́е окно́]{.ru}'
    - '[больши́х о́кон]{.ru}'
    - '[больши́м о́кнам]{.ru}'
    - '[больши́ми о́кнами]{.ru}'
    - '[два больши́х окна́]{.ru}'
    - '[о двух больши́х о́кнах]{.ru}'
  - base: '[ма́ленький ребёнок]{.ru}'
    cells:
    - '[ма́ленький ребёнок]{.ru}'
    - '[ма́леньких дете́й]{.ru}'
    - '[ма́леньким де́тям]{.ru}'
    - '[ма́ленькими детьми́]{.ru}'
    - '[два ма́леньких ребёнка]{.ru}'
    - '[о двух ма́леньких де́тях]{.ru}'
  - base: '[хоро́ший учи́тель]{.ru}'
    cells:
    - '[хоро́ший учи́тель]{.ru}'
    - '[хоро́ших учителе́й]{.ru}'
    - '[хоро́шим учителя́м]{.ru}'
    - '[хоро́шими учителя́ми]{.ru}'
    - '[два хоро́ших учи́теля]{.ru}'
    - '[о двух хоро́ших учителя́х]{.ru}'
  - base: '[си́няя тетра́дь]{.ru}'
    cells:
    - '[си́няя тетра́дь]{.ru}'
    - '[си́них тетра́дей]{.ru}'
    - '[си́ним тетра́дям]{.ru}'
    - '[си́ними тетра́дями]{.ru}'
    - '[две си́ние тетра́ди]{.ru}'
    - '[о двух си́них тетра́дях]{.ru}'
  - base: '[интере́сное письмо́]{.ru}'
    cells:
    - '[интере́сное письмо́]{.ru}'
    - '[интере́сных пи́сем]{.ru}'
    - '[интере́сным пи́сьмам]{.ru}'
    - '[интере́сными пи́сьмами]{.ru}'
    - '[два интере́сных письма́]{.ru}'
    - '[о двух интере́сных пи́сьмах]{.ru}'
  why: '第 1 题：复数第二格 [-ов]{.ru}，第三格 [-ам]{.ru}，第五格 [-ами]{.ru}；形容词 [-ых, -ым, -ыми]{.ru}。

    第 8 题：软变化名词用 [-ям, -ями, -ях]{.ru}；阴性 [-ь]{.ru} 名词第二格 [-ей]{.ru}：[тетра́дей]{.ru}；[си́ний]{.ru} 是软变化形容词：[си́них, си́ним]{.ru}。

    第 3、5、9 题：零词尾复数第二格插入元音：[пе́сен, о́кон, пи́сем]{.ru}；[окно́, письмо́]{.ru} 复数重音前移：[о́кнам, пи́сьмам]{.ru}，但和 [два]{.ru} 连用的单数第二格重音不变：[два окна́, два письма́]{.ru}。

    第 2 题：[сестра́]{.ru}：复数 [сёстры]{.ru}，第二格 [сестёр]{.ru}，[две сестры́]{.ru}（单数第二格重音在词尾）。

    第 4、6 题：不规则复数：[друг — друзья́ — друзе́й]{.ru}；[ребёнок — де́ти — дете́й — де́тям — детьми́]{.ru}；和 [два]{.ru} 连用时用单数第二格 [дру́га, ребёнка]{.ru}。

    第 7 题：[учи́тель]{.ru} 复数 [учителя́]{.ru}，重音在词尾：[учителе́й, учителя́м]{.ru}；[два учи́теля]{.ru} 是单数第二格，重音在词干。

    第 1–9 题：[два / две]{.ru} 后名词用单数第二格，形容词阳性、中性用复数第二格，阴性多用复数第一格（[две ста́ршие сестры́]{.ru}，也可说 [ста́рших]{.ru}）；数词在间接格时名词和形容词都跟数词同格、用复数：[о двух но́вых студе́нтах]{.ru}。'
