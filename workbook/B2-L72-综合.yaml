  task: 按括号里的词和提示写出正确的形式。
  type: matrix
  cols:
  - 给出的词
  - 形式
  given:
  - 0
  rows:
  - base: '[к + они́]{.ru}'
    cells:
    - '[к + они́]{.ru}'
    - '[к ним]{.ru}'
  - base: '[без + она́]{.ru}'
    cells:
    - '[без + она́]{.ru}'
    - '[без неё]{.ru}'
  - base: '[с + он сам]{.ru}'
    cells:
    - '[с + он сам]{.ru}'
    - '[с ним сами́м]{.ru}'
  - base: '[купи́л ку́ртку (себя́)]{.ru}'
    cells:
    - '[купи́л ку́ртку (себя́)]{.ru}'
    - '[себе́]{.ru}'
    hint: 给自己
  - base: '[студе́нт, … я дал кни́гу (кото́рый)]{.ru}'
    cells:
    - '[студе́нт, … я дал кни́гу (кото́рый)]{.ru}'
    - '[кото́рому]{.ru}'
  - base: '[кни́га, о … я говори́л (кото́рый)]{.ru}'
    cells:
    - '[кни́га, о … я говори́л (кото́рый)]{.ru}'
    - '[кото́рой]{.ru}'
  - base: '[друзья́, с … мы отдыха́ли (кото́рый)]{.ru}'
    cells:
    - '[друзья́, с … мы отдыха́ли (кото́рый)]{.ru}'
    - '[кото́рыми]{.ru}'
  - base: '[мне … посове́товаться (не́кого)]{.ru}'
    cells:
    - '[мне … посове́товаться (не́кого)]{.ru}'
    - '[не́ с кем]{.ru}'
  - base: '[интере́сный]{.ru}'
    cells:
    - '[интере́сный]{.ru}'
    - '[интере́снее]{.ru}'
    hint: 比较级
  - base: '[хоро́ший]{.ru}'
    cells:
    - '[хоро́ший]{.ru}'
    - '[лу́чше]{.ru}'
    hint: 比较级
  - base: '[молодо́й]{.ru}'
    cells:
    - '[молодо́й]{.ru}'
    - '[моло́же]{.ru}'
    hint: 比较级
  - base: '[гото́вый]{.ru}'
    cells:
    - '[гото́вый]{.ru}'
    - '[гото́ва]{.ru}'
    hint: 短尾，主语 [она́]{.ru}
  - base: '[за́нятый]{.ru}'
    cells:
    - '[за́нятый]{.ru}'
    - '[за́няты]{.ru}'
    hint: 短尾，主语 [мы]{.ru}
  - base: '[во + весь го́род]{.ru}'
    cells:
    - '[во + весь го́род]{.ru}'
    - '[во всём го́роде]{.ru}'
  why: '第 1、2 题：前置词后第三人称代词加 [н-]{.ru}：[к ним, без неё]{.ru}。

    第 3 题：[сам]{.ru} 和代词同格：[с ним сами́м]{.ru}。

    第 4 题：指回主语用 [себя́]{.ru}，“给自己”是第三格 [себе́]{.ru}。

    第 5–7 题：[кото́рый]{.ru} 的性、数随先行词，格随从句：[дал кому́ → кото́рому]{.ru}，[о кото́рой]{.ru}（[кни́га]{.ru} 阴性），[с кото́рыми]{.ru}（复数第五格）。

    第 8 题：[посове́товаться с]{.ru} + 第五格：[не́ с кем]{.ru}，前置词夹在中间。

    第 9–11 题：比较级：[интере́снее]{.ru}（[-ее]{.ru}），不规则的 [лу́чше, моло́же]{.ru}。

    第 12、13 题：短尾与主语一致：[она́ гото́ва, мы за́няты]{.ru}。

    第 14 题：[весь]{.ru} 第六格 [всём]{.ru}：[во всём го́роде]{.ru}。'
