  task: 按意义把句子归栏。
  type: classify
  bins:
  - 已有结果
  - 过程、反复或只问发生过
  - 一次、朝一个方向
  - 往返、经常或泛指能力
  - 原因
  - 让步（虽然……）
  items:
  - text: '[Я прочита́л кни́гу.]{.ru}'
    answer: 已有结果
  - text: '[Я чита́л весь ве́чер.]{.ru}'
    answer: 过程、反复或只问发生过
  - text: '[Сейча́с я иду́ в библиоте́ку.]{.ru}'
    answer: 一次、朝一个方向
  - text: '[Вчера́ я ходи́л в теа́тр.]{.ru}'
    answer: 往返、经常或泛指能力
  - text: '[Мы оста́лись до́ма, так как шёл дождь.]{.ru}'
    answer: 原因
  - text: '[Хотя́ он уста́л, он рабо́тал до ве́чера.]{.ru}'
    answer: 让步（虽然……）
  - text: '[Он сдал экза́мен.]{.ru}'
    answer: 已有结果
  - text: '[Ка́ждый день он гуля́ет в па́рке.]{.ru}'
    answer: 过程、反复或只问发生过
  - text: '[Самолёт лети́т в Пеки́н.]{.ru}'
    answer: 一次、朝一个方向
  - text: '[Ле́том мы е́здили на мо́ре.]{.ru}'
    answer: 往返、经常或泛指能力
  - text: '[Я не пришёл, потому́ что был бо́лен.]{.ru}'
    answer: 原因
  - text: '[Несмотря́ на то что шёл дождь, мы гуля́ли.]{.ru}'
    answer: 让步（虽然……）
  - text: '[Ма́ма пригото́вила обе́д.]{.ru}'
    answer: 已有结果
  - text: '[Ты чита́л э́ту кни́гу?]{.ru}'
    answer: 过程、反复或只问发生过
  - text: '[Куда́ ты бежи́шь?]{.ru}'
    answer: 一次、朝一个方向
  - text: '[Ми́ша лю́бит пла́вать.]{.ru}'
    answer: 往返、经常或泛指能力
  - text: '[Из-за дождя́ мы не пошли́ в лес.]{.ru}'
    answer: 原因
  - text: '[Он пришёл, хотя́ был о́чень за́нят.]{.ru}'
    answer: 让步（虽然……）
  - text: '[Ми́ша вы́учил стихи́.]{.ru}'
    answer: 已有结果
  - text: '[Она́ до́лго писа́ла письмо́.]{.ru}'
    answer: 过程、反复或只问发生过
  - text: '[Ма́ма несёт су́мку домо́й.]{.ru}'
    answer: 一次、朝一个方向
  - text: '[Он ка́ждый день во́дит сы́на в шко́лу.]{.ru}'
    answer: 往返、经常或泛指能力
  - text: '[Шёл дождь, поэ́тому мы оста́лись до́ма.]{.ru}'
    answer: 原因
  - text: '[Хотя́ бы́ло хо́лодно, мы пошли́ купа́ться.]{.ru}'
    answer: 让步（虽然……）
  why: '第 1、7、13、19 题：完成体过去时：动作完成，有结果：[прочита́л, сдал, пригото́вила, вы́учил]{.ru}。

    第 2、8、14、20 题：未完成体：过程（[весь ве́чер, до́лго]{.ru}）、经常（[ка́ждый день]{.ru}）或只问做没做过（[Ты чита́л э́ту кни́гу?]{.ru}）。

    第 3、9、15、21 题：定向动词：此刻一次朝一个方向：[иду́, лети́т, бежи́шь, несёт]{.ru}。

    第 4、10、16、22 题：不定向动词：去了又回来（[ходи́л, е́здили]{.ru}）、经常（[во́дит]{.ru}）、泛指能力或爱好（[лю́бит пла́вать]{.ru}）。

    第 5、11、17、23 题：原因：[так как, потому́ что, из-за]{.ru}；[поэ́тому]{.ru} 引出结果，整句说的也是因果关系。

    第 6、12、18、24 题：让步：[хотя́, несмотря́ на то что]{.ru}，“虽然……还是……”。'
