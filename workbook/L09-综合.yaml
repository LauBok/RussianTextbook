groups:
- id: L09-综合-a
  lessons:
  - L03
  - L05
  - L08
  - L09
  tags:
  - 综合：物主代词＋形容词＋名词主格单复数
  recycles:
  - L03-03
  - L05-05
  - L08-01
  - L09-03
  task: 三个词组成词组，先写单数，再改成复数。
  type: matrix
  cols:
  - 原形
  - 单数词组
  - 复数词组
  given:
  - 0
  rows:
  - base: '[мой + ста́рый + чемода́н]{.ru}'
    cells:
    - '[мой + ста́рый + чемода́н]{.ru}'
    - '[мой ста́рый чемода́н]{.ru}'
    - '[мои́ ста́рые чемода́ны]{.ru}'
  - base: '[твой + но́вый + тетра́дь]{.ru}'
    cells:
    - '[твой + но́вый + тетра́дь]{.ru}'
    - '[твоя́ но́вая тетра́дь]{.ru}'
    - '[твои́ но́вые тетра́ди]{.ru}'
    hint: f
  - base: '[наш + большо́й + окно́]{.ru}'
    cells:
    - '[наш + большо́й + окно́]{.ru}'
    - '[на́ше большо́е окно́]{.ru}'
    - '[на́ши больши́е о́кна]{.ru}'
  - base: '[ваш + краси́вый + ла́мпа]{.ru}'
    cells:
    - '[ваш + краси́вый + ла́мпа]{.ru}'
    - '[ва́ша краси́вая ла́мпа]{.ru}'
    - '[ва́ши краси́вые ла́мпы]{.ru}'
  - base: '[его́ + си́ний + ру́чка]{.ru}'
    cells:
    - '[его́ + си́ний + ру́чка]{.ru}'
    - '[его́ си́няя ру́чка]{.ru}'
    - '[его́ си́ние ру́чки]{.ru}'
  - base: '[её + интере́сный + письмо́]{.ru}'
    cells:
    - '[её + интере́сный + письмо́]{.ru}'
    - '[её интере́сное письмо́]{.ru}'
    - '[её интере́сные пи́сьма]{.ru}'
  - base: '[мой + хоро́ший + слова́рь]{.ru}'
    cells:
    - '[мой + хоро́ший + слова́рь]{.ru}'
    - '[мой хоро́ший слова́рь]{.ru}'
    - '[мои́ хоро́шие словари́]{.ru}'
    hint: m
  - base: '[наш + ма́ленький + ко́мната]{.ru}'
    cells:
    - '[наш + ма́ленький + ко́мната]{.ru}'
    - '[на́ша ма́ленькая ко́мната]{.ru}'
    - '[на́ши ма́ленькие ко́мнаты]{.ru}'
  - base: '[их + но́вый + дом]{.ru}'
    cells:
    - '[их + но́вый + дом]{.ru}'
    - '[их но́вый дом]{.ru}'
    - '[их но́вые дома́]{.ru}'
  - base: '[твой + ста́рый + фо́то]{.ru}'
    cells:
    - '[твой + ста́рый + фо́то]{.ru}'
    - '[твоё ста́рое фо́то]{.ru}'
    - '[твои́ ста́рые фо́то]{.ru}'
  - base: '[ваш + большо́й + шкаф]{.ru}'
    cells:
    - '[ваш + большо́й + шкаф]{.ru}'
    - '[ваш большо́й шкаф]{.ru}'
    - '[ва́ши больши́е шкафы́]{.ru}'
  - base: '[мой + хоро́ший + кни́га]{.ru}'
    cells:
    - '[мой + хоро́ший + кни́га]{.ru}'
    - '[моя́ хоро́шая кни́га]{.ru}'
    - '[мои́ хоро́шие кни́ги]{.ru}'
  - base: '[наш + но́вый + студе́нтка]{.ru}'
    cells:
    - '[наш + но́вый + студе́нтка]{.ru}'
    - '[на́ша но́вая студе́нтка]{.ru}'
    - '[на́ши но́вые студе́нтки]{.ru}'
  - base: '[твой + краси́вый + пода́рок]{.ru}'
    cells:
    - '[твой + краси́вый + пода́рок]{.ru}'
    - '[твой краси́вый пода́рок]{.ru}'
    - '[твои́ краси́вые пода́рки]{.ru}'
  why: |-
    第 1、7、11、14 题：阳性：[мой / твой / ваш]{.ru}＋阳性形容词＋名词；复数三个词一起变：[мои́ ста́рые чемода́ны, мои́ хоро́шие словари́, ва́ши больши́е шкафы́, твои́ краси́вые пода́рки]{.ru}。注意 [словари́, шкафы́]{.ru} 重音在词尾，[пода́рки]{.ru} 脱落 [о]{.ru}。
    第 4、8、12、13 题：阴性：[ва́ша краси́вая ла́мпа, на́ша ма́ленькая ко́мната, моя́ хоро́шая кни́га]{.ru}；复数 [-ие]{.ru} 出现在 [к, ш, г]{.ru} 后：[ма́ленькие, хоро́шие, кни́ги, студе́нтки]{.ru}。
    第 2 题：[тетра́дь]{.ru} 是阴性：[твоя́ но́вая тетра́дь]{.ru}，复数 [твои́ но́вые тетра́ди]{.ru}。
    第 3、10 题：中性：[на́ше большо́е окно́, твоё ста́рое фо́то]{.ru}；复数 [о́кна]{.ru} 重音前移，[фо́то]{.ru} 不变。
    第 5、6、9 题：[его́, её, их]{.ru} 单复数都不变，只变形容词和名词：[его́ си́ние ру́чки, её интере́сные пи́сьма, их но́вые дома́]{.ru}。
- id: L09-综合-b
  lessons:
  - L03
  - L05
  - L08
  - L09
  tags:
  - 综合：主格性数配合核查
  recycles:
  - L03-04
  - L05-06
  - L08-04
  task: 单复数混合：每个词组有一处错误，写出正确的词组。
  type: matrix
  cols:
  - 有错的词组
  - 正确的词组
  given:
  - 0
  rows:
  - base: '[мои́ но́вый кни́ги]{.ru}'
    cells:
    - '[мои́ но́вый кни́ги]{.ru}'
    - '[мои́ но́вые кни́ги]{.ru}'
  - base: '[на́ша ста́рый ко́мната]{.ru}'
    cells:
    - '[на́ша ста́рый ко́мната]{.ru}'
    - '[на́ша ста́рая ко́мната]{.ru}'
  - base: '[твой си́няя чемода́н]{.ru}'
    cells:
    - '[твой си́няя чемода́н]{.ru}'
    - '[твой си́ний чемода́н]{.ru}'
  - base: '[ва́ше большо́й окно́]{.ru}'
    cells:
    - '[ва́ше большо́й окно́]{.ru}'
    - '[ва́ше большо́е окно́]{.ru}'
  - base: '[мой хоро́шая слова́рь]{.ru}'
    cells:
    - '[мой хоро́шая слова́рь]{.ru}'
    - '[мой хоро́ший слова́рь]{.ru}'
  - base: '[её краси́вые су́мкы]{.ru}'
    cells:
    - '[её краси́вые су́мкы]{.ru}'
    - '[её краси́вые су́мки]{.ru}'
  - base: '[их но́вые до́мы]{.ru}'
    cells:
    - '[их но́вые до́мы]{.ru}'
    - '[их но́вые дома́]{.ru}'
  - base: '[мой ма́ленькая крова́ть]{.ru}'
    cells:
    - '[мой ма́ленькая крова́ть]{.ru}'
    - '[моя́ ма́ленькая крова́ть]{.ru}'
  - base: '[на́ше интере́сные пи́сьма]{.ru}'
    cells:
    - '[на́ше интере́сные пи́сьма]{.ru}'
    - '[на́ши интере́сные пи́сьма]{.ru}'
  - base: '[твой хоро́шая па́па]{.ru}'
    cells:
    - '[твой хоро́шая па́па]{.ru}'
    - '[твой хоро́ший па́па]{.ru}'
  - base: '[ва́ши ма́ленькые ко́шки]{.ru}'
    cells:
    - '[ва́ши ма́ленькые ко́шки]{.ru}'
    - '[ва́ши ма́ленькие ко́шки]{.ru}'
  - base: '[мои́ ста́рые фо́ты]{.ru}'
    cells:
    - '[мои́ ста́рые фо́ты]{.ru}'
    - '[мои́ ста́рые фо́то]{.ru}'
  - base: '[на́ше си́ное не́бо]{.ru}'
    cells:
    - '[на́ше си́ное не́бо]{.ru}'
    - '[на́ше си́нее не́бо]{.ru}'
  - base: '[его́ хоро́шое кре́сло]{.ru}'
    cells:
    - '[его́ хоро́шое кре́сло]{.ru}'
    - '[его́ хоро́шее кре́сло]{.ru}'
  - base: '[моя́ но́вый студе́нтка]{.ru}'
    cells:
    - '[моя́ но́вый студе́нтка]{.ru}'
    - '[моя́ но́вая студе́нтка]{.ru}'
  - base: '[твоя́ больши́е о́кна]{.ru}'
    cells:
    - '[твоя́ больши́е о́кна]{.ru}'
    - '[твои́ больши́е о́кна]{.ru}'
  why: |-
    第 2–4、15 题：形容词没有跟名词的性一致：[на́ша ста́рая ко́мната, твой си́ний чемода́н, ва́ше большо́е окно́, моя́ но́вая студе́нтка]{.ru}。
    第 5 题：[слова́рь]{.ru} 是阳性，形容词用 [хоро́ший]{.ru}。
    第 1 题：名词是复数，形容词也用复数：[но́вые]{.ru}。
    第 8、9、16 题：物主代词和名词的性数不一致：[моя́ … крова́ть]{.ru}（阴性），[на́ши … пи́сьма]{.ru}、[твои́ … о́кна]{.ru}（复数）。
    第 10 题：[па́па]{.ru} 是阳性，形容词也用阳性：[хоро́ший па́па]{.ru}。
    第 6、7、12 题：名词复数写错：[су́мки]{.ru}（[к]{.ru} 后写 [и]{.ru}），[дома́]{.ru}（不规则），[фо́то]{.ru}（不变格）。
    第 11、14 题：形容词的拼写规则：[к]{.ru} 后不写 [ы]{.ru}：[ма́ленькие]{.ru}；[ш]{.ru} 后不重读的 [о]{.ru} 写 [е]{.ru}：[хоро́шее]{.ru}。
    第 13 题：[си́ний]{.ru} 是软变化，中性写 [си́нее]{.ru}。
- id: L09-综合-c
  lessons:
  - L08
  - L09
  tags:
  - 综合：чей、物主代词与形容词谓语
  recycles:
  - L08-03
  task: 按括号里的词写出和名词一致的形式。
  type: fill
  items:
  - stem: ___ э́то ко́мнаты?
    hint: чей
    accept:
    - Чьи
  - stem: Э́то на́ши ко́мнаты. Они́ ___.
    hint: све́тлый
    accept:
    - све́тлые
  - stem: ___ э́то фо́то?
    hint: чей
    accept:
    - Чьё
  - stem: Э́то ___ фо́то.
    hint: мы
    accept:
    - на́ше
  - stem: Твоё фо́то о́чень ___.
    hint: хоро́ший
    accept:
    - хоро́шее
  - stem: Где ___ очки́, па́па?
    hint: ты
    accept:
    - твои́
  - stem: Её пи́сьма ___.
    hint: интере́сный
    accept:
    - интере́сные
  - stem: ___ э́то слова́рь?
    hint: чей
    accept:
    - Чей
  - stem: Слова́рь ___.
    hint: большо́й
    accept:
    - большо́й
  - stem: Ва́ша ла́мпа ___.
    hint: но́вый
    accept:
    - но́вая
  - stem: Кре́сло ___.
    hint: си́ний
    accept:
    - си́нее
  - stem: Чья э́то крова́ть? — ___.
    hint: я
    accept:
    - Моя́
  why: |-
    第 1、3、8 题：[чей]{.ru} 和后面的名词一致：[Чьи … ко́мнаты, Чьё … фо́то, Чей … слова́рь]{.ru}。
    第 4、6、12 题：物主代词和所指的名词一致：[на́ше фо́то, твои́ очки́]{.ru}；只用物主代词回答时也要一致：[Моя́]{.ru}（[крова́ть]{.ru} 是阴性）。
    第 2、7、9、10 题：形容词作谓语，仍和主语一致：[Они́ све́тлые, Её пи́сьма интере́сные, Слова́рь большо́й, Ва́ша ла́мпа но́вая]{.ru}。
    第 5、11 题：中性主语：[хоро́шее]{.ru}（[ш]{.ru} 后写 [е]{.ru}），[си́нее]{.ru}（软变化）。
