  why: |-
    第 1–3、5–7 题：[-а]{.ru} 换成 [-е]{.ru}，重音不动：[в шко́ле, на рабо́те, в па́пке]{.ru}。不要写成复数的 [-ы, -и]{.ru}。
    第 4、8 题：[-я]{.ru} 也换成 [-е]{.ru}：[на ку́хне, в галере́е]{.ru}。
