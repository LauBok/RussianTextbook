    第 1、2、5、7 题：阴性 [-ь]{.ru} 换成 [-и]{.ru}：[в тетра́ди, на пло́щади, на крова́ти, в о́бласти]{.ru}。
    第 3、6、8、9 题：中性 [-о]{.ru} 换成 [-е]{.ru}：[в кре́сле, в зе́ркале]{.ru}；重音在词尾的仍在词尾：[на окне́, в письме́]{.ru}。
    第 4 题：中性 [-е]{.ru} 结尾的名词第六格不变：[на мо́ре]{.ru}。
    第 10、11 题：不变格名词保持原形：[на фо́то, в метро́]{.ru}。
