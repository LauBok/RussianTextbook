  why: |-
    第 1、4、8、12、14、16 题：阳性辅音结尾加 [-е]{.ru}：[в кабине́те, в чемода́не, на стадио́не, на дива́не, в бассе́йне, в телефо́не]{.ru}。
    第 17 题：[стол]{.ru} 第六格重音在词尾：[на столе́]{.ru}。
    第 7 题：[-й]{.ru} 换成 [-е]{.ru}：[в музе́е]{.ru}。
    第 2、5、10、19、20 题：阴性 [-а / -я]{.ru} 换成 [-е]{.ru}：[в газе́те, в гости́нице, на ку́хне, в ва́зе]{.ru}；[в Москве́]{.ru} 重音仍在词尾。
    第 3、9、15、18 题：阴性 [-ь]{.ru} 用 [-и]{.ru}：[на крова́ти, в тетра́ди, на пло́щади, на ме́бели]{.ru}。题面标了 f 的 [-ь]{.ru} 名词都属于这一类。
    第 6 题：中性 [-о]{.ru} 换成 [-е]{.ru}：[на о́зере]{.ru}。
    第 13 题：中性 [-е]{.ru} 不变：[на по́ле]{.ru}。
    第 11 题：不变格名词不变：[в кафе́]{.ru}。
- id: L11-05
  tags:
  - 名词单数第六格：句中填空（前置词已给出）
  task: 用括号里名词的第六格填空。
  type: fill
  items:
  - stem: Па́па на ___.
    hint: заво́д
    accept:
    - заво́де
  - stem: Ми́ша в ___.
    hint: шко́ла
    accept:
    - шко́ле
  - stem: Ру́чка в ___.
    hint: су́мка
    accept:
    - су́мке
  - stem: Студе́нты в ___.
    hint: библиоте́ка
    accept:
    - библиоте́ке
  - stem: Ма́ма на ___.
    hint: ку́хня
    accept:
    - ку́хне
  - stem: Фо́то в ___.
    hint: журна́л
    accept:
    - журна́ле
  - stem: Ко́шка на ___.
    hint: окно́
    accept:
    - окне́
  - stem: Слова́рь на ___.
    hint: стол
    accept:
    - столе́
  - stem: Тетра́дь в ___.
    hint: слова́рь
    accept:
    - словаре́
  - stem: Мари́я Никола́евна в ___.
    hint: поликли́ника
    accept:
    - поликли́нике
  - stem: А́нна в ___.
    hint: университе́т
    accept:
    - университе́те
  - stem: Мы на ___.
    hint: мо́ре
    accept:
    - мо́ре
  - stem: Ключи́ в ___.
    hint: чемода́н
    accept:
    - чемода́не
  - stem: Му́рка на ___.
    hint: крова́ть
    accept:
    - крова́ти
  - stem: — Где Ива́н Серге́евич? — На ___.
    hint: рабо́та
    accept:
    - рабо́те
  - stem: — Где Ю́ми? — В ___.
    hint: музе́й
    accept:
    - музе́е
  - stem: — Где мои́ очки́? — В ___.
    hint: ко́мната
    accept:
    - ко́мнате
  - stem: Пьер в ___.
    hint: Москва́
    accept:
    - Москве́
  why: |-
    第 1、6、11、13、16 题：阳性辅音结尾加 [-е]{.ru}，[-й]{.ru} 换 [-е]{.ru}：[на заво́де, в журна́ле, в университе́те, в чемода́не, в музе́е]{.ru}。
    第 2–5、10、15、17、18 题：阴性 [-а / -я]{.ru} 换 [-е]{.ru}：[в шко́ле, в су́мке, на ку́хне, на рабо́те, в Москве́]{.ru}。
    第 7–9 题：这三个词第六格重音在词尾：[на окне́, на столе́, в словаре́]{.ru}；[слова́рь]{.ru} 是阳性，用 [-е]{.ru}，不用 [-и]{.ru}。
    第 12 题：[мо́ре]{.ru} 不变：[на мо́ре]{.ru}（在海边）。
    第 14 题：[крова́ть]{.ru} 是阴性 [-ь]{.ru} 名词：[на крова́ти]{.ru}。
