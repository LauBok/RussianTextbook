  - base: '[слова́рь]{.ru}'
    cells:
    - '[слова́рь]{.ru}'
    - '[в словаре́]{.ru}'
  why: |-
    第 1、2、4 题：辅音结尾的阳性名词直接加 [-е]{.ru}：[на заво́де, в университе́те, в журна́ле]{.ru}。
    第 3、6 题：[-й]{.ru} 换成 [-е]{.ru}：[в музе́е, в трамва́е]{.ru}。
    第 7、8 题：阳性 [-ь]{.ru} 换成 [-е]{.ru}，不用 [-и]{.ru}：[в портфе́ле, в словаре́]{.ru}。
    第 5、8 题：复数重音在词尾的词（[столы́, словари́]{.ru}），第六格重音也在词尾：[на столе́, в словаре́]{.ru}。
