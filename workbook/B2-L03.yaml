heading: 第 3 课　数量词 + 第二格
groups:
- id: B2-L03-01
  tags:
  - 可数与不可数名词
  task: 把名词按可数 / 不可数归类。
  type: classify
  bins:
  - 可数
  - 不可数
  items:
  - text: '[я́блоко]{.ru}'
    answer: 可数
  - text: '[мя́со]{.ru}'
    answer: 不可数
  - text: '[помидо́р]{.ru}'
    answer: 可数
  - text: '[молоко́]{.ru}'
    answer: 不可数
  - text: '[мёд]{.ru}'
    answer: 不可数
  - text: '[огуре́ц]{.ru}'
    answer: 可数
  - text: '[са́хар]{.ru}'
    answer: 不可数
  - text: '[кни́га]{.ru}'
    answer: 可数
  - text: '[вода́]{.ru}'
    answer: 不可数
  - text: '[покупа́тель]{.ru}'
    answer: 可数
  - text: '[лук]{.ru}'
    answer: 不可数
  - text: '[биле́т]{.ru}'
    answer: 可数
  - text: '[морко́вь]{.ru}'
    answer: 不可数
  - text: '[ча́шка]{.ru}'
    answer: 可数
  - text: '[карто́шка]{.ru}'
    answer: 不可数
  - text: '[вре́мя]{.ru}'
    answer: 不可数
  - text: '[мандари́н]{.ru}'
    answer: 可数
  - text: '[хлеб]{.ru}'
    answer: 不可数
  - text: '[сло́во]{.ru}'
    answer: 可数
  - text: '[рабо́та]{.ru}'
    answer: 不可数
  - text: '[сыр]{.ru}'
    answer: 不可数
    new: true
    gloss: 奶酪
  - text: '[оши́бка]{.ru}'
    answer: 可数
  - text: '[чай]{.ru}'
    answer: 不可数
  - text: '[конфе́та]{.ru}'
    answer: 可数
    new: true
    gloss: 糖果
  why: |-
    第 1、3、6、8、10、12、14、17、19、22、24 题：能一个一个数的东西：[я́блоки, помидо́ры, огурцы́, кни́ги, покупа́тели, биле́ты, ча́шки, мандари́ны, слова́, оши́бки, конфе́ты]{.ru}，[мно́го]{.ru} 后用复数第二格。
    第 2、4、5、7、9、18、21、23 题：食物和材料论量不论个：[мя́со, молоко́, мёд, са́хар, вода́, хлеб, сыр, чай]{.ru}，[мно́го]{.ru} 后用单数第二格：[мно́го мя́са, мно́го ча́я]{.ru}。
    第 11、13、15 题：[лук, морко́вь, карто́шка]{.ru} 在俄语里当作一堆材料，按不可数处理：[мно́го лу́ка, немно́го морко́ви, мно́го карто́шки]{.ru}。
    第 16、20 题：抽象名词 [вре́мя, рабо́та]{.ru} 不可数：[ма́ло вре́мени, мно́го рабо́ты]{.ru}。
- id: B2-L03-02
  tags:
  - мно́го / не́сколько / немно́го + 第二格
  task: 写出词组；第二列用 [не́сколько]{.ru} 或 [немно́го]{.ru}。
  type: matrix
  cols:
  - 名词
  - '[мно́го]{.ru} + 名词'
  - '[не́сколько]{.ru} / [немно́го]{.ru} + 名词'
  given:
  - 0
  rows:
  - base: '[мёд]{.ru}'
    cells:
    - '[мёд]{.ru}'
    - '[мно́го мёда]{.ru}'
    - '[немно́го мёда]{.ru}'
  - base: '[огуре́ц]{.ru}'
    cells:
    - '[огуре́ц]{.ru}'
    - '[мно́го огурцо́в]{.ru}'
    - '[не́сколько огурцо́в]{.ru}'
  - base: '[я́блоко]{.ru}'
    cells:
    - '[я́блоко]{.ru}'
    - '[мно́го я́блок]{.ru}'
    - '[не́сколько я́блок]{.ru}'
  - base: '[молоко́]{.ru}'
    cells:
    - '[молоко́]{.ru}'
    - '[мно́го молока́]{.ru}'
    - '[немно́го молока́]{.ru}'
  - base: '[помидо́р]{.ru}'
    cells:
    - '[помидо́р]{.ru}'
    - '[мно́го помидо́ров]{.ru}'
    - '[не́сколько помидо́ров]{.ru}'
  - base: '[вре́мя]{.ru}'
    cells:
    - '[вре́мя]{.ru}'
    - '[мно́го вре́мени]{.ru}'
    - '[немно́го вре́мени]{.ru}'
  - base: '[покупа́тель]{.ru}'
    cells:
    - '[покупа́тель]{.ru}'
    - '[мно́го покупа́телей]{.ru}'
    - '[не́сколько покупа́телей]{.ru}'
  - base: '[вода́]{.ru}'
    cells:
    - '[вода́]{.ru}'
    - '[мно́го воды́]{.ru}'
    - '[немно́го воды́]{.ru}'
  - base: '[сло́во]{.ru}'
    cells:
    - '[сло́во]{.ru}'
    - '[мно́го слов]{.ru}'
    - '[не́сколько слов]{.ru}'
  - base: '[са́хар]{.ru}'
    cells:
    - '[са́хар]{.ru}'
    - '[мно́го са́хара]{.ru}'
    - '[немно́го са́хара]{.ru}'
  - base: '[студе́нтка]{.ru}'
    cells:
    - '[студе́нтка]{.ru}'
    - '[мно́го студе́нток]{.ru}'
    - '[не́сколько студе́нток]{.ru}'
  - base: '[морко́вь]{.ru}'
    cells:
    - '[морко́вь]{.ru}'
    - '[мно́го морко́ви]{.ru}'
    - '[немно́го морко́ви]{.ru}'
  - base: '[биле́т]{.ru}'
    cells:
    - '[биле́т]{.ru}'
    - '[мно́го биле́тов]{.ru}'
    - '[не́сколько биле́тов]{.ru}'
  - base: '[лук]{.ru}'
    cells:
    - '[лук]{.ru}'
    - '[мно́го лу́ка]{.ru}'
    - '[немно́го лу́ка]{.ru}'
  - base: '[ча́шка]{.ru}'
    cells:
    - '[ча́шка]{.ru}'
    - '[мно́го ча́шек]{.ru}'
    - '[не́сколько ча́шек]{.ru}'
  - base: '[рабо́та]{.ru}'
    cells:
    - '[рабо́та]{.ru}'
    - '[мно́го рабо́ты]{.ru}'
    - '[немно́го рабо́ты]{.ru}'
  why: |-
    第 2、3、5、7、9、11、13、15 题：可数名词用复数第二格，“几个”用 [не́сколько]{.ru}：[не́сколько огурцо́в, не́сколько я́блок, не́сколько студе́нток]{.ru}。
    第 1、4、8、10、12、14、16 题：不可数名词用单数第二格，“一点儿”只能用 [немно́го]{.ru}：[немно́го мёда, немно́го молока́, немно́го морко́ви]{.ru}。不说 [не́сколько мёда]{.ru}。
    第 6 题：[вре́мя]{.ru} 的第二格是 [вре́мени]{.ru}：[мно́го вре́мени, немно́го вре́мени]{.ru}。
- id: B2-L03-03
  tags:
  - 数量词组作主语：谓语中性单数
  task: 写出谓语的过去时和将来时。
  type: matrix
  cols:
  - 现在时
  - 过去时
  - 将来时
  given:
  - 0
  rows:
  - base: '[На ры́нке мно́го наро́ду.]{.ru}'
    cells:
    - '[На ры́нке мно́го наро́ду.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[В холоди́льнике ма́ло молока́.]{.ru}'
    cells:
    - '[В холоди́льнике ма́ло молока́.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[У меня́ ма́ло вре́мени.]{.ru}'
    cells:
    - '[У меня́ ма́ло вре́мени.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[Ско́лько у тебя́ уро́ков?]{.ru}'
    cells:
    - '[Ско́лько у тебя́ уро́ков?]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[В гру́ппе у́чится не́сколько студе́нтов из Кита́я.]{.ru}'
    cells:
    - '[В гру́ппе у́чится не́сколько студе́нтов из Кита́я.]{.ru}'
    - '[учи́лось]{.ru}'
    - '[бу́дет учи́ться]{.ru}'
  - base: '[На столе́ стои́т не́сколько ча́шек.]{.ru}'
    cells:
    - '[На столе́ стои́т не́сколько ча́шек.]{.ru}'
    - '[стоя́ло]{.ru}'
    - '[бу́дет стоя́ть]{.ru}'
  - base: '[В шкафу́ лежи́т мно́го книг.]{.ru}'
    cells:
    - '[В шкафу́ лежи́т мно́го книг.]{.ru}'
    - '[лежа́ло]{.ru}'
    - '[бу́дет лежа́ть]{.ru}'
  - base: '[В на́шем до́ме живёт мно́го студе́нтов.]{.ru}'
    cells:
    - '[В на́шем до́ме живёт мно́го студе́нтов.]{.ru}'
    - '[жи́ло]{.ru}'
    - '[бу́дет жить]{.ru}'
  - base: '[В э́той поликли́нике рабо́тает ма́ло враче́й.]{.ru}'
    cells:
    - '[В э́той поликли́нике рабо́тает ма́ло враче́й.]{.ru}'
    - '[рабо́тало]{.ru}'
    - '[бу́дет рабо́тать]{.ru}'
  - base: '[В магази́не мно́го покупа́телей.]{.ru}'
    cells:
    - '[В магази́не мно́го покупа́телей.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  why: |-
    第 1–4、10 题：没有动词的现在时句，过去时用 [бы́ло]{.ru}，将来时用 [бу́дет]{.ru}：[мно́го наро́ду]{.ru} 这类数量词组作主语，动词用中性单数，不说 [бы́ли]{.ru}。
    第 5–9 题：有动词的句子：现在时用第三人称单数（[у́чится, стои́т]{.ru}），过去时用中性 [-ло]{.ru}：[учи́лось, стоя́ло, лежа́ло, жи́ло, рабо́тало]{.ru}；将来时 [бу́дет]{.ru} + 不定式。
- id: B2-L03-04
  tags:
  - мно́го / ма́ло / не́сколько / ско́лько + 第二格：句中
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: В су́пе ма́ло ___.
    hint: соль
    accept:
    - со́ли
    new: true
    gloss: 盐
  - stem: Ма́ма купи́ла не́сколько ___.
    hint: помидо́р
    accept:
    - помидо́ров
  - stem: Ско́лько ___ ты положи́л в чай?
    hint: са́хар
    accept:
    - са́хара
  - stem: Ле́том на ры́нке сто́лько ___!
    hint: о́вощи
    accept:
    - овоще́й
  - stem: Да́йте, пожа́луйста, немно́го ___.
    hint: лук
    accept:
    - лу́ка
  - stem: В сала́те мно́го ___.
    hint: огуре́ц
    accept:
    - огурцо́в
  - stem: В холоди́льнике ма́ло ___.
    hint: проду́кты
    accept:
    - проду́ктов
  - stem: У студе́нтов всегда́ ма́ло ___.
    hint: де́ньги
    accept:
    - де́нег
  - stem: Я вы́пил немно́го ___.
    hint: вода́
    accept:
    - воды́
  - stem: В на́шем магази́не не́сколько ___.
    hint: сорт
    accept:
    - сорто́в
  - stem: Ско́лько ___ в килогра́мме?
    hint: я́блоко
    accept:
    - я́блок
  - stem: Сего́дня у меня́ мно́го ___.
    hint: рабо́та
    accept:
    - рабо́ты
  - stem: У тебя́ есть немно́го ___?
    hint: вре́мя
    accept:
    - вре́мени
  - stem: Ско́лько ___ ты взял?
    hint: ча́шка
    accept:
    - ча́шек
  - stem: В пиро́ге ма́ло ___.
    hint: мя́со
    accept:
    - мя́са
  - stem: Мы купи́ли не́сколько ___.
    hint: ды́ня
    accept:
    - дынь
    new: true
    gloss: 甜瓜
  - stem: На ры́нке бы́ло ма́ло ___.
    hint: покупа́тель
    accept:
    - покупа́телей
  - stem: В ча́шке ма́ло ___.
    hint: молоко́
    accept:
    - молока́
  - stem: В Москве́ мно́го ___ и теа́тров.
    hint: музе́й
    accept:
    - музе́ев
  - stem: Пе́ред пра́здником в магази́нах всегда́ мно́го ___.
    hint: наро́д
    accept:
    - наро́ду
  why: |-
    第 1、3、5、9、12、13、15、18 题：不可数名词用单数第二格：[со́ли, са́хара, лу́ка, воды́, рабо́ты, мя́са, молока́]{.ru}；[вре́мя]{.ru} 的第二格是 [вре́мени]{.ru}。
    第 2、6、11、14、16、17、19 题：可数名词用复数第二格：[помидо́ров, огурцо́в, я́блок, музе́ев, ча́шек, дынь, покупа́телей]{.ru}。
    第 4、7、8 题：只有复数的名词：[овоще́й, проду́ктов, де́нег]{.ru}。
    第 10 题：[сорт]{.ru} 复数 [сорта́]{.ru} 重音在词尾，复数第二格也在词尾：[сорто́в]{.ru}。
    第 20 题：[мно́го наро́ду]{.ru} 是固定说法（人很多）。
