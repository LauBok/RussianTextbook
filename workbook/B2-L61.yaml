heading: 第 61 课　无人称动词
groups:
- id: B2-L61-01
  tags:
  - 无人称动词：хо́чется, ка́жется 与第三格
  task: 写出无人称句的现在时和过去时。
  type: matrix
  cols:
  - 人 + 动词
  - 现在时
  - 过去时
  given:
  - 0
  rows:
  - base: '[я + хоте́ться]{.ru}'
    cells:
    - '[я + хоте́ться]{.ru}'
    - '[мне хо́чется]{.ru}'
    - '[мне хоте́лось]{.ru}'
  - base: '[ты + хоте́ться]{.ru}'
    cells:
    - '[ты + хоте́ться]{.ru}'
    - '[тебе́ хо́чется]{.ru}'
    - '[тебе́ хоте́лось]{.ru}'
  - base: '[он + хоте́ться]{.ru}'
    cells:
    - '[он + хоте́ться]{.ru}'
    - '[ему́ хо́чется]{.ru}'
    - '[ему́ хоте́лось]{.ru}'
  - base: '[она́ + хоте́ться]{.ru}'
    cells:
    - '[она́ + хоте́ться]{.ru}'
    - '[ей хо́чется]{.ru}'
    - '[ей хоте́лось]{.ru}'
  - base: '[мы + хоте́ться]{.ru}'
    cells:
    - '[мы + хоте́ться]{.ru}'
    - '[нам хо́чется]{.ru}'
    - '[нам хоте́лось]{.ru}'
  - base: '[вы + хоте́ться]{.ru}'
    cells:
    - '[вы + хоте́ться]{.ru}'
    - '[вам хо́чется]{.ru}'
    - '[вам хоте́лось]{.ru}'
  - base: '[они́ + хоте́ться]{.ru}'
    cells:
    - '[они́ + хоте́ться]{.ru}'
    - '[им хо́чется]{.ru}'
    - '[им хоте́лось]{.ru}'
  - base: '[Ми́ша + каза́ться]{.ru}'
    cells:
    - '[Ми́ша + каза́ться]{.ru}'
    - '[Ми́ше ка́жется]{.ru}'
    - '[Ми́ше каза́лось]{.ru}'
  - base: '[А́нна + каза́ться]{.ru}'
    cells:
    - '[А́нна + каза́ться]{.ru}'
    - '[А́нне ка́жется]{.ru}'
    - '[А́нне каза́лось]{.ru}'
  - base: '[Ван Лэй + каза́ться]{.ru}'
    cells:
    - '[Ван Лэй + каза́ться]{.ru}'
    - '[Ван Лэ́ю ка́жется]{.ru}'
    - '[Ван Лэ́ю каза́лось]{.ru}'
  - base: '[роди́тели + каза́ться]{.ru}'
    cells:
    - '[роди́тели + каза́ться]{.ru}'
    - '[роди́телям ка́жется]{.ru}'
    - '[роди́телям каза́лось]{.ru}'
  - base: '[ба́бушка + каза́ться]{.ru}'
    cells:
    - '[ба́бушка + каза́ться]{.ru}'
    - '[ба́бушке ка́жется]{.ru}'
    - '[ба́бушке каза́лось]{.ru}'
  - base: '[Пьер + каза́ться]{.ru}'
    cells:
    - '[Пьер + каза́ться]{.ru}'
    - '[Пье́ру ка́жется]{.ru}'
    - '[Пье́ру каза́лось]{.ru}'
  - base: '[студе́нты + каза́ться]{.ru}'
    cells:
    - '[студе́нты + каза́ться]{.ru}'
    - '[студе́нтам ка́жется]{.ru}'
    - '[студе́нтам каза́лось]{.ru}'
  why: '第 1–7 题：无人称句里人用第三格：[мне, тебе́, ему́, ей, нам, вам, им]{.ru}，不说 *[я хо́чется]{.ru}*。

    第 1–7 题：过去时一律用中性单数：[хоте́лось, каза́лось]{.ru}，不随人的性、数变：[ей хоте́лось, им хоте́лось]{.ru}。

    第 8–14 题：名词也用第三格：[Ми́ше, А́нне, Ван Лэ́ю, Пье́ру]{.ru}，复数 [роди́телям, студе́нтам]{.ru}；动词仍是 [ка́жется / каза́лось]{.ru}，不变成复数。'
