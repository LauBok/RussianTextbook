    第 8、9 题：阴性 [-ой]{.ru}：[ры́бой, весно́й]{.ru}。

    第 2、10 题：中性 [-ом / -ем]{.ru}：[мя́сом, мо́рем]{.ru}。

    第 1、3、11、13 题：复数第五格 [-ами]{.ru}：[пирога́ми, цвета́ми, я́блоками, ро́зами]{.ru}；[цветы́]{.ru} 第五格重音在词尾。

    第 4 题：不变格名词不变：[па́хнет ко́фе]{.ru}。'
- id: B2-L61-03
  tags:
  - ка́жется 的三种用法
  task: 按 [ка́жется]{.ru} 的用法把句子归栏。
  type: classify
  bins:
  - '[мне ка́жется, что…]{.ru}'
  - 插入语 [ка́жется]{.ru}
  - '[каза́ться]{.ru} + 第五格'
  items:
  - text: '[Мне ка́жется, что за́втра бу́дет дождь.]{.ru}'
    answer: '[мне ка́жется, что…]{.ru}'
  - text: '[Ка́жется, я забы́л ключи́.]{.ru}'
    answer: 插入语 [ка́жется]{.ru}
  - text: '[Он ка́жется уста́лым.]{.ru}'
    answer: '[каза́ться]{.ru} + 第五格'
  - text: '[Ей каза́лось, что все на неё смо́трят.]{.ru}'
    answer: '[мне ка́жется, что…]{.ru}'
  - text: '[Ка́жется, авто́бус уже́ ушёл.]{.ru}'
    answer: 插入语 [ка́жется]{.ru}
  - text: '[Ко́мната каза́лась ма́ленькой.]{.ru}'
    answer: '[каза́ться]{.ru} + 第五格'
  - text: '[Нам ка́жется, что вы пра́вы.]{.ru}'
    answer: '[мне ка́жется, что…]{.ru}'
  - text: '[Э́то, ка́жется, кни́га Ди́мы.]{.ru}'
    answer: 插入语 [ка́жется]{.ru}
  - text: '[Ба́бушка ка́жется молодо́й.]{.ru}'
    answer: '[каза́ться]{.ru} + 第五格'
  - text: '[Мне каза́лось, что фильм никогда́ не ко́нчится.]{.ru}'
    answer: '[мне ка́жется, что…]{.ru}'
  - text: '[Он, ка́жется, уже́ до́ма.]{.ru}'
    answer: 插入语 [ка́жется]{.ru}
  - text: '[Зада́ние каза́лось тру́дным.]{.ru}'
    answer: '[каза́ться]{.ru} + 第五格'
  - text: '[Ми́ше ка́жется, что все экза́мены лёгкие.]{.ru}'
    answer: '[мне ка́жется, что…]{.ru}'
  - text: '[Ка́жется, сего́дня бу́дет хоро́шая пого́да.]{.ru}'
    answer: 插入语 [ка́жется]{.ru}
  why: '第 1、4、7、10、13 题：人用第三格 + [ка́жется / каза́лось, что…]{.ru}：“某人觉得……”，说自己的看法。

    第 2、5、8、11、14 题：不带第三格、用逗号隔开的 [ка́жется]{.ru} 是插入语，“好像，似乎”，去掉它句子仍然完整。

    第 3、6、9、12 题：有主语，[каза́ться]{.ru} 按主语变，后接形容词第五格：“看起来……”：[ка́жется уста́лым, каза́лась ма́ленькой]{.ru}。'
- id: B2-L61-04
  tags:
  - 无人称动词：句中
  task: 用括号里的词填空（句中）。
  type: fill
  items:
  - stem: Вчера́ ве́чером ___ гуля́ть.
    hint: мы + хоте́ться
    accept:
    - нам хоте́лось
  - stem: Сейча́с ___ пить.
    hint: я + хоте́ться
    accept:
    - мне хо́чется
  - stem: В ию́не ___ о́чень ра́но.
    hint: светле́ть
    accept:
    - светле́ет
  - stem: Зимо́й в Москве́ ___ ра́но.
    hint: темне́ть
    accept:
    - темне́ет
  - stem: Когда́ мы вы́шли из до́ма, уже́ ___.
    hint: темне́ть
    accept:
    - темне́ло
  - stem: В конце́ октября́ в Москве́ ___.
    hint: холода́ть
    accept:
    - холода́ет
  - stem: ___, что я тебя́ где́-то ви́дел.
    hint: я + каза́ться
    accept:
    - мне ка́жется
  - stem: Ра́ньше ___, что ру́сский язы́к о́чень тру́дный.
    hint: Ван Лэй + каза́ться
    accept:
    - Ван Лэ́ю каза́лось
  - stem: ___ не хо́чется идти́ в шко́лу.
    hint: Ми́ша
    accept:
    - Ми́ше
  - stem: ___ спать, но он рабо́тал.
    hint: он + хоте́ться
    accept:
    - ему́ хоте́лось
  - stem: Роди́телям ___, что Ми́ша мно́го игра́ет.
    hint: каза́ться
    accept:
    - ка́жется
  - stem: На ку́хне ___ ко́фе.
    hint: па́хнуть
    accept:
    - па́хнет
  - stem: Вдруг ___ ды́мом.
    hint: запа́хнуть
    accept:
    - запа́хло
  why: '第 1、2、7–11 题：人用第三格（[нам, мне, Ван Лэ́ю, Ми́ше, ему́]{.ru}），动词用第三人称单数或中性过去时；时间看句中的 [вчера́, сейча́с, ра́ньше]{.ru} 和后半句的时：[ему́ хоте́лось спать, но он рабо́тал]{.ru}。

    第 3–6 题：自然现象只用动词，不加主语：现在时 [темне́ет, светле́ет, холода́ет]{.ru}，过去时中性 [темне́ло]{.ru}。

    第 12、13 题：气味：[па́хнет]{.ru} + 第五格，[ко́фе]{.ru} 不变；“忽然飘来”用完成体过去时 [запа́хло]{.ru}。'
