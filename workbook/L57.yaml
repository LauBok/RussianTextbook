heading: 第 57 课　支配第三格的前置词
groups:
- id: L57-01
  tags: [支配第三格的前置词：到某人那里]
  task: 写出“到某人那里、走近某处”的词组。
  type: matrix
  cols: [第一格, '[к]{.ru} + 第三格']
  given: [0]
  rows:
  - {base: '[врач]{.ru}', cells: ['[врач]{.ru}', '[к врачу́]{.ru}']}
  - {base: '[ба́бушка]{.ru}', cells: ['[ба́бушка]{.ru}', '[к ба́бушке]{.ru}']}
  - {base: '[я]{.ru}', cells: ['[я]{.ru}', '[ко мне]{.ru}']}
  - {base: '[он]{.ru}', cells: ['[он]{.ru}', '[к нему́]{.ru}']}
  - {base: '[она́]{.ru}', cells: ['[она́]{.ru}', '[к ней]{.ru}']}
  - {base: '[они́]{.ru}', cells: ['[они́]{.ru}', '[к ним]{.ru}']}
  - {base: '[мы]{.ru}', cells: ['[мы]{.ru}', '[к нам]{.ru}']}
  - {base: '[ты]{.ru}', cells: ['[ты]{.ru}', '[к тебе́]{.ru}']}
  - {base: '[вы]{.ru}', cells: ['[вы]{.ru}', '[к вам]{.ru}']}
  - {base: '[кто]{.ru}', cells: ['[кто]{.ru}', '[к кому́]{.ru}']}
  - {base: '[друг]{.ru}', cells: ['[друг]{.ru}', '[к дру́гу]{.ru}']}
  - {base: '[О́льга Ви́кторовна]{.ru}', cells: ['[О́льга Ви́кторовна]{.ru}', '[к О́льге Ви́кторовне]{.ru}']}
  - {base: '[учи́тель]{.ru}', cells: ['[учи́тель]{.ru}', '[к учи́телю]{.ru}']}
  - {base: '[сестра́]{.ru}', cells: ['[сестра́]{.ru}', '[к сестре́]{.ru}']}
  - {base: '[де́душка]{.ru}', cells: ['[де́душка]{.ru}', '[к де́душке]{.ru}']}
  - {base: '[кабине́т]{.ru}', cells: ['[кабине́т]{.ru}', '[к кабине́ту]{.ru}']}
  - {base: '[Мари́я]{.ru}', cells: ['[Мари́я]{.ru}', '[к Мари́и]{.ru}']}
  - {base: '[дочь]{.ru}', cells: ['[дочь]{.ru}', '[к до́чери]{.ru}']}
  why: |
    第 1、2、11–18 题：[к]{.ru} 后面用第三格，名词按第 51 课的词尾变：[к врачу́, к ба́бушке, к дру́гу, к учи́телю, к Мари́и, к до́чери]{.ru}；第 15 题 [де́душка]{.ru} 按阴性变 [-е]{.ru}。第 16 题 [к]{.ru} 也可以表示走近某个地方：[к кабине́ту]{.ru}。
    第 3 题：[к мне]{.ru} 不好读，要说 [ко мне]{.ru}。
    第 4–6 题：第三人称代词前有前置词，要加 [н-]{.ru}：[к нему́, к ней, к ним]{.ru}。
    第 7–10 题：[к нам, к тебе́, к вам, к кому́]{.ru}，代词形式和不带前置词时相同。
- id: L57-02
  tags: [去向：去某地与去找某人对照]
  task: 写出“去某地”和“去找某人”的说法。
  type: matrix
  cols: [地方和人, '去哪里（[в / на]{.ru} + 第四格）', '去找谁（[к]{.ru} + 第三格）']
  given: [0]
  rows:
  - {base: '[поликли́ника, врач]{.ru}', cells: ['[поликли́ника, врач]{.ru}', '[в поликли́нику]{.ru}', '[к врачу́]{.ru}']}
  - {base: '[шко́ла, учи́тель]{.ru}', cells: ['[шко́ла, учи́тель]{.ru}', '[в шко́лу]{.ru}', '[к учи́телю]{.ru}']}
  - {base: '[университе́т, преподава́тель]{.ru}', cells: ['[университе́т, преподава́тель]{.ru}', '[в университе́т]{.ru}', '[к преподава́телю]{.ru}']}
  - {base: '[да́ча, ба́бушка]{.ru}', cells: ['[да́ча, ба́бушка]{.ru}', '[на да́чу]{.ru}', '[к ба́бушке]{.ru}']}
  - {base: '[по́чта, сотру́дница]{.ru}', cells: ['[по́чта, сотру́дница]{.ru}', '[на по́чту]{.ru}', '[к сотру́днице]{.ru}']}
  - {base: '[рабо́та, па́па]{.ru}', cells: ['[рабо́та, па́па]{.ru}', '[на рабо́ту]{.ru}', '[к па́пе]{.ru}']}
  - {base: '[общежи́тие, друг]{.ru}', cells: ['[общежи́тие, друг]{.ru}', '[в общежи́тие]{.ru}', '[к дру́гу]{.ru}']}
  - {base: '[кабине́т, до́ктор]{.ru}', cells: ['[кабине́т, до́ктор]{.ru}', '[в кабине́т]{.ru}', '[к до́ктору]{.ru}']}
  - {base: '[магази́н, продаве́ц]{.ru}', cells: ['[магази́н, продаве́ц]{.ru}', '[в магази́н]{.ru}', '[к продавцу́]{.ru}']}
  - {base: '[ка́федра, О́льга Ви́кторовна]{.ru}', cells: ['[ка́федра, О́льга Ви́кторовна]{.ru}', '[на ка́федру]{.ru}', '[к О́льге Ви́кторовне]{.ru}']}
  - {base: '[Кита́й, брат]{.ru}', cells: ['[Кита́й, брат]{.ru}', '[в Кита́й]{.ru}', '[к бра́ту]{.ru}']}
  - {base: '[теа́тр, актёр]{.ru}', cells: ['[теа́тр, актёр]{.ru}', '[в теа́тр]{.ru}', '[к актёру]{.ru}']}
  - {base: '[стадио́н, Пьер]{.ru}', cells: ['[стадио́н, Пьер]{.ru}', '[на стадио́н]{.ru}', '[к Пье́ру]{.ru}']}
  why: |
    第 1–13 题：去某个地方用 [в / на]{.ru} + 第四格（第 24 课），去找某个人用 [к]{.ru} + 第三格；不能说 [в врача́, на ба́бушку]{.ru}。两种可以一起用：[Ван Лэй идёт в поликли́нику к врачу́.]{.ru}
    第 4–6、10、13 题：[да́ча, по́чта, рабо́та, ка́федра, стадио́н]{.ru} 前用 [на]{.ru}，其余用 [в]{.ru}，和表示处所时的搭配一致。
    第 9 题：[продаве́ц]{.ru} 变格时 [е]{.ru} 脱落，重音在词尾：[к продавцу́]{.ru}。
- id: L57-03
  tags: [支配第三格的前置词：沿着、通过、学科]
  task: 用括号里的词填空。
  type: fill
  items:
  - {stem: 'Мы гуля́ем по ___.', hint: го́род, accept: [го́роду]}
  - {stem: 'Он идёт по ___.', hint: у́лица, accept: [у́лице]}
  - {stem: 'Она́ звони́т по ___.', hint: телефо́н, accept: [телефо́ну]}
  - {stem: 'У меня́ зада́ние по ___.', hint: ру́сский язы́к, accept: [ру́сскому языку́]}
  - {stem: 'За́втра у Ми́ши уро́к по ___.', hint: му́зыка, accept: [му́зыке]}
  - {stem: 'По ___ идёт фильм.', hint: телеви́зор, accept: [телеви́зору]}
  - {stem: 'Вчера́ мы гуля́ли по ___.', hint: парк, accept: [па́рку]}
  - {stem: 'Ван Лэй идёт по ___.', hint: коридо́р, accept: [коридо́ру]}
  - {stem: 'В пя́тницу у нас контро́льная по ___.', hint: исто́рия, accept: [исто́рии]}
  - {stem: 'Ми́ша хо́дит по ___.', hint: ко́мната, accept: [ко́мнате]}
  - {stem: 'Я смотрю́ э́тот фильм по ___.', hint: интерне́т, accept: [интерне́ту]}
  - {stem: 'Па́па е́дет по ___.', hint: Москва́, accept: [Москве́]}
  - {stem: 'Сего́дня ле́кция по ___.', hint: ру́сская исто́рия, accept: [ру́сской исто́рии]}
  - {stem: 'Ю́ми гуля́ет по ___.', hint: Кра́сная пло́щадь, accept: [Кра́сной пло́щади]}
  why: |
    第 1、2、7、8、10、12、14 题：[по]{.ru} 表示在一个面上走动（沿着、在……上），不说明终点：[по го́роду, по у́лице, по па́рку, по Кра́сной пло́щади]{.ru}。
    第 3、6、11 题：[по]{.ru} 表示通过通讯工具：[по телефо́ну, по телеви́зору, по интерне́ту]{.ru}。
    第 4、5、9、13 题：[по]{.ru} 表示某门学科的：[зада́ние по ру́сскому языку́, уро́к по му́зыке]{.ru}；汉语“俄语作业”不能说成 [ру́сское зада́ние]{.ru}。第 4、13 题形容词同时变第三格：[ру́сскому, ру́сской]{.ru}。
    第 9、14 题：[исто́рия → исто́рии, пло́щадь → пло́щади]{.ru}。
- id: L57-04
  tags: [前置词与格：已学前置词总表]
  task: 判断前置词后面的名词或代词用的是第几格，填写序号。
  type: classify
  bins: [第二格, 第三格, 第四格, 第六格]
  items:
  - {text: '[к ма́ме]{.ru}', answer: 第三格}
  - {text: '[по у́лице]{.ru}', answer: 第三格}
  - {text: '[в шко́ле]{.ru}', answer: 第六格}
  - {text: '[в шко́лу]{.ru}', answer: 第四格}
  - {text: '[у ма́мы]{.ru}', answer: 第二格}
  - {text: '[че́рез час]{.ru}', answer: 第四格}
  - {text: '[о ма́ме]{.ru}', answer: 第六格}
  - {text: '[без са́хара]{.ru}', answer: 第二格}
  - {text: '[к врачу́]{.ru}', answer: 第三格}
  - {text: '[на рабо́ту]{.ru}', answer: 第四格}
  - {text: '[на рабо́те]{.ru}', answer: 第六格}
  - {text: '[для бра́та]{.ru}', answer: 第二格}
  - {text: '[по телефо́ну]{.ru}', answer: 第三格}
  - {text: '[по́сле уро́ка]{.ru}', answer: 第二格}
  - {text: '[из Пеки́на]{.ru}', answer: 第二格}
  - {text: '[на по́чту]{.ru}', answer: 第四格}
  - {text: '[к нему́]{.ru}', answer: 第三格}
  - {text: '[о нём]{.ru}', answer: 第六格}
  - {text: '[напро́тив па́рка]{.ru}', answer: 第二格}
  - {text: '[в суббо́ту]{.ru}', answer: 第四格}
  - {text: '[в аудито́рии]{.ru}', answer: 第六格}
  - {text: '[к О́льге Ви́кторовне]{.ru}', answer: 第三格}
  why: |
    第 5、8、12、14、15、19 题：[у, без, для, по́сле, из, напро́тив]{.ru} 要求第二格。
    第 1、2、9、13、17、22 题：[к, по]{.ru} 要求第三格。注意第 1 题 [к ма́ме]{.ru} 和第 7 题 [о ма́ме]{.ru} 词形相同，格不同，要看前置词。
    第 4、6、10、16、20 题：[в, на]{.ru} 表示去向、[в]{.ru} 表示星期几、[че́рез]{.ru} 表示过多久，都要求第四格。
    第 3、7、11、18、21 题：[в, на]{.ru} 表示处所、[о]{.ru} 表示谈论对象，要求第六格。第 3、4 题和第 10、11 题说明同一个 [в / на]{.ru} 可以接两个格：问 [где?]{.ru} 用第六格，问 [куда́?]{.ru} 用第四格。
- id: L57-05
  tags: [去向：去某地与去找某人的选择]
  task: 用括号里的词填空，前置词一起写出。
  type: fill
  items:
  - {stem: 'Ван Лэй идёт ___.', hint: врач, accept: [к врачу́]}
  - {stem: 'Ван Лэй идёт ___.', hint: поликли́ника, accept: [в поликли́нику]}
  - {stem: 'В суббо́ту мы е́дем ___.', hint: ба́бушка, accept: [к ба́бушке]}
  - {stem: 'В суббо́ту мы е́дем ___.', hint: да́ча, accept: [на да́чу]}
  - {stem: 'Ми́ша идёт ___.', hint: друг, accept: [к дру́гу]}
  - {stem: 'А́нна идёт ___.', hint: библиоте́ка, accept: [в библиоте́ку]}
  - {stem: 'Студе́нты иду́т ___.', hint: О́льга Ви́кторовна, accept: [к О́льге Ви́кторовне]}
  - {stem: 'Па́па е́дет ___.', hint: рабо́та, accept: [на рабо́ту]}
  - {stem: 'Ю́ми идёт ___.', hint: сосе́дка, accept: [к сосе́дке]}
  - {stem: 'Пьер идёт ___.', hint: по́чта, accept: [на по́чту]}
  - {stem: 'Ма́ма идёт ___.', hint: он, accept: [к нему́]}
  - {stem: 'В ию́ле мы е́дем ___.', hint: мо́ре, accept: [на мо́ре]}
  - {stem: 'Ты идёшь ___?', hint: я, accept: [ко мне]}
  - {stem: 'Мы идём ___.', hint: теа́тр, accept: [в теа́тр]}
  - {stem: 'Он идёт ___ но́мер пять.', hint: кабине́т, accept: [к кабине́ту, в кабине́т]}
  - {stem: 'Ван Лэй е́дет ___.', hint: Кита́й, accept: [в Кита́й]}
  why: |
    第 1、3、5、7、9、11、13 题：去找某个人，用 [к]{.ru} + 第三格：[к врачу́, к ба́бушке, к дру́гу, к О́льге Ви́кторовне, к сосе́дке, к нему́, ко мне]{.ru}。
    第 2、4、6、8、10、12、14、16 题：去某个地方，用 [в / на]{.ru} + 第四格；[да́ча, рабо́та, по́чта, мо́ре]{.ru} 前用 [на]{.ru}。
    第 15 题：走近某个地方，不进去，用 [к]{.ru}：[к кабине́ту но́мер пять]{.ru}。
