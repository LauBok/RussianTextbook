heading: 第 13 课　副动词短语与从句的互换
groups:
- id: B3-L13-01
  lessons:
  - B3-L13
  tags:
  - 副动词与从句：能否互换
  task: 从句能改成副动词短语吗？归栏。
  type: classify
  bins:
  - 能改成副动词短语
  - 不能改
  items:
  - text: '[Когда́ я возвраща́лся домо́й, я встре́тил дру́га.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Когда́ я возвраща́лся домо́й, начался́ дождь.]{.ru}'
    answer: 不能改
  - text: '[Так как она́ не зна́ла а́дреса, она́ позвони́ла бра́ту.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Когда́ со́лнце се́ло, мы пошли́ домо́й.]{.ru}'
    answer: 不能改
  - text: '[По́сле того́ как мы поу́жинали, мы пошли́ гуля́ть.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Когда́ я писа́л письмо́, я ду́мал о ма́ме.]{.ru}'
    answer: 不能改
  - text: '[Е́сли опозда́ешь на по́езд, придётся ждать до утра́.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Когда́ мосты́ разво́дят, на берегу́ собира́ется мно́го люде́й.]{.ru}'
    answer: 不能改
  - text: '[Когда́ тури́сты осма́тривают го́род, они́ мно́го фотографи́руют.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Когда́ мы жда́ли авто́бус, мы разгова́ривали.]{.ru}'
    answer: 不能改
  - text: '[Так как он боя́лся опозда́ть, он взял такси́.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Когда́ дом был постро́ен, в него́ перее́хали молоды́е се́мьи.]{.ru}'
    answer: 不能改
  - text: '[Когда́ студе́нты сда́ли экза́мены, они́ пое́хали на мо́ре.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Е́сли ты придёшь ра́но, мы успе́ем на по́езд.]{.ru}'
    answer: 不能改
  - text: '[Когда́ де́ти чита́ют, они́ мно́го узнаю́т.]{.ru}'
    answer: 能改成副动词短语
  - text: '[Так как он не мог спать, он чита́л всю ночь.]{.ru}'
    answer: 不能改
  why: |-
    第 1、3、5、9、11、13、15 题：从句和主句的主语相同，可以改：[Возвраща́ясь домо́й, я встре́тил дру́га]{.ru}；[Не зна́я а́дреса, она́ позвони́ла бра́ту]{.ru}；[Поу́жинав, мы пошли́ гуля́ть]{.ru}；[Боя́сь опозда́ть, он взял такси́]{.ru}；[Сдав экза́мены, студе́нты пое́хали на мо́ре]{.ru}。
    第 7 题：主句是带不定式的无人称句，“迟到”和“等”的是同一个人，可以改：[Опозда́в на по́езд, придётся ждать до утра́]{.ru}。
    第 2、4、14 题：主语不同（[я / дождь]{.ru}，[со́лнце / мы]{.ru}，[ты / мы]{.ru}），不能改。
    第 6、10、16 题：[писа́ть, ждать, мочь]{.ru} 没有副动词，只能用从句。
    第 8 题：从句是不定人称句；第 12 题：从句是被动句。两句里做事的人都不是句子的主语，不能改。
- id: B3-L13-02
  lessons:
  - B3-L13
  tags:
  - 副动词与从句：从句 → 副动词
  - 副动词与从句：体的对应
  task: 把从句改成副动词短语：写出副动词。
  type: matrix
  cols:
  - 句子
  - 副动词
  given:
  - 0
  rows:
  - base: '[Когда́ он посмотре́л на мост, он пошёл домо́й.]{.ru}'
    cells:
    - '[Когда́ он посмотре́л на мост, он пошёл домо́й.]{.ru}'
    - '[посмотре́в]{.ru}'
  - base: '[Когда́ они́ гуля́ли по на́бережной, они́ мно́го смея́лись.]{.ru}'
    cells:
    - '[Когда́ они́ гуля́ли по на́бережной, они́ мно́го смея́лись.]{.ru}'
    - '[гуля́я]{.ru}'
  - base: '[Е́сли опозда́ешь на по́езд, придётся ждать до утра́.]{.ru}'
    cells:
    - '[Е́сли опозда́ешь на по́езд, придётся ждать до утра́.]{.ru}'
    - '[опозда́в]{.ru}'
  - base: '[Так как они́ привы́кли к холо́дной зиме́, они́ не боя́лись моро́за.]{.ru}'
    cells:
    - '[Так как они́ привы́кли к холо́дной зиме́, они́ не боя́лись моро́за.]{.ru}'
    - '[привы́кнув]{.ru}'
  - base: '[Когда́ я чита́ю газе́ту, я пью ко́фе.]{.ru}'
    cells:
    - '[Когда́ я чита́ю газе́ту, я пью ко́фе.]{.ru}'
    - '[чита́я]{.ru}'
  - base: '[По́сле того́ как студе́нты сда́ли экза́мены, они́ уе́хали домо́й.]{.ru}'
    cells:
    - '[По́сле того́ как студе́нты сда́ли экза́мены, они́ уе́хали домо́й.]{.ru}'
    - '[сдав]{.ru}'
  - base: '[Когда́ мы бу́дем отдыха́ть на мо́ре, мы бу́дем мно́го пла́вать.]{.ru}'
    cells:
    - '[Когда́ мы бу́дем отдыха́ть на мо́ре, мы бу́дем мно́го пла́вать.]{.ru}'
    - '[отдыха́я]{.ru}'
  - base: '[Когда́ она́ вернётся из Москвы́, она́ позвони́т тебе́.]{.ru}'
    cells:
    - '[Когда́ она́ вернётся из Москвы́, она́ позвони́т тебе́.]{.ru}'
    - '[верну́вшись]{.ru}'
  - base: '[Так как он не зна́л доро́ги, он спроси́л прохо́жего.]{.ru}'
    cells:
    - '[Так как он не зна́л доро́ги, он спроси́л прохо́жего.]{.ru}'
    - '[не зна́я]{.ru}'
  - base: '[Когда́ Ми́ша вошёл в ко́мнату, он включи́л свет.]{.ru}'
    cells:
    - '[Когда́ Ми́ша вошёл в ко́мнату, он включи́л свет.]{.ru}'
    - '[войдя́]{.ru}'
  - base: '[Когда́ я гото́вился к экза́мену, я мно́го занима́лся в библиоте́ке.]{.ru}'
    cells:
    - '[Когда́ я гото́вился к экза́мену, я мно́го занима́лся в библиоте́ке.]{.ru}'
    - '[гото́вясь]{.ru}'
  - base: '[Е́сли вы прочита́ете э́ту кни́гу, вы всё поймёте.]{.ru}'
    cells:
    - '[Е́сли вы прочита́ете э́ту кни́гу, вы всё поймёте.]{.ru}'
    - '[прочита́в]{.ru}'
  - base: '[Так как она́ боя́лась опозда́ть, она́ взяла́ такси́.]{.ru}'
    cells:
    - '[Так как она́ боя́лась опозда́ть, она́ взяла́ такси́.]{.ru}'
    - '[боя́сь]{.ru}'
  - base: '[Когда́ тури́сты вы́шли из авто́буса, они́ пошли́ к реке́.]{.ru}'
    cells:
    - '[Когда́ тури́сты вы́шли из авто́буса, они́ пошли́ к реке́.]{.ru}'
    - '[вы́йдя]{.ru}'
  why: |-
    第 2、5、7、9、11、13 题：从句谓语是未完成体，不论现在、过去还是将来，都改成未完成体副动词：[гуля́я, чита́я, отдыха́я, не зна́я, гото́вясь, боя́сь]{.ru}。第 7 题 [бу́дем отдыха́ть]{.ru} 是未完成体将来时，副动词仍是 [отдыха́я]{.ru}。
    第 1、3、4、6、8、10、12、14 题：从句谓语是完成体（过去时或将来时），改成完成体副动词：[посмотре́в, опозда́в, привы́кнув, сдав, верну́вшись, войдя́, прочита́в, вы́йдя]{.ru}。第 1 题不能改成 [смотря́]{.ru}；第 8 题将来时 [вернётся]{.ru} 也改成 [верну́вшись]{.ru}；第 10、14 题 [-йти]{.ru} 类用 [-я]{.ru}。
- id: B3-L13-03
  lessons:
  - B3-L13
  tags:
  - 副动词与从句：副动词 → 从句
  task: 把副动词短语还原成从句（主语与主句相同）：写出从句的谓语。
  type: matrix
  cols:
  - 句子
  - 从句谓语
  given:
  - 0
  rows:
  - base: '[Гуля́я по го́роду, тури́сты фотографи́руют дворцы́.]{.ru}'
    cells:
    - '[Гуля́я по го́роду, тури́сты фотографи́руют дворцы́.]{.ru}'
    - '[гуля́ют]{.ru}'
  - base: '[Вы́йдя из метро́, мы уви́дели Кремль.]{.ru}'
    cells:
    - '[Вы́йдя из метро́, мы уви́дели Кремль.]{.ru}'
    - '[вы́шли]{.ru}'
  - base: '[Верну́вшись домо́й, Ми́ша сра́зу сел за уро́ки.]{.ru}'
    cells:
    - '[Верну́вшись домо́й, Ми́ша сра́зу сел за уро́ки.]{.ru}'
    - '[верну́лся]{.ru}'
  - base: '[Чита́я пи́сьма, ба́бушка пла́кала.]{.ru}'
    cells:
    - '[Чита́я пи́сьма, ба́бушка пла́кала.]{.ru}'
    - '[чита́ла]{.ru}'
  - base: '[Прочита́в статью́, вы всё поймёте.]{.ru}'
    cells:
    - '[Прочита́в статью́, вы всё поймёте.]{.ru}'
    - '[прочита́ете]{.ru}'
  - base: '[Слу́шая му́зыку, я отдыха́ю.]{.ru}'
    cells:
    - '[Слу́шая му́зыку, я отдыха́ю.]{.ru}'
    - '[слу́шаю]{.ru}'
  - base: '[Купи́в биле́ты, мы пойдём в зал.]{.ru}'
    cells:
    - '[Купи́в биле́ты, мы пойдём в зал.]{.ru}'
    - '[ку́пим]{.ru}'
  - base: '[Возвраща́ясь домо́й, А́нна зашла́ в апте́ку.]{.ru}'
    cells:
    - '[Возвраща́ясь домо́й, А́нна зашла́ в апте́ку.]{.ru}'
    - '[возвраща́лась]{.ru}'
  - base: '[Не зна́я пра́вила, он сде́лал оши́бку.]{.ru}'
    cells:
    - '[Не зна́я пра́вила, он сде́лал оши́бку.]{.ru}'
    - '[не знал]{.ru}'
  - base: '[Прие́хав в Москву́, Ван Лэй позвони́л ма́ме.]{.ru}'
    cells:
    - '[Прие́хав в Москву́, Ван Лэй позвони́л ма́ме.]{.ru}'
    - '[прие́хал]{.ru}'
  - base: '[Гото́вясь к экза́мену, студе́нты бу́дут занима́ться ка́ждый день.]{.ru}'
    cells:
    - '[Гото́вясь к экза́мену, студе́нты бу́дут занима́ться ка́ждый день.]{.ru}'
    - '[бу́дут гото́виться]{.ru}'
  - base: '[Услы́шав звоно́к, де́ти вы́бежали из кла́сса.]{.ru}'
    cells:
    - '[Услы́шав звоно́к, де́ти вы́бежали из кла́сса.]{.ru}'
    - '[услы́шали]{.ru}'
  why: |-
    第 1、4、6、8、9、11 题：未完成体副动词还原成未完成体动词，时间跟主句：现在 [гуля́ют, слу́шаю]{.ru}，过去 [чита́ла, возвраща́лась, не знал]{.ru}，将来 [бу́дут гото́виться]{.ru}。人称、性、数跟主句主语：[ба́бушка чита́ла, А́нна возвраща́лась]{.ru}。
    第 2、3、10、12 题：完成体副动词还原成完成体过去时（主句是过去时）：[вы́шли, верну́лся, прие́хал, услы́шали]{.ru}。
    第 5、7 题：主句是将来时，完成体副动词还原成完成体将来时：[(Е́сли) вы прочита́ете, (Когда́) мы ку́пим]{.ru}。
