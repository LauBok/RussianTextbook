heading: 第 88 课　间接引语
groups:
- id: L88-01
  tags:
  - 间接引语：连接方式（что / 疑问词）
  task: 把原话转述成间接引语时用什么连接？给原话归类。
  type: classify
  bins:
  - 用 [что]{.ru} 连接
  - 保留原来的疑问词
  items:
  - text: «Я позвоню́ ве́чером».
    answer: 用 [что]{.ru} 连接
  - text: «Когда́ А́ня бу́дет до́ма?»
    answer: 保留原来的疑问词
  - text: «Где бу́дет конце́рт?»
    answer: 保留原来的疑问词
  - text: «В понеде́льник бу́дет контро́льная».
    answer: 用 [что]{.ru} 连接
  - text: «Что ты де́лаешь?»
    answer: 保留原来的疑问词
  - text: «Я купи́ла биле́ты».
    answer: 用 [что]{.ru} 连接
  - text: «Куда́ вы идёте?»
    answer: 保留原来的疑问词
  - text: «Кто звони́л?»
    answer: 保留原来的疑问词
  - text: «Ми́ша до́ма».
    answer: 用 [что]{.ru} 连接
  - text: «Почему́ ты не позвони́л?»
    answer: 保留原来的疑问词
  - text: «У меня́ то́же контро́льная».
    answer: 用 [что]{.ru} 连接
  - text: «Ско́лько сто́ит биле́т?»
    answer: 保留原来的疑问词
  - text: «Я не зна́ю его́ а́дрес».
    answer: 用 [что]{.ru} 连接
  - text: «Как тебя́ зову́т?»
    answer: 保留原来的疑问词
  - text: «Мы бу́дем у ба́бушки».
    answer: 用 [что]{.ru} 连接
  - text: «Чей э́то телефо́н?»
    answer: 保留原来的疑问词
  why: '第 1、4、6、9、11、13、15 题：原话是陈述句，转述时加连接词 [что]{.ru}：[Ка́тя сказа́ла, что позвони́т ве́чером.]{.ru}

    第 2、3、5、7、8、10、12、14、16 题：原话是带疑问词的问句，转述时不加 [что]{.ru}，用原来的疑问词连接，句末用句号：[Ка́тя спроси́ла, когда́ А́ня бу́дет до́ма.]{.ru}

    第 5 题：[«Что ты де́лаешь?»]{.ru} 里的 [что]{.ru} 本身就是疑问词“什么”，转述成 […, что я де́лаю]{.ru}，这个 [что]{.ru} 是疑问代词，不是连接词。'
- id: L88-02
  tags:
  - 间接引语：说话者—听话者—转述者的人称转换
  task: 原话是对转述人说的，转述人自己再说出来。写出转述时词组的人称形式。
  type: matrix
  cols:
  - 原话中的词组
  - 王磊转述皮埃尔对他说的话
  - 安娜转述卡佳对她说的话
  given:
  - 0
  rows:
  - base: '[я позвоню́ тебе́]{.ru}'
    cells:
    - '[я позвоню́ тебе́]{.ru}'
    - '[он позвони́т мне]{.ru}'
    - '[она́ позвони́т мне]{.ru}'
  - base: '[я тебе́ напишу́]{.ru}'
    cells:
    - '[я тебе́ напишу́]{.ru}'
    - '[он мне напи́шет]{.ru}'
    - '[она́ мне напи́шет]{.ru}'
  - base: '[ты мне позвони́шь]{.ru}'
    cells:
    - '[ты мне позвони́шь]{.ru}'
    - '[я ему́ позвоню́]{.ru}'
    - '[я ей позвоню́]{.ru}'
  - base: '[я зна́ю]{.ru}'
    cells:
    - '[я зна́ю]{.ru}'
    - '[он зна́ет]{.ru}'
    - '[она́ зна́ет]{.ru}'
  - base: '[ты зна́ешь]{.ru}'
    cells:
    - '[ты зна́ешь]{.ru}'
    - '[я зна́ю]{.ru}'
    - '[я зна́ю]{.ru}'
  - base: '[у меня́ есть биле́т]{.ru}'
    cells:
    - '[у меня́ есть биле́т]{.ru}'
    - '[у него́ есть биле́т]{.ru}'
    - '[у неё есть биле́т]{.ru}'
  - base: '[у тебя́ есть биле́т]{.ru}'
    cells:
    - '[у тебя́ есть биле́т]{.ru}'
    - '[у меня́ есть биле́т]{.ru}'
    - '[у меня́ есть биле́т]{.ru}'
  - base: '[мой брат]{.ru}'
    cells:
    - '[мой брат]{.ru}'
    - '[его́ брат]{.ru}'
    - '[её брат]{.ru}'
  - base: '[твоя́ кни́га]{.ru}'
    cells:
    - '[твоя́ кни́га]{.ru}'
    - '[моя́ кни́га]{.ru}'
    - '[моя́ кни́га]{.ru}'
  - base: '[я тебя́ жду]{.ru}'
    cells:
    - '[я тебя́ жду]{.ru}'
    - '[он меня́ ждёт]{.ru}'
    - '[она́ меня́ ждёт]{.ru}'
  - base: '[ты бу́дешь до́ма]{.ru}'
    cells:
    - '[ты бу́дешь до́ма]{.ru}'
    - '[я бу́ду до́ма]{.ru}'
    - '[я бу́ду до́ма]{.ru}'
  - base: '[мне ску́чно]{.ru}'
    cells:
    - '[мне ску́чно]{.ru}'
    - '[ему́ ску́чно]{.ru}'
    - '[ей ску́чно]{.ru}'
  - base: '[тебе́ ну́жно]{.ru}'
    cells:
    - '[тебе́ ну́жно]{.ru}'
    - '[мне ну́жно]{.ru}'
    - '[мне ну́жно]{.ru}'
  - base: '[я ду́маю о тебе́]{.ru}'
    cells:
    - '[я ду́маю о тебе́]{.ru}'
    - '[он ду́мает обо мне]{.ru}'
    - '[она́ ду́мает обо мне]{.ru}'
  - base: '[где твой а́дрес]{.ru}'
    cells:
    - '[где твой а́дрес]{.ru}'
    - '[где мой а́дрес]{.ru}'
    - '[где мой а́дрес]{.ru}'
  why: '说话人（皮埃尔、卡佳）的 [я, мой, мне, у меня́]{.ru} 转述时变成第三人称，并按说话人的性别选择：皮埃尔是男的，用 [он, его́, ему́, у него́]{.ru}；卡佳是女的，用 [она́, её, ей, у неё]{.ru}（第 1–4、6、8、10、12、14 题）。

    听话人就是转述人自己，原话里的 [ты, твой, тебе́, тебя́, у тебя́]{.ru} 转述时变成 [я, мой, мне, меня́, у меня́]{.ru}（第 1–3、5、7、9–11、13–15 题），两个转述人说法相同。

    动词随新的主语变人称：[я позвоню́ → он позвони́т]{.ru}，[ты зна́ешь → я зна́ю]{.ru}，[ты мне позвони́шь → я ему́ позвоню́]{.ru}。第 14 题 [о]{.ru} 在 [мне]{.ru} 前写成 [обо]{.ru}。'
- id: L88-03
  tags:
  - 间接引语：连接词 что 与代词 что
  task: 判断句中的 [что]{.ru} 是连接词还是疑问代词“什么”。
  type: classify
  bins:
  - 连接词（只起连接作用）
  - 疑问代词（“什么”）
  items:
  - text: Она́ сказа́ла, что купи́ла биле́ты.
    answer: 连接词（只起连接作用）
  - text: Она́ спроси́ла, что я де́лаю.
    answer: 疑问代词（“什么”）
  - text: Ми́ша сказа́л, что у него́ то́же контро́льная.
    answer: 连接词（只起连接作用）
  - text: Ка́тя спроси́ла, что мы бу́дем де́лать ве́чером.
    answer: 疑问代词（“什么”）
  - text: Я ду́мала, что контро́льная бу́дет в сре́ду.
    answer: 连接词（只起连接作用）
  - text: Па́па спроси́л, что ты чита́ешь.
    answer: 疑问代词（“什么”）
  - text: Я зна́ю, что ты был бо́лен.
    answer: 连接词（只起连接作用）
  - text: Ба́бушка спроси́ла, что мы хоти́м на у́жин.
    answer: 疑问代词（“什么”）
  - text: О́льга Ви́кторовна написа́ла, что в понеде́льник бу́дет контро́льная.
    answer: 连接词（只起连接作用）
  - text: Я не по́мню, что он сказа́л.
    answer: 疑问代词（“什么”）
  - text: Пьер отве́тил, что позвони́т за́втра.
    answer: 连接词（只起连接作用）
  - text: Ма́ма спроси́ла, что лежи́т на столе́.
    answer: 疑问代词（“什么”）
  - text: Ван Лэй написа́л, что в Москве́ хо́лодно.
    answer: 连接词（只起连接作用）
  - text: Скажи́, что ты ви́дел в музе́е.
    answer: 疑问代词（“什么”）
  - text: Ка́тя написа́ла, что купи́ла биле́ты.
    answer: 连接词（只起连接作用）
  - text: Ми́ша спроси́л, что у нас на у́жин.
    answer: 疑问代词（“什么”）
  why: '第 1、3、5、7、9、11、13、15 题：[что]{.ru} 是连接词，转述陈述句，本身没有意思，从句里有完整的主语和宾语，可译作“说……”。

    第 2、4、6、8、10、12、14、16 题：[что]{.ru} 是疑问代词“什么”，在从句里作宾语（[что я де́лаю, что ты чита́ешь, что он сказа́л]{.ru}）或主语（第 12 题 [что лежи́т]{.ru}，第 16 题 [что у нас на у́жин]{.ru}），去掉它从句就缺了成分。'
- id: L88-04
  tags:
  - 间接引语：动词的时保持不变
  task: 核查转述句里动词的时有没有保持原话的时，把句子归类。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: 'Ка́тя: «Я позвоню́ ве́чером». — Ка́тя сказа́ла, что позвони́т ве́чером.'
    answer: 正确
  - text: 'Ми́ша: «У меня́ контро́льная». — Ми́ша сказа́л, что у него́ была́ контро́льная.'
    answer: 有错
  - text: 'Пьер: «Я бо́лен». — Пьер сказа́л, что он бо́лен.'
    answer: 正确
  - text: 'А́нна: «Я бу́ду до́ма в шесть». — А́нна сказа́ла, что была́ до́ма в шесть.'
    answer: 有错
  - text: 'Ю́ми: «Я купи́ла биле́ты». — Ю́ми сказа́ла, что купи́ла биле́ты.'
    answer: 正确
  - text: 'Ми́ша: «Я иду́ в шко́лу». — Ми́ша сказа́л, что шёл в шко́лу.'
    answer: 有错
  - text: 'Ка́тя: «Где бу́дет конце́рт?» — Ка́тя спроси́ла, где бу́дет конце́рт.'
    answer: 正确
  - text: 'Ка́тя: «Где бу́дет конце́рт?» — Ка́тя спроси́ла, где был конце́рт.'
    answer: 有错
  - text: 'Ма́ма: «Я уста́ла». — Ма́ма сказа́ла, что она́ уста́ла.'
    answer: 正确
  - text: 'Ван Лэй: «Я живу́ у Петро́вых». — Ван Лэй сказа́л, что жил у Петро́вых.'
    answer: 有错
  - text: 'Пьер: «Что ты де́лаешь?» — Пьер спроси́л, что я де́лаю.'
    answer: 正确
  - text: 'О́льга Ви́кторовна: «Контро́льная бу́дет в сре́ду». — О́льга Ви́кторовна сказа́ла, что контро́льная бу́дет в сре́ду.'
    answer: 正确
  why: '第 1、3、5、7、9、11、12 题：主句是过去时 [сказа́л, спроси́ла]{.ru}，从句仍保持原话的时：原话将来时转述也用将来时（[позвони́т, бу́дет]{.ru}），原话现在时转述也用现在时（[бо́лен, де́лаю]{.ru}），原话过去时仍用过去时（[купи́ла, уста́ла]{.ru}）。

    第 2、4、6、8、10 题：照英语习惯把从句的时“后移”成了过去时，这是错的。应改为 [у него́ контро́льная]{.ru}、[что бу́дет до́ма в шесть]{.ru}、[что идёт в шко́лу]{.ru}、[где бу́дет конце́рт]{.ru}、[что живёт у Петро́вых]{.ru}。'
- id: L88-05
  tags:
  - 间接引语：代词所指标注
  task: 皮埃尔对王磊说了几句话，王磊再转述给安娜。判断括号里的代词指谁。
  type: classify
  bins:
  - 皮埃尔（原话的说话人）
  - 王磊（原话的听话人，转述人）
  - 安娜（听转述的人）
  items:
  - text: Пьер сказа́л, что он ку́пит биле́ты.
    answer: 皮埃尔（原话的说话人）
    hint: '[он]{.ru}'
  - text: Пьер сказа́л, что позвони́т мне ве́чером.
    answer: 王磊（原话的听话人，转述人）
    hint: '[мне]{.ru}'
  - text: Пьер спроси́л, где ты живёшь.
    answer: 安娜（听转述的人）
    hint: '[ты]{.ru}'
  - text: Пьер сказа́л, что у него́ есть биле́т для тебя́.
    answer: 安娜（听转述的人）
    hint: '[тебя́]{.ru}'
  - text: Пьер спроси́л, когда́ я бу́ду до́ма.
    answer: 王磊（原话的听话人，转述人）
    hint: '[я]{.ru}'
  - text: Пьер сказа́л, что его́ брат живёт в Пари́же.
    answer: 皮埃尔（原话的说话人）
    hint: '[его́]{.ru}'
  - text: Пьер спроси́л, где мой слова́рь.
    answer: 王磊（原话的听话人，转述人）
    hint: '[мой]{.ru}'
  - text: Пьер спроси́л, что ты де́лаешь в суббо́ту.
    answer: 安娜（听转述的人）
    hint: '[ты]{.ru}'
  - text: Пьер сказа́л, что ждёт меня́ в кафе́.
    answer: 王磊（原话的听话人，转述人）
    hint: '[меня́]{.ru}'
  - text: Пьер сказа́л, что ему́ ску́чно.
    answer: 皮埃尔（原话的说话人）
    hint: '[ему́]{.ru}'
  - text: Пьер сказа́л, что зна́ет твоего́ бра́та.
    answer: 安娜（听转述的人）
    hint: '[твоего́]{.ru}'
  - text: Пьер сказа́л, что он бо́лен.
    answer: 皮埃尔（原话的说话人）
    hint: '[он]{.ru}'
  - text: Пьер спроси́л, почему́ я не позвони́л.
    answer: 王磊（原话的听话人，转述人）
    hint: '[я]{.ru}'
  - text: Пьер спроси́л, кто твой учи́тель.
    answer: 安娜（听转述的人）
    hint: '[твой]{.ru}'
  - text: Пьер сказа́л, что у него́ нет вре́мени.
    answer: 皮埃尔（原话的说话人）
    hint: '[у него́]{.ru}'
  - text: Пьер спроси́л, куда́ ты идёшь ве́чером.
    answer: 安娜（听转述的人）
    hint: '[ты]{.ru}'
  why: '转述时代词按转述人王磊的角度选择：说话人皮埃尔是第三人称 [он, его́, ему́, у него́]{.ru}（第 1、6、10、12、15 题）；王磊说自己用 [я, мне, меня́, мой]{.ru}（第 2、5、7、9、13 题）；王磊对安娜说话，安娜是 [ты, тебя́, твой]{.ru}（第 3、4、8、11、14、16 题）。

    例如第 7 题，皮埃尔的原话是 [«Где твой слова́рь?»]{.ru}，问的是王磊的词典，王磊转述时说 [мой]{.ru}；第 3 题原话是 [«Где живёт А́нна?»]{.ru}，王磊当着安娜的面转述，说 [где ты живёшь]{.ru}。'
