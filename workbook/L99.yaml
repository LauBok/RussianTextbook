  why: '第 1–8 题：阳性 [-а / -я, -у / -ю, -ом / -ем, -е]{.ru}；第四格非动物同第一格（[биле́т, музе́й, пода́рок, день, ме́сяц]{.ru}），动物同第二格（[бра́та, учи́теля, отца́]{.ru}）。

    第 5–7 题：元音脱落，其余各格都从新词干变：[пода́рка, отца́, дня]{.ru}；[оте́ц]{.ru} 变格后重音在词尾，第五格 [отцо́м]{.ru}。第 8 题：[ц]{.ru} 后不带重音写 [-ем]{.ru}：[ме́сяцем]{.ru}。

    第 9–11 题：中性第四格同第一格；[мо́ре]{.ru} 软变化 [мо́ря, мо́рем]{.ru}；[-ие]{.ru} 结尾第六格 [-ии]{.ru}：[зда́нии]{.ru}。

    第 12、13、15 题：阴性 [-а / -я]{.ru}：第四格 [-у / -ю]{.ru}，第五格 [-ой / -ей]{.ru}；[-ия]{.ru} 结尾第二、三、六格都是 [-ии]{.ru}：[Росси́и]{.ru}。第 14 题：[-ь]{.ru} 结尾阴性第二、三、六格 [-и]{.ru}，第四格不变，第五格 [-ью]{.ru}。'
- id: L99-02
  tags:
  - 代词 + 形容词 + 名词：指定格的共同变化
  task: 把词组变成指定的格（[в, на]{.ru} 已印出）。
  type: matrix
  cols:
  - 词组
  - 指定的格
  given:
  - 0
  rows:
  - base: '[мой ста́рший брат]{.ru}'
    cells:
    - '[мой ста́рший брат]{.ru}'
    - '[у моего́ ста́ршего бра́та]{.ru}'
    hint: '[у]{.ru} + 第二格'
  - base: '[э́та но́вая кни́га]{.ru}'
    cells:
    - '[э́та но́вая кни́га]{.ru}'
    - '[в э́той но́вой кни́ге]{.ru}'
    hint: 第六格
  - base: '[наш большо́й го́род]{.ru}'
    cells:
    - '[наш большо́й го́род]{.ru}'
    - '[в на́шем большо́м го́роде]{.ru}'
    hint: 第六格
  - base: '[твоя́ си́няя ку́ртка]{.ru}'
    cells:
    - '[твоя́ си́няя ку́ртка]{.ru}'
    - '[твою́ си́нюю ку́ртку]{.ru}'
    hint: 第四格
  - base: '[э́тот хоро́ший учи́тель]{.ru}'
    cells:
    - '[э́тот хоро́ший учи́тель]{.ru}'
    - '[к э́тому хоро́шему учи́телю]{.ru}'
    hint: '[к]{.ru} + 第三格'
  - base: '[ва́ша ле́тняя да́ча]{.ru}'
    cells:
