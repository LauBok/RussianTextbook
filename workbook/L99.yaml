    - '[на ва́шей ле́тней да́че]{.ru}'
    hint: 第六格
  - base: '[моя́ мла́дшая сестра́]{.ru}'
    cells:
    - '[моя́ мла́дшая сестра́]{.ru}'
    - '[с мое́й мла́дшей сестро́й]{.ru}'
    hint: '[с]{.ru} + 第五格'
  - base: '[весь наш класс]{.ru}'
    cells:
    - '[весь наш класс]{.ru}'
    - '[всему́ на́шему кла́ссу]{.ru}'
    hint: 第三格
  - base: '[его́ но́вый друг]{.ru}'
    cells:
    - '[его́ но́вый друг]{.ru}'
    - '[его́ но́вого дру́га]{.ru}'
    hint: 第四格
