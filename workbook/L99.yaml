    cells:
    - '[её ста́рая подру́га]{.ru}'
    - '[у её ста́рой подру́ги]{.ru}'
    hint: '[у]{.ru} + 第二格'
  - base: '[э́то большо́е о́зеро]{.ru}'
    cells:
    - '[э́то большо́е о́зеро]{.ru}'
    - '[над э́тим больши́м о́зером]{.ru}'
    hint: '[над]{.ru} + 第五格'
  - base: '[вся на́ша семья́]{.ru}'
    cells:
    - '[вся на́ша семья́]{.ru}'
    - '[для всей на́шей семьи́]{.ru}'
    hint: '[для]{.ru} + 第二格'
  - base: '[наш хоро́ший врач]{.ru}'
    cells:
    - '[наш хоро́ший врач]{.ru}'
    - '[на́шего хоро́шего врача́]{.ru}'
    hint: 第四格
  - base: '[э́тот ма́ленький рестора́н]{.ru}'
    cells:
    - '[э́тот ма́ленький рестора́н]{.ru}'
    - '[в э́том ма́леньком рестора́не]{.ru}'
    hint: 第六格
  why: '三个词一起变，性数格一致。

    第 1、3、5、8、9、11、13、14 题：阳性、中性：代词 [моего́, э́тому, на́шем, всему́]{.ru}，形容词 [-ого, -ому, -ым, -ом]{.ru}；[большо́й]{.ru} 重音在词尾：[большо́м, больши́м]{.ru}，第 11 题 [г]{.ru} 后第五格写 [-им]{.ru}。第 9、13 题动物名词第四格同第二格：[но́вого дру́га, хоро́шего врача́]{.ru}。

    第 2、4、6、7、10、12 题：阴性：第四格 [твою́ си́нюю ку́ртку]{.ru}，其余各格代词 [-ей / -ой]{.ru}、形容词 [-ой / -ей]{.ru}：[мла́дшей, ле́тней]{.ru}（[ш]{.ru} 后和软变化写 [-ей]{.ru}）。

    第 9、10 题：[его́, её]{.ru} 作物主代词永远不变，前面也不加 [н-]{.ru}：[у её подру́ги]{.ru}，不说 [у неё подру́ги]{.ru}。'
- id: L99-03
  tags:
  - 人称代词：各格与前置词
  task: 写出人称代词各格和前置词连用的形式。
  type: matrix
  cols:
  - 第一格
  - '[у]{.ru} + 第二格'
  - '[к]{.ru} + 第三格'
  - 第四格
  - '[с]{.ru} + 第五格'
  - '[о]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[у меня́]{.ru}'
    - '[ко мне]{.ru}'
    - '[меня́]{.ru}'
    - '[со мной]{.ru}'
    - '[обо мне]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[у тебя́]{.ru}'
    - '[к тебе́]{.ru}'
    - '[тебя́]{.ru}'
    - '[с тобо́й]{.ru}'
    - '[о тебе́]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[у него́]{.ru}'
    - '[к нему́]{.ru}'
    - '[его́]{.ru}'
    - '[с ним]{.ru}'
    - '[о нём]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[у неё]{.ru}'
    - '[к ней]{.ru}'
    - '[её]{.ru}'
    - '[с ней]{.ru}'
    - '[о ней]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[у нас]{.ru}'
    - '[к нам]{.ru}'
    - '[нас]{.ru}'
    - '[с на́ми]{.ru}'
    - '[о нас]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[у вас]{.ru}'
    - '[к вам]{.ru}'
    - '[вас]{.ru}'
    - '[с ва́ми]{.ru}'
    - '[о вас]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[у них]{.ru}'
    - '[к ним]{.ru}'
    - '[их]{.ru}'
    - '[с ни́ми]{.ru}'
    - '[о них]{.ru}'
  why: '第 1、2、5、6 题：[меня́, тебя́, нас, вас]{.ru} 第二、四格相同。第 1 题前置词要加 [о]{.ru}：[ко мне, со мной, обо мне]{.ru}。

    第 3、4、7 题：第三人称在前置词后加 [н-]{.ru}：[у него́, к нему́, с ним, о нём]{.ru}；不带前置词的第四格不加：[его́, её, их]{.ru}。第六格总和前置词连用，所以永远是 [нём, ней, них]{.ru}。'
- id: L99-04
  tags:
  - 六格单数：语境选格
  task: 括号里的词在这个前置词或动词后面要用哪个格？
  type: classify
  bins:
  - 第二格
  - 第三格
  - 第四格
  - 第五格
  - 第六格
  items:
  - text: по́сле + уро́к
    answer: 第二格
  - text: к + ба́бушка
    answer: 第三格
  - text: с + друг
    answer: 第五格
    hint: 一起
  - text: о + Москва́
    answer: 第六格
  - text: нет + вре́мя
    answer: 第二格
  - text: ви́деть + брат
    answer: 第四格
  - text: помога́ть + ма́ма
    answer: 第三格
  - text: занима́ться + спорт
    answer: 第五格
  - text: в + шко́ла
    answer: 第四格
    hint: 去哪里
  - text: в + шко́ла
    answer: 第六格
    hint: 在哪里
  - text: из + Пеки́н
    answer: 第二格
  - text: нра́виться + А́нна
    answer: 第三格
  - text: рабо́тать + врач
    answer: 第五格
  - text: на + по́езд
    answer: 第六格
    hint: 乘车
  - text: без + молоко́
    answer: 第二格
  - text: звони́ть + па́па
    answer: 第三格
  - text: жела́ть + сча́стье
    answer: 第二格
  - text: поздравля́ть + сестра́
    answer: 第四格
  - text: под + стол
    answer: 第五格
  - text: спра́шивать + учи́тель
    answer: 第四格
  why: '第 1、5、11、15、17 题：第二格：[по́сле, из, без]{.ru} 要求第二格；[нет]{.ru} 后用第二格；[жела́ть]{.ru} 的内容用第二格。

    第 2、7、12、16 题：第三格：[к]{.ru}；[помога́ть, звони́ть]{.ru} 的对象；[нра́виться]{.ru} 的喜欢者。

    第 6、9、18、20 题：第四格：直接补语（[ви́деть, поздравля́ть, спра́шивать]{.ru} 的对象），[в]{.ru} 表方向。

    第 3、8、13、19 题：第五格：[с]{.ru} 表“和……一起”，[занима́ться, рабо́тать]{.ru} 的补语，[под]{.ru} 表位置。

    第 4、10、14 题：第六格：[о]{.ru} 表内容，[в]{.ru} 表处所，[на]{.ru} + 交通工具。第 9、10 题同一个 [в]{.ru}，去向用第四格，处所用第六格。'
