- id: B2-L27-综合-b
  tags:
  - 综合：形式的辨认
  task: 句子或词组里的形容词、副词是什么形式？归栏。
  type: classify
  bins:
  - 短尾中性
  - 副词
  - 比较级
  - 最高级
  items:
  - text: '[Мя́со гото́во.]{.ru}'
    answer: 短尾中性
  - text: '[Мо́ре споко́йно.]{.ru}'
    answer: 短尾中性
  - text: '[Ме́сто свобо́дно.]{.ru}'
    answer: 短尾中性
  - text: '[Не́бо я́сно.]{.ru}'
    answer: 短尾中性
  - text: '[Окно́ чи́сто.]{.ru}'
    answer: 短尾中性
  - text: '[Он гро́мко говори́т.]{.ru}'
    answer: 副词
  - text: '[Мы ве́село игра́ли.]{.ru}'
    answer: 副词
  - text: '[Ю́ми хорошо́ поёт.]{.ru}'
    answer: 副词
  - text: '[Он отве́тил че́стно.]{.ru}'
    answer: 副词
  - text: '[Пиши́ аккура́тно.]{.ru}'
    answer: 副词
  - text: '[Чай доро́же.]{.ru}'
    answer: 比较级
  - text: '[Говори́ ти́ше!]{.ru}'
    answer: 比较级
  - text: '[Пьер ста́рше меня́.]{.ru}'
    answer: 比较级
  - text: '[Э́та кни́га интере́снее.]{.ru}'
    answer: 比较级
  - text: '[Ми́ша бе́гает быстре́е всех.]{.ru}'
    answer: 比较级
  - text: '[са́мый тру́дный экза́мен]{.ru}'
    answer: 最高级
  - text: '[важне́йший вопро́с]{.ru}'
    answer: 最高级
  - text: '[высоча́йшая гора́]{.ru}'
    answer: 最高级
  - text: '[лу́чший друг]{.ru}'
    answer: 最高级
  - text: '[интере́снейшая кни́га]{.ru}'
    answer: 最高级
  why: |-
    第 1–5 题：说明中性名词主语，短尾中性：[гото́во, споко́йно, свобо́дно, я́сно, чи́сто]{.ru}。
    第 6–10 题：说明动词，副词：[гро́мко, ве́село, хорошо́, че́стно, аккура́тно]{.ru}。和第 1–5 题形式相同，要看说明什么。
    第 11–15 题：比较级（说明名词的是形容词比较级，说明动词的是副词比较级）：[доро́же, ти́ше, ста́рше, интере́снее, быстре́е]{.ru}。
    第 16–20 题：最高级：复合式 [са́мый тру́дный]{.ru}，单一式 [важне́йший, высоча́йшая, интере́снейшая]{.ru}，以及 [лу́чший]{.ru}。
