    - '[гото́вая ку́ртка]{.ru}'
  - base: '[Вы прав]{.ru}'
    cells:
    - '[Вы прав]{.ru}'
    - '[Вы пра́вы]{.ru}'
    hint: 称呼一人
  - base: '[дово́лен рабо́ту]{.ru}'
    cells:
    - '[дово́лен рабо́ту]{.ru}'
    - '[дово́лен рабо́той]{.ru}'
  - base: '[похо́ж на па́па]{.ru}'
    cells:
    - '[похо́ж на па́па]{.ru}'
    - '[похо́ж на па́пу]{.ru}'
  - base: '[са́мый лу́чше]{.ru}'
    cells:
    - '[са́мый лу́чше]{.ru}'
    - '[са́мый лу́чший]{.ru}'
  - base: '[ста́рше него́]{.ru}'
    cells:
    - '[ста́рше него́]{.ru}'
    - '[ста́рше его́]{.ru}'
  - base: '[говори́т по-ру́сский]{.ru}'
    cells:
    - '[говори́т по-ру́сский]{.ru}'
    - '[говори́т по-ру́сски]{.ru}'
  - base: '[чита́ть бы́стрый]{.ru}'
    cells:
    - '[чита́ть бы́стрый]{.ru}'
    - '[чита́ть бы́стро]{.ru}'
  - base: '[доро́гее]{.ru}'
    cells:
    - '[доро́гее]{.ru}'
    - '[доро́же]{.ru}'
  - base: '[дово́льный на́ми]{.ru}'
    cells:
    - '[дово́льный на́ми]{.ru}'
    - '[дово́лен на́ми]{.ru}'
  - base: '[Говори́, пожа́луйста, поме́дленно!]{.ru}'
    cells:
    - '[Говори́, пожа́луйста, поме́дленно!]{.ru}'
    - '[Говори́, пожа́луйста, поме́дленнее!]{.ru}'
  - base: '[гото́в к экза́мену]{.ru}'
    cells:
    - '[гото́в к экза́мену]{.ru}'
    - '[гото́в к экза́мену]{.ru}'
  - base: '[глу́бже всех озёр]{.ru}'
    cells:
    - '[глу́бже всех озёр]{.ru}'
    - '[глу́бже всех озёр]{.ru}'
  why: |-
    第 1 题：[о́чень]{.ru} 不修饰比较级：[гора́здо лу́чше]{.ru}（或 [намно́го лу́чше]{.ru}）。
    第 2、3 题：[-ейший]{.ru} 一般加在词干上：[краси́вейший]{.ru}；[г, к, х]{.ru} 结尾的交替后用 [-а́йший]{.ru}：[высоча́йший]{.ru}。
    第 4、13 题：短尾只作谓语，修饰名词用长尾：[гото́вая ку́ртка]{.ru}；带补语作谓语用短尾：[дово́лен на́ми]{.ru}。
    第 5 题：[вы]{.ru} 指一人，短尾也用复数：[Вы пра́вы]{.ru}。
    第 6、7 题：补语的格：[дово́лен]{.ru} + 第五格，[похо́ж на]{.ru} + 第四格。
    第 8 题：[са́мый]{.ru} 修饰形容词，不修饰比较级：[са́мый лу́чший]{.ru}（或 [лу́чший]{.ru}）。
    第 9 题：比较级后代词用第二格，不加 [н-]{.ru}。
    第 10、11 题：说明动词用副词：[по-ру́сски, бы́стро]{.ru}。
    第 12 题：[дорого́й → доро́же]{.ru}，交替 + [-е]{.ru}。
    第 14 题：请求“稍微慢一点”用 [по-]{.ru} + 比较级：[поме́дленнее]{.ru}。
    第 15、16 题：正确。
