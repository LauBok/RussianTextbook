  why: |-
    第 1–5 题：短尾去长尾词尾，[споко́ен, интере́сен, серьёзен]{.ru} 插入 [е]{.ru}；比较级 [-ее]{.ru} 保留原级重音：[краси́вее, споко́йнее, серьёзнее]{.ru}；副词 [-о]{.ru}。
    第 6、7、9、10、12 题：短尾阴性重音在词尾：[быстра́, чиста́, тиха́, близка́, плоха́]{.ru}；[бли́зок]{.ru} 插入 [о]{.ru}。
    第 6 题：比较级重音在 [-е́е]{.ru}：[быстре́е]{.ru}。
    第 7–10 题：比较级交替 + [-е]{.ru}：[чи́ще, про́ще, ти́ше, бли́же]{.ru}。
    第 11、12 题：比较级特殊 [лу́чше, ху́же]{.ru}；副词重音不同：[хорошо́, пло́хо]{.ru}；短尾 [хоро́ш, хороша́]{.ru}。
