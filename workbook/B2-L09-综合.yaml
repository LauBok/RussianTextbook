  why: |-
    第 1、2、4、6 题：阴性度量词：3 后 [-и]{.ru}，6 后零词尾加隐现元音：[шесть буты́лок, па́чек, коро́бок, ба́нок]{.ru}；后面的名词不变。
    第 3、5、7、9 题：阳性度量词：[три ли́тра, шесть ли́тров]{.ru}；后面的名词始终是第二格，可数的用复数：[мандари́нов, цвето́в]{.ru}。
    第 8、10 题：[кусо́к, деся́ток]{.ru} 的 [о / е]{.ru} 脱落：[три куска́, шесть куско́в; три деся́тка, шесть деся́тков]{.ru}；[я́йца → яи́ц]{.ru}。
- id: B2-L09-综合-d
  lessons:
  - B2-L01
  - B2-L02
  - B2-L03
  - B2-L04
  - B2-L07
  - B2-L08
  tags:
  - 综合：数量表达句中
  recycles:
  - B2-L04-04
  - B2-L07-04
  - B2-L08-03
  task: 用括号里的词填空，数词用文字写出。
  type: fill
  items:
  - stem: В на́шей гру́ппе ___.
    hint: 12, студе́нтка
    accept:
    - двена́дцать студе́нток
  - stem: Мы бы́ли в Петербу́рге ___.
    hint: 3, день
    accept:
    - три дня
  - stem: Ма́ма купи́ла ___ молока́.
    hint: 2, паке́т
    accept:
    - два паке́та
  - stem: Нас бы́ло ___.
    hint: '5'
    accept:
    - пя́теро
  - stem: Ско́лько у тебя́ ___?
    hint: сестра́
    accept:
    - сестёр
  - stem: Ба́бушке ___.
    hint: 71, год
    accept:
    - се́мьдесят оди́н год
  - stem: Я купи́л ___ ча́я.
    hint: 4, па́чка
    accept:
    - четы́ре па́чки
  - stem: У Ива́на Серге́евича ___ дете́й.
    hint: '2'
    accept:
    - дво́е
  - stem: В холоди́льнике ма́ло ___.
    hint: мя́со
    accept:
    - мя́са
  - stem: Он написа́л ___.
    hint: 22, письмо́
    accept:
    - два́дцать два письма́
  - stem: Да́йте, пожа́луйста, ___ я́блок.
    hint: 1, килогра́мм
    accept:
    - оди́н килогра́мм
  - stem: На столе́ стоя́ло ___ воды́.
    hint: 6, буты́лка
    accept:
    - шесть буты́лок
  why: |-
    第 1、2、6、10 题：数词后名词的形式只看最后一个词：[двена́дцать студе́нток, три дня, се́мьдесят оди́н год, два́дцать два письма́]{.ru}。
    第 3、7、11、12 题：度量词跟着数词变，后面的名词不变：[два паке́та, четы́ре па́чки, шесть буты́лок]{.ru}；1 后单数第一格 [оди́н килогра́мм]{.ru}。
    第 4、8 题：说一群人或孩子用集合数词：[нас бы́ло пя́теро, дво́е дете́й]{.ru}。
    第 5 题：[ско́лько]{.ru} 后可数名词用复数第二格：[сестёр]{.ru}。
    第 9 题：[ма́ло]{.ru} 后不可数名词用单数第二格：[мя́са]{.ru}。
