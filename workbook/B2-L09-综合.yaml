    - '[три ли́тра молока́]{.ru}'
    - '[шесть ли́тров молока́]{.ru}'
  - base: '[ба́нка + мёд]{.ru}'
    cells:
    - '[ба́нка + мёд]{.ru}'
    - '[три ба́нки мёда]{.ru}'
    - '[шесть ба́нок мёда]{.ru}'
  - base: '[паке́т + сок]{.ru}'
    cells:
    - '[паке́т + сок]{.ru}'
    - '[три паке́та со́ка]{.ru}'
    - '[шесть паке́тов со́ка]{.ru}'
  - base: '[кусо́к + торт]{.ru}'
    cells:
    - '[кусо́к + торт]{.ru}'
    - '[три куска́ то́рта]{.ru}'
    - '[шесть куско́в то́рта]{.ru}'
  - base: '[буке́т + цветы́]{.ru}'
    cells:
    - '[буке́т + цветы́]{.ru}'
    - '[три буке́та цвето́в]{.ru}'
