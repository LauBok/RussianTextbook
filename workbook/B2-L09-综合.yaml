  task: 每个词组都有错，写出改正后的词组。
  type: matrix
  cols:
  - 有错的词组
  - 改正
  given:
  - 0
  rows:
  - base: '[пять студе́нта]{.ru}'
    cells:
    - '[пять студе́нта]{.ru}'
    - '[пять студе́нтов]{.ru}'
  - base: '[мно́го де́ньги]{.ru}'
    cells:
    - '[мно́го де́ньги]{.ru}'
    - '[мно́го де́нег]{.ru}'
