  why: |-
    第 1、5、7、8、10、11、13、15 题：可数名词：2 后单数第二格，阴性用 [две]{.ru}；5、[мно́го, не́сколько]{.ru} 后复数第二格：[две ле́кции — пять ле́кций, два врача́ — пять враче́й]{.ru}。
    第 2 题：[сестра́]{.ru} 复数第二格要记：[сестёр]{.ru}。
    第 3、6、9、12、14 题：不可数名词不和数词连用，[мно́го]{.ru} 后用单数第二格，“一点儿”用 [немно́го]{.ru}：[немно́го мя́са, немно́го вре́мени]{.ru}。
    第 4 题：[год]{.ru} 的复数第二格是 [лет]{.ru}：[пять лет, мно́го лет, не́сколько лет]{.ru}。
