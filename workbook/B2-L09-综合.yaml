    cells:
    - '[тро́е де́вушек]{.ru}'
    - '[три де́вушки]{.ru}'
  - base: '[две коро́бки конфе́ты]{.ru}'
    cells:
    - '[две коро́бки конфе́ты]{.ru}'
    - '[две коро́бки конфе́т]{.ru}'
  - base: '[два́дцать оди́н го́да]{.ru}'
    cells:
    - '[два́дцать оди́н го́да]{.ru}'
    - '[два́дцать оди́н год]{.ru}'
  - base: '[не́сколько мя́са]{.ru}'
    cells:
    - '[не́сколько мя́са]{.ru}'
    - '[немно́го]{.ru}'
  - base: '[о́ба сестры́]{.ru}'
    cells:
    - '[о́ба сестры́]{.ru}'
    - '[о́бе сестры́]{.ru}'
  - base: '[две сочине́ния]{.ru}'
    cells:
    - '[две сочине́ния]{.ru}'
    - '[два сочине́ния]{.ru}'
  - base: '[оди́ннадцать студе́нта]{.ru}'
    cells:
    - '[оди́ннадцать студе́нта]{.ru}'
    - '[оди́ннадцать студе́нтов]{.ru}'
  - base: '[килогра́мм я́блоки]{.ru}'
    cells:
    - '[килогра́мм я́блоки]{.ru}'
    - '[килогра́мм я́блок]{.ru}'
  - base: '[купи́ть буты́лка воды́]{.ru}'
    cells:
    - '[купи́ть буты́лка воды́]{.ru}'
    - '[купи́ть буты́лку воды́]{.ru}'
  - base: '[нас бы́ли тро́е]{.ru}'
    cells:
    - '[нас бы́ли тро́е]{.ru}'
    - '[нас бы́ло тро́е]{.ru}'
  - base: '[пять ра́зов]{.ru}'
    cells:
    - '[пять ра́зов]{.ru}'
    - '[пять раз]{.ru}'
  - base: '[дво́е сестёр]{.ru}'
    cells:
    - '[дво́е сестёр]{.ru}'
    - '[две сестры́]{.ru}'
  - base: '[о́бе бра́та]{.ru}'
    cells:
    - '[о́бе бра́та]{.ru}'
    - '[о́ба бра́та]{.ru}'
  - base: '[три па́чек ча́я]{.ru}'
    cells:
    - '[три па́чек ча́я]{.ru}'
    - '[три па́чки ча́я]{.ru}'
  - base: '[мно́го молоко́в]{.ru}'
    cells:
    - '[мно́го молоко́в]{.ru}'
    - '[мно́го молока́]{.ru}'
  - base: '[два́дцать две студе́нта]{.ru}'
    cells:
    - '[два́дцать две студе́нта]{.ru}'
    - '[два́дцать два студе́нта]{.ru}'
  why: |-
    第 1 题：5 以上用复数第二格：[пять студе́нтов]{.ru}。
    第 2 题：[мно́го]{.ru} 后用第二格：[де́нег]{.ru}。
    第 3、14 题：集合数词不和表示女人的名词连用：[три де́вушки, две сестры́]{.ru}。
    第 4、10 题：度量词后的名词始终用第二格，可数的用复数：[коро́бки конфе́т, килогра́мм я́блок]{.ru}。
    第 5 题：只看最后一个词 [оди́н]{.ru}：[два́дцать оди́н год]{.ru}。
    第 6、17 题：不可数名词不用 [не́сколько]{.ru}，用 [немно́го]{.ru}；不可数名词用单数第二格：[мно́го молока́]{.ru}。
    第 7、15 题：[о́ба]{.ru} 用于阳性、中性，[о́бе]{.ru} 用于阴性：[о́бе сестры́, о́ба бра́та]{.ru}。
    第 8、18 题：[сочине́ние]{.ru} 是中性，[студе́нт]{.ru} 是阳性，“二”用 [два]{.ru}。
    第 9 题：11–19 后一律复数第二格：[оди́ннадцать студе́нтов]{.ru}。
    第 11、16 题：度量词本身要变格：[купи́ть буты́лку]{.ru}（第四格），[три па́чки]{.ru}（单数第二格）。
    第 12 题：数量词组作主语，动词用中性：[нас бы́ло тро́е]{.ru}。
    第 13 题：[раз]{.ru} 在数词后的复数第二格是 [раз]{.ru}。
