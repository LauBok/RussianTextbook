  why: '[свой]{.ru} 和 [мой]{.ru} 变法完全一样。

    第 1–8 题：阳性、中性第二格 [своего́]{.ru}，第三格 [своему́]{.ru}，第五格 [свои́м]{.ru}，第六格 [своём]{.ru}。第四格要看名词：阳性动物名词 [брат, оте́ц, учи́тель, сын]{.ru}（第 1、2、4、5 题）同第二格 [своего́]{.ru}；非动物 [телефо́н]{.ru}（第 3 题）同第一格 [свой]{.ru}；中性（第 6–8 题）同第一格 [своё]{.ru}。

    第 9–14 题：阴性除第一格 [своя́]{.ru}、第四格 [свою́]{.ru} 外，其余四格都是 [свое́й]{.ru}。第 12、13 题 [тетра́дь, дочь]{.ru} 以 [-ь]{.ru} 结尾，是阴性，修饰语照样用阴性；[дочь, подру́га]{.ru} 虽是动物名词，阴性第四格仍是 [свою́]{.ru}。

    [своего́]{.ru} 里的 [г]{.ru} 读 [[в]]{.tr}。'
- id: L87-02
  tags:
  - свой 与 его́ / её：所有者关系标注
  task: 王磊和米沙在一个房间里。看 [свой]{.ru} 和 [его́]{.ru}，判断东西是谁的。
  type: classify
  bins:
  - 王磊的
  - 米沙的
  items:
  - text: Ван Лэй взял свой слова́рь.
    answer: 王磊的
  - text: Ван Лэй взял его́ слова́рь.
    answer: 米沙的
  - text: Ми́ша чита́ет своё письмо́.
    answer: 米沙的
  - text: Ми́ша чита́ет его́ письмо́.
    answer: 王磊的
  - text: Ван Лэй расска́зывает Ми́ше о свое́й семье́.
    answer: 王磊的
  - text: Ван Лэй расска́зывает Ми́ше о его́ шко́ле.
    answer: 米沙的
  - text: Ми́ша и́щет свой телефо́н.
    answer: 米沙的
  - text: Ми́ша и́щет его́ телефо́н.
    answer: 王磊的
  - text: Ван Лэй сиди́т за свои́м столо́м.
    answer: 王磊的
  - text: Ми́ша сиди́т за его́ столо́м.
    answer: 王磊的
  - text: Ми́ша звони́т своему́ дру́гу.
    answer: 米沙的
  - text: Ван Лэй пи́шет письмо́ свое́й ма́ме.
    answer: 王磊的
  - text: Ми́ша говори́т с его́ ма́мой.
    answer: 王磊的
  - text: Ван Лэй даёт Ми́ше свою́ тетра́дь.
    answer: 王磊的
  - text: Ван Лэй даёт Ми́ше его́ тетра́дь.
    answer: 米沙的
  - text: Ми́ша пока́зывает Ван Лэ́ю свою́ ко́мнату.
    answer: 米沙的
  - text: Ван Лэй взял его́ ру́чку.
    answer: 米沙的
  - text: Ми́ша взял свою́ ру́чку.
    answer: 米沙的
  - text: Ми́ша рассказа́л Ван Лэ́ю о его́ па́пе.
    answer: 王磊的
  - text: Ван Лэй сиди́т на его́ сту́ле.
    answer: 米沙的
  why: '[свой]{.ru} 永远指句子的主语：第 1、5、9、12、14 题主语是王磊，东西是王磊的；第 3、7、11、16、18 题主语是米沙，东西是米沙的。

    [его́]{.ru} 指主语以外的另一个人：第 2、6、15、17、20 题主语是王磊，[его́]{.ru} 指米沙；第 4、8、10、13、19 题主语是米沙，[его́]{.ru} 指王磊。

    第 6、15、19 题：句中的另一个人虽然出现了（[Ми́ше, Ван Лэ́ю]{.ru}），但不是主语，所以属于他的东西只能说 [его́]{.ru}，不能说 [свой]{.ru}。汉语“他的”两种意思都能表示，俄语必须分开。'
- id: L87-03
  tags:
  - свой：用法与形式核查
  task: 核查 [свой]{.ru} 的用法和形式，把句子归类。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: А́нна взяла́ свою́ тетра́дь.
    answer: 正确
  - text: Своя́ ма́ма отве́тила бы́стро.
    answer: 有错
  - text: Ми́ша говори́т о своём па́пе.
    answer: 正确
  - text: Ми́ша и́щет своего́ телефо́н.
    answer: 有错
  - text: Ван Лэй написа́л письмо́ свое́й ма́ме.
    answer: 正确
  - text: Я написа́л письмо́ свое́й ма́ме.
    answer: 正确
  - text: Ван Лэй забо́тится о своём здоро́вье.
    answer: 正确
  - text: А́нна живёт в своём ко́мнате.
    answer: 有错
  - text: Свой брат живёт в Пеки́не.
    answer: 有错
  - text: Пьер пока́зывает нам свою́ ко́мнату.
    answer: 正确
  - text: Ю́ми звони́т своему́ ма́ме.
    answer: 有错
  - text: У тебя́ есть свой телефо́н!
    answer: 正确
  - text: Мари́я Никола́евна расска́зывает о свое́й рабо́те.
    answer: 正确
  - text: Ми́ша сиди́т за свое́м столо́м.
    answer: 有错
  - text: Петро́вы лю́бят свою́ да́чу.
    answer: 正确
  - text: Ван Лэй ви́дел свой дру́га.
    answer: 有错
  - text: Ба́бушка ча́сто звони́т своему́ сы́ну.
    answer: 正确
  - text: Пьер ду́мает о своём бра́те.
    answer: 正确
  - text: Ю́ми говори́т о своём сестре́.
    answer: 有错
  - text: Свои́ роди́тели живу́т в Пеки́не.
    answer: 有错
  why: '第 1、3、5、6、7、10、13、15、17、18 题：[свой]{.ru} 指主语，性数格与名词一致，正确。第 6 题第一人称用 [свой]{.ru} 或 [мой]{.ru} 都可以。第 12 题 [у кого́ есть]{.ru} 句中 [свой]{.ru} 指 [у]{.ru} 后的人，可以用第一格。

    第 2、9、20 题：[свой]{.ru} 不能放在主语里，应说 [Его́ / Её ма́ма отве́тила бы́стро.]{.ru}、[Мой / Его́ брат живёт в Пеки́не.]{.ru}、[Мои́ / Его́ роди́тели…]{.ru}

    第 4 题：[телефо́н]{.ru} 是非动物名词，第四格同第一格：[свой телефо́н]{.ru}。第 16 题相反，[друг]{.ru} 是动物名词，第四格用 [своего́ дру́га]{.ru}。

    第 8、11、14、19 题：形式和名词不配合：[ко́мната]{.ru} 阴性，应为 [в свое́й ко́мнате]{.ru}；[сестра́]{.ru} 阴性，应为 [о свое́й сестре́]{.ru}；[ма́ма]{.ru} 第三格 [свое́й ма́ме]{.ru}；[стол]{.ru} 阳性第五格 [за свои́м столо́м]{.ru}。'
