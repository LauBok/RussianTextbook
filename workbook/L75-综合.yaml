- id: L75-综合-c
  lessons:
  - L71
  - L72
  - L73
  tags:
  - 综合：运动动词的意义
  recycles:
  - L71-02
  - L72-02
  - L73-02
  task: 句中的运动动词表示什么？按意思归类。
  type: classify
  bins:
  - 此刻正在去（[идёт]{.ru}）
  - 经常去（[хо́дит]{.ru}）
  - 去了一趟（[ходи́л]{.ru}）
  - 已经动身去了（[пошёл]{.ru}）
  - 将来去一次（[пойдёт]{.ru}）
  items:
  - text: '[Смотри́, Ми́ша идёт в шко́лу.]{.ru}'
    answer: 此刻正在去（[идёт]{.ru}）
  - text: '[Па́па ка́ждый день е́здит на заво́д.]{.ru}'
    answer: 经常去（[хо́дит]{.ru}）
  - text: '[В суббо́ту мы е́здили на да́чу.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Ма́мы нет до́ма, она́ пое́хала на рабо́ту.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[За́втра мы пойдём в кинотеа́тр.]{.ru}'
    answer: 将来去一次（[пойдёт]{.ru}）
  - text: '[Куда́ ты сейча́с е́дешь?]{.ru}'
    answer: 此刻正在去（[идёт]{.ru}）
  - text: '[Ба́бушка ча́сто хо́дит в парк.]{.ru}'
    answer: 经常去（[хо́дит]{.ru}）
  - text: '[Вчера́ А́нна ходи́ла к врачу́.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Ван Лэй уже́ пошёл на уро́к.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[Ле́том Ю́ми пое́дет в Япо́нию.]{.ru}'
    answer: 将来去一次（[пойдёт]{.ru}）
  - text: '[Мы идём с конце́рта домо́й.]{.ru}'
    answer: 此刻正在去（[идёт]{.ru}）
  - text: '[Студе́нты обы́чно е́здят на экску́рсии на авто́бусе.]{.ru}'
    answer: 经常去（[хо́дит]{.ru}）
  - text: '[В про́шлом году́ Пьер е́здил на Ура́л.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Где Ка́тя? — Она́ пошла́ к сосе́ду.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[Ве́чером я пое́ду к ба́бушке.]{.ru}'
    answer: 将来去一次（[пойдёт]{.ru}）
  - text: '[Вот идёт авто́бус.]{.ru}'
    answer: 此刻正在去（[идёт]{.ru}）
  - text: '[Ты ча́сто е́здишь в центр?]{.ru}'
    answer: 经常去（[хо́дит]{.ru}）
  - text: '[— Где вы бы́ли? — Мы ходи́ли на пло́щадь.]{.ru}'
    answer: 去了一趟（[ходи́л]{.ru}）
  - text: '[Па́пы нет, он пое́хал в Екатеринбу́рг.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[В пя́тницу Ми́ша пойдёт на стадио́н.]{.ru}'
    answer: 将来去一次（[пойдёт]{.ru}）
  why: |
    第 1、6、11、16 题：定向动词现在时，此刻正在朝一个方向去；车辆行驶也用 [идти́]{.ru}。
    第 2、7、12、17 题：不定向动词现在时，表示经常去。
    第 3、8、13、18 题：不定向动词过去时，去了一趟又回来。
    第 4、9、14、19 题：[пошёл, пое́хал]{.ru}，人已经动身去了，现在还不在这里。
    第 5、10、15、20 题：[пойду́, пое́ду]{.ru} 等将来时形式，将来去一次。
- id: L75-综合-d
  lessons: *id001
  tags:
  - 综合：运动动词的意义
  - 运动动词命令式
  recycles:
  - L71-03
  - L72-03
  - L72-04
  - L73-03
  - L75-04
  task: 根据句意选用括号里的一个形式填空。
  type: fill
  items:
  - stem: — Где ты был вчера́? — Я ___ в Эрмита́ж.
    hint: шёл / ходи́л / пошёл
    accept:
    - ходи́л
  - stem: — Где па́па? — Он ___ на рабо́ту.
    hint: е́хал / е́здил / пое́хал
    accept:
    - пое́хал
  - stem: Когда́ я ___ из университе́та, я уви́дел Ка́тю.
    hint: шёл / ходи́л / пошёл
    accept:
    - шёл
  - stem: За́втра мы ___ на да́чу на электри́чке.
    hint: е́здим / пое́дем / бу́дем е́здить
    accept:
    - пое́дем
  - stem: Ле́том я ___ в бассе́йн ка́ждый день.
    hint: пойду́ / бу́ду ходи́ть / иду́
    accept:
    - бу́ду ходи́ть
  - stem: Сейча́с Ми́ша ___ домо́й из шко́лы.
    hint: идёт / хо́дит / ходи́л
    accept:
    - идёт
  - stem: Ты ча́сто ___ к ба́бушке?
    hint: е́дешь / е́здишь / пое́дешь
    accept:
    - е́здишь
  - stem: Не ___ туда́, там ремо́нт!
    hint: иди́те / ходи́те / пойди́те
    accept:
    - ходи́те
  - stem: До вокза́ла далеко́, ___ на метро́.
    hint: иди́те / поезжа́йте / е́здите
    accept:
    - поезжа́йте
  - stem: ___ в кафе́! Я угоща́ю.
    hint: Идём / Пойдём / Хо́дим
    accept:
    - Пойдём
  - stem: В про́шлом году́ Петро́вы ___ на мо́ре.
    hint: е́хали / е́здили / пое́дут
    accept:
    - е́здили
  - stem: Вот ___ наш трамва́й!
    hint: идёт / е́дет / хо́дит
    accept:
    - идёт
  - stem: — Где А́нна? — Она́ ___ к Ка́те, ско́ро бу́дет до́ма.
    hint: ходи́ла / пошла́ / идёт
    accept:
    - пошла́
  - stem: Мы ___ по Петербу́ргу це́лый день.
    hint: шли / ходи́ли / пошли́
    accept:
    - ходи́ли
  why: |
    第 1、11 题：问“去哪儿了”、说去了一趟，用 [ходи́л, е́здили]{.ru}。
    第 2、13 题：人已经动身去了，现在不在：[пое́хал, пошла́]{.ru}。
    第 3 题：[когда́]{.ru} 引出路上的背景，用 [шёл]{.ru}。
    第 4 题：将来一次出行，用 [пое́дем]{.ru}。第 5 题：将来经常去，用 [бу́ду ходи́ть]{.ru}。
    第 6 题：[сейча́с]{.ru}，此刻朝一个方向，用 [идёт]{.ru}。第 7 题：[ча́сто]{.ru}，用 [е́здишь]{.ru}。
    第 8 题：否定命令式用不定向动词 [Не ходи́те]{.ru}。第 9 题：乘车去的命令式是 [поезжа́йте]{.ru}。
    第 10 题：邀请一起去用 [Пойдём!]{.ru}
    第 12 题：车辆行驶用 [идёт]{.ru}，不用 [е́дет]{.ru}。
    第 14 题：[ходи́ть по]{.ru} 到处走，用不定向动词。
- id: L75-综合-e
  lessons:
  - L74
  tags:
  - где / куда / откуда：副词三组对应
  recycles:
  - L74-03
  task: 按中文提示填上表示处所的副词。
  type: fill
  items:
  - stem: Я живу́ ___.
    hint: 这里
    accept:
    - здесь
  - stem: Ми́ша, иди́ ___!
    hint: 到这里
    accept:
    - сюда́
  - stem: Мы е́дем ___ в центр.
    hint: 从这里
    accept:
    - отсю́да
  - stem: Там краси́вые го́ры. Мы е́дем ___.
    hint: 到那里
    accept:
    - туда́
  - stem: Ка́тя сейча́с в магази́не, она́ ско́ро пойдёт ___ домо́й.
    hint: 从那里
    accept:
    - отту́да
  - stem: Ве́чером па́па ___.
    hint: 在家
    accept:
    - до́ма
  - stem: Уже́ по́здно, иди́ ___.
    hint: 回家
    accept:
    - домо́й
  - stem: У́тром я е́ду ___ на рабо́ту.
    hint: 从家里
    accept:
    - из до́ма
  - stem: Что ты де́лаешь ___?
    hint: 在那里
    accept:
    - там
  - stem: Не ходи́ ___!
    hint: 到那里
    accept:
    - туда́
  - stem: ___ до метро́ пять мину́т.
    hint: 从这里
    accept:
    - Отсю́да
  - stem: Мы бы́ли в Эрмита́же, а ___ пошли́ на Не́вский проспе́кт.
    hint: 从那里
    accept:
    - отту́да
  - stem: Ба́бушка сейча́с ___.
    hint: 在家
    accept:
    - до́ма
  - stem: Иди́те ___, здесь свобо́дно.
    hint: 到这里
    accept:
    - сюда́
  why: |-
    第 1、9 题：[где?]{.ru}：[здесь, там]{.ru}。第 6、13 题：在家 [до́ма]{.ru}。
    第 2、4、10、14 题：[куда́?]{.ru}：[сюда́, туда́]{.ru}，和运动动词连用。第 7 题：回家 [домо́й]{.ru}。
    第 3、5、11、12 题：[отку́да?]{.ru}：[отсю́да, отту́да]{.ru}。第 8 题：从家里 [из до́ма]{.ru}。
    不要把 [здесь]{.ru} 用在运动动词后面：“到这儿来”是 [иди́ сюда́]{.ru}。
