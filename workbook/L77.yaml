heading: 第 77 课　客气的愿望与点餐
groups:
- id: L77-01
  tags:
  - хотел бы：性数配合
  task: 按主语写出 [хоте́ть]{.ru} 的现在时和客气的说法。
  type: matrix
  cols:
  - 主语
  - '[хоте́ть]{.ru} 现在时'
  - 客气说法（[бы]{.ru}）
  given:
  - 0
  rows:
  - base: '[я]{.ru}（[Ван Лэй]{.ru}）'
    cells:
    - '[я]{.ru}（[Ван Лэй]{.ru}）'
    - '[хочу́]{.ru}'
    - '[хоте́л бы]{.ru}'
  - base: '[я]{.ru}（[А́нна]{.ru}）'
    cells:
    - '[я]{.ru}（[А́нна]{.ru}）'
    - '[хочу́]{.ru}'
    - '[хоте́ла бы]{.ru}'
  - base: '[ты]{.ru}（[Ми́ша]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ми́ша]{.ru}）'
    - '[хо́чешь]{.ru}'
    - '[хоте́л бы]{.ru}'
  - base: '[ты]{.ru}（[Ю́ми]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ю́ми]{.ru}）'
    - '[хо́чешь]{.ru}'
    - '[хоте́ла бы]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[хо́чет]{.ru}'
    - '[хоте́л бы]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[хо́чет]{.ru}'
    - '[хоте́ла бы]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[хоти́м]{.ru}'
    - '[хоте́ли бы]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[хоти́те]{.ru}'
    - '[хоте́ли бы]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[хотя́т]{.ru}'
    - '[хоте́ли бы]{.ru}'
  - base: '[ма́ма и па́па]{.ru}'
    cells:
    - '[ма́ма и па́па]{.ru}'
    - '[хотя́т]{.ru}'
    - '[хоте́ли бы]{.ru}'
  why: |
    第 1–10 题：[хоте́ть]{.ru} 现在时单数按第一变位、复数按第二变位：[хочу́, хо́чешь, хо́чет; хоти́м, хоти́те, хотя́т]{.ru}，要单独记。
    第 1–10 题：客气说法用过去时加 [бы]{.ru}，[хоте́л]{.ru} 跟主语的性和数一致：男性 [хоте́л бы]{.ru}，女性 [хоте́ла бы]{.ru}，复数和 [вы]{.ru} 用 [хоте́ли бы]{.ru}。形式是过去时，说的是现在的愿望。
    第 1–4 题：[я, ты]{.ru} 看实际性别。
- id: L77-02
  tags:
  - 体对：заказывать / заказать
  - 体对：点餐动词
  task: 写出动词的六个人称形式（未完成体为现在时，完成体为将来时）。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[он / она́]{.ru}'
  - '[мы]{.ru}'
  - '[вы]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[зака́зывать]{.ru}'
    cells:
    - '[зака́зывать]{.ru}'
    - '[зака́зываю]{.ru}'
    - '[зака́зываешь]{.ru}'
    - '[зака́зывает]{.ru}'
    - '[зака́зываем]{.ru}'
    - '[зака́зываете]{.ru}'
    - '[зака́зывают]{.ru}'
  - base: '[заказа́ть]{.ru}'
    cells:
    - '[заказа́ть]{.ru}'
    - '[закажу́]{.ru}'
    - '[зака́жешь]{.ru}'
    - '[зака́жет]{.ru}'
    - '[зака́жем]{.ru}'
    - '[зака́жете]{.ru}'
    - '[зака́жут]{.ru}'
    hint: I；[закажу́, зака́жешь]{.ru}
  - base: '[выбира́ть]{.ru}'
    cells:
    - '[выбира́ть]{.ru}'
    - '[выбира́ю]{.ru}'
    - '[выбира́ешь]{.ru}'
    - '[выбира́ет]{.ru}'
    - '[выбира́ем]{.ru}'
    - '[выбира́ете]{.ru}'
    - '[выбира́ют]{.ru}'
  - base: '[вы́брать]{.ru}'
    cells:
    - '[вы́брать]{.ru}'
    - '[вы́беру]{.ru}'
    - '[вы́берешь]{.ru}'
    - '[вы́берет]{.ru}'
    - '[вы́берем]{.ru}'
    - '[вы́берете]{.ru}'
    - '[вы́берут]{.ru}'
    hint: I；[вы́беру, вы́берешь]{.ru}
  - base: '[брать]{.ru}'
    cells:
    - '[брать]{.ru}'
    - '[беру́]{.ru}'
    - '[берёшь]{.ru}'
    - '[берёт]{.ru}'
    - '[берём]{.ru}'
    - '[берёте]{.ru}'
    - '[беру́т]{.ru}'
  - base: '[взять]{.ru}'
    cells:
    - '[взять]{.ru}'
    - '[возьму́]{.ru}'
    - '[возьмёшь]{.ru}'
    - '[возьмёт]{.ru}'
    - '[возьмём]{.ru}'
    - '[возьмёте]{.ru}'
    - '[возьму́т]{.ru}'
  why: |
    第 1、3 题：[зака́зывать, выбира́ть]{.ru} 按 [-ать]{.ru} 规则变，重音不动：[зака́зываю, выбира́ю]{.ru}。注意 [зака́зывать]{.ru} 重音在 [-ка́-]{.ru}。
    第 2 题：[заказа́ть]{.ru} 全部人称 [з → ж]{.ru}，从第二人称起重音前移：[закажу́, зака́жешь … зака́жут]{.ru}。
    第 4 题：完成体 [вы́брать]{.ru} 重音永远在前缀 [вы́-]{.ru} 上：[вы́беру, вы́берешь]{.ru}。
    第 5 题：[брать]{.ru}：[беру́, берёшь]{.ru}，词尾重读写 [ё]{.ru}。
    第 6 题：[взять]{.ru}：[возьму́, возьмёшь]{.ru}，表示将来。
- id: L77-03
