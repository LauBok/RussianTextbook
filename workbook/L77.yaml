    - '[пельме́ни]{.ru}'
    - '[пельме́ни]{.ru}'
  - base: '[моро́женое]{.ru}'
    cells:
    - '[моро́женое]{.ru}'
    - '[моро́женое]{.ru}'
  - base: '[блины́]{.ru}'
    cells:
    - '[блины́]{.ru}'
    - '[блины́]{.ru}'
  - base: '[кра́сное вино́]{.ru}'
    cells:
    - '[кра́сное вино́]{.ru}'
    - '[кра́сное вино́]{.ru}'
  - base: '[холо́дная вода́]{.ru}'
    cells:
    - '[холо́дная вода́]{.ru}'
    - '[холо́дную во́ду]{.ru}'
  - base: '[чёрный ко́фе]{.ru}'
    cells:
    - '[чёрный ко́фе]{.ru}'
    - '[чёрный ко́фе]{.ru}'
  - base: '[вишнёвый морс]{.ru}'
    cells:
    - '[вишнёвый морс]{.ru}'
    - '[вишнёвый морс]{.ru}'
  - base: '[горя́чий чай]{.ru}'
    cells:
    - '[горя́чий чай]{.ru}'
    - '[горя́чий чай]{.ru}'
  - base: '[ру́сская ка́ша]{.ru}'
    cells:
    - '[ру́сская ка́ша]{.ru}'
    - '[ру́сскую ка́шу]{.ru}'
  why: |
    第 2–4、6 题：阴性 [-а]{.ru} 改 [-у]{.ru}：[ры́бу, ку́рицу, ка́шу, смета́ну]{.ru}。
    第 1、5、12–14 题：阳性非动物名词第四格同第一格，形容词也不变：[борщ, чёрный ко́фе, вишнёвый морс]{.ru}。[ко́фе]{.ru} 是阳性，不变格。
    第 7、9 题：非动物名词复数第四格同第一格：[пельме́ни, блины́]{.ru}。
    第 8、10 题：中性第四格同第一格：[моро́женое]{.ru} 按形容词变，第四格仍是 [моро́женое]{.ru}。
    第 11 题：[вода́]{.ru} 第四格重音移到词干：[во́ду]{.ru}；形容词 [холо́дную]{.ru}。
    第 15 题：形容词 [-ая → -ую]{.ru}：[ру́сскую ка́шу]{.ru}。
- id: L77-04
  tags:
  - 体对：заказывать / заказать 的意义
  task: 句中的动词表示什么？按意思归类。
  type: classify
  bins:
  - 经常、习惯（[зака́зывал]{.ru}）
  - 正在进行（[зака́зываем]{.ru}）
  - 一次的结果（[заказа́л]{.ru}）
  - 将来一次（[закажу́]{.ru}）
  items:
  - text: '[В Пеки́не я ча́сто зака́зывал борщ.]{.ru}'
    answer: 经常、习惯（[зака́зывал]{.ru}）
  - text: '[Ми́ша заказа́л торт.]{.ru}'
    answer: 一次的结果（[заказа́л]{.ru}）
  - text: '[Мы сейча́с зака́зываем.]{.ru}'
    answer: 正在进行（[зака́зываем]{.ru}）
  - text: '[Я закажу́ пельме́ни.]{.ru}'
    answer: 将来一次（[закажу́]{.ru}）
  - text: '[Па́па всегда́ зака́зывает ры́бу.]{.ru}'
    answer: 经常、习惯（[зака́зывал]{.ru}）
  - text: '[А́нна уже́ заказа́ла сала́т.]{.ru}'
    answer: 一次的结果（[заказа́л]{.ru}）
  - text: '[Я ещё выбира́ю десе́рт.]{.ru}'
    answer: 正在进行（[зака́зываем]{.ru}）
  - text: '[За́втра я закажу́ сто́лик.]{.ru}'
    answer: 将来一次（[закажу́]{.ru}）
  - text: '[Ра́ньше мы ча́сто зака́зывали блины́.]{.ru}'
    answer: 经常、习惯（[зака́зывал]{.ru}）
  - text: '[Ван Лэй вы́брал моро́женое.]{.ru}'
    answer: 一次的结果（[заказа́л]{.ru}）
  - text: '[Сейча́с Ю́ми зака́зывает чай.]{.ru}'
    answer: 正在进行（[зака́зываем]{.ru}）
  - text: '[Я возьму́ борщ.]{.ru}'
    answer: 将来一次（[закажу́]{.ru}）
  - text: '[Вчера́ мы заказа́ли пельме́ни и блины́.]{.ru}'
    answer: 一次的结果（[заказа́л]{.ru}）
  - text: '[Я обы́чно беру́ чай с лимо́ном.]{.ru}'
    answer: 经常、习惯（[зака́зывал]{.ru}）
  - text: '[Мы ещё выбира́ем.]{.ru}'
    answer: 正在进行（[зака́зываем]{.ru}）
  - text: '[Ве́чером я закажу́ такси́.]{.ru}'
    answer: 将来一次（[закажу́]{.ru}）
  why: |
    第 1、5、9、14 题：[ча́сто, всегда́, обы́чно]{.ru} 表示经常，用未完成体。
    第 3、7、11、15 题：[сейча́с, ещё]{.ru} 表示动作正在进行，用未完成体现在时。
    第 2、6、10、13 题：点了、选好了，有了结果，用完成体过去时：[заказа́л, вы́брал]{.ru}；[уже́]{.ru} 也说明动作已完成。
    第 4、8、12、16 题：完成体变位表示将来一次：[закажу́, возьму́]{.ru}。顾客说自己要什么，常用 [Я закажу́…]{.ru}、[Я возьму́…]{.ru}。
- id: L77-05
  tags:
  - хотел бы：性数配合
  task: 用 [хоте́ть]{.ru} 加 [бы]{.ru} 的客气说法填空，注意说话人的性别。
  type: fill
  items:
  - stem: 'А́нна: «Я ___ блины́ со смета́ной».'
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́ла бы
  - stem: 'Ван Лэй: «Я ___ попро́бовать борщ».'
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́л бы
  - stem: Мы ___ заказа́ть сто́лик на ве́чер.
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́ли бы
  - stem: Что вы ___ заказа́ть?
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́ли бы
  - stem: 'Ми́ша: «Па́па, я ___ моро́женое».'
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́л бы
  - stem: Ю́ми ___ попро́бовать пельме́ни.
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́ла бы
  - stem: Пьер и Ю́ми ___ сиде́ть у окна́.
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́ли бы
  - stem: 'Мари́я Никола́евна: «Я ___ ры́бу и сала́т».'
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́ла бы
  - stem: Ива́н Серге́евич ___ кра́сное вино́.
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́л бы
  - stem: Ми́ша, ты ___ десе́рт?
    hint: '[хоте́ть]{.ru} + [бы]{.ru}'
    accept:
    - хоте́л бы
  why: |
    第 1、6、8 题：说话人或主语是女性，用 [хоте́ла бы]{.ru}。
    第 2、5、9、10 题：男性用 [хоте́л бы]{.ru}；第 10 题 [ты]{.ru} 指米沙。
    第 3、4、7 题：[мы, вы]{.ru} 和两个人用复数 [хоте́ли бы]{.ru}。[бы]{.ru} 放在 [хоте́л]{.ru} 后面，不重读。
