heading: 第 20 课　第二单元复习
groups:
- id: L20-01
  tags:
  - 单元复习：现在时与过去时混合
  recycles:
  - L10-02
  - L14-02
  - L17-02
  task: 写出动词现在时的 [я]{.ru}、[они́]{.ru} 形式和过去时的阴性、复数形式。
  type: matrix
  cols:
  - 不定式
  - 现在时 [я]{.ru}
  - 现在时 [они́]{.ru}
  - 过去时 [она́]{.ru}
  - 过去时 [они́]{.ru}
  given:
  - 0
  rows:
  - base: '[жить]{.ru}'
    cells:
    - '[жить]{.ru}'
    - '[живу́]{.ru}'
    - '[живу́т]{.ru}'
    - '[жила́]{.ru}'
    - '[жи́ли]{.ru}'
  - base: '[писа́ть]{.ru}'
    cells:
    - '[писа́ть]{.ru}'
    - '[пишу́]{.ru}'
    - '[пи́шут]{.ru}'
    - '[писа́ла]{.ru}'
    - '[писа́ли]{.ru}'
  - base: '[говори́ть]{.ru}'
    cells:
    - '[говори́ть]{.ru}'
    - '[говорю́]{.ru}'
    - '[говоря́т]{.ru}'
    - '[говори́ла]{.ru}'
    - '[говори́ли]{.ru}'
  - base: '[смотре́ть]{.ru}'
    cells:
    - '[смотре́ть]{.ru}'
    - '[смотрю́]{.ru}'
    - '[смо́трят]{.ru}'
    - '[смотре́ла]{.ru}'
    - '[смотре́ли]{.ru}'
  - base: '[спать]{.ru}'
    cells:
    - '[спать]{.ru}'
    - '[сплю]{.ru}'
    - '[спят]{.ru}'
    - '[спала́]{.ru}'
    - '[спа́ли]{.ru}'
  - base: '[чита́ть]{.ru}'
    cells:
    - '[чита́ть]{.ru}'
    - '[чита́ю]{.ru}'
    - '[чита́ют]{.ru}'
    - '[чита́ла]{.ru}'
    - '[чита́ли]{.ru}'
  - base: '[звать]{.ru}'
    cells:
    - '[звать]{.ru}'
    - '[зову́]{.ru}'
    - '[зову́т]{.ru}'
    - '[звала́]{.ru}'
    - '[зва́ли]{.ru}'
  - base: '[гото́вить]{.ru}'
    cells:
    - '[гото́вить]{.ru}'
    - '[гото́влю]{.ru}'
    - '[гото́вят]{.ru}'
    - '[гото́вила]{.ru}'
    - '[гото́вили]{.ru}'
  - base: '[лежа́ть]{.ru}'
    cells:
    - '[лежа́ть]{.ru}'
    - '[лежу́]{.ru}'
    - '[лежа́т]{.ru}'
    - '[лежа́ла]{.ru}'
    - '[лежа́ли]{.ru}'
  - base: '[ви́деть]{.ru}'
    cells:
    - '[ви́деть]{.ru}'
    - '[ви́жу]{.ru}'
    - '[ви́дят]{.ru}'
    - '[ви́дела]{.ru}'
    - '[ви́дели]{.ru}'
  - base: '[изуча́ть]{.ru}'
    cells:
    - '[изуча́ть]{.ru}'
    - '[изуча́ю]{.ru}'
    - '[изуча́ют]{.ru}'
    - '[изуча́ла]{.ru}'
    - '[изуча́ли]{.ru}'
  - base: '[стоя́ть]{.ru}'
    cells:
    - '[стоя́ть]{.ru}'
    - '[стою́]{.ru}'
    - '[стоя́т]{.ru}'
    - '[стоя́ла]{.ru}'
    - '[стоя́ли]{.ru}'
  why: |-
    第 6、11 题：规则第一变位：[чита́ю, чита́ют]{.ru}；过去时去 [-ть]{.ru} 加 [-ла, -ли]{.ru}。
    第 3、4、9、12 题：第二变位：[говоря́т, смо́трят, лежа́т, стоя́т]{.ru}；过去时仍由不定式构成：[говори́ла, смотре́ла, лежа́ла, стоя́ла]{.ru}。
    第 8、10 题：第一人称辅音有变化的第二变位：[гото́влю, ви́жу]{.ru}，[они́]{.ru} 不变：[гото́вят, ви́дят]{.ru}；过去时没有这种变化：[гото́вила, ви́дела]{.ru}。
    第 1 题：[жить]{.ru}：现在时 [живу́, живу́т]{.ru}，过去时没有 [в]{.ru}：[жила́, жи́ли]{.ru}，阴性重音在词尾。
    第 2 题：[писа́ть]{.ru}：现在时 [пишу́, пи́шут]{.ru}，过去时没有 [ш]{.ru}：[писа́ла, писа́ли]{.ru}。
    第 5 题：[спать]{.ru}：[сплю, спят]{.ru}；过去时阴性 [спала́]{.ru}，复数 [спа́ли]{.ru}。
    第 7 题：[звать]{.ru}：[зову́, зову́т]{.ru}；过去时 [звала́, зва́ли]{.ru}。
- id: L20-02
  tags:
  - 单元复习：过去时句中的第六格词组
  recycles:
  - L19-综合-b
  - L17-04
  task: 把括号里的词组变成第六格填空。
  type: fill
  items:
  - stem: Ра́ньше мы жи́ли в ___.
    hint: э́тот ста́рый дом
    accept:
    - э́том ста́ром до́ме
  - stem: Вчера́ А́нна была́ на ___.
    hint: интере́сная ле́кция
    accept:
    - интере́сной ле́кции
  - stem: Ми́ша игра́л в ___.
    hint: наш сад
    accept:
    - на́шем саду́
  - stem: Ра́ньше Ю́ми жила́ в ___.
    hint: Япо́ния
    accept:
    - Япо́нии
  - stem: Мы говори́ли о ___.
    hint: он
    accept:
    - нём
  - stem: Па́па рабо́тал на ___.
    hint: большо́й заво́д
    accept:
    - большо́м заво́де
  - stem: Ко́шка спала́ на ___.
    hint: твоя́ крова́ть
    accept:
    - твое́й крова́ти
  - stem: Вчера́ мы бы́ли в ___.
    hint: Большо́й теа́тр
    accept:
    - Большо́м теа́тре
  - stem: Студе́нты писа́ли упражне́ние в ___.
    hint: на́ша аудито́рия
    accept:
    - на́шей аудито́рии
  - stem: Ба́бушка гото́вила обе́д на ___.
    hint: о́бщая ку́хня
    accept:
    - о́бщей ку́хне
  - stem: Ван Лэй расска́зывал о ___.
    hint: Кита́й
    accept:
    - Кита́е
  - stem: Ключи́ лежа́ли в ___.
    hint: тот шкаф
    accept:
    - том шкафу́
  - stem: Пьер чита́л о ___.
    hint: ру́сская исто́рия
    accept:
    - ру́сской исто́рии
  - stem: А́нна ду́мала обо ___.
    hint: я
    accept:
    - мне
  - stem: Пьер жил в ___.
    hint: э́то общежи́тие
    accept:
    - э́том общежи́тии
  - stem: Мы отдыха́ли на ___.
    hint: Чёрное мо́ре
    accept:
    - Чёрном мо́ре
  - stem: Ю́ми была́ в ___.
    hint: э́та галере́я
    accept:
    - э́той галере́е
  - stem: Студе́нты ду́мали о ___.
    hint: она́
    accept:
    - ней
  why: |-
    第 1、6、8、11 题：阳性：[э́том ста́ром до́ме, большо́м заво́де, Большо́м теа́тре, Кита́е]{.ru}。
    第 15、16 题：中性和阳性同词尾：[э́том общежи́тии]{.ru}（名词 [-ии]{.ru}），[Чёрном мо́ре]{.ru}（[мо́ре]{.ru} 不变）。
    第 3、12 题：[сад, шкаф]{.ru} 表示处所用 [-у́]{.ru}：[на́шем саду́, том шкафу́]{.ru}。
    第 2、4、9、13 题：阴性 [-ия]{.ru} 名词变 [-ии]{.ru}，修饰语用 [-ой / -ей]{.ru}：[интере́сной ле́кции, Япо́нии, на́шей аудито́рии, ру́сской исто́рии]{.ru}。
    第 7 题：阴性 [-ь]{.ru}：[твое́й крова́ти]{.ru}。
    第 17 题：[галере́я]{.ru} 是 [-ея]{.ru}，名词用 [-е]{.ru}：[э́той галере́е]{.ru}。
    第 10 题：[о́бщий]{.ru} 是 [щ]{.ru} 词干，阴性 [о́бщей]{.ru}。
    第 5、14、18 题：人称代词：[о нём, о ней]{.ru}，[обо мне]{.ru}。
- id: L20-03
  tags:
  - 单元复习：按时间写现在时或过去时
  recycles:
  - L14-04
  - L17-04
  task: 按句中的时间词写出括号里动词的现在时或过去时。
  type: fill
  items:
  - stem: Сейча́с А́нна ___ письмо́.
    hint: писа́ть
    accept:
    - пи́шет
  - stem: Вчера́ А́нна ___ письмо́.
    hint: писа́ть
    accept:
    - писа́ла
  - stem: Ра́ньше мы ___ в Пеки́не.
    hint: жить
    accept:
    - жи́ли
  - stem: Сейча́с мы ___ в Москве́.
    hint: жить
    accept:
    - живём
  - stem: Ми́ша, что ты сейча́с ___?
    hint: смотре́ть
    accept:
    - смо́тришь
  - stem: Ми́ша, что ты ___ вчера́?
    hint: смотре́ть
    accept:
    - смотре́л
  - stem: Па́па сейча́с ___.
    hint: спать
    accept:
    - спит
  - stem: Вчера́ Му́рка ___ в саду́.
    hint: спать
    accept:
    - спала́
  - stem: Сейча́с я ___ по-ру́сски ме́дленно.
    hint: говори́ть
    accept:
    - говорю́
  - stem: Ра́ньше Пьер ___ по-ру́сски пло́хо.
    hint: говори́ть
    accept:
    - говори́л
  - stem: Вчера́ Ю́ми ___ в библиоте́ке.
    hint: быть
    accept:
    - была́
  - stem: Где вы ___ вчера́?
    hint: быть
    accept:
    - бы́ли
  - stem: Сейча́с ма́ма ___ обе́д.
    hint: гото́вить
    accept:
    - гото́вит
  - stem: Сейча́с ба́бушка ___ на да́че.
    hint: жить
    accept:
    - живёт
  - stem: Сейча́с роди́тели ___ в па́рке.
    hint: гуля́ть
    accept:
    - гуля́ют
  - stem: Ра́ньше ба́бушка ___ на да́че.
    hint: жить
    accept:
    - жила́
  why: |-
    第 5、7、9、13、15 题：[сейча́с]{.ru} 用现在时，按人称变位：[смо́тришь, спит, говорю́, гото́вит, гуля́ют]{.ru}。
    第 1、4、14 题：词干变化的动词：[пи́шет, живём, живёт]{.ru}。
    第 2、3、6、8、10–12、16 题：[вчера́, ра́ньше]{.ru} 用过去时，按性数变：[писа́ла, жи́ли, смотре́л, спала́, говори́л, была́, бы́ли, жила́]{.ru}。
- id: L20-04
  tags:
  - 单元复习：变位、过去时与第六格混合核查
  task: 每句有一处错误（变位、过去时或第六格），写出改正后的那个词。
  type: matrix
  cols:
  - 有错的句子
  - 改正的词
  given:
  - 0
  rows:
  - base: '[Вчера́ ма́ма был на рабо́те.]{.ru}'
    cells:
    - '[Вчера́ ма́ма был на рабо́те.]{.ru}'
    - '[была́]{.ru}'
  - base: '[Мы живу́т в Москве́.]{.ru}'
    cells:
    - '[Мы живу́т в Москве́.]{.ru}'
    - '[живём]{.ru}'
  - base: '[Ми́ша игра́л в са́де.]{.ru}'
    cells:
    - '[Ми́ша игра́л в са́де.]{.ru}'
    - '[саду́]{.ru}'
  - base: '[Ю́ми писа́л письмо́.]{.ru}'
    cells:
    - '[Ю́ми писа́л письмо́.]{.ru}'
    - '[писа́ла]{.ru}'
  - base: '[Студе́нты бы́ли в аудито́рие.]{.ru}'
    cells:
    - '[Студе́нты бы́ли в аудито́рие.]{.ru}'
    - '[аудито́рии]{.ru}'
  - base: '[Я пиша́ю упражне́ние.]{.ru}'
    cells:
    - '[Я пиша́ю упражне́ние.]{.ru}'
    - '[пишу́]{.ru}'
  - base: '[Они́ жи́ли в на́шем кварти́ре.]{.ru}'
    cells:
    - '[Они́ жи́ли в на́шем кварти́ре.]{.ru}'
    - '[на́шей]{.ru}'
  - base: '[А́нна была́ на филологи́ческим факульте́те.]{.ru}'
    cells:
    - '[А́нна была́ на филологи́ческим факульте́те.]{.ru}'
    - '[филологи́ческом]{.ru}'
  - base: '[Ра́ньше па́па рабо́тает на заво́де.]{.ru}'
    cells:
    - '[Ра́ньше па́па рабо́тает на заво́де.]{.ru}'
    - '[рабо́тал]{.ru}'
  - base: '[Ко́шка спа́ла на крова́ти.]{.ru}'
    cells:
    - '[Ко́шка спа́ла на крова́ти.]{.ru}'
    - '[спала́]{.ru}'
  - base: '[В э́тот до́ме живёт Ми́ша.]{.ru}'
    cells:
    - '[В э́тот до́ме живёт Ми́ша.]{.ru}'
    - '[э́том]{.ru}'
  - base: '[О́льга Ви́кторовна, вы была́ в теа́тре?]{.ru}'
    cells:
    - '[О́льга Ви́кторовна, вы была́ в теа́тре?]{.ru}'
    - '[бы́ли]{.ru}'
  - base: '[Пьер живёт в э́том общежи́тие.]{.ru}'
    cells:
    - '[Пьер живёт в э́том общежи́тие.]{.ru}'
    - '[общежи́тии]{.ru}'
  - base: '[Они́ пи́шат упражне́ние.]{.ru}'
    cells:
    - '[Они́ пи́шат упражне́ние.]{.ru}'
    - '[пи́шут]{.ru}'
  - base: '[Сейча́с ба́бушка жила́ на да́че.]{.ru}'
    cells:
    - '[Сейча́с ба́бушка жила́ на да́че.]{.ru}'
    - '[живёт]{.ru}'
  - base: '[Мы говори́ли о на́шей исто́рие.]{.ru}'
    cells:
    - '[Мы говори́ли о на́шей исто́рие.]{.ru}'
    - '[исто́рии]{.ru}'
  - base: '[Вчера́ мы смо́трим фильм.]{.ru}'
    cells:
    - '[Вчера́ мы смо́трим фильм.]{.ru}'
    - '[смотре́ли]{.ru}'
  - base: '[Ты, А́нна, спал до́ма?]{.ru}'
    cells:
    - '[Ты, А́нна, спал до́ма?]{.ru}'
    - '[спала́]{.ru}'
  why: |-
    第 2、6、14 题：现在时变位：[мы живём]{.ru}；[я пишу́, они́ пи́шут]{.ru}（[писа́ть]{.ru} 词干变 [пиш-]{.ru}，[они́]{.ru} 用 [-ут]{.ru}）。
    第 1、4、10、12、18 题：过去时按主语性数：[ма́ма была́, Ю́ми писа́ла, вы бы́ли]{.ru}；[спала́]{.ru} 阴性重音在词尾，对安娜说 [ты спала́]{.ru}。
    第 9、15、17 题：时间词决定时态：[ра́ньше, вчера́]{.ru} 用过去时 [рабо́тал, смотре́ли]{.ru}，[сейча́с]{.ru} 用现在时 [живёт]{.ru}。
    第 3、5、13、16 题：名词第六格：[в саду́]{.ru}（[-у́]{.ru}），[в аудито́рии, в … общежи́тии, о … исто́рии]{.ru}（[-ии]{.ru}）。
    第 7、8、11 题：修饰语和名词一致：[в на́шей кварти́ре]{.ru}（阴性），[на филологи́ческом факульте́те]{.ru}（阳性，[к]{.ru} 后照硬变化），[в э́том до́ме]{.ru}（第六格）。
