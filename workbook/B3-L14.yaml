heading: 第 14 课　副动词短语的意义
groups:
- id: B3-L14-01
  lessons:
  - B3-L14
  tags:
  - 副动词的意义：时间
  - 副动词的意义：原因
  - 副动词的意义：条件
  - 副动词的意义：方式伴随
  - 副动词的意义：让步
  task: 副动词短语表示什么意义？归栏。
  type: classify
  bins:
  - 时间
  - 原因
  - 条件
  - 方式、伴随
  - 让步
  items:
  - text: '[Не зна́я доро́ги, мы спроси́ли сосе́да.]{.ru}'
    answer: 原因
  - text: '[Он слу́шал нас, улыба́ясь.]{.ru}'
    answer: 方式、伴随
  - text: '[Прие́хав в Каза́нь ле́том, вы попадёте на пра́здник.]{.ru}'
    answer: 条件
  - text: '[Спусти́вшись с горы́, тури́сты пошли́ обе́дать.]{.ru}'
    answer: 时间
  - text: '[Да́же не зна́я языка́, он бы́стро нашёл друзе́й.]{.ru}'
    answer: 让步
  - text: '[Боя́сь опозда́ть, она́ взяла́ такси́.]{.ru}'
    answer: 原因
  - text: '[Де́ти бежа́ли по па́рку, смея́сь и крича́.]{.ru}'
    answer: 方式、伴随
  - text: '[Выходя́ из до́ма, он всегда́ проверя́ет, взял ли ключи́.]{.ru}'
    answer: 时间
  - text: '[Встав в шесть часо́в, мо́жно успе́ть на пе́рвый по́езд.]{.ru}'
    answer: 条件
  - text: '[Не бу́дучи музыка́нтом, он прекра́сно игра́ет на гита́ре.]{.ru}'
    answer: 让步
  - text: '[Хорошо́ зна́я го́род, он показа́л нам интере́сные места́.]{.ru}'
    answer: 原因
  - text: '[Ба́бушка чита́ла газе́ту, си́дя в кре́сле.]{.ru}'
    answer: 方式、伴随
  - text: '[Прочита́в э́ту кни́гу, вы лу́чше поймёте ру́сскую исто́рию.]{.ru}'
    answer: 条件
  - text: '[Ко́нчив рабо́ту, па́па пошёл гуля́ть с соба́кой.]{.ru}'
    answer: 时间
  - text: '[Да́же уста́в по́сле рабо́ты, ма́ма всегда́ гото́вит у́жин.]{.ru}'
    answer: 让步
  - text: '[Пло́хо себя́ чу́вствуя, Ми́ша не пошёл в шко́лу.]{.ru}'
    answer: 原因
  - text: '[Мы до́лго шли по на́бережной, разгова́ривая о Каза́ни.]{.ru}'
    answer: 方式、伴随
  - text: '[Купи́в биле́ты зара́нее, не придётся стоя́ть в о́череди.]{.ru}'
    answer: 条件
  - text: '[Возвраща́ясь домо́й, я зашёл в апте́ку.]{.ru}'
    answer: 时间
  - text: '[Да́же прожи́в в Москве́ де́сять лет, он пло́хо зна́ет го́род.]{.ru}'
    answer: 让步
  why: |-
    第 4、8、14、19 题：时间（[когда́, по́сле того́ как]{.ru}）：完成体表示先后（[спусти́вшись, ко́нчив]{.ru}），未完成体表示同时（[выходя́, возвраща́ясь]{.ru}）。
    第 1、6、11、16 题：原因（[так как, потому́ что]{.ru}）：副动词是表示知识、心理状态的动词（[не зна́я, боя́сь, хорошо́ зна́я, пло́хо себя́ чу́вствуя]{.ru}），说明为什么这样做。
    第 3、9、13、18 题：条件（[е́сли]{.ru}）：谓语是将来时（[попадёте, поймёте]{.ru}），或者有 [мо́жно, придётся]{.ru} 加不定式。
    第 2、7、12、17 题：方式、伴随：说明动作怎样进行，只能换成并列谓语（[слу́шал и улыба́лся]{.ru}），不能换成带连词的从句。
    第 5、10、15、20 题：让步（[хотя́]{.ru}）：有 [да́же]{.ru}，或者意思和谓语相对（[не бу́дучи музыка́нтом — прекра́сно игра́ет]{.ru}）。
- id: B3-L14-02
  lessons:
  - B3-L14
  tags:
  - 副动词的意义：换成从句的连词
  - 副动词与从句：副动词 → 从句
  task: 把副动词短语改成从句：写出连词和从句的谓语。
  type: matrix
  cols:
  - 句子
  - 连词
  - 从句谓语
  given:
  - 0
  rows:
  - base: '[Не зна́я а́дреса, мы позвони́ли дру́гу.]{.ru}'
    cells:
    - '[Не зна́я а́дреса, мы позвони́ли дру́гу.]{.ru}'
    - '[так как / потому́ что]{.ru}'
    - '[не зна́ли]{.ru}'
  - base: '[Прие́хав в Каза́нь в ию́не (вы), мо́жно попа́сть на пра́здник.]{.ru}'
    cells:
    - '[Прие́хав в Каза́нь в ию́не (вы), мо́жно попа́сть на пра́здник.]{.ru}'
    - '[е́сли]{.ru}'
    - '[прие́дете]{.ru}'
  - base: '[Спусти́вшись с горы́, мы пошли́ обе́дать.]{.ru}'
    cells:
    - '[Спусти́вшись с горы́, мы пошли́ обе́дать.]{.ru}'
    - '[когда́ / по́сле того́ как]{.ru}'
    - '[спусти́лись]{.ru}'
  - base: '[Да́же не зна́я языка́, он бы́стро нашёл друзе́й.]{.ru}'
    cells:
    - '[Да́же не зна́я языка́, он бы́стро нашёл друзе́й.]{.ru}'
    - '[хотя́]{.ru}'
    - '[не знал]{.ru}'
  - base: '[Гуля́я по па́рку, де́ти собира́ли цветы́.]{.ru}'
    cells:
    - '[Гуля́я по па́рку, де́ти собира́ли цветы́.]{.ru}'
    - '[когда́ / пока́]{.ru}'
    - '[гуля́ли]{.ru}'
  - base: '[Боя́сь опозда́ть, она́ взяла́ такси́.]{.ru}'
    cells:
    - '[Боя́сь опозда́ть, она́ взяла́ такси́.]{.ru}'
    - '[так как / потому́ что]{.ru}'
    - '[боя́лась]{.ru}'
  - base: '[Прочита́в э́ту кни́гу, вы всё поймёте.]{.ru}'
    cells:
    - '[Прочита́в э́ту кни́гу, вы всё поймёте.]{.ru}'
    - '[е́сли]{.ru}'
    - '[прочита́ете]{.ru}'
  - base: '[Не бу́дучи музыка́нтом, он хорошо́ игра́ет на гита́ре.]{.ru}'
    cells:
    - '[Не бу́дучи музыка́нтом, он хорошо́ игра́ет на гита́ре.]{.ru}'
    - '[хотя́]{.ru}'
    - '[не музыка́нт]{.ru}'
  - base: '[Возвраща́ясь из шко́лы, Ми́ша встре́тил учи́теля.]{.ru}'
    cells:
    - '[Возвраща́ясь из шко́лы, Ми́ша встре́тил учи́теля.]{.ru}'
    - '[когда́ / пока́]{.ru}'
    - '[возвраща́лся]{.ru}'
  - base: '[Хорошо́ зна́я исто́рию, он отве́тил на все вопро́сы.]{.ru}'
    cells:
    - '[Хорошо́ зна́я исто́рию, он отве́тил на все вопро́сы.]{.ru}'
    - '[так как / потому́ что]{.ru}'
    - '[хорошо́ знал]{.ru}'
  - base: '[Встав пора́ньше (ты), успе́ешь на по́езд.]{.ru}'
    cells:
    - '[Встав пора́ньше (ты), успе́ешь на по́езд.]{.ru}'
    - '[е́сли]{.ru}'
    - '[вста́нешь]{.ru}'
  - base: '[Да́же прожи́в в Москве́ де́сять лет, он пло́хо зна́ет го́род.]{.ru}'
    cells:
    - '[Да́же прожи́в в Москве́ де́сять лет, он пло́хо зна́ет го́род.]{.ru}'
    - '[хотя́]{.ru}'
    - '[прожи́л]{.ru}'
  why: |-
    第 3、5、9 题：时间：[когда́]{.ru}；同时进行的也可以用 [пока́]{.ru}，先后发生的也可以用 [по́сле того́ как]{.ru}。体随副动词，时随主句：[спусти́лись, гуля́ли, возвраща́лся]{.ru}。
    第 1、6、10 题：原因：[так как]{.ru} 或 [потому́ что]{.ru}（[потому́ что]{.ru} 从句一般放在主句后面）：[не зна́ли, боя́лась, хорошо́ знал]{.ru}。
    第 2、7、11 题：条件：[е́сли]{.ru}，主句是将来时或带不定式，从句用将来时：完成体副动词变成完成体将来时 [прие́дете, прочита́ете, вста́нешь]{.ru}。第 2、11 题主句没有主语，从句的主语按括号补出。
    第 4、8、12 题：让步：[хотя́]{.ru}：[не знал, прожи́л]{.ru}；第 8 题 [не бу́дучи]{.ru} 还原成 [Хотя́ он не музыка́нт]{.ru}，现在时不用系词。
- id: B3-L14-03
  lessons:
  - B3-L14
  tags:
  - 副动词的意义：换成从句的连词
  task: 填上连词。
  type: fill
  items:
  - stem: ___ мы не зна́ли доро́ги, мы спроси́ли сосе́да.
    accept:
    - так как
  - stem: ___ вы прие́дете в Каза́нь в ию́не, вы попадёте на Сабанту́й.
    accept:
    - е́сли
  - stem: ___ он не знал языка́, он бы́стро нашёл друзе́й.
    accept:
    - хотя́
  - stem: ___ мы спусти́лись с горы́, мы пошли́ обе́дать.
    accept:
    - по́сле того́ как
    - когда́
  - stem: Ми́ша не пошёл в шко́лу, ___ пло́хо себя́ чу́вствовал.
    accept:
    - потому́ что
    - так как
  - stem: ___ ты вста́нешь пора́ньше, ты успе́ешь на по́езд.
    accept:
    - е́сли
  - stem: ___ ма́ма о́чень уста́ла, она́ пригото́вила у́жин.
    accept:
    - хотя́
  - stem: ___ я возвраща́лся домо́й, я зашёл в апте́ку.
    accept:
    - когда́
    - пока́
  - stem: Она́ взяла́ такси́, ___ боя́лась опозда́ть.
    accept:
    - потому́ что
    - так как
  - stem: ___ он прожи́л в Москве́ де́сять лет, он пло́хо зна́ет го́род.
    accept:
    - хотя́
  - stem: ___ вы прочита́ете э́ту кни́гу, вы лу́чше поймёте исто́рию.
    accept:
    - е́сли
  - stem: ___ тури́сты осма́тривали кремль, они́ мно́го фотографи́ровали.
    accept:
    - когда́
    - пока́
  why: |-
    第 1、5、9 题：原因：[так как]{.ru}；从句在主句后面时也可以用 [потому́ что]{.ru}，[потому́ что]{.ru} 一般不放在句首。
    第 2、6、11 题：条件：从句和主句都是将来时，用 [е́сли]{.ru}。
    第 3、7、10 题：让步：从句的事和主句的结果相对（不懂语言却很快交到朋友，很累却做了晚饭，住了十年却不熟悉城市），用 [хотя́]{.ru}。
    第 4 题：先后：[по́сле того́ как]{.ru} 或 [когда́]{.ru}。
    第 8、12 题：同时：[когда́]{.ru} 或 [пока́]{.ru}。
