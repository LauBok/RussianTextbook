heading: 第 56 课　形容词与代词第三格
groups:
- id: L56-01
  tags: [形容词单数第三格：硬、软、混合变化]
  task: 写出形容词的单数第三格。
  type: matrix
  cols: [阳性第一格, 阳性、中性第三格, 阴性第三格]
  given: [0]
  rows:
  - {base: '[но́вый]{.ru}', cells: ['[но́вый]{.ru}', '[но́вому]{.ru}', '[но́вой]{.ru}']}
  - {base: '[ста́рый]{.ru}', cells: ['[ста́рый]{.ru}', '[ста́рому]{.ru}', '[ста́рой]{.ru}']}
  - {base: '[интере́сный]{.ru}', cells: ['[интере́сный]{.ru}', '[интере́сному]{.ru}', '[интере́сной]{.ru}']}
  - {base: '[си́ний]{.ru}', cells: ['[си́ний]{.ru}', '[си́нему]{.ru}', '[си́ней]{.ru}']}
  - {base: '[ле́тний]{.ru}', new: true, gloss: 夏天的, cells: ['[ле́тний]{.ru}', '[ле́тнему]{.ru}', '[ле́тней]{.ru}']}
  - {base: '[после́дний]{.ru}', new: true, gloss: 最后的, cells: ['[после́дний]{.ru}', '[после́днему]{.ru}', '[после́дней]{.ru}']}
  - {base: '[хоро́ший]{.ru}', cells: ['[хоро́ший]{.ru}', '[хоро́шему]{.ru}', '[хоро́шей]{.ru}']}
  - {base: '[мла́дший]{.ru}', cells: ['[мла́дший]{.ru}', '[мла́дшему]{.ru}', '[мла́дшей]{.ru}']}
  - {base: '[ста́рший]{.ru}', cells: ['[ста́рший]{.ru}', '[ста́ршему]{.ru}', '[ста́ршей]{.ru}']}
  - {base: '[ру́сский]{.ru}', cells: ['[ру́сский]{.ru}', '[ру́сскому]{.ru}', '[ру́сской]{.ru}']}
  - {base: '[ма́ленький]{.ru}', cells: ['[ма́ленький]{.ru}', '[ма́ленькому]{.ru}', '[ма́ленькой]{.ru}']}
  - {base: '[большо́й]{.ru}', cells: ['[большо́й]{.ru}', '[большо́му]{.ru}', '[большо́й]{.ru}']}
  - {base: '[молодо́й]{.ru}', cells: ['[молодо́й]{.ru}', '[молодо́му]{.ru}', '[молодо́й]{.ru}']}
  - {base: '[дорого́й]{.ru}', cells: ['[дорого́й]{.ru}', '[дорого́му]{.ru}', '[дорого́й]{.ru}']}
  - {base: '[све́жий]{.ru}', new: true, gloss: 新鲜的, cells: ['[све́жий]{.ru}', '[све́жему]{.ru}', '[све́жей]{.ru}']}
  - {base: '[горя́чий]{.ru}', new: true, gloss: 热的, cells: ['[горя́чий]{.ru}', '[горя́чему]{.ru}', '[горя́чей]{.ru}']}
  why: |
    第 1–3 题：硬变化，阳性、中性 [-ому]{.ru}，阴性 [-ой]{.ru}。
    第 4–6 题：软变化，阳性、中性 [-ему]{.ru}，阴性 [-ей]{.ru}：[си́нему, ле́тней]{.ru}。
    第 7–9、15、16 题：[ш, ж, ч]{.ru} 后面不带重音时写 [е]{.ru}：[хоро́шему, мла́дшей, све́жему, горя́чей]{.ru}，不写 [хоро́шому]{.ru}。
    第 10、11 题：[к]{.ru} 后面按硬变化写 [-ому, -ой]{.ru}：[ру́сскому, ма́ленькой]{.ru}。
    第 12–14 题：重音在词尾的形容词写 [-о́му, -о́й]{.ru}；阴性第三格和阳性第一格同形：[большо́й, молодо́й, дорого́й]{.ru}，要看名词判断。
- id: L56-02
  tags: [物主代词与指示代词第三格]
  task: 写出代词的单数第三格。
  type: matrix
  cols: [阳性第一格, 阳性、中性第三格, 阴性第三格]
  given: [0]
  rows:
  - {base: '[мой]{.ru}', cells: ['[мой]{.ru}', '[моему́]{.ru}', '[мое́й]{.ru}']}
  - {base: '[твой]{.ru}', cells: ['[твой]{.ru}', '[твоему́]{.ru}', '[твое́й]{.ru}']}
  - {base: '[наш]{.ru}', cells: ['[наш]{.ru}', '[на́шему]{.ru}', '[на́шей]{.ru}']}
  - {base: '[ваш]{.ru}', cells: ['[ваш]{.ru}', '[ва́шему]{.ru}', '[ва́шей]{.ru}']}
  - {base: '[чей]{.ru}', cells: ['[чей]{.ru}', '[чьему́]{.ru}', '[чьей]{.ru}']}
  - {base: '[э́тот]{.ru}', cells: ['[э́тот]{.ru}', '[э́тому]{.ru}', '[э́той]{.ru}']}
  - {base: '[тот]{.ru}', cells: ['[тот]{.ru}', '[тому́]{.ru}', '[той]{.ru}']}
  - {base: '[его́]{.ru}', cells: ['[его́]{.ru}', '[его́]{.ru}', '[его́]{.ru}']}
  - {base: '[её]{.ru}', cells: ['[её]{.ru}', '[её]{.ru}', '[её]{.ru}']}
  - {base: '[их]{.ru}', cells: ['[их]{.ru}', '[их]{.ru}', '[их]{.ru}']}
  - {base: '[ка́ждый]{.ru}', cells: ['[ка́ждый]{.ru}', '[ка́ждому]{.ru}', '[ка́ждой]{.ru}']}
  - {base: '[тако́й]{.ru}', cells: ['[тако́й]{.ru}', '[тако́му]{.ru}', '[тако́й]{.ru}']}
  why: |
    第 1、2 题：[мой, твой]{.ru} 阳性、中性 [моему́, твоему́]{.ru}，阴性 [мое́й, твое́й]{.ru}，重音在词尾。
    第 3、4 题：[наш, ваш]{.ru} 重音在词干：[на́шему, ва́шей]{.ru}。
    第 5 题：[чей]{.ru} 词干是 [чь-]{.ru}：[чьему́, чьей]{.ru}。
    第 6、7 题：[э́тому, тому́; э́той, той]{.ru}；[тому́]{.ru} 重音在词尾。
    第 8–10 题：[его́, её, их]{.ru} 作物主代词时不变：[его́ бра́ту, её ма́ме, их сы́ну]{.ru}。
    第 11、12 题：[ка́ждый, тако́й]{.ru} 按形容词变：[ка́ждому, ка́ждой; тако́му, тако́й]{.ru}。
- id: L56-03
  tags: [代词、形容词与名词第三格：词组共同变化]
  task: 把三个词组成第三格词组。
  type: matrix
  cols: [原形, 第三格词组]
  given: [0]
  rows:
  - {base: '[мой + ста́рший + брат]{.ru}', cells: ['[мой + ста́рший + брат]{.ru}', '[моему́ ста́ршему бра́ту]{.ru}']}
  - {base: '[на́ша + ста́рая + ба́бушка]{.ru}', cells: ['[на́ша + ста́рая + ба́бушка]{.ru}', '[на́шей ста́рой ба́бушке]{.ru}']}
  - {base: '[твой + мла́дший + брат]{.ru}', cells: ['[твой + мла́дший + брат]{.ru}', '[твоему́ мла́дшему бра́ту]{.ru}']}
  - {base: '[э́тот + молодо́й + врач]{.ru}', cells: ['[э́тот + молодо́й + врач]{.ru}', '[э́тому молодо́му врачу́]{.ru}']}
  - {base: '[ва́ша + мла́дшая + сестра́]{.ru}', cells: ['[ва́ша + мла́дшая + сестра́]{.ru}', '[ва́шей мла́дшей сестре́]{.ru}']}
  - {base: '[тот + ру́сский + студе́нт]{.ru}', cells: ['[тот + ру́сский + студе́нт]{.ru}', '[тому́ ру́сскому студе́нту]{.ru}']}
  - {base: '[э́та + ма́ленькая + де́вочка]{.ru}', cells: ['[э́та + ма́ленькая + де́вочка]{.ru}', '[э́той ма́ленькой де́вочке]{.ru}']}
  - {base: '[его́ + хоро́ший + друг]{.ru}', cells: ['[его́ + хоро́ший + друг]{.ru}', '[его́ хоро́шему дру́гу]{.ru}']}
  - {base: '[её + но́вая + подру́га]{.ru}', cells: ['[её + но́вая + подру́га]{.ru}', '[её но́вой подру́ге]{.ru}']}
  - {base: '[наш + дорого́й + учи́тель]{.ru}', cells: ['[наш + дорого́й + учи́тель]{.ru}', '[на́шему дорого́му учи́телю]{.ru}']}
  - {base: '[моя́ + ста́ршая + дочь]{.ru}', cells: ['[моя́ + ста́ршая + дочь]{.ru}', '[мое́й ста́ршей до́чери]{.ru}']}
  - {base: '[их + ма́ленький + сын]{.ru}', cells: ['[их + ма́ленький + сын]{.ru}', '[их ма́ленькому сы́ну]{.ru}']}
  - {base: '[э́та + молода́я + мать]{.ru}', cells: ['[э́та + молода́я + мать]{.ru}', '[э́той молодо́й ма́тери]{.ru}']}
  - {base: '[твой + ста́рый + де́душка]{.ru}', cells: ['[твой + ста́рый + де́душка]{.ru}', '[твоему́ ста́рому де́душке]{.ru}']}
  - {base: '[наш + Ми́ша]{.ru}', cells: ['[наш + Ми́ша]{.ru}', '[на́шему Ми́ше]{.ru}']}
  - {base: '[чей + брат]{.ru}', cells: ['[чей + брат]{.ru}', '[чьему́ бра́ту]{.ru}']}
  why: |
    第 1、3、4、6、8、10、12 题：阳性词组：代词 [-ему / -ому]{.ru}（[моему́, э́тому, тому́, на́шему]{.ru}），形容词 [-ому / -ему]{.ru}，名词 [-у / -ю]{.ru}（[бра́ту, врачу́, учи́телю]{.ru}）。第 8、12 题 [его́, их]{.ru} 不变。
    第 2、5、7、9 题：阴性词组：代词 [-ей / -ой]{.ru}，形容词 [-ой / -ей]{.ru}，名词 [-е]{.ru}。
    第 11、13 题：[дочь, мать]{.ru} 是阴性，修饰语用阴性；名词变成 [до́чери, ма́тери]{.ru}。
    第 14、15 题：[де́душка, Ми́ша]{.ru} 是阳性，修饰语用阳性 [-ому / -ему]{.ru}（[твоему́ ста́рому, на́шему]{.ru}），名词按阴性变 [-е]{.ru}。这是最容易出错的组合。
    第 16 题：[чьему́ бра́ту]{.ru}——问“给谁的哥哥”。
- id: L56-04
  tags: [第三格与第四格：送谁什么]
  task: 写出“送给谁”（第三格）和“送什么”（第四格）。
  type: matrix
  cols: [给谁 — 什么, 给谁（第三格）, 送什么（第四格）]
  given: [0]
  rows:
  - {base: '[мла́дший брат — компью́терная игра́]{.ru}', cells: ['[мла́дший брат — компью́терная игра́]{.ru}', '[мла́дшему бра́ту]{.ru}', '[компью́терную игру́]{.ru}']}
  - {base: '[на́ша ба́бушка — тёплый шарф]{.ru}', cells: ['[на́ша ба́бушка — тёплый шарф]{.ru}', '[на́шей ба́бушке]{.ru}', '[тёплый шарф]{.ru}']}
  - {base: '[ста́ршая сестра́ — но́вая ку́ртка]{.ru}', cells: ['[ста́ршая сестра́ — но́вая ку́ртка]{.ru}', '[ста́ршей сестре́]{.ru}', '[но́вую ку́ртку]{.ru}']}
  - {base: '[мой па́па — интере́сная кни́га]{.ru}', cells: ['[мой па́па — интере́сная кни́га]{.ru}', '[моему́ па́пе]{.ru}', '[интере́сную кни́гу]{.ru}']}
  - {base: '[твоя́ ма́ма — краси́вая су́мка]{.ru}', cells: ['[твоя́ ма́ма — краси́вая су́мка]{.ru}', '[твое́й ма́ме]{.ru}', '[краси́вую су́мку]{.ru}']}
  - {base: '[наш Ми́ша — футбо́льный мяч]{.ru}', cells: ['[наш Ми́ша — футбо́льный мяч]{.ru}', '[на́шему Ми́ше]{.ru}', '[футбо́льный мяч]{.ru}']}
  - {base: '[мой друг — ру́сский слова́рь]{.ru}', cells: ['[мой друг — ру́сский слова́рь]{.ru}', '[моему́ дру́гу]{.ru}', '[ру́сский слова́рь]{.ru}']}
  - {base: '[О́льга Ви́кторовна — большо́й торт]{.ru}', cells: ['[О́льга Ви́кторовна — большо́й торт]{.ru}', '[О́льге Ви́кторовне]{.ru}', '[большо́й торт]{.ru}']}
  - {base: '[ста́рый де́душка — но́вое кре́сло]{.ru}', cells: ['[ста́рый де́душка — но́вое кре́сло]{.ru}', '[ста́рому де́душке]{.ru}', '[но́вое кре́сло]{.ru}']}
  - {base: '[её брат — си́ний каранда́ш]{.ru}', cells: ['[её брат — си́ний каранда́ш]{.ru}', '[её бра́ту]{.ru}', '[си́ний каранда́ш]{.ru}']}
  - {base: '[твоя́ подру́га — хоро́шая ру́чка]{.ru}', cells: ['[твоя́ подру́га — хоро́шая ру́чка]{.ru}', '[твое́й подру́ге]{.ru}', '[хоро́шую ру́чку]{.ru}']}
  - {base: '[э́та де́вочка — ма́ленькая ко́шка]{.ru}', cells: ['[э́та де́вочка — ма́ленькая ко́шка]{.ru}', '[э́той де́вочке]{.ru}', '[ма́ленькую ко́шку]{.ru}']}
  why: |
    第 1–12 题：收礼的人用第三格，礼物用第四格。同一个形容词在两格里词尾不同：第三格阳性 [-ому]{.ru}、阴性 [-ой]{.ru}；第四格阴性 [-ую]{.ru}（[компью́терную игру́, но́вую ку́ртку]{.ru}），阳性和中性非动物名词同第一格（[тёплый шарф, но́вое кре́сло]{.ru}）。
    第 4、6、9 题：[па́па, Ми́ша, де́душка]{.ru} 修饰语用阳性 [моему́, на́шему, ста́рому]{.ru}，名词按阴性变 [-е]{.ru}。
    第 12 题：[ко́шка]{.ru} 是动物，阴性第四格仍是 [-у]{.ru}：[ма́ленькую ко́шку]{.ru}。
