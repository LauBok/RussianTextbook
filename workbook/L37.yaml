heading: 第 37 课　支配第二格的前置词
groups:
- id: L37-01
  tags:
  - 第二格前置词：у、о́коло、напро́тив、до、по́сле、без
  task: 写出前置词后的第二格词组。
  type: matrix
  cols:
  - 前置词 + 名词
  - 第二格词组
  rows:
  - base: '[о́коло + метро́]{.ru}'
    cells:
    - '[о́коло + метро́]{.ru}'
    - '[о́коло метро́]{.ru}'
  - base: '[напро́тив + парк]{.ru}'
    cells:
    - '[напро́тив + парк]{.ru}'
    - '[напро́тив па́рка]{.ru}'
  - base: '[у + подъе́зд]{.ru}'
    cells:
    - '[у + подъе́зд]{.ru}'
    - '[у подъе́зда]{.ru}'
    new: true
    gloss: 楼门口
  - base: '[до + обе́д]{.ru}'
    cells:
    - '[до + обе́д]{.ru}'
    - '[до обе́да]{.ru}'
  - base: '[по́сле + шко́ла]{.ru}'
    cells:
    - '[по́сле + шко́ла]{.ru}'
    - '[по́сле шко́лы]{.ru}'
  - base: '[без + са́хар]{.ru}'
    cells:
    - '[без + са́хар]{.ru}'
    - '[без са́хара]{.ru}'
  - base: '[о́коло + апте́ка]{.ru}'
    cells:
    - '[о́коло + апте́ка]{.ru}'
    - '[о́коло апте́ки]{.ru}'
  - base: '[напро́тив + наш дом]{.ru}'
    cells:
    - '[напро́тив + наш дом]{.ru}'
    - '[напро́тив на́шего до́ма]{.ru}'
  - base: '[по́сле + уро́к]{.ru}'
    cells:
    - '[по́сле + уро́к]{.ru}'
    - '[по́сле уро́ка]{.ru}'
  - base: '[до + ста́нция]{.ru}'
    cells:
    - '[до + ста́нция]{.ru}'
    - '[до ста́нции]{.ru}'
  - base: '[у + ба́бушка]{.ru}'
    cells:
    - '[у + ба́бушка]{.ru}'
    - '[у ба́бушки]{.ru}'
  - base: '[без + слова́рь]{.ru}'
    cells:
    - '[без + слова́рь]{.ru}'
    - '[без словаря́]{.ru}'
  - base: '[о́коло + ста́рая библиоте́ка]{.ru}'
    cells:
    - '[о́коло + ста́рая библиоте́ка]{.ru}'
    - '[о́коло ста́рой библиоте́ки]{.ru}'
  - base: '[по́сле + интере́сная ле́кция]{.ru}'
    cells:
    - '[по́сле + интере́сная ле́кция]{.ru}'
    - '[по́сле интере́сной ле́кции]{.ru}'
  - base: '[напро́тив + большо́й магази́н]{.ru}'
    cells:
    - '[напро́тив + большо́й магази́н]{.ru}'
    - '[напро́тив большо́го магази́на]{.ru}'
  - base: '[до + Кра́сная пло́щадь]{.ru}'
    cells:
    - '[до + Кра́сная пло́щадь]{.ru}'
    - '[до Кра́сной пло́щади]{.ru}'
  - base: '[у + мой ста́рший брат]{.ru}'
    cells:
    - '[у + мой ста́рший брат]{.ru}'
    - '[у моего́ ста́ршего бра́та]{.ru}'
  - base: '[без + мла́дшая сестра́]{.ru}'
    cells:
    - '[без + мла́дшая сестра́]{.ru}'
    - '[без мла́дшей сестры́]{.ru}'
  why: '第 1–18 题：这些前置词后面一律用第二格，修饰语随名词变。

    第 1 题：[метро́]{.ru} 不变格。第 12 题：[словаря́]{.ru} 重音在词尾。

    第 10、14 题：[-ия]{.ru} 变 [-ии]{.ru}：[до ста́нции]{.ru}。

    第 13、16 题：阴性修饰语 [-ой]{.ru}；[-ь]{.ru} 结尾的阴性名词变 [-и]{.ru}：[до Кра́сной пло́щади]{.ru}。

    第 8、15、17 题：阳性修饰语 [-ого / -его]{.ru}：[на́шего, большо́го, моего́ ста́ршего]{.ru}。'
- id: L37-02
  tags:
  - 第二格前置词：按意义选择
  task: 根据汉语意思选择前置词。
  type: classify
  bins:
  - '[у]{.ru}'
  - '[о́коло]{.ru}'
  - '[напро́тив]{.ru}'
  - '[до]{.ru}'
  - '[по́сле]{.ru}'
  - '[без]{.ru}'
  items:
  - text: '[парк]{.ru}：在公园对面'
    answer: '[напро́тив]{.ru}'
  - text: '[подъе́зд]{.ru}：就在楼门口'
    answer: '[у]{.ru}'
  - text: '[метро́]{.ru}：在地铁站一带'
    answer: '[о́коло]{.ru}'
  - text: '[уро́к]{.ru}：下课以后'
    answer: '[по́сле]{.ru}'
  - text: '[обе́д]{.ru}：午饭以前'
    answer: '[до]{.ru}'
  - text: '[са́хар]{.ru}：不加糖的茶'
    answer: '[без]{.ru}'
  - text: '[ба́бушка]{.ru}：在奶奶家'
    answer: '[у]{.ru}'
  - text: '[ста́нция]{.ru}：到车站（五分钟）'
    answer: '[до]{.ru}'
  - text: '[шко́ла]{.ru}：学校对面'
    answer: '[напро́тив]{.ru}'
  - text: '[университе́т]{.ru}：大学附近'
    answer: '[о́коло]{.ru}'
  - text: '[рабо́та]{.ru}：下班以后'
    answer: '[по́сле]{.ru}'
  - text: '[слова́рь]{.ru}：不用词典（读书）'
    answer: '[без]{.ru}'
  - text: '[окно́]{.ru}：紧挨着窗户（站着）'
    answer: '[у]{.ru}'
  - text: '[ле́кция]{.ru}：上课以前'
    answer: '[до]{.ru}'
  - text: '[дом]{.ru}：房子附近'
    answer: '[о́коло]{.ru}'
  - text: '[футбо́л]{.ru}：没有足球（米沙没法生活）'
    answer: '[без]{.ru}'
  - text: '[апте́ка]{.ru}：在药店对面'
    answer: '[напро́тив]{.ru}'
  - text: '[конце́рт]{.ru}：音乐会以后'
    answer: '[по́сле]{.ru}'
  why: '第 2、7、13 题：紧挨着用 [у]{.ru}；[у]{.ru} 加人表示“在某人那里、在某人家”：[у ба́бушки]{.ru}。

    第 3、10、15 题：范围大一些的“附近”用 [о́коло]{.ru}。

    第 1、9、17 题：“对面”用 [напро́тив]{.ru}。

    第 5、8、14 题：[до]{.ru} 表示时间上“在……以前”，也表示空间上“到……”：[до обе́да, до ста́нции]{.ru}。

    第 4、11、18 题：“在……以后”用 [по́сле]{.ru}。

    第 6、12、16 题：“没有、不带”用 [без]{.ru}。'
- id: L37-03
  tags:
  - 第二格前置词：人称代词加 н-
  task: 写出前置词后代词的形式。
  type: matrix
  cols:
  - 前置词 + 代词
  - 第二格
  rows:
  - base: '[о́коло + он]{.ru}'
    cells:
    - '[о́коло + он]{.ru}'
    - '[о́коло него́]{.ru}'
  - base: '[напро́тив + она́]{.ru}'
    cells:
    - '[напро́тив + она́]{.ru}'
    - '[напро́тив неё]{.ru}'
  - base: '[без + они́]{.ru}'
    cells:
    - '[без + они́]{.ru}'
    - '[без них]{.ru}'
  - base: '[по́сле + он]{.ru}'
    cells:
    - '[по́сле + он]{.ru}'
    - '[по́сле него́]{.ru}'
  - base: '[у + я]{.ru}'
    cells:
    - '[у + я]{.ru}'
    - '[у меня́]{.ru}'
  - base: '[без + ты]{.ru}'
    cells:
    - '[без + ты]{.ru}'
    - '[без тебя́]{.ru}'
  - base: '[до + она́]{.ru}'
    cells:
    - '[до + она́]{.ru}'
    - '[до неё]{.ru}'
  - base: '[о́коло + мы]{.ru}'
    cells:
    - '[о́коло + мы]{.ru}'
    - '[о́коло нас]{.ru}'
  - base: '[напро́тив + вы]{.ru}'
    cells:
    - '[напро́тив + вы]{.ru}'
    - '[напро́тив вас]{.ru}'
  - base: '[по́сле + они́]{.ru}'
    cells:
    - '[по́сле + они́]{.ru}'
    - '[по́сле них]{.ru}'
  - base: '[без + я]{.ru}'
    cells:
    - '[без + я]{.ru}'
    - '[без меня́]{.ru}'
  - base: '[у + она́]{.ru}'
    cells:
    - '[у + она́]{.ru}'
    - '[у неё]{.ru}'
  why: '第 1–4、7、10、12 题：第三人称在前置词后面加 [н-]{.ru}：[о́коло него́, напро́тив неё, без них]{.ru}。

    第 5、6、8、9、11 题：[меня́, тебя́, нас, вас]{.ru} 不变。'
- id: L37-04
  tags:
  - 第二格前置词：句中
  task: 用括号里词的第二格填空。
  type: fill
  items:
  - stem: Наш дом напро́тив ___.
    hint: большо́й парк
    accept:
    - большо́го па́рка
  - stem: Апте́ка о́коло ___.
    hint: на́ша шко́ла
    accept:
    - на́шей шко́лы
  - stem: По́сле ___ Ми́ша игра́ет в футбо́л.
    hint: шко́ла
    accept:
    - шко́лы
  - stem: Мы гуля́ем до ___.
    hint: обе́д
    accept:
    - обе́да
  - stem: Я пью чай без ___.
    hint: са́хар
    accept:
    - са́хара
  - stem: Ка́тя ждёт у ___.
    hint: подъе́зд
    accept:
    - подъе́зда
  - stem: По́сле ___ мы идём в парк.
    hint: ле́кция
    accept:
    - ле́кции
  - stem: До ___ пять мину́т.
    hint: ста́нция
    accept:
    - ста́нции
  - stem: Ве́чером мы обе́даем у ___.
    hint: ба́бушка
    accept:
    - ба́бушки
  - stem: Он не мо́жет жить без ___.
    hint: му́зыка
    accept:
    - му́зыки
  - stem: Магази́н о́коло ___.
    hint: он
    accept:
    - него́
  - stem: Мы не идём на конце́рт без ___.
    hint: ты
    accept:
    - тебя́
  - stem: Стадио́н напро́тив ___.
    hint: на́ше общежи́тие
    accept:
    - на́шего общежи́тия
  - stem: Я сижу́ у ___.
    hint: окно́
    accept:
    - окна́
  why: '第 1、2、13 题：修饰语随名词变：[большо́го па́рка, на́шей шко́лы, на́шего общежи́тия]{.ru}。第 13 题 [-ие]{.ru} 结尾的中性名词第二格是 [-ия]{.ru}。

    第 3–10、14 题：[-а]{.ru} 改 [-ы / -и]{.ru}，阳性和中性加 [-а]{.ru}，[-ия]{.ru} 改 [-ии]{.ru}：[без са́хара, по́сле ле́кции, у окна́]{.ru}。

    第 11、12 题：第三人称代词加 [н-]{.ru}：[о́коло него́]{.ru}；[без тебя́]{.ru}。'
