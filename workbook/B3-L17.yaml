  why: |-
    第 1–14 题：被动句的主语变成第四格宾语，谓语用复数第三人称，不加 [они́]{.ru}；第五格的发出者（第 12 题的 [меда́лью]{.ru} 是工具，不是发出者，照留）不会出现在不定人称句里。
    第 1、5、8、10、14、16、19 题：动物名词第四格同第二格：[тури́стов, моего́ бра́та, дете́й, студе́нта, ученико́в, его́ отца́]{.ru}；阴性用 [-у]{.ru}：[кни́гу, э́ту пробле́му, его́ сестру́, но́вую шко́лу, учи́тельницу, ру́чку, ле́кцию]{.ru}。非动物的阳性、中性和复数同第一格：[мост, письмо́, ле́кции, зда́ние, ру́сские сувени́ры, э́ти пе́сни, наш го́род, э́тот вопро́с, э́тот рома́н, все пи́сьма]{.ru}。
    第 1–3、5、7、8、12、14、15、17、19、21、23 题：短尾过去时 → 完成体过去时复数：[пригласи́ли, постро́или, изда́ли, отпра́вили, ра́нили, награди́ли, при́няли, написа́ли, нашли́, похорони́ли, перевели́, отмени́ли]{.ru}。第 6、10、16、22 题：将来时 → 完成体将来时复数第三人称：[откро́ют, отпра́вят, при́мут, прове́рят]{.ru}。
    第 4、9、11、13、18、20 题：[-ся]{.ru} 动词 → 未完成体，时间不变：现在 [обсужда́ют, чита́ют, продаю́т, называ́ют, задаю́т]{.ru}，过去 [стро́или]{.ru}。
- id: B3-L17-02
  lessons:
  - B3-L17
  tags:
  - 三种无主语句的对照
  - 不定人称句：不加 они́
  task: 这是哪一种句子？归栏。
  type: classify
  bins:
  - 不定人称句
  - 泛指人称句
  - 无人称句
  - 有主语的人称句
  items:
  - text: '[Говоря́т, за́втра бу́дет снег.]{.ru}'
    answer: 不定人称句
  - text: '[Они́ говоря́т, что за́втра бу́дет снег.]{.ru}'
    answer: 有主语的人称句
  - text: '[Без труда́ не вы́тащишь и ры́бку из пруда́.]{.ru}'
    answer: 泛指人称句
    new: true
    gloss: 谚语：不劳无获
  - text: '[Мне не спи́тся.]{.ru}'
    answer: 无人称句
  - text: '[В газе́тах писа́ли об э́том.]{.ru}'
    answer: 不定人称句
  - text: '[Ве́чером ста́ло хо́лодно.]{.ru}'
    answer: 无人称句
  - text: '[Тако́е не забу́дешь никогда́.]{.ru}'
    answer: 泛指人称句
  - text: '[Тури́сты прие́хали в Му́рманск.]{.ru}'
    answer: 有主语的人称句
  - text: '[В дверь постуча́ли.]{.ru}'
    answer: 不定人称句
  - text: '[Нам пришло́сь до́лго ждать.]{.ru}'
    answer: 无人称句
  - text: '[Век живи́ — век учи́сь.]{.ru}'
    answer: 泛指人称句
  - text: '[Мы ча́сто вспомина́ем Байка́л.]{.ru}'
    answer: 有主语的人称句
  - text: '[На у́лице темне́ет.]{.ru}'
    answer: 无人称句
  - text: '[Его́ назва́ли в честь де́да.]{.ru}'
    answer: 不定人称句
  - text: '[Ти́ше е́дешь — да́льше бу́дешь.]{.ru}'
    answer: 泛指人称句
  - text: '[Ему́ ну́жно отдохну́ть.]{.ru}'
    answer: 无人称句
  - text: '[Ва́ше письмо́ получи́ли.]{.ru}'
    answer: 不定人称句
  - text: '[Мой брат рабо́тает в Му́рманске.]{.ru}'
    answer: 有主语的人称句
  why: |-
    第 1、5、9、14、17 题：不定人称句：谓语复数第三人称（过去时复数），没有主语，做事的人不确定：[говоря́т, писа́ли, постуча́ли, назва́ли, получи́ли]{.ru}。
    第 2 题：有 [они́]{.ru}，指确定的人，是人称句；第 8、12、18 题也有主语。
    第 3、7、11、15 题：泛指人称句：谓语用第二人称单数（或命令式），说的是对任何人都适用的经验，多见于谚语。
    第 4、6、10、13、16 题：无人称句：谓语是单数第三人称、过去时中性或状态词，没有也不能有第一格主语；主体用第三格（[мне, нам, ему́]{.ru}）。
- id: B3-L17-03
  lessons:
  - B3-L17
  tags:
  - 不定人称句与副动词
  - 泛指人称句与副动词
  task: 这些带副动词的句子能不能成立？归栏。
  type: classify
  bins:
  - 能成立
  - 不能成立
  items:
  - text: '[Прие́хав в Му́рманск, тури́стов везу́т за го́род.]{.ru}'
    answer: 不能成立
  - text: '[Сто́я на берегу́, чу́вствуешь себя́ на краю́ земли́.]{.ru}'
    answer: 能成立
  - text: '[Возвраща́ясь домо́й, его́ останови́ли на у́лице.]{.ru}'
    answer: 不能成立
  - text: '[Чита́я таки́е кни́ги, мно́гое понима́ешь.]{.ru}'
    answer: 能成立
  - text: '[Войдя́ в ко́мнату, мне ста́ло жа́рко.]{.ru}'
    answer: 不能成立
  - text: '[Гуля́я по ле́су, мо́жно уви́деть оле́ня.]{.ru}'
    answer: 能成立
  - text: '[Прочита́в письмо́, его́ сра́зу отпра́вили бра́ту.]{.ru}'
    answer: 不能成立
  - text: '[Вы́йдя на у́лицу, сра́зу замерза́ешь.]{.ru}'
    answer: 能成立
  - text: '[Ду́мая о до́ме, начина́ешь скуча́ть.]{.ru}'
    answer: 能成立
  - text: '[Прочита́в объявле́ние, нас пригласи́ли на собра́ние.]{.ru}'
    answer: 不能成立
  - text: '[Слу́шая э́ту пе́сню, вспомина́ешь де́тство.]{.ru}'
    answer: 能成立
  - text: '[Уви́дев нас, две́ри закры́ли.]{.ru}'
    answer: 不能成立
  - text: '[Возвраща́ясь домо́й, всегда́ ду́маешь о рабо́те.]{.ru}'
    answer: 能成立
  - text: '[Услы́шав э́ту но́вость, нам ста́ло ве́село.]{.ru}'
    answer: 不能成立
  why: |-
    第 2、4、8、9、11、13 题：泛指人称句可以带副动词，副动词的动作和谓语都属于那个泛指的人。
    第 6 题：无人称句里副动词和不定式连用（[мо́жно уви́деть]{.ru}），成立。
    第 1、3、7、10、12 题：不定人称句没有主语，一般不带副动词；“到达、回家、读信”的和“带、拦、寄”的不是同一个人。改法：[Когда́ тури́сты приезжа́ют в Му́рманск, их везу́т за го́род]{.ru}。
    第 5、14 题：无人称句里没有不定式，不能用副动词：[Когда́ я вошёл в ко́мнату, мне ста́ло жа́рко]{.ru}。
