heading: 第 23 课　外来词的性与变格
groups:
- id: B3-L23-01
  lessons:
  - B3-L23
  tags:
  - 外来词：辅音与 -а 结尾名词的性
  - 外来词：不变格名词的性
  task: 按性和变不变格把外来词归栏。
  type: classify
  bins:
  - 阳性，变格
  - 阴性，变格
  - 中性，不变格
  - 阳性，不变格
  - 阴性，不变格
  items:
  - text: '[компью́тер]{.ru}'
    answer: 阳性，变格
  - text: '[пальто́]{.ru}'
    answer: 中性，不变格
  - text: '[кенгуру́]{.ru}'
    answer: 阳性，不变格
  - text: '[пи́цца]{.ru}'
    answer: 阴性，变格
  - text: '[ле́ди]{.ru}'
    answer: 阴性，不变格
  - text: '[футбо́л]{.ru}'
    answer: 阳性，变格
  - text: '[кафе́]{.ru}'
    answer: 中性，不变格
  - text: '[ко́фе]{.ru}'
    answer: 阳性，不变格
  - text: '[фра́за]{.ru}'
    answer: 阴性，变格
  - text: '[Миссиси́пи]{.ru}'
    answer: 阴性，不变格
    hint: 河名
  - text: '[би́знес]{.ru}'
    answer: 阳性，变格
  - text: '[шоссе́]{.ru}'
    answer: 中性，不变格
  - text: '[атташе́]{.ru}'
    answer: 阳性，不变格
    hint: 指男子
  - text: '[га́вань]{.ru}'
    answer: 阴性，变格
    hint: f
  - text: '[такси́]{.ru}'
    answer: 中性，不变格
  - text: '[штаб]{.ru}'
    answer: 阳性，变格
  - text: '[Со́чи]{.ru}'
    answer: 阳性，不变格
    hint: 城市名
  - text: '[меню́]{.ru}'
    answer: 中性，不变格
  - text: '[маши́на]{.ru}'
    answer: 阴性，变格
  - text: '[Хуанхэ́]{.ru}'
    answer: 阴性，不变格
    new: true
    gloss: 黄河
  - text: '[интервью́]{.ru}'
    answer: 中性，不变格
  - text: '[шимпанзе́]{.ru}'
    answer: 阳性，不变格
    new: true
    gloss: 黑猩猩
  - text: '[ра́дио]{.ru}'
    answer: 中性，不变格
  - text: '[фра́у]{.ru}'
    answer: 阴性，不变格
    new: true
    gloss: 夫人（德国女子的称呼）
  why: |-
    第 1、6、11、16 题：以辅音结尾的外来词是阳性，像 [стол]{.ru} 一样变格：[компью́тера, о футбо́ле, в шта́бе]{.ru}。
    第 4、9、14、19 题：以 [-а]{.ru} 结尾的是阴性，正常变格：[без пи́ццы, э́той фра́зой, в маши́не]{.ru}；以 [-ь]{.ru} 结尾的性要逐个记，[га́вань]{.ru} 是阴性：[в га́вани]{.ru}。
    第 2、7、12、15、18、21、23 题：以 [-о, -е, -и, -у, -ю]{.ru} 结尾的外来词不变格；表示物品、概念的是中性：[но́вое пальто́, ую́тное кафе́, широ́кое шоссе́, интере́сное интервью́]{.ru}。
    第 3、22 题：表示动物的不变格名词是阳性：[смешно́й кенгуру́, ста́рый шимпанзе́]{.ru}。
    第 8 题：[ко́фе]{.ru} 是例外，按规范是阳性：[чёрный ко́фе]{.ru}。
    第 13 题：指人的按自然性别：[молодо́й атташе́]{.ru}（男）。
    第 17 题：地名按类名定性：[Со́чи]{.ru} 是城市（[го́род]{.ru}），阳性：[со́лнечный Со́чи]{.ru}。
    第 5、24 题：指女子的不变格名词是阴性：[англи́йская ле́ди, ми́лая фра́у]{.ru}。
    第 10、20 题：河名按 [река́]{.ru} 定性，是阴性：[широ́кая Миссиси́пи, жёлтая Хуанхэ́]{.ru}。
- id: B3-L23-02
  lessons:
  - B3-L23
  tags:
  - 外来词：与形容词连用的第六格
  task: 写出词组的第六格。
  type: matrix
  cols:
  - 词组
  - 第六格
  given:
  - 0
  rows:
  - base: '[ста́рый компью́тер]{.ru}'
    cells:
    - '[ста́рый компью́тер]{.ru}'
    - '[в ста́ром компью́тере]{.ru}'
  - base: '[но́вое пальто́]{.ru}'
    cells:
    - '[но́вое пальто́]{.ru}'
    - '[в но́вом пальто́]{.ru}'
  - base: '[смешно́й кенгуру́]{.ru}'
    cells:
    - '[смешно́й кенгуру́]{.ru}'
    - '[о смешно́м кенгуру́]{.ru}'
  - base: '[ую́тное кафе́]{.ru}'
    cells:
    - '[ую́тное кафе́]{.ru}'
    - '[в ую́тном кафе́]{.ru}'
  - base: '[вку́сная пи́цца]{.ru}'
    cells:
    - '[вку́сная пи́цца]{.ru}'
    - '[о вку́сной пи́цце]{.ru}'
  - base: '[горя́чий ко́фе]{.ru}'
    cells:
    - '[горя́чий ко́фе]{.ru}'
    - '[о горя́чем ко́фе]{.ru}'
  - base: '[широ́кое шоссе́]{.ru}'
    cells:
    - '[широ́кое шоссе́]{.ru}'
    - '[на широ́ком шоссе́]{.ru}'
  - base: '[со́лнечный Со́чи]{.ru}'
    cells:
    - '[со́лнечный Со́чи]{.ru}'
    - '[в со́лнечном Со́чи]{.ru}'
  - base: '[моско́вское метро́]{.ru}'
    cells:
    - '[моско́вское метро́]{.ru}'
    - '[в моско́вском метро́]{.ru}'
  - base: '[большо́й би́знес]{.ru}'
    cells:
    - '[большо́й би́знес]{.ru}'
    - '[в большо́м би́знесе]{.ru}'
  - base: '[ти́хая га́вань]{.ru}'
    cells:
    - '[ти́хая га́вань]{.ru}'
    - '[в ти́хой га́вани]{.ru}'
  - base: '[молодо́й атташе́]{.ru}'
    cells:
    - '[молодо́й атташе́]{.ru}'
    - '[о молодо́м атташе́]{.ru}'
  - base: '[широ́кая Миссиси́пи]{.ru}'
    cells:
    - '[широ́кая Миссиси́пи]{.ru}'
    - '[на широ́кой Миссиси́пи]{.ru}'
  - base: '[но́вое меню́]{.ru}'
    cells:
    - '[но́вое меню́]{.ru}'
    - '[в но́вом меню́]{.ru}'
  why: |-
    第 1、5、10、11 题：能变格的外来词和形容词一起变：[в ста́ром компью́тере, о вку́сной пи́цце, в большо́м би́знесе, в ти́хой га́вани]{.ru}（[га́вань]{.ru} 是阴性，第六格 [-и]{.ru}）。
    第 2、4、7、9、14 题：不变格的物品名词是中性，只有形容词变成中性第六格 [-ом]{.ru}：[в но́вом пальто́, в ую́тном кафе́]{.ru}。名词本身不能加词尾，不写 [в пальте́]{.ru}、[в метре́]{.ru}。
    第 3、6、12 题：[кенгуру́]{.ru}、[ко́фе]{.ru}、[атташе́]{.ru} 是阳性，形容词也用 [-ом]{.ru}：[о смешно́м кенгуру́, о горя́чем ко́фе, о молодо́м атташе́]{.ru}；形式和中性相同，但第一格、过去时要用阳性。
    第 8 题：[Со́чи]{.ru} 按 [го́род]{.ru} 是阳性：[в со́лнечном Со́чи]{.ru}。
    第 13 题：[Миссиси́пи]{.ru} 按 [река́]{.ru} 是阴性，形容词用阴性第六格：[на широ́кой Миссиси́пи]{.ru}。
- id: B3-L23-03
  lessons:
