    - '[без горя́чей пи́ццы]{.ru}'
  - base: '[к + ти́хая га́вань]{.ru}'
    cells:
    - '[к + ти́хая га́вань]{.ru}'
    - '[к ти́хой га́вани]{.ru}'
  - base: '[из + со́лнечный Со́чи]{.ru}'
    cells:
    - '[из + со́лнечный Со́чи]{.ru}'
    - '[из со́лнечного Со́чи]{.ru}'
  - base: '[от + ми́лая ле́ди]{.ru}'
    cells:
    - '[от + ми́лая ле́ди]{.ru}'
    - '[от ми́лой ле́ди]{.ru}'
  - base: '[по + широ́кое шоссе́]{.ru}'
    cells:
    - '[по + широ́кое шоссе́]{.ru}'
    - '[по широ́кому шоссе́]{.ru}'
  - base: '[к + смешно́й кенгуру́]{.ru}'
    cells:
    - '[к + смешно́й кенгуру́]{.ru}'
    - '[к смешно́му кенгуру́]{.ru}'
  - base: '[для + ру́сский би́знес]{.ru}'
    cells:
    - '[для + ру́сский би́знес]{.ru}'
    - '[для ру́сского би́знеса]{.ru}'
  why: |-
    第 1、7、10、13 题：阳性的不变格名词，形容词用阳性词尾：[без чёрного ко́фе, пе́ред молоды́м атташе́, из со́лнечного Со́чи, к смешно́му кенгуру́]{.ru}；名词不变。
    第 2–5、12 题：中性不变格名词前的形容词用中性词尾：[к но́вому такси́, у ую́тного кафе́, из ста́рого пальто́, для ва́шего интервью́, по широ́кому шоссе́]{.ru}。
    第 11 题：[ле́ди]{.ru} 是阴性：[от ми́лой ле́ди]{.ru}。
    第 6、8、9、14 题：能变格的外来词正常变格：[пе́ред ста́рым компью́тером, без горя́чей пи́ццы, к ти́хой га́вани, для ру́сского би́знеса]{.ru}。
- id: B3-L23-04
  lessons:
  - B3-L23
  tags:
  - 外来词：不变格名词与谓语的一致
  task: 用括号里的主语和动词写出过去时谓语。
  type: matrix
  cols:
  - 主语 + 动词
  - 过去时谓语
  given:
  - 0
  rows:
  - base: '[такси́ + прие́хать]{.ru}'
    cells:
    - '[такси́ + прие́хать]{.ru}'
    - '[прие́хало]{.ru}'
  - base: '[два такси́ + стоя́ть у до́ма]{.ru}'
    cells:
    - '[два такси́ + стоя́ть у до́ма]{.ru}'
    - '[стоя́ли / стоя́ло]{.ru}'
  - base: '[ко́фе + быть горя́чий]{.ru}'
    cells:
    - '[ко́фе + быть горя́чий]{.ru}'
    - '[был горя́чий]{.ru}'
  - base: '[кенгуру́ + убежа́ть]{.ru}'
    cells:
    - '[кенгуру́ + убежа́ть]{.ru}'
    - '[убежа́л]{.ru}'
  - base: '[Со́чи + понра́виться]{.ru}'
    cells:
    - '[Со́чи + понра́виться]{.ru}'
    - '[понра́вился]{.ru}'
  - base: '[ле́ди + улыбну́ться]{.ru}'
    cells:
    - '[ле́ди + улыбну́ться]{.ru}'
    - '[улыбну́лась]{.ru}'
  - base: '[атташе́ + позвони́ть]{.ru}'
    cells:
    - '[атташе́ + позвони́ть]{.ru}'
    - '[позвони́л]{.ru}'
  - base: '[кафе́ + закры́ться]{.ru}'
    cells:
    - '[кафе́ + закры́ться]{.ru}'
    - '[закры́лось]{.ru}'
  - base: '[меню́ + лежа́ть на столе́]{.ru}'
    cells:
    - '[меню́ + лежа́ть на столе́]{.ru}'
    - '[лежа́ло]{.ru}'
  - base: '[интервью́ + понра́виться]{.ru}'
    cells:
    - '[интервью́ + понра́виться]{.ru}'
    - '[понра́вилось]{.ru}'
  - base: '[Миссиси́пи + быть широ́кий]{.ru}'
    cells:
    - '[Миссиси́пи + быть широ́кий]{.ru}'
    - '[была́ широ́кая]{.ru}'
  - base: '[пальто́ + быть но́вый]{.ru}'
    cells:
    - '[пальто́ + быть но́вый]{.ru}'
    - '[бы́ло но́вое]{.ru}'
  - base: '[ра́дио + рабо́тать]{.ru}'
    cells:
    - '[ра́дио + рабо́тать]{.ru}'
    - '[рабо́тало]{.ru}'
  - base: '[шимпанзе́ + съесть я́блоко]{.ru}'
    cells:
    - '[шимпанзе́ + съесть я́блоко]{.ru}'
    - '[съел]{.ru}'
  why: |-
    第 1、8、9、10、12、13 题：表示物品的不变格名词是中性，过去时用 [-о]{.ru}：[прие́хало, закры́лось, лежа́ло, понра́вилось, бы́ло но́вое, рабо́тало]{.ru}。
    第 2 题：数从修饰语看：[два такси́]{.ru} 是复数，谓语用 [стоя́ли]{.ru}（和数词连用时也可以说 [стоя́ло]{.ru}）。
    第 3 题：[ко́фе]{.ru} 是阳性：[был горя́чий]{.ru}，不说 [бы́ло горя́чее]{.ru}（口语里有，但不合规范）。
    第 4、14 题：动物名词是阳性：[кенгуру́ убежа́л, шимпанзе́ съел]{.ru}。
    第 5 题：[Со́чи]{.ru} 是城市，阳性：[понра́вился]{.ru}。
    第 6、7 题：指人的按自然性别：[ле́ди улыбну́лась, атташе́ позвони́л]{.ru}。
    第 11 题：[Миссиси́пи]{.ru} 是河，阴性：[была́ широ́кая]{.ru}。
- id: B3-L23-05
  lessons:
  - B3-L23
  tags:
  - 外来词：句中形容词与不变格名词的一致
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Ю́ми не лю́бит ___ ко́фе.
    hint: чёрный
    accept:
    - чёрный
  - stem: Мы сиде́ли в ___ кафе́ на углу́.
    hint: ма́ленький
    accept:
    - ма́леньком
  - stem: К до́му подъе́хало ___ такси́.
    hint: бе́лый
    accept:
    - бе́лое
  - stem: Ди́ма купи́л себе́ ___ пальто́.
    hint: тёплый
    accept:
    - тёплое
  - stem: В Австра́лии мы ви́дели ___ кенгуру́.
    hint: смешно́й
    accept:
    - смешно́го
  - stem: Сего́дня в газе́те бы́ло ___ интервью́.
    hint: интере́сный
    accept:
    - интере́сное
  - stem: Там стоя́л ___ атташе́ из Фра́нции.
    hint: молодо́й
    accept:
    - молодо́й
  - stem: Официа́нт принёс нам ___ меню́.
    hint: но́вый
    accept:
    - но́вое
  - stem: Я давно́ мечта́ю отдохну́ть в ___ Со́чи.
    hint: со́лнечный
    accept:
    - со́лнечном
  - stem: Ле́том ___ Миссиси́пи о́чень широ́кая.
    hint: могу́чий
    accept:
    - могу́чая
    new: true
    gloss: 强大的，雄伟的
  - stem: Пьер вы́пил ча́шку ___ ко́фе.
    hint: горя́чий
    accept:
    - горя́чего
  - stem: По ___ шоссе́ е́хали маши́ны.
    hint: широ́кий
    accept:
    - широ́кому
  - stem: Ба́бушка всегда́ слу́шает ___ ра́дио.
    hint: ста́рый
    accept:
    - ста́рое
  - stem: Э́та ___ ле́ди живёт в Ло́ндоне.
    hint: пожило́й
    accept:
    - пожила́я
  why: |-
    第 1、7、11 题：[ко́фе]{.ru} 和指男子的 [атташе́]{.ru} 是阳性：[чёрный ко́фе]{.ru}（第四格同第一格），[молодо́й атташе́]{.ru}，[ча́шку горя́чего ко́фе]{.ru}（第二格）。
    第 5 题：动物名词是阳性，作宾语时第四格同第二格：[ви́дели смешно́го кенгуру́]{.ru}。
    第 2–4、6、8、12、13 题：物品是中性，形容词按中性变：[в ма́леньком кафе́, бе́лое такси́, тёплое пальто́, интере́сное интервью́, но́вое меню́, по широ́кому шоссе́, ста́рое ра́дио]{.ru}。
    第 9 题：[Со́чи]{.ru} 是城市，阳性第六格：[в со́лнечном Со́чи]{.ru}。
    第 10 题：[Миссиси́пи]{.ru} 是河，阴性：[могу́чая Миссиси́пи]{.ru}。
    第 14 题：[ле́ди]{.ru} 是阴性：[пожила́я ле́ди]{.ru}。
