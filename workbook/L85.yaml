  why: '现在时和将来时只看单复数：单数 [боли́т, бу́дет боле́ть]{.ru}，复数（第 2、5、8、10、16 题）[боля́т, бу́дут боле́ть]{.ru}。

    过去时还要看性：阳性 [живо́т, глаз, нос, зуб]{.ru}（第 4、13、14、15 题）用 [боле́л]{.ru}；阴性 [голова́, нога́, рука́, спина́, ше́я]{.ru}（第 1、7、9、11、18 题）用 [боле́ла]{.ru}；中性 [го́рло, у́хо, се́рдце, плечо́]{.ru}（第 3、6、12、17 题）用 [боле́ло]{.ru}；复数用 [боле́ли]{.ru}。

    易错点：[у́ши, глаза́]{.ru} 是复数，不能用 [боли́т]{.ru}；[у́хо, се́рдце]{.ru} 是中性，过去时不是 [боле́ла]{.ru}。'
- id: L85-02
  tags:
  - у кого́ боли́т：感受者 у + 第二格
