  why: '第 1–7 题：人称代词第二格，第三人称在 [у]{.ru} 后加 [н-]{.ru}：[у него́, у неё, у них]{.ru}。

    第 8–10、12、14、16 题：[-а / -я]{.ru} 结尾的名词第二格 [-ы / -и]{.ru}，[ш, к]{.ru} 后写 [и]{.ru}：[у Ми́ши, у ба́бушки]{.ru}；[сестра́]{.ru} 第二格重音在词尾：[у сестры́]{.ru}。名和父称都要变：[у О́льги Ви́кторовны, у Ива́на Серге́евича]{.ru}。

    第 11、13、15、19、20 题：阳性加 [-а / -я]{.ru}：[у Ван Лэ́я, у бра́та, у Пье́ра, у дру́га, у учи́теля]{.ru}。第 18 题 [Ю́ми]{.ru} 不变格。

    汉语“我头疼”的“我”在俄语里不作主语，要说 [у меня́ боли́т голова́]{.ru}。'
- id: L85-03
  tags:
  - 两个 боле́ть：意义辨别
  task: 看主语是人还是身体部位，判断句中是哪一个 [боле́ть]{.ru}。
  type: classify
  bins:
  - '[боле́ть]{.ru} I：生病'
  - '[боле́ть]{.ru} II：疼'
  items:
  - text: Ван Лэй боле́ет.
    answer: '[боле́ть]{.ru} I：生病'
  - text: У него́ боли́т голова́.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Вчера́ у меня́ боле́ла голова́.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Вчера́ А́нна боле́ла.
    answer: '[боле́ть]{.ru} I：生病'
  - text: Вы давно́ боле́ете?
    answer: '[боле́ть]{.ru} I：生病'
  - text: Ба́бушка ча́сто боле́ет зимо́й.
    answer: '[боле́ть]{.ru} I：生病'
  - text: У Ми́ши боле́ло го́рло.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Ми́ша боле́л неде́лю.
    answer: '[боле́ть]{.ru} I：生病'
  - text: У меня́ боля́т у́ши.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Мы ре́дко боле́ем.
    answer: '[боле́ть]{.ru} I：生病'
  - text: У па́пы боле́ла спина́.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Де́ти боле́ли две неде́ли.
    answer: '[боле́ть]{.ru} I：生病'
  - text: Что у вас боли́т?
    answer: '[боле́ть]{.ru} II：疼'
  - text: У ба́бушки боле́ли но́ги.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Я не люблю́ боле́ть.
    answer: '[боле́ть]{.ru} I：生病'
  - text: Когда́ Пьер боле́л, мы ему́ звони́ли.
    answer: '[боле́ть]{.ru} I：生病'
  - text: Вчера́ у Ю́ми боле́ли глаза́.
    answer: '[боле́ть]{.ru} II：疼'
  - text: Ты ещё боле́ешь?
    answer: '[боле́ть]{.ru} I：生病'
  why: '第 1、4、5、6、8、10、12、15、16、18 题：主语是人，是第一变位的 [боле́ть]{.ru}“生病”：[боле́ю, боле́ешь, боле́ет]{.ru}。

    第 2、3、7、9、11、13、14、17 题：主语是身体部位（第 13 题是 [что]{.ru}），人用 [у]{.ru} + 第二格，是第二变位的 [боле́ть]{.ru}“疼”：[боли́т, боля́т]{.ru}。

    第 3、4、7、8 等题：过去时两个动词形式相同（[боле́ла, боле́л]{.ru}），只能看主语：[А́нна боле́ла]{.ru} 是安娜病了，[у меня́ боле́ла голова́]{.ru} 是头疼。'
- id: L85-04
  tags:
