  task: 按时间和主语写出 [боле́ть]{.ru} 的正确形式（“生病”或“疼”）。
  type: fill
  items:
  - stem: Вчера́ у меня́ ___ голова́.
    hint: боле́ть
    accept:
    - боле́ла
  - stem: Сейча́с у Ми́ши ___ у́ши.
    hint: боле́ть
