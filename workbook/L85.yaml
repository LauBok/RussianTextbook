  why: '第 5、10、12、17、18 题：主语是人，“生病”按第一变位：[боле́ю, боле́ешь, боле́ет, боле́ете, боле́ют]{.ru}。第 6、7、14 题过去时与主语性别一致：[А́нна боле́ла, Ми́ша боле́л]{.ru}。

    第 2、8、13、16 题：现在时“疼”只有两个形式：单数 [боли́т]{.ru}，复数 [у́ши]{.ru} 用 [боля́т]{.ru}。

    第 1、3、9、11、15 题：过去时“疼”跟身体部位的性数一致：[голова́ боле́ла, го́рло боле́ло, глаз боле́л, но́ги / глаза́ боле́ли]{.ru}。

    第 4 题：将来时 [бу́дут боле́ть]{.ru}，[глаза́]{.ru} 是复数。'
