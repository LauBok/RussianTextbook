    - боля́т
  - stem: Вчера́ у Ми́ши ___ го́рло.
    hint: боле́ть
    accept:
    - боле́ло
  - stem: Е́сли ты бу́дешь мно́го чита́ть, у тебя́ ___ глаза́.
    hint: боле́ть
    accept:
    - бу́дут боле́ть
  - stem: Ван Лэй ___ уже́ неде́лю.
    hint: боле́ть
    accept:
    - боле́ет
  - stem: Вчера́ А́нна ___.
    hint: боле́ть
    accept:
