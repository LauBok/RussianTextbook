  - stem: Сейча́с у па́пы ___ спина́.
    hint: боле́ть
    accept:
    - боли́т
  - stem: Вчера́ у ба́бушки ___ но́ги.
    hint: боле́ть
    accept:
    - боле́ли
  - stem: Вы ча́сто ___?
    hint: боле́ть
    accept:
    - боле́ете
  - stem: Вчера́ у меня́ ___ глаз.
    hint: боле́ть
    accept:
    - боле́л
  - stem: Зимо́й де́ти ча́сто ___.
    hint: боле́ть
    accept:
    - боле́ют
  - stem: Что у вас ___?
    hint: боле́ть
    accept:
    - боли́т
  - stem: Когда́ Ю́ми ___, она́ лежа́ла в посте́ли.
    hint: боле́ть
    accept:
    - боле́ла
  - stem: Вчера́ у меня́ ___ глаза́.
    hint: боле́ть
    accept:
    - боле́ли
  - stem: Сейча́с у ба́бушки ___ се́рдце.
    hint: боле́ть
