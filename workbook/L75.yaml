heading: 第 75 课　指路
groups:
- id: L75-01
  tags:
  - 指路：方位副词（куда / где）
  task: 按中文提示填上方位副词。
  type: fill
  items:
  - stem: Поверни́те ___.
    hint: 向右
    accept:
    - напра́во
  - stem: Апте́ка бу́дет ___.
    hint: 在左边
    accept:
    - сле́ва
  - stem: Иди́те ___ до светофо́ра.
    hint: 一直往前
    accept:
    - пря́мо
  - stem: Торго́вый центр бу́дет ___.
    hint: 在右边
    accept:
    - спра́ва
  - stem: На углу́ поверни́те ___.
    hint: 向左
    accept:
    - нале́во
  - stem: Метро́ ___, пять мину́т пешко́м.
    hint: 不远
    accept:
    - недалеко́
  - stem: Иди́те ___, вы прошли́ ми́мо апте́ки.
    hint: 往回
    accept:
    - наза́д
  - stem: Вот по́чта, а ___ от неё кафе́.
    hint: 在左边
    accept:
    - сле́ва
  - stem: Ми́ша идёт ___, за на́ми.
    hint: 在后面
    accept:
    - сза́ди
  - stem: Кафе́ ___ с метро́.
    hint: 旁边
    accept:
    - ря́дом
  - stem: Вокза́л ___, на́до е́хать на метро́.
    hint: 远
    accept:
    - далеко́
  - stem: Поезжа́йте ___ до пло́щади.
    hint: 一直往前
    accept:
    - пря́мо
  - stem: У светофо́ра поверни́те ___.
    hint: 向右
    accept:
    - напра́во
  - stem: Шко́ла ___ от до́ма.
    hint: 近
    accept:
    - бли́зко
  why: |
    第 1、5、7、13 题：和运动动词（[поверни́те, иди́те]{.ru}）连用、表示往哪个方向，用 [напра́во, нале́во, наза́д]{.ru}。把“往右拐”说成 [поверни́те спра́ва]{.ru} 是常见错误。
    第 3、12 题：“一直往前”用 [пря́мо]{.ru}。
    第 2、4、8 题：说东西在哪儿，用 [спра́ва, сле́ва]{.ru}。
    第 9 题：“在后面”是 [сза́ди]{.ru}；[наза́д]{.ru} 是“往回”，表示方向。
    第 10 题：[ря́дом с]{.ru} + 第五格：[ря́дом с метро́]{.ru}。
    第 6、11、14 题：[недалеко́, далеко́, бли́зко]{.ru} 表示远近，可以加 [от]{.ru} + 第二格。
- id: L75-02
  tags:
  - 运动动词命令式
  task: 写出运动动词对 [ты]{.ru} 和对 [вы]{.ru} 的命令式。
  type: matrix
  cols:
  - 不定式
  - 对 [ты]{.ru}
  - 对 [вы]{.ru}
  given:
  - 0
  rows:
  - base: '[идти́]{.ru}'
    cells:
    - '[идти́]{.ru}'
    - '[иди́]{.ru}'
    - '[иди́те]{.ru}'
  - base: '[пройти́]{.ru}'
    cells:
    - '[пройти́]{.ru}'
    - '[пройди́]{.ru}'
    - '[пройди́те]{.ru}'
  - base: '[пойти́]{.ru}'
    cells:
    - '[пойти́]{.ru}'
    - '[пойди́]{.ru}'
    - '[пойди́те]{.ru}'
  - base: '[ходи́ть]{.ru}'
    cells:
    - '[ходи́ть]{.ru}'
    - '[ходи́]{.ru}'
    - '[ходи́те]{.ru}'
  - base: '[е́хать]{.ru}'
    cells:
    - '[е́хать]{.ru}'
    - '[поезжа́й]{.ru}'
    - '[поезжа́йте]{.ru}'
  - base: '[пое́хать]{.ru}'
    cells:
    - '[пое́хать]{.ru}'
    - '[поезжа́й]{.ru}'
    - '[поезжа́йте]{.ru}'
  - base: '[е́здить]{.ru}'
    cells:
    - '[е́здить]{.ru}'
    - '[е́зди]{.ru}'
    - '[е́здите]{.ru}'
  - base: '[поверну́ть]{.ru}'
    cells:
    - '[поверну́ть]{.ru}'
    - '[поверни́]{.ru}'
    - '[поверни́те]{.ru}'
  - base: '[не ходи́ть]{.ru}'
    cells:
    - '[не ходи́ть]{.ru}'
    - '[не ходи́]{.ru}'
    - '[не ходи́те]{.ru}'
  - base: '[не е́здить]{.ru}'
    cells:
    - '[не е́здить]{.ru}'
    - '[не е́зди]{.ru}'
    - '[не е́здите]{.ru}'
  why: |
    第 1–3 题：[идти́]{.ru} 及带前缀的 [пройти́, пойти́]{.ru}：[иди́(те), пройди́(те), пойди́(те)]{.ru}，重音在词尾。
    第 4、7、9、10 题：不定向动词按规则构成：[ходи́(те)]{.ru}，[е́зди(те)]{.ru}。否定命令式用不定向动词：[Не ходи́те туда́! Не е́зди на такси́!]{.ru}
    第 5、6 题：[е́хать, пое́хать]{.ru} 没有按规则构成的命令式，都用 [поезжа́й(те)]{.ru}，要单独记。
    第 8 题：[поверну́ть]{.ru}（[поверну́, повернёшь]{.ru}）：[поверни́(те)]{.ru}。
- id: L75-03
  tags:
  - 运动动词命令式：ты 与 вы 转换
  task: 把对 [ты]{.ru} 说的指路句改成对 [вы]{.ru} 说的。
  type: matrix
  cols:
  - 对 [ты]{.ru}
  - 对 [вы]{.ru}
  given:
  - 0
  rows:
  - base: '[Иди́ пря́мо до светофо́ра.]{.ru}'
    cells:
    - '[Иди́ пря́мо до светофо́ра.]{.ru}'
    - '[Иди́те пря́мо до светофо́ра]{.ru}'
  - base: '[Поверни́ нале́во.]{.ru}'
    cells:
    - '[Поверни́ нале́во.]{.ru}'
    - '[Поверни́те нале́во]{.ru}'
  - base: '[Пройди́ ми́мо апте́ки.]{.ru}'
    cells:
    - '[Пройди́ ми́мо апте́ки.]{.ru}'
    - '[Пройди́те ми́мо апте́ки]{.ru}'
  - base: '[Поезжа́й на метро́.]{.ru}'
    cells:
    - '[Поезжа́й на метро́.]{.ru}'
    - '[Поезжа́йте на метро́]{.ru}'
  - base: '[Не ходи́ туда́!]{.ru}'
    cells:
    - '[Не ходи́ туда́!]{.ru}'
    - '[Не ходи́те туда́!]{.ru}'
  - base: '[Не е́зди на такси́.]{.ru}'
    cells:
    - '[Не е́зди на такси́.]{.ru}'
    - '[Не е́здите на такси́]{.ru}'
  - base: '[Иди́ наза́д.]{.ru}'
    cells:
    - '[Иди́ наза́д.]{.ru}'
    - '[Иди́те наза́д]{.ru}'
  - base: '[Пойди́ в апте́ку.]{.ru}'
    cells:
    - '[Пойди́ в апте́ку.]{.ru}'
    - '[Пойди́те в апте́ку]{.ru}'
  why: |
    第 1–8 题：对 [вы]{.ru} 说时在命令式后面加 [-те]{.ru}：[иди́ — иди́те, поезжа́й — поезжа́йте, е́зди — е́здите]{.ru}，重音不变。对陌生人问路、指路都用 [вы]{.ru} 的形式。
- id: L75-04
  tags:
  - 运动动词命令式
  task: 按提示写出命令式。
  type: fill
  items:
  - stem: — Как пройти́ к метро́? — ___ пря́мо, пото́м нале́во.
    hint: '[идти́]{.ru}，对 [вы]{.ru}'
    accept:
    - Иди́те
  - stem: ___ ми́мо апте́ки до светофо́ра.
    hint: '[пройти́]{.ru}，对 [вы]{.ru}'
    accept:
    - Пройди́те
  - stem: До вокза́ла далеко́. ___ на метро́.
    hint: '[пое́хать]{.ru}，对 [вы]{.ru}'
    accept:
    - Поезжа́йте
  - stem: Не ___ туда́, там ремо́нт!
    hint: '[ходи́ть]{.ru}，对 [ты]{.ru}'
    accept:
    - ходи́
  - stem: У светофо́ра ___ напра́во.
    hint: '[поверну́ть]{.ru}，对 [вы]{.ru}'
    accept:
    - поверни́те
  - stem: Не ___ на такси́, э́то до́рого.
    hint: '[е́здить]{.ru}，对 [ты]{.ru}'
    accept:
    - е́зди
  - stem: Ми́ша, ___ домо́й, уже́ по́здно!
    hint: '[идти́]{.ru}，对 [ты]{.ru}'
    accept:
    - иди́
  - stem: Апте́ка ря́дом. ___ туда́ пешко́м.
    hint: '[пойти́]{.ru}，对 [вы]{.ru}'
    accept:
    - Пойди́те
  - stem: А́нна, ___ на авто́бусе, он идёт до университе́та.
    hint: '[е́хать]{.ru}，对 [ты]{.ru}'
    accept:
    - поезжа́й
  - stem: Не ___ туда́ ве́чером!
    hint: '[ходи́ть]{.ru}，对 [вы]{.ru}'
    accept:
    - ходи́те
  - stem: Вы прошли́ ми́мо по́чты. ___ наза́д.
    hint: '[идти́]{.ru}，对 [вы]{.ru}'
    accept:
    - Иди́те
  - stem: На углу́ ___ нале́во.
    hint: '[поверну́ть]{.ru}，对 [ты]{.ru}'
    accept:
    - поверни́
  - stem: Ми́ша, ___ сюда́!
    hint: '[идти́]{.ru}，对 [ты]{.ru}'
    accept:
    - иди́
  - stem: Не ___ туда́ на маши́не, там ремо́нт.
    hint: '[е́здить]{.ru}，对 [вы]{.ru}'
    accept:
    - е́здите
  why: |
    第 1、7、11、13 题：[идти́]{.ru}：[иди́(те)]{.ru}；指路告诉对方现在往哪儿走，用这个形式。
    第 2 题：[пройти́]{.ru}：[Пройди́те]{.ru}，常和 [ми́мо, до]{.ru} 连用。第 8 题：[пойти́]{.ru}：[Пойди́те]{.ru}。
    第 3、9 题：[пое́хать, е́хать]{.ru} 的命令式都是 [поезжа́й(те)]{.ru}。
    第 4、6、10、14 题：否定命令式用不定向动词：[Не ходи́! Не е́зди! Не ходи́те! Не е́здите!]{.ru}
    第 5、12 题：[поверну́ть]{.ru}：[поверни́(те)]{.ru}。
