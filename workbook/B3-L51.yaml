heading: 第 51 课　复合前置词
groups:
- id: B3-L51-01
  lessons:
  - B3-L51
  tags:
  - 复合前置词：支配的格
  task: 写出复合前置词后面词组的形式。
  type: matrix
  cols:
  - 前置词 + 词组
  - 词组
  given:
  - 0
  rows:
  - base: '[в тече́ние + не́сколько дней]{.ru}'
    cells:
    - '[в тече́ние + не́сколько дней]{.ru}'
    - '[не́скольких дней]{.ru}'
  - base: '[в тече́ние + це́лый год]{.ru}'
    cells:
    - '[в тече́ние + це́лый год]{.ru}'
    - '[це́лого го́да]{.ru}'
  - base: '[в тече́ние + после́дние го́ды жи́зни]{.ru}'
    cells:
    - '[в тече́ние + после́дние го́ды жи́зни]{.ru}'
    - '[после́дних лет жи́зни]{.ru}'
  - base: '[в свя́зи с + боле́знь го́стя]{.ru}'
    cells:
    - '[в свя́зи с + боле́знь го́стя]{.ru}'
    - '[боле́знью го́стя]{.ru}'
  - base: '[в свя́зи с + плоха́я пого́да]{.ru}'
    cells:
    - '[в свя́зи с + плоха́я пого́да]{.ru}'
    - '[плохо́й пого́дой]{.ru}'
  - base: '[по сравне́нию с + про́шлый раз]{.ru}'
    cells:
    - '[по сравне́нию с + про́шлый раз]{.ru}'
    - '[про́шлым ра́зом]{.ru}'
  - base: '[по сравне́нию с + на́ши роди́тели]{.ru}'
    cells:
    - '[по сравне́нию с + на́ши роди́тели]{.ru}'
    - '[на́шими роди́телями]{.ru}'
  - base: '[по сравне́нию с + ста́ршая сестра́]{.ru}'
    cells:
    - '[по сравне́нию с + ста́ршая сестра́]{.ru}'
    - '[ста́ршей сестро́й]{.ru}'
  - base: '[в отли́чие от + геро́й исто́рии]{.ru}'
    cells:
    - '[в отли́чие от + геро́й исто́рии]{.ru}'
    - '[геро́я исто́рии]{.ru}'
  - base: '[в отли́чие от + други́е студе́нты]{.ru}'
    cells:
    - '[в отли́чие от + други́е студе́нты]{.ru}'
    - '[други́х студе́нтов]{.ru}'
  - base: '[в отли́чие от + мла́дший брат]{.ru}'
    cells:
    - '[в отли́чие от + мла́дший брат]{.ru}'
    - '[мла́дшего бра́та]{.ru}'
  - base: '[в результа́те + до́лгая боле́знь]{.ru}'
    cells:
    - '[в результа́те + до́лгая боле́знь]{.ru}'
    - '[до́лгой боле́зни]{.ru}'
  - base: '[в результа́те + си́льные дожди́]{.ru}'
    cells:
    - '[в результа́те + си́льные дожди́]{.ru}'
    - '[си́льных дожде́й]{.ru}'
  - base: '[в ка́честве + почётный гость]{.ru}'
    cells:
    - '[в ка́честве + почётный гость]{.ru}'
    - '[почётного го́стя]{.ru}'
  - base: '[в ка́честве + перево́дчик]{.ru}'
    cells:
    - '[в ка́честве + перево́дчик]{.ru}'
    - '[перево́дчика]{.ru}'
  - base: '[в ка́честве + пода́рок]{.ru}'
    cells:
    - '[в ка́честве + пода́рок]{.ru}'
    - '[пода́рка]{.ru}'
  why: |-
    第 1–3、9–16 题：[в тече́ние, в отли́чие от, в результа́те, в ка́честве]{.ru} 都要求第二格：[не́скольких дней, геро́я исто́рии, до́лгой боле́зни, почётного го́стя]{.ru}。[го́ды]{.ru} 的复数第二格是 [лет]{.ru}：[в тече́ние после́дних лет жи́зни]{.ru}。
    第 4–8 题：在 [в свя́зи с, по сравне́нию с]{.ru} 里，格由末尾的 [с]{.ru} 决定，用第五格：[боле́знью го́стя, про́шлым ра́зом, на́шими роди́телями, ста́ршей сестро́й]{.ru}。
    第 9–11 题：[в отли́чие от]{.ru} 的格由 [от]{.ru} 决定，用第二格：[мла́дшего бра́та]{.ru}，不写 [мла́дшим бра́том]{.ru}。
    第 15、16 题：[в ка́честве]{.ru} 后面的名词表示身份、用途，用第二格：[в ка́честве перево́дчика, в ка́честве пода́рка]{.ru}。
- id: B3-L51-02
  lessons:
  - B3-L51
  tags:
  - в течение 与 во время 的区别
  task: 下列词组前面该用 [в тече́ние]{.ru} 还是 [во вре́мя]{.ru}？按前置词归栏。
  type: classify
  bins:
  - '[в тече́ние]{.ru}'
  - '[во вре́мя]{.ru}'
  items:
  - text: '[три го́да]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[боле́знь]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[война́]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[це́лый день]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[уро́к]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[после́дние го́ды жи́зни]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[ле́кция]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[не́сколько неде́ль]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[путеше́ствие]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[два часа́]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[обе́д]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[полго́да]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[экза́мен]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[ме́сяц]{.ru}'
    answer: '[в тече́ние]{.ru}'
  - text: '[конце́рт]{.ru}'
    answer: '[во вре́мя]{.ru}'
  - text: '[вся зима́]{.ru}'
    answer: '[в тече́ние]{.ru}'
  why: |-
    第 1、4、6、8、10、12、14、16 题：表示一段时间长度的词用 [в тече́ние]{.ru}：[в тече́ние трёх лет, в тече́ние це́лого дня, в тече́ние после́дних лет жи́зни, в тече́ние двух часо́в, в тече́ние всей зимы́]{.ru}。
    第 2、3、5、7、9、11、13、15 题：表示事件、活动的词用 [во вре́мя]{.ru}：[во вре́мя боле́зни, во вре́мя войны́, во вре́мя уро́ка, во вре́мя путеше́ствия, во вре́мя конце́рта]{.ru}。不说 [в тече́ние боле́зни]{.ru}，也不说 [во вре́мя трёх дней]{.ru}。
- id: B3-L51-03
  lessons:
  - B3-L51
  tags:
  - 复合前置词：固定形式与格
  task: 检查下列词组。有错的写出改正后的词组，没有错的照抄。
  type: matrix
  cols:
  - 词组
  - 改正
  given:
  - 0
  rows:
  - base: '[в тече́нии дня]{.ru}'
    cells:
    - '[в тече́нии дня]{.ru}'
    - '[в тече́ние дня]{.ru}'
  - base: '[по сравне́нию с про́шлого ра́за]{.ru}'
    cells:
    - '[по сравне́нию с про́шлого ра́за]{.ru}'
    - '[по сравне́нию с про́шлым ра́зом]{.ru}'
  - base: '[в отли́чие от геро́ем]{.ru}'
    cells:
    - '[в отли́чие от геро́ем]{.ru}'
    - '[в отли́чие от геро́я]{.ru}'
  - base: '[в свя́зи боле́знью]{.ru}'
    cells:
    - '[в свя́зи боле́знью]{.ru}'
    - '[в свя́зи с боле́знью]{.ru}'
  - base: '[в результа́тах боле́зни]{.ru}'
    cells:
    - '[в результа́тах боле́зни]{.ru}'
    - '[в результа́те боле́зни]{.ru}'
  - base: '[в ка́честве го́стем]{.ru}'
    cells:
    - '[в ка́честве го́стем]{.ru}'
    - '[в ка́честве го́стя]{.ru}'
  - base: '[в тече́ние боле́зни]{.ru}'
    cells:
    - '[в тече́ние боле́зни]{.ru}'
    - '[во вре́мя боле́зни]{.ru}'
  - base: '[во вре́мя трёх дней]{.ru}'
    cells:
    - '[во вре́мя трёх дней]{.ru}'
    - '[в тече́ние трёх дней]{.ru}'
  - base: '[в свя́зи с ремо́нтом]{.ru}'
    cells:
    - '[в свя́зи с ремо́нтом]{.ru}'
    - '[в свя́зи с ремо́нтом]{.ru}'
  - base: '[по сравне́нию с Москво́й]{.ru}'
    cells:
    - '[по сравне́нию с Москво́й]{.ru}'
    - '[по сравне́нию с Москво́й]{.ru}'
  - base: '[в отли́чие от ста́рших сестёр]{.ru}'
    cells:
    - '[в отли́чие от ста́рших сестёр]{.ru}'
    - '[в отли́чие от ста́рших сестёр]{.ru}'
  - base: '[по сравне́нию про́шлым го́дом]{.ru}'
    cells:
    - '[по сравне́нию про́шлым го́дом]{.ru}'
    - '[по сравне́нию с про́шлым го́дом]{.ru}'
  why: |-
    第 1、5 题：复合前置词里的名词形式是固定的：[в тече́ние]{.ru}（不是第六格 [в тече́нии]{.ru}，那是“在水流中”），[в результа́те]{.ru}（不变成复数）。
    第 2、3、6 题：格由末尾的简单前置词决定：[по сравне́нию с]{.ru} + 第五格，[в отли́чие от]{.ru} + 第二格，[в ка́честве]{.ru} + 第二格。
    第 4、12 题：[в свя́зи с, по сравне́нию с]{.ru} 里的 [с]{.ru} 不能省。
    第 7、8 题：[в тече́ние]{.ru} 接时间长度，[во вре́мя]{.ru} 接事件：[во вре́мя боле́зни, в тече́ние трёх дней]{.ru}。
    第 9–11 题：没有错误。
