    第 6–10 题：[-ь]{.ru} 结尾的阳性名词去掉 [ь]{.ru} 加 [-ей]{.ru}：[писа́телей, преподава́телей]{.ru}；[словари́, рубли́]{.ru} 重音在词尾，所以是 [словаре́й, рубле́й]{.ru}。
    第 11 题：[го́сти]{.ru} 重音在词干，复数第二格却是 [госте́й]{.ru}，要单独记。
    第 12、13 题：[-ь]{.ru} 结尾的阴性名词也加 [-ей]{.ru}：[тетра́дей, крова́тей]{.ru}，重音不动。
    第 14、15 题：[ве́щи, но́чи]{.ru} 复数第二格重音移到词尾：[веще́й, ноче́й]{.ru}。
