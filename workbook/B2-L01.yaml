    第 2、6、19 题：单数里脱落的元音不再出现：[пода́рков, отцо́в, ры́нков]{.ru}。
    第 3、8、11、17 题：[-й]{.ru} 和非重读 [-ц]{.ru} 用 [-ев]{.ru}：[музе́ев, ме́сяцев, геро́ев, америка́нцев]{.ru}。
    第 5、7、9、13、16、20 题：词干以 [-ь]{.ru} 或 [ж, ш, ч, щ]{.ru} 结尾的用 [-ей]{.ru}，重音跟着复数第一格：[тетра́дей]{.ru}；[словаре́й, враче́й, карандаше́й, учителе́й, ноже́й]{.ru}。
