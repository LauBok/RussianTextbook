    第 11 题：[го́сти]{.ru} 重音在词干，复数第二格却是 [госте́й]{.ru}，要单独记。
    第 12、13 题：[-ь]{.ru} 结尾的阴性名词也加 [-ей]{.ru}：[тетра́дей, крова́тей]{.ru}，重音不动。
