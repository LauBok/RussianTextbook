    第 9、10 题：[-ц]{.ru} 结尾、词尾不重读的用 [-ев]{.ru}：[ме́сяцев, не́мцев]{.ru}。不要因为前面是辅音就写成 [-ов]{.ru}。
    第 11 题：这一题是混进来的硬辅音词：[ку́бок]{.ru} 加 [-ов]{.ru}，[о]{.ru} 和单数第二格 [ку́бка]{.ru} 一样脱落：[ку́бков]{.ru}。
