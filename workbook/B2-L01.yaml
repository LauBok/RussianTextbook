    第 10、11 题：[-й]{.ru} 和非重读 [-ц]{.ru} 用 [-ев]{.ru}：[музе́ев, ме́сяцев]{.ru}。
    第 12、16 题：重音移到词尾：[госте́й, ноче́й]{.ru}。
    第 13、14 题：脱落的元音不出现：[огурцо́в]{.ru}（[-ц]{.ru} 重读用 [-о́в]{.ru}），[пода́рков]{.ru}。
