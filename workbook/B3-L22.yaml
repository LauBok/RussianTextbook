  - 指小表爱：-ик, -очк- 的变格
  task: 写出指小表爱形式的单数第二格、复数第一格和复数第二格。
  type: matrix
  cols:
  - 指小表爱形式
  - 单数第二格
  - 复数第一格
  - 复数第二格
  given:
