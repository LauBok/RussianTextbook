  rows:
  - base: '[сыно́к]{.ru}'
    cells:
    - '[сыно́к]{.ru}'
    - '[сынка́]{.ru}'
    - '[сынки́]{.ru}'
    - '[сынко́в]{.ru}'
  - base: '[пирожо́к]{.ru}'
    cells:
    - '[пирожо́к]{.ru}'
    - '[пирожка́]{.ru}'
    - '[пирожки́]{.ru}'
    - '[пирожко́в]{.ru}'
  - base: '[городо́к]{.ru}'
    cells:
    - '[городо́к]{.ru}'
    - '[городка́]{.ru}'
    - '[городки́]{.ru}'
    - '[городко́в]{.ru}'
  - base: '[петушо́к]{.ru}'
    cells:
    - '[петушо́к]{.ru}'
    - '[петушка́]{.ru}'
    - '[петушки́]{.ru}'
    - '[петушко́в]{.ru}'
  - base: '[до́мик]{.ru}'
    cells:
    - '[до́мик]{.ru}'
    - '[до́мика]{.ru}'
    - '[до́мики]{.ru}'
    - '[до́миков]{.ru}'
  - base: '[сто́лик]{.ru}'
    cells:
    - '[сто́лик]{.ru}'
    - '[сто́лика]{.ru}'
    - '[сто́лики]{.ru}'
    - '[сто́ликов]{.ru}'
  - base: '[за́йчик]{.ru}'
    cells:
    - '[за́йчик]{.ru}'
    - '[за́йчика]{.ru}'
    - '[за́йчики]{.ru}'
    - '[за́йчиков]{.ru}'
  - base: '[цвето́чек]{.ru}'
    cells:
    - '[цвето́чек]{.ru}'
    - '[цвето́чка]{.ru}'
    - '[цвето́чки]{.ru}'
    - '[цвето́чков]{.ru}'
  - base: '[мину́тка]{.ru}'
    cells:
    - '[мину́тка]{.ru}'
    - '[мину́тки]{.ru}'
    - '[мину́тки]{.ru}'
    - '[мину́ток]{.ru}'
  - base: '[мину́точка]{.ru}'
    cells:
    - '[мину́точка]{.ru}'
    - '[мину́точки]{.ru}'
    - '[мину́точки]{.ru}'
    - '[мину́точек]{.ru}'
  - base: '[ма́мочка]{.ru}'
    cells:
    - '[ма́мочка]{.ru}'
    - '[ма́мочки]{.ru}'
    - '[ма́мочки]{.ru}'
    - '[ма́мочек]{.ru}'
  - base: '[ры́бка]{.ru}'
    cells:
    - '[ры́бка]{.ru}'
    - '[ры́бки]{.ru}'
    - '[ры́бки]{.ru}'
    - '[ры́бок]{.ru}'
  why: |-
    第 1–4 题：[-о́к]{.ru} 变格时 [о]{.ru} 脱落，重音移到词尾：[сыно́к]{.ru} — [сынка́]{.ru} — [сынки́]{.ru} — [сынко́в]{.ru}。不能写成 [сыно́ка]{.ru}、[пирожо́ки]{.ru}。
    第 5–7 题：[-ик]{.ru} 不重读，[и]{.ru} 不脱落，重音一直留在词干上：[до́мика, до́мики, до́миков]{.ru}。
    第 8 题：[цвето́чек]{.ru} 的 [е]{.ru} 变格时也脱落，重音不动：[цвето́чка, цвето́чки, цвето́чков]{.ru}。
    第 9–12 题：阴性 [-ка]{.ru} 名词复数第二格是零词尾，[к]{.ru} 前出现隐现元音：[мину́ток, ры́бок]{.ru}；[-очка, -ечка]{.ru} 的复数第二格写 [-очек]{.ru}：[мину́точек, ма́мочек]{.ru}。指小形式重音不落在后缀上，各格重音都不动。
- id: B3-L22-03
  lessons:
  - B3-L22
  tags:
  - 指小表爱：句中变格
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: На таре́лке оста́лось пять ___.
    hint: пирожо́к
    accept:
    - пирожко́в
  - stem: Официа́нт подошёл к на́шему ___.
    hint: сто́лик
    accept:
    - сто́лику
  - stem: Де́ти до́лго игра́ли с ___.
    hint: ко́тик
    accept:
    - ко́тиком
    new: true
    gloss: 小猫
  - stem: Ми́ша купи́л пода́рок своему́ ма́ленькому ___.
    hint: бра́тик
    accept:
    - бра́тику
  - stem: Де́вочка нарисова́ла пять ___.
    hint: цвето́чек
    accept:
    - цвето́чков
  - stem: На Восьмо́е ма́рта сын подари́л ___ цветы́.
    hint: ма́мочка
    accept:
    - ма́мочке
  - stem: Подожди́те ещё пять ___!
    hint: мину́тка
    accept:
    - мину́ток
  - stem: Ба́бушка позвала́ ___ обе́дать.
    hint: Игорёк
    accept:
    - Игорька́
  - stem: У Ми́ши в ко́мнате живу́т три ___.
    hint: ры́бка
    accept:
    - ры́бки
  - stem: Ле́на наде́ла ___ пла́тье.
    hint: голу́бенький
    accept:
    - голу́бенькое
  - stem: Купи́, пожа́луйста, ___ хле́ба.
    hint: све́женький
    accept:
    - све́женького
  - stem: Ма́ма давно́ ждёт письма́ от ___.
    hint: сыно́к
    accept:
    - сынка́
  - stem: Ба́бушка живёт в ма́леньком ___ на берегу́ реки́.
    hint: городо́к
    accept:
    - городке́
  - stem: Мы ви́дели на дворе́ ___.
    hint: петушо́к
    accept:
    - петушка́
  why: |-
    第 1、5 题：[пять]{.ru} 后用复数第二格：[пирожко́в]{.ru}（[о]{.ru} 脱落）、[цвето́чков]{.ru}（[е]{.ru} 脱落）。
    第 2、4 题：[к]{.ru} 和 [купи́ть пода́рок кому́]{.ru} 要求第三格：[сто́лику, бра́тику]{.ru}；[-ик]{.ru} 的 [и]{.ru} 不脱落。
    第 3 题：[с]{.ru} 后第五格：[ко́тиком]{.ru}。
    第 6 题：[подари́ть кому́]{.ru} 用第三格：[ма́мочке]{.ru}。
    第 7 题：[пять]{.ru} 后复数第二格，零词尾前有隐现元音：[мину́ток]{.ru}。
    第 8、14 题：动物名词和人名做宾语，第四格同第二格；[-ёк / -о́к]{.ru} 的元音脱落，重音在词尾：[Игорька́, петушка́]{.ru}。
    第 9 题：[три]{.ru} 后用单数第二格：[ры́бки]{.ru}。
    第 10、11 题：[-еньк-]{.ru} 形容词像普通形容词一样变格：[голу́бенькое пла́тье]{.ru}（中性第四格），[све́женького хле́ба]{.ru}（[купи́ть]{.ru} 接第二格表示“一些”）。
    第 12、13 题：[-о́к]{.ru} 的变格：[от сынка́]{.ru}（第二格），[в городке́]{.ru}（第六格），重音都在词尾。
