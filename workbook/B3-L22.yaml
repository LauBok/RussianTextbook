heading: 第 22 课　指小表爱后缀
groups:
- id: B3-L22-01
  lessons:
  - B3-L22
  tags:
  - 指小表爱：-ок, -ик 的构成
  - 指小表爱：-очк-, -ечк- 的构成
  - 指小表爱：-еньк- 的构成
  task: 写出下列词的指小表爱形式。
  type: matrix
  cols:
  - 原词
  - 指小表爱形式
  given:
  - 0
  rows:
  - base: '[сын]{.ru}'
    cells:
    - '[сын]{.ru}'
    - '[сыно́к]{.ru}'
  - base: '[го́род]{.ru}'
    cells:
    - '[го́род]{.ru}'
    - '[городо́к]{.ru}'
  - base: '[пиро́г]{.ru}'
    cells:
    - '[пиро́г]{.ru}'
    - '[пирожо́к]{.ru}'
  - base: '[пету́х]{.ru}'
    cells:
    - '[пету́х]{.ru}'
    - '[петушо́к]{.ru}'
  - base: '[И́горь]{.ru}'
    cells:
    - '[И́горь]{.ru}'
    - '[Игорёк]{.ru}'
    hint: 男名
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[до́мик]{.ru}'
  - base: '[стол]{.ru}'
    cells:
    - '[стол]{.ru}'
    - '[сто́лик]{.ru}'
  - base: '[брат]{.ru}'
    cells:
    - '[брат]{.ru}'
    - '[бра́тик]{.ru}'
  - base: '[за́яц]{.ru}'
    cells:
    - '[за́яц]{.ru}'
    - '[за́йчик]{.ru}'
  - base: '[мину́тка]{.ru}'
    cells:
    - '[мину́тка]{.ru}'
    - '[мину́точка]{.ru}'
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[ма́мочка]{.ru}'
  - base: '[цвето́к]{.ru}'
    cells:
    - '[цвето́к]{.ru}'
    - '[цвето́чек]{.ru}'
  - base: '[Ле́на]{.ru}'
    cells:
    - '[Ле́на]{.ru}'
    - '[Ле́ночка]{.ru}'
    hint: 女名；亲人之间
  - base: '[А́ня]{.ru}'
    cells:
    - '[А́ня]{.ru}'
    - '[А́нечка]{.ru}'
    hint: 女名；亲人之间
  - base: '[Ма́ша]{.ru}'
    cells:
    - '[Ма́ша]{.ru}'
    - '[Ма́шенька]{.ru}'
    hint: 女名；亲人之间
  - base: '[бе́лый]{.ru}'
    cells:
    - '[бе́лый]{.ru}'
    - '[бе́ленький]{.ru}'
  - base: '[хоро́ший]{.ru}'
    cells:
    - '[хоро́ший]{.ru}'
    - '[хоро́шенький]{.ru}'
  - base: '[голубо́й]{.ru}'
    cells:
    - '[голубо́й]{.ru}'
    - '[голу́бенький]{.ru}'
  why: |-
    第 1–5 题：这几个词用重读的 [-о́к / -ёк]{.ru}：[сыно́к, городо́к]{.ru}。词干末的 [г, х]{.ru} 在 [-ок]{.ru} 前变成 [ж, ш]{.ru}：[пиро́г]{.ru} → [пирожо́к]{.ru}，[пету́х]{.ru} → [петушо́к]{.ru}；软辅音词干写 [-ёк]{.ru}：[И́горь]{.ru} → [Игорёк]{.ru}。
    第 6–9 题：这几个词用不重读的 [-ик]{.ru}，重音留在词干上：[до́мик, сто́лик, бра́тик]{.ru}。[за́яц]{.ru} 的 [ц]{.ru} 变 [ч]{.ru}，[е]{.ru} 脱落，写成 [за́йчик]{.ru}。用 [-ок]{.ru} 还是 [-ик]{.ru} 要逐词记，不能写 [доможо́к]{.ru}、[городи́к]{.ru} 之类。
    第 10–12 题：已经带 [-к]{.ru}- 的 [мину́тка]{.ru} 再指小，[-к]{.ru}- 换成 [-очк-]{.ru}：[мину́точка]{.ru}；[ма́ма]{.ru} 直接加 [-очк-]{.ru}：[ма́мочка]{.ru}；阳性的 [цвето́к]{.ru} 用 [-очек]{.ru}：[цвето́чек]{.ru}。
    第 13、14 题：硬辅音词干的名字用 [-очк-]{.ru}：[Ле́ночка]{.ru}；软辅音词干用 [-ечк-]{.ru}：[А́нечка]{.ru}。只加 [-к]{.ru}- 的 [Ле́нка, А́нька]{.ru} 口气随便，不是这里要的形式。
    第 15 题：[Ма́ша]{.ru} 用 [-еньк-]{.ru}：[Ма́шенька]{.ru}，这是最温柔的形式。
    第 16–18 题：形容词加 [-еньк-]{.ru}，重音落在词干上：[бе́ленький, хоро́шенький]{.ru}；[голубо́й]{.ru} 重音前移：[голу́бенький]{.ru}。
- id: B3-L22-02
  lessons:
