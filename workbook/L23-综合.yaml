  why: '第 1、4、7、10、12、13 题：阴性第六格修饰语 [-ой / -ей, мое́й, на́шей, э́той]{.ru}、名词 [-е / -и]{.ru}；第四格修饰语 [-ую / -юю, мою́, на́шу, э́ту]{.ru}、名词 [-у / -ю]{.ru}。第 10 题 [ле́кция]{.ru} 第六格 [-ии]{.ru}，第四格 [-ию]{.ru}。

    第 2、5、9、11、14 题：阳性动物名词：第六格 [-ом / -ем]{.ru}，第四格修饰语 [-ого / -его]{.ru}、名词 [-а / -я]{.ru}。第 9、14 题 [о]{.ru} 在元音前写成 [об]{.ru}：[об Ива́не Серге́евиче, об э́том студе́нте]{.ru}。

    第 3、6、8 题：非动物的阳性和中性第四格同第一格，第六格照常变。第 6 题 [зда́ние]{.ru} 第六格 [-ии]{.ru}；第 8 题 [сад]{.ru} 表示处所用 [в саду́]{.ru}，修饰语仍用 [-ем]{.ru}。'
