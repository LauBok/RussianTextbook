  why: '第 1、5、8、14、18、20、22 题：阳性动物名词加 [-а]{.ru}，[-й]{.ru}、[-ь]{.ru} 换成 [-я]{.ru}：[студе́нта, преподава́теля, Серге́я, И́горя]{.ru}。第 20 题 [врач]{.ru} 加词尾后重音在词尾：[врача́]{.ru}。

    第 2、6、9、15 题：同样的词尾，非动物名词第四格不变：[стол, слова́рь, музе́й, го́род]{.ru}。第 5 题和第 6 题、第 8 题和第 9 题对比着看。

    第 3、4、10、12、13、16、19 题：[-а / -я]{.ru} 结尾的词不分动物、非动物和性，一律改 [-у / -ю]{.ru}。

    第 7、17 题：[-ь]{.ru} 结尾的阴性名词第四格不变。

    第 11、21 题：中性名词第四格不变。'
