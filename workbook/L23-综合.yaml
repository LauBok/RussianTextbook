  why: '第 1、4、6、11、13 题：阳性动物名词，修饰语 [-ого / -его, моего́, твоего́, ва́шего, э́того]{.ru}，名词 [-а / -я]{.ru}。第 4、6 题 [ш]{.ru} 后写 [-его]{.ru}：[хоро́шего]{.ru}。

    第 7 题：[де́душка]{.ru} 是阳性动物名词，修饰语按阳性变 [на́шего ста́рого]{.ru}，名词按词尾变 [де́душку]{.ru}。

    第 3、8、14 题：阳性非动物，三个词都同第一格。

    第 2、5、9、12 题：阴性 [-ую / -юю]{.ru}，[мою́, на́шу, ва́шу, э́ту]{.ru}；第 5 题软变化 [си́нюю]{.ru}，第 9 题名词 [статья́ → статью́]{.ru}。

    第 10 题：中性同第一格。'
