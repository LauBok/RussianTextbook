heading: 第 34 课　带 -ся 动词的意义
groups:
- id: B2-L34-01
  tags:
  - 带 -ся 动词的意义
  task: 句中带 [-ся]{.ru} 的动词表示什么？归栏。
  type: classify
  bins:
  - 反身
  - 相互
  - 被动
  - 不及物
  - 只有 [-ся]{.ru} 形式
  items:
  - text: '[Ми́ша умыва́ется.]{.ru}'
    answer: 反身
  - text: '[Де́ти бы́стро одева́ются.]{.ru}'
    answer: 反身
  - text: '[Ю́ми одева́ется пе́ред зе́ркалом.]{.ru}'
    answer: 反身
  - text: '[Ка́ждое у́тро я умыва́юсь холо́дной водо́й.]{.ru}'
    answer: 反身
  - text: '[Мы с Ди́мой ви́димся ка́ждый день.]{.ru}'
    answer: 相互
  - text: '[Ста́рые друзья́ обнима́ются.]{.ru}'
    answer: 相互
  - text: '[Студе́нты здоро́ваются с преподава́телем.]{.ru}'
    answer: 相互
  - text: '[Пьер и Ю́ми перепи́сываются.]{.ru}'
    answer: 相互
  - text: '[Как пи́шется ва́ше и́мя?]{.ru}'
    answer: 被动
  - text: '[Здесь продаю́тся кни́ги.]{.ru}'
    answer: 被动
  - text: '[Тако́й суп гото́вится за час.]{.ru}'
    answer: 被动
  - text: '[Э́тот дом стро́ится уже́ два го́да.]{.ru}'
    answer: 被动
  - text: '[Уро́к начина́ется в де́вять.]{.ru}'
    answer: 不及物
  - text: '[Фильм конча́ется по́здно.]{.ru}'
    answer: 不及物
  - text: '[Музе́й открыва́ется в де́сять.]{.ru}'
    answer: 不及物
  - text: '[Магази́н закрыва́ется в во́семь.]{.ru}'
    answer: 不及物
  - text: '[Ле́на улыба́ется.]{.ru}'
    answer: 只有 [-ся]{.ru} 形式
  - text: '[Ми́ша бои́тся соба́к.]{.ru}'
    answer: 只有 [-ся]{.ru} 形式
  - text: '[Мне нра́вится Москва́.]{.ru}'
    answer: 只有 [-ся]{.ru} 形式
  - text: '[Я наде́юсь на тебя́.]{.ru}'
    answer: 只有 [-ся]{.ru} 形式
  why: |-
    第 1–4 题：反身：主语对自己做，[-ся]{.ru} 相当于 [себя́]{.ru}：[умыва́ется]{.ru} = 洗自己，[одева́ется]{.ru} = 给自己穿。
    第 5–8 题：相互：几个人互相做，主语是复数或 [кто с кем]{.ru}：[ви́димся, обнима́ются, здоро́ваются, перепи́сываются]{.ru}。
    第 9–12 题：被动：未完成体 + [-ся]{.ru}，主语是事物，做动作的人不说出来：[пи́шется, продаю́тся, гото́вится, стро́ится]{.ru}。
    第 13–16 题：不及物：动作自己开始、结束：[начина́ется, конча́ется, открыва́ется, закрыва́ется]{.ru}；对照及物的 [Учи́тель начина́ет уро́к]{.ru}。
    第 17–20 题：[улыба́ться, боя́ться, нра́виться, наде́яться]{.ru} 没有不带 [-ся]{.ru} 的形式，[-ся]{.ru} 没有单独的意义。
- id: B2-L34-02
  tags:
  - 带 -ся 动词：与及物动词对照
  task: 用括号里的主语把句子改成带 [-ся]{.ru} 的说法，只写谓语。
  type: matrix
  cols:
  - 及物句
  - '[-ся]{.ru} 句的谓语'
  given:
  - 0
  rows:
  - base: '[Ма́ма одева́ет Ми́шу.]{.ru}'
    cells:
    - '[Ма́ма одева́ет Ми́шу.]{.ru}'
    - '[одева́ется]{.ru}'
    hint: 主语 [Ми́ша]{.ru}
  - base: '[Учи́тель начина́ет уро́к.]{.ru}'
    cells:
    - '[Учи́тель начина́ет уро́к.]{.ru}'
    - '[начина́ется]{.ru}'
    hint: 主语 [уро́к]{.ru}
  - base: '[Там продаю́т кни́ги.]{.ru}'
    cells:
    - '[Там продаю́т кни́ги.]{.ru}'
    - '[продаю́тся]{.ru}'
    hint: 主语 [кни́ги]{.ru}
  - base: '[Сотру́дница открыва́ет музе́й.]{.ru}'
    cells:
    - '[Сотру́дница открыва́ет музе́й.]{.ru}'
    - '[открыва́ется]{.ru}'
    hint: 主语 [музе́й]{.ru}
  - base: '[Па́па закрыва́ет дверь.]{.ru}'
    cells:
    - '[Па́па закрыва́ет дверь.]{.ru}'
    - '[закрыва́ется]{.ru}'
    hint: 主语 [дверь]{.ru}
  - base: '[Я встре́тил Ди́му в кафе́.]{.ru}'
    cells:
    - '[Я встре́тил Ди́му в кафе́.]{.ru}'
    - '[встре́тились]{.ru}'
    hint: 主语 [мы с Ди́мой]{.ru}
  - base: '[Я ви́жу А́нну ка́ждый день.]{.ru}'
    cells:
    - '[Я ви́жу А́нну ка́ждый день.]{.ru}'
    - '[ви́димся]{.ru}'
    hint: 主语 [мы с А́нной]{.ru}
  - base: '[Ма́ма умыва́ет Ми́шу.]{.ru}'
    cells:
    - '[Ма́ма умыва́ет Ми́шу.]{.ru}'
    - '[умыва́ется]{.ru}'
    hint: 主语 [Ми́ша]{.ru}
  - base: '[Профе́ссор конча́ет ле́кцию.]{.ru}'
    cells:
    - '[Профе́ссор конча́ет ле́кцию.]{.ru}'
    - '[конча́ется]{.ru}'
    hint: 主语 [ле́кция]{.ru}
  - base: '[Как пи́шут э́то сло́во?]{.ru}'
    cells:
    - '[Как пи́шут э́то сло́во?]{.ru}'
    - '[пи́шется]{.ru}'
    hint: 主语 [сло́во]{.ru}
  - base: '[Пьер познако́мил меня́ с Ю́ми.]{.ru}'
    cells:
    - '[Пьер познако́мил меня́ с Ю́ми.]{.ru}'
    - '[познако́мился]{.ru}'
    hint: 主语 [я]{.ru}（男）
  - base: '[Я обнима́ю ма́му, ма́ма обнима́ет меня́.]{.ru}'
    cells:
    - '[Я обнима́ю ма́му, ма́ма обнима́ет меня́.]{.ru}'
    - '[обнима́емся]{.ru}'
    hint: 主语 [мы с ма́мой]{.ru}
  - base: '[Ди́ма целу́ет Ле́ну, Ле́на целу́ет Ди́му.]{.ru}'
    cells:
    - '[Ди́ма целу́ет Ле́ну, Ле́на целу́ет Ди́му.]{.ru}'
    - '[целу́ются]{.ru}'
    hint: 主语 [Ди́ма и Ле́на]{.ru}
  - base: '[Ма́ма гото́вит обе́д час.]{.ru}'
    cells:
    - '[Ма́ма гото́вит обе́д час.]{.ru}'
    - '[гото́вится]{.ru}'
    hint: 主语 [обе́д]{.ru}
  why: |-
    第 1、8 题：反身：对别人做不带 [-ся]{.ru}（[одева́ет Ми́шу]{.ru}），对自己做带 [-ся]{.ru}：[Ми́ша одева́ется, умыва́ется]{.ru}。
    第 2、4、5、9 题：及物动词加 [-ся]{.ru} 变成不及物，原来的宾语作主语：[Уро́к начина́ется. Музе́й открыва́ется. Дверь закрыва́ется. Ле́кция конча́ется.]{.ru}
    第 3、10、14 题：被动：[кни́ги продаю́тся, сло́во пи́шется, обе́д гото́вится]{.ru}，谓语和新主语一致。
    第 6、7、12、13 题：相互：[мы с Ди́мой встре́тились, мы с А́нной ви́димся, мы с ма́мой обнима́емся, Ди́ма и Ле́на целу́ются]{.ru}；[мы с Ди́мой]{.ru} 是复数主语，谓语用 [мы]{.ru} 的形式。第 6 题保留完成体过去时。
    第 11 题：[познако́мить кого́ с кем]{.ru}“介绍某人认识” → [познако́миться с кем]{.ru}“认识（某人）”：[Я познако́мился с Ю́ми]{.ru}。
- id: B2-L34-03
  tags:
  - 相互动词：变位
  task: 写出相互动词的形式。
  type: matrix
  cols:
  - 不定式
  - '[мы]{.ru}（[мы с Ди́мой]{.ru}）'
  - '[они́]{.ru}'
  - 过去时 [они́]{.ru}
  given:
  - 0
  rows:
  - base: '[ви́деться]{.ru}'
    cells:
    - '[ви́деться]{.ru}'
    - '[ви́димся]{.ru}'
    - '[ви́дятся]{.ru}'
    - '[ви́делись]{.ru}'
  - base: '[встреча́ться]{.ru}'
    cells:
    - '[встреча́ться]{.ru}'
    - '[встреча́емся]{.ru}'
    - '[встреча́ются]{.ru}'
    - '[встреча́лись]{.ru}'
  - base: '[знако́миться]{.ru}'
    cells:
    - '[знако́миться]{.ru}'
    - '[знако́мимся]{.ru}'
    - '[знако́мятся]{.ru}'
    - '[знако́мились]{.ru}'
  - base: '[здоро́ваться]{.ru}'
    cells:
    - '[здоро́ваться]{.ru}'
    - '[здоро́ваемся]{.ru}'
    - '[здоро́ваются]{.ru}'
    - '[здоро́вались]{.ru}'
  - base: '[обнима́ться]{.ru}'
    cells:
    - '[обнима́ться]{.ru}'
    - '[обнима́емся]{.ru}'
    - '[обнима́ются]{.ru}'
    - '[обнима́лись]{.ru}'
  - base: '[целова́ться]{.ru}'
    cells:
    - '[целова́ться]{.ru}'
    - '[целу́емся]{.ru}'
    - '[целу́ются]{.ru}'
    - '[целова́лись]{.ru}'
  - base: '[перепи́сываться]{.ru}'
    cells:
    - '[перепи́сываться]{.ru}'
    - '[перепи́сываемся]{.ru}'
    - '[перепи́сываются]{.ru}'
    - '[перепи́сывались]{.ru}'
  - base: '[договори́ться]{.ru}'
    cells:
    - '[договори́ться]{.ru}'
    - '[договори́мся]{.ru}'
    - '[договоря́тся]{.ru}'
    - '[договори́лись]{.ru}'
  why: |-
    第 1–8 题：[-ся]{.ru} 在辅音后写 [-ся]{.ru}，在元音后写 [-сь]{.ru}：[ви́димся, ви́дятся, ви́делись]{.ru}。
    第 1、3 题：第二变位只在 [я]{.ru} 交替（[ви́жусь, знако́млюсь]{.ru}），[мы, они́]{.ru} 不交替：[ви́димся, знако́мимся]{.ru}。
    第 6 题：[-ова-]{.ru} 变 [-у-]{.ru}：[целу́емся, целу́ются]{.ru}；过去时保留 [целова́лись]{.ru}。
    第 7 题：[-ывать]{.ru} 后缀不变：[перепи́сываемся]{.ru}。
    第 8 题：完成体，变位形式表示将来：[договори́мся]{.ru}“我们会商量好”。
