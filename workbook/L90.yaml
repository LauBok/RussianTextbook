heading: 第 90 课　单元复习
groups:
- id: L90-01
  tags:
  - 单元复习：встава́ть 类与 -ся 动词变位
  task: 写出动词的现在时和过去时形式。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  - 过去时 [она́]{.ru}
  given:
  - 0
  rows:
  - base: '[дава́ть]{.ru}'
    cells:
    - '[дава́ть]{.ru}'
    - '[даю́]{.ru}'
    - '[даёшь]{.ru}'
    - '[даю́т]{.ru}'
    - '[дава́ла]{.ru}'
  - base: '[ложи́ться]{.ru}'
    cells:
    - '[ложи́ться]{.ru}'
    - '[ложу́сь]{.ru}'
    - '[ложи́шься]{.ru}'
    - '[ложа́тся]{.ru}'
    - '[ложи́лась]{.ru}'
  - base: '[узнава́ть]{.ru}'
    cells:
    - '[узнава́ть]{.ru}'
    - '[узнаю́]{.ru}'
    - '[узнаёшь]{.ru}'
    - '[узнаю́т]{.ru}'
    - '[узнава́ла]{.ru}'
  - base: '[одева́ться]{.ru}'
    cells:
    - '[одева́ться]{.ru}'
    - '[одева́юсь]{.ru}'
    - '[одева́ешься]{.ru}'
    - '[одева́ются]{.ru}'
    - '[одева́лась]{.ru}'
  - base: '[устава́ть]{.ru}'
    cells:
    - '[устава́ть]{.ru}'
    - '[устаю́]{.ru}'
    - '[устаёшь]{.ru}'
    - '[устаю́т]{.ru}'
    - '[устава́ла]{.ru}'
  - base: '[возвраща́ться]{.ru}'
    cells:
    - '[возвраща́ться]{.ru}'
    - '[возвраща́юсь]{.ru}'
    - '[возвраща́ешься]{.ru}'
    - '[возвраща́ются]{.ru}'
    - '[возвраща́лась]{.ru}'
  - base: '[передава́ть]{.ru}'
    cells:
    - '[передава́ть]{.ru}'
    - '[передаю́]{.ru}'
    - '[передаёшь]{.ru}'
    - '[передаю́т]{.ru}'
    - '[передава́ла]{.ru}'
  - base: '[занима́ться]{.ru}'
    cells:
    - '[занима́ться]{.ru}'
    - '[занима́юсь]{.ru}'
    - '[занима́ешься]{.ru}'
    - '[занима́ются]{.ru}'
    - '[занима́лась]{.ru}'
  - base: '[продава́ть]{.ru}'
    cells:
    - '[продава́ть]{.ru}'
    - '[продаю́]{.ru}'
    - '[продаёшь]{.ru}'
    - '[продаю́т]{.ru}'
    - '[продава́ла]{.ru}'
  - base: '[умыва́ться]{.ru}'
    cells:
    - '[умыва́ться]{.ru}'
    - '[умыва́юсь]{.ru}'
    - '[умыва́ешься]{.ru}'
    - '[умыва́ются]{.ru}'
    - '[умыва́лась]{.ru}'
  - base: '[встава́ть]{.ru}'
    cells:
    - '[встава́ть]{.ru}'
    - '[встаю́]{.ru}'
    - '[встаёшь]{.ru}'
    - '[встаю́т]{.ru}'
    - '[встава́ла]{.ru}'
  - base: '[учи́ться]{.ru}'
    cells:
    - '[учи́ться]{.ru}'
    - '[учу́сь]{.ru}'
    - '[у́чишься]{.ru}'
    - '[у́чатся]{.ru}'
    - '[учи́лась]{.ru}'
  why: '第 1、3、5、7、9、11 题：[-ава́ть]{.ru} 类现在时去掉 [-ва-]{.ru}，词尾重读：[даю́, даёшь, даю́т]{.ru}；过去时保留 [-ва-]{.ru}：[дава́ла, встава́ла]{.ru}。

    第 2、4、6、8、10、12 题：[-ся]{.ru} 动词元音后加 [-сь]{.ru}（[ложу́сь, одева́юсь, ложи́лась]{.ru}），辅音后加 [-ся]{.ru}（[ложи́шься, ложа́тся]{.ru}）。[ложи́ться, учи́ться]{.ru} 是第二变位，[ж, ч]{.ru} 后写 [у, а]{.ru}：[ложу́сь, ложа́тся, учу́сь, у́чатся]{.ru}；[учи́ться]{.ru} 从第二人称起重音前移：[у́чишься]{.ru}。'
