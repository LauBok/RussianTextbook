    第 1、3、5、7、9、11、13、15、17 题：“某人某处疼”，身体部位是主语：现在时单数 [боли́т]{.ru}，复数 [но́ги, глаза́, у́ши]{.ru} 用 [боля́т]{.ru}；过去时跟部位的性数一致：[голова́ боле́ла, го́рло боле́ло, живо́т боле́л, у́хо боле́ло, но́ги боле́ли, спина́ боле́ла, се́рдце боле́ло]{.ru}。
    第 2、4、6、8、10、12、14、16、18 题：人是主语，“生病”按第一变位：[боле́ю, боле́ешь, боле́ет, боле́ем, боле́ете, боле́ют]{.ru}；过去时跟人的性数一致：[Ми́ша боле́л, А́нна боле́ла, я（由美）боле́ла]{.ru}。两个动词过去时形式相同，只能看主语区分。
- id: L90-07
  tags:
  - 单元复习：свой 与 её 的所有者关系
  task: 安娜和由美在宿舍里。看 [свой]{.ru} 和 [её]{.ru}，判断东西是谁的。
  type: classify
  bins:
  - 安娜的
  - 由美的
  items:
  - text: А́нна взяла́ свою́ су́мку.
    answer: 安娜的
  - text: А́нна взяла́ её су́мку.
    answer: 由美的
  - text: Ю́ми и́щет свой слова́рь.
    answer: 由美的
  - text: Ю́ми и́щет её слова́рь.
    answer: 安娜的
  - text: А́нна звони́т свое́й ма́ме.
    answer: 安娜的
  - text: Ю́ми говори́т с её ма́мой.
    answer: 安娜的
  - text: А́нна чита́ет её письмо́.
    answer: 由美的
  - text: Ю́ми пи́шет в свое́й тетра́ди.
    answer: 由美的
  - text: А́нна даёт Ю́ми свою́ ру́чку.
    answer: 安娜的
  - text: А́нна даёт Ю́ми её ру́чку.
    answer: 由美的
  - text: Ю́ми рассказа́ла А́нне о свое́й семье́.
    answer: 由美的
  - text: Ю́ми рассказа́ла А́нне о её бра́те.
    answer: 安娜的
  - text: Ю́ми взяла́ её зонт.
    answer: 安娜的
  - text: А́нна сиди́т за свои́м столо́м.
    answer: 安娜的
  why: '第 1、3、5、8、9、11、14 题：[свой]{.ru} 指主语，东西属于主语：主语是安娜就是安娜的，主语是由美就是由美的。

    第 2、4、6、7、10、12、13 题：[её]{.ru} 指主语以外的另一个女性：主语是安娜，[её]{.ru} 指由美；主语是由美，[её]{.ru} 指安娜。第 10、12 题另一个人在句中出现（[Ю́ми, А́нне]{.ru}），但不是主语，只能用 [её]{.ru}。'
