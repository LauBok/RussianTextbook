    第 6、7、9–12 题：短尾阴性重音在词尾，比较级重音在 [-е́е]{.ru}：[вкусне́е, холодне́е, тепле́е, быстре́е, трудне́е, важне́е]{.ru}；第 5、8、15 题短尾阴性重音在词干，比较级保留：[краси́вее, интере́снее, ую́тнее]{.ru}。副词 [интере́сно, бы́стро]{.ru} 的比较级与形容词相同。'
- id: L90-03
  tags:
  - 单元复习：свой + 形容词 + 名词的变格
  task: 把 [свой]{.ru} 词组变成指定的格（第六格前置词已印出）。
  type: matrix
  cols:
  - 词组
  - 指定的格
  given:
  - 0
  rows:
  - base: '[свой ста́рший брат]{.ru}'
    cells:
    - '[свой ста́рший брат]{.ru}'
    - '[своему́ ста́ршему бра́ту]{.ru}'
    hint: 第三格
  - base: '[своя́ но́вая ко́мната]{.ru}'
    cells:
    - '[своя́ но́вая ко́мната]{.ru}'
    - '[в свое́й но́вой ко́мнате]{.ru}'
    hint: 第六格
  - base: '[своё ста́рое пальто́]{.ru}'
    cells:
    - '[своё ста́рое пальто́]{.ru}'
    - '[своё ста́рое пальто́]{.ru}'
    hint: 第四格
  - base: '[свой ста́рый друг]{.ru}'
    cells:
    - '[свой ста́рый друг]{.ru}'
    - '[свои́м ста́рым дру́гом]{.ru}'
    hint: 第五格
  - base: '[своя́ ма́ленькая сестра́]{.ru}'
    cells:
    - '[своя́ ма́ленькая сестра́]{.ru}'
    - '[свою́ ма́ленькую сестру́]{.ru}'
    hint: 第四格
  - base: '[свой но́вый телефо́н]{.ru}'
    cells:
    - '[свой но́вый телефо́н]{.ru}'
    - '[своего́ но́вого телефо́на]{.ru}'
    hint: 第二格
  - base: '[своя́ люби́мая кни́га]{.ru}'
    cells:
    - '[своя́ люби́мая кни́га]{.ru}'
    - '[свое́й люби́мой кни́гой]{.ru}'
    hint: 第五格
  - base: '[свой хоро́ший учи́тель]{.ru}'
    cells:
    - '[свой хоро́ший учи́тель]{.ru}'
    - '[своего́ хоро́шего учи́теля]{.ru}'
    hint: 第四格
  - base: '[своё здоро́вье]{.ru}'
    cells:
    - '[своё здоро́вье]{.ru}'
    - '[о своём здоро́вье]{.ru}'
    hint: 第六格
  - base: '[своя́ ста́ршая сестра́]{.ru}'
    cells:
    - '[своя́ ста́ршая сестра́]{.ru}'
    - '[свое́й ста́ршей сестры́]{.ru}'
    hint: 第二格
  - base: '[свой мла́дший брат]{.ru}'
    cells:
    - '[свой мла́дший брат]{.ru}'
    - '[свои́м мла́дшим бра́том]{.ru}'
    hint: 第五格
  - base: '[своя́ шко́льная учи́тельница]{.ru}'
    cells:
    - '[своя́ шко́льная учи́тельница]{.ru}'
    - '[свое́й шко́льной учи́тельнице]{.ru}'
    hint: 第三格
  why: '[свой]{.ru} 和形容词、名词一起变，三者的性数格一致。

    第 1、4、6、8、11 题：阳性：第二格 [своего́ но́вого телефо́на]{.ru}，第三格 [своему́ ста́ршему бра́ту]{.ru}，第五格 [свои́м ста́рым дру́гом]{.ru}；第 8 题 [учи́тель]{.ru} 是动物名词，第四格同第二格：[своего́ хоро́шего учи́теля]{.ru}。第 11 题 [мла́дший]{.ru} 的 [ш]{.ru} 后第五格写 [-им]{.ru}。

    第 2、5、7、10、12 题：阴性：第四格 [свою́ ма́ленькую сестру́]{.ru}，其余各格 [свое́й]{.ru} + 形容词 [-ой / -ей]{.ru}：[ста́ршей]{.ru} 的 [ш]{.ru} 后不带重音写 [-ей]{.ru}。

    第 3、9 题：中性第四格同第一格；[пальто́]{.ru} 不变格，修饰语照样变。第六格 [о своём здоро́вье]{.ru}。'
- id: L90-04
  tags:
  - 单元复习：多点句中填空
  task: 用括号里词的正确形式填空。
  type: fill
  items:
  - stem: Я ___ в семь часо́в.
    hint: встава́ть
    accept:
    - встаю́
  - stem: Вчера́ у Ми́ши ___ го́рло.
    hint: боле́ть
    accept:
    - боле́ло
  - stem: А́нна говори́т по-ру́сски ___, чем я.
    hint: хорошо́
    accept:
    - лу́чше
  - stem: Ми́ша и́щет ___ телефо́н.
    hint: свой
    accept:
    - свой
  - stem: Е́сли за́втра ___ хо́лодно, мы бу́дем до́ма.
    hint: быть
    accept:
    - бу́дет
  - stem: Когда́ я ___, я позвоню́ тебе́.
    hint: поза́втракать
    accept:
    - поза́втракаю
  - stem: Вчера́ Ю́ми была́ ___.
    hint: бо́лен
    accept:
    - больна́
  - stem: Па́па спроси́л Ми́шу, ___ ли он уро́ки.
    hint: сде́лать
    accept:
    - сде́лал
  - stem: Де́ти ___ спать в де́вять.
    hint: ложи́ться
    accept:
    - ложа́тся
  - stem: Ван Лэй даёт Ми́ше ___ тетра́дь.
    hint: свой
    accept:
    - свою́
  - stem: У меня́ ___ глаза́.
    hint: боле́ть
    accept:
    - боля́т
  - stem: Пеки́н ___, чем Москва́.
    hint: большо́й
    accept:
    - бо́льше
  - stem: Ты ча́сто ___?
    hint: устава́ть
    accept:
    - устаёшь
  - stem: Ка́тя сказа́ла, что ___ ве́чером.
    hint: позвони́ть
    accept:
    - позвони́т
  - stem: Вы давно́ ___?
    hint: боле́ть
    accept:
    - боле́ете
  - stem: Ми́ша, ___! Уже́ семь часо́в.
    hint: встава́ть
    accept:
    - встава́й
  - stem: Сего́дня в Москве́ ___, чем вчера́.
    hint: тепло́
    accept:
    - тепле́е
  - stem: Мы ___ домо́й в шесть.
    hint: возвраща́ться
    accept:
    - возвраща́емся
  - stem: Пьер говори́т о ___ ма́ме.
    hint: свой
    accept:
    - свое́й
  - stem: Е́сли ты уста́нешь, ___ спать.
    hint: ложи́ться
    accept:
    - ложи́сь
  - stem: Ба́бушка уже́ ___.
    hint: здоро́в
    accept:
    - здоро́ва
  - stem: Я не зна́ю, ___ ли за́втра контро́льная.
    hint: быть
    accept:
    - бу́дет
  - stem: Ты ___ в во́семь часо́в?
    hint: встава́ть
    accept:
    - встаёшь
  - stem: Вчера́ ве́чером у меня́ ___ голова́.
    hint: боле́ть
    accept:
    - боле́ла
  - stem: Ю́ми говори́т по-ру́сски ___, чем Пьер.
    hint: ме́дленно
    accept:
    - ме́дленнее
  - stem: Ми́ша забо́тится о ___ ко́шке.
    hint: свой
    accept:
    - свое́й
  - stem: Е́сли ты ___ ра́но, позвони́ мне.
    hint: встать
    accept:
    - вста́нешь
  - stem: Ма́ма спроси́ла А́нну, ___ ли она́.
    hint: уста́ть
    accept:
    - уста́ла
  - stem: Ле́том в Москве́ ___, чем зимо́й.
    hint: ве́село
    accept:
    - веселе́е
  - stem: Ми́ша, не ___ так по́здно!
    hint: ложи́ться
    accept:
    - ложи́сь
  - stem: Ве́чером мы о́чень ___.
    hint: устава́ть
    accept:
    - устаём
  why: |-
    第 1、13、16、23、31 题：[-ава́ть]{.ru} 类现在时去掉 [-ва-]{.ru}：[встаю́, устаёшь, встаёшь, устаём]{.ru}；命令式保留：[встава́й]{.ru}。第 9、18、20、30 题：[-ся]{.ru} 动词 [ложа́тся, возвраща́емся]{.ru}，命令式 [ложи́сь, не ложи́сь]{.ru}（元音后 [-сь]{.ru}）。
    第 2、11、15、24 题：“疼”跟身体部位配合：[го́рло боле́ло, глаза́ боля́т, голова́ боле́ла]{.ru}；“生病”主语是人：[вы боле́ете]{.ru}。第 7、21 题短尾阴性 [больна́, здоро́ва]{.ru}。
    第 3、12、17、25、29 题：比较级 [лу́чше, бо́льше, тепле́е, ме́дленнее, веселе́е]{.ru}，不随性数变化。第 4、10、19、26 题：[свой]{.ru} 跟名词配合：[свой телефо́н, свою́ тетра́дь, о свое́й ма́ме, о свое́й ко́шке]{.ru}。
    第 5、6、27 题：说将来的事，[е́сли]{.ru}、[когда́]{.ru} 从句用将来时：[бу́дет, поза́втракаю, вста́нешь]{.ru}。第 8、14、28 题：转述时人称改变，时不变：[сде́лал ли он]{.ru}，[что позвони́т]{.ru}，[уста́ла ли она́]{.ru}（问的是安娜，用阴性）。第 22 题：问的是“有没有测验”，焦点词 [бу́дет]{.ru} 放在 [ли]{.ru} 前。
- id: L90-05
  tags:
  - 单元复习：跨知识点核查
  task: 判断句子是否正确。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Я встава́ю в семь.
    answer: 有错
  - text: У меня́ боли́т у́ши.
    answer: 有错
  - text: Москва́ бо́льше, чем Петербу́рг.
    answer: 正确
  - text: Своя́ ма́ма живёт в Пеки́не.
    answer: 有错
  - text: Е́сли бу́дет дождь, мы бу́дем до́ма.
    answer: 正确
  - text: Она́ спроси́ла, ли я здоро́в.
    answer: 有错
  - text: Я до́ма, потому́ что идёт дождь.
    answer: 正确
  - text: Потому́ что шёл дождь, поэ́тому я был до́ма.
    answer: 有错
  - text: Вчера́ у него́ боле́ло го́рло.
    answer: 正确
  - text: Когда́ я поза́втракаю, я позвоню́ тебе́.
    answer: 正确
  - text: А́нна была́ бо́лен.
    answer: 有错
  - text: Ми́ша ложи́тся спать в де́сять.
    answer: 正确
  - text: Ка́тя сказа́ла, что позвони́т ве́чером.
    answer: 正确
  - text: Э́та ко́мната бо́льшая, чем та.
    answer: 有错
  - text: Ван Лэй боли́т.
    answer: 有错
  - text: Де́ти одева́ются.
    answer: 正确
  why: '第 3、5、7、9、10、12、13、16 题：正确。

    第 1 题：[встава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[встаю́]{.ru}。第 2 题：[у́ши]{.ru} 是复数，用 [боля́т]{.ru}。第 4 题：[свой]{.ru} 不修饰主语，应为 [Моя́ / Его́ ма́ма]{.ru}。第 6 题：[ли]{.ru} 跟在焦点词后：[здоро́в ли я]{.ru}。

    第 8 题：[потому́ что]{.ru} 和 [поэ́тому]{.ru} 只能选一个。第 11 题：阴性主语用 [была́ больна́]{.ru}。第 14 题：比较级不变化，应为 [бо́льше]{.ru}。第 15 题：人不能作“疼”的主语；“王磊病了”说 [Ван Лэй боле́ет]{.ru}，“王磊头疼”说 [У Ван Лэ́я боли́т голова́]{.ru}。'
- id: L90-06
  tags:
  - 单元复习：两个 боле́ть 的现在时与过去时
  task: 写出“疼”或“生病”的现在时和过去时。
  type: matrix
  cols:
  - 主语
  - 现在时
  - 过去时
  given:
  - 0
  rows:
  - base: '[у меня́]{.ru} + [голова́]{.ru}'
    cells:
    - '[у меня́]{.ru} + [голова́]{.ru}'
    - '[боли́т]{.ru}'
    - '[боле́ла]{.ru}'
  - base: '[Ми́ша]{.ru}（生病）'
    cells:
    - '[Ми́ша]{.ru}（生病）'
