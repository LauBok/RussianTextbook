    第 1、2、7、8 题：阳性 [шёл][.ru]{.ru}；第 3、11、12 题：阴性 [шла][.ru]{.ru}；第 5 题：[вре́мя][.ru]{.ru} 是中性，[шло][.ru]{.ru}。
    第 4、6、9、10 题：复数 [иду́т, шли][.ru]{.ru}；[дела́, заня́тия, перегово́ры][.ru]{.ru} 都是复数。
- id: B2-L44-03
  tags:
  - 运动动词转义（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Как бы́стро ___ вре́мя! Уже́ ию́нь.
    hint: идти́
    accept:
    - идёт
    - лети́т
  - stem: Мы вы́шли из до́ма, и вдруг ___ дождь.
    hint: пойти́
    accept:
    - пошёл
  - stem: — Как ___ дела́? — Спаси́бо, хорошо́.
    hint: идти́
    accept:
    - иду́т
  - stem: Вчера́ весь день ___ снег.
    hint: идти́
    accept:
    - шёл
  - stem: Дождь ___ , и мы пошли́ гуля́ть.
    hint: пройти́
    accept:
    - прошёл
  - stem: ___ два го́да, и Ван Лэй верну́лся в Пеки́н.
    hint: пройти́
    accept:
    - Прошло́
  - stem: Ско́ро ___ весна́, и бу́дет тепло́.
    hint: прийти́
    accept:
    - придёт
  - stem: Сейча́с по телеви́зору ___ футбо́л.
    hint: идти́
    accept:
    - идёт
  - stem: Пра́здники ___ , и на́до опя́ть учи́ться.
    hint: пройти́
    accept:
    - прошли́
  - stem: Когда́ мы е́хали на да́чу, ___ си́льный дождь.
    hint: идти́
    accept:
    - шёл
  - stem: Пара́д ___ два часа́.
    hint: идти́
    accept:
    - шёл
  - stem: Ле́то ___ о́чень бы́стро.
    hint: пройти́
    accept:
    - прошло́
  - stem: Когда́ мы пришли́ в кинотеа́тр, фильм уже́ ___ .
    hint: идти́
    accept:
    - шёл
  - stem: По́сле того́ дня ___ мно́го лет.
    hint: пройти́
    accept:
    - прошло́
  - stem: Вчера́ ___ пе́рвый снег.
    hint: пойти́
    accept:
    - пошёл
  - stem: 'Лю́ди стоя́ли под зонта́ми: ___ дождь.'
    hint: идти́
    accept:
    - шёл
  why: |-
    第 1、3、8 题：此刻在进行，用 [идёт / иду́т]{.ru}：[вре́мя идёт]{.ru}（也说 [вре́мя лети́т]{.ru}），[как иду́т дела́]{.ru}，[идёт футбо́л]{.ru}。[дела́]{.ru} 是复数，用 [иду́т]{.ru}。
    第 4、10、11 题：过去持续，用 [шёл]{.ru}：[весь день шёл снег, пара́д шёл два часа́]{.ru}。
    第 2 题：开始下雨：[пошёл дождь]{.ru}。
    第 5、9、12 题：结束、过去了：[дождь прошёл, пра́здники прошли́, ле́то прошло́]{.ru}。
    第 6 题：[два го́да]{.ru} 作主语，谓语用中性单数：[прошло́ два го́да]{.ru}。
    第 7 题：将来来到，用完成体将来时：[придёт]{.ru}。
    第 13、16 题：那时正在进行：[фильм уже́ шёл, шёл дождь]{.ru}。
    第 14 题：[мно́го лет]{.ru} 作主语，谓语用中性单数 [прошло́]{.ru}。
    第 15 题：开始下：[пошёл пе́рвый снег]{.ru}。
