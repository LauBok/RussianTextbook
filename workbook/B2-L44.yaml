heading: 第 44 课　运动动词的转义
groups:
- id: B2-L44-01
  tags:
  - 运动动词转义：意义
  task: 按句子说的情况归栏。
  type: classify
  bins:
  - 正在进行
  - 那时持续
  - 开始
  - 结束、过去了
  - 来到
  items:
  - text: '[За окно́м идёт снег.]{.ru}'
    answer: 正在进行
  - text: '[По телеви́зору идёт но́вый фильм.]{.ru}'
    answer: 正在进行
  - text: '[Ти́ше, идёт уро́к!]{.ru}'
    answer: 正在进行
  - text: '[Весь ве́чер шёл снег.]{.ru}'
    answer: 那时持续
  - text: '[Конце́рт шёл три часа́.]{.ru}'
    answer: 那时持续
  - text: '[Когда́ мы гуля́ли, шёл дождь.]{.ru}'
    answer: 那时持续
  - text: '[Вдруг пошёл дождь.]{.ru}'
    answer: 开始
  - text: '[По́сле обе́да пошёл снег.]{.ru}'
    answer: 开始
  - text: '[Мы бы́ли в па́рке, и пошёл си́льный дождь.]{.ru}'
    answer: 开始
  - text: '[Дождь уже́ прошёл.]{.ru}'
    answer: 结束、过去了
  - text: '[Прошла́ неде́ля.]{.ru}'
    answer: 结束、过去了
  - text: '[Пра́здники прошли́ о́чень бы́стро.]{.ru}'
    answer: 结束、过去了
  - text: '[Пришла́ весна́.]{.ru}'
    answer: 来到
  - text: '[Наконе́ц пришло́ ле́то.]{.ru}'
    answer: 来到
  - text: '[Пришёл Но́вый год.]{.ru}'
    answer: 来到
  why: |-
    第 1–3 题：定向动词现在时 [идёт]{.ru} 说此刻正在下雪、放映、上课。
    第 4–6 题：过去时 [шёл]{.ru} 说那时持续着（[весь ве́чер, три часа́]{.ru}，或者和别的事同时）。
    第 7–9 题：[пошёл]{.ru} 说开始下起来，常和 [вдруг]{.ru} 连用。
    第 10–12 题：[пройти́]{.ru} 说雨停了、时间过去了。
    第 13–15 题：[прийти́]{.ru} 说季节、节日来到。
    注意这些说法都用定向动词或它的前缀动词，不能换成 [хо́дит]{.ru}。
- id: B2-L44-02
  tags:
  - 运动动词转义：过去时性数
  task: 写出动词的过去时。
  type: matrix
  cols:
  - 主语 + 动词
  - 过去时
  given:
  - 0
  rows:
  - base: '[дождь + пойти́]{.ru}'
    cells:
    - '[дождь + пойти́]{.ru}'
    - '[пошёл]{.ru}'
  - base: '[неде́ля + пройти́]{.ru}'
    cells:
    - '[неде́ля + пройти́]{.ru}'
    - '[прошла́]{.ru}'
  - base: '[пра́здники + пройти́]{.ru}'
    cells:
    - '[пра́здники + пройти́]{.ru}'
    - '[прошли́]{.ru}'
  - base: '[вре́мя + пройти́]{.ru}'
    cells:
    - '[вре́мя + пройти́]{.ru}'
    - '[прошло́]{.ru}'
  - base: '[весна́ + прийти́]{.ru}'
    cells:
    - '[весна́ + прийти́]{.ru}'
    - '[пришла́]{.ru}'
  - base: '[снег + пойти́]{.ru}'
    cells:
    - '[снег + пойти́]{.ru}'
    - '[пошёл]{.ru}'
  - base: '[ле́то + прийти́]{.ru}'
    cells:
    - '[ле́то + прийти́]{.ru}'
    - '[пришло́]{.ru}'
  - base: '[фильм + идти́]{.ru}'
    cells:
    - '[фильм + идти́]{.ru}'
    - '[шёл]{.ru}'
  - base: '[кани́кулы + пройти́]{.ru}'
    cells:
    - '[кани́кулы + пройти́]{.ru}'
    - '[прошли́]{.ru}'
  - base: '[уро́к + идти́]{.ru}'
    cells:
    - '[уро́к + идти́]{.ru}'
    - '[шёл]{.ru}'
  - base: '[зима́ + прийти́]{.ru}'
    cells:
    - '[зима́ + прийти́]{.ru}'
    - '[пришла́]{.ru}'
  - base: '[год + пройти́]{.ru}'
    cells:
    - '[год + пройти́]{.ru}'
    - '[прошёл]{.ru}'
  - base: '[дела́ + идти́]{.ru}'
    cells:
    - '[дела́ + идти́]{.ru}'
    - '[шли]{.ru}'
  - base: '[вре́мя + лете́ть]{.ru}'
    cells:
    - '[вре́мя + лете́ть]{.ru}'
    - '[лете́ло]{.ru}'
  - base: '[о́сень + прийти́]{.ru}'
    cells:
    - '[о́сень + прийти́]{.ru}'
    - '[пришла́]{.ru}'
    hint: f
  - base: '[экза́мены + идти́]{.ru}'
    cells:
    - '[экза́мены + идти́]{.ru}'
    - '[шли]{.ru}'
  - base: '[ме́сяц + пройти́]{.ru}'
    cells:
    - '[ме́сяц + пройти́]{.ru}'
    - '[прошёл]{.ru}'
  - base: '[пра́здник + прийти́]{.ru}'
    cells:
    - '[пра́здник + прийти́]{.ru}'
    - '[пришёл]{.ru}'
  why: |-
    过去时跟主语的性数一致：阳性 [-шёл]{.ru}，阴性 [-шла́]{.ru}，中性 [-шло́]{.ru}，复数 [-шли́]{.ru}。
    第 1、6、8、10、12、17、18 题：阳性：[пошёл, шёл, прошёл, пришёл]{.ru}。
    第 2、5、11、15 题：阴性：[прошла́, пришла́]{.ru}；[о́сень]{.ru} 是阴性。
    第 4、7、14 题：中性：[вре́мя прошло́, ле́то пришло́, вре́мя лете́ло]{.ru}。[вре́мя]{.ru} 虽然以 [-я]{.ru} 结尾，却是中性，常错成 [прошла́]{.ru}。
    第 3、9、13、16 题：复数：[прошли́, шли]{.ru}；[кани́кулы]{.ru} 只有复数。
- id: B2-L44-03
  tags:
  - 运动动词转义（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Как бы́стро ___ вре́мя! Уже́ ию́нь.
    hint: идти́
    accept:
    - идёт
    - лети́т
  - stem: Мы вы́шли из до́ма, и вдруг ___ дождь.
    hint: пойти́
    accept:
    - пошёл
  - stem: — Как ___ дела́? — Спаси́бо, хорошо́.
    hint: идти́
    accept:
    - иду́т
  - stem: Вчера́ весь день ___ снег.
    hint: идти́
    accept:
    - шёл
  - stem: Дождь ___ , и мы пошли́ гуля́ть.
    hint: пройти́
    accept:
    - прошёл
  - stem: ___ два го́да, и Ван Лэй верну́лся в Пеки́н.
    hint: пройти́
    accept:
    - Прошло́
  - stem: Ско́ро ___ весна́, и бу́дет тепло́.
    hint: прийти́
    accept:
    - придёт
  - stem: Сейча́с по телеви́зору ___ футбо́л.
    hint: идти́
    accept:
    - идёт
  - stem: Пра́здники ___ , и на́до опя́ть учи́ться.
    hint: пройти́
    accept:
    - прошли́
  - stem: Когда́ мы е́хали на да́чу, ___ си́льный дождь.
    hint: идти́
    accept:
    - шёл
  - stem: Пара́д ___ два часа́.
    hint: идти́
    accept:
    - шёл
  - stem: Ле́то ___ о́чень бы́стро.
    hint: пройти́
    accept:
    - прошло́
  why: |-
    第 1、3、8 题：此刻在进行，用 [идёт / иду́т]{.ru}：[вре́мя идёт]{.ru}（也说 [вре́мя лети́т]{.ru}），[как иду́т дела́]{.ru}，[идёт футбо́л]{.ru}。[дела́]{.ru} 是复数，用 [иду́т]{.ru}。
    第 4、10、11 题：过去持续，用 [шёл]{.ru}：[весь день шёл снег, пара́д шёл два часа́]{.ru}。
    第 2 题：开始下雨：[пошёл дождь]{.ru}。
    第 5、9、12 题：结束、过去了：[дождь прошёл, пра́здники прошли́, ле́то прошло́]{.ru}。
    第 6 题：[два го́да]{.ru} 作主语，谓语用中性单数：[прошло́ два го́да]{.ru}。
    第 7 题：将来来到，用完成体将来时：[придёт]{.ru}。
