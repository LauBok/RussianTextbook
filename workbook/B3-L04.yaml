  why: |-
    第 1–12 题：主动形动词由过去时词干构成（[написа́л → написа́вший]{.ru}，[спас → спа́сший]{.ru}，[принёс → принёсший]{.ru}），交替和重音移动都不出现；被动形动词按三种方式构成，[-ить]{.ru} 动词的交替同单数第一人称：[куплю́ → ку́пленный]{.ru}，[встре́чу → встре́ченный]{.ru}，[пригото́влю → пригото́вленный]{.ru}。
    第 1、5、9 题：被动形动词的重音前移：[напи́санный, поте́рянный, и́зданный]{.ru}；主动形动词的重音同不定式：[написа́вший, потеря́вший, изда́вший]{.ru}。
    第 7、14 题：[нача́ть, заня́ть]{.ru} 用 [-т-]{.ru}，重音移到前缀：[на́чатый, за́нятый]{.ru}；主动形动词 [нача́вший, заня́вший]{.ru}。
    第 13 题：[решу́ → решённый]{.ru}，重音在后缀上，写 [ё]{.ru}。
    第 4、8、12 题：辅音词干动词：主动 [спа́сший, принёсший, приве́дший]{.ru}，被动 [спасённый, принесённый, приведённый]{.ru}（由 [спасу́, принесу́, приведу́]{.ru} 构成，重音在后缀上）。
    两种形动词说明的对象不同：[челове́к, купи́вший кни́гу]{.ru} 买书的人；[кни́га, ку́пленная челове́ком]{.ru} 被人买下的书。
- id: B3-L04-03
  lessons:
  - B3-L04
  tags:
  - 被动形动词过去时：-нн- 与 -н-
  task: 空位该写 [н]{.ru} 还是 [нн]{.ru}？把词组归栏。
  type: classify
  bins:
  - н
  - нн
  items:
  - text: '[ра́не… солда́т]{.ru}'
    answer: н
  - text: '[ра́не… в ру́ку солда́т]{.ru}'
    answer: нн
  - text: '[тяжело́ ра́не… солда́т]{.ru}'
    answer: нн
  - text: '[жа́ре… ры́ба]{.ru}'
    answer: н
    new: true
    gloss: жа́рить 煎，炸
  - text: '[зажа́ре… ры́ба]{.ru}'
    answer: нн
  - text: '[жа́ре… на ма́сле ры́ба]{.ru}'
    answer: нн
  - text: '[прочи́та… кни́га]{.ru}'
    answer: нн
  - text: '[варё… карто́шка]{.ru}'
    answer: н
    new: true
    gloss: вари́ть 煮
  - text: '[сва́ре… карто́шка]{.ru}'
    answer: нн
  - text: '[кра́ше… дверь]{.ru}'
    answer: н
  - text: '[покра́ше… дверь]{.ru}'
    answer: нн
  - text: '[кра́ше… бра́том дверь]{.ru}'
    answer: нн
  - text: '[сушё… грибы́]{.ru}'
    answer: н
    new: true
    gloss: суши́ть 晒干，烘干
  - text: '[вы́суше… на со́лнце грибы́]{.ru}'
    answer: нн
  - text: '[решё… зада́ча]{.ru}'
    answer: нн
  - text: '[солё… огурцы́]{.ru}'
    answer: н
  why: |-
    第 1、4、8、10、13、16 题：未完成体动词（[ра́нить, жа́рить, вари́ть, кра́сить, суши́ть, соли́ть]{.ru}）的派生词，不带前缀，也不带任何从属词，是形容词，写一个 [н]{.ru}：[ра́неный солда́т, жа́реная ры́ба, варёная карто́шка, кра́шеная дверь, сушёные грибы́, солёные огурцы́]{.ru}。
    第 2、3、6、12、14 题：带了补语或状语（[в ру́ку, тяжело́, на ма́сле, бра́том, на со́лнце]{.ru}）就是形动词，写 [нн]{.ru}：[ра́ненный в ру́ку, тяжело́ ра́ненный, жа́ренная на ма́сле, кра́шенная бра́том]{.ru}。
    第 5、7、9、11、14、15 题：带前缀或由完成体构成的是形动词，写 [нн]{.ru}：[зажа́ренная, прочи́танная, сва́ренная, покра́шенная, вы́сушенные, решённая]{.ru}。
- id: B3-L04-04
  lessons:
  - B3-L04
  tags:
  - 被动形动词过去时：句中填空
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Мы ещё ду́маем о пробле́ме, ___ на уро́ке.
    hint: обсуди́ть
    accept:
    - обсуждённой
  - stem: Я нашёл ключи́, ___ сестро́й.
    hint: потеря́ть
    accept:
    - поте́рянные
  - stem: Тури́сты осма́тривали собо́р, ___ в XVI ве́ке.
    hint: созда́ть
    accept:
    - со́зданный
  - stem: Ма́ма поста́вила на стол торт, ___ в магази́не.
    hint: купи́ть
    accept:
    - ку́пленный
  - stem: Он показа́л нам письмо́, ___ ему́ из Пари́жа.
    hint: присла́ть
    accept:
    - при́сланное
    new: true
    gloss: 寄来
  - stem: Студе́нты отве́тили на все вопро́сы, ___ преподава́телем.
    hint: зада́ть
    accept:
    - за́данные
  - stem: Мы вошли́ в ___ дверь.
    hint: откры́ть
    accept:
    - откры́тую
  - stem: Он до́лго смотре́л на ___ окно́.
    hint: разби́ть
    accept:
    - разби́тое
    new: true
    gloss: 打碎
  - stem: Э́то рома́н, ___ на мно́го языко́в.
    hint: перевести́
    accept:
    - переведённый
  - stem: Ученики́ сда́ли рабо́ты, ___ без оши́бок.
    hint: написа́ть
    accept:
    - напи́санные
  - stem: Па́па чита́л статью́, ___ в сего́дняшней газе́те.
    hint: опубликова́ть
    accept:
    - опублико́ванную
  - stem: Мы ча́сто вспомина́ем дни, ___ на мо́ре.
    hint: провести́
    accept:
    - проведённые
  why: |-
    第 1、9、12 题：[-ённ-]{.ru}：[обсужу́ → обсуждённой]{.ru}（交替 [д → жд]{.ru}），[переведу́ → переведённый]{.ru}，[проведу́ → проведённые]{.ru}。
    第 2、3、5、6、10、11 题：[-ать, -ять]{.ru} 动词重音前移：[поте́рянные, со́зданный, при́сланное, за́данные, напи́санные, опублико́ванную]{.ru}（[-ова-]{.ru} 动词重音不移）。
    第 4 题：[куплю́ → ку́пленный]{.ru}，交替 [п → пл]{.ru}。
    第 7、8 题：[-ыть]{.ru} 和单音节词根的动词用 [-т-]{.ru}：[откры́тую, разби́тое]{.ru}；单个形动词放在名词前。
    格看被说明的名词：第 1 题阴性第六格；第 2、6、10、12 题复数第四格（非动物）或第一格；第 3、4、9 题阳性非动物第四格或第一格；第 5、8 题中性第四格；第 7、11 题阴性第四格。
