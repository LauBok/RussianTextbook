  why: |-
    第 1、4、8、13、17 题：[-ать]{.ru} 动词去 [-ть]{.ru} 加 [-нный]{.ru}；重音在 [-а́-]{.ru} 上的前移一个音节：[расска́занный, нарисо́ванный, пока́занный, про́данный]{.ru}；[сде́ланный]{.ru} 本来就不在 [-а-]{.ru} 上，不移。
    第 2、5、6、10、11、14、15、18、20、21 题：[-ить, -еть]{.ru} 动词和辅音词干动词用 [-енн- / -ённ-]{.ru}，交替同单数第一人称：[пригото́влю → пригото́вленный]{.ru}，[приглашу́ → приглашённый]{.ru}，[освобожу́ → освобождённый]{.ru}，[отпра́влю → отпра́вленный]{.ru}，[оплачу́ → опла́ченный]{.ru}，[защищу́ → защищённый]{.ru}。重音落在后缀上时写 [ё]{.ru}：[приглашённый, переведённый, освобождённый, защищённый]{.ru}；[переведённый, на́йденный]{.ru} 由 [переведу́, найду́]{.ru} 的词干构成。
    第 3、7、12、16、22 题：[-ыть, -уть]{.ru} 动词和单音节词根的动词用 [-т-]{.ru}：[закры́тый, оде́тый, уби́тый, повёрнутый, сши́тый]{.ru}；[повёрнутый]{.ru} 的重音在词干，写 [ё]{.ru}。
    第 9、19 题：[прие́хать, верну́ться]{.ru} 是不及物动词，不能带第四格宾语，没有被动形动词，写“—”。
