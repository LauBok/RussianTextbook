    - '[я люблю́]{.ru}'
  - base: '[ты хоти́шь]{.ru}'
    cells:
    - '[ты хоти́шь]{.ru}'
    - '[ты хо́чешь]{.ru}'
  - base: '[я любю́]{.ru}'
    cells:
    - '[я любю́]{.ru}'
    - '[я люблю́]{.ru}'
  - base: '[он мо́гет]{.ru}'
    cells:
    - '[он мо́гет]{.ru}'
    - '[он мо́жет]{.ru}'
  - base: '[вы уме́ете]{.ru}'
    cells:
    - '[вы уме́ете]{.ru}'
    - '[вы уме́ете]{.ru}'
  - base: '[они́ хотя́т]{.ru}'
    cells:
    - '[они́ хотя́т]{.ru}'
    - '[они́ хотя́т]{.ru}'
  - base: '[я мо́жу]{.ru}'
    cells:
    - '[я мо́жу]{.ru}'
    - '[я могу́]{.ru}'
  - base: '[она́ лю́бит]{.ru}'
    cells:
    - '[она́ лю́бит]{.ru}'
    - '[она́ лю́бит]{.ru}'
  - base: '[мы мо́жем]{.ru}'
    cells:
    - '[мы мо́жем]{.ru}'
    - '[мы мо́жем]{.ru}'
  - base: '[он хоти́т]{.ru}'
    cells:
    - '[он хоти́т]{.ru}'
    - '[он хо́чет]{.ru}'
  - base: '[они́ лю́бют]{.ru}'
    cells:
    - '[они́ лю́бют]{.ru}'
    - '[они́ лю́бят]{.ru}'
  - base: '[я хо́чу]{.ru}'
    cells:
    - '[я хо́чу]{.ru}'
    - '[я хочу́]{.ru}'
  - base: '[вы мо́жете]{.ru}'
    cells:
    - '[вы мо́жете]{.ru}'
    - '[вы мо́жете]{.ru}'
  - base: '[ты лю́бишь]{.ru}'
    cells:
    - '[ты лю́бишь]{.ru}'
    - '[ты лю́бишь]{.ru}'
  - base: '[они́ уме́ют]{.ru}'
    cells:
    - '[они́ уме́ют]{.ru}'
    - '[они́ уме́ют]{.ru}'
  - base: '[я уме́ю]{.ru}'
    cells:
    - '[я уме́ю]{.ru}'
    - '[я уме́ю]{.ru}'
  why: '第 1、4、12、14 题：[хоте́ть]{.ru} 单数用 [ч]{.ru}、按第一变位：[хочу́, хо́чешь, хо́чет]{.ru}，复数用 [т]{.ru}、按第二变位：[хоти́м]{.ru}。第 14 题错在重音：[хочу́]{.ru} 重音在词尾。

    第 2、6、9 题：[мочь]{.ru} 的 [я]{.ru} 和 [они́]{.ru} 用 [г]{.ru}：[могу́, мо́гут]{.ru}，其余用 [ж]{.ru}：[мо́жет]{.ru}。

    第 5、13 题：[люби́ть]{.ru} 只在 [я]{.ru} 的形式插入 [л]{.ru}：[люблю́]{.ru}；[они́]{.ru} 的词尾是第二变位的 [-ят]{.ru}：[лю́бят]{.ru}。

    第 3、7、8、10、11、15–18 题：原本就对。'
- id: L27-综合-d
  tags:
  - 综合：情态动词按语境选择并变位
  recycles:
  - L26-03
  - L27-02
  - L27-03
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: 'Я не ___ игра́ть в ша́хматы, но хочу́ учи́ться.'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - уме́ю
  - stem: 'Сего́дня я не ___ игра́ть в футбо́л: я рабо́таю.'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - могу́
  - stem: '— Ты ___ пла́вать? — Да, я хорошо́ пла́ваю.'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - уме́ешь
  - stem: 'Вы ___ идти́ на конце́рт ве́чером? Ве́чером вы не рабо́таете?'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - мо́жете
  - stem: 'Ми́ша о́чень ___ футбо́л: он игра́ет ка́ждый день.'
    hint: '[люби́ть / хоте́ть]{.ru}'
    accept:
    - лю́бит
  - stem: Сейча́с я ___ пить.
    hint: '[люби́ть / хоте́ть]{.ru}'
    accept:
    - хочу́
  - stem: 'Мы ___ слу́шать кла́ссику и ча́сто хо́дим на конце́рты.'
    hint: '[люби́ть / хоте́ть]{.ru}'
    accept:
    - лю́бим
  - stem: 'Они́ живу́т в Пеки́не, но ___ жить в Москве́.'
    hint: '[люби́ть / хоте́ть]{.ru}'
    accept:
    - хотя́т
  - stem: Ба́бушка хорошо́ ___ гото́вить.
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - уме́ет
  - stem: 'Ве́чером мы не рабо́таем и ___ игра́ть в ша́хматы.'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - мо́жем
  - stem: 'Ты сейча́с ___ ко́фе и́ли чай?'
    hint: '[люби́ть / хоте́ть]{.ru}'
    accept:
    - хо́чешь
  - stem: 'Ю́ми изуча́ла ру́сский язы́к в Япо́нии и хорошо́ ___ говори́ть по-ру́сски.'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - уме́ет
  - stem: 'Па́па ___ смотре́ть хокке́й и всегда́ смо́трит его́.'
    hint: '[люби́ть / хоте́ть]{.ru}'
    accept:
    - лю́бит
  - stem: 'Сего́дня они́ не ___ пла́вать: вода́ холо́дная.'
    hint: '[уме́ть / мочь]{.ru}'
    accept:
    - мо́гут
  why: '第 1、3、9、12 题：学过、掌握了的本领用 [уме́ть]{.ru}：[уме́ю, уме́ешь, уме́ет]{.ru}。

    第 2、4、10、14 题：条件允许不允许用 [мочь]{.ru}：[могу́, мо́жете, мо́жем, мо́гут]{.ru}。第 14 题冒号后面说明了原因：水冷，不是不会。

    第 5、7、13 题：一贯的爱好用 [люби́ть]{.ru}：[лю́бит, лю́бим]{.ru}。

    第 6、8、11 题：愿望用 [хоте́ть]{.ru}：[хочу́, хотя́т, хо́чешь]{.ru}；第 8 题是长期的愿望。'
