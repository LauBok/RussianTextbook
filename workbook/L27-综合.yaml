heading: 综合练习　情态动词
lessons:
- L26
- L27
groups:
- id: L27-综合-a
  tags:
  - 综合：情态动词现在时
  recycles:
  - L26-01
  - L27-01
  task: 按主语写出四个动词的现在时。
  type: matrix
  cols:
  - 主语
  - '[люби́ть]{.ru}'
  - '[хоте́ть]{.ru}'
  - '[уме́ть]{.ru}'
  - '[мочь]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[люблю́]{.ru}'
    - '[хочу́]{.ru}'
    - '[уме́ю]{.ru}'
    - '[могу́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[лю́бишь]{.ru}'
    - '[хо́чешь]{.ru}'
    - '[уме́ешь]{.ru}'
    - '[мо́жешь]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[лю́бит]{.ru}'
    - '[хо́чет]{.ru}'
    - '[уме́ет]{.ru}'
    - '[мо́жет]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[лю́бим]{.ru}'
    - '[хоти́м]{.ru}'
    - '[уме́ем]{.ru}'
    - '[мо́жем]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[лю́бите]{.ru}'
    - '[хоти́те]{.ru}'
    - '[уме́ете]{.ru}'
    - '[мо́жете]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[лю́бят]{.ru}'
    - '[хотя́т]{.ru}'
    - '[уме́ют]{.ru}'
    - '[мо́гут]{.ru}'
  - base: '[Ми́ша и Ка́тя]{.ru}'
    cells:
    - '[Ми́ша и Ка́тя]{.ru}'
    - '[лю́бят]{.ru}'
    - '[хотя́т]{.ru}'
    - '[уме́ют]{.ru}'
    - '[мо́гут]{.ru}'
  - base: '[ба́бушка]{.ru}'
    cells:
    - '[ба́бушка]{.ru}'
    - '[лю́бит]{.ru}'
    - '[хо́чет]{.ru}'
    - '[уме́ет]{.ru}'
    - '[мо́жет]{.ru}'
  why: '第 1 题：四个 [я]{.ru} 的形式各有特点：[люблю́]{.ru} 插入 [л]{.ru}，[хочу́]{.ru} 是 [т → ч]{.ru}，[могу́]{.ru} 用 [г]{.ru}，只有 [уме́ю]{.ru} 完全规则。

    第 2、3、8 题：[хо́чешь, хо́чет]{.ru} 用 [ч]{.ru}、按第一变位；[мо́жешь, мо́жет]{.ru} 用 [ж]{.ru}。

    第 4–7 题：[хоти́м, хоти́те, хотя́т]{.ru} 按第二变位；[мо́гут]{.ru} 又回到 [г]{.ru}；[лю́бят]{.ru} 是第二变位 [-ят]{.ru}。'
- id: L27-综合-b
  tags:
  - 综合：喜好、愿望、能力、可能辨别
  recycles:
  - L26-03
  - L27-02
  task: 根据情景在四个动词中选择。
  type: classify
  bins:
  - '[люби́ть]{.ru}'
  - '[хоте́ть]{.ru}'
  - '[уме́ть]{.ru}'
  - '[мочь]{.ru}'
  items:
  - text: '[пла́вать]{.ru}：他学过游泳'
    answer: '[уме́ть]{.ru}'
  - text: '[пла́вать]{.ru}：他一有空就去游泳，这是他的爱好'
    answer: '[люби́ть]{.ru}'
  - text: '[пла́вать]{.ru}：天太热了，现在真想去游泳'
    answer: '[хоте́ть]{.ru}'
  - text: '[пла́вать]{.ru}：游泳池今天关门，游不了'
    answer: '[мочь]{.ru}'
  - text: '[игра́ть в ша́хматы]{.ru}：爷爷教会了米沙'
    answer: '[уме́ть]{.ru}'
  - text: '[игра́ть в ша́хматы]{.ru}：今晚没事，可以下一盘'
    answer: '[мочь]{.ru}'
  - text: '[слу́шать рок]{.ru}：哥哥一向爱听摇滚'
    answer: '[люби́ть]{.ru}'
  - text: '[пить ко́фе]{.ru}：困了，现在想喝杯咖啡'
    answer: '[хоте́ть]{.ru}'
  - text: '[гото́вить пи́ццу]{.ru}：学过怎么做比萨饼'
    answer: '[уме́ть]{.ru}'
  - text: '[идти́ в теа́тр]{.ru}：今晚要加班，去不了'
    answer: '[мочь]{.ru}'
  - text: '[чита́ть стихи́]{.ru}：她从小就爱读诗'
    answer: '[люби́ть]{.ru}'
  - text: '[отдыха́ть]{.ru}：累了，现在只想休息'
    answer: '[хоте́ть]{.ru}'
  - text: '[говори́ть по-япо́нски]{.ru}：由美的朋友学过日语'
    answer: '[уме́ть]{.ru}'
  - text: '[гуля́ть]{.ru}：雨停了，现在可以出去散步'
    answer: '[мочь]{.ru}'
  - text: '[смотре́ть футбо́л]{.ru}：爸爸每个周末都看，是老球迷'
    answer: '[люби́ть]{.ru}'
  - text: '[жить на да́че]{.ru}：奶奶的心愿是夏天住在别墅'
    answer: '[хоте́ть]{.ru}'
  why: '第 2、7、11、15 题：一贯的爱好，用 [люби́ть]{.ru}。

    第 3、8、12、16 题：想要做的事，多指现在，也可以是长期的愿望（第 16 题），用 [хоте́ть]{.ru}。

    第 1、5、9、13 题：学过、掌握了的本领，用 [уме́ть]{.ru}。

    第 4、6、10、14 题：条件允许或不允许，用 [мочь]{.ru}。第 1–4 题同是 [пла́вать]{.ru}，意思不同，动词就不同。'
