    hint: 问凉不凉
  why: '第 1–16 题：被问的词放在从句最前面，[ли]{.ru} 紧跟在它后面，其余部分放在后面：[Он спроси́л, до́ма ли Ми́ша.]{.ru}

    第 3、6、8、9、12、14 题：问“有没有、做没做”，焦点是谓语，谓语打头：[бу́дет ли конце́рт за́втра]{.ru}，[есть ли у Ю́ми слова́рь]{.ru}，[сде́лал ли Ми́ша упражне́ния]{.ru}。

    第 2、4、7、10、13 题：焦点换成别的词，意思随之改变：[Ми́ша ли до́ма]{.ru}“是不是米沙在家”，[пятёрку ли получи́ла Ю́ми]{.ru}“得的是不是五分”。

    [ли]{.ru} 永远不在从句的第一个位置。'
- id: L89-02
  tags:
  - ли：位置与连接词核查
  task: 判断间接疑问句是否正确。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Она́ спроси́ла, здоро́в ли я.
    answer: 正确
  - text: Она́ спроси́ла, ли я здоро́в.
    answer: 有错
  - text: Ка́тя спроси́ла, пойдёт ли А́нна на конце́рт.
    answer: 正确
  - text: Ка́тя спроси́ла, А́нна пойдёт на конце́рт ли.
    answer: 有错
  - text: Учи́тельница спроси́ла, гото́в ли Ми́ша к контро́льной.
    answer: 正确
  - text: Па́па спроси́л, е́сли я сде́лал уро́ки.
    answer: 有错
  - text: Ма́ма спроси́ла, что я сде́лал уро́ки.
    answer: 有错
  - text: Пьер спроси́л, есть ли у меня́ слова́рь.
    answer: 正确
  - text: Пьер спроси́л, у меня́ есть ли слова́рь.
    answer: 有错
  - text: Ю́ми спроси́ла, зна́ю ли я, где он живёт.
    answer: 正确
  - text: Я не зна́ю, бу́дет ли за́втра дождь.
    answer: 正确
  - text: Я не зна́ю, ли за́втра бу́дет дождь.
    answer: 有错
  - text: О́льга Ви́кторовна спроси́ла, де́лал ли я упражне́ния.
    answer: 正确
  - text: Ми́ша спроси́л, ли ты пойдёшь в кино́?
    answer: 有错
  why: '第 1、3、5、8、10、11、13 题：焦点词在从句开头，[ли]{.ru} 紧跟其后，句末用句号，正确。

    第 2、12、14 题：[ли]{.ru} 不能放在从句开头，应为 [здоро́в ли я]{.ru}、[бу́дет ли за́втра дождь]{.ru}、[пойдёшь ли ты в кино́]{.ru}；第 14 题句末还要改成句号。

    第 4、9 题：[ли]{.ru} 不能放在句末或句中随便一个词后，要跟在焦点词后：[пойдёт ли А́нна на конце́рт]{.ru}，[есть ли у меня́ слова́рь]{.ru}。

    第 6、7 题：“是否”不能用 [е́сли]{.ru}（如果），也不能用 [что]{.ru}（转述陈述句），应为 [сде́лал ли я уро́ки]{.ru}。'
- id: L89-03
  tags:
  - ли：转述人称与性数核查
  task: 老师用 [вы]{.ru} 问王磊和由美。写出他们转述时这个词组的形式。
  type: matrix
