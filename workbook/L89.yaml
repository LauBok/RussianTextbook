  - 0
  rows:
  - base: '[«Ми́ша до́ма?»]{.ru}'
    cells:
    - '[«Ми́ша до́ма?»]{.ru}'
    - '[до́ма ли]{.ru}'
    hint: 问在不在家
  - base: '[«Ми́ша до́ма?»]{.ru}'
    cells:
    - '[«Ми́ша до́ма?»]{.ru}'
    - '[Ми́ша ли]{.ru}'
    hint: 问是不是米沙在家
  - base: '[«Конце́рт бу́дет за́втра?»]{.ru}'
    cells:
    - '[«Конце́рт бу́дет за́втра?»]{.ru}'
    - '[бу́дет ли]{.ru}'
    hint: 问有没有音乐会
  - base: '[«Конце́рт бу́дет за́втра?»]{.ru}'
    cells:
