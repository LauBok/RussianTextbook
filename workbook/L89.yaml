  - base: '[вы пойдёте]{.ru}'
    cells:
    - '[вы пойдёте]{.ru}'
    - '[я пойду́]{.ru}'
    - '[я пойду́]{.ru}'
  - base: '[вы получи́ли]{.ru}'
    cells:
    - '[вы получи́ли]{.ru}'
    - '[я получи́л]{.ru}'
    - '[я получи́ла]{.ru}'
  - base: '[вам тру́дно]{.ru}'
    cells:
    - '[вам тру́дно]{.ru}'
    - '[мне тру́дно]{.ru}'
    - '[мне тру́дно]{.ru}'
  - base: '[ваш слова́рь]{.ru}'
    cells:
    - '[ваш слова́рь]{.ru}'
    - '[мой слова́рь]{.ru}'
    - '[мой слова́рь]{.ru}'
  - base: '[ва́ша тетра́дь]{.ru}'
    cells:
    - '[ва́ша тетра́дь]{.ru}'
    - '[моя́ тетра́дь]{.ru}'
    - '[моя́ тетра́дь]{.ru}'
  - base: '[вы уста́ли]{.ru}'
    cells:
    - '[вы уста́ли]{.ru}'
    - '[я уста́л]{.ru}'
    - '[я уста́ла]{.ru}'
  - base: '[вы прове́рили]{.ru}'
    cells:
    - '[вы прове́рили]{.ru}'
    - '[я прове́рил]{.ru}'
    - '[я прове́рила]{.ru}'
  - base: '[вас не́ было]{.ru}'
    cells:
    - '[вас не́ было]{.ru}'
    - '[меня́ не́ было]{.ru}'
    - '[меня́ не́ было]{.ru}'
  why: '第 1–14 题：老师对学生用的 [вы]{.ru} 指一个人，转述人说自己时改成 [я]{.ru}；[у вас, вам, ваш, вас]{.ru} 改成 [у меня́, мне, мой, меня́]{.ru}。

    第 1、2、4、6、8、12、13 题：[вы]{.ru} 后的短尾形容词和过去时用复数，改成 [я]{.ru} 以后要按转述人的性别用单数：王磊说 [я здоро́в, я де́лал, я был бо́лен]{.ru}，由美说 [я здоро́ва, я де́лала, я была́ больна́]{.ru}。

    第 3、5、7、9–11、14 题：现在时、将来时和代词没有性的区别，两人说法相同。'
- id: L89-04
  tags:
  - ли 与 е́сли：意义辨别
  task: 判断句子表示“是否”还是“如果”。
  type: classify
  bins:
  - “是否”（间接疑问）
  - “如果”（条件）
  items:
  - text: Я не зна́ю, бу́дет ли за́втра дождь.
    answer: “是否”（间接疑问）
  - text: Е́сли за́втра бу́дет дождь, мы бу́дем до́ма.
    answer: “如果”（条件）
  - text: Она́ спроси́ла, здоро́в ли я.
    answer: “是否”（间接疑问）
  - text: Е́сли ты здоро́в, иди́ на уро́к.
    answer: “如果”（条件）
  - text: Ми́ша спроси́л, пойдём ли мы в кино́.
    answer: “是否”（间接疑问）
  - text: Мы пойдём в кино́, е́сли ты хо́чешь.
    answer: “如果”（条件）
  - text: Ю́ми не по́мнит, есть ли у неё слова́рь.
    answer: “是否”（间接疑问）
  - text: Е́сли у тебя́ нет словаря́, возьми́ мой.
    answer: “如果”（条件）
  - text: Па́па спроси́л, гото́в ли у́жин.
    answer: “是否”（间接疑问）
  - text: Е́сли у́жин гото́в, мы бу́дем у́жинать.
    answer: “如果”（条件）
  - text: Я спрошу́ О́льгу Ви́кторовну, бу́дет ли контро́льная.
    answer: “是否”（间接疑问）
  - text: Е́сли бу́дет контро́льная, я бу́ду занима́ться.
    answer: “如果”（条件）
  why: '第 1、3、5、7、9、11 题：[ли]{.ru} 跟在焦点词后，从句是 [знать, спроси́ть, по́мнить]{.ru} 等动词的内容，意思是“是否”。

    第 2、4、6、8、10、12 题：[е́сли]{.ru} 放在从句开头，引出条件，意思是“如果”。英语的 if 两种意思都有，俄语要分开：“是否”只能用 [ли]{.ru}。'
- id: L89-05
  tags:
  - ли：疑问焦点意义标注
  task: 判断间接疑问句问的是什么。
  type: classify
  bins:
  - 问谓语：有没有，是不是这样
  - 问别的成分：是不是这个人、这件东西、这个时间
  items:
  - text: Она́ спроси́ла, де́лал ли я упражне́ния.
    answer: 问谓语：有没有，是不是这样
  - text: Она́ спроси́ла, упражне́ния ли я де́лал.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Ка́тя спроси́ла, пойдёт ли А́нна на конце́рт.
    answer: 问谓语：有没有，是不是这样
  - text: Ка́тя спроси́ла, А́нна ли пойдёт на конце́рт.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Па́па спроси́л, за́втра ли бу́дет контро́льная.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Па́па спроси́л, бу́дет ли за́втра контро́льная.
    answer: 问谓语：有没有，是不是这样
  - text: Ю́ми спроси́ла, есть ли у Пье́ра слова́рь.
    answer: 问谓语：有没有，是不是这样
  - text: Ю́ми спроси́ла, у Пье́ра ли слова́рь.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Ма́ма спроси́ла, гото́в ли у́жин.
    answer: 问谓语：有没有，是不是这样
  - text: Ма́ма спроси́ла, у́жин ли гото́в.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Учи́тельница спроси́ла, пятёрку ли получи́л Ми́ша.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Учи́тельница спроси́ла, получи́л ли Ми́ша пятёрку.
    answer: 问谓语：有没有，是不是这样
  - text: Ба́бушка спроси́ла, в Москве́ ли живёт Ван Лэй.
    answer: 问别的成分：是不是这个人、这件东西、这个时间
  - text: Ба́бушка спроси́ла, живёт ли Ван Лэй в Москве́.
    answer: 问谓语：有没有，是不是这样
  why: '[ли]{.ru} 紧跟在被问的词后面，所以 [ли]{.ru} 前面的词就是问题的焦点。

    第 1、3、6、7、9、12、14 题：[ли]{.ru} 前是谓语（[де́лал, пойдёт, бу́дет, есть, гото́в, получи́л, живёт]{.ru}），问的是事情有没有发生、是不是这样，相当于汉语的“做没做”“有没有”。

    第 2、4、5、8、10、11、13 题：[ли]{.ru} 前是别的成分，问的是“是不是这个”：第 4 题“去的是不是安娜”，第 5 题“是不是明天”，第 8 题“词典是不是在皮埃尔那儿”，第 13 题“是不是住在莫斯科”。'
