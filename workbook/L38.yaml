heading: 第 38 课　带 -ся 的动词
groups:
- id: L38-01
  tags:
  - -ся 动词现在时：第一变位与第二变位
  task: 按主语写出动词的现在时。
  type: matrix
  cols:
  - 主语
  - '[занима́ться]{.ru}'
  - '[учи́ться]{.ru}'
  - '[находи́ться]{.ru}'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[занима́юсь]{.ru}'
    - '[учу́сь]{.ru}'
    - '[нахожу́сь]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[занима́ешься]{.ru}'
    - '[у́чишься]{.ru}'
    - '[нахо́дишься]{.ru}'
  - base: '[он / она́]{.ru}'
    cells:
    - '[он / она́]{.ru}'
    - '[занима́ется]{.ru}'
    - '[у́чится]{.ru}'
    - '[нахо́дится]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[занима́емся]{.ru}'
    - '[у́чимся]{.ru}'
    - '[нахо́димся]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[занима́етесь]{.ru}'
    - '[у́читесь]{.ru}'
    - '[нахо́дитесь]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[занима́ются]{.ru}'
    - '[у́чатся]{.ru}'
    - '[нахо́дятся]{.ru}'
  why: '第 1–6 题：先按普通动词变位，再加 [-ся / -сь]{.ru}：元音后加 [-сь]{.ru}（[занима́юсь, у́читесь]{.ru}），辅音后加 [-ся]{.ru}（[занима́ешься, у́чится]{.ru}）。

    第 1–6 题：[занима́ться]{.ru} 是第一变位，重音一直在 [а́]{.ru} 上；[учи́ться]{.ru} 是第二变位，[ч]{.ru} 后写 [у, а]{.ru}：[учу́сь, у́чатся]{.ru}，从 [ты]{.ru} 起重音移到词干。

    第 1 题：[находи́ться]{.ru} 的 [я]{.ru} 形式 [д → ж]{.ru}：[нахожу́сь]{.ru}，和 [ходи́ть]{.ru} 一样；其余重音在词干：[нахо́дится]{.ru}。'
- id: L38-02
  tags:
  - -ся / -сь 选择
  task: 给出的形式后面该加 [-ся]{.ru} 还是 [-сь]{.ru}？
  type: classify
  bins:
  - '[-ся]{.ru}'
  - '[-сь]{.ru}'
  items:
  - text: '[занима́ю…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[занима́ет…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[учу́…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[у́чишь…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[возвраща́ем…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[возвраща́ете…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[у́чат…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[нахо́дит…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[занима́л…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[учи́ла…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[учи́ли…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[начина́ет…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[конча́ют…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[нахожу́…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[возвраща́ло…]{.ru}'
    answer: '[-сь]{.ru}'
  - text: '[учи́ть…]{.ru}'
    answer: '[-ся]{.ru}'
  - text: '[занима́ешь…]{.ru}'
    answer: '[-ся]{.ru}'
  why: '第 2、4、5、7–9、12、13、16、17 题：辅音（包括 [ь]{.ru}）后面加 [-ся]{.ru}：[занима́ется, у́чишься, возвраща́емся, занима́лся, учи́ться]{.ru}。

    第 1、3、6、10、11、14、15 题：元音后面加 [-сь]{.ru}：[занима́юсь, учу́сь, возвраща́етесь, учи́лась, учи́лись, возвраща́лось]{.ru}。'
- id: L38-03
  tags:
  - -ся 动词过去时：性数形式
  task: 写出动词过去时的四种形式。
  type: matrix
  cols:
  - 不定式
  - 阳性
  - 阴性
  - 中性
  - 复数
  rows:
  - base: '[занима́ться]{.ru}'
    cells:
    - '[занима́ться]{.ru}'
    - '[занима́лся]{.ru}'
    - '[занима́лась]{.ru}'
    - '[занима́лось]{.ru}'
    - '[занима́лись]{.ru}'
  - base: '[учи́ться]{.ru}'
    cells:
    - '[учи́ться]{.ru}'
    - '[учи́лся]{.ru}'
    - '[учи́лась]{.ru}'
    - '[учи́лось]{.ru}'
    - '[учи́лись]{.ru}'
  - base: '[находи́ться]{.ru}'
    cells:
    - '[находи́ться]{.ru}'
    - '[находи́лся]{.ru}'
    - '[находи́лась]{.ru}'
    - '[находи́лось]{.ru}'
    - '[находи́лись]{.ru}'
  - base: '[начина́ться]{.ru}'
    cells:
    - '[начина́ться]{.ru}'
    - '[начина́лся]{.ru}'
    - '[начина́лась]{.ru}'
    - '[начина́лось]{.ru}'
    - '[начина́лись]{.ru}'
  - base: '[конча́ться]{.ru}'
    cells:
    - '[конча́ться]{.ru}'
    - '[конча́лся]{.ru}'
    - '[конча́лась]{.ru}'
    - '[конча́лось]{.ru}'
    - '[конча́лись]{.ru}'
  why: '第 1–5 题：去掉 [-ться]{.ru}，加 [-л, -ла, -ло, -ли]{.ru}，再加 [-ся / -сь]{.ru}：阳性 [-лся]{.ru}（辅音后），阴性、中性、复数 [-лась, -лось, -лись]{.ru}（元音后）。

    第 2、3 题：第二变位动词过去时同样按不定式词干构成：[учи́лся, находи́лся]{.ru}，没有现在时的交替。'
- id: L38-04
  tags:
  - -ся 动词：词干与重音核查
  task: 有的形式写错了：对的照抄，错的改正。
  type: matrix
  cols:
  - 给出的形式
  - 正确形式
  rows:
  - base: '[я учю́сь]{.ru}'
    cells:
    - '[я учю́сь]{.ru}'
    - '[я учу́сь]{.ru}'
  - base: '[они́ у́чутся]{.ru}'
    cells:
    - '[они́ у́чутся]{.ru}'
    - '[они́ у́чатся]{.ru}'
  - base: '[ты у́чишся]{.ru}'
    cells:
    - '[ты у́чишся]{.ru}'
    - '[ты у́чишься]{.ru}'
  - base: '[он занима́ется]{.ru}'
    cells:
    - '[он занима́ется]{.ru}'
    - '[он занима́ется]{.ru}'
  - base: '[я нахо́жусь]{.ru}'
    cells:
    - '[я нахо́жусь]{.ru}'
    - '[я нахожу́сь]{.ru}'
  - base: '[она́ занима́лас]{.ru}'
    cells:
    - '[она́ занима́лас]{.ru}'
    - '[она́ занима́лась]{.ru}'
  - base: '[вы возвраща́етесь]{.ru}'
    cells:
    - '[вы возвраща́етесь]{.ru}'
    - '[вы возвраща́етесь]{.ru}'
  - base: '[мы учи́мся]{.ru}'
    cells:
    - '[мы учи́мся]{.ru}'
    - '[мы у́чимся]{.ru}'
  - base: '[я находю́сь]{.ru}'
    cells:
    - '[я находю́сь]{.ru}'
    - '[я нахожу́сь]{.ru}'
  - base: '[уро́к начина́еться]{.ru}'
    cells:
    - '[уро́к начина́еться]{.ru}'
    - '[уро́к начина́ется]{.ru}'
  - base: '[он учи́лься]{.ru}'
    cells:
    - '[он учи́лься]{.ru}'
    - '[он учи́лся]{.ru}'
  - base: '[ты возвраща́ешся]{.ru}'
    cells:
    - '[ты возвраща́ешся]{.ru}'
    - '[ты возвраща́ешься]{.ru}'
  why: '第 1、2 题：[ч]{.ru} 后面写 [у, а]{.ru}，不写 [ю, я]{.ru}：[учу́сь, у́чатся]{.ru}。

    第 3、12 题：第二人称单数 [-шь]{.ru} 的 [ь]{.ru} 不能丢：[у́чишься, возвраща́ешься]{.ru}。

    第 5、9 题：[я]{.ru} 的形式 [д → ж]{.ru}，重音在词尾：[нахожу́сь]{.ru}。

    第 6 题：元音后是 [-сь]{.ru}，[ь]{.ru} 不能丢。第 10 题：第三人称单数是 [-ется]{.ru}，不写 [ь]{.ru}；[-ться]{.ru} 才是不定式。第 11 题：辅音 [л]{.ru} 后加 [-ся]{.ru}。

    第 8 题：[учи́ться]{.ru} 从 [ты]{.ru} 起重音在词干：[у́чимся]{.ru}。

    第 4、7 题：原本就对。'
- id: L38-05
  tags:
  - 普通动词与 -ся 动词辨别
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Уро́к ___ в де́вять часо́в.
    hint: начина́ть / начина́ться
    accept:
    - начина́ется
  - stem: Преподава́тель ___ уро́к.
    hint: начина́ть / начина́ться
    accept:
    - начина́ет
  - stem: Я ___ но́вые слова́.
    hint: учи́ть / учи́ться
    accept:
    - учу́
  - stem: Ми́ша ___ в шко́ле.
    hint: учи́ть / учи́ться
    accept:
    - у́чится
  - stem: Студе́нты ___ стихи́ Пу́шкина.
    hint: учи́ть / учи́ться
    accept:
    - у́чат
  - stem: Мы ___ в университе́те.
    hint: учи́ть / учи́ться
    accept:
    - у́чимся
  - stem: Ле́кции ___ в два часа́.
    hint: начина́ть / начина́ться
    accept:
    - начина́ются
  - stem: Вчера́ А́нна ___ в библиоте́ке.
    hint: занима́ться
    accept:
    - занима́лась
  - stem: Мы ___ рабо́ту в во́семь часо́в.
    hint: начина́ть / начина́ться
    accept:
    - начина́ем
  - stem: Ве́чером па́па ___ домо́й.
    hint: возвраща́ться
    accept:
    - возвраща́ется
  why: '第 2、3、5、9 题：后面有第四格宾语（[уро́к, слова́, стихи́, рабо́ту]{.ru}），用不带 [-ся]{.ru} 的动词。

    第 1、4、6、7 题：没有宾语，用带 [-ся]{.ru} 的动词：[Уро́к начина́ется]{.ru}；[учи́ться]{.ru} 是“在某处上学”。

    第 8、10 题：只有带 [-ся]{.ru} 的动词，按主语变：[занима́лась, возвраща́ется]{.ru}。'
