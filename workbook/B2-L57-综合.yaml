  why: '第 1 题：俄语看下一个钟点：3:30 是 [полови́на четвёртого]{.ru}，“在三点半”是 [в полови́не четвёртого]{.ru}。

    第 2、11、12、16 题：数词在间接格里，名词跟数词同格、用复数：[о двух биле́тах, в тече́ние трёх лет, к пяти́ часа́м]{.ru}；“年”的复数第二格是 [лет]{.ru}。

    第 3、7 题：年份里只有最后一个序数词变格，[в … году́]{.ru} 要求第六格：[в две ты́сячи второ́м году́, в ты́сяча семьсо́т тре́тьем году́]{.ru}，前面的 [ты́сяча, семьсо́т]{.ru} 不变。

    第 4 题：未完成体表示过程，持续多久用不带前置词的第四格：[чита́л кни́гу неде́лю]{.ru}；[за неде́лю]{.ru} 要配完成体 [прочита́л]{.ru}。

    第 5 题：去了以后在那里待多久，用 [на]{.ru} + 第四格：[е́ду к ба́бушке на два дня]{.ru}。

    第 6、20 题：动物名词和 [два]{.ru} 连用，第四格同第二格：[ви́жу двух студе́нтов]{.ru}。

    第 8 题：跟在具体日期后面的年份用第二格：[… три́дцать пя́того го́да]{.ru}，不用 [в … году́]{.ru} 的第六格。

    第 9、19 题：[со́рок]{.ru} 的间接格只有 [сорока́]{.ru}，第五格也是 [с сорока́ друзья́ми]{.ru}。

    第 10 题：“多久以前”是第四格 + [наза́д]{.ru}，不加 [че́рез]{.ru}：[два дня наза́д]{.ru}。

    第 17 题：数词在第一、四格时按第一册的规则：[пять]{.ru} 以上用复数第二格，[в во́семь часо́в]{.ru}；[часа́]{.ru} 只跟 [два, три, четы́ре]{.ru}。

    第 18 题：钟点用序数词阳性第二格（[час]{.ru} 是阳性）：[полови́на шесто́го]{.ru}。

    第 21 题：[ты́сяча]{.ru} 本身变第五格 [ты́сячей]{.ru}，后面的名词始终是复数第二格：[с ты́сячей рубле́й]{.ru}。

    第 13 题：回答 [Како́е сего́дня число́?]{.ru} 时日用中性第一格：[Сего́дня пе́рвое сентября́]{.ru}；第二格 [пе́рвого]{.ru} 用于“在某日”。

    第 14 题：[без]{.ru} 后的分钟数用第二格：[без пяти́ три]{.ru}。

    第 15 题：[пять]{.ru} 以上数词的第二格后，[ты́сяча]{.ru} 用复数第二格 [ты́сяч]{.ru}：[бо́льше пяти́ ты́сяч киломе́тров]{.ru}。'
