    accept:
    - две ты́сячи пятна́дцатого
  why: '第 1 题：9:30 是“第十个钟点的一半”：[в полови́не деся́того]{.ru}。

    第 2、4 题：[с, о́коло]{.ru} 后数词用第二格：[с восьми́, о́коло четырёх лет]{.ru}。

    第 3、10 题：[к]{.ru} 和与格动词后数词用第三格：[к трём часа́м, четырём де́тям]{.ru}。

    第 5 题：“在某日”用第二格：[пе́рвого сентября́]{.ru}。

    第 6、12 题：年份只变最后一个序数词：[в ты́сяча семьсо́т девяно́сто девя́том году́, с две ты́сячи пятна́дцатого го́да]{.ru}。

    第 7 题：6:50 是差十分七点：[без десяти́ семь]{.ru}，分钟数用第二格。

    第 8 题：借了以后保留多久，用 [на]{.ru} + 第四格：[на две неде́ли]{.ru}。

    第 9 题：[с]{.ru} + 第五格：[с двумя́ студе́нтами]{.ru}。

    第 11 题：[о]{.ru} + 第六格：[о пяти́ фи́льмах]{.ru}。'
