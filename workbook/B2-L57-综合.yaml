  why: '第 2、4、6、16、17 题：[с, до, бо́льше, по́сле]{.ru} 要求第二格，数词和名词都变，名词用复数：[с пяти́ до семи́, бо́льше трёх дней, по́сле двух уро́ков]{.ru}。

    第 1、10、15、18 题：[к, по]{.ru} + 第三格：[к двум часа́м, к восьми́ часа́м, по пяти́ города́м]{.ru}。不要沿用第一格后的 [часа́]{.ru}。

    第 8、14 题：[с, ме́жду]{.ru} + 第五格：[с тремя́ друзья́ми, ме́жду двумя́ дома́ми]{.ru}（[друг]{.ru} 复数 [друзья́]{.ru}）。

    第 9、13、19 题：[о, в]{.ru}（在哪里）+ 第六格：[о четырёх экза́менах, в двух больши́х ко́мнатах]{.ru}。

