  - base: '[12.06]{.ru}'
    cells:
    - '[12.06]{.ru}'
    - '[двена́дцатого ию́ня]{.ru}'
    - '[с двена́дцатого ию́ня]{.ru}'
    - '[до двена́дцатого ию́ня]{.ru}'
  - base: '[1.09]{.ru}'
    cells:
    - '[1.09]{.ru}'
    - '[пе́рвого сентября́]{.ru}'
    - '[с пе́рвого сентября́]{.ru}'
    - '[до пе́рвого сентября́]{.ru}'
  - base: '[зима́]{.ru}'
    cells:
    - '[зима́]{.ru}'
    - '[зимо́й]{.ru}'
    - '[с зимы́]{.ru}'
    - '[до зимы́]{.ru}'
  - base: '[Но́вый год]{.ru}'
    cells:
    - '[Но́вый год]{.ru}'
    - '[в Но́вый год]{.ru}'
    - '[с Но́вого го́да]{.ru}'
    - '[до Но́вого го́да]{.ru}'
  - base: '[90-е го́ды]{.ru}'
    cells:
    - '[90-е го́ды]{.ru}'
    - '[в девяно́стые го́ды]{.ru}'
    - '[с девяно́стых годо́в]{.ru}'
    - '[до девяно́стых годо́в]{.ru}'
  - base: '[март]{.ru}'
    cells:
    - '[март]{.ru}'
    - '[в ма́рте]{.ru}'
    - '[с ма́рта]{.ru}'
    - '[до ма́рта]{.ru}'
  - base: '[понеде́льник]{.ru}'
    cells:
    - '[понеде́льник]{.ru}'
    - '[в понеде́льник]{.ru}'
    - '[с понеде́льника]{.ru}'
    - '[до понеде́льника]{.ru}'
  why: '第 1–4 题：整点“在……点”用 [в]{.ru} + 第四格（同第一格）：[в пять часо́в, в два часа́]{.ru}；[с, до]{.ru} 后数词和 [час]{.ru} 都用第二格：[с пяти́ часо́в, до двух часо́в, до оди́ннадцати часо́в]{.ru}。

    第 5 题：“三点半”看下一个钟点：[в полови́не четвёртого]{.ru}（第六格）；[с, до]{.ru} 后 [полови́на]{.ru} 用第二格：[с полови́ны четвёртого]{.ru}。

    第 6、7 题：“在某日”不用前置词，日、月都用第二格：[двена́дцатого ию́ня]{.ru}；[с, до]{.ru} 后形式相同：[с пе́рвого сентября́]{.ru}。

    第 8 题：季节“在……时候”用第五格作副词：[зимо́й]{.ru}，不加 [в]{.ru}；[с, до]{.ru} 后用第二格 [зимы́]{.ru}。

    第 10 题：年代用复数：[в девяно́стые го́ды]{.ru}；第二格 [девяно́стых годо́в]{.ru}。

    第 11 题：月份“在……月”用 [в]{.ru} + 第六格：[в ма́рте]{.ru}；第二格 [ма́рта]{.ru}。

    第 9、12 题：星期几、节日用 [в]{.ru} + 第四格：[в понеде́льник, в Но́вый год]{.ru}；第二格 [понеде́льника, Но́вого го́да]{.ru}。'
