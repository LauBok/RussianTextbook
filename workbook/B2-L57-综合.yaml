    第 5、7 题：[со́рок, сто]{.ru} 的间接格是 [сорока́, ста]{.ru}。

    第 12 题：[ты́сяча]{.ru} 第二格 [ты́сячи]{.ru}，后面的名词仍是复数第二格。'
