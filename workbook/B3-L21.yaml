  why: |-
    第 1、5、9、13、18 题：[-ость]{.ru} 名词都是阴性，按 [тетра́дь]{.ru} 变格，第二格、第六格都是 [-и]{.ru}：[сло́жности, о бли́зости]{.ru}。最常见的错误是把它们当成阳性。
    第 2、6、10、14、17 题：[-ство / -ество]{.ru} 名词是中性，按 [сло́во]{.ru} 变格：[госуда́рства, о госуда́рстве]{.ru}。[родство́]{.ru} 重音在词尾，变格时也在词尾：[родства́, о родстве́]{.ru}。
    第 3、7、11、15 题：[-ние / -тие]{.ru} 名词是中性，按 [зда́ние]{.ru} 变格，第二格 [-ия]{.ru}，第六格 [-ии]{.ru}：[созда́ния, о созда́нии]{.ru}；[приня́тия, о приня́тии]{.ru}。第六格不能写成 [-ие]{.ru} 或 [-е]{.ru}。
    第 4、8、12、16 题：[-ация]{.ru} 名词是阴性，按 [ста́нция]{.ru} 变格，第二格、第六格都是 [-ии]{.ru}，重音一直在 [-а́-]{.ru}：[организа́ции, о цивилиза́ции]{.ru}。
    第 4、8、10、11 题：以元音开头的词前用 [об]{.ru}：[об организа́ции, об информа́ции, об о́бществе, об изуче́нии]{.ru}。
- id: B3-L21-03
  lessons:
  - B3-L21
  tags:
  - 名词后缀：-ость 名词的一致
  - 名词后缀：-ние, -ация 的第六格
  - 动名词的支配：宾语第二格
  task: 检查下列词组。有错的写出改正后的词组，没有错的照抄。
  type: matrix
  cols:
  - 词组
  - 改正
  given:
  - 0
  rows:
  - base: '[большо́й бли́зость]{.ru}'
    cells:
    - '[большо́й бли́зость]{.ru}'
    - '[больша́я бли́зость]{.ru}'
  - base: '[изуче́ние исто́рию]{.ru}'
    cells:
    - '[изуче́ние исто́рию]{.ru}'
    - '[изуче́ние исто́рии]{.ru}'
  - base: '[о разви́тие языка́]{.ru}'
    cells:
    - '[о разви́тие языка́]{.ru}'
    - '[о разви́тии языка́]{.ru}'
  - base: '[но́вый информа́ция]{.ru}'
    cells:
    - '[но́вый информа́ция]{.ru}'
    - '[но́вая информа́ция]{.ru}'
  - base: '[в на́шей о́бществе]{.ru}'
    cells:
    - '[в на́шей о́бществе]{.ru}'
    - '[в на́шем о́бществе]{.ru}'
  - base: '[созда́ние пи́сьменности]{.ru}'
    cells:
    - '[созда́ние пи́сьменности]{.ru}'
    - '[созда́ние пи́сьменности]{.ru}'
  - base: '[о дре́вней цивилиза́це]{.ru}'
    cells:
    - '[о дре́вней цивилиза́це]{.ru}'
    - '[о дре́вней цивилиза́ции]{.ru}'
  - base: '[приня́тие христиа́нство]{.ru}'
    cells:
    - '[приня́тие христиа́нство]{.ru}'
    - '[приня́тие христиа́нства]{.ru}'
  - base: '[с большо́й ве́жливостью]{.ru}'
    cells:
    - '[с большо́й ве́жливостью]{.ru}'
    - '[с большо́й ве́жливостью]{.ru}'
  - base: '[в счастли́вом де́тстве]{.ru}'
    cells:
    - '[в счастли́вом де́тстве]{.ru}'
    - '[в счастли́вом де́тстве]{.ru}'
  - base: '[о приня́тие реше́ния]{.ru}'
    cells:
    - '[о приня́тие реше́ния]{.ru}'
    - '[о приня́тии реше́ния]{.ru}'
  - base: '[по́лный случа́йность]{.ru}'
    cells:
    - '[по́лный случа́йность]{.ru}'
    - '[по́лная случа́йность]{.ru}'
  why: |-
    第 1、4、12 题：[-ость]{.ru} 和 [-ация]{.ru} 名词是阴性，形容词用阴性：[больша́я бли́зость, но́вая информа́ция, по́лная случа́йность]{.ru}。
    第 5 题：[-ство]{.ru} 名词是中性，形容词用中性第六格：[в на́шем о́бществе]{.ru}。
    第 3、7、11 题：[-ние / -тие / -ация]{.ru} 名词第六格是 [-ии]{.ru}：[о разви́тии, о цивилиза́ции, о приня́тии]{.ru}。不能照第一格写 [-ие]{.ru}，也不能按 [ста́нция]{.ru} 以外的阴性名词写 [-е]{.ru}。
    第 2、8 题：动词的直接宾语变成名词后面的第二格：[изуча́ть исто́рию]{.ru} → [изуче́ние исто́рии]{.ru}；[приня́ть христиа́нство]{.ru} → [приня́тие христиа́нства]{.ru}。
    第 6、9、10 题：没有错误：[созда́ние пи́сьменности]{.ru} 宾语已是第二格；[с большо́й ве́жливостью]{.ru} 是阴性第五格；[в счастли́вом де́тстве]{.ru} 是中性第六格。
