  why: |-
    第 1–12、16 题：形容词去掉词尾 [-ый / -ий]{.ru}，加 [-ость]{.ru}，重音留在原来的音节上：[сло́жность, ве́жливость, ста́рость, случа́йность]{.ru}。[-ость]{.ru} 前面的 [-н]{.ru}- 属于形容词词干，要保留：[ва́жность, изве́стность, че́стность]{.ru}，不要漏写。
    第 13 题：[бли́зкий]{.ru} 的 [-к]{.ru}- 是后缀，构成名词时脱落：[бли́зость]{.ru}，不写 [бли́зкость]{.ru}。
    第 14 题：[лёгкий]{.ru} 的 [-к]{.ru}- 属于词根，要保留：[лёгкость]{.ru}；[ё]{.ru} 照写。
    第 15 题：[молодо́й]{.ru} 重音在词尾，名词重音前移到第一个音节：[мо́лодость]{.ru}。
