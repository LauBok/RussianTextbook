  why: |-
    第 1、3、11、14 题：阳性动物名词同复数第二格：[госте́й, зри́телей, преподава́телей, тури́стов]{.ru}。
    第 2、6、12、15、18 题：非动物名词同复数第一格：[цветы́, ве́щи, ку́ртки, журна́лы, фи́льмы]{.ru}。
    第 4、5、7、8、13、16、17 题：阴性和 [-а]{.ru} 阳性的动物名词也同复数第二格（零词尾、隐现元音）：[студе́нток, ко́шек, ча́ек, актри́с, мужчи́н, птиц, колле́г]{.ru}。
    第 9、10 题：[де́ти, лю́ди]{.ru} 是动物名词：[дете́й, люде́й]{.ru}。
    第 19 题：[все]{.ru} 修饰动物名词时第四格是 [всех]{.ru}：[всех актёров]{.ru}。
    第 20 题：修饰非动物名词时同第一格：[все ку́ртки]{.ru}。
- id: B2-L13-04
  tags:
  - 名词复数第四格：句中
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Ле́том мы ви́дели на мо́ре ___.
    hint: дельфи́ны
    accept:
    - дельфи́нов
    new: true
    gloss: 海豚
  - stem: Ми́ша нарисова́л ___.
    hint: ло́шади
    accept:
    - лошаде́й
  - stem: Мари́я Никола́евна ждёт ___.
    hint: пацие́нты
    accept:
    - пацие́нтов
    new: true
    gloss: 病人
  - stem: А́нна купи́ла ___ на конце́рт.
    hint: биле́ты
    accept:
    - биле́ты
  - stem: Ван Лэй пригласи́л в теа́тр ___.
    hint: одногру́ппницы
    accept:
    - одногру́ппниц
  - stem: Де́ти лю́бят ___.
    hint: ска́зки
    accept:
    - ска́зки
  - stem: О́льга Ви́кторовна хорошо́ зна́ет ___.
    hint: студе́нты
    accept:
    - студе́нтов
  - stem: Ми́ша лю́бит рисова́ть ___.
    hint: пти́цы
    accept:
    - птиц
    new: true
    gloss: 鸟
  - stem: Мы встре́тили на у́лице ___.
    hint: сосе́дки
    accept:
    - сосе́док
    new: true
    gloss: 女邻居
  - stem: Пьер забы́л до́ма ___.
    hint: тетра́ди
    accept:
    - тетра́ди
  - stem: Ди́ма фотографи́ровал ___.
    hint: фигури́сты
    accept:
    - фигури́стов
  - stem: На пра́здник мы пригласи́ли ___.
    hint: колле́ги
    accept:
    - колле́г
  - stem: Ю́ми ча́сто вспомина́ет ___.
    hint: роди́тели
    accept:
    - роди́телей
  - stem: Ве́чером А́нна ждала́ ___.
    hint: го́сти
    accept:
    - госте́й
  - stem: Ми́ша потеря́л ___.
    hint: ключи́
    accept:
    - ключи́
  - stem: Ми́ша фотографи́ровал ___.
    hint: обезья́ны
    accept:
    - обезья́н
  - stem: Ива́н Серге́евич встреча́л на вокза́ле ___.
    hint: инжене́ры
    accept:
    - инжене́ров
  - stem: По́сле спекта́кля зри́тели жда́ли ___.
    hint: актёры
    accept:
    - актёров
  - stem: Ван Лэй сдал в гардеро́б ___.
    hint: ку́ртки
    accept:
    - ку́ртки
  - stem: Ди́ма лю́бит ___.
    hint: ко́шки
    accept:
    - ко́шек
  - stem: Ма́ма купи́ла ___.
    hint: конфе́ты
    accept:
    - конфе́ты
  - stem: Ле́том Ди́ма учи́л пла́вать ___.
    hint: ма́льчики
    accept:
    - ма́льчиков
  - stem: Оте́ц спроси́л ___.
    hint: врачи́
    accept:
    - враче́й
  - stem: Я ча́сто ви́жу в па́рке ___.
    hint: ба́бушки
    accept:
    - ба́бушек
  why: |-
    第 1、3、7、11、13、14、17、18、22、23 题：阳性动物名词：[дельфи́нов, пацие́нтов, студе́нтов, фигури́стов, роди́телей, госте́й, актёров, инжене́ров, ма́льчиков, враче́й]{.ru}。
    第 2 题：[ло́шадь]{.ru} 是动物名词，复数第二格 [лошаде́й]{.ru}（第 7 课生词表）。
    第 4、6、10、15、19、21 题：非动物名词同复数第一格：[биле́ты, ска́зки, тетра́ди, ключи́, ку́ртки, конфе́ты]{.ru}。
    第 5、8、9、12、16、20、24 题：阴性和 [-а]{.ru} 阳性的动物名词：[одногру́ппниц, птиц, сосе́док, колле́г, обезья́н, ко́шек, ба́бушек]{.ru}。
