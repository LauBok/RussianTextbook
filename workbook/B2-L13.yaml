  why: |-
    第 1、5–7、12、15 题：阴性动物名词单数第四格 [-у]{.ru}，复数第四格同复数第二格：[студе́нток, соба́к, ча́ек, подру́г, де́вочек, ко́шек]{.ru}。
    第 3、4 题：[-а]{.ru} 阳性也一样：[мужчи́н, колле́г]{.ru}。
    第 9、10、14、16 题：阳性动物名词单复数第四格都同第二格：[актёров, враче́й, учителе́й, тури́стов]{.ru}。
    第 2、8、11、13 题：非动物名词复数第四格同复数第一格：[биле́ты, ку́ртки, спекта́кли, пи́сьма]{.ru}，不要改成第二格。
