heading: 第 13 课　名词复数第四格
groups:
- id: B2-L13-01
  tags:
  - 动物名词与非动物名词
  task: 把名词按动物 / 非动物归类。
  type: classify
  bins:
  - 动物名词
  - 非动物名词
  items:
  - text: '[актёр]{.ru}'
    answer: 动物名词
  - text: '[биле́т]{.ru}'
    answer: 非动物名词
  - text: '[ча́йка]{.ru}'
    answer: 动物名词
  - text: '[ку́ртка]{.ru}'
    answer: 非动物名词
  - text: '[мужчи́на]{.ru}'
    answer: 动物名词
  - text: '[ме́сто]{.ru}'
    answer: 非动物名词
  - text: '[зри́тель]{.ru}'
    answer: 动物名词
  - text: '[кни́га]{.ru}'
    answer: 非动物名词
  - text: '[соба́ка]{.ru}'
    answer: 动物名词
  - text: '[цвето́к]{.ru}'
    answer: 非动物名词
  - text: '[колле́га]{.ru}'
    answer: 动物名词
  - text: '[письмо́]{.ru}'
    answer: 非动物名词
  - text: '[студе́нтка]{.ru}'
    answer: 动物名词
  - text: '[де́рево]{.ru}'
    answer: 非动物名词
  - text: '[ры́ба]{.ru}'
    answer: 动物名词
  - text: '[спекта́кль]{.ru}'
    answer: 非动物名词
  - text: '[ло́шадь]{.ru}'
    answer: 动物名词
  - text: '[програ́ммка]{.ru}'
    answer: 非动物名词
  - text: '[тури́ст]{.ru}'
    answer: 动物名词
    new: true
    gloss: 游客
  - text: '[стол]{.ru}'
    answer: 非动物名词
  - text: '[ко́шка]{.ru}'
    answer: 动物名词
  - text: '[наро́д]{.ru}'
    answer: 非动物名词
  why: |-
    第 1、7、13、19 题：表示人的名词是动物名词：[актёр, зри́тель, студе́нтка, тури́ст]{.ru}。
    第 3、9、15、17、21 题：动物、鱼、鸟也是动物名词：[ча́йка, соба́ка, ры́ба, ло́шадь, ко́шка]{.ru}。
    第 5、11 题：[-а]{.ru} 结尾的阳性名词表示人，也是动物名词：[мужчи́на, колле́га]{.ru}。
    第 2、4、6、8、12、16、18、20 题：东西、地点、事件是非动物名词：[биле́т, ку́ртка, ме́сто, кни́га, письмо́, спекта́кль, програ́ммка, стол]{.ru}。
    第 10、14 题：植物不算动物名词：[цвето́к, де́рево]{.ru}，复数第四格同第一格：[ви́жу цветы́, дере́вья]{.ru}。
    第 22 题：[наро́д]{.ru} 虽然指人，语法上是非动物名词：[ви́жу наро́д]{.ru}。
