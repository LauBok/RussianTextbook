heading: 第 50 课　第五单元复习
groups:
- id: L50-01
  tags: [复习：两种将来时与命令式]
  task: 写出两种将来时和完成体命令式（对 [ты]{.ru} 说）。
  type: matrix
  cols: [体对, 未完成体将来时, 完成体将来时, 完成体命令式]
  given: [0]
  recycles: [L41-02, L43-02, L44-02, L46-02, L46-03]
  rows:
  - {base: '[чита́ть / прочита́ть]{.ru}', cells: ['[чита́ть / прочита́ть]{.ru}', '[бу́дешь чита́ть]{.ru}', '[прочита́ешь]{.ru}', '[прочита́й]{.ru}']}
  - {base: '[писа́ть / написа́ть]{.ru}', cells: ['[писа́ть / написа́ть]{.ru}', '[бу́дешь писа́ть]{.ru}', '[напи́шешь]{.ru}', '[напиши́]{.ru}']}
  - {base: '[де́лать / сде́лать]{.ru}', cells: ['[де́лать / сде́лать]{.ru}', '[бу́дешь де́лать]{.ru}', '[сде́лаешь]{.ru}', '[сде́лай]{.ru}']}
  - {base: '[смотре́ть / посмотре́ть]{.ru}', cells: ['[смотре́ть / посмотре́ть]{.ru}', '[бу́дешь смотре́ть]{.ru}', '[посмо́тришь]{.ru}', '[посмотри́]{.ru}']}
  - {base: '[гото́вить / пригото́вить]{.ru}', cells: ['[гото́вить / пригото́вить]{.ru}', '[бу́дешь гото́вить]{.ru}', '[пригото́вишь]{.ru}', '[пригото́вь]{.ru}']}
  - {base: '[покупа́ть / купи́ть]{.ru}', cells: ['[покупа́ть / купи́ть]{.ru}', '[бу́дешь покупа́ть]{.ru}', '[ку́пишь]{.ru}', '[купи́]{.ru}']}
  - {base: '[брать / взять]{.ru}', cells: ['[брать / взять]{.ru}', '[бу́дешь брать]{.ru}', '[возьмёшь]{.ru}', '[возьми́]{.ru}']}
  - {base: '[дава́ть / дать]{.ru}', cells: ['[дава́ть / дать]{.ru}', '[бу́дешь дава́ть]{.ru}', '[дашь]{.ru}', '[дай]{.ru}']}
  - {base: '[говори́ть / сказа́ть]{.ru}', cells: ['[говори́ть / сказа́ть]{.ru}', '[бу́дешь говори́ть]{.ru}', '[ска́жешь]{.ru}', '[скажи́]{.ru}']}
  - {base: '[отвеча́ть / отве́тить]{.ru}', cells: ['[отвеча́ть / отве́тить]{.ru}', '[бу́дешь отвеча́ть]{.ru}', '[отве́тишь]{.ru}', '[отве́ть]{.ru}']}
  - {base: '[спра́шивать / спроси́ть]{.ru}', cells: ['[спра́шивать / спроси́ть]{.ru}', '[бу́дешь спра́шивать]{.ru}', '[спро́сишь]{.ru}', '[спроси́]{.ru}']}
  - {base: '[расска́зывать / рассказа́ть]{.ru}', cells: ['[расска́зывать / рассказа́ть]{.ru}', '[бу́дешь расска́зывать]{.ru}', '[расска́жешь]{.ru}', '[расскажи́]{.ru}']}
  - {base: '[есть / съесть]{.ru}', cells: ['[есть / съесть]{.ru}', '[бу́дешь есть]{.ru}', '[съешь]{.ru}', '[съешь]{.ru}']}
  - {base: '[сади́ться / сесть]{.ru}', cells: ['[сади́ться / сесть]{.ru}', '[бу́дешь сади́ться]{.ru}', '[ся́дешь]{.ru}', '[сядь]{.ru}']}
  why: |
    第 1–14 题：未完成体将来时都是 [бу́дешь]{.ru} + 未完成体不定式；完成体将来时是完成体本身的 [ты]{.ru} 形式，不加 [бу́дешь]{.ru}。
    第 1、3 题：词干以元音结尾，命令式加 [-й]{.ru}：[прочита́й, сде́лай]{.ru}。
    第 2、4、6、7、9、11、12 题：[я]{.ru} 的形式重音在词尾，命令式加 [-и́]{.ru}：[напиши́, посмотри́, купи́, возьми́, скажи́, спроси́, расскажи́]{.ru}；命令式的词干和 [они́]{.ru} 一样，所以有 [ш, ж, возьм-]{.ru}，没有 [пл]{.ru}。
    第 5、10、14 题：[я]{.ru} 的形式重音在词干（[пригото́влю, отве́чу, ся́ду]{.ru}），命令式加 [-ь]{.ru}：[пригото́вь, отве́ть, сядь]{.ru}。
    第 8、13 题：特殊形式：[дашь — дай]{.ru}；[съесть]{.ru} 的将来时和命令式都是 [съешь]{.ru}，和 [есть — ешь]{.ru} 一样。
- id: L50-02
  tags: [复习：过去与将来的体选择]
  task: 选用括号里合适的动词填空。
  type: fill
  recycles: [L42-03, L43-04, L45-05]
  items:
  - {stem: 'Вчера́ А́нна до́лго ___ расска́з.', hint: чита́ть / прочита́ть, accept: [чита́ла]}
  - {stem: 'Ми́ша уже́ ___ уро́ки и сейча́с гуля́ет.', hint: де́лать / сде́лать, accept: [сде́лал]}
  - {stem: 'Хорошо́, за́втра я ___ слова́рь.', hint: дава́ть / дать, accept: [дам]}
  - {stem: 'Ра́ньше па́па ча́сто ___ ска́зки.', hint: расска́зывать / рассказа́ть, accept: [расска́зывал]}
  - {stem: 'В воскресе́нье мы ___ телеви́зор и отдыха́ть.', hint: смотре́ть / посмотре́ть, accept: [бу́дем смотре́ть]}
  - {stem: '— Ты ___ «Войну́ и мир»? — Нет, не смотре́л.', hint: смотре́ть / посмотре́ть, accept: [смотре́л]}
  - {stem: 'Че́стное сло́во, я ___ письмо́ сего́дня.', hint: писа́ть / написа́ть, accept: [напишу́]}
  - {stem: 'Вчера́ Ван Лэй ___ торт в бу́лочной.', hint: покупа́ть / купи́ть, accept: [купи́л]}
  - {stem: 'Ка́ждый день я бу́ду ___ но́вые слова́.', hint: учи́ть / вы́учить, accept: [учи́ть]}
  - {stem: 'Ма́ма ___ у́жин, и в семь часо́в мы бу́дем у́жинать.', hint: гото́вить / пригото́вить, accept: [пригото́вит]}
  - {stem: 'Ю́ми ___ упражне́ние два часа́.', hint: де́лать / сде́лать, accept: [де́лала]}
  - {stem: 'Сего́дня у́тром Пьер ___ на уро́к.', hint: опа́здывать / опозда́ть, accept: [опозда́л]}
  - {stem: 'За́втра экскурсово́д ___ ла́вру.', hint: пока́зывать / показа́ть, accept: [пока́жет]}
  - {stem: 'Я ___ хлеб и сра́зу верну́лся домо́й.', hint: брать / взять, accept: [взял]}
  why: |
    第 1、11 题：[до́лго, два часа́]{.ru} 表示过程，用未完成体过去时 [чита́ла, де́лала]{.ru}。
    第 2、8、12、14 题：动作做成了，有结果（做完功课才去玩、买了蛋糕、迟到了、拿了面包才回家），用完成体过去时。
    第 3、7、10、13 题：将来一次做成的事，用完成体将来时：[дам, напишу́, пригото́вит, пока́жет]{.ru}；第 7 题是保证，第 10 题做好饭才能吃饭。
    第 4 题：[ча́сто]{.ru} 表示过去反复，用 [расска́зывал]{.ru}。第 9 题 [ка́ждый день]{.ru} 表示将来反复，[бу́ду]{.ru} 后面只能接未完成体 [учи́ть]{.ru}。
    第 5 题：说周末的安排，不说结果，用 [бу́дем смотре́ть]{.ru}。第 6 题问“看过没有”，用 [смотре́л]{.ru}。
- id: L50-03
  tags: [复习：序数词与日期]
  task: 按括号里的要求写出词组（数字用词写出）。
  type: matrix
  cols: [给出的词, 词组]
  given: [0]
  recycles: [L48-02, L48-03, L49-02]
  rows:
  - {base: '[3, кни́га]{.ru}', hint: 第一格, cells: ['[3, кни́га]{.ru}', '[тре́тья кни́га]{.ru}']}
  - {base: '[8, класс]{.ru}', hint: 在几年级, cells: ['[8, класс]{.ru}', '[в восьмо́м кла́ссе]{.ru}']}
  - {base: '[2, курс]{.ru}', hint: 在几年级, cells: ['[2, курс]{.ru}', '[на второ́м ку́рсе]{.ru}']}
  - {base: '[7, уро́к]{.ru}', hint: 第一格, cells: ['[7, уро́к]{.ru}', '[седьмо́й уро́к]{.ru}']}
  - {base: '[12.06]{.ru}', hint: 今天几号, cells: ['[12.06]{.ru}', '[двена́дцатое ию́ня]{.ru}']}
  - {base: '[12.06]{.ru}', hint: 在几号, cells: ['[12.06]{.ru}', '[двена́дцатого ию́ня]{.ru}']}
  - {base: '[ию́нь]{.ru}', hint: 在几月, cells: ['[ию́нь]{.ru}', '[в ию́не]{.ru}']}
  - {base: '[22.08]{.ru}', hint: 在几号, cells: ['[22.08]{.ru}', '[два́дцать второ́го а́вгуста]{.ru}']}
  - {base: '[6, ваго́н]{.ru}', hint: 在第几节车厢, cells: ['[6, ваго́н]{.ru}', '[в шесто́м ваго́не]{.ru}']}
  - {base: '[4.10]{.ru}', hint: 今天几号, cells: ['[4.10]{.ru}', '[четвёртое октября́]{.ru}']}
  - {base: '[31.01]{.ru}', hint: 在几号, cells: ['[31.01]{.ru}', '[три́дцать пе́рвого января́]{.ru}']}
  - {base: '[3, ле́кция]{.ru}', hint: 在第几节课, cells: ['[3, ле́кция]{.ru}', '[на тре́тьей ле́кции]{.ru}']}
  - {base: '[9.05]{.ru}', hint: 今天几号, cells: ['[9.05]{.ru}', '[девя́тое ма́я]{.ru}']}
  - {base: '[20, авто́бус]{.ru}', hint: 第一格, cells: ['[20, авто́бус]{.ru}', '[двадца́тый авто́бус]{.ru}']}
  - {base: '[1, неде́ля]{.ru}', hint: 第一格, cells: ['[1, неде́ля]{.ru}', '[пе́рвая неде́ля]{.ru}']}
  - {base: '[дека́брь]{.ru}', hint: 在几月, cells: ['[дека́брь]{.ru}', '[в декабре́]{.ru}']}
  why: |
    第 1、4、14、15 题：序数词和名词的性一致：[тре́тья кни́га, седьмо́й уро́к, двадца́тый авто́бус, пе́рвая неде́ля]{.ru}。
    第 2、3、9、12 题：表示处所用 [в / на]{.ru} + 第六格，序数词按形容词变：[в восьмо́м кла́ссе, на второ́м ку́рсе, в шесто́м ваго́не, на тре́тьей ле́кции]{.ru}。
    第 5、10、13 题：“今天几号”序数词用中性第一格，月份用第二格。
    第 6、8、11 题：“在几号”序数词和月份都用第二格，不加前置词；复合序数词只变最后一个词：[два́дцать второ́го, три́дцать пе́рвого]{.ru}。
    第 7、16 题：只说月份用 [в]{.ru} + 第六格：[в ию́не, в декабре́]{.ru}。
- id: L50-04
  tags: [复习：单元常见错误核查]
  task: 每个说法都有一处错误，写出正确的说法。
  type: matrix
  cols: [有错误的说法, 正确的说法]
  given: [0]
  recycles: [L41-03, L43-05, L46-03, L47-02, L49-04]
  rows:
  - {base: '[в оди́н час]{.ru}', cells: ['[в оди́н час]{.ru}', '[в час]{.ru}']}
  - {base: '[че́рез два часо́в]{.ru}', cells: ['[че́рез два часо́в]{.ru}', '[че́рез два часа́]{.ru}']}
  - {base: '[пять мину́ты наза́д]{.ru}', cells: ['[пять мину́ты наза́д]{.ru}', '[пять мину́т наза́д]{.ru}']}
  - {base: '[в пе́рвое ма́я]{.ru}', hint: 在几号, cells: ['[в пе́рвое ма́я]{.ru}', '[пе́рвого ма́я]{.ru}']}
  - {base: '[я бу́ду прочита́ть]{.ru}', hint: 强调读完, cells: ['[я бу́ду прочита́ть]{.ru}', '[я прочита́ю]{.ru}']}
  - {base: '[ка́ждый день я куплю́ хлеб]{.ru}', cells: ['[ка́ждый день я куплю́ хлеб]{.ru}', '[ка́ждый день я покупа́ю хлеб]{.ru}']}
  - {base: '[я прочита́л расска́з два часа́]{.ru}', cells: ['[я прочита́л расска́з два часа́]{.ru}', '[я чита́л расска́з два часа́]{.ru}']}
  - {base: '[откры́йте окно́]{.ru}', cells: ['[откры́йте окно́]{.ru}', '[откро́йте окно́]{.ru}']}
  - {base: '[сади́ся]{.ru}', cells: ['[сади́ся]{.ru}', '[сади́сь]{.ru}']}
  - {base: '[в сентя́бре]{.ru}', cells: ['[в сентя́бре]{.ru}', '[в сентябре́]{.ru}']}
  - {base: '[че́рез неде́ля]{.ru}', cells: ['[че́рез неде́ля]{.ru}', '[че́рез неде́лю]{.ru}']}
  - {base: '[тре́тий неде́ля]{.ru}', cells: ['[тре́тий неде́ля]{.ru}', '[тре́тья неде́ля]{.ru}']}
  - {base: '[он бу́дет рабо́тает]{.ru}', cells: ['[он бу́дет рабо́тает]{.ru}', '[он бу́дет рабо́тать]{.ru}']}
  - {base: '[ка́ждая у́тро]{.ru}', cells: ['[ка́ждая у́тро]{.ru}', '[ка́ждое у́тро]{.ru}']}
  - {base: '[отве́чи]{.ru}', hint: '[отве́тить]{.ru}', cells: ['[отве́чи]{.ru}', '[отве́ть]{.ru}']}
  - {base: '[сего́дня пе́рвого ма́рта]{.ru}', hint: 今天几号, cells: ['[сего́дня пе́рвого ма́рта]{.ru}', '[сего́дня пе́рвое ма́рта]{.ru}']}
  why: |
    第 1–3、11 题：时间词组：一点只说 [в час]{.ru}；2–4 后用 [часа́]{.ru}；5 以上用 [мину́т]{.ru}；[че́рез]{.ru} 后用第四格 [неде́лю]{.ru}。
    第 4、16 题：“在几号”用第二格且不加 [в]{.ru}；“今天几号”用中性第一格。
    第 10 题：[сентя́брь]{.ru} 变格时重音在词尾：[в сентябре́]{.ru}。
    第 5、13 题：[бу́ду]{.ru} 只接未完成体不定式；要说读完，直接用 [прочита́ю]{.ru}。
    第 6 题：[ка́ждый день]{.ru} 表示反复，用未完成体 [покупа́ю]{.ru}。第 7 题：完成体不和表示持续时间的 [два часа́]{.ru} 连用。
    第 8、9、15 题：命令式从 [они́]{.ru} 的词干构成：[откро́ют → откро́йте]{.ru}；[-и]{.ru} 后面加 [-сь]{.ru}：[сади́сь]{.ru}；[отве́чу]{.ru} 的重音在词干，加 [-ь]{.ru}，不带交替：[отве́ть]{.ru}。
    第 12、14 题：[тре́тий, ка́ждый]{.ru} 和名词性一致：[тре́тья неде́ля, ка́ждое у́тро]{.ru}。
- id: L50-05
  tags: [复习：时刻与时长]
  task: 把括号里的时间写成句中的形式（数字用词写出）。
  type: fill
  recycles: [L47-04, L47-05, L49-综合-c]
  items:
  - {stem: 'Уро́к начина́ется ___.', hint: '8:00', accept: [в во́семь часо́в]}
  - {stem: 'Мы занима́лись ___.', hint: '3 час', accept: [три часа́]}
  - {stem: 'Ми́ша вернётся ___.', hint: 'че́рез, 1 час', accept: [че́рез час]}
  - {stem: 'А́нна звони́ла ___ наза́д.', hint: '15 мину́та', accept: [пятна́дцать мину́т]}
  - {stem: 'Ван Лэй жил в Пеки́не ___.', hint: '21 год', accept: [два́дцать оди́н год]}
  - {stem: 'Семина́р бу́дет ___.', hint: 'пя́тница', accept: [в пя́тницу]}
  - {stem: 'Магази́н закрыва́ется ___.', hint: '22:00', accept: [в два́дцать два часа́]}
  - {stem: 'Мы жда́ли авто́бус ___.', hint: '2 мину́та', accept: [две мину́ты]}
  - stem: Ле́кция начина́ется ___.
    hint: '10:00'
    accept:
    - в де́сять часо́в
  - stem: Па́па рабо́тал ___.
    hint: 8 час
    accept:
    - во́семь часо́в
  - stem: Ма́ма вернётся ___.
    hint: че́рез, 2 неде́ля
    accept:
    - че́рез две неде́ли
  - stem: Ю́ми звони́ла ___ наза́д.
    hint: 1 час
    accept:
    - час
  - stem: Мы жи́ли на да́че ___.
    hint: 3 ме́сяц
    accept:
    - три ме́сяца
  - stem: Контро́льная рабо́та бу́дет ___.
    hint: среда́
    accept:
    - в сре́ду
  - stem: Мы у́жинаем ___.
    hint: '19:00'
    accept:
    - в девятна́дцать часо́в
    - в семь часо́в
  - stem: Пьер звони́л ___ наза́д.
    hint: 3 неде́ля
    accept:
    - три неде́ли
  - stem: Ми́ша спал ___.
    hint: 10 час
    accept:
    - де́сять часо́в
  - stem: Уро́к начнётся ___.
    hint: че́рез, 5 мину́та
    accept:
    - че́рез пять мину́т
  - stem: Конце́рт был ___.
    hint: суббо́та
    accept:
    - в суббо́ту
  - stem: Мы гуля́ли в па́рке ___.
    hint: полчаса́
    accept:
    - полчаса́
  - stem: Апте́ка открыва́ется ___.
    hint: '9:00'
    accept:
    - в де́вять часо́в
  - stem: Мы бу́дем жить на да́че ___.
    hint: ию́ль
    accept:
    - в ию́ле
  why: |-
    第 1、7、9、15、21 题：几点做某事用 [в]{.ru} + 钟点：[в во́семь часо́в, в два́дцать два часа́, в де́сять часо́в, в де́вять часо́в]{.ru}；[в девятна́дцать часо́в]{.ru} 口语里也说 [в семь часо́в]{.ru}。第 6、14、19 题星期几用 [в]{.ru} + 第四格：[в пя́тницу, в сре́ду, в суббо́ту]{.ru}。
    第 2、5、8、10、13、17、20 题：没有前置词的时长表示持续多久：[три часа́, две мину́ты, во́семь часо́в, три ме́сяца, де́сять часо́в, полчаса́]{.ru}；第 5 题最后一个数词是 [оди́н]{.ru}，用 [год]{.ru}。
    第 3、11、18 题：[че́рез]{.ru} + 第四格；数量为 1 时只用名词：[че́рез час]{.ru}；[че́рез две неде́ли, че́рез пять мину́т]{.ru}。
    第 4、12、16 题：[наза́д]{.ru} 前面的时长：5 以上用 [мину́т]{.ru}，2–4 用单数第二格 [неде́ли]{.ru}，一小时只说 [час]{.ru}。
    第 22 题：只说月份用 [в]{.ru} + 第六格：[в ию́ле]{.ru}。
