  rows:
  - base: '[вуз]{.ru}'
    cells:
    - '[вуз]{.ru}'
    - '[в ву́зе]{.ru}'
    hint: 第六格
  - base: '[МГУ]{.ru}'
    cells:
    - '[МГУ]{.ru}'
    - '[в МГУ]{.ru}'
    hint: 第六格
  - base: '[к + молодо́й атташе́]{.ru}'
    cells:
    - '[к + молодо́й атташе́]{.ru}'
    - '[к молодо́му атташе́]{.ru}'
  - base: '[ую́тное кафе́]{.ru}'
    cells:
    - '[ую́тное кафе́]{.ru}'
    - '[об ую́тном кафе́]{.ru}'
  - base: '[с + Ивано́вы]{.ru}'
    cells:
    - '[с + Ивано́вы]{.ru}'
    - '[с Ивано́выми]{.ru}'
  - base: '[у + А́нна Шмидт]{.ru}'
    cells:
    - '[у + А́нна Шмидт]{.ru}'
    - '[у А́нны Шмидт]{.ru}'
  - base: '[с + Пётр Ивано́в]{.ru}'
    cells:
    - '[с + Пётр Ивано́в]{.ru}'
    - '[с Петро́м Ивано́вым]{.ru}'
  - base: '[под]{.ru} + [Пу́шкин]{.ru}（[го́род]{.ru}）'
    cells:
    - '[под]{.ru} + [Пу́шкин]{.ru}（[го́род]{.ru}）'
    - '[под Пу́шкином]{.ru}'
  - base: '[без + продаве́ц]{.ru}'
    cells:
    - '[без + продаве́ц]{.ru}'
    - '[без продавца́]{.ru}'
  - base: '[к + певе́ц]{.ru}'
    cells:
    - '[к + певе́ц]{.ru}'
    - '[к певцу́]{.ru}'
  - base: '[кита́ец]{.ru}'
    cells:
    - '[кита́ец]{.ru}'
    - '[о кита́йце]{.ru}'
  - base: '[с + сыно́к]{.ru}'
    cells:
    - '[с + сыно́к]{.ru}'
    - '[с сынко́м]{.ru}'
  - base: '[из + городо́к]{.ru}'
    cells:
    - '[из + городо́к]{.ru}'
    - '[из городка́]{.ru}'
  - base: '[с + больша́я ве́жливость]{.ru}'
    cells:
    - '[с + больша́я ве́жливость]{.ru}'
    - '[с большо́й ве́жливостью]{.ru}'
  - base: '[организа́ция]{.ru}'
    cells:
    - '[организа́ция]{.ru}'
    - '[в организа́ции]{.ru}'
    hint: 第六格
  - base: '[из + РФ]{.ru}'
    cells:
    - '[из + РФ]{.ru}'
    - '[из РФ]{.ru}'
  - base: '[МИД]{.ru}'
    cells:
    - '[МИД]{.ru}'
    - '[в МИ́Де]{.ru}'
    hint: 第六格
  - base: '[к + Со́фья Толста́я]{.ru}'
    cells:
    - '[к + Со́фья Толста́я]{.ru}'
    - '[к Со́фье Толсто́й]{.ru}'
  - base: '[о + Ива́н Черны́х]{.ru}'
    cells:
    - '[о + Ива́н Черны́х]{.ru}'
    - '[об Ива́не Черны́х]{.ru}'
  - base: '[Москва́-река́]{.ru}'
    cells:
    - '[Москва́-река́]{.ru}'
    - '[на Москве́-реке́]{.ru}'
    hint: 第六格
  - base: '[Ива́ново]{.ru}'
    cells:
    - '[Ива́ново]{.ru}'
    - '[в Ива́нове]{.ru}'
    hint: 第六格
  - base: '[без + информа́ция]{.ru}'
    cells:
    - '[без + информа́ция]{.ru}'
    - '[без информа́ции]{.ru}'
  why: |-
    第 1、17 题：以辅音结尾、按单词读的缩略词作阳性名词变格：[в ву́зе, в МИ́Де]{.ru}。
    第 2、16 题：按字母读的缩略词不变格：[в МГУ, из РФ]{.ru}。
    第 3、4 题：不变格名词本身不变，只有形容词变：[к молодо́му атташе́]{.ru}（阳性），[об ую́тном кафе́]{.ru}（中性）。
    第 5、7 题：[-ов]{.ru} 姓复数第五格 [-ыми]{.ru}，男性第五格 [-ым]{.ru}：[с Ивано́выми, с Петро́м Ивано́вым]{.ru}。
    第 6 题：辅音结尾的外来姓，女性不变格：[у А́нны Шмидт]{.ru}。
    第 8 题：城市名第五格 [-ом]{.ru}：[под Пу́шкином]{.ru}。
    第 9–11 题：[-ец]{.ru} 的 [е]{.ru} 脱落：[продавца́, певцу́]{.ru}（重音移到词尾）；[кита́йце]{.ru}（[е]{.ru} 脱落后写 [й]{.ru}，重音不移）。
    第 12、13 题：[-о́к]{.ru} 的 [о]{.ru} 脱落，重音在词尾：[с сынко́м, из городка́]{.ru}。
    第 14、15、22 题：[-ость]{.ru} 名词按 [тетра́дь]{.ru} 变格：[с большо́й ве́жливостью]{.ru}；[-ация]{.ru} 名词第二、六格 [-ии]{.ru}：[в организа́ции, без информа́ции]{.ru}。
    第 18 题：[-ая]{.ru} 姓按形容词变格：[к Со́фье Толсто́й]{.ru}。
    第 19 题：[-ых]{.ru} 姓不变格：[об Ива́не Черны́х]{.ru}。
    第 20 题：[Москва́-река́]{.ru} 两部分都变格：[на Москве́-реке́]{.ru}。
    第 21 题：[-ово]{.ru} 地名按中性名词变格：[в Ива́нове]{.ru}。
