    - '[рассказа́ть о разви́тии]{.ru}'
    - '[рассказа́ть о разви́тии]{.ru}'
  why: |-
    第 1 题：按字母读的缩略词不变格：[в МГУ]{.ru}。
    第 2 题：[-ов]{.ru} 姓（人）第五格是 [-ым]{.ru}：[с Ивано́вым]{.ru}。
    第 3 题：辅音结尾的外来姓，女性不变格：[с А́нной Шмидт]{.ru}。
    第 4、12 题：[пальто́]{.ru} 是中性：[в но́вом пальто́]{.ru}；[ко́фе]{.ru} 按规范是阳性：[горя́чий ко́фе]{.ru}。
    第 5 题：[ч]{.ru} 后不重读的后缀写 [-ев-]{.ru}：[ключево́й]{.ru}。
    第 6 题：[-ость]{.ru} 名词是阴性：[больша́я бли́зость]{.ru}。
    第 7 题：[-о́к]{.ru} 变格时 [о]{.ru} 脱落：[у сынка́]{.ru}。
    第 8 题：[разгова́ривать]{.ru} 是双方交谈，不接第三格，要说 [разгова́ривал с ним]{.ru}；只想说“对他说”，用 [сказа́л ему́]{.ru}。
    第 9 题：[МГУ]{.ru} 的主要词是 [университе́т]{.ru}，阳性：[был осно́ван]{.ru}。
    第 10 题：[кита́ец]{.ru} 的 [е]{.ru} 脱落后写 [й]{.ru}：[о кита́йце]{.ru}。
    第 11 题：城市名第五格 [-ом]{.ru}：[под Пу́шкином]{.ru}。
    第 13、14 题：没有错误：[у Петро́вых]{.ru}（复数姓第二格像形容词），[о разви́тии]{.ru}（[-тие]{.ru} 名词第六格 [-ии]{.ru}）。
