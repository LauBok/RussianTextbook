    第 1、2 题：形容词去词尾加 [-ость]{.ru}：[ве́жливость]{.ru}；[молодо́й]{.ru} 重音前移：[мо́лодость]{.ru}。
    第 3、4 题：[-ить]{.ru} 动词构成 [-ение]{.ru}：[изуче́ние]{.ru}；单音节词根的 [приня́ть]{.ru} 构成 [-тие]{.ru}：[приня́тие]{.ru}。
    第 5 题：[д]{.ru} 后写 [-чик]{.ru}：[перево́дчик]{.ru}。
    第 6 题：外来名词加 [-ист]{.ru}：[журнали́ст]{.ru}。
    第 7 题：[-овать]{.ru} 动词保留 [-ова-]{.ru}：[иссле́дователь]{.ru}。
    第 8、9 题：[певе́ц]{.ru} → [певи́ца]{.ru}；[-тель]{.ru} → [-тельница]{.ru}：[писа́тельница]{.ru}。
    第 10 题：[ц]{.ru} 在 [-н]{.ru}- 前变 [ч]{.ru}：[со́лнечный]{.ru}。
    第 11 题：[ч]{.ru} 后后缀不重读写 [-ев-]{.ru}：[ключево́й]{.ru}。
    第 12 题：[г]{.ru} 在 [-еск-]{.ru} 前变 [ж]{.ru}：[дру́жеский]{.ru}。
    第 13 题：[г]{.ru} 在 [-ок]{.ru} 前变 [ж]{.ru}：[пирожо́к]{.ru}。
    第 14 题：[ма́ма]{.ru} 加 [-очк-]{.ru}：[ма́мочка]{.ru}。
