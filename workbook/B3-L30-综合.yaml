    - '[жить под Пу́шкином]{.ru}'
  - base: '[горя́чее ко́фе]{.ru}'
    cells:
    - '[горя́чее ко́фе]{.ru}'
    - '[горя́чий ко́фе]{.ru}'
  - base: '[в гостя́х у Петро́вых]{.ru}'
    cells:
