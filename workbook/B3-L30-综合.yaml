    answer: 形容词
  - text: '[зарпла́та]{.ru}'
    answer: 复合词·缩略词
  - text: '[информа́ция]{.ru}'
    answer: 性质·抽象名词
  - text: '[писа́тельница]{.ru}'
    answer: 人称名词
  - text: '[Са́шенька]{.ru}'
    answer: 指小表爱形式
  - text: '[ключево́й]{.ru}'
    answer: 形容词
  - text: '[теплохо́д]{.ru}'
    answer: 复合词·缩略词
  - text: '[мо́лодость]{.ru}'
    answer: 性质·抽象名词
  - text: '[китая́нка]{.ru}'
    answer: 人称名词
  - text: '[пирожо́к]{.ru}'
    answer: 指小表爱形式
  - text: '[городско́й]{.ru}'
    answer: 形容词
  why: |-
    第 1、6、11、16、21 题：表示性质、状态、动作的名词：[-ость]{.ru}（[сло́жность, мо́лодость]{.ru}）、[-ство]{.ru}（[госуда́рство]{.ru}）、[-тие]{.ru}（[разви́тие]{.ru}）、[-ация]{.ru}（[информа́ция]{.ru}）。
    第 2、7、12、17、22 题：表示人的名词：[-чик]{.ru}（[перево́дчик]{.ru}）、[-ист]{.ru}（[журнали́ст]{.ru}）、[-ец]{.ru}（[продаве́ц]{.ru}），阴性 [-ница, -янка]{.ru}（[писа́тельница, китая́нка]{.ru}）。
    第 3、8、13、18、23 题：指小表爱形式：[-ик]{.ru}（[до́мик]{.ru}）、[-очк-]{.ru}（[мину́точка]{.ru}）、[-ок]{.ru}（[городо́к, пирожо́к]{.ru}）、[-еньк-]{.ru}（[Са́шенька]{.ru}）。注意 [городо́к]{.ru} 是名词，[городско́й]{.ru} 是形容词。
    第 4、9、14、19、24 题：形容词后缀：[-янн-]{.ru}（[деревя́нный]{.ru}）、[-еск-]{.ru}（[челове́ческий]{.ru}）、[-лив-]{.ru}（[молчали́вый]{.ru}）、[-ев-]{.ru}（[ключево́й]{.ru}）、[-ск-]{.ru}（[городско́й]{.ru}）。
    第 5、10、15、20 题：复合词（[пылесо́с, теплохо́д]{.ru}）和缩略词（[вуз, зарпла́та]{.ru}）。
