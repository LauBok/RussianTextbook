  why: |-
    第 1、2 题：按字母读的 [МГУ]{.ru} 不变格；按单词读、以辅音结尾的 [МИД]{.ru} 变格：[в МИ́Де]{.ru}。
    第 3、11 题：[ко́фе]{.ru} 是阳性：[чёрный ко́фе]{.ru}；[кафе́]{.ru} 是中性，不变格，只有形容词变：[в ую́тном кафе́]{.ru}。
    第 4、5 题：[-ов]{.ru} 姓男性第五格 [-ым]{.ru}：[с профе́ссором Смирно́вым]{.ru}；女性第二格 [-ой]{.ru}：[Мари́и Смирно́вой]{.ru}。
    第 6 题：[-о́к]{.ru} 复数各格 [о]{.ru} 脱落，重音在词尾：[пирожка́ми]{.ru}。
    第 7 题：[-ация]{.ru} 名词第六格 [-ии]{.ru}：[об э́той организа́ции]{.ru}。
    第 8、9 题：[-ец]{.ru} 的 [е]{.ru} 脱落：[с кита́йцем]{.ru}（元音后写 [й]{.ru}），[продавца́]{.ru}（重音移到词尾，动物名词第四格同第二格）。
    第 10 题：城市名第五格 [-ом]{.ru}：[под Ки́ровом]{.ru}。
    第 12 题：[Москва́-река́]{.ru} 两部分都变格：[по Москве́-реке́]{.ru}。
