    - —
    - —
  - base: '[о кни́ге, кото́рую пи́шет мой оте́ц]{.ru}'
    cells:
    - '[о кни́ге, кото́рую пи́шет мой оте́ц]{.ru}'
    - —
    - —
  - base: '[к студе́нтам, кото́рые изуча́ют фи́зику]{.ru}'
    cells:
    - '[к студе́нтам, кото́рые изуча́ют фи́зику]{.ru}'
    - '[изуча́ющим]{.ru}'
    - —
  - base: '[в теа́тре, в кото́ром выступа́л Шаля́пин]{.ru}'
    cells:
    - '[в теа́тре, в кото́ром выступа́л Шаля́пин]{.ru}'
    - —
    - —
  - base: '[Я ви́дел карти́ну, кото́рую купи́л музе́й.]{.ru}'
    cells:
    - '[Я ви́дел карти́ну, кото́рую купи́л музе́й.]{.ru}'
    - '[ку́пленную]{.ru}'
    - '[музе́ем]{.ru}'
  - base: '[из письма́, кото́рое присла́л брат]{.ru}'
    cells:
    - '[из письма́, кото́рое присла́л брат]{.ru}'
    - '[при́сланного]{.ru}'
    - '[бра́том]{.ru}'
  - base: '[с учёным, кото́рый откры́л но́вый элеме́нт]{.ru}'
    cells:
