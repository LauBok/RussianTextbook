heading: 第 6 课　形动词短语与从句的互换
groups:
- id: B3-L06-01
  lessons:
  - B3-L06
  tags:
  - 形动词与 кото́рый：能否互换
  - 形动词与 кото́рый：不能互换的情况
  task: 这些 [кото́рый]{.ru} 从句能换成形动词短语吗？归栏。
  type: classify
  bins:
  - 可换主动形动词
  - 可换被动形动词
  - 不能换
  items:
  - text: '[студе́нт, кото́рый живёт в общежи́тии]{.ru}'
    answer: 可换主动形动词
  - text: '[письмо́, кото́рое написа́л брат]{.ru}'
    answer: 可换被动形动词
  - text: '[дом, в кото́ром мы живём]{.ru}'
    answer: 不能换
  - text: '[зада́ча, кото́рую реша́ют студе́нты]{.ru}'
    answer: 可换被动形动词
  - text: '[друг, кото́рому я позвони́л]{.ru}'
    answer: 不能换
  - text: '[студе́нты, кото́рые прие́дут за́втра]{.ru}'
    answer: 不能换
  - text: '[статья́, кото́рую пи́шет профе́ссор]{.ru}'
    answer: 不能换
  - text: '[же́нщина, кото́рая рабо́тала в больни́це]{.ru}'
    answer: 可换主动形动词
  - text: '[лю́ди, кото́рые верну́лись с войны́]{.ru}'
    answer: 可换主动形动词
  - text: '[рома́н, кото́рый перевела́ моя́ сестра́]{.ru}'
    answer: 可换被动形动词
  - text: '[де́вочка, кото́рая пла́чет в коридо́ре]{.ru}'
    answer: 可换主动形动词
  - text: '[пробле́ма, кото́рую обсужда́ют в газе́тах]{.ru}'
    answer: 可换被动形动词
  - text: '[го́род, кото́рый каза́лся мне ма́леньким]{.ru}'
    answer: 可换主动形动词
  - text: '[по́езд, кото́рый ско́ро придёт]{.ru}'
    answer: 不能换
  - text: '[рабо́та, кото́рую я хоте́л бы найти́]{.ru}'
    answer: 不能换
  - text: '[маши́на, кото́рой управля́ет робо́т]{.ru}'
    answer: 可换被动形动词
  - text: '[о́пыт, кото́рый провели́ студе́нты]{.ru}'
    answer: 可换被动形动词
  - text: '[тури́сты, кото́рые осма́тривают го́род]{.ru}'
    answer: 可换主动形动词
  why: |-
    第 1、8、9、11、13、18 题：[кото́рый]{.ru} 是第一格，从句是现在时或过去时，换成主动形动词：[живу́щий, рабо́тавшая, верну́вшиеся, пла́чущая, каза́вшийся, осма́тривающие]{.ru}。第 13 题 [каза́ться]{.ru} 不及物，只能换主动形动词。
    第 2、4、10、12、17 题：[кото́рый]{.ru} 是第四格，换成被动形动词，从句主语变第五格：[напи́санное бра́том, реша́емая студе́нтами, переведённый мое́й сестро́й, проведённый студе́нтами]{.ru}；第 12 题从句没有主语，形动词短语里也没有第五格：[обсужда́емая в газе́тах]{.ru}。
    第 16 题：[кото́рой]{.ru} 是第五格，一般不能换；[управля́ть]{.ru} 是课文讲的例外，有被动形动词：[маши́на, управля́емая робо́том]{.ru}。
    第 3、5 题：[кото́рый]{.ru} 带前置词或用第三格，不能换。
    第 6、14 题：从句是将来时，不换。第 15 题：从句带 [бы]{.ru}，不换。
    第 7 题：[кото́рую]{.ru} 是第四格，但 [писа́ть]{.ru} 没有被动形动词现在时，只能用从句。
