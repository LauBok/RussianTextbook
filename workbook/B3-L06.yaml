  why: |-
    第 1、3、8、12 题：[кото́рый]{.ru} 是第一格，换主动形动词，时间和体不变，格跟被说明的名词：[в дере́вню → стоя́щую]{.ru}（第四格），[с друзья́ми → жи́вшими]{.ru}，[к студе́нтам → изуча́ющим]{.ru}，[с учёным → откры́вшим]{.ru}。主动形动词没有第五格发出者。
    第 2、5、10、11 题：完成体过去时 + 第四格 [кото́рый]{.ru} → 被动形动词过去时，从句主语变第五格：[приглашённой Ива́ном, организо́ванном университе́том, ку́пленную музе́ем, при́сланного бра́том]{.ru}。形动词的格不看 [кото́рый]{.ru}，看名词：[о де́вушке]{.ru} 第六格，[карти́ну]{.ru} 第四格，[из письма́]{.ru} 第二格。
    第 4 题：未完成体现在时 → 被动形动词现在时：[воспи́тываемых ба́бушкой]{.ru}（[для дете́й]{.ru} 复数第二格）。
    第 14 题：不定人称句，没有主语，形动词短语里也就没有发出者：[по доро́ге, постро́енной в про́шлом ве́ке]{.ru}。
    第 6、9 题：[кото́рый]{.ru} 是第三格或带前置词，不能换。第 7 题：[писа́ть]{.ru} 没有被动形动词现在时。第 13 题：将来时不换。
- id: B3-L06-03
  lessons:
  - B3-L06
  tags:
  - 形动词与 кото́рый：形动词 → 从句
  task: 把形动词短语还原成从句：写出 [кото́рый]{.ru} 的形式和从句的动词。
  type: matrix
  cols:
  - 形动词短语
  - кото́рый 的形式
  - 从句动词
  given:
  - 0
  rows:
  - base: '[студе́нты, сда́вшие экза́мен]{.ru}'
    cells:
    - '[студе́нты, сда́вшие экза́мен]{.ru}'
    - '[кото́рые]{.ru}'
    - '[сда́ли]{.ru}'
  - base: '[в письме́, полу́ченном ма́мой]{.ru}'
    cells:
    - '[в письме́, полу́ченном ма́мой]{.ru}'
    - '[кото́рое]{.ru}'
    - '[получи́ла]{.ru}'
  - base: '[с детьми́, игра́ющими во дворе́]{.ru}'
    cells:
    - '[с детьми́, игра́ющими во дворе́]{.ru}'
    - '[кото́рые]{.ru}'
    - '[игра́ют]{.ru}'
  - base: '[к же́нщине, продаю́щей цветы́]{.ru}'
    cells:
    - '[к же́нщине, продаю́щей цветы́]{.ru}'
    - '[кото́рая]{.ru}'
    - '[продаёт]{.ru}'
  - base: '[фильм, люби́мый все́ми детьми́]{.ru}'
    cells:
    - '[фильм, люби́мый все́ми детьми́]{.ru}'
    - '[кото́рый]{.ru}'
    - '[лю́бят]{.ru}'
  - base: '[у дру́га, верну́вшегося из а́рмии]{.ru}'
    cells:
    - '[у дру́га, верну́вшегося из а́рмии]{.ru}'
    - '[кото́рый]{.ru}'
    - '[верну́лся]{.ru}'
  - base: '[зада́чи, реша́емые компью́тером]{.ru}'
    cells:
    - '[зада́чи, реша́емые компью́тером]{.ru}'
    - '[кото́рые]{.ru}'
    - '[реша́ет]{.ru}'
  - base: '[на фотогра́фии, сде́ланной отцо́м]{.ru}'
    cells:
    - '[на фотогра́фии, сде́ланной отцо́м]{.ru}'
    - '[кото́рую]{.ru}'
    - '[сде́лал]{.ru}'
  - base: '[о студе́нтке, поступи́вшей в университе́т]{.ru}'
    cells:
    - '[о студе́нтке, поступи́вшей в университе́т]{.ru}'
    - '[кото́рая]{.ru}'
    - '[поступи́ла]{.ru}'
  - base: '[пе́сни, исполня́емые хо́ром]{.ru}'
    cells:
    - '[пе́сни, исполня́емые хо́ром]{.ru}'
    - '[кото́рые]{.ru}'
    - '[исполня́ет]{.ru}'
    new: true
    gloss: исполня́ть 演唱
  - base: '[дом, постро́енный де́дом]{.ru}'
    cells:
    - '[дом, постро́енный де́дом]{.ru}'
    - '[кото́рый]{.ru}'
    - '[постро́ил]{.ru}'
  - base: '[о го́роде, осно́ванном в XII ве́ке]{.ru}'
    cells:
    - '[о го́роде, осно́ванном в XII ве́ке]{.ru}'
    - '[кото́рый]{.ru}'
    - '[основа́ли / был осно́ван]{.ru}'
  why: |-
    第 1、3、4、6、9 题：主动形动词还原成第一格 [кото́рый]{.ru}，性数跟名词：[кото́рые сда́ли, кото́рые игра́ют, кото́рая продаёт, кото́рый верну́лся, кото́рая поступи́ла]{.ru}。现在时形动词还原成现在时，过去时形动词还原成过去时，体不变（[сда́вшие → сда́ли]{.ru}）。被说明的名词是间接格，[кото́рый]{.ru} 照样用第一格：[к же́нщине, кото́рая продаёт]{.ru}。
    第 2、5、7、8、10、11 题：被动形动词还原成第四格 [кото́рый]{.ru}，第五格的发出者变成从句主语，动词与它一致：[кото́рое получи́ла ма́ма, кото́рый лю́бят все де́ти, кото́рые реша́ет компью́тер, кото́рую сде́лал оте́ц, кото́рые исполня́ет хор, кото́рый постро́ил дед]{.ru}。阳性、复数非动物名词的第四格同第一格：[кото́рый, кото́рые]{.ru}；阴性用 [кото́рую]{.ru}（第 8 题），中性 [кото́рое]{.ru}（第 2 题）。
    第 12 题：没有第五格发出者，还原成不定人称句 [кото́рый основа́ли]{.ru}，也可以用短尾被动形动词 [кото́рый был осно́ван]{.ru}（这时 [кото́рый]{.ru} 是第一格）。
