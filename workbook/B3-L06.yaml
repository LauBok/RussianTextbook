  - base: '[на конце́рте, кото́рый организова́л университе́т]{.ru}'
    cells:
    - '[на конце́рте, кото́рый организова́л университе́т]{.ru}'
    - '[организо́ванном]{.ru}'
    - '[университе́том]{.ru}'
  - base: '[у челове́ка, кото́рому я написа́л]{.ru}'
    cells:
