    第 3、12、13、15 题：[пять]{.ru} 以上和整十、[сто]{.ru}，用复数第二格 [рубле́й]{.ru}。

    第 7–9、18 题：11–14 是一个词，最后一个词不是 [оди́н, два]{.ru}，用 [рубле́й]{.ru}。'
- id: L39-03
  tags:
  - 数词与 рубль 连用：末两位数字核查
  task: 按 [рубль]{.ru} 的形式把数字归类。
  type: classify
  bins:
  - '[рубль]{.ru}'
  - '[рубля́]{.ru}'
  - '[рубле́й]{.ru}'
  items:
  - text: '[31]{.ru}'
    answer: '[рубль]{.ru}'
  - text: '[11]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[42]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[12]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[24]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[14]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[81]{.ru}'
    answer: '[рубль]{.ru}'
  - text: '[13]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[53]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[60]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[71]{.ru}'
    answer: '[рубль]{.ru}'
  - text: '[99]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[2]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[16]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[34]{.ru}'
    answer: '[рубля́]{.ru}'
  - text: '[41]{.ru}'
    answer: '[рубль]{.ru}'
  - text: '[100]{.ru}'
    answer: '[рубле́й]{.ru}'
  - text: '[22]{.ru}'
    answer: '[рубля́]{.ru}'
  why: '第 1、7、11、16 题：末位是 1，但不是 11：[рубль]{.ru}。

    第 3、5、9、13、15、18 题：末位是 2、3、4，但不是 12–14：[рубля́]{.ru}。

    第 2、4、6、8 题：11–14 结尾一律 [рубле́й]{.ru}，这是最容易错的一组。

    第 10、12、14、17 题：末位是 0、5–9，或 15–19：[рубле́й]{.ru}。'
- id: L39-04
  tags:
  - 价格问答：сто́ит / сто́ят 与数词
  task: 用括号里的数字写出价钱。
  type: fill
  items:
  - stem: Карто́шка сто́ит ___.
    hint: '45'
    accept:
    - со́рок пять рубле́й
  - stem: Лимо́н сто́ит ___.
    hint: '21'
    accept:
    - два́дцать оди́н рубль
  - stem: Хлеб сто́ит ___.
    hint: '33'
    accept:
    - три́дцать три рубля́
  - stem: Откры́тка сто́ит ___.
    hint: '12'
    accept:
    - двена́дцать рубле́й
  - stem: Ру́чка сто́ит ___.
    hint: '50'
    accept:
    - пятьдеся́т рубле́й
  - stem: Газе́та сто́ит ___.
    hint: '24'
    accept:
    - два́дцать четы́ре рубля́
  - stem: Тетра́дь сто́ит ___.
    hint: '61'
    accept:
    - шестьдеся́т оди́н рубль
  - stem: Чай сто́ит ___.
    hint: '90'
    accept:
    - девяно́сто рубле́й
  - stem: Слова́рь сто́ит ___.
    hint: '100'
    accept:
    - сто рубле́й
  - stem: Пиро́г сто́ит ___.
    hint: '72'
    accept:
    - се́мьдесят два рубля́
  - stem: Лимо́ны сто́ят ___.
    hint: '34'
    accept:
    - три́дцать четы́ре рубля́
  - stem: Сы́рники сто́ят ___.
    hint: '55'
    accept:
    - пятьдеся́т пять рубле́й
  why: '第 2、7 题：末位 1：[рубль]{.ru}。第 3、6、10、11 题：末位 2–4：[рубля́]{.ru}。

    第 1、4、5、8、9、12 题：末位 5–9、0，或 11–14：[рубле́й]{.ru}。第 4 题 [двена́дцать]{.ru} 用 [рубле́й]{.ru}。

    第 1–10 题：主语是单数商品，动词用 [сто́ит]{.ru}；第 11、12 题主语是复数，用 [сто́ят]{.ru}。价钱的形式只看数词。'
