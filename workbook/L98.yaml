heading: 第 98 课　否定代词与否定副词
groups:
- id: L98-01
  tags:
  - 否定代词与副词：变格与前置词位置
  task: 把疑问词的形式变成对应的否定词形式；有前置词的，注意前置词的位置。
  type: matrix
  cols:
  - 疑问词
  - 否定词
  given:
  - 0
  rows:
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[никто́]{.ru}'
  - base: '[кого́]{.ru}'
    cells:
    - '[кого́]{.ru}'
    - '[никого́]{.ru}'
  - base: '[кому́]{.ru}'
    cells:
    - '[кому́]{.ru}'
    - '[никому́]{.ru}'
  - base: '[кем]{.ru}'
    cells:
    - '[кем]{.ru}'
    - '[нике́м]{.ru}'
  - base: '[о ком]{.ru}'
    cells:
    - '[о ком]{.ru}'
    - '[ни о ком]{.ru}'
  - base: '[у кого́]{.ru}'
    cells:
    - '[у кого́]{.ru}'
    - '[ни у кого́]{.ru}'
  - base: '[с кем]{.ru}'
    cells:
    - '[с кем]{.ru}'
    - '[ни с кем]{.ru}'
  - base: '[к кому́]{.ru}'
    cells:
    - '[к кому́]{.ru}'
    - '[ни к кому́]{.ru}'
  - base: '[что]{.ru}'
    cells:
    - '[что]{.ru}'
    - '[ничто́]{.ru}'
  - base: '[чего́]{.ru}'
    cells:
    - '[чего́]{.ru}'
    - '[ничего́]{.ru}'
  - base: '[чему́]{.ru}'
    cells:
    - '[чему́]{.ru}'
    - '[ничему́]{.ru}'
  - base: '[чем]{.ru}'
    cells:
    - '[чем]{.ru}'
    - '[ниче́м]{.ru}'
  - base: '[о чём]{.ru}'
    cells:
    - '[о чём]{.ru}'
    - '[ни о чём]{.ru}'
  - base: '[с чем]{.ru}'
    cells:
    - '[с чем]{.ru}'
    - '[ни с чем]{.ru}'
  - base: '[где]{.ru}'
    cells:
    - '[где]{.ru}'
    - '[нигде́]{.ru}'
  - base: '[куда́]{.ru}'
    cells:
    - '[куда́]{.ru}'
    - '[никуда́]{.ru}'
  - base: '[когда́]{.ru}'
    cells:
    - '[когда́]{.ru}'
    - '[никогда́]{.ru}'
  - base: '[како́й]{.ru}'
    cells:
    - '[како́й]{.ru}'
    - '[никако́й]{.ru}'
  why: '第 1–4、9–12 题：[никто́, ничто́]{.ru} 按 [кто, что]{.ru} 变格，前面加 [ни-]{.ru}，连写：[никого́, никому́, нике́м, ничего́, ничему́, ниче́м]{.ru}。

    第 5–8、13、14 题：有前置词时，前置词夹在 [ни]{.ru} 和代词中间，分写成三个词：[ни о ком, ни у кого́, ни с кем, ни к кому́, ни о чём, ни с чем]{.ru}。不能写成 [о нико́м]{.ru}。

    第 15–18 题：否定副词和 [никако́й]{.ru} 由疑问词加 [ни-]{.ru} 构成：[нигде́, никуда́, никогда́, никако́й]{.ru}，重音在后面的词上。'
- id: L98-02
  tags:
  - 否定代词：双重否定与形式核查
  task: 核查否定句，把句子归类。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Я никогда́ не́ был в Сиби́ри.
    answer: 正确
  - text: Я никогда́ был в Сиби́ри.
    answer: 有错
  - text: Никто́ не звони́л.
    answer: 正确
  - text: Никто́ звони́л.
    answer: 有错
  - text: Я ничто́ не зна́ю.
    answer: 有错
  - text: Я ничего́ не зна́ю.
    answer: 正确
  - text: Он о ничём не ду́мает.
    answer: 有错
  - text: Он ни о чём не ду́мает.
    answer: 正确
  - text: Я никому́ не скажу́.
    answer: 正确
  - text: Мы никуда́ е́здим.
    answer: 有错
  - text: Ми́ша ни с кем не говори́л.
    answer: 正确
  - text: Ми́ша с нике́м не говори́л.
    answer: 有错
  - text: Тако́го о́зера нет нигде́.
    answer: 正确
  - text: Никто́ никогда́ не ви́дел медве́дя.
    answer: 正确
  - text: Он ниче́м не занима́ется.
    answer: 正确
  - text: Я не ви́дел никако́й медве́дь.
    answer: 有错
  - text: До́ма никого́ нет.
    answer: 正确
  - text: Никто́ никогда́ не не звони́л.
    answer: 有错
  why: '第 1、3、6、8、9、11、13、14、15、17 题：正确。有 [ни-]{.ru} 词的句子动词前还要加 [не]{.ru}（[нет]{.ru} 本身就是否定）；几个 [ни-]{.ru} 词只要一个 [не]{.ru}（第 14 题）。

    第 2、4、10 题：漏掉了 [не]{.ru}：[никогда́ не́ был, никто́ не звони́л, никуда́ не е́здим]{.ru}。第 18 题：[не]{.ru} 只要一个。

    第 5 题：否定句里的直接补语用第二格：[ничего́ не зна́ю]{.ru}。第 7、12 题：前置词放在 [ни]{.ru} 和代词中间：[ни о чём, ни с кем]{.ru}。

    第 16 题：[никако́й]{.ru} 和名词一致，否定句里用第二格：[никако́го медве́дя]{.ru}。'
- id: L98-03
  tags:
  - не́ был：быть 过去时否定的重音
  task: 写出 [быть]{.ru} 的过去时肯定和否定形式，标出重音。
  type: matrix
  cols:
  - 主语
  - 肯定
  - 否定
  given:
  - 0
  rows:
  - base: '[Ван Лэй]{.ru}'
    cells:
    - '[Ван Лэй]{.ru}'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
  - base: '[А́нна]{.ru}'
    cells:
    - '[А́нна]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
  - base: '[Ми́ша и Пьер]{.ru}'
    cells:
    - '[Ми́ша и Пьер]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
  - base: '[па́па]{.ru}'
    cells:
    - '[па́па]{.ru}'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  - base: '[я]{.ru}（由美）'
    cells:
    - '[я]{.ru}（由美）'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
  - base: '[ты]{.ru}（米沙）'
    cells:
    - '[ты]{.ru}（米沙）'
    - '[был]{.ru}'
    - '[не́ был]{.ru}'
  - base: '[письмо́]{.ru}'
    cells:
    - '[письмо́]{.ru}'
    - '[бы́ло]{.ru}'
    - '[не́ было]{.ru}'
  - base: '[О́льга Ви́кторовна]{.ru}'
    cells:
    - '[О́льга Ви́кторовна]{.ru}'
    - '[была́]{.ru}'
    - '[не была́]{.ru}'
  - base: '[де́ти]{.ru}'
    cells:
    - '[де́ти]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[бы́ли]{.ru}'
    - '[не́ были]{.ru}'
  why: '第 1、5、8 题：阳性 [был]{.ru}，加 [не]{.ru} 后重音移到 [не]{.ru} 上：[не́ был]{.ru}。第 3、6、9、11、12 题：中性、复数同样：[не́ было, не́ были]{.ru}。

    第 2、4、7、10 题：阴性重音在词尾，否定时不移动：[была́ → не была́]{.ru}。常见错误是写成 [не́ была]{.ru}。'
- id: L98-04
  tags:
  - 否定代词：格、前置词与 никако́й 的配合
  task: 用括号里否定词的正确形式填空。
  type: fill
  items:
  - stem: Я ___ не ви́дел.
    hint: никто́
    accept:
    - никого́
  - stem: Он ___ не бои́тся.
    hint: ничто́
    accept:
    - ничего́
  - stem: Я ___ не скажу́.
    hint: никто́
    accept:
    - никому́
  - stem: Он ___ не занима́ется.
    hint: ничто́
    accept:
    - ниче́м
  - stem: Она́ ___ не ду́мает.
    hint: о + ничто́
    accept:
    - ни о чём
  - stem: Мы ___ не говори́ли.
    hint: с + никто́
    accept:
    - ни с кем
  - stem: До́ма ___ нет.
    hint: никто́
    accept:
    - никого́
  - stem: Я там не ви́дел ___ медве́дя.
    hint: никако́й
    accept:
    - никако́го
  - stem: Ми́ша не занима́ется ___ спо́ртом.
    hint: никако́й
    accept:
    - никаки́м
  - stem: ___ не звони́л.
    hint: никто́
    accept:
    - Никто́
  - stem: Э́то ___ не нра́вится.
    hint: никто́
    accept:
    - никому́
  - stem: Он ___ не спра́шивал.
    hint: у + никто́
    accept:
    - ни у кого́
  - stem: У меня́ нет ___ пробле́мы.
    hint: никако́й
    accept:
    - никако́й
  - stem: Я ___ не ду́мал.
    hint: о + никто́
    accept:
    - ни о ком
  - stem: ___ сло́ва он не сказа́л.
    hint: никако́й
    accept:
    - Никако́го
  - stem: Мы ___ не пойдём.
    hint: к + никто́
    accept:
    - ни к кому́
  why: '第 1、7 题：[ви́деть]{.ru} 的补语和 [нет]{.ru} 后用第二（四）格 [никого́]{.ru}；第 2 题 [боя́ться]{.ru} 要求第二格 [ничего́]{.ru}。第 3、11 题：[сказа́ть кому́, нра́виться кому́]{.ru} 要求第三格 [никому́]{.ru}。第 4 题：[занима́ться чем]{.ru} 要求第五格 [ниче́м]{.ru}。第 10 题：作主语用第一格 [никто́]{.ru}。

    第 5、6、12、14、16 题：前置词放在 [ни]{.ru} 和代词中间：[ни о чём, ни с кем, ни у кого́, ни о ком, ни к кому́]{.ru}。

    第 8、9、13、15 题：[никако́й]{.ru} 像形容词一样跟名词一致：[никако́го медве́дя]{.ru}（阳性动物第二格），[никаки́м спо́ртом]{.ru}（第五格），[никако́й пробле́мы]{.ru}（阴性第二格），[никако́го сло́ва]{.ru}（中性第二格）。'
