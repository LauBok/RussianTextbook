- id: B2-L43-综合-d
  recycles:
  - B2-L40-03
  - B2-L41-03
  - B2-L42-03
  tags:
  - 综合：近义前缀辨析
  task: 下面每件事该用哪个动词？归入相应的栏。
  type: classify
  bins:
  - '[пришёл]{.ru}'
  - '[подошёл]{.ru}'
  - '[зашёл]{.ru}'
  - '[ушёл]{.ru}'
  - '[отошёл]{.ru}'
  - '[вы́шел]{.ru}'
  - '[пошёл]{.ru}'
  items:
  - text: 迪马专程来看生病的王磊（[к Ван Лэ́ю]{.ru}）
    answer: '[пришёл]{.ru}'
  - text: 皮埃尔第一个来到教室（[в аудито́рию]{.ru}）
    answer: '[пришёл]{.ru}'
  - text: 王磊走到售票窗口（[ка́сса]{.ru}）前
    answer: '[подошёл]{.ru}'
  - text: 公共汽车（[авто́бус]{.ru}）靠站了
    answer: '[подошёл]{.ru}'
  - text: 男孩走到黑板（[доска́]{.ru}）跟前
    answer: '[подошёл]{.ru}'
  - text: 爸爸下班路上顺便进了面包店（[бу́лочная]{.ru}）
    answer: '[зашёл]{.ru}'
  - text: 去大学的路上顺便看了看奶奶（[к ба́бушке]{.ru}）
    answer: '[зашёл]{.ru}'
  - text: 客人（[гость]{.ru}）告辞回家了，现在不在
    answer: '[ушёл]{.ru}'
  - text: 电话里：“米沙在家吗？”——“不在，他去学校（[в шко́лу]{.ru}）了。”
    answer: '[ушёл]{.ru}'
  - text: 爸爸一早去了工厂（[на заво́д]{.ru}），晚上才回来
    answer: '[ушёл]{.ru}'
  - text: 王磊从冰箱（[холоди́льник]{.ru}）前走开两步
    answer: '[отошёл]{.ru}'
  - text: 船（[теплохо́д]{.ru}）离开码头几米
    answer: '[отошёл]{.ru}'
  - text: 老师出教室（[из аудито́рии]{.ru}）一会儿，马上回来
    answer: '[вы́шел]{.ru}'
  - text: 米沙走出房间来到阳台（[на балко́н]{.ru}）
    answer: '[вы́шел]{.ru}'
  - text: 他从地铁站出来（[из метро́]{.ru}），看了看四周
    answer: '[вы́шел]{.ru}'
  - text: 下了课，大家动身去食堂；迪马也去了（[в столо́вую]{.ru}）
    answer: '[пошёл]{.ru}'
  - text: 听到消息，他马上动身去医院（[в больни́цу]{.ru}）
    answer: '[пошёл]{.ru}'
  - text: 迪马站起来，向门口走去（[к две́ри]{.ru}）
    answer: '[пошёл]{.ru}'
  why: |-
    第 1、2 题：[пришёл]{.ru} 来到某处、某人那里，人现在就在这儿。
    第 3–5 题：[подошёл]{.ru} 走到跟前、距离变近：[подошёл к ка́ссе, к доске́]{.ru}；车靠站 [авто́бус подошёл]{.ru}。
    第 6、7 题：[зашёл]{.ru} 去别处的路上顺便进去一下：[зашёл в бу́лочную, к ба́бушке]{.ru}。
    第 8–10 题：[ушёл]{.ru} 强调离开了、人不在这里。
    第 11、12 题：[отошёл]{.ru} 走开几步，没有走远。
    第 13–15 题：[вы́шел]{.ru} 从某个空间里出来，常常一会儿就回来。比较第 8 题 [ушёл]{.ru}。
    第 16–18 题：[пошёл]{.ru} 动身、开始朝某处走，说的是出发，不强调“人不在了”。第 18 题“向门口走去”用 [пошёл к две́ри]{.ru}；如果说“走到了门口”就用 [подошёл]{.ru}。
  lessons:
  - B2-L39
  - B2-L40
  - B2-L41
  - B2-L42
  - B2-L43
- id: B2-L43-综合-e
  recycles:
  - B2-L43-02
  - B2-L43-04
  tags:
  - 综合：前缀运动动词（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Ю́ми ___ в Москву́ в сентябре́ и бу́дет здесь год.
    hint: приезжа́ть / прие́хать
    accept:
    - прие́хала
  - stem: Ди́мы нет, он уже́ ___ домо́й.
    hint: уходи́ть / уйти́
    accept:
    - ушёл
  - stem: Не ___ у́лицу на кра́сный свет!
    hint: переходи́ть / перейти́
    accept:
    - переходи́
  - stem: По доро́ге в университе́т я всегда́ ___ в бу́лочную.
    hint: заходи́ть / зайти́
    accept:
    - захожу́
  - stem: Когда́ мы ___ ми́мо Кремля́, па́па рассказа́л его́ исто́рию.
    hint: проезжа́ть / прое́хать
    accept:
    - проезжа́ли
  - stem: По́езд ___ к ста́нции, и пассажи́ры вы́шли.
    hint: подходи́ть / подойти́
    accept:
    - подошёл
  - stem: За́втра я ___ в библиоте́ку и возьму́ кни́ги.
    hint: ходи́ть / сходи́ть
    accept:
    - схожу́
  - stem: Ма́ма ___ из ко́мнаты на мину́ту.
    hint: выходи́ть / вы́йти
    accept:
    - вы́шла
  - stem: На сле́дующей остано́вке нам на́до ___ .
    hint: сходи́ть / сойти́
    accept:
    - сойти́
  why: |-
    第 1、2、6、8 题：一次完成、有结果，用完成体过去时：[прие́хала, ушёл, подошёл, вы́шла]{.ru}。
    第 4 题：经常、每次，用未完成体现在时：[захожу́]{.ru}。
    第 5 题：过程，同时发生另一件事，用未完成体过去时：[проезжа́ли]{.ru}。
    第 3 题：禁止，用未完成体命令式：[не переходи́]{.ru}。
    第 7 题：将来去一趟又回来：[схожу́]{.ru}。
    第 9 题：[на́до]{.ru} 后说一次具体的下车，用完成体：[сойти́]{.ru}。
