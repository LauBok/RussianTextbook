  - base: '[уйти́ + друзья́]{.ru}'
    cells:
    - '[уйти́ + друзья́]{.ru}'
    - '[уйти́ от друзе́й]{.ru}'
  - base: '[прие́хать + роди́тели]{.ru}'
    cells:
    - '[прие́хать + роди́тели]{.ru}'
    - '[прие́хать к роди́телям]{.ru}'
  - base: '[перейти́ + пло́щадь]{.ru}'
    cells:
    - '[перейти́ + пло́щадь]{.ru}'
    - '[перейти́ (че́рез) пло́щадь]{.ru}'
  - base: '[пройти́ + магази́н]{.ru}'
    cells:
    - '[пройти́ + магази́н]{.ru}'
    - '[пройти́ ми́мо магази́на]{.ru}'
    hint: 从旁边
  - base: '[зайти́ + сок]{.ru}'
    cells:
    - '[зайти́ + сок]{.ru}'
    - '[зайти́ за со́ком]{.ru}'
    hint: 顺路去买
  - base: '[обойти́ + лу́жа]{.ru}'
    cells:
    - '[обойти́ + лу́жа]{.ru}'
    - '[обойти́ лу́жу]{.ru}'
    hint: 绕过
    new: true
    gloss: 水洼
  - base: '[сойти́ + авто́бус]{.ru}'
    cells:
    - '[сойти́ + авто́бус]{.ru}'
    - '[сойти́ с авто́буса]{.ru}'
  - base: '[уе́хать + Петербу́рг]{.ru}'
    cells:
    - '[уе́хать + Петербу́рг]{.ru}'
    - '[уе́хать из Петербу́рга]{.ru}'
  - base: '[подъе́хать + гости́ница]{.ru}'
    cells:
    - '[подъе́хать + гости́ница]{.ru}'
    - '[подъе́хать к гости́нице]{.ru}'
  - base: '[вы́йти + у́лица]{.ru}'
    cells:
    - '[вы́йти + у́лица]{.ru}'
    - '[вы́йти на у́лицу]{.ru}'
  - base: '[зайти́ + сосе́ди]{.ru}'
    cells:
    - '[зайти́ + сосе́ди]{.ru}'
    - '[зайти́ к сосе́дям]{.ru}'
  why: |-
    第 1、14 题：[под-]{.ru} + [к]{.ru} + 第三格：[к две́ри, к гости́нице]{.ru}。
    第 2、6 题：[от-, у-]{.ru}（离开人）+ [от]{.ru} + 第二格：[от окна́, от друзе́й]{.ru}。
    第 3 题：[до-]{.ru} + [до]{.ru} + 第二格：[до ста́нции]{.ru}。
    第 4、15 题：[в-]{.ru} + [в]{.ru} + 第四格；[вы́йти на у́лицу]{.ru} 说出去到哪里。
    第 5、13 题：[вы-, у-]{.ru}（离开地方）+ [из]{.ru} + 第二格：[из метро́, из Петербу́рга]{.ru}。[метро́]{.ru} 不变格。
    第 7、16 题：到人那里用 [к]{.ru} + 第三格：[к роди́телям, к сосе́дям]{.ru}。
    第 8 题：[пере-]{.ru} + 第四格，可加 [че́рез]{.ru}。第 9 题：[ми́мо]{.ru} + 第二格。
    第 10 题：取东西用 [за]{.ru} + 第五格：[за со́ком]{.ru}。第 11 题：[обойти́]{.ru} 直接接第四格：[лу́жу]{.ru}。
    第 12 题：从车上下来用 [с]{.ru} + 第二格：[сойти́ с авто́буса]{.ru}，不用 [из]{.ru}。
