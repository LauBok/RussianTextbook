  - base: '[об- + идти́]{.ru}'
    cells:
    - '[об- + идти́]{.ru}'
    - '[обходи́ть]{.ru}'
    - '[обойти́]{.ru}'
    - '[обошёл]{.ru}'
  - base: '[с- + идти́]{.ru}'
    cells:
    - '[с- + идти́]{.ru}'
    - '[сходи́ть]{.ru}'
    - '[сойти́]{.ru}'
    - '[сошёл]{.ru}'
    hint: 下来
  - base: '[раз-…-ся + идти́]{.ru}'
    cells:
    - '[раз-…-ся + идти́]{.ru}'
    - '[расходи́ться]{.ru}'
    - '[разойти́сь]{.ru}'
    - '[разошёлся]{.ru}'
  why: |-
    未完成体 = 前缀 + [ходи́ть]{.ru}，完成体 = 前缀 + [идти́]{.ru}（写成 [-йти]{.ru}），过去时照 [шёл]{.ru}。
    第 1、2、7–10 题：前缀以元音结尾，直接加：[прийти́, уйти́, дойти́, перейти́, пройти́, зайти́]{.ru}；[прийти́]{.ru} 写 [й]{.ru}，将来时 [приду́]{.ru} 不写。
    第 3、5、6、11–13 题：前缀以辅音结尾，在 [-йти]{.ru} 前加 [о]{.ru}：[войти́, подойти́, отойти́, обойти́, сойти́, разойти́сь]{.ru}；过去时 [вошёл, подошёл]{.ru}。
    第 4 题：[вы́-]{.ru} 的完成体重音在前缀：[вы́йти, вы́шел]{.ru}。
    第 13 题：未完成体 [рас-]{.ru} 在 [х]{.ru} 前清化：[расходи́ться]{.ru}；过去时 [разошёлся]{.ru}。
