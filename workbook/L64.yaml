  - base: '[журнали́ст]{.ru}'
    cells:
    - '[журнали́ст]{.ru}'
    - '[журнали́стом]{.ru}'
    - '[журнали́стка]{.ru}'
    - '[журнали́сткой]{.ru}'
    new: true
    gloss: 记者
  - base: '[писа́тель]{.ru}'
    cells:
    - '[писа́тель]{.ru}'
    - '[писа́телем]{.ru}'
    - '[писа́тельница]{.ru}'
    - '[писа́тельницей]{.ru}'
    new: true
    gloss: 作家
  - base: '[пиани́ст]{.ru}'
    cells:
    - '[пиани́ст]{.ru}'
    - '[пиани́стом]{.ru}'
    - '[пиани́стка]{.ru}'
    - '[пиани́сткой]{.ru}'
    new: true
    gloss: 钢琴家
  - base: '[спортсме́н]{.ru}'
    cells:
    - '[спортсме́н]{.ru}'
    - '[спортсме́ном]{.ru}'
    - '[спортсме́нка]{.ru}'
    - '[спортсме́нкой]{.ru}'
    new: true
    gloss: 运动员
  - base: '[инжене́р]{.ru}'
    cells:
    - '[инжене́р]{.ru}'
    - '[инжене́ром]{.ru}'
    - '[инжене́р]{.ru}'
    - '[инжене́ром]{.ru}'
    hint: 无阴性形式
  - base: '[врач]{.ru}'
    cells:
    - '[врач]{.ru}'
    - '[врачо́м]{.ru}'
    - '[врач]{.ru}'
    - '[врачо́м]{.ru}'
