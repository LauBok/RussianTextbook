  - 名词单数第五格：职业名词
  task: 写出职业名词的第五格和阴性形式。
  type: matrix
  cols:
  - 阳性
  - 阳性第五格
  - 阴性
  - 阴性第五格
  given:
  - 0
  rows:
  - base: '[учи́тель]{.ru}'
    cells:
    - '[учи́тель]{.ru}'
    - '[учи́телем]{.ru}'
    - '[учи́тельница]{.ru}'
    - '[учи́тельницей]{.ru}'
  - base: '[перево́дчик]{.ru}'
    cells:
    - '[перево́дчик]{.ru}'
    - '[перево́дчиком]{.ru}'
    - '[перево́дчица]{.ru}'
    - '[перево́дчицей]{.ru}'
  - base: '[арти́ст]{.ru}'
    cells:
    - '[арти́ст]{.ru}'
    - '[арти́стом]{.ru}'
    - '[арти́стка]{.ru}'
    - '[арти́сткой]{.ru}'
  - base: '[студе́нт]{.ru}'
    cells:
    - '[студе́нт]{.ru}'
    - '[студе́нтом]{.ru}'
    - '[студе́нтка]{.ru}'
    - '[студе́нткой]{.ru}'
  - base: '[продаве́ц]{.ru}'
    cells:
    - '[продаве́ц]{.ru}'
    - '[продавцо́м]{.ru}'
    - '[продавщи́ца]{.ru}'
    - '[продавщи́цей]{.ru}'
    hint: gen. [продавца́]{.ru}
  - base: '[шко́льник]{.ru}'
    cells:
    - '[шко́льник]{.ru}'
    - '[шко́льником]{.ru}'
    - '[шко́льница]{.ru}'
    - '[шко́льницей]{.ru}'
    new: true
