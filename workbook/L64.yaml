  - base: '[дире́ктор]{.ru}'
    cells:
    - '[дире́ктор]{.ru}'
    - '[дире́ктором]{.ru}'
    - '[дире́ктор]{.ru}'
    - '[дире́ктором]{.ru}'
    hint: 无阴性形式
  why: |
    第 1、8 题：[-тель]{.ru} 的阴性加 [-ница]{.ru}：[учи́тельница, писа́тельница]{.ru}；阳性第五格 [-ем]{.ru}，阴性 [ц]{.ru} 后不重读写 [-ей]{.ru}：[учи́тельницей]{.ru}。
    第 2 题：[-чик]{.ru} 的阴性是 [-чица]{.ru}：[перево́дчица — перево́дчицей]{.ru}。
    第 3、4、7、9、10 题：阴性加 [-ка]{.ru}，第五格 [-кой]{.ru}：[арти́сткой, студе́нткой, журнали́сткой]{.ru}。
    第 5 题：[продаве́ц]{.ru} 脱落 [е]{.ru}，重音在词尾：[продавцо́м]{.ru}；阴性是另一个词 [продавщи́ца]{.ru}，[ц]{.ru} 后不重读写 [-ей]{.ru}。
    第 6 题：[шко́льница]{.ru} 第五格 [шко́льницей]{.ru}。
    第 11–13 题：[инжене́р, врач, дире́ктор]{.ru} 没有阴性形式，指女性时不变：[Ма́ма была́ врачо́м.]{.ru}；[ч]{.ru} 后重读写 [-о́м]{.ru}：[врачо́м]{.ru}。
- id: L64-02
  tags:
  - быть + 第五格：职业句的时态
  task: 把职业句改成过去时和将来时。
  type: matrix
  cols:
  - 现在时
  - 过去时
  - 将来时
  given:
  - 0
  rows:
  - base: '[Он инжене́р.]{.ru}'
    cells:
    - '[Он инжене́р.]{.ru}'
    - '[Он был инжене́ром]{.ru}'
    - '[Он бу́дет инжене́ром]{.ru}'
  - base: '[Ма́ма врач.]{.ru}'
    cells:
    - '[Ма́ма врач.]{.ru}'
    - '[Ма́ма была́ врачо́м]{.ru}'
    - '[Ма́ма бу́дет врачо́м]{.ru}'
  - base: '[А́нна студе́нтка.]{.ru}'
    cells:
    - '[А́нна студе́нтка.]{.ru}'
    - '[А́нна была́ студе́нткой]{.ru}'
    - '[А́нна бу́дет студе́нткой]{.ru}'
  - base: '[Я перево́дчик.]{.ru}'
    cells:
    - '[Я перево́дчик.]{.ru}'
    - '[Я был перево́дчиком]{.ru}'
    - '[Я бу́ду перево́дчиком]{.ru}'
  - base: '[Ты учи́тельница?]{.ru}'
    cells:
    - '[Ты учи́тельница?]{.ru}'
    - '[Ты была́ учи́тельницей?]{.ru}'
    - '[Ты бу́дешь учи́тельницей?]{.ru}'
  - base: '[Па́па дире́ктор.]{.ru}'
    cells:
    - '[Па́па дире́ктор.]{.ru}'
    - '[Па́па был дире́ктором]{.ru}'
    - '[Па́па бу́дет дире́ктором]{.ru}'
  - base: '[Её сестра́ арти́стка.]{.ru}'
    cells:
    - '[Её сестра́ арти́стка.]{.ru}'
    - '[Её сестра́ была́ арти́сткой]{.ru}'
    - '[Её сестра́ бу́дет арти́сткой]{.ru}'
  - base: '[Вы перево́дчица?]{.ru}'
    cells:
    - '[Вы перево́дчица?]{.ru}'
    - '[Вы бы́ли перево́дчицей?]{.ru}'
    - '[Вы бу́дете перево́дчицей?]{.ru}'
  - base: '[Моя́ мать инжене́р.]{.ru}'
    cells:
    - '[Моя́ мать инжене́р.]{.ru}'
    - '[Моя́ мать была́ инжене́ром]{.ru}'
    - '[Моя́ мать бу́дет инжене́ром]{.ru}'
  - base: '[Он продаве́ц.]{.ru}'
    cells:
    - '[Он продаве́ц.]{.ru}'
    - '[Он был продавцо́м]{.ru}'
    - '[Он бу́дет продавцо́м]{.ru}'
  why: |
    第 1–10 题：现在时没有系动词，职业名词用第一格；过去时和将来时出现 [был, была́, бы́ли, бу́ду, бу́дет]{.ru} 等形式，职业名词改用第五格。
    第 1、4、6、10 题：阳性主语用 [был]{.ru}。第 4 题 [я]{.ru} 指男性。
    第 2、3、5、7、9 题：女性主语用 [была́]{.ru}；第 9 题 [инжене́р]{.ru} 指女性时形式不变，动词仍用阴性 [была́]{.ru}。
    第 8 题：[вы]{.ru} 即使指一位女士，过去时也用复数 [бы́ли]{.ru}，名词仍是单数 [перево́дчицей]{.ru}。
- id: L64-03
  tags:
  - стать：将来时与过去时
  task: 写出 [стать]{.ru} 的将来时和过去时。
  type: matrix
  cols:
  - 主语
  - 将来时
  - 过去时
  given:
  - 0
  rows:
  - base: '[я]{.ru}（[Ван Лэй]{.ru}）'
    cells:
    - '[я]{.ru}（[Ван Лэй]{.ru}）'
    - '[ста́ну]{.ru}'
    - '[стал]{.ru}'
  - base: '[я]{.ru}（[А́нна]{.ru}）'
    cells:
    - '[я]{.ru}（[А́нна]{.ru}）'
    - '[ста́ну]{.ru}'
    - '[ста́ла]{.ru}'
  - base: '[ты]{.ru}（[Ми́ша]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ми́ша]{.ru}）'
    - '[ста́нешь]{.ru}'
    - '[стал]{.ru}'
  - base: '[ты]{.ru}（[Ю́ми]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ю́ми]{.ru}）'
    - '[ста́нешь]{.ru}'
    - '[ста́ла]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[ста́нет]{.ru}'
    - '[стал]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[ста́нет]{.ru}'
    - '[ста́ла]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[ста́нем]{.ru}'
    - '[ста́ли]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[ста́нете]{.ru}'
    - '[ста́ли]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[ста́нут]{.ru}'
    - '[ста́ли]{.ru}'
  - base: '[Ка́тя и Ми́ша]{.ru}'
    cells:
    - '[Ка́тя и Ми́ша]{.ru}'
    - '[ста́нут]{.ru}'
    - '[ста́ли]{.ru}'
  why: |
    第 1–10 题：[стать]{.ru} 是完成体，变位 [ста́ну, ста́нешь … ста́нут]{.ru} 表示将来；过去时 [стал, ста́ла, ста́ли]{.ru}，重音都在词干。
    第 1–4 题：将来时只看人称，[я]{.ru} 都是 [ста́ну]{.ru}；过去时要看说话人的性别：男性 [стал]{.ru}，女性 [ста́ла]{.ru}。
    第 8 题：[вы]{.ru} 过去时用复数 [ста́ли]{.ru}。第 10 题：两个人用 [ста́нут, ста́ли]{.ru}。
- id: L64-04
  tags:
  - быть + 第五格：职业句的时态
  - работать / стать + 第五格
  task: 用括号里的名词填空：需要时变成第五格。
  type: fill
  items:
  - stem: Мой брат ___.
    hint: перево́дчик
    accept:
    - перево́дчик
  - stem: Мой брат был ___.
    hint: перево́дчик
    accept:
    - перево́дчиком
  - stem: Мари́я Никола́евна рабо́тает ___ в поликли́нике.
    hint: врач
    accept:
    - врачо́м
  - stem: Ми́ша хо́чет стать ___.
    hint: инжене́р
    accept:
    - инжене́ром
  - stem: О́льга Ви́кторовна — ___.
    hint: учи́тельница
    accept:
    - учи́тельница
  - stem: Ра́ньше она́ была́ ___.
    hint: перево́дчица
    accept:
    - перево́дчицей
  - stem: — Кем ты бу́дешь? — ___.
    hint: арти́ст
    accept:
    - Арти́стом
  - stem: Ива́н Серге́евич рабо́тает ___ на заво́де.
    hint: инжене́р
    accept:
    - инжене́ром
  - stem: Ка́тя ста́ла ___.
    hint: арти́стка
    accept:
    - арти́сткой
  - stem: Мой оте́ц ___.
    hint: дире́ктор
    accept:
    - дире́ктор
  - stem: Я хочу́ быть ___.
    hint: программи́ст
    accept:
    - программи́стом
  - stem: В де́тстве Ван Лэй хоте́л быть ___.
    hint: учи́тель
    accept:
    - учи́телем
  - stem: Мой друг бу́дет ___.
    hint: врач
    accept:
    - врачо́м
  - stem: Ба́бушка была́ ___.
    hint: учи́тельница
    accept:
    - учи́тельницей
  - stem: — Кем рабо́тает ваш брат? — ___.
    hint: продаве́ц
    accept:
    - Продавцо́м
  - stem: Пьер — ___.
    hint: студе́нт
    accept:
    - студе́нт
  why: |
    第 1、5、10、16 题：现在时没有系动词（可以用破折号），职业名词用第一格。
    第 2、6、13、14 题：[был, была́, бу́дет]{.ru} 后面用第五格：[перево́дчиком, перево́дчицей, врачо́м, учи́тельницей]{.ru}。
    第 3、8、15 题：[рабо́тать]{.ru} 表示“当……”，职业名词用第五格；第 15 题回答 [Кем?]{.ru}，同样用第五格 [Продавцо́м]{.ru}。
    第 4、9 题：[стать]{.ru} 后用第五格：[инжене́ром, арти́сткой]{.ru}。
    第 7 题：问句 [Кем ты бу́дешь?]{.ru} 用第五格，回答也用第五格。
    第 11、12 题：不定式 [быть]{.ru} 后用第五格：[программи́стом, учи́телем]{.ru}。
- id: L64-05
  tags:
  - работать / стать + 第五格
  - 名词单数第六格：工作地点
  task: 写出“在某处当……”：职业用第五格，地点用第六格。
  type: matrix
  cols:
  - 职业 + 地点
  - '[рабо́тать]{.ru} + 职业 + 地点'
  given:
  - 0
  rows:
  - base: '[врач + поликли́ника]{.ru}'
    cells:
    - '[врач + поликли́ника]{.ru}'
    - '[врачо́м в поликли́нике]{.ru}'
  - base: '[инжене́р + заво́д]{.ru}'
    cells:
    - '[инжене́р + заво́д]{.ru}'
    - '[инжене́ром на заво́де]{.ru}'
  - base: '[учи́тельница + шко́ла]{.ru}'
    cells:
    - '[учи́тельница + шко́ла]{.ru}'
    - '[учи́тельницей в шко́ле]{.ru}'
  - base: '[продавщи́ца + магази́н]{.ru}'
    cells:
    - '[продавщи́ца + магази́н]{.ru}'
    - '[продавщи́цей в магази́не]{.ru}'
  - base: '[арти́стка + теа́тр]{.ru}'
    cells:
    - '[арти́стка + теа́тр]{.ru}'
    - '[арти́сткой в теа́тре]{.ru}'
  - base: '[преподава́тель + университе́т]{.ru}'
    cells:
    - '[преподава́тель + университе́т]{.ru}'
    - '[преподава́телем в университе́те]{.ru}'
  - base: '[учи́тель + шко́ла]{.ru}'
    cells:
    - '[учи́тель + шко́ла]{.ru}'
    - '[учи́телем в шко́ле]{.ru}'
  - base: '[перево́дчица + фи́рма]{.ru}'
    cells:
    - '[перево́дчица + фи́рма]{.ru}'
    - '[перево́дчицей в фи́рме]{.ru}'
    new: true
    gloss: 公司
  - base: '[программи́ст + банк]{.ru}'
    cells:
    - '[программи́ст + банк]{.ru}'
    - '[программи́стом в ба́нке]{.ru}'
    new: true
    gloss: 银行
  - base: '[врач + больни́ца]{.ru}'
    cells:
    - '[врач + больни́ца]{.ru}'
    - '[врачо́м в больни́це]{.ru}'
    new: true
    gloss: 医院
  - base: '[дире́ктор + музе́й]{.ru}'
    cells:
    - '[дире́ктор + музе́й]{.ru}'
    - '[дире́ктором в музе́е]{.ru}'
  - base: '[продаве́ц + ры́нок]{.ru}'
    cells:
    - '[продаве́ц + ры́нок]{.ru}'
    - '[продавцо́м на ры́нке]{.ru}'
    hint: gen. [ры́нка]{.ru}
    new: true
    gloss: 市场
  why: |
    第 1–12 题：职业回答 [кем?]{.ru}，用第五格；地点回答 [где?]{.ru}，用 [в / на]{.ru} + 第六格，两个格不要混。
    第 2、12 题：[заво́д, ры́нок]{.ru} 用 [на]{.ru}：[на заво́де, на ры́нке]{.ru}；[ры́нок]{.ru} 脱落 [о]{.ru}。其余地点用 [в]{.ru}。
    第 3、4、8、10 题：[ц]{.ru} 后不重读写 [-ей]{.ru}：[учи́тельницей, продавщи́цей, перево́дчицей]{.ru}；第 10 题 [больни́ца]{.ru} 第六格 [в больни́це]{.ru}。
    第 6、7 题：[-тель]{.ru} 第五格 [-телем]{.ru}：[преподава́телем, учи́телем]{.ru}。
    第 12 题：[продаве́ц]{.ru} 脱落 [е]{.ru}，重音在词尾：[продавцо́м]{.ru}。
