heading: 第 31 课　人称代词第二格
groups:
- id: L31-01
  tags:
  - 人称代词第二格
  - 人称代词第二格：前置词后的 н-
  task: 写出人称代词的第二格和前置词 [у]{.ru} 后面的形式。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - '[у]{.ru} + 第二格'
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[меня́]{.ru}'
    - '[у меня́]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[тебя́]{.ru}'
    - '[у тебя́]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[его́]{.ru}'
    - '[у него́]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[её]{.ru}'
    - '[у неё]{.ru}'
  - base: '[оно́]{.ru}'
    cells:
    - '[оно́]{.ru}'
    - '[его́]{.ru}'
    - '[у него́]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[нас]{.ru}'
    - '[у нас]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[вас]{.ru}'
    - '[у вас]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[их]{.ru}'
    - '[у них]{.ru}'
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[кого́]{.ru}'
    - '[у кого́]{.ru}'
  why: '第 1、2、6、7 题：第二格和第四格同形：[меня́, тебя́, нас, вас]{.ru}，前置词后面不变。

    第 3–5、8 题：第三人称 [его́, её, их]{.ru} 在前置词后面加 [н-]{.ru}：[у него́, у неё, у них]{.ru}，不说 *[у его́]{.ru}。[оно́]{.ru} 和 [он]{.ru} 同形。

    第 9 题：问“谁有”用 [у кого́]{.ru}，[г]{.ru} 读 [[в]]{.tr}。'
- id: L31-02
  tags:
  - у кого́ есть：拥有者换成人称代词
  task: 把拥有者换成人称代词，用 [у кого́ есть]{.ru} 说“某人有……”。
  type: matrix
  cols:
  - 拥有者 + 所有物
  - 句子
  rows:
  - base: '[А́нна + брат]{.ru}'
    cells:
    - '[А́нна + брат]{.ru}'
    - '[У неё есть брат.]{.ru}'
  - base: '[Ми́ша + соба́ка]{.ru}'
    cells:
    - '[Ми́ша + соба́ка]{.ru}'
    - '[У него́ есть соба́ка.]{.ru}'
  - base: '[ма́ма и па́па + да́ча]{.ru}'
    cells:
    - '[ма́ма и па́па + да́ча]{.ru}'
    - '[У них есть да́ча.]{.ru}'
  - base: '[я + сестра́]{.ru}'
    cells:
    - '[я + сестра́]{.ru}'
    - '[У меня́ есть сестра́.]{.ru}'
  - base: '[ты + слова́рь]{.ru}'
    cells:
    - '[ты + слова́рь]{.ru}'
    - '[У тебя́ есть слова́рь.]{.ru}'
  - base: '[мы + кварти́ра]{.ru}'
    cells:
    - '[мы + кварти́ра]{.ru}'
    - '[У нас есть кварти́ра.]{.ru}'
  - base: '[вы + маши́на]{.ru}'
    cells:
    - '[вы + маши́на]{.ru}'
    - '[У вас есть маши́на.]{.ru}'
    new: true
    gloss: 汽车
  - base: '[ба́бушка + сад]{.ru}'
    cells:
    - '[ба́бушка + сад]{.ru}'
    - '[У неё есть сад.]{.ru}'
  - base: '[Ива́н Серге́евич + жена́]{.ru}'
    cells:
    - '[Ива́н Серге́евич + жена́]{.ru}'
    - '[У него́ есть жена́.]{.ru}'
  - base: '[студе́нты + уро́к]{.ru}'
    cells:
    - '[студе́нты + уро́к]{.ru}'
    - '[У них есть уро́к.]{.ru}'
  - base: '[Ю́ми + подру́га]{.ru}'
    cells:
    - '[Ю́ми + подру́га]{.ru}'
    - '[У неё есть подру́га.]{.ru}'
  - base: '[Пьер + ко́шка]{.ru}'
    cells:
    - '[Пьер + ко́шка]{.ru}'
    - '[У него́ есть ко́шка.]{.ru}'
  - base: '[Ка́тя и я + учи́тель]{.ru}'
    cells:
    - '[Ка́тя и я + учи́тель]{.ru}'
    - '[У нас есть учи́тель.]{.ru}'
  - base: '[ты и Ми́ша + компью́тер]{.ru}'
    cells:
    - '[ты и Ми́ша + компью́тер]{.ru}'
    - '[У вас есть компью́тер.]{.ru}'
  why: '第 1、8、11 题：拥有者是女性，换成 [она́]{.ru}，在 [у]{.ru} 后面是 [у неё]{.ru}。

    第 2、9、12 题：拥有者是男性，[у него́]{.ru}；第 3、10 题：复数，[у них]{.ru}。第三人称都要加 [н-]{.ru}。

    第 4–7、13、14 题：[у меня́, у тебя́, у нас, у вас]{.ru}；[Ка́тя и я]{.ru} 等于 [мы]{.ru}，[ты и Ми́ша]{.ru} 等于 [вы]{.ru}。

    第 1–14 题：所有物是句子的主语，用第一格；[есть]{.ru} 不随人称变化。'
- id: L31-03
  tags:
  - его́、её、их：物主代词与人称代词第二、四格辨别
  task: 判断句中 [его́, её, их]{.ru}（或 [него́, неё, них]{.ru}）的身份。
  type: classify
  bins:
  - 物主代词（他的、她的、他们的）
  - 人称代词第四格
  - 人称代词第二格
  items:
  - text: '[Э́то его́ соба́ка.]{.ru}'
    answer: 物主代词（他的、她的、他们的）
  - text: '[У него́ есть соба́ка.]{.ru}'
    answer: 人称代词第二格
  - text: '[Я его́ зна́ю.]{.ru}'
    answer: 人称代词第四格
  - text: '[Её зову́т А́нна.]{.ru}'
    answer: 人称代词第四格
  - text: '[Где её су́мка?]{.ru}'
    answer: 物主代词（他的、她的、他们的）
  - text: '[У неё есть брат.]{.ru}'
    answer: 人称代词第二格
  - text: '[Мы их ждём.]{.ru}'
    answer: 人称代词第四格
  - text: '[Их дом в це́нтре.]{.ru}'
    answer: 物主代词（他的、她的、他们的）
  - text: '[У них есть да́ча.]{.ru}'
    answer: 人称代词第二格
  - text: '[Ты её по́мнишь?]{.ru}'
    answer: 人称代词第四格
  - text: '[Его́ сестра́ — врач.]{.ru}'
    answer: 物主代词（他的、她的、他们的）
  - text: '[Его́ зову́т Ду́ду.]{.ru}'
    answer: 人称代词第四格
  - text: '[У него́ большо́й сад.]{.ru}'
    answer: 人称代词第二格
  - text: '[Я ви́жу их соба́ку.]{.ru}'
    answer: 物主代词（他的、她的、他们的）
  - text: '[Э́то её брат.]{.ru}'
    answer: 物主代词（他的、她的、他们的）
  why: '第 1、5、8、11、14、15 题：后面跟着名词，说明“谁的”，是物主代词，永远不变：[его́ соба́ка, их соба́ку]{.ru}。

    第 3、4、7、10、12 题：自己作动词宾语，是第四格：[Я его́ зна́ю]{.ru}。[Её зову́т…]{.ru} 字面是“人们叫她……”。

    第 2、6、9、13 题：用在前置词 [у]{.ru} 后面，带 [н-]{.ru}，是第二格：[у него́, у неё, у них]{.ru}。'
