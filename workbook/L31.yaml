  why: '第 1、10、13、15 题：[у него́, у неё]{.ru} 是 [он, она́]{.ru} 的第二格加 [н-]{.ru}。

    第 3–5、7、8 题：[у вас, у них, у меня́, у тебя́, у нас]{.ru} 对应 [вы, они́, я, ты, мы]{.ru}。

    第 2、6、9、11、12、14、16 题：物主代词也能看出拥有者：[её → она́, на́ша → мы, твой → ты, их → они́, его́ → он, ва́ша → вы, мой → я]{.ru}。'
