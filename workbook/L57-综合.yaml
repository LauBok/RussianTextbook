  why: |
    第 2、4、7、10、12、14、17、19 题：阳性和中性名词硬的变 [-у]{.ru}、软的变 [-ю]{.ru}；修饰语 [-ому / -ему]{.ru}。第 10 题 [оте́ц → отцу́]{.ru}，[е]{.ru} 脱落。
    第 1、5、11、21 题：阴性名词 [-е]{.ru}，[-ия]{.ru} 变 [-ии]{.ru}；修饰语 [-ой / -ей]{.ru}。第 9、15 题 [дочь, мать → до́чери, ма́тери]{.ru}。
    第 6、20、22 题：以 [-а / -я]{.ru} 结尾的阳性名词按阴性变 [-е]{.ru}，修饰语却用阳性：[её ста́рому де́душке]{.ru}；[её]{.ru} 本身不变。
    第 3、8、13、16、18 题：代词第三格 [ему́, нам, ей, им, кому́]{.ru}。
