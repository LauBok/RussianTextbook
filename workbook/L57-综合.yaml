  given: [0]
  rows:
  - {base: '[мой + ста́рший + брат]{.ru}', cells: ['[мой + ста́рший + брат]{.ru}', '[к моему́ ста́ршему бра́ту]{.ru}']}
  - {base: '[на́ша + но́вая + сосе́дка]{.ru}', cells: ['[на́ша + но́вая + сосе́дка]{.ru}', '[к на́шей но́вой сосе́дке]{.ru}']}
  - {base: '[э́тот + молодо́й + врач]{.ru}', cells: ['[э́тот + молодо́й + врач]{.ru}', '[к э́тому молодо́му врачу́]{.ru}']}
  - {base: '[твоя́ + ста́рая + ба́бушка]{.ru}', cells: ['[твоя́ + ста́рая + ба́бушка]{.ru}', '[к твое́й ста́рой ба́бушке]{.ru}']}
  - {base: '[его́ + хоро́ший + друг]{.ru}', cells: ['[его́ + хоро́ший + друг]{.ru}', '[к его́ хоро́шему дру́гу]{.ru}']}
  - {base: '[ваш + ру́сский + преподава́тель]{.ru}', cells: ['[ваш + ру́сский + преподава́тель]{.ru}', '[к ва́шему ру́сскому преподава́телю]{.ru}']}
  - {base: '[та + ма́ленькая + де́вочка]{.ru}', cells: ['[та + ма́ленькая + де́вочка]{.ru}', '[к той ма́ленькой де́вочке]{.ru}']}
  - {base: '[наш + ста́рый + де́душка]{.ru}', cells: ['[наш + ста́рый + де́душка]{.ru}', '[к на́шему ста́рому де́душке]{.ru}']}
  - {base: '[моя́ + ста́ршая + дочь]{.ru}', cells: ['[моя́ + ста́ршая + дочь]{.ru}', '[к мое́й ста́ршей до́чери]{.ru}']}
  - {base: '[её + мла́дший + брат]{.ru}', cells: ['[её + мла́дший + брат]{.ru}', '[к её мла́дшему бра́ту]{.ru}']}
  - {base: '[э́тот + большо́й + кабине́т]{.ru}', cells: ['[э́тот + большо́й + кабине́т]{.ru}', '[к э́тому большо́му кабине́ту]{.ru}']}
  - {base: '[их + но́вый + учи́тель]{.ru}', cells: ['[их + но́вый + учи́тель]{.ru}', '[к их но́вому учи́телю]{.ru}']}
  why: |
    第 1–12 题：[к]{.ru} 后面整个词组都用第三格，三个词一起变：阳性 [-ему / -ому, -ому / -ему, -у / -ю]{.ru}，阴性 [-ей / -ой, -ой / -ей, -е / -и]{.ru}。
    第 5、10、12 题：[его́, её, их]{.ru} 在前置词后面作物主代词时不变，也不加 [н-]{.ru}：[к его́ хоро́шему дру́гу]{.ru}。只有作人称代词时才说 [к нему́, к ней, к ним]{.ru}。
    第 8 题：[де́душка]{.ru} 阳性，修饰语 [на́шему ста́рому]{.ru}，名词 [де́душке]{.ru}。第 9 题：[до́чери]{.ru}。
- id: L57-综合-c
  lessons: [L52, L56]
  tags: [综合：喜欢的人用第三格]
  recycles: [L52-02, L52-04, L56-03]
  task: 用括号里的词组填空。
  type: fill
  items:
  - {stem: '___ нра́вятся блины́.', hint: мой мла́дший брат, accept: [моему́ мла́дшему бра́ту]}
  - {stem: '___ понра́вился Кремль.', hint: на́ша ба́бушка, accept: [на́шей ба́бушке]}
  - {stem: '___ нра́вится ру́сская ку́хня?', hint: ваш друг, accept: [ва́шему дру́гу]}
  - {stem: '___ не нра́вится дождь.', hint: э́та де́вочка, accept: [э́той де́вочке]}
  - {stem: '___ нра́вится чита́ть.', hint: их сын, accept: [их сы́ну]}
  - {stem: '___ нра́вятся моско́вские па́рки.', hint: твоя́ ста́ршая сестра́, accept: [твое́й ста́ршей сестре́]}
  - {stem: '___ нра́вится э́та пе́сня?', hint: кто, accept: [кому́]}
  - {stem: '___ понра́вилась Москва́.', hint: наш но́вый преподава́тель, accept: [на́шему но́вому преподава́телю]}
  - {stem: '___ нра́вится футбо́л.', hint: её мла́дший брат, accept: [её мла́дшему бра́ту]}
  - {stem: '___ нра́вится о́сень.', hint: моя́ мать, accept: [мое́й ма́тери]}
  - {stem: '___ нра́вились ру́сские пе́сни.', hint: тот молодо́й инжене́р, accept: [тому́ молодо́му инжене́ру]}
  - {stem: '___ нра́вится рабо́тать в саду́.', hint: наш де́душка, accept: [на́шему де́душке]}
  - stem: ___ нра́вится э́тот рома́н.
    hint: моя́ ста́ршая сестра́
    accept:
    - мое́й ста́ршей сестре́
  - stem: ___ понра́вились блины́.
    hint: наш но́вый сосе́д
    accept:
    - на́шему но́вому сосе́ду
  - stem: ___ нра́вится му́зыка.
    hint: э́тот ма́льчик
    accept:
    - э́тому ма́льчику
  why: |-
    第 1–15 题：[нра́виться]{.ru} 句里喜欢的人整个词组用第三格；动词形式由被喜欢的东西决定，和喜欢的人无关：第 1 题 [нра́вятся блины́]{.ru}，第 2 题 [понра́вился Кремль]{.ru}。
    第 1、3、5、8、9、11、12、14、15 题：阳性词组：[моему́ мла́дшему бра́ту, ва́шему дру́гу, на́шему но́вому преподава́телю, тому́ молодо́му инжене́ру, на́шему но́вому сосе́ду, э́тому ма́льчику]{.ru}；第 5、9 题 [их, её]{.ru} 不变；第 12 题 [де́душка]{.ru} 名词变 [-е]{.ru}，修饰语用阳性。
    第 2、4、6、10、13 题：阴性词组：[на́шей ба́бушке, э́той де́вочке, твое́й ста́ршей сестре́, мое́й ма́тери]{.ru}。
    第 7 题：[кто → кому́]{.ru}。
- id: L57-综合-d
  lessons: [L51, L52, L56, L57]
  tags: [综合：第三格与前置词核查]
  recycles: [L51-04, L52-03, L57-01, L57-03]
  task: 每个说法都有一处错误，写出正确的说法。
  type: matrix
  cols: [有错误的说法, 正确的说法]
  given: [0]
  rows:
  - {base: '[идти́ к я]{.ru}', cells: ['[идти́ к я]{.ru}', '[идти́ ко мне]{.ru}']}
  - {base: '[звони́ть ма́му]{.ru}', cells: ['[звони́ть ма́му]{.ru}', '[звони́ть ма́ме]{.ru}']}
  - {base: '[говори́ть по телефо́н]{.ru}', cells: ['[говори́ть по телефо́н]{.ru}', '[говори́ть по телефо́ну]{.ru}']}
  - {base: '[к его́ бра́та]{.ru}', cells: ['[к его́ бра́та]{.ru}', '[к его́ бра́ту]{.ru}']}
  - {base: '[моему́ ста́ршего бра́ту]{.ru}', cells: ['[моему́ ста́ршего бра́ту]{.ru}', '[моему́ ста́ршему бра́ту]{.ru}']}
  - {base: '[идти́ к ему́]{.ru}', cells: ['[идти́ к ему́]{.ru}', '[идти́ к нему́]{.ru}']}
  - {base: '[Мне нра́вится блины́.]{.ru}', cells: ['[Мне нра́вится блины́.]{.ru}', '[Мне нра́вятся блины́.]{.ru}']}
  - {base: '[Я нра́вится Москва́.]{.ru}', cells: ['[Я нра́вится Москва́.]{.ru}', '[Мне нра́вится Москва́.]{.ru}']}
  - {base: '[идти́ в врача́]{.ru}', cells: ['[идти́ в врача́]{.ru}', '[идти́ к врачу́]{.ru}']}
  - {base: '[зада́ние по ру́сский язы́к]{.ru}', cells: ['[зада́ние по ру́сский язы́к]{.ru}', '[зада́ние по ру́сскому языку́]{.ru}']}
  - {base: '[писа́ть Мари́е]{.ru}', cells: ['[писа́ть Мари́е]{.ru}', '[писа́ть Мари́и]{.ru}']}
  - {base: '[идти́ к оте́цу]{.ru}', cells: ['[идти́ к оте́цу]{.ru}', '[идти́ к отцу́]{.ru}']}
  - {base: '[спра́шивать ба́бушке]{.ru}', cells: ['[спра́шивать ба́бушке]{.ru}', '[спра́шивать ба́бушку]{.ru}']}
  - {base: '[дари́ть на́шему Ми́шу]{.ru}', cells: ['[дари́ть на́шему Ми́шу]{.ru}', '[дари́ть на́шему Ми́ше]{.ru}']}
  - {base: '[к та ста́рой ба́бушке]{.ru}', cells: ['[к та ста́рой ба́бушке]{.ru}', '[к той ста́рой ба́бушке]{.ru}']}
  - {base: '[Ми́ше нра́вились футбо́л.]{.ru}', cells: ['[Ми́ше нра́вились футбо́л.]{.ru}', '[Ми́ше нра́вился футбо́л.]{.ru}']}
  - {base: '[к мое́й мла́дшему бра́ту]{.ru}', cells: ['[к мое́й мла́дшему бра́ту]{.ru}', '[к моему́ мла́дшему бра́ту]{.ru}']}
  - {base: '[к на́шей мать]{.ru}', cells: ['[к на́шей мать]{.ru}', '[к на́шей ма́тери]{.ru}']}
  - {base: '[гуля́ть по парк]{.ru}', cells: ['[гуля́ть по парк]{.ru}', '[гуля́ть по па́рку]{.ru}']}
  - {base: '[Ей нра́вится ру́сские пе́сни.]{.ru}', cells: ['[Ей нра́вится ру́сские пе́сни.]{.ru}', '[Ей нра́вятся ру́сские пе́сни.]{.ru}']}
  - {base: '[писа́ть сообще́ние учи́телу]{.ru}', cells: ['[писа́ть сообще́ние учи́телу]{.ru}', '[писа́ть сообще́ние учи́телю]{.ru}']}
  - {base: '[к их хоро́шей дру́гу]{.ru}', cells: ['[к их хоро́шей дру́гу]{.ru}', '[к их хоро́шему дру́гу]{.ru}']}
  why: |
    第 1、6 题：[к мне]{.ru} 要说 [ко мне]{.ru}；第三人称代词在前置词后加 [н-]{.ru}：[к нему́]{.ru}。
    第 2、13 题：[звони́ть]{.ru} 接第三格 [ма́ме]{.ru}；[спра́шивать]{.ru} 接第四格 [ба́бушку]{.ru}。两个动词汉语都说“给／问某人”，俄语的格不同。
    第 3、10 题：[по]{.ru} 后面用第三格：[по телефо́ну, по ру́сскому языку́]{.ru}。
    第 4、5 题：[к]{.ru} 后面整个词组用第三格：[к его́ бра́ту]{.ru}；形容词第三格是 [-ему]{.ru}，[-его]{.ru} 是第二格的词尾。
    第 7、8 题：[нра́виться]{.ru} 跟被喜欢的东西一致：复数 [нра́вятся блины́]{.ru}；喜欢的人用第三格 [мне]{.ru}。
    第 9 题：去找人用 [к]{.ru} + 第三格，不用 [в]{.ru}。
    第 11 题：[-ия]{.ru} 结尾的名词第三格是 [-ии]{.ru}。第 12 题：[оте́ц]{.ru} 变格时 [е]{.ru} 脱落：[отцу́]{.ru}。
    第 14 题：[Ми́ша]{.ru} 按阴性变第三格 [-е]{.ru}：[Ми́ше]{.ru}。
    第 15、17、22 题：修饰语和名词的性一致：[к той ста́рой ба́бушке, к моему́ мла́дшему бра́ту, к их хоро́шему дру́гу]{.ru}。
    第 16、20 题：[нра́виться]{.ru} 跟主语变：单数阳性 [нра́вился футбо́л]{.ru}，复数 [нра́вятся пе́сни]{.ru}。
    第 18 题：[мать → ма́тери]{.ru}。第 19 题：[по па́рку]{.ru}。第 21 题：[учи́тель]{.ru} 是软辅音结尾，第三格用 [-ю]{.ru}：[учи́телю]{.ru}。
