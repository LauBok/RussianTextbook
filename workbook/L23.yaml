    hint: како́й
    accept:
    - Како́е
  - stem: ___ му́зыку вы слу́шаете?
    hint: како́й
    accept:
    - Каку́ю
  - stem: ___ фильм они́ смо́трят?
    hint: како́й
    accept:
    - Како́й
  - stem: ___ преподава́теля вы зна́ете?
    hint: како́й
    accept:
    - Како́го
  - stem: ___ ска́зку чита́ет ба́бушка?
    hint: како́й
    accept:
    - Каку́ю
  - stem: ___ слова́рь ты и́щешь?
    hint: чей
    accept:
    - Чей
  - stem: ___ су́мку ты и́щешь?
    hint: чей
    accept:
    - Чью
  - stem: ___ бра́та вы ждёте?
    hint: чей
    accept:
    - Чьего́
  - stem: ___ фо́то ты смо́тришь?
    hint: чей
    accept:
    - Чьё
  - stem: ___ па́пу ты ви́дишь?
    hint: чей
    accept:
    - Чьего́
  - stem: ___ откры́тку ты покупа́ешь?
    hint: како́й
    accept:
    - Каку́ю
  why: '第 1、5、8、14 题：阴性第四格 [каку́ю]{.ru}，和 [кни́гу, му́зыку]{.ru} 配合。

    第 2、6 题：阳性非动物，同第一格 [како́й]{.ru}；第 3、7 题：阳性动物 [како́го]{.ru}。

    第 4 题：中性同第一格 [како́е]{.ru}。

    第 9–13 题：[чей]{.ru} 的第四格：阳性非动物 [чей]{.ru}、阴性 [чью]{.ru}、阳性动物 [чьего́]{.ru}、中性 [чьё]{.ru}。第 13 题 [па́пу]{.ru} 是阳性动物名词，用 [чьего́]{.ru}，不用 [чью]{.ru}。'
