    - '[того́ ста́рого инжене́ра]{.ru}'
  why: '第 1、3、5、8、10、12、13、16 题：阳性动物名词第四格 [-а / -я]{.ru}，修饰语用 [-ого / -его]{.ru}：[моего́ ста́рого дру́га]{.ru}。第 8 题 [продаве́ц]{.ru} 变格时 [е]{.ru} 脱落。

    第 6 题：阳性非动物，修饰语和名词都同第一格：[мой слова́рь]{.ru}。

    第 2、4、7、11、14 题：阴性修饰语 [-ую, на́шу, э́ту, твою́]{.ru}，名词 [-у]{.ru}。

    第 15 题：中性同第一格。

    第 9 题：[па́па]{.ru} 是阳性动物名词，修饰语用阳性 [твоего́]{.ru}，名词按词尾变 [па́пу]{.ru}。不要写成 *[твою́ па́пу]{.ru}。'
