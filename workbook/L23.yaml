  - base: '[по́мнить ста́рого дру́га]{.ru}'
    cells:
    - '[по́мнить ста́рого дру́га]{.ru}'
    - '[по́мнить ста́рого дру́га]{.ru}'
  - base: '[знать ва́шу ба́бушку]{.ru}'
    cells:
    - '[знать ва́шу ба́бушку]{.ru}'
    - '[знать ва́шу ба́бушку]{.ru}'
  - base: '[знать э́тот преподава́тель]{.ru}'
    cells:
    - '[знать э́тот преподава́тель]{.ru}'
    - '[знать э́того преподава́теля]{.ru}'
  why: '第 1、5、8、12、15 题：宾语是阳性动物名词，修饰语和名词都要变：[ждать но́вого студе́нта, ви́деть э́того актёра]{.ru}。第 8 题 [па́па]{.ru} 名词变 [па́пу]{.ru}，修饰语按阳性变 [твоего́]{.ru}；第 12 题错在修饰语用了阴性。

    第 4、10、11 题：[рома́н, фильм, го́род]{.ru} 是非动物名词，第四格同第一格，不能类推成 [-ого / -а]{.ru}。

    第 3、6 题：阴性宾语漏变：[на́шу студе́нтку, ру́сскую му́зыку]{.ru}。

    第 9 题：[си́ний]{.ru} 是软变化，阴性 [си́нюю]{.ru}。

    第 2、7、13、14 题：原本就对：[чита́ть но́вый журна́л]{.ru} 是非动物，[по́мнить ста́рого дру́га]{.ru} 是动物，[знать ва́шу ба́бушку]{.ru} 是阴性。'
- id: L23-05
  tags:
  - 疑问代词单数第四格：како́й、чей
  task: 用括号里代词的适当形式提问。
  type: fill
  items:
  - stem: ___ кни́гу ты чита́ешь?
    hint: како́й
    accept:
    - Каку́ю
  - stem: ___ журна́л ты покупа́ешь?
    hint: како́й
