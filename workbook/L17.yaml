- id: L17-02
  tags:
  - 动词过去时：第二变位、变干动词与短动词
  task: 第二变位、现在时词干有变化的动词和短动词：从不定式写出过去时（阴性重音在词尾的已提示）。
  type: matrix
  cols: *id001
  given:
  - 0
  rows:
  - base: '[говори́ть]{.ru}'
    cells:
    - '[говори́ть]{.ru}'
    - '[говори́л]{.ru}'
    - '[говори́ла]{.ru}'
    - '[говори́ло]{.ru}'
    - '[говори́ли]{.ru}'
  - base: '[писа́ть]{.ru}'
    cells:
    - '[писа́ть]{.ru}'
    - '[писа́л]{.ru}'
    - '[писа́ла]{.ru}'
    - '[писа́ло]{.ru}'
    - '[писа́ли]{.ru}'
  - base: '[жить]{.ru}'
    cells:
    - '[жить]{.ru}'
    - '[жил]{.ru}'
    - '[жила́]{.ru}'
    - '[жи́ло]{.ru}'
    - '[жи́ли]{.ru}'
  - base: '[смотре́ть]{.ru}'
    cells:
    - '[смотре́ть]{.ru}'
    - '[смотре́л]{.ru}'
    - '[смотре́ла]{.ru}'
    - '[смотре́ло]{.ru}'
    - '[смотре́ли]{.ru}'
  - base: '[гото́вить]{.ru}'
    cells:
    - '[гото́вить]{.ru}'
    - '[гото́вил]{.ru}'
    - '[гото́вила]{.ru}'
    - '[гото́вило]{.ru}'
    - '[гото́вили]{.ru}'
  - base: '[спать]{.ru}'
    cells:
    - '[спать]{.ru}'
    - '[спал]{.ru}'
    - '[спала́]{.ru}'
    - '[спа́ло]{.ru}'
    - '[спа́ли]{.ru}'
    hint: 阴性 [спала́]{.ru}
  - base: '[ви́деть]{.ru}'
    cells:
    - '[ви́деть]{.ru}'
    - '[ви́дел]{.ru}'
    - '[ви́дела]{.ru}'
    - '[ви́дело]{.ru}'
    - '[ви́дели]{.ru}'
  - base: '[ждать]{.ru}'
    cells:
    - '[ждать]{.ru}'
    - '[ждал]{.ru}'
    - '[ждала́]{.ru}'
    - '[жда́ло]{.ru}'
    - '[жда́ли]{.ru}'
    hint: 阴性 [ждала́]{.ru}
    new: true
    gloss: 等
  - base: '[лежа́ть]{.ru}'
    cells:
    - '[лежа́ть]{.ru}'
    - '[лежа́л]{.ru}'
    - '[лежа́ла]{.ru}'
    - '[лежа́ло]{.ru}'
    - '[лежа́ли]{.ru}'
  - base: '[звать]{.ru}'
    cells:
    - '[звать]{.ru}'
    - '[звал]{.ru}'
    - '[звала́]{.ru}'
    - '[зва́ло]{.ru}'
    - '[зва́ли]{.ru}'
    hint: 阴性 [звала́]{.ru}
  why: |-
    第 1、4、5、7、9 题：第二变位也从不定式构成：[говори́л, смотре́л, гото́вил, ви́дел, лежа́л]{.ru}。现在时的 [гото́влю, ви́жу]{.ru} 不带进过去时。
    第 2 题：[писа́ть]{.ru} 现在时是 [пишу́]{.ru}，过去时却没有 [ш]{.ru}：[писа́л, писа́ла]{.ru}。
    第 3、6、8、10 题：短动词阳性、中性、复数重音在词干，阴性重音移到词尾：[жил, жила́, жи́ло, жи́ли]{.ru}；[спал, спала́]{.ru}；[ждал, ждала́]{.ru}；[звал, звала́]{.ru}。现在时的 [живу́, зову́]{.ru} 也不带进过去时。
- id: L17-03
  tags:
  - 名词单数第六格：处所词尾 -у́
  task: 下面的阳性名词表示处所时第六格用重读的 [-у́]{.ru}：写出处所词组（前置词已印出）。
  type: matrix
  cols:
  - 第一格
  - 处所
  given:
  - 0
  rows:
  - base: '[сад]{.ru}'
    cells:
    - '[сад]{.ru}'
    - '[в саду́]{.ru}'
  - base: '[шкаф]{.ru}'
    cells:
    - '[шкаф]{.ru}'
    - '[в шкафу́]{.ru}'
  - base: '[лес]{.ru}'
    cells:
    - '[лес]{.ru}'
    - '[в лесу́]{.ru}'
    hint: m
    new: true
    gloss: 森林
  - base: '[пол]{.ru}'
    cells:
    - '[пол]{.ru}'
    - '[на полу́]{.ru}'
    hint: m
    new: true
    gloss: 地板
  - base: '[бе́рег]{.ru}'
    cells:
    - '[бе́рег]{.ru}'
    - '[на берегу́]{.ru}'
    hint: m
    new: true
    gloss: 岸
  - base: '[мост]{.ru}'
    cells:
    - '[мост]{.ru}'
    - '[на мосту́]{.ru}'
    hint: m
    new: true
    gloss: 桥
  - base: '[Крым]{.ru}'
    cells:
    - '[Крым]{.ru}'
    - '[в Крыму́]{.ru}'
    hint: m
    new: true
    gloss: 克里米亚
  - base: '[аэропо́рт]{.ru}'
    cells:
    - '[аэропо́рт]{.ru}'
    - '[в аэропорту́]{.ru}'
    hint: m
    new: true
    gloss: 机场
  why: |-
    第 1–4、6、7 题：词尾 [-у́]{.ru} 总是重读：[в саду́, в шкафу́, в лесу́, на полу́, на мосту́, в Крыму́]{.ru}，不写 [-е]{.ru}。
    第 5、8 题：多音节词重音也移到 [-у́]{.ru} 上：[на берегу́, в аэропорту́]{.ru}。
    这类名词只在 [в]{.ru}、[на]{.ru} 后表示处所时用 [-у́]{.ru}；和 [о]{.ru} 连用仍是 [-е]{.ru}：[о са́де]{.ru}。
- id: L17-04
  tags:
  - 动词过去时：句中填空
  task: 句中有表示过去的词，写出括号里动词的过去时。
  type: fill
  items:
  - stem: Вчера́ А́нна ___ рома́н.
    hint: чита́ть
    accept:
    - чита́ла
  - stem: Ра́ньше Ива́н Серге́евич ___ на заво́де.
    hint: рабо́тать
    accept:
    - рабо́тал
  - stem: Вчера́ мы ___ фильм.
    hint: смотре́ть
    accept:
    - смотре́ли
  - stem: Ра́ньше ба́бушка ___ в Москве́.
    hint: жить
    accept:
    - жила́
  - stem: Вчера́ студе́нты ___ упражне́ние.
    hint: писа́ть
    accept:
    - писа́ли
  - stem: Ю́ми, что ты ___ вчера́?
    hint: де́лать
    accept:
    - де́лала
  - stem: Ми́ша, ты ___ уро́ки?
    hint: де́лать
    accept:
    - де́лал
  - stem: В воскресе́нье па́па ___ обе́д.
    hint: гото́вить
    accept:
    - гото́вил
  - stem: Вчера́ Му́рка ___ в саду́.
    hint: спать
    accept:
    - спала́
  - stem: Вчера́ роди́тели ___ в па́рке.
    hint: гуля́ть
    accept:
    - гуля́ли
  - stem: Ра́ньше Пьер ___ по-ру́сски ме́дленно.
    hint: говори́ть
    accept:
    - говори́л
  - stem: Вчера́ ключи́ ___ на столе́.
    hint: лежа́ть
    accept:
    - лежа́ли
  - stem: О́льга Ви́кторовна, вы ___ о Москве́?
    hint: расска́зывать
    accept:
    - расска́зывали
  - stem: Ра́ньше мы ___ в Пеки́не.
    hint: жить
    accept:
    - жи́ли
  - stem: Вчера́ Ван Лэй ___ футбо́л.
    hint: смотре́ть
    accept:
    - смотре́л
  - stem: Ра́ньше фо́то ___ на столе́.
    hint: лежа́ть
    accept:
    - лежа́ло
  why: |-
    第 2、8、11、15 题：阳性单数主语用 [-л]{.ru}：[рабо́тал, гото́вил, говори́л, смотре́л]{.ru}。
    第 1 题：阴性单数用 [-ла]{.ru}：[чита́ла]{.ru}。
    第 4、9 题：[жить, спать]{.ru} 阴性重音在词尾：[жила́, спала́]{.ru}；[Му́рка]{.ru} 是阴性。
    第 16 题：[фо́то]{.ru} 是中性，用 [-ло]{.ru}：[лежа́ло]{.ru}。
    第 3、5、10、12、14 题：复数主语用 [-ли]{.ru}：[смотре́ли, писа́ли, гуля́ли, лежа́ли, жи́ли]{.ru}。
    第 6、7 题：[ты]{.ru} 看对方的性别：问由美 [де́лала]{.ru}，问米沙 [де́лал]{.ru}。
    第 13 题：[вы]{.ru} 尊称一个人也用复数：[расска́зывали]{.ru}。
