  why: '第 1、3、4 题：第一变位规则动词：[поздравля́ю, поздравля́ешь…поздравля́ют]{.ru}；[пожела́ть]{.ru} 是 [жела́ть]{.ru} 的完成体，变法相同，表示将来。

    第 2、5、6 题：第二变位，词干末尾是 [в]{.ru}，只有第一人称单数加 [л]{.ru}：[поздра́влю, гото́влю, отпра́влю]{.ru}，其余人称没有 [л]{.ru}：[поздра́вишь, поздра́вят]{.ru}。第三人称复数是 [-ят]{.ru}，不是 [-ют]{.ru}。'
