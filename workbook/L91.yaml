    第 4、5、13 题：阴性 [-а]{.ru} 变 [-и / -ы]{.ru}，[ч]{.ru} 后写 [и]{.ru}：[уда́чи]{.ru}；形容词 [-ой / -ей]{.ru}：[хоро́шей пого́ды, интере́сной рабо́ты]{.ru}。第 3、7、10、14 题：[-ь]{.ru} 结尾的阴性名词变 [-и]{.ru}：[ра́дости, но́чи]{.ru}，[любо́вь]{.ru} 第二格去掉 [о]{.ru}：[любви́]{.ru}。

    第 15 题：中性 [у́тро]{.ru} 第二格重音移到词尾：[до́брого утра́]{.ru}；第 16 题 [весёлого пра́здника]{.ru}，第 17 题 [хоро́шей доро́ги]{.ru}（[г]{.ru} 后写 [и]{.ru}）。

    第 9、11、12 题：阳性 [-а]{.ru}，形容词 [-ого]{.ru}：[хоро́шего о́тдыха, прия́тного аппети́та]{.ru}；[путь]{.ru} 第二格特殊：[счастли́вого пути́]{.ru}。这些说法也常单独使用：[Споко́йной но́чи! Прия́тного аппети́та! Счастли́вого пути́!]{.ru}'
- id: L91-05
  tags:
  - поздравля́ть кого́ с чем / жела́ть кому́ чего́：双补语
  task: 用括号里词的正确形式填空。
  type: fill
  items:
  - stem: Я поздравля́ю ___ с днём рожде́ния.
    hint: ты
    accept:
    - тебя́
  - stem: Жела́ю ___ сча́стья!
    hint: вы
    accept:
    - вам
  - stem: Ми́ша поздравля́ет ма́му с ___.
    hint: пра́здник
    accept:
    - пра́здником
  - stem: Ван Лэй жела́ет ма́ме ___.
    hint: здоро́вье
    accept:
    - здоро́вья
  - stem: Мы поздра́вили ___ с Но́вым го́дом.
    hint: О́льга Ви́кторовна
    accept:
    - О́льгу Ви́кторовну
  - stem: Ба́бушка жела́ет ___ сча́стья.
    hint: вну́чка
    accept:
    - вну́чке
  - stem: Поздравля́ем вас с ___!
    hint: Но́вый год
    accept:
    - Но́вым го́дом
  - stem: Жела́ю тебе́ ___ и сча́стья!
    hint: любо́вь
    accept:
    - любви́
  - stem: А́нна поздра́вила ___ с пятёркой.
    hint: Ю́ми
    accept:
    - Ю́ми
  - stem: Па́па жела́ет ___ здоро́вья.
    hint: ба́бушка
    accept:
    - ба́бушке
  - stem: За́втра я поздра́влю ___.
    hint: он
    accept:
    - его́
  - stem: Мы жела́ем ___ сча́стья.
    hint: они́
    accept:
    - им
  - stem: Ми́ша поздравля́ет ___ с днём рожде́ния.
    hint: па́па
    accept:
    - па́пу
  - stem: Ван Лэй жела́ет ___ здоро́вья.
    hint: Ива́н Серге́евич
    accept:
    - Ива́ну Серге́евичу
  - stem: Поздравля́ю тебя́ с ___ рабо́той!
    hint: но́вая
    accept:
    - но́вой
  - stem: Жела́ю вам ___ сча́стья!
    hint: большо́й
    accept:
    - большо́го
  why: '第 1、5、11、13 题：[поздравля́ть / поздра́вить]{.ru} 的对象用第四格：[тебя́, О́льгу Ви́кторовну, его́, па́пу]{.ru}。第 9 题 [Ю́ми]{.ru} 不变格。

    第 3、7、15 题：祝贺的事由用 [с]{.ru} + 第五格：[с пра́здником, с Но́вым го́дом, с но́вой рабо́той]{.ru}。

    第 2、6、10、12、14 题：[жела́ть]{.ru} 的对象用第三格：[вам, вну́чке, ба́бушке, им, Ива́ну Серге́евичу]{.ru}。

    第 4、8、16 题：祝愿的内容用第二格：[здоро́вья, любви́, большо́го сча́стья]{.ru}。'
