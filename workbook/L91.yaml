    第 1、2、4、5、7 题：[-а]{.ru} 结尾的名词（包括阳性 [па́па]{.ru}）第四格 [-у]{.ru}，第三格 [-е]{.ru}：[ма́му — ма́ме, па́пу — па́пе]{.ru}。名和父称都变：[О́льгу Ви́кторовну — О́льге Ви́кторовне]{.ru}。

    第 3、6、8、9 题：阳性动物名词第四格同第二格 [-а / -я]{.ru}，第三格 [-у / -ю]{.ru}：[бра́та — бра́ту, учи́теля — учи́телю, Ива́на Серге́евича — Ива́ну Серге́евичу]{.ru}。

    第 10–14 题：人称代词：[тебя́ — тебе́, вас — вам, его́ — ему́, её — ей, их — им]{.ru}。'
