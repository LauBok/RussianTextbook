  why: '第 1、3、10 题：阳性名词第五格 [-ом]{.ru}，形容词 [-ым]{.ru}：[с Но́вым го́дом, с пра́здником, с прие́здом]{.ru}。第 2、13 题：[день]{.ru} 变格时 [е]{.ru} 脱落：[с днём]{.ru}，后面的第二格 [рожде́ния, учи́теля]{.ru} 不变。

    第 4、7、12、15 题：中性 [-о]{.ru} 变 [-ом]{.ru}，[-ие, -ье]{.ru} 变 [-ием, -ьем]{.ru}：[с Рождество́м, с оконча́нием, с новосе́льем, с рожде́нием]{.ru}；后面的第二格不变。第 6 题：只变序数词 [Восьмо́е → Восьмы́м]{.ru}，[ма́рта]{.ru} 是第二格不变。

