heading: 第 31 课　不定式与体
groups:
- id: B2-L31-01
  tags:
  - 不定式的体：主导词
  task: 下列词后面接什么体的不定式？归栏。
  type: classify
  bins:
  - 只接未完成体
  - 一般接完成体
  - 按意义选体
  items:
  - text: '[начина́ть]{.ru}'
    answer: 只接未完成体
  - text: '[нача́ть]{.ru}'
    answer: 只接未完成体
  - text: '[стать]{.ru}'
    answer: 只接未完成体
  - text: '[продолжа́ть]{.ru}'
    answer: 只接未完成体
  - text: '[зако́нчить]{.ru}'
    answer: 只接未完成体
  - text: '[переста́ть]{.ru}'
    answer: 只接未完成体
  - text: '[уста́ть]{.ru}'
    answer: 只接未完成体
  - text: '[привы́кнуть]{.ru}'
    answer: 只接未完成体
  - text: '[научи́ться]{.ru}'
    answer: 只接未完成体
  - text: '[люби́ть]{.ru}'
    answer: 只接未完成体
  - text: '[нра́виться]{.ru}'
    answer: 只接未完成体
  - text: '[успе́ть]{.ru}'
    answer: 一般接完成体
  - text: '[забы́ть]{.ru}'
    answer: 一般接完成体
    hint: 一次具体的事
  - text: '[хоте́ть]{.ru}'
    answer: 按意义选体
  - text: '[мо́жно]{.ru}'
    answer: 按意义选体
  - text: '[на́до]{.ru}'
    answer: 按意义选体
  - text: '[нельзя́]{.ru}'
    answer: 按意义选体
  - text: '[мочь]{.ru}'
    answer: 按意义选体
  why: |-
    第 1–11 题：表示开始、继续、结束的动词（[начина́ть, нача́ть, стать, продолжа́ть, зако́нчить, переста́ть]{.ru}），以及 [уста́ть, привы́кнуть, научи́ться, люби́ть, нра́виться]{.ru}，后面只用未完成体不定式。即使主导词本身是完成体（[нача́ть, переста́ть, привы́кнуть]{.ru}），也不能说 [на́чал прочита́ть]{.ru}。
    第 12、13 题：[успе́ть]{.ru} 说能不能做成，一般接完成体；[забы́ть]{.ru} 说一次具体的事也用完成体：[забы́л купи́ть]{.ru}。
    第 14–18 题：[хоте́ть, мочь, мо́жно, на́до]{.ru} 按一般规则选体：一次具体的事用完成体，经常的事用未完成体；[нельзя́]{.ru} + 未完成体是禁止，+ 完成体是做不到。
- id: B2-L31-02
  tags:
  - нельзя + 不定式的体
  task: 句中 [нельзя́]{.ru} 是什么意思？归栏。
  type: classify
  bins:
  - 不许（禁止）
  - 做不到（不可能）
  items:
  - text: '[В о́буви в за́ле танцева́ть нельзя́.]{.ru}'
    answer: 不许（禁止）
  - text: '[Э́ту дверь нельзя́ открыва́ть.]{.ru}'
    answer: 不许（禁止）
  - text: '[Здесь нельзя́ фотографи́ровать.]{.ru}'
    answer: 不许（禁止）
  - text: '[На уро́ке нельзя́ говори́ть по-кита́йски.]{.ru}'
    answer: 不许（禁止）
  - text: '[Больно́му нельзя́ выходи́ть на у́лицу.]{.ru}'
    answer: 不许（禁止）
  - text: '[В библиоте́ке нельзя́ гро́мко разгова́ривать.]{.ru}'
    answer: 不许（禁止）
  - text: '[«Ба́рыню» нельзя́ вы́учить сра́зу.]{.ru}'
    answer: 做不到（不可能）
  - text: '[Э́ту дверь нельзя́ откры́ть: ключа́ нет.]{.ru}'
    answer: 做不到（不可能）
  - text: '[Его́ по́черк нельзя́ прочита́ть.]{.ru}'
    answer: 做不到（不可能）
  - text: '[Тако́й торт нельзя́ пригото́вить за час.]{.ru}'
    answer: 做不到（不可能）
  - text: '[Э́то окно́ нельзя́ закры́ть: оно́ слома́лось.]{.ru}'
    answer: 做不到（不可能）
  - text: '[Все слова́ нельзя́ запо́мнить за оди́н день.]{.ru}'
    answer: 做不到（不可能）
  why: |-
    第 1–6 题：[нельзя́]{.ru} + 未完成体：不许、不应该做：[танцева́ть, открыва́ть, фотографи́ровать, говори́ть, выходи́ть, разгова́ривать]{.ru}。
    第 7–12 题：[нельзя́]{.ru} + 完成体：想做也做不成：[вы́учить, откры́ть, прочита́ть, пригото́вить, закры́ть, запо́мнить]{.ru}。第 2 题和第 8 题同一扇门：[открыва́ть]{.ru}“不许开”，[откры́ть]{.ru}“打不开”。
- id: B2-L31-03
  tags:
  - 不定式的体：选择
  task: 选出合适的不定式写在空线上。
  type: matrix
  cols:
  - 主导词 + 体对
  - 不定式
  given:
  - 0
  rows:
  - base: '[переста́л + смотре́ть / посмотре́ть]{.ru}'
    cells:
    - '[переста́л + смотре́ть / посмотре́ть]{.ru}'
    - '[смотре́ть]{.ru}'
  - base: '[на́чал + чита́ть / прочита́ть]{.ru}'
    cells:
    - '[на́чал + чита́ть / прочита́ть]{.ru}'
    - '[чита́ть]{.ru}'
  - base: '[успе́л + де́лать / сде́лать]{.ru}'
    cells:
    - '[успе́л + де́лать / сде́лать]{.ru}'
    - '[сде́лать]{.ru}'
  - base: '[забы́л + покупа́ть / купи́ть]{.ru}'
    cells:
    - '[забы́л + покупа́ть / купи́ть]{.ru}'
    - '[купи́ть]{.ru}'
    hint: 这一次
  - base: '[уста́л + объясня́ть / объясни́ть]{.ru}'
    cells:
    - '[уста́л + объясня́ть / объясни́ть]{.ru}'
    - '[объясня́ть]{.ru}'
  - base: '[привы́к + встава́ть / встать]{.ru}'
    cells:
    - '[привы́к + встава́ть / встать]{.ru}'
    - '[встава́ть]{.ru}'
    hint: 早起
  - base: '[научи́лась + танцева́ть / станцева́ть]{.ru}'
    cells:
    - '[научи́лась + танцева́ть / станцева́ть]{.ru}'
    - '[танцева́ть]{.ru}'
  - base: '[на́до + покупа́ть / купи́ть]{.ru}'
    cells:
    - '[на́до + покупа́ть / купи́ть]{.ru}'
    - '[купи́ть]{.ru}'
    hint: 今天把票买了
  - base: '[на́до + повторя́ть / повтори́ть]{.ru}'
    cells:
    - '[на́до + повторя́ть / повтори́ть]{.ru}'
    - '[повторя́ть]{.ru}'
    hint: 每天复习生词
  - base: '[не на́до + звони́ть / позвони́ть]{.ru}'
    cells:
    - '[не на́до + звони́ть / позвони́ть]{.ru}'
    - '[звони́ть]{.ru}'
  - base: '[нельзя́ + открыва́ть / откры́ть]{.ru}'
    cells:
    - '[нельзя́ + открыва́ть / откры́ть]{.ru}'
    - '[открыва́ть]{.ru}'
    hint: 不许开
  - base: '[нельзя́ + реша́ть / реши́ть]{.ru}'
    cells:
    - '[нельзя́ + реша́ть / реши́ть]{.ru}'
    - '[реши́ть]{.ru}'
    hint: 这道题解不出来
  - base: '[продолжа́ли + петь / спеть]{.ru}'
    cells:
    - '[продолжа́ли + петь / спеть]{.ru}'
    - '[петь]{.ru}'
  - base: '[мо́жно + брать / взять]{.ru}'
    cells:
    - '[мо́жно + брать / взять]{.ru}'
    - '[взять]{.ru}'
    hint: 现在借一下你的词典
  why: |-
    第 1、2、5、7、13 题：[переста́ть, нача́ть, уста́ть, научи́ться, продолжа́ть]{.ru} 后只用未完成体：[смотре́ть, чита́ть, объясня́ть, танцева́ть, петь]{.ru}。
    第 6 题：[привы́кнуть]{.ru} 后也只用未完成体：[привы́к встава́ть]{.ru}。
    第 3、4 题：[успе́ть]{.ru} 和一次具体的 [забы́ть]{.ru} 后用完成体：[успе́л сде́лать, забы́л купи́ть]{.ru}。
    第 8、14 题：[на́до, мо́жно]{.ru} 说一次具体的事用完成体：[купи́ть, взять]{.ru}；第 9 题说经常的事用未完成体：[повторя́ть]{.ru}。
    第 10 题：[не на́до]{.ru} 后一般用未完成体：[не на́до звони́ть]{.ru}。
    第 11、12 题：[нельзя́]{.ru} + 未完成体表示禁止，+ 完成体表示做不到。
- id: B2-L31-04
  tags:
  - 不定式的体：句中
  task: 用括号里体对中合适的不定式填空。
  type: fill
  items:
  - stem: Ю́ми ста́ла ___ ру́сские пе́сни.
    hint: петь / спеть
    accept:
    - петь
  - stem: Мы не успе́ли ___ все зада́чи.
    hint: реша́ть / реши́ть
    accept:
    - реши́ть
  - stem: Ди́ма ко́нчил ___ и пошёл гуля́ть.
    hint: обе́дать / пообе́дать
    accept:
    - обе́дать
  - stem: 'На́до ___ ба́бушке: у неё сего́дня пра́здник.'
    hint: звони́ть / позвони́ть
    accept:
    - позвони́ть
  - stem: Не на́до ___ дверь, я сам откро́ю.
    hint: открыва́ть / откры́ть
    accept:
    - открыва́ть
  - stem: Я забы́л ___ слова́рь.
    hint: брать / взять
    accept:
    - взять
  - stem: Ми́ша привы́к ___ уро́ки по́сле у́жина.
    hint: де́лать / сде́лать
    accept:
    - де́лать
  - stem: Здесь нельзя́ ___ — э́то музе́й.
    hint: фотографи́ровать / сфотографи́ровать
    accept:
    - фотографи́ровать
  - stem: Тако́й текст нельзя́ ___ за час.
    hint: чита́ть / прочита́ть
    accept:
    - прочита́ть
  - stem: Слова́ ну́жно ___ ка́ждый день.
    hint: повторя́ть / повтори́ть
    accept:
    - повторя́ть
  - stem: Мо́жно ___ ваш телефо́н? Мне ну́жно позвони́ть.
    hint: брать / взять
    accept:
    - взять
  - stem: А́нна продолжа́ла ___ пи́сьма.
    hint: писа́ть / написа́ть
    accept:
    - писа́ть
  why: |-
    第 1、3、7、12 题：[стать, ко́нчить, привы́кнуть, продолжа́ть]{.ru} 后只用未完成体：[петь, обе́дать, де́лать, писа́ть]{.ru}。
    第 2、6 题：[успе́ть]{.ru} 和表示一次的 [забы́ть]{.ru} 后用完成体：[реши́ть, взять]{.ru}。
    第 4、11 题：[на́до, мо́жно]{.ru} 说一次具体的事，用完成体：[позвони́ть, взять]{.ru}；第 10 题说经常的事，用未完成体：[повторя́ть]{.ru}。
    第 5 题：[не на́до]{.ru} 后用未完成体：[не на́до открыва́ть]{.ru}。
    第 8 题：禁止，[нельзя́]{.ru} + 未完成体；第 9 题：做不到，[нельзя́]{.ru} + 完成体。
