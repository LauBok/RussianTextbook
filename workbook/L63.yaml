    - '[кино́]{.ru}'
  - base: '[иску́сство]{.ru}'
    cells:
    - '[иску́сство]{.ru}'
    - '[иску́сством]{.ru}'
    - '[иску́сство]{.ru}'
    new: true
    gloss: 艺术
  why: |
    第 1–12 题：[интересова́ться]{.ru} 只接第五格，[люби́ть]{.ru} 接第四格。最容易错的是把第四格带到 [интересова́ться]{.ru} 后面，写成 [интересу́юсь му́зыку]{.ru}。
    第 1、3、4、9、10 题：阴性两个形式都变：[му́зыкой — му́зыку]{.ru}，[исто́рией — исто́рию]{.ru}。
    第 2、5、6、8、12 题：阳性、中性非动物名词第四格同第一格，只有第五格要变：[спо́ртом — спорт]{.ru}，[иску́сством — иску́сство]{.ru}。
    第 7 题：阴性 [-ь]{.ru} 词第四格同第一格，第五格 [жи́вописью]{.ru}。
    第 11 题：[кино́]{.ru} 不变格，两处都写 [кино́]{.ru}。
- id: L63-04
  tags:
  - 第一变位：-ся 动词
  - 第一变位：-ова- 变 -у-
  task: 按主语写出括号里动词的现在时。
  type: fill
  items:
  - stem: Ми́ша ___ футбо́лом.
    hint: занима́ться
    accept:
    - занима́ется
  - stem: Чем ты ___?
    hint: интересова́ться
    accept:
    - интересу́ешься
  - stem: Я ___ пла́ванием.
    hint: занима́ться
    accept:
    - занима́юсь
  - stem: Мы ___ исто́рией Росси́и.
    hint: интересова́ться
    accept:
    - интересу́емся
  - stem: Чем вы ___ ве́чером?
    hint: занима́ться
    accept:
    - занима́етесь
  - stem: А́нна ___ теа́тром и кино́.
    hint: интересова́ться
    accept:
    - интересу́ется
  - stem: Студе́нты ___ в библиоте́ке.
    hint: занима́ться
    accept:
    - занима́ются
  - stem: Я ___ му́зыкой.
    hint: интересова́ться
    accept:
    - интересу́юсь
  - stem: Мы с Пье́ром ___ спо́ртом.
    hint: занима́ться
    accept:
    - занима́емся
  - stem: Вы ___ ша́хматами?
    hint: интересова́ться
    accept:
    - интересу́етесь
  - stem: Ты ___ хокке́ем?
    hint: занима́ться
    accept:
    - занима́ешься
  - stem: Ва́ши друзья́ ___ теа́тром?
    hint: интересова́ться
    accept:
    - интересу́ются
  - stem: Ми́ша ___ пирожо́к с мя́сом.
    hint: про́бовать
    accept:
    - про́бует
  - stem: Мы ___ вме́сте с А́нной.
    hint: занима́ться
    accept:
    - занима́емся
  - stem: Чем ___ Ван Лэй?
    hint: интересова́ться
    accept:
    - интересу́ется
  - stem: Мои́ роди́тели ___ теа́тром.
    hint: интересова́ться
    accept:
    - интересу́ются
  - stem: Ты ___ футбо́лом?
    hint: интересова́ться
    accept:
    - интересу́ешься
  - stem: Я ___ в музыка́льном клу́бе.
    hint: занима́ться
    accept:
    - занима́юсь
  - stem: Пьер и Ю́ми ___ ру́сским языко́м.
    hint: занима́ться
    accept:
    - занима́ются
  - stem: Мы ___ ша́хматами.
    hint: интересова́ться
    accept:
    - интересу́емся
  - stem: Ты ___ капу́сту?
    hint: про́бовать
    accept:
    - про́буешь
  - stem: Я ___ мёд.
    hint: про́бовать
    accept:
    - про́бую
  - stem: А́нна ___ в театра́льном клу́бе.
    hint: занима́ться
    accept:
    - занима́ется
  why: |-
    第 1、3、5、7、9、11、14、18、19、23 题：[занима́ться]{.ru} 按 [-ать]{.ru} 规则变位，元音后 [-сь]{.ru}，辅音后 [-ся]{.ru}：[занима́юсь, занима́етесь]{.ru}；[занима́ется, занима́ются]{.ru}。
    第 2、4、6、8、10、12、15–17、20 题：[интересова́ться]{.ru} 的 [-ова-]{.ru} 变成 [-у-]{.ru}：[интересу́юсь, интересу́ешься, интересу́ется, интересу́емся, интересу́етесь, интересу́ются]{.ru}。
    第 9 题：[мы с Пье́ром]{.ru} 是两个人，用 [мы]{.ru} 的形式。
    第 13、21、22 题：[про́бовать]{.ru} 同样 [-ова- → -у-]{.ru}，重音在词干：[про́бует, про́буешь, про́бую]{.ru}。
