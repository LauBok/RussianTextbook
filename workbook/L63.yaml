heading: 第 63 课　支配第五格的动词
groups:
- id: L63-01
  tags:
  - 第一变位：-ся 动词
  - 第一变位：-ова- 变 -у-
  task: 写出动词的六个现在时人称形式。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[он / она́]{.ru}'
  - '[мы]{.ru}'
  - '[вы]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[занима́ться]{.ru}'
    cells:
    - '[занима́ться]{.ru}'
    - '[занима́юсь]{.ru}'
    - '[занима́ешься]{.ru}'
    - '[занима́ется]{.ru}'
    - '[занима́емся]{.ru}'
    - '[занима́етесь]{.ru}'
    - '[занима́ются]{.ru}'
  - base: '[одева́ться]{.ru}'
    cells:
    - '[одева́ться]{.ru}'
    - '[одева́юсь]{.ru}'
    - '[одева́ешься]{.ru}'
    - '[одева́ется]{.ru}'
    - '[одева́емся]{.ru}'
    - '[одева́етесь]{.ru}'
    - '[одева́ются]{.ru}'
  - base: '[улыба́ться]{.ru}'
    cells:
    - '[улыба́ться]{.ru}'
    - '[улыба́юсь]{.ru}'
    - '[улыба́ешься]{.ru}'
    - '[улыба́ется]{.ru}'
    - '[улыба́емся]{.ru}'
    - '[улыба́етесь]{.ru}'
    - '[улыба́ются]{.ru}'
    new: true
    gloss: 微笑
  - base: '[интересова́ться]{.ru}'
    cells:
    - '[интересова́ться]{.ru}'
    - '[интересу́юсь]{.ru}'
    - '[интересу́ешься]{.ru}'
    - '[интересу́ется]{.ru}'
    - '[интересу́емся]{.ru}'
    - '[интересу́етесь]{.ru}'
    - '[интересу́ются]{.ru}'
  - base: '[про́бовать]{.ru}'
    cells:
    - '[про́бовать]{.ru}'
    - '[про́бую]{.ru}'
    - '[про́буешь]{.ru}'
    - '[про́бует]{.ru}'
    - '[про́буем]{.ru}'
    - '[про́буете]{.ru}'
    - '[про́буют]{.ru}'
  - base: '[танцева́ть]{.ru}'
    cells:
    - '[танцева́ть]{.ru}'
    - '[танцу́ю]{.ru}'
    - '[танцу́ешь]{.ru}'
    - '[танцу́ет]{.ru}'
    - '[танцу́ем]{.ru}'
    - '[танцу́ете]{.ru}'
    - '[танцу́ют]{.ru}'
    new: true
    gloss: 跳舞
  - base: '[путеше́ствовать]{.ru}'
    cells:
    - '[путеше́ствовать]{.ru}'
    - '[путеше́ствую]{.ru}'
    - '[путеше́ствуешь]{.ru}'
    - '[путеше́ствует]{.ru}'
    - '[путеше́ствуем]{.ru}'
    - '[путеше́ствуете]{.ru}'
    - '[путеше́ствуют]{.ru}'
    new: true
    gloss: 旅行
  why: |
    第 1–3 题：[-аться]{.ru} 动词按 [чита́ть]{.ru} 变位，再加 [-ся / -сь]{.ru}：元音后加 [-сь]{.ru}（[занима́юсь, занима́етесь]{.ru}），辅音后加 [-ся]{.ru}（[занима́ешься, занима́ются]{.ru}）。
    第 4–7 题：[-овать / -евать]{.ru} 动词去掉 [-овать / -евать]{.ru}，换成 [-у-]{.ru} 再加词尾：[интересу́юсь, про́бую, танцу́ю, путеше́ствую]{.ru}。重音在 [-у́-]{.ru} 上还是在词干上，看不定式：[интересова́ться → интересу́ются]{.ru}，[про́бовать → про́буют]{.ru}，[путеше́ствовать → путеше́ствуют]{.ru}。第 6 题 [ц]{.ru} 后的 [-ева-]{.ru} 同样变 [-у-]{.ru}。
    第 4 题：[интересова́ться]{.ru} 两条规则一起用：先变 [-у-]{.ru}，再加 [-ся / -сь]{.ru}。
- id: L63-02
  tags:
