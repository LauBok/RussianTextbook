  - base: '[поэ́зия]{.ru}'
    cells:
    - '[поэ́зия]{.ru}'
    - '[поэ́зией]{.ru}'
    - '[поэ́зию]{.ru}'
    new: true
    gloss: 诗歌
  - base: '[архитекту́ра]{.ru}'
    cells:
