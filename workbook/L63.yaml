    cells:
    - '[бале́т]{.ru}'
    - '[бале́том]{.ru}'
  - base: '[пла́вание]{.ru}'
    cells:
    - '[пла́вание]{.ru}'
    - '[пла́ванием]{.ru}'
  - base: '[му́зыка]{.ru}'
    cells:
    - '[му́зыка]{.ru}'
    - '[му́зыкой]{.ru}'
  - base: '[гимна́стика]{.ru}'
    cells:
