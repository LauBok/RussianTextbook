  - base: '[жи́вопись]{.ru}'
    cells:
    - '[жи́вопись]{.ru}'
    - '[жи́вописью]{.ru}'
    hint: f
    new: true
    gloss: 绘画
  - base: '[кино́]{.ru}'
    cells:
    - '[кино́]{.ru}'
    - '[кино́]{.ru}'
  why: |
    第 1–5 题：阳性加 [-ом]{.ru}，[-й]{.ru} 换 [-ем]{.ru}：[спо́ртом, те́ннисом, хокке́ем]{.ru}。
    第 6、12 题：中性 [-ие, -о]{.ru} 加 [-м]{.ru}：[пла́ванием, иску́сством]{.ru}。
    第 7、8、11 题：[-а]{.ru} 改 [-ой]{.ru}：[му́зыкой, гимна́стикой, фи́зикой]{.ru}。
    第 9、10 题：[-ия]{.ru} 改 [-ией]{.ru}：[исто́рией, хи́мией]{.ru}，不写 [-ии]{.ru}（那是第六格）。
    第 13 题：[жи́вопись]{.ru} 是阴性 [-ь]{.ru} 词，写 [жи́вописью]{.ru}。
    第 14 题：[кино́]{.ru} 不变格：[занима́ться кино́]{.ru}。
- id: L63-03
