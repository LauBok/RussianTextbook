  task: 写出代词和前置词 [с]{.ru}、[о]{.ru} 的组合。
  type: matrix
  cols:
  - 代词
  - '[с]{.ru} + 第五格'
  - '[о]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[с кем]{.ru}'
    - '[о ком]{.ru}'
  - base: '[что]{.ru}'
    cells:
    - '[что]{.ru}'
    - '[с чем]{.ru}'
    - '[о чём]{.ru}'
  - base: '[кто́-то]{.ru}'
    cells:
    - '[кто́-то]{.ru}'
    - '[с ке́м-то]{.ru}'
    - '[о ко́м-то]{.ru}'
  - base: '[что́-нибудь]{.ru}'
    cells:
    - '[что́-нибудь]{.ru}'
    - '[с че́м-нибудь]{.ru}'
    - '[о чём-нибудь]{.ru}'
  - base: '[ко́е-кто]{.ru}'
    cells:
    - '[ко́е-кто]{.ru}'
    - '[ко́е с кем]{.ru}'
    - '[ко́е о ком]{.ru}'
  - base: '[ко́е-что]{.ru}'
    cells:
    - '[ко́е-что]{.ru}'
    - '[ко́е с чем]{.ru}'
    - '[ко́е о чём]{.ru}'
  - base: '[никто́]{.ru}'
    cells:
    - '[никто́]{.ru}'
    - '[ни с кем]{.ru}'
    - '[ни о ком]{.ru}'
  - base: '[ничто́]{.ru}'
    cells:
    - '[ничто́]{.ru}'
    - '[ни с чем]{.ru}'
    - '[ни о чём]{.ru}'
  - base: '[не́кого]{.ru}'
    cells:
    - '[не́кого]{.ru}'
    - '[не́ с кем]{.ru}'
    - '[не́ о ком]{.ru}'
  - base: '[не́чего]{.ru}'
    cells:
    - '[не́чего]{.ru}'
    - '[не́ с чем]{.ru}'
    - '[не́ о чем]{.ru}'
  - base: '[друг дру́га]{.ru}'
    cells:
    - '[друг дру́га]{.ru}'
    - '[друг с дру́гом]{.ru}'
    - '[друг о дру́ге]{.ru}'
  - base: '[себя́]{.ru}'
    cells:
    - '[себя́]{.ru}'
    - '[с собо́й]{.ru}'
    - '[о себе́]{.ru}'
  - base: '[все]{.ru}'
    cells:
    - '[все]{.ru}'
    - '[со все́ми]{.ru}'
    - '[обо всех]{.ru}'
  - base: '[сам]{.ru}'
    cells:
    - '[сам]{.ru}'
    - '[с сами́м]{.ru}'
    - '[о само́м]{.ru}'
  why: '第 1、2 题：[кто, что]{.ru} 的第五格 [кем, чем]{.ru}，第六格 [ком, чём]{.ru}；下面各词都在它们的基础上构成。

    第 3、4 题：[-то, -нибудь]{.ru} 词：前置词在最前面，后缀不变：[с ке́м-то, о чём-нибудь]{.ru}。

    第 5、6 题：[ко́е-]{.ru} 词：前置词夹在中间，分开写：[ко́е с кем, ко́е о чём]{.ru}。

    第 7、8 题：[никто́, ничто́]{.ru}：前置词也夹在中间：[ни с кем, ни о чём]{.ru}。

    第 9、10 题：[не́кого, не́чего]{.ru}：同样夹在中间，重音在 [не́]{.ru} 上：[не́ с кем, не́ о чем]{.ru}。

    第 11 题：[друг дру́га]{.ru}：前置词放在两个词之间：[друг с дру́гом, друг о дру́ге]{.ru}。

    第 12 题：[себя́]{.ru}：[с собо́й, о себе́]{.ru}。

    第 13 题：[все]{.ru}：[со все́ми, обо всех]{.ru}，前置词加元音 [о]{.ru}。

    第 14 题：[сам]{.ru} 间接格重音在词尾：[с сами́м, о само́м]{.ru}。'
- id: B2-L60-综合-b
  lessons:
  - B2-L20
  - B2-L21
  - B2-L22
  - B2-L58
  - B2-L59
  - B2-L60
  tags:
  - 综合：不定、否定与限定代词的意义
  recycles:
  - B2-L58-03
  - B2-L59-02
  task: 按意义把句子归栏。
  type: classify
  bins:
  - 确有其人其事
  - 有没有不确定
  - 知道但不说
  - 全都没有
  - 没有可……的
  - 每一个
  - 随便哪一个
  items:
  - text: '[Кто́-то стучи́т в дверь.]{.ru}'
    answer: 确有其人其事
  - text: '[Кто́-нибудь звони́л?]{.ru}'
    answer: 有没有不确定
  - text: '[У меня́ есть для тебя́ ко́е-что.]{.ru}'
    answer: 知道但不说
  - text: '[Никто́ не звони́л.]{.ru}'
    answer: 全都没有
  - text: '[Мне не́кого спроси́ть.]{.ru}'
    answer: 没有可……的
  - text: '[Ка́ждый студе́нт получи́л биле́т.]{.ru}'
    answer: 每一个
  - text: '[Возьми́ любу́ю кни́гу.]{.ru}'
    answer: 随便哪一个
  - text: '[Она́ что́-то купи́ла.]{.ru}'
    answer: 确有其人其事
  - text: '[Купи́ что́-нибудь к ча́ю.]{.ru}'
    answer: 有没有不确定
  - text: '[Я ко́е с кем поговори́л.]{.ru}'
    answer: 知道但不说
  - text: '[Я ничего́ не купи́л.]{.ru}'
    answer: 全都没有
  - text: '[Нам не́где сесть.]{.ru}'
    answer: 没有可……的
  - text: '[Он звони́т ка́ждый ве́чер.]{.ru}'
    answer: 每一个
  - text: '[Приходи́ в любо́е вре́мя.]{.ru}'
    answer: 随便哪一个
  - text: '[Ди́ма куда́-то ушёл.]{.ru}'
    answer: 确有其人其事
  - text: '[Я когда́-нибудь пое́ду туда́.]{.ru}'
    answer: 有没有不确定
  - text: '[Ко́е-кто опя́ть опозда́л.]{.ru}'
    answer: 知道但不说
  - text: '[Он нигде́ не́ был.]{.ru}'
    answer: 全都没有
  - text: '[Ей не́ с кем поговори́ть.]{.ru}'
    answer: 没有可……的
  - text: '[На ка́ждом этаже́ есть ку́хня.]{.ru}'
    answer: 每一个
  - text: '[Э́то зна́ет любо́й студе́нт.]{.ru}'
    answer: 随便哪一个
  why: '第 1、8、15 题：[-то]{.ru}：确实有，只是说不清是谁、什么、哪里。

    第 2、9、16 题：[-нибудь]{.ru}：问句、命令、将来，有没有、是哪一个不确定。

    第 3、10、17 题：[ко́е-]{.ru}：说话人知道，只是不说。

    第 4、11、18 题：[ни-]{.ru} + [не]{.ru} + 变位动词：一个也没有，主语第一格。

    第 5、12、19 题：[не́-]{.ru} + 不定式，主体第三格：想做却没有对象、地方或时间。

    第 6、13、20 题：[ка́ждый]{.ru}：一个一个、无一例外。

    第 7、14、21 题：[любо́й]{.ru}：随便哪一个都行。'
- id: B2-L60-综合-c
  lessons:
  - B2-L20
  - B2-L21
  - B2-L22
  - B2-L58
  - B2-L59
  - B2-L60
  tags:
  - 综合：代词核查
  recycles:
  - B2-L60-03
  task: 每句有一处错误，写出正确的句子或词组。
  type: matrix
  cols:
  - 原句
  - 改正
  given:
  - 0
  rows:
  - base: '[Мне не́кого не спроси́ть.]{.ru}'
    cells:
    - '[Мне не́кого не спроси́ть.]{.ru}'
    - '[Мне не́кого спроси́ть.]{.ru}'
  - base: '[с не́кем поговори́ть]{.ru}'
    cells:
    - '[с не́кем поговори́ть]{.ru}'
    - '[не́ с кем поговори́ть]{.ru}'
  - base: '[Они́ ду́мают о друг дру́ге.]{.ru}'
    cells:
    - '[Они́ ду́мают о друг дру́ге.]{.ru}'
    - '[Они́ ду́мают друг о дру́ге.]{.ru}'
  - base: '[Кто́-то приходи́л?]{.ru}'
    cells:
    - '[Кто́-то приходи́л?]{.ru}'
    - '[Кто́-нибудь приходи́л?]{.ru}'
    hint: 问“有没有人来过”
  - base: '[Я не́кого спроси́ть.]{.ru}'
    cells:
    - '[Я не́кого спроси́ть.]{.ru}'
    - '[Мне не́кого спроси́ть.]{.ru}'
  - base: '[оди́н из лу́чшего студе́нта]{.ru}'
    cells:
    - '[оди́н из лу́чшего студе́нта]{.ru}'
    - '[оди́н из лу́чших студе́нтов]{.ru}'
  - base: '[Москва́ — одна́ из са́мых больши́х городо́в.]{.ru}'
    cells:
    - '[Москва́ — одна́ из са́мых больши́х городо́в.]{.ru}'
    - '[Москва́ — оди́н из са́мых больши́х городо́в.]{.ru}'
  - base: '[Я ничего́ зна́ю.]{.ru}'
    cells:
    - '[Я ничего́ зна́ю.]{.ru}'
    - '[Я ничего́ не зна́ю.]{.ru}'
  - base: '[Я поговори́л ко́е-с кем.]{.ru}'
    cells:
    - '[Я поговори́л ко́е-с кем.]{.ru}'
    - '[Я поговори́л ко́е с кем.]{.ru}'
  - base: '[Кто́-нибудь звони́л, но не сказа́л и́мени.]{.ru}'
    cells:
    - '[Кто́-нибудь звони́л, но не сказа́л и́мени.]{.ru}'
    - '[Кто́-то звони́л, но не сказа́л и́мени.]{.ru}'
  - base: '[Я ни с кем говори́л.]{.ru}'
    cells:
    - '[Я ни с кем говори́л.]{.ru}'
    - '[Я ни с кем не говори́л.]{.ru}'
  - base: '[Об э́том зна́ют во весь го́роде.]{.ru}'
    cells:
    - '[Об э́том зна́ют во весь го́роде.]{.ru}'
    - '[Об э́том зна́ют во всём го́роде.]{.ru}'
  - base: '[Они́ сам пришли́.]{.ru}'
    cells:
    - '[Они́ сам пришли́.]{.ru}'
    - '[Они́ са́ми пришли́.]{.ru}'
  - base: '[Чья э́то слова́рь?]{.ru}'
    cells:
    - '[Чья э́то слова́рь?]{.ru}'
    - '[Чей э́то слова́рь?]{.ru}'
  - base: '[Ка́ждый рассказа́л о его́ кани́кулах.]{.ru}'
    cells:
    - '[Ка́ждый рассказа́л о его́ кани́кулах.]{.ru}'
    - '[Ка́ждый рассказа́л о свои́х кани́кулах.]{.ru}'
    hint: “他的”指每个人自己
  why: '第 1 题：[не́кого]{.ru} 句里动词是不定式，不再加 [не]{.ru}。

    第 5 题：[не́кого]{.ru} 句的主体用第三格：[Мне не́кого спроси́ть]{.ru}。

    第 2、3、9 题：前置词的位置：[не́ с кем, ко́е с кем, друг о дру́ге]{.ru}，都夹在中间；[ко́е]{.ru} 后面有前置词时不写连字符。

    第 4 题：问“有没有人来过”用 [-нибудь]{.ru}；[Кто́-то приходи́л?]{.ru} 是“（我觉得）有人来过，对吧？”

    第 10 题：确实有人打过电话，只是不知道是谁，用 [-то]{.ru}。

    第 6 题：[оди́н из]{.ru} 后用复数第二格：[лу́чших студе́нтов]{.ru}。

    第 7 题：[оди́н]{.ru} 的性随 [из]{.ru} 后的名词（[го́род]{.ru} 阳性），不随主语 [Москва́]{.ru}。

    第 8、11 题：[ни-]{.ru} 句里变位动词前一定要有 [не]{.ru}：[ничего́ не зна́ю, ни с кем не говори́л]{.ru}。

    第 12 题：[весь]{.ru} 的第六格是 [всём]{.ru}：[во всём го́роде]{.ru}。

    第 13 题：[сам]{.ru} 和主语的性、数一致：复数 [са́ми]{.ru}。

    第 14 题：[слова́рь]{.ru} 是阳性，用 [чей]{.ru}。

    第 15 题：指主语自己的东西用 [свой]{.ru}：[о свои́х кани́кулах]{.ru}；[его́]{.ru} 指别人。'
