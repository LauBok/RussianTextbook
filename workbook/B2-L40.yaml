heading: 第 40 课　前缀 в- 和 вы-
groups:
- id: B2-L40-01
  tags:
  - 前缀 в- / вы-：变位
  task: 写出动词的现在时、将来时和过去时。
  type: matrix
  cols:
  - 动词对
  - 未完成体 [я]{.ru}
  - 未完成体 [они́]{.ru}
  - 完成体将来时 [я]{.ru}
  - 过去时阳性
  - 过去时阴性
  given:
  - 0
  rows:
  - base: '[входи́ть / войти́]{.ru}'
    cells:
    - '[входи́ть / войти́]{.ru}'
    - '[вхожу́]{.ru}'
    - '[вхо́дят]{.ru}'
    - '[войду́]{.ru}'
    - '[вошёл]{.ru}'
    - '[вошла́]{.ru}'
  - base: '[выходи́ть / вы́йти]{.ru}'
    cells:
    - '[выходи́ть / вы́йти]{.ru}'
    - '[выхожу́]{.ru}'
    - '[выхо́дят]{.ru}'
    - '[вы́йду]{.ru}'
    - '[вы́шел]{.ru}'
    - '[вы́шла]{.ru}'
  - base: '[въезжа́ть / въе́хать]{.ru}'
    cells:
    - '[въезжа́ть / въе́хать]{.ru}'
    - '[въезжа́ю]{.ru}'
    - '[въезжа́ют]{.ru}'
    - '[въе́ду]{.ru}'
    - '[въе́хал]{.ru}'
    - '[въе́хала]{.ru}'
  - base: '[выезжа́ть / вы́ехать]{.ru}'
    cells:
    - '[выезжа́ть / вы́ехать]{.ru}'
    - '[выезжа́ю]{.ru}'
    - '[выезжа́ют]{.ru}'
    - '[вы́еду]{.ru}'
    - '[вы́ехал]{.ru}'
    - '[вы́ехала]{.ru}'
  why: |-
    过去时一栏写完成体的过去时。
    第 1 题：[в-]{.ru} 在 [идти́]{.ru} 前写成 [во-]{.ru}：[войду́, вошёл, вошла́]{.ru}。
    第 2、4 题：[вы-]{.ru} 构成的完成体重音永远在 [вы́-]{.ru}：[вы́йду, вы́шел, вы́шла, вы́еду, вы́ехал]{.ru}；未完成体不在：[выхожу́, выезжа́ю]{.ru}。常见错误是写成 [вышла́]{.ru}。
    第 3 题：[в-]{.ru} 在 [е]{.ru} 前加 [ъ]{.ru}：[въезжа́ю, въе́ду]{.ru}。
- id: B2-L40-02
  tags:
  - 前缀 в- / вы-：前置词搭配
  task: 写出“进去”和“出来”的词组。
  type: matrix
  cols:
  - 地点
  - 进去
  - 出来
  given:
  - 0
  rows:
  - base: '[магази́н]{.ru}'
    cells:
    - '[магази́н]{.ru}'
    - '[войти́ в магази́н]{.ru}'
    - '[вы́йти из магази́на]{.ru}'
    hint: 步行
  - base: '[гара́ж]{.ru}'
    cells:
    - '[гара́ж]{.ru}'
    - '[въе́хать в гара́ж]{.ru}'
    - '[вы́ехать из гаража́]{.ru}'
    hint: 乘车；m
    new: true
    gloss: 车库
  - base: '[аудито́рия]{.ru}'
    cells:
    - '[аудито́рия]{.ru}'
    - '[войти́ в аудито́рию]{.ru}'
    - '[вы́йти из аудито́рии]{.ru}'
    hint: 步行
  - base: '[го́род]{.ru}'
    cells:
    - '[го́род]{.ru}'
    - '[въе́хать в го́род]{.ru}'
    - '[вы́ехать из го́рода]{.ru}'
    hint: 乘车
  - base: '[музе́й]{.ru}'
    cells:
    - '[музе́й]{.ru}'
    - '[войти́ в музе́й]{.ru}'
    - '[вы́йти из музе́я]{.ru}'
    hint: 步行
  - base: '[воро́та]{.ru}'
    cells:
    - '[воро́та]{.ru}'
    - '[въе́хать в воро́та]{.ru}'
    - '[вы́ехать из воро́т]{.ru}'
    hint: 乘车
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[войти́ в дом]{.ru}'
    - '[вы́йти из до́ма]{.ru}'
    hint: 步行
  - base: '[тонне́ль]{.ru}'
    cells:
    - '[тонне́ль]{.ru}'
    - '[въе́хать в тонне́ль]{.ru}'
    - '[вы́ехать из тонне́ля]{.ru}'
    hint: 乘车；m
    new: true
    gloss: 隧道
  - base: '[кафе́]{.ru}'
    cells:
    - '[кафе́]{.ru}'
    - '[войти́ в кафе́]{.ru}'
    - '[вы́йти из кафе́]{.ru}'
    hint: 步行
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[въе́хать в Москву́]{.ru}'
    - '[вы́ехать из Москвы́]{.ru}'
    hint: 乘车
  - base: '[класс]{.ru}'
    cells:
    - '[класс]{.ru}'
    - '[войти́ в класс]{.ru}'
    - '[вы́йти из кла́сса]{.ru}'
    hint: 步行
  - base: '[дере́вня]{.ru}'
    cells:
    - '[дере́вня]{.ru}'
    - '[въе́хать в дере́вню]{.ru}'
    - '[вы́ехать из дере́вни]{.ru}'
    hint: 乘车
  why: |-
    进去用 [в]{.ru} + 第四格，出来用 [из]{.ru} + 第二格：[войти́ в магази́н / вы́йти из магази́на]{.ru}。
    第 2、4、6、8、10、12 题：乘车用 [въе́хать / вы́ехать]{.ru}，别忘了 [ъ]{.ru} 和 [вы́-]{.ru} 的重音。第 2 题 [гаража́]{.ru} 重音在词尾。
    第 6 题：[воро́та]{.ru} 只有复数，第二格 [воро́т]{.ru}。
    第 9 题：[кафе́]{.ru} 不变格。
- id: B2-L40-03
  tags:
  - вышел / ушёл
  task: 每句的空里该用哪个词？归入相应的栏。
  type: classify
  bins:
  - '[вы́шел]{.ru}'
  - '[ушёл]{.ru}'
  items:
  - text: '[Ди́мы нет в ко́мнате: он … в коридо́р, сейча́с придёт.]{.ru}'
    answer: '[вы́шел]{.ru}'
  - text: '[Па́па уже́ … на рабо́ту, он бу́дет до́ма то́лько ве́чером.]{.ru}'
    answer: '[ушёл]{.ru}'
  - text: '[Преподава́тель … из аудито́рии на мину́ту.]{.ru}'
    answer: '[вы́шел]{.ru}'
  - text: '[Пьер … домо́й. Его́ здесь нет.]{.ru}'
    answer: '[ушёл]{.ru}'
  - text: '[Ван Лэй … на балко́н, он там разгова́ривает по телефо́ну.]{.ru}'
    answer: '[вы́шел]{.ru}'
  - text: '[— Позови́те, пожа́луйста, Ива́на Серге́евича! — Он …, позвони́те че́рез пять мину́т.]{.ru}'
    answer: '[вы́шел]{.ru}'
  - text: '[Ми́ша оби́делся и … к себе́ в ко́мнату.]{.ru}'
    answer: '[ушёл]{.ru}'
  - text: '[Врач уже́ …, сего́дня его́ не бу́дет.]{.ru}'
    answer: '[ушёл]{.ru}'
  - text: '[Па́па … на мину́ту в сад.]{.ru}'
    answer: '[вы́шел]{.ru}'
  - text: '[Гость сказа́л «до свида́ния» и … .]{.ru}'
    answer: '[ушёл]{.ru}'
  - text: '[Учи́тель … из кла́сса, но дверь оста́вил откры́той.]{.ru}'
    answer: '[вы́шел]{.ru}'
  - text: '[Брат … от нас в де́сять часо́в и сейча́с уже́ до́ма.]{.ru}'
    answer: '[ушёл]{.ru}'
  why: |-
    第 1、3、5、6、9、11 题：[вы́шел]{.ru} 说从屋子、教室里出来，人常常就在附近、一会儿回来：[на мину́ту, сейча́с придёт, позвони́те че́рез пять мину́т]{.ru}。
    第 2、4、7、8、10、12 题：[ушёл]{.ru} 强调人离开了、不在这里：[его́ здесь нет, бу́дет до́ма то́лько ве́чером, сего́дня его́ не бу́дет]{.ru}。第 12 题“从某人那里走”用 [уйти́ от]{.ru}。
- id: B2-L40-04
  tags:
  - в- / вы-：体与时间（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Ка́ждый день я ___ из до́ма в во́семь часо́в.
    hint: выходи́ть / вы́йти
    accept:
    - выхожу́
  - stem: Вчера́ Ди́ма ___ из до́ма в семь и опозда́л.
    hint: выходи́ть / вы́йти
    accept:
    - вы́шел
  - stem: За́втра мы ___ из Москвы́ ра́но у́тром.
    hint: выезжа́ть / вы́ехать
    accept:
    - вы́едем
    - выезжа́ем
  - stem: Когда́ мы ___ в зал, конце́рт уже́ начался́.
    hint: входи́ть / войти́
    accept:
    - вошли́
  - stem: 'Ти́ше, не ___ в ко́мнату: ба́бушка спит.'
    hint: входи́ть / войти́
    accept:
    - входи́
  - stem: Маши́на ме́дленно ___ в воро́та.
    hint: въезжа́ть / въе́хать
    accept:
    - въезжа́ла
    - въе́хала
  - stem: А́нна ___ на у́лицу и уви́дела Ди́му.
    hint: выходи́ть / вы́йти
    accept:
    - вы́шла
  - stem: Когда́ я ___ в метро́, мне позвони́ла ма́ма.
    hint: входи́ть / войти́
    accept:
    - входи́л
    - входи́ла
  - stem: Наш по́езд ___ из Каза́ни в де́вять ве́чера.
    hint: выезжа́ть / вы́ехать
    accept:
    - вы́ехал
  - stem: Пожа́луйста, ___! Дверь откры́та.
    hint: входи́ть / войти́
    accept:
    - входи́те
  why: |-
    第 2、4、7、9 题：一次进出、有结果，用完成体过去时：[вы́шел, вошли́, вы́шла, вы́ехал]{.ru}。[вы́-]{.ru} 永远重读。
    第 1 题：每天经常出门，用未完成体现在时：[выхожу́]{.ru}。
    第 3 题：将来一次，用完成体将来时 [вы́едем]{.ru}；说计划好的出发也可以用未完成体现在时 [выезжа́ем]{.ru}。
    第 6、8 题：正在进的过程：[въезжа́ла, входи́л]{.ru}；第 6 题强调结果也可以用 [въе́хала]{.ru}，第 8 题说话人是女性写 [входи́ла]{.ru}。
    第 5、10 题：命令式：禁止用未完成体 [не входи́]{.ru}；请人进来也用未完成体 [входи́те]{.ru}。
