heading: 第 53 课　年龄
groups:
- id: L53-01
  tags: [年龄：“岁”的三种形式]
  task: 写出年龄（数字用词写出）。
  type: matrix
  cols: [数, 年龄]
  given: [0]
  rows:
  - {base: '[1]{.ru}', cells: ['[1]{.ru}', '[оди́н год]{.ru}']}
  - {base: '[2]{.ru}', cells: ['[2]{.ru}', '[два го́да]{.ru}']}
  - {base: '[3]{.ru}', cells: ['[3]{.ru}', '[три го́да]{.ru}']}
  - {base: '[4]{.ru}', cells: ['[4]{.ru}', '[четы́ре го́да]{.ru}']}
  - {base: '[5]{.ru}', cells: ['[5]{.ru}', '[пять лет]{.ru}']}
  - {base: '[11]{.ru}', cells: ['[11]{.ru}', '[оди́ннадцать лет]{.ru}']}
  - {base: '[12]{.ru}', cells: ['[12]{.ru}', '[двена́дцать лет]{.ru}']}
  - {base: '[13]{.ru}', cells: ['[13]{.ru}', '[трина́дцать лет]{.ru}']}
  - {base: '[14]{.ru}', cells: ['[14]{.ru}', '[четы́рнадцать лет]{.ru}']}
  - {base: '[18]{.ru}', cells: ['[18]{.ru}', '[восемна́дцать лет]{.ru}']}
  - {base: '[20]{.ru}', cells: ['[20]{.ru}', '[два́дцать лет]{.ru}']}
  - {base: '[21]{.ru}', cells: ['[21]{.ru}', '[два́дцать оди́н год]{.ru}']}
  - {base: '[22]{.ru}', cells: ['[22]{.ru}', '[два́дцать два го́да]{.ru}']}
  - {base: '[24]{.ru}', cells: ['[24]{.ru}', '[два́дцать четы́ре го́да]{.ru}']}
  - {base: '[25]{.ru}', cells: ['[25]{.ru}', '[два́дцать пять лет]{.ru}']}
  - {base: '[31]{.ru}', cells: ['[31]{.ru}', '[три́дцать оди́н год]{.ru}']}
  - {base: '[33]{.ru}', cells: ['[33]{.ru}', '[три́дцать три го́да]{.ru}']}
  - {base: '[40]{.ru}', cells: ['[40]{.ru}', '[со́рок лет]{.ru}']}
  - {base: '[44]{.ru}', cells: ['[44]{.ru}', '[со́рок четы́ре го́да]{.ru}']}
  - {base: '[51]{.ru}', cells: ['[51]{.ru}', '[пятьдеся́т оди́н год]{.ru}']}
  - {base: '[67]{.ru}', cells: ['[67]{.ru}', '[шестьдеся́т семь лет]{.ru}']}
  - {base: '[72]{.ru}', cells: ['[72]{.ru}', '[се́мьдесят два го́да]{.ru}']}
  - {base: '[85]{.ru}', cells: ['[85]{.ru}', '[во́семьдесят пять лет]{.ru}']}
  - {base: '[90]{.ru}', cells: ['[90]{.ru}', '[девяно́сто лет]{.ru}']}
  why: |
    第 1、12、16、20 题：最后一个数词是 [оди́н]{.ru}，用 [год]{.ru}：[два́дцать оди́н год, пятьдеся́т оди́н год]{.ru}。
    第 2–4、13、14、17、19、22 题：最后一个数词是 [два, три, четы́ре]{.ru}，用 [го́да]{.ru}。
    第 5、10、11、15、18、21、23、24 题：最后一个数词是 5 以上或以零结尾（[два́дцать, со́рок, девяно́сто]{.ru}），用 [лет]{.ru}。
    第 6–9 题：11–14 是一个词，规则看整个词，一律用 [лет]{.ru}：[оди́ннадцать лет, четы́рнадцать лет]{.ru}，不能因为末尾像“1”“4”而写 [год, го́да]{.ru}。
- id: L53-02
  tags: [年龄：现在、过去与将来]
  task: 写出年龄的现在时、过去时和将来时说法。
  type: matrix
  cols: [人和年龄, 现在, 过去, 将来]
  given: [0]
  rows:
  - {base: '[я, 20]{.ru}', cells: ['[я, 20]{.ru}', '[Мне два́дцать лет.]{.ru}', '[Мне бы́ло два́дцать лет.]{.ru}', '[Мне бу́дет два́дцать лет.]{.ru}']}
  - {base: '[А́нна, 19]{.ru}', cells: ['[А́нна, 19]{.ru}', '[А́нне девятна́дцать лет.]{.ru}', '[А́нне бы́ло девятна́дцать лет.]{.ru}', '[А́нне бу́дет девятна́дцать лет.]{.ru}']}
  - {base: '[Ми́ша, 14]{.ru}', cells: ['[Ми́ша, 14]{.ru}', '[Ми́ше четы́рнадцать лет.]{.ru}', '[Ми́ше бы́ло четы́рнадцать лет.]{.ru}', '[Ми́ше бу́дет четы́рнадцать лет.]{.ru}']}
  - {base: '[ба́бушка, 75]{.ru}', cells: ['[ба́бушка, 75]{.ru}', '[Ба́бушке се́мьдесят пять лет.]{.ru}', '[Ба́бушке бы́ло се́мьдесят пять лет.]{.ru}', '[Ба́бушке бу́дет се́мьдесят пять лет.]{.ru}']}
  - {base: '[брат, 21]{.ru}', cells: ['[брат, 21]{.ru}', '[Бра́ту два́дцать оди́н год.]{.ru}', '[Бра́ту был два́дцать оди́н год.]{.ru}', '[Бра́ту бу́дет два́дцать оди́н год.]{.ru}']}
  - {base: '[он, 3]{.ru}', cells: ['[он, 3]{.ru}', '[Ему́ три го́да.]{.ru}', '[Ему́ бы́ло три го́да.]{.ru}', '[Ему́ бу́дет три го́да.]{.ru}']}
  - {base: '[она́, 1]{.ru}', cells: ['[она́, 1]{.ru}', '[Ей год.]{.ru}', '[Ей был год.]{.ru}', '[Ей бу́дет год.]{.ru}']}
  - {base: '[мы, 18]{.ru}', cells: ['[мы, 18]{.ru}', '[Нам восемна́дцать лет.]{.ru}', '[Нам бы́ло восемна́дцать лет.]{.ru}', '[Нам бу́дет восемна́дцать лет.]{.ru}']}
  - {base: '[па́па, 52]{.ru}', cells: ['[па́па, 52]{.ru}', '[Па́пе пятьдеся́т два го́да.]{.ru}', '[Па́пе бы́ло пятьдеся́т два го́да.]{.ru}', '[Па́пе бу́дет пятьдеся́т два го́да.]{.ru}']}
  - {base: '[де́душка, 81]{.ru}', cells: ['[де́душка, 81]{.ru}', '[Де́душке во́семьдесят оди́н год.]{.ru}', '[Де́душке был во́семьдесят оди́н год.]{.ru}', '[Де́душке бу́дет во́семьдесят оди́н год.]{.ru}']}
  - {base: '[ты, 22]{.ru}', cells: ['[ты, 22]{.ru}', '[Тебе́ два́дцать два го́да.]{.ru}', '[Тебе́ бы́ло два́дцать два го́да.]{.ru}', '[Тебе́ бу́дет два́дцать два го́да.]{.ru}']}
  why: |
    第 1–11 题：说年龄时人用第三格（[мне, А́нне, Ми́ше, бра́ту, ему́…]{.ru}），现在时不用动词，过去时加 [бы́ло]{.ru}，将来时加 [бу́дет]{.ru}。
    第 5、7、10 题：数词以 [оди́н]{.ru} 结尾时，主语是阳性单数 [год]{.ru}，过去时用 [был]{.ru}：[Бра́ту был два́дцать оди́н год]{.ru}；一岁可以只说 [год]{.ru}：[Ей год]{.ru}，也可以说 [Ей оди́н год]{.ru}。
    其余各题过去时一律用中性 [бы́ло]{.ru}，不随人的性别变：[А́нне бы́ло]{.ru}，不是 [А́нне была́]{.ru}。
- id: L53-03
  tags: [年龄：常见错误核查]
  task: 每句都有一处错误，写出正确的句子。
  type: matrix
  cols: [有错误的句子, 正确的句子]
  given: [0]
  rows:
  - {base: '[Я два́дцать лет.]{.ru}', cells: ['[Я два́дцать лет.]{.ru}', '[Мне два́дцать лет.]{.ru}']}
  - {base: '[Ему́ пять го́да.]{.ru}', cells: ['[Ему́ пять го́да.]{.ru}', '[Ему́ пять лет.]{.ru}']}
  - {base: '[Ей два́дцать оди́н лет.]{.ru}', cells: ['[Ей два́дцать оди́н лет.]{.ru}', '[Ей два́дцать оди́н год.]{.ru}']}
  - {base: '[Мне четы́рнадцать го́да.]{.ru}', cells: ['[Мне четы́рнадцать го́да.]{.ru}', '[Мне четы́рнадцать лет.]{.ru}']}
  - {base: '[Ба́бушке была́ се́мьдесят лет.]{.ru}', cells: ['[Ба́бушке была́ се́мьдесят лет.]{.ru}', '[Ба́бушке бы́ло се́мьдесят лет.]{.ru}']}
  - {base: '[Ско́лько лет ты?]{.ru}', cells: ['[Ско́лько лет ты?]{.ru}', '[Ско́лько тебе́ лет?]{.ru}']}
  - {base: '[Ми́ша бу́дет четы́рнадцать лет.]{.ru}', cells: ['[Ми́ша бу́дет четы́рнадцать лет.]{.ru}', '[Ми́ше бу́дет четы́рнадцать лет.]{.ru}']}
  - {base: '[Ему́ бы́ли три го́да.]{.ru}', cells: ['[Ему́ бы́ли три го́да.]{.ru}', '[Ему́ бы́ло три го́да.]{.ru}']}
  - {base: '[Нам два́дцать два лет.]{.ru}', cells: ['[Нам два́дцать два лет.]{.ru}', '[Нам два́дцать два го́да.]{.ru}']}
  - {base: '[Ско́лько вам год?]{.ru}', cells: ['[Ско́лько вам год?]{.ru}', '[Ско́лько вам лет?]{.ru}']}
  - {base: '[Де́душке бу́дут во́семьдесят лет.]{.ru}', cells: ['[Де́душке бу́дут во́семьдесят лет.]{.ru}', '[Де́душке бу́дет во́семьдесят лет.]{.ru}']}
  - {base: '[А́нна девятна́дцать лет.]{.ru}', cells: ['[А́нна девятна́дцать лет.]{.ru}', '[А́нне девятна́дцать лет.]{.ru}']}
  why: |
    第 1、6、7、12 题：年龄句里人用第三格，不用第一格：[Мне, тебе́, Ми́ше, А́нне]{.ru}；问年龄说 [Ско́лько + 第三格 + лет?]{.ru}
    第 2、3、4、9 题：[год]{.ru} 的形式由最后一个数词决定：5 以上和 11–14 用 [лет]{.ru}，1 用 [год]{.ru}，2–4 用 [го́да]{.ru}。
    第 10 题：问年龄一律用 [лет]{.ru}：[Ско́лько вам лет?]{.ru}
    第 5、8、11 题：过去时用中性 [бы́ло]{.ru}，将来时用单数 [бу́дет]{.ru}，不随人或数词变成 [была́, бы́ли, бу́дут]{.ru}。
- id: L53-04
  tags: [年龄：人用第三格]
  task: 用括号里的词填空。
  type: fill
  items:
  - {stem: '___ се́мьдесят лет.', hint: ба́бушка, accept: [ба́бушке]}
  - {stem: 'Ско́лько ___ лет?', hint: ты, accept: [тебе́]}
  - {stem: '___ четы́рнадцать лет.', hint: Ми́ша, accept: [Ми́ше]}
  - {stem: 'Ско́лько лет ___?', hint: ваш сын, accept: [ва́шему сы́ну]}
  - {stem: '___ бы́ло пять лет.', hint: я, accept: [мне]}
  - {stem: '___ бу́дет два́дцать оди́н год.', hint: Пьер, accept: [Пье́ру]}
  - {stem: '___ три го́да.', hint: ко́шка Му́рка, accept: [ко́шке Му́рке]}
  - {stem: 'Ско́лько ___ лет?', hint: вы, accept: [вам]}
  - {stem: '___ со́рок четы́ре го́да.', hint: Мари́я Никола́евна, accept: [Мари́и Никола́евне]}
  - {stem: '___ бы́ло два го́да.', hint: дочь, accept: [до́чери]}
  - {stem: 'Ско́лько лет ___?', hint: учи́тель, accept: [учи́телю]}
  - {stem: '___ ско́ро бу́дет во́семьдесят лет.', hint: де́душка, accept: [де́душке]}
  why: |
    第 1–12 题：年龄句里年龄属于谁，谁就用第三格；问句 [Ско́лько … лет?]{.ru} 里也一样。
    第 1、3、7、9、12 题：[-а / -я]{.ru} 结尾的名词（包括阳性的 [Ми́ша, де́душка]{.ru}）用 [-е]{.ru}；[Мари́я]{.ru} 用 [-ии]{.ru}。第 10 题 [дочь → до́чери]{.ru}。
    第 4、6、11 题：阳性名词用 [-у / -ю]{.ru}；第 4 题物主代词同时变：[ва́шему сы́ну]{.ru}。
    第 2、5、8 题：人称代词第三格 [тебе́, мне, вам]{.ru}；对长辈、陌生人问年龄用 [вам]{.ru}。
