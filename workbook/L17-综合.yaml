  why: '第 1、2 行：[быть]{.ru} 和 [жить]{.ru} 阴性重音移到词尾：[была́, жила́]{.ru}，其余形式重音在词干。

    第 3–8 行：去掉 [-ть]{.ru}，加 [-л, -ла, -ло, -ли]{.ru}，重音不动。[писа́ть]{.ru} 现在时是 [пишу́]{.ru}，但过去时从不定式构成，仍是 [писа́л]{.ru}。

    '
- id: L17-综合-b
  lessons:
  - L16
  - L17
  tags:
  - 综合：过去时
  recycles:
  - L16-01
  - L17-02
  task: 按主语写出括号里动词的过去时。
  type: fill
  items:
  - stem: А́нна ___ в библиоте́ке.
    hint: '[быть]{.ru}'
    accept:
    - '[была́]{.ru}'
  - stem: Ми́ша ___ кни́гу.
    hint: '[чита́ть]{.ru}'
    accept:
    - '[чита́л]{.ru}'
  - stem: Мы ___ в Москве́.
    hint: '[жить]{.ru}'
    accept:
    - '[жи́ли]{.ru}'
  - stem: Письмо́ ___ на столе́.
    hint: '[быть]{.ru}'
    accept:
    - '[бы́ло]{.ru}'
  - stem: Ма́ма и па́па ___ до́ма.
    hint: '[быть]{.ru}'
    accept:
    - '[бы́ли]{.ru}'
  - stem: Ты, О́льга, ___ письмо́?
    hint: '[писа́ть]{.ru}'
    accept:
    - '[писа́ла]{.ru}'
  - stem: Ван Лэй ___ по-ру́сски.
    hint: '[говори́ть]{.ru}'
    accept:
    - '[говори́л]{.ru}'
  - stem: Вы ___ фильм?
    hint: '[смотре́ть]{.ru}'
    accept:
    - '[смотре́ли]{.ru}'
  - stem: Ба́бушка ___ в саду́.
    hint: '[рабо́тать]{.ru}'
    accept:
    - '[рабо́тала]{.ru}'
  - stem: Где вы ___ вчера́?
    hint: '[быть]{.ru}'
    accept:
    - '[бы́ли]{.ru}'
  - stem: Кни́га ___ на по́лке.
    hint: '[быть]{.ru}'
    accept:
    - '[была́]{.ru}'
  - stem: Ван Лэй ___ в Пеки́не.
    hint: '[жить]{.ru}'
    accept:
    - '[жил]{.ru}'
  why: '第 1 题：主语 [А́нна]{.ru} 阴性，[была́]{.ru}，重音在词尾。

    第 2 题：[Ми́ша]{.ru} 虽以 [-а]{.ru} 结尾，是男人名，用阳性 [чита́л]{.ru}。

    第 3 题：[мы]{.ru} 用复数 [жи́ли]{.ru}。

    第 4 题：[письмо́]{.ru} 中性，[бы́ло]{.ru}。

    第 5 题：两个主语用复数 [бы́ли]{.ru}。

    第 6 题：呼语 [О́льга]{.ru} 说明 [ты]{.ru} 指女性，用 [писа́ла]{.ru}。

    第 7 题：[Ван Лэй]{.ru} 男性，[говори́л]{.ru}。

    第 8 题：[вы]{.ru} 不论指几个人，过去时都用复数 [смотре́ли]{.ru}。

    第 9 题：[ба́бушка]{.ru} 阴性。

    第 10 题：[вы]{.ru} 用复数 [бы́ли]{.ru}。

    第 11 题：[кни́га]{.ru} 阴性，[была́]{.ru}。

    第 12 题：男性主语，[жил]{.ru}。

    '
