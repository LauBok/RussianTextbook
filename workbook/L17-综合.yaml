heading: 综合练习　过去时
lessons:
- L16
- L17
groups:
- id: L17-综合-a
  lessons:
  - L16
  - L17
  tags:
  - 综合：主语 × 动词过去时
  recycles:
  - L16-01
  - L17-02
  task: 按主语写出三个动词的过去时。
  type: matrix
  cols:
  - 主语
  - '[быть]{.ru}'
  - '[жить]{.ru}'
  - '[писа́ть]{.ru}'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[был]{.ru}'
    - '[жил]{.ru}'
    - '[писа́л]{.ru}'
    hint: 男
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[была́]{.ru}'
    - '[жила́]{.ru}'
    - '[писа́ла]{.ru}'
    hint: 女
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[была́]{.ru}'
    - '[жила́]{.ru}'
    - '[писа́ла]{.ru}'
    hint: 女
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[бы́ли]{.ru}'
    - '[жи́ли]{.ru}'
    - '[писа́ли]{.ru}'
    hint: 尊称一人
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[бы́ли]{.ru}'
    - '[жи́ли]{.ru}'
    - '[писа́ли]{.ru}'
  - base: '[Ю́ми]{.ru}'
    cells:
    - '[Ю́ми]{.ru}'
    - '[была́]{.ru}'
    - '[жила́]{.ru}'
    - '[писа́ла]{.ru}'
  - base: '[Ван Лэй]{.ru}'
    cells:
    - '[Ван Лэй]{.ru}'
    - '[был]{.ru}'
    - '[жил]{.ru}'
    - '[писа́л]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[был]{.ru}'
    - '[жил]{.ru}'
    - '[писа́л]{.ru}'
  - base: '[ба́бушка]{.ru}'
    cells:
    - '[ба́бушка]{.ru}'
    - '[была́]{.ru}'
    - '[жила́]{.ru}'
    - '[писа́ла]{.ru}'
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[бы́ли]{.ru}'
    - '[жи́ли]{.ru}'
    - '[писа́ли]{.ru}'
  - base: '[Пьер и Ю́ми]{.ru}'
    cells:
    - '[Пьер и Ю́ми]{.ru}'
    - '[бы́ли]{.ru}'
    - '[жи́ли]{.ru}'
    - '[писа́ли]{.ru}'
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[был]{.ru}'
    - '[жил]{.ru}'
    - '[писа́л]{.ru}'
  why: |-
    第 1、7 题：阳性单数：[был, жил, писа́л]{.ru}。
    第 8 题：[Ми́ша]{.ru} 以 [-а]{.ru} 结尾，是男人，用阳性：[был, жил, писа́л]{.ru}。
    第 2、3、6、9 题：阴性单数：[была́, жила́]{.ru} 重音在词尾，[писа́ла]{.ru} 重音不动。
    第 5、10、11 题：复数（包括两个人）：[бы́ли, жи́ли, писа́ли]{.ru}，[бы́ли, жи́ли]{.ru} 重音回到词干。
    第 4 题：尊称一人的 [вы]{.ru} 也用复数：[бы́ли, жи́ли, писа́ли]{.ru}。
    第 12 题：[кто]{.ru} 作主语，过去时用阳性单数：[Кто был … ? Кто писа́л … ?]{.ru}
- id: L17-综合-b
  lessons:
  - L16
  - L17
  tags:
  - 综合：过去时主语性数配合核查
  recycles:
  - L16-02
  - L17-04
  task: 每句有一处错误，写出改正后的动词。
  type: matrix
  cols:
  - 有错的句子
  - 改正的动词
  given:
  - 0
  rows:
  - base: '[Ма́ма был до́ма.]{.ru}'
    cells:
    - '[Ма́ма был до́ма.]{.ru}'
    - '[была́]{.ru}'
  - base: '[Ми́ша чита́ла рома́н.]{.ru}'
    cells:
    - '[Ми́ша чита́ла рома́н.]{.ru}'
    - '[чита́л]{.ru}'
  - base: '[Мы был в теа́тре.]{.ru}'
    cells:
    - '[Мы был в теа́тре.]{.ru}'
    - '[бы́ли]{.ru}'
  - base: '[Письмо́ лежа́л на столе́.]{.ru}'
    cells:
    - '[Письмо́ лежа́л на столе́.]{.ru}'
    - '[лежа́ло]{.ru}'
  - base: '[Ю́ми жил в Япо́нии.]{.ru}'
    cells:
    - '[Ю́ми жил в Япо́нии.]{.ru}'
    - '[жила́]{.ru}'
  - base: '[Роди́тели гуля́л в па́рке.]{.ru}'
    cells:
    - '[Роди́тели гуля́л в па́рке.]{.ru}'
    - '[гуля́ли]{.ru}'
  - base: '[О́льга Ви́кторовна, вы была́ на конце́рте?]{.ru}'
    cells:
    - '[О́льга Ви́кторовна, вы была́ на конце́рте?]{.ru}'
    - '[бы́ли]{.ru}'
  - base: '[Вчера́ была́ воскресе́нье.]{.ru}'
    cells:
    - '[Вчера́ была́ воскресе́нье.]{.ru}'
    - '[бы́ло]{.ru}'
  - base: '[Э́то бы́ло о́пера.]{.ru}'
    cells:
    - '[Э́то бы́ло о́пера.]{.ru}'
    - '[была́]{.ru}'
  - base: '[Па́па и Ми́ша смотре́л футбо́л.]{.ru}'
    cells:
    - '[Па́па и Ми́ша смотре́л футбо́л.]{.ru}'
    - '[смотре́ли]{.ru}'
  - base: '[А́нна, где ты был?]{.ru}'
    cells:
    - '[А́нна, где ты был?]{.ru}'
    - '[была́]{.ru}'
  - base: '[В музе́е был интере́сно.]{.ru}'
    cells:
    - '[В музе́е был интере́сно.]{.ru}'
    - '[бы́ло]{.ru}'
  - base: '[Ба́бушка гото́вил обе́д.]{.ru}'
    cells:
    - '[Ба́бушка гото́вил обе́д.]{.ru}'
    - '[гото́вила]{.ru}'
  - base: '[Ван Лэй писа́ли письмо́.]{.ru}'
    cells:
    - '[Ван Лэй писа́ли письмо́.]{.ru}'
    - '[писа́л]{.ru}'
  - base: '[Фо́то лежа́ла на столе́.]{.ru}'
    cells:
    - '[Фо́то лежа́ла на столе́.]{.ru}'
    - '[лежа́ло]{.ru}'
  - base: '[Ты, Пьер, жила́ в Пари́же?]{.ru}'
    cells:
    - '[Ты, Пьер, жила́ в Пари́же?]{.ru}'
    - '[жил]{.ru}'
  why: |-
    第 1、5、13 题：阴性主语用 [-ла]{.ru}：[ма́ма была́, Ю́ми жила́, ба́бушка гото́вила]{.ru}。
    第 14 题：单个男性主语用 [-л]{.ru}：[Ван Лэй писа́л]{.ru}。
    第 2 题：[Ми́ша]{.ru} 是男人：[чита́л]{.ru}。
    第 4、8、15 题：中性主语用 [-ло]{.ru}：[письмо́ лежа́ло, фо́то лежа́ло]{.ru}，[воскресе́нье бы́ло]{.ru}。
    第 3、6、10 题：复数主语用 [-ли]{.ru}：[мы бы́ли, роди́тели гуля́ли, па́па и Ми́ша смотре́ли]{.ru}。
    第 7 题：[вы]{.ru} 尊称一人也用 [бы́ли]{.ru}。
    第 9 题：[э́то]{.ru} 句里 [быть]{.ru} 和后面的名词一致：[Э́то была́ о́пера]{.ru}。
    第 11、16 题：[ты]{.ru} 看对方的性别：对安娜说 [ты была́]{.ru}，对皮埃尔说 [ты жил]{.ru}。
    第 12 题：无主语句用中性：[бы́ло интере́сно]{.ru}。
- id: L17-综合-c
  lessons:
  - L16
  - L17
  tags:
  - 综合：过去时肯定与否定
  recycles:
  - L16-03
  - L17-04
  task: 用括号里动词的过去时填空（标出重音）。
  type: fill
  items:
  - stem: Вчера́ Ю́ми ___ в библиоте́ке.
    hint: не быть
    accept:
    - не была́
  - stem: Ван Лэй ___ до́ма.
    hint: не быть
    accept:
    - не́ был
  - stem: Ра́ньше мы ___ на да́че.
    hint: жить
    accept:
    - жи́ли
  - stem: Студе́нты ___ на экску́рсии.
    hint: не быть
    accept:
    - не́ были
  - stem: Ра́ньше А́нна ___ на да́че.
    hint: жить
    accept:
    - жила́
  - stem: В теа́тре ___ интере́сно.
    hint: не быть
    accept:
    - не́ было
  - stem: Ра́ньше Пьер ___ по-ру́сски.
    hint: не говори́ть
    accept:
    - не говори́л
  - stem: Вчера́ па́па ___ обе́д.
    hint: гото́вить
    accept:
    - гото́вил
  - stem: Ма́ма ___ на рабо́те.
    hint: не быть
    accept:
    - не была́
  - stem: Ра́ньше ба́бушка ___ в Пеки́не.
    hint: жить
    accept:
    - жила́
  - stem: Мы ___ в музе́е.
    hint: не быть
    accept:
    - не́ были
  - stem: Ми́ша ___ уро́ки.
    hint: не де́лать
    accept:
    - не де́лал
  why: |-
    第 2、4、6、11 题：[быть]{.ru} 的否定 [не́ был, не́ было, не́ были]{.ru} 重音移到 [не]{.ru} 上。
    第 1、9 题：阴性 [не была́]{.ru} 重音不移。
    第 7、12 题：一般动词的否定只在前面加 [не]{.ru}，重音不变：[не говори́л, не де́лал]{.ru}。
    第 3 题：复数 [жи́ли]{.ru}。
    第 5、10 题：阴性 [жила́]{.ru}、[спала́]{.ru} 重音在词尾。
    第 8 题：阳性 [гото́вил]{.ru}。
