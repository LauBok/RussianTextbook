    cells:
    - '[на́ша + но́вая + учи́тельница]{.ru}'
    - '[на́шей но́вой учи́тельницей]{.ru}'
  - base: '[э́тот + молодо́й + врач]{.ru}'
    cells:
    - '[э́тот + молодо́й + врач]{.ru}'
    - '[э́тим молоды́м врачо́м]{.ru}'
  - base: '[гла́вный + инжене́р]{.ru}'
    cells:
    - '[гла́вный + инжене́р]{.ru}'
    - '[гла́вным инжене́ром]{.ru}'
  - base: '[твоя́ + мла́дшая + сестра́]{.ru}'
    cells:
    - '[твоя́ + мла́дшая + сестра́]{.ru}'
    - '[твое́й мла́дшей сестро́й]{.ru}'
  - base: '[ру́сская + литерату́ра]{.ru}'
