  - base: '[кита́йский + язы́к]{.ru}'
    cells:
    - '[кита́йский + язы́к]{.ru}'
    - '[кита́йским языко́м]{.ru}'
  - base: '[вишнёвое + варе́нье]{.ru}'
    cells:
    - '[вишнёвое + варе́нье]{.ru}'
    - '[вишнёвым варе́ньем]{.ru}'
  - base: '[горя́чее + молоко́]{.ru}'
    cells:
    - '[горя́чее + молоко́]{.ru}'
    - '[горя́чим молоко́м]{.ru}'
  - base: '[ваш + стро́гий + профе́ссор]{.ru}'
    cells:
    - '[ваш + стро́гий + профе́ссор]{.ru}'
    - '[ва́шим стро́гим профе́ссором]{.ru}'
  - base: '[э́та + больша́я + соба́ка]{.ru}'
    cells:
    - '[э́та + больша́я + соба́ка]{.ru}'
    - '[э́той большо́й соба́кой]{.ru}'
  - base: '[их + ма́ленькая + дочь]{.ru}'
    cells:
    - '[их + ма́ленькая + дочь]{.ru}'
    - '[их ма́ленькой до́черью]{.ru}'
  - base: '[на́ша + после́дняя + ле́кция]{.ru}'
    cells:
    - '[на́ша + после́дняя + ле́кция]{.ru}'
    - '[на́шей после́дней ле́кцией]{.ru}'
  - base: '[его́ + хоро́ший + това́рищ]{.ru}'
    cells:
    - '[его́ + хоро́ший + това́рищ]{.ru}'
    - '[его́ хоро́шим това́рищем]{.ru}'
    new: true
    gloss: 同伴，同学
  - base: '[чья + ста́рая + тетра́дь]{.ru}'
    cells:
    - '[чья + ста́рая + тетра́дь]{.ru}'
    - '[чьей ста́рой тетра́дью]{.ru}'
  why: |
    第 1–16 题：修饰语跟名词的性一致，三个词一起变：阳性、中性修饰语用 [-им / -ым]{.ru}，阴性用 [-ой / -ей]{.ru}；名词按自己的类型变。
    第 4 题：[молодо́й]{.ru} 阳性第五格 [молоды́м]{.ru}；[врач]{.ru} 写 [врачо́м]{.ru}。
    第 8 题：[язы́к]{.ru} 重音移到词尾：[языко́м]{.ru}。
    第 10 题：[горя́чее]{.ru} 中性，[ч]{.ru} 后写 [-им]{.ru}：[горя́чим молоко́м]{.ru}。
    第 12 题：[больша́я]{.ru} 阴性第五格 [большо́й]{.ru}，与阳性第一格同形。
    第 13、16 题：阴性 [-ь]{.ru} 名词写 [-ью]{.ru}：[до́черью, тетра́дью]{.ru}；[их]{.ru} 不变。
    第 14 题：[после́дняя]{.ru} 软变化写 [после́дней]{.ru}，[ле́кция]{.ru} 写 [ле́кцией]{.ru}。
    第 15 题：[его́]{.ru} 不变；[хоро́шим]{.ru}；[щ]{.ru} 后不重读写 [-ем]{.ru}：[това́рищем]{.ru}。
- id: L65-05
  tags:
  - 修饰语与名词第五格配合：с 后三词词组核查
  task: 判断 [с]{.ru} 后的词组是否正确。
  type: classify
  bins:
  - '[да]{.ru}（正确）'
  - '[нет]{.ru}（有错）'
  items:
  - text: '[с на́шей но́вой учи́тельницей]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с мои́м ста́рой подру́гой]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с э́тим молоды́м врачо́м]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с ва́шим ста́ршем бра́том]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с твое́й мла́дшей сестро́й]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с хоро́шой подру́гой]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с кита́йскым студе́нтом]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с большо́й соба́кой]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с больши́м соба́кой]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с их ма́ленькой до́черью]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с его́ ста́ршим бра́том]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с ним ста́ршим бра́том]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с си́ним каранда́шом]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с э́той интере́сной кни́гой]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с ру́сским дру́гом]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с на́шим стро́гим профе́ссорем]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[с горя́чим ча́ем]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[с э́той ру́сской студе́нткой]{.ru}'
    answer: '[да]{.ru}（正确）'
  why: |
    第 1、3、5、8、10、11、14、15、17、18 题：修饰语和名词的性一致，词尾正确。第 8 题 [большо́й]{.ru} 是阴性第五格，和阳性第一格同形。
    第 2 题：[подру́га]{.ru} 是阴性，物主代词要用 [мое́й]{.ru}：[с мое́й ста́рой подру́гой]{.ru}。
    第 4 题：形容词阳性第五格是 [-им]{.ru}：[ста́ршим]{.ru}，不是 [-ем]{.ru}。
    第 6 题：[ш]{.ru} 后不重读写 [е]{.ru}：[с хоро́шей подру́гой]{.ru}。
    第 7 题：[к]{.ru} 后不写 [ы]{.ru}：[кита́йским]{.ru}。
    第 9 题：[соба́ка]{.ru} 是阴性，应该是 [с большо́й соба́кой]{.ru}。
    第 12 题：“和他的哥哥”用不变的物主代词 [его́]{.ru}：[с его́ ста́ршим бра́том]{.ru}；[с ним]{.ru} 是“和他”。
    第 13 题：[ш]{.ru} 后重读写 [о]{.ru}：[карандашо́м]{.ru}。
    第 16 题：硬辅音结尾的阳性名词加 [-ом]{.ru}：[профе́ссором]{.ru}。
- id: L65-06
  tags:
  - 修饰语与名词第五格配合：句中填空
  task: 把括号里的词组变成第五格填空。
  type: fill
  items:
  - stem: Мой оте́ц рабо́тает ___.
    hint: гла́вный инжене́р
    accept:
    - гла́вным инжене́ром
  - stem: А́нна интересу́ется ___.
    hint: ру́сская литерату́ра
    accept:
    - ру́сской литерату́рой
  - stem: Ма́ма угоща́ет го́стя ___.
    hint: вишнёвое варе́нье
    accept:
    - вишнёвым варе́ньем
  - stem: Пьер занима́ется ___.
    hint: ру́сский язы́к
    accept:
    - ру́сским языко́м
  - stem: Я познако́мился с ___.
    hint: ваш ста́рший брат
    accept:
    - ва́шим ста́ршим бра́том
  - stem: Он был ___.
    hint: стро́гий профе́ссор
    accept:
    - стро́гим профе́ссором
  - stem: Вчера́ я говори́л с ___.
    hint: на́ша но́вая учи́тельница
    accept:
    - на́шей но́вой учи́тельницей
  - stem: Ка́тя хо́чет стать ___.
    hint: хоро́шая арти́стка
    accept:
    - хоро́шей арти́сткой
  - stem: Ми́ша интересу́ется ___.
    hint: кита́йская исто́рия
    accept:
    - кита́йской исто́рией
  - stem: Мы гуля́ли с ___.
    hint: их ма́ленький сын
    accept:
    - их ма́леньким сы́ном
  - stem: Я пью ко́фе с ___.
    hint: горя́чее молоко́
    accept:
    - горя́чим молоко́м
  - stem: С ___ ты говори́л?
    hint: чей ста́рший брат
    accept:
    - чьим ста́ршим бра́том
  why: |
    第 1、6 题：[рабо́тать, быть]{.ru} 后的职业用第五格：[гла́вным инжене́ром, стро́гим профе́ссором]{.ru}。
    第 2、9 题：[интересова́ться]{.ru} 接第五格；阴性 [-ой]{.ru}，[-ия]{.ru} 名词写 [-ией]{.ru}：[кита́йской исто́рией]{.ru}。
    第 3 题：[угоща́ть]{.ru} 用第五格表示请吃的东西：[вишнёвым варе́ньем]{.ru}。
    第 4 题：[занима́ться]{.ru} 接第五格，[язы́к]{.ru} 重音移到词尾：[ру́сским языко́м]{.ru}。
    第 5、7、10 题：[с]{.ru} 后三词一起变：[ва́шим ста́ршим бра́том, на́шей но́вой учи́тельницей]{.ru}；[их]{.ru} 不变。
    第 8 题：[стать]{.ru} 接第五格，[ш]{.ru} 后不重读写 [-ей]{.ru}：[хоро́шей арти́сткой]{.ru}。
    第 11 题：[горя́чее]{.ru} 中性，[ч]{.ru} 后写 [-им]{.ru}。
    第 12 题：[чей]{.ru} 第五格 [чьим]{.ru}：[С чьим ста́ршим бра́том]{.ru}。
