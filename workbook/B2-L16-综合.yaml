    第 1–5 题：[друзья́]{.ru}：第二、四格 [друзе́й]{.ru}（动物），其余格 [друзья́м, друзья́ми, о друзья́х]{.ru}；[мои́х ста́рых]{.ru} 跟着名词变。
    第 6–10 题：[де́ти]{.ru}：[дете́й, де́тям, детьми́, о де́тях]{.ru}；[ма́леньких]{.ru} 写 [и]{.ru}。
    第 11–15 题：[сту́лья]{.ru} 是非动物名词，第四格同第一格：[э́ти но́вые сту́лья]{.ru}；第二格 [сту́льев]{.ru}；[об э́тих]{.ru}。
    第 16–20 题：[бра́тья]{.ru}：第二、四格 [бра́тьев]{.ru}；[ста́рший]{.ru} 在 [ш]{.ru} 后写 [и]{.ru}：[ста́рших, ста́ршими]{.ru}。
    第 21–25 题：[сёстры]{.ru}：第二、四格 [сестёр]{.ru}，其余格 [сёстрам, сёстрами, сёстрах]{.ru}。
    第 26–30 题：[те]{.ru}：[тех, тем, те́ми]{.ru}；[пожило́й]{.ru} 重音在词尾；[сосе́ди]{.ru} 软变化。
