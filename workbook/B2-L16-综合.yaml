  why: |-
    第 1、9、13 题：代词和名词同格：[с мои́ми друзья́ми]{.ru}（第五格），[об э́тих фи́льмах, о на́ших сыновья́х]{.ru}（第六格）。
    第 2 题：形容词复数第六格同第二格 [-их]{.ru}：[о хоро́ших лю́дях]{.ru}，不是第三格 [-им]{.ru}。
    第 3、11、15 题：动物名词复数第四格同第二格，修饰语也用第二格：[но́вых сосе́дей, свои́х ста́рых колле́г]{.ru}。
    第 4、8 题：[де́ти, лю́ди]{.ru}：第五格 [детьми́]{.ru}；[челове́к]{.ru} 的复数是 [лю́ди]{.ru}：[пожилы́м лю́дям]{.ru}。
    第 5 题：[мно́го]{.ru} 后用第二格：[друзе́й]{.ru}。
    第 6 题：非动物名词第四格同第一格：[но́вые сту́лья]{.ru}。
    第 7 题：[брат]{.ru} 的复数第二格是 [бра́тьев]{.ru}。
    第 10 题：[горди́ться]{.ru} 要求第五格：[сёстрами]{.ru}。
    第 14 题：[сту́лья]{.ru} 第二格 [сту́льев]{.ru}，重音在词干。
    第 12 题：[с]{.ru} 后不写 [ы]{.ru}：[ру́сскими]{.ru}。
