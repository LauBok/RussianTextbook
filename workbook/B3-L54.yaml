heading: 第 54 课　前置词 по 的三种支配
groups:
- id: B3-L54-01
  lessons:
  - B3-L54
  tags:
  - 前置词 по + 第三格
  - 前置词 по + 第六格
  - 前置词 по + 第四格
  task: 按中文意思用 [по]{.ru} 和括号里的词组成词组。
  type: matrix
  cols:
  - 意义 + 名词
  - '[по]{.ru} 词组'
  given:
  - 0
  rows:
  - base: 每逢 + [суббо́ты]{.ru}
    cells:
    - 每逢 + [суббо́ты]{.ru}
    - '[по суббо́там]{.ru}'
  - base: 每逢 + [вечера́]{.ru}
    cells:
    - 每逢 + [вечера́]{.ru}
    - '[по вечера́м]{.ru}'
  - base: 在城里到处 + [го́род]{.ru}
    cells:
    - 在城里到处 + [го́род]{.ru}
    - '[по го́роду]{.ru}'
  - base: 沿着 + [у́лицы]{.ru}
    cells:
    - 沿着 + [у́лицы]{.ru}
    - '[по у́лицам]{.ru}'
  - base: 打在部位 + [лицо́]{.ru}
    cells:
    - 打在部位 + [лицо́]{.ru}
    - '[по лицу́]{.ru}'
  - base: 通过 + [телефо́н]{.ru}
    cells:
    - 通过 + [телефо́н]{.ru}
    - '[по телефо́ну]{.ru}'
  - base: 按照 + [про́сьба]{.ru}
    cells:
    - 按照 + [про́сьба]{.ru}
    - '[по про́сьбе]{.ru}'
  - base: ……学科的 + [исто́рия]{.ru}
    cells:
    - ……学科的 + [исто́рия]{.ru}
    - '[по исто́рии]{.ru}'
  - base: 无意的原因 + [оши́бка]{.ru}
    cells:
    - 无意的原因 + [оши́бка]{.ru}
    - '[по оши́бке]{.ru}'
  - base: 每人一本 + [одна́ кни́га]{.ru}
    cells:
    - 每人一本 + [одна́ кни́га]{.ru}
    - '[по одно́й кни́ге]{.ru}'
  - base: 想念 + [дочь]{.ru}
    cells:
    - 想念 + [дочь]{.ru}
    - '[по до́чери]{.ru}'
  - base: 到达以后 + [прие́зд]{.ru}
    cells:
    - 到达以后 + [прие́зд]{.ru}
    - '[по прие́зде]{.ru}'
  - base: 回来以后 + [возвраще́ние]{.ru}
    cells:
    - 回来以后 + [возвраще́ние]{.ru}
    - '[по возвраще́нии]{.ru}'
  - base: 结束以后 + [оконча́ние]{.ru}
    cells:
    - 结束以后 + [оконча́ние]{.ru}
    - '[по оконча́нии]{.ru}'
  - base: 每人两卢布 + [два рубля́]{.ru}
    cells:
    - 每人两卢布 + [два рубля́]{.ru}
    - '[по два рубля́]{.ru}'
  - base: 每人三本 + [три кни́ги]{.ru}
    cells:
    - 每人三本 + [три кни́ги]{.ru}
    - '[по три кни́ги]{.ru}'
  - base: 深及膝盖 + [коле́но]{.ru}
    cells:
    - 深及膝盖 + [коле́но]{.ru}
    - '[по коле́но]{.ru}'
  - base: 齐腰 + [по́яс]{.ru}
    cells:
    - 齐腰 + [по́яс]{.ru}
    - '[по по́яс]{.ru}'
  why: |-
    第 1、2 题：“每逢”用 [по]{.ru} + 复数第三格：[по суббо́там, по вечера́м]{.ru}。
    第 3–9 题：表面、沿着、部位、途径、按照、学科、无意的原因都用 [по]{.ru} + 第三格：[по го́роду, по у́лицам, по лицу́, по телефо́ну, по про́сьбе, по исто́рии, по оши́бке]{.ru}。
    第 10 题：“每人一个”与 [оди́н]{.ru} 连用，也是第三格：[по одно́й кни́ге]{.ru}。
    第 11 题：[скуча́ть по]{.ru} + 第三格：[по до́чери]{.ru}。
    第 12–14 题：表示“……以后”，[по]{.ru} 与少数动名词连用，用第六格：[по прие́зде]{.ru}（不写 [по прие́зду]{.ru}），[по возвраще́нии, по оконча́нии]{.ru}（词尾 [-ии]{.ru}）。
    第 15、16 题：与 [два, три, четы́ре]{.ru} 连用表示“每人各……”，用第四格：[по два рубля́, по три кни́ги]{.ru}；比较第 10 题的 [по одно́й кни́ге]{.ru}。
    第 17、18 题：表示“直到”，用第四格：[по коле́но, по по́яс]{.ru}。
- id: B3-L54-02
  lessons:
  - B3-L54
  tags:
  - 前置词 по + 第六格与 после + 第二格
  task: 写出两种“……以后”的说法。
  type: matrix
  cols:
  - 名词
  - '[по]{.ru} + 第六格'
  - '[по́сле]{.ru} + 第二格'
  given:
  - 0
  rows:
  - base: '[прие́зд]{.ru}'
    cells:
    - '[прие́зд]{.ru}'
    - '[по прие́зде]{.ru}'
    - '[по́сле прие́зда]{.ru}'
  - base: '[прибы́тие]{.ru}'
    cells:
    - '[прибы́тие]{.ru}'
    - '[по прибы́тии]{.ru}'
    - '[по́сле прибы́тия]{.ru}'
  - base: '[возвраще́ние]{.ru}'
    cells:
    - '[возвраще́ние]{.ru}'
    - '[по возвраще́нии]{.ru}'
    - '[по́сле возвраще́ния]{.ru}'
  - base: '[оконча́ние та́нца]{.ru}'
    cells:
    - '[оконча́ние та́нца]{.ru}'
    - '[по оконча́нии та́нца]{.ru}'
    - '[по́сле оконча́ния та́нца]{.ru}'
  - base: '[оконча́ние университе́та]{.ru}'
    cells:
    - '[оконча́ние университе́та]{.ru}'
    - '[по оконча́нии университе́та]{.ru}'
    - '[по́сле оконча́ния университе́та]{.ru}'
  - base: '[прилёт]{.ru}'
    cells:
    - '[прилёт]{.ru}'
    - '[по прилёте]{.ru}'
    - '[по́сле прилёта]{.ru}'
    new: true
    gloss: （飞机）到达
  why: |-
    第 1、6 题：辅音结尾的阳性名词第六格 [-е]{.ru}：[по прие́зде, по прилёте]{.ru}；不能写成第三格 [по прие́зду]{.ru}。[по́сле]{.ru} 后用第二格：[по́сле прие́зда]{.ru}。
    第 2、3 题：[-ие]{.ru} 名词第六格 [-ии]{.ru}：[по прибы́тии, по возвраще́нии]{.ru}；第二格 [-ия]{.ru}：[по́сле возвраще́ния]{.ru}。
    第 4、5 题：[по]{.ru} 只管 [оконча́ние]{.ru}，后面的名词照样用第二格：[по оконча́нии та́нца, по́сле оконча́ния университе́та]{.ru}。
- id: B3-L54-03
  lessons:
  - B3-L54
  tags:
  - скучать по + 名词与代词
  task: 用 [скуча́ть по]{.ru} 和括号里的词组成词组。
  type: matrix
  cols:
  - 名词或代词
  - 词组
  given:
  - 0
  rows:
  - base: '[дочь]{.ru}'
    cells:
    - '[дочь]{.ru}'
    - '[скуча́ть по до́чери]{.ru}'
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[скуча́ть по до́му]{.ru}'
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[скуча́ть по роди́телям]{.ru}'
  - base: '[ро́дина]{.ru}'
    cells:
    - '[ро́дина]{.ru}'
    - '[скуча́ть по ро́дине]{.ru}'
  - base: '[друзья́]{.ru}'
    cells:
    - '[друзья́]{.ru}'
    - '[скуча́ть по друзья́м]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[скуча́ть по нас / по нам]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[скуча́ть по вас / по вам]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[скуча́ть по нему́]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[скуча́ть по ней]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[скуча́ть по ним]{.ru}'
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[скуча́ть по мне]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[скуча́ть по тебе́]{.ru}'
  why: |-
    第 1–5 题：[скуча́ть по]{.ru} 接名词用第三格：[по до́чери, по до́му, по роди́телям, по ро́дине, по друзья́м]{.ru}。
    第 6、7 题：接 [мы, вы]{.ru} 时，传统规范用第六格 [по нас, по вас]{.ru}；当代口语里也常说 [по нам, по вам]{.ru}。两种都对。
    第 8–10 题：接 [он, она́, они́]{.ru} 用第三格，前置词后加 [н]{.ru}-：[по нему́, по ней, по ним]{.ru}。
    第 11、12 题：[я, ты]{.ru} 用第三格：[по мне, по тебе́]{.ru}。
- id: B3-L54-04
  lessons:
  - B3-L54
  tags:
  - 前置词 по 的意义
  task: 按 [по]{.ru} 在词组里的意义归栏。
  type: classify
  bins:
  - 沿着；在表面
  - 途径
  - 按照
  - 每逢
  - ……以后
  - 每人各
  items:
  - text: '[гуля́ть по на́бережной]{.ru}'
    answer: 沿着；在表面
  - text: '[узна́ть по ра́дио]{.ru}'
    answer: 途径
  - text: '[по сове́ту врача́]{.ru}'
    answer: 按照
  - text: '[по воскресе́ньям]{.ru}'
    answer: 每逢
  - text: '[по прие́зде в Москву́]{.ru}'
    answer: ……以后
  - text: '[да́ли всем по я́блоку]{.ru}'
    answer: 每人各
  - text: '[е́хать по шоссе́]{.ru}'
    answer: 沿着；在表面
  - text: '[говори́ть по телефо́ну]{.ru}'
    answer: 途径
  - text: '[по расписа́нию]{.ru}'
    answer: 按照
  - text: '[по утра́м]{.ru}'
    answer: 每逢
  - text: '[по возвраще́нии домо́й]{.ru}'
    answer: ……以后
  - text: '[получи́ли по два рубля́]{.ru}'
    answer: 每人各
  - text: '[ходи́ть по ко́мнате]{.ru}'
    answer: 沿着；在表面
  - text: '[посла́ть по по́чте]{.ru}'
    answer: 途径
  - text: '[по про́сьбе хозя́йки]{.ru}'
    answer: 按照
  - text: '[по пра́здникам]{.ru}'
    answer: 每逢
  - text: '[по оконча́нии ле́кции]{.ru}'
    answer: ……以后
  - text: '[взя́ли по одно́й кни́ге]{.ru}'
    answer: 每人各
  why: |-
    第 1、7、13 题：[по]{.ru} + 第三格表示在表面移动、沿着：[по на́бережной, по шоссе́, по ко́мнате]{.ru}。
    第 2、8、14 题：[по]{.ru} + 第三格表示途径、手段：[по ра́дио, по телефо́ну, по по́чте]{.ru}。
    第 3、9、15 题：[по]{.ru} + 第三格表示按照、根据：[по сове́ту, по расписа́нию, по про́сьбе]{.ru}。
    第 4、10、16 题：[по]{.ru} + 复数第三格表示“每逢”：[по воскресе́ньям, по утра́м, по пра́здникам]{.ru}。
    第 5、11、17 题：[по]{.ru} + 第六格表示“……以后”：[по прие́зде, по возвраще́нии, по оконча́нии]{.ru}。
    第 6、12、18 题：表示“每人各……”：与 [оди́н]{.ru} 或不带数词的名词连用用第三格（[по я́блоку, по одно́й кни́ге]{.ru}），与 [два]{.ru} 连用用第四格（[по два рубля́]{.ru}）。
