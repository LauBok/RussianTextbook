heading: 第 15 课　语言的说法
groups:
- id: L15-01
  tags:
  - 语言表达：语言名称与语言副词对应
  task: 写出语言名称和“用……语”的副词。
  type: matrix
  cols:
  - 形容词
  - 语言名称
  - 副词
  given:
  - 0
  rows:
  - base: '[ру́сский]{.ru}'
    cells:
    - '[ру́сский]{.ru}'
    - '[ру́сский язы́к]{.ru}'
    - '[по-ру́сски]{.ru}'
  - base: '[кита́йский]{.ru}'
    cells:
    - '[кита́йский]{.ru}'
    - '[кита́йский язы́к]{.ru}'
    - '[по-кита́йски]{.ru}'
  - base: '[францу́зский]{.ru}'
    cells:
    - '[францу́зский]{.ru}'
    - '[францу́зский язы́к]{.ru}'
    - '[по-францу́зски]{.ru}'
  - base: '[каза́хский]{.ru}'
    cells:
    - '[каза́хский]{.ru}'
    - '[каза́хский язы́к]{.ru}'
    - '[по-каза́хски]{.ru}'
    new: true
    gloss: 哈萨克的
  - base: '[неме́цкий]{.ru}'
    cells:
    - '[неме́цкий]{.ru}'
    - '[неме́цкий язы́к]{.ru}'
    - '[по-неме́цки]{.ru}'
    new: true
    gloss: 德国的
  - base: '[испа́нский]{.ru}'
    cells:
    - '[испа́нский]{.ru}'
    - '[испа́нский язы́к]{.ru}'
    - '[по-испа́нски]{.ru}'
    new: true
    gloss: 西班牙的
  - base: '[италья́нский]{.ru}'
    cells:
    - '[италья́нский]{.ru}'
    - '[италья́нский язы́к]{.ru}'
    - '[по-италья́нски]{.ru}'
    new: true
    gloss: 意大利的
  - base: '[коре́йский]{.ru}'
    cells:
    - '[коре́йский]{.ru}'
    - '[коре́йский язы́к]{.ru}'
    - '[по-коре́йски]{.ru}'
    new: true
    gloss: 韩国的，朝鲜的
  - base: '[ара́бский]{.ru}'
    cells:
    - '[ара́бский]{.ru}'
    - '[ара́бский язы́к]{.ru}'
    - '[по-ара́бски]{.ru}'
    new: true
    gloss: 阿拉伯的
  - base: '[вьетна́мский]{.ru}'
    cells:
    - '[вьетна́мский]{.ru}'
    - '[вьетна́мский язы́к]{.ru}'
    - '[по-вьетна́мски]{.ru}'
    new: true
    gloss: 越南的
  why: |-
    第 1–4、6–10 题：语言名称是形容词加 [язы́к]{.ru}：[ру́сский язы́к, испа́нский язы́к]{.ru}；副词是形容词去掉 [-ий]{.ru}，前面加 [по-]{.ru}，后面加 [-и]{.ru}：[по-ру́сски, по-испа́нски, по-вьетна́мски]{.ru}。连字符不能丢，词尾不能写成 [-ий]{.ru}，首字母小写。
    第 5 题：[неме́цкий]{.ru} 去掉 [-ий]{.ru} 是 [неме́цк-]{.ru}，副词 [по-неме́цки]{.ru}。
- id: L15-02
  tags:
  - 语言表达：按动词选语言名称或副词
  task: 用括号里的形容词填空。
  type: fill
  items:
  - stem: Я говорю́ ___.
    hint: ру́сский
    accept:
    - по-ру́сски
  - stem: Ми́ша изуча́ет ___.
    hint: англи́йский
    accept:
    - англи́йский язы́к
  - stem: Ю́ми хорошо́ зна́ет ___.
    hint: кита́йский
    accept:
    - кита́йский язы́к
  - stem: Пьер пи́шет ___.
    hint: францу́зский
    accept:
    - по-францу́зски
  - stem: Ты понима́ешь ___?
    hint: япо́нский
    accept:
    - по-япо́нски
    - япо́нский язы́к
  - stem: Мы чита́ем ___.
    hint: ру́сский
    accept:
    - по-ру́сски
  - stem: Вы зна́ете ___?
    hint: неме́цкий
    accept:
    - неме́цкий язы́к
  - stem: Они́ говоря́т ___.
    hint: испа́нский
    accept:
    - по-испа́нски
  - stem: А́нна изуча́ет ___.
    hint: италья́нский
    accept:
    - италья́нский язы́к
  - stem: Ван Лэй хорошо́ говори́т ___.
    hint: кита́йский
    accept:
    - по-кита́йски
  - stem: Я пло́хо понима́ю ___.
    hint: францу́зский
    accept:
    - по-францу́зски
    - францу́зский язы́к
  - stem: Мно́гие зна́ют ___.
    hint: англи́йский
    accept:
    - англи́йский язы́к
  - stem: Ты пи́шешь ___?
    hint: ру́сский
    accept:
    - по-ру́сски
  - stem: Как он говори́т ___?
    hint: каза́хский
    accept:
    - по-каза́хски
  - stem: Студе́нты изуча́ют ___.
    hint: коре́йский
    accept:
    - коре́йский язы́к
  - stem: Моя́ подру́га чита́ет ___.
    hint: ара́бский
    accept:
    - по-ара́бски
  why: |-
    第 1、4、6、8、10、13、14、16 题：[говори́ть, чита́ть, писа́ть]{.ru} 说的是用什么语言做，用副词：[говорю́ по-ру́сски, пи́шет по-францу́зски, чита́ет по-ара́бски]{.ru}。
    第 2、3、7、9、12、15 题：[знать, изуча́ть]{.ru} 后面要一个事物，用语言名称：[изуча́ет англи́йский язы́к, зна́ет кита́йский язы́к]{.ru}。
    第 5、11 题：[понима́ть]{.ru} 两种都可以：[понима́ешь по-япо́нски]{.ru} 或 [понима́ешь япо́нский язы́к]{.ru}。
- id: L15-03
  tags:
  - 语言表达：形式核查
  task: 每句有一处错误，写出改正后的说法。
  type: matrix
  cols:
  - 有错的句子
  - 改正的说法
  given:
  - 0
  rows:
  - base: '[Я говорю́ ру́сский язы́к.]{.ru}'
    cells:
    - '[Я говорю́ ру́сский язы́к.]{.ru}'
    - '[по-ру́сски]{.ru}'
  - base: '[Ми́ша зна́ет по-англи́йски.]{.ru}'
    cells:
    - '[Ми́ша зна́ет по-англи́йски.]{.ru}'
    - '[англи́йский язы́к]{.ru}'
  - base: '[Он изуча́ет по-кита́йски.]{.ru}'
    cells:
    - '[Он изуча́ет по-кита́йски.]{.ru}'
    - '[кита́йский язы́к]{.ru}'
  - base: '[Ю́ми говори́т по-ру́сский.]{.ru}'
    cells:
    - '[Ю́ми говори́т по-ру́сский.]{.ru}'
    - '[по-ру́сски]{.ru}'
  - base: '[Пьер пи́шет по францу́зски.]{.ru}'
    cells:
    - '[Пьер пи́шет по францу́зски.]{.ru}'
    - '[по-францу́зски]{.ru}'
  - base: '[Я изуча́ю Ру́сский язы́к.]{.ru}'
    cells:
    - '[Я изуча́ю Ру́сский язы́к.]{.ru}'
    - '[ру́сский язы́к]{.ru}'
  - base: '[Мы чита́ем япо́нский язы́к.]{.ru}'
    cells:
    - '[Мы чита́ем япо́нский язы́к.]{.ru}'
    - '[по-япо́нски]{.ru}'
  - base: '[Вы говори́те по-кита́йский?]{.ru}'
    cells:
    - '[Вы говори́те по-кита́йский?]{.ru}'
    - '[по-кита́йски]{.ru}'
  - base: '[Она́ зна́ет по-неме́цки.]{.ru}'
    cells:
    - '[Она́ зна́ет по-неме́цки.]{.ru}'
    - '[неме́цкий язы́к]{.ru}'
  - base: '[Они́ пи́шут англи́йский язы́к.]{.ru}'
    cells:
    - '[Они́ пи́шут англи́йский язы́к.]{.ru}'
    - '[по-англи́йски]{.ru}'
  - base: '[Ван Лэй изуча́ет по-ру́сски.]{.ru}'
    cells:
    - '[Ван Лэй изуча́ет по-ру́сски.]{.ru}'
    - '[ру́сский язы́к]{.ru}'
  - base: '[Ты говори́шь по-Англи́йски?]{.ru}'
    cells:
    - '[Ты говори́шь по-Англи́йски?]{.ru}'
    - '[по-англи́йски]{.ru}'
  why: |-
    第 1、7、10 题：[говори́ть, чита́ть, писа́ть]{.ru} 后用副词：[по-ру́сски, по-япо́нски, по-англи́йски]{.ru}。
    第 2、3、9、11 题：[знать, изуча́ть]{.ru} 后用语言名称：[англи́йский язы́к, кита́йский язы́к, неме́цкий язы́к, ру́сский язы́к]{.ru}。
    第 4、5、8 题：副词的写法：[по-]{.ru} 后有连字符，词尾是 [-и]{.ru}：[по-ру́сски, по-францу́зски, по-кита́йски]{.ru}。
    第 6、12 题：表示语言、民族的形容词和副词首字母小写：[ру́сский язы́к, по-англи́йски]{.ru}。
