  why: '第 1、3 题：[кто́-то, кто́-нибудь]{.ru} 前一部分按 [кто]{.ru} 变（[кого́, кому́, с кем, о ком]{.ru}），[-то, -нибудь]{.ru} 不变，连字符保留：[кого́-то, с ке́м-нибудь]{.ru}。

    第 2、4 题：[что́-то, что́-нибудь]{.ru} 按 [что]{.ru} 变：[чего́-то, чему́-нибудь, с че́м-то, о чём-нибудь]{.ru}。

    第 5、6 题：[ко́е-]{.ru} 和前置词连用时，前置词放在中间，分开写，不加连字符：[ко́е с кем, ко́е о чём]{.ru}；没有前置词时照常变后一部分：[ко́е-кого́, ко́е-чему́]{.ru}。

    第 7–12 题：[како́й-то, како́й-нибудь]{.ru} 按形容词 [како́й]{.ru} 变，性、数随名词：阴性各间接格都是 [како́й-]{.ru}，复数 [каки́х-, каки́м-, каки́ми-]{.ru}。'
- id: B2-L59-02
  tags:
  - 不定代词：-то / -нибудь / ко́е- 的意义
  task: 译成俄语时用哪一种不定代词？按意义归栏。
  type: classify
  bins:
  - '[-то]{.ru}'
  - '[-нибудь]{.ru}'
  - '[ко́е-]{.ru}'
  items:
  - text: 有人敲门了（不知道是谁）。
    answer: '[-то]{.ru}'
  - text: 有人给我打过电话吗？
    answer: '[-нибудь]{.ru}'
  - text: 随便讲点什么吧！
    answer: '[-нибудь]{.ru}'
  - text: 我给你带了点东西，先不告诉你是什么。
    answer: '[ко́е-]{.ru}'
  - text: 安娜不知去哪儿了。
    answer: '[-то]{.ru}'
  - text: 总有一天我会去贝加尔湖。
    answer: '[-нибудь]{.ru}'
  - text: 晚上他总是随便读点什么。
    answer: '[-нибудь]{.ru}'
  - text: 桌上放着一本不知什么书。
    answer: '[-то]{.ru}'
  - text: 有几个人我已经谈过了，先不说是谁。
    answer: '[ко́е-]{.ru}'
  - text: 你暑假去过什么地方吗？
    answer: '[-нибудь]{.ru}'
  - text: 从前这里有一家书店。
    answer: '[-то]{.ru}'
  - text: 我好像在哪儿见过他。
    answer: '[-то]{.ru}'
  - text: 假期咱们随便去哪儿玩玩吧！
    answer: '[-нибудь]{.ru}'
  - text: 米沙在跟谁打电话（听不出是谁）。
    answer: '[-то]{.ru}'
  - text: 有件事我得跟你说说。（我心里有数，先卖个关子）
    answer: '[ко́е-]{.ru}'
  - text: 明天随便谁来帮帮我吧。
    answer: '[-нибудь]{.ru}'
  - text: 有些同学还没交作业，我就不点名了。
    answer: '[ко́е-]{.ru}'
  why: '第 1、5、8、11、12、14 题：确有其人其事，只是说话人不知道或说不清：事情已经发生或正在发生，多在陈述句里：[Кто́-то стучи́т.]{.ru} [Она́ куда́-то ушла́.]{.ru} [Здесь когда́-то была́…]{.ru} [Я где́-то его́ ви́дел.]{.ru}

    第 2、3、6、7、10、13、16 题：有没有、是哪一个还不确定：疑问句（[Кто́-нибудь звони́л?]{.ru} [Ты где́-нибудь был?]{.ru}）、命令和提议（[Расскажи́ что́-нибудь!]{.ru}）、将来（[когда́-нибудь]{.ru}）、经常反复（[всегда́ что́-нибудь чита́ет]{.ru}）。

    第 4、9、15、17 题：说话人知道是谁、是什么，只是暂时不说：[ко́е-что, ко́е-кто, ко́е с кем]{.ru}。'
- id: B2-L59-03
  tags:
  - 不定代词：句中的格
  task: 把括号里的不定代词变成适当的形式填空（句中）。
  type: fill
  items:
  - stem: Ди́ма разгова́ривал в коридо́ре с ___.
    hint: кто́-то
    accept:
    - ке́м-то
  - stem: Ты ___ рассказа́л о на́шем пла́не?
    hint: кто́-нибудь
    accept:
    - кому́-нибудь
  - stem: Ми́ша занима́ется ___ в свое́й ко́мнате.
    hint: что́-то
    accept:
    - че́м-то
  - stem: Мы до́лго говори́ли о ___.
    hint: что́-то
    accept:
    - чём-то
  - stem: Позвони́ ___ из на́шей гру́ппы.
    hint: кто́-нибудь
    accept:
    - кому́-нибудь
  - stem: Я хочу́ поговори́ть с тобо́й ___.
    hint: о + ко́е-что
    accept:
    - ко́е о чём
  - stem: Ди́ма уже́ встре́тился ___.
    hint: с + ко́е-кто
    accept:
    - ко́е с кем
  - stem: Она́ живёт в ___ ма́леньком го́роде.
    hint: како́й-то
    accept:
    - како́м-то
  - stem: Я чита́л об э́том в ___ кни́ге.
    hint: кака́я-то
    accept:
    - како́й-то
  - stem: Спроси́ ___ из студе́нтов.
    hint: кто́-нибудь
    accept:
    - кого́-нибудь
  - stem: Ю́ми получи́ла письмо́ от ___ знако́мых.
    hint: каки́е-то
    accept:
    - каки́х-то
  - stem: Помоги́ ___ в на́шей гру́ппе.
    hint: кто́-нибудь
    accept:
    - кому́-нибудь
  why: '第 1、2、5、10、12 题：按动词或前置词要求变前一部分：[с ке́м-то]{.ru}（第五格），[рассказа́ть, позвони́ть, помо́чь кому́-нибудь]{.ru}（第三格），[спроси́ть кого́-нибудь]{.ru}（第四格）。

    第 3、4 题：[занима́ться че́м-то]{.ru}（第五格），[о чём-то]{.ru}（第六格，[ё]{.ru} 不能写成 [е]{.ru}）。

    第 6、7 题：有前置词时 [ко́е]{.ru} 在前、前置词在中间：[ко́е о чём, ко́е с кем]{.ru}。

    第 8、9、11 题：[како́й-то]{.ru} 和名词一致：[в како́м-то ма́леньком го́роде, в како́й-то кни́ге, от каки́х-то знако́мых]{.ru}。'
