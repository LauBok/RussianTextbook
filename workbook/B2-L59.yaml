heading: 第 59 课　不定代词
groups:
- id: B2-L59-01
  tags:
  - 不定代词：变格
  task: 写出不定代词的第二、三格和带前置词 [с]{.ru}、[о]{.ru} 的形式。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  - '[с]{.ru} + 第五格'
  - '[о]{.ru} + 第六格'
  given:
  - 0
  rows:
  - base: '[кто́-то]{.ru}'
    cells:
    - '[кто́-то]{.ru}'
    - '[кого́-то]{.ru}'
    - '[кому́-то]{.ru}'
    - '[с ке́м-то]{.ru}'
    - '[о ко́м-то]{.ru}'
  - base: '[что́-то]{.ru}'
    cells:
    - '[что́-то]{.ru}'
    - '[чего́-то]{.ru}'
    - '[чему́-то]{.ru}'
    - '[с че́м-то]{.ru}'
    - '[о чём-то]{.ru}'
  - base: '[кто́-нибудь]{.ru}'
    cells:
    - '[кто́-нибудь]{.ru}'
    - '[кого́-нибудь]{.ru}'
    - '[кому́-нибудь]{.ru}'
    - '[с ке́м-нибудь]{.ru}'
    - '[о ко́м-нибудь]{.ru}'
  - base: '[что́-нибудь]{.ru}'
    cells:
    - '[что́-нибудь]{.ru}'
    - '[чего́-нибудь]{.ru}'
    - '[чему́-нибудь]{.ru}'
    - '[с че́м-нибудь]{.ru}'
    - '[о чём-нибудь]{.ru}'
  - base: '[ко́е-кто]{.ru}'
    cells:
    - '[ко́е-кто]{.ru}'
    - '[ко́е-кого́]{.ru}'
    - '[ко́е-кому́]{.ru}'
    - '[ко́е с кем]{.ru}'
    - '[ко́е о ком]{.ru}'
  - base: '[ко́е-что]{.ru}'
    cells:
    - '[ко́е-что]{.ru}'
    - '[ко́е-чего́]{.ru}'
    - '[ко́е-чему́]{.ru}'
    - '[ко́е с чем]{.ru}'
    - '[ко́е о чём]{.ru}'
  - base: '[како́й-то]{.ru}'
    cells:
    - '[како́й-то]{.ru}'
    - '[како́го-то]{.ru}'
    - '[како́му-то]{.ru}'
    - '[с каки́м-то]{.ru}'
    - '[о како́м-то]{.ru}'
    hint: 阳性
  - base: '[кака́я-то]{.ru}'
    cells:
    - '[кака́я-то]{.ru}'
    - '[како́й-то]{.ru}'
    - '[како́й-то]{.ru}'
    - '[с како́й-то]{.ru}'
    - '[о како́й-то]{.ru}'
    hint: 阴性
  - base: '[каки́е-то]{.ru}'
    cells:
    - '[каки́е-то]{.ru}'
    - '[каки́х-то]{.ru}'
    - '[каки́м-то]{.ru}'
    - '[с каки́ми-то]{.ru}'
    - '[о каки́х-то]{.ru}'
    hint: 复数
  - base: '[како́й-нибудь]{.ru}'
    cells:
    - '[како́й-нибудь]{.ru}'
    - '[како́го-нибудь]{.ru}'
    - '[како́му-нибудь]{.ru}'
    - '[с каки́м-нибудь]{.ru}'
    - '[о како́м-нибудь]{.ru}'
