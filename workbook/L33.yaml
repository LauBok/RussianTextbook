  - base: '[ко́мната + Ва́ня]{.ru}'
    cells:
    - '[ко́мната + Ва́ня]{.ru}'
    - '[ко́мната Ва́ни]{.ru}'
  why: '第 1 题：[оте́ц]{.ru} 变格时 [е]{.ru} 脱落，重音移到词尾：[отца́]{.ru}。

    第 2、3、8、13、14、15、18 题：阳性加 [-а / -я]{.ru}：[сосе́да, преподава́теля, ма́льчика]{.ru}；名字和父称都变：[Ива́на Серге́евича]{.ru}。

    第 4、5、6、20 题：[-а / -я]{.ru} 结尾，按阴性变；[г, к, ш]{.ru} 后写 [и]{.ru}：[Ми́ши, ба́бушки, де́душки, Ва́ни]{.ru}。

    第 7、9、19 题：[семьи́, Мари́и Никола́евны, Росси́и]{.ru}；[-ия]{.ru} 结尾变 [-ии]{.ru}。

    第 10–12、16、17 题：[-а]{.ru} 改 [-ы]{.ru}，[к]{.ru} 后写 [-и]{.ru}：[студе́нтки, А́нны, сестры́, Москвы́, ко́мнаты]{.ru}。

    第 1–20 题：语序和汉语相反，不要说成 *[отца́ маши́на]{.ru}。'
