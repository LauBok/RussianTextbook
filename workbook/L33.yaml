  why: '第 1、5、6、12、14 题：第二格 [-ы / -и]{.ru} 可能来自 [-а]{.ru} 或 [-я]{.ru} 结尾的名词，包括阳性 [де́душка, Ва́ня]{.ru}。

    第 2 题：[отца́]{.ru} 的第一格是 [оте́ц]{.ru}，词干里有脱落的 [е]{.ru}。

    第 3、9 题：[-ии]{.ru} 来自 [-ия]{.ru}，[семьи́]{.ru} 来自 [семья́]{.ru}。

    第 4、10、11、15 题：[-я]{.ru} 来自 [-ь]{.ru} 或 [-й]{.ru}：[учи́тель, музе́й, Кита́й, И́горь]{.ru}。

    第 7、8 题：[-а]{.ru} 来自硬辅音结尾的阳性名词。

    第 13 题：[зда́ния]{.ru} 来自中性 [зда́ние]{.ru}。'
- id: L33-03
