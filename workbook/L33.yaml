    - '[на ку́хне сосе́дки]{.ru}'
    new: true
    gloss: '[сосе́дка]{.ru}：女邻居'
  why: '第 1–10 题：所属的第二格放在后面，不管前面的名词变成什么格，它都不变：[маши́ну отца́, в маши́не отца́]{.ru}。

    第 1–3、6、9、10 题：前面的阴性名词作宾语改 [-у / -ю]{.ru}，表示处所改 [-е]{.ru}。

    第 4、5、7、8 题：前面的非动物阳性、中性名词作宾语不变；表示处所时 [сад]{.ru} 用 [в саду́]{.ru}，[дом]{.ru} 用 [в до́ме]{.ru}。'
