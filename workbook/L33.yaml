    - '[альбо́м семьи́]{.ru}'
    - '[в альбо́ме семьи́]{.ru}'
  - base: '[письмо́ ма́мы]{.ru}'
    cells:
    - '[письмо́ ма́мы]{.ru}'
    - '[письмо́ ма́мы]{.ru}'
    - '[в письме́ ма́мы]{.ru}'
  - base: '[кни́га преподава́теля]{.ru}'
    cells:
