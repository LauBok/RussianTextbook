heading: 第 29 课　星期与时段
groups:
- id: L29-01
  tags:
  - 星期：第一格与 в + 第四格
  task: 写出星期名称和“在星期几”的说法。
  type: matrix
  cols:
  - 星期
  - 第一格
  - '[в / во]{.ru} + 第四格'
  rows:
  - base: 星期一
    cells:
    - 星期一
    - '[понеде́льник]{.ru}'
    - '[в понеде́льник]{.ru}'
  - base: 星期二
    cells:
    - 星期二
    - '[вто́рник]{.ru}'
    - '[во вто́рник]{.ru}'
  - base: 星期三
    cells:
    - 星期三
    - '[среда́]{.ru}'
    - '[в сре́ду]{.ru}'
  - base: 星期四
    cells:
    - 星期四
    - '[четве́рг]{.ru}'
    - '[в четве́рг]{.ru}'
  - base: 星期五
    cells:
    - 星期五
    - '[пя́тница]{.ru}'
    - '[в пя́тницу]{.ru}'
  - base: 星期六
    cells:
    - 星期六
    - '[суббо́та]{.ru}'
    - '[в суббо́ту]{.ru}'
  - base: 星期日
    cells:
    - 星期日
    - '[воскресе́нье]{.ru}'
    - '[в воскресе́нье]{.ru}'
  why: '第 1、4 题：阳性名词第四格不变：[в понеде́льник, в четве́рг]{.ru}。

    第 2 题：[вто́рник]{.ru} 以 [в]{.ru} 加辅音开头，前置词写成 [во]{.ru}：[во вто́рник]{.ru}。

    第 3 题：[среда́]{.ru} 第四格重音前移：[в сре́ду]{.ru}。

    第 5、6 题：阴性 [-а]{.ru} 改 [-у]{.ru}：[в пя́тницу, в суббо́ту]{.ru}。

    第 7 题：中性 [воскресе́нье]{.ru} 第四格不变。'
- id: L29-02
  tags:
  - 时段副词
  - 星期与时段连用
  task: 用俄语说出下列时间。
  type: matrix
  cols:
  - 汉语
  - 日子
  - 时段
  rows:
  - base: 星期一上午
    cells:
    - 星期一上午
    - '[в понеде́льник]{.ru}'
    - '[у́тром]{.ru}'
  - base: 星期二晚上
    cells:
    - 星期二晚上
    - '[во вто́рник]{.ru}'
    - '[ве́чером]{.ru}'
  - base: 星期三下午
    cells:
    - 星期三下午
    - '[в сре́ду]{.ru}'
    - '[днём]{.ru}'
  - base: 星期四夜里
    cells:
    - 星期四夜里
    - '[в четве́рг]{.ru}'
    - '[но́чью]{.ru}'
  - base: 星期五晚上
    cells:
    - 星期五晚上
    - '[в пя́тницу]{.ru}'
    - '[ве́чером]{.ru}'
  - base: 星期六上午
    cells:
    - 星期六上午
    - '[в суббо́ту]{.ru}'
    - '[у́тром]{.ru}'
  - base: 星期日下午
    cells:
    - 星期日下午
    - '[в воскресе́нье]{.ru}'
    - '[днём]{.ru}'
  - base: 今天晚上
    cells:
    - 今天晚上
    - '[сего́дня]{.ru}'
    - '[ве́чером]{.ru}'
  - base: 今天夜里
    cells:
    - 今天夜里
    - '[сего́дня]{.ru}'
    - '[но́чью]{.ru}'
  - base: 星期二上午
    cells:
    - 星期二上午
    - '[во вто́рник]{.ru}'
    - '[у́тром]{.ru}'
  - base: 星期三晚上
    cells:
    - 星期三晚上
    - '[в сре́ду]{.ru}'
    - '[ве́чером]{.ru}'
  - base: 星期六夜里
    cells:
    - 星期六夜里
    - '[в суббо́ту]{.ru}'
    - '[но́чью]{.ru}'
  why: '第 1–12 题：日子在前，时段在后：[в понеде́льник у́тром]{.ru}。时段用副词 [у́тром, днём, ве́чером, но́чью]{.ru}，前面不加前置词，不要说 *[в ве́чер]{.ru}。

    第 3、7 题：“下午”是 [днём]{.ru}；第 4、9、12 题：“夜里”是 [но́чью]{.ru}，来自阴性名词 [ночь]{.ru}。

    第 2、10 题：[во вто́рник]{.ru}。'
- id: L29-03
  tags:
  - 星期：第一格与 в + 第四格辨别
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Сего́дня ___.
    hint: среда́
    accept:
    - среда́
  - stem: В ___ я до́ма.
    hint: среда́
    accept:
    - сре́ду
  - stem: Сего́дня ___.
    hint: пя́тница
    accept:
    - пя́тница
  - stem: В ___ мы е́дем на да́чу.
    hint: пя́тница
    accept:
    - пя́тницу
  - stem: ___ я хожу́ в бассе́йн.
    hint: вто́рник
    accept:
    - Во вто́рник
  - stem: — Како́й сего́дня день? — ___.
    hint: суббо́та
    accept:
    - Суббо́та
  - stem: В ___ ве́чером мы идём в теа́тр.
    hint: суббо́та
    accept:
    - суббо́ту
  - stem: Сего́дня ___.
    hint: понеде́льник
    accept:
    - понеде́льник
  - stem: В ___ у́тром я иду́ на уро́к.
    hint: понеде́льник
    accept:
    - понеде́льник
  - stem: ___ А́нна е́дет в центр.
    hint: четве́рг
    accept:
    - В четве́рг
  - stem: Сего́дня ___, выходно́й день.
    hint: воскресе́нье
    accept:
    - воскресе́нье
  - stem: ___ ба́бушка гото́вит обе́д.
    hint: воскресе́нье
    accept:
    - В воскресе́нье
  - stem: Сего́дня ___.
    hint: вто́рник
    accept:
    - вто́рник
  - stem: В ___ днём Ми́ша игра́ет в футбо́л.
    hint: среда́
    accept:
    - сре́ду
  why: '第 1、3、6、8、11、13 题：回答“今天星期几”，星期名称是主语或表语，用第一格：[Сего́дня среда́]{.ru}。

    第 2、4、7、14 题：“在星期几”用 [в]{.ru} + 第四格，阴性改 [-у]{.ru}，[среда́]{.ru} 重音前移：[в сре́ду]{.ru}。

    第 9、10、12 题：阳性和中性第四格不变：[в понеде́льник, в четве́рг, в воскресе́нье]{.ru}。

    第 5 题：[во вто́рник]{.ru}。'
- id: L29-04
  tags:
  - 时段副词
  task: 按时间把活动归入一天中的时段。
  type: classify
  bins:
  - '[у́тром]{.ru}'
  - '[днём]{.ru}'
  - '[ве́чером]{.ru}'
  - '[но́чью]{.ru}'
  items:
  - text: '[пить ко́фе]{.ru}（8:00）'
    answer: '[у́тром]{.ru}'
  - text: '[спать]{.ru}（2:00）'
    answer: '[но́чью]{.ru}'
  - text: '[рабо́тать]{.ru}（14:00）'
    answer: '[днём]{.ru}'
  - text: '[смотре́ть телеви́зор]{.ru}（21:00）'
    answer: '[ве́чером]{.ru}'
  - text: '[идти́ на уро́к]{.ru}（9:00）'
    answer: '[у́тром]{.ru}'
  - text: '[идти́ на конце́рт]{.ru}（19:00）'
    answer: '[ве́чером]{.ru}'
  - text: '[чита́ть в библиоте́ке]{.ru}（15:00）'
    answer: '[днём]{.ru}'
  - text: '[звони́ть домо́й]{.ru}（3:00，北京是早上）'
    answer: '[но́чью]{.ru}'
  - text: '[гуля́ть в па́рке]{.ru}（13:00）'
    answer: '[днём]{.ru}'
  - text: '[чита́ть газе́ту]{.ru}（7:00）'
    answer: '[у́тром]{.ru}'
  - text: '[слу́шать му́зыку]{.ru}（20:00）'
    answer: '[ве́чером]{.ru}'
  - text: '[писа́ть письмо́]{.ru}（1:00）'
    answer: '[но́чью]{.ru}'
  why: '第 1、5、10 题：早上、上午用 [у́тром]{.ru}。

    第 3、7、9 题：白天、下午用 [днём]{.ru}。

    第 4、6、11 题：晚上用 [ве́чером]{.ru}。

    第 2、8、12 题：半夜用 [но́чью]{.ru}。第 8 题按说话人所在地的时间算，莫斯科是凌晨三点。'
