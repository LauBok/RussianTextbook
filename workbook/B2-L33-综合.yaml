  why: |-
    第 1、7、13 题：[-ова-, -ева-]{.ru} 变 [-у-]{.ru}，命令式也一样：[рису́й, сове́туй, танцу́й]{.ru}。
    第 3、9、15 题：现在时去掉 [-ва-]{.ru}：[даю́, встаёшь, продаю́т]{.ru}；命令式保留：[дава́й, встава́й, продава́й]{.ru}。
    第 2、8、14、17、19 题：第二变位只在 [я]{.ru} 交替：[хожу́, прошу́, плачу́, гото́влю, кормлю́]{.ru}；命令式由 [они́]{.ru} 的词干构成，不交替：[ходи́, проси́, плати́, гото́вь, корми́]{.ru}。
    第 4、10、16、18、20 题：第一变位所有人称都交替，命令式也带交替：[пиши́, плачь, скажи́, ищи́, маши́]{.ru}；[пла́чу]{.ru} 重音在词干，命令式 [плачь]{.ru}。
    第 6、12 题：[-чь]{.ru} 动词：[пеку́, печёшь, пеку́т; помогу́, помо́жешь, помо́гут]{.ru}，命令式用 [г, к]{.ru}：[пеки́, помоги́]{.ru}。
    第 5、11 题：规则变位：[чита́ю, чита́й; говорю́, говори́]{.ru}。
