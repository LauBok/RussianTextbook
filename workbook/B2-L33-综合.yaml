  - B2-L33-01
  - B2-L33-02
- id: B2-L33-综合-c
  tags:
  - 综合：现在时（句中）
  task: 用括号里动词的现在时（完成体用将来时）填空。
  type: fill
  items:
  - stem: Сего́дня я ___ за всех.
    hint: плати́ть
    accept:
    - плачу́
  - stem: Я не ___, я смею́сь.
    hint: пла́кать
    accept:
    - пла́чу
  - stem: Я сра́зу ___ А́нну на фо́то.
    hint: узнава́ть
    accept:
    - узнаю́
  - stem: За́втра я ___, когда́ экза́мен.
    hint: узна́ть
    accept:
    - узна́ю
  - stem: Ма́стер ___ Ми́ше кисть.
    hint: дава́ть
    accept:
    - даёт
  - stem: Мы ___ в семь часо́в.
    hint: встава́ть
    accept:
    - встаём
  - stem: Ба́бушка ___ пироги́.
    hint: печь
    accept:
    - печёт
  - stem: Вы ___ пойти́ с на́ми?
    hint: мочь
    accept:
    - мо́жете
  - stem: Что ты ___?
    hint: рисова́ть
    accept:
    - рису́ешь
  - stem: Я ___ тебе́ вы́спаться.
    hint: сове́товать
    accept:
    - сове́тую
  - stem: Ми́ша ___ Му́рку ка́ждое у́тро.
    hint: корми́ть
    accept:
    - ко́рмит
  - stem: Смотри́, они́ ___ нам руко́й.
    hint: маха́ть
    accept:
    - ма́шут
  - stem: Я ___ ключи́ уже́ час.
    hint: иска́ть
    accept:
    - ищу́
  - stem: Ты ча́сто ___ в теа́тр?
    hint: ходи́ть
    accept:
    - хо́дишь
  - stem: Мы ___ кни́ги на по́лку.
    hint: ста́вить
    accept:
    - ста́вим
  - stem: Здесь ___ хоро́шие кни́ги.
    hint: продава́ть
    accept:
    - продаю́т
  why: |-
    第 1、2 题：[плачу́]{.ru}（[плати́ть]{.ru}，付钱）和 [пла́чу]{.ru}（[пла́кать]{.ru}，哭）只差重音。
    第 3、4 题：[узнаю́]{.ru} 是未完成体 [узнава́ть]{.ru} 的现在时，重音在词尾；[узна́ю]{.ru} 是完成体 [узна́ть]{.ru} 的将来时，重音在 [-на́-]{.ru}。
    第 5、6、16 题：去掉 [-ва-]{.ru}：[даёт, встаём, продаю́т]{.ru}。
    第 7、8 题：[-чь]{.ru} 动词除 [я, они́]{.ru} 外换成 [ч, ж]{.ru}：[печёт, мо́жете]{.ru}。
    第 9、10 题：[-ова-]{.ru} 变 [-у-]{.ru}：[рису́ешь, сове́тую]{.ru}。
    第 11、14、15 题：第二变位只在 [я]{.ru} 交替，其他人称不变：[ко́рмит, хо́дишь, ста́вим]{.ru}；注意重音前移。
    第 12、13 题：第一变位所有人称都交替：[ма́шут, ищу́]{.ru}。
  lessons:
  - B2-L32
  - B2-L33
  recycles:
  - B2-L32-01
  - B2-L33-03
