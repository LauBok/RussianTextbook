- id: B2-L33-综合-b
  tags:
  - 综合：变位类型
  task: 动词属于哪种变位类型？归栏。
  type: classify
  bins:
  - 规则第一变位
  - 规则第二变位
  - '[-ова- → -у-]{.ru}'
  - 去掉 [-ва-]{.ru}
  - 第二变位 [я]{.ru} 交替
  - 第一变位全部交替
  - '[-чь]{.ru} 动词'
  items:
  - text: '[чита́ть]{.ru}'
    answer: 规则第一变位
  - text: '[гуля́ть]{.ru}'
    answer: 规则第一变位
  - text: '[отвеча́ть]{.ru}'
    answer: 规则第一变位
  - text: '[говори́ть]{.ru}'
    answer: 规则第二变位
  - text: '[учи́ть]{.ru}'
    answer: 规则第二变位
  - text: '[смотре́ть]{.ru}'
    answer: 规则第二变位
  - text: '[звони́ть]{.ru}'
    answer: 规则第二变位
  - text: '[сове́товать]{.ru}'
    answer: '[-ова- → -у-]{.ru}'
  - text: '[интересова́ться]{.ru}'
    answer: '[-ова- → -у-]{.ru}'
  - text: '[путеше́ствовать]{.ru}'
    answer: '[-ова- → -у-]{.ru}'
  - text: '[узнава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[сдава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[передава́ть]{.ru}'
    answer: 去掉 [-ва-]{.ru}
  - text: '[ви́деть]{.ru}'
    answer: 第二变位 [я]{.ru} 交替
  - text: '[плати́ть]{.ru}'
    answer: 第二变位 [я]{.ru} 交替
  - text: '[ста́вить]{.ru}'
    answer: 第二变位 [я]{.ru} 交替
  - text: '[спать]{.ru}'
    answer: 第二变位 [я]{.ru} 交替
  - text: '[писа́ть]{.ru}'
    answer: 第一变位全部交替
  - text: '[пла́кать]{.ru}'
    answer: 第一变位全部交替
  - text: '[иска́ть]{.ru}'
    answer: 第一变位全部交替
  - text: '[сказа́ть]{.ru}'
    answer: 第一变位全部交替
  - text: '[мочь]{.ru}'
    answer: '[-чь]{.ru} 动词'
  - text: '[печь]{.ru}'
    answer: '[-чь]{.ru} 动词'
  - text: '[помо́чь]{.ru}'
    answer: '[-чь]{.ru} 动词'
  why: |-
    第 1–3 题：[-ать, -ять]{.ru} 规则第一变位：[чита́ю, гуля́ю, отвеча́ю]{.ru}。
    第 4–7 题：第二变位，词干末没有能交替的辅音：[говорю́, учу́, смотрю́, звоню́]{.ru}。
    第 8–10 题：[-овать]{.ru}：[сове́тую, интересу́юсь, путеше́ствую]{.ru}。
    第 11–13 题：[-дава́ть, -знава́ть]{.ru}：[узнаю́, сдаю́, передаю́]{.ru}。
    第 14–17 题：第二变位 [я]{.ru} 交替：[ви́жу, плачу́, ста́влю, сплю]{.ru}。
    第 18–21 题：第一变位全部交替：[пишу́ — пи́шешь, пла́чу — пла́чешь, ищу́ — и́щешь, скажу́ — ска́жешь]{.ru}。
    第 22–24 题：[-чь]{.ru}：[могу́ — мо́жешь, пеку́ — печёшь, помогу́ — помо́жешь]{.ru}。
