heading: 综合练习　人用第三格的句子
lessons: [L53, L54, L55, L58]
groups:
- id: L58-综合-a
  lessons: [L53, L54, L55, L58]
  tags: [综合：第三格句型的过去时与将来时]
  recycles: [L53-02, L54-02, L55-01, L58-01]
  task: 写出句子的过去时和将来时（注意哪些句子的 [быть]{.ru} 要变）。
  type: matrix
  cols: [现在, 过去, 将来]
  given: [0]
  rows:
  - {base: '[Мне два́дцать лет.]{.ru}', cells: ['[Мне два́дцать лет.]{.ru}', '[Мне бы́ло два́дцать лет.]{.ru}', '[Мне бу́дет два́дцать лет.]{.ru}']}
  - {base: '[Ему́ два́дцать оди́н год.]{.ru}', cells: ['[Ему́ два́дцать оди́н год.]{.ru}', '[Ему́ был два́дцать оди́н год.]{.ru}', '[Ему́ бу́дет два́дцать оди́н год.]{.ru}']}
  - {base: '[Нам на́до рабо́тать.]{.ru}', cells: ['[Нам на́до рабо́тать.]{.ru}', '[Нам на́до бы́ло рабо́тать.]{.ru}', '[Нам на́до бу́дет рабо́тать.]{.ru}']}
  - {base: '[Здесь нельзя́ кури́ть.]{.ru}', cells: ['[Здесь нельзя́ кури́ть.]{.ru}', '[Здесь нельзя́ бы́ло кури́ть.]{.ru}', '[Здесь нельзя́ бу́дет кури́ть.]{.ru}']}
  - {base: '[Мне ну́жен шарф.]{.ru}', cells: ['[Мне ну́жен шарф.]{.ru}', '[Мне был ну́жен шарф.]{.ru}', '[Мне бу́дет ну́жен шарф.]{.ru}']}
  - {base: '[А́нне нужна́ ша́пка.]{.ru}', cells: ['[А́нне нужна́ ша́пка.]{.ru}', '[А́нне была́ нужна́ ша́пка.]{.ru}', '[А́нне бу́дет нужна́ ша́пка.]{.ru}']}
  - {base: '[Ми́ше нужны́ сапоги́.]{.ru}', cells: ['[Ми́ше нужны́ сапоги́.]{.ru}', '[Ми́ше бы́ли нужны́ сапоги́.]{.ru}', '[Ми́ше бу́дут нужны́ сапоги́.]{.ru}']}
  - {base: '[Ей ну́жно пальто́.]{.ru}', cells: ['[Ей ну́жно пальто́.]{.ru}', '[Ей бы́ло ну́жно пальто́.]{.ru}', '[Ей бу́дет ну́жно пальто́.]{.ru}']}
  - {base: '[Ему́ ну́жно купи́ть хлеб.]{.ru}', cells: ['[Ему́ ну́жно купи́ть хлеб.]{.ru}', '[Ему́ ну́жно бы́ло купи́ть хлеб.]{.ru}', '[Ему́ ну́жно бу́дет купи́ть хлеб.]{.ru}']}
  - {base: '[Мне хо́лодно.]{.ru}', cells: ['[Мне хо́лодно.]{.ru}', '[Мне бы́ло хо́лодно.]{.ru}', '[Мне бу́дет хо́лодно.]{.ru}']}
  - {base: '[Ба́бушке ску́чно.]{.ru}', cells: ['[Ба́бушке ску́чно.]{.ru}', '[Ба́бушке бы́ло ску́чно.]{.ru}', '[Ба́бушке бу́дет ску́чно.]{.ru}']}
  - {base: '[Ко́шке три го́да.]{.ru}', cells: ['[Ко́шке три го́да.]{.ru}', '[Ко́шке бы́ло три го́да.]{.ru}', '[Ко́шке бу́дет три го́да.]{.ru}']}
  - {base: '[Тебе́ мо́жно отдыха́ть.]{.ru}', cells: ['[Тебе́ мо́жно отдыха́ть.]{.ru}', '[Тебе́ мо́жно бы́ло отдыха́ть.]{.ru}', '[Тебе́ мо́жно бу́дет отдыха́ть.]{.ru}']}
  why: |
    第 3、4、9、10、11、13 题：无人称句（[на́до, нельзя́, ну́жно, мо́жно]{.ru} + 不定式，[хо́лодно, ску́чно]{.ru}）没有第一格主语，一律用 [бы́ло, бу́дет]{.ru}。第 9 题 [ну́жно]{.ru} 后面是不定式，所以是 [ну́жно бы́ло]{.ru}，[хлеб]{.ru} 不影响它。
    第 5–8 题：[ну́жен]{.ru} 句里所需的东西是第一格主语，[быть]{.ru} 跟它的性数变：[был ну́жен шарф, была́ нужна́ ша́пка, бы́ли нужны́ сапоги́, бы́ло ну́жно пальто́]{.ru}；将来时复数用 [бу́дут]{.ru}。
    第 1、12 题：年龄一般用 [бы́ло, бу́дет]{.ru}；第 2 题数词以 [оди́н]{.ru} 结尾，过去时用阳性 [был]{.ru}。
- id: L58-综合-b
  lessons: [L53, L54, L55, L58]
  tags: [综合：第三格句型归类]
  recycles: [L54-01, L55-02]
  task: 判断句子说的是哪一类意思，填写序号。
  type: classify
  bins: [年龄, 必要、应该, 许可, 禁止, 需要某物, 感受或天气]
  items:
  - {text: '[Ско́лько тебе́ лет?]{.ru}', answer: 年龄}
  - {text: '[Нам на́до встать в семь часо́в.]{.ru}', answer: 必要、应该}
  - {text: '[Мо́жно сесть?]{.ru}', answer: 许可}
  - {text: '[В ва́нной нельзя́ кури́ть.]{.ru}', answer: 禁止}
  - {text: '[Мне ну́жен но́вый телефо́н.]{.ru}', answer: 需要某物}
  - {text: '[Ему́ хо́лодно.]{.ru}', answer: 感受或天气}
  - {text: '[Де́душке во́семьдесят оди́н год.]{.ru}', answer: 年龄}
  - {text: '[Ми́ше ну́жно сде́лать уро́ки.]{.ru}', answer: 必要、应该}
  - {text: '[Тебе́ мо́жно гуля́ть.]{.ru}', answer: 许可}
  - {text: '[На уро́к нельзя́ опа́здывать.]{.ru}', answer: 禁止}
  - {text: '[А́нне нужны́ перча́тки.]{.ru}', answer: 需要某物}
  - {text: '[Сего́дня тепло́.]{.ru}', answer: 感受或天气}
  - {text: '[Мне ну́жно пальто́.]{.ru}', answer: 需要某物}
  - {text: '[Ей бы́ло ску́чно.]{.ru}', answer: 感受或天气}
  - {text: '[Ско́ро Ми́ше бу́дет четы́рнадцать лет.]{.ru}', answer: 年龄}
  - {text: '[Боти́нки на́до снять.]{.ru}', answer: 必要、应该}
  - {text: '[Здесь мо́жно игра́ть.]{.ru}', answer: 许可}
  - {text: '[Ве́чером Ми́ше нельзя́ смотре́ть телеви́зор.]{.ru}', answer: 禁止}
  why: |
    第 1、7、15 题：数词 + [год / го́да / лет]{.ru}，说年龄。
    第 2、8、16 题：[на́до, ну́жно]{.ru} + 不定式，说必须做的事。第 8 题和第 13 题都有 [ну́жно]{.ru}：后面接不定式是“应该做”，接中性名词是“需要某物”。
    第 3、9、17 题：[мо́жно]{.ru} 表示允许。
    第 4、10、18 题：[нельзя́]{.ru} + 未完成体，表示禁止。
    第 5、11、13 题：[ну́жен, нужны́, ну́жно]{.ru} + 名词（主语），说需要什么东西。
    第 6、12、14 题：[хо́лодно, тепло́, ску́чно]{.ru} 说人的感受或天气。
- id: L58-综合-c
  lessons: [L55]
  tags: [综合：“需要”的性数配合核查]
  recycles: [L55-03, L55-04]
  task: 每句都有一处错误，写出正确的句子。
  type: matrix
  cols: [有错误的句子, 正确的句子]
  given: [0]
  rows:
  - {base: '[Мне нужна́ перча́тки.]{.ru}', cells: ['[Мне нужна́ перча́тки.]{.ru}', '[Мне нужны́ перча́тки.]{.ru}']}
  - {base: '[Ему́ ну́жен ку́ртка.]{.ru}', cells: ['[Ему́ ну́жен ку́ртка.]{.ru}', '[Ему́ нужна́ ку́ртка.]{.ru}']}
  - {base: '[Ми́ше нужна́ мяч.]{.ru}', cells: ['[Ми́ше нужна́ мяч.]{.ru}', '[Ми́ше ну́жен мяч.]{.ru}']}
  - {base: '[Нам ну́жен пальто́.]{.ru}', cells: ['[Нам ну́жен пальто́.]{.ru}', '[Нам ну́жно пальто́.]{.ru}']}
  - {base: '[Ей ну́жно ко́фе.]{.ru}', cells: ['[Ей ну́жно ко́фе.]{.ru}', '[Ей ну́жен ко́фе.]{.ru}']}
  - {base: '[А́нне бы́ло нужна́ ша́пка.]{.ru}', cells: ['[А́нне бы́ло нужна́ ша́пка.]{.ru}', '[А́нне была́ нужна́ ша́пка.]{.ru}']}
  - {base: '[Па́пе был нужны́ де́ньги.]{.ru}', cells: ['[Па́пе был нужны́ де́ньги.]{.ru}', '[Па́пе бы́ли нужны́ де́ньги.]{.ru}']}
  - {base: '[За́втра нам бу́дет нужны́ биле́ты.]{.ru}', cells: ['[За́втра нам бу́дет нужны́ биле́ты.]{.ru}', '[За́втра нам бу́дут нужны́ биле́ты.]{.ru}']}
  - {base: '[Мари́я Никола́евна нужна́ су́мка.]{.ru}', cells: ['[Мари́я Никола́евна нужна́ су́мка.]{.ru}', '[Мари́и Никола́евне нужна́ су́мка.]{.ru}']}
  - {base: '[Слова́рь мне не нужна́.]{.ru}', cells: ['[Слова́рь мне не нужна́.]{.ru}', '[Слова́рь мне не ну́жен.]{.ru}']}
  - {base: '[Что вам ну́жен?]{.ru}', cells: ['[Что вам ну́жен?]{.ru}', '[Что вам ну́жно?]{.ru}']}
  - {base: '[Мне нужны́ купи́ть сапоги́.]{.ru}', cells: ['[Мне нужны́ купи́ть сапоги́.]{.ru}', '[Мне ну́жно купи́ть сапоги́.]{.ru}']}
  why: |
    第 1–5、10 题：[ну́жен]{.ru} 跟所需的东西变：[перча́тки → нужны́, ку́ртка → нужна́, мяч → ну́жен, пальто́ → ну́жно, ко́фе → ну́жен, слова́рь → ну́жен]{.ru}。第 5 题 [ко́фе]{.ru} 虽以 [-е]{.ru} 结尾，却是阳性。
    第 6–8 题：过去时、将来时的 [быть]{.ru} 也跟所需的东西变：[была́ нужна́ ша́пка, бы́ли нужны́ де́ньги, бу́дут нужны́ биле́ты]{.ru}。
    第 9 题：需要的人用第三格：[Мари́и Никола́евне]{.ru}。
    第 11 题：问“需要什么”用中性 [ну́жно]{.ru}。第 12 题：后面接不定式时用无人称的 [ну́жно]{.ru}，[сапоги́]{.ru} 是宾语，不是主语。
- id: L58-综合-d
  lessons: [L53, L54, L55, L58]
  tags: [综合：第三格句型中的人]
  recycles: [L53-04, L58-03]
  task: 把括号里的词组变成第三格。
  type: fill
  items:
  - {stem: '___ се́мьдесят пять лет.', hint: на́ша ба́бушка, accept: [на́шей ба́бушке]}
  - {stem: '___ на́до рабо́тать.', hint: мой оте́ц, accept: [моему́ отцу́]}
  - {stem: '___ нужна́ ко́мната.', hint: э́тот студе́нт, accept: [э́тому студе́нту]}
  - {stem: '___ бы́ло ску́чно.', hint: ма́ленькая де́вочка, accept: [ма́ленькой де́вочке]}
  - {stem: '___ нельзя́ кури́ть.', hint: больно́й, accept: [больно́му]}
  - {stem: '___ ну́жен слова́рь?', hint: кто, accept: [кому́]}
  - {stem: '___ четы́рнадцать лет.', hint: мой мла́дший брат, accept: [моему́ мла́дшему бра́ту]}
  - {stem: '___ хо́лодно.', hint: твоя́ мать, accept: [твое́й ма́тери]}
  - {stem: '___ мо́жно гуля́ть.', hint: наш Ми́ша, accept: [на́шему Ми́ше]}
  - {stem: '___ нужны́ перча́тки.', hint: Мари́я Никола́евна, accept: [Мари́и Никола́евне]}
  why: |
    第 1–10 题：年龄、[на́до, мо́жно, нельзя́]{.ru}、[ну́жен]{.ru} 和状态副词的句子里，人都用第三格。
    第 2、3、7、9 题：阳性词组 [-ему / -ому … -у]{.ru}：[моему́ отцу́, э́тому студе́нту, моему́ мла́дшему бра́ту]{.ru}；第 2 题 [оте́ц → отцу́]{.ru}；第 9 题 [Ми́ша]{.ru} 修饰语用阳性，名词变 [-е]{.ru}。
    第 1、4、8、10 题：阴性词组 [-ей / -ой … -е / -и]{.ru}：[на́шей ба́бушке, ма́ленькой де́вочке, твое́й ма́тери, Мари́и Никола́евне]{.ru}。
    第 5 题：[больно́й]{.ru} 按形容词变：[больно́му]{.ru}。第 6 题：[кто → кому́]{.ru}。
