- id: B2-L38-综合-b
  recycles:
  - B2-L37-02
  - B2-L38-03
  tags:
  - 综合：定向与不定向意义
  task: 按运动动词在句中的意义把句子归栏。
  type: classify
  bins:
  - 此刻或那一次朝一个方向
  - 过去某时正在路上
  - 经常往返
  - 去过一趟
  - 没有固定方向
  - 会、能；穿戴
  items:
  - text: '[Ти́ше! Ма́ма несёт ча́шки.]{.ru}'
    answer: 此刻或那一次朝一个方向
    new: true
    gloss: 小声点
  - text: '[Куда́ ты ведёшь соба́ку?]{.ru}'
    answer: 此刻或那一次朝一个方向
  - text: '[Смотри́, вон пла́вает у́тка!]{.ru}'
    answer: 没有固定方向
    new: true
    gloss: 鸭子
  - text: '[По́езд идёт в Каза́нь.]{.ru}'
    answer: 此刻或那一次朝一个方向
  - text: '[Когда́ Ди́ма вёз нас домо́й, он рассказа́л о Каза́ни.]{.ru}'
    answer: 过去某时正在路上
  - text: '[Когда́ А́нна бежа́ла к авто́бусу, она́ упа́ла.]{.ru}'
    answer: 过去某时正在路上
    new: true
    gloss: 摔倒了
  - text: '[Когда́ мы плы́ли по Во́лге, бы́ло хо́лодно.]{.ru}'
    answer: 过去某时正在路上
  - text: '[Па́па во́зит Ми́шу в бассе́йн по суббо́там.]{.ru}'
    answer: 经常往返
  - text: '[Ба́бушка ча́сто но́сит нам пироги́.]{.ru}'
    answer: 经常往返
  - text: '[Ка́ждый ме́сяц Пьер лета́ет в Пари́ж.]{.ru}'
    answer: 经常往返
  - text: '[Вчера́ я води́л сестру́ в зоопа́рк.]{.ru}'
    answer: 去过一趟
    new: true
    gloss: 动物园
  - text: '[На про́шлой неде́ле Ю́ми е́здила в Су́здаль.]{.ru}'
    answer: 去过一趟
  - text: '[Ле́том мы лета́ли на мо́ре.]{.ru}'
    answer: 去过一趟
  - text: '[Пти́цы лета́ют над по́лем.]{.ru}'
    answer: 没有固定方向
  - text: '[Ми́ша весь день бе́гал по кварти́ре.]{.ru}'
    answer: 没有固定方向
  - text: '[Ди́ма води́л нас по Каза́ни.]{.ru}'
    answer: 没有固定方向
  - text: '[Ты уме́ешь пла́вать?]{.ru}'
    answer: 会、能；穿戴
  - text: '[Мой дя́дя не во́дит маши́ну.]{.ru}'
    answer: 会、能；穿戴
  - text: '[Ма́ма не но́сит очки́.]{.ru}'
    answer: 会、能；穿戴
  - text: '[Ба́бушка ещё хорошо́ хо́дит.]{.ru}'
    answer: 会、能；穿戴
  why: |-
    第 1、2、4 题：此刻或那一次朝一个方向，用定向动词：[несёт, ведёшь, идёт]{.ru}。第 4 题火车是那一班车开往喀山。
    第 5–7 题：[когда́]{.ru} 从句说过去正在路上，用定向动词过去时：[вёз, бежа́ла, плы́ли]{.ru}。
    第 8–10 题：[по суббо́там, ча́сто, ка́ждый ме́сяц]{.ru} 说反复往返，用不定向动词现在时。
    第 11–13 题：不定向动词过去时说去过一趟、已经回来：[води́л в зоопа́рк, е́здила в Су́здаль, лета́ли на мо́ре]{.ru}。
    第 3、14–16 题：没有终点，到处移动：[пла́вает, лета́ют над по́лем, бе́гал по кварти́ре, води́л по Каза́ни]{.ru}。第 3 题虽然有“此刻”的 [смотри́]{.ru}，但鸭子在水上游来游去，没有方向，仍用不定向动词。
    第 17–20 题：会不会、能不能（[уме́ешь пла́вать, не во́дит маши́ну, хорошо́ хо́дит]{.ru}），以及“戴”（[но́сит очки́]{.ru}），都用不定向动词。
  lessons:
  - B2-L37
  - B2-L38
- id: B2-L38-综合-c
  recycles:
  - B2-L37-04
  - B2-L38-04
  tags:
  - 综合：定向与不定向句中填空
  task: 从括号里的一对动词中选一个，写出合适的形式。
  type: fill
  items:
  - stem: — Куда́ ты ___ э́ти кни́ги? — В библиоте́ку.
    hint: нести́ / носи́ть
    accept:
    - несёшь
  - stem: Ле́том мы ча́сто ___ в о́зере.
    hint: плыть / пла́вать
    accept:
    - пла́вали
    - пла́ваем
  - stem: Когда́ мы ___ на маши́не на да́чу, я спал.
    hint: е́хать / е́здить
    accept:
    - е́хали
  - stem: Вчера́ Ми́ша ___ к врачу́. Сего́дня он уже́ в шко́ле.
    hint: идти́ / ходи́ть
    accept:
    - ходи́л
  - stem: Ка́ждое у́тро А́нна ___ в па́рке.
    hint: бежа́ть / бе́гать
    accept:
    - бе́гает
  - stem: Смотри́, Ди́ма ___ к нам! Он, наве́рное, опа́здывает.
    hint: бежа́ть / бе́гать
    accept:
    - бежи́т
  - stem: Наш самолёт ___ в Москву́ три часа́.
    hint: лете́ть / лета́ть
    accept:
    - лете́л
  - stem: Ты уме́ешь ___ маши́ну?
    hint: вести́ / води́ть
    accept:
    - води́ть
  - stem: Ка́ждую о́сень па́па ___ я́блоки с да́чи.
    hint: везти́ / вози́ть
    accept:
    - во́зит
  - stem: Когда́ я ___ Ми́шу в шко́лу, я встре́тил сосе́да.
    hint: вести́ / води́ть
    accept:
    - вёл
    - вела́
  - stem: Ю́ми никогда́ не ___ на самолёте.
    hint: лете́ть / лета́ть
    accept:
    - лета́ла
  - stem: Что ты ___ в рюкзаке́? Он тако́й тяжёлый!
    hint: нести́ / носи́ть
    accept:
    - несёшь
  - stem: 'Пьер — хоро́ший гид: он ___ тури́стов по Москве́.'
    hint: вести́ / води́ть
    accept:
    - во́дит
    new: true
    gloss: 导游
  - stem: Сейча́с я ___ на рабо́ту на авто́бусе.
    hint: е́хать / е́здить
    accept:
    - е́ду
  - stem: По Во́лге ___ больши́е теплохо́ды.
    hint: плыть / пла́вать
    accept:
    - пла́вают
    - хо́дят
  - stem: В про́шлом году́ мы ___ в Пеки́н к роди́телям.
    hint: е́хать / е́здить
    accept:
    - е́здили
  why: |-
    第 1、6、12、14 题：此刻正在朝一个方向，用定向动词现在时：[несёшь, бежи́т, е́ду]{.ru}。
    第 3、7、10 题：过去那一次的路程或过程：[е́хали, лете́л (три часа́), вёл]{.ru}。第 7 题说的是那一次飞行用了多长时间，用定向动词。
    第 4、16 题：去过一趟又回来了，用不定向动词过去时：[ходи́л, е́здили]{.ru}。
    第 2、5、9、13 题：经常、反复或到处带人参观，用不定向动词：[пла́вали, бе́гает, во́зит, во́дит]{.ru}。
    第 11 题：“从来没坐过飞机”，说的是经历，用不定向动词：[не лета́ла]{.ru}。
    第 8 题：会不会开车，用 [води́ть маши́ну]{.ru}。
    第 15 题：泛指船经常在河上来往：[пла́вают]{.ru}，也可以说 [хо́дят]{.ru}。
  lessons:
  - B2-L37
  - B2-L38
