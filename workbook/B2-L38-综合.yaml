  why: |-
    第 1、7、13 题：[вести́, везти́, нести́]{.ru} 第一变位，重音在词尾；过去时 [вёл, вёз, нёс]{.ru}，阴性 [вела́, везла́, несла́]{.ru}。
    第 4、6、10、14、16 题：不定向的 [-ить]{.ru} 动词第二变位，[я]{.ru} 交替：[ношу́, хожу́, вожу́, е́зжу, вожу́]{.ru}；[они́]{.ru} 用 [-ят]{.ru}：[но́сят, хо́дят, во́зят, во́дят]{.ru}，重音前移（[е́здят]{.ru} 本来就在词干）。
    第 5 题：[бежа́ть]{.ru} 的 [я, они́]{.ru} 用 [бег-]{.ru}：[бегу́, бегу́т]{.ru}；第 11 题 [лете́ть]{.ru}：[лечу́, летя́т]{.ru}。
    第 3 题：[е́ду, е́дут]{.ru}；第 9 题：[иду́, иду́т]{.ru}，过去时 [шёл, шла]{.ru}；第 15 题：[плыву́, плыву́т]{.ru}，[плыла́]{.ru}。
    第 2、8、12 题：第一变位 [-ать]{.ru}，像 [чита́ть]{.ru}，重音不动。
