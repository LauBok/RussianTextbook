heading: 第 28 课　动词前缀的非运动意义
groups:
- id: B3-L28-01
  lessons:
  - B3-L28
  tags:
  - 前缀的非运动意义：по- “一会儿”
  - 前缀的非运动意义：за- “开始”
  - 前缀的非运动意义：на- “许多、饱足”
  - 前缀的非运动意义：раз- “分开、变成”
  - 前缀的非运动意义：只构成完成体
  task: 按前缀给动词增加的意义归栏。
  type: classify
  bins:
  - 一会儿
  - 开始
  - 许多；饱足
  - 分开；变成
  - 只构成完成体
  items:
  - text: '[немно́го посиде́ли]{.ru}'
    answer: 一会儿
  - text: '[вдруг запла́кала]{.ru}'
    answer: 开始
  - text: '[напекла́ пирого́в]{.ru}'
    answer: 许多；饱足
  - text: '[разби́л ча́шку]{.ru}'
    answer: 分开；变成
  - text: '[постро́или дом]{.ru}'
    answer: 只构成完成体
  - text: '[полежа́л полчаса́]{.ru}'
    answer: 一会儿
  - text: '[вдруг засмея́лся]{.ru}'
    answer: 开始
  - text: '[нае́лись блино́в]{.ru}'
    answer: 许多；饱足
  - text: '[разре́зала торт]{.ru}'
    answer: 分开；变成
  - text: '[нарисова́л карти́ну]{.ru}'
    answer: 只构成完成体
  - text: '[погуля́ли в па́рке]{.ru}'
    answer: 一会儿
  - text: '[запе́ли пе́сню]{.ru}'
    answer: 开始
  - text: '[накорми́ла госте́й]{.ru}'
    answer: 许多；饱足
  - text: '[раздели́ли де́ньги]{.ru}'
    answer: 分开；变成
  - text: '[позвони́л дру́гу]{.ru}'
    answer: 只构成完成体
  - text: '[порабо́тала два часа́]{.ru}'
    answer: 一会儿
  - text: '[вдруг закрича́л]{.ru}'
    answer: 开始
  - text: '[напои́ла дете́й ча́ем]{.ru}'
    answer: 许多；饱足
  - text: '[бы́стро разбогате́л]{.ru}'
    answer: 分开；变成
  - text: '[написа́л письмо́]{.ru}'
    answer: 只构成完成体
  why: |-
    第 1、6、11、16 题：[по-]{.ru} 表示“做一会儿”，常和 [немно́го, полчаса́]{.ru} 等连用：[посиде́ть, полежа́ть, погуля́ть, порабо́тать]{.ru}；这些动词没有对应的未完成体。
    第 2、7、12、17 题：[за-]{.ru} 加在表示声音、情感的动词上，表示动作突然开始，常和 [вдруг]{.ru} 连用：[запла́кать, засмея́ться, запе́ть, закрича́ть]{.ru}。
    第 3、8、13、18 题：[на-]{.ru} 表示做出许多，宾语用第二格：[напе́чь пирого́в]{.ru}；加 [-ся]{.ru} 表示做到饱足：[нае́сться]{.ru}；[накорми́ть, напои́ть]{.ru} 是让别人吃饱、喝足。
    第 4、9、14、19 题：[раз-]{.ru} 表示分开、打碎：[разби́ть, разре́зать, раздели́ть]{.ru}；加在形容词词根上表示变成某种状态：[разбогате́ть]{.ru}。
    第 5、10、15、20 题：这里的前缀只把未完成体变成完成体，不增加新意义：[постро́ить, нарисова́ть, позвони́ть, написа́ть]{.ru}。比较 [нарисова́л карти́ну]{.ru}（画好一幅画，第四格）和 [напекла́ пирого́в]{.ru}（烤了许多，第二格）。
- id: B3-L28-02
  lessons:
  - B3-L28
  tags:
  - 前缀 раз- / рас- 的拼写
  task: 这些动词的前缀写 [раз-]{.ru} 还是 [рас-]{.ru}？按前缀归栏。
  type: classify
  bins:
  - '[раз-]{.ru}'
  - '[рас-]{.ru}'
  items:
  - text: '[…би́ть]{.ru}'
    answer: '[раз-]{.ru}'
    hint: 打碎
  - text: '[…сказа́ть]{.ru}'
    answer: '[рас-]{.ru}'
    hint: 讲述
  - text: '[…дели́ть]{.ru}'
    answer: '[раз-]{.ru}'
    hint: 分开
  - text: '[…смеши́ть]{.ru}'
    answer: '[рас-]{.ru}'
    hint: 逗笑
  - text: '[…богате́ть]{.ru}'
    answer: '[раз-]{.ru}'
    hint: 变富
  - text: '[…писа́ться]{.ru}'
    answer: '[рас-]{.ru}'
    hint: 签字
  - text: '[…буди́ть]{.ru}'
    answer: '[раз-]{.ru}'
    hint: 叫醒
  - text: '[…стро́иться]{.ru}'
    answer: '[рас-]{.ru}'
    new: true
    gloss: 难过，心情不好
  - text: '[…ойти́сь]{.ru}'
    answer: '[раз-]{.ru}'
    new: true
    gloss: 散开
  - text: '[…кры́ть]{.ru}'
    answer: '[рас-]{.ru}'
    new: true
    gloss: 打开，揭开
  - text: '[…орва́ть]{.ru}'
    answer: '[раз-]{.ru}'
    new: true
    gloss: 撕破
  - text: '[…плати́ться]{.ru}'
    answer: '[рас-]{.ru}'
    new: true
    gloss: 付清钱
  - text: '[…весели́ть]{.ru}'
    answer: '[раз-]{.ru}'
    new: true
    gloss: 使高兴起来
  - text: '[…теря́ться]{.ru}'
    answer: '[рас-]{.ru}'
    new: true
    gloss: 不知所措
  why: |-
    第 1、3、5、7 题：在浊辅音 [б, д]{.ru} 前写 [раз-]{.ru}：[разби́ть, раздели́ть, разбогате́ть, разбуди́ть]{.ru}。
    第 9、11 题：在元音前也写 [раз-]{.ru}：[разойти́сь, разорва́ть]{.ru}。
    第 13 题：[в]{.ru} 前写 [раз-]{.ru}：[развесели́ть]{.ru}。
    第 2、4、6、8、10、12、14 题：在清辅音 [с, п, к, т]{.ru} 前写 [рас-]{.ru}：[рассказа́ть, рассмеши́ть, расписа́ться, расстро́иться, раскры́ть, расплати́ться, растеря́ться]{.ru}。[с]{.ru} 前写 [рас-]{.ru} 以后出现两个 [с]{.ru}，不要漏写：[рассказа́ть, расстро́иться]{.ru}。
- id: B3-L28-03
  lessons:
  - B3-L28
  tags:
  - 前缀 на-：宾语的格
  task: 把动词和名词组成词组。
  type: matrix
  cols:
  - 动词 + 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[напе́чь + пироги́]{.ru}'
    cells:
    - '[напе́чь + пироги́]{.ru}'
    - '[напе́чь пирого́в]{.ru}'
  - base: '[нарва́ть + цветы́]{.ru}'
    cells:
    - '[нарва́ть + цветы́]{.ru}'
    - '[нарва́ть цвето́в]{.ru}'
    new: true
    gloss: （摘）许多
  - base: '[накупи́ть + пода́рки]{.ru}'
    cells:
    - '[накупи́ть + пода́рки]{.ru}'
    - '[накупи́ть пода́рков]{.ru}'
    new: true
    gloss: （买）许多
  - base: '[напе́чь + блины́]{.ru}'
    cells:
    - '[напе́чь + блины́]{.ru}'
    - '[напе́чь блино́в]{.ru}'
  - base: '[нарисова́ть + карти́на]{.ru}'
    cells:
    - '[нарисова́ть + карти́на]{.ru}'
    - '[нарисова́ть карти́ну]{.ru}'
  - base: '[налови́ть + ры́ба]{.ru}'
    cells:
    - '[налови́ть + ры́ба]{.ru}'
    - '[налови́ть ры́бы]{.ru}'
    new: true
    gloss: （捕）许多
  - base: '[набра́ть + грибы́]{.ru}'
    cells:
    - '[набра́ть + грибы́]{.ru}'
    - '[набра́ть грибо́в]{.ru}'
  - base: '[написа́ть + письмо́]{.ru}'
    cells:
    - '[написа́ть + письмо́]{.ru}'
    - '[написа́ть письмо́]{.ru}'
  - base: '[нагото́вить + еда́]{.ru}'
    cells:
    - '[нагото́вить + еда́]{.ru}'
    - '[нагото́вить еды́]{.ru}'
    new: true
    gloss: 做（许多饭菜）
  - base: '[накорми́ть + го́сти]{.ru}'
    cells:
    - '[накорми́ть + го́сти]{.ru}'
    - '[накорми́ть госте́й]{.ru}'
  - base: '[нарисова́ть + портре́т]{.ru}'
    cells:
    - '[нарисова́ть + портре́т]{.ru}'
    - '[нарисова́ть портре́т]{.ru}'
  why: |-
    第 1–4、6、7、9 题：[на-]{.ru} 表示“做出许多”时，宾语用第二格：复数名词用复数第二格（[пирого́в, цвето́в, пода́рков, блино́в, грибо́в]{.ru}），物质名词用单数第二格（[ры́бы, еды́]{.ru}）。
    第 5、8、11 题：[нарисова́ть, написа́ть]{.ru} 里的 [на-]{.ru} 只构成完成体，宾语照常用第四格：[карти́ну, письмо́, портре́т]{.ru}。
    第 10 题：[накорми́ть]{.ru} 要求第四格；[го́сти]{.ru} 是动物名词，第四格同第二格：[госте́й]{.ru}。
- id: B3-L28-04
  lessons:
  - B3-L28
  tags:
  - 前缀 на-：宾语的格（句中）
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: К пра́зднику ба́бушка напекла́ ___.
    hint: пироги́
    accept:
    - пирого́в
  - stem: Ми́ша нарисова́л ___.
    hint: большо́й самолёт
    accept:
    - большо́й самолёт
  - stem: На Ма́сленицу мы нае́лись ___.
    hint: блины́
    accept:
    - блино́в
  - stem: Де́ти нарва́ли в лесу́ ___.
    hint: цветы́
    accept:
    - цвето́в
  - stem: Мари́я Никола́евна накорми́ла ___.
    hint: го́сти
    accept:
    - госте́й
  - stem: Пе́ред Но́вым го́дом А́нна накупи́ла ___.
    hint: пода́рки
    accept:
    - пода́рков
  - stem: Пьер написа́л ___.
    hint: дли́нное письмо́
    accept:
    - дли́нное письмо́
  - stem: Ко́шка разби́ла ___.
    hint: ста́рая ча́шка
    accept:
    - ста́рую ча́шку
  - stem: Ива́н Серге́евич постро́ил на да́че ___.
    hint: но́вый дом
    accept:
    - но́вый дом
  - stem: В суббо́ту мы набра́ли ___.
    hint: грибы́
    accept:
    - грибо́в
  - stem: Ма́ма разре́зала ___ на ча́сти.
    hint: торт
    accept:
    - торт
  - stem: Ба́бушка напои́ла ___ ча́ем.
    hint: де́ти
    accept:
    - дете́й
  why: |-
    第 1、3、4、6、10 题：[на-]{.ru} 表示“做出许多”或“……够了”时，名词用第二格：[напекла́ пирого́в, нае́лись блино́в, нарва́ли цвето́в, накупи́ла пода́рков, набра́ли грибо́в]{.ru}。
    第 2、7、9 题：[нарисова́ть, написа́ть, постро́ить]{.ru} 的前缀只构成完成体，宾语用第四格：[большо́й самолёт, дли́нное письмо́, но́вый дом]{.ru}。
    第 8、11 题：[раз-]{.ru} 表示打碎、切开，宾语用第四格：[ста́рую ча́шку, торт]{.ru}。
    第 5、12 题：[накорми́ть, напои́ть]{.ru} 的宾语是被喂饱的人，用第四格；动物名词复数第四格同第二格：[госте́й, дете́й]{.ru}。
