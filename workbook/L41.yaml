heading: 第 41 课　未完成体将来时
groups:
- id: L41-01
  tags: [未完成体将来时：助动词的人称形式]
  task: 按主语写出 [быть]{.ru} 的将来时形式。
  type: matrix
  cols: [主语, '[быть]{.ru} 将来时']
  given: [0]
  rows:
  - {base: '[я]{.ru}', cells: ['[я]{.ru}', '[бу́ду]{.ru}']}
  - {base: '[ты]{.ru}', cells: ['[ты]{.ru}', '[бу́дешь]{.ru}']}
  - {base: '[А́нна]{.ru}', cells: ['[А́нна]{.ru}', '[бу́дет]{.ru}']}
  - {base: '[мы]{.ru}', cells: ['[мы]{.ru}', '[бу́дем]{.ru}']}
  - {base: '[вы]{.ru}', cells: ['[вы]{.ru}', '[бу́дете]{.ru}']}
  - {base: '[студе́нты]{.ru}', cells: ['[студе́нты]{.ru}', '[бу́дут]{.ru}']}
  - {base: '[Ми́ша и па́па]{.ru}', cells: ['[Ми́ша и па́па]{.ru}', '[бу́дут]{.ru}']}
  - {base: '[О́льга Ви́кторовна]{.ru}', cells: ['[О́льга Ви́кторовна]{.ru}', '[бу́дет]{.ru}']}
  - {base: '[Ван Лэй и Пьер]{.ru}', cells: ['[Ван Лэй и Пьер]{.ru}', '[бу́дут]{.ru}']}
  - {base: '[ты, Ми́ша]{.ru}', cells: ['[ты, Ми́ша]{.ru}', '[бу́дешь]{.ru}']}
  - {base: '[вы, О́льга Ви́кторовна]{.ru}', cells: ['[вы, О́льга Ви́кторовна]{.ru}', '[бу́дете]{.ru}']}
  - {base: '[конце́рт]{.ru}', cells: ['[конце́рт]{.ru}', '[бу́дет]{.ru}']}
  - {base: '[уро́ки]{.ru}', cells: ['[уро́ки]{.ru}', '[бу́дут]{.ru}']}
  - {base: '[пра́здник]{.ru}', cells: ['[пра́здник]{.ru}', '[бу́дет]{.ru}']}
  - {base: '[ле́кция]{.ru}', cells: ['[ле́кция]{.ru}', '[бу́дет]{.ru}']}
  - {base: '[экза́мены]{.ru}', cells: ['[экза́мены]{.ru}', '[бу́дут]{.ru}'], new: true, gloss: 考试（复数）}
  - {base: '[ба́бушка и де́душка]{.ru}', cells: ['[ба́бушка и де́душка]{.ru}', '[бу́дут]{.ru}']}
  - {base: '[ма́ма]{.ru}', cells: ['[ма́ма]{.ru}', '[бу́дет]{.ru}']}
  why: |
    第 1、2、4、5 题：[бу́ду, бу́дешь, бу́дем, бу́дете]{.ru} 和第一变位的词尾一样，只是词干换成 [бу́д-]{.ru}，重音一直在词干上。
    第 3、8、12、14、15、18 题：单数第三人称不论阳性、阴性都是 [бу́дет]{.ru}；将来时没有性的区别，这一点和过去时 [был / была́]{.ru} 不同。
    第 6、7、9、13、16、17 题：复数名词和两个并列的人都用 [бу́дут]{.ru}。
    第 10、11 题：呼语不影响人称：[ты]{.ru} 用 [бу́дешь]{.ru}，[вы]{.ru} 哪怕只指一位老师也用 [бу́дете]{.ru}。
- id: L41-02
  tags: [未完成体将来时：现在时改将来时]
  task: 主语不变，把现在时改成复合将来时（只写动词部分）。
  type: matrix
  cols: [现在时, 将来时]
  given: [0]
  rows:
  - {base: '[я чита́ю]{.ru}', cells: ['[я чита́ю]{.ru}', '[бу́ду чита́ть]{.ru}']}
  - {base: '[ты рабо́таешь]{.ru}', cells: ['[ты рабо́таешь]{.ru}', '[бу́дешь рабо́тать]{.ru}']}
  - {base: '[он смо́трит]{.ru}', cells: ['[он смо́трит]{.ru}', '[бу́дет смотре́ть]{.ru}']}
  - {base: '[она́ пи́шет]{.ru}', cells: ['[она́ пи́шет]{.ru}', '[бу́дет писа́ть]{.ru}']}
  - {base: '[мы живём]{.ru}', cells: ['[мы живём]{.ru}', '[бу́дем жить]{.ru}']}
  - {base: '[вы гото́вите]{.ru}', cells: ['[вы гото́вите]{.ru}', '[бу́дете гото́вить]{.ru}']}
  - {base: '[они́ у́жинают]{.ru}', cells: ['[они́ у́жинают]{.ru}', '[бу́дут у́жинать]{.ru}']}
  - {base: '[я занима́юсь]{.ru}', cells: ['[я занима́юсь]{.ru}', '[бу́ду занима́ться]{.ru}']}
  - {base: '[ты у́чишься]{.ru}', cells: ['[ты у́чишься]{.ru}', '[бу́дешь учи́ться]{.ru}']}
  - {base: '[он ждёт]{.ru}', cells: ['[он ждёт]{.ru}', '[бу́дет ждать]{.ru}']}
  - {base: '[мы говори́м]{.ru}', cells: ['[мы говори́м]{.ru}', '[бу́дем говори́ть]{.ru}']}
  - {base: '[вы изуча́ете]{.ru}', cells: ['[вы изуча́ете]{.ru}', '[бу́дете изуча́ть]{.ru}']}
  - {base: '[они́ игра́ют]{.ru}', cells: ['[они́ игра́ют]{.ru}', '[бу́дут игра́ть]{.ru}']}
  - {base: '[я сплю]{.ru}', cells: ['[я сплю]{.ru}', '[бу́ду спать]{.ru}']}
  - {base: '[она́ отдыха́ет]{.ru}', cells: ['[она́ отдыха́ет]{.ru}', '[бу́дет отдыха́ть]{.ru}']}
  - {base: '[мы и́щем]{.ru}', cells: ['[мы и́щем]{.ru}', '[бу́дем иска́ть]{.ru}']}
  - {base: '[вы пьёте]{.ru}', cells: ['[вы пьёте]{.ru}', '[бу́дете пить]{.ru}']}
  - {base: '[они́ обе́дают]{.ru}', cells: ['[они́ обе́дают]{.ru}', '[бу́дут обе́дать]{.ru}']}
  why: |
    第 1–18 题：人称由 [бу́ду]{.ru} 的形式表示，主语是什么人称，[бу́ду]{.ru} 就变成什么人称；实义动词一律还原成不定式。
    第 4、5、10、14、16、17 题：现在时词干有变化的动词（[пи́шет, живём, ждёт, сплю, и́щем, пьёте]{.ru}），不定式要按原形写：[писа́ть, жить, ждать, спать, иска́ть, пить]{.ru}，不能照现在时词干拼。
    第 8、9 题：[-ся]{.ru} 留在不定式上：[бу́ду занима́ться, бу́дешь учи́ться]{.ru}，[бу́ду]{.ru} 本身不加 [-ся]{.ru}。
- id: L41-03
  tags: [未完成体将来时：常见错误核查]
  task: 每个词组都有一处错误，写出正确的说法。
  type: matrix
  cols: [有错误的说法, 正确的说法]
  given: [0]
  rows:
  - {base: '[я бу́ду быть до́ма]{.ru}', cells: ['[я бу́ду быть до́ма]{.ru}', '[я бу́ду до́ма]{.ru}']}
  - {base: '[он бу́дет рабо́тает]{.ru}', cells: ['[он бу́дет рабо́тает]{.ru}', '[он бу́дет рабо́тать]{.ru}']}
  - {base: '[мы бу́дем занима́емся]{.ru}', cells: ['[мы бу́дем занима́емся]{.ru}', '[мы бу́дем занима́ться]{.ru}']}
  - {base: '[вы бу́дет отдыха́ть]{.ru}', cells: ['[вы бу́дет отдыха́ть]{.ru}', '[вы бу́дете отдыха́ть]{.ru}']}
  - {base: '[я бу́ду не смотре́ть]{.ru}', cells: ['[я бу́ду не смотре́ть]{.ru}', '[я не бу́ду смотре́ть]{.ru}']}
  - {base: '[они́ бу́дем у́жинать]{.ru}', cells: ['[они́ бу́дем у́жинать]{.ru}', '[они́ бу́дут у́жинать]{.ru}']}
  - {base: '[ты бу́дешь занима́ешься]{.ru}', cells: ['[ты бу́дешь занима́ешься]{.ru}', '[ты бу́дешь занима́ться]{.ru}']}
  - {base: '[А́нна бу́дут чита́ть]{.ru}', cells: ['[А́нна бу́дут чита́ть]{.ru}', '[А́нна бу́дет чита́ть]{.ru}']}
  - {base: '[я бу́ду пишу́]{.ru}', cells: ['[я бу́ду пишу́]{.ru}', '[я бу́ду писа́ть]{.ru}']}
  - {base: '[мы бу́дем быть в библиоте́ке]{.ru}', cells: ['[мы бу́дем быть в библиоте́ке]{.ru}', '[мы бу́дем в библиоте́ке]{.ru}']}
  - {base: '[ско́ро бу́дут пра́здник]{.ru}', cells: ['[ско́ро бу́дут пра́здник]{.ru}', '[ско́ро бу́дет пра́здник]{.ru}']}
  - {base: '[Ми́ша бу́дет не игра́ть]{.ru}', cells: ['[Ми́ша бу́дет не игра́ть]{.ru}', '[Ми́ша не бу́дет игра́ть]{.ru}']}
  - {base: '[вы бу́дете у́читесь]{.ru}', cells: ['[вы бу́дете у́читесь]{.ru}', '[вы бу́дете учи́ться]{.ru}']}
  - {base: '[за́втра у меня́ бу́дут семина́р]{.ru}', cells: ['[за́втра у меня́ бу́дут семина́р]{.ru}', '[за́втра у меня́ бу́дет семина́р]{.ru}']}
  why: |
    第 1、10 题：[быть]{.ru} 的将来时本身就是谓语，表示“将在某处”，不能再接 [быть]{.ru}：[я бу́ду до́ма]{.ru}。
    第 2、3、7、9、13 题：变位的只有 [бу́ду]{.ru}，后面的动词一律用不定式；[-ся]{.ru} 动词写成 [занима́ться, учи́ться]{.ru}。
    第 4、6、8 题：[бу́ду]{.ru} 要和主语人称一致：[вы бу́дете, они́ бу́дут, А́нна бу́дет]{.ru}。
    第 5、12 题：否定词 [не]{.ru} 放在 [бу́ду]{.ru} 前面，不放在不定式前面。
    第 11、14 题：[пра́здник, семина́р]{.ru} 是单数主语，用 [бу́дет]{.ru}；[у меня́]{.ru} 不是主语。
- id: L41-04
  tags: [未完成体将来时：过去与将来对照]
  task: 根据时间词，写出括号里动词的过去时或将来时。
  type: fill
  items:
  - {stem: 'Вчера́ А́нна ___ в библиоте́ке.', hint: быть, accept: [была́]}
  - {stem: 'За́втра А́нна ___ в библиоте́ке.', hint: быть, accept: [бу́дет]}
  - {stem: 'Вчера́ у нас ___ семина́р.', hint: быть, accept: [был]}
  - {stem: 'За́втра у нас ___ семина́р.', hint: быть, accept: [бу́дет]}
  - {stem: 'За́втра ве́чером мы ___ телеви́зор.', hint: смотре́ть, accept: [бу́дем смотре́ть]}
  - {stem: 'Вчера́ ве́чером мы ___ телеви́зор.', hint: смотре́ть, accept: [смотре́ли]}
  - {stem: 'За́втра Ми́ша ___ в футбо́л.', hint: игра́ть, accept: [бу́дет игра́ть]}
  - {stem: 'За́втра па́па и ма́ма ___ на да́че.', hint: быть, accept: [бу́дут]}
  - {stem: 'Вчера́ Ван Лэй до́лго ___.', hint: занима́ться, accept: [занима́лся]}
  - {stem: 'За́втра я ___ до́ма.', hint: у́жинать, accept: [бу́ду у́жинать]}
  - {stem: 'Ско́ро ___ пра́здник.', hint: быть, accept: [бу́дет]}
  - {stem: 'Ты ___ за́втра?', hint: рабо́тать, accept: [бу́дешь рабо́тать]}
  - {stem: 'Вчера́ де́ти ___ в па́рке.', hint: гуля́ть, accept: [гуля́ли]}
  - {stem: 'Что вы ___ за́втра?', hint: де́лать, accept: [бу́дете де́лать]}
  - {stem: 'За́втра у меня́ ___ уро́ки.', hint: быть, accept: [бу́дут]}
  - {stem: 'Вчера́ у Ми́ши ___ уро́ки.', hint: быть, accept: [бы́ли]}
  why: |
    第 1、3、6、9、13、16 题：[вчера́]{.ru} 说的是过去，用过去时，按主语的性和数选 [-л, -ла, -ло, -ли]{.ru}：[была́, был, смотре́ли, занима́лся, гуля́ли, бы́ли]{.ru}。第 3、16 题的主语是 [семина́р, уро́ки]{.ru}，不是 [у нас, у Ми́ши]{.ru}。
    第 2、4、8、11、15 题：[быть]{.ru} 单独作谓语，将来时只写 [бу́дет / бу́дут]{.ru}，不加不定式。
    第 5、7、10、12、14 题：其他动词的将来时是 [бу́ду]{.ru} 的人称形式加不定式：[бу́дем смотре́ть, бу́дет игра́ть, бу́ду у́жинать, бу́дешь рабо́тать, бу́дете де́лать]{.ru}。
