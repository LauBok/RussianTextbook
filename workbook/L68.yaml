    第 12、18、20 题：[дире́ктор, профе́ссор, учи́тель]{.ru} 复数是 [директора́, профессора́, учителя́]{.ru}，重音在词尾，要单独记；第五格照常 [дире́ктором, профе́ссором, учи́телем]{.ru}。
    第 7、9、11、15 题：硬辅音结尾复数加 [-ы]{.ru}，第五格加 [-ом]{.ru}。
