    第 2 题：[медсестра́]{.ru} 复数重音前移，[е]{.ru} 变 [ё]{.ru}：[медсёстры]{.ru}；第五格 [медсестро́й]{.ru}。
    第 3 题：[-ь]{.ru} 复数 [-и]{.ru}，第五格 [-ем]{.ru}：[води́тели, води́телем]{.ru}。
    第 4、13 题：[рабо́чий, рабо́чая]{.ru} 是形容词转成的名词，按形容词变：复数都是 [рабо́чие]{.ru}，第五格 [рабо́чим, рабо́чей]{.ru}。
    第 5 题：[продаве́ц]{.ru} 脱落 [е]{.ru}：[продавцы́, продавцо́м]{.ru}。
    第 6、10、14 题：[ц]{.ru} 后复数写 [-ы]{.ru}，第五格不重读写 [-ей]{.ru}：[продавщи́цы, продавщи́цей]{.ru}。
