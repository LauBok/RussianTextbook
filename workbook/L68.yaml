  - base: '[пя́тница — понеде́льник]{.ru}'
    cells:
    - '[пя́тница — понеде́льник]{.ru}'
    - '[с пя́тницы до понеде́льника]{.ru}'
  why: |
    第 1–13 题：[с]{.ru} 表示起点、[до]{.ru} 表示终点，两个名词都用第二格。
    第 2、3 题：[у́тро]{.ru} 第二格重音移到词尾：[с утра́]{.ru}。
    第 5–9 题：[-брь]{.ru} 结尾的月份和 [янва́рь, февра́ль]{.ru} 第二格重音在词尾：[сентября́, октября́, ноября́, января́, февраля́]{.ru}；[ию́ня, ию́ля, апре́ля]{.ru} 重音不动。
    第 11 题：[воскресе́нье]{.ru} 第二格 [воскресе́нья]{.ru}。
    第 12 题：[четве́рг]{.ru} 第二格重音移到词尾：[до четверга́]{.ru}。
    第 1、11、13 题：阴性 [-а]{.ru} 改 [-ы]{.ru}：[пя́тницы, суббо́ты]{.ru}。
- id: L68-03
  tags:
  - с + 第二格与 с + 第五格对照
  task: 按 [с]{.ru} 的意思归类。
  type: classify
  bins:
  - '[с]{.ru} + 第二格（从……起）'
  - '[с]{.ru} + 第五格（和……；带有……）'
  items:
  - text: '[с утра́]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с бра́том]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с восьми́]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с молоко́м]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с понеде́льника]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с ни́ми]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с ча́са]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[со мной]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с ма́я]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с са́харом]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с двух]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с ма́мой]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с октября́]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с лимо́ном]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с обе́да]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с подру́гой]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  - text: '[с пя́тницы]{.ru}'
    answer: '[с]{.ru} + 第二格（从……起）'
  - text: '[с капу́стой]{.ru}'
    answer: '[с]{.ru} + 第五格（和……；带有……）'
  why: |
    第 1、3、5、7、9、11、13、15、17 题：时间词、数词的第二格，表示“从……起”：[с утра́, с восьми́, с ма́я, с обе́да, с пя́тницы]{.ru}，常和 [до]{.ru} 连用。
    第 2、4、6、8、10、12、14、16、18 题：第五格，表示“和……一起”或“带有……”：[с бра́том, со мной, с молоко́м]{.ru}。
    第 15、17 题：[с обе́да]{.ru}“从午饭后起”是第二格；“和午饭一起”要说 [с обе́дом]{.ru}。[с пя́тницы]{.ru} 的 [-ы]{.ru} 是第二格词尾，第五格是 [-ой]{.ru}。
- id: L68-04
  tags:
  - с … до …：时刻第二格
  - с … до …：名词第二格
  task: 用 [с … до …]{.ru} 和括号里的时间填空。
  type: fill
  items:
  - stem: Я рабо́таю ___.
    hint: 8 — 5
    accept:
    - с восьми́ до пяти́
  - stem: У нас обе́д ___.
    hint: 1 — 2
    accept:
    - с ча́са до двух
  - stem: У врача́ приём ___.
    hint: 3 — 7
    accept:
    - с трёх до семи́
  - stem: Мы занима́емся ___.
    hint: у́тро — ве́чер
    accept:
    - с утра́ до ве́чера
  - stem: Ми́ша у́чится ___.
    hint: понеде́льник — суббо́та
    accept:
    - с понеде́льника до суббо́ты
  - stem: Библиоте́ка рабо́тает ___.
    hint: 11 — 7
    accept:
    - с оди́ннадцати до семи́
  - stem: Мы живём на да́че ___.
    hint: ию́нь — а́вгуст
    accept:
    - с ию́ня до а́вгуста
  - stem: Учёба продолжа́ется ___.
    hint: сентя́брь — май
    accept:
    - с сентября́ до ма́я
  - stem: Переры́в на обе́д ___.
    hint: 12 — 1
    accept:
    - с двена́дцати до ча́са
  - stem: Па́па рабо́тает ___.
    hint: понеде́льник — пя́тница
    accept:
    - с понеде́льника до пя́тницы
  - stem: Ле́кция идёт ___.
    hint: 10 — 12
    accept:
    - с десяти́ до двена́дцати
  - stem: Музе́й рабо́тает ___.
    hint: четве́рг — воскресе́нье
    accept:
    - с четверга́ до воскресе́нья
  - stem: Магази́н рабо́тает ___.
    hint: 9 — 9
    accept:
    - с девяти́ до девяти́
  - stem: Я гуля́л в па́рке ___.
    hint: 4 — 6
    accept:
    - с четырёх до шести́
  why: |
    第 1–3、6、9、11、13、14 题：时刻用数词第二格，[часо́в]{.ru} 省略：[с восьми́ до пяти́, с ча́са до двух, с двена́дцати до ча́са]{.ru}。[пяти́ — десяти́]{.ru} 重音在词尾，[оди́ннадцати, двена́дцати]{.ru} 重音不动。
    第 4 题：[с утра́ до ве́чера]{.ru}，[утра́]{.ru} 重音在词尾。
    第 5、10、12 题：星期用第二格：[с понеде́льника до суббо́ты]{.ru}，[с четверга́]{.ru} 重音在词尾。
    第 7、8 题：月份用第二格：[с ию́ня до а́вгуста]{.ru}，[с сентября́ до ма́я]{.ru}。
- id: L68-05
  tags:
