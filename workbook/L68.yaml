- id: L68-01
  tags:
  - с … до …：时刻第二格
  task: 用 [с … до …]{.ru} 写出几点到几点（数词用词写出）。
  type: matrix
  cols:
  - 时间
  - '[с … до …]{.ru}'
  given:
  - 0
  rows:
  - base: 1 点 — 2 点
    cells:
    - 1 点 — 2 点
    - '[с ча́са до двух]{.ru}'
  - base: 2 点 — 4 点
    cells:
    - 2 点 — 4 点
    - '[с двух до четырёх]{.ru}'
  - base: 3 点 — 5 点
    cells:
    - 3 点 — 5 点
    - '[с трёх до пяти́]{.ru}'
  - base: 4 点 — 6 点
    cells:
    - 4 点 — 6 点
    - '[с четырёх до шести́]{.ru}'
  - base: 5 点 — 7 点
    cells:
    - 5 点 — 7 点
    - '[с пяти́ до семи́]{.ru}'
  - base: 6 点 — 8 点
    cells:
    - 6 点 — 8 点
    - '[с шести́ до восьми́]{.ru}'
  - base: 7 点 — 9 点
    cells:
    - 7 点 — 9 点
    - '[с семи́ до девяти́]{.ru}'
  - base: 8 点 — 10 点
    cells:
    - 8 点 — 10 点
    - '[с восьми́ до десяти́]{.ru}'
  - base: 9 点 — 11 点
    cells:
    - 9 点 — 11 点
    - '[с девяти́ до оди́ннадцати]{.ru}'
  - base: 10 点 — 12 点
    cells:
    - 10 点 — 12 点
    - '[с десяти́ до двена́дцати]{.ru}'
  - base: 11 点 — 1 点
    cells:
    - 11 点 — 1 点
    - '[с оди́ннадцати до ча́са]{.ru}'
  - base: 12 点 — 3 点
    cells:
    - 12 点 — 3 点
    - '[с двена́дцати до трёх]{.ru}'
  - base: 9 点 — 6 点
    cells:
    - 9 点 — 6 点
    - '[с девяти́ до шести́]{.ru}'
  - base: 8 点 — 5 点
    cells:
    - 8 点 — 5 点
    - '[с восьми́ до пяти́]{.ru}'
  why: |
    第 1–14 题：两个端点都用第二格，[часо́в]{.ru} 省略。
    第 1、11 题：“一点”说 [ча́са]{.ru}：[с ча́са, до ча́са]{.ru}。
    第 1–4、12 题：[два, три, четы́ре]{.ru} 的第二格是 [двух, трёх, четырёх]{.ru}。
    第 3–8、13、14 题：[пять — де́сять]{.ru} 把 [-ь]{.ru} 改成 [-и]{.ru}，重音移到词尾：[пяти́, шести́, семи́, восьми́, девяти́, десяти́]{.ru}；[во́семь]{.ru} 还要去掉 [е]{.ru}：[восьми́]{.ru}。
    第 9–12 题：[оди́ннадцать, двена́дцать]{.ru} 也把 [-ь]{.ru} 改成 [-и]{.ru}，但重音不动：[оди́ннадцати, двена́дцати]{.ru}。
