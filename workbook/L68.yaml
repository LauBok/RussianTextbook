  - base: '[янва́рь — ию́нь]{.ru}'
    cells:
    - '[янва́рь — ию́нь]{.ru}'
    - '[с января́ до ию́ня]{.ru}'
  - base: '[февра́ль — апре́ль]{.ru}'
    cells:
    - '[февра́ль — апре́ль]{.ru}'
    - '[с февраля́ до апре́ля]{.ru}'
  - base: '[ию́ль — а́вгуст]{.ru}'
    cells:
    - '[ию́ль — а́вгуст]{.ru}'
    - '[с ию́ля до а́вгуста]{.ru}'
  - base: '[суббо́та — воскресе́нье]{.ru}'
    cells:
    - '[суббо́та — воскресе́нье]{.ru}'
