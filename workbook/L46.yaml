heading: 第 46 课　命令式
groups:
- id: L46-01
  tags: [命令式：-й 型]
  task: 写出单数和复数命令式。
  type: matrix
  cols: [不定式, 单数命令式, 复数命令式]
  given: [0]
  rows:
  - {base: '[чита́ть]{.ru}', cells: ['[чита́ть]{.ru}', '[чита́й]{.ru}', '[чита́йте]{.ru}']}
  - {base: '[де́лать]{.ru}', cells: ['[де́лать]{.ru}', '[де́лай]{.ru}', '[де́лайте]{.ru}']}
  - {base: '[отдыха́ть]{.ru}', cells: ['[отдыха́ть]{.ru}', '[отдыха́й]{.ru}', '[отдыха́йте]{.ru}']}
  - {base: '[отвеча́ть]{.ru}', cells: ['[отвеча́ть]{.ru}', '[отвеча́й]{.ru}', '[отвеча́йте]{.ru}']}
  - {base: '[слу́шать]{.ru}', cells: ['[слу́шать]{.ru}', '[слу́шай]{.ru}', '[слу́шайте]{.ru}']}
  - {base: '[гуля́ть]{.ru}', cells: ['[гуля́ть]{.ru}', '[гуля́й]{.ru}', '[гуля́йте]{.ru}']}
  - {base: '[игра́ть]{.ru}', cells: ['[игра́ть]{.ru}', '[игра́й]{.ru}', '[игра́йте]{.ru}']}
  - {base: '[рабо́тать]{.ru}', cells: ['[рабо́тать]{.ru}', '[рабо́тай]{.ru}', '[рабо́тайте]{.ru}']}
  - {base: '[повторя́ть]{.ru}', new: true, gloss: 复习，重复（未完成体）, cells: ['[повторя́ть]{.ru}', '[повторя́й]{.ru}', '[повторя́йте]{.ru}']}
  - {base: '[ду́мать]{.ru}', cells: ['[ду́мать]{.ru}', '[ду́май]{.ru}', '[ду́майте]{.ru}']}
  - {base: '[покупа́ть]{.ru}', cells: ['[покупа́ть]{.ru}', '[покупа́й]{.ru}', '[покупа́йте]{.ru}']}
  - {base: '[спра́шивать]{.ru}', cells: ['[спра́шивать]{.ru}', '[спра́шивай]{.ru}', '[спра́шивайте]{.ru}']}
  - {base: '[у́жинать]{.ru}', cells: ['[у́жинать]{.ru}', '[у́жинай]{.ru}', '[у́жинайте]{.ru}']}
  - {base: '[откры́ть]{.ru}', cells: ['[откры́ть]{.ru}', '[откро́й]{.ru}', '[откро́йте]{.ru}']}
  - {base: '[помы́ть]{.ru}', hint: '[они́ помо́ют]{.ru}', new: true, gloss: 洗（完成体）, cells: ['[помы́ть]{.ru}', '[помо́й]{.ru}', '[помо́йте]{.ru}']}
  why: |
    第 1–13 题：[они́]{.ru} 的形式去掉 [-ют]{.ru}，词干以元音结尾（[чита́-, отвеча́-, повторя́-]{.ru}），加 [-й]{.ru}；复数再加 [-те]{.ru}。重音和现在时一样。
    第 14、15 题：命令式从现在时（将来时）词干构成，不从不定式构成：[откро́ют → откро́й]{.ru}，[помо́ют → помо́й]{.ru}，不能写成 [откры́й, помы́й]{.ru}。
- id: L46-02
  tags: [命令式：-и 型]
  task: 写出单数和复数命令式。
  type: matrix
  cols: [不定式, 单数命令式, 复数命令式]
  given: [0]
  rows:
  - {base: '[говори́ть]{.ru}', cells: ['[говори́ть]{.ru}', '[говори́]{.ru}', '[говори́те]{.ru}']}
  - {base: '[сказа́ть]{.ru}', cells: ['[сказа́ть]{.ru}', '[скажи́]{.ru}', '[скажи́те]{.ru}']}
  - {base: '[написа́ть]{.ru}', cells: ['[написа́ть]{.ru}', '[напиши́]{.ru}', '[напиши́те]{.ru}']}
  - {base: '[посмотре́ть]{.ru}', cells: ['[посмотре́ть]{.ru}', '[посмотри́]{.ru}', '[посмотри́те]{.ru}']}
  - {base: '[взять]{.ru}', cells: ['[взять]{.ru}', '[возьми́]{.ru}', '[возьми́те]{.ru}']}
  - {base: '[извини́ть]{.ru}', cells: ['[извини́ть]{.ru}', '[извини́]{.ru}', '[извини́те]{.ru}']}
  - {base: '[повтори́ть]{.ru}', cells: ['[повтори́ть]{.ru}', '[повтори́]{.ru}', '[повтори́те]{.ru}']}
  - {base: '[объясни́ть]{.ru}', cells: ['[объясни́ть]{.ru}', '[объясни́]{.ru}', '[объясни́те]{.ru}']}
  - {base: '[купи́ть]{.ru}', cells: ['[купи́ть]{.ru}', '[купи́]{.ru}', '[купи́те]{.ru}']}
  - {base: '[спроси́ть]{.ru}', cells: ['[спроси́ть]{.ru}', '[спроси́]{.ru}', '[спроси́те]{.ru}']}
  - {base: '[показа́ть]{.ru}', cells: ['[показа́ть]{.ru}', '[покажи́]{.ru}', '[покажи́те]{.ru}']}
  - {base: '[рассказа́ть]{.ru}', cells: ['[рассказа́ть]{.ru}', '[расскажи́]{.ru}', '[расскажи́те]{.ru}']}
  - {base: '[ждать]{.ru}', cells: ['[ждать]{.ru}', '[жди]{.ru}', '[жди́те]{.ru}']}
  - {base: '[писа́ть]{.ru}', cells: ['[писа́ть]{.ru}', '[пиши́]{.ru}', '[пиши́те]{.ru}']}
  - {base: '[учи́ть]{.ru}', cells: ['[учи́ть]{.ru}', '[учи́]{.ru}', '[учи́те]{.ru}']}
  - {base: '[позвони́ть]{.ru}', hint: '[позвоню́, позвоня́т]{.ru}', new: true, gloss: 打（一次）电话, cells: ['[позвони́ть]{.ru}', '[позвони́]{.ru}', '[позвони́те]{.ru}']}
  why: |
    第 1–16 题：去掉 [они́]{.ru} 形式的词尾后，词干以辅音结尾，[я]{.ru} 的形式重音在词尾（[говорю́, скажу́, возьму́, жду]{.ru}），加重读的 [-и́]{.ru}，复数 [-и́те]{.ru}。
    第 2、3、5、11、12、14 题：命令式用现在时（将来时）的词干，交替保留：[скажи́, напиши́, покажи́, расскажи́, пиши́]{.ru}；[взять]{.ru} 的词干是 [возьм-]{.ru}，所以是 [возьми́]{.ru}。
    第 9、10 题：[купи́ть, спроси́ть]{.ru} 的 [я]{.ru} 形式有交替（[куплю́, спрошу́]{.ru}），但命令式按 [они́]{.ru} 的词干 [ку́п-, спро́с-]{.ru} 构成，不带交替：[купи́, спроси́]{.ru}，重音落在 [-и́]{.ru} 上。
    第 13 题：[жди]{.ru} 是单音节，不标重音；复数 [жди́те]{.ru}。
- id: L46-03
  tags: [命令式：-ь 型、-ся 动词与特殊形式]
  task: 写出单数和复数命令式。
  type: matrix
  cols: [不定式, 单数命令式, 复数命令式]
  given: [0]
  rows:
  - {base: '[встать]{.ru}', cells: ['[встать]{.ru}', '[встань]{.ru}', '[вста́ньте]{.ru}']}
  - {base: '[отве́тить]{.ru}', cells: ['[отве́тить]{.ru}', '[отве́ть]{.ru}', '[отве́тьте]{.ru}']}
  - {base: '[поста́вить]{.ru}', cells: ['[поста́вить]{.ru}', '[поста́вь]{.ru}', '[поста́вьте]{.ru}']}
  - {base: '[пригото́вить]{.ru}', cells: ['[пригото́вить]{.ru}', '[пригото́вь]{.ru}', '[пригото́вьте]{.ru}']}
  - {base: '[гото́вить]{.ru}', cells: ['[гото́вить]{.ru}', '[гото́вь]{.ru}', '[гото́вьте]{.ru}']}
  - {base: '[сесть]{.ru}', cells: ['[сесть]{.ru}', '[сядь]{.ru}', '[ся́дьте]{.ru}']}
  - {base: '[дать]{.ru}', cells: ['[дать]{.ru}', '[дай]{.ru}', '[да́йте]{.ru}']}
  - {base: '[дава́ть]{.ru}', cells: ['[дава́ть]{.ru}', '[дава́й]{.ru}', '[дава́йте]{.ru}']}
  - {base: '[есть]{.ru}', cells: ['[есть]{.ru}', '[ешь]{.ru}', '[е́шьте]{.ru}']}
  - {base: '[пить]{.ru}', cells: ['[пить]{.ru}', '[пей]{.ru}', '[пе́йте]{.ru}']}
  - {base: '[сади́ться]{.ru}', cells: ['[сади́ться]{.ru}', '[сади́сь]{.ru}', '[сади́тесь]{.ru}']}
  - {base: '[занима́ться]{.ru}', cells: ['[занима́ться]{.ru}', '[занима́йся]{.ru}', '[занима́йтесь]{.ru}']}
  - {base: '[учи́ться]{.ru}', cells: ['[учи́ться]{.ru}', '[учи́сь]{.ru}', '[учи́тесь]{.ru}']}
  - {base: '[возвраща́ться]{.ru}', cells: ['[возвраща́ться]{.ru}', '[возвраща́йся]{.ru}', '[возвраща́йтесь]{.ru}']}
  why: |
    第 1–6 题：词干以一个辅音结尾，[я]{.ru} 的形式重音在词干（[вста́ну, отве́чу, поста́влю, пригото́влю, гото́влю, ся́ду]{.ru}），加 [-ь]{.ru}。辅音交替不进入命令式：[отве́ть]{.ru}，不是 [отве́чь]{.ru}；[сесть]{.ru} 的词干是 [ся́д-]{.ru}，所以是 [сядь]{.ru}。
    第 7–10 题：特殊形式，要单独记：[дай, дава́й, ешь, пей]{.ru}。[дава́ть]{.ru} 的现在时没有 [-ва-]{.ru}（[даю́т]{.ru}），命令式却保留：[дава́й]{.ru}。
    第 11–14 题：先按不带 [-ся]{.ru} 的规则构成，再加尾：元音后加 [-сь]{.ru}（[сади́сь, учи́сь, сади́тесь, занима́йтесь]{.ru}），辅音 [-й]{.ru} 后加 [-ся]{.ru}（[занима́йся, возвраща́йся]{.ru}）。复数命令式都以 [-те]{.ru} 结尾，所以总是 [-тесь]{.ru}。
- id: L46-04
  tags: [命令式：体的选择]
  task: 判断命令式表示哪一种请求，填写序号。
  type: classify
  bins: [请对方做一件具体的事, 邀请、请对方开始做, 说一般应该怎样做, 叫对方不要做]
  items:
  - {text: '[Скажи́те, пожа́луйста, где по́чта?]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Сади́тесь, пожа́луйста.]{.ru}', answer: 邀请、请对方开始做}
  - {text: '[Чита́йте ка́ждый день.]{.ru}', answer: 说一般应该怎样做}
  - {text: '[Не пиши́те здесь.]{.ru}', answer: 叫对方不要做}
  - {text: '[Да́йте, пожа́луйста, конве́рт.]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Откро́йте, пожа́луйста, окно́.]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Отвеча́йте по-ру́сски.]{.ru}', answer: 说一般应该怎样做}
  - {text: '[Не опа́здывай!]{.ru}', answer: 叫对方不要做}
  - {text: '[Возьми́ хлеб.]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Пиши́те а́дрес по-англи́йски.]{.ru}', answer: 说一般应该怎样做}
  - {text: '[Повтори́те, пожа́луйста, ещё раз.]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Ешь, Ми́ша, ешь!]{.ru}', answer: 邀请、请对方开始做}
  - {text: '[Не смотри́ телеви́зор ве́чером.]{.ru}', answer: 叫对方不要做}
  - {text: '[Напиши́те ваш а́дрес вот здесь.]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Всегда́ говори́те по-ру́сски.]{.ru}', answer: 说一般应该怎样做}
  - {text: '[Объясни́те, пожа́луйста, э́то сло́во.]{.ru}', answer: 请对方做一件具体的事}
  - {text: '[Не покупа́й э́тот торт.]{.ru}', answer: 叫对方不要做}
  - {text: '[Пе́йте чай, пожа́луйста!]{.ru}', answer: 邀请、请对方开始做}
  why: |
    第 1、5、6、9、11、14、16 题：请对方做一件具体的事，要有结果（告诉地址、给信封、打开窗户、拿面包、再说一遍、写地址、讲明白），用完成体。
    第 2、12、18 题：邀请对方坐、吃、喝，请对方开始做，用未完成体；这类命令式很客气，不是生硬的命令。
    第 3、7、10、15 题：说一般应该怎样做（每天读、用俄语回答、用英文写地址、总说俄语），用未完成体。第 10 题和第 14 题都和写地址有关：第 14 题请对方把地址写下来，是具体的结果；第 10 题只说用什么语言写，是一般的做法。
    第 4、8、13、17 题：否定的命令式一般用未完成体：[не пиши́те, не опа́здывай, не смотри́, не покупа́й]{.ru}。
- id: L46-05
  tags: [命令式：按称呼选择单复数]
  task: 用括号里动词的命令式填空。
  type: fill
  items:
  - {stem: 'Ми́ша, ___ на стул!', hint: сесть, accept: [сядь]}
  - {stem: 'О́льга Ви́кторовна, ___, пожа́луйста, э́то сло́во.', hint: объясни́ть, accept: [объясни́те]}
  - {stem: 'Ма́ма, ___ хлеб, пожа́луйста.', hint: купи́ть, accept: [купи́]}
  - {stem: 'Студе́нты, ___ упражне́ние!', hint: написа́ть, accept: [напиши́те]}
  - {stem: 'А́нна, ___ окно́, пожа́луйста.', hint: откры́ть, accept: [откро́й]}
  - {stem: 'Извини́те, ___, пожа́луйста, где по́чта?', hint: сказа́ть, accept: [скажи́те]}
  - {stem: 'Ю́ми, ___, пожа́луйста, по-ру́сски.', hint: отве́тить, accept: [отве́ть]}
  - {stem: 'Ива́н Серге́евич, ___, пожа́луйста.', hint: сади́ться, accept: [сади́тесь]}
  - {stem: 'Пьер и Ю́ми, ___ ка́ждый день!', hint: занима́ться, accept: [занима́йтесь]}
  why: |
    第 1、3、5、7 题：对家人、朋友说话用 [ты]{.ru} 的形式，单数命令式：[сядь, купи́, откро́й, отве́ть]{.ru}。
    第 2、6、8 题：对老师、陌生人、长辈用 [вы]{.ru} 的形式：[объясни́те, скажи́те, сади́тесь]{.ru}。第 6 题前面的 [Извини́те]{.ru} 已经说明对方是陌生人。
    第 4、9 题：对几个人说话，不论关系多近，都用复数：[напиши́те, занима́йтесь]{.ru}。
