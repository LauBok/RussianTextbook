  - L88
  - L89
  recycles:
  - L88-02
  - L89-03
- id: L89-综合-c
  tags:
  - 综合：间接引语连接与 ли 位置核查
  task: 判断间接引语是否正确。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: А́нна спроси́ла, когда́ я бу́ду до́ма.
    answer: 正确
  - text: А́нна спроси́ла, что когда́ я бу́ду до́ма.
    answer: 有错
  - text: Пьер сказа́л, что он купи́л биле́ты.
    answer: 正确
  - text: Пьер сказа́л, ли он купи́л биле́ты.
    answer: 有错
  - text: Ма́ма спроси́ла, хочу́ ли я есть.
    answer: 正确
  - text: Ма́ма спроси́ла, е́сли я хочу́ есть.
    answer: 有错
  - text: Ми́ша спроси́л, где мой слова́рь?
    answer: 有错
  - text: Ю́ми спроси́ла, свобо́ден ли я ве́чером.
    answer: 正确
  - text: Ю́ми спроси́ла, я ли свобо́ден ве́чером.
    answer: 正确
  - text: Ка́тя сказа́ла, что позвони́т ве́чером.
    answer: 正确
  - text: Ка́тя спроси́ла, что А́ня бу́дет до́ма.
    answer: 有错
  - text: О́льга Ви́кторовна спроси́ла, гото́вы ли мы к контро́льной.
    answer: 正确
  - text: О́льга Ви́кторовна спроси́ла, мы гото́вы ли к контро́льной.
    answer: 有错
  - text: Па́па спроси́л, куда́ мы идём.
    answer: 正确
  - text: Па́па спроси́л, куда́ ли мы идём.
    answer: 有错
  - text: Я не по́мню, говори́л ли он о конце́рте.
    answer: 正确
  why: '第 1、3、5、8、10、12、14、16 题：连接方式和词序都正确。第 9 题也正确：焦点是 [я]{.ru}，意思是“是不是我有空”，与第 8 题“我有没有空”焦点不同。

    第 2 题：带疑问词的转述不再加 [что]{.ru}。第 15 题：有疑问词就不用 [ли]{.ru}。

    第 4 题：[сказа́л]{.ru} 转述的是陈述句，用 [что]{.ru}：[что он купи́л биле́ты]{.ru}；何况 [ли]{.ru} 也不能放在从句开头。第 6、11 题：[спроси́ла]{.ru} 转述一般疑问句，要用焦点词 + [ли]{.ru}：[хочу́ ли я есть]{.ru}，[бу́дет ли А́ня до́ма]{.ru}，不能用 [е́сли]{.ru} 或 [что]{.ru}。

    第 7 题：间接疑问句是陈述句，句末用句号。第 13 题：[ли]{.ru} 紧跟焦点词：[гото́вы ли мы]{.ru}。'
  lessons:
  - L88
  - L89
  recycles:
  - L89-02
  - L88-04
- id: L89-综合-d
  tags:
  - 综合：间接引语的连接词与人称
  task: 按原话补全转述句。
  type: fill
  items:
  - stem: «Я позвоню́ ве́чером». — Ка́тя сказа́ла, ___ позвони́т ве́чером.
    accept:
    - что
  - stem: «Когда́ ты вернёшься?» — А́нна спроси́ла, ___ я верну́сь.
    accept:
    - когда́
  - stem: «Ты здоро́в?» — Врач спроси́л, здоро́в ___ я.
    accept:
    - ли
  - stem: «Где бу́дет конце́рт?» — Пьер спроси́л, ___ бу́дет конце́рт.
    accept:
    - где
  - stem: «Ты сде́лал уро́ки?» — Па́па спроси́л Ми́шу, ___ ли он уро́ки.
    accept:
    - сде́лал
  - stem: «У меня́ контро́льная». — Ми́ша сказа́л, что у ___ контро́льная.
    accept:
    - него́
  - stem: «Что ты чита́ешь?» — Ма́ма спроси́ла, что я ___.
    accept:
    - чита́ю
  - stem: «Вы гото́вы?» — О́льга Ви́кторовна спроси́ла, ___ ли мы.
    accept:
    - гото́вы
  - stem: «Кто звони́л?» — Ба́бушка спроси́ла, ___ звони́л.
    accept:
    - кто
  - stem: «У тебя́ есть зонт?» — Ю́ми спроси́ла, ___ ли у меня́ зонт.
    accept:
    - есть
  - stem: «Я куплю́ биле́ты». — А́нна сказа́ла, что ___ биле́ты.
    accept:
    - ку́пит
  - stem: «Ты пойдёшь в кино́?» — Пьер спроси́л, ___ ли я в кино́.
    accept:
    - пойду́
  - stem: «Куда́ ты идёшь?» — Ми́ша спроси́л, куда́ я ___.
    accept:
    - иду́
  - stem: «Мы бу́дем у ба́бушки». — Петро́вы сказа́ли, что ___ у ба́бушки.
    accept:
    - бу́дут
  - stem: «Ты зна́ешь, где он живёт?» — Ю́ми спроси́ла, зна́ю ___ я, где он живёт.
    accept:
    - ли
  - stem: «Почему́ ты не позвони́л?» — О́льга Ви́кторовна спроси́ла, ___ я не позвони́л.
    accept:
    - почему́
  - stem: «Я ду́маю о тебе́». — А́нна сказа́ла мне, что ду́мает обо ___.
    accept:
    - мне
  - stem: «Где твой брат?» — Пьер спроси́л меня́, где ___ брат.
    accept:
    - мой
  - stem: «Ты был в Петербу́рге?» — Ю́ми спроси́ла, был ___ я в Петербу́рге.
    accept:
    - ли
  - stem: «Мне ну́жен слова́рь». — Ми́ша сказа́л, что ___ ну́жен слова́рь.
    accept:
    - ему́
  why: '第 1 题：陈述句用 [что]{.ru}。第 2、4、9、16 题：保留原来的疑问词 [когда́, где, кто, почему́]{.ru}。第 3、15、19 题：一般疑问句，[ли]{.ru} 跟在焦点词后。

    第 5、8、10、12 题：[ли]{.ru} 前面是焦点词，按转述角度变人称：[ты сде́лал → он сде́лал]{.ru}，[вы гото́вы → мы гото́вы]{.ru}，[у тебя́ есть → у меня́ есть]{.ru}，[ты пойдёшь → я пойду́]{.ru}。

    第 6、7、11、13、14、17、18、20 题：说话人的 [я, у меня́, мы, мне]{.ru} 变成第三人称 [у него́, ку́пит, бу́дут, ему́]{.ru}；听话人的 [ты, тебе́, твой]{.ru} 变成转述人自己的 [я, мне, мой]{.ru}：[я чита́ю, я иду́, обо мне, мой брат]{.ru}。动词的时都保持原话不变。'
  lessons:
  - L88
  - L89
  recycles:
  - L88-01
  - L89-01
  - L88-02
