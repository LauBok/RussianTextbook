heading: 综合练习　间接引语
lessons:
- L88
- L89
groups:
- id: L89-综合-a
  tags:
  - 综合：间接引语的三种连接方式
  task: 把原话转述成间接引语时用哪种连接方式？给原话归类。
  type: classify
  bins:
  - '[что]{.ru}'
  - 保留疑问词
  - 焦点词 + [ли]{.ru}
  items:
  - text: «Я бу́ду до́ма в шесть».
    answer: '[что]{.ru}'
  - text: «Ты бу́дешь до́ма в шесть?»
    answer: 焦点词 + [ли]{.ru}
  - text: «Когда́ ты бу́дешь до́ма?»
    answer: 保留疑问词
  - text: «Что ты де́лаешь?»
    answer: 保留疑问词
  - text: «Ты де́лаешь упражне́ния?»
    answer: 焦点词 + [ли]{.ru}
  - text: «Я де́лаю упражне́ния».
    answer: '[что]{.ru}'
  - text: «Кто звони́л?»
    answer: 保留疑问词
  - text: «Звони́л Пьер».
    answer: '[что]{.ru}'
  - text: «Пьер звони́л?»
    answer: 焦点词 + [ли]{.ru}
  - text: «Где ты живёшь?»
    answer: 保留疑问词
  - text: «Ты живёшь в общежи́тии?»
    answer: 焦点词 + [ли]{.ru}
  - text: «Я живу́ у Петро́вых».
    answer: '[что]{.ru}'
  - text: «У тебя́ есть слова́рь?»
    answer: 焦点词 + [ли]{.ru}
  - text: «Чей э́то слова́рь?»
    answer: 保留疑问词
  - text: «Э́то мой слова́рь».
    answer: '[что]{.ru}'
  - text: «Ты гото́в к контро́льной?»
    answer: 焦点词 + [ли]{.ru}
  - text: «Почему́ ты не гото́в?»
    answer: 保留疑问词
  - text: «Я был бо́лен».
    answer: '[что]{.ru}'
  - text: «Куда́ вы идёте?»
    answer: 保留疑问词
  - text: «Вы идёте в теа́тр?»
    answer: 焦点词 + [ли]{.ru}
  why: '第 1、6、8、12、15、18 题：陈述句用 [что]{.ru}。

    第 3、4、7、10、14、17、19 题：带疑问词的问句保留原疑问词：[когда́, что, кто, где, чей, почему́, куда́]{.ru}。第 4 题的 [что]{.ru} 是疑问词“什么”。

    第 2、5、9、11、13、16、20 题：不带疑问词的一般疑问句，用焦点词 + [ли]{.ru}：[бу́ду ли я до́ма, звони́л ли Пьер, есть ли у меня́ слова́рь]{.ru}。同样的词，陈述句和问句的转述方法不同，如第 8、9 题。'
  lessons:
  - L88
  - L89
  recycles:
  - L88-01
  - L89-04
- id: L89-综合-b
  tags:
  - 综合：说话者—转述者的人称对应
  task: 安娜对王磊说了下面的话。写出两种转述的从句：王磊对米沙转述；米沙听到了，再对王磊转述。
  type: matrix
  cols:
  - 安娜的原话
  - 王磊对米沙说
  - 米沙对王磊说
  given:
  - 0
  rows:
  - base: '[«Я позвоню́ тебе́».]{.ru}'
    cells:
    - '[«Я позвоню́ тебе́».]{.ru}'
    - '[что она́ позвони́т мне]{.ru}'
    - '[что она́ позвони́т тебе́]{.ru}'
  - base: '[«Ты здоро́в?»]{.ru}'
    cells:
    - '[«Ты здоро́в?»]{.ru}'
    - '[здоро́в ли я]{.ru}'
    - '[здоро́в ли ты]{.ru}'
  - base: '[«Где твоя́ кни́га?»]{.ru}'
    cells:
    - '[«Где твоя́ кни́га?»]{.ru}'
    - '[где моя́ кни́га]{.ru}'
    - '[где твоя́ кни́га]{.ru}'
  - base: '[«У тебя́ есть биле́т?»]{.ru}'
    cells:
    - '[«У тебя́ есть биле́т?»]{.ru}'
    - '[есть ли у меня́ биле́т]{.ru}'
    - '[есть ли у тебя́ биле́т]{.ru}'
  - base: '[«Я жду тебя́».]{.ru}'
    cells:
    - '[«Я жду тебя́».]{.ru}'
    - '[что она́ ждёт меня́]{.ru}'
    - '[что она́ ждёт тебя́]{.ru}'
  - base: '[«Когда́ ты вернёшься?»]{.ru}'
    cells:
    - '[«Когда́ ты вернёшься?»]{.ru}'
    - '[когда́ я верну́сь]{.ru}'
    - '[когда́ ты вернёшься]{.ru}'
  - base: '[«Ты пойдёшь в кино́?»]{.ru}'
    cells:
    - '[«Ты пойдёшь в кино́?»]{.ru}'
    - '[пойду́ ли я в кино́]{.ru}'
    - '[пойдёшь ли ты в кино́]{.ru}'
  - base: '[«Мне ску́чно».]{.ru}'
    cells:
    - '[«Мне ску́чно».]{.ru}'
    - '[что ей ску́чно]{.ru}'
    - '[что ей ску́чно]{.ru}'
  - base: '[«Что ты чита́ешь?»]{.ru}'
    cells:
    - '[«Что ты чита́ешь?»]{.ru}'
    - '[что я чита́ю]{.ru}'
    - '[что ты чита́ешь]{.ru}'
  - base: '[«Ты зна́ешь мой а́дрес?»]{.ru}'
    cells:
    - '[«Ты зна́ешь мой а́дрес?»]{.ru}'
    - '[зна́ю ли я её а́дрес]{.ru}'
    - '[зна́ешь ли ты её а́дрес]{.ru}'
  - base: '[«Твой брат до́ма?»]{.ru}'
    cells:
    - '[«Твой брат до́ма?»]{.ru}'
    - '[до́ма ли мой брат]{.ru}'
    - '[до́ма ли твой брат]{.ru}'
  - base: '[«Я купи́ла тебе́ пода́рок».]{.ru}'
    cells:
    - '[«Я купи́ла тебе́ пода́рок».]{.ru}'
    - '[что она́ купи́ла мне пода́рок]{.ru}'
    - '[что она́ купи́ла тебе́ пода́рок]{.ru}'
  - base: '[«Я тебе́ напишу́».]{.ru}'
    cells:
    - '[«Я тебе́ напишу́».]{.ru}'
    - '[что она́ мне напи́шет]{.ru}'
    - '[что она́ тебе́ напи́шет]{.ru}'
  - base: '[«Ты уста́л?»]{.ru}'
    cells:
    - '[«Ты уста́л?»]{.ru}'
    - '[уста́л ли я]{.ru}'
    - '[уста́л ли ты]{.ru}'
  - base: '[«Куда́ ты идёшь?»]{.ru}'
    cells:
    - '[«Куда́ ты идёшь?»]{.ru}'
    - '[куда́ я иду́]{.ru}'
    - '[куда́ ты идёшь]{.ru}'
  - base: '[«Ты ви́дел мой телефо́н?»]{.ru}'
    cells:
    - '[«Ты ви́дел мой телефо́н?»]{.ru}'
    - '[ви́дел ли я её телефо́н]{.ru}'
    - '[ви́дел ли ты её телефо́н]{.ru}'
  why: '说话人安娜的 [я, мой, мне]{.ru} 在两种转述里都变成 [она́, её, ей]{.ru}（第 1、5、8、10、12、13、16 题）。

    听话人是王磊：王磊自己转述时，[ты, твой, тебе́, у тебя́]{.ru} 变成 [я, мой, мне, у меня́]{.ru}；米沙对王磊转述时，王磊就是米沙的听话人，仍是 [ты, твой, тебе́]{.ru}。动词随主语变：[ты вернёшься → я верну́сь]{.ru}（第 6 题）。

    连接方式：陈述句加 [что]{.ru}（第 1、5、8、12、13 题），带疑问词的问句保留疑问词（第 3、6、9、15 题），一般疑问句用焦点词 + [ли]{.ru}（第 2、4、7、10、11、14、16 题）。'
