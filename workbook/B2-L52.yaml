heading: 第 52 课　让步从句：хотя́、несмотря́ на то что
groups:
- id: B2-L52-01
  tags:
  - 让步与原因
  task: 两件事是顺理成章还是出乎意料？按该用的连接词归栏。
  type: classify
  bins:
  - '[так как]{.ru}（顺理成章）'
  - '[хотя́]{.ru}（出乎意料）'
  items:
  - text: '[Ди́ма уста́л — он пошёл спать.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[Шёл дождь — мы пошли́ гуля́ть.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  - text: '[Шёл дождь — мы оста́лись до́ма.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[Бы́ло хо́лодно — де́ти игра́ли на у́лице.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  - text: '[Пьер был голо́дный — он пошёл в столо́вую.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[Экза́мен был тру́дный — все сда́ли его́.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  - text: '[Экза́мен был тру́дный — мно́гие не сда́ли его́.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[Ми́ша заболе́л — он пошёл на матч.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  - text: '[Бы́ло хо́лодно — ма́ма наде́ла пальто́.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[У ба́бушки ма́ло де́нег — она́ всем купи́ла пода́рки.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  - text: '[Ми́ша заболе́л — он не пошёл в шко́лу.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[Ю́ми живёт в Москве́ то́лько год — она́ хорошо́ говори́т по-ру́сски.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  - text: '[Ди́ма мно́го занима́лся — он сдал экза́мен.]{.ru}'
    answer: '[так как]{.ru}（顺理成章）'
  - text: '[Ди́ма мно́го занима́лся — он не сдал экза́мен.]{.ru}'
    answer: '[хотя́]{.ru}（出乎意料）'
  why: |-
    第 1、3、5、7、9、11、13 题：前一件事自然导致后一件事，是原因：[Так как шёл дождь, мы оста́лись до́ма.]{.ru}
    第 2、4、6、8、10、12、14 题：前一件事本来会导致相反的结果，后一件事却还是发生了，是让步：[Хотя́ шёл дождь, мы пошли́ гуля́ть.]{.ru}
    同一个原因（下雨、生病、考试难）可以引出两种结果，要看后半句再判断。
- id: B2-L52-02
  tags:
  - 让步从句：合句
  task: 用括号里的连接词把两句合成一句，只写出空里的从句。
  type: fill
  items:
  - stem: Бы́ло хо́лодно. Де́ти игра́ли во дворе́. → ___, де́ти игра́ли во дворе́.
    hint: хотя́
    accept:
    - Хотя́ бы́ло хо́лодно
  - stem: Пьер пло́хо себя́ чу́вствовал. Он пришёл на заня́тия. → ___, он пришёл на заня́тия.
    hint: несмотря́ на то что
    accept:
    - Несмотря́ на то что Пьер пло́хо себя́ чу́вствовал
  - stem: Ю́ми ещё не была́ в Каза́ни. Она́ мно́го зна́ет о Каза́ни. → ___, она́ мно́го зна́ет о Каза́ни.
    hint: хотя́
    accept:
    - Хотя́ Ю́ми ещё не была́ в Каза́ни
  - stem: Ми́ша о́чень хоте́л спать. Он де́лал уро́ки. → ___, он де́лал уро́ки.
    hint: хотя́
    accept:
    - Хотя́ Ми́ша о́чень хоте́л спать
  - stem: Ба́бушке во́семьдесят лет. Она́ ка́ждый день гуля́ет в па́рке. → ___, она́ ка́ждый день гуля́ет в па́рке.
    hint: несмотря́ на то что
    accept:
    - Несмотря́ на то что ба́бушке во́семьдесят лет
  - stem: Ди́ма сдал зачёт. Он почти́ не гото́вился. → Ди́ма сдал зачёт, ___.
    hint: хотя́
    accept:
    - хотя́ он почти́ не гото́вился
  - stem: Мы купи́ли биле́ты. Они́ бы́ли о́чень дороги́е. → Мы купи́ли биле́ты, ___.
    hint: несмотря́ на то что
    accept:
    - несмотря́ на то что они́ бы́ли о́чень дороги́е
  - stem: Ван Лэй не спал всю ночь. Он отве́тил на все вопро́сы. → ___, он отве́тил на все вопро́сы.
    hint: хотя́
    accept:
    - Хотя́ Ван Лэй не спал всю ночь
  - stem: Ве́чер был тёплый. Ма́ма взяла́ ку́ртку. → Ма́ма взяла́ ку́ртку, ___.
    hint: хотя́
    accept:
    - хотя́ ве́чер был тёплый
  - stem: Ди́ма живёт далеко́. Он никогда́ не опа́здывает. → ___, он никогда́ не опа́здывает.
    hint: несмотря́ на то что
    accept:
    - Несмотря́ на то что Ди́ма живёт далеко́
  why: |-
    [хотя́]{.ru} 和 [несмотря́ на то что]{.ru} 引出“本来会妨碍”的那件事，主句不再加 [но]{.ru}。
    第 1、3、4、8、10 题和第 2、5 题：从句放在前面，名词主语放进从句，主句用代词：[Хотя́ Ми́ша о́чень хоте́л спать, он де́лал уро́ки.]{.ru}
    第 6、7、9 题：从句放在主句后面，前面加逗号。
    第 2、5、7、10 题：[несмотря́ на то что]{.ru} 的 [то]{.ru} 不能漏，也不能拆开。
- id: B2-L52-03
  tags:
  - несмотря на + 第四格
