  why: |-
    [несмотря́ на]{.ru} 后面用第四格。
    第 1、3、7、8、11 题：阳性非动物名词第四格同第一格：[на дождь, на си́льный ве́тер]{.ru}。
    第 4、5 题：阴性 [-ь]{.ru} 名词第四格不变：[на боле́знь, на уста́лость]{.ru}。
    第 2、9、10、13、14 题：阴性 [-а]{.ru} 名词第四格 [-у]{.ru}，形容词 [-ую]{.ru}：[на плоху́ю пого́ду, на холо́дную зи́му, на высо́кую це́ну]{.ru}。[зи́му, це́ну]{.ru} 重音移到词干。
    第 6、12 题：复数非动物同第一格：[на тру́дные экза́мены, на мои́ про́сьбы]{.ru}。
