heading: 第 1 课　主动形动词现在时
groups:
- id: B3-L01-01
  lessons:
  - B3-L01
  tags:
  - 主动形动词现在时：构成
  - 主动形动词现在时：-ся 动词
  - 主动形动词现在时：完成体没有
  task: 写出动词的复数第三人称和主动形动词现在时（阳性第一格）。
  type: matrix
  cols:
  - 不定式
  - 复数第三人称
  - 主动形动词现在时
  given:
  - 0
  rows:
  - base: '[везти́]{.ru}'
    cells:
    - '[везти́]{.ru}'
    - '[везу́т]{.ru}'
    - '[везу́щий]{.ru}'
  - base: '[расти́]{.ru}'
    cells:
    - '[расти́]{.ru}'
    - '[расту́т]{.ru}'
    - '[расту́щий]{.ru}'
  - base: '[пла́кать]{.ru}'
    cells:
    - '[пла́кать]{.ru}'
    - '[пла́чут]{.ru}'
    - '[пла́чущий]{.ru}'
  - base: '[иска́ть]{.ru}'
    cells:
    - '[иска́ть]{.ru}'
    - '[и́щут]{.ru}'
    - '[и́щущий]{.ru}'
  - base: '[пря́таться]{.ru}'
    cells:
    - '[пря́таться]{.ru}'
    - '[пря́чутся]{.ru}'
    - '[пря́чущийся]{.ru}'
    hint: пря́чусь, пря́чешься
    new: true
    gloss: 躲藏
  - base: '[прочита́ть]{.ru}'
    cells:
    - '[прочита́ть]{.ru}'
    - '[прочита́ют]{.ru}'
    - —
  - base: '[рисова́ть]{.ru}'
    cells:
    - '[рисова́ть]{.ru}'
    - '[рису́ют]{.ru}'
    - '[рису́ющий]{.ru}'
  - base: '[петь]{.ru}'
    cells:
    - '[петь]{.ru}'
    - '[пою́т]{.ru}'
    - '[пою́щий]{.ru}'
  - base: '[открыва́ть]{.ru}'
    cells:
    - '[открыва́ть]{.ru}'
    - '[открыва́ют]{.ru}'
    - '[открыва́ющий]{.ru}'
  - base: '[улыба́ться]{.ru}'
    cells:
    - '[улыба́ться]{.ru}'
    - '[улыба́ются]{.ru}'
    - '[улыба́ющийся]{.ru}'
  - base: '[молча́ть]{.ru}'
    cells:
    - '[молча́ть]{.ru}'
    - '[молча́т]{.ru}'
    - '[молча́щий]{.ru}'
  - base: '[держа́ть]{.ru}'
    cells:
    - '[держа́ть]{.ru}'
    - '[де́ржат]{.ru}'
    - '[держа́щий]{.ru}'
  - base: '[стуча́ть]{.ru}'
    cells:
    - '[стуча́ть]{.ru}'
    - '[стуча́т]{.ru}'
    - '[стуча́щий]{.ru}'
    hint: стучу́, стучи́шь
    new: true
    gloss: 敲
  - base: '[учи́ться]{.ru}'
    cells:
    - '[учи́ться]{.ru}'
    - '[у́чатся]{.ru}'
    - '[уча́щийся]{.ru}'
  - base: '[реши́ть]{.ru}'
    cells:
    - '[реши́ть]{.ru}'
    - '[реша́т]{.ru}'
    - —
  - base: '[спать]{.ru}'
    cells:
    - '[спать]{.ru}'
    - '[спят]{.ru}'
    - '[спя́щий]{.ru}'
  - base: '[смотре́ть]{.ru}'
    cells:
    - '[смотре́ть]{.ru}'
    - '[смо́трят]{.ru}'
    - '[смотря́щий]{.ru}'
  - base: '[люби́ть]{.ru}'
    cells:
    - '[люби́ть]{.ru}'
    - '[лю́бят]{.ru}'
    - '[лю́бящий]{.ru}'
  - base: '[гото́виться]{.ru}'
    cells:
    - '[гото́виться]{.ru}'
    - '[гото́вятся]{.ru}'
    - '[гото́вящийся]{.ru}'
  why: |-
    第 1–4 题：复数第三人称以 [-ут]{.ru} 结尾，去 [-т]{.ru} 加 [-щий]{.ru}：[везу́щий, расту́щий, пла́чущий, и́щущий]{.ru}。[пла́чут, и́щут]{.ru} 里的交替保留在形动词里，重音同复数第三人称。
    第 5、10、14、19 题：[-ся]{.ru} 动词的形动词后面一律写 [-ся]{.ru}：[пря́чущийся, улыба́ющийся, уча́щийся, гото́вящийся]{.ru}；元音后面也不改成 [-сь]{.ru}，这一点和动词变位不同（[улыба́юсь]{.ru}）。
    第 6、15 题：[прочита́ть, реши́ть]{.ru} 是完成体，[прочита́ют, реша́т]{.ru} 是将来时，完成体没有现在时，也就没有现在时形动词，写“—”。常见错误是照样写出 [прочита́ющий]{.ru}。
    第 7–9 题：[-ют → -ющий]{.ru}：[рису́ющий, пою́щий, открыва́ющий]{.ru}；[петь]{.ru} 要由 [пою́т]{.ru} 构成，不能由不定式推。
    第 11–14 题：第二变位 [-ат → -ащий]{.ru}：[молча́щий, держа́щий, стуча́щий, уча́щийся]{.ru}。第二变位形动词的重音多半和单数第一人称相同：[держу́ → держа́щий]{.ru}，[учу́сь → уча́щийся]{.ru}，不随复数第三人称 [де́ржат, у́чатся]{.ru}。
    第 16–19 题：[-ят → -ящий]{.ru}：[спя́щий, смотря́щий]{.ru}（[смотрю́ → смотря́щий]{.ru}）。第 18 题 [лю́бящий]{.ru} 是课文讲的例外，重音不随 [люблю́]{.ru}。第 19 题 [в → вл]{.ru} 的交替只在单数第一人称（[гото́влюсь]{.ru}），形动词由 [гото́вятся]{.ru} 构成，没有 [л]{.ru}：[гото́вящийся]{.ru}。
- id: B3-L01-02
  lessons:
  - B3-L01
  tags:
  - 主动形动词现在时：与被说明的名词一致
  - 主动形动词现在时：与 кото́рый 从句互换
  task: 把从句换成形动词：写出与名词一致的主动形动词现在时。
  type: matrix
  cols:
  - 名词 + 从句
  - 形动词
  given:
  - 0
  rows:
  - base: '[о де́вушке, кото́рая поёт в хо́ре]{.ru}'
    cells:
    - '[о де́вушке, кото́рая поёт в хо́ре]{.ru}'
    - '[пою́щей]{.ru}'
  - base: '[с детьми́, кото́рые игра́ют во дворе́]{.ru}'
    cells:
    - '[с детьми́, кото́рые игра́ют во дворе́]{.ru}'
    - '[игра́ющими]{.ru}'
  - base: '[у мужчи́ны, кото́рый стои́т у окна́]{.ru}'
    cells:
    - '[у мужчи́ны, кото́рый стои́т у окна́]{.ru}'
    - '[стоя́щего]{.ru}'
  - base: '[к врачу́, кото́рый рабо́тает в поликли́нике]{.ru}'
    cells:
    - '[к врачу́, кото́рый рабо́тает в поликли́нике]{.ru}'
    - '[рабо́тающему]{.ru}'
  - base: '[для тури́стов, кото́рые интересу́ются исто́рией]{.ru}'
    cells:
    - '[для тури́стов, кото́рые интересу́ются исто́рией]{.ru}'
    - '[интересу́ющихся]{.ru}'
  - base: '[на студе́нтку, кото́рая сиди́т в пе́рвом ряду́]{.ru}'
    cells:
    - '[на студе́нтку, кото́рая сиди́т в пе́рвом ряду́]{.ru}'
    - '[сидя́щую]{.ru}'
  - base: '[о писа́теле, кото́рый живёт в дере́вне]{.ru}'
    cells:
    - '[о писа́теле, кото́рый живёт в дере́вне]{.ru}'
    - '[живу́щем]{.ru}'
  - base: '[письмо́ от сестры́, кото́рая у́чится в Каза́ни]{.ru}'
    cells:
    - '[письмо́ от сестры́, кото́рая у́чится в Каза́ни]{.ru}'
    - '[уча́щейся]{.ru}'
  - base: '[Мы ви́дели птиц, кото́рые лета́ют над мо́рем.]{.ru}'
    cells:
    - '[Мы ви́дели птиц, кото́рые лета́ют над мо́рем.]{.ru}'
    - '[лета́ющих]{.ru}'
  - base: '[ма́льчик, кото́рый пла́чет в коридо́ре]{.ru}'
    cells:
    - '[ма́льчик, кото́рый пла́чет в коридо́ре]{.ru}'
    - '[пла́чущий]{.ru}'
  - base: '[с учёным, кото́рый занима́ется фи́зикой]{.ru}'
    cells:
    - '[с учёным, кото́рый занима́ется фи́зикой]{.ru}'
    - '[занима́ющимся]{.ru}'
  - base: '[в до́ме, кото́рый стои́т на берегу́]{.ru}'
    cells:
    - '[в до́ме, кото́рый стои́т на берегу́]{.ru}'
    - '[стоя́щем]{.ru}'
  - base: '[Возьми́ письмо́, кото́рое лежи́т на столе́.]{.ru}'
    cells:
    - '[Возьми́ письмо́, кото́рое лежи́т на столе́.]{.ru}'
    - '[лежа́щее]{.ru}'
  - base: '[о́кна, кото́рые выхо́дят на у́лицу]{.ru}'
    cells:
    - '[о́кна, кото́рые выхо́дят на у́лицу]{.ru}'
    - '[выходя́щие]{.ru}'
  why: |-
    第 1、6、8 题：被说明的名词是阴性单数，形动词跟着它变：第六格 [о де́вушке → пою́щей]{.ru}，第四格 [на студе́нтку → сидя́щую]{.ru}，第二格 [от сестры́ → уча́щейся]{.ru}。从句里的 [кото́рая]{.ru} 是第一格，但形动词的格不看 [кото́рый]{.ru}，只看名词。
    第 2、5、9、14 题：复数：第五格 [с детьми́ → игра́ющими]{.ru}，第二格 [для тури́стов → интересу́ющихся]{.ru}；第 9 题 [птиц]{.ru} 是动物名词复数第四格，同第二格：[лета́ющих]{.ru}；第 14 题 [о́кна]{.ru} 是第一格：[выходя́щие]{.ru}（[выхожу́ → выходя́щий]{.ru}，重音在 [я]{.ru} 上）。
    第 3、4、7、10–12 题：阳性单数：第二格 [стоя́щего]{.ru}，第三格 [рабо́тающему]{.ru}，第六格 [живу́щем, стоя́щем]{.ru}，第五格 [занима́ющимся]{.ru}，第一格 [пла́чущий]{.ru}。[-ся]{.ru} 动词的 [-ся]{.ru} 放在格词尾之后：[занима́ющимся, интересу́ющихся, уча́щейся]{.ru}。
    第 13 题：[письмо́]{.ru} 是中性第四格，同第一格：[лежа́щее]{.ru}。
- id: B3-L01-03
  lessons:
  - B3-L01
  tags:
  - 主动形动词现在时：改错
  task: 改正错误，正确的照抄（只写形动词）。
  type: matrix
  cols:
  - 词组
  - 改正
  given:
  - 0
  rows:
  - base: '[студе́нты, напи́шущие письмо́]{.ru}'
    cells:
    - '[студе́нты, напи́шущие письмо́]{.ru}'
    - '[пи́шущие]{.ru}'
  - base: '[лю́ди, стро́ющие мост]{.ru}'
    cells:
    - '[лю́ди, стро́ющие мост]{.ru}'
    - '[стро́ящие]{.ru}'
  - base: '[сестра́, занима́ющаясь спо́ртом]{.ru}'
    cells:
    - '[сестра́, занима́ющаясь спо́ртом]{.ru}'
    - '[занима́ющаяся]{.ru}'
  - base: '[к дру́гу, живу́щий в Петербу́рге]{.ru}'
    cells:
    - '[к дру́гу, живу́щий в Петербу́рге]{.ru}'
    - '[живу́щему]{.ru}'
  - base: '[де́ти, игра́ющие в саду́]{.ru}'
    cells:
    - '[де́ти, игра́ющие в саду́]{.ru}'
    - '[игра́ющие]{.ru}'
  - base: '[соба́ка, лежу́щая у две́ри]{.ru}'
    cells:
    - '[соба́ка, лежу́щая у две́ри]{.ru}'
    - '[лежа́щая]{.ru}'
  - base: '[о де́вушке, улыба́ющейсь мне]{.ru}'
    cells:
    - '[о де́вушке, улыба́ющейсь мне]{.ru}'
    - '[улыба́ющейся]{.ru}'
  - base: '[учёный, реша́ющий тру́дную зада́чу]{.ru}'
    cells:
    - '[учёный, реша́ющий тру́дную зада́чу]{.ru}'
    - '[реша́ющий]{.ru}'
  - base: '[с друзья́ми, по́мнящие э́тот день]{.ru}'
    cells:
    - '[с друзья́ми, по́мнящие э́тот день]{.ru}'
    - '[по́мнящими]{.ru}'
  - base: '[пассажи́ры, вы́йдущие из ваго́на]{.ru}'
    cells:
    - '[пассажи́ры, вы́йдущие из ваго́на]{.ru}'
    - '[выходя́щие]{.ru}'
  - base: '[мать, лю́бящая дете́й]{.ru}'
    cells:
    - '[мать, лю́бящая дете́й]{.ru}'
    - '[лю́бящая]{.ru}'
  - base: '[ученики́, слы́шающие шум]{.ru}'
    cells:
    - '[ученики́, слы́шающие шум]{.ru}'
    - '[слы́шащие]{.ru}'
  - base: '[по́езд, иду́щий в Москву́]{.ru}'
    cells:
    - '[по́езд, иду́щий в Москву́]{.ru}'
    - '[иду́щий]{.ru}'
  - base: '[на де́вочку, смотря́щая в окно́]{.ru}'
    cells:
    - '[на де́вочку, смотря́щая в окно́]{.ru}'
    - '[смотря́щую]{.ru}'
  why: |-
    第 1、10 题：完成体没有现在时形动词：[написа́ть, вы́йти]{.ru} 不能构成 [-щий]{.ru}。说“正在写的、正在出来的”要用未完成体：[пи́шущие, выходя́щие]{.ru}（[выходи́ть → выхо́дят]{.ru}）。
    第 2、6、12 题：后缀由复数第三人称决定：[стро́ят → стро́ящие]{.ru}，[лежа́т → лежа́щая]{.ru}，[слы́шат → слы́шащие]{.ru}。这三个动词是第二变位，不能套用第一变位的 [-ющ- / -ущ-]{.ru}。
    第 3、7 题：形动词后面永远是 [-ся]{.ru}：[занима́ющаяся, улыба́ющейся]{.ru}，词尾以元音结尾也不改 [-сь]{.ru}。
    第 4、9、14 题：形动词与被说明的名词同格：[к дру́гу]{.ru} 是第三格 → [живу́щему]{.ru}；[с друзья́ми]{.ru} 是第五格 → [по́мнящими]{.ru}；[на де́вочку]{.ru} 是第四格 → [смотря́щую]{.ru}。
    第 5、8、11、13 题：原文正确，照抄。[реша́ть]{.ru} 是未完成体，可以构成 [реша́ющий]{.ru}；[лю́бящая]{.ru} 的重音是例外，在词干上。
- id: B3-L01-04
  lessons:
  - B3-L01
  tags:
  - 主动形动词现在时：句中填空
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Ма́льчик, ___ на гита́ре, — мой брат.
    hint: игра́ть
    accept:
    - игра́ющий
  - stem: Я зна́ю челове́ка, ___ пять языко́в.
    hint: знать
    accept:
    - зна́ющего
  - stem: Мы подошли́ к де́вушке, ___ цветы́.
    hint: продава́ть
    accept:
    - продаю́щей
  - stem: В ваго́не бы́ло мно́го люде́й, ___ домо́й с рабо́ты.
    hint: возвраща́ться
    accept:
    - возвраща́ющихся
  - stem: Учи́тель до́лго говори́л с ученико́м, ___ на уро́ки.
    hint: опа́здывать
    accept:
    - опа́здывающим
  - stem: Я получи́л письмо́ от дру́га, ___ на мо́ре.
    hint: отдыха́ть
    accept:
    - отдыха́ющего
  - stem: Ве́чером мы смотре́ли на ___ ого́нь.
    hint: горе́ть
    accept:
    - горя́щий
  - stem: Ба́бушка не могла́ засну́ть из-за́ ___ соба́ки.
    hint: ла́ять
    accept:
    - ла́ющей
    new: true
    gloss: 吠，叫
  - stem: Мать ти́хо смотре́ла на ___ ребёнка.
    hint: спать
    accept:
    - спя́щего
  - stem: Де́тям, ___ в шко́лу, ну́жен хоро́ший рюкза́к.
    hint: ходи́ть
    accept:
    - ходя́щим
  - stem: Кто э́та же́нщина, ___ с на́шим учи́телем?
    hint: разгова́ривать
    accept:
    - разгова́ривающая
  - stem: Мы ви́дели тури́стов, ___ па́мятник Пу́шкину.
    hint: фотографи́ровать
    accept:
    - фотографи́рующих
  why: |-
    第 1、7 题：被说明的名词是第一格或非动物名词第四格：[ма́льчик → игра́ющий]{.ru}，[ого́нь → горя́щий]{.ru}（[горю́ → горя́щий]{.ru}）。单个形动词放在名词前面：[горя́щий ого́нь]{.ru}。
    第 2、6、9 题：阳性单数第二格（第 2、9 题是动物名词第四格，同第二格）：[зна́ющего, отдыха́ющего, спя́щего]{.ru}。
    第 3、11 题：阴性单数：第三格 [к де́вушке → продаю́щей]{.ru}，第一格 [же́нщина → разгова́ривающая]{.ru}。[продава́ть]{.ru} 的形动词由 [продаю́т]{.ru} 构成，[-ва-]{.ru} 不出现。
    第 4、12 题：复数第二格、动物名词复数第四格：[возвраща́ющихся, фотографи́рующих]{.ru}；[-ова-]{.ru} 动词由 [фотографи́руют]{.ru} 构成。
    第 5、10 题：第五格 [с ученико́м → опа́здывающим]{.ru}，复数第三格 [де́тям → ходя́щим]{.ru}；[ходи́ть]{.ru} 是第二变位，后缀 [-ящ-]{.ru}，重音同 [хожу́]{.ru}，交替 [д → ж]{.ru} 只在单数第一人称。
    第 8 题：[ла́ять → ла́ют → ла́ющий]{.ru}；[из-за́]{.ru} 要求第二格，[соба́ки]{.ru} 是阴性第二格：[ла́ющей]{.ru}。
