  - base: '[рису́ющий ма́льчик]{.ru}'
    cells:
    - '[рису́ющий ма́льчик]{.ru}'
    - '[рису́ющего ма́льчика]{.ru}'
    - '[рису́ющему ма́льчику]{.ru}'
  - base: '[забы́тые ве́щи]{.ru}'
    cells:
    - '[забы́тые ве́щи]{.ru}'
    - '[забы́тых веще́й]{.ru}'
    - '[забы́тым веща́м]{.ru}'
  - base: '[уе́хавшая сестра́]{.ru}'
    cells:
    - '[уе́хавшая сестра́]{.ru}'
    - '[уе́хавшей сестры́]{.ru}'
    - '[уе́хавшей сестре́]{.ru}'
  why: |-
    第 1、2、5、8、9、11 题：主动形动词按 [хоро́ший]{.ru} 变格：[изуча́вшего, изуча́вшему]{.ru}，[мечта́ющей]{.ru}，[спя́щего, спя́щему]{.ru}，[опозда́вших, опозда́вшим]{.ru}，[рису́ющего, рису́ющему]{.ru}，[уе́хавшей]{.ru}。[-щ-, -ш-]{.ru} 后面写 [-его, -ему, -ей]{.ru}，不写 [-ого, -ому, -ой]{.ru}。
    第 3、4、6、7、10 题：被动形动词按 [но́вый]{.ru} 变格：[со́зданных, со́зданным]{.ru}，[проводи́мых, проводи́мым]{.ru}，[поте́рянной]{.ru}，[уважа́емого, уважа́емому]{.ru}，[забы́тых, забы́тым]{.ru}（[веще́й, веща́м]{.ru} 重音在词尾）。
    第 2 题：[молодёжь]{.ru} 是阴性单数，第二、三格都是 [молодёжи]{.ru}。
- id: B3-L07-02
  lessons:
  - B3-L07
  tags:
