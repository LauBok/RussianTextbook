  - base: '[чита́ющая де́вочка]{.ru}'
    cells:
    - '[чита́ющая де́вочка]{.ru}'
    - '[чита́ющей де́вочкой]{.ru}'
    - '[о чита́ющей де́вочке]{.ru}'
  - base: '[люби́мое ме́сто]{.ru}'
    cells:
    - '[люби́мое ме́сто]{.ru}'
    - '[люби́мым ме́стом]{.ru}'
    - '[о люби́мом ме́сте]{.ru}'
  - base: '[ку́пленный пода́рок]{.ru}'
    cells:
    - '[ку́пленный пода́рок]{.ru}'
    - '[ку́пленным пода́рком]{.ru}'
    - '[о ку́пленном пода́рке]{.ru}'
  - base: '[изуча́емый язы́к]{.ru}'
    cells:
    - '[изуча́емый язы́к]{.ru}'
    - '[изуча́емым языко́м]{.ru}'
    - '[об изуча́емом языке́]{.ru}'
  - base: '[рабо́тающая мать]{.ru}'
    cells:
    - '[рабо́тающая мать]{.ru}'
    - '[рабо́тающей ма́терью]{.ru}'
    - '[о рабо́тающей ма́тери]{.ru}'
  - base: '[вы́росшие де́ти]{.ru}'
    cells:
    - '[вы́росшие де́ти]{.ru}'
    - '[вы́росшими детьми́]{.ru}'
    - '[о вы́росших де́тях]{.ru}'
  - base: '[прочи́танный журна́л]{.ru}'
    cells:
    - '[прочи́танный журна́л]{.ru}'
    - '[прочи́танным журна́лом]{.ru}'
    - '[о прочи́танном журна́ле]{.ru}'
  - base: '[пою́щие пти́цы]{.ru}'
    cells:
    - '[пою́щие пти́цы]{.ru}'
    - '[пою́щими пти́цами]{.ru}'
    - '[о пою́щих пти́цах]{.ru}'
  - base: '[лежа́щая соба́ка]{.ru}'
    cells:
    - '[лежа́щая соба́ка]{.ru}'
    - '[лежа́щей соба́кой]{.ru}'
    - '[о лежа́щей соба́ке]{.ru}'
  why: |-
    第 1、4–6、9 题：被动形动词阳性、中性第五格 [-ым]{.ru}，第六格 [-ом]{.ru}：[откры́тым, откры́том]{.ru}，[люби́мым, люби́мом]{.ru}，[ку́пленным, ку́пленном]{.ru}，[изуча́емым, изуча́емом]{.ru}，[прочи́танным, прочи́танном]{.ru}。第 1、6 题前置词在元音前写 [об]{.ru}。
    第 2、8、10 题：复数第五格 [-ими]{.ru}，第六格 [-их]{.ru}：[прие́хавшими, вы́росшими, пою́щими]{.ru}，[прие́хавших, вы́росших, пою́щих]{.ru}；[детьми́, де́тях]{.ru} 要记。
    第 3、7、11 题：主动形动词阴性第五、六格都是 [-ей]{.ru}：[чита́ющей де́вочкой, рабо́тающей ма́терью, лежа́щей соба́кой]{.ru}；[мать]{.ru} 变格时加 [-ер-]{.ru}：[ма́терью, о ма́тери]{.ru}。
