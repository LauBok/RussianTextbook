  task: 写出词组的第五格和第六格。
  type: matrix
  cols:
  - 第一格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[откры́тое окно́]{.ru}'
    cells:
    - '[откры́тое окно́]{.ru}'
    - '[откры́тым окно́м]{.ru}'
