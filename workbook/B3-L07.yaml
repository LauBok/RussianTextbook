- id: B3-L07-04
  lessons:
  - B3-L07
  tags:
  - 形动词短语的位置与逗号
  task: 这些句子的标点对不对？归栏。
  type: classify
  bins:
  - 标点正确
  - 标点有误
  items:
  - text: '[Студе́нты, сда́вшие экза́мен, пошли́ в кафе́.]{.ru}'
    answer: 标点正确
  - text: '[Студе́нты, сда́вшие экза́мен пошли́ в кафе́.]{.ru}'
    answer: 标点有误
  - text: '[Сда́вшие экза́мен студе́нты пошли́ в кафе́.]{.ru}'
    answer: 标点正确
  - text: '[Сда́вшие экза́мен, студе́нты пошли́ в кафе́.]{.ru}'
    answer: 标点有误
  - text: '[Мы вошли́ в постро́енное в про́шлом году́ зда́ние.]{.ru}'
    answer: 标点正确
  - text: '[Мы вошли́ в, постро́енное в про́шлом году́, зда́ние.]{.ru}'
    answer: 标点有误
  - text: '[Я чита́ю кни́гу, пода́ренную мне бра́том.]{.ru}'
    answer: 标点正确
  - text: '[Я ви́дел челове́ка продаю́щего цветы́.]{.ru}'
    answer: 标点有误
  - text: '[На лежа́щей на столе́ газе́те стоя́л стака́н.]{.ru}'
    answer: 标点正确
  - text: '[Кни́га лежа́щая на столе́, принадлежи́т мне.]{.ru}'
    answer: 标点有误
    new: true
    gloss: принадлежа́ть 属于
  - text: '[Де́вушка, сидя́щая у окна́, — моя́ сестра́.]{.ru}'
    answer: 标点正确
  - text: '[На, лежа́щей на столе́ газе́те, стоя́л стака́н.]{.ru}'
    answer: 标点有误
  - text: '[Челове́к, продаю́щий цветы́, стоя́л у вхо́да.]{.ru}'
    answer: 标点正确
  - text: '[Ма́льчик, игра́ющий во дворе́ мой брат.]{.ru}'
    answer: 标点有误
  why: |-
    第 1、7、11、13 题：形动词短语在名词后面，前后都用逗号；短语在句末时只有前一个逗号（第 7 题）。
    第 3、5、9 题：短语在名词前面，不用逗号；有前置词时次序是前置词 + 短语 + 名词：[в постро́енное в про́шлом году́ зда́ние]{.ru}，[на лежа́щей на столе́ газе́те]{.ru}。
    第 2、14 题：句中的短语漏了后一个逗号，应为 [Студе́нты, сда́вшие экза́мен, пошли́…]{.ru}，[Ма́льчик, игра́ющий во дворе́, — мой брат]{.ru}。
    第 4、6、12 题：名词前的短语不加逗号：[Сда́вшие экза́мен студе́нты…]{.ru}，[в постро́енное в про́шлом году́ зда́ние]{.ru}，[На лежа́щей на столе́ газе́те…]{.ru}。
    第 8、10 题：名词后的短语前面要有逗号：[челове́ка, продаю́щего цветы́]{.ru}，[Кни́га, лежа́щая на столе́, принадлежи́т мне]{.ru}。
- id: B3-L07-05
  lessons:
  - B3-L07
  tags:
  - 形动词的变格：格只看被说明的名词
  - 形动词的变格：оди́н из 与 пе́рвый 后的一致
  task: 写出与名词一致的形动词。
  type: matrix
  cols:
  - 名词 + 形动词短语
  - 形动词
  given:
  - 0
  rows:
  - base: '[у ко́шки + ви́девший пти́цу]{.ru}'
