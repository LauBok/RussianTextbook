  - base: '[поте́рянная су́мка]{.ru}'
    cells:
    - '[поте́рянная су́мка]{.ru}'
    - '[поте́рянной су́мки]{.ru}'
    - '[поте́рянной су́мке]{.ru}'
  - base: '[уважа́емый профе́ссор]{.ru}'
    cells:
    - '[уважа́емый профе́ссор]{.ru}'
    - '[уважа́емого профе́ссора]{.ru}'
    - '[уважа́емому профе́ссору]{.ru}'
  - base: '[опозда́вшие студе́нты]{.ru}'
    cells:
