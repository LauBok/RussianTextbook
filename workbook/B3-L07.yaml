    - '[напи́санном]{.ru}'
  - base: '[с де́вушкой + чита́ющий газе́ту]{.ru}'
    cells:
    - '[с де́вушкой + чита́ющий газе́ту]{.ru}'
    - '[чита́ющей]{.ru}'
  - base: '[для дете́й + живу́щий в дере́вне]{.ru}'
    cells:
    - '[для дете́й + живу́щий в дере́вне]{.ru}'
    - '[живу́щих]{.ru}'
  - base: '[в до́ме + постро́енный мои́м де́дом]{.ru}'
    cells:
    - '[в до́ме + постро́енный мои́м де́дом]{.ru}'
    - '[постро́енном]{.ru}'
  - base: '[к учи́телю + объясня́ющий нам пра́вила]{.ru}'
    cells:
    - '[к учи́телю + объясня́ющий нам пра́вила]{.ru}'
    - '[объясня́ющему]{.ru}'
  - base: '[Он был одни́м из студе́нтов + сда́вший экза́мен на «пять».]{.ru}'
    cells:
    - '[Он был одни́м из студе́нтов + сда́вший экза́мен на «пять».]{.ru}'
    - '[сда́вших]{.ru}'
  - base: '[Она́ ста́ла пе́рвой же́нщиной + полете́вший в ко́смос.]{.ru}'
    cells:
    - '[Она́ ста́ла пе́рвой же́нщиной + полете́вший в ко́смос.]{.ru}'
    - '[полете́вшей]{.ru}'
  - base: '[Э́то оди́н из рома́нов + переведённый на ру́сский язы́к.]{.ru}'
    cells:
    - '[Э́то оди́н из рома́нов + переведённый на ру́сский язы́к.]{.ru}'
    - '[переведённых]{.ru}'
  - base: '[Гага́рин стал пе́рвым челове́ком + уви́девший Зе́млю из ко́смоса.]{.ru}'
    cells:
    - '[Гага́рин стал пе́рвым челове́ком + уви́девший Зе́млю из ко́смоса.]{.ru}'
    - '[уви́девшим]{.ru}'
  - base: '[на у́лице + веду́щий к вокза́лу]{.ru}'
    cells:
    - '[на у́лице + веду́щий к вокза́лу]{.ru}'
    - '[веду́щей]{.ru}'
  - base: '[о гостя́х + приглашённый на сва́дьбу]{.ru}'
    cells:
    - '[о гостя́х + приглашённый на сва́дьбу]{.ru}'
    - '[приглашённых]{.ru}'
  - base: '[с сестро́й + забы́вший ключи́ до́ма]{.ru}'
    cells:
    - '[с сестро́й + забы́вший ключи́ до́ма]{.ru}'
    - '[забы́вшей]{.ru}'
  - base: '[от друзе́й + живу́щий за грани́цей]{.ru}'
    cells:
    - '[от друзе́й + живу́щий за грани́цей]{.ru}'
    - '[живу́щих]{.ru}'
  - base: '[за столо́м + стоя́щий у окна́]{.ru}'
    cells:
    - '[за столо́м + стоя́щий у окна́]{.ru}'
    - '[стоя́щим]{.ru}'
  why: |-
    第 1、4、6、7 题：短语里还有别的名词（[пти́цу, газе́ту, мои́м де́дом, нам пра́вила]{.ru}），形动词不跟它们一致，只跟被说明的名词：[у ко́шки → ви́девшей]{.ru}，[с де́вушкой → чита́ющей]{.ru}，[в до́ме → постро́енном]{.ru}，[к учи́телю → объясня́ющему]{.ru}。
    第 2、3、5、12–16 题：[к студе́нтам → сдаю́щим]{.ru}，[о рома́не → напи́санном]{.ru}，[для дете́й → живу́щих]{.ru}，[на у́лице → веду́щей]{.ru}，[о гостя́х → приглашённых]{.ru}，[с сестро́й → забы́вшей]{.ru}，[от друзе́й → живу́щих]{.ru}，[за столо́м → стоя́щим]{.ru}。
    第 8、10 题：[оди́н из]{.ru} 后面的名词是复数第二格，形动词说明的是这些人或事物，也用复数第二格：[одни́м из студе́нтов, сда́вших]{.ru}，[оди́н из рома́нов, переведённых]{.ru}，不和 [оди́н, одни́м]{.ru} 一致。
    第 9、11 题：[пе́рвый]{.ru} 后面的名词是单数，形动词跟它一致：[пе́рвой же́нщиной, полете́вшей]{.ru}，[пе́рвым челове́ком, уви́девшим]{.ru}（第五格）。
