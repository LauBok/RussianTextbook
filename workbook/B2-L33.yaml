    - '[чи́стят]{.ru}'
  - base: '[люби́ть]{.ru}'
    cells:
    - '[люби́ть]{.ru}'
    - '[люблю́]{.ru}'
    - '[лю́бишь]{.ru}'
    - '[лю́бят]{.ru}'
  - base: '[купи́ть]{.ru}'
    cells:
    - '[купи́ть]{.ru}'
    - '[куплю́]{.ru}'
    - '[ку́пишь]{.ru}'
    - '[ку́пят]{.ru}'
  - base: '[спать]{.ru}'
    cells:
    - '[спать]{.ru}'
    - '[сплю]{.ru}'
    - '[спишь]{.ru}'
