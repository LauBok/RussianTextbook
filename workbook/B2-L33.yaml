    - '[пла́тишь]{.ru}'
    - '[пла́тят]{.ru}'
  - base: '[отве́тить]{.ru}'
    cells:
    - '[отве́тить]{.ru}'
    - '[отве́чу]{.ru}'
    - '[отве́тишь]{.ru}'
    - '[отве́тят]{.ru}'
  - base: '[чи́стить]{.ru}'
    cells:
    - '[чи́стить]{.ru}'
    - '[чи́щу]{.ru}'
