  - base: '[гото́вить]{.ru}'
    cells:
    - '[гото́вить]{.ru}'
    - '[гото́влю]{.ru}'
    - '[гото́вишь]{.ru}'
    - '[гото́вят]{.ru}'
  - base: '[ста́вить]{.ru}'
    cells:
    - '[ста́вить]{.ru}'
    - '[ста́влю]{.ru}'
    - '[ста́вишь]{.ru}'
    - '[ста́вят]{.ru}'
  - base: '[корми́ть]{.ru}'
    cells:
    - '[корми́ть]{.ru}'
    - '[кормлю́]{.ru}'
    - '[ко́рмишь]{.ru}'
    - '[ко́рмят]{.ru}'
  why: |-
    第 1–4 题：[д → ж]{.ru}，只在 [я]{.ru}：[ви́жу, сижу́, хожу́, сержу́сь]{.ru}；其他人称不变：[ви́дишь, хо́дят]{.ru}。
    第 5–7 题：[с → ш]{.ru}：[прошу́, ношу́, приглашу́]{.ru}。
    第 8、9 题：[т → ч]{.ru}：[плачу́, отве́чу]{.ru}。
    第 10 题：[ст → щ]{.ru}：[чи́щу]{.ru}。
    第 11–16 题：唇音 [б, п, в, м]{.ru} 后在 [я]{.ru} 加 [л]{.ru}：[люблю́, куплю́, сплю, гото́влю, ста́влю, кормлю́]{.ru}；[они́]{.ru} 不加：[лю́бят, спят]{.ru}。
    第 3–6、8、11、12、16 题：[я]{.ru} 重音在词尾，其余人称前移到词干：[хожу́ — хо́дишь, прошу́ — про́сишь, плачу́ — пла́тишь, кормлю́ — ко́рмишь]{.ru}；第 2、7 题重音不移：[сиди́шь, пригласи́шь]{.ru}。
- id: B2-L33-02
  tags:
  - 辅音交替：第一变位与 -чь 动词
  task: 写出动词的现在时（完成体为将来时）和过去时。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[они́]{.ru}'
  - 过去时阳性
  given:
  - 0
  rows:
  - base: '[писа́ть]{.ru}'
    cells:
    - '[писа́ть]{.ru}'
    - '[пишу́]{.ru}'
    - '[пи́шешь]{.ru}'
    - '[пи́шут]{.ru}'
    - '[писа́л]{.ru}'
  - base: '[сказа́ть]{.ru}'
    cells:
    - '[сказа́ть]{.ru}'
    - '[скажу́]{.ru}'
    - '[ска́жешь]{.ru}'
    - '[ска́жут]{.ru}'
    - '[сказа́л]{.ru}'
  - base: '[маха́ть]{.ru}'
    cells:
    - '[маха́ть]{.ru}'
    - '[машу́]{.ru}'
    - '[ма́шешь]{.ru}'
    - '[ма́шут]{.ru}'
    - '[маха́л]{.ru}'
  - base: '[пла́кать]{.ru}'
    cells:
    - '[пла́кать]{.ru}'
    - '[пла́чу]{.ru}'
    - '[пла́чешь]{.ru}'
    - '[пла́чут]{.ru}'
    - '[пла́кал]{.ru}'
  - base: '[иска́ть]{.ru}'
    cells:
    - '[иска́ть]{.ru}'
    - '[ищу́]{.ru}'
    - '[и́щешь]{.ru}'
    - '[и́щут]{.ru}'
    - '[иска́л]{.ru}'
  - base: '[мочь]{.ru}'
    cells:
    - '[мочь]{.ru}'
    - '[могу́]{.ru}'
    - '[мо́жешь]{.ru}'
    - '[мо́гут]{.ru}'
    - '[мог]{.ru}'
  - base: '[печь]{.ru}'
    cells:
    - '[печь]{.ru}'
    - '[пеку́]{.ru}'
    - '[печёшь]{.ru}'
    - '[пеку́т]{.ru}'
    - '[пёк]{.ru}'
  - base: '[помо́чь]{.ru}'
    cells:
    - '[помо́чь]{.ru}'
    - '[помогу́]{.ru}'
    - '[помо́жешь]{.ru}'
    - '[помо́гут]{.ru}'
    - '[помо́г]{.ru}'
  why: |-
    第 1–5 题：第一变位有交替的，所有人称都换辅音：[с → ш]{.ru}（[пишу́, пи́шут]{.ru}），[з → ж]{.ru}（[скажу́, ска́жут]{.ru}），[х → ш]{.ru}（[машу́]{.ru}），[к → ч]{.ru}（[пла́чу]{.ru}），[ск → щ]{.ru}（[ищу́]{.ru}）。过去时由不定式构成，不交替：[писа́л, пла́кал, иска́л]{.ru}。
    第 1、2、3、5 题：[я]{.ru} 重音在词尾，其余前移：[пишу́ — пи́шешь]{.ru}；第 4 题重音一直在词干：[пла́чу, пла́чешь]{.ru}。
    第 6–8 题：[-чь]{.ru} 动词 [я]{.ru} 和 [они́]{.ru} 保留 [г, к]{.ru}，其余换成 [ж, ч]{.ru}：[могу́, мо́жешь, мо́гут; пеку́, печёшь, пеку́т]{.ru}。过去时 [мог, пёк, помо́г]{.ru}。
- id: B2-L33-03
  tags:
  - 辅音交替：改错
  task: 改正错误，正确的照抄。
  type: matrix
  cols:
  - 原文
  - 改正
  given:
  - 0
  rows:
  - base: '[я ви́дю]{.ru}'
    cells:
    - '[я ви́дю]{.ru}'
    - '[я ви́жу]{.ru}'
  - base: '[я мо́жу]{.ru}'
    cells:
    - '[я мо́жу]{.ru}'
    - '[я могу́]{.ru}'
  - base: '[ты ходи́шь]{.ru}'
    cells:
    - '[ты ходи́шь]{.ru}'
    - '[ты хо́дишь]{.ru}'
  - base: '[она́ пече́т]{.ru}'
    cells:
    - '[она́ пече́т]{.ru}'
    - '[она́ печёт]{.ru}'
  - base: '[я любю́]{.ru}'
    cells:
    - '[я любю́]{.ru}'
    - '[я люблю́]{.ru}'
  - base: '[они́ пи́сают]{.ru}'
    cells:
    - '[они́ пи́сают]{.ru}'
    - '[они́ пи́шут]{.ru}'
  - base: '[я сидю́]{.ru}'
    cells:
    - '[я сидю́]{.ru}'
    - '[я сижу́]{.ru}'
  - base: '[ты мо́гешь]{.ru}'
    cells:
    - '[ты мо́гешь]{.ru}'
    - '[ты мо́жешь]{.ru}'
  - base: '[я гото́вю]{.ru}'
    cells:
    - '[я гото́вю]{.ru}'
    - '[я гото́влю]{.ru}'
  - base: '[я иска́ю]{.ru}'
    cells:
    - '[я иска́ю]{.ru}'
    - '[я ищу́]{.ru}'
  - base: '[они́ пеку́т]{.ru}'
    cells:
    - '[они́ пеку́т]{.ru}'
    - '[они́ пеку́т]{.ru}'
  - base: '[они́ мо́гут]{.ru}'
    cells:
    - '[они́ мо́гут]{.ru}'
    - '[они́ мо́гут]{.ru}'
  - base: '[ты ку́пишь]{.ru}'
    cells:
    - '[ты ку́пишь]{.ru}'
    - '[ты ку́пишь]{.ru}'
  - base: '[мы ви́жим]{.ru}'
    cells:
    - '[мы ви́жим]{.ru}'
    - '[мы ви́дим]{.ru}'
  - base: '[он пла́тчит]{.ru}'
    cells:
    - '[он пла́тчит]{.ru}'
    - '[он пла́тит]{.ru}'
  - base: '[я машу́]{.ru}'
    cells:
    - '[я машу́]{.ru}'
    - '[я машу́]{.ru}'
  why: |-
    第 1、5、7、9 题：第二变位 [я]{.ru} 要交替：[ви́жу, люблю́, сижу́, гото́влю]{.ru}。
    第 14、15 题：第二变位只有 [я]{.ru} 交替，其他人称不变：[мы ви́дим, он пла́тит]{.ru}。
    第 6、10 题：第一变位所有人称都交替：[пи́шут, ищу́]{.ru}；[иска́ть]{.ru} 不按 [чита́ть]{.ru} 变。
    第 2、8 题：[мочь]{.ru}：[я могу́]{.ru}（保留 [г]{.ru}），[ты мо́жешь]{.ru}（换成 [ж]{.ru}）。
    第 4 题：[печь]{.ru}：[печёт]{.ru}，重音在词尾，写 [ё]{.ru}。
    第 3 题：重音前移：[хо́дишь]{.ru}。
    第 11–13、16 题：正确。
