heading: 综合练习　带 бы 的形式：что́бы 与 е́сли бы
lessons:
- B2-L47
- B2-L48
- B2-L50
groups:
- id: B2-L50-综合-a
  recycles:
  - B2-L47-02
  - B2-L50-01
  tags:
  - 综合：бы 的三种形式
  task: 按主语写出三种说法。
  type: matrix
  cols:
  - 主语 + 动词
  - '[… бы хоте́л(а)]{.ru} + 不定式'
  - '[Я хочу́, что́бы …]{.ru}'
  - '[Е́сли бы …]{.ru}'
  given:
  - 0
  rows:
  - base: '[ты + прийти́]{.ru}'
    cells:
    - '[ты + прийти́]{.ru}'
    - '[ты бы хоте́ла прийти́]{.ru}'
    - '[что́бы ты пришла́]{.ru}'
    - '[е́сли бы ты пришла́]{.ru}'
    hint: 女
  - base: '[он + позвони́ть]{.ru}'
    cells:
    - '[он + позвони́ть]{.ru}'
    - '[он бы хоте́л позвони́ть]{.ru}'
    - '[что́бы он позвони́л]{.ru}'
    - '[е́сли бы он позвони́л]{.ru}'
  - base: '[А́нна + петь]{.ru}'
    cells:
    - '[А́нна + петь]{.ru}'
    - '[А́нна бы хоте́ла петь]{.ru}'
    - '[что́бы А́нна пе́ла]{.ru}'
    - '[е́сли бы А́нна пе́ла]{.ru}'
  - base: '[вы + отдохну́ть]{.ru}'
    cells:
    - '[вы + отдохну́ть]{.ru}'
    - '[вы бы хоте́ли отдохну́ть]{.ru}'
    - '[что́бы вы отдохну́ли]{.ru}'
    - '[е́сли бы вы отдохну́ли]{.ru}'
  - base: '[де́ти + спать]{.ru}'
    cells:
    - '[де́ти + спать]{.ru}'
    - '[де́ти бы хоте́ли спать]{.ru}'
    - '[что́бы де́ти спа́ли]{.ru}'
    - '[е́сли бы де́ти спа́ли]{.ru}'
  - base: '[Ми́ша + помо́чь]{.ru}'
    cells:
    - '[Ми́ша + помо́чь]{.ru}'
    - '[Ми́ша бы хоте́л помо́чь]{.ru}'
    - '[что́бы Ми́ша помо́г]{.ru}'
    - '[е́сли бы Ми́ша помо́г]{.ru}'
  - base: '[она́ + принести́]{.ru}'
    cells:
    - '[она́ + принести́]{.ru}'
    - '[она́ бы хоте́ла принести́]{.ru}'
    - '[что́бы она́ принесла́]{.ru}'
    - '[е́сли бы она́ принесла́]{.ru}'
  - base: '[Пьер + жить в Москве́]{.ru}'
    cells:
    - '[Пьер + жить в Москве́]{.ru}'
    - '[Пьер бы хоте́л жить в Москве́]{.ru}'
    - '[что́бы Пьер жил в Москве́]{.ru}'
    - '[е́сли бы Пьер жил в Москве́]{.ru}'
  - base: '[они́ + прочита́ть]{.ru}'
    cells:
    - '[они́ + прочита́ть]{.ru}'
    - '[они́ бы хоте́ли прочита́ть]{.ru}'
    - '[что́бы они́ прочита́ли]{.ru}'
    - '[е́сли бы они́ прочита́ли]{.ru}'
  - base: '[ты + сдать экза́мен]{.ru}'
    cells:
    - '[ты + сдать экза́мен]{.ru}'
    - '[ты бы хоте́л сдать экза́мен]{.ru}'
    - '[что́бы ты сдал экза́мен]{.ru}'
    - '[е́сли бы ты сдал экза́мен]{.ru}'
    hint: 男
  why: |-
    三种说法里都有同一个 [бы]{.ru}，后面都用过去时形式，性数跟主语。
    第一栏：[хоте́л бы]{.ru} 的性数跟主语，后面的动作是主语自己做，用不定式：[ты бы хоте́ла прийти́]{.ru}。
    第二栏：想让别人做，用 [что́бы]{.ru} + 过去时形式：[что́бы ты пришла́]{.ru}。
    第三栏：非真实条件 [е́сли бы]{.ru} + 过去时形式。
    第 6、7 题：[помо́г, принесла́]{.ru} 的过去时要记准；第 3 题 [петь → пе́ла]{.ru}。
  lessons:
  - B2-L47
  - B2-L48
  - B2-L50
- id: B2-L50-综合-b
  recycles:
  - B2-L47-03
  - B2-L48-02
  - B2-L50-02
  tags:
  - 综合：从句动词形式
  task: 空里该用哪种形式？归入相应的栏。
  type: classify
  bins:
  - 不定式
  - 过去时形式
  - 将来时
  items:
  - text: '[Я хочу́ … (пое́хать) в Каза́нь.]{.ru}'
    answer: 不定式
  - text: '[Ю́ми пое́дет в Петербу́рг, что́бы … (учи́ться) там.]{.ru}'
    answer: 不定式
  - text: '[Что́бы … (не забы́ть) язы́к, на́до мно́го чита́ть.]{.ru}'
    answer: 不定式
  - text: '[Ка́тя попроси́ла А́нну … (прийти́) в де́вять.]{.ru}'
    answer: 不定式
  - text: '[Мы вы́шли ра́но, что́бы … (не опозда́ть).]{.ru}'
    answer: 不定式
  - text: '[Пьер хо́чет … (стать) врачо́м.]{.ru}'
    answer: 不定式
  - text: '[Ди́ма пришёл … (поговори́ть) со мной.]{.ru}'
    answer: 不定式
  - text: '[Я хочу́, что́бы ты … (прийти́) к нам.]{.ru}'
    answer: 过去时形式
  - text: '[Ма́ма попроси́ла, что́бы Ми́ша … (купи́ть) хлеб.]{.ru}'
    answer: 过去时形式
  - text: '[Е́сли бы я … (знать), я бы тебе́ позвони́л.]{.ru}'
    answer: 过去时形式
  - text: '[Па́па включи́л свет, что́бы Ми́ша … (ви́деть) доро́гу.]{.ru}'
    answer: 过去时形式
  - text: '[Е́сли бы у нас … (быть) вре́мя, мы бы пошли́ в музе́й.]{.ru}'
    answer: 过去时形式
  - text: '[Учи́тель сказа́л, что́бы мы … (повтори́ть) слова́.]{.ru}'
    answer: 过去时形式
  - text: '[Я бы купи́л э́ту кни́гу, е́сли бы она́ … (сто́ить) деше́вле.]{.ru}'
    answer: 过去时形式
  - text: '[Ди́ма сказа́л, что за́втра он … (прийти́).]{.ru}'
    answer: 将来时
  - text: '[Е́сли за́втра … (быть) хоро́шая пого́да, мы пое́дем на да́чу.]{.ru}'
    answer: 将来时
  - text: '[Я ду́маю, что А́нна … (позвони́ть) ве́чером.]{.ru}'
    answer: 将来时
  - text: '[Е́сли ты … (уста́ть), мы отдохнём.]{.ru}'
    answer: 将来时
  - text: '[Ма́ма ве́рит, что за́втра Ми́ша … (сдать) экза́мен.]{.ru}'
    answer: 将来时
  - text: '[Е́сли ты … (позвони́ть) мне ве́чером, я всё расскажу́.]{.ru}'
    answer: 将来时
  why: |-
    第 1、6 题：想做的是主语自己，[хоте́ть]{.ru} 后用不定式。
    第 2、3、5 题：目的从句主语相同或泛指，[что́бы]{.ru} + 不定式。第 4 题 [попроси́ть кого́]{.ru} + 不定式。第 7 题运动动词后直接用不定式表示目的。
    第 8、9、11、13 题：[что́бы]{.ru} 后另有主语，用过去时形式：[пришёл / пришла́, купи́л, ви́дел, повтори́ли]{.ru}。
    第 10、12、14 题：非真实条件 [е́сли бы]{.ru} + 过去时形式。
    第 15、17、19 题：[что]{.ru} 陈述事实，说将来的事用将来时：[придёт, позвони́т, сдаст]{.ru}。
    第 16、18、20 题：真实条件 [е́сли]{.ru} + 将来时：[бу́дет, уста́нешь, позвони́шь]{.ru}。
  lessons:
  - B2-L47
  - B2-L48
  - B2-L50
- id: B2-L50-综合-c
  recycles:
  - B2-L47-04
  - B2-L48-03
  tags:
  - 综合：从句动词（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Ба́бушка хо́чет, что́бы А́нна ___ к ней в суббо́ту.
    hint: прие́хать
    accept:
    - прие́хала
  - stem: Е́сли бы Ми́ша ___ уро́ки, он бы получи́л пятёрку.
    hint: сде́лать
    accept:
    - сде́лал
  - stem: Мы откры́ли окно́, что́бы в ко́мнате ___ свежо́.
    hint: быть
    accept:
    - бы́ло
  - stem: Е́сли бы роди́тели ___ ря́дом, я бы ча́сто их ви́дел.
    hint: жить
    accept:
    - жи́ли
  - stem: Пьер купи́л биле́ты, что́бы мы ___ в теа́тр.
    hint: пойти́
    accept:
    - пошли́
  - stem: Скажи́ Ди́ме, что́бы он ___ мне.
    hint: позвони́ть
    accept:
    - позвони́л
  - stem: Е́сли бы О́льга Ви́кторовна не ___ , она́ бы пришла́ на конце́рт.
    hint: заболе́ть
    accept:
    - заболе́ла
  - stem: Я хочу́, что́бы вы ___ сча́стливы.
    hint: быть
    accept:
    - бы́ли
  - stem: Ю́ми взяла́ слова́рь, что́бы ___ текст.
    hint: перевести́
    accept:
    - перевести́
  - stem: Ма́ма тре́бует, что́бы де́ти ___ спать в де́вять.
    hint: ложи́ться
    accept:
    - ложи́лись
  - stem: Ди́ма пришёл ___ мне.
    hint: помо́чь
    accept:
    - помо́чь
  - stem: Е́сли бы у меня́ ___ соба́ка, я бы гуля́л с ней ка́ждый день.
    hint: быть
    accept:
    - была́
  - stem: Па́па попроси́л, что́бы Ми́ша ___ посу́ду.
    hint: вы́мыть
    accept:
    - вы́мыл
  - stem: Что́бы хорошо́ ___ экза́мен, ну́жно мно́го занима́ться.
    hint: сдать
    accept:
    - сдать
  - stem: Е́сли бы А́нна ___ об э́том, она́ бы обра́довалась.
    hint: узна́ть
    accept:
    - узна́ла
  - stem: Е́сли за́втра ты ___ свобо́дна, приходи́ к нам.
    hint: быть
    accept:
    - бу́дешь
  - stem: Я хочу́, что́бы ты ___ меня́ на вокза́ле.
    hint: встре́тить
    accept:
    - встре́тил
    - встре́тила
  - stem: Е́сли бы вчера́ не́ было экза́мена, мы бы ___ в кино́.
    hint: пойти́
    accept:
    - пошли́
  - stem: Ми́ша ушёл ра́но, что́бы ___ на трениро́вку.
    hint: успе́ть
    accept:
    - успе́ть
  - stem: Я наде́юсь, что вы ___ ко мне в го́сти.
    hint: прийти́
    accept:
    - придёте
  why: |-
    第 1、5、6、10、13 题：[что́бы]{.ru} 后另有主语，用过去时形式：[прие́хала, пошли́, позвони́л, ложи́лись, вы́мыл]{.ru}。第 3 题无人称：[что́бы бы́ло свежо́]{.ru}。第 8 题 [вы]{.ru} 用复数 [бы́ли]{.ru}。
    第 9、14 题：目的从句主语相同或泛指，用不定式。第 11 题：运动动词后用不定式表示目的。
    第 2、4、7、12、15 题：[е́сли бы]{.ru} + 过去时形式，性数跟主语：[сде́лал, жи́ли, заболе́ла, была́ (соба́ка), узна́ла]{.ru}。
    第 16 题：真实条件，[е́сли]{.ru} + 将来时：[бу́дешь]{.ru}。
    第 17 题：[что́бы]{.ru} + 过去时形式，性别不定，[встре́тил / встре́тила]{.ru} 都对。第 18 题：[е́сли бы]{.ru} 的主句：[пошли́]{.ru}。
    第 19 题：目的从句主语相同，用不定式。第 20 题：[наде́яться, что]{.ru} 陈述将来的事，用将来时：[придёте]{.ru}。
  lessons:
  - B2-L47
  - B2-L48
  - B2-L50
