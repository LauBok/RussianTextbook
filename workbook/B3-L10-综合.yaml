  why: |-
    第 1、3、5、7、9 题：未完成体及物动词有三种：主动现在时、主动过去时、被动现在时；被动形动词过去时由完成体构成，这里写“—”。第 7 题主动现在时由 [создаю́т]{.ru} 构成：[создаю́щий]{.ru}；被动现在时保留 [-ва-]{.ru}：[создава́емый]{.ru}。
    第 2、4、6、8、10、14 题：完成体及物动词只有过去时的两种：[изучи́вший / изу́ченный]{.ru}，[реши́вший / решённый]{.ru}，[откры́вший / откры́тый]{.ru}，[созда́вший / со́зданный]{.ru}，[пригласи́вший / приглашённый]{.ru}，[привёзший / привезённый]{.ru}。没有现在时，也就没有现在时形动词。
    第 11、12 题：[-ся]{.ru} 动词不及物，没有被动形动词；主动形动词后面照写 [-ся]{.ru}：[возвраща́ющийся, возвраща́вшийся, верну́вшийся]{.ru}。
    第 13 题：[ждать]{.ru} 是课文列出的没有被动形动词现在时的动词；未完成体也不构成被动形动词过去时。主动形动词照常：[жду́щий, жда́вший]{.ru}。
- id: B3-L10-综合-b
  lessons: *id001
  tags:
  - 综合：形动词与 кото́рый 从句
