    - '[пригласи́вший]{.ru}'
    - —
    - '[приглашённый]{.ru}'
  - base: '[возвраща́ться]{.ru}'
    cells:
    - '[возвраща́ться]{.ru}'
    - '[возвраща́ющийся]{.ru}'
    - '[возвраща́вшийся]{.ru}'
