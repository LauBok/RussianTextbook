  recycles:
  - B3-L01-02
  - B3-L03-02
  - B3-L06-02
  task: 把从句换成形动词：写出与名词一致的形动词，不能换的写“—”。
  type: matrix
  cols:
  - 名词 + 从句
  - 形动词
  given:
  - 0
  rows:
  - base: '[к де́вушке, кото́рая игра́ет на гита́ре]{.ru}'
    cells:
    - '[к де́вушке, кото́рая игра́ет на гита́ре]{.ru}'
    - '[игра́ющей]{.ru}'
  - base: '[о челове́ке, кото́рый вы́рос в дере́вне]{.ru}'
    cells:
    - '[о челове́ке, кото́рый вы́рос в дере́вне]{.ru}'
    - '[вы́росшем]{.ru}'
  - base: '[в кни́ге, кото́рую перевёл мой друг]{.ru}'
    cells:
    - '[в кни́ге, кото́рую перевёл мой друг]{.ru}'
    - '[переведённой]{.ru}'
  - base: '[с худо́жником, кото́рому позвони́л брат]{.ru}'
    cells:
    - '[с худо́жником, кото́рому позвони́л брат]{.ru}'
    - —
  - base: '[для студе́нтов, кото́рые изуча́ли ру́сский язы́к]{.ru}'
    cells:
    - '[для студе́нтов, кото́рые изуча́ли ру́сский язы́к]{.ru}'
    - '[изуча́вших]{.ru}'
  - base: '[о фи́льме, кото́рый ско́ро вы́йдет]{.ru}'
    cells:
    - '[о фи́льме, кото́рый ско́ро вы́йдет]{.ru}'
    - —
  - base: '[статья́, кото́рую пи́шет журнали́ст]{.ru}'
    cells:
    - '[статья́, кото́рую пи́шет журнали́ст]{.ru}'
    - —
  - base: '[в зда́нии, кото́рое постро́или в 1900 году́]{.ru}'
    cells:
    - '[в зда́нии, кото́рое постро́или в 1900 году́]{.ru}'
    - '[постро́енном]{.ru}'
  - base: '[у учёного, кото́рого уважа́ют колле́ги]{.ru}'
    cells:
    - '[у учёного, кото́рого уважа́ют колле́ги]{.ru}'
    - '[уважа́емого]{.ru}'
  - base: '[с соба́кой, кото́рая спала́ у две́ри]{.ru}'
    cells:
    - '[с соба́кой, кото́рая спала́ у две́ри]{.ru}'
    - '[спа́вшей]{.ru}'
  - base: '[о го́роде, в кото́ром мы жи́ли]{.ru}'
    cells:
    - '[о го́роде, в кото́ром мы жи́ли]{.ru}'
    - —
  - base: '[на у́лице, кото́рая ведёт к вокза́лу]{.ru}'
    cells:
    - '[на у́лице, кото́рая ведёт к вокза́лу]{.ru}'
    - '[веду́щей]{.ru}'
  - base: '[к студе́нту, кото́рый сдал экза́мен]{.ru}'
    cells:
    - '[к студе́нту, кото́рый сдал экза́мен]{.ru}'
    - '[сда́вшему]{.ru}'
  - base: '[Я прочита́л письмо́, кото́рое получи́ла ма́ма.]{.ru}'
    cells:
    - '[Я прочита́л письмо́, кото́рое получи́ла ма́ма.]{.ru}'
    - '[полу́ченное]{.ru}'
  why: |-
    第 1、2、5、10、12、13 题：[кото́рый]{.ru} 是第一格 → 主动形动词，时间、体不变，格跟名词：[игра́ющей, вы́росшем, изуча́вших, спа́вшей, веду́щей, сда́вшему]{.ru}。第 2 题 [вы́рос]{.ru} 以辅音结尾：[вы́росшем]{.ru}；第 12 题 [вести́]{.ru} 类：[веду́щей]{.ru}。
    第 3、8、14 题：完成体 + 第四格 [кото́рый]{.ru} → 被动形动词过去时：[переведённой (мои́м дру́гом), постро́енном (в 1900 году́), полу́ченное (ма́мой)]{.ru}。第 8 题原句是不定人称句，短语里没有发出者。
    第 9 题：未完成体现在时 + 第四格 → 被动形动词现在时：[уважа́емого (колле́гами)]{.ru}。
    第 4、11 题：[кото́рый]{.ru} 是第三格或带前置词，不能换。第 6 题：将来时不换。第 7 题：[писа́ть]{.ru} 没有被动形动词现在时。
- id: B3-L10-综合-c
  lessons: *id001
  tags:
  - 综合：长尾、短尾与名词化形动词
  recycles:
  - B3-L05-03
  - B3-L08-02
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Все ___ на ле́кцию студе́нты се́ли в пе́рвом ряду́.
    hint: прийти́
    accept:
    - прише́дшие
  - stem: Э́тот мост ___ в 1938 году́.
    hint: постро́ить
    accept:
    - был постро́ен
  - stem: Музе́й ___ с десяти́ до шести́.
    hint: откры́ть
    accept:
    - откры́т
  - stem: Для ___ в за́ле поста́вили сту́лья.
    hint: прису́тствовать
    accept:
    - прису́тствующих
  - stem: Мы говори́ли о ___ Ми́шей кни́ге.
    hint: прочита́ть
    accept:
    - прочи́танной
  - stem: В 2015 году́ в го́роде ___ пять но́вых школ.
    hint: откры́ть
    accept:
    - бы́ло откры́то
  - stem: Де́вушка, ___ сейча́с ря́дом со мной, — моя́ сестра́.
    hint: сиде́ть
    accept:
    - сидя́щая
  - stem: Экскурсово́д рассказа́л ___ об исто́рии музе́я.
    hint: отдыха́ть
    accept:
    - отдыха́ющим
  - stem: Зада́чи, ___ компью́тером, ста́ли бо́лее сло́жными.
    hint: реша́ть
    accept:
    - реша́емые
  - stem: За́втра на пло́щади ___ но́вая вы́ставка.
    hint: откры́ть
    accept:
    - бу́дет откры́та
  - stem: Мы встре́тили дру́га, ___ из а́рмии.
    hint: верну́ться
    accept:
    - верну́вшегося
  - stem: Э́та пробле́ма уже́ ___ на про́шлом собра́нии.
    hint: обсуди́ть
    accept:
    - была́ обсуждена́
  - stem: Ста́рый дом, ___ мои́м де́дом, стои́т на берегу́ реки́.
    hint: постро́ить
    accept:
    - постро́енный
  - stem: На вокза́ле нас ждала́ толпа́ ___.
    hint: встреча́ть
    accept:
    - встреча́ющих
  - stem: Все биле́ты на конце́рт уже́ ___.
    hint: прода́ть
    accept:
    - про́даны
  - stem: Мы подошли́ к ма́льчику, ___ у вхо́да в шко́лу.
    hint: пла́кать
    accept:
    - пла́чущему
  why: |-
    第 1、5、7、9、11、13、16 题：作定语用长尾，与名词一致：[прише́дшие]{.ru}（[идти́]{.ru} 类），[о прочи́танной кни́ге]{.ru}（短语在名词前，前置词 + 短语 + 名词），[сидя́щая]{.ru}（现在），[реша́емые]{.ru}（未完成体，带第五格），[верну́вшегося]{.ru}（动物名词第四格同第二格），[постро́енный]{.ru}（带第五格发出者），[к ма́льчику → пла́чущему]{.ru}。
    第 2、3、6、10、12、15 题：作谓语用短尾：过去 [был постро́ен, была́ обсуждена́]{.ru}，现在 [откры́т, про́даны]{.ru}（不用系词），将来 [бу́дет откры́та]{.ru}；第 6 题数量词组作主语用中性单数 [бы́ло откры́то]{.ru}。
    第 4、8、14 题：名词化的形动词按形容词变格：[для прису́тствующих, толпа́ встреча́ющих]{.ru}（第二格），[рассказа́л отдыха́ющим]{.ru}（第三格）。
- id: B3-L10-综合-d
  lessons: *id001
  tags:
  - 综合：改错
  recycles:
  - B3-L01-03
  - B3-L02-03
  - B3-L07-05
  - B3-L09-03
  - B3-L03-03
  task: 改正错误，正确的照抄。
  type: matrix
  cols:
  - 原文
  - 改正
  given:
  - 0
  rows:
  - base: '[прочита́ющий студе́нт]{.ru}'
    cells:
    - '[прочита́ющий студе́нт]{.ru}'
    - '[чита́ющий студе́нт]{.ru}'
  - base: '[вы́росвший в го́роде]{.ru}'
    cells:
    - '[вы́росвший в го́роде]{.ru}'
    - '[вы́росший в го́роде]{.ru}'
  - base: '[ку́пенный пода́рок]{.ru}'
    cells:
    - '[ку́пенный пода́рок]{.ru}'
    - '[ку́пленный пода́рок]{.ru}'
  - base: '[Рабо́та зако́нченна.]{.ru}'
    cells:
    - '[Рабо́та зако́нченна.]{.ru}'
    - '[Рабо́та зако́нчена.]{.ru}'
  - base: '[у соба́ки, слы́шавший звук]{.ru}'
    cells:
    - '[у соба́ки, слы́шавший звук]{.ru}'
    - '[у соба́ки, слы́шавшей звук]{.ru}'
  - base: '[Зда́ние был постро́ен в 1900 году́.]{.ru}'
    cells:
    - '[Зда́ние был постро́ен в 1900 году́.]{.ru}'
    - '[Зда́ние бы́ло постро́ено в 1900 году́.]{.ru}'
  - base: '[Мы разгова́ривали с отдыха́ющиеми.]{.ru}'
    cells:
    - '[Мы разгова́ривали с отдыха́ющиеми.]{.ru}'
    - '[Мы разгова́ривали с отдыха́ющими.]{.ru}'
  - base: '[Бы́ли ку́плены мно́го карти́н.]{.ru}'
    cells:
    - '[Бы́ли ку́плены мно́го карти́н.]{.ru}'
    - '[Бы́ло ку́плено мно́го карти́н.]{.ru}'
  - base: '[кни́га, пи́шемая а́втором]{.ru}'
    cells:
    - '[кни́га, пи́шемая а́втором]{.ru}'
    - '[кни́га, кото́рую пи́шет а́втор]{.ru}'
  - base: '[ра́неный в ру́ку солда́т]{.ru}'
    cells:
    - '[ра́неный в ру́ку солда́т]{.ru}'
    - '[ра́ненный в ру́ку солда́т]{.ru}'
  - base: '[передава́емая по ра́дио програ́мма]{.ru}'
    cells:
    - '[передава́емая по ра́дио програ́мма]{.ru}'
    - '[передава́емая по ра́дио програ́мма]{.ru}'
  - base: '[Он был одни́м из учёных, получи́вшим пре́мию.]{.ru}'
    cells:
    - '[Он был одни́м из учёных, получи́вшим пре́мию.]{.ru}'
    - '[Он был одни́м из учёных, получи́вших пре́мию.]{.ru}'
  - base: '[Мост был постро́ен рабо́чие.]{.ru}'
    cells:
    - '[Мост был постро́ен рабо́чие.]{.ru}'
    - '[Мост был постро́ен рабо́чими.]{.ru}'
  - base: '[уе́хавший в Москву́ сестра́]{.ru}'
    cells:
    - '[уе́хавший в Москву́ сестра́]{.ru}'
    - '[уе́хавшая в Москву́ сестра́]{.ru}'
  - base: '[Вы́ставка откры́та вчера́.]{.ru}'
    cells:
    - '[Вы́ставка откры́та вчера́.]{.ru}'
    - '[Вы́ставка была́ откры́та вчера́.]{.ru}'
  - base: '[зна́ющий три языка́ челове́к]{.ru}'
    cells:
    - '[зна́ющий три языка́ челове́к]{.ru}'
    - '[зна́ющий три языка́ челове́к]{.ru}'
  why: |-
    第 1 题：完成体没有现在时形动词：[чита́ющий]{.ru}。
    第 2 题：[вы́рос]{.ru} 不以 [-л]{.ru} 结尾，只加 [-ш-]{.ru}：[вы́росший]{.ru}。
    第 3 题：交替同单数第一人称 [куплю́]{.ru}：[ку́пленный]{.ru}。
    第 4 题：短尾只写一个 [н]{.ru}：[зако́нчена]{.ru}。
    第 5 题：形动词跟被说明的名词 [соба́ки]{.ru}（阴性第二格）一致，不跟短语里的 [звук]{.ru}：[слы́шавшей]{.ru}。
    第 6 题：系词和短尾与中性主语一致：[бы́ло постро́ено]{.ru}。
    第 7 题：名词化的形动词按形容词变格：[с отдыха́ющими]{.ru}。
    第 8 题：数量词组作主语，用中性单数：[Бы́ло ку́плено мно́го карти́н]{.ru}。
    第 9 题：[писа́ть]{.ru} 没有被动形动词现在时，只能用从句。
    第 10 题：带从属词的是形动词，写 [нн]{.ru}：[ра́ненный в ру́ку]{.ru}。
    第 11 题：原文正确，照抄：[-ава́ть]{.ru} 保留 [-ва-]{.ru}。
    第 12 题：[оди́н из]{.ru} 后形动词与复数第二格 [учёных]{.ru} 一致：[получи́вших]{.ru}。
    第 13 题：发出者用第五格：[рабо́чими]{.ru}。
    第 14 题：形动词与 [сестра́]{.ru} 一致：[уе́хавшая]{.ru}。
    第 15 题：[вчера́]{.ru} 说的是过去的事件，要加系词：[была́ откры́та]{.ru}；不带系词的 [откры́та]{.ru} 表示现在的状态。
    第 16 题：原文正确，照抄：名词前的短语不用逗号。
