heading: 第 60 课　第六单元复习
groups:
- id: L60-01
  tags: [复习：第二、三、六格对照]
  task: 写出词组的第二格、第三格和第六格（第六格带 [о / об / обо]{.ru}）。
  type: matrix
  cols: [第一格, 第二格, 第三格, 第六格]
  given: [0]
  recycles: [L56-03, L57-综合-a]
  rows:
  - {base: '[моя́ ста́ршая сестра́]{.ru}', cells: ['[моя́ ста́ршая сестра́]{.ru}', '[мое́й ста́ршей сестры́]{.ru}', '[мое́й ста́ршей сестре́]{.ru}', '[о мое́й ста́ршей сестре́]{.ru}']}
  - {base: '[мой мла́дший брат]{.ru}', cells: ['[мой мла́дший брат]{.ru}', '[моего́ мла́дшего бра́та]{.ru}', '[моему́ мла́дшему бра́ту]{.ru}', '[о моём мла́дшем бра́те]{.ru}']}
  - {base: '[наш но́вый учи́тель]{.ru}', cells: ['[наш но́вый учи́тель]{.ru}', '[на́шего но́вого учи́теля]{.ru}', '[на́шему но́вому учи́телю]{.ru}', '[о на́шем но́вом учи́теле]{.ru}']}
  - {base: '[э́та молода́я же́нщина]{.ru}', cells: ['[э́та молода́я же́нщина]{.ru}', '[э́той молодо́й же́нщины]{.ru}', '[э́той молодо́й же́нщине]{.ru}', '[об э́той молодо́й же́нщине]{.ru}']}
  - {base: '[тот ру́сский студе́нт]{.ru}', cells: ['[тот ру́сский студе́нт]{.ru}', '[того́ ру́сского студе́нта]{.ru}', '[тому́ ру́сскому студе́нту]{.ru}', '[о том ру́сском студе́нте]{.ru}']}
  - {base: '[твоя́ ма́ленькая дочь]{.ru}', cells: ['[твоя́ ма́ленькая дочь]{.ru}', '[твое́й ма́ленькой до́чери]{.ru}', '[твое́й ма́ленькой до́чери]{.ru}', '[о твое́й ма́ленькой до́чери]{.ru}']}
  - {base: '[их хоро́ший друг]{.ru}', cells: ['[их хоро́ший друг]{.ru}', '[их хоро́шего дру́га]{.ru}', '[их хоро́шему дру́гу]{.ru}', '[об их хоро́шем дру́ге]{.ru}']}
  - {base: '[ва́ша Мари́я]{.ru}', cells: ['[ва́ша Мари́я]{.ru}', '[ва́шей Мари́и]{.ru}', '[ва́шей Мари́и]{.ru}', '[о ва́шей Мари́и]{.ru}']}
  - {base: '[наш де́душка]{.ru}', cells: ['[наш де́душка]{.ru}', '[на́шего де́душки]{.ru}', '[на́шему де́душке]{.ru}', '[о на́шем де́душке]{.ru}']}
  - {base: '[он]{.ru}', cells: ['[он]{.ru}', '[его́]{.ru}', '[ему́]{.ru}', '[о нём]{.ru}']}
  - {base: '[она́]{.ru}', cells: ['[она́]{.ru}', '[её]{.ru}', '[ей]{.ru}', '[о ней]{.ru}']}
  - {base: '[я]{.ru}', cells: ['[я]{.ru}', '[меня́]{.ru}', '[мне]{.ru}', '[обо мне]{.ru}']}
  why: |
    第 2、3、5、7 题：阳性第二格和第三格只差一个字母：代词、形容词第二格 [-его / -ого]{.ru}，第三格 [-ему / -ому]{.ru}；名词第二格 [-а / -я]{.ru}，第三格 [-у / -ю]{.ru}；第六格是 [-ём / -ем / -ом]{.ru} 和 [-е]{.ru}。
    第 1、4 题：阴性修饰语三个格同形 [-ей / -ой]{.ru}；名词第二格 [-ы / -и]{.ru}，第三、六格 [-е]{.ru}。第 6、8 题 [до́чери, Мари́и]{.ru} 三个格都一样。
    第 9 题：[де́душка]{.ru} 修饰语用阳性（[на́шего, на́шему, на́шем]{.ru}），名词按阴性变（[де́душки, де́душке]{.ru}）。
    第 4、7 题：元音前用 [об]{.ru}：[об э́той, об их]{.ru}；第 12 题 [обо мне]{.ru}。第 7 题 [их]{.ru} 不变。
    第 10–12 题：人称代词第二格 [его́, её, меня́]{.ru}，第三格 [ему́, ей, мне]{.ru}，第六格前有前置词：[о нём, о ней]{.ru}。
- id: L60-02
  tags: [复习：喜欢、年龄、需要与短尾形容词核查]
  task: 每句都有一处错误，写出正确的句子。
  type: matrix
  cols: [有错误的句子, 正确的句子]
  given: [0]
  recycles: [L52-03, L53-03, L55-03, L59-02]
  rows:
  - {base: '[Мне нра́вится па́рки.]{.ru}', cells: ['[Мне нра́вится па́рки.]{.ru}', '[Мне нра́вятся па́рки.]{.ru}']}
  - {base: '[Мне нра́вилась Кремль.]{.ru}', cells: ['[Мне нра́вилась Кремль.]{.ru}', '[Мне нра́вился Кремль.]{.ru}']}
  - {base: '[Ему́ нра́вился чита́ть.]{.ru}', cells: ['[Ему́ нра́вился чита́ть.]{.ru}', '[Ему́ нра́вилось чита́ть.]{.ru}']}
  - {base: '[Ему́ два́дцать два лет.]{.ru}', cells: ['[Ему́ два́дцать два лет.]{.ru}', '[Ему́ два́дцать два го́да.]{.ru}']}
  - {base: '[Ми́ше бу́дут четы́рнадцать лет.]{.ru}', cells: ['[Ми́ше бу́дут четы́рнадцать лет.]{.ru}', '[Ми́ше бу́дет четы́рнадцать лет.]{.ru}']}
  - {base: '[Ба́бушка се́мьдесят лет.]{.ru}', cells: ['[Ба́бушка се́мьдесят лет.]{.ru}', '[Ба́бушке се́мьдесят лет.]{.ru}']}
  - {base: '[А́нне нужна́ сапоги́.]{.ru}', cells: ['[А́нне нужна́ сапоги́.]{.ru}', '[А́нне нужны́ сапоги́.]{.ru}']}
  - {base: '[Мне бы́ло нужна́ ша́пка.]{.ru}', cells: ['[Мне бы́ло нужна́ ша́пка.]{.ru}', '[Мне была́ нужна́ ша́пка.]{.ru}']}
  - {base: '[А́нне была́ интере́сно.]{.ru}', cells: ['[А́нне была́ интере́сно.]{.ru}', '[А́нне бы́ло интере́сно.]{.ru}']}
  - {base: '[Мне на́до был рабо́тать.]{.ru}', cells: ['[Мне на́до был рабо́тать.]{.ru}', '[Мне на́до бы́ло рабо́тать.]{.ru}']}
  - {base: '[О́льга Ви́кторовна, вы свобо́дна?]{.ru}', cells: ['[О́льга Ви́кторовна, вы свобо́дна?]{.ru}', '[О́льга Ви́кторовна, вы свобо́дны?]{.ru}']}
  - {base: '[А́нна был занята́.]{.ru}', cells: ['[А́нна был занята́.]{.ru}', '[А́нна была́ занята́.]{.ru}']}
  - {base: '[Я до́лжен идти́.]{.ru}', hint: 安娜说, cells: ['[Я до́лжен идти́.]{.ru}', '[Я должна́ идти́.]{.ru}']}
  - {base: '[Ми́ша рад снег.]{.ru}', cells: ['[Ми́ша рад снег.]{.ru}', '[Ми́ша рад сне́гу.]{.ru}']}
  - {base: '[Нам нужно́ пальто́.]{.ru}', cells: ['[Нам нужно́ пальто́.]{.ru}', '[Нам ну́жно пальто́.]{.ru}']}
  - {base: '[Ско́лько лет ты?]{.ru}', cells: ['[Ско́лько лет ты?]{.ru}', '[Ско́лько тебе́ лет?]{.ru}']}
  - {base: '[Мы был ра́ды.]{.ru}', cells: ['[Мы был ра́ды.]{.ru}', '[Мы бы́ли ра́ды.]{.ru}']}
  - {base: '[Ми́ше нра́вятся э́тот фильм.]{.ru}', cells: ['[Ми́ше нра́вятся э́тот фильм.]{.ru}', '[Ми́ше нра́вится э́тот фильм.]{.ru}']}
  why: |
    第 1–3 题：[нра́виться]{.ru} 跟被喜欢的东西变：复数 [нра́вятся па́рки]{.ru}，阳性 [нра́вился Кремль]{.ru}，不定式 [нра́вилось чита́ть]{.ru}。
    第 4–6 题：年龄：2–4 用 [го́да]{.ru}；将来时用单数 [бу́дет]{.ru}；人用第三格 [Ба́бушке]{.ru}。
    第 7、8 题：[ну́жен]{.ru} 和 [быть]{.ru} 都跟所需的东西变：[нужны́ сапоги́, была́ нужна́ ша́пка]{.ru}。
    第 9、10 题：无人称句过去时永远用 [бы́ло]{.ru}。
    第 11–13 题：短尾形容词和 [быть]{.ru} 跟第一格主语一致：[вы]{.ru} 用复数 [свобо́дны]{.ru}；[А́нна была́ занята́]{.ru}；女性说话人用 [должна́]{.ru}。
    第 14 题：[рад]{.ru} 后面用第三格表示为什么高兴：[рад сне́гу]{.ru}。
    第 15 题：[ну́жен]{.ru} 的中性形式重音在词干：[ну́жно]{.ru}。第 16 题：问年龄人用第三格：[Ско́лько тебе́ лет?]{.ru}
    第 17 题：复数主语 [мы]{.ru} 用 [бы́ли]{.ru}。第 18 题：[фильм]{.ru} 是单数，用 [нра́вится]{.ru}。
- id: L60-03
  tags: [复习：过去时系词的选择]
  task: 填入 [быть]{.ru} 的过去时形式（[был, была́, бы́ло, бы́ли]{.ru}）。
  type: fill
  recycles: [L53-02, L54-02, L55-04, L58-01, L59-03]
  items:
  - {stem: 'Вчера́ ___ хо́лодно.', hint: быть, accept: [бы́ло]}
  - {stem: 'А́нне ___ ску́чно.', hint: быть, accept: [бы́ло]}
  - {stem: 'Мне ___ нужна́ ша́пка.', hint: быть, accept: [была́]}
  - {stem: 'Ми́ше ___ нужны́ сапоги́.', hint: быть, accept: [бы́ли]}
  - {stem: 'Па́пе ___ ну́жен шарф.', hint: быть, accept: [был]}
  - {stem: 'Нам на́до ___ рабо́тать.', hint: быть, accept: [бы́ло]}
  - {stem: 'Де́душке ___ се́мьдесят лет.', hint: быть, accept: [бы́ло]}
  - {stem: 'Бра́ту ___ два́дцать оди́н год.', hint: быть, accept: [был]}
  - {stem: 'А́нна ___ занята́.', hint: быть, accept: [была́]}
  - {stem: 'Мы ___ свобо́дны.', hint: быть, accept: [бы́ли]}
  - {stem: 'Ван Лэй ___ рад.', hint: быть, accept: [был]}
  - {stem: 'Здесь нельзя́ ___ кури́ть.', hint: быть, accept: [бы́ло]}
  - {stem: 'Ему́ ___ ну́жно пальто́.', hint: быть, accept: [бы́ло]}
  - {stem: 'Ей ___ интере́сно.', hint: быть, accept: [бы́ло]}
  - {stem: 'Ю́ми должна́ ___ сдать зада́ние.', hint: быть, accept: [была́]}
  - {stem: 'Ко́шке ___ три го́да.', hint: быть, accept: [бы́ло]}
  why: |
    第 1、2、6、12、14 题：无人称句（天气、感受、[на́до, нельзя́]{.ru}）没有第一格主语，永远用 [бы́ло]{.ru}。
    第 7、16 题：年龄一般用 [бы́ло]{.ru}；第 8 题数词以 [оди́н]{.ru} 结尾，主语是阳性 [год]{.ru}，用 [был]{.ru}。
    第 3–5、13 题：[ну́жен]{.ru} 句里所需的东西是主语：[ша́пка → была́, сапоги́ → бы́ли, шарф → был, пальто́ → бы́ло]{.ru}。
    第 9–11、15 题：短尾形容词句跟第一格主语：[А́нна была́, мы бы́ли, Ван Лэй был, Ю́ми должна́ была́]{.ru}。
- id: L60-04
  tags: [复习：第三格句型中的人]
  task: 把括号里的词组变成第三格。
  type: fill
  recycles: [L52-04, L53-04, L57-综合-c, L58-综合-d]
  items:
  - {stem: '___ нра́вятся блины́.', hint: мой мла́дший брат, accept: [моему́ мла́дшему бра́ту]}
  - {stem: '___ се́мьдесят лет.', hint: на́ша ба́бушка, accept: [на́шей ба́бушке]}
  - {stem: '___ нужна́ ко́мната.', hint: э́тот студе́нт, accept: [э́тому студе́нту]}
  - {stem: '___ хо́лодно.', hint: она́, accept: [ей]}
  - {stem: '___ на́до рабо́тать.', hint: Ива́н Серге́евич, accept: [Ива́ну Серге́евичу]}
  - {stem: '___ понра́вился Кремль.', hint: ста́ршая сестра́, accept: [ста́ршей сестре́]}
  - {stem: '___ пятьдеся́т лет.', hint: мой оте́ц, accept: [моему́ отцу́]}
  - {stem: '___ ску́чно?', hint: твоя́ дочь, accept: [твое́й до́чери]}
  - {stem: '___ нра́вится э́тот парк.', hint: они́, accept: [им]}
  - {stem: '___ мо́жно гуля́ть.', hint: наш Ми́ша, accept: [на́шему Ми́ше]}
  - {stem: '___ нужны́ перча́тки.', hint: Мари́я Никола́евна, accept: [Мари́и Никола́евне]}
  - {stem: 'Ван Лэй звони́т ___.', hint: его́ ста́рый друг, accept: [его́ ста́рому дру́гу]}
  why: |
    第 1–11 题：[нра́виться]{.ru}、年龄、[ну́жен]{.ru}、[на́до, мо́жно]{.ru}、状态副词的句子里，人都用第三格。第 12 题 [звони́ть]{.ru} 的对象也用第三格。
    第 1、3、5、7、10、12 题：阳性词组：[моему́ мла́дшему бра́ту, э́тому студе́нту, Ива́ну Серге́евичу, моему́ отцу́, на́шему Ми́ше, его́ ста́рому дру́гу]{.ru}；[оте́ц → отцу́]{.ru}，[Ми́ша → Ми́ше]{.ru}，[его́]{.ru} 不变。
    第 2、6、8、11 题：阴性词组：[на́шей ба́бушке, ста́ршей сестре́, твое́й до́чери, Мари́и Никола́евне]{.ru}。
    第 4、9 题：[ей, им]{.ru}。
- id: L60-05
  tags: [复习：短尾形容词的性数与时间]
  task: 用给出的词写出现在时和过去时的句子。
  type: matrix
  cols: [主语和形容词, 现在, 过去]
  given: [0]
  recycles: [L59-01, L59-03]
  rows:
  - {base: '[А́нна, за́нят]{.ru}', cells: ['[А́нна, за́нят]{.ru}', '[А́нна занята́.]{.ru}', '[А́нна была́ занята́.]{.ru}']}
  - {base: '[па́па, свобо́ден]{.ru}', cells: ['[па́па, свобо́ден]{.ru}', '[Па́па свобо́ден.]{.ru}', '[Па́па был свобо́ден.]{.ru}']}
  - {base: '[мы, рад]{.ru}', cells: ['[мы, рад]{.ru}', '[Мы ра́ды.]{.ru}', '[Мы бы́ли ра́ды.]{.ru}']}
  - {base: '[ба́бушка, здоро́в]{.ru}', cells: ['[ба́бушка, здоро́в]{.ru}', '[Ба́бушка здоро́ва.]{.ru}', '[Ба́бушка была́ здоро́ва.]{.ru}']}
  - {base: '[вы, за́нят]{.ru}', hint: 对奥尔加·维克托罗夫娜说, cells: ['[вы, за́нят]{.ru}', '[Вы за́няты.]{.ru}', '[Вы бы́ли за́няты.]{.ru}']}
  - {base: '[я, свобо́ден]{.ru}', hint: 安娜说, cells: ['[я, свобо́ден]{.ru}', '[Я свобо́дна.]{.ru}', '[Я была́ свобо́дна.]{.ru}']}
  - {base: '[Ми́ша, до́лжен + рабо́тать]{.ru}', cells: ['[Ми́ша, до́лжен + рабо́тать]{.ru}', '[Ми́ша до́лжен рабо́тать.]{.ru}', '[Ми́ша до́лжен был рабо́тать.]{.ru}']}
  - {base: '[студе́нты, за́нят]{.ru}', cells: ['[студе́нты, за́нят]{.ru}', '[Студе́нты за́няты.]{.ru}', '[Студе́нты бы́ли за́няты.]{.ru}']}
  - {base: '[Ю́ми, рад]{.ru}', cells: ['[Ю́ми, рад]{.ru}', '[Ю́ми ра́да.]{.ru}', '[Ю́ми была́ ра́да.]{.ru}']}
  - {base: '[я, за́нят]{.ru}', hint: 王磊说, cells: ['[я, за́нят]{.ru}', '[Я за́нят.]{.ru}', '[Я был за́нят.]{.ru}']}
  - {base: '[ма́ма, до́лжен + купи́ть хлеб]{.ru}', cells: ['[ма́ма, до́лжен + купи́ть хлеб]{.ru}', '[Ма́ма должна́ купи́ть хлеб.]{.ru}', '[Ма́ма должна́ была́ купи́ть хлеб.]{.ru}']}
  why: |
    第 1–11 题：短尾形容词和 [быть]{.ru} 都跟第一格主语的性数一致：阴性 [занята́, здоро́ва, ра́да, должна́]{.ru} 配 [была́]{.ru}，阳性配 [был]{.ru}，复数配 [бы́ли]{.ru}。
    第 5 题：[вы]{.ru} 称呼一个人也用复数：[Вы за́няты, вы бы́ли за́няты]{.ru}。
    第 6、10 题：[я]{.ru} 按说话人的性别选：安娜说 [свобо́дна, была́]{.ru}，王磊说 [за́нят, был]{.ru}。
    第 7、11 题：[быть]{.ru} 一般放在 [до́лжен]{.ru} 后面：[до́лжен был, должна́ была́]{.ru}；放在前面也对。
