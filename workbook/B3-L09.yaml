heading: 第 9 课　被动结构
groups:
- id: B3-L09-01
  lessons:
  - B3-L09
  tags:
  - 被动结构：-ся 动词、短尾、不定人称句对照
  task: 用三种被动说法写出过去时的谓语。
  type: matrix
  cols:
  - 体对 + 主语
  - -ся 动词
  - 短尾被动形动词
  - 不定人称句
  given:
  - 0
  rows:
  - base: '[стро́ить / постро́ить + мост]{.ru}'
    cells:
    - '[стро́ить / постро́ить + мост]{.ru}'
    - '[стро́ился]{.ru}'
    - '[был постро́ен]{.ru}'
    - '[постро́или]{.ru}'
  - base: '[гото́вить / пригото́вить + обе́д]{.ru}'
    cells:
    - '[гото́вить / пригото́вить + обе́д]{.ru}'
    - '[гото́вился]{.ru}'
    - '[был пригото́влен]{.ru}'
    - '[пригото́вили]{.ru}'
  - base: '[открыва́ть / откры́ть + вы́ставка]{.ru}'
    cells:
    - '[открыва́ть / откры́ть + вы́ставка]{.ru}'
    - '[открыва́лась]{.ru}'
    - '[была́ откры́та]{.ru}'
    - '[откры́ли]{.ru}'
  - base: '[обсужда́ть / обсуди́ть + вопро́с]{.ru}'
    cells:
    - '[обсужда́ть / обсуди́ть + вопро́с]{.ru}'
    - '[обсужда́лся]{.ru}'
    - '[был обсуждён]{.ru}'
    - '[обсуди́ли]{.ru}'
  - base: '[издава́ть / изда́ть + кни́ги]{.ru}'
    cells:
    - '[издава́ть / изда́ть + кни́ги]{.ru}'
    - '[издава́лись]{.ru}'
    - '[бы́ли и́зданы]{.ru}'
    - '[изда́ли]{.ru}'
  - base: '[реша́ть / реши́ть + пробле́ма]{.ru}'
    cells:
    - '[реша́ть / реши́ть + пробле́ма]{.ru}'
    - '[реша́лась]{.ru}'
    - '[была́ решена́]{.ru}'
    - '[реши́ли]{.ru}'
  - base: '[переводи́ть / перевести́ + письмо́]{.ru}'
    cells:
    - '[переводи́ть / перевести́ + письмо́]{.ru}'
    - '[переводи́лось]{.ru}'
    - '[бы́ло переведено́]{.ru}'
    - '[перевели́]{.ru}'
  - base: '[создава́ть / созда́ть + фильм]{.ru}'
    cells:
    - '[создава́ть / созда́ть + фильм]{.ru}'
    - '[создава́лся]{.ru}'
    - '[был со́здан]{.ru}'
    - '[со́здали]{.ru}'
  - base: '[продава́ть / прода́ть + биле́ты]{.ru}'
    cells:
    - '[продава́ть / прода́ть + биле́ты]{.ru}'
    - '[продава́лись]{.ru}'
    - '[бы́ли про́даны]{.ru}'
    - '[про́дали]{.ru}'
  - base: '[писа́ть / написа́ть + статья́]{.ru}'
    cells:
    - '[писа́ть / написа́ть + статья́]{.ru}'
    - '[писа́лась]{.ru}'
    - '[была́ напи́сана]{.ru}'
    - '[написа́ли]{.ru}'
  - base: '[проверя́ть / прове́рить + рабо́ты]{.ru}'
    cells:
    - '[проверя́ть / прове́рить + рабо́ты]{.ru}'
    - '[проверя́лись]{.ru}'
    - '[бы́ли прове́рены]{.ru}'
    - '[прове́рили]{.ru}'
  - base: '[запуска́ть / запусти́ть + раке́та]{.ru}'
    cells:
    - '[запуска́ть / запусти́ть + раке́та]{.ru}'
    - '[запуска́лась]{.ru}'
    - '[была́ запу́щена]{.ru}'
    - '[запусти́ли]{.ru}'
    hint: запущу́, запу́стишь
    new: true
    gloss: 发射
  why: |-
    第 1–12 题：[-ся]{.ru} 动词由未完成体构成，过去时与主语的性、数一致：[мост стро́ился, вы́ставка открыва́лась, письмо́ переводи́лось, кни́ги издава́лись]{.ru}。短尾被动形动词由完成体构成，系词和短尾都与主语一致：[был постро́ен, была́ откры́та, бы́ло переведено́, бы́ли и́зданы]{.ru}。不定人称句没有主语，谓语一律用复数过去时：[постро́или, откры́ли, перевели́]{.ru}，原来的主语变成第四格宾语（[Вы́ставку откры́ли]{.ru}）。
    第 4、6、7 题：[-ён]{.ru} 类短尾重音在词尾：[обсуждён, решена́, переведено́]{.ru}。第 2、11、12 题：交替同单数第一人称：[пригото́влен, прове́рены, запу́щена]{.ru}。
    第 5、8、9 题：[-ава́ть]{.ru} 动词的 [-ся]{.ru} 形式保留 [-ва-]{.ru}：[издава́лись, создава́лся, продава́лись]{.ru}；[со́здали, про́дали]{.ru} 的重音在前缀上。
- id: B3-L09-02
  lessons:
  - B3-L09
  tags:
  - 被动结构：过程还是结果（-ся 动词与短尾）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Раке́та ___ не́сколько лет, и то́лько в 1957 году́ рабо́ту зако́нчили.
    hint: стро́ить / постро́ить
    accept:
    - стро́илась
  - stem: Наконе́ц в 1957 году́ раке́та ___.
    hint: стро́ить / постро́ить
    accept:
    - была́ постро́ена
  - stem: В на́шей шко́ле э́та пробле́ма ___ уже́ не́сколько лет, но реше́ния пока́ нет.
    hint: обсужда́ть / обсуди́ть
    accept:
    - обсужда́ется
  - stem: Вчера́ на собра́нии ___ пробле́ма тра́нспорта, и тепе́рь все зна́ют реше́ние.
    hint: обсужда́ть / обсуди́ть
    accept:
    - была́ обсуждена́
  - stem: Ра́ньше э́та газе́та ___ ка́ждый день.
    hint: выпуска́ть / вы́пустить
    accept:
    - выпуска́лась
    new: true
    gloss: 出版，发行
  - stem: Пе́рвая кни́га писа́теля ___ в 1990 году́.
    hint: издава́ть / изда́ть
    accept:
    - была́ и́здана
  - stem: Сейча́с в на́шем райо́не ___ но́вая шко́ла; её откро́ют в сентябре́.
    hint: стро́ить / постро́ить
    accept:
    - стро́ится
  - stem: Зада́ча ___ за пять мину́т.
    hint: реша́ть / реши́ть
    accept:
    - была́ решена́
  - stem: Ка́ждое ле́то в на́шем музе́е ___ вы́ставка молоды́х худо́жников.
    hint: устра́ивать / устро́ить
    accept:
    - устра́ивается
    new: true
    gloss: 举办
  - stem: Вы́ставка ___ ещё в ма́е, и с тех пор там бы́ло мно́го посети́телей.
    hint: открыва́ть / откры́ть
    accept:
    - была́ откры́та
  - stem: Экспеди́ция ___ два го́да.
    hint: гото́вить / подгото́вить
    accept:
    - гото́вилась
  - stem: В конце́ концо́в экспеди́ция ___, и в ию́не она́ начала́сь.
    hint: гото́вить / подгото́вить
    accept:
    - была́ подгото́влена
  why: |-
    第 1、3、5、7、9、11 题：说的是持续的过程（[не́сколько лет, два го́да]{.ru}）、反复或经常的事（[ка́ждый день, ка́ждое ле́то]{.ru}）、正在进行的事（[сейча́с]{.ru}），用未完成体 [-ся]{.ru} 动词：[стро́илась, обсужда́ется, выпуска́лась, стро́ится, устра́ивается, гото́вилась]{.ru}。时间看句子：第 3、7、9 题是现在时。
    第 2、4、6、8、10、12 题：说的是一次完成的结果（[наконе́ц, за пять мину́т, в конце́ концо́в]{.ru}，“现在大家都知道决定了”），用完成体短尾被动形动词，[быть]{.ru} 与主语一致：[была́ постро́ена, была́ обсуждена́, была́ и́здана, была́ решена́, была́ откры́та, была́ подгото́влена]{.ru}。完成体加 [-ся]{.ru}（[постро́илась]{.ru}）一般不表被动。
- id: B3-L09-03
  lessons:
  - B3-L09
  tags:
  - 被动结构：改错
  task: 改正错误，正确的照抄。
  type: matrix
  cols:
  - 句子
  - 改正
  given:
  - 0
  rows:
  - base: '[В 1938 году́ его́ арестова́л.]{.ru}'
    cells:
    - '[В 1938 году́ его́ арестова́л.]{.ru}'
    - '[В 1938 году́ его́ арестова́ли.]{.ru}'
  - base: '[Мост постро́ился в 1960 году́.]{.ru}'
    cells:
    - '[Мост постро́ился в 1960 году́.]{.ru}'
    - '[Мост был постро́ен в 1960 году́.]{.ru}'
  - base: '[Статья́ был напи́сан мои́м дру́гом.]{.ru}'
    cells:
    - '[Статья́ был напи́сан мои́м дру́гом.]{.ru}'
    - '[Статья́ была́ напи́сана мои́м дру́гом.]{.ru}'
  - base: '[Э́ти дома́ стро́ились пять лет.]{.ru}'
    cells:
    - '[Э́ти дома́ стро́ились пять лет.]{.ru}'
    - '[Э́ти дома́ стро́ились пять лет.]{.ru}'
  - base: '[Письмо́ бы́ло отпра́влена вчера́.]{.ru}'
    cells:
    - '[Письмо́ бы́ло отпра́влена вчера́.]{.ru}'
    - '[Письмо́ бы́ло отпра́влено вчера́.]{.ru}'
  - base: '[Раке́ту созда́ли констру́кторами.]{.ru}'
    cells:
    - '[Раке́ту созда́ли констру́кторами.]{.ru}'
    - '[Раке́та была́ со́здана констру́кторами. / Констру́кторы со́здали раке́ту.]{.ru}'
  - base: '[Его́ похорони́ли в Москве́.]{.ru}'
    cells:
    - '[Его́ похорони́ли в Москве́.]{.ru}'
    - '[Его́ похорони́ли в Москве́.]{.ru}'
  - base: '[Кни́га издала́сь в 2005 году́.]{.ru}'
    cells:
    - '[Кни́га издала́сь в 2005 году́.]{.ru}'
    - '[Кни́га была́ и́здана в 2005 году́.]{.ru}'
  - base: '[Сейча́с в го́роде стро́ят но́вое метро́.]{.ru}'
    cells:
    - '[Сейча́с в го́роде стро́ят но́вое метро́.]{.ru}'
    - '[Сейча́с в го́роде стро́ят но́вое метро́.]{.ru}'
  - base: '[Вы́ставка бу́дет откры́т в ма́е.]{.ru}'
    cells:
    - '[Вы́ставка бу́дет откры́т в ма́е.]{.ru}'
    - '[Вы́ставка бу́дет откры́та в ма́е.]{.ru}'
  why: |-
    第 1 题：不定人称句的谓语用复数：[арестова́ли]{.ru}；单数 [арестова́л]{.ru} 缺主语，句子不完整。
    第 2、8 题：完成体加 [-ся]{.ru} 一般不表被动；一次完成的结果用短尾被动形动词：[был постро́ен, была́ и́здана]{.ru}。
    第 3、5、10 题：系词和短尾与主语的性一致：[статья́ была́ напи́сана]{.ru}，[письмо́ бы́ло отпра́влено]{.ru}，[вы́ставка бу́дет откры́та]{.ru}。
    第 6 题：不定人称句里不能有第五格发出者；要说出发出者，改用短尾被动形动词（[Раке́та была́ со́здана / создана́ констру́кторами]{.ru}）或主动句（[Констру́кторы со́здали раке́ту]{.ru}）。
    第 4、7、9 题：原文正确，照抄：未完成体 [-ся]{.ru} 动词表过程，不定人称句用复数。
