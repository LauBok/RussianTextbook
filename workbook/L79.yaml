heading: 第 79 课　关系代词（第一格）
groups:
- id: L79-01
  tags:
  - 关系代词 который：性数选择
  task: 写出说明下列名词时 [кото́рый]{.ru} 的第一格形式。
  type: matrix
  cols:
  - 名词
  - '[кото́рый]{.ru} 的形式'
  given:
  - 0
  rows:
  - base: '[парк]{.ru}'
    cells:
    - '[парк]{.ru}'
    - '[кото́рый]{.ru}'
  - base: '[у́лица]{.ru}'
    cells:
    - '[у́лица]{.ru}'
    - '[кото́рая]{.ru}'
  - base: '[кафе́]{.ru}'
    cells:
    - '[кафе́]{.ru}'
    - '[кото́рое]{.ru}'
  - base: '[худо́жники]{.ru}'
    cells:
    - '[худо́жники]{.ru}'
    - '[кото́рые]{.ru}'
  - base: '[мост]{.ru}'
    cells:
    - '[мост]{.ru}'
    - '[кото́рый]{.ru}'
  - base: '[ме́сто]{.ru}'
    cells:
    - '[ме́сто]{.ru}'
    - '[кото́рое]{.ru}'
  - base: '[пло́щадь]{.ru}'
    cells:
    - '[пло́щадь]{.ru}'
    - '[кото́рая]{.ru}'
  - base: '[музе́й]{.ru}'
    cells:
    - '[музе́й]{.ru}'
    - '[кото́рый]{.ru}'
  - base: '[метро́]{.ru}'
    cells:
    - '[метро́]{.ru}'
    - '[кото́рое]{.ru}'
  - base: '[слова́рь]{.ru}'
    cells:
    - '[слова́рь]{.ru}'
    - '[кото́рый]{.ru}'
  - base: '[тетра́дь]{.ru}'
    cells:
    - '[тетра́дь]{.ru}'
    - '[кото́рая]{.ru}'
  - base: '[де́вушка]{.ru}'
    cells:
    - '[де́вушка]{.ru}'
    - '[кото́рая]{.ru}'
  - base: '[де́ти]{.ru}'
    cells:
    - '[де́ти]{.ru}'
    - '[кото́рые]{.ru}'
  - base: '[Кремль]{.ru}'
    cells:
    - '[Кремль]{.ru}'
    - '[кото́рый]{.ru}'
  - base: '[зда́ние]{.ru}'
    cells:
    - '[зда́ние]{.ru}'
    - '[кото́рое]{.ru}'
  - base: '[па́па]{.ru}'
    cells:
    - '[па́па]{.ru}'
    - '[кото́рый]{.ru}'
  why: |
    第 1、5、8、10、14、16 题：阳性名词用 [кото́рый]{.ru}。[слова́рь, Кремль]{.ru} 是阳性 [-ь]{.ru} 词；第 16 题 [па́па]{.ru} 以 [-а]{.ru} 结尾，但指男性，用 [кото́рый]{.ru}。
    第 2、7、11、12 题：阴性名词用 [кото́рая]{.ru}；[пло́щадь, тетра́дь]{.ru} 是阴性 [-ь]{.ru} 词，要记住性。
    第 3、6、9、15 题：中性名词用 [кото́рое]{.ru}；[кафе́, метро́]{.ru} 不变格，是中性。
    第 4、13 题：复数名词用 [кото́рые]{.ru}。
- id: L79-02
  tags:
  - 关系代词 который：性数选择
  - 关系代词 который：从句谓语配合
  task: 判断句子是否正确；有错的说出错在哪里。
  type: classify
  bins:
  - '[да]{.ru}（正确）'
  - '[нет]{.ru}（有错）'
  items:
  - text: '[Э́то у́лица, кото́рый мне нра́вится.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Э́то парк, кото́рый нахо́дится в це́нтре.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то кафе́, кото́рая нахо́дится ря́дом с метро́.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Там рабо́тают худо́жники, кото́рые рису́ют портре́ты.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то парк, кото́рый он нахо́дится ря́дом с Кремлём.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Э́то де́вушка кото́рая показа́ла мне доро́гу.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Э́то студе́нты, кото́рые е́здили в Петербу́рг.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то музе́й, кото́рый была́ здесь ра́ньше.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Э́то пло́щадь, кото́рая нахо́дится в це́нтре.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то мост, кото́рое виси́т над реко́й.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Э́то ме́сто, кото́рое мне нра́вится.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то слова́рь, кото́рая лежа́ла на столе́.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Где тетра́дь, кото́рая лежа́ла здесь?]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то де́ти, кото́рые игра́ют в па́рке.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Э́то музыка́нт, кото́рые игра́ет на гита́ре.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Э́то кни́га, кото́рая мне о́чень понра́вилась.]{.ru}'
    answer: '[да]{.ru}（正确）'
  why: |
    第 1 题：[у́лица]{.ru} 是阴性，应该用 [кото́рая]{.ru}。
    第 3 题：[кафе́]{.ru} 是中性，应该用 [кото́рое]{.ru}。
    第 5 题：[кото́рый]{.ru} 已经是从句的主语，不能再加 [он]{.ru}。
    第 6 题：从句前面一定要有逗号：[Э́то де́вушка, кото́рая…]{.ru}
    第 8 题：[кото́рый]{.ru} 指阳性 [музе́й]{.ru}，动词也用阳性：[кото́рый был]{.ru}。
    第 10 题：[мост]{.ru} 是阳性：[кото́рый виси́т]{.ru}。
    第 12 题：[слова́рь]{.ru} 是阳性：[кото́рый лежа́л]{.ru}。
    第 15 题：[музыка́нт]{.ru} 是单数：[кото́рый игра́ет]{.ru}。
    第 2、4、7、9、11、13、14、16 题：[кото́рый]{.ru} 和名词、动词的性数都一致，有逗号，正确。
- id: L79-03
  tags:
  - 关系代词 который：性数选择
  - 关系代词 который：从句谓语配合
  task: 在两个空里填上 [кото́рый]{.ru} 的形式和括号里动词的过去时。
  type: matrix
  cols:
  - 句子
  - '[кото́рый]{.ru}'
  - 动词过去时
  given:
  - 0
  rows:
  - base: '[Э́то кни́га, … … на столе́.]{.ru}（[лежа́ть]{.ru}）'
    cells:
    - '[Э́то кни́га, … … на столе́.]{.ru}（[лежа́ть]{.ru}）'
    - '[кото́рая]{.ru}'
    - '[лежа́ла]{.ru}'
  - base: '[Э́то музе́й, … … здесь ра́ньше.]{.ru}（[быть]{.ru}）'
    cells:
    - '[Э́то музе́й, … … здесь ра́ньше.]{.ru}（[быть]{.ru}）'
    - '[кото́рый]{.ru}'
    - '[был]{.ru}'
  - base: '[Э́то де́вушка, … … мне доро́гу.]{.ru}（[показа́ть]{.ru}）'
    cells:
    - '[Э́то де́вушка, … … мне доро́гу.]{.ru}（[показа́ть]{.ru}）'
    - '[кото́рая]{.ru}'
    - '[показа́ла]{.ru}'
  - base: '[Э́то студе́нты, … … в Петербу́рг.]{.ru}（[е́здить]{.ru}）'
    cells:
    - '[Э́то студе́нты, … … в Петербу́рг.]{.ru}（[е́здить]{.ru}）'
    - '[кото́рые]{.ru}'
    - '[е́здили]{.ru}'
  - base: '[Э́то кафе́, … … ря́дом с метро́.]{.ru}（[быть]{.ru}）'
    cells:
    - '[Э́то кафе́, … … ря́дом с метро́.]{.ru}（[быть]{.ru}）'
    - '[кото́рое]{.ru}'
    - '[бы́ло]{.ru}'
  - base: '[Э́то худо́жник, … … мой портре́т.]{.ru}（[рисова́ть]{.ru}）'
    cells:
    - '[Э́то худо́жник, … … мой портре́т.]{.ru}（[рисова́ть]{.ru}）'
    - '[кото́рый]{.ru}'
    - '[рисова́л]{.ru}'
  - base: '[Где письмо́, … … на столе́?]{.ru}（[лежа́ть]{.ru}）'
    cells:
    - '[Где письмо́, … … на столе́?]{.ru}（[лежа́ть]{.ru}）'
    - '[кото́рое]{.ru}'
    - '[лежа́ло]{.ru}'
  - base: '[Вот поэ́т, … … э́ту кни́гу.]{.ru}（[написа́ть]{.ru}）'
    cells:
    - '[Вот поэ́т, … … э́ту кни́гу.]{.ru}（[написа́ть]{.ru}）'
    - '[кото́рый]{.ru}'
    - '[написа́л]{.ru}'
  - base: '[Где ру́чка, … … здесь?]{.ru}（[лежа́ть]{.ru}）'
    cells:
    - '[Где ру́чка, … … здесь?]{.ru}（[лежа́ть]{.ru}）'
    - '[кото́рая]{.ru}'
    - '[лежа́ла]{.ru}'
  - base: '[Э́то сосе́ди, … … ра́ньше в на́шем до́ме.]{.ru}（[жить]{.ru}）'
    cells:
    - '[Э́то сосе́ди, … … ра́ньше в на́шем до́ме.]{.ru}（[жить]{.ru}）'
    - '[кото́рые]{.ru}'
    - '[жи́ли]{.ru}'
  - base: '[Э́то фильм, … нам о́чень … .]{.ru}（[понра́виться]{.ru}）'
    cells:
    - '[Э́то фильм, … нам о́чень … .]{.ru}（[понра́виться]{.ru}）'
    - '[кото́рый]{.ru}'
    - '[понра́вился]{.ru}'
  - base: '[Э́то музыка́нт, … … на Арба́те.]{.ru}（[игра́ть]{.ru}）'
    cells:
    - '[Э́то музыка́нт, … … на Арба́те.]{.ru}（[игра́ть]{.ru}）'
    - '[кото́рый]{.ru}'
    - '[игра́л]{.ru}'
  - base: '[Э́то де́вушки, … … в кафе́.]{.ru}（[сиде́ть]{.ru}）'
    cells:
    - '[Э́то де́вушки, … … в кафе́.]{.ru}（[сиде́ть]{.ru}）'
    - '[кото́рые]{.ru}'
    - '[сиде́ли]{.ru}'
  - base: '[Э́то ме́сто, … нам … .]{.ru}（[понра́виться]{.ru}）'
    cells:
    - '[Э́то ме́сто, … нам … .]{.ru}（[понра́виться]{.ru}）'
    - '[кото́рое]{.ru}'
    - '[понра́вилось]{.ru}'
  why: |
    第 1–14 题：[кото́рый]{.ru} 的性数跟前面的名词一致；它在从句里作主语，所以从句的过去时动词又跟 [кото́рый]{.ru} 一致：[кни́га, кото́рая лежа́ла]{.ru}，[музе́й, кото́рый был]{.ru}，[студе́нты, кото́рые е́здили]{.ru}。
    第 5、7、14 题：中性：[кото́рое бы́ло, кото́рое лежа́ло, кото́рое понра́вилось]{.ru}。
    第 11、14 题：[понра́виться]{.ru} 的主语是被喜欢的东西，喜欢的人用第三格 [нам]{.ru}，动词跟 [кото́рый]{.ru} 一致：[фильм, кото́рый нам понра́вился]{.ru}。
    第 10 题：[жить]{.ru} 复数过去时 [жи́ли]{.ru}。
