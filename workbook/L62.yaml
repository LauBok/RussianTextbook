heading: 第 62 课　人称代词第五格
groups:
- id: L62-01
  tags:
  - 人称代词第五格
  task: 写出代词的第五格和带 [с]{.ru} 的形式。
  type: matrix
  cols:
  - 原形
  - 第五格
  - '[с]{.ru} + 第五格'
  given:
  - 0
  rows:
  - base: '[я]{.ru}'
    cells:
    - '[я]{.ru}'
    - '[мной]{.ru}'
    - '[со мной]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[тобо́й]{.ru}'
    - '[с тобо́й]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[им]{.ru}'
    - '[с ним]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[ей]{.ru}'
    - '[с ней]{.ru}'
  - base: '[оно́]{.ru}'
    cells:
    - '[оно́]{.ru}'
    - '[им]{.ru}'
    - '[с ним]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[на́ми]{.ru}'
    - '[с на́ми]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[ва́ми]{.ru}'
    - '[с ва́ми]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[и́ми]{.ru}'
    - '[с ни́ми]{.ru}'
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[кем]{.ru}'
    - '[с кем]{.ru}'
  - base: '[что]{.ru}'
    cells:
    - '[что]{.ru}'
    - '[чем]{.ru}'
    - '[с чем]{.ru}'
  - base: '[себя́]{.ru}'
    cells:
    - '[себя́]{.ru}'
    - '[собо́й]{.ru}'
    - '[с собо́й]{.ru}'
  why: |
    第 1 题：[я — мной]{.ru}，带前置词写成 [со мной]{.ru}，不写 [с мной]{.ru}。
    第 2、6、7 题：[тобо́й, на́ми, ва́ми]{.ru} 前加 [с]{.ru} 不变。
    第 3–5、8 题：第三人称代词本身是 [им, ей, и́ми]{.ru}，在前置词后面要加 [н-]{.ru}：[с ним, с ней, с ни́ми]{.ru}。[оно́]{.ru} 和 [он]{.ru} 同形。
    第 9、10 题：问人用 [с кем]{.ru}，问事物用 [с чем]{.ru}。
    第 11 题：[себя́]{.ru} 没有第一格，第五格是 [собо́й]{.ru}：[с собо́й]{.ru}（随身）。
- id: L62-02
  tags:
  - 人称代词第五格：名词换代词
  task: 把名词换成人称代词。
  type: matrix
  cols:
  - 名词词组
  - 代词词组
  given:
  - 0
  rows:
  - base: '[с А́нной]{.ru}'
    cells:
    - '[с А́нной]{.ru}'
    - '[с ней]{.ru}'
  - base: '[с бра́том]{.ru}'
    cells:
    - '[с бра́том]{.ru}'
    - '[с ним]{.ru}'
  - base: '[с Ми́шей]{.ru}'
    cells:
    - '[с Ми́шей]{.ru}'
    - '[с ним]{.ru}'
  - base: '[с подру́гой]{.ru}'
    cells:
    - '[с подру́гой]{.ru}'
    - '[с ней]{.ru}'
  - base: '[с де́душкой]{.ru}'
    cells:
    - '[с де́душкой]{.ru}'
    - '[с ним]{.ru}'
  - base: '[с ма́мой и па́пой]{.ru}'
    cells:
    - '[с ма́мой и па́пой]{.ru}'
    - '[с ни́ми]{.ru}'
  - base: '[с Ю́ми]{.ru}'
    cells:
    - '[с Ю́ми]{.ru}'
    - '[с ней]{.ru}'
  - base: '[с Пье́ром]{.ru}'
    cells:
    - '[с Пье́ром]{.ru}'
    - '[с ним]{.ru}'
  - base: '[с ко́шкой]{.ru}'
    cells:
    - '[с ко́шкой]{.ru}'
    - '[с ней]{.ru}'
  - base: '[с до́черью]{.ru}'
    cells:
    - '[с до́черью]{.ru}'
    - '[с ней]{.ru}'
  - base: '[с письмо́м]{.ru}'
    cells:
    - '[с письмо́м]{.ru}'
    - '[с ним]{.ru}'
  - base: '[с О́льгой Ви́кторовной]{.ru}'
    cells:
    - '[с О́льгой Ви́кторовной]{.ru}'
    - '[с ней]{.ru}'
  - base: '[с Ива́ном Серге́евичем]{.ru}'
    cells:
    - '[с Ива́ном Серге́евичем]{.ru}'
    - '[с ним]{.ru}'
  - base: '[с Ка́тей и Та́ней]{.ru}'
    cells:
    - '[с Ка́тей и Та́ней]{.ru}'
    - '[с ни́ми]{.ru}'
  why: |
    第 1、4、7、9、10、12 题：阴性名词换成 [с ней]{.ru}。[Ю́ми]{.ru} 不变格，但指女性，也换成 [с ней]{.ru}。
    第 2、3、5、8、13 题：指男性换成 [с ним]{.ru}。[Ми́ша, де́душка]{.ru} 虽然按阴性变成 [-ей, -ой]{.ru}，代词要看实际的性：[с ним]{.ru}。
    第 11 题：中性 [письмо́]{.ru} 用 [оно́]{.ru} 指代，第五格同 [он]{.ru}：[с ним]{.ru}。
    第 6、14 题：两个人合起来是 [они́]{.ru}：[с ни́ми]{.ru}。前置词后都要加 [н-]{.ru}。
- id: L62-03
  tags:
  - 人称代词第五格：н- 与 со мной
  - мы с 句型：谓语配合
  task: 判断下列说法是否正确。
  type: classify
  bins:
  - '[да]{.ru}（正确）'
  - '[нет]{.ru}（有错）'
  items:
  - text: '[Мы с А́нной идём в кино́.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я иду́ в кино́ с им.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ми́ша игра́ет со мной.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Па́па говори́т с мной.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Мы с бра́том живём в Москве́.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Мы с Ми́шей игра́ет в футбо́л.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Вы с па́пой смо́трите телеви́зор?]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я говорю́ с его́ бра́том.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я говорю́ с него́ бра́том.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ка́тя сиди́т с ни́ми.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Они́ с ма́мой гото́вят у́жин.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Ты с сестро́й отдыха́ешь на да́че?]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Мы с ней у́чимся вме́сте.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Я с А́нной идём в магази́н.]{.ru}'
    answer: '[нет]{.ru}（有错）'
  - text: '[Ты идёшь в кино́ с на́ми?]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Ба́бушка живёт с ней.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[А́нна берёт кни́гу с собо́й.]{.ru}'
    answer: '[да]{.ru}（正确）'
  - text: '[Ты идёшь с ей?]{.ru}'
    answer: '[нет]{.ru}（有错）'
  why: |
    第 1、5、7、11、13 题：[мы с …, вы с …, они́ с …]{.ru} 指两个人，谓语用复数：[идём, живём, смо́трите, гото́вят, у́чимся]{.ru}。
    第 2、18 题：前置词后第三人称代词要加 [н-]{.ru}：改成 [с ним, с ней]{.ru}。
    第 3、4 题：“和我”是 [со мной]{.ru}；第 4 题要改成 [со мной]{.ru}。
    第 6 题：[мы с Ми́шей]{.ru} 是两个人，动词用复数：改成 [игра́ем]{.ru}。
    第 8、9 题：物主代词 [его́]{.ru}“他的”永远不变，也不加 [н-]{.ru}：第 9 题改成 [с его́ бра́том]{.ru}。
    第 10、16 题：[с ни́ми, с ней]{.ru} 写法正确。
    第 12 题：主语是 [ты]{.ru}，[с сестро́й]{.ru} 只是补充，谓语用 [ты]{.ru} 的形式 [отдыха́ешь]{.ru}，正确。
    第 14 题：主语只有 [я]{.ru}，动词应该用 [иду́]{.ru}；或者说成 [Мы с А́нной идём]{.ru}。
    第 15 题：[с на́ми]{.ru} 正确。第 17 题：[с собо́й]{.ru}“随身”正确。
- id: L62-04
  tags:
  - мы с 句型：谓语配合
  task: 按主语写出括号里动词的现在时。
  type: fill
  items:
  - stem: Мы с А́нной ___ в кино́.
    hint: идти́
    accept:
    - идём
  - stem: Мы с бра́том ___ в Москве́.
    hint: жить
    accept:
    - живём
  - stem: Вы с па́пой ___ телеви́зор?
    hint: смотре́ть
    accept:
    - смо́трите
  - stem: Они́ с ма́мой ___ у́жин.
    hint: гото́вить
    accept:
    - гото́вят
  - stem: Я с бра́том ___ в Москве́.
    hint: жить
    accept:
    - живу́
  - stem: Мы с ним ___ вме́сте.
    hint: учи́ться
    accept:
    - у́чимся
  - stem: Ты с Ка́тей ___ в кино́?
    hint: идти́
    accept:
    - идёшь
  - stem: Вы с сестро́й ___ на да́че?
    hint: отдыха́ть
    accept:
    - отдыха́ете
  - stem: Мы с тобо́й ___ по-ру́сски.
    hint: говори́ть
    accept:
    - говори́м
  - stem: Ми́ша с па́пой ___ в футбо́л.
    hint: игра́ть
    accept:
    - игра́ет
  - stem: Мы с Ю́ми ___ ко́фе.
    hint: пить
    accept:
    - пьём
  - stem: Они́ с де́душкой ___ в ша́хматы.
    hint: игра́ть
    accept:
    - игра́ют
  - stem: Вы с ней ___ ру́сский язы́к?
    hint: учи́ть
    accept:
    - у́чите
  - stem: А́нна с подру́гой ___ в па́рке.
    hint: гуля́ть
    accept:
    - гуля́ет
  why: |
    第 1–4、6、8、9、11–13 题：[мы с …, вы с …, они́ с …]{.ru} 一共两个人，谓语用复数，人称跟着 [мы, вы, они́]{.ru} 走：[идём, живём, смо́трите, гото́вят]{.ru}。
    第 5、7、10、14 题：主语是 [я, ты]{.ru} 或一个名词时，[с …]{.ru} 只是补充“和谁一起”，谓语跟主语一致：[Я с бра́том живу́]{.ru}，[Ты с Ка́тей идёшь]{.ru}，[Ми́ша с па́пой игра́ет]{.ru}。
    第 3 题：[смотре́ть]{.ru} 第二变位，[вы смо́трите]{.ru}，重音前移。第 4 题：[гото́вить]{.ru} 第二变位，[они́ гото́вят]{.ru}。
