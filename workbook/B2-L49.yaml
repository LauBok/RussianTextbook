heading: 第 49 课　时间从句
groups:
- id: B2-L49-01
  tags:
  - 时间连接词：意义
  task: 后半句说的事和前面的事是什么时间关系？按该用的连接词归栏。
  type: classify
  bins:
  - '[пока́]{.ru}'
  - '[пока́ не]{.ru}'
  - '[по́сле того́ как]{.ru}'
  - '[пе́ред тем как]{.ru}'
  items:
  - text: '[Ми́ша игра́л]{.ru}——在妈妈上班的那段时间里'
    answer: '[пока́]{.ru}'
  - text: '[Я пригото́влю у́жин]{.ru}——趁你洗澡的工夫'
    answer: '[пока́]{.ru}'
  - text: '[Ба́бушка спала́]{.ru}——我们看电影的时候'
    answer: '[пока́]{.ru}'
  - text: '[Мы говори́ли ти́хо]{.ru}——孩子睡觉期间'
    answer: '[пока́]{.ru}'
  - text: '[Мы ждём]{.ru}——一直等到爸爸回来'
    answer: '[пока́ не]{.ru}'
  - text: '[Ди́ма игра́л в футбо́л]{.ru}——一直踢到天黑'
    answer: '[пока́ не]{.ru}'
  - text: '[Не уходи́]{.ru}——在我回来之前'
    answer: '[пока́ не]{.ru}'
  - text: '[Я бу́ду чита́ть]{.ru}——直到看完这本书'
    answer: '[пока́ не]{.ru}'
  - text: '[Мы пое́хали в кафе́]{.ru}——看完电影以后'
    answer: '[по́сле того́ как]{.ru}'
  - text: '[Ван Лэй позвони́л ма́ме]{.ru}——考完试之后'
    answer: '[по́сле того́ как]{.ru}'
  - text: '[Мы пошли́ гуля́ть]{.ru}——雨停了以后'
    answer: '[по́сле того́ как]{.ru}'
  - text: '[Ми́ша сел за уро́ки]{.ru}——吃完晚饭以后'
    answer: '[по́сле того́ как]{.ru}'
  - text: '[Вы́ключи свет]{.ru}——出门之前'
    answer: '[пе́ред тем как]{.ru}'
  - text: '[Па́па поговори́л с Ми́шей]{.ru}——出差走之前'
    answer: '[пе́ред тем как]{.ru}'
  - text: '[Вы́мой ру́ки]{.ru}——吃饭之前'
    answer: '[пе́ред тем как]{.ru}'
  - text: '[Ю́ми позвони́ла]{.ru}——来之前'
    answer: '[пе́ред тем как]{.ru}'
  why: |-
    第 1–4 题：两件事同时进行，在那段时间里：[пока́]{.ru}，从句多用未完成体：[пока́ ма́ма была́ на рабо́те]{.ru}。
    第 5–8 题：一直持续到另一件事发生，或在它发生之前做完：[пока́ не]{.ru}，从句用完成体：[пока́ па́па не вернётся]{.ru}。第 7 题“在我回来之前别走”也是 [пока́ я не верну́сь]{.ru}，其中的 [не]{.ru} 没有否定意义。
    第 9–12 题：从句的事先发生：[по́сле того́ как]{.ru}，多用完成体：[по́сле того́ как мы посмотре́ли фильм]{.ru}。
    第 13–16 题：从句的事后发生：[пе́ред тем как]{.ru}；主语相同时用不定式：[пе́ред тем как вы́йти]{.ru}。
    易混：第 7 题和第 13–16 题都可以译成“之前”，但 [пока́ не]{.ru} 强调“在那件事发生以前一直……/抢在它以前”，[пе́ред тем как]{.ru} 只说先后、往往紧挨着。
- id: B2-L49-02
  tags:
  - пока / пока не：体
  task: 在两种从句里写出括号中动词的适当形式。
  type: matrix
  cols:
  - 句子（体对）
  - '[пока́]{.ru} 从句'
  - '[пока́ не]{.ru} 从句'
  given:
  - 0
  rows:
  - base: '[Я подожду́, пока́ ты … (чита́ть / прочита́ть).]{.ru}'
    cells:
    - '[Я подожду́, пока́ ты … (чита́ть / прочита́ть).]{.ru}'
    - '[чита́ешь]{.ru}'
    - '[не прочита́ешь]{.ru}'
  - base: '[Мы погуля́ем, пока́ ма́ма … обе́д (гото́вить / пригото́вить).]{.ru}'
    cells:
    - '[Мы погуля́ем, пока́ ма́ма … обе́д (гото́вить / пригото́вить).]{.ru}'
    - '[гото́вит]{.ru}'
    - '[не пригото́вит]{.ru}'
  - base: '[Сиди́ здесь, пока́ я … письмо́ (писа́ть / написа́ть).]{.ru}'
    cells:
    - '[Сиди́ здесь, пока́ я … письмо́ (писа́ть / написа́ть).]{.ru}'
    - '[пишу́]{.ru}'
    - '[не напишу́]{.ru}'
  - base: '[Ми́ша ждал, пока́ Ди́ма … зада́чу (реша́ть / реши́ть).]{.ru}'
    cells:
    - '[Ми́ша ждал, пока́ Ди́ма … зада́чу (реша́ть / реши́ть).]{.ru}'
    - '[реша́л]{.ru}'
    - '[не реши́л]{.ru}'
  - base: '[Я посижу́ здесь, пока́ вы … (обе́дать / пообе́дать).]{.ru}'
    cells:
    - '[Я посижу́ здесь, пока́ вы … (обе́дать / пообе́дать).]{.ru}'
    - '[обе́даете]{.ru}'
    - '[не пообе́даете]{.ru}'
  - base: '[Па́па ждал, пока́ Ми́ша … посу́ду (мыть / вы́мыть).]{.ru}'
    cells:
    - '[Па́па ждал, пока́ Ми́ша … посу́ду (мыть / вы́мыть).]{.ru}'
    - '[мыл]{.ru}'
    - '[не вы́мыл]{.ru}'
  - base: '[Подожди́ меня́, пока́ я … (одева́ться / оде́ться).]{.ru}'
    cells:
    - '[Подожди́ меня́, пока́ я … (одева́ться / оде́ться).]{.ru}'
    - '[одева́юсь]{.ru}'
    - '[не оде́нусь]{.ru}'
  - base: '[Ю́ми слу́шала му́зыку, пока́ Пьер … её портре́т (рисова́ть / нарисова́ть).]{.ru}'
    cells:
    - '[Ю́ми слу́шала му́зыку, пока́ Пьер … её портре́т (рисова́ть / нарисова́ть).]{.ru}'
    - '[рисова́л]{.ru}'
    - '[не нарисова́л]{.ru}'
  - base: '[Ди́ма игра́л на гита́ре, пока́ мы … (у́жинать / поу́жинать).]{.ru}'
    cells:
    - '[Ди́ма игра́л на гита́ре, пока́ мы … (у́жинать / поу́жинать).]{.ru}'
    - '[у́жинали]{.ru}'
    - '[не поу́жинали]{.ru}'
  - base: '[Не выключа́й свет, пока́ я … ко́мнату (убира́ть / убра́ть).]{.ru}'
    cells:
    - '[Не выключа́й свет, пока́ я … ко́мнату (убира́ть / убра́ть).]{.ru}'
    - '[убира́ю]{.ru}'
    - '[не уберу́]{.ru}'
  why: |-
    [пока́]{.ru} 说同时进行，用未完成体：主句说将来或命令时，从句用现在时（[пока́ ты чита́ешь]{.ru}），说过去用过去时（[пока́ Ди́ма реша́л]{.ru}）。
    [пока́ не]{.ru} 说“直到……为止”，用完成体：说将来用完成体将来时（[пока́ ты не прочита́ешь]{.ru}），说过去用过去时（[пока́ Ди́ма не реши́л]{.ru}）。
    第 1、2、3、5、7、10 题：主句是将来或命令，[пока́ не]{.ru} 后用完成体将来时：[не пригото́вит, не напишу́, не оде́нусь, не уберу́]{.ru}。第 7 题 [оде́ться — оде́нусь]{.ru}，第 10 题 [убра́ть — уберу́]{.ru} 要记准。
    第 4、6、8、9 题：主句是过去时，两栏都用过去时：[реша́л / не реши́л, мыл / не вы́мыл]{.ru}。
    常见错误：[пока́ не]{.ru} 后面用将来时的未完成体（[пока́ ты не бу́дешь чита́ть]{.ru}），或把 [не]{.ru} 当成否定。
- id: B2-L49-03
  tags:
  - перед тем как：不定式还是变位动词
  task: 空里该用不定式还是变位动词？归入相应的栏。
  type: classify
  bins:
  - 不定式
  - 变位动词
  items:
  - text: '[Пе́ред тем как … (уйти́), Ди́ма вы́ключил свет.]{.ru}'
    answer: 不定式
  - text: '[Пе́ред тем как па́па … (прийти́), мы убра́ли ко́мнату.]{.ru}'
    answer: 变位动词
  - text: '[Пе́ред тем как … (лечь) спать, я чи́щу зу́бы.]{.ru}'
    answer: 不定式
  - text: '[Вы́мой ру́ки пе́ред тем, как … (сесть) за стол.]{.ru}'
    answer: 不定式
  - text: '[Пе́ред тем как го́сти … (уйти́), ба́бушка дала́ им пиро́г.]{.ru}'
    answer: 变位动词
  - text: '[Ю́ми позвони́ла пе́ред тем, как … (прийти́).]{.ru}'
    answer: 不定式
  - text: '[Пе́ред тем как самолёт … (улете́ть), мы попроща́лись с Ю́ми.]{.ru}'
    answer: 变位动词
  - text: '[Пе́ред тем как … (отве́тить), поду́май.]{.ru}'
    answer: 不定式
  - text: '[Пе́ред тем как Ми́ша … (верну́ться) домо́й, ма́ма пригото́вила у́жин.]{.ru}'
    answer: 变位动词
  - text: '[Мы купи́ли цветы́ пе́ред тем, как … (пое́хать) к ба́бушке.]{.ru}'
    answer: 不定式
  - text: '[Пе́ред тем как уро́к … (нача́ться), учи́тель откры́л окно́.]{.ru}'
    answer: 变位动词
  - text: '[Пе́ред тем как … (пойти́) в теа́тр, А́нна до́лго выбира́ла пла́тье.]{.ru}'
    answer: 不定式
  why: |-
    第 1、3、4、6、8、10、12 题：主句和从句是同一个人做的（第 4、8 题是命令对方），从句用不定式：[Пе́ред тем как уйти́, Ди́ма вы́ключил свет]{.ru}。
    第 2、5、7、9、11 题：从句另有主语（[па́па, го́сти, самолёт, Ми́ша, уро́к]{.ru}），用变位动词：[пе́ред тем как па́па пришёл]{.ru}。
- id: B2-L49-04
  tags:
  - 时间从句（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: По́сле того́ как мы ___ фильм, мы пошли́ в кафе́.
    hint: посмотре́ть
    accept:
    - посмотре́ли
  - stem: Пока́ ма́ма ___ обе́д, де́ти игра́ли во дворе́.
    hint: гото́вить
    accept:
    - гото́вила
  - stem: Не уходи́, пока́ я не ___ .
    hint: верну́ться
    accept:
    - верну́сь
  - stem: Пе́ред тем как ___ из до́ма, вы́ключи свет.
    hint: вы́йти
    accept:
    - вы́йти
  - stem: Мы гуля́ли, пока́ не ___ темно́.
    hint: стать
    accept:
    - ста́ло
  - stem: По́сле того́ как Ван Лэй ___ экза́мен, он позвони́л ма́ме.
    hint: сдать
    accept:
    - сдал
  - stem: Пока́ ты ___ , я пригото́влю чай.
    hint: мы́ться
    accept:
    - мо́ешься
  - stem: Я бу́ду повторя́ть слова́, пока́ не ___ их наизу́сть.
    hint: вы́учить
    accept:
    - вы́учу
  - stem: Пе́ред тем как Пьер ___ в Пари́ж, мы подари́ли ему́ кни́гу.
    hint: уе́хать
    accept:
    - уе́хал
  - stem: Пока́ па́па ___ в командиро́вке, Ми́ша разби́л стекло́.
    hint: быть
    accept:
    - был
  - stem: Пе́ред тем как ___ спать, Ми́ша почи́стил зу́бы.
    hint: лечь
    accept:
    - лечь
  - stem: Пока́ мы ___ , пошёл снег.
    hint: гуля́ть
    accept:
    - гуля́ли
  - stem: Подожди́ здесь, пока́ я не ___ биле́ты.
    hint: купи́ть
    accept:
    - куплю́
  - stem: По́сле того́ как дождь ___ , мы пошли́ в парк.
    hint: ко́нчиться
    accept:
    - ко́нчился
  why: |-
    第 1、6 题：[по́сле того́ как]{.ru} 从句先发生，用完成体：[посмотре́ли, сдал]{.ru}。
    第 2、7、10 题：[пока́]{.ru} 同时进行，用未完成体：[гото́вила, мо́ешься, был]{.ru}；第 7 题主句是将来，从句用现在时。
    第 3、8 题：[пока́ не]{.ru} 说将来，用完成体将来时：[верну́сь, вы́учу]{.ru}。
    第 5 题：说过去，用过去时：[пока́ не ста́ло темно́]{.ru}（无人称，中性）。
    第 4 题：[пе́ред тем как]{.ru} 主语相同，用不定式；第 9 题主语不同，用变位动词 [уе́хал]{.ru}。
    第 11 题：主语相同，[пе́ред тем как]{.ru} + 不定式。第 12 题：[пока́]{.ru} + 未完成体过去时：[гуля́ли]{.ru}。
    第 13 题：[пока́ не]{.ru} 说将来，完成体将来时：[куплю́]{.ru}。第 14 题：[по́сле того́ как]{.ru} + 完成体：[ко́нчился]{.ru}。
