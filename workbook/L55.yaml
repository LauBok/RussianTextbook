heading: 第 55 课　“需要”的表达
groups:
- id: L55-01
  tags: [短尾形容词“需要”：性数与时间]
  task: 写出“需要”的现在时、过去时和将来时（所需的东西是左栏的词）。
  type: matrix
  cols: [所需的东西, 现在, 过去, 将来]
  given: [0]
  rows:
  - {base: '[шарф]{.ru}', cells: ['[шарф]{.ru}', '[ну́жен]{.ru}', '[был ну́жен]{.ru}', '[бу́дет ну́жен]{.ru}']}
  - {base: '[ша́пка]{.ru}', cells: ['[ша́пка]{.ru}', '[нужна́]{.ru}', '[была́ нужна́]{.ru}', '[бу́дет нужна́]{.ru}']}
  - {base: '[пальто́]{.ru}', cells: ['[пальто́]{.ru}', '[ну́жно]{.ru}', '[бы́ло ну́жно]{.ru}', '[бу́дет ну́жно]{.ru}']}
  - {base: '[перча́тки]{.ru}', cells: ['[перча́тки]{.ru}', '[нужны́]{.ru}', '[бы́ли нужны́]{.ru}', '[бу́дут нужны́]{.ru}']}
  - {base: '[сапоги́]{.ru}', cells: ['[сапоги́]{.ru}', '[нужны́]{.ru}', '[бы́ли нужны́]{.ru}', '[бу́дут нужны́]{.ru}']}
  - {base: '[де́ньги]{.ru}', cells: ['[де́ньги]{.ru}', '[нужны́]{.ru}', '[бы́ли нужны́]{.ru}', '[бу́дут нужны́]{.ru}']}
  - {base: '[ку́ртка]{.ru}', cells: ['[ку́ртка]{.ru}', '[нужна́]{.ru}', '[была́ нужна́]{.ru}', '[бу́дет нужна́]{.ru}']}
  - {base: '[слова́рь]{.ru}', cells: ['[слова́рь]{.ru}', '[ну́жен]{.ru}', '[был ну́жен]{.ru}', '[бу́дет ну́жен]{.ru}']}
  - {base: '[тетра́дь]{.ru}', cells: ['[тетра́дь]{.ru}', '[нужна́]{.ru}', '[была́ нужна́]{.ru}', '[бу́дет нужна́]{.ru}']}
  - {base: '[ко́фе]{.ru}', cells: ['[ко́фе]{.ru}', '[ну́жен]{.ru}', '[был ну́жен]{.ru}', '[бу́дет ну́жен]{.ru}']}
  - {base: '[кре́сло]{.ru}', cells: ['[кре́сло]{.ru}', '[ну́жно]{.ru}', '[бы́ло ну́жно]{.ru}', '[бу́дет ну́жно]{.ru}']}
  - {base: '[лека́рство]{.ru}', new: true, gloss: 药, cells: ['[лека́рство]{.ru}', '[ну́жно]{.ru}', '[бы́ло ну́жно]{.ru}', '[бу́дет ну́жно]{.ru}']}
  - {base: '[биле́т]{.ru}', cells: ['[биле́т]{.ru}', '[ну́жен]{.ru}', '[был ну́жен]{.ru}', '[бу́дет ну́жен]{.ru}']}
  - {base: '[кварти́ра]{.ru}', cells: ['[кварти́ра]{.ru}', '[нужна́]{.ru}', '[была́ нужна́]{.ru}', '[бу́дет нужна́]{.ru}']}
  - {base: '[ключи́]{.ru}', cells: ['[ключи́]{.ru}', '[нужны́]{.ru}', '[бы́ли нужны́]{.ru}', '[бу́дут нужны́]{.ru}']}
  - {base: '[ви́део]{.ru}', cells: ['[ви́део]{.ru}', '[ну́жно]{.ru}', '[бы́ло ну́жно]{.ru}', '[бу́дет ну́жно]{.ru}']}
  why: |
    第 1–16 题：[ну́жен]{.ru} 和所需的东西（第一格主语）在性、数上一致：阳性 [ну́жен]{.ru}，阴性 [нужна́]{.ru}，中性 [ну́жно]{.ru}，复数 [нужны́]{.ru}；阳性重音在词干，其余在词尾。
    过去时和将来时的 [быть]{.ru} 也跟主语变：[был ну́жен, была́ нужна́, бы́ло ну́жно, бы́ли нужны́]{.ru}；将来时单数 [бу́дет]{.ru}，复数 [бу́дут]{.ru}。
    第 3、10、16 题：不变格名词的性要记：[пальто́, ви́део]{.ru} 是中性，[ко́фе]{.ru} 是阳性。第 8、9 题：[слова́рь]{.ru} 阳性，[тетра́дь]{.ru} 阴性。第 6 题 [де́ньги]{.ru} 只有复数。
- id: L55-02
  tags: [“需要”：名词结构与不定式结构]
  task: 判断句子的结构，填写序号。
  type: classify
  bins: ['[ну́жен / нужна́ / нужны́]{.ru} + 名词', '[ну́жно]{.ru} + 中性名词', '[ну́жно]{.ru} + 不定式']
  items:
  - {text: '[Мне ну́жно пальто́.]{.ru}', answer: '[ну́жно]{.ru} + 中性名词'}
  - {text: '[Мне ну́жно купи́ть пальто́.]{.ru}', answer: '[ну́жно]{.ru} + 不定式'}
  - {text: '[Мне ну́жен шарф.]{.ru}', answer: '[ну́жен / нужна́ / нужны́]{.ru} + 名词'}
  - {text: '[А́нне нужны́ сапоги́.]{.ru}', answer: '[ну́жен / нужна́ / нужны́]{.ru} + 名词'}
  - {text: '[Ми́ше ну́жно сде́лать уро́ки.]{.ru}', answer: '[ну́жно]{.ru} + 不定式'}
  - {text: '[Что тебе́ ну́жно?]{.ru}', answer: '[ну́жно]{.ru} + 中性名词'}
  - {text: '[Па́пе ну́жно кре́сло.]{.ru}', answer: '[ну́жно]{.ru} + 中性名词'}
  - {text: '[Нам ну́жно идти́.]{.ru}', answer: '[ну́жно]{.ru} + 不定式'}
  - {text: '[Ему́ нужна́ ша́пка.]{.ru}', answer: '[ну́жен / нужна́ / нужны́]{.ru} + 名词'}
  - {text: '[Ей ну́жно ви́део.]{.ru}', answer: '[ну́жно]{.ru} + 中性名词'}
  - {text: '[Вам ну́жно отдыха́ть.]{.ru}', answer: '[ну́жно]{.ru} + 不定式'}
  - {text: '[Мне ну́жно но́вое пальто́.]{.ru}', answer: '[ну́жно]{.ru} + 中性名词'}
  - {text: '[Ему́ ну́жно взять де́ньги.]{.ru}', answer: '[ну́жно]{.ru} + 不定式'}
  - {text: '[Им нужны́ де́ньги.]{.ru}', answer: '[ну́жен / нужна́ / нужны́]{.ru} + 名词'}
  - {text: '[Ба́бушке ну́жно лека́рство.]{.ru}', answer: '[ну́жно]{.ru} + 中性名词', new: true, gloss: 药}
  - {text: '[Тебе́ ну́жно купи́ть шарф.]{.ru}', answer: '[ну́жно]{.ru} + 不定式'}
  - {text: '[Ей нужны́ перча́тки.]{.ru}', answer: '[ну́жен / нужна́ / нужны́]{.ru} + 名词'}
  - {text: '[Мне ну́жен слова́рь.]{.ru}', answer: '[ну́жен / нужна́ / нужны́]{.ru} + 名词'}
  why: |
    第 3、4、9、14、17、18 题：所需的是阳性、阴性名词或复数名词，[ну́жен]{.ru} 跟它的性数变：[ну́жен шарф, нужна́ ша́пка, нужны́ сапоги́]{.ru}。
    第 1、6、7、10、12、15 题：[ну́жно]{.ru} 后面是中性名词（[пальто́, кре́сло, ви́део, лека́рство]{.ru}），这时它是 [ну́жен]{.ru} 的中性形式；第 6 题 [что]{.ru} 当中性看待。
    第 2、5、8、11、13、16 题：[ну́жно]{.ru} 后面是不定式，是第 54 课学的无人称谓语。第 2 题 [пальто́]{.ru} 是 [купи́ть]{.ru} 的宾语，不是主语；第 13 题 [де́ньги]{.ru} 也是宾语，所以不用 [нужны́]{.ru}。
- id: L55-03
  tags: [“需要”：性数配合核查]
  task: 每句都有一处错误，写出正确的句子。
  type: matrix
  cols: [有错误的句子, 正确的句子]
  given: [0]
  rows:
  - {base: '[А́нне нужна́ сапоги́.]{.ru}', cells: ['[А́нне нужна́ сапоги́.]{.ru}', '[А́нне нужны́ сапоги́.]{.ru}']}
  - {base: '[Я ну́жен шарф.]{.ru}', cells: ['[Я ну́жен шарф.]{.ru}', '[Мне ну́жен шарф.]{.ru}']}
  - {base: '[Мне ну́жен ша́пка.]{.ru}', cells: ['[Мне ну́жен ша́пка.]{.ru}', '[Мне нужна́ ша́пка.]{.ru}']}
  - {base: '[Ему́ нужна́ пальто́.]{.ru}', cells: ['[Ему́ нужна́ пальто́.]{.ru}', '[Ему́ ну́жно пальто́.]{.ru}']}
  - {base: '[Мне была́ ну́жен шарф.]{.ru}', cells: ['[Мне была́ ну́жен шарф.]{.ru}', '[Мне был ну́жен шарф.]{.ru}']}
  - {base: '[Нам бу́дет нужны́ перча́тки.]{.ru}', cells: ['[Нам бу́дет нужны́ перча́тки.]{.ru}', '[Нам бу́дут нужны́ перча́тки.]{.ru}']}
  - {base: '[Что тебе́ ну́жен?]{.ru}', cells: ['[Что тебе́ ну́жен?]{.ru}', '[Что тебе́ ну́жно?]{.ru}']}
  - {base: '[Ша́пка ему́ не ну́жен.]{.ru}', cells: ['[Ша́пка ему́ не ну́жен.]{.ru}', '[Ша́пка ему́ не нужна́.]{.ru}']}
  - {base: '[Ми́ше бы́ло нужна́ ку́ртка.]{.ru}', cells: ['[Ми́ше бы́ло нужна́ ку́ртка.]{.ru}', '[Ми́ше была́ нужна́ ку́ртка.]{.ru}']}
  - {base: '[Ей нужна́ слова́рь.]{.ru}', cells: ['[Ей нужна́ слова́рь.]{.ru}', '[Ей ну́жен слова́рь.]{.ru}']}
  - {base: '[Тебе́ нужны́ купи́ть хлеб.]{.ru}', cells: ['[Тебе́ нужны́ купи́ть хлеб.]{.ru}', '[Тебе́ ну́жно купи́ть хлеб.]{.ru}']}
  - {base: '[Мне ну́жно бы́ли де́ньги.]{.ru}', cells: ['[Мне ну́жно бы́ли де́ньги.]{.ru}', '[Мне бы́ли нужны́ де́ньги.]{.ru}']}
  why: |
    第 1、3、4、8、10 题：[ну́жен]{.ru} 不跟人变，跟所需的东西变：[сапоги́]{.ru} 复数用 [нужны́]{.ru}，[ша́пка]{.ru} 阴性用 [нужна́]{.ru}，[пальто́]{.ru} 中性用 [ну́жно]{.ru}，[слова́рь]{.ru} 阳性用 [ну́жен]{.ru}。
    第 2 题：需要的人用第三格 [мне]{.ru}；[Я ну́жен]{.ru} 的意思是“我被（别人）需要”。
    第 5、6、9、12 题：过去时、将来时的 [быть]{.ru} 也跟所需的东西变：[был ну́жен шарф, бу́дут нужны́ перча́тки, была́ нужна́ ку́ртка, бы́ли нужны́ де́ньги]{.ru}。
    第 7 题：问“需要什么”，[что]{.ru} 当中性：[Что тебе́ ну́жно?]{.ru}
    第 11 题：后面是不定式，用无人称的 [ну́жно]{.ru}，不随宾语变。
- id: L55-04
  tags: [“需要”：过去、将来与否定]
  task: 用括号里的词填空。
  type: fill
  items:
  - {stem: 'Вчера́ А́нне ___ ша́пка.', hint: 'быть, ну́жен', accept: [была́ нужна́]}
  - {stem: 'За́втра нам ___ де́ньги.', hint: 'быть, ну́жен', accept: [бу́дут нужны́]}
  - {stem: 'Ско́ро тебе́ ___ тёплое пальто́.', hint: 'быть, ну́жен', accept: [бу́дет ну́жно]}
  - {stem: 'Ра́ньше мне ___ слова́рь.', hint: 'быть, ну́жен', accept: [был ну́жен]}
  - {stem: 'Ско́ро Ми́ше ___ но́вые сапоги́.', hint: 'быть, ну́жен', accept: [бу́дут нужны́]}
  - {stem: 'Ша́пка мне не ___.', hint: ну́жен, accept: [нужна́]}
  - {stem: 'Спаси́бо, мне э́то не ___.', hint: ну́жен, accept: [ну́жно]}
  - {stem: 'Вчера́ нам ___ биле́ты.', hint: 'быть, ну́жен', accept: [бы́ли нужны́]}
  - {stem: 'За́втра па́пе ___ маши́на.', hint: 'быть, ну́жен', accept: [бу́дет нужна́]}
  - {stem: 'Вчера́ ба́бушке ___ лека́рство.', hint: 'быть, ну́жен', accept: [бы́ло ну́жно]}
  - {stem: 'Перча́тки ей не ___.', hint: ну́жен, accept: [нужны́]}
  - {stem: 'Ра́ньше ему́ ___ купи́ть ку́ртку.', hint: 'ну́жно, быть', accept: [ну́жно бы́ло, бы́ло ну́жно]}
  - {stem: 'Ва́ше пальто́ вам не ___?', hint: ну́жен, accept: [ну́жно]}
  - {stem: 'За́втра мне ___ ко́фе.', hint: 'быть, ну́жен', accept: [бу́дет ну́жен]}
  why: |
    第 1、4、8、10 题：过去时 [быть]{.ru} 和 [ну́жен]{.ru} 都跟所需的东西变：[была́ нужна́ ша́пка, был ну́жен слова́рь, бы́ли нужны́ биле́ты, бы́ло ну́жно лека́рство]{.ru}。
    第 2、3、5、9、14 题：将来时单数主语用 [бу́дет]{.ru}，复数主语用 [бу́дут]{.ru}：[бу́дут нужны́ де́ньги, бу́дет ну́жно пальто́, бу́дет нужна́ маши́на, бу́дет ну́жен ко́фе]{.ru}。
    第 6、7、11、13 题：否定时 [не]{.ru} 放在 [ну́жен]{.ru} 前面，形式仍跟主语：[не нужна́, не ну́жно, не нужны́]{.ru}；第 7 题 [э́то]{.ru} 当中性。
    第 12 题：后面是不定式，过去时永远是 [ну́жно бы́ло]{.ru}，[бы́ло ну́жно]{.ru} 也可以。
- id: L55-05
  tags: [“需要”：人用第三格与物的性数]
  task: 用给出的词说“某人需要某物”（现在时）。
  type: matrix
  cols: [人和东西, 句子]
  given: [0]
  rows:
  - {base: '[я, шарф]{.ru}', cells: ['[я, шарф]{.ru}', '[Мне ну́жен шарф.]{.ru}']}
  - {base: '[А́нна, сапоги́]{.ru}', cells: ['[А́нна, сапоги́]{.ru}', '[А́нне нужны́ сапоги́.]{.ru}']}
  - {base: '[он, ша́пка]{.ru}', cells: ['[он, ша́пка]{.ru}', '[Ему́ нужна́ ша́пка.]{.ru}']}
  - {base: '[мы, пальто́]{.ru}', cells: ['[мы, пальто́]{.ru}', '[Нам ну́жно пальто́.]{.ru}']}
  - {base: '[Ми́ша, мяч]{.ru}', new: true, gloss: 球, cells: ['[Ми́ша, мяч]{.ru}', '[Ми́ше ну́жен мяч.]{.ru}']}
  - {base: '[она́, перча́тки]{.ru}', cells: ['[она́, перча́тки]{.ru}', '[Ей нужны́ перча́тки.]{.ru}']}
  - {base: '[ты, слова́рь]{.ru}', cells: ['[ты, слова́рь]{.ru}', '[Тебе́ ну́жен слова́рь.]{.ru}']}
  - {base: '[па́па, маши́на]{.ru}', cells: ['[па́па, маши́на]{.ru}', '[Па́пе нужна́ маши́на.]{.ru}']}
  - {base: '[вы, де́ньги]{.ru}', cells: ['[вы, де́ньги]{.ru}', '[Вам нужны́ де́ньги.]{.ru}']}
  - {base: '[брат, ку́ртка]{.ru}', cells: ['[брат, ку́ртка]{.ru}', '[Бра́ту нужна́ ку́ртка.]{.ru}']}
  - {base: '[они́, кварти́ра]{.ru}', cells: ['[они́, кварти́ра]{.ru}', '[Им нужна́ кварти́ра.]{.ru}']}
  - {base: '[ба́бушка, кре́сло]{.ru}', cells: ['[ба́бушка, кре́сло]{.ru}', '[Ба́бушке ну́жно кре́сло.]{.ru}']}
  - {base: '[Мари́я Никола́евна, ко́фе]{.ru}', cells: ['[Мари́я Никола́евна, ко́фе]{.ru}', '[Мари́и Никола́евне ну́жен ко́фе.]{.ru}']}
  - {base: '[учи́тель, тетра́дь]{.ru}', cells: ['[учи́тель, тетра́дь]{.ru}', '[Учи́телю нужна́ тетра́дь.]{.ru}']}
  - {base: '[дочь, ключи́]{.ru}', cells: ['[дочь, ключи́]{.ru}', '[До́чери нужны́ ключи́.]{.ru}']}
  - {base: '[Пьер, биле́т]{.ru}', cells: ['[Пьер, биле́т]{.ru}', '[Пье́ру ну́жен биле́т.]{.ru}']}
  why: |
    第 1–16 题：要做两件事：需要的人变第三格（[мне, А́нне, ему́, нам, Ми́ше…]{.ru}），[ну́жен]{.ru} 按所需的东西选性数。人是男是女不影响 [ну́жен]{.ru}：第 3 题 [ему́]{.ru} 是男性，却用 [нужна́ ша́пка]{.ru}；第 6 题 [ей]{.ru} 是女性，却用 [нужны́ перча́тки]{.ru}。
    第 4、12 题：[пальто́, кре́сло]{.ru} 中性，用 [ну́жно]{.ru}；第 13 题 [ко́фе]{.ru} 阳性，用 [ну́жен]{.ru}；第 14 题 [тетра́дь]{.ru} 阴性，用 [нужна́]{.ru}。
    第 13、15 题：[Мари́я Никола́евна → Мари́и Никола́евне]{.ru}，[дочь → до́чери]{.ru}。
