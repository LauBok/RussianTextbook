heading: 第 73 课　完成体运动动词
groups:
- id: L73-01
  tags:
  - пойти / поехать：将来时变位
  - пойти / поехать：过去时
  task: 按主语写出 [пойти́]{.ru} 和 [пое́хать]{.ru} 的将来时和过去时。
  type: matrix
  cols:
  - 主语
  - '[пойти́]{.ru} 将来时'
  - '[пое́хать]{.ru} 将来时'
  - '[пойти́]{.ru} 过去时'
  - '[пое́хать]{.ru} 过去时'
  given:
  - 0
  rows:
  - base: '[я]{.ru}（[Ван Лэй]{.ru}）'
    cells:
    - '[я]{.ru}（[Ван Лэй]{.ru}）'
    - '[пойду́]{.ru}'
    - '[пое́ду]{.ru}'
    - '[пошёл]{.ru}'
    - '[пое́хал]{.ru}'
  - base: '[я]{.ru}（[А́нна]{.ru}）'
    cells:
    - '[я]{.ru}（[А́нна]{.ru}）'
    - '[пойду́]{.ru}'
    - '[пое́ду]{.ru}'
    - '[пошла́]{.ru}'
    - '[пое́хала]{.ru}'
  - base: '[ты]{.ru}（[Ми́ша]{.ru}）'
    cells:
    - '[ты]{.ru}（[Ми́ша]{.ru}）'
    - '[пойдёшь]{.ru}'
    - '[пое́дешь]{.ru}'
    - '[пошёл]{.ru}'
    - '[пое́хал]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[пойдёт]{.ru}'
    - '[пое́дет]{.ru}'
    - '[пошёл]{.ru}'
    - '[пое́хал]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[пойдёт]{.ru}'
    - '[пое́дет]{.ru}'
    - '[пошла́]{.ru}'
    - '[пое́хала]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[пойдём]{.ru}'
    - '[пое́дем]{.ru}'
    - '[пошли́]{.ru}'
    - '[пое́хали]{.ru}'
  - base: '[вы]{.ru}'
    cells:
    - '[вы]{.ru}'
    - '[пойдёте]{.ru}'
    - '[пое́дете]{.ru}'
    - '[пошли́]{.ru}'
    - '[пое́хали]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[пойду́т]{.ru}'
    - '[пое́дут]{.ru}'
    - '[пошли́]{.ru}'
    - '[пое́хали]{.ru}'
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[пойдёт]{.ru}'
    - '[пое́дет]{.ru}'
    - '[пошла́]{.ru}'
    - '[пое́хала]{.ru}'
  - base: '[Петро́вы]{.ru}'
    cells:
    - '[Петро́вы]{.ru}'
    - '[пойду́т]{.ru}'
    - '[пое́дут]{.ru}'
    - '[пошли́]{.ru}'
    - '[пое́хали]{.ru}'
  why: |
    第 1–10 题：[пойти́]{.ru} 按 [идти́]{.ru} 变位，[и]{.ru} 变成 [й]{.ru}：[пойду́, пойдёшь … пойду́т]{.ru}，不写 [поиду́]{.ru}；过去时以 [шёл]{.ru} 为基础：[пошёл, пошла́, пошли́]{.ru}。
    第 1–10 题：[пое́хать]{.ru} 按 [е́хать]{.ru} 变位：[пое́ду, пое́дешь … пое́дут]{.ru}；过去时 [пое́хал, пое́хала, пое́хали]{.ru}，重音一直在 [-е́-]{.ru}。
    第 1–3 题：将来时只看人称，过去时看实际性别。第 7 题 [вы]{.ru} 过去时用复数。
    完成体的变位形式表示将来，不表示现在。
- id: L73-02
  tags:
  - пойти / поехать：出发与经常
  task: 句中的运动动词表示什么？按意思归类。
  type: classify
  bins:
  - 将来去一次（[пойду́]{.ru}）
  - 将来经常去、到处走（[бу́ду ходи́ть]{.ru}）
  - 已经动身去了（[пошёл]{.ru}）
  - 去过、已回来（[ходи́л]{.ru}）
  - 邀请一起去（[Пойдём!]{.ru}）
  items:
  - text: '[За́втра я пойду́ в бассе́йн.]{.ru}'
    answer: 将来去一次（[пойду́]{.ru}）
  - text: '[Зимо́й я бу́ду ходи́ть в бассе́йн ка́ждую суббо́ту.]{.ru}'
    answer: 将来经常去、到处走（[бу́ду ходи́ть]{.ru}）
  - text: '[— Где па́па? — Он пое́хал на рабо́ту.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[— Где ты был у́тром? — Я е́здил на рабо́ту.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Пое́дем вме́сте!]{.ru}'
    answer: 邀请一起去（[Пойдём!]{.ru}）
  - text: '[За́втра мы пое́дем в Петербу́рг.]{.ru}'
    answer: 将来去一次（[пойду́]{.ru}）
  - text: '[Ива́н Серге́евич пошёл спать.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[Пойдём в кафе́!]{.ru}'
    answer: 邀请一起去（[Пойдём!]{.ru}）
  - text: '[В Петербу́рге мы бу́дем ходи́ть по го́роду.]{.ru}'
    answer: 将来经常去、到处走（[бу́ду ходи́ть]{.ru}）
  - text: '[А́нны нет до́ма, она́ пошла́ в магази́н.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[Вчера́ Ми́ша ходи́л в кино́.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Пойдёмте в теа́тр!]{.ru}'
    answer: 邀请一起去（[Пойдём!]{.ru}）
  - text: '[Ле́том я бу́ду е́здить на да́чу ка́ждую неде́лю.]{.ru}'
    answer: 将来经常去、到处走（[бу́ду ходи́ть]{.ru}）
  - text: '[Ю́ми пое́хала в Япо́нию, сейча́с её нет в Москве́.]{.ru}'
    answer: 已经动身去了（[пошёл]{.ru}）
  - text: '[В суббо́ту мы е́здили на да́чу.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Ве́чером я пойду́ к врачу́.]{.ru}'
    answer: 将来去一次（[пойду́]{.ru}）
  - text: '[В про́шлом году́ Пьер е́здил во Фра́нцию.]{.ru}'
    answer: 去过、已回来（[ходи́л]{.ru}）
  - text: '[Пое́дем на метро́!]{.ru}'
    answer: 邀请一起去（[Пойдём!]{.ru}）
  - text: '[В пя́тницу мы пойдём в Эрмита́ж.]{.ru}'
    answer: 将来去一次（[пойду́]{.ru}）
  - text: '[Ка́ждый день я бу́ду ходи́ть в библиоте́ку.]{.ru}'
    answer: 将来经常去、到处走（[бу́ду ходи́ть]{.ru}）
  why: |
    第 1、6、16、19 题：[пойду́, пое́дем]{.ru} 等将来时形式说将来的一次出行。
    第 2、9、13、20 题：[бу́ду ходи́ть, бу́ду е́здить]{.ru} 说将来经常去，或在某处到处走（第 9 题）。
    第 3、7、10、14 题：[пошёл, пое́хал]{.ru} 说人已经动身去了，现在多半还不在这里（[па́па]{.ru} 在单位、[А́нны нет до́ма]{.ru}）。
    第 4、11、15、17 题：[ходи́л, е́здил]{.ru} 说去了一趟，已经回来，和 [пое́хал]{.ru} 意思正相反。
    第 5、8、12、18 题：[Пойдём! Пое́дем!]{.ru} 邀请对方一起去；对 [вы]{.ru} 说加 [-те]{.ru}：[Пойдёмте!]{.ru}
- id: L73-03
  tags:
  - пойти / поехать：步行与乘车
  - пойти / поехать：将来时变位
  - пойти / поехать：过去时
  task: 选用 [пойти́]{.ru} 或 [пое́хать]{.ru}，写出括号里要求的形式。
  type: fill
  items:
  - stem: За́втра мы ___ в Петербу́рг.
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пое́дем
  - stem: Ве́чером я ___ в кафе́ ря́дом с до́мом.
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пойду́
  - stem: — Где ма́ма? — Она́ ___ в магази́н ря́дом с до́мом.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пошла́
  - stem: Па́па ___ в Новосиби́рск.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пое́хал
  - stem: Ты ___ на да́чу на электри́чке?
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пое́дешь
  - stem: Студе́нты ___ на уро́к в аудито́рию два́дцать.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пошли́
  - stem: Ле́том Ю́ми ___ в Япо́нию.
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пое́дет
  - stem: Ми́ша ___ спать.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пошёл
  - stem: Сейча́с мы ___ на по́чту, она́ ря́дом.
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пойдём
  - stem: Петро́вы ___ на мо́ре.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пое́хали
  - stem: Я ___ к врачу́ пешко́м.
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пойду́
  - stem: А́нна и Ка́тя ___ в кино́ пешко́м.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пошли́
  - stem: — Где Ван Лэй? — Он ___ в университе́т на метро́.
    hint: '[пойти́ / пое́хать]{.ru}，过去时'
    accept:
    - пое́хал
  - stem: Вы ___ в центр на такси́?
    hint: '[пойти́ / пое́хать]{.ru}，将来时'
    accept:
    - пое́дете
  - stem: ___ в парк пешко́м!
    hint: '[пойти́ / пое́хать]{.ru}，邀请'
    accept:
    - Пойдём
  - stem: ___ на такси́!
    hint: '[пойти́ / пое́хать]{.ru}，邀请'
    accept:
    - Пое́дем
  why: |
    第 1、4、7、10 题：去别的城市、国家、海边，只能坐车，用 [пое́хать]{.ru}：[пое́дем, пое́хал, пое́дет, пое́хали]{.ru}。
    第 5、13、14、16 题：有 [на электри́чке, на метро́, на такси́]{.ru}，用 [пое́хать]{.ru}。
    第 2、3、9、11、12、15 题：近处、[пешко́м]{.ru}，步行，用 [пойти́]{.ru}：[пойду́, пошла́, пойдём]{.ru}。第 6、8 题在楼里去教室、去睡觉，也用 [пойти́]{.ru}。
    第 3、4、6、8、10、12、13 题：过去时表示已经动身去了：[пошла́, пое́хал, пошли́, пошёл]{.ru}。
    第 15、16 题：邀请一起去用 [мы]{.ru} 的形式：[Пойдём! Пое́дем!]{.ru}
