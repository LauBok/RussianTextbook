heading: 第 12 课　名词复数第五格
groups:
- id: B2-L12-01
  tags:
  - 名词复数第三、五、六格
  task: 写出复数第三、五、六格。
  type: matrix
  cols:
  - 复数第一格
  - 第三格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[грибы́]{.ru}'
    cells:
    - '[грибы́]{.ru}'
    - '[гриба́м]{.ru}'
    - '[гриба́ми]{.ru}'
    - '[о гриба́х]{.ru}'
  - base: '[я́блоки]{.ru}'
    cells:
    - '[я́блоки]{.ru}'
    - '[я́блокам]{.ru}'
    - '[я́блоками]{.ru}'
    - '[о я́блоках]{.ru}'
  - base: '[дома́]{.ru}'
    cells:
    - '[дома́]{.ru}'
    - '[дома́м]{.ru}'
    - '[дома́ми]{.ru}'
    - '[о дома́х]{.ru}'
  - base: '[кни́ги]{.ru}'
    cells:
    - '[кни́ги]{.ru}'
    - '[кни́гам]{.ru}'
    - '[кни́гами]{.ru}'
    - '[о кни́гах]{.ru}'
  - base: '[сёстры]{.ru}'
    cells:
    - '[сёстры]{.ru}'
    - '[сёстрам]{.ru}'
    - '[сёстрами]{.ru}'
    - '[о сёстрах]{.ru}'
  - base: '[ребя́та]{.ru}'
    cells:
    - '[ребя́та]{.ru}'
    - '[ребя́там]{.ru}'
    - '[ребя́тами]{.ru}'
    - '[о ребя́тах]{.ru}'
  - base: '[коньки́]{.ru}'
    cells:
    - '[коньки́]{.ru}'
    - '[конька́м]{.ru}'
    - '[конька́ми]{.ru}'
    - '[о конька́х]{.ru}'
  - base: '[фигури́сты]{.ru}'
    cells:
    - '[фигури́сты]{.ru}'
    - '[фигури́стам]{.ru}'
    - '[фигури́стами]{.ru}'
    - '[о фигури́стах]{.ru}'
  - base: '[дере́вья]{.ru}'
    cells:
    - '[дере́вья]{.ru}'
    - '[дере́вьям]{.ru}'
    - '[дере́вьями]{.ru}'
    - '[о дере́вьях]{.ru}'
  - base: '[друзья́]{.ru}'
    cells:
    - '[друзья́]{.ru}'
    - '[друзья́м]{.ru}'
    - '[друзья́ми]{.ru}'
    - '[о друзья́х]{.ru}'
  - base: '[словари́]{.ru}'
    cells:
    - '[словари́]{.ru}'
    - '[словаря́м]{.ru}'
    - '[словаря́ми]{.ru}'
    - '[о словаря́х]{.ru}'
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[роди́телям]{.ru}'
    - '[роди́телями]{.ru}'
    - '[о роди́телях]{.ru}'
  - base: '[неде́ли]{.ru}'
    cells:
    - '[неде́ли]{.ru}'
    - '[неде́лям]{.ru}'
    - '[неде́лями]{.ru}'
    - '[о неде́лях]{.ru}'
  - base: '[упражне́ния]{.ru}'
    cells:
    - '[упражне́ния]{.ru}'
    - '[упражне́ниям]{.ru}'
    - '[упражне́ниями]{.ru}'
    - '[об упражне́ниях]{.ru}'
  why: |-
    第 2、4–6、8 题：硬变化 [-ам / -ами / -ах]{.ru}，重音同复数第一格：[я́блокам, я́блоками, о я́блоках]{.ru}；[ребя́та → ребя́тами]{.ru}。
    第 1、3、7 题：复数重音在词尾，三个格都在词尾：[гриба́ми, дома́ми, конька́ми]{.ru}。
    第 9、10、12、13 题：软变化 [-ям / -ями / -ях]{.ru}，特殊词干保留：[дере́вьями, друзья́ми, роди́телями]{.ru}。
    第 11 题：[словари́]{.ru} 软变化、重音在词尾：[словаря́м, словаря́ми, о словаря́х]{.ru}。
    第 14 题：[-ия]{.ru} 复数第一格 [-ия]{.ru} 是软变化：[упражне́ниями]{.ru}；元音前用 [об]{.ru}。
- id: B2-L12-02
  tags:
  - 前置词 + 复数第五格：词组
  task: 写出词组（名词用复数）。
  type: matrix
  cols:
  - 前置词 + 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[ме́жду + дом]{.ru}'
    cells:
    - '[ме́жду + дом]{.ru}'
    - '[ме́жду дома́ми]{.ru}'
    hint: pl. [дома́]{.ru}
  - base: '[под + де́рево]{.ru}'
    cells:
    - '[под + де́рево]{.ru}'
    - '[под дере́вьями]{.ru}'
    hint: pl. [дере́вья]{.ru}
  - base: '[пе́ред + экза́мен]{.ru}'
    cells:
    - '[пе́ред + экза́мен]{.ru}'
    - '[пе́ред экза́менами]{.ru}'
  - base: '[с + блин]{.ru}'
    cells:
    - '[с + блин]{.ru}'
    - '[с блина́ми]{.ru}'
  - base: '[с + гриб]{.ru}'
    cells:
    - '[с + гриб]{.ru}'
    - '[с гриба́ми]{.ru}'
  - base: '[за + гора́]{.ru}'
    cells:
    - '[за + гора́]{.ru}'
    - '[за гора́ми]{.ru}'
    hint: pl. [го́ры]{.ru}
  - base: '[ме́жду + уро́к]{.ru}'
    cells:
    - '[ме́жду + уро́к]{.ru}'
    - '[ме́жду уро́ками]{.ru}'
  - base: '[с + друзья́]{.ru}'
    cells:
    - '[с + друзья́]{.ru}'
    - '[с друзья́ми]{.ru}'
  - base: '[с + роди́тели]{.ru}'
    cells:
    - '[с + роди́тели]{.ru}'
    - '[с роди́телями]{.ru}'
  - base: '[с + внук]{.ru}'
    cells:
    - '[с + внук]{.ru}'
    - '[с вну́ками]{.ru}'
  - base: '[пе́ред + зда́ние]{.ru}'
    cells:
    - '[пе́ред + зда́ние]{.ru}'
    - '[пе́ред зда́ниями]{.ru}'
  - base: '[с + я́блоко]{.ru}'
    cells:
    - '[с + я́блоко]{.ru}'
    - '[с я́блоками]{.ru}'
  - base: '[за + магази́н]{.ru}'
    cells:
    - '[за + магази́н]{.ru}'
    - '[за магази́нами]{.ru}'
  - base: '[с + конфе́та]{.ru}'
    cells:
    - '[с + конфе́та]{.ru}'
    - '[с конфе́тами]{.ru}'
  - base: '[над + о́зеро]{.ru}'
    cells:
    - '[над + о́зеро]{.ru}'
    - '[над озёрами]{.ru}'
    hint: pl. [озёра]{.ru}
  - base: '[с + ребя́та]{.ru}'
    cells:
    - '[с + ребя́та]{.ru}'
    - '[с ребя́тами]{.ru}'
  why: |-
    第 3、7、10、12–16 题：硬变化 [-ами]{.ru}：[пе́ред экза́менами, ме́жду уро́ками, с вну́ками, с я́блоками, за магази́нами, с конфе́тами, над озёрами, с ребя́тами]{.ru}。
    第 1、4、5 题：复数重音在词尾：[ме́жду дома́ми, с блина́ми, с гриба́ми]{.ru}。
    第 2、8、9、11 题：软变化或特殊词干 [-ями]{.ru}：[под дере́вьями, с друзья́ми, с роди́телями, пе́ред зда́ниями]{.ru}。
    第 6 题：[гора́]{.ru} 复数 [го́ры]{.ru}，复数第五格重音移到词尾：[за гора́ми]{.ru}。
- id: B2-L12-03
  tags:
  - -ам / -ами 错误核查
  task: 每个词组里有一个名词形式不对，写出改正后的名词。
  type: matrix
  cols:
  - 有错的词组
  - 改正
  given:
  - 0
  rows:
  - base: '[гуля́ть с ребя́там]{.ru}'
    cells:
    - '[гуля́ть с ребя́там]{.ru}'
    - '[ребя́тами]{.ru}'
  - base: '[дари́ть пода́рки ребя́тами]{.ru}'
    cells:
    - '[дари́ть пода́рки ребя́тами]{.ru}'
    - '[ребя́там]{.ru}'
  - base: '[интересова́ться фи́льмам]{.ru}'
    cells:
    - '[интересова́ться фи́льмам]{.ru}'
    - '[фи́льмами]{.ru}'
  - base: '[помога́ть сёстрами]{.ru}'
    cells:
    - '[помога́ть сёстрами]{.ru}'
    - '[сёстрам]{.ru}'
  - base: '[чай с блина́м]{.ru}'
    cells:
    - '[чай с блина́м]{.ru}'
    - '[блина́ми]{.ru}'
  - base: '[звони́ть друзья́ми]{.ru}'
    cells:
    - '[звони́ть друзья́ми]{.ru}'
    - '[друзья́м]{.ru}'
  - base: '[ме́жду дома́м]{.ru}'
    cells:
    - '[ме́жду дома́м]{.ru}'
    - '[дома́ми]{.ru}'
  - base: '[занима́ться языка́м]{.ru}'
    cells:
    - '[занима́ться языка́м]{.ru}'
    - '[языка́ми]{.ru}'
  - base: '[дари́ть цветы́ ма́мами]{.ru}'
    cells:
    - '[дари́ть цветы́ ма́мами]{.ru}'
    - '[ма́мам]{.ru}'
  - base: '[гуля́ть с соба́кам]{.ru}'
    cells:
    - '[гуля́ть с соба́кам]{.ru}'
    - '[соба́ками]{.ru}'
  - base: '[ката́ться на конька́ми]{.ru}'
    cells:
    - '[ката́ться на конька́ми]{.ru}'
    - '[конька́х]{.ru}'
  - base: '[говори́ть о гриба́ми]{.ru}'
    cells:
    - '[говори́ть о гриба́ми]{.ru}'
    - '[гриба́х]{.ru}'
  - base: '[писа́ть роди́телями]{.ru}'
    cells:
    - '[писа́ть роди́телями]{.ru}'
    - '[роди́телям]{.ru}'
  - base: '[сиде́ть под дере́вьям]{.ru}'
    cells:
    - '[сиде́ть под дере́вьям]{.ru}'
    - '[дере́вьями]{.ru}'
  why: |-
    第 1、5、7、10、14 题：[с, ме́жду, под]{.ru} 要求第五格 [-ами / -ями]{.ru}，[-и]{.ru} 不能漏：[с ребя́тами, с блина́ми, ме́жду дома́ми, с соба́ками, под дере́вьями]{.ru}。
    第 2、4、6、9、13 题：给谁（[дари́ть, помога́ть, звони́ть, писа́ть]{.ru}）用第三格 [-ам / -ям]{.ru}：[ребя́там, сёстрам, друзья́м, ма́мам, роди́телям]{.ru}。
    第 3、8 题：[интересова́ться, занима́ться]{.ru} 要求第五格：[фи́льмами, языка́ми]{.ru}。
    第 11、12 题：[на, о]{.ru} 表示处所、关于时用第六格 [-ах]{.ru}：[на конька́х, о гриба́х]{.ru}。
- id: B2-L12-04
  tags:
  - 名词复数第五格：句中
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Ба́бушки гуля́ли в па́рке с ___.
    hint: вну́чки
    accept:
    - вну́чками
    new: true
    gloss: 孙女，外孙女
  - stem: Ди́ма интересу́ется ___.
    hint: маши́ны
    accept:
    - маши́нами
  - stem: Пе́ред ___ Ван Лэй мно́го занима́ется.
    hint: экза́мены
    accept:
    - экза́менами
  - stem: Ми́ша лю́бит пироги́ с ___.
    hint: грибы́
    accept:
    - гриба́ми
  - stem: Ме́жду ___ стоя́ла ма́ленькая це́рковь.
    hint: дома́
    accept:
    - дома́ми
  - stem: Мы ча́сто игра́ем в футбо́л с ___.
    hint: сосе́ди
    accept:
    - сосе́дями
  - stem: Ле́том Пьер е́здил на мо́ре с ___.
    hint: друзья́
    accept:
    - друзья́ми
  - stem: На катке́ мы ката́лись с ___.
    hint: одногру́ппники
    accept:
    - одногру́ппниками
  - stem: Под ___ сиде́ли студе́нты.
    hint: дере́вья
    accept:
    - дере́вьями
  - stem: Ю́ми занима́ется ___.
    hint: та́нцы
    accept:
    - та́нцами
    new: true
    gloss: 舞蹈
  - stem: Ма́ма разгова́ривала с ___.
    hint: преподава́тели
    accept:
    - преподава́телями
  - stem: Ми́ша шути́л над ___.
    hint: сёстры
    accept:
    - сёстрами
  - stem: Мы пи́ли чай с ___.
    hint: конфе́ты
    accept:
    - конфе́тами
  - stem: Ми́ша лю́бит фотографи́ровать ча́ек над ___.
    hint: во́лны
    accept:
    - во́лнами
    new: true
    gloss: 波浪
  - stem: Ве́чером я говори́л по телефо́ну с ___.
    hint: роди́тели
    accept:
    - роди́телями
  - stem: А́нна игра́ла в ша́хматы с ___.
    hint: бра́тья
    accept:
    - бра́тьями
  - stem: Ме́жду ___ у нас коро́ткий переры́в.
    hint: ле́кции
    accept:
    - ле́кциями
  - stem: Ма́ма пригото́вила сала́т с ___.
    hint: помидо́ры
    accept:
    - помидо́рами
  - stem: Оте́ц до́лго разгова́ривал с ___.
    hint: врачи́
    accept:
    - врача́ми
  - stem: Пе́ред ___ стоя́ли маши́ны.
    hint: зда́ния
    accept:
    - зда́ниями
  - stem: Мари́я Никола́евна рабо́тает с ___.
    hint: медсёстры
    accept:
    - медсёстрами
    new: true
    gloss: 护士
  - stem: Ди́ма за́нят ___.
    hint: экза́мены
    accept:
    - экза́менами
  - stem: Ван Лэй встре́тился с ___ из гру́ппы.
    hint: студе́нтки
    accept:
    - студе́нтками
  why: |-
    第 1–3、8、10、12–14、18、21–23 题：硬变化 [-ами]{.ru}：[вну́чками, маши́нами, экза́менами, одногру́ппниками, та́нцами, сёстрами, конфе́тами, во́лнами, помидо́рами, студе́нтками, медсёстрами]{.ru}。
    第 4、5、19 题：复数重音在词尾：[гриба́ми, дома́ми, врача́ми]{.ru}。
    第 6、7、9、11、15–17、20 题：软变化或特殊词干 [-ями]{.ru}：[сосе́дями, друзья́ми, дере́вьями, преподава́телями, роди́телями, бра́тьями, ле́кциями, зда́ниями]{.ru}。
