heading: 第 35 课　动词的支配
groups:
- id: B2-L35-01
  tags:
  - 动词的支配：分类
  task: 下列动词后面的名词用哪个格？归栏。
  type: classify
  bins:
  - 第二格
  - 第三格
  - 第四格
  - 第五格
  - 前置词 + 名词
  items:
  - text: '[боя́ться]{.ru}'
    answer: 第二格
  - text: '[жела́ть]{.ru}'
    answer: 第二格
    hint: 祝愿的内容
  - text: '[помога́ть]{.ru}'
    answer: 第三格
  - text: '[меша́ть]{.ru}'
    answer: 第三格
  - text: '[сове́товать]{.ru}'
    answer: 第三格
  - text: '[звони́ть]{.ru}'
    answer: 第三格
  - text: '[обеща́ть]{.ru}'
    answer: 第三格
  - text: '[ве́рить]{.ru}'
    answer: 第三格
    hint: 相信某人的话
  - text: '[проси́ть]{.ru}'
    answer: 第四格
  - text: '[благодари́ть]{.ru}'
    answer: 第四格
    hint: 感谢某人
  - text: '[спра́шивать]{.ru}'
    answer: 第四格
  - text: '[занима́ться]{.ru}'
    answer: 第五格
  - text: '[интересова́ться]{.ru}'
    answer: 第五格
  - text: '[горди́ться]{.ru}'
    answer: 第五格
  - text: '[гото́виться]{.ru}'
    answer: 前置词 + 名词
  - text: '[серди́ться]{.ru}'
    answer: 前置词 + 名词
  - text: '[наде́яться]{.ru}'
    answer: 前置词 + 名词
  - text: '[отвеча́ть]{.ru}'
    answer: 前置词 + 名词
    hint: 回答问题
  why: |-
    第 1、2 题：[боя́ться]{.ru} + 第二格；[жела́ть кому́ чего́]{.ru}：人用第三格，祝愿的内容用第二格。
    第 3–8 题：动作朝向某人，用第三格：[помога́ть, меша́ть, сове́товать, звони́ть, обеща́ть, ве́рить кому́]{.ru}。汉语里这些人像宾语，最容易误用第四格。
    第 9–11 题：[проси́ть, благодари́ть, спра́шивать кого́]{.ru} + 第四格；对照 [отве́тить кому́]{.ru}、[спаси́бо кому́]{.ru} 用第三格。
    第 12–14 题：[занима́ться, интересова́ться, горди́ться]{.ru} + 第五格。
    第 15–18 题：要求前置词：[гото́виться к]{.ru} + 第三格；[серди́ться на, наде́яться на, отвеча́ть на]{.ru} + 第四格。
- id: B2-L35-02
  tags:
  - 动词的支配：词组
  task: 写出动词和补语组成的词组。
  type: matrix
  cols:
  - 动词 + 补语
  - 词组
  given:
  - 0
  rows:
  - base: '[помога́ть + брат]{.ru}'
    cells:
    - '[помога́ть + брат]{.ru}'
    - '[помога́ть бра́ту]{.ru}'
  - base: '[боя́ться + экза́мен]{.ru}'
    cells:
    - '[боя́ться + экза́мен]{.ru}'
    - '[боя́ться экза́мена]{.ru}'
  - base: '[меша́ть + мы]{.ru}'
    cells:
    - '[меша́ть + мы]{.ru}'
    - '[меша́ть нам]{.ru}'
  - base: '[спроси́ть + профе́ссор]{.ru}'
    cells:
    - '[спроси́ть + профе́ссор]{.ru}'
    - '[спроси́ть профе́ссора]{.ru}'
  - base: '[занима́ться + му́зыка]{.ru}'
    cells:
    - '[занима́ться + му́зыка]{.ru}'
    - '[занима́ться му́зыкой]{.ru}'
  - base: '[гото́виться к + экза́мены]{.ru}'
    cells:
    - '[гото́виться к + экза́мены]{.ru}'
    - '[гото́виться к экза́менам]{.ru}'
  - base: '[благодари́ть + роди́тели]{.ru}'
    cells:
    - '[благодари́ть + роди́тели]{.ru}'
    - '[благодари́ть роди́телей]{.ru}'
  - base: '[серди́ться на + он]{.ru}'
    cells:
    - '[серди́ться на + он]{.ru}'
    - '[серди́ться на него́]{.ru}'
  - base: '[ве́рить в + приме́ты]{.ru}'
    cells:
    - '[ве́рить в + приме́ты]{.ru}'
    - '[ве́рить в приме́ты]{.ru}'
  - base: '[сове́товать + друзья́]{.ru}'
    cells:
    - '[сове́товать + друзья́]{.ru}'
    - '[сове́товать друзья́м]{.ru}'
  - base: '[интересова́ться + исто́рия]{.ru}'
    cells:
    - '[интересова́ться + исто́рия]{.ru}'
    - '[интересова́ться исто́рией]{.ru}'
  - base: '[жела́ть + уда́ча]{.ru}'
    cells:
    - '[жела́ть + уда́ча]{.ru}'
    - '[жела́ть уда́чи]{.ru}'
  - base: '[наде́яться на + вы]{.ru}'
    cells:
    - '[наде́яться на + вы]{.ru}'
    - '[наде́яться на вас]{.ru}'
  - base: '[отвеча́ть на + вопро́сы]{.ru}'
    cells:
    - '[отвеча́ть на + вопро́сы]{.ru}'
    - '[отвеча́ть на вопро́сы]{.ru}'
  - base: '[обеща́ть + ма́ма]{.ru}'
    cells:
    - '[обеща́ть + ма́ма]{.ru}'
    - '[обеща́ть ма́ме]{.ru}'
  - base: '[боя́ться + соба́ки]{.ru}'
    cells:
    - '[боя́ться + соба́ки]{.ru}'
    - '[боя́ться соба́к]{.ru}'
  - base: '[проси́ть + она́]{.ru}'
    cells:
    - '[проси́ть + она́]{.ru}'
    - '[проси́ть её]{.ru}'
  - base: '[спаси́бо + ты]{.ru}'
    cells:
    - '[спаси́бо + ты]{.ru}'
    - '[спаси́бо тебе́]{.ru}'
  why: |-
    第 1、3、10、15 题：第三格：[бра́ту, нам, друзья́м, ма́ме]{.ru}。第 3 题不能写 [меша́ть нас]{.ru}。
    第 2、12、16 题：第二格：[экза́мена, уда́чи, соба́к]{.ru}；第 16 题复数第二格 [соба́к]{.ru}，零词尾。
    第 4、7、17 题：第四格，指人同第二格：[профе́ссора, роди́телей, её]{.ru}。
    第 5、11 题：第五格：[му́зыкой, исто́рией]{.ru}。
    第 6 题：[к]{.ru} + 复数第三格：[к экза́менам]{.ru}。
    第 8、9、13、14 题：[на, в]{.ru} + 第四格：[на него́]{.ru}（前置词后加 [н-]{.ru}），[в приме́ты, на вас, на вопро́сы]{.ru}（非动物复数第四格同第一格）。
    第 18 题：[спаси́бо]{.ru} 后用第三格：[спаси́бо тебе́]{.ru}，和 [благодари́ть тебя́]{.ru} 不同。
- id: B2-L35-03
  tags:
  - 动词的支配：同一补语
  task: 写出补语在各动词后的形式。
  type: matrix
  cols:
  - 补语
  - '[помо́чь]{.ru}'
  - '[спроси́ть]{.ru}'
  - '[ве́рить]{.ru}'
  - '[благодари́ть]{.ru}'
  given:
  - 0
  rows:
  - base: '[Ди́ма]{.ru}'
    cells:
    - '[Ди́ма]{.ru}'
    - '[Ди́ме]{.ru}'
    - '[Ди́му]{.ru}'
    - '[Ди́ме]{.ru}'
    - '[Ди́му]{.ru}'
  - base: '[А́нна]{.ru}'
    cells:
    - '[А́нна]{.ru}'
    - '[А́нне]{.ru}'
    - '[А́нну]{.ru}'
    - '[А́нне]{.ru}'
    - '[А́нну]{.ru}'
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[роди́телям]{.ru}'
    - '[роди́телей]{.ru}'
    - '[роди́телям]{.ru}'
    - '[роди́телей]{.ru}'
  - base: '[учителя́]{.ru}'
    cells:
    - '[учителя́]{.ru}'
    - '[учителя́м]{.ru}'
    - '[учителе́й]{.ru}'
    - '[учителя́м]{.ru}'
    - '[учителе́й]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[ей]{.ru}'
    - '[её]{.ru}'
    - '[ей]{.ru}'
    - '[её]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[им]{.ru}'
    - '[их]{.ru}'
    - '[им]{.ru}'
    - '[их]{.ru}'
  - base: '[О́льга Ви́кторовна]{.ru}'
    cells:
    - '[О́льга Ви́кторовна]{.ru}'
    - '[О́льге Ви́кторовне]{.ru}'
    - '[О́льгу Ви́кторовну]{.ru}'
    - '[О́льге Ви́кторовне]{.ru}'
    - '[О́льгу Ви́кторовну]{.ru}'
  why: |-
    第 1–7 题：[помо́чь, ве́рить]{.ru} 要求第三格：[Ди́ме, роди́телям, ей, им]{.ru}；[спроси́ть, благодари́ть]{.ru} 要求第四格，指人同第二格：[Ди́му, роди́телей, учителе́й, её, их]{.ru}。
    第 1、2、7 题：阴性和 [-а]{.ru} 结尾的阳性名词第三格 [-е]{.ru}、第四格 [-у]{.ru}：[Ди́ме / Ди́му]{.ru}；名字和父称都变：[О́льге Ви́кторовне, О́льгу Ви́кторовну]{.ru}。
    第 5、6 题：没有前置词，不加 [н-]{.ru}：[ей, её, им, их]{.ru}。
