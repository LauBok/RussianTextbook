heading: 综合练习　单数第六格
lessons: [L11, L12, L13, L17, L18, L19]
groups:
- id: L19-综合-a
  lessons: [L11, L12, L17]
  tags: [综合：名词单数第六格词尾]
  recycles: [L11-04, L12-03, L17-03]
  task: 按第六格词尾把名词归类。
  type: classify
  bins: ['[-е]{.ru}', '[-и]{.ru}', '[-у́]{.ru}']
  items:
  - {text: '[шко́ла]{.ru}', answer: '[-е]{.ru}'}
  - {text: '[музе́й]{.ru}', answer: '[-е]{.ru}'}
  - {text: '[тетра́дь]{.ru}', hint: f, answer: '[-и]{.ru}'}
  - {text: '[аудито́рия]{.ru}', answer: '[-и]{.ru}'}
  - {text: '[сад]{.ru}', hint: '表示处所', answer: '[-у́]{.ru}'}
  - {text: '[письмо́]{.ru}', answer: '[-е]{.ru}'}
  - {text: '[зда́ние]{.ru}', answer: '[-и]{.ru}'}
  - {text: '[ку́хня]{.ru}', answer: '[-е]{.ru}'}
  - {text: '[Росси́я]{.ru}', answer: '[-и]{.ru}'}
  - {text: '[пол]{.ru}', hint: '表示处所', answer: '[-у́]{.ru}', new: true, gloss: 地板}
  - {text: '[мо́ре]{.ru}', answer: '[-е]{.ru}'}
  - {text: '[пло́щадь]{.ru}', hint: f, answer: '[-и]{.ru}'}
  - {text: '[ле́кция]{.ru}', answer: '[-и]{.ru}'}
  - {text: '[парк]{.ru}', answer: '[-е]{.ru}'}
  - {text: '[общежи́тие]{.ru}', answer: '[-и]{.ru}'}
  - {text: '[лес]{.ru}', hint: '表示处所', answer: '[-у́]{.ru}', new: true, gloss: 森林}
  why: |
    第 1、2、6、8、11、14 题：一般阴性 [-а / -я]{.ru}、阳性和中性名词第六格词尾都是 [-е]{.ru}，如 [в шко́ле, в музе́е, в письме́]{.ru}。
    第 3、12 题：以 [-ь]{.ru} 结尾的阴性名词用 [-и]{.ru}：[в тетра́ди, на пло́щади]{.ru}。
    第 4、7、9、13、15 题：[-ия, -ие]{.ru} 结尾的名词用 [-и]{.ru}，不用 [-е]{.ru}：[в аудито́рии, в зда́нии]{.ru}。这是最容易写错的一类。
    第 5、10、16 题：少数阳性名词表示处所时用重读的 [-у́]{.ru}：[в саду́, на полу́, в лесу́]{.ru}。
- id: L19-综合-b
  lessons: [L13, L18, L19]
  tags: [综合：第六格词组共同变化]
  recycles: [L13-01, L18-04, L19-03]
  task: 写出第六格词组。
  type: matrix
  cols: [原形, 第六格词组]
  given: [0]
  rows:
  - {base: '[в + наш + но́вый + общежи́тие]{.ru}', cells: ['[в + наш + но́вый + общежи́тие]{.ru}', '[в на́шем но́вом общежи́тии]{.ru}']}
  - {base: '[на + э́тот + большо́й + пло́щадь]{.ru}', hint: f, cells: ['[на + э́тот + большо́й + пло́щадь]{.ru}', '[на э́той большо́й пло́щади]{.ru}']}
  - {base: '[в + мой + ма́ленький + ко́мната]{.ru}', cells: ['[в + мой + ма́ленький + ко́мната]{.ru}', '[в мое́й ма́ленькой ко́мнате]{.ru}']}
  - {base: '[в + тот + ста́рый + музе́й]{.ru}', cells: ['[в + тот + ста́рый + музе́й]{.ru}', '[в том ста́ром музе́е]{.ru}']}
  - {base: '[на + ваш + ле́тний + да́ча]{.ru}', cells: ['[на + ваш + ле́тний + да́ча]{.ru}', '[на ва́шей ле́тней да́че]{.ru}']}
  - {base: '[в + твой + си́ний + су́мка]{.ru}', cells: ['[в + твой + си́ний + су́мка]{.ru}', '[в твое́й си́ней су́мке]{.ru}']}
  - {base: '[на + э́тот + ве́черний + ле́кция]{.ru}', cells: ['[на + э́тот + ве́черний + ле́кция]{.ru}', '[на э́той ве́черней ле́кции]{.ru}']}
  - {base: '[в + наш + ру́сский + кни́га]{.ru}', cells: ['[в + наш + ру́сский + кни́га]{.ru}', '[в на́шей ру́сской кни́ге]{.ru}']}
  - {base: '[о + мой + ста́рый + друг]{.ru}', cells: ['[о + мой + ста́рый + друг]{.ru}', '[о моём ста́ром дру́ге]{.ru}']}
  - {base: '[о + твой + интере́сный + рабо́та]{.ru}', cells: ['[о + твой + интере́сный + рабо́та]{.ru}', '[о твое́й интере́сной рабо́те]{.ru}']}
  - {base: '[о + он]{.ru}', cells: ['[о + он]{.ru}', '[о нём]{.ru}']}
  - {base: '[о + я]{.ru}', cells: ['[о + я]{.ru}', '[обо мне]{.ru}']}
  why: |
    第 1–8 题：三个词一起变。物主、指示代词阳性和中性是 [-ём / -ем, том, э́том]{.ru}，阴性是 [-ей, той, э́той]{.ru}；形容词阳性和中性是 [-ом / -ем]{.ru}，阴性是 [-ой / -ей]{.ru}；名词按自己的类型变。
    第 2 题：[пло́щадь]{.ru} 是阴性，修饰语用阴性，名词用 [-и]{.ru}。
    第 5、6、7 题：[ле́тний, си́ний, ве́черний]{.ru} 是软变化，用 [-ей]{.ru}；第 8 题 [ру́сский]{.ru} 词干末尾是 [к]{.ru}，阴性用 [-ой]{.ru}。
    第 7 题：[ле́кция]{.ru} 用 [-ии]{.ru}。
    第 9 题：阳性 [друг]{.ru} 加 [-е]{.ru}：[о дру́ге]{.ru}。
    第 11、12 题：代词前用 [о]{.ru}，[я]{.ru} 前要说 [обо]{.ru}：[обо мне]{.ru}。
