groups:
- id: L19-综合-a
  lessons:
  - L11
  - L12
  - L17
  tags:
  - 综合：名词单数第六格词尾
  recycles:
  - L11-04
  - L12-03
  - L17-03
  task: 按表示处所时的第六格词尾把名词归类。
  type: classify
  bins:
  - '[-е]{.ru}'
  - '[-и]{.ru}'
  - '[-у́]{.ru}'
  items:
  - text: '[шко́ла]{.ru}'
    answer: '[-е]{.ru}'
  - text: '[музе́й]{.ru}'
    answer: '[-е]{.ru}'
  - text: '[тетра́дь]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[аудито́рия]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[сад]{.ru}'
    answer: '[-у́]{.ru}'
  - text: '[письмо́]{.ru}'
    answer: '[-е]{.ru}'
  - text: '[зда́ние]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[ку́хня]{.ru}'
    answer: '[-е]{.ru}'
  - text: '[Росси́я]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[шкаф]{.ru}'
    answer: '[-у́]{.ru}'
  - text: '[слова́рь]{.ru}'
    answer: '[-е]{.ru}'
  - text: '[пло́щадь]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[ле́кция]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[парк]{.ru}'
    answer: '[-е]{.ru}'
  - text: '[общежи́тие]{.ru}'
    answer: '[-и]{.ru}'
  - text: '[галере́я]{.ru}'
    answer: '[-е]{.ru}'
    new: true
    gloss: 画廊
  - text: '[портфе́ль]{.ru}'
    answer: '[-е]{.ru}'
    hint: m
    new: true
    gloss: 公文包
  - text: '[пол]{.ru}'
    answer: '[-у́]{.ru}'
    new: true
    gloss: 地板
  why: |-
    第 1、2、6、8、14、16 题：一般阳性、中性名词和 [-а / -я]{.ru} 阴性名词用 [-е]{.ru}：[в шко́ле, в музе́е, в письме́, на ку́хне, в па́рке, в галере́е]{.ru}（[-ея]{.ru} 不是 [-ия]{.ru}）。
    第 11、17 题：阳性 [-ь]{.ru} 名词也用 [-е]{.ru}：[в словаре́, в портфе́ле]{.ru}。
    第 3、12 题：阴性 [-ь]{.ru} 名词用 [-и]{.ru}：[в тетра́ди, на пло́щади]{.ru}。
    第 4、7、9、13、15 题：[-ия, -ие]{.ru} 名词用 [-ии]{.ru}：[в аудито́рии, в зда́нии, в Росси́и, на ле́кции, в общежи́тии]{.ru}。
    第 5、10、18 题：少数阳性名词表示处所用 [-у́]{.ru}：[в саду́, в шкафу́, на полу́]{.ru}。
- id: L19-综合-b
  lessons:
  - L13
  - L17
  - L18
  - L19
  tags:
  - 综合：名词、代词、修饰语混合第六格
  recycles:
  - L13-01
  - L18-04
  - L19-03
  task: 写出第六格词组。
  type: matrix
  cols:
  - 原形
  - 第六格词组
  given:
  - 0
  rows:
  - base: '[на́ша + ста́рая + да́ча]{.ru}'
    cells:
    - '[на́ша + ста́рая + да́ча]{.ru}'
    - '[на на́шей ста́рой да́че]{.ru}'
  - base: '[о + он]{.ru}'
    cells:
    - '[о + он]{.ru}'
    - '[о нём]{.ru}'
  - base: '[тот + ле́тний + сад]{.ru}'
    cells:
    - '[тот + ле́тний + сад]{.ru}'
    - '[в том ле́тнем саду́]{.ru}'
    new: true
    gloss: 夏天的
  - base: '[в + э́то + общежи́тие]{.ru}'
    cells:
    - '[в + э́то + общежи́тие]{.ru}'
    - '[в э́том общежи́тии]{.ru}'
  - base: '[о + я]{.ru}'
    cells:
    - '[о + я]{.ru}'
    - '[обо мне]{.ru}'
  - base: '[ва́ша + вече́рняя + ле́кция]{.ru}'
    cells:
    - '[ва́ша + вече́рняя + ле́кция]{.ru}'
    - '[на ва́шей вече́рней ле́кции]{.ru}'
    new: true
    gloss: 晚上的
  - base: '[мой + шкаф]{.ru}'
    cells:
    - '[мой + шкаф]{.ru}'
    - '[в моём шкафу́]{.ru}'
  - base: '[о + она́]{.ru}'
    cells:
    - '[о + она́]{.ru}'
    - '[о ней]{.ru}'
  - base: '[э́та + си́няя + тетра́дь]{.ru}'
    cells:
    - '[э́та + си́няя + тетра́дь]{.ru}'
    - '[в э́той си́ней тетра́ди]{.ru}'
  - base: '[твоё + ую́тное + кре́сло]{.ru}'
    cells:
    - '[твоё + ую́тное + кре́сло]{.ru}'
    - '[в твоём ую́тном кре́сле]{.ru}'
  - base: '[о + Росси́я]{.ru}'
    cells:
    - '[о + Росси́я]{.ru}'
    - '[о Росси́и]{.ru}'
  - base: '[на + пол]{.ru}'
    cells:
    - '[на + пол]{.ru}'
    - '[на полу́]{.ru}'
    new: true
    gloss: 地板
  - base: '[о + на́ша + исто́рия]{.ru}'
    cells:
    - '[о + на́ша + исто́рия]{.ru}'
    - '[о на́шей исто́рии]{.ru}'
  - base: '[о + они́]{.ru}'
    cells:
    - '[о + они́]{.ru}'
    - '[о них]{.ru}'
  why: |-
    第 1 题：阴性：代词 [-ей]{.ru}，形容词 [-ой]{.ru}，名词 [-е]{.ru}：[на на́шей ста́рой да́че]{.ru}。
    第 6、9 题：软变化形容词阴性 [-ей]{.ru}；名词各按自己的类型：[на ва́шей вече́рней ле́кции, в э́той си́ней тетра́ди]{.ru}。
    第 4、10 题：中性和阳性同词尾：[в э́том общежи́тии, в твоём ую́тном кре́сле]{.ru}。
    第 3、7、12 题：[сад, шкаф, пол]{.ru} 表示处所用 [-у́]{.ru}，前面的修饰语照常变：[в том ле́тнем саду́, в моём шкафу́, на полу́]{.ru}。
    第 11、13 题：[-ия]{.ru} 名词用 [-ии]{.ru}：[о Росси́и, о на́шей исто́рии]{.ru}；[на́шей]{.ru} 以辅音开头，用 [о]{.ru}。
    第 2、5、8、14 题：人称代词：[о нём, о ней, о них]{.ru} 前加 [н]{.ru}；[обо мне]{.ru}。
- id: L19-综合-c
  lessons:
  - L11
  - L12
  - L13
  - L17
  - L18
  - L19
  tags:
  - 综合：第六格词组核查
  recycles:
  - L18-03
  - L19-01
  - L19-02
  task: 改正词组中的错误。
  type: matrix
  cols:
  - 有错的词组
  - 正确的词组
  given:
  - 0
  rows:
  - base: '[в аудито́рие]{.ru}'
    cells:
    - '[в аудито́рие]{.ru}'
    - '[в аудито́рии]{.ru}'
  - base: '[в са́де]{.ru}'
    cells:
    - '[в са́де]{.ru}'
    - '[в саду́]{.ru}'
  - base: '[в моём ко́мнате]{.ru}'
    cells:
    - '[в моём ко́мнате]{.ru}'
    - '[в мое́й ко́мнате]{.ru}'
  - base: '[на филологи́ческим факульте́те]{.ru}'
    cells:
    - '[на филологи́ческим факульте́те]{.ru}'
    - '[на филологи́ческом факульте́те]{.ru}'
  - base: '[в э́той зда́нии]{.ru}'
    cells:
    - '[в э́той зда́нии]{.ru}'
    - '[в э́том зда́нии]{.ru}'
  - base: '[о он]{.ru}'
    cells:
    - '[о он]{.ru}'
    - '[о нём]{.ru}'
  - base: '[в нём ко́мнате]{.ru}'
    cells:
    - '[в нём ко́мнате]{.ru}'
    - '[в его́ ко́мнате]{.ru}'
    hint: 在他的房间里
  - base: '[в си́нем су́мке]{.ru}'
    cells:
    - '[в си́нем су́мке]{.ru}'
    - '[в си́ней су́мке]{.ru}'
  - base: '[на ле́кцие]{.ru}'
    cells:
    - '[на ле́кцие]{.ru}'
    - '[на ле́кции]{.ru}'
  - base: '[в хоро́шом райо́не]{.ru}'
    cells:
    - '[в хоро́шом райо́не]{.ru}'
    - '[в хоро́шем райо́не]{.ru}'
  - base: '[в той общежи́тии]{.ru}'
    cells:
    - '[в той общежи́тии]{.ru}'
    - '[в том общежи́тии]{.ru}'
  - base: '[на пло́щаде]{.ru}'
    cells:
    - '[на пло́щаде]{.ru}'
    - '[на пло́щади]{.ru}'
  - base: '[в большо́м аудито́рии]{.ru}'
    cells:
    - '[в большо́м аудито́рии]{.ru}'
    - '[в большо́й аудито́рии]{.ru}'
  - base: '[в шкафе́]{.ru}'
    cells:
    - '[в шкафе́]{.ru}'
    - '[в шкафу́]{.ru}'
  why: |-
    第 1、9 题：[-ия, -ие]{.ru} 名词第六格是 [-ии]{.ru}：[в аудито́рии, на ле́кции]{.ru}。
    第 2、14 题：[сад, шкаф]{.ru} 表示处所用 [-у́]{.ru}：[в саду́, в шкафу́]{.ru}。
    第 12 题：阴性 [-ь]{.ru} 名词用 [-и]{.ru}：[на пло́щади]{.ru}。
    第 3 题：[ко́мната]{.ru} 是阴性，物主代词用 [мое́й]{.ru}。
    第 5、11 题：[зда́ние, общежи́тие]{.ru} 是中性，指示代词用阳性、中性的 [э́том, том]{.ru}。
    第 4、8、13 题：形容词词尾和名词的性不一致：阳性 [филологи́ческом]{.ru}（[к]{.ru} 后照硬变化写 [-ом]{.ru}），阴性 [си́ней, большо́й]{.ru}。
    第 10 题：[ш]{.ru} 后不重读的 [о]{.ru} 写成 [е]{.ru}：[в хоро́шем]{.ru}。
    第 6 题：第三人称代词在前置词后加 [н]{.ru}：[о нём]{.ru}。
    第 7 题：“他的”是物主代词 [его́]{.ru}，不变，也不加 [н]{.ru}：[в его́ ко́мнате]{.ru}；[в нём]{.ru} 是“在它里面”。
- id: L19-综合-d
  lessons:
  - L12
  - L13
  - L17
  - L18
  - L19
  tags:
  - 综合：в / на 与 о 的搭配
  recycles:
  - L12-05
  - L13-03
  task: 用前置词和括号里词的第六格填空。
  type: fill
  items:
  - stem: Мы бы́ли ___.
    hint: интере́сная экску́рсия
    accept:
    - на интере́сной экску́рсии
  - stem: Студе́нты говоря́т ___.
    hint: э́тот уро́к
    accept:
    - об э́том уро́ке
  - stem: Мари́я Никола́евна рабо́тает ___.
    hint: райо́нная поликли́ника
    accept:
    - в райо́нной поликли́нике
  - stem: Ба́бушка рабо́тает ___.
    hint: наш сад
    accept:
    - в на́шем саду́
  - stem: Ван Лэй ча́сто ду́мает ___.
    hint: его́ семья́
    accept:
    - о его́ семье́
  - stem: А́нна ___.
    hint: филологи́ческий факульте́т
    accept:
    - на филологи́ческом факульте́те
  - stem: Ю́ми живёт ___.
    hint: то общежи́тие
    accept:
    - в том общежи́тии
  - stem: Ми́ша игра́ет ___.
    hint: у́лица
    accept:
    - на у́лице
  - stem: Пьер расска́зывает ___.
    hint: Фра́нция
    accept:
    - о Фра́нции
  - stem: Ма́ма ___.
    hint: на́ша ку́хня
    accept:
    - на на́шей ку́хне
  - stem: Ты ду́маешь ___?
    hint: я
    accept:
    - обо мне
  - stem: Ключи́ ___.
    hint: твой шкаф
    accept:
    - в твоём шкафу́
  - stem: Мы чита́ем ___.
    hint: Большо́й теа́тр
    accept:
    - о Большо́м теа́тре
  - stem: Студе́нты ___.
    hint: больша́я аудито́рия
    accept:
    - в большо́й аудито́рии
  why: |-
    第 3、7、14 题：可以走进去的地方用 [в]{.ru}：[в райо́нной поликли́нике, в том общежи́тии, в большо́й аудито́рии]{.ru}。
    第 4、12 题：[сад, шкаф]{.ru} 前用 [в]{.ru}，名词用 [-у́]{.ru}：[в на́шем саду́, в твоём шкафу́]{.ru}。
    第 1、6、8、10 题：活动、部门、开阔的地方和 [ку́хня]{.ru} 用 [на]{.ru}：[на интере́сной экску́рсии, на филологи́ческом факульте́те, на у́лице, на на́шей ку́хне]{.ru}。
    第 2、5、9、11、13 题：“关于”用 [о]{.ru}；元音前用 [об]{.ru}：[об э́том уро́ке]{.ru}；[мне]{.ru} 前用 [обо]{.ru}；[его́]{.ru} 开头的音是 [[й]]{.tr}，用 [о]{.ru}：[о его́ семье́]{.ru}；[о Фра́нции, о Большо́м теа́тре]{.ru}。在 [о]{.ru} 后面 [сад]{.ru} 一类词不用 [-у́]{.ru}。
