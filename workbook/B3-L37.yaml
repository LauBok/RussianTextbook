    - '[Те, кто ___ (сдать) экза́мены, ___ (пое́хать) на мо́ре.]{.ru}'
    - '[сдал]{.ru}'
    - '[пое́хали]{.ru}'
  - base: '[Те, кто ___ (опозда́ть), ___ (стоя́ть) у две́ри.]{.ru}'
    cells:
    - '[Те, кто ___ (опозда́ть), ___ (стоя́ть) у две́ри.]{.ru}'
    - '[опозда́л]{.ru}'
    - '[стоя́ли]{.ru}'
  - base: '[Все, кто ___ (знать) Ива́на Серге́евича, ___ (уважа́ть) его́.]{.ru}'
    cells:
    - '[Все, кто ___ (знать) Ива́на Серге́евича, ___ (уважа́ть) его́.]{.ru}'
    - '[знал]{.ru}'
    - '[уважа́ли]{.ru}'
  - base: '[Те, кто ___ (жить) в общежи́тии, ча́сто ___ (гото́вить) у́жин вме́сте.]{.ru}'
    cells:
    - '[Те, кто ___ (жить) в общежи́тии, ча́сто ___ (гото́вить) у́жин вме́сте.]{.ru}'
    - '[жил]{.ru}'
    - '[гото́вили]{.ru}'
  - base: '[Все, кто ___ (быть) в за́ле, ___ (встать).]{.ru}'
    cells:
    - '[Все, кто ___ (быть) в за́ле, ___ (встать).]{.ru}'
    - '[был]{.ru}'
    - '[вста́ли]{.ru}'
  - base: '[Те, кто ___ (хоте́ть) помо́чь, ___ (прийти́) в суббо́ту.]{.ru}'
    cells:
    - '[Те, кто ___ (хоте́ть) помо́чь, ___ (прийти́) в суббо́ту.]{.ru}'
    - '[хоте́л]{.ru}'
    - '[пришли́]{.ru}'
  - base: '[Тот, кто ___ (прочита́ть) э́ту кни́гу, никогда́ её не ___ (забы́ть).]{.ru}'
