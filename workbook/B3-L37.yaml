  task: 用括号里的动词写出从句谓语和主句谓语（过去时或句中要求的时）。
  type: matrix
  cols:
  - 句子
  - 从句谓语
  - 主句谓语
  given:
  - 0
  rows:
  - base: '[Все, кто ___ (прийти́) на конце́рт, ___ (оста́ться) дово́льны.]{.ru}'
    cells:
    - '[Все, кто ___ (прийти́) на конце́рт, ___ (оста́ться) дово́льны.]{.ru}'
    - '[пришёл]{.ru}'
    - '[оста́лись]{.ru}'
  - base: '[Те, кто ___ (сдать) экза́мены, ___ (пое́хать) на мо́ре.]{.ru}'
