- id: B3-L37-01
  lessons:
  - B3-L36
  - B3-L37
  tags:
  - 指示词与关联词：тот, кто 的格
  - 指示词与关联词：то, что 的格
  task: 用括号里的词填空，写出指示词和关联词（需要时带前置词）。
  type: matrix
  cols:
  - 句子
  - 指示词
  - 关联词
  given:
  - 0
  rows:
  - base: '[Врачи́ помога́ли ___ (те), ___ (кто) был ра́нен.]{.ru}'
    cells:
    - '[Врачи́ помога́ли ___ (те), ___ (кто) был ра́нен.]{.ru}'
    - '[тем]{.ru}'
    - '[кто]{.ru}'
  - base: '[Мы ча́сто вспомина́ем ___ (те), ___ (кто) уже́ нет с на́ми.]{.ru}'
    cells:
    - '[Мы ча́сто вспомина́ем ___ (те), ___ (кто) уже́ нет с на́ми.]{.ru}'
    - '[тех]{.ru}'
    - '[кого́]{.ru}'
  - base: '[Учи́тель похвали́л ___ (те), ___ (кто) пра́вильно отве́тил на все вопро́сы.]{.ru}'
    cells:
    - '[Учи́тель похвали́л ___ (те), ___ (кто) пра́вильно отве́тил на все вопро́сы.]{.ru}'
    - '[тех]{.ru}'
    - '[кто]{.ru}'
  - base: '[Ни́на написа́ла пи́сьма ___ (те), ___ (кто) она́ познако́милась в Москве́.]{.ru}'
    cells:
    - '[Ни́на написа́ла пи́сьма ___ (те), ___ (кто) она́ познако́милась в Москве́.]{.ru}'
    - '[тем]{.ru}'
    - '[с кем]{.ru}'
  - base: '[Старики́ всегда́ ра́довались ___ (все), ___ (кто) приходи́л к ним в го́сти.]{.ru}'
    cells:
    - '[Старики́ всегда́ ра́довались ___ (все), ___ (кто) приходи́л к ним в го́сти.]{.ru}'
    - '[всем]{.ru}'
    - '[кто]{.ru}'
  - base: '[Я хочу́ поговори́ть с ___ (те), ___ (кто) вы расска́зывали вчера́.]{.ru}'
    cells:
    - '[Я хочу́ поговори́ть с ___ (те), ___ (кто) вы расска́зывали вчера́.]{.ru}'
    - '[те́ми]{.ru}'
    - '[о ком]{.ru}'
  - base: '[Ди́ма не узна́л ___ (те), ___ (кто) он встре́тил в библиоте́ке.]{.ru}'
    cells:
    - '[Ди́ма не узна́л ___ (те), ___ (кто) он встре́тил в библиоте́ке.]{.ru}'
    - '[тех]{.ru}'
    - '[кого́]{.ru}'
  - base: '[Ба́бушка пригото́вила обе́д для ___ (все), ___ (кто) прие́хал на пра́здник.]{.ru}'
    cells:
    - '[Ба́бушка пригото́вила обе́д для ___ (все), ___ (кто) прие́хал на пра́здник.]{.ru}'
    - '[всех]{.ru}'
    - '[кто]{.ru}'
  - base: '[Ве́чером А́нна рассказа́ла ___ (то), ___ (что) ду́мала весь день.]{.ru}'
    cells:
    - '[Ве́чером А́нна рассказа́ла ___ (то), ___ (что) ду́мала весь день.]{.ru}'
    - '[то]{.ru}'
    - '[о чём]{.ru}'
  - base: '[Ми́ша о́чень интересу́ется ___ (то), ___ (что) занима́ется его́ оте́ц.]{.ru}'
    cells:
    - '[Ми́ша о́чень интересу́ется ___ (то), ___ (что) занима́ется его́ оте́ц.]{.ru}'
    - '[тем]{.ru}'
    - '[чем]{.ru}'
  - base: '[Мы не согла́сны с ___ (то), ___ (что) напи́сано в статье́.]{.ru}'
    cells:
    - '[Мы не согла́сны с ___ (то), ___ (что) напи́сано в статье́.]{.ru}'
    - '[тем]{.ru}'
    - '[что]{.ru}'
  - base: '[Пьер мно́го расска́зывал о ___ (то), ___ (что) он ви́дел в Сиби́ри.]{.ru}'
    cells:
    - '[Пьер мно́го расска́зывал о ___ (то), ___ (что) он ви́дел в Сиби́ри.]{.ru}'
    - '[том]{.ru}'
    - '[что]{.ru}'
  - base: '[Ю́ми удиви́лась ___ (то), ___ (что) ей сказа́ли друзья́.]{.ru}'
    cells:
    - '[Ю́ми удиви́лась ___ (то), ___ (что) ей сказа́ли друзья́.]{.ru}'
    - '[тому́]{.ru}'
    - '[что]{.ru}'
  - base: '[Э́то как раз ___ (то), ___ (что) я давно́ мечта́ю.]{.ru}'
    cells:
    - '[Э́то как раз ___ (то), ___ (что) я давно́ мечта́ю.]{.ru}'
    - '[то]{.ru}'
    - '[о чём]{.ru}'
  - base: '[Студе́нты до́лго ду́мали над ___ (то), ___ (что) им посове́товал профе́ссор.]{.ru}'
    cells:
    - '[Студе́нты до́лго ду́мали над ___ (то), ___ (что) им посове́товал профе́ссор.]{.ru}'
    - '[тем]{.ru}'
    - '[что]{.ru}'
  - base: '[Мари́я Никола́евна горди́тся ___ (всё), ___ (что) доби́лся её сын.]{.ru}'
    cells:
    - '[Мари́я Никола́евна горди́тся ___ (всё), ___ (что) доби́лся её сын.]{.ru}'
    - '[всем]{.ru}'
    - '[чего́]{.ru}'
  why: |-
    第 1–16 题：指示词的格由主句决定，关联词的格由从句决定，两者各管各的。先看主句的动词或前置词缺什么格，再看从句的动词缺什么格。
    第 1、5 题：[помога́ть, ра́доваться]{.ru} 要求第三格：[тем, всем]{.ru}；[кто]{.ru} 是从句主语，用第一格。
    第 3、8 题：[похвали́ть]{.ru} 要求第四格，[для]{.ru} 要求第二格：[тех, всех]{.ru}；[кто]{.ru} 仍是从句主语。
    第 2、7 题：主句 [вспомина́ть, узна́ть]{.ru} 要求第四格：[тех]{.ru}；从句里 [нет]{.ru} 要求第二格，[встре́тить]{.ru} 要求第四格，都是 [кого́]{.ru}。
    第 4、6 题：从句的前置词由从句动词决定：[познако́миться с кем]{.ru} → [с кем]{.ru}；[расска́зывать о ком]{.ru} → [о ком]{.ru}。主句：[писа́ть кому́]{.ru} → [тем]{.ru}；[поговори́ть с кем]{.ru} → [с те́ми]{.ru}。
    第 9、14 题：主句 [рассказа́ть что]{.ru} → [то]{.ru}，[э́то]{.ru} … [то]{.ru}（第一格）；从句 [ду́мать о чём, мечта́ть о чём]{.ru} → [о чём]{.ru}。
    第 10 题：[интересова́ться чем]{.ru} → [тем]{.ru}；[занима́ться чем]{.ru} → [чем]{.ru}。
    第 11、15 题：[с, над]{.ru} 要求第五格：[тем]{.ru}；从句 [напи́сано]{.ru}（[что]{.ru} 作主语）、[посове́товать что]{.ru} → [что]{.ru}。
    第 12、13 题：[о том]{.ru}（第六格），[удиви́ться чему́]{.ru} → [тому́]{.ru}；从句 [ви́деть что, сказа́ть что]{.ru} → [что]{.ru}。
    第 16 题：[горди́ться чем]{.ru} → [всем]{.ru}；[доби́ться чего́]{.ru} → [чего́]{.ru}。
- id: B3-L37-02
  lessons:
  - B3-L36
  - B3-L37
  tags:
  - 指示词与关联词：там, туда, оттуда 与 где, куда, откуда
  task: 填出指示词和关联词。
  type: matrix
  cols:
  - 句子
  - 指示词
  - 关联词
  given:
  - 0
  rows:
  - base: '[Ле́том мы пое́хали отдыха́ть ___, ___ отдыха́ли в про́шлом году́.]{.ru}'
    cells:
    - '[Ле́том мы пое́хали отдыха́ть ___, ___ отдыха́ли в про́шлом году́.]{.ru}'
    - '[туда́]{.ru}'
    - '[где]{.ru}'
  - base: '[Ста́рый учи́тель всю жизнь прожи́л ___, ___ его́ посла́ли по́сле институ́та.]{.ru}'
    cells:
    - '[Ста́рый учи́тель всю жизнь прожи́л ___, ___ его́ посла́ли по́сле институ́та.]{.ru}'
    - '[там]{.ru}'
    - '[куда́]{.ru}'
  - base: '[По́сле войны́ он верну́лся ___, ___ роди́лся.]{.ru}'
    cells:
    - '[По́сле войны́ он верну́лся ___, ___ роди́лся.]{.ru}'
    - '[туда́]{.ru}'
    - '[где]{.ru}'
  - base: '[Ребя́та побежа́ли ___, ___ доноси́лась му́зыка.]{.ru}'
    cells:
    - '[Ребя́та побежа́ли ___, ___ доноси́лась му́зыка.]{.ru}'
    - '[туда́]{.ru}'
    - '[отку́да]{.ru}'
  - base: '[___ сейча́с стро́ят шко́лу, ___ ра́ньше был парк.]{.ru}'
    cells:
    - '[___ сейча́с стро́ят шко́лу, ___ ра́ньше был парк.]{.ru}'
    - '[Там]{.ru}'
    - '[где]{.ru}'
  - base: '[Во вре́мя войны́ мно́гие уходи́ли ___, ___ шли бои́.]{.ru}'
    cells:
    - '[Во вре́мя войны́ мно́гие уходи́ли ___, ___ шли бои́.]{.ru}'
    - '[отту́да]{.ru}'
    - '[где]{.ru}'
  - base: '[Студе́нты рабо́тали ___, ___ их посла́ли.]{.ru}'
    cells:
    - '[Студе́нты рабо́тали ___, ___ их посла́ли.]{.ru}'
    - '[там]{.ru}'
    - '[куда́]{.ru}'
  - base: '[Пти́цы о́сенью улета́ют ___, ___ тепло́.]{.ru}'
    cells:
    - '[Пти́цы о́сенью улета́ют ___, ___ тепло́.]{.ru}'
    - '[туда́]{.ru}'
    - '[где]{.ru}'
  - base: '[Мы прие́хали ___, ___ то́лько что уе́хали на́ши друзья́.]{.ru}'
    cells:
    - '[Мы прие́хали ___, ___ то́лько что уе́хали на́ши друзья́.]{.ru}'
    - '[туда́]{.ru}'
    - '[отку́да]{.ru}'
  - base: '[Ни́на всегда́ с ра́достью возвраща́ется ___, ___ её ждут.]{.ru}'
    cells:
    - '[Ни́на всегда́ с ра́достью возвраща́ется ___, ___ её ждут.]{.ru}'
    - '[туда́]{.ru}'
    - '[где]{.ru}'
  why: |-
    第 1–10 题：指示词看主句动词，关联词看从句动词，各自表示“在哪里”“往哪里”“从哪里”，两者常常不同。
    第 1、3、8、10 题：主句是运动的方向（[пое́хать, верну́ться, улета́ть, возвраща́ться]{.ru} 往哪里）→ [туда́]{.ru}；从句说的是位置（[отдыха́ть, роди́ться, тепло́, ждут]{.ru} 在哪里）→ [где]{.ru}。
    第 2、7 题：主句说位置（[прожи́ть, рабо́тать]{.ru} 在哪里）→ [там]{.ru}；从句 [посла́ть]{.ru} 往哪里 → [куда́]{.ru}。
    第 4、9 题：主句是方向 → [туда́]{.ru}；从句 [доноси́ться, уе́хать]{.ru} 从哪里 → [отку́да]{.ru}。
    第 5 题：两句都说位置：[Там]{.ru} … [где]{.ru}。
    第 6 题：主句 [уходи́ть]{.ru} 从哪里离开 → [отту́да]{.ru}；从句 [шли бои́]{.ru} 在哪里 → [где]{.ru}。
- id: B3-L37-03
  lessons:
