    - '[Тот, кто ___ (прочита́ть) э́ту кни́гу, никогда́ её не ___ (забы́ть).]{.ru}'
    - '[прочита́л]{.ru}'
    - '[забу́дет]{.ru}'
  why: |-
    第 1–7 题：[кто]{.ru} 在从句里作主语时，动词用阳性单数：[кто пришёл, кто сдал, кто был]{.ru}（口语里也能听到复数，书面语以单数为规范）。主句的谓语跟 [те, все]{.ru} 一致，用复数：[оста́лись, пое́хали, вста́ли]{.ru}。
    第 8 题：主句是单数 [тот]{.ru}，谓语也用单数；“永远不会忘记”用完成体将来时：[не забу́дет]{.ru}。
