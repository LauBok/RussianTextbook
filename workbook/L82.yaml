heading: 第 82 课　снача́ла…, пото́м…；когда́ 从句
groups:
- id: L82-01
  tags:
  - когда́ 从句：体与时间关系
  task: 判断 [когда́]{.ru} 复合句里两个动作的关系。
  type: classify
  bins:
  - 同时进行
  - 一个完成后另一个发生
  - 一个进行中发生了另一个
  items:
  - text: Когда́ я за́втракаю, я слу́шаю ра́дио.
    answer: 同时进行
  - text: Когда́ А́нна вы́пила ко́фе, она́ пошла́ в университе́т.
    answer: 一个完成后另一个发生
  - text: Когда́ Ван Лэй шёл домо́й, он уви́дел Пье́ра.
    answer: 一个进行中发生了另一个
  - text: Когда́ Ми́ша де́лал дома́шнее зада́ние, он слу́шал му́зыку.
    answer: 同时进行
  - text: Когда́ па́па поу́жинал, он до́лго чита́л газе́ту.
    answer: 一个完成后另一个发生
  - text: Когда́ ма́ма гото́вила обе́д, позвони́ла ба́бушка.
    answer: 一个进行中发生了另一个
  - text: Когда́ мы е́хали в метро́, мы чита́ли.
    answer: 同时进行
  - text: Когда́ Ю́ми прочита́ла письмо́, она́ позвони́ла ма́ме.
    answer: 一个完成后另一个发生
  - text: Когда́ я смотре́л телеви́зор, позвони́л брат.
    answer: 一个进行中发生了另一个
  - text: Когда́ ди́ктор чита́л но́вости, А́нна пила́ чай.
    answer: 同时进行
  - text: Когда́ конце́рт ко́нчился, мы пошли́ домо́й.
    answer: 一个完成后另一个发生
  - text: Когда́ Пьер гуля́л в па́рке, он уви́дел О́льгу Ви́кторовну.
    answer: 一个进行中发生了另一个
  - text: Когда́ студе́нты писа́ли контро́льную, в аудито́рии бы́ло ти́хо.
    answer: 同时进行
  - text: Когда́ Ван Лэй поза́втракал, он включи́л ра́дио.
    answer: 一个完成后另一个发生
  - text: Когда́ я жил в Пеки́не, я ча́сто ходи́л в парк.
    answer: 同时进行
  - text: Когда́ А́нна сде́лала упражне́ние, она́ начала́ чита́ть.
    answer: 一个完成后另一个发生
  - text: Когда́ Ми́ша игра́л в футбо́л, пошёл дождь.
    answer: 一个进行中发生了另一个
  - text: Я слу́шаю ра́дио, когда́ е́ду в университе́т.
    answer: 同时进行
  - text: Он позвони́л мне, когда́ сде́лал дома́шнее зада́ние.
    answer: 一个完成后另一个发生
  - text: Когда́ мы обе́дали, пошёл снег.
    answer: 一个进行中发生了另一个
  why: '第 1、4、7、10、13、15、18 题：两个动词都是未完成体（[за́втракаю — слу́шаю, де́лал — слу́шал]{.ru}），两个动作同时进行。第 18 题从句在后，关系不变。

    第 2、5、8、11、14、16、19 题：从句是完成体（[вы́пила, поу́жинал, ко́нчился, сде́лала]{.ru}），从句的动作完成以后，主句的动作才发生；第 5 题主句是未完成体 [чита́л]{.ru}，表示吃完饭以后读了很久。

    第 3、6、9、12、17、20 题：从句是未完成体（[шёл, гото́вила, смотре́л]{.ru}），主句是完成体（[уви́дел, позвони́ла, пошёл]{.ru}），在一个动作进行的过程中发生了另一个动作。'
