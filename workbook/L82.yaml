  why: '第 1–13 题第一栏：同时进行用未完成体过去时，主语 [она́]{.ru} 用阴性 [-ла]{.ru}：[Когда́ она́ за́втракала…]{.ru}

    第 1–13 题第二栏：一个动作完成后另一个才发生，从句用完成体：[Когда́ она́ поза́втракала…]{.ru}

    第 1–13 题第三栏：说将来的事，从句也用完成体将来时，不能用现在时：[Когда́ я поза́втракаю, я позвоню́ тебе́.]{.ru} 注意 [вы́пью, напишу́, посмотрю́, вы́учу, пригото́влю, куплю́]{.ru} 的变位，[пригото́влю, куплю́]{.ru} 第一人称加 [л]{.ru}。'
- id: L82-03
  tags:
  - снача́ла…, пото́м…：动作先后
  - когда́ 从句：连接词
  task: 按句意填 [снача́ла]{.ru}、[пото́м]{.ru}、[тепе́рь]{.ru} 或 [когда́]{.ru}。
  type: fill
  items:
  - stem: Снача́ла у нас грамма́тика, ___ чте́ние.
    accept:
    - пото́м
  - stem: ___ бы́ло тру́дно, а тепе́рь легко́.
    accept:
    - Снача́ла
  - stem: ___ я за́втракаю, я слу́шаю ра́дио.
    accept:
    - Когда́
  - stem: Снача́ла я сде́лаю зада́ние, ___ пойду́ гуля́ть.
    accept:
    - пото́м
  - stem: ___ мы смотре́ли фильм, а пото́м пи́ли чай.
    accept:
    - Снача́ла
  - stem: Я позвоню́ тебе́, ___ поза́втракаю.
    accept:
    - когда́
  - stem: ___ А́нна вы́пила ко́фе, они́ пошли́ в университе́т.
    accept:
    - Когда́
  - stem: Снача́ла Ван Лэй пло́хо понима́л ди́ктора, а ___ понима́ет всё.
    accept:
    - тепе́рь
  - stem: Ми́ша чита́ет, ___ е́дет в метро́.
    accept:
    - когда́
  - stem: ___ мы пое́дем в магази́н, а пото́м домо́й.
    accept:
    - Снача́ла
  - stem: ___ конце́рт ко́нчился, мы пошли́ домо́й.
    accept:
    - Когда́
  - stem: Снача́ла поза́втракай, ___ иди́ в шко́лу.
    accept:
    - пото́м
  - stem: Я всегда́ слу́шаю ра́дио, ___ за́втракаю.
    accept:
    - когда́
  - stem: ___ шёл дождь, а тепе́рь идёт мо́крый снег.
    accept:
    - Снача́ла
  why: '第 1、4、12 题：前面已有 [снача́ла]{.ru}，后一个动作用 [пото́м]{.ru}。第 2、5、10、14 题：后半句有 [а пото́м]{.ru} 或 [а тепе́рь]{.ru}，前半句用 [снача́ла]{.ru}。

    第 8 题：[снача́ла…, а тепе́рь…]{.ru} 表示情况变了，动词 [понима́ет]{.ru} 是现在时，用 [тепе́рь]{.ru}，不用 [пото́м]{.ru}。

    第 3、6、7、9、11、13 题：两部分是主从关系，中间只有逗号，用连接词 [когда́]{.ru}；从句可以在前，也可以在后。'
- id: L82-04
  tags:
  - когда́ 从句：过去与将来的时间配合
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Когда́ я ___, я позвоню́ тебе́.
    hint: поза́втракать
    accept:
    - поза́втракаю
  - stem: Когда́ Ван Лэй ___, он позвони́л ма́ме.
    hint: поза́втракать
    accept:
    - поза́втракал
  - stem: Когда́ А́нна ___ кни́гу, она́ даст её Ю́ми.
    hint: прочита́ть
    accept:
    - прочита́ет
  - stem: Когда́ А́нна ___ кни́гу, она́ дала́ её Ю́ми.
    hint: прочита́ть
    accept:
    - прочита́ла
  - stem: Когда́ мы ___ упражне́ние, мы пойдём гуля́ть.
    hint: сде́лать
    accept:
    - сде́лаем
  - stem: Когда́ мы ___ упражне́ние, мы пошли́ гуля́ть.
    hint: сде́лать
    accept:
    - сде́лали
  - stem: Когда́ ты ___ в Пеки́не, ты бу́дешь говори́ть по-кита́йски.
    hint: быть
    accept:
    - бу́дешь
  - stem: Когда́ Ван Лэй ___ в Пеки́не, он говори́л по-кита́йски.
    hint: быть
    accept:
    - был
  - stem: Когда́ уро́к ___, мы пойдём в столо́вую.
    hint: ко́нчиться
    accept:
    - ко́нчится
  - stem: Когда́ уро́к ___, мы пошли́ в столо́вую.
    hint: ко́нчиться
    accept:
    - ко́нчился
  - stem: Когда́ Ми́ша ___ домо́й, ма́ма даст ему́ пирожки́.
    hint: верну́ться
    accept:
    - вернётся
  - stem: Когда́ Ми́ша ___ домо́й, ма́ма дала́ ему́ пирожки́.
    hint: верну́ться
    accept:
    - верну́лся
  - stem: Когда́ вы ___ ко́фе, мы начнём уро́к.
    hint: вы́пить
    accept:
    - вы́пьете
  - stem: Когда́ Ван Лэй ___ прогно́з пого́ды, он позвони́л А́нне.
    hint: послу́шать
    accept:
    - послу́шал
  - stem: Когда́ я ___ прогно́з пого́ды, я позвоню́ А́нне.
    hint: послу́шать
    accept:
    - послу́шаю
  - stem: Когда́ мы ___ в Москве́, мы бу́дем ча́сто ходи́ть в теа́тр.
    hint: быть
    accept:
    - бу́дем
  why: '第 1、3、5、9、11、13、15 题：主句是将来时（[позвоню́, даст, пойдём, начнём]{.ru}），从句也用完成体将来时：[поза́втракаю, прочита́ет, сде́лаем, ко́нчится, вернётся, вы́пьете, послу́шаю]{.ru}。不能用现在时 [за́втракаю]{.ru}，也不能用过去时。

    第 2、4、6、8、10、12、14 题：主句是过去时，从句用过去时，与主语的性数一致：[Ван Лэй поза́втракал, А́нна прочита́ла, мы сде́лали, уро́к ко́нчился, Ми́ша верну́лся]{.ru}。

    第 7、16 题：[быть]{.ru} 的将来时 [бу́ду, бу́дешь, бу́дем]{.ru}；第 8 题过去时 [был]{.ru}。'
