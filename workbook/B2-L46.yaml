  why: |-
    第 1 题：在从句里“这个人在这里工作”，[кото́рый]{.ru} 是主语，用第一格；不要照主句的 [челове́ка]{.ru} 变格。
    第 2、9 题：表示所属用第二格 [кото́рого / кото́рой]{.ru}，放在名词后面，不随 [пе́сни]{.ru} 变：[пе́сни кото́рого, сва́дьба кото́рой]{.ru}。
    第 3、8、10、12 题：性数跟先行词：[у́лица → на кото́рой]{.ru}，[кни́ги → о кото́рых]{.ru}，[студе́нты → с кото́рыми]{.ru}，[ма́льчик → кото́рый]{.ru}。
    第 4 题：[писа́ть кому́]{.ru} 要求第三格：[кото́рым]{.ru}。
    第 5 题：[чита́ть кни́гу]{.ru} 是第四格：[кото́рую]{.ru}。
    第 6、11 题：阳性第四格看动物性：[худо́жник]{.ru} 动物 → [кото́рого]{.ru}；[фильм]{.ru} 非动物 → [кото́рый]{.ru}。
    第 7 题：[жил в до́ме]{.ru}，前置词不能丢：[в кото́ром]{.ru}。
- id: B2-L46-04
  tags:
  - который（句中）
  task: 用 [кото́рый]{.ru} 的适当形式填空，需要时加前置词。
  type: fill
  items:
  - stem: Э́то кафе́, ___ мы ча́сто обе́даем.
    accept:
    - в кото́ром
  - stem: Где ру́чка, ___ я тебе́ дал?
    accept:
    - кото́рую
  - stem: Я позвони́л дру́гу, ___ давно́ не ви́дел.
    accept:
    - кото́рого
  - stem: Вот ребя́та, ___ мы игра́ем в футбо́л.
    accept:
    - с кото́рыми
  - stem: Как зову́т де́вушку, ___ ты помога́л?
    accept:
    - кото́рой
  - stem: Мне понра́вился го́род, ___ ты рассказа́л.
    accept:
    - о кото́ром
  - stem: Э́то сосе́ди, у ___ есть соба́ка.
    accept:
    - кото́рых
  - stem: Я ещё не чита́л письмо́, ___ пришло́ вчера́.
    accept:
    - кото́рое
  - stem: Вот писа́тель, кни́ги ___ я люблю́.
    accept:
    - кото́рого
  - stem: Мы бы́ли на о́зере, ___ нет ры́бы.
    accept:
    - в кото́ром
  - stem: Вот студе́нтка, ___ я дал слова́рь.
    accept:
    - кото́рой
  - stem: Я по́мню день, ___ мы познако́мились.
    accept:
    - в кото́рый
  - stem: Мы живём в до́ме, о́кна ___ выхо́дят в парк.
    accept:
    - кото́рого
  - stem: Где лежа́т кни́ги, ___ ты взял в библиоте́ке?
    accept:
    - кото́рые
  - stem: Э́то худо́жник, ___ рабо́ты мы ви́дели на Арба́те.
    accept:
    - кото́рого
  - stem: Я встре́тил друзе́й, ___ давно́ не ви́дел.
    accept:
    - кото́рых
  - stem: Э́то учи́тель, ___ мы сдава́ли экза́мен.
    accept:
    - кото́рому
  - stem: Я забы́л назва́ние у́лицы, ___ живёт Ди́ма.
    accept:
    - на кото́рой
  - stem: Ты зна́ешь де́вушку, ___ разгова́ривает Пьер?
    accept:
    - с кото́рой
  - stem: Где фо́то, ___ ты мне пока́зывал?
    accept:
    - кото́рые
    - кото́рое
  why: |-
    第 1、10 题：[обе́дать в кафе́, нет ры́бы в о́зере]{.ru}：[в кото́ром]{.ru}。
    第 2 题：[дал ру́чку]{.ru} → 第四格阴性 [кото́рую]{.ru}。
    第 3 题：[не ви́дел дру́га]{.ru} → 第四格动物，同第二格 [кото́рого]{.ru}。
    第 4 题：[игра́ем с ребя́тами]{.ru} → [с кото́рыми]{.ru}。
    第 5 题：[помога́ть де́вушке]{.ru} → 第三格 [кото́рой]{.ru}。
    第 6 题：[рассказа́л о го́роде]{.ru} → [о кото́ром]{.ru}。
    第 7 题：前置词 [у]{.ru} 已给出：[у кото́рых]{.ru}。
    第 8 题：[письмо́ пришло́]{.ru}，从句主语用第一格中性 [кото́рое]{.ru}。
    第 9 题：所属：[кни́ги кото́рого]{.ru}。
    第 11 题：[дал студе́нтке]{.ru} → 第三格阴性 [кото́рой]{.ru}。
    第 12 题：“在那一天”说 [в тот день]{.ru}，前置词 [в]{.ru} + 第四格：[в кото́рый]{.ru}。
    第 13、15 题：所属，放在名词后：[о́кна кото́рого, рабо́ты кото́рого]{.ru}。
    第 14 题：[взял кни́ги]{.ru} → 第四格复数非动物，同第一格 [кото́рые]{.ru}。
    第 16 题：[не ви́дел друзе́й]{.ru} → 第四格复数动物，同第二格 [кото́рых]{.ru}。
    第 17 题：[сдава́ть экза́мен учи́телю]{.ru} → 第三格 [кото́рому]{.ru}。第 18 题：[живёт на у́лице]{.ru} → [на кото́рой]{.ru}。
    第 19 题：[разгова́ривает с де́вушкой]{.ru} → [с кото́рой]{.ru}。第 20 题：[фо́то]{.ru} 在这里指几张照片，复数第四格非动物 [кото́рые]{.ru}；说一张照片用中性 [кото́рое]{.ru}。
