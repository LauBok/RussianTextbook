  why: |-
    [кото́рый]{.ru} 的性数跟先行词，按 [но́вый]{.ru} 变格。
    第 1、3、4、6、9、12 题：阳性、中性：[кото́рого, кото́рому, кото́рым, о кото́ром]{.ru}。第四格：非动物阳性同第一格 [кото́рый]{.ru}（第 1、6 题），动物同第二格 [кото́рого]{.ru}（第 4、12 题），中性 [кото́рое]{.ru}（第 3、9 题）。
    第 2、7、11 题：阴性：第二、三、五、六格都是 [кото́рой]{.ru}，第四格 [кото́рую]{.ru}。[пло́щадь]{.ru} 是阴性。
    第 5、8、10 题：复数：[кото́рых, кото́рым, кото́рыми, о кото́рых]{.ru}；第四格非动物同第一格 [кото́рые]{.ru}（第 8 题），动物同第二格 [кото́рых]{.ru}（第 5、10 题）。
