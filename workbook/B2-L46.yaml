  why: |-
    把 [кото́рый]{.ru} 换回先行词，看它在还原句里是什么格；性数仍跟先行词。
    第 1、4、14 题：前置词放在 [кото́рый]{.ru} 前：[о кото́ром, в кото́ром]{.ru}；第 14 题 [вошли́ в ко́мнату]{.ru} 是第四格：[в кото́рую]{.ru}。
    第 2、7、8、13 题：直接宾语用第四格：阴性 [кото́рую]{.ru}；阳性非动物 [кото́рый]{.ru}（[фильм]{.ru}），动物 [кото́рого]{.ru}（[брат]{.ru}）；中性 [кото́рое]{.ru}。
    第 3、10 题：第三格复数 [кото́рым]{.ru}。
    第 5 题：[с]{.ru} + 第五格复数：[с кото́рыми]{.ru}（不写 [со]{.ru}）。
    第 6、9 题：[у, без]{.ru} + 第二格：[у кото́рой, без кото́рой]{.ru}。
    第 11 题：表示所属，用第二格 [кото́рого]{.ru}，放在名词后面：[пе́сни кото́рого]{.ru}。
    第 12 题：[пе́ред]{.ru} + 第五格：[пе́ред кото́рым]{.ru}。
