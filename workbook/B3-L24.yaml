heading: 第 24 课　人称名词后缀
groups:
- id: B3-L24-01
  lessons:
  - B3-L24
  tags:
  - 人称名词：-чик 与 -щик 的选择
  task: 由下列词构成表示人的名词时，后缀写 [-чик]{.ru} 还是 [-щик]{.ru}？按后缀归栏。
  type: classify
  bins:
  - '[-чик]{.ru}'
  - '[-щик]{.ru}'
  items:
  - text: '[перево́д]{.ru}'
    answer: '[-чик]{.ru}'
    hint: → 翻译（人）
  - text: '[ка́мень]{.ru}'
    answer: '[-щик]{.ru}'
    hint: → 泥瓦匠
  - text: '[лета́ть]{.ru}'
    answer: '[-чик]{.ru}'
    hint: → 飞行员
  - text: '[бараба́н]{.ru}'
    answer: '[-щик]{.ru}'
    new: true
    gloss: 鼓 → 鼓手
  - text: '[рассказа́ть]{.ru}'
    answer: '[-чик]{.ru}'
    hint: → 讲述者
  - text: '[бето́н]{.ru}'
    answer: '[-щик]{.ru}'
    new: true
    gloss: 混凝土 → 混凝土工
  - text: '[груз]{.ru}'
    answer: '[-чик]{.ru}'
    new: true
    gloss: 货物 → 装卸工
  - text: '[фона́рь]{.ru}'
    answer: '[-щик]{.ru}'
    hint: → 点路灯的人
  - text: '[докла́д]{.ru}'
    answer: '[-чик]{.ru}'
    hint: → 报告人
  - text: '[гардеро́б]{.ru}'
    answer: '[-щик]{.ru}'
    new: true
    gloss: 衣帽间 → 衣帽间管理员
  - text: '[зака́з]{.ru}'
    answer: '[-чик]{.ru}'
    hint: → 订货人
  - text: '[убо́рка]{.ru}'
    answer: '[-щик]{.ru}'
    new: true
    gloss: 打扫 → 清洁工
  - text: '[буфе́т]{.ru}'
    answer: '[-чик]{.ru}'
    new: true
    gloss: 小吃部 → 小吃部售货员
  - text: '[сме́на]{.ru}'
    answer: '[-щик]{.ru}'
    new: true
    gloss: 班次 → 接班人
  - text: '[подпи́ска]{.ru}'
    answer: '[-чик]{.ru}'
    new: true
    gloss: 订阅 → 订户
  - text: '[забасто́вка]{.ru}'
    answer: '[-щик]{.ru}'
    new: true
    gloss: 罢工 → 罢工者
  why: |-
    第 1、9、11 题：后缀前是 [д, з]{.ru}：[перево́дчик, докла́дчик, зака́зчик]{.ru}。
    第 3、5、7 题：后缀前是 [т, з]{.ru}：[лета́ть]{.ru} → [лётчик]{.ru}（词根的 [е]{.ru} 变 [ё]{.ru}），[рассказа́ть]{.ru} → [расска́зчик]{.ru}，[груз]{.ru} → [гру́зчик]{.ru}。[зч]{.ru} 读作 [щ]{.ru}，听起来像 [-щик]{.ru}，写的时候要看后缀前的辅音。
    第 13、15 题：[буфе́т]{.ru} → [буфе́тчик]{.ru}；[подпи́ска]{.ru} 去掉 [-ка]{.ru}，后缀前是 [с]{.ru}：[подпи́счик]{.ru}。
    第 2、4、6、8 题：后缀前是 [н, р]{.ru} 等其他辅音，写 [-щик]{.ru}：[ка́менщик, бараба́нщик, бето́нщик, фона́рщик]{.ru}（[ь]{.ru} 去掉）。
    第 10、12、14、16 题：[гардеро́бщик]{.ru}；[убо́рка, сме́на, забасто́вка]{.ru} 去掉 [-ка]{.ru} 或 [-а]{.ru} 后，后缀前是 [р, н, в]{.ru}：[убо́рщик, сме́нщик, забасто́вщик]{.ru}。
- id: B3-L24-02
  lessons:
  - B3-L24
  tags:
  - 人称名词：-ец 的变格
  task: 写出名词的单数第二格、复数第一格和复数第二格。
  type: matrix
  cols:
  - 名词
  - 单数第二格
  - 复数第一格
  - 复数第二格
  given:
  - 0
  rows:
  - base: '[продаве́ц]{.ru}'
    cells:
    - '[продаве́ц]{.ru}'
    - '[продавца́]{.ru}'
    - '[продавцы́]{.ru}'
    - '[продавцо́в]{.ru}'
  - base: '[певе́ц]{.ru}'
    cells:
    - '[певе́ц]{.ru}'
    - '[певца́]{.ru}'
    - '[певцы́]{.ru}'
    - '[певцо́в]{.ru}'
  - base: '[мудре́ц]{.ru}'
    cells:
    - '[мудре́ц]{.ru}'
    - '[мудреца́]{.ru}'
    - '[мудрецы́]{.ru}'
    - '[мудрецо́в]{.ru}'
  - base: '[купе́ц]{.ru}'
    cells:
    - '[купе́ц]{.ru}'
    - '[купца́]{.ru}'
    - '[купцы́]{.ru}'
    - '[купцо́в]{.ru}'
  - base: '[япо́нец]{.ru}'
    cells:
    - '[япо́нец]{.ru}'
    - '[япо́нца]{.ru}'
    - '[япо́нцы]{.ru}'
    - '[япо́нцев]{.ru}'
  - base: '[иностра́нец]{.ru}'
    cells:
    - '[иностра́нец]{.ru}'
    - '[иностра́нца]{.ru}'
    - '[иностра́нцы]{.ru}'
    - '[иностра́нцев]{.ru}'
  - base: '[америка́нец]{.ru}'
    cells:
    - '[америка́нец]{.ru}'
    - '[америка́нца]{.ru}'
    - '[америка́нцы]{.ru}'
    - '[америка́нцев]{.ru}'
    new: true
    gloss: 美国人
  - base: '[кита́ец]{.ru}'
    cells:
    - '[кита́ец]{.ru}'
    - '[кита́йца]{.ru}'
    - '[кита́йцы]{.ru}'
    - '[кита́йцев]{.ru}'
  - base: '[коре́ец]{.ru}'
    cells:
    - '[коре́ец]{.ru}'
    - '[коре́йца]{.ru}'
    - '[коре́йцы]{.ru}'
    - '[коре́йцев]{.ru}'
    new: true
    gloss: 朝鲜人，韩国人
  - base: '[европе́ец]{.ru}'
    cells:
    - '[европе́ец]{.ru}'
    - '[европе́йца]{.ru}'
    - '[европе́йцы]{.ru}'
    - '[европе́йцев]{.ru}'
    new: true
    gloss: 欧洲人
  why: |-
    第 1–4 题：[-ец]{.ru} 变格时 [е]{.ru} 脱落：[продаве́ц]{.ru} → [продавца́]{.ru}；后缀重读的，重音移到词尾，复数第二格是重读的 [-о́в]{.ru}：[продавцо́в, певцо́в, купцо́в]{.ru}。[мудре́ц]{.ru} 的 [е]{.ru} 留着（[мудр-]{.ru} 后面直接接 [ц]{.ru} 读不出来），重音同样移到词尾：[мудреца́, мудрецо́в]{.ru}。
    第 5–7 题：后缀不重读，重音不移：[япо́нца, иностра́нца, америка́нца]{.ru}；[ц]{.ru} 后不重读的复数第二格词尾写 [-ев]{.ru}：[япо́нцев]{.ru}，不写 [япо́нцов]{.ru}。
    第 8–10 题：元音后的 [е]{.ru} 脱落以后写成 [й]{.ru}：[кита́ец]{.ru} → [кита́йца, коре́йца, европе́йца]{.ru}；复数第二格 [й]{.ru} 后写 [-ев]{.ru}：[кита́йцев]{.ru}。
- id: B3-L24-03
