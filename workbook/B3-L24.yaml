    - '[тури́стка]{.ru}'
  - base: '[арти́ст]{.ru}'
    cells:
    - '[арти́ст]{.ru}'
    - '[арти́стка]{.ru}'
  - base: '[футболи́ст]{.ru}'
    cells:
    - '[футболи́ст]{.ru}'
    - '[футболи́стка]{.ru}'
  - base: '[перево́дчик]{.ru}'
    cells:
    - '[перево́дчик]{.ru}'
    - '[перево́дчица]{.ru}'
  - base: '[лётчик]{.ru}'
    cells:
    - '[лётчик]{.ru}'
    - '[лётчица]{.ru}'
  - base: '[продаве́ц]{.ru}'
    cells:
    - '[продаве́ц]{.ru}'
    - '[продавщи́ца]{.ru}'
  - base: '[певе́ц]{.ru}'
    cells:
    - '[певе́ц]{.ru}'
    - '[певи́ца]{.ru}'
  - base: '[кита́ец]{.ru}'
    cells:
    - '[кита́ец]{.ru}'
    - '[китая́нка]{.ru}'
  - base: '[специали́ст]{.ru}'
    cells:
    - '[специали́ст]{.ru}'
    - —
  - base: '[иссле́дователь]{.ru}'
    cells:
    - '[иссле́дователь]{.ru}'
    - —
  - base: '[ка́менщик]{.ru}'
    cells:
    - '[ка́менщик]{.ru}'
    - —
  why: |-
    第 1–3 题：[-тель]{.ru} 名词加 [-ница]{.ru}：[писа́тельница, преподава́тельница, чита́тельница]{.ru}，重音不动。
    第 4–7 题：[-ист]{.ru} 名词加 [-ка]{.ru}：[журнали́стка, тури́стка, арти́стка, футболи́стка]{.ru}。
    第 8、9 题：[-чик]{.ru} 换成 [-чица]{.ru}：[перево́дчица, лётчица]{.ru}。
    第 10–12 题：[-ец]{.ru} 名词的阴性要逐个记：[продавщи́ца, певи́ца, китая́нка]{.ru}。
    第 13–15 题：[специали́ст, иссле́дователь, ка́менщик]{.ru} 没有通用的阴性形式，指女性时也用阳性，过去时谓语用阴性：[Специали́ст А́нна Петро́ва пришла́]{.ru}。
