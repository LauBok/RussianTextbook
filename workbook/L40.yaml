  why: '第 2、5 题：元音脱落：[ры́нок → ры́нка]{.ru}，[оте́ц → отца́]{.ru}。

    第 1、7 题：[-ия]{.ru} 改 [-ии]{.ru}；第 11 题：[-ь]{.ru} 结尾的阴性名词改 [-и]{.ru}。

    第 3、10 题：修饰语 [-ого]{.ru}：[де́тского, медици́нского]{.ru}；第 13 题阴性 [твое́й]{.ru}。

    第 8 题：[дя́дя]{.ru} 是阳性，[моего́ дя́ди]{.ru}；第 14 题 [её]{.ru} 不变。

    第 6、16 题：第三人称代词在前置词后加 [н-]{.ru}。

    第 15 题：[вре́мя]{.ru} 变格特殊，第二格是 [вре́мени]{.ru}；[не́ было]{.ru} 不变。'
- id: L40-03
  lessons:
  - L31
  - L32
  - L33
  - L35
  - L36
  tags:
  - 复习：第二格用途关系标注
  task: 句中第二格表示什么？按用途归类（每句只有一个第二格）。
  type: classify
  bins:
  - 拥有者
  - 否定
  - 所属
  - 来源
  - 数量
  items:
  - text: '[У Ка́ти есть соба́ка.]{.ru}'
    answer: 拥有者
  - text: '[В гру́ппе два кита́йца.]{.ru}'
    answer: 数量
  - text: '[Здесь нет ры́нка.]{.ru}'
    answer: 否定
  - text: '[Ю́ми из То́кио.]{.ru}'
    answer: 来源
  - text: '[Э́то ко́мната бра́та.]{.ru}'
    answer: 所属
  - text: '[У меня́ три сестры́.]{.ru}'
    answer: 数量
  - text: '[Вчера́ не́ было ле́кции.]{.ru}'
    answer: 否定
  - text: '[Мы е́дем с ры́нка.]{.ru}'
    answer: 来源
  - text: '[Я люблю́ го́лос Ви́ктора Цо́я.]{.ru}'
    answer: 所属
  - text: '[У де́душки большо́й сад.]{.ru}'
    answer: 拥有者
  - text: '[Ско́лько челове́к в гру́ппе?]{.ru}'
    answer: 数量
  - text: '[Здесь нет интерне́та.]{.ru}'
    answer: 否定
  - text: '[Хосе́ с Ку́бы.]{.ru}'
    answer: 来源
  - text: '[Где маши́на па́пы?]{.ru}'
    answer: 所属
  - text: '[У тебя́ есть брат?]{.ru}'
    answer: 拥有者
  why: '第 1、10、15 题：[у]{.ru} + 第二格表示拥有者。

    第 3、7、12 题：[нет / не́ было]{.ru} + 第二格，表示没有或不存在。

    第 5、9、14 题：第二格放在名词后面表示“谁的”。

    第 4、8、13 题：[из / с]{.ru} + 第二格表示来源；第 4 题 [То́кио]{.ru} 不变格。

    第 2、6、11 题：数词和 [ско́лько]{.ru} 后面的名词用第二格，表示数量；[челове́к]{.ru} 在 [ско́лько]{.ru} 后用复数第二格。'
- id: L40-04
  lessons:
  - L38
  tags:
  - 复习：-ся 动词人称核查
  task: 写出带 [-ся]{.ru} 动词的现在时和阴性过去时。
  type: matrix
  cols:
  - 主语 + 动词
  - 现在时
  - 过去时（阴性）
  rows:
  - base: '[я + учи́ться]{.ru}'
    cells:
    - '[я + учи́ться]{.ru}'
    - '[учу́сь]{.ru}'
    - '[учи́лась]{.ru}'
  - base: '[ты + занима́ться]{.ru}'
    cells:
    - '[ты + занима́ться]{.ru}'
    - '[занима́ешься]{.ru}'
    - '[занима́лась]{.ru}'
  - base: '[она́ + возвраща́ться]{.ru}'
    cells:
    - '[она́ + возвраща́ться]{.ru}'
    - '[возвраща́ется]{.ru}'
    - '[возвраща́лась]{.ru}'
  - base: '[вы + учи́ться]{.ru}'
    cells:
    - '[вы + учи́ться]{.ru}'
    - '[у́читесь]{.ru}'
    - '[учи́лись]{.ru}'
  - base: '[они́ + занима́ться]{.ru}'
    cells:
    - '[они́ + занима́ться]{.ru}'
    - '[занима́ются]{.ru}'
    - '[занима́лись]{.ru}'
  - base: '[шко́ла + находи́ться]{.ru}'
    cells:
    - '[шко́ла + находи́ться]{.ru}'
    - '[нахо́дится]{.ru}'
    - '[находи́лась]{.ru}'
  - base: '[ле́кция + начина́ться]{.ru}'
    cells:
    - '[ле́кция + начина́ться]{.ru}'
    - '[начина́ется]{.ru}'
    - '[начина́лась]{.ru}'
  - base: '[мы + возвраща́ться]{.ru}'
    cells:
    - '[мы + возвраща́ться]{.ru}'
    - '[возвраща́емся]{.ru}'
    - '[возвраща́лись]{.ru}'
  why: '第 1、4 题：[учу́сь]{.ru}（[ч]{.ru} 后写 [у]{.ru}），[у́читесь]{.ru}（元音后 [-сь]{.ru}）。

    第 2、3、5、8 题：第一变位加 [-ся / -сь]{.ru}：[занима́ешься, возвраща́ется, возвраща́емся]{.ru}。

    第 6 题：[нахо́дится]{.ru}，重音在词干。

    第 4、5、8 题：主语是复数（[вы]{.ru} 也按复数），过去时用 [-лись]{.ru}。'
