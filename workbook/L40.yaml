    - '[пятьдеся́т оди́н рубль]{.ru}'
  - base: '[4 + год]{.ru}'
    cells:
    - '[4 + год]{.ru}'
    - '[четы́ре го́да]{.ru}'
  - base: '[10 + мину́та]{.ru}'
    cells:
    - '[10 + мину́та]{.ru}'
    - '[де́сять мину́т]{.ru}'
  - base: '[1 + дочь]{.ru}'
    cells:
    - '[1 + дочь]{.ru}'
    - '[одна́ дочь]{.ru}'
  - base: '[23 + челове́к]{.ru}'
    cells:
    - '[23 + челове́к]{.ru}'
    - '[два́дцать три челове́ка]{.ru}'
  - base: '[2 + слова́рь]{.ru}'
    cells:
    - '[2 + слова́рь]{.ru}'
    - '[два словаря́]{.ru}'
  - base: '[14 + рубль]{.ru}'
    cells:
    - '[14 + рубль]{.ru}'
    - '[четы́рнадцать рубле́й]{.ru}'
  - base: '[3 + год]{.ru}'
