  - base: '[о́коло + де́тский сад]{.ru}'
    cells:
    - '[о́коло + де́тский сад]{.ru}'
    - '[о́коло де́тского са́да]{.ru}'
  - base: '[по́сле + уро́к]{.ru}'
    cells:
