    - '[наш врач]{.ru}'
    - '[на́шего врача́]{.ru}'
    - '[на́шего врача́]{.ru}'
    - '[на́шем враче́]{.ru}'
  - base: '[э́тот го́род]{.ru}'
    cells:
    - '[э́тот го́род]{.ru}'
    - '[э́того го́рода]{.ru}'
    - '[э́тот го́род]{.ru}'
    - '[э́том го́роде]{.ru}'
  - base: '[твоё фо́то]{.ru}'
    cells:
    - '[твоё фо́то]{.ru}'
    - '[твоего́ фо́то]{.ru}'
    - '[твоё фо́то]{.ru}'
    - '[твоём фо́то]{.ru}'
  - base: '[ва́ша подру́га]{.ru}'
    cells:
    - '[ва́ша подру́га]{.ru}'
    - '[ва́шей подру́ги]{.ru}'
    - '[ва́шу подру́гу]{.ru}'
    - '[ва́шей подру́ге]{.ru}'
  - base: '[мой брат]{.ru}'
    cells:
    - '[мой брат]{.ru}'
    - '[моего́ бра́та]{.ru}'
    - '[моего́ бра́та]{.ru}'
    - '[моём бра́те]{.ru}'
  - base: '[э́та пло́щадь]{.ru}'
    cells:
    - '[э́та пло́щадь]{.ru}'
    - '[э́той пло́щади]{.ru}'
    - '[э́ту пло́щадь]{.ru}'
    - '[э́той пло́щади]{.ru}'
  - base: '[на́ше зда́ние]{.ru}'
    cells:
    - '[на́ше зда́ние]{.ru}'
    - '[на́шего зда́ния]{.ru}'
    - '[на́ше зда́ние]{.ru}'
    - '[на́шем зда́нии]{.ru}'
  - base: '[си́няя ла́мпа]{.ru}'
    cells:
    - '[си́няя ла́мпа]{.ru}'
    - '[си́ней ла́мпы]{.ru}'
    - '[си́нюю ла́мпу]{.ru}'
    - '[си́ней ла́мпе]{.ru}'
  - base: '[наш де́душка]{.ru}'
    cells:
    - '[наш де́душка]{.ru}'
    - '[на́шего де́душки]{.ru}'
    - '[на́шего де́душку]{.ru}'
    - '[на́шем де́душке]{.ru}'
  why: '第 2、6、10 题：阳性动物名词第四格同第二格：[на́шего врача́, моего́ бра́та]{.ru}；[врач]{.ru} 加词尾后重音在词尾。第 10 题 [де́душка]{.ru} 名词按 [-а]{.ru} 变（[де́душки, де́душку, де́душке]{.ru}），修饰语按阳性变。

    第 3、4、8 题：非动物阳性、中性第四格同第一格；第 4 题 [фо́то]{.ru} 不变格，只有修饰语变；第 8 题 [-ие]{.ru}：第二格 [-ия]{.ru}，第六格 [-ии]{.ru}。

    第 1、5、9 题：阴性第二格修饰语 [-ой / -ей]{.ru}、名词 [-ы / -и]{.ru}；第四格修饰语 [мою́, ва́шу, си́нюю]{.ru}、名词 [-у]{.ru}；第六格修饰语同第二格，名词 [-е]{.ru}：[сестры́ / сестре́]{.ru}。

    第 7 题：[-ь]{.ru} 结尾的阴性名词第二格、第六格都是 [-и]{.ru}，第四格同第一格，修饰语仍变 [э́ту]{.ru}。'
