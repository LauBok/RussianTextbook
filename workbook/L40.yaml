    - '[напро́тив ста́нции]{.ru}'
  - base: '[маши́на + мой дя́дя]{.ru}'
    cells:
    - '[маши́на + мой дя́дя]{.ru}'
    - '[маши́на моего́ дя́ди]{.ru}'
  - base: '[нет + интерне́т]{.ru}'
    cells:
    - '[нет + интерне́т]{.ru}'
    - '[нет интерне́та]{.ru}'
  - base: '[до + медици́нский институ́т]{.ru}'
    cells:
    - '[до + медици́нский институ́т]{.ru}'
    - '[до медици́нского институ́та]{.ru}'
  - base: '[из + Каза́нь]{.ru}'
    cells:
    - '[из + Каза́нь]{.ru}'
    - '[из Каза́ни]{.ru}'
  - base: '[с + рабо́та]{.ru}'
    cells:
    - '[с + рабо́та]{.ru}'
