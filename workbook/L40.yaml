    第 1、3、5、8、9、11 题：2–4 后用单数第二格：[две сестры́, четы́ре го́да, два словаря́]{.ru}。

    第 2、6、10 题：5 以上和 11–14 用复数第二格：[восемна́дцать лет, де́сять мину́т, четы́рнадцать рубле́й]{.ru}。'
- id: L40-06
  lessons:
  - L24
  - L32
  - L33
  - L37
  tags:
  - 复习：句中第二、四、六格辨别
  task: 同一个词组在不同句子里：按动词或前置词的要求变格。
  type: fill
  items:
  - stem: У меня́ нет ___.
    hint: ста́ршая сестра́
    accept:
    - ста́ршей сестры́
  - stem: Я жду ___.
    hint: ста́ршая сестра́
    accept:
    - ста́ршую сестру́
  - stem: Я ду́маю о ___.
    hint: ста́ршая сестра́
    accept:
    - ста́ршей сестре́
  - stem: Э́то кни́га ___.
    hint: наш учи́тель
    accept:
    - на́шего учи́теля
  - stem: Мы хорошо́ зна́ем ___.
    hint: наш учи́тель
    accept:
    - на́шего учи́теля
  - stem: Мы говори́м о ___.
    hint: наш учи́тель
    accept:
    - на́шем учи́теле
  - stem: Апте́ка напро́тив ___.
    hint: э́тот музе́й
    accept:
    - э́того музе́я
  - stem: Мы идём в ___.
    hint: э́тот музе́й
    accept:
    - э́тот музе́й
  - stem: Мы бы́ли в ___.
    hint: э́тот музе́й
    accept:
    - э́том музе́е
  - stem: Он из ___.
    hint: ма́ленький го́род
    accept:
    - ма́ленького го́рода
  - stem: Он лю́бит ___.
    hint: ма́ленький го́род
    accept:
    - ма́ленький го́род
  - stem: Он живёт в ___.
    hint: ма́ленький го́род
    accept:
    - ма́леньком го́роде
  why: '第 1、4、7、10 题：[нет]{.ru}、所属、[напро́тив]{.ru}、[из]{.ru} 要求第二格。

    第 2、5、8、11 题：动词宾语和去向用第四格；第 5 题 [учи́тель]{.ru} 是动物名词，第四格同第二格；第 8、11 题非动物阳性同第一格。

    第 3、6、9、12 题：[о]{.ru} 和表示处所的 [в]{.ru} 要求第六格。第 1 题和第 3 题修饰语同形，名词词尾不同：[сестры́ / сестре́]{.ru}。'
