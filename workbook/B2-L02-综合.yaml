  - stem: У Ми́ши нет ___.
    hint: ша́хматы
    accept:
    - ша́хмат
  - stem: У Ива́на Серге́евича нет ___.
    hint: сестра́
    accept:
    - сестёр
  - stem: В тетра́ди мно́го ___.
    hint: упражне́ние
    accept:
    - упражне́ний
  - stem: В на́шем райо́не мно́го ___.
    hint: общежи́тие
    accept:
    - общежи́тий
  - stem: В э́той ко́мнате нет ___.
    hint: окно́
    accept:
    - о́кон
  - stem: В па́рке мно́го ___ и ма́льчиков.
    hint: де́вочка
    accept:
    - де́вочек
  - stem: Сего́дня у нас нет ___.
    hint: семина́р
    accept:
    - семина́ров
  - stem: В на́шем го́роде мно́го ___.
    hint: гости́ница
    accept:
    - гости́ниц
    new: true
    gloss: 宾馆
  - stem: У э́того студе́нта нет ___.
    hint: конспе́кт
    accept:
    - конспе́ктов
  - stem: В на́шей библиоте́ке мно́го ___.
    hint: слова́рь
