  why: |-
    第 1、4 题：要逐个记的词：[сестёр, о́кон]{.ru}。[сестёр]{.ru} 插入的元音写 [ё]{.ru}，重音在这个 [ё]{.ru} 上。
    第 2、25 题：复数第一格重音在词尾，复数第二格也在词尾：[городо́в, столо́в]{.ru}。
    第 3、20 题：[ь]{.ru} 的位置变成 [е]{.ru}：[пи́сем, семе́й]{.ru}。
    第 5、17 题：例外：[мо́ре → море́й]{.ru}，[дя́дя → дя́дей]{.ru}，不是零词尾。
    第 6、7、21、22 题：隐现元音：[студе́нток, коро́бок]{.ru} 插 [о]{.ru}，[де́вушек, ру́чек, де́вочек]{.ru} 插 [е]{.ru}。
    第 8、9、24 题：[-й]{.ru} 和非重读 [-ц]{.ru} 用 [-ев]{.ru}：[музе́ев, ме́сяцев, трамва́ев]{.ru}。
    第 10、18 题：脱落的元音不出现：[отцо́в, пода́рков]{.ru}。
    第 11、19、23、26 题：[-ь]{.ru} 和 [ч]{.ru} 结尾用 [-ей]{.ru}：[веще́й, словаре́й, враче́й, госте́й]{.ru}，重音都在词尾。
    第 12、15、16 题：零词尾：[неде́ль, слов, мест]{.ru}。
    第 13、14 题：[-ия, -ие]{.ru} 变 [-ий]{.ru}：[ле́кций, зда́ний]{.ru}。
