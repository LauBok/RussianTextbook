  why: |-
    第 1、2、8、18、20 题：硬辅音加 [-ов]{.ru}：[теа́тров, магази́нов, экза́менов, семина́ров, конспе́ктов]{.ru}。
    第 3、5、6、17 题：隐现元音：[де́вушек, ру́чек, де́вочек]{.ru} 插 [е]{.ru}，[таре́лок]{.ru} 插 [о]{.ru}。
    第 4 题：[-й]{.ru} 用 [-ев]{.ru}：[трамва́ев]{.ru}。
    第 7、19 题：[-а]{.ru} 去尾：[маши́н, гости́ниц]{.ru}。
    第 9、14、15 题：[-ия, -ие]{.ru} 变 [-ий]{.ru}：[фотогра́фий, упражне́ний, общежи́тий]{.ru}。
    第 10、21 题：[-ь]{.ru} 用 [-ей]{.ru}：[покупа́телей, словаре́й]{.ru}。
    第 11 题：例外：[море́й]{.ru}。
    第 12 题：只有复数的 [ша́хматы]{.ru} 是零词尾：[ша́хмат]{.ru}。
    第 13 题：[сестёр]{.ru}：插入 [ё]{.ru}。
    第 16 题：[окно́ → о́кон]{.ru} 要逐个记：插入 [о]{.ru}，重音移到词干。
