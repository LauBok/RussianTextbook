    cells:
    - '[нет тётев]{.ru}'
    - '[тётей]{.ru}'
  why: |-
    第 1、6 题：[-а, -я]{.ru} 结尾的名词是零词尾：[книг, неде́ль]{.ru}，不加 [-ов]{.ru} 或 [-ей]{.ru}。
    第 2、10 题：零词尾加隐现元音：[студе́нток, оши́бок]{.ru}，不加 [-ов]{.ru}。
    第 3、5 题：[-й]{.ru} 和非重读 [-ц]{.ru} 用 [-ев]{.ru}：[музе́ев, ме́сяцев]{.ru}。
    第 4、20 题：例外：[море́й, тётей]{.ru}。
    第 7、8 题：[-ия, -ие]{.ru} 的复数第二格是 [-ий]{.ru}：[ле́кций, зда́ний]{.ru}；[зда́нии]{.ru} 是单数第六格。
    第 9 题：[письмо́]{.ru} 零词尾，[ь]{.ru} 变 [е]{.ru}：[пи́сем]{.ru}。
    第 11 题：[е]{.ru} 脱落，重读 [-о́в]{.ru}：[отцо́в]{.ru}。
    第 12、13 题：[-ь]{.ru} 结尾用 [-ей]{.ru}：[словаре́й, веще́й]{.ru}。
    第 14 题：[сестра́]{.ru} 的复数第二格要插入 [ё]{.ru}：[сестёр]{.ru}。
    第 15、16 题：只有复数的名词要逐个记：[ша́хмат, де́нег]{.ru}。
    第 17、18 题：数词后面的 [челове́к, раз]{.ru} 不加词尾：[пять челове́к, пять раз]{.ru}。
    第 19 题：[дома́]{.ru} 重音在词尾，复数第二格也在词尾：[домо́в]{.ru}。
