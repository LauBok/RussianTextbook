  why: '第 1、5、8、11、14 题：阳性 [бо́лен, здоро́в]{.ru}，过去时 [был]{.ru}。第 2、4、7、12、15、16 题：阴性 [больна́, здоро́ва]{.ru}，过去时 [была́]{.ru}。第 3、6、9、10、13 题：复数 [больны́, здоро́вы]{.ru}，过去时 [бы́ли]{.ru}；[вы]{.ru} 用复数。

    重音：[бо́лен]{.ru} 在词干，[больна́, больны́]{.ru} 在词尾；[здоро́в]{.ru} 的各形式重音都在 [-ро́-]{.ru}。将来时 [быть]{.ru} 随人称变：[бу́ду, бу́дешь, бу́дет, бу́дем, бу́дете, бу́дут]{.ru}。'
- id: L84-04
  tags:
  - потому́ что / поэ́тому：同一因果的两种说法
  task: 已知原因和结果，分别用 [потому́ что]{.ru} 和 [поэ́тому]{.ru} 各写一句。
  type: matrix
  cols:
  - 原因 → 结果
  - 结果在前：[потому́ что]{.ru}
  - 原因在前：[поэ́тому]{.ru}
  given:
  - 0
  rows:
  - base: '[шёл дождь → я был до́ма]{.ru}'
    cells:
    - '[шёл дождь → я был до́ма]{.ru}'
    - '[Я был до́ма, потому́ что шёл дождь.]{.ru}'
    - '[Шёл дождь, поэ́тому я был до́ма.]{.ru}'
  - base: '[Ван Лэй был бо́лен → он не́ был на уро́ке]{.ru}'
    cells:
    - '[Ван Лэй был бо́лен → он не́ был на уро́ке]{.ru}'
    - '[Ван Лэй не́ был на уро́ке, потому́ что был бо́лен.]{.ru}'
    - '[Ван Лэй был бо́лен, поэ́тому не́ был на уро́ке.]{.ru}'
  - base: '[Ми́ша оди́н → ему́ ску́чно]{.ru}'
    cells:
    - '[Ми́ша оди́н → ему́ ску́чно]{.ru}'
    - '[Ми́ше ску́чно, потому́ что он оди́н.]{.ru}'
    - '[Ми́ша оди́н, поэ́тому ему́ ску́чно.]{.ru}'
  - base: '[в Москве́ про́бки → па́па опозда́л]{.ru}'
    cells:
    - '[в Москве́ про́бки → па́па опозда́л]{.ru}'
    - '[Па́па опозда́л, потому́ что в Москве́ про́бки.]{.ru}'
    - '[В Москве́ про́бки, поэ́тому па́па опозда́л.]{.ru}'
  - base: '[А́нна больна́ → она́ до́ма]{.ru}'
    cells:
    - '[А́нна больна́ → она́ до́ма]{.ru}'
    - '[А́нна до́ма, потому́ что она́ больна́.]{.ru}'
    - '[А́нна больна́, поэ́тому она́ до́ма.]{.ru}'
  - base: '[на у́лице хо́лодно → Ми́ша наде́л ку́ртку]{.ru}'
    cells:
    - '[на у́лице хо́лодно → Ми́ша наде́л ку́ртку]{.ru}'
    - '[Ми́ша наде́л ку́ртку, потому́ что на у́лице хо́лодно.]{.ru}'
    - '[На у́лице хо́лодно, поэ́тому Ми́ша наде́л ку́ртку.]{.ru}'
  - base: '[Ю́ми мно́го рабо́тает → она́ устаёт]{.ru}'
    cells:
    - '[Ю́ми мно́го рабо́тает → она́ устаёт]{.ru}'
    - '[Ю́ми устаёт, потому́ что мно́го рабо́тает.]{.ru}'
    - '[Ю́ми мно́го рабо́тает, поэ́тому устаёт.]{.ru}'
  - base: '[мне нужна́ спра́вка → я иду́ в декана́т]{.ru}'
    cells:
    - '[мне нужна́ спра́вка → я иду́ в декана́т]{.ru}'
    - '[Я иду́ в декана́т, потому́ что мне нужна́ спра́вка.]{.ru}'
    - '[Мне нужна́ спра́вка, поэ́тому я иду́ в декана́т.]{.ru}'
  - base: '[у меня́ не́ было вре́мени → я не позвони́л]{.ru}'
    cells:
    - '[у меня́ не́ было вре́мени → я не позвони́л]{.ru}'
    - '[Я не позвони́л, потому́ что у меня́ не́ было вре́мени.]{.ru}'
    - '[У меня́ не́ было вре́мени, поэ́тому я не позвони́л.]{.ru}'
  - base: '[Ми́ша заболе́л → он лежи́т в посте́ли]{.ru}'
    cells:
    - '[Ми́ша заболе́л → он лежи́т в посте́ли]{.ru}'
    - '[Ми́ша лежи́т в посте́ли, потому́ что заболе́л.]{.ru}'
    - '[Ми́ша заболе́л, поэ́тому лежи́т в посте́ли.]{.ru}'
  - base: '[за́втра бу́дет снег → мы пое́дем на метро́]{.ru}'
    cells:
    - '[за́втра бу́дет снег → мы пое́дем на метро́]{.ru}'
    - '[Мы пое́дем на метро́, потому́ что за́втра бу́дет снег.]{.ru}'
    - '[За́втра бу́дет снег, поэ́тому мы пое́дем на метро́.]{.ru}'
  - base: '[ба́бушка больна́ → мы е́дем к ней]{.ru}'
    cells:
    - '[ба́бушка больна́ → мы е́дем к ней]{.ru}'
    - '[Мы е́дем к ба́бушке, потому́ что она́ больна́.]{.ru}'
    - '[Ба́бушка больна́, поэ́тому мы е́дем к ней.]{.ru}'
  why: |-
    第 1–12 题：用 [потому́ что]{.ru} 时先说结果，再说原因；用 [поэ́тому]{.ru} 时先说原因，再说结果。两句意思相同，一句里只用一个连接词。
    第 2、3、5、7、10 题：后一部分主语和前一部分相同时可以省去（[потому́ что был бо́лен]{.ru}）；也可以保留代词（[потому́ что он был бо́лен]{.ru}），同样正确。第 3 题“米沙寂寞”要说 [Ми́ше ску́чно]{.ru}，感受的人用第三格。第 9 题已经过去的事要用过去时 [не́ было]{.ru}，[не́ было]{.ru} 重音在 [не]{.ru} 上。
    第 12 题：结果在前时，第一次出现的人要用名词：[Мы е́дем к ба́бушке, потому́ что она́ больна́]{.ru}；原因在前时后面用代词 [к ней]{.ru}。
