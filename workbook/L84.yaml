heading: 第 84 课　потому́ что / поэ́тому；бо́лен / здоро́в
groups:
- id: L84-01
  tags:
  - потому́ что / поэ́тому：原因与结果的位置
  task: 判断原因在前还是在后。
  type: classify
  bins:
  - 原因在前，结果在后
  - 结果在前，原因在后
  items:
  - text: Я до́ма, потому́ что идёт дождь.
    answer: 结果在前，原因在后
  - text: Идёт дождь, поэ́тому я до́ма.
    answer: 原因在前，结果在后
  - text: Ван Лэй не́ был на уро́ке, потому́ что был бо́лен.
    answer: 结果在前，原因在后
  - text: Мари́я Никола́евна — врач, поэ́тому она́ всё зна́ет.
    answer: 原因在前，结果在后
  - text: Он оди́н, поэ́тому ему́ ску́чно.
    answer: 原因在前，结果在后
  - text: Ему́ ску́чно, потому́ что он оди́н.
    answer: 结果在前，原因在后
  - text: А́нна была́ больна́. Поэ́тому она́ не пошла́ в университе́т.
    answer: 原因在前，结果在后
  - text: — Почему́ ты не позвони́л? — Потому́ что у меня́ не́ было вре́мени.
    answer: 结果在前，原因在后
  - text: Ю́ми устаёт, поэ́тому ра́но ложи́тся спать.
    answer: 原因在前，结果在后
  - text: Пьер взял спра́вку, потому́ что не́ был на заня́тиях.
    answer: 结果在前，原因在后
  - text: В Москве́ бы́ли про́бки, поэ́тому па́па опозда́л.
    answer: 原因在前，结果在后
  - text: Ми́ша не сде́лал дома́шнее зада́ние, потому́ что до́лго игра́л в футбо́л.
    answer: 结果在前，原因在后
  - text: Сего́дня хо́лодно, поэ́тому наде́нь ку́ртку.
    answer: 原因在前，结果在后
  - text: Я пошёл в декана́т, потому́ что мне нужна́ спра́вка.
    answer: 结果在前，原因在后
  - text: Ба́бушка живёт одна́, поэ́тому мы ча́сто е́здим к ней.
    answer: 原因在前，结果在后
  - text: Ван Лэй хорошо́ говори́т по-ру́сски, потому́ что мно́го занима́ется.
    answer: 结果在前，原因在后
  why: '第 2、4、5、7、9、11、13、15 题：[поэ́тому]{.ru}（所以）引出结果，它前面的部分是原因。第 7 题 [поэ́тому]{.ru} 在句号后开始新句，关系相同。

    第 1、3、6、8、10、12、14、16 题：[потому́ что]{.ru}（因为）引出原因，它前面的部分是结果。第 8 题回答 [почему́]{.ru}，只说原因从句，问句里的“没打电话”是结果。'
- id: L84-02
  tags:
  - потому́ что / поэ́тому：连接方向核查
  task: 判断句子是否正确。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Я был до́ма, потому́ что шёл дождь.
    answer: 正确
  - text: Потому́ что шёл дождь, поэ́тому я был до́ма.
    answer: 有错
  - text: Шёл дождь, поэ́тому я был до́ма.
    answer: 正确
  - text: Я был до́ма, поэ́тому шёл дождь.
    answer: 有错
  - text: Ван Лэй был бо́лен, потому́ что не́ был на уро́ке.
    answer: 有错
  - text: Ван Лэй был бо́лен, поэ́тому не́ был на уро́ке.
    answer: 正确
  - text: Мне ску́чно, потому́ что я оди́н.
    answer: 正确
  - text: Я оди́н, потому́ что мне ску́чно.
    answer: 有错
  - text: Пьер не пошёл в кино́, потому́ что был бо́лен.
    answer: 正确
  - text: Потому́ что А́нна больна́, поэ́тому она́ до́ма.
    answer: 有错
  - text: На у́лице хо́лодно, поэ́тому Ми́ша наде́л ку́ртку.
    answer: 正确
  - text: Ми́ша наде́л ку́ртку, поэ́тому на у́лице хо́лодно.
    answer: 有错
  - text: Ю́ми устаёт, потому́ что мно́го рабо́тает.
    answer: 正确
  - text: Ю́ми мно́го рабо́тает, потому́ что устаёт.
    answer: 有错
  - text: Мари́я Никола́евна — врач, поэ́тому она́ всё зна́ет.
    answer: 正确
  - text: Я не позвони́л тебе́, поэ́тому у меня́ не́ было вре́мени.
    answer: 有错
  why: '第 1、3、6、7、9、11、13、15 题：方向正确：[потому́ что]{.ru} 后面是原因，[поэ́тому]{.ru} 后面是结果。

    第 2、10 题：[потому́ что]{.ru} 和 [поэ́тому]{.ru} 同时出现，这是照搬汉语“因为……所以……”。只能二选一：[Шёл дождь, поэ́тому я был до́ма.]{.ru} 或 [Я был до́ма, потому́ что шёл дождь.]{.ru}

    第 4、5、8、12、14、16 题：方向反了，把结果当成了原因。例如第 4 题“我在家”不能是“下雨”的原因，应说 [Я был до́ма, потому́ что шёл дождь.]{.ru}；第 16 题应说 […, потому́ что у меня́ не́ было вре́мени.]{.ru}'
- id: L84-03
  tags:
