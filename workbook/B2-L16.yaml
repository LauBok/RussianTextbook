- id: B2-L16-04
  tags:
  - 不规则复数：句中
  task: 用括号里的词的复数形式填空。
  type: fill
  items:
  - stem: У меня́ нет ни ___, ни сестёр.
    hint: брат
    accept:
    - бра́тьев
  - stem: Мари́я Никола́евна лю́бит рабо́тать с ___.
    hint: лю́ди
    accept:
    - людьми́
  - stem: Ми́ша игра́л в футбо́л с ___.
    hint: друг
    accept:
    - друзья́ми
  - stem: В ко́мнате не хвата́ло ___.
    hint: стул
    accept:
    - сту́льев
  - stem: Ба́бушка ча́сто расска́зывает о ___.
    hint: сын
    accept:
    - сыновья́х
  - stem: На пра́зднике бы́ли ма́тери с ___.
    hint: дочь
    accept:
    - дочерьми́
  - stem: Мы до́лго гуля́ли под ___.
    hint: де́рево
    accept:
    - дере́вьями
  - stem: Учи́тельница говори́ла с ___ ученико́в.
    hint: мать
    accept:
    - матеря́ми
  - stem: У на́ших сосе́дей тро́е ___.
    hint: ребёнок
    accept:
    - дете́й
  - stem: Дя́дя Пе́тя пригласи́л ___ на юбиле́й.
    hint: сосе́д
    accept:
    - сосе́дей
  - stem: Ле́том мы е́здили к ___.
    hint: друг
    accept:
    - друзья́м
  - stem: В Москве́ живёт мно́го ___.
    hint: челове́к
    accept:
    - люде́й
  why: |-
    第 1、4、7 题：[-ья]{.ru} 不重读：第二格 [бра́тьев, сту́льев]{.ru}；第五格 [дере́вьями]{.ru}。
    第 2、9、12 题：[челове́к, ребёнок]{.ru} 的复数是 [лю́ди, де́ти]{.ru}：[людьми́, дете́й, люде́й]{.ru}。
    第 3、5、11 题：[друг → друзья́, сын → сыновья́]{.ru}：[с друзья́ми, о сыновья́х, к друзья́м]{.ru}。
    第 6、8 题：[мать, дочь]{.ru} 复数带 [-ер-]{.ru}：[с матеря́ми, с дочерьми́]{.ru}。
    第 10 题：动物名词第四格同第二格：[сосе́дей]{.ru}。
