  why: |-
    第 1 题：[-ья]{.ru} 词尾不重读：第二格 [-ьев]{.ru}；动物名词第四格同第二格：[бра́тьев]{.ru}。
    第 2、3 题：非动物名词第四格同第一格：[сту́лья, дере́вья]{.ru}；第二格 [сту́льев, дере́вьев]{.ru}。
    第 4、5 题：[-ья́]{.ru} 词尾重读：第二格 [-е́й]{.ru}：[друзе́й, сынове́й]{.ru}；其余格在 [друзь-, сыновь-]{.ru} 上加 [-ям, -ями, -ях]{.ru}。
    第 6、7 题：[люде́й, дете́й]{.ru}；第五格 [-ьми́]{.ru} 重音在词尾：[людьми́, детьми́]{.ru}。
    第 8 题：[сестёр]{.ru} 插 [ё]{.ru}；其余格照 [сёстры]{.ru}。
    第 9 题：[мать]{.ru} 的复数各格都带 [-ер-]{.ru}，第二格以后重音在词尾：[матере́й, матеря́м, матеря́ми]{.ru}。
    第 10 题：[до́чери]{.ru} 同 [ма́тери]{.ru}，只是第五格常用 [дочерьми́]{.ru}。
    第 11 题：[сосе́ди]{.ru} 复数按软变化：[сосе́дей, сосе́дям]{.ru}，重音不动。
- id: B2-L16-02
  tags:
  - 不规则复数第二格：判断
  task: 按复数第二格的形式归类，不写形式。
  type: classify
  bins:
  - '[-ьев]{.ru}'
  - '[-ей]{.ru}'
  - 零词尾
  - 带 [-ер-]{.ru}
  items:
  - text: '[бра́тья]{.ru}'
    answer: '[-ьев]{.ru}'
  - text: '[друзья́]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[сёстры]{.ru}'
    answer: 零词尾
  - text: '[ма́тери]{.ru}'
    answer: 带 [-ер-]{.ru}
  - text: '[сту́лья]{.ru}'
    answer: '[-ьев]{.ru}'
  - text: '[лю́ди]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[жёны]{.ru}'
    answer: 零词尾
  - text: '[сыновья́]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[до́чери]{.ru}'
    answer: 带 [-ер-]{.ru}
  - text: '[дере́вья]{.ru}'
    answer: '[-ьев]{.ru}'
  - text: '[де́ти]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[сосе́ди]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[мужья́]{.ru}'
    answer: '[-ей]{.ru}'
    new: true
    gloss: 丈夫（单数 [муж]{.ru}）
  - text: '[ли́стья]{.ru}'
    answer: '[-ьев]{.ru}'
    new: true
    gloss: 树叶（单数 [лист]{.ru}）
  why: |-
    第 1、5、10、14 题：复数第一格 [-ья]{.ru} 不重读：[бра́тьев, сту́льев, дере́вьев, ли́стьев]{.ru}。
    第 2、8、13 题：复数第一格 [-ья́]{.ru} 重读：[друзе́й, сынове́й, муже́й]{.ru}。
    第 6、11 题：[люде́й, дете́й]{.ru}。
    第 12 题：[сосе́дей]{.ru}，重音不移。
    第 3、7 题：[сестёр, жён]{.ru}：零词尾，重音落在词干上。
    第 4、9 题：[матере́й, дочере́й]{.ru}：带 [-ер-]{.ru}，词尾 [-е́й]{.ru}；按词干特点归入这一栏。
