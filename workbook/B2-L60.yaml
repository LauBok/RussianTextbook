heading: 第 60 课　否定代词 + 不定式
groups:
- id: B2-L60-01
  tags:
  - не́кого, не́чего：变格与前置词位置
  - не́где, не́куда, не́когда
  task: 按括号里的问题写出否定代词或否定副词（[не́кого]{.ru} 一类）。
  type: matrix
  cols:
  - 动词
  - 否定代词 / 副词
  given:
  - 0
  rows:
  - base: '[спроси́ть (кого́?)]{.ru}'
    cells:
    - '[спроси́ть (кого́?)]{.ru}'
    - '[не́кого]{.ru}'
  - base: '[позвони́ть (кому́?)]{.ru}'
    cells:
    - '[позвони́ть (кому́?)]{.ru}'
    - '[не́кому]{.ru}'
  - base: '[писа́ть (чем?)]{.ru}'
    cells:
    - '[писа́ть (чем?)]{.ru}'
    - '[не́чем]{.ru}'
  - base: '[посове́товаться (с кем?)]{.ru}'
    cells:
    - '[посове́товаться (с кем?)]{.ru}'
    - '[не́ с кем]{.ru}'
  - base: '[боя́ться (чего́?)]{.ru}'
    cells:
    - '[боя́ться (чего́?)]{.ru}'
    - '[не́чего]{.ru}'
  - base: '[говори́ть (о чём?)]{.ru}'
    cells:
    - '[говори́ть (о чём?)]{.ru}'
    - '[не́ о чем]{.ru}'
  - base: '[пригласи́ть (кого́?)]{.ru}'
    cells:
    - '[пригласи́ть (кого́?)]{.ru}'
    - '[не́кого]{.ru}'
  - base: '[помо́чь (кому́?)]{.ru}'
    cells:
    - '[помо́чь (кому́?)]{.ru}'
    - '[не́кому]{.ru}'
  - base: '[занима́ться (чем?)]{.ru}'
    cells:
    - '[занима́ться (чем?)]{.ru}'
    - '[не́чем]{.ru}'
  - base: '[гото́виться (к чему́?)]{.ru}'
    cells:
    - '[гото́виться (к чему́?)]{.ru}'
    - '[не́ к чему]{.ru}'
  - base: '[пойти́ (к кому́?)]{.ru}'
    cells:
    - '[пойти́ (к кому́?)]{.ru}'
    - '[не́ к кому]{.ru}'
  - base: '[игра́ть (с кем?)]{.ru}'
    cells:
    - '[игра́ть (с кем?)]{.ru}'
    - '[не́ с кем]{.ru}'
  - base: '[ду́мать (о ком?)]{.ru}'
    cells:
    - '[ду́мать (о ком?)]{.ru}'
    - '[не́ о ком]{.ru}'
  - base: '[сесть (на что?)]{.ru}'
    cells:
    - '[сесть (на что?)]{.ru}'
    - '[не́ на что]{.ru}'
  - base: '[жить (где?)]{.ru}'
    cells:
    - '[жить (где?)]{.ru}'
    - '[не́где]{.ru}'
  - base: '[пойти́ (куда́?)]{.ru}'
    cells:
    - '[пойти́ (куда́?)]{.ru}'
    - '[не́куда]{.ru}'
  - base: '[отдыха́ть (когда́?)]{.ru}'
    cells:
    - '[отдыха́ть (когда́?)]{.ru}'
    - '[не́когда]{.ru}'
  why: '第 1、7 题：第四格：[спроси́ть, пригласи́ть кого́ → не́кого]{.ru}。

    第 5 题：第二格：[боя́ться чего́ → не́чего]{.ru}。

    第 2、8 题：第三格：[позвони́ть, помо́чь кому́ → не́кому]{.ru}。

    第 3、9 题：第五格：[писа́ть, занима́ться чем → не́чем]{.ru}。

    第 4、6、10–14 题：有前置词时前置词夹在 [не́]{.ru} 和代词中间，分成三个词写：[не́ с кем, не́ о чем, не́ к чему, не́ к кому, не́ о ком, не́ на что]{.ru}；不写 *[с не́кем]{.ru}*。重音始终在 [не́]{.ru} 上。

    第 15–17 题：副词同样加重读的 [не́-]{.ru}：[где → не́где, куда́ → не́куда, когда́ → не́когда]{.ru}。'
- id: B2-L60-02
  tags:
  - не́кого, не́чего：主体第三格与时间
  task: 写成句子：现在时、过去时、将来时。
  type: matrix
  cols:
  - 主体 + 谓语
  - 现在时
  - 过去时
  - 将来时
  given:
  - 0
  rows:
  - base: '[я + не́кого спроси́ть]{.ru}'
    cells:
    - '[я + не́кого спроси́ть]{.ru}'
    - '[Мне не́кого спроси́ть.]{.ru}'
    - '[Мне не́кого бы́ло спроси́ть.]{.ru}'
    - '[Мне не́кого бу́дет спроси́ть.]{.ru}'
  - base: '[ты + не́чего боя́ться]{.ru}'
    cells:
    - '[ты + не́чего боя́ться]{.ru}'
    - '[Тебе́ не́чего боя́ться.]{.ru}'
    - '[Тебе́ не́чего бы́ло боя́ться.]{.ru}'
    - '[Тебе́ не́чего бу́дет боя́ться.]{.ru}'
  - base: '[он + не́где жить]{.ru}'
    cells:
    - '[он + не́где жить]{.ru}'
    - '[Ему́ не́где жить.]{.ru}'
    - '[Ему́ не́где бы́ло жить.]{.ru}'
    - '[Ему́ не́где бу́дет жить.]{.ru}'
  - base: '[она́ + не́куда пойти́]{.ru}'
    cells:
    - '[она́ + не́куда пойти́]{.ru}'
    - '[Ей не́куда пойти́.]{.ru}'
    - '[Ей не́куда бы́ло пойти́.]{.ru}'
    - '[Ей не́куда бу́дет пойти́.]{.ru}'
  - base: '[мы + не́ о чем говори́ть]{.ru}'
    cells:
    - '[мы + не́ о чем говори́ть]{.ru}'
    - '[Нам не́ о чем говори́ть.]{.ru}'
    - '[Нам не́ о чем бы́ло говори́ть.]{.ru}'
    - '[Нам не́ о чем бу́дет говори́ть.]{.ru}'
  - base: '[вы + не́когда отдыха́ть]{.ru}'
    cells:
    - '[вы + не́когда отдыха́ть]{.ru}'
    - '[Вам не́когда отдыха́ть.]{.ru}'
    - '[Вам не́когда бы́ло отдыха́ть.]{.ru}'
    - '[Вам не́когда бу́дет отдыха́ть.]{.ru}'
  - base: '[Ми́ша + не́чем писа́ть]{.ru}'
    cells:
    - '[Ми́ша + не́чем писа́ть]{.ru}'
    - '[Ми́ше не́чем писа́ть.]{.ru}'
    - '[Ми́ше не́чем бы́ло писа́ть.]{.ru}'
    - '[Ми́ше не́чем бу́дет писа́ть.]{.ru}'
  - base: '[Ван Лэй + не́кому позвони́ть]{.ru}'
    cells:
    - '[Ван Лэй + не́кому позвони́ть]{.ru}'
    - '[Ван Лэ́ю не́кому позвони́ть.]{.ru}'
    - '[Ван Лэ́ю не́кому бы́ло позвони́ть.]{.ru}'
    - '[Ван Лэ́ю не́кому бу́дет позвони́ть.]{.ru}'
  why: 第 1–8 题：行为主体用第三格（[мне, тебе́, ему́, ей, нам, вам, Ми́ше, Ван Лэ́ю]{.ru}），不用第一格；过去时加 [бы́ло]{.ru}，将来时加 [бу́дет]{.ru}，一律是中性单数，不随主体变：[Ей не́куда бы́ло пойти́.]{.ru} 句中不再加 [не]{.ru}。
- id: B2-L60-03
  tags:
  - не́кого 与 никого́ не 对照
  task: 按括号里的时间，把句子改成 [никто́, ничто́]{.ru} 一类的否定句。
  type: matrix
  cols:
  - 原句
  - 否定句
  given:
  - 0
  rows:
  - base: '[Мне не́кого спроси́ть.]{.ru}'
    cells:
    - '[Мне не́кого спроси́ть.]{.ru}'
    - '[Я никого́ не спроси́л.]{.ru}'
    hint: 过去时，男
  - base: '[Ей не́чего де́лать.]{.ru}'
    cells:
    - '[Ей не́чего де́лать.]{.ru}'
    - '[Она́ ничего́ не де́лает.]{.ru}'
    hint: 现在时
  - base: '[Мне не́когда отдыха́ть.]{.ru}'
    cells:
    - '[Мне не́когда отдыха́ть.]{.ru}'
    - '[Я никогда́ не отдыха́ю.]{.ru}'
    hint: 现在时
  - base: '[Ему́ не́кому позвони́ть.]{.ru}'
    cells:
    - '[Ему́ не́кому позвони́ть.]{.ru}'
    - '[Он никому́ не позвони́л.]{.ru}'
    hint: 过去时
  - base: '[Нам не́ о чем говори́ть.]{.ru}'
    cells:
    - '[Нам не́ о чем говори́ть.]{.ru}'
    - '[Мы ни о чём не говори́м.]{.ru}'
    hint: 现在时
  - base: '[Им не́где жить.]{.ru}'
    cells:
    - '[Им не́где жить.]{.ru}'
    - '[Они́ нигде́ не живу́т.]{.ru}'
    hint: 现在时
  - base: '[Мне не́куда пойти́.]{.ru}'
    cells:
    - '[Мне не́куда пойти́.]{.ru}'
    - '[Я никуда́ не пойду́.]{.ru}'
    hint: 将来时
  - base: '[Ему́ не́ с кем игра́ть.]{.ru}'
    cells:
    - '[Ему́ не́ с кем игра́ть.]{.ru}'
    - '[Он ни с кем не игра́ет.]{.ru}'
    hint: 现在时
  - base: '[Ей не́чего боя́ться.]{.ru}'
    cells:
    - '[Ей не́чего боя́ться.]{.ru}'
    - '[Она́ ничего́ не бои́тся.]{.ru}'
    hint: 现在时
  - base: '[Нам не́кого пригласи́ть.]{.ru}'
    cells:
    - '[Нам не́кого пригласи́ть.]{.ru}'
    - '[Мы никого́ не пригласи́м.]{.ru}'
    hint: 将来时
  - base: '[Мне не́чего чита́ть.]{.ru}'
    cells:
    - '[Мне не́чего чита́ть.]{.ru}'
    - '[Я ничего́ не чита́ю.]{.ru}'
    hint: 现在时
  - base: '[Ей не́кого ждать.]{.ru}'
    cells:
    - '[Ей не́кого ждать.]{.ru}'
    - '[Она́ никого́ не ждала́.]{.ru}'
    hint: 过去时
  - base: '[Им не́ к кому пойти́.]{.ru}'
    cells:
    - '[Им не́ к кому пойти́.]{.ru}'
    - '[Они́ ни к кому́ не пойду́т.]{.ru}'
    hint: 将来时
  - base: '[Мне не́чем занима́ться.]{.ru}'
    cells:
    - '[Мне не́чем занима́ться.]{.ru}'
    - '[Я ниче́м не занима́юсь.]{.ru}'
    hint: 现在时
  why: '第 1、2、4、9–12、14 题：[ни-]{.ru} 句：主语用第一格，动词用变位形式，前面一定有 [не]{.ru}：[Я никого́ не спроси́л. Она́ ничего́ не де́лает.]{.ru} [ни-]{.ru} 不重读，代词的格和 [не́-]{.ru} 句相同：[не́кому → никому́]{.ru}。

    第 3、6、7 题：副词对应：[не́когда → никогда́ не]{.ru}，[не́где → нигде́ не]{.ru}，[не́куда → никуда́ не]{.ru}。意思不同：[Мне не́когда отдыха́ть]{.ru} 是“没时间休息”，[Я никогда́ не отдыха́ю]{.ru} 是“我从不休息”。

    第 5、8、13 题：有前置词时 [ни]{.ru} 和代词之间也夹前置词，分开写：[ни о чём, ни с кем, ни к кому́]{.ru}。'
