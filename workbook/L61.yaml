  why: |
    第 1–7 题：[-а]{.ru} 改 [-ой]{.ru}：[ма́мой, сестро́й, колбасо́й]{.ru}。[г、к]{.ru} 后照常写 [о]{.ru}：[подру́гой, ба́бушкой]{.ru}。
    第 8–10 题：[ч、ц]{.ru} 后不重读写 [-ей]{.ru}：[да́чей, у́лицей, ку́рицей]{.ru}，不写 [да́чой]{.ru}。
    第 11–13 题：[-я]{.ru} 改 [-ей]{.ru}：[Та́ней, ку́хней, тётей]{.ru}。
    第 14、15 题：[-я]{.ru} 重读时写 [-ёй]{.ru}：[семьёй, землёй]{.ru}。
    第 16–19 题：以 [-а / -я]{.ru} 结尾的阳性名词按阴性变：[па́пой, де́душкой, Ми́шей, дя́дей]{.ru}；[Ми́ша]{.ru} 的 [ш]{.ru} 后不重读，写 [-ей]{.ru}。
