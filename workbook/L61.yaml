    第 8 题：[варе́нье]{.ru} 第二格是 [варе́нья]{.ru}，第五格是 [варе́ньем]{.ru}。
    第 12 题：[колбаса́]{.ru} 重音在词尾：[колбасо́й, колбасы́]{.ru}。
- id: L61-05
  tags:
  - 前置词 с + 第五格：句中填空
  task: 把括号里的名词变成第五格填空。
  type: fill
  items:
  - stem: Ван Лэй говори́т по телефо́ну с ___.
