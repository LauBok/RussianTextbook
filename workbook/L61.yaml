    第 11–15 题：[-ь]{.ru} 结尾的阴性名词把 [-ь]{.ru} 换成 [-ью]{.ru}：[тетра́дью, пло́щадью, две́рью, но́чью, со́лью]{.ru}。阳性 [-ь]{.ru} 词（[слова́рь]{.ru}）用 [-ем / -ём]{.ru}，先看性。
    第 16、17 题：[мать, дочь]{.ru} 第五格中间加 [-ер-]{.ru}：[ма́терью, до́черью]{.ru}，要单独记。
