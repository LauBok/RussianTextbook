  why: |
    第 1–12 题：[с]{.ru} 后用第五格，[без]{.ru} 后用第二格。阳性和中性：[с са́харом — без са́хара]{.ru}，[с молоко́м — без молока́]{.ru}；阴性：[с капу́стой — без капу́сты]{.ru}，[с ры́бой — без ры́бы]{.ru}。
