  - stem: Ты пьёшь ко́фе с ___?
    hint: молоко́
    accept:
    - молоко́м
  - stem: Учи́тель говори́т с ___.
    hint: Ми́ша
    accept:
    - Ми́шей
  - stem: Ю́ми гуля́ет в па́рке с ___.
    hint: сестра́
    accept:
    - сестро́й
  - stem: Мари́я Никола́евна пьёт чай с ___.
    hint: варе́нье
    accept:
    - варе́ньем
  - stem: Па́па разгова́ривает с ___.
    hint: сосе́д
    accept:
    - сосе́дом
  - stem: Де́ти игра́ют в саду́ с ___.
    hint: соба́ка
    accept:
    - соба́кой
  - stem: Мы е́дем на да́чу с ___.
    hint: семья́
    accept:
    - семьёй
  - stem: Мари́я Никола́евна говори́т с ___.
    hint: дочь
    accept:
    - до́черью
  - stem: Я де́лаю упражне́ние со ___.
    hint: слова́рь
    accept:
    - словарём
  - stem: Ма́ма разгова́ривает с ___.
    hint: врач
    accept:
    - врачо́м
  - stem: Я ем суп с ___.
    hint: хлеб
    accept:
    - хле́бом
  - stem: А́нна говори́т с ___.
    hint: Та́ня
    accept:
    - Та́ней
  - stem: Ми́ша гуля́ет с ___.
    hint: де́душка
    accept:
    - де́душкой
  - stem: Ба́бушка живёт с ___.
    hint: мать
    accept:
    - ма́терью
  - stem: Ты пьёшь чай с ___?
    hint: лимо́н
    accept:
    - лимо́ном
  - stem: Пьер игра́ет в ша́хматы с ___.
    hint: учи́тель
    accept:
    - учи́телем
  why: |
    第 1、4、9 题：阴性 [-а]{.ru} 改 [-ой]{.ru}：[с ма́мой, с подру́гой, с сестро́й]{.ru}。
    第 2 题：[оте́ц]{.ru} 脱落 [е]{.ru}，[ц]{.ru} 后重读写 [о]{.ru}：[с отцо́м]{.ru}。
    第 3、6、11 题：阳性硬辅音加 [-ом]{.ru}：[с мёдом, с дру́гом, с сосе́дом]{.ru}。
    第 5、12 题：[с капу́стой, с соба́кой]{.ru}。
    第 7 题：[молоко́]{.ru} 加 [-м]{.ru}：[с молоко́м]{.ru}。
    第 8 题：[Ми́ша]{.ru} 是男人名，按阴性变，[ш]{.ru} 后不重读写 [-ей]{.ru}：[с Ми́шей]{.ru}。
    第 10 题：中性 [-е]{.ru} 加 [-м]{.ru}：[с варе́ньем]{.ru}。
    第 13 题：[-я]{.ru} 重读写 [-ёй]{.ru}：[с семьёй]{.ru}。
    第 14 题：[дочь]{.ru} 的第五格要单独记：[с до́черью]{.ru}。
    第 15 题：[слова́рь]{.ru} 是阳性，词尾重读写 [-ём]{.ru}；[с]{.ru} 在 [сл-]{.ru} 前写成 [со]{.ru}：[со словарём]{.ru}。
    第 16 题：[ч]{.ru} 后重读写 [о]{.ru}：[с врачо́м]{.ru}。
    第 17、21 题：[с хле́бом, с лимо́ном]{.ru}。
    第 18 题：[-я]{.ru} 不重读写 [-ей]{.ru}：[с Та́ней]{.ru}。
    第 19 题：[де́душка]{.ru} 是阳性，按阴性变：[с де́душкой]{.ru}。
    第 20 题：[мать]{.ru} 的第五格是 [ма́терью]{.ru}。
    第 22 题：[учи́тель]{.ru} 是阳性 [-ь]{.ru} 词，重音在词干，写 [-ем]{.ru}：[с учи́телем]{.ru}。
