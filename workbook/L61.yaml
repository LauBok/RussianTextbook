    cells:
    - '[пирожо́к]{.ru}'
    - '[пирожко́м]{.ru}'
    hint: gen. [пирожка́]{.ru}
  why: |
    第 1–7 题：硬辅音结尾加 [-ом]{.ru}：[лимо́ном, бра́том, хле́бом]{.ru}。重音跟着第二格走：[стол — стола́ — столо́м]{.ru}，词尾重读；[сыр — сы́ра — сы́ром]{.ru}，重音不动。
    第 8–10 题：[-й]{.ru} 结尾把 [-й]{.ru} 换成 [-ем]{.ru}：[музе́ем, ча́ем, трамва́ем]{.ru}。
    第 11–13 题：[-ь]{.ru} 结尾把 [-ь]{.ru} 换成 [-ем]{.ru}；词尾重读时写 [-ём]{.ru}：[слова́рь — словаря́ — словарём]{.ru}。[учи́телем, го́стем]{.ru} 重音在词干，写 [-ем]{.ru}。
    第 14–17 题：[ж、ш、ч、щ]{.ru} 后面重读写 [-о́м]{.ru}，不重读写 [-ем]{.ru}：[врачо́м, карандашо́м]{.ru}，但 [му́жем, това́рищем]{.ru}。这是最容易写错的一组。
    第 18、19 题：第二格脱落元音的词，第五格同样脱落：[оте́ц — отца́ — отцо́м]{.ru}（[ц]{.ru} 后重读写 [о]{.ru}），[пирожо́к — пирожка́ — пирожко́м]{.ru}。
