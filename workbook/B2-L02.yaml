- id: B2-L02-04
  tags:
  - 名词复数第二格：五种词尾的判断
  task: 按复数第二格的词尾把名词归类，不写形式。
  type: classify
  bins:
  - '[-ов]{.ru}'
  - '[-ев]{.ru}'
  - '[-ей]{.ru}'
  - 零词尾
  - '[-ий]{.ru}'
  items:
  - text: '[студе́нт]{.ru}'
    answer: '[-ов]{.ru}'
  - text: '[ме́сяц]{.ru}'
    answer: '[-ев]{.ru}'
  - text: '[кни́га]{.ru}'
    answer: 零词尾
  - text: '[врач]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[ле́кция]{.ru}'
    answer: '[-ий]{.ru}'
  - text: '[музе́й]{.ru}'
    answer: '[-ев]{.ru}'
  - text: '[неде́ля]{.ru}'
    answer: 零词尾
  - text: '[зда́ние]{.ru}'
    answer: '[-ий]{.ru}'
  - text: '[тетра́дь]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[сло́во]{.ru}'
    answer: 零词尾
  - text: '[оте́ц]{.ru}'
    answer: '[-ов]{.ru}'
  - text: '[мо́ре]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[дя́дя]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[де́вушка]{.ru}'
    answer: 零词尾
  - text: '[пода́рок]{.ru}'
    answer: '[-ов]{.ru}'
  - text: '[слова́рь]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[трамва́й]{.ru}'
    answer: '[-ев]{.ru}'
  - text: '[упражне́ние]{.ru}'
    answer: '[-ий]{.ru}'
  - text: '[ша́хматы]{.ru}'
    answer: 零词尾
  - text: '[нау́шники]{.ru}'
    answer: '[-ов]{.ru}'
  - text: '[ночь]{.ru}'
    answer: '[-ей]{.ru}'
  - text: '[письмо́]{.ru}'
    answer: 零词尾
  - text: '[аудито́рия]{.ru}'
    answer: '[-ий]{.ru}'
  - text: '[плащ]{.ru}'
    answer: '[-ей]{.ru}'
    new: true
    gloss: 雨衣
  why: |-
    第 1、15 题：硬辅音结尾加 [-ов]{.ru}：[студе́нтов, пода́рков]{.ru}。
    第 11 题：[оте́ц]{.ru} 词尾重读：[отцо́в]{.ru}。
    第 2、6、17 题：[-й]{.ru} 和非重读的 [-ц]{.ru} 用 [-ев]{.ru}：[ме́сяцев, музе́ев, трамва́ев]{.ru}。
    第 3、10、14、22 题：[-а, -о]{.ru} 去尾：[книг, слов]{.ru}；隐现元音不影响词尾类型：[де́вушек, пи́сем]{.ru}。
    第 4、9、16、21、24 题：[ж, ш, ч, щ]{.ru} 和 [-ь]{.ru} 用 [-ей]{.ru}：[враче́й, тетра́дей, словаре́й, ноче́й, плаще́й]{.ru}。
    第 5、8、18、23 题：[-ия, -ие]{.ru} 变 [-ий]{.ru}：[ле́кций, зда́ний, упражне́ний, аудито́рий]{.ru}。
    第 7 题：[-я]{.ru} 也是零词尾，只是写 [ь]{.ru}：[неде́ль]{.ru}。
    第 12、13 题：例外：[мо́ре → море́й]{.ru}，[дя́дя → дя́дей]{.ru}。
    第 19 题：只有复数的 [ша́хматы → ша́хмат]{.ru} 是零词尾。
    第 20 题：[нау́шники → нау́шников]{.ru}。
- id: B2-L02-05
  tags:
  - 名词复数第二格：句中（零词尾与隐现元音）
  task: 用括号里的词填空（句中）。
  type: fill
  items:
  - stem: В на́шем райо́не нет ___.
    hint: гости́ница
    accept:
    - гости́ниц
    new: true
    gloss: 宾馆
  - stem: Я ждал тебя́ два́дцать ___!
    hint: мину́та
    accept:
    - мину́т
  - stem: В э́том году́ у нас три́дцать пять ___.
    hint: неде́ля
    accept:
    - неде́ль
  - stem: Сего́дня у нас нет ___.
    hint: заня́тие
    accept:
    - заня́тий
  - stem: Ле́том бы́ло мно́го ___ по го́роду.
    hint: экску́рсия
    accept:
    - экску́рсий
  - stem: Ты получи́л мно́го ___?
    hint: письмо́
    accept:
    - пи́сем
  - stem: В рабо́те Ми́ши мно́го ___.
    hint: оши́бка
    accept:
    - оши́бок
  - stem: На столе́ шесть ___ и шесть ло́жек.
    hint: ча́шка
    accept:
    - ча́шек
  - stem: У ба́бушки пять ___ и два бра́та.
    hint: сестра́
    accept:
    - сестёр
  - stem: Я была́ в Петербу́рге пять ___.
    hint: раз
    accept:
    - раз
  why: |-
    第 1、2 题：[-а]{.ru} 去尾：[гости́ниц, мину́т]{.ru}。
    第 3 题：[-я]{.ru} 去尾写 [ь]{.ru}：[неде́ль]{.ru}。
    第 4 题：[-ие]{.ru} 变 [-ий]{.ru}：[заня́тий]{.ru}。
    第 5 题：[-ия]{.ru} 变 [-ий]{.ru}：[экску́рсий]{.ru}。
    第 6 题：[ь]{.ru} 的位置变成 [е]{.ru}：[пи́сем]{.ru}。
    第 7 题：硬辅音和 [к]{.ru} 之间插 [о]{.ru}：[оши́бок]{.ru}。
    第 8 题：[ш]{.ru} 和 [к]{.ru} 之间插 [е]{.ru}：[ча́шек]{.ru}。
    第 9 题：[сестра́ — сёстры — сестёр]{.ru}：插入的元音写 [ё]{.ru}，要逐个记。
    第 10 题：[раз]{.ru} 在 5 以上的数词后用复数第二格，和第一格同形：[пять раз]{.ru}，不说 [пять ра́зов]{.ru}。
