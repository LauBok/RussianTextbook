    第 1、2、9–11、14–18 题：硬变化 [-ам]{.ru}：[магази́нам, у́лицам, же́нщинам, ба́бушкам, студе́нткам, студе́нтам, стра́нам, ры́нкам, сёстрам, тури́стам]{.ru}。[по]{.ru} + 复数第三格表示在许多地方走动。
    第 3、6、20 题：复数重音在词尾：[города́м, врача́м, ученика́м]{.ru}。
