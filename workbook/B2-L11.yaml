- id: B2-L11-04
  tags:
  - 名词复数第三格：句中
  task: 用括号里的词填空。
  type: fill
  items:
  - stem: Ма́ма дала́ блины́ ___.
    hint: де́вочки
    accept:
    - де́вочкам
  - stem: Ле́том Ди́ма е́здил по ___ Росси́и.
    hint: города́
    accept:
    - города́м
  - stem: Ве́чером студе́нты ходи́ли по ___.
    hint: магази́ны
    accept:
    - магази́нам
  - stem: Ива́н Серге́евич звони́т ___.
    hint: колле́ги
    accept:
    - колле́гам
  - stem: Восьмо́го ма́рта Ми́ша подари́л цветы́ ___.
    hint: одногру́ппницы
    accept:
    - одногру́ппницам
  - stem: Ван Лэй пи́шет пи́сьма ___.
    hint: роди́тели
    accept:
    - роди́телям
  - stem: Мы ча́сто хо́дим к ___.
    hint: сосе́ди
    accept:
    - сосе́дям
  - stem: ___ ну́жно мно́го чита́ть.
    hint: студе́нты
    accept:
    - Студе́нтам
  - stem: О́льга Ви́кторовна объясни́ла пра́вило ___.
    hint: иностра́нцы
    accept:
    - иностра́нцам
    new: true
    gloss: 外国人
  - stem: Ба́бушка ча́сто помога́ет ___.
    hint: вну́чки
    accept:
    - вну́чкам
    new: true
    gloss: 孙女，外孙女
  - stem: Мы жела́ем ___ здоро́вья.
    hint: учителя́
    accept:
    - учителя́м
  - stem: Пе́ред пра́здником мы ходи́ли по ___.
    hint: ры́нки
    accept:
    - ры́нкам
  - stem: Ю́ми показа́ла фотогра́фии ___.
    hint: друзья́
    accept:
    - друзья́м
  - stem: Ди́ма лю́бит е́здить по ___.
    hint: музе́и
    accept:
    - музе́ям
  - stem: Мари́я Никола́евна позвони́ла ___.
    hint: врачи́
    accept:
    - врача́м
  - stem: Ми́ша купи́л пода́рки ___.
    hint: сёстры
    accept:
    - сёстрам
  - stem: В воскресе́нье мы гуля́ли по ___.
    hint: па́рки
    accept:
    - па́ркам
  - stem: Ди́ма ча́сто звони́т ___.
    hint: бра́тья
    accept:
    - бра́тьям
  why: |-
    第 1、3、5、8–10、12、16–18 题：硬变化 [-ам]{.ru}：[де́вочкам, магази́нам, одногру́ппницам, па́ркам, бра́тьям, студе́нтам, иностра́нцам, вну́чкам, ры́нкам, сёстрам]{.ru}。
    第 4 题：[колле́ги]{.ru} 按阴性变：[колле́гам]{.ru}。
    第 6、7、13、14 题：软变化 [-ям]{.ru}：[роди́телям, сосе́дям, друзья́м, музе́ям]{.ru}。
    第 2、11、15 题：复数重音在词尾：[города́м, учителя́м, врача́м]{.ru}。
