  why: |-
    第 3、8、11 题：复数第三格 [-ам]{.ru}，单数第五格 [-ом]{.ru}：[инжене́рам — с инжене́ром]{.ru}。读起来差不多，写的时候看意思：给谁用 [-ам]{.ru}，和谁一起用 [-ом]{.ru}。
    第 1、4、9、12 题：软变化：复数第三格 [-ям]{.ru}，单数第五格 [-ем]{.ru}：[преподава́телям — с преподава́телем]{.ru}。
    第 2、7 题：重音在词尾：[врача́м — с врачо́м, отца́м — с отцо́м]{.ru}；[ч, ц]{.ru} 后重读写 [о]{.ru}。
    第 5 题：[сосе́д]{.ru} 单数是硬变化 [с сосе́дом]{.ru}，复数是软变化 [сосе́дям]{.ru}。
    第 6 题：[учителя́]{.ru} 复数重音在词尾：[учителя́м]{.ru}；单数 [с учи́телем]{.ru}。
    第 10 题：[колле́га]{.ru} 按阴性变，单数第五格 [-ой]{.ru}：[с колле́гой]{.ru}。
