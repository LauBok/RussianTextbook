  why: |-
    第 1–3、6 题：硬变化：[-ам / -ах]{.ru}，重音同复数第一格：[студе́нтам, подру́гам, сёстрам, ба́бушкам]{.ru}。
    第 4、5 题：[-а]{.ru} 结尾的阳性名词按阴性变：[колле́гам, мужчи́нам]{.ru}。
    第 7 题：[ч]{.ru} 后用 [-ам]{.ru}，重音在词尾：[врача́м, о врача́х]{.ru}。
    第 8 题：[учителя́]{.ru} 是软变化，重音在词尾：[учителя́м, об учителя́х]{.ru}；元音前用 [об]{.ru}。
    第 9–14 题：软变化：[-ям / -ях]{.ru}，词干照复数第一格：[преподава́телям, сосе́дям, друзья́м, роди́телям, музе́ям, де́тям]{.ru}。
