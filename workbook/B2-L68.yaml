heading: 第 68 课　构词初识
groups:
- id: B2-L68-01
  tags:
  - 构词：-тель / -ник 与女性 -ница
  task: 由左边的词构成表示人的名词，再写出女性形式（没有通用女性形式的写“—”）。
  type: matrix
  cols:
  - 来源词
  - 表示人的名词
  - 女性
  given:
  - 0
  rows:
  - base: '[чита́ть]{.ru}'
    cells:
