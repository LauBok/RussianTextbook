  why: '第 1–7 题：动词去掉 [-ть]{.ru} 加 [-тель]{.ru}，重音同不定式：[чита́ть → чита́тель, посети́ть → посети́тель]{.ru}；女性在 [-тель]{.ru} 后加 [-ница]{.ru}：[чита́тельница, преподава́тельница]{.ru}。

    第 8、9 题：[води́тель, строи́тель]{.ru} 没有通用的女性形式，女司机也说 [води́тель]{.ru}。注意 [стро́ить → строи́тель]{.ru} 重音移到 [-и́-]{.ru} 上，是例外。

    第 10、11、13、14 题：[-ник]{.ru} 名词：[шко́ла → шко́льник]{.ru}（[-л-]{.ru} 后写 [ь]{.ru}），[отли́чно → отли́чник]{.ru}，[рабо́та → рабо́тник]{.ru}；女性把 [-ник]{.ru} 换成 [-ница]{.ru}：[шко́льница, отли́чница, рабо́тница, худо́жница]{.ru}。

    第 12 题：[по́мощь → помо́щник]{.ru}：重音移到 [-мо́-]{.ru} 上，女性 [помо́щница]{.ru}。'
- id: B2-L68-03
  tags:
  - не- 连写与 не 分写
  task: 括号里的 [не]{.ru} 和后面的词连写还是分写？归栏。
  type: classify
  bins:
  - 连写
  - 分写
  items:
  - text: '[Кни́ги здесь (не)дороги́е.]{.ru}'
    answer: 连写
  - text: '[Кни́ги здесь (не) дороги́е, а дешёвые.]{.ru}'
    answer: 分写
  - text: '[Он (не) зна́ет её а́дреса.]{.ru}'
    answer: 分写
  - text: '[Э́то (не)пра́вда!]{.ru}'
    answer: 连写
  - text: '[Фильм совсе́м (не) интере́сный.]{.ru}'
    answer: 分写
  - text: '[Ря́дом сиде́л (не)знако́мый челове́к.]{.ru}'
    answer: 连写
  - text: '[Мы (не) по́няли зада́ние.]{.ru}'
    answer: 分写
  - text: '[Э́то (не)плохо́й рестора́н.]{.ru}'
    answer: 连写
  - text: '[Он (не) ве́жливый, а гру́бый.]{.ru}'
    answer: 分写
    hint: 粗鲁的
  - text: '[Ма́льчик был (не)ве́жливый.]{.ru}'
    answer: 连写
  - text: '[Мне (не) нра́вится э́тот го́род.]{.ru}'
    answer: 分写
  - text: '[По́весть (не)интере́сная.]{.ru}'
    answer: 连写
  why: '第 1、4、6、8、10、12 题：说明一种性质、构成一个新词时连写：[недороги́е, непра́вда, незнако́мый, неплохо́й, неве́жливый, неинтере́сная]{.ru}。

    第 2、5、9 题：有 [а]{.ru} 引出的对比，或有 [совсе́м]{.ru} 这类加强否定的词时分写：[не дороги́е, а дешёвые]{.ru}，[совсе́м не интере́сный]{.ru}，[не ве́жливый, а гру́бый]{.ru}。

    第 3、7、11 题：动词前的 [не]{.ru} 一律分写：[не зна́ет, не по́няли, не нра́вится]{.ru}。'
- id: B2-L68-04
  tags:
  - 构词：句中填派生词
  task: 由括号里的词构成派生词，按句子要求填空。
  type: fill
  items:
  - stem: Мой брат — ___.
    hint: шко́ла
    accept:
    - шко́льник
  - stem: Моя́ сестра́ — ___, у неё одни́ пятёрки.
    hint: отли́чно
    accept:
    - отли́чница
  - stem: ___ авто́буса откры́л две́ри.
    hint: води́ть
    accept:
    - води́тель
  - stem: В магази́не мно́го ___.
    hint: покупа́ть
    accept:
    - покупа́телей
  - stem: Писа́тель подари́л кни́гу ___.
    hint: чита́ть；女
    accept:
    - чита́тельнице
  - stem: Кни́ги здесь ___.
    hint: дорого́й
    accept:
    - недороги́е
  - stem: 'Он ___ челове́к: никогда́ не здоро́вается.'
    hint: ве́жливый
    accept:
    - неве́жливый
  - stem: Фильм был ___, и я ушёл.
    hint: интере́сный
    accept:
    - неинтере́сный
  - stem: В за́ле бы́ло мно́го ___.
    hint: слу́шать
    accept:
    - слу́шателей
  - stem: Ба́бушка была́ ___ в шко́ле.
    hint: учи́ть；女
    accept:
    - учи́тельницей
  - stem: Мне ну́жен ___.
    hint: по́мощь
    accept:
    - помо́щник
  - stem: Я его́ не зна́ю, э́то ___ челове́к.
    hint: знако́мый
    accept:
    - незнако́мый
  why: '第 1–3、11 题：表示人的名词：[шко́льник, отли́чница, води́тель, помо́щник]{.ru}；说女性用 [-ница]{.ru}。

    第 4、5、9、10 题：派生词同样要按句子变格：[мно́го покупа́телей, слу́шателей]{.ru}（复数第二格），[подари́л чита́тельнице]{.ru}（第三格），[была́ учи́тельницей]{.ru}（第五格）。

    第 6–8、12 题：形容词加 [не-]{.ru} 并和名词一致：[недороги́е, неве́жливый, неинтере́сный, незнако́мый]{.ru}。'
