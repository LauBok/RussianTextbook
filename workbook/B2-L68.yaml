    - '[чита́тель]{.ru}'
    - '[чита́тельница]{.ru}'
  - base: '[писа́ть]{.ru}'
    cells:
    - '[писа́ть]{.ru}'
    - '[писа́тель]{.ru}'
    - '[писа́тельница]{.ru}'
  - base: '[учи́ть]{.ru}'
