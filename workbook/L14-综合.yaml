- id: L14-综合-d
  lessons:
  - L06
  - L07
  - L14
  tags:
  - 综合：现在时句中填空
  recycles:
  - L06-03
  - L07-04
  - L14-04
  task: 用括号里动词的现在时填空。
  type: fill
  items:
  - stem: Ю́ми ___ по-ру́сски ме́дленно.
    hint: говори́ть
    accept:
    - говори́т
  - stem: Мы ___ в це́нтре.
    hint: жить
    accept:
    - живём
  - stem: Ми́ша ___ телеви́зор.
    hint: смотре́ть
    accept:
    - смо́трит
  - stem: Я ___ упражне́ние.
    hint: писа́ть
    accept:
    - пишу́
  - stem: Ты ___ Кремль?
    hint: ви́деть
    accept:
    - ви́дишь
  - stem: Студе́нты ___ о Москве́.
    hint: расска́зывать
    accept:
    - расска́зывают
  - stem: Как вас ___?
    hint: звать
    accept:
    - зову́т
  - stem: Ко́шка ___ на крова́ти.
    hint: спать
    accept:
    - спит
  - stem: Мои́ роди́тели ___ в Пеки́не.
    hint: жить
    accept:
    - живу́т
  - stem: Ключи́ ___ на столе́.
    hint: лежа́ть
    accept:
    - лежа́т
  - stem: Вы ___ письмо́?
    hint: писа́ть
    accept:
    - пи́шете
  - stem: Я пло́хо ___ по-францу́зски.
    hint: понима́ть
    accept:
    - понима́ю
  - stem: Мы ___ фильм.
    hint: смотре́ть
    accept:
    - смо́трим
  - stem: Где вы ___?
    hint: жить
    accept:
    - живёте
  - stem: Я не ___.
    hint: спать
    accept:
    - сплю
  - stem: Что ты ___?
    hint: писа́ть
    accept:
    - пи́шешь
  - stem: Ла́мпа ___ на столе́.
    hint: стоя́ть
    accept:
    - стои́т
  - stem: Они́ ___ о Росси́и.
    hint: спра́шивать
    accept:
    - спра́шивают
  why: |-
    第 6、12、18 题：规则第一变位：[расска́зывают, понима́ю, спра́шивают]{.ru}。
    第 2、4、7、9、11、14、16 题：词干变化的第一变位：[живём, живу́т]{.ru}；[пишу́, пи́шете, пи́шешь]{.ru}；[живёте]{.ru}；[Как вас зову́т?]{.ru} 用第三人称复数 [зову́т]{.ru}，不说 [зову́ют]{.ru}。
    第 1、3、5、8、10、13、15、17 题：第二变位：[говори́т, смо́трит, спит, лежа́т, смо́трим, стои́т]{.ru}；[сплю]{.ru} 多一个 [л]{.ru}；[ви́дишь]{.ru} 只有第一人称是 [ви́жу]{.ru}。
