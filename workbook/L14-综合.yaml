    第 2、4、7、9、11、12、14、16、18、21、24 题：第二变位：[смо́трят, спишь, лежа́т, говори́м, стоя́т, звони́те, ви́дишь, стои́те]{.ru}；特殊的第一人称 [ви́жу, сплю]{.ru}；[смотрю́]{.ru} 重音在词尾。
