- id: L14-综合-a
  lessons:
  - L06
  - L07
  - L14
  tags:
  - 综合：现在时变位类型归类
  recycles:
  - L10-03
  - L14-02
  task: 按现在时变位类型把动词归类。
  type: classify
  bins:
  - 第一变位（词干不变）
  - 第一变位（词干变化）
  - 第二变位
  items:
  - text: '[чита́ть]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[жить]{.ru}'
    answer: 第一变位（词干变化）
  - text: '[говори́ть]{.ru}'
    answer: 第二变位
  - text: '[писа́ть]{.ru}'
    answer: 第一变位（词干变化）
  - text: '[смотре́ть]{.ru}'
    answer: 第二变位
  - text: '[звать]{.ru}'
    answer: 第一变位（词干变化）
  - text: '[гуля́ть]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[спать]{.ru}'
    answer: 第二变位
  - text: '[понима́ть]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[лежа́ть]{.ru}'
    answer: 第二变位
  - text: '[ду́мать]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[звони́ть]{.ru}'
    answer: 第二变位
  - text: '[расска́зывать]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[ви́деть]{.ru}'
    answer: 第二变位
  - text: '[стоя́ть]{.ru}'
    answer: 第二变位
  - text: '[спра́шивать]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[знать]{.ru}'
    answer: 第一变位（词干不变）
  - text: '[изуча́ть]{.ru}'
    answer: 第一变位（词干不变）
  why: |-
    第 1、7、9、11、13、16–18 题：词干不变的第一变位：[чита́ю, гуля́ю, понима́ю, ду́маю, расска́зываю, спра́шиваю, зна́ю, изуча́ю]{.ru}。
    第 2、4、6 题：词干变化的第一变位：[живу́, пишу́, зову́]{.ru}，词尾仍是 [-ешь / -ёшь, -ут]{.ru}。
    第 3、5、12、14 题：第二变位：[говори́шь, смо́тришь, звони́шь, ви́дишь]{.ru}。[ви́жу]{.ru} 虽然第一人称词干有变化，词尾仍是第二变位的 [-ишь, -ят]{.ru}。
    第 8、10、15 题：以 [-ать / -ять]{.ru} 结尾却属于第二变位：[спишь, лежи́шь, стои́шь]{.ru}。
