- id: B2-L17-02
  tags:
  - челове́к / челове́ка / люде́й
  task: 这些词后面说“人”用哪个形式？归类。
  type: classify
  bins:
  - '[челове́к]{.ru}'
  - '[челове́ка]{.ru}'
  - '[люде́й]{.ru}'
  - '[челове́к]{.ru} 或 [люде́й]{.ru}'
  items:
  - text: '[пять]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[мно́го]{.ru}'
    answer: '[люде́й]{.ru}'
  - text: '[два]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[ско́лько]{.ru}'
    answer: '[челове́к]{.ru} 或 [люде́й]{.ru}'
  - text: '[ма́ло]{.ru}'
    answer: '[люде́й]{.ru}'
  - text: '[два́дцать оди́н]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[не́сколько]{.ru}'
    answer: '[челове́к]{.ru} 或 [люде́й]{.ru}'
  - text: '[оди́ннадцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[три]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[сто]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[два́дцать четы́ре]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[со́рок]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[четы́ре]{.ru}'
    answer: '[челове́ка]{.ru}'
  - text: '[пятна́дцать]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[три́дцать оди́н]{.ru}'
    answer: '[челове́к]{.ru}'
  - text: '[ты́сяча]{.ru}'
    answer: '[челове́к]{.ru}'
  why: |-
    第 1、10、12、16 题：5 以上、整十整百、[ты́сяча]{.ru} 后用 [челове́к]{.ru}：[пять, сто, со́рок, ты́сяча челове́к]{.ru}。
    第 6、15 题：最后一个词是 [оди́н]{.ru}：[два́дцать оди́н челове́к, три́дцать оди́н челове́к]{.ru}（单数第一格）。
    第 8、14 题：11–19 后也用 [челове́к]{.ru}：[оди́ннадцать, пятна́дцать челове́к]{.ru}。
    第 3、9、11、13 题：2–4 后用单数第二格 [челове́ка]{.ru}：[два, три, четы́ре, два́дцать четы́ре челове́ка]{.ru}。
    第 2、5 题：[мно́го, ма́ло]{.ru} 后只能用 [люде́й]{.ru}。
    第 4、7 题：[ско́лько, не́сколько]{.ru} 后两种都可以，[челове́к]{.ru} 更常用。
- id: B2-L17-03
  tags:
  - 数量主语的谓语
  task: 写出谓语的过去时和将来时。
  type: matrix
  cols:
  - 现在时
  - 过去时
  - 将来时
  given:
  - 0
  rows:
  - base: '[В гру́ппе у́чится два́дцать два челове́ка.]{.ru}'
    cells:
    - '[В гру́ппе у́чится два́дцать два челове́ка.]{.ru}'
    - '[учи́лось]{.ru}'
    - '[бу́дет учи́ться]{.ru}'
  - base: '[В на́шем отде́ле рабо́тает пять челове́к.]{.ru}'
    cells:
    - '[В на́шем отде́ле рабо́тает пять челове́к.]{.ru}'
    - '[рабо́тало]{.ru}'
    - '[бу́дет рабо́тать]{.ru}'
  - base: '[В э́той кварти́ре живёт три челове́ка.]{.ru}'
    cells:
    - '[В э́той кварти́ре живёт три челове́ка.]{.ru}'
    - '[жи́ло]{.ru}'
    - '[бу́дет жить]{.ru}'
  - base: '[На катке́ ма́ло люде́й.]{.ru}'
    cells:
    - '[На катке́ ма́ло люде́й.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[В гости́ной два́дцать челове́к.]{.ru}'
    cells:
    - '[В гости́ной два́дцать челове́к.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[На экску́рсию е́дет не́сколько челове́к.]{.ru}'
    cells:
    - '[На экску́рсию е́дет не́сколько челове́к.]{.ru}'
    - '[е́хало]{.ru}'
    - '[бу́дет е́хать]{.ru}'
  - base: '[На ры́нке мно́го люде́й.]{.ru}'
    cells:
    - '[На ры́нке мно́го люде́й.]{.ru}'
    - '[бы́ло]{.ru}'
    - '[бу́дет]{.ru}'
  - base: '[В на́шей гру́ппе у́чится оди́н челове́к из Кита́я.]{.ru}'
    cells:
    - '[В на́шей гру́ппе у́чится оди́н челове́к из Кита́я.]{.ru}'
    - '[учи́лся]{.ru}'
    - '[бу́дет учи́ться]{.ru}'
  - base: '[За столо́м сиди́т семь челове́к.]{.ru}'
    cells:
    - '[За столо́м сиди́т семь челове́к.]{.ru}'
    - '[сиде́ло]{.ru}'
    - '[бу́дет сиде́ть]{.ru}'
  - base: '[В Кита́е живёт полтора́ миллиа́рда челове́к.]{.ru}'
    cells:
    - '[В Кита́е живёт полтора́ миллиа́рда челове́к.]{.ru}'
    - '[жи́ло]{.ru}'
    - '[бу́дет жить]{.ru}'
  why: |-
    第 1–3、6、9、10 题：数量词组作主语，动词一般用单数：过去时中性 [учи́лось, рабо́тало, жи́ло, е́хало, сиде́ло]{.ru}，将来时 [бу́дет]{.ru} + 不定式。
    第 4、5、7 题：没有动词的句子：[бы́ло / бу́дет]{.ru}，不用 [бы́ли / бу́дут]{.ru}。
    第 8 题：[оди́н челове́к]{.ru} 是普通的阳性单数主语：[учи́лся]{.ru}，不用中性。
- id: B2-L17-04
  tags:
  - челове́к / люде́й：句中
  task: 用 [челове́к]{.ru} 的正确形式或 [люде́й]{.ru} 填空。
  type: fill
  items:
  - stem: На ле́кции бы́ло со́рок ___.
    accept:
    - челове́к
  - stem: У нас в отде́ле рабо́тает три ___.
    accept:
    - челове́ка
  - stem: На у́лице бы́ло ма́ло ___.
    accept:
    - люде́й
  - stem: Ско́лько ___ пое́дет на экску́рсию?
    accept:
    - челове́к
    - люде́й
  - stem: В на́шей гру́ппе два́дцать оди́н ___.
    accept:
    - челове́к
  - stem: В метро́ всегда́ мно́го ___.
    accept:
    - люде́й
  - stem: На юбиле́е бы́ло пятьдеся́т два ___.
    accept:
    - челове́ка
  - stem: Не́сколько ___ сказа́ли тост.
    accept:
    - челове́к
    - люде́й
  - stem: Э́тот зал на ты́сячу ___.
    accept:
    - челове́к
  - stem: За столо́м сиде́ло четы́рнадцать ___.
    accept:
    - челове́к
  why: |-
    第 1、9、10 题：5 以上、11–19、[ты́сяча]{.ru} 后用 [челове́к]{.ru}。
    第 2、7 题：最后一个词是 2–4：[челове́ка]{.ru}。
    第 3、6 题：[мно́го, ма́ло]{.ru} 后只用 [люде́й]{.ru}。
    第 4、8 题：[ско́лько, не́сколько]{.ru} 后两种都可以，常用 [челове́к]{.ru}。
    第 5 题：最后一个词是 [оди́н]{.ru}：[челове́к]{.ru}（单数第一格）。
- id: B2-L17-05
  tags:
  - 表人名词与数词：句中
  task: 用括号里的词的正确形式填空。
  type: fill
  items:
  - stem: На дне рожде́ния бы́ло пять ___.
    hint: гость
    accept:
    - госте́й
  - stem: На дне рожде́ния бы́ло пять ___.
    hint: челове́к
    accept:
    - челове́к
  - stem: В на́шей гру́ппе два ___ из Вьетна́ма.
    hint: студе́нт
    accept:
    - студе́нта
  - stem: В на́шей гру́ппе два ___ из Вьетна́ма.
    hint: челове́к
    accept:
    - челове́ка
  - stem: Ба́бушке во́семьдесят ___.
    hint: год
    accept:
    - лет
  - stem: На конце́рте бы́ло ма́ло ___.
    hint: зри́тель
    accept:
    - зри́телей
  - stem: На конце́рте бы́ло ма́ло ___.
    hint: челове́к
    accept:
    - люде́й
  - stem: Ско́лько ___ рабо́тает в ва́шем отде́ле?
    hint: инжене́р
    accept:
    - инжене́ров
  - stem: За столо́м сиде́ло се́меро ___.
    hint: ребёнок
    accept:
    - дете́й
  - stem: Мы жда́ли два́дцать две ___.
    hint: мину́та
    accept:
    - мину́ты
  - stem: Ми́ша пригласи́л на день рожде́ния оди́ннадцать ___.
    hint: друг
    accept:
    - друзе́й
  - stem: Ми́ша пригласи́л на день рожде́ния оди́ннадцать ___.
    hint: челове́к
    accept:
    - челове́к
  - stem: Ди́ме два́дцать оди́н ___.
    hint: год
    accept:
    - год
  - stem: В кла́ссе у Ми́ши три́дцать ___.
    hint: учени́к
    accept:
    - ученико́в
  why: |-
    第 1、3、6、8、10、11、14 题：别的名词按一般规则：[пять госте́й, два студе́нта, ма́ло зри́телей, ско́лько инжене́ров, два́дцать две мину́ты, оди́ннадцать друзе́й, три́дцать ученико́в]{.ru}。
    第 2、4、12 题：[челове́к]{.ru}：5 以上和 11–19 后 [челове́к]{.ru}，2–4 后 [челове́ка]{.ru}。
    第 7 题：[мно́го, ма́ло]{.ru} 后用 [люде́й]{.ru}。
    第 5、13 题：[год]{.ru}：5 以上用 [лет]{.ru}，最后一个词是 [оди́н]{.ru} 用 [год]{.ru}。
    第 9 题：集合数词 + [дете́й]{.ru}：[се́меро дете́й]{.ru}。
