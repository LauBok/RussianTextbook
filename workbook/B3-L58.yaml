heading: 第 58 课　名词化
groups:
- id: B3-L58-01
  lessons:
  - B3-L58
  tags:
  - 名词化：动词变名词
  task: 写出与动词对应的名词。
  type: matrix
  cols:
  - 动词
  - 名词
  given:
  - 0
  rows:
  - base: '[реши́ть]{.ru}'
    cells:
    - '[реши́ть]{.ru}'
    - '[реше́ние]{.ru}'
  - base: '[объясни́ть]{.ru}'
    cells:
    - '[объясни́ть]{.ru}'
    - '[объясне́ние]{.ru}'
  - base: '[измени́ть]{.ru}'
    cells:
    - '[измени́ть]{.ru}'
    - '[измене́ние]{.ru}'
  - base: '[восстанови́ть]{.ru}'
    cells:
    - '[восстанови́ть]{.ru}'
    - '[восстановле́ние]{.ru}'
  - base: '[появи́ться]{.ru}'
    cells:
    - '[появи́ться]{.ru}'
    - '[появле́ние]{.ru}'
  - base: '[сократи́ть]{.ru}'
    cells:
    - '[сократи́ть]{.ru}'
    - '[сокраще́ние]{.ru}'
  - base: '[пригласи́ть]{.ru}'
    cells:
    - '[пригласи́ть]{.ru}'
    - '[приглаше́ние]{.ru}'
  - base: '[роди́ться]{.ru}'
    cells:
    - '[роди́ться]{.ru}'
    - '[рожде́ние]{.ru}'
  - base: '[созда́ть]{.ru}'
    cells:
    - '[созда́ть]{.ru}'
    - '[созда́ние]{.ru}'
  - base: '[откры́ть]{.ru}'
    cells:
    - '[откры́ть]{.ru}'
    - '[откры́тие]{.ru}'
  - base: '[разви́ть]{.ru}'
    cells:
    - '[разви́ть]{.ru}'
    - '[разви́тие]{.ru}'
  - base: '[познако́миться]{.ru}'
    cells:
    - '[познако́миться]{.ru}'
    - '[знако́мство]{.ru}'
  - base: '[производи́ть]{.ru}'
    cells:
    - '[производи́ть]{.ru}'
    - '[произво́дство]{.ru}'
  - base: '[вы́йти]{.ru}'
    cells:
    - '[вы́йти]{.ru}'
    - '[вы́ход]{.ru}'
  - base: '[показа́ть]{.ru}'
    cells:
    - '[показа́ть]{.ru}'
    - '[пока́з]{.ru}'
  - base: '[распа́сться]{.ru}'
    cells:
    - '[распа́сться]{.ru}'
    - '[распа́д]{.ru}'
  - base: '[перейти́]{.ru}'
    cells:
    - '[перейти́]{.ru}'
    - '[перехо́д]{.ru}'
  why: |-
    第 1–3 题：[-ить]{.ru} 动词构成 [-ение]{.ru}：[реше́ние, объясне́ние, измене́ние]{.ru}。
    第 4、5 题：唇音 [в]{.ru} 后加 [л]{.ru}，和被动形动词过去时一样：[восстанови́ть]{.ru} — [восстано́вленный]{.ru} — [восстановле́ние]{.ru}；[появи́ться]{.ru} → [появле́ние]{.ru}（[-ся]{.ru} 去掉）。
    第 6–8 题：词干末辅音交替：[т]{.ru} → [щ]{.ru}（[сокраще́ние]{.ru}），[с]{.ru} → [ш]{.ru}（[приглаше́ние]{.ru}），[д]{.ru} → [жд]{.ru}（[рожде́ние]{.ru}）。
    第 9 题：[-ать]{.ru} 动词构成 [-ание]{.ru}：[созда́ние]{.ru}。
    第 10、11 题：单音节词根的动词构成 [-тие]{.ru}：[откры́тие, разви́тие]{.ru}。
    第 12、13 题：构成 [-ство]{.ru} 名词：[знако́мство, произво́дство]{.ru}。
    第 14–17 题：没有后缀的名词，要逐词记：[вы́ход, пока́з, распа́д]{.ru}（[-ся]{.ru} 去掉）, [перехо́д]{.ru}。
- id: B3-L58-02
  lessons:
  - B3-L58
  tags:
  - 名词化：主语、宾语变第二格
  - 名词化：主语宾语都有时主语第五格
  - 名词化：补语保留前置词、副词变形容词
  task: 把动词词组改成名词词组。
  type: matrix
  cols:
  - 动词词组
  - 名词词组
  given:
  - 0
  rows:
  - base: '[фильм вы́шел]{.ru}'
    cells:
    - '[фильм вы́шел]{.ru}'
    - '[вы́ход фи́льма]{.ru}'
  - base: '[СССР распа́лся]{.ru}'
    cells:
    - '[СССР распа́лся]{.ru}'
    - '[распа́д СССР]{.ru}'
  - base: '[появи́лось звуково́е кино́]{.ru}'
    cells:
    - '[появи́лось звуково́е кино́]{.ru}'
    - '[появле́ние звуково́го кино́]{.ru}'
  - base: '[откры́ть киношко́лу]{.ru}'
    cells:
    - '[откры́ть киношко́лу]{.ru}'
    - '[откры́тие киношко́лы]{.ru}'
  - base: '[показа́ть фильм по телеви́зору]{.ru}'
    cells:
    - '[показа́ть фильм по телеви́зору]{.ru}'
    - '[пока́з фи́льма по телеви́зору]{.ru}'
  - base: '[Эйзенште́йн со́здал фильм]{.ru}'
    cells:
    - '[Эйзенште́йн со́здал фильм]{.ru}'
    - '[созда́ние фи́льма Эйзенште́йном]{.ru}'
  - base: '[студе́нты изуча́ют исто́рию кино́]{.ru}'
    cells:
    - '[студе́нты изуча́ют исто́рию кино́]{.ru}'
    - '[изуче́ние исто́рии кино́ студе́нтами]{.ru}'
  - base: '[перейти́ к звуково́му кино́]{.ru}'
    cells:
    - '[перейти́ к звуково́му кино́]{.ru}'
    - '[перехо́д к звуково́му кино́]{.ru}'
  - base: '[познако́миться с ру́сским кино́]{.ru}'
    cells:
    - '[познако́миться с ру́сским кино́]{.ru}'
    - '[знако́мство с ру́сским кино́]{.ru}'
  - base: '[постепе́нно восстанови́ть о́трасль]{.ru}'
    cells:
    - '[постепе́нно восстанови́ть о́трасль]{.ru}'
    - '[постепе́нное восстановле́ние о́трасли]{.ru}'
  - base: '[ре́зко сократи́ть произво́дство]{.ru}'
    cells:
    - '[ре́зко сократи́ть произво́дство]{.ru}'
    - '[ре́зкое сокраще́ние произво́дства]{.ru}'
  - base: '[бы́стро разви́ть киноиндустри́ю]{.ru}'
    cells:
    - '[бы́стро разви́ть киноиндустри́ю]{.ru}'
    - '[бы́строе разви́тие киноиндустри́и]{.ru}'
  - base: '[кинотеа́тры закры́лись]{.ru}'
    cells:
    - '[кинотеа́тры закры́лись]{.ru}'
    - '[закры́тие кинотеа́тров]{.ru}'
  - base: '[пригласи́ть актёров]{.ru}'
    cells:
    - '[пригласи́ть актёров]{.ru}'
    - '[приглаше́ние актёров]{.ru}'
  - base: '[роди́лся сын]{.ru}'
    cells:
    - '[роди́лся сын]{.ru}'
    - '[рожде́ние сы́на]{.ru}'
  why: |-
    第 1–3、13、15 题：动词的主语变成名词后面的第二格：[вы́ход фи́льма, распа́д СССР, появле́ние звуково́го кино́, закры́тие кинотеа́тров, рожде́ние сы́на]{.ru}。
    第 4、5、14 题：及物动词的宾语也变成第二格：[откры́тие киношко́лы, пока́з фи́льма, приглаше́ние актёров]{.ru}；其他补语照旧：[по телеви́зору]{.ru}。
    第 6、7 题：主语和宾语都有时，宾语用第二格，主语用第五格：[созда́ние фи́льма Эйзенште́йном, изуче́ние исто́рии кино́ студе́нтами]{.ru}。
    第 8、9 题：带前置词的补语保留原来的前置词和格：[перехо́д к звуково́му кино́, знако́мство с ру́сским кино́]{.ru}。
    第 10–12 题：副词变成形容词，和名词一致：[постепе́нное восстановле́ние, ре́зкое сокраще́ние, бы́строе разви́тие]{.ru}；宾语变第二格：[о́трасли, произво́дства, киноиндустри́и]{.ru}。
- id: B3-L58-03
  lessons:
  - B3-L58
  tags:
  - 名词化：从句变前置词短语
  task: 把从句改成前置词短语；可以用几个前置词的都写出来。
  type: matrix
  cols:
  - 从句
  - 前置词短语
  given:
  - 0
  rows:
  - base: '[когда́ фильм вы́шел]{.ru}'
    cells:
    - '[когда́ фильм вы́шел]{.ru}'
    - '[при вы́ходе фи́льма / с вы́ходом фи́льма]{.ru}'
  - base: '[по́сле того́ как СССР распа́лся]{.ru}'
    cells:
    - '[по́сле того́ как СССР распа́лся]{.ru}'
    - '[по́сле распа́да СССР]{.ru}'
  - base: '[до того́ как появи́лось звуково́е кино́]{.ru}'
    cells:
    - '[до того́ как появи́лось звуково́е кино́]{.ru}'
    - '[до появле́ния звуково́го кино́]{.ru}'
  - base: '[что́бы разви́ть кино́]{.ru}'
    cells:
    - '[что́бы разви́ть кино́]{.ru}'
    - '[для разви́тия кино́]{.ru}'
  - base: '[потому́ что откры́лась киношко́ла]{.ru}'
    cells:
    - '[потому́ что откры́лась киношко́ла]{.ru}'
    - '[благодаря́ откры́тию киношко́лы / в свя́зи с откры́тием киношко́лы]{.ru}'
  - base: '[когда́ шла война́]{.ru}'
    cells:
    - '[когда́ шла война́]{.ru}'
    - '[во вре́мя войны́]{.ru}'
  - base: '[по́сле того́ как он верну́лся]{.ru}'
    cells:
    - '[по́сле того́ как он верну́лся]{.ru}'
    - '[по́сле его́ возвраще́ния / по его́ возвраще́нии]{.ru}'
  - base: '[до того́ как начался́ фильм]{.ru}'
    cells:
    - '[до того́ как начался́ фильм]{.ru}'
    - '[до нача́ла фи́льма]{.ru}'
  - base: '[что́бы восстанови́ть о́трасль]{.ru}'
    cells:
    - '[что́бы восстанови́ть о́трасль]{.ru}'
    - '[для восстановле́ния о́трасли]{.ru}'
  - base: '[потому́ что ре́зко сократи́лось произво́дство]{.ru}'
    cells:
    - '[потому́ что ре́зко сократи́лось произво́дство]{.ru}'
    - '[из-за́ ре́зкого сокраще́ния произво́дства / в свя́зи с ре́зким сокраще́нием произво́дства]{.ru}'
  - base: '[по́сле того́ как откры́лась вы́ставка]{.ru}'
    cells:
    - '[по́сле того́ как откры́лась вы́ставка]{.ru}'
    - '[по́сле откры́тия вы́ставки]{.ru}'
  - base: '[что́бы пригласи́ть актёров]{.ru}'
    cells:
    - '[что́бы пригласи́ть актёров]{.ru}'
    - '[для приглаше́ния актёров]{.ru}'
  - base: '[по́сле того́ как она́ око́нчила университе́т]{.ru}'
    cells:
    - '[по́сле того́ как она́ око́нчила университе́т]{.ru}'
    - '[по́сле оконча́ния университе́та / по оконча́нии университе́та]{.ru}'
  - base: '[до того́ как прие́хал Пьер]{.ru}'
    cells:
    - '[до того́ как прие́хал Пьер]{.ru}'
    - '[до прие́зда Пье́ра]{.ru}'
  why: |-
    第 1 题：[когда́]{.ru} 表示同时，可以用 [при]{.ru} + 第六格或 [с]{.ru} + 第五格：[при вы́ходе фи́льма, с вы́ходом фи́льма]{.ru}。
    第 2、7、11、13 题：[по́сле того́ как]{.ru} → [по́сле]{.ru} + 第二格：[по́сле распа́да СССР, по́сле откры́тия вы́ставки, по́сле оконча́ния университе́та]{.ru}；“回来以后”“毕业以后”也可以用书面的 [по]{.ru} + 第六格：[по его́ возвраще́нии, по оконча́нии университе́та]{.ru}（第 54 课）。从句主语 [она́]{.ru} 从上下文可知，短语里一般省去。
    第 3、8、14 题：[до того́ как]{.ru} → [до]{.ru} + 第二格：[до появле́ния звуково́го кино́, до нача́ла фи́льма, до прие́зда Пье́ра]{.ru}。
    第 4、9、12 题：[что́бы]{.ru} → [для]{.ru} + 第二格：[для разви́тия кино́, для восстановле́ния о́трасли, для приглаше́ния актёров]{.ru}。
    第 5 题：好的原因用 [благодаря́]{.ru} + 第三格，中性的正式说法用 [в свя́зи с]{.ru} + 第五格（第 51 课）。
    第 6 题：事件进行的时候用 [во вре́мя]{.ru} + 第二格：[во вре́мя войны́]{.ru}。
    第 10 题：不好的原因用 [из-за́]{.ru} + 第二格，也可以用 [в свя́зи с]{.ru} + 第五格；副词 [ре́зко]{.ru} 变成形容词 [ре́зкое]{.ru}。
    第 1–14 题：从句的主语变成名词后面的第二格（[фи́льма, СССР, звуково́го кино́]{.ru}）；人称代词主语变成物主代词：[он верну́лся]{.ru} → [его́ возвраще́ние]{.ru}。
