heading: 第 43 课　完成体将来时
groups:
- id: L43-01
  tags: [完成体将来时：人称变位]
  task: 写出完成体动词的将来时六个人称形式。
  type: matrix
  cols: [不定式, '[я]{.ru}', '[ты]{.ru}', '[он / она́]{.ru}', '[мы]{.ru}', '[вы]{.ru}', '[они́]{.ru}']
  given: [0]
  rows:
  - {base: '[прочита́ть]{.ru}', hint: I, cells: ['[прочита́ть]{.ru}', '[прочита́ю]{.ru}', '[прочита́ешь]{.ru}', '[прочита́ет]{.ru}', '[прочита́ем]{.ru}', '[прочита́ете]{.ru}', '[прочита́ют]{.ru}']}
  - {base: '[сде́лать]{.ru}', hint: I, cells: ['[сде́лать]{.ru}', '[сде́лаю]{.ru}', '[сде́лаешь]{.ru}', '[сде́лает]{.ru}', '[сде́лаем]{.ru}', '[сде́лаете]{.ru}', '[сде́лают]{.ru}']}
  - {base: '[написа́ть]{.ru}', hint: 'I；[напишу́, напи́шешь]{.ru}', cells: ['[написа́ть]{.ru}', '[напишу́]{.ru}', '[напи́шешь]{.ru}', '[напи́шет]{.ru}', '[напи́шем]{.ru}', '[напи́шете]{.ru}', '[напи́шут]{.ru}']}
  - {base: '[посмотре́ть]{.ru}', hint: 'II；[посмотрю́, посмо́тришь]{.ru}', cells: ['[посмотре́ть]{.ru}', '[посмотрю́]{.ru}', '[посмо́тришь]{.ru}', '[посмо́трит]{.ru}', '[посмо́трим]{.ru}', '[посмо́трите]{.ru}', '[посмо́трят]{.ru}']}
  - {base: '[уви́деть]{.ru}', hint: 'II；[уви́жу, уви́дишь]{.ru}', cells: ['[уви́деть]{.ru}', '[уви́жу]{.ru}', '[уви́дишь]{.ru}', '[уви́дит]{.ru}', '[уви́дим]{.ru}', '[уви́дите]{.ru}', '[уви́дят]{.ru}']}
  - {base: '[пригото́вить]{.ru}', hint: 'II；[пригото́влю, пригото́вишь]{.ru}', cells: ['[пригото́вить]{.ru}', '[пригото́влю]{.ru}', '[пригото́вишь]{.ru}', '[пригото́вит]{.ru}', '[пригото́вим]{.ru}', '[пригото́вите]{.ru}', '[пригото́вят]{.ru}']}
  - {base: '[зако́нчить]{.ru}', hint: 'II；[зако́нчу, зако́нчишь]{.ru}', cells: ['[зако́нчить]{.ru}', '[зако́нчу]{.ru}', '[зако́нчишь]{.ru}', '[зако́нчит]{.ru}', '[зако́нчим]{.ru}', '[зако́нчите]{.ru}', '[зако́нчат]{.ru}']}
  - {base: '[позвони́ть]{.ru}', hint: 'II；[позвоню́, позвони́шь]{.ru}', new: true, gloss: 打（一次）电话, cells: ['[позвони́ть]{.ru}', '[позвоню́]{.ru}', '[позвони́шь]{.ru}', '[позвони́т]{.ru}', '[позвони́м]{.ru}', '[позвони́те]{.ru}', '[позвоня́т]{.ru}']}
  - {base: '[вы́учить]{.ru}', hint: 'II；[вы́учу, вы́учишь]{.ru}', new: true, gloss: 学会，背熟, cells: ['[вы́учить]{.ru}', '[вы́учу]{.ru}', '[вы́учишь]{.ru}', '[вы́учит]{.ru}', '[вы́учим]{.ru}', '[вы́учите]{.ru}', '[вы́учат]{.ru}']}
  - {base: '[реши́ть]{.ru}', hint: 'II；[решу́, реши́шь]{.ru}', new: true, gloss: 解答，解决, cells: ['[реши́ть]{.ru}', '[решу́]{.ru}', '[реши́шь]{.ru}', '[реши́т]{.ru}', '[реши́м]{.ru}', '[реши́те]{.ru}', '[реша́т]{.ru}']}
  - {base: '[послу́шать]{.ru}', hint: I, new: true, gloss: 听（完）, cells: ['[послу́шать]{.ru}', '[послу́шаю]{.ru}', '[послу́шаешь]{.ru}', '[послу́шает]{.ru}', '[послу́шаем]{.ru}', '[послу́шаете]{.ru}', '[послу́шают]{.ru}']}
  - {base: '[поу́жинать]{.ru}', hint: I, new: true, gloss: 吃完晚饭, cells: ['[поу́жинать]{.ru}', '[поу́жинаю]{.ru}', '[поу́жинаешь]{.ru}', '[поу́жинает]{.ru}', '[поу́жинаем]{.ru}', '[поу́жинаете]{.ru}', '[поу́жинают]{.ru}']}
  why: |
    第 1、2、11、12 题：第一变位，和 [чита́ть]{.ru} 的现在时一样加 [-ю, -ешь, -ет, -ем, -ете, -ют]{.ru}；前缀不改变词尾。
    第 3 题：[написа́ть]{.ru} 和 [писа́ть]{.ru} 一样 [с → ш]{.ru}，而且所有人称都交替：[напишу́, напи́шешь … напи́шут]{.ru}；重音只在 [я]{.ru} 的形式上落在词尾。
    第 4–10 题：第二变位加 [-ю / -у, -ишь, -ит, -им, -ите, -ят / -ат]{.ru}。辅音交替只出现在 [я]{.ru} 的形式：[уви́жу]{.ru}（[д → ж]{.ru}）、[пригото́влю]{.ru}（[в → вл]{.ru}），其余人称照不定式词干：[уви́дишь, пригото́вишь]{.ru}。
    第 7、9、10 题：[ч, ш]{.ru} 后面按拼写规则写 [-у, -ат]{.ru}：[зако́нчу, зако́нчат; вы́учу, вы́учат; решу́, реша́т]{.ru}，不写 [-ю, -ят]{.ru}。
    第 4 题：[посмотрю́]{.ru} 重音在词尾，其余人称移到词干：[посмо́тришь … посмо́трят]{.ru}。
- id: L43-02
  tags: [将来时：两种将来时对照]
  task: 同一体对分别写出两种将来时。
  type: matrix
  cols: [体对, '未完成体（[я]{.ru}）', '完成体（[я]{.ru}）', '未完成体（[они́]{.ru}）', '完成体（[они́]{.ru}）']
  given: [0]
  rows:
  - {base: '[чита́ть / прочита́ть]{.ru}', cells: ['[чита́ть / прочита́ть]{.ru}', '[бу́ду чита́ть]{.ru}', '[прочита́ю]{.ru}', '[бу́дут чита́ть]{.ru}', '[прочита́ют]{.ru}']}
  - {base: '[писа́ть / написа́ть]{.ru}', cells: ['[писа́ть / написа́ть]{.ru}', '[бу́ду писа́ть]{.ru}', '[напишу́]{.ru}', '[бу́дут писа́ть]{.ru}', '[напи́шут]{.ru}']}
  - {base: '[де́лать / сде́лать]{.ru}', cells: ['[де́лать / сде́лать]{.ru}', '[бу́ду де́лать]{.ru}', '[сде́лаю]{.ru}', '[бу́дут де́лать]{.ru}', '[сде́лают]{.ru}']}
  - {base: '[смотре́ть / посмотре́ть]{.ru}', cells: ['[смотре́ть / посмотре́ть]{.ru}', '[бу́ду смотре́ть]{.ru}', '[посмотрю́]{.ru}', '[бу́дут смотре́ть]{.ru}', '[посмо́трят]{.ru}']}
  - {base: '[гото́вить / пригото́вить]{.ru}', cells: ['[гото́вить / пригото́вить]{.ru}', '[бу́ду гото́вить]{.ru}', '[пригото́влю]{.ru}', '[бу́дут гото́вить]{.ru}', '[пригото́вят]{.ru}']}
  - {base: '[у́жинать / поу́жинать]{.ru}', cells: ['[у́жинать / поу́жинать]{.ru}', '[бу́ду у́жинать]{.ru}', '[поу́жинаю]{.ru}', '[бу́дут у́жинать]{.ru}', '[поу́жинают]{.ru}']}
  - {base: '[звони́ть / позвони́ть]{.ru}', cells: ['[звони́ть / позвони́ть]{.ru}', '[бу́ду звони́ть]{.ru}', '[позвоню́]{.ru}', '[бу́дут звони́ть]{.ru}', '[позвоня́т]{.ru}']}
  - {base: '[учи́ть / вы́учить]{.ru}', cells: ['[учи́ть / вы́учить]{.ru}', '[бу́ду учи́ть]{.ru}', '[вы́учу]{.ru}', '[бу́дут учи́ть]{.ru}', '[вы́учат]{.ru}']}
  - {base: '[слу́шать / послу́шать]{.ru}', cells: ['[слу́шать / послу́шать]{.ru}', '[бу́ду слу́шать]{.ru}', '[послу́шаю]{.ru}', '[бу́дут слу́шать]{.ru}', '[послу́шают]{.ru}']}
  - {base: '[реша́ть / реши́ть]{.ru}', new: true, gloss: 解答，解决, cells: ['[реша́ть / реши́ть]{.ru}', '[бу́ду реша́ть]{.ru}', '[решу́]{.ru}', '[бу́дут реша́ть]{.ru}', '[реша́т]{.ru}']}
  - {base: '[обе́дать / пообе́дать]{.ru}', cells: ['[обе́дать / пообе́дать]{.ru}', '[бу́ду обе́дать]{.ru}', '[пообе́даю]{.ru}', '[бу́дут обе́дать]{.ru}', '[пообе́дают]{.ru}']}
  why: |
    第 1–11 题：未完成体将来时是 [бу́ду / бу́дут]{.ru} + 未完成体不定式；完成体将来时直接把完成体变位，不加 [бу́ду]{.ru}。[бу́ду прочита́ть]{.ru} 这样的组合是错的。
    第 2、4、5、7、8、10 题：完成体变位时注意 [я]{.ru} 的交替和重音：[напишу́ — напи́шут, посмотрю́ — посмо́трят, пригото́влю — пригото́вят, вы́учу — вы́учат, решу́ — реша́т]{.ru}。
    第 10 题：[реша́т]{.ru}（[они́]{.ru}，完成体将来时）和未完成体不定式 [реша́ть]{.ru} 只差一个 [-ь]{.ru}，不要混。
- id: L43-03
  tags: [将来时：过程与结果意义]
  task: 判断句中的动词表示哪一种意义，填写序号。
  type: classify
  bins: [现在正在进行, 将来要进行（不说结果）, 将来要做完（强调结果）]
  items:
  - {text: '[Сейча́с я чита́ю расска́з.]{.ru}', answer: 现在正在进行}
  - {text: '[За́втра я прочита́ю расска́з.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[За́втра я бу́ду чита́ть расска́з.]{.ru}', answer: 将来要进行（不说结果）}
  - {text: '[Ми́ша сде́лает уро́ки ве́чером.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[Ми́ша де́лает уро́ки.]{.ru}', answer: 现在正在进行}
  - {text: '[Ве́чером мы бу́дем смотре́ть телеви́зор.]{.ru}', answer: 将来要进行（不说结果）}
  - {text: '[Че́стное сло́во, я напишу́ письмо́ сего́дня.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[А́нна пи́шет письмо́.]{.ru}', answer: 现在正在进行}
  - {text: '[Там вы уви́дите ла́вру.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[Что ты бу́дешь де́лать в суббо́ту?]{.ru}', answer: 将来要进行（不说结果）}
  - {text: '[Ма́ма пригото́вит вку́сный у́жин.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[Ма́ма гото́вит у́жин на ку́хне.]{.ru}', answer: 现在正在进行}
  - {text: '[В воскресе́нье па́па бу́дет рабо́тать.]{.ru}', answer: 将来要进行（不说结果）}
  - {text: '[Я зако́нчу рабо́ту в пя́тницу.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[Ван Лэй смо́трит фильм.]{.ru}', answer: 现在正在进行}
  - {text: '[За́втра я бу́ду до́лго занима́ться.]{.ru}', answer: 将来要进行（不说结果）}
  - {text: '[Ю́ми ско́ро зако́нчит упражне́ние.]{.ru}', answer: 将来要做完（强调结果）}
  - {text: '[Сего́дня ве́чером мы посмо́трим но́вый фильм.]{.ru}', answer: 将来要做完（强调结果）}
  why: |
    第 1、5、8、12、15 题：未完成体现在时 [чита́ю, де́лает, пи́шет, гото́вит, смо́трит]{.ru} 表示说话时正在进行的动作。
    第 3、6、10、13、16 题：[бу́ду]{.ru} + 未完成体不定式只说将来要做这件事、要做多久，不说做完没有。
    第 2、4、7、9、11、14、17、18 题：完成体变位形式样子像现在时，意思是将来，表示将来要把事情做完、做成：[прочита́ю, сде́лает, напишу́, уви́дите, пригото́вит, зако́нчу, посмо́трим]{.ru}。第 1 题和第 2 题、第 5 题和第 4 题最能看出这一点：[чита́ю]{.ru} 是“在读”，[прочита́ю]{.ru} 是“将读完”。
- id: L43-04
  tags: [将来时：两种将来时的选择]
  task: 根据语境选择体，写出将来时。
  type: fill
  items:
  - {stem: '— Что ты бу́дешь де́лать ве́чером? — Я ___.', hint: чита́ть / прочита́ть, accept: [бу́ду чита́ть]}
  - {stem: 'Че́стное сло́во, упражне́ние я ___ сего́дня.', hint: де́лать / сде́лать, accept: [сде́лаю]}
  - {stem: 'За́втра па́па до́лго ___ у́жин.', hint: гото́вить / пригото́вить, accept: [бу́дет гото́вить]}
  - {stem: 'Я ___ расска́з сего́дня, а за́втра мы бу́дем говори́ть о нём.', hint: чита́ть / прочита́ть, accept: [прочита́ю]}
  - {stem: '— Ты уже́ написа́л письмо́? — Ещё нет, но ве́чером ___.', hint: писа́ть / написа́ть, accept: [напишу́]}
  - {stem: '— Что вы бу́дете де́лать в воскресе́нье? — Мы ___ телеви́зор и отдыха́ть.', hint: смотре́ть / посмотре́ть, accept: [бу́дем смотре́ть]}
  - {stem: 'В Се́ргиевом Поса́де вы ___ ста́рую ла́вру.', hint: ви́деть / уви́деть, accept: [уви́дите]}
  - {stem: 'Ма́ма ___ у́жин, и в семь часо́в мы бу́дем у́жинать.', hint: гото́вить / пригото́вить, accept: [пригото́вит]}
  - {stem: 'Э́то о́чень дли́нный расска́з. Я ___ его́ до́лго.', hint: чита́ть / прочита́ть, accept: [бу́ду чита́ть]}
  - {stem: 'Ю́ми ___ упражне́ние в пя́тницу, а в суббо́ту бу́дет отдыха́ть.', hint: де́лать / сде́лать, accept: [сде́лает]}
  - {stem: 'Я ___ э́то упражне́ние два часа́: оно́ о́чень тру́дное.', hint: де́лать / сде́лать, accept: [бу́ду де́лать]}
  - {stem: 'Хорошо́, я ___ э́тот фильм за́втра, а пото́м мы бу́дем говори́ть о нём.', hint: смотре́ть / посмотре́ть, accept: [посмотрю́]}
  why: |
    第 1、6 题：回答“打算做什么”，只说安排、不说结果，用 [бу́ду]{.ru} + 未完成体。
    第 3、9、11 题：[до́лго, два часа́]{.ru} 说明动作要持续多久，只能用未完成体将来时。
    第 2、5 题：保证或答应“一定做完”，用完成体将来时：[сде́лаю, напишу́]{.ru}。
    第 4、8、10、12 题：后面还有一个动作，要等前一个动作做完才能进行（读完再讨论、做好饭再吃饭、做完练习再休息），前一个动作用完成体。
    第 7 题：“会看到”是一次具体的结果，用完成体 [уви́дите]{.ru}。
- id: L43-05
  tags: [将来时：两种将来时的形式核查]
  task: 每个说法都有一处错误（括号里说明想表达的意思），写出正确的说法。
  type: matrix
  cols: [有错误的说法, 正确的说法]
  given: [0]
  rows:
  - {base: '[я бу́ду прочита́ть расска́з]{.ru}', hint: 强调读完, cells: ['[я бу́ду прочита́ть расска́з]{.ru}', '[я прочита́ю расска́з]{.ru}']}
  - {base: '[сейча́с я прочита́ю газе́ту]{.ru}', hint: 正在读, cells: ['[сейча́с я прочита́ю газе́ту]{.ru}', '[сейча́с я чита́ю газе́ту]{.ru}']}
  - {base: '[за́втра он бу́дет написа́ть письмо́]{.ru}', hint: 强调写完, cells: ['[за́втра он бу́дет написа́ть письмо́]{.ru}', '[за́втра он напи́шет письмо́]{.ru}']}
  - {base: '[мы пригото́вим у́жин два часа́]{.ru}', hint: 说持续多久, cells: ['[мы пригото́вим у́жин два часа́]{.ru}', '[мы бу́дем гото́вить у́жин два часа́]{.ru}']}
  - {base: '[я уви́дю ла́вру]{.ru}', cells: ['[я уви́дю ла́вру]{.ru}', '[я уви́жу ла́вру]{.ru}']}
  - {base: '[они́ пригото́вют у́жин]{.ru}', cells: ['[они́ пригото́вют у́жин]{.ru}', '[они́ пригото́вят у́жин]{.ru}']}
  - {base: '[я зако́нчю рабо́ту]{.ru}', cells: ['[я зако́нчю рабо́ту]{.ru}', '[я зако́нчу рабо́ту]{.ru}']}
  - {base: '[вы напи́сете письмо́]{.ru}', cells: ['[вы напи́сете письмо́]{.ru}', '[вы напи́шете письмо́]{.ru}']}
  - {base: '[сейча́с Ми́ша сде́лает уро́ки]{.ru}', hint: 正在做, cells: ['[сейча́с Ми́ша сде́лает уро́ки]{.ru}', '[сейча́с Ми́ша де́лает уро́ки]{.ru}']}
  - {base: '[за́втра мы бу́дем сде́лать упражне́ние]{.ru}', hint: 强调做完, cells: ['[за́втра мы бу́дем сде́лать упражне́ние]{.ru}', '[за́втра мы сде́лаем упражне́ние]{.ru}']}
  - {base: '[ты посмотри́шь фильм]{.ru}', cells: ['[ты посмотри́шь фильм]{.ru}', '[ты посмо́тришь фильм]{.ru}']}
  - {base: '[она́ бу́дет до́лго посмотре́ть телеви́зор]{.ru}', hint: 说持续多久, cells: ['[она́ бу́дет до́лго посмотре́ть телеви́зор]{.ru}', '[она́ бу́дет до́лго смотре́ть телеви́зор]{.ru}']}
  why: |
    第 1、3、10 题：[бу́ду]{.ru} 只接未完成体不定式；要强调做完，直接用完成体变位：[прочита́ю, напи́шет, сде́лаем]{.ru}。
    第 4、12 题：说持续多久只能用未完成体：[бу́дем гото́вить два часа́, бу́дет до́лго смотре́ть]{.ru}；第 12 题 [бу́дет]{.ru} 后面要换成未完成体不定式。
    第 2、9 题：完成体变位是将来时，不能表示“正在做”；[сейча́с]{.ru} + 正在进行的动作用未完成体现在时：[чита́ю, де́лает]{.ru}。
    第 5、7 题：第二变位 [я]{.ru} 的形式有交替或拼写规则：[уви́жу]{.ru}（[д → ж]{.ru}）、[зако́нчу]{.ru}（[ч]{.ru} 后写 [у]{.ru}）。
    第 6 题：[пригото́вить]{.ru} 是第二变位，[они́]{.ru} 用 [-ят]{.ru}：[пригото́вят]{.ru}；交替 [вл]{.ru} 只在 [я]{.ru} 的形式里。
    第 8 题：[написа́ть]{.ru} 所有人称都是 [ш]{.ru}：[напи́шете]{.ru}。
    第 11 题：[посмотре́ть]{.ru} 从 [ты]{.ru} 起重音在词干：[посмо́тришь]{.ru}。
