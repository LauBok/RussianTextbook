    假定式 = 过去时形式 + [бы]{.ru}，主语 [она́]{.ru} 用阴性：[взяла́ бы, дала́ бы, пила́ бы]{.ru} 重音在词尾。'
- id: L100-04
  tags:
  - 总复习：运动动词的意义
  task: 判断运动动词表示的意义。
  type: classify
  bins:
  - 正在路上（定向）
  - 经常或往返（不定向）
  - 动身去（[пойти́ / пое́хать]{.ru}）
  items:
  - text: Сейча́с я иду́ в библиоте́ку.
    answer: 正在路上（定向）
  - text: Я ча́сто хожу́ в библиоте́ку.
    answer: 经常或往返（不定向）
  - text: Вчера́ я ходи́л в теа́тр.
    answer: 经常或往返（不定向）
  - text: Когда́ я шёл домо́й, я уви́дел А́нну.
    answer: 正在路上（定向）
  - text: За́втра мы пое́дем в Петербу́рг.
    answer: 动身去（[пойти́ / пое́хать]{.ru}）
  - text: В декабре́ мы е́здили в Петербу́рг.
    answer: 经常或往返（不定向）
  - text: Ми́ша пошёл в шко́лу в во́семь.
    answer: 动身去（[пойти́ / пое́хать]{.ru}）
  - text: Смотри́, вон е́дет авто́бус.
    answer: 正在路上（定向）
  - text: Ка́ждое ле́то Петро́вы е́здят на да́чу.
    answer: 经常或往返（不定向）
  - text: Ван Лэй взял биле́т и пое́хал в аэропо́рт.
    answer: 动身去（[пойти́ / пое́хать]{.ru}）
  - text: Куда́ ты идёшь?
    answer: 正在路上（定向）
  - text: Ба́бушка ре́дко хо́дит в магази́н.
    answer: 经常或往返（不定向）
  - text: Мы е́хали на да́чу два часа́.
    answer: 正在路上（定向）
  - text: Когда́ уро́к ко́нчился, Пьер пошёл домо́й.
    answer: 动身去（[пойти́ / пое́хать]{.ru}）
  - text: — Где ты был вчера́? — Я ходи́л в музе́й.
    answer: 经常或往返（不定向）
  - text: Пойдём в кино́!
    answer: 动身去（[пойти́ / пое́хать]{.ru}）
  why: '第 1、4、8、11、13 题：定向动词 [идти́, е́хать]{.ru}：动作正在进行，朝一个方向，人在路上。

    第 2、3、6、9、12、15 题：不定向动词 [ходи́ть, е́здить]{.ru}：经常去（[ча́сто, ка́ждое ле́то, ре́дко]{.ru}），或过去去了一趟已经回来（[ходи́л, е́здили]{.ru}）。

    第 5、7、10、14、16 题：[пойти́, пое́хать]{.ru}：动身出发；过去时说“出发了”，将来时说“要去”，[Пойдём!]{.ru} 是邀请对方一起去。'
