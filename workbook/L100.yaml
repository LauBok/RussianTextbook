    - '[вста́ла бы]{.ru}'
  why: '命令式从现在时（完成体从将来时）词干构成：

    第 1、12 题：词干以元音结尾加 [-й]{.ru}：[чита́й, откро́й]{.ru}。第 2、4、5、7、8、11 题：第一人称重音在词尾，加 [-и]{.ru}：[говори́, скажи́, возьми́, купи́, позвони́, напиши́]{.ru}。第 6、13 题：第一人称重音在词干，加 [-ь]{.ru}：[отве́ть, встань]{.ru}。

