    第 1、5、8、11、14、17 题：末位是 2、3、4（12–14 除外），名词用单数第二格：[два часа́, три рубля́, две мину́ты, три го́да, два челове́ка]{.ru}；阴性名词前用 [две]{.ru}。

    第 2、6、7、9、12、15、16 题：末位是 5–9、0，以及 11–14，用复数第二格：[часо́в, рубле́й, мину́т, лет, челове́к]{.ru}。[год]{.ru} 的复数第二格是 [лет]{.ru}，[челове́к]{.ru} 不变。'
- id: L100-06
  tags:
  - 总复习：复合句的类型
  task: 判断复合句的类型。
  type: classify
  bins:
  - 时间
  - 真实的条件
  - 不真实的条件
  - 原因
  - 转述
  - 定语
  items:
  - text: Когда́ я за́втракаю, я слу́шаю ра́дио.
    answer: 时间
  - text: Е́сли бу́дет дождь, мы бу́дем до́ма.
    answer: 真实的条件
  - text: Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хал на по́езде.
    answer: 不真实的条件
  - text: Я был до́ма, потому́ что шёл дождь.
    answer: 原因
  - text: Ка́тя сказа́ла, что позвони́т.
    answer: 转述
  - text: Э́то парк, кото́рый нахо́дится в це́нтре.
    answer: 定语
  - text: Она́ спроси́ла, здоро́в ли я.
    answer: 转述
  - text: Когда́ конце́рт ко́нчился, мы пошли́ домо́й.
    answer: 时间
  - text: Е́сли ты уста́нешь, ложи́сь спать.
    answer: 真实的条件
  - text: Е́сли бы ба́бушка жила́ в Москве́, мы бы ча́сто ходи́ли к ней.
    answer: 不真实的条件
  - text: Ми́ша не пошёл в шко́лу, потому́ что был бо́лен.
    answer: 原因
  - text: Пьер спроси́л, где бу́дет конце́рт.
    answer: 转述
  - text: Где студе́нт, кото́рый живёт у Петро́вых?
    answer: 定语
  - text: Когда́ я шёл домо́й, я уви́дел А́нну.
    answer: 时间
  - text: Е́сли идёт дождь, я сижу́ до́ма.
    answer: 真实的条件
  - text: Е́сли бы бы́ло тепло́, мы бы гуля́ли.
    answer: 不真实的条件
  - text: Я пошёл в декана́т, потому́ что мне нужна́ спра́вка.
    answer: 原因
  - text: Мы живём в до́ме, кото́рый стои́т у па́рка.
    answer: 定语
  why: '第 1、8、14 题：[когда́]{.ru} 引出时间。第 2、9、15 题：[е́сли]{.ru} 不带 [бы]{.ru}，是可能发生的真实条件。第 3、10、16 题：[е́сли бы … бы]{.ru}，是不符合事实的假设。

    第 4、11、17 题：[потому́ что]{.ru} 引出原因。第 5、7、12 题：转述别人的话：陈述句用 [что]{.ru}，一般疑问句用 [ли]{.ru}，特殊疑问句保留疑问词。

    第 6、13、18 题：[кото́рый]{.ru} 引出定语从句，说明前面的名词。'
