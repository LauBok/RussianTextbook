heading: 第 21 课　疑问代词的变格
groups:
- id: B2-L21-01
  tags:
  - 疑问代词 кто, что：变格
  task: 写出 [кто]{.ru} 和 [что]{.ru} 的各格（第六格连同前置词 [о]{.ru} 写）。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  - 第四格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[кто]{.ru}'
    cells:
    - '[кто]{.ru}'
    - '[кого́]{.ru}'
    - '[кому́]{.ru}'
    - '[кого́]{.ru}'
    - '[кем]{.ru}'
    - '[о ком]{.ru}'
  - base: '[что]{.ru}'
    cells:
    - '[что]{.ru}'
    - '[чего́]{.ru}'
    - '[чему́]{.ru}'
    - '[что]{.ru}'
    - '[чем]{.ru}'
    - '[о чём]{.ru}'
  why: |-
    第 1 题：[кто]{.ru} 问人和动物，第四格同第二格：[кого́]{.ru}；[г]{.ru} 读 [в]{.ru}。
    第 2 题：[что]{.ru} 问事物，第四格同第一格：[что]{.ru}；第六格写 [ё]{.ru}：[о чём]{.ru}。
- id: B2-L21-02
  tags:
  - 疑问代词 кто, что：由动词或前置词定格
  task: 写出问句里疑问代词的形式（括号里注明问人还是问物）。
  type: matrix
  cols:
  - 动词或前置词
  - 疑问代词
  given:
  - 0
  rows:
  - base: '[звони́ть]{.ru}'
    cells:
    - '[звони́ть]{.ru}'
    - '[кому́]{.ru}'
    hint: 人
  - base: '[спра́шивать]{.ru}'
    cells:
    - '[спра́шивать]{.ru}'
    - '[кого́]{.ru}'
    hint: 人
  - base: '[боя́ться]{.ru}'
    cells:
    - '[боя́ться]{.ru}'
    - '[чего́]{.ru}'
    hint: 物
  - base: '[интересова́ться]{.ru}'
    cells:
    - '[интересова́ться]{.ru}'
    - '[чем]{.ru}'
    hint: 物
  - base: '[ду́мать о …]{.ru}'
    cells:
    - '[ду́мать о …]{.ru}'
    - '[ком]{.ru}'
    hint: 人
  - base: '[говори́ть о …]{.ru}'
    cells:
    - '[говори́ть о …]{.ru}'
    - '[чём]{.ru}'
    hint: 物
  - base: '[игра́ть с …]{.ru}'
    cells:
    - '[игра́ть с …]{.ru}'
    - '[кем]{.ru}'
    hint: 人
  - base: '[ждать]{.ru}'
    cells:
    - '[ждать]{.ru}'
    - '[кого́]{.ru}'
    hint: 人
  - base: '[помога́ть]{.ru}'
    cells:
    - '[помога́ть]{.ru}'
    - '[кому́]{.ru}'
    hint: 人
  - base: '[у …]{.ru}'
    cells:
    - '[у …]{.ru}'
    - '[кого́]{.ru}'
    hint: 人
  - base: '[без …]{.ru}'
    cells:
    - '[без …]{.ru}'
    - '[чего́]{.ru}'
    hint: 物
  - base: '[занима́ться]{.ru}'
    cells:
    - '[занима́ться]{.ru}'
    - '[чем]{.ru}'
    hint: 物
  - base: '[ве́рить]{.ru}'
    cells:
    - '[ве́рить]{.ru}'
    - '[кому́]{.ru}'
    hint: 人
  - base: '[смотре́ть]{.ru}'
    cells:
    - '[смотре́ть]{.ru}'
    - '[что]{.ru}'
    hint: 物
  - base: '[обману́ть]{.ru}'
    cells:
    - '[обману́ть]{.ru}'
    - '[кого́]{.ru}'
    hint: 人
  - base: '[приду́мать]{.ru}'
    cells:
    - '[приду́мать]{.ru}'
    - '[что]{.ru}'
    hint: 物
  - base: '[к …]{.ru}'
    cells:
    - '[к …]{.ru}'
    - '[кому́]{.ru}'
    hint: 人
  - base: '[горди́ться]{.ru}'
    cells:
    - '[горди́ться]{.ru}'
    - '[кем]{.ru}'
    hint: 人
  why: |-
    第 1、9、13、17 题：[звони́ть, помога́ть, ве́рить, к]{.ru} 要求第三格：[кому́]{.ru}。
    第 2、8、10、15 题：[спра́шивать, ждать, обману́ть]{.ru} 要求第四格，[у]{.ru} 要求第二格，问人都是 [кого́]{.ru}。
    第 3、11 题：[боя́ться, без]{.ru} 要求第二格：[чего́]{.ru}。不要写成 [что]{.ru}。
    第 4、7、12、18 题：[интересова́ться, занима́ться, горди́ться, с]{.ru} 要求第五格：[чем, кем]{.ru}。
    第 5、6 题：[о]{.ru} + 第六格：[о ком, о чём]{.ru}。
    第 14、16 题：问事物的第四格同第一格：[что]{.ru}。
- id: B2-L21-03
  tags:
  - 疑问代词 чей：变格
  task: 写出 [чей]{.ru} 和名词组成的词组（按括号里的格）。
  type: matrix
  cols:
  - 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[кни́га]{.ru}'
    cells:
    - '[кни́га]{.ru}'
    - '[чью кни́гу]{.ru}'
    hint: 第四格
  - base: '[брат]{.ru}'
    cells:
    - '[брат]{.ru}'
    - '[с чьим бра́том]{.ru}'
    hint: '[с]{.ru} + 第五格'
  - base: '[ко́мната]{.ru}'
    cells:
    - '[ко́мната]{.ru}'
    - '[в чьей ко́мнате]{.ru}'
    hint: 第六格
  - base: '[сло́во]{.ru}'
    cells:
    - '[сло́во]{.ru}'
    - '[чьё сло́во]{.ru}'
    hint: 第一格
  - base: '[слова́]{.ru}'
    cells:
    - '[слова́]{.ru}'
    - '[чьи слова́]{.ru}'
    hint: 第一格
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[чьим роди́телям]{.ru}'
    hint: 第三格
  - base: '[сестра́]{.ru}'
    cells:
    - '[сестра́]{.ru}'
    - '[у чьей сестры́]{.ru}'
    hint: '[у]{.ru} + 第二格'
  - base: '[дом]{.ru}'
    cells:
    - '[дом]{.ru}'
    - '[о чьём до́ме]{.ru}'
    hint: 第六格
  - base: '[друзья́]{.ru}'
    cells:
    - '[друзья́]{.ru}'
    - '[чьих друзе́й]{.ru}'
    hint: 第四格
  - base: '[ма́ма]{.ru}'
    cells:
    - '[ма́ма]{.ru}'
    - '[чьей ма́ме]{.ru}'
    hint: 第三格
  - base: '[маши́на]{.ru}'
    cells:
    - '[маши́на]{.ru}'
    - '[на чьей маши́не]{.ru}'
    hint: 第六格
  - base: '[сын]{.ru}'
    cells:
    - '[сын]{.ru}'
    - '[чьего́ сы́на]{.ru}'
    hint: 第四格
  - base: '[кни́ги]{.ru}'
    cells:
    - '[кни́ги]{.ru}'
    - '[о чьих кни́гах]{.ru}'
    hint: 第六格
  - base: '[соба́ка]{.ru}'
    cells:
    - '[соба́ка]{.ru}'
    - '[с чьей соба́кой]{.ru}'
    hint: '[с]{.ru} + 第五格'
  why: |-
    第 1、4、5、9、12 题：[чей]{.ru} 第一格 [чей, чья, чьё, чьи]{.ru}；第四格阴性 [чью]{.ru}，阳性和复数修饰动物名词同第二格：[чьего́ сы́на, чьих друзе́й]{.ru}。
    第 2、6、10、14 题：第三、五格：[чьим бра́том, чьим роди́телям, чьей ма́ме, чьей соба́кой]{.ru}。注意 [чьим]{.ru} 既是阳性单数第五格，又是复数第三格。
    第 3、7、11 题：阴性除第一、四格外都是 [чьей]{.ru}。
    第 8、13 题：第六格 [чьём]{.ru}（阳性）、[чьих]{.ru}（复数）。
    第 1–14 题：[чей]{.ru} 和 [мой]{.ru} 变法相似，只是多一个软音符号：[моего́ — чьего́, мое́й — чьей]{.ru}。
- id: B2-L21-04
  tags:
  - 疑问代词 кто, что 作主语：谓语形式
  task: 用括号里动词的过去时填空。
  type: fill
  items:
  - stem: Кто ___ э́то письмо́? — А́нна.
    hint: написа́ть
    accept:
    - написа́л
  - stem: Кто ___ на ле́кции? — Все студе́нты.
    hint: быть
    accept:
    - был
  - stem: Что ___ в са́харнице? — Соль.
    hint: быть
    accept:
    - бы́ло
  - stem: Кто ___ тебе́ пода́рок? — Ба́бушка.
    hint: подари́ть
    accept:
    - подари́л
  - stem: Что ___? — Ничего́ стра́шного.
    hint: случи́ться
    accept:
    - случи́лось
  - stem: Кто ___ к вам в го́сти? — Ю́ми и Пьер.
    hint: прийти́
    accept:
    - пришёл
  - stem: Что тебе́ ___ в Москве́? — Метро́.
    hint: понра́виться
    accept:
    - понра́вилось
  - stem: Что ___ на столе́? — Кни́ги.
    hint: лежа́ть
    accept:
    - лежа́ло
  - stem: Кто ___ э́тот ро́зыгрыш? — Ми́ша и А́нна.
    hint: приду́мать
    accept:
    - приду́мал
  - stem: Кто ___ на фо́то? — Моя́ сестра́.
    hint: улыба́ться
    accept:
    - улыба́лся
  - stem: Что ___ в шко́ле? — Конце́рт.
    hint: быть
    accept:
    - бы́ло
  - stem: Кто ___ дверь? — Ма́ма.
    hint: откры́ть
    accept:
    - откры́л
  why: |-
    第 1、2、4、6、9、10、12 题：[кто]{.ru} 作主语，谓语用阳性单数，即使答的是女性或几个人：[Кто написа́л? — А́нна. Кто пришёл? — Ю́ми и Пьер.]{.ru}
    第 3、5、7、8、11 题：[что]{.ru} 作主语，谓语用中性单数：[Что бы́ло? Что случи́лось? Что лежа́ло на столе́? — Кни́ги.]{.ru}
