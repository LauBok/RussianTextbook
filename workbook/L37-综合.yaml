  why: '第 1、3、4、8、9 题：阳性、中性 [-а / -я]{.ru}；第 3、9 题元音脱落：[отца́, пода́рка]{.ru}；第 4 题 [словаря́]{.ru} 重音在词尾。

    第 2、5、6、7 题：[-ы / -и]{.ru}；[сестры́]{.ru} 重音在词尾；[де́душка]{.ru} 按 [-а]{.ru} 变。

    第 10 题：不变格。第 11、12 题：前面没有前置词，[её, нас]{.ru} 不加 [н-]{.ru}。

    第 13–20 题：修饰语阳性、中性 [-ого / -его]{.ru}，阴性 [-ой / -ей]{.ru}；[ш]{.ru} 后不重读写 [е]{.ru}：[мла́дшей, хоро́шего, ста́ршего]{.ru}；第 17 题 [её]{.ru} 不变；第 19 题 [па́па]{.ru} 是阳性，用 [моего́]{.ru}。'
- id: L37-综合-b
  lessons:
  - L31
  - L32
  - L33
  - L36
  tags:
  - 综合：第二格用途关系标注
  recycles:
  - L31-04
  - L33-02
  task: 句中第二格表示什么关系？按用途归类（每句只有一个第二格）。
  type: classify
  bins:
  - 拥有者（[у кого́]{.ru}）
  - 否定（[нет / не́ было]{.ru}）
  - 所属（谁的）
  - 来源（[из / с]{.ru}）
  items:
  - text: '[У сестры́ есть соба́ка.]{.ru}'
    answer: 拥有者（[у кого́]{.ru}）
  - text: '[Здесь нет апте́ки.]{.ru}'
    answer: 否定（[нет / не́ было]{.ru}）
  - text: '[Э́то маши́на отца́.]{.ru}'
    answer: 所属（谁的）
  - text: '[Пьер из Фра́нции.]{.ru}'
    answer: 来源（[из / с]{.ru}）
  - text: '[У Ива́на есть брат.]{.ru}'
    answer: 拥有者（[у кого́]{.ru}）
  - text: '[Вчера́ здесь не́ было магази́на.]{.ru}'
    answer: 否定（[нет / не́ было]{.ru}）
  - text: '[Где кни́га преподава́теля?]{.ru}'
    answer: 所属（谁的）
  - text: '[Мы е́дем с да́чи.]{.ru}'
    answer: 来源（[из / с]{.ru}）
  - text: '[Ми́ши нет до́ма.]{.ru}'
    answer: 否定（[нет / не́ было]{.ru}）
  - text: '[У ба́бушки большо́й сад.]{.ru}'
    answer: 拥有者（[у кого́]{.ru}）
  - text: '[Я ви́жу дом де́душки.]{.ru}'
    answer: 所属（谁的）
  - text: '[Хосе́ с Ку́бы.]{.ru}'
    answer: 来源（[из / с]{.ru}）
  - text: '[В ко́мнате нет окна́.]{.ru}'
    answer: 否定（[нет / не́ было]{.ru}）
  - text: '[Мы в до́ме сосе́да.]{.ru}'
    answer: 所属（谁的）
  - text: '[У О́льги Ви́кторовны есть дочь.]{.ru}'
    answer: 拥有者（[у кого́]{.ru}）
  - text: '[Ван Лэй идёт из библиоте́ки.]{.ru}'
    answer: 来源（[из / с]{.ru}）
  why: '第 1、5、10、15 题：[у]{.ru} + 第二格表示拥有者，所有物是主语，用第一格。

    第 2、6、9、13 题：[нет / не́ было]{.ru} + 第二格表示没有或不在。

    第 3、7、11、14 题：第二格放在名词后面表示“谁的”，前面的名词可以是任何格：[дом де́душки]{.ru} 作宾语，[в до́ме сосе́да]{.ru} 表示处所。

    第 4、8、12、16 题：[из / с]{.ru} + 第二格表示来源。'
