  why: '过去时去掉 [-ть]{.ru} 加 [-л, -ла]{.ru}，两个体的构成方法相同。

    第 4、7、8、11 题：重音要特别记：[брала́, взяла́, дала́]{.ru} 阴性重音在词尾；[нача́ть]{.ru} 阳性 [на́чал]{.ru}、阴性 [начала́]{.ru}，[поня́ть]{.ru} 阳性 [по́нял]{.ru}、阴性 [поняла́]{.ru}。

    第 12 题：[встава́ть]{.ru} 过去时保留 [-ва-]{.ru}：[встава́л]{.ru}；完成体 [встал, вста́ла]{.ru}。第 14 题：[пойти́]{.ru} 的过去时特殊：[пошёл, пошла́]{.ru}。'
- id: L96-02
  tags:
  - 过去时与体：过程、反复、结果与依次
  task: 判断过去时表示的意义。
  type: classify
  bins:
  - 过程，持续一段时间
  - 经常、反复
  - 一次完成，有结果
  - 依次发生的几个动作
  items:
  - text: Пе́рвый ме́сяц я почти́ не понима́л.
    answer: 过程，持续一段时间
  - text: Я ча́сто писа́л пи́сьма домо́й.
    answer: 经常、反复
  - text: Я прочита́л три кни́ги.
    answer: 一次完成，有结果
  - text: Я пошёл в библиоте́ку и взял уче́бник.
    answer: 依次发生的几个动作
  - text: Вчера́ я до́лго чита́л.
    answer: 过程，持续一段时间
  - text: Ка́ждое воскресе́нье мы ходи́ли в парк.
    answer: 经常、反复
  - text: Наконе́ц Ми́ша сде́лал дома́шнее зада́ние.
    answer: 一次完成，有结果
  - text: А́нна верну́лась домо́й, сде́лала уро́ки и позвони́ла Ка́те.
    answer: 依次发生的几个动作
  - text: Неде́лю я боле́л.
    answer: 过程，持续一段时间
  - text: Па́па всегда́ встава́л в шесть.
    answer: 经常、反复
  - text: Ван Лэй написа́л письмо́ ма́ме.
    answer: 一次完成，有结果
  - text: Ю́ми откры́ла окно́ и посмотре́ла на у́лицу.
    answer: 依次发生的几个动作
  - text: Мы два часа́ гуля́ли в па́рке.
    answer: 过程，持续一段时间
  - text: Ра́ньше ба́бушка ча́сто звони́ла нам.
    answer: 经常、反复
  - text: Пьер вы́учил но́вые слова́.
    answer: 一次完成，有结果
  - text: Ми́ша встал, поза́втракал и пошёл в шко́лу.
    answer: 依次发生的几个动作
  - text: Ве́чером мы до́лго говори́ли о Москве́.
    answer: 过程，持续一段时间
  - text: Зимо́й де́ти ка́ждый день ката́лись на лы́жах.
    answer: 经常、反复
  - text: Ма́ма купи́ла Ми́ше но́вую ку́ртку.
    answer: 一次完成，有结果
  - text: Я взял биле́ты и позвони́л А́нне.
    answer: 依次发生的几个动作
  why: '第 1、5、9、13、17 题：未完成体，和 [пе́рвый ме́сяц, до́лго, неде́лю, два часа́]{.ru} 连用，说动作持续了一段时间。

    第 2、6、10、14、18 题：未完成体，和 [ча́сто, всегда́, ка́ждый день, ка́ждое воскресе́нье]{.ru} 连用，说动作多次重复。

    第 3、7、11、15、19 题：完成体，说一次动作完成了，有结果：读完了三本书、写好了信、学会了单词。[наконе́ц]{.ru}、数量词常和完成体连用。

    第 4、8、12、16、20 题：几个完成体动词连用，一个做完接着做下一个。'
- id: L96-03
  tags:
  - начина́ть / начина́ться：有补语与无补语
  task: 用 [начина́ть]{.ru} 或 [начина́ться]{.ru} 的正确形式填空。
  type: fill
  items:
  - stem: Конце́рт ___ в семь.
    hint: начина́ть(ся)
    accept:
    - начина́ется
  - stem: 'Ра́ньше я всегда́ ___ пи́сьма так: «Дороги́е ма́ма и па́па!»'
    hint: начина́ть(ся)
    accept:
    - начина́л
  - stem: Заня́тия ___ в де́вять.
    hint: начина́ть(ся)
    accept:
    - начина́ются
  - stem: Се́ссия ___ деся́того января́.
    hint: начина́ть(ся)
    accept:
    - начина́ется
  - stem: О́льга Ви́кторовна ___ уро́к в де́вять.
    hint: начина́ть(ся)
    accept:
    - начина́ет
  - stem: Мы ___ занима́ться в во́семь.
    hint: начина́ть(ся)
    accept:
    - начина́ем
  - stem: Когда́ ___ кани́кулы?
    hint: начина́ть(ся)
    accept:
    - начина́ются
  - stem: Вчера́ конце́рт ___ в семь.
    hint: начина́ть(ся)
    accept:
    - начина́лся
  - stem: Ка́ждое у́тро па́па ___ рабо́ту в во́семь.
    hint: начина́ть(ся)
    accept:
    - начина́ет
  - stem: Ты ___ де́лать уро́ки по́сле обе́да?
    hint: начина́ть(ся)
    accept:
    - начина́ешь
  - stem: Ра́ньше уро́ки ___ в во́семь.
    hint: начина́ть(ся)
    accept:
    - начина́лись
  - stem: Ле́кция ___ в три.
    hint: начина́ть(ся)
    accept:
    - начина́ется
  - stem: Студе́нты ___ писа́ть контро́льную.
    hint: начина́ть(ся)
    accept:
    - начина́ют
  - stem: Ра́ньше ле́кция ___ в де́сять.
    hint: начина́ть(ся)
    accept:
    - начина́лась
  why: '第 2、5、6、9、10、13 题：主语是人，后面有补语（第四格 [пи́сьма, уро́к, рабо́ту]{.ru} 或不定式 [занима́ться, де́лать, писа́ть]{.ru}），用不带 [-ся]{.ru} 的 [начина́ть]{.ru}：[начина́ет, начина́ем, начина́ешь, начина́ют, начина́л]{.ru}。

    第 1、3、4、7、8、11、12、14 题：主语是事情本身（[конце́рт, заня́тия, се́ссия, кани́кулы, уро́ки, ле́кция]{.ru}），后面没有补语，用 [начина́ться]{.ru}：[начина́ется, начина́ются]{.ru}；过去时跟主语的性数一致：[конце́рт начина́лся, ле́кция начина́лась, уро́ки начина́лись]{.ru}。'
