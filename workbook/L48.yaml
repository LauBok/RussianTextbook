heading: 第 48 课　月份与序数词
groups:
- id: L48-01
  tags: [月份：在几月（第六格）]
  task: 写出“在几月”的说法。
  type: matrix
  cols: [月份, '[в]{.ru} + 第六格']
  given: [0]
  rows:
  - {base: '[янва́рь]{.ru}', cells: ['[янва́рь]{.ru}', '[в январе́]{.ru}']}
  - {base: '[февра́ль]{.ru}', cells: ['[февра́ль]{.ru}', '[в феврале́]{.ru}']}
  - {base: '[март]{.ru}', cells: ['[март]{.ru}', '[в ма́рте]{.ru}']}
  - {base: '[апре́ль]{.ru}', cells: ['[апре́ль]{.ru}', '[в апре́ле]{.ru}']}
  - {base: '[май]{.ru}', cells: ['[май]{.ru}', '[в ма́е]{.ru}']}
  - {base: '[ию́нь]{.ru}', cells: ['[ию́нь]{.ru}', '[в ию́не]{.ru}']}
  - {base: '[ию́ль]{.ru}', cells: ['[ию́ль]{.ru}', '[в ию́ле]{.ru}']}
  - {base: '[а́вгуст]{.ru}', cells: ['[а́вгуст]{.ru}', '[в а́вгусте]{.ru}']}
  - {base: '[сентя́брь]{.ru}', cells: ['[сентя́брь]{.ru}', '[в сентябре́]{.ru}']}
  - {base: '[октя́брь]{.ru}', cells: ['[октя́брь]{.ru}', '[в октябре́]{.ru}']}
  - {base: '[ноя́брь]{.ru}', cells: ['[ноя́брь]{.ru}', '[в ноябре́]{.ru}']}
  - {base: '[дека́брь]{.ru}', cells: ['[дека́брь]{.ru}', '[в декабре́]{.ru}']}
  why: |
    第 1–12 题：月份都是阳性，第六格词尾 [-е]{.ru}：[-ь]{.ru} 和 [-й]{.ru} 换成 [-е]{.ru}（[в апре́ле, в ма́е]{.ru}），硬辅音后加 [-е]{.ru}（[в ма́рте, в а́вгусте]{.ru}）。
    第 1、2、9–12 题：[янва́рь, февра́ль, сентя́брь, октя́брь, ноя́брь, дека́брь]{.ru} 变格时重音移到词尾：[в январе́, в сентябре́]{.ru}；其余六个月重音不动。
- id: L48-02
  tags: [序数词：性数形式]
  task: 写出序数词的四种性数形式。
  type: matrix
  cols: [数, 阳性, 阴性, 中性, 复数]
  given: [0]
  rows:
  - {base: '[1]{.ru}', cells: ['[1]{.ru}', '[пе́рвый]{.ru}', '[пе́рвая]{.ru}', '[пе́рвое]{.ru}', '[пе́рвые]{.ru}']}
  - {base: '[2]{.ru}', cells: ['[2]{.ru}', '[второ́й]{.ru}', '[втора́я]{.ru}', '[второ́е]{.ru}', '[вторы́е]{.ru}']}
  - {base: '[3]{.ru}', cells: ['[3]{.ru}', '[тре́тий]{.ru}', '[тре́тья]{.ru}', '[тре́тье]{.ru}', '[тре́тьи]{.ru}']}
  - {base: '[4]{.ru}', cells: ['[4]{.ru}', '[четвёртый]{.ru}', '[четвёртая]{.ru}', '[четвёртое]{.ru}', '[четвёртые]{.ru}']}
  - {base: '[8]{.ru}', cells: ['[8]{.ru}', '[восьмо́й]{.ru}', '[восьма́я]{.ru}', '[восьмо́е]{.ru}', '[восьмы́е]{.ru}']}
  - {base: '[21]{.ru}', cells: ['[21]{.ru}', '[два́дцать пе́рвый]{.ru}', '[два́дцать пе́рвая]{.ru}', '[два́дцать пе́рвое]{.ru}', '[два́дцать пе́рвые]{.ru}']}
  - {base: '[22]{.ru}', cells: ['[22]{.ru}', '[два́дцать второ́й]{.ru}', '[два́дцать втора́я]{.ru}', '[два́дцать второ́е]{.ru}', '[два́дцать вторы́е]{.ru}']}
  - {base: '[23]{.ru}', cells: ['[23]{.ru}', '[два́дцать тре́тий]{.ru}', '[два́дцать тре́тья]{.ru}', '[два́дцать тре́тье]{.ru}', '[два́дцать тре́тьи]{.ru}']}
  - {base: '[34]{.ru}', cells: ['[34]{.ru}', '[три́дцать четвёртый]{.ru}', '[три́дцать четвёртая]{.ru}', '[три́дцать четвёртое]{.ru}', '[три́дцать четвёртые]{.ru}']}
  - {base: '[48]{.ru}', cells: ['[48]{.ru}', '[со́рок восьмо́й]{.ru}', '[со́рок восьма́я]{.ru}', '[со́рок восьмо́е]{.ru}', '[со́рок восьмы́е]{.ru}']}
  - {base: '[31]{.ru}', cells: ['[31]{.ru}', '[три́дцать пе́рвый]{.ru}', '[три́дцать пе́рвая]{.ru}', '[три́дцать пе́рвое]{.ru}', '[три́дцать пе́рвые]{.ru}']}
  why: |
    第 1、4 题：[пе́рвый, четвёртый]{.ru} 像 [но́вый]{.ru}：[-ый, -ая, -ое, -ые]{.ru}。
    第 2、5 题：[второ́й, восьмо́й]{.ru} 重音在词尾，像 [молодо́й]{.ru}：[-о́й, -а́я, -о́е, -ы́е]{.ru}。
    第 3 题：[тре́тий]{.ru} 特殊，词尾前有 [ь]{.ru}：[тре́тья, тре́тье, тре́тьи]{.ru}。
    第 6–11 题：复合序数词只把最后一个词变成序数词，前面的 [два́дцать, три́дцать, со́рок]{.ru} 不变，最后一个词按第 1–5 题的方法变。
- id: L48-03
  tags: [序数词：第六格词组]
  task: 写出序数词和名词表示处所的词组。
  type: matrix
  cols: [原形, 第六格词组]
  given: [0]
  rows:
  - {base: '[2, курс]{.ru}', cells: ['[2, курс]{.ru}', '[на второ́м ку́рсе]{.ru}']}
  - {base: '[1, курс]{.ru}', cells: ['[1, курс]{.ru}', '[на пе́рвом ку́рсе]{.ru}']}
  - {base: '[8, класс]{.ru}', cells: ['[8, класс]{.ru}', '[в восьмо́м кла́ссе]{.ru}']}
  - {base: '[2, класс]{.ru}', cells: ['[2, класс]{.ru}', '[во второ́м кла́ссе]{.ru}']}
  - {base: '[3, аудито́рия]{.ru}', cells: ['[3, аудито́рия]{.ru}', '[в тре́тьей аудито́рии]{.ru}']}
  - {base: '[4, ваго́н]{.ru}', cells: ['[4, ваго́н]{.ru}', '[в четвёртом ваго́не]{.ru}']}
  - {base: '[1, ваго́н]{.ru}', cells: ['[1, ваго́н]{.ru}', '[в пе́рвом ваго́не]{.ru}']}
  - {base: '[3, ваго́н]{.ru}', cells: ['[3, ваго́н]{.ru}', '[в тре́тьем ваго́не]{.ru}']}
  - {base: '[1, уро́к]{.ru}', cells: ['[1, уро́к]{.ru}', '[на пе́рвом уро́ке]{.ru}']}
  - {base: '[3, ле́кция]{.ru}', cells: ['[3, ле́кция]{.ru}', '[на тре́тьей ле́кции]{.ru}']}
  - {base: '[4, кварти́ра]{.ru}', cells: ['[4, кварти́ра]{.ru}', '[в четвёртой кварти́ре]{.ru}']}
  - {base: '[8, авто́бус]{.ru}', cells: ['[8, авто́бус]{.ru}', '[в восьмо́м авто́бусе]{.ru}']}
  - {base: '[2, неде́ля]{.ru}', cells: ['[2, неде́ля]{.ru}', '[на второ́й неде́ле]{.ru}']}
  - {base: '[2, зда́ние]{.ru}', cells: ['[2, зда́ние]{.ru}', '[во второ́м зда́нии]{.ru}']}
  - {base: '[4, семина́р]{.ru}', cells: ['[4, семина́р]{.ru}', '[на четвёртом семина́ре]{.ru}']}
  - {base: '[8, ко́мната]{.ru}', cells: ['[8, ко́мната]{.ru}', '[в восьмо́й ко́мнате]{.ru}']}
  why: |
    第 1–16 题：序数词按形容词变第六格：阳性、中性 [-ом]{.ru}（[пе́рвом, второ́м, четвёртом, восьмо́м]{.ru}），阴性 [-ой]{.ru}（[второ́й, четвёртой, восьмо́й]{.ru}）。名词按自己的类型变。
    第 5、8、10 题：[тре́тий]{.ru} 保留 [ь]{.ru}：阳性 [в тре́тьем]{.ru}，阴性 [в тре́тьей]{.ru}。
    第 4、14 题：[в]{.ru} 在 [вт-]{.ru} 前面要写成 [во]{.ru}：[во второ́м]{.ru}。
    第 5、10、14 题：[аудито́рия, ле́кция, зда́ние]{.ru} 第六格用 [-ии]{.ru}。
    第 13、16 题：[второ́й, восьмо́й]{.ru} 的阴性第六格和阳性第一格同形：[на второ́й неде́ле, в восьмо́й ко́мнате]{.ru}，要看名词判断。
    [курс, уро́к, ле́кция, неде́ля, семина́р]{.ru} 前用 [на]{.ru}，其余用 [в]{.ru}，和第 12 课学的搭配一样。
- id: L48-04
  tags: [序数词：句中配合]
  task: 用括号里序数词的适当形式填空。
  type: fill
  items:
  - {stem: 'Ми́ша у́чится в ___ кла́ссе.', hint: восьмо́й, accept: [восьмо́м]}
  - {stem: 'Э́то мой ___ ме́сяц в Москве́.', hint: пе́рвый, accept: [пе́рвый]}
  - {stem: 'Ми́ша чита́ет ___ кни́гу.', hint: тре́тий, accept: [тре́тью]}
  - {stem: 'А́нна у́чится на ___ ку́рсе.', hint: второ́й, accept: [второ́м]}
  - {stem: 'Сего́дня у нас ___ уро́к.', hint: четвёртый, accept: [четвёртый]}
  - {stem: 'Ван Лэй живёт на ___ у́лице.', hint: восьмо́й, accept: [восьмо́й]}
  - {stem: 'Э́то ___ упражне́ние.', hint: тре́тий, accept: [тре́тье]}
  - {stem: 'Мы живём в ___ кварти́ре.', hint: пе́рвый, accept: [пе́рвой]}
  - {stem: 'Мы живём в ___ до́ме.', hint: четвёртый, accept: [четвёртом]}
  - {stem: 'Мы чита́ем ___ расска́з.', hint: второ́й, accept: [второ́й]}
  - {stem: 'Студе́нты пи́шут ___ упражне́ние.', hint: четвёртый, accept: [четвёртое]}
  - {stem: 'А́нна сиди́т в ___ ваго́не.', hint: тре́тий, accept: [тре́тьем]}
  why: |
    第 2、5、10 题：名词是阳性第一格或非动物第四格，序数词用阳性第一格形式：[пе́рвый, четвёртый, второ́й]{.ru}。
    第 7、11 题：中性名词 [упражне́ние]{.ru}，用 [тре́тье, четвёртое]{.ru}；第四格同第一格。
    第 3 题：阴性第四格 [тре́тью]{.ru}，词尾前保留 [ь]{.ru}。
    第 1、4、9、12 题：阳性第六格 [-ом]{.ru}：[в восьмо́м кла́ссе, на второ́м ку́рсе, в четвёртом до́ме, в тре́тьем ваго́не]{.ru}；[тре́тий]{.ru} 写成 [тре́тьем]{.ru}。
    第 6、8 题：阴性第六格 [-ой]{.ru}：[на восьмо́й у́лице, в пе́рвой кварти́ре]{.ru}。
