    - '[во́семь дете́й]{.ru}'
  why: '第 1、4、5、7、10、11、13 题：动物名词和 [два, три, четы́ре]{.ru} 连用，第四格同第二格，数词、名词都变：[двух студе́нтов, трёх подру́г, четырёх госте́й, двух сестёр, двух бра́тьев]{.ru}。[две]{.ru} 的第二格也是 [двух]{.ru}。

    第 2、6、9、14 题：[пять]{.ru} 以上的数词，即使跟动物名词连用，第四格也同第一格：[пять студе́нтов, шесть госте́й, во́семь дете́й]{.ru}。

    第 3、8、12 题：非动物名词，第四格同第一格：[два биле́та, три кни́ги, два ме́ста]{.ru}。'
- id: B2-L55-05
  tags:
  - 数词变格：句中
  task: 用文字写出括号里的数字，填空（句中）。
  type: fill
  items:
  - stem: Мы жи́ли в Ирку́тске о́коло ___ неде́ль.
    hint: '3'
    accept:
    - трёх
  - stem: Ми́ша пришёл домо́й к ___ часа́м.
    hint: '5'
    accept:
    - пяти́
  - stem: Ба́бушка живёт с ___ ко́шками.
    hint: '2'
    accept:
    - двумя́
  - stem: Ле́кция начала́сь без ___ студе́нтов.
    hint: '4'
    accept:
    - четырёх
  - stem: Ван Лэй написа́л пи́сьма ___ друзья́м.
    hint: '3'
    accept:
    - трём
  - stem: Э́тот по́езд идёт бо́льше ___ часо́в.
    hint: '40'
    accept:
    - сорока́
  - stem: Я заплати́л о́коло ___ рубле́й.
    hint: '1000'
    accept:
    - ты́сячи
  - stem: Мы говори́ли об ___ кни́ге.
    hint: '1'
    accept:
    - одно́й
  - stem: Ме́жду ___ дома́ми есть ма́ленький парк.
    hint: '2'
    accept:
    - двумя́
  - stem: По́езд остана́вливается в ___ города́х.
    hint: '8'
    accept:
    - восьми́
  - stem: Студе́нты прие́хали из ___ стран.
    hint: '11'
    accept:
    - оди́ннадцати
  - stem: Учи́тель дал зада́ние ___ студе́нтам.
    hint: '25'
    accept:
    - двадцати́ пяти́
  why: '第 1、4、6、7、11 题：[о́коло, без, бо́льше, из]{.ru} 要求第二格：[трёх, четырёх, сорока́, ты́сячи, оди́ннадцати]{.ru}；名词已经是复数第二格。

    第 2、5、12 题：[к]{.ru} 和第三格动词：[к пяти́ часа́м, трём друзья́м, двадцати́ пяти́ студе́нтам]{.ru}，合成数词两部分都变。

    第 3、9 题：[с, ме́жду]{.ru} + 第五格：[двумя́]{.ru}。

    第 10 题：第六格：[в восьми́ города́х]{.ru}。

    第 8 题：[оди́н]{.ru} 和名词同性同格：[об одно́й кни́ге]{.ru}（[об]{.ru} 已印出）。'
