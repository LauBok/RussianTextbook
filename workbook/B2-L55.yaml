  type: matrix
  cols:
  - 动词 + 数量词组
  - 第四格
  given:
  - 0
  rows:
  - base: '[ви́жу + два студе́нта]{.ru}'
    cells:
    - '[ви́жу + два студе́нта]{.ru}'
    - '[двух студе́нтов]{.ru}'
  - base: '[ви́жу + пять студе́нтов]{.ru}'
    cells:
    - '[ви́жу + пять студе́нтов]{.ru}'
    - '[пять студе́нтов]{.ru}'
  - base: '[купи́л + два биле́та]{.ru}'
    cells:
    - '[купи́л + два биле́та]{.ru}'
    - '[два биле́та]{.ru}'
  - base: '[встре́тил + три подру́ги]{.ru}'
    cells:
    - '[встре́тил + три подру́ги]{.ru}'
    - '[трёх подру́г]{.ru}'
  - base: '[пригласи́ли + четы́ре го́стя]{.ru}'
    cells:
    - '[пригласи́ли + четы́ре го́стя]{.ru}'
    - '[четырёх госте́й]{.ru}'
  - base: '[пригласи́ли + шесть госте́й]{.ru}'
    cells:
    - '[пригласи́ли + шесть госте́й]{.ru}'
    - '[шесть госте́й]{.ru}'
  - base: '[ждём + две сестры́]{.ru}'
    cells:
    - '[ждём + две сестры́]{.ru}'
    - '[двух сестёр]{.ru}'
  - base: '[взял + три кни́ги]{.ru}'
    cells:
    - '[взял + три кни́ги]{.ru}'
    - '[три кни́ги]{.ru}'
  - base: '[зна́ю + два́дцать студе́нтов]{.ru}'
    cells:
    - '[зна́ю + два́дцать студе́нтов]{.ru}'
    - '[два́дцать студе́нтов]{.ru}'
  - base: '[по́мню + четы́ре учи́теля]{.ru}'
    cells:
    - '[по́мню + четы́ре учи́теля]{.ru}'
    - '[четырёх учителе́й]{.ru}'
  - base: '[ко́рмит + две ко́шки]{.ru}'
    cells:
    - '[ко́рмит + две ко́шки]{.ru}'
    - '[двух ко́шек]{.ru}'
  - base: '[заказа́л + два ме́ста]{.ru}'
    cells:
    - '[заказа́л + два ме́ста]{.ru}'
    - '[два ме́ста]{.ru}'
  - base: '[люблю́ + два бра́та]{.ru}'
    cells:
    - '[люблю́ + два бра́та]{.ru}'
    - '[двух бра́тьев]{.ru}'
  - base: '[ви́дел + во́семь дете́й]{.ru}'
    cells:
