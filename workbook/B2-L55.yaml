heading: 第 55 课　数词的变格
groups:
- id: B2-L55-01
  tags:
  - 数词变格：基数词各格
  task: 写出数词的第二、三、五、六格（第六格连同前置词写）。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[оди́н]{.ru}'
    cells:
    - '[оди́н]{.ru}'
    - '[одного́]{.ru}'
    - '[одному́]{.ru}'
    - '[одни́м]{.ru}'
    - '[об одно́м]{.ru}'
  - base: '[одна́]{.ru}'
    cells:
    - '[одна́]{.ru}'
    - '[одно́й]{.ru}'
    - '[одно́й]{.ru}'
    - '[одно́й]{.ru}'
    - '[об одно́й]{.ru}'
  - base: '[два]{.ru}'
    cells:
    - '[два]{.ru}'
    - '[двух]{.ru}'
    - '[двум]{.ru}'
    - '[двумя́]{.ru}'
    - '[о двух]{.ru}'
  - base: '[три]{.ru}'
    cells:
    - '[три]{.ru}'
    - '[трёх]{.ru}'
    - '[трём]{.ru}'
    - '[тремя́]{.ru}'
    - '[о трёх]{.ru}'
  - base: '[четы́ре]{.ru}'
    cells:
    - '[четы́ре]{.ru}'
    - '[четырёх]{.ru}'
    - '[четырём]{.ru}'
    - '[четырьмя́]{.ru}'
    - '[о четырёх]{.ru}'
  - base: '[пять]{.ru}'
    cells:
    - '[пять]{.ru}'
    - '[пяти́]{.ru}'
    - '[пяти́]{.ru}'
    - '[пятью́]{.ru}'
    - '[о пяти́]{.ru}'
  - base: '[во́семь]{.ru}'
    cells:
    - '[во́семь]{.ru}'
    - '[восьми́]{.ru}'
    - '[восьми́]{.ru}'
    - '[восемью́]{.ru}'
    - '[о восьми́]{.ru}'
  - base: '[де́сять]{.ru}'
    cells:
    - '[де́сять]{.ru}'
    - '[десяти́]{.ru}'
    - '[десяти́]{.ru}'
    - '[десятью́]{.ru}'
    - '[о десяти́]{.ru}'
  - base: '[оди́ннадцать]{.ru}'
    cells:
    - '[оди́ннадцать]{.ru}'
    - '[оди́ннадцати]{.ru}'
    - '[оди́ннадцати]{.ru}'
    - '[оди́ннадцатью]{.ru}'
    - '[об оди́ннадцати]{.ru}'
  - base: '[пятна́дцать]{.ru}'
    cells:
    - '[пятна́дцать]{.ru}'
    - '[пятна́дцати]{.ru}'
    - '[пятна́дцати]{.ru}'
    - '[пятна́дцатью]{.ru}'
    - '[о пятна́дцати]{.ru}'
  - base: '[два́дцать]{.ru}'
    cells:
    - '[два́дцать]{.ru}'
    - '[двадцати́]{.ru}'
    - '[двадцати́]{.ru}'
    - '[двадцатью́]{.ru}'
    - '[о двадцати́]{.ru}'
  - base: '[со́рок]{.ru}'
    cells:
    - '[со́рок]{.ru}'
    - '[сорока́]{.ru}'
    - '[сорока́]{.ru}'
    - '[сорока́]{.ru}'
    - '[о сорока́]{.ru}'
  - base: '[девяно́сто]{.ru}'
    cells:
    - '[девяно́сто]{.ru}'
    - '[девяно́ста]{.ru}'
    - '[девяно́ста]{.ru}'
    - '[девяно́ста]{.ru}'
    - '[о девяно́ста]{.ru}'
  - base: '[сто]{.ru}'
    cells:
    - '[сто]{.ru}'
    - '[ста]{.ru}'
    - '[ста]{.ru}'
    - '[ста]{.ru}'
    - '[о ста]{.ru}'
  - base: '[ты́сяча]{.ru}'
    cells:
    - '[ты́сяча]{.ru}'
    - '[ты́сячи]{.ru}'
    - '[ты́сяче]{.ru}'
    - '[ты́сячей]{.ru}'
    - '[о ты́сяче]{.ru}'
  why: '第 1、2 题：[оди́н]{.ru} 像 [э́тот]{.ru} 一样变格：[одного́, одному́, одни́м]{.ru}；阴性 [одно́й]{.ru} 第二、三、五格同形。第六格以元音开头，前置词用 [об]{.ru}：[об одно́м, об одно́й]{.ru}。

    第 3–5 题：[двух, двум, двумя́；трёх, трём, тремя́；четырёх, четырём, четырьмя́]{.ru}，第二格和第六格同形。[четырьмя́]{.ru} 里有 [ь]{.ru}，[тремя́]{.ru} 里没有，容易写混。

    第 6–8、11 题：[пять]{.ru}–[де́сять]{.ru}、[два́дцать]{.ru} 像阴性 [-ь]{.ru} 名词：第二、三、六格 [-и́]{.ru}，第五格 [-ью́]{.ru}，重音移到词尾：[пяти́, пятью́, двадцати́]{.ru}。

    第 7 题：[во́семь]{.ru} 变格时 [е]{.ru} 脱落：[восьми́]{.ru}；第五格是 [восемью́]{.ru}（也说 [восьмью́]{.ru}）。

    第 9、10 题：[оди́ннадцать]{.ru}–[девятна́дцать]{.ru} 重音不动：[оди́ннадцати, пятна́дцатью]{.ru}；[оди́ннадцать]{.ru} 以元音开头，第六格用 [об]{.ru}。

    第 12–14 题：[со́рок, девяно́сто, сто]{.ru} 的间接格只有一个形式：[сорока́, девяно́ста, ста]{.ru}，第五格也一样，不要按 [пять]{.ru} 写成 *[сорокью́]{.ru}*。

    第 15 题：[ты́сяча]{.ru} 像 [встре́ча]{.ru} 一样变格：[ты́сячи, ты́сяче, ты́сячей, о ты́сяче]{.ru}。'
- id: B2-L55-02
  tags:
  - 数词变格：数量词组的第二、三格
  task: 写出数量词组的第二格和第三格。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第三格
  given:
  - 0
  rows:
  - base: '[два ста́рых до́ма]{.ru}'
    cells:
    - '[два ста́рых до́ма]{.ru}'
    - '[двух ста́рых домо́в]{.ru}'
    - '[двум ста́рым дома́м]{.ru}'
  - base: '[три но́вых студе́нта]{.ru}'
    cells:
    - '[три но́вых студе́нта]{.ru}'
    - '[трёх но́вых студе́нтов]{.ru}'
    - '[трём но́вым студе́нтам]{.ru}'
  - base: '[четы́ре ру́сских го́рода]{.ru}'
    cells:
    - '[четы́ре ру́сских го́рода]{.ru}'
    - '[четырёх ру́сских городо́в]{.ru}'
    - '[четырём ру́сским города́м]{.ru}'
  - base: '[пять ни́жних по́лок]{.ru}'
    cells:
    - '[пять ни́жних по́лок]{.ru}'
    - '[пяти́ ни́жних по́лок]{.ru}'
    - '[пяти́ ни́жним по́лкам]{.ru}'
  - base: '[во́семь иностра́нных студе́нток]{.ru}'
    cells:
    - '[во́семь иностра́нных студе́нток]{.ru}'
    - '[восьми́ иностра́нных студе́нток]{.ru}'
    - '[восьми́ иностра́нным студе́нткам]{.ru}'
  - base: '[со́рок рубле́й]{.ru}'
    cells:
    - '[со́рок рубле́й]{.ru}'
    - '[сорока́ рубле́й]{.ru}'
    - '[сорока́ рубля́м]{.ru}'
  - base: '[сто киломе́тров]{.ru}'
    cells:
    - '[сто киломе́тров]{.ru}'
    - '[ста киломе́тров]{.ru}'
    - '[ста киломе́трам]{.ru}'
  - base: '[два́дцать два биле́та]{.ru}'
    cells:
    - '[два́дцать два биле́та]{.ru}'
    - '[двадцати́ двух биле́тов]{.ru}'
    - '[двадцати́ двум биле́там]{.ru}'
  - base: '[ты́сяча рубле́й]{.ru}'
    cells:
    - '[ты́сяча рубле́й]{.ru}'
    - '[ты́сячи рубле́й]{.ru}'
    - '[ты́сяче рубле́й]{.ru}'
  why: '第 1–3 题：数词在间接格里，名词和形容词跟数词同格，一律用复数：[двух ста́рых домо́в — двум ста́рым дома́м]{.ru}。不要沿用第一格的 [до́ма, студе́нта]{.ru}（单数第二格）。

    第 4、5 题：[пять]{.ru} 以上的第二格看上去和第一格的词组一样（[пять ни́жних по́лок → пяти́ ни́жних по́лок]{.ru}），只有数词变；第三格名词、形容词都变：[пяти́ ни́жним по́лкам, восьми́ иностра́нным студе́нткам]{.ru}。

    第 6、7 题：[сорока́, ста]{.ru} 在第二、三格同形，名词照常变：[сорока́ рубля́м, ста киломе́трам]{.ru}。

    第 8 题：合成数词每一部分都变：[двадцати́ двух биле́тов, двадцати́ двум биле́там]{.ru}。

    第 9 题：[ты́сяча]{.ru} 按名词变，后面的名词总用复数第二格：[ты́сячи рубле́й, ты́сяче рубле́й]{.ru}，不写 *[ты́сяче рубля́м]{.ru}*。'
- id: B2-L55-03
  tags:
  - 数词变格：数量词组的第五、六格
  task: 写出数量词组的第五格和第六格（第六格连同前置词写）。
  type: matrix
  cols:
  - 第一格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[две больши́е ко́мнаты]{.ru}'
    cells:
    - '[две больши́е ко́мнаты]{.ru}'
    - '[двумя́ больши́ми ко́мнатами]{.ru}'
    - '[о двух больши́х ко́мнатах]{.ru}'
  - base: '[три хоро́ших дру́га]{.ru}'
    cells:
    - '[три хоро́ших дру́га]{.ru}'
    - '[тремя́ хоро́шими друзья́ми]{.ru}'
    - '[о трёх хоро́ших друзья́х]{.ru}'
  - base: '[четы́ре ни́жних ме́ста]{.ru}'
    cells:
    - '[четы́ре ни́жних ме́ста]{.ru}'
    - '[четырьмя́ ни́жними места́ми]{.ru}'
    - '[о четырёх ни́жних места́х]{.ru}'
  - base: '[шесть ста́рых домо́в]{.ru}'
    cells:
    - '[шесть ста́рых домо́в]{.ru}'
    - '[шестью́ ста́рыми дома́ми]{.ru}'
    - '[о шести́ ста́рых дома́х]{.ru}'
  - base: '[де́вять ру́сских городо́в]{.ru}'
    cells:
    - '[де́вять ру́сских городо́в]{.ru}'
    - '[девятью́ ру́сскими города́ми]{.ru}'
    - '[о девяти́ ру́сских города́х]{.ru}'
  - base: '[девяно́сто мину́т]{.ru}'
    cells:
    - '[девяно́сто мину́т]{.ru}'
    - '[девяно́ста мину́тами]{.ru}'
    - '[о девяно́ста мину́тах]{.ru}'
  - base: '[три́дцать пять студе́нтов]{.ru}'
    cells:
    - '[три́дцать пять студе́нтов]{.ru}'
    - '[тридцатью́ пятью́ студе́нтами]{.ru}'
    - '[о тридцати́ пяти́ студе́нтах]{.ru}'
  - base: '[ты́сяча киломе́тров]{.ru}'
    cells:
    - '[ты́сяча киломе́тров]{.ru}'
    - '[ты́сячей киломе́тров]{.ru}'
    - '[о ты́сяче киломе́тров]{.ru}'
  why: '第 1–5 题：第五格名词、形容词都用复数 [-ами / -ыми, -ими]{.ru}，第六格用 [-ах / -ых, -их]{.ru}：[двумя́ больши́ми ко́мнатами, о двух больши́х ко́мнатах]{.ru}。注意 [четырьмя́, шестью́, девятью́]{.ru} 的写法和重音。

    第 2 题：[друг]{.ru} 的复数是 [друзья́]{.ru}：[друзья́ми, о друзья́х]{.ru}。

    第 6 题：[девяно́сто]{.ru} 第五格仍是 [девяно́ста]{.ru}，名词照常变：[девяно́ста мину́тами]{.ru}。

    第 7 题：合成数词两部分都变：[тридцатью́ пятью́ студе́нтами, о тридцати́ пяти́ студе́нтах]{.ru}。

    第 8 题：[ты́сяча]{.ru} 本身变成 [ты́сячей, о ты́сяче]{.ru}，后面的名词保持复数第二格 [киломе́тров]{.ru}。'
- id: B2-L55-04
  tags:
