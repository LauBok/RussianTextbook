heading: 第 42 课　前缀 пере-、про- 和 за-
groups:
- id: B2-L42-01
  tags:
  - 前缀 пере- / про- / за-：变位
  task: 写出动词的现在时和过去时。
  type: matrix
  cols:
  - 动词对
  - 未完成体 [он]{.ru}
  - 完成体过去时阳性
  - 完成体过去时阴性
  given:
  - 0
  rows:
  - base: '[переходи́ть / перейти́]{.ru}'
    cells:
    - '[переходи́ть / перейти́]{.ru}'
    - '[перехо́дит]{.ru}'
    - '[перешёл]{.ru}'
    - '[перешла́]{.ru}'
  - base: '[переплыва́ть / переплы́ть]{.ru}'
    cells:
    - '[переплыва́ть / переплы́ть]{.ru}'
    - '[переплыва́ет]{.ru}'
    - '[переплы́л]{.ru}'
    - '[переплыла́]{.ru}'
  - base: '[проходи́ть / пройти́]{.ru}'
    cells:
    - '[проходи́ть / пройти́]{.ru}'
    - '[прохо́дит]{.ru}'
    - '[прошёл]{.ru}'
    - '[прошла́]{.ru}'
  - base: '[проезжа́ть / прое́хать]{.ru}'
    cells:
    - '[проезжа́ть / прое́хать]{.ru}'
    - '[проезжа́ет]{.ru}'
    - '[прое́хал]{.ru}'
    - '[прое́хала]{.ru}'
  - base: '[проплыва́ть / проплы́ть]{.ru}'
    cells:
    - '[проплыва́ть / проплы́ть]{.ru}'
    - '[проплыва́ет]{.ru}'
    - '[проплы́л]{.ru}'
    - '[проплыла́]{.ru}'
  - base: '[заходи́ть / зайти́]{.ru}'
    cells:
    - '[заходи́ть / зайти́]{.ru}'
    - '[захо́дит]{.ru}'
    - '[зашёл]{.ru}'
    - '[зашла́]{.ru}'
  - base: '[заезжа́ть / зае́хать]{.ru}'
    cells:
    - '[заезжа́ть / зае́хать]{.ru}'
    - '[заезжа́ет]{.ru}'
    - '[зае́хал]{.ru}'
    - '[зае́хала]{.ru}'
  why: |-
    第 1、3、6 题：[-ходи́ть]{.ru} 未完成体重音在词干：[перехо́дит, прохо́дит, захо́дит]{.ru}；完成体过去时照 [шёл, шла]{.ru}：[перешёл, прошла́, зашла́]{.ru}。
    第 2、5 题：[пла́вать]{.ru} 加前缀变成 [-плыва́ть]{.ru}：[переплыва́ет]{.ru}；完成体过去时阴性重音在词尾：[переплыла́, проплыла́]{.ru}，和 [плыла́]{.ru} 一样。
    第 4、7 题：[-езжа́ть]{.ru} 第一变位：[проезжа́ет, заезжа́ет]{.ru}；完成体 [прое́хал, зае́хала]{.ru}。
- id: B2-L42-02
  tags:
  - 前缀 пере- / про- / за-：搭配
  task: 按括号里的意思写出词组。
  type: matrix
  cols:
  - 动词 + 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[перейти́ + у́лица]{.ru}'
    cells:
    - '[перейти́ + у́лица]{.ru}'
    - '[перейти́ (че́рез) у́лицу]{.ru}'
    hint: 过马路
  - base: '[переплы́ть + река́]{.ru}'
    cells:
    - '[переплы́ть + река́]{.ru}'
    - '[переплы́ть (че́рез) ре́ку]{.ru}'
    hint: 游到对岸
  - base: '[пройти́ + Кремль]{.ru}'
    cells:
    - '[пройти́ + Кремль]{.ru}'
    - '[пройти́ ми́мо Кремля́]{.ru}'
    hint: 从旁边经过
  - base: '[прое́хать + мост]{.ru}'
    cells:
    - '[прое́хать + мост]{.ru}'
    - '[прое́хать по мосту́]{.ru}'
    hint: 从桥上开过
  - base: '[зайти́ + апте́ка]{.ru}'
    cells:
    - '[зайти́ + апте́ка]{.ru}'
    - '[зайти́ в апте́ку]{.ru}'
    hint: 顺路进去
  - base: '[зайти́ + хлеб]{.ru}'
    cells:
    - '[зайти́ + хлеб]{.ru}'
    - '[зайти́ за хле́бом]{.ru}'
    hint: 顺路去买
  - base: '[зайти́ + друг]{.ru}'
    cells:
    - '[зайти́ + друг]{.ru}'
    - '[зайти́ к дру́гу]{.ru}'
    hint: 顺路去他家
  - base: '[зае́хать + Ю́ми]{.ru}'
    cells:
    - '[зае́хать + Ю́ми]{.ru}'
    - '[зае́хать за Ю́ми]{.ru}'
    hint: 开车顺路接
  - base: '[пройти́ + парк]{.ru}'
    cells:
    - '[пройти́ + парк]{.ru}'
    - '[пройти́ че́рез парк]{.ru}'
    hint: 从中间穿过
  - base: '[проплы́ть + о́стров]{.ru}'
    cells:
    - '[проплы́ть + о́стров]{.ru}'
    - '[проплы́ть ми́мо о́строва]{.ru}'
    hint: 从旁边驶过
  - base: '[прое́хать + наш дом]{.ru}'
    cells:
    - '[прое́хать + наш дом]{.ru}'
    - '[прое́хать ми́мо на́шего до́ма]{.ru}'
    hint: 从旁边开过
  - base: '[пройти́ + весь го́род]{.ru}'
    cells:
    - '[пройти́ + весь го́род]{.ru}'
    - '[пройти́ весь го́род]{.ru}'
    hint: 走遍
  - base: '[зайти́ + по́чта]{.ru}'
    cells:
    - '[зайти́ + по́чта]{.ru}'
    - '[зайти́ на по́чту]{.ru}'
    hint: 顺路进去
  - base: '[перейти́ + пло́щадь]{.ru}'
    cells:
    - '[перейти́ + пло́щадь]{.ru}'
    - '[перейти́ (че́рез) пло́щадь]{.ru}'
    hint: 穿过广场
  - base: '[зае́хать + ба́бушка]{.ru}'
    cells:
    - '[зае́хать + ба́бушка]{.ru}'
    - '[зае́хать к ба́бушке]{.ru}'
    hint: 开车顺路去她那儿
  - base: '[пройти́ + два киломе́тра]{.ru}'
    cells:
    - '[пройти́ + два киломе́тра]{.ru}'
    - '[пройти́ два киломе́тра]{.ru}'
    hint: 走完一段路
  why: |-
    第 1、2、14 题：[пере-]{.ru} 后直接用第四格，也可以加 [че́рез]{.ru}：[перейти́ у́лицу = перейти́ че́рез у́лицу]{.ru}。[ре́ку]{.ru} 重音在词干。
    第 3、10、11 题：从旁边经过用 [ми́мо]{.ru} + 第二格：[ми́мо Кремля́, ми́мо о́строва, ми́мо на́шего до́ма]{.ru}。
    第 4、9 题：从某处中间穿过用 [по]{.ru} + 第三格或 [че́рез]{.ru} + 第四格：[по мосту́, че́рез парк]{.ru}（也说 [по па́рку]{.ru}）。
    第 12、16 题：走完一段距离直接用第四格：[пройти́ весь го́род, два киломе́тра]{.ru}。
    第 5、13 题：顺路进某处用 [в / на]{.ru} + 第四格：[в апте́ку, на по́чту]{.ru}。
    第 7、15 题：到某人那里用 [к]{.ru} + 第三格：[к дру́гу, к ба́бушке]{.ru}。
    第 6、8 题：去取东西、接人用 [за]{.ru} + 第五格：[за хле́бом, за Ю́ми]{.ru}（[Ю́ми]{.ru} 不变格）。
- id: B2-L42-03
  tags:
  - пере- / про- / за-：意义
  task: 下面每件事该用哪个前缀？归入相应的栏。
  type: classify
  bins:
  - 越过（[пере-]{.ru}）
  - 经过（[про-]{.ru}）
  - 走完一段（[про-]{.ru}）
  - 顺路进去（[за-]{.ru}）
  - 去接人、取物（[за-]{.ru}）
  items:
  - text: 从马路这边走到那边（[у́лица]{.ru}）
    answer: 越过（[пере-]{.ru}）
  - text: 游过伏尔加河（[Во́лга]{.ru}）
    answer: 越过（[пере-]{.ru}）
  - text: 从桥上走到河对岸（[река́]{.ru}）
    answer: 越过（[пере-]{.ru}）
  - text: 公共汽车从剧院（[теа́тр]{.ru}）旁边开过
    answer: 经过（[про-]{.ru}）
  - text: 我们从图书馆（[библиоте́ка]{.ru}）门前走过，没进去
    answer: 经过（[про-]{.ru}）
  - text: 船从小岛（[о́стров]{.ru}）旁边驶过
    answer: 经过（[про-]{.ru}）
  - text: 一天走了二十公里（[два́дцать киломе́тров]{.ru}）
    answer: 走完一段（[про-]{.ru}）
  - text: 走遍了整个老城（[весь ста́рый го́род]{.ru}）
    answer: 走完一段（[про-]{.ru}）
  - text: 汽车开了一百公里（[сто киломе́тров]{.ru}）
    answer: 走完一段（[про-]{.ru}）
  - text: 下班路上进商店（[магази́н]{.ru}）看看
    answer: 顺路进去（[за-]{.ru}）
  - text: 去学校的路上到朋友家（[к дру́гу]{.ru}）坐一会儿
    answer: 顺路进去（[за-]{.ru}）
  - text: 散步时进咖啡馆（[кафе́]{.ru}）喝杯咖啡
    answer: 顺路进去（[за-]{.ru}）
  - text: 开车顺路去接安娜（[А́нна]{.ru}）
    answer: 去接人、取物（[за-]{.ru}）
  - text: 回家路上顺便去买面包（[хлеб]{.ru}）
    answer: 去接人、取物（[за-]{.ru}）
  - text: 到朋友家去取自己的书（[кни́ги]{.ru}）
    answer: 去接人、取物（[за-]{.ru}）
  why: |-
    第 1–3 题：从一边到另一边：[перейти́ у́лицу, переплы́ть Во́лгу, перейти́ ре́ку по мосту́]{.ru}。
    第 4–6 题：从旁边经过，不进去：[прое́хать ми́мо теа́тра, пройти́ ми́мо библиоте́ки, проплы́ть ми́мо о́строва]{.ru}。
    第 7–9 题：走完、开完一段距离，后面直接用第四格：[пройти́ два́дцать киломе́тров, пройти́ весь го́род, прое́хать сто киломе́тров]{.ru}。
    第 10–12 题：顺路进去一下：[зайти́ в магази́н, к дру́гу, в кафе́]{.ru}。
    第 13–15 题：去接人、取物用 [за]{.ru} + 第五格：[зае́хать за А́нной, зайти́ за хле́бом, за кни́гами]{.ru}。
- id: B2-L42-04
  tags:
  - пере- / про- / за-（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Здесь нельзя́ ___ у́лицу.
    hint: переходи́ть / перейти́
    accept:
    - переходи́ть
  - stem: Вчера́ по́сле рабо́ты па́па ___ в магази́н и купи́л молоко́.
    hint: заходи́ть / зайти́
    accept:
    - зашёл
  - stem: Каза́нку мы ___ по мосту́.
    hint: переходи́ть / перейти́
    accept:
    - перешли́
  - stem: Авто́бус ___ ми́мо на́шего до́ма ка́ждые де́сять мину́т.
    hint: проезжа́ть / прое́хать
    accept:
    - проезжа́ет
  - stem: Когда́ теплохо́д ___ ми́мо о́строва, мы фотографи́ровали.
    hint: проплыва́ть / проплы́ть
    accept:
    - проплыва́л
  - stem: Я ___ за тобо́й в семь часо́в, будь гото́ва!
    hint: заезжа́ть / зае́хать
    accept:
    - зае́ду
  - stem: Ди́ма ча́сто ___ к нам по́сле заня́тий.
    hint: заходи́ть / зайти́
    accept:
    - захо́дит
  - stem: Вчера́ мы ___ два́дцать киломе́тров.
    hint: проходи́ть / пройти́
    accept:
    - прошли́
  - stem: В мо́лодости де́душка ___ Во́лгу.
    hint: переплыва́ть / переплы́ть
    accept:
    - переплы́л
  - stem: Извини́те, как ___ к метро́?
    hint: проходи́ть / пройти́
    accept:
    - пройти́
  - stem: А́нна ___ ми́мо меня́ и не поздоро́валась.
    hint: проходи́ть / пройти́
    accept:
    - прошла́
  - stem: По доро́ге домо́й ___ за хле́бом, хорошо́?
    hint: заходи́ть / зайти́
    accept:
    - зайди́
  why: |-
    第 2、3、8、9、11 题：一次完成的动作，用完成体过去时：[зашёл, перешли́, прошли́, переплы́л, прошла́]{.ru}。[переплы́л]{.ru} 的重音和 [плыл]{.ru} 一样在词干。
    第 4、7 题：经常、反复，用未完成体现在时：[проезжа́ет, захо́дит]{.ru}。
    第 5 题：过程，同时还做着别的事，用未完成体过去时：[проплыва́л]{.ru}。
    第 6 题：将来一次，用完成体将来时：[зае́ду]{.ru}。
    第 1 题：[нельзя́]{.ru} 表示禁止，后面用未完成体：[нельзя́ переходи́ть]{.ru}。
    第 10 题：问路的固定说法 [Как пройти́…?]{.ru}。
    第 12 题：请对方顺路做一次，用完成体命令式：[зайди́]{.ru}。
