heading: 第 20 课　反身代词
groups:
- id: B2-L20-01
  tags:
  - 反身代词 себя：各格形式
  task: 在词组的空位写出 [себя́]{.ru} 的形式，并注明是第几格。
  type: matrix
  cols:
  - 词组
  - '[себя́]{.ru} 的形式'
  - 格
  given:
  - 0
  rows:
  - base: '[купи́ть ___ ку́ртку]{.ru}'
    cells:
    - '[купи́ть ___ ку́ртку]{.ru}'
    - '[себе́]{.ru}'
    - 第三格
  - base: '[взять с ___ зонт]{.ru}'
    cells:
    - '[взять с ___ зонт]{.ru}'
    - '[собо́й]{.ru}'
    - 第五格
  - base: '[ду́мать то́лько о ___]{.ru}'
    cells:
    - '[ду́мать то́лько о ___]{.ru}'
    - '[себе́]{.ru}'
    - 第六格
  - base: '[у ___ в ко́мнате]{.ru}'
    cells:
    - '[у ___ в ко́мнате]{.ru}'
    - '[себя́]{.ru}'
    - 第二格
  - base: '[бере́чь ___]{.ru}'
    cells:
    - '[бере́чь ___]{.ru}'
    - '[себя́]{.ru}'
    - 第四格
  - base: '[чу́вствовать ___ хорошо́]{.ru}'
    cells:
    - '[чу́вствовать ___ хорошо́]{.ru}'
    - '[себя́]{.ru}'
    - 第四格
  - base: '[уви́деть ___ в зе́ркале]{.ru}'
    cells:
    - '[уви́деть ___ в зе́ркале]{.ru}'
    - '[себя́]{.ru}'
    - 第四格
  - base: '[рассказа́ть о ___]{.ru}'
    cells:
    - '[рассказа́ть о ___]{.ru}'
    - '[себе́]{.ru}'
    - 第六格
  - base: '[горди́ться ___]{.ru}'
    cells:
    - '[горди́ться ___]{.ru}'
    - '[собо́й]{.ru}'
    - 第五格
  - base: '[пригото́вить ___ обе́д]{.ru}'
    cells:
    - '[пригото́вить ___ обе́д]{.ru}'
    - '[себе́]{.ru}'
    - 第三格
  - base: '[купи́ть пода́рок для ___]{.ru}'
    cells:
    - '[купи́ть пода́рок для ___]{.ru}'
    - '[себя́]{.ru}'
    - 第二格
  - base: '[спроси́ть ___]{.ru}'
    cells:
    - '[спроси́ть ___]{.ru}'
    - '[себя́]{.ru}'
    - 第四格
  - base: '[написа́ть ___ запи́ску]{.ru}'
    cells:
    - '[написа́ть ___ запи́ску]{.ru}'
    - '[себе́]{.ru}'
    - 第三格
  why: |-
    第 1、10、13 题：“给自己（买、做、写）”用第三格 [себе́]{.ru}。
    第 3、8 题：[о]{.ru} 后用第六格，也是 [себе́]{.ru}：[ду́мать о себе́, рассказа́ть о себе́]{.ru}。第三格和第六格同形，和 [тебе́]{.ru} 一样。
    第 2、9 题：第五格 [собо́й]{.ru}（对照 [тобо́й]{.ru}）：[взять с собо́й, горди́ться собо́й]{.ru}。
    第 4、11 题：[у, для]{.ru} 要求第二格 [себя́]{.ru}：[у себя́ в ко́мнате, для себя́]{.ru}。
    第 5–7、12 题：及物动词要求第四格，和第二格同形：[бере́чь себя́, чу́вствовать себя́, уви́деть себя́, спроси́ть себя́]{.ru}。[чу́вствовать себя́]{.ru} 里的 [себя́]{.ru} 不能省。
- id: B2-L20-02
  tags:
  - 反身代词 себя 与人称代词
  task: 同一个句子，空位分别指动作者本人和行末注明的另一个人，写出两种代词形式。
  type: matrix
  cols:
  - 句子
  - 指动作者本人
  - 指另一个人
  given:
  - 0
  rows:
  - base: '[Ди́ма купи́л ___ ку́ртку.]{.ru}'
    cells:
    - '[Ди́ма купи́л ___ ку́ртку.]{.ru}'
    - '[себе́]{.ru}'
    - '[ему́]{.ru}'
    hint: 另一人：他
  - base: '[А́нна уви́дела ___ в зе́ркале.]{.ru}'
    cells:
    - '[А́нна уви́дела ___ в зе́ркале.]{.ru}'
    - '[себя́]{.ru}'
    - '[её]{.ru}'
    hint: 另一人：她
  - base: '[Пьер ду́мает то́лько о ___.]{.ru}'
    cells:
    - '[Пьер ду́мает то́лько о ___.]{.ru}'
    - '[себе́]{.ru}'
    - '[нём]{.ru}'
    hint: 另一人：他
  - base: '[Ю́ми чита́ет кни́гу для ___.]{.ru}'
    cells:
    - '[Ю́ми чита́ет кни́гу для ___.]{.ru}'
    - '[себя́]{.ru}'
    - '[неё]{.ru}'
    hint: 另一人：她
  - base: '[Ми́ша рассказа́л о ___.]{.ru}'
    cells:
    - '[Ми́ша рассказа́л о ___.]{.ru}'
    - '[себе́]{.ru}'
    - '[них]{.ru}'
    hint: 另一人：他们
  - base: '[Мы купи́ли ___ биле́ты.]{.ru}'
    cells:
    - '[Мы купи́ли ___ биле́ты.]{.ru}'
    - '[себе́]{.ru}'
    - '[им]{.ru}'
    hint: 另一人：他们
  - base: '[Ты ви́дишь ___ на фо́то?]{.ru}'
    cells:
    - '[Ты ви́дишь ___ на фо́то?]{.ru}'
    - '[себя́]{.ru}'
    - '[меня́]{.ru}'
    hint: 另一人：我
  - base: '[Я пригото́вил ___ чай.]{.ru}'
    cells:
    - '[Я пригото́вил ___ чай.]{.ru}'
    - '[себе́]{.ru}'
    - '[тебе́]{.ru}'
    hint: 另一人：你
  - base: '[Ма́ма сказа́ла Ми́ше купи́ть ___ шарф.]{.ru}'
    cells:
    - '[Ма́ма сказа́ла Ми́ше купи́ть ___ шарф.]{.ru}'
    - '[себе́]{.ru}'
    - '[ей]{.ru}'
    hint: 另一人：妈妈
  - base: '[Береги́ ___!]{.ru}'
    cells:
    - '[Береги́ ___!]{.ru}'
    - '[себя́]{.ru}'
    - '[её]{.ru}'
    hint: 另一人：她
  - base: '[Ива́н Серге́евич у ___ в кабине́те.]{.ru}'
    cells:
    - '[Ива́н Серге́евич у ___ в кабине́те.]{.ru}'
    - '[себя́]{.ru}'
    - '[него́]{.ru}'
    hint: 另一人：他
  - base: '[Де́ти говори́ли о ___.]{.ru}'
    cells:
    - '[Де́ти говори́ли о ___.]{.ru}'
    - '[себе́]{.ru}'
    - '[нас]{.ru}'
    hint: 另一人：我们
  - base: '[Па́па попроси́л А́нну пригото́вить ___ обе́д.]{.ru}'
    cells:
    - '[Па́па попроси́л А́нну пригото́вить ___ обе́д.]{.ru}'
    - '[себе́]{.ru}'
    - '[ему́]{.ru}'
    hint: 另一人：爸爸
  why: |-
    第 1–8、10–12 题：指主语本人用 [себя́]{.ru}，不管主语是 [я, ты, мы]{.ru} 还是 [он, она́]{.ru}：[Ты ви́дишь себя́, Мы купи́ли себе́]{.ru}；指别人用人称代词，前置词后第三人称加 [н-]{.ru}：[о нём, для неё, у него́]{.ru}。第 3 题 [Пьер ду́мает то́лько о себе́]{.ru}，不说 [о нём]{.ru} 来指他自己；第 7 题不能写 [Я ви́жу меня́]{.ru} 这类句子。
    第 9、13 题：不定式句里 [себя́]{.ru} 指做不定式动作的人：买围巾的是米沙，[себе́]{.ru} 指米沙；做饭的是安娜，[себе́]{.ru} 指安娜。指妈妈、爸爸要用 [ей, ему́]{.ru}。
    第 10 题：命令式里 [себя́]{.ru} 指听话的人：[Береги́ себя́!]{.ru} 照顾好你自己。
- id: B2-L20-03
  tags:
  - 反身代词 себя：常用说法
  task: 用 [себя́]{.ru} 的正确形式填空（句中）。
  type: fill
  items:
  - stem: Как ты ___ чу́вствуешь?
    hint: себя́
    accept:
    - себя́
  - stem: Ба́бушка сего́дня чу́вствует ___ лу́чше.
    hint: себя́
    accept:
    - себя́
  - stem: Возьми́ с ___ шарф, на у́лице хо́лодно.
    hint: себя́
    accept:
    - собо́й
  - stem: Мы всегда́ берём с ___ слова́рь.
    hint: себя́
    accept:
    - собо́й
  - stem: Береги́те ___!
    hint: себя́
    accept:
    - себя́
  - stem: Ди́ма сейча́с у ___ в общежи́тии.
    hint: себя́
    accept:
    - себя́
  - stem: Не ду́май то́лько о ___!
    hint: себя́
    accept:
    - себе́
  - stem: Он купи́л ___ но́вый телефо́н.
    hint: себя́
    accept:
    - себе́
  - stem: Ю́ми не узна́ла ___ на ста́ром фо́то.
    hint: себя́
    accept:
    - себя́
  - stem: Расскажи́те, пожа́луйста, о ___.
    hint: себя́
    accept:
    - себе́
  why: |-
    第 1、2 题：[чу́вствовать себя́]{.ru} 是固定说法，[себя́]{.ru} 第四格，不能省。
    第 3、4 题：[взять с собо́й]{.ru}“随身带上”，[с]{.ru} + 第五格。
    第 5、9 题：及物动词 + 第四格：[Береги́те себя́!]{.ru}，[не узна́ла себя́]{.ru}。
    第 6 题：[у себя́]{.ru}“在自己那里”，第二格。
    第 7、10 题：[о]{.ru} + 第六格 [себе́]{.ru}；第 10 题是命令式，[себе́]{.ru} 指听话的人。
    第 8 题：“给自己买”，第三格 [себе́]{.ru}。
