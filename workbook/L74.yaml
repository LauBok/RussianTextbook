heading: 第 74 课　所在地、去向和来源
groups:
- id: L74-01
  tags:
  - где / куда / откуда：в — в — из
  - где / куда / откуда：на — на — с
  task: 同一个地方，写出所在地、去向和来源三个词组。
  type: matrix
  cols: &id001
  - 名词
  - '[где?]{.ru}'
  - '[куда́?]{.ru}'
  - '[отку́да?]{.ru}'
  given:
  - 0
  rows:
  - base: '[шко́ла]{.ru}'
    cells:
    - '[шко́ла]{.ru}'
    - '[в шко́ле]{.ru}'
    - '[в шко́лу]{.ru}'
    - '[из шко́лы]{.ru}'
  - base: '[рабо́та]{.ru}'
    cells:
    - '[рабо́та]{.ru}'
    - '[на рабо́те]{.ru}'
    - '[на рабо́ту]{.ru}'
    - '[с рабо́ты]{.ru}'
  - base: '[Москва́]{.ru}'
    cells:
    - '[Москва́]{.ru}'
    - '[в Москве́]{.ru}'
    - '[в Москву́]{.ru}'
    - '[из Москвы́]{.ru}'
  - base: '[вокза́л]{.ru}'
    cells:
    - '[вокза́л]{.ru}'
    - '[на вокза́ле]{.ru}'
    - '[на вокза́л]{.ru}'
    - '[с вокза́ла]{.ru}'
  - base: '[магази́н]{.ru}'
    cells:
    - '[магази́н]{.ru}'
    - '[в магази́не]{.ru}'
    - '[в магази́н]{.ru}'
    - '[из магази́на]{.ru}'
  - base: '[уро́к]{.ru}'
    cells:
    - '[уро́к]{.ru}'
    - '[на уро́ке]{.ru}'
    - '[на уро́к]{.ru}'
    - '[с уро́ка]{.ru}'
  - base: '[библиоте́ка]{.ru}'
    cells:
    - '[библиоте́ка]{.ru}'
    - '[в библиоте́ке]{.ru}'
    - '[в библиоте́ку]{.ru}'
    - '[из библиоте́ки]{.ru}'
  - base: '[по́чта]{.ru}'
    cells:
    - '[по́чта]{.ru}'
    - '[на по́чте]{.ru}'
    - '[на по́чту]{.ru}'
    - '[с по́чты]{.ru}'
  - base: '[Кита́й]{.ru}'
    cells:
    - '[Кита́й]{.ru}'
    - '[в Кита́е]{.ru}'
    - '[в Кита́й]{.ru}'
    - '[из Кита́я]{.ru}'
  - base: '[конце́рт]{.ru}'
    cells:
    - '[конце́рт]{.ru}'
    - '[на конце́рте]{.ru}'
    - '[на конце́рт]{.ru}'
    - '[с конце́рта]{.ru}'
  - base: '[университе́т]{.ru}'
    cells:
    - '[университе́т]{.ru}'
    - '[в университе́те]{.ru}'
    - '[в университе́т]{.ru}'
    - '[из университе́та]{.ru}'
  - base: '[экску́рсия]{.ru}'
    cells:
    - '[экску́рсия]{.ru}'
    - '[на экску́рсии]{.ru}'
    - '[на экску́рсию]{.ru}'
    - '[с экску́рсии]{.ru}'
  - base: '[Петербу́рг]{.ru}'
    cells:
    - '[Петербу́рг]{.ru}'
    - '[в Петербу́рге]{.ru}'
    - '[в Петербу́рг]{.ru}'
    - '[из Петербу́рга]{.ru}'
  - base: '[Ура́л]{.ru}'
    cells:
    - '[Ура́л]{.ru}'
    - '[на Ура́ле]{.ru}'
    - '[на Ура́л]{.ru}'
    - '[с Ура́ла]{.ru}'
  why: |
    第 1、3、5、7、9、11、13 题：平时用 [в]{.ru} 的地方：[в]{.ru} + 第六格 — [в]{.ru} + 第四格 — [из]{.ru} + 第二格：[в шко́ле — в шко́лу — из шко́лы]{.ru}。
    第 2、4、6、8、10、12、14 题：平时用 [на]{.ru} 的地方：[на]{.ru} + 第六格 — [на]{.ru} + 第四格 — [с]{.ru} + 第二格：[на рабо́те — на рабо́ту — с рабо́ты]{.ru}。不要说 [из рабо́ты]{.ru}。
    第 3 题：[Москва́]{.ru} 第二格重音在词尾：[из Москвы́]{.ru}。
    第 9 题：[Кита́й]{.ru}：[в Кита́е, в Кита́й, из Кита́я]{.ru}。
    第 12 题：[-ия]{.ru} 名词第六格和第二格都是 [-ии]{.ru}：[на экску́рсии, с экску́рсии]{.ru}；第四格 [на экску́рсию]{.ru}。
- id: L74-02
  tags:
  - где / куда / откуда：у — к — от
  task: 指人时，写出“在某人那里”“到某人那里去”“从某人那里来”。
  type: matrix
  cols: *id001
  given:
  - 0
  rows:
  - base: '[врач]{.ru}'
    cells:
    - '[врач]{.ru}'
    - '[у врача́]{.ru}'
    - '[к врачу́]{.ru}'
    - '[от врача́]{.ru}'
  - base: '[ба́бушка]{.ru}'
    cells:
    - '[ба́бушка]{.ru}'
    - '[у ба́бушки]{.ru}'
    - '[к ба́бушке]{.ru}'
    - '[от ба́бушки]{.ru}'
  - base: '[друг]{.ru}'
    cells:
    - '[друг]{.ru}'
    - '[у дру́га]{.ru}'
    - '[к дру́гу]{.ru}'
    - '[от дру́га]{.ru}'
  - base: '[сестра́]{.ru}'
    cells:
    - '[сестра́]{.ru}'
    - '[у сестры́]{.ru}'
    - '[к сестре́]{.ru}'
    - '[от сестры́]{.ru}'
  - base: '[дочь]{.ru}'
    cells:
    - '[дочь]{.ru}'
    - '[у до́чери]{.ru}'
    - '[к до́чери]{.ru}'
    - '[от до́чери]{.ru}'
  - base: '[преподава́тель]{.ru}'
    cells:
    - '[преподава́тель]{.ru}'
    - '[у преподава́теля]{.ru}'
    - '[к преподава́телю]{.ru}'
    - '[от преподава́теля]{.ru}'
  - base: '[Ива́н Серге́евич]{.ru}'
    cells:
    - '[Ива́н Серге́евич]{.ru}'
    - '[у Ива́на Серге́евича]{.ru}'
    - '[к Ива́ну Серге́евичу]{.ru}'
    - '[от Ива́на Серге́евича]{.ru}'
  - base: '[О́льга Ви́кторовна]{.ru}'
    cells:
    - '[О́льга Ви́кторовна]{.ru}'
    - '[у О́льги Ви́кторовны]{.ru}'
    - '[к О́льге Ви́кторовне]{.ru}'
    - '[от О́льги Ви́кторовны]{.ru}'
  why: |
    第 1–8 题：指人不用 [в / на]{.ru}，用 [у]{.ru} + 第二格（在……那里）、[к]{.ru} + 第三格（到……那里去）、[от]{.ru} + 第二格（从……那里来）。
    第 1 题：[врач]{.ru} 重音移到词尾：[врача́, врачу́]{.ru}。第 4 题：[сестра́]{.ru} 第二格 [сестры́]{.ru}，第三格 [сестре́]{.ru}。
    第 5 题：[дочь]{.ru} 的第二、第三格都是 [до́чери]{.ru}。
    第 6 题：[-ь]{.ru} 阳性名词：第二格 [-я]{.ru}，第三格 [-ю]{.ru}。
    第 7、8 题：名字和父称一起变：阳性 [Ива́на Серге́евича — Ива́ну Серге́евичу]{.ru}，阴性 [О́льги Ви́кторовны — О́льге Ви́кторовне]{.ru}（[г]{.ru} 后第二格写 [-и]{.ru}）。
- id: L74-03
  tags:
  - где / куда / откуда：副词三组对应
  - где / куда / откуда：混合判断
  task: 词或词组回答哪个问题？把它们归类。
  type: classify
  bins:
  - '[где?]{.ru}'
  - '[куда́?]{.ru}'
  - '[отку́да?]{.ru}'
  items:
  - text: '[здесь]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[сюда́]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[отсю́да]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[там]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[туда́]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[отту́да]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[до́ма]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[домо́й]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[из до́ма]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[в шко́ле]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[с рабо́ты]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[к врачу́]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[у ба́бушки]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[из Кита́я]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[на вокза́л]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[от дру́га]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[на по́чте]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[в Москву́]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[с экску́рсии]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[на экску́рсии]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[на экску́рсию]{.ru}'
    answer: '[куда́?]{.ru}'
  - text: '[у врача́]{.ru}'
    answer: '[где?]{.ru}'
  - text: '[от врача́]{.ru}'
    answer: '[отку́да?]{.ru}'
  - text: '[к до́чери]{.ru}'
    answer: '[куда́?]{.ru}'
  why: |
    第 1–9 题：副词三组对应：[здесь — сюда́ — отсю́да]{.ru}，[там — туда́ — отту́да]{.ru}，[до́ма — домо́й — из до́ма]{.ru}。
    第 10、13、17、20、22 题：[в, на]{.ru} + 第六格、[у]{.ru} + 第二格回答 [где?]{.ru}。
    第 12、15、18、21、24 题：[в, на]{.ru} + 第四格、[к]{.ru} + 第三格回答 [куда́?]{.ru}。
    第 11、14、16、19、23 题：[из, с, от]{.ru} + 第二格回答 [отку́да?]{.ru}。
    第 19、20 题：[-ия]{.ru} 名词第二格和第六格同形（[экску́рсии]{.ru}），要靠前置词判断：[с]{.ru} 是“从”，[на]{.ru} 是“在”。
- id: L74-04
  tags:
  - где / куда / откуда：混合判断
  task: 按括号里的问题写出前置词和名词。
  type: fill
  items:
  - stem: Ми́ша идёт ___ домо́й.
    hint: '[отку́да?]{.ru} [шко́ла]{.ru}'
    accept:
    - из шко́лы
  - stem: Па́па сейча́с ___.
    hint: '[где?]{.ru} [рабо́та]{.ru}'
    accept:
    - на рабо́те
  - stem: Ве́чером ма́ма е́дет ___.
    hint: '[отку́да?]{.ru} [рабо́та]{.ru}'
    accept:
    - с рабо́ты
  - stem: За́втра я иду́ ___.
    hint: '[куда́?]{.ru} [врач]{.ru}'
    accept:
    - к врачу́
  - stem: Вчера́ я был ___.
    hint: '[где?]{.ru} [врач]{.ru}'
    accept:
    - у врача́
  - stem: Мы е́дем ___ домо́й.
    hint: '[отку́да?]{.ru} [ба́бушка]{.ru}'
    accept:
    - от ба́бушки
  - stem: Мой друг е́дет ___ в Москву́.
    hint: '[отку́да?]{.ru} [Кита́й]{.ru}'
    accept:
    - из Кита́я
  - stem: Студе́нты иду́т ___.
    hint: '[куда́?]{.ru} [экску́рсия]{.ru}'
    accept:
    - на экску́рсию
  - stem: Когда́ мы е́хали ___, шёл снег.
    hint: '[отку́да?]{.ru} [вокза́л]{.ru}'
    accept:
    - с вокза́ла
  - stem: Мари́я Никола́евна идёт ___.
    hint: '[куда́?]{.ru} [дочь]{.ru}'
    accept:
    - к до́чери
  - stem: Мы с А́нной идём ___ в кафе́.
    hint: '[отку́да?]{.ru} [конце́рт]{.ru}'
    accept:
    - с конце́рта
  - stem: Ле́том мы жи́ли ___.
    hint: '[где?]{.ru} [Ура́л]{.ru}'
    accept:
    - на Ура́ле
  - stem: Пьер идёт ___ домо́й.
    hint: '[отку́да?]{.ru} [друг]{.ru}'
    accept:
    - от дру́га
  - stem: Ми́ша идёт ___ с кни́гой.
    hint: '[отку́да?]{.ru} [библиоте́ка]{.ru}'
    accept:
    - из библиоте́ки
  why: |
    第 1、7、14 题：用 [в]{.ru} 的地方，“从”用 [из]{.ru} + 第二格：[из шко́лы, из Кита́я, из библиоте́ки]{.ru}。
    第 3、9、11 题：用 [на]{.ru} 的地方，“从”用 [с]{.ru} + 第二格：[с рабо́ты, с вокза́ла, с конце́рта]{.ru}。
    第 2、12 题：[на]{.ru} + 第六格表示所在地：[на рабо́те, на Ура́ле]{.ru}。第 8 题：[на]{.ru} + 第四格表示去向：[на экску́рсию]{.ru}。
    第 4、5、6、10、13 题：指人用 [к — у — от]{.ru}：[к врачу́, у врача́, от ба́бушки, к до́чери, от дру́га]{.ru}。
