heading: 第 94 课　假定式
groups:
- id: L94-01
  tags:
  - 假定式：过去时形式 + бы 的性数
  task: 写出动词的假定式。
  type: matrix
  cols:
  - 不定式
  - 阳性
  - 阴性
  - 中性
  - 复数
  given:
  - 0
  rows:
  - base: '[пое́хать]{.ru}'
    cells:
    - '[пое́хать]{.ru}'
    - '[пое́хал бы]{.ru}'
    - '[пое́хала бы]{.ru}'
    - '[пое́хало бы]{.ru}'
    - '[пое́хали бы]{.ru}'
  - base: '[быть]{.ru}'
    cells:
    - '[быть]{.ru}'
    - '[был бы]{.ru}'
    - '[была́ бы]{.ru}'
    - '[бы́ло бы]{.ru}'
    - '[бы́ли бы]{.ru}'
  - base: '[хоте́ть]{.ru}'
    cells:
    - '[хоте́ть]{.ru}'
    - '[хоте́л бы]{.ru}'
    - '[хоте́ла бы]{.ru}'
    - '[хоте́ло бы]{.ru}'
    - '[хоте́ли бы]{.ru}'
  - base: '[мочь]{.ru}'
    cells:
    - '[мочь]{.ru}'
    - '[мог бы]{.ru}'
    - '[могла́ бы]{.ru}'
    - '[могло́ бы]{.ru}'
    - '[могли́ бы]{.ru}'
  - base: '[пойти́]{.ru}'
    cells:
    - '[пойти́]{.ru}'
    - '[пошёл бы]{.ru}'
    - '[пошла́ бы]{.ru}'
    - '[пошло́ бы]{.ru}'
    - '[пошли́ бы]{.ru}'
  - base: '[купи́ть]{.ru}'
    cells:
    - '[купи́ть]{.ru}'
    - '[купи́л бы]{.ru}'
    - '[купи́ла бы]{.ru}'
    - '[купи́ло бы]{.ru}'
    - '[купи́ли бы]{.ru}'
  - base: '[жить]{.ru}'
    cells:
    - '[жить]{.ru}'
    - '[жил бы]{.ru}'
    - '[жила́ бы]{.ru}'
    - '[жи́ло бы]{.ru}'
    - '[жи́ли бы]{.ru}'
  - base: '[позвони́ть]{.ru}'
    cells:
    - '[позвони́ть]{.ru}'
    - '[позвони́л бы]{.ru}'
    - '[позвони́ла бы]{.ru}'
    - '[позвони́ло бы]{.ru}'
    - '[позвони́ли бы]{.ru}'
  - base: '[помо́чь]{.ru}'
    cells:
    - '[помо́чь]{.ru}'
    - '[помо́г бы]{.ru}'
    - '[помогла́ бы]{.ru}'
    - '[помогло́ бы]{.ru}'
    - '[помогли́ бы]{.ru}'
  - base: '[сказа́ть]{.ru}'
    cells:
    - '[сказа́ть]{.ru}'
    - '[сказа́л бы]{.ru}'
    - '[сказа́ла бы]{.ru}'
    - '[сказа́ло бы]{.ru}'
    - '[сказа́ли бы]{.ru}'
  - base: '[лете́ть]{.ru}'
    cells:
    - '[лете́ть]{.ru}'
    - '[лете́л бы]{.ru}'
    - '[лете́ла бы]{.ru}'
    - '[лете́ло бы]{.ru}'
    - '[лете́ли бы]{.ru}'
  - base: '[согласи́ться]{.ru}'
    cells:
    - '[согласи́ться]{.ru}'
    - '[согласи́лся бы]{.ru}'
    - '[согласи́лась бы]{.ru}'
    - '[согласи́лось бы]{.ru}'
    - '[согласи́лись бы]{.ru}'
  - base: '[нра́виться]{.ru}'
    cells:
    - '[нра́виться]{.ru}'
    - '[нра́вился бы]{.ru}'
    - '[нра́вилась бы]{.ru}'
    - '[нра́вилось бы]{.ru}'
    - '[нра́вились бы]{.ru}'
  why: '第 1–13 题：假定式 = 过去时形式 + [бы]{.ru}，按主语的性数变：[-л бы, -ла бы, -ло бы, -ли бы]{.ru}。

    第 2、7 题：[быть, жить]{.ru} 阴性重音在词尾：[была́ бы, жила́ бы]{.ru}，其余在词干：[бы́ло бы, жи́ли бы]{.ru}。第 4、9 题：[мочь, помо́чь]{.ru} 阳性没有 [-л]{.ru}：[мог бы, помо́г бы]{.ru}，其余 [могла́, помогло́, помогли́]{.ru} 重音在词尾。第 5 题：[пойти́]{.ru} 的过去时是 [пошёл, пошла́, пошли́]{.ru}。

    第 12、13 题：[-ся]{.ru} 动词阳性 [-лся]{.ru}，其余 [-лась, -лось, -лись]{.ru}。假定式虽然用过去时形式，本身不表示过去。'
- id: L94-02
  tags:
  - 假定式：愿望、非现实条件与真实条件的意义
  task: 判断句子属于哪一类。
  type: classify
  bins:
  - 委婉的愿望
  - 本来想……可是……
  - 不真实的条件
  - 真实的条件
  items:
  - text: Я хоте́л бы чай.
    answer: 委婉的愿望
  - text: Я бы пое́хал, но у меня́ нет вре́мени.
    answer: 本来想……可是……
  - text: Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хал на по́езде.
    answer: 不真实的条件
  - text: Е́сли у меня́ бу́дет вре́мя, я пое́ду на по́езде.
    answer: 真实的条件
  - text: Я бы с удово́льствием пое́хала на Байка́л.
    answer: 委婉的愿望
  - text: А́нна пое́хала бы с на́ми, но у неё экза́мен.
    answer: 本来想……可是……
  - text: Е́сли бы ты пое́хала со мной, ма́ма была́ бы ра́да.
    answer: 不真实的条件
  - text: Е́сли бу́дет хоро́шая пого́да, мы пойдём в парк.
    answer: 真实的条件
  - text: Мы хоте́ли бы посмотре́ть Байка́л.
    answer: 委婉的愿望
  - text: Ми́ша игра́л бы в футбо́л, но идёт дождь.
    answer: 本来想……可是……
  - text: Е́сли бы Пьер знал кита́йский, он пое́хал бы в Пеки́н.
    answer: 不真实的条件
  - text: Е́сли ты уста́нешь, ложи́сь спать.
    answer: 真实的条件
  - text: Я хоте́ла бы пое́хать в Сиби́рь.
    answer: 委婉的愿望
  - text: Я бы купи́л э́ту кни́гу, но она́ о́чень дорога́я.
    answer: 本来想……可是……
  - text: Е́сли бы бы́ло тепло́, мы бы гуля́ли в па́рке.
    answer: 不真实的条件
  - text: Е́сли за́втра бу́дет тепло́, мы бу́дем гуля́ть в па́рке.
    answer: 真实的条件
  why: '第 1、5、9、13 题：只有一个分句，用假定式说自己的愿望，比 [хочу́, пое́ду]{.ru} 客气、委婉。

    第 2、6、10、14 题：假定式后接 [но]{.ru}，说明愿意做，但条件不允许，事实上没有做。

    第 3、7、11、15 题：[е́сли бы]{.ru}，两个分句都用过去时形式，主句也有 [бы]{.ru}，说的是不符合事实的假设：其实没有时间、皮埃尔其实不懂汉语。假定式的过去时形式不表示过去：第 15 题可以指现在。

    第 4、8、12、16 题：[е́сли]{.ru} 不带 [бы]{.ru}，用将来时或命令式，说的是可能真的发生的条件。'
- id: L94-03
  tags:
  - 假定式：两分句配合核查
  task: 判断句子是否正确。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Е́сли бы у меня́ бы́ло вре́мя, я бы пое́хал.
    answer: 正确
  - text: Е́сли бы у меня́ бу́дет вре́мя, я бы пое́хал.
    answer: 有错
  - text: Е́сли бы у меня́ был вре́мя, я бы пое́хал.
    answer: 有错
  - text: Е́сли бы ты пое́хала со мной, ма́ма была́ бы ра́да.
    answer: 正确
  - text: Е́сли бы ты пое́хала со мной, ма́ма бу́дет ра́да.
    answer: 有错
  - text: 'А́нна сказа́ла: «Я бы пое́хал на по́езде».'
    answer: 有错
  - text: Я бы пое́хал, но у меня́ экза́мен.
    answer: 正确
  - text: Бы я пое́хал на Байка́л.
    answer: 有错
  - text: Е́сли бы была́ хоро́шая пого́да, мы бы пошли́ в парк.
    answer: 正确
  - text: Ю́ми хоте́л бы пое́хать в Сиби́рь.
    answer: 有错
  - text: Мы хоте́ли бы посмотре́ть Байка́л.
    answer: 正确
  - text: Е́сли бы Пьер знал а́дрес, он позвони́л.
    answer: 有错
  - text: Ми́ша пошёл бы гуля́ть, но идёт дождь.
    answer: 正确
  - text: Е́сли бы у нас бы́ли биле́ты, мы бы пое́хали.
    answer: 正确
  why: '第 1、4、7、9、11、13、14 题：形式和配合都正确。第 9 题 [пого́да]{.ru} 阴性用 [была́]{.ru}，第 14 题 [биле́ты]{.ru} 复数用 [бы́ли]{.ru}。

    第 2 题：[е́сли бы]{.ru} 后用过去时形式，不用将来时：[бы́ло]{.ru}。第 3 题：[вре́мя]{.ru} 是中性，用 [бы́ло]{.ru}。第 5、12 题：主句也要用假定式：[была́ бы ра́да]{.ru}，[он позвони́л бы]{.ru}。

    第 6、10 题：动词跟主语的性一致，安娜、由美说 [пое́хала бы, хоте́ла бы]{.ru}。第 8 题：[бы]{.ru} 不放在句首：[Я бы пое́хал]{.ru} 或 [Я пое́хал бы]{.ru}。'
- id: L94-04
  tags:
  - 假定式：两分句中的性数配合
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Е́сли бы у меня́ ___ вре́мя, я бы пое́хал.
    hint: быть
    accept:
    - бы́ло
  - stem: Е́сли бы была́ хоро́шая пого́да, мы ___ бы в парк.
    hint: пойти́
    accept:
    - пошли́
  - stem: А́нна ___ бы с на́ми, но у неё экза́мен.
    hint: пое́хать
    accept:
    - пое́хала
  - stem: 'Ван Лэй сказа́л: «Я ___ бы чай».'
    hint: хоте́ть
    accept:
    - хоте́л
  - stem: А́нна, е́сли бы ты ___ со мной, ма́ма была́ бы ра́да.
    hint: пое́хать
    accept:
    - пое́хала
  - stem: Е́сли бы у нас ___ маши́на, мы бы пое́хали на да́чу.
    hint: быть
    accept:
    - была́
  - stem: Е́сли бы Пьер знал а́дрес, он ___ бы.
    hint: позвони́ть
    accept:
    - позвони́л
  - stem: Ю́ми ___ бы пое́хать в Сиби́рь.
    hint: хоте́ть
    accept:
    - хоте́ла
  - stem: Мы ___ бы вам, но у нас нет вре́мени.
    hint: помо́чь
    accept:
    - помогли́
  - stem: Е́сли бы ___ тепло́, мы бы гуля́ли.
    hint: быть
    accept:
    - бы́ло
  - stem: Е́сли бы у меня́ ___ биле́ты, я бы пошёл в теа́тр.
    hint: быть
    accept:
    - бы́ли
  - stem: Ми́ша ___ бы в футбо́л, но идёт дождь.
    hint: игра́ть
    accept:
    - игра́л
  - stem: Е́сли бы ба́бушка ___ в Москве́, мы бы ча́сто ходи́ли к ней.
    hint: жить
    accept:
    - жила́
  - stem: Ма́ма, ты ___ бы со мной в теа́тр?
    hint: пойти́
    accept:
    - пошла́
  - stem: Е́сли бы Пьер ___ кита́йский, он чита́л бы кита́йские кни́ги.
    hint: знать
    accept:
    - знал
  why: '第 1、6、10、11 题：[быть]{.ru} 跟它的主语一致：[вре́мя]{.ru} 中性 [бы́ло]{.ru}，[маши́на]{.ru} 阴性 [была́]{.ru}，[биле́ты]{.ru} 复数 [бы́ли]{.ru}；无人称的 [тепло́]{.ru} 用中性 [бы́ло]{.ru}。

    第 3、5、8、13、14 题：主语是女性（[А́нна, Ю́ми, ба́бушка, ма́ма]{.ru}），用阴性 [-ла]{.ru}：[пое́хала, хоте́ла, жила́, пошла́]{.ru}。第 4、7、12、15 题：男性用阳性：[хоте́л, позвони́л, игра́л, знал]{.ru}。

    第 2、9 题：复数 [мы]{.ru} 用 [-ли]{.ru}：[пошли́, помогли́]{.ru}；[помо́чь]{.ru} 复数重音在词尾。'
- id: L94-05
  tags:
  - 假定式：没有时间意义，时间看上下文
  task: 判断句子说的是什么时候。
  type: classify
  bins:
  - 说现在
  - 说将来
  - 说过去
  items:
  - text: Е́сли бы сейча́с бы́ло тепло́, мы бы гуля́ли в па́рке.
    answer: 说现在
  - text: Е́сли бы за́втра бы́ло тепло́, мы бы пое́хали на да́чу.
    answer: 说将来
  - text: Е́сли бы вчера́ бы́ло тепло́, мы бы пое́хали на да́чу.
    answer: 说过去
  - text: Я бы сейча́с с удово́льствием вы́пил чай.
    answer: 说现在
  - text: За́втра я бы пое́хал с ва́ми, но у меня́ экза́мен.
    answer: 说将来
  - text: Вчера́ я бы пошёл в кино́, но шёл дождь.
    answer: 说过去
  - text: Е́сли бы у меня́ сейча́с бы́ло вре́мя, я бы помо́г тебе́.
    answer: 说现在
  - text: Е́сли бы ты вчера́ позвони́л, я бы всё рассказа́л.
    answer: 说过去
  - text: Е́сли бы за́втра не́ было экза́мена, мы бы пошли́ в теа́тр.
    answer: 说将来
  - text: Сейча́с я бы хоте́л спать.
    answer: 说现在
  - text: Вчера́ А́нна пое́хала бы с на́ми, но она́ была́ больна́.
    answer: 说过去
  - text: За́втра Ми́ша игра́л бы в футбо́л, но бу́дет дождь.
    answer: 说将来
  - text: Е́сли бы сейча́с шёл снег, мы бы ката́лись на лы́жах.
    answer: 说现在
  - text: Вчера́ я позвони́л бы тебе́, но у меня́ не́ было вре́мени.
    answer: 说过去
  - text: За́втра я бы пое́хала на Байка́л, но у меня́ нет биле́та.
    answer: 说将来
  why: '假定式只有一种形式（过去时形式 + [бы]{.ru}），本身不表示时间，时间要看上下文。

    第 1、4、7、10、13 题：有 [сейча́с]{.ru}，说的是现在不真实的情况或愿望。第 2、5、9、12、15 题：有 [за́втра]{.ru}，说的是将来；第 12 题后半句 [бу́дет дождь]{.ru} 也说明是明天。

    第 3、6、8、11、14 题：有 [вчера́]{.ru}，说的是过去没有实现的事。同样的 [пое́хали бы]{.ru}（第 2、3 题）随时间词不同而指将来或过去，不能一见过去时形式就理解成过去。'
