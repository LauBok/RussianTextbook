  why: |-
    第 1 题：形动词与被说明的名词同性：[кни́га]{.ru} — [напи́санная]{.ru}。
    第 2 题：[прочита́ть]{.ru} 是完成体，副动词用 [-в]{.ru}：[Прочита́в]{.ru}。
    第 3 题：[не на́до]{.ru} 后用未完成体不定式：[не на́до звони́ть]{.ru}。
    第 4 题：[кафе́]{.ru} 是中性不变格名词：[в ую́тном кафе́]{.ru}。
    第 5 题：[-тие]{.ru} 名词第六格 [-ии]{.ru}：[о разви́тии]{.ru}。
    第 6 题：指示词的格由主句动词决定，[вывози́ть]{.ru} 要求第四格：[тех]{.ru}。
    第 7 题：[кто]{.ru} 作从句主语，动词用阳性单数：[кто пришёл]{.ru}。
    第 8 题：前置词 [в тече́ние]{.ru} 写 [-е]{.ru}。
    第 9 题：[два]{.ru} 后阳性名词前的形容词用复数第二格：[ста́рых]{.ru}。
    第 10 题：表示“没有”的 [не́ было]{.ru} 永远是中性单数。
    第 11 题：[по]{.ru} + 第六格：[по прие́зде]{.ru}。
    第 12 题：只有复数的名词用集合数词：[дво́е су́ток]{.ru}。
    第 13 题：前面有季节，年份用第二格，不加 [в]{.ru}：[о́сенью 1873 го́да]{.ru}。
    第 14 题：动名词后宾语变第二格：[созда́ние фи́льма]{.ru}。
