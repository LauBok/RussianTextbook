  task: 写出词组的形式。
  type: matrix
  cols:
  - 词组
  - 形式
  given:
  - 0
  rows:
  - base: '[ую́тное кафе́]{.ru}'
    cells:
    - '[ую́тное кафе́]{.ru}'
    - '[в ую́тном кафе́]{.ru}'
    hint: 第六格
  - base: '[без + горя́чий ко́фе]{.ru}'
    cells:
    - '[без + горя́чий ко́фе]{.ru}'
    - '[без горя́чего ко́фе]{.ru}'
  - base: '[МГУ]{.ru}'
    cells:
    - '[МГУ]{.ru}'
    - '[в МГУ]{.ru}'
    hint: 第六格
  - base: '[вуз]{.ru}'
    cells:
    - '[вуз]{.ru}'
    - '[о ву́зе]{.ru}'
  - base: '[с + Ната́лья Петро́ва]{.ru}'
    cells:
    - '[с + Ната́лья Петро́ва]{.ru}'
    - '[с Ната́льей Петро́вой]{.ru}'
  - base: '[у + Ива́н Шмидт]{.ru}'
    cells:
    - '[у + Ива́н Шмидт]{.ru}'
    - '[у Ива́на Шми́дта]{.ru}'
  - base: '[под]{.ru} + [Королёв]{.ru}（[го́род]{.ru}）'
    cells:
    - '[под]{.ru} + [Королёв]{.ru}（[го́род]{.ru}）'
    - '[под Королёвом]{.ru}'
  - base: '[Ива́ново]{.ru}'
    cells:
    - '[Ива́ново]{.ru}'
    - '[в Ива́нове]{.ru}'
    hint: 第六格
  - base: '[без + де́ньги]{.ru}'
    cells:
    - '[без + де́ньги]{.ru}'
    - '[без де́нег]{.ru}'
  - base: '[с + очки́]{.ru}'
    cells:
    - '[с + очки́]{.ru}'
    - '[с очка́ми]{.ru}'
  - base: '[дво́е + су́тки]{.ru}'
    cells:
    - '[дво́е + су́тки]{.ru}'
    - '[дво́е су́ток]{.ru}'
  - base: '[два + ста́рый чино́вник]{.ru}'
    cells:
    - '[два + ста́рый чино́вник]{.ru}'
    - '[два ста́рых чино́вника]{.ru}'
  - base: '[две + до́лгая неде́ля]{.ru}'
    cells:
    - '[две + до́лгая неде́ля]{.ru}'
    - '[две до́лгие (до́лгих) неде́ли]{.ru}'
  - base: '[к + три но́вая студе́нтка]{.ru}'
    cells:
    - '[к + три но́вая студе́нтка]{.ru}'
    - '[к трём но́вым студе́нткам]{.ru}'
  - base: '[два портно́й]{.ru}'
    cells:
    - '[два портно́й]{.ru}'
    - '[о двух портны́х]{.ru}'
  why: |-
    第 1、2 题：不变格名词只有形容词变：[в ую́тном кафе́]{.ru}（中性），[без горя́чего ко́фе]{.ru}（阳性）。
    第 3、4 题：按字母读的 [МГУ]{.ru} 不变格；以辅音结尾、按单词读的 [вуз]{.ru} 变格：[о ву́зе]{.ru}。
    第 5、6 题：[-ова]{.ru} 女性姓第五格 [-ой]{.ru}：[с Ната́льей Петро́вой]{.ru}；辅音结尾的外来姓男性变格：[у Ива́на Шми́дта]{.ru}。
    第 7、8 题：城市名第五格 [-ом]{.ru}：[под Королёвом]{.ru}；[-ово]{.ru} 地名按中性名词变格：[в Ива́нове]{.ru}。
    第 9–11 题：只有复数的名词：[без де́нег, с очка́ми]{.ru}；计数用 [дво́е]{.ru} + 复数第二格：[дво́е су́ток]{.ru}。
    第 12、13 题：[два]{.ru} 后阳性名词前的形容词用复数第二格：[два ста́рых чино́вника]{.ru}；阴性名词前多用复数第一格，也可用第二格：[две до́лгие]{.ru} ([до́лгих]{.ru}) [неде́ли]{.ru}。
    第 14、15 题：数词在间接格时，形容词和名词都用复数，与数词同格：[к трём но́вым студе́нткам, о двух портны́х]{.ru}。
