  task: 写出下列体对的四种形式；没有的形式写“—”。
  type: matrix
  cols:
  - 体对
  - 主动形动词现在时
  - 被动形动词过去时
  - 未完成体副动词
  - 完成体副动词
  given:
  - 0
  rows:
  - base: '[чита́ть / прочита́ть]{.ru}'
    cells:
    - '[чита́ть / прочита́ть]{.ru}'
    - '[чита́ющий]{.ru}'
    - '[прочи́танный]{.ru}'
    - '[чита́я]{.ru}'
    - '[прочита́в]{.ru}'
  - base: '[писа́ть / написа́ть]{.ru}'
    cells:
    - '[писа́ть / написа́ть]{.ru}'
    - '[пи́шущий]{.ru}'
    - '[напи́санный]{.ru}'
    - —
    - '[написа́в]{.ru}'
  - base: '[стро́ить / постро́ить]{.ru}'
    cells:
    - '[стро́ить / постро́ить]{.ru}'
    - '[стро́ящий]{.ru}'
    - '[постро́енный]{.ru}'
    - '[стро́я]{.ru}'
    - '[постро́ив]{.ru}'
  - base: '[реша́ть / реши́ть]{.ru}'
    cells:
    - '[реша́ть / реши́ть]{.ru}'
    - '[реша́ющий]{.ru}'
    - '[решённый]{.ru}'
    - '[реша́я]{.ru}'
    - '[реши́в]{.ru}'
  - base: '[открыва́ть / откры́ть]{.ru}'
    cells:
    - '[открыва́ть / откры́ть]{.ru}'
    - '[открыва́ющий]{.ru}'
    - '[откры́тый]{.ru}'
    - '[открыва́я]{.ru}'
    - '[откры́в]{.ru}'
  - base: '[создава́ть / созда́ть]{.ru}'
    cells:
    - '[создава́ть / созда́ть]{.ru}'
    - '[создаю́щий]{.ru}'
    - '[со́зданный]{.ru}'
    - '[создава́я]{.ru}'
    - '[созда́в]{.ru}'
  - base: '[приглаша́ть / пригласи́ть]{.ru}'
    cells:
    - '[приглаша́ть / пригласи́ть]{.ru}'
    - '[приглаша́ющий]{.ru}'
    - '[приглашённый]{.ru}'
    - '[приглаша́я]{.ru}'
    - '[пригласи́в]{.ru}'
  - base: '[переводи́ть / перевести́]{.ru}'
    cells:
    - '[переводи́ть / перевести́]{.ru}'
    - '[переводя́щий]{.ru}'
    - '[переведённый]{.ru}'
    - '[переводя́]{.ru}'
    - '[переведя́]{.ru}'
  - base: '[возвраща́ться / верну́ться]{.ru}'
    cells:
    - '[возвраща́ться / верну́ться]{.ru}'
    - '[возвраща́ющийся]{.ru}'
    - —
    - '[возвраща́ясь]{.ru}'
    - '[верну́вшись]{.ru}'
  - base: '[приходи́ть / прийти́]{.ru}'
    cells:
    - '[приходи́ть / прийти́]{.ru}'
    - '[приходя́щий]{.ru}'
    - —
    - '[приходя́]{.ru}'
    - '[придя́]{.ru}'
  why: |-
    第 1–10 题：主动形动词现在时和未完成体副动词由未完成体构成，被动形动词过去时和完成体副动词由完成体构成，体对要拆开用。
    第 1–10 题：主动形动词现在时由复数第三人称构成：[чита́ют]{.ru} → [чита́ющий, пи́шут]{.ru} → [пи́шущий, стро́ят]{.ru} → [стро́ящий, создаю́т]{.ru} → [создаю́щий]{.ru}；[-ся]{.ru} 一律写 [-ся]{.ru}：[возвраща́ющийся]{.ru}。
    第 1–7 题：被动形动词过去时：[-ать]{.ru} 动词 [-нный]{.ru}（[прочи́танный, напи́санный]{.ru}），[-ить]{.ru} 动词 [-енный / -ённый]{.ru} 带交替（[постро́енный, решённый, приглашённый]{.ru}），[-ыть]{.ru} 动词 [-тый]{.ru}（[откры́тый]{.ru}），[созда́ть]{.ru} → [со́зданный]{.ru}。
    第 8 题：[-сти]{.ru} 动词由将来时词干构成：[переведённый]{.ru}；完成体副动词加 [-я]{.ru}：[переведя́]{.ru}。
    第 9、10 题：不及物动词没有被动形动词；[-ся]{.ru} 动词的完成体副动词用 [-вшись]{.ru}：[верну́вшись]{.ru}；[прийти́]{.ru} 的完成体副动词是 [придя́]{.ru}。
    第 2 题：[писа́ть]{.ru} 没有未完成体副动词。
    第 1–7 题：未完成体副动词由现在时词干加 [-я]{.ru}（[-а]{.ru}）：[чита́я, стро́я, создава́я]{.ru}（[-ава́ть]{.ru} 保留 [-ва-]{.ru}）；完成体副动词把过去时的 [-л]{.ru} 换成 [-в]{.ru}：[прочита́в, постро́ив]{.ru}。
