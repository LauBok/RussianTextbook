  - base: '[благодаря́ + по́мощь друзе́й]{.ru}'
    cells:
    - '[благодаря́ + по́мощь друзе́й]{.ru}'
    - '[по́мощи друзе́й]{.ru}'
  - base: '[несмотря́ на + плоха́я пого́да]{.ru}'
    cells:
    - '[несмотря́ на + плоха́я пого́да]{.ru}'
    - '[плоху́ю пого́ду]{.ru}'
  - base: '[су́дя по + его́ слова́]{.ru}'
    cells:
    - '[су́дя по + его́ слова́]{.ru}'
    - '[его́ слова́м]{.ru}'
  - base: '[начина́я с + пе́рвый уро́к]{.ru}'
    cells:
    - '[начина́я с + пе́рвый уро́к]{.ru}'
    - '[пе́рвого уро́ка]{.ru}'
  - base: '[спустя́ + неде́ля]{.ru}'
    cells:
    - '[спустя́ + неде́ля]{.ru}'
    - '[неде́лю]{.ru}'
  - base: '[по + вечера́]{.ru}'
    cells:
    - '[по + вечера́]{.ru}'
    - '[вечера́м]{.ru}'
    hint: 每逢
  - base: '[по + прие́зд]{.ru}'
    cells:
    - '[по + прие́зд]{.ru}'
    - '[прие́зде]{.ru}'
    hint: ……以后
  - base: '[по + по́яс]{.ru}'
    cells:
    - '[по + по́яс]{.ru}'
    - '[по́яс]{.ru}'
    hint: 直到
  - base: '[о́сенью + 1873 год]{.ru}'
    cells:
    - '[о́сенью + 1873 год]{.ru}'
    - '[1873 го́да]{.ru}'
  - base: '[к + 1890-е го́ды]{.ru}'
    cells:
    - '[к + 1890-е го́ды]{.ru}'
    - '[1890-м года́м]{.ru}'
  why: |-
    第 1、3、4 题：[в тече́ние, в отли́чие от, в ка́честве]{.ru} + 第二格：[двух лет, ста́ршей сестры́, перево́дчика]{.ru}。
    第 2、5 题：[по сравне́нию с, в свя́зи с]{.ru} + 第五格：[про́шлым го́дом, ремо́нтом]{.ru}。
    第 6 题：[благодаря́]{.ru} + 第三格：[по́мощи друзе́й]{.ru}。
    第 7 题：[несмотря́ на]{.ru} + 第四格：[плоху́ю пого́ду]{.ru}。
    第 8 题：[су́дя по]{.ru} + 第三格：[его́ слова́м]{.ru}。
    第 9 题：[начина́я с]{.ru} + 第二格：[пе́рвого уро́ка]{.ru}。
    第 10 题：[спустя́]{.ru} + 第四格：[неде́лю]{.ru}。
    第 11–13 题：[по]{.ru} 表示“每逢”用复数第三格：[по вечера́м]{.ru}；表示“……以后”用第六格：[по прие́зде]{.ru}；表示“直到”用第四格：[по по́яс]{.ru}。
    第 14 题：前面有季节，年份用第二格：[о́сенью 1873 го́да]{.ru}。
    第 15 题：[к]{.ru} + 第三格，年代数字后写 [-м]{.ru}：[к 1890-м года́м]{.ru}。
- id: B3-L60-综合-d
  lessons:
  - B3-L05
  - B3-L09
  - B3-L16
  - B3-L17
  tags:
  - 总复习：被动结构与无主语句的类型
  recycles:
  - B3-L09-01
  - B3-L16-02
  - B3-L17-02
  task: 这是哪一种句子？归栏。
  type: classify
  bins:
  - '[-ся]{.ru} 动词被动句'
  - 短尾被动形动词句
  - 不定人称句
  - 泛指人称句
  - 无人称句
  items:
  - text: '[Дом стро́ился три го́да.]{.ru}'
    answer: '[-ся]{.ru} 动词被动句'
  - text: '[Университе́т был осно́ван в 1755 году́.]{.ru}'
    answer: 短尾被动形动词句
  - text: '[Его́ пригласи́ли на конфере́нцию.]{.ru}'
    answer: 不定人称句
  - text: '[Тако́й го́род никогда́ не забу́дешь.]{.ru}'
    answer: 泛指人称句
  - text: '[Мне не спи́тся.]{.ru}'
    answer: 无人称句
  - text: '[Э́ти вопро́сы обсужда́ются на собра́нии.]{.ru}'
    answer: '[-ся]{.ru} 动词被动句'
  - text: '[Все биле́ты уже́ про́даны.]{.ru}'
    answer: 短尾被动形动词句
  - text: '[Здесь стро́ят но́вую шко́лу.]{.ru}'
    answer: 不定人称句
  - text: '[Без словаря́ э́тот текст не переведёшь.]{.ru}'
    answer: 泛指人称句
  - text: '[Ве́чером ста́ло хо́лодно.]{.ru}'
    answer: 无人称句
  - text: '[Пи́сьма отправля́лись ка́ждый день.]{.ru}'
    answer: '[-ся]{.ru} 动词被动句'
  - text: '[Музе́й бу́дет закры́т в понеде́льник.]{.ru}'
    answer: 短尾被动形动词句
  - text: '[Мне позвони́ли из университе́та.]{.ru}'
    answer: 不定人称句
  - text: '[Здесь ничего́ не ку́пишь.]{.ru}'
    answer: 泛指人称句
  - text: '[Ей не хвата́ет вре́мени.]{.ru}'
    answer: 无人称句
  - text: '[Кни́ги продаю́тся в магази́не на углу́.]{.ru}'
    answer: '[-ся]{.ru} 动词被动句'
  - text: '[Письмо́ напи́сано от руки́.]{.ru}'
    answer: 短尾被动形动词句
  - text: '[В газе́те писа́ли об э́той вы́ставке.]{.ru}'
    answer: 不定人称句
  - text: '[Ваго́н си́льно кача́ло.]{.ru}'
    answer: 无人称句
  - text: '[Его́ сло́ва не забу́дешь.]{.ru}'
    answer: 泛指人称句
  why: |-
    第 1、6、11、16 题：未完成体 [-ся]{.ru} 动词作谓语，主语是承受者，表示过程或反复：[стро́ился, обсужда́ются, отправля́лись, продаю́тся]{.ru}。
    第 2、7、12、17 题：完成体短尾被动形动词作谓语，强调结果：[был осно́ван, про́даны, бу́дет закры́т, напи́сано]{.ru}。
    第 3、8、13、18 题：没有主语，谓语用复数第三人称，发出者是不确定的人：[пригласи́ли, стро́ят, позвони́ли, писа́ли]{.ru}。
    第 4、9、14、20 题：没有主语，谓语用单数第二人称，指任何人：[не забу́дешь, не переведёшь, не ку́пишь]{.ru}。
    第 5、10、15、19 题：没有主语，谓语是中性单数、第三人称单数或状态词，主体用第三格或不出现：[не спи́тся, ста́ло хо́лодно, не хвата́ет, кача́ло]{.ru}。
