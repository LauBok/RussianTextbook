heading: 第 42 课　过去时中的体
groups:
- id: L42-01
  tags: [动词的体：体对过去时形式]
  task: 写出体对的过去时。
  type: matrix
  cols: [体对, '未完成体（[он]{.ru}）', '完成体（[он]{.ru}）', '完成体（[она́]{.ru}）']
  given: [0]
  rows:
  - {base: '[чита́ть / прочита́ть]{.ru}', cells: ['[чита́ть / прочита́ть]{.ru}', '[чита́л]{.ru}', '[прочита́л]{.ru}', '[прочита́ла]{.ru}']}
  - {base: '[писа́ть / написа́ть]{.ru}', cells: ['[писа́ть / написа́ть]{.ru}', '[писа́л]{.ru}', '[написа́л]{.ru}', '[написа́ла]{.ru}']}
  - {base: '[де́лать / сде́лать]{.ru}', cells: ['[де́лать / сде́лать]{.ru}', '[де́лал]{.ru}', '[сде́лал]{.ru}', '[сде́лала]{.ru}']}
  - {base: '[смотре́ть / посмотре́ть]{.ru}', cells: ['[смотре́ть / посмотре́ть]{.ru}', '[смотре́л]{.ru}', '[посмотре́л]{.ru}', '[посмотре́ла]{.ru}']}
  - {base: '[гото́вить / пригото́вить]{.ru}', cells: ['[гото́вить / пригото́вить]{.ru}', '[гото́вил]{.ru}', '[пригото́вил]{.ru}', '[пригото́вила]{.ru}'], new: true, gloss: 做（饭）／做好}
  - {base: '[звони́ть / позвони́ть]{.ru}', cells: ['[звони́ть / позвони́ть]{.ru}', '[звони́л]{.ru}', '[позвони́л]{.ru}', '[позвони́ла]{.ru}'], new: true, gloss: 打电话／打（一次）电话}
  - {base: '[у́жинать / поу́жинать]{.ru}', cells: ['[у́жинать / поу́жинать]{.ru}', '[у́жинал]{.ru}', '[поу́жинал]{.ru}', '[поу́жинала]{.ru}'], new: true, gloss: 吃晚饭／吃完晚饭}
  - {base: '[обе́дать / пообе́дать]{.ru}', cells: ['[обе́дать / пообе́дать]{.ru}', '[обе́дал]{.ru}', '[пообе́дал]{.ru}', '[пообе́дала]{.ru}'], new: true, gloss: 吃午饭／吃完午饭}
  - {base: '[слу́шать / послу́шать]{.ru}', cells: ['[слу́шать / послу́шать]{.ru}', '[слу́шал]{.ru}', '[послу́шал]{.ru}', '[послу́шала]{.ru}'], new: true, gloss: 听／听（完）}
  - {base: '[учи́ть / вы́учить]{.ru}', cells: ['[учи́ть / вы́учить]{.ru}', '[учи́л]{.ru}', '[вы́учил]{.ru}', '[вы́учила]{.ru}'], new: true, gloss: 学，背／学会，背熟}
  - {base: '[стро́ить / постро́ить]{.ru}', cells: ['[стро́ить / постро́ить]{.ru}', '[стро́ил]{.ru}', '[постро́ил]{.ru}', '[постро́ила]{.ru}'], new: true, gloss: 建造／建成}
  - {base: '[мыть / помы́ть]{.ru}', cells: ['[мыть / помы́ть]{.ru}', '[мыл]{.ru}', '[помы́л]{.ru}', '[помы́ла]{.ru}'], new: true, gloss: 洗／洗好}
  - {base: '[рисова́ть / нарисова́ть]{.ru}', cells: ['[рисова́ть / нарисова́ть]{.ru}', '[рисова́л]{.ru}', '[нарисова́л]{.ru}', '[нарисова́ла]{.ru}'], new: true, gloss: 画／画好}
  - {base: '[пить / вы́пить]{.ru}', cells: ['[пить / вы́пить]{.ru}', '[пил]{.ru}', '[вы́пил]{.ru}', '[вы́пила]{.ru}'], new: true, gloss: 喝／喝完}
  why: |
    第 1–14 题：完成体过去时的构成和未完成体完全一样：去掉不定式的 [-ть]{.ru}，阳性加 [-л]{.ru}，阴性加 [-ла]{.ru}。前缀不影响词尾，重音也保持不定式的位置：[прочита́л, посмотре́л, пригото́вил]{.ru}。
    第 10、14 题：前缀 [вы-]{.ru} 构成的完成体重音总在 [вы́-]{.ru} 上：[вы́учил, вы́пила]{.ru}；未完成体 [учи́л, пил]{.ru} 的重音不在这里。
    第 13 题：[рисова́ть]{.ru} 的过去时照样从不定式构成：[рисова́л, нарисова́ла]{.ru}，与现在时的词干无关。
- id: L42-02
  tags: [动词的体：过去时的意义]
  task: 判断句中的过去时表示哪一种意义，填写序号。
  type: classify
  bins: [过程、持续多久, 只说有没有这回事, 经常、反复, 完成、有结果]
  items:
  - {text: '[Ве́чером Ван Лэй до́лго чита́л.]{.ru}', answer: 过程、持续多久}
  - {text: '[Я уже́ прочита́л расска́з.]{.ru}', answer: 完成、有结果}
  - {text: '[— Ты смотре́л «Войну́ и мир»? — Нет, не смотре́л.]{.ru}', answer: 只说有没有这回事}
  - {text: '[Ми́ша ча́сто игра́л в футбо́л.]{.ru}', answer: 经常、反复}
  - {text: '[А́нна писа́ла письмо́ два часа́.]{.ru}', answer: 过程、持续多久}
  - {text: '[Ми́ша наконе́ц сде́лал уро́ки.]{.ru}', answer: 完成、有结果}
  - {text: '[— Вы чита́ли э́тот рома́н? — Да, чита́л.]{.ru}', answer: 只说有没有这回事}
  - {text: '[Па́па ка́ждый день рабо́тал на заво́де.]{.ru}', answer: 经常、反复}
  - {text: '[Ма́ма уже́ пригото́вила обе́д.]{.ru}', answer: 完成、有结果}
  - {text: '[Студе́нты час де́лали упражне́ние.]{.ru}', answer: 过程、持续多久}
  - {text: '[Я написа́л письмо́. Вот оно́.]{.ru}', answer: 完成、有结果}
  - {text: '[— Ты чита́ла расска́з «Филиппо́к»? — Чита́ла.]{.ru}', answer: 只说有没有这回事}
  - {text: '[Вчера́ мы до́лго смотре́ли телеви́зор.]{.ru}', answer: 过程、持续多久}
  - {text: '[Ван Лэй ча́сто слу́шал ру́сскую му́зыку.]{.ru}', answer: 经常、反复}
  - {text: '[Ю́ми уже́ посмотре́ла фильм «Война́ и мир».]{.ru}', answer: 完成、有结果}
  - {text: '[— Кто писа́л э́то письмо́? — Ми́ша.]{.ru}', answer: 只说有没有这回事}
  - {text: '[Ра́ньше А́нна ча́сто гуля́ла в па́рке.]{.ru}', answer: 经常、反复}
  - {text: '[Па́па до́лго гото́вил у́жин.]{.ru}', answer: 过程、持续多久}
  why: |
    第 1、5、10、13、18 题：有 [до́лго, два часа́, час]{.ru} 这样表示持续多久的词，说的是动作的过程，只能用未完成体。
    第 2、6、9、11、15 题：完成体 [прочита́л, сде́лал, пригото́вила, написа́л, посмотре́ла]{.ru} 说的是做完了、有结果；[уже́, наконе́ц]{.ru} 和 [Вот оно́]{.ru} 都指向结果。
    第 3、7、12、16 题：问话人只想知道有没有做过、是谁做的，不关心做完没有，用未完成体。第 16 题问的是“信是谁写的”，事实本身，不问结果。
    第 4、8、14、17 题：[ча́сто, ка́ждый день]{.ru} 表示动作多次重复，用未完成体。
- id: L42-03
  tags: [动词的体：过去时的体选择]
  task: 用括号里动词的过去时填空。
  type: fill
  items:
  - {stem: 'А́нна ___ расска́з два часа́.', hint: чита́ть / прочита́ть, accept: [чита́ла]}
  - {stem: 'Ван Лэй уже́ ___ упражне́ние.', hint: де́лать / сде́лать, accept: [сде́лал]}
  - {stem: '— Ты ___ фильм «Война́ и мир»? — Нет, не смотре́л.', hint: смотре́ть / посмотре́ть, accept: [смотре́л]}
  - {stem: 'Ми́ша до́лго писа́л письмо́ и наконе́ц ___.', hint: писа́ть / написа́ть, accept: [написа́л]}
  - {stem: 'Ю́ми ___ упражне́ние час, но не сде́лала.', hint: де́лать / сде́лать, accept: [де́лала]}
  - {stem: '— А́нна, где письмо́? — Я его́ уже́ ___.', hint: писа́ть / написа́ть, accept: [написа́ла]}
  - {stem: 'Вчера́ ве́чером Пьер до́лго ___ телеви́зор.', hint: смотре́ть / посмотре́ть, accept: [смотре́л]}
  - {stem: 'Ма́ма наконе́ц ___ дли́нный рома́н.', hint: чита́ть / прочита́ть, accept: [прочита́ла]}
  - {stem: 'Па́па ча́сто ___ газе́ту на ку́хне.', hint: чита́ть / прочита́ть, accept: [чита́л]}
  - {stem: '— Ми́ша, ты ___ уро́ки? — Да, уже́ сде́лал.', hint: де́лать / сде́лать, accept: [сде́лал, де́лал]}
  - {stem: 'А́нна и Ю́ми ___ упражне́ние, и сейча́с они́ отдыха́ют.', hint: де́лать / сде́лать, accept: [сде́лали]}
  - {stem: 'Ван Лэй до́лго ___ сло́жный расска́з, но не прочита́л.', hint: чита́ть / прочита́ть, accept: [чита́л]}
  - {stem: 'Ми́ша ещё не ___ расска́з.', hint: чита́ть / прочита́ть, accept: [прочита́л]}
  - {stem: 'Вчера́ Ю́ми наконе́ц ___ «Войну́ и мир».', hint: смотре́ть / посмотре́ть, accept: [посмотре́ла]}
  - {stem: 'Студе́нты ___ упражне́ния час.', hint: писа́ть / написа́ть, accept: [писа́ли]}
  why: |
    第 1、5、7、12、15 题：[два часа́, час, до́лго]{.ru} 说明动作持续多久，用未完成体；第 5、12 题后半句“没做完、没读完”更说明前半句只是过程。
    第 2、4、6、8、10、11、14 题：[уже́, наконе́ц]{.ru}、答话“做完了”和“现在在休息”都说明动作已有结果，用完成体。
    第 3 题：问“看过没有”，回答 [не смотре́л]{.ru}，用未完成体。
    第 9 题：[ча́сто]{.ru} 表示反复，用未完成体。
    第 13 题：[ещё не]{.ru} + 完成体表示“还没读完”。
    主语的性和数决定词尾：[А́нна, Ю́ми, ма́ма]{.ru} 用 [-ла]{.ru}；[Ми́ша, Ван Лэй, Пьер, па́па]{.ru} 用 [-л]{.ru}；第 6 题说话的是 [А́нна]{.ru}，用 [написа́ла]{.ru}；第 11、15 题主语是复数，用 [-ли]{.ru}。
