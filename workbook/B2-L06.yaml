heading: 第 6 课　钟点的细致表达
groups:
- id: B2-L06-01
  tags:
  - 钟点：第几个钟点（序数词第二格）
  task: 这一个小时是“第几个钟点”？写出序数词的第二格。
  type: matrix
  cols:
  - 时段
  - 序数词第二格
  given:
  - 0
  rows:
  - base: '[12:00—1:00]{.ru}'
    cells:
    - '[12:00—1:00]{.ru}'
    - '[пе́рвого]{.ru}'
  - base: '[1:00—2:00]{.ru}'
    cells:
    - '[1:00—2:00]{.ru}'
    - '[второ́го]{.ru}'
  - base: '[2:00—3:00]{.ru}'
    cells:
    - '[2:00—3:00]{.ru}'
    - '[тре́тьего]{.ru}'
  - base: '[3:00—4:00]{.ru}'
    cells:
    - '[3:00—4:00]{.ru}'
    - '[четвёртого]{.ru}'
  - base: '[4:00—5:00]{.ru}'
    cells:
    - '[4:00—5:00]{.ru}'
    - '[пя́того]{.ru}'
  - base: '[5:00—6:00]{.ru}'
    cells:
    - '[5:00—6:00]{.ru}'
    - '[шесто́го]{.ru}'
  - base: '[6:00—7:00]{.ru}'
    cells:
    - '[6:00—7:00]{.ru}'
    - '[седьмо́го]{.ru}'
  - base: '[7:00—8:00]{.ru}'
    cells:
    - '[7:00—8:00]{.ru}'
    - '[восьмо́го]{.ru}'
  - base: '[8:00—9:00]{.ru}'
    cells:
    - '[8:00—9:00]{.ru}'
    - '[девя́того]{.ru}'
  - base: '[9:00—10:00]{.ru}'
    cells:
    - '[9:00—10:00]{.ru}'
    - '[деся́того]{.ru}'
  - base: '[10:00—11:00]{.ru}'
    cells:
    - '[10:00—11:00]{.ru}'
    - '[оди́ннадцатого]{.ru}'
  - base: '[11:00—12:00]{.ru}'
    cells:
    - '[11:00—12:00]{.ru}'
    - '[двена́дцатого]{.ru}'
  why: |-
    第 1 题：12:00—1:00 是“第一个钟点”：[пе́рвого]{.ru}，所以 12:10 是 [де́сять мину́т пе́рвого]{.ru}。
    第 2、4–12 题：俄语看下一个整点：3:00—4:00 是 [четвёртого]{.ru}；序数词第二格词尾 [-ого]{.ru}（[г]{.ru} 读 [в]{.ru}）。
    第 3 题：[тре́тий]{.ru} 的第二格是 [тре́тьего]{.ru}，有 [ь]{.ru}。
- id: B2-L06-02
  tags:
  - 钟点：现在几点与在几点
  task: 用文字写出：现在几点？在几点？
  type: matrix
  cols:
  - 时刻
  - '[Кото́рый час?]{.ru}'
  - '[Когда́?]{.ru}'
  given:
  - 0
  rows:
  - base: '[3:30]{.ru}'
    cells:
    - '[3:30]{.ru}'
    - '[полови́на четвёртого]{.ru}'
    - '[в полови́не четвёртого]{.ru}'
  - base: '[3:45]{.ru}'
    cells:
    - '[3:45]{.ru}'
    - '[без че́тверти четы́ре]{.ru}'
    - '[без че́тверти четы́ре]{.ru}'
  - base: '[7:15]{.ru}'
    cells:
    - '[7:15]{.ru}'
    - '[че́тверть восьмо́го]{.ru}'
    - '[в че́тверть восьмо́го]{.ru}'
  - base: '[10:05]{.ru}'
    cells:
    - '[10:05]{.ru}'
    - '[пять мину́т оди́ннадцатого]{.ru}'
    - '[в пять мину́т оди́ннадцатого]{.ru}'
  - base: '[1:50]{.ru}'
    cells:
    - '[1:50]{.ru}'
    - '[без десяти́ два]{.ru}'
    - '[без десяти́ два]{.ru}'
  - base: '[12:30]{.ru}'
    cells:
    - '[12:30]{.ru}'
    - '[полови́на пе́рвого]{.ru}'
    - '[в полови́не пе́рвого]{.ru}'
  - base: '[6:40]{.ru}'
    cells:
    - '[6:40]{.ru}'
    - '[без двадцати́ семь]{.ru}'
    - '[без двадцати́ семь]{.ru}'
  - base: '[8:20]{.ru}'
    cells:
    - '[8:20]{.ru}'
    - '[два́дцать мину́т девя́того]{.ru}'
    - '[в два́дцать мину́т девя́того]{.ru}'
  - base: '[11:55]{.ru}'
    cells:
    - '[11:55]{.ru}'
    - '[без пяти́ двена́дцать]{.ru}'
    - '[без пяти́ двена́дцать]{.ru}'
  - base: '[2:10]{.ru}'
    cells:
    - '[2:10]{.ru}'
    - '[де́сять мину́т тре́тьего]{.ru}'
    - '[в де́сять мину́т тре́тьего]{.ru}'
  - base: '[5:35]{.ru}'
    cells:
    - '[5:35]{.ru}'
    - '[без двадцати́ пяти́ шесть]{.ru}'
    - '[без двадцати́ пяти́ шесть]{.ru}'
  - base: '[9:25]{.ru}'
    cells:
    - '[9:25]{.ru}'
    - '[два́дцать пять мину́т деся́того]{.ru}'
    - '[в два́дцать пять мину́т деся́того]{.ru}'
  - base: '[4:30]{.ru}'
    cells:
    - '[4:30]{.ru}'
    - '[полови́на пя́того]{.ru}'
    - '[в полови́не пя́того]{.ru}'
  - base: '[12:45]{.ru}'
    cells:
    - '[12:45]{.ru}'
    - '[без че́тверти час]{.ru}'
    - '[без че́тверти час]{.ru}'
  why: |-
    第 1、6、13 题：半点：[полови́на]{.ru} + 下一钟点的序数词第二格；“在半点”用 [в полови́не]{.ru}（第六格）：[в полови́не четвёртого]{.ru}。3:30 不是 [полови́на тре́тьего]{.ru}。
    第 2、5、7、9、11 题：后半小时：[без]{.ru} + 分钟数第二格 + 下一个整点：[без че́тверти четы́ре, без двадцати́ пяти́ шесть]{.ru}；“在……”不加 [в]{.ru}，两列一样。
    第 3、4、8、10、12 题：前半小时：分钟 + 下一钟点的序数词第二格；“在……”加 [в]{.ru}，后面同第一格：[в че́тверть восьмо́го, в пять мину́т оди́ннадцатого]{.ru}。
    第 14 题：下一个整点是 1 点时说 [час]{.ru}，不说 [оди́н]{.ru}：[без че́тверти час]{.ru}。
- id: B2-L06-03
  tags:
  - 一段时间：че́тверть, пол-, полтора́, с полови́ной
  task: 用俄语说出这段时间。
  type: matrix
  cols:
  - 时长
  - 俄语
  given:
  - 0
  rows:
  - base: 一刻钟
    cells:
    - 一刻钟
    - '[че́тверть ча́са]{.ru}'
  - base: 半小时
    cells:
    - 半小时
    - '[полчаса́]{.ru}'
  - base: 一个半小时
    cells:
    - 一个半小时
    - '[полтора́ часа́]{.ru}'
  - base: 一分半钟
    cells:
    - 一分半钟
    - '[полторы́ мину́ты]{.ru}'
  - base: 两个半小时
    cells:
    - 两个半小时
    - '[два с полови́ной часа́]{.ru}'
  - base: 一周半
    cells:
    - 一周半
    - '[полторы́ неде́ли]{.ru}'
  - base: 一年半
    cells:
    - 一年半
    - '[полтора́ го́да]{.ru}'
  - base: 一个半月
    cells:
    - 一个半月
    - '[полтора́ ме́сяца]{.ru}'
  - base: 三个半小时
    cells:
    - 三个半小时
    - '[три с полови́ной часа́]{.ru}'
  - base: 五个半小时
    cells:
    - 五个半小时
    - '[пять с полови́ной часо́в]{.ru}'
  why: |-
    第 1 题：[че́тверть ча́са]{.ru}：[час]{.ru} 用第二格。
    第 2 题：[полчаса́]{.ru} 是一个词，[пол-]{.ru} + 第二格。
    第 3、7、8 题：[полтора́]{.ru} 和阳性名词连用，名词用单数第二格：[полтора́ часа́, полтора́ го́да, полтора́ ме́сяца]{.ru}。
    第 4、6 题：和阴性名词连用是 [полторы́]{.ru}：[полторы́ мину́ты, полторы́ неде́ли]{.ru}。
    第 5、9 题：“几个半”：数词 + [с полови́ной]{.ru}，名词跟着数词变：[два с полови́ной часа́]{.ru}。
    第 10 题：5 以上名词用复数第二格：[пять с полови́ной часо́в]{.ru}。
- id: B2-L06-04
  tags:
  - 钟点：句中
  task: 用文字写出括号里的时刻（句中）。
  type: fill
  items:
  - stem: Уро́к начина́ется ___.
    hint: '8:30'
    accept:
    - в полови́не девя́того
  - stem: Конце́рт начина́ется ___.
    hint: '6:15'
    accept:
    - в че́тверть седьмо́го
  - stem: Мы встре́тимся ___ у метро́.
    hint: '1:40'
    accept:
    - без двадцати́ два
  - stem: Сейча́с ___.
    hint: '11:10'
    accept:
    - де́сять мину́т двена́дцатого
  - stem: Фильм конча́ется ___.
    hint: '9:55'
    accept:
    - без пяти́ де́сять
  - stem: Я встал ___.
    hint: '7:20'
    accept:
    - в два́дцать мину́т восьмо́го
  - stem: Магази́н закрыва́ется ___.
    hint: '10:30'
    accept:
    - в полови́не оди́ннадцатого
  - stem: Сейча́с ___.
    hint: '4:45'
    accept:
    - без че́тверти пять
  why: |-
    第 1、7 题：“在半点”：[в полови́не девя́того, в полови́не оди́ннадцатого]{.ru}。
    第 2、6 题：前半小时，“在”用 [в]{.ru}：[в че́тверть седьмо́го, в два́дцать мину́т восьмо́го]{.ru}。
    第 3、5 题：后半小时用 [без]{.ru}，前面不加 [в]{.ru}：[без двадцати́ два, без пяти́ де́сять]{.ru}。
    第 4、8 题：说“现在几点”不加 [в]{.ru}：[де́сять мину́т двена́дцатого, без че́тверти пять]{.ru}。
