    gloss: 裙子
  - base: '[э́та хоро́шая кни́га]{.ru}'
    cells:
    - '[э́та хоро́шая кни́га]{.ru}'
    - '[э́ту хоро́шую кни́гу]{.ru}'
  - base: '[э́то кра́сное пла́тье]{.ru}'
    cells:
    - '[э́то кра́сное пла́тье]{.ru}'
    - '[э́то кра́сное пла́тье]{.ru}'
    new: true
