heading: 第 76 课　购物：体对与命令式
groups:
- id: L76-01
  tags:
  - 体对：покупать / купить
  - 体对：платить / заплатить
  - 不规则变位：дать / продать
  task: 写出动词的六个人称形式（未完成体为现在时，完成体为将来时）。
  type: matrix
  cols:
  - 不定式
  - '[я]{.ru}'
  - '[ты]{.ru}'
  - '[он / она́]{.ru}'
  - '[мы]{.ru}'
  - '[вы]{.ru}'
  - '[они́]{.ru}'
  given:
  - 0
  rows:
  - base: '[покупа́ть]{.ru}'
    cells:
    - '[покупа́ть]{.ru}'
    - '[покупа́ю]{.ru}'
    - '[покупа́ешь]{.ru}'
    - '[покупа́ет]{.ru}'
    - '[покупа́ем]{.ru}'
    - '[покупа́ете]{.ru}'
    - '[покупа́ют]{.ru}'
  - base: '[купи́ть]{.ru}'
    cells:
    - '[купи́ть]{.ru}'
    - '[куплю́]{.ru}'
    - '[ку́пишь]{.ru}'
    - '[ку́пит]{.ru}'
    - '[ку́пим]{.ru}'
    - '[ку́пите]{.ru}'
    - '[ку́пят]{.ru}'
    hint: II；[куплю́, ку́пишь]{.ru}
  - base: '[плати́ть]{.ru}'
    cells:
    - '[плати́ть]{.ru}'
    - '[плачу́]{.ru}'
    - '[пла́тишь]{.ru}'
    - '[пла́тит]{.ru}'
    - '[пла́тим]{.ru}'
    - '[пла́тите]{.ru}'
    - '[пла́тят]{.ru}'
    hint: II；[плачу́, пла́тишь]{.ru}
  - base: '[заплати́ть]{.ru}'
    cells:
    - '[заплати́ть]{.ru}'
    - '[заплачу́]{.ru}'
    - '[запла́тишь]{.ru}'
    - '[запла́тит]{.ru}'
    - '[запла́тим]{.ru}'
    - '[запла́тите]{.ru}'
    - '[запла́тят]{.ru}'
    hint: II；[заплачу́, запла́тишь]{.ru}
  - base: '[приме́рить]{.ru}'
    cells:
    - '[приме́рить]{.ru}'
    - '[приме́рю]{.ru}'
    - '[приме́ришь]{.ru}'
    - '[приме́рит]{.ru}'
    - '[приме́рим]{.ru}'
    - '[приме́рите]{.ru}'
    - '[приме́рят]{.ru}'
    hint: II
  - base: '[показа́ть]{.ru}'
    cells:
    - '[показа́ть]{.ru}'
    - '[покажу́]{.ru}'
    - '[пока́жешь]{.ru}'
    - '[пока́жет]{.ru}'
    - '[пока́жем]{.ru}'
    - '[пока́жете]{.ru}'
    - '[пока́жут]{.ru}'
    hint: I；[покажу́, пока́жешь]{.ru}
  - base: '[дать]{.ru}'
    cells:
    - '[дать]{.ru}'
    - '[дам]{.ru}'
    - '[дашь]{.ru}'
    - '[даст]{.ru}'
    - '[дади́м]{.ru}'
    - '[дади́те]{.ru}'
    - '[даду́т]{.ru}'
    hint: irreg.
  - base: '[прода́ть]{.ru}'
    cells:
    - '[прода́ть]{.ru}'
    - '[прода́м]{.ru}'
    - '[прода́шь]{.ru}'
    - '[прода́ст]{.ru}'
    - '[продади́м]{.ru}'
    - '[продади́те]{.ru}'
    - '[продаду́т]{.ru}'
    hint: irreg.
  why: |
    第 1 题：[покупа́ть]{.ru} 按 [-ать]{.ru} 规则变，是现在时。
    第 2 题：[купи́ть]{.ru} 第一人称插入 [л]{.ru}：[куплю́]{.ru}；从第二人称起重音移到词干：[ку́пишь, ку́пят]{.ru}。变位表示将来。
    第 3、4 题：[плати́ть]{.ru} 第一人称 [т → ч]{.ru}：[плачу́]{.ru}，其余人称重音在词干：[пла́тишь, пла́тят]{.ru}；[заплати́ть]{.ru} 同样变，表示将来。
    第 5 题：[приме́рить]{.ru} 重音一直在 [-ме́-]{.ru} 上，第二变位复数 [-ят]{.ru}。
    第 6 题：[показа́ть]{.ru} 全部人称 [з → ж]{.ru}，从第二人称起重音前移：[покажу́, пока́жешь, пока́жут]{.ru}。
    第 7、8 题：[дать, прода́ть]{.ru} 变位不规则：[дам, дашь, даст, дади́м, дади́те, даду́т]{.ru}，[прода́ть]{.ru} 加前缀 [про-]{.ru}，重音位置相同。
- id: L76-02
  tags:
  - 命令式：购物请求
  task: 写出命令式。
  type: matrix
  cols:
  - 不定式
  - 对 [ты]{.ru}
  - 对 [вы]{.ru}
  given:
  - 0
  rows:
  - base: '[показа́ть]{.ru}'
    cells:
    - '[показа́ть]{.ru}'
    - '[покажи́]{.ru}'
    - '[покажи́те]{.ru}'
  - base: '[дать]{.ru}'
    cells:
    - '[дать]{.ru}'
    - '[дай]{.ru}'
    - '[да́йте]{.ru}'
  - base: '[взять]{.ru}'
    cells:
    - '[взять]{.ru}'
    - '[возьми́]{.ru}'
    - '[возьми́те]{.ru}'
  - base: '[приме́рить]{.ru}'
    cells:
    - '[приме́рить]{.ru}'
    - '[приме́рь]{.ru}'
    - '[приме́рьте]{.ru}'
  - base: '[помо́чь]{.ru}'
    cells:
    - '[помо́чь]{.ru}'
    - '[помоги́]{.ru}'
    - '[помоги́те]{.ru}'
  - base: '[купи́ть]{.ru}'
    cells:
    - '[купи́ть]{.ru}'
    - '[купи́]{.ru}'
    - '[купи́те]{.ru}'
  - base: '[заплати́ть]{.ru}'
    cells:
    - '[заплати́ть]{.ru}'
    - '[заплати́]{.ru}'
    - '[заплати́те]{.ru}'
  - base: '[покупа́ть]{.ru}'
    cells:
    - '[покупа́ть]{.ru}'
    - '[покупа́й]{.ru}'
    - '[покупа́йте]{.ru}'
  - base: '[посмотре́ть]{.ru}'
    cells:
    - '[посмотре́ть]{.ru}'
    - '[посмотри́]{.ru}'
    - '[посмотри́те]{.ru}'
  - base: '[сказа́ть]{.ru}'
    cells:
    - '[сказа́ть]{.ru}'
    - '[скажи́]{.ru}'
    - '[скажи́те]{.ru}'
  - base: '[повтори́ть]{.ru}'
    cells:
    - '[повтори́ть]{.ru}'
    - '[повтори́]{.ru}'
    - '[повтори́те]{.ru}'
  - base: '[подожда́ть]{.ru}'
    cells:
    - '[подожда́ть]{.ru}'
    - '[подожди́]{.ru}'
    - '[подожди́те]{.ru}'
    hint: pf. I；[подожду́, подождёшь]{.ru}
    new: true
    gloss: 等一等
  why: |
    第 1、3、5、6、7、9–12 题：第一人称重读词尾时，命令式加重读的 [-и́]{.ru}：[покажу́ → покажи́, возьму́ → возьми́, помогу́ → помоги́, куплю́ → купи́, подожду́ → подожди́]{.ru}。
    第 2 题：[дать]{.ru} 的命令式是 [дай, да́йте]{.ru}，要单独记。
    第 4 题：重音在词干、词干以辅音结尾时用 [-ь]{.ru}：[приме́рь, приме́рьте]{.ru}。
    第 8 题：词干以元音结尾时加 [-й]{.ru}：[покупа́й(те)]{.ru}。
    所有对 [вы]{.ru} 的形式都加 [-те]{.ru}。在商店向售货员提请求，用完成体命令式加 [пожа́луйста]{.ru}。
- id: L76-03
  tags:
  - 形容词与指示代词第四格：购物宾语
  - 命令式：购物请求
