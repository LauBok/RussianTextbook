    - '[тот дорого́й телефо́н]{.ru}'
  why: |
    第 1、5、10、14 题：阳性非动物名词第四格同第一格，修饰语也不变：[тот чёрный сви́тер]{.ru}。
    第 4、13 题：中性第四格同第一格：[э́то зи́мнее пальто́]{.ru}。
    第 2、3、6、8、9、12 题：阴性：[э́та → э́ту]{.ru}，[та → ту]{.ru}；形容词 [-ая → -ую]{.ru}，名词 [-а → -у]{.ru}：[э́ту чёрную ку́ртку, ту бе́лую руба́шку]{.ru}。
    第 7、11 题：软变化形容词 [-яя → -юю]{.ru}：[ту зи́мнюю ку́ртку, э́ту си́нюю ю́бку]{.ru}。
- id: L76-04
  tags:
  - 体对：покупать / купить
  - 体对：платить / заплатить
  task: 根据句意选用括号里的一个形式填空。
  type: fill
  items:
  - stem: Вчера́ я ___ ку́ртку. Вот она́!
    hint: покупа́л / купи́л
    accept:
    - купи́л
  - stem: Ты ___ ку́ртку три часа́!
    hint: покупа́л / купи́л
    accept:
    - покупа́л
  - stem: За́втра я ___ ша́пку.
    hint: покупа́ю / куплю́
    accept:
    - куплю́
  - stem: Ра́ньше я всегда́ ___ ве́щи в Кита́е.
    hint: покупа́л / купи́л
    accept:
    - покупа́л
  - stem: Не звони́ мне сейча́с, я ___ пода́рок ма́ме.
    hint: покупа́ю / куплю́
    accept:
    - покупа́ю
  - stem: ___, пожа́луйста, хлеб!
    hint: Покупа́й / Купи́
    accept:
    - Купи́
  - stem: Ми́ша всегда́ ___ бы́стро.
    hint: пла́тит / запла́тит
    accept:
    - пла́тит
  - stem: Ван Лэй ___ и пое́хал домо́й.
    hint: плати́л / заплати́л
    accept:
    - заплати́л
  - stem: Где ты ___ э́тот сви́тер?
    hint: покупа́л / купи́л
    accept:
    - купи́л
  - stem: Ма́ма ка́ждую суббо́ту ___ ры́бу на ры́нке.
    hint: покупа́ет / ку́пит
    accept:
    - покупа́ет
  - stem: Я ___ за кварти́ру ка́ждый ме́сяц.
    hint: плачу́ / заплачу́
    accept:
    - плачу́
  - stem: А́нна ___ сви́тер и пошла́ домо́й.
    hint: покупа́ла / купи́ла
    accept:
    - купи́ла
  - stem: Мы до́лго ___ пода́рок для па́пы.
    hint: покупа́ли / купи́ли
    accept:
    - покупа́ли
  - stem: Я обяза́тельно ___ тебе́ шарф.
    hint: покупа́ю / куплю́
    accept:
    - куплю́
  why: |
    第 1、8、9、12 题：说一次买成、付完的结果，用完成体过去时：[купи́л, заплати́л, купи́ла]{.ru}；第 8、12 题后面接着说“然后回家了”，前一个动作已经完成。
    第 3、14 题：将来买一次，用完成体变位 [куплю́]{.ru}。
    第 2、13 题：[три часа́, до́лго]{.ru} 说的是过程花了多长时间，用未完成体；不能说 [купи́л три часа́]{.ru}。
    第 4、7、10、11 题：经常、习惯，用未完成体：[покупа́л, пла́тит, покупа́ет, плачу́]{.ru}。
    第 5 题：此刻正在买，用未完成体现在时。
    第 6 题：请别人买一次，用完成体命令式 [Купи́]{.ru}。
- id: L76-05
  tags:
  - 形容词与指示代词第四格：购物宾语
  - 命令式：购物请求
  task: 把括号里的词变成需要的格填空：要的东西用第四格，给谁用第三格。
  type: fill
  items:
  - stem: Покажи́те ___, пожа́луйста, э́ту ку́ртку.
    hint: я
    accept:
    - мне
  - stem: Да́йте ___, пожа́луйста, хлеб.
    hint: мы
    accept:
    - нам
  - stem: Покажи́те, пожа́луйста, ___.
    hint: тот чёрный шарф
    accept:
    - тот чёрный шарф
  - stem: Да́йте, пожа́луйста, ___.
    hint: э́та бе́лая ша́пка
    accept:
    - э́ту бе́лую ша́пку
  - stem: Па́па, купи́ ___ э́ту кни́гу!
    hint: я
    accept:
    - мне
  - stem: Помоги́те ___, пожа́луйста.
    hint: я
    accept:
    - мне
  - stem: Покажи́те ___ э́ту матрёшку.
    hint: она́
    accept:
    - ей
  - stem: Возьми́те ___.
    hint: э́тот тёплый сви́тер
    accept:
    - э́тот тёплый сви́тер
  - stem: Приме́рьте ___.
    hint: э́та зи́мняя ку́ртка
    accept:
    - э́ту зи́мнюю ку́ртку
  - stem: Купи́те ___ пода́рок.
    hint: ба́бушка
    accept:
    - ба́бушке
  - stem: Помоги́те, пожа́луйста, ___.
    hint: мой сын
    accept:
    - моему́ сы́ну
  - stem: Да́йте, пожа́луйста, ___.
    hint: ру́сский слова́рь
    accept:
    - ру́сский слова́рь
  why: |
    第 1、2、5–7 题：给谁、帮谁用第三格：[мне, нам, ей]{.ru}；[помо́чь]{.ru} 要求第三格：[Помоги́те мне]{.ru}。
    第 10、11 题：名词第三格：[ба́бушке, моему́ сы́ну]{.ru}。
    第 3、8、12 题：阳性非动物名词第四格同第一格，修饰语也不变。
    第 4、9 题：阴性第四格：[э́ту бе́лую ша́пку, э́ту зи́мнюю ку́ртку]{.ru}；软变化写 [-юю]{.ru}。
