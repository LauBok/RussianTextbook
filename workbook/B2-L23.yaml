  why: |-
    第 1–6 题：词干 + [-ее]{.ru}，重音落在 [-е́е]{.ru}：[длинне́е, тепле́е, холодне́е, быстре́е, сильне́е, трудне́е]{.ru}。这些词阴性短尾重音在词尾（[длинна́, тепла́]{.ru}）。
    第 7–12 题：词干 + [-ее]{.ru}，保留原级的重音：[краси́вее, интере́снее, серьёзнее, ве́жливее, удо́бнее, споко́йнее]{.ru}。
    第 13–20 题：词干末辅音交替，只加 [-е]{.ru}，重音在词干：[г → ж]{.ru}（[доро́же]{.ru}），[к → ч]{.ru}（[ле́гче, коро́че]{.ru}），[х → ш]{.ru}（[ти́ше]{.ru}），[д → ж]{.ru}（[моло́же]{.ru}），[ст → щ]{.ru}（[про́ще, чи́ще]{.ru}），[зк → ж]{.ru}（[бли́же]{.ru}）。[коро́ткий]{.ru} 去掉 [-к-]{.ru}，[ле́гче]{.ru} 读 [[ле́хче]]{.tr}。
    第 21–30 题：特殊形式，单独记：[лу́чше, ху́же, бо́льше, ме́ньше, ста́рше, вы́ше, ши́ре, глу́бже, да́льше, деше́вле]{.ru}。[ста́рше]{.ru} 只指年龄。
- id: B2-L23-02
  tags:
  - 比较对象：чем 与第二格
  task: 比较对象怎样表达？把每组比较的两项归栏。
  type: classify
  bins:
  - 可以用第二格
  - 只能用 [чем]{.ru}
  items:
  - text: '[Во́лга — Нева́]{.ru}'
    answer: 可以用第二格
  - text: '[я — он]{.ru}'
    answer: 可以用第二格
  - text: '[Ми́ша — А́нна]{.ru}'
    answer: 可以用第二格
  - text: '[Москва́ — Петербу́рг]{.ru}'
    answer: 可以用第二格
  - text: '[мой брат — я]{.ru}'
    answer: 可以用第二格
  - text: '[э́та кни́га — та]{.ru}'
    answer: 可以用第二格
  - text: '[Байка́л — все озёра]{.ru}'
    answer: 可以用第二格
  - text: '[чай — молоко́]{.ru}'
    answer: 可以用第二格
  - text: '[в Москве́ — на Ку́бе]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[ле́том — зимо́й]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[у́тром — ве́чером]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[чита́ть — писа́ть]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[по-ру́сски — по-англи́йски]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[сего́дня — вчера́]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[на по́езде — на самолёте]{.ru}'
    answer: 只能用 [чем]{.ru}
  - text: '[в на́шей гру́ппе — в ва́шей]{.ru}'
    answer: 只能用 [чем]{.ru}
  why: |-
    第 1–8 题：比较的两项都是第一格（名词、代词），可以用第二格：[Во́лга длинне́е Невы́. Я ста́рше его́. Байка́л глу́бже всех озёр.]{.ru}也可以用 [чем]{.ru}。第 2、5 题代词放在比较级后用第二格，不加 [н-]{.ru}：[ста́рше его́, моло́же меня́]{.ru}。
    第 9–16 题：两项是前置词词组、副词、不定式或表示时间的第五格，不是第一格，只能用 [чем]{.ru}，[чем]{.ru} 后面保持原来的形式：[На Ку́бе тепле́е, чем в Москве́. Ле́том лу́чше, чем зимо́й.]{.ru}
- id: B2-L23-03
