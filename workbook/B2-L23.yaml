    - '[длинне́е Во́лга]{.ru}'
    - '[длинне́е Во́лги]{.ru}'
  - base: '[ти́хее]{.ru}'
    cells:
    - '[ти́хее]{.ru}'
    - '[ти́ше]{.ru}'
  - base: '[глу́бже]{.ru}'
    cells:
    - '[глу́бже]{.ru}'
    - '[глу́бже]{.ru}'
  - base: '[о́чень лу́чше]{.ru}'
    cells:
    - '[о́чень лу́чше]{.ru}'
    - '[гора́здо лу́чше]{.ru}'
  - base: '[ста́рше меня́]{.ru}'
    cells:
    - '[ста́рше меня́]{.ru}'
    - '[ста́рше меня́]{.ru}'
  - base: '[моло́дее]{.ru}'
    cells:
    - '[моло́дее]{.ru}'
    - '[моло́же]{.ru}'
  why: |-
    第 1、14 题：[о́чень]{.ru} 不修饰比较级，用 [гора́здо]{.ru} 或 [намно́го]{.ru}：[гора́здо длинне́е]{.ru}（也可 [намно́го длинне́е]{.ru}）。
    第 2 题：比较级后的代词第二格不加 [н-]{.ru}：[ста́рше его́]{.ru}。第 15 题正确。
    第 3、6、9、16 题：特殊形式或交替：[лу́чше, вы́ше, деше́вле, моло́же]{.ru}，不能按 [-ее]{.ru} 构成。
    第 4、8、10、12 题：[г, зк, ст, х]{.ru} 结尾的词交替后只加 [-е]{.ru}：[доро́же, бли́же, про́ще, ти́ше]{.ru}。
    第 7 题：重音落在 [-е́е]{.ru}，[ё]{.ru} 变 [е]{.ru}：[тепле́е]{.ru}。
    第 11 题：比较对象用第二格时要变格：[длинне́е Во́лги]{.ru}。
    第 5、13 题：正确。
- id: B2-L23-04
  tags:
  - 形容词比较级：句中
  task: 用括号里形容词的比较级填空。
  type: fill
  items:
  - stem: Янцзы́ ___ Во́лги.
    hint: дли́нный
    accept:
    - длинне́е
  - stem: В Москве́ ___, чем в Пеки́не.
    hint: холо́дный
    accept:
    - холодне́е
  - stem: Ми́ша ___ А́нны.
    hint: молодо́й
    accept:
    - моло́же
  - stem: Э́тот уче́бник ___, чем тот.
    hint: интере́сный
    accept:
    - интере́снее
  - stem: Здоро́вье ___ всего́.
    hint: дорого́й
    accept:
    - доро́же
  - stem: Эльбру́с ___ Фу́дзи.
    hint: высо́кий
    accept:
    - вы́ше
  - stem: Байка́л ___ всех озёр.
    hint: глубо́кий
    accept:
    - глу́бже
  why: |-
    第 1、2 题：重音在 [-е́е]{.ru}：[длинне́е, холодне́е]{.ru}。第 1 题比较对象用第二格 [Во́лги]{.ru}，第 2 题两项是 [в]{.ru} + 第六格，只能用 [чем]{.ru}。
    第 4 题：保留原级重音：[интере́снее]{.ru}。
    第 3、5 题：交替 + [-е]{.ru}：[моло́же, доро́же]{.ru}。第 5 题比较级 + [всего́]{.ru}“比什么都……”。
    第 6、7 题：特殊形式：[вы́ше, глу́бже]{.ru}。第 7 题比较级 + [всех]{.ru}“比所有的都……”。
