  why: '第 1、4、6、8、9、11、13、16 题：词根是 [да-, зна-, ста-]{.ru} 的 [-дава́ть, -знава́ть, -става́ть]{.ru}，现在时去掉 [-ва-]{.ru}：[встаю́, даю́, узнаю́, устаю́, продаю́, передаю́, задаю́, сдаю́]{.ru}。

    第 2、3、5、7、10、12、14、15 题：[-ва-]{.ru} 前不是这三个词根，[-ва-]{.ru} 属于词干，按 [чита́ть]{.ru} 的规则变：[успева́ю, одева́ю, быва́ю, открыва́ю, умыва́юсь, забыва́ю, выздора́вливаю, надева́ю]{.ru}。只看结尾 [-вать]{.ru} 就去掉 [-ва-]{.ru}，是这一组最容易犯的错。'
