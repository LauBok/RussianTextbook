    第 7 题：[ложи́ться]{.ru} 词干末尾是 [ж]{.ru}，按拼写规则写 [ложу́сь, ложа́тся]{.ru}，不写 [ю, ят]{.ru}。第 8 题 [учи́ться]{.ru} 同样写 [учу́сь, у́чатся]{.ru}，重音从第二人称起移到词干：[у́чишься]{.ru}。

