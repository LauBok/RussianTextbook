    第 5–10 题：[передава́ть, продава́ть, задава́ть, отдава́ть, сдава́ть, преподава́ть]{.ru} 都含 [-дава́ть]{.ru}，和 [дава́ть]{.ru} 一样变：[продаю́, продаёшь]{.ru}，[преподаю́, преподаёшь]{.ru}。最常见的错误是保留 [-ва-]{.ru}，写成 [встава́ю, дава́ешь]{.ru}。'
