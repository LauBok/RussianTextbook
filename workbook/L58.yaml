heading: 第 58 课　状态副词与无人称句
groups:
- id: L58-01
  tags: [无人称句：状态副词的时间]
  task: 用给出的词写出无人称句的现在时、过去时和将来时。
  type: matrix
  cols: [给出的词, 现在, 过去, 将来]
  given: [0]
  rows:
  - {base: '[я, хо́лодно]{.ru}', cells: ['[я, хо́лодно]{.ru}', '[Мне хо́лодно.]{.ru}', '[Мне бы́ло хо́лодно.]{.ru}', '[Мне бу́дет хо́лодно.]{.ru}']}
  - {base: '[он, ску́чно]{.ru}', cells: ['[он, ску́чно]{.ru}', '[Ему́ ску́чно.]{.ru}', '[Ему́ бы́ло ску́чно.]{.ru}', '[Ему́ бу́дет ску́чно.]{.ru}']}
  - {base: '[А́нна, интере́сно]{.ru}', cells: ['[А́нна, интере́сно]{.ru}', '[А́нне интере́сно.]{.ru}', '[А́нне бы́ло интере́сно.]{.ru}', '[А́нне бу́дет интере́сно.]{.ru}']}
  - {base: '[мы, ве́село]{.ru}', cells: ['[мы, ве́село]{.ru}', '[Нам ве́село.]{.ru}', '[Нам бы́ло ве́село.]{.ru}', '[Нам бу́дет ве́село.]{.ru}']}
  - {base: '[ты, тепло́]{.ru}', cells: ['[ты, тепло́]{.ru}', '[Тебе́ тепло́.]{.ru}', '[Тебе́ бы́ло тепло́.]{.ru}', '[Тебе́ бу́дет тепло́.]{.ru}']}
  - {base: '[Ми́ша, тру́дно]{.ru}', cells: ['[Ми́ша, тру́дно]{.ru}', '[Ми́ше тру́дно.]{.ru}', '[Ми́ше бы́ло тру́дно.]{.ru}', '[Ми́ше бу́дет тру́дно.]{.ru}']}
  - {base: '[вы, хорошо́]{.ru}', cells: ['[вы, хорошо́]{.ru}', '[Вам хорошо́.]{.ru}', '[Вам бы́ло хорошо́.]{.ru}', '[Вам бу́дет хорошо́.]{.ru}']}
  - {base: '[они́, ве́село]{.ru}', cells: ['[они́, ве́село]{.ru}', '[Им ве́село.]{.ru}', '[Им бы́ло ве́село.]{.ru}', '[Им бу́дет ве́село.]{.ru}']}
  - {base: '[ба́бушка, хо́лодно]{.ru}', cells: ['[ба́бушка, хо́лодно]{.ru}', '[Ба́бушке хо́лодно.]{.ru}', '[Ба́бушке бы́ло хо́лодно.]{.ru}', '[Ба́бушке бу́дет хо́лодно.]{.ru}']}
  - {base: '[она́, ску́чно]{.ru}', cells: ['[она́, ску́чно]{.ru}', '[Ей ску́чно.]{.ru}', '[Ей бы́ло ску́чно.]{.ru}', '[Ей бу́дет ску́чно.]{.ru}']}
  - {base: '[на у́лице, тепло́]{.ru}', cells: ['[на у́лице, тепло́]{.ru}', '[На у́лице тепло́.]{.ru}', '[На у́лице бы́ло тепло́.]{.ru}', '[На у́лице бу́дет тепло́.]{.ru}']}
  - {base: '[в ко́мнате, хо́лодно]{.ru}', cells: ['[в ко́мнате, хо́лодно]{.ru}', '[В ко́мнате хо́лодно.]{.ru}', '[В ко́мнате бы́ло хо́лодно.]{.ru}', '[В ко́мнате бу́дет хо́лодно.]{.ru}']}
  why: |
    第 1–10 题：说人的感受，感受的人用第三格（[мне, ему́, А́нне, нам…]{.ru}）；现在时不用动词，过去时加 [бы́ло]{.ru}，将来时加 [бу́дет]{.ru}。[бы́ло]{.ru} 永远是中性，不随人变：[А́нне бы́ло, Ей бы́ло]{.ru}，不是 [была́]{.ru}；[нам, им]{.ru} 后面也不用 [бы́ли, бу́дут]{.ru}。
    第 11、12 题：说环境、天气，不说人，只有处所词和状态副词，时间的表示方法一样。
- id: L58-02
  tags: [状态副词：由形容词构成与重音]
  task: 写出由形容词构成的谓语副词，注意重音。
  type: matrix
  cols: [形容词, 谓语副词]
  given: [0]
  rows:
  - {base: '[холо́дный]{.ru}', cells: ['[холо́дный]{.ru}', '[хо́лодно]{.ru}']}
  - {base: '[тёплый]{.ru}', cells: ['[тёплый]{.ru}', '[тепло́]{.ru}']}
  - {base: '[весёлый]{.ru}', cells: ['[весёлый]{.ru}', '[ве́село]{.ru}']}
  - {base: '[ску́чный]{.ru}', cells: ['[ску́чный]{.ru}', '[ску́чно]{.ru}']}
  - {base: '[интере́сный]{.ru}', cells: ['[интере́сный]{.ru}', '[интере́сно]{.ru}']}
  - {base: '[тру́дный]{.ru}', cells: ['[тру́дный]{.ru}', '[тру́дно]{.ru}']}
  - {base: '[хоро́ший]{.ru}', cells: ['[хоро́ший]{.ru}', '[хорошо́]{.ru}']}
  - {base: '[плохо́й]{.ru}', cells: ['[плохо́й]{.ru}', '[пло́хо]{.ru}']}
  - {base: '[дорого́й]{.ru}', cells: ['[дорого́й]{.ru}', '[до́рого]{.ru}']}
  - {base: '[ва́жный]{.ru}', cells: ['[ва́жный]{.ru}', '[ва́жно]{.ru}']}
  - {base: '[краси́вый]{.ru}', cells: ['[краси́вый]{.ru}', '[краси́во]{.ru}']}
  - {base: '[сло́жный]{.ru}', cells: ['[сло́жный]{.ru}', '[сло́жно]{.ru}']}
  - {base: '[лёгкий]{.ru}', hint: 重音在词尾, new: true, gloss: 容易的, cells: ['[лёгкий]{.ru}', '[легко́]{.ru}']}
  - {base: '[жа́ркий]{.ru}', new: true, gloss: 炎热的, cells: ['[жа́ркий]{.ru}', '[жа́рко]{.ru}']}
  why: |
    第 1–14 题：去掉形容词词尾 [-ый / -ий / -о́й]{.ru}，加 [-о]{.ru}。
    第 4–6、10–12、14 题：重音和形容词一样：[ску́чно, интере́сно, тру́дно, ва́жно, краси́во, сло́жно, жа́рко]{.ru}。
    第 1–3、7–9、13 题：重音和形容词不同，要分开记：[холо́дный — хо́лодно, тёплый — тепло́, весёлый — ве́село, хоро́ший — хорошо́, плохо́й — пло́хо, дорого́й — до́рого, лёгкий — легко́]{.ru}。第 2、3、13 题 [ё]{.ru} 不带重音时写成 [е]{.ru}：[тепло́, ве́село, легко́]{.ru}。
- id: L58-03
  tags: [无人称句：感受者用第三格]
  task: 把括号里表示感受者的词变成第三格。
  type: fill
  items:
  - {stem: '___ ску́чно.', hint: А́нна, accept: [А́нне]}
  - {stem: '___ бы́ло хо́лодно.', hint: я, accept: [мне]}
  - {stem: '___ интере́сно?', hint: вы, accept: [вам]}
  - {stem: '___ бу́дет тепло́ в э́той ку́ртке.', hint: ты, accept: [тебе́]}
  - {stem: '___ бы́ло ве́село на пра́зднике.', hint: мы, accept: [нам]}
  - {stem: '___ тру́дно чита́ть по-ру́сски.', hint: Ван Лэй, accept: [Ван Лэ́ю]}
  - {stem: '___ бы́ло ску́чно до́ма.', hint: Ми́ша, accept: [Ми́ше]}
  - {stem: '___ не хо́лодно?', hint: ба́бушка, accept: [ба́бушке]}
  - {stem: '___ бы́ло интере́сно на экску́рсии.', hint: они́, accept: [им]}
  - {stem: '___ тепло́ в пальто́.', hint: он, accept: [ему́]}
  - {stem: '___ бы́ло пло́хо.', hint: больно́й, accept: [больно́му]}
  - {stem: '___ ве́село в Москве́?', hint: Пьер, accept: [Пье́ру]}
  - {stem: '___ бу́дет тру́дно.', hint: О́льга Ви́кторовна, accept: [О́льге Ви́кторовне]}
  - {stem: '___ бы́ло хо́лодно на у́лице.', hint: она́, accept: [ей]}
  why: |
    第 1–14 题：汉语说“我冷”“他无聊”，“我”“他”是主语；俄语里感受的人用第三格，句子没有第一格主语。
    第 2–5、9、10、14 题：人称代词第三格 [мне, вам, тебе́, нам, им, ему́, ей]{.ru}。
    第 1、7、8、13 题：[-а]{.ru} 结尾的名词变 [-е]{.ru}，阳性的 [Ми́ша]{.ru} 也一样：[Ми́ше]{.ru}；名字和父称都变：[О́льге Ви́кторовне]{.ru}。
    第 6、12 题：阳性名词加 [-у / -ю]{.ru}：[Ван Лэ́ю, Пье́ру]{.ru}。
    第 11 题：[больно́й]{.ru} 作名词时按形容词变，阳性第三格 [больно́му]{.ru}。
- id: L58-04
  tags: [无人称句：常见错误核查]
  task: 每句都有一处错误，写出正确的句子。
  type: matrix
  cols: [有错误的句子, 正确的句子]
  given: [0]
  rows:
  - {base: '[Я хо́лодно.]{.ru}', cells: ['[Я хо́лодно.]{.ru}', '[Мне хо́лодно.]{.ru}']}
  - {base: '[А́нне была́ интере́сно.]{.ru}', cells: ['[А́нне была́ интере́сно.]{.ru}', '[А́нне бы́ло интере́сно.]{.ru}']}
  - {base: '[Мне холо́дный.]{.ru}', cells: ['[Мне холо́дный.]{.ru}', '[Мне хо́лодно.]{.ru}']}
  - {base: '[Сего́дня холо́дная.]{.ru}', cells: ['[Сего́дня холо́дная.]{.ru}', '[Сего́дня хо́лодно.]{.ru}']}
  - {base: '[Ему́ бу́дут ску́чно.]{.ru}', cells: ['[Ему́ бу́дут ску́чно.]{.ru}', '[Ему́ бу́дет ску́чно.]{.ru}']}
  - {base: '[Вчера́ был тепло́.]{.ru}', cells: ['[Вчера́ был тепло́.]{.ru}', '[Вчера́ бы́ло тепло́.]{.ru}']}
  - {base: '[Э́то ску́чно фильм.]{.ru}', cells: ['[Э́то ску́чно фильм.]{.ru}', '[Э́то ску́чный фильм.]{.ru}']}
  - {base: '[Мы ве́село.]{.ru}', cells: ['[Мы ве́село.]{.ru}', '[Нам ве́село.]{.ru}']}
  - {base: '[Ми́ша бы́ло тру́дно.]{.ru}', cells: ['[Ми́ша бы́ло тру́дно.]{.ru}', '[Ми́ше бы́ло тру́дно.]{.ru}']}
  - {base: '[Учи́ться тру́дный.]{.ru}', cells: ['[Учи́ться тру́дный.]{.ru}', '[Учи́ться тру́дно.]{.ru}']}
  - {base: '[В ку́ртке тёплая.]{.ru}', cells: ['[В ку́ртке тёплая.]{.ru}', '[В ку́ртке тепло́.]{.ru}']}
  - {base: '[Нам бы́ли ве́село.]{.ru}', cells: ['[Нам бы́ли ве́село.]{.ru}', '[Нам бы́ло ве́село.]{.ru}']}
  - {base: '[Э́то интере́сно кни́га.]{.ru}', cells: ['[Э́то интере́сно кни́га.]{.ru}', '[Э́то интере́сная кни́га.]{.ru}']}
  - {base: '[Гуля́ть по го́роду весёлый.]{.ru}', cells: ['[Гуля́ть по го́роду весёлый.]{.ru}', '[Гуля́ть по го́роду ве́село.]{.ru}']}
  why: |
    第 1、8、9 题：感受的人用第三格：[Мне, Нам, Ми́ше]{.ru}，不能用第一格。
    第 2、5、6、12 题：无人称句过去时永远用中性 [бы́ло]{.ru}，将来时用 [бу́дет]{.ru}，不随人或其他词变。
    第 3、4、10、11、14 题：说“觉得冷”、天气、对某事的评价，用谓语副词 [хо́лодно, тру́дно, тепло́, ве́село]{.ru}，不用形容词。[Мне холо́дный]{.ru} 没有意义，[Я холо́дный]{.ru} 是“我是个冷冰冰的人”。
    第 7、13 题：修饰名词要用形容词，和名词的性一致：[ску́чный фильм, интере́сная кни́га]{.ru}。
