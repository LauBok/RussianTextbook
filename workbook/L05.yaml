    - '[мои́ сыновья́]{.ru}'
  - base: '[мой каранда́ш]{.ru}'
    cells:
    - '[мой каранда́ш]{.ru}'
    - '[мои́ карандаши́]{.ru}'
  - base: '[моя́ ла́мпа]{.ru}'
    cells:
    - '[моя́ ла́мпа]{.ru}'
    - '[мои́ ла́мпы]{.ru}'
  why: |-
    各题“我的”一律改成 [мои́]{.ru}，不分阳性、阴性、中性。
    第 1、8、17、20 题：硬辅音结尾的阳性名词加 [-ы]{.ru}，阴性 [-а]{.ru} 改 [-ы]{.ru}：[чемода́ны, газе́ты, журна́лы, ла́мпы]{.ru}。
    第 12、16 题：[стол, шкаф]{.ru} 也加 [-ы]{.ru}，但复数重音移到词尾：[столы́, шкафы́]{.ru}。
    第 2、10、15 题：[-ь]{.ru} 改 [-и]{.ru}：[тетра́ди, крова́ти]{.ru}；[словари́]{.ru} 重音在词尾。
    第 4、5、13、19 题：[г, к, ж, ш, ч]{.ru} 后写 [и]{.ru}：[кни́ги, ру́чки, ключи́, карандаши́]{.ru}。
    第 3 题：中性 [-о]{.ru} 改 [-а]{.ru}：[кре́сла]{.ru}。
    第 6、9 题：[окно́, письмо́]{.ru} 复数重音前移：[о́кна, пи́сьма]{.ru}。
    第 7、18 题：不规则复数要逐个记：[дом → дома́]{.ru}（不是 [до́мы]{.ru}），[сын → сыновья́]{.ru}。
    第 14 题：[пода́рок]{.ru} 词干里的 [о]{.ru} 脱落：[пода́рки]{.ru}，生词表给出的第二格 [пода́рка]{.ru} 就是提示。
    第 11 题：[фо́то]{.ru} 不变格，复数仍是 [фо́то]{.ru}。
