    第 2、6、10、14、16 题：按词尾本该用 [-ы]{.ru}，因拼写规则改写 [-и]{.ru}：[ру́чки, ключи́, кни́ги, шко́льники, ко́шки]{.ru}。
    第 4、8、12、18 题：[-ь]{.ru}、[-я]{.ru} 结尾的名词用 [-и]{.ru}：[крова́ти, фами́лии, словари́, ку́хни]{.ru}。
    第 3、7、11、15 题：中性 [-о]{.ru} 结尾的名词用 [-а]{.ru}：[кре́сла, о́кна, пи́сьма, пра́вила]{.ru}。
