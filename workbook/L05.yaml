    第 3 题：[-ь]{.ru} 结尾的名词改 [-и]{.ru}，不加 [-ы]{.ru}：[тетра́ди]{.ru}。
    第 12 题：[п]{.ru} 不在拼写规则的七个字母里，[-а]{.ru} 照常改 [-ы]{.ru}：[ла́мпы]{.ru}。
    第 7、9、10 题：中性 [-о]{.ru} 改 [-а]{.ru}，不改 [-ы]{.ru}：[кре́сла, о́кна, пи́сьма]{.ru}；[о́кна, пи́сьма]{.ru} 重音在词干。
