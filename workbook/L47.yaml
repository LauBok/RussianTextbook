heading: 第 47 课　时刻与时间长度
groups:
- id: L47-01
  tags: [时间表达：几点做某事]
  task: 写出“几点做某事”的说法（数字用词写出）。
  type: matrix
  cols: [时刻, '[в]{.ru} + 钟点']
  given: [0]
  rows:
  - {base: '[1:00]{.ru}', cells: ['[1:00]{.ru}', '[в час]{.ru}']}
  - {base: '[2:00]{.ru}', cells: ['[2:00]{.ru}', '[в два часа́]{.ru}']}
  - {base: '[3:00]{.ru}', cells: ['[3:00]{.ru}', '[в три часа́]{.ru}']}
  - {base: '[4:00]{.ru}', cells: ['[4:00]{.ru}', '[в четы́ре часа́]{.ru}']}
  - {base: '[5:00]{.ru}', cells: ['[5:00]{.ru}', '[в пять часо́в]{.ru}']}
  - {base: '[6:00]{.ru}', cells: ['[6:00]{.ru}', '[в шесть часо́в]{.ru}']}
  - {base: '[8:00]{.ru}', cells: ['[8:00]{.ru}', '[в во́семь часо́в]{.ru}']}
  - {base: '[11:00]{.ru}', cells: ['[11:00]{.ru}', '[в оди́ннадцать часо́в]{.ru}']}
  - {base: '[12:00]{.ru}', cells: ['[12:00]{.ru}', '[в двена́дцать часо́в]{.ru}']}
  - {base: '[14:00]{.ru}', cells: ['[14:00]{.ru}', '[в четы́рнадцать часо́в]{.ru}']}
  - {base: '[18:00]{.ru}', cells: ['[18:00]{.ru}', '[в восемна́дцать часо́в]{.ru}']}
  - {base: '[20:00]{.ru}', cells: ['[20:00]{.ru}', '[в два́дцать часо́в]{.ru}']}
  - {base: '[21:00]{.ru}', cells: ['[21:00]{.ru}', '[в два́дцать оди́н час]{.ru}']}
  - {base: '[22:00]{.ru}', cells: ['[22:00]{.ru}', '[в два́дцать два часа́]{.ru}']}
  - {base: '[23:00]{.ru}', cells: ['[23:00]{.ru}', '[в два́дцать три часа́]{.ru}']}
  - {base: '[7:30]{.ru}', hint: 口语说法, cells: ['[7:30]{.ru}', '[в семь три́дцать]{.ru}']}
  why: |
    第 1 题：“一点”只说 [в час]{.ru}，不说 [в оди́н час]{.ru}。
    第 2–4、14、15 题：最后一个数词是 [два, три, четы́ре]{.ru}，用 [часа́]{.ru}：[в два часа́, в два́дцать три часа́]{.ru}。
    第 5–12 题：5–20 都用 [часо́в]{.ru}；11–14 是一个词，看整个词，不看末尾的“1–4”：[в четы́рнадцать часо́в]{.ru}。
    第 13 题：最后一个数词是 [оди́н]{.ru}，用 [час]{.ru}：[в два́дцать оди́н час]{.ru}。
    第 16 题：口语里只说两个数：[в семь три́дцать]{.ru}；正式说法 [в семь часо́в три́дцать мину́т]{.ru} 也对。
- id: L47-02
  tags: [时间表达：过多久以后与多久以前]
  task: 写出时间长度和 [че́рез]{.ru}、[наза́д]{.ru} 组成的词组（数字用词写出）。
  type: matrix
  cols: [数量, '[че́рез]{.ru} + 第四格', '……[наза́д]{.ru}']
  given: [0]
  rows:
  - {base: '[1 мину́та]{.ru}', cells: ['[1 мину́та]{.ru}', '[че́рез мину́ту]{.ru}', '[мину́ту наза́д]{.ru}']}
  - {base: '[2 мину́та]{.ru}', cells: ['[2 мину́та]{.ru}', '[че́рез две мину́ты]{.ru}', '[две мину́ты наза́д]{.ru}']}
  - {base: '[5 мину́та]{.ru}', cells: ['[5 мину́та]{.ru}', '[че́рез пять мину́т]{.ru}', '[пять мину́т наза́д]{.ru}']}
  - {base: '[20 мину́та]{.ru}', cells: ['[20 мину́та]{.ru}', '[че́рез два́дцать мину́т]{.ru}', '[два́дцать мину́т наза́д]{.ru}']}
  - {base: '[полчаса́]{.ru}', cells: ['[полчаса́]{.ru}', '[че́рез полчаса́]{.ru}', '[полчаса́ наза́д]{.ru}']}
  - {base: '[1 час]{.ru}', cells: ['[1 час]{.ru}', '[че́рез час]{.ru}', '[час наза́д]{.ru}']}
  - {base: '[3 час]{.ru}', cells: ['[3 час]{.ru}', '[че́рез три часа́]{.ru}', '[три часа́ наза́д]{.ru}']}
  - {base: '[6 час]{.ru}', cells: ['[6 час]{.ru}', '[че́рез шесть часо́в]{.ru}', '[шесть часо́в наза́д]{.ru}']}
  - {base: '[2 день]{.ru}', hint: '[дня]{.ru}', cells: ['[2 день]{.ru}', '[че́рез два дня]{.ru}', '[два дня наза́д]{.ru}']}
  - {base: '[1 неде́ля]{.ru}', cells: ['[1 неде́ля]{.ru}', '[че́рез неде́лю]{.ru}', '[неде́лю наза́д]{.ru}']}
  - {base: '[2 неде́ля]{.ru}', cells: ['[2 неде́ля]{.ru}', '[че́рез две неде́ли]{.ru}', '[две неде́ли наза́д]{.ru}']}
  - {base: '[1 ме́сяц]{.ru}', cells: ['[1 ме́сяц]{.ru}', '[че́рез ме́сяц]{.ru}', '[ме́сяц наза́д]{.ru}']}
  - {base: '[3 ме́сяц]{.ru}', cells: ['[3 ме́сяц]{.ru}', '[че́рез три ме́сяца]{.ru}', '[три ме́сяца наза́д]{.ru}']}
  - {base: '[1 год]{.ru}', cells: ['[1 год]{.ru}', '[че́рез год]{.ru}', '[год наза́д]{.ru}']}
  - {base: '[4 год]{.ru}', cells: ['[4 год]{.ru}', '[че́рез четы́ре го́да]{.ru}', '[четы́ре го́да наза́д]{.ru}']}
  - {base: '[10 год]{.ru}', cells: ['[10 год]{.ru}', '[че́рез де́сять лет]{.ru}', '[де́сять лет наза́д]{.ru}']}
  why: |
    第 1、10 题：时间词组用第四格，阴性 [-а / -я]{.ru} 变 [-у / -ю]{.ru}：[мину́ту, неде́лю]{.ru}；数量为 1 时一般不说 [одну́]{.ru}。
    第 6、12、14 题：阳性非动物名词第四格同第一格：[час, ме́сяц, год]{.ru}，同样不加 [оди́н]{.ru}。
    第 2、7、9、11、13、15 题：[два / две, три, четы́ре]{.ru} 后面用单数第二格：[мину́ты, часа́, дня, неде́ли, ме́сяца, го́да]{.ru}；阴性名词前用 [две]{.ru}。[день]{.ru} 变格时 [е]{.ru} 脱落，写 [дня]{.ru}。
    第 3、4、8、16 题：5 以上用已学的特殊形式 [мину́т, часо́в, лет]{.ru}。
    第 5 题：[полчаса́]{.ru} 本身不变。
    第 1–16 题：[че́рез]{.ru} 放在词组前面，[наза́д]{.ru} 放在词组后面，词组本身形式相同。
- id: L47-03
  tags: [时间表达：时刻、时长、以后与以前]
  task: 判断句中的时间词组表示什么，填写序号。
  type: classify
  bins: [几点（时刻）, 过多久以后, 多久以前, 持续多久]
  items:
  - {text: '[Магази́н открыва́ется в де́вять часо́в.]{.ru}', answer: 几点（时刻）}
  - {text: '[Че́рез полчаса́ я бу́ду до́ма.]{.ru}', answer: 过多久以后}
  - {text: '[Она́ звони́ла час наза́д.]{.ru}', answer: 多久以前}
  - {text: '[Я чита́л два часа́.]{.ru}', answer: 持续多久}
  - {text: '[Уро́к начина́ется в два часа́.]{.ru}', answer: 几点（时刻）}
  - {text: '[Ван Лэй верну́лся че́рез час.]{.ru}', answer: 过多久以后}
  - {text: '[Мы жда́ли авто́бус два́дцать мину́т.]{.ru}', answer: 持续多久}
  - {text: '[Я был в Пеки́не ме́сяц наза́д.]{.ru}', answer: 多久以前}
  - {text: '[Че́рез неде́лю у нас семина́р.]{.ru}', answer: 过多久以后}
  - {text: '[Ми́ша игра́л в футбо́л час.]{.ru}', answer: 持续多久}
  - {text: '[— Во ско́лько у тебя́ уро́к? — В час.]{.ru}', answer: 几点（时刻）}
  - {text: '[Пять лет наза́д мы жи́ли в Пеки́не.]{.ru}', answer: 多久以前}
  - {text: '[Фильм начался́ де́сять мину́т наза́д.]{.ru}', answer: 多久以前}
  - {text: '[Па́па рабо́тал на заво́де три го́да.]{.ru}', answer: 持续多久}
  - {text: '[Магази́н закрыва́ется че́рез пять мину́т.]{.ru}', answer: 过多久以后}
  - {text: '[Я верну́сь в семь три́дцать.]{.ru}', answer: 几点（时刻）}
  - {text: '[Ба́бушка гото́вила обе́д полчаса́.]{.ru}', answer: 持续多久}
  - {text: '[Че́рез два го́да брат зако́нчит шко́лу.]{.ru}', answer: 过多久以后}
  why: |
    第 1、5、11、16 题：[в]{.ru} + 钟点回答“几点”：[в де́вять часо́в, в два часа́, в час, в семь три́дцать]{.ru}。
    第 2、6、9、15、18 题：[че́рез]{.ru} + 时间长度表示从现在（或从所说的时刻）算起过多久以后。
    第 3、8、12、13 题：时间长度 + [наза́д]{.ru} 表示多久以前，动词用过去时。
    第 4、7、10、14、17 题：不带前置词的时间长度说明动作持续多久，常和未完成体连用。第 4 题 [два часа́]{.ru} 和第 5 题 [в два часа́]{.ru} 只差一个 [в]{.ru}，意思完全不同。
- id: L47-04
  tags: [时间表达：数词与时间名词连用]
  task: 把括号里的数字和名词写成正确的形式（数字用词写出）。
  type: fill
  items:
  - {stem: 'Магази́н открыва́ется в ___.', hint: '9, час', accept: [де́вять часо́в]}
  - {stem: 'Ле́кция начина́ется че́рез ___.', hint: '2, мину́та', accept: [две мину́ты]}
  - {stem: 'А́нна верну́лась ___ наза́д.', hint: '3, час', accept: [три часа́]}
  - {stem: 'Мы бу́дем у́жинать в ___.', hint: '7, час', accept: [семь часо́в]}
  - {stem: 'Че́рез ___ у нас пра́здник.', hint: '1, неде́ля', accept: [неде́лю]}
  - {stem: 'Па́па был в Пеки́не ___ наза́д.', hint: '2, ме́сяц', accept: [два ме́сяца]}
  - {stem: 'Я жил в Москве́ ___.', hint: '5, год', accept: [пять лет]}
  - {stem: 'Электри́чка бу́дет че́рез ___.', hint: '20, мину́та', accept: [два́дцать мину́т]}
  - {stem: 'Уро́к начина́ется в ___.', hint: '1, час', accept: [час]}
  - {stem: 'Ми́ша игра́л в футбо́л ___.', hint: '4, час', accept: [четы́ре часа́]}
  - {stem: 'Фильм начался́ ___ наза́д.', hint: '10, мину́та', accept: [де́сять мину́т]}
  - {stem: 'Ван Лэй верну́лся в ___.', hint: '11, час', accept: [оди́ннадцать часо́в]}
  - {stem: 'Че́рез ___ бу́дет Но́вый год.', hint: '2, ме́сяц', accept: [два ме́сяца]}
  - {stem: 'Студе́нты писа́ли упражне́ние ___.', hint: '45, мину́та', accept: [со́рок пять мину́т]}
  why: |
    第 1、4、9、12 题：[в]{.ru} + 钟点：[в де́вять часо́в, в семь часо́в, в оди́ннадцать часо́в]{.ru}；一点只说 [в час]{.ru}。
    第 2、3、6、10、13 题：2–4 后面用单数第二格：[две мину́ты, три часа́, два ме́сяца, четы́ре часа́]{.ru}；[мину́та]{.ru} 是阴性，用 [две]{.ru}。
    第 5 题：数量为 1 时只用名词第四格：[че́рез неде́лю]{.ru}。
    第 7、8、11、14 题：5 以上用 [лет, мину́т]{.ru}；第 14 题看最后一个数词 [пять]{.ru}，用 [мину́т]{.ru}。
    第 7、10、14 题没有前置词，表示持续多久；词组形式与 [че́рез, наза́д]{.ru} 后面的一样。
- id: L47-05
  tags: [时间表达：以后与以前的选择]
  task: 根据动词的时间，用 [че́рез]{.ru} 或 [наза́д]{.ru} 和括号里的时间写出词组（数字用词写出）。
  type: fill
  items:
  - {stem: 'Ван Лэй был в Пеки́не ___.', hint: '1 ме́сяц', accept: [ме́сяц наза́д]}
  - {stem: '___ у нас бу́дет семина́р.', hint: '1 неде́ля', accept: [че́рез неде́лю]}
  - {stem: 'А́нна звони́ла ___.', hint: '2 час', accept: [два часа́ наза́д]}
  - {stem: 'Ма́ма вернётся ___.', hint: 'полчаса́', accept: [че́рез полчаса́]}
  - {stem: 'Мы жи́ли в э́том до́ме ___.', hint: '10 год', accept: [де́сять лет наза́д]}
  - {stem: 'Магази́н закрыва́ется ___.', hint: '5 мину́та', accept: [че́рез пять мину́т]}
  - {stem: 'Фильм начался́ ___.', hint: '3 мину́та', accept: [три мину́ты наза́д]}
  - {stem: '___ Ми́ша зако́нчит шко́лу.', hint: '4 год', accept: [че́рез четы́ре го́да]}
  - {stem: 'Пьер купи́л телефо́н ___.', hint: '2 неде́ля', accept: [две неде́ли наза́д]}
  - {stem: 'Электри́чка бу́дет ___.', hint: '1 час', accept: [че́рез час]}
  - {stem: 'Ба́бушка была́ в Москве́ ___.', hint: '1 год', accept: [год наза́д]}
  - {stem: 'Я сде́лаю упражне́ние ___.', hint: '20 мину́та', accept: [че́рез два́дцать мину́т]}
  - {stem: 'Ю́ми верну́лась ___.', hint: '2 день', accept: [два дня наза́д]}
  - {stem: '___ бу́дет мой день рожде́ния.', hint: '3 ме́сяц', accept: [че́рез три ме́сяца]}
  why: |
    第 1、3、5、7、9、11、13 题：动词是过去时（[был, звони́ла, жи́ли, начался́, купи́л, была́, верну́лась]{.ru}），说多久以前，时长放在 [наза́д]{.ru} 前面。
    第 2、4、6、8、10、12、14 题：动词是将来时（[бу́дет, вернётся, зако́нчит, сде́лаю]{.ru}）或表示安排好的事的现在时（[закрыва́ется]{.ru}），说过多久以后，用 [че́рез]{.ru} + 第四格。
    数词后的名词形式：1 只用名词第四格（[ме́сяц, неде́лю, час, год]{.ru}），2–4 用单数第二格（[два часа́, три мину́ты, четы́ре го́да, две неде́ли, два дня, три ме́сяца]{.ru}），5 以上用 [мину́т, лет]{.ru}。
