heading: 第 67 课　表示原因的前置词
groups:
- id: B2-L67-01
  tags:
  - из-за + 第二格 / благодаря́ + 第三格
  task: 写出名词、代词和 [из-за]{.ru}、[благодаря́]{.ru} 的组合。
  type: matrix
  cols:
  - 名词 / 代词
  - '[из-за]{.ru} …'
  - '[благодаря́]{.ru} …'
  given:
  - 0
  rows:
  - base: '[дождь]{.ru}'
    cells:
    - '[дождь]{.ru}'
    - '[из-за дождя́]{.ru}'
    - '[благодаря́ дождю́]{.ru}'
  - base: '[рабо́та]{.ru}'
    cells:
    - '[рабо́та]{.ru}'
    - '[из-за рабо́ты]{.ru}'
    - '[благодаря́ рабо́те]{.ru}'
  - base: '[ты]{.ru}'
    cells:
    - '[ты]{.ru}'
    - '[из-за тебя́]{.ru}'
    - '[благодаря́ тебе́]{.ru}'
  - base: '[он]{.ru}'
    cells:
    - '[он]{.ru}'
    - '[из-за него́]{.ru}'
    - '[благодаря́ ему́]{.ru}'
  - base: '[она́]{.ru}'
    cells:
    - '[она́]{.ru}'
    - '[из-за неё]{.ru}'
    - '[благодаря́ ей]{.ru}'
  - base: '[ве́тер]{.ru}'
    cells:
    - '[ве́тер]{.ru}'
    - '[из-за ве́тра]{.ru}'
    - '[благодаря́ ве́тру]{.ru}'
  - base: '[друзья́]{.ru}'
    cells:
    - '[друзья́]{.ru}'
    - '[из-за друзе́й]{.ru}'
    - '[благодаря́ друзья́м]{.ru}'
  - base: '[сосе́ди]{.ru}'
    cells:
    - '[сосе́ди]{.ru}'
    - '[из-за сосе́дей]{.ru}'
    - '[благодаря́ сосе́дям]{.ru}'
  - base: '[пого́да]{.ru}'
    cells:
    - '[пого́да]{.ru}'
    - '[из-за пого́ды]{.ru}'
    - '[благодаря́ пого́де]{.ru}'
  - base: '[Ми́ша]{.ru}'
    cells:
    - '[Ми́ша]{.ru}'
    - '[из-за Ми́ши]{.ru}'
    - '[благодаря́ Ми́ше]{.ru}'
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[из-за роди́телей]{.ru}'
    - '[благодаря́ роди́телям]{.ru}'
  - base: '[сове́т]{.ru}'
    cells:
    - '[сове́т]{.ru}'
    - '[из-за сове́та]{.ru}'
    - '[благодаря́ сове́ту]{.ru}'
  - base: '[мы]{.ru}'
    cells:
    - '[мы]{.ru}'
    - '[из-за нас]{.ru}'
    - '[благодаря́ нам]{.ru}'
  - base: '[они́]{.ru}'
    cells:
    - '[они́]{.ru}'
    - '[из-за них]{.ru}'
    - '[благодаря́ им]{.ru}'
  why: '第 1、12 题：[из-за]{.ru} 要求第二格，[благодаря́]{.ru} 要求第三格：[из-за дождя́ — благодаря́ дождю́]{.ru}；[дождь]{.ru} 变格重音在词尾。

    第 2、9、10 题：[-а]{.ru} 结尾的名词（包括阳性的 [Ми́ша]{.ru}）：第二格 [-ы / -и]{.ru}，第三格 [-е]{.ru}：[из-за Ми́ши, благодаря́ Ми́ше]{.ru}。

    第 6 题：[ве́тер]{.ru} 变格时 [е]{.ru} 脱落：[ве́тра, ве́тру]{.ru}。

    第 7、8、11 题：复数：第二格 [друзе́й, сосе́дей, роди́телей]{.ru}，第三格 [друзья́м, сосе́дям, роди́телям]{.ru}。

    第 3、13 题：人称代词：[из-за тебя́, из-за нас — благодаря́ тебе́, благодаря́ нам]{.ru}。

    第 4、5、14 题：[из-за]{.ru} 是前置词，第三人称代词前加 [н-]{.ru}：[из-за него́, из-за неё, из-за них]{.ru}；[благодаря́]{.ru} 后不加：[благодаря́ ему́, ей, им]{.ru}。'
- id: B2-L67-02
  tags:
  - из-за / благодаря́ / от 的选择
  task: 冒号前是原因，后面是结果。表示原因时用哪个前置词？归栏。
  type: classify
  bins:
  - '[из-за]{.ru}'
  - '[благодаря́]{.ru}'
  - '[от]{.ru}'
  items:
  - text: '[дождь]{.ru}：比赛取消了'
    answer: '[из-за]{.ru}'
  - text: '[дождь]{.ru}：树林里蘑菇很多'
    answer: '[благодаря́]{.ru}'
  - text: '[хо́лод]{.ru}：浑身发抖'
    answer: '[от]{.ru}'
  - text: '[ра́дость]{.ru}：妈妈哭了'
    answer: '[от]{.ru}'
  - text: '[рабо́та]{.ru}：没能来参加晚会'
    answer: '[из-за]{.ru}'
  - text: '[по́мощь дру́га]{.ru}：按时完成了作业'
    answer: '[благодаря́]{.ru}'
  - text: '[смех]{.ru}：王磊被吵醒了'
    answer: '[от]{.ru}'
  - text: '[ве́тер]{.ru}：花环漂回了岸边'
    answer: '[из-за]{.ru}'
  - text: '[О́льга Ви́кторовна]{.ru}：我们考得很好'
    answer: '[благодаря́]{.ru}'
  - text: '[музы́ка]{.ru}：头疼'
    answer: '[от]{.ru}'
  - text: '[боле́знь]{.ru}：他没参加考试'
    answer: '[из-за]{.ru}'
  - text: '[хоро́шая пого́да]{.ru}：我们玩得很痛快'
    answer: '[благодаря́]{.ru}'
  - text: '[ты]{.ru}：我们迟到了'
    answer: '[из-за]{.ru}'
  - text: '[интерне́т]{.ru}：我们每天和父母通话'
    answer: '[благодаря́]{.ru}'
  - text: '[уста́лость]{.ru}：坐着就睡着了'
    answer: '[от]{.ru}'
    hint: 疲劳
  - text: '[страх]{.ru}：孩子说不出话来'
    answer: '[от]{.ru}'
    hint: 害怕
  why: '第 1、5、8、11、13 题：事情的坏结果（没去成、取消、迟到、没能来）：[из-за]{.ru} + 第二格；用在人身上带责怪：[из-за тебя́]{.ru}。

    第 2、6、9、12、14 题：事情的好结果（找到了、考好了、玩得好）：[благодаря́]{.ru} + 第三格，“多亏”。同样是下雨，坏结果用 [из-за дождя́]{.ru}，好结果用 [благодаря́ дождю́]{.ru}。

    第 3、4、7、10、15、16 题：不由自主的生理、心理状态（发抖、哭、醒、头疼、睡着、说不出话）：[от]{.ru} + 第二格。'
- id: B2-L67-03
  tags:
  - от + 第二格：不由自主的状态
  task: 写出 [от]{.ru} 后的名词形式。
  type: matrix
  cols:
  - 动词 + 名词
  - '[от]{.ru} + ……'
  given:
  - 0
  rows:
  - base: '[дрожа́ть от + хо́лод]{.ru}'
    cells:
    - '[дрожа́ть от + хо́лод]{.ru}'
    - '[хо́лода]{.ru}'
  - base: '[пла́кать от + ра́дость]{.ru}'
    cells:
    - '[пла́кать от + ра́дость]{.ru}'
    - '[ра́дости]{.ru}'
  - base: '[просну́ться от + смех]{.ru}'
    cells:
    - '[просну́ться от + смех]{.ru}'
    - '[сме́ха]{.ru}'
  - base: '[не мочь говори́ть от + страх]{.ru}'
    cells:
    - '[не мочь говори́ть от + страх]{.ru}'
    - '[стра́ха]{.ru}'
    hint: m
    new: true
    gloss: 害怕
  - base: '[боли́т голова́ от + шум]{.ru}'
    cells:
    - '[боли́т голова́ от + шум]{.ru}'
    - '[шу́ма]{.ru}'
    hint: m
    new: true
    gloss: 噪音
  - base: '[засну́ть от + уста́лость]{.ru}'
    cells:
    - '[засну́ть от + уста́лость]{.ru}'
    - '[уста́лости]{.ru}'
    hint: f
    new: true
    gloss: 疲劳
  - base: '[не спать от + жара́]{.ru}'
    cells:
    - '[не спать от + жара́]{.ru}'
    - '[жары́]{.ru}'
    hint: f
    new: true
    gloss: 炎热
  - base: '[крича́ть от + боль]{.ru}'
    cells:
    - '[крича́ть от + боль]{.ru}'
    - '[бо́ли]{.ru}'
    hint: f
    new: true
    gloss: 疼痛
  - base: '[не мочь сиде́ть от + волне́ние]{.ru}'
    cells:
    - '[не мочь сиде́ть от + волне́ние]{.ru}'
    - '[волне́ния]{.ru}'
    hint: n
    new: true
    gloss: 激动，紧张
  - base: '[смея́ться от + сча́стье]{.ru}'
    cells:
    - '[смея́ться от + сча́стье]{.ru}'
    - '[сча́стья]{.ru}'
  - base: '[дрожа́ть от + го́лод]{.ru}'
    cells:
    - '[дрожа́ть от + го́лод]{.ru}'
    - '[го́лода]{.ru}'
    hint: m
    new: true
    gloss: 饥饿
  - base: '[уста́ть от + му́зыка]{.ru}'
    cells:
    - '[уста́ть от + му́зыка]{.ru}'
    - '[му́зыки]{.ru}'
  why: 第 1–12 题：[от]{.ru} 要求第二格：阳性 [-а]{.ru}（[хо́лода, сме́ха, стра́ха, шу́ма, го́лода]{.ru}），阴性 [-ы / -и]{.ru}（[жары́, му́зыки]{.ru}；[-ь]{.ru} 结尾的 [ра́дости, уста́лости, бо́ли]{.ru}），中性 [-а / -я]{.ru}（[волне́ния, сча́стья]{.ru}）。[жара́]{.ru} 第二格重音在词尾：[жары́]{.ru}。
