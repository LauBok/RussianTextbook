  why: |-
    第 1、3、5、9 题：第一变位的词尾元音是 [е]{.ru}，第三人称复数 [-ют]{.ru}：[чита́ет, чита́ем, чита́ют]{.ru}。[понима́ть, разгова́ривать]{.ru} 和第二变位的 [лежа́ть, спать]{.ru} 一样以 [-ать]{.ru} 结尾，不定式看不出类别，要按提示。
    第 2、7、8、10 题：第二变位的词尾元音是 [и]{.ru}，第三人称复数 [-ят]{.ru}：[говори́т, говори́м, говоря́т]{.ru}，[стои́т, стоя́т]{.ru}，[ве́рит, ве́рят]{.ru}。
    第 4、11 题：第二变位，重音从 [ты]{.ru} 起在词干上，这三个人称都在词干：[смо́трит, смо́трят]{.ru}；[ва́рит, ва́рят]{.ru}。
    第 6 题：[ж]{.ru} 后第三人称复数写 [-ат]{.ru}：[лежа́т]{.ru}。
