  - base: '[они́ разгова́ривят]{.ru}'
    cells:
    - '[они́ разгова́ривят]{.ru}'
    - '[разгова́ривают]{.ru}'
  why: |-
    第 1、2、9、10 题：[ж, ч]{.ru} 后面写 [у]{.ru}、[а]{.ru}，不写 [ю]{.ru}、[я]{.ru}：[лежу́, лежа́т, учу́, молча́т]{.ru}。
    第 3 题：[спать]{.ru} 的第一人称要加 [л]{.ru}：[сплю]{.ru}。
    第 4、6、12 题：第二变位第三人称复数是 [-ят]{.ru}，不是第一变位的 [-ют]{.ru}：[смо́трят, стоя́т]{.ru}；第二人称是 [-ишь]{.ru}：[говори́шь]{.ru}，[и]{.ru} 后面不再加 [е]{.ru}。
    第 5、11、13 题：[смотре́ть]{.ru} 只有第一人称重音在词尾：[смотрю́]{.ru}；其余人称在词干：[смо́трит, смо́тришь]{.ru}。
    第 7、8、14 题：[понима́ть, разгова́ривать]{.ru} 是第一变位，用 [-ет]{.ru}、[-ют]{.ru}：[понима́ет, понима́ют, разгова́ривают]{.ru}。
- id: L07-04
  tags:
  - 两类变位混合：句中填空
  task: 用括号里动词的现在时填空。
  type: fill
  items:
  - stem: А́нна ___ ме́дленно.
    hint: говори́ть
    accept:
    - говори́т
  - stem: Па́па ___.
    hint: спать
    accept:
    - спит
  - stem: Мы ___ фильм.
    hint: смотре́ть
    accept:
    - смо́трим
  - stem: Я пло́хо ___.
    hint: понима́ть
    accept:
    - понима́ю
  - stem: Ключи́ ___ тут.
    hint: лежа́ть
    accept:
    - лежа́т
  - stem: Ты ___ по-францу́зски?
    hint: говори́ть
    accept:
    - говори́шь
  - stem: Ми́ша ___ телеви́зор.
    hint: смотре́ть
    accept:
    - смо́трит
  - stem: Роди́тели ___.
    hint: разгова́ривать
    accept:
    - разгова́ривают
  - stem: Ла́мпа ___ там.
    hint: стоя́ть
    accept:
    - стои́т
  - stem: Я не ___.
    hint: спать
    accept:
    - сплю
  - stem: Студе́нты ___ бы́стро.
    hint: чита́ть
    accept:
    - чита́ют
  - stem: Что ты ___?
    hint: смотре́ть
    accept:
    - смо́тришь
  - stem: Актёры ___ так бы́стро!
    hint: говори́ть
    accept:
    - говоря́т
  - stem: Я ___ телеви́зор.
    hint: смотре́ть
    accept:
    - смотрю́
  - stem: Я ___ по-ру́сски.
    hint: говори́ть
    accept:
    - говорю́
  - stem: Ты ___?
    hint: спать
    accept:
    - спишь
  - stem: Вы ___ фильм?
    hint: смотре́ть
    accept:
    - смо́трите
  - stem: Тетра́дь ___ тут.
    hint: лежа́ть
    accept:
    - лежи́т
  - stem: Мы ___ по-францу́зски.
    hint: говори́ть
    accept:
    - говори́м
  - stem: Вы ___?
    hint: понима́ть
    accept:
    - понима́ете
  - stem: Они́ сейча́с ___.
    hint: спать
    accept:
    - спят
  - stem: Ты ___ ме́дленно.
    hint: чита́ть
    accept:
    - чита́ешь
  - stem: Где ___ крова́ть?
    hint: стоя́ть
    accept:
    - стои́т
  - stem: Ма́ма и па́па ___ телеви́зор.
    hint: смотре́ть
    accept:
    - смо́трят
  - stem: Я ___ тут.
    hint: стоя́ть
    accept:
    - стою́
  - stem: Мы ___.
    hint: разгова́ривать
    accept:
    - разгова́риваем
  - stem: Вы ___ так бы́стро!
    hint: говори́ть
    accept:
    - говори́те
  - stem: Ты ___ тут?
    hint: лежа́ть
    accept:
    - лежи́шь
  why: |-
    第 4、8、11、20、22、26 题：[понима́ть, разгова́ривать, чита́ть]{.ru} 是第一变位：[понима́ю, разгова́ривают, чита́ют]{.ru}；[понима́ете, чита́ешь, разгова́риваем]{.ru}。
    第 1、2、6、9、13、15、16、19、21、23、25、27 题：第二变位：[говори́т, говори́шь, говоря́т, говорю́, говори́м, говори́те]{.ru}；[спит, спишь, спят]{.ru}；[стои́т, стою́]{.ru}。
    第 3、7、12、17、24 题：[смотре́ть]{.ru} 除第一人称外重音在词干：[смо́трим, смо́трит, смо́тришь, смо́трите, смо́трят]{.ru}。
    第 14 题：第一人称重音在词尾：[смотрю́]{.ru}。
    第 5、18、28 题：[ж]{.ru} 后第三人称复数写 [а]{.ru}：[ключи́ лежа́т]{.ru}；单数主语 [тетра́дь]{.ru} 用 [лежи́т]{.ru}，[ты]{.ru} 用 [лежи́шь]{.ru}。
    第 10 题：[спать]{.ru} 的第一人称是 [сплю]{.ru}。
