    - '[лежа́т]{.ru}'
  why: |-
    第 1、3、5–7 题：第二变位去掉 [-ить, -еть, -ять]{.ru}，加 [-ю, -ишь, -ит, -им, -ите, -ят]{.ru}：[говорю́, говори́шь, говоря́т]{.ru}；[стоя́ть]{.ru} 写成 [стою́, стои́шь, стоя́т]{.ru}。重音不移动的，各人称重音都和第一人称在同一个音节：[звоню́, звони́шь]{.ru}；[по́мню, по́мнишь]{.ru}。
    第 2、8 题：第一人称重音在词尾，从 [ты]{.ru} 起移到词干：[смотрю́, смо́тришь, смо́трят]{.ru}；[учу́, у́чишь, у́чат]{.ru}。提示里的两个形式就显示了这种移动。
    第 8–10 题：[ж, ш, ч, щ]{.ru} 后面不写 [ю]{.ru}、[я]{.ru}，第一人称写 [-у]{.ru}，第三人称复数写 [-ат]{.ru}：[лежу́, лежа́т]{.ru}；[молчу́, молча́т]{.ru}；[учу́, у́чат]{.ru}。
    第 4 题：[спать]{.ru} 只有第一人称在 [п]{.ru} 后多一个 [л]{.ru}：[сплю]{.ru}；其余是 [спишь, спит, спим, спи́те, спят]{.ru}。
