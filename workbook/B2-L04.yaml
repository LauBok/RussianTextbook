heading: 第 4 课　数词与名词连用
groups:
- id: B2-L04-01
  tags:
  - 数词与名词：1、2、5、21 与性的一致
  task: 写出数词和名词的词组。
  type: matrix
  cols:
  - 名词
  - '1'
  - '2'
  - '5'
  - '21'
  given:
  - 0
  rows:
  - base: '[студе́нт]{.ru}'
    cells:
    - '[студе́нт]{.ru}'
    - '[оди́н студе́нт]{.ru}'
    - '[два студе́нта]{.ru}'
    - '[пять студе́нтов]{.ru}'
    - '[два́дцать оди́н студе́нт]{.ru}'
  - base: '[ме́сяц]{.ru}'
    cells:
    - '[ме́сяц]{.ru}'
    - '[оди́н ме́сяц]{.ru}'
    - '[два ме́сяца]{.ru}'
    - '[пять ме́сяцев]{.ru}'
    - '[два́дцать оди́н ме́сяц]{.ru}'
  - base: '[год]{.ru}'
    cells:
    - '[год]{.ru}'
    - '[оди́н год]{.ru}'
    - '[два го́да]{.ru}'
    - '[пять лет]{.ru}'
    - '[два́дцать оди́н год]{.ru}'
  - base: '[слова́рь]{.ru}'
    cells:
    - '[слова́рь]{.ru}'
    - '[оди́н слова́рь]{.ru}'
    - '[два словаря́]{.ru}'
    - '[пять словаре́й]{.ru}'
    - '[два́дцать оди́н слова́рь]{.ru}'
  - base: '[де́вушка]{.ru}'
    cells:
    - '[де́вушка]{.ru}'
    - '[одна́ де́вушка]{.ru}'
    - '[две де́вушки]{.ru}'
    - '[пять де́вушек]{.ru}'
    - '[два́дцать одна́ де́вушка]{.ru}'
  - base: '[неде́ля]{.ru}'
    cells:
    - '[неде́ля]{.ru}'
    - '[одна́ неде́ля]{.ru}'
    - '[две неде́ли]{.ru}'
    - '[пять неде́ль]{.ru}'
    - '[два́дцать одна́ неде́ля]{.ru}'
  - base: '[па́ра]{.ru}'
    cells:
    - '[па́ра]{.ru}'
    - '[одна́ па́ра]{.ru}'
    - '[две па́ры]{.ru}'
    - '[пять пар]{.ru}'
    - '[два́дцать одна́ па́ра]{.ru}'
  - base: '[ру́чка]{.ru}'
    cells:
    - '[ру́чка]{.ru}'
    - '[одна́ ру́чка]{.ru}'
    - '[две ру́чки]{.ru}'
    - '[пять ру́чек]{.ru}'
    - '[два́дцать одна́ ру́чка]{.ru}'
  - base: '[сочине́ние]{.ru}'
    cells:
    - '[сочине́ние]{.ru}'
    - '[одно́ сочине́ние]{.ru}'
    - '[два сочине́ния]{.ru}'
    - '[пять сочине́ний]{.ru}'
    - '[два́дцать одно́ сочине́ние]{.ru}'
  - base: '[письмо́]{.ru}'
    cells:
    - '[письмо́]{.ru}'
    - '[одно́ письмо́]{.ru}'
    - '[два письма́]{.ru}'
    - '[пять пи́сем]{.ru}'
    - '[два́дцать одно́ письмо́]{.ru}'
  - base: '[зда́ние]{.ru}'
    cells:
    - '[зда́ние]{.ru}'
    - '[одно́ зда́ние]{.ru}'
    - '[два зда́ния]{.ru}'
    - '[пять зда́ний]{.ru}'
    - '[два́дцать одно́ зда́ние]{.ru}'
  - base: '[ме́сто]{.ru}'
    cells:
    - '[ме́сто]{.ru}'
    - '[одно́ ме́сто]{.ru}'
    - '[два ме́ста]{.ru}'
    - '[пять мест]{.ru}'
    - '[два́дцать одно́ ме́сто]{.ru}'
  why: |-
    第 1、2、4 题：阳性：[оди́н, два]{.ru}；2 后单数第二格，5 后复数第二格：[два словаря́ — пять словаре́й]{.ru}；21 只看最后的 [оди́н]{.ru}，用单数第一格。
    第 3 题：[год]{.ru}：[два го́да]{.ru}，5 以上用 [лет]{.ru}：[пять лет]{.ru}；[два́дцать оди́н год]{.ru}，不是 [лет]{.ru}。
    第 5–8 题：阴性用 [одна́, две]{.ru}：[две де́вушки, две неде́ли]{.ru}；复数第二格零词尾：[де́вушек, неде́ль, пар, ру́чек]{.ru}。
    第 9–12 题：中性用 [одно́]{.ru}，“二”和阳性一样是 [два]{.ru}：[два письма́, два ме́ста]{.ru}；复数第二格 [пи́сем, сочине́ний, мест]{.ru}。
- id: B2-L04-02
  tags:
  - 合成数词：看最后一个词
  task: 用文字写出数词，和名词一起组成词组。
  type: matrix
  cols:
  - 数值 + 名词
  - 词组
  given:
  - 0
  rows:
  - base: '[12 + студе́нт]{.ru}'
    cells:
    - '[12 + студе́нт]{.ru}'
    - '[двена́дцать студе́нтов]{.ru}'
  - base: '[22 + неде́ля]{.ru}'
    cells:
    - '[22 + неде́ля]{.ru}'
    - '[два́дцать две неде́ли]{.ru}'
  - base: '[31 + день]{.ru}'
    cells:
    - '[31 + день]{.ru}'
    - '[три́дцать оди́н день]{.ru}'
  - base: '[14 + де́вушка]{.ru}'
    cells:
    - '[14 + де́вушка]{.ru}'
    - '[четы́рнадцать де́вушек]{.ru}'
  - base: '[43 + сочине́ние]{.ru}'
    cells:
    - '[43 + сочине́ние]{.ru}'
    - '[со́рок три сочине́ния]{.ru}'
  - base: '[101 + рубль]{.ru}'
    cells:
    - '[101 + рубль]{.ru}'
    - '[сто оди́н рубль]{.ru}'
  - base: '[25 + мину́та]{.ru}'
    cells:
    - '[25 + мину́та]{.ru}'
    - '[два́дцать пять мину́т]{.ru}'
  - base: '[52 + письмо́]{.ru}'
    cells:
    - '[52 + письмо́]{.ru}'
    - '[пятьдеся́т два письма́]{.ru}'
  - base: '[11 + ме́сяц]{.ru}'
    cells:
    - '[11 + ме́сяц]{.ru}'
    - '[оди́ннадцать ме́сяцев]{.ru}'
  - base: '[21 + па́ра]{.ru}'
    cells:
    - '[21 + па́ра]{.ru}'
    - '[два́дцать одна́ па́ра]{.ru}'
  - base: '[34 + год]{.ru}'
    cells:
    - '[34 + год]{.ru}'
    - '[три́дцать четы́ре го́да]{.ru}'
  - base: '[100 + ме́сто]{.ru}'
    cells:
    - '[100 + ме́сто]{.ru}'
    - '[сто мест]{.ru}'
  - base: '[61 + зда́ние]{.ru}'
    cells:
    - '[61 + зда́ние]{.ru}'
    - '[шестьдеся́т одно́ зда́ние]{.ru}'
  - base: '[40 + год]{.ru}'
    cells:
    - '[40 + год]{.ru}'
    - '[со́рок лет]{.ru}'
  - base: '[32 + студе́нтка]{.ru}'
    cells:
    - '[32 + студе́нтка]{.ru}'
    - '[три́дцать две студе́нтки]{.ru}'
  - base: '[19 + слова́рь]{.ru}'
    cells:
    - '[19 + слова́рь]{.ru}'
    - '[девятна́дцать словаре́й]{.ru}'
  why: |-
    第 1、4、9、16 题：11–19 是一个词，后面一律用复数第二格：[двена́дцать студе́нтов, четы́рнадцать де́вушек, оди́ннадцать ме́сяцев, девятна́дцать словаре́й]{.ru}。
    第 2、5、8、11、15 题：最后一个词是 2–4，用单数第二格，阴性用 [две]{.ru}：[два́дцать две неде́ли, три́дцать две студе́нтки]{.ru}；[со́рок три сочине́ния, пятьдеся́т два письма́, три́дцать четы́ре го́да]{.ru}。
    第 3、6、10、13 题：最后一个词是“一”，用单数第一格，[оди́н / одна́ / одно́]{.ru} 随名词的性：[три́дцать оди́н день, сто оди́н рубль, два́дцать одна́ па́ра, шестьдеся́т одно́ зда́ние]{.ru}。
    第 7、12、14 题：5 以上和整十、整百用复数第二格：[два́дцать пять мину́т, сто мест, со́рок лет]{.ru}。
- id: B2-L04-03
  tags:
  - 数词后名词的形式：判断
  task: 数词后面的名词用什么形式？把数值归类，不写形式。
  type: classify
  bins:
  - 单数第一格
  - 单数第二格
  - 复数第二格
  items:
  - text: '[1]{.ru}'
    answer: 单数第一格
  - text: '[2]{.ru}'
    answer: 单数第二格
  - text: '[5]{.ru}'
    answer: 复数第二格
  - text: '[11]{.ru}'
    answer: 复数第二格
  - text: '[12]{.ru}'
    answer: 复数第二格
  - text: '[14]{.ru}'
    answer: 复数第二格
  - text: '[20]{.ru}'
    answer: 复数第二格
  - text: '[21]{.ru}'
    answer: 单数第一格
  - text: '[22]{.ru}'
    answer: 单数第二格
  - text: '[23]{.ru}'
    answer: 单数第二格
  - text: '[25]{.ru}'
    answer: 复数第二格
  - text: '[31]{.ru}'
    answer: 单数第一格
  - text: '[33]{.ru}'
    answer: 单数第二格
  - text: '[40]{.ru}'
    answer: 复数第二格
  - text: '[41]{.ru}'
    answer: 单数第一格
  - text: '[44]{.ru}'
    answer: 单数第二格
  - text: '[50]{.ru}'
    answer: 复数第二格
  - text: '[56]{.ru}'
    answer: 复数第二格
  - text: '[62]{.ru}'
    answer: 单数第二格
  - text: '[71]{.ru}'
    answer: 单数第一格
  - text: '[84]{.ru}'
    answer: 单数第二格
  - text: '[99]{.ru}'
    answer: 复数第二格
  - text: '[100]{.ru}'
    answer: 复数第二格
  - text: '[101]{.ru}'
    answer: 单数第一格
  - text: '[102]{.ru}'
    answer: 单数第二格
  - text: '[111]{.ru}'
    answer: 复数第二格
  - text: '[112]{.ru}'
    answer: 复数第二格
  - text: '[114]{.ru}'
    answer: 复数第二格
  - text: '[121]{.ru}'
    answer: 单数第一格
  - text: '[1000]{.ru}'
    answer: 复数第二格
  why: |-
    第 1、8、12、15、20、24、29 题：最后一个词是 [оди́н / одна́ / одно́]{.ru}：1、21、31、41、71、101、121。
    第 2、9、10、13、16、19、21、25 题：最后一个词是 2、3、4：2、22、23、33、44、62、84、102。
    第 3、7、11、14、17、18、22、23、30 题：最后一个词是 5–9、整十、整百，或者是 [ты́сяча]{.ru}：5、20、25、40、50、56、99、100、1000。
    第 4–6、26–28 题：11–19 是一个词，不看个位：11、12、14、111、112、114 都用复数第二格。
- id: B2-L04-04
  tags:
  - 数词与名词：句中
  task: 用文字写出数词，和括号里的名词一起填空。
  type: fill
  items:
  - stem: Ле́кция идёт ___.
    hint: 45, мину́та
    accept:
    - со́рок пять мину́т
  - stem: В э́том году́ у нас бы́ло ___.
    hint: 22, экза́мен
    accept:
    - два́дцать два экза́мена
  - stem: В на́шем до́ме ___.
    hint: 21, кварти́ра
    accept:
    - два́дцать одна́ кварти́ра
  - stem: В уче́бнике ___.
    hint: 72, упражне́ние
    accept:
    - се́мьдесят два упражне́ния
  - stem: Ба́бушке ___.
    hint: 81, год
    accept:
    - во́семьдесят оди́н год
  - stem: Мы бы́ли в Петербу́рге ___.
    hint: 13, день
    accept:
    - трина́дцать дней
  - stem: В на́шей гру́ппе ___.
    hint: 3, студе́нтка
    accept:
    - три студе́нтки
  - stem: В тетра́ди Ми́ши ___.
    hint: 24, оши́бка
    accept:
    - два́дцать четы́ре оши́бки
  - stem: Он написа́л ___.
    hint: 31, сочине́ние
    accept:
    - три́дцать одно́ сочине́ние
  - stem: Э́та кни́га сто́ит ___.
    hint: 300, рубль
    accept:
    - три́ста рубле́й
  - stem: В пе́рвом семе́стре нас бы́ло ___.
    hint: '16'
    accept:
    - шестна́дцать
  - stem: В шко́ле ___.
    hint: 52, учи́тель
    accept:
    - пятьдеся́т два учи́теля
  why: |-
    第 1、10 题：5 以上和整百用复数第二格：[со́рок пять мину́т, три́ста рубле́й]{.ru}。
    第 2、4、7、8、12 题：最后一个词是 2–4 用单数第二格，阴性用 [две]{.ru}：[два́дцать два экза́мена, се́мьдесят два упражне́ния, три студе́нтки, два́дцать четы́ре оши́бки, пятьдеся́т два учи́теля]{.ru}。
    第 3、5、9 题：最后一个词是“一”用单数第一格，性要一致：[два́дцать одна́ кварти́ра, три́дцать одно́ сочине́ние]{.ru}；年龄 [во́семьдесят оди́н год]{.ru}。
    第 6 题：11–19 后用复数第二格；[день]{.ru} 的 [е]{.ru} 脱落：[трина́дцать дней]{.ru}。
    第 11 题：说一群人一共多少：[нас бы́ло шестна́дцать]{.ru}，代词用第二格，数词作主语，动词用中性 [бы́ло]{.ru}。
