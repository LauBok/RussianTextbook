  why: |-
    第 1、3、7、9、11、15、17 题：[-ия, -ие]{.ru} 一律换成 [-ии]{.ru}：[в аудито́рии, в зда́нии, в общежи́тии, на экску́рсии, в Япо́нии, в лаборато́рии, в сочине́нии]{.ru}。
    第 2 题：[галере́я]{.ru} 结尾是 [-ея]{.ru}，不是 [-ия]{.ru}，按普通 [-я]{.ru} 换成 [-е]{.ru}：[в галере́е]{.ru}。这是本题最容易混的一个。
    第 4、6、10、12–14、16 题：一般名词用 [-е]{.ru}：[на ку́хне, в музе́е, в Кита́е, на у́лице, на факульте́те, на ка́федре, в трамва́е]{.ru}。[-й]{.ru} 结尾的 [Кита́й, трамва́й]{.ru} 不属于 [-ия]{.ru}。
    第 5、18 题：阴性 [-ь]{.ru} 用 [-и]{.ru}：[в тетра́ди, на пло́щади]{.ru}。
    第 8 题：[мо́ре]{.ru} 结尾是 [-е]{.ru}，不是 [-ие]{.ru}，第六格不变：[на мо́ре]{.ru}。
- id: L12-04
  tags:
  - 处所表达：в / на 的常用搭配
  task: 按表示处所时习惯用的前置词，把名词归入 [в]{.ru} 栏或 [на]{.ru} 栏。
  type: classify
  bins:
  - '[в]{.ru}'
  - '[на]{.ru}'
  items:
  - text: '[уро́к]{.ru}'
    answer: '[на]{.ru}'
  - text: '[университе́т]{.ru}'
    answer: '[в]{.ru}'
  - text: '[ле́кция]{.ru}'
    answer: '[на]{.ru}'
  - text: '[библиоте́ка]{.ru}'
    answer: '[в]{.ru}'
  - text: '[рабо́та]{.ru}'
    answer: '[на]{.ru}'
  - text: '[аудито́рия]{.ru}'
    answer: '[в]{.ru}'
  - text: '[у́лица]{.ru}'
    answer: '[на]{.ru}'
  - text: '[общежи́тие]{.ru}'
    answer: '[в]{.ru}'
  - text: '[факульте́т]{.ru}'
    answer: '[на]{.ru}'
  - text: '[лаборато́рия]{.ru}'
    answer: '[в]{.ru}'
  - text: '[конце́рт]{.ru}'
    answer: '[на]{.ru}'
  - text: '[музе́й]{.ru}'
    answer: '[в]{.ru}'
  - text: '[ка́федра]{.ru}'
    answer: '[на]{.ru}'
  - text: '[зда́ние]{.ru}'
    answer: '[в]{.ru}'
  - text: '[пло́щадь]{.ru}'
    answer: '[на]{.ru}'
  - text: '[шко́ла]{.ru}'
    answer: '[в]{.ru}'
  - text: '[экску́рсия]{.ru}'
    answer: '[на]{.ru}'
  - text: '[ку́хня]{.ru}'
    answer: '[на]{.ru}'
  - text: '[заво́д]{.ru}'
    answer: '[на]{.ru}'
  - text: '[ко́мната]{.ru}'
    answer: '[в]{.ru}'
  why: |-
    第 1、3、11、17 题：活动、事件用 [на]{.ru}：[на уро́ке, на ле́кции, на конце́рте, на экску́рсии]{.ru}。
    第 5、9、13、19 题：工作单位和部门用 [на]{.ru}：[на рабо́те, на факульте́те, на ка́федре, на заво́де]{.ru}。
    第 7、15 题：开阔的地方用 [на]{.ru}：[на у́лице, на пло́щади]{.ru}。
    第 18 题：[ку́хня]{.ru} 有墙有顶，却习惯说 [на ку́хне]{.ru}，要单独记。
    第 2、4、6、8、10、12、14、16、20 题：有墙有顶、可以走进去的地方用 [в]{.ru}：[в университе́те, в библиоте́ке, в аудито́рии, в общежи́тии, в лаборато́рии, в музе́е, в зда́нии, в шко́ле, в ко́мнате]{.ru}。
- id: L12-05
  tags:
  - 处所表达：选前置词并变格
  task: 选用 [в]{.ru} 或 [на]{.ru}，连同括号里名词的第六格一起填写。
  type: fill
  items:
  - stem: Сейча́с мы ___.
    hint: уро́к
    accept:
    - на уро́ке
  - stem: Пьер ___.
    hint: общежи́тие
    accept:
    - в общежи́тии
  - stem: А́нна ___.
    hint: ле́кция
    accept:
    - на ле́кции
  - stem: Ю́ми ___.
    hint: лаборато́рия
    accept:
    - в лаборато́рии
  - stem: Ива́н Серге́евич ___.
    hint: заво́д
    accept:
    - на заво́де
  - stem: Студе́нты ___.
    hint: экску́рсия
    accept:
    - на экску́рсии
  - stem: Ми́ша ___.
    hint: у́лица
    accept:
    - на у́лице
  - stem: Преподава́тель ___.
    hint: ка́федра
    accept:
    - на ка́федре
  - stem: Мы ___.
    hint: аудито́рия
    accept:
    - в аудито́рии
  - stem: Ван Лэй ___.
    hint: Росси́я
    accept:
    - в Росси́и
  - stem: Ма́ма ___.
    hint: ку́хня
    accept:
    - на ку́хне
  - stem: Сего́дня мы ___.
    hint: конце́рт
    accept:
    - на конце́рте
  - stem: А́нна ___.
    hint: факульте́т
    accept:
    - на факульте́те
  - stem: Студе́нты ___.
    hint: пло́щадь
    accept:
    - на пло́щади
  - stem: Ю́ми и Пьер ___.
    hint: музе́й
    accept:
    - в музе́е
  - stem: Кафе́ ___.
    hint: зда́ние
    accept:
    - в зда́нии
  why: |-
    第 1、12 题：活动用 [на]{.ru}：[на уро́ке, на конце́рте]{.ru}。
    第 3、6 题：活动用 [на]{.ru}，[-ия]{.ru} 名词变 [-ии]{.ru}：[на ле́кции, на экску́рсии]{.ru}。
    第 5、8、13 题：工作单位、部门用 [на]{.ru}：[на заво́де, на ка́федре, на факульте́те]{.ru}。
    第 7、14 题：开阔的地方用 [на]{.ru}：[на у́лице, на пло́щади]{.ru}。
    第 11 题：[на ку́хне]{.ru} 是固定说法。
    第 2、4、9、10、16 题：可以走进去的地方、国家用 [в]{.ru}，[-ия / -ие]{.ru} 名词变 [-ии]{.ru}：[в общежи́тии, в лаборато́рии, в аудито́рии, в Росси́и, в зда́нии]{.ru}。
    第 15 题：[в музе́е]{.ru}：博物馆是建筑物，用 [в]{.ru}。
