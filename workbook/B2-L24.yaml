heading: 第 24 课　形容词最高级
groups:
- id: B2-L24-01
  tags:
  - 最高级：самый + 形容词的变格
  task: 写出词组的第二、五、六格。
  type: matrix
  cols:
  - 第一格
  - 第二格
  - 第五格
  - 第六格
  given:
  - 0
  rows:
  - base: '[са́мый большо́й дом]{.ru}'
    cells:
    - '[са́мый большо́й дом]{.ru}'
    - '[са́мого большо́го до́ма]{.ru}'
    - '[са́мым больши́м до́мом]{.ru}'
    - '[о са́мом большо́м до́ме]{.ru}'
  - base: '[са́мая глубо́кая река́]{.ru}'
    cells:
    - '[са́мая глубо́кая река́]{.ru}'
    - '[са́мой глубо́кой реки́]{.ru}'
    - '[са́мой глубо́кой реко́й]{.ru}'
    - '[о са́мой глубо́кой реке́]{.ru}'
  - base: '[са́мое краси́вое о́зеро]{.ru}'
    cells:
    - '[са́мое краси́вое о́зеро]{.ru}'
    - '[са́мого краси́вого о́зера]{.ru}'
    - '[са́мым краси́вым о́зером]{.ru}'
    - '[о са́мом краси́вом о́зере]{.ru}'
  - base: '[са́мые бли́зкие лю́ди]{.ru}'
    cells:
    - '[са́мые бли́зкие лю́ди]{.ru}'
    - '[са́мых бли́зких люде́й]{.ru}'
    - '[са́мыми бли́зкими людьми́]{.ru}'
    - '[о са́мых бли́зких лю́дях]{.ru}'
  - base: '[са́мый тру́дный экза́мен]{.ru}'
    cells:
    - '[са́мый тру́дный экза́мен]{.ru}'
    - '[са́мого тру́дного экза́мена]{.ru}'
    - '[са́мым тру́дным экза́меном]{.ru}'
    - '[о са́мом тру́дном экза́мене]{.ru}'
  - base: '[са́мая интере́сная кни́га]{.ru}'
    cells:
    - '[са́мая интере́сная кни́га]{.ru}'
    - '[са́мой интере́сной кни́ги]{.ru}'
    - '[са́мой интере́сной кни́гой]{.ru}'
    - '[о са́мой интере́сной кни́ге]{.ru}'
  - base: '[са́мое ста́рое зда́ние]{.ru}'
    cells:
    - '[са́мое ста́рое зда́ние]{.ru}'
    - '[са́мого ста́рого зда́ния]{.ru}'
    - '[са́мым ста́рым зда́нием]{.ru}'
    - '[о са́мом ста́ром зда́нии]{.ru}'
  - base: '[са́мые но́вые магази́ны]{.ru}'
    cells:
    - '[са́мые но́вые магази́ны]{.ru}'
    - '[са́мых но́вых магази́нов]{.ru}'
    - '[са́мыми но́выми магази́нами]{.ru}'
    - '[о са́мых но́вых магази́нах]{.ru}'
  why: |-
    第 1、5 题：阳性：[са́мого … -ого, са́мым … -ым, о са́мом … -ом]{.ru}；[большо́й]{.ru} 重音在词尾：[большо́го, больши́м, большо́м]{.ru}。
    第 2、6 题：阴性：第二、五、六格 [са́мой … -ой]{.ru}，名词按各自的格：[реки́, реко́й, о реке́]{.ru}。
    第 3、7 题：中性和阳性相同；[зда́ние]{.ru} 第六格 [о зда́нии]{.ru}。
    第 4、8 题：复数：[са́мых … -ых, са́мыми … -ыми, о са́мых … -ых]{.ru}；[бли́зкий]{.ru} 按拼写规则写 [-их, -ими]{.ru}；[лю́ди]{.ru} 的间接格 [люде́й, людьми́, о лю́дях]{.ru}。
    第 1–8 题：[са́мый]{.ru}、形容词、名词三者性、数、格一致，[са́мый]{.ru} 重音始终在词干。
- id: B2-L24-02
  tags:
  - 最高级：单一式 -ейший, -айший
  task: 写出形容词的单一式最高级（阳性第一格）。
  type: matrix
  cols:
  - 原级
  - 最高级
  given:
  - 0
  rows:
  - base: '[краси́вый]{.ru}'
    cells:
    - '[краси́вый]{.ru}'
    - '[краси́вейший]{.ru}'
  - base: '[интере́сный]{.ru}'
    cells:
    - '[интере́сный]{.ru}'
    - '[интере́снейший]{.ru}'
  - base: '[но́вый]{.ru}'
    cells:
    - '[но́вый]{.ru}'
    - '[нове́йший]{.ru}'
  - base: '[ва́жный]{.ru}'
    cells:
    - '[ва́жный]{.ru}'
    - '[важне́йший]{.ru}'
  - base: '[у́мный]{.ru}'
    cells:
    - '[у́мный]{.ru}'
    - '[умне́йший]{.ru}'
  - base: '[си́льный]{.ru}'
    cells:
    - '[си́льный]{.ru}'
    - '[сильне́йший]{.ru}'
  - base: '[тру́дный]{.ru}'
    cells:
    - '[тру́дный]{.ru}'
    - '[трудне́йший]{.ru}'
  - base: '[бога́тый]{.ru}'
    cells:
    - '[бога́тый]{.ru}'
    - '[богате́йший]{.ru}'
  - base: '[высо́кий]{.ru}'
    cells:
    - '[высо́кий]{.ru}'
    - '[высоча́йший]{.ru}'
  - base: '[глубо́кий]{.ru}'
    cells:
    - '[глубо́кий]{.ru}'
    - '[глубоча́йший]{.ru}'
  - base: '[стро́гий]{.ru}'
    cells:
    - '[стро́гий]{.ru}'
    - '[строжа́йший]{.ru}'
  - base: '[ти́хий]{.ru}'
    cells:
    - '[ти́хий]{.ru}'
    - '[тиша́йший]{.ru}'
  why: |-
    第 1–8 题：词干 + [-ейш-]{.ru}：[краси́вейший, интере́снейший]{.ru} 保留原级重音；[нове́йший, важне́йший, умне́йший, сильне́йший, трудне́йший, богате́йший]{.ru} 重音在 [-е́йш-]{.ru}，和比较级 [нове́е, важне́е]{.ru} 一样。
    第 9–12 题：词干末 [г, к, х]{.ru} 交替为 [ж, ч, ш]{.ru}，后缀用 [-а́йш-]{.ru}，重音在 [-а́йш-]{.ru} 上：[высоча́йший, глубоча́йший, строжа́йший, тиша́йший]{.ru}。不要写成 [высоке́йший]{.ru}。
- id: B2-L24-03
  tags:
  - 最高级：самый 词组在句中
  task: 用括号里词组的正确形式填空。
  type: fill
  items:
  - stem: Байка́л — ___ о́зеро в ми́ре.
    hint: са́мый глубо́кий
    accept:
    - са́мое глубо́кое
  - stem: Мы живём в ___ до́ме на у́лице.
    hint: са́мый большо́й
    accept:
    - са́мом большо́м
  - stem: Апре́ль — ___ ме́сяц для води́телей.
    hint: са́мый тру́дный
    accept:
    - са́мый тру́дный
  - stem: Пьер — ___ студе́нт в на́шей гру́ппе.
    hint: са́мый ве́жливый
    accept:
    - са́мый ве́жливый
  - stem: Она́ рабо́тает в ___ шко́ле в го́роде.
    hint: са́мый ста́рый
    accept:
    - са́мой ста́рой
  - stem: Эльбру́с — ___ гора́ в Евро́пе.
    hint: са́мый высо́кий
    accept:
    - са́мая высо́кая
  - stem: Я позвони́л ___ дру́гу.
    hint: са́мый бли́зкий
    accept:
    - са́мому бли́зкому
  - stem: Мы говори́ли о ___ пробле́мах.
    hint: са́мый ва́жный
    accept:
    - са́мых ва́жных
  - stem: Он подари́л ей ___ цветы́.
    hint: са́мый краси́вый
    accept:
    - са́мые краси́вые
  - stem: Ле́то — ___ вре́мя го́да.
    hint: са́мый лу́чший
    accept:
    - са́мое лу́чшее
  - stem: Ми́ша занима́ется ___ ви́дом спо́рта — футбо́лом.
    hint: са́мый популя́рный
    accept:
    - са́мым популя́рным
  - stem: Ю́ми пришла́ к нам в ___ день весны́.
    hint: са́мый холо́дный
    accept:
    - са́мый холо́дный
  - stem: Я живу́ в ___ ко́мнате в общежи́тии.
    hint: са́мый ма́ленький
    accept:
    - са́мой ма́ленькой
  - stem: Э́то ___ кни́га в на́шей библиоте́ке.
    hint: са́мый ста́рый
    accept:
    - са́мая ста́рая
  - stem: Мы гото́вимся к ___ экза́мену.
    hint: са́мый тру́дный
    accept:
    - са́мому тру́дному
  why: |-
    第 1、3、4、6、9、10 题：作表语或主语，第一格，与名词一致：[са́мое глубо́кое о́зеро, са́мая высо́кая гора́, са́мые краси́вые цветы́, са́мое лу́чшее вре́мя]{.ru}。
    第 2、5 题：[в]{.ru} + 第六格：[в са́мом большо́м до́ме, в са́мой ста́рой шко́ле]{.ru}。“在哪个范围里最……”常用 [в]{.ru} + 第六格：[в ми́ре, в на́шей гру́ппе, в го́роде]{.ru}。
    第 7 题：[позвони́ть]{.ru} + 第三格：[са́мому бли́зкому дру́гу]{.ru}。
    第 8 题：[о]{.ru} + 复数第六格：[о са́мых ва́жных пробле́мах]{.ru}。
    第 11 题：[занима́ться]{.ru} + 第五格：[са́мым популя́рным ви́дом]{.ru}。
    第 12 题：[в]{.ru} + 第四格表示时间，[день]{.ru} 是非动物名词，第四格同第一格：[в са́мый холо́дный день]{.ru}。
    第 13 题：[в]{.ru} + 第六格，阴性：[в са́мой ма́ленькой ко́мнате]{.ru}。
    第 14 题：第一格，阴性：[са́мая ста́рая кни́га]{.ru}。
    第 15 题：[к]{.ru} + 第三格：[к са́мому тру́дному экза́мену]{.ru}。
