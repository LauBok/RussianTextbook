  why: '第 1–12 题：[-а]{.ru} 改 [-у]{.ru}，重音位置不变：[газе́та → газе́ту]{.ru}，[колбаса́ → колбасу́]{.ru}。[г, к, ч]{.ru} 后面照样写 [у]{.ru}：[кни́гу, ру́чку]{.ru}。

    第 13–17 题：[-я]{.ru} 改 [-ю]{.ru}：[статья́ → статью́]{.ru}。[-ия]{.ru} 结尾的词只换最后一个字母：[исто́рию, ле́кцию, фотогра́фию]{.ru}，不要写成第六格的 [-ии]{.ru}。'
- id: L21-02
  tags:
  - 名词单数第四格：同第一格与改词尾辨别
  task: 判断非动物名词的第四格是否和第一格相同。
  type: classify
  bins:
  - 同第一格
  - 改词尾
  items:
  - text: '[журна́л]{.ru}'
