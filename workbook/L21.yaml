    answer: 改词尾
  - text: '[ру́чка]{.ru}'
    answer: 改词尾
  - text: '[су́мка]{.ru}'
    answer: 改词尾
  why: '第 1–5、10–13 题：阳性（包括 [-ь]{.ru} 结尾的 [слова́рь]{.ru}、不变格的 [ко́фе]{.ru}）和中性非动物名词第四格同第一格：[пить чай, чита́ть письмо́]{.ru}。

    第 6、7、14 题：[-ь]{.ru} 结尾的阴性名词第四格也不变：[знать но́вость]{.ru}。最容易错的是类推成 *[но́востю]{.ru}。

    第 8、9 题：复数非动物名词第四格同第一格：[есть сы́рники, чита́ть кни́ги]{.ru}。

    第 15–20 题：只有 [-а]{.ru}、[-я]{.ru} 结尾的阴性名词改词尾：[ка́шу, статью́, исто́рию]{.ru}。'
