  why: '第 1、2、5、7、11、12、13、17、19、20 题：宾语是 [-а]{.ru}、[-я]{.ru} 结尾的阴性名词，改成 [-у]{.ru}、[-ю]{.ru}：[чита́ть газе́ту, писа́ть статью́, слу́шать ле́кцию]{.ru}。

    第 3、4、6、8、14、15、16 题：阳性非动物名词作宾语不变：[пить чай, есть хлеб, гото́вить обе́д]{.ru}。[ко́фе]{.ru} 不变格，永远不变。

    第 9 题：[но́вость]{.ru} 是 [-ь]{.ru} 结尾的阴性名词，第四格不变。

    第 10、18 题：中性名词第四格不变：[де́лать упражне́ние, писа́ть письмо́]{.ru}。'
- id: L21-04
  tags:
  - 不规则动词现在时：есть、пить
  task: 按主语写出 [есть]{.ru} 和 [пить]{.ru} 的现在时。
  type: matrix
