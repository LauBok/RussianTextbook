  - base: '[па́па и Ми́ша]{.ru}'
    cells:
    - '[па́па и Ми́ша]{.ru}'
    - '[едя́т]{.ru}'
    - '[пьют]{.ru}'
  - base: '[студе́нты]{.ru}'
    cells:
    - '[студе́нты]{.ru}'
    - '[едя́т]{.ru}'
    - '[пьют]{.ru}'
  - base: '[Ван Лэй]{.ru}'
    cells:
    - '[Ван Лэй]{.ru}'
    - '[ест]{.ru}'
    - '[пьёт]{.ru}'
