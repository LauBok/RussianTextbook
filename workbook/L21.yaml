  - stem: Мы слу́шаем ___.
    hint: му́зыка
    accept:
    - му́зыку
  - stem: Э́то но́вая ___.
    hint: ру́чка
    accept:
    - ру́чка
  - stem: Ты ви́дишь ___?
    hint: ру́чка
    accept:
    - ру́чку
  - stem: Где моя́ ___?
    hint: тетра́дь
    accept:
    - тетра́дь
  - stem: Я ви́жу ___.
    hint: тетра́дь
    accept:
    - тетра́дь
  - stem: Вот моя́ ___.
    hint: ла́мпа
    accept:
    - ла́мпа
  - stem: Мы смо́трим ___.
    hint: о́пера
