  why: '第 1–4、8、11 题：[есть]{.ru} 单数是 [ем, ешь, ест]{.ru}，没有元音词尾，[ешь]{.ru} 后面要写 [ь]{.ru}。[пить]{.ru} 的词干是 [пь-]{.ru}，词尾重读：[пью, пьёшь, пьёт]{.ru}。

    第 5–7、9、10、12 题：[есть]{.ru} 复数换成词干 [ед-]{.ru}，词尾像第二变位：[еди́м, еди́те, едя́т]{.ru}；不要写成 *[ести́м]{.ru}。[пить]{.ru} 复数是 [пьём, пьёте, пьют]{.ru}。

    第 12 题：[А́нна и я]{.ru} 等于 [мы]{.ru}。'
- id: L21-05
  tags:
  - 名词第一格与第四格对照
  task: 名词作主语或表语用第一格，作宾语用第四格；按句子填写。
  type: fill
  items:
  - stem: Вот ___.
