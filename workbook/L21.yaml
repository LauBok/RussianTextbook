  why: '第 1、3、5、7、9、11、13、15 题：名词在 [вот]{.ru}、[где]{.ru}、[э́то]{.ru} 句里或作主语，用第一格。

    第 2、4、6、8、10、14、16 题：名词是 [чита́ть, есть, писа́ть, слу́шать, ви́деть, смотре́ть, расска́зывать]{.ru} 的宾语，阴性 [-а / -я]{.ru} 变 [-у / -ю]{.ru}。第 12 题：[тетра́дь]{.ru} 作宾语也不变。'
