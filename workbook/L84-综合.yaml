heading: 综合练习　复合句
lessons:
- L79
- L82
- L83
- L84
groups:
- id: L84-综合-a
  tags:
  - 综合：复合句的从句关系
  task: 按连接词和句意，标出每个复合句里从句（或后一部分）表示的关系。
  type: classify
  bins:
  - 时间
  - 条件
  - 原因
  - 结果
  - 定语
  items:
  - text: Когда́ я за́втракаю, я слу́шаю ра́дио.
    answer: 时间
  - text: Е́сли бу́дет дождь, мы бу́дем до́ма.
    answer: 条件
  - text: Я до́ма, потому́ что идёт дождь.
    answer: 原因
  - text: Идёт дождь, поэ́тому я до́ма.
    answer: 结果
  - text: Э́то студе́нт, кото́рый живёт у Петро́вых.
    answer: 定语
  - text: Позвони́ мне, когда́ поза́втракаешь.
    answer: 时间
  - text: Позвони́ мне, е́сли бу́дет вре́мя.
    answer: 条件
  - text: Я позвони́л ей, потому́ что она́ была́ больна́.
    answer: 原因
  - text: А́нна была́ больна́, поэ́тому я позвони́л ей.
    answer: 结果
  - text: Где кни́га, кото́рая лежа́ла на столе́?
    answer: 定语
  - text: Е́сли ты уста́л, ложи́сь спать.
    answer: 条件
  - text: Когда́ конце́рт ко́нчился, мы пошли́ домо́й.
    answer: 时间
  - text: Ми́ша не пошёл в шко́лу, потому́ что был бо́лен.
    answer: 原因
  - text: Я зна́ю де́вушку, кото́рая рабо́тает в библиоте́ке.
    answer: 定语
  - text: У меня́ нет зонта́, поэ́тому я не пойду́ гуля́ть.
    answer: 结果
  - text: Когда́ Ван Лэй был в Пеки́не, он ча́сто ходи́л в парк.
    answer: 时间
  - text: Е́сли идёт снег, де́ти ката́ются на лы́жах.
    answer: 条件
  - text: Мы живём в до́ме, кото́рый стои́т у па́рка.
    answer: 定语
  - text: Пьер мно́го зна́ет о Москве́, потому́ что мно́го чита́ет.
    answer: 原因
  - text: Ю́ми уста́ла, поэ́тому она́ отдыха́ет.
    answer: 结果
  why: '第 1、6、12、16 题：[когда́]{.ru} 引出时间从句，说明动作在什么时候发生。

    第 2、7、11、17 题：[е́сли]{.ru} 引出条件从句，说的事可能发生，也可能不发生。

    第 3、8、13、19 题：[потому́ что]{.ru} 引出原因，回答 [почему́]{.ru}。

    第 4、9、15、20 题：[поэ́тому]{.ru} 引出结果，原因在它前面。

    第 5、10、14、18 题：[кото́рый]{.ru} 引出定语从句，说明前面的名词是什么样的人或东西。'
  lessons:
  - L79
  - L82
  - L83
  - L84
  recycles:
  - L82-01
  - L83-01
  - L84-01
- id: L84-综合-b
  tags:
  - 综合：когда́ / е́сли 两分句时态配合核查
  task: 核查 [когда́]{.ru}、[е́сли]{.ru} 复合句两部分的时态配合，把句子归类。
  type: classify
  bins:
  - 正确
  - 有错
  items:
  - text: Когда́ я поза́втракаю, я позвоню́ тебе́.
    answer: 正确
  - text: Когда́ я за́втракаю, я позвоню́ тебе́.
    answer: 有错
  - text: Е́сли за́втра бу́дет хо́лодно, мы бу́дем до́ма.
    answer: 正确
  - text: Е́сли за́втра хо́лодно, мы бу́дем до́ма.
    answer: 有错
  - text: Когда́ я бу́ду в Пеки́не, я бу́ду говори́ть по-кита́йски.
    answer: 正确
  - text: Когда́ я в Пеки́не, я бу́ду говори́ть по-кита́йски.
    answer: 有错
  - text: Когда́ А́нна вы́пила ко́фе, они́ пошли́ в университе́т.
    answer: 正确
  - text: Е́сли ты ку́пишь хлеб, мы бу́дем у́жинать.
    answer: 正确
  - text: Когда́ уро́к ко́нчится, мы пошли́ в столо́вую.
    answer: 有错
  - text: Е́сли идёт дождь, я сижу́ до́ма.
    answer: 正确
  - text: Е́сли ты заболе́ешь, ты бу́дешь лежа́ть в посте́ли.
    answer: 正确
  - text: Когда́ Ми́ша вернётся домо́й, ма́ма дала́ ему́ пирожки́.
    answer: 有错
  - text: Е́сли Ми́ша сде́лает уро́ки, он пойдёт гуля́ть.
    answer: 正确
  - text: Е́сли у меня́ есть вре́мя в суббо́ту, я пойду́ в музе́й.
    answer: 有错
  - text: Когда́ мы шли домо́й, мы уви́дели О́льгу Ви́кторовну.
    answer: 正确
  - text: Когда́ вы прочита́ете кни́гу, да́йте её мне.
    answer: 正确
  - text: Когда́ ты прочита́л кни́гу, дай её мне.
    answer: 有错
  - text: Е́сли я вста́ну ра́но, я позвоню́ тебе́.
    answer: 正确
  why: '第 1、3、5、8、11、13、16、18 题：说将来的事，两部分都用将来时（或主句用命令式），配合正确。第 7、15 题说过去的事，两部分都用过去时；第 10 题说规律，两部分都用现在时。

    第 2、6 题：主句是将来时，[когда́]{.ru} 从句却用了现在时，应改为 [поза́втракаю]{.ru}、[бу́ду в Пеки́не]{.ru}。第 4、14 题：[е́сли]{.ru} 从句说将来，要加 [бу́дет]{.ru}：[бу́дет хо́лодно]{.ru}，[у меня́ бу́дет вре́мя]{.ru}。

    第 9、12、17 题：两部分时间不一致：第 9 题应为 [ко́нчится — пойдём]{.ru} 或 [ко́нчился — пошли́]{.ru}；第 12 题应为 [вернётся — даст]{.ru} 或 [верну́лся — дала́]{.ru}；第 17 题主句是命令式，从句用将来时 [прочита́ешь]{.ru}。'
  lessons:
  - L82
  - L83
  recycles:
  - L82-04
  - L83-02
  - L83-03
- id: L84-综合-c
  tags:
  - 综合：кото́рый 第一格性数配合
  task: 按先行词的性数写出 [кото́рый]{.ru} 的第一格和从句谓语的过去时。
  type: matrix
  cols:
  - 先行词
  - '[кото́рый]{.ru}'
  - 从句谓语（过去时）
  given:
  - 0
  rows:
  - base: '[студе́нт]{.ru}'
    cells:
    - '[студе́нт]{.ru}'
    - '[кото́рый]{.ru}'
    - '[жил]{.ru}'
    hint: '[жить]{.ru}'
  - base: '[студе́нтка]{.ru}'
    cells:
    - '[студе́нтка]{.ru}'
    - '[кото́рая]{.ru}'
    - '[жила́]{.ru}'
    hint: '[жить]{.ru}'
  - base: '[письмо́]{.ru}'
    cells:
    - '[письмо́]{.ru}'
    - '[кото́рое]{.ru}'
    - '[лежа́ло]{.ru}'
    hint: '[лежа́ть]{.ru}'
  - base: '[кни́ги]{.ru}'
    cells:
    - '[кни́ги]{.ru}'
    - '[кото́рые]{.ru}'
    - '[лежа́ли]{.ru}'
    hint: '[лежа́ть]{.ru}'
  - base: '[ко́мната]{.ru}'
    cells:
    - '[ко́мната]{.ru}'
    - '[кото́рая]{.ru}'
    - '[находи́лась]{.ru}'
    hint: '[находи́ться]{.ru}'
  - base: '[парк]{.ru}'
    cells:
    - '[парк]{.ru}'
    - '[кото́рый]{.ru}'
    - '[находи́лся]{.ru}'
    hint: '[находи́ться]{.ru}'
  - base: '[о́зеро]{.ru}'
    cells:
    - '[о́зеро]{.ru}'
    - '[кото́рое]{.ru}'
    - '[нра́вилось]{.ru}'
    hint: '[нра́виться]{.ru}'
  - base: '[де́вушка]{.ru}'
    cells:
    - '[де́вушка]{.ru}'
    - '[кото́рая]{.ru}'
    - '[рабо́тала]{.ru}'
    hint: '[рабо́тать]{.ru}'
  - base: '[друзья́]{.ru}'
    cells:
    - '[друзья́]{.ru}'
    - '[кото́рые]{.ru}'
    - '[звони́ли]{.ru}'
    hint: '[звони́ть]{.ru}'
  - base: '[авто́бус]{.ru}'
    cells:
    - '[авто́бус]{.ru}'
    - '[кото́рый]{.ru}'
    - '[шёл]{.ru}'
    hint: '[идти́]{.ru}'
  - base: '[ла́мпа]{.ru}'
    cells:
    - '[ла́мпа]{.ru}'
    - '[кото́рая]{.ru}'
    - '[стоя́ла]{.ru}'
    hint: '[стоя́ть]{.ru}'
  - base: '[сло́во]{.ru}'
    cells:
    - '[сло́во]{.ru}'
    - '[кото́рое]{.ru}'
    - '[бы́ло]{.ru}'
    hint: '[быть]{.ru}'
  - base: '[роди́тели]{.ru}'
    cells:
    - '[роди́тели]{.ru}'
    - '[кото́рые]{.ru}'
    - '[жи́ли]{.ru}'
    hint: '[жить]{.ru}'
  - base: '[учи́тель]{.ru}'
    cells:
    - '[учи́тель]{.ru}'
    - '[кото́рый]{.ru}'
    - '[говори́л]{.ru}'
    hint: '[говори́ть]{.ru}'
  why: '第 1、6、10、14 题：阳性先行词用 [кото́рый]{.ru}，谓语阳性：[жил, находи́лся, шёл, говори́л]{.ru}。第 2、5、8、11 题：阴性用 [кото́рая]{.ru}，谓语 [-ла]{.ru}：[жила́, находи́лась, рабо́тала, стоя́ла]{.ru}。

    第 3、7、12 题：中性用 [кото́рое]{.ru}，谓语 [-ло]{.ru}：[лежа́ло, нра́вилось, бы́ло]{.ru}。第 4、9、13 题：复数用 [кото́рые]{.ru}，谓语 [-ли]{.ru}。

    [кото́рый]{.ru} 在从句里作主语，谓语跟 [кото́рый]{.ru} 的性数一致，也就是跟先行词一致；[-ся]{.ru} 动词注意 [находи́лся / находи́лась]{.ru}。第 10 题 [идти́]{.ru} 的过去时是 [шёл]{.ru}。'
  lessons:
  - L79
  recycles:
  - L79-01
- id: L84-综合-d
  tags:
  - 综合：复合句连接词
  task: 按句意填 [когда́]{.ru}、[е́сли]{.ru}、[потому́ что]{.ru}、[поэ́тому]{.ru} 或 [кото́рый]{.ru} 的形式。
  type: fill
  items:
  - stem: Я до́ма, ___ идёт дождь.
    accept:
    - потому́ что
  - stem: Идёт дождь, ___ я до́ма.
    accept:
    - поэ́тому
  - stem: Э́то парк, ___ нахо́дится в це́нтре.
    accept:
    - кото́рый
  - stem: Мо́жет быть, за́втра бу́дет дождь. ___ бу́дет дождь, мы бу́дем до́ма.
    accept:
    - Е́сли
  - stem: Уро́к ко́нчится в два. ___ уро́к ко́нчится, мы пойдём в столо́вую.
    accept:
    - Когда́
  - stem: ___ А́нна вы́пила ко́фе, они́ пошли́ в университе́т.
    accept:
    - Когда́
  - stem: Где ша́пка, ___ лежа́ла здесь?
    accept:
    - кото́рая
  - stem: Ван Лэй был бо́лен, ___ не́ был на уро́ке.
    accept:
    - поэ́тому
  - stem: Ван Лэй не́ был на уро́ке, ___ был бо́лен.
    accept:
    - потому́ что
  - stem: Я зна́ю де́вушку, ___ рабо́тает в библиоте́ке.
    accept:
    - кото́рая
  - stem: Возмо́жно, ты заболе́ешь. ___ ты заболе́ешь, ты бу́дешь лежа́ть в посте́ли.
    accept:
    - Е́сли
  - stem: — Почему́ ты не позвони́л? — ___ у меня́ не́ было вре́мени.
    accept:
    - Потому́ что
  - stem: Мы живём в до́ме, ___ стои́т у па́рка.
    accept:
    - кото́рый
  - stem: ___ я шёл домо́й, я уви́дел А́нну.
    accept:
    - Когда́
  - stem: Мари́я Никола́евна — врач, ___ она́ всё зна́ет.
    accept:
    - поэ́тому
  - stem: Где студе́нты, ___ живу́т в общежи́тии?
    accept:
    - кото́рые
  - stem: У меня́ нет зонта́, ___ я не пойду́ гуля́ть.
    accept:
    - поэ́тому
  - stem: Вот письмо́, ___ лежа́ло на столе́.
    accept:
    - кото́рое
  why: '第 1、9、12 题：后一部分是原因，用 [потому́ что]{.ru}；第 2、8、15、17 题：后一部分是结果，用 [поэ́тому]{.ru}。

    第 4、11 题：前一句说明事情不一定发生（[мо́жет быть, возмо́жно]{.ru}），用 [е́сли]{.ru}。第 5 题课一定会结束，只说什么时候，用 [когда́]{.ru}；第 6、14 题说过去发生过的事，也用 [когда́]{.ru}。

    第 3、7、10、13、16、18 题：说明前面的名词，用 [кото́рый]{.ru}，性数跟名词一致：[парк — кото́рый, ша́пка — кото́рая, письмо́ — кото́рое, студе́нты — кото́рые]{.ru}。'
  lessons:
  - L79
  - L82
  - L83
  - L84
  recycles:
  - L82-03
  - L84-02
  - L84-04
