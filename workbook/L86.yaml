  why: '构成：去掉词尾 [-ый, -ий]{.ru}，加 [-ее]{.ru}：[краси́в-ый → краси́вее]{.ru}。

    第 3–11、13、20 题：短尾阴性重音在词尾（[вкусна́, тепла́, темна́]{.ru}），比较级重音落在 [-е́е]{.ru} 上：[вкусне́е, тепле́е, темне́е, светле́е]{.ru}。第 12 题 [умна́ → умне́е]{.ru} 同样。

    第 1、2、14–19 题：短尾阴性重音在词干（[краси́ва, поле́зна, ме́дленна]{.ru}），比较级保留词干上的重音：[краси́вее, поле́знее, ме́дленнее, серьёзнее]{.ru}。

    第 5、9、13、17 题：词干里的 [ё]{.ru} 在比较级重音不在它上面时写成 [е]{.ru}：[тёплый → тепле́е, весёлый → веселе́е, тёмный → темне́е]{.ru}；[серьёзнее]{.ru} 重音仍在 [ё]{.ru} 上，保留 [ё]{.ru}。'
- id: L86-03
  tags:
  - 比较级：形容词与副词功能
  task: 判断比较级在句中是说明主语（形容词），还是修饰动词（副词）。
  type: classify
  bins:
  - 形容词：说明主语
  - 副词：修饰动词
  items:
  - text: Москва́ бо́льше, чем Петербу́рг.
    answer: 形容词：说明主语
  - text: А́нна говори́т по-ру́сски лу́чше, чем я.
    answer: 副词：修饰动词
  - text: В Пеки́не еда́ вкусне́е.
    answer: 形容词：说明主语
  - text: Ван Лэ́ю на́до ме́ньше говори́ть.
    answer: 副词：修饰动词
  - text: Па́па е́здит быстре́е, чем ма́ма.
    answer: 副词：修饰动词
  - text: Э́та кни́га интере́снее, чем та.
    answer: 形容词：说明主语
  - text: Ю́ми пи́шет краси́вее, чем я.
    answer: 副词：修饰动词
  - text: Мой го́род ме́ньше, чем Москва́.
    answer: 形容词：说明主语
  - text: Ми́ша игра́ет в футбо́л ху́же, чем Пьер.
    answer: 副词：修饰动词
  - text: Пого́да в Петербу́рге ху́же.
    answer: 形容词：说明主语
  - text: Ба́бушка гото́вит вкусне́е, чем ма́ма.
    answer: 副词：修饰动词
  - text: Твоя́ ко́мната светле́е, чем моя́.
    answer: 形容词：说明主语
  - text: Ван Лэй тепе́рь чита́ет бо́льше, чем ра́ньше.
    answer: 副词：修饰动词
  - text: Э́то упражне́ние трудне́е, чем то.
    answer: 形容词：说明主语
  - text: А́нна понима́ет ди́ктора лу́чше, чем Ван Лэй.
    answer: 副词：修饰动词
  - text: Ле́то в Пеки́не тепле́е, чем в Москве́.
    answer: 形容词：说明主语
  why: '第 1、3、6、8、10、12、14、16 题：比较级作谓语，说明主语怎么样（“莫斯科更大”“这本书更有意思”），是形容词用法。主语的性数不同，比较级都不变：[Москва́ бо́льше, мой го́род ме́ньше, ле́то тепле́е]{.ru}。

    第 2、4、5、7、9、11、13、15 题：比较级修饰动词，说明动作怎么样（“说得更好”“写得更漂亮”），是副词用法：[говори́т лу́чше, пи́шет краси́вее, чита́ет бо́льше]{.ru}。'
- id: L86-04
  tags:
  - 比较级：不随性数变化；чем 后的形式
  task: 用括号里词的比较级填空，注意 [чем]{.ru} 后面的形式和被比较的词相同。
  type: fill
  items:
  - stem: Москва́ ___, чем Петербу́рг.
    hint: большо́й
    accept:
    - бо́льше
  - stem: Э́та ко́мната ___, чем та.
    hint: ма́ленький
    accept:
    - ме́ньше
  - stem: Э́ти блины́ ___, чем в рестора́не.
    hint: вку́сный
    accept:
    - вкусне́е
  - stem: Сего́дня мне ___, чем вчера́.
    hint: хорошо́
    accept:
    - лу́чше
  - stem: В Петербу́рге пого́да ___, чем в Москве́.
    hint: плохо́й
    accept:
    - ху́же
  - stem: Ю́ми пи́шет ___, чем Пьер.
    hint: краси́во
    accept:
    - краси́вее
  - stem: Э́то о́зеро ___, чем то.
    hint: краси́вый
    accept:
    - краси́вее
  - stem: В Пеки́не ле́том ___, чем в Москве́.
    hint: тёплый
    accept:
    - тепле́е
  - stem: Ми́ша чита́ет ___, чем А́нна.
    hint: ма́ло
    accept:
    - ме́ньше
  - stem: Зимо́й в Москве́ ___, чем в Пеки́не.
    hint: холо́дный
    accept:
    - холодне́е
  - stem: Ва́ша кварти́ра ___, чем на́ша.
    hint: ую́тный
    accept:
    - ую́тнее
  - stem: Ван Лэй тепе́рь говори́т ___, чем ра́ньше.
    hint: бы́стро
    accept:
    - быстре́е
  - stem: Пьер занима́ется ___, чем Ми́ша.
    hint: мно́го
    accept:
    - бо́льше
  - stem: Грамма́тика ___, чем чте́ние.
    hint: тру́дный
    accept:
    - трудне́е
  why: '第 1–14 题：比较级没有性、数、格的变化，主语是阳性、阴性、中性还是复数都一样：[Москва́ бо́льше, ко́мната ме́ньше, о́зеро краси́вее, блины́ вкусне́е]{.ru}。

    第 3、5、8、10 题：[чем]{.ru} 后面的部分和被比较的部分形式相同：[в рестора́не — в Москве́ — в Пеки́не]{.ru} 都是 [в]{.ru} + 第六格。

    第 4、6、9、12 题：原级是副词，比较级也作副词：[хорошо́ → лу́чше, краси́во → краси́вее, бы́стро → быстре́е]{.ru}。第 13 题 [мно́го → бо́льше]{.ru}：[Пьер занима́ется бо́льше, чем Ми́ша.]{.ru}'
