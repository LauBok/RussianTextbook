  why: 第 1–8 题：这四个比较级形式特殊，形容词和副词共用一个：[большо́й, мно́го → бо́льше]{.ru}，[ма́ленький, ма́ло → ме́ньше]{.ru}，[хоро́ший, хорошо́ → лу́чше]{.ru}，[плохо́й, пло́хо → ху́же]{.ru}。重音都在词干。[ху́же]{.ru} 的 [же]{.ru} 读作 [[жы]]{.tr}。
