heading: 第 47 课　说明从句：что 与 что́бы
groups:
- id: B2-L47-01
  tags:
  - что / чтобы：主句词
  task: 这些主句词后面能接哪种从句？归入相应的栏。
  type: classify
  bins:
  - 只接 [что]{.ru}
  - 只接 [что́бы]{.ru}
  - 两种都可以（意思不同）
  items:
  - text: '[знать]{.ru}'
    answer: 只接 [что]{.ru}
  - text: '[ду́мать]{.ru}'
    answer: 只接 [что]{.ru}
  - text: '[ви́деть]{.ru}'
    answer: 只接 [что]{.ru}
  - text: '[слы́шать]{.ru}'
    answer: 只接 [что]{.ru}
  - text: '[рад]{.ru}'
    answer: 只接 [что]{.ru}
  - text: '[понима́ть]{.ru}'
    answer: 只接 [что]{.ru}
  - text: '[хоте́ть]{.ru}'
    answer: 只接 [что́бы]{.ru}
  - text: '[проси́ть]{.ru}'
    answer: 只接 [что́бы]{.ru}
  - text: '[тре́бовать]{.ru}'
    answer: 只接 [что́бы]{.ru}
  - text: '[жела́ть]{.ru}'
    answer: 只接 [что́бы]{.ru}
  - text: '[ну́жно]{.ru}'
    answer: 只接 [что́бы]{.ru}
  - text: '[на́до]{.ru}'
    answer: 只接 [что́бы]{.ru}
  - text: '[сказа́ть]{.ru}'
    answer: 两种都可以（意思不同）
  - text: '[написа́ть]{.ru}'
    answer: 两种都可以（意思不同）
  - text: '[позвони́ть]{.ru}'
    answer: 两种都可以（意思不同）
  - text: '[переда́ть]{.ru}'
    answer: 两种都可以（意思不同）
  why: |-
    第 1–6 题：知道、认为、看见、听见、高兴、明白，说的都是事实，用 [что]{.ru}：[Я рад, что ты пришёл.]{.ru}
    第 7–12 题：愿望、请求、要求、需要，说的是希望发生的事，用 [что́бы]{.ru}：[Я хочу́, что́бы ты пришёл.]{.ru}
    第 13–16 题：“说、写、打电话、转告”带 [что]{.ru} 转述事实，带 [что́бы]{.ru} 转述要求：[Он сказа́л, что А́нна пришла́]{.ru} / [Он сказа́л, что́бы А́нна пришла́]{.ru}。
- id: B2-L47-02
  tags:
  - чтобы + 过去时形式
  task: 写出 [что́бы]{.ru} 后面动词的形式。
  type: matrix
  cols:
  - 从句主语 + 动词
  - '[что́бы]{.ru} 后的形式'
  given:
  - 0
  rows:
  - base: '[ты + прийти́]{.ru}'
    cells:
    - '[ты + прийти́]{.ru}'
    - '[пришёл]{.ru}'
    hint: 男
  - base: '[ты + прийти́]{.ru}'
    cells:
    - '[ты + прийти́]{.ru}'
    - '[пришла́]{.ru}'
    hint: 女
  - base: '[вы + быть]{.ru}'
    cells:
    - '[вы + быть]{.ru}'
    - '[бы́ли]{.ru}'
  - base: '[нам + быть ве́село]{.ru}'
    cells:
    - '[нам + быть ве́село]{.ru}'
    - '[бы́ло]{.ru}'
  - base: '[Ми́ша + чита́ть]{.ru}'
    cells:
    - '[Ми́ша + чита́ть]{.ru}'
    - '[чита́л]{.ru}'
  - base: '[А́нна + позвони́ть]{.ru}'
    cells:
    - '[А́нна + позвони́ть]{.ru}'
    - '[позвони́ла]{.ru}'
  - base: '[де́ти + спать]{.ru}'
    cells:
    - '[де́ти + спать]{.ru}'
    - '[спа́ли]{.ru}'
  - base: '[он + принести́]{.ru}'
    cells:
    - '[он + принести́]{.ru}'
    - '[принёс]{.ru}'
  - base: '[она́ + принести́]{.ru}'
    cells:
    - '[она́ + принести́]{.ru}'
    - '[принесла́]{.ru}'
  - base: '[сестра́ + вы́йти за́муж]{.ru}'
    cells:
    - '[сестра́ + вы́йти за́муж]{.ru}'
    - '[вы́шла за́муж]{.ru}'
  - base: '[письмо́ + прийти́]{.ru}'
    cells:
    - '[письмо́ + прийти́]{.ru}'
    - '[пришло́]{.ru}'
  - base: '[Ван Лэй + сказа́ть]{.ru}'
    cells:
    - '[Ван Лэй + сказа́ть]{.ru}'
    - '[сказа́л]{.ru}'
  - base: '[мы + не опозда́ть]{.ru}'
    cells:
    - '[мы + не опозда́ть]{.ru}'
    - '[не опозда́ли]{.ru}'
  - base: '[вы + помо́чь]{.ru}'
    cells:
    - '[вы + помо́чь]{.ru}'
    - '[помогли́]{.ru}'
  - base: '[пого́да + быть хоро́шей]{.ru}'
    cells:
    - '[пого́да + быть хоро́шей]{.ru}'
    - '[была́]{.ru}'
  - base: '[все + быть здоро́вы]{.ru}'
    cells:
    - '[все + быть здоро́вы]{.ru}'
    - '[бы́ли]{.ru}'
  why: |-
    [что́бы]{.ru} 后面一律用过去时形式，性数跟从句主语一致，不管说的是哪个时间。
    第 1、5、8、12 题：阳性：[пришёл, чита́л, принёс, сказа́л]{.ru}。
    第 2、6、9、10、15 题：阴性：[пришла́, позвони́ла, принесла́, вы́шла за́муж, была́]{.ru}。
    第 4、11 题：中性：无人称句 [что́бы нам бы́ло ве́село]{.ru}，[письмо́ пришло́]{.ru}。
    第 3、7、13、14、16 题：复数（包括尊称的 [вы]{.ru}）：[бы́ли, спа́ли, не опозда́ли, помогли́]{.ru}。
    易错：[принёс, помо́г — помогли́]{.ru} 的过去时要记准；不能写成将来时 [придёшь]{.ru}。
- id: B2-L47-03
  tags:
  - 不定式还是 чтобы
  task: 看主句和做这件事的人，判断后面该用哪种形式。
  type: classify
  bins:
  - 不定式
  - '[что́бы]{.ru} + 过去时形式'
  items:
  - text: '[Я хочу́ …]{.ru}　做事的人：[я]{.ru}'
    answer: 不定式
  - text: '[Я хочу́ …]{.ru}　做事的人：[ты]{.ru}'
    answer: '[что́бы]{.ru} + 过去时形式'
  - text: '[Ма́ма хо́чет …]{.ru}　做事的人：[Ми́ша]{.ru}'
    answer: '[что́бы]{.ru} + 过去时形式'
  - text: '[Ми́ша хо́чет …]{.ru}　做事的人：[Ми́ша]{.ru}'
    answer: 不定式
  - text: '[Мы хоти́м …]{.ru}　做事的人：[вы]{.ru}'
    answer: '[что́бы]{.ru} + 过去时形式'
  - text: '[Ты хо́чешь …]{.ru}　做事的人：[ты]{.ru}'
    answer: 不定式
  - text: '[Ка́тя попроси́ла А́нну …]{.ru}　做事的人：[А́нна]{.ru}'
    answer: 不定式
  - text: '[Ка́тя попроси́ла, …]{.ru}　做事的人：[А́нна]{.ru}'
    answer: '[что́бы]{.ru} + 过去时形式'
  - text: '[Па́па хо́чет …]{.ru}　做事的人：[па́па]{.ru}'
    answer: 不定式
  - text: '[Па́па хо́чет, …]{.ru}　做事的人：[мы]{.ru}'
    answer: '[что́бы]{.ru} + 过去时形式'
  - text: '[Они́ хотя́т …]{.ru}　做事的人：[они́]{.ru}'
    answer: 不定式
  - text: '[Я хоте́л бы, …]{.ru}　做事的人：[вы]{.ru}'
    answer: '[что́бы]{.ru} + 过去时形式'
  why: |-
    第 1、4、6、9、11 题：想做的是主语自己，用不定式：[Я хочу́ пойти́]{.ru}。不能说 [Я хочу́, что́бы я пошёл]{.ru}。
    第 2、3、5、10、12 题：想让别人做，用 [что́бы]{.ru} 从句：[Я хочу́, что́бы ты пошёл]{.ru}。
    第 7 题：[проси́ть кого́]{.ru} 后面已有第四格 [А́нну]{.ru}，接不定式：[попроси́ла А́нну прийти́]{.ru}。
    第 8 题：主句里没有说请谁，做事的人放进从句：[попроси́ла, что́бы А́нна пришла́]{.ru}。两种说法意思相同。
- id: B2-L47-04
  tags:
  - что / чтобы（句中）
  task: 用括号里的动词填空。
  type: fill
  items:
  - stem: Ба́бушка хо́чет, что́бы мы ___ к ней в суббо́ту.
    hint: прие́хать
    accept:
    - прие́хали
  - stem: Я зна́ю, что ты за́втра ___ к нам.
    hint: прийти́
    accept:
    - придёшь
  - stem: Учи́тель тре́бует, что́бы Ми́ша ___ уро́ки во́время.
    hint: де́лать
    accept:
    - де́лал
  - stem: Ма́ма сказа́ла, что́бы А́нна ___ хлеб.
    hint: купи́ть
    accept:
    - купи́ла
  - stem: Ма́ма сказа́ла, что А́нна уже́ ___ хлеб.
    hint: купи́ть
    accept:
    - купи́ла
  - stem: Я рад, что вы ___ ко мне.
    hint: прийти́
    accept:
    - пришли́
  - stem: Ну́жно, что́бы все ___ во́время.
    hint: прийти́
    accept:
    - пришли́
  - stem: Пьер хо́чет ___ в Каза́нь.
    hint: пое́хать
    accept:
    - пое́хать
  - stem: Я жела́ю, что́бы у вас всё ___ хорошо́.
    hint: быть
    accept:
    - бы́ло
  - stem: Ди́ма написа́л, что́бы я ___ ему́ ве́чером.
    hint: позвони́ть
    accept:
    - позвони́л
    - позвони́ла
  - stem: Ка́тя попроси́ла Ван Лэ́я ___ тост.
    hint: сказа́ть
    accept:
    - сказа́ть
  - stem: Мы ду́маем, что ле́то ___ жа́ркое.
    hint: быть
    accept:
    - бу́дет
  why: |-
    第 1、3、4、7、9、10 题：[что́бы]{.ru} 后用过去时形式，性数跟从句主语：[прие́хали, де́лал, купи́ла, пришли́, бы́ло]{.ru}；第 9 题 [всё]{.ru} 作主语，用中性 [бы́ло]{.ru}；第 10 题说话人性别不知道，[позвони́л / позвони́ла]{.ru} 都对。
    第 2、5、6、12 题：[что]{.ru} 陈述事实，按实际时间：将来 [придёшь, бу́дет]{.ru}，过去 [купи́ла, пришли́]{.ru}。第 4、5 题对比：同一个 [сказа́ла]{.ru}，带 [что́бы]{.ru} 是叫她去买，带 [что]{.ru} 是说她已经买了。
    第 8 题：想做的是主语自己，用不定式。
    第 11 题：[попроси́ть кого́]{.ru} + 不定式：[сказа́ть]{.ru}。
