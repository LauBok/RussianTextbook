  passage_zh: |
    莲娜：

    我上班到八点。瓦尼亚今天没去上学：他夜里发烧，嗓子疼。你放学回来以后，和他一起吃午饭。红菜汤在冰箱里。

    三点给瓦尼亚吃药。药在厨房，在最上面一层架子上。要是晚上他又发烧，给我打电话。

    家里没面包了，请你买两个长面包。钱在我那个旧钱包里，钱包在门厅的桌子上。

    瓦尼亚可以玩电脑，但只能玩一个小时，不能再多了。

    奶奶问你星期六能不能和她一起去市场。给她打个电话。

    妈妈
  why: >-
    第 1 空：说的是夜里的事，用过去时；主语是 [го́рло]{.ru}（中性），过去时用中性 [боле́ло]{.ru}。前面的 [была́]{.ru} 是跟阴性的 [температу́ра]{.ru} 一致的，照抄写成 [боле́ла]{.ru} 就错了（第 17、85 课）。第 2 空：放学回来是将来的事，而且是先回来、再吃饭，[когда́]{.ru} 从句用完成体将来时；主语是便条写给的“你”，第二人称：[вернёшься]{.ru}。写成过去时 [верну́лась]{.ru} 或现在时都不对（第 43、82、83 课）。第 3 空：[с]{.ru} 要第五格，[он]{.ru} 的第五格在前置词后面加 [н]{.ru}：[с ним]{.ru}（第 62 课）。第 4 空：[в]{.ru} 回答 [где]{.ru}，要第六格：[в холоди́льнике]{.ru}（第 11 课）。第 5 空：[на]{.ru} 回答 [где]{.ru}，要第六格；[ве́рхний]{.ru} 是软变化形容词，阴性第六格 [ве́рхней]{.ru}，不是硬变化的 [-ой]{.ru}：[на ве́рхней по́лке]{.ru}（第 18、66 课）。第 6 空：[е́сли]{.ru} 说的是今天晚上可能发生的事，从句用将来时：[бу́дет]{.ru}。照汉语“要是发烧”用现在时 [есть]{.ru} 是常见错误（第 83 课）。第 7 空：[два]{.ru} 后面的名词用单数第二格：[два бато́на]{.ru}（第 35 课）。第 8 空：[в]{.ru} 回答 [где]{.ru}，三个词都用阳性第六格：[в моём ста́ром кошельке́]{.ru}；[кошелёк]{.ru} 变格时 [ё]{.ru} 脱落，写成 [кошелёке]{.ru} 是常见错误（第 19、56 课）。第 9 空：[не бо́льше]{.ru}“不能超过”，用 [мно́го]{.ru} 的比较级 [бо́льше]{.ru}（第 86 课）。第 10 空：转述奶奶的问话“你能不能……”，[ли]{.ru} 放在被问的动词后面；问的对象是便条写给的莲娜，从句里是第二人称：[мо́жешь]{.ru}。写成 [могу́]{.ru} 是照搬奶奶原话的人称，写成 [мо́жет]{.ru} 是把主语当成了奶奶（第 27、89 课）。
