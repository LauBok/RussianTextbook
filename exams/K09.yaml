- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：外面在下雨，要带的是伞 [зонт]{.ru}；眼镜、词典、球都挡不了雨（第 83 课）。第 2 题：[ча́сто]{.ru} 表示经常往返，坐电气火车去用 [е́здить]{.ru}：[е́здим]{.ru}；[е́дем]{.ru} 是此刻正在去，[хо́дим]{.ru}、[идём]{.ru} 是步行（第 25 课）。第 3 题：要找的人不在，接电话的人先表示歉意，说 [Извини́те]{.ru}；[Пожа́луйста]{.ru} 用于请求或回答感谢，[Спаси́бо]{.ru}、[Ничего́]{.ru} 在这里都不合场合（第 46、51 课）。第 4 题：说从哪个国家来用 [из]{.ru} + 第二格：[из Фра́нции]{.ru}；[с]{.ru} 配用 [на]{.ru} 的地点，[от]{.ru} 配人，[у]{.ru} 不表示来源（第 36 课）。第 5 题：后半句说 [поэ́тому хожу́ туда́ пешко́м]{.ru}，住得近才走着去，用 [недалеко́ от]{.ru}；[далеко́ от]{.ru} 和“所以走着去”的因果不合，[без]{.ru}、[по́сле]{.ru} 不表示位置（第 37、84 课）。第 6 题：明天测验，所以今晚要用功：[занима́ться]{.ru}；[отдыха́ть]{.ru}、[гуля́ть]{.ru}、[игра́ть в компью́тер]{.ru} 都和“因为要测验”的因果相反（第 38、84 课）。第 7 题：回答 [Да, вот послу́шай!]{.ru} 说明诗已经背会了，要的是结果，用完成体过去时 [вы́учил]{.ru}；[учи́л]{.ru} 只说背过、学过，不说背会没有（第 42、44 课）。第 8 题：屋里太热，要请对方开窗：[Откро́й]{.ru}；[Возьми́]{.ru}、[Помо́й]{.ru}、[Покажи́]{.ru} 都和“太热”无关（第 46 课）。第 9 题：[е́сли]{.ru} 从句说的是将来的事（星期五以前），俄语从句里也要用将来时，不能像汉语那样用现在时 [чита́ешь]{.ru}；要的是“读完”这个结果，读完才能把书给我，所以用完成体将来时 [прочита́ешь]{.ru}；[бу́дешь чита́ть]{.ru} 只说过程，[прочита́л]{.ru} 是过去时（第 43、83 课）。第 10 题：给谁买东西，用第三格；形容词第三格阳性词尾是 [-ому]{.ru}，名词是 [-у]{.ru}：[мла́дшему бра́ту]{.ru}；[мла́дшего бра́та]{.ru} 是第二、四格，会被理解成“买了弟弟”（第 51、56 课）。第 11 题：常去音乐学院听音乐会，说明她对音乐感兴趣：[му́зыкой]{.ru}；四个选项都是第五格，要靠后半句的意思来选（第 26、63 课）。第 12 题：后面是第五格 [ста́рым дру́гом]{.ru}，“和……谈话”用 [с]{.ru}；[о]{.ru} 要第六格，[у]{.ru} 要第二格，[к]{.ru} 要第三格（第 61、65 课）。第 13 题：“从早到晚”是固定搭配 [с утра́ до ве́чера]{.ru}，[до]{.ru} 和 [с]{.ru} 前后呼应（第 68 课）。第 14 题：问的是明天，回答将来的一次出行用 [Пое́ду]{.ru}；[Е́здил]{.ru}、[Пое́хал]{.ru} 是过去时，[Е́зжу]{.ru} 表示经常去（第 73 课）。第 15 题：[кото́рый]{.ru} 指前面的 [музе́й]{.ru}，阳性单数；它在从句里作 [нра́вится]{.ru} 的主语，用第一格 [кото́рый]{.ru}（第 79 课）。第 16 题：[всегда́]{.ru} 说经常的情况，用未完成体现在时；[устава́ть]{.ru} 和 [встава́ть]{.ru} 一样，现在时去掉 [-ва-]{.ru}：[устаёт]{.ru}，[устава́ет]{.ru} 是照不定式类推出来的错误形式；[уста́нет]{.ru} 是完成体将来时，不表示经常的情况；[устаю́т]{.ru} 是复数，主语 [ма́ма]{.ru} 是单数（第 81 课）。第 17 题：弟弟自己穿衣服，用带 [-ся]{.ru} 的 [одева́ется]{.ru}；[одева́ет]{.ru} 要有宾语，是给别人穿（第 81 课）。第 18 题：主句 [пошёл гуля́ть]{.ru} 是一次的动作，发生在作业做完以后，[когда́]{.ru} 从句用完成体过去时 [сде́лал]{.ru} 表示“做完了……之后”；[де́лал]{.ru} 表示“正在做作业的时候”，那就成了一边做作业一边出去散步；[де́лаю]{.ru}、[сде́лаю]{.ru} 和主句的过去时不配（第 45、82 课）。第 19 题：[е́сли]{.ru} 说的是将来的条件，从句也要用将来时 [бу́дет]{.ru}；照汉语“如果明天下雨”用现在时 [идёт]{.ru} 是常见错误，[был]{.ru}、[шёл]{.ru} 是过去时，和 [за́втра]{.ru} 矛盾（第 69、83 课）。第 20 题：前半句是原因，后半句是结果，用 [поэ́тому]{.ru}“所以”；[потому́ что]{.ru} 后面要接原因，这里接的是结果（第 84 课）。第 21 题：不能说话，是嗓子疼：[го́рло]{.ru}；腿、背、肚子疼都不影响说话（第 85 课）。第 22 题：[температу́ры уже́ нет]{.ru} 说明身体变好了，用 [лу́чше]{.ru}；[ху́же]{.ru} 意思相反，[бо́льше]{.ru}、[ме́ньше]{.ru} 不说身体状况（第 86 课）。第 23 题：家是主语“我的朋友”自己的，第三人称用 [свой]{.ru}，[о]{.ru} 要求第六格，阴性 [свое́й]{.ru}；[о его́ семье́]{.ru} 会理解成别人的家（第 87 课）。第 24 题：转述娜塔莎的话，人称从“我”改成“她”，用第三人称 [позвони́т]{.ru}；[за́втра]{.ru} 说明是将来时（第 88 课）。第 25 题：一般疑问句转述时用 [ли]{.ru}，[ли]{.ru} 紧跟在被问的词后面：[сде́лали ли мы]{.ru}；[ли]{.ru} 不放在从句开头，也不能用 [е́сли]{.ru} 代替（第 89 课）。
  items:
  - stem: На у́лице дождь, возьми́ ___!
    options:
    - очки́
    - слова́рь
    - мяч
    - зонт
    answer: зонт
  - stem: Ле́том мы ча́сто ___ на да́чу на электри́чке.
    options:
    - е́дем
    - хо́дим
    - е́здим
    - идём
    answer: е́здим
  - stem: — Алло́! Ната́ша до́ма? — ___, её сейча́с нет.
    options:
    - Пожа́луйста
    - Извини́те
    - Спаси́бо
    - Ничего́
    answer: Извини́те
  - stem: — Отку́да вы? — Я ___ Фра́нции.
    options:
    - из
    - с
    - от
    - у
    answer: из
  - stem: Я живу́ ___ университе́та, поэ́тому хожу́ туда́ пешко́м.
    options:
    - далеко́ от
    - недалеко́ от
    - без
    - по́сле
    answer: недалеко́ от
  - stem: За́втра у меня́ контро́льная, поэ́тому сего́дня ве́чером я бу́ду ___.
    options:
    - отдыха́ть
    - гуля́ть
    - занима́ться
    - игра́ть в компью́тер
    answer: занима́ться
  - stem: — Ты уже́ ___ стихи́? — Да, вот послу́шай!
    options:
    - учи́л
    - у́чишь
    - вы́учишь
    - вы́учил
    answer: вы́учил
  - stem: ___, пожа́луйста, окно́, здесь о́чень жа́рко!
    options:
    - Откро́й
    - Возьми́
    - Помо́й
    - Покажи́
    answer: Откро́й
  - stem: Е́сли ты ___ кни́гу до пя́тницы, дай её мне, пожа́луйста.
    options:
    - чита́ешь
    - прочита́ешь
    - прочита́л
    - бу́дешь чита́ть
    answer: прочита́ешь
  - stem: 'Вчера́ я купи́л ___ мяч: он о́чень лю́бит футбо́л.'
    options:
    - мла́дшего бра́та
    - мла́дший брат
    - мла́дшим бра́том
    - мла́дшему бра́ту
    answer: мла́дшему бра́ту
  - stem: Ната́ша интересу́ется ___ и ча́сто хо́дит на конце́рты в консервато́рию.
    options:
    - му́зыкой
    - футбо́лом
    - матема́тикой
    - литерату́рой
    answer: му́зыкой
  - stem: Вчера́ я до́лго разгова́ривал ___ ста́рым дру́гом.
    options:
    - о
    - у
    - с
    - к
    answer: с
  - stem: Моя́ ма́ма рабо́тает с утра́ ___ ве́чера.
    options:
    - от
    - до
    - по
    - в
    answer: до
  - stem: — Что ты бу́дешь де́лать за́втра? — ___ на да́чу к ба́бушке.
    options:
    - Е́здил
    - Пое́хал
    - Пое́ду
    - Е́зжу
    answer: Пое́ду
  - stem: Вот музе́й, ___ мне о́чень нра́вится.
    options:
    - кото́рая
    - кото́рое
    - кото́рые
    - кото́рый
    answer: кото́рый
  - stem: По́сле рабо́ты ма́ма всегда́ о́чень ___.
    options:
    - устава́ет
    - устаёт
    - уста́нет
    - устаю́т
    answer: устаёт
  - stem: У́тром мой мла́дший брат умыва́ется, ___ и за́втракает.
    options:
    - одева́ет
    - одева́ется
    - одева́ются
    - одева́ть
    answer: одева́ется
  - stem: Когда́ я ___ дома́шнее зада́ние, я пошёл гуля́ть.
    options:
    - де́лал
    - де́лаю
    - сде́лаю
    - сде́лал
    answer: сде́лал
  - stem: Е́сли за́втра ___ си́льный дождь, мы бу́дем сиде́ть до́ма.
    options:
    - идёт
    - был
    - бу́дет
    - шёл
    answer: бу́дет
  - stem: Вчера́ шёл си́льный дождь, ___ мы не пое́хали на да́чу.
    options:
    - поэ́тому
    - потому́ что
    - е́сли
    - когда́
    answer: поэ́тому
  - stem: У меня́ боли́т ___, и я не могу́ говори́ть.
    options:
    - нога́
    - спина́
    - живо́т
    - го́рло
    answer: го́рло
  - stem: 'Мне сего́дня гора́здо ___, чем вчера́: температу́ры уже́ нет.'
    options:
    - ху́же
    - бо́льше
    - лу́чше
    - ме́ньше
    answer: лу́чше
  - stem: Мой друг ча́сто расска́зывает о ___ семье́.
    options:
    - свое́й
    - его́
    - своя́
    - свою́
    answer: свое́й
  - stem: — Что сказа́ла Ната́ша? — Она́ сказа́ла, что ___ тебе́ за́втра.
    options:
    - позвоню́
    - позвони́т
    - позвони́ла
    - позвони́шь
    answer: позвони́т
  - stem: Учи́тель спроси́л, ___ мы упражне́ние.
    options:
    - ли сде́лали
    - е́сли сде́лали
    - сде́лали ли
    - что сде́лали
    answer: сде́лали ли
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: '::: {.prose lang="ru"}

    **Сосе́д**


    Ря́дом с на́ми живёт Михаи́л Ива́нович. Ему́ во́семьдесят лет. Ра́ньше он рабо́тал (1) []{.blank} в шко́ле: со́рок лет он объясня́л де́тям матема́тику. Сейча́с он живёт оди́н, (2) []{.blank} ему́ не ску́чно: у него́ есть больша́я соба́ка. Ка́ждое у́тро он (3) []{.blank} с ней в па́рке.


    В ноябре́ Михаи́л Ива́нович заболе́л: у него́ была́ высо́кая (4) []{.blank} и боле́ло го́рло. Врач сказа́л, что ему́ (5) []{.blank} гуля́ть. Но соба́ке ну́жно гуля́ть ка́ждый день! Тогда́ Михаи́л Ива́нович позвони́л (6) []{.blank} и спроси́л, могу́ ли я гуля́ть с его́ соба́кой. Я отве́тил, что могу́.


    Це́лый ме́сяц я встава́л (7) []{.blank}, чем обы́чно, и шёл с соба́кой в парк, а пото́м в шко́лу. Соба́ка снача́ла не хоте́ла идти́ со мной: она́ ждала́ своего́ (8) []{.blank}. Но че́рез неде́лю она́ уже́ была́ (9) []{.blank} мне.


    Одна́жды ве́чером я был у Михаи́ла Ива́новича. Он спроси́л, почему́ я сего́дня не (10) []{.blank}. Я отве́тил, что за́втра у меня́ контро́льная по матема́тике, а матема́тику я понима́ю (11) []{.blank}. «Не волну́йся, — сказа́л Михаи́л Ива́нович. — Я тебе́ (12) []{.blank}!» Це́лый ве́чер он (13) []{.blank} мне зада́ния. Он объясня́л гора́здо (14) []{.blank}, чем наш учи́тель, и я всё по́нял.


    На контро́льной я сде́лал все зада́ния. Учи́тель сказа́л, что моя́ рабо́та — са́мая (15) []{.blank} в кла́ссе, и поста́вил мне (16) []{.blank}. Ве́чером я (17) []{.blank} об э́том Михаи́лу Ива́новичу. Ка́жется, он был рад да́же (18) []{.blank}, чем я.


    Сейча́с Михаи́л Ива́нович уже́ (19) []{.blank} и опя́ть гуля́ет со свое́й соба́кой. А в суббо́ту мы гуля́ем вме́сте: тепе́рь мы (20) []{.blank}.

    :::

    '
  passage_zh: '**邻居**


    我们家隔壁住着米哈伊尔·伊万诺维奇。他八十岁了。以前他在学校当老师：四十年来他一直给孩子们讲数学。现在他一个人住，可是并不寂寞：他有一条大狗。每天早上他都和狗在公园里散步。


    十一月米哈伊尔·伊万诺维奇病了：发高烧，嗓子疼。医生说他不能出去散步。可是狗每天都得出去遛！于是米哈伊尔·伊万诺维奇给我打电话，问我能不能遛他的狗。我说可以。


    整整一个月我都比平时起得早，先带狗去公园，然后去上学。狗起初不愿意跟我走：它在等自己的主人。可是一个星期以后，它见到我已经很高兴了。


    有一天晚上我在米哈伊尔·伊万诺维奇家。他问我今天为什么不笑。我回答说，明天有数学测验，可我数学学得不好。“别着急，”米哈伊尔·伊万诺维奇说，“我来帮你！”他给我讲了一整晚的题。他讲得比我们老师好得多，我全听懂了。


    测验时我把题全做出来了。老师说我的卷子是全班最好的，给了我五分。晚上我把这件事告诉了米哈伊尔·伊万诺维奇。他好像比我还高兴。


    现在米哈伊尔·伊万诺维奇已经好了，又和自己的狗一起散步了。星期六我们一起散步：现在我们是朋友了。

    '
  why: 第 1 空：下半句说他四十年来 [объясня́л де́тям матема́тику]{.ru}，在课堂上讲数学的是老师：[учи́телем]{.ru}；医生、工程师、司机不上课。第 2 空：一个人住，按说会寂寞，后面却说 [ему́ не ску́чно]{.ru}，前后是转折，用 [но]{.ru}；[поэ́тому]{.ru} 把“一个人住”当成“不寂寞”的原因，不合情理，[и́ли]{.ru}、[е́сли]{.ru} 也不对。第 3 空：和狗在公园里做的事，下文反复说遛狗，用 [гуля́ет]{.ru}；[рабо́тает]{.ru}、[обе́дает]{.ru}、[у́чится]{.ru} 都和狗不相干。第 4 空：病了，“高烧”是 [высо́кая температу́ра]{.ru}；[цена́]{.ru}、[пого́да]{.ru}、[оце́нка]{.ru} 都和生病无关。第 5 空：下一句 [Но соба́ке ну́жно гуля́ть ка́ждый день!]{.ru} 用 [Но]{.ru} 表示转折，说明医生的话是“不能出去”：[нельзя́]{.ru}；[на́до]{.ru}、[мо́жно]{.ru}、[ну́жно]{.ru} 和后面的转折对不上。第 6 空：后面说他问“我能不能遛他的狗”，电话是打给“我”的：[мне]{.ru}；四个代词都是第三格，要看下文才能选。第 7 空：“我”要先遛狗再上学，早上得早起，用 [ра́ньше]{.ru}；[по́зже]{.ru} 和要多做一件事的情况相反，[ху́же]{.ru}、[ме́ньше]{.ru} 不说起床的时间。第 8 空：狗不愿跟“我”走，是在等它原来的主人：[хозя́ина]{.ru}；狗不会等医生、售货员或邻居。第 9 空：[Но]{.ru} 和前一句“不愿意跟我走”相对，一周后它已经喜欢“我”了：[ра́да]{.ru}；[больна́]{.ru}、[занята́]{.ru}、[гото́ва]{.ru} 都构不成这种对照。第 10 空：“我”接下来说的是明天测验、数学不好，是在发愁，所以他问“我”为什么不笑：[улыба́юсь]{.ru}；[пла́ваю]{.ru}、[рису́ю]{.ru}、[игра́ю]{.ru} 和后面的回答接不上。第 11 空：“我”为测验发愁，又需要别人帮忙，说明数学不好：[пло́хо]{.ru}；[отли́чно]{.ru}、[хорошо́]{.ru}、[бы́стро]{.ru} 都不会让人发愁。第 12 空：他教了四十年数学，接着就给“我”讲了一晚上的题，说的是“我来帮你”：[помогу́]{.ru}；[позвоню́]{.ru}、[подарю́]{.ru}、[отве́чу]{.ru} 都和下文不符。第 13 空：下一句说 [Он объясня́л…]{.ru}，他是在给“我”讲题：[объясня́л]{.ru}；[продава́л]{.ru}、[покупа́л]{.ru}、[дари́л]{.ru} 不合情理。第 14 空：结果是 [я всё по́нял]{.ru}，他比老师讲得好：[лу́чше]{.ru}；[ху́же]{.ru} 意思相反，[ме́ньше]{.ru}、[по́зже]{.ru} 不能说明为什么全听懂了。第 15 空：下文老师给了五分，说明这份卷子是全班最好的：[лу́чшая]{.ru}；[ста́рая]{.ru}、[пуста́я]{.ru}、[ма́ленькая]{.ru} 都不是给五分的理由。第 16 空：卷子最好，得的是五分 [пятёрку]{.ru}；[тро́йку]{.ru} 和“最好”矛盾，[спра́вку]{.ru}、[откры́тку]{.ru} 不是分数。第 17 空：“我”把得了五分的事讲给他听：[рассказа́л]{.ru} 和 [об э́том]{.ru} 搭配；[прочита́л]{.ru}、[сыгра́л]{.ru}、[купи́л]{.ru} 都不能接 [об э́том Михаи́лу Ива́новичу]{.ru}。第 18 空：[да́же]{.ru} 表示超出预料，他“比我还高兴”：[бо́льше]{.ru}；[ме́ньше]{.ru} 和 [да́же]{.ru} 的语气不合，[ху́же]{.ru}、[по́зже]{.ru} 不说高兴的程度。第 19 空：他又能自己遛狗了，说明病好了：[здоро́в]{.ru}；[бо́лен]{.ru} 和“又出去散步”矛盾，[за́нят]{.ru}、[гото́в]{.ru} 不合文意。第 20 空：他们本来就是邻居，[тепе́рь]{.ru} 说的是新的关系：成了朋友 [друзья́]{.ru}；[сосе́ди]{.ru} 一开始就是，不用 [тепе́рь]{.ru}，[колле́ги]{.ru}、[студе́нты]{.ru} 不符合事实。
