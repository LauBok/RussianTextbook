- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: 你是在莫斯科学习的中国留学生刘洋，今天病了，不能去上课。给你的俄语老师尼娜·阿列克谢耶夫娜（[Ни́на Алексе́евна]{.ru}）写一条短信，40–60 词。要点：1. 今天不能来上课；2. 原因：感冒了，头疼，发烧 38 度；3. 已经去过诊所，医生说要在家躺三天；4. 请老师告诉你明天的作业是什么；5. 星期四你会带着病假证明来上课。
    length: 40–60
    model: |
      Здра́вствуйте, Ни́на Алексе́евна!

      Извини́те, сего́дня я не могу́ быть на уро́ке, потому́ что я бо́лен. У меня́ просту́да: боли́т голова́ и температу́ра три́дцать во́семь гра́дусов. У́тром я был в поликли́нике. Врач сказа́ла, что я до́лжен три дня лежа́ть до́ма. Скажи́те, пожа́луйста, како́е зада́ние на за́втра? В четве́рг я бу́ду на уро́ке и покажу́ вам спра́вку.

      Лю Ян
    rubric:
    - 13–15 分：五个要点齐全，称呼、道歉和署名得体，对老师用 [вы]{.ru}；语法错误不超过两处
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或对老师用了 [ты]{.ru}，或语法错误较多
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（五个要点各 1 分，称呼和署名 1 分，语气礼貌 1 分）；语法 5 分（[потому́ что]{.ru}、[боли́т]{.ru}、数词和 [гра́дус]{.ru} 的搭配、间接引语每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: 范文约 55 词，按要点的顺序写。语法上：[потому́ что я бо́лен]{.ru} 说明原因，[бо́лен]{.ru} 跟男性主语一致，女生写 [больна́]{.ru}（第 84 课）；[боли́т голова́]{.ru} 动词跟身体部位一致（第 85 课）；[три́дцать во́семь гра́дусов]{.ru} 看最后一个数词 [во́семь]{.ru}，用复数第二格（第 35、82 课）；[Врач сказа́ла, что я до́лжен…]{.ru} 是间接引语，人称改成说话人自己（第 59、88 课）；[Скажи́те, пожа́луйста]{.ru} 是礼貌的请求（第 46 课）；[покажу́ вам спра́вку]{.ru} 是完成体将来时，[вам]{.ru} 是第三格（第 43、52 课）。给老师写短信，开头用 [Здра́вствуйте]{.ru} 加名字和父称，全文用 [вы]{.ru}，结尾写自己的名字。
  - prompt: |
      阅读下面的故事开头，续写 50–80 词，写娜塔莎的主意是什么、全家这一天是怎样过的，给故事一个结尾。

      [В суббо́ту Ко́ля и его́ ста́ршая сестра́ Ната́ша хоте́ли пое́хать на да́чу. В пя́тницу па́па сказа́л: «Е́сли бу́дет хоро́шая пого́да, мы пое́дем у́тром». Но у́тром шёл си́льный дождь. Ко́ля был недово́лен. «Что мы бу́дем де́лать до́ма це́лый день?» — спроси́л он. Тогда́ Ната́ша сказа́ла: «У меня́ есть иде́я!»]{.ru}
    length: 50–80
    model: |
      — Мы мо́жем пригото́вить пельме́ни! Ба́бушка научи́ла меня́, — сказа́ла Ната́ша.

      Снача́ла ма́ма и Ната́ша купи́ли в магази́не мя́со и капу́сту. Пото́м все сиде́ли на ку́хне и де́лали пельме́ни. Снача́ла Ко́ля де́лал их пло́хо, а пото́м да́же лу́чше, чем Ната́ша. Когда́ пельме́ни бы́ли гото́вы, па́па попро́бовал и сказа́л, что они́ вкусне́е, чем в рестора́не.

      Ве́чером дождь ко́нчился. «Хорошо́, что шёл дождь!» — засмея́лся Ко́ля.
    rubric:
    - 13–15 分：主意具体，和下雨待在家这个情境相符；有两三件事和一个结尾，和开头衔接自然；语法错误不超过两处
    - 9–12 分：内容基本完整，情节简单，或语法错误三四处
    - 5–8 分：只写了主意，没有写这一天怎么过、没有结尾，或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（主意 2 分，这一天的经过 2 分，结尾 2 分）；语法 6 分（动词的体、[когда́]{.ru} 从句、间接引语每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: 范文约 75 词，分三段：娜塔莎的主意、全家包饺子、结尾。语法上：[Снача́ла … пото́м …]{.ru} 写事情的先后（第 82 课）；[Когда́ пельме́ни бы́ли гото́вы, … попро́бовал]{.ru} 是 [когда́]{.ru} 从句，[гото́вы]{.ru} 是短尾形容词复数（第 82、89 课）；[сказа́л, что они́ вкусне́е, чем в рестора́не]{.ru} 是间接引语加比较级（第 86、88 课）；[купи́ли, попро́бовал]{.ru} 说一次的结果，用完成体，[сиде́ли и де́лали]{.ru} 说过程，用未完成体（第 42、45 课）；[дождь ко́нчился]{.ru} 呼应开头的雨（第 82 课）。[Мы мо́жем пригото́вить]{.ru} 是 [мочь]{.ru} + 不定式（第 27 课）。结尾最好回到开头的情境，让故事前后呼应。
