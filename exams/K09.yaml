    **Прогно́з пого́ды: Москва́, 18–24 ноября́**

    | | днём | но́чью | |
    |---|---|---|---|
    | понеде́льник, 18 | +5° | +2° | дождь |
    | вто́рник, 19 | +3° | 0° | дождь |
    | среда́, 20 | 0° | −2° | снег, си́льный ве́тер |
    | четве́рг, 21 | −1° | −5° | снег |
    | пя́тница, 22 | −7° | −9° | со́лнечно |
    | суббо́та, 23 | −3° | −11° | со́лнечно |
    | воскресе́нье, 24 | −2° | −4° | снег |

    В Москве́ начина́ется зима́. В сре́ду пойдёт пе́рвый снег, а в четве́рг он бу́дет идти́ весь день. На доро́гах бу́дут про́бки, поэ́тому в э́ти два дня лу́чше е́здить на рабо́ту на метро́. Е́сли вы всё-таки е́дете на маши́не, на́до е́хать на полчаса́ ра́ньше, чем обы́чно.

    В пя́тницу и в суббо́ту бу́дет со́лнечно, но хо́лодно. Не забу́дьте ша́пку и шарф!
    :::
