  type: choice
  task: 阅读理解（三）：阅读下面的天气预报，根据内容选出正确答案。
  points: 2.5
  passage: '::: {.prose lang="ru"}

    **Прогно́з пого́ды на неде́лю: Москва́, ноя́брь**


    | | пого́да | гра́дусов |

    |---|---|---|

    | понеде́льник | дождь, ве́тер | +3 |

    | вто́рник | дождь | +2 |

    | среда́ | снег, ве́тер | 0 |

    | четве́рг | снег и дождь | −1 |

    | пя́тница | сухо́, ве́тра нет | −5 |

    | суббо́та | си́льный моро́з | −15 |

    | воскресе́нье | снег, си́льный ве́тер | −10 |


    В понеде́льник и во вто́рник не забу́дьте взять зонт. В сре́ду и в четве́рг на у́лице бу́дет мо́кро, в го́роде бу́дут про́бки. Е́сли вы е́здите на рабо́ту на маши́не, лу́чше пое́хать на метро́.


    В суббо́ту бу́дет си́льный моро́з. Е́сли вы пойдёте гуля́ть, наде́ньте тёплую ку́ртку, ша́пку, шарф и перча́тки. Е́сли у вас ка́шель и́ли температу́ра, лу́чше сиди́те до́ма.

    :::

    '
  passage_zh: '**一周天气预报：莫斯科，十一月**


    | | 天气 | 气温（度） |

    |---|---|---|

    | 星期一 | 雨，有风 | +3 |

    | 星期二 | 雨 | +2 |

    | 星期三 | 雪，有风 | 0 |

    | 星期四 | 雨夹雪 | −1 |

    | 星期五 | 无雨，无风 | −5 |

    | 星期六 | 严寒 | −15 |

    | 星期天 | 雪，大风 | −10 |


    星期一和星期二别忘了带伞。星期三和星期四外面湿滑，城里会堵车。要是您开车上班，最好改坐地铁。


    星期六严寒。要是您出去散步，请穿上暖和的外套，戴上帽子、围巾和手套。要是您咳嗽或者发烧，最好待在家里。

    '
  why: 第 1 题，表里只有星期一、星期二是单纯的雨，正文也说这两天要带伞；星期四是雨夹雪。第 2 题，推断题：没有雨、没有风、也不是严寒的只有星期五（−5 度，[без дождя́ и без ве́тра]{.ru}）；星期六严寒，星期天有大风。第 3 题，表里星期三是 0 度，[ноль гра́дусов]{.ru}。第 4 题，推断题：星期三、星期四路上湿、堵车，正文建议开车的人改坐地铁，所以这两天坐地铁更好。第 5 题，[Е́сли у вас ка́шель и́ли температу́ра, лу́чше сиди́те до́ма]{.ru}，说的是星期六严寒的时候。
  items:
  - stem: Зонт ну́жен ___.
    options:
    - в сре́ду и в четве́рг
    - в пя́тницу и в суббо́ту
    - то́лько в воскресе́нье
    - в понеде́льник и во вто́рник
    answer: в понеде́льник и во вто́рник
  - stem: Оди́н шко́льник хо́чет гуля́ть, когда́ нет дождя́, ве́тра и си́льного моро́за. Он пойдёт гуля́ть в ___.
    options:
    - суббо́ту
    - пя́тницу
    - сре́ду
    - воскресе́нье
    answer: пя́тницу
  - stem: В сре́ду бу́дет ___.
    options:
    - два гра́дуса
    - ми́нус пять гра́дусов
    - ноль гра́дусов
    - плюс три гра́дуса
    answer: ноль гра́дусов
  - stem: Оди́н инжене́р е́здит на рабо́ту на маши́не. В сре́ду ему́ лу́чше ___.
    options:
    - пое́хать на метро́
    - е́хать на маши́не
    - сиде́ть до́ма
    - идти́ пешко́м
    answer: пое́хать на метро́
  - stem: Е́сли у вас ка́шель, в суббо́ту лу́чше ___.
    options:
    - гуля́ть в па́рке
    - пойти́ на като́к
    - пое́хать на да́чу
    - сиде́ть до́ма
    answer: сиде́ть до́ма
  glossary:
