    ::: {.prose lang="ru"}
    **Пятёрка и тро́йка**

    В Росси́и в шко́ле и в университе́те оце́нка — э́то число́: пять, четы́ре, три, два и́ли оди́н. Пять — э́то отли́чно, четы́ре — хорошо́, три — норма́льно, а два — пло́хо. Оди́н ста́вят о́чень ре́дко. Пять — э́то «пятёрка», а три — «тро́йка». А в Кита́е лу́чшая оце́нка — сто.

    Когда́ шко́льник хорошо́ отвеча́ет на уро́ке, учи́тель ста́вит ему́ пятёрку. Е́сли шко́льник не сде́лал дома́шнее зада́ние, он мо́жет получи́ть два. Пятёрка — са́мая люби́мая оце́нка: е́сли сын и́ли дочь получа́ет пятёрку, роди́тели ра́ды. Но тро́йка — то́же норма́льная оце́нка. Мно́гие изве́стные лю́ди в шко́ле ча́сто получа́ли тро́йки.

    В университе́те студе́нты то́же получа́ют оце́нки: на семина́ре и на контро́льной рабо́те. Е́сли студе́нт был бо́лен и не написа́л контро́льную, он пи́шет её пото́м, но снача́ла пока́зывает спра́вку.

    На уро́ке ру́сские шко́льники отвеча́ют у доски́. Когда́ учи́тель начина́ет уро́к, все встаю́т. Учи́телю говоря́т «вы», а не «ты», и не «О́льга», а «О́льга Ви́кторовна». Так говоря́т и студе́нты в университе́те. Е́сли студе́нт опозда́л, он снача́ла спра́шивает: «Мо́жно?» — и то́лько пото́м сади́тся на своё ме́сто.

    Иностра́нцы снача́ла не понима́ют, почему́ тро́йка — э́то не пло́хо. В Кита́е три — о́чень плоха́я оце́нка!
    :::
  passage_zh: |
    **五分和三分**

    在俄罗斯，中小学和大学的分数是一个数：五、四、三、二或一。五分是优秀，四分是良好，三分是及格，二分是差。一分很少打。五分口语叫 [пятёрка]{.ru}，三分叫 [тро́йка]{.ru}。而在中国，最好的分数是一百分。

    学生在课上回答得好，老师就给他打五分。要是学生没做家庭作业，就可能得二分。五分是最受欢迎的分数：儿子或女儿得了五分，父母都很高兴。不过三分也是正常的分数。很多名人上学时常常得三分。

    大学生也得分数：在讨论课上，在测验中。学生要是病了，没参加测验，以后再补考，不过要先出示病假证明。

    上课时俄罗斯学生在黑板前回答问题。老师开始上课时，大家都起立。对老师说话用 [вы]{.ru}，不用 [ты]{.ru}；不叫“奥尔加”，而叫“奥尔加·维克托罗夫娜”。大学里的学生也这样称呼。学生迟到了，先问一声“可以吗？”，然后才坐到自己的座位上。

    外国人一开始不明白为什么三分不算差。在中国，三分可是很差的分数啊！
  why: 第 1 题，[Пять — э́то отли́чно]{.ru}；一百分是中国的满分。第 2 题，[тро́йка — то́же норма́льная оце́нка]{.ru}，[три — норма́льно]{.ru}。第 3 题，[Когда́ учи́тель начина́ет уро́к, все встаю́т]{.ru}。第 4 题，与原文不符的说法：原文说 [Оди́н ста́вят о́чень ре́дко]{.ru}，一分很少打，不是常打；其他三项原文都说了。第 5 题，推断题：中国是百分制，三分在百分制里很差，在五分制里却是及格，所以外国人一开始不明白。
  items:
  - stem: В Росси́и лу́чшая оце́нка — ___.
    options: [сто, четы́ре, оди́н, пять]
    answer: пять
  - stem: Тро́йка — э́то ___ оце́нка.
    options: [отли́чная, о́чень плоха́я, норма́льная, ре́дкая]
    answer: норма́льная
  - stem: Когда́ учи́тель начина́ет уро́к, шко́льники ___.
    options: [встаю́т, сидя́т, говоря́т «Приве́т!», открыва́ют кни́ги]
    answer: встаю́т
  - stem: 'Э́то не пра́вда: ___.'
    options: [учи́телю говоря́т «вы», оце́нку «оди́н» ста́вят ча́сто, роди́тели ра́ды пятёрке, шко́льники отвеча́ют у доски́]
    answer: оце́нку «оди́н» ста́вят ча́сто
  - stem: Иностра́нцы снача́ла не понима́ют, почему́ тро́йка — норма́льная оце́нка, потому́ что ___.
    options: [тро́йку ста́вят ре́дко, в Кита́е лу́чшая оце́нка — сто, они́ ча́сто получа́ют тро́йки, в Росси́и нет пятёрок]
    answer: в Кита́е лу́чшая оце́нка — сто
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Зонт**

    Обы́чно я (1) []{.blank} (встава́ть) в семь часо́в. Когда́ я (2) []{.blank} (за́втракать), я слу́шаю прогно́з пого́ды. Вчера́ ди́ктор сказа́л, что днём (3) []{.blank} (быть) дождь, но я забы́л (4) []{.blank} (свой зонт) до́ма. Когда́ я шёл из университе́та, дождь (5) []{.blank} (идти́) уже́ час. Я о́чень (6) []{.blank} (замёрзнуть).

    Сего́дня у меня́ (7) []{.blank} (боле́ть) го́рло. Я позвони́л (8) []{.blank} (О́льга Ви́кторовна) и сказа́л, что бо́лен. Мари́я Никола́евна сказа́ла, что горя́чий чай с мёдом — э́то (9) []{.blank} (хорошо́), чем лека́рство. Е́сли за́втра мне (10) []{.blank} (быть) пло́хо, я пойду́ к врачу́.
    :::
  passage_zh: |
    **伞**

    我平时七点起床。我吃早饭的时候听天气预报。昨天播音员说下午有雨，可我把自己的伞忘在家里了。我从学校走回来的时候，雨已经下了一个小时了。我冻坏了。

    今天我嗓子疼。我给奥尔加·维克托罗夫娜打电话，说我病了。玛丽亚·尼古拉耶夫娜说，热的蜂蜜茶比药还好。要是明天我还不舒服，我就去看医生。
  why: 第 1 空：[обы́чно]{.ru} 说经常的动作，用现在时，[встава́ть]{.ru} 去掉 [-ва-]{.ru}：[встаю́]{.ru}（第 81 课）。第 2 空：和主句的 [слу́шаю]{.ru} 同时进行，用未完成体现在时 [за́втракаю]{.ru}（第 82 课）。第 3 空：播音员原话说的是将来的雨 [бу́дет дождь]{.ru}，转述时时不变，仍用 [бу́дет]{.ru}（第 83、88 课）。第 4 空：伞是主语“我”自己的，第一人称 [свой]{.ru} 和 [мой]{.ru} 都可以；[забы́ть]{.ru} 后面用第四格，[зонт]{.ru} 是非动物名词，第四格同第一格：[свой зонт]{.ru}（第 87 课）。第 5 空：下雨用 [идти́]{.ru}，过去时阳性 [шёл]{.ru}，跟 [дождь]{.ru} 一致（第 69、71 课）。第 6 空：[замёрзнуть]{.ru} 的过去时阳性没有 [-л]{.ru}：[замёрз]{.ru}（第 83 课）。第 7 空：身体部位疼用 [боли́т]{.ru}，跟 [го́рло]{.ru} 一致（第 85 课）。第 8 空：[звони́ть]{.ru} 要求第三格，名字和父称都要变：[О́льге Ви́кторовне]{.ru}（第 51 课）。第 9 空：后面有 [чем]{.ru}，用比较级 [лу́чше]{.ru}（第 86 课）。第 10 空：[е́сли]{.ru} 从句说将来，用将来时；无人称句 [мне пло́хо]{.ru} 的将来时是 [мне бу́дет пло́хо]{.ru}（第 58、83 课）。
  items:
  - accept: [встаю́]
  - accept: [за́втракаю]
  - accept: [бу́дет]
  - accept: [свой зонт, мой зонт]
  - accept: [шёл]
  - accept: [замёрз]
  - accept: [боли́т]
  - accept: [О́льге Ви́кторовне]
  - accept: [лу́чше]
  - accept: [бу́дет]
- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: 你是王磊，今天病了，不能去上课。给奥尔加·维克托罗夫娜写一条短信，40–60 词。要点：1. 今天不能来上课；2. 原因：感冒了，头疼，发烧 38 度；3. 已经去过诊所，医生说要在家躺三天；4. 请老师告诉你明天的作业是什么；5. 星期四你会带着病假证明来上课。
    length: 40–60
    model: |
      Здра́вствуйте, О́льга Ви́кторовна!

      Извини́те, сего́дня я не могу́ быть на уро́ке, потому́ что я бо́лен. У меня́ просту́да: боли́т голова́ и температу́ра три́дцать во́семь гра́дусов. У́тром я был в поликли́нике. Врач сказа́ла, что я до́лжен три дня лежа́ть до́ма. Скажи́те, пожа́луйста, како́е зада́ние на за́втра? В четве́рг я бу́ду на уро́ке и покажу́ вам спра́вку.

      Ван Лэй
    rubric:
    - 13–15 分：五个要点齐全，称呼、道歉和署名得体，对老师用 [вы]{.ru}；语法错误不超过两处
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或对老师用了 [ты]{.ru}，或语法错误较多
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（五个要点各 1 分，称呼和署名 1 分，语气礼貌 1 分）；语法 5 分（[потому́ что]{.ru}、[боли́т]{.ru}、数词和 [гра́дус]{.ru} 的搭配、间接引语每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: 范文约 55 词，按要点的顺序写。语法上：[потому́ что я бо́лен]{.ru} 说明原因，[бо́лен]{.ru} 跟男性主语一致（第 84 课）；[боли́т голова́]{.ru} 动词跟身体部位一致（第 85 课）；[три́дцать во́семь гра́дусов]{.ru} 看最后一个数词 [во́семь]{.ru}，用复数第二格（第 35、82 课）；[Врач сказа́ла, что я до́лжен…]{.ru} 是间接引语，人称改成说话人自己（第 59、88 课）；[Скажи́те, пожа́луйста]{.ru} 是礼貌的请求（第 46 课）；[покажу́ вам спра́вку]{.ru} 是完成体将来时，[вам]{.ru} 是第三格（第 43、52 课）。给老师写短信，开头用 [Здра́вствуйте]{.ru} 加名字和父称，全文用 [вы]{.ru}，结尾写自己的名字。
  - prompt: |
      阅读下面的故事开头，续写 50–80 词，写王磊的主意是什么、大家这一天是怎样过的，给故事一个结尾。

      [В суббо́ту Ми́ша и Ван Лэй хоте́ли пое́хать на да́чу. В пя́тницу Ива́н Серге́евич сказа́л: «Е́сли бу́дет хоро́шая пого́да, мы пое́дем у́тром». Но у́тром шёл си́льный дождь. Ми́ша был недово́лен. «Что мы бу́дем де́лать до́ма це́лый день?» — спроси́л он. Тогда́ Ван Лэй сказа́л: «У меня́ есть иде́я!»]{.ru}
    length: 50–80
    model: |
      — Мы мо́жем пригото́вить кита́йские пельме́ни! Я уме́ю их гото́вить, — сказа́л Ван Лэй.

      Снача́ла Мари́я Никола́евна и А́нна купи́ли в магази́не мя́со и капу́сту. Пото́м все сиде́ли на ку́хне и де́лали пельме́ни. Снача́ла Ми́ша де́лал их пло́хо, а пото́м да́же лу́чше, чем А́нна. Когда́ пельме́ни бы́ли гото́вы, Ива́н Серге́евич попро́бовал и сказа́л, что они́ вкусне́е, чем в рестора́не.

      Ве́чером дождь ко́нчился. «Хорошо́, что шёл дождь!» — засмея́лся Ми́ша.
    rubric:
    - 13–15 分：主意具体，和下雨待在家这个情境相符；有两三件事和一个结尾，和开头衔接自然；语法错误不超过两处
    - 9–12 分：内容基本完整，情节简单，或语法错误三四处
    - 5–8 分：只写了主意，没有写这一天怎么过、没有结尾，或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（主意 2 分，这一天的经过 2 分，结尾 2 分）；语法 6 分（动词的体、[когда́]{.ru} 从句、间接引语每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: 范文约 75 词，分三段：王磊的主意、全家包饺子、结尾。语法上：[Снача́ла … пото́м …]{.ru} 写事情的先后（第 82 课）；[Когда́ пельме́ни бы́ли гото́вы, … попро́бовал]{.ru} 是 [когда́]{.ru} 从句，[гото́вы]{.ru} 是短尾形容词复数（第 82、89 课）；[сказа́л, что они́ вкусне́е, чем в рестора́не]{.ru} 是间接引语加比较级（第 86、88 课）；[купи́ли, попро́бовал]{.ru} 说一次的结果，用完成体，[сиде́ли и де́лали]{.ru} 说过程，用未完成体（第 42、45 课）；[дождь ко́нчился]{.ru} 呼应开头的雨（第 82 课）。[Мы мо́жем пригото́вить]{.ru} 是 [мочь]{.ru} + 不定式（第 27 课）。结尾最好回到开头的情境，让故事前后呼应。
