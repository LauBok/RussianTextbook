- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的书信，根据内容选出正确答案。
  points: 2.5
  passage: '::: {.prose lang="ru"}

    Дорога́я ма́ма!


    Извини́, что я давно́ не писа́ла. В октябре́ я начала́ рабо́тать: тепе́рь я официа́нтка в кафе́ ря́дом с университе́том. Я рабо́таю три ве́чера в неде́лю, домо́й возвраща́юсь по́здно, и вре́мени у меня́ совсе́м нет. Но не волну́йся: в други́е дни я ка́ждый ве́чер занима́юсь в библиоте́ке, а вчера́ получи́ла пятёрку по грамма́тике.


    Тепе́рь я живу́ в друго́й ко́мнате. Она́ бо́льше, чем ста́рая, и в ней тепле́е. Моя́ сосе́дка по ко́мнате — студе́нтка из Пеки́на. Она́ у́чит ру́сский язы́к, а я у неё — кита́йский. Кита́йский язы́к гора́здо трудне́е, чем англи́йский, но мне о́чень интере́сно. Ве́чером мы ча́сто пьём чай и разгова́риваем по-ру́сски и по-кита́йски.


    Ты спра́шиваешь, не ску́чно ли мне в Москве́. Нет! Неда́вно мы с сосе́дкой ходи́ли в Третьяко́вскую галере́ю. А в декабре́ на́ша гру́ппа пое́дет в Петербу́рг.


    Ма́ма, ты пи́шешь, что па́па опя́ть лежи́т в посте́ли и не хо́дит на рабо́ту. Как он себя́ чу́вствует? Кака́я у него́ температу́ра? Скажи́ ему́, что ну́жно пить горя́чий чай с мёдом и бо́льше спать.


    Е́сли в декабре́ у меня́ бу́дет вре́мя, я пое́ду домо́й на два дня.


    Передава́й приве́т па́пе и ба́бушке.


    Твоя́ Да́ша

    :::

    '
  passage_zh: '亲爱的妈妈：


    对不起，我很久没写信了。十月我开始打工了：现在我在大学旁边的一家咖啡馆当服务员。我一个星期上三个晚上的班，回家很晚，一点儿时间都没有。不过你别担心：其他几天我每天晚上都在图书馆学习，昨天语法还得了五分。


    现在我换了一个房间。它比原来那间大，也更暖和。我的室友是一个北京来的女生。她跟我学俄语，我跟她学汉语。汉语比英语难得多，可是我觉得很有意思。晚上我们常常一起喝茶，用俄语和汉语聊天。


    你问我在莫斯科闷不闷。不闷！前几天我和室友去了特列季亚科夫画廊。十二月我们班还要去彼得堡。


    妈妈，你信里说爸爸又卧床了，没去上班。他觉得怎么样？体温多少度？告诉他要喝热的蜂蜜茶，多睡觉。


    要是十二月我有时间，我就回家待两天。


    代我向爸爸和奶奶问好。


    你的达莎

    '
  why: 第 1 题，推断题：信一开头道歉很久没写信，接着说她开始打工，每周三个晚上要上班到很晚，[у меня́ совсе́м нет вре́мени]{.ru}；信里没说她生病或回过家。第 2 题，信里说 [Я рабо́таю три ве́чера в неде́лю]{.ru}“一个星期上三个晚上的班”。第 3 题，[Она́ бо́льше, чем ста́рая, и в ней тепле́е]{.ru}，所以不是更小、更冷。第 4 题，[Она́ у́чит ру́сский язы́к, а я у неё — кита́йский]{.ru}，[у неё]{.ru} 指的是室友，达莎跟室友学汉语。第 5 题，推断题：爸爸卧床、不上班，达莎问他体温多少、让他喝蜂蜜茶多睡觉，可见爸爸病了。
