    zh: （天气）干燥，不下雨雪
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: '::: {.prose lang="ru"}

    **Тро́йка**


    Лю Ян пе́рвый год у́чится в Москве́. За контро́льную по грамма́тике он получи́л тро́йку и весь ве́чер сиде́л в ко́мнате гру́стный: в Кита́е лу́чшая оце́нка — сто, а три — э́то о́чень пло́хо.


    Его́ сосе́д Ко́ля спроси́л, что случи́лось. Лю Ян показа́л ему́ рабо́ту. Ко́ля засмея́лся: «Тро́йка — э́то не пло́хо! У нас оце́нки от одного́ до пяти́: пять — отли́чно, четы́ре — хорошо́, три — норма́льно, два — пло́хо. Едини́цу почти́ никогда́ не ста́вят. А я в шко́ле ча́сто получа́л тро́йки по ру́сскому — по своему́ родно́му языку́!»


    Лю Ян немно́го успоко́ился и всю неде́лю занима́лся грамма́тикой. За сле́дующую контро́льную он получи́л четвёрку. «Э́то хорошо́?» — спроси́л он Ко́лю. «Э́то о́чень хорошо́!» — отве́тил Ко́ля.

    :::

    '
  passage_zh: '**三分**


    刘洋在莫斯科读一年级。他语法测验得了三分，整个晚上坐在房间里闷闷不乐：在中国最高分是一百，三分可是很差的分数。


    室友科利亚问他怎么了。刘洋把卷子给他看。科利亚笑了：“三分不差！我们这儿分数从一分到五分：五分优秀，四分良好，三分及格，两分不及格。一分几乎从来不给。我上学的时候俄语课还常得三分呢——那可是我的母语！”


    刘洋心里好受了一点，整整一个星期都在用功学语法。下一次测验他得了四分。“这算好吗？”他问科利亚。“非常好！”科利亚回答。

    '
  why: 第 1 题，推断题：他是用中国的标准看分数的——[в Кита́е лу́чшая оце́нка — сто, а три — э́то о́чень пло́хо]{.ru}；他得的是三分不是两分，科利亚是后来才笑的。第 2 题，科利亚说 [три — норма́льно]{.ru}。第 3 题，[Едини́цу почти́ никогда́ не ста́вят]{.ru}：“几乎从来不给”就是很少给。第 4 题，科利亚说 [я в шко́ле ча́сто получа́л тро́йки по ру́сскому]{.ru}；俄语是他的母语，所以这句话是在安慰刘洋：三分连母语者也常得。第 5 题，推断题：第一次是三分，第二次是四分，所以写得比第一次好 [лу́чше]{.ru}；文中没有说写得快慢。
  items:
  - stem: Лю Ян был гру́стный, потому́ что ___.
    options:
    - он не написа́л контро́льную
    - он ду́мал, что тро́йка — о́чень плоха́я оце́нка
    - преподава́тель поста́вил ему́ два
    - Ко́ля смея́лся над ним
    answer: он ду́мал, что тро́йка — о́чень плоха́я оце́нка
  - stem: В Росси́и тро́йка — э́то ___ оце́нка.
    options:
    - норма́льная
    - отли́чная
    - о́чень плоха́я
    - ре́дкая
    answer: норма́льная
  - stem: О́чень ре́дко ста́вят ___.
    options:
    - пятёрку
    - тро́йку
    - едини́цу
    - дво́йку
    answer: едини́цу
  - stem: Ко́ля рассказа́л, что в шко́ле он ___.
    options:
    - всегда́ получа́л пятёрки по ру́сскому
    - учи́л кита́йский язы́к
    - не люби́л грамма́тику
    - ча́сто получа́л тро́йки по ру́сскому
    answer: ча́сто получа́л тро́йки по ру́сскому
  - stem: Сле́дующую контро́льную Лю Ян написа́л ___, чем пе́рвую.
    options:
    - ху́же
    - быстре́е
    - лу́чше
    - ме́дленнее
    answer: лу́чше
  glossary:
  - ru: случи́лось
    zh: 发生了（случи́ться 的过去时）
  - ru: едини́ца
    pos: f
    zh: （分数）一分
  - ru: четвёрка
    pos: f
    zh: （分数）四分
  - ru: родно́й язы́к
    zh: 母语
  - ru: успоко́ился
    zh: 平静下来（успоко́иться 的过去时）
  - ru: никогда́ не
    zh: 从来不
  - ru: дво́йка
    pos: f
    zh: （分数）两分
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: '::: {.prose lang="ru"}

    **Шарф**


    Я всегда́ (1) []{.blank} (встава́ть) ра́но и, когда́ (2) []{.blank} (за́втракать), смотрю́ прогно́з пого́ды. Вчера́ в прогно́зе сказа́ли, что днём (3) []{.blank} (быть) си́льный ве́тер и снег. Но я спеши́л в бассе́йн и забы́л шарф в (4) []{.blank} (своя́ ко́мната).


    По́сле бассе́йна во́лосы у меня́ бы́ли мо́крые, а на у́лице (5) []{.blank} (идти́) снег. Пока́ я шёл домо́й, я си́льно (6) []{.blank} (замёрзнуть).


    Сего́дня у меня́ (7) []{.blank} (боле́ть) голова́. Я позвони́л своему́ преподава́телю (8) []{.blank} (Па́вел Андре́евич) и сказа́л, что на уро́ке не бу́ду. Ба́бушка всегда́ говори́т: «Горя́чий чай с мёдом (9) []{.blank} (хорошо́), чем любо́е лека́рство». Вот я и пью чай с мёдом. Е́сли за́втра мне (10) []{.blank} (быть) пло́хо, вы́зову врача́. А шарф тепе́рь беру́ всегда́.

    :::

    '
  passage_zh: '**围巾**


    我一向起得早，吃早饭的时候总要看看天气预报。昨天预报说，白天会刮大风、下雪。可我急着去游泳馆，把围巾忘在了自己房间里。


    游完泳我头发还湿着，外面又下着雪。走回家这一路，我冻坏了。


    今天我头疼。我给我的老师帕维尔·安德烈耶维奇打了电话，说我不能去上课了。奶奶总说：“热茶加蜂蜜比什么药都管用。”所以我现在就喝着蜂蜜茶。要是明天还不舒服，我就叫医生。围巾嘛，现在我出门总带着。

    '
  why: 第 1 空：[всегда́]{.ru} 说经常的动作，用现在时，[встава́ть]{.ru} 去掉 [-ва-]{.ru}：[встаю́]{.ru}（第 81 课）。第 2 空：和主句的 [смотрю́]{.ru} 同时进行，用未完成体现在时 [за́втракаю]{.ru}（第 82 课）。第 3 空：预报说的是将来的风雪 [бу́дет си́льный ве́тер]{.ru}，转述时时不变，仍用 [бу́дет]{.ru}；主语 [ве́тер и снег]{.ru} 在动词后面，动词常跟最近的 [ве́тер]{.ru} 用单数，写复数 [бу́дут]{.ru} 也对（第 83、88 课）。第 4 空：[в]{.ru} 表示处所（[где]{.ru}），要求第六格；[своя́]{.ru} 按阴性形容词变，第六格 [свое́й]{.ru}，[ко́мната]{.ru} 第六格 [ко́мнате]{.ru}。注意不要写成第四格 [свою́ ко́мнату]{.ru}，那是回答 [куда́]{.ru} 的（第 19、87 课）。第 5 空：下雪用 [идти́]{.ru}，过去时阳性 [шёл]{.ru}，跟 [снег]{.ru} 一致（第 69、71 课）。第 6 空：[замёрзнуть]{.ru} 的过去时阳性没有 [-л]{.ru}：[замёрз]{.ru}（第 83 课）。第 7 空：身体部位疼用 [боли́т]{.ru}，跟 [голова́]{.ru} 一致（第 85 课）。第 8 空：[звони́ть]{.ru} 要求第三格，名字和父称都要变，和前面的 [своему́ преподава́телю]{.ru} 一致；[Па́вел]{.ru} 变格时 [е]{.ru} 脱落：[Па́влу Андре́евичу]{.ru}（第 51 课）。第 9 空：后面有 [чем]{.ru}，用比较级 [лу́чше]{.ru}（第 86 课）。第 10 空：[е́сли]{.ru} 从句说将来，用将来时；无人称句 [мне пло́хо]{.ru} 的将来时是 [мне бу́дет пло́хо]{.ru}（第 58、83 课）。
