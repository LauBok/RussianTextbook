- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Чужо́й зонт**

    В четве́рг ве́чером мы с (1) []{.blank} сиде́ли в ма́леньком кафе́ у метро́. На у́лице шёл дождь, (2) []{.blank} у две́ри стоя́ло мно́го мо́крых (3) []{.blank}. Свой зонт я то́же поста́вила (4) []{.blank}.

    Мы пи́ли чай и разгова́ривали два (5) []{.blank}. Когда́ мы вста́ли, я взяла́ у две́ри чёрный зонт, и мы пошли́ к метро́. Дождь уже́ (6) []{.blank}, и зонт я не открыва́ла.

    До́ма я откры́ла мо́крый зонт и поста́вила его́ в ва́нной. И тут я уви́дела, что зонт не мой. Он был чёрный, как мой, но гора́здо (7) []{.blank}, а на ру́чке (8) []{.blank} этике́тка с (9) []{.blank} телефо́на. Я позвони́ла.

    — До́брый ве́чер! Извини́те, что так (10) []{.blank} звоню́. Ка́жется, сего́дня в кафе́ у метро́ я взяла́ ваш зонт (11) []{.blank} своего́.

    — Мой? Сейча́с посмотрю́… — Че́рез мину́ту он засмея́лся. — Зна́ете, моего́ зонта́ в прихо́жей действи́тельно нет. Там стои́т (12) []{.blank} — ма́ленький, (13) []{.blank}. Наве́рное, (14) []{.blank}?

    Он спроси́л, могу́ (15) []{.blank} я за́втра в семь часо́в быть в том же кафе́. Я сказа́ла, что могу́.

    Когда́ я вошла́ в кафе́, он уже́ сиде́л за (16) []{.blank} у окна́. Он дал мне мой зонт, а я ему́ — (17) []{.blank}. Он рассказа́л, что (18) []{.blank} забыва́ет зонт в метро́ и в магази́нах, поэ́тому и сде́лал для (19) []{.blank} зонта́ этике́тку с телефо́ном.

    В суббо́ту я купи́ла но́вый зонт — (20) []{.blank}.
    :::
  glossary:
  - {ru: ру́чка, zh: 新义：（伞的）把手}
  - {ru: забыва́ть, zh: 忘记，落下（забы́ть 的未完成体）}
  passage_zh: |
    **别人的伞**

    星期四晚上，我和女朋友坐在地铁站旁边的一家小咖啡馆里。外面下着雨，所以门口放着很多湿漉漉的伞。我也把自己的伞放在了那儿。

    我们喝着茶，聊了两个小时。我们起身的时候，我从门口拿了一把黑伞，然后我们去了地铁站。雨已经停了，我一直没打开伞。

    到家后，我把湿伞撑开放在浴室里。这时我才发现这不是我的伞。它跟我的一样是黑色的，可是大得多，伞把上还挂着一个写着电话号码的标签。我打了这个电话。

    “晚上好！对不起，这么晚给您打电话。我今天在地铁站旁边的咖啡馆里好像把您的伞当成自己的拿走了。”

    “我的伞？我看看……”过了一会儿，他笑了起来，“您知道吗，我的伞确实不在门厅里。那儿放着一把别人的伞，小小的，黑色的。大概是您的吧？”

    他问我明天七点能不能到那家咖啡馆去。我说能。

    我走进咖啡馆的时候，他已经坐在靠窗的小桌旁了。他把我的伞还给我，我把他的伞还给他。他说他常常把伞忘在地铁里、商店里，所以给自己的伞做了一个写着电话号码的标签。

    星期六我买了一把新伞——红色的。
  why: >-
    第 1 空：“我和某人”是 [мы с]{.ru} + 第五格：[мы с подру́гой]{.ru}；[подру́ге]{.ru} 是第三、六格，[подру́гу]{.ru} 是第四格，都不跟 [с]{.ru} 表示“和”（第 62 课）。第 2 空：前面下雨是原因，后面门口有很多湿伞是结果，用 [поэ́тому]{.ru}；[потому́ что]{.ru} 后面要接原因，[но]{.ru}、[е́сли]{.ru} 不表示因果（第 84 课）。第 3 空：[мно́го]{.ru} 后面的名词用复数第二格，[мо́крых]{.ru} 也是复数第二格：[зонто́в]{.ru}；[зонты́]{.ru} 是第一格（第 32、35 课）。第 4 空：[поста́вила]{.ru} 回答 [куда́]{.ru}，用 [туда́]{.ru}；[там]{.ru}、[тут]{.ru} 回答 [где]{.ru}，[отту́да]{.ru} 是“从那儿”（第 24、74 课）。第 5 空：[два]{.ru} 后面用单数第二格 [часа́]{.ru}；[часо́в]{.ru} 用在 5 以上（第 28、35 课）。第 6 空：后半句说“我一直没打开伞”，说明雨已经停了：[ко́нчился]{.ru}；[начался́]{.ru}、[шёл]{.ru} 和不打伞矛盾，[идёт]{.ru} 是现在时，和过去的叙述不配（第 82 课）。第 7 空：下文那位先生说他家里放着的那把伞 [ма́ленький]{.ru}，那是“我”的伞，所以拿错的这把比“我”的大：[бо́льше]{.ru}；选 [ме́ньше]{.ru} 的人没有读到后文，[ра́ньше]{.ru}、[по́зже]{.ru} 说的是时间（第 86 课）。第 8 空：标签挂在伞把上，用 [висе́ла]{.ru}；[лежа́ла]{.ru}、[стоя́ла]{.ru}、[сиде́ла]{.ru} 都不能说挂着的东西（第 66 课）。第 9 空：[с]{.ru} 表示“带着……的”，要第五格：[с но́мером]{.ru}（第 61 课）。第 10 空：“我”是星期四晚上在咖啡馆坐了两个小时、回家后才打的电话，时间已经很晚，打电话的人先为此道歉：[так по́здно]{.ru}；[ра́но]{.ru} 不合时间，[ча́сто]{.ru}、[до́лго]{.ru} 不合“刚打第一个电话”的情况。第 11 空：拿了他的伞“代替”自己的伞，[вме́сто]{.ru} + 第二格 [своего́]{.ru}；[без]{.ru}、[для]{.ru}、[о́коло]{.ru} 意思不通（第 45 课）。第 12 空：他自己的伞不在，门厅里放着的是别人的伞：[чужо́й]{.ru}；[свой]{.ru}、[мой]{.ru} 和前半句“我的伞确实不在”矛盾，[но́вый]{.ru} 他无从知道（第 87 课）。第 13 空：前文说拿错的伞 [чёрный, как мой]{.ru}，“我”的伞也是黑的：[чёрный]{.ru}；正因为两把都是黑伞，两个人才都拿错了（全文理解）。第 14 空：他和“我”素不相识，称对方用 [вы]{.ru}，“您的”是 [ваш]{.ru}；[твой]{.ru} 对陌生人不礼貌，[свой]{.ru} 不能单独这样问（第 4、8 课）。第 15 空：转述一般疑问句“你能不能……”，用 [ли]{.ru}，放在被问的词 [могу́]{.ru} 后面；[е́сли]{.ru} 是“如果”，不能引出间接疑问（第 89 课）。第 16 空：[за]{.ru} 表示位置“在……旁”，要第五格：[за сто́ликом]{.ru}；[сто́лике]{.ru} 是第六格（第 66 课）。第 17 空：主语是 [я]{.ru}，[свой]{.ru} 会理解成“我自己的伞”，这里要说的是“他的伞”，用 [его́]{.ru}；[ему́]{.ru}、[им]{.ru} 是人称代词的第三、五格，不表示所属（第 87 课）。第 18 空：后面说“所以做了标签”，原因只能是他常常丢伞：[ча́сто]{.ru}；[ре́дко]{.ru} 推不出要做标签，[вчера́]{.ru}、[одна́жды]{.ru} 和现在时 [забыва́ет]{.ru} 不配（第 25、45 课）。第 19 空：从句的主语是 [он]{.ru}，他给自己的伞做标签，用 [свой]{.ru}，[для]{.ru} 要第二格：[своего́]{.ru}；[его́ зонта́]{.ru} 会理解成另一个人的伞，[свой]{.ru} 是第一格（第 87 课）。第 20 空：两个人都是因为黑伞太多才拿错的，“我”买新伞自然要买不容易认错的颜色：[кра́сный]{.ru}；[чёрный]{.ru} 正是出错的原因，[ста́рый]{.ru} 和 [но́вый]{.ru} 矛盾，[чужо́й]{.ru} 不合文意（全文理解）。
