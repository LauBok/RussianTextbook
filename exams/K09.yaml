    | суббо́та | си́льный моро́з | −15 |
    | воскресе́нье | снег, си́льный ве́тер | −10 |

    В понеде́льник и во вто́рник не забу́дьте взять зонт. В сре́ду и в четве́рг на у́лице бу́дет мо́кро, в го́роде бу́дут про́бки. Е́сли вы е́здите на рабо́ту на маши́не, лу́чше пое́хать на метро́.

    В суббо́ту бу́дет си́льный моро́з. Е́сли вы пойдёте гуля́ть, наде́ньте тёплую ку́ртку, ша́пку, шарф и перча́тки. Е́сли у вас ка́шель и́ли температу́ра, лу́чше сиди́те до́ма.
