    **一周天气预报：莫斯科，十一月**

    | | 天气 | 气温（度） |
    |---|---|---|
    | 星期一 | 雨，有风 | +3 |
    | 星期二 | 雨 | +2 |
    | 星期三 | 雪，有风 | 0 |
    | 星期四 | 雨夹雪 | −1 |
    | 星期五 | 无雨无风 | −5 |
    | 星期六 | 严寒 | −15 |
    | 星期天 | 雪，大风 | −10 |

    星期一和星期二别忘了带伞。星期三和星期四外面湿滑，城里会堵车。要是您开车上班，最好改坐地铁。

    星期六严寒。要是您出去散步，请穿上暖和的外套，戴上帽子、围巾和手套。要是您咳嗽或者发烧，最好待在家里。
  why: 第 1 题，表里只有星期一、星期二是单纯的雨，正文也说这两天要带伞；星期四是雨夹雪。第 2 题，推断题：没有雨、没有风、也不是严寒的只有星期五（−5 度，[без дождя́ и без ве́тра]{.ru}）；星期六严寒，星期天有大风。第 3 题，表里星期三是 0 度，[ноль гра́дусов]{.ru}。第 4 题，推断题：星期三、星期四路上湿、堵车，正文建议开车的人改坐地铁，所以这两天坐地铁更好。第 5 题，[Е́сли у вас ка́шель и́ли температу́ра, лу́чше сиди́те до́ма]{.ru}，说的是星期六严寒的时候。
