lesson: K09
heading: 第九套
range: L01-L89
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[уви́деть]{.ru} 后面用第四格，[си́ний]{.ru} 是软变化形容词，阴性第四格 [си́нюю]{.ru}；[си́нее]{.ru} 是中性第一格（第 23 课）。第 2 题：[ча́сто]{.ru} 表示经常往返，坐电气火车去用 [е́здить]{.ru}：[е́здим]{.ru}；[е́дем]{.ru} 是此刻正在去，[хо́дим]{.ru} 是步行（第 25 课）。第 3 题：“某人不在”用 [не́ было]{.ru} + 第二格，[А́нна]{.ru} 的第二格是 [А́нны]{.ru}（第 32 课）。第 4 题：说从哪个国家来用 [из]{.ru} + 第二格：[из Фра́нции]{.ru}；[с]{.ru} 配用 [на]{.ru} 的地点，[от]{.ru} 配人（第 36 课）。第 5 题：[напро́тив]{.ru} 要求第二格 [по́чты]{.ru}（第 37 课）。第 6 题：未完成体将来时用 [быть]{.ru} 的将来时加不定式，主语 [я]{.ru} 用 [бу́ду]{.ru}（第 41 课）。第 7 题：回答 [Да, вот послу́шай!]{.ru} 说明诗已经背会了，要的是结果，用完成体过去时 [вы́учил]{.ru}；[учи́л]{.ru} 只说背过、学过，不说背会没有（第 42、44 课）。第 8 题：请对方做一次具体的事，用完成体命令式；对米沙说 [ты]{.ru}，用 [откро́й]{.ru}（第 46 课）。第 9 题：“在几月”用 [в]{.ru} + 第六格：[в ма́е]{.ru}（第 48 课）。第 10 题：给谁买，对象用第三格，形容词阳性第三格 [-ему]{.ru}：[мла́дшему бра́ту]{.ru}（第 56 课）。第 11 题：[интересова́ться]{.ru} 要求第五格 [футбо́лом]{.ru}（第 63 课）。第 12 题：[с]{.ru} + 第五格，物主代词阳性第五格 [мои́м]{.ru}，和后面的 [ста́рым дру́гом]{.ru} 一致（第 65 课）。第 13 题：[с … до …]{.ru} 中 [до]{.ru} 要求第二格 [ве́чера]{.ru}，和 [с утра́]{.ru} 对应（第 68 课）。第 14 题：问的是明天，回答将来的一次出行用 [пое́ду]{.ru}；[е́здил]{.ru}、[пое́хал]{.ru} 是过去时，[е́зжу]{.ru} 表示经常去（第 73 课）。第 15 题：[кото́рый]{.ru} 指前面的 [музе́й]{.ru}，阳性单数；它在从句里作 [нра́вится]{.ru} 的主语，用第一格 [кото́рый]{.ru}（第 79 课）。第 16 题：[обы́чно]{.ru} 说经常的动作，用未完成体现在时；[встава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[встаю́]{.ru}；[вста́ну]{.ru} 是完成体将来时，后半句才用（第 81 课）。第 17 题：米沙自己穿衣服，用带 [-ся]{.ru} 的 [одева́ется]{.ru}；[одева́ет]{.ru} 要有宾语，给别人穿（第 81 课）。第 18 题：[всегда́]{.ru} 和主句的现在时 [слу́шаю]{.ru} 说的是经常同时进行的两件事，从句也用未完成体现在时 [за́втракаю]{.ru}（第 82 课）。第 19 题：[е́сли]{.ru} 说将来的条件，从句也用将来时；没有别的动词时 [бу́дет]{.ru} 不能省，[пого́да]{.ru} 是单数，用 [бу́дет]{.ru}（第 83 课）。第 20 题：前半句是原因，后半句是结果，用 [поэ́тому]{.ru}“所以”；[потому́ что]{.ru} 后面要接原因，这里接的是结果（第 84 课）。第 21 题：“哪里疼”用 [боле́ть]{.ru} 的第二个意思，只有第三人称 [боли́т, боля́т]{.ru}，跟身体部位一致，[го́рло]{.ru} 是单数，用 [боли́т]{.ru}；[боле́ет]{.ru} 是“生病”，主语是人（第 85 课）。第 22 题：“好多了”用比较级 [лу́чше]{.ru}，[температу́ры уже́ нет]{.ru} 说明身体变好了；[ху́же]{.ru} 意思相反（第 86 课）。第 23 题：家是主语皮埃尔自己的，第三人称用 [свой]{.ru}，[о]{.ru} 要求第六格，阴性 [свое́й]{.ru}；[о его́ семье́]{.ru} 会理解成别人的家（第 87 课）。第 24 题：转述安娜的话，人称从“我”改成“她”，用第三人称 [позвони́т]{.ru}；[за́втра]{.ru} 说明是将来时，时不变（第 88 课）。第 25 题：一般疑问句转述时用 [ли]{.ru}，[ли]{.ru} 紧跟在被问的词后面：[сде́лали ли мы]{.ru}；[ли]{.ru} 不放在从句开头，也不能用 [е́сли]{.ru} 代替（第 89 课）。
  items:
  - stem: В магази́не А́нна уви́дела ___ су́мку.
    options: [си́няя, си́ней, си́нее, си́нюю]
    answer: си́нюю
  - stem: Ле́том мы ча́сто ___ на да́чу на электри́чке.
    options: [е́дем, хо́дим, е́здим, идём]
    answer: е́здим
  - stem: Вчера́ ве́чером ___ не́ было до́ма.
    options: [А́нна, А́нны, А́нну, А́нне]
    answer: А́нны
  - stem: — Отку́да ты, Пьер? — Я ___ Фра́нции.
    options: [из, с, от, у]
    answer: из
  - stem: Апте́ка нахо́дится напро́тив ___.
    options: [по́чта, по́чты, по́чту, по́чте]
    answer: по́чты
  - stem: За́втра ве́чером я ___ чита́ть рома́н.
    options: [бу́дет, бу́дешь, бу́ду, был]
    answer: бу́ду
  - stem: — Ми́ша, ты уже́ ___ стихи́? — Да, вот послу́шай!
    options: [учи́л, у́чишь, вы́учишь, вы́учил]
    answer: вы́учил
  - stem: Ми́ша, ___ окно́, здесь о́чень жа́рко!
    options: [откро́й, открыва́ть, откры́л, откро́ет]
    answer: откро́й
  - stem: Мой день рожде́ния в ___.
    options: [май, ма́е, ма́я, ма́ю]
    answer: ма́е
  - stem: Вчера́ я купи́л ___ футбо́льный мяч.
    options: [мла́дший брат, мла́дшим бра́том, мла́дшего бра́та, мла́дшему бра́ту]
    answer: мла́дшему бра́ту
  - stem: Ми́ша о́чень интересу́ется ___.
    options: [футбо́лом, футбо́л, футбо́ла, футбо́лу]
    answer: футбо́лом
  - stem: Вчера́ я до́лго разгова́ривал с ___ ста́рым дру́гом.
    options: [мой, моего́, мои́м, моему́]
    answer: мои́м
  - stem: Мари́я Никола́евна рабо́тает с утра́ до ___.
    options: [ве́чер, ве́чера, ве́чером, ве́чере]
    answer: ве́чера
  - stem: — Что ты бу́дешь де́лать за́втра? — ___ на да́чу к ба́бушке.
    options: [Е́здил, Пое́хал, Пое́ду, Е́зжу]
    answer: Пое́ду
  - stem: Вот музе́й, ___ мне о́чень нра́вится.
    options: [кото́рая, кото́рое, кото́рые, кото́рый]
    answer: кото́рый
  - stem: Обы́чно я ___ в семь часо́в, а за́втра вста́ну в шесть.
    options: [встаю́, вста́ну, встава́л, встаёт]
    answer: встаю́
  - stem: У́тром Ми́ша умыва́ется, ___ и за́втракает.
    options: [одева́ет, одева́ется, одева́ются, одева́ть]
    answer: одева́ется
  - stem: Когда́ я ___, я всегда́ слу́шаю ра́дио.
    options: [поза́втракаю, поза́втракал, за́втракаю, за́втракал]
    answer: за́втракаю
  - stem: Е́сли в суббо́ту ___ хоро́шая пого́да, мы пойдём в парк.
    options: [есть, была́, бу́дут, бу́дет]
    answer: бу́дет
  - stem: Вчера́ шёл си́льный дождь, ___ мы не пое́хали на да́чу.
    options: [поэ́тому, потому́ что, е́сли, когда́]
    answer: поэ́тому
  - stem: У Ю́ми ___ го́рло, и она́ не мо́жет говори́ть.
    options: [боля́т, боле́ет, боле́ют, боли́т]
    answer: боли́т
  - stem: Мне сего́дня гора́здо ___, чем вчера́, температу́ры уже́ нет.
    options: [ху́же, бо́льше, лу́чше, ме́ньше]
    answer: лу́чше
  - stem: Пьер ча́сто расска́зывает о ___ семье́.
    options: [свое́й, его́, своя́, свою́]
    answer: свое́й
  - stem: — Что сказа́ла А́нна? — Она́ сказа́ла, что ___ тебе́ за́втра.
    options: [позвоню́, позвони́т, позвони́ла, позвони́шь]
    answer: позвони́т
  - stem: О́льга Ви́кторовна спроси́ла, ___ мы упражне́ние.
    options: [ли сде́лали, е́сли сде́лали, сде́лали ли, что сде́лали]
    answer: сде́лали ли
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Ю́ми заболе́ла**

    В понеде́льник Ю́ми не́ было (1) []{.blank}. О́льга Ви́кторовна спроси́ла нас, (2) []{.blank} Ю́ми, но мы не зна́ли. По́сле заня́тий я позвони́л (3) []{.blank}. Ю́ми отве́тила (4) []{.blank}:

    — Я заболе́ла. Вчера́ я до́лго гуля́ла (5) []{.blank}, а на у́лице был моро́з.

    — Что у тебя́ (6) []{.blank}?

    — Голова́ и го́рло. И температу́ра (7) []{.blank}.

    — Тебе́ на́до лежа́ть в (8) []{.blank}.

    — Я зна́ю. Е́сли за́втра температу́ра (9) []{.blank} высо́кая, я вы́зову врача́. А что бы́ло на уро́ке?

    Я сказа́л, что в сре́ду (10) []{.blank} контро́льная.

    — Ой! А я ещё не (11) []{.blank}!

    — Не волну́йся. Ве́чером я позвоню́ А́нне. Она́ даст тебе́ (12) []{.blank} тетра́дь. У неё по́черк (13) []{.blank}, чем у меня́.

    Пото́м я позвони́л А́нне и (14) []{.blank} ей о Ю́ми. А́нна сказа́ла, что за́втра (15) []{.blank} к Ю́ми. По доро́ге она́ (16) []{.blank} в апте́ке лека́рство, а до́ма возьмёт мёд. Е́сли Ю́ми бу́дет пить чай с (17) []{.blank}, она́ ско́ро бу́дет (18) []{.blank}.

    В пя́тницу Ю́ми уже́ была́ на уро́ке. О́льга Ви́кторовна спроси́ла её, есть ли у неё (19) []{.blank}. Пото́м была́ контро́льная. Она́ была́ (20) []{.blank}, и Ю́ми получи́ла пятёрку.
    :::
  passage_zh: |
    **由美病了**

    星期一由美没来上课。奥尔加·维克托罗夫娜问我们由美在哪儿，可是我们不知道。下课后我给她打了电话。由美声音很虚弱地回答：

    “我病了。昨天我没戴帽子在外面走了很久，外面又很冷。”

    “你哪儿疼？”

    “头和嗓子。还发高烧。”

    “你得卧床休息。”

    “我知道。要是明天还发高烧，我就请医生来。课上讲了什么？”

    我说星期三有测验。

    “哎呀！我还没准备好呢！”

    “别着急。晚上我给安娜打电话。她会把自己的本子给你。她的字比我的好。”

    然后我给安娜打了电话，跟她说了由美的事。安娜说明天她去由美那儿。路上她会在药店买药，再从家里带上蜂蜜。由美要是喝蜂蜜茶，很快就会好的。

    星期五由美已经来上课了。奥尔加·维克托罗夫娜问她有没有病假证明。然后是测验。测验不难，由美得了五分。
  why: 第 1 空：“在课上”回答 [где]{.ru}，[уро́к]{.ru} 和 [на]{.ru} 连用，用第六格 [на уро́ке]{.ru}；[на уро́к]{.ru} 是方向，不能说 [в уро́ке]{.ru}（第 11、12 课）。第 2 空：转述“由美在哪儿？”，保留疑问词 [где]{.ru}；[ли]{.ru} 用于不带疑问词的问句（第 88 课）。第 3 空：[звони́ть]{.ru} 给谁打电话用第三格，[она́]{.ru} 的第三格是 [ей]{.ru}（第 51、52 课）。第 4 空：“用……声音”是工具，用第五格 [сла́бым го́лосом]{.ru}（第 61、65 课）。第 5 空：后面说外面很冷，她才病了，所以是没戴帽子：[без]{.ru} + 第二格 [без ша́пки]{.ru}；[в ша́пке]{.ru} 和得病的原因对不上（第 37 课）。第 6 空：“哪里疼”用 [боли́т]{.ru}，问句里用单数；[боле́ет]{.ru} 的主语是人（第 85 课）。第 7 空：[температу́ра]{.ru} 是阴性，形容词作谓语用阴性 [высо́кая]{.ru}（第 9、85 课）。第 8 空：[в]{.ru} + 第六格表示处所，[посте́ль]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，第六格 [посте́ли]{.ru}（第 11、83 课）。第 9 空：[е́сли]{.ru} 说将来的条件，从句用将来时 [бу́дет]{.ru}，主语 [температу́ра]{.ru} 是单数（第 83 课）。第 10 空：测验在星期三，还没到，原话 [бу́дет]{.ru} 转述时时不变（第 88 课）。第 11 空：说话人由美是女性，短尾形容词用阴性 [гото́ва]{.ru}（第 89 课）。第 12 空：本子是主语安娜自己的，用 [свой]{.ru}，阴性第四格 [свою́]{.ru}；[её]{.ru} 在这里会被理解成别人的（第 87 课）。第 13 空：后面有 [чем у меня́]{.ru}，要用比较级 [лу́чше]{.ru}（第 86 课）。第 14 空：打完电话把事情说了，是一次的结果，和前面的 [позвони́л]{.ru} 一样用完成体 [рассказа́л]{.ru}（第 44、45 课）。第 15 空：[за́втра]{.ru} 说明是将来的一次出行，安娜的原话是 [пое́ду]{.ru}，转述成 [пое́дет]{.ru}（第 73、88 课）。第 16 空：说的是明天路上要做的一件事，用完成体将来时 [ку́пит]{.ru}，和后面的 [возьмёт]{.ru} 一致（第 43、76 课）。第 17 空：[с]{.ru} + 第五格表示“加了……的”，[мёд]{.ru} 的第五格是 [мёдом]{.ru}（第 61 课）。第 18 空：由美是女性，短尾形容词用阴性 [здоро́ва]{.ru}；[бу́дет здоро́вая]{.ru} 不说（第 59、84 课）。第 19 空：[есть ли у неё]{.ru} 后面的东西用第一格作主语：[спра́вка]{.ru}（第 31、84、89 课）。第 20 空：[контро́льная]{.ru} 是阴性，谓语形容词也用阴性 [нетру́дная]{.ru}（第 89 课）。
  items:
  - options: [на уро́к, в уро́ке, на уро́ка, на уро́ке]
    answer: на уро́ке
  - options: [где, куда́, отку́да, ли]
    answer: где
  - options: [её, ей, она́, ней]
    answer: ей
  - options: [сла́бый го́лос, сла́бого го́лоса, сла́бым го́лосом, сла́бому го́лосу]
    answer: сла́бым го́лосом
  - options: [без ша́пки, без ша́пку, в ша́пке, с ша́пки]
    answer: без ша́пки
  - options: [боле́ет, боли́т, боля́т, боле́ешь]
    answer: боли́т
  - options: [высо́кий, высо́кое, высо́кую, высо́кая]
    answer: высо́кая
  - options: [посте́ль, посте́лью, посте́ли, крова́ть]
    answer: посте́ли
  - options: [есть, бу́дет, была́, бу́дут]
    answer: бу́дет
  - options: [бу́дет, была́, есть, бы́ло]
    answer: бу́дет
  - options: [гото́в, гото́вы, гото́во, гото́ва]
    answer: гото́ва
  - options: [её, свой, своя́, свою́]
    answer: свою́
  - options: [хоро́ший, лу́чше, хорошо́, бо́льше]
    answer: лу́чше
  - options: [расска́зывал, расскажу́, рассказа́л, расска́зываю]
    answer: рассказа́л
  - options: [пое́дет, пое́хала, е́здила, е́здит]
    answer: пое́дет
  - options: [покупа́ет, ку́пит, купи́ла, покупа́ла]
    answer: ку́пит
  - options: [мёдом, мёд, мёда, мёде]
    answer: мёдом
  - options: [здоро́в, здоро́вы, здоро́вая, здоро́ва]
    answer: здоро́ва
  - options: [спра́вки, спра́вку, спра́вка, спра́вкой]
    answer: спра́вка
  - options: [нетру́дный, нетру́дную, нетру́дное, нетру́дная]
    answer: нетру́дная
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ти́хое у́тро**

    В сре́ду ве́чером Ми́ша до́лго игра́л в компью́тер. Ма́ма сказа́ла ему́: «Ми́ша, пора́ спать!» Но он игра́л ещё три часа́.

    У́тром Ми́ша откры́л глаза́: уже́ во́семь часо́в! А уро́ки в шко́ле начина́ются в во́семь три́дцать. Он бы́стро встал и да́же не поза́втракал: то́лько вы́пил воды́ и пошёл в шко́лу.

    На у́лице бы́ло ти́хо. Обы́чно у́тром здесь шу́мно: лю́ди спеша́т на рабо́ту, шко́льники иду́т в шко́лу, на остано́вке стоя́т лю́ди. А сего́дня Ми́ша шёл оди́н. Шёл снег, и на у́лице бы́ло ещё темно́. Когда́ он шёл ми́мо магази́на, он заме́тил, что магази́н не рабо́тает. «Наве́рное, там ремо́нт», — ду́мал Ми́ша.

    В шко́ле бы́ло темно́ и ти́хо. Ми́ша до́лго стоя́л пе́ред две́рью и не понима́л, что случи́лось. Пото́м он позвони́л па́пе.

    Ива́н Серге́евич засмея́лся:

    — Ми́ша, сего́дня четвёртое ноября́, День наро́дного еди́нства! Сего́дня пра́здник, поэ́тому шко́лы и мно́гие магази́ны не рабо́тают. Я говори́л об э́том вчера́ за у́жином.

    — Почему́ я не по́мню?

    — Потому́ что ты игра́л в компью́тер и не слы́шал меня́.

    Ми́ша верну́лся домо́й. На ку́хне ма́ма гото́вила блины́. «Почему́ ты не спишь? — спроси́ла она́. — Сего́дня пра́здник!» Ми́ша поза́втракал и опя́ть пошёл спать.
    :::
  passage_zh: |
    **安静的早晨**

    星期三晚上米沙玩了很久的电脑。妈妈对他说：“米沙，该睡觉了！”可他又玩了三个小时。

    早上米沙睁开眼睛：已经八点了！学校八点半上课。他飞快地起床，连早饭都没吃，只喝了点儿水就去学校了。

    街上很安静。平时早上这里很热闹：人们急着去上班，学生去上学，车站上站着人。可今天米沙一个人走着。下着雪，外面天还黑。他经过商店的时候，发现商店不开门。“大概在装修。”他想。

    学校里又黑又静。米沙在门前站了很久，不明白发生了什么事。后来他给爸爸打了电话。

    伊万·谢尔盖耶维奇笑了起来：

    “米沙，今天是十一月四日，民族团结日！今天过节，所以学校和很多商店都不开门。昨天吃晚饭的时候我说过这件事。”

    “我怎么不记得？”

    “因为你在玩电脑，没听见我说话。”

    米沙回到家。妈妈正在厨房里做薄饼。“你怎么不睡了？”她问，“今天过节呀！”米沙吃了早饭，又去睡觉了。
  why: '第 1 题，[У́тром Ми́ша откры́л глаза́: уже́ во́семь часо́в!]{.ru}，接着他马上起床；八点半是上课时间。第 2 题，推断题：八点醒来、八点半上课，他以为要迟到了，所以连早饭都没吃；原文没说他不想吃，妈妈后来还做了薄饼。第 3 题，[Обы́чно у́тром здесь шу́мно]{.ru}；[ти́хо]{.ru} 是今天的情况。第 4 题，推断题：爸爸说今天是民族团结日，[Сего́дня пра́здник, поэ́тому шко́лы … не рабо́тают]{.ru}；米沙以为商店在装修，那只是他的猜测。第 5 题，推断题：爸爸昨天晚饭时说过，可米沙 [игра́л в компью́тер и не слы́шал]{.ru}，所以不知道过节。'
