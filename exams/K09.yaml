  - {ru: дневни́к, pos: m, zh: 日记}
  passage_zh: |
    **日记摘抄**

    **星期一。**六点起床，去公园滑雪。那儿天还黑，也冷，可是已经有一位老太太在滑了。我滑了一个小时，后来腿疼了一整天。

    **星期二。**早上下雨夹雪，我待在家里。要是明天还下雨夹雪，我就晚上去。

    **星期三。**在公园里我又看见了那位老太太。她大概有七十岁了，可是滑得比我好。

    **星期四。**今天我和她聊了几句。我问她是不是每天都滑。她说是的，她已经滑了二十年了。

    **星期五。**没去滑，明天大概也去不了：我浑身都疼，腿疼，背也疼。

    **星期六。**还是去了。那位老太太问我昨天怎么没来。我说我浑身疼。她笑了，说一开始要少滑一点儿：不是滑一个小时，而是半个小时。我试试吧。
  why: >-
    第 1 空：[бы́ло ещё темно́ и …]{.ru} 是无人称句，和 [темно́]{.ru} 并列，要用以 [-о]{.ru} 结尾的谓语副词：[хо́лодно]{.ru}，注意重音移到了第一个音节；写成 [холо́дный]{.ru} 或中性形容词 [холо́дное]{.ru} 都不对，这里没有被修饰的名词（第 58 课）。第 2 空：疼的是复数的 [но́ги]{.ru}，说的是星期一那天的事，用过去时复数：[боле́ли]{.ru}；只看前面的 [у меня́]{.ru} 会写成 [боле́ло]{.ru}，写成现在时 [боля́т]{.ru} 和“那天疼了一整天”对不上（第 85 课）。第 3 空：[е́сли]{.ru} 说的是明天的事，从句用将来时：[бу́дет]{.ru}；照汉语“要是明天也下”用现在时是常见错误（第 83 课）。第 4 空：[ви́деть]{.ru} 要第四格，阴性的 [та же же́нщина]{.ru} 中 [та]{.ru} 和 [же́нщина]{.ru} 都变：[ту же же́нщину]{.ru}；[же]{.ru} 是语气词，不变（第 81 课）。第 5 空：[мы с]{.ru} + 第五格表示“我和某人”，[она́]{.ru} 的第五格在前置词后面是 [ней]{.ru}：[мы с ней]{.ru}；写成 [с ей]{.ru} 或 [с её]{.ru} 都不对（第 62 课）。第 6 空：间接疑问句里 [ли]{.ru} 前面的动词照原话的时和人称，主语是 [она́]{.ru}：[ката́ется]{.ru}；写成过去时 [ката́лась]{.ru} 就成了问她“以前滑不滑”（第 89 课）。第 7 空：[два́дцать]{.ru} 后面用复数第二格 [лет]{.ru}；只记得 [год]{.ru} 的人会写 [го́да]{.ru}（那是 2–4 后面的形式）或 [годо́в]{.ru}（第 35、39 课）。第 8 空：主语是 [всё]{.ru}“全身”，中性单数；他写日记时还在疼，用现在时：[боли́т]{.ru}；后面列举的 [но́ги]{.ru}、[спина́]{.ru} 只是补充说明，照它们写成 [боля́т]{.ru} 是常见错误（第 85 课）。第 9 空：“某人不在”用 [не́ было]{.ru} + 第二格，[меня́]{.ru} 已经是第二格，句子没有第一格主语，动词用中性：[не́ было]{.ru}；照 [я]{.ru} 写成 [не был]{.ru} 是没看出前面是 [меня́]{.ru}（第 32 课）。第 10 空：后面“不是一小时，而是半小时”是和原来比，用比较级 [ме́ньше]{.ru}；原级 [ма́ло]{.ru} 没有“比原来少”的意思（第 86 课）。
