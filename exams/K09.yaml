- id: e3
  type: choice
  task: 阅读理解（一）：阅读下面的对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Оле́г]{.sp} Здра́вствуйте. Мне ну́жно два биле́та до Петербу́рга на суббо́ту, на у́тро.

    [Касси́р]{.sp} На «Сапса́н»? На семь часо́в биле́тов уже́ нет. Есть на де́сять три́дцать.

    [Оле́г]{.sp} А в Петербу́рге он во ско́лько?

    [Касси́р]{.sp} В два часа́ дня.

    [Оле́г]{.sp} Э́то по́здно. Мы с жено́й хоте́ли у́тром уже́ гуля́ть по го́роду. А други́х поездо́в нет?

    [Касси́р]{.sp} Есть ночно́й по́езд. Он идёт в пя́тницу в оди́ннадцать ве́чера, а в Петербу́рге бу́дет в семь утра́. Биле́т сто́ит ты́сячу семьсо́т рубле́й, а на «Сапса́н» — три ты́сячи.

    [Оле́г]{.sp} А спать там мо́жно?

    [Касси́р]{.sp} Да, в ваго́не у ка́ждого своя́ по́лка.

    [Оле́г]{.sp} Хорошо́, тогда́ два биле́та на ночно́й. И наза́д, в воскресе́нье ве́чером.

    [Касси́р]{.sp} В воскресе́нье ночно́го по́езда нет. Есть «Сапса́н» в семь часо́в, в Москве́ он бу́дет в оди́ннадцать.

    [Оле́г]{.sp} В оди́ннадцать… По́здно, но ничего́: зато́ це́лый день бу́дем в Петербу́рге. Дава́йте на «Сапса́н».

    [Касси́р]{.sp} Два биле́та на ночно́й по́езд и два на «Сапса́н». С вас де́вять ты́сяч четы́реста.

    [Оле́г]{.sp} Вот, пожа́луйста.
    :::
  glossary:
  - {ru: касси́р, pos: m, zh: 售票员}
  passage_zh: |
    奥列格：您好。我要两张星期六去彼得堡的票，上午的。

    售票员：“游隼号”吗？七点的已经没票了。有十点半的。

    奥列格：那它几点到彼得堡？

    售票员：下午两点。

    奥列格：太晚了。我和我妻子想上午就在城里逛了。别的车没有了吗？

    售票员：有夜车。星期五晚上十一点开，早上七点到彼得堡。票价一千七百卢布，“游隼号”是三千。

    奥列格：车上能睡觉吗？

    售票员：能，车厢里每人都有自己的铺位。

    奥列格：好，那就要两张夜车的。还有回程，星期天晚上。

    售票员：星期天没有夜车。有晚上七点的“游隼号”，十一点到莫斯科。

    奥列格：十一点……晚是晚了点儿，不过没关系，这样我们可以在彼得堡待一整天。就要“游隼号”吧。

    售票员：两张夜车票，两张“游隼号”。一共九千四百卢布。

    奥列格：给您。
  why: >-
    第 1 题：奥列格听到十点半的车 [в два часа́ дня]{.ru} 才到，说 [Э́то по́здно]{.ru}，他们想上午就在城里逛。七点的车没票是售票员先说的，十点半的车是有票的；票价是后来才说到的，奥列格也没有嫌贵；他妻子喜不喜欢“游隼号”文中没说。第 2 题，推断题：夜车星期五晚上十一点开，[в Петербу́рге бу́дет в семь утра́]{.ru}，所以是第二天，也就是星期六早上七点到；星期五晚上十一点是开车时间，星期六下午两点是十点半那趟“游隼号”到站的时间。第 3 题，词义猜测：[ночно́й]{.ru} 由 [ночь]{.ru}“夜里”构成，这趟车晚上十一点开、早上七点到、车上可以睡觉，所以是夜里行驶的车；它星期五开，可售票员说的是“星期天没有夜车”，并没有说只在星期五开。第 4 题，态度题：他先说 [По́здно]{.ru}，觉得晚，接着说 [но ничего́: зато́ це́лый день бу́дем в Петербу́рге]{.ru}，[зато́]{.ru}“好在”说明他觉得能多玩一天比晚到家更要紧，所以接受了；他没有提票价，也没有要改坐夜车（星期天没有夜车）。第 5 题：售票员回答“车上能睡觉吗”时说每人都有自己的铺位；星期天没有夜车，三千卢布是“游隼号”的票价，早上七点是到彼得堡的时间，不是开车时间。
