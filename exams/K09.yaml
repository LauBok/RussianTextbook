- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Бори́с**

    У нас живёт кот Бори́с — большо́й, краси́вый и о́чень лени́вый. В ма́е ма́ма ходи́ла с ним к врачу́. Врач посмотре́л Бори́са и сказа́л, что кот сли́шком то́лстый и что ему́ ну́жно есть ме́ньше: немно́го ры́бы у́тром и ве́чером, а колбасу́ и сыр — нельзя́.

    До́ма ма́ма сказа́ла: «Тепе́рь Бори́са кормлю́ то́лько я. Е́сли он бу́дет проси́ть есть, не дава́йте ему́ ни куска́!» Бори́с был о́чень недово́лен и це́лый день ходи́л за ма́мой по кварти́ре.

    Че́рез ме́сяц ма́ма опя́ть пошла́ с ним к врачу́. Врач спроси́л, ско́лько раз в день ест кот.

    — Два ра́за, — отве́тила ма́ма.

    — Не мо́жет быть! — засмея́лся врач. — Он стал ещё бо́льше.

    Ве́чером ма́ма спроси́ла па́пу и ба́бушку, даю́т ли они́ Бори́су есть. Па́па сказа́л, что даёт ему́ то́лько ма́ленький кусо́к сы́ра, когда́ за́втракает: «Он так смо́трит на меня́! Я не могу́ есть оди́н». Ба́бушка отве́тила: «Днём все на рабо́те и в шко́ле, а он сиди́т до́ма оди́н, ему́ ску́чно. Я даю́ ему́ немно́го колбасы́. Э́то же не еда́!»

    Пото́м ма́ма посмотре́ла на меня́. Я сказа́л, что не даю́ Бори́су ни куска́. Э́то была́ пра́вда. Ка́ждый ве́чер, когда́ все спа́ли, Бори́с сиде́л у мое́й крова́ти, и я дава́л ему́ не кусо́к, а це́лый пирожо́к.

    Тепе́рь на холоди́льнике виси́т спи́сок: «Что ты дал Бори́су? Напиши́ здесь!» Па́па пи́шет туда́ свой сыр, ба́бушка — свою́ колбасу́. Я то́же пишу́. Иногда́.
    :::
