- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: >-
      你是在莫斯科留学的中国学生李明（[Ли Мин]{.ru}），住在一栋公寓楼的 32 号房。同楼的老邻居薇拉·彼得罗夫娜（[Ве́ра Петро́вна]{.ru}）请你星期六晚上去她家过生日，可是那天晚上你要在咖啡馆打工，十一点才下班。她不在家，你给她写一张便条，塞进她家门缝里，40–60 词。要点：1. 感谢她的邀请；2. 说明星期六晚上去不了和原因；3. 祝她生日快乐；4. 提议星期天下午两点去看她，如果她那天没空，请她打电话告诉你（写上你的电话号码）；5. 告诉她你有一件从中国带来的礼物要送给她。
    length: 40–60
    model: |
      Ве́ра Петро́вна, здра́вствуйте!

      Спаси́бо, что пригласи́ли меня́ на день рожде́ния. Но в суббо́ту ве́чером я не могу́: я рабо́таю в кафе́ до оди́ннадцати. С днём рожде́ния! Мо́жно, я бу́ду у вас в воскресе́нье в два часа́? У меня́ есть для вас пода́рок из Кита́я — краси́вый плато́к. Е́сли в воскресе́нье вы бу́дете за́няты, позвони́те мне, пожа́луйста: 8-916-245-37-18.

      Ли Мин, кварти́ра 32
    rubric:
    - 13–15 分：五个要点齐全，有称呼和署名，对长辈用 [вы]{.ru}，语气礼貌；语法错误不超过两处
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或对邻居用了 [ты]{.ru}，或语法错误较多
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（五个要点各 1 分，称呼和署名 1 分，语气得体 1 分）；语法 5 分（[пригласи́ли]{.ru} 的人称和时、[до]{.ru} + 第二格、[у вас]{.ru}、命令式 [позвони́те]{.ru}、[е́сли]{.ru} 从句的将来时，每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: >-
      范文约 55 词，按要点顺序写，每个要点一两句，便条不必写得更长。语法上：[Спаси́бо, что пригласи́ли]{.ru} 用复数过去时，因为对她用 [вы]{.ru}（第 4、17 课）；[до оди́ннадцати]{.ru} 是 [до]{.ru} + 第二格（第 37、68 课）；[С днём рожде́ния!]{.ru} 是固定的祝贺语（第 56 课注释）；[Мо́жно, я бу́ду у вас…]{.ru} 用 [мо́жно]{.ru} 客气地提出请求，[у вас]{.ru} 表示“在您家”（第 31、54 课）；[Е́сли … вы бу́дете за́няты]{.ru} 说的是星期天的情况，[е́сли]{.ru} 从句用将来时，[за́няты]{.ru} 跟 [вы]{.ru} 用复数（第 59、83 课）；[позвони́те мне]{.ru} 是命令式加第三格（第 46、51 课）。礼物也可以写别的东西，只要说清是从中国带来的。
  - prompt: '阅读下面的故事开头，续写 50–80 词：莲娜（[Ле́на]{.ru}）发现了什么、她怎么办、怎样和奶奶联系上、最后怎样到了奶奶那里。


      [В пя́тницу ве́чером Ле́на е́хала на электри́чке к ба́бушке на да́чу. Ба́бушка сказа́ла по телефо́ну, что бу́дет ждать её на ста́нции в де́вять часо́в. По́сле рабо́ты Ле́на о́чень уста́ла. Она́ закры́ла глаза́ на мину́ту… Когда́ она́ их откры́ла, в ваго́не бы́ло пу́сто, а за окно́м бы́ло темно́ и ти́хо.]{.ru}

      '
    length: 50–80
    model: |
      Ле́на посмотре́ла на телефо́н: бы́ло уже́ де́сять часо́в. Она́ поняла́, что её ста́нция была́ давно́, а э́то после́дняя. В ваго́н вошла́ же́нщина и сказа́ла, что электри́чка пойдёт наза́д че́рез полчаса́. Ле́на позвони́ла ба́бушке. Ба́бушка уже́ час стоя́ла на ста́нции и о́чень волнова́лась. Когда́ она́ узна́ла, что случи́лось, она́ засмея́лась: «Ничего́, я подожду́!»

      На э́тот раз Ле́на не закрыва́ла глаза́ ни на мину́ту. В оди́ннадцать она́ была́ на свое́й ста́нции. Ба́бушка жда́ла её там.
    rubric:
    - 13–15 分：情节合理，和开头衔接自然（她睡过了站），写清怎么办、怎样联系奶奶、怎样到达，有一个结尾；语法错误不超过两处
    - 9–12 分：情节基本完整，但有一处交代不清，或语法错误三四处
    - 5–8 分：只写了发现坐过站，没有写后来怎样，或情节和开头对不上，或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（发现了什么 1 分，怎么办 2 分，联系奶奶 1 分，结尾 2 分）；语法 6 分（动词的体、[когда́]{.ru} 从句、间接引语、运动动词每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: >-
      范文约 75 词。开头说她闭了一会儿眼睛，睁开时车厢空了、窗外一片漆黑，读者应该看出她睡着了、坐过了站，续写要从这里接着写。范文分两段：坐过站和怎么办、回程和结尾。语法上：[поняла́, что её ста́нция была́ давно́]{.ru}、[сказа́ла, что электри́чка пойдёт наза́д]{.ru} 是间接引语，[пойдёт]{.ru} 保持说话时的将来时（第 73、88 课）；[Когда́ она́ узна́ла…, она́ засмея́лась]{.ru} 是 [когда́]{.ru} 从句，两个完成体表示先后发生的动作（第 82 课）；[уже́ час стоя́ла]{.ru}、[о́чень волнова́лась]{.ru}、[не закрыва́ла глаза́]{.ru} 说持续的状态，用未完成体（第 42、45 课）；[ни на мину́ту]{.ru} 是 [ни]{.ru} 加强否定（第 87 课）；[на свое́й ста́нции]{.ru} 的 [свое́й]{.ru} 指主语莲娜（第 87 课）。结尾回到开头提到的奶奶在车站等她，故事就前后接上了。也可以写成她在终点站找人帮忙、奶奶让爷爷开车来接等，只要合情合理。
