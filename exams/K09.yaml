- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：外面在下雨，要带的是伞 [зонт]{.ru}；眼镜、词典、球都挡不了雨（第 83 课）。第 2 题：[ча́сто]{.ru} 表示经常往返，坐电气火车去用 [е́здить]{.ru}：[е́здим]{.ru}；[е́дем]{.ru} 是此刻正在去，[хо́дим]{.ru}、[идём]{.ru} 是步行（第 25 课）。第 3 题：要找的人不在，接电话的人先表示歉意，说 [Извини́те]{.ru}；[Пожа́луйста]{.ru} 用于请求或回答感谢，[Спаси́бо]{.ru}、[Ничего́]{.ru} 在这里都不合场合（第 46、51 课）。第 4 题：说从哪个国家来用 [из]{.ru} + 第二格：[из Фра́нции]{.ru}；[с]{.ru} 配用 [на]{.ru} 的地点，[от]{.ru} 配人，[у]{.ru} 不表示来源（第 36 课）。第 5 题：后半句说 [поэ́тому хожу́ туда́ пешко́м]{.ru}，住得近才走着去，用 [недалеко́ от]{.ru}；[далеко́ от]{.ru} 和“所以走着去”的因果不合，[без]{.ru}、[по́сле]{.ru} 不表示位置（第 37、84 课）。第 6 题：明天测验，所以今晚要用功：[занима́ться]{.ru}；[отдыха́ть]{.ru}、[гуля́ть]{.ru}、[игра́ть в компью́тер]{.ru} 都和“因为要测验”的因果相反（第 38、84 课）。第 7 题：回答 [Да, вот послу́шай!]{.ru} 说明诗已经背会了，要的是结果，用完成体过去时 [вы́учил]{.ru}；[учи́л]{.ru} 只说背过、学过，不说背会没有（第 42、44 课）。第 8 题：屋里太热，要请对方开窗：[Откро́й]{.ru}；[Возьми́]{.ru}、[Помо́й]{.ru}、[Покажи́]{.ru} 都和“太热”无关（第 46 课）。第 9 题：[е́сли]{.ru} 从句说的是将来的事（星期五以前），俄语从句里也要用将来时，不能像汉语那样用现在时 [чита́ешь]{.ru}；要的是“读完”这个结果，读完才能把书给我，所以用完成体将来时 [прочита́ешь]{.ru}；[бу́дешь чита́ть]{.ru} 只说过程，[прочита́л]{.ru} 是过去时（第 43、83 课）。第 10 题：给谁买东西，用第三格；形容词第三格阳性词尾是 [-ому]{.ru}，名词是 [-у]{.ru}：[мла́дшему бра́ту]{.ru}；[мла́дшего бра́та]{.ru} 是第二、四格，会被理解成“买了弟弟”（第 51、56 课）。第 11 题：常去音乐学院听音乐会，说明她对音乐感兴趣：[му́зыкой]{.ru}；四个选项都是第五格，要靠后半句的意思来选（第 26、63 课）。第 12 题：后面是第五格 [ста́рым дру́гом]{.ru}，“和……谈话”用 [с]{.ru}；[о]{.ru} 要第六格，[у]{.ru} 要第二格，[к]{.ru} 要第三格（第 61、65 课）。第 13 题：“从早到晚”是固定搭配 [с утра́ до ве́чера]{.ru}，[до]{.ru} 和 [с]{.ru} 前后呼应（第 68 课）。第 14 题：问的是明天，回答将来的一次出行用 [Пое́ду]{.ru}；[Е́здил]{.ru}、[Пое́хал]{.ru} 是过去时，[Е́зжу]{.ru} 表示经常去（第 73 课）。第 15 题：[кото́рый]{.ru} 指前面的 [музе́й]{.ru}，阳性单数；它在从句里作 [нра́вится]{.ru} 的主语，用第一格 [кото́рый]{.ru}（第 79 课）。第 16 题：[всегда́]{.ru} 说经常的情况，用未完成体现在时；[устава́ть]{.ru} 和 [встава́ть]{.ru} 一样，现在时去掉 [-ва-]{.ru}：[устаёт]{.ru}，[устава́ет]{.ru} 是照不定式类推出来的错误形式；[уста́нет]{.ru} 是完成体将来时，不表示经常的情况；[устаю́т]{.ru} 是复数，主语 [ма́ма]{.ru} 是单数（第 81 课）。第 17 题：弟弟自己穿衣服，用带 [-ся]{.ru} 的 [одева́ется]{.ru}；[одева́ет]{.ru} 要有宾语，是给别人穿（第 81 课）。第 18 题：主句 [пошёл гуля́ть]{.ru} 是一次的动作，发生在作业做完以后，[когда́]{.ru} 从句用完成体过去时 [сде́лал]{.ru} 表示“做完了……之后”；[де́лал]{.ru} 表示“正在做作业的时候”，那就成了一边做作业一边出去散步；[де́лаю]{.ru}、[сде́лаю]{.ru} 和主句的过去时不配（第 45、82 课）。第 19 题：[е́сли]{.ru} 说的是将来的条件，从句也要用将来时 [бу́дет]{.ru}；照汉语“如果明天下雨”用现在时 [идёт]{.ru} 是常见错误，[был]{.ru}、[шёл]{.ru} 是过去时，和 [за́втра]{.ru} 矛盾（第 69、83 课）。第 20 题：前半句是原因，后半句是结果，用 [поэ́тому]{.ru}“所以”；[потому́ что]{.ru} 后面要接原因，这里接的是结果（第 84 课）。第 21 题：不能说话，是嗓子疼：[го́рло]{.ru}；腿、背、肚子疼都不影响说话（第 85 课）。第 22 题：[температу́ры уже́ нет]{.ru} 说明身体变好了，用 [лу́чше]{.ru}；[ху́же]{.ru} 意思相反，[бо́льше]{.ru}、[ме́ньше]{.ru} 不说身体状况（第 86 课）。第 23 题：家是主语“我的朋友”自己的，第三人称用 [свой]{.ru}，[о]{.ru} 要求第六格，阴性 [свое́й]{.ru}；[о его́ семье́]{.ru} 会理解成别人的家（第 87 课）。第 24 题：转述娜塔莎的话，人称从“我”改成“她”，用第三人称 [позвони́т]{.ru}；[за́втра]{.ru} 说明是将来时（第 88 课）。第 25 题：一般疑问句转述时用 [ли]{.ru}，[ли]{.ru} 紧跟在被问的词后面：[сде́лали ли мы]{.ru}；[ли]{.ru} 不放在从句开头，也不能用 [е́сли]{.ru} 代替（第 89 课）。
  items:
  - stem: На у́лице дождь, возьми́ ___!
    options:
    - очки́
    - слова́рь
    - мяч
    - зонт
    answer: зонт
  - stem: Ле́том мы ча́сто ___ на да́чу на электри́чке.
    options:
    - е́дем
    - хо́дим
    - е́здим
    - идём
    answer: е́здим
  - stem: — Алло́! Ната́ша до́ма? — ___, её сейча́с нет.
    options:
    - Пожа́луйста
    - Извини́те
    - Спаси́бо
    - Ничего́
    answer: Извини́те
  - stem: — Отку́да вы? — Я ___ Фра́нции.
    options:
    - из
    - с
    - от
    - у
    answer: из
  - stem: Я живу́ ___ университе́та, поэ́тому хожу́ туда́ пешко́м.
    options:
    - далеко́ от
    - недалеко́ от
    - без
    - по́сле
    answer: недалеко́ от
  - stem: За́втра у меня́ контро́льная, поэ́тому сего́дня ве́чером я бу́ду ___.
    options:
    - отдыха́ть
    - гуля́ть
    - занима́ться
    - игра́ть в компью́тер
    answer: занима́ться
  - stem: — Ты уже́ ___ стихи́? — Да, вот послу́шай!
    options:
    - учи́л
    - у́чишь
    - вы́учишь
    - вы́учил
    answer: вы́учил
  - stem: ___, пожа́луйста, окно́, здесь о́чень жа́рко!
    options:
    - Откро́й
    - Возьми́
    - Помо́й
    - Покажи́
    answer: Откро́й
  - stem: Е́сли ты ___ кни́гу до пя́тницы, дай её мне, пожа́луйста.
    options:
    - чита́ешь
    - прочита́ешь
    - прочита́л
    - бу́дешь чита́ть
    answer: прочита́ешь
  - stem: 'Вчера́ я купи́л ___ мяч: он о́чень лю́бит футбо́л.'
    options:
    - мла́дшего бра́та
    - мла́дший брат
    - мла́дшим бра́том
    - мла́дшему бра́ту
    answer: мла́дшему бра́ту
  - stem: Ната́ша интересу́ется ___ и ча́сто хо́дит на конце́рты в консервато́рию.
    options:
    - му́зыкой
    - футбо́лом
    - матема́тикой
    - литерату́рой
    answer: му́зыкой
  - stem: Вчера́ я до́лго разгова́ривал ___ ста́рым дру́гом.
    options:
    - о
    - у
    - с
    - к
    answer: с
  - stem: Моя́ ма́ма рабо́тает с утра́ ___ ве́чера.
    options:
    - от
    - до
    - по
    - в
    answer: до
  - stem: — Что ты бу́дешь де́лать за́втра? — ___ на да́чу к ба́бушке.
    options:
    - Е́здил
    - Пое́хал
    - Пое́ду
    - Е́зжу
    answer: Пое́ду
  - stem: Вот музе́й, ___ мне о́чень нра́вится.
    options:
    - кото́рая
    - кото́рое
    - кото́рые
    - кото́рый
    answer: кото́рый
  - stem: По́сле рабо́ты ма́ма всегда́ о́чень ___.
    options:
    - устава́ет
    - устаёт
    - уста́нет
    - устаю́т
    answer: устаёт
  - stem: У́тром мой мла́дший брат умыва́ется, ___ и за́втракает.
    options:
    - одева́ет
    - одева́ется
    - одева́ются
    - одева́ть
    answer: одева́ется
  - stem: Когда́ я ___ дома́шнее зада́ние, я пошёл гуля́ть.
    options:
    - де́лал
    - де́лаю
    - сде́лаю
    - сде́лал
    answer: сде́лал
  - stem: Е́сли за́втра ___ си́льный дождь, мы бу́дем сиде́ть до́ма.
    options:
    - идёт
    - был
    - бу́дет
    - шёл
    answer: бу́дет
  - stem: Вчера́ шёл си́льный дождь, ___ мы не пое́хали на да́чу.
    options:
    - поэ́тому
    - потому́ что
    - е́сли
    - когда́
    answer: поэ́тому
  - stem: У меня́ боли́т ___, и я не могу́ говори́ть.
    options:
    - нога́
    - спина́
    - живо́т
    - го́рло
    answer: го́рло
  - stem: 'Мне сего́дня гора́здо ___, чем вчера́: температу́ры уже́ нет.'
    options:
    - ху́же
    - бо́льше
    - лу́чше
    - ме́ньше
    answer: лу́чше
  - stem: Мой друг ча́сто расска́зывает о ___ семье́.
    options:
    - свое́й
    - его́
    - своя́
    - свою́
    answer: свое́й
  - stem: — Что сказа́ла Ната́ша? — Она́ сказа́ла, что ___ тебе́ за́втра.
    options:
    - позвоню́
    - позвони́т
    - позвони́ла
    - позвони́шь
    answer: позвони́т
  - stem: Учи́тель спроси́л, ___ мы упражне́ние.
    options:
    - ли сде́лали
    - е́сли сде́лали
    - сде́лали ли
    - что сде́лали
    answer: сде́лали ли
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Живо́т**

    В понеде́льник у́тром Ко́стя не встал в семь, как обы́чно. Я вошла́ в (1) []{.blank} ко́мнату. Он лежа́л в посте́ли.

    — Ма́ма, у меня́ (2) []{.blank} живо́т, — сказа́л он сла́бым (3) []{.blank}. — Я, наве́рное, сего́дня не пойду́ в шко́лу.

    Температу́ры у него́ не́ было, но я всё-таки (4) []{.blank} врача́ и позвони́ла на рабо́ту: сказа́ла, что бу́ду на рабо́те (5) []{.blank}.

    Че́рез час врач был у нас. Он посмотре́л Ко́стю и спроси́л, (6) []{.blank} он ел вчера́ ве́чером.

    — То же, что и все, — отве́тил Ко́стя.

    — А что у тебя́ сего́дня в шко́ле?

    Ко́стя посмотре́л на (7) []{.blank} и (8) []{.blank} не сказа́л. И тут я (9) []{.blank}, почему́ у него́ боли́т живо́т: сего́дня у них контро́льная по матема́тике.

    Врач, ка́жется, то́же всё по́нял. Он сказа́л о́чень серьёзно:

    — Тогда́ так. Три дня лежа́ть в посте́ли. Компью́тер, телефо́н и телеви́зор (10) []{.blank}. Есть то́лько суп.

    Я пое́хала на рабо́ту. В обе́д я позвони́ла (11) []{.blank} домо́й. Ко́стя сказа́л, что живо́т уже́ не боли́т и что он чу́вствует себя́ гора́здо (12) []{.blank}. Пото́м он спроси́л, мо́жно (13) []{.blank} ему́ взять телефо́н.

    — Нет, — отве́тила я. — Ты же (14) []{.blank}.

    Ве́чером Ко́стя сде́лал (15) []{.blank} уро́ки и спроси́л, мо́жно ли ему́ за́втра (16) []{.blank} в шко́лу.

    — Мо́жно, — сказа́ла я. — Контро́льная же уже́ (17) []{.blank}.

    Во вто́рник Ко́стя верну́лся из шко́лы (18) []{.blank}. Он рассказа́л, что в понеде́льник учи́тельница матема́тики то́же (19) []{.blank} и контро́льной не́ было. Она́ бу́дет за́втра.

    Ве́чером Ко́стя до́лго занима́лся (20) []{.blank}. А живо́т у него́ бо́льше не боле́л.
    :::
  glossary:
  - {ru: контро́льная, pos: f, zh: '测验（[контро́льная рабо́та]{.ru} 的简称）'}
  passage_zh: |
    **肚子**

    星期一早上，科斯佳没有像平常那样七点起床。我走进他的房间。他躺在床上。

    “妈妈，我肚子疼，”他有气无力地说，“我今天大概不能去上学了。”

    他没有发烧，可我还是叫了医生，又给单位打电话，说我晚点儿到。

    一个小时以后医生来了。他给科斯佳看了看，问他昨天晚上吃了什么。

    “跟大家吃的一样。”科斯佳回答。

    “那你今天学校里有什么事？”

    科斯佳看了看我，什么也没说。这时我才明白他为什么肚子疼：今天他们有数学测验。

    医生好像也全明白了。他非常严肃地说：

    “那就这样。卧床三天。电脑、手机、电视都不许碰。只能喝汤。”

    我去上班了。午饭的时候我往家里给他打了个电话。科斯佳说肚子已经不疼了，觉得好多了。然后他问能不能拿手机。

    “不行，”我回答，“你不是病了吗。”

    晚上科斯佳把功课全做完了，问明天能不能去上学。

    “可以，”我说，“反正测验已经考过了。”

    星期二科斯佳从学校回来，闷闷不乐。他说，星期一数学老师也病了，测验没有考。改在明天。

    晚上科斯佳复习了很久的数学。他的肚子再也没疼过。
  why: >-
    第 1 空：叙述者是妈妈，她走进的是儿子的房间，用 [его́]{.ru}；[свою́]{.ru} 指主语“我”，意思成了“走进我自己的房间”，可接下来说的是科斯佳躺在床上；[её]{.ru} 指女性，[ему́]{.ru} 是第三格，不表示所属（第 87 课）。第 2 空：主语是单数的 [живо́т]{.ru}，“疼”用 [боле́ть]{.ru} 第二变位的 [боли́т]{.ru}；[боля́т]{.ru} 用于复数，[боле́ет]{.ru} 是“生病”的那个 [боле́ть]{.ru}，[боле́л]{.ru} 是过去时，可他说的是此刻（第 85 课）。第 3 空：“用……声音说”用第五格：[сла́бым го́лосом]{.ru}，[сла́бым]{.ru} 本身已经是第五格（第 61、88 课）。第 4 空：前面 [вошла́]{.ru} 已经表明“我”是女性，过去时用 [вы́звала]{.ru}；[вы́звал]{.ru} 是阳性，[вы́звать]{.ru} 是不定式，[вы́зову]{.ru} 是将来时（第 85 课）。第 5 空：她要在家等医生，所以上班要晚到：[по́зже]{.ru}；[ра́ньше]{.ru} 正好相反，[ме́ньше]{.ru}、[ху́же]{.ru} 和“到单位”搭不上（第 86 课）。第 6 空：科斯佳的回答“跟大家一样”说的是吃了“什么”，用 [что]{.ru}；[ли]{.ru} 引出一般疑问，要放在动词后面（[ел ли он]{.ru}），[как]{.ru}“怎么吃”、[чем]{.ru}“用什么吃”都和回答对不上（第 89 课）。第 7 空：[посмотре́ть на]{.ru} 要第四格：[на меня́]{.ru}；[мне]{.ru} 是第三格，[мной]{.ru} 是第五格。第 8 空：俄语否定句里“什么也（没）”是 [ничего́]{.ru} 加 [не]{.ru}；[всё не сказа́л]{.ru} 不成话，[что]{.ru} 和 [не]{.ru} 放在一起意思不通，[ему́]{.ru} 和 [сказа́л]{.ru} 连用是“对他说”，可这里没有说出的内容。第 9 空：[И тут]{.ru}“这时”表示一下子明白，用完成体过去时 [поняла́]{.ru}；[понима́ла]{.ru} 是未完成体，说不出“恍然大悟”；[по́нял]{.ru} 是阳性，[поймёт]{.ru} 是将来时（第 42、43 课）。第 10 空：医生看出孩子在装病，故意开了个让他受不了的“医嘱”；后文妈妈中午不让他拿手机，理由是“你病着”，说明医生说的是“不许”：[нельзя́]{.ru}；选 [мо́жно]{.ru} 的人没有读后文，[ну́жно]{.ru}、[на́до]{.ru}“必须看电视”不合情理（第 54 课）。第 11 空：[позвони́ть]{.ru} 要第三格：[позвони́ла ему́]{.ru}；[к нему́]{.ru} 用于“到某人那里去”（第 57 课）。第 12 空：肚子已经不疼了，自然是“感觉好多了”：[лу́чше]{.ru}；[ху́же]{.ru} 和前半句矛盾，[бо́льше]{.ru}、[ме́ньше]{.ru} 不和 [чу́вствовать себя́]{.ru} 搭配（第 86、87 课）。第 13 空：转述一般疑问句“能不能”，[ли]{.ru} 放在被问的词 [мо́жно]{.ru} 后面；[е́сли]{.ru} 是“如果”，[что]{.ru}、[чем]{.ru} 引出的不是一般疑问（第 89 课）。第 14 空：妈妈不给手机，借口就是医生说的病，带着讽刺：[Ты же бо́лен]{.ru}“你不是病了吗”；科斯佳是男孩，短尾用阳性，[больна́]{.ru} 是阴性；[здоро́в]{.ru}“你是健康的”不能作为不给手机的理由（第 59、84 课）。第 15 空：[уро́ки]{.ru} 是复数，“全部”用复数 [все]{.ru}；[всё]{.ru} 是中性单数，常有人把 [все уро́ки]{.ru} 写成 [всё]{.ru}。第 16 空：[мо́жно ли ему́]{.ru} 后面用不定式，一次具体的“去”用 [пойти́]{.ru}；其余三项都是变位形式（第 73 课）。第 17 空：妈妈以为测验星期一已经考过了，用过去时，[контро́льная]{.ru} 是阴性：[была́]{.ru}；[бу́дет]{.ru} 和 [уже́]{.ru}“已经”不配，而且妈妈这时还不知道测验改了期（全文理解）。第 18 空：下一句才揭晓原因：测验没考，改到了明天，他白装了一场病，自然闷闷不乐：[гру́стный]{.ru}；[весёлый]{.ru} 和这件事不合，[ве́село]{.ru} 是副词，这里要和 [Ко́стя]{.ru} 一致的形容词，[больно́й]{.ru} 和结尾“肚子再也没疼过”矛盾（全文理解）。第 19 空：测验没有考，是因为老师也“病了”：[заболе́ла]{.ru}，[то́же]{.ru} 和科斯佳的“病”呼应；[учи́тельница]{.ru} 是阴性，[заболе́л]{.ru} 不对；老师要是照常上班（[рабо́тала]{.ru}），测验就考了，[уста́ла]{.ru}“累了”也不是取消测验的理由（第 83 课）。第 20 空：明天要补考的是数学，他晚上复习的当然是数学：[занима́лся матема́тикой]{.ru}；四个选项都是第五格，只能靠上文判断（第 63、70 课）。
