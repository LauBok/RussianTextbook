  - stem: Оле́г не взял биле́ты на «Сапса́н» в де́сять три́дцать, потому́ что ___.
    options:
    - на э́тот по́езд биле́тов уже́ не́ было
    - он хоте́л быть в Петербу́рге у́тром
    - э́ти биле́ты сто́или о́чень до́рого
    - его́ жене́ не нра́вится «Сапса́н»
    answer: он хоте́л быть в Петербу́рге у́тром
  - stem: В Петербу́рге Оле́г и его́ жена́ бу́дут ___.
    options:
    - в пя́тницу в оди́ннадцать ве́чера
    - в суббо́ту в два часа́ дня
    - в воскресе́нье в семь утра́
    - в суббо́ту в семь утра́
    answer: в суббо́ту в семь утра́
  - stem: «Ночно́й по́езд» — э́то по́езд, кото́рый ___.
    options:
    - идёт но́чью
    - идёт о́чень бы́стро
    - идёт то́лько в пя́тницу
    - сто́ит о́чень до́рого
    answer: идёт но́чью
  - stem: Что Оле́г ду́мает о «Сапса́не» в воскресе́нье?
    options:
    - Биле́ты на него́ сли́шком дороги́е.
    - Лу́чше пое́хать наза́д на ночно́м по́езде.
    - В Москве́ он бу́дет по́здно, но э́то не так ва́жно.
    - Э́то са́мый хоро́ший по́езд.
    answer: В Москве́ он бу́дет по́здно, но э́то не так ва́жно.
  - stem: Что мы узна́ли о ночно́м по́езде?
    options:
    - Он идёт и в воскресе́нье.
    - В нём мо́жно спать.
    - Биле́т на него́ сто́ит три ты́сячи рубле́й.
    - Он идёт в Петербу́рг в семь утра́.
    answer: В нём мо́жно спать.
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面网上的提问和回答，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Что подари́ть?**

    **Чжан Вэй:** Здра́вствуйте! Я из Кита́я, учу́сь в Каза́ни. Мой ру́сский друг пригласи́л меня́ в воскресе́нье на обе́д к свои́м роди́телям. В ру́сской семье́ я бу́ду пе́рвый раз. Ну́жен ли пода́рок? И что лу́чше подари́ть?

    **Ната́ша:** Пода́рок ну́жен, но небольшо́й. Дорого́й пода́рок не покупа́йте: роди́тели дру́га не бу́дут знать, что сказа́ть. Обы́чно мы берём в го́сти торт к ча́ю и цветы́ для хозя́йки. То́лько по́мните: цвето́в должно́ быть три, пять и́ли семь, не два и не четы́ре.

    **И́горь:** А я сове́тую хоро́ший кита́йский чай. Ру́сские о́чень лю́бят чай, а настоя́щий кита́йский у нас купи́ть тру́дно. Одна́жды мой друг из Пеки́на подари́л моему́ па́пе кита́йский чай. Па́па пил его́ це́лую зи́му и до́лго пото́м вспомина́л. И ещё: когда́ войдёте в кварти́ру, сними́те боти́нки, вам даду́т та́почки.

    **Чжан Вэй:** Спаси́бо! Чай у меня́ есть: ма́ма дала́ мне его́ с собо́й, когда́ я е́хал в Росси́ю. А для ма́мы дру́га куплю́ цветы́.
    :::
  glossary:
  - {ru: хозя́йка, pos: f, zh: 女主人}
  passage_zh: |
    **送什么好？**

    张伟：大家好！我是中国人，在喀山上学。我的俄罗斯朋友请我星期天到他父母家吃午饭。我这是第一次去俄罗斯人家里。要带礼物吗？送什么好呢？

    娜塔莎：礼物要带，但是别太大。别买贵重的礼物：朋友的父母会不知道说什么好。我们一般去做客带一个配茶吃的蛋糕，再给女主人带一束花。不过记住：花要三枝、五枝或者七枝，不能是两枝、四枝。

    伊戈尔：我建议送好的中国茶。俄罗斯人很爱喝茶，可是在我们这儿很难买到正宗的中国茶。有一次我一个北京来的朋友送了我爸爸一些中国茶。我爸爸喝了整整一个冬天，后来还念叨了很久。还有：进门以后要脱鞋，主人会给您拖鞋。

    张伟：谢谢！茶我有：我来俄罗斯的时候妈妈让我带上了。我再给朋友的妈妈买些花。
  why: >-
    第 1 题，推断题：要把张伟最后的话和前面两人的建议连起来。他说茶已经有了（伊戈尔的建议），还要给朋友的妈妈买花（娜塔莎的建议之一），没有提蛋糕，所以他带的是茶和花；“蛋糕和花”是娜塔莎的全部建议，张伟只采纳了一半。第 2 题：娜塔莎说 [Дорого́й пода́рок не покупа́йте]{.ru}；她说花不能是两枝，蛋糕正是她建议带的，中国茶是伊戈尔的主意。第 3 题：伊戈尔的理由是 [настоя́щий кита́йский у нас купи́ть тру́дно]{.ru}；“俄罗斯人爱喝茶”他说了，但没有说他爸爸只喝茶，也没有说中国茶便宜。第 4 题，推断题：爸爸 [пил его́ це́лую зи́му и до́лго пото́м вспомина́л]{.ru}，喝了一冬天还念念不忘，说明很喜欢；文中没有说他喝咖啡或者没喝。第 5 题：伊戈尔说进门要 [сними́те боти́нки]{.ru}；洗手虽然也是做客的习惯，但文中没有说，送花是娜塔莎的建议，而且是送给女主人。
