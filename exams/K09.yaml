  - {ru: со́лнечно, zh: 晴朗，有太阳}
  passage_zh: |
    **天气预报：莫斯科，11 月 18—24 日**

    | | 白天 | 夜间 | |
    |---|---|---|---|
    | 星期一，18 日 | +5° | +2° | 雨 |
    | 星期二，19 日 | +3° | 0° | 雨 |
    | 星期三，20 日 | 0° | −2° | 雪，大风 |
    | 星期四，21 日 | −1° | −5° | 雪 |
    | 星期五，22 日 | −7° | −9° | 晴 |
    | 星期六，23 日 | −3° | −11° | 晴 |
    | 星期日，24 日 | −2° | −4° | 雪 |

    莫斯科开始入冬了。星期三将下今年第一场雪，星期四雪会下一整天。路上会堵车，所以这两天上班最好坐地铁。如果您还是要开车，得比平时早半小时出发。

    星期五和星期六天晴，但是很冷。别忘了戴帽子、围围巾！
  why: >-
    第 1 题：要看表格最后一栏。下雪的是星期三、星期四和星期天；下面的文字只说了星期三、星期四，只读文字的人会选“只在星期三和星期四”；星期五、星期六是晴天，星期二还是雨。第 2 题，推断题：丽达要找晴天，又不能太冷。晴天只有星期五和星期六，星期五白天 −7°，星期六白天 −3°，所以选星期六。星期六夜里 −11° 是全周最冷的，容易让人以为星期六最冷而去掉它，可孩子是白天去公园；星期天白天 −2° 最暖和，但要下雪。第 3 题：文中说 [На доро́гах бу́дут про́бки, поэ́тому…]{.ru}，[поэ́тому]{.ru} 前面就是原因（第 84 课）；大风是表格里星期三的天气，文中没有拿它当坐地铁的理由；“很冷”说的是星期五和星期六。第 4 题，推断题：要把两处信息连起来：瓦尼亚平时八点开车去上班；预报建议开车的人在星期三、星期四 [на полчаса́ ра́ньше, чем обы́чно]{.ru}，八点早半小时是 7:30。8:30 是把 [ра́ньше]{.ru} 理解成了“晚”；7:00 是早了一小时。第 5 题，推断题：根纳星期五、星期六在莫斯科，这两天都是晴天，白天 −7° 和 −3°，夜里更冷，要带的是暖和的外套和帽子，文中也提醒 [Не забу́дьте ша́пку и шарф!]{.ru}；伞是星期一、星期二下雨时用的，这两天他还没来。
  items:
