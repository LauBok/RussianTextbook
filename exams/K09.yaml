    Ле́на!

    Я на рабо́те до восьми́. Ва́ня сего́дня не пошёл в шко́лу: но́чью у него́ была́ температу́ра и (1) []{.blank} (боле́ть) го́рло. Когда́ (2) []{.blank} (верну́ться) из шко́лы, пообе́дай вме́сте с (3) []{.blank} (он). Борщ — в (4) []{.blank} (холоди́льник).

    В три часа́ дай Ва́не лека́рство. Оно́ на ку́хне, на (5) []{.blank} (ве́рхняя по́лка). Е́сли ве́чером у него́ опя́ть (6) []{.blank} (быть) температу́ра, позвони́ мне.

    Хле́ба нет, купи́, пожа́луйста, (7) []{.blank} (два бато́н). Де́ньги в (8) []{.blank} (мой ста́рый кошелёк), он лежи́т на столе́ в прихо́жей.

