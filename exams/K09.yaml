    Дорога́я ма́ма!

    Извини́, я до́лго не писа́л. Две неде́ли наза́д я заболе́л: у меня́ была́ высо́кая температу́ра и боле́ло го́рло. Врач сказа́ла, что э́то грипп, и я неде́лю лежа́л в посте́ли. Ван Лэй и А́нна ка́ждый день звони́ли мне и расска́зывали, что бы́ло на уро́ке, а Ю́ми дала́ мне свои́ тетра́ди. Тепе́рь я уже́ здоро́в и хожу́ на заня́тия.

    Ты спра́шиваешь, где лу́чше: в Пари́же и́ли в Москве́. Москва́ гора́здо бо́льше, чем Пари́ж, и зимо́й здесь холодне́е. Мне здесь не всё нра́вится: в го́роде про́бки, а в метро́ всегда́ шу́мно. Но метро́ здесь о́чень краси́вое, а лю́ди до́брые. Е́сли ты не зна́ешь доро́гу, тебе́ всегда́ помо́гут.

    Е́сли бу́дет хоро́шая пого́да, в суббо́ту мы с Ван Лэ́ем пойдём на като́к. Я ещё пло́хо ката́юсь, но Ван Лэй сказа́л, что нау́чит меня́. А в декабре́ на́ша гру́ппа пое́дет в Петербу́рг. О́льга Ви́кторовна спроси́ла, хочу́ ли я пое́хать. Коне́чно, хочу́! А в про́шлое воскресе́нье я был в Большо́м теа́тре на бале́те «Лебеди́ное о́зеро». Э́то бы́ло прекра́сно!

    Ма́ма, не волну́йся: я тепло́ одева́юсь и ношу́ твою́ ша́пку. Ка́ждый ве́чер я пью чай с мёдом, как ты сове́товала.

    Передава́й приве́т па́пе.

    Твой Пьер
    :::
  passage_zh: |
    亲爱的妈妈：

    对不起，我很久没写信了。两个星期前我病了：发高烧，嗓子疼。医生说是流感，我在床上躺了一个星期。王磊和安娜每天给我打电话，告诉我课上讲了什么，由美把她的本子给了我。现在我已经好了，在上课了。

    你问巴黎好还是莫斯科好。莫斯科比巴黎大得多，冬天这里也更冷。这里我并不是什么都喜欢：城里堵车，地铁里总是很吵。可是这里的地铁很漂亮，人也很好。要是你不认识路，总会有人帮你。

    要是天气好，星期六我和王磊去滑冰场。我滑得还不好，可是王磊说他会教我。十二月我们班要去彼得堡。奥尔加·维克托罗夫娜问我想不想去。当然想！上个星期天我在大剧院看了芭蕾舞《天鹅湖》。太美了！

    妈妈，别担心：我穿得很暖和，戴着你给的帽子。我每天晚上都照你说的喝蜂蜜茶。

    代我向爸爸问好。

    你的皮埃尔
  why: 第 1 题，推断题：信一开头道歉很久没写信，接着说两周前得了流感、卧床一周，这就是没写信的原因。第 2 题，[Ван Лэй и А́нна ка́ждый день звони́ли мне]{.ru}；由美是给了本子。第 3 题，推断题：皮埃尔不喜欢堵车和地铁里吵，[Но метро́ здесь о́чень краси́вое, а лю́ди до́брые]{.ru}，喜欢的是地铁的样子和人；冬天更冷是事实，不是他喜欢的地方。第 4 题，[Е́сли бу́дет хоро́шая пого́да, в суббо́ту мы с Ван Лэ́ем пойдём на като́к]{.ru}，条件是天气。第 5 题，推断题：他特意写 [Ма́ма, не волну́йся]{.ru}，又说穿得暖、天天喝蜂蜜茶，说明妈妈担心他的身体。
