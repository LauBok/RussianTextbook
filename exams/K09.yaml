    | | 天气 | 气温（度） |
    |---|---|---|
    | 星期一 | 雨，有风 | +3 |
    | 星期二 | 雨 | +2 |
    | 星期三 | 雪，有风 | 0 |
    | 星期四 | 雨夹雪 | −1 |
    | 星期五 | 无雨无风 | −5 |
    | 星期六 | 严寒 | −15 |
    | 星期天 | 雪，大风 | −10 |

