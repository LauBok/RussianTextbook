  passage_zh: |
    **鲍里斯**

    我们家有一只猫叫鲍里斯，又大又漂亮，懒得出奇。五月妈妈带它去看兽医。医生看了看鲍里斯，说它太胖了，得少吃：早上和晚上各给一点儿鱼，香肠和奶酪不能吃。

    回到家，妈妈说：“从现在起只有我喂鲍里斯。它要是要吃的，一块也别给它！”鲍里斯很不满意，整天跟在妈妈后面满屋子转。

    过了一个月，妈妈又带它去看医生。医生问猫一天吃几次。

    “两次。”妈妈回答。

    “不可能！”医生笑了，“它比上次还胖。”

    晚上妈妈问爸爸和奶奶有没有给鲍里斯东西吃。爸爸说，他只是吃早饭的时候给它一小块奶酪：“它那样看着我！我没法一个人吃。”奶奶回答：“白天大家上班的上班、上学的上学，就它一个在家，多闷啊。我给它一点儿香肠。那又不算吃饭！”

    然后妈妈看着我。我说我一块也没给过鲍里斯。这是实话。每天晚上大家都睡了，鲍里斯就坐在我床边，我给它的不是一块，而是一整个馅饼。

    现在冰箱上挂着一张单子：“你给鲍里斯吃了什么？写在这儿！”爸爸在上面写他的奶酪，奶奶写她的香肠。我也写。有时候写。
  why: >-
    第 1 题：医生第一次说的是 [ему́ ну́жно есть ме́ньше]{.ru}；它懒是叙述者说的，医生没让它多活动；香肠恰恰是不能吃的；文中没说它病了。第 2 题，推断题：妈妈确实一天只喂两次，猫却更胖了；接下来爸爸、奶奶、“我”都承认（或暗示）偷偷喂过它，所以原因是喂它的不止妈妈一个人；“懒”是它一向的样子，不是这一个月变胖的原因。第 3 题，态度题：奶奶说 [Э́то же не еда́!]{.ru}，[же]{.ru} 加强语气，意思是“一点儿香肠算不了什么”；她知道医生不让吃，但不当回事；猫闷是她喂香肠的理由，不是她对香肠的看法。第 4 题，推断题：爸爸和奶奶都向妈妈承认了，只有“我”说 [не даю́ Бори́су ни куска́]{.ru}，字面上没撒谎，因为给的是整个馅饼，不是“一块”，妈妈并不知道。第 5 题，推断题：单子上“我也写。有时候写。”和前文“我”在妈妈面前钻字眼呼应，说明“我”到现在也没有全都告诉妈妈；文中没有说他不会写字或者记不住单子挂在哪儿。
  items:
  - stem: В ма́е врач сказа́л, что ___.
    options:
    - Бори́су ну́жно бо́льше гуля́ть
    - Бори́су ну́жно есть ме́ньше
    - Бори́су мо́жно есть то́лько колбасу́
    - Бори́с бо́лен
    answer: Бори́су ну́жно есть ме́ньше
  - stem: Почему́ че́рез ме́сяц Бори́с стал ещё бо́льше?
    options:
    - Ма́ма дава́ла ему́ сли́шком мно́го ры́бы.
    - Он ма́ло гуля́л, потому́ что он лени́вый.
    - Его́ корми́ла не то́лько ма́ма.
    - Врач дал ему́ лека́рство.
    answer: Его́ корми́ла не то́лько ма́ма.
  - stem: Что ба́бушка ду́мает о колбасе́?
    options:
    - Немно́го колбасы́ — э́то не пробле́ма.
    - Бори́су нельзя́ есть колбасу́.
    - Колбаса́ нужна́ Бори́су вме́сто ры́бы.
    - Колбаса́ — лу́чшая еда́ для ко́шек.
    answer: Немно́го колбасы́ — э́то не пробле́ма.
  - stem: Кто корми́л Бори́са, но ма́ме об э́том не сказа́л?
    options:
    - па́па
    - ба́бушка
    - ма́льчик, кото́рый расска́зывает э́ту исто́рию
    - врач
    answer: ма́льчик, кото́рый расска́зывает э́ту исто́рию
  - stem: Почему́ ма́льчик пи́шет в спи́сок то́лько иногда́?
    options:
