exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：外面在下雨，要带的是伞 [зонт]{.ru}；眼镜、词典、球都挡不了雨（第 83 课）。第 2 题：[ча́сто]{.ru} 表示经常往返，坐电气火车去用 [е́здить]{.ru}：[е́здим]{.ru}；[е́дем]{.ru} 是此刻正在去，[хо́дим]{.ru}、[идём]{.ru} 是步行（第 25 课）。第 3 题：要找的人不在，接电话的人先表示歉意，说 [Извини́те]{.ru}；[Пожа́луйста]{.ru} 用于请求或回答感谢，[Спаси́бо]{.ru}、[Ничего́]{.ru} 在这里都不合场合（第 46、51 课）。第 4 题：说从哪个国家来用 [из]{.ru} + 第二格：[из Фра́нции]{.ru}；[с]{.ru} 配用 [на]{.ru} 的地点，[от]{.ru} 配人，[у]{.ru} 不表示来源（第 36 课）。第 5 题：后半句说 [поэ́тому хожу́ туда́ пешко́м]{.ru}，住得近才走着去，用 [недалеко́ от]{.ru}；[далеко́ от]{.ru} 和“所以走着去”的因果不合，[без]{.ru}、[по́сле]{.ru} 不表示位置（第 37、84 课）。第 6 题：明天测验，所以今晚要用功：[занима́ться]{.ru}；[отдыха́ть]{.ru}、[гуля́ть]{.ru}、[игра́ть в компью́тер]{.ru} 都和“因为要测验”的因果相反（第 38、84 课）。第 7 题：回答 [Да, вот послу́шай!]{.ru} 说明诗已经背会了，要的是结果，用完成体过去时 [вы́учил]{.ru}；[учи́л]{.ru} 只说背过、学过，不说背会没有（第 42、44 课）。第 8 题：屋里太热，要请对方开窗：[Откро́й]{.ru}；[Возьми́]{.ru}、[Помо́й]{.ru}、[Покажи́]{.ru} 都和“太热”无关（第 46 课）。第 9 题：别人祝贺生日，回答 [Спаси́бо!]{.ru}；[Пожа́луйста]{.ru} 是回答感谢的，[Ничего́]{.ru}、[Извини́]{.ru} 用于道歉的场合（第 4、46 课）。第 10 题：送的是足球，因为弟弟爱踢足球 [футбо́л]{.ru}；音乐、象棋、芭蕾都和足球无关（第 26、56 课）。第 11 题：常去音乐学院听音乐会，说明她对音乐感兴趣：[му́зыкой]{.ru}；四个选项都是第五格，要靠后半句的意思来选（第 26、63 课）。第 12 题：后面是第五格 [ста́рым дру́гом]{.ru}，“和……谈话”用 [с]{.ru}；[о]{.ru} 要第六格，[у]{.ru} 要第二格，[к]{.ru} 要第三格（第 61、65 课）。第 13 题：“从早到晚”是固定搭配 [с утра́ до ве́чера]{.ru}，[до]{.ru} 和 [с]{.ru} 前后呼应（第 68 课）。第 14 题：问的是明天，回答将来的一次出行用 [Пое́ду]{.ru}；[Е́здил]{.ru}、[Пое́хал]{.ru} 是过去时，[Е́зжу]{.ru} 表示经常去（第 73 课）。第 15 题：[кото́рый]{.ru} 指前面的 [музе́й]{.ru}，阳性单数；它在从句里作 [нра́вится]{.ru} 的主语，用第一格 [кото́рый]{.ru}（第 79 课）。第 16 题：[обы́чно]{.ru} 说经常的动作，用未完成体现在时；[встава́ть]{.ru} 现在时去掉 [-ва-]{.ru}：[встаю́]{.ru}；[вста́ну]{.ru} 是完成体将来时，后半句才用（第 81 课）。第 17 题：弟弟自己穿衣服，用带 [-ся]{.ru} 的 [одева́ется]{.ru}；[одева́ет]{.ru} 要有宾语，是给别人穿（第 81 课）。第 18 题：[всегда́]{.ru} 和主句的现在时 [слу́шаю]{.ru} 说的是经常同时进行的两件事，从句也用未完成体现在时 [за́втракаю]{.ru}；过去时和主句的现在时不配，[за́втракать]{.ru} 是不定式（第 82 课）。第 19 题：下大雨，合理的安排是待在家里：[бу́дем сиде́ть до́ма]{.ru}；去公园散步、踢足球、去滑冰场都是在室外（第 83 课）。第 20 题：前半句是原因，后半句是结果，用 [поэ́тому]{.ru}“所以”；[потому́ что]{.ru} 后面要接原因，这里接的是结果（第 84 课）。第 21 题：不能说话，是嗓子疼：[го́рло]{.ru}；腿、背、肚子疼都不影响说话（第 85 课）。第 22 题：[температу́ры уже́ нет]{.ru} 说明身体变好了，用 [лу́чше]{.ru}；[ху́же]{.ru} 意思相反，[бо́льше]{.ru}、[ме́ньше]{.ru} 不说身体状况（第 86 课）。第 23 题：家是主语“我的朋友”自己的，第三人称用 [свой]{.ru}，[о]{.ru} 要求第六格，阴性 [свое́й]{.ru}；[о его́ семье́]{.ru} 会理解成别人的家（第 87 课）。第 24 题：转述娜塔莎的话，人称从“我”改成“她”，用第三人称 [позвони́т]{.ru}；[за́втра]{.ru} 说明是将来时（第 88 课）。第 25 题：一般疑问句转述时用 [ли]{.ru}，[ли]{.ru} 紧跟在被问的词后面：[сде́лали ли мы]{.ru}；[ли]{.ru} 不放在从句开头，也不能用 [е́сли]{.ru} 代替（第 89 课）。
  items:
  - stem: На у́лице дождь, возьми́ ___!
    options: [очки́, слова́рь, мяч, зонт]
    answer: зонт
  - stem: Ле́том мы ча́сто ___ на да́чу на электри́чке.
    options: [е́дем, хо́дим, е́здим, идём]
    answer: е́здим
  - stem: — Алло́! Ната́ша до́ма? — ___, её сейча́с нет.
    options: [Пожа́луйста, Извини́те, Спаси́бо, Ничего́]
    answer: Извини́те
  - stem: — Отку́да вы? — Я ___ Фра́нции.
    options: [из, с, от, у]
    answer: из
  - stem: Я живу́ ___ университе́та, поэ́тому хожу́ туда́ пешко́м.
    options: [далеко́ от, недалеко́ от, без, по́сле]
    answer: недалеко́ от
  - stem: За́втра у меня́ контро́льная, поэ́тому сего́дня ве́чером я бу́ду ___.
    options: [отдыха́ть, гуля́ть, занима́ться, игра́ть в компью́тер]
    answer: занима́ться
  - stem: — Ты уже́ ___ стихи́? — Да, вот послу́шай!
    options: [учи́л, у́чишь, вы́учишь, вы́учил]
    answer: вы́учил
  - stem: ___, пожа́луйста, окно́, здесь о́чень жа́рко!
    options: [Откро́й, Возьми́, Помо́й, Покажи́]
    answer: Откро́й
  - stem: — С днём рожде́ния! — ___!
    options: [Пожа́луйста, Спаси́бо, Ничего́, Извини́]
    answer: Спаси́бо
  - stem: Вчера́ я купи́л мла́дшему бра́ту мяч, он о́чень лю́бит ___.
    options: [му́зыку, ша́хматы, бале́т, футбо́л]
    answer: футбо́л
  - stem: Ната́ша интересу́ется ___ и ча́сто хо́дит на конце́рты в консервато́рию.
    options: [му́зыкой, футбо́лом, матема́тикой, литерату́рой]
    answer: му́зыкой
  - stem: Вчера́ я до́лго разгова́ривал ___ ста́рым дру́гом.
    options: [о, у, с, к]
    answer: с
  - stem: Моя́ ма́ма рабо́тает с утра́ ___ ве́чера.
    options: [от, до, по, в]
    answer: до
  - stem: — Что ты бу́дешь де́лать за́втра? — ___ на да́чу к ба́бушке.
    options: [Е́здил, Пое́хал, Пое́ду, Е́зжу]
    answer: Пое́ду
  - stem: Вот музе́й, ___ мне о́чень нра́вится.
    options: [кото́рая, кото́рое, кото́рые, кото́рый]
    answer: кото́рый
  - stem: Обы́чно я ___ в семь часо́в, а за́втра вста́ну в шесть.
    options: [встаю́, вста́ну, встава́л, встаёт]
    answer: встаю́
  - stem: У́тром мой мла́дший брат умыва́ется, ___ и за́втракает.
    options: [одева́ет, одева́ется, одева́ются, одева́ть]
    answer: одева́ется
  - stem: Когда́ я ___, я всегда́ слу́шаю ра́дио.
    options: [за́втракать, поза́втракал, за́втракаю, за́втракал]
    answer: за́втракаю
  - stem: Е́сли за́втра бу́дет си́льный дождь, мы ___.
    options: [пойдём гуля́ть в парк, бу́дем игра́ть в футбо́л, пойдём на като́к, бу́дем сиде́ть до́ма]
    answer: бу́дем сиде́ть до́ма
  - stem: Вчера́ шёл си́льный дождь, ___ мы не пое́хали на да́чу.
    options: [поэ́тому, потому́ что, е́сли, когда́]
    answer: поэ́тому
  - stem: У меня́ боли́т ___, и я не могу́ говори́ть.
    options: [нога́, спина́, живо́т, го́рло]
    answer: го́рло
  - stem: 'Мне сего́дня гора́здо ___, чем вчера́: температу́ры уже́ нет.'
    options: [ху́же, бо́льше, лу́чше, ме́ньше]
    answer: лу́чше
  - stem: Мой друг ча́сто расска́зывает о ___ семье́.
    options: [свое́й, его́, своя́, свою́]
    answer: свое́й
  - stem: — Что сказа́ла Ната́ша? — Она́ сказа́ла, что ___ тебе́ за́втра.
    options: [позвоню́, позвони́т, позвони́ла, позвони́шь]
    answer: позвони́т
  - stem: Учи́тель спроси́л, ___ мы упражне́ние.
    options: [ли сде́лали, е́сли сде́лали, сде́лали ли, что сде́лали]
    answer: сде́лали ли
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Сосе́д**

    Ря́дом с на́ми живёт Михаи́л Ива́нович. Ему́ во́семьдесят лет. Ра́ньше он рабо́тал (1) []{.blank} в шко́ле: со́рок лет он ка́ждый день объясня́л на уро́ке матема́тику. Сейча́с он живёт оди́н, (2) []{.blank} ему́ не ску́чно: у него́ есть больша́я соба́ка. Ка́ждое у́тро он (3) []{.blank} с ней в па́рке.

    В ноябре́ Михаи́л Ива́нович заболе́л: у него́ была́ высо́кая (4) []{.blank} и боле́ло го́рло. Врач сказа́л, что ему́ (5) []{.blank} гуля́ть. Но соба́ке ну́жно гуля́ть ка́ждый день! Тогда́ Михаи́л Ива́нович позвони́л (6) []{.blank} и спроси́л, могу́ ли я гуля́ть с его́ соба́кой. Я отве́тил, что могу́.

    Тепе́рь я встава́л (7) []{.blank}, чем обы́чно, и шёл с соба́кой в парк, а пото́м в шко́лу. Соба́ка снача́ла не хоте́ла идти́ со мной: она́ ждала́ своего́ (8) []{.blank}. Но че́рез неде́лю она́ уже́ была́ (9) []{.blank} мне.

    Одна́жды ве́чером я был у Михаи́ла Ива́новича. Он спроси́л, почему́ я сего́дня не (10) []{.blank}. Я отве́тил, что за́втра у меня́ контро́льная по матема́тике, а матема́тику я понима́ю (11) []{.blank}. «Не волну́йся, — сказа́л Михаи́л Ива́нович. — Я тебе́ (12) []{.blank}!» Це́лый ве́чер он (13) []{.blank} мне зада́ния. Он объясня́л гора́здо (14) []{.blank}, чем наш учи́тель, и я всё по́нял.

    На контро́льной я сде́лал все зада́ния. Учи́тель сказа́л, что моя́ рабо́та — са́мая (15) []{.blank} в кла́ссе, и поста́вил мне (16) []{.blank}. Ве́чером я (17) []{.blank} об э́том Михаи́лу Ива́новичу. Ка́жется, он был рад да́же (18) []{.blank}, чем я.

    Сейча́с Михаи́л Ива́нович уже́ (19) []{.blank} и опя́ть гуля́ет со свое́й соба́кой. А в суббо́ту мы гуля́ем вме́сте: тепе́рь мы (20) []{.blank}.
    :::
  passage_zh: |
    **邻居**

    我们家隔壁住着米哈伊尔·伊万诺维奇。他八十岁了。以前他在学校当老师：四十年里他每天都在课堂上讲数学。现在他一个人住，可是并不寂寞：他有一条大狗。每天早上他都和狗在公园里散步。

    十一月米哈伊尔·伊万诺维奇病了：发高烧，嗓子疼。医生说他不能出去散步。可是狗每天都得出去遛！于是米哈伊尔·伊万诺维奇给我打电话，问我能不能遛他的狗。我说可以。

    从那以后我比平时起得早，先带狗去公园，然后去上学。狗起初不愿意跟我走：它在等自己的主人。可是一个星期以后，它见到我已经很高兴了。

    有一天晚上我在米哈伊尔·伊万诺维奇家。他问我今天为什么不笑。我回答说，明天有数学测验，可我数学学得不好。“别着急，”米哈伊尔·伊万诺维奇说，“我来帮你！”他给我讲了一整晚的题。他讲得比我们老师好得多，我全听懂了。

    测验时我把题全做出来了。老师说我的卷子是全班最好的，给了我五分。晚上我把这件事告诉了米哈伊尔·伊万诺维奇。他好像比我还高兴。

    现在米哈伊尔·伊万诺维奇已经好了，又和自己的狗一起散步了。星期六我们一起散步：现在我们是朋友了。
  why: 第 1 空：下半句说他四十年天天 [объясня́л на уро́ке матема́тику]{.ru}，在课堂上讲数学的是老师：[учи́телем]{.ru}；医生、工程师、司机不上课。第 2 空：一个人住，按说会寂寞，后面却说 [ему́ не ску́чно]{.ru}，前后是转折，用 [но]{.ru}；[поэ́тому]{.ru} 把“一个人住”当成“不寂寞”的原因，不合情理，[и́ли]{.ru}、[е́сли]{.ru} 也不对。第 3 空：和狗在公园里做的事，下文反复说遛狗，用 [гуля́ет]{.ru}；[рабо́тает]{.ru}、[обе́дает]{.ru}、[у́чится]{.ru} 都和狗不相干。第 4 空：病了，“高烧”是 [высо́кая температу́ра]{.ru}；[цена́]{.ru}、[пого́да]{.ru}、[оце́нка]{.ru} 都和生病无关。第 5 空：下一句 [Но соба́ке ну́жно гуля́ть ка́ждый день!]{.ru} 用 [Но]{.ru} 表示转折，说明医生的话是“不能出去”：[нельзя́]{.ru}；[на́до]{.ru}、[мо́жно]{.ru}、[ну́жно]{.ru} 和后面的转折对不上。第 6 空：后面说他问“我能不能遛他的狗”，电话是打给“我”的：[мне]{.ru}；四个代词都是第三格，要看下文才能选。第 7 空：“我”要先遛狗再上学，早上得早起，用 [ра́ньше]{.ru}；[по́зже]{.ru} 和要多做一件事的情况相反，[ху́же]{.ru}、[ме́ньше]{.ru} 不说起床的时间。第 8 空：狗不愿跟“我”走，是在等它原来的主人：[хозя́ина]{.ru}；狗不会等医生、售货员或邻居。第 9 空：[Но]{.ru} 和前一句“不愿意跟我走”相对，一周后它已经喜欢“我”了：[ра́да]{.ru}；[больна́]{.ru}、[занята́]{.ru}、[гото́ва]{.ru} 都构不成这种对照。第 10 空：“我”接下来说的是明天测验、数学不好，是在发愁，所以他问“我”为什么不笑：[улыба́юсь]{.ru}；[пла́ваю]{.ru}、[рису́ю]{.ru}、[курю́]{.ru} 和后面的回答接不上。第 11 空：“我”为测验发愁，又需要别人帮忙，说明数学不好：[пло́хо]{.ru}；[отли́чно]{.ru}、[хорошо́]{.ru}、[бы́стро]{.ru} 都不会让人发愁。第 12 空：他教了四十年数学，接着就给“我”讲了一晚上的题，说的是“我来帮你”：[помогу́]{.ru}；[позвоню́]{.ru}、[подарю́]{.ru}、[отве́чу]{.ru} 都和下文不符。第 13 空：下一句说 [Он объясня́л…]{.ru}，他是在给“我”讲题：[объясня́л]{.ru}；[продава́л]{.ru}、[покупа́л]{.ru}、[дари́л]{.ru} 不合情理。第 14 空：结果是 [я всё по́нял]{.ru}，他比老师讲得好：[лу́чше]{.ru}；[ху́же]{.ru} 意思相反，[ме́ньше]{.ru}、[по́зже]{.ru} 不能说明为什么全听懂了。第 15 空：下文老师给了五分，说明这份卷子是全班最好的：[лу́чшая]{.ru}；[ста́рая]{.ru}、[пуста́я]{.ru}、[ма́ленькая]{.ru} 都不是给五分的理由。第 16 空：卷子最好，得的是五分 [пятёрку]{.ru}；[тро́йку]{.ru} 和“最好”矛盾，[спра́вку]{.ru}、[откры́тку]{.ru} 不是分数。第 17 空：“我”把得了五分的事讲给他听：[рассказа́л]{.ru} 和 [об э́том]{.ru} 搭配；[прочита́л]{.ru}、[сыгра́л]{.ru}、[купи́л]{.ru} 都不能接 [об э́том Михаи́лу Ива́новичу]{.ru}。第 18 空：[да́же]{.ru} 表示超出预料，他“比我还高兴”：[бо́льше]{.ru}；[ме́ньше]{.ru} 和 [да́же]{.ru} 的语气不合，[ху́же]{.ru}、[по́зже]{.ru} 不说高兴的程度。第 19 空：他又能自己遛狗了，说明病好了：[здоро́в]{.ru}；[бо́лен]{.ru} 和“又出去散步”矛盾，[за́нят]{.ru}、[гото́в]{.ru} 不合文意。第 20 空：他们本来就是邻居，[тепе́рь]{.ru} 说的是新的关系：成了朋友 [друзья́]{.ru}；[сосе́ди]{.ru} 一开始就是，不用 [тепе́рь]{.ru}，[колле́ги]{.ru}、[студе́нты]{.ru} 不符合事实。
  items:
  - options: [врачо́м, инжене́ром, води́телем, учи́телем]
    answer: учи́телем
  - options: [но, поэ́тому, и́ли, е́сли]
    answer: но
  - options: [рабо́тает, гуля́ет, обе́дает, у́чится]
    answer: гуля́ет
  - options: [цена́, пого́да, температу́ра, оце́нка]
    answer: температу́ра
  - options: [нельзя́, на́до, мо́жно, ну́жно]
    answer: нельзя́
  - options: [ему́, мне, ей, им]
    answer: мне
  - options: [по́зже, ху́же, ме́ньше, ра́ньше]
    answer: ра́ньше
  - options: [врача́, продавца́, хозя́ина, сосе́да]
    answer: хозя́ина
  - options: [больна́, ра́да, занята́, гото́ва]
    answer: ра́да
  - options: [улыба́юсь, пла́ваю, рису́ю, курю́]
    answer: улыба́юсь
  - options: [отли́чно, хорошо́, бы́стро, пло́хо]
    answer: пло́хо
  - options: [позвоню́, подарю́, отве́чу, помогу́]
    answer: помогу́
  - options: [продава́л, объясня́л, покупа́л, дари́л]
    answer: объясня́л
  - options: [ху́же, ме́ньше, лу́чше, по́зже]
    answer: лу́чше
  - options: [лу́чшая, ста́рая, пуста́я, ма́ленькая]
    answer: лу́чшая
  - options: [тро́йку, пятёрку, спра́вку, откры́тку]
    answer: пятёрку
  - options: [рассказа́л, прочита́л, сыгра́л, купи́л]
    answer: рассказа́л
  - options: [ме́ньше, ху́же, по́зже, бо́льше]
    answer: бо́льше
  - options: [бо́лен, за́нят, здоро́в, гото́в]
    answer: здоро́в
  - options: [сосе́ди, колле́ги, студе́нты, друзья́]
    answer: друзья́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Запи́ска**

    В суббо́ту И́горь встал по́здно, в оди́ннадцать часо́в. В кварти́ре бы́ло ти́хо: ма́мы и па́пы не́ было до́ма. На ку́хне на столе́ лежа́ла запи́ска:

    «И́горь! Мы на да́че. Ве́чером у нас бу́дут го́сти. Купи́, пожа́луйста, хлеб, я́блоки и большо́й торт. Ма́ма».

    И́горь поза́втракал и пошёл в магази́н, кото́рый нахо́дится ря́дом с до́мом. Хлеб и я́блоки он купи́л, но то́рта в магази́не не́ было. Тогда́ И́горь пое́хал на авто́бусе в центр, в большу́ю бу́лочную. Там бы́ли то́рты, но была́ и дли́нная о́чередь. И́горь стоя́л в о́череди полчаса́. Наконе́ц он купи́л торт и верну́лся домо́й.

    В шесть часо́в ма́ма и па́па ещё не верну́лись. И́горь позвони́л ма́ме:

    — Ма́ма, где вы? Ско́ро бу́дут го́сти!

    — Каки́е го́сти? — спроси́ла ма́ма. — Мы на да́че и вернёмся то́лько за́втра.

    — А запи́ска? Ты написа́ла, что ве́чером у нас бу́дут го́сти и что ну́жен торт.

    Ма́ма засмея́лась:

    — И́горь, э́ту запи́ску я написа́ла в про́шлую суббо́ту! Го́сти бы́ли у нас неде́лю наза́д, а ты тогда́ был у ба́бушки. Почему́ запи́ска ещё лежи́т на столе́, я не зна́ю.

    И́горь посмотре́л на большо́й торт и позвони́л своему́ дру́гу Серге́ю: «Серге́й, ты свобо́ден ве́чером? У меня́ есть большо́й торт!»
    :::
  passage_zh: |
    **便条**

    星期六伊戈尔起得很晚，十一点才起床。家里静悄悄的：爸爸妈妈都不在家。厨房的桌子上放着一张便条：

    “伊戈尔！我们在别墅。晚上家里有客人。请买面包、苹果和一个大蛋糕。妈妈。”

    伊戈尔吃过早饭，就去了家旁边的商店。面包和苹果买到了，可是商店里没有蛋糕。于是伊戈尔坐公共汽车去市中心的一家大面包店。那儿有蛋糕，可也排着长队。伊戈尔排了半个小时的队，终于买到了蛋糕，回到了家。

    到了六点，爸爸妈妈还没有回来。伊戈尔给妈妈打电话：

    “妈妈，你们在哪儿？客人快来了！”

    “什么客人？”妈妈问，“我们在别墅，明天才回去。”

    “那便条呢？你写着晚上家里有客人，要买蛋糕。”

    妈妈笑了：

    “伊戈尔，这张便条是我上个星期六写的！客人一个星期以前就来过了，那时候你在奶奶家。便条怎么还在桌子上，我也不知道。”

    伊戈尔看了看那个大蛋糕，给他的朋友谢尔盖打了电话：“谢尔盖，你晚上有空吗？我这儿有一个大蛋糕！”
  why: 第 1 题，[И́горь встал по́здно, в оди́ннадцать часо́в]{.ru}。第 2 题，家旁边的商店没有蛋糕，他 [пое́хал на авто́бусе в центр, в большу́ю бу́лочную]{.ru}，在那儿买到了。第 3 题，推断题：妈妈说 [э́ту запи́ску я написа́ла в про́шлую суббо́ту]{.ru}，这张便条是一个星期以前的；伊戈尔以为是今天写的。第 4 题，推断题：伊戈尔买蛋糕是照便条做的，他对妈妈说 [Ты написа́ла, что … ну́жен торт]{.ru}；妈妈并没有打电话叫他买，是他后来自己打的电话。第 5 题，推断题：客人不会来，爸爸妈妈明天才回来，伊戈尔看着大蛋糕给朋友打电话、问他晚上有没有空，接下来多半是和朋友一起吃蛋糕。
  items:
  - stem: В суббо́ту И́горь встал ___.
    options: [по́здно, ра́но, в семь часо́в, в де́вять часо́в]
    answer: по́здно
  - stem: Торт И́горь купи́л ___.
    options: [в магази́не ря́дом с до́мом, в бу́лочной в це́нтре, на ры́нке, в кафе́]
    answer: в бу́лочной в це́нтре
  - stem: Запи́ску ма́ма написа́ла ___.
    options: [в пя́тницу, сего́дня у́тром, в про́шлую суббо́ту, вчера́ ве́чером]
    answer: в про́шлую суббо́ту
  - stem: И́горь купи́л торт, потому́ что ___.
    options: [он о́чень лю́бит торт, он прочита́л об э́том в запи́ске, ма́ма позвони́ла ему́, у него́ был день рожде́ния]
    answer: он прочита́л об э́том в запи́ске
  - stem: Ве́чером И́горь, наве́рное, ___.
    options: [пое́дет на да́чу, ку́пит ещё оди́н торт, бу́дет есть торт с дру́гом, бу́дет ждать ма́му и па́пу]
    answer: бу́дет есть торт с дру́гом
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的书信，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    Дорога́я ма́ма!

    Извини́, что я давно́ не писа́ла. В октябре́ я начала́ рабо́тать: тепе́рь я официа́нтка в кафе́ ря́дом с университе́том. Я рабо́таю три ве́чера в неде́лю: в пя́тницу, в суббо́ту и в воскресе́нье. Домо́й я возвраща́юсь по́здно, в оди́ннадцать часо́в, и у меня́ совсе́м нет вре́мени. Но не волну́йся: в други́е дни я ка́ждый ве́чер занима́юсь в библиоте́ке, а вчера́ получи́ла пятёрку по грамма́тике.

    Тепе́рь я живу́ в друго́й ко́мнате. Она́ бо́льше, чем ста́рая, и в ней тепле́е. Моя́ сосе́дка по ко́мнате — студе́нтка из Пеки́на. Она́ у́чит ру́сский язы́к, а я у неё — кита́йский. Кита́йский язы́к гора́здо трудне́е, чем англи́йский, но мне о́чень интере́сно. Ве́чером мы ча́сто пьём чай и разгова́риваем по-ру́сски и по-кита́йски.

    Ты спра́шиваешь, не ску́чно ли мне в Москве́. Нет! В про́шлое воскресе́нье у́тром мы с сосе́дкой бы́ли в Третьяко́вской галере́е. А в декабре́ на́ша гру́ппа пое́дет в Петербу́рг.

    Ма́ма, ты пи́шешь, что па́па опя́ть лежи́т в посте́ли и не хо́дит на рабо́ту. Как он себя́ чу́вствует? Кака́я у него́ температу́ра? Скажи́ ему́, что ну́жно пить горя́чий чай с мёдом и бо́льше спать.

    Е́сли в декабре́ у меня́ бу́дет вре́мя, я пое́ду домо́й на два дня.

    Передава́й приве́т па́пе и ба́бушке.

    Твоя́ Да́ша
    :::
  passage_zh: |
    亲爱的妈妈：

    对不起，我很久没写信了。十月我开始打工了：现在我在大学旁边的一家咖啡馆当服务员。我一个星期上三个晚上的班：星期五、星期六和星期天。我晚上很晚才回家，十一点钟，一点儿时间都没有。不过你别担心：其他几天我每天晚上都在图书馆学习，昨天语法还得了五分。

    现在我换了一个房间。它比原来那间大，也更暖和。我的室友是一个北京来的女生。她跟我学俄语，我跟她学汉语。汉语比英语难得多，可是我觉得很有意思。晚上我们常常一起喝茶，用俄语和汉语聊天。

    你问我在莫斯科闷不闷。不闷！上个星期天上午我和室友去了特列季亚科夫画廊。十二月我们班还要去彼得堡。

    妈妈，你信里说爸爸又卧床了，没去上班。他觉得怎么样？体温多少度？告诉他要喝热的蜂蜜茶，多睡觉。

    要是十二月我有时间，我就回家待两天。

    代我向爸爸和奶奶问好。

    你的达莎
  why: 第 1 题，推断题：信一开头道歉很久没写信，接着说她开始打工，每周三个晚上要上班到很晚，[у меня́ совсе́м нет вре́мени]{.ru}；信里没说她生病或回过家。第 2 题，[Я рабо́таю три ве́чера в неде́лю]{.ru}，就是星期五、星期六和星期天。第 3 题，[Она́ бо́льше, чем ста́рая, и в ней тепле́е]{.ru}，所以不是更小、更冷。第 4 题，[Она́ у́чит ру́сский язы́к, а я у неё — кита́йский]{.ru}，[у неё]{.ru} 指的是室友，达莎跟室友学汉语。第 5 题，推断题：爸爸卧床、不上班，达莎问他体温多少、让他喝蜂蜜茶多睡觉，可见爸爸病了。
  items:
  - stem: Да́ша до́лго не писа́ла ма́ме, потому́ что ___.
    options: [у неё бы́ло ма́ло вре́мени, она́ была́ больна́, она́ е́здила домо́й, у неё не́ было телефо́на]
    answer: у неё бы́ло ма́ло вре́мени
  - stem: Да́ша рабо́тает в кафе́ ___.
    options: [ка́ждый ве́чер, ка́ждое у́тро, то́лько в понеде́льник, три ве́чера в неде́лю]
    answer: три ве́чера в неде́лю
  - stem: Но́вая ко́мната Да́ши ___, чем ста́рая.
    options: [бо́льше, ме́ньше, холодне́е, ху́же]
    answer: бо́льше
  - stem: Кита́йский язы́к Да́ша у́чит ___.
    options: [в университе́те, у свое́й сосе́дки, в кафе́, в Пеки́не]
    answer: у свое́й сосе́дки
  - stem: Па́па Да́ши сейча́с, наве́рное, ___.
    options: [рабо́тает в Москве́, у́чит кита́йский язы́к, бо́лен, е́дет к Да́ше]
    answer: бо́лен
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的天气预报，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Прогно́з пого́ды на неде́лю: Москва́, ноя́брь**

    | | пого́да | гра́дусов |
    |---|---|---|
    | понеде́льник | дождь, ве́тер | +3 |
    | вто́рник | дождь | +2 |
    | среда́ | снег, ве́тер | 0 |
