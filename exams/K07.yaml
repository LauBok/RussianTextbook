  passage_zh: |
    娜塔莎！

    我今天上班到八点，爸爸出差到星期五。汤在炉子上，鱼在冰箱上层的架子上。

    科利亚六点要去游泳。他的泳帽挂在浴室里：他又把它忘在那儿了。还要跟他说：外面零下十五度，不戴暖和的帽子可不行！

    晚上请陪他复习复习数学：明天他有测验。

    奶奶来过电话：星期天她等你和我去吃馅饼。

    我七点打电话。

    妈妈
  why: 第 1 空：[до]{.ru} 要求第二格，[во́семь]{.ru} 的第二格是 [восьми́]{.ru}，重音在词尾（第 68 课）。第 2 空：同样是 [до]{.ru} + 第二格，阴性 [пя́тница]{.ru} 变 [пя́тницы]{.ru}；不要照着第 1 空写成数词的词尾（第 37、68 课）。第 3 空：[на]{.ru} 表示“在……上面”，用第六格：[на плите́]{.ru}，重音在词尾（第 11、66 课）。第 4 空：[на]{.ru} + 第六格，形容词和名词都要变：[на ве́рхней по́лке]{.ru}；[ве́рхний]{.ru} 是软变化，阴性第六格是 [-ей]{.ru}，不是 [-ой]{.ru}（第 18、66 课）。第 5 空：泳帽现在还挂在那儿，用现在时；主语 [ша́почка]{.ru} 是第三人称单数，第二变位：[виси́т]{.ru}（第 66 课）。第 6 空：[без]{.ru} 要求第二格：[без тёплой ша́пки]{.ru}；本单元学了第五格，容易写成 [тёплой ша́пкой]{.ru}（第 37 课）。第 7 空：请对方做事用命令式，对 [ты]{.ru} 说；带 [-ся]{.ru} 的动词命令式在 [-й]{.ru} 后加 [-ся]{.ru}：[занима́йся]{.ru}；写成 [занима́ешься]{.ru} 就成了陈述句（第 38、46 课）。第 8 空：[занима́ться]{.ru} 要求第五格：[матема́тикой]{.ru}；前面的 [с ним]{.ru} 是“和他一起”，不要误以为 [матема́тика]{.ru} 的格由 [с]{.ru} 决定（第 63 课）。第 9 空：[нас с тобо́й]{.ru}“你和我”，[с]{.ru} + 第五格，[ты]{.ru} 的第五格是 [тобо́й]{.ru}（第 62 课）。第 10 空：说的是将来的一次通话，用完成体将来时 [позвоню́]{.ru}；写成不定式或过去时都不对（第 43、57 课）。
