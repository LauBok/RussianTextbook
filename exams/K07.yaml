- id: e8
  type: translate
  task: 补全对话：根据括号里的中文提示，用俄语写出对话中缺少的一句。
  points: 5
  why: 每题 5 分：句子结构和关键语法点正确得 5 分；评分要点里的关键语法点错一处扣 2 分，其他小错（个别词尾、重音位置不计）每处扣 1 分，扣完为止。
  items:
  - zh: '[— С кем ты был в теа́тре?]{.ru}（和娜塔莎还有她弟弟。）'
    accept:
    - С Ната́шей и её бра́том.
    - С Ната́шей и с её бра́том.
    - С Ната́шей и её мла́дшим бра́том.
    - Я был в теа́тре с Ната́шей и её бра́том.
    - Я был с Ната́шей и её бра́том.
    rubric:
    - '[с]{.ru} 后用第五格：[Ната́шей]{.ru}、[бра́том]{.ru}，两个名词都要变（第 61、62 课）'
    - “她的”用 [её]{.ru}，不变格（第 8 课）
  - zh: '[— Кем ты хо́чешь стать?]{.ru}（我想当医生，像我妈妈一样。）'
    accept:
    - Я хочу́ стать врачо́м, как моя́ ма́ма.
    - Я хочу́ стать врачо́м, как ма́ма.
    - Врачо́м, как моя́ ма́ма.
    - Врачо́м, как ма́ма.
    rubric:
    - '[стать]{.ru} 后用第五格 [врачо́м]{.ru}，重音在词尾（第 64 课）'
    - “像……一样”用 [как]{.ru}，后面的 [моя́ ма́ма]{.ru} 用第一格（第 64 课）
  - zh: '[— Когда́ рабо́тает ва́ша поликли́ника?]{.ru}（从早上八点到晚上六点。）'
    accept:
    - С восьми́ утра́ до шести́ ве́чера.
    - Она́ рабо́тает с восьми́ утра́ до шести́ ве́чера.
    - Поликли́ника рабо́тает с восьми́ утра́ до шести́ ве́чера.
    - С восьми́ до шести́.
    rubric:
    - '[с … до …]{.ru} 后数词用第二格：[восьми́]{.ru}、[шести́]{.ru}，重音在词尾（第 68 课）'
    - “早上”“晚上”用第二格 [утра́]{.ru}、[ве́чера]{.ru}，省略不扣分（第 51 课）
  - zh: '[— Ско́лько челове́к рабо́тает в ва́шем кафе́?]{.ru}（我们咖啡馆有十二个人工作。）'
    accept:
    - В на́шем кафе́ рабо́тает двена́дцать челове́к.
    - В на́шем кафе́ рабо́тают двена́дцать челове́к.
    - У нас в кафе́ рабо́тает двена́дцать челове́к.
    - У нас в кафе́ рабо́тают двена́дцать челове́к.
    - В на́шем кафе́ двена́дцать челове́к.
    - Двена́дцать челове́к.
    rubric:
    - '[двена́дцать]{.ru} 后用 [челове́к]{.ru}，不用 [люде́й]{.ru}，也不用 [челове́ка]{.ru}（第 35 课）'
    - “在我们咖啡馆”用 [в]{.ru} + 第六格 [в на́шем кафе́]{.ru}，[кафе́]{.ru} 是中性不变格名词，物主代词用中性第六格 [на́шем]{.ru}（第 19、61 课）
  - zh: '[— Почему́ ты не ешь торт?]{.ru}（谢谢，我已经吃了一块了。）'
    accept:
    - Спаси́бо, я уже́ съел кусо́к.
    - Спаси́бо, я уже́ съе́ла кусо́к.
    - Спаси́бо, я уже́ съел оди́н кусо́к.
    - Спаси́бо, я уже́ съе́ла оди́н кусо́к.
    - Спаси́бо, я уже́ съел кусо́к то́рта.
    - Спаси́бо, я уже́ съе́ла кусо́к то́рта.
    rubric:
    - 已经吃完一块，强调结果，用完成体过去时 [съел / съе́ла]{.ru}；写成 [ел]{.ru} 扣 2 分（第 45 课）
    - 过去时按说话人的性别变：男性 [съел]{.ru}，女性 [съе́ла]{.ru}（第 17 课）
  - zh: '[— Ве́ра, что ты пода́ришь ма́ме?]{.ru}（我送她一条暖和的围巾。）'
    accept:
    - Я подарю́ ей тёплый шарф.
    - Подарю́ ей тёплый шарф.
    - Я подарю́ ма́ме тёплый шарф.
    - Ма́ме я подарю́ тёплый шарф.
    - Ей я подарю́ тёплый шарф.
    rubric:
    - 问句是完成体将来时，回答也用 [подарю́]{.ru}；写成现在时 [дарю́]{.ru} 扣 1 分（第 43、51 课）
    - 送给谁用第三格 [ей]{.ru}，送什么用第四格 [тёплый шарф]{.ru}，阳性非动物名词第四格同第一格（第 23、51、52 课）
