    options: [ря́дом со стадио́ном, напро́тив бассе́йна, за катко́м, над библиоте́кой]
    answer: ря́дом со стадио́ном
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Моя́ пе́рвая зима́ в Москве́**

    Я из Шанха́я. У нас зимо́й тепло́, и снег идёт ре́дко. Поэ́тому, когда́ в Москве́ шёл пе́рвый снег, я был так рад, что до́лго гуля́л в па́рке.

    Но пото́м ста́ло тру́дно. Дни коро́ткие: в де́вять утра́ ещё темно́, а в четы́ре опя́ть ночь. И хо́лодно: в январе́ бы́ло ми́нус три́дцать. Одна́жды я гуля́л без ша́пки, и мне бы́ло о́чень хо́лодно. Сосе́дка, ста́рая ба́бушка, уви́дела меня́ и сказа́ла: «Без ша́пки зимо́й гуля́ть нельзя́!» Я сра́зу купи́л тёплую ша́пку и шарф.

    Тепе́рь на заня́тия я е́зжу на метро́ — под землёй тепло́. С дру́гом мы ката́емся на катке́, а пото́м пьём горя́чий чай с мёдом — так де́лает моя́ сосе́дка. Зима́ в Москве́ дли́нная, но тепе́рь она́ мне нра́вится.
    :::
