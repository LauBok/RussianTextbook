  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Хокке́й**

    Вчера́ ве́чером Ко́ля и его́ па́па (1) []{.blank} (сиде́ть) в гости́ной и смотре́ли хокке́й. Ко́ля давно́ интересу́ется (2) []{.blank} (хокке́й) и ка́ждую сре́ду занима́ется в (3) []{.blank} (спорти́вный клуб).

    Па́па Ко́ли рабо́тает (4) []{.blank} (води́тель) авто́буса, но в де́тстве он то́же игра́л в хокке́й со (5) []{.blank} (ста́рший брат). Вчера́ «Спарта́к» опя́ть (6) []{.blank} (проигра́ть), но сего́дня Ко́ле уже́ не (7) []{.blank} (гру́стный): сего́дня у него́ игра́ на катке́ в па́рке.

    По́сле обе́да Ко́ля и па́па (8) []{.blank} (е́хать) в парк на (9) []{.blank} (трамва́й). Игра́ продолжа́ется с трёх до (10) []{.blank} (пять).
    :::
  passage_zh: |
    **冰球**

    昨天晚上科利亚和爸爸坐在客厅里看冰球。科利亚早就对冰球感兴趣，每个星期三都在体育俱乐部训练。

    科利亚的爸爸是公共汽车司机，可小时候他也和哥哥一起打冰球。昨天“斯巴达克”又输了，可今天科利亚已经不难过了：今天他自己在公园的冰场上有比赛。

    午饭后科利亚和爸爸坐有轨电车去公园。比赛从三点打到五点。
  why: 第 1 空：和后面的 [смотре́ли]{.ru} 并列，说的是昨天晚上的事，主语是两个人，用过去时复数 [сиде́ли]{.ru}（第 17 课）。第 2 空：[интересова́ться]{.ru} 要求第五格，[хокке́й]{.ru} 以 [-й]{.ru} 结尾，第五格词尾 [-ем]{.ru}：[хокке́ем]{.ru}（第 61、63 课）。第 3 空：[в]{.ru} + 第六格表示处所，形容词和名词都要变：[в спорти́вном клу́бе]{.ru}（第 18 课）。第 4 空：[рабо́тать]{.ru} 后表示职业的名词用第五格；[води́тель]{.ru} 以 [-ь]{.ru} 结尾，第五格是 [води́телем]{.ru}（第 64、68 课）。第 5 空：[с]{.ru} + 第五格，形容词阳性第五格词尾 [-им]{.ru}：[со ста́ршим бра́том]{.ru}；[ст]{.ru} 前前置词写成 [со]{.ru}（第 65、66 课）。第 6 空：说的是昨天那场比赛的结果，用完成体过去时；主语 [«Спарта́к»]{.ru} 是阳性：[проигра́л]{.ru}（第 42、63 课）。第 7 空：无人称句，主体 [Ко́ле]{.ru} 用第三格，谓语用副词 [гру́стно]{.ru}（第 58、63 课）。第 8 空：说的是今天午饭后乘车去一次，主语是两个人，用定向动词现在时复数 [е́дут]{.ru}；[е́здят]{.ru} 表示经常往返（第 24、25 课）。第 9 空：乘交通工具用 [на]{.ru} + 第六格 [трамва́е]{.ru}（第 67 课）。第 10 空：[до]{.ru} 要求第二格，[пять → пяти́]{.ru}，重音移到词尾（第 68 课）。
