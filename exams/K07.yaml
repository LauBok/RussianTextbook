- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Профе́ссия Ири́ны**

    Ири́на пять лет рабо́тала программи́стом в большо́м институ́те. Рабо́та была́ хоро́шая, но це́лый день она́ сиде́ла пе́ред компью́тером, и ей бы́ло ску́чно.

    На рабо́ту она́ е́здила на трамва́е. Води́телем там был ста́рый весёлый челове́к: он всегда́ говори́л пассажи́рам «До́брое у́тро!» и расска́зывал им о го́роде. Ири́на слу́шала и смея́лась.

    Одна́жды он сказа́л ей: «Э́то мой после́дний ме́сяц. Мне уже́ шестьдеся́т пять лет, тепе́рь я бу́ду отдыха́ть на да́че». Ири́на ду́мала об э́том це́лый ве́чер.

    Че́рез год она́ ста́ла води́телем трамва́я. Роди́тели её не понима́ли: «Почему́? Ты же программи́ст!» Но Ири́на ра́да. В трамва́е шу́мно, зато́ ей не ску́чно. И ка́ждое у́тро она́ говори́т пассажи́рам «До́брое у́тро!» — как её ста́рый води́тель.
    :::
  glossary:
  - {ru: пассажи́р, pos: m, zh: 乘客}
  - {ru: одна́жды, pos: adv., zh: 有一次}
  - {ru: после́дний, pos: adj., zh: 最后的}
  - {ru: же, pos: part., zh: 可是，不是……吗（加强语气）}
  passage_zh: |
    **伊琳娜的职业**

    伊琳娜在一家大研究所当了五年程序员。工作不错，可她整天坐在电脑前，觉得很无聊。

    她坐电车上班。电车司机是个快活的老人：总对乘客说“早上好！”，给大家讲城里的事。伊琳娜听着就笑。

    有一次他对她说：“这是我最后一个月了。我都六十五了，以后要去别墅歇着了。”伊琳娜为这事想了一晚上。

    一年后，她当上了电车司机。父母不理解：“为什么？你可是程序员啊！”可伊琳娜很高兴。电车里很吵，但她不觉得无聊。每天早上她都对乘客说“早上好！”——就像那位老司机一样。
  why: 第 1 题，第一句 [пять лет рабо́тала программи́стом в большо́м институ́те]{.ru}。第 2 题，老司机说 [Э́то мой после́дний ме́сяц]{.ru}，他要退休了；文中没说他买别墅、生病或改行。第 3 题是推断题：父母说 [Ты же программи́ст!]{.ru}，他们不理解的是她放着程序员不做；文中没说她住得远或不想工作。第 4 题，最后一句 [ка́ждое у́тро она́ говори́т пассажи́рам «До́брое у́тро!»]{.ru}；坐在电脑前是她以前的事。第 5 题是概括题：她坐电车时喜欢那位快活的老司机和他的工作，老司机要退休，她就接了这份工作；文中没说她缺钱，父母也不赞成。
  items:
  - stem: Ра́ньше Ири́на рабо́тала ___.
    options: [в шко́ле, на заво́де, в институ́те, в трамва́е]
    answer: в институ́те
  - stem: Ста́рый води́тель ___.
    options: [купи́л да́чу, после́дний ме́сяц рабо́тал на трамва́е, стал программи́стом, был бо́лен]
    answer: после́дний ме́сяц рабо́тал на трамва́е
  - stem: 'Роди́тели не понима́ли Ири́ну: ___.'
    options: [ра́ньше она́ была́ программи́стом, она́ живёт далеко́, она́ не хоте́ла рабо́тать, она́ ча́сто смеётся]
    answer: ра́ньше она́ была́ программи́стом
  - stem: Тепе́рь Ири́на ка́ждое у́тро ___.
    options: [сиди́т пе́ред компью́тером, говори́т пассажи́рам «До́брое у́тро!», е́здит на рабо́ту на метро́, отдыха́ет на да́че]
    answer: говори́т пассажи́рам «До́брое у́тро!»
  - stem: 'Ири́на ста́ла води́телем трамва́я: ___.'
    options: [ей нра́вились ста́рый води́тель и его́ рабо́та, ей нужны́ бы́ли де́ньги, так хоте́ли роди́тели, она́ не уме́ла рабо́тать на компью́тере]
    answer: ей нра́вились ста́рый води́тель и его́ рабо́та
