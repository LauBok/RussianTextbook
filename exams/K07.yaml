lesson: K07
heading: 第七套
range: L01-L69
total: 150
names: [Ли́за, Ири́на, Андре́й, Ко́ля, Ната́ша, Ве́ра, Оле́г]
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：开门要用钥匙：[без ключа́]{.ru}；四个选项都是 [без]{.ru} 后的第二格，语法都通，只能靠意思选（第 37 课）。第 2 题：天已经晚了，明天早上还要上学，孩子们应该在“睡觉”[спят]{.ru}；[игра́ют]{.ru}、[гуля́ют]{.ru}、[чита́ют]{.ru} 都和“该睡了”的语境不合（第 7 课）。第 3 题：[о]{.ru} + 第六格，[он]{.ru} 的第六格是 [нём]{.ru}；[него́]{.ru} 是第二、四格，[ему́]{.ru} 是第三格（第 13 课）。第 4 题：[в]{.ru} + 第六格，[тот]{.ru} 的阳性第六格是 [том]{.ru}；后面的 [а не в э́том]{.ru} 也是第六格（第 19 课）。第 5 题：发烧是客观原因，“不能”用 [мочь]{.ru}：[не мо́жет]{.ru}；[не уме́ет]{.ru} 表示不会、没学过，和“发烧”这个原因不搭（第 27 课）。第 6 题：[сейча́с]{.ru} 说的是此刻正在去，别墅在城外很远，要乘车，用定向动词 [е́дет]{.ru}；[е́здит]{.ru} 表示经常往返（第 24、25 课）。第 7 题：[у]{.ru} 后用第二格，[ты]{.ru} 的第二格是 [тебя́]{.ru}；回答里的 [у меня́]{.ru} 也是第二格（第 31 课）。第 8 题：工程师 [стро́ит]{.ru} 的是桥 [мосты́]{.ru}；书、歌、信是“写”出来的，不说“建造”（第 64 课）。第 9 题：咖啡馆“在大学对面”：[напро́тив университе́та]{.ru}；[по́сле]{.ru} 表示时间“在……以后”，[без]{.ru}“没有”，[из]{.ru}“从……里”，和 [нахо́дится]{.ru}“位于”都搭配不上（第 36、37 课）。第 10 题：“在学校上学”用 [учи́ться]{.ru}，第三人称单数 [у́чится]{.ru}；[учи́ть]{.ru}、[изуча́ть]{.ru} 后面要带学习的内容（第 15、38 课）。第 11 题：问句 [Что ты де́лал]{.ru} 问的是昨晚做了什么事，回答也用过去时 [Смотре́л]{.ru}；[Смотрю́]{.ru} 是现在时，[Посмотрю́]{.ru} 是将来时，[Смотре́ть]{.ru} 是不定式，都和 [вчера́]{.ru} 不配（第 17、42 课）。第 12 题：将来“过多久”用 [че́рез]{.ru} + 第四格：[че́рез два часа́]{.ru}；[наза́д]{.ru} 指过去，而且放在后面；[по́сле]{.ru}、[до]{.ru} 要求第二格（第 47 课）。第 13 题：“在某月”用 [в]{.ru} + 第六格：[в ноябре́]{.ru}（第 48 课）。第 14 题：请别人做事用命令式，[помы́ть]{.ru} 的命令式是 [помо́й]{.ru}；[помы́ть]{.ru} 是不定式，[помо́ет]{.ru} 是将来时（第 46、54 课）。第 15 题：[мяч]{.ru} 是阳性，短尾形容词用 [ну́жен]{.ru}（第 55 课）。第 16 题：“加……”用 [с]{.ru} + 第五格，[варе́нье → варе́ньем]{.ru}；中性以 [-е]{.ru} 结尾的名词第五格词尾是 [-ем]{.ru}（第 61 课）。第 17 题：[с]{.ru} + 第五格，[она́]{.ru} 的第五格是 [ней]{.ru}；问的是娜塔莎，不能用阳性 [с ним]{.ru}；[неё]{.ru} 是第二、四格（第 62 课）。第 18 题：前半句说她读得很多，感兴趣的是文学 [литерату́рой]{.ru}；四个选项都是第五格，[интересова́ться]{.ru} 后都能用，只能靠意思选（第 63 课）。第 19 题：懂英语和汉语，想当的自然是翻译 [перево́дчицей]{.ru}；其他三个职业和懂外语没有关系（第 64 课）。第 20 题：[с]{.ru} + 第五格，阴性物主代词第五格是 [мое́й]{.ru}，和后面的 [ста́рой учи́тельницей]{.ru} 一致（第 65 课）。第 21 题：灯“挂”在桌子上方：[над столо́м]{.ru}；[под]{.ru}、[за]{.ru}、[пе́ред]{.ru} 也要求第五格，语法都通，但灯挂着只能在上方（第 66 课）。第 22 题：乘交通工具用 [на]{.ru} + 第六格：[на трамва́е]{.ru}；[на трамва́й]{.ru} 是第四格，表示“上电车”（第 67 课）。第 23 题：[до]{.ru} 要求第二格，[семь]{.ru} 的第二格是 [семи́]{.ru}；[седьмо́го]{.ru} 是序数词，[семью́]{.ru} 是第五格（第 68 课）。第 24 题：“在冬天”用副词 [зимо́й]{.ru}，不用前置词（第 69 课）。第 25 题：对方提议一起去溜冰，同意时说“很乐意！” [С удово́льствием!]{.ru}；[Пожа́луйста]{.ru} 用来回答道谢（第 3、63 课）。
  items:
  - stem: Без ___ нельзя́ откры́ть дверь.
    options: [кни́ги, су́мки, ключа́, ша́пки]
    answer: ключа́
  - stem: 'Уже́ по́здно, де́ти ___: у́тром им на́до в шко́лу.'
    options: [игра́ют, спят, гуля́ют, чита́ют]
    answer: спят
  - stem: — Ты зна́ешь Оле́га? — Да, сестра́ ча́сто расска́зывает о ___.
    options: [него́, ему́, он, нём]
    answer: нём
  - stem: Мой друг живёт в ___ до́ме, а не в э́том.
    options: [том, тот, ту, те]
    answer: том
  - stem: Брат сего́дня не ___ игра́ть в футбо́л, у него́ температу́ра.
    options: [мо́жет, уме́ет, мо́жешь, уме́ют]
    answer: мо́жет
  - stem: Сейча́с сестра́ ___ на да́чу. Да́ча далеко́, за го́родом.
    options: [идёт, е́здит, е́дет, хо́дит]
    answer: е́дет
  - stem: — У ___ есть брат? — Нет, у меня́ есть сестра́.
    options: [ты, тебе́, тобо́й, тебя́]
    answer: тебя́
  - stem: Мой оте́ц — инжене́р, он стро́ит ___.
    options: [кни́ги, мосты́, пе́сни, пи́сьма]
    answer: мосты́
  - stem: Кафе́ нахо́дится ___ университе́та.
    options: [напро́тив, по́сле, без, из]
    answer: напро́тив
  - stem: Мой мла́дший брат ___ в шко́ле.
    options: [у́чит, изуча́ет, учи́ться, у́чится]
    answer: у́чится
  - stem: — Что ты де́лал вчера́ ве́чером? — ___ телеви́зор.
    options: [Смотре́ть, Смотрю́, Смотре́л, Посмотрю́]
    answer: Смотре́л
  - stem: — Когда́ ты бу́дешь до́ма? — ___ два часа́.
    options: [Наза́д, Че́рез, По́сле, До]
    answer: Че́рез
  - stem: Ве́ра родила́сь ___.
    options: [в ноя́брь, ноябре́, в ноябре́, на ноябре́]
    answer: в ноябре́
  - stem: Ко́ля, ___ ру́ки, пожа́луйста! Сейча́с бу́дем обе́дать.
    options: [помо́й, помы́ть, помо́ет, помо́ю]
    answer: помо́й
  - stem: Бра́ту ___ но́вый мяч.
    options: [нужна́, ну́жен, нужны́, ну́жно]
    answer: ну́жен
  - stem: Я люблю́ блины́ ___.
    options: [с варе́нье, с варе́нья, с варе́нью, с варе́ньем]
    answer: с варе́ньем
  - stem: — Ты идёшь в кино́ с Ната́шей? — Да, я иду́ ___.
    options: [с ним, с неё, с ней, с на́ми]
    answer: с ней
  - stem: Сестра́ мно́го чита́ет, она́ интересу́ется ру́сской ___.
    options: [му́зыкой, литерату́рой, ку́хней, пого́дой]
    answer: литерату́рой
  - stem: Ве́ра хорошо́ зна́ет англи́йский и кита́йский языки́ и хо́чет стать ___.
    options: [перево́дчицей, медсестро́й, арти́сткой, води́телем]
    answer: перево́дчицей
  - stem: Вчера́ я до́лго разгова́ривал по телефо́ну с ___ ста́рой учи́тельницей.
    options: [моя́, мою́, моём, мое́й]
    answer: мое́й
  - stem: На ку́хне ___ столо́м виси́т ла́мпа.
    options: [под, над, за, пе́ред]
    answer: над
  - stem: До ста́нции метро́ мы е́дем ___.
    options: [на трамва́й, в трамва́й, на трамва́е, трамва́й]
    answer: на трамва́е
  - stem: Библиоте́ка рабо́тает с девяти́ утра́ до ___ ве́чера.
    options: [семи́, семь, седьмо́го, семью́]
    answer: семи́
  - stem: ___ в Москве́ ча́сто идёт снег.
    options: [Зима́, Зи́му, Зимы́, Зимо́й]
    answer: Зимо́й
  - stem: — Дава́й в суббо́ту ката́ться на катке́! — ___
    options: [Пожа́луйста!, С удово́льствием!, Ничего́!, Пока́!]
    answer: С удово́льствием!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Тру́дное у́тро**

    Коне́ц (1) []{.blank}. На у́лице ми́нус два́дцать. У́тром Ли́за ждёт трамва́й на остано́вке. Сего́дня у неё контро́льная по (2) []{.blank}, и она́ (3) []{.blank}.

    Ря́дом с остано́вкой стои́т маши́на, а под маши́ной сиди́т ма́ленький се́рый котёнок. Ему́ о́чень (4) []{.blank}. Вот и трамва́й. Ли́за (5) []{.blank} котёнка, и они́ вме́сте е́дут в шко́лу. В трамва́е котёнок сиди́т у неё под (6) []{.blank}: там ему́ тепло́.

    В шко́ле контро́льная уже́ начала́сь: Ли́за (7) []{.blank}. Учи́тельница матема́тики о́чень (8) []{.blank}. «Почему́ ты опозда́ла?» — спра́шивает она́. Ли́за ничего́ не говори́т и (9) []{.blank} ей котёнка. Обы́чно учи́тельница не улыба́ется, но сего́дня она́ (10) []{.blank}: «Сади́сь, пиши́! А котёнок бу́дет сиде́ть под мои́м (11) []{.blank}: там (12) []{.blank}, ря́дом батаре́я».

    Ли́за пи́шет контро́льную, но ду́мает то́лько о (13) []{.blank}. По́сле шко́лы они́ опя́ть е́дут на (14) []{.blank}, но тепе́рь домо́й. Ма́ма не (15) []{.blank}: «Кто бу́дет покупа́ть ему́ ры́бу?» — «Я!» — (16) []{.blank} Ли́за.

    Тепе́рь котёнок живёт у них. Днём он спит на (17) []{.blank}, а ве́чером (18) []{.blank} с Ли́зой. Ма́ма то́же его́ (19) []{.blank}: ве́чером он ча́сто спит ря́дом с ней. А контро́льную Ли́за написа́ла (20) []{.blank}: учи́тельница сказа́ла ей «Молоде́ц!».
    :::
  passage_zh: |
    **艰难的早晨**

    一月底。外面零下二十度。早上丽莎在车站等有轨电车。今天她有数学测验，她很着急。

    车站旁边停着一辆汽车，汽车底下蹲着一只灰色的小猫。它冻坏了。电车来了。丽莎抱起小猫，和它一起坐车去学校。在电车上，小猫待在她的外套里面：那儿暖和。

    到了学校，测验已经开始了：丽莎迟到了。数学老师非常严格。“你为什么迟到？”她问。丽莎什么也没说，把小猫给她看。老师平时从来不笑，可今天她笑出了声：“坐下，写吧！小猫就待在我的桌子底下：那儿暖和，旁边就是暖气片。”

    丽莎写着测验，心里却只想着小猫。放学后她和小猫又坐上电车，这回是回家。妈妈不太高兴：“谁给它买鱼呀？”——“我！”丽莎回答。

    现在小猫就住在她们家了。白天它睡在暖气片上，晚上和丽莎一起玩。妈妈也喜欢它：晚上它常常睡在妈妈身边。至于测验，丽莎考得很好：老师对她说“真棒！”。
  why: 第 1 空：外面零下二十度，后文又有暖气、外套，是冬天，只能是“一月”[января́]{.ru}；七月、八月、六月是夏天。第 2 空：后文说 [Учи́тельница матема́тики]{.ru} 在监考、问她为什么迟到，可见是数学测验：[по матема́тике]{.ru}；其他三门课文中都没有出现。第 3 空：今天有测验，后文又说她迟到了，所以她现在“着急”[спеши́т]{.ru}；[спит]{.ru}、[отдыха́ет]{.ru} 和“在车站等车”矛盾，[смеётся]{.ru} 没有缘由。第 4 空：零下二十度，小猫蹲在车底下，是“冷”[хо́лодно]{.ru}；后面放进外套里才说 [там ему́ тепло́]{.ru}，正好对照。第 5 空：后面说“它们一起坐车去学校”，丽莎是把小猫“抱起来”带走了：[берёт]{.ru}；[ви́дит]{.ru}、[ждёт]{.ru}、[слы́шит]{.ru} 都不能说明小猫为什么会跟她一起走。第 6 空：在电车上、而且“那儿暖和”，小猫是待在她的外套里：[под ку́рткой]{.ru}；电车里没有汽车，[под столо́м]{.ru}、[под доско́й]{.ru} 不合情境。第 7 空：冒号前说测验已经开始了，后面老师又问 [Почему́ ты опозда́ла?]{.ru}，所以是“迟到了”[опозда́ла]{.ru}。第 8 空：老师一开口就追问迟到的原因，后面又说她 [обы́чно … не улыба́ется]{.ru}，是个“严格”的老师：[стро́гая]{.ru}；[весёлая]{.ru} 和“平时不笑”矛盾。第 9 空：丽莎不说话，用小猫来解释迟到，是把小猫“给老师看”：[пока́зывает]{.ru}；后文小猫跟她回了家，不是送给老师（[да́рит]{.ru}）。第 10 空：[но]{.ru} 和“平时不笑”构成转折，今天她“笑了”：[смеётся]{.ru}；其他三个动词构不成转折，也引不出后面那句宽容的话。第 11 空：老师说的是教室里自己的讲桌底下：[под мои́м столо́м]{.ru}；教室里没有桥，[под телефо́ном]{.ru}、[под словарём]{.ru} 放不下一只猫。第 12 空：旁边就是暖气片，所以那里“暖和”[тепло́]{.ru}，这也是老师让小猫待在那儿的理由。第 13 空：[но]{.ru} 表示转折：写的是测验，心里想的却不是测验，而是小猫 [о котёнке]{.ru}；[матема́тике]{.ru}、[контро́льной]{.ru}、[зада́нии]{.ru} 都是测验本身，构不成转折。第 14 空：[опя́ть]{.ru}“又”指早上坐过的交通工具——有轨电车：[на трамва́е]{.ru}。第 15 空：妈妈接着问“谁给它买鱼”，是有顾虑、“不太高兴”：[не ра́да]{.ru}；[не занята́]{.ru}、[не свобо́дна]{.ru}、[не больна́]{.ru} 和这句问话接不上。第 16 空：妈妈提问，丽莎说“我！”，是“回答”[отвеча́ет]{.ru}。第 17 空：小猫怕冷，前文两次说暖气片旁边暖和，白天它睡在暖气片上：[на батаре́е]{.ru}；它已经住在家里，不会睡在街上、车站或汽车上。第 18 空：小猫晚上和丽莎一起“玩”[игра́ет]{.ru}；[рабо́тает]{.ru}、[у́чится]{.ru}、[занима́ется]{.ru} 不能用来说小猫。第 19 空：[то́же]{.ru} 呼应丽莎对小猫的喜爱，冒号后面说小猫常睡在妈妈身边，可见妈妈也“喜欢”它：[лю́бит]{.ru}；这和前面“不太高兴”形成对比。第 20 空：老师说“真棒！”，测验考得“好”[хорошо́]{.ru}；[пло́хо]{.ru} 和夸奖矛盾，[до́лго]{.ru}、[ти́хо]{.ru} 不是夸奖的理由。
  items:
  - options: [ию́ля, а́вгуста, января́, ию́ня]
    answer: января́
  - options: [матема́тике, литерату́ре, исто́рии, му́зыке]
    answer: матема́тике
  - options: [спит, смеётся, отдыха́ет, спеши́т]
    answer: спеши́т
  - options: [жа́рко, ве́село, интере́сно, хо́лодно]
    answer: хо́лодно
  - options: [берёт, ви́дит, ждёт, слы́шит]
    answer: берёт
  - options: [столо́м, маши́ной, ку́рткой, доско́й]
    answer: ку́рткой
  - options: [спала́, опозда́ла, проигра́ла, смея́лась]
    answer: опозда́ла
  - options: [весёлая, стро́гая, лени́вая, молода́я]
    answer: стро́гая
  - options: [пока́зывает, да́рит, мо́ет, и́щет]
    answer: пока́зывает
  - options: [спеши́т, спит, рабо́тает, смеётся]
    answer: смеётся
  - options: [мосто́м, телефо́ном, столо́м, словарём]
    answer: столо́м
  - options: [хо́лодно, тепло́, шу́мно, ску́чно]
    answer: тепло́
  - options: [котёнке, матема́тике, контро́льной, зада́нии]
    answer: котёнке
  - options: [такси́, метро́, трамва́е, маши́не]
    answer: трамва́е
  - options: [занята́, свобо́дна, больна́, ра́да]
    answer: ра́да
  - options: [спра́шивает, пи́шет, чита́ет, отвеча́ет]
