    answer: игра́ет
  - options: [лю́бит, ждёт, и́щет, зна́ет]
    answer: лю́бит
  - options: [пло́хо, хорошо́, до́лго, ти́хо]
    answer: хорошо́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Профе́ссия Ири́ны**

    Ири́не два́дцать де́вять лет. Она́ живёт в Новосиби́рске. Её оте́ц рабо́тает инжене́ром на заво́де, а ма́ма — учи́тельницей матема́тики в шко́ле. Мла́дший брат Ири́ны ещё у́чится в шко́ле и занима́ется пла́ванием.

    В де́тстве Ири́на хоте́ла стать врачо́м. Но в шко́ле она́ о́чень люби́ла матема́тику, и пото́м она́ ста́ла программи́стом. Пять лет она́ рабо́тала программи́стом в большо́м институ́те. Рабо́та была́ хоро́шая, но це́лый день Ири́на сиде́ла пе́ред компью́тером, и ей бы́ло ску́чно.

    Ка́ждое у́тро она́ е́здила на рабо́ту на трамва́е и смотре́ла на води́теля. «Вот интере́сная рабо́та!» — ду́мала она́.

    Год наза́д Ири́на ста́ла води́телем трамва́я. Роди́тели не понима́ли её, но Ири́на не жале́ет. Тепе́рь она́ рабо́тает с шести́ утра́ до трёх часо́в дня. В трамва́е всегда́ шу́мно, зато́ ей не ску́чно: ка́ждый день она́ ви́дит весь го́род.
    :::
  passage_zh: |
    **伊琳娜的职业**

    伊琳娜二十九岁。她住在新西伯利亚。她的爸爸在工厂当工程师，妈妈在中学教数学。伊琳娜的弟弟还在上中学，练游泳。

    小时候伊琳娜想当医生。可是上学时她非常喜欢数学，后来当了程序员。她在一个大研究所当了五年程序员。工作不错，可是伊琳娜整天坐在电脑前，觉得很无聊。

    每天早上她坐有轨电车去上班，看着司机。“这才是有意思的工作！”她想。

    一年前伊琳娜当上了有轨电车司机。父母不理解她，可伊琳娜并不后悔。现在她从早上六点工作到下午三点。电车里总是很吵，不过她不觉得无聊：每天她都能看到整座城市。
  why: 第 1 题，[а ма́ма — учи́тельницей матема́тики]{.ru}；当工程师的是爸爸。第 2 题，[В де́тстве Ири́на хоте́ла стать врачо́м]{.ru}；程序员和司机是她后来的职业。第 3 题，[Пять лет она́ рабо́тала программи́стом]{.ru}。第 4 题是推断题：她说程序员的工作 [была́ хоро́шая]{.ru}，可是 [ей бы́ло ску́чно]{.ru}，每天看着电车司机觉得那才有意思，于是改行；文中没说她失业，父母也并不支持（[Роди́тели не понима́ли её]{.ru}），喜欢数学是她当程序员的原因。第 5 题是概括题：全文从她的家庭、童年愿望讲到她怎样从程序员改当电车司机，标题也是 [Профе́ссия Ири́ны]{.ru}；家人和电车都只是其中的细节。
  items:
  - stem: Ма́ма Ири́ны рабо́тает ___.
    options: [врачо́м, инжене́ром, программи́стом, учи́тельницей]
    answer: учи́тельницей
  - stem: В де́тстве Ири́на хоте́ла стать ___.
    options: [врачо́м, учи́тельницей, программи́стом, води́телем]
    answer: врачо́м
  - stem: Пять лет Ири́на рабо́тала ___.
    options: [инжене́ром, врачо́м, программи́стом, води́телем]
    answer: программи́стом
  - stem: 'Ири́на ста́ла води́телем трамва́я: ___.'
    options: [у неё не́ было рабо́ты, так хоте́ли роди́тели, ей нра́вится матема́тика, на ста́рой рабо́те ей бы́ло ску́чно]
    answer: на ста́рой рабо́те ей бы́ло ску́чно
  - stem: Гла́вное в э́том расска́зе — ___.
    options: [семья́ Ири́ны, трамва́и Новосиби́рска, но́вая профе́ссия Ири́ны, рабо́та программи́ста]
    answer: но́вая профе́ссия Ири́ны
- id: e4
  type: choice
