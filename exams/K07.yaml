lesson: K07
heading: 第七套
range: L01-L69
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：谓语 [лежа́т]{.ru} 是复数，主语也要用复数 [ключи́]{.ru}；[мои́]{.ru} 也是复数（第 5、7 课）。第 2 题：主语 [де́ти]{.ru} 是复数，第二变位动词 [спать]{.ru} 第三人称复数是 [спят]{.ru}（第 7、35 课）。第 3 题：[о]{.ru} + 第六格，[он]{.ru} 的第六格是 [нём]{.ru}；[него́]{.ru} 是第二、四格，[ему́]{.ru} 是第三格（第 13 课）。第 4 题：[в]{.ru} + 第六格，[тот]{.ru} 的阳性第六格是 [том]{.ru}；后面的 [а не в э́том]{.ru} 也是第六格（第 19 课）。第 5 题：发烧是客观原因，“不能”用 [мочь]{.ru}：[не мо́жет]{.ru}；[не уме́ет]{.ru} 表示不会、没学过，和“发烧”这个原因不搭（第 27 课）。第 6 题：[сейча́с]{.ru} 说的是此刻正在去，别墅在城外很远，要乘车，用定向动词 [е́дет]{.ru}；[е́здит]{.ru} 表示经常往返（第 24、25 课）。第 7 题：[у]{.ru} 后用第二格，[ты]{.ru} 的第二格是 [тебя́]{.ru}；回答里的 [у меня́]{.ru} 也是第二格（第 31 课）。第 8 题：表示所属的 [отца́]{.ru} 是第二格，物主代词跟着用阳性第二格 [моего́]{.ru}（第 33、34 课）。第 9 题：[напро́тив]{.ru} 要求第二格：[напро́тив университе́та]{.ru}（第 37 课）。第 10 题：“在学校上学”用 [учи́ться]{.ru}，第三人称单数 [у́чится]{.ru}；[учи́ть]{.ru}、[изуча́ть]{.ru} 后面要带学习的内容（第 15、38 课）。第 11 题：问句 [Что ты де́лал]{.ru} 问的是昨晚做了什么事，回答也用过去时 [Смотре́л]{.ru}；[Смотрю́]{.ru} 是现在时，[Посмотрю́]{.ru} 是将来时，[Смотре́ть]{.ru} 是不定式，都和 [вчера́]{.ru} 不配（第 17、42 课）。第 12 题：将来“过多久”用 [че́рез]{.ru} + 第四格：[че́рез два часа́]{.ru}；[наза́д]{.ru} 指过去，而且放在后面；[по́сле]{.ru}、[до]{.ru} 要求第二格（第 47 课）。第 13 题：“在某月”用 [в]{.ru} + 第六格：[в ноябре́]{.ru}（第 48 课）。第 14 题：请别人做事用命令式，[помы́ть]{.ru} 的命令式是 [помо́й]{.ru}；[помы́ть]{.ru} 是不定式，[помо́ет]{.ru} 是将来时（第 46、54 课）。第 15 题：[мяч]{.ru} 是阳性，短尾形容词用 [ну́жен]{.ru}（第 55 课）。第 16 题：“加……”用 [с]{.ru} + 第五格，[варе́нье → варе́ньем]{.ru}；中性以 [-е]{.ru} 结尾的名词第五格词尾是 [-ем]{.ru}（第 61 课）。第 17 题：[с]{.ru} + 第五格，[она́]{.ru} 的第五格是 [ней]{.ru}；问的是安娜，不能用阳性 [с ним]{.ru}；[неё]{.ru} 是第二、四格（第 62 课）。第 18 题：[интересова́ться]{.ru} 要求第五格，阴性名词 [-а]{.ru} 变 [-ой]{.ru}：[литерату́рой]{.ru}（第 63 课）。第 19 题：[стать]{.ru} 后面的名词用第五格；由美是女性，用阴性名词 [перево́дчица]{.ru} 的第五格 [перево́дчицей]{.ru}（第 64 课）。第 20 题：[с]{.ru} + 第五格，阴性物主代词第五格是 [мое́й]{.ru}，和后面的 [ста́рой учи́тельницей]{.ru} 一致（第 65 课）。第 21 题：[над]{.ru} 要求第五格：[над столо́м]{.ru}，重音在词尾（第 66 课）。第 22 题：乘交通工具用 [на]{.ru} + 第六格：[на трамва́е]{.ru}；[на трамва́й]{.ru} 是第四格，表示“上电车”（第 67 课）。第 23 题：[до]{.ru} 要求第二格，[семь]{.ru} 的第二格是 [семи́]{.ru}；[седьмо́го]{.ru} 是序数词，[семью́]{.ru} 是第五格（第 68 课）。第 24 题：“在冬天”用副词 [зимо́й]{.ru}，不用前置词（第 69 课）。第 25 题：对方邀请，“很乐意！”说 [С удово́льствием!]{.ru}；[Пожа́луйста]{.ru} 用来回答道谢（第 3、63 课）。
  items:
  - stem: На столе́ лежа́т мои́ ___.
    options: [ключ, ключа́, ключи́, ключу́]
    answer: ключи́
  - stem: Уже́ по́здно, де́ти ___.
    options: [спит, спят, сплю, спим]
    answer: спят
  - stem: — Ты зна́ешь Пье́ра? — Да, А́нна ча́сто расска́зывает о ___.
    options: [него́, ему́, он, нём]
    answer: нём
  - stem: Мой друг живёт в ___ до́ме, а не в э́том.
    options: [том, тот, ту, те]
    answer: том
  - stem: Ми́ша сего́дня не ___ игра́ть в футбо́л, у него́ температу́ра.
    options: [мо́жет, уме́ет, мо́жешь, уме́ют]
    answer: мо́жет
  - stem: Сейча́с А́нна ___ на да́чу. Да́ча далеко́, за го́родом.
    options: [идёт, е́здит, е́дет, хо́дит]
    answer: е́дет
  - stem: — У ___ есть брат? — Нет, у меня́ есть сестра́.
    options: [ты, тебе́, тобо́й, тебя́]
    answer: тебя́
  - stem: Э́то маши́на ___ отца́.
    options: [мой, моего́, моему́, мои́м]
    answer: моего́
  - stem: Кафе́ нахо́дится напро́тив ___.
    options: [университе́та, университе́т, университе́те, университе́том]
    answer: университе́та
  - stem: Мой мла́дший брат ___ в шко́ле.
    options: [у́чит, изуча́ет, учи́ться, у́чится]
    answer: у́чится
  - stem: — Что ты де́лал вчера́ ве́чером? — ___ телеви́зор.
    options: [Смотре́ть, Смотрю́, Смотре́л, Посмотрю́]
    answer: Смотре́л
  - stem: — Когда́ ты бу́дешь до́ма? — ___ два часа́.
    options: [Наза́д, Че́рез, По́сле, До]
    answer: Че́рез
  - stem: Ю́ми родила́сь ___.
    options: [в ноя́брь, ноябре́, в ноябре́, на ноябре́]
    answer: в ноябре́
  - stem: Ми́ша, ___ ру́ки, пожа́луйста!
    options: [помо́й, помы́ть, помо́ет, помо́ю]
    answer: помо́й
  - stem: Ми́ше ___ но́вый мяч.
    options: [нужна́, ну́жен, нужны́, ну́жно]
    answer: ну́жен
  - stem: Ми́ша лю́бит блины́ ___.
    options: [с варе́нье, с варе́нья, с варе́нью, с варе́ньем]
    answer: с варе́ньем
  - stem: — Ты идёшь в кино́ с А́нной? — Да, я иду́ ___.
    options: [с ним, с неё, с ней, с на́ми]
    answer: с ней
  - stem: Пьер интересу́ется ру́сской ___.
    options: [литерату́ра, литерату́рой, литерату́ру, литерату́ре]
    answer: литерату́рой
  - stem: Ю́ми хо́чет стать ___.
    options: [перево́дчицей, перево́дчица, перево́дчицу, перево́дчице]
    answer: перево́дчицей
  - stem: Вчера́ я до́лго разгова́ривал по телефо́ну с ___ ста́рой учи́тельницей.
    options: [моя́, мою́, моём, мое́й]
    answer: мое́й
  - stem: На ку́хне над ___ виси́т ста́рая ла́мпа.
    options: [стол, столо́м, стола́, столе́]
    answer: столо́м
  - stem: До ста́нции метро́ мы е́дем ___.
    options: [на трамва́й, в трамва́й, на трамва́е, трамва́й]
    answer: на трамва́е
  - stem: Библиоте́ка рабо́тает с девяти́ утра́ до ___ ве́чера.
    options: [семи́, семь, седьмо́го, семью́]
    answer: семи́
  - stem: ___ в Москве́ ча́сто идёт снег.
    options: [Зима́, Зиму́, Зимы́, Зимо́й]
    answer: Зимо́й
  - stem: — Хо́чешь сыгра́ть со мной в ша́хматы? — ___
    options: [Пожа́луйста!, С удово́льствием!, Ничего́!, Пока́!]
    answer: С удово́льствием!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **На катке́**

    Коне́ц декабря́. В воскресе́нье у́тром Ван Лэй смо́трит в окно́: на у́лице хо́лодно, но со́лнечно, и ве́тра (1) []{.blank}. Сего́дня А́нна и Ми́ша хотя́т (2) []{.blank} его́ ката́ться. Като́к в па́рке, и они́ (3) []{.blank} туда́ на (4) []{.blank}.

    В трамва́е Ми́ша расска́зывает: «Зимо́й мы с А́нной (5) []{.blank} на като́к ка́ждое воскресе́нье».

    На катке́ уже́ ката́ются (6) []{.blank} и взро́слые. Ван Лэй ещё пло́хо (7) []{.blank}. Ми́ша ката́ется ря́дом с (8) []{.blank} и помога́ет (9) []{.blank}. А А́нна ката́ется о́чень (10) []{.blank}: она́ давно́ занима́ется (11) []{.blank}. Че́рез час Ван Лэ́ю уже́ (12) []{.blank}.

    Пото́м они́ пьют горя́чий чай с (13) []{.blank} в ма́леньком кафе́ напро́тив (14) []{.blank}. «Ты молоде́ц! — говори́т А́нна. — А ле́том я (15) []{.blank} тебя́ пла́вать».

    Ве́чером Ван Лэй пи́шет письмо́ (16) []{.blank}: «Ма́ма, тепе́рь я (17) []{.blank} ката́ться! Мне о́чень (18) []{.blank} ру́сская зима́. Ка́ждое воскресе́нье я бу́ду ката́ться с (19) []{.blank} и Ми́шей. Зима́ здесь дли́нная, она́ продолжа́ется с ноября́ до (20) []{.blank}».
    :::
  passage_zh: |
    **在溜冰场**

    十二月底。星期天早上王磊往窗外看：外面很冷，但阳光很好，也没有风。今天安娜和米沙想教他溜冰。溜冰场在公园里，他们坐有轨电车去那儿。

    在电车上米沙讲：“冬天我和安娜每个星期天都去溜冰场。”

    溜冰场上已经有孩子和大人在溜冰了。王磊还溜得不好。米沙在他旁边溜，帮着他。安娜溜得非常好：她很早就开始练体育了。一个小时以后王磊已经玩得很开心了。

    然后他们在溜冰场对面的小咖啡馆里喝加柠檬的热茶。“你真棒！”安娜说，“夏天我教你游泳。”

    晚上王磊给妈妈写信：“妈妈，我现在会溜冰了！我非常喜欢俄罗斯的冬天。每个星期天我都要和安娜、米沙一起去溜冰。这里的冬天很长，从十一月一直到三月。”
  why: 第 1 空：“没有风”用 [нет]{.ru} + 第二格 [ве́тра]{.ru}；全文是现在时，不用过去时 [не́ было]{.ru}；[есть]{.ru} 不能配第二格（第 32 课）。第 2 空：[хоте́ть]{.ru} 后接不定式 [научи́ть]{.ru}（第 26、69 课）。第 3 空：后面说坐电车，是乘车；今天去一次，用定向动词 [е́дут]{.ru}；[е́здят]{.ru} 表示经常往返（第 24、25 课）。第 4 空：乘交通工具用 [на]{.ru} + 第六格 [трамва́е]{.ru}（第 67 课）。第 5 空：[ка́ждое воскресе́нье]{.ru} 表示经常往返，用不定向动词；[мы с А́нной]{.ru} 指“我和安娜”，动词用 [мы]{.ru} 的形式 [е́здим]{.ru}（第 25、62 课）。第 6 空：和 [взро́слые]{.ru} 并列作主语，用复数第一格 [де́ти]{.ru}；[дете́й]{.ru} 是第二格（第 35 课）。第 7 空：主语 [Ван Лэй]{.ru} 是第三人称单数，[ката́ться]{.ru} 变为 [ката́ется]{.ru}，[-ся]{.ru} 不能丢（第 38、69 课）。第 8 空：[ря́дом с]{.ru} 要求第五格，[он → ним]{.ru}（第 62、66 课）。第 9 空：[помога́ть]{.ru} 要求第三格 [ему́]{.ru}，不用第四格 [его́]{.ru}（第 62 课）。第 10 空：修饰动词 [ката́ется]{.ru} 用副词 [хорошо́]{.ru}（第 4、7 课）。第 11 空：[занима́ться]{.ru} 要求第五格 [спо́ртом]{.ru}（第 63 课）。第 12 空：无人称句，主体 [Ван Лэ́ю]{.ru} 用第三格，谓语用副词 [ве́село]{.ru}（第 58 课）。第 13 空：“加柠檬”用 [с]{.ru} + 第五格 [лимо́ном]{.ru}（第 61 课）。第 14 空：[напро́тив]{.ru} 要求第二格；[като́к]{.ru} 变格时 [о]{.ru} 脱落：[катка́]{.ru}（第 37、69 课）。第 15 空：说的是夏天将来一次要教会，主语是 [я]{.ru}，用完成体将来时第一人称 [научу́]{.ru}（第 43、69 课）。第 16 空：写信给谁用第三格 [ма́ме]{.ru}（第 51 课）。第 17 空：“学会了、会”用 [уме́ть]{.ru}，主语 [я]{.ru}：[уме́ю]{.ru}（第 27 课）。第 18 空：主语 [зима́]{.ru} 是单数，用 [нра́вится]{.ru}；[люблю́]{.ru} 的主语要用第一格 [я]{.ru}，不能配 [мне]{.ru}（第 52 课）。第 19 空：[с]{.ru} + 第五格，[А́нна → А́нной]{.ru}，和后面的 [Ми́шей]{.ru} 一样（第 61、62 课）。第 20 空：[с … до …]{.ru} 两个前置词都要求第二格：[до ма́рта]{.ru}（第 68 课）。
  items:
  - options: [не, не́ было, нет, есть]
    answer: нет
  - options: [научи́ть, нау́чат, научи́ли, нау́чит]
    answer: научи́ть
  - options: [иду́т, е́здят, хо́дят, е́дут]
    answer: е́дут
  - options: [трамва́й, трамва́я, трамва́ем, трамва́е]
    answer: трамва́е
  - options: [е́здим, е́дем, е́здят, е́зжу]
    answer: е́здим
  - options: [ребёнок, дете́й, де́ти, де́тям]
    answer: де́ти
  - options: [ката́ться, ката́ется, ката́юсь, ката́ются]
    answer: ката́ется
  - options: [него́, ним, ему́, он]
    answer: ним
  - options: [ему́, его́, им, он]
    answer: ему́
  - options: [хоро́ший, хоро́шая, хоро́шее, хорошо́]
    answer: хорошо́
  - options: [спорт, спо́рта, спо́ртом, спо́рту]
    answer: спо́ртом
  - options: [весёлый, ве́село, весёлая, весёлые]
    answer: ве́село
  - options: [лимо́ном, лимо́н, лимо́на, лимо́не]
    answer: лимо́ном
  - options: [като́к, катке́, катка́, катко́м]
    answer: катка́
  - options: [научи́ла, нау́чит, научи́ть, научу́]
    answer: научу́
  - options: [ма́му, ма́мы, ма́мой, ма́ме]
    answer: ма́ме
  - options: [уме́ет, уме́ешь, уме́ю, уме́ть]
    answer: уме́ю
  - options: [нра́вятся, нра́вится, люблю́, лю́бит]
    answer: нра́вится
  - options: [А́нной, А́нна, А́нну, А́нне]
    answer: А́нной
  - options: [март, ма́рта, ма́рте, ма́ртом]
    answer: ма́рта
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Пьер и его́ мечта́**

    Пьер — францу́з. Ему́ два́дцать четы́ре го́да, в Москве́ он у́чится уже́ четы́ре ме́сяца. Его́ семья́ живёт во Фра́нции, в ма́леньком ста́ром го́роде. Оте́ц Пье́ра рабо́тает врачо́м в поликли́нике, а ма́ма — учи́тельницей в шко́ле. Ста́ршая сестра́ уже́ ста́ла журнали́сткой и живёт в друго́м го́роде.

    В де́тстве Пьер хоте́л стать арти́стом. Он занима́лся в театра́льном клу́бе, а ле́том игра́л в футбо́л с дру́гом. Его́ де́душка о́чень люби́л Росси́ю, и он дал Пье́ру рома́н «Война́ и мир». Пьер чита́л его́ це́лое ле́то, и ему́ о́чень понра́вилась ру́сская литерату́ра.

    Тепе́рь Пьер изуча́ет ру́сский язы́к и хо́чет стать перево́дчиком. Ка́ждый ве́чер он чита́ет ру́сские расска́зы со словарём. В суббо́ту он игра́ет в футбо́л с Ван Лэ́ем и Ми́шей, а в воскресе́нье хо́дит в теа́тр и́ли в музе́й.

    Ле́том Пьер бу́дет до́ма, во Фра́нции. Он уже́ купи́л пода́рки: ма́ме — ру́сский самова́р, а па́пе — ша́хматы.
    :::
  passage_zh: |
    **皮埃尔和他的梦想**

    皮埃尔是法国人。他二十四岁，在莫斯科已经学习四个月了。他家住在法国一座古老的小城里。皮埃尔的爸爸在诊所当医生，妈妈在中学当老师。姐姐已经当了记者，住在另一座城市。

    小时候皮埃尔想当演员。他在戏剧小组活动，夏天和朋友踢足球。他的爷爷非常喜欢俄罗斯。爷爷给了他一本《战争与和平》。皮埃尔读了一整个夏天，非常喜欢上了俄罗斯文学。

    现在皮埃尔学俄语，想当翻译。他每天晚上查着词典读俄语短篇小说。星期六他和王磊、米沙踢足球，星期天去剧院或博物馆。

    夏天皮埃尔要回法国家里。他已经买好了礼物：给妈妈一个俄罗斯茶炊，给爸爸一副国际象棋。
  why: 第 1 题，[Оте́ц Пье́ра рабо́тает врачо́м в поликли́нике]{.ru}；当老师的是妈妈。第 2 题，[Ста́ршая сестра́ уже́ ста́ла журнали́сткой]{.ru}。第 3 题，[В де́тстве Пьер хоте́л стать арти́стом]{.ru}；当翻译是他现在的梦想。第 4 题是推断题：爷爷给的《战争与和平》让他喜欢上了俄罗斯文学，所以现在学俄语、想当翻译；文中没有说爷爷是演员、送了词典或教他俄语。第 5 题是概括题：全文从皮埃尔的家庭讲到他小时候的愿望和现在的梦想，标题也是 [Пьер и его́ мечта́]{.ru}；法国小城、足球只是细节。
  items:
  - stem: Оте́ц Пье́ра рабо́тает ___.
    options: [учи́телем, инжене́ром, журнали́стом, врачо́м]
    answer: врачо́м
  - stem: Сестра́ Пье́ра ста́ла ___.
    options: [журнали́сткой, учи́тельницей, перево́дчицей, арти́сткой]
    answer: журнали́сткой
  - stem: В де́тстве Пьер хоте́л стать ___.
    options: [врачо́м, перево́дчиком, арти́стом, журнали́стом]
    answer: арти́стом
  - stem: 'Пьер изуча́ет ру́сский язы́к и хо́чет стать перево́дчиком: ___.'
    options: [его́ де́душка был арти́стом, его́ сестра́ живёт в Москве́, он лю́бит футбо́л, ему́ понра́вилась ру́сская литерату́ра]
    answer: ему́ понра́вилась ру́сская литерату́ра
  - stem: Гла́вное в э́том расска́зе — ___.
    options: [ма́ленький францу́зский го́род, футбо́л в Москве́, Пьер и его́ мечта́, ру́сский самова́р]
    answer: Пьер и его́ мечта́
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [А́нна]{.sp} Алло́, Ван Лэй? Приве́т! Ты сейча́с за́нят?

    [Ван Лэй]{.sp} Приве́т! Нет, свобо́ден. Я в библиоте́ке, но зада́ние я уже́ сде́лал.

    [А́нна]{.sp} Мы с Ю́ми идём в кино́ на но́вую коме́дию. Хо́чешь с на́ми?

    [Ван Лэй]{.sp} С удово́льствием! А когда́ начина́ется фильм?

    [А́нна]{.sp} В семь часо́в. Кинотеа́тр в це́нтре, мы е́дем туда́ на метро́.

    [Ван Лэй]{.sp} А где мне вас ждать?

    [А́нна]{.sp} Пе́ред кинотеа́тром, в полови́не седьмо́го. Биле́ты я уже́ купи́ла.

    [Ван Лэй]{.sp} Отли́чно! А Ми́ша идёт с ва́ми?

    [А́нна]{.sp} Нет, Ми́ша сего́дня до́ма: за́втра у него́ контро́льная по матема́тике. Он о́чень хоте́л с на́ми, но ма́ма сказа́ла: «Нельзя́!»

    [Ван Лэй]{.sp} Жаль!

    [А́нна]{.sp} Ничего́, в суббо́ту мы возьмём его́ с собо́й. Ой, и ещё: на у́лице си́льный ве́тер и идёт снег. Одева́йся тепло́!

    [Ван Лэй]{.sp} Хорошо́. До ве́чера!
    :::
  passage_zh: |
    ——喂，王磊？你好！你现在忙吗？

    ——你好！不忙，有空。我在图书馆，不过作业已经做完了。

    ——我和由美要去看一部新喜剧。想和我们一起去吗？

    ——很乐意！电影几点开始？

    ——七点。电影院在市中心，我们坐地铁去。

    ——那我在哪儿等你们？

    ——在电影院前面，六点半。票我已经买好了。

    ——太好了！米沙和你们一起去吗？

    ——不，米沙今天在家：他明天有数学测验。他非常想跟我们去，可妈妈说：“不行！”

    ——真可惜！

    ——没关系，星期六我们带他一起去。哦，还有：外面风很大，在下雪。穿暖和点儿！

    ——好的。晚上见！
  why: 第 1 题，[Я в библиоте́ке]{.ru}。第 2 题，[Мы с Ю́ми идём в кино́]{.ru}：[мы с Ю́ми]{.ru} 指“我和由美”（第 62 课）；米沙不去。第 3 题，[мы е́дем туда́ на метро́]{.ru}。第 4 题是推断题：电影七点开始，他们六点半（[в полови́не седьмо́го]{.ru}）在电影院前见面，所以离开演还有半小时。第 5 题是推断题：米沙很想去，是妈妈不让，因为明天有数学测验，所以他今天必须在家准备；他并没有生病，也不是不喜欢喜剧。
  items:
  - stem: Сейча́с Ван Лэй ___.
    options: [в библиоте́ке, до́ма, в кинотеа́тре, в кафе́]
    answer: в библиоте́ке
  - stem: А́нна идёт в кино́ ___.
    options: [с Ми́шей, с Ю́ми, с ма́мой, с Пье́ром]
    answer: с Ю́ми
  - stem: В кинотеа́тр они́ е́дут ___.
    options: [на метро́, на трамва́е, на авто́бусе, на такси́]
    answer: на метро́
  - stem: Ван Лэй ждёт А́нну и Ю́ми пе́ред кинотеа́тром. До фи́льма у них бу́дет ___.
    options: [час, два часа́, полчаса́, три часа́]
    answer: полчаса́
  - stem: 'Ми́ша сего́дня не идёт в кино́: ___.'
    options: [у него́ температу́ра, он не лю́бит коме́дии, у него́ нет биле́та, он до́лжен занима́ться]
    answer: он до́лжен занима́ться
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的体育俱乐部课表，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Спорти́вный клуб университе́та**

    Ты лю́бишь спорт? Занима́йся спо́ртом в на́шем клу́бе!

    | Заня́тия | Дни | Вре́мя | Где |
    |---|---|---|---|
    | пла́вание | понеде́льник, среда́ | 18.00—20.00 | бассе́йн |
    | футбо́л (апре́ль — ноя́брь) | вто́рник, четве́рг | 17.00—19.00 | стадио́н |
    | хокке́й (дека́брь — март) | вто́рник, четве́рг | 17.00—19.00 | като́к |
    | ша́хматы | пя́тница | 16.00—18.00 | аудито́рия 12 |

    На пла́вание на́до взять ша́пку: в бассе́йне без ша́пки пла́вать нельзя́. Мяч и ша́хматы у нас есть, их брать не на́до.

    Зимо́й на стадио́не хо́лодно и мно́го сне́га: с декабря́ до ма́рта вме́сто футбо́ла студе́нты игра́ют в хокке́й.

    Наш клуб нахо́дится ря́дом со стадио́ном, кабине́т но́мер 3. Звони́те нам по телефо́ну 345-67-89 и́ли пиши́те сообще́ния.
    :::
  passage_zh: |
    **大学体育俱乐部**

    你喜欢体育吗？来我们俱乐部锻炼吧！

    | 项目 | 日期 | 时间 | 地点 |
    |---|---|---|---|
    | 游泳 | 星期一、星期三 | 18:00—20:00 | 游泳池 |
    | 足球（四月—十一月） | 星期二、星期四 | 17:00—19:00 | 体育场 |
    | 冰球（十二月—三月） | 星期二、星期四 | 17:00—19:00 | 溜冰场 |
    | 国际象棋 | 星期五 | 16:00—18:00 | 12 号教室 |

    游泳要带泳帽：在游泳池里不戴帽子不能游泳。球和棋我们都有，不必自带。

    冬天体育场上冷，雪也多：从十二月到三月学生们不踢足球，改打冰球。

    我们俱乐部在体育场旁边，3 号办公室。请打电话 345-67-89 或发短信联系我们。
  why: 第 1 题，表里游泳是星期一、星期三。第 2 题，国际象棋 16:00—18:00，即 [с четырёх до шести́]{.ru}；数词用第二格（第 68 课）。第 3 题是推断题：星期三晚上是游泳课，[На пла́вание на́до взять ша́пку]{.ru}；球和棋俱乐部都有。第 4 题是推断题：一月在“十二月—三月”之间，星期二踢不了足球，打冰球。第 5 题，[Наш клуб нахо́дится ря́дом со стадио́ном]{.ru}。
  items:
  - stem: Пла́ванием мо́жно занима́ться ___.
    options: [во вто́рник и в четве́рг, в понеде́льник и в сре́ду, в пя́тницу, в суббо́ту]
    answer: в понеде́льник и в сре́ду
  - stem: Ша́хматы в клу́бе ___.
    options: [с пяти́ до семи́, с четырёх до шести́, с шести́ до восьми́, с десяти́ до двена́дцати]
    answer: с четырёх до шести́
  - stem: Вы хоти́те занима́ться в клу́бе в сре́ду ве́чером. Вам ну́жно взять ___.
    options: [мяч, ша́хматы, перча́тки, ша́пку]
    answer: ша́пку
  - stem: В январе́ во вто́рник студе́нты игра́ют ___.
    options: [в футбо́л, в ша́хматы, в хокке́й, на гита́ре]
    answer: в хокке́й
  - stem: Клуб нахо́дится ___.
    options: [ря́дом со стадио́ном, напро́тив бассе́йна, за катко́м, над библиоте́кой]
    answer: ря́дом со стадио́ном
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Москва́ зимо́й**

    Зима́ в Москве́ дли́нная. Снег ча́сто идёт уже́ в ноябре́, а та́ет то́лько в ма́рте и́ли в апре́ле. В январе́ на у́лице обы́чно ми́нус де́сять, но иногда́ моро́з — ми́нус два́дцать и́ли да́же ми́нус три́дцать.

    Но в кварти́рах всегда́ тепло́. В Москве́ отопле́ние рабо́тает с октября́ до ма́я, батаре́и горя́чие, и до́ма мо́жно ходи́ть в футбо́лке.

    На у́лице москвичи́ хо́дят в тёплой оде́жде: в пальто́ и́ли в ку́ртке, в ша́пке и в шарфе́. Без ша́пки зимо́й гуля́ть нельзя́ — так говоря́т все ру́сские ба́бушки.

    Зимо́й москвичи́ не сидя́т до́ма. Де́ти и взро́слые ката́ются на катке́ в па́рке, гуля́ют в лесу́ и́ли на да́че. Моско́вское метро́ рабо́тает с шести́ утра́ до ча́са но́чи. Под землёй тепло́, и зимо́й мно́гие е́здят на рабо́ту на метро́, а не на маши́не: на у́лицах снег.

    А ве́чером москвичи́ пьют до́ма горя́чий чай с лимо́ном и́ли с мёдом и вспомина́ют ле́то.
    :::
  passage_zh: |
    **冬天的莫斯科**

    莫斯科的冬天很长。常常十一月就下雪，雪要到三月或四月才化。一月外面一般零下十度，不过有时严寒到零下二十度，甚至零下三十度。

    可是公寓里总是很暖和。莫斯科的暖气从十月供到五月，暖气片很烫，在家里可以穿 T 恤。

    在外面，莫斯科人穿着暖和的衣服：大衣或外套，戴帽子、围巾。冬天不戴帽子不能出门——所有的俄罗斯奶奶都这么说。

    冬天莫斯科人不待在家里。孩子和大人在公园的溜冰场上溜冰，在树林里或别墅散步。莫斯科地铁从早上六点运营到夜里一点。地下很暖和，冬天很多人坐地铁上班，不开车：街上都是雪。

    晚上莫斯科人在家里喝加柠檬或蜂蜜的热茶，回忆夏天。
  why: 第 1 题，[Снег ча́сто идёт уже́ в ноябре́]{.ru}；[уже́]{.ru}“已经”说明十一月就开始下了。第 2 题，[отопле́ние рабо́тает с октября́ до ма́я]{.ru}。第 3 题是推断题：在家可以只穿 T 恤，是因为公寓里有暖气、[в кварти́рах всегда́ тепло́]{.ru}。第 4 题，[Моско́вское метро́ рабо́тает с шести́ утра́ до ча́са но́чи]{.ru}；数词、[час]{.ru} 都用第二格（第 68 课）。第 5 题是概括题：全文讲莫斯科冬天的天气、暖气、穿着和人们怎样过冬；地铁、茶都只是其中一段。
  items:
  - stem: В Москве́ снег ча́сто идёт уже́ ___.
    options: [в ноябре́, в октябре́, в декабре́, в ма́рте]
    answer: в ноябре́
  - stem: Отопле́ние в Москве́ рабо́тает ___.
    options: [с ноября́ до ма́рта, с декабря́ до апре́ля, с октября́ до ма́я, с сентября́ до ию́ня]
    answer: с октября́ до ма́я
  - stem: 'Зимо́й до́ма мо́жно ходи́ть в футбо́лке: ___.'
    options: [на у́лице тепло́, все ката́ются на катке́, все пьют горя́чий чай, в кварти́рах тепло́]
    answer: в кварти́рах тепло́
  - stem: Метро́ в Москве́ рабо́тает ___.
    options: [с семи́ утра́ до двена́дцати, с шести́ утра́ до ча́са но́чи, с пяти́ утра́ до ча́са но́чи, с шести́ утра́ до двух но́чи]
    answer: с шести́ утра́ до ча́са но́чи
  - stem: Гла́вное здесь — ___.
    options: [моско́вская зима́, моско́вское метро́, ру́сский чай, моско́вское ле́то]
    answer: моско́вская зима́
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Суббо́та**

    В суббо́ту у́тром Ива́н Серге́евич и Ван Лэй (1) []{.blank} (сиде́ть) в гости́ной и игра́ли в ша́хматы. Ван Лэй давно́ интересу́ется (2) []{.blank} (ша́хматы) и ка́ждую сре́ду занима́ется в (3) []{.blank} (ша́хматный клуб).

    Ива́н Серге́евич рабо́тает (4) []{.blank} (инжене́р) на заво́де, но в ша́хматы он игра́ет о́чень хорошо́. В де́тстве он ча́сто игра́л со (5) []{.blank} (ста́рший брат). Сего́дня Ван Лэй опя́ть (6) []{.blank} (проигра́ть), но ему́ не (7) []{.blank} (гру́стный).

    По́сле обе́да Ван Лэй, А́нна и Ми́ша (8) []{.blank} (е́хать) в парк на (9) []{.blank} (трамва́й). Там они́ ката́лись на катке́ с трёх до (10) []{.blank} (шесть).
    :::
  passage_zh: |
    **星期六**

    星期六上午伊万·谢尔盖耶维奇和王磊坐在客厅里下国际象棋。王磊早就对国际象棋感兴趣，每个星期三都在象棋俱乐部活动。

    伊万·谢尔盖耶维奇在工厂当工程师，可是棋下得非常好。小时候他常和哥哥下棋。今天王磊又输了，但他并不难过。

    午饭后王磊、安娜和米沙坐有轨电车去公园。他们在那里的溜冰场从三点溜到六点。
