- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  glossary:
  - {ru: ры́жий, pos: adj., zh: 棕红色的（猫）}
  - {ru: пры́гать, pos: impf., zh: 跳}
  - {ru: ры́бный ряд, zh: （市场上的）卖鱼的那一排}
  - {ru: пассажи́р, pos: m, zh: 乘客}
  - {ru: биле́т, zh: 这里指车票}
  passage: |
    ::: {.prose lang="ru"}
    **Пассажи́р без биле́та**

    Я рабо́таю води́телем трамва́я уже́ де́сять лет. Но тако́го пассажи́ра, как э́той зимо́й, у меня́ ещё не́ было.

    Ка́ждое у́тро на остано́вке «Садо́вая» в трамва́й сади́лся большо́й ры́жий кот. Он сиде́л ря́дом с две́рью и смотре́л в окно́. Пассажи́ры ему́ улыба́лись, ба́бушки дава́ли ему́ колбасу́, но колбасу́ он не ел. На тре́тьей остано́вке, «Ры́нок», дверь открыва́лась, и кот пры́гал на у́лицу.

    Я спра́шивала пассажи́ров: «Чей э́то кот?» Но они́ то́лько смея́лись: «Не наш!»

    В суббо́ту у меня́ был выходно́й, и я была́ на ры́нке. В ры́бном ряду́ я уви́дела на́шего кота́: он сиде́л ря́дом с продавщи́цей, и она́ дава́ла ему́ ры́бу.

    — Ваш кот? — спроси́ла я.

    — Не мой, — отве́тила продавщи́ца. — Э́то Ры́жик, он живёт на Садо́вой. Ка́ждое у́тро он здесь, а ве́чером е́дет домо́й. На трамва́е, коне́чно.

    Биле́та у Ры́жика, коне́чно, нет. Но е́здит он то́лько зимо́й: ле́том, говоря́т на ры́нке, он хо́дит пешко́м.
    :::
  passage_zh: |
    **没有车票的乘客**

    我开有轨电车已经十年了。可像今年冬天这样的乘客，我还从来没遇见过。

    每天早上，在“花园街”站都有一只棕红色的大猫上车。它就坐在车门旁边，看着窗外。乘客们冲它笑，老奶奶们给它香肠，可它不吃。到第三站“市场”，车门一开，猫就跳到街上去了。

    我问乘客：“这是谁的猫？”可大家只是笑：“不是我们的！”

    星期六我休息，去了趟市场。在卖鱼的那一排，我看见了我们那只猫：它坐在一个女售货员旁边，她正喂它鱼。

    “您的猫？”我问。

    “不是我的，”女售货员说，“这是小红，住在花园街。每天早上它都来这儿，晚上坐车回家。当然是坐电车。”

    车票小红当然没有。不过它只在冬天坐车：市场上的人说，夏天它是走着来的。
  why: 第 1 题，[на остано́вке «Садо́вая» в трамва́й сади́лся большо́й ры́жий кот]{.ru}；“市场”是它下车的站，最容易混。第 2 题是推断题：它在车上不吃老奶奶给的香肠，到了市场却吃女售货员的鱼——它是去市场吃鱼的；文中没说它病了或香肠不好。第 3 题，[В суббо́ту у меня́ был выходно́й, и я была́ на ры́нке]{.ru}：她是休息日去市场时看见猫的，不是上班的时候；在车上问乘客，大家只是笑，什么也不知道。第 4 题是推断题：文中没有直接说原因。结尾说它 [е́здит … то́лько зимо́й]{.ru}，夏天 [хо́дит пешко́м]{.ru}：路它走得了，冬天坐车只能是因为外面冷；夏天电车照样开，市场上也照样有鱼，这两个干扰项和全文矛盾；“夏天住别墅”文中没有。第 5 题是主旨题：全文讲司机怎样发现这只猫天天坐电车去市场；司机的工作、市场、售货员都只是故事里的细节；市场也不在花园街上，花园街是猫住的地方。
  items:
  - stem: Кот сади́лся в трамва́й ___.
    options: [на остано́вке «Ры́нок», на остано́вке «Садо́вая», ря́дом с па́рком, у ба́бушки]
    answer: на остано́вке «Садо́вая»
  - stem: 'Колбасу́ в трамва́е кот не ел, наве́рное, ___.'
    options: [он был бо́лен, колбаса́ была́ плоха́я, он ждал ры́бу на ры́нке, ба́бушки ему́ не нра́вились]
    answer: он ждал ры́бу на ры́нке
  - stem: Кота́ на ры́нке води́тель уви́дела ___.
    options: [на рабо́те, в выходно́й, у́тром в трамва́е, ве́чером с пассажи́рами]
    answer: в выходно́й
  - stem: 'Кот е́здит на трамва́е то́лько зимо́й: ___.'
    options: [ле́том нет трамва́я, зимо́й хо́лодно, ле́том на ры́нке нет ры́бы, ле́том он живёт на да́че]
    answer: зимо́й хо́лодно
  - stem: Э́тот расска́з — ___.
    options: [о рабо́те води́теля трамва́я, о ры́нке на Садо́вой у́лице, о ко́те в трамва́е, о продавщи́це ры́бы]
    answer: о ко́те в трамва́е
