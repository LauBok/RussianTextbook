  passage_zh: |
    **1.** 大学生辅导中小学生数学。可上门。晚上六点到九点。谢尔盖，8-916-245-17-30。

    **2.** 寻找下棋的伙伴。本人已退休，白天有空。在我家下，或在楼对面的公园里下。45 号房，彼得·伊里奇。

    **3.** 翻译，在中国工作过十年。教汉语，大人小孩都可以。星期二、星期四，五点到七点，在学校旁边的图书馆。薇拉，8-903-118-40-52。

    **4.** 昨天晚上我在“公园”电车站丢了一串钥匙，钥匙扣是蓝色的。捡到的人请按 12 号房的门铃。尼娜。
  why: 第 1 题，第 1 则启事：谢尔盖辅导中小学生数学，而且可以上门；薇拉教的是汉语。第 2 题是推断题：彼得·伊里奇留的联系方式是 [Кварти́ра 45]{.ru}，又说在 [па́рке напро́тив до́ма]{.ru} 下棋，可见他就住在这栋楼里；他白天有空，不是白天上班；启事里他是找人下棋，不是教人下棋。第 3 题，第 3 则：[Вто́рник и четве́рг, с пяти́ до семи́]{.ru}；“晚上六点到九点”是谢尔盖的时间，最容易看串行。第 4 题是推断题：“公园”是电车站的名字，钥匙是在车站丢的，不是在公园里；彼得·伊里奇的公园、薇拉的图书馆都是干扰。第 5 题是推断题：尼娜的启事里没有电话号码，只写了 [позвони́те … в кварти́ру 12]{.ru}，这里的 [звони́ть в кварти́ру]{.ru} 是“按某户的门铃”，和 [звони́ть в дверь]{.ru} 一样（第 54 课）；只看到 [позвони́те]{.ru} 就选“打电话”，是没注意后面接的是房号；启事里也没让人去车站等她或发短信。
