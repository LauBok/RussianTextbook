    ::: {.dialogue lang="ru"}
    [Серге́й]{.sp} Алло́, Андре́й? Приве́т! Ты сейча́с за́нят?

    [Андре́й]{.sp} Приве́т! Я ещё на рабо́те, но ско́ро бу́ду свобо́ден.

    [Серге́й]{.sp} Отли́чно! У меня́ есть два биле́та на хокке́й: сего́дня игра́ют «Спарта́к» и ЦСКА. Хо́чешь со мной?

    [Андре́й]{.sp} С удово́льствием! А когда́ начина́ется игра́?

    [Серге́й]{.sp} В семь три́дцать. Дворе́ц спо́рта далеко́, и мы е́дем туда́ на такси́: на метро́ до́лго.

    [Андре́й]{.sp} А где мы встреча́емся?

    [Серге́й]{.sp} У меня́ до́ма, в шесть три́дцать. На такси́ туда́ полчаса́.

    [Андре́й]{.sp} Хорошо́. А твой сын е́дет с на́ми?

    [Серге́й]{.sp} Нет. Он о́чень хоте́л, но у него́ температу́ра, и врач сказа́л: «Три дня до́ма!»

    [Андре́й]{.sp} Жаль!

    [Серге́й]{.sp} Ничего́, в суббо́ту «Спарта́к» опя́ть игра́ет, и мы возьмём его́ с собо́й. И ещё: там о́чень хо́лодно, ведь там лёд. Одева́йся тепло́!

    [Андре́й]{.sp} Хорошо́. До ве́чера!
    :::
  passage_zh: |
    ——喂，安德烈？你好！你现在忙吗？

    ——你好！我还在上班，不过很快就有空了。

    ——太好了！我有两张冰球票：今天“斯巴达克”对中央陆军。想跟我一起去吗？

    ——很乐意！比赛几点开始？

    ——七点半。体育馆很远，我们坐出租车去：坐地铁太慢。

    ——那我们在哪儿碰头？

    ——在我家，六点半。坐出租车过去要半小时。

    ——好的。你儿子跟我们一起去吗？

    ——不去。他非常想去，可是他发烧了，医生说：“在家待三天！”

    ——真可惜！

    ——没关系，星期六“斯巴达克”还有比赛，我们带他一起去。还有：那儿很冷，有冰嘛。穿暖和点儿！

    ——好的。晚上见！
  why: '第 1 题，[Я ещё на рабо́те]{.ru}。第 2 题，[У меня́ есть два биле́та на хокке́й]{.ru}；“斯巴达克”和中央陆军是冰球队。第 3 题，[мы е́дем туда́ на такси́: на метро́ до́лго]{.ru}；地铁是他们不坐的。第 4 题是推断题：六点半在谢尔盖家见面，坐出租车半小时，七点到体育馆；比赛七点半开始，所以还有半小时（[полчаса́]{.ru}）。第 5 题是推断题：儿子很想去，是因为发烧、医生让他在家待三天才去不了；他并不是不喜欢冰球，文中也没有提到测验或学习。'
