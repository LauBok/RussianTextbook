  passage: |
    ::: {.prose lang="ru"}
    **Пе́рвая игра́**

    У Ко́ли сего́дня пе́рвая игра́. Он давно́ интересу́ется (1) []{.blank} (хокке́й) и уже́ год занима́ется в (2) []{.blank} (спорти́вный клуб). Па́па то́же хоте́л посмотре́ть игру́, но он рабо́тает (3) []{.blank} (води́тель) трамва́я, и сего́дня у него́ рабо́та. «Извини́, меня́ не бу́дет», — сказа́л он, и Ко́ле ста́ло (4) []{.blank} (гру́стный).

    Игра́ начала́сь, но Ко́ля игра́л пло́хо: он ду́мал о (5) []{.blank} (па́па). И тут по у́лице ря́дом с (6) []{.blank} (парк) (7) []{.blank} (е́хать / е́здить) трамва́й и до́лго звони́л. Ко́ля посмотре́л: в окне́ трамва́я — па́па!

    По́сле э́того Ко́ля игра́л хорошо́, и его́ кома́нда не (8) []{.blank} (проигра́ть). Ве́чером оте́ц и сын до́лго (9) []{.blank} (сиде́ть) на ку́хне. «В де́тстве я то́же игра́л в хокке́й со (10) []{.blank} (ста́рший брат), — сказа́л па́па. — Дава́й в воскресе́нье игра́ть вме́сте!»
    :::
  glossary:
  - {ru: кома́нда, pos: f, zh: 队}
  passage_zh: |
    **第一场比赛**

    科利亚今天第一次参加比赛。他早就喜欢冰球，在体育俱乐部已经练了一年。爸爸也想来看比赛，可他是电车司机，今天得上班。“对不起，我去不了了。”他说。科利亚一下子难过起来。

    比赛开始了，科利亚却打得不好：他在想爸爸。正在这时，公园旁边的街上开过来一辆电车，铃声响了好久。科利亚一看：电车窗口里是爸爸！

    这以后科利亚打得很好，他们队没有输。晚上父子俩在厨房里坐了很久。“我小时候也和我哥哥一起打冰球，”爸爸说，“星期天咱们一起打吧！”
  why: 第 1 空：[интересова́ться]{.ru} 要求第五格：[хокке́ем]{.ru}（第 63 课）。第 2 空：[в]{.ru} + 第六格表示处所，形容词阳性第六格 [-ом]{.ru}：[в спорти́вном клу́бе]{.ru}（第 18 课）。第 3 空：[рабо́тать]{.ru} + 职业名词用第五格：[води́телем]{.ru}（第 64 课）。第 4 空：无人称句，主体 [Ко́ле]{.ru} 用第三格，谓语用副词 [гру́стно]{.ru}，不用形容词（第 58 课）。第 5 空：[о]{.ru} + 第六格，[па́па]{.ru} 按以 [-а]{.ru} 结尾的阴性名词变：[о па́пе]{.ru}（第 13 课）。第 6 空：[ря́дом с]{.ru} 要求第五格：[с па́рком]{.ru}（第 66 课）。第 7 空：电车当时正朝一个方向开过去，用定向动词过去时 [е́хал]{.ru}；[е́здил]{.ru} 表示经常往返或去过又回来（第 24、25 课）。第 8 空：[кома́нда]{.ru} 是阴性，过去时用 [проигра́ла]{.ru}（第 17 课）。第 9 空：主语是父子两人，过去时复数 [сиде́ли]{.ru}（第 17、31 课）。第 10 空：[со]{.ru} + 第五格，形容词 [ста́ршим]{.ru}、名词 [бра́том]{.ru} 都要变（第 61、65 课）。
