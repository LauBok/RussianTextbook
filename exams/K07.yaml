  - {ru: под землёй, zh: 在地下}
  passage_zh: |
    **我在莫斯科的第一个冬天**

    我是上海人。我们那儿冬天暖和，很少下雪。所以莫斯科下第一场雪的时候，我高兴得在公园里逛了好久。

    可后来就难熬了。白天很短：早上九点天还黑着，下午四点又成了夜里。还冷：一月零下三十度。有一次我没戴帽子在外面走，冻得不行。邻居老奶奶看见了，说：“冬天不戴帽子可不能出门！”我马上买了暖和的帽子和围巾。

    现在我坐地铁去上课：地下暖和。我和朋友去滑冰，滑完像邻居奶奶那样喝蜂蜜热茶。莫斯科的冬天很长，可现在我喜欢上它了。
  why: 第 1 题，第一段 [У нас зимо́й тепло́, и снег идёт ре́дко]{.ru}。第 2 题，[Дни коро́ткие … И хо́лодно]{.ru}：天短、天冷；文中没说下雨或地铁停运。第 3 题是推断题：他没戴帽子冻坏了，邻居奶奶又提醒他，所以马上买了帽子和围巾；文中没说滑冰要帽子，也没说在哪儿买的。第 4 题，[е́зжу на метро́ — под землёй тепло́]{.ru}，破折号后是原因。第 5 题是概括题：全文讲上海学生在莫斯科的第一个冬天，从高兴到难熬，再到喜欢上；邻居、地铁、上海都只是其中的细节。
  items:
  - stem: В Шанха́е зимо́й ___.
    options: [тепло́ и снег идёт ре́дко, ча́сто идёт снег, ми́нус три́дцать, всегда́ темно́]
    answer: тепло́ и снег идёт ре́дко
  - stem: 'Пото́м студе́нту ста́ло тру́дно: ___.'
    options: [ча́сто шёл дождь, дни бы́ли коро́ткие и бы́ло хо́лодно, метро́ не рабо́тало, не́ было сне́га]
    answer: дни бы́ли коро́ткие и бы́ло хо́лодно
  - stem: 'Ша́пку и шарф он купи́л: ___.'
    options: [в метро́ бы́ло хо́лодно, он лю́бит ша́пки, 'ему́ бы́ло хо́лодно, и так сказа́ла сосе́дка', они́ нужны́ на като́ке]
    answer: ему́ бы́ло хо́лодно, и так сказа́ла сосе́дка
  - stem: 'На заня́тия он е́здит на метро́: ___.'
    options: [там тепло́, э́то бы́стро, там мо́жно чита́ть, метро́ ря́дом]
    answer: там тепло́
  - stem: Э́тот расска́з — ___.
    options: [о Шанха́е, о пе́рвой зиме́ студе́нта в Москве́, о моско́вском метро́, о ста́рой сосе́дке]
    answer: о пе́рвой зиме́ студе́нта в Москве́
