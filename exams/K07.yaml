lesson: K07
heading: 第七套
range: L01-L69
total: 150
names: [Ли́за, Ири́на, Андре́й, Ко́ля, Ната́ша, Ве́ра, Оле́г, Каза́нь, Бело́ва, Ко́тов, Садо́вая, Ры́жик, Серге́й, Пётр Ильи́ч, Ни́на]
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[без]{.ru} 要求第二格，形容词和名词都要变：[без тёплой ша́пки]{.ru}（第 37 课）；[тёплой ша́пкой]{.ru} 是本单元新学的第五格，用在 [с]{.ru} 后，最容易混。第 2 题：天已经晚了，明天一早还要上学，孩子们应该已经在“睡觉”[спят]{.ru}；[игра́ют]{.ru}、[гуля́ют]{.ru}、[чита́ют]{.ru} 都和冒号后“明天一早要上学”的理由接不上（第 7 课）。第 3 题：[о]{.ru} + 第六格，[он]{.ru} 的第六格是 [нём]{.ru}；[него́]{.ru} 是第二、四格，[ему́]{.ru} 是第三格（第 13 课）。第 4 题：“我和姐姐”俄语说 [мы с сестро́й]{.ru}：[мы]{.ru} 包括说话人和同伴，谓语用复数 [бы́ли]{.ru}，同伴用 [с]{.ru} + 第五格；问句用的是 [ты]{.ru}，容易顺手答 [Я с сестро́й]{.ru}，但 [я]{.ru} 作主语谓语要用单数 [была́]{.ru}；[с сестра́]{.ru} 没有变格，[я и сестро́й]{.ru} 用了 [и]{.ru} 就不能再用第五格（第 62 课）。第 5 题：发烧是客观原因，“不能”用 [мочь]{.ru}：[не мо́жет]{.ru}；[не уме́ет]{.ru} 表示不会、没学过，和“发烧”这个原因不搭；[мо́жешь]{.ru} 是第二人称（第 27 课）。第 6 题：[сейча́с]{.ru} 说的是此刻正在去，而且坐电气火车，用定向的乘车动词 [е́дет]{.ru}；[идёт]{.ru} 是步行，[е́здит]{.ru}、[хо́дит]{.ru} 表示经常往返（第 24、25 课）。第 7 题：[у]{.ru} 后用第二格，[ты]{.ru} 的第二格是 [тебя́]{.ru}；回答里的 [у меня́]{.ru} 也是第二格（第 31 课）。第 8 题：工程师 [стро́ит]{.ru} 的是桥 [мосты́]{.ru}；书、歌、信是“写”出来的，不说“建造”（第 64 课）。第 9 题：咖啡馆“在大学对面”：[напро́тив университе́та]{.ru}；[по́сле]{.ru} 表示时间“在……以后”，[без]{.ru}“没有”，[из]{.ru}“从……里”，和 [нахо́дится]{.ru}“位于”都搭配不上（第 36、37 课）。第 10 题：“在学校上学”用 [учи́ться]{.ru}，第三人称单数 [у́чится]{.ru}；[учи́ть]{.ru}、[изуча́ть]{.ru} 后面要带学习的内容，[учи́ться]{.ru} 是不定式（第 15、38 课）。第 11 题：问句 [Что ты де́лал]{.ru} 问的是昨晚做了什么事，回答也用过去时 [Смотре́л]{.ru}；[Смотрю́]{.ru} 是现在时，[Посмотрю́]{.ru} 是将来时，[Смотре́ть]{.ru} 是不定式，都和 [вчера́]{.ru} 不配（第 17、42 课）。第 12 题：将来“过多久”用 [че́рез]{.ru} + 第四格：[че́рез два часа́]{.ru}；[наза́д]{.ru} 指过去，而且放在后面；[по́сле]{.ru}、[до]{.ru} 要求第二格（第 47 课）。第 13 题：“在某月”用 [в]{.ru} + 第六格：[в ноябре́]{.ru}（第 48 课）。第 14 题：请别人做事用命令式，[помы́ть]{.ru} 的命令式是 [помо́й]{.ru}；[помы́ть]{.ru} 是不定式，[помо́ет]{.ru}、[помо́ю]{.ru} 是将来时（第 46、54 课）。第 15 题：[мяч]{.ru} 是阳性，短尾形容词用 [ну́жен]{.ru}（第 55 课）。第 16 题：“加……”用 [с]{.ru} + 第五格，[варе́нье → варе́ньем]{.ru}；中性以 [-е]{.ru} 结尾的名词第五格词尾是 [-ем]{.ru}（第 61 课）。第 17 题：[с]{.ru} + 第五格，[она́]{.ru} 的第五格是 [ней]{.ru}；问的是娜塔莎，不能用阳性 [с ним]{.ru}；[неё]{.ru} 是第二、四格（第 62 课）。第 18 题：[спо́ртом]{.ru} 是第五格，四个动词里只有 [занима́ться]{.ru} 要求第五格：[занима́ться спо́ртом]{.ru}“锻炼身体，搞体育”；照汉语“做运动”说 [де́лать спорт]{.ru} 是常见错误；[игра́ть]{.ru} 说球类要用 [в]{.ru} + 第四格（[игра́ть в футбо́л]{.ru}），[люби́ть]{.ru} 要求第四格 [спорт]{.ru}（第 26、63 课）。第 19 题：懂英语和汉语，想当的自然是翻译 [перево́дчицей]{.ru}；其他三个职业和懂外语没有关系（第 64 课）。第 20 题：[с]{.ru} + 第五格，物主代词阳性第五格是 [мои́м]{.ru}：[с мои́м бра́том]{.ru}；[моём]{.ru} 是第六格，词尾和 [бра́том]{.ru} 的 [-ом]{.ru} 看着像，最容易误选；[моего́]{.ru} 是第二、四格（第 65 课）。第 21 题：灯挂在桌子上方：[над столо́м]{.ru}；[под столо́м]{.ru} 语法对，可灯不会挂在桌子底下；[ме́жду]{.ru} 要两样东西（[ме́жду столо́м и окно́м]{.ru}）；[ря́дом]{.ru} 后面要加 [с]{.ru} 才能接第五格：[ря́дом со столо́м]{.ru}（第 66 课）。第 22 题：乘交通工具用 [на]{.ru} + 第六格：[на трамва́е]{.ru}；[на трамва́й]{.ru} 是第四格，表示“上电车”（第 67 课）。第 23 题：[до]{.ru} 要求第二格，[семь]{.ru} 的第二格是 [семи́]{.ru}；[седьмо́го]{.ru} 是序数词，[семью́]{.ru} 是第五格（第 68 课）。第 24 题：“在冬天”用副词 [зимо́й]{.ru}，不用前置词（第 69 课）。第 25 题：对方邀请一起去溜冰场，同意时说“很乐意！” [С удово́льствием!]{.ru}；[Пожа́луйста]{.ru} 用来回答道谢，[Ничего́]{.ru} 回答道歉，[Пока́]{.ru} 是告别（第 3、63 课）。
  items:
  - stem: Зимо́й без ___ гуля́ть хо́лодно.
    options: [тёплая ша́пка, тёплой ша́пки, тёплую ша́пку, тёплой ша́пкой]
    answer: тёплой ша́пки
  - stem: 'Уже́ по́здно, де́ти ___: за́втра им ра́но в шко́лу.'
    options: [игра́ют, спят, гуля́ют, чита́ют]
    answer: спят
  - stem: — Ты зна́ешь Оле́га? — Да, сестра́ ча́сто расска́зывает о ___.
    options: [него́, ему́, он, нём]
    answer: нём
  - stem: — Где ты была́ вчера́ ве́чером? — ___ бы́ли в кино́.
    options: [Я с сестро́й, Мы с сестро́й, Мы с сестра́, Я и сестро́й]
    answer: Мы с сестро́й
  - stem: Брат сего́дня не ___ игра́ть в футбо́л, у него́ температу́ра.
    options: [мо́жет, уме́ет, мо́жешь, уме́ют]
    answer: мо́жет
  - stem: — Где Ната́ша? — Она́ сейча́с ___ на да́чу на электри́чке.
    options: [идёт, е́здит, е́дет, хо́дит]
    answer: е́дет
  - stem: — У ___ есть брат? — Нет, у меня́ есть сестра́.
    options: [ты, тебе́, тобо́й, тебя́]
    answer: тебя́
  - stem: Мой оте́ц — инжене́р, он стро́ит ___.
    options: [кни́ги, мосты́, пе́сни, пи́сьма]
    answer: мосты́
  - stem: Кафе́ нахо́дится ___ университе́та.
    options: [напро́тив, по́сле, без, из]
    answer: напро́тив
  - stem: Мой мла́дший брат ___ в шко́ле.
    options: [у́чит, изуча́ет, учи́ться, у́чится]
    answer: у́чится
  - stem: — Что ты де́лал вчера́ ве́чером? — ___ телеви́зор.
    options: [Смотре́ть, Смотрю́, Смотре́л, Посмотрю́]
    answer: Смотре́л
  - stem: — Когда́ ты бу́дешь до́ма? — ___ два часа́.
    options: [Наза́д, Че́рез, По́сле, До]
    answer: Че́рез
  - stem: Ве́ра родила́сь ___.
    options: [в ноя́брь, ноябре́, в ноябре́, на ноябре́]
    answer: в ноябре́
  - stem: Ко́ля, ___ ру́ки, пожа́луйста! Сейча́с бу́дем обе́дать.
    options: [помо́й, помы́ть, помо́ет, помо́ю]
    answer: помо́й
  - stem: 'Бра́ту ___ но́вый мяч: ста́рый он потеря́л.'
    options: [нужна́, ну́жен, нужны́, ну́жно]
    answer: ну́жен
  - stem: Я люблю́ блины́ ___.
    options: [с варе́нье, с варе́нья, с варе́нью, с варе́ньем]
    answer: с варе́ньем
  - stem: — Ты зна́ешь Ната́шу? — Коне́чно, я рабо́таю ___ уже́ три го́да.
    options: [с ним, с неё, с ней, с на́ми]
    answer: с ней
  - stem: Ка́ждое у́тро па́па ___ спо́ртом в па́рке.
    options: [игра́ет, занима́ется, лю́бит, де́лает]
    answer: занима́ется
  - stem: Ве́ра хорошо́ зна́ет англи́йский и кита́йский языки́ и хо́чет стать ___.
    options: [перево́дчицей, медсестро́й, арти́сткой, води́телем]
    answer: перево́дчицей
  - stem: 'Вчера́ я до́лго разгова́ривал по телефо́ну с ___ бра́том: он живёт в Каза́ни.'
    options: [мой, моего́, моём, мои́м]
    answer: мои́м
  - stem: На ку́хне ___ столо́м виси́т ла́мпа.
    options: [под, над, ме́жду, ря́дом]
    answer: над
  - stem: До ста́нции метро́ мы е́дем ___.
    options: [на трамва́й, в трамва́й, на трамва́е, трамва́й]
    answer: на трамва́е
  - stem: Библиоте́ка рабо́тает с девяти́ утра́ до ___ ве́чера.
    options: [семи́, семь, седьмо́го, семью́]
    answer: семи́
  - stem: ___ в Москве́ ча́сто идёт снег.
    options: [Зима́, Зи́му, Зимы́, Зимо́й]
    answer: Зимо́й
  - stem: — Хо́чешь в суббо́ту на като́к? — ___
    options: [Пожа́луйста!, С удово́льствием!, Ничего́!, Пока́!]
    answer: С удово́льствием!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  glossary:
  - {ru: стена́, pos: f, zh: 墙}
  - {ru: одна́жды, pos: adv., zh: 有一次}
  - {ru: поду́мать, pos: pf., zh: 想（了一下）}
  passage: |
    ::: {.prose lang="ru"}
    **Сосе́д за стено́й**

    В сентябре́ кварти́ру за стено́й купи́л но́вый сосе́д. Я его́ ещё не ви́дела, но ка́ждый ве́чер (1) []{.blank}: он игра́л на (2) []{.blank}. Игра́л он (3) []{.blank} и всё вре́мя одну́ пе́сню.

    А у меня́ в декабре́ бы́ли контро́льные, и ве́чером мне на́до бы́ло (4) []{.blank}. Одна́жды в де́сять часо́в ве́чера за стено́й опя́ть начала́сь (5) []{.blank} пе́сня. «Наве́рное, э́то студе́нт, — поду́мала я. — Сейча́с я ему́ всё (6) []{.blank}!» — и позвони́ла в (7) []{.blank}.

    Дверь откры́л не студе́нт, а (8) []{.blank} с гита́рой в руке́.

    — До́брый ве́чер! Вы, наве́рное, моя́ (9) []{.blank}? Извини́те, я то́лько учу́сь. Мне се́мьдесят (10) []{.blank}, а гита́ру (11) []{.blank} подари́л сын на (12) []{.blank} рожде́ния. В (13) []{.blank} я о́чень хоте́л игра́ть, но гита́ры у нас не́ было.

    Говори́ть с ним (14) []{.blank} я уже́ не могла́.

    — А я в шко́ле занима́лась (15) []{.blank} и немно́го игра́ю, — сказа́ла я. — Хоти́те, я вам (16) []{.blank}?

    Мы с (17) []{.blank} сиде́ли на ку́хне це́лый час. Тепе́рь ка́ждую суббо́ту я (18) []{.blank} его́ игра́ть. Игра́ет он пока́ не о́чень (19) []{.blank}, зато́ то́лько (20) []{.blank}.
    :::
  passage_zh: |
    **墙那边的邻居**

    九月，墙那边的房子让一位新邻居买下了。我还没见过他，可每天晚上都听得见他：他在弹吉他。弹得很糟，而且翻来覆去就一首歌。

    我十二月有几场测验，晚上得用功。有一次，晚上十点，墙那边又响起了他那首歌。“准是个大学生，”我想，“我这就去跟他说个明白！”——我按了门铃。

    开门的不是大学生，而是一位老爷爷，手里拿着吉他。

    “晚上好！您是我的邻居吧？对不起，我才开始学。我七十岁了，吉他是儿子送我的生日礼物。我小时候特别想弹，可家里没有吉他。”

    我再也板不起脸来跟他说话了。

    “我上学的时候学过音乐，会弹一点儿，”我说，“要不要我弹给您看看？”

    我和他在厨房里坐了整整一个小时。现在每个星期六我都教他弹琴。他弹得还不怎么样，好在只在白天弹了。
  why: 第 1 空：前半句“还没见过他”，[но]{.ru} 转折，冒号后“他在弹吉他”，可见是“听见”了他：[слы́шала]{.ru}；[ви́дела]{.ru} 和“还没见过”矛盾，[зна́ла]{.ru}、[жда́ла]{.ru} 和冒号后的解释接不上（第 7、67 课）。第 2 空：“弹乐器”是 [игра́ть на]{.ru} + 第六格：[на гита́ре]{.ru}；[игра́ть в]{.ru} + 第四格用于球类、棋类，选 [гита́ру]{.ru} 是把两种搭配混了；[гита́рой]{.ru} 是本单元的第五格，[на]{.ru} 后面不能用（第 63 课）。第 3 空：要读到后文：老人自己说 [я то́лько учу́сь]{.ru}，结尾又说他 [пока́ не о́чень хорошо́]{.ru}，可见弹得“糟”[пло́хо]{.ru}；“我”被吵得要去找他，[хорошо́]{.ru}、[краси́во]{.ru}、[ти́хо]{.ru} 都说不通。第 4 空：有测验，晚上就得“用功、复习”[занима́ться]{.ru}；这也是她被琴声惹恼的原因；[отдыха́ть]{.ru}、[гуля́ть]{.ru}、[игра́ть]{.ru} 和“有测验”接不上（第 38 课）。第 5 空：弹琴的是那位男邻居，这首歌是“他的”那首：[его́ пе́сня]{.ru}；[её]{.ru} 是阴性，[их]{.ru} 是复数，都对不上这位邻居；[моя́]{.ru} 不合情理：琴是邻居在弹。注意 [его́]{.ru} 作物主代词不变格，不跟着 [пе́сня]{.ru} 变成阴性（第 8 课）。第 6 空：[сейча́с]{.ru} 在这里是“马上就”，说的是马上要做的一次性的事，用完成体将来时 [скажу́]{.ru}；[говорю́]{.ru} 是现在时，[сказа́ла]{.ru}、[говори́ла]{.ru} 是过去时，都和“马上”不合（第 43 课）。第 7 空：“按门铃”是 [звони́ть в дверь]{.ru}，[в]{.ru} + 第四格；阴性 [-ь]{.ru} 结尾的 [дверь]{.ru} 第四格同第一格；[две́ри]{.ru} 是第二、三、六格，[две́рью]{.ru} 是第五格，[кварти́ре]{.ru} 是第六格（第 54 课）。第 8 空：[не студе́нт, а …]{.ru} 引出意外，下文他说 [Мне се́мьдесят лет]{.ru}，开门的是位“老爷爷”[де́душка]{.ru}；[ма́льчик]{.ru}、[шко́льник]{.ru}、[па́рень]{.ru} 都是年轻人，和七十岁矛盾。第 9 空：“我”是女的：前文 [ви́дела]{.ru}、[поду́мала]{.ru}、[позвони́ла]{.ru} 都是阴性过去时，所以老人说 [моя́ сосе́дка]{.ru}；[моя́]{.ru} 也要求阴性名词。[сосе́д]{.ru} 是阳性，[сосе́дку]{.ru} 是第四格，[сосе́ди]{.ru} 是复数（第 3、34 课）。第 10 空：[се́мьдесят]{.ru} 后用 [лет]{.ru}（第 53 课）；[год]{.ru} 用在 1 后，[го́да]{.ru} 用在 2–4 后，[годо́в]{.ru} 是错误形式。第 11 空：“送给谁”用第三格：[мне]{.ru}；[меня́]{.ru} 是第二、四格，[мной]{.ru} 是第五格（第 51、52 课）。第 12 空：“作为生日礼物”是 [на день рожде́ния]{.ru}，[на]{.ru} + 第四格，[день]{.ru} 第四格同第一格；[дня]{.ru} 是第二格，[дне]{.ru} 是第六格，[днём]{.ru} 是第五格或副词“白天”（第 47 课）。第 13 空：[в]{.ru} + 第六格表示时间“在……时期”：[в де́тстве]{.ru}（第 64 课）。第 14 空：要连起前文：她本来是去 [всё скажу́]{.ru}，要数落他一顿；听完老人的话，就再也不能“严厉地”跟他说话了：[стро́го]{.ru}。[ти́хо]{.ru}、[ме́дленно]{.ru}、[по-англи́йски]{.ru} 都不是她原来的打算，也引不出后面主动提出帮忙（第 65 课）。第 15 空：后面说 [немно́го игра́ю]{.ru}、要弹给他看，可见学过音乐；[занима́ться]{.ru} 要求第五格：[му́зыкой]{.ru}；[му́зыку]{.ru} 是第四格，[му́зыке]{.ru} 是第三、六格，[спо́ртом]{.ru} 格对，但和下文“会弹一点儿”接不上（第 63 课）。第 16 空：“给您示范一次”是一次性的、将来的动作，用完成体将来时 [покажу́]{.ru}；[пока́зываю]{.ru} 是现在时，[показа́ла]{.ru} 是过去时，[пока́зывать]{.ru} 是不定式（第 43、44 课）。第 17 空：[мы с ним]{.ru}“我和他”，[с]{.ru} + 第五格 [ним]{.ru}；[его́]{.ru} 是第二、四格，[ему́]{.ru} 是第三格（第 62 课）。第 18 空：“教某人做某事”是 [учи́ть кого́]{.ru} + 不定式：[учу́ его́ игра́ть]{.ru}；[учу́сь]{.ru}、[занима́юсь]{.ru} 不能带 [его́]{.ru}，[изуча́ю]{.ru} 后面接学科，不接人（第 38 课）。第 19 空：[пока́ не о́чень хорошо́]{.ru}“还不怎么好”，和第 3 空的 [пло́хо]{.ru}、老人的 [я то́лько учу́сь]{.ru} 一致；[зато́]{.ru} 前面要说缺点、后面说好处，[ча́сто]{.ru}、[пло́хо]{.ru}、[ма́ло]{.ru} 都构不成这种转折。第 20 空：要看全文：麻烦出在晚上——她晚上要复习，老人晚上十点还在弹；结尾的“好处”是他现在只在白天弹：[днём]{.ru}；[ве́чером]{.ru}、[но́чью]{.ru} 正是麻烦所在，[до́ма]{.ru} 算不上什么好处（第 29 课）。
  items:
  - options: [ви́дела, слы́шала, жда́ла, зна́ла]
    answer: слы́шала
  - options: [гита́ру, гита́ре, гита́рой, гита́ры]
    answer: гита́ре
  - options: [хорошо́, пло́хо, ти́хо, краси́во]
    answer: пло́хо
  - options: [отдыха́ть, занима́ться, гуля́ть, игра́ть]
    answer: занима́ться
  - options: [её, его́, их, моя́]
    answer: его́
  - options: [скажу́, говорю́, сказа́ла, говори́ла]
    answer: скажу́
  - options: [две́ри, две́рью, дверь, кварти́ре]
    answer: дверь
  - options: [ма́льчик, де́душка, шко́льник, па́рень]
    answer: де́душка
  - options: [сосе́д, сосе́дку, сосе́ди, сосе́дка]
    answer: сосе́дка
  - options: [год, го́да, лет, годо́в]
    answer: лет
  - options: [я, мне, меня́, мной]
    answer: мне
  - options: [день, дня, дне, днём]
    answer: день
  - options: [де́тство, де́тства, де́тстве, де́тством]
    answer: де́тстве
  - options: [ти́хо, ме́дленно, стро́го, по-англи́йски]
    answer: стро́го
  - options: [му́зыку, му́зыке, спо́ртом, му́зыкой]
    answer: му́зыкой
  - options: [покажу́, пока́зываю, показа́ла, пока́зывать]
    answer: покажу́
  - options: [он, его́, ним, ему́]
    answer: ним
  - options: [учу́сь, учу́, изуча́ю, занима́юсь]
    answer: учу́
  - options: [ча́сто, пло́хо, хорошо́, ма́ло]
    answer: хорошо́
  - options: [ве́чером, днём, но́чью, до́ма]
    answer: днём
- id: e3
  type: choice
  task: 阅读理解（一）：阅读下面网上的提问和回复，根据内容选出正确答案。
  points: 2.5
  glossary:
  - {ru: на пе́нсии, zh: 退休了}
  passage: |
    ::: {.prose lang="ru"}
    **Что подари́ть па́пе?**

    **Ли́за:** Здра́вствуйте! В суббо́ту у па́пы день рожде́ния, ему́ шестьдеся́т лет. Он инжене́р, со́рок лет стро́ил мосты́, а с ма́я он на пе́нсии. Интересу́ется исто́рией и ша́хматами. Ша́хматы у него́ есть, о́чень ста́рые, но други́х он не хо́чет: э́то пода́рок его́ отца́. Кни́ги по исто́рии он покупа́ет ка́ждый ме́сяц, у него́ их це́лый шкаф. Что ему́ подари́ть?

    **Оле́г:** Подари́те ему́ компью́тер! Мой оте́ц то́же на пе́нсии, и тепе́рь он ка́ждый ве́чер игра́ет в ша́хматы в интерне́те.

    **Ири́на:** Ваш па́па стро́ил мосты́? Тогда́ сде́лайте ему́ альбо́м. Найди́те ста́рые фо́то: па́па на рабо́те, па́па с колле́гой, па́па на но́вом мосту́.

    **Ли́за:** Спаси́бо! Компью́тер у па́пы есть, но в ша́хматы он игра́ет то́лько с сосе́дом: ему́ ну́жно ви́деть лицо́ челове́ка. А альбо́м — отли́чная иде́я! Фо́то мы возьмём у ма́мы, а ещё я позвоню́ его́ ста́рому колле́ге: у него́ то́же есть фо́то.
    :::
  passage_zh: |
    **送爸爸什么好？**

    **丽莎：**大家好！星期六是我爸爸的生日，他六十岁了。他是工程师，造了四十年桥，五月份退休了。他对历史和国际象棋感兴趣。国际象棋他有一副，很旧了，可别的他不要：那是他父亲送给他的。历史书他每个月都买，已经有满满一柜子了。送他什么好呢？

    **奥列格：**送他一台电脑吧！我父亲也退休了，现在每天晚上都在网上下棋。

    **伊琳娜：**您爸爸是造桥的？那就给他做本相册吧。找些老照片：爸爸在工作，爸爸和同事，爸爸站在新桥上。

    **丽莎：**谢谢！电脑爸爸有，可他下棋只跟邻居下：他得看见对面人的脸。相册倒是个好主意！照片我们从妈妈那儿拿，我再给他的老同事打个电话：他那儿也有照片。
  why: '第 1 题，[Он инжене́р, со́рок лет стро́ил мосты́]{.ru}；[рабо́тать]{.ru} 后用第五格 [инжене́ром]{.ru}。历史是他的爱好，不是职业；程序员、司机文中没有。第 2 题是推断题：丽莎说旧棋是他父亲送的、别的他不要，所以送新棋没用；文中没说棋贵，他也并非不喜欢下棋；“在网上下棋”是奥列格父亲的事。第 3 题要把丽莎第二次发言的两层意思连起来：电脑他已经有了，而且他下棋要面对面，不在网上下；文中没说他不会用电脑或电脑太贵。第 4 题，[я позвоню́ его́ ста́рому колле́ге: у него́ то́же есть фо́то]{.ru}，冒号后是原因；同事会不会下棋、来不来生日会，文中都没说。第 5 题是推断题：丽莎否定了电脑，说相册 [отли́чная иде́я]{.ru}，还开始找照片，所以她多半会送爸爸一本老照片做的相册；历史书他每个月都买、有一整柜，新棋他不要。'
  items:
  - stem: Па́па Ли́зы рабо́тал ___.
    options: [учи́телем исто́рии, инжене́ром, води́телем, программи́стом]
    answer: инжене́ром
  - stem: 'Ша́хматы Ли́за не хо́чет дари́ть: ___.'
    options: [они́ о́чень дороги́е, па́па не лю́бит ша́хматы, 'у па́пы есть ста́рые ша́хматы, и други́х он не хо́чет', па́па игра́ет то́лько в интерне́те]
    answer: у па́пы есть ста́рые ша́хматы, и други́х он не хо́чет
  - stem: 'Иде́я Оле́га Ли́зе не нра́вится: ___.'
    options: [па́па не уме́ет рабо́тать на компью́тере, 'компью́тер у па́пы уже́ есть, и в интерне́те он не игра́ет', компью́тер сто́ит до́рого, па́па не интересу́ется ша́хматами]
    answer: компью́тер у па́пы уже́ есть, и в интерне́те он не игра́ет
  - stem: 'Ли́за позвони́т колле́ге па́пы: ___.'
    options: [он хорошо́ игра́ет в ша́хматы, у него́ есть ста́рые фо́то, он то́же на пе́нсии, он то́же стро́ил мосты́ в Каза́ни]
    answer: у него́ есть ста́рые фо́то
  - stem: Ли́за, наве́рное, пода́рит па́пе ___.
    options: [компью́тер, но́вые ша́хматы, кни́гу по исто́рии, альбо́м]
    answer: альбо́м
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Регистра́тор]{.sp} Поликли́ника, здра́вствуйте.

    [Андре́й]{.sp} Здра́вствуйте. Мне ну́жно к врачу́: у меня́ уже́ неде́лю ка́шель.

    [Регистра́тор]{.sp} А температу́ра есть?

    [Андре́й]{.sp} Нет, то́лько ка́шель.

    [Регистра́тор]{.sp} Хорошо́. К до́ктору Бело́вой мо́жно за́втра, в де́сять утра́.

    [Андре́й]{.sp} В де́сять я на рабо́те, я рабо́таю с девяти́ до шести́. А ве́чером приём есть?

    [Регистра́тор]{.sp} Ве́чером у до́ктора Бело́вой приём то́лько в четве́рг, с трёх до восьми́. Есть вре́мя в семь и в семь три́дцать.

    [Андре́й]{.sp} Дава́йте в семь три́дцать. В семь я, наве́рное, ещё бу́ду в трамва́е.

    [Регистра́тор]{.sp} Хорошо́. Ва́ша фами́лия?

    [Андре́й]{.sp} Ко́тов, Андре́й Ко́тов. А где вы нахо́дитесь? Я у вас ещё не́ был.

    [Регистра́тор]{.sp} На Садо́вой у́лице, напро́тив па́рка. Остано́вка трамва́я «Парк» пря́мо пе́ред на́ми. Кабине́т два́дцать оди́н.

    [Андре́й]{.sp} Спаси́бо. До свида́ния!
    :::
  passage_zh: |
    ——诊所，您好。

    ——您好。我得看医生：咳嗽一个星期了。

    ——发烧吗？

    ——不发烧，就是咳嗽。

    ——好的。别洛娃医生明天上午十点可以看。

    ——十点我在上班，我从九点工作到六点。晚上有门诊吗？

    ——别洛娃医生晚上的门诊只在星期四，从三点到八点。七点和七点半有空。

    ——那就七点半吧。七点我大概还在电车上。

    ——好的。您贵姓？

    ——科托夫，安德烈·科托夫。你们在哪儿？我还没去过你们那儿。

    ——在花园街，公园对面。电车站“公园”就在我们门前。21 号诊室。

    ——谢谢。再见！
  why: 第 1 题，[у меня́ уже́ неде́лю ка́шель]{.ru}；温度是挂号员问的，安德烈回答 [Нет, то́лько ка́шель]{.ru}，选“发烧”是把问句当成了答案。第 2 题是推断题：明天十点不行，是因为他从九点工作到六点，十点正在上班；文中没说他明天有课或要去别处。第 3 题，[Ве́чером … приём то́лько в четве́рг]{.ru}；明天上午十点那次是白天的门诊。第 4 题是推断题：六点下班，七点 [ещё бу́ду в трамва́е]{.ru}，说明他七点还在下班路上，所以选七点半；“七点还在上班”和“工作到六点”矛盾；七点那个时间是空着的，不是有别的病人。第 5 题是推断题：他问诊所在哪儿，还说 [Я у вас ещё не́ был]{.ru}，所以是第一次来这家诊所；住在公园对面的是诊所，不是他；他是坐电车，不是坐地铁。
  items:
  - stem: 'Андре́й звони́т в поликли́нику: ___.'
    options: [у него́ температу́ра, у него́ ка́шель, он рабо́тает там, ему́ ну́жен врач для сы́на]
    answer: у него́ ка́шель
  - stem: 'За́втра в де́сять Андре́й не мо́жет: ___.'
    options: [он бу́дет на рабо́те, у него́ бу́дет заня́тие, у него́ температу́ра, в де́сять у врача́ нет приёма]
    answer: он бу́дет на рабо́те
  - stem: Ве́чером у до́ктора Бело́вой приём ___.
    options: [ка́ждый день, за́втра, то́лько в четве́рг, с девяти́ до шести́]
    answer: то́лько в четве́рг
  - stem: 'Андре́й про́сит вре́мя в семь три́дцать: ___.'
    options: [в семь он ещё на рабо́те, в семь у врача́ друго́й пацие́нт, в семь он ещё е́дет с рабо́ты, в семь он у́жинает]
    answer: в семь он ещё е́дет с рабо́ты
  - stem: Андре́й, наве́рное, ___.
    options: [живёт напро́тив па́рка, е́здит на рабо́ту на метро́, ра́ньше не́ был в э́той поликли́нике, рабо́тает на Садо́вой у́лице]
    answer: ра́ньше не́ был в э́той поликли́нике
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面贴在楼门口的几则启事，根据内容选出正确答案。
  points: 2.5
  glossary:
  - {ru: партнёр, pos: m, zh: 伙伴，（下棋的）对手}
