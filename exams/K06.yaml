    Па́па сего́дня рабо́тает до ве́чера и (9) []{.blank} (е́хать / е́здить) к ба́бушке сра́зу по́сле рабо́ты. Тебя́ я жду у метро́ в шесть часо́в. И не забу́дь ша́пку: на у́лице о́чень (10) []{.blank} (холо́дный)!

