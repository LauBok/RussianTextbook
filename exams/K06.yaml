    ::: {.prose lang="ru"}
    **Серёжа и соба́ка**

    Серёжа давно́ про́сит соба́ку, но ма́ма отвеча́ет: «С соба́кой на́до гуля́ть у́тром и ве́чером, а ты у́тром лю́бишь спать».

    В ноябре́ заболе́л их сосе́д Пётр Ива́нович. Врач сказа́л ему́ две неде́ли лежа́ть до́ма. А у Петра́ Ива́новича ста́рая больша́я соба́ка, и гуля́ть с ней бы́ло не́кому. «Я бу́ду с ней гуля́ть!» — сказа́л Серёжа.

    Две неде́ли он встава́л в семь часо́в. На у́лице бы́ло хо́лодно и темно́, но Серёжа гуля́л с соба́кой и у́тром, и ве́чером, а по́сле шко́лы покупа́л сосе́ду хлеб и молоко́.

    Пото́м Пётр Ива́нович позвони́л ма́ме Серёжи: «Ваш сын — молоде́ц!» Ма́ма до́лго ду́мала, а ве́чером сказа́ла сы́ну: «Я ви́жу, ты мо́жешь встава́ть ра́но. На день рожде́ния у тебя́ бу́дет соба́ка!»
    :::
