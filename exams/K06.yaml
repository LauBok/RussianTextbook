exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[письмо́]{.ru} 是中性名词，问“谁的”用中性 [чьё]{.ru}；回答 [моё]{.ru} 也是中性（第 8 课）。第 2 题：[слова́рь]{.ru} 是阳性非动物名词，第四格同第一格，形容词也用 [но́вый]{.ru}；[но́вого]{.ru} 是动物名词的第四格（第 22、23 课）。第 3 题：“在上班”说 [на рабо́те]{.ru}，[рабо́та]{.ru} 和 [на]{.ru} 连用；[на рабо́ту]{.ru} 是第四格，回答“去哪儿”（第 11、12、24 课）。第 4 题：主语 [ба́бушка и де́душка]{.ru} 是两个人，用复数，[жить]{.ru} 第三人称复数是 [живу́т]{.ru}（第 14 课）。第 5 题：[в]{.ru} + 第六格表示处所，[райо́н]{.ru} 是阳性，形容词第六格阳性是 [ти́хом]{.ru}；[ти́хой]{.ru} 是阴性（第 18 课）。第 6 题：[ждать]{.ru} 要求第四格，[брат]{.ru} 是动物名词，阳性动物名词第四格同第二格：[бра́та]{.ru}（第 22 课）。第 7 题：[ка́ждое у́тро]{.ru} 表示经常往返，[пешко́м]{.ru} 说明是走着去，用不定向动词 [хо́дит]{.ru}；[ходи́ть]{.ru} 是不定式，句子缺谓语；[е́здит]{.ru}、[е́дет]{.ru} 是乘车（第 25 课）。第 8 题：[нет]{.ru} 后用第二格，[соба́ка → соба́ки]{.ru}（第 32 课）。第 9 题：以 [два]{.ru} 结尾的数词后名词用单数第二格：[два́дцать два студе́нта]{.ru}；[студе́нтов]{.ru} 用在 [пять]{.ru} 以上的数词后（第 35 课）。第 10 题：[ле́кция]{.ru} 是事物，自己“开始”，用带 [-ся]{.ru} 的 [начина́ется]{.ru}；[начина́ть]{.ru} 要带直接补语，如 [начина́ть уро́к]{.ru}（第 38 课）。第 11 题：[девяно́сто]{.ru} 后用 [рубле́й]{.ru}；[рубля́]{.ru} 用在 [два, три, четы́ре]{.ru} 后（第 39 课）。第 12 题：[наконе́ц]{.ru}“终于”表示动作有了结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 只说做过这件事，不强调读完（第 42 课）。第 13 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ет]{.ru}；[купи́ла]{.ru}、[ку́пит]{.ru} 是完成体，表示一次的结果（第 45 课）。第 14 题：“在某月某日”用序数词第二格加月份第二格，不加前置词：[двадца́того ноября́]{.ru}；[двадца́тое]{.ru} 是第一格，回答“今天几号”（第 49 课）。第 15 题：问路时用命令式 [Скажи́те, пожа́луйста]{.ru}；[Сказа́ть]{.ru} 是不定式，[Скажу́]{.ru} 是将来时（第 46 课）。第 16 题：无人称句里感受的主体用第三格：[Ми́ше ску́чно]{.ru}（第 58 课）。第 17 题：[звони́ть]{.ru} 要求第三格；[оте́ц]{.ru} 变格时 [е]{.ru} 脱落，第三格是 [отцу́]{.ru}；[отца́]{.ru} 是第二、四格（第 51 课）。第 18 题：[нра́виться]{.ru} 和后面的主语 [пе́сни]{.ru} 一致，复数用 [нра́вятся]{.ru}；喜欢的人 [Мари́и Никола́евне]{.ru} 用第三格（第 52 课）。第 19 题：[два́дцать четы́ре]{.ru} 以 [четы́ре]{.ru} 结尾，后面用 [го́да]{.ru}；[лет]{.ru} 用在 [пять]{.ru} 以上和以 [пять–ноль]{.ru} 结尾的数词后，[год]{.ru} 用在 [оди́н]{.ru} 后（第 53 课）。第 20 题：外面零下二十度，不戴帽子不能出去，用 [нельзя́]{.ru}；[мо́жно]{.ru} 语法上通，意思和语境矛盾；[ну́жен]{.ru}、[рад]{.ru} 不能接不定式（第 54 课）。第 21 题：[перча́тки]{.ru} 是复数，短尾形容词用复数 [нужны́]{.ru}（第 55 课）。第 22 题：[расска́зывать]{.ru} 讲给谁听用第三格，阴性形容词第三格词尾是 [-ой]{.ru}：[но́вой студе́нтке]{.ru}（第 56 课）。第 23 题：“去某人那里”用 [к]{.ru} + 第三格，[врач → врачу́]{.ru}；[врача́]{.ru} 是第二、四格（第 57 课）。第 24 题：说话人是由美，女性，短尾形容词用阴性 [занята́]{.ru}；注意重音在词尾（第 59 课）。第 25 题：对方说要走了，回答告别用语 [Пока́! До ве́чера!]{.ru}；[Приве́т]{.ru}、[Здра́вствуй]{.ru} 是见面问候（第 2、59 课）。
  items:
  - stem: — ___ э́то письмо́? — Э́то моё письмо́.
    options: [Чей, Чьё, Чья, Чьи]
    answer: Чьё
  - stem: Вчера́ Ю́ми купи́ла ___ слова́рь.
    options: [но́вый, но́вого, но́вом, но́вая]
    answer: но́вый
  - stem: Ива́н Серге́евич сейча́с не до́ма, он ___.
    options: [в рабо́те, на рабо́ту, на рабо́те, в рабо́ту]
    answer: на рабо́те
  - stem: Ба́бушка и де́душка ___ на да́че.
    options: [живёт, живём, живу́, живу́т]
    answer: живу́т
  - stem: Ван Лэй живёт в ___ райо́не Москвы́.
    options: [ти́хом, ти́хий, ти́хой, ти́хая]
    answer: ти́хом
  - stem: А́нна ждёт ___ на ста́нции метро́.
    options: [брат, бра́ту, бра́та, бра́те]
    answer: бра́та
  - stem: Ка́ждое у́тро Ми́ша ___ в шко́лу пешко́м.
    options: [ходи́ть, е́здит, е́дет, хо́дит]
    answer: хо́дит
  - stem: У Ми́ши нет ___, но у него́ есть ко́шка.
    options: [соба́ка, соба́ки, соба́ку, соба́ке]
    answer: соба́ки
  - stem: В на́шей гру́ппе два́дцать два ___.
    options: [студе́нт, студе́нта, студе́нтов, студе́нты]
    answer: студе́нта
  - stem: Ле́кция ___ в де́вять часо́в.
    options: [начина́ет, начина́ются, начина́ется, начина́ть]
    answer: начина́ется
  - stem: — Ско́лько сто́ит э́тот слова́рь? — Девяно́сто ___.
    options: [рубле́й, рубля́, рубль, рубли́]
    answer: рубле́й
  - stem: Вчера́ Пьер наконе́ц ___ рома́н «Война́ и мир».
    options: [чита́л, чита́ет, прочита́ет, прочита́л]
    answer: прочита́л
  - stem: Ка́ждое у́тро Мари́я Никола́евна ___ хлеб в бу́лочной.
    options: [купи́ла, ку́пит, покупа́ет, купи́ть]
    answer: покупа́ет
  - stem: Ми́ша роди́лся ___ ноября́.
    options: [двадца́тое, двадца́тый, двадца́том, двадца́того]
    answer: двадца́того
  - stem: — ___, пожа́луйста, где здесь по́чта? — Вон там.
    options: [Сказа́ть, Скажи́те, Скажу́, Сказа́л]
    answer: Скажи́те
  - stem: ___ ску́чно до́ма, он хо́чет гуля́ть.
    options: [Ми́ше, Ми́ша, Ми́шу, Ми́ши]
    answer: Ми́ше
  - stem: Ка́ждое воскресе́нье Ю́ми звони́т ___.
    options: [отца́, оте́ц, отце́, отцу́]
    answer: отцу́
  - stem: Мари́и Никола́евне о́чень ___ ру́сские пе́сни.
    options: [нра́вятся, нра́вится, нра́вилась, понра́вился]
    answer: нра́вятся
  - stem: Пье́ру два́дцать четы́ре ___.
    options: [год, лет, го́да, годо́в]
    answer: го́да
  - stem: Ми́ша, на у́лице ми́нус два́дцать, без ша́пки тебе́ ___ гуля́ть.
    options: [мо́жно, нельзя́, ну́жен, рад]
    answer: нельзя́
  - stem: Пье́ру ___ но́вые перча́тки.
    options: [ну́жен, нужны́, нужна́, ну́жно]
    answer: нужны́
  - stem: О́льга Ви́кторовна расска́зывает ___ студе́нтке о Москве́.
    options: [но́вой, но́вая, но́вую, но́вом]
    answer: но́вой
  - stem: У Ми́ши температу́ра, и сейча́с он идёт к ___.
    options: [врача́, врач, врачу́, врачи́]
    answer: врачу́
  - stem: — Ю́ми, ты свобо́дна в суббо́ту? — Нет, я ___.
    options: [за́нят, за́няты, за́нято, занята́]
    answer: занята́
  - stem: — Извини́, я до́лжен идти́. — ___
    options: [Пока́! До ве́чера!, Приве́т!, Здра́вствуй!, Пожа́луйста!]
    answer: Пока́! До ве́чера!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок для Ю́ми**

    Седьмо́го декабря́ у Ю́ми день рожде́ния: ей бу́дет два́дцать оди́н (1) []{.blank}. Пьер и Ван Лэй хотя́т (2) []{.blank} ей пода́рок. Сего́дня суббо́та. Большо́й магази́н далеко́, в це́нтре, и у́тром они́ (3) []{.blank} туда́.

    — Что (4) []{.blank} ну́жно? — спра́шивает Ван Лэй.

    — Ей о́чень (5) []{.blank} ру́сские пе́сни, — говори́т Пьер.

    — А мне (6) []{.blank}, ей ну́жен тёплый шарф. На у́лице уже́ моро́з, а у неё нет (7) []{.blank} ша́рфа.

    В магази́не Пьер (8) []{.blank} бе́лый шарф и ша́пку, а Ван Лэй купи́л кни́гу о (9) []{.blank} му́зыке.

    Седьмо́го декабря́ по́сле (10) []{.blank} они́ иду́т в общежи́тие. Общежи́тие недалеко́, и они́ (11) []{.blank} туда́ пешко́м. «Поздравля́ем!» — говоря́т они́ и (12) []{.blank} Ю́ми пода́рки. Ю́ми (13) []{.blank}: шарф ей о́чень (14) []{.blank}. «Спаси́бо (15) []{.blank}!» — говори́т она́.

    Пото́м они́ пьют чай и едя́т торт. Торт о́чень (16) []{.blank}. В де́вять часо́в Пьер говори́т: «Извини́те, я (17) []{.blank} идти́: за́втра у меня́ (18) []{.blank} рабо́та». А Ван Лэй ещё час сиди́т у Ю́ми. Им (19) []{.blank}. Домо́й он идёт по (20) []{.blank} у́лице, а на у́лице уже́ пе́рвый снег.
    :::
  passage_zh: |
    **给由美的礼物**

    十二月七日是由美的生日：她要满二十一岁了。皮埃尔和王磊想送她一件礼物。今天是星期六。大商场很远，在市中心，上午他们坐车去那儿。

    ——她需要什么呢？——王磊问。

    ——她非常喜欢俄罗斯歌曲，——皮埃尔说。

    ——我倒觉得她需要一条暖和的围巾。外面已经上冻了，可她没有暖和的围巾。

    在商场里，皮埃尔挑了一条白围巾和一顶帽子，王磊买了一本讲俄罗斯音乐的书。

    十二月七日下课以后，他们去宿舍。宿舍不远，他们走着去。“祝贺你！”他们说着，把礼物送给由美。由美很高兴：她非常喜欢这条围巾。“谢谢你们！”她说。

    然后他们喝茶、吃蛋糕。蛋糕很好吃。九点钟皮埃尔说：“对不起，我得走了：明天我有测验。”王磊在由美那儿又坐了一个小时。他们玩得很开心。王磊沿着一条安静的街道走回家，外面已经是第一场雪了。
  why: 第 1 空：[оди́н]{.ru} 后用 [год]{.ru}；[го́да]{.ru} 用在 [два, три, четы́ре]{.ru} 后，[лет]{.ru} 用在 [пять]{.ru} 以上（第 53 课）。第 2 空：[хоте́ть]{.ru} 后接不定式 [подари́ть]{.ru}；[пода́рят]{.ru}、[подари́л]{.ru} 是变位形式，[пода́рок]{.ru} 是名词（第 26、51 课）。第 3 空：商场“很远”，要乘车，用 [е́хать]{.ru}；今天去一次，用定向动词 [е́дут]{.ru}；[е́здят]{.ru} 表示经常往返（第 24、25 课）。第 4 空：[ну́жно]{.ru} 的主体用第三格 [ей]{.ru}；[она́]{.ru} 是第一格，[её]{.ru} 是第二、四格（第 52、55 课）。第 5 空：主语 [пе́сни]{.ru} 是复数，用 [нра́вятся]{.ru}；[лю́бит]{.ru} 要求主语用第一格 [она́]{.ru}，不能配 [ей]{.ru}（第 52 课）。第 6 空：[мне ка́жется]{.ru}“我觉得”是插入语；[мне нра́вится]{.ru}、[мне ну́жно]{.ru} 后面不能接一个完整的句子（第 58 课）。第 7 空：[нет]{.ru} 后用第二格，[шарф]{.ru} 是阳性，形容词第二格阳性是 [тёплого]{.ru}（第 32、34 课）。第 8 空：主语 [Пьер]{.ru} 是男性，和后半句的过去时 [купи́л]{.ru} 一致，用阳性过去时 [вы́брал]{.ru}（第 17、56 课）。第 9 空：[о]{.ru} + 第六格，[му́зыка]{.ru} 是阴性，形容词阴性第六格是 [ру́сской]{.ru}（第 13、18 课）。第 10 空：[по́сле]{.ru} 要求第二格：[по́сле уро́ка]{.ru}（第 37 课）。第 11 空：[пешко́м]{.ru} 说明是步行，去一次、朝一个方向，用定向动词 [иду́т]{.ru}；[хо́дят]{.ru} 表示经常去（第 24、25 课）。第 12 空：主语是两个人 [они́]{.ru}，[дари́ть]{.ru} 第三人称复数是 [да́рят]{.ru}（第 51 课）。第 13 空：[Ю́ми]{.ru} 是女性，短尾形容词用阴性 [ра́да]{.ru}（第 59 课）。第 14 空：[понра́виться]{.ru} 和主语 [шарф]{.ru} 一致，阳性过去时 [понра́вился]{.ru}（第 52 课）。第 15 空：[спаси́бо]{.ru} 后面感谢的人用第三格，对两个人说用 [вам]{.ru}（第 52 课）。第 16 空：[торт]{.ru} 是主语，后面用长尾形容词阳性 [вку́сный]{.ru} 作谓语；副词 [вку́сно]{.ru} 用在无人称句里，如 [Бы́ло вку́сно]{.ru}（第 21、43 课）。第 17 空：说话人 [Пьер]{.ru} 是男性，用 [до́лжен]{.ru}（第 59 课）。第 18 空：[у меня́ (есть) …]{.ru} 句型里，拥有的东西用第一格：[контро́льная рабо́та]{.ru}（第 31、49 课）。第 19 空：无人称句，主体 [им]{.ru} 用第三格，谓语用副词 [ве́село]{.ru}（第 19、58 课）。第 20 空：[по]{.ru} + 第三格表示“沿着”，阴性形容词第三格是 [ти́хой]{.ru}（第 56、57 课）。
  items:
  - options: [го́да, лет, годо́в, год]
    answer: год
  - options: [пода́рят, подари́л, подари́ть, пода́рок]
    answer: подари́ть
  - options: [иду́т, е́дут, е́здят, хо́дят]
    answer: е́дут
  - options: [она́, ей, её, ней]
    answer: ей
  - options: [нра́вится, лю́бит, нра́вятся, нра́вилась]
    answer: нра́вятся
  - options: [нра́вится, ну́жно, мо́жно, ка́жется]
    answer: ка́жется
  - options: [тёплого, тёплый, тёплому, тёплом]
    answer: тёплого
  - options: [вы́брал, вы́брала, вы́брали, вы́берет]
    answer: вы́брал
  - options: [ру́сскую, ру́сская, ру́сской, ру́сский]
    answer: ру́сской
  - options: [уро́к, уро́ка, уро́ке, уро́ку]
    answer: уро́ка
  - options: [хо́дят, е́дут, е́здят, иду́т]
    answer: иду́т
  - options: [да́рят, да́рит, дари́ть, дарю́]
    answer: да́рят
  - options: [рад, ра́ды, ра́да, занята́]
    answer: ра́да
  - options: [понра́вилась, понра́вились, понра́вилось, понра́вился]
    answer: понра́вился
  - options: [вас, вам, вы, ваш]
    answer: вам
  - options: [вку́сно, вку́сная, вку́сный, вку́сное]
    answer: вку́сный
  - options: [до́лжен, должна́, должны́, должно́]
    answer: до́лжен
  - options: [контро́льную, контро́льная, контро́льной, контро́льный]
    answer: контро́льная
  - options: [весёлый, весёлая, весёлые, ве́село]
    answer: ве́село
  - options: [ти́хая, ти́хую, ти́хом, ти́хой]
    answer: ти́хой
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ба́бушка и телефо́н**

    Ба́бушке Ми́ши се́мьдесят пять лет. Она́ живёт не в Москве́, а на да́че, и сын ча́сто звони́т ей. Ра́ньше ба́бушка не люби́ла компью́теры и звони́ла то́лько по телефо́ну: «Сообще́ния и ви́део мне не нужны́, я уже́ ста́рая!»

    Двадца́того ноября́ роди́тели подари́ли Ми́ше но́вый телефо́н, а ста́рый Ми́ша подари́л ба́бушке. «Ба́бушка, тепе́рь ты мо́жешь писа́ть нам сообще́ния и смотре́ть ви́део», — сказа́л он. Ба́бушка отве́тила: «Спаси́бо, но мне э́то не ну́жно».

    Но Ми́ша не волнова́лся. Ка́ждую суббо́ту он е́здил к ба́бушке на да́чу. Они́ сиде́ли на ку́хне, пи́ли чай, и Ми́ша ме́дленно всё пока́зывал ей. Ми́ше иногда́ бы́ло ску́чно, но он не говори́л об э́том.

    А сего́дня у́тром ба́бушка написа́ла А́нне сообще́ние: «До́брое у́тро! У нас на да́че пе́рвый снег!» И ещё ба́бушка отпра́вила ей ви́део: бе́лый лес, бе́лый сад и ста́рый дом.

    «Ба́бушка — молоде́ц!» — говори́т А́нна. Тепе́рь ба́бушка ка́ждый ве́чер пи́шет Ми́ше и А́нне. А звони́т она́, как и ра́ньше, то́лько па́пе.
    :::
  passage_zh: |
    **奶奶和手机**

    米沙的奶奶七十五岁了。她不住在莫斯科，而住在别墅，儿子常常给她打电话。以前奶奶不喜欢电脑，只打电话：“短信、视频我用不着，我已经老了！”

    十一月二十日，爸爸妈妈送给米沙一部新手机，米沙把旧手机送给了奶奶。“奶奶，现在您可以给我们发短信、看视频了。”他说。奶奶回答：“谢谢，可我用不着这个。”

    可是米沙不着急。每个星期六他都坐车去别墅看奶奶。他们坐在厨房里喝茶，米沙慢慢地把什么都教给她看。米沙有时觉得没意思，但他没说出来。

    今天早上奶奶给安娜写了一条短信：“早上好！我们别墅下第一场雪了！”奶奶还给她发了一段视频：白色的树林、白色的花园和老房子。

    “奶奶真行！”安娜说。现在奶奶每天晚上都给米沙和安娜写短信。至于打电话，她还是和以前一样，只给爸爸打。
  why: 第 1 题，第一句 [Ба́бушке Ми́ши се́мьдесят пять лет]{.ru}（年龄的主体用第三格，第 53 课）。第 2 题，[а ста́рый Ми́ша подари́л ба́бушке]{.ru}；新手机是爸爸妈妈送给米沙的。第 3 题，[Ка́ждую суббо́ту он е́здил к ба́бушке на да́чу]{.ru}。第 4 题是推断题：开头奶奶说 [мне э́то не ну́жно]{.ru}，现在她 [ка́ждый ве́чер пи́шет Ми́ше и А́нне]{.ru}，还给安娜发视频，可见她已经学会、也爱用手机了；[звони́т то́лько па́пе]{.ru} 说的是打电话，她并没有不再用手机。第 5 题是概括题：全文讲的是奶奶怎样从不要手机到每天用手机发短信，第一场雪、别墅只是其中的细节。
  items:
  - stem: Ба́бушке Ми́ши ___.
    options: [се́мьдесят шесть лет, шестьдеся́т пять лет, се́мьдесят пять лет, се́мьдесят лет]
    answer: се́мьдесят пять лет
  - stem: Ста́рый телефо́н Ми́ша подари́л ___.
    options: [ба́бушке, ма́ме, А́нне, па́пе]
    answer: ба́бушке
  - stem: Ми́ша е́здил к ба́бушке ___.
    options: [ка́ждое воскресе́нье, ка́ждую суббо́ту, ка́ждый день, ка́ждый ве́чер]
    answer: ка́ждую суббо́ту
  - stem: Тепе́рь ба́бушка ___.
    options: [не лю́бит телефо́н, ча́сто пи́шет сообще́ния, живёт в Москве́, звони́т то́лько А́нне]
    answer: ча́сто пи́шет сообще́ния
  - stem: Э́то расска́з о ___.
    options: [пе́рвом сне́ге на да́че, дне рожде́ния Ми́ши, ба́бушке и её телефо́не, ста́ром до́ме на да́че]
    answer: ба́бушке и её телефо́не
