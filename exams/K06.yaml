    Но сего́дня у Ли На просту́да: температу́ра и ка́шель, ей (4) []{.blank} (плохо́й). Она́ идёт к (5) []{.blank} (врач). Врач говори́т: «Вам (6) []{.blank} (ну́жен) лежа́ть до́ма три дня. И (7) []{.blank} (пить) горя́чий чай!»

    По́сле поликли́ники Ли На звони́т (8) []{.blank} (подру́га): «В суббо́ту (9) []{.blank} (вы) ну́жно е́хать без меня́». — «Ничего́, — отвеча́ет подру́га. — Экску́рсия бу́дет и в декабре́. А сего́дня ве́чером я (10) []{.blank} (купи́ть) тебе́ лека́рство в апте́ке».
