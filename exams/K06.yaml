lesson: K06
heading: 第六套
range: L01-L59
total: 150
names: [Ната́ша, Серёжа, Пётр Ива́нович, Ле́на, Ни́на Па́вловна Смирно́ва, Ли На, Ко́ля, Ве́ра, Оле́г, Тама́ра Петро́вна]
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答 [в библиоте́ку]{.ru} 是 [в]{.ru} + 第四格，表示去的方向，所以问“去哪儿”[куда́]{.ru}；[где]{.ru} 问处所，回答应是 [в библиоте́ке]{.ru}；[отку́да]{.ru} 问从哪儿来，[когда́]{.ru} 问时间（第 11、24、36 课）。第 2 题：[нет]{.ru} 后用第二格，形容词和名词都要变：[хоро́шего словаря́]{.ru}（第 32、34 课）；[хоро́шему словарю́]{.ru} 是第三格、[хоро́шим словарём]{.ru} 是第五格，都是这一阶段容易混的形式。第 3 题：“在上班”说 [на рабо́те]{.ru}，[рабо́та]{.ru} 和 [на]{.ru} 连用；前面说“不在家”，问的是在哪儿，用第六格，[на рабо́ту]{.ru} 是第四格，回答“去哪儿”（第 11、12、24 课）。第 4 题：[за́втра]{.ru} 说将来，又是一次、要有结果的事（买到帽子），用完成体将来时 [куплю́]{.ru}；[покупа́ю]{.ru} 是现在时，[купи́л, покупа́л]{.ru} 是过去时（第 43、45 课）。第 5 题：对方道谢，回答 [Пожа́луйста!]{.ru}“不客气”；[Извини́те]{.ru} 是道歉，[Здра́вствуйте]{.ru} 是见面问候，[Ничего́]{.ru} 用来回答别人的道歉（第 3、46 课）。第 6 题：站在地铁站旁边、和朋友一起去看电影，是在“等”朋友：[ждёт]{.ru}；[чита́ет]{.ru}、[зна́ет]{.ru}、[лю́бит]{.ru} 语法上能带第四格，但和情境不合（第 22 课）。第 7 题：[ка́ждое у́тро]{.ru} 表示经常往返，用不定向动词；[пешко́м]{.ru} 说明是走着去，所以用 [хо́дит]{.ru}；[ходи́ть]{.ru} 是不定式，句子缺谓语；[е́здит]{.ru}、[е́дет]{.ru} 是乘车（第 24、25 课）。第 8 题：晚上喝了咖啡就睡不着，所以晚上不喝：[спать]{.ru}；其他三个动词和“不喝咖啡”没有因果关系（第 26、27 课）。第 9 题：以 [два]{.ru} 结尾的数词后名词用单数第二格：[два́дцать два студе́нта]{.ru}；[студе́нтов]{.ru} 用在 [пять]{.ru} 以上的数词后（第 35 课）。第 10 题：[ле́кция]{.ru} 是事物，自己“开始”，用带 [-ся]{.ru} 的 [начина́ется]{.ru}；[начина́ть]{.ru} 要带直接补语，如 [начина́ть уро́к]{.ru}（第 38 课）。第 11 题：回答是价钱“九十卢布”，所以问题是 [Ско́лько сто́ит слова́рь?]{.ru}；问年龄回答应是 [… лет]{.ru}，问钟点回答 [… часо́в]{.ru}，问日期回答序数词（第 28、39、49、53 课）。第 12 题：[наконе́ц]{.ru}“终于”表示动作有了结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 只说做过这件事，不强调读完（第 42 课）。第 13 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ет]{.ru}；[купи́ла]{.ru}、[ку́пит]{.ru} 是完成体，表示一次的结果（第 45 课）。第 14 题：问的是星期天要做什么，用将来时；[быть]{.ru} 的将来时只能和未完成体不定式连用：[Бу́ду писа́ть]{.ru}；[бу́ду написа́ть]{.ru} 是常见错误，完成体变位本身就表示将来（[напишу́]{.ru}），不能再加 [бу́ду]{.ru}；[Писа́л]{.ru}、[Написа́л]{.ru} 是过去时，和“星期天要做什么”不配（第 41、43 课）。第 15 题：向陌生人打听事情，先说 [Извини́те, пожа́луйста]{.ru}“劳驾”；[Спаси́бо]{.ru} 是道谢，[Здра́вствуй]{.ru} 是对熟人的问候，[Пока́]{.ru} 是告别（第 2、46、59 课）。第 16 题：朋友都不在，书看完了，电视也坏了，一个人在家，只能是“无聊”：[ску́чно]{.ru}；[ве́село]{.ru}、[интере́сно]{.ru}、[хорошо́]{.ru} 和前面说的情况相反（第 58 课）。第 17 题：[звони́ть]{.ru} 要求第三格；[оте́ц]{.ru} 变格时 [е]{.ru} 脱落，第三格是 [отцу́]{.ru}；[отца́]{.ru} 是第二、四格（第 51 课）。第 18 题：[дари́ть]{.ru} 送给谁用第三格，[он]{.ru} 的第三格是 [ему́]{.ru}；送的东西 [кни́гу]{.ru} 是第四格；填 [его́]{.ru} 就成了 [его́ кни́гу]{.ru}“他的书”，句子变成“我想把他的书送出去”，缺了送给谁；[ей]{.ru} 是阴性，奥列格是男人（第 52、56 课）。第 19 题：说年龄时，人用第三格，物主代词和名词都要变：[Мое́й сестре́ два́дцать четы́ре го́да]{.ru}；照汉语“我姐姐二十四岁”用第一格 [Моя́ сестра́]{.ru} 是常见错误；[мое́й сестры́]{.ru} 是第二格，用在 [у]{.ru} 后面，[мою́ сестру́]{.ru} 是第四格（第 53、56 课）。第 20 题：外面零下二十度，不戴帽子不能出去，用 [нельзя́]{.ru}；[мо́жно]{.ru} 语法上通，意思和语境矛盾；[ну́жен]{.ru}、[рад]{.ru} 不能接不定式（第 54 课）。第 21 题：[ну́жен]{.ru} 和需要的东西在性、数上一致，[перча́тки]{.ru} 是复数，用 [нужны́]{.ru}；[ну́жно]{.ru} 后面接不定式（[мне ну́жно купи́ть перча́тки]{.ru}），不能直接接名词，这是最常见的错误；[ну́жен]{.ru}、[нужна́]{.ru} 是阳性、阴性单数（第 54、55 课）。第 22 题：[расска́зывать]{.ru} 讲给谁听用第三格，阴性形容词第三格词尾是 [-ой]{.ru}：[но́вой студе́нтке]{.ru}（第 56 课）。第 23 题：“某门课的测验、作业”用 [по]{.ru} + 第三格：[контро́льная по ру́сскому языку́]{.ru}；照汉语“俄语的测验”用第二格 [ру́сского языка́]{.ru} 是常见错误；[о ру́сском языке́]{.ru} 是“关于俄语”，[к]{.ru} + 第三格表示走向某人某处（第 57 课）。第 24 题：前面回答 [Нет]{.ru}，后面又说星期六要上班，所以是“没空”：[занята́]{.ru}；[свобо́дна]{.ru} 和 [Нет]{.ru} 矛盾，[ра́да]{.ru}、[больна́]{.ru} 和“要上班”接不上（第 59 课）。第 25 题：对方说要走了，回答告别用语 [Пока́! До ве́чера!]{.ru}；[Приве́т]{.ru}、[Здра́вствуй]{.ru} 是见面问候（第 2、59 课）。
  items:
  - stem: — ___ ты идёшь? — В библиоте́ку.
    options: [Где, Куда́, Отку́да, Когда́]
    answer: Куда́
  - stem: 'Я не могу́ прочита́ть э́то сло́во: до́ма у меня́ нет ___.'
    options: [хоро́ший слова́рь, хоро́шего словаря́, хоро́шему словарю́, хоро́шим словарём]
    answer: хоро́шего словаря́
  - stem: Мой оте́ц сейча́с не до́ма, он ___.
    options: [в рабо́те, на рабо́ту, на рабо́те, в рабо́ту]
    answer: на рабо́те
  - stem: На у́лице моро́з, а у меня́ нет ша́пки. За́втра я ___ её.
    options: [покупа́ю, куплю́, купи́л, покупа́л]
    answer: куплю́
  - stem: — Большо́е спаси́бо! — ___
    options: [Пожа́луйста!, Извини́те!, Здра́вствуйте!, Ничего́!]
    answer: Пожа́луйста!
  - stem: 'Ко́ля стои́т у метро́ и ___ дру́га: они́ иду́т в кино́.'
    options: [чита́ет, зна́ет, ждёт, лю́бит]
    answer: ждёт
  - stem: Ка́ждое у́тро мой брат ___ в шко́лу пешко́м.
    options: [ходи́ть, е́здит, е́дет, хо́дит]
    answer: хо́дит
  - stem: 'Ве́чером Ната́ша не пьёт ко́фе: пото́м она́ не мо́жет ___.'
    options: [чита́ть, спать, рабо́тать, гуля́ть]
    answer: спать
  - stem: В на́шей гру́ппе два́дцать два ___.
    options: [студе́нт, студе́нта, студе́нтов, студе́нты]
    answer: студе́нта
  - stem: Ле́кция ___ в де́вять часо́в.
    options: [начина́ет, начина́ются, начина́ется, начина́ть]
    answer: начина́ется
  - stem: — ___ — Девяно́сто рубле́й.
    options: ['Ско́лько сто́ит слова́рь?', 'Ско́лько вам лет?', 'Кото́рый час?', 'Како́е сего́дня число́?']
    answer: 'Ско́лько сто́ит слова́рь?'
  - stem: Вчера́ Оле́г наконе́ц ___ рома́н «Война́ и мир».
    options: [чита́л, чита́ет, прочита́ет, прочита́л]
    answer: прочита́л
  - stem: Ка́ждое у́тро ба́бушка ___ хлеб в бу́лочной.
    options: [купи́ла, ку́пит, покупа́ет, купи́ть]
    answer: покупа́ет
  - stem: — Что ты бу́дешь де́лать в воскресе́нье? — ___ письмо́ ба́бушке.
    options: [Бу́ду писа́ть, Бу́ду написа́ть, Писа́л, Написа́л]
    answer: Бу́ду писа́ть
  - stem: — ___, пожа́луйста, где здесь по́чта? — Вон там.
    options: [Спаси́бо, Извини́те, Здра́вствуй, Пока́]
    answer: Извини́те
  - stem: 'Друзья́ на да́че, кни́ги Ко́ля уже́ прочита́л, телеви́зор не рабо́тает. Ко́ле ___.'
    options: [ску́чно, ве́село, интере́сно, хорошо́]
    answer: ску́чно
  - stem: Ка́ждое воскресе́нье Ве́ра звони́т ___.
    options: [отца́, оте́ц, отце́, отцу́]
    answer: отцу́
  - stem: За́втра у Оле́га день рожде́ния. Я хочу́ подари́ть ___ кни́гу.
    options: [его́, ему́, он, ей]
    answer: ему́
  - stem: ___ два́дцать четы́ре го́да, а она́ уже́ врач.
    options: [Моя́ сестра́, Мою́ сестру́, Мое́й сестре́, Мое́й сестры́]
    answer: Мое́й сестре́
  - stem: Ко́ля, на у́лице ми́нус два́дцать, без ша́пки тебе́ ___ гуля́ть.
    options: [мо́жно, нельзя́, ну́жен, рад]
    answer: нельзя́
  - stem: 'На у́лице моро́з, а у меня́ холо́дные ру́ки: мне ___ перча́тки.'
    options: [ну́жен, нужна́, ну́жно, нужны́]
    answer: нужны́
  - stem: Преподава́тель расска́зывает ___ студе́нтке о Москве́.
    options: [но́вой, но́вая, но́вую, но́вом]
    answer: но́вой
  - stem: За́втра у нас контро́льная ___, а я ещё не зна́ю но́вые слова́.
    options: [ру́сского языка́, по ру́сскому языку́, о ру́сском языке́, к ру́сскому языку́]
    answer: по ру́сскому языку́
  - stem: '— Ната́ша, ты свобо́дна в суббо́ту? — Нет, я ___: в суббо́ту у меня́ рабо́та.'
    options: [ра́да, больна́, свобо́дна, занята́]
    answer: занята́
  - stem: — Извини́, я до́лжен идти́. — ___
    options: [Пока́! До ве́чера!, Приве́т!, Здра́вствуй!, Пожа́луйста!]
    answer: Пока́! До ве́чера!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок для де́душки**

    Де́душке Ната́ши се́мьдесят пять лет, он живёт оди́н на да́че. Ра́ньше он мно́го (1) []{.blank}, но тепе́рь пло́хо (2) []{.blank}, и ве́чером ему́ (3) []{.blank}. Да́ча (4) []{.blank}, и Ната́ша е́здит туда́ (5) []{.blank}: она́ у́чится в Москве́.

    На день рожде́ния она́ (6) []{.blank} де́душке (7) []{.blank}. «Спаси́бо, — сказа́л он, — но звони́ть я не люблю́». — «А тебе́ и не на́до (8) []{.blank}, — отве́тила Ната́ша. — Звони́ть бу́ду я. Я бу́ду (9) []{.blank} тебе́ рома́н, а ты бу́дешь (10) []{.blank}».

    Тепе́рь ка́ждый ве́чер она́ (11) []{.blank} ему́ и чита́ет Толсто́го. Рома́н (12) []{.blank}: они́ чита́ют его́ уже́ ме́сяц. Иногда́ де́душка (13) []{.blank}: «А кто э́то?» В семь часо́в он уже́ сиди́т у телефо́на и (14) []{.blank}. А Ната́ше то́же (15) []{.blank}: ра́ньше она́ не люби́ла Толсто́го, а тепе́рь он ей (16) []{.blank}.

    Неде́лю наза́д у неё была́ контро́льная, и она́ (17) []{.blank} позвони́ть. В во́семь часо́в (18) []{.blank} де́душка: «Ната́ша, где ты? Я (19) []{.blank}!» А ведь ра́ньше он не люби́л (20) []{.blank}!
    :::
  glossary:
  - {ru: ведь, pos: part., zh: 要知道，可是}
  passage_zh: |
    **给爷爷的礼物**

    娜塔莎的爷爷七十五岁了，一个人住在别墅。他以前看很多书，可现在眼睛不好，晚上很无聊。别墅很远，娜塔莎在莫斯科上学，很少去那儿。

    爷爷过生日，她送了爷爷一部手机。“谢谢，”爷爷说，“可我不爱打电话。”——“你用不着打，”娜塔莎说，“我来打。我给你读小说，你听着就行。”

    从此她每天晚上给爷爷打电话，给他读托尔斯泰。小说很长，他们已经读了一个月。爷爷有时会问：“这人是谁呀？”七点钟他就坐在电话旁边等着了。娜塔莎也觉得有意思：她以前不喜欢托尔斯泰，现在倒喜欢上了。

    一个星期前她有测验，忘了打电话。八点钟，爷爷自己打来了：“娜塔莎，你在哪儿？我等着呢！”可他以前是不喜欢电话的！
  why: 第 1 空：后面说“现在眼睛不好”，又说读小说给他听，可见他以前爱读书：[чита́л]{.ru}。第 2 空：要读后文：孙女读书给他听，可见是看不清，[ви́дит]{.ru}；吃饭、睡觉、写字不好不会让人改成听书（第 9 课）。第 3 空：一个人住、不能看书，晚上没事做：[ску́чно]{.ru}；与后文“现在七点就坐在电话旁等”形成对照（第 58 课）。第 4、5 空：别墅远，她又在莫斯科上学，所以很少去：[далеко́]{.ru}、[ре́дко]{.ru}；[ча́сто]{.ru}、[ка́ждый день]{.ru} 和冒号后的理由矛盾（第 14、25 课）。第 6 空：过生日送礼物：[подари́ла]{.ru}（第 56 课）。第 7 空：爷爷马上说“我不爱打电话”，送的是手机 [телефо́н]{.ru}（第 8 课）。第 8 空：接着上一句“我不爱打电话”：[звони́ть]{.ru}。第 9、10 空：她读，他听：[чита́ть]{.ru}、[слу́шать]{.ru}。第 11 空：前面说好了由她打电话：[звони́т]{.ru}（第 51 课）。第 12 空：冒号后“已经读了一个月”说明书很长：[дли́нный]{.ru}；[интере́сный]{.ru} 解释不了“读一个月”。第 13 空：[«А кто э́то?»]{.ru} 是问话：[спра́шивает]{.ru}。第 14 空：七点就坐在电话旁，是在等：[ждёт]{.ru}。第 15 空：[то́же]{.ru} 指和爷爷一样觉得有意思：[интере́сно]{.ru}（第 58 课）。第 16 空：[а тепе́рь]{.ru} 与“以前不喜欢”相对：[нра́вится]{.ru}，主语是 [он]{.ru}（托尔斯泰），喜欢的人用第三格 [ей]{.ru}（第 52 课）。第 17 空：有测验，没打电话：[забы́ла]{.ru}（第 47 课）。第 18 空：这次是爷爷打来的：[позвони́л]{.ru}，和结尾“他以前不喜欢电话”呼应。第 19 空：[жду]{.ru}。第 20 空：要回到第二段爷爷说的“我不爱打电话”：[телефо́н]{.ru}。
  items:
  - options: [гуля́л, чита́л, рабо́тал, игра́л]
    answer: чита́л
  - options: [ест, спит, пи́шет, ви́дит]
    answer: ви́дит
  - options: [ску́чно, ве́село, интере́сно, хорошо́]
    answer: ску́чно
  - options: [бли́зко, ря́дом, далеко́, здесь]
    answer: далеко́
  - options: [ча́сто, ка́ждый день, ре́дко, всегда́]
    answer: ре́дко
  - options: [показа́ла, подари́ла, написа́ла, прочита́ла]
    answer: подари́ла
  - options: [кни́гу, ша́пку, ча́шку, телефо́н]
    answer: телефо́н
  - options: [звони́ть, чита́ть, писа́ть, слу́шать]
    answer: звони́ть
  - options: [слу́шать, писа́ть, чита́ть, покупа́ть]
