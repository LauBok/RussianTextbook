  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Ю́ми и моро́з**

    Ю́ми — япо́нка, ей два́дцать (1) []{.blank} (год). В Москве́ она́ (2) []{.blank} (жить) уже́ три ме́сяца. Вчера́ ей о́чень (3) []{.blank} (понра́виться) бале́т «Лебеди́ное о́зеро». Но ру́сская пого́да ей не нра́вится: на у́лице ей всегда́ (4) []{.blank} (холо́дный).

    Сего́дня у Ю́ми ка́шель, и она́ идёт к (5) []{.blank} (врач). Врач говори́т: «Вам (6) []{.blank} (ну́жен) тёплая оде́жда. И (7) []{.blank} (пить) мно́го горя́чего ча́я!»

    По́сле поликли́ники Ю́ми звони́т (8) []{.blank} (А́нна). В суббо́ту (9) []{.blank} (они́) ну́жно купи́ть тёплую оде́жду. «В суббо́ту я (10) []{.blank} (купи́ть) тёплое пальто́ и бу́ду гуля́ть ка́ждый день!» — говори́т Ю́ми.
