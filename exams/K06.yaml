  passage_zh: |
    **楼道里的书**

    我们的邻居塔玛拉·彼得罗夫娜以前在图书馆工作，家里有不少旧书：小说、词典、写莫斯科的书。现在这些书她用不着了，可是扔掉又舍不得。

    九月，她在我们的楼道里放了一张旧桌子，把书放在上面，旁边放了一张字条：“请拿去读吧！您的书已经用不着了？请放到这里来！”

    头一个星期，书只是在桌上放着：邻居们看看，可是不拿。后来中学生科利亚拿了一本讲足球的书，6 号房间的女大学生拿了一本词典。到了十月，桌上已经放着新的书和杂志了。这些不是塔玛拉·彼得罗夫娜买的：是邻居们送的。

    现在邻居们常常站在桌子旁边，聊聊书，聊聊电影。以前我不知道 6 号房间那个女大学生叫什么。现在我知道了：她叫薇拉，在语文系上学，喜欢普希金的诗。昨天我把我的小说借给她，她把一本普希金的书借给我。

    塔玛拉·彼得罗夫娜非常高兴。“我的书又有人读了，”她说，“我现在也不寂寞了：邻居们常给我打电话，我们一聊就聊很久。”
  why: 第 1 题，第一段说这些书 [ей не нужны́, но вы́бросить их ей жаль]{.ru}，所以放到楼道里给别人；她“以前”在图书馆工作，现在不在，[она́ рабо́тает в библиоте́ке]{.ru} 和文中的 [Ра́ньше]{.ru} 矛盾；文中没有提到钱，她也没有买新书。第 2 题，[сосе́ди смотре́ли на них, но не бра́ли]{.ru}：头一个星期邻居只看不拿；拿词典、看书都是后来的事。第 3 题是推断题：桌旁写着 [Ва́ша кни́га вам уже́ не нужна́? Положи́те её сюда́!]{.ru}，用不着的书放到楼道的桌子上就行；文中没说要送给塔玛拉·彼得罗夫娜本人或科利亚。第 4 题是推断题：讲故事的“我”说 [в на́шем подъе́зде]{.ru}，和塔玛拉·彼得罗夫娜住在同一栋楼；他用阳性过去时 [я не знал]{.ru}，所以不是薇拉，也不是塔玛拉·彼得罗夫娜（文中用第三人称说她，并引用她的话）；“我”以前不知道薇拉叫什么，也不是还在上中学的科利亚——科利亚在文中同样是第三人称。第 5 题是概括题：全文讲旧书放进楼道以后，邻居们开始读书、聊天、互相认识，塔玛拉·彼得罗夫娜也常和邻居们打电话聊天；书不是买来送给她的，打电话的也不只是薇拉。
  items:
  - stem: 'Тама́ра Петро́вна поста́вила в подъе́зде стол и положи́ла на него́ кни́ги: ___.'
    options: [ей нужны́ де́ньги, она́ рабо́тает в библиоте́ке, ей не нужны́ ста́рые кни́ги, она́ купи́ла но́вые кни́ги]
    answer: ей не нужны́ ста́рые кни́ги
  - stem: Пе́рвую неде́лю сосе́ди ___.
    options: [то́лько смотре́ли на кни́ги, бра́ли слова́ри, чита́ли кни́ги в подъе́зде, покупа́ли кни́ги]
    answer: то́лько смотре́ли на кни́ги
  - stem: Вы живёте в э́том до́ме, и вам уже́ не ну́жен ваш ста́рый слова́рь. Его́ мо́жно ___.
    options: [подари́ть Тама́ре Петро́вне, положи́ть на стол в подъе́зде, дать Ко́ле, купи́ть но́вый]
    answer: положи́ть на стол в подъе́зде
  - stem: Кто расска́зывает э́ту исто́рию?
    options: [Ве́ра, Тама́ра Петро́вна, Ко́ля, сосе́д Тама́ры Петро́вны]
    answer: сосе́д Тама́ры Петро́вны
  - stem: Тепе́рь в э́том до́ме сосе́ди ___.
    options: [покупа́ют кни́ги Тама́ре Петро́вне, чита́ют и ча́сто разгова́ривают, рабо́тают в библиоте́ке, звоня́т то́лько Ве́ре]
    answer: чита́ют и ча́сто разгова́ривают
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Экску́рсия**

    Ли На — китая́нка, ей два́дцать (1) []{.blank} (год). Она́ у́чится в Каза́ни и (2) []{.blank} (жить) в общежи́тии. Её гру́ппа е́дет на экску́рсию в Москву́, а Ли На там ещё не была́. Неда́вно она́ смотре́ла фильм о Москве́, и он ей о́чень (3) []{.blank} (понра́виться).

    Но в день экску́рсии у неё температу́ра и ка́шель, ей (4) []{.blank} (плохо́й), и она́ идёт не на вокза́л, а к (5) []{.blank} (врач). Врач говори́т: «(6) []{.blank} (пить) горя́чий чай, и вам (7) []{.blank} (ну́жно / ну́жен) лежа́ть до́ма три дня».

    Ли На звони́т (8) []{.blank} (подру́га): «Я не е́ду». — «Ничего́, — отвеча́ет подру́га. — Экску́рсия бу́дет и в декабре́. Я позвоню́ (9) []{.blank} (ты) ве́чером, а сейча́с (10) []{.blank} (купи́ть) тебе́ лека́рство».
    :::
  passage_zh: |
    **游览**

    李娜是中国姑娘，二十岁，在喀山上学，住在宿舍里。她们班要去莫斯科游览，李娜还没去过莫斯科。前不久她看了一部讲莫斯科的电影，非常喜欢。

    可到了游览那天，她发烧、咳嗽，很难受，去的不是火车站，而是医生那儿。医生说：“喝点热茶，您得在家躺三天。”

    李娜给一个女朋友打电话：“我去不了了。”——“没关系，”朋友说，“十二月还有游览。我晚上给你打电话，现在先去给你买药。”
  why: 第 1 空：[два́дцать]{.ru} 以零结尾，后面用 [лет]{.ru}（第 53 课）。第 2 空：[жить]{.ru} 第三人称单数 [живёт]{.ru}，词干加 [в]{.ru}（第 14 课）。第 3 空：说的是看过的电影，用过去时；[понра́виться]{.ru} 和主语 [он]{.ru}（指 [фильм]{.ru}）一致，阳性 [понра́вился]{.ru}；常见错误是按 [ей]{.ru} 写成阴性（第 52 课）。第 4 空：无人称句里主体 [ей]{.ru} 用第三格，谓语用副词 [пло́хо]{.ru}，不用形容词（第 58 课）。第 5 空：[к]{.ru} + 第三格，[врач → врачу́]{.ru}，重音在词尾（第 57 课）。第 6 空：医生对病人提要求，用命令式；医生称病人“您”（后文 [вам]{.ru}），所以用 [пе́йте]{.ru}；[пить]{.ru} 的命令式是 [пей, пе́йте]{.ru}，不要写成 [пи́те]{.ru}（第 46、57 课）。第 7 空：后面接不定式 [лежа́ть]{.ru}，没有名词作主语，用 [ну́жно]{.ru}；[ну́жен]{.ru} 要和名词主语一致，如 [Мне ну́жен врач]{.ru}（第 54、55 课）。第 8 空：[звони́ть]{.ru} 要求第三格：[подру́ге]{.ru}（第 51 课）。第 9 空：[звони́ть]{.ru} 要求第三格，[ты → тебе́]{.ru}；[тебя́]{.ru} 是第二、四格（第 51、52 课）。第 10 空：马上要做的一次、有结果的事，用完成体将来时 [куплю́]{.ru}；[купи́ть]{.ru} 变位时 [п]{.ru} 后加 [л]{.ru}（第 43、44 课）。
  items:
