  passage: |
    ::: {.prose lang="ru"}
    Дорога́я ба́бушка!

    Извини́, я давно́ не писа́ла: у меня́ бы́ло мно́го рабо́ты. Я уже́ ме́сяц живу́ во Владивосто́ке и учу́сь в университе́те. Сейча́с у меня́ уже́ ве́чер, де́сять часо́в, а у тебя́ в Москве́ ещё день, три часа́.

    Го́род мне о́чень нра́вится. Он большо́й и краси́вый, и здесь мо́ре. Я живу́ в общежи́тии, и из окна́ я ви́жу мо́ре. В мое́й ко́мнате живёт ещё одна́ студе́нтка, она́ из Коре́и. Она́ ещё пло́хо говори́т по-ру́сски, и ве́чером мы вме́сте де́лаем зада́ние.

    В октябре́ здесь ещё тепло́, но на у́лице всегда́ ве́тер, и мне нужна́ тёплая ку́ртка. В суббо́ту я купи́ла её на ры́нке. Ты спра́шиваешь о еде́. Не волну́йся: у́тром я ем ка́шу, а обе́даю в университе́те. Здесь о́чень вку́сная ры́ба.

    Два́дцать пя́того октября́ у тебя́ день рожде́ния. Я уже́ купи́ла тебе́ пода́рок — краси́вую ча́шку — и вчера́ отпра́вила его́. Пиши́ мне!

    Твоя́ Ле́на
    :::
  passage_zh: |
    亲爱的奶奶：

    对不起，我好久没写信了：我事情很多。我在符拉迪沃斯托克已经住了一个月，在大学上学。我这儿现在已经是晚上十点了，你那儿莫斯科还是白天，下午三点。

    我非常喜欢这座城市。它又大又漂亮，这里有海。我住在宿舍，从窗口就能看见大海。我的房间里还住着一个女生，她是韩国人。她俄语还说得不好，晚上我们一起做作业。

    十月这里还挺暖和，可外面总是刮风，我需要一件暖和的外套。星期六我在市场上买了一件。你问起吃饭的事。别担心：早上我吃粥，午饭在学校吃。这里的鱼非常好吃。

    十月二十五日是你的生日。我已经给你买了礼物——一只漂亮的杯子，昨天寄出去了。给我写信吧！

    你的列娜
  why: 第 1 题，称呼是 [Дорога́я ба́бушка!]{.ru}，信里还说 [у тебя́ день рожде́ния]{.ru}，是写给奶奶的。第 2 题，[Я уже́ ме́сяц живу́ во Владивосто́ке]{.ru}。第 3 题，[из окна́ я ви́жу мо́ре]{.ru}。第 4 题是推断题：列娜那里晚上十点时，莫斯科是下午三点，两地相差七个小时，莫斯科晚七小时；符拉迪沃斯托克早上八点，莫斯科才夜里一点，所以是夜里。第 5 题是找信中没提的内容：天气（十月暖和、刮风）、吃饭（粥、鱼）、礼物（杯子）都写到了，没有提到电影。
  items:
  - stem: Ле́на пи́шет письмо́ ___.
    options: [ба́бушке, ма́ме и па́пе, сестре́, подру́ге]
    answer: ба́бушке
  - stem: Во Владивосто́ке Ле́на живёт уже́ ___.
    options: [год, неде́лю, два ме́сяца, ме́сяц]
    answer: ме́сяц
  - stem: Из окна́ Ле́на ви́дит ___.
    options: [лес, парк, мо́ре, университе́т]
    answer: мо́ре
  - stem: Во Владивосто́ке у́тро, во́семь часо́в. В Москве́ сейча́с ___.
    options: [день, ночь, ве́чер, у́тро]
    answer: ночь
  - stem: В письме́ Ле́на не пи́шет о ___.
    options: [пого́де, еде́, пода́рке, кино́]
    answer: кино́
