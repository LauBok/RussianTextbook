  passage_zh: |
    **游览**

    李娜是中国姑娘，她二十岁。她在喀山上学，住在宿舍里。星期六她们班要去莫斯科游览。李娜还没去过莫斯科。昨天她看了一部讲莫斯科的电影，非常喜欢。

    可是今天李娜感冒了：发烧、咳嗽，她很难受。她去看医生。医生说：“您需要在家躺三天。还要喝热茶！”

    从诊所出来，李娜给一个女朋友打电话：“星期六你们得自己去了，不带我了。”——“没关系，”朋友回答，“十二月还有游览。今天晚上我去药店给你买药。”
  why: 第 1 空：[два́дцать]{.ru} 以零结尾，后面用 [лет]{.ru}（第 53 课）。第 2 空：[жить]{.ru} 第三人称单数 [живёт]{.ru}，词干加 [в]{.ru}（第 14 课）。第 3 空：[вчера́]{.ru} 用过去时，[понра́виться]{.ru} 和主语 [он]{.ru}（指 [фильм]{.ru}）一致，阳性 [понра́вился]{.ru}；常见错误是按 [ей]{.ru} 写成阴性（第 52 课）。第 4 空：无人称句里主体 [ей]{.ru} 用第三格，谓语用副词 [пло́хо]{.ru}，不用形容词（第 58 课）。第 5 空：[к]{.ru} + 第三格，[врач → врачу́]{.ru}，重音在词尾（第 57 课）。第 6 空：后面接的是不定式 [лежа́ть]{.ru}，没有名词作主语，用中性 [ну́жно]{.ru}（第 54、55 课）。第 7 空：医生对“您”提建议，用复数命令式 [пе́йте]{.ru}；[пить]{.ru} 的命令式是 [пей, пе́йте]{.ru}（第 46、57 课）。第 8 空：[звони́ть]{.ru} 要求第三格：[подру́ге]{.ru}（第 51 课）。第 9 空：[ну́жно]{.ru} 的主体用第三格，[вы → вам]{.ru}（第 52、54 课）。第 10 空：说的是今天晚上一次的、有结果的动作，用完成体将来时 [куплю́]{.ru}；[купи́ть]{.ru} 变位时 [п]{.ru} 后加 [л]{.ru}（第 43、44 课）。
