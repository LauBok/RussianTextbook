    Ко́стя!

    Сего́дня у ба́бушки день рожде́ния, ей се́мьдесят четы́ре (1) []{.blank} (год). Ве́чером мы е́дем к (2) []{.blank} (она́). Пода́рок я уже́ (3) []{.blank} (покупа́ть / купи́ть) — тёплый шарф.

