  - stem: Ван Лэй пи́шет письмо́ ___.
    options: [ма́ме и па́пе, А́нне и Ми́ше, Мари́и Никола́евне, О́льге Ви́кторовне]
    answer: ма́ме и па́пе
  - stem: Две неде́ли наза́д у Ван Лэ́я ___.
    options: [был день рожде́ния, была́ экску́рсия, был конце́рт, была́ просту́да]
    answer: была́ просту́да
  - stem: 'Врач сказа́л: «Вам на́до три дня ___».'
    options: [ходи́ть на заня́тия, гуля́ть по го́роду, лежа́ть до́ма, писа́ть пи́сьма]
    answer: лежа́ть до́ма
  - stem: 'На у́лице ми́нус два́дцать, но Ван Лэ́ю не хо́лодно: у него́ ___.'
    options: [температу́ра, тёплая оде́жда, но́вый телефо́н, футбо́льный мяч]
    answer: тёплая оде́жда
