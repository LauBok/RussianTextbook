    options: ['22.00', '20.00', '21.00', '19.30']
    answer: '20.00'
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Чужо́й чемода́н**

    В воскресе́нье Та́ня возвраща́лась из Каза́ни в Москву́. У неё был то́лько ма́ленький чёрный чемода́н. Напро́тив неё в ваго́не сиде́л молодо́й челове́к. Он всё вре́мя чита́л кни́гу на кита́йском языке́ и иногда́ смотре́л в слова́рь. У него́ то́же был ма́ленький чёрный чемода́н.

    По́езд был в Москве́ по́здно ве́чером. Та́ня взяла́ чемода́н и че́рез час была́ уже́ до́ма. Она́ о́чень хоте́ла спать и откры́ла чемода́н то́лько у́тром. Там лежа́ли мужска́я ку́ртка, кни́ги и большо́й кита́йско-ру́сский слова́рь. На словаре́ Та́ня уви́дела и́мя и но́мер телефо́на: «Ю́рий, 8-915-247-30-18». Она́ сра́зу позвони́ла.

    — Алло́, — отве́тил мужско́й го́лос.

    — Ю́рий? Здра́вствуйте. Вчера́ в по́езде вы сиде́ли напро́тив меня́. Ка́жется, у меня́ ваш чемода́н.

    — Пра́вда? Я его́ ещё не открыва́л… Да, э́то не мой чемода́н! А мне сего́дня о́чень ну́жен мой слова́рь: в два часа́ у меня́ уро́к. Где вы живёте? Я сейча́с е́ду к вам.

    — На у́лице Королёва, дом семь.

    — Как? Я то́же живу́ в до́ме семь! Вы в како́м подъе́зде?

    — Во второ́м, кварти́ра со́рок.

    — А я в пя́том.

    Че́рез пять мину́т Ю́рий позвони́л ей в дверь.

    — Спаси́бо вам! — сказа́л он. — Без словаря́ я не могу́ рабо́тать: я преподава́тель кита́йского языка́.

    — Пра́вда? — сказа́ла Та́ня. — А я давно́ хочу́ изуча́ть кита́йский!
    :::
  glossary:
  - {ru: мужско́й, pos: adj., zh: 男人的，男式的}
  - {ru: кита́йско-ру́сский, pos: adj., zh: 汉俄（词典）}
  passage_zh: |
    **别人的箱子**

    星期天，塔尼娅从喀山回莫斯科。她只带了一个黑色的小箱子。车厢里，她对面坐着一个年轻人。他一路都在读一本中文书，时不时查查词典。他也有一个黑色的小箱子。

    火车到莫斯科已经是深夜了。塔尼娅拿起箱子，一个小时以后就到家了。她困极了，直到早上才打开箱子。里面放着一件男式外套、几本书和一本厚厚的汉俄词典。塔尼娅在词典上看到一个名字和电话号码：“尤里，8-915-247-30-18”。她马上打了过去。

    “喂。”一个男人的声音。

    “是尤里吗？您好。昨天在火车上您坐在我对面。我手里好像是您的箱子。”

    “真的？我还没打开呢……对，这不是我的箱子！我今天特别需要我的词典：两点钟我有课。您住在哪儿？我这就去您那儿。”

    “科罗廖夫街七号楼。”

    “什么？我也住在七号楼！您是几单元？”

    “二单元，四十号。”

    “我是五单元。”

    五分钟以后，尤里按响了她家的门铃。

    “太谢谢您了！”他说，“没有词典我没法工作：我是教汉语的。”

    “真的？”塔尼娅说，“我早就想学汉语了！”
  why: 第 1 题是词义猜测：塔尼娅打开箱子，里面是男式外套和别人的词典，她马上打电话说 [у меня́ ваш чемода́н]{.ru}，可见 [чужо́й]{.ru} 是“别人的、不是她的”；箱子确实又小又黑，但这不是 [чужо́й]{.ru} 的意思，文中也没说箱子旧。第 2 题是推断题：文中先后说塔尼娅的箱子 [ма́ленький чёрный]{.ru}，尤里的 [то́же]{.ru} 是 [ма́ленький чёрный]{.ru}，两人又坐对面，所以拿错了；尤里没有把箱子交给她，文中也没说她喜欢他的箱子、她的箱子在别的车厢。第 3 题，[На словаре́ Та́ня уви́дела и́мя и но́мер телефо́на]{.ru}；尤里在火车上读的那本书、外套都是干扰项。第 4 题是推断题：塔尼娅住在科罗廖夫街七号楼二单元，尤里也住七号楼，在五单元，所以五分钟就到了；他和她同楼不同单元，[в её подъе́зде]{.ru} 不对；文中没说他住在隔壁街，也没说他在她单元门口等着。第 5 题是推断题：尤里刚说自己是汉语老师，塔尼娅马上说她早就想学汉语，言下之意是想跟他学；她没提要买词典，也没说要去中国，“她想学”说明她现在还不会说汉语。
  items:
  - stem: '«Чужо́й чемода́н» для Та́ни — э́то ___ чемода́н.'
    options: [о́чень ма́ленький, ста́рый, не её, чёрный]
    answer: не её
  - stem: Почему́ Та́ня взяла́ чемода́н Ю́рия?
    options: [Ю́рий дал ей не тот чемода́н., Её чемода́н был в друго́м ваго́не., Ей понра́вился чемода́н Ю́рия., Чемода́н Ю́рия то́же был ма́ленький и чёрный.]
    answer: Чемода́н Ю́рия то́же был ма́ленький и чёрный.
  - stem: Но́мер телефо́на Ю́рия Та́ня уви́дела ___.
    options: [в кни́ге на кита́йском языке́, на словаре́, в ку́ртке, на чемода́не]
    answer: на словаре́
  - stem: Почему́ Ю́рий был у Та́ни уже́ че́рез пять мину́т?
    options: [Он живёт в её подъе́зде., Он живёт на сосе́дней у́лице., Он живёт в её до́ме., Он ждал у её подъе́зда.]
    answer: Он живёт в её до́ме.
  - stem: 'Та́ня говори́т Ю́рию: «А я давно́ хочу́ изуча́ть кита́йский!» Что она́ хо́чет сказа́ть?'
    options: [Она́ хо́чет брать у Ю́рия уро́ки кита́йского языка́., Ей ну́жен большо́й слова́рь., Она́ уже́ хорошо́ говори́т по-кита́йски., Она́ ско́ро е́дет в Кита́й.]
    answer: Она́ хо́чет брать у Ю́рия уро́ки кита́йского языка́.
