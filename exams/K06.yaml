  passage: |
    ::: {.prose lang="ru"}
    **Кни́ги в подъе́зде**

    На́ша сосе́дка Тама́ра Петро́вна ра́ньше рабо́тала в библиоте́ке, и до́ма у неё бы́ли ста́рые кни́ги: рома́ны, слова́ри, кни́ги о Москве́. Тепе́рь они́ ей не нужны́, но вы́бросить их ей жаль.

    В сентябре́ она́ поста́вила в на́шем подъе́зде ста́рый стол и положи́ла на него́ кни́ги. Ря́дом она́ положи́ла запи́ску: «Бери́те и чита́йте! Ва́ша кни́га вам уже́ не нужна́? Положи́те её сюда́!»

    Пе́рвую неде́лю кни́ги про́сто лежа́ли на столе́: сосе́ди смотре́ли на них, но не бра́ли. Пото́м шко́льник Ко́ля взял кни́гу о футбо́ле, а студе́нтка из кварти́ры но́мер шесть — слова́рь. А в октябре́ на столе́ лежа́ли уже́ но́вые кни́ги и журна́лы. Тама́ра Петро́вна их не покупа́ла: э́то пода́рки сосе́дей.

    Тепе́рь сосе́ди ча́сто стоя́т у стола́ и разгова́ривают о кни́ге и́ли о фи́льме. Ра́ньше я не знал, как зову́т студе́нтку из шесто́й кварти́ры. А тепе́рь я зна́ю: её зову́т Ве́ра, она́ у́чится на филологи́ческом факульте́те и лю́бит стихи́ Пу́шкина. Вчера́ я дал ей рома́н, а она́ мне — кни́гу Пу́шкина.

    Тама́ра Петро́вна о́чень ра́да. «Мои́ кни́ги опя́ть чита́ют, — говори́т она́. — И мне тепе́рь не ску́чно: сосе́ди ча́сто звоня́т мне, и мы до́лго разгова́риваем».
    :::
