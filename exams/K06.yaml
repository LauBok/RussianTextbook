    ::: {.prose lang="ru"}
    **Ва́жные пра́вила**

    Ка́ждый иностра́нец в Росси́и до́лжен знать: в ру́сском до́ме есть ва́жные пра́вила.

    Пе́рвое пра́вило: в кварти́ре боти́нки на́до снять. Хозя́ин даёт вам та́почки. Э́то пра́вило осо́бенно ва́жно в ноябре́ и в декабре́: на у́лице снег и вода́.

    Второ́е пра́вило: пото́м ну́жно помы́ть ру́ки в ва́нной. Ру́сские де́лают так ка́ждый день, и де́ти то́же.

    Тре́тье пра́вило: в ко́мнате обы́чно не едя́т. Есть и пить чай мо́жно на ку́хне. Ру́сские лю́бят ку́хню: там они́ обе́дают, у́жинают и до́лго разгова́ривают.

    А как дари́ть пода́рки? Цветы́ да́рят так: оди́н, три, пять, семь. Два и́ли четы́ре цветка́ дари́ть нельзя́. Пусто́й кошелёк то́же не да́рят: туда́ на́до положи́ть моне́ту. Ру́сские говоря́т: тогда́ у ва́шего дру́га всегда́ бу́дут де́ньги.

    Иностра́нцу ну́жно по́мнить э́ти пра́вила. Но не волну́йтесь: хозя́ин всё поймёт.
    :::
  passage_zh: |
    **重要的规矩**

    每个来到俄罗斯的外国人都应该知道：俄罗斯人家里有一些重要的规矩。

    第一条：在屋里要脱鞋。主人会给你拖鞋。这条规矩在十一月和十二月尤其重要：外面有雪和水。

    第二条：然后要在浴室里洗手。俄罗斯人每天都这样做，孩子们也一样。

    第三条：一般不在房间里吃东西。吃饭、喝茶都在厨房。俄罗斯人喜欢厨房：他们在那里吃午饭、晚饭，聊很久。

    那么怎样送礼呢？送花要这样送：一枝、三枝、五枝、七枝。不能送两枝或四枝。空钱包也不送：要在里面放一枚硬币。俄罗斯人说：这样你的朋友就永远有钱。

    外国人要记住这些规矩。不过别着急：主人什么都会理解的。
  why: 第 1 题，[в кварти́ре боти́нки на́до снять]{.ru}。第 2 题，[пото́м ну́жно помы́ть ру́ки в ва́нной]{.ru}。第 3 题，[Есть и пить чай мо́жно на ку́хне]{.ru}；[в ко́мнате обы́чно не едя́т]{.ru}。第 4 题是推断题：花要送单数，[два и́ли четы́ре цветка́ дари́ть нельзя́]{.ru}，空钱包也不送，四个选项里只有三枝玫瑰合规矩。第 5 题是概括题：进门脱鞋、洗手、在厨房吃饭、怎样送礼，讲的都是俄罗斯人家里的规矩；厨房只是其中一条。
  items:
  - stem: В ру́сской кварти́ре боти́нки ___.
    options: [мо́жно не снима́ть, на́до помы́ть, нельзя́ снять, на́до снять]
    answer: на́до снять
  - stem: Ру́ки ну́жно помы́ть ___.
    options: [в ва́нной, на ку́хне, в ко́мнате, в коридо́ре]
    answer: в ва́нной
  - stem: Обы́чно ру́сские едя́т и пьют чай ___.
    options: [в ко́мнате, в ва́нной, на ку́хне, в коридо́ре]
    answer: на ку́хне
  - stem: Вы идёте к ру́сскому дру́гу. Ему́ мо́жно подари́ть ___.
    options: [две ро́зы, три ро́зы, четы́ре ро́зы, пусто́й кошелёк]
    answer: три ро́зы
  - stem: Здесь пи́шут о ___.
    options: [ру́сской ку́хне, моско́вской пого́де, ру́сском до́ме, ру́сском языке́]
    answer: ру́сском до́ме
