lesson: K06
heading: 第六套
range: L01-L59
total: 150
names: [Ната́ша, Серёжа, Пётр Ива́нович, Ле́на, Ни́на Па́вловна Смирно́ва, Ли На, Ко́ля, Ве́ра, Оле́г]
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答 [в библиоте́ку]{.ru} 是 [в]{.ru} + 第四格，表示去的方向，所以问“去哪儿”[куда́]{.ru}；[где]{.ru} 问处所，回答应是 [в библиоте́ке]{.ru}；[отку́да]{.ru} 问从哪儿来，[когда́]{.ru} 问时间（第 11、24、36 课）。第 2 题：四个选项都是第二格，语法都通，要看前半句的原因：不能给妈妈打电话，是因为没有电话 [телефо́на]{.ru}（第 32、51 课）。第 3 题：“在上班”说 [на рабо́те]{.ru}，[рабо́та]{.ru} 和 [на]{.ru} 连用；前面说“不在家”，问的是在哪儿，用第六格，[на рабо́ту]{.ru} 是第四格，回答“去哪儿”（第 11、12、24 课）。第 4 题：没有帽子，明天要去买，用 [куплю́]{.ru}；[подарю́]{.ru} 是送给别人，[покажу́]{.ru}、[напишу́]{.ru} 和“没有帽子”接不上（第 43 课）。第 5 题：对方道谢，回答 [Пожа́луйста!]{.ru}“不客气”；[Извини́те]{.ru} 是道歉，[Здра́вствуйте]{.ru} 是见面问候，[Ничего́]{.ru} 用来回答别人的道歉（第 3、46 课）。第 6 题：站在地铁站旁边、和朋友一起去看电影，是在“等”朋友：[ждёт]{.ru}；[чита́ет]{.ru}、[зна́ет]{.ru}、[лю́бит]{.ru} 语法上能带第四格，但和情境不合（第 22 课）。第 7 题：[ка́ждое у́тро]{.ru} 表示经常往返，用不定向动词；[пешко́м]{.ru} 说明是走着去，所以用 [хо́дит]{.ru}；[ходи́ть]{.ru} 是不定式，句子缺谓语；[е́здит]{.ru}、[е́дет]{.ru} 是乘车（第 24、25 课）。第 8 题：晚上喝了咖啡就睡不着，所以晚上不喝：[спать]{.ru}；其他三个动词和“不喝咖啡”没有因果关系（第 26、27 课）。第 9 题：以 [два]{.ru} 结尾的数词后名词用单数第二格：[два́дцать два студе́нта]{.ru}；[студе́нтов]{.ru} 用在 [пять]{.ru} 以上的数词后（第 35 课）。第 10 题：[ле́кция]{.ru} 是事物，自己“开始”，用带 [-ся]{.ru} 的 [начина́ется]{.ru}；[начина́ть]{.ru} 要带直接补语，如 [начина́ть уро́к]{.ru}（第 38 课）。第 11 题：回答是价钱“九十卢布”，所以问题是 [Ско́лько сто́ит слова́рь?]{.ru}；问年龄回答应是 [… лет]{.ru}，问钟点回答 [… часо́в]{.ru}，问日期回答序数词（第 28、39、49、53 课）。第 12 题：[наконе́ц]{.ru}“终于”表示动作有了结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 只说做过这件事，不强调读完（第 42 课）。第 13 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ет]{.ru}；[купи́ла]{.ru}、[ку́пит]{.ru} 是完成体，表示一次的结果（第 45 课）。第 14 题：“在某月某日”用序数词第二格加月份第二格，不加前置词：[двадца́того ноября́]{.ru}；[двадца́тое]{.ru} 是第一格，回答“今天几号”（第 49 课）。第 15 题：向陌生人打听事情，先说 [Извини́те, пожа́луйста]{.ru}“劳驾”；[Спаси́бо]{.ru} 是道谢，[Здра́вствуй]{.ru} 是对熟人的问候，[Пока́]{.ru} 是告别（第 2、46、59 课）。第 16 题：朋友都不在，书看完了，电视也坏了，一个人在家，只能是“无聊”：[ску́чно]{.ru}；[ве́село]{.ru}、[интере́сно]{.ru}、[хорошо́]{.ru} 和前面说的情况相反（第 58 课）。第 17 题：[звони́ть]{.ru} 要求第三格；[оте́ц]{.ru} 变格时 [е]{.ru} 脱落，第三格是 [отцу́]{.ru}；[отца́]{.ru} 是第二、四格（第 51 课）。第 18 题：前半句说奶奶喜欢音乐，后半句喜欢的应该是“歌曲”[пе́сни]{.ru}；四个选项都是复数第一格，和 [нра́вятся]{.ru} 一致，只能靠意思选（第 52 课）。第 19 题：[два́дцать четы́ре]{.ru} 以 [четы́ре]{.ru} 结尾，后面用 [го́да]{.ru}；[лет]{.ru} 用在 [пять]{.ru} 以上和以 [пять–ноль]{.ru} 结尾的数词后，[год]{.ru} 用在 [оди́н]{.ru} 后（第 53 课）。第 20 题：外面零下二十度，不戴帽子不能出去，用 [нельзя́]{.ru}；[мо́жно]{.ru} 语法上通，意思和语境矛盾；[ну́жен]{.ru}、[рад]{.ru} 不能接不定式（第 54 课）。第 21 题：手冷，需要的是手套 [перча́тки]{.ru}；[боти́нки]{.ru}、[та́почки]{.ru}、[очки́]{.ru} 也是复数，和 [нужны́]{.ru} 一致，但和“手冷”无关（第 55 课）。第 22 题：[расска́зывать]{.ru} 讲给谁听用第三格，阴性形容词第三格词尾是 [-ой]{.ru}：[но́вой студе́нтке]{.ru}（第 56 课）。第 23 题：发烧要去看医生：[к врачу́]{.ru}；四个选项都是 [к]{.ru} + 第三格，语法都通，要看前半句的原因（第 57 课）。第 24 题：前面回答 [Нет]{.ru}，后面又说星期六要上班，所以是“没空”：[занята́]{.ru}；[свобо́дна]{.ru} 和 [Нет]{.ru} 矛盾，[ра́да]{.ru}、[больна́]{.ru} 和“要上班”接不上（第 59 课）。第 25 题：对方说要走了，回答告别用语 [Пока́! До ве́чера!]{.ru}；[Приве́т]{.ru}、[Здра́вствуй]{.ru} 是见面问候（第 2、59 课）。
  items:
  - stem: — ___ ты идёшь? — В библиоте́ку.
    options: [Где, Куда́, Отку́да, Когда́]
    answer: Куда́
  - stem: 'Я не могу́ позвони́ть ма́ме: у меня́ нет ___.'
    options: [телефо́на, словаря́, ша́рфа, хле́ба]
    answer: телефо́на
  - stem: Мой оте́ц сейча́с не до́ма, он ___.
    options: [в рабо́те, на рабо́ту, на рабо́те, в рабо́ту]
    answer: на рабо́те
  - stem: На у́лице моро́з, а у меня́ нет ша́пки. За́втра я ___ её.
    options: [подарю́, покажу́, напишу́, куплю́]
    answer: куплю́
  - stem: — Большо́е спаси́бо! — ___
    options: [Пожа́луйста!, Извини́те!, Здра́вствуйте!, Ничего́!]
    answer: Пожа́луйста!
  - stem: 'Ко́ля стои́т у метро́ и ___ дру́га: они́ иду́т в кино́.'
    options: [чита́ет, зна́ет, ждёт, лю́бит]
    answer: ждёт
  - stem: Ка́ждое у́тро мой брат ___ в шко́лу пешко́м.
    options: [ходи́ть, е́здит, е́дет, хо́дит]
    answer: хо́дит
  - stem: 'Ве́чером Ната́ша не пьёт ко́фе: пото́м она́ не мо́жет ___.'
    options: [чита́ть, спать, рабо́тать, гуля́ть]
    answer: спать
  - stem: В на́шей гру́ппе два́дцать два ___.
    options: [студе́нт, студе́нта, студе́нтов, студе́нты]
    answer: студе́нта
  - stem: Ле́кция ___ в де́вять часо́в.
    options: [начина́ет, начина́ются, начина́ется, начина́ть]
    answer: начина́ется
  - stem: — ___ — Девяно́сто рубле́й.
    options: ['Ско́лько сто́ит слова́рь?', 'Ско́лько вам лет?', 'Кото́рый час?', 'Како́е сего́дня число́?']
    answer: 'Ско́лько сто́ит слова́рь?'
  - stem: Вчера́ Оле́г наконе́ц ___ рома́н «Война́ и мир».
    options: [чита́л, чита́ет, прочита́ет, прочита́л]
    answer: прочита́л
  - stem: Ка́ждое у́тро ба́бушка ___ хлеб в бу́лочной.
    options: [купи́ла, ку́пит, покупа́ет, купи́ть]
    answer: покупа́ет
  - stem: Мой брат роди́лся ___ ноября́.
    options: [двадца́тое, двадца́тый, двадца́том, двадца́того]
    answer: двадца́того
  - stem: — ___, пожа́луйста, где здесь по́чта? — Вон там.
    options: [Спаси́бо, Извини́те, Здра́вствуй, Пока́]
    answer: Извини́те
  - stem: 'Друзья́ на да́че, кни́ги Ко́ля уже́ прочита́л, телеви́зор не рабо́тает. Ко́ле ___.'
    options: [ску́чно, ве́село, интере́сно, хорошо́]
    answer: ску́чно
  - stem: Ка́ждое воскресе́нье Ве́ра звони́т ___.
    options: [отца́, оте́ц, отце́, отцу́]
    answer: отцу́
  - stem: Ба́бушка о́чень лю́бит му́зыку, ей нра́вятся ру́сские ___.
    options: [пе́сни, газе́ты, у́лицы, маши́ны]
    answer: пе́сни
  - stem: Мое́й сестре́ два́дцать четы́ре ___.
    options: [год, лет, го́да, годо́в]
    answer: го́да
  - stem: Ко́ля, на у́лице ми́нус два́дцать, без ша́пки тебе́ ___ гуля́ть.
    options: [мо́жно, нельзя́, ну́жен, рад]
    answer: нельзя́
  - stem: 'На у́лице моро́з, у меня́ холо́дные ру́ки: мне нужны́ ___.'
    options: [боти́нки, перча́тки, та́почки, очки́]
    answer: перча́тки
  - stem: Преподава́тель расска́зывает ___ студе́нтке о Москве́.
    options: [но́вой, но́вая, но́вую, но́вом]
    answer: но́вой
  - stem: У сестры́ температу́ра, и сейча́с она́ идёт к ___.
    options: [учи́телю, дру́гу, врачу́, бра́ту]
    answer: врачу́
  - stem: '— Ната́ша, ты свобо́дна в суббо́ту? — Нет, я ___: в суббо́ту у меня́ рабо́та.'
    options: [ра́да, больна́, свобо́дна, занята́]
    answer: занята́
  - stem: — Извини́, я до́лжен идти́. — ___
    options: [Пока́! До ве́чера!, Приве́т!, Здра́вствуй!, Пожа́луйста!]
    answer: Пока́! До ве́чера!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок для де́душки**

    Де́душке Ната́ши се́мьдесят пять лет. Он живёт оди́н на да́че, в ста́ром до́ме. Ра́ньше он ка́ждый ве́чер чита́л газе́ты и рома́ны, но тепе́рь он пло́хо (1) []{.blank}, и чита́ть ему́ (2) []{.blank}. Ве́чером ему́ (3) []{.blank}.

    Ната́ша у́чится в Москве́, а да́ча (4) []{.blank}: доро́га туда́ — два часа́. Пя́того декабря́ у де́душки день рожде́ния, и Ната́ша до́лго ду́мает: что ему́ (5) []{.blank}? Ему́ не нужна́ (6) []{.blank}: он не мо́жет её чита́ть.

    В день рожде́ния Ната́ша (7) []{.blank} де́душке телефо́н. «Спаси́бо, — говори́т де́душка, — но звони́ть я не люблю́». — «А тебе́ и не на́до звони́ть, — отвеча́ет Ната́ша. — Звони́ть бу́ду я. Ка́ждый ве́чер я бу́ду чита́ть тебе́ рома́н, а ты бу́дешь (8) []{.blank}».

    Тепе́рь ка́ждый ве́чер в (9) []{.blank} часо́в Ната́ша (10) []{.blank} де́душке и чита́ет ему́ рома́н Толсто́го. Рома́н о́чень (11) []{.blank}: они́ чита́ют его́ уже́ ме́сяц, но ещё не прочита́ли. Де́душка слу́шает и иногда́ (12) []{.blank}: «А кто э́то?» Тепе́рь ве́чером ему́ (13) []{.blank}: в семь часо́в он уже́ сиди́т у телефо́на и (14) []{.blank}. А Ната́ша то́же (15) []{.blank}: ра́ньше она́ не люби́ла Толсто́го, а тепе́рь чита́ть ей о́чень (16) []{.blank}.

    Неде́лю наза́д у Ната́ши была́ контро́льная, и ве́чером она́ (17) []{.blank} позвони́ть. Тогда́ де́душка (18) []{.blank} ей: «Ната́ша, уже́ во́семь часо́в! Я (19) []{.blank}!» А ра́ньше он не люби́л (20) []{.blank}!
    :::
  passage_zh: |
    **给爷爷的礼物**

    娜塔莎的爷爷七十五岁了。他一个人住在别墅的老房子里。以前他每天晚上都读报纸、读小说，可现在他眼睛不好，看书很吃力。晚上他很无聊。

    娜塔莎在莫斯科上学，别墅很远：路上要两个小时。十二月五日是爷爷的生日，娜塔莎想了很久：送他什么呢？书他用不着：他没法看。

    生日那天娜塔莎送给爷爷一部手机。“谢谢，”爷爷说，“可我不爱打电话。”——“你也不用打，”娜塔莎回答，“我来打。每天晚上我给你读小说，你来听。”

    现在每天晚上七点，娜塔莎都给爷爷打电话，给他读托尔斯泰的小说。小说很长：他们已经读了一个月，还没读完。爷爷听着，有时问：“这是谁呀？”现在晚上他过得很开心：七点钟他就坐在电话旁边等着了。娜塔莎也很高兴：以前她不喜欢托尔斯泰，现在读起来觉得很有意思。

    一个星期前娜塔莎有测验，晚上忘了打电话。于是爷爷给她打来了：“娜塔莎，已经八点了！我在等着呢！”可以前他是不喜欢电话的！
  why: 第 1 空：后半句说“看书很吃力”，后文又说他“没法看书”、改成听别人读，所以是眼睛不好 [пло́хо ви́дит]{.ru}；[ест]{.ru}、[спит]{.ru} 和看书吃力没有因果关系；后文他能听懂小说、还会提问，也不是理解力差（[понима́ет]{.ru}）。第 2 空：眼睛不好，看书当然“吃力”[тру́дно]{.ru}；[но]{.ru} 引出的是坏消息，[интере́сно]{.ru}、[ве́село]{.ru}、[хорошо́]{.ru} 都和它矛盾。第 3 空：一个人住，又不能看书，晚上只能“无聊”[ску́чно]{.ru}；第三段以后说“现在晚上他很开心”，正是和这里对比。第 4 空：冒号后面说路上要两个小时，所以别墅“很远”[далеко́]{.ru}；[недалеко́]{.ru}、[здесь]{.ru} 和两个小时的路矛盾，[там]{.ru} 不说明任何情况。第 5 空：前面说到生日，后面又说“书他用不着”，娜塔莎在想送什么礼物：[подари́ть]{.ru}。第 6 空：冒号后面说“他没法看它”，能“看”的只有书 [кни́га]{.ru}；帽子、杯子、外套都不是用来看的。第 7 空：生日那天，爷爷接着说“谢谢”，是送给他：[да́рит]{.ru}；[пока́зывает]{.ru} 只是给他看，后文爷爷一直用着这部手机；[мо́ет]{.ru}、[и́щет]{.ru} 不合情理。第 8 空：娜塔莎说“打电话我来打”“我来读”，爷爷要做的是“听”[слу́шать]{.ru}；[чита́ть]{.ru} 他做不到，[звони́ть]{.ru} 正是娜塔莎说他不用做的事。第 9 空：后文说 [в семь часо́в он уже́ сиди́т у телефо́на]{.ru}，到八点没接到电话就着急了，可见约好的是七点：[семь]{.ru}。第 10 空：“每天晚上七点”给爷爷读小说，用的是手机，所以是“打电话”[звони́т]{.ru}；[пи́шет]{.ru} 爷爷看不了，[отвеча́ет]{.ru} 前面没有人问，[расска́зывает]{.ru} 和后面的 [чита́ет]{.ru} 重复且不说明用电话。第 11 空：冒号后面解释“读了一个月还没读完”，说的是小说“很长”[дли́нный]{.ru}；“有意思”“新”“俄罗斯的”都解释不了为什么读不完。第 12 空：后面引的是问句 [А кто э́то?]{.ru}，所以是“问”[спра́шивает]{.ru}。第 13 空：[Тепе́рь]{.ru} 和第一段的 [Ве́чером ему́ ску́чно]{.ru} 对比，冒号后面说他七点就坐在电话旁，可见现在晚上过得“开心”[ве́село]{.ru}。第 14 空：坐在电话旁边是“等”电话：[ждёт]{.ru}；他看不了书，[чита́ет]{.ru} 不对，[спит]{.ru}、[рабо́тает]{.ru} 和“坐在电话旁”不合。第 15 空：[то́же]{.ru} 指和爷爷一样开心，冒号后面说她现在觉得托尔斯泰有意思，所以是 [ра́да]{.ru}；[занята́]{.ru}、[больна́]{.ru}、[свобо́дна]{.ru} 和后面的解释接不上。第 16 空：[ра́ньше … не люби́ла … а тепе́рь]{.ru} 是对比，现在“很有意思”[интере́сно]{.ru}；[ску́чно]{.ru}、[тру́дно]{.ru} 和“也很高兴”矛盾，[хо́лодно]{.ru} 无关。第 17 空：那天有测验，后面爷爷八点还没等到电话，可见她“忘了”打：[забы́ла]{.ru}；[могла́ позвони́ть]{.ru} 说她能打，和爷爷的话矛盾；[люби́ла]{.ru}、[уме́ла]{.ru} 不能这样用。第 18 空：爷爷眼睛不好，不能写短信，后面又说“以前他不喜欢电话”，所以是他“打电话”给她：[позвони́л]{.ru}；[отве́тил]{.ru} 要先有人找他，[рассказа́л]{.ru} 和后面的话不合。第 19 空：已经八点，过了约好的七点，爷爷是在“等”：[жду]{.ru}；他不能看书，也不是在睡觉或上班。第 20 空：呼应第三段爷爷说的“我不爱打电话”：以前他不喜欢的是电话 [телефо́н]{.ru}；他以前天天读小说，[рома́н]{.ru} 正好相反；[чай]{.ru}、[футбо́л]{.ru} 文中没有提到。
  items:
  - options: [ест, спит, понима́ет, ви́дит]
    answer: ви́дит
  - options: [интере́сно, ве́село, тру́дно, хорошо́]
    answer: тру́дно
  - options: [ве́село, ску́чно, интере́сно, хорошо́]
    answer: ску́чно
  - options: [недалеко́, далеко́, здесь, там]
    answer: далеко́
  - options: [показа́ть, сказа́ть, подари́ть, написа́ть]
    answer: подари́ть
  - options: [ша́пка, ча́шка, ку́ртка, кни́га]
    answer: кни́га
  - options: [да́рит, пока́зывает, мо́ет, и́щет]
    answer: да́рит
  - options: [слу́шать, чита́ть, писа́ть, звони́ть]
    answer: слу́шать
  - options: [пять, шесть, семь, де́сять]
    answer: семь
  - options: [пи́шет, звони́т, отвеча́ет, расска́зывает]
    answer: звони́т
  - options: [интере́сный, но́вый, ру́сский, дли́нный]
    answer: дли́нный
  - options: [спра́шивает, отвеча́ет, чита́ет, пи́шет]
    answer: спра́шивает
  - options: [ску́чно, тру́дно, ве́село, хо́лодно]
    answer: ве́село
  - options: [спит, чита́ет, рабо́тает, ждёт]
    answer: ждёт
  - options: [занята́, ра́да, больна́, свобо́дна]
    answer: ра́да
