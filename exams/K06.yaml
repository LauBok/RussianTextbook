  passage: |
    ::: {.prose lang="ru"}
    **Бассе́йн «Дельфи́н»**

    Мы рабо́таем: понеде́льник — пя́тница 7.00—22.00, суббо́та и воскресе́нье 9.00—21.00. В пе́рвый понеде́льник ме́сяца бассе́йн не рабо́тает.

    | Кто пла́вает | Дни | Вре́мя |
    |---|---|---|
    | Взро́слые | понеде́льник — пя́тница | 7.00—10.00, 18.00—22.00 |
    | Де́ти 7—12 лет | вто́рник, четве́рг | 16.00—18.00 |
    | Все | суббо́та, воскресе́нье | 9.00—21.00 |

    Оди́н биле́т — оди́н час в бассе́йне. Взро́слый биле́т сто́ит 350 рубле́й, де́тский — 200 рубле́й.

    Пра́вила:

    — Без ша́пки пла́вать нельзя́. Ша́пку мо́жно купи́ть у нас, она́ сто́ит 150 рубле́й.

    — Не забу́дьте та́почки.

    — Де́ти до 7 лет пла́вают то́лько в суббо́ту и воскресе́нье. Роди́тели должны́ быть ря́дом, в воде́.
    :::
  passage_zh: |
    **“海豚”游泳馆**

    营业时间：星期一至星期五 7:00—22:00，星期六、星期天 9:00—21:00。每月第一个星期一闭馆。

    | 对象 | 日期 | 时间 |
    |---|---|---|
    | 成人 | 星期一至星期五 | 7:00—10:00，18:00—22:00 |
    | 7—12 岁儿童 | 星期二、星期四 | 16:00—18:00 |
    | 所有人 | 星期六、星期天 | 9:00—21:00 |

    一张票在游泳馆里待一小时。成人票 350 卢布，儿童票 200 卢布。

    须知：

    ——不戴泳帽不能游泳。泳帽可以在本馆购买，150 卢布。

    ——别忘了带拖鞋。

    ——7 岁以下儿童只在星期六、星期天游泳。家长必须在旁边，在水里陪着。
  why: 第 1 题是推断题：三月二日是星期一，一个月头七天里的星期一就是这个月的第一个星期一，告示说这一天 [бассе́йн не рабо́тает]{.ru}，所以整天都不能游；表里星期一有成人的早、晚两段时间，这正是干扰项设下的陷阱。第 2 题，十岁属于 [7—12 лет]{.ru} 的儿童组，只在星期二、星期四 16:00—18:00，五点在这段时间里；星期一没有儿童组，星期四七点已经过了 18:00，星期六八点游泳馆还没开门，而且周末不是儿童组。第 3 题是计算题：妈妈的成人票 350 卢布，十岁儿子的儿童票 200 卢布，妈妈没有泳帽，要买一顶 150 卢布，一共 700 卢布；550 漏了泳帽，850 多算了一顶泳帽，500 把儿子的票漏了。第 4 题是推断题：五岁不到七岁，只能周末游，而且家长要 [ря́дом, в воде́]{.ru}；星期二、四的儿童组是 7—12 岁，家长在走廊里等不符合规定。第 5 题是推断题：[Оди́н биле́т — оди́н час]{.ru}，晚上七点买的票，可以游到八点；22:00 是星期五游泳馆关门的时间，21:00 是周末关门的时间，都是干扰项。
  items:
  - stem: Сего́дня понеде́льник, второ́е ма́рта. Сего́дня в бассе́йне ___.
    options: [мо́жно пла́вать то́лько у́тром, пла́вают то́лько взро́слые, пла́вать нельзя́, пла́вают то́лько де́ти]
    answer: пла́вать нельзя́
  - stem: Ва́шему сы́ну де́сять лет. В де́тской гру́ппе он мо́жет пла́вать ___.
    options: [в понеде́льник в пять часо́в, во вто́рник в пять часо́в, в четве́рг в семь часо́в, в суббо́ту в во́семь часо́в]
    answer: во вто́рник в пять часо́в
  - stem: В воскресе́нье ма́ма и сын (ему́ де́сять лет) иду́т в бассе́йн на час. У сы́на есть ша́пка, а у ма́мы нет. Ско́лько всё э́то бу́дет сто́ить?
    options: [550 рубле́й, 850 рубле́й, 500 рубле́й, 700 рубле́й]
    answer: 700 рубле́й
  - stem: Ва́шей до́чери пять лет. Она́ мо́жет пла́вать ___.
    options: ['во вто́рник и́ли в четве́рг, в де́тской гру́ппе', 'ка́ждый день, но то́лько у́тром', 'в суббо́ту и́ли в воскресе́нье, а вы бу́дете ря́дом в воде́', 'в суббо́ту и́ли в воскресе́нье, а вы бу́дете ждать её в коридо́ре']
    answer: 'в суббо́ту и́ли в воскресе́нье, а вы бу́дете ря́дом в воде́'
