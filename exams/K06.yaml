lesson: K06
heading: 第六套
range: L01-L59
total: 150
names: [Ната́ша, Ната́лья, Ко́ля, Ве́ра, Оле́г, Зо́я Миха́йловна, Фе́дя, Ко́стя, Ли Мин, Гуанчжо́у, Новосиби́рск, Дельфи́н, Та́ня, Ю́рий, Каза́нь, Королёв, Ми́ла, Ли́да]
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答 [в библиоте́ку]{.ru} 是 [в]{.ru} + 第四格，表示去的方向，所以问“去哪儿”[куда́]{.ru}；[где]{.ru} 问处所，回答应是 [в библиоте́ке]{.ru}；[отку́да]{.ru} 问从哪儿来，[когда́]{.ru} 问时间（第 11、24、36 课）。第 2 题：[нет]{.ru} 后用第二格，形容词和名词都要变：[большо́го словаря́]{.ru}（第 32、34 课）；[большо́му словарю́]{.ru} 是第三格，[больши́м словарём]{.ru} 是还没学的第五格，照第一格 [большо́й слова́рь]{.ru} 不变是最常见的错误。第 3 题：“在上班”说 [на рабо́те]{.ru}，[рабо́та]{.ru} 和 [на]{.ru} 连用；前面说“不在家”，问的是在哪儿，用第六格，[на рабо́ту]{.ru} 是第四格，回答“去哪儿”（第 11、12、24 课）。第 4 题：[за́втра]{.ru} 说将来，又是一次、要有结果的事（买到帽子），用完成体将来时 [куплю́]{.ru}；[купи́ла]{.ru}、[покупа́ла]{.ru} 是过去时，和 [за́втра]{.ru} 矛盾；不定式 [купи́ть]{.ru} 不能单独作谓语（第 43、45 课）。第 5 题：对方道谢，回答 [Пожа́луйста!]{.ru}“不客气”；[Извини́те]{.ru} 是道歉，[Здра́вствуйте]{.ru} 是见面问候，[Ничего́]{.ru} 用来回答别人的道歉（第 3、46 课）。第 6 题：站在地铁站旁边、和朋友一起去看电影，是在“等”朋友：[ждёт]{.ru}；[чита́ет]{.ru}、[зна́ет]{.ru}、[лю́бит]{.ru} 语法上能带第四格，但和情境不合（第 22 课）。第 7 题：[ка́ждое у́тро]{.ru} 表示经常往返，用不定向动词；[пешко́м]{.ru} 说明是走着去，所以用 [хо́дит]{.ru}；[ходи́ть]{.ru} 是不定式，句子缺谓语；[е́здит]{.ru}、[е́дет]{.ru} 是乘车（第 24、25 课）。第 8 题：晚上喝了咖啡就很久睡不着，所以晚上不喝：[спать]{.ru}；其他三个动词和“不喝咖啡”没有因果关系（第 26、27 课）。第 9 题：以 [два]{.ru} 结尾的数词后名词用单数第二格：[два́дцать два студе́нта]{.ru}；[студе́нтов]{.ru} 用在 [пять]{.ru} 以上的数词后（第 35 课）。第 10 题：[ле́кция]{.ru} 是事物，自己“开始”，用带 [-ся]{.ru} 的 [начина́ется]{.ru}；[начина́ть]{.ru} 要带直接补语，如 [начина́ть уро́к]{.ru}（第 38 课）。第 11 题：回答是价钱“九十卢布”，所以问题是 [Ско́лько сто́ит слова́рь?]{.ru}；问年龄回答应是 [… лет]{.ru}，问钟点回答 [… часо́в]{.ru}，问日期回答序数词（第 28、39、49、53 课）。第 12 题：[наконе́ц]{.ru}“终于”表示动作有了结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 只说做过这件事，不强调读完（第 42 课）。第 13 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ет]{.ru}；[купи́ла]{.ru}、[ку́пит]{.ru} 是完成体，表示一次的结果（第 45 课）。第 14 题：问的是星期天要做什么，用将来时；[быть]{.ru} 的将来时只能和未完成体不定式连用：[Бу́ду писа́ть]{.ru}；[бу́ду написа́ть]{.ru} 是常见错误，完成体变位本身就表示将来（[напишу́]{.ru}），不能再加 [бу́ду]{.ru}；[Писа́л]{.ru}、[Написа́л]{.ru} 是过去时，和“星期天要做什么”不配（第 41、43 课）。第 15 题：向陌生人打听事情，先说 [Извини́те, пожа́луйста]{.ru}“劳驾”；[Спаси́бо]{.ru} 是道谢，[Здра́вствуй]{.ru} 是对熟人的问候，[Пока́]{.ru} 是告别（第 2、46、59 课）。第 16 题：朋友都不在，电视也坏了，一个人在家，只能是“无聊”：[ску́чно]{.ru}；[ве́село]{.ru}、[интере́сно]{.ru}、[хорошо́]{.ru} 和前面说的情况相反（第 58 课）。第 17 题：[звони́ть]{.ru} 要求第三格；[оте́ц]{.ru} 变格时 [е]{.ru} 脱落，第三格是 [отцу́]{.ru}；[отца́]{.ru} 是第二、四格（第 51 课）。第 18 题：[дари́ть]{.ru} 送给谁用第三格，[он]{.ru} 的第三格是 [ему́]{.ru}；送的东西 [кни́гу]{.ru} 是第四格；填 [его́]{.ru} 就成了 [его́ кни́гу]{.ru}“他的书”，句子变成“我想把他的书送出去”，缺了送给谁；[ей]{.ru} 是阴性，奥列格是男人（第 52、56 课）。第 19 题：说年龄时，人用第三格，物主代词和名词都要变：[Мое́й сестре́ два́дцать четы́ре го́да]{.ru}；照汉语“我姐姐二十四岁”用第一格 [Моя́ сестра́]{.ru} 是常见错误；[мое́й сестры́]{.ru} 是第二格，用在 [у]{.ru} 后面，[мою́ сестру́]{.ru} 是第四格（第 53、56 课）。第 20 题：外面零下二十度，不戴帽子不能出去，用 [нельзя́]{.ru}；[мо́жно]{.ru} 语法上通，意思和语境矛盾；[ну́жен]{.ru}、[рад]{.ru} 不能接不定式（第 54 课）。第 21 题：[ну́жен]{.ru} 和需要的东西在性、数上一致，[перча́тки]{.ru} 是复数，用 [нужны́]{.ru}；[ну́жно]{.ru} 后面接不定式（[мне ну́жно купи́ть перча́тки]{.ru}），不能直接接名词，这是最常见的错误；[ну́жен]{.ru}、[нужна́]{.ru} 是阳性、阴性单数（第 54、55 课）。第 22 题：[расска́зывать]{.ru} 讲给谁听用第三格，阴性形容词第三格词尾是 [-ой]{.ru}：[но́вой студе́нтке]{.ru}（第 56 课）。第 23 题：“某门课的测验、作业”用 [по]{.ru} + 第三格：[контро́льная по ру́сскому языку́]{.ru}；照汉语“俄语的测验”用第二格 [ру́сского языка́]{.ru} 是常见错误；[о ру́сском языке́]{.ru} 是“关于俄语”，[к]{.ru} + 第三格表示走向某人某处（第 57 课）。第 24 题：前面回答 [Нет]{.ru}，后面又说星期六要上班，所以是“没空”：[занята́]{.ru}；[свобо́дна]{.ru} 和 [Нет]{.ru} 矛盾，[ра́да]{.ru}、[здоро́ва]{.ru} 和“要上班”接不上（第 59 课）。第 25 题：对方说要走了，回答告别用语 [Пока́! До ве́чера!]{.ru}；[Приве́т]{.ru}、[Здра́вствуй]{.ru} 是见面问候（第 2、59 课）。
  items:
  - stem: — ___ ты идёшь? — В библиоте́ку.
    options: [Где, Куда́, Отку́да, Когда́]
    answer: Куда́
  - stem: 'Э́того сло́ва нет в моём ма́леньком словаре́, а ___ у меня́ нет.'
    options: [большо́й слова́рь, большо́го словаря́, большо́му словарю́, больши́м словарём]
    answer: большо́го словаря́
  - stem: Мой оте́ц сейча́с не до́ма, он ___.
    options: [в рабо́те, на рабо́ту, на рабо́те, в рабо́ту]
    answer: на рабо́те
  - stem: 'Ша́пку я ___ за́втра: сего́дня уже́ по́здно, магази́н не рабо́тает.'
    options: [купи́ла, куплю́, покупа́ла, купи́ть]
    answer: куплю́
  - stem: — Большо́е спаси́бо! — ___
    options: [Пожа́луйста!, Извини́те!, Здра́вствуйте!, Ничего́!]
    answer: Пожа́луйста!
  - stem: 'Ко́ля стои́т у метро́ и ___ дру́га: они́ иду́т в кино́.'
    options: [чита́ет, зна́ет, ждёт, лю́бит]
    answer: ждёт
  - stem: Ка́ждое у́тро мой брат ___ в шко́лу пешко́м.
    options: [ходи́ть, е́здит, е́дет, хо́дит]
    answer: хо́дит
  - stem: 'Ната́ша не пьёт ко́фе ве́чером: пото́м она́ до́лго не мо́жет ___.'
    options: [чита́ть, спать, рабо́тать, гуля́ть]
    answer: спать
  - stem: В на́шей гру́ппе два́дцать два ___.
    options: [студе́нт, студе́нта, студе́нтов, студе́нты]
    answer: студе́нта
  - stem: Ле́кция ___ в де́вять часо́в.
    options: [начина́ет, начина́ются, начина́ется, начина́ть]
    answer: начина́ется
  - stem: — ___ — Девяно́сто рубле́й.
    options: ['Ско́лько сто́ит слова́рь?', 'Ско́лько вам лет?', 'Кото́рый час?', 'Како́е сего́дня число́?']
    answer: 'Ско́лько сто́ит слова́рь?'
  - stem: Вчера́ Оле́г наконе́ц ___ рома́н «Война́ и мир».
    options: [чита́л, чита́ет, прочита́ет, прочита́л]
    answer: прочита́л
  - stem: Ка́ждое у́тро ба́бушка ___ хлеб в бу́лочной.
    options: [купи́ла, ку́пит, покупа́ет, купи́ть]
    answer: покупа́ет
  - stem: — Что ты бу́дешь де́лать в воскресе́нье? — ___ письмо́ ба́бушке.
    options: [Бу́ду писа́ть, Бу́ду написа́ть, Писа́л, Написа́л]
    answer: Бу́ду писа́ть
  - stem: — ___, пожа́луйста, где здесь по́чта? — Вон там.
    options: [Спаси́бо, Извини́те, Здра́вствуй, Пока́]
    answer: Извини́те
  - stem: 'Все друзья́ Ко́ли на да́че, а телеви́зор не рабо́тает. Ко́ле до́ма о́чень ___.'
    options: [ску́чно, ве́село, интере́сно, хорошо́]
    answer: ску́чно
  - stem: Ка́ждое воскресе́нье Ве́ра звони́т ___.
    options: [отца́, оте́ц, отце́, отцу́]
    answer: отцу́
  - stem: За́втра у Оле́га день рожде́ния. Я хочу́ подари́ть ___ кни́гу.
    options: [его́, ему́, он, ей]
    answer: ему́
  - stem: ___ два́дцать четы́ре го́да, а она́ уже́ врач.
    options: [Моя́ сестра́, Мою́ сестру́, Мое́й сестре́, Мое́й сестры́]
    answer: Мое́й сестре́
  - stem: Ко́ля, на у́лице ми́нус два́дцать! Без ша́пки гуля́ть ___.
    options: [мо́жно, нельзя́, ну́жен, рад]
    answer: нельзя́
  - stem: — Что тебе́ подари́ть на день рожде́ния? — Мне ___ тёплые перча́тки.
    options: [ну́жен, нужна́, ну́жно, нужны́]
    answer: нужны́
  - stem: Преподава́тель расска́зывает ___ студе́нтке о Москве́.
    options: [но́вой, но́вая, но́вую, но́вом]
    answer: но́вой
  - stem: За́втра у нас контро́льная ___, а я ещё не зна́ю но́вые слова́.
    options: [ру́сского языка́, по ру́сскому языку́, о ру́сском языке́, к ру́сскому языку́]
    answer: по ру́сскому языку́
  - stem: '— Ната́ша, ты свобо́дна в суббо́ту? — Нет, я ___: в суббо́ту у меня́ рабо́та.'
    options: [ра́да, здоро́ва, свобо́дна, занята́]
    answer: занята́
  - stem: — Извини́, я до́лжен идти́. — ___
    options: [Пока́! До ве́чера!, Приве́т!, Здра́вствуй!, Пожа́луйста!]
    answer: Пока́! До ве́чера!
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Са́хар**

    Мне два́дцать лет, я студе́нт и живу́ оди́н. Моя́ (1) []{.blank} Зо́я Миха́йловна живёт в кварти́ре напро́тив. (2) []{.blank} уже́ во́семьдесят лет, она́ то́же живёт одна́.

    В октябре́ она́ позвони́ла (3) []{.blank} в дверь: «Извини́те, у вас есть са́хар? Мне ну́жно немно́го». Я (4) []{.blank} ей са́хар. (5) []{.blank} она́ позвони́ла опя́ть. Пото́м она́ (6) []{.blank} ка́ждую неде́лю, и ей всегда́ был (7) []{.blank} то́лько са́хар.

    Я не понима́л: магази́н ведь в на́шем до́ме, почему́ она́ не (8) []{.blank} туда́? Мо́жет быть, ей (9) []{.blank} ходи́ть? Но ка́ждое у́тро она́ два часа́ (10) []{.blank} в па́рке.

    В ноябре́ Зо́я Миха́йловна (11) []{.blank} меня́, когда́ у меня́ день рожде́ния. «Два́дцать (12) []{.blank} ноября́», — (13) []{.blank} я.

    В день рожде́ния у́тром она́ опя́ть позвони́ла в дверь. Я сра́зу (14) []{.blank} са́хар и (15) []{.blank} дверь. Но в рука́х у Зо́и Миха́йловны был большо́й краси́вый (16) []{.blank}.

    — Э́то вам, — сказа́ла она́. — (17) []{.blank}!

    — Спаси́бо! Но где вы (18) []{.blank} так мно́го са́хара?

    — Как где? У вас. Я (19) []{.blank} его́ ка́ждую неде́лю. Са́хар (20) []{.blank}, а торт — мой.
    :::
  glossary:
  - {ru: ведь, pos: part., zh: 明明，可是（表示对方也知道的理由）}
  - {ru: в рука́х, zh: 手里}
  passage_zh: |
    **糖**

    我二十岁，是个大学生，一个人住。我的邻居卓娅·米哈伊洛夫娜住在对门。她已经八十岁了，也是一个人住。

    十月里她按了我家的门铃：“打扰了，您有糖吗？我要一点儿。”我给了她糖。过了一个星期，她又来按门铃。后来她每个星期都来，每次要的都只是糖。

    我想不通：商店明明就在我们楼里，她为什么不自己去买呢？也许她走路困难？可她每天早上都在公园里散步两个小时。

    十一月，卓娅·米哈伊洛夫娜问我生日是哪天。“十一月二十一日。”我说。

    生日那天早上，她又按了门铃。我马上拿上糖去开门。可卓娅·米哈伊洛夫娜手里端着一个漂亮的大蛋糕。

    “这是给您的，”她说，“祝您生日快乐！”

    “谢谢！可您从哪儿弄来这么多糖？”

    “还能从哪儿？从您这儿。我每个星期都来拿。糖是您的，蛋糕是我的。”
  why: 第 1 空：后文她对“我”说 [Извини́те, у вас есть…]{.ru}，用“您”称呼，又住在对门，是邻居 [сосе́дка]{.ru}；奶奶、姐姐不会对家里人这样说话（第 4、19、34 课）。第 2 空：说年龄，人用第三格 [ей]{.ru}；[Она́]{.ru} 是照汉语“她八十岁”的常见错误，[У неё]{.ru} 是“她有”（第 53 课）。第 3 空：[звони́ть в дверь]{.ru} 是按门铃，按给谁用第三格 [мне]{.ru}；[меня́]{.ru} 是第二、四格（第 51、54 课）。第 4 空：她要糖，“我”给了她：[дал]{.ru}；[взял]{.ru} 是“拿走”，方向正相反；家里就有糖，用不着 [купи́л]{.ru}（第 44 课）。第 5 空：按事情的先后，第一次之后过了一个星期：[Че́рез неде́лю]{.ru}；[Неде́лю наза́д]{.ru} 是从说话的时候往前算，[Ка́ждую неде́лю]{.ru} 不能和表示一次的 [позвони́ла]{.ru} 连用，[Ра́ньше]{.ru} 和 [опя́ть]{.ru} 接不上（第 45、47 课）。第 6 空：[ка́ждую неде́лю]{.ru} 表示反复，用未完成体过去时 [звони́ла]{.ru}；[позвони́ла]{.ru} 是一次，[звони́т]{.ru}、[позвони́т]{.ru} 和整个故事的过去时不合（第 45 课）。第 7 空：需要的东西 [са́хар]{.ru} 是阳性，用 [ну́жен]{.ru}；[ну́жно]{.ru} 只接不定式，不能直接接名词（第 55 课）。第 8 空：商店就在楼里，走着去；问的是她平常为什么不去，用不定向动词 [хо́дит]{.ru}；[идёт]{.ru} 指此刻正在去，[е́здит]{.ru} 是乘车，[ходи́ть]{.ru} 是不定式（第 24、25 课）。第 9 空：“我”猜她年纪大，走路困难：[тру́дно]{.ru}；下一句用 [Но]{.ru} 说她每天早上在公园待两个小时，正好推翻这个猜测（第 58 课）。第 10 空：要推翻“走路困难”，只能是在公园散步 [гуля́ла]{.ru}；坐着、躺着、睡觉都说明不了她走得动——这一空要和上一句连起来读。第 11 空：后面是 [меня́]{.ru} 和问句 [когда́…]{.ru}，是“问”：[спроси́ла]{.ru}；[сказа́ла]{.ru}、[отве́тила]{.ru}、[рассказа́ла]{.ru} 说给谁听要用第三格 [мне]{.ru}，意思也不对（第 44 课）。第 12 空：回答“什么时候”，日期的序数词用第二格 [пе́рвого]{.ru}，和 [ноября́]{.ru} 一致；[пе́рвое]{.ru} 用来回答“今天几号”，[оди́н]{.ru} 是基数词（第 49 课）。第 13 空：“我”是男大学生（[я студе́нт и живу́ оди́н]{.ru}），过去时用阳性 [отве́тил]{.ru}；[спроси́л]{.ru} 意思不对（第 17 课）。第 14 空：“我”以为她又来要糖，先拿上糖再去开门：[взял]{.ru}；门还没开，谈不上 [дал]{.ru}（第 44 课）。第 15 空：男性，一次动作：[откры́л]{.ru}；[закрыва́л]{.ru} 意思相反，[откры́ла]{.ru} 是阴性（第 46 课）。第 16 空：词典、球、花都能当生日礼物，要读到最后一句 [а торт — мой]{.ru} 才能确定是 [торт]{.ru}，这也说明了她为什么要那么多糖。第 17 空：送生日礼物时说 [Поздравля́ю!]{.ru}；[Извини́те]{.ru} 是道歉，[Здра́вствуйте]{.ru} 是见面问候，[До свида́ния]{.ru} 是告别（第 56 课）。第 18 空：“从哪儿弄来这么多糖”，回答是 [У вас]{.ru}“从您这儿”，正是 [взять у кого́]{.ru}：[взя́ли]{.ru}（第 44 课）。第 19 空：[ка́ждую неде́лю]{.ru} 表示反复，用未完成体 [брала́]{.ru}；[взяла́]{.ru} 是一次，[беру́]{.ru}、[возьму́]{.ru} 时间不对（第 44、45 课）。第 20 空：糖是从“我”这儿拿的，所以是“您的”：[ваш]{.ru}，和后半句 [а торт — мой]{.ru} 相对：材料是您的，蛋糕是我做的。
  items:
  - options: [сосе́дка, ба́бушка, сестра́, дочь]
    answer: сосе́дка
  - options: [Она́, Её, Ей, У неё]
    answer: Ей
  - options: [меня́, мне, я, мой]
    answer: мне
  - options: [взял, купи́л, дал, показа́л]
    answer: дал
  - options: [Неде́лю наза́д, Ка́ждую неде́лю, Ра́ньше, Че́рез неде́лю]
    answer: Че́рез неде́лю
  - options: [позвони́ла, звони́ла, звони́т, позвони́т]
    answer: звони́ла
  - options: [ну́жно, нужна́, ну́жен, нужны́]
    answer: ну́жен
  - options: [хо́дит, идёт, е́здит, ходи́ть]
    answer: хо́дит
  - options: [интере́сно, ве́село, тепло́, тру́дно]
    answer: тру́дно
  - options: [сиде́ла, лежа́ла, гуля́ла, спала́]
    answer: гуля́ла
  - options: [сказа́ла, спроси́ла, отве́тила, рассказа́ла]
    answer: спроси́ла
  - options: [пе́рвое, оди́н, пе́рвый, пе́рвого]
    answer: пе́рвого
  - options: [отве́тила, спроси́л, отве́тил, отвеча́ла]
    answer: отве́тил
  - options: [дал, взял, купи́л, положи́л]
    answer: взял
  - options: [закрыва́л, откры́ла, открыва́ла, откры́л]
    answer: откры́л
  - options: [слова́рь, мяч, торт, цвето́к]
    answer: торт
  - options: [Извини́те, Поздравля́ю, Здра́вствуйте, До свида́ния]
    answer: Поздравля́ю
  - options: [да́ли, показа́ли, взя́ли, сказа́ли]
    answer: взя́ли
  - options: [взяла́, брала́, беру́, возьму́]
    answer: брала́
  - options: [мой, её, наш, ваш]
    answer: ваш
- id: e3
  type: choice
  task: 阅读理解（一）：阅读下面的电话交谈，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Ма́ма]{.sp} Алло́, Фе́дя? Ну наконе́ц! Я тебе́ вчера́ звони́ла и писа́ла, а ты не отвеча́л.

    [Фе́дя]{.sp} Извини́, ма́ма, я спал. У меня́ температу́ра.

    [Ма́ма]{.sp} Температу́ра? Кака́я?

    [Фе́дя]{.sp} Вчера́ была́ три́дцать во́семь, а сего́дня уже́ три́дцать семь.

    [Ма́ма]{.sp} А врач? Ты был у врача́?

    [Фе́дя]{.sp} Я позвони́л в поликли́нику, и сего́дня у́тром врач был у меня́. Сказа́л, что э́то просту́да. Три дня мне ну́жно лежа́ть, на заня́тия ходи́ть нельзя́.

    [Ма́ма]{.sp} А лека́рство?

    [Фе́дя]{.sp} Не волну́йся. Реце́пт я дал Ко́сте, и он уже́ купи́л мне лека́рство.

    [Ма́ма]{.sp} Ко́стя — молоде́ц. А что ты ешь?

    [Фе́дя]{.sp} Ко́стя гото́вит. Вчера́ он пригото́вил суп.

    [Ма́ма]{.sp} Ко́стя? Суп? Он же не уме́ет гото́вить!

    [Фе́дя]{.sp} Не уме́ет. Суп был совсе́м не вку́сный, но я всё съел.

    [Ма́ма]{.sp} Так. За́втра суббо́та, у меня́ выходно́й. Я е́ду к тебе́. Электри́чка в во́семь, в де́сять я уже́ бу́ду у тебя́.

    [Фе́дя]{.sp} Ма́ма, не на́до! Я уже́ не ма́ленький.

    [Ма́ма]{.sp} Я зна́ю. Но обе́д бу́ду гото́вить я.

    [Фе́дя]{.sp} Хорошо́, ма́ма. Спаси́бо. Ко́стя то́же бу́дет рад.
    :::
  glossary:
  - {ru: же, pos: part., zh: 可是，明明（加强语气）}
  passage_zh: |
    妈妈：喂，费佳？总算打通了！我昨天给你打电话、发消息，你都不回。

    费佳：对不起，妈妈，我在睡觉。我发烧了。

    妈妈：发烧？多少度？

    费佳：昨天三十八度，今天已经三十七度了。

    妈妈：那看医生了吗？你去医生那儿了吗？

    费佳：我给诊所打了电话，今天早上医生到我这儿来了。他说是感冒。我得躺三天，不能去上课。

    妈妈：那药呢？

    费佳：别担心。我把处方给了科斯佳，他已经帮我把药买来了。

    妈妈：科斯佳真好。那你吃什么呢？

    费佳：科斯佳做饭。他昨天做了汤。

    妈妈：科斯佳？做汤？他可不会做饭啊！

    费佳：是不会。汤一点儿也不好喝，可我全喝完了。

    妈妈：这样吧。明天星期六，我休息。我去你那儿。电气火车八点开，十点我就到你那儿了。

    费佳：妈妈，不用了！我又不是小孩儿了。

    妈妈：我知道。可饭得我来做。

    费佳：好吧，妈妈。谢谢。科斯佳也会高兴的。
  why: 第 1 题，妈妈说昨天打电话、发消息他都不回，费佳回答 [я спал. У меня́ температу́ра]{.ru}：他病了，在睡觉；去看医生是今天早上的事，而且是医生到他这儿来；文中没有说电话坏了，也没提上课。第 2 题，[Три дня мне ну́жно лежа́ть, на заня́тия ходи́ть нельзя́]{.ru}；买药的事费佳已经交给科斯佳办好了，医生没有说不能喝汤。第 3 题是推断题：妈妈先问药，听说科斯佳买好了；再问吃什么，听说是不会做饭的科斯佳做的汤，这才说 [Я е́ду к тебе́]{.ru}，还特意说 [обе́д бу́ду гото́вить я]{.ru}；所以是因为儿子病了、科斯佳又做不好饭。药已经买了，费佳也没请她来（他说的是 [не на́до]{.ru}）。第 4 题是推断题：电气火车八点开，十点到，路上两个小时；[во́семь]{.ru}、[де́сять часо́в]{.ru} 是文中出现的钟点，不是路上的时间。第 5 题是推断题：科斯佳一直在给费佳做饭，又不会做；妈妈来了由她做饭，科斯佳就不用做了，所以“他也会高兴”。文中没说科斯佳也病了，也没说妈妈要给他钱。
  items:
  - stem: Почему́ Фе́дя вчера́ не отвеча́л ма́ме?
    options: [Он был на заня́тиях., Он был у врача́., 'Он спал: у него́ температу́ра.', У него́ не рабо́тал телефо́н.]
    answer: 'Он спал: у него́ температу́ра.'
  - stem: Что сказа́л врач?
    options: [Фе́де ну́жно три дня лежа́ть до́ма., Фе́дя мо́жет ходи́ть на заня́тия., Фе́де ну́жно идти́ в поликли́нику., Фе́де нельзя́ есть суп.]
    answer: Фе́де ну́жно три дня лежа́ть до́ма.
  - stem: Почему́ ма́ма е́дет к Фе́де?
    options: [Фе́де ну́жно лека́рство., 'У Фе́ди просту́да, а Ко́стя пло́хо гото́вит.', Так хо́чет Фе́дя., Ей ску́чно до́ма в суббо́ту.]
    answer: 'У Фе́ди просту́да, а Ко́стя пло́хо гото́вит.'
  - stem: Ско́лько вре́мени ма́ма бу́дет е́хать к Фе́де?
    options: [час, де́сять часо́в, два часа́, во́семь часо́в]
    answer: два часа́
  - stem: Почему́ Ко́стя то́же бу́дет рад?
    options: [Ему́ не на́до бу́дет гото́вить., У него́ то́же просту́да., Ма́ма даст ему́ де́ньги., Он давно́ не ви́дел ма́му Фе́ди.]
    answer: Ему́ не на́до бу́дет гото́вить.
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面网上的提问和回答，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ли Мин:** Здра́вствуйте! В январе́ я е́ду в Москву́ на семина́р, на две неде́ли. Я живу́ в Гуанчжо́у, у нас в январе́ тепло́, и тёплой оде́жды у меня́ нет. Что мне ну́жно купи́ть? Пальто́ у меня́ есть, но лёгкое.

    **Ната́лья, Москва́:** В январе́ у нас обы́чно ми́нус де́сять, иногда́ ми́нус два́дцать. В лёгком пальто́ вам бу́дет хо́лодно, нужна́ тёплая ку́ртка. Ещё вам нужны́ ша́пка, шарф и перча́тки. Ку́ртку мо́жно купи́ть в Москве́: вы́бор у нас большо́й, и в январе́ оде́жда сто́ит не о́чень до́рого.

    **Серге́й, Новосиби́рск:** Ми́нус два́дцать — э́то не моро́з! У нас в Новосиби́рске в январе́ и ми́нус три́дцать, и ми́нус со́рок. Ещё оди́н сове́т: не покупа́йте о́чень тёплую ку́ртку. В метро́ и в магази́нах в Москве́ тепло́, да́же жа́рко, а вы бу́дете там ка́ждый день.

    **Ли Мин:** Спаси́бо! Ша́пку, шарф и перча́тки я куплю́ до́ма, а ку́ртку — в Москве́: в пе́рвый день я бу́ду свобо́ден.
    :::
  glossary:
  - {ru: сове́т, pos: m, zh: 建议，主意}
  passage_zh: |
    **李明**：大家好！一月我要去莫斯科开研讨会，去两个星期。我住在广州，我们那儿一月很暖和，我没有保暖的衣服。我需要买些什么？大衣我有，不过很薄。

    **娜塔利娅，莫斯科**：我们这儿一月一般零下十度，有时候零下二十度。穿薄大衣您会冷的，得要一件暖和的外套。另外您还需要帽子、围巾和手套。外套可以到莫斯科再买：我们这儿可挑的多，一月衣服也不太贵。

    **谢尔盖，新西伯利亚**：零下二十度算不上冷！我们新西伯利亚一月零下三十度、零下四十度都有。再给您出个主意：别买太厚的外套。莫斯科的地铁里、商店里都很暖和，甚至很热，而您每天都要待在这些地方。

    **李明**：谢谢！帽子、围巾和手套我在家这边买，外套到莫斯科再买：第一天我没有安排。
  why: 第 1 题是主旨题：李明的问题是 [Что мне ну́жно купи́ть?]{.ru}，大家回答的也都是该准备什么衣服；研讨会的时间他自己已经说了，新西伯利亚的天气是谢尔盖顺带说的。第 2 题，[у нас в январе́ тепло́, и тёплой оде́жды у меня́ нет]{.ru}：家乡一月暖和，用不着冬衣；“外套到莫斯科再买”是后来的打算，不是没有冬衣的原因；文中没说他不喜欢厚衣服或国内衣服贵。第 3 题是词义猜测：[тепло́, да́же жа́рко]{.ru}，[да́же]{.ru}“甚至”说明后面比“暖和”更进一步，而且谢尔盖正是因此劝人别买太厚的外套，所以 [жа́рко]{.ru} 是“很热”。第 4 题是推断题：谢尔盖住在新西伯利亚，那里一月零下三四十度，和这比零下二十度不算什么；地铁里暖和是他后面另说的一件事，不是这句话的理由；文中也没说他喜欢严寒。第 5 题，“外套可以到莫斯科买”是娜塔利娅的建议（[Ку́ртку мо́жно купи́ть в Москве́]{.ru}）；谢尔盖只说别买太厚的，没说在哪儿买。
  items:
  - stem: Ли Мин спра́шивает, ___.
    options: [когда́ бу́дет семина́р, кака́я пого́да в Новосиби́рске, что ему́ ну́жно купи́ть, где мо́жно купи́ть пальто́]
    answer: что ему́ ну́жно купи́ть
  - stem: Ли Мин пи́шет, что тёплой оде́жды у него́ нет. Почему́?
    options: [Он не лю́бит тёплую оде́жду., Он хо́чет купи́ть её в Москве́., В его́ го́роде в январе́ тепло́., Тёплая оде́жда там до́рого сто́ит.]
    answer: В его́ го́роде в январе́ тепло́.
  - stem: 'Серге́й пи́шет: «В метро́ и в магази́нах тепло́, да́же жа́рко». «Жа́рко» — э́то ___.'
    options: [немно́го хо́лодно, о́чень тепло́, о́чень ску́чно, не о́чень тепло́]
    answer: о́чень тепло́
  - stem: 'Серге́й пи́шет: «Ми́нус два́дцать — э́то не моро́з!» Почему́?'
    options: [Он о́чень лю́бит моро́з., 'Он живёт в Новосиби́рске, а там в январе́ и ми́нус со́рок.', В метро́ в Москве́ тепло́., Он всегда́ хо́дит в тёплой ку́ртке.]
    answer: 'Он живёт в Новосиби́рске, а там в январе́ и ми́нус со́рок.'
