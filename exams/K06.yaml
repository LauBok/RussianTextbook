    ::: {.prose lang="ru"}
    Дороги́е ма́ма и па́па!

    Извини́те, я давно́ не писа́л. Две неде́ли наза́д у меня́ была́ просту́да: температу́ра и ка́шель. Мари́я Никола́евна сра́зу позвони́ла на́шему врачу́, и в тот день я уже́ был у врача́. Врач сказа́л: «Вам на́до три дня лежа́ть до́ма». Мне бы́ло ску́чно, но ка́ждый ве́чер А́нна расска́зывала мне но́вости. Тепе́рь я уже́ здоро́в, не волну́йтесь.

    В Москве́ уже́ моро́з: на у́лице ми́нус два́дцать. Но мне не хо́лодно: в суббо́ту А́нна и я бы́ли в магази́не, и я купи́л тёплую ку́ртку, ша́пку и шарф. Ещё мне нужны́ перча́тки, их я куплю́ за́втра.

    Двадца́того ноября́ у Ми́ши был день рожде́ния, тепе́рь ему́ четы́рнадцать лет. Я подари́л ему́ футбо́льный мяч. Па́па, ты спра́шиваешь о Москве́. Москва́ мне о́чень нра́вится. Сейча́с у́лицы и па́рки бе́лые, и го́род о́чень краси́вый.

    Мари́я Никола́евна и Ива́н Серге́евич передаю́т вам приве́т.

    Ваш сын Ван Лэй
    :::
  passage_zh: |
    亲爱的妈妈、爸爸：

    对不起，我好久没写信了。两个星期前我感冒了：发烧、咳嗽。玛丽亚·尼古拉耶夫娜马上给我们的医生打了电话，当天我就看了医生。医生说：“您得在家躺三天。”我觉得很无聊，不过安娜每天晚上都给我讲新闻。现在我已经好了，你们别担心。

    莫斯科已经上冻了：外面零下二十度。不过我不冷：星期六我和安娜去了商店，我买了一件暖和的外套、一顶帽子和一条围巾。我还需要手套，明天去买。

    十一月二十日是米沙的生日，现在他十四岁了。我送给他一个足球。爸爸，你问起莫斯科。我非常喜欢莫斯科。现在街道和公园都是白的，城市非常漂亮。

    玛丽亚·尼古拉耶夫娜和伊万·谢尔盖耶维奇向你们问好。

    你们的儿子 王磊
  why: 第 1 题，信的称呼是 [Дороги́е ма́ма и па́па!]{.ru}，落款 [Ваш сын]{.ru}。第 2 题，[Две неде́ли наза́д у меня́ была́ просту́да]{.ru}；米沙的生日是十一月二十日，不是两周前生病的事。第 3 题，医生说 [Вам на́до три дня лежа́ть до́ма]{.ru}。第 4 题是推断题：外面零下二十度，王磊说 [мне не хо́лодно]{.ru}，紧接着说明原因：他买了暖和的外套、帽子和围巾。第 5 题是找不符的说法：信里提到了米沙（生日）、安娜（讲新闻、一起去商店）、医生，没有提到由美。
