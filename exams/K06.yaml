  passage_zh: |
    科斯佳：

    今天是奶奶的生日，她七十四岁了。晚上我们去奶奶家。礼物我已经买好了，是一条暖和的围巾。

    你去买束花吧。奶奶很喜欢玫瑰，买三枝。钱在厨房的小桌子上。

    爸爸今天要上班到晚上，一下班就直接去奶奶家。我六点钟在地铁站等你。别忘了戴帽子：外面很冷！

    妈妈
  why: 第 1 空：以 [четы́ре]{.ru} 结尾的数词后用单数第二格 [го́да]{.ru}；[лет]{.ru} 用在 [пять]{.ru} 以上和以零结尾的数词后（第 35、53 课）。第 2 空：[к]{.ru} 要求第三格，[она́]{.ru} 的第三格是 [ей]{.ru}，在前置词后面加 [н]{.ru}：[к ней]{.ru}；写成 [к ей]{.ru}、[к её]{.ru} 是常见错误（第 52、57 课）。第 3 空：[уже́]{.ru} 说明事情办完、有了结果，用完成体过去时；写便条的是妈妈（落款 [Ма́ма]{.ru}），用阴性 [купи́ла]{.ru}（第 42、44 课）。第 4 空：请对方办一件具体的事，用完成体命令式 [купи́]{.ru}；[покупа́й]{.ru} 用于经常做的事（第 45、46 课）。第 5 空：喜欢的东西 [ро́зы]{.ru} 作主语，是复数，所以 [нра́вятся]{.ru}；照 [ба́бушке]{.ru} 或单数写成 [нра́вится]{.ru} 是常见错误（第 52 课）。第 6 空：[три]{.ru} 后用单数第二格 [ро́зы]{.ru}，不要和第 5 空的复数第一格 [ро́зы]{.ru} 混为一谈：字形相同，道理不同（第 35 课）。第 7 空：[де́ньги]{.ru} 只有复数，动词用复数 [лежа́т]{.ru}（第 55 课）。第 8 空：[на]{.ru} 表示在哪儿，用第六格，形容词和名词都要变：[ма́леньком столе́]{.ru}（第 11、18 课）。第 9 空：今天去一次、一个方向，用定向动词；现在时表示马上要做的事：[е́дет]{.ru}；[е́здит]{.ru} 表示经常往返（第 24、25 课）。第 10 空：说天气冷用无人称句，谓语是副词 [хо́лодно]{.ru}，不用形容词 [холо́дный]{.ru}；注意重音从词尾移到词首（第 58 课）。
