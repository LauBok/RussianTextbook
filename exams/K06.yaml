  passage_zh: |
    **由美和严寒**

    由美是日本人，她二十岁。她在莫斯科住了三个月了。昨天她非常喜欢芭蕾舞《天鹅湖》。可她不喜欢俄罗斯的天气：在外面她总是觉得冷。

    今天由美咳嗽，她去看医生。医生说：“您需要暖和的衣服。还要多喝热茶！”

    从诊所出来，由美给安娜打电话。星期六她们要去买暖和的衣服。“星期六我要买一件暖和的大衣，然后每天都出去散步！”由美说。
  why: 第 1 空：[два́дцать]{.ru} 以零结尾，后面用 [лет]{.ru}（第 53 课）。第 2 空：[жить]{.ru} 第三人称单数 [живёт]{.ru}，词干加 [в]{.ru}（第 14 课）。第 3 空：[вчера́]{.ru} 用过去时，[понра́виться]{.ru} 和主语 [бале́т]{.ru} 一致，阳性 [понра́вился]{.ru}；常见错误是按 [ей]{.ru} 写成阴性（第 52 课）。第 4 空：无人称句里主体 [ей]{.ru} 用第三格，谓语用副词 [хо́лодно]{.ru}，不用形容词（第 58 课）。第 5 空：[к]{.ru} + 第三格，[врач → врачу́]{.ru}，重音在词尾（第 57 课）。第 6 空：[оде́жда]{.ru} 是阴性，用 [нужна́]{.ru}（第 55 课）。第 7 空：医生对“您”提建议，用复数命令式 [пе́йте]{.ru}；[пить]{.ru} 的命令式是 [пей, пе́йте]{.ru}（第 46、57 课）。第 8 空：[звони́ть]{.ru} 要求第三格：[А́нне]{.ru}（第 51 课）。第 9 空：[ну́жно]{.ru} 的主体用第三格，[они́ → им]{.ru}（第 52、54 课）。第 10 空：说的是星期六一次的、有结果的动作，用完成体将来时 [куплю́]{.ru}；[купи́ть]{.ru} 变位时 [п]{.ru} 后加 [л]{.ru}（第 43、44 课）。
