    ::: {.prose lang="ru"}
    Дорога́я ба́бушка!

    Извини́, я давно́ не писа́ла: у меня́ бы́ло мно́го заня́тий. Я уже́ ме́сяц живу́ во Владивосто́ке и учу́сь в университе́те. Сейча́с у меня́ уже́ ве́чер, де́сять часо́в, а у тебя́ в Москве́ ещё день, три часа́.

    Го́род мне о́чень нра́вится. Он большо́й и краси́вый, и здесь мо́ре. Я живу́ в общежи́тии, и из окна́ я ви́жу мо́ре. В мое́й ко́мнате живёт ещё одна́ студе́нтка, она́ из Коре́и. Она́ ещё пло́хо говори́т по-ру́сски, и ве́чером мы вме́сте де́лаем зада́ние.

    В октябре́ здесь ещё тепло́, но на у́лице всегда́ ве́тер, и мне нужна́ тёплая ку́ртка. Я уже́ купи́ла её на ры́нке. Ты спра́шиваешь о еде́. Не волну́йся: у́тром я ем ка́шу, а обе́даю в университе́те. Здесь о́чень вку́сная ры́ба.

    Два́дцать пя́того октября́ у тебя́ день рожде́ния. Я уже́ купи́ла тебе́ пода́рок — краси́вую ча́шку — и вчера́ отпра́вила его́. Пиши́ мне!

    Твоя́ Ле́на
    :::
