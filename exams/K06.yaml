  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Серёжа и соба́ка**

    Серёже двена́дцать лет. Он живёт в Каза́ни, в большо́м до́ме. Серёжа давно́ хо́чет соба́ку, но ма́ма всегда́ отвеча́ет: «Нет! Соба́ке ну́жно гуля́ть ка́ждое у́тро и ка́ждый ве́чер, а ты у́тром лю́бишь спать».

    В ноябре́ сосе́д Серёжи, Пётр Ива́нович, был бо́лен. Врач сказа́л ему́: «Вам на́до две неде́ли лежа́ть до́ма». А у Петра́ Ива́новича есть больша́я ста́рая соба́ка, и ей ну́жно гуля́ть. Что де́лать? «Э́то моя́ рабо́та!» — сказа́л Серёжа.

    Две неде́ли Серёжа ка́ждый день в семь часо́в был уже́ на у́лице. Бы́ло хо́лодно, и Серёже бы́ло тру́дно, но ка́ждое у́тро и ка́ждый ве́чер он и соба́ка гуля́ли в па́рке. А по́сле шко́лы он покупа́л сосе́ду хлеб и молоко́.

    Тепе́рь Пётр Ива́нович уже́ здоро́в. Вчера́ он позвони́л ма́ме Серёжи и сказа́л: «Ваш сын — молоде́ц!» Ве́чером ма́ма до́лго ду́мала, а пото́м сказа́ла Серёже: «Тепе́рь я ви́жу: ты мо́жешь гуля́ть ка́ждое у́тро. Два́дцать восьмо́го декабря́ у тебя́ день рожде́ния. Я подарю́ тебе́ соба́ку!»
    :::
  passage_zh: |
    **谢廖沙和狗**

    谢廖沙十二岁。他住在喀山的一栋大楼里。谢廖沙早就想要一条狗，可妈妈总是回答：“不行！狗每天早上、每天晚上都要出去遛，可你早上爱睡懒觉。”

    十一月，谢廖沙的邻居彼得·伊万诺维奇病了。医生对他说：“您得在家躺两个星期。”可彼得·伊万诺维奇有一条又大又老的狗，它得出去遛。怎么办？“这事交给我！”谢廖沙说。

    两个星期里，谢廖沙每天七点就已经在外面了。天很冷，谢廖沙觉得很辛苦，可是每天早上和晚上，他都和狗在公园里散步。放学以后他还给邻居买面包和牛奶。

    现在彼得·伊万诺维奇已经好了。昨天他给谢廖沙的妈妈打电话说：“您的儿子真棒！”晚上妈妈想了很久，然后对谢廖沙说：“现在我看到了：你能每天早上出去遛狗。十二月二十八日是你的生日。我送你一条狗！”
  why: '第 1 题，第一句 [Серёже двена́дцать лет]{.ru}（年龄的主体用第三格，第 53 课）。第 2 题，[В ноябре́ сосе́д Серёжи, Пётр Ива́нович, был бо́лен]{.ru}；生病的是邻居，不是谢廖沙家里的人。第 3 题，医生说 [Вам на́до две неде́ли лежа́ть до́ма]{.ru}。第 4 题是推断题：妈妈原来不同意，理由是 [Соба́ке ну́жно гуля́ть ка́ждое у́тро … а ты у́тром лю́бишь спать]{.ru}；最后她说 [Тепе́рь я ви́жу: ты мо́жешь гуля́ть ка́ждое у́тро]{.ru}，正是这个顾虑打消了；文中没说谢廖沙学习好，也没说邻居要求这样做。第 5 题是概括题：全文讲谢廖沙想要狗、替生病的邻居遛狗、最后得到妈妈同意；邻居、喀山、学校都只是细节。'
  items:
  - stem: Серёже ___.
    options: [оди́ннадцать лет, де́сять лет, двена́дцать лет, трина́дцать лет]
    answer: двена́дцать лет
  - stem: В ноябре́ был бо́лен ___.
    options: [сосе́д Серёжи, оте́ц Серёжи, Серёжа, друг Серёжи]
    answer: сосе́д Серёжи
  - stem: 'Врач сказа́л: Петру́ Ива́новичу на́до лежа́ть до́ма ___.'
    options: [неде́лю, две неде́ли, три дня, ме́сяц]
    answer: две неде́ли
  - stem: 'Ма́ма подари́т Серёже соба́ку: ___.'
    options: [Серёжа хорошо́ у́чится, Серёжа мо́жет гуля́ть ка́ждое у́тро, так хо́чет сосе́д, ма́ме нра́вятся соба́ки]
    answer: Серёжа мо́жет гуля́ть ка́ждое у́тро
  - stem: О чём и о ком э́тот расска́з? О ___.
    options: [Петре́ Ива́новиче, шко́ле Серёжи, Серёже и соба́ке, Каза́ни]
    answer: Серёже и соба́ке
