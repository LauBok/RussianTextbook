  passage_zh: |
    **谢廖沙和狗**

    谢廖沙早就想要一条狗，可妈妈说：“养狗早晚都得遛，可你早上爱睡懒觉。”

    十一月，他们的邻居彼得·伊万诺维奇病了，医生让他在家躺两个星期。可彼得·伊万诺维奇有一条又大又老的狗，没人遛它。“我来遛！”谢廖沙说。

    两个星期里他每天七点起床。外面又冷又黑，可谢廖沙早上、晚上都去遛狗，放学后还给邻居买面包和牛奶。

    后来彼得·伊万诺维奇给谢廖沙的妈妈打电话：“您的儿子真棒！”妈妈想了很久，晚上对儿子说：“我看你能早起。过生日的时候你会有一条狗！”
  why: 第 1 题，妈妈的理由：[С соба́кой на́до гуля́ть у́тром и ве́чером, а ты у́тром лю́бишь спать]{.ru}；文中没说房子小、狗贵或爸爸反对。第 2 题，[Я бу́ду с ней гуля́ть!]{.ru}，十一月谢廖沙遛的是邻居的狗；生病的是邻居，不是他。第 3 题是推断题：医生让彼得·伊万诺维奇在家躺着，所以他不能遛狗；狗老了不是原因。第 4 题是推断题：妈妈先前的顾虑是他早上起不来，最后她说 [Я ви́жу, ты мо́жешь встава́ть ра́но]{.ru}，顾虑打消了，所以才同意。第 5 题，[На день рожде́ния у тебя́ бу́дет соба́ка!]{.ru}
