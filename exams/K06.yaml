  passage_zh: |
    **区诊所**

    诊所营业时间：星期一至星期五 8:00—20:00，星期六 9:00—15:00。星期天休息。

    | 医生 | 诊室 | 日期 | 时间 |
    |---|---|---|---|
    | 妮娜·帕夫洛夫娜·斯米尔诺娃 | 5 | 星期一、三、五 | 8:00—13:00 |
    | 儿科医生 | 12 | 星期二、四、六 | 9:00—14:00 |
    | 化验室 | 3 | 星期一至星期五 | 8:00—11:00 |

    请记住我们的规定：

    ——要先打电话 234-56-78，然后再去看医生。

    ——化验要早上去，在早饭以前：不能吃东西，不能喝咖啡或茶。

    ——走廊里不能打电话，不能吸烟。

