    **我的朋友**

    我是大学生。以前我住在北京，现在住在莫斯科，住在宿舍里。我的房间里有一张桌子、一张床和一个柜子。桌上放着我的词典和书。

    我的朋友维佳是俄罗斯人。他家以前住在中国，所以维佳会说一点儿中文。现在他不住宿舍，住在一套新公寓里。他在学中文，常常写练习。

    昨天是星期天。我们去了克里姆林宫，后来在一个安静的公园里散步。晚上我写了一封信，讲莫斯科，也讲他。
  why: 第 1 空：主语 [я]{.ru}，[сейча́с]{.ru} 用现在时，[жить]{.ru} 变位加 [в]{.ru}：[живу́]{.ru}（第 14 课）。第 2 空：[общежи́тие]{.ru} 以 [-ие]{.ru} 结尾，第六格是 [-ии]{.ru}：[в общежи́тии]{.ru}，不写成 [-ие]{.ru} 或 [-ье]{.ru}（第 12 课）。第 3 空：[ко́мната]{.ru} 是阴性，[в]{.ru} 后用第六格，物主代词阴性第六格 [мое́й]{.ru}（第 19 课）。第 4 空：[мои́]{.ru} 和动词 [лежа́т]{.ru} 都是复数，[слова́рь]{.ru} 变复数：[-ь]{.ru} 换成 [-и]{.ru}，重音移到词尾：[словари́]{.ru}（第 5 课）。第 5 空：说的是“以前”，用过去时；主语是 [семья́]{.ru}，阴性单数：[жила́]{.ru}。不要因为一家有好几口人就用复数 [жи́ли]{.ru}，也不要跟着前文的 [я жил]{.ru} 用阳性（第 17 课）。第 6 空：[кварти́ра]{.ru} 是阴性，形容词阴性第六格 [но́вой]{.ru}；[но́вом]{.ru} 用于阳性、中性（第 18 课）。第 7 空：[писа́ть]{.ru} 现在时 [с → ш]{.ru}：[пи́шет]{.ru}，重音在词干（第 14 课）。第 8 空：主语是放在后面的 [воскресе́нье]{.ru}，中性，[быть]{.ru} 过去时用 [бы́ло]{.ru}；后面一句的 [бы́ли]{.ru} 主语是 [мы]{.ru}，不要照抄（第 16 课）。第 9 空：[парк]{.ru} 是阳性，[в]{.ru} 后用第六格；[ти́хий]{.ru} 的词干以 [х]{.ru} 结尾，阳性第六格是 [ти́хом]{.ru}（第 18 课）。第 10 空：[он]{.ru} 指维佳，在 [о]{.ru} 后用第六格 [нём]{.ru}；第三人称代词在前置词后要加 [н]{.ru}，不能写 [о его́]{.ru}（第 13 课）。
