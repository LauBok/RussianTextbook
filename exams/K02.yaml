  - zh: ——这是你的眼镜吗？——不，不是我的，是他们的。
    accept:
    - Э́то твои́ очки́? — Нет, не мои́. Э́то их очки́.
    - Э́то твои́ очки́? — Нет, не мои́, а их.
    - Э́то твои́ очки́? — Нет, не мои́. Их.
    - Э́то твои́ очки́? — Нет, э́то не мои́ очки́, а их.
    rubric:
    - '[очки́]{.ru} 只有复数，物主代词用 [твои́]{.ru}、[мои́]{.ru}（第 8 课）'
    - '[их]{.ru} 不变；回答问题用 [нет]{.ru}，否定词用 [не]{.ru}（第 2、8 课）'
  - zh: ——这是一条什么样的河？——这是一条又大又美的河。
    accept:
    - Кака́я э́то река́? — Э́то больша́я и краси́вая река́.
    - Кака́я э́то река́? — Э́то больша́я краси́вая река́.
    - Кака́я э́то река́? — Больша́я и краси́вая.
    rubric:
    - 问“什么样的”用 [како́й]{.ru}，和阴性名词 [река́]{.ru} 一致：[кака́я]{.ru}（第 9 课）
    - 形容词用阴性第一格 [больша́я, краси́вая]{.ru}；汉语的“一条”不译（第 9 课）
  - zh: 我的邻居们在厨房里说中文，我听不懂。
    accept:
    - Мои́ сосе́ди говоря́т на ку́хне по-кита́йски, и я не понима́ю.
    - Мои́ сосе́ди на ку́хне говоря́т по-кита́йски, и я не понима́ю.
    - На ку́хне мои́ сосе́ди говоря́т по-кита́йски, и я не понима́ю.
    - Мои́ сосе́ди говоря́т по-кита́йски на ку́хне, и я не понима́ю.
    - Мои́ сосе́ди говоря́т на ку́хне по-кита́йски, а я не понима́ю.
    rubric:
    - '[говори́ть]{.ru} 第二变位，复数第三人称 [говоря́т]{.ru}；[сосе́д]{.ru} 的复数是 [сосе́ди]{.ru}（第 7、19 课）'
    - “在厨房里”用 [на ку́хне]{.ru}；“说中文”用 [по-кита́йски]{.ru}（第 11、15 课）
    - “听不懂”用 [не понима́ю]{.ru}，[понима́ть]{.ru} 是第一变位（第 7 课）
