    ::: {.prose lang="ru"}
    **Но́вая кварти́ра**

    Ра́ньше на́ша семья́ жила́ в це́нтре. Кварти́ра была́ больша́я и све́тлая, и всё бы́ло бли́зко: и шко́ла, и поликли́ника, и университе́т, и теа́тр. Но на на́шей у́лице всегда́ бы́ло ве́село: и у́тром, и ве́чером там гуля́ли и гро́мко разгова́ривали. Па́па пло́хо спал и ча́сто говори́л: «Здесь не дом, а теа́тр!»

    Тепе́рь мы живём в но́вом райо́не. Он ти́хий, здесь большо́й парк и о́зеро. Па́па тепе́рь спит хорошо́.

    Ма́ма — врач, она́ рабо́тает в поликли́нике в це́нтре. Она́ ча́сто говори́т: «Здесь хорошо́, но рабо́та тепе́рь так далеко́!»

    Я студе́нтка. Мой университе́т то́же далеко́, но э́то ничего́: в метро́ я чита́ю. Ра́ньше я чита́ла ма́ло, а тепе́рь мно́го.

    А мой брат — шко́льник. Его́ но́вая шко́ла здесь, в на́шем райо́не. Ра́ньше он ма́ло гуля́л, а тепе́рь ча́сто гуля́ет в па́рке.
    :::
  glossary:
  - {ru: гро́мко, pos: adv., zh: 大声地}
  passage_zh: |
    **新家**

    以前我们家住在市中心。房子又大又亮，什么都近：学校、诊所、大学、剧院都近。可是我们那条街上总是很热闹：从早到晚都有人在那里散步、大声说话。爸爸睡不好觉，常说：“这里不是家，是剧院！”

    现在我们住在一个新街区。这里很安静，有一个大公园和一片湖。爸爸现在睡得很好。

    妈妈是医生，在市中心的一家诊所工作。她常说：“这里好是好，可是上班现在这么远！”

    我是大学生。我的大学也远了，不过没关系：我在地铁里看书。以前我书看得少，现在看得多了。

    我弟弟是中学生。他的新学校就在这儿，在我们街区。以前他很少出去玩，现在常在公园里散步。
  why: 第 1 题，第一段说旧房子 [всё бы́ло бли́зко]{.ru}；风景好、有湖、爸爸睡得好，说的都是新街区。第 2 题，要读懂原因：街上从早到晚都有人散步、大声说话，所以爸爸睡不好。爸爸说 [Здесь не дом, а теа́тр!]{.ru} 是抱怨吵，不是说剧院远近；旧房子又大又亮，不是小。第 3 题，要把两段合起来：妈妈的诊所在市中心，[рабо́та тепе́рь так далеко́]{.ru}；“我”的大学 [то́же далеко́]{.ru}；弟弟的新学校就在本街区，不远；公园和湖就在新街区里。第 4 题，妈妈住在新街区，说 [Здесь хорошо́]{.ru}，[здесь]{.ru} 指她现在住的新街区；诊所在市中心，是她说的“远”的地方。第 5 题，[Ра́ньше я чита́ла ма́ло, а тепе́рь мно́го]{.ru}：上学路远，她在地铁里看书，现在看得多了；常在公园散步的是弟弟，在市中心工作的是妈妈。
  items:
  - stem: 'Ста́рая кварти́ра была́ хоро́шая: ___.'
    options: [там был прекра́сный вид, там всё бы́ло бли́зко, там бы́ло о́зеро, там па́па хорошо́ спал]
    answer: там всё бы́ло бли́зко
  - stem: 'В ста́рой кварти́ре па́па пло́хо спал: ___.'
    options: [кварти́ра была́ ма́ленькая, теа́тр был далеко́, на у́лице всегда́ гуля́ли и разгова́ривали, ма́ма рабо́тала ве́чером]
    answer: на у́лице всегда́ гуля́ли и разгова́ривали
  - stem: Что тепе́рь далеко́?
    options: [шко́ла и университе́т, поликли́ника и университе́т, парк и о́зеро, шко́ла и поликли́ника]
    answer: поликли́ника и университе́т
  - stem: 'Ма́ма говори́т: «Здесь хорошо́». Здесь — э́то ___.'
    options: [в це́нтре, в поликли́нике, в теа́тре, в но́вом райо́не]
    answer: в но́вом райо́не
  - stem: Тепе́рь студе́нтка ___.
    options: [ма́ло чита́ет, мно́го чита́ет, ча́сто гуля́ет в па́рке, рабо́тает в це́нтре]
    answer: мно́го чита́ет
