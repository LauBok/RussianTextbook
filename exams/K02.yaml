lesson: K02
heading: 第二套
range: L01-L19
names: [Андре́й]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答是 [наш кот]{.ru}，动物和人一样用 [кто]{.ru} 问（第 1 课）。第 2 题：妈妈是医生，在诊所工作：[в поликли́нике]{.ru}；工厂、剧院、学校不是医生通常工作的地方（第 11、12 课）。第 3 题：对方说 [Пока́!]{.ru}“再见”，回答也说 [Пока́!]{.ru}；[Здра́вствуйте]{.ru} 是见面问候（第 12 课）。第 4 题：今天是星期天，“我们不上班，在休息”，休息的地方是别墅：[на да́че]{.ru}；在单位、工厂、诊所是上班（第 11、14 课）。第 5 题：[ле́кция]{.ru} 和 [на]{.ru} 连用：[на ле́кции]{.ru}，和 [на уро́ке, на конце́рте]{.ru} 一样表示“在活动中”；[о, об]{.ru} 表示“关于”（第 12 课）。第 6 题：在厨房里“做”的是午饭：[гото́вить обе́д]{.ru}；小说、练习、电影都不在厨房里“做”（第 17 课）。第 7 题：[о]{.ru} 后面用人称代词第六格，[ма́ма]{.ru} 是阴性，用 [о ней]{.ru}；[она́]{.ru} 是第一格，[её]{.ru} 不跟在 [о]{.ru} 后（第 13 课）。第 8 题：[больши́е]{.ru} 是复数；[го́род]{.ru} 的复数不规则，是 [города́]{.ru}；[дома́]{.ru} 是“房子”的复数，[до́ма]{.ru} 是“在家”，意思都不对（第 5 课）。第 9 题：住在市中心，剧院、博物馆、大学都“近”：[бли́зко]{.ru}；[далеко́]{.ru} 和“住在市中心”矛盾，[ма́ло, ра́ньше]{.ru} 不说明距离（第 14 课）。第 10 题：在大剧院看的是芭蕾：[на бале́те]{.ru}；剧院里不上课、不听讲座，也不是工厂（第 16 课）。第 11 题：[говори́ть]{.ru} 后面用副词 [по-япо́нски]{.ru}；[япо́нский язы́к]{.ru} 用在 [знать, изуча́ть]{.ru} 后面（第 15 课）。第 12 题：[но]{.ru} 表示转折，[ещё]{.ru}“还”说明他说得还不好：[пло́хо]{.ru}；[отли́чно, прекра́сно, хорошо́]{.ru} 都和 [но … ещё]{.ru} 的转折不合（第 12、14 课）。第 13 题：主语 [ле́кция]{.ru} 是阴性，[быть]{.ru} 过去时用 [была́]{.ru}；[быть]{.ru} 和放在后面的主语一致（第 16 课）。第 14 题：猫在床上睡觉，是躺着：[лежи́т]{.ru}；在床上散步、工作说不通，站着也不能睡（第 7 课）。第 15 题：[ра́ньше]{.ru} 说的是过去，主语 [ба́бушка]{.ru} 是女性，用 [рабо́тала]{.ru}；[рабо́тает]{.ru} 是现在时（第 17 课）。第 16 题：合租公寓里大家共用的是厨房：[ку́хня]{.ru}；教室、教研室、图书馆在学校里，不在公寓里（第 19 课）。第 17 题：[кварти́ра]{.ru} 是阴性，[в]{.ru} 后用第六格，形容词阴性第六格是 [но́вой]{.ru}；[но́вом]{.ru} 用于阳性和中性（第 18 课）。第 18 题：用名字加父称称呼，要用尊称 [ваш]{.ru}；[газе́та]{.ru} 是阴性，用 [ва́ша]{.ru}（第 4、8 课）。第 19 题：[но]{.ru} 表示转折，“房子旧，但是很舒适”：[ую́тный]{.ru}；[плохо́й, ма́ленький]{.ru} 不和“旧”形成转折，[ста́рый]{.ru} 和前半句重复（第 14、18 课）。第 20 题：[в]{.ru} 后用第六格，[ко́мната]{.ru} 是阴性，[тот]{.ru} 的阴性第六格是 [той]{.ru}；后半句的 [в э́той]{.ru} 也是同样的形式（第 19 课）。第 21 题：[зда́ние]{.ru} 是中性，用 [како́е]{.ru}（第 9、12 课）。第 22 题：回答是 [В ти́хом]{.ru}，[райо́н]{.ru} 是阳性，[в]{.ru} 后用第六格 [како́м]{.ru}；[како́й]{.ru} 是第一格（第 18、19 课）。第 23 题：后半句说“那里有海”，住的是南方：[на ю́ге]{.ru}；工厂、教研室、单位都谈不上“有海”，也不说“住在”那里（第 11、12 课）。第 24 题：听别人讲有趣的经历，回答 [Как интере́сно!]{.ru}“多有意思啊！”；[Спаси́бо, Пожа́луйста, Ничего́]{.ru} 都不是对这种话的回应（第 16 课）。第 25 题：《大师和玛格丽特》是布尔加科夫的长篇小说，“我”在读它：[чита́ю]{.ru}；小说不是“我”写的，也不能“做饭”“玩”（第 6 课）。
  items:
  - stem: — ___ э́то? — Э́то наш кот.
    options: [Что, Как, Где, Кто]
    answer: Кто
  - stem: Моя́ ма́ма — врач, она́ рабо́тает ___.
    options: [в поликли́нике, на заво́де, в теа́тре, в шко́ле]
    answer: в поликли́нике
  - stem: — Пока́! — ___
    options: [Здра́вствуйте!, Пока́!, Спаси́бо!, Ничего́!]
    answer: Пока́!
  - stem: Сего́дня воскресе́нье. Мы не рабо́таем, мы отдыха́ем ___.
    options: [на рабо́те, на заво́де, на да́че, в поликли́нике]
    answer: на да́че
  - stem: Студе́нты сейча́с ___ ле́кции.
    options: [на, в, о, об]
    answer: на
  - stem: Ба́бушка гото́вит ___ на ку́хне.
    options: [рома́н, упражне́ние, фильм, обе́д]
    answer: обе́д
  - stem: — Ты ча́сто ду́маешь о ма́ме? — Да, я ча́сто ду́маю о ___.
    options: [нём, она́, ней, её]
    answer: ней
  - stem: Москва́ и Пеки́н — больши́е ___.
    options: [го́род, города́, дома́, до́ма]
    answer: города́
  - stem: 'Я живу́ в це́нтре, и всё ___: и теа́тр, и музе́й, и университе́т.'
    options: [бли́зко, далеко́, ма́ло, ра́ньше]
    answer: бли́зко
  - stem: Вчера́ я был в Большо́м теа́тре на ___.
    options: [ле́кции, бале́те, уро́ке, заво́де]
    answer: бале́те
  - stem: Мой друг ра́ньше жил в Япо́нии и хорошо́ говори́т ___.
    options: [япо́нский язы́к, япо́нский, по-япо́нски, япо́нская]
    answer: по-япо́нски
  - stem: Мой брат изуча́ет ру́сский язы́к, но говори́т ещё ___.
    options: [отли́чно, прекра́сно, хорошо́, пло́хо]
    answer: пло́хо
  - stem: Вчера́ ___ интере́сная ле́кция.
    options: [была́, был, бы́ло, бы́ли]
    answer: была́
  - stem: Наш кот ___ на крова́ти и спит.
    options: [стои́т, лежи́т, гуля́ет, рабо́тает]
    answer: лежи́т
  - stem: Ра́ньше ба́бушка ___ в шко́ле.
    options: [рабо́тал, рабо́тали, рабо́тает, рабо́тала]
    answer: рабо́тала
  - stem: 'Я живу́ в коммуна́лке: здесь о́бщая ___.'
    options: [аудито́рия, ка́федра, ку́хня, библиоте́ка]
    answer: ку́хня
  - stem: Мои́ роди́тели живу́т в ___ кварти́ре.
    options: [но́вом, но́вая, но́вый, но́вой]
    answer: но́вой
  - stem: Серге́й Ива́нович, э́то ___ газе́та?
    options: [твоя́, ваш, ва́ша, ва́ше]
    answer: ва́ша
  - stem: Наш дом ста́рый, но о́чень ___.
    options: [плохо́й, ую́тный, ста́рый, ма́ленький]
    answer: ую́тный
  - stem: В ___ ко́мнате живёт мой сосе́д, а в э́той — я.
    options: [той, том, та, тот]
    answer: той
  - stem: — ___ э́то зда́ние? — Э́то наш факульте́т.
    options: [Како́й, Како́е, Кака́я, Каки́е]
    answer: Како́е
  - stem: — В ___ райо́не вы живёте? — В ти́хом.
    options: [како́й, кака́я, каки́е, како́м]
    answer: како́м
  - stem: 'Ра́ньше я жил на ___: там мо́ре.'
    options: [ю́ге, заво́де, ка́федре, рабо́те]
    answer: ю́ге
  - stem: — Вчера́ я была́ в Большо́м теа́тре. — ___
    options: [Спаси́бо!, Пожа́луйста!, Как интере́сно!, Ничего́!]
    answer: Как интере́сно!
  - stem: — Что ты сейча́с де́лаешь? — Я ___ рома́н «Ма́стер и Маргари́та».
    options: [чита́ю, пишу́, гото́влю, игра́ю]
    answer: чита́ю
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Мой сосе́д**

    Меня́ зову́т Серге́й. Я студе́нт, изуча́ю (1) []{.blank} язы́к. Я живу́ не в общежи́тии, а в коммуна́лке. Здесь о́бщая (2) []{.blank}, и мы ча́сто разгова́риваем там.

    Мой сосе́д — ста́рый (3) []{.blank}. Ра́ньше он рабо́тал в университе́те в Пеки́не, а тепе́рь он до́ма: чита́ет, пи́шет, гото́вит обе́д. Он отли́чно говори́т (4) []{.blank} и мно́го зна́ет о Кита́е.

    Вчера́ бы́ло (5) []{.blank}, и я был до́ма. Я писа́л упражне́ние, но понима́л (6) []{.blank}. Пото́м я был на (7) []{.blank}. Там (8) []{.blank} обе́д мой сосе́д. Он (9) []{.blank}: «Что ты пи́шешь?» — «(10) []{.blank} по-кита́йски».

    Сосе́д чита́л моё упражне́ние и (11) []{.blank} о́чень ме́дленно. Тепе́рь я всё (12) []{.blank}! Пото́м сосе́д мно́го (13) []{.blank} о Пеки́не, а я (14) []{.blank}. Э́то бы́ло о́чень интере́сно!

    Сего́дня я был в университе́те, в аудито́рии, на (15) []{.blank}. Преподава́тель (16) []{.blank}: «Како́й го́род Пеки́н? Кто зна́ет?» И я мно́го (17) []{.blank} о Пеки́не. Преподава́тель говори́л: «(18) []{.blank}! Ты хорошо́ зна́ешь Пеки́н». А я ду́мал о (19) []{.blank}: э́то он вчера́ расска́зывал о Пеки́не.

    Тепе́рь мы ча́сто разгова́риваем на ку́хне (20) []{.blank}.
    :::
  passage_zh: |
    **我的邻居**

    我叫谢尔盖。我是大学生，学中文。我不住宿舍，住在一套合租公寓里。这里的厨房是公用的，我们常常在那儿聊天。

    我的邻居是一位老教师。他以前在北京的一所大学工作，现在待在家里：看书，写东西，做饭。他中文说得特别好，对中国了解很多。

    昨天是星期天，我在家。我在写练习，可是不太懂。后来我去了厨房。邻居正在那里做午饭。他问：“你在写什么？”——“中文练习。”

    邻居看了我的练习，讲得很慢。现在我全都懂了！后来邻居讲了很多北京的事，我听着。真有意思！

    今天我在学校的教室里上课。老师问：“北京是一座什么样的城市？谁知道？”我就讲了很多北京的事。老师说：“很好！你很了解北京。”我心里想着我的邻居：这些是他昨天讲给我听的。

    现在我们常常在厨房里说中文。
  why: '第 1 空：后文“我”写的是 [упражне́ние по-кита́йски]{.ru}“中文练习”，最后一句又说我们在厨房说中文，“我”学的是中文：[кита́йский]{.ru}。第 2 空：后文邻居在那里做午饭，最后一句说 [разгова́риваем на ку́хне]{.ru}，合租公寓里公用的是厨房：[ку́хня]{.ru}；图书馆、教研室、教室在学校里，不在公寓里。第 3 空：下一句说他以前在大学工作，后文他又给“我”讲练习，是老教师：[преподава́тель]{.ru}；医生、工程师、演员不在大学教书。第 4 空：前一句说他在北京工作过，后面说他对中国了解很多，他说得好的是中文：[по-кита́йски]{.ru}。第 5 空：后半句说“我”在家，不上课，是星期天：[воскресе́нье]{.ru}；[Вчера́ бы́ло у́тро]{.ru} 没有意义，大楼、湖不能说“昨天是”。第 6 空：[но]{.ru} 表示转折，“在写练习，可是不太懂”；后文邻居讲过之后 [Тепе́рь я всё понима́ю]{.ru}，可见原来懂得差：[пло́хо]{.ru}；[отли́чно, хорошо́, прекра́сно]{.ru} 和后文矛盾。第 7 空：下一句说邻居在那里做午饭，第一段说大家在公用厨房聊天：[на ку́хне]{.ru}；前一句说“我”昨天在家，所以不在讲座、单位或参观中。第 8 空：第二段说邻居在家做饭，[гото́вить обе́д]{.ru}“做午饭”是固定搭配；午饭不能写、读、听。第 9 空：引号里是问句 [Что ты пи́шешь?]{.ru}，用 [спра́шивал]{.ru}“问”；讲述、想、写都不能引出向对方提的问题。第 10 空：前文说“我”在写练习，回答“写的是中文练习”：[Упражне́ние]{.ru}；午饭、信、小说都和前文不符。第 11 空：邻居看了练习，[о́чень ме́дленно]{.ru}“讲得很慢”，“我”才全懂了：[говори́л]{.ru}；散步、睡觉、玩都不能“看了练习然后很慢地”做，也不会让“我”懂。第 12 空：和第三段 [понима́л пло́хо]{.ru} 对照，邻居讲过之后“现在全懂了”：[понима́ю]{.ru}。第 13 空：后半句“我在听”，邻居是在讲：[расска́зывал]{.ru}；写、做饭、听都和“我在听”对不上。第 14 空：邻居在讲，“我”在听：[слу́шал]{.ru}，下一句“真有意思”也说明“我”听得很认真；睡觉、散步、做饭都不合。第 15 空：前面说在大学教室里，后文有老师提问：[на уро́ке]{.ru}；别墅、音乐会、参观都不在教室里。第 16 空：引号里是问句，老师在提问：[спра́шивал]{.ru}。第 17 空：老师提问，“我”回答，讲了很多北京的事：[расска́зывал]{.ru}；想、写、问都不是回答老师。第 18 空：后面老师夸“你很了解北京”，说的是 [Отли́чно!]{.ru}“很好！”；[Ничего́]{.ru} 是“没关系”，[Пожа́луйста]{.ru} 回答道谢，[Пока́]{.ru} 是告别。第 19 空：冒号后说“是他昨天讲了北京”，昨天讲北京的是邻居：[о сосе́де]{.ru}；老师今天只是提问。第 20 空：“我”学中文，邻居中文说得好，现在两人常用中文聊天：[по-кита́йски]{.ru}。'
  items:
  - options: [англи́йский, япо́нский, кита́йский, францу́зский]
    answer: кита́йский
  - options: [ко́мната, ку́хня, библиоте́ка, ка́федра]
    answer: ку́хня
  - options: [инжене́р, врач, актёр, преподава́тель]
    answer: преподава́тель
  - options: [по-англи́йски, по-кита́йски, по-япо́нски, по-каза́хски]
    answer: по-кита́йски
  - options: [у́тро, зда́ние, воскресе́нье, о́зеро]
    answer: воскресе́нье
  - options: [пло́хо, отли́чно, хорошо́, прекра́сно]
    answer: пло́хо
  - options: [ле́кции, рабо́те, экску́рсии, ку́хне]
    answer: ку́хне
  - options: [гото́вил, писа́л, чита́л, слу́шал]
    answer: гото́вил
  - options: [расска́зывал, ду́мал, спра́шивал, писа́л]
    answer: спра́шивал
  - options: [Обе́д, Письмо́, Рома́н, Упражне́ние]
    answer: Упражне́ние
  - options: [гуля́л, говори́л, спал, игра́л]
    answer: говори́л
  - options: [пишу́, гото́влю, игра́ю, понима́ю]
    answer: понима́ю
  - options: [гото́вил, расска́зывал, писа́л, слу́шал]
    answer: расска́зывал
  - options: [слу́шал, спал, гуля́л, гото́вил]
    answer: слу́шал
  - options: [да́че, конце́рте, уро́ке, экску́рсии]
    answer: уро́ке
  - options: [расска́зывал, спра́шивал, гото́вил, гуля́л]
    answer: спра́шивал
  - options: [расска́зывал, ду́мал, писа́л, спра́шивал]
    answer: расска́зывал
  - options: [Ничего́, Пожа́луйста, Отли́чно, Пока́]
    answer: Отли́чно
  - options: [преподава́теле, ба́бушке, подру́ге, сосе́де]
    answer: сосе́де
  - options: [по-кита́йски, по-англи́йски, по-япо́нски, по-каза́хски]
    answer: по-кита́йски
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ба́бушка**

    Моя́ ба́бушка живёт в Москве́, в ти́хом райо́не. Её кварти́ра ма́ленькая, но ую́тная, и там прекра́сный вид: о́зеро и парк.

    Ра́ньше ба́бушка рабо́тала в шко́ле. Она́ зна́ет францу́зский язы́к и хорошо́ говори́т по-францу́зски. Ра́ньше она́ жила́ в Пари́же.

    Вчера́ бы́ло воскресе́нье, и я была́ там. Ба́бушка гото́вила обе́д, а я писа́ла упражне́ния. Пото́м мы гуля́ли в па́рке и разгова́ривали то́лько по-францу́зски. Ба́бушка мно́го расска́зывала о Пари́же. А ве́чером мы бы́ли в теа́тре, на бале́те.
    :::
  passage_zh: |
    **奶奶**

    我奶奶住在莫斯科一个安静的街区。她的公寓不大，但很舒适，窗外景色很美：一片湖和一座公园。

    奶奶以前在学校工作。她懂法语，法语说得很好。她以前在巴黎住过。

    昨天是星期天，我去了她那儿。奶奶做午饭，我写练习。后来我们去公园散步，只说法语。奶奶讲了很多巴黎的事。晚上我们去剧院看了芭蕾。
  why: 第 1 题，第一句 [живёт в Москве́, в ти́хом райо́не]{.ru}。第 2 题，[Её кварти́ра ма́ленькая, но ую́тная]{.ru}；文中没说公寓旧。第 3 题，[Ра́ньше ба́бушка рабо́тала в шко́ле]{.ru}；她以前住在巴黎，不是中国，也没说住在别墅。第 4 题，[гуля́ли в па́рке и разгова́ривали то́лько по-францу́зски]{.ru}。第 5 题，[А ве́чером мы бы́ли в теа́тре, на бале́те]{.ru}；去公园是白天的事，巴黎是奶奶讲的地方。
  items:
  - stem: Где живёт ба́бушка? Она́ живёт ___.
    options: [в це́нтре, на да́че, в общежи́тии, в ти́хом райо́не]
    answer: в ти́хом райо́не
  - stem: Её кварти́ра ___.
    options: [больша́я и ую́тная, ма́ленькая и ста́рая, ма́ленькая и ую́тная, больша́я и ста́рая]
    answer: ма́ленькая и ую́тная
  - stem: Ра́ньше ба́бушка ___.
    options: [рабо́тала в теа́тре, рабо́тала в шко́ле, жила́ в Кита́е, жила́ на да́че]
    answer: рабо́тала в шко́ле
  - stem: В па́рке они́ разгова́ривали ___.
    options: [по-францу́зски, по-ру́сски, по-англи́йски, по-кита́йски]
    answer: по-францу́зски
  - stem: Ве́чером они́ бы́ли ___.
    options: [в па́рке, до́ма, в Пари́же, на бале́те]
