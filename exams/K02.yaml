lesson: K02
heading: 第二套
range: L01-L19
names: [Андре́й, Ле́на, Ви́тя, Па́ша, Ни́на]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[слова́рь]{.ru} 以 [-ь]{.ru} 结尾，却是阳性（复数 [словари́]{.ru}），回答用 [мой]{.ru}；以 [-ь]{.ru} 结尾的名词有阳性也有阴性，要一个个记（第 3、8 课）。第 2 题：[ле́кция]{.ru} 和 [уро́к, конце́рт, экску́рсия]{.ru} 一样表示活动，“在听课”用 [на]{.ru}；[в]{.ru} 用于有四壁的处所，如 [в аудито́рии]{.ru}；[о, об]{.ru} 表示“关于”，句中没有“谈、想”一类动词（第 12 课）。第 3 题：问“你知道她在哪儿吗”，回答者不确定，用 [Мо́жет быть]{.ru}“也许”；[Пожа́луйста]{.ru} 回答道谢，[Пока́]{.ru} 告别，[Как интере́сно!]{.ru} 是对有趣经历的反应（第 11 课）。第 4 题：今天是星期天，“我们不上班，在休息”，休息的地方是别墅：[на да́че]{.ru}；在单位、工厂、诊所是上班（第 11、14 课）。第 5 题：[Росси́я]{.ru} 以 [-ия]{.ru} 结尾，第六格是 [-ии]{.ru}：[в Росси́и]{.ru}；一般阴性名词变 [-е]{.ru}（[в Москве́]{.ru}），但 [-ия]{.ru} 结尾的不能写成 [-ие]{.ru}，这是最常见的错误（第 12 课）。第 6 题：在厨房里“做”的是午饭：[гото́вить обе́д]{.ru}；小说、练习、电影都不在厨房里“做”（第 17 课）。第 7 题：[о]{.ru} 后面用人称代词第六格，[ма́ма]{.ru} 是阴性，用 [о ней]{.ru}；[она́]{.ru} 是第一格，[её]{.ru} 不跟在 [о]{.ru} 后，[о нём]{.ru} 指阳性（第 13 课）。第 8 题：[больши́е]{.ru} 是复数；[го́род]{.ru} 的复数不规则，是 [города́]{.ru}；[дома́]{.ru} 是“房子”的复数，[до́ма]{.ru} 是“在家”，意思都不对（第 5、9 课）。第 9 题：住在市中心，剧院、博物馆、大学都“近”：[бли́зко]{.ru}；[далеко́]{.ru} 和“住在市中心”矛盾，[ма́ло, ра́ньше]{.ru} 不说明距离（第 14 课）。第 10 题：[ты]{.ru} 指的是莲娜，女性，过去时用 [была́]{.ru}；过去时跟说话对象的性别走，不能因为 [ты]{.ru} 就用阳性 [был]{.ru}（第 16 课）。第 11 题：[говори́ть]{.ru} 后面用副词 [по-япо́нски]{.ru}；[япо́нский язы́к]{.ru} 用在 [знать, изуча́ть]{.ru} 后面（第 15 课）。第 12 题：[но]{.ru} 表示转折，[ещё]{.ru}“还”说明他说得还不好：[пло́хо]{.ru}；[отли́чно, прекра́сно, хорошо́]{.ru} 都和 [но … ещё]{.ru} 的转折不合（第 12、14 课）。第 13 题：主语 [ле́кция]{.ru} 是阴性，[быть]{.ru} 过去时用 [была́]{.ru}；主语放在动词后面，要先找到它再定词尾（第 16 课）。第 14 题：[общежи́тие]{.ru} 以元音 [о]{.ru} 开头，前面用 [об]{.ru}；[обо]{.ru} 只用于 [обо мне]{.ru}；问的是“写什么”，[на]{.ru} 表示处所，不对（第 13 课）。第 15 题：[писа́ть]{.ru} 现在时词干变 [с → ш]{.ru}：[пишу́, пи́шешь]{.ru}，重音从第二人称起移到词干；[писа́ешь]{.ru} 是照 [чита́ть]{.ru} 乱套的形式，[пишёшь]{.ru} 重音和写法都错（第 14 课）。第 16 题：[общежи́тие]{.ru} 是中性，物主代词中性第六格是 [на́шем]{.ru}；不要因为名词的第六格 [общежи́тии]{.ru} 以 [-и]{.ru} 结尾就选阴性 [на́шей]{.ru}（第 19 课）。第 17 题：[кварти́ра]{.ru} 是阴性，[в]{.ru} 后用第六格，形容词阴性第六格是 [но́вой]{.ru}；[но́вом]{.ru} 用于阳性和中性（第 18 课）。第 18 题：用名字加父称称呼，要用尊称 [ваш]{.ru}；[газе́та]{.ru} 是阴性，用 [ва́ша]{.ru}（第 4、8 课）。第 19 题：[но]{.ru} 表示转折，“房子旧，但是很舒适”：[ую́тный]{.ru}；[плохо́й, ма́ленький]{.ru} 不和“旧”形成转折，[ста́рый]{.ru} 和前半句重复（第 14、18 课）。第 20 题：[в]{.ru} 后用第六格，[ко́мната]{.ru} 是阴性，[тот]{.ru} 的阴性第六格是 [той]{.ru}；[том]{.ru} 是阳性、中性，[та]{.ru} 是阴性第一格（第 19 课）。第 21 题：[зда́ние]{.ru} 是中性，用 [како́е]{.ru}（第 9、12 课）。第 22 题：回答是 [В ти́хом]{.ru}，[райо́н]{.ru} 是阳性，[в]{.ru} 后用第六格 [како́м]{.ru}；[како́й]{.ru} 是第一格（第 18、19 课）。第 23 题：[изуча́ть]{.ru} 后面用名词 [англи́йский язы́к]{.ru}；[по-англи́йски]{.ru} 是“用英语”，只用在 [говори́ть, чита́ть, писа́ть, понима́ть]{.ru} 后面；[на англи́йском]{.ru} 也是“用英语”的意思，不能做 [изуча́ть]{.ru} 的对象（第 15 课）。第 24 题：听别人讲有趣的经历，回答 [Как интере́сно!]{.ru}“多有意思啊！”；[Спаси́бо, Пожа́луйста, Ничего́]{.ru} 都不是对这种话的回应（第 16 课）。第 25 题：[о]{.ru} 后面用人称代词第六格，[роди́тели]{.ru} 是复数，用 [о них]{.ru}；[их]{.ru} 是物主代词“他们的”，不跟在 [о]{.ru} 后；[они́]{.ru} 是第一格（第 13 课）。
  items:
  - stem: — Чей э́то слова́рь? — ___.
    options: [Моя́, Мой, Моё, Мои́]
    answer: Мой
  - stem: Студе́нты сейча́с ___ ле́кции.
    options: [на, в, о, об]
    answer: на
  - stem: — Ты зна́ешь, где Ле́на? — ___, в библиоте́ке.
    options: [Пожа́луйста, Пока́, Мо́жет быть, Как интере́сно]
    answer: Мо́жет быть
  - stem: Сего́дня воскресе́нье. Мы не рабо́таем, мы отдыха́ем ___.
    options: [на рабо́те, на заво́де, на да́че, в поликли́нике]
    answer: на да́че
  - stem: Моя́ подру́га сейча́с живёт в ___.
    options: [Росси́я, Росси́е, Росси́и, Росси́ю]
    answer: Росси́и
  - stem: Ба́бушка гото́вит ___ на ку́хне.
    options: [рома́н, упражне́ние, фильм, обе́д]
    answer: обе́д
  - stem: — Ты ча́сто ду́маешь о ма́ме? — Да, я ча́сто ду́маю о ___.
    options: [нём, она́, ней, её]
    answer: ней
  - stem: Москва́ и Пеки́н — больши́е ___.
    options: [го́род, города́, дома́, до́ма]
    answer: города́
  - stem: 'Я живу́ в це́нтре, и всё ___: и теа́тр, и музе́й, и университе́т.'
    options: [бли́зко, далеко́, ма́ло, ра́ньше]
    answer: бли́зко
  - stem: — Ле́на, где ты ___ вчера́ ве́чером? — В теа́тре.
    options: [был, была́, бы́ло, бы́ли]
    answer: была́
  - stem: Мой друг ра́ньше жил в Япо́нии и хорошо́ говори́т ___.
    options: [япо́нский язы́к, япо́нский, по-япо́нски, япо́нская]
    answer: по-япо́нски
  - stem: Мой брат изуча́ет ру́сский язы́к, но говори́т ещё ___.
    options: [отли́чно, прекра́сно, хорошо́, пло́хо]
    answer: пло́хо
  - stem: Вчера́ ___ интере́сная ле́кция.
    options: [была́, был, бы́ло, бы́ли]
    answer: была́
  - stem: — О чём ты пи́шешь? — ___ общежи́тии.
    options: [О, Об, Обо, На]
    answer: Об
  - stem: — Что ты сейча́с ___? — Упражне́ние.
    options: [писа́ешь, пи́шешь, пишёшь, пи́сишь]
    answer: пи́шешь
  - stem: Мы живём в ___ общежи́тии.
    options: [на́шей, на́ше, на́шем, на́ша]
    answer: на́шем
  - stem: Мои́ роди́тели живу́т в ___ кварти́ре.
    options: [но́вом, но́вая, но́вый, но́вой]
    answer: но́вой
  - stem: Серге́й Ива́нович, э́то ___ газе́та?
    options: [твоя́, ваш, ва́ша, ва́ше]
    answer: ва́ша
  - stem: Наш дом ста́рый, но о́чень ___.
    options: [плохо́й, ую́тный, ста́рый, ма́ленький]
    answer: ую́тный
  - stem: В ___ ко́мнате живёт мой сосе́д, а здесь живу́ я.
    options: [той, том, та, тот]
    answer: той
  - stem: — ___ э́то зда́ние? — Э́то наш факульте́т.
    options: [Како́й, Како́е, Кака́я, Каки́е]
    answer: Како́е
  - stem: — В ___ райо́не вы живёте? — В ти́хом.
    options: [како́й, кака́я, каки́е, како́м]
    answer: како́м
  - stem: Моя́ сестра́ в шко́ле изуча́ет ___.
    options: [по-англи́йски, англи́йский язы́к, на англи́йском, англи́йская]
    answer: англи́йский язы́к
  - stem: — Вчера́ я была́ в Большо́м теа́тре. — ___
    options: [Спаси́бо!, Пожа́луйста!, Как интере́сно!, Ничего́!]
    answer: Как интере́сно!
  - stem: Мои́ роди́тели живу́т в Пеки́не. Я ча́сто ду́маю о ___.
    options: [их, них, они́, нём]
    answer: них
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Мой сосе́д**

    Меня́ зову́т Па́ша. Я студе́нт, изуча́ю (1) []{.blank} язы́к. Я живу́ не в общежи́тии, а в коммуна́лке. Здесь о́бщая (2) []{.blank}, и мы ча́сто разгова́риваем там.

    Мой сосе́д — ста́рый (3) []{.blank}. Ра́ньше он рабо́тал в университе́те в Пеки́не, а тепе́рь он до́ма: чита́ет, пи́шет, гото́вит обе́д. Он отли́чно говори́т (4) []{.blank} и мно́го зна́ет о Кита́е. Он ча́сто ду́мает о (5) []{.blank}.

    Вчера́ бы́ло (6) []{.blank}, и я был до́ма. Я писа́л упражне́ние, но понима́л (7) []{.blank}. Пото́м я был на (8) []{.blank}. Там (9) []{.blank} обе́д мой сосе́д. Он (10) []{.blank}: «Что ты пи́шешь?» — «(11) []{.blank} по-кита́йски».

    Сосе́д чита́л моё упражне́ние и (12) []{.blank} о́чень ме́дленно. Тепе́рь я всё (13) []{.blank}! Пото́м сосе́д мно́го (14) []{.blank} о Пеки́не, а я (15) []{.blank}. Э́то бы́ло о́чень интере́сно!

    Сего́дня я был в университе́те, в (16) []{.blank}, на (17) []{.blank}. Преподава́тель спра́шивал: «Како́й го́род Пеки́н? Кто зна́ет?» И я мно́го расска́зывал о Пеки́не. Преподава́тель говори́л: «(18) []{.blank}! Ты хорошо́ зна́ешь Пеки́н». А я ду́мал о (19) []{.blank}: э́то он вчера́ расска́зывал о Пеки́не.

    Тепе́рь мы ча́сто разгова́риваем на ку́хне (20) []{.blank}.
    :::
  passage_zh: |
    **我的邻居**

    我叫帕沙。我是大学生，学中文。我不住宿舍，住在一套合租公寓里。这里的厨房是公用的，我们常常在那儿聊天。

    我的邻居是一位老教师。他以前在北京的一所大学工作，现在待在家里：看书，写东西，做饭。他中文说得特别好，对中国了解很多。他常常想念那里。

    昨天是星期天，我在家。我在写练习，可是不太懂。后来我去了厨房。邻居正在那里做午饭。他问：“你在写什么？”——“中文练习。”

    邻居看了我的练习，讲得很慢。现在我全都懂了！后来邻居讲了很多北京的事，我听着。真有意思！

    今天我在学校的教室里上课。老师问：“北京是一座什么样的城市？谁知道？”我就讲了很多北京的事。老师说：“很好！你很了解北京。”我心里想着我的邻居：这些是他昨天讲给我听的。

    现在我们常常在厨房里说中文。
  why: '第 1 空：后文“我”写的是 [упражне́ние по-кита́йски]{.ru}“中文练习”，又请邻居讲解，“我”学的是中文：[кита́йский]{.ru}。第 2 空：后文邻居在那里做午饭，最后一句说 [разгова́риваем на ку́хне]{.ru}，合租公寓里公用的是厨房：[ку́хня]{.ru}；图书馆、教研室在学校里，不在公寓里。第 3 空：下一句说他以前在大学工作，后文他又给“我”讲练习，是老教师：[преподава́тель]{.ru}；医生、工程师、演员不在大学教书。第 4 空：[говори́ть]{.ru} 后面说“用什么语言”要用副词 [по-кита́йски]{.ru}，不能用 [кита́йский язы́к]{.ru} 或 [кита́йский]{.ru}（第 15 课）；他在北京工作过，后来又给“我”讲中文练习，所以不是 [по-англи́йски]{.ru}。第 5 空：他想的是上一句说的 [Кита́й]{.ru}，阳性名词，[о]{.ru} 后人称代词用 [нём]{.ru}；[ней]{.ru} 指阴性，[них]{.ru} 指复数，[его́]{.ru} 不能跟在 [о]{.ru} 后面（第 13 课）。第 6 空：后半句说“我”在家，不上课，是星期天：[воскресе́нье]{.ru}；[Вчера́ бы́ло у́тро]{.ru} 说不通，大楼、湖不能说“昨天是”。第 7 空：[но]{.ru} 表示转折，“在写练习，可是不太懂”；后文邻居讲过之后 [Тепе́рь я всё понима́ю]{.ru}，可见原来懂得差：[пло́хо]{.ru}；[отли́чно, хорошо́, прекра́сно]{.ru} 和后文矛盾。第 8 空：下一句说邻居在那里做午饭，第一段说大家在公用厨房聊天：[на ку́хне]{.ru}；前一句说“我”昨天在家，所以不在讲座、单位或参观中。第 9 空：第二段说邻居在家做饭，[гото́вить обе́д]{.ru}“做午饭”是固定搭配；午饭不能写、读、听。第 10 空：引号里是问句 [Что ты пи́шешь?]{.ru}，用 [спра́шивал]{.ru}“问”；讲述、想、写都不能引出向对方提的问题。第 11 空：前文说“我”在写练习，回答“写的是中文练习”：[Упражне́ние]{.ru}；午饭、信、小说都和前文不符。第 12 空：邻居看了练习，[о́чень ме́дленно]{.ru}“讲得很慢”，“我”才全懂了：[говори́л]{.ru}；散步、睡觉、玩都不会让“我”懂。第 13 空：和第三段 [понима́л пло́хо]{.ru} 对照，邻居讲过之后“现在全懂了”：[понима́ю]{.ru}。第 14 空：后半句“我在听”，邻居是在讲：[расска́зывал]{.ru}；写、做饭、听都和“我在听”对不上。第 15 空：邻居在讲，“我”在听：[слу́шал]{.ru}；睡觉、散步、做饭都不合。第 16 空：[аудито́рия]{.ru} 以 [-ия]{.ru} 结尾，[в]{.ru} 后的第六格是 [-ии]{.ru}：[в аудито́рии]{.ru}；不能按一般阴性名词写成 [-ие]{.ru}，[аудито́рию]{.ru} 不是第六格（第 12 课）。第 17 空：老师在教室里提问，“我”回答，是在上课：[на уро́ке]{.ru}；别墅、音乐会、参观都不在教室里。第 18 空：后面老师夸“你很了解北京”，说的是 [Отли́чно!]{.ru}“很好！”；[Ничего́]{.ru} 是“没关系”，[Пожа́луйста]{.ru} 回答道谢，[Пока́]{.ru} 是告别。第 19 空：冒号后说“是他昨天讲了北京”，昨天讲北京的是邻居：[о сосе́де]{.ru}；老师今天只是提问。第 20 空：开头说大家常在厨房聊天，[тепе́рь]{.ru}“如今”说明有了变化：“我”学中文，邻居中文说得好，现在两人用中文聊：[по-кита́йски]{.ru}；[по-ру́сски]{.ru} 是原来就有的情况，用不着说“如今”。'
  items:
  - options: [англи́йский, япо́нский, кита́йский, францу́зский]
    answer: кита́йский
  - options: [ко́мната, ку́хня, библиоте́ка, ка́федра]
    answer: ку́хня
  - options: [инжене́р, врач, актёр, преподава́тель]
    answer: преподава́тель
  - options: [кита́йский язы́к, по-англи́йски, по-кита́йски, кита́йский]
    answer: по-кита́йски
  - options: [ней, нём, них, его́]
    answer: нём
  - options: [у́тро, зда́ние, воскресе́нье, о́зеро]
    answer: воскресе́нье
  - options: [пло́хо, отли́чно, хорошо́, прекра́сно]
    answer: пло́хо
  - options: [ле́кции, рабо́те, экску́рсии, ку́хне]
    answer: ку́хне
  - options: [гото́вил, писа́л, чита́л, слу́шал]
    answer: гото́вил
  - options: [расска́зывал, ду́мал, спра́шивал, писа́л]
