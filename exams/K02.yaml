- id: e8
  type: translate
  task: 汉译俄：把下列句子译成俄语。
  points: 5
  why: 每句 5 分：句子结构和关键语法点正确得 5 分；评分要点里的关键语法点错一处扣 2 分，其他小错（个别词尾、重音位置不计）每处扣 1 分，扣完为止。
  items:
  - zh: ——你姐姐在哪儿工作？——她在诊所工作。
    accept:
    - Где рабо́тает твоя́ сестра́? — Она́ рабо́тает в поликли́нике.
    - Где твоя́ сестра́ рабо́тает? — Она́ рабо́тает в поликли́нике.
    - Где рабо́тает твоя́ сестра́? — В поликли́нике.
    rubric:
    - '[сестра́]{.ru} 是阴性，用 [твоя́]{.ru}（第 8 课）'
    - “在诊所”用 [в]{.ru} + 第六格 [в поликли́нике]{.ru}，不用 [на]{.ru}（第 11、12 课）
  - zh: 昨天我们在课上谈了北京。
    accept:
    - Вчера́ на уро́ке мы говори́ли о Пеки́не.
    - Вчера́ мы говори́ли о Пеки́не на уро́ке.
    - Мы вчера́ на уро́ке говори́ли о Пеки́не.
    - Вчера́ на уро́ке мы разгова́ривали о Пеки́не.
    rubric:
    - “在课上”用 [на уро́ке]{.ru}，不用 [в уро́ке]{.ru}（第 12 课）
    - “谈北京”用 [о]{.ru} + 第六格 [о Пеки́не]{.ru}（第 13 课）
    - 过去时复数 [говори́ли]{.ru}（第 17 课）
  - zh: 以前我父亲住在一个小房间里。
    accept:
    - Ра́ньше мой оте́ц жил в ма́ленькой ко́мнате.
    - Мой оте́ц ра́ньше жил в ма́ленькой ко́мнате.
    - Ра́ньше мой па́па жил в ма́ленькой ко́мнате.
    - Мой па́па ра́ньше жил в ма́ленькой ко́мнате.
    rubric:
    - '[жить]{.ru} 的过去时阳性 [жил]{.ru}（第 14、17 课）'
    - '[в]{.ru} + 第六格，形容词和名词都要变：[в ма́ленькой ко́мнате]{.ru}（第 18 课）'
    - 汉语的“一个”不译
  - zh: ——这是你的眼镜吗？——不，不是我的，是他们的。
    accept:
    - Э́то твои́ очки́? — Нет, не мои́. Э́то их очки́.
    - Э́то твои́ очки́? — Нет, не мои́, а их.
    - Э́то твои́ очки́? — Нет, не мои́. Их.
    - Э́то твои́ очки́? — Нет, э́то не мои́ очки́, а их.
    rubric:
    - '[очки́]{.ru} 只有复数，物主代词用 [твои́]{.ru}、[мои́]{.ru}（第 8 课）'
    - '[их]{.ru} 不变；回答问题用 [нет]{.ru}，否定词用 [не]{.ru}（第 2、8 课）'
  - zh: ——昨天你们去哪儿了？——我们在公园散步，后来去了图书馆。
    accept:
    - Где вы бы́ли вчера́? — Мы гуля́ли в па́рке, а пото́м бы́ли в библиоте́ке.
    - Где вы бы́ли вчера́? — Мы гуля́ли в па́рке, пото́м бы́ли в библиоте́ке.
    - Где вы вчера́ бы́ли? — Мы гуля́ли в па́рке, а пото́м бы́ли в библиоте́ке.
    - Вчера́ где вы бы́ли? — Мы гуля́ли в па́рке, а пото́м бы́ли в библиоте́ке.
    - Где вы бы́ли вчера́? — Мы бы́ли в па́рке, гуля́ли, а пото́м бы́ли в библиоте́ке.
    rubric:
    - 汉语说“去哪儿了”，俄语问过去在什么地方用 [Где вы бы́ли?]{.ru}，[быть]{.ru} 过去时复数 [бы́ли]{.ru}（第 16 课）
    - “在公园”“在图书馆”用 [в]{.ru} + 第六格 [в па́рке, в библиоте́ке]{.ru}（第 11 课）
    - 过去时复数 [гуля́ли]{.ru}；“后来”用 [пото́м]{.ru}（第 12、17 课）
  - zh: 我的邻居们在厨房里说中文，我听不懂。
    accept:
    - Мои́ сосе́ди говоря́т на ку́хне по-кита́йски, и я не понима́ю.
    - Мои́ сосе́ди на ку́хне говоря́т по-кита́йски, и я не понима́ю.
    - На ку́хне мои́ сосе́ди говоря́т по-кита́йски, и я не понима́ю.
    - Мои́ сосе́ди говоря́т по-кита́йски на ку́хне, и я не понима́ю.
    - Мои́ сосе́ди говоря́т на ку́хне по-кита́йски, а я не понима́ю.
    rubric:
    - '[говори́ть]{.ru} 第二变位，复数第三人称 [говоря́т]{.ru}；[сосе́д]{.ru} 的复数是 [сосе́ди]{.ru}（第 7、19 课）'
    - “在厨房里”用 [на ку́хне]{.ru}；“说中文”用 [по-кита́йски]{.ru}（第 11、15 课）
    - “听不懂”用 [не понима́ю]{.ru}，[понима́ть]{.ru} 是第一变位（第 7 课）
