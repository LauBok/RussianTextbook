    ::: {.prose lang="ru"}
    **Ба́бушка**

    Меня́ зову́т Ни́на. Моя́ ба́бушка живёт в Москве́, в ти́хом райо́не. Её кварти́ра ма́ленькая, но ую́тная, и там прекра́сный вид: река́ и ста́рый собо́р.

    Ра́ньше ба́бушка рабо́тала в шко́ле. Она́ зна́ет францу́зский язы́к и хорошо́ говори́т по-францу́зски. Ра́ньше она́ жила́ в Пари́же.

    Вчера́ бы́ло воскресе́нье, и я была́ там. Ба́бушка гото́вила обе́д, а я писа́ла упражне́ния. Пото́м мы гуля́ли в па́рке и разгова́ривали то́лько по-францу́зски. Ба́бушка мно́го расска́зывала о Пари́же. А ве́чером мы бы́ли в теа́тре, на бале́те. Ба́бушка говори́ла: «Како́й прекра́сный бале́т!» А я ду́мала не о бале́те, а о Пари́же.
    :::
  passage_zh: |
    **奶奶**

    我叫尼娜。我奶奶住在莫斯科一个安静的街区。她的公寓不大，但很舒适，窗外景色很美：一条河和一座古老的教堂。

    奶奶以前在学校工作。她懂法语，法语说得很好。她以前在巴黎住过。

    昨天是星期天，我去了她那儿。奶奶做午饭，我写练习。后来我们去公园散步，只说法语。奶奶讲了很多巴黎的事。晚上我们去剧院看了芭蕾。奶奶说：“多美的芭蕾啊！”可我想的不是芭蕾，而是巴黎。
  why: 第 1 题，第一句 [живёт в Москве́, в ти́хом райо́не]{.ru}。第 2 题，[Её кварти́ра ма́ленькая, но ую́тная]{.ru}；文中没说公寓旧。第 3 题，[Ра́ньше ба́бушка рабо́тала в шко́ле]{.ru}；她以前住在巴黎，不是中国，也没说住在别墅。第 4 题，[гуля́ли в па́рке и разгова́ривали то́лько по-францу́зски]{.ru}。第 5 题，最后一句 [ду́мала не о бале́те, а о Пари́же]{.ru}：[не …, а …]{.ru} 否定前一项、肯定后一项，尼娜想的是巴黎；说芭蕾好的是奶奶。只看到 [бале́т]{.ru} 就选“芭蕾”是没读懂这个句型（第 13 课）。
