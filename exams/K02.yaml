  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Да́ча**

    Да́ча — э́то дом и сад. Мно́гие в Москве́ живу́т в кварти́ре, а отдыха́ют на да́че. Да́ча ча́сто далеко́, но не о́чень.

    Дом на да́че ча́сто ста́рый и ма́ленький, но ую́тный. На да́че и отдыха́ют, и рабо́тают: рабо́тают в саду́, гуля́ют, чита́ют, гото́вят обе́д. Ве́чером на да́че всегда́ ве́село: там мно́го разгова́ривают и смо́трят футбо́л.

    Ра́ньше на да́че ча́сто жила́ ба́бушка. Она́ рабо́тала в саду́ и гото́вила обе́д, а семья́ там отдыха́ла.
    :::
  passage_zh: |
    **别墅**

    别墅就是一座房子加一个园子。很多莫斯科人住在城里的公寓里，到别墅去休息。别墅常常离城远，但不是很远。

    别墅的房子常常又旧又小，但是很舒适。在别墅里人们既休息，也干活：在园子里干活、散步、看书、做饭。晚上别墅里总是很热闹：大家聊很多天，一起看足球。

    以前常常是奶奶住在别墅里。她在园子里干活、做饭，一家人到那里休息。
  why: 第 1 题，第一句 [Да́ча — э́то дом и сад]{.ru}。第 2 题，[Мно́гие в Москве́ живу́т в кварти́ре, а отдыха́ют на да́че]{.ru}：住在公寓，到别墅休息。第 3 题，[Дом на да́че ча́сто ста́рый и ма́ленький, но ую́тный]{.ru}。第 4 题，[На да́че и отдыха́ют, и рабо́тают]{.ru}，用了 [и …, и …]{.ru}“既……又……”（第 15 课）。第 5 题，[Ра́ньше на да́че ча́сто жила́ ба́бушка]{.ru}。
  items:
  - stem: Да́ча — э́то ___.
    options: [большо́й го́род, ста́рый парк, но́вая кварти́ра, дом и сад]
    answer: дом и сад
  - stem: Мно́гие в Москве́ живу́т ___.
    options: [на да́че, в саду́, в кварти́ре, в общежи́тии]
    answer: в кварти́ре
  - stem: Дом на да́че ча́сто ___.
    options: [ста́рый и ма́ленький, но́вый и большо́й, ста́рый и большо́й, но́вый и ма́ленький]
    answer: ста́рый и ма́ленький
  - stem: На да́че ___.
