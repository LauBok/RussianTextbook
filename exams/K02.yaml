lesson: K02
heading: 第二套
range: L01-L19
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答是 [Му́рка, на́ша ко́шка]{.ru}，动物和人一样用 [кто]{.ru} 问（第 1 课）。第 2 题：[поликли́ника]{.ru} 和 [в]{.ru} 连用，表示处所用第六格 [в поликли́нике]{.ru}；[на]{.ru} 用于 [рабо́та, заво́д]{.ru} 这类词（第 11、12 课）。第 3 题：[ла́мпа]{.ru} 是阴性，代替它用 [она́]{.ru}（第 2、3 课）。第 4 题：同时对两个人说话用 [вы]{.ru}；[вас]{.ru} 只用在 [Как вас зову́т?]{.ru} 这样的句子里，不能做主语（第 4 课）。第 5 题：[ле́кция]{.ru} 和 [на]{.ru} 连用：[на ле́кции]{.ru}，和 [на уро́ке, на конце́рте]{.ru} 一样表示“在活动中”；[о, об]{.ru} 表示“关于”（第 12 课）。第 6 题：动词 [лежа́т]{.ru} 是复数，主语也必须是复数，只有 [карандаши́]{.ru} 是复数；[ш]{.ru} 后写 [и]{.ru}（第 5、7 课）。第 7 题：[о]{.ru} 后面用人称代词第六格，[ма́ма]{.ru} 是阴性，用 [о ней]{.ru}；[она́]{.ru} 是第一格，[её]{.ru} 不跟在 [о]{.ru} 后（第 13 课）。第 8 题：[больши́е]{.ru} 是复数；[го́род]{.ru} 的复数不规则，是 [города́]{.ru}；[дома́]{.ru} 是“房子”的复数，[до́ма]{.ru} 是“在家”，意思都不对（第 5 课）。第 9 题：问句主语是 [вы]{.ru}，[жить]{.ru} 变位加 [в]{.ru}：[живёте]{.ru}（第 14 课）。第 10 题：主语 [мы]{.ru}，[гуля́ем]{.ru}（第 6 课）。第 11 题：[говори́ть]{.ru} 后面用副词 [по-япо́нски]{.ru}；[япо́нский язы́к]{.ru} 用在 [знать, изуча́ть]{.ru} 后面（第 15 课）。第 12 题：主语 [вы]{.ru}，第二变位 [говори́те]{.ru}（第 7 课）。第 13 题：主语 [ле́кция]{.ru} 是阴性，[быть]{.ru} 过去时用 [была́]{.ru}；[быть]{.ru} 和放在后面的主语一致（第 16 课）。第 14 题：主语 [Му́рка]{.ru}（猫）是单数第三人称，[лежа́ть]{.ru} 第二变位：[лежи́т]{.ru}；[крова́ть]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，第六格是 [на крова́ти]{.ru}（第 7、11 课）。第 15 题：[ра́ньше]{.ru} 说的是过去，主语 [ба́бушка]{.ru} 是女性，用 [рабо́тала]{.ru}；[рабо́тает]{.ru} 是现在时（第 17 课）。第 16 题：[письмо́]{.ru} 是中性，问“谁的”用 [чьё]{.ru}；回答 [моё]{.ru} 也是中性（第 8 课）。第 17 题：[кварти́ра]{.ru} 是阴性，[в]{.ru} 后用第六格，形容词阴性第六格是 [но́вой]{.ru}；[но́вом]{.ru} 用于阳性和中性（第 18 课）。第 18 题：[Ива́н Серге́евич]{.ru} 用名字加父称称呼，要用尊称 [ваш]{.ru}；[газе́та]{.ru} 是阴性，用 [ва́ша]{.ru}（第 4、8 课）。第 19 题：[кни́ги]{.ru} 是复数，形容词用复数 [интере́сные]{.ru}（第 9 课）。第 20 题：[в]{.ru} 后用第六格，[ко́мната]{.ru} 是阴性，[тот]{.ru} 的阴性第六格是 [той]{.ru}；后半句的 [в э́той]{.ru} 也是同样的形式（第 19 课）。第 21 题：[зда́ние]{.ru} 是中性，用 [како́е]{.ru}（第 9、12 课）。第 22 题：回答是 [В ти́хом]{.ru}，[райо́н]{.ru} 是阳性，[в]{.ru} 后用第六格 [како́м]{.ru}；[како́й]{.ru} 是第一格（第 18、19 课）。第 23 题：[мо́ре]{.ru} 是中性，软变化形容词中性是 [си́нее]{.ru}（第 9、11 课）。第 24 题：听别人讲有趣的经历，回答 [Как интере́сно!]{.ru}“多有意思啊！”；[Спаси́бо, Пожа́луйста, Ничего́]{.ru} 都不是对这种话的回应（第 16 课）。第 25 题：[рома́н]{.ru} 前面是 [я]{.ru}，用 [чита́ю]{.ru}（第 6 课）。
  items:
  - stem: — ___ э́то? — Э́то Му́рка, на́ша ко́шка.
    options: [Что, Как, Где, Кто]
    answer: Кто
  - stem: Мари́я Никола́евна — врач, она́ рабо́тает ___.
    options: [в поликли́нике, на поликли́нике, в поликли́ника, поликли́ника]
    answer: в поликли́нике
  - stem: — А где моя́ ла́мпа? — Вот ___.
    options: [он, она́, оно́, они́]
    answer: она́
  - stem: А́нна и Ван Лэй, ___ сейча́с на уро́ке?
    options: [ты, вас, вы, он]
    answer: вы
  - stem: Студе́нты сейча́с ___ ле́кции.
    options: [на, в, о, об]
    answer: на
  - stem: На столе́ лежа́т ___.
    options: [каранда́ш, ру́чка, кни́га, карандаши́]
    answer: карандаши́
  - stem: — Ты ча́сто ду́маешь о ма́ме? — Да, я ча́сто ду́маю о ___.
    options: [нём, она́, ней, её]
    answer: ней
  - stem: Москва́ и Пеки́н — больши́е ___.
    options: [го́род, города́, дома́, до́ма]
    answer: города́
  - stem: — Где вы ___? — Мы живём в общежи́тии.
    options: [живёте, живёт, живу́т, живёшь]
    answer: живёте
  - stem: Ве́чером мы ___ в па́рке.
    options: [гуля́ют, гуля́ем, гуля́ете, гуля́ю]
    answer: гуля́ем
  - stem: Ю́ми говори́т ___.
    options: [япо́нский язы́к, япо́нский, по-япо́нски, япо́нская]
    answer: по-япо́нски
  - stem: Мари́я Никола́евна, вы ___ по-англи́йски?
    options: [говори́т, говоря́т, говори́м, говори́те]
    answer: говори́те
  - stem: Вчера́ ___ интере́сная ле́кция.
    options: [была́, был, бы́ло, бы́ли]
    answer: была́
  - stem: Му́рка ___ на крова́ти и спит.
    options: [лежа́т, лежи́т, лежу́, лежи́шь]
    answer: лежи́т
  - stem: Ра́ньше ба́бушка ___ в шко́ле.
    options: [рабо́тал, рабо́тали, рабо́тает, рабо́тала]
    answer: рабо́тала
  - stem: — ___ э́то письмо́? — Моё.
    options: [Чей, Чья, Чьё, Чьи]
    answer: Чьё
  - stem: Петро́вы живу́т в ___ кварти́ре.
    options: [но́вом, но́вая, но́вый, но́вой]
    answer: но́вой
  - stem: Ива́н Серге́евич, э́то ___ газе́та?
    options: [твоя́, ваш, ва́ша, ва́ше]
    answer: ва́ша
  - stem: Э́то ___ кни́ги.
    options: [интере́сный, интере́сные, интере́сная, интере́сное]
    answer: интере́сные
  - stem: В ___ ко́мнате живёт А́нна, а в э́той — Ми́ша.
    options: [той, том, та, тот]
    answer: той
  - stem: — ___ э́то зда́ние? — Э́то наш факульте́т.
    options: [Како́й, Како́е, Кака́я, Каки́е]
    answer: Како́е
  - stem: — В ___ райо́не вы живёте? — В ти́хом.
    options: [како́й, кака́я, каки́е, како́м]
    answer: како́м
  - stem: Мо́ре сего́дня ___.
    options: [си́нее, си́ний, си́няя, си́ние]
    answer: си́нее
  - stem: — Вчера́ я была́ в Большо́м теа́тре. — ___
    options: [Спаси́бо!, Пожа́луйста!, Как интере́сно!, Ничего́!]
    answer: Как интере́сно!
  - stem: — Что ты де́лаешь? — Я ___ рома́н.
    options: [чита́ю, чита́ет, чита́ешь, чита́ют]
    answer: чита́ю
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **На да́че**

    Меня́ зову́т Ван Лэй. Вчера́ бы́ло воскресе́нье, и мы (1) []{.blank} на да́че. Там (2) []{.blank} ба́бушка. Её дом (3) []{.blank}, но о́чень ую́тный.

    Ива́н Серге́евич и Ми́ша (4) []{.blank} в (5) []{.blank}, а Мари́я Никола́евна (6) []{.blank} обе́д. А́нна и я гуля́ли. Там большо́е (7) []{.blank} и ти́хий парк.

    Ба́бушка о́чень (8) []{.blank}. Ра́ньше она́ рабо́тала в (9) []{.blank}. Она́ немно́го говори́т (10) []{.blank} и мно́го (11) []{.blank} о Росси́и. Вчера́ она́ (12) []{.blank}: «Ван Лэй, како́й (13) []{.blank} го́род? Он (14) []{.blank}?» И я (15) []{.blank} о Пеки́не.

    Сего́дня я до́ма. Сейча́с я (16) []{.blank} письмо́. Ма́ма и па́па (17) []{.blank} в Пеки́не, и я ча́сто ду́маю о (18) []{.blank}. Я пишу́ о ба́бушке, о да́че и о (19) []{.blank} о́зере. Вчера́ бы́ло о́чень (20) []{.blank}!
    :::
  passage_zh: |
    **在别墅**

    我叫王磊。昨天是星期天，我们在别墅。奶奶住在那里。她的房子很旧，但是很舒适。

    伊万·谢尔盖耶维奇和米沙在园子里干活，玛丽亚·尼古拉耶夫娜做午饭。安娜和我去散步。那里有一个大湖和一个安静的公园。

    奶奶人很好。她以前在学校工作。她会说一点儿英语，对俄罗斯了解很多。昨天她问：“王磊，你的城市是什么样的？大吗？”我就讲了北京。

    今天我在家。现在我在写信。爸爸妈妈住在北京，我常常想念他们。我写奶奶，写别墅，还写那个安静的湖。昨天过得非常好！
  why: 第 1 空：主语 [мы]{.ru}，[вчера́]{.ru} 说的是过去，[быть]{.ru} 过去时复数 [бы́ли]{.ru}（第 16 课）。第 2 空：奶奶现在一直住在那里，用现在时；主语 [ба́бушка]{.ru} 是第三人称单数：[живёт]{.ru}（第 14 课）。第 3 空：[дом]{.ru} 是阳性，形容词第一格 [ста́рый]{.ru}；[ста́ром]{.ru} 是第六格，这里不在前置词后面（第 9 课）。第 4 空：两个人做主语，说的是昨天，过去时复数 [рабо́тали]{.ru}（第 17 课）。第 5 空：[сад]{.ru} 的第六格特殊：[в саду́]{.ru}，重音在词尾；[са́де]{.ru} 只用在 [о са́де]{.ru} 里（第 17 课）。第 6 空：主语 [Мари́я Никола́евна]{.ru} 是女性，过去时阴性 [гото́вила]{.ru}（第 17 课）。第 7 空：[большо́е]{.ru} 是中性，四个词里只有 [о́зеро]{.ru} 是中性（第 3、9 课）。第 8 空：[ба́бушка]{.ru} 是阴性，形容词作谓语用阴性 [до́брая]{.ru}；[до́брой]{.ru} 是第六格（第 9、16 课）。第 9 空：[в]{.ru} 表示处所，用第六格 [шко́ле]{.ru}（第 11 课）。第 10 空：[говори́ть]{.ru} 后面用副词 [по-англи́йски]{.ru}（第 15 课）。第 11 空：前面是现在时 [говори́т]{.ru}，说的是她现在的情况，主语是第三人称单数：[зна́ет]{.ru}（第 6 课）。第 12 空：[вчера́]{.ru} 说的是过去，主语 [она́]{.ru}，过去时阴性 [спра́шивала]{.ru}（第 13、17 课）。第 13 空：[го́род]{.ru} 是阳性，用 [твой]{.ru}（第 8 课）。第 14 空：[он]{.ru} 指 [го́род]{.ru}，形容词阳性 [большо́й]{.ru}（第 9 课）。第 15 空：开头说了 [Меня́ зову́т Ван Лэй]{.ru}，“我”是男性，说的是昨天，过去时阳性 [расска́зывал]{.ru}（第 13、17 课）。第 16 空：[сейча́с]{.ru} 用现在时，[писа́ть]{.ru} 的 [с]{.ru} 变成 [ш]{.ru}，第一人称 [пишу́]{.ru}（第 14 课）。第 17 空：两个人做主语，[живу́т]{.ru}（第 14 课）。第 18 空：[о]{.ru} 后面用人称代词第六格，指 [ма́ма и па́па]{.ru}，用复数 [о них]{.ru}（第 13 课）。第 19 空：[о́зеро]{.ru} 是中性，[о]{.ru} 后用第六格，形容词中性第六格 [ти́хом]{.ru}（第 18 课）。第 20 空：[бы́ло]{.ru} 后面要用副词 [хорошо́]{.ru}，形容词 [хоро́ший]{.ru} 的各个形式都不能这样用（第 4、16 课）。
  items:
  - options: [был, бы́ло, бы́ли, была́]
    answer: бы́ли
  - options: [живу́т, живёт, живёте, живём]
    answer: живёт
  - options: [ста́рая, ста́ром, ста́рой, ста́рый]
    answer: ста́рый
  - options: [рабо́тал, рабо́тали, рабо́тала, рабо́тает]
    answer: рабо́тали
  - options: [са́де, сад, саду́, са́да]
    answer: саду́
  - options: [гото́вила, гото́вил, гото́вили, гото́вит]
    answer: гото́вила
  - options: [река́, го́род, у́лица, о́зеро]
    answer: о́зеро
  - options: [до́брая, до́брый, до́брое, до́брой]
    answer: до́брая
  - options: [шко́ла, шко́лу, шко́ле, шко́лы]
    answer: шко́ле
  - options: [англи́йский, англи́йский язы́к, англи́йская, по-англи́йски]
    answer: по-англи́йски
  - options: [зна́ют, зна́ет, зна́ешь, зна́ем]
    answer: зна́ет
  - options: [спра́шивал, спра́шивали, спра́шивает, спра́шивала]
    answer: спра́шивала
  - options: [твоя́, твой, твоё, твои́]
    answer: твой
  - options: [большо́й, больша́я, большо́е, больши́е]
    answer: большо́й
  - options: [расска́зывала, расска́зывали, расска́зывал, расска́зываю]
    answer: расска́зывал
  - options: [пи́шет, пишу́, пи́шут, пи́шешь]
    answer: пишу́
  - options: [живу́т, живёт, живём, живёте]
    answer: живу́т
  - options: [ней, нём, них, они́]
    answer: них
  - options: [ти́хой, ти́хий, ти́хая, ти́хом]
    answer: ти́хом
  - options: [хорошо́, хоро́шее, хоро́ший, хоро́шая]
    answer: хорошо́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ю́ми**

    Ю́ми — студе́нтка. Её роди́тели живу́т в Япо́нии, а она́ сейча́с живёт в Москве́, в общежи́тии. Её ко́мната ма́ленькая, но све́тлая.

    Ю́ми изуча́ет ру́сский язы́к. Она́ хорошо́ чита́ет по-ру́сски, но говори́т ещё ме́дленно. На уро́ке она́ мно́го слу́шает и пи́шет.

    В Москве́ живёт её ру́сская подру́га. Ра́ньше подру́га жила́ в Япо́нии, и тепе́рь она́ хорошо́ говори́т по-япо́нски.

    Вчера́ Ю́ми и подру́га бы́ли в музе́е, а пото́м гуля́ли в па́рке. Там они́ говори́ли то́лько по-ру́сски. Подру́га говори́ла ме́дленно, и Ю́ми всё понима́ла.

    Ве́чером Ю́ми была́ до́ма. Она́ писа́ла письмо́ о Москве́, о музе́е и о подру́ге.
    :::
  passage_zh: |
    **由美**

    由美是大学生。她的父母住在日本，她现在住在莫斯科，住在宿舍里。她的房间不大，但是很明亮。

    由美学俄语。她俄语读得很好，但说得还慢。上课时她听得多，写得也多。

    她的一个俄罗斯女朋友住在莫斯科。这位朋友以前住在日本，所以现在日语说得很好。

    昨天由美和朋友去了博物馆，后来在公园散步。在那里她们只说俄语。朋友说得慢，由美全都听懂了。

    晚上由美在家。她写了一封信，写莫斯科、博物馆和她的朋友。
  why: 第 1 题，[она́ сейча́с живёт в Москве́, в общежи́тии]{.ru}；住在日本的是她的父母。第 2 题，[говори́т ещё ме́дленно]{.ru}；[хорошо́]{.ru} 说的是她读俄语。第 3 题，[Ра́ньше подру́га жила́ в Япо́нии]{.ru}；她现在住在莫斯科。第 4 题，[бы́ли в музе́е, а пото́м гуля́ли в па́рке]{.ru}。第 5 题，[Она́ писа́ла письмо́]{.ru}；去博物馆和公园是白天的事。
  items:
  - stem: Сейча́с Ю́ми живёт ___.
    options: [в Япо́нии, в семье́, в це́нтре, в общежи́тии]
    answer: в общежи́тии
  - stem: Ю́ми говори́т по-ру́сски ___.
    options: [бы́стро, отли́чно, ме́дленно, о́чень пло́хо]
    answer: ме́дленно
  - stem: Ра́ньше подру́га жила́ ___.
