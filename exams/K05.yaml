- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Письмо́ домо́й**

    За́втра у нас (1) []{.blank} (быть) ва́жный семина́р. Он (2) []{.blank} (начина́ться) в де́вять часо́в. В понеде́льник О́льга Ви́кторовна сказа́ла: «(3) []{.blank} (прочита́ть), пожа́луйста, расска́з Толсто́го». Вчера́ ве́чером я (4) []{.blank} (чита́ть) расска́з два часа́, а сего́дня у́тром наконе́ц (5) []{.blank} (прочита́ть) его́. Э́то расска́з о ма́льчике и о (6) []{.blank} (ста́рая ру́сская шко́ла).

    Сейча́с я (7) []{.blank} (писа́ть) письмо́ домо́й. Я пишу́ о (8) []{.blank} (на́ша гру́ппа) и о семина́ре. Роди́тели всегда́ (9) []{.blank} (спра́шивать) о Москве́. А (10) []{.blank} (пе́рвое ноября́) у ма́мы день рожде́ния, и э́то письмо́ — мой пода́рок.
    :::
  passage_zh: |
    **给家里写信**

    明天我们有一个重要的讨论课。九点开始。星期一奥尔加·维克托罗夫娜说：“请大家读完托尔斯泰的小说。”昨天晚上我读了两个小时，今天早上终于读完了。这是一篇讲一个小男孩和一所旧时俄罗斯学校的小说。

    现在我在给家里写信。我写我们班，写讨论课。父母总是问莫斯科的情况。十一月一日是妈妈的生日，这封信就是我的礼物。
  why: 第 1 空：[за́втра]{.ru} 说的是将来，[семина́р]{.ru} 是单数，[быть]{.ru} 的将来时 [бу́дет]{.ru}（第 41 课）。第 2 空：排定的日程常用现在时表示将来，[-ся]{.ru} 动词第三人称单数 [начина́ется]{.ru}（第 38、41 课）。第 3 空：老师对全班说话，用复数命令式；[прочита́ть]{.ru} 的词干以元音结尾，加 [-й]{.ru}，再加 [-те]{.ru}：[Прочита́йте]{.ru}（第 46 课）。第 4 空：[два часа́]{.ru} 表示动作持续的时间，只能用未完成体：[чита́л]{.ru}；文中看不出写信人是男是女，女性写 [чита́ла]{.ru} 也对（第 42 课）。第 5 空：[наконе́ц]{.ru} 表示终于有了结果，用完成体过去时 [прочита́л]{.ru}（女性写 [прочита́ла]{.ru}）（第 42 课）。第 6 空：[о]{.ru} + 第六格，阴性形容词和名词都变：[ста́рой ру́сской шко́ле]{.ru}（第 18 课）。第 7 空：[сейча́с]{.ru} 用现在时，[писа́ть]{.ru} 的 [с]{.ru} 变 [ш]{.ru}：[пишу́]{.ru}（第 14 课）。第 8 空：[о]{.ru} + 第六格，[на́шей гру́ппе]{.ru}（第 19 课）。第 9 空：[всегда́]{.ru} 表示经常的动作，用未完成体；主语复数，现在时 [спра́шивают]{.ru}，说过去的情况用 [спра́шивали]{.ru} 也对（第 13、45 课）。第 10 空：“在几号”，序数词和月份都用第二格，不加前置词：[пе́рвого ноября́]{.ru}（第 49 课）。
  items:
  - accept: [бу́дет]
  - accept: [начина́ется]
  - accept: [Прочита́йте]
  - accept: [чита́л, чита́ла]
  - accept: [прочита́л, прочита́ла]
  - accept: [ста́рой ру́сской шко́ле]
  - accept: [пишу́]
  - accept: [на́шей гру́ппе]
  - accept: [спра́шивают, спра́шивали]
  - accept: [пе́рвого ноября́]
