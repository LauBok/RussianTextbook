  - {ru: от кварти́ры, zh: （钥匙）公寓的}
  passage_zh: |
    **包落在公共汽车上了！**

    昨天，3 月 5 日晚上，我把包落在了 15 路公共汽车上。那是八点钟，在“公园”站。

    包是黑色的，旧的。里面有我的词典——没有这本词典我没法学习，可星期五我有测验。里面还有家里的钥匙，所以现在我住在姐姐家。

    也许您看见过这个包？请打电话：8-916-245-17-30。

    莉达，一年级学生
  why: 第 1 空：“在哪一天”，序数词用第二格：[пя́того ма́рта]{.ru}；放在 [Вчера́]{.ru} 后面作补充说明，仍然回答“在哪一天”，不能写成回答“今天几号”的第一格 [пя́тое]{.ru}（第 49 课）。第 2 空：说的是昨天，用过去时；写启事的是莉达，女性，过去时用阴性：[забы́ла]{.ru}；写成 [забы́л]{.ru} 是只看动词、没看落款（第 17、47 课）。第 3 空：[в]{.ru} + 第六格表示在哪里：[в авто́бусе]{.ru}（第 11 课）。第 4 空：“在几点”用 [в]{.ru} + 第四格，[во́семь]{.ru} 的第四格和第一格同形，后面接 [часо́в]{.ru}：[во́семь часо́в]{.ru}；[часа́]{.ru} 只用于 2–4（第 28、47 课）。第 5 空：[без]{.ru} 要求第二格，[он]{.ru} 的第二格是 [его́]{.ru}，用在前置词后面要加 [н-]{.ru}：[без него́]{.ru}；写成 [без его́]{.ru} 是常见错误（第 31、37 课）。第 6 空：“在星期几”用 [в]{.ru} + 第四格：[пя́тницу]{.ru}；不要因为 [в]{.ru} 写成第六格 [пя́тнице]{.ru}（第 29 课）。第 7 空：[сейча́с]{.ru} 用现在时，第一人称 [живу́]{.ru}，词干有 [в]{.ru}（第 14 课）。第 8 空：[у]{.ru} + 第二格表示“在某人家里”：[у сестры́]{.ru}，重音在词尾（第 31、37 课）。第 9 空：启事是写给不认识的读者的，用 [вы]{.ru} 的命令式：[Звони́те]{.ru}；[Звони́]{.ru} 是对 [ты]{.ru} 说的。完成体 [Позвони́те]{.ru} 母语者也常这样写，同样算对（第 46 课）。第 10 空：“几年级的学生”用第二格：[пе́рвого ку́рса]{.ru}，形容词阳性第二格 [-ого]{.ru}（第 33、34 课）。
