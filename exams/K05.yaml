    ::: {.prose lang="ru"}
    **Электри́чка**

    В суббо́ту на́ша гру́ппа е́хала на экску́рсию в Се́ргиев Поса́д. Электри́чка была́ в семь часо́в утра́. В пя́тницу Дени́с ду́мал: «За́втра я вста́ну в шесть». Но ве́чером он до́лго смотре́л фильм и встал то́лько в семь. Он опозда́л на электри́чку.

    Тут Дени́су позвони́л преподава́тель: «Дени́с, ты где?» — «Я опозда́л на электри́чку!» — «Ничего́! Друга́я электри́чка бу́дет че́рез час. Мы бу́дем ждать тебя́ о́коло ла́вры».

    В электри́чке Дени́с два часа́ чита́л кни́гу о ла́вре. В де́сять часо́в он был о́коло ла́вры. Гру́ппа уже́ ждала́ его́ там.

    Экскурсово́д расска́зывал о ла́вре, но мно́гие студе́нты понима́ли его́ пло́хо: он говори́л о́чень бы́стро. А Дени́с всё по́нял. Пото́м студе́нты спра́шивали Дени́са, и он всё объясни́л.

    Ве́чером преподава́тель сказа́л: «Дени́с, ты опозда́л, но ты молоде́ц!»
    :::
  glossary:
  - {ru: позвони́л, zh: 打来电话（过去时）}
  passage_zh: |
    **电气火车**

    星期六我们班去谢尔吉耶夫镇参观。电气火车早上七点开。星期五杰尼斯想：“明天我六点起床。”可是晚上他看了很久的电影，七点才起床。他没赶上火车。

    这时老师给杰尼斯打来电话：“杰尼斯，你在哪儿？”——“我没赶上火车！”——“没关系！一小时以后还有一趟车。我们在大修道院旁边等你。”

    在火车上杰尼斯看了两个小时的书，是一本介绍大修道院的书。十点他到了大修道院旁边，全班已经在那里等他了。

    讲解员介绍大修道院，可是很多同学听不太懂：他说得太快了。而杰尼斯全都听懂了。后来同学们问杰尼斯，他把什么都解释清楚了。

    晚上老师说：“杰尼斯，你迟到了，可你真棒！”
  why: 第 1 题，[Электри́чка была́ в семь часо́в утра́]{.ru}；六点是杰尼斯打算起床的时间，七点他才起来。第 2 题，[Но ве́чером он до́лго смотре́л фильм и встал то́лько в семь]{.ru}；介绍大修道院的书是他第二天在火车上看的。第 3 题，老师说 [Мы бу́дем ждать тебя́ о́коло ла́вры]{.ru}，后面又说 [Гру́ппа уже́ ждала́ его́ там]{.ru}。第 4 题，[он говори́л о́чень бы́стро]{.ru}。第 5 题要推断：文中没有直接说原因，但前面交代了他在火车上看了两个小时介绍大修道院的书，所以讲解员说得快他也能听懂；讲解员并没有说得慢，老师也没有讲解，文中没说他以前来过。
