lesson: K05
heading: 第五套
range: L01-L49
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：猫是动物，问动物和问人一样用 [кто]{.ru}，不用 [что]{.ru}（第 1 课）。第 2 题：[за́втра]{.ru} 说的是将来，主语 [Ми́ша]{.ru} 是第三人称单数，用 [бу́дет]{.ru} + 不定式；[был]{.ru} 是过去时（第 41 课）。第 3 题：[кре́сло]{.ru} 以 [-о]{.ru} 结尾，是中性，用 [моё]{.ru}（第 3 课）。第 4 题：回答 [Да, вот оно́]{.ru} 说明信已经写好了，问的是结果，用完成体过去时 [написа́ла]{.ru}；[писа́ла]{.ru} 只说做没做过这件事，不管写完没有（第 42 课）。第 5 题：[в]{.ru} + 第六格，[-ие]{.ru} 结尾的名词第六格是 [-ии]{.ru}：[в общежи́тии]{.ru}（第 12 课）。第 6 题：[за́втра]{.ru} 表示将来，又要把练习做完，用完成体将来时 [сде́лаю]{.ru}；[сде́лает]{.ru} 是第三人称，[сде́лал, де́лал]{.ru} 是过去时（第 43 课）。第 7 题：[о]{.ru} 要求第六格：[о Кита́е]{.ru}（第 13 课）。第 8 题：问“我的词典在哪儿”，回答“米沙拿走了”，词典现在不在原处，是动作的结果，用完成体 [взял]{.ru}；[брал]{.ru} 表示拿过（又还回来了），[возьмёт, берёт]{.ru} 不是已经发生的事（第 44 课）。第 9 题：[вчера́]{.ru} 用过去时，主语 [мы]{.ru}，用复数 [гуля́ли]{.ru}（第 17 课）。第 10 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ет]{.ru}；[ку́пит, ку́пят]{.ru} 是完成体，不能和 [ка́ждое у́тро]{.ru} 连用，[купи́л]{.ru} 是一次的动作（第 45 课）。第 11 题：[на]{.ru} + 第六格，[заво́д]{.ru} 是阳性，形容词第六格 [большо́м]{.ru}（第 12、18 课）。第 12 题：对老师要用 [вы]{.ru} 的命令式 [повтори́те]{.ru}；[повтори́]{.ru} 是对 [ты]{.ru} 说的（第 46 课）。第 13 题：[знать]{.ru} 后用第四格，名字和父称都要变：[Мари́ю Никола́евну]{.ru}（第 22 课）。第 14 题：“几点做某事”用 [в]{.ru} + 钟点：[в два часа́]{.ru}；没有 [в]{.ru} 的 [два часа́]{.ru} 不能作时间状语，[два часа́ наза́д]{.ru} 和现在时 [начина́ется]{.ru} 不搭配（第 47 课）。第 15 题：[сейча́с]{.ru} 说的是此刻朝一个方向去，用定向动词 [идёшь]{.ru}；[хо́дишь]{.ru} 表示经常去（第 24、25 课）。第 16 题：“过多久以后”用 [че́рез]{.ru} + 第四格：[че́рез полчаса́]{.ru}；[наза́д]{.ru} 放在时间词组后面，表示“以前”（第 47 课）。第 17 题：主语 [Ми́ша]{.ru}，[люби́ть]{.ru} 第三人称单数 [лю́бит]{.ru}；只有第一人称单数加 [л]{.ru}（第 26 课）。第 18 题：“在几月”用 [в]{.ru} + 第六格：[в сентябре́]{.ru}，重音移到词尾（第 48 课）。第 19 题：“在星期几”用 [в]{.ru} + 第四格，[четве́рг]{.ru} 是阳性非动物名词，第四格同第一格（第 29 课）。第 20 题：“在几号”，序数词和月份都用第二格，不加前置词：[пя́того ию́ня]{.ru}；[пя́тое ию́ня]{.ru} 回答“今天几号”（第 49 课）。第 21 题：表示人不在某处用 [нет]{.ru} + 第二格：[А́нны нет до́ма]{.ru}（第 32 课）。第 22 题：[два́дцать]{.ru} 后面用复数第二格，[челове́к]{.ru} 的复数第二格和单数第一格同形（第 35 课）。第 23 题：回答是 [учу́сь]{.ru}，问句主语 [ты]{.ru}，用 [у́чишься]{.ru}；[у́чишь]{.ru} 没有 [-ся]{.ru}，要带宾语（第 38 课）。第 24 题：数词最后一个词是 [оди́н]{.ru}，用单数第一格 [рубль]{.ru}（第 39 课）。第 25 题：[Ско́лько с меня́?]{.ru} 问“我该付多少钱”，回答钱数（第 39 课）。
  items:
  - stem: — ___ э́то? — Э́то на́ша ко́шка Му́рка.
    options: [Что, Чья, Где, Кто]
    answer: Кто
  - stem: За́втра Ми́ша ___ игра́ть в футбо́л в па́рке.
    options: [бу́дет, бу́дут, бу́дешь, был]
    answer: бу́дет
  - stem: — Ма́ма, где ___ кре́сло? — В твое́й ко́мнате.
    options: [мой, моё, моя́, мои́]
    answer: моё
  - stem: — А́нна, ты уже́ ___ письмо́? — Да, вот оно́.
    options: [писа́ла, пи́шешь, написа́ла, напи́шешь]
    answer: написа́ла
  - stem: Наш друг Пьер живёт в ___.
    options: [общежи́тии, общежи́тие, общежи́тия, общежи́тием]
    answer: общежи́тии
  - stem: Сего́дня я не сде́лал упражне́ние, но за́втра ___ его́.
    options: [сде́лал, де́лал, сде́лает, сде́лаю]
    answer: сде́лаю
  - stem: Ван Лэй ча́сто расска́зывает о ___.
    options: [Кита́й, Кита́я, Кита́е, Кита́ю]
    answer: Кита́е
  - stem: — Где мой слова́рь? — Его́ ___ Ми́ша.
    options: [брал, взял, возьмёт, берёт]
    answer: взял
  - stem: Вчера́ мы до́лго ___ в па́рке.
    options: [гуля́ли, гуля́л, гуля́ла, гуля́ем]
    answer: гуля́ли
  - stem: Ка́ждое у́тро Ван Лэй ___ газе́ту.
    options: [ку́пит, покупа́ет, купи́л, ку́пят]
    answer: покупа́ет
  - stem: Ива́н Серге́евич рабо́тает на ___ заво́де.
    options: [большо́й, большо́го, большу́ю, большо́м]
    answer: большо́м
  - stem: О́льга Ви́кторовна, ___, пожа́луйста, э́то сло́во ещё раз.
    options: [повтори́, повтори́ть, повтори́те, повтори́л]
    answer: повтори́те
  - stem: — Вы зна́ете ___? — Да, она́ врач.
    options: [Мари́ю Никола́евну, Мари́я Никола́евна, Мари́и Никола́евны, Мари́ей Никола́евной]
    answer: Мари́ю Никола́евну
  - stem: Сего́дня уро́к начина́ется ___.
    options: [два часа́ наза́д, два часа́, на два часа́, в два часа́]
    answer: в два часа́
  - stem: — Куда́ ты сейча́с ___? — В апте́ку.
    options: [хо́дишь, идёшь, иду́, ходи́ть]
    answer: идёшь
  - stem: Я бу́ду до́ма ___ полчаса́.
    options: [наза́д, в, че́рез, до]
    answer: че́рез
  - stem: Ми́ша о́чень ___ игра́ть в футбо́л.
    options: [люблю́, лю́бят, лю́бишь, лю́бит]
    answer: лю́бит
  - stem: У Ю́ми день рожде́ния ___.
    options: [в сентя́брь, в сентябре́, сентября́, на сентябре́]
    answer: в сентябре́
  - stem: ___ мы бы́ли в Большо́м теа́тре.
    options: [В четве́рг, В четверге́, Четве́рг, На четве́рг]
    answer: В четве́рг
  - stem: На́ша контро́льная рабо́та бу́дет ___.
    options: [пя́тое ию́ня, в пя́тое ию́ня, пя́того ию́ня, в пя́том ию́не]
    answer: пя́того ию́ня
  - stem: Сего́дня ве́чером ___ нет до́ма.
    options: [А́нна, А́нну, А́нны, А́нне]
    answer: А́нны
  - stem: В на́шей гру́ппе два́дцать ___.
    options: [челове́ка, лю́ди, люде́й, челове́к]
    answer: челове́к
  - stem: — Где ты ___? — Я учу́сь в МГУ.
    options: [у́чишься, у́чишь, у́чится, учи́ться]
    answer: у́чишься
  - stem: Э́тот слова́рь сто́ит девяно́сто оди́н ___.
    options: [рубля́, рубль, рубле́й, рубли́]
    answer: рубль
  - stem: — Ско́лько с меня́? — ___
    options: [Я из Кита́я., Два часа́., Пять челове́к., Сто рубле́й.]
    answer: Сто рубле́й.
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Мой день рожде́ния**

    Сего́дня (1) []{.blank} ма́я. У меня́ день рожде́ния, мой (2) []{.blank} день рожде́ния в Москве́.

    У́тром я (3) []{.blank} ра́но и (4) []{.blank} домо́й, в Пеки́н. Мы до́лго (5) []{.blank}: ма́ма и па́па спра́шивали о Москве́, об университе́те и о (6) []{.blank} ру́сской семье́.

    Пото́м я был в университе́те. По́сле (7) []{.blank} Пьер и Ю́ми (8) []{.blank} большо́й торт, и мы (9) []{.blank} чай в аудито́рии. Ю́ми сказа́ла: «Ван Лэй, (10) []{.blank} пе́рвый кусо́к!»

    Сейча́с пять часо́в, я до́ма. Мари́я Никола́евна сейча́с (11) []{.blank} у́жин. Ве́чером у нас (12) []{.blank} пра́здник. Он начнётся в семь (13) []{.blank}, (14) []{.blank} два часа́.

    А́нна ещё в (15) []{.blank}. Она́ звони́ла (16) []{.blank} и сказа́ла: «Я ско́ро бу́ду до́ма!» Ми́ша то́же звони́л: «Ван Лэй, я ещё не (17) []{.blank} пода́рок. Я куплю́ его́ сего́дня. Э́то бу́дет но́вая (18) []{.blank} игра́!»

    Я о́чень люблю́ (19) []{.blank} семью́. Сего́дня о́чень (20) []{.blank} день!
    :::
  passage_zh: |
    **我的生日**

    今天是五月十二号。今天是我的生日，是我在莫斯科过的第一个生日。

    早上我很早就起来了，往北京家里打了电话。我们聊了很久：爸爸妈妈问了莫斯科，问了大学，还问了我的俄罗斯家庭。

    后来我去了学校。下课以后皮埃尔和由美买了一个大蛋糕，我们在教室里喝茶。由美说：“王磊，你拿第一块！”

    现在五点，我在家。玛丽亚·尼古拉耶夫娜正在做晚饭。晚上我们要庆祝。七点开始，还有两个小时。

    安娜还在图书馆。她一小时前打来电话，说：“我很快就到家！”米沙也打来电话：“王磊，礼物我还没买好。我今天就去买。是一个新的电脑游戏！”

    我很爱这一家人。今天真是个好日子！
  why: 第 1 空：回答“今天几号”，序数词用中性第一格（和省去的 [число́]{.ru} 一致），月份用第二格：[двена́дцатое ма́я]{.ru}；[двена́дцатого]{.ru} 用来回答“在几号”（第 49 课）。第 2 空：“第一个”用序数词，和 [день]{.ru} 一致，用阳性 [пе́рвый]{.ru}；基数词 [оди́н]{.ru} 不表示次序（第 48 课）。第 3 空：[у́тром … ра́но]{.ru} 说的是今天早上已经发生的一次动作，主语是 [я]{.ru}（王磊），用完成体过去时阳性 [встал]{.ru}；[вста́ну]{.ru} 是将来时（第 44 课）。第 4 空：和 [встал]{.ru} 并列，说话人是男性，用过去时阳性 [звони́л]{.ru}（第 8、17 课）。第 5 空：[до́лго]{.ru} 表示动作持续了很久，用未完成体；主语 [мы]{.ru}，过去时复数 [разгова́ривали]{.ru}（第 17、42 课）。第 6 空：[о]{.ru} + 第六格，[семья́]{.ru} 是阴性，物主代词阴性第六格 [мое́й]{.ru}，和后面的 [ру́сской]{.ru} 一致（第 19 课）。第 7 空：[по́сле]{.ru} 要求第二格，[ле́кция → ле́кции]{.ru}（第 37 课）。第 8 空：说的是已经发生的一次具体动作（买来了蛋糕，接着一起喝茶），主语是两个人，用完成体过去时复数 [купи́ли]{.ru}；[ку́пят]{.ru} 是将来时，[покупа́ют]{.ru} 是现在时（第 44、45 课）。第 9 空：主语 [мы]{.ru}，说的是今天已经发生的事，用过去时复数 [пи́ли]{.ru}（第 17、21 课）。第 10 空：由美叫的是王磊一个人，同学之间用 [ты]{.ru}，命令式单数 [возьми́]{.ru}；[возьми́те]{.ru} 是对 [вы]{.ru} 说的（第 44、46 课）。第 11 空：[сейча́с]{.ru} 说的是正在进行的动作，用未完成体现在时，主语是第三人称单数：[гото́вит]{.ru}（第 7 课）。第 12 空：[ве́чером]{.ru} 指今天晚上，是将来的事，[пра́здник]{.ru} 是单数，用 [бу́дет]{.ru}（第 41 课）。第 13 空：[семь]{.ru} 后面用 [часо́в]{.ru}（第 28、47 课）。第 14 空：现在五点，七点开始，“再过两个小时”用 [че́рез два часа́]{.ru}；[два часа́ наза́д]{.ru} 是“两小时以前”，[в два часа́]{.ru} 是“两点钟”，都和上下文矛盾（第 47 课）。第 15 空：[в]{.ru} + 第六格表示处所：[в библиоте́ке]{.ru}（第 11 课）。第 16 空：[звони́ла]{.ru} 是过去的事，“一小时以前”说 [час наза́д]{.ru}；[че́рез час]{.ru} 表示“过一小时以后”（第 47 课）。第 17 空：[ещё не]{.ru} + 完成体过去时表示“还没做成”，主语 [я]{.ru} 是米沙，用阳性 [купи́л]{.ru}；后一句 [куплю́]{.ru} 才说将来（第 42、44 课）。第 18 空：[игра́]{.ru} 是阴性第一格，形容词用 [компью́терная]{.ru}，和前面的 [но́вая]{.ru} 一致（第 9 课）。第 19 空：[люби́ть]{.ru} 后用第四格，[семья́ → семью́]{.ru}，指示代词阴性第四格 [э́ту]{.ru}（第 21、26 课）。第 20 空：[день]{.ru} 是阳性，形容词用 [хоро́ший]{.ru}；[хорошо́]{.ru} 是副词，不能修饰名词（第 9 课）。
  items:
  - options: [двена́дцатого, двена́дцатое, двена́дцать, двена́дцатый]
    answer: двена́дцатое
  - options: [пе́рвый, пе́рвая, пе́рвое, оди́н]
    answer: пе́рвый
  - options: [вста́ну, вста́ла, встал, вста́ли]
    answer: встал
  - options: [звони́ла, звони́л, звоню́, звони́ть]
    answer: звони́л
  - options: [разгова́ривал, разгова́риваем, разгова́ривали, разгова́ривать]
    answer: разгова́ривали
  - options: [мое́й, моя́, мою́, моём]
    answer: мое́й
  - options: [ле́кция, ле́кцию, ле́кцией, ле́кции]
    answer: ле́кции
  - options: [купи́ли, покупа́ют, ку́пят, купи́л]
    answer: купи́ли
  - options: [пьём, пил, бу́дем пить, пи́ли]
    answer: пи́ли
  - options: [возьми́те, возьми́, взять, взяла́]
    answer: возьми́
  - options: [гото́вила, гото́вят, гото́вит, гото́вить]
    answer: гото́вит
  - options: [бу́дет, был, бу́дут, бу́ду]
    answer: бу́дет
  - options: [часа́, час, часо́в, часы́]
    answer: часо́в
  - options: [наза́д, че́рез, в, до]
    answer: че́рез
  - options: [библиоте́ку, библиоте́ки, библиоте́ка, библиоте́ке]
    answer: библиоте́ке
  - options: [час наза́д, че́рез час, на час, ча́сом]
    answer: час наза́д
  - options: [куплю́, покупа́ю, купи́л, ку́пит]
    answer: купи́л
  - options: [компью́терную, компью́терная, компью́терной, компью́терный]
    answer: компью́терная
  - options: [э́та, э́той, э́тот, э́ту]
    answer: э́ту
  - options: [хоро́шая, хоро́ший, хоро́шее, хорошо́]
    answer: хоро́ший
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Контро́льная рабо́та**

    В пя́тницу учи́тель сказа́л: «В понеде́льник у нас бу́дет контро́льная рабо́та». Но в суббо́ту Ми́ша не занима́лся: у́тром он игра́л в футбо́л, а ве́чером до́лго игра́л в компью́терную игру́. Он ду́мал: «Я всё сде́лаю в воскресе́нье».

    В воскресе́нье у́тром ма́ма спроси́ла: «Ми́ша, ты уже́ сде́лал уро́ки?» — «Ещё нет. Я сде́лаю их ве́чером. Че́стное сло́во!» — отве́тил Ми́ша. Но днём он опя́ть был в па́рке: там игра́ли в футбо́л его́ друзья́.

    Ве́чером Ми́ша наконе́ц откры́л кни́гу. Упражне́ния бы́ли о́чень тру́дные. Ми́ша де́лал их час, но сде́лал то́лько полови́ну. Тогда́ он сказа́л: «Ван Лэй, объясни́, пожа́луйста!» Ван Лэй объясни́л, и Ми́ша всё по́нял. Втору́ю полови́ну он сде́лал уже́ бы́стро. Уро́ки он зако́нчил то́лько в оди́ннадцать часо́в.

    В понеде́льник контро́льная рабо́та была́ не о́чень тру́дная, и Ми́ша написа́л её хорошо́. До́ма он сказа́л: «Тепе́рь я бу́ду занима́ться ка́ждый день!» Ма́ма отве́тила: «Молоде́ц! А в суббо́ту ты опя́ть бу́дешь игра́ть в футбо́л?»
    :::
  passage_zh: |
    **测验**

    星期五老师说：“星期一我们要测验。”可是星期六米沙没有学习：上午他踢足球，晚上又玩了很久的电脑游戏。他想：“星期天我全都能做完。”

    星期天早上妈妈问：“米沙，你功课做完了吗？”“还没有。晚上做完。说话算数！”米沙回答。可是下午他又去了公园：他的朋友们在那里踢足球。

    晚上米沙终于打开了书。练习很难。米沙做了一个小时，只做完了一半。于是他说：“王磊，请给我讲讲！”王磊讲了，米沙全都懂了。后一半他做得已经很快了。他一直到十一点才把功课做完。

    星期一的测验不太难，米沙考得很好。回到家他说：“从现在起我每天都要学习！”妈妈回答：“真棒！那星期六你还踢不踢足球了？”
  why: 第 1 题，第一句 [В пя́тницу учи́тель сказа́л…]{.ru}；测验本身在星期一。第 2 题，[а ве́чером до́лго игра́л в компью́терную игру́]{.ru}；踢足球是星期六上午。第 3 题，妈妈问功课做完没有，米沙回答 [Ещё нет]{.ru}，所以星期天早上他还没有做完功课。第 4 题，星期天晚上他才打开书，到十一点做完；星期天上午、下午他都没做。第 5 题，米沙说 [Тепе́рь я бу́ду занима́ться ка́ждый день!]{.ru}；妈妈的话是在开玩笑，怀疑他做不到，不是米沙的打算。
  items:
  - stem: О контро́льной рабо́те учи́тель сказа́л ___.
    options: [в пя́тницу, в суббо́ту, в воскресе́нье, в понеде́льник]
    answer: в пя́тницу
  - stem: В суббо́ту ве́чером Ми́ша ___.
    options: [игра́л в футбо́л, де́лал уро́ки, игра́л в компью́терную игру́, писа́л контро́льную рабо́ту]
    answer: игра́л в компью́терную игру́
  - stem: В воскресе́нье у́тром Ми́ша ___.
    options: [уже́ сде́лал уро́ки, писа́л контро́льную рабо́ту, был в шко́ле, ещё не сде́лал уро́ки]
    answer: ещё не сде́лал уро́ки
  - stem: Уро́ки Ми́ша сде́лал ___.
    options: [в суббо́ту ве́чером, в воскресе́нье ве́чером, в воскресе́нье у́тром, в понеде́льник у́тром]
    answer: в воскресе́нье ве́чером
  - stem: Тепе́рь Ми́ша хо́чет ___.
    options: [занима́ться ка́ждый день, игра́ть в футбо́л ка́ждый день, писа́ть контро́льную рабо́ту ещё раз, игра́ть в компью́тер ка́ждый ве́чер]
    answer: занима́ться ка́ждый день
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的留言，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    Среда́, два часа́

    Ми́ша!

    Я на рабо́те, в поликли́нике. До́ма я бу́ду в шесть часо́в. Па́па сего́дня рабо́тает до́лго и бу́дет до́ма то́лько в во́семь. А́нна в библиоте́ке, она́ вернётся по́здно, в оди́ннадцать часо́в. А Ван Лэй сего́дня на экску́рсии в Се́ргиевом Поса́де, он вернётся в де́вять часо́в. Ве́чером я пригото́влю вку́сный у́жин.

    Обе́д на ку́хне: ка́ша и сы́рники. Чай на столе́.

    По́сле обе́да сде́лай, пожа́луйста, уро́ки. Не забу́дь: за́втра у тебя́ контро́льная рабо́та! И не игра́й до́лго в компью́тер. Футбо́л — то́лько за́втра, по́сле контро́льной рабо́ты!

    Пото́м купи́ хлеб и молоко́ в магази́не напро́тив до́ма. Бу́лочная о́коло метро́ сего́дня не рабо́тает.

    У́тром звони́ла ба́бушка. В суббо́ту у неё день рожде́ния, и мы е́дем на да́чу. Ба́бушка спра́шивала о шко́ле и о футбо́ле. Она́ о́чень хо́чет уви́деть тебя́: ты не был на да́че уже́ ме́сяц.

    Ма́ма
    :::
  passage_zh: |
    星期三，两点

    米沙：

    我在上班，在诊所。我六点到家。爸爸今天工作时间长，八点才到家。安娜在图书馆，她晚上很晚才回来，十一点。王磊今天去谢尔吉耶夫镇参观了，九点回来。晚上我做一顿好吃的晚饭。

    午饭在厨房里：麦片粥和奶渣饼。茶在桌子上。

    吃完午饭请把功课做完。别忘了：明天你有测验！还有，别玩太久的电脑。足球等明天测验完了再踢！

    然后到家对面的商店买面包和牛奶。地铁站旁边的面包店今天不营业。

    早上奶奶打来电话。星期六是她的生日，我们去别墅。奶奶问了你学校和足球的事。她很想见你：你已经一个月没去别墅了。

    妈妈
  why: 第 1 题，[До́ма я бу́ду в шесть часо́в]{.ru}，写留言的是妈妈玛丽亚·尼古拉耶夫娜；八点到家的是爸爸。第 2 题，[А́нна … вернётся по́здно, в оди́ннадцать часо́в]{.ru}。第 3 题，妈妈让他在家对面的商店买，并说明地铁站旁的面包店今天不营业。第 4 题，留言写于星期三，[за́втра у тебя́ контро́льная рабо́та]{.ru}，所以测验在星期四；这道题要从日期推算。第 5 题，[В суббо́ту у неё день рожде́ния, и мы е́дем на да́чу]{.ru}；去谢尔吉耶夫镇的是王磊，而且是今天。
  items:
  - stem: Мари́я Никола́евна бу́дет до́ма ___.
    options: [в во́семь часо́в, в оди́ннадцать часо́в, в два часа́, в шесть часо́в]
    answer: в шесть часо́в
  - stem: По́здно ве́чером, в оди́ннадцать часо́в, домо́й вернётся ___.
    options: [Ива́н Серге́евич, Ван Лэй, А́нна, Мари́я Никола́евна]
    answer: А́нна
  - stem: Хлеб и молоко́ Ми́ша ку́пит ___.
    options: [в бу́лочной о́коло метро́, в суперма́ркете, в магази́не напро́тив до́ма, на ры́нке]
    answer: в магази́не напро́тив до́ма
  - stem: Контро́льная рабо́та у Ми́ши бу́дет в ___.
    options: [сре́ду, четве́рг, пя́тницу, суббо́ту]
    answer: четве́рг
  - stem: В суббо́ту Петро́вы ___.
    options: [бу́дут до́ма, е́дут в Се́ргиев Поса́д, бу́дут в шко́ле, е́дут на да́чу]
    answer: е́дут на да́чу
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的通知，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Экску́рсия в Се́ргиев Поса́д**

    Дороги́е студе́нты!

    Два́дцать пя́того октября́, в суббо́ту, мы е́дем на экску́рсию в Се́ргиев Поса́д. Э́то о́чень краси́вый стари́нный го́род. Там нахо́дится Тро́ице-Се́ргиева ла́вра, большо́й ста́рый монасты́рь.

    | | |
    |---|---|
    | 7.30 | авто́бус у зда́ния филологи́ческого факульте́та |
    | 10.00 | экску́рсия в ла́вре |
    | 13.00 | обе́д |
    | 14.00—16.00 | гуля́ем в го́роде |
    | 19.00 | Москва́ |

    Авто́бус ждёт вас у зда́ния филологи́ческого факульте́та. Не опа́здывайте: в семь три́дцать авто́бус уже́ е́дет!

    Экскурсово́д расска́жет о ла́вре и пока́жет ста́рые це́ркви. Он бу́дет говори́ть по-ру́сски ме́дленно, и вы всё поймёте! По́сле обе́да вы уви́дите ста́рые у́лицы го́рода. Там вы мо́жете гуля́ть и купи́ть пода́рки: матрёшки и́ли откры́тки.

    Биле́т на авто́бус сто́ит девяно́сто рубле́й, а экску́рсия в ла́вре — пятьдеся́т рубле́й. Обе́д возьми́те из до́ма: хлеб, сы́рники, чай.

    В авто́бусе мы бу́дем слу́шать ру́сскую му́зыку. Телефо́н О́льги Ви́кторовны: 123-45-67. Мы ждём вас!
    :::
  passage_zh: |
    **谢尔吉耶夫镇一日游**

    亲爱的同学们！

    十月二十五日星期六，我们去谢尔吉耶夫镇参观。这是一座非常美丽的古城。圣三一谢尔吉大修道院就在那里，这是一座很大的古老修道院。

    | | |
    |---|---|
    | 7:30 | 语文系大楼前上车 |
    | 10:00 | 参观大修道院 |
    | 13:00 | 午饭 |
    | 14:00—16:00 | 城里自由活动 |
    | 19:00 | 回到莫斯科 |

    大巴在语文系大楼前等大家。不要迟到：七点半大巴就开车了！

    讲解员会介绍大修道院，带大家看古老的教堂。他会用俄语慢慢讲，大家都能听懂！午饭后大家会看到这座城市的老街道。在那里可以逛逛，买些礼物：套娃或明信片。

    大巴车票九十卢布，大修道院的参观五十卢布。午饭请自己从家里带：面包、奶渣饼、茶。

    在大巴上我们会听俄罗斯音乐。奥尔加·维克托罗夫娜的电话：123-45-67。我们等着大家！
  why: 第 1 题，[Два́дцать пя́того октября́]{.ru}。第 2 题，[Авто́бус ждёт вас у зда́ния филологи́ческого факульте́та]{.ru}。第 3 题，[Биле́т на авто́бус сто́ит девяно́сто рубле́й]{.ru}；参观大修道院是五十卢布。第 4 题，[Обе́д возьми́те из до́ма]{.ru}：午饭要自己从家里带。第 5 题，表里 19:00 到莫斯科，是晚上。
  items:
  - stem: Экску́рсия в Се́ргиев Поса́д бу́дет ___.
    options: [два́дцать пя́того октября́, два́дцать пя́того ноября́, два́дцать второ́го октября́, пя́того октября́]
    answer: два́дцать пя́того октября́
  - stem: Авто́бус ждёт ___.
    options: [у метро́, у ла́вры, у общежи́тия, у зда́ния филологи́ческого факульте́та]
    answer: у зда́ния филологи́ческого факульте́та
  - stem: Девяно́сто рубле́й сто́ит ___.
    options: [экску́рсия в ла́вре, обе́д, биле́т на авто́бус, матрёшка]
    answer: биле́т на авто́бус
  - stem: Обе́д студе́нты ___.
    options: [возьму́т из до́ма, ку́пят в ла́вре, пригото́вят в авто́бусе, бу́дут есть в Москве́]
    answer: возьму́т из до́ма
  - stem: В Москву́ студе́нты верну́тся ___.
    options: [у́тром, ве́чером, днём, но́чью]
    answer: ве́чером
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Магази́ны в Москве́**

    В Москве́ магази́ны обы́чно открыва́ются в де́вять и́ли в де́сять часо́в утра́, а закрыва́ются в де́вять и́ли в де́сять часо́в ве́чера. Ра́ньше в воскресе́нье мно́гие магази́ны не рабо́тали, и лю́ди покупа́ли хлеб и молоко́ в суббо́ту. А тепе́рь магази́ны рабо́тают ка́ждый день.

    Ма́ленькие магази́ны о́коло до́ма ча́сто закрыва́ются ра́но, в во́семь часо́в. А бу́лочные открыва́ются ра́но у́тром, в семь часо́в: москвичи́ покупа́ют там све́жий хлеб на за́втрак. А ве́чером хле́ба там ча́сто уже́ нет.

    Мно́гие суперма́ркеты и апте́ки рабо́тают кру́глые су́тки. Ве́чером, по́сле рабо́ты, лю́ди ча́сто покупа́ют там хлеб, молоко́ и карто́шку, и в суперма́ркете тогда́ дли́нная о́чередь. Ры́нки открыва́ются ра́но, но рабо́тают то́лько до ве́чера. На ры́нке всё све́жее, но всё сто́ит до́рого.

    Пе́рвого января́ мно́гие магази́ны не рабо́тают: э́то пра́здник, Но́вый год. В э́тот день лю́ди обы́чно до́лго спят и отдыха́ют. Но уже́ второ́го января́ магази́ны опя́ть открыва́ются.
    :::
  passage_zh: |
    **莫斯科的商店**

    莫斯科的商店一般上午九点或十点开门，晚上九点或十点关门。以前很多商店星期天不营业，人们星期六就把面包和牛奶买好。现在商店每天都营业。

    家门口的小商店常常关门早，八点就关了。面包店早上很早开门，七点就开：莫斯科人在那里买早饭吃的新鲜面包。到了晚上，那里常常已经没有面包了。

    很多超市和药店昼夜营业。晚上下班以后，人们常常在那里买面包、牛奶和土豆，这时超市里排着长队。市场开门早，但只营业到晚上。市场上样样新鲜，可是都很贵。

    一月一日很多商店不营业：这天是节日，新年。这一天人们一般睡得很晚，在家休息。但是一月二日商店就又开门了。
  why: 第 1 题，第一句 [обы́чно открыва́ются в де́вять и́ли в де́сять часо́в утра́]{.ru}。第 2 题，[бу́лочные открыва́ются ра́но у́тром … москвичи́ покупа́ют там све́жий хлеб на за́втрак]{.ru}。第 3 题，[Ра́ньше в воскресе́нье мно́гие магази́ны не рабо́тали]{.ru}。第 4 题，夜里营业的只有“昼夜营业”的超市和药店；小商店八点关门，市场只开到晚上，面包店是早上开门。第 5 题，[Пе́рвого января́ мно́гие магази́ны не рабо́тают]{.ru}，因为是新年。
  items:
  - stem: Магази́ны в Москве́ обы́чно открыва́ются ___.
    options: [в семь часо́в, в во́семь часо́в, в де́вять и́ли в де́сять часо́в, в оди́ннадцать часо́в]
    answer: в де́вять и́ли в де́сять часо́в
  - stem: Све́жий хлеб на за́втрак москвичи́ покупа́ют ___.
    options: [на ры́нке, в апте́ке, на по́чте, в бу́лочной]
    answer: в бу́лочной
  - stem: Ра́ньше в воскресе́нье мно́гие магази́ны ___.
    options: [рабо́тали кру́глые су́тки, не рабо́тали, открыва́лись в семь часо́в, рабо́тали до́лго]
