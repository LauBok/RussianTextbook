  why: 第 1 题，推断：3 月 1 日到 14 日闭馆，10 日在这段时间里，所以游泳馆不开；表上的开放时间是 15 日以后的。第 2 题，推断：题目告诉我们 15 日是星期天，表里周末 9:00 开门；7:00 是工作日的开门时间。第 3 题，推断：星期二 17:00—18:00 只给孩子游，17:30 不行；6:30 还没开门，22:30 已经关门，只有 18:30 可以。第 4 题，推断：学生价要凭学生证，忘了带学生证，就只能买 300 卢布的普通票；200 卢布是有学生证的价格（第 39 课）。第 5 题，细节：[Во вто́рник и в четве́рг]{.ru}；星期一和星期五是表里工作日的起止，是干扰项（第 29 课）。
