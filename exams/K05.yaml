  passage: |
    ::: {.prose lang="ru"}
    Дорога́я ма́ма!

    У меня́ всё хорошо́. За́втра у нас (1) []{.blank} (быть) семина́р, он (2) []{.blank} (начина́ться) в де́сять. Ни́на Па́вловна сказа́ла нам: «(3) []{.blank} (прочита́ть) расска́з Че́хова “Ва́нька”». Вчера́ я (4) []{.blank} (чита́ть / прочита́ть) его́ весь ве́чер — там мно́го тру́дных слов, — и то́лько сего́дня наконе́ц (5) []{.blank} (чита́ть / прочита́ть). Э́то расска́з о (6) []{.blank} (ма́ленький ма́льчик), кото́рый пи́шет письмо́ де́душке в дере́вню.

    Вот и я сейча́с (7) []{.blank} (писа́ть) тебе́ письмо́ — то́лько не в дере́вню, а в Каза́нь. Ты всегда́ (8) []{.blank} (спра́шивать) о (9) []{.blank} (на́ша гру́ппа): у нас пятна́дцать челове́к, и все о́чень хоро́шие.

    Позвоню́ в (10) []{.blank} (суббо́та).

    Твой Ви́тя
