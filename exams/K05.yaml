lesson: K05
heading: 第五套
range: L01-L49
names: [Ната́ша, Каза́нь, Стас, Ли́за, Ю́ра, Ма́ша, Оле́г, Ли́да, Ча́йка, Ве́ра, Татья́на Петро́вна, Глеб, Ле́на, Ири́на, Ва́ся, Кремль]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[напро́тив]{.ru} 要求第二格：[напро́тив апте́ки]{.ru}；第一格、第六格、第四格都是常见错误（第 37 课）。第 2 题：[за́втра]{.ru} 说的是将来，主语 [контро́льная рабо́та]{.ru} 是阴性单数，用 [бу́дет]{.ru}；[была́]{.ru} 是过去时，[бу́дут]{.ru} 是复数（第 41 课）。第 3 题：说的是今天这一次起得晚、因而迟到，是已经发生的一次具体动作，用完成体过去时 [встал]{.ru}；[вста́ну]{.ru} 是将来时，[встать]{.ru} 是不定式，不能作谓语；[опозда́л]{.ru} 说明说话人是男性，所以不用 [вста́ла]{.ru}（第 44 课）。第 4 题：回答“昨天看完了，你可以拿去”，说明书已经读完，问的是结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 不表示读完，[чита́ешь, прочита́ешь]{.ru} 不是已经发生的事（第 42 课）。第 5 题：后半句“我们找了很久”，说明钥匙丢了：[потеря́л]{.ru}；买来的、拿走的、做好的东西用不着找很久（第 45 课）。第 6 题：[сего́дня ве́чером]{.ru} 是将来，又保证一定读完，用完成体将来时 [прочита́ю]{.ru}；[прочита́л, чита́л]{.ru} 是过去时，[чита́ю]{.ru} 是现在时（第 43 课）。第 7 题：[В како́м ме́сяце?]{.ru} 回答“在几月”，用 [в]{.ru} + 第六格：[в ию́ле]{.ru}；[в ию́ль]{.ru} 误用第四格（那是星期的说法 [в суббо́ту]{.ru}），[ию́ля]{.ru} 是说具体日期时的第二格（[пя́того ию́ля]{.ru}），月份不和 [на]{.ru} 连用（第 29、48 课）。第 8 题：词典现在不在原处，被弟弟拿去做功课了，是动作的结果，用完成体 [взял]{.ru}；[брал]{.ru} 表示拿过（又还回来了），[возьмёт, берёт]{.ru} 不是已经发生的事（第 44 课）。第 9 题：在公园里散步散了两个小时，所以现在很饿：[гуля́ли]{.ru}；[учи́ться]{.ru} 指在学校、大学里上学，不说“在公园里上学”；在公园里睡两个小时、打两个小时电话都不合情理，[в па́рке]{.ru} 最常和 [гуля́ть]{.ru} 连用（第 6、17 课）。第 10 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ю]{.ru}；[куплю́, ку́пим]{.ru} 是完成体将来时，[купи́л]{.ru} 是一次的动作（第 45 课）。第 11 题：[за́втра]{.ru} 是一次具体的出行，坐电气火车朝一个方向去，用乘车的定向动词；现在时 [е́дем]{.ru} 可以表示已经安排好的将来。[е́здим]{.ru} 表示经常往返，[идём, хо́дим]{.ru} 是步行，和 [на электри́чке]{.ru} 矛盾（第 24、25 课）。第 12 题：对老师要用 [вы]{.ru} 的命令式 [повтори́те]{.ru}；[повтори́]{.ru} 是对 [ты]{.ru} 说的（第 46 课）。第 13 题：省略的是 [ру́чку]{.ru}，[ру́чка]{.ru} 是阴性，作 [возьми́]{.ru} 的宾语用第四格，物主代词随之变成 [мою́]{.ru}；[мой, моё, мои́]{.ru} 是阳性、中性、复数的形式（第 23、46 课）。第 14 题：“现在一点，我们还有时间”，课要晚一些才开始，“在两点”用 [в два часа́]{.ru}；[час наза́д]{.ru} 和“还有时间”矛盾，[в час]{.ru} 就是现在，没有 [в]{.ru} 的 [два часа́]{.ru} 不能作时间状语（第 47 课）。第 15 题：[сейча́с]{.ru} 说的是此刻朝一个方向去，用定向动词 [идёшь]{.ru}；[хо́дишь]{.ru} 表示经常去（第 24、25 课）。第 16 题：音乐会七点开始，现在六点，是“一小时以后”：[че́рез час]{.ru}；[наза́д]{.ru} 表示“以前”，而且放在时间词组后面（第 47 课）。第 17 题：[бу́ду]{.ru} + 不定式构成未完成体将来时，只能接未完成体不定式 [смотре́ть]{.ru}；*[бу́ду посмотре́ть]{.ru} 是常见错误，完成体自己就有将来时 [посмотрю́]{.ru}；[бу́ду]{.ru} 后面也不能接变位形式 [смотрю́, смотре́л]{.ru}（第 41、43 课）。第 18 题：新年是一月一日，“在哪一天”用第二格 [пе́рвого января́]{.ru}；其他日期都不是新年（第 48、49 课）。第 19 题：[пять]{.ru} 后面用复数第二格，[год]{.ru} 的这个形式是 [лет]{.ru}，要单独记；[го́да]{.ru} 用于 2–4，[год]{.ru} 用于 1，[годо́в]{.ru} 是按 [часо́в]{.ru} 类推出来的错误形式（第 35、38、47 课）。第 20 题：“在几号”，序数词和月份都用第二格，不加前置词：[пя́того ма́я]{.ru}；[пя́тое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 21 题：表示人不在某处用 [нет]{.ru} + 第二格：[Ве́ры нет на уро́ке]{.ru}；这里 [Ве́ра]{.ru} 不是主语，不能用第一格，这是最常见的错误（第 32 课）。第 22 题：[два́дцать]{.ru} 后面用复数第二格，[челове́к]{.ru} 的复数第二格和单数第一格同形（第 35 课）。第 23 题：“还在学院读书”是学生的身份，用 [учи́ться]{.ru}：[учу́сь]{.ru}；[учу́]{.ru} 要带宾语，[занима́юсь]{.ru} 指用功、做功课，[нахожу́сь]{.ru} 表示位置（第 38 课）。第 24 题：数词最后一个词是 [оди́н]{.ru}，用单数第一格 [рубль]{.ru}（第 39 课）。第 25 题：对方道歉，回答“没关系”：[Ничего́]{.ru}；[Пожа́луйста]{.ru} 用于回答道谢，[Спаси́бо]{.ru} 是道谢，[Пока́]{.ru} 是告别。中文“不客气”“没关系”分得清，俄语里最容易把 [Пожа́луйста]{.ru} 用错地方（第 4、7 课）。
  items:
  - stem: — Извини́те, вы не зна́ете, где здесь по́чта? — ___
    options: ['Вон там, напро́тив апте́ки.', 'Вон там, напро́тив апте́ка.', 'Вон там, напро́тив апте́ке.', 'Вон там, напро́тив апте́ку.']
    answer: 'Вон там, напро́тив апте́ки.'
  - stem: За́втра у нас ___ контро́льная рабо́та, и сего́дня я до́лго занима́юсь.
    options: [бу́дет, была́, бу́дут, бу́ду]
    answer: бу́дет
  - stem: 'Сего́дня я опозда́л на уро́к: я ___ по́здно.'
    options: [встать, встал, вста́ну, вста́ла]
    answer: встал
  - stem: — Ты уже́ ___ рома́н? — Да, вчера́. Мо́жешь взять его́.
    options: [чита́л, чита́ешь, прочита́л, прочита́ешь]
    answer: прочита́л
  - stem: Па́па ___ ключи́, и мы до́лго их иска́ли.
    options: [потеря́л, купи́л, взял, сде́лал]
    answer: потеря́л
  - stem: Э́тот расска́з дли́нный, но я ___ его́ сего́дня ве́чером, че́стное сло́во!
    options: [прочита́л, чита́ю, чита́л, прочита́ю]
    answer: прочита́ю
  - stem: — В како́м ме́сяце вы е́дете домо́й? — ___
    options: [В ию́ль., Ию́ля., В ию́ле., На ию́ле.]
    answer: В ию́ле.
  - stem: '— Где мой слова́рь? — Его́ ___ брат: он сейча́с де́лает уро́ки.'
    options: [брал, взял, возьмёт, берёт]
    answer: взял
  - stem: Мы два часа́ ___ в па́рке и тепе́рь о́чень хоти́м есть.
    options: [гуля́ли, спа́ли, учи́лись, звони́ли]
    answer: гуля́ли
  - stem: Ка́ждое у́тро я ___ све́жий хлеб в бу́лочной.
    options: [куплю́, покупа́ю, купи́л, ку́пим]
    answer: покупа́ю
  - stem: За́втра у́тром мы ___ на да́чу на электри́чке.
    options: [е́здим, хо́дим, идём, е́дем]
    answer: е́дем
  - stem: Татья́на Петро́вна, ___, пожа́луйста, э́то сло́во ещё раз.
    options: [повтори́, повтори́ть, повтори́те, повтори́л]
    answer: повтори́те
  - stem: — Я забы́л ру́чку! — ___
    options: [Возьми́ мою́., Возьми́ мой., Возьми́ моё., Возьми́ мои́.]
    answer: Возьми́ мою́.
  - stem: 'Сейча́с час, а уро́к начина́ется ___: у нас ещё есть вре́мя.'
    options: [час наза́д, в час, два часа́, в два часа́]
    answer: в два часа́
  - stem: — Куда́ ты сейча́с ___? — В апте́ку.
    options: [хо́дишь, идёшь, иду́, ходи́ть]
    answer: идёшь
  - stem: 'Сейча́с шесть часо́в. Конце́рт начнётся ___ час: в семь.'
    options: [наза́д, в, че́рез, до]
    answer: че́рез
  - stem: Ве́чером я бу́ду ___ телеви́зор.
    options: [посмотре́ть, смотрю́, смотре́ть, смотре́л]
    answer: смотре́ть
  - stem: Моя́ сестра́ родила́сь ___, в Но́вый год.
    options: [в декабре́, пе́рвого января́, в ма́рте, тридца́того ию́ня]
    answer: пе́рвого января́
  - stem: Мой брат живёт в Москве́ уже́ пять ___.
    options: [го́да, лет, год, годо́в]
    answer: лет
  - stem: Конце́рт бу́дет ___, в суббо́ту.
    options: [пя́тое ма́я, в пя́тое ма́я, пя́того ма́я, в пя́том ма́е]
    answer: пя́того ма́я
  - stem: 'Сего́дня ___ нет на уро́ке: она́ в поликли́нике.'
    options: [Ве́ра, Ве́ру, Ве́ры, Ве́ре]
    answer: Ве́ры
  - stem: В авто́бусе бы́ло два́дцать ___.
    options: [челове́ка, лю́ди, люде́й, челове́к]
    answer: челове́к
  - stem: — Ты уже́ рабо́таешь? — Нет, я ещё ___ в институ́те.
    options: [учу́сь, учу́, занима́юсь, нахожу́сь]
    answer: учу́сь
  - stem: Э́та кни́га сто́ит пятьдеся́т оди́н ___.
    options: [рубля́, рубль, рубле́й, рубли́]
    answer: рубль
  - stem: — Извини́те, я опозда́л! — ___
    options: [Пожа́луйста., Спаси́бо., Пока́., Ничего́.]
    answer: Ничего́.
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Откры́тка**

    Двадца́того октября́ у мое́й ба́бушки день рожде́ния. Ба́бушка живёт в Каза́ни, а я (1) []{.blank} в Москве́. В октябре́ у нас семина́ры и контро́льные рабо́ты, и в э́тот раз я в Каза́нь не (2) []{.blank}.

    Деся́того октября́ я (3) []{.blank} краси́вую откры́тку и ве́чером написа́ла: «Дорога́я ба́бушка! Извини́, в октябре́ я не (4) []{.blank} быть в Каза́ни. Я бу́ду у тебя́ в (5) []{.blank}. Твоя́ Ната́ша». Письмо́ из Москвы́ в Каза́нь идёт неде́лю — вре́мя ещё бы́ло. «Отпра́влю (6) []{.blank}», — ду́мала я.

    Но у́тром я опа́здывала на ле́кцию, пото́м был семина́р, пото́м библиоте́ка… Откры́тка (7) []{.blank} в су́мке, и я о ней совсе́м (8) []{.blank}.

    Восемна́дцатого октября́ я иска́ла в су́мке ключи́ и (9) []{.blank} там откры́тку. Восемна́дцатое! А день рожде́ния у ба́бушки (10) []{.blank}.

    «Что де́лать?» — спроси́ла я па́пу. Па́па посмотре́л в телефо́н: «Двадца́того — (11) []{.blank}. По́езд в Каза́нь идёт (12) []{.blank}. Ся́дешь в по́езд в пя́тницу ве́чером — и в суббо́ту у́тром ты у ба́бушки». И пра́вда: в суббо́ту у нас нет (13) []{.blank}!

    В пя́тницу по́сле (14) []{.blank} я купи́ла биле́т, а ве́чером уже́ сиде́ла в (15) []{.blank}.

    В суббо́ту в во́семь утра́ ба́бушка откры́ла дверь и до́лго (16) []{.blank} на меня́. «Ната́ша! А я ду́мала, ты в (17) []{.blank}!» — «Была́ в Москве́. А вот мой (18) []{.blank}».

    Ба́бушка (19) []{.blank} откры́тку и прочита́ла: «Извини́, в октябре́ я не могу́ быть в Каза́ни…» Пото́м посмотре́ла на меня́ и засмея́лась: «Не мо́жешь? А кто тогда́ (20) []{.blank} тут?»
    :::
  glossary:
  - {ru: в э́тот раз, zh: 这一次}
  - {ru: дверь, pos: f, zh: 门}
  - {ru: засмея́лась, zh: 笑了起来}
  passage_zh: |
    **明信片**

    十月二十日是我奶奶的生日。奶奶住在喀山，我在莫斯科上学。十月我们有研讨课和测验，所以这一次我不去喀山了。

    十月十日我买了一张漂亮的明信片，晚上写好了：“亲爱的奶奶！对不起，十月我没法到喀山来。一月我去看你。你的娜塔莎。”从莫斯科寄到喀山的信要走一个星期——时间还来得及。“明天寄”，我想。

    可是早上我上课要迟到了，接着是研讨课，再后来是图书馆……明信片一直躺在包里，我把它忘得一干二净。

    十月十八日我在包里找钥匙，看见了那张明信片。十八号了！奶奶的生日再过两天就到了。

    “怎么办？”我问爸爸。爸爸看了看手机：“二十号是星期六。去喀山的火车走一夜。星期五晚上上车，星期六早上你就在奶奶家了。”真的：星期六我们没有研讨课！

    星期五下课以后我买了票，晚上已经坐在火车上了。

    星期六早上八点，奶奶打开门，看了我好一会儿。“娜塔莎！我还以为你在莫斯科呢！”——“刚才还在莫斯科。这是我的礼物。”

    奶奶接过明信片念道：“对不起，十月我没法到喀山来……”然后她看看我，笑了起来：“没法来？那站在这儿的是谁呀？”
  why: 第 1 空：说的是在莫斯科上学、当学生，用 [учи́ться]{.ru}：[учу́сь]{.ru}；[учу́, изуча́ю]{.ru} 都要带宾语（学什么），[занима́юсь]{.ru} 指用功、做功课，不说“在莫斯科做功课”（第 15、38 课）。第 2 空：说的是这一次、今年十月这一趟去不去，是一次具体的出行，用乘车的定向动词 [е́ду]{.ru}；[е́зжу]{.ru} 表示经常往返，[иду́, хожу́]{.ru} 是步行，从莫斯科不能走着去喀山（第 24、25 课）。第 3 空：十月十日这一天买到了，后面紧接着“晚上写好了”，是一次完成的动作，用 [купи́ла]{.ru}；[покупа́ла]{.ru} 只说买的过程或经常买，[куплю́, покупа́ю]{.ru} 时间不对（第 45 课）。第 4 空：第一段说十月有研讨课和测验，所以是“没法来”：[могу́]{.ru}；[уме́ю]{.ru} 指会不会某种技能，[зна́ю]{.ru} 不接 [быть]{.ru}；[не хочу́]{.ru} 语法上可以，可是给奶奶的生日卡上先说“对不起”再说“我不想来”，不合情理，前文也说明了原因是课多（第 27 课）。第 5 空：“在几月”用 [в]{.ru} + 第六格：[в январе́]{.ru}；[в янва́рь]{.ru} 误用第四格，[января́]{.ru} 只用在具体日期里，如 [пя́того января́]{.ru}（第 48 课）。第 6 空：[Отпра́влю]{.ru} 是完成体将来时，只能和 [за́втра]{.ru} 连用；[вчера́, давно́, ра́ньше]{.ru} 都说过去。下一段“可是早上……”也说明她打算第二天寄（第 43 课）。第 7 空：包里平放着的明信片用 [лежа́ла]{.ru}；[стоя́ла]{.ru} 用于竖放的东西，[сиде́ла, жила́]{.ru} 用于人（第 7 课）。第 8 空：后面她在包里找钥匙时“看见了”明信片，又惊叫“十八号了！”，可见她一直没想起来：[забы́ла]{.ru}；[по́мнила, ду́мала о ней]{.ru} 和后文矛盾，[спра́шивала]{.ru} 说不通（第 44、47 课）。第 9 空：明信片一直在包里，这时她“看见”了它：[уви́дела]{.ru}；[потеря́ла]{.ru} 和后文她带着明信片去喀山矛盾（第 43 课）。第 10 空：十八号，生日是二十号，所以是“两天以后”：[че́рез два дня]{.ru}；[два дня наза́д]{.ru} 是“两天以前”，“一星期”算不出来。这里要把第一句的日期和这一句的日期连起来算（第 47 课）。第 11 空：爸爸接着说“星期五晚上上车，星期六早上你就到了”，叙述者又说“星期六我们没有研讨课”，可见二十号是星期六：[суббо́та]{.ru}（第 29 课）。第 12 空：星期五晚上上车、星期六早上到，火车走一夜：[ночь]{.ru}；[неде́лю]{.ru} 是信走的时间，是干扰项（第 29 课）。第 13 空：[нет]{.ru} + 第二格：[семина́ра]{.ru}。这句也回答了开头的问题：十月因为有课去不了，星期六没课，就能去了（第 32 课）。第 14 空：[по́сле]{.ru} 要求第二格：[по́сле ле́кции]{.ru}（第 37 课）。第 15 空：[сиде́ть]{.ru} 回答“在哪里”，用 [в]{.ru} + 第六格：[в по́езде]{.ru}；[в по́езд]{.ru} 是第四格，用于 [сесть в по́езд]{.ru}“上车”，正是前一段爸爸那句话里的形式，容易照抄（第 11、24、46 课）。第 16 空：“看着某人”是 [смотре́ть на]{.ru} + 第四格：[смотре́ла на меня́]{.ru}；[ви́деть]{.ru} 不和 [на]{.ru} 连用，[слу́шала, ждала́]{.ru} 也不接 [на]{.ru}（第 7、43 课）。第 17 空：奶奶住在喀山，没想到孙女会来，她以为孙女还在莫斯科：[в Москве́]{.ru}；娜塔莎的回答 [Была́ в Москве́]{.ru} 也说明了这一点；[в Москву́]{.ru} 是第四格，回答“去哪里”（第 11 课）。第 18 空：她递过去的是明信片，这就是“礼物”：[пода́рок]{.ru}；[письмо́]{.ru} 是中性，不能和 [мой]{.ru} 连用，[биле́т, пиро́г]{.ru} 都和接下来奶奶“接过明信片”不搭（第 3、5 课）。第 19 空：一次具体的、有结果的动作，用完成体过去时 [взяла́]{.ru}；[брала́]{.ru} 不表示结果，[возьмёт, берёт]{.ru} 时态不对（第 44 课）。第 20 空：奶奶刚打开门，两人在门口，娜塔莎是站着的：[стои́т]{.ru}。奶奶拿卡上的“没法来”开玩笑：人明明就站在面前（第 7 课）。
  items:
  - options: [учу́, изуча́ю, учу́сь, занима́юсь]
    answer: учу́сь
  - options: [е́зжу, е́ду, иду́, хожу́]
    answer: е́ду
  - options: [покупа́ла, куплю́, покупа́ю, купи́ла]
    answer: купи́ла
  - options: [уме́ю, хочу́, могу́, зна́ю]
    answer: могу́
  - options: [янва́рь, января́, январе́, январём]
    answer: январе́
  - options: [вчера́, за́втра, давно́, ра́ньше]
    answer: за́втра
  - options: [лежа́ла, стоя́ла, сиде́ла, жила́]
    answer: лежа́ла
  - options: [по́мнила, ду́мала, спра́шивала, забы́ла]
    answer: забы́ла
  - options: [потеря́ла, уви́дела, купи́ла, написа́ла]
    answer: уви́дела
  - options: [два дня наза́д, че́рез неде́лю, че́рез два дня, неде́лю наза́д]
    answer: че́рез два дня
  - options: [пя́тница, суббо́та, воскресе́нье, понеде́льник]
    answer: суббо́та
  - options: [неде́лю, час, ме́сяц, ночь]
    answer: ночь
  - options: [семина́р, семина́ре, семина́ра, семина́ры]
    answer: семина́ра
  - options: [ле́кции, ле́кция, ле́кцию, ле́кцией]
    answer: ле́кции
  - options: [по́езд, по́езда, по́ездом, по́езде]
    answer: по́езде
  - options: [ви́дела, смотре́ла, слу́шала, ждала́]
    answer: смотре́ла
  - options: [Каза́ни, Москву́, Москве́, Каза́нь]
    answer: Москве́
  - options: [биле́т, пода́рок, пиро́г, письмо́]
    answer: пода́рок
  - options: [брала́, возьмёт, берёт, взяла́]
    answer: взяла́
  - options: [сиди́т, стои́т, лежи́т, живёт]
