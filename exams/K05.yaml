  passage_zh: |
    亲爱的妈妈！

    我一切都好。明天我们有研讨课，十点开始。尼娜·帕夫洛夫娜对我们说：“请读契诃夫的小说《万卡》。”昨天我读了一整晚——里面难词很多——直到今天才终于读完。这是一个小男孩给乡下的爷爷写信的故事。

    我现在也在给你写信——只不过不是寄往乡下，而是寄往喀山。你总是问起我们班：我们班十五个人，大家都很好。

    星期六给你打电话。

    你的维佳
