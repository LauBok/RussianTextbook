  - stem: Электри́чка в Се́ргиев Поса́д была́ ___.
    options: [в семь часо́в, в шесть часо́в, в во́семь часо́в, в де́сять часо́в]
    answer: в семь часо́в
  - stem: 'Дени́с встал по́здно: в пя́тницу ве́чером он ___.'
    options: [чита́л кни́гу о ла́вре, был на экску́рсии, до́лго смотре́л фильм, игра́л в футбо́л]
    answer: до́лго смотре́л фильм
  - stem: Гру́ппа ждала́ Дени́са ___.
    options: [на ста́нции, в электри́чке, в Москве́, о́коло ла́вры]
    answer: о́коло ла́вры
  - stem: 'Мно́гие студе́нты пло́хо понима́ли экскурсово́да: ___.'
    options: [он говори́л по-англи́йски, он говори́л о́чень бы́стро, он говори́л ма́ло, он опозда́л]
    answer: он говори́л о́чень бы́стро
  - stem: 'Дени́с всё по́нял: ___.'
    options: [в электри́чке он чита́л кни́гу о ла́вре, экскурсово́д говори́л ме́дленно, он ра́ньше был в ла́вре, преподава́тель всё объясни́л]
    answer: в электри́чке он чита́л кни́гу о ла́вре
