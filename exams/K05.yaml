- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Морж**

    В декабре́ па́па посмотре́л в интерне́те фильм «Моржи́»: лю́ди пла́вают в о́зере, а на у́лице моро́з. «Здо́рово! — сказа́л па́па. — Я то́же так могу́. Пе́рвого января́ бу́ду пла́вать в на́шем о́зере». Ма́ма то́лько посмотре́ла на него́.

    Пе́рвого января́ в де́сять утра́ мы бы́ли на о́зере: па́па, ма́ма и я. Бы́ло ми́нус два́дцать. Моржи́ там уже́ бы́ли: два де́душки и одна́ ба́бушка. Они́ пла́вали и ве́село разгова́ривали.

    Па́па до́лго стоя́л и смотре́л на во́ду. Пото́м сказа́л: «Зна́ете, сего́дня я то́лько посмотрю́. А пла́вать бу́ду в сле́дующее воскресе́нье».

    Тут ба́бушка-морж посмотре́ла на него́ и сказа́ла: «Молодо́й челове́к, я пла́ваю здесь уже́ два́дцать лет. Вода́ сего́дня отли́чная!» Де́душки засмея́лись.

    Че́рез мину́ту па́па был в воде́. Пла́вал он то́лько мину́ту, а я снима́л его́ на телефо́н.

    Тепе́рь э́то фо́то стои́т у па́пы на столе́ на рабо́те: па́па в воде́, а ря́дом ба́бушка-морж. Колле́ги спра́шивают: «Э́то ва́ша ма́ма?»
    :::
  glossary:
  - {ru: ми́нус, zh: 零下}
  - {ru: сле́дующее, zh: 下一个（中性）}
  - {ru: засмея́лись, zh: 笑了起来（复数）}
  - {ru: колле́ги, zh: 同事们}
  - {ru: ба́бушка-морж, zh: 冬泳的老奶奶}
  passage_zh: |
    **冬泳的人**

    十二月爸爸在网上看了一部电影《冬泳的人》：外面天寒地冻，人们在湖里游泳。“太棒了！”爸爸说，“我也行。一月一日我就到咱们这儿的湖里去游。”妈妈只是看了他一眼。

    一月一日上午十点，我们来到了湖边：爸爸、妈妈和我。零下二十度。冬泳的人已经在那儿了：两个老爷爷和一个老奶奶。他们一边游一边说说笑笑。

    爸爸站了很久，看着湖水。然后他说：“你们知道吗，今天我就先看看。下个星期天再游。”

    这时那位冬泳的老奶奶看看他，说：“年轻人，我在这儿游了二十年了。今天的水好极了！”两位老爷爷都笑了。

    一分钟以后，爸爸已经在水里了。他只游了一分钟，我用手机给他拍了下来。

    现在这张照片摆在爸爸单位的桌子上：爸爸在水里，旁边是那位冬泳的老奶奶。同事们问：“这是您母亲吗？”
  why: 第 1 题，细节：第一句 [В декабре́ па́па посмотре́л в интерне́те фильм «Моржи́»]{.ru}，他是看了电影才想去游的；冷水里游泳是一月一日的事，湖边他是一月一日才去的，拍照的是“我”。第 2 题，推断：文中说冬泳的是 [два де́душки и одна́ ба́бушка]{.ru}，可见都是上了年纪的人；老奶奶自己也说在这里游了二十年。[молоды́е лю́ди]{.ru} 是干扰项：[Молодо́й челове́к]{.ru} 是老奶奶称呼爸爸的话。第 3 题，人物意图：爸爸“站了很久，看着湖水”，然后说“今天先看看，下星期天再游”，零下二十度，他是不想下冷水；他在第一段说过 [Я то́же так могу́]{.ru}，后来也真的游了，所以不是不会游（第 27 课）。第 4 题，推断：[а я снима́л его́ на телефо́н]{.ru}，“我”用的是阳性过去时 [снима́л]{.ru}，一家三口是爸爸、妈妈和“我”，所以拍照的是儿子；妈妈是阴性，两位老爷爷在笑，老奶奶在水里。第 5 题，推断：同事问 [Э́то ва́ша ма́ма?]{.ru}，说明他们把照片上的老奶奶当成了爸爸的母亲；这正是故事的笑点（第 8 课）。
  items:
  - stem: В декабре́ па́па ___.
    options: [пла́вал в холо́дной воде́, был на о́зере, посмотре́л фильм «Моржи́», снима́л моржа́ на телефо́н]
    answer: посмотре́л фильм «Моржи́»
  - stem: Моржи́ на о́зере бы́ли ___.
    options: [молоды́е лю́ди, де́ти, студе́нты, ста́рые лю́ди]
    answer: ста́рые лю́ди
  - stem: 'Па́па сказа́л: «Сего́дня я то́лько посмотрю́». Он ___.'
    options: [не уме́л пла́вать, не хоте́л в холо́дную во́ду, ждал ма́му, хоте́л пла́вать на да́че]
    answer: не хоте́л в холо́дную во́ду
  - stem: Фо́то па́пы в воде́ снима́л ___.
    options: [его́ сын, его́ жена́, оди́н де́душка, ба́бушка-морж]
    answer: его́ сын
  - stem: Колле́ги па́пы ду́мают, что ба́бушка-морж — э́то ___.
    options: [его́ жена́, его́ ма́ма, его́ сосе́дка, его́ дочь]
    answer: его́ ма́ма
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的短信，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Стас** 15.08

    Ли́за, приве́т! У тебя́ есть англи́йский слова́рь? За́втра контро́льная, а мой слова́рь на да́че.

    **Ли́за** 15.09

    Есть, он у меня́ в су́мке. Но я в библиоте́ке, бу́ду тут до ве́чера. Зна́ешь, где библиоте́ка?

    **Стас** 15.10

    Зна́ю, напро́тив по́чты. Бу́ду че́рез полчаса́.

    **Ли́за** 15.11

    Хорошо́. То́лько не звони́: тут ти́хо, все занима́ются. Напиши́ — и я вы́йду.
    :::
  glossary:
  - {ru: вы́йду, zh: （我）出去}
  passage_zh: |
    **斯塔斯** 15:08

    丽莎，你好！你有英语词典吗？明天测验，可我的词典在别墅里。

    **丽莎** 15:09

    有，就在我包里。不过我在图书馆，要待到晚上。你知道图书馆在哪儿吗？

    **斯塔斯** 15:10

    知道，在邮局对面。我半小时以后到。

    **丽莎** 15:11

    好。只是别打电话：这里很安静，大家都在学习。发个短信，我就出去。
  why: 第 1 题，人物意图：斯塔斯问丽莎有没有词典，又约好半小时后到图书馆，他是想从丽莎那里拿词典；他没说要买，也没说要去别墅，去图书馆是为了拿词典，不是去学习。第 2 题，细节：[мой слова́рь на да́че]{.ru}；[у Ли́зы в су́мке]{.ru} 是丽莎自己的词典，是干扰项。第 3 题，细节：斯塔斯说 [напро́тив по́чты]{.ru}；“药店对面”“地铁对面”文中都没有提到（第 37 课）。第 4 题，[тут ти́хо, все занима́ются]{.ru}：在图书馆里打电话会吵到别人，所以让他发短信。丽莎本人有手机，正在发短信，所以不是“没有电话”。第 5 题，推断：斯塔斯 15:10 说 [Бу́ду че́рез полчаса́]{.ru}，15:10 加半小时，大约 15:40 到；15:10 是他发短信的时间，16:10 是“一小时以后”，晚上是丽莎离开图书馆的时间（第 47 课）。
  items:
  - stem: Стас хо́чет ___.
    options: [купи́ть слова́рь, взять слова́рь у Ли́зы, е́хать на да́чу, занима́ться в библиоте́ке]
    answer: взять слова́рь у Ли́зы
  - stem: Слова́рь Ста́са сейча́с ___.
    options: [на да́че, у Ли́зы в су́мке, в библиоте́ке, на по́чте]
    answer: на да́че
  - stem: Библиоте́ка ___.
    options: [напро́тив апте́ки, напро́тив метро́, напро́тив по́чты, в университе́те]
    answer: напро́тив по́чты
  - stem: 'Ли́за пи́шет «Не звони́»: ___.'
    options: [у неё нет телефо́на, она́ спит, она́ на ле́кции, в библиоте́ке ти́хо]
    answer: в библиоте́ке ти́хо
  - stem: Стас бу́дет о́коло библиоте́ки ___.
    options: ['в 15.10', 'в 15.40', 'в 16.10', ве́чером]
    answer: 'в 15.40'
