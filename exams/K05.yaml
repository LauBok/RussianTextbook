    - спроси́ть, что лю́бит Оле́г
    - спроси́ть, когда́ у Оле́га день рожде́ния
    - купи́ть кни́гу о футбо́ле
    answer: спроси́ть, что лю́бит Оле́г
  - stem: Футбо́л лю́бит ___.
