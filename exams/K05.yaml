    answer: она́ уже́ есть у Оле́га
  - stem: Вме́сто коня́ у Оле́га стои́т ___.
    options: [кусо́к хле́ба, ключ, кусо́к са́хара, ру́чка]
    answer: кусо́к са́хара
  - stem: На день рожде́ния Оле́га Ю́ра ку́пит ___.
    options: [кни́гу о футбо́ле, кни́гу о ша́хматах, кусо́к са́хара, ша́хматы]
    answer: ша́хматы
- id: e7
  type: fill
  task: 语法填空：阅读下面的启事，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Забы́ла су́мку в авто́бусе!**

    Вчера́, (1) []{.blank} (пя́тый) ма́рта, ве́чером я (2) []{.blank} (забы́ть) су́мку в (3) []{.blank} (авто́бус) № 15. Э́то бы́ло в (4) []{.blank} (во́семь, час), на остано́вке «Парк».

    Су́мка чёрная, ста́рая. В ней мой слова́рь, а без (5) []{.blank} (он) я не могу́ занима́ться: в (6) []{.blank} (пя́тница) у меня́ контро́льная. Ещё там ключи́ от кварти́ры, и сейча́с я (7) []{.blank} (жить) у (8) []{.blank} (сестра́).

    Мо́жет быть, вы ви́дели су́мку? (9) []{.blank} (звони́ть), пожа́луйста: 8-916-245-17-30.

    Ли́да, студе́нтка (10) []{.blank} (пе́рвый курс)
    :::
