- id: e6
  type: choice
  task: 阅读理解（四）：阅读下面的电话交谈，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Ю́ра]{.sp} Ма́ша, приве́т! Ты мо́жешь сейча́с говори́ть?

    [Ма́ша]{.sp} Могу́. А что?

    [Ю́ра]{.sp} Я в кни́жном магази́не. В пя́тницу у Оле́га день рожде́ния, а я не зна́ю, что купи́ть. Тут есть больша́я краси́вая кни́га о футбо́ле. Он лю́бит футбо́л, пра́вда?

    [Ма́ша]{.sp} Футбо́л лю́бит его́ брат. А Оле́г игра́ет в ша́хматы, и о́чень хорошо́.

    [Ю́ра]{.sp} Ша́хматы… Сейча́с посмотрю́. Вот: «Ша́хматы. Уро́ки чемпио́на». Хоро́шая кни́га, то́лько дорога́я.

    [Ма́ша]{.sp} Подожди́. Она́ се́рая, больша́я?

    [Ю́ра]{.sp} Да.

    [Ма́ша]{.sp} Не покупа́й. Я неде́лю наза́д была́ у Оле́га — она́ лежи́т у него́ на столе́.

    [Ю́ра]{.sp} Ну вот! А что тогда́?

    [Ма́ша]{.sp} Зна́ешь, ша́хматы у него́ ста́рые. Одного́ коня́ нет, и вме́сто коня́ у него́ стои́т кусо́к са́хара. В магази́не есть ша́хматы?

    [Ю́ра]{.sp} Есть, вон там. Краси́вые!

    [Ма́ша]{.sp} Вот и отли́чно.

    [Ю́ра]{.sp} Беру́! Спаси́бо, Ма́ша!
    :::
  glossary:
  - {ru: кни́жный магази́н, pos: m, zh: 书店}
  - {ru: чемпио́н, pos: m, zh: 冠军}
  - {ru: подожди́, zh: 等一下（命令式）}
  - {ru: конь, pos: m, zh: （国际象棋的）马}
  passage_zh: |
    [尤拉]{.sp} 玛莎，你好！你现在方便说话吗？

    [玛莎]{.sp} 方便。怎么了？

    [尤拉]{.sp} 我在书店。星期五是奥列格的生日，我不知道买什么好。这儿有一本又大又漂亮的足球书。他喜欢足球，对吧？

    [玛莎]{.sp} 喜欢足球的是他哥哥。奥列格下国际象棋，下得很好。

    [尤拉]{.sp} 象棋……我这就看看。有了：《国际象棋：冠军的课》。书不错，就是贵。

    [玛莎]{.sp} 等一下。是灰色的、大开本的吗？

    [尤拉]{.sp} 对。

    [玛莎]{.sp} 别买。我一个星期前去过奥列格家——这本书就放在他桌上。

    [尤拉]{.sp} 唉！那买什么呢？

    [玛莎]{.sp} 你知道吗，他的棋很旧了。少了一个马，他拿一块方糖代替。店里有象棋吗？

    [尤拉]{.sp} 有，就在那边。挺漂亮的！

    [玛莎]{.sp} 那正好。

    [尤拉]{.sp} 就买它！谢谢你，玛莎！
  why: 第 1 题，人物意图：尤拉打电话是因为奥列格要过生日，他 [не зна́ет, что купи́ть]{.ru}，想问问熟悉奥列格的玛莎；书店在哪里、奥列格哪天过生日他都知道，足球书是他自己提出来的。第 2 题，细节：[Футбо́л лю́бит его́ брат]{.ru}，尤拉以为奥列格喜欢足球，这是干扰项。第 3 题，推断：玛莎说这本书“就放在奥列格桌上”，说明他已经有了；书贵是尤拉提到的，但玛莎让他别买并不是因为贵（第 42 课 [неде́лю наза́д]{.ru}、第 47 课）。第 4 题，细节：[вме́сто коня́ у него́ стои́т кусо́к са́хара]{.ru}（第 45 课 [вме́сто]{.ru}）。第 5 题，推断：玛莎问店里有没有象棋，尤拉说有，很漂亮，接着说 [Беру́!]{.ru}，他要买的是象棋；两本书都被否定了，方糖是旧棋里代替马的东西。
  items:
  - stem: Ю́ра звони́т. Он хо́чет ___.
    options:
