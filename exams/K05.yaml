lesson: K05
heading: 第五套
range: L01-L49
names: [Дени́с, Ко́ля, Све́та, Ви́тя, Каза́нь, Татья́на Петро́вна, Ве́ра, Ни́на Па́вловна, Глеб, Ле́на, Ири́на, Ва́ся, Пеки́н, Ита́лия]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：别人问路，回答要指出地点：[Вон там, напро́тив апте́ки]{.ru}；[Пожа́луйста, Спаси́бо, Ничего́]{.ru} 都没有回答“邮局在哪儿”（第 37、46 课）。第 2 题：[за́втра]{.ru} 说的是将来，主语 [контро́льная рабо́та]{.ru} 是阴性单数，用 [бу́дет]{.ru}；[была́]{.ru} 是过去时，[бу́дут]{.ru} 是复数（第 41 课）。第 3 题：上课迟到，是因为起得晚：[встал]{.ru}；“坐下、回答、放”都和“晚”连不成迟到的原因（第 44 课）。第 4 题：回答“昨天看完了，你可以拿去”，说明书已经读完，问的是结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 不表示读完，[чита́ешь, прочита́ешь]{.ru} 不是已经发生的事（第 42 课）。第 5 题：后半句“我们找了很久”，说明钥匙丢了：[потеря́л]{.ru}；买来的、拿走的、做好的东西用不着找很久（第 45 课）。第 6 题：[сего́дня ве́чером]{.ru} 是将来，又保证一定读完，用完成体将来时 [прочита́ю]{.ru}；[прочита́л, чита́л]{.ru} 是过去时，[чита́ю]{.ru} 是现在时（第 43 课）。第 7 题：[В како́м ме́сяце?]{.ru} 回答“在几月”，用 [в]{.ru} + 第六格：[в ию́ле]{.ru}；[в ию́ль]{.ru} 误用第四格（那是星期的说法 [в суббо́ту]{.ru}），[ию́ля]{.ru} 是说具体日期时的第二格（[пя́того ию́ля]{.ru}），月份不和 [на]{.ru} 连用（第 29、48 课）。第 8 题：词典现在不在原处，被弟弟拿去做功课了，是动作的结果，用完成体 [взял]{.ru}；[брал]{.ru} 表示拿过（又还回来了），[возьмёт, берёт]{.ru} 不是已经发生的事（第 44 课）。第 9 题：散步走了很久，所以现在很饿：[гуля́ли]{.ru}；“睡了很久、读了很久、打了很久电话”和饿没有关系（第 17 课）。第 10 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ю]{.ru}；[куплю́, ку́пим]{.ru} 是完成体将来时，[купи́л]{.ru} 是一次的动作（第 45 课）。第 11 题：[за́втра]{.ru} 是一次具体的出行，坐电气火车朝一个方向去，用乘车的定向动词；现在时 [е́дем]{.ru} 可以表示已经安排好的将来。[е́здим]{.ru} 表示经常往返，[идём, хо́дим]{.ru} 是步行，和 [на электри́чке]{.ru} 矛盾（第 24、25 课）。第 12 题：对老师要用 [вы]{.ru} 的命令式 [повтори́те]{.ru}；[повтори́]{.ru} 是对 [ты]{.ru} 说的（第 46 课）。第 13 题：对方说忘带笔了，最自然的回应是把自己的笔借给他：[Возьми́ мою́]{.ru}；其他三句都答非所问（第 44、46 课）。第 14 题：“现在一点，我们还有时间”，课要晚一些才开始，“在两点”用 [в два часа́]{.ru}；[час наза́д]{.ru} 和“还有时间”矛盾，[в час]{.ru} 就是现在，没有 [в]{.ru} 的 [два часа́]{.ru} 不能作时间状语（第 47 课）。第 15 题：[сейча́с]{.ru} 说的是此刻朝一个方向去，用定向动词 [идёшь]{.ru}；[хо́дишь]{.ru} 表示经常去（第 24、25 课）。第 16 题：音乐会七点开始，现在六点，是“一小时以后”：[че́рез час]{.ru}；[наза́д]{.ru} 表示“以前”，而且放在时间词组后面（第 47 课）。第 17 题：[бу́ду]{.ru} + 不定式构成未完成体将来时，只能接未完成体不定式 [смотре́ть]{.ru}；*[бу́ду посмотре́ть]{.ru} 是常见错误，完成体自己就有将来时 [посмотрю́]{.ru}；[бу́ду]{.ru} 后面也不能接变位形式 [смотрю́, смотре́л]{.ru}（第 41、43 课）。第 18 题：新年是一月一日，“在哪一天”用第二格 [пе́рвого января́]{.ru}；其他日期都不是新年（第 48、49 课）。第 19 题：[пять]{.ru} 后面用复数第二格，[год]{.ru} 的这个形式是 [лет]{.ru}，要单独记；[го́да]{.ru} 用于 2–4，[год]{.ru} 用于 1，[годо́в]{.ru} 是按 [часо́в]{.ru} 类推出来的错误形式（第 35、38、47 课）。第 20 题：“在几号”，序数词和月份都用第二格，不加前置词：[пя́того ма́я]{.ru}；[пя́тое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 21 题：表示人不在某处用 [нет]{.ru} + 第二格：[Ве́ры нет до́ма]{.ru}（第 32 课）。第 22 题：[два́дцать]{.ru} 后面用复数第二格，[челове́к]{.ru} 的复数第二格和单数第一格同形（第 35 课）。第 23 题：“还在学院读书”是学生的身份，用 [учи́ться]{.ru}：[учу́сь]{.ru}；[учу́]{.ru} 要带宾语，[занима́юсь]{.ru} 指用功、做功课，[нахожу́сь]{.ru} 表示位置（第 38 课）。第 24 题：数词最后一个词是 [оди́н]{.ru}，用单数第一格 [рубль]{.ru}（第 39 课）。第 25 题：对方道歉，回答“没关系”：[Ничего́]{.ru}；[Пожа́луйста]{.ru} 用于回答道谢，[Спаси́бо]{.ru} 是道谢，[Пока́]{.ru} 是告别。中文“不客气”“没关系”分得清，俄语里最容易把 [Пожа́луйста]{.ru} 用错地方（第 4、7 课）。
  items:
  - stem: — Извини́те, вы не зна́ете, где здесь по́чта? — ___
    options: [Пожа́луйста., Спаси́бо., Ничего́., 'Вон там, напро́тив апте́ки.']
    answer: 'Вон там, напро́тив апте́ки.'
  - stem: За́втра у нас ___ контро́льная рабо́та, и сего́дня я до́лго занима́юсь.
    options: [бу́дет, была́, бу́дут, бу́ду]
    answer: бу́дет
  - stem: 'Сего́дня я опозда́л на уро́к: я ___ по́здно.'
    options: [сел, встал, отве́тил, поста́вил]
    answer: встал
  - stem: — Ты уже́ ___ рома́н? — Да, вчера́. Мо́жешь взять его́.
    options: [чита́л, чита́ешь, прочита́л, прочита́ешь]
    answer: прочита́л
  - stem: Па́па ___ ключи́, и мы до́лго их иска́ли.
    options: [потеря́л, купи́л, взял, сде́лал]
    answer: потеря́л
  - stem: Э́тот расска́з дли́нный, но я ___ его́ сего́дня ве́чером, че́стное сло́во!
    options: [прочита́л, чита́ю, чита́л, прочита́ю]
    answer: прочита́ю
  - stem: — В како́м ме́сяце вы е́дете домо́й? — ___
    options: [В ию́ль., Ию́ля., В ию́ле., На ию́ле.]
    answer: В ию́ле.
  - stem: '— Где мой слова́рь? — Его́ ___ брат: он сейча́с де́лает уро́ки.'
    options: [брал, взял, возьмёт, берёт]
    answer: взял
  - stem: Вчера́ мы до́лго ___ в па́рке, и тепе́рь мы о́чень хоти́м есть.
    options: [гуля́ли, спа́ли, чита́ли, звони́ли]
    answer: гуля́ли
  - stem: Ка́ждое у́тро я ___ све́жий хлеб в бу́лочной.
    options: [куплю́, покупа́ю, купи́л, ку́пим]
    answer: покупа́ю
  - stem: За́втра у́тром мы ___ на да́чу на электри́чке.
    options: [е́здим, хо́дим, идём, е́дем]
    answer: е́дем
  - stem: Татья́на Петро́вна, ___, пожа́луйста, э́то сло́во ещё раз.
    options: [повтори́, повтори́ть, повтори́те, повтори́л]
    answer: повтори́те
  - stem: — Я забы́л ру́чку! — ___
    options: [Возьми́ мою́., Ничего́ не забы́л., Как интере́сно!, Спаси́бо.]
    answer: Возьми́ мою́.
  - stem: 'Сейча́с час, а уро́к начина́ется ___: у нас ещё есть вре́мя.'
    options: [час наза́д, в час, два часа́, в два часа́]
    answer: в два часа́
  - stem: — Куда́ ты сейча́с ___? — В апте́ку.
    options: [хо́дишь, идёшь, иду́, ходи́ть]
    answer: идёшь
  - stem: 'Сейча́с шесть часо́в. Конце́рт начнётся ___ час: в семь.'
    options: [наза́д, в, че́рез, до]
    answer: че́рез
  - stem: Ве́чером я бу́ду ___ телеви́зор.
    options: [посмотре́ть, смотрю́, смотре́ть, смотре́л]
    answer: смотре́ть
  - stem: Моя́ сестра́ родила́сь ___, в Но́вый год.
    options: [в декабре́, пе́рвого января́, в ма́рте, тридца́того ию́ня]
    answer: пе́рвого января́
  - stem: Мой брат живёт в Москве́ уже́ пять ___.
    options: [го́да, лет, год, годо́в]
    answer: лет
  - stem: Конце́рт бу́дет ___.
    options: [пя́тое ма́я, в пя́тое ма́я, пя́того ма́я, в пя́том ма́е]
    answer: пя́того ма́я
  - stem: — Ве́ра до́ма? — Нет, ___ нет до́ма.
    options: [Ве́ра, Ве́ру, Ве́ры, Ве́ре]
    answer: Ве́ры
  - stem: В авто́бусе бы́ло два́дцать ___.
    options: [челове́ка, лю́ди, люде́й, челове́к]
    answer: челове́к
  - stem: — Ты уже́ рабо́таешь? — Нет, я ещё ___ в институ́те.
    options: [учу́сь, учу́, занима́юсь, нахожу́сь]
    answer: учу́сь
  - stem: Э́та кни́га сто́ит пятьдеся́т оди́н ___.
    options: [рубля́, рубль, рубле́й, рубли́]
    answer: рубль
  - stem: — Извини́те, я опозда́л! — ___
    options: [Пожа́луйста., Спаси́бо., Пока́., Ничего́.]
    answer: Ничего́.
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Торт**

    Сего́дня (1) []{.blank} ма́рта, а за́втра, деся́того, у ма́мы день рожде́ния. За́втра ве́чером мы бу́дем у́жинать вме́сте. Па́па пригото́вит у́жин, мла́дший брат (2) []{.blank} стихи́, а я куплю́ торт.

    Бу́лочная о́коло метро́ открыва́ется в семь часо́в, и сего́дня я (3) []{.blank} ра́но. Но в бу́лочной уже́ была́ дли́нная (4) []{.blank}. Я (5) []{.blank} два́дцать мину́т. Наконе́ц я (6) []{.blank} большо́й краси́вый торт. Я поста́вила его́ на стол на ку́хне, а пото́м до ве́чера была́ в университе́те.

    Ве́чером я (7) []{.blank} домо́й и уви́дела: на столе́ то́лько полови́на то́рта! На ку́хне сиде́л брат. «Извини́! — сказа́л он. — Я (8) []{.blank} кусо́к, пото́м ещё оди́н… Торт был о́чень (9) []{.blank}! Я (10) []{.blank}: за́втра у ма́мы день рожде́ния!»

    Что де́лать? Бу́лочная уже́ не (11) []{.blank}: она́ закрыва́ется в семь часо́в. Но суперма́ркет напро́тив до́ма рабо́тает кру́глые су́тки. «Я сейча́с (12) []{.blank} но́вый торт!» — сказа́л брат. Он верну́лся че́рез (13) []{.blank}. Но́вый торт был не тако́й большо́й, но то́же о́чень (14) []{.blank}.

    А стихи́ брат ещё не (15) []{.blank}. «Я напишу́ их сего́дня но́чью. Че́стное сло́во!» — говори́т он. Ма́ма сего́дня вернётся (16) []{.blank}, в оди́ннадцать часо́в. Сейча́с она́ ещё на рабо́те и не (17) []{.blank} о то́рте. За́втра ве́чером она́ (18) []{.blank} но́вый торт и бу́дет слу́шать стихи́. А полови́ну ста́рого то́рта мы (19) []{.blank} сего́дня. «Отли́чно! — говори́т брат. — Я о́чень (20) []{.blank} э́тот торт!»
    :::
  passage_zh: |
    **蛋糕**

    今天是三月九日，明天，十日，是妈妈的生日。明天晚上我们要一起吃晚饭。爸爸做晚饭，弟弟写一首诗，我去买蛋糕。

    地铁站旁边的面包店七点开门，所以今天我起得很早。可是面包店里已经排起了长队。我等了二十分钟，终于买到了一个又大又漂亮的蛋糕。我把它放在厨房的桌子上，然后一直到晚上都在学校。

    晚上我回到家，一看：桌上只剩下半个蛋糕了！弟弟坐在厨房里。“对不起！”他说，“我吃了一块，后来又吃了一块……蛋糕太好吃了！我忘了：明天是妈妈的生日！”

    怎么办？面包店已经不营业了：它七点关门。可是家对面的超市昼夜营业。“我这就去买个新蛋糕！”弟弟说。半小时以后他回来了。新蛋糕没有原来那个大，可也很漂亮。

    诗弟弟还没写好。“我今天夜里就写，说话算数！”他说。妈妈今天回来得晚，要到十一点。她现在还在上班，还不知道蛋糕的事。明天晚上她会看到新蛋糕，还会听弟弟念诗。那半个旧蛋糕我们今天就吃掉。“太好了！”弟弟说，“我特别喜欢这个蛋糕！”
  why: 第 1 空：后半句说“明天是十日”，今天就是九日：[девя́тое]{.ru}；其他日期都和“明天十日”对不上。第 2 空：倒数第二段说 [стихи́ брат ещё не …]{.ru}，弟弟又说“今天夜里我就写”，可见他的任务是写诗：[напи́шет]{.ru}；“吃诗、做诗（饭）、丢诗”都不通。第 3 空：面包店七点就开门，为了买蛋糕“我”起得早：[вста́ла]{.ru}；[опозда́ла … ра́но]{.ru} 自相矛盾，“早早地忘了、回答了”不通。第 4 空：[Но]{.ru} 转折：起得早，可还是有人比“我”早，排着长队：[о́чередь]{.ru}；下一句“我等了二十分钟”也说明是在排队。第 5 空：排队就是“等”：[ждала́]{.ru}；在队里不会睡觉、散步、游泳。第 6 空：[Наконе́ц]{.ru}“终于”，排完队“买到了”蛋糕：[купи́ла]{.ru}；后文蛋糕放在家里的桌上，所以没有吃掉也没有丢，面包店里也不能自己做。第 7 空：“我”整天在学校，晚上“回到家”：[верну́лась]{.ru}；“起床、回答、忘记”都不能带 [домо́й]{.ru}。第 8 空：桌上只剩下半个蛋糕，是弟弟“吃了”一块又一块：[съел]{.ru}；“买了、做了、看了一块”都解释不了蛋糕少了一半。第 9 空：弟弟解释为什么吃了那么多：蛋糕太“好吃”了：[вку́сный]{.ru}；难吃、旧的、蓝色的都不会让人一块接一块地吃。第 10 空：弟弟道歉，说明他吃的时候没想起明天是妈妈的生日：[забы́л]{.ru}；说“我记得、我知道”就和道歉矛盾。第 11 空：冒号后是原因：面包店七点关门，现在已是晚上，所以“已经不营业了”：[рабо́тает]{.ru}；后一句 [Но суперма́ркет … рабо́тает кру́глые су́тки]{.ru} 正是和它对比。第 12 空：超市整夜营业，弟弟要去“买”新蛋糕：[куплю́]{.ru}；“吃、读、忘记”新蛋糕都不是补救办法。第 13 空：超市就在家对面，很快就回来了：[полчаса́]{.ru}；一周、一个月、一年都不合情理。第 14 空：[то́же]{.ru}“也”指的是第二段说过的旧蛋糕的特点 [большо́й краси́вый]{.ru}；新蛋糕“没有那么大”，但“也很漂亮”：[краси́вый]{.ru}。说“也很小”和前半句重复且不成对比，“也很难吃”“也很凉”文中没提过。第 15 空：弟弟说“我今天夜里就写”，说明诗还没“写好”：[написа́л]{.ru}；“还没买、还没吃、还没丢”都和后一句接不上。第 16 空：同位语 [в оди́ннадцать часо́в]{.ru} 是晚上很晚的时间：[по́здно]{.ru}；[ра́но]{.ru} 正好相反，[вчера́, давно́]{.ru} 不能和将来时 [вернётся]{.ru} 连用。第 17 空：妈妈还在上班，蛋糕的事她“不知道”：[не зна́ет о то́рте]{.ru}；这正是大家松一口气的原因。“不读、不吃、不写关于蛋糕”都说不通。第 18 空：明天晚上她会“看到”新蛋糕：[уви́дит]{.ru}；“忘记、写、背”蛋糕都不通。第 19 空：吃剩的半个旧蛋糕今天“吃掉”：[съеди́м]{.ru}；它已经买来了，不用再买，“写、忘记”蛋糕不通。第 20 空：弟弟听说今天还能吃旧蛋糕，高兴地说“我特别喜欢这个蛋糕”：[люблю́]{.ru}，呼应他前面一块接一块地吃；“找、做、买”都不合，蛋糕就在眼前，也不是他做的。
  items:
  - options: [восьмо́е, девя́тое, деся́тое, оди́ннадцатое]
    answer: девя́тое
  - options: [напи́шет, съест, пригото́вит, потеря́ет]
    answer: напи́шет
  - options: [опозда́ла, забы́ла, вста́ла, отве́тила]
    answer: вста́ла
  - options: [ко́мната, о́чередь, у́лица, ле́кция]
    answer: о́чередь
  - options: [спала́, гуля́ла, ждала́, пла́вала]
    answer: ждала́
  - options: [купи́ла, съе́ла, потеря́ла, пригото́вила]
    answer: купи́ла
  - options: [вста́ла, отве́тила, забы́ла, верну́лась]
    answer: верну́лась
  - options: [съел, купи́л, пригото́вил, посмотре́л]
    answer: съел
  - options: [плохо́й, ста́рый, си́ний, вку́сный]
    answer: вку́сный
  - options: [по́мнил, забы́л, знал, сказа́л]
    answer: забы́л
  - options: [открыва́ется, спит, рабо́тает, ждёт]
    answer: рабо́тает
  - options: [куплю́, съем, прочита́ю, забу́ду]
    answer: куплю́
  - options: [неде́лю, ме́сяц, полчаса́, год]
    answer: полчаса́
  - options: [плохо́й, краси́вый, ма́ленький, холо́дный]
    answer: краси́вый
  - options: [купи́л, съел, потеря́л, написа́л]
    answer: написа́л
  - options: [по́здно, ра́но, вчера́, давно́]
    answer: по́здно
  - options: [чита́ет, ест, зна́ет, пи́шет]
    answer: зна́ет
  - options: [забу́дет, уви́дит, напи́шет, вы́учит]
    answer: уви́дит
  - options: [ку́пим, напи́шем, забу́дем, съеди́м]
    answer: съеди́м
  - options: [ищу́, люблю́, гото́влю, покупа́ю]
    answer: люблю́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Электри́чка**

    В суббо́ту на́ша гру́ппа е́хала на экску́рсию в Се́ргиев Поса́д. Электри́чка была́ в семь часо́в утра́. В пя́тницу Дени́с ду́мал: «За́втра я вста́ну в шесть». Но ве́чером он до́лго смотре́л фильм и встал то́лько в семь. Он опозда́л на электри́чку.

    Дени́с сра́зу взял телефо́н. Преподава́тель сказа́л: «Ничего́! Друга́я электри́чка бу́дет че́рез час. Мы бу́дем ждать тебя́ о́коло ла́вры».

    В электри́чке Дени́с два часа́ чита́л кни́гу о ла́вре. В де́сять часо́в он был о́коло ла́вры. Гру́ппа уже́ ждала́ его́ там.

    Экскурсово́д расска́зывал о ла́вре, но мно́гие студе́нты понима́ли его́ пло́хо: он говори́л о́чень бы́стро. А Дени́с всё по́нял. Пото́м студе́нты спра́шивали Дени́са, и он всё объясни́л.

    Ве́чером преподава́тель сказа́л: «Дени́с, ты опозда́л, но ты молоде́ц!»
    :::
  passage_zh: |
    **电气火车**

    星期六我们班去谢尔吉耶夫镇参观。电气火车早上七点开。星期五杰尼斯想：“明天我六点起床。”可是晚上他看了很久的电影，七点才起床。他没赶上火车。

    杰尼斯马上拿起电话。老师说：“没关系！一小时以后还有一趟车。我们在大修道院旁边等你。”

    在火车上杰尼斯看了两个小时的书，是一本介绍大修道院的书。十点他到了大修道院旁边，全班已经在那里等他了。

    讲解员介绍大修道院，可是很多同学听不太懂：他说得太快了。而杰尼斯全都听懂了。后来同学们问杰尼斯，他把什么都解释清楚了。

    晚上老师说：“杰尼斯，你迟到了，可你真棒！”
  why: 第 1 题，[Электри́чка была́ в семь часо́в утра́]{.ru}；六点是杰尼斯打算起床的时间，七点他才起来。第 2 题，[Но ве́чером он до́лго смотре́л фильм и встал то́лько в семь]{.ru}；介绍大修道院的书是他第二天在火车上看的。第 3 题，老师说 [Мы бу́дем ждать тебя́ о́коло ла́вры]{.ru}，后面又说 [Гру́ппа уже́ ждала́ его́ там]{.ru}。第 4 题，[он говори́л о́чень бы́стро]{.ru}。第 5 题要推断：文中没有直接说原因，但前面交代了他在火车上看了两个小时介绍大修道院的书，所以讲解员说得快他也能听懂；讲解员并没有说得慢，老师也没有讲解，文中没说他以前来过。
  items:
  - stem: Электри́чка в Се́ргиев Поса́д была́ ___.
    options: [в семь часо́в, в шесть часо́в, в во́семь часо́в, в де́сять часо́в]
    answer: в семь часо́в
  - stem: 'Дени́с встал по́здно: в пя́тницу ве́чером он ___.'
    options: [чита́л кни́гу о ла́вре, был на экску́рсии, до́лго смотре́л фильм, игра́л в футбо́л]
    answer: до́лго смотре́л фильм
  - stem: Гру́ппа ждала́ Дени́са ___.
    options: [на ста́нции, в электри́чке, в Москве́, о́коло ла́вры]
    answer: о́коло ла́вры
  - stem: 'Мно́гие студе́нты пло́хо понима́ли экскурсово́да: ___.'
    options: [он говори́л по-англи́йски, он говори́л о́чень бы́стро, он говори́л ма́ло, он опозда́л]
    answer: он говори́л о́чень бы́стро
  - stem: 'Дени́с всё по́нял: ___.'
    options: [в электри́чке он чита́л кни́гу о ла́вре, экскурсово́д говори́л ме́дленно, он ра́ньше был в ла́вре, преподава́тель всё объясни́л]
    answer: в электри́чке он чита́л кни́гу о ла́вре
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的留言，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    Вто́рник, два часа́

    Ко́ля!

    Я на рабо́те, в апте́ке. До́ма я бу́ду в семь часо́в. Па́па сего́дня рабо́тает до́лго и бу́дет до́ма то́лько в де́вять. Све́та на конце́рте в консервато́рии, она́ вернётся по́здно, в оди́ннадцать часо́в. Ба́бушка в поликли́нике, она́ вернётся в пять.

    Обе́д на ку́хне: ка́ша и сы́рники. Чай на столе́.

    По́сле обе́да сде́лай, пожа́луйста, уро́ки. Не забу́дь: за́втра у тебя́ контро́льная рабо́та! И не игра́й до́лго в компью́тер.

    Пото́м купи́ хлеб и молоко́ в суперма́ркете о́коло метро́. Магази́н напро́тив до́ма сего́дня не рабо́тает.

    У́тром звони́л дя́дя Ви́тя из Каза́ни. В суббо́ту у него́ день рожде́ния. Он бу́дет в Москве́, и в суббо́ту мы все вме́сте е́дем на да́чу: там бу́дет пра́здник.

    Ма́ма
    :::
  passage_zh: |
    星期二，两点

    科利亚：

    我在上班，在药店。我七点到家。爸爸今天工作时间长，九点才到家。斯薇塔在音乐学院听音乐会，她很晚才回来，十一点。奶奶在诊所，五点回来。

    午饭在厨房里：麦片粥和奶渣饼。茶在桌子上。

    吃完午饭请把功课做完。别忘了：明天你有测验！还有，别玩太久的电脑。

    然后到地铁站旁边的超市买面包和牛奶。家对面的商店今天不营业。

    早上喀山的维佳叔叔打来电话。星期六是他的生日。他会来莫斯科，星期六我们大家一起去别墅：在那里过节。

    妈妈
  why: 第 1 题，[До́ма я бу́ду в семь часо́в]{.ru}，写留言的是妈妈；九点到家的是爸爸，五点回来的是奶奶。第 2 题，[Све́та … вернётся по́здно, в оди́ннадцать часо́в]{.ru}。第 3 题，妈妈让他去 [в суперма́ркете о́коло метро́]{.ru}，并说明家对面的商店今天不营业。第 4 题，留言写于星期二，[за́втра у тебя́ контро́льная рабо́та]{.ru}，所以测验在星期三；这道题要从日期推算。第 5 题，[в суббо́ту мы все вме́сте е́дем на да́чу]{.ru}；喀山是叔叔住的地方，是他来莫斯科，不是他们去喀山。
  items:
  - stem: Ма́ма бу́дет до́ма ___.
    options: [в де́вять часо́в, в оди́ннадцать часо́в, в пять часо́в, в семь часо́в]
    answer: в семь часо́в
  - stem: По́здно ве́чером, в оди́ннадцать часо́в, домо́й вернётся ___.
    options: [па́па, ба́бушка, Све́та, ма́ма]
    answer: Све́та
  - stem: Хлеб и молоко́ Ко́ля ку́пит ___.
    options: [в бу́лочной, в магази́не напро́тив до́ма, в суперма́ркете о́коло метро́, на ры́нке]
    answer: в суперма́ркете о́коло метро́
  - stem: Контро́льная рабо́та у Ко́ли бу́дет в ___.
    options: [вто́рник, сре́ду, четве́рг, пя́тницу]
    answer: сре́ду
  - stem: В суббо́ту семья́ Ко́ли ___.
    options: [бу́дет до́ма, е́дет в Каза́нь, бу́дет в шко́ле, е́дет на да́чу]
    answer: е́дет на да́чу
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的通知，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Экску́рсия в Се́ргиев Поса́д**

    Дороги́е студе́нты!

    Два́дцать пя́того октября́, в суббо́ту, мы е́дем на экску́рсию в Се́ргиев Поса́д. Э́то о́чень краси́вый стари́нный го́род. Там нахо́дится Тро́ице-Се́ргиева ла́вра, большо́й ста́рый монасты́рь.

    | | |
    |---|---|
    | 7.30 | авто́бус у зда́ния филологи́ческого факульте́та |
    | 10.00 | экску́рсия в ла́вре |
    | 13.00 | обе́д |
    | 14.00—16.00 | гуля́ем в го́роде |
    | 19.00 | Москва́ |

    Авто́бус ждёт вас у зда́ния филологи́ческого факульте́та. Не опа́здывайте: в семь три́дцать авто́бус уже́ е́дет!

    Экскурсово́д расска́жет о ла́вре и пока́жет ста́рые це́ркви. Он бу́дет говори́ть по-ру́сски ме́дленно, и вы всё поймёте! По́сле обе́да вы уви́дите ста́рые у́лицы го́рода. Там вы мо́жете гуля́ть и купи́ть пода́рки: матрёшки и́ли откры́тки.

    Биле́т на авто́бус сто́ит девяно́сто рубле́й, а экску́рсия в ла́вре — пятьдеся́т рубле́й. Обе́д возьми́те из до́ма: хлеб, сы́рники, чай.

    В авто́бусе мы бу́дем слу́шать ру́сскую му́зыку. Телефо́н преподава́теля: 123-45-67. Мы ждём вас!
    :::
  passage_zh: |
    **谢尔吉耶夫镇一日游**

    亲爱的同学们！

    十月二十五日星期六，我们去谢尔吉耶夫镇参观。这是一座非常美丽的古城。圣三一谢尔吉大修道院就在那里，这是一座很大的古老修道院。

    | | |
    |---|---|
    | 7:30 | 语文系大楼前上车 |
    | 10:00 | 参观大修道院 |
    | 13:00 | 午饭 |
    | 14:00—16:00 | 城里自由活动 |
    | 19:00 | 回到莫斯科 |

    大巴在语文系大楼前等大家。不要迟到：七点半大巴就开车了！

    讲解员会介绍大修道院，带大家看古老的教堂。他会用俄语慢慢讲，大家都能听懂！午饭后大家会看到这座城市的老街道。在那里可以逛逛，买些礼物：套娃或明信片。

    大巴车票九十卢布，大修道院的参观五十卢布。午饭请自己从家里带：面包、奶渣饼、茶。

    在大巴上我们会听俄罗斯音乐。带队老师的电话：123-45-67。我们等着大家！
