lesson: K05
heading: 第五套
range: L01-L49
names: [Дени́с, Ко́ля, Све́та, Ви́тя, Каза́нь, Татья́на Петро́вна, Ве́ра, Ни́на Па́вловна, Глеб, Ле́на, Ири́на, Ва́ся, Пеки́н, Ита́лия, Че́хов, Ва́нька]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[напро́тив]{.ru} 要求第二格：[напро́тив апте́ки]{.ru}；第一格、第六格、第四格都是常见错误（第 37 课）。第 2 题：[за́втра]{.ru} 说的是将来，主语 [контро́льная рабо́та]{.ru} 是阴性单数，用 [бу́дет]{.ru}；[была́]{.ru} 是过去时，[бу́дут]{.ru} 是复数（第 41 课）。第 3 题：说的是今天这一次起得晚、因而迟到，是已经发生的一次具体动作，用完成体过去时 [встал]{.ru}；[вста́ну]{.ru} 是将来时，[встать]{.ru} 是不定式，不能作谓语；[опозда́л]{.ru} 说明说话人是男性，所以不用 [вста́ла]{.ru}（第 44 课）。第 4 题：回答“昨天看完了，你可以拿去”，说明书已经读完，问的是结果，用完成体过去时 [прочита́л]{.ru}；[чита́л]{.ru} 不表示读完，[чита́ешь, прочита́ешь]{.ru} 不是已经发生的事（第 42 课）。第 5 题：后半句“我们找了很久”，说明钥匙丢了：[потеря́л]{.ru}；买来的、拿走的、做好的东西用不着找很久（第 45 课）。第 6 题：[сего́дня ве́чером]{.ru} 是将来，又保证一定读完，用完成体将来时 [прочита́ю]{.ru}；[прочита́л, чита́л]{.ru} 是过去时，[чита́ю]{.ru} 是现在时（第 43 课）。第 7 题：[В како́м ме́сяце?]{.ru} 回答“在几月”，用 [в]{.ru} + 第六格：[в ию́ле]{.ru}；[в ию́ль]{.ru} 误用第四格（那是星期的说法 [в суббо́ту]{.ru}），[ию́ля]{.ru} 是说具体日期时的第二格（[пя́того ию́ля]{.ru}），月份不和 [на]{.ru} 连用（第 29、48 课）。第 8 题：词典现在不在原处，被弟弟拿去做功课了，是动作的结果，用完成体 [взял]{.ru}；[брал]{.ru} 表示拿过（又还回来了），[возьмёт, берёт]{.ru} 不是已经发生的事（第 44 课）。第 9 题：散步走了很久，所以现在很饿：[гуля́ли]{.ru}；“睡了很久、读了很久、打了很久电话”和饿没有关系（第 17 课）。第 10 题：[ка́ждое у́тро]{.ru} 表示经常重复的动作，用未完成体现在时 [покупа́ю]{.ru}；[куплю́, ку́пим]{.ru} 是完成体将来时，[купи́л]{.ru} 是一次的动作（第 45 课）。第 11 题：[за́втра]{.ru} 是一次具体的出行，坐电气火车朝一个方向去，用乘车的定向动词；现在时 [е́дем]{.ru} 可以表示已经安排好的将来。[е́здим]{.ru} 表示经常往返，[идём, хо́дим]{.ru} 是步行，和 [на электри́чке]{.ru} 矛盾（第 24、25 课）。第 12 题：对老师要用 [вы]{.ru} 的命令式 [повтори́те]{.ru}；[повтори́]{.ru} 是对 [ты]{.ru} 说的（第 46 课）。第 13 题：省略的是 [ру́чку]{.ru}，[ру́чка]{.ru} 是阴性，作 [возьми́]{.ru} 的宾语用第四格，物主代词随之变成 [мою́]{.ru}；[мой, моё, мои́]{.ru} 是阳性、中性、复数的形式（第 23、46 课）。第 14 题：“现在一点，我们还有时间”，课要晚一些才开始，“在两点”用 [в два часа́]{.ru}；[час наза́д]{.ru} 和“还有时间”矛盾，[в час]{.ru} 就是现在，没有 [в]{.ru} 的 [два часа́]{.ru} 不能作时间状语（第 47 课）。第 15 题：[сейча́с]{.ru} 说的是此刻朝一个方向去，用定向动词 [идёшь]{.ru}；[хо́дишь]{.ru} 表示经常去（第 24、25 课）。第 16 题：音乐会七点开始，现在六点，是“一小时以后”：[че́рез час]{.ru}；[наза́д]{.ru} 表示“以前”，而且放在时间词组后面（第 47 课）。第 17 题：[бу́ду]{.ru} + 不定式构成未完成体将来时，只能接未完成体不定式 [смотре́ть]{.ru}；*[бу́ду посмотре́ть]{.ru} 是常见错误，完成体自己就有将来时 [посмотрю́]{.ru}；[бу́ду]{.ru} 后面也不能接变位形式 [смотрю́, смотре́л]{.ru}（第 41、43 课）。第 18 题：新年是一月一日，“在哪一天”用第二格 [пе́рвого января́]{.ru}；其他日期都不是新年（第 48、49 课）。第 19 题：[пять]{.ru} 后面用复数第二格，[год]{.ru} 的这个形式是 [лет]{.ru}，要单独记；[го́да]{.ru} 用于 2–4，[год]{.ru} 用于 1，[годо́в]{.ru} 是按 [часо́в]{.ru} 类推出来的错误形式（第 35、38、47 课）。第 20 题：“在几号”，序数词和月份都用第二格，不加前置词：[пя́того ма́я]{.ru}；[пя́тое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 21 题：表示人不在某处用 [нет]{.ru} + 第二格：[Ве́ры нет до́ма]{.ru}（第 32 课）。第 22 题：[два́дцать]{.ru} 后面用复数第二格，[челове́к]{.ru} 的复数第二格和单数第一格同形（第 35 课）。第 23 题：“还在学院读书”是学生的身份，用 [учи́ться]{.ru}：[учу́сь]{.ru}；[учу́]{.ru} 要带宾语，[занима́юсь]{.ru} 指用功、做功课，[нахожу́сь]{.ru} 表示位置（第 38 课）。第 24 题：数词最后一个词是 [оди́н]{.ru}，用单数第一格 [рубль]{.ru}（第 39 课）。第 25 题：对方道歉，回答“没关系”：[Ничего́]{.ru}；[Пожа́луйста]{.ru} 用于回答道谢，[Спаси́бо]{.ru} 是道谢，[Пока́]{.ru} 是告别。中文“不客气”“没关系”分得清，俄语里最容易把 [Пожа́луйста]{.ru} 用错地方（第 4、7 课）。
  items:
  - stem: — Извини́те, вы не зна́ете, где здесь по́чта? — ___
    options: ['Вон там, напро́тив апте́ки.', 'Вон там, напро́тив апте́ка.', 'Вон там, напро́тив апте́ке.', 'Вон там, напро́тив апте́ку.']
    answer: 'Вон там, напро́тив апте́ки.'
  - stem: За́втра у нас ___ контро́льная рабо́та, и сего́дня я до́лго занима́юсь.
    options: [бу́дет, была́, бу́дут, бу́ду]
    answer: бу́дет
  - stem: 'Сего́дня я опозда́л на уро́к: я ___ по́здно.'
    options: [встать, встал, вста́ну, вста́ла]
    answer: встал
  - stem: — Ты уже́ ___ рома́н? — Да, вчера́. Мо́жешь взять его́.
    options: [чита́л, чита́ешь, прочита́л, прочита́ешь]
    answer: прочита́л
  - stem: Па́па ___ ключи́, и мы до́лго их иска́ли.
    options: [потеря́л, купи́л, взял, сде́лал]
    answer: потеря́л
  - stem: Э́тот расска́з дли́нный, но я ___ его́ сего́дня ве́чером, че́стное сло́во!
    options: [прочита́л, чита́ю, чита́л, прочита́ю]
    answer: прочита́ю
  - stem: — В како́м ме́сяце вы е́дете домо́й? — ___
    options: [В ию́ль., Ию́ля., В ию́ле., На ию́ле.]
    answer: В ию́ле.
  - stem: '— Где мой слова́рь? — Его́ ___ брат: он сейча́с де́лает уро́ки.'
    options: [брал, взял, возьмёт, берёт]
    answer: взял
  - stem: Вчера́ мы до́лго ___ в па́рке, и тепе́рь мы о́чень хоти́м есть.
    options: [гуля́ли, спа́ли, чита́ли, звони́ли]
    answer: гуля́ли
  - stem: Ка́ждое у́тро я ___ све́жий хлеб в бу́лочной.
    options: [куплю́, покупа́ю, купи́л, ку́пим]
    answer: покупа́ю
  - stem: За́втра у́тром мы ___ на да́чу на электри́чке.
    options: [е́здим, хо́дим, идём, е́дем]
    answer: е́дем
  - stem: Татья́на Петро́вна, ___, пожа́луйста, э́то сло́во ещё раз.
    options: [повтори́, повтори́ть, повтори́те, повтори́л]
    answer: повтори́те
  - stem: — Я забы́л ру́чку! — ___
    options: [Возьми́ мою́., Возьми́ мой., Возьми́ моё., Возьми́ мои́.]
    answer: Возьми́ мою́.
  - stem: 'Сейча́с час, а уро́к начина́ется ___: у нас ещё есть вре́мя.'
    options: [час наза́д, в час, два часа́, в два часа́]
    answer: в два часа́
  - stem: — Куда́ ты сейча́с ___? — В апте́ку.
    options: [хо́дишь, идёшь, иду́, ходи́ть]
    answer: идёшь
  - stem: 'Сейча́с шесть часо́в. Конце́рт начнётся ___ час: в семь.'
    options: [наза́д, в, че́рез, до]
    answer: че́рез
  - stem: Ве́чером я бу́ду ___ телеви́зор.
    options: [посмотре́ть, смотрю́, смотре́ть, смотре́л]
    answer: смотре́ть
  - stem: Моя́ сестра́ родила́сь ___, в Но́вый год.
    options: [в декабре́, пе́рвого января́, в ма́рте, тридца́того ию́ня]
    answer: пе́рвого января́
  - stem: Мой брат живёт в Москве́ уже́ пять ___.
    options: [го́да, лет, год, годо́в]
    answer: лет
  - stem: Конце́рт бу́дет ___.
    options: [пя́тое ма́я, в пя́тое ма́я, пя́того ма́я, в пя́том ма́е]
    answer: пя́того ма́я
  - stem: — Ве́ра до́ма? — Нет, ___ нет до́ма.
    options: [Ве́ра, Ве́ру, Ве́ры, Ве́ре]
    answer: Ве́ры
  - stem: В авто́бусе бы́ло два́дцать ___.
    options: [челове́ка, лю́ди, люде́й, челове́к]
    answer: челове́к
  - stem: — Ты уже́ рабо́таешь? — Нет, я ещё ___ в институ́те.
    options: [учу́сь, учу́, занима́юсь, нахожу́сь]
    answer: учу́сь
  - stem: Э́та кни́га сто́ит пятьдеся́т оди́н ___.
    options: [рубля́, рубль, рубле́й, рубли́]
    answer: рубль
  - stem: — Извини́те, я опозда́л! — ___
    options: [Пожа́луйста., Спаси́бо., Пока́., Ничего́.]
    answer: Ничего́.
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Торт**

    Сего́дня (1) []{.blank} ма́рта, а за́втра, деся́того, у ма́мы день рожде́ния. Па́па пригото́вит у́жин, мла́дший брат (2) []{.blank} стихи́, а я куплю́ торт.

    Бу́лочная о́коло метро́ открыва́ется в семь, и я (3) []{.blank} ра́но. Но там уже́ была́ дли́нная (4) []{.blank}. Я (5) []{.blank} два́дцать мину́т и наконе́ц (6) []{.blank} большо́й краси́вый торт. Поста́вила его́ на ку́хне — и в университе́т.

    Ве́чером я (7) []{.blank} домо́й — а на столе́ полови́на то́рта! На ку́хне сиде́л брат. «Извини́! — сказа́л он. — Я (8) []{.blank} кусо́к, пото́м ещё оди́н… Он был тако́й (9) []{.blank}! Я (10) []{.blank}, что за́втра у ма́мы день рожде́ния!»

    Что де́лать? Бу́лочная уже́ не (11) []{.blank}: она́ закрыва́ется в семь. Но суперма́ркет напро́тив до́ма рабо́тает кру́глые су́тки. «Я сейча́с (12) []{.blank} но́вый!» — сказа́л брат и верну́лся че́рез (13) []{.blank}. Торт был не тако́й большо́й, но то́же о́чень (14) []{.blank}.

    А стихи́ брат ещё не (15) []{.blank}: «Напишу́ но́чью, че́стное сло́во!» Ма́ма вернётся с рабо́ты (16) []{.blank}, в оди́ннадцать, и о то́рте ничего́ не (17) []{.blank}. За́втра она́ (18) []{.blank} но́вый торт и услы́шит стихи́, а полови́ну ста́рого мы (19) []{.blank} сего́дня. «Отли́чно! — говори́т брат. — Я о́чень (20) []{.blank} э́тот торт!»
    :::
  glossary:
  - {ru: суперма́ркет, pos: m, zh: 超市}
  - {ru: кру́глые су́тки, zh: 全天，二十四小时}
  - {ru: услы́шит, zh: 将听到}
  passage_zh: |
    **蛋糕**

    今天是三月九日，明天，十日，是妈妈的生日。爸爸做晚饭，弟弟写一首诗，我去买蛋糕。

    地铁站旁边的面包店七点开门，所以我起得很早。可是那里已经排起了长队。我等了二十分钟，终于买到了一个又大又漂亮的蛋糕。我把它放在厨房里，就去学校了。

    晚上我回到家——桌上只剩半个蛋糕了！弟弟坐在厨房里。“对不起！”他说，“我吃了一块，后来又吃了一块……它太好吃了！我忘了明天是妈妈的生日！”

    怎么办？面包店已经不营业了：它七点关门。可是家对面的超市全天营业。“我这就去买个新的！”弟弟说，半小时后就回来了。这个蛋糕没那么大，可也很漂亮。

    诗弟弟还没写好：“我夜里写，说话算数！”妈妈下班回来得晚，要到十一点，蛋糕的事她一点儿也不知道。明天她会看到新蛋糕，还会听到诗，那半个旧蛋糕我们今天就吃掉。“太好了！”弟弟说，“我特别喜欢这个蛋糕！”
  why: 第 1 空：后面说“明天，十号”，今天就是九号：[девя́тое]{.ru}；“今天是几号”用中性序数词第一格（第 49 课）。第 2 空：后文 [стихи́ брат ещё не написа́л]{.ru}、[Напишу́ но́чью]{.ru}：弟弟负责写诗：[напи́шет]{.ru}（第 43 课）。第 3 空：面包店七点开门，要早去，所以“我起得早”：[вста́ла]{.ru}；[опозда́ла]{.ru} 和 [ра́но]{.ru} 矛盾（第 44 课）。第 4 空：面包店里“长的”东西、要等二十分钟的，是队：[о́чередь]{.ru}。第 5 空：排队就是“等”：[ждала́]{.ru}（第 22 课）。第 6 空：等了很久，“终于”买到了：[купи́ла]{.ru}（第 45 课）。第 7 空：晚上从学校“回到”家：[верну́лась]{.ru}（第 44 课）。第 8 空：桌上只剩半个蛋糕，是弟弟“吃了”一块又一块：[съел]{.ru}（第 44 课）。第 9 空：吃了一块又一块，因为蛋糕太好吃：[вку́сный]{.ru}。第 10 空：他是因为“忘了”妈妈生日才吃的：[забы́л]{.ru}（第 44 课）。第 11 空：后面说“它七点关门”，晚上面包店已经不营业：[рабо́тает]{.ru}；[открыва́ется]{.ru} 指开门那一刻，不和 [уже́ не]{.ru} 搭配。第 12 空：超市开着，弟弟马上去买：[куплю́]{.ru}，完成体将来时（第 43 课）。第 13 空：去对面超市买个蛋糕，时间不长：[полчаса́]{.ru}；一周、一个月、一年都说不通。第 14 空：[то́же]{.ru} 指向前面那个“又大又漂亮”的蛋糕：新蛋糕不那么大，但“也很漂亮”：[краси́вый]{.ru}。第 15 空：冒号后弟弟说“我夜里写”，诗还没“写完”：[написа́л]{.ru}（第 42、44 课）。第 16 空：后面说“十一点”，回来得晚：[по́здно]{.ru}。第 17 空：妈妈在上班，蛋糕的事她“不知道”：[зна́ет]{.ru}。第 18 空：明天妈妈会“看到”新蛋糕：[уви́дит]{.ru}，完成体将来时（第 43 课）。第 19 空：剩下的半个旧蛋糕今天“吃掉”：[съеди́м]{.ru}。第 20 空：弟弟是因为太喜欢这个蛋糕才偷吃的，结尾呼应：[люблю́]{.ru}（第 26 课）。
  items:
  - options: [восьмо́е, девя́тое, деся́тое, оди́ннадцатое]
    answer: девя́тое
  - options: [напи́шет, съест, пригото́вит, потеря́ет]
    answer: напи́шет
  - options: [опозда́ла, забы́ла, вста́ла, отве́тила]
    answer: вста́ла
  - options: [ко́мната, о́чередь, у́лица, ле́кция]
    answer: о́чередь
  - options: [спала́, гуля́ла, ждала́, пла́вала]
    answer: ждала́
  - options: [купи́ла, съе́ла, потеря́ла, пригото́вила]
    answer: купи́ла
  - options: [вста́ла, отве́тила, забы́ла, верну́лась]
    answer: верну́лась
  - options: [съел, купи́л, пригото́вил, посмотре́л]
    answer: съел
  - options: [плохо́й, ста́рый, си́ний, вку́сный]
    answer: вку́сный
  - options: [по́мнил, забы́л, знал, сказа́л]
    answer: забы́л
  - options: [открыва́ется, спит, рабо́тает, ждёт]
    answer: рабо́тает
  - options: [куплю́, съем, прочита́ю, забу́ду]
    answer: куплю́
  - options: [неде́лю, ме́сяц, полчаса́, год]
