  passage_zh: |
    **我们的街**

    我们住在一条安静的街上。我们家对面是一个大体育场。以前我们街上没有市场，现在有了。那里的土豆三十五卢布一公斤。

    我妹妹尼娜在体育场旁边的一所老学校上学。放学以后她总是想出去玩，而不想做功课。

    我们的女邻居有一只又大又老的猫。昨天尼娜和爸爸在体育场旁边散步，在那里看见了这只猫。
