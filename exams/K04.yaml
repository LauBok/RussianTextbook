- id: e8
  type: translate
  task: 汉译俄：把下列句子译成俄语。
  points: 5
  why: 每句 5 分：句子结构和关键语法点正确得 5 分；评分要点里的关键语法点错一处扣 2 分，其他小错（个别词尾、重音位置不计）每处扣 1 分，扣完为止。
  items:
  - zh: 我没有弟弟，可是有一个姐姐。
    accept:
    - У меня́ нет мла́дшего бра́та, но есть ста́ршая сестра́.
    - У меня́ нет мла́дшего бра́та, но у меня́ есть ста́ршая сестра́.
    rubric:
    - “有”用 [у меня́ есть]{.ru} + 第一格，不说 [я име́ю]{.ru}（第 31 课）
    - “没有”用 [нет]{.ru} + 第二格，形容词也变：[мла́дшего бра́та]{.ru}（第 32、34 课）
    - “姐姐”“弟弟”用 [ста́ршая сестра́]{.ru}、[мла́дший брат]{.ru}（第 34 课）
  - zh: 这是奥尔加·维克托罗夫娜的新词典。
    accept:
    - Э́то но́вый слова́рь О́льги Ви́кторовны.
    rubric:
    - 表示“谁的”，名词第二格放在后面：[слова́рь О́льги Ви́кторовны]{.ru}（第 33 课）
    - 名字和父称都要变成第二格（第 33 课）
    - '[слова́рь]{.ru} 是阳性，形容词用 [но́вый]{.ru}（第 9 课）'
  - zh: 由美是日本人，她从日本来。
    accept:
    - Ю́ми япо́нка, она́ из Япо́нии.
    - Ю́ми — япо́нка, она́ из Япо́нии.
    rubric:
    - 女性用 [япо́нка]{.ru}，不用 [япо́нец]{.ru}；国籍名词小写（第 36 课）
    - “从……来”用 [из]{.ru} + 第二格，[Япо́ния → из Япо́нии]{.ru}（第 36 课）
    - 现在时不用“是”这个动词；人名 [Ю́ми]{.ru} 不变格
  - zh: 午饭以后我们常常在公园散步。
    accept:
    - По́сле обе́да мы ча́сто гуля́ем в па́рке.
    - Мы ча́сто гуля́ем в па́рке по́сле обе́да.
    rubric:
    - “……以后”用 [по́сле]{.ru} + 第二格：[по́сле обе́да]{.ru}（第 37 课）
    - “在公园”用 [в]{.ru} + 第六格 [в па́рке]{.ru}（第 11 课）
    - 主语 [мы]{.ru}，[гуля́ем]{.ru}（第 6 课）
  - zh: 安娜在大学读书，晚上她在图书馆学习。
    accept:
    - А́нна у́чится в университе́те, а ве́чером она́ занима́ется в библиоте́ке.
    - А́нна у́чится в университе́те, ве́чером она́ занима́ется в библиоте́ке.
    - А́нна у́чится в университе́те, а ве́чером занима́ется в библиоте́ке.
    rubric:
    - “在大学读书”用 [учи́ться]{.ru}，“在图书馆学习（用功）”用 [занима́ться]{.ru}，两个动词不能互换（第 38 课）
    - '[-ся]{.ru} 动词变位：[у́чится, занима́ется]{.ru}（第 38 课）'
  - zh: 苹果多少钱？——二十一卢布一个。
    accept:
    - Ско́лько сто́ят я́блоки? — Два́дцать оди́н рубль шту́ка.
    - Ско́лько сто́ит я́блоко? — Два́дцать оди́н рубль.
    - Ско́лько сто́ит одно́ я́блоко? — Два́дцать оди́н рубль.
    rubric:
    - '[сто́ить]{.ru} 和主语一致：[я́блоки сто́ят]{.ru}，[я́блоко сто́ит]{.ru}（第 39 课）'
    - 数词最后一个词是 [оди́н]{.ru}，用单数第一格 [рубль]{.ru}，不用 [рубле́й]{.ru}（第 39 课）
    - “一个”说单价用 [шту́ка]{.ru}，直接放在钱数后面（第 39 课）
