    [Па́ша]{.sp} Ой, у нас хле́ба нет. Ку́пишь? О́коло апте́ки есть ма́ленький магази́н.

    [Ко́стя]{.sp} Куплю́. Сейча́с бу́ду!

    [Па́ша]{.sp} Спаси́бо! Ждём!
