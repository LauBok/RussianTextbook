lesson: K04
heading: 第四套
range: L01-L39
names: [Серге́й, Пари́ж, Каза́нь, Ко́ля, Пе́тя, Ва́ня, Руста́м, Ко́стя, Па́ша, Анто́н, Оле́г, Мари́, Ни́на, Татья́на Петро́вна, Ке́нта]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[не́ было]{.ru} 表示“不在”，人用第二格：[па́пы]{.ru}；[па́па]{.ru} 虽然指男人，按 [-а]{.ru} 结尾的名词变格，第二格是 [-ы]{.ru}。[не́ было]{.ru} 前用第一格是最常见的错误（第 32 课）。第 2 题：前置词 [у]{.ru} 后面的第三人称代词要加 [н-]{.ru}：[у него́]{.ru}；[его́]{.ru} 不能直接放在 [у]{.ru} 后面，[неё]{.ru} 指女性，[он]{.ru} 是第一格（第 31 课）。第 3 题：[Отку́да вы?]{.ru} 问“从哪里来”，回答 [Я из Каза́ни]{.ru}；其他三句回答的是“做什么的”“叫什么”“住在哪儿”（第 36 课）。第 4 题：“我没法写字”，缺的是笔：[нет ру́чки]{.ru}；书、茶、爸爸都和写字无关（第 32 课）。第 5 题：玛丽是女性，国籍名词用阴性 [францу́женка]{.ru}；[францу́з]{.ru} 指男性，[францу́зская]{.ru} 是形容词，要带名词，[по-францу́зски]{.ru} 是副词，说的是用什么语言（第 15、36 课）。第 6 题：表示“谁的”，名词第二格放在后面：[моего́ бра́та]{.ru}；前面的 [моего́]{.ru} 也说明要用第二格（第 33、34 课）。第 7 题：[сестра́]{.ru} 是阴性，“两个”用 [две]{.ru}；[два]{.ru} 用于阳性、中性名词，[одна́]{.ru} 后面用第一格 [сестра́]{.ru}，[пять]{.ru} 后面要用复数第二格（第 35 课）。第 8 题：[бра́та]{.ru} 是第二格，形容词也用阳性第二格 [ста́ршего]{.ru}；[ш]{.ru} 后面不重读的 [о]{.ru} 写成 [е]{.ru}（第 34 课）。第 9 题：[в метро́]{.ru} 说明此刻正坐着车，朝一个方向（回家）：用乘车的定向动词 [е́дем]{.ru}。[е́здим]{.ru} 表示经常往返，[идём, хо́дим]{.ru} 是步行（第 24、25 课）。第 10 题：[три]{.ru} 后面用单数第二格 [ко́мнаты]{.ru}（第 35 课）。第 11 题：[о]{.ru} 要求第六格，[она́]{.ru} 的第六格是 [ней]{.ru}；[неё]{.ru} 是第二格、第四格（第 13 课）。第 12 题：工程师在工厂上班，“在工厂”说 [на заво́де]{.ru}，所以“从工厂”用 [с]{.ru}：[с заво́да]{.ru}；[в]{.ru} 的场合对应 [из]{.ru}，[на]{.ru} 的场合对应 [с]{.ru}，不能混用。诊所不是工程师上班的地方，而且 [поликли́ника]{.ru} 和 [в]{.ru} 连用，[с поликли́ники]{.ru} 本身就是错的（第 36 课）。第 13 题：[у́тром]{.ru} 和 [ве́чером]{.ru} 对比，早上喝咖啡是在上班“以前”：[до рабо́ты]{.ru}；[по́сле рабо́ты]{.ru} 已经是晚上了，[без рабо́ты, у рабо́ты]{.ru} 不通（第 37 课）。第 14 题：喝咖啡“不加”的东西是糖：[без са́хара]{.ru}；面包、包、房子不往咖啡里放（第 37 课）。第 15 题：“我们”住这里，朋友住的是远处那栋楼，用 [тот]{.ru}；后半句省略了 [живёт]{.ru}；[дом]{.ru} 是阳性，[в]{.ru} 表示“在哪儿”用第六格 [том]{.ru}。[тот]{.ru} 是第一格，[та, той]{.ru} 是阴性（第 19 课）。第 16 题：课“开始”于早上、“结束”于下午，和后面的 [конча́ются]{.ru} 成对：[начина́ются]{.ru}；[у́чатся, занима́ются]{.ru} 的主语应是人，[нахо́дятся]{.ru} 表示位置（第 38 课）。第 17 题：[напро́тив]{.ru} 要求第二格：[стадио́на]{.ru}；它不是 [в, на]{.ru}，后面不用第六格（第 37 课）。第 18 题：数词最后一个词是 [три]{.ru}，[рубль]{.ru} 用单数第二格 [рубля́]{.ru}（第 39 课）。第 19 题：[знать]{.ru} 后用第四格，[Оле́г]{.ru} 是男性，用 [его́]{.ru}；前面没有前置词，不加 [н-]{.ru}（第 22、31 课）。第 20 题：[ре́дко]{.ru} 说的是经常性的往返，用不定向动词，主语是第三人称单数：[хо́дит]{.ru}；[идёт]{.ru} 表示此刻朝一个方向走（第 25 课）。第 21 题：主语 [лимо́ны]{.ru} 是复数，用 [сто́ят]{.ru}；[Ско́лько сто́ит?]{.ru} 说惯了，主语是复数时也写成 [сто́ит]{.ru}，是常见错误（第 39 课）。第 22 题：学校里没有游泳池，他没学过游泳，所以“不会”：[не уме́ет]{.ru}。[уме́ть]{.ru} 指学过、掌握了的技能；[знать]{.ru} 后面不接不定式表示技能，中文都说“会”，容易混；[хо́чет, лю́бит]{.ru} 和后半句的原因对不上（第 27 课）。第 23 题：冒号后说“这天是休息日”，没课的是星期天：[в воскресе́нье]{.ru}（第 29 课）。第 24 题：[о]{.ru} 要求第六格，[преподава́тель]{.ru} 是阳性，物主代词阳性第六格 [ва́шем]{.ru}；[ва́шего]{.ru} 是第二格，刚学了第二格，最容易和第六格混；[ва́шей]{.ru} 是阴性（第 19 课）。第 25 题：回答是 [Да, вот она́]{.ru}，问句是一般疑问句“这里有药店吗”，用 [есть]{.ru}；问 [где]{.ru} 不能用 [да]{.ru} 回答，[нет]{.ru} 后面要用第二格，[был]{.ru} 和阴性的 [апте́ка]{.ru} 不一致，也和“现在就在那儿”对不上（第 31 课）。
  items:
  - stem: 'Вчера́ ве́чером ___ не́ было до́ма: он рабо́тал.'
    options: [па́па, па́пу, па́пе, па́пы]
    answer: па́пы
  - stem: Э́то мой друг Анто́н. У ___ есть соба́ка.
    options: [него́, он, его́, неё]
    answer: него́
  - stem: — Отку́да вы? — ___
    options: [Я студе́нт., Я из Каза́ни., Меня́ зову́т Оле́г., Я живу́ здесь.]
    answer: Я из Каза́ни.
  - stem: 'Я не могу́ писа́ть: у меня́ нет ___.'
    options: [кни́ги, ча́я, ру́чки, па́пы]
    answer: ру́чки
  - stem: Мари́ из Пари́жа. Она́ ___.
    options: [францу́з, францу́зская, по-францу́зски, францу́женка]
    answer: францу́женка
  - stem: — Чья э́то маши́на? — Э́то маши́на моего́ ___.
    options: [брат, бра́ту, бра́та, бра́том]
    answer: бра́та
  - stem: У меня́ ___ сестры́ и оди́н брат.
    options: [две, два, одна́, пять]
    answer: две
  - stem: Мы живём в до́ме ___ бра́та.
    options: [ста́ршая, ста́ршего, ста́рший, ста́ршем]
    answer: ста́ршего
  - stem: — Где вы? — Мы в метро́, ___ домо́й с рабо́ты.
    options: [е́здим, идём, хо́дим, е́дем]
    answer: е́дем
  - stem: В на́шей кварти́ре три ___.
    options: [ко́мната, ко́мнат, ко́мнаты, ко́мнате]
    answer: ко́мнаты
  - stem: Ба́бушка живёт далеко́, и я ча́сто ду́маю о ___.
    options: [ней, она́, неё, её]
    answer: ней
  - stem: 'Па́па — инжене́р. Ве́чером он идёт домо́й ___.'
    options: [из заво́да, с заво́да, из поликли́ники, с поликли́ники]
    answer: с заво́да
  - stem: У́тром, ___ рабо́ты, па́па пьёт ко́фе, а ве́чером — чай.
    options: [до, без, по́сле, у]
    answer: до
  - stem: Па́па всегда́ пьёт ко́фе без ___.
    options: [са́хара, хле́ба, су́мки, до́ма]
    answer: са́хара
  - stem: Мы живём здесь, а наш друг — в ___ до́ме, напро́тив па́рка.
    options: [тот, том, та, той]
    answer: том
  - stem: Уро́ки в шко́ле ___ у́тром и конча́ются днём.
    options: [у́чатся, занима́ются, нахо́дятся, начина́ются]
    answer: начина́ются
  - stem: Апте́ка нахо́дится напро́тив ___.
    options: [стадио́н, стадио́не, стадио́на, стадио́ны]
    answer: стадио́на
  - stem: — Ско́лько сто́ит хлеб? — Со́рок три ___.
    options: [рубль, рубле́й, рубля́, рубли́]
    answer: рубля́
  - stem: — Ты зна́ешь Оле́га? — Да, я давно́ зна́ю ___.
    options: [его́, него́, он, её]
    answer: его́
  - stem: 'Брат ре́дко ___ в бассе́йн: он не лю́бит пла́вать.'
    options: [идёт, хо́дит, хожу́, ходи́ть]
    answer: хо́дит
  - stem: — Ско́лько ___ лимо́ны? — Два́дцать рубле́й шту́ка.
    options: [сто́ит, сто́ят, сто́ить, сто́ю]
    answer: сто́ят
  - stem: 'Мой друг не ___ пла́вать: в его́ шко́ле не́ было бассе́йна.'
    options: [зна́ет, хо́чет, уме́ет, лю́бит]
    answer: уме́ет
  - stem: 'В ___ у нас нет уро́ков: э́то выходно́й.'
    options: [воскресе́нье, понеде́льник, сре́ду, четве́рг]
    answer: воскресе́нье
  - stem: Мы ча́сто говори́м о ___ преподава́теле.
    options: [ваш, ва́шего, ва́шей, ва́шем]
    answer: ва́шем
  - stem: — Здесь ___ апте́ка? — Да, вот она́.
    options: [где, нет, есть, был]
    answer: есть
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Сосе́ди**

    В сосе́дней кварти́ре тепе́рь живёт но́вая (1) []{.blank}. Они́ (2) []{.blank} Каза́ни. Па́па — врач, а ма́ма — инжене́р. У них есть (3) []{.blank}, шко́льник. Их кварти́ра (4) []{.blank}: там четы́ре (5) []{.blank}.

    Ка́ждое у́тро я (6) []{.blank} в институ́т, а э́тот ма́льчик — в шко́лу. Шко́ла напро́тив (7) []{.blank} до́ма. Ма́льчик о́чень (8) []{.blank}: он всегда́ говори́т «До́брое у́тро!».

    Вчера́ бы́ло (9) []{.blank}, и я отдыха́л. У́тром я гуля́л в (10) []{.blank}. Там был э́тот ма́льчик: он игра́л в футбо́л. Пото́м я был на (11) []{.blank}, и он то́же был там: он покупа́л карто́шку. А ве́чером я сиде́л в (12) []{.blank} — и опя́ть он! Он чита́л. Как так? Он о́чень (13) []{.blank} хо́дит?

    Сего́дня у́тром о́коло до́ма стоя́т (14) []{.blank} ма́льчика. У них одно́ лицо́! Их (15) []{.blank} говори́т: «Э́то мои́ де́ти: Ко́ля, Пе́тя и Ва́ня».

    Тепе́рь всё (16) []{.blank}: у них не оди́н сын, а три. Ва́ня лю́бит (17) []{.blank}, Пе́тя — (18) []{.blank}, а Ко́ля ча́сто хо́дит на (19) []{.blank}. Но кто из (20) []{.blank} Ко́ля, а кто Пе́тя, я ещё не зна́ю.
    :::
  passage_zh: |
    **邻居**

    隔壁那套房子里搬来了新的一家。他们是从喀山来的。爸爸是医生，妈妈是工程师。他们有个儿子，是中学生。他们家的房子很大：有四个房间。

    每天早上我去学院，这个男孩去上学。学校就在我们楼对面。男孩很开朗，总是说“早上好！”。

    昨天是星期天，我休息。上午我在公园散步。那个男孩在那儿踢足球。后来我去了市场，他也在那儿：他在买土豆。晚上我坐在图书馆里——又是他！他在看书。怎么回事？他走路这么快吗？

    今天早上楼旁边站着三个男孩，长得一模一样！他们的妈妈说：“这是我的孩子：科利亚、别佳和瓦尼亚。”

    现在全明白了：他们家不是一个儿子，而是三个。瓦尼亚喜欢足球，别佳喜欢书，科利亚常去市场。可是他们谁是科利亚、谁是别佳，我还分不清。
  why: 第 1 空：后一句用 [Они́]{.ru}，接着介绍爸爸、妈妈和儿子，搬来的是一家人：[семья́]{.ru}（第 14 课）。第 2 空：说从哪个城市来，用 [из]{.ru} + 第二格；[с]{.ru} 用于 [рабо́та, ры́нок]{.ru} 这类和 [на]{.ru} 连用的词，[у]{.ru}、[без]{.ru} 意思不通（第 36、37 课）。第 3 空：后面说明是 [шко́льник]{.ru}，下文又一直说“那个男孩”，所以是儿子 [сын]{.ru}；[дочь]{.ru} 和阳性的 [шко́льник]{.ru} 矛盾（第 4、35 课）。第 4 空：冒号后面在解释：有四个房间，所以房子“大”：[больша́я]{.ru}；结尾知道了他们家有三个孩子，四个房间也就说得通了（第 9 课）。第 5 空：[четы́ре]{.ru} 后面的名词用单数第二格：[ко́мнаты]{.ru}；[ко́мнат]{.ru} 用在 [пять]{.ru} 以上（第 35 课）。第 6 空：[ка́ждое у́тро]{.ru} 说的是经常去，用不定向动词 [хожу́]{.ru}；[иду́]{.ru} 指此刻正朝一个方向走（第 25 课）。第 7 空：[напро́тив]{.ru} 要求第二格，[дом]{.ru} 是阳性，物主代词用 [на́шего]{.ru}（第 34、37 课）。第 8 空：冒号后说他总是跟人打招呼说“早上好”，说明他开朗：[весёлый]{.ru}；他是中学生，[ста́рый]{.ru}、[молодо́й]{.ru}、[ста́рший]{.ru} 都不合适（第 31 课）。第 9 空：“我”这天休息，男孩一整天在公园、市场、图书馆，没去上学，所以是星期天：[воскресе́нье]{.ru}（第 16、29 课）。第 10 空：男孩在那里踢足球，又是休息日，所以是公园 [па́рке]{.ru}；学校、学院这天不上课，商店里不踢球（第 16 课）。第 11 空：他在那里买土豆，是市场：[ры́нке]{.ru}（第 39 课）。第 12 空：他在那里看书，“我”坐着，是图书馆：[библиоте́ке]{.ru}（第 11 课）。第 13 空：“我”一天在三个地方都碰见他，开玩笑地问“他走得这么快吗”：[бы́стро]{.ru}；[ме́дленно]{.ru}、[ре́дко]{.ru} 和“到处都碰见他”相反（第 7 课）。第 14 空：妈妈接着说出三个名字，后文又说“不是一个儿子，而是三个”：[три]{.ru}；[пять]{.ru} 后要用 [ма́льчиков]{.ru}，这里是 [ма́льчика]{.ru}，也说明数字是 2–4（第 35 课）。第 15 空：说“这是我的孩子”的是他们的妈妈：[ма́ма]{.ru}（第 35 课）。第 16 空：前面一直奇怪“怎么到处都是他”，现在见到三胞胎，事情清楚了：[поня́тно]{.ru}（第 15 课）。第 17、18、19 空：要回到第三段：在公园踢足球的、在图书馆看书的、在市场买土豆的，原来是三个人。所以一个喜欢 [футбо́л]{.ru}，一个喜欢 [кни́ги]{.ru}，一个常去 [ры́нок]{.ru}（第 26、39 课）。第 20 空：[из]{.ru} 后用第二格，[они́]{.ru} 在前置词后是 [них]{.ru}；[их]{.ru} 是不带前置词的形式（第 31、36 课）。
  items:
  - options: [де́вочка, соба́ка, студе́нтка, семья́]
    answer: семья́
  - options: [с, у, из, без]
    answer: из
  - options: [дочь, сын, брат, дя́дя]
    answer: сын
  - options: [ма́ленькая, ста́рая, больша́я, ти́хая]
    answer: больша́я
  - options: [ко́мнаты, ко́мната, ко́мнат, ко́мнату]
    answer: ко́мнаты
  - options: [иду́, е́ду, хо́дит, хожу́]
    answer: хожу́
  - options: [наш, на́шего, на́шем, на́шей]
    answer: на́шего
  - options: [ста́рый, ста́рший, весёлый, молодо́й]
    answer: весёлый
  - options: [понеде́льник, воскресе́нье, вто́рник, четве́рг]
    answer: воскресе́нье
  - options: [шко́ле, институ́те, магази́не, па́рке]
    answer: па́рке
  - options: [ры́нке, ка́федре, конце́рте, уро́ке]
    answer: ры́нке
  - options: [бассе́йне, апте́ке, библиоте́ке, теа́тре]
    answer: библиоте́ке
  - options: [ме́дленно, бы́стро, ре́дко, пло́хо]
    answer: бы́стро
  - options: [два, пять, четы́ре, три]
    answer: три
  - options: [ма́ма, ба́бушка, сестра́, сосе́дка]
    answer: ма́ма
  - options: [пло́хо, ти́хо, ве́село, поня́тно]
    answer: поня́тно
  - options: [ша́хматы, футбо́л, му́зыку, хокке́й]
    answer: футбо́л
  - options: [му́зыку, ша́хматы, кни́ги, хокке́й]
    answer: кни́ги
  - options: [ры́нок, стадио́н, конце́рт, бале́т]
    answer: ры́нок
  - options: [их, они́, ним, них]
    answer: них
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Руста́м**

    Руста́м — тата́рин. Он из Каза́ни. Сейча́с он у́чится в Москве́, в медици́нском институ́те: он бу́дущий врач. Руста́м живёт в общежи́тии. В его́ ко́мнате живёт ещё оди́н студе́нт — францу́з.

    У Руста́ма больша́я семья́: оте́ц, ма́ма и две сестры́. Оте́ц — учи́тель, он рабо́тает в шко́ле, а ма́ма — врач, она́ рабо́тает в поликли́нике. Де́душка Руста́ма живёт ря́дом, в сосе́днем до́ме. У де́душки большо́й сад и ста́рая соба́ка.

    Ра́ньше Руста́м не люби́л хокке́й. В шко́ле он игра́л то́лько в ша́хматы. Но де́душка о́чень люби́л хокке́й, и ве́чером они́ ча́сто вме́сте смотре́ли хокке́й. Тепе́рь Руста́м то́же лю́бит хокке́й, а в Москве́ он иногда́ хо́дит на стадио́н.

    Ка́ждое воскресе́нье Руста́м звони́т домо́й. Ма́ма спра́шивает об институ́те и о гру́ппе, а де́душка — о хокке́е и о стадио́не.
    :::
  passage_zh: |
    **鲁斯塔姆**

    鲁斯塔姆是鞑靼人，从喀山来。现在他在莫斯科的医学院读书，将来要当医生。鲁斯塔姆住在宿舍。他的房间里还住着一个大学生——法国人。

    鲁斯塔姆家是个大家庭：爸爸、妈妈和两个姐妹。爸爸是老师，在学校工作；妈妈是医生，在诊所工作。鲁斯塔姆的爷爷住在附近，在旁边那栋楼里。爷爷有一个大花园，还有一条老狗。

    以前鲁斯塔姆不喜欢冰球。上中学时他只下国际象棋。可是爷爷非常喜欢冰球，晚上他们常常一起看冰球。现在鲁斯塔姆也喜欢冰球了，在莫斯科他有时去体育场看比赛。

    每个星期天鲁斯塔姆都往家里打电话。妈妈问学院和班里的事，爷爷问冰球和体育场的事。
  why: 第 1 题，[В шко́ле он игра́л то́лько в ша́хматы]{.ru}；冰球是他后来才喜欢上的。第 2 题，同屋是 [францу́з]{.ru}“法国人”，所以是从法国来的（第 36 课）；喀山是鲁斯塔姆自己的家乡。第 3 题，[оте́ц, ма́ма и две сестры́]{.ru}，他有两个姐妹，文中没有兄弟。第 4 题，[а ма́ма — врач, она́ рабо́тает в поликли́нике]{.ru}；当老师的是爸爸。第 5 题，[де́душка о́чень люби́л хокке́й]{.ru}；鲁斯塔姆以前不喜欢冰球，是跟着爷爷看才喜欢上的。
  items:
  - stem: В шко́ле Руста́м игра́л ___.
    options: [в хокке́й, в футбо́л, в компью́тер, в ша́хматы]
    answer: в ша́хматы
  - stem: В ко́мнате Руста́ма живёт студе́нт ___.
    options: [из Фра́нции, из Кита́я, из Каза́ни, из Япо́нии]
    answer: из Фра́нции
  - stem: У Руста́ма ___.
    options: [есть брат, нет сестры́, две сестры́, два бра́та]
    answer: две сестры́
  - stem: Ма́ма Руста́ма — ___.
    options: [учи́тель, инжене́р, врач, студе́нтка]
    answer: врач
  - stem: Ра́ньше хокке́й о́чень люби́л ___.
    options: [де́душка Руста́ма, оте́ц Руста́ма, ма́ма Руста́ма, студе́нт из Фра́нции]
    answer: де́душка Руста́ма
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Ко́стя]{.sp} Па́ша, приве́т! Э́то Ко́стя. Я уже́ в метро́. А где ваш дом?
    [Па́ша]{.sp} Приве́т! Наш дом недалеко́. Ты ви́дишь шко́лу?
    [Ко́стя]{.sp} Да, ви́жу. Она́ напро́тив метро́.
    [Па́ша]{.sp} А наш дом напро́тив шко́лы. Э́то большо́й но́вый дом. О́коло до́ма апте́ка и ры́нок.
    [Ко́стя]{.sp} А до до́ма далеко́?
    [Па́ша]{.sp} Нет, пешко́м пять мину́т. Кварти́ра девятна́дцать.
    [Ко́стя]{.sp} Хорошо́. А кто сейча́с до́ма? Твоя́ сестра́ до́ма?
    [Па́ша]{.sp} Нет, её нет. Она́ в бассе́йне, пла́вает там до обе́да. Ма́мы то́же нет, она́ на ры́нке, покупа́ет карто́шку и я́блоки. А де́душка до́ма, он смо́трит хокке́й.
    [Ко́стя]{.sp} А твой брат?
    [Па́ша]{.sp} Брат на стадио́не о́коло шко́лы, игра́ет в футбо́л. Мо́жет быть, ты его́ ви́дишь.
    [Ко́стя]{.sp} Да, вот он! Он хорошо́ игра́ет.
    [Па́ша]{.sp} Ну, мы ждём тебя́!
    [Ко́стя]{.sp} Иду́! А у меня́ есть пода́рок — но́вые ша́хматы.
    [Па́ша]{.sp} Спаси́бо! Де́душка о́чень лю́бит ша́хматы.
    :::
  passage_zh: |
    科斯佳：帕沙，你好！我是科斯佳。我已经到地铁站了。你们家在哪儿？

    帕沙：你好！我们家不远。你看见一所学校了吗？

    科斯佳：看见了。学校在地铁站对面。

    帕沙：我们家就在学校对面。是一栋新的大楼。楼旁边有药店和市场。

    科斯佳：到你们家远吗？

    帕沙：不远，走路五分钟。十九号房。

    科斯佳：好。现在谁在家？你妹妹在家吗？

    帕沙：不在。她在游泳馆，在那儿游到午饭前。妈妈也不在，她在市场买土豆和苹果。爷爷在家，他在看冰球。

    科斯佳：你哥哥呢？

    帕沙：哥哥在学校旁边的体育场踢足球。说不定你能看见他。

    科斯佳：看见了，他在那儿！他踢得真好。

    帕沙：好啦，我们等你！

    科斯佳：这就来！我还带了礼物——一副新的国际象棋。

    帕沙：谢谢！爷爷很喜欢下国际象棋。
  why: 第 1 题，帕沙说 [А де́душка до́ма]{.ru}，接电话的帕沙自己也在家；妹妹在游泳馆，妈妈在市场，哥哥在体育场。第 2 题，[А наш дом напро́тив шко́лы]{.ru}；在地铁站对面的是学校，药店在楼旁边。第 3 题，[пешко́м пять мину́т]{.ru}。第 4 题，[Ма́мы то́же нет, она́ на ры́нке]{.ru}；在游泳馆的是妹妹。第 5 题，学校在地铁站对面，哥哥在学校旁边的体育场踢球，科斯佳在地铁站说 [Да, вот он!]{.ru}，他看见的是帕沙的哥哥。
  items:
  - stem: Сейча́с до́ма ___.
    options: [Па́ша и ма́ма, Па́ша и де́душка, Па́ша и брат, Па́ша и сестра́]
    answer: Па́ша и де́душка
  - stem: Дом Па́ши нахо́дится ___.
    options: [напро́тив метро́, напро́тив апте́ки, в па́рке, напро́тив шко́лы]
    answer: напро́тив шко́лы
  - stem: Пешко́м до до́ма Па́ши ___.
    options: [два часа́, де́сять мину́т, пять мину́т, со́рок мину́т]
    answer: пять мину́т
  - stem: Ма́ма Па́ши сейча́с ___.
    options: [в бассе́йне, на ры́нке, на стадио́не, до́ма]
    answer: на ры́нке
  - stem: Ко́стя ви́дит ___.
    options: [бра́та Па́ши, сестру́ Па́ши, де́душку Па́ши, ма́му Па́ши]
    answer: бра́та Па́ши
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的市场介绍，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ры́нок «Све́жий»**

    Наш ры́нок нахо́дится о́коло ста́нции метро́ «Университе́т», напро́тив апте́ки. Ра́ньше в э́том большо́м ста́ром зда́нии был заво́д, а тепе́рь здесь ры́нок. У нас вы мо́жете не то́лько покупа́ть карто́шку и я́блоки: здесь вы мо́жете пить горя́чий чай и́ли ко́фе и есть вку́сные сы́рники.

    | | |
    |---|---|
    | понеде́льник | 7.00—12.00 |
    | вто́рник — воскресе́нье | 7.00—19.00 |

    | | |
    |---|---|
    | карто́шка | 45 рубле́й килогра́мм |
    | я́блоки | 90 рубле́й килогра́мм |
    | са́хар | 70 рубле́й килогра́мм |
    | лимо́ны | 33 рубля́ шту́ка |
    | хлеб | 52 рубля́ шту́ка |

    Здесь всё све́жее! Карто́шка, я́блоки и лимо́ны у нас то́лько хоро́шие, а хлеб всегда́ горя́чий. В суббо́ту и в воскресе́нье у́тром здесь игра́ет му́зыка.

    Вы не зна́ете, ско́лько сто́ят я́блоки? Вы не по́мните, где хлеб? Здесь всегда́ рабо́тают до́брые продавцы́. Они́ всё зна́ют! Мы ждём вас ка́ждый день!
    :::
  passage_zh: |
    **“新鲜”市场**

    我们的市场在“大学”地铁站附近，药店对面。以前这栋高大的旧楼是一家工厂，现在这里是市场。在我们这儿您不光能买土豆和苹果，还可以喝热茶或咖啡，吃好吃的奶渣饼。

    | | |
    |---|---|
    | 星期一 | 7:00—12:00 |
    | 星期二—星期天 | 7:00—19:00 |

    | | |
    |---|---|
    | 土豆 | 每公斤 45 卢布 |
    | 苹果 | 每公斤 90 卢布 |
    | 白糖 | 每公斤 70 卢布 |
    | 柠檬 | 每个 33 卢布 |
    | 面包 | 每个 52 卢布 |

    这里样样都新鲜！我们的土豆、苹果和柠檬都是好的，面包总是热乎乎的。星期六和星期天上午这里有音乐。

    您不知道苹果多少钱？您不记得面包在哪儿？这里总有和气的售货员。他们什么都知道！我们每天都等着您！
  why: 第 1 题，柠檬每个 33 卢布，两个是 66：[шестьдеся́т шесть]{.ru} 最后一个词是 [шесть]{.ru}，用 [рубле́й]{.ru}（第 39 课）。第 2 题，土豆每公斤 45 卢布，两公斤是 90 卢布。第 3 题，表里 52 卢布一个的是 [хлеб]{.ru}。第 4 题，[напро́тив апте́ки]{.ru}；市场在地铁站附近，不在地铁站对面。第 5 题，星期一 7:00—12:00，只在上午营业。
  items:
  - stem: Два лимо́на сто́ят ___.
    options: [три́дцать три рубля́, шестьдеся́т два рубля́, девяно́сто рубле́й, шестьдеся́т шесть рубле́й]
    answer: шестьдеся́т шесть рубле́й
  - stem: Два килогра́мма карто́шки сто́ят ___.
    options: [со́рок пять рубле́й, пятьдеся́т два рубля́, се́мьдесят рубле́й, девяно́сто рубле́й]
    answer: девяно́сто рубле́й
  - stem: Пятьдеся́т два рубля́ сто́ит ___.
    options: [хлеб, лимо́н, са́хар, карто́шка]
    answer: хлеб
  - stem: Ры́нок нахо́дится ___.
    options: [напро́тив метро́, о́коло па́рка, напро́тив апте́ки, в метро́]
    answer: напро́тив апте́ки
  - stem: В понеде́льник ры́нок рабо́тает ___.
    options: [то́лько ве́чером, то́лько у́тром, у́тром и ве́чером, но́чью]
    answer: то́лько у́тром
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Шко́ла в Росси́и**

    В Росси́и де́ти у́чатся в шко́ле оди́ннадцать лет. До шко́лы ма́ленькие ма́льчики и де́вочки хо́дят в де́тский сад. Шко́ла ча́сто нахо́дится ря́дом, в сосе́днем до́ме и́ли на сосе́дней у́лице, и де́ти хо́дят туда́ пешко́м.

    Уро́ки начина́ются ра́но у́тром, а конча́ются днём. Обе́дают шко́льники в шко́ле. В шко́ле они́ изуча́ют ру́сский язы́к, исто́рию, му́зыку. Мно́гие шко́льники изуча́ют и англи́йский язы́к, а иногда́ ещё францу́зский и́ли кита́йский.

    По́сле шко́лы де́ти возвраща́ются домо́й и де́лают уро́ки. Мно́гие ещё игра́ют в футбо́л и́ли в хокке́й, пла́вают в бассе́йне и́ли игра́ют в ша́хматы.

    Ра́ньше шко́льники учи́лись и в суббо́ту, а отдыха́ли то́лько в воскресе́нье. Тепе́рь мно́гие шко́лы в суббо́ту не рабо́тают, и в э́тот день шко́льники гуля́ют в па́рке, хо́дят в кино́ и́ли е́здят на да́чу.
    :::
  passage_zh: |
    **俄罗斯的中小学**

    在俄罗斯，孩子们在中小学读十一年书。上学以前，小男孩和小女孩上幼儿园。学校常常就在附近，在旁边那栋楼里或者旁边那条街上，孩子们走着去上学。

    早上很早就开始上课，下午放学。学生们在学校吃午饭。在学校他们学俄语、历史、音乐。很多学生还学英语，有的还学法语或汉语。

    放学以后孩子们回家做功课。很多孩子还踢足球或打冰球，去游泳馆游泳，或者下国际象棋。

    以前学生们星期六也上学，只有星期天休息。现在很多学校星期六不上课，这一天学生们去公园散步、看电影，或者去别墅。
  why: 第 1 题，文中没有直接说原因，但同一句交代了学校常常就在旁边那栋楼或旁边那条街上（[ря́дом, в сосе́днем до́ме и́ли на сосе́дней у́лице]{.ru}），所以孩子们走着去；喜欢散步、家里没车、地铁远，文中都没有提到。第 2 题，[До шко́лы … хо́дят в де́тский сад]{.ru}。第 3 题，[Обе́дают шко́льники в шко́ле]{.ru}。第 4 题，[По́сле шко́лы де́ти возвраща́ются домо́й и де́лают уро́ки]{.ru}；外语是在课上学的。第 5 题，[мно́гие шко́лы в суббо́ту не рабо́тают]{.ru}：很多学校星期六不开课，这些学生星期六就不上学了；选项里的“上学上到晚上”“写作业”文中都没有说是星期六的事。
  items:
  - stem: 'Де́ти ча́сто хо́дят в шко́лу пешко́м: ___'
    options: [они́ лю́бят гуля́ть., у них нет маши́ны., шко́ла ча́сто ря́дом., метро́ далеко́.]
    answer: шко́ла ча́сто ря́дом.
  - stem: До шко́лы ма́ленькие де́ти хо́дят ___.
    options: [в бассе́йн, в де́тский сад, в университе́т, на да́чу]
    answer: в де́тский сад
  - stem: Днём шко́льники обе́дают ___.
    options: [в шко́ле, до́ма, у ба́бушки, в па́рке]
    answer: в шко́ле
  - stem: По́сле шко́лы де́ти ___.
    options: [изуча́ют англи́йский язы́к, слу́шают ле́кции, де́лают уро́ки, хо́дят в де́тский сад]
    answer: де́лают уро́ки
  - stem: Тепе́рь в суббо́ту мно́гие шко́льники ___.
    options: [у́чатся до ве́чера, пи́шут упражне́ния, хо́дят в де́тский сад, не у́чатся]
    answer: не у́чатся
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **На́ша у́лица**

    Мы (1) []{.blank} (жить) на ти́хой у́лице. Напро́тив (2) []{.blank} (наш дом) — большо́й стадио́н. Ра́ньше на на́шей у́лице не́ было (3) []{.blank} (ры́нок), а тепе́рь он есть. Карто́шка там сто́ит три́дцать пять (4) []{.blank} (рубль) килогра́мм.

    Моя́ мла́дшая сестра́ Ни́на (5) []{.blank} (учи́ться) в (6) []{.blank} (ста́рая шко́ла) о́коло стадио́на. По́сле шко́лы она́ всегда́ (7) []{.blank} (хоте́ть) гуля́ть, а не де́лать уро́ки.

    У (8) []{.blank} (на́ша сосе́дка) есть большо́й ста́рый кот. Вчера́ Ни́на и па́па (9) []{.blank} (гуля́ть) о́коло стадио́на и (10) []{.blank} (ви́деть) там э́того кота́.
