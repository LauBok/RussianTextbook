  - stem: 'Анто́н у́чится в медици́нском институ́те: он ___.'
    options: [инжене́р, бу́дущий врач, учи́тель, шко́льник]
    answer: бу́дущий врач
  - stem: 'Ра́ньше Анто́н не уме́л гото́вить: ___.'
    options: [он мно́го учи́лся, в общежи́тии не́ было ку́хни, до́ма всегда́ гото́вила ма́ма, он не люби́л обе́д]
    answer: до́ма всегда́ гото́вила ма́ма
  - stem: Гото́вить Анто́на у́чит ___.
    options: [ма́ма, ба́бушка Руста́ма, преподава́тель, Руста́м]
    answer: Руста́м
  - stem: Вчера́ пиро́г гото́вил ___.
    options: [Анто́н, Руста́м, Анто́н и Руста́м, ма́ма]
    answer: Анто́н
  - stem: 'Ма́ма тепе́рь спра́шивает о друго́м: ___.'
    options: [Анто́н живёт до́ма, тепе́рь Анто́н гото́вит, Анто́н не звони́т, у Анто́на нет вре́мени]
    answer: тепе́рь Анто́н гото́вит
