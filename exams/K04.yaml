    [Па́ша]{.sp} Девятна́дцать. Роди́телей нет, они́ на рабо́те, так что до́ма то́лько мы с де́душкой. Он тебя́ давно́ ждёт: лю́бит ша́хматы, а я игра́ю пло́хо.

