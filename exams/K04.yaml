lesson: K04
heading: 第四套
range: L01-L39
names: [Серге́й, Пари́ж, Каза́нь, Ко́ля, Пе́тя, Ва́ня, Ба́рсик, Анто́н, Руста́м, Ко́стя, Па́ша, Анто́н, Оле́г, Мари́, Ни́на, Татья́на Петро́вна, Ке́нта]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[не́ было]{.ru} 表示“不在”，人用第二格：[па́пы]{.ru}；[па́па]{.ru} 虽然指男人，按 [-а]{.ru} 结尾的名词变格，第二格是 [-ы]{.ru}。[не́ было]{.ru} 前用第一格是最常见的错误（第 32 课）。第 2 题：前置词 [у]{.ru} 后面的第三人称代词要加 [н-]{.ru}：[у него́]{.ru}；[его́]{.ru} 不能直接放在 [у]{.ru} 后面，[неё]{.ru} 指女性，[он]{.ru} 是第一格（第 31 课）。第 3 题：[Отку́да вы?]{.ru} 问“从哪里来”，回答 [Я из Каза́ни]{.ru}；其他三句回答的是“做什么的”“叫什么”“住在哪儿”（第 36 课）。第 4 题：“我没法写字”，缺的是笔：[нет ру́чки]{.ru}；书、茶、报纸都不是写字用的（第 32 课）。第 5 题：玛丽是女性，国籍名词用阴性 [францу́женка]{.ru}；[францу́з]{.ru} 指男性，[францу́зская]{.ru} 是形容词，要带名词，[по-францу́зски]{.ru} 是副词，说的是用什么语言（第 15、36 课）。第 6 题：表示“谁的”，名词第二格放在后面：[моего́ бра́та]{.ru}；前面的 [моего́]{.ru} 也说明要用第二格（第 33、34 课）。第 7 题：[сестра́]{.ru} 是阴性，“两个”用 [две]{.ru}；[два]{.ru} 用于阳性、中性名词，[одна́]{.ru} 后面用第一格 [сестра́]{.ru}，[пять]{.ru} 后面要用复数第二格（第 35 课）。第 8 题：[бра́та]{.ru} 是第二格，形容词也用阳性第二格 [ста́ршего]{.ru}；[ш]{.ru} 后面不重读的 [о]{.ru} 写成 [е]{.ru}（第 34 课）。第 9 题：[в метро́]{.ru} 说明此刻正坐着车，朝一个方向（回家）：用乘车的定向动词 [е́дем]{.ru}。[е́здим]{.ru} 表示经常往返，[идём, хо́дим]{.ru} 是步行（第 24、25 课）。第 10 题：[пятна́дцать]{.ru} 后用复数第二格；[челове́к]{.ru} 在数词后的复数第二格就是 [челове́к]{.ru}，不说 [люде́й]{.ru}；[люде́й]{.ru} 用在 [мно́го]{.ru} 后面；[челове́ка]{.ru} 用在 2–4 后（第 35 课）。第 11 题：[о]{.ru} 要求第六格，[она́]{.ru} 的第六格是 [ней]{.ru}；[неё]{.ru} 是第二格、第四格（第 13 课）。第 12 题：工程师在工厂上班，“在工厂”说 [на заво́де]{.ru}，所以“从工厂”用 [с]{.ru}：[с заво́да]{.ru}；[в]{.ru} 的场合对应 [из]{.ru}，[на]{.ru} 的场合对应 [с]{.ru}，不能混用。诊所不是工程师上班的地方，而且 [поликли́ника]{.ru} 和 [в]{.ru} 连用，[с поликли́ники]{.ru} 本身就是错的（第 36 课）。第 13 题：[у́тром]{.ru} 和 [ве́чером]{.ru} 对比，早上喝咖啡是在上班“以前”：[до рабо́ты]{.ru}；[по́сле рабо́ты]{.ru} 已经是晚上了，[без рабо́ты, у рабо́ты]{.ru} 不通（第 37 课）。第 14 题：[без]{.ru} 要求第二格：[без са́хара]{.ru}；[са́хар]{.ru} 是第一格，[са́харе]{.ru} 是第六格（第 37 课）。第 15 题：“我们”住这里，朋友住的是远处那栋楼，用 [тот]{.ru}；后半句省略了 [живёт]{.ru}；[дом]{.ru} 是阳性，[в]{.ru} 表示“在哪儿”用第六格 [том]{.ru}。[тот]{.ru} 是第一格，[та, той]{.ru} 是阴性（第 19 课）。第 16 题：课“开始”于早上、“结束”于下午，和后面的 [конча́ются]{.ru} 成对：[начина́ются]{.ru}；[у́чатся, занима́ются]{.ru} 的主语应是人，[нахо́дятся]{.ru} 表示位置（第 38 课）。第 17 题：[напро́тив]{.ru} 要求第二格：[стадио́на]{.ru}；它不是 [в, на]{.ru}，后面不用第六格（第 37 课）。第 18 题：数词最后一个词是 [три]{.ru}，[рубль]{.ru} 用单数第二格 [рубля́]{.ru}（第 39 课）。第 19 题：[знать]{.ru} 后用第四格，[Оле́г]{.ru} 是男性，用 [его́]{.ru}；前面没有前置词，不加 [н-]{.ru}（第 22、31 课）。第 20 题：[ре́дко]{.ru} 说的是经常性的往返，用不定向动词，主语是第三人称单数：[хо́дит]{.ru}；[идёт]{.ru} 表示此刻朝一个方向走（第 25 课）。第 21 题：主语 [лимо́ны]{.ru} 是复数，用 [сто́ят]{.ru}；[Ско́лько сто́ит?]{.ru} 说惯了，主语是复数时也写成 [сто́ит]{.ru}，是常见错误（第 39 课）。第 22 题：学校里没有游泳池，他没学过游泳，所以“不会”：[не уме́ет]{.ru}。[уме́ть]{.ru} 指学过、掌握了的技能；[знать]{.ru} 后面不接不定式表示技能，中文都说“会”，容易混；[хо́чет, лю́бит]{.ru} 和后半句的原因对不上（第 27 课）。第 23 题：冒号后说“这天是休息日”，没课的是星期天：[в воскресе́нье]{.ru}（第 29 课）。第 24 题：[о]{.ru} 要求第六格，[преподава́тель]{.ru} 是阳性，物主代词阳性第六格 [ва́шем]{.ru}；[ва́шего]{.ru} 是第二格，刚学了第二格，最容易和第六格混；[ва́шей]{.ru} 是阴性（第 19 课）。第 25 题：回答是 [Да, вот она́]{.ru}，问句是一般疑问句“这里有药店吗”，用 [есть]{.ru}；问 [где]{.ru} 不能用 [да]{.ru} 回答，[нет]{.ru} 后面要用第二格，[был]{.ru} 和阴性的 [апте́ка]{.ru} 不一致，也和“现在就在那儿”对不上（第 31 课）。
  items:
  - stem: 'Вчера́ ве́чером ___ не́ было до́ма: он рабо́тал.'
    options: [па́па, па́пу, па́пе, па́пы]
    answer: па́пы
  - stem: Э́то мой друг Анто́н. У ___ есть соба́ка.
    options: [него́, он, его́, неё]
    answer: него́
  - stem: — Отку́да вы? — ___
    options: [Я студе́нт., Я из Каза́ни., Меня́ зову́т Оле́г., Я живу́ здесь.]
    answer: Я из Каза́ни.
  - stem: 'Я не могу́ писа́ть: у меня́ нет ___.'
    options: [кни́ги, ча́я, ру́чки, газе́ты]
    answer: ру́чки
  - stem: Мари́ из Пари́жа. Она́ ___.
    options: [францу́з, францу́зская, по-францу́зски, францу́женка]
    answer: францу́женка
  - stem: — Чья э́то маши́на? — Э́то маши́на моего́ ___.
    options: [брат, бра́ту, бра́та, бра́том]
    answer: бра́та
  - stem: У меня́ ___ сестры́ и оди́н брат.
    options: [две, два, одна́, пять]
    answer: две
  - stem: Мы живём в до́ме ___ бра́та.
    options: [ста́ршая, ста́ршего, ста́рший, ста́ршем]
    answer: ста́ршего
  - stem: — Где вы? — Мы в метро́, ___ домо́й с рабо́ты.
    options: [е́здим, идём, хо́дим, е́дем]
    answer: е́дем
  - stem: В на́шей гру́ппе пятна́дцать ___.
    options: [челове́ка, челове́к, лю́ди, люде́й]
    answer: челове́к
  - stem: Ба́бушка живёт далеко́, и я ча́сто ду́маю о ___.
    options: [ней, она́, неё, её]
    answer: ней
  - stem: 'Па́па — инжене́р. Ве́чером он идёт домо́й ___.'
    options: [из заво́да, с заво́да, из поликли́ники, с поликли́ники]
    answer: с заво́да
  - stem: У́тром, ___ рабо́ты, па́па пьёт ко́фе, а ве́чером — чай.
    options: [до, без, по́сле, у]
    answer: до
  - stem: Па́па всегда́ пьёт ко́фе без ___.
    options: [са́хар, са́харе, са́хара, са́хару]
    answer: са́хара
  - stem: Мы живём здесь, а наш друг — в ___ до́ме, напро́тив па́рка.
    options: [тот, том, та, той]
    answer: том
  - stem: Уро́ки в шко́ле ___ у́тром и конча́ются днём.
    options: [у́чатся, занима́ются, нахо́дятся, начина́ются]
    answer: начина́ются
  - stem: Апте́ка нахо́дится напро́тив ___.
    options: [стадио́н, стадио́не, стадио́на, стадио́ны]
    answer: стадио́на
  - stem: — Ско́лько сто́ит хлеб? — Со́рок три ___.
    options: [рубль, рубле́й, рубля́, рубли́]
    answer: рубля́
  - stem: — Ты зна́ешь Оле́га? — Да, я давно́ зна́ю ___.
    options: [его́, него́, он, её]
    answer: его́
  - stem: 'Брат ре́дко ___ в бассе́йн: он не лю́бит пла́вать.'
    options: [идёт, хо́дит, хожу́, ходи́ть]
    answer: хо́дит
  - stem: — Ско́лько ___ лимо́ны? — Два́дцать рубле́й шту́ка.
    options: [сто́ит, сто́ят, сто́ить, сто́ю]
    answer: сто́ят
  - stem: 'Мой друг не ___ пла́вать: в его́ шко́ле не́ было бассе́йна.'
    options: [зна́ет, хо́чет, уме́ет, лю́бит]
    answer: уме́ет
  - stem: 'В ___ у нас нет уро́ков: э́то выходно́й.'
    options: [воскресе́нье, понеде́льник, сре́ду, четве́рг]
    answer: воскресе́нье
  - stem: Мы ча́сто говори́м о ___ преподава́теле.
    options: [ваш, ва́шего, ва́шей, ва́шем]
    answer: ва́шем
  - stem: — Здесь ___ апте́ка? — Да, вот она́.
    options: [где, нет, есть, был]
    answer: есть
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Сосе́ди**

    В сосе́днюю кварти́ру неда́вно въе́хала но́вая (1) []{.blank}. Они́ (2) []{.blank} Каза́ни: па́па — врач, ма́ма — инжене́р, и у них есть (3) []{.blank}, шко́льник. Кварти́ра у них (4) []{.blank}: четы́ре (5) []{.blank}.

    Ка́ждое у́тро я (6) []{.blank} в институ́т, а э́тот ма́льчик — в шко́лу напро́тив (7) []{.blank} до́ма. Ма́льчик (8) []{.blank}, всегда́ улыба́ется и говори́т: «До́брое у́тро!»

    Вчера́ бы́ло (9) []{.blank}, и я весь день гуля́л по го́роду. В (10) []{.blank} — э́тот ма́льчик, игра́ет в футбо́л. На (11) []{.blank} — опя́ть он, покупа́ет карто́шку. Захожу́ в (12) []{.blank} — и он там, чита́ет! Он что, так (13) []{.blank} хо́дит?

    А сего́дня у подъе́зда стоя́т (14) []{.blank} ма́льчика, и у них одно́ лицо́. Их (15) []{.blank} смеётся: «Э́то мои́ сыновья́: Ко́ля, Пе́тя и Ва́ня».

    Тепе́рь всё (16) []{.blank}: Ва́ня лю́бит (17) []{.blank}, Пе́тя — (18) []{.blank}, а Ко́ля ча́сто хо́дит на (19) []{.blank}. Вот то́лько кто из (20) []{.blank} Ко́ля, а кто Пе́тя, я пока́ не зна́ю.
    :::
  glossary:
  - {ru: въе́хала, zh: 搬进来（过去时，阴性）}
  - {ru: по го́роду, zh: 在城里到处（走）}
  - {ru: улыба́ется, zh: 微笑}
  - {ru: захожу́, zh: 走进，进去}
  - {ru: подъе́зд, pos: m, zh: 单元门口}
  - {ru: смеётся, zh: 笑}
  - {ru: сыновья́, zh: 儿子们（сын 的复数）}
  passage_zh: |
    **邻居**

    隔壁最近搬来了新的一家。他们是从喀山来的：爸爸是医生，妈妈是工程师，还有个儿子，是中学生。他们家房子很大：有四个房间。

    每天早上我去学院，这个男孩去我们楼对面的学校。男孩很开朗，总是笑着说：“早上好！”

    昨天是星期天，我在城里逛了一整天。公园里——这个男孩在踢足球。市场上——又是他，在买土豆。我走进图书馆——他也在，在看书！他走路就这么快吗？

    今天单元门口站着三个男孩，长得一模一样。他们的妈妈笑着说：“这是我的儿子们：科利亚、别佳和瓦尼亚。”

    现在全明白了：瓦尼亚喜欢足球，别佳喜欢书，科利亚常去市场。只是谁是科利亚、谁是别佳，我还分不清。
  why: 第 1 空：后一句用 [Они́]{.ru}，接着介绍爸爸、妈妈和儿子，搬来的是一家人：[семья́]{.ru}（第 14 课）。第 2 空：说从哪个城市来，用 [из]{.ru} + 第二格；[с]{.ru} 用于 [рабо́та, ры́нок]{.ru} 这类和 [на]{.ru} 连用的词（第 36 课）。第 3 空：后面说明是 [шко́льник]{.ru}，下文一直说“这个男孩”，所以是儿子 [сын]{.ru}；[дочь]{.ru} 和阳性的 [шко́льник]{.ru} 矛盾（第 4、35 课）。第 4 空：冒号后在解释：有四个房间，所以房子大：[больша́я]{.ru}；结尾知道他们家有三个孩子，四个房间也就说得通了（第 9 课）。第 5 空：[четы́ре]{.ru} 后用单数第二格 [ко́мнаты]{.ru}；[ко́мнат]{.ru} 用在 [пять]{.ru} 以上（第 35 课）。第 6 空：主语 [я]{.ru}，[ходи́ть]{.ru} 第一人称单数是 [хожу́]{.ru}，[д]{.ru} 变成 [ж]{.ru}；[хо́дит, хо́дим]{.ru} 人称不对，[ходи́ть]{.ru} 是不定式（第 25 课）。第 7 空：[напро́тив]{.ru} 要求第二格，[дом]{.ru} 是阳性，物主代词用 [на́шего]{.ru}（第 34、37 课）。第 8 空：后面说他总是笑着打招呼，说明他开朗：[весёлый]{.ru}；他是中学生，[ста́рый, молодо́й, ста́рший]{.ru} 都不合适（第 31 课）。第 9 空：“我”逛了一整天，男孩也一整天在公园、市场、图书馆，没去上学，所以是星期天：[воскресе́нье]{.ru}（第 16、29 课）。第 10 空：他在那里踢足球，是公园：[па́рке]{.ru}；这天学校、学院不上课，商店里也不踢球（第 16 课）。第 11 空：他在那里买土豆，是市场：[ры́нке]{.ru}（第 39 课）。第 12 空：他在那里看书：[библиоте́ке]{.ru}（第 11 课）。第 13 空：“我”一天在三个地方都碰见他，开玩笑地问“他走得就这么快吗”：[бы́стро]{.ru}；[ме́дленно, ре́дко, пло́хо]{.ru} 都和“到处碰见他”对不上（第 7 课）。第 14 空：妈妈接着说出三个名字：[три]{.ru}；[пять]{.ru} 后要说 [ма́льчиков]{.ru}，这里是 [ма́льчика]{.ru}，说明数字在 2–4 之间（第 35 课）。第 15 空：说“这是我的儿子们”的是他们的妈妈：[ма́ма]{.ru}；奶奶会说“孙子”，姐姐、邻居都不会说“我的儿子”。第 16 空：前面一直奇怪他怎么到处都在，见到三个长得一样的男孩，事情就清楚了：[поня́тно]{.ru}（第 15 课）。第 17、18、19 空：要回到第三段：在公园踢球的、在图书馆看书的、在市场买土豆的，原来是三个人。所以一个喜欢 [футбо́л]{.ru}，一个喜欢 [кни́ги]{.ru}，一个常去 [ры́нок]{.ru}（第 26、39 课）。第 20 空：[из]{.ru} 后用第二格，[они́]{.ru} 在前置词后是 [них]{.ru}；[их]{.ru} 是不带前置词的形式（第 31、36 课）。
  items:
  - options: [де́вочка, соба́ка, студе́нтка, семья́]
    answer: семья́
  - options: [с, у, из, без]
    answer: из
  - options: [дочь, сын, брат, дя́дя]
    answer: сын
  - options: [ма́ленькая, ста́рая, больша́я, ти́хая]
    answer: больша́я
  - options: [ко́мнаты, ко́мната, ко́мнат, ко́мнату]
    answer: ко́мнаты
  - options: [хо́дит, хо́дим, ходи́ть, хожу́]
    answer: хожу́
  - options: [наш, на́шего, на́шем, на́шей]
    answer: на́шего
  - options: [ста́рый, ста́рший, весёлый, молодо́й]
    answer: весёлый
  - options: [понеде́льник, воскресе́нье, вто́рник, четве́рг]
    answer: воскресе́нье
  - options: [шко́ле, институ́те, магази́не, па́рке]
    answer: па́рке
  - options: [ры́нке, ка́федре, конце́рте, уро́ке]
    answer: ры́нке
  - options: [бассе́йне, апте́ке, библиоте́ке, теа́тре]
    answer: библиоте́ке
  - options: [ме́дленно, бы́стро, ре́дко, пло́хо]
    answer: бы́стро
  - options: [два, пять, четы́ре, три]
    answer: три
  - options: [ма́ма, ба́бушка, сестра́, сосе́дка]
    answer: ма́ма
  - options: [пло́хо, ти́хо, ве́село, поня́тно]
    answer: поня́тно
  - options: [ша́хматы, футбо́л, му́зыку, хокке́й]
    answer: футбо́л
