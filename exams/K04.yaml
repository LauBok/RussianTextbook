- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ю́ми**

    Ю́ми — япо́нка. Она́ из Япо́нии, из ма́ленького го́рода у мо́ря. Сейча́с Ю́ми у́чится в Москве́, в МГУ, на филологи́ческом факульте́те. Она́ живёт в общежи́тии. В её ко́мнате живёт ещё одна́ студе́нтка — китая́нка.

    Ю́ми — еди́нственная дочь. Её па́па рабо́тает в поликли́нике, а ма́ма — в шко́ле, она́ учи́тель. Ба́бушка Ю́ми живёт ря́дом, в сосе́днем до́ме. У ба́бушки большо́й сад и ста́рая весёлая соба́ка.

    Ра́ньше Ю́ми не зна́ла ру́сский язы́к. В шко́ле она́ изуча́ла англи́йский. Но ба́бушка о́чень люби́ла ру́сскую му́зыку, и ве́чером они́ ча́сто вме́сте слу́шали Чайко́вского. Тепе́рь Ю́ми то́же лю́бит ру́сскую му́зыку и изуча́ет ру́сский язы́к.

    Ка́ждое воскресе́нье Ю́ми звони́т домо́й. Ма́ма спра́шивает о Москве́, о гру́ппе и о преподава́теле, а ба́бушка — о Большо́м теа́тре и о консервато́рии. В Москве́ Ю́ми ча́сто хо́дит на конце́рты, и ба́бушка всегда́ говори́т: «Как интере́сно!»
    :::
  passage_zh: |
    **由美**

    由美是日本人。她从日本来，家在海边的一个小城。现在由美在莫斯科读书，在莫斯科大学语文系。她住在宿舍。她的房间里还住着一个女大学生——中国人。

    由美是独生女。她爸爸在诊所工作，妈妈在学校工作，是老师。由美的奶奶住在附近，在旁边那栋楼里。奶奶有一个大花园，还有一条快活的老狗。

    以前由美不会俄语。她在中学学的是英语。可是奶奶非常喜欢俄罗斯音乐，晚上她们常常一起听柴可夫斯基。现在由美也喜欢俄罗斯音乐，还学起了俄语。

    每个星期天由美都往家里打电话。妈妈问莫斯科怎么样，问她的班和老师；奶奶问大剧院和音乐学院。在莫斯科由美常常去听音乐会，奶奶总是说：“真有意思！”
  why: 第 1 题，[В шко́ле она́ изуча́ла англи́йский]{.ru}；俄语是她现在学的。第 2 题，同屋是 [китая́нка]{.ru}“中国女人”，所以是从中国来的（第 36 课）。第 3 题，[Ю́ми — еди́нственная дочь]{.ru}“独生女”，所以她没有兄弟姐妹。第 4 题，爸爸在 [поликли́ника]{.ru}“诊所”工作，可以推断他是医生；在学校工作、当老师的是妈妈。第 5 题，[ба́бушка о́чень люби́ла ру́сскую му́зыку]{.ru}；由美以前不会俄语，是后来才喜欢上俄罗斯音乐的。
  items:
  - stem: В шко́ле Ю́ми изуча́ла ___ язы́к.
    options: [ру́сский, кита́йский, францу́зский, англи́йский]
    answer: англи́йский
  - stem: В ко́мнате Ю́ми живёт студе́нтка ___.
    options: [из Кита́я, из Япо́нии, из Фра́нции, из Росси́и]
    answer: из Кита́я
  - stem: У Ю́ми ___.
    options: [есть брат, есть сестра́, нет бра́та и сестры́, есть брат и сестра́]
    answer: нет бра́та и сестры́
  - stem: Па́па Ю́ми — ___.
    options: [учи́тель, инжене́р, врач, студе́нт]
    answer: врач
  - stem: Ра́ньше ру́сскую му́зыку о́чень люби́ла ___.
    options: [ба́бушка Ю́ми, ма́ма Ю́ми, па́па Ю́ми, студе́нтка из Кита́я]
    answer: ба́бушка Ю́ми
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Пьер]{.sp} А́нна, приве́т! Э́то Пьер. Я уже́ в метро́, на ста́нции «Университе́т». А где ваш дом?
    [А́нна]{.sp} Приве́т, Пьер! Наш дом недалеко́. Ты ви́дишь большо́й парк?
    [Пьер]{.sp} Да, ви́жу. Он напро́тив метро́.
    [А́нна]{.sp} А наш дом напро́тив па́рка. Э́то большо́й ста́рый дом. О́коло до́ма апте́ка и магази́н.
    [Пьер]{.sp} А до до́ма далеко́?
    [А́нна]{.sp} Нет, пешко́м де́сять мину́т. Кварти́ра со́рок два.
    [Пьер]{.sp} Хорошо́. А кто сейча́с до́ма? Ван Лэй до́ма?
    [А́нна]{.sp} Нет, его́ нет. Он в библиоте́ке, он там занима́ется до обе́да. Ма́мы то́же нет, она́ на рабо́те, в поликли́нике. А па́па до́ма, он гото́вит обе́д: пироги́ и ка́шу.
    [Пьер]{.sp} А Ми́ша?
    [А́нна]{.sp} Ми́ша в па́рке, игра́ет в футбо́л. Мо́жет быть, ты его́ ви́дишь.
    [Пьер]{.sp} Да, вот он! Он хорошо́ игра́ет.
    [А́нна]{.sp} Ну, мы ждём тебя́!
    [Пьер]{.sp} Иду́! А у меня́ есть пода́рок — кни́га о Фра́нции.
    [А́нна]{.sp} Спаси́бо! Па́па о́чень лю́бит Фра́нцию, он был там ра́ньше.
    :::
  passage_zh: |
    皮埃尔：安娜，你好！我是皮埃尔。我已经到地铁了，在“大学”站。你们家在哪儿？

    安娜：你好，皮埃尔！我们家不远。你看见一个大公园了吗？

    皮埃尔：看见了。公园在地铁站对面。

    安娜：我们家就在公园对面。是一栋高大的旧楼。楼旁边有药店和商店。

    皮埃尔：到你们家远吗？

    安娜：不远，走路十分钟。四十二号房。

    皮埃尔：好。现在谁在家？王磊在家吗？

    安娜：不在。他在图书馆，在那儿学习到午饭前。妈妈也不在，她在上班，在诊所。爸爸在家，他在做午饭：馅饼和麦片粥。

    皮埃尔：米沙呢？

    安娜：米沙在公园踢足球。说不定你能看见他。

    皮埃尔：看见了，他在那儿！他踢得真好。

    安娜：好啦，我们等你！

    皮埃尔：这就来！我还带了礼物——一本介绍法国的书。

    安娜：谢谢！爸爸很喜欢法国，他以前去过那儿。
  why: 第 1 题，安娜说 [па́па до́ма]{.ru}，接电话的安娜自己也在家；王磊在图书馆，妈妈在诊所，米沙在公园。第 2 题，[наш дом напро́тив па́рка]{.ru}；药店和商店在楼旁边，不在楼对面。第 3 题，[пешко́м де́сять мину́т]{.ru}。第 4 题，[Ма́мы то́же нет, она́ на рабо́те, в поликли́нике]{.ru}；[поликли́ника]{.ru} 是诊所，玛丽亚·尼古拉耶夫娜是医生。第 5 题，米沙在地铁站对面的公园里踢球，皮埃尔说 [Да, вот он!]{.ru}，他看见的是米沙。
  items:
  - stem: Сейча́с до́ма ___.
    options: [А́нна и Мари́я Никола́евна, А́нна и Ива́н Серге́евич, А́нна и Ми́ша, А́нна и Ван Лэй]
    answer: А́нна и Ива́н Серге́евич
  - stem: Дом А́нны нахо́дится ___.
    options: [напро́тив апте́ки, в па́рке, напро́тив магази́на, напро́тив па́рка]
    answer: напро́тив па́рка
  - stem: Пешко́м до до́ма А́нны ___.
    options: [два часа́, пять мину́т, де́сять мину́т, со́рок мину́т]
    answer: де́сять мину́т
  - stem: Мари́я Никола́евна сейча́с ___.
    options: [в библиоте́ке, в поликли́нике, в па́рке, до́ма]
    answer: в поликли́нике
  - stem: Пьер ви́дит ___.
    options: [Ми́шу, А́нну, Ива́на Серге́евича, Мари́ю Никола́евну]
    answer: Ми́шу
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的市场介绍，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ры́нок «Све́жий»**

    Наш ры́нок нахо́дится о́коло ста́нции метро́ «Университе́т», напро́тив апте́ки. Ра́ньше в э́том большо́м ста́ром зда́нии был заво́д, а тепе́рь здесь ры́нок. У нас вы мо́жете не то́лько покупа́ть карто́шку и я́блоки: здесь вы мо́жете пить горя́чий чай и́ли ко́фе и есть вку́сные сы́рники.

    | | |
    |---|---|
    | понеде́льник | 7.00—12.00 |
    | вто́рник — воскресе́нье | 7.00—19.00 |

    | | |
    |---|---|
    | карто́шка | 45 рубле́й килогра́мм |
    | я́блоки | 90 рубле́й килогра́мм |
    | са́хар | 70 рубле́й килогра́мм |
    | лимо́ны | 33 рубля́ шту́ка |
    | хлеб | 52 рубля́ шту́ка |

    Здесь всё све́жее! Карто́шка, я́блоки и лимо́ны у нас то́лько хоро́шие, а хлеб всегда́ горя́чий. В суббо́ту и в воскресе́нье у́тром здесь игра́ет му́зыка.

    Вы не зна́ете, ско́лько сто́ят я́блоки? Вы не по́мните, где хлеб? Здесь всегда́ рабо́тают до́брые продавцы́. Они́ всё зна́ют! Мы ждём вас ка́ждый день!
    :::
  passage_zh: |
    **“新鲜”市场**

    我们的市场在“大学”地铁站附近，药店对面。以前这栋高大的旧楼是一家工厂，现在这里是市场。在我们这儿您不光能买土豆和苹果，还可以喝热茶或咖啡，吃好吃的奶渣饼。

    | | |
    |---|---|
    | 星期一 | 7:00—12:00 |
    | 星期二—星期天 | 7:00—19:00 |

    | | |
    |---|---|
    | 土豆 | 每公斤 45 卢布 |
    | 苹果 | 每公斤 90 卢布 |
    | 白糖 | 每公斤 70 卢布 |
    | 柠檬 | 每个 33 卢布 |
    | 面包 | 每个 52 卢布 |

    这里样样都新鲜！我们的土豆、苹果和柠檬都是好的，面包总是热乎乎的。星期六和星期天上午这里有音乐。

    您不知道苹果多少钱？您不记得面包在哪儿？这里总有和气的售货员。他们什么都知道！我们每天都等着您！
  why: 第 1 题，柠檬每个 33 卢布，两个是 66：[шестьдеся́т шесть]{.ru} 最后一个词是 [шесть]{.ru}，用 [рубле́й]{.ru}（第 39 课）。第 2 题，土豆每公斤 45 卢布，两公斤是 90 卢布。第 3 题，表里 52 卢布一个的是 [хлеб]{.ru}。第 4 题，[напро́тив апте́ки]{.ru}；市场在地铁站附近，不在地铁站对面。第 5 题，星期一 7:00—12:00，只在上午营业。
  items:
  - stem: Два лимо́на сто́ят ___.
    options: [три́дцать три рубля́, шестьдеся́т два рубля́, девяно́сто рубле́й, шестьдеся́т шесть рубле́й]
    answer: шестьдеся́т шесть рубле́й
  - stem: Два килогра́мма карто́шки сто́ят ___.
    options: [со́рок пять рубле́й, пятьдеся́т два рубля́, се́мьдесят рубле́й, девяно́сто рубле́й]
    answer: девяно́сто рубле́й
  - stem: Пятьдеся́т два рубля́ сто́ит ___.
    options: [хлеб, лимо́н, са́хар, карто́шка]
    answer: хлеб
  - stem: Ры́нок нахо́дится ___.
    options: [напро́тив метро́, о́коло па́рка, напро́тив апте́ки, в метро́]
    answer: напро́тив апте́ки
  - stem: В понеде́льник ры́нок рабо́тает ___.
    options: [то́лько ве́чером, то́лько у́тром, у́тром и ве́чером, но́чью]
    answer: то́лько у́тром
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Шко́ла в Росси́и**

    В Росси́и де́ти у́чатся в шко́ле оди́ннадцать лет. До шко́лы ма́ленькие ма́льчики и де́вочки хо́дят в де́тский сад. Шко́ла ча́сто нахо́дится ря́дом, в сосе́днем до́ме и́ли на сосе́дней у́лице, и де́ти хо́дят туда́ пешко́м.

    Уро́ки начина́ются ра́но у́тром, а конча́ются днём. Обе́дают шко́льники в шко́ле. В шко́ле они́ изуча́ют ру́сский язы́к, исто́рию, му́зыку. Мно́гие шко́льники изуча́ют и англи́йский язы́к, а иногда́ ещё францу́зский и́ли кита́йский.

    По́сле шко́лы де́ти возвраща́ются домо́й и де́лают уро́ки. Мно́гие ещё игра́ют в футбо́л и́ли в хокке́й, пла́вают в бассе́йне и́ли игра́ют в ша́хматы.

    Ра́ньше шко́льники учи́лись и в суббо́ту, а отдыха́ли то́лько в воскресе́нье. Тепе́рь мно́гие шко́лы в суббо́ту не рабо́тают, и в э́тот день шко́льники гуля́ют в па́рке, хо́дят в кино́ и́ли е́здят на да́чу.
    :::
  passage_zh: |
    **俄罗斯的中小学**

    在俄罗斯，孩子们在中小学读十一年书。上学以前，小男孩和小女孩上幼儿园。学校常常就在附近，在旁边那栋楼里或者旁边那条街上，孩子们走着去上学。

    早上很早就开始上课，下午放学。学生们在学校吃午饭。在学校他们学俄语、历史、音乐。很多学生还学英语，有的还学法语或汉语。

    放学以后孩子们回家做功课。很多孩子还踢足球或打冰球，去游泳馆游泳，或者下国际象棋。

    以前学生们星期六也上学，只有星期天休息。现在很多学校星期六不上课，这一天学生们去公园散步、看电影，或者去别墅。
  why: 第 1 题，第一句 [оди́ннадцать лет]{.ru}。第 2 题，[До шко́лы … хо́дят в де́тский сад]{.ru}。第 3 题，[Обе́дают шко́льники в шко́ле]{.ru}。第 4 题，[По́сле шко́лы де́ти возвраща́ются домо́й и де́лают уро́ки]{.ru}；外语是在课上学的。第 5 题，[мно́гие шко́лы в суббо́ту не рабо́тают]{.ru}：很多学校星期六不开课，这些学生星期六就不上学了；选项里的“上学上到晚上”“写作业”文中都没有说是星期六的事。
  items:
  - stem: В Росси́и де́ти у́чатся в шко́ле ___.
    options: [двена́дцать лет, де́сять лет, де́вять лет, оди́ннадцать лет]
    answer: оди́ннадцать лет
  - stem: До шко́лы ма́ленькие де́ти хо́дят ___.
    options: [в бассе́йн, в де́тский сад, в университе́т, на да́чу]
    answer: в де́тский сад
  - stem: Днём шко́льники обе́дают ___.
    options: [в шко́ле, до́ма, у ба́бушки, в па́рке]
    answer: в шко́ле
  - stem: По́сле шко́лы де́ти ___.
    options: [изуча́ют англи́йский язы́к, слу́шают ле́кции, де́лают уро́ки, хо́дят в де́тский сад]
    answer: де́лают уро́ки
  - stem: Тепе́рь в суббо́ту мно́гие шко́льники ___.
    options: [у́чатся до ве́чера, пи́шут упражне́ния, хо́дят в де́тский сад, не у́чатся]
    answer: не у́чатся
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Наш райо́н**

    Мы (1) []{.blank} (жить) в ти́хом райо́не. Напро́тив (2) []{.blank} (наш дом) — большо́й парк. Ра́ньше в на́шем райо́не не́ было (3) []{.blank} (ры́нок), а тепе́рь он есть. Я́блоки там сто́ят со́рок пять (4) []{.blank} (рубль) килогра́мм.

    Мой брат Ми́ша (5) []{.blank} (учи́ться) в (6) []{.blank} (ста́рая шко́ла) о́коло па́рка. По́сле шко́лы он всегда́ (7) []{.blank} (хоте́ть) игра́ть в футбо́л, а не де́лать уро́ки.

    У (8) []{.blank} (на́ша сосе́дка) есть ма́ленькая соба́ка. Вчера́ Ми́ша и Ван Лэй (9) []{.blank} (гуля́ть) в па́рке и (10) []{.blank} (ви́деть) там э́ту соба́ку.
    :::
  passage_zh: |
    **我们的街区**

    我们住在一个安静的街区。我们家对面是一个大公园。以前我们这个街区没有市场，现在有了。那里的苹果四十五卢布一公斤。

    我弟弟米沙在公园附近的一所老学校上学。放学以后他总是想踢足球，而不想做功课。

    我们的女邻居有一条小狗。昨天米沙和王磊在公园散步，在那里看见了这条狗。
  why: 第 1 空：主语 [мы]{.ru}，[жить]{.ru} 变位时加 [в]{.ru}：[живём]{.ru}（第 14 课）。第 2 空：[напро́тив]{.ru} 要求第二格，[дом]{.ru} 是阳性，物主代词阳性第二格 [на́шего]{.ru}：[на́шего до́ма]{.ru}（第 34、37 课）。第 3 空：[не́ было]{.ru} 后用第二格；[ры́нок]{.ru} 变格时 [о]{.ru} 脱落：[ры́нка]{.ru}（第 32 课）。第 4 空：数词最后一个词是 [пять]{.ru}，[рубль]{.ru} 用复数第二格 [рубле́й]{.ru}（第 39 课）。第 5 空：在某所学校读书用 [учи́ться]{.ru}，第三人称单数 [у́чится]{.ru}，辅音后加 [-ся]{.ru}（第 38 课）。第 6 空：[в]{.ru} + 第六格，[шко́ла]{.ru} 是阴性，形容词和名词都要变：[ста́рой шко́ле]{.ru}（第 18 课）。第 7 空：[хоте́ть]{.ru} 单数按第一变位，[т]{.ru} 变 [ч]{.ru}：[хо́чет]{.ru}（第 26 课）。第 8 空：[у]{.ru} 要求第二格，[сосе́дка]{.ru} 是阴性，形容词和名词都变：[на́шей сосе́дки]{.ru}；[к]{.ru} 后写 [и]{.ru}（第 31、34 课）。第 9 空：[вчера́]{.ru} 用过去时，两个人做主语用复数 [гуля́ли]{.ru}（第 17 课）。第 10 空：同样是过去时复数 [ви́дели]{.ru}（第 9、17 课）。
