    科斯佳：帕沙，你好！我是科斯佳。我已经到地铁站了，可不知道你家在哪儿。

    帕沙：你看见学校了吗？就在地铁对面。

    科斯佳：看见了。

    帕沙：我家就在学校对面，又大又新的那栋楼。楼旁边有个药店。

    科斯佳：几号房？

    帕沙：十九号。我爸妈不在，上班去了，家里就我和爷爷。他早就盼着你来了：他喜欢下国际象棋，可我下得不好。

    科斯佳：没关系！我下得好。

    帕沙：哎，我们家没面包了。你能买点吗？药店旁边有个小商店。

    科斯佳：我买。马上到！

    帕沙：谢谢！等你！
  why: 第 1 题，[Наш дом напро́тив шко́лы]{.ru}；在地铁对面的是学校，不是帕沙家。第 2 题，[Роди́телей нет … до́ма то́лько мы с де́душкой]{.ru}。第 3 题，爷爷等科斯佳是因为 [лю́бит ша́хматы, а я игра́ю пло́хо]{.ru}：他想找科斯佳下棋。第 4 题，帕沙自己说 [я игра́ю пло́хо]{.ru}，科斯佳说自己下得好。第 5 题，帕沙请他买面包，告诉他药店旁边有商店，科斯佳答 [Куплю́]{.ru}：他现在去商店；药店只是用来指路的。
