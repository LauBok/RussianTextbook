lesson: K04
heading: 第四套
range: L01-L39
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答里的 [оно́]{.ru} 代替 [письмо́]{.ru}，[письмо́]{.ru} 以 [-о]{.ru} 结尾，是中性，物主代词用 [моё]{.ru}（第 2、3 课）。第 2 题：前置词 [у]{.ru} 后面的第三人称代词要加 [н-]{.ru}：[у него́]{.ru}；[его́]{.ru} 不能直接放在 [у]{.ru} 后面，[неё]{.ru} 指女性，[он]{.ru} 是第一格（第 31 课）。第 3 题：[тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，是阴性，回答也是 [Моя́]{.ru}，所以问 [Чья]{.ru}（第 8 课）。第 4 题：[нет]{.ru} 后面用第二格，[апте́ка → апте́ки]{.ru}；[к]{.ru} 后面不写 [ы]{.ru}（第 32 课）。第 5 题：形容词和 [го́род]{.ru} 一致，[го́род]{.ru} 是阳性，用 [большо́й]{.ru}；不要受阴性的 [Москва́]{.ru} 影响（第 9 课）。第 6 题：表示“谁的”，名词第二格放在后面：[маши́на отца́]{.ru}；[оте́ц]{.ru} 变格时 [е]{.ru} 脱落（第 33 课）。第 7 题：[на́ши]{.ru} 是复数，名词也用复数第一格 [словари́]{.ru}；[словаря́]{.ru} 是单数第二格（第 5 课）。第 8 题：[друг]{.ru} 是阳性，在 [сестра́]{.ru} 后面用第二格，物主代词阳性第二格是 [моего́]{.ru}；[мое́й]{.ru} 是阴性，容易受 [сестра́]{.ru} 影响选错（第 34 课）。第 9 题：[ле́кция]{.ru} 是活动，“在上课”用 [на]{.ru} + 第六格，[-ия]{.ru} 结尾的名词第六格是 [-ии]{.ru}：[на ле́кции]{.ru}；[на ле́кцию]{.ru} 表示去向（第 12 课）。第 10 题：[два]{.ru} 后面用单数第二格 [стола́]{.ru}；[столы́]{.ru} 是复数第一格（第 35 课）。第 11 题：[о]{.ru} 要求第六格，[он]{.ru} 的第六格是 [нём]{.ru}；[него́]{.ru} 是第二格（第 13 课）。第 12 题：问“从哪里来”，表示“在哪里”时用 [на]{.ru} 的名词（[на уро́ке]{.ru}），“从那里”就用 [с]{.ru} + 第二格：[с уро́ка]{.ru}；[на уро́к]{.ru} 回答“去哪儿”（第 36 课）。第 13 题：[вчера́]{.ru} 用过去时，[Ю́ми]{.ru} 是女性，用 [чита́ла]{.ru}（第 17 课）。第 14 题：[без]{.ru} 要求第二格：[без са́хара]{.ru}（第 37 课）。第 15 题：[ко́мната]{.ru} 是阴性，[в]{.ru} 后用第六格，[тот]{.ru} 的阴性第六格是 [той]{.ru}（第 19 课）。第 16 题：“在图书馆学习、用功”用 [занима́ться]{.ru}，主语 [Ю́ми]{.ru} 是单数：[занима́ется]{.ru}；[учи́ться]{.ru} 指在某个学校读书，[учи́ть]{.ru} 要带宾语，[занима́ются]{.ru} 是复数（第 38 课）。第 17 题：[иска́ть]{.ru} 后面的宾语用第四格，阴性形容词第四格词尾 [-ую]{.ru}：[япо́нскую кни́гу]{.ru}（第 23 课）。第 18 题：数词最后一个词是 [два]{.ru}，[рубль]{.ru} 用单数第二格 [рубля́]{.ru}（第 39 课）。第 19 题：[знать]{.ru} 后用第四格，[Пьер]{.ru} 是男性，用 [его́]{.ru}；前面没有前置词，不加 [н-]{.ru}（第 22、31 课）。第 20 题：[ре́дко]{.ru} 说的是经常性的往返，用不定向动词，主语 [Ми́ша]{.ru} 是第三人称单数：[хо́дит]{.ru}；[идёт]{.ru} 表示此刻朝一个方向走（第 25 课）。第 21 题：主语 [я́блоки]{.ru} 是复数，用 [сто́ят]{.ru}；[стоя́т]{.ru} 是 [стоя́ть]{.ru}“站着、立着”，重音不同，是另一个动词（第 7、39 课）。第 22 题：主语 [мы]{.ru}，[мочь]{.ru} 的第一人称复数是 [мо́жем]{.ru}（第 27 课）。第 23 题：“在星期几”用 [в]{.ru} + 第四格：[в пя́тницу]{.ru}（第 29 课）。第 24 题：[говори́ть]{.ru} 后面用副词 [по-япо́нски]{.ru}；[япо́нский]{.ru} 是形容词，要修饰 [язы́к]{.ru}（第 15 课）。第 25 题：问名字，回答 [Меня́ зову́т…]{.ru}；其他三句回答的是“从哪里来”“做什么的”“怎么样”（第 4 课）。
  items:
  - stem: — Где ___ письмо́? — Вот оно́.
    options: [мой, моя́, мои́, моё]
    answer: моё
  - stem: Ива́н Серге́евич — инжене́р. У ___ есть маши́на.
    options: [него́, он, его́, неё]
    answer: него́
  - stem: — ___ э́то тетра́дь? — Моя́.
    options: [Чей, Чья, Чьё, Чьи]
    answer: Чья
  - stem: На на́шей у́лице нет ___.
    options: [апте́ка, апте́ку, апте́ки, апте́ке]
    answer: апте́ки
  - stem: Москва́ — ___ го́род.
    options: [больша́я, большо́е, больши́е, большо́й]
    answer: большо́й
  - stem: — Чья э́то си́няя маши́на? — Э́то маши́на ___.
    options: [оте́ц, отце́, отца́, отцы́]
    answer: отца́
  - stem: — Где ва́ши словари́? — Вот на́ши ___.
    options: [словари́, слова́рь, словаря́, словаре́]
    answer: словари́
  - stem: Э́то сестра́ ___ дру́га.
    options: [мой, моего́, мое́й, моём]
    answer: моего́
  - stem: Ю́ми и Пьер не в общежи́тии, они́ сейча́с ___.
    options: [в ле́кции, на ле́кцию, в ле́кцию, на ле́кции]
    answer: на ле́кции
  - stem: В ко́мнате Ми́ши два ___.
    options: [стол, столы́, стола́, столо́в]
    answer: стола́
  - stem: Ван Лэй — наш друг. Мы ча́сто говори́м о ___.
    options: [нём, он, него́, его́]
    answer: нём
  - stem: — Отку́да ты идёшь? — ___.
    options: [Из уро́ка, С уро́ка, На уро́к, На уро́ке]
    answer: С уро́ка
  - stem: Вчера́ Ю́ми ___ рома́н.
    options: [чита́л, чита́ли, чита́ла, чита́ет]
    answer: чита́ла
  - stem: Ми́ша всегда́ пьёт чай без ___.
    options: [са́хара, са́хар, са́харе, са́харом]
    answer: са́хара
  - stem: Пьер живёт в ___ ко́мнате.
    options: [тот, той, та, том]
    answer: той
  - stem: Сего́дня Ю́ми до ве́чера ___ в библиоте́ке.
    options: [у́чится, у́чит, занима́ются, занима́ется]
    answer: занима́ется
  - stem: Ю́ми давно́ и́щет ___ кни́гу.
    options: [япо́нская, япо́нской, япо́нский, япо́нскую]
    answer: япо́нскую
  - stem: — Ско́лько сто́ит слова́рь? — Со́рок два ___.
    options: [рубль, рубле́й, рубля́, рубли́]
    answer: рубля́
  - stem: — Ты зна́ешь Пье́ра? — Да, я давно́ зна́ю ___.
    options: [его́, него́, он, её]
    answer: его́
  - stem: Ми́ша ре́дко ___ в библиоте́ку.
    options: [идёт, хо́дит, хожу́, ходи́ть]
    answer: хо́дит
  - stem: — Ско́лько ___ я́блоки? — Девяно́сто рубле́й килогра́мм.
    options: [сто́ит, сто́ят, стоя́т, сто́ить]
    answer: сто́ят
  - stem: 'Сего́дня мы не ___ гуля́ть: мы де́лаем уро́ки.'
    options: [мо́гут, могу́, мо́жем, мо́жете]
    answer: мо́жем
  - stem: В ___ ве́чером мы бы́ли в теа́тре.
    options: [пя́тницу, пя́тница, пя́тнице, пя́тницы]
    answer: пя́тницу
  - stem: Ю́ми хорошо́ говори́т ___.
    options: [япо́нский, япо́нская, япо́нское, по-япо́нски]
    answer: по-япо́нски
  - stem: — Как вас зову́т? — ___
    options: [Меня́ зову́т Ю́ми., Я из Япо́нии., Я студе́нтка., Хорошо́.]
    answer: Меня́ зову́т Ю́ми.
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Мой друг Пьер**

    Пьер — мой (1) []{.blank} друг. Он францу́з, он из (2) []{.blank}. Сейча́с Пьер (3) []{.blank} в Москве́, в на́шем университе́те. Он живёт в общежи́тии. Общежи́тие нахо́дится (4) []{.blank} университе́та, и ка́ждый день Пьер (5) []{.blank} на уро́ки пешко́м.

    У Пье́ра (6) []{.blank} семья́: па́па, ма́ма, два (7) []{.blank} и ста́ршая сестра́. Всего́ их шесть (8) []{.blank}. Сестра́ Пье́ра то́же студе́нтка. Ра́ньше она́ (9) []{.blank} ру́сский язы́к, а тепе́рь изуча́ет кита́йский. Она́ уже́ хорошо́ говори́т (10) []{.blank}!

    Вчера́ ве́чером я был в (11) []{.blank} Пье́ра. Ко́мната ма́ленькая, но ую́тная: там стоя́т стол, крова́ть и шкаф, а телеви́зора (12) []{.blank}. Пьер не смо́трит телеви́зор, он лю́бит (13) []{.blank}. Мы (14) []{.blank} чай и разгова́ривали о (15) []{.blank} семье́. Пото́м Пьер пока́зывал фо́то (16) []{.blank} сестры́. Его́ семья́ живёт во Фра́нции, в (17) []{.blank} до́ме. О́коло (18) []{.blank} — большо́й сад.

    В Москве́ Пьер ча́сто (19) []{.blank} о семье́. Домо́й я е́хал по́здно: бы́ло уже́ (20) []{.blank} часо́в.
    :::
  passage_zh: |
    **我的朋友皮埃尔**

    皮埃尔是我的好朋友。他是法国人，从法国来。现在皮埃尔在莫斯科，在我们大学读书。他住在宿舍。宿舍在学校对面，皮埃尔每天走着去上课。

    皮埃尔家是个大家庭：爸爸、妈妈、两个兄弟和一个姐姐。他们家一共六口人。皮埃尔的姐姐也是大学生。她以前学俄语，现在学汉语。她汉语已经说得很好了！

    昨天晚上我在皮埃尔的房间里。房间不大，但很舒适：那里有一张桌子、一张床和一个柜子，没有电视。皮埃尔不看电视，他喜欢读书。我们喝茶，聊他的家。后来皮埃尔给我看他姐姐的照片。他家住在法国，住在一座老房子里。房子旁边有一个大花园。

    在莫斯科，皮埃尔常常想家。我回家回得很晚：已经十一点了。
  why: 第 1 空：[друг]{.ru} 是阳性第一格，形容词用 [хоро́ший]{.ru}（第 9 课）。第 2 空：[из]{.ru} 要求第二格，[-ия]{.ru} 结尾的国名第二格是 [-ии]{.ru}：[из Фра́нции]{.ru}（第 36 课）。第 3 空：“在大学读书”是学生的身份，用 [учи́ться]{.ru}，主语第三人称单数 [у́чится]{.ru}；[у́чит]{.ru} 要带宾语（第 38 课）。第 4 空：[напро́тив]{.ru} + 第二格“在……对面”；[в, на]{.ru} 后面不能用第二格 [университе́та]{.ru}，[из]{.ru} 表示“从……出来”，和 [нахо́дится]{.ru} 不搭配（第 37 课）。第 5 空：[ка́ждый день]{.ru} 说的是经常往返，[пешко́м]{.ru} 说明是步行，用 [хо́дит]{.ru}；[е́здит]{.ru} 是乘车，[идёт]{.ru} 指此刻朝一个方向走（第 25 课）。第 6 空：[семья́]{.ru} 是阴性，用 [больша́я]{.ru}；要说的是家庭“大”，[есть]{.ru} 省去（第 9、31 课）。第 7 空：[два]{.ru} 后用单数第二格 [бра́та]{.ru}；[бра́тья]{.ru} 是复数第一格（第 35 课）。第 8 空：[шесть]{.ru} 后用复数第二格，[челове́к]{.ru} 的复数第二格和单数第一格同形；[челове́ка]{.ru} 用在 2–4 后面（第 35 课）。第 9 空：[ра́ньше]{.ru} 说的是过去，主语 [она́]{.ru}，用 [изуча́ла]{.ru}（第 17 课）。第 10 空：[говори́ть]{.ru} 后面用副词 [по-кита́йски]{.ru}，形容词 [кита́йский]{.ru} 要和 [язы́к]{.ru} 连用（第 15 课）。第 11 空：[в]{.ru} + 第六格表示处所，[ко́мната → в ко́мнате]{.ru}；[Пье́ра]{.ru} 是第二格，表示“谁的”（第 11、33 课）。第 12 空：描写房间用的是现在时 [стоя́т]{.ru}，“没有电视”用 [нет]{.ru} + 第二格；[не́ было]{.ru} 是过去时，[не]{.ru} 不能单独表示“没有”（第 32 课）。第 13 空：[люби́ть]{.ru} + 不定式：[лю́бит чита́ть]{.ru}（第 26 课）。第 14 空：和后面的 [разгова́ривали]{.ru} 并列，说的是昨天的事，用过去时复数 [пи́ли]{.ru}（第 17、21 课）。第 15 空：“他的家”用物主代词 [его́]{.ru}，它永远不变，前置词后也不加 [н-]{.ru}；[о нём]{.ru} 是“关于他”，后面不能再接名词（第 8、31 课）。第 16 空：[сестры́]{.ru} 是第二格，形容词也用阴性第二格 [ста́ршей]{.ru}；[ш]{.ru} 后面不重读的 [о]{.ru} 写成 [е]{.ru}（第 34 课）。第 17 空：[в]{.ru} + 第六格，[дом]{.ru} 是阳性，用 [ста́ром]{.ru}（第 18 课）。第 18 空：[о́коло]{.ru} 要求第二格：[о́коло до́ма]{.ru}（第 37 课）。第 19 空：主语 [Пьер]{.ru}，第一变位第三人称单数 [ду́мает]{.ru}（第 6、13 课）。第 20 空：空后面是 [часо́в]{.ru}，只有 5–12 后面用 [часо́в]{.ru}，四个数里只有 [оди́ннадцать]{.ru} 合适；[два, три, четы́ре]{.ru} 后用 [часа́]{.ru}（第 28 课）。
  items:
  - options: [хоро́шая, хоро́шего, хоро́шее, хоро́ший]
    answer: хоро́ший
  - options: [Фра́нция, Фра́нцию, Фра́нции, Фра́нцией]
    answer: Фра́нции
  - options: [у́чит, у́чится, у́чатся, учи́ть]
    answer: у́чится
