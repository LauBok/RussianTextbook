  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Мой брат**

    Мой ста́рший брат Анто́н у́чится в Каза́ни, в медици́нском институ́те, и живёт в общежи́тии. Учи́ться он лю́бит, а вот гото́вить совсе́м не уме́л: до́ма всегда́ гото́вила ма́ма.

    Ма́ма ча́сто звони́т ему́ и спра́шивает: «Что ты ешь?» Ра́ньше он отвеча́л: «Хлеб и чай». — «Э́то не обе́д!» — говори́ла ма́ма.

    Но в его́ ко́мнате живёт Руста́м, а Руста́м гото́вит о́чень вку́сно: его́ учи́ла ба́бушка. Тепе́рь они́ ча́сто гото́вят вме́сте, и брат всё пи́шет в тетра́дь.

    А вчера́ он позвони́л сам: «Ма́ма, я сего́дня сам сде́лал пиро́г! У нас была́ вся гру́ппа, и все говори́ли: “Како́й вку́сный!”»

    Тепе́рь ма́ма спра́шивает не «Что ты ешь?», а «Что ты сего́дня пригото́вил?».
    :::
  glossary:
  - {ru: отвеча́л, zh: 回答（过去时）}
  - {ru: ему́, zh: 给他（он 的第三格）}
  - {ru: сам, pos: pron., zh: 自己}
  - {ru: позвони́л, zh: 打了电话}
  - {ru: сде́лал, zh: 做成了}
  - {ru: вся, zh: 全部，整个}
  - {ru: пригото́вил, zh: 做好了（饭）}
  passage_zh: |
    **我哥哥**

    我哥哥安东在喀山的医学院读书，住在宿舍。他喜欢学习，可是做饭一点儿也不会：家里总是妈妈做饭。

    妈妈常给他打电话，问：“你吃什么？”以前他回答：“面包和茶。”——“这哪是午饭！”妈妈说。

    可是他房间里住着鲁斯塔姆，鲁斯塔姆做饭特别好吃，是他奶奶教的。现在他们常一起做饭，哥哥把什么都记在本子上。

    昨天他自己打电话来：“妈妈，今天我自己做了个馅饼！全班都来了，大家都说：‘真好吃！’”

    现在妈妈问的不是“你吃什么”，而是“你今天做了什么”。
  why: 第 1 题，安东在 [медици́нский институ́т]{.ru}（医学院）读书，所以将来是医生。第 2 题，冒号后面说明原因：[до́ма всегда́ гото́вила ма́ма]{.ru}；文中说他喜欢学习，没说宿舍没有厨房。第 3 题，鲁斯塔姆会做饭，现在两人常一起做，哥哥 [всё пи́шет в тетра́дь]{.ru}：是鲁斯塔姆在教他；鲁斯塔姆的奶奶教的是鲁斯塔姆。第 4 题，[я сего́дня сам сде́лал пиро́г]{.ru}：这一次是安东自己做的。第 5 题，概括全文：妈妈不再问“你吃什么”，而问“你今天做了什么”，因为安东现在会做饭了。
