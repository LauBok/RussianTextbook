  - {ru: ему́ даю́т, zh: 给它}
  passage_zh: |
    **巴尔西克在哪儿？**

    我们的女邻居有一只老猫，叫巴尔西克。昨天晚上它不在家。邻居找了它两个小时——在我们楼旁边、在公园里、在隔壁街上——哪儿也没有。

    是我弟弟科利亚找到它的。他在体育场对面的学校上学。他回家的时候，巴尔西克正坐在学校厨房旁边。

    原来巴尔西克早就喜欢上我们学校了：那儿总有人给它鱼吃。
  why: 第 1 空：[у]{.ru} + 第二格，阴性形容词、物主代词第二格词尾都是 [-ей]{.ru}：[на́шей сосе́дки]{.ru}（第 31、34 课）。第 2 空：“不在”是无人称句 [не́ было]{.ru}，[быть]{.ru} 用中性，不随 [он]{.ru} 变成 [был]{.ru}；猫用第二格 [его́]{.ru}（第 32 课）。第 3 空：女邻居找的，过去时阴性 [иска́ла]{.ru}（第 17、23 课）。第 4 空：[два]{.ru} 后用单数第二格 [часа́]{.ru}（第 28、35 课）。第 5 空：[о́коло]{.ru} 要求第二格：[на́шего до́ма]{.ru}（第 34、37 课）。第 6 空：说在哪儿上学用 [учи́ться]{.ru}，第三人称单数 [у́чится]{.ru}（第 38 课）。第 7 空：[напро́тив]{.ru} 要求第二格：[стадио́на]{.ru}（第 37 课）。第 8 空：[когда́]{.ru} 从句说的是过去回家的路上，用过去时阳性 [возвраща́лся]{.ru}；[-ся]{.ru} 在辅音后不变（第 38 课）。第 9 空：说的是猫一直以来的喜好，用现在时 [лю́бит]{.ru}，[б]{.ru} 后不加 [л]{.ru}（加 [л]{.ru} 的只有第一人称 [люблю́]{.ru}）（第 26 课）。第 10 空：[люби́ть]{.ru} 后用第四格，阴性名词和形容词都变：[на́шу шко́лу]{.ru}（第 23 课）。
