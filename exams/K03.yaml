  passage: |
    ::: {.prose lang="ru"}
    Серге́й, приве́т!

    Сейча́с шесть часо́в. Я е́ду на стадио́н, на футбо́л. Домо́й я е́ду то́лько по́здно ве́чером. Михаи́л сего́дня в библиоте́ке, он пи́шет статью́.

    Днём здесь был твой брат. Сейча́с он спит в на́шей ко́мнате: вчера́ он рабо́тал но́чью.

    Ка́ша и хлеб на ку́хне. Ко́фе то́же на ку́хне, на столе́.

    Ты иска́л ключи́? Они́ в на́шей ко́мнате, на крова́ти.

    И́горь
    :::
  passage_zh: |
    谢尔盖，你好！

    现在六点。我去体育场看足球。我晚上很晚才回来。米哈伊尔今天在图书馆，他在写文章。

    下午你哥哥来过。他现在在我们房间里睡觉：昨天他上夜班。

    麦片粥和面包在厨房里。咖啡也在厨房里，在桌子上。

    你找过钥匙吗？在我们房间里，在床上。

    伊戈尔
  why: 第 1 题，留言最后署名 [И́горь]{.ru}；开头的 [Серге́й]{.ru} 是收留言的人。第 2 题，[Я е́ду на стадио́н, на футбо́л]{.ru}：写留言的伊戈尔今晚在体育场；在图书馆的是米哈伊尔。第 3 题，[Михаи́л сего́дня в библиоте́ке]{.ru}。第 4 题，[Сейча́с он спит в на́шей ко́мнате]{.ru}，[он]{.ru} 指上一句的 [твой брат]{.ru}，即谢尔盖的哥哥。第 5 题，[Они́ в на́шей ко́мнате … на крова́ти]{.ru}；在厨房里的是粥、面包和咖啡。
  items:
  - stem: Э́то пи́шет ___.
    options: [И́горь, Серге́й, Михаи́л, брат Серге́я]
    answer: И́горь
  - stem: Сего́дня ве́чером И́горь ___.
    options: [в библиоте́ке, до́ма, на рабо́те, на стадио́не]
    answer: на стадио́не
  - stem: Михаи́л сего́дня ___.
    options: [на стадио́не, до́ма, на рабо́те, в библиоте́ке]
    answer: в библиоте́ке
  - stem: Сейча́с в ко́мнате спит ___.
    options: [И́горь, Михаи́л, брат Серге́я, Серге́й]
    answer: брат Серге́я
  - stem: Ключи́ Серге́я сейча́с ___.
    options: [на ку́хне, в ко́мнате, на стадио́не, в библиоте́ке]
    answer: в ко́мнате
