    - Вчера́ ма́ма была́ в теа́тре.
    - Ма́ма вчера́ была́ в теа́тре.
    rubric:
    - 过去时不能省 [быть]{.ru}，主语是女性，用 [была́]{.ru}（第 16 课）
    - “在剧院”用 [в]{.ru} + 第六格 [в теа́тре]{.ru}（第 11、16 课）
  - zh: 你会说汉语吗？——会一点儿。
    accept:
    - Ты говори́шь по-кита́йски? — Да, немно́го.
    - Ты говори́шь по-кита́йски? — Да, я немно́го говорю́ по-кита́йски.
    - Ты уме́ешь говори́ть по-кита́йски? — Да, немно́го.
    - Ты говори́шь по-кита́йски? — Немно́го.
    rubric:
    - “说汉语”用副词 [по-кита́йски]{.ru}，不用 [кита́йский язы́к]{.ru}（第 15 课）
    - “一点儿”用 [немно́го]{.ru}（第 13 课）
  - zh: 我们每天步行去大学。
    accept:
