    ::: {.prose lang="ru"}
    **Моржи́**

    Морж — э́то большо́е живо́тное. Оно́ живёт в холо́дном мо́ре. Но в Росси́и морж — э́то и челове́к. Моржи́ пла́вают в реке́ и́ли в о́зере да́же в моро́з. Вода́ там о́чень холо́дная.

    Моржи́ есть и в Москве́. Ка́ждое у́тро они́ хо́дят на о́зеро и́ли на ре́ку. Пла́вают они́ ме́дленно, а пото́м пьют горя́чий чай. Моржи́ — э́то и ста́рые лю́ди, и студе́нты, и шко́льники.

    Ива́н Серге́евич то́же морж. Он пла́вает в о́зере ка́ждую суббо́ту. А Мари́я Никола́евна не пла́вает в холо́дной воде́. Она́ говори́т: «Я врач, а не морж!»
    :::
  passage_zh: |
    **“海象”**

    海象是一种大型动物，生活在寒冷的海里。但在俄罗斯，“海象”也指人。这些“海象”即使在严寒天气里也在河里或湖里游泳。那里的水非常冷。

    莫斯科也有“海象”。他们每天早上去湖边或河边，游得很慢，游完喝热茶。“海象”里有老人，也有大学生和中学生。

    伊万·谢尔盖耶维奇也是“海象”。他每个星期六在湖里游泳。而玛丽亚·尼古拉耶夫娜不在冷水里游泳。她说：“我是医生，可不是‘海象’！”
  why: 第 1 题，第一句 [Морж — э́то большо́е живо́тное]{.ru}。第 2 题，[да́же в моро́з]{.ru}“甚至在严寒里”。第 3 题，[а пото́м пьют горя́чий чай]{.ru}。第 4 题，[Он пла́вает в о́зере ка́ждую суббо́ту]{.ru}；[ка́ждое у́тро]{.ru} 说的是莫斯科的“海象”们，不是伊万·谢尔盖耶维奇。第 5 题，[Мари́я Никола́евна не пла́вает в холо́дной воде́]{.ru}，她说自己不是“海象”。
