lesson: K03
heading: 第三套
range: L01-L29
names: [Ли На, Серге́й, Михаи́л, И́горь, Стас, Петербу́рг]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：回答说的是人（[мой брат и его́ друг]{.ru}），问人用 [кто]{.ru}；[что]{.ru} 问物，[как, куда́]{.ru} 和回答对不上（第 1 课）。第 2 题：“我看不清楚”，要找的是眼镜 [очки́]{.ru}；钥匙、书、笔和“看不清”没有关系（第 8 课）。第 3 题：别人说“早上好”，回答也说 [До́брое у́тро!]{.ru}；[Спаси́бо, Пожа́луйста]{.ru} 用于道谢和回谢，[Пока́]{.ru} 是告别（第 16 课）。第 4 题：爸爸上班的地方“很远”，又是“每天”往返，要乘车，用不定向动词 [е́здит]{.ru}；[хо́дит]{.ru} 是步行，[идёт, е́дет]{.ru} 是定向动词，不表示每天往返（第 25 课）。第 5 题：“我听不懂”，原因是对方说得太快：[бы́стро]{.ru}；说得慢、说得好都不会让人听不懂，[говори́те о́чень по-ру́сски]{.ru} 不能这样搭配（第 7 课）。第 6 题：“在上班”是固定说法 [на рабо́те]{.ru}：[рабо́та]{.ru} 和 [на]{.ru} 连用，表示“在哪儿”用第六格；[на рабо́ту]{.ru} 回答“去哪儿”（第 11、24 课）。第 7 题：[ви́деть]{.ru} 要求第四格；代词指前面的 [сестра́]{.ru}，阴性，第四格是 [её]{.ru}。[она́]{.ru} 是第一格，[ней]{.ru} 是前置词 [о]{.ru} 后面的第六格，[его́]{.ru} 指男性（第 13、22 课）。第 8 题：后半句说想住在日本，所以学的是日语；空后有名词 [язы́к]{.ru}，要用形容词阳性 [япо́нский]{.ru}，副词 [по-япо́нски]{.ru} 不能修饰名词，[япо́нская]{.ru} 是阴性，[кита́йский]{.ru} 和“住在日本”不合（第 15 课）。第 9 题：[люби́ть]{.ru} 后面的名词是直接补语，用第四格；[му́зыка]{.ru} 是阴性，形容词阴性第四格是 [ру́сскую]{.ru}。[ру́сская]{.ru} 是第一格，[ру́сской]{.ru} 是第六格，[ру́сский]{.ru} 是阳性（第 23、26 课）。第 10 题：[хожу́]{.ru} 表示去哪儿，回答“去哪儿”用 [в]{.ru} + 第四格：[в библиоте́ку]{.ru}；[в библиоте́ке]{.ru} 回答“在哪儿”，[библиоте́ка]{.ru} 和 [в]{.ru} 连用，不和 [на]{.ru} 连用（第 11、24、25 课）。第 11 题：[дом]{.ru} 是阳性，[в]{.ru} 表示“在哪儿”用第六格，形容词阳性第六格是 [ста́ром]{.ru}；后面的 [на Ти́хой у́лице]{.ru} 是阴性，照着它写成 [ста́рой]{.ru} 就错了（第 18 课）。第 12 题：[гуля́ть]{.ru} 说的是在哪儿，[в]{.ru} 后用第六格；[парк]{.ru} 是阳性，[э́тот]{.ru} 的阳性第六格是 [э́том]{.ru}。[э́той]{.ru} 是阴性第六格，[э́тот]{.ru} 是第一格，[э́ту]{.ru} 是阴性第四格（第 19 课）。第 13 题：“关于莫斯科的书”用 [о]{.ru} + 第六格；[в Москве́]{.ru} 是“在莫斯科”，[на, из]{.ru} 和 [Москве́]{.ru} 都不能这样连用（第 13 课）。第 14 题：前一句说旧词典又旧又小，所以要找一本新的：[но́вый]{.ru}；[ста́рый, ма́ленький, плохо́й]{.ru} 正是“我”不满意的地方（第 9、23 课）。第 15 题：[ви́деть]{.ru} 后面用第四格，[сестра́]{.ru} 是指人的阴性名词，第四格 [сестру́]{.ru}；问句里的 [кого́]{.ru} 也是第四格（第 22 课）。第 16 题：“那里有一部新电影”，要去的是电影院 [в кино́]{.ru}；图书馆、游泳馆不放电影，剧院演的是戏剧和歌剧（第 23、24 课）。第 17 题：[ка́ждую суббо́ту]{.ru} 表示经常往返，奶奶住在别墅，要乘车：[е́здим]{.ru}；[е́дем, идём]{.ru} 是定向动词，[хо́дим]{.ru} 是步行（第 25 课）。第 18 题：“已经九点了”，说话人此刻正急着赶去上课，用定向动词第一人称 [иду́]{.ru}；[хожу́, е́зжу]{.ru} 表示经常往返，[хо́дит]{.ru} 是第三人称（第 24、25 课）。第 19 题：代词指 [статья́]{.ru}，阴性；[о]{.ru} 后用第六格，[она́]{.ru} 的第六格是 [ней]{.ru}。[нём]{.ru} 指阳性，[неё]{.ru} 是第四格，[она́]{.ru} 是第一格（第 13 课）。第 20 题：想游，也会游，只是游泳馆关门，是客观条件不允许：[не могу́]{.ru}。[уме́ть]{.ru} 说的是学没学会，和“游泳馆不开门”无关；“不喜欢”和前半句“很想游”矛盾；[знать]{.ru} 不接不定式（第 27 课）。第 21 题：[два, три, четы́ре]{.ru} 后面用 [часа́]{.ru}（第 28 课）。第 22 题：两点钟大家都在睡觉，是夜里两点：[ночь]{.ru}（第 29 课）。第 23 题：今天星期一，昨天是星期天；[бы́ло]{.ru} 是中性，和中性名词 [воскресе́нье]{.ru} 一致，[суббо́та, среда́]{.ru} 是阴性，要用 [была́]{.ru}（第 16、29 课）。第 24 题：“在星期几”用 [в]{.ru} + 第四格；[вто́рник]{.ru} 是阳性非动物名词，第四格同第一格，前置词写成 [во]{.ru}：[во вто́рник]{.ru}。不能用第六格，也不能不加前置词，[на]{.ru} 不和星期连用（第 29 课）。第 25 题：别人道谢，回答 [Пожа́луйста]{.ru}“不客气”；[Здра́вствуйте, Приве́т]{.ru} 是见面问候，[Пока́]{.ru} 是告别（第 3 课）。
  items:
  - stem: — ___ там? — Там мой брат и его́ друг.
    options: [Кто, Что, Как, Куда́]
    answer: Кто
  - stem: Я пло́хо ви́жу. Где мои́ ___?
    options: [ключи́, кни́ги, ру́чки, очки́]
    answer: очки́
  - stem: — До́брое у́тро! — ___
    options: [Спаси́бо!, Пожа́луйста!, До́брое у́тро!, Пока́!]
    answer: До́брое у́тро!
  - stem: Па́па рабо́тает далеко́, и ка́ждый день он ___ на рабо́ту.
    options: [идёт, е́здит, е́дет, хо́дит]
    answer: е́здит
  - stem: Я не понима́ю. Вы говори́те о́чень ___.
    options: [ме́дленно, хорошо́, по-ру́сски, бы́стро]
    answer: бы́стро
  - stem: Мой брат сейча́с не до́ма, он ___.
    options: [в рабо́те, на рабо́ту, на рабо́те, в рабо́ту]
    answer: на рабо́те
  - stem: — Где твоя́ сестра́? Я давно́ не ви́жу ___.
    options: [её, она́, ней, его́]
    answer: её
  - stem: 'Я изуча́ю ___ язы́к: я хочу́ жить в Япо́нии.'
    options: [по-япо́нски, япо́нский, япо́нская, кита́йский]
    answer: япо́нский
  - stem: Ты лю́бишь ___ му́зыку?
    options: [ру́сская, ру́сской, ру́сский, ру́сскую]
    answer: ру́сскую
  - stem: Я ча́сто хожу́ ___ и чита́ю там газе́ты.
    options: [в библиоте́ке, на библиоте́ку, в библиоте́ку, на библиоте́ке]
    answer: в библиоте́ку
  - stem: Ба́бушка живёт в ___ до́ме на Ти́хой у́лице.
    options: [ста́рый, ста́рая, ста́ром, ста́рой]
    answer: ста́ром
  - stem: 'Я ча́сто гуля́ю в ___ па́рке: он ти́хий и краси́вый.'
    options: [э́той, э́том, э́тот, э́ту]
    answer: э́том
  - stem: Э́то интере́сная кни́га ___ Москве́.
    options: [в, на, о, из]
    answer: о
  - stem: Мой слова́рь ста́рый и ма́ленький. Я ищу́ ___ слова́рь.
    options: [ста́рый, но́вый, ма́ленький, плохо́й]
    answer: но́вый
  - stem: — Кого́ ты там ви́дишь? — ___.
    options: [Сестру́, Сестра́, Сестре́, Сестры́]
    answer: Сестру́
  - stem: 'Ве́чером я иду́ ___: там но́вый фильм.'
    options: [в библиоте́ку, в бассе́йн, в теа́тр, в кино́]
    answer: в кино́
  - stem: Мы живём в Москве́, а ба́бушка — на да́че. Ка́ждую суббо́ту мы ___ туда́.
    options: [е́дем, е́здим, хо́дим, идём]
    answer: е́здим
  - stem: — Ты куда́ так бы́стро? — Я ___ на уро́к, уже́ де́вять часо́в!
    options: [хожу́, е́зжу, хо́дит, иду́]
    answer: иду́
  - stem: — Ты чита́л но́вую статью́? — Да, мы говори́ли о ___ на уро́ке.
    options: [нём, ней, неё, она́]
    answer: ней
  - stem: 'Я о́чень хочу́ пла́вать, но сего́дня не ___: бассе́йн не рабо́тает.'
    options: [уме́ю, люблю́, могу́, зна́ю]
    answer: могу́
  - stem: — Кото́рый час? — Уже́ три ___.
    options: [час, часо́в, часы́, часа́]
    answer: часа́
  - stem: Сейча́с два часа́, все спят. Сейча́с ___.
    options: [у́тро, день, ночь, ве́чер]
    answer: ночь
  - stem: Сего́дня понеде́льник, а вчера́ бы́ло ___.
    options: [воскресе́нье, суббо́та, вто́рник, среда́]
    answer: воскресе́нье
  - stem: Я хожу́ в бассе́йн ___ и в пя́тницу.
    options: [во вто́рник, во вто́рнике, вто́рник, на вто́рник]
    answer: во вто́рник
  - stem: — Спаси́бо, ка́ша о́чень вку́сная! — ___!
    options: [Здра́вствуйте, Пока́, Пожа́луйста, Приве́т]
    answer: Пожа́луйста
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Ба́бушка и компью́тер**

    Я студе́нтка, живу́ в Москве́ и изуча́ю англи́йский язы́к. А моя́ ба́бушка живёт на да́че, одна́. Да́ча (1) []{.blank}: туда́ я е́ду два часа́. Ря́дом о́зеро. Вода́ там (2) []{.blank}, но ба́бушка пла́вает в о́зере ка́ждое у́тро.

    Ка́ждую суббо́ту я е́зжу туда́, и ба́бушка всегда́ (3) []{.blank} меня́. Днём она́ (4) []{.blank} обе́д: ка́шу и сы́рники. Её сы́рники о́чень (5) []{.blank}, и я всегда́ ем мно́го.

    (6) []{.blank} ба́бушка не уме́ла рабо́тать на компью́тере. Мой брат живёт в Кита́е. Ба́бушка ча́сто (7) []{.blank} туда́ пи́сьма, но брат писа́л (8) []{.blank}: он мно́го рабо́тает.

    Тепе́рь мой ста́рый компью́тер стои́т на да́че, в её ко́мнате. В суббо́ту мы (9) []{.blank} на компью́тере три часа́. Я говори́ла (10) []{.blank}, а ба́бушка писа́ла всё в тетра́дь. Она́ понима́ла не всё и мно́го (11) []{.blank}. А тепе́рь ба́бушка всё (12) []{.blank}. Она́ чита́ет но́вости, смо́трит фи́льмы и пи́шет пи́сьма в Кита́й. А брат тепе́рь пи́шет (13) []{.blank}: на компью́тере э́то бы́стро.

    Вчера́ ве́чером ба́бушка (14) []{.blank} и спра́шивала: «Ты (15) []{.blank} сюда́ в суббо́ту? Я хочу́ смотре́ть но́вый фильм, но он на (16) []{.blank} языке́. Ты понима́ешь э́тот язы́к, а я нет!»

    Коне́чно, я е́ду. Тепе́рь в суббо́ту мы вме́сте (17) []{.blank} фи́льмы. Я (18) []{.blank} фильм и всё расска́зываю по-ру́сски, а ба́бушка (19) []{.blank} и пьёт чай. Она́ говори́т: «Компью́тер — э́то (20) []{.blank}! Тепе́рь я не одна́».
    :::
  passage_zh: |
    **奶奶和电脑**

    我是大学生，住在莫斯科，学英语。我奶奶一个人住在别墅。别墅很远：去那里我坐车要两个小时。旁边有个湖。湖水很冷，可奶奶每天早上都在湖里游泳。

    每个星期六我都去那里，奶奶总是等着我。中午她做午饭：麦片粥和奶渣饼。她做的奶渣饼特别好吃，我总是吃很多。

    以前奶奶不会用电脑。我哥哥住在中国。奶奶常常往那里写信，可哥哥很少回信：他工作很忙。

    现在我的旧电脑放在别墅里，放在她的房间里。星期六我们在电脑上忙了三个小时。我说得很慢，奶奶把什么都记在本子上。她不是全都懂，问了很多问题。现在奶奶什么都会了。她看新闻、看电影，还往中国写信。哥哥现在也常常写信了：在电脑上写信很快。

    昨天晚上奶奶打来电话问：“你星期六来吗？我想看一部新电影，可它是英语的。你懂这种语言，我不懂！”

    我当然去。现在每个星期六我们一起看电影。我看得懂，就用俄语把什么都讲给她听，奶奶一边听一边喝茶。她说：“电脑真好！现在我不是一个人了。”
  why: 第 1 空：冒号后面说“去那里我坐车要两个小时”，别墅一定很远，用 [далеко́]{.ru}；[ря́дом, бли́зко, недалеко́]{.ru} 都和“两个小时”矛盾。第 2 空：后半句用 [но]{.ru} 转折：“可奶奶每天早上都在湖里游泳”，能和“游泳”构成转折的只有水很冷 [холо́дная]{.ru}；说水热、安静、舒适，都谈不上“可是”。第 3 空：“我”每个星期六都去，奶奶总是“等着”我：[ждёт]{.ru}；“买我、研究我、收集我”都说不通。第 4 空：宾语是 [обе́д]{.ru}，后面列出麦片粥和奶渣饼，是“做饭”：[гото́вит]{.ru}；“看、写、听午饭”不搭配。第 5 空：后半句“我总是吃很多”，说明奶渣饼好吃：[вку́сные]{.ru}；“难吃、蓝色的、旧的”都和吃很多对不上。第 6 空：动词是过去时 [не уме́ла]{.ru}，下文又说 [А тепе́рь ба́бушка всё уме́ет]{.ru}，前后对比“以前……现在……”，所以填 [Ра́ньше]{.ru}；[Тепе́рь, Сейча́с, Сего́дня]{.ru} 都和后文“现在什么都会了”矛盾。第 7 空：宾语是 [пи́сьма]{.ru}，又有方向 [туда́]{.ru}“往那里（中国）”，只能是“往那里写信”：[писа́ла]{.ru}；“往那里读信、买信、收集信”不通。第 8 空：[но]{.ru} 表示转折：奶奶常常写，哥哥却“很少”回信，冒号后的原因是他工作忙；后文 [А брат тепе́рь пи́шет …]{.ru} 也是和以前对比，所以填 [ре́дко]{.ru}。[ча́сто, мно́го, бы́стро]{.ru} 和 [но]{.ru}、和“工作忙”都对不上。第 9 空：[на компью́тере]{.ru}“在电脑上”配 [рабо́тали]{.ru}，上文说的正是奶奶以前不会用电脑；“在电脑上睡觉、游泳、散步”不通。第 10 空：奶奶一边听一边把什么都记在本子上，“我”得说得慢：[ме́дленно]{.ru}；[бы́стро]{.ru} 记不下来，最后一段奶奶说她不懂英语，用英语或法语讲她也听不懂。第 11 空：前半句“她不是全都懂”，所以“问了很多”：[спра́шивала]{.ru}；“睡了很多、玩了很多、散步很多”和学电脑无关。第 12 空：开头说以前 [не уме́ла]{.ru}，这里用 [тепе́рь]{.ru} 对比，现在“什么都会了”：[уме́ет]{.ru}；下一句列出她现在会做的事。第 13 空：前面说哥哥以前很少写信，这里 [тепе́рь]{.ru} 表示变化，冒号后又说“在电脑上写很快”，所以现在“常常”写：[ча́сто]{.ru}；[ре́дко, ма́ло, пло́хо]{.ru} 都说不上变化。第 14 空：奶奶在远处的别墅，“我”在莫斯科，她却“问”“我”星期六来不来，只能是打电话：[звони́ла]{.ru}。第 15 空：别墅很远，要坐两个小时车（第一段），而且问的是这个星期六来不来，用乘车的定向动词 [е́дешь]{.ru}；[идёшь]{.ru} 是步行，[хо́дишь]{.ru} 表示经常往返，[пла́ваешь]{.ru} 不通。“我”回答 [Коне́чно, я е́ду]{.ru} 也印证了这一点。第 16 空：奶奶说“你懂这种语言，我不懂”，要“我”帮忙；文章第一句说“我”学的是英语，所以是英语电影：[англи́йском]{.ru}。奶奶自己懂俄语，[ру́сском]{.ru} 不对；文中没说“我”懂汉语或法语。第 17 空：宾语是 [фи́льмы]{.ru}，接着上文奶奶想看电影，用 [смо́трим]{.ru}；“收集、做、写电影”不通。第 18 空：“我”学英语，“看得懂”电影，再用俄语讲给奶奶听：[понима́ю]{.ru}；“找、买、拍电影”和后面“讲给她听”连不上。第 19 空：“我”在讲，奶奶就在“听”：[слу́шает]{.ru}；“睡觉并且喝茶”自相矛盾，“游泳、散步”也不会和喝茶同时进行。第 20 空：后一句“现在我不是一个人了”（呼应第一段 [живёт … одна́]{.ru}），说明奶奶觉得电脑好：[хорошо́]{.ru}；[пло́хо, ма́ло, ме́дленно]{.ru} 都和这句话的意思相反或不搭。
  items:
  - options: [далеко́, ря́дом, бли́зко, недалеко́]
    answer: далеко́
  - options: [горя́чая, ти́хая, ую́тная, холо́дная]
    answer: холо́дная
  - options: [покупа́ет, ждёт, изуча́ет, собира́ет]
    answer: ждёт
  - options: [смо́трит, пи́шет, гото́вит, слу́шает]
    answer: гото́вит
  - options: [плохи́е, вку́сные, си́ние, ста́рые]
    answer: вку́сные
  - options: [Ра́ньше, Тепе́рь, Сейча́с, Сего́дня]
    answer: Ра́ньше
  - options: [чита́ла, покупа́ла, собира́ла, писа́ла]
    answer: писа́ла
  - options: [ча́сто, мно́го, бы́стро, ре́дко]
    answer: ре́дко
  - options: [рабо́тали, спа́ли, пла́вали, гуля́ли]
    answer: рабо́тали
  - options: [по-англи́йски, бы́стро, ме́дленно, по-францу́зски]
    answer: ме́дленно
  - options: [спала́, спра́шивала, игра́ла, гуля́ла]
    answer: спра́шивала
  - options: [и́щет, уме́ет, покупа́ет, собира́ет]
    answer: уме́ет
  - options: [ча́сто, ре́дко, ма́ло, пло́хо]
    answer: ча́сто
  - options: [гуля́ла, пла́вала, звони́ла, спала́]
    answer: звони́ла
  - options: [идёшь, хо́дишь, пла́ваешь, е́дешь]
    answer: е́дешь
  - options: [кита́йском, англи́йском, ру́сском, францу́зском]
    answer: англи́йском
  - options: [собира́ем, гото́вим, пи́шем, смо́трим]
    answer: смо́трим
  - options: [ищу́, покупа́ю, понима́ю, снима́ю]
    answer: понима́ю
  - options: [слу́шает, спит, пла́вает, гуля́ет]
    answer: слу́шает
  - options: [пло́хо, ма́ло, хорошо́, ме́дленно]
    answer: хорошо́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ли На и сы́рники**

    Ли На — студе́нтка. Она́ живёт в Москве́, в общежи́тии, и изуча́ет ру́сский язы́к. Ли На хорошо́ пла́вает и игра́ет в ша́хматы. Но ра́ньше она́ не уме́ла гото́вить: в общежи́тии она́ то́лько пила́ чай.

    Её подру́га — ру́сская студе́нтка. Она́ гото́вит о́чень вку́сно. Тепе́рь ка́ждую сре́ду ве́чером они́ вме́сте гото́вят на ку́хне. Подру́га гото́вит ка́шу и сы́рники, а Ли На смо́трит и всё пи́шет в тетра́дь.

    Вчера́ Ли На гото́вила сы́рники одна́. Подру́га говори́ла: «О́чень вку́сно!» А тепе́рь подру́га то́же хо́чет изуча́ть: она́ хо́чет изуча́ть кита́йский язы́к.
    :::
  passage_zh: |
    **李娜和奶渣饼**

    李娜是大学生。她住在莫斯科的宿舍里，学俄语。李娜游泳游得好，国际象棋也下得好。可是她以前不会做饭：在宿舍里她只喝茶。

    她的朋友是个俄罗斯女大学生，做饭做得非常好吃。现在每个星期三晚上她们一起在厨房做饭。朋友做麦片粥和奶渣饼，李娜在旁边看，把什么都记在本子上。

    昨天李娜一个人做了奶渣饼。朋友说：“真好吃！”现在朋友也想学点东西了：她想学汉语。
  why: 第 1 题，[Она́ гото́вит о́чень вку́сно]{.ru}，换个说法就是“她做饭做得好”；她是俄罗斯人，学俄语的是李娜，不会做饭的也是以前的李娜，汉语她现在才想学，文中没说她住在中国。第 2 题，[Но ра́ньше она́ не уме́ла гото́вить]{.ru}；游泳和下国际象棋她都会，茶她一直在喝。第 3 题，[ка́ждую сре́ду ве́чером они́ вме́сте гото́вят]{.ru}：每个星期三晚上。第 4 题，[Вчера́ Ли На гото́вила сы́рники одна́]{.ru}；[одна́]{.ru}“一个人”，说明朋友没有动手，她只是尝了说好吃。第 5 题，最后一句 [она́ хо́чет изуча́ть кита́йский язы́к]{.ru}；会做奶渣饼的是朋友本人，游泳和下棋是李娜会的。
  items:
  - stem: Что мы зна́ем о подру́ге Ли На?
    options: [Она́ живёт в Кита́е., Она́ хорошо́ гото́вит., Она́ не уме́ет гото́вить., Она́ изуча́ет ру́сский язы́к.]
    answer: Она́ хорошо́ гото́вит.
  - stem: Ра́ньше Ли На не уме́ла ___.
    options: [гото́вить, пла́вать, игра́ть в ша́хматы, пить чай]
    answer: гото́вить
  - stem: Ли На и подру́га гото́вят вме́сте ___.
    options: [в суббо́ту у́тром, в воскресе́нье ве́чером, в пя́тницу ве́чером, в сре́ду ве́чером]
    answer: в сре́ду ве́чером
  - stem: Вчера́ сы́рники гото́вила ___.
    options: [подру́га, Ли На, ба́бушка, ма́ма]
    answer: Ли На
  - stem: Тепе́рь подру́га хо́чет ___.
    options: [гото́вить сы́рники, пла́вать, изуча́ть кита́йский язы́к, игра́ть в ша́хматы]
    answer: изуча́ть кита́йский язы́к
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的留言，根据内容选出正确答案。
