    ::: {.prose lang="ru"}
    **Пьер**

    Пьер — мой друг. Он (1) []{.blank} (жить) в общежи́тии, в (2) []{.blank} (ма́ленький) ко́мнате. Пьер хорошо́ (3) []{.blank} (говори́ть) по-ру́сски, но ру́сский язы́к он изуча́ет неда́вно.

    Вчера́ мы (4) []{.blank} (быть) в (5) []{.blank} (Большо́й) теа́тре. Мы (6) []{.blank} (смотре́ть) бале́т «Лебеди́ное о́зеро». Пьер о́чень лю́бит (7) []{.blank} (ру́сская му́зыка).

    Сего́дня он (8) []{.blank} (идти́) в консервато́рию: он (9) []{.blank} (хоте́ть) слу́шать о́перу. А я иду́ в библиоте́ку: сейча́с я (10) []{.blank} (писа́ть) статью́.
