exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：问人用 [кто]{.ru}，问物用 [что]{.ru}；回答是 [мой брат]{.ru}，是人（第 1 课）。第 2 题：[ко́мната]{.ru} 是阴性，物主代词用 [твоя́]{.ru}；回答里的 [она́]{.ru} 也说明是阴性（第 3、8 课）。第 3 题：[ключи́]{.ru} 是复数，代替它用 [они́]{.ru}（第 2、5 课）。第 4 题：主语 [мы]{.ru}，第二变位动词 [смотре́ть]{.ru} 的现在时是 [смо́трим]{.ru}；[смо́трят]{.ru} 配 [они́]{.ru}（第 7 课）。第 5 题：[очки́]{.ru} 只有复数，物主代词也用复数 [на́ши]{.ru}（第 8 课）。第 6 题：“在别墅”用 [на]{.ru} + 第六格 [на да́че]{.ru}；[на да́чу]{.ru} 是第四格，回答“去哪儿”（第 14、24 课）。第 7 题：[писа́ть]{.ru} 变位时 [с]{.ru} 变成 [ш]{.ru}，[Ми́ша]{.ru} 是第三人称单数，用 [пи́шет]{.ru}（第 14 课）。第 8 题：[язы́к]{.ru} 是名词，前面用形容词阳性 [ру́сский]{.ru}；[по-ру́сски]{.ru} 是副词，只能和 [говори́ть, понима́ть, чита́ть]{.ru} 这类动词连用（第 15 课）。第 9 题：[А́нна]{.ru} 是女性，[быть]{.ru} 的过去时用阴性 [была́]{.ru}（第 16 课）。第 10 题：两个人做主语，过去时用复数 [смотре́ли]{.ru}（第 17 课）。第 11 题：[в]{.ru} + 第六格，[дом]{.ru} 是阳性，形容词第六格阳性词尾 [-ом]{.ru}：[в ста́ром до́ме]{.ru}（第 18 课）。第 12 题：[ко́мната]{.ru} 是阴性，[в]{.ru} 后用第六格，[э́тот]{.ru} 的阴性第六格是 [э́той]{.ru}（第 19 课）。第 13 题：[о]{.ru} 要求第六格，[Москва́]{.ru} 的第六格是 [Москве́]{.ru}（第 13 课）。第 14 题：[чита́ть]{.ru} 后面的直接补语用第四格，阴性形容词第四格词尾是 [-ую]{.ru}：[интере́сную кни́гу]{.ru}（第 23 课）。第 15 题：[знать]{.ru} 后用第四格；人名 [А́нна]{.ru} 是以 [-а]{.ru} 结尾的阴性名词，第四格是 [А́нну]{.ru}；回答里的 [её]{.ru} 也是第四格（第 22 课）。第 16 题：[куда́]{.ru} 问方向，回答用 [в]{.ru} + 第四格 [в библиоте́ку]{.ru}；[в библиоте́ке]{.ru} 回答“在哪儿”。[библиоте́ка]{.ru} 和 [в]{.ru} 连用，不用 [на]{.ru}（第 11、24 课）。第 17 题：[ка́ждую суббо́ту]{.ru} 说的是经常往返，用不定向动词 [е́здить]{.ru}；主语是 [Ива́н Серге́евич]{.ru}，用第三人称单数 [е́здит]{.ru}（第 25 课）。第 18 题：[сейча́с]{.ru} 说的是此刻正朝一个方向走，用定向动词 [иду́]{.ru}；[хожу́]{.ru} 表示经常去（第 24、25 课）。第 19 题：主语 [я]{.ru}，[люби́ть]{.ru} 第一人称单数加 [л]{.ru}：[люблю́]{.ru}（第 26 课）。第 20 题：回答是 [уме́ю]{.ru}，问句里主语是 [ты]{.ru}，用 [уме́ешь]{.ru}（第 27 课）。第 21 题：[два, три, четы́ре]{.ru} 后面用 [часа́]{.ru}，[оди́н]{.ru} 后用 [час]{.ru}（第 28 课）。第 22 题：[пять]{.ru} 到 [двена́дцать]{.ru} 后面用 [часо́в]{.ru}（第 28 课）。第 23 题：“在星期几”用 [в]{.ru} + 第四格：[в суббо́ту]{.ru}（第 29 课）。第 24 题：主语 [Ми́ша]{.ru}，[хоте́ть]{.ru} 单数第三人称是 [хо́чет]{.ru}；[хоте́ть]{.ru} 单数按第一变位、复数按第二变位，是不规则动词（第 26 课）。第 25 题：别人道谢，回答 [Пожа́луйста]{.ru}“不客气”（第 3 课）。
  items:
  - stem: — ___ э́то? — Э́то мой брат.
    options: [Кто, Что, Чей, Где]
    answer: Кто
  - stem: — Где ___ ко́мната? — Вот она́.
    options: [твой, твоё, твои́, твоя́]
    answer: твоя́
  - stem: — Где мои́ ключи́? — Вот ___.
    options: [он, она́, они́, оно́]
    answer: они́
  - stem: Ве́чером мы ___ телеви́зор.
    options: [смо́трят, смо́трим, смотрю́, смо́тришь]
    answer: смо́трим
  - stem: — Чьи э́то очки́? — Э́то ___ очки́.
    options: [наш, на́ша, на́ше, на́ши]
    answer: на́ши
  - stem: Ба́бушка сейча́с живёт ___.
    options: [в да́че, на да́чу, на да́че, в да́чу]
    answer: на да́че
  - stem: Ми́ша ___ упражне́ние.
    options: [пи́шет, пи́шут, пишу́, пи́шем]
    answer: пи́шет
  - stem: — Вы говори́те по-англи́йски? — Нет, я зна́ю то́лько ___ язы́к.
    options: [по-ру́сски, ру́сский, ру́сская, ру́сское]
    answer: ру́сский
  - stem: Вчера́ А́нна ___ в теа́тре.
    options: [был, была́, бы́ло, бы́ли]
    answer: была́
  - stem: Вчера́ ве́чером Ива́н Серге́евич и Мари́я Никола́евна ___ фильм.
    options: [смотре́л, смотре́ла, смо́трит, смотре́ли]
    answer: смотре́ли
  - stem: Мои́ роди́тели живу́т в ___ до́ме.
    options: [ста́рый, ста́рая, ста́ром, ста́рой]
    answer: ста́ром
  - stem: В ___ ко́мнате живёт Пьер.
    options: [э́той, э́тот, э́та, э́том]
    answer: э́той
  - stem: — О чём вы говори́те? — О ___.
    options: [Москву́, Москва́, Москве́, Москвы́]
    answer: Москве́
  - stem: Ю́ми чита́ет ___ кни́гу.
    options: [интере́сная, интере́сную, интере́сной, интере́сное]
    answer: интере́сную
  - stem: — Ты зна́ешь ___? — Да, я хорошо́ зна́ю её.
    options: [А́нну, А́нна, А́нне, А́нны]
    answer: А́нну
  - stem: — Куда́ ты идёшь? — Я иду́ ___.
    options: [в библиоте́ке, на библиоте́ку, библиоте́ка, в библиоте́ку]
    answer: в библиоте́ку
  - stem: Ива́н Серге́евич ка́ждую суббо́ту ___ на да́чу.
    options: [е́дет, е́здит, е́здят, е́хать]
    answer: е́здит
  - stem: — Ты куда́? — Сейча́с я ___ в университе́т.
    options: [хожу́, идёт, ходи́ть, иду́]
    answer: иду́
  - stem: Я о́чень ___ му́зыку.
    options: [люблю́, лю́бит, лю́бишь, люби́ть]
    answer: люблю́
  - stem: — Ты ___ пла́вать? — Да, уме́ю.
    options: [уме́ет, уме́ть, уме́ешь, уме́ю]
    answer: уме́ешь
  - stem: — Кото́рый час? — Уже́ четы́ре ___.
    options: [час, часо́в, часы́, часа́]
    answer: часа́
  - stem: Сейча́с пять ___.
    options: [час, часа́, часо́в, часы́]
    answer: часо́в
  - stem: ___ мы идём в бассе́йн.
    options: [В суббо́ту, В суббо́те, Суббо́та, На суббо́ту]
    answer: В суббо́ту
  - stem: Ми́ша не спит, он ___ игра́ть в компью́тер.
    options: [хо́чешь, хо́чет, хотя́т, хочу́]
    answer: хо́чет
  - stem: — Спаси́бо! — ___!
    options: [Здра́вствуйте, Пока́, Пожа́луйста, Приве́т]
    answer: Пожа́луйста
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Моя́ неде́ля**

    Я живу́ в Москве́, в (1) []{.blank} ста́рой кварти́ре. Университе́т (2) []{.blank}, и ка́ждый день я (3) []{.blank} туда́ пешко́м. В понеде́льник и в (4) []{.blank} мы слу́шаем ле́кции, а пото́м я чита́ю в (5) []{.blank}.

    В пя́тницу ве́чером я ча́сто (6) []{.blank} в центр. Я о́чень (7) []{.blank} (8) []{.blank} Москву́: её (9) []{.blank} у́лицы, пло́щади и собо́ры.

    А в э́ту суббо́ту мы (10) []{.blank} на да́че. Туда́ мы (11) []{.blank} на по́езде два часа́. Там мы (12) []{.blank} я́блоки, а днём ба́бушка (13) []{.blank} обе́д. Бы́ло о́чень (14) []{.blank}!

    В воскресе́нье я (15) []{.blank} письмо́ в (16) []{.blank}. Я писа́л о Москве́, о (17) []{.blank} университе́те и о (18) []{.blank} ко́мнате. Ма́ма и па́па всегда́ (19) []{.blank} мои́ пи́сьма.

    Сейча́с уже́ оди́ннадцать часо́в, и я (20) []{.blank} спать.
    :::
  passage_zh: |
    **我的一周**

    我住在莫斯科，住在一套大的旧公寓里。学校不远，我每天走着去。星期一和星期三我们听讲座课，然后我在图书馆看书。

    星期五晚上我常常去市中心。我很喜欢老莫斯科：它漂亮的街道、广场和教堂。

    这个星期六我们在别墅。我们坐火车去那里，坐了两个小时。我们在那里摘苹果，下午奶奶做午饭。非常好吃！

    星期天我往中国写信。我写了莫斯科，写了我们的大学，写了我的房间。爸爸妈妈总是等着我的信。

    现在已经十一点了，我想睡觉了。
  why: 第 1 空：[в]{.ru} + 第六格，[кварти́ра]{.ru} 是阴性，形容词阴性第六格是 [большо́й]{.ru}，和后面的 [ста́рой]{.ru} 一样（第 18 课）。第 2 空：后面说“每天走着去”，学校应该不远：[недалеко́]{.ru}（第 29 课）。第 3 空：[ка́ждый день]{.ru} 表示经常往返，[пешко́м]{.ru} 说明是步行，用 [ходи́ть]{.ru} 的第一人称 [хожу́]{.ru}；[е́зжу]{.ru} 是乘车（第 25 课）。第 4 空：和 [в понеде́льник]{.ru} 并列，星期几用 [в]{.ru} + 第四格 [сре́ду]{.ru}（第 29 课）。第 5 空：[в]{.ru} 表示“在……里”，用第六格 [библиоте́ке]{.ru}（第 11 课）。第 6 空：[ча́сто]{.ru} 表示经常去，乘车去市中心用 [е́здить]{.ru}；主语 [я]{.ru}，[д]{.ru} 变成 [ж]{.ru}：[е́зжу]{.ru}（第 25 课）。第 7 空：主语 [я]{.ru}，[люблю́]{.ru} 多一个 [л]{.ru}（第 26 课）。第 8 空：[люби́ть]{.ru} 后面用第四格，[Москву́]{.ru} 是阴性第四格，形容词也用阴性第四格 [ста́рую]{.ru}（第 23、26 课）。第 9 空：[у́лицы]{.ru} 是复数，形容词用复数 [краси́вые]{.ru}（第 9 课）。第 10 空：主语 [мы]{.ru}，[быть]{.ru} 过去时用复数 [бы́ли]{.ru}（第 16 课）。第 11 空：主语 [мы]{.ru}，过去时复数 [е́хали]{.ru}；[два часа́]{.ru} 说的是路上花的时间，用定向动词 [е́хать]{.ru}（第 17、24 课）。第 12 空：主语 [мы]{.ru}，过去时复数 [собира́ли]{.ru}（第 17、29 课）。第 13 空：[ба́бушка]{.ru} 是女性，过去时阴性 [гото́вила]{.ru}（第 17 课）。第 14 空：说饭菜，用 [вку́сно]{.ru}“好吃”（第 21 课）。第 15 空：后面一句是 [Я писа́л]{.ru}，说话人是男性，过去时阳性 [писа́л]{.ru}（第 14、17 课）。第 16 空：[в]{.ru} + 第四格表示方向，信寄往中国：[в Кита́й]{.ru}，阳性非动物名词第四格同第一格（第 21、24 课）。第 17 空：[о]{.ru} + 第六格，[университе́т]{.ru} 是阳性，物主代词第六格 [на́шем]{.ru}（第 13、19 课）。第 18 空：[ко́мната]{.ru} 是阴性，[о]{.ru} 后用第六格 [мое́й]{.ru}（第 13、19 课）。第 19 空：主语是两个人，[ждать]{.ru} 第三人称复数 [ждут]{.ru}（第 22 课）。第 20 空：主语 [я]{.ru}，[хоте́ть]{.ru} 第一人称 [хочу́]{.ru}（第 26 课）。
  items:
  - options: [большо́й, больша́я, большу́ю, большо́м]
    answer: большо́й
  - options: [далеко́, ра́но, пло́хо, недалеко́]
    answer: недалеко́
  - options: [иду́, хожу́, е́зжу, хо́дит]
    answer: хожу́
  - options: [среда́, сре́де, сре́ду, сре́ды]
    answer: сре́ду
  - options: [библиоте́ку, библиоте́ке, библиоте́ка, библиоте́ки]
    answer: библиоте́ке
  - options: [е́зжу, е́здит, е́здят, е́здить]
    answer: е́зжу
  - options: [лю́бит, люби́ть, лю́бишь, люблю́]
    answer: люблю́
  - options: [ста́рая, ста́рой, ста́рый, ста́рую]
    answer: ста́рую
  - options: [краси́вые, краси́вый, краси́вая, краси́вое]
    answer: краси́вые
  - options: [был, была́, бы́ли, бы́ло]
    answer: бы́ли
  - options: [е́хал, е́хали, е́хала, е́хать]
    answer: е́хали
  - options: [собира́ет, собира́ли, собира́ть, собира́ю]
    answer: собира́ли
  - options: [гото́вила, гото́вил, гото́вили, гото́вит]
    answer: гото́вила
  - options: [ме́дленно, бли́зко, вку́сно, ра́но]
    answer: вку́сно
  - options: [пишу́, писа́ла, пи́шет, писа́л]
    answer: писа́л
  - options: [Кита́е, Кита́й, Кита́я, Кита́ю]
    answer: Кита́й
  - options: [наш, на́шей, на́ше, на́шем]
    answer: на́шем
  - options: [моя́, мою́, мое́й, моём]
    answer: мое́й
  - options: [ждут, ждёт, ждём, ждать]
    answer: ждут
  - options: [хо́чет, хоти́м, хочу́, хоте́ть]
    answer: хочу́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ми́ша и ша́хматы**

    Ми́ша — шко́льник. Он живёт в Москве́, в большо́й ста́рой кварти́ре. Ми́ша о́чень лю́бит футбо́л и хокке́й. Ра́ньше он не уме́л игра́ть в ша́хматы.

    Его́ па́па, Ива́н Серге́евич, хорошо́ игра́ет в ша́хматы. Тепе́рь ка́ждое воскресе́нье у́тром они́ игра́ют до́ма, на ку́хне. Ра́ньше Ми́ша всегда́ игра́л о́чень бы́стро и пло́хо. Па́па говори́л: «Ша́хматы — э́то не футбо́л!»

    Тепе́рь Ми́ша игра́ет ме́дленно и мно́го ду́мает. Вчера́ они́ игра́ли три часа́. А пото́м па́па расска́зывал ма́ме: «Ми́ша игра́ет уже́ о́чень хорошо́!»

    Тепе́рь Ми́ша лю́бит и футбо́л, и ша́хматы.
    :::
  passage_zh: |
    **米沙和国际象棋**

    米沙是个中学生。他住在莫斯科一套很大的旧公寓里。米沙非常喜欢足球和冰球。以前他不会下国际象棋。

    他的爸爸伊万·谢尔盖耶维奇国际象棋下得很好。现在每个星期天上午他们都在家里、在厨房里下棋。以前米沙总是下得很快，而且下得不好。爸爸说：“国际象棋可不是足球！”

    现在米沙下得慢了，想得多了。昨天他们下了三个小时。后来爸爸对妈妈说：“米沙已经下得很好了！”

    现在米沙既喜欢足球，又喜欢国际象棋。
  why: 第 1 题，第一句 [Ми́ша — шко́льник]{.ru}。第 2 题，[Ра́ньше он не уме́л игра́ть в ша́хматы]{.ru}；足球和冰球他一直喜欢。第 3 题，[ка́ждое воскресе́нье у́тром]{.ru}：每个星期天上午。第 4 题，[Ра́ньше Ми́ша всегда́ игра́л о́чень бы́стро и пло́хо]{.ru}；[ме́дленно]{.ru} 是现在的下法。第 5 题，最后一句用了 [и …, и …]{.ru}“既……又……”（第 15 课），两样都喜欢。
  items:
  - stem: Ми́ша — ___.
    options: [студе́нт, шко́льник, инжене́р, врач]
    answer: шко́льник
  - stem: Ра́ньше Ми́ша не уме́л ___.
    options: [игра́ть в ша́хматы, игра́ть в футбо́л, игра́ть в хокке́й, пла́вать]
    answer: игра́ть в ша́хматы
  - stem: Ми́ша и па́па игра́ют в ша́хматы ___.
    options: [в суббо́ту у́тром, в воскресе́нье ве́чером, в пя́тницу ве́чером, в воскресе́нье у́тром]
    answer: в воскресе́нье у́тром
  - stem: Ра́ньше Ми́ша игра́л ___.
