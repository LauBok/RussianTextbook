  passage_zh: |
    **皮埃尔**

    皮埃尔是我的朋友。他住在宿舍，住在一个小房间里。皮埃尔俄语说得很好，可是他学俄语时间不长。

    昨天我们在大剧院。我们看了芭蕾舞《天鹅湖》。皮埃尔非常喜欢俄罗斯音乐。

    今天他去音乐学院：他想听歌剧。而我去图书馆：我现在在写一篇文章。
