    - Ка́ждый день мы хо́дим в университе́т пешко́м.
    - Мы ка́ждый день хо́дим пешко́м в университе́т.
    - Мы ка́ждый день хо́дим в университе́т.
    rubric:
    - 每天往返，用不定向动词 [ходи́ть]{.ru}，第一人称复数 [хо́дим]{.ru}；不用 [идём]{.ru}（第 25 课）
    - 方向用 [в]{.ru} + 第四格 [в университе́т]{.ru}（第 24 课）
  - zh: 你看见我妹妹了吗？——看见了，她在图书馆。
