    - Ты ви́дела мою́ сестру́? — Да, она́ в библиоте́ке.
    - Ты ви́дел мою́ сестру́? — Да, ви́дел, она́ в библиоте́ке.
    - Ты ви́дела мою́ сестру́? — Да, ви́дела, она́ в библиоте́ке.
    - Вы ви́дели мою́ сестру́? — Да, она́ в библиоте́ке.
