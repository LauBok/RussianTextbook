- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Моржи́**

    Морж — э́то большо́е живо́тное. Оно́ живёт в холо́дном мо́ре. Но в Росси́и морж — э́то и челове́к. Моржи́ пла́вают в реке́ и́ли в о́зере да́же в моро́з. Вода́ там о́чень холо́дная.

    Моржи́ есть и в Москве́. Ка́ждое у́тро они́ хо́дят на о́зеро и́ли на ре́ку. Пла́вают они́ ме́дленно, а пото́м пьют горя́чий чай. Моржи́ — э́то и ста́рые лю́ди, и студе́нты, и шко́льники.

    Наш сосе́д то́же морж. Он пла́вает в о́зере ка́ждую суббо́ту. А его́ сестра́ не пла́вает в холо́дной воде́. Она́ говори́т: «Я врач, а не морж!»
    :::
  passage_zh: |
    **“海象”**

    海象是一种大型动物，生活在寒冷的海里。但在俄罗斯，“海象”也指人。这些“海象”即使在严寒天气里也在河里或湖里游泳。那里的水非常冷。

    莫斯科也有“海象”。他们每天早上去湖边或河边，游得很慢，游完喝热茶。“海象”里有老人，也有大学生和中学生。

    我们的邻居也是“海象”。他每个星期六在湖里游泳。而他姐姐不在冷水里游泳。她说：“我是医生，可不是‘海象’！”
  why: 第 1 题，第一句 [Морж — э́то большо́е живо́тное]{.ru}。第 2 题，[да́же в моро́з]{.ru}“甚至在严寒里”。第 3 题，[а пото́м пьют горя́чий чай]{.ru}。第 4 题，[Он пла́вает в о́зере ка́ждую суббо́ту]{.ru}；[ка́ждое у́тро]{.ru} 说的是莫斯科的“海象”们，不是这位邻居。第 5 题，[А его́ сестра́ не пла́вает в холо́дной воде́]{.ru}，她说自己是医生，不是“海象”。
  items:
  - stem: Морж — э́то большо́е ___.
    options: [мо́ре, о́зеро, го́род, живо́тное]
    answer: живо́тное
  - stem: Моржи́ пла́вают в реке́ и́ли в о́зере ___.
    options: [то́лько в суббо́ту, то́лько днём, да́же в моро́з, то́лько ве́чером]
    answer: да́же в моро́з
  - stem: Пото́м моржи́ пьют ___.
    options: [горя́чий чай, холо́дную во́ду, ко́фе, холо́дный чай]
    answer: горя́чий чай
  - stem: Наш сосе́д пла́вает в о́зере ___.
    options: [ка́ждое у́тро, ка́ждую суббо́ту, ка́ждое воскресе́нье, ре́дко]
    answer: ка́ждую суббо́ту
  - stem: Его́ сестра́ в холо́дной воде́ ___.
    options: [пла́вает ка́ждое у́тро, не пла́вает, пла́вает ка́ждую суббо́ту, пла́вает ме́дленно]
    answer: не пла́вает
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Мой брат Стас**

    Мой брат Стас — студе́нт. Он (1) []{.blank} (жить) в Петербу́рге, в (2) []{.blank} (ма́ленький) кварти́ре. Стас о́чень хорошо́ (3) []{.blank} (говори́ть) по-англи́йски: он изуча́ет англи́йский язы́к уже́ давно́.

    В суббо́ту мы (4) []{.blank} (быть) в (5) []{.blank} (ти́хий) па́рке. Там мы (6) []{.blank} (гуля́ть) три часа́. Стас о́чень лю́бит (7) []{.blank} (ста́рый Петербу́рг).

    Сего́дня он (8) []{.blank} (идти́) в библиоте́ку: он (9) []{.blank} (хоте́ть) чита́ть ста́рые газе́ты. А я сейча́с до́ма: я (10) []{.blank} (писа́ть) письмо́ домо́й, в Москву́.
    :::
  passage_zh: |
    **我哥哥斯塔斯**

    我哥哥斯塔斯是大学生。他住在彼得堡，住在一套小公寓里。斯塔斯英语说得很好：他学英语已经很久了。

    星期六我们在一个安静的公园里。我们在那里散了三个小时的步。斯塔斯非常喜欢老彼得堡。

    今天他去图书馆：他想看旧报纸。而我现在在家：我在给莫斯科的家里写信。
  why: 第 1 空：[жить]{.ru} 变位加 [в]{.ru}：[живу́, живёшь … живёт]{.ru}，主语 [он]{.ru} 是第三人称单数（第 14 课）。第 2 空：[кварти́ра]{.ru} 是阴性，[в]{.ru} 后用第六格；[ма́ленький]{.ru} 的词干以 [к]{.ru} 结尾，阴性第六格是 [ма́ленькой]{.ru}（第 18 课）。第 3 空：第二变位，第三人称单数 [говори́т]{.ru}（第 7 课）。第 4 空：[в суббо́ту]{.ru} 说的是过去的事（下一句 [гуля́ли]{.ru} 也是过去时），主语 [мы]{.ru}，过去时复数 [бы́ли]{.ru}（第 16 课）。第 5 空：[парк]{.ru} 是阳性，[в]{.ru} 后用第六格；[ти́хий]{.ru} 的词干以 [х]{.ru} 结尾，阳性第六格词尾是 [-ом]{.ru}：[ти́хом]{.ru}（第 18 课）。第 6 空：主语 [мы]{.ru}，说的是星期六的事，过去时复数 [гуля́ли]{.ru}（第 17 课）。第 7 空：[люби́ть]{.ru} 后用第四格；[Петербу́рг]{.ru} 是阳性非动物名词，第四格同第一格，形容词也不变：[ста́рый Петербу́рг]{.ru}；容易错写成阴性的 [-ую]{.ru}（第 23、26 课）。第 8 空：[сего́дня]{.ru} 说的是此刻去一个地方，用定向动词 [идти́]{.ru} 的第三人称单数 [идёт]{.ru}（第 24 课）。第 9 空：[хоте́ть]{.ru} 单数按第一变位，[т]{.ru} 变 [ч]{.ru}：[хо́чет]{.ru}（第 26 课）。第 10 空：[сейча́с]{.ru} 用现在时，[писа́ть]{.ru} 的 [с]{.ru} 变成 [ш]{.ru}，第一人称 [пишу́]{.ru}，重音在词尾（第 14 课）。
  items:
  - accept: [живёт]
  - accept: [ма́ленькой]
  - accept: [говори́т]
  - accept: [бы́ли]
  - accept: [ти́хом]
  - accept: [гуля́ли]
  - accept: [ста́рый Петербу́рг]
  - accept: [идёт]
  - accept: [хо́чет]
  - accept: [пишу́]
- id: e8
  type: translate
  task: 汉译俄：把下列句子译成俄语。
  points: 5
  why: 每句 5 分：句子结构和关键语法点正确得 5 分；评分要点里的关键语法点错一处扣 2 分，其他小错（个别词尾、重音位置不计）每处扣 1 分，扣完为止。
  items:
  - zh: 昨天妈妈在剧院。
