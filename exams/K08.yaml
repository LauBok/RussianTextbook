  passage: '::: {.prose lang="ru"}

    **Третьяко́вская галере́я**


    Третьяко́вская галере́я — изве́стный музе́й ру́сских карти́н в Москве́. Почему́ у неё тако́е и́мя?


    Ра́ньше в э́том до́ме жил моско́вский купе́ц Па́вел Третьяко́в. Он о́чень люби́л ру́сских худо́жников и мно́го лет покупа́л их карти́ны. Карти́ны висе́ли у него́ до́ма, и лю́ди приходи́ли их смотре́ть. Пото́м Третьяко́в подари́л дом и все карти́ны Москве́. Так дом стал музе́ем, а музе́й получи́л его́ фами́лию.


    Зда́ние галере́и необы́чное: кра́сное и бе́лое, как дом в ру́сской ска́зке. В галере́е мо́жно уви́деть ста́рые ико́ны, портре́ты и пейза́жи. Де́ти осо́бенно лю́бят карти́ну «У́тро в сосно́вом лесу́»: на ней лес и медве́ди.


    Ста́нция метро́ ря́дом то́же называ́ется «Третьяко́вская», как галере́я. В понеде́льник галере́я не рабо́тает.

    :::

    '
  passage_zh: '**特列季亚科夫画廊**


    特列季亚科夫画廊是莫斯科一座有名的俄罗斯绘画博物馆。它为什么叫这个名字？


    从前这座房子里住着莫斯科商人帕维尔·特列季亚科夫。他很爱俄罗斯画家，多年来一直买他们的画。画挂在他家里，人们常来看。后来特列季亚科夫把房子和所有的画都送给了莫斯科。这座房子就成了博物馆，博物馆也就有了他的姓。


    画廊的楼很特别：红白两色，像俄罗斯童话里的房子。在画廊里能看到古老的圣像、肖像画和风景画。孩子们特别喜欢《松林的早晨》：画上有树林和熊。


    旁边的地铁站也叫“特列季亚科夫站”，和画廊同名。星期一画廊闭馆。

    '
  why: '第 1 题，推断题：住在这座房子里、买画又把画送给莫斯科的是商人特列季亚科夫，博物馆 [получи́л его́ фами́лию]{.ru}；他不是画家，他买的是别人的画；地铁站是跟着画廊起的名字，不是反过来。第 2 题，[мно́го лет покупа́л их карти́ны]{.ru}；他没有画画，也没有卖画。第 3 题，[Зда́ние галере́и необы́чное: кра́сное и бе́лое, как дом в ру́сской ска́зке]{.ru}。第 4 题，与原文不符的说法：原文最后说 [В понеде́льник галере́я не рабо́тает]{.ru}；其他三项原文都说了。第 5 题，推断题：原文说地铁站 [то́же называ́ется «Третьяко́вская», как галере́я]{.ru}，画廊的名字来自特列季亚科夫，车站又跟着画廊叫；文中的画家都没有姓特列季亚科夫的；星期一不开门的是画廊，不是地铁站。'
  items:
  - stem: Фами́лия Третьяко́в — э́то фами́лия ___.
    options: [худо́жника, дире́ктора музе́я, 'купца́, кото́рый жил в э́том до́ме', ста́нции метро́]
    answer: купца́, кото́рый жил в э́том до́ме
  - stem: Третьяко́в карти́ны ___.
    options: [покупа́л, рисова́л, продава́л, иска́л в Петербу́рге]
    answer: покупа́л
  - stem: Зда́ние галере́и ___.
    options: [о́чень высо́кое, 'кра́сное и бе́лое, как дом из ска́зки', совсе́м но́вое, бе́лое и си́нее]
    answer: кра́сное и бе́лое, как дом из ска́зки
  - stem: 'Э́то не так: ___.'
    options: [Третьяко́в подари́л карти́ны Москве́, в галере́е есть ико́ны, ря́дом есть ста́нция метро́, в понеде́льник галере́я рабо́тает]
    answer: в понеде́льник галере́я рабо́тает
  - stem: Ста́нция метро́ «Третьяко́вская» ___.
    options: [получи́ла и́мя от худо́жника, получи́ла и́мя от галере́и, нахо́дится в Петербу́рге, не рабо́тает в понеде́льник]
    answer: получи́ла и́мя от галере́и
