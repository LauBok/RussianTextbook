  items:
  - prompt: 你是在莫斯科学习的中国留学生张明（[Чжан Мин]{.ru}）。你的朋友科斯佳（[Ко́стя]{.ru}）星期六从圣彼得堡（[Петербу́рг]{.ru}）坐火车来看你，上午十一点到站，可是你那天有课，不能去车站接他。给他写一条短信，40–60 词。要点：1. 说明你不能去车站接他，为什么；2. 怎么到你的宿舍：坐地铁到“大学站”（[«Университе́т»]{.ru}），再坐 1 路公共汽车；3. 宿舍在哪儿：药店旁边，公园对面；4. 钥匙在邻居安东（[Анто́н]{.ru}）那里，他住 25 号房间；5. 你下午三点到家。
