lesson: K08
heading: 第八套
range: L01-L79
names: [Ве́ра, Серёжа, Ната́ша, Чжан Мин, Серге́й, Па́вел Третьяко́в, Третьяко́в]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：对方问这路车去不去市中心，合适的回答是说明“不去”，并告诉他该坐哪一路：[Нет, вам ну́жен деся́тый]{.ru}；[Спаси́бо, не на́до]{.ru} 是谢绝别人的帮助，[Ничего́, не волну́йтесь]{.ru} 是回应道歉或安慰人，[С удово́льствием!]{.ru} 是接受邀请，都答非所问（第 55、67、75 课）。第 2 题：前面说没有狗，后面说有猫，前后对照，用表示转折的 [но]{.ru}；[и]{.ru} 不表示对照，[и́ли]{.ru} 是“或者”，[когда́]{.ru} 引出时间（第 13、14 课）。第 3 题：[Вот она́!]{.ru} 说明外套已经买到、就在眼前，说的是一次动作的结果，用完成体过去时 [купи́л]{.ru}；[покупа́л]{.ru} 只说做过“买”这件事或买的过程，不说明买到了没有，是只学了一半的人最容易选的；[покупа́ю]{.ru}、[куплю́]{.ru} 和 [Вчера́]{.ru} 的时间不合（第 45、76 课）。第 4 题：“在系里”用 [на]{.ru}：[на факульте́те]{.ru}，和 [на ку́рсе]{.ru}、[на уро́ке]{.ru} 一样；[в]{.ru} 用于 [в университе́те]{.ru}（第 11、12 课）。第 5 题：[сра́зу]{.ru} 说的是一下子吃完了两个，是一次的结果，用完成体过去时 [съел]{.ru}；[ел]{.ru} 说过程，不和 [сра́зу]{.ru} 连用；前面是 [хоте́л]{.ru}，说的是过去，不用 [ест]{.ru}、[съест]{.ru}（第 45 课）。第 6 题：现在两点，课三点开始，是“一小时以后”，用 [че́рез]{.ru}；[наза́д]{.ru} 是“以前”；[в час]{.ru} 是“在一点钟”，和三点开课不符（第 47 课）。第 7 题：回答说的是日期，问日期用 [Како́е сего́дня число́?]{.ru}；[Кото́рый час?]{.ru} 问钟点，[Ско́лько сто́ит?]{.ru} 问价钱，[Ско́лько тебе́ лет?]{.ru} 问年龄（第 28、39、49、53 课）。第 8 题：[Да, о́чень]{.ru} 是肯定的回答，后面要说喜欢的理由，只有 [краси́во]{.ru} 合适；[ску́чно]{.ru}、[пло́хо]{.ru}、[гру́стно]{.ru} 都是不喜欢的理由（第 58、63 课）。第 9 题：[трина́дцать]{.ru} 后面用 [лет]{.ru}；[го́да]{.ru} 用在 2–4 后面，[году́]{.ru} 是第六格 [в году́]{.ru} 的形式（第 53 课）。第 10 题：冬天冷，需要的是保暖的帽子 [ша́пка]{.ru}；[футбо́лка]{.ru} 是夏天穿的，[ру́чка]{.ru}、[кни́га]{.ru} 和冷不冷无关（第 55、69 课）。第 11 题：去不了电影院，原因是“我没空”：[занята́]{.ru}；[свобо́дна]{.ru} 意思相反，[ра́да]{.ru}、[здоро́ва]{.ru} 不能解释为什么不去（第 59 课）。第 12 题：“加牛奶的咖啡”用 [с]{.ru} + 第五格 [с молоко́м]{.ru}；[без]{.ru}、[из]{.ru}、[у]{.ru} 都要求第二格，不能接 [молоко́м]{.ru}（第 37、61 课）。第 13 题：后半句 [он стро́ит мосты́]{.ru} 说明他是工程师 [инжене́ром]{.ru}；医生、教师、售货员不造桥（第 64 课）。第 14 题：后面是第五格 [столо́м]{.ru}，四个前置词里只有 [под]{.ru} 表示处所时要求第五格；[на]{.ru}、[в]{.ru} 表处所要第六格，[у]{.ru} 要第二格（第 66 课）。第 15 题：“下雨”在俄语里说 [идёт дождь]{.ru}，用定向动词 [идти́]{.ru}，不用 [хо́дит]{.ru}，也不用乘车的 [е́дет]{.ru}、[е́здит]{.ru}（第 69 课）。第 16 题：问的是星期六去了哪儿，说的是去了一趟又回来，用不定向动词过去时 [ходи́ли]{.ru}；[шли]{.ru} 是“当时正在路上”，[хо́дим]{.ru}、[идём]{.ru} 是现在时（第 71 课）。第 17 题：[когда́]{.ru} 引出“正在路上”的背景，用定向动词 [шёл]{.ru}；[сего́дня у́тром]{.ru} 说的是过去，不用现在时（第 72 课）。第 18 题：[Его́ нет до́ма]{.ru} 说明爸爸已经出门、还没回来，用 [пое́хал]{.ru}；[е́здил]{.ru} 是去过、已经回来，和“不在家”矛盾；[пое́дет]{.ru} 说的是还没走（第 73 课）。第 19 题：“从……来”回答 [отку́да]{.ru}，[на рабо́те]{.ru} 对应的是 [с]{.ru} + 第二格 [с рабо́ты]{.ru}；不能说 [из рабо́ты]{.ru}（第 74 课）。第 20 题：去人那里用 [к]{.ru}，在人那里用 [у]{.ru}，从人那里来用 [от]{.ru} + 第二格：[от врача́]{.ru}；[из]{.ru} 不和表示人的词连用（第 74 课）。第 21 题：回答是指路，问路说 [Как пройти́ к…?]{.ru}；[где]{.ru}、[куда́]{.ru}、[когда́]{.ru} 都不和 [пройти́ к…]{.ru} 搭配成问路的话（第 75 课）。第 22 题：两个小时都在挑，最后买了红的，挑选是 [выбира́ла]{.ru}；[продава́ла]{.ru}“卖”和后面的“买”矛盾，[рисова́ла]{.ru}、[чита́ла]{.ru} 不能接 [су́мку]{.ru}（第 77 课）。第 23 题：[бы]{.ru} 和动词过去时形式连用，说话人是女性 [же́нщина]{.ru}，用阴性 [хоте́ла]{.ru}；[хочу́ бы]{.ru} 不成话（第 77 课）。第 24 题：[три́ста]{.ru}、[пятьсо́т]{.ru}、[девятьсо́т]{.ru} 这类以零结尾的数词后面用复数第二格 [рубле́й]{.ru}；[рубля́]{.ru} 只用在 2、3、4 后，[рубль]{.ru} 用在 1 后，[рубля́х]{.ru} 是第六格（第 39、78 课）。第 25 题：[кото́рый]{.ru} 跟它所指的名词在性、数上一致。[кафе́]{.ru} 是不变格的外来词，属于中性，所以用 [кото́рое]{.ru}；动词 [нахо́дится]{.ru} 是单数，排除了 [кото́рые]{.ru}，但阳性、阴性、中性要靠自己记得 [кафе́]{.ru} 的性来判断（第 5、79 课）。
  items:
  - stem: — Скажи́те, пожа́луйста, э́тот авто́бус идёт в центр? — ___
    options: ['Спаси́бо, не на́до.', 'Нет, вам ну́жен деся́тый.', 'Ничего́, не волну́йтесь.', С удово́льствием!]
    answer: Нет, вам ну́жен деся́тый.
  - stem: — У тебя́ есть соба́ка? — Нет, ___ у меня́ есть ко́шка.
    options: [и, и́ли, но, когда́]
    answer: но
  - stem: Вчера́ я ___ в э́том магази́не но́вую ку́ртку. Вот она́!
    options: [покупа́л, купи́л, покупа́ю, куплю́]
    answer: купи́л
  - stem: Моя́ сестра́ у́чится ___ филологи́ческом факульте́те.
    options: [в, о, у, на]
    answer: на
  - stem: Ма́льчик о́чень хоте́л есть и сра́зу ___ два пирожка́.
    options: [съел, ел, ест, съест]
    answer: съел
  - stem: Сейча́с два часа́, а уро́к начнётся в три. Он начнётся ___ час.
    options: [наза́д, в, на, че́рез]
    answer: че́рез
  - stem: — ___? — Сего́дня пе́рвое ноября́.
    options: [Кото́рый час, Ско́лько сто́ит, Како́е сего́дня число́, Ско́лько тебе́ лет]
    answer: Како́е сего́дня число́
  - stem: — Тебе́ нра́вится Москва́? — Да, о́чень. Здесь так ___!
    options: [ску́чно, краси́во, пло́хо, гру́стно]
    answer: краси́во
  - stem: Мое́й сестре́ уже́ трина́дцать ___.
    options: [год, лет, го́да, году́]
    answer: лет
  - stem: Зимо́й в Москве́ хо́лодно, и мне нужна́ тёплая ___.
    options: [футбо́лка, ру́чка, кни́га, ша́пка]
    answer: ша́пка
  - stem: — Пойдём ве́чером в кино́! — Извини́, сего́дня я не могу́, я ___.
    options: [свобо́дна, ра́да, занята́, здоро́ва]
    answer: занята́
  - stem: Я люблю́ ко́фе ___ молоко́м.
    options: [с, без, из, у]
    answer: с
  - stem: Мой оте́ц рабо́тает ___, он стро́ит мосты́.
    options: [врачо́м, учи́телем, продавцо́м, инжене́ром]
    answer: инжене́ром
  - stem: Ко́шка спит ___ столо́м.
    options: [под, на, в, у]
    answer: под
  - stem: Сейча́с ___ дождь, и де́ти не гуля́ют, а сидя́т до́ма.
    options: [хо́дит, е́дет, идёт, е́здит]
    answer: идёт
  - stem: — Где вы бы́ли в суббо́ту? — Мы ___ в музе́й.
    options: [шли, ходи́ли, хо́дим, идём]
    answer: ходи́ли
  - stem: Сего́дня у́тром, когда́ я ___ в университе́т, я уви́дел ста́рого дру́га.
    options: [ходи́л, идёт, шёл, хо́дит]
    answer: шёл
  - stem: — Где па́па? — Его́ нет до́ма, он ___ на рабо́ту.
    options: [е́здил, е́здит, пое́дет, пое́хал]
    answer: пое́хал
  - stem: Ма́ма была́ на рабо́те. Сейча́с она́ е́дет домо́й ___.
    options: [с рабо́ты, из рабо́ты, на рабо́ту, на рабо́те]
    answer: с рабо́ты
  - stem: Мой брат был у врача́. Сейча́с он идёт домо́й ___.
    options: [из врача́, от врача́, к врачу́, у врача́]
    answer: от врача́
  - stem: — Прости́те, ___ пройти́ к Большо́му теа́тру? — Иди́те пря́мо, пото́м нале́во.
    options: [где, куда́, когда́, как]
    answer: как
  - stem: Вчера́ сестра́ два часа́ ___ су́мку и наконе́ц купи́ла кра́сную.
    options: [выбира́ла, продава́ла, рисова́ла, чита́ла]
    answer: выбира́ла
  - stem: 'Же́нщина сказа́ла официа́нту: «Я ___ бы заказа́ть блины́».'
    options: [хоте́л, хочу́, хоте́ла, хо́чет]
    answer: хоте́ла
  - stem: — Ско́лько с меня́? — Три́ста ___.
    options: [рубль, рубля́, рубле́й, рубля́х]
    answer: рубле́й
  - stem: Мы обе́дали в кафе́, ___ нахо́дится ря́дом с музе́ем.
    options: [кото́рые, кото́рый, кото́рая, кото́рое]
    answer: кото́рое
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: '::: {.prose lang="ru"}

    **Пода́рок для ба́бушки**


    В суббо́ту я пое́хал на (1) []{.blank}. В воскресе́нье у мое́й ба́бушки день рожде́ния, и я хоте́л купи́ть ей пода́рок. Ба́бушка о́чень лю́бит (2) []{.blank}: у неё на ку́хне всегда́ стои́т ста́рый самова́р. Но он уже́ не (3) []{.blank}. «Куплю́ ей (4) []{.blank} самова́р!» — ду́мал я.


    На ры́нке я до́лго (5) []{.blank} самова́р. Наконе́ц я уви́дел его́. Самова́р был краси́вый, но о́чень (6) []{.blank}: он сто́ил девятьсо́т рубле́й, а у меня́ бы́ло (7) []{.blank} четы́реста. Я (8) []{.blank} продавцу́: «Э́то сли́шком до́рого для меня́». Продаве́ц отве́тил: «А ва́ша ба́бушка лю́бит (9) []{.blank}? Вот вишнёвое варе́нье, оно́ сто́ит две́сти рубле́й». Но ба́бушка не покупа́ет варе́нье: ка́ждое ле́то она́ (10) []{.blank} его́ на да́че. Тогда́ продаве́ц показа́л мне краси́вую бе́лую (11) []{.blank}. Она́ сто́ила (12) []{.blank} рубле́й, и я купи́л её.


    В воскресе́нье я пое́хал к ба́бушке на да́чу. Ба́бушка была́ о́чень (13) []{.blank}: «Кака́я краси́вая ча́шка! Спаси́бо!» Ве́чером мы пи́ли чай из (14) []{.blank} ча́шки, а ста́рый самова́р (15) []{.blank} на столе́, как всегда́. Я сказа́л: «Ба́бушка, я хоте́л купи́ть тебе́ но́вый самова́р, (16) []{.blank} он был о́чень дорого́й. В сле́дующем году́ я обяза́тельно (17) []{.blank} его́!» Ба́бушка (18) []{.blank}: «Не на́до! Э́тот самова́р мне подари́л (19) []{.blank} в день на́шей сва́дьбы. Я его́ о́чень (20) []{.blank}».

    :::

    '
  passage_zh: '**送给奶奶的礼物**


    星期六我去了市场。星期天是我奶奶的生日，我想给她买件礼物。奶奶非常爱喝茶：她家厨房里总摆着一个旧茶炊。可是它已经不能用了。“我给她买个新茶炊！”我想。


    在市场上我找了很久茶炊。终于我看见了一个。茶炊很漂亮，可是很贵：要九百卢布，而我只有四百。我对售货员说：“这对我来说太贵了。”售货员回答：“您奶奶喜欢果酱吗？这是樱桃果酱，二百卢布。”可是奶奶从来不买果酱：每年夏天她都在别墅自己做。于是售货员给我看了一个漂亮的白杯子。它三百卢布，我就买下了。


    星期天我去别墅看奶奶。奶奶非常高兴：“多漂亮的杯子！谢谢！”晚上我们用新杯子喝茶，那个旧茶炊照旧摆在桌子上。我说：“奶奶，我本来想给你买个新茶炊，可是太贵了。明年我一定给你买！”奶奶笑了：“不用！这个茶炊是你爷爷在我们结婚那天送给我的。我非常喜欢它。”

    '
  why: 第 1 空：第二段开头说 [На ры́нке я до́лго…]{.ru}，可见去的是市场 [ры́нок]{.ru}；火车站、体育场、滑冰场都买不到茶炊。第 2 空：后半句说她厨房里总摆着茶炊，下文又说一起 [пи́ли чай]{.ru}，奶奶爱的是茶 [чай]{.ru}；咖啡、牛奶、汤都不用茶炊。第 3 空：[Но]{.ru} 引出问题，下一句“我”想给她买新的，说明旧茶炊坏了、[не рабо́тает]{.ru}；[не понима́ет]{.ru}、[не игра́ет]{.ru}、[не отдыха́ет]{.ru} 说的都是人。第 4 空：旧的不能用，所以要买新的 [но́вый]{.ru}；[ста́рый]{.ru} 正是要换掉的，[плохо́й]{.ru}、[пусто́й]{.ru} 不会特意去买。第 5 空：后面说 [Наконе́ц я уви́дел его́]{.ru}“终于看见了”，前面是在找：[иска́л]{.ru}；[выбира́л]{.ru}、[смотре́л]{.ru} 说明已经看到了，和“终于看见”矛盾；[покупа́л]{.ru} 和后文“没有买成”矛盾。第 6 空：后面说要九百卢布而“我”只有四百，又说 [Э́то сли́шком до́рого]{.ru}，所以是 [дорого́й]{.ru}；[но]{.ru} 前面是优点“漂亮”，后面要接缺点，[лёгкий]{.ru}、[ма́ленький]{.ru} 不能解释买不起。第 7 空：四百比九百少得多，钱不够，用 [то́лько]{.ru}“只有”；[уже́]{.ru}、[ещё]{.ru}、[да́же]{.ru} 都表达不出“不够”的意思。第 8 空：后面是“我”对售货员说的一句话，用 [сказа́л]{.ru}；这句话不是问句，排除 [спроси́л]{.ru}；售货员前面没有问“我”，不能说 [отве́тил]{.ru}；[рассказа́л]{.ru} 用于讲一件事，不用来引出这样一句短话。第 9 空：售货员紧接着推荐的是 [вишнёвое варе́нье]{.ru}，他问的是奶奶喜不喜欢果酱；牛奶、肉、冰激凌都和下文接不上。第 10 空：前半句说奶奶不买果酱，后半句解释原因：她每年夏天自己在别墅做 [гото́вит]{.ru}；[покупа́ет]{.ru} 和“不买”直接矛盾，[продаёт]{.ru}、[и́щет]{.ru} 都解释不了为什么不买。第 11 空：下文说 [Кака́я краси́вая ча́шка!]{.ru}，又说用新杯子喝茶，买的是杯子 [ча́шку]{.ru}；帽子、包、外套和茶也无关。第 12 空：“我”只有四百卢布，四个价钱里只有 [три́ста]{.ru} 买得起；五百、六百、九百都超过四百。第 13 空：奶奶收到礼物，接着称赞杯子漂亮、道谢，是高兴 [ра́да]{.ru}；[занята́]{.ru}、[свобо́дна]{.ru} 与上下文不符，[должна́]{.ru} 后面要接不定式。第 14 空：用的是刚送的新杯子 [но́вой]{.ru}；杯子是白的，[чёрной]{.ru} 不对，[пусто́й]{.ru} 杯子喝不了茶，[ста́рой]{.ru} 和“刚买的”矛盾。第 15 空：茶炊放在桌上用 [стоя́л]{.ru}，和第一段的 [стои́т ста́рый самова́р]{.ru} 一致；立着的器物不说 [лежа́л]{.ru}，[висе́л]{.ru}、[сиде́л]{.ru} 也不合适。第 16 空：想买和太贵是转折关系，用 [но]{.ru}；[и]{.ru}、[и́ли]{.ru}、[пото́м]{.ru} 都表达不出转折。第 17 空：今年钱不够没买成，答应明年一定买：[куплю́]{.ru}；[прода́м]{.ru} 意思相反，[сыгра́ю]{.ru}、[вы́учу]{.ru} 不能接 [самова́р]{.ru}。第 18 空：奶奶接着说的是 [Не на́до!]{.ru}，不是问句，用 [засмея́лась]{.ru}；[спроси́ла]{.ru} 后面应该是问题，[опозда́ла]{.ru}、[потеря́ла]{.ru} 不能引出直接引语。第 19 空：在“我们结婚那天”送茶炊的人只能是奶奶的丈夫，也就是“你的爷爷” [твой де́душка]{.ru}；“你的父亲”“你的哥哥”“你的朋友”那时候都还没有或不相干。第 20 空：奶奶说不用买新的，因为这个旧茶炊是珍贵的纪念，她“很爱”它：[люблю́]{.ru}；[продаю́]{.ru}、[ищу́]{.ru}、[покупа́ю]{.ru} 都和“不用买新的”的理由不符。
  items:
  - options: [вокза́л, стадио́н, като́к, ры́нок]
    answer: ры́нок
  - options: [ко́фе, чай, молоко́, суп]
    answer: чай
  - options: [понима́ет, игра́ет, рабо́тает, отдыха́ет]
    answer: рабо́тает
  - options: [ста́рый, но́вый, плохо́й, пусто́й]
    answer: но́вый
  - options: [выбира́л, иска́л, покупа́л, смотре́л]
    answer: иска́л
  - options: [дорого́й, лёгкий, ста́рый, ма́ленький]
    answer: дорого́й
  - options: [уже́, ещё, да́же, то́лько]
    answer: то́лько
  - options: [спроси́л, рассказа́л, сказа́л, отве́тил]
    answer: сказа́л
  - options: [молоко́, мя́со, моро́женое, варе́нье]
    answer: варе́нье
  - options: [покупа́ет, гото́вит, продаёт, и́щет]
    answer: гото́вит
  - options: [ча́шку, ша́пку, су́мку, ку́ртку]
    answer: ча́шку
  - options: [пятьсо́т, шестьсо́т, девятьсо́т, три́ста]
    answer: три́ста
  - options: [занята́, ра́да, свобо́дна, должна́]
    answer: ра́да
  - options: [ста́рой, пусто́й, но́вой, чёрной]
    answer: но́вой
  - options: [стоя́л, лежа́л, висе́л, сиде́л]
    answer: стоя́л
  - options: [но, и, и́ли, пото́м]
    answer: но
  - options: [прода́м, сыгра́ю, куплю́, вы́учу]
    answer: куплю́
  - options: [спроси́ла, опозда́ла, потеря́ла, засмея́лась]
    answer: засмея́лась
  - options: [твой брат, твой де́душка, твой оте́ц, твой друг]
    answer: твой де́душка
  - options: [продаю́, ищу́, люблю́, покупа́ю]
    answer: люблю́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: '::: {.prose lang="ru"}

    **Пе́рвый рабо́чий день**


    Серге́й — молодо́й инжене́р. В сентябре́ он на́чал рабо́тать на большо́м заво́де на друго́м конце́ го́рода. Рабо́та там начина́ется в во́семь.


    В пе́рвый день он пое́хал ра́но, на метро́, а пото́м на трамва́е. Он смотре́л в окно́ и ду́мал о но́вой рабо́те. Ско́ро он уви́дел ре́ку и большо́й мост, но заво́да там не́ было. Он спроси́л же́нщину на остано́вке, где заво́д. «Заво́д? — сказа́ла она́. — Вы се́ли не на тот трамва́й, э́тот идёт в центр».


    На заво́де Серге́й был то́лько в де́вять и сра́зу пошёл к дире́ктору. «Извини́те, я опозда́л», — сказа́л он и всё рассказа́л. Дире́ктор засмея́лся: «Не волну́йтесь. В мой пе́рвый день я то́же сел не на тот трамва́й — два́дцать лет наза́д. Вам ну́жен девя́тый, а не седьмо́й».


    Ве́чером Серге́й сказа́л жене́: «Опозда́л на це́лый час. Но дире́ктор у нас хоро́ший челове́к».

    :::

    '
  passage_zh: '**上班第一天**


    谢尔盖是个年轻工程师。九月他开始在城市另一头的一家大工厂上班，那里八点上班。


    第一天他早早就出发了，先坐地铁，再换电车。他望着窗外，想着新工作。不久他看见一条河和一座大桥，可那儿根本没有工厂。他问车站上的一位妇女工厂在哪儿。“工厂？”她说，“您坐错车了，这趟是去市中心的。”


    谢尔盖九点才到厂，一到就去找厂长。“对不起，我迟到了。”他说，并把经过讲了一遍。厂长笑了：“别紧张。我上班第一天也坐错了车，那是二十年前的事了。您要坐九路，不是七路。”


    晚上谢尔盖对妻子说：“迟到了整整一个小时。不过我们厂长是个好人。”

    '
  why: 第 1 题，[Рабо́та там начина́ется в во́семь]{.ru}；九点是他迟到后到厂的时间。第 2 题，车站上的妇女说 [Вы се́ли не на тот трамва́й]{.ru}；他是早早出发的，没有睡过头，也没有等车。第 3 题，[На заво́де Серге́й был то́лько в де́вять]{.ru}；[то́лько]{.ru} 在这里是“才”，比上班时间晚了一个小时，结尾他也说 [Опозда́л на це́лый час]{.ru}。第 4 题，厂长说 [В мой пе́рвый день я то́же сел не на тот трамва́й]{.ru}：他自己也犯过同样的错，所以笑而不怪；他今天并没有迟到。第 5 题，推断题：厂长告诉他 [Вам ну́жен девя́тый, а не седьмо́й]{.ru}，明天他会坐九路；七路正是他今天坐错的车。
  items:
  - stem: Рабо́та на заво́де начина́ется ___.
    options: [в шесть часо́в, в во́семь часо́в, в де́вять часо́в, в семь часо́в]
    answer: в во́семь часо́в
  - stem: 'Серге́й опозда́л: он ___.'
    options: [до́лго спал, не знал а́дрес заво́да, до́лго ждал трамва́й, сел не на тот трамва́й]
    answer: сел не на тот трамва́й
  - stem: На заво́де Серге́й был ___.
    options: [в де́вять часо́в, в во́семь часо́в, в семь часо́в, в де́сять часо́в]
    answer: в де́вять часо́в
  - stem: 'Дире́ктор засмея́лся: ___.'
    options: [он не по́нял Серге́я, Серге́й рассказа́л смешну́ю исто́рию, в его́ пе́рвый день он то́же сел не на тот трамва́й, он то́же опозда́л сего́дня]
    answer: в его́ пе́рвый день он то́же сел не на тот трамва́й
  - stem: За́втра Серге́й, наве́рное, ___.
    options: [опя́ть опозда́ет, пое́дет на седьмо́м трамва́е, пое́дет в центр, пое́дет на девя́том трамва́е]
    answer: пое́дет на девя́том трамва́е
  glossary:
  - {ru: на́чал, zh: 开始（нача́ть 的过去时）}
  - {ru: остано́вка, pos: f, zh: 车站（公交、电车）}
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的对话，根据内容选出正确答案。
  points: 2.5
  passage: '::: {.dialogue lang="ru"}

    [Па́па]{.sp} Ве́ра, в суббо́ту у ма́мы день рожде́ния. Что мы ей пода́рим?


    [Ве́ра]{.sp} Ма́ма давно́ хо́чет тёплый сви́тер. Зимо́й у неё на рабо́те хо́лодно.


    [Па́па]{.sp} Хоро́шая иде́я. Вот магази́н, пойдём!


    [Продаве́ц]{.sp} Здра́вствуйте! Что вы хоти́те посмотре́ть?


    [Па́па]{.sp} Здра́вствуйте! Покажи́те, пожа́луйста, сви́тер для мое́й жены́.


    [Продаве́ц]{.sp} Како́й разме́р?


    [Па́па]{.sp} Разме́р? Не зна́ю… Ве́ра, ты зна́ешь?


    [Ве́ра]{.sp} Коне́чно, зна́ю. Со́рок восьмо́й.


    [Продаве́ц]{.sp} Вот, пожа́луйста. Э́тот кра́сный сви́тер сто́ит ты́сячу три́ста рубле́й, се́рый — ты́сячу две́сти, а бе́лый — ты́сячу пятьсо́т.


    [Па́па]{.sp} Кра́сный о́чень краси́вый! Возьмём его́!


    [Ве́ра]{.sp} Па́па, ты забы́л: ма́ма не но́сит кра́сную оде́жду. А се́рый цвет она́ не лю́бит.


    [Па́па]{.sp} Пра́вда. Тогда́ мы возьмём бе́лый. Вот, пожа́луйста, де́ньги.


    [Продаве́ц]{.sp} Спаси́бо! А торт вы уже́ купи́ли? Ря́дом с на́ми есть бу́лочная, там о́чень вку́сные то́рты.


    [Ве́ра]{.sp} Спаси́бо, но торт нам не ну́жен. Па́па всегда́ гото́вит торт на день рожде́ния ма́мы. Ма́ма говори́т: «Э́то лу́чший торт в Москве́!»


    [Па́па]{.sp} Да. Ве́ра, в пя́тницу ве́чером ма́ма бу́дет на рабо́те. Ты мне помо́жешь?


    [Ве́ра]{.sp} Коне́чно, помогу́!

    :::

    '
  passage_zh: '::: translation

    [爸爸]{.sp} 薇拉，星期六是妈妈的生日。我们送她什么呢？


    [薇拉]{.sp} 妈妈早就想要一件暖和的毛衣。冬天她单位里很冷。


    [爸爸]{.sp} 好主意。商店就在这儿，走吧！


    [售货员]{.sp} 您好！您想看点儿什么？


    [爸爸]{.sp} 您好！请给我看看毛衣，给我妻子穿的。


    [售货员]{.sp} 多大号的？


    [爸爸]{.sp} 号码？我不知道……薇拉，你知道吗？


    [薇拉]{.sp} 当然知道。四十八号。


    [售货员]{.sp} 给您。这件红毛衣一千三百卢布，灰的一千二，白的一千五。


    [爸爸]{.sp} 红的真漂亮！就要它吧！


    [薇拉]{.sp} 爸爸，你忘了：妈妈不穿红衣服。灰色她不喜欢。


    [爸爸]{.sp} 对。那我们要白的。给您钱。


    [售货员]{.sp} 谢谢！蛋糕你们已经买了吗？我们旁边有家面包店，那儿的蛋糕很好吃。


    [薇拉]{.sp} 谢谢，可我们不需要蛋糕。妈妈过生日，爸爸总是自己做蛋糕。妈妈说：“这是莫斯科最好的蛋糕！”


    [爸爸]{.sp} 是啊。薇拉，星期五晚上妈妈要上班。你帮我好吗？


    [薇拉]{.sp} 当然帮！

    :::

    '
  why: 第 1 题，爸爸一开头就说 [в суббо́ту у ма́мы день рожде́ния. Что мы ей пода́рим?]{.ru}，礼物是送妈妈的。第 2 题，爸爸不知道尺码，问薇拉，薇拉说 [Коне́чно, зна́ю. Со́рок восьмо́й]{.ru}。第 3 题，薇拉说 [ма́ма не но́сит кра́сную оде́жду]{.ru}，所以没买红的；红毛衣比白的还便宜，不是嫌贵。第 4 题，推断题：红的妈妈不穿，灰色妈妈不喜欢，他们最后要了白的；售货员说白的 [ты́сячу пятьсо́т]{.ru}。第 5 题，推断题：薇拉说爸爸总是自己给妈妈做生日蛋糕，爸爸又说星期五晚上妈妈上班、请薇拉帮忙，可见他们要趁妈妈不在家做蛋糕；面包店的蛋糕他们不需要。
  items:
  - stem: Па́па и Ве́ра покупа́ют пода́рок ___.
    options: [ба́бушке, Ве́ре, па́пе, ма́ме]
    answer: ма́ме
  - stem: Како́й разме́р но́сит ма́ма, зна́ет ___.
    options: [Ве́ра, па́па, продаве́ц, ба́бушка]
    answer: Ве́ра
  - stem: 'Кра́сный сви́тер не купи́ли: ___.'
    options: [он сли́шком дорого́й, он ма́ленький, в магази́не нет тако́го разме́ра, ма́ма не но́сит кра́сную оде́жду]
    answer: ма́ма не но́сит кра́сную оде́жду
  - stem: Они́ купи́ли сви́тер. Он сто́ит ___.
    options: [ты́сячу пятьсо́т рубле́й, ты́сячу две́сти рубле́й, ты́сячу три́ста рубле́й, две ты́сячи рубле́й]
    answer: ты́сячу пятьсо́т рубле́й
  - stem: В пя́тницу ве́чером па́па и Ве́ра, наве́рное, ___.
    options: [пойду́т в бу́лочную, бу́дут на рабо́те, бу́дут гото́вить торт, ку́пят сви́тер]
    answer: бу́дут гото́вить торт
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的菜单，根据内容选出正确答案。
  points: 2.5
  passage: '::: {.prose lang="ru"}

    **Кафе́ «Самова́р»**


    | Меню́ | рубле́й |

    |---|---|

    | сала́т | 250 |

    | борщ со смета́ной | 350 |

    | пельме́ни | 420 |

    | блины́ с мёдом | 280 |

    | блины́ с варе́ньем | 300 |

