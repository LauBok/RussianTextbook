  passage: |
    ::: {.prose lang="ru"}
    **Пе́рвый рабо́чий день**

    Серге́й — молодо́й инжене́р. В сентябре́ у него́ начала́сь рабо́та на большо́м заво́де. Заво́д нахо́дится далеко́ от его́ до́ма, на друго́м конце́ го́рода. Рабо́та начина́ется в во́семь часо́в.

    В пе́рвый день Серге́й встал ра́но, в шесть часо́в, бы́стро съел бутербро́д и пошёл к метро́. Он е́хал на метро́, а пото́м сел на трамва́й. Трамва́й шёл ме́дленно. Серге́й смотре́л в окно́ и ду́мал о но́вой рабо́те.

    Че́рез полчаса́ он уви́дел ре́ку и большо́й мост. «Здесь до́лжен быть заво́д, а тут река́!» — ду́мал Серге́й. Он спроси́л немолоду́ю же́нщину: «Прости́те, где здесь заво́д?» Же́нщина засмея́лась: «Заво́д далеко́, сза́ди. Вы се́ли не на тот трамва́й: э́тот трамва́й идёт в центр. Поезжа́йте наза́д на авто́бусе. Остано́вка вон там, напро́тив».

    Серге́й опозда́л на це́лый час. Он о́чень волнова́лся. В кабине́те его́ ждал дире́ктор. Серге́й всё рассказа́л ему́. Но дире́ктор то́лько засмея́лся: «Не волну́йтесь. Два́дцать лет наза́д я то́же сел не на тот трамва́й и в пе́рвый день опозда́л на два часа́! Вот вам а́дрес и но́мер трамва́я. За́втра вы бу́дете здесь в во́семь».

    Ве́чером Серге́й сказа́л жене́: «Сего́дня я опозда́л, но тепе́рь я зна́ю: мой дире́ктор — хоро́ший челове́к».
    :::
  passage_zh: |
    **第一个工作日**

    谢尔盖是一名年轻的工程师。九月，他在一家大工厂开始上班。工厂离他家很远，在城市的另一头。上班时间是八点。

    第一天谢尔盖起得很早，六点就起来了，匆匆吃了一个三明治就去了地铁站。他坐了地铁，然后上了有轨电车。电车开得很慢。谢尔盖望着窗外，想着新工作。

    过了半个小时，他看见一条河和一座大桥。“这儿应该是工厂，可这儿是条河！”谢尔盖想。他问一位上了年纪的妇女：“劳驾，这儿的工厂在哪儿？”那位妇女笑了：“工厂离这儿远着呢，在后面。您坐错电车了：这趟电车是去市中心的。您坐公共汽车往回走吧。车站就在那儿，对面。”

    谢尔盖迟到了整整一个小时。他非常着急。厂长在办公室里等他。谢尔盖把经过都跟他讲了。可是厂长只是笑了笑：“别着急。二十年前我也坐错了电车，第一天迟到了两个小时！这是地址和电车的车次。明天您八点到这儿就行了。”

    晚上谢尔盖对妻子说：“今天我迟到了，可现在我知道了：我们厂长是个好人。”
  why: 第 1 题，[Серге́й встал ра́но, в шесть часо́в]{.ru}；八点是上班时间。第 2 题，妇女说 [Вы се́ли не на тот трамва́й]{.ru}，这就是他迟到的原因；他起得很早，没有睡过头。第 3 题，推断题：上班时间是八点，[Серге́й опозда́л на це́лый час]{.ru}，所以他九点才到工厂；十点是厂长当年迟到两小时的情况。第 4 题，推断题：厂长笑着说 [Два́дцать лет наза́д я то́же сел не на тот трамва́й]{.ru}，他自己也犯过同样的错，所以不生气，反而觉得好笑。第 5 题，主旨题：全文讲谢尔盖上班第一天坐错车、迟到、厂长原谅他的经过；电车、桥、妻子都只是其中的细节。
  items:
  - stem: В пе́рвый день Серге́й встал в ___.
    options: [семь часо́в, во́семь часо́в, де́вять часо́в, шесть часо́в]
    answer: шесть часо́в
  - stem: 'Серге́й опозда́л: он ___.'
    options: [до́лго спал, сел не на тот трамва́й, забы́л а́дрес заво́да, до́лго ждал авто́бус]
    answer: сел не на тот трамва́й
  - stem: На заво́де Серге́й был ___.
    options: [в де́вять часо́в, в во́семь часо́в, в семь часо́в, в де́сять часо́в]
    answer: в де́вять часо́в
  - stem: 'Дире́ктор засмея́лся: ___.'
    options: [он не понима́л Серге́я, ра́ньше он то́же сел не на тот трамва́й, он то́же опозда́л сего́дня, ему́ не нра́вилась его́ рабо́та]
    answer: ра́ньше он то́же сел не на тот трамва́й
  - stem: Э́тот расска́з о ___.
    options: [ста́ром трамва́е, большо́м мо́сте, пе́рвом рабо́чем дне Серге́я, жене́ Серге́я]
    answer: пе́рвом рабо́чем дне Серге́я
