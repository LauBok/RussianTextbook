      '
    rubric: [13–15 分：写清买了什么、多少钱，出商店以后有新的情节和结尾，和开头衔接自然；语法错误不超过两处, 9–12 分：内容基本完整，情节简单，或语法错误三四处, 5–8 分：只写了买东西，没有后面的情节和结尾，或语法错误较多, 0–4 分：与开头无关，或大部分句子看不懂, '分项参考：内容 6 分（买的东西和价钱 2 分，新情节 2 分，结尾 2 分）；语法 6 分（动词的体、运动动词、数词和 [рубль]{.ru} 的搭配每两处错误扣 1 分）；词汇 3 分', 字数少于 40 词的，最多给 8 分]
    notes: 范文约 75 词，分两段，只写一件事：第一段在商店里挑礼物、付钱，第二段回家把礼物送给妈妈，结尾回到开头“给妈妈买礼物”。语法上：[Покажи́те, пожа́луйста]{.ru} 是商店里的请求（第 76 课）；[сто́ил семьсо́т рубле́й]{.ru}，[семьсо́т]{.ru} 后面用 [рубле́й]{.ru}（第 78 课）；[купи́л]{.ru}、[верну́лся]{.ru} 说一次的结果，用完成体（第 44、76 课）；[плато́к ей понра́вится]{.ru}，喜欢的人用第三格（第 52、56 课）；[ма́ма до́лго смотре́ла]{.ru} 说过程，用未完成体（第 42 课）。续写前先想好结尾，每句都要往结尾推进，不要写和主线无关的事。
