    [爸爸]{.sp} 好主意。商店就在这儿，走吧！

    [售货员]{.sp} 您好！您想看点儿什么？

    [爸爸]{.sp} 您好！请给我看看毛衣，给我妻子穿的。

    [售货员]{.sp} 多大号的？

    [爸爸]{.sp} 号码？我不知道……薇拉，你知道吗？

    [薇拉]{.sp} 当然知道。四十八号。

    [售货员]{.sp} 给您。这件红毛衣一千三百卢布，灰的一千二，白的一千五。

    [爸爸]{.sp} 红的真漂亮！就要它吧！

    [薇拉]{.sp} 爸爸，你忘了：妈妈不穿红衣服。灰毛衣她已经有了。

    [爸爸]{.sp} 对。那我们要白的。给您钱。

    [售货员]{.sp} 谢谢！蛋糕你们已经买了吗？我们旁边有家面包店，那儿的蛋糕很好吃。

    [薇拉]{.sp} 谢谢，可我们不需要蛋糕。妈妈过生日，爸爸总是自己做蛋糕。妈妈说这是莫斯科最好的蛋糕。

    [爸爸]{.sp} 是啊。薇拉，星期五晚上妈妈要上班。你帮我好吗？

    [薇拉]{.sp} 当然帮！
