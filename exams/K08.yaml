lesson: K08
heading: 第八套
range: L01-L79
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：对方道歉时回答“没关系”用 [Ничего́]{.ru}；[Пожа́луйста]{.ru} 回答 [Спаси́бо]{.ru}，[Здра́вствуйте]{.ru} 是见面问候（第 4 课）。第 2 题：“某人有……”用 [у]{.ru} + 第二格，[ты]{.ru} 的第二格是 [тебя́]{.ru}，和回答里的 [у меня́]{.ru} 对应；[тебе́]{.ru} 是第三格，[тобо́й]{.ru} 是第五格（第 31 课）。第 3 题：[пятна́дцать]{.ru} 后面用复数第二格，[челове́к]{.ru} 的复数第二格和第一格同形；[челове́ка]{.ru} 用在 2–4 后面，[лю́ди]{.ru} 是复数第一格（第 35 课）。第 4 题：“在系里学习”用带 [-ся]{.ru} 的 [учи́ться]{.ru}，主语是单数，用 [у́чится]{.ru}；[у́чит]{.ru} 要带第四格宾语（学什么、教谁），[у́чатся]{.ru} 是复数（第 38 课）。第 5 题：[сра́зу]{.ru} 说的是一下子吃完了两个，是一次的结果，用完成体过去时 [съел]{.ru}；[ел]{.ru} 说过程，不和 [сра́зу]{.ru} 连用；前面是 [хоте́л]{.ru}，说的是过去，不用将来时 [съест]{.ru}（第 45 课）。第 6 题：现在两点，课三点开始，是“一小时以后”，用 [че́рез]{.ru}；[наза́д]{.ru} 是“以前”；[в час]{.ru} 是“在一点钟”，和三点开课不符（第 47 课）。第 7 题：回答 [Како́е сего́дня число́?]{.ru} 用序数词中性第一格 [пе́рвое]{.ru}，跟省去的 [число́]{.ru} 一致；[пе́рвого]{.ru} 回答“在几号”（第 49 课）。第 8 题：[нра́виться]{.ru} 的句子里喜欢的人用第三格 [мне]{.ru}，喜欢的东西 [она́]{.ru} 作主语（第 52 课）。第 9 题：[трина́дцать]{.ru} 后面用 [лет]{.ru}；[го́да]{.ru} 用在 2–4 后面，[году́]{.ru} 是第六格 [в году́]{.ru} 的形式（第 53 课）。第 10 题：[ну́жен]{.ru} 要和需要的东西一致，[ша́пка]{.ru} 是阴性，用 [нужна́]{.ru}（第 55 课）。第 11 题：[за́нят]{.ru} 跟主语的性一致，[она́]{.ru} 用阴性 [занята́]{.ru}，注意重音在词尾（第 59 课）。第 12 题：[мы с]{.ru} + 第五格表示“我和某人”，[А́нна]{.ru} 的第五格是 [А́нной]{.ru}（第 62 课）。第 13 题：[рабо́тать]{.ru} 后面表示职务的名词用第五格 [инжене́ром]{.ru}（第 64 课）。第 14 题：[под]{.ru} 表示“在……下面”时要求第五格 [под столо́м]{.ru}；[спит]{.ru} 说的是处所，不是方向（第 66 课）。第 15 题：“下雨”在俄语里说 [идёт дождь]{.ru}，用定向动词 [идти́]{.ru}，不用 [хо́дит]{.ru}，也不用乘车的 [е́дет]{.ru}（第 69 课）。第 16 题：问的是星期六去了哪儿，说的是去了一趟又回来，用不定向动词过去时 [ходи́ли]{.ru}；[шли]{.ru} 是“当时正在路上”（第 71 课）。第 17 题：[когда́]{.ru} 引出“正在路上”的背景，用定向动词 [шёл]{.ru}；[сего́дня у́тром]{.ru} 说的是过去，不用现在时（第 72 课）。第 18 题：[Его́ нет до́ма]{.ru} 说明爸爸已经出门、还没回来，用 [пое́хал]{.ru}；[е́здил]{.ru} 是去过、已经回来，和“不在家”矛盾；[пое́дет]{.ru} 说的是还没走（第 73 课）。第 19 题：“从……来”回答 [отку́да]{.ru}，[на рабо́те]{.ru} 对应的是 [с]{.ru} + 第二格 [с рабо́ты]{.ru}；不能说 [из рабо́ты]{.ru}（第 74 课）。第 20 题：去人那里用 [к]{.ru}，在人那里用 [у]{.ru}，从人那里来用 [от]{.ru} + 第二格：[от врача́]{.ru}；[из]{.ru} 不和表示人的词连用（第 74 课）。第 21 题：[бу́дет]{.ru} 说的是药店在哪儿，回答 [где]{.ru}，用 [спра́ва]{.ru}；[туда́]{.ru}、[сюда́]{.ru} 回答“往哪儿”，[отсю́да]{.ru} 回答“从哪儿”，都不表示位置（第 24、74、75 课）。第 22 题：[два часа́]{.ru} 说的是挑了多长时间，是过程，用未完成体 [покупа́ла]{.ru}；结果“买到了”由后面的 [купи́ла]{.ru} 说出（第 76 课）。第 23 题：[бы]{.ru} 和动词过去时形式连用，说话人是安娜，用阴性 [хоте́ла]{.ru}；[хочу́ бы]{.ru} 不成话（第 77 课）。第 24 题：数词最后一个词是 [два]{.ru}，后面用 [рубля́]{.ru}（第 78 课）。第 25 题：[кото́рый]{.ru} 跟前面的名词在性、数上一致，[друзья́]{.ru} 是复数，用 [кото́рые]{.ru}（第 79 课）。
  items:
  - stem: — Извини́те, я опозда́л. — ___.
    options: [Ничего́, Пожа́луйста, Спаси́бо, Здра́вствуйте]
    answer: Ничего́
  - stem: — У ___ есть соба́ка? — Нет, но у меня́ есть ко́шка.
    options: [ты, тебе́, тебя́, тобо́й]
    answer: тебя́
  - stem: В на́шей гру́ппе пятна́дцать ___.
    options: [челове́ка, челове́к, лю́ди, челове́ку]
    answer: челове́к
  - stem: Ван Лэй ___ на филологи́ческом факульте́те.
    options: [у́чит, учи́ть, у́чатся, у́чится]
    answer: у́чится
  - stem: Ми́ша о́чень хоте́л есть и сра́зу ___ два пирожка́.
    options: [съел, ел, ест, съест]
    answer: съел
  - stem: Сейча́с два часа́, а уро́к начнётся в три. Он начнётся ___ час.
    options: [наза́д, в, на, че́рез]
    answer: че́рез
  - stem: — Како́е сего́дня число́? — Сего́дня ___ ноября́.
    options: [пе́рвого, пе́рвый, пе́рвое, пе́рвая]
    answer: пе́рвое
  - stem: — Тебе́ нра́вится Москва́? — Да, ___ она́ о́чень нра́вится.
    options: [меня́, мне, я, мной]
    answer: мне
  - stem: Ми́ше уже́ трина́дцать ___.
    options: [год, лет, го́да, году́]
    answer: лет
  - stem: Зимо́й в Москве́ хо́лодно, и Ю́ми ___ тёплая ша́пка.
    options: [ну́жен, ну́жно, нужны́, нужна́]
    answer: нужна́
  - stem: А́нна не мо́жет пойти́ в кино́, сего́дня она́ ___.
    options: [за́нят, за́нято, занята́, за́няты]
    answer: занята́
  - stem: Ве́чером мы с ___ идём в теа́тр.
    options: [А́нной, А́нна, А́нну, А́нне]
    answer: А́нной
  - stem: Ива́н Серге́евич рабо́тает ___ на большо́м заво́де.
    options: [инжене́р, инжене́ра, инжене́ру, инжене́ром]
    answer: инжене́ром
  - stem: Ко́шка Му́рка спит под ___.
    options: [столо́м, стол, стола́, столе́]
    answer: столо́м
  - stem: Сейча́с ___ дождь, и Ми́ша не гуля́ет, а сиди́т до́ма.
    options: [хо́дит, е́дет, идёт, е́здит]
    answer: идёт
  - stem: — Где вы бы́ли в суббо́ту? — Мы ___ в Третьяко́вскую галере́ю.
    options: [шли, ходи́ли, хо́дим, идём]
    answer: ходи́ли
  - stem: Сего́дня у́тром, когда́ Ми́ша ___ в шко́лу, он уви́дел Ю́ми.
    options: [ходи́л, идёт, шёл, хо́дит]
    answer: шёл
  - stem: — Где па́па? — Его́ нет до́ма, он ___ на рабо́ту.
    options: [е́здил, е́здит, пое́дет, пое́хал]
    answer: пое́хал
  - stem: Мари́я Никола́евна была́ на рабо́те. Сейча́с она́ е́дет домо́й ___.
    options: [с рабо́ты, из рабо́ты, на рабо́ту, на рабо́те]
    answer: с рабо́ты
  - stem: Ми́ша был у врача́. Сейча́с он идёт домо́й ___.
    options: [из врача́, от врача́, к врачу́, у врача́]
    answer: от врача́
  - stem: Иди́те пря́мо, пото́м поверни́те нале́во. Апте́ка бу́дет ___.
    options: [отсю́да, туда́, сюда́, спра́ва]
    answer: спра́ва
  - stem: Вчера́ А́нна два часа́ ___ су́мку и наконе́ц купи́ла кра́сную.
    options: [покупа́ла, купи́ла, ку́пит, покупа́ет]
    answer: покупа́ла
  - stem: 'А́нна сказа́ла официа́нту: «Я ___ бы заказа́ть блины́».'
    options: [хоте́л, хочу́, хоте́ла, хо́чет]
    answer: хоте́ла
  - stem: — Ско́лько сто́ит плато́к? — Девятьсо́т два ___.
    options: [рубле́й, рубля́, рубль, рубли́]
    answer: рубля́
  - stem: У меня́ есть друзья́, ___ живу́т в Петербу́рге.
    options: [кото́рые, кото́рый, кото́рая, кото́рое]
    answer: кото́рые
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **В Петербу́рге**

    В декабре́ на́ша гру́ппа (1) []{.blank} в Петербу́рг. Мы е́хали туда́ на по́езде четы́ре (2) []{.blank}. В (3) []{.blank} О́льга Ви́кторовна расска́зывала нам о (4) []{.blank} и о его́ (5) []{.blank}.

    Ве́чером она́ сказа́ла: «За́втра у́тром мы (6) []{.blank} в Эрмита́ж». В суббо́ту мы (7) []{.blank} по Эрмита́жу це́лый день.

    Пото́м я хоте́л купи́ть пода́рок (8) []{.blank}. Я спроси́л (9) []{.blank} на у́лице: «Где здесь магази́н?» Она́ отве́тила: «Магази́н недалеко́. (10) []{.blank} пря́мо, а пото́м поверни́те напра́во. Магази́н бу́дет (11) []{.blank}».

    В магази́не я до́лго (12) []{.blank} пода́рок и наконе́ц купи́л краси́вый плато́к. Он (13) []{.blank} шестьсо́т (14) []{.blank}.

    Ве́чером мы у́жинали в рестора́не, (15) []{.blank} нахо́дится на Не́вском проспе́кте. Ю́ми сказа́ла официа́нту: «Я (16) []{.blank} бы попро́бовать пельме́ни».

    В воскресе́нье мы верну́лись (17) []{.blank}. До́ма Ми́ша спроси́л (18) []{.blank}: «Тебе́ (19) []{.blank} Петербу́рг?» Я отве́тил: «О́чень! За́втра я (20) []{.blank} тебе́ фо́то».
    :::
  passage_zh: |
    **在彼得堡**

    十二月我们班去了一趟彼得堡。我们坐火车去，坐了四个小时。在火车上奥尔加·维克托罗夫娜给我们讲彼得堡和它的历史。

    晚上她说：“明天上午我们去埃尔米塔日。”星期六我们在埃尔米塔日里逛了一整天。

    后来我想给妈妈买件礼物。我在街上问一个姑娘：“这儿哪里有商店？”她回答：“商店不远。一直往前走，然后向右拐。商店就在左边。”

    在商店里我挑了很久，最后买了一条漂亮的头巾。它花了六百卢布。

    晚上我们在一家位于涅瓦大街的餐厅吃晚饭。由美对服务员说：“我想尝尝饺子。”

    星期天我们回到了莫斯科。在家里米沙问我：“你喜欢彼得堡吗？”我回答：“非常喜欢！明天我给你看照片。”
  why: 第 1 空：说的是整个出行，去了又回来，用不定向动词 [е́здить]{.ru}；主语 [гру́ппа]{.ru} 是阴性单数，用 [е́здила]{.ru}；[е́хала]{.ru} 是“当时在路上”（第 71 课）。第 2 空：[четы́ре]{.ru} 后面用单数第二格 [часа́]{.ru}（第 28、35 课）。第 3 空：“在火车上”回答 [где]{.ru}，[в]{.ru} + 第六格 [в по́езде]{.ru}；[в по́езд]{.ru} 是方向（第 11、24 课）。第 4 空：[о]{.ru} 要求第六格 [о Петербу́рге]{.ru}（第 13 课）。第 5 空：[исто́рия]{.ru} 以 [-ия]{.ru} 结尾，第六格是 [исто́рии]{.ru}（第 12、13 课）。第 6 空：[за́втра]{.ru} 说的是将来的一次出行，用 [пойти́]{.ru} 的将来时 [пойдём]{.ru}；[ходи́ли]{.ru}、[пошли́]{.ru} 是过去时（第 73 课）。第 7 空：[ходи́ть по]{.ru} + 第三格表示在一个地方各处走，[це́лый день]{.ru} 说的是持续的时间，用不定向动词 [ходи́ли]{.ru}（第 72 课）。第 8 空：给谁买东西，对象用第三格 [ма́ме]{.ru}；[ма́мы]{.ru} 会变成“妈妈的礼物”（第 51 课）。第 9 空：[спроси́ть]{.ru} 后面问的人用第四格，[де́вушка]{.ru} 是动物名词，第四格 [де́вушку]{.ru}；后面的 [Она́ отве́тила]{.ru} 说明是女性（第 22、44 课）。第 10 空：商店不远，一个方向走过去，用定向动词的命令式 [Иди́те]{.ru}；[Ходи́те]{.ru} 不表示朝一个方向走一次（第 75 课）。第 11 空：[бу́дет]{.ru} 说商店的位置，回答 [где]{.ru}，用 [сле́ва]{.ru}；[сюда́]{.ru}、[туда́]{.ru} 表示方向，[отту́да]{.ru} 表示“从那儿”（第 24、74、75 课）。第 12 空：[до́лго]{.ru} 说的是过程，用未完成体过去时 [выбира́л]{.ru}；结果由后面的 [купи́л]{.ru} 说出（第 42、77 课）。第 13 空：[сто́ить]{.ru} 跟主语一致，[плато́к]{.ru} 是阳性，用 [сто́ил]{.ru}（第 39、78 课）。第 14 空：[шестьсо́т]{.ru} 后面用 [рубле́й]{.ru}（第 78 课）。第 15 空：[кото́рый]{.ru} 指前面的 [рестора́н]{.ru}，阳性单数，在从句里作主语，用 [кото́рый]{.ru}（第 79 课）。第 16 空：[бы]{.ru} 和过去时形式连用，说话人由美是女性，用 [хоте́ла]{.ru}（第 77 课）。第 17 空：[верну́ться]{.ru} 回答 [куда́]{.ru}，用 [в]{.ru} + 第四格 [в Москву́]{.ru}；[из Москвы́]{.ru} 意思是“从莫斯科回来”，和事实相反（第 47、74 课）。第 18 空：[спроси́ть]{.ru} 问的人用第四格 [меня́]{.ru}（第 22、44 课）。第 19 空：[понра́виться]{.ru} 跟喜欢的东西一致，[Петербу́рг]{.ru} 是阳性，用 [понра́вился]{.ru}（第 52、71 课）。第 20 空：[за́втра]{.ru} 说的是将来做一次，用完成体将来时 [покажу́]{.ru}（第 43、44 课）。
  items:
  - options: [е́хала, е́здили, е́здит, е́здила]
    answer: е́здила
  - options: [час, часа́, часо́в, часы́]
    answer: часа́
  - options: [по́езд, по́езда, по́езде, по́ездом]
    answer: по́езде
  - options: [Петербу́рг, Петербу́рге, Петербу́рга, Петербу́ргу]
    answer: Петербу́рге
  - options: [исто́рия, исто́рию, исто́рии, исто́рией]
    answer: исто́рии
  - options: [пойдём, пошли́, ходи́ли, шли]
    answer: пойдём
  - options: [ходи́ть, пошли́, идём, ходи́ли]
    answer: ходи́ли
  - options: [ма́му, ма́мы, ма́ме, ма́ма]
    answer: ма́ме
  - options: [де́вушка, де́вушке, де́вушки, де́вушку]
    answer: де́вушку
  - options: [Ходи́те, Иди́те, Идёте, Е́здите]
    answer: Иди́те
  - options: [сле́ва, отту́да, сюда́, туда́]
    answer: сле́ва
  - options: [вы́брал, выбира́ю, вы́беру, выбира́л]
    answer: выбира́л
  - options: [сто́ила, сто́ил, сто́ило, сто́или]
    answer: сто́ил
  - options: [рубль, рубля́, рубле́й, рубли́]
    answer: рубле́й
  - options: [кото́рый, кото́рая, кото́рое, кото́рые]
    answer: кото́рый
  - options: [хоте́ла, хоте́л, хочу́, хоте́ли]
    answer: хоте́ла
  - options: [в Москве́, из Москвы́, в Москву́, на Москву́]
    answer: в Москву́
  - options: [мне, я, мной, меня́]
    answer: меня́
  - options: [понра́вилась, понра́вился, понра́вилось, понра́вились]
    answer: понра́вился
  - options: [пока́зываю, показа́л, покажу́, пока́зывал]
    answer: покажу́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Пьер идёт в галере́ю**

    Пьер живёт в Москве́ уже́ три ме́сяца, но в Третьяко́вской галере́е он ещё не́ был. В суббо́ту он пое́хал туда́ оди́н: Ван Лэй и А́нна бы́ли за́няты, а Ю́ми е́здила к подру́ге на да́чу. До ста́нции «Третьяко́вская» он е́хал на метро́, а пото́м пошёл пешко́м. Шёл снег, все у́лицы бы́ли бе́лые. Пьер шёл пря́мо, пото́м поверну́л нале́во, пото́м напра́во, но галере́и там не́ было.

    Тогда́ он спроси́л немолоду́ю же́нщину: «Прости́те, как пройти́ к Третьяко́вской галере́е?» Же́нщина засмея́лась: «Вы идёте не туда́! Иди́те наза́д, пото́м поверни́те напра́во. Галере́я бу́дет сле́ва. Я то́же иду́ туда́. Иди́те со мной!»

    По доро́ге она́ мно́го расска́зывала о галере́е: о её исто́рии. Пьер всё понима́л: она́ говори́ла ме́дленно. В галере́е же́нщина сняла́ пальто́ и сказа́ла: «А тепе́рь начина́ем экску́рсию». Вот как! Она́ рабо́тает здесь экскурсово́дом!

    Же́нщина показа́ла ему́ ста́рые ико́ны, портре́ты и пейза́жи. Пье́ру осо́бенно понра́вилась карти́на «У́тро в сосно́вом лесу́». Он был в галере́е четы́ре часа́, а пото́м пил чай в кафе́ ря́дом с галере́ей.

    Ве́чером Пьер сказа́л Ван Лэ́ю: «Сего́дня я шёл не туда́, но э́то бы́ло о́чень хорошо́: у меня́ была́ экску́рсия!»
    :::
  passage_zh: |
    **皮埃尔去画廊**

    皮埃尔在莫斯科已经住了三个月，可是还没去过特列季亚科夫画廊。星期六他一个人去了：王磊和安娜都忙，由美去朋友的别墅了。他坐地铁到“特列季亚科夫站”，然后步行。下着雪，所有的街道都是白的。皮埃尔一直往前走，然后向左拐，又向右拐，可是那儿没有画廊。

    于是他问一位上了年纪的妇女：“劳驾，去特列季亚科夫画廊怎么走？”那位妇女笑了：“您走反了！往回走，然后向右拐。画廊就在左边。我也去那儿。跟我走吧！”

    路上她讲了很多画廊的事：画廊的历史。皮埃尔全都听懂了：她说得很慢。到了画廊，那位妇女脱下大衣，说：“现在我们开始参观讲解。”原来如此！她在这儿当讲解员！

    她给他看了古老的圣像画、肖像画和风景画。皮埃尔特别喜欢《松林的早晨》这幅画。他在画廊里待了四个小时，然后在画廊旁边的咖啡馆喝了茶。

    晚上皮埃尔对王磊说：“今天我走错了路，可是这很好：我听了一次讲解！”
  why: 第 1 题，[В суббо́ту он пое́хал туда́ оди́н]{.ru}，[оди́н]{.ru} 是“一个人”。第 2 题，[До ста́нции «Третьяко́вская» он е́хал на метро́]{.ru}，步行是出了地铁以后。第 3 题，推断题：妇女让他 [Иди́те наза́д]{.ru}“往回走”，说明画廊在他身后，即 [сза́ди]{.ru}；他出了地铁走了好一阵也没找到画廊，所以画廊不在地铁对面，也不在前方。第 4 题，推断题：她说 [начина́ем экску́рсию]{.ru}，下一句点明 [она́ рабо́тает здесь экскурсово́дом]{.ru}，所以她懂画廊的历史。第 5 题，主旨题：全文讲皮埃尔迷路、遇到讲解员、跟她参观画廊；画作和地铁站只是其中的细节，王磊只在最后听皮埃尔讲述。
