lesson: K08
heading: 第八套
range: L01-L79
names: [Ве́ра, Серёжа, Ната́ша, Чжан Мин]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：对方为迟到道歉，回答“没关系”用 [Ничего́]{.ru}；[Пожа́луйста]{.ru} 回答 [Спаси́бо]{.ru}，[Здра́вствуйте]{.ru} 是见面问候（第 4 课）。第 2 题：前面说没有狗，后面说有猫，前后对照，用表示转折的 [но]{.ru}；[и]{.ru} 不表示对照，[и́ли]{.ru} 是“或者”，[когда́]{.ru} 引出时间（第 13、14 课）。第 3 题：[ещё у́чится в шко́ле]{.ru} 说明他是中学生 [шко́льник]{.ru}；[студе́нт]{.ru} 在大学读书，[инжене́р]{.ru}、[врач]{.ru} 已经工作（第 4 课）。第 4 题：“在系里”用 [на]{.ru}：[на факульте́те]{.ru}，和 [на ку́рсе]{.ru}、[на уро́ке]{.ru} 一样；[в]{.ru} 用于 [в университе́те]{.ru}（第 11、12 课）。第 5 题：[сра́зу]{.ru} 说的是一下子吃完了两个，是一次的结果，用完成体过去时 [съел]{.ru}；[ел]{.ru} 说过程，不和 [сра́зу]{.ru} 连用；前面是 [хоте́л]{.ru}，说的是过去，不用 [ест]{.ru}、[съест]{.ru}（第 45 课）。第 6 题：现在两点，课三点开始，是“一小时以后”，用 [че́рез]{.ru}；[наза́д]{.ru} 是“以前”；[в час]{.ru} 是“在一点钟”，和三点开课不符（第 47 课）。第 7 题：回答说的是日期，问日期用 [Како́е сего́дня число́?]{.ru}；[Кото́рый час?]{.ru} 问钟点，[Ско́лько сто́ит?]{.ru} 问价钱，[Ско́лько тебе́ лет?]{.ru} 问年龄（第 28、39、49、53 课）。第 8 题：[Да, о́чень]{.ru} 是肯定的回答，后面要说喜欢的理由，只有 [краси́во]{.ru} 合适；[ску́чно]{.ru}、[пло́хо]{.ru}、[гру́стно]{.ru} 都是不喜欢的理由（第 58、63 课）。第 9 题：[трина́дцать]{.ru} 后面用 [лет]{.ru}；[го́да]{.ru} 用在 2–4 后面，[году́]{.ru} 是第六格 [в году́]{.ru} 的形式（第 53 课）。第 10 题：冬天冷，需要的是保暖的帽子 [ша́пка]{.ru}；[футбо́лка]{.ru} 是夏天穿的，[ру́чка]{.ru}、[кни́га]{.ru} 和冷不冷无关（第 55、69 课）。第 11 题：去不了电影院，原因是“我没空”：[занята́]{.ru}；[свобо́дна]{.ru} 意思相反，[ра́да]{.ru}、[здоро́ва]{.ru} 不能解释为什么不去（第 59 课）。第 12 题：“加牛奶的咖啡”用 [с]{.ru} + 第五格 [с молоко́м]{.ru}；[без]{.ru}、[из]{.ru}、[у]{.ru} 都要求第二格，不能接 [молоко́м]{.ru}（第 37、61 课）。第 13 题：后半句 [он стро́ит мосты́]{.ru} 说明他是工程师 [инжене́ром]{.ru}；医生、教师、售货员不造桥（第 64 课）。第 14 题：后面是第五格 [столо́м]{.ru}，四个前置词里只有 [под]{.ru} 表示处所时要求第五格；[на]{.ru}、[в]{.ru} 表处所要第六格，[у]{.ru} 要第二格（第 66 课）。第 15 题：“下雨”在俄语里说 [идёт дождь]{.ru}，用定向动词 [идти́]{.ru}，不用 [хо́дит]{.ru}，也不用乘车的 [е́дет]{.ru}、[е́здит]{.ru}（第 69 课）。第 16 题：问的是星期六去了哪儿，说的是去了一趟又回来，用不定向动词过去时 [ходи́ли]{.ru}；[шли]{.ru} 是“当时正在路上”，[хо́дим]{.ru}、[идём]{.ru} 是现在时（第 71 课）。第 17 题：[когда́]{.ru} 引出“正在路上”的背景，用定向动词 [шёл]{.ru}；[сего́дня у́тром]{.ru} 说的是过去，不用现在时（第 72 课）。第 18 题：[Его́ нет до́ма]{.ru} 说明爸爸已经出门、还没回来，用 [пое́хал]{.ru}；[е́здил]{.ru} 是去过、已经回来，和“不在家”矛盾；[пое́дет]{.ru} 说的是还没走（第 73 课）。第 19 题：“从……来”回答 [отку́да]{.ru}，[на рабо́те]{.ru} 对应的是 [с]{.ru} + 第二格 [с рабо́ты]{.ru}；不能说 [из рабо́ты]{.ru}（第 74 课）。第 20 题：去人那里用 [к]{.ru}，在人那里用 [у]{.ru}，从人那里来用 [от]{.ru} + 第二格：[от врача́]{.ru}；[из]{.ru} 不和表示人的词连用（第 74 课）。第 21 题：回答是指路，问路说 [Как пройти́ к…?]{.ru}；[где]{.ru}、[куда́]{.ru}、[когда́]{.ru} 都不和 [пройти́ к метро́]{.ru} 搭配成问路的话（第 75 课）。第 22 题：两个小时都在挑，最后买了红的，挑选是 [выбира́ла]{.ru}；[продава́ла]{.ru}“卖”和后面的“买”矛盾，[рисова́ла]{.ru}、[чита́ла]{.ru} 不能接 [су́мку]{.ru}（第 77 课）。第 23 题：[бы]{.ru} 和动词过去时形式连用，说话人是女性 [же́нщина]{.ru}，用阴性 [хоте́ла]{.ru}；[хочу́ бы]{.ru} 不成话（第 77 课）。第 24 题：[Ско́лько с меня́?]{.ru} 是问该付多少钱，回答价钱 [Девятьсо́т рубле́й]{.ru}；其余三项回答的是时长、日期和年龄（第 78 课）。第 25 题：[кото́рый]{.ru} 跟前面的名词在性、数上一致，[друзья́]{.ru} 是复数，用 [кото́рые]{.ru}（第 79 课）。
  items:
  - stem: — Извини́те, я опозда́л. — ___.
    options: [Ничего́, Пожа́луйста, Спаси́бо, Здра́вствуйте]
    answer: Ничего́
  - stem: — У тебя́ есть соба́ка? — Нет, ___ у меня́ есть ко́шка.
    options: [и, и́ли, но, когда́]
    answer: но
  - stem: Мой брат ещё у́чится в шко́ле, он ___.
    options: [студе́нт, шко́льник, инжене́р, врач]
    answer: шко́льник
  - stem: Моя́ сестра́ у́чится ___ филологи́ческом факульте́те.
    options: [в, о, у, на]
    answer: на
  - stem: Ма́льчик о́чень хоте́л есть и сра́зу ___ два пирожка́.
    options: [съел, ел, ест, съест]
    answer: съел
  - stem: Сейча́с два часа́, а уро́к начнётся в три. Он начнётся ___ час.
    options: [наза́д, в, на, че́рез]
    answer: че́рез
  - stem: — ___? — Сего́дня пе́рвое ноября́.
    options: [Кото́рый час, Ско́лько сто́ит, Како́е сего́дня число́, Ско́лько тебе́ лет]
    answer: Како́е сего́дня число́
  - stem: — Тебе́ нра́вится Москва́? — Да, о́чень. Здесь так ___!
    options: [ску́чно, краси́во, пло́хо, гру́стно]
    answer: краси́во
  - stem: Мое́й сестре́ уже́ трина́дцать ___.
    options: [год, лет, го́да, году́]
    answer: лет
  - stem: Зимо́й в Москве́ хо́лодно, и мне нужна́ тёплая ___.
    options: [футбо́лка, ру́чка, кни́га, ша́пка]
    answer: ша́пка
  - stem: — Пойдём ве́чером в кино́! — Извини́, сего́дня я не могу́, я ___.
    options: [свобо́дна, ра́да, занята́, здоро́ва]
    answer: занята́
  - stem: Я люблю́ ко́фе ___ молоко́м.
    options: [с, без, из, у]
    answer: с
  - stem: Мой оте́ц рабо́тает ___, он стро́ит мосты́.
    options: [врачо́м, учи́телем, продавцо́м, инжене́ром]
    answer: инжене́ром
  - stem: Ко́шка спит ___ столо́м.
    options: [под, на, в, у]
    answer: под
  - stem: Сейча́с ___ дождь, и де́ти не гуля́ют, а сидя́т до́ма.
    options: [хо́дит, е́дет, идёт, е́здит]
    answer: идёт
  - stem: — Где вы бы́ли в суббо́ту? — Мы ___ в музе́й.
    options: [шли, ходи́ли, хо́дим, идём]
    answer: ходи́ли
  - stem: Сего́дня у́тром, когда́ я ___ в университе́т, я уви́дел ста́рого дру́га.
    options: [ходи́л, идёт, шёл, хо́дит]
    answer: шёл
  - stem: — Где па́па? — Его́ нет до́ма, он ___ на рабо́ту.
    options: [е́здил, е́здит, пое́дет, пое́хал]
    answer: пое́хал
  - stem: Ма́ма была́ на рабо́те. Сейча́с она́ е́дет домо́й ___.
    options: [с рабо́ты, из рабо́ты, на рабо́ту, на рабо́те]
    answer: с рабо́ты
  - stem: Мой брат был у врача́. Сейча́с он идёт домо́й ___.
    options: [из врача́, от врача́, к врачу́, у врача́]
    answer: от врача́
  - stem: — Прости́те, ___ пройти́ к метро́? — Иди́те пря́мо, пото́м нале́во.
    options: [где, куда́, когда́, как]
    answer: как
  - stem: Вчера́ сестра́ два часа́ ___ су́мку и наконе́ц купи́ла кра́сную.
    options: [выбира́ла, продава́ла, рисова́ла, чита́ла]
    answer: выбира́ла
  - stem: 'Же́нщина сказа́ла официа́нту: «Я ___ бы заказа́ть блины́».'
    options: [хоте́л, хочу́, хоте́ла, хо́чет]
    answer: хоте́ла
  - stem: — Ско́лько с меня́? — ___.
    options: [Два часа́, Девятьсо́т рубле́й, Пя́тое ма́я, Два́дцать лет]
    answer: Девятьсо́т рубле́й
  - stem: У меня́ есть друзья́, ___ живу́т в Петербу́рге.
    options: [кото́рые, кото́рый, кото́рая, кото́рое]
    answer: кото́рые
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок для ба́бушки**

    В суббо́ту я пое́хал на (1) []{.blank}. В воскресе́нье у мое́й ба́бушки день рожде́ния, и я хоте́л купи́ть ей пода́рок. Ба́бушка о́чень лю́бит (2) []{.blank}: у неё на ку́хне всегда́ стои́т ста́рый самова́р. Но он уже́ не (3) []{.blank}. «Куплю́ ей (4) []{.blank} самова́р!» — ду́мал я.

    На ры́нке я до́лго (5) []{.blank} самова́р. Наконе́ц я уви́дел его́. Самова́р был краси́вый, но о́чень (6) []{.blank}: он сто́ил девятьсо́т рубле́й, а у меня́ бы́ло (7) []{.blank} четы́реста. Я (8) []{.blank} продавцу́: «Э́то сли́шком до́рого для меня́». Продаве́ц отве́тил: «А ва́ша ба́бушка лю́бит (9) []{.blank}? Вот вишнёвое варе́нье, оно́ сто́ит две́сти рубле́й». Но ба́бушка не покупа́ет варе́нье: ка́ждое ле́то она́ (10) []{.blank} его́ на да́че. Тогда́ продаве́ц показа́л мне краси́вую бе́лую (11) []{.blank}. Она́ сто́ила (12) []{.blank} рубле́й, и я купи́л её.

    В воскресе́нье я пое́хал к ба́бушке на да́чу. Ба́бушка была́ о́чень (13) []{.blank}: «Кака́я краси́вая ча́шка! Спаси́бо!» Ве́чером мы пи́ли чай из (14) []{.blank} ча́шки, а ста́рый самова́р (15) []{.blank} на столе́, как всегда́. Я сказа́л: «Ба́бушка, я хоте́л купи́ть тебе́ но́вый самова́р, (16) []{.blank} он был о́чень дорого́й. В сле́дующем году́ я обяза́тельно (17) []{.blank} его́!» Ба́бушка (18) []{.blank}: «Не на́до! Э́тот самова́р мне подари́л (19) []{.blank} в день на́шей сва́дьбы. Я его́ о́чень (20) []{.blank}».
    :::
  passage_zh: |
    **送给奶奶的礼物**

    星期六我去了市场。星期天是我奶奶的生日，我想给她买件礼物。奶奶非常爱喝茶：她家厨房里总摆着一个旧茶炊。可是它已经不能用了。“我给她买个新茶炊！”我想。

    在市场上我找了很久茶炊。终于我看见了一个。茶炊很漂亮，可是很贵：要九百卢布，而我只有四百。我对售货员说：“这对我来说太贵了。”售货员回答：“您奶奶喜欢果酱吗？这是樱桃果酱，二百卢布。”可是奶奶从来不买果酱：每年夏天她都在别墅自己做。于是售货员给我看了一个漂亮的白杯子。它三百卢布，我就买下了。

    星期天我去别墅看奶奶。奶奶非常高兴：“多漂亮的杯子！谢谢！”晚上我们用新杯子喝茶，那个旧茶炊照旧摆在桌子上。我说：“奶奶，我本来想给你买个新茶炊，可是太贵了。明年我一定给你买！”奶奶笑了：“不用！这个茶炊是你爷爷在我们结婚那天送给我的。我非常喜欢它。”
  why: 第 1 空：第二段开头说 [На ры́нке я до́лго…]{.ru}，可见去的是市场 [ры́нок]{.ru}；火车站、体育场、滑冰场都买不到茶炊。第 2 空：后半句说她厨房里总摆着茶炊，下文又说一起 [пи́ли чай]{.ru}，奶奶爱的是茶 [чай]{.ru}；咖啡、牛奶、汤都不用茶炊。第 3 空：[Но]{.ru} 引出问题，下一句“我”想给她买新的，说明旧茶炊坏了、[не рабо́тает]{.ru}；[не понима́ет]{.ru}、[не игра́ет]{.ru}、[не отдыха́ет]{.ru} 说的都是人。第 4 空：旧的不能用，所以要买新的 [но́вый]{.ru}；[ста́рый]{.ru} 正是要换掉的，[плохо́й]{.ru}、[пусто́й]{.ru} 不会特意去买。第 5 空：后面 [Наконе́ц я уви́дел его́]{.ru}“终于看见了”，前面是在找：[иска́л]{.ru}；[продава́л]{.ru} 和买东西矛盾，[рисова́л]{.ru}、[стро́ил]{.ru} 与上下文无关。第 6 空：后面说要九百卢布而“我”只有四百，又说 [Э́то сли́шком до́рого]{.ru}，所以是 [дорого́й]{.ru}；[но]{.ru} 前面是优点“漂亮”，后面要接缺点，[лёгкий]{.ru}、[ма́ленький]{.ru} 不能解释买不起。第 7 空：四百比九百少得多，钱不够，用 [то́лько]{.ru}“只有”；[уже́]{.ru}、[ещё]{.ru}、[да́же]{.ru} 都表达不出“不够”的意思。第 8 空：后面是“我”说的话，用 [сказа́л]{.ru}；[позвони́л]{.ru} 是打电话，可“我”就在售货员面前，[помо́г]{.ru}、[подари́л]{.ru} 不能引出直接引语。第 9 空：售货员紧接着推荐的是 [вишнёвое варе́нье]{.ru}，他问的是奶奶喜不喜欢果酱；牛奶、肉、冰激凌都和下文接不上。第 10 空：奶奶不买果酱，原因是她每年夏天自己在别墅做：[гото́вит]{.ru}；[чита́ет]{.ru}、[и́щет]{.ru}、[рису́ет]{.ru} 都解释不了为什么不买。第 11 空：下文说 [Кака́я краси́вая ча́шка!]{.ru}，又说用新杯子喝茶，买的是杯子 [ча́шку]{.ru}；帽子、包、外套和茶也无关。第 12 空：“我”只有四百卢布，四个价钱里只有 [три́ста]{.ru} 买得起；五百、六百、九百都超过四百。第 13 空：奶奶收到礼物，接着称赞杯子漂亮、道谢，是高兴 [ра́да]{.ru}；[занята́]{.ru}、[свобо́дна]{.ru} 与上下文不符，[должна́]{.ru} 后面要接不定式。第 14 空：用的是刚送的新杯子 [но́вой]{.ru}；杯子是白的，[чёрной]{.ru} 不对，[пусто́й]{.ru} 杯子喝不了茶，[ста́рой]{.ru} 和“刚买的”矛盾。第 15 空：茶炊放在桌上用 [стоя́л]{.ru}，和第一段的 [стои́т ста́рый самова́р]{.ru} 一致；立着的器物不说 [лежа́л]{.ru}，[висе́л]{.ru}、[сиде́л]{.ru} 也不合适。第 16 空：想买和太贵是转折关系，用 [но]{.ru}；[и]{.ru}、[и́ли]{.ru}、[пото́м]{.ru} 都表达不出转折。第 17 空：今年钱不够没买成，答应明年一定买：[куплю́]{.ru}；[прода́м]{.ru} 意思相反，[сыгра́ю]{.ru}、[вы́учу]{.ru} 不能接 [самова́р]{.ru}。第 18 空：奶奶接着说的是 [Не на́до!]{.ru}，不是问句，用 [засмея́лась]{.ru}；[спроси́ла]{.ru} 后面应该是问题，[опозда́ла]{.ru}、[потеря́ла]{.ru} 不能引出直接引语。第 19 空：在“我们结婚那天”送茶炊的人只能是奶奶的丈夫，也就是“你的爷爷” [твой де́душка]{.ru}；“你的父亲”“你的哥哥”“你的朋友”那时候都还没有或不相干。第 20 空：奶奶说不用买新的，因为这个旧茶炊是珍贵的纪念，她“很爱”它：[люблю́]{.ru}；[продаю́]{.ru}、[ищу́]{.ru}、[покупа́ю]{.ru} 都和“不用买新的”的理由不符。
  items:
  - options: [вокза́л, стадио́н, като́к, ры́нок]
    answer: ры́нок
  - options: [ко́фе, чай, молоко́, суп]
