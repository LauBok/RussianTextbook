    [Па́па]{.sp} Ве́ра, в суббо́ту у ма́мы день рожде́ния. Что мы ей пода́рим?

    [Ве́ра]{.sp} Ма́ма давно́ хо́чет тёплый сви́тер. Зимо́й у неё на рабо́те хо́лодно.

    [Па́па]{.sp} Хоро́шая иде́я. Вот магази́н, пойдём!

    [Продаве́ц]{.sp} Здра́вствуйте! Что вы хоти́те посмотре́ть?

    [Па́па]{.sp} Здра́вствуйте! Покажи́те, пожа́луйста, сви́тер для мое́й жены́.

    [Продаве́ц]{.sp} Како́й разме́р?

    [Па́па]{.sp} Разме́р? Не зна́ю… Ве́ра, ты зна́ешь?

    [Ве́ра]{.sp} Коне́чно, зна́ю. Со́рок восьмо́й.

    [Продаве́ц]{.sp} Вот, пожа́луйста. Э́тот кра́сный сви́тер сто́ит ты́сячу три́ста рубле́й, се́рый — ты́сячу две́сти, а бе́лый — ты́сячу пятьсо́т.

    [Па́па]{.sp} Кра́сный о́чень краси́вый! Возьмём его́!

    [Ве́ра]{.sp} Па́па, ты забы́л: ма́ма не но́сит кра́сную оде́жду. А се́рый сви́тер у неё уже́ есть.

    [Па́па]{.sp} Пра́вда. Тогда́ мы возьмём бе́лый. Вот, пожа́луйста, де́ньги.

    [Продаве́ц]{.sp} Спаси́бо! А торт вы уже́ купи́ли? Ря́дом с на́ми есть бу́лочная, там о́чень вку́сные то́рты.

    [Ве́ра]{.sp} Спаси́бо, но торт нам не ну́жен. Па́па всегда́ гото́вит торт на день рожде́ния ма́мы. Ма́ма говори́т, что э́то лу́чший торт в Москве́.

    [Па́па]{.sp} Да. Ве́ра, в пя́тницу ве́чером ма́ма бу́дет на рабо́те. Ты мне помо́жешь?

    [Ве́ра]{.sp} Коне́чно, помогу́!
    :::
