lesson: K08
heading: 第八套
range: L01-L79
names: [Ве́ра, Серёжа, Ната́ша, Чжан Мин, Ко́стя, Ди́ма, Ко́ля, Смирно́в, Серге́й, Ни́на Петро́вна, Анто́н, Ли́за, Охо́тный Ряд, Каза́нский собо́р, Дворцо́вая пло́щадь, Дом кни́ги, Моско́вский вокза́л, Су́здаль, Влади́мир]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：对方问这路车去不去市中心，合适的回答是说明“不去”，并告诉他该坐哪一路：[Нет, вам ну́жен деся́тый]{.ru}；[Спаси́бо, не на́до]{.ru} 是谢绝别人的帮助，[Ничего́, не волну́йтесь]{.ru} 是回应道歉或安慰人，[С удово́льствием!]{.ru} 是接受邀请，都答非所问（第 55、67、75 课）。第 2 题：前面说没有狗，后面说有猫，前后对照，用表示转折的 [но]{.ru}；[и]{.ru} 不表示对照，[и́ли]{.ru} 是“或者”，[когда́]{.ru} 引出时间（第 13、14 课）。第 3 题：[Вот она́!]{.ru} 说明外套已经买到、就在眼前，说的是一次动作的结果，用完成体过去时 [купи́л]{.ru}；[покупа́л]{.ru} 只说做过“买”这件事或买的过程，不说明买到了没有，是只学了一半的人最容易选的；[покупа́ю]{.ru}、[куплю́]{.ru} 和 [Вчера́]{.ru} 的时间不合（第 45、76 课）。第 4 题：“在系里”用 [на]{.ru}：[на факульте́те]{.ru}，和 [на ку́рсе]{.ru}、[на уро́ке]{.ru} 一样；[в]{.ru} 用于 [в университе́те]{.ru}（第 11、12 课）。第 5 题：[сра́зу]{.ru} 说的是一下子吃完了两个，是一次的结果，用完成体过去时 [съел]{.ru}；[ел]{.ru} 说过程，不和 [сра́зу]{.ru} 连用；前面是 [хоте́л]{.ru}，说的是过去，不用 [ест]{.ru}、[съест]{.ru}（第 45 课）。第 6 题：问车什么时候来，回答“五分钟以后”，用 [че́рез]{.ru} + 第四格：[че́рез пять мину́т]{.ru}；[наза́д]{.ru} 是“以前”，而且放在时间词后面（[пять мину́т наза́д]{.ru}）；[в]{.ru} 用在钟点前（[в пять часо́в]{.ru}），[в пять мину́т]{.ru} 不能回答“什么时候来”；[по́сле]{.ru} 要求第二格，而且后面接事情（[по́сле уро́ка]{.ru}），不接一段时间（第 37、47 课）。第 7 题：回答说的是日期，问日期用 [Како́е сего́дня число́?]{.ru}；[Кото́рый час?]{.ru} 问钟点，[Ско́лько сто́ит?]{.ru} 问价钱，[Ско́лько тебе́ лет?]{.ru} 问年龄（第 28、39、49、53 课）。第 8 题：[Да, о́чень]{.ru} 是肯定的回答，后面要说喜欢的理由，只有 [краси́во]{.ru} 合适；[ску́чно]{.ru}、[пло́хо]{.ru}、[гру́стно]{.ru} 都是不喜欢的理由（第 58、63 课）。第 9 题：[трина́дцать]{.ru} 后面用 [лет]{.ru}；[го́да]{.ru} 用在 2–4 后面，[году́]{.ru} 是第六格 [в году́]{.ru} 的形式（第 53 课）。第 10 题：冬天冷，需要的是保暖的帽子 [ша́пка]{.ru}；[футбо́лка]{.ru} 是夏天穿的，[ру́чка]{.ru}、[кни́га]{.ru} 和冷不冷无关（第 55、69 课）。第 11 题：去不了电影院，原因是“我没空”：[занята́]{.ru}；[свобо́дна]{.ru} 意思相反，[ра́да]{.ru}、[здоро́ва]{.ru} 不能解释为什么不去（第 59 课）。第 12 题：“加牛奶的咖啡”用 [с]{.ru} + 第五格 [с молоко́м]{.ru}；[без]{.ru}、[из]{.ru}、[у]{.ru} 都要求第二格，不能接 [молоко́м]{.ru}（第 37、61 课）。第 13 题：后半句 [он стро́ит мосты́]{.ru} 说明他是工程师 [инжене́ром]{.ru}；医生、教师、售货员不造桥（第 64 课）。第 14 题：后面是第五格 [столо́м]{.ru}，四个前置词里只有 [под]{.ru} 表示处所时要求第五格；[на]{.ru}、[в]{.ru} 表处所要第六格，[у]{.ru} 要第二格（第 66 课）。第 15 题：“下雨”在俄语里说 [идёт дождь]{.ru}，用定向动词 [идти́]{.ru}，不用 [хо́дит]{.ru}，也不用乘车的 [е́дет]{.ru}、[е́здит]{.ru}（第 69 课）。第 16 题：问的是星期六去了哪儿，说的是去了一趟又回来，用不定向动词过去时 [ходи́ли]{.ru}；[шли]{.ru} 是“当时正在路上”，[хо́дим]{.ru}、[идём]{.ru} 是现在时（第 71 课）。第 17 题：[когда́]{.ru} 引出“正在路上”的背景，用定向动词 [шёл]{.ru}；[сего́дня у́тром]{.ru} 说的是过去，不用现在时（第 72 课）。第 18 题：[Его́ нет до́ма]{.ru} 说明爸爸已经出门、还没回来，用 [пое́хал]{.ru}；[е́здил]{.ru} 是去过、已经回来，和“不在家”矛盾；[пое́дет]{.ru} 说的是还没走（第 73 课）。第 19 题：[е́ду домо́й]{.ru} 说的是往家走，空里要说从哪儿来，回答 [отку́да]{.ru}；“在单位”是 [на рабо́те]{.ru}，对应的“从单位来”是 [с]{.ru} + 第二格 [с рабо́ты]{.ru}，不能说 [из рабо́ты]{.ru}；[на рабо́ту]{.ru} 是去单位，和 [домо́й]{.ru} 矛盾；[на рабо́те]{.ru} 回答 [где]{.ru}（第 74 课）。第 20 题：问 [Отку́да]{.ru}，从人那里来用 [от]{.ru} + 第二格：[от врача́]{.ru}；[из]{.ru} 不和表示人的词连用，[к врачу́]{.ru} 回答 [куда́]{.ru}，[у врача́]{.ru} 回答 [где]{.ru}。去人那里 [к]{.ru}、在人那里 [у]{.ru}、从人那里来 [от]{.ru}，三个要成套记（第 74 课）。第 21 题：回答是指路，问路说 [Как пройти́ к…?]{.ru}；[где]{.ru}、[куда́]{.ru}、[когда́]{.ru} 都不和 [пройти́ к…]{.ru} 搭配成问路的话（第 75 课）。第 22 题：两个小时都在挑，最后买了红的，挑选是 [выбира́ла]{.ru}；[продава́ла]{.ru}“卖”和后面的“买”矛盾，[рисова́ла]{.ru}、[чита́ла]{.ru} 不能接 [су́мку]{.ru}（第 77 课）。第 23 题：[бы]{.ru} 和动词过去时形式连用，说话人是女性 [же́нщина]{.ru}，用阴性 [хоте́ла]{.ru}；[хочу́ бы]{.ru} 不成话（第 77 课）。第 24 题：[три́ста]{.ru}、[пятьсо́т]{.ru}、[девятьсо́т]{.ru} 这类以零结尾的数词后面用复数第二格 [рубле́й]{.ru}；[рубля́]{.ru} 只用在 2、3、4 后，[рубль]{.ru} 用在 1 后，[рубля́х]{.ru} 是第六格（第 39、78 课）。第 25 题：[кото́рый]{.ru} 跟它所指的名词在性、数上一致。[кафе́]{.ru} 是不变格的外来词，属于中性，所以用 [кото́рое]{.ru}；动词 [нахо́дится]{.ru} 是单数，排除了 [кото́рые]{.ru}，但阳性、阴性、中性要靠自己记得 [кафе́]{.ru} 的性来判断（第 5、79 课）。
  items:
  - stem: — Скажи́те, пожа́луйста, э́тот авто́бус идёт в центр? — ___
    options: ['Спаси́бо, не на́до.', 'Нет, вам ну́жен деся́тый.', 'Ничего́, не волну́йтесь.', С удово́льствием!]
    answer: Нет, вам ну́жен деся́тый.
  - stem: — У тебя́ есть соба́ка? — Нет, ___ у меня́ есть ко́шка.
    options: [и, и́ли, но, когда́]
    answer: но
  - stem: Вчера́ я ___ в э́том магази́не но́вую ку́ртку. Вот она́!
    options: [покупа́л, купи́л, покупа́ю, куплю́]
    answer: купи́л
  - stem: Моя́ сестра́ у́чится ___ филологи́ческом факульте́те.
    options: [в, о, у, на]
    answer: на
  - stem: Ма́льчик о́чень хоте́л есть и сра́зу ___ два пирожка́.
    options: [съел, ел, ест, съест]
    answer: съел
  - stem: — Когда́ бу́дет авто́бус? — ___ пять мину́т.
    options: [наза́д, в, по́сле, че́рез]
    answer: че́рез
  - stem: — ___? — Сего́дня пе́рвое ноября́.
    options: [Кото́рый час, Ско́лько сто́ит, Како́е сего́дня число́, Ско́лько тебе́ лет]
    answer: Како́е сего́дня число́
  - stem: — Тебе́ нра́вится Москва́? — Да, о́чень. Здесь так ___!
    options: [ску́чно, краси́во, пло́хо, гру́стно]
    answer: краси́во
  - stem: Мое́й сестре́ уже́ трина́дцать ___.
    options: [год, лет, го́да, году́]
    answer: лет
  - stem: Зимо́й в Москве́ хо́лодно, и мне нужна́ тёплая ___.
    options: [футбо́лка, ру́чка, кни́га, ша́пка]
    answer: ша́пка
  - stem: — Пойдём ве́чером в кино́! — Извини́, сего́дня я не могу́, я ___.
    options: [свобо́дна, ра́да, занята́, здоро́ва]
    answer: занята́
  - stem: Я люблю́ ко́фе ___ молоко́м.
    options: [с, без, из, у]
    answer: с
  - stem: Мой оте́ц рабо́тает ___, он стро́ит мосты́.
    options: [врачо́м, учи́телем, продавцо́м, инжене́ром]
    answer: инжене́ром
  - stem: Ко́шка спит ___ столо́м.
    options: [под, на, в, у]
    answer: под
  - stem: Сейча́с ___ дождь, и де́ти не гуля́ют, а сидя́т до́ма.
    options: [хо́дит, е́дет, идёт, е́здит]
    answer: идёт
  - stem: — Где вы бы́ли в суббо́ту? — Мы ___ в музе́й.
    options: [шли, ходи́ли, хо́дим, идём]
    answer: ходи́ли
  - stem: Сего́дня у́тром, когда́ я ___ в университе́т, я уви́дел ста́рого дру́га.
    options: [ходи́л, идёт, шёл, хо́дит]
    answer: шёл
  - stem: — Где па́па? — Его́ нет до́ма, он ___ на рабо́ту.
    options: [е́здил, е́здит, пое́дет, пое́хал]
    answer: пое́хал
  - stem: — Ты где? — В авто́бусе, е́ду домо́й ___.
    options: [с рабо́ты, из рабо́ты, на рабо́ту, на рабо́те]
    answer: с рабо́ты
  - stem: — Отку́да ты идёшь? — ___. Он дал мне лека́рство.
    options: [Из врача́, От врача́, К врачу́, У врача́]
    answer: От врача́
  - stem: — Прости́те, ___ пройти́ к Большо́му теа́тру? — Иди́те пря́мо, пото́м нале́во.
    options: [где, куда́, когда́, как]
    answer: как
  - stem: Вчера́ сестра́ два часа́ ___ су́мку и наконе́ц купи́ла кра́сную.
    options: [выбира́ла, продава́ла, рисова́ла, чита́ла]
    answer: выбира́ла
  - stem: 'Же́нщина сказа́ла официа́нту: «Я ___ бы заказа́ть блины́».'
    options: [хоте́л, хочу́, хоте́ла, хо́чет]
    answer: хоте́ла
  - stem: — Ско́лько с меня́? — Три́ста ___.
    options: [рубль, рубля́, рубле́й, рубля́х]
    answer: рубле́й
  - stem: Мы обе́дали в кафе́, ___ нахо́дится ря́дом с музе́ем.
    options: [кото́рые, кото́рый, кото́рая, кото́рое]
    answer: кото́рое
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}

    **Ключ**

    Вчера́ я верну́лся с рабо́ты в во́семь (1) []{.blank}. У две́ри я откры́л су́мку — (2) []{.blank} не́ было. Тут я по́нял: у́тром я (3) []{.blank} его́ на столе́ в ку́хне.

    Я не волнова́лся: до́ма был мой (4) []{.blank} Ди́ма. Я позвони́л в дверь, пото́м ещё раз, но Ди́ма не (5) []{.blank}. Я позвони́л ему́ по телефо́ну — он не отвеча́л. «Наве́рное, он (6) []{.blank} к дру́гу», — ду́мал я.

    Тогда́ я позвони́л (7) []{.blank}. Она́ была́ у (8) []{.blank}. «Ключ? Да, мой ключ (9) []{.blank} меня́. Но я сего́дня бу́ду здесь, а домо́й (10) []{.blank} то́лько за́втра». Её ма́ма живёт (11) []{.blank}, на друго́м конце́ го́рода. Но что де́лать? Я пое́хал к ним.

    Я (12) []{.blank} туда́ це́лый час: на метро́, а пото́м на (13) []{.blank}. Жена́ (14) []{.blank} мне ключ, а её ма́ма сказа́ла: «Ты, наве́рное, хо́чешь (15) []{.blank}!» — и дала́ мне таре́лку (16) []{.blank}. Пото́м мы пи́ли чай, и домо́й я пое́хал то́лько в (17) []{.blank}.

    В оди́ннадцать я наконе́ц откры́л дверь. В коридо́ре стоя́л Ди́ма. «Па́па, где ты был? Я был до́ма, но (18) []{.blank} и не слы́шал телефо́н». — «Я (19) []{.blank} к ба́бушке. Вот, она́ дала́ (20) []{.blank} пирожки́».

    :::
  passage_zh: |
    **钥匙**

    昨天我八点下班回到家。在门口我打开包——钥匙不见了。我这才想起来：早上我把它落在厨房的桌子上了。

    我并不着急：儿子季马在家。我按了门铃，又按了一次，可季马没来开门。我给他打电话，他也不接。“大概是去朋友家了。”我想。

    于是我给妻子打电话。她在她妈妈家。“钥匙？对，我的钥匙在我这儿。可我今天住这儿，明天才回家。”她妈妈住得很远，在城市的另一头。可有什么办法呢？我就去了她们那儿。

    路上我坐了整整一个小时：先坐地铁，再坐公共汽车。妻子把钥匙给了我，她妈妈说：“你大概饿了吧！”说着给我盛了一盘红菜汤。后来我们又喝了茶，我十点才动身回家。

    十一点我终于打开了家门。季马站在走廊里。“爸爸，你去哪儿了？我在家，可我睡着了，没听见电话。”——“我去姥姥家了。喏，这是她给你的馅饼。”
  why: 第 1 空：[во́семь]{.ru} 是 5 以上的数，后面用复数第二格 [часо́в]{.ru}；[часа́]{.ru} 用在 2–4 后，[час]{.ru} 用在 1 后，[часы́]{.ru} 是“钟表”（第 28 课）。第 2 空：[не́ было]{.ru} 表示“没有”，后面的名词用第二格：[ключа́]{.ru}，重音落在词尾；照着主格写 [ключ]{.ru} 是最常见的错误（第 32 课）。第 3 空：钥匙不在包里，因为早上把它“落在”桌上了：[оста́вил]{.ru}；[взял]{.ru} 是“拿了”，拿了就该在包里，正好和上文相反；[купи́л]{.ru} 说不通；[потеря́л]{.ru} 是“丢了”，丢了的东西不会知道就在厨房桌上（第 45、78 课）。第 4 空：要读到最后一段：季马叫“我” [Па́па]{.ru}，所以是儿子 [сын]{.ru}；[брат]{.ru}、[оте́ц]{.ru}、[друг]{.ru} 都和这个称呼对不上（第 31 课）。第 5 空：按了门铃，季马却“没来开门”：[открыва́л]{.ru}；[закрыва́л]{.ru} 意思相反，[слу́шал]{.ru}、[звони́л]{.ru} 和按门铃的事接不上。这里用未完成体，说的是“一直没有开”（第 54 课）。第 6 空：“我”猜他不在家，是“去朋友那儿了，现在还在那儿”，用 [пошёл]{.ru}；[ходи́л]{.ru} 是去了又回来，回来了就该在家；[шёл]{.ru} 说的是当时正在路上，[идёт]{.ru} 是现在时，都不合“我想”的意思。后来才知道季马其实在家，这正是故事的转折（第 72、73 课）。第 7 空：[звони́ть]{.ru} 给谁打电话，用第三格：[жене́]{.ru}；[жену́]{.ru} 是第四格，是把 [звони́ть]{.ru} 当成及物动词的典型错误（第 51 课）。第 8 空：[у]{.ru} + 第二格表示“在某人那里”：[у ма́мы]{.ru}；[ма́ме]{.ru}（第三格）跟 [к]{.ru}，[ма́мой]{.ru}（第五格）跟 [с]{.ru}（第 74 课）。第 9 空：“钥匙在我这儿”说 [у меня́]{.ru}；[к]{.ru} 表示去向，[от]{.ru} 表示“从……来”，[с]{.ru} 要接第五格 [со мной]{.ru}，不能接 [меня́]{.ru}（第 31、74 课）。第 10 空：[за́втра]{.ru} 说的是将来的一次，说话人是妻子，主语是 [я]{.ru}，用完成体将来时 [верну́сь]{.ru}；[верну́лась]{.ru}、[верну́лся]{.ru} 是过去时，[возвраща́лась]{.ru} 是未完成体过去时，都和 [за́втра]{.ru} 不合（第 43、47 课）。第 11 空：后面紧接着说 [на друго́м конце́ го́рода]{.ru}，下一段又坐了一小时车，所以是 [далеко́]{.ru}；[бли́зко]{.ru}、[ря́дом]{.ru}、[здесь]{.ru} 都和“城市另一头”矛盾（第 14 课）。第 12 空：一次单方向的路程，说路上花了多久，用定向动词 [е́хал]{.ru}；[е́здил]{.ru} 说的是去了又回来，“去一趟花了一小时”不这么说；坐地铁和公共汽车不能用 [шёл]{.ru}、[ходи́л]{.ru}（第 71、72 课）。第 13 空：坐什么车用 [на]{.ru} + 第六格：[на авто́бусе]{.ru}；[на авто́бус]{.ru} 是“上车、赶车”的方向，[авто́бусом]{.ru} 不跟 [на]{.ru}（第 67 课）。第 14 空：妻子的钥匙到了“我”手里，是她“给了我”：[дала́]{.ru}；[взяла́]{.ru} 是“拿走”，方向正好相反；[купи́ла]{.ru}、[продала́]{.ru} 不合情理（第 44 课）。第 15 空：要看后半句：岳母接着给他盛了一盘红菜汤，所以是“你饿了”：[хо́чешь есть]{.ru}；[пить]{.ru} 后面应该端茶水，[спать]{.ru}、[гуля́ть]{.ru} 和红菜汤接不上（第 26 课）。第 16 空：[таре́лка]{.ru}“一盘”后面的内容用第二格：[таре́лку борща́]{.ru}，重音在词尾；[борщ]{.ru} 是主格，[борщо́м]{.ru}、[борще́]{.ru} 是第五格、第六格（第 33、61 课）。第 17 空：要把全文的时间连起来算：“我”八点到家门口，路上一小时，到岳母家大约九点，又喝汤喝茶；十一点到家，回程也是一小时，所以是十点动身：[де́сять]{.ru}；[де́вять]{.ru} 时刚到，[оди́ннадцать]{.ru} 已经到家了，[двена́дцать]{.ru} 比到家还晚（第 28、47 课）。第 18 空：季马解释为什么没开门、没接电话，又说自己 [был до́ма]{.ru}，只能是睡着了：[спал]{.ru}；[гуля́л]{.ru}、[был в шко́ле]{.ru}、[е́здил к дру́гу]{.ru} 都说明他不在家，和 [Я был до́ма]{.ru} 矛盾（第 7 课）。第 19 空：回答“你去哪儿了”，人已经回来了，说的是去过一趟，用 [е́здил]{.ru}；坐了一小时车，不能用步行的 [ходи́л]{.ru}；[пое́хал]{.ru} 说的是“出发去了、人还在那边”，[е́ду]{.ru} 是现在时（第 71、73 课）。第 20 空：[дала́]{.ru} 给谁，用第三格：[тебе́]{.ru}；[тебя́]{.ru} 是第二、四格，[тобо́й]{.ru} 是第五格（第 52 课）。
  items:
  - options: [час, часа́, часо́в, часы́]
    answer: часо́в
  - options: [ключ, ключа́, ключо́м, ключе́]
    answer: ключа́
  - options: [взял, купи́л, оста́вил, потеря́л]
    answer: оста́вил
  - options: [брат, оте́ц, друг, сын]
    answer: сын
  - options: [открыва́л, закрыва́л, слу́шал, звони́л]
    answer: открыва́л
  - options: [ходи́л, пошёл, шёл, идёт]
    answer: пошёл
  - options: [жену́, жено́й, жене́, жены́]
    answer: жене́
  - options: [ма́ме, ма́мы, ма́му, ма́мой]
    answer: ма́мы
  - options: [к, от, с, у]
    answer: у
  - options: [верну́лась, верну́лся, возвраща́лась, верну́сь]
    answer: верну́сь
  - options: [далеко́, бли́зко, ря́дом, здесь]
    answer: далеко́
  - options: [е́здил, е́хал, шёл, ходи́л]
    answer: е́хал
  - options: [авто́бус, авто́бусом, авто́бусе, авто́буса]
    answer: авто́бусе
  - options: [взяла́, купи́ла, продала́, дала́]
    answer: дала́
  - options: [пить, есть, спать, гуля́ть]
    answer: есть
  - options: [борщ, борщо́м, борще́, борща́]
    answer: борща́
  - options: [де́вять, оди́ннадцать, де́сять, двена́дцать]
    answer: де́сять
  - options: [гуля́л, был в шко́ле, спал, е́здил к дру́гу]
    answer: спал
  - options: [е́здил, пое́хал, ходи́л, е́ду]
    answer: е́здил
  - options: [тебя́, тебе́, ты, тобо́й]
    answer: тебе́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}

    Вчера́ у́тром я е́хал на рабо́ту в метро́. Напро́тив меня́ сиде́л мужчи́на в се́рой ку́ртке. Я посмотре́л на него́ ещё раз — ну коне́чно, э́то Ко́ля Смирно́в! Мы де́сять лет учи́лись в одно́м кла́ссе.

    Я сел ря́дом с ним: «Ко́ля, приве́т! Ты меня́ по́мнишь? Я Ди́ма!» Он посмотре́л на меня́ и сказа́л: «Ди́ма? Ну коне́чно!»

    Мы е́хали вме́сте пять ста́нций. Я расска́зывал о на́шем кла́ссе, о футбо́ле по́сле уро́ков, о на́шей учи́тельнице Ни́не Петро́вне. Он слу́шал, смея́лся и иногда́ спра́шивал: «А что бы́ло пото́м?»

    Пото́м он встал: «Ну, вот моя́ ста́нция. Спаси́бо, бы́ло о́чень интере́сно. То́лько я не Ко́ля. Меня́ зову́т Серге́й, и в шко́ле я учи́лся в Каза́ни». — «А почему́ вы сра́зу не сказа́ли?» — спроси́л я. «Вы так хорошо́ расска́зывали!»

    По́езд пое́хал да́льше, а я посмотре́л в окно́. Моя́ ста́нция была́ уже́ три ста́нции наза́д.

    :::
  passage_zh: |
    昨天早上我坐地铁去上班。我对面坐着一个穿灰色夹克的男人。我又看了他一眼——没错，这是科利亚·斯米尔诺夫！我们在一个班上了十年学。

    我坐到他旁边：“科利亚，你好！你还记得我吗？我是季马！”他看看我，说：“季马？当然记得！”

    我们一起坐了五站。我讲我们班的事，讲下课后踢足球，讲我们的老师尼娜·彼得罗夫娜。他听着，笑着，有时还问：“后来呢？”

    后来他站起来：“好了，我到站了。谢谢，真有意思。不过我不是科利亚。我叫谢尔盖，我是在喀山上的中学。”——“那您怎么不早说？”我问。“您讲得太好了！”

    列车继续往前开，我往窗外一看：我那一站已经过了三站了。
  why: 第 1 题，推断题：“我”认出了老同学，才坐到他旁边打招呼：[э́то Ко́ля Смирно́в! Мы де́сять лет учи́лись в одно́м кла́ссе]{.ru}；文中没有说那里有空座、他想坐窗边或要问路。第 2 题，推断题：那人自己说 [я не Ко́ля]{.ru}，[в шко́ле я учи́лся в Каза́ни]{.ru}，可见他和“我”并不是同学，以前不认识“我”；他说 [Ну коне́чно!]{.ru} 只是客气；他认识尼娜·彼得罗夫娜、要去喀山，文中都没有。第 3 题，人物意图：他自己回答 [Вы так хорошо́ расска́зывали!]{.ru}，是听得有意思，不想打断；“他以为‘我’是他的朋友季马”是把“我”的想法安到了他头上，不是他的；他听懂了“我”的话，也没有生气。第 4 题，主旨题：全文讲的是“我”在地铁里认错了人，和一个陌生人聊了一路；好笑之处在于“我”对着一个根本不认识自己的人讲了一路中学往事；“在地铁里遇到老朋友”正是“我”当时的误会，不是事实；文中没有说迟到；“谢尔盖在喀山上学”只是一个细节，本身并不好笑。第 5 题，推断题：[Моя́ ста́нция была́ уже́ три ста́нции наза́д]{.ru}——“我”聊得忘了下车，已经坐过了三站，接下来只能往回坐；文中没有说他跟谢尔盖走，也没有说要给真正的科利亚打电话。
  items:
  - stem: 'Ди́ма сел ря́дом с мужчи́ной: ___.'
    options: [там бы́ло свобо́дное ме́сто, 'он ду́мал: э́то его́ ста́рый друг Ко́ля', он хоте́л сиде́ть у окна́, он хоте́л спроси́ть доро́гу]
    answer: 'он ду́мал: э́то его́ ста́рый друг Ко́ля'
  - stem: Мужчи́на в се́рой ку́ртке ___.
    options: [учи́лся с Ди́мой в одно́м кла́ссе, ра́ньше не знал Ди́му, знал учи́тельницу Ни́ну Петро́вну, е́хал в Каза́нь]
    answer: ра́ньше не знал Ди́му
  - stem: 'Мужчи́на не сказа́л сра́зу «Я не Ко́ля»: ___.'
    options: [ему́ бы́ло интере́сно слу́шать, 'он ду́мал: э́то его́ друг Ди́ма', он пло́хо понима́л по-ру́сски, он не хоте́л говори́ть с Ди́мой]
    answer: ему́ бы́ло интере́сно слу́шать
  - stem: 'Э́тот расска́з смешно́й: ___.'
    options: [Ди́ма встре́тился в метро́ со ста́рым дру́гом, 'Ди́ма до́лго расска́зывал о шко́ле челове́ку, кото́рый его́ не знал', Ди́ма опозда́л на рабо́ту, Серге́й учи́лся в шко́ле в Каза́ни]
    answer: 'Ди́ма до́лго расска́зывал о шко́ле челове́ку, кото́рый его́ не знал'
  - stem: Пото́м Ди́ма, наве́рное, ___.
    options: [пое́хал наза́д, пошёл с Серге́ем, позвони́л Ко́ле Смирно́ву, пое́хал в Каза́нь]
    answer: пое́хал наза́д
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}

    [Серёжа]{.sp} Алло́, Ната́ша! Ты где? Мы уже́ все в кафе́, ждём то́лько тебя́.

    [Ната́ша]{.sp} Я у метро́, но кафе́ не ви́жу. Ты сказа́л: оно́ ря́дом с кни́жным магази́ном. А здесь то́лько апте́ка и шко́ла.

    [Серёжа]{.sp} А что напро́тив, на друго́й стороне́ у́лицы?

    [Ната́ша]{.sp} Напро́тив теа́тр, большо́й, бе́лый.

    [Серёжа]{.sp} Ну вот. Кафе́ там, ря́дом с теа́тром. Ты не на той стороне́.

    [Ната́ша]{.sp} Ря́дом с теа́тром? Там я ви́жу то́лько кни́жный магази́н.

    [Серёжа]{.sp} Пра́вильно. А кафе́ сра́зу за магази́ном, там си́няя дверь.

    [Ната́ша]{.sp} Ви́жу! Сейча́с иду́.

    [Серёжа]{.sp} Стой, здесь не иди́, тут маши́ны е́дут бы́стро. Иди́ нале́во, к светофо́ру на углу́. Там пройдёшь на другу́ю сто́рону.

    [Ната́ша]{.sp} Хорошо́… Так, я у светофо́ра. Иду́… Вот теа́тр, вот кни́жный магази́н, вот си́няя дверь. Ой, а я тебя́ ви́жу! Ты сиди́шь у окна́?

    [Серёжа]{.sp} Да, вот я! Иди́ к нам!

    :::
  passage_zh: |
    ::: translation

    [谢廖沙]{.sp} 喂，娜塔莎！你在哪儿？我们都到咖啡馆了，就等你了。

    [娜塔莎]{.sp} 我在地铁站这儿，可是看不见咖啡馆。你说过它在书店旁边，可这儿只有一家药店和一所学校。

    [谢廖沙]{.sp} 那对面，街那边有什么？

    [娜塔莎]{.sp} 对面是剧院，很大，白色的。

    [谢廖沙]{.sp} 这就对了。咖啡馆在那边，剧院旁边。你在街的另一边呢。

    [娜塔莎]{.sp} 剧院旁边？那儿我只看见一家书店。

    [谢廖沙]{.sp} 对。咖啡馆就在书店后面，有一扇蓝色的门。

    [娜塔莎]{.sp} 看见了！我这就过去。

    [谢廖沙]{.sp} 站住，别从这儿过，这里车开得快。往左走，到拐角的红绿灯那儿，从那儿过马路。

    [娜塔莎]{.sp} 好……行，我到红绿灯了。走了……剧院到了，书店到了，蓝门也到了。哎，我看见你了！你坐在窗边吗？

    [谢廖沙]{.sp} 对，我在这儿！快进来吧！

    :::
  glossary:
  - {ru: сторона́, pos: f, zh: 一边，一侧}
  why: 第 1 题，谢廖沙一开头就说 [Мы уже́ все в кафе́, ждём то́лько тебя́]{.ru}：大家都到了，就等她；站在地铁口的是娜塔莎，不是谢廖沙；谢廖沙知道咖啡馆在哪儿；剧院只是认路的标志。第 2 题，谢廖沙听她说完周围有什么，判断 [Ты не на той стороне́]{.ru}：她就在附近，只是站在街的另一边；她没有走错地铁站，咖啡馆也在营业；咖啡馆在剧院旁边，不在药店旁边。第 3 题，推断题：谢廖沙说咖啡馆 [ря́дом с теа́тром]{.ru}，娜塔莎说剧院旁边 [я ви́жу то́лько кни́жный магази́н]{.ru}，两句连起来，书店就在剧院旁边；药店在娜塔莎这一边；“剧院对面”是娜塔莎站的地方；拐角的是红绿灯。第 4 题，谢廖沙让她 [Иди́ нале́во, к светофо́ру на углу́. Там пройдёшь на другу́ю сто́рону]{.ru}；直接穿过街正是他不让的（[здесь не иди́]{.ru}），她也没有再坐地铁。第 5 题，推断题：最后娜塔莎说 [вот си́няя дверь]{.ru}，又说看见了坐在窗边的谢廖沙：她已经走到咖啡馆的蓝门口；坐在窗边的是谢廖沙，她还没进去。
  items:
  - stem: 'Серёжа звони́т Ната́ше: ___.'
    options: [он стои́т у метро́ и не ви́дит кафе́, все уже́ в кафе́ и ждут её, он не зна́ет а́дрес кафе́, он хо́чет пойти́ в теа́тр]
    answer: все уже́ в кафе́ и ждут её
