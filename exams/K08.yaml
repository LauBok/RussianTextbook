    ::: {.prose lang="ru"}

    **Анто́н**

    Здра́вствуйте! В воскресе́нье я впервы́е е́ду в Петербу́рг. У меня́ там то́лько оди́н день: в семь утра́ мой по́езд бу́дет на Моско́вском вокза́ле, а в де́сять ве́чера я е́ду домо́й. Я о́чень хочу́ в Эрмита́ж. Как туда́ лу́чше е́хать: на метро́ и́ли на авто́бусе? И что ещё мо́жно посмотре́ть?

    **Ли́за**

    Анто́н, е́хать вам не на́до: от вокза́ла до Эрмита́жа мо́жно идти́ пешко́м. Иди́те пря́мо по Не́вскому проспе́кту, э́то приме́рно со́рок пять мину́т. По доро́ге вы уви́дите Каза́нский собо́р и Дом кни́ги. Но в семь утра́ Эрмита́ж ещё не рабо́тает: в воскресе́нье он открыва́ется в 10.30. Так что у́тром не спеши́те, гуля́йте по це́нтру и за́втракайте в кафе́ на Не́вском.

    В Эрмита́же о́чень мно́го карти́н, за оди́н день всё посмотре́ть нельзя́. Выбери́те два и́ли три худо́жника, кото́рые вам нра́вятся. В шесть Эрмита́ж закрыва́ется. Пото́м иди́те на Дворцо́вую пло́щадь: она́ ря́дом, и ве́чером там о́чень краси́во. А на вокза́л поезжа́йте на метро́: по́сле Эрмита́жа идти́ пешко́м уже́ тру́дно.

    :::
  passage_zh: |
    **安东**

    你们好！星期天我第一次去彼得堡。我在那儿只有一天：早上七点火车到莫斯科站，晚上十点我就坐车回家。我很想去艾尔米塔什。去那儿坐地铁好还是坐公共汽车好？另外还有什么可以看看的？

    **丽莎**

    安东，您不用坐车：从火车站到艾尔米塔什可以走着去。顺着涅瓦大街一直走，大约四十五分钟。路上您会看到喀山大教堂和书之家。不过早上七点艾尔米塔什还没开门：星期天它十点半开门。所以早上别着急，在市中心逛逛，在涅瓦大街上找家咖啡馆吃早饭。

    艾尔米塔什的画特别多，一天是看不完的。挑两三位您喜欢的画家看。六点艾尔米塔什闭馆。然后去宫殿广场：它就在旁边，晚上那里很美。回火车站就坐地铁吧：逛完艾尔米塔什再走回去就太累了。

  why: 第 1 题，安东问的是 [Как туда́ лу́чше е́хать]{.ru} 和 [что ещё мо́жно посмотре́ть]{.ru}；艾尔米塔什几点开门是丽莎主动提醒的，安东没有问；他没有问买票和吃早饭的事。第 2 题，推断题：早上七点到，晚上十点走，一共 [пятна́дцать часо́в]{.ru}；[де́сять]{.ru}、[семь]{.ru} 是文中出现的钟点，不是时长。第 3 题，人物意图：丽莎先说 [в семь утра́ Эрмита́ж ещё не рабо́тает]{.ru}，然后才说 [Так что у́тром не спеши́те]{.ru}：她让安东上午逛街，是因为博物馆十点半才开门；她没有说星期天不能进，也没有说地铁人多；“早上涅瓦大街很美”文中没有这句话，丽莎说美的是晚上的宫殿广场。第 4 题，推断题：从火车站沿涅瓦大街走到艾尔米塔什，[По доро́ге]{.ru} 会看到喀山大教堂，可见教堂在这条路上、在火车站和艾尔米塔什之间；宫殿广场是丽莎让他晚上去的地方。第 5 题，丽莎说 [на вокза́л поезжа́йте на метро́]{.ru}；走着去是早上从火车站去艾尔米塔什的路，不是回程；文中没有提出租车和公共汽车（公共汽车是安东问的）。
  items:
  - stem: Что спра́шивает Анто́н?
    options: ['«Когда́ открыва́ется Эрмита́ж?»', '«Где мо́жно за́втракать?»', '«Как е́хать в Эрмита́ж и что ещё посмотре́ть?»', '«Где купи́ть биле́т на по́езд?»']
    answer: '«Как е́хать в Эрмита́ж и что ещё посмотре́ть?»'
  - stem: Анто́н бу́дет в Петербу́рге ___ часо́в.
    options: [де́сять, семь, пятна́дцать, со́рок пять]
    answer: пятна́дцать
  - stem: 'Ли́за сове́тует у́тром гуля́ть по це́нтру: ___.'
    options: [в воскресе́нье в Эрмита́ж нельзя́, у́тром Эрмита́ж ещё не рабо́тает, у́тром в метро́ мно́го люде́й, у́тром на Не́вском о́чень краси́во]
    answer: у́тром Эрмита́ж ещё не рабо́тает
  - stem: Каза́нский собо́р нахо́дится ___.
    options: [ме́жду вокза́лом и Эрмита́жем, ря́дом с Дворцо́вой пло́щадью, далеко́ от Не́вского проспе́кта, за Эрмита́жем]
    answer: ме́жду вокза́лом и Эрмита́жем
  - stem: На вокза́л Ли́за сове́тует ___.
    options: [идти́ пешко́м по Не́вскому, е́хать на авто́бусе, е́хать на метро́, е́хать на такси́]
    answer: е́хать на метро́
- id: e7
  type: fill
  task: 语法填空：阅读下面的明信片，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}

    Ве́ра, приве́т!

    Пишу́ тебе́ из (1) []{.blank} (Су́здаль). Мы с (2) []{.blank} (Серёжа) здесь уже́ три (3) []{.blank} (день), и нам о́чень нра́вится. Го́род ма́ленький, ти́хий, везде́ ста́рые це́ркви. Вчера́ мы (4) []{.blank} (е́хать / е́здить) на авто́бусе во Влади́мир, а сего́дня це́лый день гуля́ли по (5) []{.blank} (центр). Ря́дом с (6) []{.blank} (гла́вная пло́щадь) есть ры́нок. Там я купи́ла тебе́ мёд у (7) []{.blank} (оди́н немолодо́й мужчи́на), (8) []{.blank} (кото́рый) рабо́тает на ры́нке уже́ со́рок лет. Мёд о́чень вку́сный, а сто́ил то́лько две́сти (9) []{.blank} (рубль)! В суббо́ту мы (10) []{.blank} (пое́хать) домо́й. Позвони́ мне в воскресе́нье!

    Ната́ша

    :::
  passage_zh: |
    薇拉，你好！

    我在苏兹达尔给你写信。我和谢廖沙到这儿已经三天了，我们很喜欢这里。城不大，很安静，到处是古老的教堂。昨天我们坐公共汽车去了一趟弗拉基米尔，今天在市中心逛了一整天。中心广场旁边有个市场。我在那儿从一位上了年纪的男人手里给你买了蜂蜜，他在市场上已经干了四十年了。蜂蜜很好吃，才两百卢布！星期六我们就回家。星期天给我打电话吧！

    娜塔莎
  why: 第 1 空：[из]{.ru} 要求第二格，[Су́здаль]{.ru} 是以 [-ь]{.ru} 结尾的阳性名词，第二格 [Су́здаля]{.ru}；当成阴性写 [Су́здали]{.ru} 是常见错误（第 36、74 课）。第 2 空：[мы с]{.ru} + 第五格表示“我和某人”：[с Серёжей]{.ru}；[ж]{.ru} 后不带重音的词尾写 [-ей]{.ru}，不写 [-ой]{.ru}（第 62 课）。第 3 空：[три]{.ru} 后用单数第二格：[дня]{.ru}，注意词干里的 [е]{.ru} 脱落（第 35 课）。第 4 空：去了一趟又回到了苏兹达尔，说的是往返，用不定向动词过去时 [е́здили]{.ru}；[е́хали]{.ru} 只说“当时在去的路上”，这里没有别的动作需要它做背景（第 71 课）。第 5 空：[гуля́ть по]{.ru} + 第三格：[по це́нтру]{.ru}；[по]{.ru} 在这里不接第六格（第 57、72 课）。第 6 空：[ря́дом с]{.ru} + 第五格；[пло́щадь]{.ru} 是阴性，第五格 [пло́щадью]{.ru}，形容词阴性第五格 [гла́вной]{.ru}（第 65、66 课）。第 7 空：[у]{.ru} + 第二格；[мужчи́на]{.ru} 虽然以 [-а]{.ru} 结尾，却是阳性名词，名词按 [-а]{.ru} 变成 [мужчи́ны]{.ru}，修饰它的词却要用阳性：[одного́ немолодо́го мужчи́ны]{.ru}；写成 [одно́й немолодо́й]{.ru} 是只看词尾的错误（第 34、75 课）。第 8 空：[кото́рый]{.ru} 跟所指的 [мужчи́на]{.ru} 在性、数上一致，用阳性 [кото́рый]{.ru}；它在从句里是主语，用第一格，不跟着前面的第二格变（第 79 课）。第 9 空：[две́сти]{.ru} 这类以零结尾的数词后面用复数第二格 [рубле́й]{.ru}；看到“二”就用 [рубля́]{.ru} 是常见错误，[рубля́]{.ru} 只用在 [два, три, четы́ре]{.ru} 本身之后（第 39、78 课）。第 10 空：[В суббо́ту]{.ru} 指将来，坐车回家是一次的动作，用 [пое́хать]{.ru} 的将来时，主语 [мы]{.ru}：[пое́дем]{.ru}（第 73 课）。
  items:
  - accept: [Су́здаля]
  - accept: [Серёжей]
  - accept: [дня]
  - accept: [е́здили]
  - accept: [це́нтру]
  - accept: [гла́вной пло́щадью]
  - accept: [одного́ немолодо́го мужчи́ны]
  - accept: [кото́рый]
  - accept: [рубле́й]
  - accept: [пое́дем]
