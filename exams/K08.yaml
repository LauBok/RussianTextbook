    ::: {.prose lang="ru"}
    **Третьяко́вская галере́я**

    Третьяко́вская галере́я — большо́й музе́й в Москве́. Здесь мо́жно уви́деть ру́сские карти́ны: ста́рые ико́ны, портре́ты и пейза́жи. Галере́я нахо́дится недалеко́ от Кремля́, на ти́хой ста́рой у́лице. Ря́дом есть ста́нция метро́ «Третьяко́вская».

    Ра́ньше в э́том до́ме жил оди́н москви́ч. Его́ фами́лия дала́ галере́е и́мя. Он о́чень люби́л ру́сские карти́ны и до́лго покупа́л их. Пото́м он подари́л дом и карти́ны Москве́. Так дом стал музе́ем. Зда́ние галере́и о́чень необы́чное: оно́ кра́сное и бе́лое, как стари́нный ру́сский дом.

    В галере́ю ча́сто хо́дят шко́льники. Учи́тель расска́зывает им исто́рию ка́ждой карти́ны. Мно́гие лю́ди лю́бят карти́ну «У́тро в сосно́вом лесу́». На ней у́тро, лес и медве́ди. Пе́ред э́той карти́ной всегда́ стоя́т лю́ди. В галере́е рабо́тают экскурсово́ды. Они́ расска́зывают исто́рию музе́я по-ру́сски и по-англи́йски. Экску́рсия продолжа́ется два часа́.

    Галере́я рабо́тает со вто́рника до воскресе́нья, а в понеде́льник у неё выходно́й. Обы́чно галере́я закрыва́ется в шесть часо́в ве́чера, а в четве́рг — в де́вять. Ве́чером в галере́е ти́хо, и мо́жно до́лго стоя́ть пе́ред карти́ной. Ря́дом с галере́ей есть кафе́. Там мо́жно отдыха́ть и пить чай.
    :::
  passage_zh: |
    **特列季亚科夫画廊**

    特列季亚科夫画廊是莫斯科的一座大博物馆。在这里可以看到俄罗斯的画：古老的圣像画、肖像画和风景画。画廊离克里姆林宫不远，在一条安静的老街上。旁边有地铁站“特列季亚科夫站”。

    以前这座房子里住着一个莫斯科人。画廊就是用他的姓命名的。他非常喜欢俄罗斯的画，长期购买。后来他把房子和画送给了莫斯科。这座房子就这样成了博物馆。画廊的建筑很特别：红白两色，像一座古老的俄罗斯房子。

    中小学生常常到画廊来。老师给他们讲每一幅画的来历。很多人喜欢《松林的早晨》这幅画。画上是早晨、森林和熊。这幅画前面总是站着人。画廊里有讲解员，他们用俄语和英语讲博物馆的历史。一次讲解两个小时。

    画廊从星期二到星期天开放，星期一休息。画廊一般晚上六点关门，星期四九点关门。晚上画廊里很安静，可以在一幅画前站很久。画廊旁边有一家咖啡馆，可以在那里休息、喝茶。
  why: 第 1 题，[Галере́я нахо́дится недалеко́ от Кремля́]{.ru}。第 2 题，[Ра́ньше в э́том до́ме жил оди́н москви́ч]{.ru}，画廊就是用他的姓命名的。第 3 题，推断题：平时六点关门，只有星期四开到九点，所以晚上八点只有星期四能去；星期一休息。第 4 题，与原文不符的说法：原文说这个莫斯科人 [покупа́л]{.ru} 画，又把画 [подари́л]{.ru} 给莫斯科，没有卖画；其他三项原文都说了。第 5 题，主旨题：全文介绍画廊的位置、来历、藏画和开放时间；这位收藏者和《松林的早晨》只是其中一段的内容。
  items:
  - stem: Галере́я нахо́дится ___.
    options: [на Не́вском проспе́кте, недалеко́ от Кремля́, ря́дом с университе́том, в Петербу́рге]
    answer: недалеко́ от Кремля́
  - stem: Ра́ньше в зда́нии галере́и ___.
    options: [жил оди́н москви́ч, рабо́тала шко́ла, была́ ста́нция метро́, был рестора́н]
    answer: жил оди́н москви́ч
  - stem: Пойти́ в галере́ю ве́чером в во́семь часо́в мо́жно ___.
    options: [то́лько в понеде́льник, ка́ждый день, то́лько в четве́рг, в суббо́ту и в воскресе́нье]
    answer: то́лько в четве́рг
  - stem: 'Э́то не так: ___.'
    options: [москви́ч покупа́л карти́ны, москви́ч подари́л дом Москве́, в галере́е есть ико́ны, москви́ч продава́л карти́ны]
    answer: москви́ч продава́л карти́ны
  - stem: Э́та статья́ о ___.
    options: [ста́нции метро́, Третьяко́вской галере́е, карти́не «У́тро в сосно́вом лесу́», Кремле́]
    answer: Третьяко́вской галере́е
- id: e7
  type: fill
  task: 语法填空：阅读短文，用括号里词的适当形式填空。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Суббо́та**

    В суббо́ту мы с (1) []{.blank} (Ми́ша) ходи́ли в Третьяко́вскую галере́ю. Туда́ мы (2) []{.blank} (е́хать) на метро́, а домо́й шли пешко́м. Когда́ мы шли ми́мо (3) []{.blank} (большо́й магази́н), Ми́ша уви́дел (4) []{.blank} (наш сосе́д). Сосе́д спроси́л: «Отку́да вы идёте?» Мы отве́тили: «Из (5) []{.blank} (галере́я)».

    Ве́чером па́па (6) []{.blank} (верну́ться) с да́чи. Ми́ша до́лго расска́зывал (7) []{.blank} (он) о галере́е. Па́па сказа́л: «Я то́же давно́ хочу́ туда́! В сле́дующую суббо́ту мы (8) []{.blank} (пойти́) туда́ вме́сте». А ма́ма отве́тила: «А я (9) []{.blank} (хоте́ть) бы пое́хать на да́чу. Там сейча́с о́чень краси́во. Ты пое́дешь со (10) []{.blank} (я)?»
    :::
  passage_zh: |
    **星期六**

    星期六我和米沙去了特列季亚科夫画廊。我们坐地铁去，走着回家。我们经过一家大商店的时候，米沙看见了我们的邻居。邻居问：“你们从哪儿来？”我们回答：“从画廊来。”

    晚上爸爸从别墅回来了。米沙给他讲了很久画廊的事。爸爸说：“我也早就想去那儿了！下个星期六我们一起去。”妈妈却回答：“我倒想去别墅。那儿现在很美。你跟我一起去吗？”
  why: 第 1 空：[мы с]{.ru} + 第五格，[Ми́ша]{.ru} 按阴性名词的词尾变：[с Ми́шей]{.ru}；[ш]{.ru} 后面不重读写 [-ей]{.ru}（第 62 课）。第 2 空：后面说 [а домо́й шли пешко́м]{.ru}，两句都说路上的过程，用定向动词过去时，主语 [мы]{.ru}：[е́хали]{.ru}；写成 [пое́хали]{.ru}（坐地铁出发去）也对（第 71、73 课）。第 3 空：[ми́мо]{.ru} 要求第二格，阳性形容词第二格 [-ого]{.ru}：[большо́го магази́на]{.ru}（第 34、72 课）。第 4 空：[уви́деть]{.ru} 后面用第四格，[сосе́д]{.ru} 是动物名词，第四格同第二格：[на́шего сосе́да]{.ru}（第 22、34 课）。第 5 空：[из]{.ru} 要求第二格，[галере́я]{.ru} 的第二格是 [галере́и]{.ru}（第 36、74 课）。第 6 空：说的是回来这一次的结果，完成体过去时，主语 [па́па]{.ru} 是男性：[верну́лся]{.ru}；不要因为 [па́па]{.ru} 以 [-а]{.ru} 结尾写成阴性（第 47 课）。第 7 空：[расска́зывать]{.ru} 讲给谁听用第三格 [ему́]{.ru}（第 51、52 课）。第 8 空：将来的一次出行用 [пойти́]{.ru}，主语 [мы]{.ru}：[пойдём]{.ru}（第 73 课）。第 9 空：[бы]{.ru} + 过去时形式表示委婉的愿望，说话人是妈妈，用 [хоте́ла]{.ru}（第 77 课）。第 10 空：[с]{.ru} 要求第五格，[я]{.ru} 的第五格是 [мной]{.ru}，前置词写成 [со]{.ru}（第 62 课）。
  items:
  - accept: [Ми́шей]
  - accept: [е́хали, пое́хали]
  - accept: [большо́го магази́на]
  - accept: [на́шего сосе́да]
  - accept: [галере́и]
  - accept: [верну́лся]
  - accept: [ему́]
  - accept: [пойдём]
  - accept: [хоте́ла]
  - accept: [мной]
- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: 你是王磊。这个星期六你想去特列季亚科夫画廊，给皮埃尔写一张便条，40–60 词。要点：1. 星期六你打算去特列季亚科夫画廊；2. 问他想不想一起去；3. 怎么去：坐地铁到“特列季亚科夫站”，再步行一小段；4. 见面的时间和地点：上午十点，在地铁站旁边；5. 请他晚上给你打电话。
    length: 40–60
    model: |
      Пьер, приве́т!

      В суббо́ту я пойду́ в Третьяко́вскую галере́ю. Ты хо́чешь пойти́ со мной? Там о́чень краси́вые ру́сские карти́ны. Мы пое́дем на метро́ до ста́нции «Третьяко́вская», а пото́м пойдём пешко́м. Э́то недалеко́, пять мину́т. Встре́тимся в суббо́ту в де́сять часо́в утра́ ря́дом с метро́. Позвони́ мне, пожа́луйста, ве́чером.

      Ван Лэй
    rubric:
    - 13–15 分：五个要点齐全，句子通顺，语法错误不超过两处，有称呼和署名
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或语法错误较多，部分句子意思不清
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（五个要点各 1 分，称呼和署名 1 分，邀请语气得体 1 分）；语法 5 分（运动动词、前置词和格每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: 范文约 50 词，按要点的顺序一条一条写，每条一两句。语法上：[пойду́]{.ru}、[пое́дем]{.ru}、[пойдём]{.ru} 说的是将来的一次出行（第 73 课）；坐地铁用 [е́хать]{.ru} 类动词，下车以后步行用 [идти́]{.ru} 类动词，不能混（第 24、71 课）；[до ста́нции]{.ru} 是 [до]{.ru} + 第二格（第 37 课）；[со мной]{.ru}、[ря́дом с метро́]{.ru} 是第五格（第 62、66 课）；[в де́сять часо́в]{.ru} 是 [в]{.ru} + 钟点（第 47 课）；[Встре́тимся]{.ru} 是完成体将来时，用来约定见面（第 72 课）；[Позвони́]{.ru} 是命令式，对朋友用 [ты]{.ru} 的形式（第 46 课）。便条开头写 [Пьер, приве́т!]{.ru}，结尾只写自己的名字。
  - prompt: |
      阅读下面的故事开头，续写 50–80 词，写王磊在商店里看了什么、买了什么、花了多少钱，出了商店以后又发生了什么，给故事一个结尾。

      [В воскресе́нье Ван Лэй пое́хал на Арба́т: он хоте́л купи́ть пода́рок ма́ме. Он до́лго гуля́л по Арба́ту. Там худо́жники рисова́ли портре́ты, а музыка́нты игра́ли на гита́ре. Пото́м Ван Лэй уви́дел ма́ленький магази́н. В магази́не рабо́тала немолода́я же́нщина. Она́ сказа́ла: «Здра́вствуйте! Что вы хоти́те посмотре́ть?»]{.ru}
    length: 50–80
    model: |
      — Покажи́те, пожа́луйста, вот э́тот плато́к, — сказа́л Ван Лэй. Плато́к был кра́сный и о́чень краси́вый. Он сто́ил семьсо́т рубле́й. Ван Лэй заплати́л и сказа́л: «Спаси́бо! Э́то пода́рок для ма́мы». Же́нщина отве́тила: «Ва́шей ма́ме он обяза́тельно понра́вится!»

      Когда́ Ван Лэй шёл к метро́, он уви́дел Ю́ми. Она́ то́же гуля́ла по Арба́ту. Они́ пошли́ в кафе́ и пи́ли горя́чий чай. Ве́чером Ван Лэй показа́л плато́к А́нне. «Како́й краси́вый!» — сказа́ла она́.
    rubric:
    - 13–15 分：写清买了什么、多少钱，出商店以后有新的情节和结尾，和开头衔接自然；语法错误不超过两处
    - 9–12 分：内容基本完整，情节简单，或语法错误三四处
    - 5–8 分：只写了买东西，没有后面的情节和结尾，或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（买的东西和价钱 2 分，新情节 2 分，结尾 2 分）；语法 6 分（动词的体、运动动词、数词和 [рубль]{.ru} 的搭配每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: 范文约 75 词，分两段：第一段在商店里买东西，第二段写出了商店以后的事和结尾。语法上：[Покажи́те, пожа́луйста]{.ru} 是商店里的请求（第 76 课）；[сто́ил семьсо́т рубле́й]{.ru}，[сто́ить]{.ru} 跟 [плато́к]{.ru} 一致，[семьсо́т]{.ru} 后面用 [рубле́й]{.ru}（第 78 课）；[заплати́л]{.ru}、[показа́л]{.ru} 说一次的结果，用完成体（第 44、76 课）；[Когда́ Ван Лэй шёл к метро́, он уви́дел…]{.ru} 用定向动词给“看见”做背景（第 72 课）；[гуля́ла по Арба́ту]{.ru} 是 [по]{.ru} + 第三格（第 72 课）；[понра́вится]{.ru} 跟主语 [он]{.ru}（头巾）一致，喜欢的人用第三格 [Ва́шей ма́ме]{.ru}（第 52、56 课）。续写前先想好结尾，再用两三件事把它和开头连起来；直接引语用引号或破折号。
