  points: 1.5
  passage: '::: {.prose lang="ru"}

    **Встре́ча в па́рке**


    В воскресе́нье мы с (1) []{.blank} (сестра́) е́здили в парк. Когда́ мы (2) []{.blank} (идти́ / ходи́ть) ми́мо (3) []{.blank} (большо́е о́зеро), сестра́ уви́дела (4) []{.blank} (наш ста́рый учи́тель): когда́-то он учи́л нас в шко́ле.


    Учи́тель был о́чень рад: «Я то́лько вчера́ (5) []{.blank} (верну́ться) из (6) []{.blank} (Петербу́рг): мы е́здили туда́ с мои́м кла́ссом». Пото́м он до́лго расска́зывал (7) []{.blank} (мы) о Петербу́рге и пока́зывал фо́то.


    Когда́ мы шли к метро́, он сказа́л: «В ма́е мой класс опя́ть (8) []{.blank} (пое́хать) в Петербу́рг. Я (9) []{.blank} (хоте́ть) бы пригласи́ть и вас. Вы пое́дете со (10) []{.blank} (я)?» Мы, коне́чно, сказа́ли «да».

    :::

    '
  passage_zh: '**公园里的相遇**


    星期天我和妹妹去了公园。我们走过大湖边时，妹妹看见了我们的老教师：他以前在学校教过我们。


    老师很高兴：“我昨天刚从彼得堡回来，我带我的班去那儿玩了。”后来他给我们讲了很久彼得堡的事，还给我们看照片。


    我们往地铁站走的时候，他说：“五月我的班还要去彼得堡。我想也请你们一起去。你们愿意跟我去吗？”我们当然说“好”。

    '
  why: 第 1 空：[мы с]{.ru} + 第五格表示“我和某人”，[сестра́]{.ru} 的第五格是 [сестро́й]{.ru}，重音在词尾（第 62 课）。第 2 空：从湖边走过是正在路上、朝一个方向走的过程，给主句的 [сестра́ уви́дела]{.ru}（一次的动作）做背景，用定向动词过去时 [шли]{.ru}；[ходи́ли]{.ru} 说的是去了又回来或来回走，不能做“看见”的背景（第 72 课）。第 3 空：[ми́мо]{.ru} 要求第二格，中性形容词第二格 [-ого]{.ru}：[большо́го о́зера]{.ru}（第 34、72 课）。第 4 空：[уви́деть]{.ru} 后面用第四格，[учи́тель]{.ru} 是动物名词，第四格同第二格，形容词和物主代词也要变：[на́шего ста́рого учи́теля]{.ru}（第 22、34 课）。第 5 空：[то́лько вчера́]{.ru} 说的是已经完成的一次回来，完成体过去时，说话人是男老师：[верну́лся]{.ru}（第 47 课）。第 6 空：[из]{.ru} 要求第二格：[из Петербу́рга]{.ru}（第 36、74 课）。第 7 空：[расска́зывать]{.ru} 讲给谁听用第三格，[мы]{.ru} 的第三格是 [нам]{.ru}（第 51、52 课）。第 8 空：[в ма́е]{.ru} 说的是将来的一次出行，用 [пое́хать]{.ru} 的将来时，主语 [класс]{.ru} 是单数：[пое́дет]{.ru}（第 73 课）。第 9 空：[бы]{.ru} + 过去时形式表示委婉的愿望，说话人是男老师，用 [хоте́л]{.ru}（第 77 课）。第 10 空：[с]{.ru} 要求第五格，[я]{.ru} 的第五格是 [мной]{.ru}，前置词写成 [со]{.ru}（第 62 课）。
