    Ма́ма говори́т: «Где мои́ (7) []{.blank} (письмо́)?» — «Вот они́, тут».

    Брат (8) []{.blank} (ви́деть) фо́то: «А э́то кто?» — «Э́то (9) []{.blank} (наш) ко́шка. Тут она́ (10) []{.blank} (ма́ленький)».
    :::
  passage_zh: |
    **我们家的猫**

    晚上我们一家人都在家。我弟弟和他的朋友在玩，爸爸在看足球。妈妈说：“儿子，你的功课呢？”

    爸爸躺着，不说话。妈妈说：“孩子他爸，你睡着了？”——“没有，我没睡，我在看足球。妈妈，儿子，你们说话这么快！”我躺着看小说。

    妈妈说：“我的信在哪儿？”——“在这儿呢。”

    弟弟看见一张照片：“这是谁？”——“这是我们家的猫。照片上它还很小。”
