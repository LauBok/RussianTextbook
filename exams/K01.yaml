    **На́ша ко́шка**

    Ве́чером на́ша семья́ до́ма. Мой брат и его́ друг (1) []{.blank} (игра́ть), а па́па (2) []{.blank} (смотре́ть) футбо́л. Ма́ма говори́т: «Сын, а где (3) []{.blank} (твой) уро́ки?»

