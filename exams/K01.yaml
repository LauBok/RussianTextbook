lesson: K01
heading: 第一套
range: L01-L09
names: [Ка́тя, Ко́стя, Па́ша, Ни́на Петро́вна, Ма́ша]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：形容词和它修饰的名词 [го́род]{.ru} 一致，[го́род]{.ru} 是阳性，用 [ста́рый]{.ru}；主语 [Москва́]{.ru} 和后半句的 [краси́вая река́]{.ru} 都是阴性，但和这个空没有关系，不要跟着选 [ста́рая]{.ru}（第 9 课）。第 2 题：前半句说“我们不在家”，只有 [гуля́ем]{.ru}“在外面散步”说得通；睡觉、看书、做功课一般都在家里（第 2、6 课）。第 3 题：对方道谢，回答用 [Пожа́луйста!]{.ru}“不客气”；[Спаси́бо]{.ru} 是道谢本身，[Здра́вствуйте, Приве́т]{.ru} 是见面问候（第 3 课）。第 4 题：[что]{.ru} 问事物，回答只能是物 [дом]{.ru}；[ко́шка]{.ru} 是动物，和人一样用 [кто]{.ru} 问（第 1 课）。第 5 题：[моё]{.ru} 是中性，四个名词里只有 [кре́сло]{.ru} 以 [-о]{.ru} 结尾，是中性；[стол]{.ru} 是阳性，[ла́мпа, крова́ть]{.ru} 是阴性（第 3 课）。第 6 题：前半句说 [брат]{.ru} 说得慢，结果是“我全都听得懂”，用 [понима́ю]{.ru}；[зна́ю, игра́ю, отдыха́ю]{.ru} 和“说得慢”没有因果关系（第 7 课）。第 7 题：回答问题表示否定用 [нет]{.ru}；[не]{.ru} 只否定句中的词，不能单独回答；后面说 [не моя́]{.ru}，所以不能用 [да]{.ru}（第 2 课）。第 8 题：对方用 [Здра́вствуйте]{.ru} 打招呼，又用名字加父称回答，是要尊称的人，用 [Как вас зову́т?]{.ru}；[вы, ты]{.ru} 不能放进这个句型（第 4 课）。第 9 题：[Сейча́с ночь]{.ru}“现在是夜里”，爸爸妈妈在睡觉：[спят]{.ru}；夜里一般不工作、不散步、不玩（第 6、7 课）。第 10 题：[ру́чка]{.ru} 是阴性，[мой, твой]{.ru} 是阳性形式，不能用；[он]{.ru} 是人称代词，不回答“谁的”；[его́]{.ru} 不变，用于任何性（第 8 课）。第 11 题：“我看不清楚”，找的是眼镜 [очки́]{.ru}；[мои́]{.ru} 是复数，[очки́]{.ru} 只有复数，其余三个都是单数，和 [мои́]{.ru} 不一致（第 8 课）。第 12 题：[слова́рь]{.ru} 以 [-ь]{.ru} 结尾，但它是阳性（复数 [словари́]{.ru}），代替它用 [он]{.ru}；以 [-ь]{.ru} 结尾的名词有阳性也有阴性（[тетра́дь, крова́ть]{.ru} 是阴性），要一个个记，不能看词尾猜（第 2、3 课）。第 13 题：“看电影”说 [смотре́ть фильм]{.ru}，主语 [мы]{.ru}，用 [смо́трим]{.ru}；电影不能“读”“玩”，也不说“听电影”（第 7 课）。第 14 题：[тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，是阴性；[си́ний]{.ru} 是软变化，阴性是 [си́няя]{.ru}（第 3、9 课）。第 15 题：猫在睡觉，是躺着：[лежи́т]{.ru}；一边站着、玩、散步一边睡觉都说不通（第 7 课）。第 16 题：拼写规则：[г, к, х, ж, ш, ч, щ]{.ru} 后面不写 [ы]{.ru}，写 [и]{.ru}，所以是 [кни́ги]{.ru}，不是 [кни́гы]{.ru}；[тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，复数把 [-ь]{.ru} 换成 [-и]{.ru}：[тетра́ди]{.ru}（第 5 课）。第 17 题：[пи́сьма]{.ru} 虽然以 [-а]{.ru} 结尾，却不是阴性单数，而是 [письмо́]{.ru} 的复数，问“谁的”用复数 [чьи]{.ru}；看到 [-а]{.ru} 就选 [чья]{.ru} 是最常见的错误（第 5、8 课）。第 18 题：对方为自己说得不好表示不安，回答 [Ничего́!]{.ru}“没关系”，后面接着安慰“你说得挺好”；[Пожа́луйста]{.ru} 用来回答道谢（第 4 课）。第 19 题：回答是“又大又新”，说的是房子什么样，用 [како́й]{.ru}，和阳性的 [дом]{.ru} 一致；[чей]{.ru} 问“谁的”，要用物主代词回答；[кака́я]{.ru} 是阴性（第 8、9 课）。第 20 题：[спать]{.ru} 是第二变位，第一人称单数在词干后加 [л]{.ru}：[сплю]{.ru}；[спаю́]{.ru} 是按第一变位乱套的错误形式，[спишь]{.ru} 是“你”的形式，问句里用了，回答要改成“我”（第 7 课）。第 21 题：窗户大，能看见城市和天空：[ви́жу]{.ru}；城市不能“听”“懂”，[звони́ть]{.ru} 也不能这样用（第 7、9 课）。第 22 题：对爸爸妈妈两个人说“你们的”用 [ваш]{.ru}，[ко́мната]{.ru} 是阴性，用 [ва́ша]{.ru}；[твоя́]{.ru} 只对一个人说，[их]{.ru} 说的是不在对话里的第三方（第 8 课）。第 23 题：用名字加父称称呼一个人，要用 [вы]{.ru}，[вы]{.ru} 即使只指一个人，动词也用复数第二人称：[чита́ете]{.ru}；[чита́ешь]{.ru} 和 [ты]{.ru} 连用（第 4、6 课）。第 24 题：[его́, её, их]{.ru} 看的是“谁的”，也就是物主的性别和数，不看后面的名词：[брат]{.ru} 是阳性，但他是卡佳的弟弟，卡佳是女的，用 [её]{.ru}；看到 [брат]{.ru} 就选 [его́]{.ru} 是常见错误（第 8 课）。第 25 题：回答是 [Вот он]{.ru}，问的是地点，用 [где]{.ru}（第 2 课）。
  items:
  - stem: Москва́ — ___ го́род, а Москва́-река́ — краси́вая река́.
    options: [ста́рая, ста́рое, ста́рый, ста́рые]
    answer: ста́рый
  - stem: Ве́чером мы не до́ма, мы ___.
    options: [гуля́ем, спим, чита́ем, де́лаем уро́ки]
    answer: гуля́ем
  - stem: — Спаси́бо! — ___
    options: [Спаси́бо!, Здра́вствуйте!, Приве́т!, Пожа́луйста!]
    answer: Пожа́луйста!
  - stem: — Что э́то? — Э́то ___.
    options: [ко́шка, дом, ма́ма, брат]
    answer: дом
  - stem: Э́то моё ___.
    options: [стол, ла́мпа, кре́сло, крова́ть]
    answer: кре́сло
  - stem: Брат говори́т ме́дленно, и я всё ___.
    options: [зна́ю, игра́ю, отдыха́ю, понима́ю]
    answer: понима́ю
  - stem: — Э́то твоя́ су́мка? — ___, не моя́.
    options: [Нет, Не, Да, Вот]
    answer: Нет
  - stem: — Здра́вствуйте! Как ___ зову́т? — Серге́й Ива́нович.
    options: [тебя́, вас, вы, ты]
    answer: вас
  - stem: Сейча́с ночь. Па́па и ма́ма ___.
    options: [рабо́тают, гуля́ют, игра́ют, спят]
    answer: спят
  - stem: — Чья э́то ру́чка? Твоя́? — Нет, ___.
    options: [он, твой, его́, мой]
    answer: его́
  - stem: Ма́ма, я пло́хо ви́жу. Где мои́ ___?
    options: [ключ, очки́, ру́чка, слова́рь]
    answer: очки́
  - stem: — Где мой слова́рь? — Вот ___.
    options: [она́, оно́, он, они́]
    answer: он
  - stem: Ве́чером мы ___ фильм.
    options: [смо́трим, чита́ем, слу́шаем, игра́ем]
    answer: смо́трим
  - stem: Э́то ___ тетра́дь.
    options: [си́ний, си́нее, си́ние, си́няя]
    answer: си́няя
  - stem: Ко́шка ___ и спит.
    options: [стои́т, игра́ет, лежи́т, гуля́ет]
    answer: лежи́т
  - stem: Тут мои́ ___.
    options: [кни́гы и тетра́ди, кни́ги и тетра́ди, кни́ги и тетра́ды, кни́гы и тетра́ды]
    answer: кни́ги и тетра́ди
  - stem: Ма́ма, ___ э́то пи́сьма?
    options: [Чей, Чьи, Чья, Чьё]
    answer: Чьи
  - stem: — Я говорю́ по-ру́сски о́чень пло́хо. — ___! Ты говори́шь хорошо́.
    options: [Пожа́луйста, Приве́т, Ничего́, Спаси́бо]
    answer: Ничего́
  - stem: — ___ э́то дом? — Большо́й и но́вый.
    options: [Чей, Како́й, Кака́я, Что]
    answer: Како́й
  - stem: — Ко́стя, ты спишь? — Нет, не ___, я чита́ю.
    options: [спит, сплю, спаю́, спишь]
    answer: сплю
  - stem: Окно́ большо́е, и я ___ го́род и не́бо.
    options: [слу́шаю, ви́жу, понима́ю, звоню́]
    answer: ви́жу
  - stem: Па́па, ма́ма, э́то ___ ко́мната?
    options: [твоя́, их, ва́ша, ваш]
    answer: ва́ша
  - stem: Ни́на Петро́вна, что вы сейча́с ___?
    options: [чита́ешь, чита́ете, чита́ет, чита́ю]
    answer: чита́ете
  - stem: Вот Ка́тя, а вот ___ брат.
    options: [его́, её, их, он]
    answer: её
  - stem: — ___ мой ключ? — Вот он.
    options: [Что, Кто, Чей, Где]
    answer: Где
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Письмо́**

    Ве́чером мы до́ма. Па́па отдыха́ет и чита́ет ста́рый (1) []{.blank}. Ма́ма (2) []{.blank} телеви́зор: там интере́сный (3) []{.blank}. Мой брат Ко́стя — (4) []{.blank}, он де́лает уро́ки. А я студе́нтка, я (5) []{.blank} журна́л.

    Па́па говори́т: «Ма́ша, где мои́ (6) []{.blank}? Я о́чень (7) []{.blank} ви́жу». — «Вот (8) []{.blank}», — говори́т ма́ма.

    Па́па чита́ет рома́н, а там (9) []{.blank}. Оно́ ма́ленькое и си́нее. «(10) []{.blank} э́то письмо́?» — говори́т па́па. «Не моё», — говори́т ма́ма. «И не (11) []{.blank}», — говорю́ я. А Ко́стя не говори́т, он де́лает (12) []{.blank}.

    Па́па чита́ет: «(13) []{.blank}! Ты о́чень хоро́ший. (14) []{.blank} Ма́ша».

    «Ко́стя, (15) []{.blank} э́то — Ма́ша?» — говори́т па́па. «Я не (16) []{.blank}! Я де́лаю уро́ки!»

    А ма́ма смо́трит письмо́ и говори́т: «Ко́стя, э́то не (17) []{.blank} Ма́ша. Ма́ша — э́то (18) []{.blank}!» Па́па говори́т: «(19) []{.blank}, Ма́ша! И ты о́чень (20) []{.blank}!»
    :::
  passage_zh: |
    **一封信**

    晚上我们都在家。爸爸在休息，读一本旧小说。妈妈在看电视：电视里在放一部有意思的电影。我弟弟科斯佳是中学生，他在做功课。我是大学生，在看杂志。

    爸爸说：“玛莎，我的眼镜在哪儿？我看不太清。”——“在这儿呢。”妈妈说。

    爸爸读着小说，书里夹着一封信，又小又蓝。“这是谁的信？”爸爸问。“不是我的。”妈妈说。“也不是我的。”我说。科斯佳不说话，埋头做功课。

    爸爸念道：“你好！你真好。你的玛莎。”

    “科斯佳，这个玛莎是谁？”爸爸问。“我不知道！我在做功课呢！”

    妈妈看了看信，说：“科斯佳，这可不是你的玛莎。玛莎就是我！”爸爸说：“谢谢你，玛莎！你也很好！”
  why: 第 1 空：能“读”的只有 [рома́н]{.ru}；后文 [Па́па чита́ет рома́н, а там письмо́]{.ru} 也印证了这一点（第 6 课）。第 2 空：电视是“看”的，用 [смо́трит]{.ru}；[чита́ет, де́лает, зна́ет]{.ru} 都不能和 [телеви́зор]{.ru} 搭配（第 7 课）。第 3 空：电视里放的是 [фильм]{.ru}；小说、杂志不在电视上“放”（第 7 课）。第 4 空：后半句“他在做功课”，又和下一句“而我是大学生”对比，所以弟弟是中学生 [шко́льник]{.ru}；工程师、医生、演员不做功课（第 4 课）。第 5 空：[журна́л]{.ru} 只能“读”：[чита́ю]{.ru}（第 6 课）。第 6 空：后一句说“我看不太清”，找的是眼镜 [очки́]{.ru}（第 8 课）。第 7 空：要找眼镜，说明“看不清”：[пло́хо]{.ru}；[хорошо́]{.ru} 和找眼镜矛盾，[бы́стро, ме́дленно]{.ru} 不能说“看”的清楚程度（第 7 课）。第 8 空：代替 [очки́]{.ru}。[очки́]{.ru} 只有复数，用 [они́]{.ru}（第 2、8 课）。第 9 空：下一句用 [оно́]{.ru} 指它，再下一句问 [Чьё э́то письмо́?]{.ru}，所以夹在书里的是 [письмо́]{.ru}（第 5 课）。第 10 空：[письмо́]{.ru} 是中性，问“谁的”用 [чьё]{.ru}（第 8 课）。第 11 空：前面妈妈说 [Не моё]{.ru}，“我”接着说“也不是我的”，仍指中性的 [письмо́]{.ru}：[моё]{.ru}（第 3、8 课）。第 12 空：开头说过科斯佳在做功课，他低头接着做 [уро́ки]{.ru}；后面他自己也说 [Я де́лаю уро́ки!]{.ru}（第 6 课）。第 13 空：信的开头是问候，熟人之间用 [Приве́т]{.ru}（第 2 课）。第 14 空：落款“你的玛莎”，[Ма́ша]{.ru} 是女性，用阴性 [Твоя́]{.ru}（第 8 课）。第 15 空：问的是人：[кто]{.ru}（第 1 课）。第 16 空：问他玛莎是谁，他回答“我不知道”：[зна́ю]{.ru}（第 6 课）。第 17 空：爸爸怀疑写信的玛莎是科斯佳的女朋友，妈妈对科斯佳说“这不是你的玛莎”：对 [ты]{.ru} 说，[Ма́ша]{.ru} 是阴性，用 [твоя́]{.ru}（第 8 课）。第 18 空：全文的关键。第二段爸爸叫妈妈 [Ма́ша]{.ru}（[Мари́я]{.ru} 的小名），所以落款“你的玛莎”就是妈妈：[Ма́ша — э́то я]{.ru}。只读本句看不出来，要联系第二段（第 1、4 课）。第 19 空：信是妈妈写给爸爸的，爸爸向她道谢：[Спаси́бо]{.ru}；[Приве́т, Здра́вствуйте]{.ru} 是见面问候，[Пожа́луйста]{.ru} 用来回答道谢（第 2、3 课）。第 20 空：信里写“你真好”，爸爸回答“你也很好”；对玛莎说，形容词用阴性 [хоро́шая]{.ru}（第 9 课）。
  items:
  - options: [фильм, рома́н, телеви́зор, уро́к]
    answer: рома́н
  - options: [смо́трит, чита́ет, де́лает, зна́ет]
    answer: смо́трит
  - options: [рома́н, журна́л, уро́к, фильм]
    answer: фильм
  - options: [инжене́р, врач, шко́льник, актёр]
    answer: шко́льник
  - options: [де́лаю, зна́ю, игра́ю, чита́ю]
    answer: чита́ю
  - options: [ключи́, очки́, кни́ги, тетра́ди]
    answer: очки́
  - options: [хорошо́, бы́стро, пло́хо, ме́дленно]
    answer: пло́хо
  - options: [он, она́, оно́, они́]
    answer: они́
  - options: [письмо́, ключ, слова́рь, каранда́ш]
    answer: письмо́
  - options: [Чей, Чьё, Чья, Чьи]
    answer: Чьё
  - options: [мой, моя́, моё, мои́]
    answer: моё
  - options: [очки́, ключи́, уро́ки, пи́сьма]
    answer: уро́ки
  - options: [Приве́т, Спаси́бо, Пожа́луйста, Ничего́]
    answer: Приве́т
  - options: [Твой, Твоё, Твои́, Твоя́]
    answer: Твоя́
  - options: [что, где, кто, чей]
    answer: кто
  - options: [игра́ю, зна́ю, рабо́таю, сплю]
    answer: зна́ю
  - options: [твой, твоё, твоя́, твои́]
    answer: твоя́
  - options: [ты, я, она́, он]
    answer: я
  - options: [Приве́т, Спаси́бо, Пожа́луйста, Здра́вствуйте]
    answer: Спаси́бо
  - options: [хоро́ший, хоро́шее, хоро́шие, хоро́шая]
    answer: хоро́шая
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Серге́й**

    Меня́ зову́т Серге́й. Я актёр. Мой оте́ц — врач, а мать — инжене́р. Моя́ сестра́ — студе́нтка, а брат — шко́льник.

    Наш дом большо́й и ста́рый. Моя́ ко́мната ма́ленькая, а окно́ тут большо́е.

    Ве́чером оте́ц и мать отдыха́ют: они́ смо́трят телеви́зор. Сестра́ чита́ет, а брат игра́ет. А я ве́чером не до́ма: я рабо́таю. Я актёр!
    :::
  passage_zh: |
    **谢尔盖**

    我叫谢尔盖。我是演员。我父亲是医生，母亲是工程师。我姐姐是大学生，弟弟是中学生。

    我们家的房子又大又旧。我的房间不大，可这里的窗户很大。

