  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ста́рое фо́то**

    Меня́ зову́т Па́ша. Вот ста́рое фо́то. Тут на́ша семья́. Э́то па́па, а э́то ма́ма. Па́па — врач, а ма́ма — инжене́р. Тут мой брат, он студе́нт. А вот ма́ленький шко́льник. Кто э́то? Э́то я!

    Тут наш дом. Он большо́й и но́вый. А вот наш кот. Тут он ма́ленький и всегда́ игра́ет.

    Тепе́рь я студе́нт, а брат не студе́нт, он врач. Па́па говори́т: «Мой сын — врач, и я врач. Э́то хорошо́!» Наш дом тепе́рь ста́рый. А кот тепе́рь большо́й и всегда́ спит.
    :::
  passage_zh: |
    **老照片**

    我叫帕沙。这是一张老照片。照片上是我们一家。这是爸爸，这是妈妈。爸爸是医生，妈妈是工程师。这是我哥哥，他是大学生。这个小小的中学生是谁呢？是我！

    这是我们家的房子。它又大又新。这是我们家的猫。照片上它还很小，总是在玩。

    现在我是大学生了，哥哥不再是大学生，他是医生。爸爸说：“我儿子是医生，我也是医生。这很好！”我们家的房子现在旧了。猫现在长大了，总是在睡觉。
  why: 这篇短文的要点是区分两个时候：[тут]{.ru}“照片上”是从前，[тепе́рь]{.ru}“现在”是今天。干扰项大多是把从前的情况当成现在。第 1 题，[А вот ма́ленький шко́льник. Кто э́то? Э́то я!]{.ru}：照片上的小中学生就是讲故事的帕沙；照片上的哥哥是大学生。第 2 题，[Па́па — врач, а ма́ма — инжене́р]{.ru}；工程师是妈妈，注意 [а]{.ru} 前后说的是两个人。第 3 题，[брат не студе́нт, он врач]{.ru}：哥哥在照片上是大学生，现在是医生；现在的大学生是帕沙。第 4 题，要把两句话合起来：爸爸本来就是医生，又说 [Мой сын — врач, и я врач]{.ru}，现在家里的医生是爸爸和哥哥；妈妈是工程师。第 5 题，[Наш дом тепе́рь ста́рый. А кот тепе́рь большо́й]{.ru}；“又新”“很小”是照片上的样子。
