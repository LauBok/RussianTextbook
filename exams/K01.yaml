heading: 第一套
range: L01-L09
names: [Ка́тя, Ко́стя]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：形容词和后面的名词 [го́род]{.ru} 一致，[го́род]{.ru} 是阳性，用 [ста́рый]{.ru}；不要看主语 [Москва́]{.ru} 是阴性就选 [ста́рая]{.ru}（第 9 课）。第 2 题：前半句说“我们不在家”，只有 [гуля́ем]{.ru}“在外面散步”说得通；睡觉、看书、做功课一般都在家里（第 2、6 课）。第 3 题：对方道谢，回答用 [Пожа́луйста!]{.ru}“不客气”；[Спаси́бо]{.ru} 是道谢本身，[Здра́вствуйте, Приве́т]{.ru} 是见面问候（第 3 课）。第 4 题：[что]{.ru} 问事物，回答只能是物 [дом]{.ru}；[ко́шка]{.ru} 是动物，和人一样用 [кто]{.ru} 问（第 1 课）。第 5 题：[моё]{.ru} 是中性，四个名词里只有 [кре́сло]{.ru} 以 [-о]{.ru} 结尾，是中性；[стол]{.ru} 是阳性，[ла́мпа, крова́ть]{.ru} 是阴性（第 3 课）。第 6 题：前半句说 [брат]{.ru} 说得慢，结果是“我全都听得懂”，用 [понима́ю]{.ru}；[зна́ю, игра́ю, отдыха́ю]{.ru} 和“说得慢”没有因果关系（第 7 课）。第 7 题：回答问题表示否定用 [нет]{.ru}；[не]{.ru} 只否定句中的词，不能单独回答；后面说 [не моя́]{.ru}，所以不能用 [да]{.ru}（第 2 课）。第 8 题：对方用 [Здра́вствуйте]{.ru} 打招呼，又用名字加父称回答，是要尊称的人，用 [Как вас зову́т?]{.ru}；[вы, ты]{.ru} 不能放进这个句型（第 4 课）。第 9 题：[Сейча́с ночь]{.ru}“现在是夜里”，爸爸妈妈在睡觉：[спят]{.ru}；夜里一般不工作、不散步、不玩（第 6、7 课）。第 10 题：[ру́чка]{.ru} 是阴性，[мой, твой]{.ru} 是阳性形式，不能用；[он]{.ru} 是人称代词，不回答“谁的”；[его́]{.ru} 不变，用于任何性（第 8 课）。第 11 题：“我看不清楚”，找的是眼镜 [очки́]{.ru}；[мои́]{.ru} 是复数，[очки́]{.ru} 只有复数，其余三个都是单数，和 [мои́]{.ru} 不一致（第 8 课）。第 12 题：朋友之间用 [Приве́т!]{.ru} 打招呼，回答也用 [Приве́т!]{.ru}；其余三个都不是问候语（第 2 课）。第 13 题：“看电影”说 [смотре́ть фильм]{.ru}，主语 [мы]{.ru}，用 [смо́трим]{.ru}；电影不能“读”“玩”，也不说“听电影”（第 7 课）。第 14 题：[тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，是阴性；[си́ний]{.ru} 是软变化，阴性是 [си́няя]{.ru}（第 3、9 课）。第 15 题：猫在睡觉，是躺着：[лежи́т]{.ru}；一边站着、玩、散步一边睡觉都说不通（第 7 课）。第 16 题：问的是 [Ты зна́ешь…?]{.ru}“你知道吗”，回答用同一个动词：[Нет, не зна́ю]{.ru}（第 6 课）。第 17 题：[пи́сьма]{.ru} 是 [письмо́]{.ru} 的复数，问“谁的”用复数 [чьи]{.ru}；[чьё]{.ru} 配单数 [письмо́]{.ru}（第 5、8 课）。第 18 题：对方为自己说得不好表示不安，回答 [Ничего́!]{.ru}“没关系”，后面接着安慰“你说得挺好”；[Пожа́луйста]{.ru} 用来回答道谢（第 4 课）。第 19 题：回答是 [Моя́]{.ru}“我的”，问的是“谁的”：[Чья]{.ru}；问“什么样的”要用形容词回答，[где]{.ru} 问地点（第 8 课）。第 20 题：后半句说莫斯科河是河，前半句说莫斯科是城市：[го́род]{.ru}；[пло́щадь, собо́р]{.ru} 是城里的广场和教堂（第 9 课）。第 21 题：窗户大，能看见城市和天空：[ви́жу]{.ru}；城市不能“听”“懂”，[звони́ть]{.ru} 也不能这样用（第 7、9 课）。第 22 题：对爸爸妈妈两个人说“你们的”用 [ваш]{.ru}，[ко́мната]{.ru} 是阴性，用 [ва́ша]{.ru}；[твоя́]{.ru} 只对一个人说，[их]{.ru} 说的是不在对话里的第三方（第 8 课）。第 23 题：对方说 [Здра́вствуйте]{.ru}，回答同样用 [Здра́вствуйте]{.ru}；其他几个不是见面问候语（第 1、3、4 课）。第 24 题：爸爸说 [Не так бы́стро!]{.ru}“别那么快！”，可见 [брат]{.ru} 总是说得快：[бы́стро]{.ru}（第 7 课）。第 25 题：回答是 [Вот он]{.ru}，问的是地点，用 [где]{.ru}（第 2 课）。
  items:
  - stem: Москва́ — краси́вый и ___ го́род.
    options: [ста́рая, ста́рое, ста́рый, ста́рые]
    answer: ста́рый
  - stem: Ве́чером мы не до́ма, мы ___.
    options: [гуля́ем, спим, чита́ем, де́лаем уро́ки]
    answer: гуля́ем
  - stem: — Спаси́бо! — ___
    options: [Спаси́бо!, Здра́вствуйте!, Приве́т!, Пожа́луйста!]
    answer: Пожа́луйста!
  - stem: — Что э́то? — Э́то ___.
    options: [ко́шка, дом, ма́ма, брат]
    answer: дом
  - stem: Э́то моё ___.
    options: [стол, ла́мпа, кре́сло, крова́ть]
    answer: кре́сло
  - stem: Брат говори́т ме́дленно, и я всё ___.
    options: [зна́ю, игра́ю, отдыха́ю, понима́ю]
    answer: понима́ю
  - stem: — Э́то твоя́ су́мка? — ___, не моя́.
    options: [Нет, Не, Да, Вот]
    answer: Нет
  - stem: — Здра́вствуйте! Как ___ зову́т? — Серге́й Ива́нович.
    options: [тебя́, вас, вы, ты]
    answer: вас
  - stem: Сейча́с ночь. Па́па и ма́ма ___.
    options: [рабо́тают, гуля́ют, игра́ют, спят]
    answer: спят
  - stem: — Чья э́то ру́чка? Твоя́? — Нет, ___.
    options: [он, твой, его́, мой]
    answer: его́
  - stem: Ма́ма, я пло́хо ви́жу. Где мои́ ___?
    options: [ключ, очки́, ру́чка, слова́рь]
    answer: очки́
  - stem: — Приве́т! — ___
    options: [Приве́т!, Спаси́бо!, Пожа́луйста!, Ничего́!]
    answer: Приве́т!
  - stem: Ве́чером мы ___ фильм.
    options: [смо́трим, чита́ем, слу́шаем, игра́ем]
    answer: смо́трим
  - stem: Э́то ___ тетра́дь.
    options: [си́ний, си́нее, си́ние, си́няя]
    answer: си́няя
  - stem: Ко́шка ___ и спит.
    options: [стои́т, игра́ет, лежи́т, гуля́ет]
    answer: лежи́т
  - stem: — Ты зна́ешь, где мой телефо́н? — Нет, не ___.
    options: [понима́ю, зна́ю, игра́ю, отдыха́ю]
    answer: зна́ю
  - stem: ___ э́то пи́сьма? Твои́?
    options: [Чей, Чьи, Чья, Чьё]
    answer: Чьи
  - stem: — Я говорю́ по-ру́сски о́чень пло́хо. — ___! Ты говори́шь хорошо́.
    options: [Пожа́луйста, Приве́т, Ничего́, Спаси́бо]
    answer: Ничего́
  - stem: — ___ э́то су́мка? — Моя́.
    options: [Чья, Кака́я, Где, Что]
    answer: Чья
  - stem: Москва́ — ___, а Москва́-река́ — река́.
    options: [пло́щадь, собо́р, дом, го́род]
    answer: го́род
  - stem: Окно́ большо́е, и я ___ го́род и не́бо.
    options: [слу́шаю, ви́жу, понима́ю, звоню́]
    answer: ви́жу
  - stem: Па́па, ма́ма, э́то ___ ко́мната?
    options: [твоя́, их, ва́ша, ваш]
    answer: ва́ша
  - stem: — Здра́вствуйте! Я ваш врач. — ___!
    options: [Спаси́бо, Пожа́луйста, Ничего́, Здра́вствуйте]
    answer: Здра́вствуйте
  - stem: 'Мой брат всегда́ говори́т ___, и па́па говори́т: «Не так бы́стро!»'
    options: [бы́стро, ме́дленно, пло́хо, хорошо́]
    answer: бы́стро
  - stem: — ___ мой ключ? — Вот он.
    options: [Что, Кто, Чей, Где]
    answer: Где
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок**

    Ве́чером на́ша (1) []{.blank} до́ма. Па́па лежи́т и чита́ет (2) []{.blank}. Ма́ма смо́трит (3) []{.blank}: там интере́сный фильм. Мой брат — (4) []{.blank}. Он не смо́трит фильм, он де́лает (5) []{.blank}. А я студе́нтка, я чита́ю рома́н. Наш кот спит. Э́то его́ кре́сло.

    Брат говори́т: «Ма́ма, мой телефо́н о́чень (6) []{.blank}. Он пло́хо рабо́тает». — «Ничего́», — говори́т ма́ма.

    Тут (7) []{.blank} телефо́н. «Чей э́то телефо́н?» — говори́т па́па. «Не мой», — говори́т ма́ма. «И не мой», — говори́т брат. Мой телефо́н тут, он не звони́т.

    Где он? Мы не зна́ем. Шкаф? (8) []{.blank}. Стол? Нет. А вот (9) []{.blank}, там спит кот. Кот (10) []{.blank}, а телефо́н звони́т! Вот он, ма́ленький и си́ний.

    Па́па говори́т: «(11) []{.blank}, э́то твой пода́рок. А звоню́ я!» Брат говори́т: «(12) []{.blank}, па́па!» Тепе́рь его́ телефо́н (13) []{.blank}, и он хорошо́ (14) []{.blank}.

    Сейча́с ма́ма (15) []{.blank} фильм, па́па чита́ет (16) []{.blank}, а брат не де́лает уро́ки, он (17) []{.blank}: телефо́н но́вый! А я (18) []{.blank} рома́н. А кот? Он (19) []{.blank} спит. Телефо́н звони́т, мы разгова́риваем, а он (20) []{.blank}!
    :::
  passage_zh: |
    **礼物**

    晚上我们一家人都在家。爸爸躺着看杂志。妈妈在看电视：电视里在放一部有意思的电影。我弟弟是中学生。他不看电影，他在做功课。我是大学生，在看小说。我们家的猫在睡觉。那是它的扶手椅。

    弟弟说：“妈妈，我的手机太旧了。它不好用。”——“没关系。”妈妈说。

    这时一部手机响了。“这是谁的手机？”爸爸问。“不是我的。”妈妈说。“也不是我的。”弟弟说。我的手机在这儿，它没响。

    手机在哪儿？我们不知道。柜子里？没有。桌子上？没有。那边是扶手椅，猫在那儿睡觉。猫在睡觉，手机在响！找到了，一部又小又蓝的手机。

    爸爸说：“儿子，这是给你的礼物。是我在打电话！”弟弟说：“谢谢爸爸！”现在他的手机是新的了，很好用。

    现在妈妈在看电影，爸爸在看杂志，弟弟没做功课，他在玩：手机是新的嘛！我在看小说。猫呢？它总是在睡觉。手机响，我们说话，它照样睡！
  why: 第 1 空：后面写的是爸爸、妈妈、弟弟、“我”和猫，晚上都在家，是“我们一家”：[семья́]{.ru}；学校、台灯、广场都不会“在家”。第 2 空：[чита́ет]{.ru}“读”的只能是杂志 [журна́л]{.ru}；电影、电视、电话都不能读。第 3 空：冒号后说“那里在放一部有意思的电影”，妈妈看的是电视 [телеви́зор]{.ru}；钥匙、词典、箱子里都没有电影。第 4 空：下一句说他在做功课 [де́лает уро́ки]{.ru}，后文爸爸又叫他“儿子”，他是中学生 [шко́льник]{.ru}；工程师、医生、演员不做功课。第 5 空：[де́лать уро́ки]{.ru}“做功课”是固定搭配；眼镜、钥匙、信都不能这样“做”（第 6 课）。第 6 空：后一句说“它不好用”，后文爸爸送了新手机，可见旧手机太旧：[ста́рый]{.ru}；[но́вый, хоро́ший]{.ru} 和“不好用”矛盾，[си́ний]{.ru}“蓝的”说明不了为什么不好用。第 7 空：后文反复说 [телефо́н звони́т]{.ru}，大家在找响的手机：[звони́т]{.ru}；手机不会散步、读书、休息。第 8 空：后面接着找桌子，再找到扶手椅，说明柜子里没有：[Нет]{.ru}，和下一句 [Стол? Нет.]{.ru} 一样；答 [Да]{.ru} 就不用再找了。第 9 空：第一段说 [Наш кот спит. Э́то его́ кре́сло.]{.ru}，猫睡在扶手椅上：[кре́сло]{.ru}；台灯、信、天空上不能睡猫。第 10 空：上一句刚说 [там спит кот]{.ru}，手机在响猫却还在睡：[спит]{.ru}；[а]{.ru} 表示对比，“猫在睡，手机在响”。第 11 空：抱怨手机旧的是弟弟，爸爸是对儿子说“这是给你的礼物”：[Сын]{.ru}；妈妈说过手机不是她的，爸爸不会这样称呼猫或自己。第 12 空：收到礼物，回答 [Спаси́бо]{.ru}“谢谢”；[Пожа́луйста]{.ru} 用来回答道谢，[Ничего́]{.ru} 用来回答道歉，[Здра́вствуйте]{.ru} 是见面问候，而且对爸爸不用。第 13 空：手机是刚送的礼物，又说“又小又蓝”：现在是新的 [но́вый]{.ru}；[ста́рый]{.ru} 和礼物矛盾，[большо́й]{.ru} 和 [ма́ленький]{.ru} 矛盾，[интере́сный]{.ru} 不用来说手机。第 14 空：和第二段 [Он пло́хо рабо́тает]{.ru}“它不好用”对照，新手机 [хорошо́ рабо́тает]{.ru}“好用”；手机不会休息、散步，[хорошо́ лежи́т]{.ru} 没有意义。第 15 空：第一段说妈妈在看电视里的电影，现在接着看：[смо́трит]{.ru}；电影不能读、不能“做”，[зна́ет фильм]{.ru} 也不是她在做的事。第 16 空：第一段说爸爸在看杂志，[чита́ет]{.ru} 后面只能是 [журна́л]{.ru}；电视、电影、电话都不能读。第 17 空：冒号后说明原因“手机是新的嘛”，弟弟在玩新手机：[игра́ет]{.ru}；全家都在家，他没出去散步，拿到新手机也不会睡觉，中学生说不上“工作”。第 18 空：第一段说 [я чита́ю рома́н]{.ru}，现在“我”还在看小说：[чита́ю]{.ru}；小说不能“看（电影那样）”或“做”，[зна́ю рома́н]{.ru} 不是正在做的事。第 19 空：手机在它身边响它都没醒，可见它“总是”睡：[всегда́]{.ru}；[пло́хо]{.ru} 和这件事矛盾，[бы́стро, ме́дленно]{.ru} 不能这样修饰“睡”。第 20 空：前句说猫总是在睡，手机响、大家说话，它照样睡：[спит]{.ru}；[а]{.ru} 表示对比，换成玩、散步、说话都和前句矛盾。
  items:
  - options: [семья́, шко́ла, ла́мпа, пло́щадь]
    answer: семья́
  - options: [фильм, телеви́зор, журна́л, телефо́н]
    answer: журна́л
  - options: [ключ, телеви́зор, слова́рь, чемода́н]
    answer: телеви́зор
  - options: [инжене́р, врач, актёр, шко́льник]
    answer: шко́льник
  - options: [очки́, уро́ки, ключи́, пи́сьма]
    answer: уро́ки
  - options: [но́вый, хоро́ший, ста́рый, си́ний]
    answer: ста́рый
  - options: [звони́т, гуля́ет, чита́ет, отдыха́ет]
    answer: звони́т
  - options: [Да, Нет, Вот, Ну]
    answer: Нет
  - options: [ла́мпа, письмо́, не́бо, кре́сло]
    answer: кре́сло
  - options: [спит, игра́ет, гуля́ет, говори́т]
    answer: спит
  - options: [Ма́ма, Кот, Сын, Па́па]
    answer: Сын
  - options: [Пожа́луйста, Здра́вствуйте, Ничего́, Спаси́бо]
    answer: Спаси́бо
  - options: [но́вый, ста́рый, большо́й, интере́сный]
    answer: но́вый
  - options: [отдыха́ет, рабо́тает, гуля́ет, лежи́т]
    answer: рабо́тает
  - options: [чита́ет, де́лает, смо́трит, зна́ет]
    answer: смо́трит
  - options: [журна́л, телеви́зор, фильм, телефо́н]
    answer: журна́л
  - options: [спит, игра́ет, гуля́ет, рабо́тает]
    answer: игра́ет
  - options: [смотрю́, де́лаю, чита́ю, зна́ю]
    answer: чита́ю
  - options: [бы́стро, ме́дленно, пло́хо, всегда́]
    answer: всегда́
  - options: [игра́ет, спит, гуля́ет, говори́т]
    answer: спит
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Серге́й**

    Меня́ зову́т Серге́й. Я актёр. Мой оте́ц — врач, а мать — инжене́р. Моя́ сестра́ — студе́нтка, а брат — шко́льник.

    Наш дом большо́й и ста́рый. Моя́ ко́мната ма́ленькая, а окно́ тут большо́е.

    Ве́чером оте́ц и мать отдыха́ют: они́ смо́трят телеви́зор. Сестра́ чита́ет, а брат игра́ет. А я ве́чером не до́ма: я рабо́таю. Я актёр!
