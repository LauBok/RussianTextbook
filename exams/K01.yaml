lesson: K01
heading: 第一套
range: L01-L09
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：形容词和后面的名词 [го́род]{.ru} 一致，[го́род]{.ru} 是阳性，用 [ста́рый]{.ru}；不要看主语 [Москва́]{.ru} 是阴性就选 [ста́рая]{.ru}（第 9 课）。第 2 题：[ма́ма и Ми́ша]{.ru} 是两个人，代替他们用复数 [они́]{.ru}（第 2 课）。第 3 题：同时对两个人说话用 [вы]{.ru}；动词词尾 [-ете]{.ru} 也只配 [вы]{.ru}（第 4、6 课）。第 4 题：[что]{.ru} 问事物，回答只能是物 [дом]{.ru}；[ко́шка]{.ru} 是动物，和人一样用 [кто]{.ru} 问（第 1 课）。第 5 题：[кре́сло]{.ru} 以 [-о]{.ru} 结尾，是中性，用 [моё]{.ru}（第 3 课）。第 6 题：主语 [ты]{.ru}，第二变位第二人称单数 [говори́шь]{.ru}（第 7 课）。第 7 题：回答问题表示否定用 [нет]{.ru}；[не]{.ru} 只否定句中的词，不能单独回答；后面说 [не моя́]{.ru}，所以不能用 [да]{.ru}（第 2 课）。第 8 题：对方用 [Здра́вствуйте]{.ru} 打招呼，又用名字加父称回答，是要尊称的人，用 [Как вас зову́т?]{.ru}；[вы, ты]{.ru} 不能放进这个句型（第 4 课）。第 9 题：主语是第三人称单数，[спать]{.ru} 是第二变位，用 [спит]{.ru}；[сплю]{.ru} 配 [я]{.ru}，[спят]{.ru} 配 [они́]{.ru}（第 7 课）。第 10 题：[ру́чка]{.ru} 是阴性，[мой, твой]{.ru} 是阳性形式，不能用；[он]{.ru} 是人称代词，不回答“谁的”；[его́]{.ru} 不变，用于任何性（第 8 课）。第 11 题：[ста́рые]{.ru} 是复数，名词也要用复数；[дом]{.ru} 的复数不规则，是 [дома́]{.ru}，重音在词尾（第 5、9 课）。第 12 题：[слова́рь]{.ru} 以 [-ь]{.ru} 结尾，是阳性，回答里的 [он]{.ru} 也说明是阳性，用 [мой]{.ru}（第 3 课）。第 13 题：主语 [мы]{.ru}，第一变位词尾 [-ем]{.ru}：[отдыха́ем]{.ru}（第 6 课）。第 14 题：[тетра́дь]{.ru} 以 [-ь]{.ru} 结尾，是阴性；[си́ний]{.ru} 是软变化，阴性是 [си́няя]{.ru}（第 3、9 课）。第 15 题：[пода́рки]{.ru} 是复数，回答“是我的”用复数 [мои́]{.ru}（第 3、5 课）。第 16 题：两个人做主语，用第三人称复数 [гуля́ют]{.ru}（第 6 课）。第 17 题：[пи́сьма]{.ru} 是 [письмо́]{.ru} 的复数，问“谁的”用复数 [чьи]{.ru}；[чьё]{.ru} 配单数 [письмо́]{.ru}（第 5、8 课）。第 18 题：对方为自己的不足表示歉意，回答 [Ничего́!]{.ru}“没关系”；[Пожа́луйста]{.ru} 用来回答道谢（第 3、4 课）。第 19 题：[ко́мната]{.ru} 是阴性，问“什么样的”用 [кака́я]{.ru}（第 9 课）。第 20 题：全名由名字、父称、姓组成，[Серге́евич]{.ru} 由父亲的名字 [Серге́й]{.ru} 构成，是父称 [о́тчество]{.ru}（第 4 课）。第 21 题：主语 [ты]{.ru}，[ви́деть]{.ru} 是第二变位：[ви́дишь]{.ru}；[ви́жу]{.ru} 是第一人称（第 9 课）。第 22 题：对两个人说“你们的”用 [ваш]{.ru}，[ко́мната]{.ru} 是阴性，用 [ва́ша]{.ru}；[твоя́]{.ru} 只对一个人说，[их]{.ru} 说的是不在对话里的第三方（第 8 课）。第 23 题：对方说 [Здра́вствуйте]{.ru}，回答同样用 [Здра́вствуйте]{.ru}；其他几个不是见面问候语（第 1、3、4 课）。第 24 题：后半句说“我听不太懂”，原因是说得快：[бы́стро]{.ru}；[всегда́, сейча́с]{.ru} 不能放在 [о́чень]{.ru} 后面（第 7 课）。第 25 题：回答是 [Вот он]{.ru}，问的是地点，用 [где]{.ru}（第 2 课）。
  items:
  - stem: Москва́ — краси́вый и ___ го́род.
    options: [ста́рая, ста́рое, ста́рый, ста́рые]
    answer: ста́рый
  - stem: — Где ма́ма и Ми́ша? — ___ до́ма.
    options: [Они́, Она́, Он, Оно́]
    answer: Они́
  - stem: Ми́ша, Ван Лэй, что ___ де́лаете?
    options: [ты, мы, они́, вы]
    answer: вы
  - stem: — Что э́то? — Э́то ___.
    options: [ко́шка, дом, ма́ма, Ми́ша]
    answer: дом
  - stem: Э́то ___ кре́сло.
    options: [мой, моя́, моё, мои́]
    answer: моё
  - stem: Ты ___ по-ру́сски?
    options: [говори́т, говорю́, говоря́т, говори́шь]
    answer: говори́шь
  - stem: — Э́то твоя́ су́мка? — ___, не моя́.
    options: [Нет, Не, Да, Вот]
    answer: Нет
  - stem: — Здра́вствуйте! Как ___ зову́т? — Ива́н Серге́евич.
    options: [тебя́, вас, вы, ты]
    answer: вас
  - stem: Ива́н Серге́евич не смо́трит телеви́зор, он ___.
    options: [сплю, спят, спишь, спит]
    answer: спит
  - stem: — Чья э́то ру́чка? Твоя́? — Нет, ___.
    options: [он, твой, его́, мой]
    answer: его́
  - stem: Там ста́рые ___.
    options: [дом, дома́, ко́мната, окно́]
    answer: дома́
  - stem: — Где ___ слова́рь? — Вот он.
    options: [мой, моя́, моё, мои́]
    answer: мой
  - stem: — Что вы де́лаете? — Мы ___.
    options: [отдыха́ем, отдыха́ют, отдыха́ете, отдыха́ю]
    answer: отдыха́ем
  - stem: Э́то ___ тетра́дь.
    options: [си́ний, си́нее, си́ние, си́няя]
    answer: си́няя
  - stem: — Э́то твои́ пода́рки? — Да, ___.
    options: [мой, моя́, мои́, моё]
    answer: мои́
  - stem: А́нна и Ми́ша сейча́с ___.
    options: [гуля́ет, гуля́ют, гуля́ем, гуля́ешь]
    answer: гуля́ют
  - stem: ___ э́то пи́сьма? Твои́?
    options: [Чей, Чьи, Чья, Чьё]
    answer: Чьи
  - stem: — Я пло́хо говорю́ по-ру́сски. — ___! Я понима́ю.
    options: [Пожа́луйста, Приве́т, Ничего́, Спаси́бо]
    answer: Ничего́
  - stem: — ___ э́то ко́мната? — Э́то ма́ленькая ко́мната.
    options: [Кака́я, Како́й, Како́е, Каки́е]
    answer: Кака́я
  - stem: Ива́н — э́то и́мя, а Серге́евич — ___.
    options: [фами́лия, сын, па́па, о́тчество]
    answer: о́тчество
  - stem: Там река́. Ты ___?
    options: [ви́дит, ви́дишь, ви́жу, ви́дят]
    answer: ви́дишь
  - stem: Ми́ша и А́нна, э́то ___ ко́мната?
    options: [твоя́, их, ва́ша, ваш]
    answer: ва́ша
  - stem: — Здра́вствуйте, Мари́я Никола́евна! — ___, Ван Лэй!
    options: [Спаси́бо, Пожа́луйста, Ничего́, Здра́вствуйте]
    answer: Здра́вствуйте
  - stem: Актёры говоря́т о́чень ___, и я пло́хо понима́ю.
    options: [бы́стро, ме́дленно, всегда́, сейча́с]
    answer: бы́стро
  - stem: — ___ мой ключ? — Вот он.
    options: [Что, Кто, Чей, Где]
    answer: Где
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Ве́чером**

    Ве́чером мы до́ма. Па́па (1) []{.blank} телеви́зор. Э́то (2) []{.blank} фильм? Нет, э́то футбо́л. А ма́ма не смо́трит, она́ (3) []{.blank}. Что она́ чита́ет? Э́то её (4) []{.blank} журна́л.

    А Ми́ша? (5) []{.blank} он де́лает? Уро́ки? Нет, он не де́лает уро́ки, он (6) []{.blank}. Па́па говори́т: «Ми́ша, (7) []{.blank} твои́ (8) []{.blank}?» — «Вот (9) []{.blank}, па́па».

    Ван Лэй (10) []{.blank}. Он говори́т о́чень (11) []{.blank}, и я пло́хо (12) []{.blank}. А, он говори́т не по-ру́сски!

    А я (13) []{.blank} и отдыха́ю. Вот (14) []{.blank} ко́мната. Она́ ма́ленькая и (15) []{.blank}. Тут мой стол и моё (16) []{.blank}. А э́то мои́ (17) []{.blank}. Ко́шка Му́рка (18) []{.blank}. (19) []{.blank} краси́вая ко́шка!

    Ве́чером мы (20) []{.blank} до́ма.
    :::
  passage_zh: |
    **晚上**

    晚上我们都在家。爸爸在看电视。是一部有意思的电影吗？不是，是足球。妈妈不看，她在看书。她在看什么？是她的新杂志。

    米沙呢？他在做什么？做功课？不，他没在做功课，他在玩。爸爸说：“米沙，你的本子在哪儿？”——“在这儿呢，爸爸。”

    王磊在打电话。他说得很快，我听不太懂。啊，他说的不是俄语！

    我呢，躺着休息。这是我的房间。它不大，很明亮。这里有我的桌子和我的扶手椅。这些是我的礼物。猫穆尔卡在睡觉。多漂亮的猫啊！

    晚上我们总是在家。
  why: 第 1 空：主语 [па́па]{.ru} 是第三人称单数，[смотре́ть]{.ru} 第二变位，用 [смо́трит]{.ru}（第 7 课）。第 2 空：[фильм]{.ru} 是阳性，形容词用阳性 [интере́сный]{.ru}（第 9 课）。第 3 空：主语 [она́]{.ru}，下一句也问 [Что она́ чита́ет?]{.ru}，用 [чита́ет]{.ru}（第 6 课）。第 4 空：[журна́л]{.ru} 是阳性，用 [но́вый]{.ru}（第 5、9 课）。第 5 空：后面回答 [Уро́ки?]{.ru}，问的是“做什么”，用 [что]{.ru}；[кто]{.ru} 问人（第 1、6 课）。第 6 空：前面说他没在做功课，[де́лает]{.ru} 前后矛盾；[понима́ет, зна́ет]{.ru} 在这里没有意义；在玩用 [игра́ет]{.ru}（第 6 课）。第 7 空：回答是 [Вот они́]{.ru}，问的是地点，用 [где]{.ru}（第 2 课）。第 8 空：[твои́]{.ru} 是复数，回答里的 [они́]{.ru} 也是复数，只有 [тетра́ди]{.ru} 是复数（第 5 课）。第 9 空：代替复数名词 [тетра́ди]{.ru} 用 [они́]{.ru}（第 2、5 课）。第 10 空：主语 [Ван Лэй]{.ru}，[звони́ть]{.ru} 第二变位，第三人称单数 [звони́т]{.ru}（第 8 课）。第 11 空：后面说“我听不太懂”，原因是说得快：[бы́стро]{.ru}；[всегда́]{.ru} 不能放在 [о́чень]{.ru} 后面，[тут]{.ru} 不说明怎样说（第 7 课）。第 12 空：主语 [я]{.ru}，第一人称 [понима́ю]{.ru}（第 7 课）。第 13 空：主语 [я]{.ru}，[лежа́ть]{.ru} 是第二变位，[ж]{.ru} 后写 [у]{.ru}：[лежу́]{.ru}（第 7 课）。第 14 空：[ко́мната]{.ru} 是阴性，用 [моя́]{.ru}（第 3 课）。第 15 空：主语 [она́]{.ru} 指 [ко́мната]{.ru}，形容词用阴性 [све́тлая]{.ru}，和前面的 [ма́ленькая]{.ru} 一致（第 9 课）。第 16 空：[моё]{.ru} 是中性，四个名词里只有 [кре́сло]{.ru} 是中性；[крова́ть, ла́мпа]{.ru} 是阴性，[шкаф]{.ru} 是阳性（第 3 课）。第 17 空：[мои́]{.ru} 是复数，只能接复数 [пода́рки]{.ru}；[пода́рок]{.ru} 变复数时 [о]{.ru} 脱落（第 5 课）。第 18 空：主语 [ко́шка]{.ru} 是第三人称单数，[спать]{.ru} 第二变位：[спит]{.ru}（第 7 课）。第 19 空：感叹句里 [како́й]{.ru} 和名词 [ко́шка]{.ru} 一致，用阴性 [кака́я]{.ru}（第 9 课）。第 20 空：说的是晚上经常的情况，用 [всегда́]{.ru}“总是”；[сейча́с]{.ru} 和 [ве́чером]{.ru} 矛盾，[где, как]{.ru} 是疑问词（第 6 课）。
  items:
  - options: [смо́трит, смо́трят, смотрю́, смо́тришь]
    answer: смо́трит
  - options: [интере́сная, интере́сное, интере́сный, интере́сные]
    answer: интере́сный
  - options: [чита́ют, чита́ет, чита́ю, чита́ешь]
    answer: чита́ет
  - options: [но́вая, но́вое, но́вые, но́вый]
    answer: но́вый
  - options: [Кто, Что, Где, Чей]
    answer: Что
  - options: [де́лает, понима́ет, игра́ет, зна́ет]
    answer: игра́ет
  - options: [где, кто, что, чей]
    answer: где
  - options: [тетра́дь, тетра́ди, кни́га, письмо́]
    answer: тетра́ди
  - options: [она́, оно́, он, они́]
    answer: они́
  - options: [звони́т, звоня́т, звоню́, звони́шь]
    answer: звони́т
  - options: [ме́дленно, тут, бы́стро, всегда́]
    answer: бы́стро
  - options: [понима́ет, понима́ешь, понима́ем, понима́ю]
    answer: понима́ю
  - options: [лежу́, лежи́т, лежа́т, лежи́шь]
    answer: лежу́
  - options: [мой, моя́, моё, мои́]
    answer: моя́
  - options: [све́тлый, све́тлое, све́тлая, све́тлые]
    answer: све́тлая
  - options: [кре́сло, крова́ть, ла́мпа, шкаф]
    answer: кре́сло
  - options: [пода́рок, пода́рки, кни́га, письмо́]
    answer: пода́рки
  - options: [спят, сплю, спит, спишь]
    answer: спит
  - options: [Како́й, Како́е, Каки́е, Кака́я]
    answer: Кака́я
  - options: [сейча́с, всегда́, где, как]
    answer: всегда́
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Ми́ша**

    Меня́ зову́т Ми́ша. Я шко́льник. Мой па́па, Ива́н Серге́евич, — инжене́р, а ма́ма, Мари́я Никола́евна, — врач. А́нна — моя́ сестра́. Она́ студе́нтка.

    Ван Лэй — студе́нт. Тепе́рь э́то и его́ дом. Его́ ко́мната ма́ленькая и о́чень све́тлая.

    Ве́чером па́па и ма́ма гуля́ют, А́нна чита́ет, а Ван Лэй слу́шает и говори́т по-ру́сски. Он говори́т ме́дленно. А я говорю́ бы́стро, и он не понима́ет. А́нна говори́т: «Ми́ша, не так бы́стро!»

    А что я де́лаю ве́чером? Я игра́ю!
    :::
  passage_zh: |
    **米沙**

    我叫米沙。我是中学生。我爸爸伊万·谢尔盖耶维奇是工程师，妈妈玛丽亚·尼古拉耶夫娜是医生。安娜是我姐姐。她是大学生。

    王磊是大学生。现在这也是他的家。他的房间不大，很明亮。

    晚上爸爸妈妈去散步，安娜看书，王磊听人说话，自己也说俄语。他说得慢。我说得快，他听不懂。安娜说：“米沙，别说得那么快！”

    我晚上做什么呢？我玩！
  why: 第 1 题，第二句 [Я шко́льник]{.ru}。第 2 题，[ма́ма, Мари́я Никола́евна, — врач]{.ru}；工程师是爸爸。第 3 题，[Его́ ко́мната ма́ленькая и о́чень све́тлая]{.ru}。第 4 题，[А́нна чита́ет]{.ru}；散步的是爸爸妈妈。第 5 题，[А я говорю́ бы́стро, и он не понима́ет]{.ru}；说得慢的是王磊。
  items:
  - stem: Ми́ша — ___.
    options: [шко́льник, студе́нт, инжене́р, врач]
    answer: шко́льник
  - stem: Ма́ма, Мари́я Никола́евна, — ___.
    options: [инжене́р, студе́нтка, шко́льник, врач]
    answer: врач
  - stem: Ван Лэй — студе́нт. Его́ ко́мната ___.
    options: [больша́я и све́тлая, ма́ленькая и ста́рая, ма́ленькая и све́тлая, больша́я и ста́рая]
    answer: ма́ленькая и све́тлая
  - stem: Что де́лает А́нна ве́чером? Она́ ___.
    options: [гуля́ет, игра́ет, чита́ет, смо́трит телеви́зор]
    answer: чита́ет
  - stem: Ми́ша говори́т ___, и Ван Лэй не понима́ет.
    options: [бы́стро, ме́дленно, хорошо́, пло́хо]
    answer: бы́стро
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Мари́я Никола́евна]{.sp} Ми́ша, ты до́ма?

    [Ми́ша]{.sp} Да, ма́ма, я тут.

    [Мари́я Никола́евна]{.sp} Что ты де́лаешь? Уро́ки?

    [Ми́ша]{.sp} Нет, я чита́ю. Э́то о́чень интере́сная кни́га!

    [Мари́я Никола́евна]{.sp} А где А́нна?

