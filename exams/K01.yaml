    ::: {.prose lang="ru"}
    **«Ты» и «вы»**

    Па́па, ма́ма, брат, сестра́, друг — э́то «ты». Сын говори́т: «Ма́ма, где ты?» Студе́нт говори́т: «Приве́т, друг! Что ты де́лаешь?»

    Врач, инжене́р — э́то «вы». Шко́льник говори́т: «Здра́вствуйте! Как вас зову́т?» Врач говори́т: «Меня́ зову́т Серге́й Ива́нович». Серге́й — э́то и́мя, а Ива́нович — о́тчество. И́мя и о́тчество — э́то «вы».

    «Приве́т» — э́то «ты», а «Здра́вствуйте» — э́то «вы».
    :::
  passage_zh: |
    **“你”和“您”**

    对爸爸、妈妈、哥哥、姐姐、朋友说“你”（ты）。儿子说：“妈妈，你在哪儿？”大学生说：“你好，朋友！你在干什么？”

    对医生、工程师说“您”（вы）。中学生说：“您好！您叫什么名字？”医生说：“我叫谢尔盖·伊万诺维奇。”谢尔盖是名字，伊万诺维奇是父称。称呼名字和父称时，用“您”（вы）。

    [Приве́т]{.ru} 用于说“你”的人，[Здра́вствуйте]{.ru} 用于说“您”的人。
  why: 第 1 题，第一句 [Па́па, ма́ма, брат, сестра́, друг — э́то «ты»]{.ru}。第 2 题，[Ива́нович — о́тчество]{.ru}。第 3 题，[Серге́й — э́то и́мя]{.ru}。第 4 题，称呼名字加父称要用“您”，最后一段说 [«Здра́вствуйте» — э́то «вы»]{.ru}；[Приве́т]{.ru} 用于说“你”的人。第 5 题，[И́мя и о́тчество — э́то «вы»]{.ru}：用名字加父称称呼人时用 [вы]{.ru}。
  items:
  - stem: Па́па, ма́ма, брат, сестра́, друг — э́то ___.
    options: [«вы», «ты», «он», «мы»]
    answer: «ты»
  - stem: Ива́нович — э́то ___.
    options: [о́тчество, и́мя, фами́лия, сын]
    answer: о́тчество
  - stem: Врач — Серге́й Ива́нович. Серге́й — э́то ___.
