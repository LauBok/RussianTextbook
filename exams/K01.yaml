    **我们家的猫**

    晚上我们一家人都在家。我弟弟和他的朋友在玩，爸爸在看足球。妈妈说：“儿子，你的功课呢？”

    爸爸说：“妈妈，儿子，你们说话这么快！这儿在放足球呢！”我躺着看小说。

    妈妈说：“我的信在哪儿？”——“在这儿呢。”

    弟弟看见一张照片：“这是谁？”——“这是我们家的猫。照片上它还很小，非常漂亮。”
