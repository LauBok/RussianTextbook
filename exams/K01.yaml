  passage_zh: |
    **名字、父称、姓**

    这是爸爸：伊万·谢尔盖耶维奇·彼得罗夫。伊万是名字，谢尔盖耶维奇是父称，彼得罗夫是姓。

    这是妈妈：玛丽亚·尼古拉耶夫娜·彼得罗娃。爸爸姓彼得罗夫，妈妈姓彼得罗娃。

    爸爸叫伊万。米沙是他的儿子，所以米沙是米哈伊尔·伊万诺维奇。安娜是安娜·伊万诺夫娜。米沙就是米哈伊尔，阿尼娅就是安娜。

    妈妈说：“米沙，阿尼娅，你们在哪儿？”王磊却说：“伊万·谢尔盖耶维奇，玛丽亚·尼古拉耶夫娜，你们在哪儿？”称呼名字和父称时，用“您（вы）”。
