    options: ['он не знал, когда́ у Све́ты самолёт', 'он ду́мал, что Све́та лети́т из Шереме́тьева', 'Све́та не зна́ла, где Домоде́дово', он не хоте́л е́хать в Шереме́тьево]
    answer: 'он ду́мал, что Све́та лети́т из Шереме́тьева'
  - stem: Ро́ма отвеча́ет Све́те, что ему́ не тру́дно, потому́ что ___.
