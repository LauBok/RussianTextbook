  passage_zh: |
    **邻居**

    新年我们照例在奶奶家过。姐姐在厨房给奶奶帮忙，我一晚上都在装饰枞树。奶奶忽然往窗外一看：“维克托·帕夫洛维奇家又没有枞树！”他一个人住在隔壁楼，大概又打算守着电视过节了。

    奶奶马上给他打了电话，没多久我们就在门口迎接我们的邻居了。我们送给他一双暖和的拖鞋，他喜欢得当场就穿上了。

    午夜，克里姆林宫的钟声敲响了。爷爷祝大家新年快乐：“祝你们幸福、健康！”我们的客人轻声说：“要不是你们的奶奶，我这会儿还一个人坐着呢。”

    现在他常来和我们一起喝茶。
  glossary:
  - {ru: украша́ть, pos: impf., zh: 装饰}
  - {ru: Е́сли бы не …, zh: 要不是……}
  why: 第 1 空：[помога́ть]{.ru} 帮助谁用第三格：[ба́бушке]{.ru}（第 51、56 课）。第 2 空：[ве́чер]{.ru} 是阳性，表示“整个晚上”用第四格，形式同第一格：[весь ве́чер]{.ru}；[всё]{.ru} 配中性词（[всё у́тро]{.ru}），[вся]{.ru} 配阴性词（第 97 课）。第 3 空：说的是邻居此刻的打算，用现在时，主语 [он]{.ru} 是第三人称单数：[собира́ется]{.ru}；[-ся]{.ru} 在元音后写成 [-ся]{.ru}（第 93 课）。第 4 空：[встреча́ть]{.ru} 迎接谁用第四格；[сосе́д]{.ru} 是动物名词，阳性第四格同第二格，物主代词也一样：[на́шего сосе́да]{.ru}（第 22、34 课）。第 5 空：说的是一次做成的事，主语 [мы]{.ru}，用完成体过去时复数：[подари́ли]{.ru}（第 44、56 课）。第 6 空：[понра́виться]{.ru} 和被喜欢的东西一致，主语是复数的 [та́почки]{.ru}：[понра́вились]{.ru}；喜欢的人用第三格 [ему́]{.ru}。只看 [ему́]{.ru} 写成 [понра́вился]{.ru} 是常见错误（第 52 课）。第 7 空：主语 [кура́нты]{.ru} 是复数，过去时用 [би́ли]{.ru}（第 91 课）。第 8 空：[поздравля́ть с]{.ru} + 第五格：[с Но́вым го́дом]{.ru}，形容词和名词都要变（第 61、91 课）。第 9 空：[жела́ть]{.ru} 后面祝愿的东西用第二格，和前面的 [сча́стья]{.ru} 一样：[здоро́вья]{.ru}（第 92 课）。第 10 空：[е́сли бы]{.ru} 句的主句用 [бы]{.ru} + 过去时，说话人是男性：[сиде́л]{.ru}。[Е́сли бы не …]{.ru} 是“要不是……”（第 94 课）。
