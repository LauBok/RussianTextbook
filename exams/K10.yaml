    answer: рабо́тает с 10.00 до 23.00
  - stem: Ко́ля хо́чет пойти́ на като́к три́дцать пе́рвого декабря́ по́сле рабо́ты, в семь часо́в ве́чера. Что он уви́дит?
    options: [Като́к уже́ не рабо́тает., На ка́тке игра́ет му́зыка., У ка́тка выходно́й день., На ка́тке переры́в 20 мину́т.]
    answer: Като́к уже́ не рабо́тает.
  - stem: Студе́нт без конько́в хо́чет ката́ться два часа́. Он запла́тит ___ рубле́й.
