- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Но́вый год в Росси́и**

    Но́вый год — са́мый люби́мый пра́здник в Росси́и. Его́ ждут весь год. В конце́ декабря́ почти́ в ка́ждом до́ме стои́т ёлка, а на ней вися́т игру́шки. В це́нтре Москвы́ то́же стоя́т больши́е ёлки. Пе́ред пра́здником все покупа́ют пода́рки, поэ́тому в конце́ декабря́ в ка́ждом магази́не о́чередь.

    Де́ти ждут Де́да Моро́за и Снегу́рочку. Дед Моро́з — ста́рый челове́к в кра́сном пальто́, а Снегу́рочка — его́ вну́чка. Дед Моро́з да́рит ка́ждому ребёнку пода́рок. Ма́ленькие де́ти ду́мают, что пода́рки под ёлкой — от Де́да Моро́за.

    Три́дцать пе́рвого декабря́ ве́чером вся семья́ сиди́т за столо́м. На столе́ обяза́тельно есть сала́т оливье́: без него́ пра́здник — не пра́здник. В по́лночь бьют кремлёвские кура́нты, и все говоря́т: «С Но́вым го́дом!» Пото́м мно́гие иду́т гуля́ть, а спать ложа́тся то́лько у́тром.

    Пе́рвого января́ — выходно́й, и мно́гие встаю́т то́лько днём. Зи́мние кани́кулы в Росси́и до́лгие: шко́льники и мно́гие рабо́чие отдыха́ют почти́ две неде́ли.

    Седьмо́го января́ в Росси́и Рождество́. Во Фра́нции Рождество́ два́дцать пя́того декабря́, а ру́сская це́рковь живёт по ста́рому календарю́. А трина́дцатого января́ ве́чером мно́гие ещё раз встреча́ют Но́вый год. Э́то «ста́рый Но́вый год». Иностра́нцы снача́ла не понима́ют: как Но́вый год мо́жет быть ста́рым? А в Кита́е гла́вный пра́здник го́да — Пра́здник весны́. Он быва́ет в январе́ и́ли в феврале́.
    :::
  passage_zh: |
    **俄罗斯的新年**

    新年是俄罗斯人最喜爱的节日，大家盼它一整年。十二月底几乎家家都摆着一棵枞树，树上挂着玩具。莫斯科市中心也立着大枞树。节前大家都买礼物，所以十二月底每家商店都排着队。

    孩子们盼着严寒老人和雪姑娘。严寒老人是一位穿红大衣的老人，雪姑娘是他的孙女。严寒老人给每个孩子送一件礼物。小孩子们以为枞树下的礼物是严寒老人送的。

    十二月三十一日晚上全家人围坐在桌旁。桌上一定有奥利维耶沙拉：没有它就不像过节。午夜克里姆林宫的钟声敲响，大家说：“新年快乐！”然后很多人出门散步，到早上才睡觉。

    一月一日放假，很多人到中午才起床。俄罗斯的冬假很长：中小学生和很多工人差不多休息两个星期。

    一月七日是俄罗斯的圣诞节。法国的圣诞节是十二月二十五日，而俄罗斯的教会按旧历过节。一月十三日晚上很多人再过一次新年，这就是“旧新年”。外国人起初不明白：新年怎么会是旧的呢？而在中国，一年里最重要的节日是春节，在一月或二月。
  why: 第 1 题，[Снегу́рочка — его́ вну́чка]{.ru}。第 2 题，推断题：文中说小孩子们“以为”枞树下的礼物是严寒老人送的，言外之意是礼物其实是家里大人买来放在树下的。第 3 题，推断题：法国的圣诞节在 12 月 25 日，俄罗斯在 1 月 7 日，文中给出的原因是 [ру́сская це́рковь живёт по ста́рому календарю́]{.ru}。第 4 题，与原文不符的说法：原文说除夕夜很多人 [спать ложа́тся то́лько у́тром]{.ru}，一月一日放假，不是早起；其他三项原文都说了。第 5 题，主旨题：全文从十二月底的枞树一直讲到一月十三日的旧新年，讲的是俄罗斯人怎样过新年和圣诞节；严寒老人、沙拉、假期都是其中的一部分。
  items:
  - stem: Снегу́рочка — ___ Де́да Моро́за.
    options: [дочь, жена́, вну́чка, сестра́]
    answer: вну́чка
  - stem: Ма́ленький ма́льчик получи́л пода́рок под ёлкой. Э́тот пода́рок, наве́рное, купи́ли ___.
    options: [его́ роди́тели, Дед Моро́з и Снегу́рочка, его́ шко́льные друзья́, сосе́ди]
    answer: его́ роди́тели
  - stem: Рождество́ в Росси́и не в декабре́, потому́ что ___.
    options: [в декабре́ у всех кани́кулы, це́рковь живёт по ста́рому календарю́, в декабре́ о́чень хо́лодно, в декабре́ уже́ есть Но́вый год]
    answer: це́рковь живёт по ста́рому календарю́
  - stem: 'В статье́ не так: ___.'
    options: [на столе́ есть сала́т оливье́, в по́лночь бьют кура́нты, Снегу́рочка — вну́чка Де́да Моро́за, пе́рвого января́ все встаю́т ра́но]
    answer: пе́рвого января́ все встаю́т ра́но
  - stem: Э́та статья́ расска́зывает, как ___.
    options: [Дед Моро́з да́рит пода́рки, гото́вят сала́т оливье́, в Росси́и встреча́ют Но́вый год и Рождество́, шко́льники отдыха́ют зимо́й]
    answer: в Росси́и встреча́ют Но́вый год и Рождество́
