    options: [но́чью такси́ не рабо́тает, 'у неё ма́ло де́нег: биле́т был дорого́й', у неё большо́й чемода́н, на такси́ е́хать до́льше]
    answer: 'у неё ма́ло де́нег: биле́т был дорого́й'
