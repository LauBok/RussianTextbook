lesson: K10
heading: 第十套
range: L01-L99
names: [Соко́льники, Ко́стя, Серге́й, Яросла́вль, Ле́на, Ната́ша, Ирку́тск, Байка́л, Сиби́рь, Ли́за, Анто́н, Евге́ний Оне́гин, Евге́ний, Оне́гин, Большо́й теа́тр, Ко́ля, Новосиби́рск, Екатеринбу́рг, Ура́л, Пе́тя, Ша́рик, Ли Мин, Ли, Мин]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[пальто́]{.ru} 是不变格的中性名词，物主代词用中性 [моё]{.ru}。后面的 [его́]{.ru} 只能排除阴性和复数，阳性、中性都用 [его́]{.ru}，所以要自己知道 [пальто́]{.ru} 是中性（第 3、5、8 课）。第 2 题：住在市中心的大街上，后面用 [поэ́тому]{.ru} 引出结果，家里总是吵：[шу́мно]{.ru}；[ти́хо]{.ru} 和原因不合，[хо́лодно]{.ru}、[темно́]{.ru} 不是住在大街上的结果（第 67、84 课）。第 3 题：不能去看电影，原因是晚上要上课：[заня́тия]{.ru}；放假、有空、休息日都不是去不了的理由（第 57、93 课）。第 4 题：“谁的公寓”用第二格表示所属，形容词和物主代词都要变成阴性第二格：[мое́й ста́ршей сестры́]{.ru}（第 33、34 课）。第 5 题：[три]{.ru} 后面用单数第二格 [студе́нтки]{.ru}（第 35 课）。第 6 题：[весь ве́чер]{.ru} 说动作持续了多久，要用未完成体 [чита́л]{.ru}；完成体不和表示持续的时间连用（第 42、97 课）。第 7 题：“在几号”用序数词第二格加月份第二格，不加前置词：[двена́дцатого ма́я]{.ru}；[двена́дцатое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 8 题：问年龄，人用第三格：[Ско́лько вам лет?]{.ru}，和回答里的 [Мне]{.ru} 对应（第 53 课）。第 9 题：后半句说这里是医院，意思是禁止，用 [нельзя́]{.ru}；[мо́жно]{.ru} 是允许，[ну́жно, на́до]{.ru} 是必须（第 54 课）。第 10 题：“通过电视看”用 [по]{.ru} + 第三格：[по телеви́зору]{.ru}，和 [по телефо́ну]{.ru} 一样（第 51、57 课）。第 11 题：[С удово́льствием]{.ru} 是接受邀请，接着说明星期六有空：[свобо́дна]{.ru}；[занята́]{.ru}、[больна́]{.ru} 和接受邀请矛盾，[должна́]{.ru} 后面要接不定式（第 59 课）。第 12 题：四个前置词表处所时都要求第五格，不能靠词尾排除，要看意思：灯挂在桌子的上方，桌上才亮，用 [над]{.ru}“在……上方”；[под]{.ru} 是“在……下面”，[за]{.ru} 是“在……后面”，[пе́ред]{.ru} 是“在……前面”，灯挂在这些地方都照不亮桌面（第 66 课）。第 13 题：[кото́рый]{.ru} 的性和数跟它所指的 [музе́й]{.ru} 一致（阳性单数），格却由它在从句里的作用决定：它是 [нахо́дится]{.ru} 的主语，用第一格 [кото́рый]{.ru}。照抄前面 [в музе́е]{.ru} 的第六格写成 [кото́ром]{.ru} 是常见错误；[кото́рая]{.ru}、[кото́рые]{.ru} 性数不对（第 79 课）。第 14 题：[ходи́ть по]{.ru} + 第三格表示在一个地方到处走，[три часа́]{.ru} 说持续多久，用 [ходи́ли]{.ru}；[идём]{.ru} 是现在时，[пошли́]{.ru} 表示出发，不和持续时间连用，[ходи́ть]{.ru} 是不定式，句子缺谓语（第 72 课）。第 15 题：后面是第三格 [дру́гу]{.ru}，去某人那里用 [к]{.ru} + 第三格；[у, от, с]{.ru} 都不接第三格（第 57、74 课）。第 16 题：外面严寒，出门要戴上帽子：[наде́нь]{.ru}；[сними́]{.ru} 意思相反；主句是对 [ты]{.ru} 的建议，要用命令式，[наде́ть]{.ru} 是不定式，[наде́л]{.ru} 是过去时（第 55、83 课）。第 17 题：主语是人，说“生病”用第一个 [боле́ть]{.ru}：[боле́ет]{.ru}；[боли́т, боля́т]{.ru} 的主语是身体部位；[бо́лен]{.ru} 是阳性，和 [сестра́]{.ru} 不一致（第 84、85 课）。第 18 题：问的是“在哪儿”（[рабо́тал]{.ru}），用第六格；[Ура́л]{.ru} 和 [Кавка́з]{.ru} 一样是用 [на]{.ru} 的山区地名：[на Ура́ле]{.ru}；[на Ура́л]{.ru} 是第四格，回答 [куда́]{.ru}；[в Ура́ле]{.ru}、[в Ура́л]{.ru} 前置词用错了（第 11、74 课）。第 19 题：转述带疑问词的问句，保留疑问词 [когда́]{.ru}；[ли]{.ru} 用于不带疑问词的问句，不放在从句开头（第 88、89 课）。第 20 题：[поздравля́ть]{.ru} 祝贺的事由用 [с]{.ru} + 第五格：[с пра́здником]{.ru}（第 91 课）。第 21 题：[подари́ть кому́ что]{.ru}：送给的人用第三格，送的东西用第四格，所以是 [свое́й подру́ге тёплый шарф]{.ru}；[шарф]{.ru} 是非动物名词，第四格同第一格。把人写成第四格 [свою́ подру́гу]{.ru}，或者把东西写成第二格、第三格，都是常见错误。礼物是娜塔莎送给她自己的朋友的，用 [свой]{.ru}（第 87、92 课）。第 22 题：[собира́ться]{.ru} 后面接不定式；说的是一次具体的出行，用完成体 [пое́хать]{.ru}；[е́здить]{.ru} 是经常往返（第 73、93 课）。第 23 题：[е́сли бы]{.ru} 表示不真实的条件（明天会下雨，去不成），主句也要用 [бы]{.ru} + 过去时形式：[пое́хали бы]{.ru}，即使说的是明天的事也用过去时形式；[пое́дем]{.ru} 用在真实的条件句 [е́сли]{.ru} 里；[пое́хали]{.ru}、[е́здили]{.ru} 没有 [бы]{.ru}，成了已经发生的事（第 83、94 课）。第 24 题：[весь]{.ru} 跟 [день]{.ru} 一致，阳性第四格同第一格：[весь день]{.ru}（第 97 课）。第 25 题：否定句里“没有人”用 [никого́]{.ru}（[не́ было]{.ru} + 第二格）；后半句 [все бы́ли в теа́тре]{.ru} 说的是人，[ничего́]{.ru} 指东西（第 98 课）。
  items:
  - stem: — Где ___ пальто́? Я его́ не ви́жу.
    options: [мой, моё, моя́, мои́]
    answer: моё
  - stem: Я живу́ в це́нтре, на большо́й у́лице, поэ́тому у меня́ в кварти́ре всегда́ ___.
    options: [шу́мно, ти́хо, хо́лодно, темно́]
    answer: шу́мно
  - stem: 'Извини́, я не могу́ пойти́ в кино́: ве́чером у меня́ ___.'
    options: [кани́кулы, выходно́й, свобо́дное вре́мя, заня́тия]
    answer: заня́тия
  - stem: Э́то кварти́ра ___.
    options: [моя́ ста́ршая сестра́, мое́й ста́ршей сестре́, мое́й ста́ршей сестры́, мою́ ста́ршую сестру́]
    answer: мое́й ста́ршей сестры́
  - stem: На ле́кции бы́ли то́лько три ___.
    options: [студе́нтка, студе́нтку, студе́нткой, студе́нтки]
    answer: студе́нтки
  - stem: Вчера́ я ___ рома́н весь ве́чер.
    options: [прочита́л, чита́л, чита́ю, прочита́ю]
    answer: чита́л
  - stem: Моя́ сестра́ родила́сь ___.
    options: [двена́дцатое ма́я, двена́дцатый май, двена́дцатого ма́я, в двена́дцатое ма́я]
    answer: двена́дцатого ма́я
  - stem: — Ско́лько ___ лет? — Мне два́дцать.
    options: [вам, вас, вы, ва́ми]
    answer: вам
  - stem: Здесь ___ кури́ть, э́то больни́ца.
    options: [мо́жно, нельзя́, ну́жно, на́до]
    answer: нельзя́
  - stem: Мой брат смо́трит футбо́л ___ телеви́зору.
    options: [на, в, по, к]
    answer: по
  - stem: — Ната́ша, пойдём в суббо́ту в теа́тр? — С удово́льствием! В суббо́ту я ___.
    options: [занята́, больна́, должна́, свобо́дна]
    answer: свобо́дна
  - stem: Ла́мпа виси́т ___ столо́м, поэ́тому на столе́ всегда́ светло́.
    options: [под, за, над, пе́ред]
    answer: над
  - stem: Вчера́ мы бы́ли в музе́е, ___ нахо́дится ря́дом с Кремлём.
    options: [кото́ром, кото́рый, кото́рая, кото́рые]
    answer: кото́рый
  - stem: Ве́чером мы ___ по Не́вскому проспе́кту три часа́.
    options: [ходи́ть, пошли́, идём, ходи́ли]
    answer: ходи́ли
  - stem: Сейча́с я иду́ ___ дру́гу, он попроси́л помо́чь ему́ с матема́тикой.
    options: [у, к, от, с]
    answer: к
  - stem: Е́сли ты пойдёшь гуля́ть, ___ ша́пку, на у́лице моро́з.
    options: [сними́, наде́ть, наде́нь, наде́л]
    answer: наде́нь
  - stem: Моя́ сестра́ ___ уже́ неде́лю, у неё грипп.
    options: [боли́т, боля́т, боле́ет, бо́лен]
    answer: боле́ет
  - stem: Ле́том мой брат рабо́тал ___.
    options: [в Ура́ле, на Ура́л, на Ура́ле, в Ура́л]
    answer: на Ура́ле
  - stem: Друг спроси́л, ___ начина́ется конце́рт.
    options: [ли, что, е́сли, когда́]
    answer: когда́
  - stem: Мы поздра́вили учи́тельницу ___.
    options: [пра́здник, с пра́здником, на пра́здник, пра́здника]
    answer: с пра́здником
  - stem: На день рожде́ния Ната́ша подари́ла ___.
    options: [свою́ подру́гу тёплый шарф, свое́й подру́ге тёплого ша́рфа, свое́й подру́ге тёплый шарф, свою́ подру́гу тёплому ша́рфу]
    answer: свое́й подру́ге тёплый шарф
  - stem: На кани́кулы Ли Мин собира́ется ___ домо́й, в Пеки́н.
    options: [е́здить, е́дет, пое́дет, пое́хать]
    answer: пое́хать
  - stem: Е́сли бы за́втра не́ было дождя́, мы ___ на да́чу.
    options: [пое́дем, пое́хали бы, пое́хали, е́здили]
    answer: пое́хали бы
  - stem: Мы бы́ли в Коло́менском ___ день.
    options: [вся, всё, весь, все]
    answer: весь
  - stem: Ве́чером до́ма ___ не́ было, все бы́ли в теа́тре.
    options: [никто́, ничего́, никого́, никому́]
    answer: никого́
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Чужо́й чемода́н**

    В ию́ле я (1) []{.blank} на по́езде из Москвы́ домо́й, в Яросла́вль. Ря́дом со мной сиде́л молодо́й челове́к. У него́ был большо́й си́ний чемода́н — (2) []{.blank}, как мой. Всю доро́гу мы (3) []{.blank}. Он рассказа́л, что у́чится в Москве́, а ле́то бу́дет жить (4) []{.blank}, (5) []{.blank} в Яросла́вле. А я сказа́ла, что у меня́ в чемода́не пода́рки для всей (6) []{.blank}: для ма́мы — краси́вая ча́шка, для па́пы — ша́хматы, а для мла́дшего бра́та — футбо́льный мяч.

    До́ма меня́ уже́ (7) []{.blank} ма́ма, па́па и брат Ко́стя. Я откры́ла чемода́н — и ничего́ не (8) []{.blank}: там лежа́ли чужи́е ве́щи, кни́ги и большо́й торт. «А где мой (9) []{.blank}? — спроси́л Ко́стя. — Ты же обеща́ла!»

    Тогда́ я (10) []{.blank} си́ний чемода́н в по́езде. Э́то был не (11) []{.blank} чемода́н! А мой сейча́с, наве́рное, стои́т у (12) []{.blank}. Но где она́ живёт? Я не зна́ла да́же, как (13) []{.blank} э́того молодо́го челове́ка.

    И тут Ко́стя показа́л на чемода́н: на нём была́ ма́ленькая за́писка — «Серге́й» и но́мер телефо́на. Я сра́зу (14) []{.blank}.

    «Наконе́ц! — сказа́л Серге́й. — Мы с ба́бушкой откры́ли чемода́н, а там ча́шка, ша́хматы и мяч. Ба́бушка спра́шивает, (15) []{.blank} я на́чал игра́ть в футбо́л».

    Ба́бушка Серге́я жила́ (16) []{.blank} от нас, на сосе́дней у́лице, и че́рез полчаса́ он уже́ стоя́л у на́шей (17) []{.blank} с мои́м чемода́ном. Ка́ждый взял (18) []{.blank} чемода́н, а торт Серге́й оста́вил нам: «Э́то (19) []{.blank}. Ба́бушке я куплю́ друго́й».

    Ко́стя был о́чень (20) []{.blank}: тепе́рь у него́ бы́ли и мяч, и торт.
    :::
  passage_zh: |
    **别人的箱子**

    七月我坐火车从莫斯科回家，回雅罗斯拉夫尔。我旁边坐着一个小伙子。他有一只蓝色的大箱子，跟我的一模一样。一路上我们都在聊天。他说他在莫斯科上大学，夏天要住在奶奶家，奶奶也住在雅罗斯拉夫尔。我说我箱子里装着给全家的礼物：给妈妈的是一只漂亮的杯子，给爸爸的是一副国际象棋，给弟弟的是一个足球。

    妈妈、爸爸和弟弟科斯佳已经在家里等我了。我打开箱子，一下子懵了：里面是别人的东西、几本书和一个大蛋糕。“我的足球呢？”科斯佳问，“你可是答应过的！”

    这时我想起了火车上那只蓝箱子。这不是我的箱子！我的箱子现在大概在他奶奶家呢。可他奶奶住在哪儿呢？我连那个小伙子叫什么都不知道。

    就在这时，科斯佳指了指箱子：上面贴着一张小纸条，写着“谢尔盖”和一个电话号码。我马上打了电话。

    “总算找到您了！”谢尔盖说，“我和奶奶打开箱子，里面是杯子、象棋和足球。奶奶问我什么时候开始踢足球了。”

    谢尔盖的奶奶住得离我们不远，就在隔壁那条街上，半个小时以后他已经提着我的箱子站在我们家门口了。我们各自拿回了自己的箱子，蛋糕谢尔盖留给了我们：“这个给你弟弟。给奶奶我再买一个。”

    科斯佳高兴极了：现在他足球也有了，蛋糕也有了。
  why: 第 1 空：一次具体的行程，坐火车朝一个方向去，用定向的 [е́хала]{.ru}；[е́здила]{.ru} 是往返或经常去，[ходи́ла]{.ru}、[шла]{.ru} 是步行，和 [на по́езде]{.ru} 矛盾（第 24、25、72 课）。第 2 空：要读完全文才能确定：后面她拿错了箱子，回家打开才发现，说明两只箱子一模一样：[тако́й же]{.ru}。[не тако́й]{.ru} 语法上通，但箱子不一样就不会拿错；[друго́й]{.ru} 不和 [как]{.ru} 连用；[ма́ленький]{.ru} 和前面的 [большо́й]{.ru} 矛盾。第 3 空：[всю доро́гу]{.ru} 说动作持续的时间，用未完成体 [разгова́ривали]{.ru}；[поговори́ли]{.ru} 是完成体，不和表示持续的时间连用；[разгова́риваем]{.ru} 是现在时，和全文的过去时不合，[разгова́ривать]{.ru} 是不定式，句子缺谓语（第 42、97 课）。第 4 空：[жить]{.ru} 回答“在哪儿”，在某人家里用 [у]{.ru} + 第二格：[у ба́бушки]{.ru}；[к ба́бушке]{.ru} 回答 [куда́]{.ru}，[от ба́бушки]{.ru} 回答 [отку́да]{.ru}（第 74 课）。第 5 空：“我”也是回雅罗斯拉夫尔，奶奶“也”住在那儿：[то́же]{.ru}；后文奶奶家就在“我”家隔壁街，也说明是同一个城市。[ещё]{.ru}、[ско́ро]{.ru} 放在这里意思不通；他们还在火车上，不能说 [здесь]{.ru}。第 6 空：[для]{.ru} 要求第二格：[для всей семьи́]{.ru}；[весь]{.ru} 的阴性第二格 [всей]{.ru} 和第三格、第五格同形，不能靠它判断，要知道 [для]{.ru} 支配哪个格（第 37、97 课）。第 7 空：主语是后面的 [ма́ма, па́па и брат Ко́стя]{.ru}，三个人，用复数 [жда́ли]{.ru}。只看紧挨着的 [ма́ма]{.ru} 选 [ждала́]{.ru} 是常见错误；[ждут]{.ru}、[ждёт]{.ru} 是现在时，和全文的过去时不合。第 8 空：冒号后面说箱子里是别人的东西，她一时“没弄明白”：[ничего́ не поняла́]{.ru}；[ничего́ не уви́дела]{.ru} 和后面列出的东西矛盾，[купи́ла]{.ru}、[забы́ла]{.ru} 和打开箱子接不上（第 98 课）。第 9 空：第一段说足球是给弟弟的礼物，科斯佳问的是自己的足球：[мяч]{.ru}；蛋糕就在箱子里，用不着问；[чемода́н]{.ru}、[телефо́н]{.ru} 都不是答应给他的东西。第 10 空：她这时“想起”了火车上那只一样的箱子，才明白怎么回事：[вспо́мнила]{.ru}；[забы́ла]{.ru} 意思相反，[купи́ла]{.ru}、[спроси́ла]{.ru} 和 [си́ний чемода́н в по́езде]{.ru} 搭配不通（第 96 课）。第 11 空：她发现箱子不是自己的：[не мой]{.ru}。[свой]{.ru} 要指回本句的主语，这句的主语是 [э́то]{.ru}，不能用；[его́]{.ru} 正好说反了，箱子就是他的；[твой]{.ru} 没有对谁说话（第 87 课）。第 12 空：“在某人那里”用 [у]{.ru} + 第二格：[у его́ ба́бушки]{.ru}。主语是 [мой]{.ru}（我的箱子），奶奶是小伙子的，不能用 [свое́й]{.ru}；[мое́й ба́бушки]{.ru} 不合文意；[его́ ба́бушке]{.ru} 是第三格（第 31、87 课）。第 13 空：问名字用 [как зову́т]{.ru} + 第四格：[как зову́т э́того молодо́го челове́ка]{.ru}；这是不定人称句，动词用复数第三人称；[зовёт]{.ru} 是单数，要有主语，[зову́]{.ru} 是第一人称，[звать]{.ru} 是不定式（第 4、22 课）。第 14 空：[сра́зу]{.ru} 说一次做成的事，用完成体过去时 [позвони́ла]{.ru}；[звони́ла]{.ru} 是未完成体，不和 [сра́зу]{.ru} 连用；[позвоню́]{.ru}、[звоню́]{.ru} 时态不对（第 45、51 课）。第 15 空：转述带疑问词的问题，奶奶问他“什么时候”开始踢足球的——她看见足球，以为外孙踢上球了，这是玩笑：[когда́]{.ru}；[ли]{.ru} 不能放在从句开头，[что]{.ru}、[е́сли]{.ru} 不引出问句（第 88、89 课）。第 16 空：后面说就在隔壁街，半小时就到：[недалеко́ от нас]{.ru}；[далеко́]{.ru} 和隔壁街矛盾；[ря́дом]{.ru} 要接 [с]{.ru} + 第五格，[напро́тив]{.ru} 直接接第二格，都不和 [от]{.ru} 连用（第 37、66 课）。第 17 空：[у]{.ru} + 第二格；[дверь]{.ru} 是以 [-ь]{.ru} 结尾的阴性名词，第二格 [две́ри]{.ru}。前面的 [на́шей]{.ru} 在阴性第二、三、五、六格都一样，不能靠它判断（第 33、34 课）。第 18 空：[ка́ждый]{.ru} 拿的是他自己的箱子，指回主语用 [свой]{.ru}；[его́]{.ru} 会理解成别人的，[мой]{.ru}、[твой]{.ru} 和 [ка́ждый]{.ru} 对不上（第 87、97 课）。第 19 空：蛋糕给谁，用第三格：[ва́шему бра́ту]{.ru}；第二格、第五格、第六格都不表示“给”（第 56、92 课）。第 20 空：科斯佳得到了足球，又得到了蛋糕，所以很高兴：[рад]{.ru}；[за́нят]{.ru}、[бо́лен]{.ru} 和冒号后的内容接不上，[до́лжен]{.ru} 后面要接不定式（第 59 课）。
  items:
  - options: [е́здила, е́хала, ходи́ла, шла]
    answer: е́хала
  - options: [не тако́й, друго́й, тако́й же, ма́ленький]
    answer: тако́й же
  - options: [разгова́ривать, поговори́ли, разгова́ривали, разгова́риваем]
    answer: разгова́ривали
  - options: [к ба́бушке, у ба́бушки, от ба́бушки, ба́бушку]
    answer: у ба́бушки
  - options: [ещё, здесь, то́же, ско́ро]
    answer: то́же
  - options: [семье́, семью́, семьёй, семьи́]
    answer: семьи́
  - options: [ждала́, жда́ли, ждут, ждёт]
    answer: жда́ли
  - options: [уви́дела, купи́ла, поняла́, забы́ла]
    answer: поняла́
  - options: [торт, чемода́н, телефо́н, мяч]
    answer: мяч
  - options: [вспо́мнила, забы́ла, купи́ла, спроси́ла]
    answer: вспо́мнила
  - options: [свой, мой, его́, твой]
    answer: мой
  - options: [свое́й ба́бушки, мое́й ба́бушки, его́ ба́бушки, его́ ба́бушке]
    answer: его́ ба́бушки
  - options: [зовёт, звать, зову́, зову́т]
    answer: зову́т
  - options: [звони́ла, позвони́ла, позвоню́, звоню́]
    answer: позвони́ла
  - options: [ли, что, когда́, е́сли]
    answer: когда́
  - options: [далеко́, ря́дом, напро́тив, недалеко́]
    answer: недалеко́
  - options: [две́ри, дверь, две́рью, двере́й]
    answer: две́ри
  - options: [его́, свой, мой, твой]
    answer: свой
  - options: [ва́шего бра́та, ва́шим бра́том, ва́шему бра́ту, ва́шем бра́те]
    answer: ва́шему бра́ту
  - options: [за́нят, бо́лен, до́лжен, рад]
    answer: рад
- id: e3
  type: choice
  task: 阅读理解（一）：阅读下面的信，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    Дорога́я Ле́на!

    Спаси́бо за письмо́. Ты пи́шешь, что в декабре́ роди́тели бу́дут в командиро́вке и Но́вый год ты бу́дешь встреча́ть одна́. Нет, так не бу́дет! Встреча́й его́ у нас, в Ирку́тске. Я уже́ спроси́ла ма́му и па́пу, они́ бу́дут о́чень ра́ды.

    Из Москвы́ к нам мо́жно лете́ть на самолёте — э́то шесть часо́в, и́ли е́хать на по́езде — четы́ре дня. Биле́т на по́езд сто́ит ме́ньше, и ты уви́дишь всю Сиби́рь. Но тогда́ покупа́й биле́т сейча́с: в конце́ декабря́ все е́дут домо́й, и купи́ть его́ бу́дет тру́дно.

    Встре́чу тебя́ я. То́лько по́мни, что у меня́ ещё экза́мены: после́дний — два́дцать седьмо́го, и до э́того я с утра́ до ве́чера сижу́ в библиоте́ке.

    Возьми́ са́мые тёплые ве́щи: у нас сейча́с ми́нус три́дцать. Сапоги́ мо́жешь не покупа́ть, я дам тебе́ свои́ ста́рые.

    Ты же давно́ хоте́ла уви́деть Байка́л. Зимо́й он о́чень краси́вый, и по о́зеру мо́жно ходи́ть пешко́м! По́сле пра́здника пое́дем туда́ на два дня.

    Напиши́, когда́ ку́пишь биле́т. И ещё: ма́ма спра́шивает, что ты не ешь. Она́ уже́ ду́мает, что пригото́вить на пра́здничный стол.

    Жду отве́та!

    Твоя́ Ната́ша
    :::
  passage_zh: |
    亲爱的列娜：

    谢谢你的来信。你说十二月你爸妈要出差，新年只能你一个人过。不行，不能这样！到我们伊尔库茨克来过吧。我已经问过爸爸妈妈了，他们会非常高兴的。

    从莫斯科到我们这儿可以坐飞机，六个小时；也可以坐火车，要四天。火车票便宜些，而且你能看到整个西伯利亚。不过要坐火车的话，现在就买票：十二月底大家都回家，那时候就难买了。

    我去接你。只是别忘了，我还有考试：最后一门在二十七号，在那之前我从早到晚都待在图书馆。

    带上最暖和的衣服：我们这儿现在零下三十度。靴子你不用买，我把我的旧靴子给你穿。

    你不是早就想看看贝加尔湖吗？冬天的贝加尔湖非常美，还可以在湖面上走！过完节我们去那儿玩两天。

    买好票告诉我。还有：我妈妈问你有什么不吃的。她已经在想节日的餐桌上做些什么了。

    等你回信！

    你的娜塔莎
  why: 第 1 题，细节题：信的开头说 [роди́тели бу́дут в командиро́вке]{.ru}。[все е́дут домо́й]{.ru} 在文中说的是年底买票难，不是列娜的朋友；有考试的是娜塔莎；文中没有说列娜没钱。第 2 题，推断题：娜塔莎要亲自接列娜，可二十七号考完最后一门之前她整天在图书馆，所以列娜最早二十八号到；火车要走四天，二十五号出发、二十九号到才合适。十八号、二十号、二十二号出发，分别是二十二号、二十四号、二十六号到，那时娜塔莎还在考试，接不了她（第 47、49 课）。第 3 题，细节题：[в конце́ декабря́ все е́дут домо́й, и купи́ть его́ бу́дет тру́дно]{.ru}。火车票便宜、要走四天都是文中的话，但不是现在就要买票的原因；娜塔莎的考试和买票无关。第 4 题，推断人物意图：妈妈问列娜有什么不吃的，下一句说 [Она́ уже́ ду́мает, что пригото́вить на пра́здничный стол]{.ru}，她是在为节日的饭菜做准备。文中没有说列娜病了，也没有说她不吃鱼；“妈妈不会做饭”与原文相反。第 5 题，主旨题：全信从请列娜来过新年说起，交通、接站、带衣服、去贝加尔湖、问饮食，都是在安排这次做客，所以写信是为了邀请她来伊尔库茨克过新年。贝加尔湖和考试都只是信里的一部分；买票是请列娜自己买，不是让她给娜塔莎买。
  items:
  - stem: Ле́на бу́дет встреча́ть Но́вый год одна́, потому́ что ___.
    options: [все её друзья́ е́дут домо́й, у неё экза́мены, её роди́тели бу́дут в командиро́вке, у неё нет де́нег на биле́т]
    answer: её роди́тели бу́дут в командиро́вке
  - stem: Е́сли Ле́на пое́дет на по́езде, ей лу́чше пое́хать из Москвы́ ___ декабря́.
    options: [восемна́дцатого, двадца́того, два́дцать второ́го, два́дцать пя́того]
    answer: два́дцать пя́того
  - stem: Биле́т на по́езд на́до купи́ть сейча́с, потому́ что ___.
    options: [он сто́ит ме́ньше, по́езд идёт четы́ре дня, в конце́ декабря́ его́ тру́дно купи́ть, у Ната́ши ско́ро экза́мены]
    answer: в конце́ декабря́ его́ тру́дно купи́ть
  - stem: Ма́ма Ната́ши спра́шивает, что Ле́на не ест, потому́ что ___.
    options: [Ле́на сейча́с больна́, она́ гото́вит пра́здничный стол, Ле́на не ест ры́бу, ма́ма не уме́ет гото́вить]
    answer: она́ гото́вит пра́здничный стол
  - stem: Ната́ша пи́шет э́то письмо́, потому́ что хо́чет ___.
    options: [рассказа́ть о Байка́ле, пригласи́ть Ле́ну в Ирку́тск на Но́вый год, попроси́ть Ле́ну купи́ть ей биле́т, рассказа́ть о свои́х экза́менах]
    answer: пригласи́ть Ле́ну в Ирку́тск на Но́вый год
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Ли́за]{.sp} Анто́н, приве́т! Ты по́мнишь, что в суббо́ту у ма́мы день рожде́ния?

    [Анто́н]{.sp} По́мню, коне́чно. То́лько я ещё не зна́ю, что ей подари́ть. А ты?

    [Ли́за]{.sp} А у меня́ есть иде́я. Ма́ма давно́ говори́т, что хо́чет послу́шать «Евге́ния Оне́гина» в Большо́м теа́тре. Дава́й пода́рим ей биле́ты!

    [Анто́н]{.sp} Хоро́шая иде́я. Но одна́ она́ не пойдёт.

    [Ли́за]{.sp} Коне́чно, нет. Два биле́та: ей и па́пе.

    [Анто́н]{.sp} Па́пе? Он же о́перу не лю́бит. В про́шлый раз он в теа́тре спал!

    [Ли́за]{.sp} Зна́ю. Но с ма́мой в её день рожде́ния он пойдёт.

    [Анто́н]{.sp} Ла́дно. А ско́лько сто́ят биле́ты?

    [Ли́за]{.sp} Я смотре́ла: на суббо́ту ещё есть по девятьсо́т рубле́й. Ка́ждый пла́тит полови́ну?

    [Анто́н]{.sp} Да, коне́чно. Слу́шай, я же рабо́таю ря́дом с теа́тром, могу́ купи́ть их в обе́д.

    [Ли́за]{.sp} Отли́чно! А я куплю́ цветы́ и торт.

    [Анто́н]{.sp} Подожди́. Но о́пера же ве́чером. Когда́ же мы бу́дем пить чай с то́ртом?

    [Ли́за]{.sp} В воскресе́нье! Пригласи́м их на обе́д к тебе́: у тебя́ кварти́ра бо́льше.

    [Анто́н]{.sp} Хорошо́. Тогда́ за́втра покупа́ю биле́ты. Пока́!
    :::
  passage_zh: |
    ::: translation
    [丽莎]{.sp} 安东，你好！你记得星期六是妈妈的生日吗？

    [安东]{.sp} 当然记得。只是我还不知道送她什么。你呢？

    [丽莎]{.sp} 我倒有个主意。妈妈早就说想去大剧院听《叶甫盖尼·奥涅金》。咱们送她票吧！

    [安东]{.sp} 好主意。不过她不会一个人去的。

    [丽莎]{.sp} 当然不会。两张票：她一张，爸爸一张。

    [安东]{.sp} 爸爸？他可不喜欢歌剧。上次他在剧院里睡着了！

    [丽莎]{.sp} 我知道。可是妈妈过生日，他会去的。

    [安东]{.sp} 好吧。票多少钱？

    [丽莎]{.sp} 我看过了：星期六的还有九百卢布一张的。咱们一人出一半？

    [安东]{.sp} 当然。对了，我就在剧院旁边上班，午饭的时候可以去买。

    [丽莎]{.sp} 太好了！那我买花和蛋糕。

    [安东]{.sp} 等等。歌剧是晚上的。那我们什么时候喝茶吃蛋糕呢？

    [丽莎]{.sp} 星期天！请他们到你家吃午饭：你的房子大些。

    [安东]{.sp} 好。那我明天去买票。再见！
    :::
  why: 第 1 题，细节题：[Ма́ма давно́ говори́т, что хо́чет послу́шать «Евге́ния Оне́гина»]{.ru}。《叶甫盖尼·奥涅金》是歌剧，不是芭蕾；在剧院旁边上班的是安东，不是丽莎；票价文中没说便宜。第 2 题，细节题：安东说 [Он же о́перу не лю́бит. В про́шлый раз он в теа́тре спал!]{.ru}；“爸爸星期六上班”“爸爸没时间”文中都没有；[Ли́за]{.ru} 说的 [с ма́мой в её день рожде́ния он пойдёт]{.ru} 恰恰说明他会去。第 3 题，推断题：要买两张票，每张九百卢布，共一千八百卢布，两人一人一半，安东出九百卢布。只看到“一半”算成四百五十，或者把总价当成一个人出的钱，都是常见错误（第 78 课）。第 4 题，细节题：[я же рабо́таю ря́дом с теа́тром, могу́ купи́ть их в обе́д]{.ru}；花和蛋糕是丽莎买；文中没有说安东钱多或者丽莎没时间。第 5 题，推断题：歌剧在星期六晚上，所以一家人吃蛋糕改到星期天，丽莎说 [Пригласи́м их на обе́д к тебе́]{.ru}，[к тебе́]{.ru} 指安东家；“星期六晚上”“看完歌剧以后”都被安东的问话排除了；去的是安东家，不是丽莎家。
