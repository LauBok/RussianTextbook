lesson: K10
heading: 第十套
range: L01-L99
names: [Ната́ша, Ли Мин, Ли, Мин, И́горь, Ли́за, Серёжа, Екатери́на, Ива́новна, Екатери́на Ива́новна, Ко́стя, Ви́ктор, Па́влович, Ви́ктор Па́влович, Пе́тя, Анто́н, Ми́тя]
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[пальто́]{.ru} 是不变格的中性名词，物主代词用中性 [моё]{.ru}（第 3、5、8 课）。第 2 题：住在市中心的大街上，后面用 [поэ́тому]{.ru} 引出结果，家里总是吵：[шу́мно]{.ru}；[ти́хо]{.ru} 和原因不合，[хо́лодно]{.ru}、[темно́]{.ru} 不是住在大街上的结果（第 67、84 课）。第 3 题：不能去看电影，原因是晚上要上课：[заня́тия]{.ru}；放假、有空、休息日都不是去不了的理由（第 57、93 课）。第 4 题：“谁的公寓”用第二格表示所属，形容词和物主代词都要变成阴性第二格：[мое́й ста́ршей сестры́]{.ru}（第 33、34 课）。第 5 题：[три]{.ru} 后面用单数第二格 [студе́нтки]{.ru}（第 35 课）。第 6 题：[весь ве́чер]{.ru} 说动作持续了多久，要用未完成体 [чита́л]{.ru}；完成体不和表示持续的时间连用（第 42、97 课）。第 7 题：“在几号”用序数词第二格加月份第二格，不加前置词：[двена́дцатого ма́я]{.ru}；[двена́дцатое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 8 题：问年龄，人用第三格：[Ско́лько вам лет?]{.ru}，和回答里的 [Мне]{.ru} 对应（第 53 课）。第 9 题：后半句说这里是医院，意思是禁止，用 [нельзя́]{.ru}；[мо́жно]{.ru} 是允许，[ну́жно, на́до]{.ru} 是必须（第 54 课）。第 10 题：“通过电视看”用 [по]{.ru} + 第三格：[по телеви́зору]{.ru}，和 [по телефо́ну]{.ru} 一样（第 51、57 课）。第 11 题：[С удово́льствием]{.ru} 是接受邀请，接着说明星期六有空：[свобо́дна]{.ru}；[занята́]{.ru}、[больна́]{.ru} 和接受邀请矛盾，[должна́]{.ru} 后面要接不定式（第 59 课）。第 12 题：后面的 [окно́м]{.ru} 是第五格，四个前置词里只有 [пе́ред]{.ru} 要求第五格；[на, в]{.ru} 表处所要第六格，[у]{.ru} 要第二格（第 66 课）。第 13 题：很热的季节是夏天 [ле́том]{.ru}；莫斯科的冬天、秋天不会很热，春天一般也只是暖和（第 69 课）。第 14 题：[ходи́ть по]{.ru} + 第三格表示在一个地方到处走，[три часа́]{.ru} 说持续多久，用 [ходи́ли]{.ru}；[идём]{.ru} 是现在时，[пошли́]{.ru} 表示出发，不和持续时间连用，[ходи́ть]{.ru} 是不定式，句子缺谓语（第 72 课）。第 15 题：后面是第三格 [дру́гу]{.ru}，去某人那里用 [к]{.ru} + 第三格；[у, от, с]{.ru} 都不接第三格（第 57、74 课）。第 16 题：外面严寒，出门要戴上帽子：[наде́нь]{.ru}；[сними́]{.ru} 意思相反，[потеря́й]{.ru}、[прода́й]{.ru} 不合情理（第 55、83 课）。第 17 题：主语是人，说“生病”用第一个 [боле́ть]{.ru}：[боле́ет]{.ru}；[боли́т, боля́т]{.ru} 的主语是身体部位；[бо́лен]{.ru} 是阳性，和 [сестра́]{.ru} 不一致（第 84、85 课）。第 18 题：比较的对象用 [чем]{.ru} 引出（第 86 课）。第 19 题：转述带疑问词的问句，保留疑问词 [когда́]{.ru}；[ли]{.ru} 用于不带疑问词的问句，不放在从句开头（第 88、89 课）。第 20 题：[поздравля́ть]{.ru} 祝贺的事由用 [с]{.ru} + 第五格：[с пра́здником]{.ru}（第 91 课）。第 21 题：哥哥爱读书，送书最合适：[кни́гу]{.ru}；球、吉他、象棋和“爱读书”没有关系（第 92 课）。第 22 题：[собира́ться]{.ru} 后面接不定式；说的是一次具体的出行，用完成体 [пое́хать]{.ru}；[е́здить]{.ru} 是经常往返（第 73、93 课）。第 23 题：[е́сли бы]{.ru} 表示不真实的条件，主句也要用 [бы]{.ru} + 过去时形式：[пое́хал бы]{.ru}；[пое́ду]{.ru} 用在真实的条件句里（第 94 课）。第 24 题：[весь]{.ru} 跟 [день]{.ru} 一致，阳性第四格同第一格：[весь день]{.ru}（第 97 课）。第 25 题：否定句里“没有人”用 [никого́]{.ru}（[не́ было]{.ru} + 第二格）；后半句 [все бы́ли в теа́тре]{.ru} 说的是人，[ничего́]{.ru} 指东西（第 98 课）。
  items:
  - stem: — Чьё э́то пальто́? — Э́то ___ пальто́.
    options: [мой, моё, моя́, мои́]
    answer: моё
  - stem: Я живу́ в це́нтре, на большо́й у́лице, поэ́тому у меня́ в кварти́ре всегда́ ___.
    options: [шу́мно, ти́хо, хо́лодно, темно́]
    answer: шу́мно
  - stem: 'Извини́, я не могу́ пойти́ в кино́: ве́чером у меня́ ___.'
    options: [кани́кулы, выходно́й, свобо́дное вре́мя, заня́тия]
    answer: заня́тия
  - stem: Э́то кварти́ра ___.
    options: [моя́ ста́ршая сестра́, мое́й ста́ршей сестре́, мое́й ста́ршей сестры́, мою́ ста́ршую сестру́]
    answer: мое́й ста́ршей сестры́
  - stem: На ле́кции бы́ли то́лько три ___.
    options: [студе́нтка, студе́нтку, студе́нткой, студе́нтки]
    answer: студе́нтки
  - stem: Вчера́ я ___ рома́н весь ве́чер.
    options: [прочита́л, чита́л, чита́ю, прочита́ю]
    answer: чита́л
  - stem: Моя́ сестра́ родила́сь ___.
    options: [двена́дцатое ма́я, двена́дцатый май, двена́дцатого ма́я, в двена́дцатое ма́я]
    answer: двена́дцатого ма́я
  - stem: — Ско́лько ___ лет? — Мне два́дцать.
    options: [вам, вас, вы, ва́ми]
    answer: вам
  - stem: Здесь ___ кури́ть, э́то больни́ца.
    options: [мо́жно, нельзя́, ну́жно, на́до]
    answer: нельзя́
  - stem: Мой брат смо́трит футбо́л ___ телеви́зору.
    options: [на, в, по, к]
    answer: по
  - stem: — Ната́ша, пойдём в суббо́ту в теа́тр? — С удово́льствием! В суббо́ту я ___.
    options: [занята́, больна́, должна́, свобо́дна]
    answer: свобо́дна
  - stem: Ко́шка сиди́т ___ окно́м и смо́трит на у́лицу.
    options: [пе́ред, на, в, у]
    answer: пе́ред
  - stem: В Москве́ ___ иногда́ быва́ет о́чень жа́рко.
    options: [ле́том, зимо́й, о́сенью, весно́й]
    answer: ле́том
  - stem: Ве́чером мы ___ по Не́вскому проспе́кту три часа́.
    options: [ходи́ть, пошли́, идём, ходи́ли]
    answer: ходи́ли
  - stem: Сейча́с я иду́ ___ дру́гу, он про́сит помо́чь с матема́тикой.
    options: [у, к, от, с]
    answer: к
  - stem: Е́сли ты пойдёшь гуля́ть, ___ ша́пку, на у́лице моро́з.
    options: [сними́, потеря́й, наде́нь, прода́й]
    answer: наде́нь
  - stem: Моя́ сестра́ ___ уже́ неде́лю, у неё грипп.
    options: [боли́т, боля́т, боле́ет, бо́лен]
    answer: боле́ет
  - stem: Петербу́рг ме́ньше, ___ Москва́.
    options: [чем, как, что, когда́]
    answer: чем
  - stem: Друг спроси́л, ___ начина́ется конце́рт.
    options: [ли, что, е́сли, когда́]
    answer: когда́
  - stem: Мы поздра́вили учи́тельницу ___.
    options: [пра́здник, с пра́здником, на пра́здник, пра́здника]
    answer: с пра́здником
  - stem: Мой брат о́чень лю́бит чита́ть, поэ́тому на Но́вый год я подарю́ ему́ ___.
    options: [кни́гу, мяч, гита́ру, ша́хматы]
    answer: кни́гу
  - stem: На кани́кулы Ли Мин собира́ется ___ домо́й, в Пеки́н.
    options: [е́здить, е́дет, пое́дет, пое́хать]
    answer: пое́хать
  - stem: Е́сли бы у меня́ бы́ло вре́мя, я ___ с ва́ми.
    options: [пое́ду, пое́хал бы, пое́хал, е́здил]
    answer: пое́хал бы
  - stem: Мы бы́ли в Коло́менском ___ день.
    options: [вся, всё, весь, все]
    answer: весь
  - stem: Ве́чером до́ма ___ не́ было, все бы́ли в теа́тре.
    options: [никто́, ничего́, никого́, никому́]
    answer: никого́
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    Дорога́я ба́бушка!

    Сего́дня седьмо́е января́. Поздравля́ю тебя́ с (1) []{.blank}! С Но́вым го́дом я поздра́вил тебя́ по телефо́ну, а сего́дня пишу́ тебе́ письмо́.

    Извини́, что на Но́вый год я не́ был до́ма. В декабре́ у меня́ была́ (2) []{.blank}, и после́дний экза́мен был то́лько три́дцать пе́рвого декабря́. Весь дека́брь я сиде́л в (3) []{.blank} и занима́лся. Я (4) []{.blank} не е́здил и почти́ не гуля́л. Тепе́рь все экза́мены я уже́ (5) []{.blank}, и у меня́ кани́кулы!

    Но́вый год я (6) []{.blank} в общежи́тии. Мой сосе́д по ко́мнате — студе́нт из (7) []{.blank}. Он (8) []{.blank} не встреча́л Но́вый год в Росси́и, поэ́тому мы всё де́лали, как ру́сские: купи́ли (9) []{.blank}, пригото́вили сала́т оливье́, а в по́лночь (10) []{.blank} кура́нты по ра́дио. В на́шей ко́мнате ма́ло ме́ста, поэ́тому ёлка была́ (11) []{.blank}, но о́чень краси́вая. Сосе́д рассказа́л мне, что у них гла́вный пра́здник — Пра́здник весны́, и (12) []{.blank} меня́ в Пеки́н. Я бы пое́хал, но в феврале́ у меня́ уже́ бу́дут (13) []{.blank}.

    Ба́бушка, ты спра́шивала, не (14) []{.blank} ли мне. Не волну́йся: я ношу́ твой (15) []{.blank} и твои́ тёплые носки́. Зимо́й в Петербу́рге (16) []{.blank}, чем у нас в Новосиби́рске: сего́дня здесь то́лько ми́нус пять. Но здесь всегда́ о́чень (17) []{.blank}.

    Че́рез неде́лю я пое́ду домо́й. Я уже́ купи́л (18) []{.blank} на самолёт. Ма́ма написа́ла, что де́душка (19) []{.blank}. Как он себя́ чу́вствует? У него́ опя́ть боли́т спина́? Переда́й ему́ приве́т. Ско́ро я бу́ду до́ма, и мы (20) []{.blank} бу́дем пить чай на ку́хне, как ра́ньше.

    Жела́ю вам здоро́вья!

    Твой И́горь
    :::
  passage_zh: |
    亲爱的奶奶：

    今天是一月七日。祝你圣诞快乐！新年我已经在电话里给你拜过年了，今天给你写封信。

    对不起，新年我没在家过。十二月我考试，最后一门考试直到十二月三十一日才考完。整个十二月我都坐在图书馆里学习。我哪儿也没去，几乎也没出去散步。现在考试全都考完了，我放假了！

    新年我是在宿舍过的。我的室友是一个中国留学生。他从来没在俄罗斯过过新年，所以我们样样都照俄罗斯人的规矩来：买了一棵枞树，做了奥利维耶沙拉，午夜从收音机里听克里姆林宫的钟声。我们房间地方小，所以枞树很小，可是很漂亮。室友跟我说，他们那儿最重要的节日是春节，还请我去北京。我倒是想去，可二月我已经要上课了。

    奶奶，你问我冷不冷。别担心：我戴着你的围巾，穿着你织的厚袜子。彼得堡的冬天比咱们新西伯利亚暖和：今天这儿才零下五度。可是这儿总是风很大。

    一个星期以后我就回家。飞机票我已经买好了。妈妈信里说爷爷病了。他身体怎么样？背又疼了吗？代我问候他。我很快就到家了，我们又可以像以前那样一起在厨房里喝茶了。

    祝你们身体健康！

    你的伊戈尔
  why: 第 1 空：前一句说今天是一月七日，正是俄罗斯的圣诞节，祝贺的是 [с Рождество́м]{.ru}；下一句 [С Но́вым го́дом я поздра́вил тебя́ по телефо́ну]{.ru} 说明新年已经祝贺过了；信里没有提到生日或婚礼。第 2 空：下文说最后一门考试、[все экза́мены]{.ru}，十二月是考试期 [се́ссия]{.ru}；[сва́дьба]{.ru}、[командиро́вка]{.ru}、[пого́да]{.ru} 都和考试无关。第 3 空：整月 [занима́лся]{.ru}，复习备考的地方是图书馆 [библиоте́ке]{.ru}；游泳馆、剧院、餐厅不是学习的地方，也和“几乎没出去”矛盾。第 4 空：后面有 [не е́здил]{.ru}，否定句里“哪儿也没去”要用否定副词 [никуда́]{.ru}；[туда́]{.ru}、[сюда́]{.ru}、[куда́]{.ru} 不和 [не]{.ru} 构成“哪儿也不”。第 5 空：后半句 [и у меня́ кани́кулы]{.ru} 说明考试已经考完、通过了：[сдал]{.ru}；[забы́л]{.ru}、[проигра́л]{.ru}、[потеря́л]{.ru} 都不会带来假期。第 6 空：“过新年”说 [встреча́ть Но́вый год]{.ru}，下一句也用了 [встреча́л Но́вый год]{.ru}；[иска́л]{.ru}、[покупа́л]{.ru}、[рисова́л]{.ru} 不能和“新年”搭配。第 7 空：下文说他们那儿最重要的节日是春节，又请伊戈尔去北京，可见室友是中国人：[Кита́я]{.ru}；法国、日本、意大利都对不上北京。第 8 空：[поэ́тому]{.ru} 后面说他们照俄罗斯人的规矩过节，原因是他“从来没有”在俄罗斯过过新年：[никогда́]{.ru}，和 [не]{.ru} 连用；[всегда́]{.ru}、[ча́сто]{.ru}、[ка́ждый год]{.ru} 和“所以要照规矩学着过”的因果相反。第 9 空：下文说 [ёлка была́ …, но о́чень краси́вая]{.ru}，他们买的是枞树 [ёлку]{.ru}；帽子、汽车、外套都不是过新年的规矩。第 10 空：克里姆林宫的钟声是用耳朵“听”的，又说是从收音机里：[слу́шали]{.ru}；[чита́ли]{.ru}、[рисова́ли]{.ru}、[продава́ли]{.ru} 都不合。第 11 空：前面说房间里地方小，[поэ́тому]{.ru} 引出结果：枞树小 [ма́ленькая]{.ru}；[огро́мная]{.ru}、[высо́кая]{.ru}、[больша́я]{.ru} 都和“地方小”的因果相反。第 12 空：室友“请”伊戈尔去北京他家：[пригласи́л]{.ru}；下一句 [Я бы пое́хал]{.ru} 说明这是一个邀请；[потеря́л]{.ru}、[забы́л]{.ru}、[узна́л]{.ru} 和“去北京”接不上。第 13 空：[Я бы пое́хал, но…]{.ru} 说的是去不成的原因：二月开学要上课 [заня́тия]{.ru}；[кани́кулы]{.ru} 正好可以去，不是原因，[пода́рки]{.ru}、[игру́шки]{.ru} 不合文意。第 14 空：伊戈尔回答说戴着围巾、穿着厚袜子，可见奶奶问的是冷不冷：[хо́лодно]{.ru}；[ску́чно]{.ru}、[жа́рко]{.ru}、[интере́сно]{.ru} 都和这个回答对不上。第 15 空：防寒戴的是围巾 [шарф]{.ru}，和后面的 [тёплые носки́]{.ru} 一起说明穿得暖；伞、电话、词典都不保暖。第 16 空：冒号后面说“今天这儿才零下五度”，比新西伯利亚暖和：[тепле́е]{.ru}；[холодне́е]{.ru} 意思相反，[вкусне́е]{.ru}、[ме́ньше]{.ru} 不能说天气。第 17 空：[Но]{.ru} 引出彼得堡冬天的缺点，用 [ве́трено]{.ru}；[тепло́]{.ru}、[интере́сно]{.ru}、[ве́село]{.ru} 都是好事，和 [Но]{.ru} 的转折不合。第 18 空：后面是 [на самолёт]{.ru}，买的是机票 [биле́т]{.ru}；蛋糕、词典、纪念品不和 [на самолёт]{.ru} 搭配。第 19 空：后面问爷爷 [Как он себя́ чу́вствует? У него́ опя́ть боли́т спина́?]{.ru}，说明妈妈信里说他病了：[заболе́л]{.ru}；[верну́лся]{.ru}、[опозда́л]{.ru}、[засмея́лся]{.ru} 都引不出这些问题。第 20 空：[ско́ро я бу́ду до́ма]{.ru} 之后，说的是和家人“一起”喝茶：[вме́сте]{.ru}；[ра́ньше]{.ru}、[вчера́]{.ru}、[давно́]{.ru} 和将来时 [бу́дем пить]{.ru} 矛盾。
  items:
