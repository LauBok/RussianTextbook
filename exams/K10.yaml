- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: 你是在莫斯科（[Москва́]{.ru}）学习的中国留学生陈静（[Чэнь Цзин]{.ru}），住在 18 号公寓。明天早上你坐飞机回国过寒假，一月二十五日回来。楼上的邻居尼娜·伊万诺夫娜（[Ни́на Ива́новна]{.ru}）答应你不在的时候帮你浇花（[полива́ть цветы́]{.ru}），可是今天晚上她不在家。给她写一张便条，和钥匙一起放进她家的信箱，40–60 词。要点：1. 说明你明天回国，几号回来；2. 告诉她钥匙就在便条旁边；3. 请她每星期浇两次花，说明花在哪儿；4. 感谢她的帮助，祝她新年快乐。
    length: 40–60
    model: |
      Ни́на Ива́новна, здра́вствуйте!

      За́втра у́тром я лечу́ домо́й, в Кита́й, а верну́сь два́дцать пя́того января́. Вот ключ от мое́й кварти́ры. Полива́йте, пожа́луйста, цветы́ два ра́за в неде́лю. Они́ стоя́т на окне́ в большо́й ко́мнате, а ещё оди́н — на ку́хне. Большо́е спаси́бо за по́мощь! Поздравля́ю вас с Но́вым го́дом! Жела́ю вам здоро́вья и сча́стья!

      Чэнь Цзин, кварти́ра 18
    rubric:
    - 13–15 分：四个要点齐全，有称呼和署名，对长辈用 [вы]{.ru}，请求说得清楚、礼貌；语法错误不超过两处
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或对邻居用了 [ты]{.ru}，或语法错误较多
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（四个要点各 1.5 分，称呼和署名 1 分）；语法 5 分（日期的第二格、命令式和 [пожа́луйста]{.ru}、[на]{.ru} / [в]{.ru} + 第六格、[поздравля́ть с]{.ru} + 第五格、[жела́ть]{.ru} + 第二格，每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: 范文约 55 词，按邻居拿到便条以后要做的事排：先说你走多久，再说钥匙、浇几次、花在哪儿，最后道谢和祝贺。花放在哪儿一定要写清楚，邻居是照着便条去做的。语法上：[верну́сь два́дцать пя́того января́]{.ru} 说“在哪一天”，序数词和月份都用第二格，不加前置词（第 49 课）；[ключ от кварти́ры]{.ru} 是“房门钥匙”的固定说法，[от]{.ru} + 第二格（第 37 课）；[Полива́йте, пожа́луйста]{.ru} 用未完成体命令式，因为是要反复做的事（第 46 课）；[два ра́за в неде́лю]{.ru} 说多久一次（第 45 课）；[на окне́]{.ru}、[в большо́й ко́мнате]{.ru}、[на ку́хне]{.ru} 是 [на]{.ru} / [в]{.ru} + 第六格，形容词也要变（第 11、18 课）；[Спаси́бо за по́мощь]{.ru} 是 [за]{.ru} + 第四格（第 87 课）；[Поздравля́ю вас с Но́вым го́дом]{.ru}、[Жела́ю вам здоро́вья и сча́стья]{.ru} 是第 91 课的祝贺和祝愿句型。对长辈用 [вы]{.ru}，署名后加上公寓号，邻居一看就知道是谁。
  - prompt: |
      阅读下面的故事开头，续写 50–80 词，写格里沙（[Гри́ша]{.ru}）怎么去的学校、有没有赶上考试、最后怎么样，给故事一个结尾。

      [В пя́тницу у Гри́ши был после́дний экза́мен, в де́вять часо́в утра́. Всю ночь шёл си́льный снег. В во́семь Гри́ша вы́шел из до́ма и уви́дел, что на остано́вке стоя́т лю́ди, а авто́бусов нет. «Авто́бусы сего́дня не хо́дят, — сказа́л ему́ мужчи́на в большо́й ша́пке. — Везде́ снег». Пешко́м до университе́та — полтора́ часа́.]{.ru}
    length: 50–80
    model: |
      Гри́ша поду́мал мину́ту и пошёл домо́й. До́ма он взял свои́ лы́жи. По бе́лым у́лицам е́хать на лы́жах бы́ло легко́, и в полови́не девя́того он уже́ был у университе́та.

      В аудито́рии сиде́л то́лько преподава́тель: он живёт ря́дом. «Молоде́ц, Гри́ша! — сказа́л он. — Други́е студе́нты мне уже́ позвони́ли: у них экза́мен бу́дет в понеде́льник. А вы сдади́те сего́дня».

      Гри́ша сдал экза́мен на пятёрку. А домо́й он то́же пое́хал на лы́жах.
    rubric:
    - 13–15 分：办法合理，和开头衔接自然（公共汽车不通、走路来不及），写清怎么到的学校、考试怎样，有一个结尾；语法错误不超过两处
    - 9–12 分：情节基本完整，但有一处交代不清，或语法错误三四处
    - 5–8 分：只写了怎么去学校，没有写考试和结尾，或情节和开头对不上（比如照样坐公共汽车去了），或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（办法 2 分，考试 2 分，结尾 2 分）；语法 6 分（运动动词、时间的表达、动词的体、格每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: 范文约 70 词，分三段：想办法、到学校、结尾。开头已经堵死了两条路——公共汽车不开，走路要一个半小时，续写要找第三个办法，也可以写他打电话给老师、搭邻居的车等，只要合情理。语法上：[пошёл домо́й]{.ru}、[вы́шел из до́ма]{.ru} 是带前缀的运动动词，一次具体的动作（第 73 课）；[е́хать на лы́жах]{.ru}“滑雪去”，和 [е́хать на авто́бусе]{.ru} 一样用 [на]{.ru} + 第六格（第 67 课）；[в полови́не девя́того]{.ru} 是“八点半”，[полови́на]{.ru} 后面用下一个钟点的序数词第二格（第 54 课）；[экза́мен бу́дет]{.ru} 是 [быть]{.ru} 的将来时（第 41 课），[сдади́те]{.ru} 是完成体将来时，说的是今天就考完（第 43 课）；[сдал экза́мен на пятёрку]{.ru} 是“考了五分”（第 89 课）。结尾不必写道理，用一个具体的细节收住：回家他也是滑雪回去的。
