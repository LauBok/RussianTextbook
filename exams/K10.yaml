- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: 你是在莫斯科学习的中国留学生李明，这一学期住在一户俄罗斯人家里。明天早上你坐飞机回北京过寒假，房东家的儿子彼佳（[Пе́тя]{.ru}）还在学校，你给他留一张便条，40–60 词。要点：1. 明天早上你坐飞机回北京；2. 感谢彼佳和他的家人这一学期的照顾；3. 你给彼佳留了一件礼物（中国象棋），放在他房间的桌子上；4. 二月你就回来，到时候一起去滑冰；5. 祝他身体健康。
    length: 40–60
    model: |
      Пе́тя, приве́т!

      За́втра у́тром я лечу́ в Пеки́н. Спаси́бо тебе́ и твое́й семье́ за всё! В э́том семе́стре мне бы́ло о́чень хорошо́ у вас. Мой пода́рок лежи́т на столе́ в твое́й ко́мнате. Э́то кита́йские ша́хматы. В феврале́ я верну́сь, и мы вме́сте пойдём на като́к. Жела́ю тебе́ здоро́вья!

      Твой Ли Мин
    rubric:
    - 13–15 分：五个要点齐全，称呼、祝愿和落款得体；语法错误不超过两处
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或语法错误较多，部分句子意思不清
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（五个要点各 1 分，称呼和落款 1 分，语气亲切得体 1 分）；语法 5 分（[жела́ть]{.ru} 和 [спаси́бо]{.ru} 的搭配、动词的时和体、前置词和格每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: 范文约 50 词，按要点的顺序写。语法上：[лечу́]{.ru} 是 [лете́ть]{.ru} 的现在时，表示已经定好的行程（第 94 课）；[Спаси́бо тебе́ и твое́й семье́]{.ru} 感谢的人用第三格（第 51、56 课）；[мне бы́ло о́чень хорошо́ у вас]{.ru} 是无人称句的过去时（第 58 课）；[лежи́т на столе́ в твое́й ко́мнате]{.ru} 是 [на]{.ru}、[в]{.ru} + 第六格（第 11、19 课）；[верну́сь]{.ru}、[пойдём]{.ru} 是完成体将来时（第 47、73 课）；[Жела́ю тебе́ здоро́вья!]{.ru} 祝愿的内容用第二格（第 91 课）。给朋友写便条用 [ты]{.ru}，落款写 [Твой]{.ru} 加自己的名字（第 95 课）。
  - prompt: |
      阅读下面的故事开头，续写 50–80 词，写安东和米佳想了什么办法、新年夜是怎样过的，给故事一个结尾。

      [Три́дцать пе́рвого декабря́ па́па сказа́л: «Сего́дня ёлку ку́пят Анто́н и Ми́тя». Бра́тья пое́хали на ры́нок. Там они́ до́лго выбира́ли и наконе́ц купи́ли са́мую большу́ю и краси́вую ёлку. Но до́ма они́ уви́дели, что ёлка сли́шком высо́кая: в ко́мнате она́ не стои́т! Ми́тя сказа́л: «Е́сли бы мы купи́ли ма́ленькую ёлку, всё бы́ло бы хорошо́!»]{.ru}
    length: 50–80
    model: |
      Анто́н поду́мал и сказа́л: «Мо́жно поста́вить ёлку в гости́ной. Там ко́мната бо́льше». Они́ поста́вили ёлку у окна́, и она́ стоя́ла там о́чень хорошо́.

      Пото́м бра́тья украша́ли её весь ве́чер, а ма́ма гото́вила сала́т оливье́. Когда́ па́па верну́лся с рабо́ты, он уви́дел ёлку и засмея́лся: «Тако́й ёлки у нас никогда́ не́ было!»

      В по́лночь, когда́ би́ли кура́нты, все стоя́ли о́коло ёлки и говори́ли: «С Но́вым го́дом!»
    rubric:
    - 13–15 分：办法合理，新年夜有两三件具体的事和一个结尾，和开头衔接自然；语法错误不超过两处
    - 9–12 分：内容基本完整，情节简单，或语法错误三四处
    - 5–8 分：只写了办法，没有写新年夜和结尾，或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（办法 2 分，新年夜的经过 2 分，结尾 2 分）；语法 6 分（动词的体、[когда́]{.ru} 从句、否定代词、第五格每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: 范文约 75 词，分三段：想办法、准备过节、午夜。语法上：[Мо́жно поста́вить]{.ru} 是 [мо́жно]{.ru} + 不定式，提出办法（第 54 课）；[бо́льше]{.ru} 是比较级（第 86 课）；[поста́вили]{.ru} 说一次的结果，[украша́ли … весь ве́чер]{.ru} 说持续的过程，用未完成体（第 44、97 课）；[Когда́ … верну́лся …, он уви́дел]{.ru} 两个完成体前后相继（第 82 课）；[никогда́ не́ было]{.ru} 是双重否定，[не́ было]{.ru} 后面用第二格 [Тако́й ёлки]{.ru}（第 32、98 课）；[С Но́вым го́дом!]{.ru} 用 [с]{.ru} + 第五格（第 91 课）。结尾回到新年夜的钟声，和开头的“买枞树”首尾呼应。
