- id: e8
  type: open
  task: 写作。
  points: 15
  items:
  - prompt: 你是在莫斯科（[Москва́]{.ru}）学习的中国留学生李明（[Ли Мин]{.ru}）。你的俄罗斯朋友科斯佳（[Ко́стя]{.ru}）请你星期六去他家参加他的生日聚会，可是那天你们班要去圣彼得堡（[Петербу́рг]{.ru}）参观，票一个月前就买好了。给科斯佳写一张便条，40–60 词。要点：1. 谢谢他的邀请；2. 说明星期六去不了和原因；3. 祝他生日快乐，并写一两句祝愿；4. 约他星期天晚上在咖啡馆见面，你给他准备了礼物。
    length: 40–60
    model: |
      Ко́стя, приве́т!

      Спаси́бо, что пригласи́л меня́ на день рожде́ния! Но в суббо́ту я не смогу́ быть у тебя́: на́ша гру́ппа е́дет на экску́рсию в Петербу́рг. Биле́ты мы купи́ли ещё ме́сяц наза́д. Поздравля́ю тебя́ с днём рожде́ния! Жела́ю тебе́ здоро́вья и сча́стья! Дава́й встре́тимся в воскресе́нье ве́чером в кафе́ ря́дом с университе́том. У меня́ есть для тебя́ пода́рок.

      Твой Ли Мин
    rubric:
    - 13–15 分：四个要点齐全，原因说清楚，称呼、祝愿和落款得体；语法错误不超过两处
    - 9–12 分：漏一个要点，或语法错误三四处，但不影响理解
    - 5–8 分：漏两个要点，或语法错误较多，部分句子意思不清
    - 0–4 分：只写出一两个要点，或大部分句子看不懂
    - 分项参考：内容 7 分（四个要点各 1.5 分，称呼和落款 1 分）；语法 5 分（[поздравля́ть с]{.ru} + 第五格、[жела́ть]{.ru} + 第二格、运动动词和前置词、动词的时和体每两处错误扣 1 分）；词汇 3 分
    - 字数少于 30 词的，最多给 8 分
    notes: 范文约 55 词，按要点的顺序写：先道谢，再说去不了和原因，然后祝贺，最后约时间。语法上：[Спаси́бо, что пригласи́л]{.ru} 用 [что]{.ru} 引出感谢的事（第 53、88 课）；[не смогу́ быть у тебя́]{.ru} 是 [мочь]{.ru} 的完成体将来时加 [у]{.ru} + 第二格（第 74、97 课）；[е́дет на экску́рсию в Петербу́рг]{.ru} 用定向动词现在时表示已经定好的行程（第 24、73 课）；[ме́сяц наза́д]{.ru} 表示多久以前（第 47 课）；[Поздравля́ю тебя́ с днём рожде́ния]{.ru} 是 [с]{.ru} + 第五格，[день]{.ru} 的第五格是 [днём]{.ru}（第 91 课）；[Жела́ю тебе́ здоро́вья и сча́стья]{.ru} 祝愿的内容用第二格（第 92 课）；[Дава́й встре́тимся]{.ru} 提出建议（第 72 课）。给朋友的便条用 [ты]{.ru}，落款写 [Твой]{.ru} 加自己的名字（第 95 课）。
  - prompt: |
      阅读下面的故事开头，续写 50–80 词，写丽莎（[Ли́за]{.ru}）想了什么办法、到了奶奶家以后怎么样，给故事一个结尾。

      [В воскресе́нье у ба́бушки был день рожде́ния. Ли́за купи́ла большо́й краси́вый торт и пое́хала к ней на авто́бусе. В авто́бусе бы́ло мно́го люде́й, и Ли́за всю доро́гу держа́ла торт в рука́х. Но когда́ она́ посмотре́ла на него́, она́ чуть не запла́кала: торт был уже́ совсе́м не краси́вый! А го́сти у ба́бушки уже́ сиде́ли за столо́м и жда́ли её.]{.ru}
    length: 50–80
    model: |
      Магази́н был далеко́, и купи́ть друго́й торт Ли́за уже́ не могла́. Тогда́ она́ купи́ла у остано́вки цветы́ и пошла́ к ба́бушке.

      Ба́бушка откры́ла дверь, и Ли́за сказа́ла: «С днём рожде́ния! Вот цветы́. А торт у меня́ есть, но он тепе́рь не о́чень краси́вый». Ба́бушка посмотре́ла на торт и засмея́лась: «Ничего́! Мы его́ съеди́м, и никто́ не узна́ет, како́й он был».

      Торт был о́чень вку́сный, и ве́чером от него́ ничего́ не оста́лось.
    rubric:
    - 13–15 分：办法合理，到奶奶家以后有具体的对话或细节，有结尾，和开头衔接自然；语法错误不超过两处
    - 9–12 分：内容基本完整，情节简单，或语法错误三四处
    - 5–8 分：只写了办法，没有写到奶奶家以后和结尾，或语法错误较多
    - 0–4 分：与开头无关，或大部分句子看不懂
    - 分项参考：内容 6 分（办法 2 分，到奶奶家以后 2 分，结尾 2 分）；语法 6 分（动词的体、运动动词、否定代词、[поздравля́ть с]{.ru} 或 [С днём рожде́ния]{.ru}、格每两处错误扣 1 分）；词汇 3 分
    - 字数少于 40 词的，最多给 8 分
    notes: 范文约 70 词，分三段：想办法、到奶奶家、结尾。语法上：[купи́ть друго́й торт … не могла́]{.ru} 用 [мочь]{.ru} 的过去时（第 27 课）；[купи́ла … и пошла́]{.ru} 两个完成体前后相继（第 44、73 课）；[С днём рожде́ния!]{.ru} 是 [с]{.ru} + 第五格（第 91 课）；[никто́ не узна́ет]{.ru}、[ничего́ не оста́лось]{.ru} 是否定代词加 [не]{.ru}（第 98 课）；[како́й он был]{.ru} 是间接问句（第 88 课）。结尾不必写道理，用一个具体的结果收住：蛋糕虽然不好看，最后还是被吃光了。
