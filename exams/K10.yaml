  passage: |
    ::: {.prose lang="ru"}
    *27 декабря́*

    За́втра у́тром я лечу́ домо́й. (1) []{.blank} (весь) у́тро я гуля́ла по це́нтру: хоте́ла ещё раз уви́деть Кремль и Кра́сную пло́щадь. А ве́чером собира́ла чемода́н. Но он не закрыва́лся: веще́й у меня́ ста́ло (2) []{.blank} (мно́го), чем в сентябре́. Тут в дверь позвони́ла Ка́тя из (3) []{.blank} (сосе́дняя ко́мната). Она́ помогла́ (4) []{.blank} (я): се́ла на чемода́н, и че́рез мину́ту он уже́ стоя́л у две́ри.

    Пото́м мы пи́ли чай и вспомина́ли, как познако́мились. Э́то бы́ло в мой пе́рвый день в общежи́тии. Я стоя́ла у две́ри (5) []{.blank} (свой но́вый ключ) в руке́ и не могла́ её откры́ть. Ка́тя откры́ла её сра́зу, а я да́же не могла́ сказа́ть ей «спаси́бо»: по-ру́сски я тогда́ (6) []{.blank} (ничто́) не зна́ла. Я ду́мала, что никогда́ не (7) []{.blank} (смочь) говори́ть по-ру́сски. А сего́дня мы разгова́ривали три часа́ — и всё по-ру́сски!

    Жаль, что я уезжа́ю так ско́ро. Е́сли бы я жила́ здесь ещё ме́сяц, мы бы (8) []{.blank} (пойти́) вме́сте на като́к. Я пригласи́ла Ка́тю ле́том к нам в (9) []{.blank} (Шанха́й), и она́ сказа́ла «да». Сейча́с уже́ двена́дцать, Ка́тя давно́ спит: за́втра (10) []{.blank} (она́) на́до ра́но встава́ть.
    :::
  glossary:
  - {ru: уезжа́ть, pos: impf., zh: （乘车）离开}
  passage_zh: |
    12 月 27 日

    明天早上我就坐飞机回家了。一上午我都在市中心逛：想再看一眼克里姆林宫和红场。晚上收拾箱子。可箱子怎么也合不上：我的东西比九月的时候多了。这时隔壁房间的卡佳来按门铃。她帮了我：往箱子上一坐，不到一分钟，箱子已经立在门口了。

    然后我们喝着茶，回想我们是怎么认识的。那是我住进宿舍的第一天。我手里拿着新钥匙站在门口，怎么也打不开门。卡佳一下子就打开了，可我连一声“谢谢”都不会说：那时候我一句俄语也不会。我以为自己永远也学不会说俄语。可今天我们聊了三个小时，全是用俄语！

    可惜我这么快就要走了。要是我在这儿再住一个月，我们就能一起去溜冰了。我请卡佳夏天到我们上海来，她说“好”。现在已经十二点了，卡佳早就睡了：她明天得早起。
  why: 第 1 空：[у́тро]{.ru} 是中性名词，[весь]{.ru} 用中性第四格 [всё]{.ru}，[всё у́тро]{.ru} 说动作持续了多久，和 [весь ве́чер]{.ru}、[всю ночь]{.ru} 一样不加前置词。照着括号里的 [весь]{.ru} 不变是常见错误（第 97 课）。第 2 空：后面有 [чем в сентябре́]{.ru}，用比较级；[мно́го]{.ru} 的比较级是不规则的 [бо́льше]{.ru}（第 86 课）。第 3 空：[из]{.ru} 要求第二格，形容词和名词都变成阴性第二格：[сосе́дней ко́мнаты]{.ru}（第 34、36 课）。第 4 空：[помо́чь]{.ru} 帮谁用第三格：[мне]{.ru}。按汉语“帮我”写成第四格 [меня́]{.ru} 是常见错误（第 51、52 课）。第 5 空：“拿着钥匙”用 [с]{.ru} + 第五格；[свой]{.ru} 指回主语 [я]{.ru}，阳性第五格 [свои́м]{.ru}，[ключ]{.ru} 的第五格是 [ключо́м]{.ru}（[ж, ш, ч, щ, ц]{.ru} 后带重音写 [-о́м]{.ru}）；[с]{.ru} 后面的词以两个辅音开头，写成 [со]{.ru}。主语是第一人称，用 [мои́м]{.ru} 也对（第 61、65、87 课）。第 6 空：[не зна́ла]{.ru} 的补语带否定，用 [ничего́]{.ru}，和 [не]{.ru} 一起表示“什么都不”；照抄括号里的第一格 [ничто́]{.ru} 不对（第 98 课）。第 7 空：转述当时的想法，俄语保留原来的时：她当时想的是“我永远也不会说俄语”，说的是将来，所以用 [смочь]{.ru} 的将来时 [смогу́]{.ru}。按汉语习惯随主句写成过去时 [смогла́]{.ru} 是常见错误（第 88、97 课）。第 8 空：[е́сли бы]{.ru} 的主句里也用 [бы]{.ru} + 过去时形式；主语是 [мы]{.ru}，用复数 [пошли́]{.ru}；[пойти́]{.ru} 的过去时词干是 [шл-]{.ru}，不能写成 [пойти́ли]{.ru}（第 73、94 课）。第 9 空：[пригласи́ть]{.ru} 请到哪儿，回答 [куда́]{.ru}，用 [в]{.ru} + 第四格；[Шанха́й]{.ru} 是阳性非动物名词，第四格和第一格相同，不变。看见 [в]{.ru} 就写成第六格 [Шанха́е]{.ru} 是常见错误（第 24、30 课）。第 10 空：[на́до]{.ru} 句里，需要做事的人用第三格：[ей]{.ru}（第 52、54 课）。
