lesson: K10
heading: 第十套
range: L01-L99
total: 150
minutes: 120
exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[пальто́]{.ru} 是不变格的中性名词，物主代词用中性 [моё]{.ru}（第 3、5、8 课）。第 2 题：[в]{.ru} + 第六格，[кварти́ра]{.ru} 是阴性，[э́тот]{.ru} 的阴性第六格是 [э́той]{.ru}（第 19 课）。第 3 题：主语 [я]{.ru}，[мочь]{.ru} 的第一人称单数是 [могу́]{.ru}（第 27 课）。第 4 题：“谁的公寓”用第二格表示所属，形容词和物主代词都要变成阴性第二格：[мое́й ста́ршей сестры́]{.ru}（第 33、34 课）。第 5 题：[три]{.ru} 后面用单数第二格 [студе́нтки]{.ru}（第 35 课）。第 6 题：[весь ве́чер]{.ru} 说动作持续了多久，要用未完成体 [чита́л]{.ru}；完成体不和表示持续的时间连用（第 42、97 课）。第 7 题：“在几号”用序数词第二格加月份第二格，不加前置词：[двена́дцатого ма́я]{.ru}；[двена́дцатое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 8 题：问年龄，人用第三格：[Ско́лько вам лет?]{.ru}，和回答里的 [Мне]{.ru} 对应（第 53 课）。第 9 题：后半句说这里是医院，意思是禁止，用 [нельзя́]{.ru}；[мо́жно]{.ru} 是允许，[ну́жно, на́до]{.ru} 是必须（第 54 课）。第 10 题：“通过电视看”用 [по]{.ru} + 第三格：[по телеви́зору]{.ru}，和 [по телефо́ну]{.ru} 一样（第 51、57 课）。第 11 题：[свобо́ден]{.ru} 跟主语的性一致，由美是女性，用 [свобо́дна]{.ru}（第 59 课）。第 12 题：后面的 [окно́м]{.ru} 是第五格，四个前置词里只有 [пе́ред]{.ru} 要求第五格；[на, в]{.ru} 表处所要第六格，[у]{.ru} 要第二格（第 66 课）。第 13 题：“在夏天”用副词 [ле́том]{.ru}，不加前置词（第 69 课）。第 14 题：[ходи́ть по]{.ru} + 第三格表示在一个地方到处走，[три часа́]{.ru} 说持续多久，用 [ходи́ли]{.ru}；[идём]{.ru} 是定向动词，说朝一个方向正在走，[пошли́]{.ru} 表示出发，不和持续时间连用，[ходи́ть]{.ru} 是不定式，句子缺谓语（第 72 课）。第 15 题：后面是第三格 [Ми́ше]{.ru}，去某人那里用 [к]{.ru} + 第三格；[у, от, с]{.ru} 都不接第三格（第 57、74 课）。第 16 题：[е́сли]{.ru} 句的主句可以用命令式提出建议，对 [ты]{.ru} 说 [наде́нь]{.ru}（第 83 课）。第 17 题：主语是人，说“生病”用第一个 [боле́ть]{.ru}：[боле́ет]{.ru}；[боли́т, боля́т]{.ru} 的主语是身体部位；[бо́лен]{.ru} 是阳性，和由美不一致（第 84、85 课）。第 18 题：比较的对象用 [чем]{.ru} 引出（第 86 课）。第 19 题：转述带疑问词的问句，保留疑问词 [когда́]{.ru}；[ли]{.ru} 用于不带疑问词的问句，不放在从句开头（第 88、89 课）。第 20 题：[поздравля́ть]{.ru} 祝贺的事由用 [с]{.ru} + 第五格：[с пра́здником]{.ru}（第 91 课）。第 21 题：[дари́ть кому́ что]{.ru}，送的东西用第四格 [кни́гу]{.ru}，收礼的人 [Ми́ше]{.ru} 已经是第三格（第 92 课）。第 22 题：[собира́ться]{.ru} 后面接不定式；说的是一次具体的出行，用完成体 [пое́хать]{.ru}；[е́здить]{.ru} 是经常往返（第 73、93 课）。第 23 题：[е́сли бы]{.ru} 表示不真实的条件，主句也要用 [бы]{.ru} + 过去时形式：[пое́хал бы]{.ru}；[пое́ду]{.ru} 用在真实的条件句里（第 94 课）。第 24 题：[весь]{.ru} 跟 [день]{.ru} 一致，阳性第四格同第一格：[весь день]{.ru}（第 97 课）。第 25 题：否定句里“没有人”用 [никого́]{.ru}（[не́ было]{.ru} + 第二格）；后半句 [все бы́ли в теа́тре]{.ru} 说的是人，[ничего́]{.ru} 指东西（第 98 课）。
  items:
  - stem: — Чьё э́то пальто́? — Э́то ___ пальто́.
    options: [мой, моё, моя́, мои́]
    answer: моё
  - stem: В ___ кварти́ре живу́т Петро́вы.
    options: [э́той, э́том, э́ту, э́та]
    answer: э́той
  - stem: Я не ___ пойти́ в кино́, у меня́ заня́тия.
    options: [мо́жет, мо́жешь, мо́гут, могу́]
    answer: могу́
  - stem: Э́то кварти́ра ___.
    options: [моя́ ста́ршая сестра́, мое́й ста́ршей сестре́, мое́й ста́ршей сестры́, мою́ ста́ршую сестру́]
    answer: мое́й ста́ршей сестры́
  - stem: На ле́кции бы́ли то́лько три ___.
    options: [студе́нтка, студе́нтку, студе́нткой, студе́нтки]
    answer: студе́нтки
  - stem: Вчера́ я ___ рома́н весь ве́чер.
    options: [прочита́л, чита́л, чита́ю, прочита́ю]
    answer: чита́л
  - stem: Ван Лэй роди́лся ___.
    options: [двена́дцатое ма́я, двена́дцатый май, двена́дцатого ма́я, в двена́дцатое ма́я]
    answer: двена́дцатого ма́я
  - stem: — Ско́лько ___ лет? — Мне два́дцать.
    options: [вам, вас, вы, ва́ми]
    answer: вам
  - stem: Здесь ___ кури́ть, э́то больни́ца.
    options: [мо́жно, нельзя́, ну́жно, на́до]
    answer: нельзя́
  - stem: Ми́ша смо́трит футбо́л ___ телеви́зору.
    options: [на, в, по, к]
    answer: по
  - stem: — Ю́ми, ты ___ в суббо́ту ве́чером? — Да, а что?
    options: [свобо́ден, свобо́дны, свобо́дно, свобо́дна]
    answer: свобо́дна
  - stem: Ко́шка сиди́т ___ окно́м и смо́трит на у́лицу.
    options: [пе́ред, на, в, у]
    answer: пе́ред
  - stem: В Москве́ ___ иногда́ быва́ет о́чень жа́рко.
    options: [ле́том, ле́то, на ле́то, ле́та]
    answer: ле́том
  - stem: Ве́чером мы ___ по Не́вскому проспе́кту три часа́.
    options: [ходи́ть, пошли́, идём, ходи́ли]
    answer: ходи́ли
  - stem: Сейча́с я иду́ ___ Ми́ше, он про́сит помо́чь с матема́тикой.
    options: [у, к, от, с]
    answer: к
  - stem: Е́сли ты пойдёшь гуля́ть, ___ ша́пку, на у́лице моро́з.
    options: [наде́л, наде́нет, наде́нь, наде́ть]
    answer: наде́нь
  - stem: Ю́ми ___ уже́ неде́лю, у неё грипп.
    options: [боли́т, боля́т, боле́ет, бо́лен]
    answer: боле́ет
  - stem: Петербу́рг ме́ньше, ___ Москва́.
    options: [чем, как, что, когда́]
    answer: чем
  - stem: Пьер спроси́л, ___ начина́ется конце́рт.
    options: [ли, что, е́сли, когда́]
    answer: когда́
  - stem: Мы поздра́вили О́льгу Ви́кторовну ___.
    options: [пра́здник, с пра́здником, на пра́здник, пра́здника]
    answer: с пра́здником
  - stem: На Но́вый год я подарю́ Ми́ше ___.
    options: [кни́гу, кни́ге, кни́га, кни́гой]
    answer: кни́гу
  - stem: На кани́кулы Ван Лэй собира́ется ___ домо́й, в Пеки́н.
    options: [е́здить, е́дет, пое́дет, пое́хать]
    answer: пое́хать
  - stem: Е́сли бы у меня́ бы́ло вре́мя, я ___ с ва́ми.
    options: [пое́ду, пое́хал бы, пое́хал, е́здил]
    answer: пое́хал бы
  - stem: Мы бы́ли в Коло́менском ___ день.
    options: [вся, всё, весь, все]
    answer: весь
  - stem: Ве́чером до́ма ___ не́ было, все бы́ли в теа́тре.
    options: [никто́, ничего́, никого́, никому́]
    answer: никого́
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    Дорога́я А́нна!

    Приве́т из Пеки́на! Я уже́ (1) []{.blank} до́ма. Лете́л я (2) []{.blank} Москвы́ во́семь часо́в и (3) []{.blank} вре́мя спал. Ма́ма и па́па жда́ли меня́ в (4) []{.blank}. Они́ бы́ли о́чень (5) []{.blank}. Я подари́л (6) []{.blank} плато́к, а па́пе — матрёшку. Па́па сказа́л, что матрёшка (7) []{.blank}, чем кита́йские игру́шки.

    Здесь все спра́шивают меня́ о Росси́и. Я расска́зываю о Москве́, о (8) []{.blank} теа́тре и о ру́сской (9) []{.blank}. Мой брат спроси́л, (10) []{.blank} в Москве́ ми́нус три́дцать. Я отве́тил, что быва́ет, но (11) []{.blank}. (12) []{.blank} бы ты была́ здесь, я бы показа́л тебе́ Пеки́н!

    Я о́чень (13) []{.blank} по Москве́ и по (14) []{.blank} семье́. Здесь (15) []{.blank} не говори́т по-ру́сски, поэ́тому ка́ждое у́тро я (16) []{.blank} ру́сские слова́. В феврале́ я (17) []{.blank} в Москву́.

    Переда́й приве́т (18) []{.blank}, па́пе и ма́ме. Поздравля́ю вас (19) []{.blank}! Жела́ю всем (20) []{.blank}!

    Твой Ван Лэй
    :::
  passage_zh: |
    亲爱的安娜：

    从北京向你问好！我到家已经一个星期了。我从莫斯科飞了八个小时，一路都在睡觉。爸爸妈妈在机场等我。他们非常高兴。我送给妈妈一条头巾，送给爸爸一个套娃。爸爸说套娃比中国的玩具漂亮。

    这儿大家都向我打听俄罗斯。我讲莫斯科，讲大剧院，讲俄罗斯的冬天。我弟弟问，莫斯科会不会有零下三十度。我回答说会有，不过很少。要是你在这儿，我就带你看看北京了！

    我非常想念莫斯科，想念你们一家。这儿谁也不说俄语，所以我每天早上都复习俄语单词。二月我就回莫斯科。

    代我向米沙、你爸爸和妈妈问好。祝你们圣诞快乐！祝大家身体健康！

    你的王磊
  why: 第 1 空：不带前置词的第四格表示持续多久：[неде́лю]{.ru}（第 93、97 课）。第 2 空：[Москва́]{.ru} 前用 [в]{.ru}，“从莫斯科”用 [из]{.ru} + 第二格（第 74 课）。第 3 空：[вре́мя]{.ru} 是中性名词，[весь]{.ru} 用中性第四格 [всё]{.ru}；[все]{.ru} 是复数（第 97 课）。第 4 空：[аэропо́рт]{.ru} 表示处所时第六格是 [в аэропорту́]{.ru}，重音在词尾（第 99 课）。第 5 空：主语 [Ма́ма и па́па]{.ru} 是两个人，用复数 [ра́ды]{.ru}（第 59 课）。第 6 空：[подари́ть кому́ что]{.ru}，收礼的人用第三格 [ма́ме]{.ru}，和后面的 [па́пе]{.ru} 平行（第 92 课）。第 7 空：后面有 [чем]{.ru}，用比较级 [краси́вее]{.ru}（第 86 课）。第 8 空：[о]{.ru} + 第六格，[теа́тр]{.ru} 是阳性，形容词第六格 [Большо́м]{.ru}（第 13、18 课）。第 9 空：[о]{.ru} + 第六格，[зима́]{.ru} 的第六格是 [зиме́]{.ru}；[зимо́й]{.ru} 是副词“在冬天”（第 13、69 课）。第 10 空：弟弟的原话是“莫斯科会有零下三十度吗？”，不带疑问词，转述时用 [ли]{.ru}，放在被问的动词后面：[быва́ет ли]{.ru}（第 89 课）。第 11 空：[но]{.ru} 表示转折，“会有，但是……”，只能是 [ре́дко]{.ru}；[ча́сто, всегда́]{.ru} 不构成转折（第 25、71 课）。第 12 空：后面有 [бы]{.ru}，主句也有 [бы]{.ru}，说的是不真实的条件，用 [Е́сли]{.ru}；[Когда́]{.ru} 不和 [бы]{.ru} 构成假定式（第 94 课）。第 13 空：主语 [я]{.ru}，现在时第一人称 [скуча́ю]{.ru}（第 95 课）。第 14 空：[по]{.ru} 要求第三格，[семья́]{.ru} 是阴性，物主代词第三格 [ва́шей]{.ru}（第 56、57 课）。第 15 空：作主语用第一格 [никто́]{.ru}，动词前还要有 [не]{.ru}（第 98 课）。第 16 空：[ка́ждое у́тро]{.ru} 表示反复的动作，用未完成体现在时 [повторя́ю]{.ru}（第 45、97 课）。第 17 空：[в феврале́]{.ru} 说的是将来，写信人是男性，用完成体将来时 [верну́сь]{.ru}（第 47 课）。第 18 空：[переда́ть приве́т]{.ru} 向谁问好用第三格 [Ми́ше]{.ru}，和后面的 [па́пе и ма́ме]{.ru} 平行（第 51、59 课）。第 19 空：[поздравля́ть]{.ru} 用 [с]{.ru} + 第五格；写信时是一月初，祝的是圣诞节：[с Рождество́м]{.ru}（第 91、93 课）。第 20 空：[жела́ть кому́ чего́]{.ru}，祝愿的内容用第二格 [здоро́вья]{.ru}（第 91 课）。
  items:
  - options: [неде́ля, неде́лю, неде́ли, неде́лей]
    answer: неде́лю
  - options: [с, от, в, из]
    answer: из
  - options: [всё, весь, вся, все]
    answer: всё
  - options: [аэропо́рте, аэропо́рт, аэропо́рта, аэропорту́]
    answer: аэропорту́
  - options: [рад, ра́ды, ра́да, ра́до]
    answer: ра́ды
  - options: [ма́ме, ма́му, ма́мы, ма́мой]
    answer: ма́ме
  - options: [краси́вая, краси́во, краси́вее, краси́вой]
    answer: краси́вее
  - options: [Большо́й, Большо́м, Большо́го, Большо́му]
    answer: Большо́м
  - options: [зима́, зи́му, зимо́й, зиме́]
    answer: зиме́
  - options: [ли быва́ет, е́сли быва́ет, быва́ет ли, что быва́ет]
    answer: быва́ет ли
  - options: [ре́дко, ча́сто, всегда́, ка́ждый день]
    answer: ре́дко
  - options: [Когда́, Потому́ что, Пото́м, Е́сли]
    answer: Е́сли
  - options: [скуча́ю, скуча́ет, скуча́ть, скуча́ли]
    answer: скуча́ю
  - options: [ва́ша, ва́шу, ва́шей, ва́шем]
    answer: ва́шей
  - options: [никого́, никто́, ничто́, никому́]
    answer: никто́
  - options: [повтори́л, повторя́ю, повторю́, повтори́ть]
    answer: повторя́ю
  - options: [верну́сь, верну́лся, верну́лась, верну́ться]
    answer: верну́сь
  - options: [Ми́шу, Ми́ша, Ми́шей, Ми́ше]
    answer: Ми́ше
  - options: [Рождество́, на Рождество́, с Рождество́м, Рождеству́]
    answer: с Рождество́м
  - options: [здоро́вье, здоро́вьем, здоро́вья, здоро́вью]
    answer: здоро́вья
- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Три ро́зы**

    В декабре́ у Ю́ми был день рожде́ния. Ю́ми у́чится в одно́й гру́ппе с Пье́ром, она́ из То́кио. Пьер до́лго ду́мал, что ей подари́ть. Снача́ла он хоте́л купи́ть кни́гу, но пото́м вспо́мнил, что Ю́ми ещё ме́дленно чита́ет по-ру́сски. Торт ей пода́рит А́нна, а откры́тку — Ван Лэй. Наконе́ц Пьер реши́л подари́ть цветы́ и пошёл в магази́н, кото́рый нахо́дится ря́дом с общежи́тием.

    Ро́зы в магази́не бы́ли краси́вые, но дорогова́тые: одна́ ро́за сто́ила две́сти рубле́й. У Пье́ра бы́ло то́лько пятьсо́т рубле́й, поэ́тому он купи́л две ро́зы. «Две ро́зы — то́же хоро́ший пода́рок», — ду́мал он.

    По доро́ге он уви́дел А́нну. Когда́ она́ уви́дела цветы́, она́ спроси́ла:

    — Пьер, кому́ э́ти ро́зы?

    — Ю́ми. У неё сего́дня день рожде́ния.

    — Две ро́зы? Нет, так нельзя́! В Росси́и на день рожде́ния да́рят оди́н цвето́к, три и́ли пять. А две и́ли четы́ре ро́зы — э́то о́чень плохо́й пода́рок.

    — Но у меня́ нет де́нег на тре́тью ро́зу! — сказа́л Пьер.

    А́нна засмея́лась:

    — Не волну́йся. Э́то бу́дет наш о́бщий пода́рок: две ро́зы от тебя́, а одна́ — от меня́.

    Они́ вме́сте пошли́ в магази́н, и А́нна купи́ла ещё одну́ ро́зу.

    Ве́чером Ю́ми получи́ла три ро́зы, торт и откры́тку. Она́ была́ о́чень ра́да. «В Япо́нии то́же не лю́бят число́ четы́ре», — сказа́ла она́. «И в Кита́е!» — засмея́лся Ван Лэй. А Пьер сказа́л, что тепе́рь он всегда́ бу́дет по́мнить ру́сское пра́вило.
    :::
  passage_zh: |
    **三朵玫瑰**

    由美的生日在十二月。由美和皮埃尔在一个班学习，她是东京人。皮埃尔想了很久送她什么。起初他想买一本书，可后来想起由美俄语读得还慢。蛋糕安娜会送，贺卡王磊会送。最后皮埃尔决定送花，就去了宿舍旁边的一家商店。

    商店里的玫瑰很漂亮，可是有点贵：一朵玫瑰二百卢布。皮埃尔只有五百卢布，所以他买了两朵玫瑰。“两朵玫瑰也是好礼物。”他想。

    路上他遇见了安娜。安娜看见花就问：

    “皮埃尔，这玫瑰是送谁的？”

    “送由美。她今天过生日。”

    “两朵玫瑰？不行不行，可不能这样！在俄罗斯，过生日送一朵、三朵或者五朵花。两朵或者四朵玫瑰是很不好的礼物。”

    “可我没有钱买第三朵了！”皮埃尔说。

    安娜笑了：

    “别着急。这就算我们俩合送的礼物：两朵是你的，一朵是我的。”

    他们一起去了商店，安娜又买了一朵玫瑰。

    晚上由美收到了三朵玫瑰、一个蛋糕和一张贺卡。她非常高兴。“在日本人们也不喜欢四这个数。”她说。“在中国也是！”王磊笑着说。皮埃尔说，现在他会永远记住俄罗斯的这个规矩。
  why: 第 1 题，[Снача́ла он хоте́л купи́ть кни́гу]{.ru}；花是最后决定的，蛋糕和贺卡是安娜和王磊的礼物。第 2 题，推断题：[пото́м вспо́мнил, что Ю́ми ещё ме́дленно чита́ет по-ру́сски]{.ru}，这是他放弃买书的原因。第 3 题，推断题：一朵 200 卢布，三朵要 600，他只有 500，所以只买得起两朵；他自己说 [у меня́ нет де́нег на тре́тью ро́зу]{.ru}。第 4 题，安娜说 [одна́ — от меня́]{.ru}，第三朵是安娜买的。第 5 题，推断题：安娜解释 [В Росси́и на день рожде́ния да́рят оди́н цвето́к, три и́ли пять]{.ru}，两朵不能送；由美收到礼物很高兴，所以“由美不喜欢”不对；蛋糕是安娜送的，但这不是故事要说明的事。
  items:
  - stem: Снача́ла Пьер хоте́л подари́ть Ю́ми ___.
    options: [ро́зы, кни́гу, торт, откры́тку]
    answer: кни́гу
  - stem: Пьер не купи́л кни́гу, потому́ что ___.
    options: [Ю́ми ещё ме́дленно чита́ет по-ру́сски, кни́ги бы́ли сли́шком дороги́е, кни́гу пода́рит А́нна, у Ю́ми уже́ была́ э́та кни́га]
    answer: Ю́ми ещё ме́дленно чита́ет по-ру́сски
  - stem: Пьер купи́л то́лько две ро́зы, потому́ что ___.
    options: [он не люби́л ро́зы, в магази́не бы́ли то́лько две, А́нна так сказа́ла, у него́ не́ было де́нег на три]
    answer: у него́ не́ было де́нег на три
  - stem: Тре́тья ро́за — э́то пода́рок ___.
    options: [Пье́ра, Ван Лэ́я, Ми́ши, А́нны]
    answer: А́нны
  - stem: Из расска́за мо́жно поня́ть, что ___.
    options: [Ю́ми не понра́вились ро́зы, в Росси́и не да́рят две ро́зы на день рожде́ния, Пьер забы́л о дне рожде́ния Ю́ми, А́нна не была́ на дне рожде́ния]
    answer: в Росси́и не да́рят две ро́зы на день рожде́ния
