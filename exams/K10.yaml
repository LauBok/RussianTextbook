    ::: {.prose lang="ru"}
    **Сосе́д**

    Но́вый год мы, как всегда́, встреча́ли у ба́бушки. Сестра́ помога́ла (1) []{.blank} (ба́бушка) на ку́хне, а я (2) []{.blank} (весь) ве́чер украша́л ёлку. Вдруг ба́бушка посмотре́ла в окно́: «А у Ви́ктора Па́вловича опя́ть нет ёлки!» Он живёт в сосе́днем до́ме, оди́н, и, наве́рное, (3) []{.blank} (собира́ться) встреча́ть пра́здник у телеви́зора.

    Ба́бушка тут же ему́ позвони́ла, и ско́ро мы уже́ встреча́ли у две́ри (4) []{.blank} (наш сосе́д). Мы (5) []{.blank} (подари́ть) ему́ тёплые та́почки, и они́ ему́ так (6) []{.blank} (понра́виться), что он сра́зу их наде́л.

    В по́лночь (7) []{.blank} (бить) кура́нты. Де́душка поздра́вил всех с (8) []{.blank} (Но́вый год): «Жела́ю вам сча́стья и (9) []{.blank} (здоро́вье)!» А наш гость ти́хо сказа́л: «Е́сли бы не ва́ша ба́бушка, я бы сейча́с (10) []{.blank} (сиде́ть) оди́н».

    Тепе́рь он ча́сто пьёт с на́ми чай.
