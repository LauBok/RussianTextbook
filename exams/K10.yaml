  passage: |
    ::: {.prose lang="ru"}
    **Но́вый год у ба́бушки**

    Три́дцать пе́рвого декабря́ мы с де́душкой (1) []{.blank} (весь) у́тро украша́ли ёлку, а сестра́ помога́ла (2) []{.blank} (ба́бушка) на ку́хне. В по́лночь (3) []{.blank} (бить) кремлёвские кура́нты. Де́душка поздра́вил нас с (4) []{.blank} (Но́вый год) и сказа́л: «Жела́ю вам сча́стья и (5) []{.blank} (здоро́вье)!»

    Пото́м мы (6) []{.blank} (дари́ть) пода́рки. Я подари́л на́шему сосе́ду (7) []{.blank} (Ви́ктор Па́влович) кни́гу о Москве́, а сестре́ — тёплый шарф. Сестре́ о́чень (8) []{.blank} (понра́виться) мой пода́рок.

    Пото́м я (9) []{.blank} (собира́ться) позвони́ть дру́гу во Владивосто́к, но там бы́ло уже́ семь часо́в утра́. Е́сли бы я позвони́л, его́ ма́ма (10) []{.blank} (волнова́ться) бы.
    :::
  passage_zh: |
    **在奶奶家过新年**

    十二月三十一日，我和爷爷整个上午都在装饰枞树，姐姐在厨房帮奶奶干活。午夜克里姆林宫的钟敲响了。爷爷祝我们新年快乐，说：“祝你们幸福健康！”

    然后我们互赠礼物。我送给我们的邻居维克多·帕夫洛维奇一本介绍莫斯科的书，送给姐姐一条暖和的围巾。姐姐非常喜欢我的礼物。

    后来我本打算给符拉迪沃斯托克的朋友打电话，可是那儿已经是早上七点了。我要是打了，他妈妈会着急的。
  why: 第 1 空：[весь]{.ru} 跟 [у́тро]{.ru} 一致，中性第四格同第一格：[всё у́тро]{.ru}，表示持续的时间（第 97 课）。第 2 空：[помога́ть]{.ru} 帮助谁用第三格 [ба́бушке]{.ru}（第 62 课）。第 3 空：主语 [кура́нты]{.ru} 是复数，过去时 [би́ли]{.ru}（第 91 课）。第 4 空：[поздравля́ть]{.ru} 用 [с]{.ru} + 第五格，形容词和名词都变：[Но́вым го́дом]{.ru}（第 91 课）。第 5 空：[жела́ть кому́ чего́]{.ru}，和前面的 [сча́стья]{.ru} 一样用第二格 [здоро́вья]{.ru}（第 91 课）。第 6 空：说的是互赠礼物的过程，未完成体过去时复数 [дари́ли]{.ru}；具体送了什么由后面的 [подари́л]{.ru} 说出（第 92 课）。第 7 空：[подари́ть кому́]{.ru}，和前面的 [на́шему сосе́ду]{.ru} 一致，名字和父称都用第三格：[Ви́ктору Па́вловичу]{.ru}（第 51、92 课）。第 8 空：[понра́виться]{.ru} 跟主语 [пода́рок]{.ru} 一致，阳性过去时 [понра́вился]{.ru}；不要跟第三格的 [сестре́]{.ru} 一致成阴性（第 52、71 课）。第 9 空：[собира́лся]{.ru} 用过去时，暗示计划没有实现；主语“我”是男性，用阳性（第 93 课）。第 10 空：[е́сли бы]{.ru} 句的主句用 [бы]{.ru} + 过去时形式，主语 [ма́ма]{.ru} 是阴性：[волнова́лась]{.ru}（第 58、94 课）。
