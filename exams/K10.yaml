- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок от Де́да Моро́за**

    Ли́зе шесть лет. В декабре́ она́ реши́ла написа́ть письмо́ Де́ду Моро́зу. Писа́ть она́ ещё не уме́ла, поэ́тому попроси́ла своего́ ста́ршего бра́та Серёжу: «Напиши́, пожа́луйста, что я о́чень хочу́ соба́ку». Серёжа написа́л письмо́, а ве́чером показа́л его́ роди́телям.

    Ма́ма и па́па до́лго разгова́ривали на ку́хне. «Соба́ка — не игру́шка, — сказа́л па́па. — С ней ну́жно гуля́ть ка́ждый день, у́тром и ве́чером, а мы рабо́таем с утра́ до ве́чера». «И кварти́ра у нас ма́ленькая», — сказа́ла ма́ма. Они́ реши́ли подари́ть Ли́зе игру́шечную соба́ку.

    Серёжа слы́шал их разгово́р. Он ничего́ не сказа́л роди́телям, но на сле́дующий день пошёл к сосе́дке Екатери́не Ива́новне. Неда́вно у её ко́шки роди́лся котёнок, ма́ленький и се́рый. «Возьми́ его́, — сказа́ла Екатери́на Ива́новна. — Ко́шка — не соба́ка: с ней не на́до гуля́ть, и ме́ста ей ну́жно ма́ло». Серёжа до́лго разгова́ривал с ней, а пото́м пошёл домо́й и ничего́ никому́ не рассказа́л.

    Но́вый год вся семья́ встреча́ла до́ма. У́тром пе́рвого января́ Ли́за уви́дела под ёлкой игру́шечную соба́ку, а ря́дом с ней — ма́ленького се́рого котёнка. «Спаси́бо, Дед Моро́з! — сказа́ла Ли́за. — Тепе́рь у меня́ есть и соба́ка, и ко́шка!» Ма́ма и па́па удивлённо посмотре́ли друг на дру́га, а пото́м на Серёжу. А Серёжа то́лько улыба́лся.
    :::
  glossary:
  - {ru: игру́шечный, pos: adj., zh: 玩具的}
  - {ru: удивлённо, pos: adv., zh: 惊奇地}
  - {ru: друг на дру́га, zh: 互相（看）}
  passage_zh: |
    **严寒老人的礼物**

    丽莎六岁了。十二月她决定给严寒老人写一封信。她还不会写字，就请哥哥谢廖沙帮忙：“请你写上，我非常想要一条狗。”谢廖沙写好了信，晚上拿给爸爸妈妈看。

    爸爸妈妈在厨房里商量了很久。“狗不是玩具，”爸爸说，“每天早晚都得遛它，可我们从早到晚都在上班。”“再说我们家房子也小。”妈妈说。他们决定送丽莎一只玩具狗。

    谢廖沙听见了他们的谈话。他什么也没对爸爸妈妈说，可是第二天他去了邻居叶卡捷琳娜·伊万诺夫娜家。不久前她家的猫生了一只小猫，又小又灰。“你把它抱走吧，”叶卡捷琳娜·伊万诺夫娜说，“猫不是狗：用不着遛它，它也不占什么地方。”谢廖沙跟她谈了很久，然后回家了，对谁也没说。

    全家在家里过的新年。一月一日早上，丽莎在枞树下看见了一只玩具狗，旁边还有一只灰色的小猫。“谢谢你，严寒老人！”丽莎说，“现在我狗也有了，猫也有了！”爸爸妈妈惊奇地互相看了看，又看了看谢廖沙。谢廖沙只是笑。
  why: 第 1 题，丽莎还不会写字，[попроси́ла своего́ ста́ршего бра́та Серёжу]{.ru}，[Серёжа написа́л письмо́]{.ru}。第 2 题，爸爸说 [С ней ну́жно гуля́ть ка́ждый день, у́тром и ве́чером, а мы рабо́таем с утра́ до ве́чера]{.ru}；妈妈补充的是房子小，没有人说狗贵。第 3 题，推断题：爸爸妈妈只准备了玩具狗，看见小猫时很惊奇，又去看谢廖沙；小猫是谢廖沙从邻居那里要来的，他“只是笑”，说明小猫是他送的。邻居把小猫给了谢廖沙，不是直接送给丽莎。第 4 题，推断题：爸爸妈妈不养狗的理由是要天天遛、房子小，邻居说 [с ней не на́до гуля́ть, и ме́ста ей ну́жно ма́ло]{.ru}，小猫正好没有这两个问题。第 5 题，推断题：谢廖沙听到妹妹的愿望不能实现，自己去想办法，悄悄给她弄来一只小猫，可见他很爱妹妹；爸爸妈妈送的是玩具狗，丽莎不会写字，邻居主动让他把小猫抱走，说明她并非不喜欢自己的猫。
  items:
  - stem: Письмо́ Де́ду Моро́зу написа́л ___.
    options: [па́па, Серёжа, Ли́за, ма́ма]
    answer: Серёжа
  - stem: Роди́тели не хоте́ли соба́ку, потому́ что ___.
    options: [с ней ну́жно гуля́ть ка́ждый день, Ли́за ещё ма́ленькая, соба́ки о́чень дороги́е, у сосе́дки есть ко́шка]
    answer: с ней ну́жно гуля́ть ка́ждый день
  - stem: Котёнок под ёлкой — э́то, наве́рное, пода́рок ___.
    options: [Де́да Моро́за, па́пы, Екатери́ны Ива́новны, Серёжи]
    answer: Серёжи
  - stem: Серёжа ду́мал, что котёнок — хоро́ший пода́рок, потому́ что ___.
    options: [Ли́за проси́ла котёнка, игру́шечная соба́ка была́ плоха́я, сосе́дка проси́ла его́ об э́том, с ко́шкой не на́до гуля́ть и ей ну́жно ма́ло ме́ста]
    answer: с ко́шкой не на́до гуля́ть и ей ну́жно ма́ло ме́ста
  - stem: Из расска́за мо́жно поня́ть, что ___.
    options: [роди́тели купи́ли Ли́зе соба́ку, Серёжа лю́бит свою́ мла́дшую сестру́, Ли́за уже́ уме́ет писа́ть, Екатери́на Ива́новна не люби́ла свою́ ко́шку]
    answer: Серёжа лю́бит свою́ мла́дшую сестру́
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Ко́стя]{.sp} Алло́!

    [Ма́ма]{.sp} Ко́стя, э́то ма́ма. Слу́шай, мне сейча́с звони́л па́па.

    [Ко́стя]{.sp} Он уже́ в самолёте?

    [Ма́ма]{.sp} Нет, он ещё в Новосиби́рске, в аэропорту́. Там идёт си́льный снег, и самолёт опа́здывает на три часа́. Па́па бу́дет до́ма не в во́семь, а в оди́ннадцать.

    [Ко́стя]{.sp} В оди́ннадцать? Но сего́дня три́дцать пе́рвое декабря́!

    [Ма́ма]{.sp} Да. Па́па сказа́л, что о́чень хо́чет встреча́ть Но́вый год до́ма. Наде́юсь, он успе́ет.

    [Ко́стя]{.sp} Ма́ма, мо́жно, я пое́ду в аэропо́рт и бу́ду ждать па́пу там?

    [Ма́ма]{.sp} Нет, Ко́стя. Аэропо́рт далеко́, а па́па возьмёт такси́. Ты мне ну́жен до́ма. Я ещё на рабо́те и бу́ду до́ма че́рез два часа́. Купи́, пожа́луйста, хлеб и сок. И поста́вь ёлку в гости́ной.

    [Ко́стя]{.sp} А сала́т оливье́?

    [Ма́ма]{.sp} Сала́т я пригото́влю сама́, когда́ верну́сь.

    [Ко́стя]{.sp} Хорошо́. Ма́ма, а кото́рый час?

    [Ма́ма]{.sp} Уже́ шесть. Всё, пока́!
    :::

    ::: {.prose lang="ru"}
    Ко́стя купи́л хлеб и сок и поста́вил ёлку. Ма́ма верну́лась, как обеща́ла, и пригото́вила сала́т. В оди́ннадцать часо́в па́пы ещё не́ было, и Ко́стя о́чень волнова́лся. Но в полови́не двена́дцатого в дверь позвони́ли. Э́то был па́па! «Я успе́л!» — сказа́л он.
    :::
  passage_zh: |
    ::: translation
    [科斯佳]{.sp} 喂！

    [妈妈]{.sp} 科斯佳，我是妈妈。听着，爸爸刚才给我打电话了。

    [科斯佳]{.sp} 他已经上飞机了吗？

    [妈妈]{.sp} 没有，他还在新西伯利亚，在机场。那儿下大雪，飞机晚点三个小时。爸爸不是八点到家，要十一点了。

    [科斯佳]{.sp} 十一点？今天可是十二月三十一号啊！

    [妈妈]{.sp} 是啊。爸爸说他很想在家里过新年。希望他来得及。

    [科斯佳]{.sp} 妈妈，我能不能去机场等爸爸？

    [妈妈]{.sp} 不行，科斯佳。机场太远了，爸爸会打车回来。家里需要你。我还在上班，两个小时以后到家。请你去买面包和果汁。再把枞树摆在客厅里。

    [科斯佳]{.sp} 那奥利维耶沙拉呢？

    [妈妈]{.sp} 沙拉等我回去自己做。

    [科斯佳]{.sp} 好。妈妈，现在几点了？

    [妈妈]{.sp} 已经六点了。好了，回头见！
    :::

    科斯佳买了面包和果汁，摆好了枞树。妈妈按说好的时间回到家，做了沙拉。到了十一点爸爸还没回来，科斯佳非常着急。可是十一点半门铃响了。是爸爸！“我赶上了！”他说。
  why: 第 1 题，妈妈说 [он ещё в Новосиби́рске, в аэропорту́]{.ru}，他还没上飞机。第 2 题，[Там идёт си́льный снег, и самолёт опа́здывает на три часа́]{.ru}，晚点是因为新西伯利亚下大雪，不是爸爸迟到。第 3 题，推断题：打电话时 [Уже́ шесть]{.ru}，妈妈说 [бу́ду до́ма че́рез два часа́]{.ru}，六点加两个小时是八点；后面又说她 [верну́лась, как обеща́ла]{.ru}。第 4 题，推断题：爸爸十一点半就到家了，在午夜之前，所以他是在家里和家人一起迎接新年的。第 5 题，与原文不符的说法：科斯佳想去机场，妈妈说 [Нет, Ко́стя]{.ru}，爸爸自己打车回来，科斯佳没去机场；其他三项原文都说了。
  items:
  - stem: Когда́ ма́ма звони́ла, па́па был ___.
    options: [в Новосиби́рске, в Москве́, на рабо́те, в самолёте]
    answer: в Новосиби́рске
  - stem: Самолёт опа́здывает, потому́ что ___.
    options: [па́па опозда́л в аэропо́рт, у па́пы нет биле́та, в Новосиби́рске си́льный снег, в Москве́ идёт дождь]
    answer: в Новосиби́рске си́льный снег
  - stem: Ма́ма верну́лась домо́й ___.
    options: [в во́семь часо́в, в шесть часо́в, в оди́ннадцать часо́в, в по́лночь]
    answer: в во́семь часо́в
  - stem: Но́вый год па́па, наве́рное, встреча́л ___.
    options: [в самолёте, до́ма с семьёй, в аэропорту́, в Новосиби́рске]
    answer: до́ма с семьёй
  - stem: 'Здесь оши́бка: ___.'
    options: [ма́ма была́ на рабо́те, Ко́стя поста́вил ёлку, Ко́стя е́здил в аэропо́рт, ма́ма пригото́вила сала́т]
    answer: Ко́стя е́здил в аэропо́рт
- id: e5
  type: choice
  task: 阅读理解（三）：阅读下面的火车时刻表，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **По́езда из Москвы́ в Петербу́рг**

    | по́езд | из Москвы́ | в Петербу́рге | биле́т, рубле́й |
    |---|---|---|---|
    | «Сапса́н» | 7.00 | 11.00 | 3000 |
    | «Сапса́н» | 13.30 | 17.30 | 2800 |
    | «Сапса́н» | 19.00 | 23.00 | 3200 |
    | «Арба́т» | 23.30 | 7.30 | 2500 |

    «Сапса́н» — бы́стрый по́езд. В ка́ждом «Сапса́не» есть кафе́. В по́езде «Арба́т» мо́жно спать всю ночь: там есть посте́ль.

    Биле́ты мо́жно купи́ть на вокза́ле и́ли по телефо́ну: 800-775-00-00. На вокза́ле ну́жно быть ра́ньше: е́сли ваш по́езд в 9.00, в 8.30 вы уже́ должны́ быть на вокза́ле. Опозда́ть на по́езд нельзя́!

    Е́сли вы потеря́ли вещь в по́езде, позвони́те по телефо́ну: 800-775-00-01.
    :::
  passage_zh: |
    **从莫斯科开往彼得堡的火车**

    | 车次 | 莫斯科开车 | 到达彼得堡 | 票价（卢布） |
    |---|---|---|---|
    | “游隼号” | 7:00 | 11:00 | 3000 |
    | “游隼号” | 13:30 | 17:30 | 2800 |
    | “游隼号” | 19:00 | 23:00 | 3200 |
    | “阿尔巴特号” | 23:30 | 7:30 | 2500 |

    “游隼号”是快车。每一列“游隼号”上都有咖啡座。“阿尔巴特号”上可以睡一整夜：车上有铺位。

    车票可以在火车站买，也可以打电话订购：800-775-00-00。要早点儿到火车站：如果您的火车九点开，八点半您就应该在火车站了。可不能误了火车！

    如果您在火车上丢了东西，请打电话：800-775-00-01。
  why: 第 1 题，推断题：“游隼号”三趟都是 4 小时（7:00—11:00、13:30—17:30、19:00—23:00）。第 2 题，推断题：要在车上睡觉、早上到，只有夜车“阿尔巴特号”，23:30 开，7:30 到。第 3 题，推断题：白天的车是 7:00 和 13:30 的“游隼号”，13:30 的票 2800 卢布，比 7:00 的 3000 卢布便宜；“阿尔巴特号”虽然最便宜，但它是夜车。第 4 题，[В ка́ждом «Сапса́не» есть кафе́]{.ru}。第 5 题，推断题：时刻表上 19:00 开的“游隼号”23:00 到；正文说九点的车八点半就要到站，即提前半小时，所以 18:30 要在火车站。
  items:
  - stem: «Сапса́н» е́дет из Москвы́ в Петербу́рг ___.
