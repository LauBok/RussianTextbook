exercises:
- id: e1
  type: choice
  task: 单项选择：选出正确答案。
  points: 1
  why: 第 1 题：[пальто́]{.ru} 是不变格的中性名词，物主代词用中性 [моё]{.ru}。后面的 [его́]{.ru} 只能排除阴性和复数，阳性、中性都用 [его́]{.ru}，所以要自己知道 [пальто́]{.ru} 是中性（第 3、5、8 课）。第 2 题：住在市中心的大街上，后面用 [поэ́тому]{.ru} 引出结果，家里总是吵：[шу́мно]{.ru}；[ти́хо]{.ru} 和原因不合，[хо́лодно]{.ru}、[темно́]{.ru} 不是住在大街上的结果（第 67、84 课）。第 3 题：不能去看电影，原因是晚上要上课：[заня́тия]{.ru}；放假、有空、休息日都不是去不了的理由（第 57、93 课）。第 4 题：“谁的公寓”用第二格表示所属，形容词和物主代词都要变成阴性第二格：[мое́й ста́ршей сестры́]{.ru}（第 33、34 课）。第 5 题：[три]{.ru} 后面用单数第二格 [студе́нтки]{.ru}（第 35 课）。第 6 题：[весь ве́чер]{.ru} 说动作持续了多久，要用未完成体 [чита́л]{.ru}；完成体不和表示持续的时间连用（第 42、97 课）。第 7 题：“在几号”用序数词第二格加月份第二格，不加前置词：[двена́дцатого ма́я]{.ru}；[двена́дцатое ма́я]{.ru} 回答“今天几号”（第 49 课）。第 8 题：问年龄，人用第三格：[Ско́лько вам лет?]{.ru}，和回答里的 [Мне]{.ru} 对应（第 53 课）。第 9 题：后半句说这里是医院，意思是禁止，用 [нельзя́]{.ru}；[мо́жно]{.ru} 是允许，[ну́жно, на́до]{.ru} 是必须（第 54 课）。第 10 题：“通过电视看”用 [по]{.ru} + 第三格：[по телеви́зору]{.ru}，和 [по телефо́ну]{.ru} 一样（第 51、57 课）。第 11 题：[С удово́льствием]{.ru} 是接受邀请，接着说明星期六有空：[свобо́дна]{.ru}；[занята́]{.ru}、[больна́]{.ru} 和接受邀请矛盾，[должна́]{.ru} 后面要接不定式（第 59 课）。第 12 题：四个前置词表处所时都要求第五格，不能靠词尾排除，要看意思：灯挂在桌子的上方，桌上才亮，用 [над]{.ru}“在……上方”；[под]{.ru} 是“在……下面”，[за]{.ru} 是“在……后面”，[пе́ред]{.ru} 是“在……前面”，灯挂在这些地方都照不亮桌面（第 66 课）。第 13 题：[кото́рый]{.ru} 的性和数跟它所指的 [музе́й]{.ru} 一致（阳性单数），格却由它在从句里的作用决定：它是 [нахо́дится]{.ru} 的主语，用第一格 [кото́рый]{.ru}。照抄前面 [в музе́е]{.ru} 的第六格写成 [кото́ром]{.ru} 是常见错误；[кото́рая]{.ru}、[кото́рые]{.ru} 性数不对（第 79 课）。第 14 题：[ходи́ть по]{.ru} + 第三格表示在一个地方到处走，[три часа́]{.ru} 说持续多久，用 [ходи́ли]{.ru}；[идём]{.ru} 是现在时，[пошли́]{.ru} 表示出发，不和持续时间连用，[ходи́ть]{.ru} 是不定式，句子缺谓语（第 72 课）。第 15 题：后面是第三格 [дру́гу]{.ru}，去某人那里用 [к]{.ru} + 第三格；[у, от, с]{.ru} 都不接第三格（第 57、74 课）。第 16 题：外面严寒，出门要戴上帽子：[наде́нь]{.ru}；[сними́]{.ru} 意思相反；主句是对 [ты]{.ru} 的建议，要用命令式，[наде́ть]{.ru} 是不定式，[наде́л]{.ru} 是过去时（第 55、83 课）。第 17 题：主语是人，说“生病”用第一个 [боле́ть]{.ru}：[боле́ет]{.ru}；[боли́т, боля́т]{.ru} 的主语是身体部位；[бо́лен]{.ru} 是阳性，和 [сестра́]{.ru} 不一致（第 84、85 课）。第 18 题：问的是“在哪儿”（[рабо́тал]{.ru}），用第六格；[Ура́л]{.ru} 和 [Кавка́з]{.ru} 一样是用 [на]{.ru} 的山区地名：[на Ура́ле]{.ru}；[на Ура́л]{.ru} 是第四格，回答 [куда́]{.ru}；[в Ура́ле]{.ru}、[в Ура́л]{.ru} 前置词用错了（第 11、74 课）。第 19 题：转述带疑问词的问句，保留疑问词 [когда́]{.ru}；[ли]{.ru} 用于不带疑问词的问句，不放在从句开头（第 88、89 课）。第 20 题：[поздравля́ть]{.ru} 祝贺的事由用 [с]{.ru} + 第五格：[с пра́здником]{.ru}（第 91 课）。第 21 题：[подари́ть кому́ что]{.ru}：送给的人用第三格，送的东西用第四格，所以是 [свое́й подру́ге тёплый шарф]{.ru}；[шарф]{.ru} 是非动物名词，第四格同第一格。把人写成第四格 [свою́ подру́гу]{.ru}，或者把东西写成第二格、第三格，都是常见错误。礼物是娜塔莎送给她自己的朋友的，用 [свой]{.ru}（第 87、92 课）。第 22 题：[собира́ться]{.ru} 后面接不定式；说的是一次具体的出行，用完成体 [пое́хать]{.ru}；[е́здить]{.ru} 是经常往返（第 73、93 课）。第 23 题：[е́сли бы]{.ru} 表示不真实的条件（明天会下雨，去不成），主句也要用 [бы]{.ru} + 过去时形式：[пое́хали бы]{.ru}，即使说的是明天的事也用过去时形式；[пое́дем]{.ru} 用在真实的条件句 [е́сли]{.ru} 里；[пое́хали]{.ru}、[е́здили]{.ru} 没有 [бы]{.ru}，成了已经发生的事（第 83、94 课）。第 24 题：[весь]{.ru} 跟 [день]{.ru} 一致，阳性第四格同第一格：[весь день]{.ru}（第 97 课）。第 25 题：否定句里“没有人”用 [никого́]{.ru}（[не́ было]{.ru} + 第二格）；后半句 [все бы́ли в теа́тре]{.ru} 说的是人，[ничего́]{.ru} 指东西（第 98 课）。
  items:
  - stem: — Где ___ пальто́? Я его́ не ви́жу.
    options: [мой, моё, моя́, мои́]
    answer: моё
  - stem: Я живу́ в це́нтре, на большо́й у́лице, поэ́тому у меня́ в кварти́ре всегда́ ___.
    options: [шу́мно, ти́хо, хо́лодно, темно́]
    answer: шу́мно
  - stem: 'Извини́, я не могу́ пойти́ в кино́: ве́чером у меня́ ___.'
    options: [кани́кулы, выходно́й, свобо́дное вре́мя, заня́тия]
    answer: заня́тия
  - stem: Э́то кварти́ра ___.
    options: [моя́ ста́ршая сестра́, мое́й ста́ршей сестре́, мое́й ста́ршей сестры́, мою́ ста́ршую сестру́]
    answer: мое́й ста́ршей сестры́
  - stem: На ле́кции бы́ли то́лько три ___.
    options: [студе́нтка, студе́нтку, студе́нткой, студе́нтки]
    answer: студе́нтки
  - stem: Вчера́ я ___ рома́н весь ве́чер.
    options: [прочита́л, чита́л, чита́ю, прочита́ю]
    answer: чита́л
  - stem: Моя́ сестра́ родила́сь ___.
    options: [двена́дцатое ма́я, двена́дцатый май, двена́дцатого ма́я, в двена́дцатое ма́я]
    answer: двена́дцатого ма́я
  - stem: — Ско́лько ___ лет? — Мне два́дцать.
    options: [вам, вас, вы, ва́ми]
    answer: вам
  - stem: Здесь ___ кури́ть, э́то больни́ца.
    options: [мо́жно, нельзя́, ну́жно, на́до]
    answer: нельзя́
  - stem: Мой брат смо́трит футбо́л ___ телеви́зору.
    options: [на, в, по, к]
    answer: по
  - stem: — Ната́ша, пойдём в суббо́ту в теа́тр? — С удово́льствием! В суббо́ту я ___.
    options: [занята́, больна́, должна́, свобо́дна]
    answer: свобо́дна
  - stem: Ла́мпа виси́т ___ столо́м, поэ́тому на столе́ всегда́ светло́.
    options: [под, за, над, пе́ред]
    answer: над
  - stem: Вчера́ мы бы́ли в музе́е, ___ нахо́дится ря́дом с Кремлём.
    options: [кото́ром, кото́рый, кото́рая, кото́рые]
    answer: кото́рый
  - stem: Ве́чером мы ___ по Не́вскому проспе́кту три часа́.
    options: [ходи́ть, пошли́, идём, ходи́ли]
    answer: ходи́ли
  - stem: Сейча́с я иду́ ___ дру́гу, он попроси́л помо́чь ему́ с матема́тикой.
    options: [у, к, от, с]
    answer: к
  - stem: Е́сли ты пойдёшь гуля́ть, ___ ша́пку, на у́лице моро́з.
    options: [сними́, наде́ть, наде́нь, наде́л]
    answer: наде́нь
  - stem: Моя́ сестра́ ___ уже́ неде́лю, у неё грипп.
    options: [боли́т, боля́т, боле́ет, бо́лен]
    answer: боле́ет
  - stem: Ле́том мой брат рабо́тал ___.
    options: [в Ура́ле, на Ура́л, на Ура́ле, в Ура́л]
    answer: на Ура́ле
  - stem: Друг спроси́л, ___ начина́ется конце́рт.
    options: [ли, что, е́сли, когда́]
    answer: когда́
  - stem: Мы поздра́вили учи́тельницу ___.
    options: [пра́здник, с пра́здником, на пра́здник, пра́здника]
    answer: с пра́здником
  - stem: На день рожде́ния Ната́ша подари́ла ___.
    options: [свою́ подру́гу тёплый шарф, свое́й подру́ге тёплого ша́рфа, свое́й подру́ге тёплый шарф, свою́ подру́гу тёплому ша́рфу]
    answer: свое́й подру́ге тёплый шарф
  - stem: На кани́кулы Ли Мин собира́ется ___ домо́й, в Пеки́н.
    options: [е́здить, е́дет, пое́дет, пое́хать]
    answer: пое́хать
  - stem: Е́сли бы за́втра не́ было дождя́, мы ___ на да́чу.
    options: [пое́дем, пое́хали бы, пое́хали, е́здили]
    answer: пое́хали бы
  - stem: Мы бы́ли в Коло́менском ___ день.
    options: [вся, всё, весь, все]
    answer: весь
  - stem: Ве́чером до́ма ___ не́ было, все бы́ли в теа́тре.
    options: [никто́, ничего́, никого́, никому́]
    answer: никого́
- id: e2
  type: choice
  task: 完形填空：阅读短文，为每个空选出最恰当的一项。
  points: 1.5
  passage: |
    ::: {.prose lang="ru"}
    **Пельме́ни для всей гру́ппы**

    В конце́ декабря́ я (1) []{.blank} домо́й, в Кита́й. Пе́ред кани́кулами я реши́л пригласи́ть (2) []{.blank} на́шу гру́ппу на у́жин и пригото́вить настоя́щие кита́йские пельме́ни. Я написа́л всем: «Жду вас в суббо́ту в семь часо́в. Общежи́тие, ко́мната 15».

    В суббо́ту я (3) []{.blank} весь день и сде́лал сто пельме́ней. В семь часо́в всё бы́ло (4) []{.blank}, но в дверь никто́ не (5) []{.blank}. В полови́не восьмо́го то́же (6) []{.blank} не́ было. Мне ста́ло (7) []{.blank}. Мо́жет быть, никто́ не хо́чет есть кита́йские пельме́ни?

    Тогда́ я позвони́л (8) []{.blank} из на́шей гру́ппы. «Чэнь, где ты? — спроси́ла она́. — Мы уже́ полчаса́ (9) []{.blank} у (10) []{.blank} две́ри и стучи́м, но никто́ не открыва́ет!» И тут я по́нял: моя́ ко́мната — пятьдеся́т оди́н, а не пятна́дцать! Ко́мната 15 на пе́рвом этаже́, а я живу́ на (11) []{.blank}.

    Я сра́зу пошёл на пе́рвый эта́ж. Вся гру́ппа стоя́ла в коридо́ре, а ря́дом стоя́л молодо́й челове́к, (12) []{.blank} то́лько что верну́лся (13) []{.blank}. Он смотре́л на (14) []{.blank} и ничего́ не понима́л: почему́ у его́ две́ри так мно́го люде́й? Э́то был Кири́лл из пятна́дцатой ко́мнаты. Я пригласи́л его́ то́же: пельме́ней бы́ло (15) []{.blank}.

    Пельме́ни (16) []{.blank} о́чень понра́вились, а бо́льше всех съел Кири́лл: он весь день (17) []{.blank} и ничего́ не ел. Че́рез час на столе́ не оста́лось (18) []{.blank}. В де́сять часо́в Ве́ра сказа́ла: «Чэнь, когда́ (19) []{.blank} из Кита́я, пригото́вь их ещё раз. То́лько в сле́дующий раз мы снача́ла (20) []{.blank} тебе́!»
    :::
  glossary:
  - {ru: эта́ж, pos: m, zh: 楼层；第六格 на этаже́}
  - {ru: стуча́ть, pos: impf., zh: 敲（门）}
  passage_zh: |
    **给全班包的饺子**

    十二月底我要回家，回中国。放假前我决定请全班同学吃晚饭，包地道的中国饺子。我给大家发消息：“星期六七点等你们。宿舍，15 号房间。”

    星期六我忙了一整天，包了一百个饺子。七点钟一切都准备好了，可是没有一个人来按门铃。七点半还是一个人都没有。我心里很难过。也许谁都不想吃中国饺子？

    于是我给班上的薇拉打了电话。“陈，你在哪儿？”她问，“我们在你门口站了半个小时了，一直敲门，可没人开！”这时我才明白过来：我的房间是 51 号，不是 15 号！15 号房间在一楼，我住在五楼。

    我马上下到一楼。全班同学都站在走廊里，旁边还站着一个小伙子，他刚下班回来。他看着大家，怎么也想不明白：自己门口怎么站了这么多人？这是 15 号房间的基里尔。我把他也请上了楼：饺子有的是。

    大家都很爱吃饺子，吃得最多的是基里尔：他上了一整天班，什么也没吃。一个钟头以后，桌上什么也没剩下。十点钟，薇拉说：“陈，你从中国回来以后，再给我们包一次。只是下回我们先给你打电话！”
  why: 第 1 空：“十二月底”是过去的事，叙述者是男的——后面有 [реши́л]{.ru}、[написа́л]{.ru}，薇拉也叫他 [Чэнь]{.ru}（陈），所以用阳性过去时 [собира́лся]{.ru}“打算，要”。[собира́лась]{.ru} 是阴性，第一句还看不出性别，要读到后面才能排除；[собира́юсь]{.ru} 是现在时，[собира́ются]{.ru} 是第三人称复数，都不对（第 93 课）。第 2 空：[гру́ппу]{.ru} 是阴性第四格，[весь]{.ru} 也要用阴性第四格 [всю]{.ru}；[вся]{.ru} 是第一格，[всей]{.ru} 是第二、三、五、六格，[весь]{.ru} 是阳性（第 97 课）。第 3 空：[весь день]{.ru} 说动作持续了多久，用未完成体 [гото́вил]{.ru}；完成体 [пригото́вил]{.ru} 不和表示持续的时间连用，[гото́влю]{.ru}、[пригото́влю]{.ru} 时态不对（第 42、96 课）。第 4 空：主语是 [всё]{.ru}，短尾形容词用中性 [гото́во]{.ru}；[гото́в]{.ru}、[гото́ва]{.ru}、[гото́вы]{.ru} 分别是阳性、阴性、复数（第 59 课）。第 5 空：[звони́ть в дверь]{.ru} 是“按门铃”；[никто́]{.ru} 作主语，动词用阳性单数 [звони́л]{.ru}。想着“全班同学”选复数 [звони́ли]{.ru} 是常见错误；[звони́ла]{.ru} 是阴性，[звони́т]{.ru} 是现在时，和全文的过去时不合（第 98 课）。第 6 空：[не́ было]{.ru} 表示“没有”，没有的人用第二格：[никого́ не́ было]{.ru}；[никто́]{.ru} 是第一格，只能作主语，[никому́]{.ru}、[нике́м]{.ru} 是第三格、第五格（第 98 课）。第 7 空：七点半还没人来，他以为大家不想吃他做的饭，心里难过：[гру́стно]{.ru}；[ве́село]{.ru} 和下一句的担心相反，[тепло́]{.ru}、[хо́лодно]{.ru} 说的是天气和冷暖，接不上后面的话（第 58 课）。第 8 空：[звони́ть / позвони́ть]{.ru} 给谁打电话用第三格：[Ве́ре]{.ru}；[Ве́ру]{.ru} 是第四格，中文“打电话给她”容易让人想到直接宾语（第 51 课）。第 9 空：[уже́ полчаса́]{.ru} 说的是从半小时前一直到现在还在站着，俄语用现在时 [стои́м]{.ru}，后面的 [стучи́м]{.ru}、[открыва́ет]{.ru} 也是现在时。按汉语“站了半个小时”选过去时 [стоя́ли]{.ru} 是常见错误；[бу́дем стоя́ть]{.ru} 是将来时，[стоя́ть]{.ru} 是不定式，句子缺谓语（第 6、42 课）。第 10 空：薇拉是在对陈说话，以为自己站在他的门口：[у твое́й две́ри]{.ru}。[свое́й]{.ru} 要指回本句的主语 [мы]{.ru}，意思成了“在我们自己的门口”；[мое́й]{.ru} 是薇拉自己的门；[на́шей]{.ru} 也是“我们的”，都不对（第 87 课）。第 11 空：要把前后两处连起来：他的房间是 51 号，15 号在一楼，可见房号的第一位数字就是楼层，51 号在五楼：[на пя́том]{.ru}。[на пе́рвом]{.ru} 是 15 号所在的楼层，前面用 [а]{.ru} 表示对比，说明他住在别的楼层；[пятна́дцатом]{.ru}、[пятьдеся́т пе́рвом]{.ru} 是把房号当成了楼层（第 48、49 课）。第 12 空：[кото́рый]{.ru} 的性和数跟 [молодо́й челове́к]{.ru} 一致，格由它在从句里的作用决定：它是 [верну́лся]{.ru} 的主语，用第一格 [кото́рый]{.ru}；[кото́рого]{.ru}、[кото́рому]{.ru} 是第二（四）格、第三格，[кото́рая]{.ru} 是阴性（第 79 课）。第 13 空：“从哪儿来”，[рабо́та]{.ru} 和 [на]{.ru} 连用，所以“从单位回来”用 [с рабо́ты]{.ru}。[из рабо́ты]{.ru} 是不知道 [на — с]{.ru}、[в — из]{.ru} 成对的人会选的；[на рабо́ту]{.ru} 回答“去哪儿”，[на рабо́те]{.ru} 回答“在哪儿”（第 36、74 课）。第 14 空：[смотре́ть на]{.ru} + 第四格，[они́]{.ru} 的第四格在前置词后面是 [них]{.ru}；[они́]{.ru} 是第一格，[им]{.ru}、[ни́ми]{.ru} 是第三格、第五格（第 22、30 课）。第 15 空：他包了一百个饺子，正愁没人吃，所以饺子“有的是”，才能再请一个人：[мно́го]{.ru}；[ма́ло]{.ru}、[немно́го]{.ru} 和“一百个”矛盾，也不能作为请人的理由；[ме́ньше]{.ru} 是比较级，这里没有比较的对象（第 86 课）。第 16 空：[нра́виться / понра́виться]{.ru} 喜欢的人用第三格：[всем]{.ru}，主语是 [пельме́ни]{.ru}。按汉语“大家都喜欢”选第一格 [все]{.ru} 是常见错误；[всех]{.ru}、[все́ми]{.ru} 是第二（四）格和第五格（第 52、97 课）。第 17 空：要读前文：基里尔“刚下班回来”，所以他是上了一整天班：[рабо́тал]{.ru}，饿了一天，才吃得最多。[спал]{.ru} 和刚下班对不上；[обе́дал]{.ru} 和后面的 [ничего́ не ел]{.ru} 矛盾；做饭的是陈，不是他。第 18 空：[не оста́лось]{.ru} 后面用第二格：[ничего́]{.ru}；[ничто́]{.ru} 是第一格，[всё]{.ru} 不和 [не]{.ru} 这样连用，[никого́]{.ru} 指人，桌上剩下的是吃的（第 98 课）。第 19 空：[когда́]{.ru} 引出的是将来的事，俄语从句里也要用将来时：[когда́ вернёшься]{.ru}。按汉语“回来以后”选现在时 [возвраща́ешься]{.ru}，或选过去时 [верну́лся]{.ru}，都不对；[верну́ться]{.ru} 是不定式（第 82、83 课）。第 20 空：说下一次要做的一件事，用完成体将来时 [позвони́м]{.ru}，主语是 [мы]{.ru}；这句话点出了故事的笑料：上次大家只顾敲门，没先打电话问一问。[звони́м]{.ru} 是现在时，[позвони́ли]{.ru} 是过去时，[звони́ть]{.ru} 是不定式（第 43、51 课）。
  items:
  - options: [собира́лась, собира́юсь, собира́лся, собира́ются]
    answer: собира́лся
  - options: [весь, всю, вся, всей]
    answer: всю
  - options: [пригото́вил, гото́влю, гото́вил, пригото́влю]
    answer: гото́вил
  - options: [гото́в, гото́ва, гото́вы, гото́во]
    answer: гото́во
  - options: [звони́ли, звони́л, звони́ла, звони́т]
    answer: звони́л
  - options: [никто́, никому́, нике́м, никого́]
    answer: никого́
  - options: [ве́село, гру́стно, тепло́, хо́лодно]
    answer: гру́стно
  - options: [Ве́ру, Ве́ры, Ве́ре, Ве́рой]
    answer: Ве́ре
  - options: [стои́м, стоя́ли, бу́дем стоя́ть, стоя́ть]
    answer: стои́м
  - options: [свое́й, твое́й, мое́й, на́шей]
    answer: твое́й
  - options: [пе́рвом, пятна́дцатом, пя́том, пятьдеся́т пе́рвом]
    answer: пя́том
  - options: [кото́рого, кото́рому, кото́рая, кото́рый]
    answer: кото́рый
  - options: [из рабо́ты, на рабо́ту, с рабо́ты, на рабо́те]
    answer: с рабо́ты
  - options: [они́, них, им, ни́ми]
    answer: них
  - options: [ма́ло, немно́го, ме́ньше, мно́го]
    answer: мно́го
  - options: [все, всех, всем, все́ми]
    answer: всем
  - options: [рабо́тал, спал, обе́дал, гото́вил]
    answer: рабо́тал
  - options: [ничто́, ничего́, всё, никого́]
    answer: ничего́
  - options: [возвраща́ешься, верну́лся, вернёшься, верну́ться]
    answer: вернёшься
  - options: [звони́м, позвони́ли, звони́ть, позвони́м]
    answer: позвони́м
- id: e3
  type: choice
  task: 阅读理解（一）：阅读下面的信，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    Дорога́я Ле́на!

    Спаси́бо за письмо́. Ты пи́шешь, что в декабре́ роди́тели бу́дут в командиро́вке и Но́вый год ты бу́дешь встреча́ть одна́. Нет, так не бу́дет! Встреча́й его́ у нас, в Ирку́тске. Я уже́ спроси́ла ма́му и па́пу, они́ бу́дут о́чень ра́ды.

    Из Москвы́ к нам мо́жно лете́ть на самолёте — э́то шесть часо́в, и́ли е́хать на по́езде — четы́ре дня. Биле́т на по́езд сто́ит ме́ньше, и ты уви́дишь всю Сиби́рь. Но тогда́ покупа́й биле́т сейча́с: в конце́ декабря́ все е́дут домо́й, и купи́ть его́ бу́дет тру́дно.

    Встре́чу тебя́ я. То́лько по́мни, что у меня́ ещё экза́мены: после́дний — два́дцать седьмо́го, и до э́того я с утра́ до ве́чера сижу́ в библиоте́ке.

    Возьми́ са́мые тёплые ве́щи: у нас сейча́с ми́нус три́дцать. Сапоги́ мо́жешь не покупа́ть, я дам тебе́ свои́ ста́рые.

    Ты же давно́ хоте́ла уви́деть Байка́л. Зимо́й он о́чень краси́вый, и по о́зеру мо́жно ходи́ть пешко́м! По́сле пра́здника пое́дем туда́ на два дня.

    Напиши́, когда́ ку́пишь биле́т. И ещё: ма́ма спра́шивает, что ты не ешь. Она́ уже́ ду́мает, что пригото́вить на пра́здничный стол.

    Жду отве́та!

    Твоя́ Ната́ша
    :::
  passage_zh: |
    亲爱的列娜：

    谢谢你的来信。你说十二月你爸妈要出差，新年只能你一个人过。不行，不能这样！到我们伊尔库茨克来过吧。我已经问过爸爸妈妈了，他们会非常高兴的。

    从莫斯科到我们这儿可以坐飞机，六个小时；也可以坐火车，要四天。火车票便宜些，而且你能看到整个西伯利亚。不过要坐火车的话，现在就买票：十二月底大家都回家，那时候就难买了。

    我去接你。只是别忘了，我还有考试：最后一门在二十七号，在那之前我从早到晚都待在图书馆。

    带上最暖和的衣服：我们这儿现在零下三十度。靴子你不用买，我把我的旧靴子给你穿。

    你不是早就想看看贝加尔湖吗？冬天的贝加尔湖非常美，还可以在湖面上走！过完节我们去那儿玩两天。

    买好票告诉我。还有：我妈妈问你有什么不吃的。她已经在想节日的餐桌上做些什么了。

    等你回信！

    你的娜塔莎
  why: 第 1 题，细节题：信的开头说 [роди́тели бу́дут в командиро́вке]{.ru}。[все е́дут домо́й]{.ru} 在文中说的是年底买票难，不是列娜的朋友；有考试的是娜塔莎；文中没有说列娜没钱。第 2 题，推断题：娜塔莎要亲自接列娜，可二十七号考完最后一门之前她整天在图书馆，所以列娜最早二十八号到；火车要走四天，二十五号出发、二十九号到才合适。十八号、二十号、二十二号出发，分别是二十二号、二十四号、二十六号到，那时娜塔莎还在考试，接不了她（第 47、49 课）。第 3 题，细节题：[в конце́ декабря́ все е́дут домо́й, и купи́ть его́ бу́дет тру́дно]{.ru}。火车票便宜、要走四天都是文中的话，但不是现在就要买票的原因；娜塔莎的考试和买票无关。第 4 题，推断人物意图：妈妈问列娜有什么不吃的，下一句说 [Она́ уже́ ду́мает, что пригото́вить на пра́здничный стол]{.ru}，她是在为节日的饭菜做准备。文中没有说列娜病了，也没有说她不吃鱼；“妈妈不会做饭”与原文相反。第 5 题，主旨题：全信从请列娜来过新年说起，交通、接站、带衣服、去贝加尔湖、问饮食，都是在安排这次做客，所以写信是为了邀请她来伊尔库茨克过新年。贝加尔湖和考试都只是信里的一部分；买票是请列娜自己买，不是让她给娜塔莎买。
  items:
  - stem: Ле́на бу́дет встреча́ть Но́вый год одна́, потому́ что ___.
    options: [все её друзья́ е́дут домо́й, у неё экза́мены, её роди́тели бу́дут в командиро́вке, у неё нет де́нег на биле́т]
    answer: её роди́тели бу́дут в командиро́вке
  - stem: Е́сли Ле́на пое́дет на по́езде, ей лу́чше пое́хать из Москвы́ ___ декабря́.
    options: [восемна́дцатого, двадца́того, два́дцать второ́го, два́дцать пя́того]
    answer: два́дцать пя́того
  - stem: Биле́т на по́езд на́до купи́ть сейча́с, потому́ что ___.
    options: [он сто́ит ме́ньше, по́езд идёт четы́ре дня, в конце́ декабря́ его́ тру́дно купи́ть, у Ната́ши ско́ро экза́мены]
    answer: в конце́ декабря́ его́ тру́дно купи́ть
  - stem: Ма́ма Ната́ши спра́шивает, что Ле́на не ест, потому́ что ___.
    options: [Ле́на сейча́с больна́, она́ гото́вит пра́здничный стол, Ле́на не ест ры́бу, ма́ма не уме́ет гото́вить]
    answer: она́ гото́вит пра́здничный стол
  - stem: Ната́ша пи́шет э́то письмо́, потому́ что хо́чет ___.
    options: [рассказа́ть о Байка́ле, пригласи́ть Ле́ну в Ирку́тск на Но́вый год, попроси́ть Ле́ну купи́ть ей биле́т, рассказа́ть о свои́х экза́менах]
    answer: пригласи́ть Ле́ну в Ирку́тск на Но́вый год
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.dialogue lang="ru"}
    [Све́та]{.sp} Ро́ма, приве́т! Извини́, что звоню́ так по́здно. Ты ещё не спишь?

    [Ро́ма]{.sp} Нет, что ты. Что случи́лось?

    [Све́та]{.sp} У меня́ к тебе́ больша́я про́сьба. В четве́рг я лечу́ домо́й, в Хаба́ровск. Самолёт в шесть со́рок утра́. Ты не мо́жешь отвезти́ меня́ в аэропо́рт?

    [Ро́ма]{.sp} В шесть со́рок? А почему́ не на метро́? У тебя́ же метро́ ря́дом с до́мом.

    [Све́та]{.sp} Метро́ открыва́ется то́лько в полови́не шесто́го. А в аэропорту́ на́до быть за два часа́.

    [Ро́ма]{.sp} Да, тогда́ не успе́ешь. А на такси́?

    [Све́та]{.sp} Я смотре́ла: но́чью такси́ сто́ит три ты́сячи. А биле́т на самолёт и так был о́чень дорого́й: де́нег у меня́ почти́ не оста́лось.

    [Ро́ма]{.sp} Поня́тно. Ла́дно, отвезу́. А из како́го аэропо́рта ты лети́шь? Из Шереме́тьева?

    [Све́та]{.sp} Сейча́с посмотрю́… Нет, из Домоде́дова.

    [Ро́ма]{.sp} Хорошо́, что я спроси́л! Домоде́дово совсе́м в друго́й стороне́, от тебя́ туда́ час, не ме́ньше. Зна́чит, я бу́ду у твоего́ подъе́зда в три два́дцать.

    [Све́та]{.sp} Ро́ма, большо́е спаси́бо! А тебе́ не тру́дно? У тебя́ же в четве́рг рабо́та.

    [Ро́ма]{.sp} Рабо́та у меня́ в де́вять. Отвезу́ тебя́ и ещё успе́ю верну́ться домо́й спать.

    [Све́та]{.sp} Ты настоя́щий друг! Тогда́ до четверга́.

    [Ро́ма]{.sp} До четверга́. И в сре́ду ложи́сь спать ра́но!
    :::
  glossary:
  - {ru: про́сьба, pos: f, zh: 请求}
  - {ru: отвезти́, pos: pf., zh: （用车）送到}
  - {ru: в друго́й стороне́, zh: 在另一个方向}
  passage_zh: |
    ::: translation
    [斯韦塔]{.sp} 罗马，你好！对不起，这么晚给你打电话。你还没睡吧？

    [罗马]{.sp} 没有，哪儿的话。出什么事了？

    [斯韦塔]{.sp} 我有件事想求你。星期四我坐飞机回家，回哈巴罗夫斯克。飞机是早上六点四十的。你能开车送我去机场吗？

    [罗马]{.sp} 六点四十？那为什么不坐地铁？你家旁边就是地铁。

    [斯韦塔]{.sp} 地铁五点半才开。可是得提前两个小时到机场。

    [罗马]{.sp} 是啊，那就来不及了。打车呢？

    [斯韦塔]{.sp} 我查过了：夜里打车要三千卢布。机票本来就很贵：我差不多没钱了。

    [罗马]{.sp} 明白了。好吧，我送你。你从哪个机场走？谢列梅捷沃？

    [斯韦塔]{.sp} 我看一下……不是，是多莫杰多沃。

    [罗马]{.sp} 幸亏我问了一句！多莫杰多沃完全在另一个方向，从你家过去至少一个小时。那我三点二十到你家楼门口。

    [斯韦塔]{.sp} 罗马，太谢谢你了！你不觉得麻烦吗？你星期四还要上班呢。

    [罗马]{.sp} 我九点才上班。送完你，还来得及回家睡一觉。

    [斯韦塔]{.sp} 你真够朋友！那星期四见。

    [罗马]{.sp} 星期四见。星期三晚上早点睡！
    :::
  why: 第 1 题，主旨题：斯韦塔（[Све́та]{.ru}）打电话的目的在第三句：[Ты не мо́жешь отвезти́ меня́ в аэропо́рт?]{.ru}，后面说地铁、出租车，都是在解释为什么只能求罗马（[Ро́ма]{.ru}）。地铁几点开门是她自己说出来的，不用问人；出租车的价钱她已经查过了；文中没有请罗马去哈巴罗夫斯克（[Хаба́ровск]{.ru}）。第 2 题，推断题：要把两处信息连起来：飞机六点四十起飞，要提前两小时到机场，就是四点四十；地铁五点半才开门，所以坐地铁来不及。罗马说 [У тебя́ же метро́ ря́дом с до́мом]{.ru}，地铁并不远；文中没有说地铁不通多莫杰多沃（[Домоде́дово]{.ru}）。把时间算成五点半到机场、六点四十开门，是把两个时刻搞颠倒了（第 47、54 课）。第 3 题，推断题：[биле́т на самолёт и так был о́чень дорого́й]{.ru}，[де́нег у меня́ почти́ не оста́лось]{.ru}——机票已经花掉了她差不多所有的钱，三千卢布的出租车坐不起。文中没有说夜里没有出租车，也没有提箱子；出租车比地铁慢的说法文中没有。第 4 题，推断题：罗马先问 [Из Шереме́тьева?]{.ru}，可见他以为她从谢列梅捷沃（[Шереме́тьево]{.ru}）走；听说是多莫杰多沃，他说那在 [совсе́м в друго́й стороне́]{.ru}，路上至少一个小时。所以“幸亏问了”是因为差点去错机场、算错时间。飞机几点起飞斯韦塔一开始就说了；斯韦塔要查一下才知道是哪个机场，可文中没有说她不知道多莫杰多沃在哪儿；文中没有说罗马不愿意去谢列梅捷沃。第 5 题，推断人物态度：斯韦塔问 [А тебе́ не тру́дно? У тебя́ же в четве́рг рабо́та]{.ru}，罗马回答九点才上班，送完她还来得及回家睡一觉——他是在让斯韦塔放心。他星期四要上班，所以“星期四休息”不对；三点二十到她家是为了送她，不是他平时这么早起；机场和他单位的位置文中没有说。
