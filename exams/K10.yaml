    彼佳：

    我和你爸爸去别墅奶奶那儿了：她的背又疼了，园子里活儿又多。我们明天晚上回来。

    明天你肯定要睡到中午。午饭在冰箱里：汤和鱼。然后带沙里克出去遛遛。可别把桌上的东西喂它！要是去商店，买个面包。晚上比白天冷，穿上外套。

    奶奶让我代她问你好。她等你下星期六去：那天是她的生日。我知道你星期一有测验，可你今天要是跟我们一起去，奶奶会非常高兴的。

    妈妈
  why: 第 1 空：[мы с па́пой]{.ru} 指“我和爸爸”两个人，谓语用复数；留言写的时候他们已经出发了，用完成体过去时 [пое́хали]{.ru}。照着 [па́пой]{.ru} 写成 [пое́хал]{.ru}，或者写成现在时 [е́дем]{.ru}，都不对（第 62、73 课）。第 2 空：“明天会睡一上午”，说的是将来一段时间里持续的动作，[спать]{.ru} 只有未完成体，用复合将来时 [бу́дешь спать]{.ru}；主语 [ты]{.ru} 省在前面（第 41 课）。第 3 空：[в]{.ru} 表示处所，用第六格：[в холоди́льнике]{.ru}（第 11、99 课）。第 4 空：[дава́ть]{.ru} 给谁用第三格，[он]{.ru} 的第三格是 [ему́]{.ru}；[ничего́]{.ru} 是给的东西（第 52、98 课）。第 5 空：[е́сли]{.ru} 说将来可能的事，用将来时；主语是 [ты]{.ru}：[пойдёшь]{.ru}。按汉语习惯写成现在时 [идёшь]{.ru} 或不定式都不对（第 73、83 课）。第 6 空：后面有 [чем днём]{.ru}，用比较级；作无人称句的谓语：[холодне́е]{.ru}（第 58、86 课）。第 7 空：[переда́ть]{.ru} 问候给谁，用第三格：[тебе́]{.ru}（第 52 课）。第 8 空：回答“哪一天”，星期用 [в]{.ru} + 第四格；阴性 [суббо́та]{.ru} 的第四格是 [суббо́ту]{.ru}，形容词也要变成 [сле́дующую]{.ru}（第 23、29 课）。第 9 空：[е́сли бы]{.ru} 后面用过去时形式；主语 [ты]{.ru} 指儿子彼佳，用阳性 [пое́хал]{.ru}；说的是一次出行，用 [пое́хать]{.ru}（第 94 课）。第 10 空：短尾形容词作谓语，和主语 [ба́бушка]{.ru} 一致，用阴性 [ра́да]{.ru}；看见前面的 [ты]{.ru} 写成 [рад]{.ru} 是常见错误（第 59、94 课）。
