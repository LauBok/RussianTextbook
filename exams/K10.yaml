  passage: |
    ::: {.prose lang="ru"}
    **Като́к в па́рке «Соко́льники»**

    Като́к рабо́тает с пе́рвого декабря́ до конца́ февраля́.

    | дни | часы́ |
    |---|---|
    | понеде́льник | выходно́й |
    | вто́рник — пя́тница | 12.00—22.00 |
    | суббо́та, воскресе́нье | 10.00—23.00 |
    | 31 декабря́ | 10.00—18.00 |
    | 1 января́ | 14.00—23.00 |
    | 2—8 января́ | ка́ждый день 10.00—23.00 |

    | биле́т на весь день | рубле́й |
    |---|---|
    | взро́слые | 400 |
    | де́ти от 6 до 12 лет | 200 |

    Де́тям до шести́ лет биле́т не ну́жен.

    Коньки́ мо́жно взять на ка́тке: 300 рубле́й за два часа́.

    Ка́ждые два часа́ — переры́в 20 мину́т.

    По суббо́там с 19.00 до 22.00 на ка́тке игра́ет му́зыка.
    :::
  passage_zh: |
    **索科利尼基公园溜冰场**

    溜冰场从十二月一日开放到二月底。

    | 日期 | 开放时间 |
    |---|---|
    | 星期一 | 休息 |
    | 星期二至星期五 | 12:00—22:00 |
    | 星期六、星期日 | 10:00—23:00 |
    | 12 月 31 日 | 10:00—18:00 |
    | 1 月 1 日 | 14:00—23:00 |
    | 1 月 2 日至 8 日 | 每天 10:00—23:00 |

    | 全天票 | 卢布 |
    |---|---|
    | 成人 | 400 |
    | 6 至 12 岁儿童 | 200 |

    六岁以下儿童不用买票。

    冰鞋可以在溜冰场租：两小时 300 卢布。

    每两个小时休息 20 分钟。

    每星期六 19:00 至 22:00 溜冰场放音乐。
  glossary:
  - {ru: коньки́, zh: 冰鞋（复数）}
  why: 第 1 题，推断题：两个大人各 400，十岁的儿子 200，五岁的女儿不到六岁，不用买票，共 1000 卢布。把女儿也算成 200 就成了 1200；只算大人是 800（第 53、78 课）。第 2 题，推断题：平时星期一休息，但表里写着一月二日到八日 [ка́ждый день]{.ru} 10:00—23:00，五日在这段时间里，所以照常开放。只看第一行选“不开”是这题的陷阱；12:00—22:00 是平日的时间，14:00—23:00 是一月一日的时间。第 3 题，推断题：十二月三十一日溜冰场 18:00 就关门，科利亚七点下班再去已经晚了；说“休息”的是星期一；音乐是星期六晚上的事。第 4 题，推断题：大学生不是儿童，买成人票 400，再租两小时冰鞋 300，一共 700。只算冰鞋是 300，只算门票是 400，把大学生当成儿童就成了 500。第 5 题，细节题：[По суббо́там с 19.00 до 22.00 на ка́тке игра́ет му́зыка]{.ru}。星期日、一月一日都开放，但没有音乐；星期一休息。
