    answer: в суббо́ту ве́чером
- id: e6
  type: choice
  task: 阅读理解（四）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Два Но́вых го́да**

    Я учу́сь в Новосиби́рске, а мои́ роди́тели живу́т в Москве́. В про́шлом году́ после́дний экза́мен у меня́ был тридца́того декабря́. Биле́т на самолёт сто́ил тогда́ сли́шком до́рого, и ве́чером я сел на по́езд. До Москвы́ по́езд идёт два дня, поэ́тому Но́вый год мне на́до бы́ло встреча́ть в ваго́не.

    Снача́ла мне бы́ло гру́стно: все до́ма, за пра́здничным столо́м, а я — в по́езде. Но три́дцать пе́рвого ве́чером проводни́ца поста́вила в ваго́не ма́ленькую ёлку, и лю́ди на́чали ходи́ть друг к дру́гу в го́сти. Одна́ ба́бушка, кото́рая е́хала из Екатеринбу́рга к до́чери, угоща́ла всех пирога́ми, а студе́нты из сосе́днего ваго́на пе́ли пе́сни под гита́ру.

    Пото́м все на́чали спо́рить: когда́ же встреча́ть Но́вый год? В по́езде все часы́ пока́зывают моско́вское вре́мя. «Мы е́дем в Москву́ — зна́чит, встреча́ем по Москве́!» — говори́ли студе́нты. «Но мы ещё на Ура́ле, — отвеча́ла ба́бушка. — А здесь уже́ ско́ро по́лночь». Наконе́ц реши́ли встреча́ть два ра́за.

    Пе́рвый раз мы поздра́вили друг дру́га, когда́ на часа́х в ваго́не бы́ло де́сять часо́в ве́чера. Второ́й — в по́лночь по Москве́. Как раз в э́то вре́мя мне позвони́ла ма́ма: «С Но́вым го́дом, сын! Жаль, что тебя́ нет с на́ми. Тебе́ там, наве́рное, гру́стно одному́?»

    «Гру́стно? — засмея́лся я. — Ма́ма, у вас Но́вый год то́лько начался́, а у нас он уже́ второ́й!»
    :::
  glossary:
  - {ru: проводни́ца, pos: f, zh: 列车员（女）}
  - {ru: угоща́ть, pos: impf., zh: 请（吃），款待}
  - {ru: под гита́ру, zh: 弹着吉他}
  - {ru: а́втор, pos: m, zh: 作者（文中的“我”）}
  passage_zh: |
    **两个新年**

    我在新西伯利亚上大学，我父母住在莫斯科。去年我最后一门考试是十二月三十日考的。那时候机票太贵，我晚上就上了火车。火车到莫斯科要走两天，所以新年我只能在车厢里过了。

    起初我很难过：大家都在家里，围着节日的餐桌，我却在火车上。可是三十一日晚上，列车员在车厢里摆了一棵小枞树，大家开始互相串门。一位从叶卡捷琳堡去看女儿的老奶奶请大家吃馅饼，隔壁车厢的大学生们弹着吉他唱歌。

    后来大家争了起来：到底什么时候过新年？火车上所有的钟都是莫斯科时间。“我们是去莫斯科的，那就按莫斯科时间过！”大学生们说。“可我们还在乌拉尔，”老奶奶说，“这儿马上就到午夜了。”最后决定过两次。

    第一次我们互相祝贺，是车厢里的钟指着晚上十点的时候。第二次是在莫斯科时间午夜。正在这时，妈妈给我打来电话：“新年快乐，儿子！可惜你不在我们身边。你一个人在那儿大概很难过吧？”

    “难过？”我笑了，“妈妈，你们的新年才刚开始，我们这儿已经是第二个了！”
  why: 第 1 题，细节题：[Биле́т на самолёт сто́ил тогда́ сли́шком до́рого]{.ru}。考试三十日考完是事实，但不是坐火车的原因；他起初很难过，可见并不想在火车上过年；文中没说他怕坐飞机。第 2 题，推断题：车厢里的钟是莫斯科时间，第一次祝贺时是晚上十点；老奶奶说乌拉尔“马上就到午夜了”，可见那里比莫斯科早两个小时到午夜，第一次过的是乌拉尔的新年。莫斯科的午夜是第二次；妈妈是第二次时打来的电话；火车当时还没到莫斯科。第 3 题，细节题：大学生们说 [Мы е́дем в Москву́ — зна́чит, встреча́ем по Москве́!]{.ru}。他们是从隔壁车厢来的，文中没说他们是莫斯科人，这个选项最容易误选；列车员和他们的父母文中都没有提到这件事。第 4 题，推断人物态度：妈妈以为他一个人难过，他却笑着说已经过了两个新年，可见他在火车上过得很开心，早就不难过了。“很难过”是他刚上车时的心情；他听懂了妈妈的话才这样回答；文中没说他想睡觉。第 5 题，主旨题：全文讲的是在火车上过年，因为时差，大家过了两个新年，原以为会难过，结果很开心。考试和机票只是开头交代的原因，老奶奶的馅饼是一个细节，钟显示莫斯科时间是引出时差的话题，都不是全文要讲的事。
  items:
  - stem: А́втор е́хал домо́й на по́езде, потому́ что ___.
    options: [он сдал экза́мен тридца́того декабря́, он хоте́л встреча́ть Но́вый год в по́езде, биле́т на самолёт был сли́шком дорого́й, он не лю́бит самолёты]
    answer: биле́т на самолёт был сли́шком дорого́й
  - stem: Когда́ в ваго́не поздра́вили друг дру́га в пе́рвый раз, ___.
    options: [в Москве́ была́ по́лночь, на Ура́ле была́ по́лночь, а́втору позвони́ла ма́ма, по́езд был уже́ в Москве́]
    answer: на Ура́ле была́ по́лночь
  - stem: Студе́нты хоте́ли встреча́ть Но́вый год по Москве́, потому́ что ___.
    options: [они́ из Москвы́, так сказа́ла проводни́ца, по́езд е́дет в Москву́, им позвони́ли роди́тели]
    answer: по́езд е́дет в Москву́
  - stem: Когда́ ма́ма позвони́ла, а́втору ___.
    options: [бы́ло о́чень гру́стно, бы́ло ве́село, он хоте́л спать, бы́ло ску́чно одному́]
    answer: бы́ло ве́село
  - stem: О чём э́тот расска́з?
    options: [Как а́втор сдал экза́мены и купи́л биле́т., Как ба́бушка из Екатеринбу́рга угоща́ла всех пирога́ми., Как а́втор ве́село встреча́л Но́вый год в по́езде два ра́за., Почему́ в по́езде часы́ пока́зывают моско́вское вре́мя.]
    answer: Как а́втор ве́село встреча́л Но́вый год в по́езде два ра́за.
