    **По́езда из Москвы́ в Петербу́рг**

    | по́езд | из Москвы́ | в Петербу́рге | биле́т, рубле́й |
    |---|---|---|---|
    | «Сапса́н» | 7.00 | 11.00 | 3000 |
    | «Сапса́н» | 13.30 | 17.30 | 2800 |
    | «Сапса́н» | 19.00 | 23.00 | 3200 |
    | «Арба́т» | 23.30 | 7.30 | 2500 |

    «Сапса́н» — бы́стрый по́езд. В ка́ждом «Сапса́не» есть кафе́. В по́езде «Арба́т» мо́жно спать всю ночь: там есть посте́ль.

    Биле́ты мо́жно купи́ть на вокза́ле и́ли по телефо́ну: 800-775-00-00. На вокза́ле ну́жно быть за полчаса́ до по́езда: опозда́ть на по́езд нельзя́!

    Е́сли вы потеря́ли вещь в по́езде, позвони́те по телефо́ну: 800-775-00-01.
