    ::: {.prose lang="ru"}
    **Ба́бушка и кита́йский язы́к**

    Ни́не Петро́вне шестьдеся́т пять лет. Со́рок лет она́ рабо́тала врачо́м, а тепе́рь не рабо́тает. Снача́ла ей бы́ло ску́чно: сын и дочь живу́т в друго́м го́роде, а подру́ги ча́сто боле́ют и не хотя́т гуля́ть.

    Одна́жды её вну́чка Ле́на сказа́ла: «Ба́бушка, ты всегда́ хоте́ла пое́хать в Кита́й. Учи́ кита́йский язы́к!» Ни́на Петро́вна засмея́лась: «Я? Я уже́ ста́рая!» Но че́рез неде́лю она́ уже́ сиде́ла на пе́рвом уро́ке кита́йского языка́.

    В гру́ппе бы́ло де́сять челове́к. Все други́е студе́нты бы́ли молоды́е: им бы́ло два́дцать и́ли три́дцать лет. Снача́ла Ни́не Петро́вне бы́ло о́чень тру́дно: иеро́глифы она́ запомина́ла ме́дленнее, чем все. Но она́ занима́лась ка́ждый день два часа́ и никогда́ не опа́здывала на уро́ки. Че́рез год она́ ста́ла лу́чшей студе́нткой в гру́ппе.

    Тепе́рь у неё есть молоды́е друзья́. Они́ ча́сто про́сят её объясни́ть грамма́тику, а она́ спра́шивает у них, как писа́ть сообще́ния в телефо́не.

    Ле́том Ни́на Петро́вна и Ле́на пое́дут в Пеки́н. Ле́на не говори́т по-кита́йски, но она́ не волну́ется. «Ба́бушка, — говори́т она́, — тепе́рь ты бу́дешь мои́м перево́дчиком!» А Ни́на Петро́вна отвеча́ет: «Е́сли бы ты мне тогда́ э́того не сказа́ла, я бы и сейча́с сиде́ла до́ма у телеви́зора».
    :::
