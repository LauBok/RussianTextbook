- id: e3
  type: choice
  task: 阅读理解（一）：阅读短文，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    **Пода́рок от Де́да Моро́за**

    Ли́зе шесть лет. В декабре́ она́ реши́ла написа́ть письмо́ Де́ду Моро́зу. Писа́ть она́ ещё не уме́ла, поэ́тому попроси́ла своего́ ста́ршего бра́та Серёжу: «Напиши́, пожа́луйста, что я о́чень хочу́ соба́ку». Серёжа написа́л письмо́, а ве́чером показа́л его́ ма́ме и па́пе.

    Ма́ма и па́па до́лго разгова́ривали на ку́хне. «Соба́ка — не игру́шка, — сказа́л па́па. — С ней ну́жно гуля́ть ка́ждый день, у́тром и ве́чером, а мы рабо́таем с утра́ до ве́чера». «И кварти́ра у нас ма́ленькая», — сказа́ла ма́ма. Они́ реши́ли подари́ть Ли́зе игру́шечную соба́ку.

    Серёжа слы́шал их разгово́р. Он ничего́ не сказа́л ма́ме и па́пе, но на сле́дующий день пошёл к сосе́дке Екатери́не Ива́новне. Неда́вно у её ко́шки роди́лся котёнок, ма́ленький и се́рый. «Возьми́ его́, — сказа́ла Екатери́на Ива́новна. — Ко́шка — не соба́ка: с ней не на́до гуля́ть, и ме́ста ей ну́жно ма́ло». «Спаси́бо! — сказа́л Серёжа. — Я возьму́ его́ три́дцать пе́рвого декабря́».

    Но́вый год вся семья́ встреча́ла до́ма. У́тром пе́рвого января́ Ли́за уви́дела под ёлкой игру́шечную соба́ку, а ря́дом с ней — ма́ленького се́рого котёнка. «Спаси́бо, Дед Моро́з! — сказа́ла Ли́за. — Тепе́рь у меня́ есть и соба́ка, и ко́шка!» Ма́ма и па́па удивлённо посмотре́ли друг на дру́га, а пото́м на Серёжу. А Серёжа то́лько улыба́лся.
    :::
  glossary:
  - {ru: игру́шечный, pos: adj., zh: 玩具的}
  - {ru: удивлённо, pos: adv., zh: 惊奇地}
  - {ru: друг на дру́га, zh: 互相（看）}
  passage_zh: |
    **严寒老人的礼物**

    丽莎六岁了。十二月她决定给严寒老人写一封信。她还不会写字，就请哥哥谢廖沙帮忙：“请你写上，我非常想要一条狗。”谢廖沙写好了信，晚上拿给爸爸妈妈看。

    爸爸妈妈在厨房里商量了很久。“狗不是玩具，”爸爸说，“每天早晚都得遛它，可我们从早到晚都在上班。”“再说我们家房子也小。”妈妈说。他们决定送丽莎一只玩具狗。

    谢廖沙听见了他们的谈话。他什么也没对爸爸妈妈说，可是第二天他去了邻居叶卡捷琳娜·伊万诺夫娜家。不久前她家的猫生了一只小猫，又小又灰。“你把它抱走吧，”叶卡捷琳娜·伊万诺夫娜说，“猫不是狗：用不着遛它，它也不占什么地方。”“谢谢您！”谢廖沙说，“我十二月三十一日来抱它。”

    全家在家里过的新年。一月一日早上，丽莎在枞树下看见了一只玩具狗，旁边还有一只灰色的小猫。“谢谢你，严寒老人！”丽莎说，“现在我狗也有了，猫也有了！”爸爸妈妈惊奇地互相看了看，又看了看谢廖沙。谢廖沙只是笑。
  why: 第 1 题，丽莎还不会写字，[попроси́ла своего́ ста́ршего бра́та Серёжу]{.ru}，[Серёжа написа́л письмо́]{.ru}。第 2 题，爸爸说 [С ней ну́жно гуля́ть ка́ждый день, у́тром и ве́чером, а мы рабо́таем с утра́ до ве́чера]{.ru}；妈妈补充的是房子小，没有人说狗贵。第 3 题，推断题：爸爸妈妈只准备了玩具狗，看见小猫时很惊奇，又去看谢廖沙；爸爸妈妈自己也不知道小猫是哪儿来的，所以不是他们送的；严寒老人送礼物只是丽莎的想法。邻居让谢廖沙把小猫抱走，谢廖沙说三十一日来抱，又对爸爸妈妈什么也没说，最后爸爸妈妈看他、他“只是笑”，说明小猫是他放在枞树下的。第 4 题，推断题：爸爸妈妈不养狗的理由是要天天遛、从早到晚上班、房子小，邻居说 [с ней не на́до гуля́ть, и ме́ста ей ну́жно ма́ло]{.ru}，小猫正好没有这两个问题。丽莎要的是狗，没有要过小猫，到最后她也还想要狗；小猫又小又灰是事实，但说明不了它为什么比狗合适。第 5 题，推断题：谢廖沙听到妹妹的愿望不能实现，自己去想办法，悄悄给她弄来一只小猫，可见他很爱妹妹；爸爸妈妈送的是玩具狗，丽莎还不会写字；文中没有说邻居不喜欢自己的猫，她只是给小猫找一个家。
  items:
  - stem: Письмо́ Де́ду Моро́зу написа́л ___.
    options: [па́па, Серёжа, Ли́за, ма́ма]
    answer: Серёжа
  - stem: Роди́тели не хоте́ли соба́ку, потому́ что ___.
    options: [с ней ну́жно гуля́ть ка́ждый день, Ли́за ещё ма́ленькая, соба́ки о́чень дороги́е, у сосе́дки есть ко́шка]
    answer: с ней ну́жно гуля́ть ка́ждый день
  - stem: Котёнок под ёлкой — э́то, наве́рное, пода́рок ___.
    options: [Де́да Моро́за, па́пы, ма́мы, Серёжи]
    answer: Серёжи
  - stem: Для э́той семьи́ котёнок лу́чше, чем соба́ка, потому́ что ___.
    options: [Ли́за проси́ла котёнка, котёнок ма́ленький и се́рый, Ли́за уже́ не хо́чет соба́ку, с ко́шкой не на́до гуля́ть и ей ну́жно ма́ло ме́ста]
    answer: с ко́шкой не на́до гуля́ть и ей ну́жно ма́ло ме́ста
  - stem: Из расска́за мо́жно поня́ть, что ___.
    options: [роди́тели купи́ли Ли́зе соба́ку, Серёжа лю́бит свою́ мла́дшую сестру́, Ли́за уже́ уме́ет писа́ть, Екатери́на Ива́новна не люби́ла свою́ ко́шку]
    answer: Серёжа лю́бит свою́ мла́дшую сестру́
- id: e4
  type: choice
  task: 阅读理解（二）：阅读下面的电话对话，根据内容选出正确答案。
  points: 2.5
  passage: |
    ::: {.prose lang="ru"}
    Три́дцать пе́рвого декабря́, в шесть часо́в ве́чера, Ко́сте позвони́ла ма́ма.
    :::

    ::: {.dialogue lang="ru"}
    [Ко́стя]{.sp} Алло́!

    [Ма́ма]{.sp} Ко́стя, э́то ма́ма. Слу́шай, мне сейча́с звони́л па́па.

    [Ко́стя]{.sp} Он уже́ в самолёте?

    [Ма́ма]{.sp} Нет, он ещё в Новосиби́рске, в аэропорту́. Там идёт си́льный снег, и самолёт опа́здывает на три часа́. Па́па бу́дет до́ма не в во́семь, а в оди́ннадцать.

    [Ко́стя]{.sp} В оди́ннадцать? Но сего́дня три́дцать пе́рвое декабря́!

    [Ма́ма]{.sp} Да. Па́па сказа́л, что о́чень хо́чет встреча́ть Но́вый год до́ма. Наде́юсь, он успе́ет.

    [Ко́стя]{.sp} Ма́ма, мо́жно, я пое́ду в аэропо́рт и бу́ду ждать па́пу там?

    [Ма́ма]{.sp} Нет, Ко́стя. Аэропо́рт далеко́, а па́па возьмёт такси́. Ты мне ну́жен до́ма. Я ещё на рабо́те и бу́ду до́ма че́рез два часа́. Купи́, пожа́луйста, хлеб и сок. И поста́вь ёлку в гости́ной.

    [Ко́стя]{.sp} А сала́т оливье́?

    [Ма́ма]{.sp} Сала́т я пригото́влю сама́, когда́ верну́сь.

    [Ко́стя]{.sp} Хорошо́. Пока́, ма́ма!
    :::

    ::: {.prose lang="ru"}
    Ко́стя купи́л хлеб и сок и поста́вил ёлку. Ма́ма верну́лась, как обеща́ла, и пригото́вила сала́т. В оди́ннадцать часо́в па́пы ещё не́ было, и Ко́стя о́чень волнова́лся. Но в полови́не двена́дцатого в дверь позвони́ли. Э́то был па́па! «Я успе́л!» — сказа́л он.
    :::
  passage_zh: |
    十二月三十一日晚上六点，妈妈给科斯佳打来电话。

    ::: translation
    [科斯佳]{.sp} 喂！

    [妈妈]{.sp} 科斯佳，我是妈妈。听着，爸爸刚才给我打电话了。

    [科斯佳]{.sp} 他已经上飞机了吗？

    [妈妈]{.sp} 没有，他还在新西伯利亚，在机场。那儿下大雪，飞机晚点三个小时。爸爸不是八点到家，要十一点了。

    [科斯佳]{.sp} 十一点？今天可是十二月三十一号啊！

    [妈妈]{.sp} 是啊。爸爸说他很想在家里过新年。希望他来得及。

    [科斯佳]{.sp} 妈妈，我能不能去机场等爸爸？

    [妈妈]{.sp} 不行，科斯佳。机场太远了，爸爸会打车回来。家里需要你。我还在上班，两个小时以后到家。请你去买面包和果汁。再把枞树摆在客厅里。

    [科斯佳]{.sp} 那奥利维耶沙拉呢？

    [妈妈]{.sp} 沙拉等我回去自己做。

    [科斯佳]{.sp} 好。妈妈，回头见！
    :::

    科斯佳买了面包和果汁，摆好了枞树。妈妈按说好的时间回到家，做了沙拉。到了十一点爸爸还没回来，科斯佳非常着急。可是十一点半门铃响了。是爸爸！“我赶上了！”他说。
  why: 第 1 题，妈妈说 [он ещё в Новосиби́рске, в аэропорту́]{.ru}，他还没上飞机。第 2 题，[Там идёт си́льный снег, и самолёт опа́здывает на три часа́]{.ru}，晚点是因为新西伯利亚下大雪，不是爸爸迟到。第 3 题，推断题：妈妈是 [в шесть часо́в ве́чера]{.ru} 打的电话，妈妈说 [бу́ду до́ма че́рез два часа́]{.ru}，六点加两个小时是八点；后面又说她 [верну́лась, как обеща́ла]{.ru}。第 4 题，推断题：爸爸十一点半就到家了，在午夜之前，所以他是在家里和家人一起迎接新年的。第 5 题，与原文不符的说法：科斯佳想去机场，妈妈说 [Нет, Ко́стя]{.ru}，爸爸自己打车回来，科斯佳没去机场；其他三项原文都说了。
