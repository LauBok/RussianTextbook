lesson: K10
heading: 第十套
range: L01-L99
names: [Соко́льники, Ко́стя, Серге́й, Яросла́вль, Ле́на, Ната́ша, Ирку́тск, Байка́л, Сиби́рь, Ли́за, Анто́н, Евге́ний Оне́гин, Евге́ний, Оне́гин, Большо́й теа́тр, Ко́ля, Новосиби́рск, Екатеринбу́рг, Ура́л, Пе́тя, Ша́рик, Ли Мин, Ли, Мин, Чэнь, Ве́ра, Кири́лл, Све́та, Ро́ма, Хаба́ровск, Шереме́тьево, Домоде́дово, Ка́тя, Шанха́й, Ни́на Ива́новна, Ни́на, Ива́новна, Чэнь Цзин, Цзин, Гри́ша]
