    **奶奶学汉语**

    尼娜·彼得罗夫娜六十五岁了。她当了四十年医生，现在不工作了。起初她觉得很闷：儿子和女儿住在别的城市，女朋友们又常常生病，不想出门散步。

    有一天，她的孙女列娜说：“奶奶，你一直想去中国。学汉语吧！”尼娜·彼得罗夫娜笑了：“我？我已经老了！”可是一个星期以后，她已经坐在汉语课的第一堂课上了。

    班上有十个人。别的学员都很年轻，二三十岁。起初尼娜·彼得罗夫娜觉得非常难：她记汉字比谁都慢。可是她每天学习两个小时，上课从来不迟到。一年以后，她成了班上最好的学员。

    现在她有了年轻的朋友。他们常常请她讲语法，她就问他们手机上的短信怎么写。

    今年夏天尼娜·彼得罗夫娜要和列娜一起去北京。列娜不会说汉语，可是她一点儿也不着急。“奶奶，”她说，“现在你可以给我当翻译了！”尼娜·彼得罗夫娜回答：“要是那时候你没跟我说这句话，我现在还坐在家里看电视呢。”
  why: 第 1 题，原文说 [сын и дочь живу́т в друго́м го́роде, а подру́ги ча́сто боле́ют и не хотя́т гуля́ть]{.ru}，选项换了说法：[де́ти живу́т далеко́]{.ru}；她已经不工作了，所以不是工作太多；文中没有说她不喜欢以前的工作。第 2 题，推断题：别的学员二三十岁，她六十五岁，所以她是班上年纪最大的；她是学员，不是老师；列娜没有和她一起学。第 3 题，与原文不符的说法：原文说年轻的学员 [про́сят её объясни́ть грамма́тику]{.ru}，是她给他们讲语法，不是他们给她讲；选项把方向说反了，不细读容易上当。其他三项原文都说了。第 4 题，推断题：列娜自己不会说汉语，却说 [ты бу́дешь мои́м перево́дчиком]{.ru}，她不着急，是因为在北京奶奶能替她说汉语；文中没有说列娜去过北京。第 5 题，主旨题：六十五岁的尼娜·彼得罗夫娜开始学汉语，克服困难成了最好的学员，最后一句又说要是没开始，她现在还坐在家里看电视；全文要说的是学习不怕晚。汉语难、年轻人学得好都只是细节，而且后者和文中的事实相反。
  items:
  - stem: Снача́ла Ни́не Петро́вне бы́ло ску́чно, потому́ что ___.
    options: [у неё бы́ло мно́го рабо́ты, 'её де́ти живу́т далеко́, а подру́ги ча́сто боле́ют', она́ не люби́ла свою́ рабо́ту, у неё не́ было телеви́зора]
    answer: её де́ти живу́т далеко́, а подру́ги ча́сто боле́ют
  - stem: В гру́ппе Ни́на Петро́вна — ___.
    options: [са́мая молода́я, преподава́тель, са́мая ста́ршая, подру́га Ле́ны]
    answer: са́мая ста́ршая
  - stem: 'О Ни́не Петро́вне э́то не так: ___.'
    options: [снача́ла Ни́не Петро́вне бы́ло тру́дно, молоды́е студе́нты объясня́ют ей грамма́тику, она́ занима́лась ка́ждый день, ле́том она́ пое́дет в Пеки́н]
    answer: молоды́е студе́нты объясня́ют ей грамма́тику
  - stem: Ле́на не волну́ется, потому́ что ___.
    options: [она́ уже́ была́ в Пеки́не, она́ хорошо́ говори́т по-кита́йски, в Пеки́не ба́бушка бу́дет говори́ть по-кита́йски, в Пеки́не все говоря́т по-ру́сски]
    answer: в Пеки́не ба́бушка бу́дет говори́ть по-кита́йски
  - stem: Что хо́чет сказа́ть э́тот расска́з?
    options: [Кита́йский язы́к о́чень тру́дный., Учи́ться мо́жно и в шестьдеся́т пять лет., Ба́бушки должны́ жить вме́сте с детьми́., Молоды́е всегда́ у́чатся лу́чше.]
    answer: Учи́ться мо́жно и в шестьдеся́т пять лет.
