    [Ван Лэй]{.sp} Алло́!

    [Ива́н Серге́евич]{.sp} Ван Лэй, э́то ты? Э́то Ива́н Серге́евич. Мари́я Никола́евна до́ма?

    [Ван Лэй]{.sp} Нет, она́ ещё на рабо́те. Она́ сказа́ла, что вернётся в семь.

    [Ива́н Серге́евич]{.sp} Жаль. Тогда́ переда́й ей, пожа́луйста: сего́дня я верну́сь по́здно, в де́вять. У меня́ ва́жная встре́ча с колле́гой из Новосиби́рска. Мы бу́дем у́жинать в рестора́не.

    [Ван Лэй]{.sp} Хорошо́, переда́м.

    [Ива́н Серге́евич]{.sp} И ещё: спроси́ её, купи́ла ли она́ биле́ты на «Щелку́нчик». Е́сли не купи́ла, я куплю́ их за́втра сам.

    [Ван Лэй]{.sp} А на како́е число́?

    [Ива́н Серге́евич]{.sp} На два́дцать восьмо́е декабря́. Э́то суббо́та. Мы пойдём в Большо́й теа́тр все вме́сте, и ты то́же.

    [Ван Лэй]{.sp} Я? Спаси́бо! Я никогда́ не́ был в Большо́м теа́тре.

    [Ива́н Серге́евич]{.sp} Ну вот и пойдёшь. А где Ми́ша? Он сде́лал уро́ки?

    [Ван Лэй]{.sp} Не зна́ю. Он сиди́т в свое́й ко́мнате, и там о́чень ти́хо.

    [Ива́н Серге́евич]{.sp} Ти́хо? Зна́чит, он игра́ет в компью́тер. Скажи́ ему́, что за́втра у него́ контро́льная по матема́тике.

    [Ван Лэй]{.sp} Обяза́тельно скажу́.
    :::

    ::: {.prose lang="ru"}
    В семь часо́в Мари́я Никола́евна верну́лась домо́й. Ван Лэй сказа́л ей, что Ива́н Серге́евич бу́дет до́ма в де́вять и что он бу́дет у́жинать в рестора́не. Пото́м он спроси́л, купи́ла ли она́ биле́ты. «Купи́ла вчера́», — отве́тила Мари́я Никола́евна и показа́ла ему́ биле́ты. Ми́ше Ван Лэй то́же всё сказа́л, и Ми́ша сра́зу сел за уче́бник по матема́тике.
    :::
  passage_zh: |
    ::: translation
    [王磊]{.sp} 喂！

    [伊万·谢尔盖耶维奇]{.sp} 王磊，是你吗？我是伊万·谢尔盖耶维奇。玛丽亚·尼古拉耶夫娜在家吗？

    [王磊]{.sp} 不在，她还在上班。她说七点回来。

    [伊万·谢尔盖耶维奇]{.sp} 真不巧。那请你转告她：我今天回来得晚，九点。我和一位新西伯利亚来的同事有个重要的会面。我们在餐厅吃晚饭。

    [王磊]{.sp} 好，我转告她。

    [伊万·谢尔盖耶维奇]{.sp} 还有：问问她买没买《胡桃夹子》的票。要是没买，我明天自己去买。

    [王磊]{.sp} 是哪天的？

    [伊万·谢尔盖耶维奇]{.sp} 十二月二十八日的。那天是星期六。我们全家一起去大剧院，你也去。

    [王磊]{.sp} 我？谢谢！我从来没去过大剧院。

    [伊万·谢尔盖耶维奇]{.sp} 这回就去了。米沙呢？他做完功课了吗？

    [王磊]{.sp} 不知道。他在自己房间里，里面很安静。

    [伊万·谢尔盖耶维奇]{.sp} 很安静？那就是在玩电脑。告诉他，明天他有数学测验。

    [王磊]{.sp} 我一定告诉他。
    :::

    七点钟玛丽亚·尼古拉耶夫娜回到家。王磊告诉她，伊万·谢尔盖耶维奇九点到家，晚饭在餐厅吃。然后他问她买没买票。“昨天就买了。”玛丽亚·尼古拉耶夫娜回答，把票拿给他看。王磊也把话都转告了米沙，米沙马上坐下来看数学课本。
  why: 第 1 题，[сего́дня я верну́сь по́здно, в де́вять]{.ru}；七点是玛丽亚·尼古拉耶夫娜回家的时间。第 2 题，[У меня́ ва́жная встре́ча с колле́гой из Новосиби́рска]{.ru}，这是他晚回家的原因。第 3 题，推断题：王磊说米沙房间里很安静，爸爸却说 [Зна́чит, он игра́ет в компью́тер]{.ru}，可见爸爸认为米沙没在做功课，而是在玩电脑。第 4 题，推断题：玛丽亚·尼古拉耶夫娜说 [Купи́ла вчера́]{.ru}，还把票拿给王磊看，票在她手里；伊万·谢尔盖耶维奇只是说没买的话他明天去买。第 5 题，与原文不符的说法：王磊说 [Я никогда́ не́ был в Большо́м теа́тре]{.ru}，他没去过大剧院；其他三项原文都说了。
